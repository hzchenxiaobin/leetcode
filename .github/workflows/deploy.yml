name: Deploy Website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'solution/**'
      - 'contest/**'
      - 'topics/**'
      - 'images/**'
      - 'index.md'
      - 'solutions.md'
      - 'contests.md'
      - 'topics.md'
      - 'hot-interview.md'
      - '10-week-plan.md'
      - '.vitepress/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # 4100+ 页单次构建内存超出 runner 上限，按 BATCH_TOTAL 分批并行构建，最后合并产物
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        batch: [0, 1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build batch ${{ matrix.batch }} (VitePress)
        run: npm run build
        env:
          BATCH_INDEX: ${{ matrix.batch }}
          BATCH_TOTAL: 4
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Upload batch artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-batch-${{ matrix.batch }}
          path: dist_${{ matrix.batch }}
          retention-days: 1

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download batch artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-batch-*
          path: batches

      - name: Merge batches
        run: |
          mkdir -p dist
          for d in batches/dist-batch-*/; do cp -r "$d". dist/; done
          # 合并后必须有首页（第 0 批产物），否则说明批次漏了
          test -f dist/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
