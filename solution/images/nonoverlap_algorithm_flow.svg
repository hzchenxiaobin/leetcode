<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：记录首末 → 闭包展开 → 排序贪心</text>

  <!-- ===== Step 1 ===== -->
  <rect x="60" y="46" width="200" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="160" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① 记录首末位置</text>
  <text x="160" y="84" text-anchor="middle" font-size="10" fill="#555">first[c] = c 第一次出现的下标</text>
  <text x="160" y="98" text-anchor="middle" font-size="10" fill="#555">last[c] = c 最后一次出现的下标</text>
  <text x="160" y="110" text-anchor="middle" font-size="9" fill="#888">O(n) 一次遍历</text>

  <!-- arrow 1→2 -->
  <path d="M 160 116 L 160 138" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2 ===== -->
  <rect x="60" y="140" width="200" height="88" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="160" y="160" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">② 闭包展开</text>
  <text x="160" y="178" text-anchor="middle" font-size="10" fill="#555">对每个字符 c：</text>
  <text x="160" y="192" text-anchor="middle" font-size="10" fill="#555">l=first[c], r=last[c]</text>
  <text x="160" y="206" text-anchor="middle" font-size="10" fill="#555">扫描 [l,r]，遇字符 d：</text>
  <text x="160" y="218" text-anchor="middle" font-size="9" fill="#b85450">first[d]&lt;l → 左扩; last[d]&gt;r → 右扩</text>

  <!-- arrow 2→3 -->
  <path d="M 160 228 L 160 250" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3 ===== -->
  <rect x="60" y="252" width="200" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="160" y="272" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">③ 按 (end, -start) 排序</text>
  <text x="160" y="290" text-anchor="middle" font-size="10" fill="#555">右端点升序 → 最大化数量</text>
  <text x="160" y="304" text-anchor="middle" font-size="10" fill="#555">同右端点，左端点降序 → 最短优先</text>
  <text x="160" y="316" text-anchor="middle" font-size="9" fill="#888">O(26 log 26)</text>

  <!-- arrow 3→4 -->
  <path d="M 160 322 L 160 344" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 4 ===== -->
  <rect x="60" y="346" width="200" height="80" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="160" y="366" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">④ 贪心选择不重叠区间</text>
  <text x="160" y="384" text-anchor="middle" font-size="10" fill="#555">lastEnd = -1</text>
  <text x="160" y="398" text-anchor="middle" font-size="10" fill="#555">若 l &gt; lastEnd：选中，更新 lastEnd=r</text>
  <text x="160" y="412" text-anchor="middle" font-size="10" fill="#555">否则跳过</text>
  <text x="160" y="422" text-anchor="middle" font-size="9" fill="#888">O(26) 单遍扫描</text>

  <!-- ===== Right side: example ===== -->
  <rect x="300" y="46" width="240" height="380" fill="#fff" stroke="#ddd" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="420" y="66" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">示例：s = "adefaddaccc"</text>

  <!-- Step 1 result -->
  <text x="315" y="88" font-size="9" fill="#446688" font-weight="bold">① 首末位置：</text>
  <text x="315" y="102" font-size="9" fill="#555">a:[0,7] d:[1,6] e:[2,2]</text>
  <text x="315" y="114" font-size="9" fill="#555">f:[3,3] c:[8,10]</text>

  <!-- Step 2 result -->
  <text x="315" y="136" font-size="9" fill="#d6a040" font-weight="bold">② 闭包区间：</text>
  <rect x="315" y="142" width="80" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="355" y="153" text-anchor="middle" font-size="8" fill="#333">a→[0,7]</text>
  <rect x="400" y="142" width="80" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="440" y="153" text-anchor="middle" font-size="8" fill="#333">d→[0,7]</text>
  <rect x="315" y="160" width="80" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="355" y="171" text-anchor="middle" font-size="8" fill="#333">e→[2,2]</text>
  <rect x="400" y="160" width="80" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="440" y="171" text-anchor="middle" font-size="8" fill="#333">f→[3,3]</text>
  <rect x="315" y="178" width="80" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="355" y="189" text-anchor="middle" font-size="8" fill="#333">c→[8,10]</text>

  <!-- Step 3 result -->
  <text x="315" y="212" font-size="9" fill="#4a7a3a" font-weight="bold">③ 排序后：</text>
  <text x="315" y="226" font-size="9" fill="#555">[2,2] [3,3] [0,7] [8,10]</text>

  <!-- Step 4 result -->
  <text x="315" y="248" font-size="9" fill="#b85450" font-weight="bold">④ 贪心选择：</text>

  <rect x="315" y="256" width="165" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="397" y="269" text-anchor="middle" font-size="9" fill="#333">[2,2] ✓ 选 "e"</text>

  <rect x="315" y="278" width="165" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="397" y="291" text-anchor="middle" font-size="9" fill="#333">[3,3] ✓ 选 "f"</text>

  <rect x="315" y="300" width="165" height="18" fill="#eee" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="397" y="313" text-anchor="middle" font-size="9" fill="#999">[0,7] ✗ 0≤3 跳过</text>

  <rect x="315" y="322" width="165" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="397" y="335" text-anchor="middle" font-size="9" fill="#333">[8,10] ✓ 选 "ccc"</text>

  <!-- Result -->
  <rect x="315" y="352" width="210" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="420" y="372" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">结果：["e", "f", "ccc"]</text>
  <text x="420" y="388" text-anchor="middle" font-size="10" fill="#555">数量 = 3（最大）</text>
  <text x="420" y="402" text-anchor="middle" font-size="10" fill="#555">总长度 = 1+1+3 = 5（最小）</text>
</svg>
