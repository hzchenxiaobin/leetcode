<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">二分查找算法流程（精确匹配 r² == num）</text>

  <!-- Start node -->
  <ellipse cx="280" cy="62" rx="110" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#333">开始: lo=1, hi=num</text>

  <path d="M 280 82 L 280 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: lo <= hi? -->
  <polygon points="280,104 390,150 280,196 170,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="146" text-anchor="middle" font-size="12" fill="#333">lo &lt;= hi ?</text>
  <text x="280" y="162" text-anchor="middle" font-size="11" fill="#666">(搜索区间非空)</text>

  <!-- No branch -> return false -->
  <path d="M 390 150 L 470 150" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="428" y="142" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <ellipse cx="510" cy="150" rx="46" ry="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="510" y="154" text-anchor="middle" font-size="11" fill="#333">返回 false</text>

  <!-- Yes branch down -->
  <path d="M 280 196 L 280 214" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="210" font-size="11" fill="#82b366">是</text>

  <!-- mid computation -->
  <rect x="170" y="218" width="220" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="240" text-anchor="middle" font-size="12" fill="#333">mid = (lo + hi) / 2</text>

  <path d="M 280 252 L 280 270" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Three-way decision: mid*mid vs num -->
  <polygon points="280,274 410,330 280,386 150,330" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="12" fill="#333">mid * mid ? num</text>
  <text x="280" y="338" text-anchor="middle" font-size="11" fill="#666">(三段判定)</text>

  <!-- == branch (right): return true -->
  <path d="M 410 330 L 470 330" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="438" y="322" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">==</text>
  <ellipse cx="510" cy="330" rx="46" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="510" y="334" text-anchor="middle" font-size="11" fill="#333">返回 true</text>

  <!-- < branch (right-down): lo = mid+1 -->
  <path d="M 340 370 L 400 410" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="352" y="396" font-size="12" fill="#4a7a3a" font-weight="bold">&lt;</text>
  <rect x="400" y="398" width="100" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="450" y="416" text-anchor="middle" font-size="11" fill="#333">太小</text>
  <text x="450" y="432" text-anchor="middle" font-size="11" fill="#555">lo = mid+1</text>

  <!-- > branch (left-down): hi = mid-1 -->
  <path d="M 220 370 L 160 410" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="196" y="396" font-size="12" fill="#b85450" font-weight="bold">&gt;</text>
  <rect x="60" y="398" width="100" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="110" y="416" text-anchor="middle" font-size="11" fill="#333">太大</text>
  <text x="110" y="432" text-anchor="middle" font-size="11" fill="#555">hi = mid−1</text>

  <!-- loop back arrows -->
  <path d="M 110 398 L 110 150 L 170 150" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="98" y="278" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 98 278)">继续二分</text>
  <path d="M 450 398 L 450 150 L 390 150" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- summary note -->
  <text x="280" y="464" text-anchor="middle" font-size="11" fill="#888">三段判定：命中即终止返回 true；未命中缩区间继续；区间空则 false。mid*mid 用 long long 防溢出</text>
</svg>
