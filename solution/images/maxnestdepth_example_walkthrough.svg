<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="25" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：seq = "(()())"</text>

  <rect x="30" y="45" width="460" height="28" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="64" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">i</text>
  <text x="140" y="64" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">char</text>
  <text x="230" y="64" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">depth(操作前)</text>
  <text x="340" y="64" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">操作</text>
  <text x="440" y="64" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">answer</text>

  <line x1="100" y1="45" x2="100" y2="255" stroke="#ddd" stroke-width="1"/>
  <line x1="180" y1="45" x2="180" y2="255" stroke="#ddd" stroke-width="1"/>
  <line x1="280" y1="45" x2="280" y2="255" stroke="#ddd" stroke-width="1"/>
  <line x1="390" y1="45" x2="390" y2="255" stroke="#ddd" stroke-width="1"/>

  <text x="70" y="85" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="140" y="85" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">(</text>
  <text x="230" y="85" text-anchor="middle" font-size="11" fill="#666">0</text>
  <text x="340" y="85" text-anchor="middle" font-size="11" fill="#4a7a3a">depth++ → 1</text>
  <rect x="425" y="72" width="30" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="440" y="86" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>

  <text x="70" y="115" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="140" y="115" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">(</text>
  <text x="230" y="115" text-anchor="middle" font-size="11" fill="#666">1</text>
  <text x="340" y="115" text-anchor="middle" font-size="11" fill="#4a7a3a">depth++ → 2</text>
  <rect x="425" y="102" width="30" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="440" y="116" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>

  <text x="70" y="145" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="140" y="145" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">)</text>
  <text x="230" y="145" text-anchor="middle" font-size="11" fill="#666">2</text>
  <text x="340" y="145" text-anchor="middle" font-size="11" fill="#b85450">用 depth=2 → depth--</text>
  <rect x="425" y="132" width="30" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="440" y="146" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>

  <text x="70" y="175" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="140" y="175" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">(</text>
  <text x="230" y="175" text-anchor="middle" font-size="11" fill="#666">1</text>
  <text x="340" y="175" text-anchor="middle" font-size="11" fill="#4a7a3a">depth++ → 2</text>
  <rect x="425" y="162" width="30" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="440" y="176" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>

  <text x="70" y="205" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="140" y="205" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">)</text>
  <text x="230" y="205" text-anchor="middle" font-size="11" fill="#666">2</text>
  <text x="340" y="205" text-anchor="middle" font-size="11" fill="#b85450">用 depth=2 → depth--</text>
  <rect x="425" y="192" width="30" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="440" y="206" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>

  <text x="70" y="235" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="140" y="235" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">)</text>
  <text x="230" y="235" text-anchor="middle" font-size="11" fill="#666">1</text>
  <text x="340" y="235" text-anchor="middle" font-size="11" fill="#b85450">用 depth=1 → depth--</text>
  <rect x="425" y="222" width="30" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="440" y="236" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>

  <path d="M 30 258 Q 260 256 490 258" stroke="#ddd" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <text x="50" y="285" font-size="12" fill="#446688" font-weight="bold">A (answer=0):</text>
  <rect x="155" y="272" width="30" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="288" text-anchor="middle" font-size="13" fill="#333">(</text>
  <rect x="195" y="272" width="30" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="288" text-anchor="middle" font-size="13" fill="#333">)</text>
  <text x="240" y="288" font-size="11" fill="#666">→ "()"  depth(A) = 1</text>

  <text x="50" y="325" font-size="12" fill="#4a7a3a" font-weight="bold">B (answer=1):</text>
  <rect x="155" y="312" width="28" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="169" y="328" text-anchor="middle" font-size="13" fill="#333">(</text>
  <rect x="193" y="312" width="28" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="207" y="328" text-anchor="middle" font-size="13" fill="#333">)</text>
  <rect x="231" y="312" width="28" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="245" y="328" text-anchor="middle" font-size="13" fill="#333">(</text>
  <rect x="269" y="312" width="28" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="283" y="328" text-anchor="middle" font-size="13" fill="#333">)</text>
  <text x="310" y="328" font-size="11" fill="#666">→ "()()"  depth(B) = 1</text>

  <rect x="100" y="355" width="320" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="377" text-anchor="middle" font-size="12" fill="#444">max(1, 1) = 1 = ⌈2/2⌉ ✓</text>
</svg>
