<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：words = ["a","b","c","ab","bc","abc"], s = "abc"</text>

  <!-- s cells -->
  <text x="40" y="58" font-size="11" fill="#888">s =</text>
  <rect x="80" y="42" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="102" y="63" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="124" y="42" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="146" y="63" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>
  <rect x="168" y="42" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="63" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">c</text>

  <!-- prefix set -->
  <text x="240" y="58" font-size="11" fill="#888">P =</text>
  <rect x="270" y="42" width="160" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="350" y="63" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">{"a", "ab", "abc"}</text>

  <!-- Steps table header -->
  <text x="40" y="104" font-size="12" fill="#444" font-weight="bold">步骤</text>
  <text x="110" y="104" font-size="12" fill="#444" font-weight="bold">word</text>
  <text x="220" y="104" font-size="12" fill="#444" font-weight="bold">判定</text>
  <text x="360" y="104" font-size="12" fill="#444" font-weight="bold">是否在 P</text>
  <text x="490" y="104" font-size="12" fill="#444" font-weight="bold">ans</text>

  <line x1="30" y1="112" x2="560" y2="112" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Step 1: a -> hit -->
  <text x="40" y="134" font-size="11" fill="#333">1</text>
  <rect x="100" y="120" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="122" y="137" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"a"</text>
  <text x="220" y="137" font-size="11" fill="#666">s[:1]="a" == "a"</text>
  <text x="360" y="137" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 命中</text>
  <text x="490" y="137" font-size="11" fill="#333" font-weight="bold">1</text>

  <!-- Step 2: b -> miss -->
  <text x="40" y="162" font-size="11" fill="#333">2</text>
  <rect x="100" y="148" width="44" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="122" y="165" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"b"</text>
  <text x="220" y="165" font-size="11" fill="#666">s[:1]="a" ≠ "b"</text>
  <text x="360" y="165" font-size="11" fill="#b85450" font-weight="bold">✗ 不在</text>
  <text x="490" y="165" font-size="11" fill="#333">1</text>

  <!-- Step 3: c -> miss -->
  <text x="40" y="190" font-size="11" fill="#333">3</text>
  <rect x="100" y="176" width="44" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="122" y="193" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"c"</text>
  <text x="220" y="193" font-size="11" fill="#666">s[:1]="a" ≠ "c"</text>
  <text x="360" y="193" font-size="11" fill="#b85450" font-weight="bold">✗ 不在</text>
  <text x="490" y="193" font-size="11" fill="#333">1</text>

  <!-- Step 4: ab -> hit -->
  <text x="40" y="218" font-size="11" fill="#333">4</text>
  <rect x="100" y="204" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="122" y="221" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"ab"</text>
  <text x="220" y="221" font-size="11" fill="#666">s[:2]="ab" == "ab"</text>
  <text x="360" y="221" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 命中</text>
  <text x="490" y="221" font-size="11" fill="#333" font-weight="bold">2</text>

  <!-- Step 5: bc -> miss -->
  <text x="40" y="246" font-size="11" fill="#333">5</text>
  <rect x="100" y="232" width="44" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="122" y="249" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"bc"</text>
  <text x="220" y="249" font-size="11" fill="#666">s[:2]="ab" ≠ "bc"</text>
  <text x="360" y="249" font-size="11" fill="#b85450" font-weight="bold">✗ 不在</text>
  <text x="490" y="249" font-size="11" fill="#333">2</text>

  <!-- Step 6: abc -> hit -->
  <text x="40" y="274" font-size="11" fill="#333">6</text>
  <rect x="100" y="260" width="50" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="125" y="277" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"abc"</text>
  <text x="220" y="277" font-size="11" fill="#666">s[:3]="abc" == "abc"</text>
  <text x="360" y="277" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 命中</text>
  <text x="490" y="277" font-size="11" fill="#333" font-weight="bold">3 ⭐</text>

  <line x1="30" y1="294" x2="560" y2="294" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- result box -->
  <rect x="60" y="312" width="460" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="334" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">答案 = 3（"a"、"ab"、"abc" 三词命中）</text>
  <text x="290" y="352" text-anchor="middle" font-size="11" fill="#888">"b"、"c"、"bc" 虽是 s 的子串，但不在开头，不计入</text>

  <!-- legend -->
  <rect x="60" y="376" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="80" y="387" font-size="11" fill="#555">命中（是前缀）</text>
  <rect x="190" y="376" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="210" y="387" font-size="11" fill="#555">未命中（非前缀）</text>
  <text x="340" y="387" font-size="11" fill="#888">⭐ = 最终答案</text>
</svg>
