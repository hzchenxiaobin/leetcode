<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M 0 0 L 4 8 L 8 0 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：合法棋盘必须同时满足三条不变式</text>

  <!-- 不变式 1：轮次 -->
  <rect x="30" y="44" width="500" height="78" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="48" y="66" font-size="13" fill="#446688" font-weight="bold">不变式① 轮次交替</text>
  <text x="48" y="86" font-size="12" fill="#333">X 先手且双方轮流落子 →</text>
  <text x="48" y="106" font-size="12" fill="#333" font-weight="bold">xCount == oCount   或   xCount == oCount + 1</text>
  <rect x="340" y="56" width="60" height="40" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="370" y="82" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">X X X</text>
  <text x="416" y="80" font-size="14" fill="#666">→</text>
  <text x="448" y="80" font-size="11" fill="#888">刚轮到 X</text>
  <text x="448" y="96" font-size="11" fill="#888">落子结束</text>

  <!-- 不变式 2：不可双赢 -->
  <rect x="30" y="132" width="500" height="78" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="48" y="154" font-size="13" fill="#b85450" font-weight="bold">不变式② 不可同时获胜</text>
  <text x="48" y="174" font-size="12" fill="#333">先获胜者立刻终结游戏 →</text>
  <text x="48" y="194" font-size="12" fill="#333" font-weight="bold">X 与 O 不可能同时连成三子</text>
  <rect x="340" y="144" width="60" height="30" fill="#fff" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="370" y="164" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">X 三连</text>
  <text x="410" y="160" font-size="13" fill="#b85450" font-weight="bold">+</text>
  <rect x="424" y="144" width="60" height="30" fill="#fff" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="454" y="164" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">O 三连</text>
  <text x="492" y="164" font-size="11" fill="#b85450" font-weight="bold">✗</text>

  <!-- 不变式 3：获胜方对应轮次 -->
  <rect x="30" y="220" width="500" height="88" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="48" y="242" font-size="13" fill="#d6a040" font-weight="bold">不变式③ 获胜方 = 刚落子方</text>
  <text x="48" y="262" font-size="12" fill="#333">终结局面的那一手必属获胜方 →</text>
  <text x="48" y="284" font-size="12" fill="#333" font-weight="bold">X 胜 ⇒ xCount == oCount + 1</text>
  <text x="48" y="302" font-size="12" fill="#333" font-weight="bold">O 胜 ⇒ xCount == oCount</text>

  <text x="280" y="338" text-anchor="middle" font-size="11" fill="#888">三条不变式全部成立 ⇔ 棋盘是某个合法对局的局面</text>
</svg>
