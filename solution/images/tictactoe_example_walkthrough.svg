<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="13" result="n2"/>
      <feDisplacementMap in="SourceGraphic" in2="n2" scale="1.3"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="980" height="620" fill="#fdfcf7"/>
  <text x="490" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：n=3，7 步落子至玩家 1 获胜</text>
  <path d="M 290 44 Q 490 52 690 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- column headers: step / move / board / rows / cols / diag / anti / return -->
  <g font-size="11" font-weight="bold" fill="#5a5a5a" filter="url(#sk2)">
    <text x="40"  y="80">#</text>
    <text x="80"  y="80">move</text>
    <text x="180" y="80">棋盘</text>
    <text x="430" y="80">rows</text>
    <text x="560" y="80">cols</text>
    <text x="690" y="80">diag</text>
    <text x="780" y="80">anti</text>
    <text x="870" y="80">ret</text>
  </g>
  <line x1="30" y1="88" x2="950" y2="88" stroke="#bbb" stroke-width="1" filter="url(#sk)"/>

  <!-- helper: each row draws a tiny 3x3 board + counter values -->
  <!-- Step 1: move(0,0,1) -->
  <g filter="url(#sk2)">
    <text x="40"  y="140" font-size="11" fill="#555">1</text>
    <text x="80"  y="140" font-size="11" fill="#2b6e9e" font-weight="bold">(0,0,1)</text>
    <!-- mini board 3x3: 60x60 -->
    <g filter="url(#sk)">
      <rect x="180" y="106" width="90" height="90" rx="4" fill="#fff" stroke="#4a8edb" stroke-width="1.2"/>
      <line x1="210" y1="106" x2="210" y2="196" stroke="#4a8edb" stroke-width="1"/>
      <line x1="240" y1="106" x2="240" y2="196" stroke="#4a8edb" stroke-width="1"/>
      <line x1="180" y1="136" x2="270" y2="136" stroke="#4a8edb" stroke-width="1"/>
      <line x1="180" y1="166" x2="270" y2="166" stroke="#4a8edb" stroke-width="1"/>
    </g>
    <text x="195" y="130" font-size="16" font-weight="bold" fill="#2b6e9e" filter="url(#sk2)">X</text>
    <!-- rows [1,0,0] -->
    <text x="430" y="140" font-size="11" fill="#333">[1, 0, 0]</text>
    <text x="560" y="140" font-size="11" fill="#333">[1, 0, 0]</text>
    <text x="690" y="140" font-size="11" fill="#2e6e2e" font-weight="bold">1</text>
    <text x="780" y="140" font-size="11" fill="#333">0</text>
    <text x="870" y="140" font-size="11" fill="#888">0</text>
  </g>

  <!-- Step 2: move(0,2,2) -->
  <g filter="url(#sk2)">
    <text x="40"  y="200" font-size="11" fill="#555">2</text>
    <text x="80"  y="200" font-size="11" fill="#c98a2b" font-weight="bold">(0,2,2)</text>
    <g filter="url(#sk)">
      <rect x="180" y="166" width="90" height="90" rx="4" fill="#fff" stroke="#4a8edb" stroke-width="1.2"/>
      <line x1="210" y1="166" x2="210" y2="256" stroke="#4a8edb" stroke-width="1"/>
      <line x1="240" y1="166" x2="240" y2="256" stroke="#4a8edb" stroke-width="1"/>
      <line x1="180" y1="196" x2="270" y2="196" stroke="#4a8edb" stroke-width="1"/>
      <line x1="180" y1="226" x2="270" y2="226" stroke="#4a8edb" stroke-width="1"/>
    </g>
    <text x="195" y="190" font-size="16" font-weight="bold" fill="#2b6e9e" filter="url(#sk2)">X</text>
    <text x="255" y="190" font-size="16" font-weight="bold" fill="#c98a2b" filter="url(#sk2)">O</text>
    <text x="430" y="200" font-size="11" fill="#333">[0, 0, 0]</text>
    <text x="560" y="200" font-size="11" fill="#333">[1, 0, −1]</text>
    <text x="690" y="200" font-size="11" fill="#333">1</text>
    <text x="780" y="200" font-size="11" fill="#c98a2b" font-weight="bold">−1</text>
    <text x="870" y="200" font-size="11" fill="#888">0</text>
  </g>

  <!-- Step 3: move(2,2,1) -->
  <g filter="url(#sk2)">
    <text x="40"  y="260" font-size="11" fill="#555">3</text>
    <text x="80"  y="260" font-size="11" fill="#2b6e9e" font-weight="bold">(2,2,1)</text>
    <g filter="url(#sk)">
      <rect x="180" y="226" width="90" height="90" rx="4" fill="#fff" stroke="#4a8edb" stroke-width="1.2"/>
      <line x1="210" y1="226" x2="210" y2="316" stroke="#4a8edb" stroke-width="1"/>
      <line x1="240" y1="226" x2="240" y2="316" stroke="#4a8edb" stroke-width="1"/>
      <line x1="180" y1="256" x2="270" y2="256" stroke="#4a8edb" stroke-width="1"/>
      <line x1="180" y1="286" x2="270" y2="286" stroke="#4a8edb" stroke-width="1"/>
    </g>
    <text x="195" y="250" font-size="16" font-weight="bold" fill="#2b6e9e" filter="url(#sk2)">X</text>
    <text x="255" y="250" font-size="16" font-weight="bold" fill="#c98a2b" filter="url(#sk2)">O</text>
    <text x="255" y="310" font-size="16" font-weight="bold" fill="#2b6e9e" filter="url(#sk2)">X</text>
    <text x="430" y="260" font-size="11" fill="#333">[0, 0, 1]</text>
    <text x="560" y="260" font-size="11" fill="#333">[1, 0, 0]</text>
    <text x="690" y="260" font-size="11" fill="#2e6e2e" font-weight="bold">2</text>
    <text x="780" y="260" font-size="11" fill="#333">−1</text>
    <text x="870" y="260" font-size="11" fill="#888">0</text>
  </g>

  <!-- Step 4: move(1,1,2) -->
  <g filter="url(#sk2)">
    <text x="40"  y="320" font-size="11" fill="#555">4</text>
    <text x="80"  y="320" font-size="11" fill="#c98a2b" font-weight="bold">(1,1,2)</text>
    <g filter="url(#sk)">
      <rect x="180" y="286" width="90" height="90" rx="4" fill="#fff" stroke="#4a8edb" stroke-width="1.2"/>
      <line x1="210" y1="286" x2="210" y2="376" stroke="#4a8edb" stroke-width="1"/>
      <line x1="240" y1="286" x2="240" y2="376" stroke="#4a8edb" stroke-width="1"/>
      <line x1="180" y1="316" x2="270" y2="316" stroke="#4a8edb" stroke-width="1"/>
      <line x1="180" y1="346" x2="270" y2="346" stroke="#4a8edb" stroke-width="1"/>
    </g>
    <text x="195" y="310" font-size="16" font-weight="bold" fill="#2b6e9e" filter="url(#sk2)">X</text>
    <text x="255" y="310" font-size="16" font-weight="bold" fill="#c98a2b" filter="url(#sk2)">O</text>
    <text x="225" y="340" font-size="16" font-weight="bold" fill="#c98a2b" filter="url(#sk2)">O</text>
    <text x="255" y="370" font-size="16" font-weight="bold" fill="#2b6e9e" filter="url(#sk2)">X</text>
    <text x="430" y="320" font-size="11" fill="#333">[0, −1, 1]</text>
    <text x="560" y="320" font-size="11" fill="#333">[1, −1, 0]</text>
    <text x="690" y="320" font-size="11" fill="#333">1</text>
    <text x="780" y="320" font-size="11" fill="#c98a2b" font-weight="bold">−2</text>
    <text x="870" y="320" font-size="11" fill="#888">0</text>
  </g>

  <!-- Step 5: move(2,0,1) -->
  <g filter="url(#sk2)">
    <text x="40"  y="380" font-size="11" fill="#555">5</text>
    <text x="80"  y="380" font-size="11" fill="#2b6e9e" font-weight="bold">(2,0,1)</text>
    <g filter="url(#sk)">
      <rect x="180" y="346" width="90" height="90" rx="4" fill="#fff" stroke="#4a8edb" stroke-width="1.2"/>
      <line x1="210" y1="346" x2="210" y2="436" stroke="#4a8edb" stroke-width="1"/>
      <line x1="240" y1="346" x2="240" y2="436" stroke="#4a8edb" stroke-width="1"/>
      <line x1="180" y1="376" x2="270" y2="376" stroke="#4a8edb" stroke-width="1"/>
      <line x1="180" y1="406" x2="270" y2="406" stroke="#4a8edb" stroke-width="1"/>
    </g>
    <text x="195" y="370" font-size="16" font-weight="bold" fill="#2b6e9e" filter="url(#sk2)">X</text>
    <text x="255" y="370" font-size="16" font-weight="bold" fill="#c98a2b" filter="url(#sk2)">O</text>
    <text x="225" y="400" font-size="16" font-weight="bold" fill="#c98a2b" filter="url(#sk2)">O</text>
    <text x="195" y="430" font-size="16" font-weight="bold" fill="#2b6e9e" filter="url(#sk2)">X</text>
    <text x="255" y="430" font-size="16" font-weight="bold" fill="#2b6e9e" filter="url(#sk2)">X</text>
    <text x="430" y="380" font-size="11" fill="#333">[0, −1, 2]</text>
    <text x="560" y="380" font-size="11" fill="#333">[2, −1, 0]</text>
    <text x="690" y="380" font-size="11" fill="#333">1</text>
    <text x="780" y="380" font-size="11" fill="#333">−1</text>
    <text x="870" y="380" font-size="11" fill="#888">0</text>
  </g>

  <!-- Step 6: move(1,0,2) -->
  <g filter="url(#sk2)">
    <text x="40"  y="440" font-size="11" fill="#555">6</text>
    <text x="80"  y="440" font-size="11" fill="#c98a2b" font-weight="bold">(1,0,2)</text>
    <g filter="url(#sk)">
      <rect x="180" y="406" width="90" height="90" rx="4" fill="#fff" stroke="#4a8edb" stroke-width="1.2"/>
      <line x1="210" y1="406" x2="210" y2="496" stroke="#4a8edb" stroke-width="1"/>
      <line x1="240" y1="406" x2="240" y2="496" stroke="#4a8edb" stroke-width="1"/>
      <line x1="180" y1="436" x2="270" y2="436" stroke="#4a8edb" stroke-width="1"/>
      <line x1="180" y1="466" x2="270" y2="466" stroke="#4a8edb" stroke-width="1"/>
    </g>
    <text x="195" y="430" font-size="16" font-weight="bold" fill="#2b6e9e" filter="url(#sk2)">X</text>
    <text x="255" y="430" font-size="16" font-weight="bold" fill="#c98a2b" filter="url(#sk2)">O</text>
    <text x="195" y="460" font-size="16" font-weight="bold" fill="#c98a2b" filter="url(#sk2)">O</text>
    <text x="225" y="460" font-size="16" font-weight="bold" fill="#c98a2b" filter="url(#sk2)">O</text>
    <text x="195" y="490" font-size="16" font-weight="bold" fill="#2b6e9e" filter="url(#sk2)">X</text>
    <text x="255" y="490" font-size="16" font-weight="bold" fill="#2b6e9e" filter="url(#sk2)">X</text>
    <text x="430" y="440" font-size="11" fill="#333">[0, −2, 2]</text>
    <text x="560" y="440" font-size="11" fill="#333">[1, −1, 0]</text>
    <text x="690" y="440" font-size="11" fill="#333">1</text>
    <text x="780" y="440" font-size="11" fill="#333">−1</text>
    <text x="870" y="440" font-size="11" fill="#888">0</text>
  </g>

  <!-- Step 7: move(2,1,1) -> WIN -->
  <g filter="url(#sk2)">
    <text x="40"  y="500" font-size="11" fill="#b03a3a" font-weight="bold">7</text>
    <text x="80"  y="500" font-size="11" fill="#2b6e9e" font-weight="bold">(2,1,1)</text>
    <g filter="url(#sk)">
      <rect x="180" y="466" width="90" height="90" rx="4" fill="#fff" stroke="#b85450" stroke-width="2"/>
      <line x1="210" y1="466" x2="210" y2="556" stroke="#4a8edb" stroke-width="1"/>
      <line x1="240" y1="466" x2="240" y2="556" stroke="#4a8edb" stroke-width="1"/>
      <line x1="180" y1="496" x2="270" y2="496" stroke="#4a8edb" stroke-width="1"/>
      <line x1="180" y1="526" x2="270" y2="526" stroke="#4a8edb" stroke-width="1"/>
    </g>
    <text x="195" y="490" font-size="16" font-weight="bold" fill="#2b6e9e" filter="url(#sk2)">X</text>
    <text x="255" y="490" font-size="16" font-weight="bold" fill="#c98a2b" filter="url(#sk2)">O</text>
    <text x="195" y="520" font-size="16" font-weight="bold" fill="#c98a2b" filter="url(#sk2)">O</text>
    <text x="225" y="520" font-size="16" font-weight="bold" fill="#c98a2b" filter="url(#sk2)">O</text>
    <text x="195" y="550" font-size="16" font-weight="bold" fill="#2b6e9e" filter="url(#sk2)">X</text>
    <text x="225" y="550" font-size="16" font-weight="bold" fill="#2b6e9e" filter="url(#sk2)">X</text>
    <text x="255" y="550" font-size="16" font-weight="bold" fill="#2b6e9e" filter="url(#sk2)">X</text>
    <!-- highlight winning row -->
    <g filter="url(#sk)"><rect x="182" y="528" width="86" height="28" rx="4" fill="none" stroke="#b85450" stroke-width="2.2" stroke-dasharray="5 3"/></g>
    <!-- counters -->
    <text x="430" y="500" font-size="11" fill="#b03a3a" font-weight="bold">[0, −2, 3]</text>
    <text x="560" y="500" font-size="11" fill="#333">[1, 0, 0]</text>
    <text x="690" y="500" font-size="11" fill="#333">1</text>
    <text x="780" y="500" font-size="11" fill="#333">−1</text>
    <text x="870" y="500" font-size="11" fill="#b03a3a" font-weight="bold">1</text>
  </g>

  <!-- highlight the winning counter -->
  <g filter="url(#sk)"><rect x="412" y="488" width="80" height="22" rx="4" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="4 3"/></g>
  <text x="452" y="528" text-anchor="middle" font-size="10" fill="#b03a3a" font-weight="bold">rows[2]=3</text>
  <text x="452" y="542" text-anchor="middle" font-size="10" fill="#b03a3a">|3|==n → 胜</text>

  <!-- footnote -->
  <text x="490" y="600" text-anchor="middle" font-size="11" fill="#5a5a5a">每步只更新 ≤ 4 个计数器；第 7 步 rows[2] 从 2 → 3，绝对值达 n，玩家 1 以第 2 行三连获胜。</text>
</svg>
