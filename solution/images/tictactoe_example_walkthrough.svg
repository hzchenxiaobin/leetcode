<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M 0 0 L 4 8 L 8 0 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：两组非法 + 一组合法</text>

  <!-- 示例 1: 非法 轮次 -->
  <text x="30" y="52" font-size="12" fill="#b85450" font-weight="bold">① ["O  ","   ","   "] → false</text>
  <g filter="url(#rough2)">
    <rect x="40" y="60" width="36" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="58" y="84" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">O</text>
    <rect x="76" y="60" width="36" height="36" fill="#fff" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="112" y="60" width="36" height="36" fill="#fff" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="40" y="96" width="36" height="36" fill="#fff" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="76" y="96" width="36" height="36" fill="#fff" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="112" y="96" width="36" height="36" fill="#fff" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="40" y="132" width="36" height="36" fill="#fff" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="76" y="132" width="36" height="36" fill="#fff" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="112" y="132" width="36" height="36" fill="#fff" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <text x="170" y="78" font-size="11" fill="#333">xCount = 0, oCount = 1</text>
  <text x="170" y="96" font-size="11" fill="#b85450" font-weight="bold">✗ 违反不变式①</text>
  <text x="170" y="114" font-size="11" fill="#888">X 先手，O 数量不应超过 X</text>

  <!-- 示例 2: 非法 双赢 -->
  <text x="30" y="200" font-size="12" fill="#b85450" font-weight="bold">② ["XXX","   ","OOO"] → false</text>
  <g filter="url(#rough2)">
    <rect x="40" y="208" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="58" y="232" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">X</text>
    <rect x="76" y="208" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="94" y="232" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">X</text>
    <rect x="112" y="208" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="130" y="232" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">X</text>
    <rect x="40" y="244" width="36" height="36" fill="#fff" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="76" y="244" width="36" height="36" fill="#fff" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="112" y="244" width="36" height="36" fill="#fff" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="40" y="280" width="36" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="58" y="304" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">O</text>
    <rect x="76" y="280" width="36" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="94" y="304" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">O</text>
    <rect x="112" y="280" width="36" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="130" y="304" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">O</text>
  </g>
  <text x="170" y="226" font-size="11" fill="#333">xCount = 3, oCount = 3（轮次合法）</text>
  <text x="170" y="244" font-size="11" fill="#333">xWin = ✓ 且 oWin = ✓</text>
  <text x="170" y="262" font-size="11" fill="#b85450" font-weight="bold">✗ 违反不变式②</text>
  <text x="170" y="280" font-size="11" fill="#888">X 先三连即终结，O 无机会补三连</text>

  <!-- 示例 3: 合法 X 胜 -->
  <text x="30" y="348" font-size="12" fill="#4a7a3a" font-weight="bold">③ ["XOX","OXO","XOX"] → true</text>
  <g filter="url(#rough2)">
    <rect x="40" y="356" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="58" y="380" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">X</text>
    <rect x="76" y="356" width="36" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="94" y="380" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">O</text>
    <rect x="112" y="356" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="130" y="380" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">X</text>
    <rect x="40" y="392" width="36" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="58" y="416" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">O</text>
    <rect x="76" y="392" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="94" y="416" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">X</text>
    <rect x="112" y="392" width="36" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="130" y="416" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">O</text>
    <rect x="40" y="428" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="58" y="452" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">X</text>
    <rect x="76" y="428" width="36" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="94" y="452" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">O</text>
    <rect x="112" y="428" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="130" y="452" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">X</text>
    <path d="M 44 360 L 144 460" stroke="#d6a040" stroke-width="2.5" fill="none" filter="url(#rough2)"/>
  </g>
  <text x="170" y="374" font-size="11" fill="#333">xCount = 5, oCount = 4（差 1 ✓）</text>
  <text x="170" y="392" font-size="11" fill="#333">主对角线 X-X-X → xWin = ✓</text>
  <text x="170" y="410" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 满足不变式③</text>
  <text x="170" y="428" font-size="11" fill="#888">X 胜 ⇒ xCount == oCount + 1</text>

  <text x="320" y="52" font-size="10" fill="#888">图例</text>
  <rect x="320" y="60" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="340" y="72" font-size="10" fill="#666">X 的格子</text>
  <rect x="320" y="80" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="340" y="92" font-size="10" fill="#666">O 的格子</text>
  <rect x="320" y="100" width="14" height="14" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="340" y="112" font-size="10" fill="#666">空格</text>
</svg>
