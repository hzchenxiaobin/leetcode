<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：nums = [2,10,6,4,8,12] → sorted [2,4,6,8,10,12]</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888">候选 k 从 (nums[j]−2)/2 枚举：k=1 成功 ✓，k=2 失败 ✗</text>

  <!-- ===== Panel 1: k=1 success ===== -->
  <rect x="30" y="54" width="460" height="150" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="48" y="74" font-size="11.5" fill="#4a7a3a" font-weight="bold">k = 1（2k = 2）✓ 成功</text>
  <text x="48" y="88" font-size="10" fill="#555">最小剩余值必为 lower，找 v+2k 搭档</text>

  <!-- Step 1 -->
  <text x="48" y="108" font-size="10.5" fill="#333" font-weight="bold">① v=2 → 搭档 4，arr += 3</text>
  <rect x="180" y="96" width="30" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="195" y="111" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">2</text>
  <text x="218" y="111" font-size="10" fill="#888">+</text>
  <rect x="228" y="96" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="243" y="111" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="270" y="111" font-size="10" fill="#555">⇒ arr[i] = 3</text>

  <!-- Step 2 -->
  <text x="48" y="138" font-size="10.5" fill="#333" font-weight="bold">② v=6 → 搭档 8，arr += 7</text>
  <rect x="180" y="126" width="30" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="195" y="141" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">6</text>
  <text x="218" y="141" font-size="10" fill="#888">+</text>
  <rect x="228" y="126" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="243" y="141" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">8</text>
  <text x="270" y="141" font-size="10" fill="#555">⇒ arr[i] = 7</text>

  <!-- Step 3 -->
  <text x="48" y="168" font-size="10.5" fill="#333" font-weight="bold">③ v=10 → 搭档 12，arr += 11</text>
  <rect x="180" y="156" width="30" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="195" y="171" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">10</text>
  <text x="218" y="171" font-size="10" fill="#888">+</text>
  <rect x="228" y="156" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="243" y="171" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">12</text>
  <text x="270" y="171" font-size="10" fill="#555">⇒ arr[i] = 11</text>

  <!-- result -->
  <text x="48" y="194" font-size="11" fill="#4a7a3a" font-weight="bold">配对数 = 3 = n ✓ 返回 arr = [3, 7, 11]</text>

  <!-- ===== Panel 2: k=2 fail ===== -->
  <rect x="30" y="214" width="460" height="142" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="48" y="234" font-size="11.5" fill="#b85450" font-weight="bold">k = 2（2k = 4）✗ 失败</text>
  <text x="48" y="248" font-size="10" fill="#555">贪心照样执行，直到某 v 找不到 v+2k 搭档</text>

  <!-- Step 1 -->
  <text x="48" y="268" font-size="10.5" fill="#333" font-weight="bold">① v=2 → 搭档 6，arr += 4</text>
  <rect x="180" y="256" width="30" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="195" y="271" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">2</text>
  <text x="218" y="271" font-size="10" fill="#888">+</text>
  <rect x="228" y="256" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="243" y="271" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">6</text>
  <text x="270" y="271" font-size="10" fill="#555">⇒ arr[i] = 4</text>

  <!-- Step 2 -->
  <text x="48" y="298" font-size="10.5" fill="#333" font-weight="bold">② v=4 → 搭档 8，arr += 6</text>
  <rect x="180" y="286" width="30" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="195" y="301" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">4</text>
  <text x="218" y="301" font-size="10" fill="#888">+</text>
  <rect x="228" y="286" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="243" y="301" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">8</text>
  <text x="270" y="301" font-size="10" fill="#555">⇒ arr[i] = 6</text>

  <!-- Step 3 fail -->
  <text x="48" y="328" font-size="10.5" fill="#b85450" font-weight="bold">③ v=10 → 需 14，不在 nums ✗</text>
  <rect x="180" y="316" width="30" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="195" y="331" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">10</text>
  <text x="218" y="331" font-size="10" fill="#888">+</text>
  <rect x="228" y="316" width="30" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="243" y="331" text-anchor="middle" font-size="10.5" fill="#bbb" font-weight="bold">14</text>
  <text x="270" y="331" font-size="10" fill="#b85450" font-weight="bold">⇒ 找不到，此 k 失败</text>

  <!-- result fail -->
  <text x="48" y="350" font-size="11" fill="#b85450" font-weight="bold">仅配 2 对 &lt; n=3 ✗ 舍弃，换下一候选 k</text>

  <!-- Footer -->
  <text x="260" y="372" text-anchor="middle" font-size="10" fill="#aaa">最小剩余值恒为 lower 的贪心选择保证：成功时配对唯一且正确</text>
</svg>
