<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：A=[1,3,5,4], B=[1,2,3,7]  →  答案 1</text>

  <!-- ===== table header ===== -->
  <rect x="40" y="48" width="60" height="28" fill="#f0f0f0" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="66" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">i</text>
  <rect x="100" y="48" width="80" height="28" fill="#f0f0f0" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="140" y="66" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">A[i−1],A[i]</text>
  <rect x="180" y="48" width="80" height="28" fill="#f0f0f0" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="220" y="66" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">B[i−1],B[i]</text>
  <rect x="260" y="48" width="70" height="28" fill="#f0f0f0" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="295" y="66" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">same / cross</text>
  <rect x="330" y="48" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="370" y="66" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">keep</text>
  <rect x="410" y="48" width="80" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="450" y="66" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">swap</text>

  <!-- ===== row i=0 (base) ===== -->
  <rect x="40" y="78" width="60" height="34" fill="#fff" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="100" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="100" y="78" width="80" height="34" fill="#fff" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="140" y="100" text-anchor="middle" font-size="10" fill="#888">—</text>
  <rect x="180" y="78" width="80" height="34" fill="#fff" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="220" y="100" text-anchor="middle" font-size="10" fill="#888">—</text>
  <rect x="260" y="78" width="70" height="34" fill="#fff" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="295" y="100" text-anchor="middle" font-size="10" fill="#888">初始</text>
  <rect x="330" y="78" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="370" y="100" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="410" y="78" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="450" y="100" text-anchor="middle" font-size="12" fill="#333">1</text>

  <!-- ===== row i=1 ===== -->
  <rect x="40" y="114" width="60" height="34" fill="#fff" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="136" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="100" y="114" width="80" height="34" fill="#fff" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="140" y="136" text-anchor="middle" font-size="10" fill="#333">1, 3</text>
  <rect x="180" y="114" width="80" height="34" fill="#fff" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="220" y="136" text-anchor="middle" font-size="10" fill="#333">1, 2</text>
  <rect x="260" y="114" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="295" y="136" text-anchor="middle" font-size="9.5" fill="#4a7a3a">✓ / ✓</text>
  <rect x="330" y="114" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="370" y="136" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="410" y="114" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="450" y="136" text-anchor="middle" font-size="12" fill="#333">1</text>

  <!-- ===== row i=2 ===== -->
  <rect x="40" y="150" width="60" height="34" fill="#fff" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="172" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="100" y="150" width="80" height="34" fill="#fff" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="140" y="172" text-anchor="middle" font-size="10" fill="#333">3, 5</text>
  <rect x="180" y="150" width="80" height="34" fill="#fff" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="220" y="172" text-anchor="middle" font-size="10" fill="#333">2, 3</text>
  <rect x="260" y="150" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="295" y="172" text-anchor="middle" font-size="9.5" fill="#4a7a3a">✓ / ✗</text>
  <rect x="330" y="150" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="370" y="172" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="410" y="150" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="450" y="172" text-anchor="middle" font-size="12" fill="#333">2</text>

  <!-- ===== row i=3 (key step) ===== -->
  <rect x="40" y="186" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="70" y="208" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>
  <rect x="100" y="186" width="80" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="140" y="208" text-anchor="middle" font-size="10" fill="#333">5, 4</text>
  <rect x="180" y="186" width="80" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="220" y="208" text-anchor="middle" font-size="10" fill="#333">3, 7</text>
  <rect x="260" y="186" width="70" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="295" y="208" text-anchor="middle" font-size="9.5" fill="#d6a040">✗ / ✓</text>
  <rect x="330" y="186" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="370" y="208" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="410" y="186" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="450" y="208" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>

  <!-- answer annotation -->
  <path d="M 510 203 L 492 203" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="4,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="528" y="206" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">换！</text>

  <!-- ===== explanation boxes ===== -->
  <rect x="40" y="240" width="240" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="260" font-size="10.5" fill="#4a7a3a" font-weight="bold">i=1：same✓ cross✓</text>
  <text x="60" y="276" font-size="10" fill="#444">keep=min(keep=0, swap=1)=0</text>
  <text x="60" y="292" font-size="10" fill="#444">swap=min(keep+1=1, swap+1=2)=1</text>
  <text x="60" y="306" font-size="9.5" fill="#888">两条件都满足，四条边全通</text>

  <rect x="300" y="240" width="240" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="320" y="260" font-size="10.5" fill="#446688" font-weight="bold">i=2：same✓ cross✗</text>
  <text x="320" y="276" font-size="10" fill="#444">keep=min(keep=0, ∞)=0</text>
  <text x="320" y="292" font-size="10" fill="#444">swap=min(∞, swap+1=2)=2</text>
  <text x="320" y="306" font-size="9.5" fill="#888">cross 不通，只能 keep→keep / swap→swap</text>

  <rect x="40" y="318" width="500" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="60" y="338" font-size="10.5" fill="#d6a040" font-weight="bold">i=3（关键步）：same✗ cross✓  —— 5,4 不递增，必须换一个</text>
  <text x="60" y="356" font-size="10" fill="#444">keep=min(∞, swap=2)=2   ← 只能 swap[i−1]→keep[i]</text>
  <text x="60" y="372" font-size="10" fill="#444">swap=min(keep+1=1, ∞)=1  ← 只能 keep[i−1]→swap[i]（在 i=3 换一次）</text>
  <text x="60" y="386" font-size="11" fill="#b85450" font-weight="bold">答案 = min(keep=2, swap=1) = 1，即只在第 3 位交换一次</text>
</svg>
