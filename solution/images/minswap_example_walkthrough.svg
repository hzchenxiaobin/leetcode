<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    示例演算：data = [1,0,1,0,1], ones = 3
  </text>

  <!-- Window 1: [0,2] = 1,0,1 -->
  <text x="30" y="62" font-size="12" fill="#666" filter="url(#rough2)">窗口 [0,2]:</text>
  <g filter="url(#rough2)">
    <rect x="110" y="46" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="130" y="66" text-anchor="middle" font-size="13" fill="#333">1</text>
    <rect x="150" y="46" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="170" y="66" text-anchor="middle" font-size="13" fill="#333">0</text>
    <rect x="190" y="46" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="210" y="66" text-anchor="middle" font-size="13" fill="#333">1</text>
    <rect x="230" y="46" width="40" height="30" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4"/>
    <text x="250" y="66" text-anchor="middle" font-size="13" fill="#999">0</text>
    <rect x="270" y="46" width="40" height="30" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4"/>
    <text x="290" y="66" text-anchor="middle" font-size="13" fill="#999">1</text>
  </g>
  <rect x="108" y="42" width="124" height="38" fill="none" stroke="#4a7a3a" stroke-width="2.5" stroke-dasharray="6 3" rx="6" filter="url(#rough2)"/>
  <text x="350" y="66" font-size="12" fill="#333" filter="url(#rough2)">1的个数=2, 交换=3−2=</text>
  <text x="480" y="66" font-size="13" fill="#b85450" filter="url(#rough2)">1</text>

  <!-- Window 2: [1,3] = 0,1,0 -->
  <text x="30" y="112" font-size="12" fill="#666" filter="url(#rough2)">窗口 [1,3]:</text>
  <g filter="url(#rough2)">
    <rect x="110" y="96" width="40" height="30" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4"/>
    <text x="130" y="116" text-anchor="middle" font-size="13" fill="#999">1</text>
    <rect x="150" y="96" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="170" y="116" text-anchor="middle" font-size="13" fill="#333">0</text>
    <rect x="190" y="96" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="210" y="116" text-anchor="middle" font-size="13" fill="#333">1</text>
    <rect x="230" y="96" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="250" y="116" text-anchor="middle" font-size="13" fill="#333">0</text>
    <rect x="270" y="96" width="40" height="30" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4"/>
    <text x="290" y="116" text-anchor="middle" font-size="13" fill="#999">1</text>
  </g>
  <rect x="148" y="92" width="124" height="38" fill="none" stroke="#4a7a3a" stroke-width="2.5" stroke-dasharray="6 3" rx="6" filter="url(#rough2)"/>
  <text x="350" y="116" font-size="12" fill="#333" filter="url(#rough2)">1的个数=1, 交换=3−1=</text>
  <text x="480" y="116" font-size="13" fill="#b85450" filter="url(#rough2)">2</text>

  <!-- Window 3: [2,4] = 1,0,1 -->
  <text x="30" y="162" font-size="12" fill="#666" filter="url(#rough2)">窗口 [2,4]:</text>
  <g filter="url(#rough2)">
    <rect x="110" y="146" width="40" height="30" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4"/>
    <text x="130" y="166" text-anchor="middle" font-size="13" fill="#999">1</text>
    <rect x="150" y="146" width="40" height="30" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4"/>
    <text x="170" y="166" text-anchor="middle" font-size="13" fill="#999">0</text>
    <rect x="190" y="146" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="210" y="166" text-anchor="middle" font-size="13" fill="#333">1</text>
    <rect x="230" y="146" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="250" y="166" text-anchor="middle" font-size="13" fill="#333">0</text>
    <rect x="270" y="146" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="290" y="166" text-anchor="middle" font-size="13" fill="#333">1</text>
  </g>
  <rect x="188" y="142" width="124" height="38" fill="none" stroke="#4a7a3a" stroke-width="2.5" stroke-dasharray="6 3" rx="6" filter="url(#rough2)"/>
  <text x="350" y="166" font-size="12" fill="#333" filter="url(#rough2)">1的个数=2, 交换=3−2=</text>
  <text x="480" y="166" font-size="13" fill="#b85450" filter="url(#rough2)">1</text>

  <!-- Result box -->
  <rect x="60" y="200" width="400" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="222" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">maxCnt = max(2, 1, 2) = 2</text>
  <text x="260" y="240" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">最少交换 = ones − maxCnt = 3 − 2 = 1</text>

  <!-- Example 2 -->
  <text x="30" y="282" font-size="13" fill="#333" filter="url(#rough2)">示例 2: data = [0,0,0,1,0], ones = 1</text>
  <g filter="url(#rough2)">
    <rect x="30" y="292" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="48" y="311" text-anchor="middle" font-size="12" fill="#333">0</text>
    <rect x="66" y="292" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="84" y="311" text-anchor="middle" font-size="12" fill="#333">0</text>
    <rect x="102" y="292" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="120" y="311" text-anchor="middle" font-size="12" fill="#333">0</text>
    <rect x="138" y="292" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="156" y="311" text-anchor="middle" font-size="12" fill="#333">1</text>
    <rect x="174" y="292" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="192" y="311" text-anchor="middle" font-size="12" fill="#333">0</text>
  </g>
  <text x="230" y="311" font-size="12" fill="#333" filter="url(#rough2)">窗口大小=1, maxCnt=1, 交换=1−1=0</text>

  <!-- Legend -->
  <text x="30" y="350" font-size="11" fill="#666" filter="url(#rough2)">图例：</text>
  <rect x="80" y="340" width="20" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="108" y="352" font-size="11" fill="#333" filter="url(#rough2)">= 1</text>
  <rect x="150" y="340" width="20" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="178" y="352" font-size="11" fill="#333" filter="url(#rough2)">= 0（窗口内需换出）</text>
  <rect x="330" y="340" width="20" height="16" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="358" y="352" font-size="11" fill="#333" filter="url(#rough2)">= 窗口外</text>

  <!-- Note -->
  <rect x="30" y="375" width="460" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="260" y="396" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">
    💡 窗口内 0 的个数 = 需要交换的次数；找 0 最少的窗口即可
  </text>
</svg>
