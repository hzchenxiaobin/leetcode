<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：n=4, k=2 的 7 种分法如何由 n=3 长出</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">糖果 4 要么加入已有两袋之一（×2），要么独占新袋（来自 k=1）</text>

  <!-- ===== 左半：来自 S(3,2)=3，每个 ×2 → 6 ===== -->
  <rect x="20" y="58" width="330" height="330" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="185" y="80" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">① 加入已有手袋：S(3,2)=3 × 2 = 6 种</text>

  <!-- 第 1 行：{1},{2,3} → 两个结果 -->
  <rect x="34" y="96" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="59" y="112" text-anchor="middle" font-size="11" fill="#333">{1}</text>
  <rect x="86" y="96" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="114" y="112" text-anchor="middle" font-size="11" fill="#333">{2,3}</text>
  <path d="M 146 108 L 176 96" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <path d="M 146 108 L 176 124" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <rect x="178" y="86" width="74" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="215" y="101" text-anchor="middle" font-size="11" fill="#333">{1,4},{2,3}</text>
  <rect x="178" y="116" width="74" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="215" y="131" text-anchor="middle" font-size="11" fill="#333">{1},{2,3,4}</text>
  <text x="270" y="104" font-size="10" fill="#b85450">+4入袋1</text>
  <text x="270" y="132" font-size="10" fill="#b85450">+4入袋2</text>

  <!-- 第 2 行：{2},{1,3} -->
  <rect x="34" y="158" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="59" y="174" text-anchor="middle" font-size="11" fill="#333">{2}</text>
  <rect x="86" y="158" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="114" y="174" text-anchor="middle" font-size="11" fill="#333">{1,3}</text>
  <path d="M 146 170 L 176 158" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <path d="M 146 170 L 176 186" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <rect x="178" y="148" width="74" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="215" y="163" text-anchor="middle" font-size="11" fill="#333">{2,4},{1,3}</text>
  <rect x="178" y="178" width="74" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="215" y="193" text-anchor="middle" font-size="11" fill="#333">{2},{1,3,4}</text>

  <!-- 第 3 行：{3},{1,2} -->
  <rect x="34" y="220" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="59" y="236" text-anchor="middle" font-size="11" fill="#333">{3}</text>
  <rect x="86" y="220" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="114" y="236" text-anchor="middle" font-size="11" fill="#333">{1,2}</text>
  <path d="M 146 232 L 176 220" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <path d="M 146 232 L 176 248" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <rect x="178" y="210" width="74" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="215" y="225" text-anchor="middle" font-size="11" fill="#333">{3,4},{1,2}</text>
  <rect x="178" y="240" width="74" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="215" y="255" text-anchor="middle" font-size="11" fill="#333">{3},{1,2,4}</text>

  <!-- 小计 -->
  <text x="185" y="368" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">小计：3 个分区 × 2 袋 = 6</text>

  <!-- ===== 右半：来自 S(3,1)=1，独占新袋 → 1 ===== -->
  <rect x="366" y="58" width="194" height="180" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="463" y="80" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">② 独占新手袋</text>
  <text x="463" y="98" text-anchor="middle" font-size="11" fill="#555">前 3 颗只占 1 袋</text>
  <text x="463" y="114" text-anchor="middle" font-size="11" fill="#555">S(3,1) = 1</text>

  <rect x="404" y="128" width="118" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="463" y="145" text-anchor="middle" font-size="11" fill="#333">{1,2,3}</text>
  <path d="M 463 156 L 463 172" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="478" y="168" font-size="10" fill="#b85450">+4成新袋</text>
  <rect x="404" y="176" width="118" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="463" y="193" text-anchor="middle" font-size="11" fill="#333">{4},{1,2,3}</text>

  <text x="463" y="222" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">小计：1 种</text>

  <!-- ===== 汇总公式 ===== -->
  <rect x="60" y="402" width="460" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="290" y="430" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">S(4,2) = 2·S(3,2) + S(3,1) = 2×3 + 1 = 7 ✓</text>
</svg>
