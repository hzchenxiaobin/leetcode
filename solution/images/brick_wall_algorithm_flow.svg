<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="460" height="540" fill="#fafafa"/>

  <text x="230" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">砖墙：算法流程</text>

  <!-- Init -->
  <rect x="90" y="40" width="280" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="62" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">初始化</text>
  <text x="230" y="82" text-anchor="middle" font-size="11" fill="#555">gap = {} (哈希表),  maxGap = 0</text>

  <path d="M 230 100 L 230 118" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Outer loop: for each row -->
  <rect x="70" y="122" width="320" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="142" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">for row in wall</text>
  <text x="230" y="158" text-anchor="middle" font-size="10.5" fill="#555">逐行处理砖墙</text>

  <path d="M 230 170 L 230 188" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- prefix = 0 -->
  <rect x="120" y="192" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="230" y="217" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">prefix = 0</text>

  <path d="M 230 236 L 230 254" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Inner loop: for each brick except last -->
  <rect x="60" y="258" width="340" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="278" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">for i in 0 .. row.size()-2</text>
  <text x="230" y="294" text-anchor="middle" font-size="10.5" fill="#555">遍历砖宽（跳过最后一块，避免末尾墙宽）</text>

  <path d="M 230 304 L 230 322" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- prefix += row[i] -->
  <rect x="110" y="326" width="240" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="230" y="351" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">prefix += row[i]</text>

  <path d="M 230 368 L 230 386" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- gap[prefix]++ and update max -->
  <rect x="70" y="390" width="320" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="412" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">gap[prefix]++</text>
  <text x="230" y="432" text-anchor="middle" font-size="11" fill="#4a7a3a">maxGap = max(maxGap, gap[prefix])</text>

  <!-- loop back inner -->
  <path d="M 390 418 L 420 418 L 420 280 L 400 280" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <text x="430" y="350" font-size="9.5" fill="#aaa" transform="rotate(-90 430 350)">内循环</text>

  <!-- loop back outer -->
  <path d="M 60 418 L 30 418 L 30 144 L 60 144" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <text x="22" y="280" font-size="9.5" fill="#aaa" transform="rotate(-90 22 280)">外循环</text>

  <!-- final -->
  <path d="M 230 446 L 230 468" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <rect x="80" y="472" width="300" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="494" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">return wall.size() − maxGap</text>
  <text x="230" y="510" text-anchor="middle" font-size="10.5" fill="#777">总行数 − 最大缝隙频次</text>

  <text x="230" y="530" text-anchor="middle" font-size="11" fill="#d6a040" font-style="italic">复杂度：O(Σ 每行砖数) ≈ O(n·m), 空间 O(Σ 缝隙数)</text>
</svg>
