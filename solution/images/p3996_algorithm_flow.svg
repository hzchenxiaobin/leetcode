<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：一次奇偶比较，O(1) 判定偶数步可达</text>

  <!-- 输入 -->
  <rect x="56" y="42" width="168" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="60" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">输入 start、target</text>
  <text x="140" y="74" text-anchor="middle" font-size="8" fill="#446688" filter="url(#rough2)">8×8 棋盘上的两枚格子坐标</text>

  <path d="M 140 82 L 140 98" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 计算奇偶 -->
  <rect x="56" y="100" width="168" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="118" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">p₁ = (sx + sy) % 2</text>
  <text x="140" y="136" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">p₂ = (tx + ty) % 2</text>

  <path d="M 140 144 L 140 160" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="140,162 76,198 140,234 204,198" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="140" y="202" text-anchor="middle" font-size="11" fill="#7a5c1a" font-weight="bold" filter="url(#rough2)">p₁ == p₂ ?</text>

  <!-- 是 → true -->
  <path d="M 204 198 L 292 198" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="245" y="191" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="296" y="166" width="194" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="393" y="184" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">return true</text>
  <text x="393" y="200" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">同色 ⇒ 存在偶数步路径（连通性保证）</text>
  <text x="393" y="216" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">start == target：0 步也是偶数</text>

  <!-- 否 → false -->
  <path d="M 140 234 L 140 252" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="152" y="248" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="50" y="256" width="180" height="60" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="140" y="274" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">return false</text>
  <text x="140" y="290" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">异色 ⇒ 一切路径都是奇数步</text>
  <text x="140" y="306" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">示例 2：9（奇）vs 12（偶）</text>

  <!-- 兜底 BFS -->
  <rect x="296" y="246" width="194" height="86" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="393" y="264" text-anchor="middle" font-size="9.5" fill="#7a5c1a" font-weight="bold" filter="url(#rough2)">兜底：BFS（格子 × 奇偶）</text>
  <text x="393" y="281" text-anchor="middle" font-size="8" fill="#7a5c1a" filter="url(#rough2)">状态 (x, y, par)，每步翻转 par</text>
  <text x="393" y="297" text-anchor="middle" font-size="8" fill="#7a5c1a" filter="url(#rough2)">抵达 (target, 偶) 即 true</text>
  <text x="393" y="313" text-anchor="middle" font-size="8" fill="#7a5c1a" filter="url(#rough2)">适用小棋盘 / 带障碍</text>
  <text x="393" y="328" text-anchor="middle" font-size="8" fill="#7a5c1a" filter="url(#rough2)">（连通性无保证时判据失效）</text>

  <text x="260" y="350" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">不变量给出必要条件（异色必 false），8×8 的连通性把同色补成充分条件（true）</text>
</svg>
