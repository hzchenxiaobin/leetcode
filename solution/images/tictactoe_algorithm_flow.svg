<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M 0 0 L 4 8 L 8 0 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：先校轮次，再校胜负归属</text>

  <!-- 起点 -->
  <rect x="220" y="40" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">统计 xCount / oCount</text>

  <!-- 判定 1: 轮次 -->
  <path d="M 280 76 L 280 96" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <polygon points="280,98 340,130 280,162 220,130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="126" text-anchor="middle" font-size="11" fill="#333">xCount</text>
  <text x="280" y="140" text-anchor="middle" font-size="11" fill="#333">== oCount</text>
  <text x="280" y="154" text-anchor="middle" font-size="11" fill="#333">或 +1?</text>

  <!-- No 分支 -->
  <path d="M 220 130 L 120 130 L 120 188" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="124" y="122" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="64" y="190" width="112" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="120" y="212" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return false</text>

  <!-- Yes 分支 -->
  <path d="M 340 130 L 420 130 L 420 174" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="350" y="122" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="360" y="176" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="420" y="198" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">计算 xWin / oWin</text>

  <!-- 判定 2: 双赢? -->
  <path d="M 420 210 L 420 230" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <polygon points="420,232 480,264 420,296 360,264" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="420" y="260" text-anchor="middle" font-size="11" fill="#333">xWin 且</text>
  <text x="420" y="274" text-anchor="middle" font-size="11" fill="#333">oWin?</text>

  <!-- Yes -> false -->
  <path d="M 360 264 L 300 264 L 300 320" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="312" y="256" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="244" y="322" width="112" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="344" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return false</text>

  <!-- No -> 判定 3 -->
  <path d="M 480 264 L 500 264 L 500 300 L 460 300 L 460 322" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="486" y="256" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <rect x="370" y="324" width="180" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="460" y="346" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">xWin ? xCnt==oCnt+1</text>
  <text x="460" y="358" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">oWin ? xCnt==oCnt</text>

  <!-- 汇总返回 -->
  <path d="M 460 358 L 460 372 L 200 372 L 200 392" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="140" y="394" width="180" height="20" fill="none" stroke="none"/>
  <text x="230" y="408" text-anchor="middle" font-size="11" fill="#888">条件全部满足 → return true</text>

  <text x="40" y="408" font-size="10" fill="#888">无胜负时只要轮次正确即合法</text>
</svg>
