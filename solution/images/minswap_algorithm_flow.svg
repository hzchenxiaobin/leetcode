<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arwf" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">滚动两变量 DP 流程：keep / swap 同步推进</text>

  <!-- ===== left: pseudo-flow ===== -->
  <rect x="30" y="46" width="240" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="68" text-anchor="middle" font-size="11" fill="#333">① keep = 0, swap = 1</text>

  <path d="M 150 80 L 150 94" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arwf)" filter="url(#rough2)"/>

  <rect x="30" y="96" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="118" text-anchor="middle" font-size="11" fill="#333">② for i = 1 .. n−1</text>

  <path d="M 150 130 L 150 144" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arwf)" filter="url(#rough2)"/>

  <rect x="20" y="146" width="260" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="164" text-anchor="middle" font-size="10.5" fill="#333">③ 算 same / cross 两个布尔</text>
  <text x="150" y="178" text-anchor="middle" font-size="9.5" fill="#888">same=A[i−1]&lt;A[i]且B[i−1]&lt;B[i]; cross=A[i−1]&lt;B[i]且B[i−1]&lt;A[i]</text>

  <path d="M 150 186 L 150 200" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arwf)" filter="url(#rough2)"/>

  <rect x="10" y="202" width="280" height="74" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="222" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">④ 用临时变量暂存，同步更新</text>
  <text x="150" y="240" text-anchor="middle" font-size="10" fill="#444">nk = min(same? keep : ∞, cross? swap : ∞)</text>
  <text x="150" y="256" text-anchor="middle" font-size="10" fill="#444">ns = min(cross? keep+1 : ∞, same? swap+1 : ∞)</text>
  <text x="150" y="272" text-anchor="middle" font-size="10" fill="#888">keep=nk; swap=ns</text>

  <path d="M 150 276 L 150 290" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arwf)" filter="url(#rough2)"/>

  <rect x="30" y="292" width="240" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="150" y="314" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">⑤ return min(keep, swap)</text>

  <!-- loop-back arrow from ④ to ② -->
  <path d="M 10 239 Q -6 239 -6 140 Q -6 113 30 113" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arwf)" filter="url(#rough2)"/>
  <text x="2" y="180" text-anchor="middle" font-size="9" fill="#888" transform="rotate(-90 2 180)">循环</text>

  <!-- ===== right: rolling variable diagram ===== -->
  <text x="400" y="58" text-anchor="middle" font-size="11" fill="#888">滚动变量示意</text>

  <!-- step i-1 box -->
  <rect x="320" y="70" width="160" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="400" y="90" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">第 i−1 步</text>
  <text x="400" y="108" text-anchor="middle" font-size="10" fill="#444">keep, swap（旧值）</text>
  <text x="400" y="122" text-anchor="middle" font-size="9.5" fill="#888">两行已合法的最小交换数</text>

  <!-- arrow down -->
  <path d="M 400 126 L 400 150" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arwf)" filter="url(#rough2)"/>
  <text x="430" y="142" font-size="9.5" fill="#d6a040" font-weight="bold">暂存后覆盖</text>

  <!-- step i box -->
  <rect x="320" y="152" width="160" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="400" y="172" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">第 i 步</text>
  <text x="400" y="190" text-anchor="middle" font-size="10" fill="#444">nk, ns（新值）</text>
  <text x="400" y="204" text-anchor="middle" font-size="9.5" fill="#888">两变量更新完毕</text>

  <!-- arrow down to next -->
  <path d="M 400 208 L 400 232" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arwf)" filter="url(#rough2)"/>
  <text x="430" y="224" font-size="9.5" fill="#d6a040" font-weight="bold">i++</text>

  <!-- next step box -->
  <rect x="320" y="234" width="160" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="400" y="254" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">第 i+1 步</text>
  <text x="400" y="272" text-anchor="middle" font-size="10" fill="#444">keep, swap（旧值）</text>
  <text x="400" y="286" text-anchor="middle" font-size="9.5" fill="#888">只留两数，O(1) 空间</text>

  <!-- note -->
  <rect x="310" y="306" width="190" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="405" y="324" text-anchor="middle" font-size="9.5" fill="#444">关键：nk、ns 必须基于同一轮</text>
  <text x="405" y="338" text-anchor="middle" font-size="9.5" fill="#444">旧 keep/swap 算出后再赋值</text>
</svg>
