<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    算法流程：定长滑动窗口
  </text>

  <!-- Step 1 -->
  <rect x="160" y="50" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="68" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">Step 1: 统计 1 的总数</text>
  <text x="260" y="82" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">ones = sum(data)</text>

  <path d="M 260 92 L 260 108" stroke="#446688" stroke-width="1.5" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="130" y="112" width="260" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="132" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">Step 2: 初始化窗口 [0, ones-1]</text>
  <text x="260" y="148" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">cnt = 窗口内 1 的个数; maxCnt = cnt</text>

  <path d="M 260 164 L 260 180" stroke="#446688" stroke-width="1.5" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- Step 3 - loop -->
  <rect x="100" y="184" width="320" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="204" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">Step 3: 右边界 i 从 ones 到 n-1</text>
  <text x="260" y="220" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">cnt += data[i] - data[i - ones]</text>
  <text x="260" y="234" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">maxCnt = max(maxCnt, cnt)</text>

  <path d="M 260 242 L 260 258" stroke="#446688" stroke-width="1.5" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- Decision -->
  <polygon points="260,262 360,300 260,338 160,300" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="296" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i &lt; n ?</text>
  <text x="260" y="310" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">继续滑动</text>

  <!-- Loop back arrow -->
  <path d="M 360 300 L 420 300 L 420 212 L 420 212" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="430" y="258" font-size="10" fill="#666" filter="url(#rough2)">是</text>

  <!-- No arrow -->
  <path d="M 260 338 L 260 356" stroke="#446688" stroke-width="1.5" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="270" y="350" font-size="10" fill="#666" filter="url(#rough2)">否</text>

  <!-- Step 4 -->
  <rect x="130" y="360" width="260" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="380" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">Step 4: 返回 ones - maxCnt</text>
  <text x="260" y="396" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">最少交换次数</text>

  <!-- Note -->
  <rect x="30" y="420" width="460" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="260" y="440" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">
    💡 增量更新：新窗口 = 旧窗口 + 进来的 data[i] − 出去的 data[i-ones]
  </text>
</svg>
