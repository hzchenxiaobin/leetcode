<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：triangle = [[2],[3,4],[6,5,7],[4,1,8,3]]</text>

  <!-- Stage 0: init dp = last row [4,1,8,3] -->
  <text x="30" y="68" font-size="11" fill="#888">① 初始：dp ← 最后一行</text>
  <rect x="170" y="52" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="192" y="73" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="218" y="52" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="73" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="266" y="52" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="288" y="73" text-anchor="middle" font-size="13" fill="#333">8</text>
  <rect x="314" y="52" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="336" y="73" text-anchor="middle" font-size="13" fill="#333">3</text>
  <text x="380" y="73" font-size="11" fill="#888">← row 3</text>

  <!-- Stage 1: process row 2 [6,5,7] -> dp = [7,6,10,3] -->
  <text x="30" y="128" font-size="11" fill="#888">② 处理 row 2 [6,5,7]</text>
  <rect x="170" y="112" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="192" y="133" text-anchor="middle" font-size="13" fill="#333">7</text>
  <rect x="218" y="112" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="133" text-anchor="middle" font-size="13" fill="#333">6</text>
  <rect x="266" y="112" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="288" y="133" text-anchor="middle" font-size="13" fill="#333">10</text>
  <rect x="314" y="112" width="44" height="32" fill="#eee" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="336" y="133" text-anchor="middle" font-size="11" fill="#aaa">3</text>
  <text x="380" y="133" font-size="10" fill="#888">min(4,1)+6 · min(1,8)+5 · min(8,3)+7</text>
  <path d="M 100 90 L 100 110" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Stage 2: process row 1 [3,4] -> dp = [9,10,10,3] -->
  <text x="30" y="188" font-size="11" fill="#888">③ 处理 row 1 [3,4]</text>
  <rect x="170" y="172" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="192" y="193" text-anchor="middle" font-size="13" fill="#333">9</text>
  <rect x="218" y="172" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="193" text-anchor="middle" font-size="13" fill="#333">10</text>
  <rect x="266" y="172" width="44" height="32" fill="#eee" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="288" y="193" text-anchor="middle" font-size="11" fill="#aaa">10</text>
  <rect x="314" y="172" width="44" height="32" fill="#eee" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="336" y="193" text-anchor="middle" font-size="11" fill="#aaa">3</text>
  <text x="380" y="193" font-size="10" fill="#888">min(7,6)+3 · min(6,10)+4</text>
  <path d="M 100 150 L 100 170" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Stage 3: process row 0 [2] -> dp[0] = 11 -->
  <text x="30" y="248" font-size="11" fill="#888">④ 处理 row 0 [2]</text>
  <rect x="170" y="232" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="192" y="253" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">11</text>
  <rect x="218" y="232" width="44" height="32" fill="#eee" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="240" y="253" text-anchor="middle" font-size="11" fill="#aaa">10</text>
  <rect x="266" y="232" width="44" height="32" fill="#eee" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="288" y="253" text-anchor="middle" font-size="11" fill="#aaa">10</text>
  <rect x="314" y="232" width="44" height="32" fill="#eee" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="336" y="253" text-anchor="middle" font-size="11" fill="#aaa">3</text>
  <text x="380" y="253" font-size="10" fill="#888">min(9,10)+2 = 11</text>
  <path d="M 100 210 L 100 230" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Answer -->
  <rect x="120" y="300" width="280" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="325" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">答案 = dp[0] = 11 ⭐</text>

  <!-- Path note -->
  <rect x="40" y="350" width="440" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="260" y="367" text-anchor="middle" font-size="11" fill="#444">回溯最优路径：2 → 3 → 5 → 1 = 11（灰色格表示已不再使用）</text>
</svg>
