<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：num = 14，非完全平方数 → false</text>

  <!-- ===== Table header ===== -->
  <rect x="40" y="48" width="500" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="67" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">轮次</text>
  <text x="148" y="67" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">[lo, hi]</text>
  <text x="220" y="67" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">mid</text>
  <text x="290" y="67" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">mid²</text>
  <text x="372" y="67" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">判定</text>
  <text x="476" y="67" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">动作</text>

  <!-- column separators -->
  <line x1="100" y1="48" x2="100" y2="238" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="196" y1="48" x2="196" y2="238" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="244" y1="48" x2="244" y2="238" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="336" y1="48" x2="336" y2="238" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="408" y1="48" x2="408" y2="238" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Row 1 ===== -->
  <rect x="40" y="80" width="500" height="30" fill="#fff" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="99" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="148" y="99" text-anchor="middle" font-size="11" fill="#333">[1, 14]</text>
  <text x="220" y="99" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">7</text>
  <text x="290" y="99" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">49</text>
  <text x="372" y="99" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">49 &gt; 14 ✗</text>
  <text x="476" y="99" text-anchor="middle" font-size="11" fill="#b85450">hi = 6</text>

  <!-- ===== Row 2 ===== -->
  <rect x="40" y="112" width="500" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="131" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="148" y="131" text-anchor="middle" font-size="11" fill="#333">[1, 6]</text>
  <text x="220" y="131" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="290" y="131" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">9</text>
  <text x="372" y="131" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">9 &lt; 14</text>
  <text x="476" y="131" text-anchor="middle" font-size="11" fill="#4a7a3a">lo = 4</text>

  <!-- ===== Row 3 ===== -->
  <rect x="40" y="144" width="500" height="30" fill="#fff" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="163" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="148" y="163" text-anchor="middle" font-size="11" fill="#333">[4, 6]</text>
  <text x="220" y="163" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <text x="290" y="163" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">25</text>
  <text x="372" y="163" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">25 &gt; 14 ✗</text>
  <text x="476" y="163" text-anchor="middle" font-size="11" fill="#b85450">hi = 4</text>

  <!-- ===== Row 4 ===== -->
  <rect x="40" y="176" width="500" height="30" fill="#fff" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="195" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="148" y="195" text-anchor="middle" font-size="11" fill="#333">[4, 4]</text>
  <text x="220" y="195" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="290" y="195" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">16</text>
  <text x="372" y="195" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">16 &gt; 14 ✗</text>
  <text x="476" y="195" text-anchor="middle" font-size="11" fill="#b85450">hi = 3</text>

  <!-- ===== End row ===== -->
  <rect x="40" y="210" width="500" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="228" text-anchor="middle" font-size="11" fill="#333">lo=4 &gt; hi=3，循环结束，未命中 → 返回 false</text>

  <!-- ===== Bottom note ===== -->
  <rect x="40" y="256" width="500" height="82" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="280" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">关键观察</text>
  <text x="60" y="302" font-size="11" fill="#555">• 第 2 轮 mid=3，3²=9 &lt; 14 → 太小，向右缩 lo=4；其余三轮 mid² 均 &gt; 14 → 太大，向左缩</text>
  <text x="60" y="320" font-size="11" fill="#555">• 区间从 [1,14] → [1,6] → [4,6] → [4,4] → 空，每次砍半，4 轮即判定 14 非完全平方数</text>
  <text x="60" y="336" font-size="11" fill="#d6a040" font-weight="bold">  对比：num=16 第 2 轮 mid=4，4²==16 命中即返回 true（完全平方数秒判）</text>
</svg>
