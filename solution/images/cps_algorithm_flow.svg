<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：前缀集合 + 逐词查表</text>

  <!-- Start node -->
  <ellipse cx="270" cy="62" rx="110" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="66" text-anchor="middle" font-size="12" fill="#333">开始: ans = 0</text>

  <path d="M 270 82 L 270 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Build prefix set -->
  <rect x="150" y="104" width="240" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="122" text-anchor="middle" font-size="12" fill="#333">建前缀集合 P</text>
  <text x="270" y="138" text-anchor="middle" font-size="11" fill="#666">P = { s[:i] | 1 ≤ i ≤ |s| }</text>

  <path d="M 270 144 L 270 162" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: still have word? -->
  <polygon points="270,166 390,210 270,254 150,210" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="206" text-anchor="middle" font-size="12" fill="#333">words 还有未处理词?</text>
  <text x="270" y="222" text-anchor="middle" font-size="11" fill="#666">(遍历每个 w)</text>

  <!-- No branch -> end -->
  <path d="M 390 210 L 462 210" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="426" y="202" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <ellipse cx="494" cy="210" rx="42" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="494" y="214" text-anchor="middle" font-size="11" fill="#333">返回 ans</text>

  <!-- Yes branch down -->
  <path d="M 270 254 L 270 272" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="268" font-size="11" fill="#82b366">是</text>

  <!-- Decision: w in P ? -->
  <polygon points="270,276 400,322 270,368 140,322" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="316" text-anchor="middle" font-size="12" fill="#333">w ∈ P ?</text>
  <text x="270" y="334" text-anchor="middle" font-size="10" fill="#666">(或 |w|≤|s| 且 s[:|w|]==w)</text>

  <!-- Yes (hit) -> ans++ -->
  <path d="M 140 322 L 96 322" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="314" text-anchor="middle" font-size="11" fill="#82b366">是</text>
  <rect x="24" y="302" width="72" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="60" y="320" text-anchor="middle" font-size="11" fill="#333">ans += 1</text>
  <text x="60" y="335" text-anchor="middle" font-size="10" fill="#888">计数</text>

  <!-- No (miss) -> continue -->
  <path d="M 400 322 L 444 322" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="422" y="314" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <rect x="444" y="302" width="72" height="40" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="480" y="327" text-anchor="middle" font-size="11" fill="#888">跳过</text>

  <!-- loop back arrow to decision top -->
  <path d="M 60 302 L 60 210 L 150 210" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="60" y="256" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 60 256)">取下一个 w</text>

  <!-- summary note -->
  <rect x="40" y="392" width="460" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="410" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">关键：把「前缀判定」转化为「集合查表」</text>
  <text x="270" y="426" text-anchor="middle" font-size="10" fill="#888">|s|≤10 ⇒ P 至多 10 个串；重复词各计一次（查表天然支持）</text>
</svg>
