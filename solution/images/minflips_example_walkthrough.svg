<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：a=2, b=6, c=5（4 位，高位在左）</text>

  <!-- column headers (bit3..bit0) -->
  <text x="150" y="62" font-size="11" fill="#888">bit3</text>
  <text x="220" y="62" font-size="11" fill="#888">bit2</text>
  <text x="290" y="62" font-size="11" fill="#888">bit1</text>
  <text x="360" y="62" font-size="11" fill="#888">bit0</text>

  <!-- Row a = 2 = 0010 -->
  <text x="44" y="92" font-size="12.5" fill="#446688" font-weight="bold">a = 2</text>
  <rect x="132" y="72" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="150" y="92" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="202" y="72" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="220" y="92" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="272" y="72" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="290" y="92" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">1</text>
  <rect x="342" y="72" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="360" y="92" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>

  <!-- Row b = 6 = 0110 -->
  <text x="44" y="132" font-size="12.5" fill="#446688" font-weight="bold">b = 6</text>
  <rect x="132" y="112" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="150" y="132" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="202" y="112" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="220" y="132" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="272" y="112" width="36" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="290" y="132" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">1</text>
  <rect x="342" y="112" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="360" y="132" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>

  <!-- Row c = 5 = 0101 -->
  <text x="44" y="172" font-size="12.5" fill="#d6a040" font-weight="bold">c = 5</text>
  <rect x="132" y="152" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="150" y="172" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="202" y="152" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="220" y="172" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="272" y="152" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="290" y="172" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="342" y="152" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="360" y="172" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <!-- separator -->
  <line x1="120" y1="194" x2="390" y2="194" stroke="#bbb" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- Row a|b -->
  <text x="44" y="220" font-size="12.5" fill="#888" font-weight="bold">a|b</text>
  <rect x="132" y="200" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="150" y="220" text-anchor="middle" font-size="14" fill="#888" font-weight="bold">0</text>
  <rect x="202" y="200" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="220" y="220" text-anchor="middle" font-size="14" fill="#888" font-weight="bold">1</text>
  <rect x="272" y="200" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="290" y="220" text-anchor="middle" font-size="14" fill="#888" font-weight="bold">1</text>
  <rect x="342" y="200" width="36" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="360" y="220" text-anchor="middle" font-size="14" fill="#888" font-weight="bold">0</text>

  <!-- Row: 满足? -->
  <text x="44" y="262" font-size="12" fill="#4a7a3a" font-weight="bold">满足?</text>
  <rect x="132" y="248" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="266" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="202" y="248" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="266" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="272" y="248" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="290" y="266" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>
  <rect x="342" y="248" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="360" y="266" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>

  <!-- Row: 代价 -->
  <text x="44" y="304" font-size="12" fill="#d6a040" font-weight="bold">代价</text>
  <rect x="132" y="290" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="308" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="202" y="290" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="308" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="272" y="290" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="290" y="308" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">+2</text>
  <rect x="342" y="290" width="36" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="360" y="308" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">+1</text>

  <!-- annotations for the two mismatched columns -->
  <text x="290" y="332" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">c=0,俩1→翻2个</text>
  <text x="360" y="332" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">c=1,俩0→翻1个</text>

  <!-- accumulation -->
  <path d="M 290 316 Q 290 330 290 338" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="44" y="372" font-size="12.5" fill="#446688" font-weight="bold">ans</text>
  <rect x="132" y="358" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="150" y="376" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">0</text>
  <rect x="202" y="358" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="220" y="376" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">0</text>
  <rect x="272" y="358" width="36" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="290" y="376" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">2</text>
  <rect x="342" y="358" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="360" y="376" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="392" y="376" font-size="11" fill="#4a7a3a" font-weight="bold">← 终值</text>

  <!-- arrow to result -->
  <path d="M 360 388 Q 360 402 360 410" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- result box -->
  <rect x="80" y="414" width="400" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="436" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">bit1 翻 2 个 + bit0 翻 1 个 = 3 ✓</text>
</svg>
