<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">BST 前序遍历：左脊递减 + 右拐升下界</text>

  <!-- ===== Left: BST Tree ===== -->
  <text x="120" y="52" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">BST 结构</text>

  <!-- Node 5 (root) -->
  <circle cx="120" cy="80" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="120" y="84" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>

  <!-- Node 2 (left child) -->
  <circle cx="80" cy="130" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="80" y="134" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <line x1="108" y1="92" x2="92" y2="118" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- Node 6 (right child) -->
  <circle cx="170" cy="130" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="170" y="134" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>
  <line x1="132" y1="92" x2="158" y2="118" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- Node 1 (left of 2) -->
  <circle cx="50" cy="180" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="50" y="184" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <line x1="68" y1="142" x2="58" y2="168" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- Node 3 (right of 2) -->
  <circle cx="110" cy="180" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="110" y="184" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <line x1="92" y1="142" x2="102" y2="168" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- Left spine annotation -->
  <text x="20" y="100" font-size="10" fill="#446688" font-weight="bold">左脊</text>
  <text x="20" y="114" font-size="10" fill="#446688">(递减)</text>

  <!-- Preorder sequence -->
  <text x="120" y="222" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">前序序列</text>
  <rect x="30" y="232" width="30" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="45" y="248" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <rect x="62" y="232" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="77" y="248" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="94" y="232" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="109" y="248" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="126" y="232" width="30" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="141" y="248" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="158" y="232" width="30" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="173" y="248" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>

  <text x="45" y="272" text-anchor="middle" font-size="9" fill="#d6a040">根</text>
  <text x="77" y="272" text-anchor="middle" font-size="9" fill="#446688">左</text>
  <text x="109" y="272" text-anchor="middle" font-size="9" fill="#446688">左</text>
  <text x="141" y="272" text-anchor="middle" font-size="9" fill="#d6a040">右拐↑</text>
  <text x="173" y="272" text-anchor="middle" font-size="9" fill="#4a7a3a">右拐↑</text>

  <!-- ===== Right: Stack Evolution ===== -->
  <text x="390" y="52" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">单调栈演变</text>

  <!-- Moment 1: stack = [5,2,1] -->
  <text x="300" y="78" font-size="10" fill="#888" font-weight="bold">① 1 入栈：</text>
  <rect x="360" y="62" width="36" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="378" y="77" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">5</text>
  <rect x="360" y="86" width="36" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="378" y="101" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2</text>
  <rect x="360" y="110" width="36" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="378" y="125" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>
  <text x="405" y="100" font-size="9" fill="#446688">← 递减</text>
  <text x="405" y="113" font-size="9" fill="#888">lower = -∞</text>

  <!-- Moment 2: 3 arrives, pop 1,2 -->
  <text x="300" y="156" font-size="10" fill="#888" font-weight="bold">② 3 到来：</text>
  <text x="360" y="156" font-size="9" fill="#b85450">弹 1 → lower=1</text>
  <text x="360" y="169" font-size="9" fill="#b85450">弹 2 → lower=2</text>
  <rect x="430" y="152" width="36" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="448" y="167" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">5</text>
  <rect x="430" y="176" width="36" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="448" y="191" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>
  <text x="300" y="191" font-size="9" fill="#d6a040">进入 2 的右子树</text>
  <text x="300" y="204" font-size="9" fill="#888">lower = 2</text>

  <!-- Arrow from moment 1 to 2 -->
  <path d="M 378 138 Q 410 145 440 150" fill="none" stroke="#d6a040" stroke-width="1.2" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- Moment 3: 6 arrives, pop 3,5 -->
  <text x="300" y="222" font-size="10" fill="#888" font-weight="bold">③ 6 到来：</text>
  <text x="360" y="222" font-size="9" fill="#b85450">弹 3 → lower=3</text>
  <text x="360" y="235" font-size="9" fill="#b85450">弹 5 → lower=5</text>
  <rect x="430" y="230" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="448" y="245" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">6</text>
  <text x="300" y="245" font-size="9" fill="#4a7a3a">进入 5 的右子树</text>
  <text x="300" y="258" font-size="9" fill="#888">lower = 5</text>

  <!-- Arrow from moment 2 to 3 -->
  <path d="M 448 202 L 448 225" fill="none" stroke="#4a7a3a" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Bottom: Key Insight ===== -->
  <rect x="30" y="290" width="500" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="312" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">核心：栈维护左脊（递减），遇更大值弹栈 → 右拐祖先值 = 新下界</text>
  <text x="280" y="330" text-anchor="middle" font-size="11" fill="#666">下界单调递增：每次右拐都进入更大祖先的右子树，lower 只升不降</text>
  <text x="280" y="348" text-anchor="middle" font-size="11" fill="#b85450">任何 x &lt; lower → 非法（出现在祖先右子树中却比祖先小）</text>
</svg>
