<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：支配 ⇔ 值 = 子树最大值 · 最大值后序自底向上冒泡</text>

  <!-- Panel 1: example tree with dominant nodes highlighted -->
  <g filter="url(#rough2)">
    <rect x="20" y="38" width="260" height="224" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="150" y="58" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold">① 支配节点 = 子树里的最大值</text>

    <line x1="150" y1="84" x2="100" y2="138" stroke="#90a4b8" stroke-width="1.4"/>
    <line x1="150" y1="84" x2="204" y2="138" stroke="#90a4b8" stroke-width="1.4"/>
    <line x1="100" y1="138" x2="66" y2="196" stroke="#90a4b8" stroke-width="1.4"/>
    <line x1="100" y1="138" x2="132" y2="196" stroke="#90a4b8" stroke-width="1.4"/>
    <line x1="204" y1="138" x2="176" y2="196" stroke="#90a4b8" stroke-width="1.4"/>
    <line x1="204" y1="138" x2="240" y2="196" stroke="#90a4b8" stroke-width="1.4"/>

    <circle cx="150" cy="84" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="150" y="89" text-anchor="middle" font-size="13" fill="#8a3030" font-weight="bold">5</text>
    <circle cx="100" cy="138" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="100" y="143" text-anchor="middle" font-size="13" fill="#8a3030" font-weight="bold">3</text>
    <circle cx="204" cy="138" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="204" y="143" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold">8</text>

    <circle cx="66" cy="196" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="66" y="201" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold">2</text>
    <circle cx="132" cy="196" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="132" y="201" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold">4</text>
    <circle cx="176" cy="196" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="176" y="201" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold">7</text>
    <circle cx="240" cy="196" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="240" y="201" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold">1</text>

    <text x="150" y="112" text-anchor="middle" font-size="9" fill="#8a3030" font-weight="bold">m=8 ✗</text>
    <text x="100" y="166" text-anchor="middle" font-size="9" fill="#8a3030" font-weight="bold">m=4 ✗</text>
    <text x="204" y="166" text-anchor="middle" font-size="9" fill="#2f5d24" font-weight="bold">m=8 ✓</text>
    <text x="66" y="226" text-anchor="middle" font-size="9" fill="#2f5d24" font-weight="bold">m=2 ✓</text>
    <text x="132" y="226" text-anchor="middle" font-size="9" fill="#2f5d24" font-weight="bold">m=4 ✓</text>
    <text x="176" y="226" text-anchor="middle" font-size="9" fill="#2f5d24" font-weight="bold">m=7 ✓</text>
    <text x="240" y="226" text-anchor="middle" font-size="9" fill="#2f5d24" font-weight="bold">m=1 ✓</text>

    <text x="150" y="250" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold">绿=支配（5 个）· 红=非支配 · m=子树最大值</text>
  </g>

  <!-- Panel 2: postorder bubble-up -->
  <g filter="url(#rough2)">
    <rect x="300" y="38" width="240" height="224" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="420" y="58" text-anchor="middle" font-size="11.5" fill="#8a6d1a" font-weight="bold">② 后序：孩子先算好，max 往上传</text>
    <text x="420" y="78" text-anchor="middle" font-size="10" fill="#8a6d1a" font-weight="bold">m(x) = max(x.val, m(L), m(R))</text>

    <path d="M 368 172 L 407 133" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)"/>
    <path d="M 472 172 L 433 133" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)"/>
    <text x="352" y="152" text-anchor="middle" font-size="9" fill="#2f5d24" font-weight="bold">m(L)↑</text>
    <text x="488" y="152" text-anchor="middle" font-size="9" fill="#2f5d24" font-weight="bold">m(R)↑</text>

    <circle cx="420" cy="118" r="16" fill="#ffffff" stroke="#446688" stroke-width="2"/>
    <text x="420" y="123" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold">x</text>
    <circle cx="368" cy="186" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="368" y="190" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold">L</text>
    <circle cx="472" cy="186" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="472" y="190" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold">R</text>

    <path d="M 437 118 L 495 118" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)"/>
    <text x="466" y="106" text-anchor="middle" font-size="9" fill="#33506b" font-weight="bold">返回 m</text>

    <text x="420" y="218" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold">x.val == m ⇒ ans++（并列也算）</text>
    <text x="420" y="236" text-anchor="middle" font-size="9" fill="#8a6d1a">空子树返 −∞（本题值 ≥ 1，返 0 亦可）</text>
    <text x="420" y="252" text-anchor="middle" font-size="9" fill="#8a6d1a">后序 = 左右根：先递归再合成</text>
  </g>

  <!-- Panel 3: three takeaways -->
  <g filter="url(#rough2)">
    <rect x="20" y="274" width="165" height="132" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="102" y="296" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">叶子必支配</text>
    <text x="102" y="318" text-anchor="middle" font-size="9.5" fill="#2f5d24">子树只有自己</text>
    <text x="102" y="338" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold">⇒ 答案 ≥ ⌈n/2⌉</text>
    <text x="102" y="358" text-anchor="middle" font-size="9" fill="#4a7a3a">（完全二叉树叶子数）</text>
    <text x="102" y="378" text-anchor="middle" font-size="9" fill="#4a7a3a">示例 1：4 个叶子全中</text>

    <rect x="197" y="274" width="166" height="132" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="280" y="296" text-anchor="middle" font-size="11" fill="#8a6d1a" font-weight="bold">并列最大也算</text>
    <text x="280" y="318" text-anchor="middle" font-size="9.5" fill="#8a6d1a">判定是「值 == m」</text>
    <text x="280" y="338" text-anchor="middle" font-size="10.5" fill="#8a6d1a" font-weight="bold">全等值树：n 个全支配</text>
    <text x="280" y="358" text-anchor="middle" font-size="9" fill="#a08030">别写成严格大于！</text>
    <text x="280" y="378" text-anchor="middle" font-size="9" fill="#a08030">示例 2：两个 2 都算</text>

    <rect x="375" y="274" width="165" height="132" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="457" y="296" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold">完全二叉树红利</text>
    <text x="457" y="318" text-anchor="middle" font-size="9.5" fill="#33506b">高 ≤ ⌊log₂n⌋ + 1</text>
    <text x="457" y="338" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">n = 10⁵ ⇒ 仅 17 层</text>
    <text x="457" y="358" text-anchor="middle" font-size="9" fill="#446688">递归深度无忧</text>
    <text x="457" y="378" text-anchor="middle" font-size="9" fill="#446688">另留数组化迭代后路</text>
  </g>
</svg>
