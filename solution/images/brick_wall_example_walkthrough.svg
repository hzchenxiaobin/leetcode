<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：wall = [[1,2,1,2],[3,1,2],[2,2,2]]</text>

  <!-- Three panels: row0 / row1 / row2, then result -->
  <!-- Panel 0: row 0 -->
  <rect x="10" y="40" width="180" height="340" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="10" y="40" width="180" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="100" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">row 0 = [1,2,1,2]</text>

  <!-- bricks in row: widths 1,2,1,2 -> pixel unit 16, start x=20, y=82 -->
  <rect x="20" y="82" width="16" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="36" y="82" width="32" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="68" y="82" width="16" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="84" y="82" width="32" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>

  <!-- gap ticks -->
  <line x1="36" y1="78" x2="36" y2="106" stroke="#b85450" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <line x1="68" y1="78" x2="68" y2="106" stroke="#b85450" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <line x1="84" y1="78" x2="84" y2="106" stroke="#b85450" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <text x="20" y="124" font-size="10.5" fill="#888">prefix 累加：</text>
  <text x="20" y="144" font-size="11" fill="#446688">+1 → <tspan font-weight="bold" fill="#d6a040">1</tspan></text>
  <text x="20" y="160" font-size="11" fill="#446688">+2 → <tspan font-weight="bold" fill="#d6a040">3</tspan></text>
  <text x="20" y="176" font-size="11" fill="#446688">+1 → <tspan font-weight="bold" fill="#d6a040">4</tspan></text>
  <text x="20" y="192" font-size="9.5" fill="#aaa">(末尾 +2=6 跳过)</text>

  <text x="20" y="216" font-size="10.5" fill="#555" font-weight="bold">写入 gap：</text>
  <rect x="20" y="222" width="160" height="44" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="100" y="242" text-anchor="middle" font-size="11" fill="#333">gap[1]=1</text>
  <text x="100" y="258" text-anchor="middle" font-size="11" fill="#333">gap[3]=1, gap[4]=1</text>

  <text x="20" y="288" font-size="10.5" fill="#555">maxGap 更新：</text>
  <text x="100" y="308" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">maxGap = 1</text>
  <text x="20" y="332" font-size="9.5" fill="#aaa" font-style="italic">三次 ++，每次都刷新</text>
  <text x="20" y="348" font-size="9.5" fill="#aaa" font-style="italic">max 为 1</text>

  <!-- Panel 1: row 1 -->
  <rect x="200" y="40" width="180" height="340" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="200" y="40" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">row 1 = [3,1,2]</text>

  <!-- bricks: 3,1,2 -> 48,16,32 -->
  <rect x="210" y="82" width="48" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="258" y="82" width="16" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="274" y="82" width="32" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>

  <line x1="258" y1="78" x2="258" y2="106" stroke="#b85450" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <line x1="274" y1="78" x2="274" y2="106" stroke="#b85450" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <text x="210" y="124" font-size="10.5" fill="#888">prefix 累加：</text>
  <text x="210" y="144" font-size="11" fill="#4a7a3a">+3 → <tspan font-weight="bold" fill="#d6a040">3</tspan></text>
  <text x="210" y="160" font-size="11" fill="#4a7a3a">+1 → <tspan font-weight="bold" fill="#d6a040">4</tspan></text>
  <text x="210" y="176" font-size="9.5" fill="#aaa">(末尾 +2=6 跳过)</text>

  <text x="210" y="216" font-size="10.5" fill="#555" font-weight="bold">更新 gap：</text>
  <rect x="210" y="222" width="160" height="44" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="290" y="242" text-anchor="middle" font-size="11" fill="#333">gap[3]=<tspan fill="#b85450" font-weight="bold">2</tspan></text>
  <text x="290" y="258" text-anchor="middle" font-size="11" fill="#333">gap[4]=<tspan fill="#b85450" font-weight="bold">2</tspan></text>

  <text x="210" y="288" font-size="10.5" fill="#555">maxGap 更新：</text>
  <text x="290" y="308" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">maxGap = 2</text>
  <text x="210" y="332" font-size="9.5" fill="#aaa" font-style="italic">位置 3 与 4 各 +1</text>
  <text x="210" y="348" font-size="9.5" fill="#aaa" font-style="italic">max 由 1 → 2</text>

  <!-- Panel 2: row 2 (final, max=3) -->
  <rect x="390" y="40" width="180" height="340" fill="#ffffff" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <rect x="390" y="40" width="180" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="480" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">row 2 = [2,2,2] ★</text>

  <!-- bricks: 2,2,2 -> 32,32,32 -->
  <rect x="400" y="82" width="32" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="432" y="82" width="32" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="464" y="82" width="32" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>

  <line x1="432" y1="78" x2="432" y2="106" stroke="#b85450" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <line x1="464" y1="78" x2="464" y2="106" stroke="#b85450" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <text x="400" y="124" font-size="10.5" fill="#888">prefix 累加：</text>
  <text x="400" y="144" font-size="11" fill="#d6a040">+2 → <tspan font-weight="bold" fill="#d6a040">2</tspan></text>
  <text x="400" y="160" font-size="11" fill="#d6a040">+2 → <tspan font-weight="bold" fill="#d6a040">4</tspan></text>
  <text x="400" y="176" font-size="9.5" fill="#aaa">(末尾 +2=6 跳过)</text>

  <text x="400" y="216" font-size="10.5" fill="#555" font-weight="bold">更新 gap：</text>
  <rect x="400" y="222" width="160" height="44" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="480" y="242" text-anchor="middle" font-size="11" fill="#333">gap[2]=1</text>
  <text x="480" y="258" text-anchor="middle" font-size="11" fill="#333">gap[4]=<tspan fill="#b85450" font-weight="bold">3 ★</tspan></text>

  <text x="400" y="288" font-size="10.5" fill="#555">maxGap 更新：</text>
  <text x="480" y="308" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">maxGap = 3</text>
  <text x="400" y="332" font-size="9.5" fill="#b85450" font-style="italic">位置 4 第三次命中</text>
  <text x="400" y="348" font-size="9.5" fill="#aaa" font-style="italic">max 由 2 → 3</text>

  <!-- bottom summary -->
  <rect x="10" y="394" width="560" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="416" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">最终：maxGap = 3 在位置 4（三行都有缝隙）→ 答案 = 3 − 3 = 0</text>
</svg>
