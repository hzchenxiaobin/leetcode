<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L8,0 L4,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="25" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一趟遍历 + 奇偶分配</text>

  <rect x="185" y="42" width="150" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="12" fill="#333">初始化 depth = 0</text>

  <path d="M 260 76 L 260 92" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="170" y="95" width="180" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="117" text-anchor="middle" font-size="12" fill="#333">遍历每个字符 c = seq[i]</text>

  <path d="M 260 129 L 260 145" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <path d="M 190 180 L 330 180 L 350 155 L 330 130 L 190 130 L 170 155 Z" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="160" text-anchor="middle" font-size="12" fill="#333">c == '(' ?</text>

  <path d="M 170 155 L 100 155 L 100 185" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="120" y="148" font-size="11" fill="#4a7a3a" font-weight="bold">Yes</text>

  <path d="M 350 155 L 420 155 L 420 185" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="380" y="148" font-size="11" fill="#b85450" font-weight="bold">No</text>

  <rect x="45" y="190" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="105" y="207" text-anchor="middle" font-size="11" fill="#333">depth++</text>
  <text x="105" y="220" text-anchor="middle" font-size="11" fill="#333">answer[i] = 1-depth%2</text>

  <rect x="350" y="190" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="420" y="207" text-anchor="middle" font-size="11" fill="#333">answer[i] = 1-depth%2</text>
  <text x="420" y="220" text-anchor="middle" font-size="11" fill="#333">depth--</text>

  <path d="M 105 224 L 105 250 Q 105 260 115 260 L 245 260" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 420 224 L 420 250 Q 420 260 410 260 L 275 260" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="200" y="245" width="120" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="265" text-anchor="middle" font-size="11" fill="#333">继续下一个字符</text>

  <path d="M 260 275 L 260 291" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="165" y="295" width="190" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="12" filter="url(#rough2)"/>
  <text x="260" y="317" text-anchor="middle" font-size="12" fill="#333">遍历结束，返回 answer</text>

  <rect x="40" y="345" width="440" height="42" fill="#e8f0fe" fill-opacity="0.4" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="362" text-anchor="middle" font-size="11" fill="#446688">奇数层 → answer=0（A），偶数层 → answer=1（B）</text>
  <text x="260" y="378" text-anchor="middle" font-size="11" fill="#666">匹配的 '(' 和 ')' 同层同奇偶 → 同组 → 各组均为合法 VPS</text>
</svg>
