<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="20" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：后序 DFS 一趟计数</text>

  <g filter="url(#rough2)">
    <text x="132" y="54" text-anchor="end" font-size="9" fill="#777">ans = 0 · 结束返回 ans</text>

    <rect x="140" y="34" width="120" height="30" rx="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="200" y="53" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold">dfs(node)</text>
    <path d="M 200 64 L 200 80" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)"/>

    <polygon points="200,84 268,112 200,140 132,112" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="200" y="116" text-anchor="middle" font-size="11" fill="#8a6d1a" font-weight="bold">node 为空？</text>

    <text x="281" y="105" text-anchor="middle" font-size="9" fill="#8a3030">是</text>
    <path d="M 268 112 L 292 112" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)"/>
    <rect x="296" y="92" width="196" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="394" y="107" text-anchor="middle" font-size="10" fill="#8a3030" font-weight="bold">返回 −∞（空子树零干扰）</text>
    <text x="394" y="124" text-anchor="middle" font-size="9" fill="#8a3030">本题值 ≥ 1，返回 0 亦可</text>

    <text x="210" y="156" text-anchor="middle" font-size="9" fill="#444">否</text>
    <path d="M 200 140 L 200 156" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)"/>

    <rect x="105" y="160" width="190" height="34" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
    <text x="200" y="181" text-anchor="middle" font-size="10" fill="#333">L = dfs(left)；R = dfs(right)</text>
    <path d="M 200 194 L 200 210" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)"/>

    <rect x="100" y="214" width="200" height="32" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
    <text x="200" y="234" text-anchor="middle" font-size="10" fill="#333">m = max(node.val, L, R)</text>
    <path d="M 200 246 L 200 262" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)"/>

    <polygon points="200,266 262,294 200,322 138,294" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="200" y="298" text-anchor="middle" font-size="11" fill="#8a6d1a" font-weight="bold">node.val == m ？</text>

    <text x="274" y="286" text-anchor="middle" font-size="9" fill="#2f5d24">是</text>
    <path d="M 262 294 L 286 294" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)"/>
    <rect x="290" y="277" width="140" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="360" y="298" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold">ans++（并列也算）</text>

    <path d="M 360 311 L 360 382 L 292 382" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)"/>

    <text x="210" y="340" text-anchor="middle" font-size="9" fill="#444">否</text>
    <path d="M 200 322 L 200 366" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)"/>

    <rect x="115" y="370" width="175" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="202" y="390" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">return m（子树最大值）</text>

    <rect x="352" y="32" width="188" height="56" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
    <text x="446" y="52" text-anchor="middle" font-size="9.5" fill="#555">每节点进出各一次 ⇒ O(n)</text>
    <text x="446" y="70" text-anchor="middle" font-size="9.5" fill="#555">树高 O(log n) ⇒ 递归栈无忧</text>
  </g>
</svg>
