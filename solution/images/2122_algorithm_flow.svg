<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：排序 → 枚举候选 k → 频次表贪心配对</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#888">外层枚举至多 2n 个候选 k，内层贪心 O(n) 配对</text>

  <!-- ===== Start ===== -->
  <ellipse cx="90" cy="74" rx="42" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="90" y="78" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">开始</text>

  <path d="M 90 96 L 90 118" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Sort ===== -->
  <rect x="36" y="120" width="108" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="90" y="138" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">排序 nums</text>
  <text x="90" y="154" text-anchor="middle" font-size="10" fill="#555">min = nums[0]</text>

  <path d="M 90 164 L 90 188" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Candidate loop diamond ===== -->
  <polygon points="90,190 168,224 90,258 12,224" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="90" y="220" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">还有候选 k?</text>
  <text x="90" y="236" text-anchor="middle" font-size="10" fill="#555">(nums[j]−min 偶且&gt;0)</text>

  <!-- YES branch right -->
  <path d="M 168 224 L 208 224" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="186" y="218" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- ===== Build freq ===== -->
  <rect x="208" y="202" width="150" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="283" y="220" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">建频次表 freq</text>
  <text x="283" y="236" text-anchor="middle" font-size="10" fill="#555">v 升序遍历，2k = diff</text>

  <path d="M 283 246 L 283 268" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Greedy match diamond ===== -->
  <polygon points="283,270 371,304 283,338 195,304" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="283" y="300" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">freq[v]&gt;0 且</text>
  <text x="283" y="316" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">freq[v+2k]&gt;0?</text>

  <!-- YES: pair -->
  <path d="M 371 304 L 412 304" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="388" y="298" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="412" y="282" width="96" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="460" y="300" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">配对</text>
  <text x="460" y="316" text-anchor="middle" font-size="10" fill="#555">记 v+k，两频次−1</text>

  <!-- loop back from pair to greedy diamond -->
  <path d="M 460 282 L 460 270 L 371 270" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="415" y="262" text-anchor="middle" font-size="9.5" fill="#4a7a3a">下一 v</text>

  <!-- NO from greedy: this k fails -->
  <path d="M 283 338 L 283 358" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="296" y="352" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <rect x="216" y="354" width="134" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="283" y="368" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">此 k 失败 → 换下一个 k</text>

  <!-- arrow from fail box back up to candidate loop (left side) -->
  <path d="M 216 364 L 12 364 L 12 224" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- NO from candidate loop: done checking -->
  <path d="M 90 258 L 90 278" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="102" y="274" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- ===== Check pairs == n ===== -->
  <rect x="36" y="280" width="108" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="90" y="298" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">配对数 == n?</text>
  <text x="90" y="314" text-anchor="middle" font-size="10" fill="#555">是 → 返回 arr</text>

  <path d="M 90 324 L 90 346" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ===== Return ===== -->
  <ellipse cx="90" cy="364" rx="52" ry="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="90" y="368" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">返回 arr</text>

  <!-- legend footer -->
  <text x="430" y="364" text-anchor="middle" font-size="9.5" fill="#aaa">题面保证至少一组解</text>
  <text x="430" y="374" text-anchor="middle" font-size="9.5" fill="#aaa">首个成功即返回</text>
</svg>
