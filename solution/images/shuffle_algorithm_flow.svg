<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">Fisher-Yates 洗牌算法流程</text>

  <!-- 开始 -->
  <rect x="200" y="48" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="16" filter="url(#rough2)"/>
  <text x="260" y="70" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">arr = nums 拷贝</text>
  <path d="M 260 82 L 260 98" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 i -->
  <rect x="180" y="100" width="160" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="125" text-anchor="middle" font-size="12" fill="#446688">i = n − 1</text>
  <path d="M 260 140 L 260 158" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定 i >= 1 -->
  <polygon points="260,160 340,200 260,240 180,200" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="196" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">i ≥ 1 ?</text>
  <text x="260" y="212" text-anchor="middle" font-size="10.5" fill="#888">(还有未锁定位)</text>

  <!-- 否：结束 -->
  <path d="M 340 200 L 410 200" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="362" y="194" font-size="11" fill="#888">否</text>
  <rect x="410" y="183" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="16" filter="url(#rough2)"/>
  <text x="455" y="205" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 arr</text>

  <!-- 是：进入循环体 -->
  <path d="M 260 240 L 260 258" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="254" font-size="11" fill="#888">是</text>

  <!-- 选 j -->
  <rect x="170" y="260" width="180" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="285" text-anchor="middle" font-size="11.5" fill="#446688">j = random ∈ [0, i]</text>
  <path d="M 260 300 L 260 318" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 交换 -->
  <rect x="150" y="320" width="220" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="348" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">swap(arr[i], arr[j])</text>
  <text x="260" y="336" text-anchor="middle" font-size="9.5" fill="#b85450">arr[i] 锁定为结果</text>
  <path d="M 260 364 L 260 382" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i-- -->
  <rect x="190" y="384" width="140" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="409" text-anchor="middle" font-size="12" fill="#446688">i = i − 1</text>

  <!-- 回到判定 -->
  <path d="M 190 404 Q 110 404 110 200 Q 110 200 178 200" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="100" y="300" font-size="10.5" fill="#888">回到判定</text>

  <!-- 侧注：复杂度 -->
  <rect x="370" y="270" width="135" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="390" y="292" font-size="11.5" fill="#4a7a3a" font-weight="bold">复杂度</text>
  <text x="390" y="310" font-size="10.5" fill="#555">时间：O(n)</text>
  <text x="390" y="326" font-size="10.5" fill="#555">额外空间：O(1)</text>
  <text x="390" y="342" font-size="10.5" fill="#555">单遍 n−1 次交换</text>
  <text x="390" y="358" font-size="10.5" fill="#888">每排列概率 1/n!</text>
</svg>
