<svg xmlns="http://www.w3.org/2000/svg" width="700" height="290" viewBox="0 0 700 290"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="343"/>
    <feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></defs>
  <rect width="700" height="290" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">交换论证的细节（为什么排序配对最优）</text>
  <path d="M 140 40 Q 350 46 560 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="70" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="13" fill="#22314a" filter="url(#rough2)">设 a ≤ b、i ≤ j。要证 |a−i| + |b−j| ≤ |a−j| + |b−i|。</text>
  <text x="76" y="106" font-size="12" fill="#2f4a66" filter="url(#rough2)">这是函数 f(x)=|x−t| 的凸性 / Monge 性质：代价矩阵是 Monge 阵，最优匹配必保序。</text>
  <text x="76" y="122" font-size="12" fill="#2f4a66" filter="url(#rough2)">（也可直接按 a,b,i,j 的六种大小关系逐一验证。）</text>
  <g filter="url(#rough2)"><rect x="60" y="140" width="580" height="60" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="164" font-size="12.5" fill="#2f5223" filter="url(#rough2)">于是最优解就是"排序后第 i 个配 i"。复杂度：排序 O(n log n)。</text>
  <text x="76" y="186" font-size="12.5" fill="#2f5223" filter="url(#rough2)">n = 3·10⁵ 实测 0.06 s（1 s 时限）。</text>
  <g filter="url(#rough2)"><rect x="60" y="212" width="580" height="60" rx="8" fill="#fbeeee" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="76" y="236" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">易错：以为要"逐个位置对应"直接改（不许重排）——题面允许重排（把序列变成排列）。</text>
  <text x="76" y="258" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">另一易错：用 int 累加导致溢出。</text>
</svg>
