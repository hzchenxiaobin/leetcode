<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="300" fill="#fafafa"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">196A 样例与为什么不能“只取最大字符”</text>
  <path d="M 205.94000000000003 46 Q 380.0 52 554.06 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60.0" y="76.0" width="660.0" height="36.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="68.0" y="105.0" text-anchor="start" font-size="11.0" font-weight="bold" fill="#26405c" filter="url(#rough2)">s</text>
  <text x="288.0" y="105.0" text-anchor="start" font-size="11.0" font-weight="bold" fill="#26405c" filter="url(#rough2)">答案</text>
  <text x="428.0" y="105.0" text-anchor="start" font-size="11.0" font-weight="bold" fill="#26405c" filter="url(#rough2)">说明</text>
  <path d="M 60.0 76.0 L 720.0 76.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="68.0" y="141.0" text-anchor="start" font-size="11.0" fill="#2b2b2b" filter="url(#rough2)">ababba</text>
  <text x="288.0" y="141.0" text-anchor="start" font-size="11.0" fill="#2b2b2b" filter="url(#rough2)">bbba</text>
  <text x="428.0" y="141.0" text-anchor="start" font-size="11.0" fill="#2b2b2b" filter="url(#rough2)">第 2、4、5 个 b 与末尾 a</text>
  <path d="M 60.0 112.0 L 720.0 112.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="68.0" y="177.0" text-anchor="start" font-size="11.0" fill="#2b2b2b" filter="url(#rough2)">abbcbccacbbcbaaba</text>
  <text x="288.0" y="177.0" text-anchor="start" font-size="11.0" fill="#2b2b2b" filter="url(#rough2)">cccccbba</text>
  <text x="428.0" y="177.0" text-anchor="start" font-size="11.0" fill="#2b2b2b" filter="url(#rough2)">所有 c 之后接 bba</text>
  <path d="M 60.0 148.0 L 720.0 148.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <rect x="60.0" y="210.0" width="640.0" height="60.0" rx="9" fill="#fdf0ef" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="234.0" text-anchor="start" font-size="10.8" fill="#8a3a36" filter="url(#rough2)">反例：s = "ba"。若只取最大字符 b，得到 "b"；但 "ba" &gt; "b"（b 相同、更长），所以要把后面的字符也接上。</text>
  <text x="74.0" y="256.0" text-anchor="start" font-size="10.8" fill="#8a3a36" filter="url(#rough2)">“后缀最大值”规则正好保证：在第一个最大字符之后，继续取后面能取到的最大字符。</text>
</svg>
