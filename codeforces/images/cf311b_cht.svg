<svg xmlns="http://www.w3.org/2000/svg" width="700" height="290" viewBox="0 0 700 290"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="1113"/>
    <feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></defs>
  <rect width="700" height="290" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">DP + 斜率优化（单调凸包）</text>
  <path d="M 150 40 Q 350 46 550 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="86" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="12.5" fill="#22314a" filter="url(#rough2)">dp[j][i] = 前 i 只猫用 j 个喂猫人：dp[j][i] = min_{k&lt;i} dp[j−1][k] + (i−k)a_i − (S_i − S_k)</text>
  <text x="76" y="106" font-size="12.5" fill="#22314a" filter="url(#ruff2)">整理成直线：dp[j][i] = a_i·i − S_i + min_k [ (dp[j−1][k] + S_k) − a_i·k ]</text>
  <text x="76" y="130" font-size="12.5" fill="#22314a" filter="url(#rough2)">⇒ 每个 k 是一条斜率 −k、截距 dp[j−1][k]+S_k 的直线，查询 x = a_i。</text>
  <g filter="url(#rough2)"><rect x="60" y="152" width="580" height="76" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="176" font-size="12.5" fill="#2f5223" filter="url(#rough2)">k 递增 ⇒ 斜率 −k 单调递减；a 已排序 ⇒ 查询 x 单调递增 ⇒ 单调凸包 O(1) 摊销。</text>
  <text x="76" y="200" font-size="12.5" fill="#2f5223" filter="url(#rough2)">总复杂度 O(mp)，m ≤ 10⁵、p ≤ 100 ⇒ 10⁷，实测 0.14 s。</text>
  <text x="76" y="224" font-size="12px" fill="#3c5e2e" filter="url(#rough2)">注意：dp[j][0] = 0（前 0 只猫代价 0），答案取 min_{j≤p} dp[j][m]。</text>
  <g filter="url(#rough2)"><rect x="60" y="240" width="580" height="36" rx="8" fill="#fbeeee" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="76" y="262" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">易错：叉积用 __int128 防溢出；a_i 可为负（前缀和与截距要允许负）。</text>
</svg>
