<svg xmlns="http://www.w3.org/2000/svg" width="880" height="220" viewBox="0 0 880 220"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="220" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按"距离 d 落在哪个区间"批量计数</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">floor((2t-d)/l) 只与 d 和 r = 2t mod l 有关</text>
  <text x="150" y="100" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">记 M = 2t，q = M/l，r = M mod l：d &lt;= r 时取 q+1，r &lt; d &lt;= M 时取 q</text>
  <text x="150" y="140" text-anchor="start" font-size="12" fill="#2f4a66" filter="url(#rough2)">用双指针求 C(X)=#{a_j-a_i &lt;= X}，区间计数后求和，最后除以 4</text>
</svg>
