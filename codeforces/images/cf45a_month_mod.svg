<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="451"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8a2b28"/>
    </marker>
  </defs>
  <rect width="760" height="330" fill="#fafafa"/>
  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">12 个月首尾相接：答案是 (idx + k) mod 12</text>
  <path d="M 60 40 Q 380 48 700 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <g font-size="9">
    <rect x="20" y="86" width="56" height="40" rx="7" fill="#cfe0f5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="48" y="103" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">Jan</text>
    <text x="48" y="117" text-anchor="middle" fill="#555555" filter="url(#rough2)">0</text>
    <rect x="80" y="86" width="56" height="40" rx="7" fill="#cfe0f5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="108" y="103" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">Feb</text>
    <text x="108" y="117" text-anchor="middle" fill="#555555" filter="url(#rough2)">1</text>
    <rect x="140" y="86" width="56" height="40" rx="7" fill="#cfe0f5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="168" y="103" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">Mar</text>
    <text x="168" y="117" text-anchor="middle" fill="#555555" filter="url(#rough2)">2</text>
    <rect x="200" y="86" width="56" height="40" rx="7" fill="#cfe0f5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="228" y="103" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">Apr</text>
    <text x="228" y="117" text-anchor="middle" fill="#555555" filter="url(#rough2)">3</text>
    <rect x="260" y="86" width="56" height="40" rx="7" fill="#d9ecd4" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="288" y="103" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">May</text>
    <text x="288" y="117" text-anchor="middle" fill="#555555" filter="url(#rough2)">4</text>
    <rect x="320" y="86" width="56" height="40" rx="7" fill="#cfe0f5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="348" y="103" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">Jun</text>
    <text x="348" y="117" text-anchor="middle" fill="#555555" filter="url(#rough2)">5</text>
    <rect x="380" y="86" width="56" height="40" rx="7" fill="#cfe0f5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="408" y="103" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">Jul</text>
    <text x="408" y="117" text-anchor="middle" fill="#555555" filter="url(#rough2)">6</text>
    <rect x="440" y="86" width="56" height="40" rx="7" fill="#cfe0f5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="468" y="103" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">Aug</text>
    <text x="468" y="117" text-anchor="middle" fill="#555555" filter="url(#rough2)">7</text>
    <rect x="500" y="86" width="56" height="40" rx="7" fill="#cfe0f5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="528" y="103" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">Sep</text>
    <text x="528" y="117" text-anchor="middle" fill="#555555" filter="url(#rough2)">8</text>
    <rect x="560" y="86" width="56" height="40" rx="7" fill="#cfe0f5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="588" y="103" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">Oct</text>
    <text x="588" y="117" text-anchor="middle" fill="#555555" filter="url(#rough2)">9</text>
    <rect x="620" y="86" width="56" height="40" rx="7" fill="#fbe3c8" stroke="#8a2b28" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="648" y="103" text-anchor="middle" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">Nov</text>
    <text x="648" y="117" text-anchor="middle" fill="#8a2b28" filter="url(#rough2)">10</text>
    <rect x="680" y="86" width="56" height="40" rx="7" fill="#cfe0f5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="708" y="103" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">Dec</text>
    <text x="708" y="117" text-anchor="middle" fill="#555555" filter="url(#rough2)">11</text>
  </g>

  <path d="M 648 78 Q 380 30 108 78" stroke="#8a2b28" stroke-width="1.8" fill="none"
        marker-end="url(#arrk)" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="378" y="52" text-anchor="middle" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">November + 3：10 + 3 = 13，13 mod 12 = 1 → February</text>

  <rect x="60" y="170" width="640" height="60" rx="10" fill="#d9ecd4" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="80" y="196" font-size="12" fill="#2b2b2b" filter="url(#rough2)">November 的下标 idx = 10（0 起），k = 3；</text>
  <text x="80" y="216" font-size="12" fill="#2b2b2b" filter="url(#rough2)">(10 + 3) mod 12 = 1，月份表第 1 项是 February。</text>

  <rect x="60" y="246" width="640" height="60" rx="10" fill="#fbe3c8" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="80" y="272" font-size="12" fill="#2b2b2b" filter="url(#rough2)">k 可以大于 12：May 的 idx = 4，k = 24 时 (4 + 24) mod 12 = 4，仍是 May。</text>
  <text x="80" y="292" font-size="12" fill="#2b2b2b" filter="url(#rough2)">所以取模只需做一次，不必真的绕两圈。</text>
</svg>
