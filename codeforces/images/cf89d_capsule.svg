<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="903"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="340" fill="#fafafa"/>
  <text x="360.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">尖刺 + 半径 R ⇒ 胶囊体</text>
  <path d="M 115.2 42 Q 360.0 48 604.8 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="360.0" y="326" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">圆柱（垂足在线段内）+ 两个端点球</text>
  <line x1="130" y1="200" x2="560" y2="150" stroke="#5a5a5a" stroke-width="3" filter="url(#rough2)"/>
  <line x1="130" y1="148" x2="560" y2="98" stroke="#5a7fb0" stroke-width="1.4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <line x1="130" y1="252" x2="560" y2="202" stroke="#5a7fb0" stroke-width="1.4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <circle cx="130" cy="200" r="52" fill="#dfe8f3" fill-opacity="0.5" stroke="#5a7fb0" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="560" cy="150" r="52" fill="#fbeadb" fill-opacity="0.5" stroke="#d98c3f" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="130" y="278" text-anchor="middle" font-size="12" fill="#335478" filter="url(#rough2)">O（矿心）</text>
  <text x="560" y="228" text-anchor="middle" font-size="12" fill="#9a5d1c" filter="url(#rough2)">O+p（刺尖）</text>
  <text x="345.0" y="109.0" text-anchor="middle" font-size="12" fill="#335478" filter="url(#rough2)">圆柱部分：垂足在线段内、垂距 ≤ R</text>
  <text x="345.0" y="249.0" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">两端球：到 O / O+p 的距离 ≤ R</text>
  <rect x="40" y="262" width="640" height="52" rx="9" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="284" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">三部分各自给出一个关于 t 的二次不等式，解集是区间</text>
  <text x="360" y="304" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">取所有区间的左端点（截断到 t ≥ 0）的最小值</text>
</svg>
