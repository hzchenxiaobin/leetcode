<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="720" height="430" fill="#fafafa"/>
  <text x="360.0" y="33" font-size="20" font-weight="bold" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">bHTML 文法与 &lt;td&gt; 的归属</text>
  <path d="M 261 44 Q 360.0 50 459 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="20" y="60" width="336" height="292" rx="8" fill="#f5f0e6" stroke="#9a8c6a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="34" y="82" font-size="12.5" font-weight="bold" fill="#2b2b2b" text-anchor="start" filter="url(#rough2)">文法（空白仅为排版）</text>
  <text x="36" y="112" font-size="11.5" font-weight="normal" fill="#5b4a2a" text-anchor="start" filter="url(#rough2)">TABLE</text>
  <text x="100" y="112" font-size="11.5" font-weight="normal" fill="#22303f" text-anchor="start" filter="url(#rough2)">::= &lt;table&gt; ROWS &lt;/table&gt;</text>
  <text x="36" y="142" font-size="11.5" font-weight="normal" fill="#5b4a2a" text-anchor="start" filter="url(#rough2)">ROWS</text>
  <text x="100" y="142" font-size="11.5" font-weight="normal" fill="#22303f" text-anchor="start" filter="url(#rough2)">::= ROW | ROW ROWS</text>
  <text x="36" y="172" font-size="11.5" font-weight="normal" fill="#5b4a2a" text-anchor="start" filter="url(#rough2)">ROW</text>
  <text x="100" y="172" font-size="11.5" font-weight="normal" fill="#22303f" text-anchor="start" filter="url(#rough2)">::= &lt;tr&gt; CELLS &lt;/tr&gt;</text>
  <text x="36" y="202" font-size="11.5" font-weight="normal" fill="#5b4a2a" text-anchor="start" filter="url(#rough2)">CELLS</text>
  <text x="100" y="202" font-size="11.5" font-weight="normal" fill="#22303f" text-anchor="start" filter="url(#rough2)">::= CELL | CELL CELLS</text>
  <text x="36" y="232" font-size="11.5" font-weight="normal" fill="#5b4a2a" text-anchor="start" filter="url(#rough2)">CELL</text>
  <text x="100" y="232" font-size="11.5" font-weight="normal" fill="#22303f" text-anchor="start" filter="url(#rough2)">::= &lt;td&gt;&lt;/td&gt;</text>
  <text x="36" y="262" font-size="11.5" font-weight="normal" fill="#5b4a2a" text-anchor="start" filter="url(#rough2)">CELL</text>
  <text x="100" y="262" font-size="11.5" font-weight="normal" fill="#22303f" text-anchor="start" filter="url(#rough2)">::= &lt;td&gt; TABLE &lt;/td&gt;</text>
  <text x="36" y="298" font-size="10.5" font-weight="normal" fill="#5b4a2a" text-anchor="start" filter="url(#rough2)">每张表至少 1 行，每行至少 1 格；</text>
  <text x="36" y="318" font-size="10.5" font-weight="normal" fill="#5b4a2a" text-anchor="start" filter="url(#rough2)">一整对 &lt;table&gt;…&lt;/table&gt; 就是一张表。</text>
  <text x="530" y="61" font-size="12.5" font-weight="bold" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">样例 2 的嵌套结构</text>
  <rect x="425.0" y="70" width="210" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="530" y="87" font-size="12" font-weight="bold" fill="#22303f" text-anchor="middle" filter="url(#rough2)">根表 table</text>
  <text x="530" y="102" font-size="9.5" font-weight="normal" fill="#555" text-anchor="middle" filter="url(#rough2)">它的直接格：1 个</text>
  <rect x="425.0" y="140" width="210" height="40" rx="8" fill="#f4f4f4" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="530" y="157" font-size="12" font-weight="bold" fill="#22303f" text-anchor="middle" filter="url(#rough2)">&lt;tr&gt; 行</text>
  <text x="530" y="172" font-size="9.5" font-weight="normal" fill="#555" text-anchor="middle" filter="url(#rough2)">行本身不计数</text>
  <rect x="425.0" y="210" width="210" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="530" y="227" font-size="12" font-weight="bold" fill="#22303f" text-anchor="middle" filter="url(#rough2)">&lt;td&gt; 外层格</text>
  <text x="530" y="242" font-size="9.5" font-weight="normal" fill="#555" text-anchor="middle" filter="url(#rough2)">给根表 +1</text>
  <rect x="425.0" y="280" width="210" height="40" rx="8" fill="#fff8e1" stroke="#b08a2e" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="530" y="297" font-size="12" font-weight="bold" fill="#22303f" text-anchor="middle" filter="url(#rough2)">内层 table（4 行）</text>
  <text x="530" y="312" font-size="9.5" font-weight="normal" fill="#555" text-anchor="middle" filter="url(#rough2)">内层直接格：4 个</text>
  <rect x="425.0" y="350" width="210" height="40" rx="8" fill="#fde8e8" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="530" y="367" font-size="12" font-weight="bold" fill="#22303f" text-anchor="middle" filter="url(#rough2)">内层 4 个 &lt;td&gt;</text>
  <text x="530" y="382" font-size="9.5" font-weight="normal" fill="#555" text-anchor="middle" filter="url(#rough2)">只算给内层表</text>
  <g filter="url(#rough2)">
    <path d="M 530 113 L 530 137" stroke="#7a8b9a" stroke-width="1.3" fill="none"/>
    <polygon points="530,137 525,128 535,128" fill="#7a8b9a"/>
  </g>
  <g filter="url(#rough2)">
    <path d="M 530 183 L 530 207" stroke="#7a8b9a" stroke-width="1.3" fill="none"/>
    <polygon points="530,207 525,198 535,198" fill="#7a8b9a"/>
  </g>
  <g filter="url(#rough2)">
    <path d="M 530 253 L 530 277" stroke="#7a8b9a" stroke-width="1.3" fill="none"/>
    <polygon points="530,277 525,268 535,268" fill="#7a8b9a"/>
  </g>
  <g filter="url(#rough2)">
    <path d="M 530 323 L 530 347" stroke="#7a8b9a" stroke-width="1.3" fill="none"/>
    <polygon points="530,347 525,338 535,338" fill="#7a8b9a"/>
  </g>
  <text x="360" y="410" font-size="11.5" font-weight="bold" fill="#555" text-anchor="middle" filter="url(#rough2)">结论：&lt;td&gt; 一定属于“最近的、还没闭合的那张表”，与 tr 无关</text>
</svg>
