<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>

  <rect width="760" height="440" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">Q_A 的求法：深度 h 必可行；其余只取「分支节点」的深度</text>
  <path d="M 96 42 Q 380 49 664 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 左侧：以 u 为根的 A 侧结构 -->
  <rect x="24" y="58" width="386" height="300" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="217" y="80" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">A 侧（以 u 为根，屏蔽中心边）</text>

  <path d="M 217 108 L 217 152" stroke="#446688" stroke-width="1.7" fill="none" filter="url(#rough2)"/>
  <path d="M 217 168 L 217 206" stroke="#446688" stroke-width="1.7" fill="none" filter="url(#rough2)"/>
  <path d="M 217 222 L 155 292" stroke="#446688" stroke-width="1.7" fill="none" filter="url(#rough2)"/>
  <path d="M 217 222 L 280 292" stroke="#446688" stroke-width="1.7" fill="none" filter="url(#rough2)"/>

  <ellipse cx="217" cy="100" rx="16" ry="16" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="217" y="105" text-anchor="middle" font-size="12" fill="#7d2b26" filter="url(#rough2)">u</text>
  <ellipse cx="217" cy="160" rx="15" ry="15" fill="#ffffff" stroke="#999" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="217" y="165" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">m</text>
  <ellipse cx="217" cy="214" rx="15" ry="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="217" y="219" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">w</text>
  <ellipse cx="155" cy="300" rx="15" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <ellipse cx="280" cy="300" rx="15" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="155" y="305" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">x₁</text>
  <text x="280" y="305" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">x₂</text>

  <!-- 深度刻度 -->
  <path d="M 44 100 L 44 300" stroke="#bbb" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 38 100 L 50 100" stroke="#bbb" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 38 160 L 50 160" stroke="#bbb" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 38 214 L 50 214" stroke="#bbb" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 38 300 L 50 300" stroke="#bbb" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="68" y="104" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <text x="68" y="164" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">1</text>
  <text x="68" y="218" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">2</text>
  <text x="68" y="304" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">h</text>

  <!-- 标注 -->
  <text x="288" y="150" text-anchor="start" font-size="11" fill="#888" filter="url(#rough2)">只有一个孩子含最深点</text>
  <text x="288" y="166" text-anchor="start" font-size="11" fill="#888" filter="url(#rough2)">⇒ 不是分支</text>
  <text x="288" y="206" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">两个孩子都含最深点</text>
  <text x="288" y="222" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">⇒ 深度 2 可选</text>
  <text x="217" y="346" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">x₁、x₂ 是 A 侧深度 h 的点，LCA 恰好落在 w</text>

  <!-- 右侧：判定与结论 -->
  <rect x="424" y="58" width="312" height="132" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="580" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">两条规则</text>
  <text x="438" y="106" text-anchor="start" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">① 深度 h 必可选：取同一个端点两次</text>
  <text x="438" y="128" text-anchor="start" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">② 深度 d &lt; h 可选 ⇔ 存在深度 d</text>
  <text x="438" y="149" text-anchor="start" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">的节点，其孩子中含最深点的个数 ≥ 2</text>
  <text x="438" y="175" text-anchor="start" font-size="11.5" fill="#7d2b26" filter="url(#rough2)">⇒ Q_A = {h} ∪ { dep(w) : w 分支 }</text>

  <rect x="424" y="206" width="312" height="152" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="580" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">例：h = 3 时的 Q_A</text>

  <circle cx="482" cy="268" r="16" fill="#ffffff" stroke="#bbb" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="482" y="273" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">0</text>
  <circle cx="538" cy="268" r="16" fill="#ffffff" stroke="#bbb" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="538" y="273" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">1</text>
  <circle cx="594" cy="268" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="594" y="273" text-anchor="middle" font-size="12" fill="#31602c" filter="url(#rough2)">2</text>
  <circle cx="650" cy="268" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="650" y="273" text-anchor="middle" font-size="12" fill="#7d2b26" filter="url(#rough2)">3</text>

  <text x="580" y="306" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">填色位置 Q_A = {2, 3}，其中 3 = h 恒可选</text>
  <text x="580" y="328" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">深度 0、1 的 u、m 只有一个孩子含最深点</text>
  <text x="580" y="348" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">⇒ 不能当 LCA，对应深度不进 Q_A</text>

  <rect x="24" y="374" width="712" height="46" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="403" text-anchor="middle" font-size="13" fill="#31602c" filter="url(#rough2)">两侧独立 ⇒ 答案集 = Q_A ⊕ Q_B + 1（Minkowski 和，用卷积求所有可达下标）</text>
</svg>
