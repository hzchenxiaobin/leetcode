<svg xmlns="http://www.w3.org/2000/svg" width="880" height="392" viewBox="0 0 880 392"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="117"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="392" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">数字菱形：第 i 行缩进 2|i| 个空格</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">0..n−|i| 再降到 0，单个空格分隔</text>
  <text x="60" y="102" text-anchor="end" font-size="10" fill="#777777" filter="url(#rough2)">i=-3</text>
  <text x="120" y="102" text-anchor="start" font-size="14" fill="#2b2b2b" filter="url(#rough2)">      0</text>
  <text x="60" y="132" text-anchor="end" font-size="10" fill="#777777" filter="url(#rough2)">i=-2</text>
  <text x="120" y="132" text-anchor="start" font-size="14" fill="#2b2b2b" filter="url(#rough2)">    0 1 0</text>
  <text x="60" y="162" text-anchor="end" font-size="10" fill="#777777" filter="url(#rough2)">i=-1</text>
  <text x="120" y="162" text-anchor="start" font-size="14" fill="#2b2b2b" filter="url(#rough2)">  0 1 2 1 0</text>
  <text x="60" y="192" text-anchor="end" font-size="10" fill="#777777" filter="url(#rough2)">i=0</text>
  <text x="120" y="192" text-anchor="start" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">0 1 2 3 2 1 0</text>
  <text x="60" y="222" text-anchor="end" font-size="10" fill="#777777" filter="url(#rough2)">i=1</text>
  <text x="120" y="222" text-anchor="start" font-size="14" fill="#2b2b2b" filter="url(#rough2)">  0 1 2 1 0</text>
  <text x="60" y="252" text-anchor="end" font-size="10" fill="#777777" filter="url(#rough2)">i=2</text>
  <text x="120" y="252" text-anchor="start" font-size="14" fill="#2b2b2b" filter="url(#rough2)">    0 1 0</text>
  <text x="60" y="282" text-anchor="end" font-size="10" fill="#777777" filter="url(#rough2)">i=3</text>
  <text x="120" y="282" text-anchor="start" font-size="14" fill="#2b2b2b" filter="url(#rough2)">      0</text>
  <text x="620" y="150" text-anchor="start" font-size="11" fill="#2f4a66" filter="url(#rough2)">行数 2n+1</text>
  <text x="620" y="178" text-anchor="start" font-size="11" fill="#555555" filter="url(#rough2)">最长行 2n+1 个数字</text>
  <text x="620" y="206" text-anchor="start" font-size="11" fill="#8a2b28" filter="url(#rough2)">行末不留空格</text>
</svg>
