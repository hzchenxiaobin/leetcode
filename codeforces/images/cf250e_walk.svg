  <text x="470" y="204" text-anchor="start" font-size="12.5" fill="#b05a5a" filter="url(#rough2)">落到第 4 列</text>
  <text x="96" y="278" text-anchor="end" font-size="12.5" fill="#555555" filter="url(#rough2)">第 1 层</text>
