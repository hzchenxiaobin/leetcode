  <text x="324.0" y="275.04" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">.</text>
  <text x="360" y="278" text-anchor="start" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">耗时 0 s</text>
  <text x="470" y="278" text-anchor="start" font-size="12.5" fill="#b05a5a" filter="url(#rough2)">终点</text>
  <text x="700" y="150" text-anchor="start" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">7 + 7 = 14</text>
  <text x="700" y="180" text-anchor="start" font-size="12" fill="#555555" filter="url(#rough2)">与官方输出一致</text>
  <text x="440" y="340" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">注意第 3 层里的 # 是墙，不是砖：撞墙只转身、不消除</text>
