<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="360" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例走查：第 3 层 7 秒、第 2 层 7 秒，共 14 秒</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">第 3 层落到第 2 行第 3 列；第 2 层落到第 1 行第 5 列，随后抵达第 1 层</text>
  <text x="96" y="130" text-anchor="end" font-size="12.5" fill="#555555" filter="url(#rough2)">第 3 层</text>
  <g filter="url(#rough2)"><rect x="120" y="100" width="40" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="140.0" y="127.04" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">.</text>
  <g filter="url(#rough2)"><rect x="166" y="100" width="40" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="186.0" y="127.04" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">.</text>
