  <text x="232.0" y="127.04" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">+</text>
  <g filter="url(#rough2)"><rect x="258" y="100" width="40" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="278.0" y="127.04" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">.</text>
  <g filter="url(#rough2)"><rect x="304" y="100" width="40" height="44" rx="4" fill="#e2e2e2" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="324.0" y="127.04" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">#</text>
  <text x="360" y="130" text-anchor="start" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">耗时 7 s</text>
  <text x="470" y="130" text-anchor="start" font-size="12.5" fill="#b05a5a" filter="url(#rough2)">落到第 2 列</text>
