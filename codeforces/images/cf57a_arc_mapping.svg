<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="211"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="a57" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="460" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">把边界展开成周长为 4n 的环：每个边界点对应唯一的 t</text>
  <path d="M 110 42 Q 360 48 610 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 正方形：顶点 (0,0) 左下 -->
  <g filter="url(#rough2)">
    <rect x="180" y="90" width="330" height="270" fill="#ffffff" stroke="#446688" stroke-width="2.2"/>

    <!-- 四边分别着色 -->
    <line x1="180" y1="360" x2="510" y2="360" stroke="#4a7a3a" stroke-width="4"/>
    <line x1="510" y1="360" x2="510" y2="90" stroke="#d6a040" stroke-width="4"/>
    <line x1="510" y1="90" x2="180" y2="90" stroke="#b85450" stroke-width="4"/>
    <line x1="180" y1="90" x2="180" y2="360" stroke="#446688" stroke-width="4"/>

    <!-- 顶点 -->
    <circle cx="180" cy="360" r="6" fill="#ffffff" stroke="#2b2b2b" stroke-width="2"/>
    <circle cx="510" cy="360" r="6" fill="#ffffff" stroke="#2b2b2b" stroke-width="2"/>
    <circle cx="510" cy="90" r="6" fill="#ffffff" stroke="#2b2b2b" stroke-width="2"/>
    <circle cx="180" cy="90" r="6" fill="#ffffff" stroke="#2b2b2b" stroke-width="2"/>

    <text x="150" y="378" font-size="11.5" font-weight="bold" fill="#2b2b2b">(0,0)</text>
    <text x="520" y="378" font-size="11.5" font-weight="bold" fill="#2b2b2b">(n,0)</text>
    <text x="520" y="84" font-size="11.5" font-weight="bold" fill="#2b2b2b">(n,n)</text>
    <text x="146" y="84" font-size="11.5" font-weight="bold" fill="#2b2b2b">(0,n)</text>

    <!-- 边上的 t 标记 -->
    <text x="345" y="382" text-anchor="middle" font-size="12" fill="#2f5223">t = x　（0 → n）</text>
    <text x="600" y="230" text-anchor="middle" font-size="12" fill="#8a6015">t = n + y</text>
    <text x="345" y="76" text-anchor="middle" font-size="12" fill="#8f3a34">t = 2n + (n − x)　（2n → 3n）</text>
    <text x="88" y="230" text-anchor="middle" font-size="12" fill="#2f4a66">t = 3n + (n − y)</text>

    <!-- 方向箭头 -->
    <path d="M 260 348 L 320 348" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#a57)"/>
    <path d="M 498 300 L 498 250" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#a57)"/>
    <path d="M 430 102 L 370 102" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#a57)"/>
    <path d="M 192 160 L 192 210" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#a57)"/>
  </g>

  <!-- 底部：两个点的两段弧 -->
  <g filter="url(#rough2)">
    <rect x="40" y="398" width="640" height="48" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="56" y="420" font-size="12" fill="#2f5223">两点把环切成两段：d = |t₁ − t₂| 与 4n − d；答案 = min(d, 4n − d)。</text>
    <text x="56" y="438" font-size="11.5" fill="#3c5e2e">顶点虽然属于两条边，但按「下边 → 右边 → 上边 → 左边」的顺序判定，每个顶点只会得到一个 t。</text>
  </g>
</svg>
