<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="300" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2：K=30 → S=15</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">6+3+6 = 5+5+5 = 4+7+4 = 15，两条对角线与列也都等于 15</text>
  <g filter="url(#rough2)"><rect x="220" y="90" width="90" height="46" rx="4" fill="#f6d9d7" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="265.0" y="118.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">6</text>
  <g filter="url(#rough2)"><rect x="330" y="90" width="90" height="46" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="375.0" y="118.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="440" y="90" width="90" height="46" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="485.0" y="118.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">6</text>
  <g filter="url(#rough2)"><rect x="220" y="150" width="90" height="46" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="265.0" y="178.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <g filter="url(#rough2)"><rect x="330" y="150" width="90" height="46" rx="4" fill="#f6d9d7" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="375.0" y="178.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <g filter="url(#rough2)"><rect x="440" y="150" width="90" height="46" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="485.0" y="178.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <g filter="url(#rough2)"><rect x="220" y="210" width="90" height="46" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="265.0" y="238.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><rect x="330" y="210" width="90" height="46" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="375.0" y="238.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">7</text>
  <g filter="url(#rough2)"><rect x="440" y="210" width="90" height="46" rx="4" fill="#f6d9d7" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="485.0" y="238.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="600" y="120" text-anchor="start" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">行和 = 15</text>
  <text x="600" y="148" text-anchor="start" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">列和 = 15</text>
  <text x="600" y="176" text-anchor="start" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">对角线和 = 15</text>
  <text x="440" y="290" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">已知 3,6,5,5,4,7 之和 30，S=15，三个对角元分别是 6、5、4</text>
</svg>
