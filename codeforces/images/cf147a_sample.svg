<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="347"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="240" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">样例 1 的整理结果</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">多空格压成一个、逗号前删空格、逗号后补空格</text>
  <text x="450" y="108" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">galileo galilei was an   italian physicist  ,mathematician,astronomer</text>
  <text x="450" y="150" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">galileo galilei was an italian physicist, mathematician, astronomer</text>
  <text x="450" y="200" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">行末无多余空格；连续空格、标点前空格全部消除</text>
</svg>
