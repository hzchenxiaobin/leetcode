<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="380" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="38" text-anchor="middle" font-size="18.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">48F：每天 O(m) 的“带权选择”找价格阈值</text>
  <path d="M 137 50 Q 380 56 623 50" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="84" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">n ≤ 100 但 m ≤ 5×10^5：每天排序是 O(m log m)×100 ≈ 10^9，会超时。</text>
  <text x="60" y="110" text-anchor="start" font-size="11.5" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">改用三路划分的快速选择：按价格把公司分成 &lt;pivot / =pivot / &gt;pivot 三堆，</text>
  <text x="60" y="136" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">同时累加每堆的“容量和”，就能判断 W 落在哪一堆，只递归一边。</text>
  <rect x="90" y="170" width="180" height="70" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="212" text-anchor="middle" font-size="13" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">&lt; pivot</text>
  <rect x="300" y="170" width="180" height="70" rx="10" fill="#fff3e0" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="390" y="212" text-anchor="middle" font-size="13" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">= pivot</text>
  <rect x="510" y="170" width="180" height="70" rx="10" fill="#e6f4ea" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="600" y="212" text-anchor="middle" font-size="13" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">&gt; pivot</text>
  <text x="90" y="258" text-anchor="start" font-size="11" fill="#446688" font-weight="normal" filter="url(#rough2)">若这一堆的容量和 ≥ W</text>
  <text x="90" y="280" text-anchor="start" font-size="11" fill="#446688" font-weight="normal" filter="url(#rough2)">⇒ 阈值在这里，继续往左</text>
  <text x="300" y="258" text-anchor="start" font-size="11" fill="#c9801f" font-weight="normal" filter="url(#rough2)">若跨过 pivot 才到 W</text>
  <text x="300" y="280" text-anchor="start" font-size="11" fill="#c9801f" font-weight="normal" filter="url(#rough2)">⇒ 阈值就是这个价格</text>
  <text x="510" y="258" text-anchor="start" font-size="11" fill="#4a7a3a" font-weight="normal" filter="url(#rough2)">否则整堆买下，继续往右</text>
  <text x="510" y="280" text-anchor="start" font-size="11" fill="#4a7a3a" font-weight="normal" filter="url(#rough2)">（容量和与代价一起累加）</text>
  <text x="60" y="330" text-anchor="start" font-size="11.5" fill="#2f5223" font-weight="bold" filter="url(#rough2)">期望 O(m) 每天 ⇒ 总 ~5×10^7；实测 n=100, m=5×10^5 用 0.51 s（含快读）。</text>
</svg>
