<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="320" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#444" filter="url(#rough2)">样例 4 走查：[0, 0, 10, −10]，k = 3</text>
  <text x="310" y="46" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">升序 b = [−10, 0, 0, 10]，L = 1；P = 最大 3 个 0,0,10 升序在前，剩余 −10 降序在后</text>

  <g filter="url(#rough2)">
    <rect x="150" y="56" width="320" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <text x="310" y="72" text-anchor="middle" font-size="10.5" fill="#2f4f28">k = 3 ≥ L = 1 ⇒ YES，构造输出 0 0 10 −10</text>
  </g>

  <!-- 表格外框与行背景 -->
  <g filter="url(#rough2)">
    <rect x="60" y="88" width="520" height="144" fill="#ffffff" stroke="#666" stroke-width="1.4" rx="4"/>
    <rect x="60" y="88" width="520" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="60" y="202" width="520" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2"/>
  </g>

  <g filter="url(#rough2)" stroke="#999" stroke-width="1" fill="none">
    <path d="M 60 112 L 580 112"/>
    <path d="M 60 142 L 580 142"/>
    <path d="M 60 172 L 580 172"/>
    <path d="M 60 202 L 580 202"/>
    <path d="M 130 88 L 130 232"/>
    <path d="M 230 88 L 230 232"/>
    <path d="M 340 88 L 340 232"/>
    <path d="M 460 88 L 460 232"/>
  </g>

  <g filter="url(#rough2)" font-size="10.5" fill="#2c3e50" text-anchor="middle" font-weight="bold">
    <text x="95" y="105">m</text>
    <text x="180" y="105">a[m]</text>
    <text x="285" y="105">前序和 Σ</text>
    <text x="400" y="105">a[m]·(m−1)</text>
    <text x="520" y="105">愉快?</text>
  </g>

  <g filter="url(#rough2)" font-size="11" fill="#333" text-anchor="middle">
    <text x="95" y="133">1</text>
    <text x="180" y="133">0</text>
    <text x="285" y="133">0</text>
    <text x="400" y="133">0</text>
    <text x="520" y="133" fill="#4a7a3a" font-weight="bold">✓ 0 ≥ 0</text>

    <text x="95" y="163">2</text>
    <text x="180" y="163">0</text>
    <text x="285" y="163">0</text>
    <text x="400" y="163">0</text>
    <text x="520" y="163" fill="#4a7a3a" font-weight="bold">✓ 0 ≥ 0</text>

    <text x="95" y="193">3</text>
    <text x="180" y="193">10</text>
    <text x="285" y="193">0</text>
    <text x="400" y="193">20</text>
    <text x="520" y="193" fill="#4a7a3a" font-weight="bold">✓ 20 ≥ 0</text>

    <text x="95" y="223">4</text>
    <text x="180" y="223">−10</text>
    <text x="285" y="223">10</text>
    <text x="400" y="223">−30</text>
    <text x="520" y="223" fill="#b85450" font-weight="bold">✗ −30 &lt; 10</text>
  </g>

  <text x="310" y="258" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4f28" filter="url(#rough2)">愉快次数 = 3 = k ✓（前 3 个都在 P 内，最后一个 −10 撞上平均值 10/3 被拦下）</text>

  <text x="310" y="284" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">官方另一组输出 10 −10 0 0 同样恰好 3 次愉快：答案不唯一，任意一组都算对</text>
  <text x="310" y="306" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">注意 Σ 最大可达 2·10^5 × 10^9 = 2·10^14：判定变量必须用 long long（本构造的代码不累加）</text>
</svg>
