<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="420" fill="#fafafa"/>

  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按列编号：第 j 列、第 i 行放 base[j] + i</text>
  <path d="M 130 44 Q 360 50 590 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 列号 -->
  <text x="150" y="82" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">列 1</text>
  <text x="220" y="82" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">列 2</text>
  <text x="290" y="82" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">列 3</text>

  <!-- 第 1 行 -->
  <rect x="115" y="92" width="70" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="185" y="92" width="70" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="255" y="92" width="70" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="132" text-anchor="middle" font-size="22" font-weight="bold" fill="#2f5223" filter="url(#rough2)">1</text>
  <text x="220" y="132" text-anchor="middle" font-size="22" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">4</text>
  <text x="290" y="132" text-anchor="middle" font-size="22" font-weight="bold" fill="#8a6015" filter="url(#rough2)">6</text>
  <text x="100" y="118" text-anchor="end" font-size="12" fill="#555" filter="url(#rough2)">行 1</text>

  <!-- 第 2 行 -->
  <rect x="115" y="154" width="70" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="185" y="154" width="70" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="194" text-anchor="middle" font-size="22" font-weight="bold" fill="#2f5223" filter="url(#rough2)">2</text>
  <text x="220" y="194" text-anchor="middle" font-size="22" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">5</text>
  <text x="100" y="180" text-anchor="end" font-size="12" fill="#555" filter="url(#rough2)">行 2</text>

  <!-- 第 3 行 -->
  <rect x="115" y="216" width="70" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="256" text-anchor="middle" font-size="22" font-weight="bold" fill="#2f5223" filter="url(#rough2)">3</text>
  <text x="100" y="242" text-anchor="end" font-size="12" fill="#555" filter="url(#rough2)">行 3</text>

  <!-- 列内箭头 -->
  <path d="M 220 160 L 220 150" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 150 222 L 150 212" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 右侧说明 -->
  <rect x="360" y="92" width="330" height="112" rx="10" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="374" y="118" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">c = (3, 2, 1)，s = 6</text>
  <text x="374" y="142" font-size="12" fill="#2b2b2b" filter="url(#rough2)">rows[1]=3, rows[2]=2, rows[3]=1</text>
  <text x="374" y="164" font-size="12" fill="#2b2b2b" filter="url(#rough2)">base[1]=0, base[2]=3, base[3]=5</text>
  <text x="374" y="186" font-size="12" fill="#2b2b2b" filter="url(#rough2)">格 (i, j) 的值 = base[j] + i</text>

  <rect x="360" y="220" width="330" height="112" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="374" y="246" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">为什么满足两条条件？</text>
  <text x="374" y="270" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">同一列：i 增大 → 值加 1，严格递增</text>
  <text x="374" y="292" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">同一行：j 增大 → base 跳一整列，更大</text>
  <text x="374" y="314" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">所以只需把每个数换到它该在的格子</text>

  <rect x="115" y="300" width="575" height="42" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="128" y="326" font-size="12" fill="#7a5a1b" filter="url(#rough2)">注意：合法终态并不唯一（同形状的杨表可以有多个），任选一个能算清楚的目标即可</text>

  <text x="360" y="382" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">目标 1,4,6 / 2,5 / 3：下大右大，两条件同时成立</text>
</svg>
