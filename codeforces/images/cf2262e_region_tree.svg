<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" width="620" height="420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">一条 S-弧 = 一个节点：每条弧内部的区域里，自由点与孩子随意交错</text>

  <!-- 左侧：区域树 -->
  <rect x="60" y="52" width="160" height="28" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="140" y="71" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">最外层区域（根）</text>
  <path d="M 140 80 L 85 112" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 140 80 L 215 112" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <rect x="45" y="112" width="80" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="85" y="130" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">S-弧 A</text>
  <rect x="175" y="112" width="80" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="215" y="130" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">S-弧 B</text>
  <path d="M 85 138 L 55 172" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 85 138 L 140 172" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <rect x="16" y="172" width="56" height="24" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="44" y="189" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">A1</text>
  <rect x="112" y="172" width="56" height="24" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="140" y="189" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">A2</text>
  <circle cx="81" cy="184" r="3.2" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="90" cy="184" r="3.2" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="160" y="206" text-anchor="middle" font-size="11" fill="#33582a" filter="url(#rough2)">区域 = 2m 个自由点(绿) + r 个孩子</text>
  <text x="160" y="223" text-anchor="middle" font-size="11" fill="#33582a" filter="url(#rough2)">交错方案数 = C(2m+r, 2m)</text>

  <!-- 右上：生成函数 -->
  <rect x="286" y="50" width="316" height="150" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="74" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">P = yz · Σ_m C(m)² z^m / (1−P)^(2m+1)</text>
  <text x="300" y="97" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">G = Σ_m C(m)² z^m / (1−P)^(2m+1)</text>
  <text x="300" y="118" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">   = P / (yz)</text>
  <text x="300" y="144" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">A_n,j = [z^n y^j] G</text>
  <text x="300" y="168" font-size="11" fill="#6b6b6b" filter="url(#rough2)">yz 记「一条弧 + 它的端点」，z^m 记 m 个自由点；</text>
  <text x="300" y="188" font-size="11" fill="#6b6b6b" filter="url(#rough2)">(1−P)^(−2m−1) 就是把 2m 个点与孩子任意交错。</text>

  <!-- 中部：参数化与反演 -->
  <rect x="40" y="234" width="540" height="88" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="56" y="262" font-size="11.5" fill="#8c3a37" filter="url(#rough2)">令 φ = 1/(1−P)，t = zφ²：  φ = 1 + y·t·Q(t)，  G = Q(t)·φ，  z = t/φ²</text>
  <text x="56" y="286" font-size="11.5" fill="#8c3a37" filter="url(#rough2)">对 t = zφ² 做 Lagrange–Bürmann 反演并化简 ⇒ 闭式</text>
  <text x="56" y="312" font-size="13" font-weight="bold" fill="#8c3a37" filter="url(#rough2)">A_n,j = C(2n, j) / (j+1) · [z^(n−j)] Q(z)^(j+1)</text>

  <!-- 流水线 -->
  <text x="310" y="336" text-anchor="middle" font-size="11.5" fill="#6b6b6b" filter="url(#rough2)">每组测试的流水线（总代价 O(n³)，sum n ≤ 500 时约 4×10^7）</text>
  <rect x="18" y="344" width="100" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="68" y="366" text-anchor="middle" font-size="10" fill="#33582a" filter="url(#rough2)">Q[m] = C(m)²</text>
  <text x="68" y="384" text-anchor="middle" font-size="10" fill="#33582a" filter="url(#rough2)">卡特兰平方</text>
  <path d="M 120 371 L 138 371" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="140" y="344" width="100" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="366" text-anchor="middle" font-size="10" fill="#33582a" filter="url(#rough2)">R ← R · Q</text>
  <text x="190" y="384" text-anchor="middle" font-size="10" fill="#33582a" filter="url(#rough2)">截断到次数 n−j</text>
  <path d="M 242 371 L 260 371" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="262" y="344" width="100" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="312" y="366" text-anchor="middle" font-size="10" fill="#33582a" filter="url(#rough2)">d_j = R[n−j]</text>
  <text x="312" y="384" text-anchor="middle" font-size="10" fill="#33582a" filter="url(#rough2)">取出目标系数</text>
  <path d="M 364 371 L 382 371" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="384" y="344" width="100" height="54" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="434" y="366" text-anchor="middle" font-size="10" fill="#8a6015" filter="url(#rough2)">A_j = C(2n,j)</text>
  <text x="434" y="384" text-anchor="middle" font-size="10" fill="#8a6015" filter="url(#rough2)">· d_j / (j+1)</text>
  <path d="M 486 371 L 504 371" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="506" y="344" width="100" height="54" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="556" y="366" text-anchor="middle" font-size="10" fill="#2f4a66" filter="url(#rough2)">f_k = Σ (−1)^(j−k)</text>
  <text x="556" y="384" text-anchor="middle" font-size="10" fill="#2f4a66" filter="url(#rough2)">· C(j,k) · A_j</text>
</svg>
