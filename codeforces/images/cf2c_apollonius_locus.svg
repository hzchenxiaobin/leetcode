<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="880" height="480" fill="#fafafa"/>

  <text x="440.0" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">等张角的点集：两圆半径不等时是阿波罗尼斯圆，相等时退化为直线</text>
  <path d="M 120 42 Q 440.0 49 760 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <text x="240.0" y="76.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">r₁ ≠ r₂：S(1,2) 是一个圆</text>
  <circle cx="160.0" cy="250.0" r="35.0" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="320.0" cy="250.0" r="87.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="129.1" cy="250.0" r="76.8" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="7 6" filter="url(#rough2)"/>
  <line x1="52.3" y1="115.0" x2="52.3" y2="400.0" stroke="#d6a040" stroke-width="1.0" stroke-dasharray="3 6" filter="url(#rough2)"/>
  <line x1="205.9" y1="115.0" x2="205.9" y2="400.0" stroke="#d6a040" stroke-width="1.0" stroke-dasharray="3 6" filter="url(#rough2)"/>
  <text x="129.1" y="106.0" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">阿波罗尼斯圆</text>
  <circle cx="160.0" cy="250.0" r="4" fill="#446688" filter="url(#rough2)"/>
  <circle cx="320.0" cy="250.0" r="4" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="154.0" y="270.0" font-size="12" fill="#2f4a66" filter="url(#rough2)">C₁</text>
  <text x="328.0" y="192.0" font-size="12" fill="#3c5e2e" filter="url(#rough2)">C₂</text>
  <text x="148.0" y="206.0" font-size="12" fill="#2f4a66" filter="url(#rough2)">r₁</text>
  <text x="274.0" y="264.0" font-size="12" fill="#3c5e2e" filter="url(#rough2)">r₂</text>
  <circle cx="105.4" cy="177.0" r="5" fill="#b85450" filter="url(#rough2)"/>
  <line x1="105.4" y1="177.0" x2="160.0" y2="250.0" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <line x1="105.4" y1="177.0" x2="320.0" y2="250.0" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="91.4" y="167.0" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">Q</text>
  <text x="240.0" y="372.0" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">Q 满足 |QC₁|/r₁ = |QC₂|/r₂</text>
  <text x="240.0" y="394.0" text-anchor="middle" font-size="12" fill="#66788c" filter="url(#rough2)">圆心必落在 C₁C₂ 连线上</text>
  <text x="650.0" y="76.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">r₁ = r₂：S(1,2) 是一条直线</text>
  <circle cx="560.0" cy="250.0" r="55.0" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="740.0" cy="250.0" r="55.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <line x1="650.0" y1="120.0" x2="650.0" y2="380.0" stroke="#d6a040" stroke-width="2" stroke-dasharray="7 6" filter="url(#rough2)"/>
  <text x="658.0" y="132.0" font-size="12.5" fill="#8a6015" filter="url(#rough2)">垂直平分线</text>
  <circle cx="560.0" cy="250.0" r="4" fill="#446688" filter="url(#rough2)"/>
  <circle cx="740.0" cy="250.0" r="4" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="552.0" y="188.0" font-size="12" fill="#2f4a66" filter="url(#rough2)">C₁</text>
  <text x="746.0" y="188.0" font-size="12" fill="#3c5e2e" filter="url(#rough2)">C₂</text>
  <text x="650.0" y="372.0" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">|QC₁| = |QC₂|</text>
  <text x="650.0" y="394.0" text-anchor="middle" font-size="12" fill="#66788c" filter="url(#rough2)">两圆半径相同时比值恒为 1</text>
  <rect x="96.0" y="414.0" width="688.0" height="50.0" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="440.0" y="444.0" text-anchor="middle" font-size="13.5" fill="#8a6015" filter="url(#rough2)">求 S(1,2) ∩ S(1,3)：两个圆（或圆与直线）最多交于 2 点，即候选观测点不超过 2 个</text>
</svg>
