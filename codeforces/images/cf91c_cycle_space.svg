<svg xmlns="http://www.w3.org/2000/svg" width="880" height="404" viewBox="0 0 880 404"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="91"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="404" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">合法方案 = 所有顶点度数为偶数的边子集</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">这些子集构成 GF(2) 上的圈空间，维数 = m − n + c</text>
  <g filter="url(#rough2)"><circle cx="200" cy="120" r="12" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><circle cx="330" cy="110" r="12" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><circle cx="300" cy="230" r="12" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><circle cx="180" cy="230" r="12" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="184" y="102" text-anchor="end" font-size="11" fill="#2f4a66" filter="url(#rough2)">1</text>
  <text x="344" y="96" text-anchor="start" font-size="11" fill="#2f4a66" filter="url(#rough2)">2</text>
  <text x="314" y="240" text-anchor="start" font-size="11" fill="#2f4a66" filter="url(#rough2)">3</text>
  <text x="164" y="244" text-anchor="end" font-size="11" fill="#2f4a66" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><line x1="200" y1="120" x2="330" y2="110" stroke="#4a7a3a" stroke-width="2"/></g>
  <g filter="url(#rough2)"><line x1="330" y1="110" x2="300" y2="230" stroke="#4a7a3a" stroke-width="2"/></g>
  <g filter="url(#rough2)"><line x1="300" y1="230" x2="180" y2="230" stroke="#4a7a3a" stroke-width="2"/></g>
  <g filter="url(#rough2)"><line x1="180" y1="230" x2="200" y2="120" stroke="#4a7a3a" stroke-width="2"/></g>
  <g filter="url(#rough2)"><line x1="200" y1="120" x2="300" y2="230" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="250" y="300" text-anchor="middle" font-size="11.5" fill="#3d6b2f" filter="url(#rough2)">每条边恰好属于一个闭合路线</text>
  <text x="250" y="326" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">（欧拉分解：所有度数为偶即可）</text>
  <g filter="url(#rough2)"><rect x="480" y="96" width="340" height="64" rx="4" fill="#d7ecd0" fill-opacity="0.4" stroke="#6a9a58" stroke-width="1.3"/></g>
  <text x="494" y="120" text-anchor="start" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">每加入一条边：m += 1</text>
  <text x="494" y="142" text-anchor="start" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">若两端已连通：c 不变 → 维数 +1</text>
  <g filter="url(#rough2)"><rect x="480" y="176" width="340" height="64" rx="4" fill="#cfe0f5" fill-opacity="0.4" stroke="#6688aa" stroke-width="1.3"/></g>
  <text x="494" y="200" text-anchor="start" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">若两端不同连通块：c −= 1</text>
  <text x="494" y="222" text-anchor="start" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">m 与 −c 抵消 → 维数不变</text>
  <text x="430" y="268" text-anchor="middle" font-size="12.5" fill="#8a2b28" filter="url(#rough2)">答案 = 2^(m − n + c) − 1（去掉空集），c 用并查集维护</text>
  <text x="430" y="310" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">n 是顶点总数（含孤立点），所以初始 c = n、维数 0</text>
</svg>
