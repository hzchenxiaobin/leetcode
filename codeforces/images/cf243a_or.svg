<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="720" height="300" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">固定右端点 i：所有 [l, i] 的 OR 最多只有 20 种（每个不同的值至少多一个 1 位）</text>
  <rect x="70" y="70" width="80" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="110" y="96" text-anchor="middle" font-size="12" fill="#2f4a66">a1</text>
  <rect x="170" y="70" width="80" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="210" y="96" text-anchor="middle" font-size="12" fill="#2f4a66">a2</text>
  <rect x="270" y="70" width="80" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="310" y="96" text-anchor="middle" font-size="12" fill="#2f4a66">a3</text>
  <rect x="370" y="70" width="80" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="410" y="96" text-anchor="middle" font-size="12" fill="#2f4a66">a4</text>
  <rect x="470" y="70" width="80" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="510" y="96" text-anchor="middle" font-size="12" fill="#2f4a66">a5</text>
  <rect x="60" y="150" width="600" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="360" y="177" text-anchor="middle" font-size="12" fill="#2f5223">S(i) = { a_i } ∪ { v | a_i : v ∈ S(i-1) }</text>
  <rect x="60" y="220" width="600" height="50" rx="8" fill="#fde9d9" stroke="#b4652a" stroke-width="1.5"/>
  <text x="360" y="249" text-anchor="middle" font-size="11.5" fill="#7a4b22">|S(i)| ≤ 20，因为 OR 只会不断增加 1 的位数；用 set 去重后并起来就是答案</text>
</svg>
