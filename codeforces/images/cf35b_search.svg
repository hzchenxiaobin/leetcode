<svg xmlns="http://www.w3.org/2000/svg" width="740" height="320" viewBox="0 0 740 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="221"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="740" height="320" fill="#fafafa"/>
  <text x="370" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">查找顺序：同层向右 → 下一层从最左开始</text>
  <g filter="url(#rough2)">
    <rect x="70" y="60" width="580" height="150" rx="10" fill="#ffffff" stroke="#c9ced6" stroke-width="1.4"/>
    <text x="90" y="84" font-size="12" fill="#666">第 1 层</text>
    <text x="90" y="144" font-size="12" fill="#666">第 2 层</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="180" y="66" width="70" height="34" rx="6" fill="#fce8e6" stroke="#b85450" stroke-width="1.4"/>
    <text x="215" y="88" text-anchor="middle" font-size="12" fill="#8f3b37">已占</text>
    <rect x="270" y="66" width="70" height="34" rx="6" fill="#fce8e6" stroke="#b85450" stroke-width="1.4"/>
    <text x="305" y="88" text-anchor="middle" font-size="12" fill="#8f3b37">已占</text>
    <rect x="360" y="66" width="70" height="34" rx="6" fill="#eef4ec" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="395" y="88" text-anchor="middle" font-size="12" fill="#2f5223">空</text>
    <rect x="180" y="120" width="70" height="34" rx="6" fill="#eef4ec" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="215" y="142" text-anchor="middle" font-size="12" fill="#2f5223">空</text>
  </g>
  <path d="M180,168 L450,168" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#ar)" filter="url(#rough2)"/>
  <text x="315" y="192" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">第 1 层从 y 向右扫</text>
  <path d="M170,168 Q150,205 200,220" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="300" y="236" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">本层没有空格 → 下一层从第 1 格开始</text>
  <rect x="80" y="254" width="580" height="52" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="96" y="278" font-size="12.5" fill="#8a6015" filter="url(#rough2)">首层从 y 开始，后续层都从 1 开始；整架都满则丢弃这个箱子。</text>
  <text x="96" y="298" font-size="12" fill="#8a6015" filter="url(#rough2)">n, m ≤ 30，直接三重循环扫描即可。</text>
</svg>
