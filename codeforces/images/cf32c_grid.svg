<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="341" />
      <feDisplacementMap in="SourceGraphic" scale="1.5" />
    </filter>
  </defs>
  <rect width="760" height="420" fill="#fafafa" />
  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3×3 棋盘，s = 2：只能落在同一“行列余数类”</text>
  <path d="M 110 44 Q 380 50 650 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)" />

  
  <g>
    <rect x="80" y="80" width="60" height="60" fill="#e8f0fe" stroke="#446688" filter="url(#rough2)" />
    <rect x="140" y="80" width="60" height="60" fill="#f0f0f0" stroke="#999" filter="url(#rough2)" />
    <rect x="200" y="80" width="60" height="60" fill="#e8f0fe" stroke="#446688" filter="url(#rough2)" />
    <rect x="80" y="140" width="60" height="60" fill="#f0f0f0" stroke="#999" filter="url(#rough2)" />
    <rect x="140" y="140" width="60" height="60" fill="#fff8e1" stroke="#d6a040" filter="url(#rough2)" />
    <rect x="200" y="140" width="60" height="60" fill="#f0f0f0" stroke="#999" filter="url(#rough2)" />
    <rect x="80" y="200" width="60" height="60" fill="#e8f0fe" stroke="#446688" filter="url(#rough2)" />
    <rect x="200" y="200" width="60" height="60" fill="#e8f0fe" stroke="#446688" filter="url(#rough2)" />
    <rect x="140" y="200" width="60" height="60" fill="#f0f0f0" stroke="#999" filter="url(#rough2)" />
  </g>
  <text x="110" y="116" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">(0,0)</text>
  <text x="170" y="116" text-anchor="middle" font-size="13" fill="#777" filter="url(#rough2)">(0,1)</text>
  <text x="230" y="116" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">(0,2)</text>
  <text x="110" y="176" text-anchor="middle" font-size="13" fill="#777" filter="url(#rough2)">(1,0)</text>
  <text x="170" y="176" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">(1,1)</text>
  <text x="230" y="176" text-anchor="middle" font-size="13" fill="#777" filter="url(#rough2)">(1,2)</text>
  <text x="110" y="236" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">(2,0)</text>
  <text x="170" y="236" text-anchor="middle" font-size="13" fill="#777" filter="url(#rough2)">(2,1)</text>
  <text x="230" y="236" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">(2,2)</text>

  
  <line x1="110" y1="140" x2="110" y2="200" stroke="#446688" stroke-width="1.6" marker-end="url(#a32c)" filter="url(#rough2)" />
  <line x1="110" y1="200" x2="200" y2="200" stroke="#446688" stroke-width="1.6" marker-end="url(#a32c)" filter="url(#rough2)" />
  <defs>
    <marker id="a32c" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688" />
    </marker>
  </defs>

  
  <rect x="330" y="80" width="380" height="160" rx="10" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.5" filter="url(#rough2)" />
  <text x="350" y="108" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">从 (0,0) 出发，s=2</text>
  <text x="350" y="134" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">行只能 0 ↔ 2，列只能 0 ↔ 2；</text>
  <text x="350" y="158" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">能到达 (0,0)、(0,2)、(2,0)、(2,2)。</text>
  <text x="350" y="182" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">共 2 × 2 = 4 个格子。</text>
  <text x="350" y="210" font-size="11" fill="#777" filter="url(#rough2)">黄色格子 (1,1) 是另一个连通块，只有 1 个格子。</text>

  
  <rect x="60" y="270" width="640" height="112" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)" />
  <text x="80" y="296" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">关键不变量：每次跳 ±s，行坐标模 s、列坐标模 s 都不变。</text>
  <text x="80" y="320" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">反过来，同一余数类内的行（或列）坐标相差 s 的倍数，可以一步步走遍，</text>
  <text x="80" y="342" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">行、列移动互相独立，所以连通块大小 = 行类大小 × 列类大小。</text>
  <text x="80" y="364" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">最大 d 就是“最大行类 × 最大列类”，再数有多少起点能达到它。</text>
</svg>