<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="47"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="800" height="400" fill="#fafafa"/>

  <text x="400" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2 走查：K = 3 的四个请求</text>
  <path d="M 200 40 Q 400 46 600 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <rect x="20" y="50" width="170" height="200" rx="10" fill="#ffffff" stroke="#888888" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="105" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">请求 1：M = 1</text>
    <rect x="57" y="100" width="32" height="32" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.1" filter="url(#rough2)"/>
    <rect x="89" y="100" width="32" height="32" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.1" filter="url(#rough2)"/>
    <rect x="121" y="100" width="32" height="32" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.1" filter="url(#rough2)"/>
    <rect x="57" y="132" width="32" height="32" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.1" filter="url(#rough2)"/>
    <rect x="89" y="132" width="32" height="32" fill="#fbe3c8" stroke="#c98a2b" stroke-width="1.6" filter="url(#rough2)"/>
    <rect x="121" y="132" width="32" height="32" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.1" filter="url(#rough2)"/>
    <rect x="57" y="164" width="32" height="32" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.1" filter="url(#rough2)"/>
    <rect x="89" y="164" width="32" height="32" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.1" filter="url(#rough2)"/>
    <rect x="121" y="164" width="32" height="32" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="105" y="222" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">→ 2 2 2</text>
  <text x="105" y="240" text-anchor="middle" font-size="9.5" fill="#777777" filter="url(#rough2)">中心 (2,2)</text>
  <path d="M 194 150 L 210 150" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="215" y="50" width="170" height="200" rx="10" fill="#ffffff" stroke="#888888" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="300" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">请求 2：M = 2</text>
    <rect x="252" y="100" width="32" height="32" fill="#fbe3c8" stroke="#c98a2b" stroke-width="1.6" filter="url(#rough2)"/>
    <rect x="284" y="100" width="32" height="32" fill="#fbe3c8" stroke="#c98a2b" stroke-width="1.6" filter="url(#rough2)"/>
    <rect x="316" y="100" width="32" height="32" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.1" filter="url(#rough2)"/>
    <rect x="252" y="132" width="32" height="32" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.1" filter="url(#rough2)"/>
    <rect x="284" y="132" width="32" height="32" fill="#e6e6e6" stroke="#999999" stroke-width="1.1" filter="url(#rough2)"/>
    <rect x="316" y="132" width="32" height="32" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.1" filter="url(#rough2)"/>
    <rect x="252" y="164" width="32" height="32" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.1" filter="url(#rough2)"/>
    <rect x="284" y="164" width="32" height="32" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.1" filter="url(#rough2)"/>
    <rect x="316" y="164" width="32" height="32" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="300" y="222" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">→ 1 1 2</text>
  <text x="300" y="240" text-anchor="middle" font-size="9.5" fill="#777777" filter="url(#rough2)">行 2 放不下 → 行 1</text>
  <path d="M 389 150 L 405 150" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="410" y="50" width="170" height="200" rx="10" fill="#ffffff" stroke="#888888" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="495" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">请求 3：M = 3</text>
    <rect x="447" y="100" width="32" height="32" fill="#e6e6e6" stroke="#999999" stroke-width="1.1" filter="url(#rough2)"/>
    <rect x="479" y="100" width="32" height="32" fill="#e6e6e6" stroke="#999999" stroke-width="1.1" filter="url(#rough2)"/>
    <rect x="511" y="100" width="32" height="32" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.1" filter="url(#rough2)"/>
    <rect x="447" y="132" width="32" height="32" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.1" filter="url(#rough2)"/>
    <rect x="479" y="132" width="32" height="32" fill="#e6e6e6" stroke="#999999" stroke-width="1.1" filter="url(#rough2)"/>
    <rect x="511" y="132" width="32" height="32" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.1" filter="url(#rough2)"/>
    <rect x="447" y="164" width="32" height="32" fill="#fbe3c8" stroke="#c98a2b" stroke-width="1.6" filter="url(#rough2)"/>
    <rect x="479" y="164" width="32" height="32" fill="#fbe3c8" stroke="#c98a2b" stroke-width="1.6" filter="url(#rough2)"/>
    <rect x="511" y="164" width="32" height="32" fill="#fbe3c8" stroke="#c98a2b" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="495" y="222" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">→ 3 1 3</text>
  <text x="495" y="240" text-anchor="middle" font-size="9.5" fill="#777777" filter="url(#rough2)">只有行 3 能放整行</text>
  <path d="M 584 150 L 600 150" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="605" y="50" width="170" height="200" rx="10" fill="#ffffff" stroke="#888888" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="690" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">请求 4：M = 1</text>
    <rect x="642" y="100" width="32" height="32" fill="#e6e6e6" stroke="#999999" stroke-width="1.1" filter="url(#rough2)"/>
    <rect x="674" y="100" width="32" height="32" fill="#e6e6e6" stroke="#999999" stroke-width="1.1" filter="url(#rough2)"/>
    <rect x="706" y="100" width="32" height="32" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.1" filter="url(#rough2)"/>
    <rect x="642" y="132" width="32" height="32" fill="#fbe3c8" stroke="#c98a2b" stroke-width="1.6" filter="url(#rough2)"/>
    <rect x="674" y="132" width="32" height="32" fill="#e6e6e6" stroke="#999999" stroke-width="1.1" filter="url(#rough2)"/>
    <rect x="706" y="132" width="32" height="32" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.1" filter="url(#rough2)"/>
    <rect x="642" y="164" width="32" height="32" fill="#e6e6e6" stroke="#999999" stroke-width="1.1" filter="url(#rough2)"/>
    <rect x="674" y="164" width="32" height="32" fill="#e6e6e6" stroke="#999999" stroke-width="1.1" filter="url(#rough2)"/>
    <rect x="706" y="164" width="32" height="32" fill="#e6e6e6" stroke="#999999" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="690" y="222" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">→ 2 1 1</text>
  <text x="690" y="240" text-anchor="middle" font-size="9.5" fill="#777777" filter="url(#rough2)">并列取 y 小</text>

  <rect x="20" y="266" width="170" height="30" rx="6" fill="#fbe3c8" stroke="#c98a2b" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="105" y="286" text-anchor="middle" font-size="10.5" fill="#8a6015" filter="url(#rough2)">本次选中的座位</text>
  <rect x="200" y="266" width="170" height="30" rx="6" fill="#e6e6e6" stroke="#999999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="285" y="286" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">此前已售</text>
  <rect x="380" y="266" width="170" height="30" rx="6" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="465" y="286" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">仍然空闲</text>

  <text x="40" y="330" font-size="12" fill="#2b2b2b" filter="url(#rough2)">第 2 步四个候选的总距离都是 3（行 1 的 [1,2]、行 3 的 [1,2]），按“先比行号、再比起点”落到行 1 的 y = 1。</text>
  <text x="40" y="356" font-size="12" fill="#2b2b2b" filter="url(#rough2)">第 4 步只剩 (1,3)、(2,1)、(2,3)：行 1 的总距离是 2，行 2 的两个都是 1，并列时取起点小的 (2,1)。</text>
  <text x="40" y="382" font-size="11.5" fill="#777777" filter="url(#rough2)">四步输出依次是 2 2 2 / 1 1 2 / 3 1 3 / 2 1 1，与官方样例完全一致。</text>
</svg>
