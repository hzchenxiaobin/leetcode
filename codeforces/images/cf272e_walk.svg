<svg xmlns="http://www.w3.org/2000/svg" width="880" height="270" viewBox="0 0 880 270"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="270" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例：100 / 00 / 0110000000</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">多解，任何合法分组都行</text>
  <text x="150" y="110" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">样例 1：三角形 → 100（1、2、3 各自的党内敌人数 &lt;= 1）</text>
  <text x="150" y="150" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">样例 2：单边 → 00</text>
  <text x="150" y="190" text-anchor="start" font-size="12" fill="#3d6b2f" filter="url(#rough2)">样例 3：只有 1、2、3、4 之间有边 → 分组后各点党内敌人 &lt;= 1</text>
</svg>
