<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="103"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="380" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">D：按美貌降序扫描，BIT 里只放“更美且更聪明”的财富</text>
  <path d="M 100 42 Q 380 47 660 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 三个 B 组 -->
  <rect x="40" y="80" width="200" height="86" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="104" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">第 1 组：B = 9</text>
  <text x="140" y="126" text-anchor="middle" font-size="10.5" fill="#3c5e88" filter="url(#rough2)">这些女士的 B 最大</text>
  <text x="140" y="148" text-anchor="middle" font-size="10.5" fill="#3c5e88" filter="url(#rough2)">先整组查询，再整组插入</text>

  <line x1="242" y1="123" x2="272" y2="123" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <rect x="276" y="80" width="200" height="86" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="376" y="104" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">第 2 组：B = 7</text>
  <text x="376" y="126" text-anchor="middle" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">能“看见”第 1 组插进去的财富</text>
  <text x="376" y="148" text-anchor="middle" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">同组之间互相看不见（B 相等）</text>

  <line x1="478" y1="123" x2="508" y2="123" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <rect x="512" y="80" width="210" height="86" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="617" y="104" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">第 3 组：B = 5</text>
  <text x="617" y="126" text-anchor="middle" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">看到前两组，但看不到自己组</text>
  <text x="617" y="148" text-anchor="middle" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">… 依次往下扫完全部组</text>

  <!-- BIT 示意 -->
  <text x="60" y="200" font-size="12" fill="#2b2b2b" filter="url(#rough2)">对当前女士 i 的查询：</text>
  <rect x="60" y="214" width="640" height="70" rx="10" fill="#ffffff" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="76" y="240" font-size="11.5" fill="#2f4a66" font-family="'Courier New',monospace" filter="url(#rough2)">pos = M - rank(I_i) + 1</text>
  <text x="76" y="266" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">查前缀 [1, pos-1] 的最大 R：这些正是「I 更大」且「B 更大」的人</text>
  <text x="470" y="240" font-size="11.5" fill="#8c3a36" filter="url(#rough2)">若 maxR &gt; R_i → 她被压过，答案 +1</text>
  <text x="470" y="266" font-size="11.5" fill="#8c3a36" filter="url(#rough2)">否则她暂时安全</text>

  <rect x="60" y="300" width="640" height="62" rx="10" fill="#ffe9e6" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="72" y="324" font-size="12" font-weight="bold" fill="#8c3a36" filter="url(#rough2)">为什么要“先整组查询、再整组插入”？</text>
  <text x="72" y="348" font-size="11" fill="#8c3a36" filter="url(#rough2)">题面要求 B_j &gt; B_i 严格大于。若边查边插，同 B 的两人会互相看见，答案就会偏大。</text>
</svg>
