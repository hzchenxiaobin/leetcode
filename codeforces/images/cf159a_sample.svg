  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">没有往来 ⇒ 0 对；注意 t 可以为 0</text>
  <text x="450" y="100" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">1 1000 / a b 0</text>
