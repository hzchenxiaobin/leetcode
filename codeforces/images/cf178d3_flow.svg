<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="330" fill="#fafafa"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">D3 的搜索流程</text>
  <path d="M 303.01 46 Q 380.0 52 456.99 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="110.0" y="56.0" width="540.0" height="44.0" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="380.0" y="82.2" text-anchor="middle" font-size="11.6" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">排序 + 压缩成 (值, 个数)</text>
  <path d="M 380.0 101.0 L 380.0 112.0" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="110.0" y="111.0" width="540.0" height="44.0" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="380.0" y="137.2" text-anchor="middle" font-size="11.6" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">s = Σa / n</text>
  <path d="M 380.0 156.0 L 380.0 167.0" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="110.0" y="166.0" width="540.0" height="44.0" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="380.0" y="192.2" text-anchor="middle" font-size="11.6" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按行 DFS：前 n−1 格枚举</text>
  <path d="M 380.0 211.0 L 380.0 222.0" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="110.0" y="221.0" width="540.0" height="44.0" rx="8" fill="#fff3d6" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="380.0" y="247.2" text-anchor="middle" font-size="11.6" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">填完一行：列/对角线上下界剪枝</text>
  <path d="M 380.0 266.0 L 380.0 277.0" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="110.0" y="276.0" width="540.0" height="44.0" rx="8" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="380.0" y="302.2" text-anchor="middle" font-size="11.6" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">最后一行：列和反解 + 校验对角线</text>
</svg>
