<svg xmlns="http://www.w3.org/2000/svg" width="660" height="404" viewBox="0 0 660 404" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="660" height="404" fill="#fafafa"/>

  <text x="330" y="28" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">样例 6 走查：1 2 1 2 1 1 → 交换第 1 个与第 4 个</text>

  <rect x="70" y="76" width="44" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="92" y="100" text-anchor="middle" font-size="17" fill="#33506b" filter="url(#rough2)">1</text>
  <rect x="116" y="76" width="44" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="138" y="100" text-anchor="middle" font-size="17" fill="#3c6130" filter="url(#rough2)">2</text>
  <rect x="162" y="76" width="44" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="184" y="100" text-anchor="middle" font-size="17" fill="#33506b" filter="url(#rough2)">1</text>
  <rect x="208" y="76" width="44" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230" y="100" text-anchor="middle" font-size="17" fill="#3c6130" filter="url(#rough2)">2</text>
  <rect x="254" y="76" width="44" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="276" y="100" text-anchor="middle" font-size="17" fill="#33506b" filter="url(#rough2)">1</text>
  <rect x="300" y="76" width="44" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="322" y="100" text-anchor="middle" font-size="17" fill="#33506b" filter="url(#rough2)">1</text>

  <path d="M92,72 C120,44 202,44 228,72" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="250" y="56" font-size="12" fill="#b85450" filter="url(#rough2)">swap</text>

  <text x="70" y="136" font-size="12" fill="#33506b" filter="url(#rough2)">值 1 的块：{1} {3} {5,6} → runs(1) = 3（坏）</text>
  <text x="70" y="156" font-size="12" fill="#3c6130" filter="url(#rough2)">值 2 的块：{2} {4} → runs(2) = 2（坏）</text>

  <path d="M330,170 L330,192" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="202" width="44" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="92" y="226" text-anchor="middle" font-size="17" fill="#3c6130" filter="url(#rough2)">2</text>
  <rect x="116" y="202" width="44" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="138" y="226" text-anchor="middle" font-size="17" fill="#3c6130" filter="url(#rough2)">2</text>
  <rect x="162" y="202" width="44" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="184" y="226" text-anchor="middle" font-size="17" fill="#33506b" filter="url(#rough2)">1</text>
  <rect x="208" y="202" width="44" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230" y="226" text-anchor="middle" font-size="17" fill="#33506b" filter="url(#rough2)">1</text>
  <rect x="254" y="202" width="44" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="276" y="226" text-anchor="middle" font-size="17" fill="#33506b" filter="url(#rough2)">1</text>
  <rect x="300" y="202" width="44" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="322" y="226" text-anchor="middle" font-size="17" fill="#33506b" filter="url(#rough2)">1</text>

  <text x="356" y="226" font-size="13" fill="#4a7a3a" filter="url(#rough2)">runs(2) = 1 ✓</text>
  <text x="70" y="262" font-size="12" fill="#446688" filter="url(#rough2)">runs(1) = 1 ✓，块数 2 = 不同值数 2 ⇒ YES</text>

  <rect x="40" y="282" width="580" height="106" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="308" font-size="13" fill="#33506b" filter="url(#rough2)">候选怎么配上的（位置从 1 开始）：</text>
  <text x="60" y="332" font-size="12" fill="#444" filter="url(#rough2)">坏值 1 有 3 块，只能搬走极端单点块 → (out, in) = (1, 4)</text>
  <text x="60" y="354" font-size="12" fill="#444" filter="url(#rough2)">坏值 2 有 2 块且空隙 = 1 → 候选含 (out, in) = (4, 1)</text>
  <text x="60" y="376" font-size="12" fill="#8f3b38" filter="url(#rough2)">两者恰好互为反向 ⇒ 交换 (1, 4)，重新判定通过</text>
</svg>
