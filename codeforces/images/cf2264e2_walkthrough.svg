<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 412" width="860" height="412"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="37"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="860" height="412" fill="#fafafa"/>

  <text x="430" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">段表演算：u = 9 时 F(9, ·) 只有三段</text>
  <text x="430" y="55" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#rough2)">9 的平滑数是 3 的幂：27、81、243 ……，它们就是段表的断点</text>

  <!-- 表头 -->
  <rect x="40" y="74" width="780" height="32" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="170" y="95" text-anchor="middle" font-size="12.4" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">v 的区间</text>
  <text x="380" y="95" text-anchor="middle" font-size="12.4" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">F(9, v)</text>
  <text x="600" y="95" text-anchor="middle" font-size="12.4" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">原因</text>

  <!-- 行 1 -->
  <rect x="40" y="112" width="780" height="34" rx="6" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="170" y="134" text-anchor="middle" font-size="12.2" fill="#2b2b2b" filter="url(#rough2)">9 ≤ v ≤ 26</text>
  <text x="380" y="134" text-anchor="middle" font-size="12.6" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">9</text>
  <text x="470" y="134" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">v &lt; B(9) = 27，没有墙，直接用 ∤ 9 的质数降到 9</text>

  <!-- 行 2 -->
  <rect x="40" y="152" width="780" height="34" rx="6" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="170" y="174" text-anchor="middle" font-size="12.2" fill="#2b2b2b" filter="url(#rough2)">27 ≤ v ≤ 80</text>
  <text x="380" y="174" text-anchor="middle" font-size="12.6" font-weight="bold" fill="#8a6015" filter="url(#rough2)">7</text>
  <text x="470" y="174" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">K = 27 = 3³ ⇒ F(8, 26)；B(7) = 49 &gt; 26 ⇒ 7</text>

  <!-- 行 3 -->
  <rect x="40" y="192" width="780" height="34" rx="6" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="170" y="214" text-anchor="middle" font-size="12.2" fill="#2b2b2b" filter="url(#rough2)">81 ≤ v</text>
  <text x="380" y="214" text-anchor="middle" font-size="12.6" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="470" y="214" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">K = 81 = 3⁴ ⇒ F(8, 80)，随后一路掉到 1（见下方链）</text>

  <!-- 链 -->
  <text x="46" y="258" font-size="12.4" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">最坏情况的一条链（每一步都撞墙，u 每次减 1）：</text>
  <rect x="46" y="270" width="768" height="44" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="430" y="298" text-anchor="middle" font-size="12.4" fill="#8c3a37" filter="url(#rough2)">F(9,81) → F(8,80) → F(7,63) → F(6,48) → F(5,47) → F(4,24) → F(3,15) → F(2,8) → F(1,7) = 1</text>

  <!-- 复杂度 -->
  <rect x="46" y="326" width="768" height="72" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="62" y="350" font-size="12.4" font-weight="bold" fill="#33582a" filter="url(#rough2)">规模与实测（n = 3 × 10⁵，单组）</text>
  <text x="62" y="372" font-size="11.7" fill="#33582a" filter="url(#rough2)">段表总长 = Σ_a |bucket[a]| = Σ_k ⌊(k − 1)/rad(k)⌋ ≈ 6 × 10⁶；筛桶 O(6 × 10⁶)，DP O(1.2 × 10⁷)。</text>
  <text x="62" y="391" font-size="11.7" fill="#33582a" filter="url(#rough2)">C++17 实测约 0.4 s（限时 3 s，余量 7 倍）；Python 需 PyPy3 才能接近时限。</text>
</svg>
