<svg xmlns="http://www.w3.org/2000/svg" width="740" height="430" viewBox="0 0 740 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="117"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="740" height="430" fill="#fafafa"/>

  <text x="370" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 n = 10：只有 1 和 10 两个数</text>
  <path d="M 150 44 Q 370 50 590 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="370" y="66" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">按长度从小到大生成候选，逐个与 n 比较</text>

  <!-- 候选卡片 -->
  <g filter="url(#rough2)">
    <rect x="38" y="86" width="96" height="78" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="150" y="86" width="96" height="78" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="262" y="86" width="96" height="78" rx="9" fill="#fde8e8" stroke="#b85450" stroke-width="1.5"/>
    <rect x="374" y="86" width="96" height="78" rx="9" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.3"/>
    <rect x="486" y="86" width="96" height="78" rx="9" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.3"/>
    <rect x="598" y="86" width="96" height="78" rx="9" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.3"/>
  </g>
  <text x="86" y="126" text-anchor="middle" font-size="17" font-weight="bold" fill="#2f5223" filter="url(#rough2)">1</text>
  <text x="198" y="126" text-anchor="middle" font-size="17" font-weight="bold" fill="#2f5223" filter="url(#rough2)">10</text>
  <text x="310" y="126" text-anchor="middle" font-size="17" font-weight="bold" fill="#8a3b36" filter="url(#rough2)">11</text>
  <text x="422" y="126" text-anchor="middle" font-size="16" fill="#777" filter="url(#rough2)">100</text>
  <text x="534" y="126" text-anchor="middle" font-size="16" fill="#777" filter="url(#rough2)">101</text>
  <text x="646" y="126" text-anchor="middle" font-size="16" fill="#777" filter="url(#rough2)">110</text>

  <text x="86" y="154" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">≤ 10 ✓</text>
  <text x="198" y="154" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">≤ 10 ✓</text>
  <text x="310" y="154" text-anchor="middle" font-size="11" fill="#8a3b36" filter="url(#rough2)">11 &gt; 10 ✗</text>
  <text x="422" y="154" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">&gt; 10 ✗</text>
  <text x="534" y="154" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">&gt; 10 ✗</text>
  <text x="646" y="154" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">&gt; 10 ✗</text>

  <text x="370" y="190" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">长度越大，数值越大；后面的 111、1000、…… 全部超过 10，不再计数</text>

  <!-- 结论 -->
  <rect x="38" y="210" width="656" height="80" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="58" y="238" font-size="13.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">合法的只有 1 和 10，共 2 个 → 输出 2</text>
  <text x="58" y="264" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">候选并不是 1..10 全部整数，而是“只含 0/1”的 1、10、11、100、……</text>
  <text x="58" y="282" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">若暴力枚举 1..n，n = 10⁹ 时要做 10⁹ 次检查；这里只生成 1023 个数。</text>

  <!-- 大 n 对照 -->
  <rect x="38" y="306" width="656" height="104" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="58" y="334" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">极值对照</text>
  <text x="58" y="360" font-size="12" fill="#7a5a1b" filter="url(#rough2)">n = 999999999：长度 1..9 的数全部 ≤ n，共 1 + 2 + … + 256 = 511</text>
  <text x="58" y="384" font-size="12" fill="#7a5a1b" filter="url(#rough2)">n = 1000000000：再多一个 1000000000，共 512</text>
  <text x="58" y="404" font-size="11" fill="#777" filter="url(#rough2)">这两个值是本题的答案上界，任何 n 的答案都落在 1..512 之间。</text>
</svg>
