<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="760" height="430" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="17" fill="#333"
        filter="url(#rough2)">固定 X 后：每个位置的下界是一族「锥」的最大值</text>
  <text x="380" y="54" text-anchor="middle" font-size="12" fill="#666"
        filter="url(#rough2)">沿最短弧走一步，相邻高度差最多 X ⇒ a_i ≥ h_j − X·d(i,j)，其中 d 是环上最短弧长</text>

  <!-- 左：环 -->
  <circle cx="200" cy="235" r="95" fill="none" stroke="#b9c8dd"
          stroke-width="1.6" stroke-dasharray="7 6" filter="url(#rough2)"/>
  <ellipse cx="200" cy="235" rx="78" ry="42" fill="#e8f0fe" stroke="#446688"
           stroke-width="1.2" filter="url(#rough2)"/>
  <text x="200" y="230" text-anchor="middle" font-size="12" fill="#2c4a6b"
        filter="url(#rough2)">每跨一段</text>
  <text x="200" y="250" text-anchor="middle" font-size="13" fill="#8a3a36"
        font-weight="bold" filter="url(#rough2)">下界降 X = 3</text>

  <!-- 六个节段：h 写在盒子里 -->
  <rect x="178" y="127" width="44" height="26" rx="5" fill="#fff8e1" stroke="#d6a040"
        stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="146" text-anchor="middle" font-size="14" fill="#8a5a00"
        font-weight="bold" filter="url(#rough2)">9</text>

  <rect x="260" y="175" width="44" height="26" rx="5" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="282" y="194" text-anchor="middle" font-size="13" fill="#2c4a6b"
        filter="url(#rough2)">7</text>

  <rect x="260" y="270" width="44" height="26" rx="5" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="282" y="289" text-anchor="middle" font-size="13" fill="#2c4a6b"
        filter="url(#rough2)">3</text>

  <rect x="178" y="317" width="44" height="26" rx="5" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="200" y="336" text-anchor="middle" font-size="13" fill="#2c4a6b"
        filter="url(#rough2)">4</text>

  <rect x="96" y="270" width="44" height="26" rx="5" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="118" y="289" text-anchor="middle" font-size="13" fill="#2c4a6b"
        filter="url(#rough2)">1</text>

  <rect x="96" y="175" width="44" height="26" rx="5" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="118" y="194" text-anchor="middle" font-size="13" fill="#2c4a6b"
        filter="url(#rough2)">2</text>

  <!-- 从最高点向两侧传的下界标注 -->
  <text x="312" y="160" font-size="11" fill="#8a3a36" filter="url(#rough2)">≥ 9−3=6</text>
  <text x="40" y="160" font-size="11" fill="#8a3a36" filter="url(#rough2)">≥ 6</text>
  <text x="318" y="316" font-size="11" fill="#8a3a36" filter="url(#rough2)">≥ 3</text>
  <text x="40" y="316" font-size="11" fill="#8a3a36" filter="url(#rough2)">≥ 3</text>

  <path d="M226,150 L254,172" stroke="#b85450" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M174,150 L148,172" stroke="#b85450" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M300,203 L300,262" stroke="#4a7a3a" stroke-width="1.6" fill="none"
        stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M100,203 L100,262" stroke="#4a7a3a" stroke-width="1.6" fill="none"
        stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="200" y="392" text-anchor="middle" font-size="11.5" fill="#777"
        filter="url(#rough2)">h = (9, 7, 3, 4, 1, 2)，顺时针排列</text>

  <!-- 右：公式与结论 -->
  <rect x="368" y="76" width="368" height="58" rx="10" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.8" filter="url(#rough2)"/>
  <text x="552" y="112" text-anchor="middle" font-size="16" fill="#1f3a5f"
        filter="url(#rough2)">a_i = max_j ( h_j − X·d(i,j) )</text>

  <text x="384" y="164" font-size="12" fill="#333" filter="url(#rough2)">① 任一可行解都满足 a_i ≥ h_j − X·d(i,j)（三角不等式）</text>
  <text x="384" y="192" font-size="12" fill="#333" filter="url(#rough2)">② 取 max 得到的 a 自身合法：相邻两格只差一个 X</text>
  <text x="384" y="220" font-size="12" fill="#333" filter="url(#rough2)">③ 逐点最小 ⇒ 缺口之和就是「最少用土量」</text>

  <rect x="368" y="238" width="368" height="112" rx="10" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.8" filter="url(#rough2)"/>
  <text x="384" y="264" font-size="12.5" fill="#2f5a24" filter="url(#rough2)">X = 3 时：a = (9, 7, 4, 4, 3, 6)</text>
  <text x="384" y="290" font-size="12" fill="#333" filter="url(#rough2)">土 = 0 + 0 + 1 + 0 + 2 + 4 = 7</text>
  <text x="384" y="316" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">第 3 段 3→4 由 h=7 的锥决定；</text>
  <text x="384" y="336" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">第 6 段 2→6 由 h=9 绕短弧 1 步决定</text>

  <rect x="368" y="362" width="368" height="48" rx="10" fill="#fff8e1" stroke="#d6a040"
        stroke-width="2" filter="url(#rough2)"/>
  <text x="552" y="392" text-anchor="middle" font-size="13" fill="#8a5a00"
        filter="url(#rough2)">可行 ⟺ 这个最小土量 ≤ k</text>
</svg>
