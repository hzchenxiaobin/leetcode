<svg xmlns="http://www.w3.org/2000/svg" width="740" height="450" viewBox="0 0 740 450"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="740" height="450" fill="#fafafa"/>
  <text x="370.0" y="36" font-size="20" fill="#2b2b2b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">样例 2：正八边形推进墙角，洞是 1/2</text>
  <path d="M 118 46 Q 370 52 622 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <line x1="150.0" y1="380.0" x2="690.0" y2="380.0" stroke="#2b2b2b" stroke-width="2.0" marker-end="url(#arrb2)" filter="url(#rough2)"/>
  <line x1="150.0" y1="380.0" x2="150.0" y2="70.0" stroke="#2b2b2b" stroke-width="2.0" marker-end="url(#arrb2)" filter="url(#rough2)"/>
  <text x="696" y="384" font-size="13" fill="#2b2b2b" text-anchor="start" font-weight="bold" filter="url(#rough2)">x</text>
  <text x="136" y="66" font-size="13" fill="#2b2b2b" text-anchor="start" font-weight="bold" filter="url(#rough2)">y</text>
  <polygon points="430.0,50.0 480.0,100.0 480.0,200.0 430.0,250.0 330.0,250.0 280.0,200.0 280.0,100.0 330.0,50.0" fill="#e8f0fe" fill-opacity="0.8" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <polygon points="280.0,250.0 330.0,250.0 280.0,200.0" fill="#fff3e0" fill-opacity="0.9" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="294.0" y="235.0" font-size="13" fill="#8a6015" text-anchor="middle" font-weight="bold" filter="url(#rough2)">洞</text>
  <circle cx="330.0" cy="250.0" r="5" fill="#b85450" filter="url(#rough2)"/>
  <text x="324.0" y="270.0" font-size="13" fill="#8a3030" text-anchor="start" font-weight="bold" filter="url(#rough2)">A′</text>
  <circle cx="280.0" cy="200.0" r="5" fill="#b85450" filter="url(#rough2)"/>
  <text x="256.0" y="198.0" font-size="13" fill="#8a3030" text-anchor="start" font-weight="bold" filter="url(#rough2)">B′</text>
  <text x="365.0" y="295.0" font-size="11.5" fill="#2f4a66" text-anchor="start" filter="url(#rough2)">底边贴 x 轴、左边贴 y 轴</text>
  <text x="365.0" y="325.0" font-size="11.5" fill="#2f4a66" text-anchor="start" filter="url(#rough2)">斜边 (−1,−2)–(−2,−1) 平移后成为 A′B′</text>
  <rect x="430" y="60" width="270" height="120" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="446" y="86" font-size="12.5" fill="#8a6015" text-anchor="start" font-weight="bold" filter="url(#rough2)">洞 = 三角形 O A′ B′</text>
  <text x="446" y="112" font-size="12" fill="#7a5a1b" text-anchor="start" filter="url(#rough2)">|OA′| = |OB′| = 1</text>
  <text x="446" y="138" font-size="12.5" fill="#8a6015" text-anchor="start" font-weight="bold" filter="url(#rough2)">面积 = 1/2 · 1 · 1 = 0.5</text>
  <text x="446" y="164" font-size="11.5" fill="#7a5a1b" text-anchor="start" filter="url(#rough2)">与样例输出 0.5 一致</text>
</svg>
