<svg xmlns="http://www.w3.org/2000/svg" width="780" height="390" viewBox="0 0 780 390"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="227"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="780" height="390" fill="#fafafa"/>
  <text x="390" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两条弦“交错”⇔ 无论同在内侧还是外侧都会相交</text>
  <path d="M 120 40 Q 390 46 660 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <circle cx="210" cy="200" r="95" fill="#eef4fb" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="560" cy="200" r="95" fill="#eef4fb" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="162.5" y1="117.7" x2="292.3" y2="152.5" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <line x1="257.5" y1="117.7" x2="127.7" y2="247.5" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <line x1="466.4" y1="183.5" x2="543.5" y2="106.4" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <line x1="576.5" y1="106.4" x2="649.3" y2="167.5" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="210" y="330" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">端点交错：必相交 → 必须一内一外</text>
  <text x="560" y="330" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">端点不交错：可同侧</text>
  <text x="390" y="368" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">规范化 a&lt;b、c&lt;d 后，交错即 a&lt;c&lt;b&lt;d 或 c&lt;a&lt;d&lt;b。</text>

</svg>
