<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1277"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="340" fill="#fafafa"/>
  <text x="360.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按前缀分段的字典序</text>
  <path d="M 115.2 42 Q 360.0 48 604.8 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="360.0" y="326" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">每段先"恰好等于 P"，再按 a..z 接子段</text>
  <rect x="60" y="70" width="600" height="50" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="100" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#335478" filter="url(#rough2)">根：a 段(S=3) | b 段(S=2) | c 段(S=1)</text>
  <rect x="60" y="140" width="200" height="50" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="170" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">a: a, ab, abc</text>
  <rect x="280" y="140" width="180" height="50" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="370" y="170" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">b: b, bc</text>
  <rect x="480" y="140" width="180" height="50" rx="7" fill="#fbeeee" stroke="#a05a5a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="570" y="170" text-anchor="middle" font-size="11.5" fill="#8c2f2c" filter="url(#rough2)">c: c</text>
  <line x1="160.0" y1="125.0" x2="160.0" y2="138.0" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <line x1="370.0" y1="125.0" x2="370.0" y2="138.0" stroke="#d6a040" stroke-width="1.4" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <line x1="570.0" y1="125.0" x2="570.0" y2="138.0" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="360" y="225" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">段大小 S[v] = Σ_{p∈endpos(v)}(n−p)；精确段大小 = |endpos(v)|</text>
  <text x="360" y="255" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">"abc" k=5：跳过 a(3)，进 b 段，精确 b(1) 后取 c 段 → bc</text>
  <text x="360" y="290" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">SAM 上每步 O(26)，总 O(26n)</text>
</svg>
