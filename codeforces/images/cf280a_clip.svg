<svg xmlns="http://www.w3.org/2000/svg" width="880" height="290" viewBox="0 0 880 290"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="290" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">Sutherland–Hodgman 裁剪</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">矩形 ∩ 旋转矩形 = 凸多边形</text>
  <text x="150" y="110" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">两个矩形同心：一个是轴对齐的 w×h，另一个旋转 alpha</text>
  <text x="150" y="152" text-anchor="start" font-size="12" fill="#2f4a66" filter="url(#rough2)">交集是凸多边形 → 用旋转后矩形的 4 个顶点，被轴对齐矩形的 4 条边裁剪</text>
  <text x="150" y="196" text-anchor="start" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">裁剪后按鞋带公式求面积；alpha=0/180 时就是 w*h</text>
</svg>
