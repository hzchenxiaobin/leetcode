<svg xmlns="http://www.w3.org/2000/svg" width="720" height="370" viewBox="0 0 720 370"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="370" fill="#fafafa"/>
  <text x="360.0" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">203E：答案只与“出勤人数”有关</text>
  <path d="M 144.00 46 Q 360.0 52 576.00 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="72" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">若自己走的机器人里至少有 1 个 c_i ≥ 1，则总运输数只依赖“自己走的人数 k”：</text>
  <rect x="170" y="96" width="380" height="56" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="184" y="114" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">total(k) = min( N1 + K + k , n )</text>
  <text x="184" y="136" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">N1 = c_i ≥ 1 的机器人总数</text>
  <text x="60" y="186" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">其中 K = Σ_{c_i≥1}(c_i-1)，所以每多带一个“自己走”的机器人，总数就 +1，直到所有人都能走。</text>
  <rect x="60" y="206" width="280" height="100" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="224" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">可行性的两件事：</text>
  <text x="74" y="246" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">① 按 f_i 升序取前缀，</text>
  <text x="74" y="268" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">   使 k 尽可能大（fuel ≤ S）</text>
  <text x="74" y="290" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">② 这 k 个里至少有一个</text>
  <text x="74" y="312" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">   c_i ≥ 1 的机器人</text>
  <rect x="360" y="206" width="320" height="100" rx="9" fill="#fdeef1" stroke="#c0708a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="374" y="224" text-anchor="start" font-size="11" fill="#8a3a52" filter="url(#rough2)">最小代价 = p[k]（最便宜的 c≥1 就在前 k 个）</text>
  <text x="374" y="246" text-anchor="start" font-size="11" fill="#8a3a52" filter="url(#rough2)">          或 p[k-1] + f_j</text>
  <text x="374" y="268" text-anchor="start" font-size="11" fill="#8a3a52" filter="url(#rough2)">j = 最便宜的 c≥1 机器人的排名</text>
  <text x="374" y="290" text-anchor="start" font-size="11" fill="#8a3a52" filter="url(#rough2)">两条都枚举，取“人数最大、再fuel 最小”</text>
  <text x="60" y="336" text-anchor="start" font-size="10.5" fill="#8a3a52" filter="url(#rough2)">若 c≥1 的移动者一个都没有（或没有合法的），则只能运走这些自己走的 c=0 机器人：total = k。</text>
</svg>
