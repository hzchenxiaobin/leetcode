<svg xmlns="http://www.w3.org/2000/svg" width="740" height="370" viewBox="0 0 740 370"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="87"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="g1" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="r1" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="740" height="370" fill="#fafafa"/>
  <text x="370" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每个环从编号最小的点出发，正反各被数一次</text>

  <!-- 五边形 -->
  <polygon points="230,80 339,155 297,283 163,283 121,155" fill="#f4f6f9" stroke="#8a94a6" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- 顺时针箭头 -->
  <g stroke="#4a7a3a" stroke-width="2.2" fill="none" filter="url(#rough2)">
    <line x1="243" y1="88" x2="325" y2="148" marker-end="url(#g1)"/>
    <line x1="333" y1="172" x2="305" y2="266" marker-end="url(#g1)"/>
    <line x1="279" y1="283" x2="181" y2="283" marker-end="url(#g1)"/>
    <line x1="156" y1="266" x2="128" y2="172" marker-end="url(#g1)"/>
    <line x1="135" y1="143" x2="216" y2="84" marker-end="url(#g1)"/>
  </g>
  <text x="360" y="330" font-size="12" fill="#2f5223" filter="url(#rough2)">绿色：1→2→3→4→5→1</text>

  <!-- 逆时针示意箭头（只画一段 + 说明） -->
  <g stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" fill="none" filter="url(#rough2)">
    <line x1="216" y1="84" x2="135" y2="143" marker-end="url(#r1)"/>
  </g>
  <text x="60" y="330" font-size="12" fill="#8f3b37" filter="url(#rough2)">红色虚线：1→5→4→3→2→1</text>

  <!-- 顶点 -->
  <g filter="url(#rough2)">
    <circle cx="230" cy="80" r="15" fill="#fce8e6" stroke="#b85450" stroke-width="2.2"/>
    <text x="230" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#8f3b37">1</text>
    <circle cx="339" cy="155" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="339" y="160" text-anchor="middle" font-size="12" fill="#2f4a66">2</text>
    <circle cx="297" cy="283" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="297" y="288" text-anchor="middle" font-size="12" fill="#2f4a66">3</text>
    <circle cx="163" cy="283" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="163" y="288" text-anchor="middle" font-size="12" fill="#2f4a66">4</text>
    <circle cx="121" cy="155" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="121" y="160" text-anchor="middle" font-size="12" fill="#2f4a66">5</text>
  </g>
  <text x="230" y="60" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8f3b37" filter="url(#rough2)">编号最小 = 起点</text>

  <!-- 右侧说明 -->
  <rect x="400" y="80" width="310" height="230" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <g font-size="12.5" fill="#6d4a10" filter="url(#rough2)">
    <text x="416" y="108">同一个环（同一个顶点集合、</text>
    <text x="416" y="130">同一条绕行路线）有 2|C| 种写法：</text>
    <text x="416" y="156">· |C| 个起点</text>
    <text x="416" y="180">· 2 个方向</text>
    <text x="416" y="212">固定"最小点当起点"后只剩 2 种，</text>
    <text x="416" y="234">所以 DP 把每个环数了两次。</text>
    <text x="416" y="266" font-weight="bold" fill="#8f3b37">答案 = 累加值 / 2</text>
  </g>
  <text x="416" y="300" font-size="12" fill="#6d4a10" filter="url(#rough2)">保证起点真的是"最小点"。</text>
</svg>
