<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">关键下界：等于最大值的捐款必然「愉快」</text>
  <text x="300" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">愉快 ⇔ a[m]·(m−1) ≥ 前 m−1 项之和 ⇔ a[m] 不低于前缀平均值</text>

  <g filter="url(#rough2)">
    <rect x="50" y="62" width="500" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
    <text x="300" y="82" text-anchor="middle" font-size="11.5" fill="#8a6a20">记 M = max a，L = 数值等于 M 的元素个数</text>
    <text x="300" y="100" text-anchor="middle" font-size="10" fill="#9a8a60">若 a[m] = M：前缀和 ≤ (m−1)·M ⟹ M·(m−1) ≥ 前缀和 ⟹ 第 m 个必愉快</text>
  </g>

  <!-- 一组任意顺序下的判定 -->
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="60" y="126" width="70" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="6"/>
    <text x="95" y="154" fill="#8a3a36" font-weight="bold">7</text>
    <rect x="146" y="126" width="70" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="181" y="154" fill="#3a4a66">−4</text>
    <rect x="232" y="126" width="70" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="6"/>
    <text x="267" y="154" fill="#8a3a36" font-weight="bold">7</text>
    <rect x="318" y="126" width="70" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="353" y="154" fill="#3a4a66">0</text>
    <rect x="404" y="126" width="70" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="439" y="154" fill="#3a4a66">−1</text>
    <rect x="490" y="126" width="70" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="525" y="154" fill="#3a4a66">0</text>
  </g>

  <g filter="url(#rough2)" font-size="9.5" text-anchor="middle" fill="#888">
    <text x="95" y="186">m=1</text>
    <text x="181" y="186">m=2</text>
    <text x="267" y="186">m=3</text>
    <text x="353" y="186">m=4</text>
    <text x="439" y="186">m=5</text>
    <text x="525" y="186">m=6</text>
  </g>

  <g filter="url(#rough2)" font-size="9.5" text-anchor="middle" fill="#667">
    <text x="95" y="206">Σ=0</text>
    <text x="181" y="206">Σ=7</text>
    <text x="267" y="206">Σ=3</text>
    <text x="353" y="206">Σ=10</text>
    <text x="439" y="206">Σ=10</text>
    <text x="525" y="206">Σ=9</text>
  </g>

  <g filter="url(#rough2)" font-size="12" font-weight="bold" text-anchor="middle">
    <text x="95" y="228" fill="#4a7a3a">✓</text>
    <text x="181" y="228" fill="#b85450">✗</text>
    <text x="267" y="228" fill="#4a7a3a">✓</text>
    <text x="353" y="228" fill="#b85450">✗</text>
    <text x="439" y="228" fill="#b85450">✗</text>
    <text x="525" y="228" fill="#b85450">✗</text>
  </g>

  <text x="300" y="250" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">红色格子是 M = 7 的两个副本（L = 2），无论在什么位置都必愉快；此顺序恰好 2 个 ✓</text>

  <g filter="url(#rough2)">
    <rect x="70" y="264" width="460" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
    <text x="300" y="284" text-anchor="middle" font-size="11.5" fill="#2f4f28">愉快个数 ≥ L：这 L 个 M 是「白送」的，任何顺序都躲不掉</text>
    <text x="300" y="301" text-anchor="middle" font-size="9.5" fill="#3a5a30">只需一步：前 m−1 项都 ≤ M，它们的和自然 ≤ (m−1)·M</text>
  </g>

  <path d="M 300 314 L 300 336" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="110" y="340" width="380" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10"/>
    <text x="300" y="359" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3a36">k &lt; L ⟹ 一定无解，输出 NO</text>
    <text x="300" y="376" text-anchor="middle" font-size="9.5" fill="#8a3a36">反过来 k ≥ L 时总有解，构造见下一张图</text>
  </g>
</svg>
