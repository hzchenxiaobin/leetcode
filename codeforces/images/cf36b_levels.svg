<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="420" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每步：白格换成模板，黑格换成全黑块</text>
  <path d="M 120 42 Q 360 48 600 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 模型 2x2 -->
  <text x="90" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">模板 n=2</text>
  <g filter="url(#rough2)">
    <rect x="40" y="90" width="50" height="50" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <rect x="90" y="90" width="50" height="50" fill="#2b2b2b" stroke="#446688" stroke-width="1.4"/>
    <rect x="40" y="140" width="50" height="50" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <rect x="90" y="140" width="50" height="50" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="65" y="120" font-size="16" text-anchor="middle" fill="#888" filter="url(#rough2)">.</text>
  <text x="115" y="120" font-size="16" text-anchor="middle" fill="#fff" filter="url(#rough2)">*</text>
  <text x="65" y="170" font-size="16" text-anchor="middle" fill="#888" filter="url(#rough2)">.</text>
  <text x="115" y="170" font-size="16" text-anchor="middle" fill="#888" filter="url(#rough2)">.</text>

  <path d="M 160 140 L 200 140" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 4x4 -->
  <text x="300" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">第 2 步 4×4</text>
  <g filter="url(#rough2)">
    <rect x="210" y="90" width="180" height="180" fill="#fff" stroke="#446688" stroke-width="1.4"/>
    <g fill="#2b2b2b">
      <rect x="255" y="90" width="45" height="45"/><rect x="300" y="90" width="45" height="45"/><rect x="345" y="90" width="45" height="45"/>
      <rect x="300" y="135" width="45" height="45"/><rect x="345" y="135" width="45" height="45"/>
      <rect x="255" y="180" width="45" height="45"/><rect x="345" y="180" width="45" height="45"/>
    </g>
    <g stroke="#446688" stroke-width="0.8" opacity="0.5">
      <line x1="255" y1="90" x2="255" y2="270"/><line x1="300" y1="90" x2="300" y2="270"/>
      <line x1="345" y1="90" x2="345" y2="270"/>
      <line x1="210" y1="135" x2="390" y2="135"/><line x1="210" y1="180" x2="390" y2="180"/>
      <line x1="210" y1="225" x2="390" y2="225"/>
    </g>
  </g>

  <path d="M 405 180 L 445 180" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 8x8 -->
  <text x="590" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">第 3 步 8×8</text>
  <g filter="url(#rough2)">
    <rect x="460" y="90" width="240" height="240" fill="#fff" stroke="#446688" stroke-width="1.4"/>
    <g fill="#2b2b2b">
      <rect x="490" y="90" width="30" height="30"/>
      <rect x="520" y="90" width="30" height="30"/>
      <rect x="550" y="90" width="30" height="30"/>
      <rect x="580" y="90" width="30" height="30"/>
      <rect x="610" y="90" width="30" height="30"/>
      <rect x="640" y="90" width="30" height="30"/>
      <rect x="670" y="90" width="30" height="30"/>
      <rect x="520" y="120" width="30" height="30"/>
      <rect x="550" y="120" width="30" height="30"/>
      <rect x="580" y="120" width="30" height="30"/>
      <rect x="610" y="120" width="30" height="30"/>
      <rect x="640" y="120" width="30" height="30"/>
      <rect x="670" y="120" width="30" height="30"/>
      <rect x="490" y="150" width="30" height="30"/>
      <rect x="550" y="150" width="30" height="30"/>
      <rect x="580" y="150" width="30" height="30"/>
      <rect x="610" y="150" width="30" height="30"/>
      <rect x="640" y="150" width="30" height="30"/>
      <rect x="670" y="150" width="30" height="30"/>
      <rect x="580" y="180" width="30" height="30"/>
      <rect x="610" y="180" width="30" height="30"/>
      <rect x="640" y="180" width="30" height="30"/>
      <rect x="670" y="180" width="30" height="30"/>
      <rect x="490" y="210" width="30" height="30"/>
      <rect x="520" y="210" width="30" height="30"/>
      <rect x="550" y="210" width="30" height="30"/>
      <rect x="610" y="210" width="30" height="30"/>
      <rect x="640" y="210" width="30" height="30"/>
      <rect x="670" y="210" width="30" height="30"/>
      <rect x="520" y="240" width="30" height="30"/>
      <rect x="550" y="240" width="30" height="30"/>
      <rect x="640" y="240" width="30" height="30"/>
      <rect x="670" y="240" width="30" height="30"/>
      <rect x="490" y="270" width="30" height="30"/>
      <rect x="550" y="270" width="30" height="30"/>
      <rect x="610" y="270" width="30" height="30"/>
      <rect x="670" y="270" width="30" height="30"/>
    </g>
    <g stroke="#446688" stroke-width="0.5" opacity="0.35">
      <line x1="490" y1="90" x2="490" y2="330"/><line x1="520" y1="90" x2="520" y2="330"/>
      <line x1="550" y1="90" x2="550" y2="330"/><line x1="580" y1="90" x2="580" y2="330"/>
      <line x1="610" y1="90" x2="610" y2="330"/><line x1="640" y1="90" x2="640" y2="330"/>
      <line x1="670" y1="90" x2="670" y2="330"/>
      <line x1="460" y1="120" x2="700" y2="120"/><line x1="460" y1="150" x2="700" y2="150"/>
      <line x1="460" y1="180" x2="700" y2="180"/><line x1="460" y1="210" x2="700" y2="210"/>
      <line x1="460" y1="240" x2="700" y2="240"/><line x1="460" y1="270" x2="700" y2="270"/>
      <line x1="460" y1="300" x2="700" y2="300"/>
    </g>
  </g>

  <rect x="40" y="352" width="640" height="56" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <g font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">
    <text x="56" y="376">第 t 步边长 nᵗ。白格继续细分，黑格整块变黑，所以每个最终格子只被写一次。</text>
    <text x="56" y="398">图中 8×8 就是样例 1（n=2,k=3）的最终图案。</text>
  </g>
</svg>
