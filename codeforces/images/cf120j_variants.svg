<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1219"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="380" fill="#fafafa"/>
  <text x="360.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">四个变体与第一象限代表点</text>
  <path d="M 115.2 42 Q 360.0 48 604.8 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <line x1="120.0" y1="175.0" x2="600.0" y2="175.0" stroke="#333333" stroke-width="1.2" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <line x1="360.0" y1="55.0" x2="360.0" y2="295.0" stroke="#333333" stroke-width="1.2" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <circle cx="430" cy="220" r="6" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="438" y="212" text-anchor="start" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">(x,y)</text>
  <circle cx="290" cy="220" r="6" fill="#5a7fb0" filter="url(#rough2)"/>
  <text x="298" y="212" text-anchor="start" font-size="10.5" fill="#5a7fb0" filter="url(#rough2)">(-x,y)</text>
  <circle cx="430" cy="130" r="6" fill="#d6a040" filter="url(#rough2)"/>
  <text x="438" y="122" text-anchor="start" font-size="10.5" fill="#d6a040" filter="url(#rough2)">(x,-y)</text>
  <circle cx="290" cy="130" r="6" fill="#b85450" filter="url(#rough2)"/>
  <text x="298" y="122" text-anchor="start" font-size="10.5" fill="#b85450" filter="url(#rough2)">(-x,-y)</text>
  <text x="360" y="320" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">取第一象限代表 (|x|,|y|)；最近点对距离 = 最小 |v_i^{k1}+v_j^{k2}|</text>
  <text x="360" y="350" text-anchor="middle" font-size="11.5" fill="#335478" filter="url(#rough2)">再按原符号还原 k1、k2（两者符号相反才能抵消）；变体即 (±|x|, ±|y|)</text>
</svg>
