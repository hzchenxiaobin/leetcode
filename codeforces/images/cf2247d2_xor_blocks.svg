<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 386"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough3">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
  </defs>

  <rect width="660" height="386" fill="#fafafa" filter="url(#rough2)"/>

  <text x="330" y="32" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    k 固定时：交换图 G_k 的连通块恰是长度为 L 的对齐块
  </text>
  <text x="330" y="56" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">
    L = 大于 k 的最小 2 的幂，即 k ∈ [L/2, L−1]；块内可任意重排，跨块永远换不过去
  </text>

  <!-- row A: k = 0, L = 1 -->
  <text x="24" y="112" font-size="12.5" fill="#446688" filter="url(#rough2)">k = 0, L = 1</text>
  <!-- row B -->
  <text x="24" y="182" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">k = 2, L = 4</text>
  <text x="24" y="199" font-size="10" fill="#888" filter="url(#rough2)">(k=3 也一样)</text>
  <!-- row C -->
  <text x="24" y="252" font-size="12.5" fill="#b8860b" filter="url(#rough2)">k = 6, L = 8</text>
  <text x="24" y="269" font-size="10" fill="#888" filter="url(#rough2)">(k=4..7 都一样)</text>

  <!-- cells -->
  <g filter="url(#rough2)">
    <!-- row A -->
    <rect x="170" y="88" width="44" height="34" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <rect x="222" y="88" width="44" height="34" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <rect x="274" y="88" width="44" height="34" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <rect x="326" y="88" width="44" height="34" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <rect x="378" y="88" width="44" height="34" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <rect x="430" y="88" width="44" height="34" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <rect x="482" y="88" width="44" height="34" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <rect x="534" y="88" width="44" height="34" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <!-- row B -->
    <rect x="170" y="158" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="222" y="158" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="274" y="158" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="326" y="158" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="378" y="158" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="430" y="158" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="482" y="158" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="534" y="158" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <!-- row C -->
    <rect x="170" y="228" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="222" y="228" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="274" y="228" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="326" y="228" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="378" y="228" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="430" y="228" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="482" y="228" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="534" y="228" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>

  <!-- values -->
  <g font-size="13" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="192" y="110">7</text><text x="244" y="110">1</text><text x="296" y="110">9</text><text x="348" y="110">3</text>
    <text x="400" y="110">2</text><text x="452" y="110">8</text><text x="504" y="110">4</text><text x="556" y="110">6</text>
    <text x="192" y="180">7</text><text x="244" y="180">1</text><text x="296" y="180">9</text><text x="348" y="180">3</text>
    <text x="400" y="180">2</text><text x="452" y="180">8</text><text x="504" y="180">4</text><text x="556" y="180">6</text>
    <text x="192" y="250">7</text><text x="244" y="250">1</text><text x="296" y="250">9</text><text x="348" y="250">3</text>
    <text x="400" y="250">2</text><text x="452" y="250">8</text><text x="504" y="250">4</text><text x="556" y="250">6</text>
  </g>

  <!-- index labels -->
  <g font-size="10" fill="#999" text-anchor="middle" filter="url(#rough2)">
    <text x="192" y="134">0</text><text x="244" y="134">1</text><text x="296" y="134">2</text><text x="348" y="134">3</text>
    <text x="400" y="134">4</text><text x="452" y="134">5</text><text x="504" y="134">6</text><text x="556" y="134">7</text>
    <text x="192" y="204">0</text><text x="244" y="204">1</text><text x="296" y="204">2</text><text x="348" y="204">3</text>
    <text x="400" y="204">4</text><text x="452" y="204">5</text><text x="504" y="204">6</text><text x="556" y="204">7</text>
    <text x="192" y="274">0</text><text x="244" y="274">1</text><text x="296" y="274">2</text><text x="348" y="274">3</text>
    <text x="400" y="274">4</text><text x="452" y="274">5</text><text x="504" y="274">6</text><text x="556" y="274">7</text>
  </g>

  <!-- brackets -->
  <g fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough3)">
    <path d="M172,150 L172,142 L368,142 L368,150"/>
    <path d="M380,150 L380,142 L576,142 L576,150"/>
  </g>
  <g fill="none" stroke="#d6a040" stroke-width="1.8" filter="url(#rough3)">
    <path d="M172,220 L172,212 L576,212 L576,220"/>
  </g>
  <g fill="none" stroke="#446688" stroke-width="1.5" stroke-dasharray="4 4" filter="url(#rough3)">
    <path d="M218,94 L218,116"/><path d="M270,94 L270,116"/><path d="M322,94 L322,116"/>
    <path d="M374,94 L374,116"/><path d="M426,94 L426,116"/><path d="M478,94 L478,116"/>
    <path d="M530,94 L530,116"/>
    <path d="M374,234 L374,256"/>
  </g>
  <text x="276" y="139" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">块 0</text>
  <text x="484" y="139" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">块 1</text>
  <text x="300" y="209" font-size="10.5" fill="#b8860b" filter="url(#rough2)">整段一块</text>

  <!-- bottom conclusion -->
  <rect x="34" y="292" width="592" height="76" rx="10" fill="#ffffff" stroke="#b85450"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="50" y="314" font-size="12.5" fill="#b85450" filter="url(#rough2)">
    边界 m 坏 ⇔ max(a[0..m−1]) &gt; min(a[m..n−1])
  </text>
  <text x="50" y="336" font-size="12.5" fill="#333" filter="url(#rough2)">
    k = 2 时 L = 4：左块最大 9 &gt; 右块最小 2，边界 m = 4 坏 ⇒ k = 2 不够，必须 L 翻倍成 8
  </text>
  <text x="50" y="357" font-size="12.5" fill="#333" filter="url(#rough2)">
    所以答案只可能取 0, 1, 2, 4, 8, …：一个 2 的幂，由“最深的坏边界”决定
  </text>
</svg>
