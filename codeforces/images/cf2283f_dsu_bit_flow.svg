<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="600" height="430" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：并查集求 first，离线树状数组计数</text>
  <text x="300" y="48" text-anchor="middle" font-size="11" fill="#888">两步都是线性的：每个位置只被赋值一次，每个询问只查一次前缀和</text>

  <g filter="url(#rough2)">
    <rect x="22" y="66" width="272" height="212" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10"/>
    <text x="158" y="88" text-anchor="middle" font-size="12" fill="#2f4a66" font-weight="bold">① 并查集求 first[j]</text>
    <text x="36" y="112" font-size="10" fill="#3a4a66">i 从 2 到 n 递增扫描区间：</text>
    <text x="36" y="132" font-size="10" fill="#3a4a66">对 [l_i, r_i] 中尚未赋值的位置 j：</text>
    <text x="46" y="152" font-size="10" fill="#3a4a66">first[j] = i，par[j] = find(j+1)</text>
    <text x="36" y="176" font-size="10" fill="#b85450">已赋值的位置由并查集一步跳过</text>

    <rect x="46" y="190" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <rect x="72" y="190" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <rect x="98" y="190" width="24" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="124" y="190" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <rect x="150" y="190" width="24" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="176" y="190" width="24" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="3"/>
    <rect x="202" y="190" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <rect x="228" y="190" width="24" height="24" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="3"/>
    <text x="58" y="207" text-anchor="middle" font-size="9" fill="#3a5a30">2</text>
    <text x="84" y="207" text-anchor="middle" font-size="9" fill="#3a5a30">3</text>
    <text x="110" y="207" text-anchor="middle" font-size="9" fill="#3a4a66">4</text>
    <text x="136" y="207" text-anchor="middle" font-size="9" fill="#3a5a30">5</text>
    <text x="162" y="207" text-anchor="middle" font-size="9" fill="#3a4a66">6</text>
    <text x="188" y="207" text-anchor="middle" font-size="9" fill="#3a4a66">7</text>
    <text x="214" y="207" text-anchor="middle" font-size="9" fill="#3a5a30">8</text>
    <text x="240" y="207" text-anchor="middle" font-size="9" fill="#3a4a66">9</text>

    <text x="36" y="238" font-size="9" fill="#4a7a3a">绿色 = 已被前面的区间覆盖，白色 = 还没被覆盖</text>
    <path d="M 100 260 L 148 260" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)"/>
    <text x="36" y="266" font-size="9" fill="#8a6a20">find 直接跳向下一个白色位置</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="306" y="66" width="272" height="212" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10"/>
    <text x="442" y="88" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold">② 离线树状数组计数</text>
    <text x="320" y="112" font-size="10" fill="#555555">把询问按 r_i 装桶，让 r 从 n 降到 1：</text>
    <text x="320" y="132" font-size="10" fill="#555555">插入所有 first[j] = r+1 的位置 j</text>
    <text x="320" y="152" font-size="10" fill="#555555">对每个 r_i = r 的询问查前缀和</text>
    <text x="330" y="174" font-size="10" fill="#b85450">答案 += A − (n − r) − sum(l_i − 1)</text>
    <text x="320" y="198" font-size="10" fill="#555555">A 是当前已插入的位置总数；</text>
    <text x="320" y="218" font-size="10" fill="#555555">因为 first[j] ≥ j+1，编号大于 r 的</text>
    <text x="320" y="238" font-size="10" fill="#555555">位置一定已经被插入，可直接减掉</text>
    <text x="320" y="262" font-size="10" fill="#8a6a20">于是每次询问只要一次前缀和</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="86" y="296" width="428" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8"/>
    <text x="300" y="318" text-anchor="middle" font-size="12" fill="#8a3a34" font-weight="bold">答案 = 所有 i 的「first[j] 大于 r_i 的位置 j 落在 [l_i, r_i] 中」的个数之和</text>
    <text x="300" y="338" text-anchor="middle" font-size="10" fill="#8a3a34">时间 O(n α(n) + n log n)，空间 O(n)</text>
  </g>

  <g filter="url(#rough2)">
    <text x="300" y="374" text-anchor="middle" font-size="10" fill="#888888">第 ① 步把「每个位置第一次被覆盖的区间编号」记录成 first</text>
    <text x="300" y="394" text-anchor="middle" font-size="10" fill="#888888">第 ② 步把它当成二维数点：first[j] 与 j 两个维度，用后缀阈值 + 前缀和回答</text>
    <text x="300" y="414" text-anchor="middle" font-size="10" fill="#888888">整个过程不需要显式建出任何一条边，天然绕开了 O(n²) 的边数</text>
  </g>
</svg>
