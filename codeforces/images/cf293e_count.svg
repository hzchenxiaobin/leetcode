<svg xmlns="http://www.w3.org/2000/svg" width="700" height="290" viewBox="0 0 700 290"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="1003"/>
    <feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></defs>
  <rect width="700" height="290" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">二维计数：按深度排序 + 树状数组 + 双指针</text>
  <path d="M 130 40 Q 350 46 570 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="96" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="12.5" fill="#22314a" filter="url(#rough2)">把集合按 d 升序排。对每个 i（从 d 最大的开始），前缀 d ≤ l − d_i 只会变长 ⇒ 双指针。</text>
  <text x="76" y="106" font-size="12.5" fill="#22314a" filter="url(#rough2)">指针推进时把 w_j 插入树状数组；查询"w ≤ w − w_i"的个数即可。</text>
  <text x="76" y="130" font-size="12.5" fill="#22314a" filter="url(#rough2)">有序对 (i,j) 被算两次、且 i=j 会算进去 ⇒ 减掉自身再除以 2。</text>
  <text x="76" y="150" font-size="12" fill="#2f4a66" filter="url(#rough2)">单次计数 O(k log k)（k 为该层点数）。</text>
  <g filter="url(#rough2)"><rect x="60" y="166" width="580" height="66" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="190" font-size="12.5" fill="#2f5223" filter="url(#rough2)">总复杂度 O(n log² n)：每层总点数 n，共 O(log n) 层；实测 n=1e5 链/随机树 ≈0.25 s。</text>
  <text x="76" y="212" font-size="12.5" fill="#2f5223" filter="url(#rough2)">剪枝：d &gt; l 或 w &gt; w 的节点直接不收集（它们不可能参与任何合法对）。</text>
  <g filter="url(#rough2)"><rect x="60" y="242" width="580" height="36" rx="8" fill="#fbeeee" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="76" y="264" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">易错：树状数组大小要 ≥ 压缩后权值个数 + 1（曾因此越界崩溃）。</text>
</svg>
