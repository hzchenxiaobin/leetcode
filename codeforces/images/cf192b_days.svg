<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="330" fill="#fafafa"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">192B：答案公式与样例</text>
  <path d="M 272.24 46 Q 380.0 52 487.76 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60.0" y="70.0" width="640.0" height="56.0" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="94.0" text-anchor="start" font-size="12.0" font-weight="bold" fill="#33506e" filter="url(#rough2)">ans = min( a₁, aₙ, min_{i&lt;n} max(aᵢ, aᵢ₊₁) )</text>
  <text x="74.0" y="116.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">（n = 1 时答案是 a₁，因为只需起点本身没塌）</text>
  <rect x="60.0" y="150.0" width="640.0" height="40.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="68.0" y="183.0" text-anchor="start" font-size="10.8" font-weight="bold" fill="#26405c" filter="url(#rough2)">样例</text>
  <text x="148.0" y="183.0" text-anchor="start" font-size="10.8" font-weight="bold" fill="#26405c" filter="url(#rough2)">a</text>
  <text x="348.0" y="183.0" text-anchor="start" font-size="10.8" font-weight="bold" fill="#26405c" filter="url(#rough2)">各项</text>
  <text x="628.0" y="183.0" text-anchor="start" font-size="10.8" font-weight="bold" fill="#26405c" filter="url(#rough2)">答案</text>
  <path d="M 60.0 150.0 L 700.0 150.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="68.0" y="223.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="148.0" y="223.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">10 3 5 10</text>
  <text x="348.0" y="223.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">a₁=10, a₄=10, max 对: 10,5,10</text>
  <text x="628.0" y="223.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <path d="M 60.0 190.0 L 700.0 190.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="68.0" y="263.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="148.0" y="263.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">10 2 8 3 5</text>
  <text x="348.0" y="263.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">a₁=10, a₅=5, max 对: 10,8,8,5</text>
  <text x="628.0" y="263.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <path d="M 60.0 230.0 L 700.0 230.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <rect x="60.0" y="250.0" width="640.0" height="56.0" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="274.0" text-anchor="start" font-size="11.0" fill="#8a6015" filter="url(#rough2)">为什么是 max(aᵢ,aᵢ₊₁)：这一对里只要有一个还活着就能跨过去，所以限制是两者中较大的那个。</text>
</svg>
