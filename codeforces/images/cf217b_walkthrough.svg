<svg xmlns="http://www.w3.org/2000/svg" width="840" height="460" viewBox="0 0 840 460"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="460" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1 走查：n = 6, r = 10，候选 x = 7</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">逆向每一步都做一次整除，跳过长段；共 5 步 = n − 1</text>
  <text x="90" y="100" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="200" y="100" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">(7,10)</text>
  <text x="390" y="100" text-anchor="start" font-size="12" fill="#555555" filter="url(#rough2)">下大：B 段，k = ⌊(10−1)/7⌋ = 1</text>
  <text x="650" y="100" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">(7,3)</text>
  <text x="760" y="100" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">1</text>
  <text x="90" y="146" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="200" y="146" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">(7,3)</text>
  <text x="390" y="146" text-anchor="start" font-size="12" fill="#555555" filter="url(#rough2)">上大：T 段，k = ⌊(7−1)/3⌋ = 2</text>
  <text x="650" y="146" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">(1,3)</text>
  <text x="760" y="146" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">3</text>
  <text x="90" y="192" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="200" y="192" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">(1,3)</text>
  <text x="390" y="192" text-anchor="start" font-size="12" fill="#555555" filter="url(#rough2)">下大：B 段，k = ⌊(3−1)/1⌋ = 2</text>
  <text x="650" y="192" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">(1,1)</text>
  <text x="760" y="192" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">5</text>
  <g filter="url(#rough2)"><line x1="60" y1="110" x2="800" y2="110" stroke="#c8a48a" stroke-width="1.1"/></g>
  <text x="420" y="262" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">逆向段按时间从晚到早：B(1), T(2), B(2)；正向 = T + 反转 = T B B T T B</text>
  <g filter="url(#rough2)"><rect x="200" y="282" width="52" height="44" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="226" y="311" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">T</text>
  <g filter="url(#rough2)"><rect x="256" y="282" width="52" height="44" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="282" y="311" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">B</text>
  <g filter="url(#rough2)"><rect x="312" y="282" width="52" height="44" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="338" y="311" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">B</text>
  <g filter="url(#rough2)"><rect x="368" y="282" width="52" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="394" y="311" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">T</text>
  <g filter="url(#rough2)"><rect x="424" y="282" width="52" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="450" y="311" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">T</text>
  <g filter="url(#rough2)"><rect x="480" y="282" width="52" height="44" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="506" y="311" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">B</text>
  <text x="420" y="356" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">正向模拟：(0,1) → (1,1) → (1,2) → (1,3) → (4,3) → (7,3) → (7,10)，最后写下 10 ✓</text>
  <text x="420" y="384" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">错误数 = (1−1) + (2−1) + (2−1) + [op2 = B ≠ T ? 0 : 1] = 2</text>
  <g filter="url(#rough2)"><rect x="250" y="404" width="340" height="40" rx="4" fill="#faf3ec" fill-opacity="0.85" stroke="#c8a48a" stroke-width="1.3"/></g>
  <text x="420" y="430" text-anchor="middle" font-size="13" font-weight="bold" fill="#3d6b2f" filter="url(#rough2)">输出：2 与 TBBTTB（与官方样例一致）</text>
</svg>
