<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="600" height="340" fill="#fafafa"/>
  <text x="300" y="38" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">含 0 的矩阵：绕开 0 得 0 个零，经过 0 只得 1 个零</text>

  <rect x="55" y="75" width="56" height="56" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="111" y="75" width="56" height="56" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="167" y="75" width="56" height="56" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="55" y="131" width="56" height="56" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="111" y="131" width="56" height="56" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="167" y="131" width="56" height="56" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="55" y="187" width="56" height="56" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="111" y="187" width="56" height="56" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="167" y="187" width="56" height="56" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <path d="M83,103 L139,103 L195,103 L195,159 L195,215" stroke="#4a7a3a" stroke-width="2.6" fill="none"
        stroke-linecap="round" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M83,103 L83,159 L139,159 L195,159 L195,215" stroke="#b85450" stroke-width="2" fill="none"
        stroke-dasharray="6 5" stroke-linecap="round" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="19" text-anchor="middle" fill="#2f4a63"
     stroke="#e8f0fe" stroke-width="3.5" paint-order="stroke">
    <text x="83" y="112">1</text>
    <text x="139" y="112">1</text>
    <text x="195" y="112">1</text>
    <text x="83" y="168">1</text>
    <text x="195" y="168">1</text>
    <text x="83" y="224">1</text>
    <text x="139" y="224">1</text>
    <text x="195" y="224">1</text>
  </g>
  <text x="139" y="168" text-anchor="middle" font-size="21" fill="#7a2f2c"
        stroke="#fce4ec" stroke-width="3.5" paint-order="stroke" filter="url(#rough2)">0</text>

  <text x="255" y="98" font-size="12" fill="#33552a" filter="url(#rough2)">绿线：绕开中心 0</text>
  <text x="255" y="120" font-size="12" fill="#33552a" filter="url(#rough2)">乘积 1·1·1·1·1 = 1 → 0 个零</text>
  <text x="255" y="158" font-size="12" fill="#7a2f2c" filter="url(#rough2)">红线：经过中心 0</text>
  <text x="255" y="180" font-size="12" fill="#7a2f2c" filter="url(#rough2)">乘积 = 0 → 恰 1 个零</text>
  <text x="255" y="220" font-size="13" fill="#333" filter="url(#rough2)">答案取 min(0, 1) = 0</text>

  <rect x="40" y="258" width="520" height="58" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="283" text-anchor="middle" font-size="12" fill="#7a5a12" filter="url(#rough2)">含 0 时总有“乘积 = 0 ⇒ 1 个零”的候选</text>
  <text x="300" y="305" text-anchor="middle" font-size="12" fill="#7a5a12" filter="url(#rough2)">所以 DP 里 0 格代价记 INF，避免被当成 0 个零，最后再与 1 取 min</text>
</svg>
