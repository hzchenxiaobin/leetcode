<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="67"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="340" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">合法子串 = 以 s_begin 开头、且以 s_end 结尾的区间 [i, j]</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">同一个内容可能出现在多个位置，去重必须按「内容」而不是按区间</text>
  <text x="60" y="96" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">t =</text>
  <g filter="url(#rough2)"><rect x="110" y="76" width="52" height="40" rx="4" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="136" y="103" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">a</text>
  <text x="136" y="132" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)"><rect x="172" y="76" width="52" height="40" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="198" y="103" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">b</text>
