  <text x="260" y="103" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">a</text>
  <text x="260" y="132" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="296" y="76" width="52" height="40" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="322" y="103" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">b</text>
  <text x="322" y="132" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="358" y="76" width="52" height="40" rx="4" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="384" y="103" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">a</text>
  <text x="384" y="132" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><rect x="420" y="76" width="52" height="40" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="446" y="103" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">b</text>
  <text x="446" y="132" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">5</text>
  <g filter="url(#rough2)"><rect x="482" y="76" width="52" height="40" rx="4" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="508" y="103" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">a</text>
  <text x="508" y="132" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">6</text>
  <g filter="url(#rough2)"><rect x="544" y="76" width="52" height="40" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="570" y="103" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">b</text>
  <text x="570" y="132" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">7</text>
  <text x="60" y="170" text-anchor="start" font-size="11" fill="#4a7a3a" filter="url(#rough2)">beginAt</text>
  <text x="136" y="170" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="260" y="170" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="384" y="170" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="508" y="170" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="60" y="196" text-anchor="start" font-size="11" fill="#8a2b28" filter="url(#rough2)">endAt</text>
  <text x="198" y="196" text-anchor="middle" font-size="13" fill="#8a2b28" filter="url(#rough2)">✓</text>
  <text x="322" y="196" text-anchor="middle" font-size="13" fill="#8a2b28" filter="url(#rough2)">✓</text>
  <text x="446" y="196" text-anchor="middle" font-size="13" fill="#8a2b28" filter="url(#rough2)">✓</text>
