  <g filter="url(#rough2)"><rect x="110" y="216" width="111" height="26" rx="6" fill="#dcecd2" fill-opacity="0.5" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="4 3"/></g>
  <text x="165" y="234" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">[0,1] = ab</text>
  <g filter="url(#rough2)"><rect x="172" y="250" width="174" height="26" rx="6" fill="#cfe0f5" fill-opacity="0.5" stroke="#446688" stroke-width="1.4" stroke-dasharray="4 3"/></g>
  <text x="259" y="268" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">[0,3] = abab</text>
  <g filter="url(#rough2)"><rect x="234" y="284" width="236" height="26" rx="6" fill="#f6e3c4" fill-opacity="0.5" stroke="#b06a1e" stroke-width="1.4" stroke-dasharray="4 3"/></g>
  <text x="352" y="302" text-anchor="middle" font-size="10.5" fill="#b06a1e" filter="url(#rough2)">[0,5] = ababab</text>
  <g filter="url(#rough2)"><rect x="560" y="76" width="310" height="180" rx="6" fill="#ffffff" fill-opacity="0.4" stroke="#cccccc" stroke-width="1.4" stroke-dasharray="5 4"/></g>
  <text x="715" y="100" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">固定长度 L 时</text>
  <text x="580" y="128" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">起点 i 必须满足 beginAt[i]</text>
  <text x="580" y="152" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">终点 j = i+L−1 必须满足 endAt[j]</text>
  <text x="580" y="176" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">满足的 i 可能有多个（同内容多次出现）</text>
  <text x="580" y="200" text-anchor="start" font-size="10.5" fill="#8a2b28" filter="url(#rough2)">⇒ 需要按内容去重（后缀数组 / 哈希）</text>
  <text x="580" y="228" text-anchor="start" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">样例 3：L=2 时 i=0,2,4,6 全是 ab</text>
  <text x="450" y="328" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">答案 = 所有 L 的「合法 i 集合」按内容合并后的不同前缀串个数</text>
</svg>
