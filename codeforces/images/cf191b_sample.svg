<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="307"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">191B 样例 1：烧掉方块 3（a=5）后预算 3 &lt; a_2=4</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="60.0" y="96.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">n=5, k=2, b=8, a = [2,4,5,3,1]</text>
  <rect x="60.0" y="130.0" width="600.0" height="70.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="74.0" y="153.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">第 1 天申请方块 3：行政方付 5，预算 8-5=3</text>
  <text x="74.0" y="179.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">剩下方块 1,2,4,5；最差仍为 5</text>
  <rect x="60.0" y="216.0" width="600.0" height="70.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="74.0" y="239.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">第 2 天申请方块 2：a_2=4 &gt; 3，行政方付不起</text>
  <text x="74.0" y="265.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">申请被接受 → 方块 2（答案）</text>
  <rect x="60.0" y="302.0" width="600.0" height="56.0" fill="#fde8e8" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="74.0" y="325.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">若 s=1：需要烧到预算 &lt; 2，即花费 ≥ 7；一天最多烧 5 → 不可行</text>
</svg>
