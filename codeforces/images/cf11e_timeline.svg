    <text x="140" y="185" text-anchor="middle" font-size="14" fill="#2f4a66">R</text>
    <text x="140" y="222" text-anchor="middle" font-size="15" font-weight="bold" fill="#9a9a9a">·</text>
    <text x="140" y="102" text-anchor="middle" font-size="10.5" fill="#8a8a8a">1</text>
