<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="127"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="400" fill="#fafafa"/>
  <text x="380" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2：LXXRXR 循环两个周期，12 拍中 6 拍正确 = 50%</text>

  <text x="18" y="139" font-size="12" fill="#2b2b2b" filter="url(#rough2)">Jack</text>
  <text x="18" y="185" font-size="12" fill="#2f4a66" filter="url(#rough2)">口令</text>
  <text x="18" y="222" font-size="12" fill="#2b2b2b" filter="url(#rough2)">判定</text>
  <text x="18" y="102" font-size="10" fill="#8a8a8a" filter="url(#rough2)">拍</text>

