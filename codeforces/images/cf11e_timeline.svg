    <text x="82" y="222" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5223">✓</text>
    <text x="82" y="102" text-anchor="middle" font-size="10.5" fill="#8a8a8a">0</text>
    <rect x="116" y="112" width="48" height="42" fill="#f4f6f9" stroke="#c9ced6" stroke-width="1.3"/>
