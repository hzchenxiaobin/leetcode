  <rect x="58" y="252" width="660" height="120" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <g font-size="12.5" fill="#6d4a10" filter="url(#rough2)">
    <text x="74" y="278">口令按"拍"交替：偶数拍喊 L、奇数拍喊 R；休息（X）也占一拍，只是 Jack 不迈步。</text>
    <text x="74" y="302">所以正确率的分母是总拍数（12），不是步数（6）——按步数算会得到 100%。</text>
    <text x="74" y="326">绿色 = 迈对；红色 = 迈错；灰点 = 这一步休息，不参与判定。</text>
    <text x="74" y="352" font-weight="bold" fill="#8f3b37">插入休息只能调整"拍到拍之间的距离"，也就是改变后面所有步的奇偶。</text>
  </g>
