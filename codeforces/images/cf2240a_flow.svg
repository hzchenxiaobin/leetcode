<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="29"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="440" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按「边际代价」从小到大扫一遍</text>
  <path d="M 205 40 Q 360 47 515 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="360" y="56" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">每一档代价最多买 k 次（k 个数各一次），买不起就停</text>

  <rect x="250" y="66" width="220" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="90" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">读入 t（多测组数）</text>

  <path d="M 360 102 L 360 122" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="220" y="126" width="280" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="151" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">读入 n, k；rem = n, ans = 0, bit = 1</text>

  <path d="M 360 166 L 360 186" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="360,192 512,238 360,284 208,238" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="234" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">bit &lt;= rem ?</text>
  <text x="360" y="254" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">（还买得起这一档吗）</text>

  <path d="M 360 284 L 360 314" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="382" y="304" font-size="11.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">是</text>

  <rect x="196" y="318" width="328" height="88" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="360" y="340" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">take = min(k, rem / bit)</text>
  <text x="360" y="360" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">ans += take</text>
  <text x="360" y="380" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">rem -= take * bit</text>
  <text x="360" y="400" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">bit &lt;&lt;= 1</text>

  <path d="M 196 362 L 30 362 L 30 238 L 200 238" stroke="#446688" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="96" y="352" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">下一档：代价翻倍</text>

  <path d="M 512 238 L 600 238 L 600 320" stroke="#446688" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="556" y="228" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">否</text>

  <rect x="520" y="324" width="176" height="76" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="608" y="350" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">输出 ans</text>
  <text x="608" y="372" text-anchor="middle" font-size="11" fill="#a14340" filter="url(#rough2)">进入下一组数据</text>
  <text x="608" y="390" text-anchor="middle" font-size="10.5" fill="#b87a78" filter="url(#rough2)">remaining 预算留着不用</text>

  <text x="360" y="424" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">bit 逐轮翻倍，最多 20 轮（2^20 &gt; 10^6 ≥ n），每组 O(log n)；t ≤ 1000 时总计不到 2e4 次操作</text>
</svg>
