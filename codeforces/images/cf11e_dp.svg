<svg xmlns="http://www.w3.org/2000/svg" width="700" height="360" viewBox="0 0 700 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="151"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="e1" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="e2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="700" height="360" fill="#fafafa"/>
  <text x="350" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">相位 DP：每步只看"偶数拍 / 奇数拍"两个状态</text>

  <!-- 两个状态 -->
  <g filter="url(#rough2)">
    <circle cx="190" cy="150" r="44" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <text x="190" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66">σ = 0</text>
    <text x="190" y="166" text-anchor="middle" font-size="11" fill="#2f4a66">偶数拍：喊 L</text>
    <circle cx="480" cy="150" r="44" fill="#fdf3e3" stroke="#d6a040" stroke-width="2.2"/>
    <text x="480" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015">σ = 1</text>
    <text x="480" y="166" text-anchor="middle" font-size="11" fill="#8a6015">奇数拍：喊 R</text>
  </g>

  <!-- 自环 -->
  <path d="M158,116 Q190,72 222,116" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#e1)" filter="url(#rough2)"/>
  <text x="190" y="66" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">g 偶：相位不变</text>
  <path d="M448,116 Q480,72 512,116" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#e1)" filter="url(#rough2)"/>
  <text x="480" y="66" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">g 偶：相位不变</text>

  <!-- 互转 -->
  <line x1="238" y1="132" x2="432" y2="132" stroke="#b85450" stroke-width="1.8" marker-end="url(#e2)" filter="url(#rough2)"/>
  <line x1="432" y1="170" x2="238" y2="170" stroke="#b85450" stroke-width="1.8" marker-end="url(#e2)" filter="url(#rough2)"/>
  <text x="335" y="122" text-anchor="middle" font-size="11.5" fill="#8f3b37" filter="url(#rough2)">g 奇：翻转（花费多 1 拍）</text>
  <text x="335" y="190" text-anchor="middle" font-size="11.5" fill="#8f3b37" filter="url(#rough2)">g 奇：翻转</text>

  <!-- 收益卡片 -->
  <rect x="60" y="222" width="580" height="116" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <g font-size="12.5" fill="#6d4a10" filter="url(#rough2)">
    <text x="76" y="248">每步的收益 = [相位与这只脚匹配 ? 1 : 0] − p · g，其中 p 是当前猜测的正确率。</text>
    <text x="76" y="274">DP 沿步序列走一圈、回到起始相位，得到 max(c − p·T)。若该值 &gt; 0，就说明有更好的比值。</text>
    <text x="76" y="300">把 p 更新成新比值重跑，直到不再变好（Dinkelbach 迭代，实测 2–5 轮收敛）。</text>
    <text x="76" y="326" font-weight="bold" fill="#8f3b37">最后用整数分数 100·c/T 向下取整到 6 位小数，避免浮点误差。</text>
  </g>
</svg>
