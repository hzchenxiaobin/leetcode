<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="720" height="380" fill="#fafafa"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">逐区间算：a 车必胜的尾巴有多长</text>
  <path d="M 200 43 Q 360 49 520 43" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 80 130 L 660 130" stroke="#2b2b2b" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="80.0" y="104" width="145.0" height="52" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="152.5" y="122" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">(0, 3]</text>
  <rect x="225.0" y="104" width="145.0" height="52" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="297.5" y="122" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">(3, 6]</text>
  <rect x="370.0" y="104" width="145.0" height="52" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="442.5" y="122" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">(6, 9]</text>
  <rect x="515.0" y="104" width="145.0" height="52" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="587.5" y="122" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">(9, 12]</text>
  <circle cx="80.0" cy="170" r="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="80.0" y="190" text-anchor="middle" font-size="9" fill="#8a6015" filter="url(#rough2)">b车 0</text>
  <circle cx="273.33333333333337" cy="170" r="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="273.33333333333337" y="190" text-anchor="middle" font-size="9" fill="#8a6015" filter="url(#rough2)">b车 7</text>
  <circle cx="466.6666666666667" cy="170" r="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="466.6666666666667" y="190" text-anchor="middle" font-size="9" fill="#8a6015" filter="url(#rough2)">b车 14</text>
  <rect x="80" y="220" width="560" height="66" rx="7" fill="#e9f4e2" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="96" y="246" text-anchor="start" font-size="11" fill="#2f5223" filter="url(#rough2)">第 k 个 a 区间右端 r=(k+1)a，令 m = ⌊r/b⌋·b（不超过 r 的最大 b 倍数）</text>
  <text x="96" y="270" text-anchor="start" font-size="11" fill="#2f5223" filter="url(#rough2)">若 m &lt; r：区间里 (max(m,ka), r] 这段下一班是 a 车 → Dasha += r - max(m, ka)</text>
  <text x="80" y="316" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">若 m = r：右端两车同时到，没有严格「a 先到」的部分（这段进平局）。</text>
  <text x="80" y="342" text-anchor="start" font-size="11" fill="#777777" filter="url(#rough2)">区间个数分别是 b/g 和 a/g，g=gcd(a,b)，总共 ≤ 2×10^6 次。</text>
</svg>
