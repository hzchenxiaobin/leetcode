<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">样例 10 走查：沿链一路剥离，得到 [7, −6, 5, −4, 3, −2, 1]</text>
  <text x="280" y="45" text-anchor="middle" font-size="10.5" fill="#888">顶点 7 上还有一个 1 型自环，它最后才被剥离</text>

  <!-- 剥离序号 -->
  <g font-size="10" text-anchor="middle" fill="#8a6a20" filter="url(#rough2)">
    <text x="55" y="72">①</text>
    <text x="128" y="72">②</text>
    <text x="201" y="72">③</text>
    <text x="274" y="72">④</text>
    <text x="347" y="72">⑤</text>
    <text x="420" y="72">⑥</text>
    <text x="493" y="72">⑦</text>
  </g>

  <!-- 边 + 类型 -->
  <g filter="url(#rough2)">
    <path d="M 73 98 L 110 98" stroke="#446688" stroke-width="1.5"/>
    <path d="M 146 98 L 183 98" stroke="#b85450" stroke-width="1.5"/>
    <path d="M 219 98 L 256 98" stroke="#446688" stroke-width="1.5"/>
    <path d="M 292 98 L 329 98" stroke="#b85450" stroke-width="1.5"/>
    <path d="M 365 98 L 402 98" stroke="#446688" stroke-width="1.5"/>
    <path d="M 438 98 L 475 98" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <g font-size="9.5" text-anchor="middle" filter="url(#rough2)">
    <text x="91" y="92" fill="#446688">1</text>
    <text x="164" y="92" fill="#b85450">2</text>
    <text x="237" y="92" fill="#446688">1</text>
    <text x="310" y="92" fill="#b85450">2</text>
    <text x="383" y="92" fill="#446688">1</text>
    <text x="456" y="92" fill="#b85450">2</text>
  </g>

  <!-- 结点 -->
  <g filter="url(#rough2)">
    <rect x="37" y="84" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <rect x="110" y="84" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <rect x="183" y="84" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <rect x="256" y="84" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <rect x="329" y="84" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <rect x="402" y="84" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <rect x="475" y="84" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
  </g>
  <g font-size="11" text-anchor="middle" fill="#3a4a66" filter="url(#rough2)">
    <text x="55" y="103">1</text>
    <text x="128" y="103">2</text>
    <text x="201" y="103">3</text>
    <text x="274" y="103">4</text>
    <text x="347" y="103">5</text>
    <text x="420" y="103">6</text>
    <text x="493" y="103">7</text>
  </g>

  <!-- 7 的自环 -->
  <ellipse cx="493" cy="78" rx="13" ry="7" fill="none" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="520" y="76" font-size="9" fill="#8a6a20" filter="url(#rough2)">自环 1</text>

  <!-- 符号 -->
  <text x="20" y="145" font-size="10" fill="#555" filter="url(#rough2)">符号</text>
  <g font-size="12" text-anchor="middle" filter="url(#rough2)">
    <text x="55" y="145" fill="#4a7a3a">+</text>
    <text x="128" y="145" fill="#b85450">−</text>
    <text x="201" y="145" fill="#4a7a3a">+</text>
    <text x="274" y="145" fill="#b85450">−</text>
    <text x="347" y="145" fill="#4a7a3a">+</text>
    <text x="420" y="145" fill="#b85450">−</text>
    <text x="493" y="145" fill="#4a7a3a">+</text>
  </g>
  <text x="20" y="168" font-size="10" fill="#555" filter="url(#rough2)">模长</text>
  <g font-size="10.5" text-anchor="middle" fill="#444" filter="url(#rough2)">
    <text x="55" y="168">7</text>
    <text x="128" y="168">6</text>
    <text x="201" y="168">5</text>
    <text x="274" y="168">4</text>
    <text x="347" y="168">3</text>
    <text x="420" y="168">2</text>
    <text x="493" y="168">1</text>
  </g>

  <rect x="90" y="188" width="380" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="209" text-anchor="middle" font-size="11" fill="#3a5a30">a = [ 7, −6, 5, −4, 3, −2, 1 ]</text>

  <rect x="26" y="234" width="508" height="64" fill="#fffdf5" stroke="#d6a040" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="42" y="254" font-size="10" fill="#8a6a20">抽查：边 (2,3) 是 2 型，2 先剥离且为负 → −6+5 = −1 &lt; 0 ✔</text>
  <text x="42" y="272" font-size="10" fill="#8a6a20">抽查：边 (3,4) 是 1 型，3 先剥离且非负 → 5−4 = 1 ≥ 0 ✔</text>
  <text x="42" y="290" font-size="10" fill="#8a6a20">关键：每条边在「模长更大」的那端被剥离，符号已由该边类型钉死</text>
</svg>
