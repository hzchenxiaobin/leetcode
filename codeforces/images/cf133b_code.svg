<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="340" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">8 条 Brainfuck 指令各换成 4 位码，再按顺序拼接</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">拼接 = 左移 4 位（乘 16）再加新码</text>
  <g filter="url(#rough2)"><rect x="90" y="96" width="78" height="40" rx="4" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="129" y="123" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">&gt;</text>
  <g filter="url(#rough2)"><rect x="174" y="96" width="92" height="40" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#b06a1e" stroke-width="1.4"/></g>
  <text x="220" y="123" text-anchor="middle" font-size="14" fill="#b06a1e" filter="url(#rough2)">1000</text>
  <g filter="url(#rough2)"><rect x="280" y="96" width="78" height="40" rx="4" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="319" y="123" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">&lt;</text>
  <g filter="url(#rough2)"><rect x="364" y="96" width="92" height="40" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#b06a1e" stroke-width="1.4"/></g>
  <text x="410" y="123" text-anchor="middle" font-size="14" fill="#b06a1e" filter="url(#rough2)">1001</text>
  <g filter="url(#rough2)"><rect x="470" y="96" width="78" height="40" rx="4" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="509" y="123" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">+</text>
  <g filter="url(#rough2)"><rect x="554" y="96" width="92" height="40" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#b06a1e" stroke-width="1.4"/></g>
  <text x="600" y="123" text-anchor="middle" font-size="14" fill="#b06a1e" filter="url(#rough2)">1010</text>
  <g filter="url(#rough2)"><rect x="660" y="96" width="78" height="40" rx="4" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="699" y="123" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">-</text>
  <g filter="url(#rough2)"><rect x="744" y="96" width="92" height="40" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#b06a1e" stroke-width="1.4"/></g>
  <text x="790" y="123" text-anchor="middle" font-size="14" fill="#b06a1e" filter="url(#rough2)">1011</text>
  <g filter="url(#rough2)"><rect x="90" y="172" width="78" height="40" rx="4" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="129" y="199" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">.</text>
  <g filter="url(#rough2)"><rect x="174" y="172" width="92" height="40" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#b06a1e" stroke-width="1.4"/></g>
  <text x="220" y="199" text-anchor="middle" font-size="14" fill="#b06a1e" filter="url(#rough2)">1100</text>
  <g filter="url(#rough2)"><rect x="280" y="172" width="78" height="40" rx="4" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="319" y="199" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">,</text>
  <g filter="url(#rough2)"><rect x="364" y="172" width="92" height="40" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#b06a1e" stroke-width="1.4"/></g>
  <text x="410" y="199" text-anchor="middle" font-size="14" fill="#b06a1e" filter="url(#rough2)">1101</text>
  <g filter="url(#rough2)"><rect x="470" y="172" width="78" height="40" rx="4" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="509" y="199" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">[</text>
  <g filter="url(#rough2)"><rect x="554" y="172" width="92" height="40" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#b06a1e" stroke-width="1.4"/></g>
  <text x="600" y="199" text-anchor="middle" font-size="14" fill="#b06a1e" filter="url(#rough2)">1110</text>
  <g filter="url(#rough2)"><rect x="660" y="172" width="78" height="40" rx="4" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="699" y="199" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">]</text>
  <g filter="url(#rough2)"><rect x="744" y="172" width="92" height="40" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#b06a1e" stroke-width="1.4"/></g>
  <text x="790" y="199" text-anchor="middle" font-size="14" fill="#b06a1e" filter="url(#rough2)">1111</text>
  <text x="450" y="262" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">拼接第 k 个码：v ← 16·v + code（对 1000003 取模）</text>
  <text x="450" y="292" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">v 始终小于模数，最多 400 位也不会溢出</text>
</svg>
