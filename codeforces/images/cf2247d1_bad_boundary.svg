<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 348"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="660" height="348" fill="#fafafa" filter="url(#rough2)"/>

  <text x="330" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    「坏边界」判据：前缀最大值 &gt; 后缀最小值 ⇔ 有逆序对跨过这条边界
  </text>

  <rect x="36" y="88" width="54" height="46" rx="4" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="98" y="88" width="54" height="46" rx="4" fill="#fce4ec" stroke="#b85450"
        stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="160" y="88" width="54" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="222" y="88" width="54" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="284" y="88" width="54" height="46" rx="4" fill="#fce4ec" stroke="#b85450"
        stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="346" y="88" width="54" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" filter="url(#rough2)"/>

  <text x="63" y="118" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <text x="125" y="118" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">5</text>
  <text x="187" y="118" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <text x="249" y="118" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">4</text>
  <text x="311" y="118" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="373" y="118" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">6</text>

  <text x="63" y="150" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <text x="125" y="150" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>
  <text x="187" y="150" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>
  <text x="249" y="150" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3</text>
  <text x="311" y="150" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">4</text>
  <text x="373" y="150" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">5</text>

  <path d="M156,84 L156,162" fill="none" stroke="#b85450" stroke-width="1.8"
        stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="156" y="78" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">边界 M = 2</text>

  <path d="M125,138 C140,176 240,182 305,142" fill="none" stroke="#b85450"
        stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="218" y="190" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">
    逆序对 (i=1, j=4)：a₁ = 5 &gt; a₄ = 1，跨过 M = 2
  </text>

  <rect x="410" y="56" width="234" height="188" rx="10" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.8" filter="url(#rough2)"/>
  <text x="527" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    M 坏（bad）
  </text>
  <text x="427" y="106" font-size="12" fill="#333" filter="url(#rough2)">⇔ premax(M) &gt; sufmin(M)</text>
  <text x="427" y="130" font-size="12" fill="#333" filter="url(#rough2)">⇔ 前缀不是全体中最小的 M 个</text>
  <text x="427" y="154" font-size="12" fill="#446688" filter="url(#rough2)">T = max v₂(M)，M 取遍坏边界</text>
  <text x="427" y="178" font-size="12" fill="#446688" filter="url(#rough2)">T = −1（无坏边界）⇒ 已有序</text>
  <text x="427" y="212" font-size="14" fill="#b85450" filter="url(#rough2)">答案 f(a) = 2^T</text>
  <text x="427" y="232" font-size="11" fill="#888" filter="url(#rough2)">v₂(M) = M 中因子 2 的指数</text>

  <text x="36" y="234" font-size="12" fill="#333" filter="url(#rough2)">前缀 a[0..2) = 2,5，最大值 5</text>
  <text x="36" y="256" font-size="12" fill="#333" filter="url(#rough2)">后缀 a[2..6) = 3,4,1,6，最小值 1</text>
  <text x="36" y="278" font-size="12" fill="#b85450" filter="url(#rough2)">5 &gt; 1 ⇒ M = 2 坏</text>

  <path d="M36,300 L624,300" fill="none" stroke="#cfcfcf" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="36" y="322" font-size="12" fill="#333" filter="url(#rough2)">
    块大小 2^t 时可排序 ⇔ 所有 2^t 的倍数 M 都「好」⇔ 没有坏边界被 2^t 整除
  </text>
  <text x="36" y="342" font-size="12" fill="#4a7a3a" filter="url(#rough2)">
    ⇒ 最小的可行 t 就是 (最大 v₂ + 1)，答案 = 2^t / 2 = 2^T
  </text>
</svg>
