<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="151"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="800" height="430" fill="#fafafa"/>

  <text x="400" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">环上只有两种“强连通”的样子：全顺时针或全逆时针</text>
  <path d="M 120 40 Q 400 46 680 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <circle cx="400" cy="96" r="26" fill="#cfe0f5" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="400" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">1</text>
  <circle cx="625" cy="330" r="26" fill="#d9ecd4" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="625" y="336" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">2</text>
  <circle cx="175" cy="330" r="26" fill="#fbe3c8" stroke="#c98a2b" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="175" y="336" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">3</text>

  <path d="M 418 116 L 607 306" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="520" y="196" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">1→2（同向）c=1</text>
  <path d="M 382 116 L 193 306" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="196" y="196" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">1→3（逆向）c=1</text>
  <path d="M 201 330 L 599 330" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="400" y="318" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">3→2（逆向）c=1</text>

  <text x="40" y="386" font-size="12" fill="#2b2b2b" filter="url(#rough2)">沿 1→2→3→1 行进：同向边费用和 along = 1；逆向边费用和 against = 1 + 1 = 2。</text>
  <text x="40" y="410" font-size="12" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">答案 = min(along, against) = min(1, 2) = 1（样例 1）</text>
</svg>
