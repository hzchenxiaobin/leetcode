<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420">
<defs>
  <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs>
<rect x="0" y="0" width="760" height="420" fill="#fafafa"/>
<text x="380.0" y="34" font-size="22" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="bold" text-anchor="middle" filter="url(#rough2)">平均数的两种落点</text>
<rect x="40" y="105" width="120" height="54" rx="8" fill="#fff4d6" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="100.0" y="137.95" font-size="17" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">s[i] = 2</text>
<rect x="210" y="105" width="120" height="54" rx="8" fill="#e8f0fe" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
