<line x1="140" y1="160" x2="150" y2="198" stroke="#666666" stroke-width="2" filter="url(#rough2)"/>
<polygon points="150.0,198.0 152.0,186.1 142.4,188.6" fill="#666666" filter="url(#rough2)"/>
<text x="215" y="232" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)"></text>
