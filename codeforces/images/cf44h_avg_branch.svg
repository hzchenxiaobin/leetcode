<line x1="230" y1="258" x2="265" y2="320" stroke="#1a5fb4" stroke-width="2" filter="url(#rough2)"/>
<polygon points="265.0,320.0 263.9,308.0 255.2,312.9" fill="#1a5fb4" filter="url(#rough2)"/>
<rect x="45" y="325" width="120" height="50" rx="8" fill="#f0e6fa" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="105.0" y="355.25" font-size="15" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">5  向下取整</text>
<rect x="225" y="325" width="120" height="50" rx="8" fill="#f0e6fa" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
