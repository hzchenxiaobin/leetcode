<text x="360" y="250" font-size="16" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#c0392b" font-weight="normal" text-anchor="start" filter="url(#rough2)">和是奇数：</text>
<text x="360" y="276" font-size="16" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#c0392b" font-weight="normal" text-anchor="start" filter="url(#rough2)">可以落 5 或 6</text>
<line x1="380" y1="70" x2="380" y2="380" stroke="#cccccc" stroke-width="2" stroke-dasharray="8 6" filter="url(#rough2)"/>
<rect x="420" y="105" width="120" height="54" rx="8" fill="#fff4d6" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="480.0" y="137.95" font-size="17" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">s[i] = 5</text>
<rect x="590" y="105" width="120" height="54" rx="8" fill="#e8f0fe" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="650.0" y="137.95" font-size="17" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">prev = 3</text>
<line x1="542" y1="132" x2="588" y2="132" stroke="#666666" stroke-width="2" filter="url(#rough2)"/>
<polygon points="588.0,132.0 577.0,127.0 577.0,137.0" fill="#666666" filter="url(#rough2)"/>
<rect x="450" y="200" width="240" height="56" rx="8" fill="#e6f4ea" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="570.0" y="234.3" font-size="18" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">(5 + 3) / 2 = 4</text>
<line x1="520" y1="160" x2="530" y2="198" stroke="#666666" stroke-width="2" filter="url(#rough2)"/>
<polygon points="530.0,198.0 532.0,186.1 522.4,188.6" fill="#666666" filter="url(#rough2)"/>
<line x1="570" y1="258" x2="570" y2="320" stroke="#1a5fb4" stroke-width="2" filter="url(#rough2)"/>
<polygon points="570.0,320.0 575.0,309.0 565.0,309.0" fill="#1a5fb4" filter="url(#rough2)"/>
<rect x="505" y="325" width="135" height="50" rx="8" fill="#f0e6fa" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="572.5" y="355.6" font-size="16" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">4  唯一</text>
<text x="420" y="388" font-size="16" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#2e7d32" font-weight="normal" text-anchor="start" filter="url(#rough2)">和是偶数：只有一种取整</text>
</svg>
