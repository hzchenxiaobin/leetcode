<svg xmlns="http://www.w3.org/2000/svg" width="700" height="424" viewBox="0 0 700 424"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="700" height="424" fill="#fafafa"/>

  <text x="350" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：样例 1 的 x 枚举表</text>
  <text x="350" y="56" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">a = [1, 2, 3, 6, 10]，ℓ = 11，Σa = 22，x ≤ ⌊√10⌋ = 3</text>

  <!-- 表头 -->
  <rect x="60" y="72" width="580" height="36" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="105" y="95" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">x</text>
  <text x="215" y="95" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">S(x)</text>
  <text x="360" y="95" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">y = min(10, ⌊10/x⌋)</text>
  <text x="495" y="95" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">f = S+x+y</text>
  <text x="595" y="95" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">Σa - f</text>

  <!-- 行 x=0 -->
  <rect x="60" y="108" width="580" height="36" fill="#fafafa" stroke="#cccccc" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="105" y="131" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="215" y="131" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">0+0+0 = 0</text>
  <text x="360" y="131" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">10</text>
  <text x="495" y="131" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">10</text>
  <text x="595" y="131" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">12</text>

  <!-- 行 x=1（最优） -->
  <rect x="60" y="144" width="580" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="105" y="167" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">1</text>
  <text x="215" y="167" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">1+1+1 = 3</text>
  <text x="360" y="167" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">10</text>
  <text x="495" y="167" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">14</text>
  <text x="595" y="167" text-anchor="middle" font-size="13" font-weight="bold" fill="#a33b36" filter="url(#rough2)">8 ← 最优</text>

  <!-- 行 x=2 -->
  <rect x="60" y="180" width="580" height="36" fill="#fafafa" stroke="#cccccc" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="105" y="203" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="215" y="203" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">1+2+2 = 5</text>
  <text x="360" y="203" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <text x="495" y="203" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">12</text>
  <text x="595" y="203" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">10</text>

  <!-- 行 x=3 -->
  <rect x="60" y="216" width="580" height="36" fill="#fafafa" stroke="#cccccc" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="105" y="239" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="215" y="239" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">1+2+3 = 6</text>
  <text x="360" y="239" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="495" y="239" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">12</text>
  <text x="595" y="239" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">10</text>

  <!-- 列分隔 -->
  <path d="M 150 72 L 150 252" stroke="#d6a040" stroke-width="1.1" filter="url(#rough2)"/>
  <path d="M 280 72 L 280 252" stroke="#d6a040" stroke-width="1.1" filter="url(#rough2)"/>
  <path d="M 440 72 L 440 252" stroke="#d6a040" stroke-width="1.1" filter="url(#rough2)"/>
  <path d="M 550 72 L 550 252" stroke="#d6a040" stroke-width="1.1" filter="url(#rough2)"/>

  <!-- 最优行标记 -->
  <path d="M 44 162 L 56 162" stroke="#b85450" stroke-width="2" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <!-- 结论框 -->
  <rect x="60" y="272" width="580" height="62" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="296" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">x = 1 ⇒ b = [1, 1, 1, 1, 10]，代价 0+1+2+5+0 = 8</text>
  <text x="350" y="320" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">校验：最大两数乘积 1·10 = 10 &lt; 11 ✓</text>

  <!-- 候选集对照 -->
  <rect x="60" y="346" width="580" height="62" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="370" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">O(n) 版：情形 A 给 x = min(6, ⌊10/10⌋) = 1；情形 B 给 lo = 2、hi = 3</text>
  <text x="350" y="394" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">候选 {1, 2, 3} 与枚举表完全一致，最优仍为 x = 1</text>
</svg>
