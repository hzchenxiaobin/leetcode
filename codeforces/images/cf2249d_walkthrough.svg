<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">构造走查：n = 4, x = 1</text>

  <text x="44" y="58" font-size="11" fill="#555555" filter="url(#rough2)">① 配对 {v, v⊕x}，n/4 = 1 ⇒ 交换 1 对</text>
  <rect x="80" y="70" width="150" height="40" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="155" y="96" text-anchor="middle" font-size="13" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">{0, 1} 交换</text>
  <rect x="250" y="70" width="150" height="40" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="325" y="96" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">{2, 3} 不动</text>
  <text x="418" y="96" font-size="10" fill="#888888" filter="url(#rough2)">4 | n 才能凑出整数对</text>

  <path d="M 310 116 L 310 136" stroke="#3a3a3a" stroke-width="1.5" fill="none"
        marker-end="url(#ar2)" filter="url(#rough2)"/>

  <text x="44" y="158" font-size="11" fill="#555555" filter="url(#rough2)">② 偶下标放不动值、奇下标放交换值 ⇒ P = (2, 0, 3, 1)</text>

  <rect x="150" y="172" width="54" height="36" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="177" y="164" text-anchor="middle" font-size="9" fill="#888888" filter="url(#rough2)">i=0</text>
  <text x="177" y="196" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="177" y="222" text-anchor="middle" font-size="8.5" fill="#888888" filter="url(#rough2)">不动值</text>
  <rect x="208" y="172" width="54" height="36" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="235" y="164" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">i=1</text>
  <text x="235" y="196" text-anchor="middle" font-size="14" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="235" y="222" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">交换值</text>
  <rect x="266" y="172" width="54" height="36" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="293" y="164" text-anchor="middle" font-size="9" fill="#888888" filter="url(#rough2)">i=2</text>
  <text x="293" y="196" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="293" y="222" text-anchor="middle" font-size="8.5" fill="#888888" filter="url(#rough2)">不动值</text>
  <rect x="324" y="172" width="54" height="36" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="351" y="164" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">i=3</text>
  <text x="351" y="196" text-anchor="middle" font-size="14" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="351" y="222" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">交换值</text>

  <path d="M 264 240 L 264 258" stroke="#3a3a3a" stroke-width="1.5" fill="none"
        marker-end="url(#ar2)" filter="url(#rough2)"/>

  <text x="44" y="276" font-size="11" fill="#555555" filter="url(#rough2)">③ A[i][j] = P_i ⊕ P_j ⊕ 1（仅当 i、j 都为奇数时多异或一个 1）</text>

  <text x="226" y="296" text-anchor="middle" font-size="9.5" fill="#888888" filter="url(#rough2)">j=0</text>
  <text x="280" y="296" text-anchor="middle" font-size="9.5" fill="#888888" filter="url(#rough2)">j=1</text>
  <text x="334" y="296" text-anchor="middle" font-size="9.5" fill="#888888" filter="url(#rough2)">j=2</text>
  <text x="388" y="296" text-anchor="middle" font-size="9.5" fill="#888888" filter="url(#rough2)">j=3</text>

  <rect x="200" y="302" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="226" y="322" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">0</text>
  <rect x="254" y="302" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="308" y="302" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="334" y="322" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="362" y="302" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="388" y="322" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">3</text>

  <rect x="200" y="334" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="226" y="354" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="254" y="334" width="52" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="280" y="354" text-anchor="middle" font-size="13" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="308" y="334" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="334" y="354" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">3</text>
  <rect x="362" y="334" width="52" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="388" y="354" text-anchor="middle" font-size="13" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">0</text>

  <rect x="200" y="366" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="226" y="386" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="254" y="366" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="280" y="386" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">3</text>
  <rect x="308" y="366" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="334" y="386" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">0</text>
  <rect x="362" y="366" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="388" y="386" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">2</text>

  <rect x="200" y="398" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="226" y="418" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">3</text>
  <rect x="254" y="398" width="52" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="280" y="418" text-anchor="middle" font-size="13" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="308" y="398" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="334" y="418" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="362" y="398" width="52" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="388" y="418" text-anchor="middle" font-size="13" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="430" y="330" font-size="10" fill="#8a3a36" filter="url(#rough2)">红色 4 格 =</text>
  <text x="430" y="346" font-size="10" fill="#8a3a36" filter="url(#rough2)">奇数行 × 奇数列</text>
  <text x="430" y="370" font-size="10" fill="#555555" filter="url(#rough2)">每行、每列</text>
  <text x="430" y="386" font-size="10" fill="#555555" filter="url(#rough2)">都是 0..3 的排列</text>
  <text x="430" y="410" font-size="10" fill="#4a7a3a" filter="url(#rough2)">9 个 2×2 块异或全为 1</text>
</svg>
