<svg xmlns="http://www.w3.org/2000/svg" width="840" height="480" viewBox="0 0 840 480"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="840" height="480" fill="#fafafa"/>

  <text x="420" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">核心结构：两堆各自降序，各取前缀</text>
  <path d="M 250 44 Q 420 50 590 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 左侧：两堆柱状图 -->
  <rect x="18" y="60" width="478" height="400" rx="10" fill="#ffffff" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="38" y="86" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">type 1 · 每个占 1 m³ · 容量降序</text>

  <!-- type 1 柱：容量 9 7 5 3 1，高 = 12*容量，基线 y=206 -->
  <rect x="40" y="120" width="40" height="90" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="96" y="140" width="40" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="152" y="160" width="40" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="208" y="180" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="264" y="200" width="40" height="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="113" text-anchor="middle" font-size="13" fill="#23405c" filter="url(#rough2)">9</text>
  <text x="116" y="133" text-anchor="middle" font-size="13" fill="#23405c" filter="url(#rough2)">7</text>
  <text x="172" y="153" text-anchor="middle" font-size="13" fill="#23405c" filter="url(#rough2)">5</text>
  <text x="228" y="173" text-anchor="middle" font-size="13" fill="#23405c" filter="url(#rough2)">3</text>
  <text x="284" y="193" text-anchor="middle" font-size="13" fill="#23405c" filter="url(#rough2)">1</text>
  <line x1="34" y1="210" x2="310" y2="210" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- t = 3 的前缀：下括号 -->
  <path d="M 34 218 L 34 230 L 198 230 L 198 218" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="116" y="250" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">前 t 个单格（t = 3）</text>
  <text x="38" y="274" font-size="12" fill="#555" filter="url(#rough2)">P1(t) = 9 + 7 + 5 = 21</text>

  <!-- type 2 柱：容量 7 5 3，宽 76，基线 y=404 -->
  <text x="38" y="300" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">type 2 · 每个占 2 m³ · 容量降序</text>
  <rect x="40" y="334" width="76" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="132" y="354" width="76" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="224" y="374" width="76" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="78" y="327" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">7</text>
  <text x="170" y="347" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">5</text>
  <text x="262" y="367" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">3</text>
  <line x1="34" y1="404" x2="310" y2="404" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- k = 2 的前缀：下括号 -->
  <path d="M 34 412 L 34 424 L 306 424 L 306 412" stroke="#8a6015" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="170" y="446" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">前 k 个双格（k = 2，占 4 m³）</text>

  <!-- 右侧：公式与结论 -->
  <rect x="510" y="60" width="312" height="400" rx="10" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="528" y="90" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">对每个 k 枚举</text>
  <text x="528" y="122" font-size="13" fill="#333" filter="url(#rough2)">k = 取的双格个数</text>
  <text x="528" y="152" font-size="13" fill="#333" filter="url(#rough2)">t = min(c1, v − 2k)</text>
  <text x="528" y="182" font-size="13" fill="#333" filter="url(#rough2)">f(k) = P2(k) + P1(t)</text>
  <text x="528" y="212" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">答案 = max f(k)</text>
  <path d="M 528 232 L 804 232" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="6 5" fill="none" filter="url(#rough2)"/>
  <text x="528" y="260" font-size="12.5" fill="#555" filter="url(#rough2)">相邻两项之差：</text>
  <text x="528" y="286" font-size="12" fill="#333" filter="url(#rough2)">Δ = p2[k+1] − p1[t] − p1[t−1]</text>
  <text x="528" y="314" font-size="12.5" fill="#555" filter="url(#rough2)">Δ 符号由数值决定，</text>
  <text x="528" y="338" font-size="12.5" fill="#555" filter="url(#rough2)">f(k) 不单调。</text>
  <text x="528" y="372" font-size="12.5" fill="#b85450" filter="url(#rough2)">⇒ 必须枚举全部 k</text>
  <text x="528" y="406" font-size="11.5" fill="#777" filter="url(#rough2)">不能只取满双格，</text>
  <text x="528" y="426" font-size="11.5" fill="#777" filter="url(#rough2)">也不能按单位体积贪心。</text>
</svg>
