<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="19"/>
    <feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></defs>
  <rect width="720" height="300" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">一次扫描同时记录 min l 与 max r</text>
  <rect x="40" y="60" width="190" height="56" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="135" y="84" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">读入 n 条线段</text>
  <text x="135" y="104" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">记录 minL 与 maxR</text>
  <rect x="265" y="60" width="190" height="56" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="84" text-anchor="middle" font-size="12" fill="#7a5a1b" filter="url(#rough2)">再扫一遍</text>
  <text x="360" y="104" text-anchor="middle" font-size="11" fill="#7a5a1b" filter="url(#rough2)">找 l = minL 且 r = maxR</text>
  <rect x="490" y="60" width="190" height="56" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="585" y="84" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">输出编号（1-based）</text>
  <text x="585" y="104" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">找不到则输出 −1</text>
  <path d="M 232 88 L 262 88" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 457 88 L 487 88" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="40" y="150" width="640" height="60" rx="9" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="54" y="174" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">样例 2：minL = 1，maxR = 10，只有第 3 条线段 [1,10] 同时满足 → 输出 3。</text>
  <text x="54" y="196" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">样例 1：minL = 1（第 1 条），maxR = 3（第 3 条），没有线段同时取到两者 → 输出 −1。</text>
  <text x="60" y="246" font-size="12" fill="#666" filter="url(#rough2)">复杂度 O(n)：只需要两次线性扫描，不需要排序。</text>
  <text x="60" y="270" font-size="12" fill="#666" filter="url(#rough2)">线段互不相同，所以同时取到 (minL, maxR) 的至多一条；找不到就输出 −1。</text>
</svg>
