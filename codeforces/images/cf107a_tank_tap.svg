<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 332" width="640" height="332">
<defs>
<filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="13" result="noise"/>
<feDisplacementMap in="SourceGraphic" in2="noise" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect x="0" y="0" width="640" height="332" fill="#fafafa"/>
<g font-family="Comic Sans MS, Kaiti SC, cursive">
<text x="320.0" y="24.0" font-size="15" fill="#33475b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">按"有没有入管 / 出管"分类</text>
<rect x="60.0" y="60.0" width="240.0" height="86.0" rx="10" fill="#f6d9b0" stroke="#a08050" stroke-width="1.8" filter="url(#rough2)"/>
<text x="180.0" y="96.0" font-size="13" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">有出、无入</text>
<text x="180.0" y="118.0" font-size="13" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">→ 水塔</text>
<rect x="340.0" y="60.0" width="240.0" height="86.0" rx="10" fill="#cfe3d4" stroke="#4f7f60" stroke-width="1.8" filter="url(#rough2)"/>
<text x="460.0" y="96.0" font-size="13" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">有入、有出</text>
<text x="460.0" y="118.0" font-size="13" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">→ 链中间</text>
<rect x="60.0" y="170.0" width="240.0" height="86.0" rx="10" fill="#bfd9e8" stroke="#4a6f8a" stroke-width="1.8" filter="url(#rough2)"/>
<text x="180.0" y="206.0" font-size="13" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">无出、有入</text>
<text x="180.0" y="228.0" font-size="13" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">→ 龙头</text>
<rect x="340.0" y="170.0" width="240.0" height="86.0" rx="10" fill="#eeeeee" stroke="#888" stroke-width="1.8" filter="url(#rough2)"/>
<text x="460.0" y="206.0" font-size="13" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">无入、无出</text>
<text x="460.0" y="228.0" font-size="13" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">→ 孤立点</text>
<text x="320.0" y="316.0" font-size="13" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">四类互斥且覆盖全部点；只有「水塔」需要输出，配对它后面的「龙头」</text>
</g>
</svg>
