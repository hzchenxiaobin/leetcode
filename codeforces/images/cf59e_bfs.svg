<svg xmlns="http://www.w3.org/2000/svg" width="760" height="396" viewBox="0 0 760 396"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c9801f"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a8524a"/>
    </marker>
  </defs>
  <rect width="760" height="396" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">在有向边上做 BFS</text>
  <text x="380.0" y="60.0" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">状态 = 有向边 (u, v)；转移 (u, v) → (v, w) 要求 (u, v, w) 不是禁咒</text>
  <text x="50.0" y="118.0" text-anchor="start" font-size="12" fill="#c9801f" font-weight="bold" filter="url(#rough2)">d = 1</text>
  <rect x="160.0" y="92.0" width="120.0" height="40.0" rx="8" fill="#f7f9fc" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="220.0" y="118.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">1→2</text>
  <rect x="330.0" y="92.0" width="120.0" height="40.0" rx="8" fill="#f7f9fc" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="390.0" y="118.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">1→3</text>
  <text x="50.0" y="202.0" text-anchor="start" font-size="12" fill="#c9801f" font-weight="bold" filter="url(#rough2)">d = 2</text>
  <rect x="160.0" y="176.0" width="120.0" height="40.0" rx="8" fill="#f7f9fc" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="220.0" y="202.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">2→3</text>
  <rect x="330.0" y="176.0" width="120.0" height="40.0" rx="8" fill="#f7f9fc" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="390.0" y="202.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">3→5</text>
  <text x="50.0" y="286.0" text-anchor="start" font-size="12" fill="#c9801f" font-weight="bold" filter="url(#rough2)">d = 3</text>
  <rect x="160.0" y="260.0" width="120.0" height="40.0" rx="8" fill="#fbeeee" stroke="#a8524a" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="220.0" y="286.0" text-anchor="middle" font-size="12.5" fill="#a8524a" font-weight="bold" filter="url(#rough2)">3→4</text>
  <text x="220.0" y="318.0" text-anchor="middle" font-size="10.5" fill="#a8524a" font-weight="bold" filter="url(#rough2)">被禁咒挡下，不入队</text>
  <rect x="330.0" y="260.0" width="120.0" height="40.0" rx="8" fill="#f4f9f2" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="390.0" y="286.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">5→7</text>
  <text x="390.0" y="318.0" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">终点 n = 7，d = 3</text>
  <path d="M 220.0 134.0 L 220.0 172.0" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 390.0 134.0 L 390.0 172.0" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280.0 218.0 L 220.0 256.0" stroke="#a8524a" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 440.0 218.0 L 390.0 256.0" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="510.0" y="96.0" width="226.0" height="118.0" rx="8" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.4" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="522.0" y="122.0" text-anchor="start" font-size="11.5" fill="#a8524a" font-weight="bold" filter="url(#rough2)">禁咒 (2, 3, 4)</text>
  <text x="522.0" y="146.0" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">状态 2→3 不能转到 4，</text>
  <text x="522.0" y="168.0" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">所以状态 3→4 根本不会入队；</text>
  <text x="522.0" y="190.0" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">想去 4 只能换一条来路。</text>
  <rect x="40.0" y="344.0" width="680.0" height="40.0" rx="8" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="56.0" y="369.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">第一次弹出终点为 n 的状态时，层数就是最短路长度（绿色状态 d = 3）。</text>
</svg>
