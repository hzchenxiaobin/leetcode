<svg xmlns="http://www.w3.org/2000/svg" width="760" height="392" viewBox="0 0 760 392"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c9801f"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a8524a"/>
    </marker>
  </defs>
  <rect width="760" height="392" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">在有向边上做 BFS</text>
  <text x="380.0" y="60.0" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">状态 = 有向边 (u, v)，转移 (u, v) → (v, w) 需 (u, v, w) 不是禁咒</text>
  <text x="60.0" y="122.0" text-anchor="start" font-size="12" fill="#c9801f" font-weight="bold" filter="url(#rough2)">d = 1</text>
  <rect x="170.0" y="96.0" width="120.0" height="40.0" rx="8" fill="#fdf3e3" stroke="#c9801f" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="230.0" y="122.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">1→2</text>
  <rect x="320.0" y="96.0" width="120.0" height="40.0" rx="8" fill="#fdf3e3" stroke="#c9801f" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="380.0" y="122.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">1→3</text>
  <text x="60.0" y="202.0" text-anchor="start" font-size="12" fill="#c9801f" font-weight="bold" filter="url(#rough2)">d = 2</text>
  <rect x="170.0" y="176.0" width="120.0" height="40.0" rx="8" fill="#f7f9fc" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="230.0" y="202.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">2→3</text>
  <rect x="320.0" y="176.0" width="120.0" height="40.0" rx="8" fill="#f7f9fc" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="380.0" y="202.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">2→5</text>
  <rect x="470.0" y="176.0" width="120.0" height="40.0" rx="8" fill="#f7f9fc" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="530.0" y="202.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">3→5</text>
  <text x="60.0" y="282.0" text-anchor="start" font-size="12" fill="#c9801f" font-weight="bold" filter="url(#rough2)">d = 3</text>
  <rect x="170.0" y="256.0" width="120.0" height="40.0" rx="8" fill="#f7f9fc" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="230.0" y="282.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">3→4</text>
  <rect x="320.0" y="256.0" width="120.0" height="40.0" rx="8" fill="#f7f9fc" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="380.0" y="282.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">5→7</text>
  <text x="60.0" y="362.0" text-anchor="start" font-size="12" fill="#c9801f" font-weight="bold" filter="url(#rough2)">d = 4</text>
  <rect x="170.0" y="336.0" width="120.0" height="40.0" rx="8" fill="#f7f9fc" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="230.0" y="362.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">4→7</text>
  <path d="M 230.0 138.0 L 230.0 172.0" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 300.0 138.0 L 320.0 172.0" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 380.0 218.0 L 380.0 252.0" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 430.0 218.0 L 440.0 252.0" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 380.0 298.0 L 380.0 332.0" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="540.0" y="250.0" width="190.0" height="74.0" rx="8" fill="#fbeeee" stroke="#a8524a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="635.0" y="274.0" text-anchor="middle" font-size="11.5" fill="#a8524a" font-weight="bold" filter="url(#rough2)">禁咒 (2, 3, 4)</text>
  <text x="635.0" y="298.0" text-anchor="middle" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">状态 2→3 不能去 4</text>
  <text x="635.0" y="318.0" text-anchor="middle" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">→ 不再生成 3→4</text>
  <rect x="40.0" y="360.0" width="400.0" height="26.0" rx="8" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="54.0" y="379.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">第一次到达 n 的状态，其层数就是最短路长度。</text>
</svg>
