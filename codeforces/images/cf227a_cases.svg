<svg xmlns="http://www.w3.org/2000/svg" width="840" height="420" viewBox="0 0 840 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="420" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">三种情形：左转、直行、右转</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">题目保证只出现这三种之一（B 在线段 AC 上，或 ∠ABC 是直角）</text>
  <g filter="url(#rough2)"><rect x="40" y="88" width="220" height="270" rx="4" fill="#ffffff" fill-opacity="0.6" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="150" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">LEFT</text>
  <g filter="url(#rough2)"><circle cx="150" cy="290" r="5" fill="#2b2b2b" fill-opacity="0.9" stroke="#2b2b2b" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><line x1="150" y1="290" x2="150" y2="290" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><line x1="150" y1="290" x2="150" y2="200" stroke="#446688" stroke-width="2" marker-end="url(#arrb)"/></g>
  <text x="158" y="195" text-anchor="start" font-size="12" fill="#446688" filter="url(#rough2)">v</text>
  <g filter="url(#rough2)"><line x1="150" y1="200" x2="60" y2="110" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)"/></g>
  <text x="52" y="104" text-anchor="end" font-size="12" fill="#4a7a3a" filter="url(#rough2)">w</text>
  <text x="150" y="390" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">叉积 &gt; 0</text>
  <g filter="url(#rough2)"><rect x="310" y="88" width="220" height="270" rx="4" fill="#ffffff" fill-opacity="0.6" stroke="#446688" stroke-width="1.4"/></g>
  <text x="420" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">TOWARDS</text>
  <g filter="url(#rough2)"><circle cx="420" cy="290" r="5" fill="#2b2b2b" fill-opacity="0.9" stroke="#2b2b2b" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><line x1="420" y1="290" x2="420" y2="290" stroke="#446688" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><line x1="420" y1="290" x2="420" y2="200" stroke="#446688" stroke-width="2" marker-end="url(#arrb)"/></g>
  <text x="428" y="195" text-anchor="start" font-size="12" fill="#446688" filter="url(#rough2)">v</text>
  <g filter="url(#rough2)"><line x1="420" y1="200" x2="420" y2="290" stroke="#446688" stroke-width="2" marker-end="url(#arrg)"/></g>
  <text x="428" y="284" text-anchor="start" font-size="12" fill="#446688" filter="url(#rough2)">w</text>
  <text x="420" y="390" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">叉积 = 0</text>
  <g filter="url(#rough2)"><rect x="580" y="88" width="220" height="270" rx="4" fill="#ffffff" fill-opacity="0.6" stroke="#a0522d" stroke-width="1.4"/></g>
  <text x="690" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#a0522d" filter="url(#rough2)">RIGHT</text>
  <g filter="url(#rough2)"><circle cx="690" cy="290" r="5" fill="#2b2b2b" fill-opacity="0.9" stroke="#2b2b2b" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><line x1="690" y1="290" x2="690" y2="290" stroke="#a0522d" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><line x1="690" y1="290" x2="690" y2="200" stroke="#446688" stroke-width="2" marker-end="url(#arrb)"/></g>
  <text x="698" y="195" text-anchor="start" font-size="12" fill="#446688" filter="url(#rough2)">v</text>
  <g filter="url(#rough2)"><line x1="690" y1="200" x2="780" y2="110" stroke="#a0522d" stroke-width="2" marker-end="url(#arrr)"/></g>
  <text x="788" y="104" text-anchor="start" font-size="12" fill="#a0522d" filter="url(#rough2)">w</text>
  <text x="690" y="390" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">叉积 &lt; 0</text>
</svg>
