<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="137"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>

  <rect width="820" height="440" fill="#fafafa"/>

  <text x="410" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 4：两处“除号右侧的乘类”违规</text>
  <path d="M 160 40 Q 410 46 660 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <circle cx="410" cy="72" r="16" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="410" y="78" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">+</text>
  <path d="M 400 86 L 246 128" stroke="#777777" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 420 86 L 610 128" stroke="#777777" stroke-width="1.2" filter="url(#rough2)"/>

  <circle cx="230" cy="146" r="16" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230" y="152" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">+</text>
  <circle cx="620" cy="146" r="16" fill="#ffffff" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="620" y="152" text-anchor="middle" font-size="13" fill="#8a2b28" filter="url(#rough2)">/</text>

  <path d="M 220 160 L 160 208" stroke="#777777" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 242 160 L 300 208" stroke="#777777" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 610 160 L 570 208" stroke="#777777" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 632 160 L 682 208" stroke="#777777" stroke-width="1.2" filter="url(#rough2)"/>

  <rect x="80" y="212" width="130" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="145" y="234" text-anchor="middle" font-size="10.5" fill="#2f5223" filter="url(#rough2)">(SumSafe)</text>
  <circle cx="320" cy="229" r="16" fill="#ffffff" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="235" text-anchor="middle" font-size="13" fill="#8a2b28" filter="url(#rough2)">/</text>

  <path d="M 310 244 L 270 288" stroke="#777777" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 330 244 L 374 288" stroke="#777777" stroke-width="1.2" filter="url(#rough2)"/>

  <rect x="196" y="292" width="130" height="34" rx="8" fill="#d9ecd4" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="261" y="314" text-anchor="middle" font-size="10.5" fill="#2f5223" filter="url(#rough2)">DivUnsafe</text>
  <rect x="336" y="292" width="130" height="34" rx="8" fill="#fdeeee" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="401" y="314" text-anchor="middle" font-size="10.5" fill="#8a2b28" filter="url(#rough2)">DivUnsafe</text>
  <text x="410" y="344" font-size="11" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">✗ 在 / 右侧、同为乘类</text>

  <rect x="530" y="212" width="60" height="34" rx="8" fill="#ffffff" stroke="#777777" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="560" y="234" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">x</text>
  <rect x="646" y="212" width="150" height="34" rx="8" fill="#fdeeee" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="721" y="234" text-anchor="middle" font-size="9.5" fill="#8a2b28" filter="url(#rough2)">DenominatorUnsafe</text>
  <text x="700" y="264" font-size="10.5" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">✗ 在 / 右侧</text>

  <text x="40" y="386" font-size="12" fill="#2b2b2b" filter="url(#rough2)">三个宏的类别：SumSafe =（a+b）→ 原子；DivUnsafe = a/b → 乘；DenominatorUnsafe = a*b → 乘。</text>
  <text x="40" y="412" font-size="12" fill="#8a2b28" filter="url(#rough2)">除号右侧出现同级乘类，去掉括号会改变结合方式（a/(b*c) 与 a/b*c 不等），因此判 Suspicious。</text>
</svg>
