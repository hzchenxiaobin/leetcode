<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="340" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">期望的线性性：答案 = Σ P(位置 i 的值 &gt; 位置 j 的值)</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">每次"50% 交换"对每个 (i,j) 都是线性更新，所以维护概率矩阵即可</text>
  <g filter="url(#rough2)"><rect x="180" y="110" width="90" height="50" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="225.0" y="140.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">i</text>
  <g filter="url(#rough2)"><rect x="290" y="110" width="90" height="50" rx="4" fill="#cfe0f0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="335.0" y="140.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">j</text>
  <text x="440" y="140" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">交换 a,b 后：P(a,k) 与 P(b,k) 都变成两者平均</text>
  <text x="440" y="170" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">P(a,b) = P(b,a) = 1/2（交换后对称）</text>
  <text x="440" y="214" text-anchor="start" font-size="13" fill="#3d6b2f" filter="url(#rough2)">每次操作 O(n) 个位置，总复杂度 O(nm)</text>
  <text x="440" y="286" text-anchor="middle" font-size="12.5" fill="#b05a5a" filter="url(#rough2)">所有概率始终满足 P(i,j) + P(j,i) = 1</text>
</svg>
