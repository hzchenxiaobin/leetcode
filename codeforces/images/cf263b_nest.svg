<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="300" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">点 (x,y) 被正方形 i 包含 ⇔ max(x,y) &lt;= a_i</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">所以"包含它的正方形个数"只取决于 max(x,y)</text>
  <g filter="url(#rough2)"><rect x="140" y="110" width="100" height="46" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="190.0" y="137.32" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">a=1</text>
  <g filter="url(#rough2)"><rect x="260" y="110" width="100" height="46" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="310.0" y="137.32" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">a=3</text>
  <g filter="url(#rough2)"><rect x="380" y="110" width="100" height="46" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="430.0" y="137.32" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">a=4</text>
  <g filter="url(#rough2)"><rect x="500" y="110" width="100" height="46" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="550.0" y="137.32" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">a=5</text>
  <text x="440" y="200" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">按 a 升序排序后，恰含 k 个的 t 必须满足 a[n-k-1] &lt; t &lt;= a[n-k]</text>
</svg>
