<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c9801f"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a8524a"/>
    </marker>
  </defs>
  <rect width="760" height="380" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">k 是队长时，他的列表只受一个偏序约束</text>
  <rect x="40.0" y="62.0" width="210.0" height="120.0" rx="10" fill="#f7f9fc" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="145.0" y="86.0" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">更早队伍的人</text>
  <text x="145.0" y="112.0" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">已被选走</text>
  <text x="145.0" y="136.0" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">在列表里放哪都行</text>
  <text x="145.0" y="160.0" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">（完全自由）</text>
  <rect x="280.0" y="62.0" width="200.0" height="120.0" rx="10" fill="#fdf3e3" stroke="#c9801f" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380.0" y="86.0" text-anchor="middle" font-size="13" fill="#c9801f" font-weight="bold" filter="url(#rough2)">两名队友</text>
  <text x="380.0" y="112.0" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">必须是「当时还在场的人」</text>
  <text x="380.0" y="134.0" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">里优先级最高的两个</text>
  <text x="380.0" y="160.0" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">两者之间顺序任意</text>
  <rect x="510.0" y="62.0" width="210.0" height="120.0" rx="10" fill="#f4f9f2" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="615.0" y="86.0" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">更晚队伍的人</text>
  <text x="615.0" y="112.0" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">当时还没被选</text>
  <text x="615.0" y="136.0" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">必须排在两名队友之后</text>
  <text x="615.0" y="160.0" text-anchor="middle" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">（否则队长会先选到他们）</text>
  <path d="M 280.0 122.0 L 254.0 122.0" stroke="#2b2b2b" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380.0" y="210.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">于是合法列表 = 这个偏序的线性扩展：</text>
  <rect x="40.0" y="228.0" width="680.0" height="64.0" rx="8" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.4" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="56.0" y="254.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">• 两名队友都出现之前：只能从「更早队伍的人 ∪ 未出现的队友」里取最小的；</text>
  <text x="56.0" y="280.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">• 两名队友都出现之后：剩下所有人随便排 → 直接升序最小。</text>
  <rect x="40.0" y="304.0" width="680.0" height="48.0" rx="8" fill="#fdf3e3" stroke="#c9801f" stroke-width="1.5" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="56.0" y="334.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">把「更早的人」和「两名队友」各自升序、像归并一样取较小者，队友都取完后接上其余升序。</text>
</svg>
