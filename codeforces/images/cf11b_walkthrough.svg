<svg xmlns="http://www.w3.org/2000/svg" width="700" height="330" viewBox="0 0 700 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="700" height="330" fill="#fafafa"/>
  <text x="350" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">x = 2 的走查：k = 1、2 都不行，k = 3 才行</text>

  <!-- 第 1 行 -->
  <rect x="50" y="62" width="600" height="58" rx="9" fill="#f4f6f9" stroke="#c9ced6" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="66" y="88" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">k = 1</text>
  <text x="150" y="88" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">S₁ = 1 &lt; 2，连最大的落点都够不着</text>
  <text x="560" y="88" font-size="13" font-weight="bold" fill="#8f3b37" filter="url(#rough2)">不行</text>
  <text x="66" y="108" font-size="11.5" fill="#666" filter="url(#rough2)">可达 {−1, +1}</text>

  <!-- 第 2 行 -->
  <rect x="50" y="130" width="600" height="58" rx="9" fill="#fdf3e3" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="66" y="156" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">k = 2</text>
  <text x="150" y="156" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">S₂ = 3 ≥ 2，但 3 − 2 = 1 是奇数：奇偶对不上</text>
  <text x="560" y="156" font-size="13" font-weight="bold" fill="#8f3b37" filter="url(#rough2)">不行</text>
  <text x="66" y="176" font-size="11.5" fill="#666" filter="url(#rough2)">可达 {−3, −1, +1, +3}</text>

  <!-- 第 3 行 -->
  <rect x="50" y="198" width="600" height="58" rx="9" fill="#eef4ec" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="66" y="224" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">k = 3</text>
  <text x="150" y="224" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">S₃ = 6 ≥ 2，6 − 2 = 4 是偶数 ⇒ 可以</text>
  <text x="560" y="224" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">答案 3</text>
  <text x="66" y="244" font-size="11.5" fill="#2f5223" filter="url(#rough2)">跳法：+1 − 2 + 3 = 2</text>

  <text x="350" y="296" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">k 次跳跃的落点与 S_k 同奇偶（每次改号只改变 2j），所以小 k 常常"够得着但奇偶不对"。</text>
  <text x="350" y="316" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">继续加 k 直到奇偶对上，最多只差一步。</text>
</svg>
