<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="107"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="760" height="430" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">状态 =（AC 自动机节点, 未覆盖后缀长度 u）</text>
  <path d="M 152 39 Q 380 45 608 39" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="30" y="54" width="700" height="52" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="46" y="78" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">AC 节点负责“当前串的最长模式后缀长度 L”；u 是“已覆盖前沿之后还有几个位置没盖住”</text>
  <text x="46" y="98" text-anchor="start" font-size="12" fill="#5b5b5b" filter="url(#rough2)">（前沿之前全部已覆盖；u ≥ maxLen 就再也补不上了，直接丢弃）</text>
  <rect x="30" y="120" width="340" height="96" rx="8" fill="#e9f4ec" stroke="#3f6b4a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="46" y="146" text-anchor="start" font-size="13" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">情况 A：L ≥ u + 1</text>
  <text x="46" y="172" text-anchor="start" font-size="12" fill="#2f5223" filter="url(#rough2)">新模式后缀足以盖住整个未覆盖后缀</text>
  <text x="46" y="198" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">⇒ 新状态 u′ = 0（前沿推到最后）</text>
  <rect x="390" y="120" width="340" height="96" rx="8" fill="#fdf3e3" stroke="#8a6015" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="406" y="146" text-anchor="start" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">情况 B：L &lt; u + 1</text>
  <text x="406" y="172" text-anchor="start" font-size="12" fill="#7a5a1b" filter="url(#rough2)">模式只盖住末尾 L 个位置，够不到前沿</text>
  <text x="406" y="198" text-anchor="start" font-size="12.5" font-weight="bold" fill="#7a5a1b" filter="url(#rough2)">⇒ 新状态 u′ = u + 1（前沿原地不动）</text>
  <rect x="30" y="232" width="700" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="46" y="256" text-anchor="start" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">每个状态（节点, u）4 种字符各转移一次；节点 ≤ 1 + 10×10 = 101，u &lt; maxLen ≤ 10</text>
  <text x="46" y="278" text-anchor="start" font-size="12" fill="#7a5a1b" filter="url(#rough2)">总状态数 ≤ 101×10，长度 1000 的 DP 只有约 10⁶ 次转移</text>
  <text x="30" y="320" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">最容易错的一点：不能用 u′ = max(0, u + 1 − L)。那样会在“新模式只盖住新字符”时</text>
  <text x="30" y="342" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">错误地把前沿往前推（例如 u=1、L=1 时该得 u′=2 而不是 1），从而把不合法的串算进去。</text>
  <rect x="30" y="360" width="700" height="54" rx="8" fill="#f7ecec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="46" y="384" text-anchor="start" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">正确判据只看“L 能不能覆盖到前沿+1”：能就归零，不能就 u+1；</text>
  <text x="46" y="404" text-anchor="start" font-size="12" fill="#8a3b37" filter="url(#rough2)">u′ 一旦达到 maxLen 就说明最老的未覆盖位置永远补不上，直接舍弃该转移。</text>
</svg>
