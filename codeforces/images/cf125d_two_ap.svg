<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr125d" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="420" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">把原序列切成两条子序列，各自都必须是等差数列</text>
  <path d="M 130 42 Q 380 50 630 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 原序列 -->
  <text x="60" y="82" font-size="13" font-weight="bold" fill="#555" filter="url(#rough2)">原序列</text>
  <g filter="url(#rough2)" font-size="15" font-family="'Courier New',monospace">
    <rect x="110" y="62" width="46" height="34" fill="#ffffff" stroke="#999"/>
    <text x="133" y="85" text-anchor="middle">4</text>
    <rect x="156" y="62" width="46" height="34" fill="#e8f0fe" stroke="#446688"/>
    <text x="179" y="85" text-anchor="middle">1</text>
    <rect x="202" y="62" width="46" height="34" fill="#e8f0fe" stroke="#446688"/>
    <text x="225" y="85" text-anchor="middle">2</text>
    <rect x="248" y="62" width="46" height="34" fill="#ffffff" stroke="#999"/>
    <text x="271" y="85" text-anchor="middle">7</text>
    <rect x="294" y="62" width="46" height="34" fill="#e8f0fe" stroke="#446688"/>
    <text x="317" y="85" text-anchor="middle">3</text>
    <rect x="340" y="62" width="60" height="34" fill="#ffffff" stroke="#999"/>
    <text x="370" y="85" text-anchor="middle">10</text>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#666">
    <text x="133" y="112" text-anchor="middle">a1</text>
    <text x="179" y="112" text-anchor="middle">a2</text>
    <text x="225" y="112" text-anchor="middle">a3</text>
    <text x="271" y="112" text-anchor="middle">a4</text>
    <text x="317" y="112" text-anchor="middle">a5</text>
    <text x="370" y="112" text-anchor="middle">a6</text>
  </g>

  <!-- 两个子序列 -->
  <g filter="url(#rough2)">
    <rect x="110" y="146" width="300" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="126" y="170" font-size="13" font-weight="bold" fill="#2f4a66">第一条（蓝色）：1, 2, 3</text>
    <text x="126" y="192" font-size="12.5" fill="#2f4a66">保持原序，公差 d = 1</text>
    <rect x="440" y="146" width="300" height="60" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="456" y="170" font-size="13" font-weight="bold" fill="#8a6015">第二条（黄色）：4, 7, 10</text>
    <text x="456" y="192" font-size="12.5" fill="#8a6015">保持原序，公差 d = 3</text>
  </g>

  <!-- 关键性质 -->
  <g filter="url(#rough2)">
    <rect x="60" y="232" width="640" height="166" rx="10" fill="#ffffff" stroke="#888" stroke-width="1.2"/>
    <text x="78" y="258" font-size="13.5" font-weight="bold" fill="#2b2b2b">两条硬性质（整篇解法的支点）</text>
    <text x="78" y="284" font-size="12.5" fill="#2b2b2b">① 长度 ≤ 2 的序列一定是等差数列，长度 0 不是 → n ≤ 4 时总能拆成 2+2 / 1+2 / 1+1，必有解。</text>
    <text x="78" y="308" font-size="12.5" fill="#2b2b2b">② 长度 ≥ 3 的等差数列被「首项 + 公差」唯一确定；只要拿到同一条里的两个元素，公差就定了。</text>
    <text x="78" y="336" font-size="12.5" fill="#2f5223">于是：前 3 个元素里必有两个落在同一条里 → 那条的公差当场确定（只需枚举 4 种归属）。</text>
    <text x="78" y="362" font-size="12.5" fill="#b85450">之后每个元素只有两种去向；凡是「把当前期待值让给对方」的选择，都会让这一条永久作废，</text>
    <text x="78" y="384" font-size="12.5" fill="#b85450">作废后整个后缀必须由另一条独自构成等差 —— 这可以用一张后缀等差表 O(1) 判掉。</text>
  </g>
</svg>
