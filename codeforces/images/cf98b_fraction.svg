<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="987"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="320" fill="#fafafa"/>
  <text x="360.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">把无穷和化成既约分数</text>
  <path d="M 115.2 42 Q 360.0 48 604.8 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="360.0" y="306" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">n = 2^a·m，m 为奇数，t = ord_m(2)</text>
  <rect x="40" y="66" width="640" height="56" rx="9" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5223" filter="url(#rough2)">E(n) = a + Σ_{j≥0} (2^j mod m)/2^j</text>
  <text x="360" y="112" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">前 a 项都是 1（2^k &lt; n 时 2^k mod n = 2^k），剩下的是奇数部分</text>
  <rect x="40" y="132" width="640" height="50" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">c_j = 2^j mod m 以 t = ord_m(2) 为周期</text>
  <text x="360" y="174" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">Σ c_j/2^j = (Σ_{j&lt;t} c_j·2^{t-j}) / (2^t - 1)</text>
  <rect x="40" y="192" width="640" height="46" rx="9" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="214" text-anchor="middle" font-size="13" font-weight="bold" fill="#335478" filter="url(#rough2)">E = [ a·(2^t-1) + Σ_j c_j·2^{t-j} ] / (2^t - 1)</text>
  <text x="360" y="232" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">然后用 gcd 约分；分子用 Horner 法 O(t) 算出</text>
  <rect x="40" y="250" width="300" height="46" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="190" y="270" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">t ≤ φ(m) ≤ 10000</text>
  <text x="190" y="288" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">分母约 5000 个二进位</text>
  <rect x="370" y="250" width="310" height="46" rx="8" fill="#fbeeee" stroke="#a05a5a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="525" y="270" text-anchor="middle" font-size="12" fill="#6b3030" filter="url(#rough2)">C++ 需手写大整数</text>
  <text x="525" y="288" text-anchor="middle" font-size="11.5" fill="#6b3030" filter="url(#rough2)">Python 直接用 int</text>
</svg>
