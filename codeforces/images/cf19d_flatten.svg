<svg xmlns="http://www.w3.org/2000/svg" width="720" height="410" viewBox="0 0 720 410"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="720" height="410" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按 (x, y) 排序后：答案是后缀里第一个 y &gt; qy 的激活点</text>
  <path d="M 95 42 Q 360 48 625 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <text x="40" y="70" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">查询 find(2, 3)：qy = 3，从 S（第一个 x &gt; 2 的点）开始向右找。</text>

  <!-- 数组 -->
  <g font-size="11" fill="#555" text-anchor="middle" filter="url(#rough2)">
    <text x="78" y="112">P₀</text><text x="170" y="112">P₁</text><text x="262" y="112">P₂</text>
    <text x="354" y="112">P₃</text><text x="446" y="112">P₄</text><text x="538" y="112">P₅</text>
    <text x="630" y="112">P₆</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="35" y="120" width="86" height="70" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="127" y="120" width="86" height="70" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="219" y="120" width="86" height="70" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="311" y="120" width="86" height="70" rx="8" fill="#ffffff" stroke="#aaa" stroke-width="1.3" stroke-dasharray="5 3"/>
    <rect x="403" y="120" width="86" height="70" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="495" y="120" width="86" height="70" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="587" y="120" width="86" height="70" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g font-size="11.5" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">
    <text x="78" y="146">(1,1)</text><text x="170" y="146">(3,2)</text><text x="262" y="146">(3,5)</text>
    <text x="354" y="146">(4,3)</text><text x="446" y="146">(5,7)</text><text x="538" y="146">(5,9)</text>
    <text x="630" y="146">(6,4)</text>
    <text x="78" y="172">y=1 ●</text><text x="170" y="172">y=2 ●</text><text x="262" y="172">y=5 ●</text>
    <text x="354" y="172">y=3 ○</text><text x="446" y="172">y=7 ●</text><text x="538" y="172">y=9 ●</text>
    <text x="630" y="172">y=4 ●</text>
  </g>

  <!-- S 标记 -->
  <line x1="123" y1="100" x2="123" y2="205" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="123" y="94" text-anchor="middle" font-size="11" font-weight="bold" fill="#a33a36" filter="url(#rough2)">S</text>
  <text x="123" y="222" text-anchor="middle" font-size="10" fill="#a33a36" filter="url(#rough2)">第一个 x&gt;2</text>

  <!-- 答案 -->
  <path d="M 262 194 L 262 240" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="262" y="262" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">第一个 y&gt;3：P₂=(3,5)</text>
  <text x="262" y="280" text-anchor="middle" font-size="10" fill="#2f5223" filter="url(#rough2)">也就是答案 (3,5)</text>

  <text x="40" y="322" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">P₀ 在 S 左边（x=1≤2），整段不可能入选；P₃ 已被删除（○），直接跳过。</text>
  <text x="40" y="348" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">数组按 (x,y) 字典序排列，所以“下标最小”就是“先最小 x、再最小 y”。</text>
  <text x="40" y="374" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">每个 x 内部的点也按 y 升序，取第一个 y&gt;qy 自动得到该 x 下最靠下的合格点。</text>
</svg>
