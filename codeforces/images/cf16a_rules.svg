<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>

  <rect width="720" height="420" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">条纹旗的两条规则</text>
  <path d="M 235 44 Q 360 50 485 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 左：合法 -->
  <rect x="30" y="60" width="320" height="330" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="46" y="86" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">合法（YES）</text>
  <g filter="url(#rough2)">
    <rect x="105" y="110" width="170" height="34" fill="#fde8e8" stroke="#446688" stroke-width="1.1"/>
    <rect x="105" y="144" width="170" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.1"/>
    <rect x="105" y="178" width="170" height="34" fill="#fff8e1" stroke="#446688" stroke-width="1.1"/>
    <rect x="105" y="212" width="170" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#555" filter="url(#rough2)">
    <text x="190" y="132">0 0 0 0 0</text>
    <text x="190" y="166">1 1 1 1 1</text>
    <text x="190" y="200">2 2 2 2 2</text>
    <text x="190" y="234">3 3 3 3 3</text>
  </g>
  <text x="105" y="286" font-size="11.5" fill="#2f5223" filter="url(#rough2)">每一行 5 格颜色相同</text>
  <text x="105" y="310" font-size="11.5" fill="#2f5223" filter="url(#rough2)">相邻两行颜色都不同</text>
  <text x="105" y="340" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">→ YES</text>

  <!-- 右：非法 -->
  <rect x="370" y="60" width="320" height="330" rx="12" fill="#fde8e8" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="386" y="86" font-size="13" font-weight="bold" fill="#a33a36" filter="url(#rough2)">非法（NO）</text>

  <g filter="url(#rough2)">
    <rect x="390" y="110" width="112" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1"/>
    <rect x="390" y="138" width="112" height="28" fill="#fff8e1" stroke="#446688" stroke-width="1"/>
    <rect x="390" y="166" width="112" height="28" fill="#e6f4ea" stroke="#446688" stroke-width="1"/>
  </g>
  <g font-size="11" text-anchor="middle" fill="#555" filter="url(#rough2)">
    <text x="446" y="129">0 0 0 0</text>
    <text x="446" y="157">0 0 1 1</text>
    <text x="446" y="185">2 2 2 2</text>
  </g>
  <rect x="386" y="134" width="120" height="36" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="512" y="142" font-size="10.5" fill="#a33a36" filter="url(#rough2)">这一行混了 0 和 1</text>
  <text x="512" y="160" font-size="10.5" fill="#a33a36" filter="url(#rough2)">→ 行内不同色，NO</text>

  <g filter="url(#rough2)">
    <rect x="390" y="240" width="112" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1"/>
    <rect x="390" y="268" width="112" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1"/>
    <rect x="390" y="296" width="112" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/>
  </g>
  <g font-size="11" text-anchor="middle" fill="#555" filter="url(#rough2)">
    <text x="446" y="259">0 0 0 0</text>
    <text x="446" y="287">0 0 0 0</text>
    <text x="446" y="315">2 2 2 2</text>
  </g>
  <path d="M 380 268 L 380 296" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="512" y="272" font-size="10.5" fill="#a33a36" filter="url(#rough2)">第 1、2 行都是 0</text>
  <text x="512" y="290" font-size="10.5" fill="#a33a36" filter="url(#rough2)">→ 相邻同色，NO</text>
</svg>
