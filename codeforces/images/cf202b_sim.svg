<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="340" fill="#fafafa"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">202B：把 Lesha 的词排成归档题的子序列，使逆序对最少</text>
  <path d="M 133.52000000000012 46 Q 380.0 52 626.4799999999999 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60.0" y="70.0" width="660.0" height="56.0" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="96.0" text-anchor="start" font-size="10.9" fill="#33506e" filter="url(#rough2)">定义：选择一个排列 π，使 words[π] 是归档题的子序列；取其中逆序对最少者，inv。</text>
  <rect x="60.0" y="140.0" width="660.0" height="56.0" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="166.0" text-anchor="start" font-size="10.9" fill="#2f5b34" filter="url(#rough2)">相似度 p = n(n−1)/2 − inv + 1（与样例逐一对齐：b 的个数就是 p）。</text>
  <rect x="60.0" y="210.0" width="660.0" height="56.0" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="234.0" text-anchor="start" font-size="10.9" fill="#8a6015" filter="url(#rough2)">对所有归档题取 p 最大者；并列取编号最小；都不行输出 Brand new problem!。</text>
  <text x="74.0" y="256.0" text-anchor="start" font-size="10.9" fill="#8a6015" filter="url(#rough2)">n ≤ 4 ⇒ 每个归档题最多 4! = 24 个排列，m ≤ 10 ⇒ 240 次子序列检查。</text>
</svg>
