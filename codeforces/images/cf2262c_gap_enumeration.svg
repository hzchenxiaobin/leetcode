<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="880" height="500" fill="#fafafa"/>

  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">把 c 定下来：至多两个候选，逐个校验值集</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#6b6b6b" filter="url(#rough2)">c = a_n − b_n 一旦确定，「前缀取值集合 / 尾部取值集合」就被完全决定，剩下的只是摆放数</text>

  <rect x="130" y="84" width="620" height="58" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="108" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">① c = a_n − b_n</text>
  <text x="160" y="130" font-size="11.5" fill="#446688" filter="url(#rough2)">链尾一定是最大元素；末尾元素 b_n = a_n − c，且 0 必须排在最大元素左侧</text>

  <path d="M 440 142 L 440 156" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="130" y="158" width="620" height="58" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="182" font-size="14" font-weight="bold" fill="#33582a" filter="url(#rough2)">② 值集形状固定（必要条件）</text>
  <text x="160" y="204" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">{a_n − k·c : 0 ≤ k ≤ |T|} ∪ {k·c : 0 ≤ k ≤ |P| − 1}，恰好 n 个数且两两不同</text>

  <path d="M 440 216 L 440 230" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="130" y="232" width="620" height="58" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="256" font-size="14" font-weight="bold" fill="#7a5a12" filter="url(#rough2)">③ 最小正元素 = min(c, a_n − |T|·c)</text>
  <text x="160" y="278" font-size="11.5" fill="#8a6015" filter="url(#rough2)">⇒ c 至多两个候选：a_2 与 (a_n − a_2) / |T|（能整除才有意义）</text>

  <path d="M 440 290 L 440 304" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="130" y="306" width="620" height="58" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="330" font-size="14" font-weight="bold" fill="#8c3a37" filter="url(#rough2)">④ 生成 n 个数 → 排序 → 与 a 逐一比对</text>
  <text x="160" y="352" font-size="11.5" fill="#8c3a37" filter="url(#rough2)">同时校验非负、两两不同；与 a 完全相同才算这个 c 合法</text>

  <path d="M 440 364 L 440 378" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="130" y="380" width="620" height="58" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="160" y="404" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">⑤ 答案 = (#合法 c) × |P|! × (|T| − 1)!</text>
  <text x="160" y="426" font-size="11.5" fill="#446688" filter="url(#rough2)">|P| = ⌊n/2⌋ 是前缀区域个数，|T| = ⌊(n−1)/2⌋ 是尾部区域个数（末位已被 v 占住）</text>

  <rect x="100" y="452" width="680" height="38" rx="10" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="440" y="476" text-anchor="middle" font-size="11.5" fill="#5a6470" filter="url(#rough2)">c 与划分一一对应：前缀任意排 |P|! 种，尾部除末位外任意排 (|T| − 1)! 种，故每种 c 的贡献相同</text>
</svg>
