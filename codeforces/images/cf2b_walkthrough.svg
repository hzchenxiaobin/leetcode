<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="640" height="380" fill="#fafafa"/>
  <text x="320" y="34" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">样例走查：先看 v₂、v₅，再跑两遍最小路径和 DP</text>

  <text x="140" y="56" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">矩阵 a（格子右下角：v₂ | v₅）</text>
  <text x="430" y="56" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">dp₂：因子 2 的最小路径和</text>

  <rect x="40" y="70" width="64" height="64" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="104" y="70" width="64" height="64" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="168" y="70" width="64" height="64" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="40" y="134" width="64" height="64" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="104" y="134" width="64" height="64" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="168" y="134" width="64" height="64" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="40" y="198" width="64" height="64" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="104" y="198" width="64" height="64" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="168" y="198" width="64" height="64" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>

  <path d="M72,102 L136,102 L200,102 L200,166 L200,230" stroke="#4a7a3a" stroke-width="2.6" fill="none"
        stroke-linecap="round" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="18" text-anchor="middle" fill="#2f4a63"
     stroke="#e8f0fe" stroke-width="3.5" paint-order="stroke">
    <text x="72" y="104">1</text>
    <text x="136" y="104">2</text>
    <text x="200" y="104">3</text>
    <text x="72" y="168">4</text>
    <text x="136" y="168">5</text>
    <text x="200" y="168">6</text>
    <text x="72" y="232">7</text>
    <text x="136" y="232">8</text>
    <text x="200" y="232">9</text>
  </g>

  <g filter="url(#rough2)" font-size="9" text-anchor="end" fill="#8a6d3b">
    <text x="96" y="124">0|0</text>
    <text x="160" y="124">1|0</text>
    <text x="224" y="124">0|0</text>
    <text x="96" y="188">2|0</text>
    <text x="160" y="188">0|1</text>
    <text x="224" y="188">1|0</text>
    <text x="96" y="252">0|0</text>
    <text x="160" y="252">3|0</text>
    <text x="224" y="252">0|0</text>
  </g>

  <rect x="320" y="70" width="56" height="56" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="376" y="70" width="56" height="56" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="432" y="70" width="56" height="56" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="320" y="126" width="56" height="56" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="376" y="126" width="56" height="56" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="432" y="126" width="56" height="56" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="320" y="182" width="56" height="56" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="376" y="182" width="56" height="56" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="432" y="182" width="56" height="56" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="16" text-anchor="middle" fill="#33552a">
    <text x="348" y="106">0</text>
    <text x="404" y="106">1</text>
    <text x="460" y="106">1</text>
    <text x="348" y="162">2</text>
    <text x="404" y="162">1</text>
    <text x="460" y="162">2</text>
    <text x="348" y="218">2</text>
    <text x="404" y="218">4</text>
  </g>
  <text x="460" y="218" text-anchor="middle" font-size="16" fill="#7a5a12" filter="url(#rough2)">2</text>

  <text x="40" y="292" font-size="12" fill="#333" filter="url(#rough2)">dp₅ 的最小和是 0（因子 5 只在中心的 5 出现，绕开即可）⇒ ans = min(2, 0) = 0</text>
  <text x="40" y="318" font-size="12" fill="#33552a" filter="url(#rough2)">绿线 RRDD：乘积 1·2·3·6·9 = 324，末尾 0 个零</text>
  <text x="40" y="344" font-size="11" fill="#666" filter="url(#rough2)">官方样例给出 DDRR（1·4·7·8·9 = 2016），两串并列最优，都含 0 个末尾零</text>
</svg>
