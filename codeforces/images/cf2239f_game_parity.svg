<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 348" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="348" fill="#fafafa" filter="url(#rough2)"/>
  <text x="280" y="26" text-anchor="middle" font-size="15.5" fill="#333" filter="url(#rough2)">数树的奇偶 = 追加游戏的胜负（P 局面）</text>

  <!-- game tree -->
  <line x1="103" y1="88" x2="72" y2="136" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="117" y1="88" x2="148" y2="136" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="66" y1="158" x2="56" y2="196" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="154" y1="158" x2="146" y2="196" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="74" y="110" font-size="10.5" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="142" y="110" font-size="10.5" fill="#d6a040" filter="url(#rough2)">2</text>
  <text x="46" y="176" font-size="10.5" fill="#d6a040" filter="url(#rough2)">2</text>
  <text x="154" y="176" font-size="10.5" fill="#b85450" filter="url(#rough2)">1</text>

  <circle cx="110" cy="72" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="110" y="77" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">ε</text>
  <text x="130" y="60" font-size="11" fill="#4a7a3a" filter="url(#rough2)">P</text>

  <circle cx="65" cy="148" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="65" y="153" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">1</text>
  <text x="84" y="140" font-size="11" fill="#b85450" filter="url(#rough2)">N</text>

  <circle cx="155" cy="148" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="155" y="153" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">2</text>
  <text x="174" y="140" font-size="11" fill="#b85450" filter="url(#rough2)">N</text>

  <circle cx="52" cy="210" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="52" y="215" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">12</text>
  <text x="72" y="204" font-size="11" fill="#4a7a3a" filter="url(#rough2)">P</text>

  <circle cx="148" cy="210" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="148" y="215" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">21</text>
  <text x="168" y="204" font-size="11" fill="#4a7a3a" filter="url(#rough2)">P</text>

  <text x="110" y="250" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">预算 (1,1) 的游戏树</text>
  <text x="118" y="268" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">T(v) 奇 ⟺ 没有孩子的 T 为奇</text>

  <!-- pairing panel -->
  <rect x="298" y="52" width="248" height="164" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="310" y="74" font-size="11.5" fill="#446688" filter="url(#rough2)">配对策略：后手照抄搭档</text>

  <circle cx="352" cy="100" r="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="352" cy="124" r="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="352" cy="148" r="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="432" cy="100" r="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="432" cy="124" r="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="432" cy="148" r="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>

  <line x1="359" y1="100" x2="425" y2="124" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="359" y1="124" x2="425" y2="148" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="359" y1="148" x2="425" y2="100" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>

  <text x="352" y="176" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">颜色 1</text>
  <text x="432" y="176" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">颜色 2</text>
  <text x="392" y="200" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">每对异色 ⇒ 回招永远合法</text>

  <!-- lemma box -->
  <rect x="20" y="282" width="520" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="34" y="303" font-size="12" fill="#333" filter="url(#rough2)">引理：根局面是 P 局面 ⟺ Σb 为偶数 且 2·max b ≤ Σb</text>
  <text x="34" y="322" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">（S 偶且最大堆不超一半 ⇒ 令牌可两两异色配对，后手总有回招）</text>
</svg>
