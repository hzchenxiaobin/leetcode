<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="241"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="320" fill="#fafafa"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">汤量同时受两个上界限制，取较小者</text>
  <path d="M 140 40 Q 400 46 660 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60" y="80" width="300" height="90" rx="12" fill="#eef4fb" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="80" y="110" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">配料上界</text>
  <text x="80" y="138" font-size="12" fill="#2b2b2b" filter="url(#rough2)">x ≤ min b_i / a_i</text>
  <text x="80" y="160" font-size="11" fill="#777777" filter="url(#rough2)">每种配料都不能用完超过存量</text>
  <rect x="440" y="80" width="300" height="90" rx="12" fill="#fbe3c8" stroke="#c98a2b" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="460" y="110" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">锅的上界</text>
  <text x="460" y="138" font-size="12" fill="#2b2b2b" filter="url(#rough2)">S·x ≤ V ⇒ x ≤ V/S</text>
  <text x="460" y="160" font-size="11" fill="#777777" filter="url(#rough2)">S = a1 + … + an</text>
  <text x="390" y="212" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">答案 = min(V, S · min_i b_i/a_i)</text>
  <text x="60" y="262" font-size="12" fill="#2b2b2b" filter="url(#rough2)">样例 2：S=2，min b/a=25 → 2×25=50 &lt; 100，答案 50（配料先耗尽）。</text>
  <text x="60" y="292" font-size="12" fill="#2b2b2b" filter="url(#rough2)">样例 3：S=2，min b/a=60 → 120 &gt; 100，答案 100（锅先满）。</text>

</svg>
