<svg xmlns="http://www.w3.org/2000/svg" width="840" height="380" viewBox="0 0 840 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="380" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">分形的一步：四个象限按图案涂黑或继续递归</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">图案 P 是 2×2 的 0/1 掩码，步数 k ≥ 2</text>
  <text x="300" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">图案 P（黑=1）</text>
  <g filter="url(#rough2)"><rect x="250" y="112" width="38" height="38" rx="4" fill="#444444" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="269" y="138" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="294" y="112" width="38" height="38" rx="4" fill="#ffffff" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <g filter="url(#rough2)"><rect x="250" y="156" width="38" height="38" rx="4" fill="#ffffff" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <g filter="url(#rough2)"><rect x="294" y="156" width="38" height="38" rx="4" fill="#444444" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="313" y="182" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff" filter="url(#rough2)">1</text>
  <text x="560" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">第一步后的 B_P(1)</text>
  <g filter="url(#rough2)"><rect x="510" y="112" width="38" height="38" rx="4" fill="#333333" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="529" y="138" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff" filter="url(#rough2)">*</text>
  <g filter="url(#rough2)"><rect x="554" y="112" width="38" height="38" rx="4" fill="#ffffff" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="573" y="138" text-anchor="middle" font-size="13" font-weight="bold" fill="#999999" filter="url(#rough2)">.</text>
  <g filter="url(#rough2)"><rect x="510" y="156" width="38" height="38" rx="4" fill="#ffffff" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="529" y="182" text-anchor="middle" font-size="13" font-weight="bold" fill="#999999" filter="url(#rough2)">.</text>
  <g filter="url(#rough2)"><rect x="554" y="156" width="38" height="38" rx="4" fill="#333333" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="573" y="182" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff" filter="url(#rough2)">*</text>
  <text x="420" y="220" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">B_P(k) 的象限 q：若 P_q=1 则整块黑；否则等于 B_P(k−1)</text>
  <g filter="url(#rough2)"><rect x="180" y="244" width="480" height="60" rx="4" fill="#f7fbf4" fill-opacity="0.85" stroke="#a8c99a" stroke-width="1.3"/></g>
  <text x="420" y="270" text-anchor="middle" font-size="12" fill="#3d6b2f" filter="url(#rough2)">递归结构 ⇒ 可以按 k 逐层用位掩码判断</text>
  <text x="420" y="294" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">每个方块 16 位掩码记录"哪些图案能生成它"</text>
  <text x="420" y="344" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">统计所有 k ≥ 2、掩码非零的方块</text>
</svg>
