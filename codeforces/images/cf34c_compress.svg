<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="337"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="340" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">C：先去重排序，再把“连续的一段”压成区间</text>
  <path d="M 140 42 Q 380 47 620 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <text x="60" y="74" font-size="11.5" fill="#777" filter="url(#rough2)">输入：1,2,3,1,1,2,6,6,2</text>
  <text x="60" y="100" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">去重排序：1　2　3　6</text>

  <rect x="150" y="112" width="56" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="178" y="136" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">1</text>
  <rect x="212" y="112" width="56" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="240" y="136" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">2</text>
  <rect x="274" y="112" width="56" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="302" y="136" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">3</text>
  <rect x="352" y="112" width="56" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="380" y="136" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">6</text>

  <line x1="150" y1="160" x2="330" y2="160" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="150" y1="154" x2="150" y2="166" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="330" y1="154" x2="330" y2="166" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240" y="182" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">连续段 1..3 → 写成 1-3</text>

  <text x="420" y="136" font-size="11" fill="#555" filter="url(#rough2)">6 前后断开 → 单页 6</text>

  <rect x="150" y="200" width="330" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="315" y="226" text-anchor="middle" font-size="13" fill="#8a6015" font-family="'Courier New',monospace" filter="url(#rough2)">输出：1-3,6</text>

  <rect x="60" y="256" width="640" height="72" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="72" y="280" font-size="11" fill="#2f4a66" filter="url(#rough2)">格式约束（英文原文）：输出 l1-r1, l2-r2, …, lk-rk，并满足 r(i) + 1 &lt; l(i+1)；</text>
  <text x="72" y="302" font-size="11" fill="#2f4a66" filter="url(#rough2)">若 l(i) = r(i)，只输出 l(i)。所以两连号必须写成 “1-2” 而不是 “1,2”。</text>
  <text x="72" y="322" font-size="10" fill="#8c3a36" filter="url(#rough2)">逗号分隔、不带空格；页码不去重会把 1 重复写成 “1-3,1-……” 之类的错误。</text>
</svg>
