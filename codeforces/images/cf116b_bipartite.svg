<svg xmlns="http://www.w3.org/2000/svg" width="700" height="340" viewBox="0 0 700 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1163"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="700" height="340" fill="#fafafa"/>
  <text x="350.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">狼与小猪的邻居关系</text>
  <path d="M 112.0 42 Q 350.0 48 588.0 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="350.0" y="326" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">每只小猪至多连一只狼 ⇒ 候选集合互不相交</text>
  <rect x="180" y="70" width="70" height="70" rx="7" fill="#fbeeee" stroke="#a05a5a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="215.0" y="112.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#a05a5a" filter="url(#rough2)">P</text>
  <rect x="250" y="70" width="70" height="70" rx="7" fill="#fbeeee" stroke="#a05a5a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="285.0" y="112.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#a05a5a" filter="url(#rough2)">P</text>
  <rect x="320" y="70" width="70" height="70" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="355.0" y="112.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#5a7fb0" filter="url(#rough2)">W</text>
  <rect x="180" y="140" width="70" height="70" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="215.0" y="182.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#5a7fb0" filter="url(#rough2)">W</text>
  <rect x="250" y="140" width="70" height="70" rx="7" fill="#f4f4f1" stroke="#c8c8c0" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="285.0" y="182.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#c8c8c0" filter="url(#rough2)">.</text>
  <rect x="320" y="140" width="70" height="70" rx="7" fill="#fbeeee" stroke="#a05a5a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="355.0" y="182.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#a05a5a" filter="url(#rough2)">P</text>
  <line x1="285.0" y1="105.0" x2="355.0" y2="105.0" stroke="#b85450" stroke-width="2.4" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <line x1="215.0" y1="105.0" x2="215.0" y2="175.0" stroke="#b85450" stroke-width="2.4" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <line x1="355.0" y1="175.0" x2="355.0" y2="105.0" stroke="#b85450" stroke-width="2.4" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="560" y="110" text-anchor="start" font-size="11" fill="#8c2f2c" filter="url(#rough2)">(1,2) ↔ (1,3)</text>
  <text x="560" y="140" text-anchor="start" font-size="11" fill="#8c2f2c" filter="url(#rough2)">(1,1) ↔ (2,1)</text>
  <text x="560" y="170" text-anchor="start" font-size="11" fill="#8c2f2c" filter="url(#rough2)">(2,3) ↔ (1,3)</text>
  <text x="360" y="280" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">三只小猪各连一只狼，狼 (1,3) 连两只——但狼可以吃多只的候选</text>
  <text x="360" y="305" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">因为小猪度 ≤ 1，候选集合两两不交 ⇒ 每只狼各吃一只即最优</text>
</svg>
