<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="420" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="38" text-anchor="middle" font-size="18.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">48E：状态 (头,尾)，只保留“总数 ≤ R”的格子；三种结局</text>
  <path d="M 137 50 Q 380 56 623 50" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="84" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">一次挥剑 = 砍 i 个头（1..min(n,头)）或 i 条尾，然后按规则生长；总数 &gt; R 的一步等于恶龙获胜。</text>
  <rect x="100" y="120" width="52" height="52" fill="#ffffff" stroke="#bbb" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="126.0" y="150.0" text-anchor="middle" font-size="10.5" fill="#8a8a8a" font-weight="normal" filter="url(#rough2)">0,0</text>
  <rect x="152" y="120" width="52" height="52" fill="#ffffff" stroke="#bbb" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="178.0" y="150.0" text-anchor="middle" font-size="10.5" fill="#8a8a8a" font-weight="normal" filter="url(#rough2)">0,1</text>
  <rect x="204" y="120" width="52" height="52" fill="#ffffff" stroke="#bbb" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="230.0" y="150.0" text-anchor="middle" font-size="10.5" fill="#8a8a8a" font-weight="normal" filter="url(#rough2)">0,2</text>
  <rect x="256" y="120" width="52" height="52" fill="#ffffff" stroke="#bbb" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="282.0" y="150.0" text-anchor="middle" font-size="10.5" fill="#8a8a8a" font-weight="normal" filter="url(#rough2)">0,3</text>
  <rect x="308" y="120" width="52" height="52" fill="#ffffff" stroke="#bbb" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="334.0" y="150.0" text-anchor="middle" font-size="10.5" fill="#8a8a8a" font-weight="normal" filter="url(#rough2)">0,4</text>
  <rect x="100" y="172" width="52" height="52" fill="#ffffff" stroke="#bbb" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="126.0" y="202.0" text-anchor="middle" font-size="10.5" fill="#8a8a8a" font-weight="normal" filter="url(#rough2)">1,0</text>
  <rect x="152" y="172" width="52" height="52" fill="#ffffff" stroke="#bbb" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="178.0" y="202.0" text-anchor="middle" font-size="10.5" fill="#8a8a8a" font-weight="normal" filter="url(#rough2)">1,1</text>
  <rect x="204" y="172" width="52" height="52" fill="#ffffff" stroke="#bbb" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="230.0" y="202.0" text-anchor="middle" font-size="10.5" fill="#8a8a8a" font-weight="normal" filter="url(#rough2)">1,2</text>
  <rect x="256" y="172" width="52" height="52" fill="#ffffff" stroke="#bbb" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="282.0" y="202.0" text-anchor="middle" font-size="10.5" fill="#8a8a8a" font-weight="normal" filter="url(#rough2)">1,3</text>
  <rect x="100" y="224" width="52" height="52" fill="#ffffff" stroke="#bbb" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="126.0" y="254.0" text-anchor="middle" font-size="10.5" fill="#8a8a8a" font-weight="normal" filter="url(#rough2)">2,0</text>
  <rect x="152" y="224" width="52" height="52" fill="#ffffff" stroke="#bbb" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="178.0" y="254.0" text-anchor="middle" font-size="10.5" fill="#8a8a8a" font-weight="normal" filter="url(#rough2)">2,1</text>
  <rect x="204" y="224" width="52" height="52" fill="#ffffff" stroke="#bbb" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="230.0" y="254.0" text-anchor="middle" font-size="10.5" fill="#8a8a8a" font-weight="normal" filter="url(#rough2)">2,2</text>
  <rect x="100" y="276" width="52" height="52" fill="#ffffff" stroke="#bbb" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="126.0" y="306.0" text-anchor="middle" font-size="10.5" fill="#8a8a8a" font-weight="normal" filter="url(#rough2)">3,0</text>
  <rect x="152" y="276" width="52" height="52" fill="#ffffff" stroke="#bbb" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="178.0" y="306.0" text-anchor="middle" font-size="10.5" fill="#8a8a8a" font-weight="normal" filter="url(#rough2)">3,1</text>
  <rect x="100" y="328" width="52" height="52" fill="#ffffff" stroke="#bbb" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="126.0" y="358.0" text-anchor="middle" font-size="10.5" fill="#8a8a8a" font-weight="normal" filter="url(#rough2)">4,0</text>
  <text x="100" y="110" text-anchor="start" font-size="11" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">状态表（行=头数 h，列=尾数 t，h+t ≤ R=4）</text>
  <rect x="400" y="118" width="320" height="118" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="416" y="148" text-anchor="start" font-size="11.5" fill="#2f5223" font-weight="bold" filter="url(#rough2)">① (0,0) 可达 ⇒ Ivan（最少步数）</text>
  <text x="416" y="176" text-anchor="start" font-size="11.5" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">② 可达子图有环 ⇒ Draw（无限僵持）</text>
  <text x="416" y="204" text-anchor="start" font-size="11.5" fill="#b6483f" font-weight="bold" filter="url(#rough2)">③ 无环且到不了 (0,0) ⇒ Zmey</text>
  <text x="416" y="228" text-anchor="start" font-size="10.5" fill="#b6483f" font-weight="normal" filter="url(#rough2)">   （最长路 + 1，最后一次是必死的出击）</text>
  <rect x="400" y="250" width="320" height="120" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="416" y="278" text-anchor="start" font-size="11.5" fill="#2f4a66" font-weight="normal" filter="url(#rough2)">规模：状态数 ≈ (R+1)(R+2)/2 ≤ 20301</text>
  <text x="416" y="304" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">每个状态至多 n+m ≤ 400 条出边</text>
  <text x="416" y="330" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">BFS 求最短路 + DFS 判环 + 记忆化求最长路</text>
</svg>
