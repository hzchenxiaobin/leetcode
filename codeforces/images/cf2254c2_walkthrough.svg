<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="mB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="mG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="600" height="380" fill="#fafafa" filter="url(#rough2)"/>

  <text x="300" y="28" text-anchor="middle" font-size="16" fill="#333"
        filter="url(#rough2)">样例 5 走查：a = 01001，b = 10010</text>
  <text x="300" y="50" text-anchor="middle" font-size="11" fill="#666"
        filter="url(#rough2)">链上相邻两格在串里相隔 2 个下标，故 操作数 = 下标差 / 2</text>

  <!-- 偶数链 -->
  <text x="150" y="84" text-anchor="middle" font-size="12" fill="#446688"
        filter="url(#rough2)">偶数链：a[0], a[2], a[4]</text>

  <text x="46" y="124" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="70" y="100" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="94" y="123" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <rect x="130" y="100" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="154" y="123" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <rect x="190" y="100" width="48" height="34" rx="4" fill="#fce4ec" stroke="#b85450"
        stroke-width="2" filter="url(#rough2)"/>
  <text x="214" y="123" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>

  <text x="46" y="200" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <rect x="70" y="176" width="48" height="34" rx="4" fill="#fce4ec" stroke="#b85450"
        stroke-width="2" filter="url(#rough2)"/>
  <text x="94" y="199" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="130" y="176" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="154" y="199" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <rect x="190" y="176" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="214" y="199" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>

  <path d="M 214 136 C 214 152, 94 146, 94 174" stroke="#446688" stroke-width="1.7"
        fill="none" marker-end="url(#mB)" filter="url(#rough2)"/>
  <text x="256" y="158" text-anchor="middle" font-size="11" fill="#446688"
        filter="url(#rough2)">下标 4 → 0，共 4 格</text>

  <rect x="52" y="238" width="216" height="34" rx="8" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="260" text-anchor="middle" font-size="12" fill="#333"
        filter="url(#rough2)">偶链代价 = 4 / 2 = 2 步</text>

  <!-- 奇数链 -->
  <text x="425" y="84" text-anchor="middle" font-size="12" fill="#4a7a3a"
        filter="url(#rough2)">奇数链：a[1], a[3]</text>

  <text x="330" y="124" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="360" y="100" width="48" height="34" rx="4" fill="#fce4ec" stroke="#b85450"
        stroke-width="2" filter="url(#rough2)"/>
  <text x="384" y="123" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="420" y="100" width="48" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="444" y="123" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>

  <text x="330" y="200" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <rect x="360" y="176" width="48" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="384" y="199" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <rect x="420" y="176" width="48" height="34" rx="4" fill="#fce4ec" stroke="#b85450"
        stroke-width="2" filter="url(#rough2)"/>
  <text x="444" y="199" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>

  <path d="M 392 136 C 392 156, 444 150, 444 174" stroke="#4a7a3a" stroke-width="1.7"
        fill="none" marker-end="url(#mG)" filter="url(#rough2)"/>
  <text x="496" y="158" text-anchor="middle" font-size="11" fill="#4a7a3a"
        filter="url(#rough2)">下标 1 → 3，共 2 格</text>

  <rect x="336" y="238" width="216" height="34" rx="8" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="444" y="260" text-anchor="middle" font-size="12" fill="#333"
        filter="url(#rough2)">奇链代价 = 2 / 2 = 1 步</text>

  <text x="300" y="312" text-anchor="middle" font-size="16" fill="#b85450"
        filter="url(#rough2)">答案 = 2 + 1 = 3 次操作</text>
  <text x="300" y="338" text-anchor="middle" font-size="12" fill="#666"
        filter="url(#rough2)">两条链的操作可以任意交错，代价直接相加，互不影响</text>
  <text x="300" y="362" text-anchor="middle" font-size="11" fill="#888"
        filter="url(#rough2)">任一链里 1 的个数不同，则该组直接输出 -1</text>
</svg>
