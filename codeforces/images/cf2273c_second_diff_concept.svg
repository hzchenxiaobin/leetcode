<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">matchable ⟺ 相邻 2×2 交错和 C 全为零</text>

  <!-- 列号 -->
  <text x="81" y="88" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">1</text>
  <text x="147" y="88" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">2</text>
  <text x="213" y="88" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">3</text>
  <!-- 行号 -->
  <text x="36" y="133" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">1</text>
  <text x="36" y="199" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">2</text>
  <text x="36" y="265" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">3</text>
  <text x="24" y="199" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">i</text>
  <text x="147" y="72" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">j</text>

  <!-- 3x3 网格：默认格 -->
  <rect x="48" y="96" width="66" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="114" y="96" width="66" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="180" y="96" width="66" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="48" y="162" width="66" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="48" y="228" width="66" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>

  <!-- 高亮：C(3,3) 用到的四格 -->
  <rect x="114" y="162" width="66" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="180" y="162" width="66" height="66" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="114" y="228" width="66" height="66" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="180" y="228" width="66" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>

  <text x="81" y="133" text-anchor="middle" font-size="13" fill="#2f4f6f" filter="url(#rough2)">d(1,1)</text>
  <text x="147" y="133" text-anchor="middle" font-size="13" fill="#2f4f6f" filter="url(#rough2)">d(1,2)</text>
  <text x="213" y="133" text-anchor="middle" font-size="13" fill="#2f4f6f" filter="url(#rough2)">d(1,3)</text>
  <text x="81" y="199" text-anchor="middle" font-size="13" fill="#2f4f6f" filter="url(#rough2)">d(2,1)</text>
  <text x="81" y="265" text-anchor="middle" font-size="13" fill="#2f4f6f" filter="url(#rough2)">d(3,1)</text>

  <text x="147" y="199" text-anchor="middle" font-size="13" fill="#33502a" filter="url(#rough2)">d(2,2) +</text>
  <text x="213" y="199" text-anchor="middle" font-size="13" fill="#8a3030" filter="url(#rough2)">d(2,3) −</text>
  <text x="147" y="265" text-anchor="middle" font-size="13" fill="#8a3030" filter="url(#rough2)">d(3,2) −</text>
  <text x="213" y="265" text-anchor="middle" font-size="13" fill="#33502a" filter="url(#rough2)">d(3,3) +</text>

  <!-- 图注与公式 -->
  <text x="48" y="322" font-size="12" fill="#666" filter="url(#rough2)">绿色取 +1，红色取 −1，其余格不参与</text>
  <text x="48" y="350" font-size="13" fill="#333" filter="url(#rough2)">C(3,3) = d(3,3) + d(2,2) − d(3,2) − d(2,3)</text>
  <text x="48" y="376" font-size="12" fill="#666" filter="url(#rough2)">d = b − a（逐元素作差）</text>

  <!-- 右侧说明框 -->
  <rect x="300" y="86" width="392" height="240" fill="#fffdf6" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="320" y="114" font-size="13.5" fill="#8a6d1f" filter="url(#rough2)">为什么「C 全零」就够？</text>
  <text x="320" y="146" font-size="12" fill="#333" filter="url(#rough2)">① d(i,j) = h_i + w_j 就是「行数 + 列数」结构</text>
  <text x="320" y="174" font-size="12" fill="#333" filter="url(#rough2)">② 两行两列做交错和，h 与 w 被完全消掉</text>
  <text x="320" y="202" font-size="12" fill="#8a3030" filter="url(#rough2)">⟹ 任何矩形交错和都必须为 0</text>
  <text x="320" y="230" font-size="12" fill="#333" filter="url(#rough2)">③ 只验相邻 2×2 的 C = 0，逐行累加即可</text>
  <text x="320" y="258" font-size="12" fill="#333" filter="url(#rough2)">   推出所有矩形的交错和为 0（见 §5）</text>
  <text x="320" y="292" font-size="12" fill="#33502a" filter="url(#rough2)">⟹ 询问 ⟺ C 在 [r1+1, r2] × [c1+1, c2] 全 0</text>

  <!-- 箭头：网格 -> 说明 -->
  <path d="M262,206 C280,206 286,206 296,206" fill="none" stroke="#d6a040" stroke-width="1.6"
        marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
