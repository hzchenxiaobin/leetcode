<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>

  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">火球落在 i：i 掉 a 血，左右邻居各掉 b 血</text>
  <path d="M 145 46 Q 360 52 575 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 火球 -->
  <circle cx="360" cy="66" r="16" fill="#fde8e8" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="71" text-anchor="middle" font-size="13" font-weight="bold" fill="#a33a36" filter="url(#rough2)">火</text>
  <path d="M 352 80 C 320 90 300 94 292 100" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 360 82 L 360 99" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 368 80 C 400 90 420 94 428 100" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- 七个弓箭手 -->
  <g filter="url(#rough2)">
    <rect x="81" y="100" width="66" height="70" rx="8" fill="#fde8e8" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4"/>
    <rect x="163" y="100" width="66" height="70" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="245" y="100" width="66" height="70" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="327" y="100" width="66" height="70" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="409" y="100" width="66" height="70" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="491" y="100" width="66" height="70" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="573" y="100" width="66" height="70" rx="8" fill="#fde8e8" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4"/>
  </g>
  <g font-size="12" fill="#777" text-anchor="middle" filter="url(#rough2)">
    <text x="114" y="118">1</text><text x="196" y="118">2</text><text x="278" y="118">3</text>
    <text x="360" y="118">4</text><text x="442" y="118">5</text><text x="524" y="118">6</text><text x="606" y="118">7</text>
  </g>
  <g font-size="19" font-weight="bold" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">
    <text x="114" y="154">h₁</text><text x="196" y="154">h₂</text><text x="278" y="154">h₃</text>
    <text x="360" y="154">h₄</text><text x="442" y="154">h₅</text><text x="524" y="154">h₆</text><text x="606" y="154">h₇</text>
  </g>

  <!-- 两端打不到 -->
  <g stroke="#b85450" stroke-width="2.4" opacity="0.85" filter="url(#rough2)">
    <line x1="84" y1="103" x2="144" y2="167"/><line x1="144" y1="103" x2="84" y2="167"/>
    <line x1="576" y1="103" x2="636" y2="167"/><line x1="636" y1="103" x2="576" y2="167"/>
  </g>
  <text x="114" y="190" text-anchor="middle" font-size="11.5" fill="#a33a36" filter="url(#rough2)">打不到</text>
  <text x="606" y="190" text-anchor="middle" font-size="11.5" fill="#a33a36" filter="url(#rough2)">打不到</text>

  <!-- 伤害标签 -->
  <text x="278" y="192" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5223" filter="url(#rough2)">−b</text>
  <text x="360" y="192" text-anchor="middle" font-size="15" font-weight="bold" fill="#a33a36" filter="url(#rough2)">−a</text>
  <text x="442" y="192" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5223" filter="url(#rough2)">−b</text>

  <!-- 公式面板 -->
  <rect x="55" y="216" width="610" height="116" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="72" y="246" font-size="14.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">弓箭手 i 受到的总伤害 = a · k_i + b · (k_{i−1} + k_{i+1})</text>
  <text x="72" y="274" font-size="12.5" fill="#7a5a1b" filter="url(#rough2)">k_j 表示打在 j 上的火球数；两个端点 k_1 = k_n = 0，且 2 ≤ j ≤ n−1</text>
  <text x="72" y="302" font-size="12.5" fill="#7a5a1b" filter="url(#rough2)">死亡条件：伤害 ≥ h_i + 1（血量严格小于 0）；目标：最小化总发数 Σ k_j</text>

  <text x="55" y="364" font-size="13" fill="#2b2b2b" filter="url(#rough2)">关键结构：k_i 只出现在 i−1、i、i+1 三个约束中，</text>
  <text x="55" y="390" font-size="13" fill="#2b2b2b" filter="url(#rough2)">所以从左往右决策时，只需记住相邻两个 k 值。</text>
</svg>
