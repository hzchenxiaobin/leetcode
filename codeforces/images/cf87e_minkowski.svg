<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="720" height="420" fill="#fafafa"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">Minkowski 和：边向量按极角合并</text>
  <path d="M 200 43 Q 360 49 520 43" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 110 300 L 170 250 L 230 300 L 170 340 Z" stroke="#446688" stroke-width="2.0" fill="#e8f0fe" filter="url(#rough2)"/>
  <path d="M 300 250 L 370 210 L 420 270 L 350 320 Z" stroke="#4a7a3a" stroke-width="2.0" fill="#e9f4e2" filter="url(#rough2)"/>
  <text x="170" y="366" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">多边形 A</text>
  <text x="360" y="350" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">多边形 B</text>
  <path d="M 560 150 L 690 170 L 670 250 L 600 280 L 530 210 Z" stroke="#b85450" stroke-width="2.0" fill="#fdecea" filter="url(#rough2)"/>
  <text x="590" y="310" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">A ⊕ B</text>
  <rect x="60" y="72" width="600" height="56" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="76" y="96" text-anchor="start" font-size="11.5" fill="#8a6015" filter="url(#rough2)">凸多边形的 Minkowski 和：起点 = 两个「最低最左」顶点之和；</text>
  <text x="76" y="118" text-anchor="start" font-size="11.5" fill="#8a6015" filter="url(#rough2)">之后把两多边形的边向量按极角排序依次相加（同向的合并）。</text>
  <rect x="60" y="380" width="600" height="32" rx="7" fill="#e9f4e2" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="76" y="401" text-anchor="start" font-size="11" fill="#2f5223" filter="url(#rough2)">三个多边形就做两次；总点数 ≤ n1+n2+n3，O(V log V)。</text>
</svg>
