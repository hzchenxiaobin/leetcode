<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" width="780" height="560"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.027" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="780" height="560" fill="#fafafa"/>

  <text x="390" y="32" text-anchor="middle" font-size="17" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">三组数据走查：同一条构造流水线</text>
  <text x="390" y="56" text-anchor="middle" font-size="12" fill="#66788c" filter="url(#rough2)">b 定段数 → A/B 定两种段数 → 字符数分给首段 → 拼串 → 反查 k</text>

  <rect x="40" y="76" width="700" height="132" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="60" y="102" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">① n = 7，k = 4</text>
  <text x="60" y="128" font-size="12.5" fill="#33506b" filter="url(#rough2)">b = n − k = 3 ⇒ A = 2 个 0 段、B = 1 个 1 段；0 要 4 个、1 要 3 个</text>
  <text x="60" y="154" font-size="12.5" fill="#33506b" filter="url(#rough2)">段长：0 段首段 4−2+1 = 3、次段 1（共 4 个）；1 段唯一一段 3−1+1 = 3</text>
  <text x="60" y="180" font-size="13" fill="#37662c" filter="url(#rough2)">s = 0 0 0 1 1 1 0 = 0001110，同字符对 = 2 + 2 + 0 = 4 ✓</text>
  <text x="612" y="180" font-size="12" fill="#66788c" filter="url(#rough2)">段数 3 ⇒ k = 7−3 = 4</text>

  <rect x="40" y="222" width="700" height="132" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="60" y="248" font-size="13" fill="#37662c" font-weight="bold" filter="url(#rough2)">② n = 6，k = 1</text>
  <text x="60" y="274" font-size="12.5" fill="#37662c" filter="url(#rough2)">b = n − k = 5 ⇒ A = 3 个 0 段、B = 2 个 1 段；0 要 3 个、1 要 3 个</text>
  <text x="60" y="300" font-size="12.5" fill="#37662c" filter="url(#rough2)">段长：0 段 1 + 1 + 1，1 段首段 3−2+1 = 2 再补 1 ⇒ 1 | 2 | 1 | 1 | 1</text>
  <text x="60" y="326" font-size="13" fill="#37662c" filter="url(#rough2)">s = 0 1 1 0 1 0 = 011010，同字符对 = 0 + 1 + 0 + 0 + 0 = 1 ✓</text>
  <text x="612" y="326" font-size="12" fill="#66788c" filter="url(#rough2)">段数 5 ⇒ k = 6−5 = 1</text>

  <rect x="40" y="368" width="700" height="132" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="60" y="394" font-size="13" fill="#a14340" font-weight="bold" filter="url(#rough2)">③ n = 4，k = 3</text>
  <text x="60" y="420" font-size="12.5" fill="#a14340" filter="url(#rough2)">b = n − k = 1 ⇒ B = ⌊1/2⌋ = 0，也就是只剩一段、全串同字符</text>
  <text x="60" y="446" font-size="12.5" fill="#a14340" filter="url(#rough2)">平衡条件却要求 0、1 各 2 个——两种字符都得出现，与 b = 1 冲突</text>
  <text x="60" y="472" font-size="13" fill="#a14340" filter="url(#rough2)">输出 −1 ✗（这就是 k &gt; n − 2 的唯一无解形态）</text>
  <text x="612" y="472" font-size="12" fill="#66788c" filter="url(#rough2)">b = 1 ⇒ k = n−1</text>

  <text x="390" y="536" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">反查一律成立：段数 b 由构造决定，而 b = n − k 是恒等式，不需要逐位核对</text>
</svg>
