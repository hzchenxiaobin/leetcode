<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 510" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="510" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">换成「边界」视角：极长交替段被 2/3 块整段铺满</text>
  <text x="300" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">✓ 表示 s[i] ≠ s[i+1]（可用边界），✗ 表示相同（把串切断）；连续 ✓ 组成一段</text>

  <text x="70" y="92" text-anchor="end" font-size="10.5" fill="#666" filter="url(#rough2)">边界</text>
  <text x="70" y="122" text-anchor="end" font-size="10.5" fill="#666" filter="url(#rough2)">字符</text>

  <g filter="url(#rough2)">
    <rect x="113" y="100" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <rect x="167" y="100" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <rect x="221" y="100" width="50" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <rect x="275" y="100" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5"/>
    <rect x="329" y="100" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5"/>
    <rect x="383" y="100" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5"/>
    <rect x="437" y="100" width="50" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5"/>
    <text x="138" y="124" text-anchor="middle" font-size="15" fill="#2f4f6f">1</text>
    <text x="192" y="124" text-anchor="middle" font-size="15" fill="#2f4f6f">0</text>
    <text x="246" y="124" text-anchor="middle" font-size="15" fill="#2f4f6f">1</text>
    <text x="300" y="124" text-anchor="middle" font-size="15" fill="#3a5a30">1</text>
    <text x="354" y="124" text-anchor="middle" font-size="15" fill="#3a5a30">0</text>
    <text x="408" y="124" text-anchor="middle" font-size="15" fill="#3a5a30">1</text>
    <text x="462" y="124" text-anchor="middle" font-size="15" fill="#3a5a30">0</text>
  </g>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <circle cx="165" cy="84" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="165" y="88" fill="#3a5a30">✓</text>
    <circle cx="219" cy="84" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="219" y="88" fill="#3a5a30">✓</text>
    <circle cx="273" cy="84" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <text x="273" y="88" fill="#8a3a36">✗</text>
    <circle cx="327" cy="84" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="327" y="88" fill="#3a5a30">✓</text>
    <circle cx="381" cy="84" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="381" y="88" fill="#3a5a30">✓</text>
    <circle cx="435" cy="84" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="435" y="88" fill="#3a5a30">✓</text>
  </g>

  <g filter="url(#rough2)" font-size="10" fill="#777" text-anchor="middle">
    <text x="138" y="153">1</text>
    <text x="192" y="153">2</text>
    <text x="246" y="153">3</text>
    <text x="300" y="153">4</text>
    <text x="354" y="153">5</text>
    <text x="408" y="153">6</text>
    <text x="462" y="153">7</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="111" y="162" width="162" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.8" stroke-dasharray="6 4" rx="8"/>
    <text x="192" y="182" text-anchor="middle" font-size="10" fill="#2f4f6f">第 1 段：k = 2，长度 3</text>
    <rect x="273" y="162" width="216" height="30" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="6 4" rx="8"/>
    <text x="381" y="182" text-anchor="middle" font-size="10" fill="#3a5a30">第 2 段：k = 3，长度 4</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="115" y="198" width="154" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6"/>
    <text x="192" y="215" text-anchor="middle" font-size="10" fill="#8a6a20">3 = 单个三元组，增益 3</text>
    <rect x="277" y="198" width="102" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6"/>
    <rect x="383" y="198" width="102" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6"/>
    <text x="328" y="215" text-anchor="middle" font-size="10" fill="#8a6a20">混色对 +2</text>
    <text x="434" y="215" text-anchor="middle" font-size="10" fill="#8a6a20">混色对 +2</text>
    <text x="381" y="243" text-anchor="middle" font-size="10" fill="#8a6a20">4 = 2 + 2：两块混色对，增益 4</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="24" y="256" width="552" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="40" y="278" font-size="11.5" fill="#2f4f6f" font-weight="bold">① 上界：一段 k 条边界，增益最多 k + 1</text>
    <text x="40" y="297" font-size="10.5" fill="#3a4a66">p 个混色对吃 p 条、q 个三元组吃 2q 条；块与块不重叠 ⇔ 中间至少夹 1 条边界</text>
    <text x="40" y="315" font-size="10.5" fill="#3a4a66">故 k ≥ (p + 2q) + (p + q − 1)，即 2p + 3q ≤ k + 1：收益上限就是 k + 1</text>
    <text x="40" y="333" font-size="10.5" fill="#3a4a66">这个上界对每段独立成立，且各段的位置互不重叠、互不影响</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="24" y="352" width="552" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="40" y="374" font-size="11.5" fill="#3a5a30" font-weight="bold">② 可达：把 k + 1 拆成若干 2 与 3，顺着位置铺下去</text>
    <text x="40" y="393" font-size="10.5" fill="#3f5a38">2 ↔ 混色对（占一段 2 格），3 ↔ 三元组（占 3 格），块间恰好留 1 条边界</text>
    <text x="40" y="411" font-size="10.5" fill="#3f5a38">拆分整体用满 k 条边界 ⇒ 增益 = k + 1，并且该段的 k + 1 个位置全部被覆盖</text>
    <text x="40" y="429" font-size="10.5" fill="#3f5a38">取等还要求首尾无空隙 ⇒ 每段最优方案数 = k + 1 的 2/3 拆分数 c[k+1]</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="24" y="448" width="552" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
    <text x="40" y="469" font-size="11" fill="#8a6a20" font-weight="bold">所以「剩余纯色位置」与方案无关：位置 i 未被覆盖 ⟺ s[i−1] = s[i] = s[i+1]</text>
    <text x="40" y="488" font-size="10.5" fill="#6b5a30">设剩余 0 有 z 个、1 有 o 个 ⇒ 答案 = 成本 n + Σ(k+1)，方案数 ∏ c[k+1] · Bell(z) · Bell(o)</text>
  </g>
</svg>
