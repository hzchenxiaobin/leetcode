<svg xmlns="http://www.w3.org/2000/svg" width="680" height="424" viewBox="0 0 680 424" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="680" height="424" fill="#fafafa"/>

  <text x="340" y="30" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">状态 = 整除格上的点 (D, M)，顶点值 = g·(A/D)·M</text>

  <text x="300" y="60" font-size="13" fill="#446688" filter="url(#rough2)">D：已除掉的 A 部分</text>
  <text x="40" y="60" font-size="13" fill="#4a7a3a" filter="url(#rough2)">M：已乘上的 B 部分</text>

  <text x="196" y="84" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">1</text>
  <text x="282" y="84" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">2</text>
  <text x="368" y="84" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">4</text>
  <text x="454" y="84" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">8</text>
  <text x="540" y="84" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">16</text>

  <text x="176" y="118" text-anchor="end" font-size="13" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="176" y="172" text-anchor="end" font-size="13" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <text x="176" y="226" text-anchor="end" font-size="13" fill="#4a7a3a" filter="url(#rough2)">9</text>
  <text x="176" y="280" text-anchor="end" font-size="13" fill="#4a7a3a" filter="url(#rough2)">27</text>

  <g filter="url(#rough2)">
    <rect x="196" y="92" width="86" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="239" y="121" text-anchor="middle" font-size="16" fill="#3c6130">16</text>
    <rect x="282" y="92" width="86" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="325" y="121" text-anchor="middle" font-size="16" fill="#33506b">8</text>
    <rect x="368" y="92" width="86" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="411" y="121" text-anchor="middle" font-size="16" fill="#33506b">4</text>
    <rect x="454" y="92" width="86" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="497" y="121" text-anchor="middle" font-size="16" fill="#33506b">2</text>
