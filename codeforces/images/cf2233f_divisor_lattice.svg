    <text x="583" y="229" text-anchor="middle" font-size="16" fill="#33506b">9</text>

    <rect x="196" y="254" width="86" height="46" rx="4" fill="#eceff1" stroke="#9aa4ad" stroke-width="1.2"/>
    <text x="239" y="283" text-anchor="middle" font-size="16" fill="#8b949c">432</text>
    <rect x="282" y="254" width="86" height="46" rx="4" fill="#eceff1" stroke="#9aa4ad" stroke-width="1.2"/>
    <text x="325" y="283" text-anchor="middle" font-size="16" fill="#8b949c">216</text>
    <rect x="368" y="254" width="86" height="46" rx="4" fill="#eceff1" stroke="#9aa4ad" stroke-width="1.2"/>
    <text x="411" y="283" text-anchor="middle" font-size="16" fill="#8b949c">108</text>
