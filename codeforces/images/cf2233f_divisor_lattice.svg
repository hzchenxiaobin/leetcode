    <text x="583" y="283" text-anchor="middle" font-size="16" fill="#8f3b38">27</text>
  </g>

  <path d="M247,124 L317,170" fill="none" stroke="#b85450" stroke-width="2.4" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M333,178 L487,214" fill="none" stroke="#b85450" stroke-width="2.4" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M505,226 L573,272" fill="none" stroke="#b85450" stroke-width="2.4" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)"><rect x="258" y="116" width="24" height="22" rx="6" fill="#ffffff" stroke="#b85450" stroke-width="1.3"/><text x="270" y="132" text-anchor="middle" font-size="13" fill="#b85450">3</text></g>
  <g filter="url(#rough2)"><rect x="398" y="182" width="24" height="22" rx="6" fill="#ffffff" stroke="#b85450" stroke-width="1.3"/><text x="410" y="198" text-anchor="middle" font-size="13" fill="#b85450">4</text></g>
  <g filter="url(#rough2)"><rect x="528" y="234" width="24" height="22" rx="6" fill="#ffffff" stroke="#b85450" stroke-width="1.3"/><text x="540" y="250" text-anchor="middle" font-size="13" fill="#b85450">3</text></g>

  <text x="40" y="336" font-size="13" fill="#666" filter="url(#rough2)">灰格：g·(A/D)·M &gt; n，顶点越界，状态作废</text>
  <text x="40" y="360" font-size="13" fill="#666" filter="url(#rough2)">红箭头：最优路径 16 → 24 → 18 → 27，代价 3 + 4 + 3 = 10</text>
  <text x="40" y="384" font-size="13" fill="#666" filter="url(#rough2)">转移 (D,M) → (Dδ, Mμ)，δ | A/D，μ | B/M，代价 max(δ, μ)</text>
  <text x="40" y="408" font-size="13" fill="#4a7a3a" filter="url(#rough2)">D、M 只增不减 ⇒ 按 D 升序、同 D 内按 M 升序即为拓扑序</text>
</svg>
