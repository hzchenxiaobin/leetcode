    <text x="583" y="121" text-anchor="middle" font-size="16" fill="#33506b">1</text>

    <rect x="196" y="146" width="86" height="46" rx="4" fill="#eceff1" stroke="#9aa4ad" stroke-width="1.2"/>
    <text x="239" y="175" text-anchor="middle" font-size="16" fill="#8b949c">48</text>
    <rect x="282" y="146" width="86" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="325" y="175" text-anchor="middle" font-size="16" fill="#8a6420">24</text>
    <rect x="368" y="146" width="86" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="411" y="175" text-anchor="middle" font-size="16" fill="#33506b">12</text>
    <rect x="454" y="146" width="86" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="497" y="175" text-anchor="middle" font-size="16" fill="#33506b">6</text>
    <rect x="540" y="146" width="86" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="583" y="175" text-anchor="middle" font-size="16" fill="#33506b">3</text>

    <rect x="196" y="200" width="86" height="46" rx="4" fill="#eceff1" stroke="#9aa4ad" stroke-width="1.2"/>
    <text x="239" y="229" text-anchor="middle" font-size="16" fill="#8b949c">144</text>
    <rect x="282" y="200" width="86" height="46" rx="4" fill="#eceff1" stroke="#9aa4ad" stroke-width="1.2"/>
    <text x="325" y="229" text-anchor="middle" font-size="16" fill="#8b949c">72</text>
    <rect x="368" y="200" width="86" height="46" rx="4" fill="#eceff1" stroke="#9aa4ad" stroke-width="1.2"/>
