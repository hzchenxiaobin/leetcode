<svg xmlns="http://www.w3.org/2000/svg" width="840" height="340" viewBox="0 0 840 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="340" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">逐面判断：外侧可见，平面上不可见</text>
  <g filter="url(#rough2)"><rect x="110" y="96" width="260" height="42" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="240" y="123" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">x = 0 面（a₅）</text>
  <text x="410" y="123" text-anchor="start" font-size="13" fill="#2b2b2b" filter="url(#rough2)">x &lt; 0</text>
  <text x="560" y="123" text-anchor="start" font-size="11" fill="#8a4b2a" filter="url(#rough2)">x=0 ⇒ 看不到</text>
  <g filter="url(#rough2)"><rect x="110" y="154" width="260" height="42" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="240" y="181" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">y = y₁ 面（a₂）</text>
  <text x="410" y="181" text-anchor="start" font-size="13" fill="#2b2b2b" filter="url(#rough2)">y &gt; y₁</text>
  <text x="560" y="181" text-anchor="start" font-size="11" fill="#8a4b2a" filter="url(#rough2)"></text>
  <g filter="url(#rough2)"><rect x="110" y="212" width="260" height="42" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="240" y="239" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">z = z₁ 面（a₄）</text>
  <text x="410" y="239" text-anchor="start" font-size="13" fill="#2b2b2b" filter="url(#rough2)">z &gt; z₁</text>
  <text x="560" y="239" text-anchor="start" font-size="11" fill="#8a4b2a" filter="url(#rough2)"></text>
  <text x="420" y="290" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">样例 2：点 (0,0,10)，盒子 (3,2,3) ⇒ 只看到 a₄ = 4</text>
  <g filter="url(#rough2)"><rect x="240" y="306" width="360" height="30" rx="4" fill="#f7fbf4" fill-opacity="0.85" stroke="#a8c99a" stroke-width="1.3"/></g>
  <text x="420" y="326" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3d6b2f" filter="url(#rough2)">答案 = 可见面的 a_i 之和</text>
</svg>
