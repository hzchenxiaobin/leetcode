<svg xmlns="http://www.w3.org/2000/svg" width="700" height="360" viewBox="0 0 700 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="700" height="360" fill="#fafafa"/>
  <text x="350.0" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">201B：4 米一块的停车场与两套坐标</text>
  <path d="M 140.00 46 Q 350.0 52 560.00 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="70" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">每个 4×4 米的小块中心停一辆车：车 (i,j) 的中心是 (4i-2, 4j-2)。</text>
  <text x="60" y="90" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">Yura 只能站在网格线交点上：候选点 (4L, 4M)，0 ≤ L ≤ n，0 ≤ M ≤ m。</text>
  <line x1="120" y1="140" x2="228" y2="140" stroke="#9aa8b8" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="120" y1="194" x2="228" y2="194" stroke="#9aa8b8" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="120" y1="248" x2="228" y2="248" stroke="#9aa8b8" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="120" y1="140" x2="120" y2="248" stroke="#9aa8b8" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="174" y1="140" x2="174" y2="248" stroke="#9aa8b8" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="228" y1="140" x2="228" y2="248" stroke="#9aa8b8" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="147.0" cy="167.0" r="9" fill="#f6e3a8" stroke="#c08a30" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="201.0" cy="167.0" r="9" fill="#f6e3a8" stroke="#c08a30" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="147.0" cy="221.0" r="9" fill="#f6e3a8" stroke="#c08a30" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="201.0" cy="221.0" r="9" fill="#f6e3a8" stroke="#c08a30" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="120" cy="140" r="3.4" fill="#446688" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="174" cy="140" r="3.4" fill="#446688" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="228" cy="140" r="3.4" fill="#446688" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="120" cy="194" r="3.4" fill="#446688" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="174" cy="194" r="3.4" fill="#446688" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="228" cy="194" r="3.4" fill="#446688" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="120" cy="248" r="3.4" fill="#446688" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="174" cy="248" r="3.4" fill="#446688" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="228" cy="248" r="3.4" fill="#446688" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="147.0" y="151.0" text-anchor="middle" font-size="9.5" fill="#8a6015" filter="url(#rough2)">车(1,1)</text>
  <text x="114" y="270" text-anchor="start" font-size="9.5" fill="#33506e" filter="url(#rough2)">(0,0)</text>
  <text x="214" y="130" text-anchor="start" font-size="9.5" fill="#33506e" filter="url(#rough2)">(n,m) 方向</text>
  <text x="330" y="140" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">点到车心的坐标差（乘 4 的整数形态）：</text>
  <text x="330" y="164" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">dx = 4L - (4i-2) = 4L - 4i + 2 ∈ 偶数</text>
  <text x="330" y="186" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">dy = 4M - 4j + 2</text>
  <text x="330" y="214" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">单辆车耗时 = c·(dx² + dy²)</text>
  <rect x="60" y="300" width="560" height="44" rx="9" fill="#fdeef1" stroke="#c0708a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="318" text-anchor="start" font-size="11" fill="#8a3a52" filter="url(#rough2)">n, m ≤ 1000：候选点最多 1001×1001 ≈ 10⁶ 个，逐个点重算 10⁶ 辆车 = 10¹²，行不通。</text>
</svg>
