<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="300" fill="#fafafa"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">196B：BFS 用绝对坐标，模格只记录“第一次的绝对坐标”</text>
  <path d="M 135.56000000000014 46 Q 380.0 52 624.4399999999998 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="110.0" y="46.0" width="540.0" height="38.0" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="130.0" y="71.0" text-anchor="start" font-size="11.2" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">把 S 的绝对坐标入队</text>
  <path d="M 380.0 85.0 L 380.0 93.0" stroke="#446688" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="110.0" y="94.0" width="540.0" height="38.0" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="130.0" y="119.0" text-anchor="start" font-size="11.2" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">取队首 (x,y)，枚举四个邻居</text>
  <path d="M 380.0 133.0 L 380.0 141.0" stroke="#446688" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="110.0" y="142.0" width="540.0" height="38.0" rx="8" fill="#fff3d6" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="130.0" y="167.0" text-anchor="start" font-size="11.2" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">邻居模格未访问？记录它的绝对坐标并入队</text>
  <path d="M 380.0 181.0 L 380.0 189.0" stroke="#446688" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="110.0" y="190.0" width="540.0" height="38.0" rx="8" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="130.0" y="215.0" text-anchor="start" font-size="11.2" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">已访问但绝对坐标不同？⇒ 输出 Yes</text>
  <path d="M 380.0 229.0 L 380.0 237.0" stroke="#446688" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="110.0" y="238.0" width="540.0" height="38.0" rx="8" fill="#fdf0ef" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="130.0" y="263.0" text-anchor="start" font-size="11.2" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">队列空 ⇒ No</text>
</svg>
