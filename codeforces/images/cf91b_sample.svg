<svg xmlns="http://www.w3.org/2000/svg" width="880" height="336" viewBox="0 0 880 336"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="91"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="336" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1 的逐元素答案</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">10 8 5 3 50 45 → 2 1 0 -1 0 -1</text>
  <g filter="url(#rough2)"><rect x="140" y="104" width="70" height="44" rx="3" fill="#cfe0f5" fill-opacity="0.55" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="175.0" y="132" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">10</text>
  <text x="175.0" y="176" text-anchor="middle" font-size="14" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="175.0" y="96" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">i=1</text>
  <g filter="url(#rough2)"><rect x="220" y="104" width="70" height="44" rx="3" fill="#cfe0f5" fill-opacity="0.55" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="255.0" y="132" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">8</text>
  <text x="255.0" y="176" text-anchor="middle" font-size="14" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="255.0" y="96" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">i=2</text>
  <g filter="url(#rough2)"><rect x="300" y="104" width="70" height="44" rx="3" fill="#cfe0f5" fill-opacity="0.55" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="335.0" y="132" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <text x="335.0" y="176" text-anchor="middle" font-size="14" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="335.0" y="96" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">i=3</text>
  <g filter="url(#rough2)"><rect x="380" y="104" width="70" height="44" rx="3" fill="#cfe0f5" fill-opacity="0.55" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="415.0" y="132" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="415.0" y="176" text-anchor="middle" font-size="14" fill="#999999" font-weight="bold" filter="url(#rough2)">-1</text>
  <text x="415.0" y="96" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">i=4</text>
  <g filter="url(#rough2)"><rect x="460" y="104" width="70" height="44" rx="3" fill="#cfe0f5" fill-opacity="0.55" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="495.0" y="132" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">50</text>
  <text x="495.0" y="176" text-anchor="middle" font-size="14" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="495.0" y="96" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">i=5</text>
  <g filter="url(#rough2)"><rect x="540" y="104" width="70" height="44" rx="3" fill="#cfe0f5" fill-opacity="0.55" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="575.0" y="132" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">45</text>
  <text x="575.0" y="176" text-anchor="middle" font-size="14" fill="#999999" font-weight="bold" filter="url(#rough2)">-1</text>
  <text x="575.0" y="96" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">i=6</text>
  <text x="440" y="222" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">第 1 个：最远的更年轻者是 3（位置 4），中间隔 8、5 两个 → 2</text>
  <text x="440" y="250" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">第 4 个（值 3）：右边没有更年轻的 → −1；第 5 个（50）：最远更年轻者是 45（相邻）→ 0</text>
</svg>
