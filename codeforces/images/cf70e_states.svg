<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="43"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2b2b2b"/>
    </marker>
  </defs>

  <rect width="760" height="400" fill="#fafafa"/>
  <text x="380" y="30" text-anchor="middle" font-size="17.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">三种状态：外部中心 c 负责 v（E）、内部中心 c 负责 v（H）、子树自给自足（G）</text>
  <path d="M 70 40 Q 380 46 690 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 左：树示意 -->
  <g filter="url(#rough2)" stroke="#8a8a8a" stroke-width="1.6" fill="none">
    <ellipse cx="250" cy="238" rx="150" ry="92" stroke="#446688" stroke-width="1.4" stroke-dasharray="6 5"/>
    <line x1="250" y1="220" x2="160" y2="288"/>
    <line x1="250" y1="220" x2="250" y2="296"/>
    <line x1="250" y1="220" x2="340" y2="288"/>
    <line x1="250" y1="220" x2="250" y2="124" stroke="#b85450" stroke-width="2.2" stroke-dasharray="6 4"/>
  </g>
  <g filter="url(#rough2)">
    <circle cx="250" cy="220" r="15" fill="#d7ecd9" stroke="#2f7a3a" stroke-width="1.6"/>
    <circle cx="160" cy="288" r="13" fill="#eef2f7" stroke="#446688" stroke-width="1.4"/>
    <circle cx="250" cy="296" r="13" fill="#eef2f7" stroke="#446688" stroke-width="1.4"/>
    <circle cx="340" cy="288" r="13" fill="#eef2f7" stroke="#446688" stroke-width="1.4"/>
    <circle cx="250" cy="114" r="14" fill="#fdecea" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <g font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)" text-anchor="middle">
    <text x="250" y="225">v</text>
    <text x="160" y="293">u₁</text>
    <text x="250" y="301">u₂</text>
    <text x="340" y="293">u₃</text>
    <text x="250" y="119" fill="#8c2f2b">c</text>
  </g>
  <text x="250" y="170" text-anchor="middle" font-size="11" fill="#8c2f2b" filter="url(#rough2)">外部中心（不在子树 v 内）</text>
  <text x="232" y="178" text-anchor="end" font-size="11" fill="#2f4a66" filter="url(#rough2)">子树 v（虚线椭圆）</text>

  <!-- 右上：E -->
  <rect x="430" y="56" width="300" height="86" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="444" y="78" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">E[v][c]，c 在子树外</text>
  <text x="444" y="100" font-size="11.3" fill="#2f4a66" filter="url(#rough2)">E = d[dist(v,c)] + Σ min(E[u][c], G[u])</text>
  <text x="444" y="120" font-size="10.8" fill="#2f4a66" filter="url(#rough2)">c 的开办费 k 在子树外结算，这里不付</text>
  <text x="444" y="136" font-size="10.8" fill="#2f4a66" filter="url(#rough2)">每个孩子要么也用 c，要么自己开中心</text>

  <!-- 右中：H（加高，公式拆成两行） -->
  <rect x="430" y="150" width="300" height="102" rx="9" fill="#d7ecd9" stroke="#2f7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="444" y="172" font-size="12.5" font-weight="bold" fill="#1f5226" filter="url(#rough2)">H[v][c]，c 在子树内</text>
  <text x="444" y="194" font-size="11.3" fill="#1f5226" filter="url(#rough2)">H = cost(v,c) + Σ min(E[u][c], G[u])</text>
  <text x="480" y="214" font-size="11.3" fill="#1f5226" filter="url(#rough2)">+ H[u*][c]　（沿路径递归）</text>
  <text x="444" y="234" font-size="10.6" fill="#1f5226" filter="url(#rough2)">u* 是包含 c 的孩子；k 只在 H[c][c] 计一次</text>

  <!-- 右下：G -->
  <rect x="430" y="260" width="300" height="66" rx="9" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="444" y="282" font-size="12.3" font-weight="bold" fill="#8a6015" filter="url(#rough2)">G[v] = min over c 在子树内 H[v][c]</text>
  <text x="444" y="303" font-size="10.8" fill="#8a6015" filter="url(#rough2)">子树完全自给自足时的最小代价</text>
  <text x="444" y="320" font-size="10.8" fill="#8a6015" filter="url(#rough2)">c = v 时 cost 为 k，其余为 d[dist]</text>

  <!-- 左下：答案 -->
  <rect x="40" y="330" width="330" height="54" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="352" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">答案 = G[根]：根必须由树内某个中心负责</text>
  <text x="56" y="372" font-size="10.8" fill="#7a5a1b" filter="url(#rough2)">后序计算：先算所有孩子，再算父亲</text>
</svg>
