<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="360" fill="#fafafa"/>
  <text x="380.0" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">201B：横纵坐标完全分离</text>
  <path d="M 152.00 46 Q 380.0 52 608.00 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60" y="86" width="180" height="110" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="104" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">读入 c[i][j]</text>
  <text x="74" y="126" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">行和 R_i = Σ_j c</text>
  <text x="74" y="148" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">列和 C_j = Σ_i c</text>
  <text x="74" y="170" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">（先对每辆车算一次）</text>
  <rect x="290" y="66" width="210" height="72" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="304" y="84" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">f(L) = Σ_i R_i (4L-4i+2)²</text>
  <text x="304" y="106" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">只依赖 L</text>
  <rect x="290" y="150" width="210" height="72" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="304" y="168" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">g(M) = Σ_j C_j (4M-4j+2)²</text>
  <text x="304" y="190" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">只依赖 M</text>
  <rect x="540" y="104" width="150" height="84" rx="9" fill="#fdeef1" stroke="#c0708a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="554" y="122" text-anchor="start" font-size="11" fill="#8a3a52" filter="url(#rough2)">答案 =</text>
  <text x="554" y="144" text-anchor="start" font-size="11" fill="#8a3a52" filter="url(#rough2)">min f + min g</text>
  <text x="554" y="166" text-anchor="start" font-size="11" fill="#8a3a52" filter="url(#rough2)">(L*, M*) 各自取</text>
  <path d="M 244 122 L 286 102" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 244 150 L 286 184" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 504 102 L 536 132" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 504 186 L 536 162" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="60" y="216" width="630" height="70" rx="9" fill="#f2f2f2" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="234" text-anchor="start" font-size="11" fill="#3d3d3d" filter="url(#rough2)">因为 dx 只与 L 和 i 有关、dy 只与 M 和 j 有关，总时间对 L 与 M 完全可分离；</text>
  <text x="74" y="256" text-anchor="start" font-size="11" fill="#3d3d3d" filter="url(#rough2)">横纵最小化互不影响，两个一维问题各自扫 0..n / 0..m 即可。</text>
  <text x="60" y="318" text-anchor="start" font-size="10.5" fill="#33506e" filter="url(#rough2)">展开后 f(L) = 16(S2 - 2L·S1 + L²·S0) + 16(L·S0 - S1) + 4S0，前缀和 O(1) 求值。</text>
</svg>
