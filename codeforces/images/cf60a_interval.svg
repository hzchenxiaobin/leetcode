<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="60"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="la" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="lb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="360" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每条提示都只是砍掉一段：剩下的必是连续区间</text>
  <path d="M 150 42 Q 360 48 570 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 盒子 -->
  <g filter="url(#rough2)">
    <rect x="60" y="150" width="60" height="46" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <rect x="132" y="150" width="60" height="46" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <rect x="204" y="150" width="60" height="46" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <rect x="276" y="150" width="60" height="46" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <rect x="348" y="150" width="60" height="46" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <rect x="420" y="150" width="60" height="46" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <rect x="492" y="150" width="60" height="46" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="90" y="180" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="162" y="180" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="234" y="180" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="306" y="180" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="378" y="180" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <text x="450" y="180" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">6</text>
  <text x="522" y="180" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">7</text>

  <!-- 提示：To the left of 5 -->
  <path d="M 300 128 L 180 146" stroke="#b85450" stroke-width="1.8" marker-end="url(#la)" filter="url(#rough2)"/>
  <text x="300" y="120" font-size="12" font-weight="bold" fill="#8c3a37" filter="url(#rough2)">To the left of 5 ⇒ 只可能在 1..4</text>

  <!-- 提示：To the right of 2 -->
  <path d="M 210 216 L 300 198" stroke="#446688" stroke-width="1.8" marker-end="url(#lb)" filter="url(#rough2)"/>
  <text x="214" y="240" font-size="12" font-weight="bold" fill="#2b4a68" filter="url(#rough2)">To the right of 2 ⇒ 只可能在 3..7</text>

  <!-- 交集 -->
  <rect x="200" y="142" width="130" height="62" fill="none" stroke="#4a7a3a" stroke-width="2.4"
        stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="265" y="276" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">交集 [3, 4]：两种可能，答案 2</text>

  <!-- 结论 -->
  <rect x="46" y="296" width="628" height="48" rx="8" fill="#f4f8ee" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="318" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">维护 lo（最小可能）与 hi（最大可能）：</text>
  <text x="360" y="336" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">left i → hi = min(hi, i−1)；right i → lo = max(lo, i+1)；lo &gt; hi 时输出 −1</text>
</svg>
