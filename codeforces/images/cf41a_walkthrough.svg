<svg xmlns="http://www.w3.org/2000/svg" width="720" height="270" viewBox="0 0 720 270"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="411"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="270" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1：code → edoc</text>
  <g font-family="monospace" font-size="24" filter="url(#rough2)">
    <text x="120" y="100" fill="#2f4a66">c</text><text x="170" y="100" fill="#2f4a66">o</text><text x="220" y="100" fill="#2f4a66">d</text><text x="270" y="100" fill="#2f4a66">e</text>
    <text x="120" y="160" fill="#2f5223">e</text><text x="170" y="160" fill="#2f5223">d</text><text x="220" y="160" fill="#2f5223">o</text><text x="270" y="160" fill="#2f5223">c</text>
  </g>
  <text x="320" y="100" font-size="12" fill="#666" filter="url(#rough2)">s</text>
  <text x="320" y="160" font-size="12" fill="#666" filter="url(#rough2)">t = reverse(s)</text>
  <g stroke="#c9ced6" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)">
    <line x1="120" y1="112" x2="120" y2="148"/><line x1="170" y1="112" x2="170" y2="148"/>
    <line x1="220" y1="112" x2="220" y2="148"/><line x1="270" y1="112" x2="270" y2="148"/>
  </g>
  <rect x="100" y="200" width="520" height="48" rx="9" fill="#eef4ec" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="116" y="228" font-size="13" fill="#2f5223" filter="url(#rough2)">逐位相同 ⇒ 输出 YES。</text>
</svg>
