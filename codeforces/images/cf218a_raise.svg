<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="800" height="430" fill="#fafafa"/>
  <text x="400" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">Bolek 只抬高被选中的山峰，山谷高度不变</text>
  <text x="400" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">最终图 r = 初始图 y 的若干山峰各 +1；还原就是把它们各 −1</text>
  <text x="231.0" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#3d6b2f" filter="url(#rough2)">初始图 y（未知）</text>
  <g filter="url(#rough2)"><path d=" M 116.0,300.0 L 162.0,162.0 L 208.0,254.0 L 254.0,116.0 L 300.0,300.0 L 346.0,162.0 L 392.0,254.0" fill="none" stroke="#4a7a3a" stroke-width="2.4" stroke-linejoin="round"/></g>
  <g filter="url(#rough2)"><circle cx="116" cy="300" r="5.5" fill="#d7ecd0" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><circle cx="162" cy="162" r="5.5" fill="#d7ecd0" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><circle cx="208" cy="254" r="5.5" fill="#d7ecd0" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><circle cx="254" cy="116" r="5.5" fill="#d7ecd0" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><circle cx="300" cy="300" r="5.5" fill="#d7ecd0" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><circle cx="346" cy="162" r="5.5" fill="#d7ecd0" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><circle cx="392" cy="254" r="5.5" fill="#d7ecd0" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="231.0" y="345" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">峰 2、峰 4、峰 6 是山峰</text>
  <g filter="url(#rough2)"><line x1="241.0" y1="250" x2="301.0" y2="250" stroke="#a0522d" stroke-width="2" marker-end="url(#arrr)"/></g>
  <text x="271.0" y="238" text-anchor="middle" font-size="12" fill="#a0522d" filter="url(#rough2)">抬 2 个峰</text>
  <text x="681.0" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a4b2a" filter="url(#rough2)">最终图 r（给定）</text>
  <g filter="url(#rough2)"><path d=" M 566.0,300.0 L 612.0,116.0 L 658.0,254.0 L 704.0,70.0 L 750.0,300.0 L 796.0,162.0 L 842.0,254.0" fill="none" stroke="#a0522d" stroke-width="2.4" stroke-linejoin="round"/></g>
  <g filter="url(#rough2)"><circle cx="566" cy="300" r="5.5" fill="#f6d9d7" fill-opacity="0.9" stroke="#a0522d" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><circle cx="612" cy="116" r="5.5" fill="#f6d9d7" fill-opacity="0.9" stroke="#a0522d" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><circle cx="658" cy="254" r="5.5" fill="#f6d9d7" fill-opacity="0.9" stroke="#a0522d" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><circle cx="704" cy="70" r="5.5" fill="#f6d9d7" fill-opacity="0.9" stroke="#a0522d" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><circle cx="750" cy="300" r="5.5" fill="#f6d9d7" fill-opacity="0.9" stroke="#a0522d" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><circle cx="796" cy="162" r="5.5" fill="#f6d9d7" fill-opacity="0.9" stroke="#a0522d" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><circle cx="842" cy="254" r="5.5" fill="#f6d9d7" fill-opacity="0.9" stroke="#a0522d" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><circle cx="612" cy="116" r="11" fill="none" fill-opacity="0.9" stroke="#a0522d" stroke-width="1.6"/></g>
  <g filter="url(#rough2)"><circle cx="704" cy="70" r="11" fill="none" fill-opacity="0.9" stroke="#a0522d" stroke-width="1.6"/></g>
  <text x="681.0" y="345" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">被抬高的两个峰（红圈）比初始高 1</text>
  <text x="400" y="392" text-anchor="middle" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">山谷（奇数位置）在两幅图中完全一样，只有山峰高度可能差 1</text>
