<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="157"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="800" height="400" fill="#fafafa"/>

  <text x="400" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两个样例：周期 3 与周期 7</text>
  <path d="M 160 39 Q 400 45 640 39" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="40" y="72" text-anchor="start" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">k = 2：a(n) = a(n−1) + a(n−2)</text>
  <text x="40" y="96" text-anchor="start" font-size="12" fill="#446688" filter="url(#rough2)">c = (1 1)</text>
  <text x="40" y="116" text-anchor="start" font-size="12" fill="#446688" filter="url(#rough2)">a = (1 0)</text>
  <rect x="300" y="84" width="28" height="32" rx="8" fill="#dcebfb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="314" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="330" y="84" width="28" height="32" rx="8" fill="#dcebfb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="344" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">0</text>
  <rect x="360" y="84" width="28" height="32" rx="8" fill="#dcebfb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="374" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="390" y="84" width="28" height="32" rx="8" fill="#f4f4f4" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="404" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="420" y="84" width="28" height="32" rx="8" fill="#f4f4f4" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="434" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">0</text>
  <rect x="450" y="84" width="28" height="32" rx="8" fill="#f4f4f4" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="464" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <line x1="300" y1="124" x2="386" y2="124" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="345" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">一个周期 = 3 个</text>
  <text x="400" y="106" text-anchor="start" font-size="15" fill="#6a6a6a" filter="url(#rough2)">…</text>
  <text x="40" y="192" text-anchor="start" font-size="12.5" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">k = 3：a(n) = a(n−2) + a(n−3)</text>
  <text x="40" y="216" text-anchor="start" font-size="12" fill="#3f6b4a" filter="url(#rough2)">c = (0 1 1)</text>
  <text x="40" y="236" text-anchor="start" font-size="12" fill="#3f6b4a" filter="url(#rough2)">a = (1 1 1)</text>
  <rect x="300" y="204" width="28" height="32" rx="8" fill="#e2f1e6" stroke="#3f6b4a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="314" y="226" text-anchor="middle" font-size="13" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">1</text>
  <rect x="330" y="204" width="28" height="32" rx="8" fill="#e2f1e6" stroke="#3f6b4a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="344" y="226" text-anchor="middle" font-size="13" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">1</text>
  <rect x="360" y="204" width="28" height="32" rx="8" fill="#e2f1e6" stroke="#3f6b4a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="374" y="226" text-anchor="middle" font-size="13" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">1</text>
  <rect x="390" y="204" width="28" height="32" rx="8" fill="#e2f1e6" stroke="#3f6b4a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="404" y="226" text-anchor="middle" font-size="13" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">0</text>
  <rect x="420" y="204" width="28" height="32" rx="8" fill="#e2f1e6" stroke="#3f6b4a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="434" y="226" text-anchor="middle" font-size="13" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">0</text>
  <rect x="450" y="204" width="28" height="32" rx="8" fill="#e2f1e6" stroke="#3f6b4a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="464" y="226" text-anchor="middle" font-size="13" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">1</text>
  <rect x="480" y="204" width="28" height="32" rx="8" fill="#e2f1e6" stroke="#3f6b4a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="494" y="226" text-anchor="middle" font-size="13" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">0</text>
  <rect x="510" y="204" width="28" height="32" rx="8" fill="#f4f4f4" stroke="#3f6b4a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="524" y="226" text-anchor="middle" font-size="13" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">1</text>
  <rect x="540" y="204" width="28" height="32" rx="8" fill="#f4f4f4" stroke="#3f6b4a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="554" y="226" text-anchor="middle" font-size="13" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">1</text>
  <rect x="570" y="204" width="28" height="32" rx="8" fill="#f4f4f4" stroke="#3f6b4a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="584" y="226" text-anchor="middle" font-size="13" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">1</text>
  <rect x="600" y="204" width="28" height="32" rx="8" fill="#f4f4f4" stroke="#3f6b4a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="614" y="226" text-anchor="middle" font-size="13" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">0</text>
  <rect x="630" y="204" width="28" height="32" rx="8" fill="#f4f4f4" stroke="#3f6b4a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="644" y="226" text-anchor="middle" font-size="13" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">0</text>
  <rect x="660" y="204" width="28" height="32" rx="8" fill="#f4f4f4" stroke="#3f6b4a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="674" y="226" text-anchor="middle" font-size="13" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">1</text>
  <rect x="690" y="204" width="28" height="32" rx="8" fill="#f4f4f4" stroke="#3f6b4a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="704" y="226" text-anchor="middle" font-size="13" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">0</text>
  <line x1="300" y1="244" x2="506" y2="244" stroke="#3f6b4a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="405" y="192" text-anchor="middle" font-size="12" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">一个周期 = 7 个</text>
  <text x="520" y="226" text-anchor="start" font-size="15" fill="#6a6a6a" filter="url(#rough2)">…</text>
  <rect x="40" y="300" width="660" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="324" text-anchor="start" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">2^2−1 = 3、2^3−1 = 7：非零状态恰好各走一遍，所以周期取到理论上界。</text>
  <text x="56" y="346" text-anchor="start" font-size="12" fill="#7a5a1b" filter="url(#rough2)">本题的构造就是把 k ≤ 50 的本原多项式全部找出来，每个 k 输出一组系数与初值。</text>
  <text x="40" y="380" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">注意样例给的初值 (1,1,1) 与本文代码的 (1,0,0) 不同，但周期都是 7——周期只由系数决定。</text>
</svg>
