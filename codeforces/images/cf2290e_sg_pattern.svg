  <path d="M 141 194 L 141 202 L 263 202 L 263 194" stroke="#b85450" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="273" y="202" font-size="12" fill="#b85450">← 恰好隔 k+1 = 3 格</text>
  <text x="350" y="272" text-anchor="middle" font-size="13" fill="#333">窗口 [i−k, i−1] 只有 k 个位置，而 ≡1 (mod k+1) 每 k+1 格才出现一次</text>
  <text x="350" y="300" text-anchor="middle" font-size="13" fill="#333">所以窗口异或只能是 0 或 1：g(i) = 1 − (窗口里 1 的个数 mod 2)</text>
  <text x="350" y="330" text-anchor="middle" font-size="13" fill="#4a7a3a">有贡献的下标：1, 1+(k+1), 1+2(k+1), …（k=2 时是 1,4,7,10）</text>
  <text x="350" y="362" text-anchor="middle" font-size="13" fill="#b85450">答案 = 这些下标上 a_i 之和的奇偶性：奇 → Alice，偶 → Bob</text>
