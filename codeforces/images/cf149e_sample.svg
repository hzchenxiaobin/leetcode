<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="425"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="250" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">样例：ABBA 可见、BAAB 重叠</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">s = A B C B A B A</text>
  <text x="450" y="104" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">ABBA = AB + BA：AB 在 s[0..1]，BA 在 s[3..4] ⇒ 不重叠 ✓</text>
  <text x="450" y="138" text-anchor="middle" font-size="12" fill="#8a2b28" filter="url(#rough2)">BAAB = BA + AB：BA 最早结束于 s[4]，AB 最晚开始于 s[4] ⇒ 重叠 ✗</text>
  <text x="450" y="180" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 1</text>
</svg>
