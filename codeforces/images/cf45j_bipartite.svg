<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="307"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="350" fill="#fafafa"/>
  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">棋盘染色：连续整数必须同色</text>
  <path d="M 140 40 Q 380 46 620 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="120" y="80" width="90" height="70" fill="#eef4fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="210" y="80" width="90" height="70" fill="#fbe3c8" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="300" y="80" width="90" height="70" fill="#eef4fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="120" y="150" width="90" height="70" fill="#fbe3c8" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="210" y="150" width="90" height="70" fill="#eef4fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="300" y="150" width="90" height="70" fill="#fbe3c8" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="120" y="262" font-size="12" fill="#2b2b2b" filter="url(#rough2)">相邻格必然异色 ⇒ 差为 1 的两个数不能相邻 ⇒ 连续对 (v,v+1) 必须同色。</text>
  <text x="120" y="292" font-size="12" fill="#8a2b28" filter="url(#rough2)">完全二部图（1×2、1×3、2×2）中每个黑格都挨着每个白格 ⇒ 无解。</text>
  <text x="120" y="322" font-size="11.5" fill="#555555" filter="url(#rough2)">其余网格都能构造：小半放白格、大半放黑格，相邻差至少 2。</text>

</svg>
