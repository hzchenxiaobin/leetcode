<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="153"/>
    <feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></defs>
  <rect width="700" height="300" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">累加器一次扫描</text>
  <path d="M 150 40 Q 350 46 550 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="62" width="580" height="48" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="92" font-size="13" fill="#22314a" filter="url(#rough2)">x ← 0；对每条语句：if 含 "++" 则 x ← x+1 else x ← x−1</text>
  <g filter="url(#rough2)"><rect x="60" y="126" width="580" height="48" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="76" y="156" font-size="13" fill="#8a6015" filter="url(#rough2)">最后输出 x。复杂度 O(n)，空间 O(1)。</text>
  <g filter="url(#rough2)"><rect x="60" y="190" width="580" height="80" rx="8" fill="#fbeeee" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="76" y="214" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">易错 1：用 strstr 判断时要判 "++"（两字符），不能只看首字符——"X++" 首字符是 X。</text>
  <text x="76" y="238" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">易错 2：x 可能为负，用 int 即可（n ≤ 150）。</text>
  <text x="76" y="260" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">易错 3：语句读入用 %s，避免 %c 吃掉换行。</text>
</svg>
