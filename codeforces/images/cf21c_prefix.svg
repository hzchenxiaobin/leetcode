<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">三段和相等 ⟺ 前缀和命中 T 与 2T</text>
  <path d="M 130 42 Q 360 48 590 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 数组 -->
  <g filter="url(#rough2)">
    <rect x="110" y="96" width="80" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="190" y="96" width="80" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="270" y="96" width="80" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="350" y="96" width="80" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <g font-size="16" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">
    <text x="150" y="130">1</text><text x="230" y="130">2</text>
    <text x="310" y="130">3</text><text x="390" y="130">3</text>
  </g>

  <!-- 切点 -->
  <line x1="270" y1="80" x2="270" y2="210" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <line x1="350" y1="80" x2="350" y2="210" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="270" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#a33a36" filter="url(#rough2)">i = 2</text>
  <text x="350" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#a33a36" filter="url(#rough2)">j = 3</text>

  <!-- 前缀 -->
  <g font-size="11" text-anchor="middle" fill="#555" filter="url(#rough2)">
    <text x="110" y="182">0</text><text x="190" y="182">1</text><text x="270" y="182">3</text>
    <text x="350" y="182">6</text><text x="430" y="182">9</text>
  </g>
  <text x="110" y="166" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">pref:</text>
  <circle cx="270" cy="178" r="10" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="350" cy="178" r="10" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>

  <!-- 三段 -->
  <g stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)">
    <path d="M 110 210 L 110 222 L 270 222 L 270 210"/>
    <path d="M 270 210 L 270 222 L 350 222 L 350 210"/>
    <path d="M 350 210 L 350 222 L 430 222 L 430 210"/>
  </g>
  <g font-size="11.5" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">
    <text x="190" y="244">和 = 3 = T</text>
    <text x="310" y="244">和 = 3 = T</text>
    <text x="390" y="244">和 = 3 = T</text>
  </g>

  <rect x="40" y="270" width="640" height="110" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <g font-size="12" fill="#7a5a1b" filter="url(#rough2)">
    <text x="56" y="298">设总和 S、T = S/3（S 不能被 3 整除直接输出 0）。三段和分别是 pref[i]、pref[j]−pref[i]、S−pref[j]。</text>
    <text x="56" y="326">三段都等于 T ⟺ pref[i] = T 且 pref[j] = 2T；再要求 1 ≤ i &lt; j ≤ n−1（三段都非空）。</text>
    <text x="56" y="354">图中 i=2、j=3：pref[2]=3=T，pref[3]=6=2T，所以 (1,2,3,3) 只有 1 种切法。</text>
  </g>
</svg>
