<svg xmlns="http://www.w3.org/2000/svg" width="720" height="424" viewBox="0 0 720 424"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="720" height="424" fill="#fafafa"/>
  <text x="360.0" y="33" font-size="20" font-weight="bold" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">扫描样例 2：栈里只存“每张未闭合表的格子数”</text>
  <path d="M 234 44 Q 360.0 50 486 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="36" y="78" font-size="12" font-weight="bold" fill="#2b2b2b" text-anchor="start" filter="url(#rough2)">读到的记号</text>
  <text x="240" y="78" font-size="12" font-weight="bold" fill="#2b2b2b" text-anchor="start" filter="url(#rough2)">动作</text>
  <text x="470" y="78" font-size="12" font-weight="bold" fill="#2b2b2b" text-anchor="start" filter="url(#rough2)">栈（自底向顶）</text>
  <rect x="26" y="80" width="668" height="34" rx="5" fill="#f3f6fa" stroke="#c9d4e0" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="36" y="102" font-size="11.5" font-weight="normal" fill="#22303f" text-anchor="start" filter="url(#rough2)">&lt;table&gt;（根）</text>
  <text x="240" y="102" font-size="11.5" font-weight="normal" fill="#555" text-anchor="start" filter="url(#rough2)">压入 0</text>
  <text x="470" y="102" font-size="11.5" font-weight="normal" fill="#555" text-anchor="start" filter="url(#rough2)">[0]</text>
  <text x="36" y="138" font-size="11.5" font-weight="normal" fill="#22303f" text-anchor="start" filter="url(#rough2)">&lt;tr&gt;</text>
  <text x="240" y="138" font-size="11.5" font-weight="normal" fill="#555" text-anchor="start" filter="url(#rough2)">忽略：本题不需要行信息</text>
  <text x="470" y="138" font-size="11.5" font-weight="normal" fill="#555" text-anchor="start" filter="url(#rough2)">[0]</text>
  <rect x="26" y="152" width="668" height="34" rx="5" fill="#f3f6fa" stroke="#c9d4e0" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="36" y="174" font-size="11.5" font-weight="normal" fill="#22303f" text-anchor="start" filter="url(#rough2)">&lt;td&gt;（外层唯一格）</text>
  <text x="240" y="174" font-size="11.5" font-weight="normal" fill="#555" text-anchor="start" filter="url(#rough2)">栈顶 +1</text>
  <text x="470" y="174" font-size="11.5" font-weight="normal" fill="#555" text-anchor="start" filter="url(#rough2)">[1]</text>
  <text x="36" y="210" font-size="11.5" font-weight="normal" fill="#22303f" text-anchor="start" filter="url(#rough2)">&lt;table&gt;（内层）</text>
  <text x="240" y="210" font-size="11.5" font-weight="normal" fill="#555" text-anchor="start" filter="url(#rough2)">压入 0</text>
  <text x="470" y="210" font-size="11.5" font-weight="normal" fill="#555" text-anchor="start" filter="url(#rough2)">[1, 0]</text>
  <rect x="26" y="224" width="668" height="34" rx="5" fill="#f3f6fa" stroke="#c9d4e0" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="36" y="246" font-size="11.5" font-weight="normal" fill="#22303f" text-anchor="start" filter="url(#rough2)">&lt;td&gt;（内层第 1 格）</text>
  <text x="240" y="246" font-size="11.5" font-weight="normal" fill="#555" text-anchor="start" filter="url(#rough2)">栈顶 +1</text>
  <text x="470" y="246" font-size="11.5" font-weight="normal" fill="#555" text-anchor="start" filter="url(#rough2)">[1, 1]</text>
  <text x="36" y="282" font-size="11.5" font-weight="normal" fill="#22303f" text-anchor="start" filter="url(#rough2)">&lt;/table&gt;（内层）</text>
  <text x="240" y="282" font-size="11.5" font-weight="normal" fill="#555" text-anchor="start" filter="url(#rough2)">先记录 4，再弹出</text>
  <text x="470" y="282" font-size="11.5" font-weight="normal" fill="#2f5223" text-anchor="start" filter="url(#rough2)">[1]    → 尺寸 4</text>
  <rect x="26" y="296" width="668" height="34" rx="5" fill="#f3f6fa" stroke="#c9d4e0" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="36" y="318" font-size="11.5" font-weight="normal" fill="#22303f" text-anchor="start" filter="url(#rough2)">&lt;/td&gt; &lt;/tr&gt;</text>
  <text x="240" y="318" font-size="11.5" font-weight="normal" fill="#555" text-anchor="start" filter="url(#rough2)">忽略</text>
  <text x="470" y="318" font-size="11.5" font-weight="normal" fill="#555" text-anchor="start" filter="url(#rough2)">[1]</text>
  <text x="36" y="354" font-size="11.5" font-weight="normal" fill="#22303f" text-anchor="start" filter="url(#rough2)">&lt;/table&gt;（根）</text>
  <text x="240" y="354" font-size="11.5" font-weight="normal" fill="#555" text-anchor="start" filter="url(#rough2)">先记录 1，再弹出</text>
  <text x="470" y="354" font-size="11.5" font-weight="normal" fill="#2f5223" text-anchor="start" filter="url(#rough2)">[]     → 尺寸 1</text>
  <rect x="26" y="388" width="668" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="360" y="406" font-size="12" font-weight="bold" fill="#2f5223" text-anchor="middle" filter="url(#rough2)">最后把记录到的尺寸排序：1 4  →  输出 1 4</text>
</svg>
