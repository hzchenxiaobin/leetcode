<svg xmlns="http://www.w3.org/2000/svg" width="660" height="476" viewBox="0 0 660 476" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="660" height="476" fill="#fafafa"/>

  <text x="330" y="34" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">逆序扫描：谁被标记为 bad</text>

  <rect x="250" y="56" width="160" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="81" text-anchor="middle" font-size="14" fill="#33506b" filter="url(#rough2)">j = m → 1 逆序</text>
  <path d="M330,96 L330,114" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="330,118 478,160 330,202 182,160" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="330" y="156" text-anchor="middle" font-size="13" fill="#8a6420" filter="url(#rough2)">窗口内有 bad？</text>
  <text x="330" y="174" text-anchor="middle" font-size="11" fill="#8a6420" filter="url(#rough2)">（即 Q_j 为真）</text>

  <path d="M478,160 L514,160" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="496" y="152" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="518" y="136" width="126" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="581" y="157" text-anchor="middle" font-size="13" fill="#2f5228" filter="url(#rough2)">Q_j = 真</text>
  <text x="581" y="175" text-anchor="middle" font-size="12" fill="#2f5228" filter="url(#rough2)">j 不是 bad</text>

  <path d="M330,202 L330,234" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="342" y="222" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <polygon points="330,238 430,278 330,318 230,278" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="330" y="274" text-anchor="middle" font-size="13" fill="#8a6420" filter="url(#rough2)">c_j 是奇数？</text>
  <text x="330" y="292" text-anchor="middle" font-size="11" fill="#8a6420" filter="url(#rough2)">（本层个数为奇）</text>

  <path d="M230,278 L198,278" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="215" y="270" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="58" y="254" width="136" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="126" y="275" text-anchor="middle" font-size="13" fill="#2f5228" filter="url(#rough2)">j 不是 bad</text>
  <text x="126" y="293" text-anchor="middle" font-size="11" fill="#2f5228" filter="url(#rough2)">个数为偶，白送一手</text>

  <path d="M330,318 L330,350" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="342" y="340" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="232" y="354" width="196" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="330" y="374" text-anchor="middle" font-size="13" fill="#8f3b38" filter="url(#rough2)">bad(j) = 真</text>
  <text x="330" y="392" text-anchor="middle" font-size="12" fill="#8f3b38" filter="url(#rough2)">lastBad ← j</text>

  <text x="44" y="422" font-size="12" fill="#666666" filter="url(#rough2)">单调性：最近的 bad 都出界，更远的 bad 更出界 ⇒ 只需记住 lastBad</text>

  <rect x="44" y="432" width="572" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="453" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">YES ⟺ 至少一个下标不是 bad；全 bad 才输出 NO</text>
</svg>
