<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="400" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按层装填：深度 d 放 kᵈ 个（放不下的放最后一层）</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">a 降序后：4, 3, 2, 1, 1；k = 2 时三层分别是 1、2、2 个</text>
  <text x="120" y="130" text-anchor="end" font-size="13" font-weight="bold" fill="#a0522d" filter="url(#rough2)">深度 0</text>
  <g filter="url(#rough2)"><rect x="150" y="100" width="90" height="44" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="195" y="129" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="270" y="129" text-anchor="start" font-size="11" fill="#777777" filter="url(#rough2)">容量 kᵈ = 1</text>
  <text x="120" y="210" text-anchor="end" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">深度 1</text>
  <g filter="url(#rough2)"><rect x="150" y="180" width="90" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="195" y="209" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="260" y="180" width="90" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="305" y="209" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="380" y="209" text-anchor="start" font-size="11" fill="#777777" filter="url(#rough2)">容量 kᵈ = 2</text>
  <text x="120" y="290" text-anchor="end" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">深度 2</text>
  <g filter="url(#rough2)"><rect x="150" y="260" width="90" height="44" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="195" y="289" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="260" y="260" width="90" height="44" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="305" y="289" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="370" y="260" width="90" height="44" rx="4" fill="#ffffff" fill-opacity="0.85" stroke="#cccccc" stroke-width="1.3" stroke-dasharray="4 4"/></g>
  <text x="415" y="289" text-anchor="middle" font-size="11" fill="#bbbbbb" filter="url(#rough2)">空</text>
  <g filter="url(#rough2)"><rect x="480" y="260" width="90" height="44" rx="4" fill="#ffffff" fill-opacity="0.85" stroke="#cccccc" stroke-width="1.3" stroke-dasharray="4 4"/></g>
  <text x="525" y="289" text-anchor="middle" font-size="11" fill="#bbbbbb" filter="url(#rough2)">空</text>
  <text x="600" y="289" text-anchor="start" font-size="11" fill="#777777" filter="url(#rough2)">容量 kᵈ = 4</text>
  <text x="420" y="360" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">总代价 = 1·(3+2) + 2·(1+1) = 9</text>
  <text x="420" y="386" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">k = 3 时深度 1 有 3 个位置 ⇒ 3+2+1 在深度 1，剩下 1 在深度 2 ⇒ 8</text>
</svg>
