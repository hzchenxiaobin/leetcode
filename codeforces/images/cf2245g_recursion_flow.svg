<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="24" y="32" font-size="17" fill="#333" filter="url(#rough2)">分治骨架：solve(U) 找出 U 内的所有边</text>

  <g filter="url(#rough2)">
    <rect x="178" y="48" width="204" height="40" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="280" y="73" font-size="13" text-anchor="middle" fill="#333">随机打乱 U 后询问</text>
  </g>
  <path d="M280,88 L280,112" stroke="#446688" stroke-width="2" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="120" y="114" width="140" height="42" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="190" y="133" font-size="13" text-anchor="middle" fill="#2f5b23">S（独立集）</text>
    <text x="190" y="149" font-size="11" text-anchor="middle" fill="#4a7a3a">S 内没有边</text>
    <rect x="300" y="114" width="140" height="42" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="370" y="133" font-size="13" text-anchor="middle" fill="#8c2f2b">C = U \ S</text>
    <text x="370" y="149" font-size="11" text-anchor="middle" fill="#b85450">每个点都挨着 S</text>
  </g>

  <path d="M370,156 L370,182" stroke="#b85450" stroke-width="2" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="278" y="184" width="184" height="42" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="370" y="203" font-size="12" text-anchor="middle" fill="#333">递归 solve(C)：C 内的边全已知</text>
    <text x="370" y="219" font-size="11" text-anchor="middle" fill="#8a6d2f">于是能把 C 的森林黑白染色</text>
  </g>

  <path d="M278,226 L196,254" stroke="#d6a040" stroke-width="2" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <path d="M370,226 L370,254" stroke="#d6a040" stroke-width="2" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <path d="M452,226 L520,254" stroke="#d6a040" stroke-width="2" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="96" y="256" width="140" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="166" y="281" font-size="12" text-anchor="middle" fill="#2f5b23">C 的黑点 C0</text>
    <rect x="300" y="256" width="140" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="370" y="281" font-size="12" text-anchor="middle" fill="#333">C 的白点 C1</text>
    <rect x="452" y="256" width="96" height="40" rx="8" fill="#fafafa" stroke="#8899aa" stroke-width="1.5"/>
    <text x="500" y="274" font-size="11" text-anchor="middle" fill="#555">S–C 的边</text>
    <text x="500" y="289" font-size="11" text-anchor="middle" fill="#555">只剩两种</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="312" width="440" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="72" y="333" font-size="12" fill="#333">work(S,C0) + work(S,C1)：两侧都是独立集 ⇒ 询问无干扰，可二分定位每条边</text>
  </g>
</svg>
