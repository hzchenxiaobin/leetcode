<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr71a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="330" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">缩写 = 首字母 + 中间字母个数 + 末字母</text>

  <!-- 12 个字母框：localization -->
  <g filter="url(#rough2)">
    <rect x="84" y="62" width="42" height="42" fill="#fff8e1" stroke="#c9a227" stroke-width="1.8"/>
    <rect x="130" y="62" width="42" height="42" fill="#eef4fb" stroke="#9db8d6" stroke-width="1.4"/>
    <rect x="176" y="62" width="42" height="42" fill="#eef4fb" stroke="#9db8d6" stroke-width="1.4"/>
    <rect x="222" y="62" width="42" height="42" fill="#eef4fb" stroke="#9db8d6" stroke-width="1.4"/>
    <rect x="268" y="62" width="42" height="42" fill="#eef4fb" stroke="#9db8d6" stroke-width="1.4"/>
    <rect x="314" y="62" width="42" height="42" fill="#eef4fb" stroke="#9db8d6" stroke-width="1.4"/>
    <rect x="360" y="62" width="42" height="42" fill="#eef4fb" stroke="#9db8d6" stroke-width="1.4"/>
    <rect x="406" y="62" width="42" height="42" fill="#eef4fb" stroke="#9db8d6" stroke-width="1.4"/>
    <rect x="452" y="62" width="42" height="42" fill="#eef4fb" stroke="#9db8d6" stroke-width="1.4"/>
    <rect x="498" y="62" width="42" height="42" fill="#eef4fb" stroke="#9db8d6" stroke-width="1.4"/>
    <rect x="544" y="62" width="42" height="42" fill="#eef4fb" stroke="#9db8d6" stroke-width="1.4"/>
    <rect x="590" y="62" width="42" height="42" fill="#fff8e1" stroke="#c9a227" stroke-width="1.8"/>
  </g>
  <g font-size="20" fill="#2b3a4a" text-anchor="middle" filter="url(#rough2)">
    <text x="105" y="90">l</text>
    <text x="151" y="90">o</text>
    <text x="197" y="90">c</text>
    <text x="243" y="90">a</text>
    <text x="289" y="90">l</text>
    <text x="335" y="90">i</text>
    <text x="381" y="90">z</text>
    <text x="427" y="90">a</text>
    <text x="473" y="90">t</text>
    <text x="519" y="90">i</text>
    <text x="565" y="90">o</text>
    <text x="611" y="90">n</text>
  </g>

  <!-- 中间 10 个字母的括号 -->
  <path d="M130 112 L130 122 L584 122 L584 112" stroke="#c9a227" stroke-width="1.8" fill="none"
        filter="url(#rough2)"/>
  <text x="357" y="146" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">中间 10 个字母</text>
  <text x="105" y="146" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">首字母</text>
  <text x="611" y="146" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">末字母</text>

  <!-- 结果 -->
  <text x="172" y="205" font-size="14" fill="#446688" filter="url(#rough2)">拼成</text>
  <g filter="url(#rough2)">
    <rect x="222" y="178" width="38" height="40" fill="#fff8e1" stroke="#c9a227" stroke-width="1.6"/>
    <rect x="266" y="178" width="52" height="40" fill="#f7ece0" stroke="#b85450" stroke-width="1.6"/>
    <rect x="324" y="178" width="38" height="40" fill="#fff8e1" stroke="#c9a227" stroke-width="1.6"/>
  </g>
  <g font-size="19" fill="#2b3a4a" text-anchor="middle" filter="url(#rough2)">
    <text x="241" y="206">l</text>
    <text x="292" y="206">10</text>
    <text x="343" y="206">n</text>
  </g>
  <text x="392" y="206" text-anchor="middle" font-size="20" fill="#446688" filter="url(#rough2)">=</text>
  <text x="452" y="207" font-size="22" font-weight="bold" fill="#2f5223" filter="url(#rough2)">l10n</text>
  <text x="241" y="238" text-anchor="middle" font-size="11" fill="#7a6a3a" filter="url(#rough2)">首字母</text>
  <text x="292" y="238" text-anchor="middle" font-size="11" fill="#7a6a3a" filter="url(#rough2)">12 - 2</text>
  <text x="343" y="238" text-anchor="middle" font-size="11" fill="#7a6a3a" filter="url(#rough2)">末字母</text>

  <path d="M80 262 Q 360 272 640 262" stroke="#c9c2b6" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="360" y="296" text-anchor="middle" font-size="13" fill="#4a4a4a" filter="url(#rough2)">只有长度 &gt; 10 才缩写；长度 ≤ 10 原样输出</text>
</svg>
