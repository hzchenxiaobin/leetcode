<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="371"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="250" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">样例 2：n = 5，a = b = 0</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">只要序列不严格上升，就一句感叹也不会有</text>
  <text x="450" y="112" text-anchor="middle" font-size="20" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">10  10  6  6  5</text>
  <text x="450" y="158" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">t₂ = 10 不大于最大值 10 ⇒ 沉默；后面依次更小 ⇒ 全沉默</text>
  <text x="450" y="200" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">输出 0 次 Oh、0 次 Wow ✓</text>
  <text x="450" y="232" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">（全 1 序列同样合法，答案不唯一）</text>
</svg>
