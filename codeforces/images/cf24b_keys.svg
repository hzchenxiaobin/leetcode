<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="163"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>

  <rect width="780" height="400" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两套规则 = 同一份统计的两个比较键</text>
  <path d="M 180 40 Q 390 46 600 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <text x="40" y="90" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">原规则：</text>
  <rect x="120" y="66" width="120" height="34" rx="7" fill="#cfe0f5" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="180" y="89" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">总积分</text>
  <rect x="250" y="66" width="110" height="34" rx="7" fill="#fbe3c8" stroke="#c98a2b" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="305" y="89" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">第 1 名次数</text>
  <rect x="370" y="66" width="110" height="34" rx="7" fill="#fdf3e0" stroke="#c98a2b" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="425" y="89" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">第 2 名次数</text>
  <rect x="490" y="66" width="110" height="34" rx="7" fill="#fdf3e0" stroke="#c98a2b" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="545" y="89" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">第 3 名次数</text>
  <text x="616" y="89" font-size="12" fill="#777777" filter="url(#rough2)">…</text>

  <text x="40" y="170" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">新规则：</text>
  <rect x="120" y="146" width="120" height="34" rx="7" fill="#d9ecd4" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="180" y="169" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">第 1 名次数</text>
  <rect x="250" y="146" width="110" height="34" rx="7" fill="#cfe0f5" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="305" y="169" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">总积分</text>
  <rect x="370" y="146" width="110" height="34" rx="7" fill="#fdf3e0" stroke="#c98a2b" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="425" y="169" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">第 2 名次数</text>
  <rect x="490" y="146" width="110" height="34" rx="7" fill="#fdf3e0" stroke="#c98a2b" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="545" y="169" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">第 3 名次数</text>
  <text x="616" y="169" font-size="12" fill="#777777" filter="url(#rough2)">…</text>

  <text x="120" y="216" font-size="11" fill="#777777" filter="url(#rough2)">蓝色 = 积分，绿色 = 胜场，橙色 = 各名次次数（从第 1 名开始）</text>

  <rect x="40" y="244" width="700" height="128" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="58" y="272" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">要点</text>
  <text x="58" y="300" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">统计一次（总积分 + 每个名次的次数），两套规则各按一个字典序键取最大。</text>
  <text x="58" y="326" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">新规则里胜场只比一次，之后从第 2 名次数继续；不要在第 3 项再把胜场比一遍。</text>
  <text x="58" y="352" font-size="11.5" fill="#9a7020" filter="url(#rough2)">名次数组开到 50（每场最多 50 人），第 11 名以后只记次数、不加分。</text>
</svg>
