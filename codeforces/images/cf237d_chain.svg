<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="67"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="380" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">局部：度数 4 的点，四条关联边串成链</text>
  <path d="M 150 42 Q 360 48 570 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- s 局部 -->
  <circle cx="140" cy="150" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="140" y="157" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">v</text>
  <g filter="url(#rough2)">
    <line x1="140" y1="150" x2="60" y2="86" stroke="#446688" stroke-width="2"/>
    <line x1="140" y1="150" x2="60" y2="214" stroke="#446688" stroke-width="2"/>
    <line x1="140" y1="150" x2="212" y2="86" stroke="#446688" stroke-width="2"/>
    <line x1="140" y1="150" x2="212" y2="214" stroke="#446688" stroke-width="2"/>
  </g>
  <circle cx="60" cy="86" r="17" fill="#ffffff" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <circle cx="60" cy="214" r="17" fill="#ffffff" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <circle cx="212" cy="86" r="17" fill="#ffffff" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <circle cx="212" cy="214" r="17" fill="#ffffff" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="60" y="92" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">a</text>
  <text x="60" y="220" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">b</text>
  <text x="212" y="92" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">c</text>
  <text x="212" y="220" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">d</text>
  <text x="92" y="112" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">e1</text>
  <text x="92" y="196" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">e2</text>
  <text x="176" y="112" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">e3</text>
  <text x="176" y="196" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">e4</text>
  <text x="140" y="266" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">s 的局部：v 的度数 = 4</text>

  <!-- 箭头 -->
  <path d="M 246 150 L 300 150" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- t 的链 -->
  <g filter="url(#rough2)">
    <rect x="312" y="124" width="76" height="50" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7"/>
    <rect x="412" y="124" width="76" height="50" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7"/>
    <rect x="512" y="124" width="76" height="50" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7"/>
    <rect x="612" y="124" width="76" height="50" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7"/>
  </g>
  <line x1="388" y1="149" x2="410" y2="149" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <line x1="488" y1="149" x2="510" y2="149" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <line x1="588" y1="149" x2="610" y2="149" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="350" y="154" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">x1</text>
  <text x="450" y="154" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">x2</text>
  <text x="550" y="154" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">x3</text>
  <text x="650" y="154" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">x4</text>
  <text x="350" y="196" text-anchor="middle" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">{v,a}</text>
  <text x="450" y="196" text-anchor="middle" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">{v,b}</text>
  <text x="550" y="196" text-anchor="middle" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">{v,c}</text>
  <text x="650" y="196" text-anchor="middle" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">{v,d}</text>
  <path d="M 312 112 L 312 104 L 688 104 L 688 112" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="500" y="98" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">这四个集合都含 v → 在 t 中连通 ✓</text>

  <rect x="60" y="292" width="600" height="62" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="72" y="314" font-size="12" fill="#7a5a1b" filter="url(#rough2)">度数为 d 的点贡献 d-1 条链边；全树求和：Σ(deg - 1) = 2(n-1) - n = n - 2</text>
  <text x="72" y="338" font-size="12" fill="#7a5a1b" filter="url(#rough2)">叶子的链长度为 0，不贡献边；这也解释了为什么 n=2 时 t 只有 1 个结点、0 条边</text>
</svg>
