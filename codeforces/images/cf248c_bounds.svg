<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="103"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">三条约束，全部在 y_c = y₁ + r 处取到最有利</text>
  <path d="M 96 40 Q 360 46 624 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 约束 1 -->
  <g filter="url(#rough2)">
    <rect x="60" y="62" width="600" height="82" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <text x="74" y="86" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">
    ① 球要能塞进门洞：y_c ∈ [y₁ + r, y₂ − r]</text>
  <text x="74" y="110" font-size="12" fill="#2f5223" filter="url(#rough2)">
    取最下面的 y_c = y₁ + r：球心贴着下门柱穿过，门洞最"富裕"。</text>
  <text x="74" y="132" font-size="12" fill="#2f5223" filter="url(#rough2)">
    题面已保证 2r &lt; y₂ − y₁，所以这个区间非空。</text>

  <!-- 约束 2 -->
  <g filter="url(#rough2)">
    <rect x="60" y="154" width="600" height="82" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="74" y="178" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">
    ② 弹跳点必须在左墙右侧：x_w &gt; r</text>
  <text x="74" y="202" font-size="12" fill="#8a6015" filter="url(#rough2)">
    x_w ≤ r 时球在弹跳处会贴/穿左墙，属于"碰了别的墙"，不合题意。</text>
  <text x="74" y="224" font-size="12" fill="#8a6015" filter="url(#rough2)">
    样例 2 就是 x_w = r 卡在边界上 ⇒ 输出 −1。</text>

  <!-- 约束 3 -->
  <g filter="url(#rough2)">
    <rect x="60" y="246" width="600" height="92" rx="8" fill="#fbeeee" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="74" y="270" font-size="13" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">
    ③ 靠近球门时圆盘不能蹭到门柱上方：在 x = r 处 y_r + r ≤ y₂</text>
  <text x="74" y="294" font-size="12" fill="#8a3a36" filter="url(#rough2)">
    y_r = y_c + (A − y_c)·r / x_w，其中 A = y_w − r 是弹跳时球心高度。</text>
  <text x="74" y="316" font-size="12" fill="#8a3a36" filter="url(#rough2)">
    因为第二段高度随 x 单调下降，x &lt; r 的整段里 y + r 的上确界就在 x = r。</text>

  <!-- 单调性 -->
  <g filter="url(#rough2)">
    <rect x="60" y="350" width="600" height="66" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/>
  </g>
  <g font-size="12" fill="#22314a" filter="url(#rough2)">
    <text x="74" y="374">y_c 越大：x_w 越小（越容易撞左墙）、第二段越"平"（越容易蹭门柱上方）。</text>
    <text x="74" y="396">所以 ① 范围内的可行 y_c 是一个以 y₁+r 为左端点的区间：左端点可行 ⟺ 有解。</text>
  </g>
</svg>
