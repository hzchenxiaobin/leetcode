<svg xmlns="http://www.w3.org/2000/svg" width="840" height="380" viewBox="0 0 840 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="380" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">固定 s 时的概率 = Π 1 / C(k_i, s_i)</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">同名礼物价格互不相同 ⇒ 有利子集唯一</text>
  <text x="420" y="96" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">名字 i 的 k_i 件中选 s_i 件，共 C(k_i, s_i) 种等可能</text>
  <g filter="url(#rough2)"><rect x="110" y="130" width="300" height="100" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="260" y="158" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">k_i = 4, s_i = 2</text>
  <text x="260" y="186" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">C(4,2) = 6 种</text>
  <text x="260" y="210" text-anchor="middle" font-size="11.5" fill="#8a4b2a" filter="url(#rough2)">只有 1 种是最贵两件</text>
  <g filter="url(#rough2)"><rect x="430" y="130" width="300" height="100" rx="4" fill="#f7fbf4" fill-opacity="0.85" stroke="#a8c99a" stroke-width="1.3"/></g>
  <text x="580" y="158" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3d6b2f" filter="url(#rough2)">多个最优方案时</text>
  <text x="580" y="186" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">对各方案的概率取平均</text>
  <text x="580" y="210" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">（老人均匀选方案）</text>
  <text x="420" y="270" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">总概率 = (Σ_{最优 b} Π 1/C(k_i,a_i+b_i)) / |OPT|</text>
  <text x="420" y="306" text-anchor="middle" font-size="11.5" fill="#8a4b2a" filter="url(#rough2)">注意不能只算一种方案：阈值并列时方案不止一个</text>
  <text x="420" y="340" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">样例 2 只有一种最优方案 ⇒ 1/1 · 1/C(4,2) = 1/6</text>
</svg>
