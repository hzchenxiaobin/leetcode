<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="320" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">结论：同色对 = max(n,m)-1，异色对 = min(n,m)</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">总数恒为 n+m-1，所以只需确定其中一方</text>
  <text x="200" y="120" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">Petya 的同色对</text>
  <text x="200" y="150" text-anchor="start" font-size="16" fill="#3d6b2f" filter="url(#rough2)">max(n,m) - 1</text>
  <text x="200" y="200" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">Vasya 的异色对</text>
  <text x="200" y="230" text-anchor="start" font-size="16" fill="#b05a5a" filter="url(#rough2)">min(n,m)</text>
  <text x="560" y="150" text-anchor="start" font-size="12.5" fill="#555555" filter="url(#rough2)">总数 = n+m-1</text>
  <text x="560" y="180" text-anchor="start" font-size="12.5" fill="#555555" filter="url(#rough2)">两者之和恰好等于它</text>
  <text x="440" y="290" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">样例：n=3,m=1 → 2 1；n=2,m=4 → 3 2</text>
</svg>
