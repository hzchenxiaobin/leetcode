<svg xmlns="http://www.w3.org/2000/svg" width="800" height="452" viewBox="0 0 800 452"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="800" height="452" fill="#fafafa"/>

  <text x="400" y="30" text-anchor="middle" font-size="17.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">演算：p = [6, 2, 4, 3, 7, 5, 1]，从 i = 7 倒序扫出 38</text>
  <path d="M 196 40 Q 400 47 604 40" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- 表头 -->
  <rect x="40" y="54" width="720" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <g font-size="12" fill="#2f4a66" font-weight="bold">
    <text x="82" y="77" text-anchor="middle" filter="url(#rough2)">i</text>
    <text x="165" y="77" text-anchor="middle" filter="url(#rough2)">p_i</text>
    <text x="250" y="77" text-anchor="middle" filter="url(#rough2)">r_i</text>
    <text x="335" y="77" text-anchor="middle" filter="url(#rough2)">M = P_i</text>
    <text x="445" y="77" text-anchor="middle" filter="url(#rough2)">情况</text>
    <text x="540" y="77" text-anchor="middle" filter="url(#rough2)">S_i</text>
    <text x="620" y="77" text-anchor="middle" filter="url(#rough2)">A_i</text>
    <text x="700" y="77" text-anchor="middle" filter="url(#rough2)">计入 ans</text>
  </g>

  <!-- 行 i=7 : 情况1 -->
  <rect x="40" y="88" width="720" height="30" rx="4" fill="#f6f6f6" stroke="#c9c9c9" stroke-width="1.1" filter="url(#rough2)"/>
  <g font-size="12" fill="#4a4a4a">
    <text x="82" y="108" text-anchor="middle" filter="url(#rough2)">7</text>
    <text x="165" y="108" text-anchor="middle" filter="url(#rough2)">1</text>
    <text x="250" y="108" text-anchor="middle" filter="url(#rough2)">—</text>
    <text x="335" y="108" text-anchor="middle" filter="url(#rough2)">5</text>
    <text x="445" y="108" text-anchor="middle" fill="#6a6a6a" filter="url(#rough2)">1</text>
    <text x="540" y="108" text-anchor="middle" filter="url(#rough2)">0</text>
    <text x="620" y="108" text-anchor="middle" filter="url(#rough2)">0</text>
    <text x="700" y="108" text-anchor="middle" font-weight="bold" filter="url(#rough2)">6</text>
  </g>

  <!-- 行 i=6 -->
  <rect x="40" y="118" width="720" height="30" rx="4" fill="#fafafa" stroke="#dcdcdc" stroke-width="1.1" filter="url(#rough2)"/>
  <g font-size="12" fill="#4a4a4a">
    <text x="82" y="138" text-anchor="middle" filter="url(#rough2)">6</text>
    <text x="165" y="138" text-anchor="middle" filter="url(#rough2)">5</text>
    <text x="250" y="138" text-anchor="middle" filter="url(#rough2)">—</text>
    <text x="335" y="138" text-anchor="middle" filter="url(#rough2)">5</text>
    <text x="445" y="138" text-anchor="middle" fill="#6a6a6a" filter="url(#rough2)">1</text>
    <text x="540" y="138" text-anchor="middle" filter="url(#rough2)">0</text>
    <text x="620" y="138" text-anchor="middle" filter="url(#rough2)">0</text>
    <text x="700" y="138" text-anchor="middle" font-weight="bold" filter="url(#rough2)">5</text>
  </g>

  <!-- 行 i=5 -->
  <rect x="40" y="148" width="720" height="30" rx="4" fill="#f6f6f6" stroke="#c9c9c9" stroke-width="1.1" filter="url(#rough2)"/>
  <g font-size="12" fill="#4a4a4a">
    <text x="82" y="168" text-anchor="middle" filter="url(#rough2)">5</text>
    <text x="165" y="168" text-anchor="middle" filter="url(#rough2)">7</text>
    <text x="250" y="168" text-anchor="middle" filter="url(#rough2)">—</text>
    <text x="335" y="168" text-anchor="middle" filter="url(#rough2)">5</text>
    <text x="445" y="168" text-anchor="middle" fill="#6a6a6a" filter="url(#rough2)">1</text>
    <text x="540" y="168" text-anchor="middle" filter="url(#rough2)">0</text>
    <text x="620" y="168" text-anchor="middle" filter="url(#rough2)">0</text>
    <text x="700" y="168" text-anchor="middle" font-weight="bold" filter="url(#rough2)">4</text>
  </g>

  <!-- 行 i=4 : 情况2 -->
  <rect x="40" y="178" width="720" height="30" rx="4" fill="#eefaf0" stroke="#8fbb8a" stroke-width="1.2" filter="url(#rough2)"/>
  <g font-size="12" fill="#3c5e2e">
    <text x="82" y="198" text-anchor="middle" filter="url(#rough2)">4</text>
    <text x="165" y="198" text-anchor="middle" filter="url(#rough2)">3</text>
    <text x="250" y="198" text-anchor="middle" filter="url(#rough2)">5</text>
    <text x="335" y="198" text-anchor="middle" filter="url(#rough2)">5</text>
    <text x="445" y="198" text-anchor="middle" filter="url(#rough2)">2</text>
    <text x="540" y="198" text-anchor="middle" filter="url(#rough2)">1</text>
    <text x="620" y="198" text-anchor="middle" filter="url(#rough2)">1</text>
    <text x="700" y="198" text-anchor="middle" font-weight="bold" filter="url(#rough2)">4</text>
  </g>

  <!-- 行 i=3 : 情况2 -->
  <rect x="40" y="208" width="720" height="30" rx="4" fill="#eefaf0" stroke="#8fbb8a" stroke-width="1.2" filter="url(#rough2)"/>
  <g font-size="12" fill="#3c5e2e">
    <text x="82" y="228" text-anchor="middle" filter="url(#rough2)">3</text>
    <text x="165" y="228" text-anchor="middle" filter="url(#rough2)">4</text>
    <text x="250" y="228" text-anchor="middle" filter="url(#rough2)">5</text>
    <text x="335" y="228" text-anchor="middle" filter="url(#rough2)">5</text>
    <text x="445" y="228" text-anchor="middle" filter="url(#rough2)">2</text>
    <text x="540" y="228" text-anchor="middle" filter="url(#rough2)">3</text>
    <text x="620" y="228" text-anchor="middle" filter="url(#rough2)">2</text>
    <text x="700" y="228" text-anchor="middle" font-weight="bold" filter="url(#rough2)">5</text>
  </g>

  <!-- 行 i=2 : 情况3 -->
  <rect x="40" y="238" width="720" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <g font-size="12" fill="#8a6015">
    <text x="82" y="258" text-anchor="middle" filter="url(#rough2)">2</text>
    <text x="165" y="258" text-anchor="middle" filter="url(#rough2)">2</text>
    <text x="250" y="258" text-anchor="middle" filter="url(#rough2)">3</text>
    <text x="335" y="258" text-anchor="middle" filter="url(#rough2)">5</text>
    <text x="445" y="258" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3</text>
    <text x="540" y="258" text-anchor="middle" filter="url(#rough2)">6</text>
    <text x="620" y="258" text-anchor="middle" filter="url(#rough2)">3</text>
    <text x="700" y="258" text-anchor="middle" font-weight="bold" filter="url(#rough2)">7</text>
  </g>

  <!-- 行 i=1 : 情况2 -->
  <rect x="40" y="268" width="720" height="30" rx="4" fill="#eefaf0" stroke="#8fbb8a" stroke-width="1.2" filter="url(#rough2)"/>
  <g font-size="12" fill="#3c5e2e">
    <text x="82" y="288" text-anchor="middle" filter="url(#rough2)">1</text>
    <text x="165" y="288" text-anchor="middle" filter="url(#rough2)">6</text>
    <text x="250" y="288" text-anchor="middle" filter="url(#rough2)">5</text>
    <text x="335" y="288" text-anchor="middle" filter="url(#rough2)">5</text>
    <text x="445" y="288" text-anchor="middle" filter="url(#rough2)">2</text>
    <text x="540" y="288" text-anchor="middle" filter="url(#rough2)">7</text>
    <text x="620" y="288" text-anchor="middle" filter="url(#rough2)">4</text>
    <text x="700" y="288" text-anchor="middle" font-weight="bold" filter="url(#rough2)">7</text>
  </g>

  <!-- 说明 -->
  <rect x="40" y="316" width="352" height="112" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="216" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">唯一的情况 3：i = 2</text>
  <text x="216" y="364" text-anchor="middle" font-size="11.5" fill="#94702a" filter="url(#rough2)">t = r_2 = 3，M = P_2 = 5</text>
  <text x="216" y="386" text-anchor="middle" font-size="11.5" fill="#94702a" filter="url(#rough2)">f(2,·) = [1, 0, 1, 3, 2, 0, 0]</text>
  <text x="216" y="408" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">S_2 = 1 + 3 + 2 = 6（3 是 (t,M) 里的点）</text>

  <rect x="408" y="316" width="352" height="112" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="584" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#a14340" filter="url(#rough2)">答案 = 左目标和 + 右目标和</text>
  <text x="584" y="364" text-anchor="middle" font-size="11.5" fill="#b06a66" filter="url(#rough2)">左目标恒为 1：共 n(n−1)/2 = 21</text>
  <text x="584" y="386" text-anchor="middle" font-size="11.5" fill="#b06a66" filter="url(#rough2)">右目标和 = 6+5+4+4+5+7+7 = 38−21</text>
  <text x="584" y="408" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">输出 38</text>
</svg>
