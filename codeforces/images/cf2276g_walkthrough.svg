<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="440" fill="#fafafa"/>
  <text x="380" y="30" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">走查：n = 4，a = [1, 4, 1]（样例 4，答案 188）</text>
  <text x="380" y="54" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">ans(j,r) = 3! + G(r,j) − G(r−1,j) + [j = a_{r−1}]·F(r−1)；j = a_r 时为 0（该轮被保护）</text>

  <!-- 表头 -->
  <g stroke="#446688" stroke-width="1.5" fill="#e8f0fe" filter="url(#rough2)">
    <rect x="40" y="72" width="60" height="32" rx="5"/>
    <rect x="106" y="72" width="240" height="32" rx="5"/>
    <rect x="352" y="72" width="60" height="32" rx="5"/>
    <rect x="418" y="72" width="140" height="32" rx="5"/>
    <rect x="564" y="72" width="156" height="32" rx="5"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="70" y="93">回合 r</text>
    <text x="226" y="93">保留下来的 run（右→左）</text>
    <text x="382" y="93">F(r)</text>
    <text x="488" y="93">G(r, 1..4)</text>
    <text x="642" y="93">ans(1..4, r)</text>
  </g>

  <!-- 行 1 -->
  <g stroke="#4a7a3a" stroke-width="1.4" fill="#e6f4ea" filter="url(#rough2)">
    <rect x="40" y="112" width="60" height="36" rx="5"/>
    <rect x="106" y="112" width="240" height="36" rx="5"/>
    <rect x="352" y="112" width="60" height="36" rx="5"/>
    <rect x="418" y="112" width="140" height="36" rx="5"/>
    <rect x="564" y="112" width="156" height="36" rx="5"/>
  </g>
  <g font-size="12.5" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="70" y="136">1</text>
    <text x="226" y="136">(v₀=1, len₀=1)</text>
    <text x="382" y="136">3! = 6</text>
    <text x="488" y="136">[0, 2, 2, 2]</text>
    <text x="642" y="136">[0, 8, 8, 8]</text>
  </g>

  <!-- 行 2 -->
  <g stroke="#4a7a3a" stroke-width="1.4" fill="#fff8e1" filter="url(#rough2)">
    <rect x="40" y="156" width="60" height="36" rx="5"/>
    <rect x="106" y="156" width="240" height="36" rx="5"/>
    <rect x="352" y="156" width="60" height="36" rx="5"/>
    <rect x="418" y="156" width="140" height="36" rx="5"/>
    <rect x="564" y="156" width="156" height="36" rx="5"/>
  </g>
  <g font-size="12.5" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="70" y="180">2</text>
    <text x="226" y="180">(4,1), (1,1)</text>
    <text x="382" y="180">6 − 2 = 4</text>
    <text x="488" y="180">[2, 1, 1, 0]</text>
    <text x="642" y="180">[14, 5, 5, 0]</text>
  </g>

  <!-- 行 3 -->
  <g stroke="#4a7a3a" stroke-width="1.4" fill="#e6f4ea" filter="url(#rough2)">
    <rect x="40" y="200" width="60" height="36" rx="5"/>
    <rect x="106" y="200" width="240" height="36" rx="5"/>
    <rect x="352" y="200" width="60" height="36" rx="5"/>
    <rect x="418" y="200" width="140" height="36" rx="5"/>
    <rect x="564" y="200" width="156" height="36" rx="5"/>
  </g>
  <g font-size="12.5" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="70" y="224">3</text>
    <text x="226" y="224">(1,1), (4,1)</text>
    <text x="382" y="224">6 − 2 = 4</text>
    <text x="488" y="224">[0, 1, 1, 2]</text>
    <text x="642" y="224">[0, 6, 6, 12]</text>
  </g>

  <text x="380" y="258" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">第 2 行 j=1 用到了修正项：3! + G(2,1) − G(1,1) + F(1) = 6 + 2 − 0 + 6 = 14</text>

  <!-- XOR -->
  <g stroke="#d6a040" stroke-width="1.6" fill="#fff8e1" filter="url(#rough2)">
    <rect x="40" y="276" width="680" height="82" rx="10"/>
  </g>
  <text x="380" y="302" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">按 ⊕ ans(j,r)·j·r 累加（ans 取模，乘积与答案不取模）：</text>
  <text x="380" y="326" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">16 ⊕ 24 ⊕ 32 ⊕ 28 ⊕ 20 ⊕ 30 ⊕ 36 ⊕ 54 ⊕ 144 = 188</text>
  <text x="380" y="348" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">例如 r=3, j=4：12 · 3 · 4 = 144；r=1, j=2：8 · 1 · 2 = 16</text>

  <text x="380" y="386" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">run 链只保留互不相同的 run 值；len₀ 是「当前 run 到 r 为止」的长度。</text>
  <text x="380" y="412" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">总答案 = 所有 (j, r) 贡献的异或；时间 O(n²)，空间 O(n)。</text>
</svg>
