<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 0 780 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="83"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrI" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="780" height="440" fill="#fafafa"/>

  <text x="390" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">相遇时刻的归属：同时空出 → Alice；Bob 先到 → Bob</text>

  <!-- 场景 A：t = 1 1 1 -->
  <rect x="30" y="50" width="720" height="150" rx="10" fill="#eef4ff" stroke="#446688"
        stroke-width="1.3" filter="url(#rough2)"/>
  <text x="46" y="76" font-size="13" font-weight="bold" fill="#23405c" filter="url(#rough2)">场景 A：t = (1, 1, 1)，两人在 t = 1 同时空出来</text>

  <rect x="70" y="90" width="40" height="26" fill="#dbe7fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="110" y="90" width="40" height="26" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="150" y="90" width="40" height="26" fill="#fff1e6" stroke="#b06a2c" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="90" y="108" text-anchor="middle" font-size="11" fill="#23405c" filter="url(#rough2)">1</text>
  <text x="130" y="108" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">1</text>
  <text x="170" y="108" text-anchor="middle" font-size="11" fill="#8a4a14" filter="url(#rough2)">1</text>

  <!-- Alice 轨道 -->
  <text x="46" y="146" font-size="11" fill="#2f5223" filter="url(#rough2)">Alice</text>
  <rect x="110" y="132" width="60" height="22" fill="#cfeacf" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="140" y="148" text-anchor="middle" font-size="10" fill="#2f5223" filter="url(#rough2)">1 号</text>
  <rect x="170" y="132" width="60" height="22" fill="#a8d8a8" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="148" text-anchor="middle" font-size="10" fill="#204a1e" filter="url(#rough2)">2 号</text>

  <!-- Bob 轨道 -->
  <text x="46" y="182" font-size="11" fill="#8a4a14" filter="url(#rough2)">Bob</text>
  <rect x="110" y="168" width="60" height="22" fill="#ffd9b3" stroke="#b06a2c" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="140" y="184" text-anchor="middle" font-size="10" fill="#8a4a14" filter="url(#rough2)">3 号</text>

  <path d="M 172 168 L 172 158" stroke="#b85450" stroke-width="1.6" fill="none"
        marker-end="url(#arrI)" filter="url(#rough2)"/>
  <text x="182" y="184" font-size="10.5" fill="#8c3b37" filter="url(#rough2)">也想吃 2 号，但同时在 t=1 到达 → 让给 Alice</text>
  <text x="480" y="148" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">结果：2 1</text>

  <!-- 场景 B：t = 5 1 1 -->
  <rect x="30" y="216" width="720" height="160" rx="10" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.3" filter="url(#rough2)"/>
  <text x="46" y="242" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">场景 B：t = (5, 1, 1)，Bob 在 t = 1 先空出来，Alice 还在吃</text>

  <rect x="70" y="256" width="50" height="24" fill="#dbe7fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="120" y="256" width="50" height="24" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="170" y="256" width="50" height="24" fill="#fff1e6" stroke="#b06a2c" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="95" y="273" text-anchor="middle" font-size="11" fill="#23405c" filter="url(#rough2)">5</text>
  <text x="145" y="273" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">1</text>
  <text x="195" y="273" text-anchor="middle" font-size="11" fill="#8a4a14" filter="url(#rough2)">1</text>

  <!-- 轨道 -->
  <text x="46" y="312" font-size="11" fill="#2f5223" filter="url(#rough2)">Alice</text>
  <rect x="110" y="298" width="200" height="22" fill="#cfeacf" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="210" y="314" text-anchor="middle" font-size="10" fill="#2f5223" filter="url(#rough2)">1 号（5 s，到 t=5 才空）</text>

  <text x="46" y="348" font-size="11" fill="#8a4a14" filter="url(#rough2)">Bob</text>
  <rect x="110" y="334" width="40" height="22" fill="#ffd9b3" stroke="#b06a2c" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="130" y="350" text-anchor="middle" font-size="10" fill="#8a4a14" filter="url(#rough2)">3 号</text>
  <rect x="150" y="334" width="40" height="22" fill="#ffc78f" stroke="#b06a2c" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="170" y="350" text-anchor="middle" font-size="10" fill="#8a4a14" filter="url(#rough2)">2 号</text>

  <path d="M 152 334 L 152 326" stroke="#b85450" stroke-width="1.5" fill="none"
        marker-end="url(#arrI)" filter="url(#rough2)"/>
  <text x="330" y="314" font-size="11" fill="#8c3b37" filter="url(#rough2)">t = 1 就空了，而 Alice 要到 t = 5 才空</text>
  <text x="330" y="334" font-size="11" fill="#8c3b37" filter="url(#rough2)">→ 2 号归 Bob，Alice 一块也没多吃</text>
  <text x="330" y="354" font-size="12" font-weight="bold" fill="#8a4a14" filter="url(#rough2)">结果：1 2</text>

  <!-- 底部：代码里的等号 -->
  <rect x="30" y="390" width="720" height="38" rx="8" fill="#fdeef0" stroke="#b85450"
        stroke-width="1.3" filter="url(#rough2)"/>
  <text x="46" y="414" font-size="12" fill="#8c3b37" filter="url(#rough2)">代码里这一行就是全部：if (aliceTime &lt;= bobTime) → Alice 取；把 &lt;= 写成 &lt;，场景 A 就会输出 1 2。</text>
</svg>
