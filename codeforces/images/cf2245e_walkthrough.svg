<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="760" height="430" fill="#fafafa"/>
  <text x="380" y="30" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">样例 5 走查：度数为 (1,3,1,2,3,1,1) 的树</text>
  <text x="380" y="52" text-anchor="middle" font-size="11.5" fill="#888888"
        filter="url(#rough2)">奇点 6 个 ⇒ 15 个候选端点对；筛掉「内部含奇点」的 10 对，剩下 5 对</text>

  <line x1="60" y1="105" x2="120" y2="165" stroke="#3a3a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="60" y1="225" x2="120" y2="165" stroke="#3a3a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="120" y1="165" x2="195" y2="165" stroke="#3a3a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="195" y1="165" x2="265" y2="165" stroke="#3a3a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="265" y1="165" x2="320" y2="105" stroke="#3a3a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="265" y1="165" x2="320" y2="225" stroke="#3a3a3a" stroke-width="1.8" filter="url(#rough2)"/>

  <circle cx="120" cy="165" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="120" y="170" text-anchor="middle" font-size="12" fill="#8a6d20" filter="url(#rough2)">2</text>
  <circle cx="60" cy="105" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="60" y="110" text-anchor="middle" font-size="12" fill="#8a6d20" filter="url(#rough2)">1</text>
  <circle cx="60" cy="225" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="60" y="230" text-anchor="middle" font-size="12" fill="#8a6d20" filter="url(#rough2)">3</text>
  <circle cx="195" cy="165" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="195" y="170" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">4</text>
  <circle cx="265" cy="165" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="265" y="170" text-anchor="middle" font-size="12" fill="#8a6d20" filter="url(#rough2)">5</text>
  <circle cx="320" cy="105" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="320" y="110" text-anchor="middle" font-size="12" fill="#8a6d20" filter="url(#rough2)">6</text>
  <circle cx="320" cy="225" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="320" y="230" text-anchor="middle" font-size="12" fill="#8a6d20" filter="url(#rough2)">7</text>

  <text x="120" y="194" text-anchor="middle" font-size="9.5" fill="#888888" filter="url(#rough2)">3</text>
  <text x="60" y="134" text-anchor="middle" font-size="9.5" fill="#888888" filter="url(#rough2)">1</text>
  <text x="60" y="254" text-anchor="middle" font-size="9.5" fill="#888888" filter="url(#rough2)">1</text>
  <text x="195" y="194" text-anchor="middle" font-size="9.5" fill="#888888" filter="url(#rough2)">2</text>
  <text x="265" y="194" text-anchor="middle" font-size="9.5" fill="#888888" filter="url(#rough2)">3</text>
  <text x="320" y="134" text-anchor="middle" font-size="9.5" fill="#888888" filter="url(#rough2)">1</text>
  <text x="320" y="254" text-anchor="middle" font-size="9.5" fill="#888888" filter="url(#rough2)">1</text>

  <text x="182" y="296" text-anchor="middle" font-size="10.5" fill="#888888" filter="url(#rough2)">圈内是编号，圈下小字是 deg_T</text>
  <text x="182" y="318" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">橙 = 奇度点（6 个），蓝 = 偶度点（仅 4）</text>
  <text x="182" y="340" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">偶块只有 {4}，它挂 2 个奇点 ⇒ C(2,2)=1</text>

  <rect x="360" y="86" width="392" height="272" rx="8" fill="#ffffff" stroke="#9aa0a6"
        stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="361" y="122" width="390" height="28" fill="#e6f4ea" opacity="0.55" filter="url(#rough2)"/>
  <rect x="361" y="150" width="390" height="28" fill="#e6f4ea" opacity="0.55" filter="url(#rough2)"/>
  <rect x="361" y="178" width="390" height="28" fill="#e6f4ea" opacity="0.55" filter="url(#rough2)"/>
  <rect x="361" y="206" width="390" height="28" fill="#e6f4ea" opacity="0.55" filter="url(#rough2)"/>
  <rect x="361" y="234" width="390" height="28" fill="#e6f4ea" opacity="0.55" filter="url(#rough2)"/>
  <line x1="360" y1="120" x2="752" y2="120" stroke="#9aa0a6" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="360" y1="150" x2="752" y2="150" stroke="#e0e0e0" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="360" y1="178" x2="752" y2="178" stroke="#e0e0e0" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="360" y1="206" x2="752" y2="206" stroke="#e0e0e0" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="360" y1="234" x2="752" y2="234" stroke="#e0e0e0" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="360" y1="262" x2="752" y2="262" stroke="#e0e0e0" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="360" y1="290" x2="752" y2="290" stroke="#e0e0e0" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="360" y1="318" x2="752" y2="318" stroke="#e0e0e0" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="360" y1="346" x2="752" y2="346" stroke="#e0e0e0" stroke-width="1.1" filter="url(#rough2)"/>

  <text x="408" y="110" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">路径</text>
  <text x="504" y="110" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">内部点</text>
  <text x="600" y="110" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">内部度数</text>
  <text x="700" y="110" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">判定</text>

  <text x="408" y="142" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">(1,2)</text>
  <text x="504" y="142" text-anchor="middle" font-size="11.5" fill="#888888" filter="url(#rough2)">—</text>
  <text x="600" y="142" text-anchor="middle" font-size="11.5" fill="#888888" filter="url(#rough2)">—</text>
  <text x="700" y="142" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✔ 相邻奇-奇</text>

  <text x="408" y="170" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">(2,3)</text>
  <text x="504" y="170" text-anchor="middle" font-size="11.5" fill="#888888" filter="url(#rough2)">—</text>
  <text x="600" y="170" text-anchor="middle" font-size="11.5" fill="#888888" filter="url(#rough2)">—</text>
  <text x="700" y="170" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✔ 相邻奇-奇</text>

  <text x="408" y="198" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">(2,5)</text>
  <text x="504" y="198" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="600" y="198" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">2 偶</text>
  <text x="700" y="198" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✔ 内部全偶</text>

  <text x="408" y="226" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">(5,6)</text>
  <text x="504" y="226" text-anchor="middle" font-size="11.5" fill="#888888" filter="url(#rough2)">—</text>
  <text x="600" y="226" text-anchor="middle" font-size="11.5" fill="#888888" filter="url(#rough2)">—</text>
  <text x="700" y="226" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✔ 相邻奇-奇</text>

  <text x="408" y="254" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">(5,7)</text>
  <text x="504" y="254" text-anchor="middle" font-size="11.5" fill="#888888" filter="url(#rough2)">—</text>
  <text x="600" y="254" text-anchor="middle" font-size="11.5" fill="#888888" filter="url(#rough2)">—</text>
  <text x="700" y="254" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✔ 相邻奇-奇</text>

  <text x="408" y="282" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">(1,3)</text>
  <text x="504" y="282" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="600" y="282" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">3 奇</text>
  <text x="700" y="282" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✘ 内部奇点</text>

  <text x="408" y="310" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">(1,5)</text>
  <text x="504" y="310" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">2,4</text>
  <text x="600" y="310" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">3 奇</text>
  <text x="700" y="310" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✘ 内部奇点</text>

  <text x="408" y="338" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">(3,4)</text>
  <text x="504" y="338" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="600" y="338" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">3 奇</text>
  <text x="700" y="338" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✘ 内部奇点</text>

  <text x="380" y="400" text-anchor="middle" font-size="11.5" fill="#2b2b2b"
        filter="url(#rough2)">数一数：奇-奇边 4 条 + 偶块 {4} 的 C(2,2) = 1 ⇒ 答案 5</text>
</svg>
