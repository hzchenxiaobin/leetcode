<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2b2b2b"/>
    </marker>
  </defs>

  <rect width="760" height="330" fill="#fafafa"/>
  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 n = 3 的逐步演算：64 格最后只剩 9 格空着</text>
  <path d="M 150 40 Q 380 46 610 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="18" y="58" width="216" height="72" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="272" y="58" width="216" height="72" rx="9" fill="#d7ecd9" stroke="#2f7a3a" stroke-width="1.6"/>
    <rect x="526" y="58" width="216" height="72" rx="9" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="18" y="162" width="216" height="72" rx="9" fill="#d7ecd9" stroke="#2f7a3a" stroke-width="1.6"/>
    <rect x="272" y="162" width="216" height="72" rx="9" fill="#f7dfd0" stroke="#b85450" stroke-width="1.6"/>
    <rect x="526" y="162" width="216" height="72" rx="9" fill="#cfe3f7" stroke="#446688" stroke-width="1.6"/>
  </g>

  <g font-size="13" fill="#2b2b2b" filter="url(#rough2)" text-anchor="middle">
    <text x="126" y="84" font-weight="bold">盒子 8×8</text>
    <text x="126" y="108" font-size="12.5">共 64 格</text>

    <text x="380" y="84" font-weight="bold">放边长 8 的曲奇</text>
    <text x="380" y="108" font-size="12.5">8×9/2 = 36 格（位置唯一）</text>

    <text x="634" y="84" font-weight="bold">剩下下三角 L_8</text>
    <text x="634" y="108" font-size="12.5">64 − 36 = 28 格</text>

    <text x="126" y="188" font-weight="bold">再放边长 4 的曲奇</text>
    <text x="126" y="212" font-size="12.5">4×5/2 = 10 格（位置唯一）</text>

    <text x="380" y="188" font-weight="bold">余下 3 个 L_4</text>
    <text x="380" y="212" font-size="12.5">28 − 10 = 18 格</text>

    <text x="634" y="188" font-weight="bold">每个 L_4 放边长 2 的曲奇</text>
    <text x="634" y="212" font-size="12.5">3 格，三块共 9 格</text>
  </g>

  <g filter="url(#rough2)" stroke="#2b2b2b" stroke-width="1.5" fill="none">
    <path d="M 236 94 L 268 94" marker-end="url(#ar2)"/>
    <path d="M 490 94 L 522 94" marker-end="url(#ar2)"/>
    <path d="M 634 132 L 634 150 L 126 150 L 126 158" marker-end="url(#ar2)"/>
    <path d="M 236 198 L 268 198" marker-end="url(#ar2)"/>
    <path d="M 490 198 L 522 198" marker-end="url(#ar2)"/>
    <path d="M 634 236 L 634 258 L 380 258 L 380 262" marker-end="url(#ar2)"/>
  </g>

  <rect x="120" y="262" width="520" height="52" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="285" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">18 − 9 = 9 个孤格（没有 1×1 饼干），9 = 3^(3−1)</text>
  <text x="380" y="306" text-anchor="middle" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">与官方输出 9 一致；桶里只留下这些再也放不进任何饼干的格子</text>
</svg>
