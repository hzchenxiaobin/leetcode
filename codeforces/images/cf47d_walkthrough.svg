<svg xmlns="http://www.w3.org/2000/svg" width="760" height="310" viewBox="0 0 760 310"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="499"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="310" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">D：样例 1 的 6 个候选密码</text>
  <path d="M 210 40 Q 380 45 550 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <text x="50" y="68" font-size="11" fill="#555" filter="url(#rough2)">n = 6，两次尝试：000000 → 2 位正确；010100 → 4 位正确</text>
  <text x="50" y="92" font-size="11" fill="#555" filter="url(#rough2)">于是密码里恰好有 2 个 1，且与 010100 只有 2 位不同。逐个验证得到：</text>

  <rect x="50" y="104" width="656" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="70" y="136" font-size="13" fill="#2f4a66" font-family="'Courier New',monospace" filter="url(#rough2)">111100   110110   011110   110101   011101   010111</text>

  <text x="50" y="184" font-size="11" fill="#555" filter="url(#rough2)">共 6 个，输出 6 ✓</text>

  <rect x="50" y="200" width="320" height="96" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="62" y="222" font-size="11" font-weight="bold" fill="#2f5223" filter="url(#rough2)">样例 2：再加一条 111100 → 0</text>
  <text x="62" y="244" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">111100 与自身的相符位数是 6，但要求 0</text>
  <text x="62" y="266" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">⇒ 任何密码都矛盾 ⇒ 输出 0</text>

  <rect x="386" y="200" width="320" height="96" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="398" y="222" font-size="11" font-weight="bold" fill="#8a6015" filter="url(#rough2)">样例 3：第三条 111100 → 2</text>
  <text x="398" y="244" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">在上面 6 个里，只有 010111 与 111100</text>
  <text x="398" y="266" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">恰有 2 位相同 ⇒ 答案 1</text>
</svg>
