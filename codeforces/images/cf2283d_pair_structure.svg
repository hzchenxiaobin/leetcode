<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 404" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="680" height="404" fill="#fafafa"/>

  <text x="340" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">k 固定后：配对 (i, k−i) 决定黑点，树只影响灰点</text>

  <!-- box A: mirror pairs for n=9, k=10 -->
  <rect x="24" y="40" width="632" height="162" rx="10" fill="#eef4fb" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="340" y="64" text-anchor="middle" font-size="12" fill="#2c4a66" filter="url(#rough2)">n = 9，k = 10：第 i 列就是配对 (i, k−i)，上排为 i、下排为 k−i</text>

  <text x="56" y="100" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">i</text>
  <text x="56" y="164" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">k−i</text>

  <!-- row 1 labels 1..9 -->
  <rect x="76" y="78" width="52" height="32" rx="4" fill="#4a4d57" stroke="#2e2e34" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="102" y="100" text-anchor="middle" font-size="12" fill="#fff" filter="url(#rough2)">1</text>
  <rect x="138" y="78" width="52" height="32" rx="4" fill="#4a4d57" stroke="#2e2e34" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="164" y="100" text-anchor="middle" font-size="12" fill="#fff" filter="url(#rough2)">2</text>
  <rect x="200" y="78" width="52" height="32" rx="4" fill="#4a4d57" stroke="#2e2e34" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="226" y="100" text-anchor="middle" font-size="12" fill="#fff" filter="url(#rough2)">3</text>
  <rect x="262" y="78" width="52" height="32" rx="4" fill="#4a4d57" stroke="#2e2e34" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="288" y="100" text-anchor="middle" font-size="12" fill="#fff" filter="url(#rough2)">4</text>
  <rect x="324" y="78" width="52" height="32" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="350" y="100" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">5</text>
  <rect x="386" y="78" width="52" height="32" rx="4" fill="#4a4d57" stroke="#2e2e34" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="412" y="100" text-anchor="middle" font-size="12" fill="#fff" filter="url(#rough2)">6</text>
  <rect x="448" y="78" width="52" height="32" rx="4" fill="#4a4d57" stroke="#2e2e34" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="474" y="100" text-anchor="middle" font-size="12" fill="#fff" filter="url(#rough2)">7</text>
  <rect x="510" y="78" width="52" height="32" rx="4" fill="#4a4d57" stroke="#2e2e34" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="536" y="100" text-anchor="middle" font-size="12" fill="#fff" filter="url(#rough2)">8</text>
  <rect x="572" y="78" width="52" height="32" rx="4" fill="#4a4d57" stroke="#2e2e34" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="598" y="100" text-anchor="middle" font-size="12" fill="#fff" filter="url(#rough2)">9</text>

  <!-- dashed connectors -->
  <line x1="102" y1="110" x2="102" y2="142" stroke="#8a9bb0" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <line x1="164" y1="110" x2="164" y2="142" stroke="#8a9bb0" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <line x1="226" y1="110" x2="226" y2="142" stroke="#8a9bb0" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <line x1="288" y1="110" x2="288" y2="142" stroke="#8a9bb0" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <line x1="350" y1="110" x2="350" y2="142" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <line x1="412" y1="110" x2="412" y2="142" stroke="#8a9bb0" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <line x1="474" y1="110" x2="474" y2="142" stroke="#8a9bb0" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <line x1="536" y1="110" x2="536" y2="142" stroke="#8a9bb0" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <line x1="598" y1="110" x2="598" y2="142" stroke="#8a9bb0" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- row 2 labels 9..1 -->
  <rect x="76" y="142" width="52" height="32" rx="4" fill="#4a4d57" stroke="#2e2e34" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="102" y="164" text-anchor="middle" font-size="12" fill="#fff" filter="url(#rough2)">9</text>
  <rect x="138" y="142" width="52" height="32" rx="4" fill="#4a4d57" stroke="#2e2e34" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="164" y="164" text-anchor="middle" font-size="12" fill="#fff" filter="url(#rough2)">8</text>
  <rect x="200" y="142" width="52" height="32" rx="4" fill="#4a4d57" stroke="#2e2e34" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="226" y="164" text-anchor="middle" font-size="12" fill="#fff" filter="url(#rough2)">7</text>
  <rect x="262" y="142" width="52" height="32" rx="4" fill="#4a4d57" stroke="#2e2e34" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="288" y="164" text-anchor="middle" font-size="12" fill="#fff" filter="url(#rough2)">6</text>
  <rect x="324" y="142" width="52" height="32" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="350" y="164" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">5</text>
  <rect x="386" y="142" width="52" height="32" rx="4" fill="#4a4d57" stroke="#2e2e34" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="412" y="164" text-anchor="middle" font-size="12" fill="#fff" filter="url(#rough2)">4</text>
  <rect x="448" y="142" width="52" height="32" rx="4" fill="#4a4d57" stroke="#2e2e34" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="474" y="164" text-anchor="middle" font-size="12" fill="#fff" filter="url(#rough2)">3</text>
  <rect x="510" y="142" width="52" height="32" rx="4" fill="#4a4d57" stroke="#2e2e34" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="536" y="164" text-anchor="middle" font-size="12" fill="#fff" filter="url(#rough2)">2</text>
  <rect x="572" y="142" width="52" height="32" rx="4" fill="#4a4d57" stroke="#2e2e34" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="598" y="164" text-anchor="middle" font-size="12" fill="#fff" filter="url(#rough2)">1</text>

  <text x="340" y="192" text-anchor="middle" font-size="11" fill="#8a3b37" filter="url(#rough2)">第 5 列 k−i = i 被跳过 ⇒ 黑点 = {1,2,3,4,6,7,8,9}，5 号始终不黑</text>

  <!-- box B: n even -->
  <rect x="24" y="214" width="306" height="86" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="177" y="238" text-anchor="middle" font-size="12" fill="#2f5220" font-weight="bold" filter="url(#rough2)">n 偶数：k = n+1，全部变黑</text>
  <text x="177" y="260" text-anchor="middle" font-size="10.5" fill="#3f6b30" filter="url(#rough2)">配对 (1,n), (2,n−1), … 共 n/2 对</text>
  <text x="177" y="281" text-anchor="middle" font-size="10.5" fill="#3f6b30" filter="url(#rough2)">黑点 = n、灰点 = 0 ⇒ 唯一最优</text>

  <!-- box C: n odd -->
  <rect x="350" y="214" width="306" height="86" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="503" y="238" text-anchor="middle" font-size="12" fill="#6b4e12" font-weight="bold" filter="url(#rough2)">n 奇数：黑点最多 n−1</text>
  <text x="503" y="260" text-anchor="middle" font-size="10.5" fill="#8a6415" filter="url(#rough2)">只有 k = n、n+1、n+2 能达到</text>
  <text x="503" y="281" text-anchor="middle" font-size="10.5" fill="#8a6415" filter="url(#rough2)">三个 k 各剩一个点 m 不黑，灰点 ≤ 1</text>

  <!-- box D: candidates -->
  <rect x="24" y="316" width="196" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="122" y="346" text-anchor="middle" font-size="12" fill="#8a3b37" filter="url(#rough2)">k = n ⇒ m = n</text>
  <rect x="242" y="316" width="196" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="340" y="346" text-anchor="middle" font-size="12" fill="#8a3b37" filter="url(#rough2)">k = n+1 ⇒ m = (n+1)/2</text>
  <rect x="460" y="316" width="196" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="558" y="346" text-anchor="middle" font-size="12" fill="#8a3b37" filter="url(#rough2)">k = n+2 ⇒ m = 1</text>
  <text x="340" y="390" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">灰点 = 1 ⟺ m 落在某个配对路径的内部；否则灰点 = 0，任选一个 k</text>
</svg>
