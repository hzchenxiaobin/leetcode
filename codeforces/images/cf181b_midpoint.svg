<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="93"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="440" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">181B：B 是 AC 的中点 ⟺ A + C = 2B</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <circle cx="156.0" cy="254.0" r="8.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="202.0" cy="208.0" r="8.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="248.0" cy="162.0" r="8.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="156.0" y1="254.0" x2="248.0" y2="162.0" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="148.0" y="242.0" text-anchor="end" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">A</text>
  <text x="212.0" y="198.0" text-anchor="start" font-size="11" fill="#8a6015" font-weight="bold" filter="url(#rough2)">B（中点）</text>
  <text x="258.0" y="166.0" text-anchor="start" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">C</text>
  <rect x="400.0" y="96.0" width="280.0" height="110.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="414.0" y="119.0" text-anchor="start" font-size="11" fill="#3f3420" filter="url(#rough2)">A + C = (2,2) + (6,6) = (8,8)</text>
  <text x="414.0" y="145.0" text-anchor="start" font-size="11" fill="#3f3420" filter="url(#rough2)">2B = (4,4) + (4,4) = (8,8) ✓</text>
  <text x="414.0" y="171.0" text-anchor="start" font-size="11" fill="#3f3420" filter="url(#rough2)">所以 (A,B,C) 是一个合法三元组</text>
  <rect x="400.0" y="224.0" width="280.0" height="110.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="414.0" y="247.0" text-anchor="start" font-size="11" fill="#3f3420" filter="url(#rough2)">枚举所有无序点对 (A,C)</text>
  <text x="414.0" y="273.0" text-anchor="start" font-size="11" fill="#3f3420" filter="url(#rough2)">中点 B 若在点集里就 +1</text>
  <text x="414.0" y="299.0" text-anchor="start" font-size="11" fill="#3f3420" filter="url(#rough2)">每个三元组只被数一次</text>
  <text x="40.0" y="400.0" text-anchor="start" font-size="11.5" fill="#444" filter="url(#rough2)">点对共 n(n−1)/2 ≤ 4.5×10⁶，用哈希表 O(1) 查询中点。</text>
</svg>
