<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="81"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="da3" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2f5223"/>
    </marker>
  </defs>
  <rect width="720" height="330" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">方案：拆一条多余边，再把两个连通块连起来</text>

  <!-- 左：拆 -->
  <g filter="url(#rough2)">
    <circle cx="120" cy="110" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="120" y="115" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66">1</text>
    <circle cx="230" cy="110" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="230" y="115" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66">2</text>
    <circle cx="175" cy="190" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="175" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66">3</text>
  </g>
  <line x1="120" y1="110" x2="230" y2="110" stroke="#8a94a6" stroke-width="2" filter="url(#rough2)"/>
  <line x1="230" y1="110" x2="175" y2="190" stroke="#8a94a6" stroke-width="2" filter="url(#rough2)"/>
  <line x1="175" y1="190" x2="120" y2="110" stroke="#b85450" stroke-width="2.4" stroke-dasharray="7 4" filter="url(#rough2)"/>
  <text x="72" y="160" font-size="11.5" fill="#8f3b37" filter="url(#rough2)">拆 (3,1)</text>

  <!-- 右：连 -->
  <g filter="url(#rough2)">
    <circle cx="420" cy="110" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="420" y="115" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66">1</text>
    <circle cx="530" cy="110" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="530" y="115" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66">2</text>
    <circle cx="475" cy="190" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="475" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66">3</text>
    <circle cx="620" cy="190" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="620" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223">4</text>
    <circle cx="670" cy="120" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="670" y="125" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223">5</text>
  </g>
  <line x1="420" y1="110" x2="530" y2="110" stroke="#8a94a6" stroke-width="2" filter="url(#rough2)"/>
  <line x1="530" y1="110" x2="475" y2="190" stroke="#8a94a6" stroke-width="2" filter="url(#rough2)"/>
  <line x1="620" y1="190" x2="670" y2="120" stroke="#8a94a6" stroke-width="2" filter="url(#rough2)"/>
  <line x1="420" y1="110" x2="620" y2="190" stroke="#2f5223" stroke-width="2.6" marker-end="url(#da3)" filter="url(#rough2)"/>
  <text x="520" y="160" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">新修 (1,4)</text>

  <rect x="60" y="256" width="600" height="56" rx="9" fill="#eef4ec" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="76" y="280" font-size="12.5" fill="#2f5223" filter="url(#rough2)">每天：拆掉第 i 条多余边，修一条 (代表点 i, 代表点 i+1)；共 c−1 天。</text>
  <text x="76" y="302" font-size="12.5" fill="#2f5223" filter="url(#rough2)">拆多余边不改变连通块（它在环上），加边恰好把两块合并 ⇒ 最终是树。</text>
</svg>
