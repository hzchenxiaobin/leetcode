<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1401"/>
    <feDisplacementMap in="SourceGraphic" scale="1.5"/></filter></defs>
  <rect width="700" height="300" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">三种判定：开头 miao. / 结尾 lala. / 两者同时</text>
  <path d="M 120 40 Q 350 46 580 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="60" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="13" fill="#22314a" filter="url(#rough2)">Rainbow 的口头禅在**开头**：s 以 "miao." 起头</text>
  <text x="76" y="104" font-size="13" fill="#22314a" filter="url(#rough2)">Freda 的口头禅在**结尾**：s 以 "lala." 收尾</text>
  <g filter="url(#rough2)"><rect x="60" y="130" width="580" height="86" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="76" y="154" font-size="13" fill="#8a6015" filter="url(#rough2)">两者同时成立 ⇒ **认不出**（OMG&gt;.&lt; I don't know!）</text>
  <text x="76" y="178" font-size="13" fill="#8a6015" filter="url(#rough2)">只满足开头 ⇒ Rainbow's；只满足结尾 ⇒ Freda's</text>
  <text x="76" y="200" font-size="13" fill="#8a6015" filter="url(#rough2)">都不满足 ⇒ 也认不出</text>
  <g filter="url(#rough2)"><rect x="60" y="228" width="580" height="56" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="252" font-size="12.5" fill="#2f5223" filter="url(#rough2)">样例：以 "lala." 结尾的那句 → Freda's；"miao." → Rainbow's；"miao.lala." → 认不出</text>
  <text x="76" y="274" font-size="12.5" fill="#2f5223" filter="url(#rough2)">"miao ."（点在空格后）不匹配前缀 ⇒ 认不出 ✓</text>
</svg>
