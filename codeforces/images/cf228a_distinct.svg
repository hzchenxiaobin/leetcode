<svg xmlns="http://www.w3.org/2000/svg" width="840" height="340" viewBox="0 0 840 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="340" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">四种颜色里重复的需要买新的补上</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">例：1 7 3 3 只有 3 种颜色</text>
  <g filter="url(#rough2)"><rect x="180" y="100" width="90" height="60" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#667788" stroke-width="1.3"/></g>
  <text x="225" y="140" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="300" y="100" width="90" height="60" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#667788" stroke-width="1.3"/></g>
  <text x="345" y="140" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">7</text>
  <g filter="url(#rough2)"><rect x="420" y="100" width="90" height="60" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#667788" stroke-width="1.3"/></g>
  <text x="465" y="140" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="540" y="100" width="90" height="60" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#667788" stroke-width="1.3"/></g>
  <text x="585" y="140" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="420" y="200" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">不同的颜色只有 3 种 ⇒ 最多保留 3 只，需要买 4 − 3 = 1 只</text>
  <g filter="url(#rough2)"><rect x="250" y="222" width="340" height="44" rx="4" fill="#faf3ec" fill-opacity="0.85" stroke="#c8a48a" stroke-width="1.3"/></g>
  <text x="420" y="250" text-anchor="middle" font-size="14" font-weight="bold" fill="#3d6b2f" filter="url(#rough2)">答案 = 4 − 不同颜色数</text>
  <text x="420" y="296" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">下界：每种颜色至多保留一只；可达：买的新颜色互不相同</text>
</svg>
