<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="19" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="760" height="470" fill="#fafafa"/>

  <text x="380" y="27" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">n = 16 演算：N = ⌊16/4⌋ = 4，只有分量 c = 1</text>
  <text x="380" y="46" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">费用 m1..m16 = 3 1 4 1 5 9 2 6 5 3 5 8 9 7 9 3（自造示例）</text>

  <g filter="url(#rough2)">
    <rect x="32" y="58" width="168" height="30" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="212" y="58" width="168" height="30" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="392" y="58" width="168" height="30" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="572" y="58" width="156" height="30" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#33517a" filter="url(#rough2)">
    <text x="116" y="78">a=1：{1,2,3,4}</text>
    <text x="296" y="78">a=2：{2,4,6,8}</text>
    <text x="476" y="78">a=3：{3,6,9,12}</text>
    <text x="650" y="78">a=4：{4,8,12,16}</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="32" y="100" width="696" height="72" rx="10" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.2"/>
  </g>
  <text x="46" y="122" font-size="10.5" fill="#33517a" font-weight="bold" filter="url(#rough2)">行 j=2（无约束；元素只有 9）</text>
  <g filter="url(#rough2)">
    <rect x="46" y="130" width="196" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="256" y="130" width="196" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#333" filter="url(#rough2)">
    <text x="144" y="150">dp[∅] = 0</text>
    <text x="354" y="150">dp[{0}] = m9 = 5</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="32" y="184" width="696" height="80" rx="10" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.2"/>
  </g>
  <text x="46" y="206" font-size="10.5" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">行 j=1（约束 a=3；元素 3,6,12）—— 超集最小 g[∅]=0, g[{0}]=5</text>
  <g filter="url(#rough2)">
    <rect x="46" y="214" width="196" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="256" y="214" width="196" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="466" y="214" width="196" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#2e6e2e" filter="url(#rough2)">
    <text x="144" y="234">dp[∅] = 0 + 5 = 5</text>
    <text x="354" y="234">dp[{0}] = 4 + 0 = 4</text>
    <text x="564" y="234">dp[{2}] = 5 + 0 = 5</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="32" y="276" width="696" height="88" rx="10" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.2"/>
  </g>
  <text x="46" y="298" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">行 j=0（约束 a=1,2,4；元素 1,2,4,8,16）—— g 已由行 j=1 求出</text>
  <g filter="url(#rough2)">
    <rect x="46" y="306" width="196" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="256" y="306" width="196" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="466" y="306" width="196" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#8a6d3b" filter="url(#rough2)">
    <text x="144" y="326">dp[{0}] = 3 + 14 = 17</text>
    <text x="354" y="326">dp[{1}] = 1 + 5 = 6</text>
    <text x="564" y="326">dp[{2}] = 1 + 4 = 5 ← 最优</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 380 372 L 380 388" stroke="#3a3a3a" stroke-width="1.5" fill="none" marker-end="url(#arr3)"/>
  </g>

  <g filter="url(#rough2)">
    <rect x="32" y="394" width="696" height="56" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="380" y="418" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">答案 = 5：删除 {3, 4}，费用 m3 + m4 = 4 + 1 = 5</text>
  <text x="380" y="438" text-anchor="middle" font-size="10.5" fill="#3d6b3d" filter="url(#rough2)">4 在超边 1,2,4 中，3 在超边 1,3 中 ⇒ 四条超边全被命中，4-beauty 从 4 降到 0</text>
</svg>
