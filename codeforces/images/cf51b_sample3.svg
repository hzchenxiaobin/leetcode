<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="720" height="420" fill="#fafafa"/>
  <text x="360.0" y="33" font-size="20" font-weight="bold" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">样例 3：四层嵌套，最里层有 3 个格子</text>
  <path d="M 250 44 Q 360.0 50 470 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="24" y="62" width="448" height="316" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="36" y="84" font-size="12" font-weight="bold" fill="#22303f" text-anchor="start" filter="url(#rough2)">表① 直接格：1</text>
  <rect x="52" y="96" width="392" height="268" rx="8" fill="#f6f1e3" stroke="#b08a2e" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="64" y="118" font-size="12" font-weight="bold" fill="#5b4a2a" text-anchor="start" filter="url(#rough2)">表② 直接格：1</text>
  <rect x="80" y="130" width="336" height="220" rx="8" fill="#eef6ee" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="92" y="152" font-size="12" font-weight="bold" fill="#2f5223" text-anchor="start" filter="url(#rough2)">表③ 直接格：1</text>
  <rect x="108" y="164" width="280" height="172" rx="8" fill="#fdeeee" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="120" y="186" font-size="12" font-weight="bold" fill="#7a3b36" text-anchor="start" filter="url(#rough2)">表④ 直接格：3</text>
  <rect x="134" y="200" width="236" height="54" rx="4" fill="none" stroke="#b85450" stroke-width="1.0" filter="url(#rough2)"/>
  <rect x="134" y="268" width="236" height="54" rx="4" fill="none" stroke="#b85450" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="140" y="214" font-size="9" font-weight="normal" fill="#7a3b36" text-anchor="start" filter="url(#rough2)">row 1</text>
  <text x="140" y="282" font-size="9" font-weight="normal" fill="#7a3b36" text-anchor="start" filter="url(#rough2)">row 2</text>
  <rect x="178" y="212" width="78" height="34" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="217" y="234" font-size="11" font-weight="normal" fill="#7a3b36" text-anchor="middle" filter="url(#rough2)">格</text>
  <rect x="270" y="212" width="78" height="34" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="309" y="234" font-size="11" font-weight="normal" fill="#7a3b36" text-anchor="middle" filter="url(#rough2)">格</text>
  <rect x="178" y="280" width="78" height="34" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="217" y="302" font-size="11" font-weight="normal" fill="#7a3b36" text-anchor="middle" filter="url(#rough2)">格</text>
  <text x="140" y="332" font-size="10" font-weight="normal" fill="#7a3b36" text-anchor="start" filter="url(#rough2)">表④ 共有 2 + 1 = 3 个直接格</text>
  <rect x="492" y="74" width="204" height="120" rx="8" fill="#f3f6fa" stroke="#9aa8b8" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="594" y="98" font-size="12" font-weight="bold" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">记录到的尺寸</text>
  <text x="594" y="124" font-size="15" font-weight="normal" fill="#22303f" text-anchor="middle" filter="url(#rough2)">1, 1, 1, 3</text>
  <text x="594" y="150" font-size="10" font-weight="normal" fill="#666" text-anchor="middle" filter="url(#rough2)">（内层先弹出）</text>
  <text x="594" y="174" font-size="10.5" font-weight="normal" fill="#555" text-anchor="middle" filter="url(#rough2)">排序后不变</text>
  <text x="594" y="232" font-size="12" font-weight="bold" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">输出：</text>
  <text x="594" y="262" font-size="20" font-weight="bold" fill="#2f5223" text-anchor="middle" filter="url(#rough2)">1 1 1 3</text>
  <text x="360" y="404" font-size="11.5" font-weight="normal" fill="#555" text-anchor="middle" filter="url(#rough2)">外层表不会把内层的 &lt;td&gt; 算进自己的格子数：每个 &lt;td&gt; 只属于它最近的那张表。</text>
</svg>
