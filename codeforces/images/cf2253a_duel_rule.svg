<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="420" fill="#fafafa"/>

  <text x="380" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：赢家只能是最大的那张 n+1，且它必须是质数</text>
  <path d="M 110 44 Q 380 51 650 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 卡牌行：n = 6，牌面 2..7 -->
  <text x="40" y="86" font-size="12.5" fill="#66788c" filter="url(#rough2)">以 n = 6 为例，牌堆 = {2, 3, 4, 5, 6, 7}：</text>

  <rect x="40" y="100" width="72" height="58" rx="6" fill="#ffffff" stroke="#8c9bab" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="76" y="136" text-anchor="middle" font-size="20" fill="#5a6b7b" filter="url(#rough2)">2</text>

  <rect x="158" y="100" width="72" height="58" rx="6" fill="#ffffff" stroke="#8c9bab" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="194" y="136" text-anchor="middle" font-size="20" fill="#5a6b7b" filter="url(#rough2)">3</text>

  <rect x="276" y="100" width="72" height="58" rx="6" fill="#ffffff" stroke="#8c9bab" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="312" y="136" text-anchor="middle" font-size="20" fill="#5a6b7b" filter="url(#rough2)">4</text>

  <rect x="394" y="100" width="72" height="58" rx="6" fill="#ffffff" stroke="#8c9bab" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="430" y="136" text-anchor="middle" font-size="20" fill="#5a6b7b" filter="url(#rough2)">5</text>

  <rect x="512" y="100" width="72" height="58" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="548" y="136" text-anchor="middle" font-size="20" fill="#a14340" filter="url(#rough2)">6</text>

  <rect x="630" y="100" width="72" height="58" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="666" y="136" text-anchor="middle" font-size="20" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">7</text>

  <!-- 每张牌的判定说明 -->
  <text x="76" y="180" text-anchor="middle" font-size="10.5" fill="#a14340" filter="url(#rough2)">输给 3</text>
  <text x="76" y="194" text-anchor="middle" font-size="10.5" fill="#a14340" filter="url(#rough2)">(3 更大)</text>

  <text x="194" y="180" text-anchor="middle" font-size="10.5" fill="#a14340" filter="url(#rough2)">输给 4</text>
  <text x="194" y="194" text-anchor="middle" font-size="10.5" fill="#a14340" filter="url(#rough2)">(4 更大)</text>

  <text x="312" y="180" text-anchor="middle" font-size="10.5" fill="#a14340" filter="url(#rough2)">输给 2</text>
  <text x="312" y="194" text-anchor="middle" font-size="10.5" fill="#a14340" filter="url(#rough2)">(2 整除 4)</text>

  <text x="430" y="180" text-anchor="middle" font-size="10.5" fill="#a14340" filter="url(#rough2)">输给 6</text>
  <text x="430" y="194" text-anchor="middle" font-size="10.5" fill="#a14340" filter="url(#rough2)">(6 更大)</text>

  <text x="548" y="180" text-anchor="middle" font-size="10.5" fill="#a14340" filter="url(#rough2)">输给 2</text>
  <text x="548" y="194" text-anchor="middle" font-size="10.5" fill="#a14340" filter="url(#rough2)">(2 整除 6)</text>

  <text x="666" y="180" text-anchor="middle" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">无真因子</text>
  <text x="666" y="194" text-anchor="middle" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">→ 全胜 ✓</text>

  <path d="M 110 206 Q 400 213 640 206" stroke="#c9d3dc" stroke-width="1.1" fill="none" filter="url(#rough2)"/>

  <!-- 左：两条判负理由 -->
  <rect x="40" y="224" width="330" height="72" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="250" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">理由一：x ≤ n 时，牌 x+1 一定在堆里</text>
  <text x="56" y="272" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">x+1 更大且互不整除 → 大的赢，x 输。</text>
  <text x="56" y="288" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">所以只有最大的 x = n+1 有资格全胜。</text>

  <!-- 右：合数判负 -->
  <rect x="390" y="224" width="330" height="72" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="406" y="250" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">理由二：n+1 是合数时，它的真因子在堆里</text>
  <text x="406" y="272" font-size="11.5" fill="#8a6015" filter="url(#rough2)">n+1 = a·b（2 ≤ a &lt; n+1）→ a 整除 n+1，</text>
  <text x="406" y="288" font-size="11.5" fill="#8a6015" filter="url(#rough2)">小牌 a 赢，n+1 输。故合数不行。</text>

  <!-- 结论 -->
  <rect x="150" y="316" width="460" height="44" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="380" y="344" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">答案：YES ⟺ n+1 是质数</text>

  <path d="M 380 298 L 380 314" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="380" y="384" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">n=6：7 无真因子 → 7 与任何更小的牌都互不整除 → 「更大者赢」→ 7 全胜</text>
  <text x="380" y="404" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">n=5：6 = 2·3，牌 2 在堆里且整除 6 → 6 被 2 击败，无赢家</text>
</svg>
