<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="300" fill="#fafafa"/>
  <text x="360.0" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">208E：样例森林与三次查询</text>
  <path d="M 144.00 46 Q 360.0 52 576.00 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="72" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">样例的森林：1 有孩子 2、3；4 有孩子 5、6。</text>
  <line x1="150" y1="100" x2="100" y2="180" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="150" y1="100" x2="200" y2="180" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="420" y1="100" x2="370" y2="180" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="420" y1="100" x2="470" y2="180" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="150" cy="100" r="16" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="150" y="104" text-anchor="middle" font-size="11" fill="#33506e" filter="url(#rough2)">1</text>
  <circle cx="100" cy="180" r="16" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="100" y="184" text-anchor="middle" font-size="11" fill="#33506e" filter="url(#rough2)">2</text>
  <circle cx="200" cy="180" r="16" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="200" y="184" text-anchor="middle" font-size="11" fill="#33506e" filter="url(#rough2)">3</text>
  <circle cx="420" cy="100" r="16" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="420" y="104" text-anchor="middle" font-size="11" fill="#33506e" filter="url(#rough2)">4</text>
  <circle cx="370" cy="180" r="16" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="370" y="184" text-anchor="middle" font-size="11" fill="#33506e" filter="url(#rough2)">5</text>
  <circle cx="470" cy="180" r="16" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="470" y="184" text-anchor="middle" font-size="11" fill="#33506e" filter="url(#rough2)">6</text>
  <text x="60" y="240" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">查询 (2,1)：祖先 1 的子树里深度 1 的点 = {2,3}，减去自己 ⇒ 1。</text>
  <text x="60" y="262" text-anchor="start" font-size="11" fill="#8a3a52" filter="url(#rough2)">查询 (1,1)：1 没有祖先 ⇒ 0；查询 (5,1)：祖先 4 的子树深度 1 = {5,6} ⇒ 1。</text>
</svg>
