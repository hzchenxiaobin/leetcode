<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="720" height="400" fill="#fafafa"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">操作只有两种：奇数 +1、偶数 /2</text>
  <path d="M 200 43 Q 360 49 520 43" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <rect x="60" y="76" width="280" height="110" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="76" y="102" text-anchor="start" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">x 为奇数：x ← x + 1</text>
  <text x="76" y="130" text-anchor="start" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">x 为偶数：x ← x / 2</text>
  <text x="76" y="160" text-anchor="start" font-size="11" fill="#777777" filter="url(#rough2)">目标：变成 1</text>
  <rect x="380" y="76" width="280" height="110" rx="7" fill="#e9f4e2" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="396" y="102" text-anchor="start" font-size="11.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">+1 只在最低位为 1 时发生</text>
  <text x="396" y="130" text-anchor="start" font-size="11" fill="#3c5e2e" filter="url(#rough2)">它把末尾一串 1 变成 0，</text>
  <text x="396" y="152" text-anchor="start" font-size="11" fill="#3c5e2e" filter="url(#rough2)">并向左进一位</text>
  <text x="396" y="172" text-anchor="start" font-size="11" fill="#3c5e2e" filter="url(#rough2)">/2 就是删掉最低位</text>
  <text x="60" y="220" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">串上模拟：低位指针从右往左走，遇到 0 就 /2，遇到 1 就 +1 再 /2</text>
  <rect x="80" y="242" width="46" height="40" rx="4" fill="#ffffff" stroke="#777777" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="103" y="269" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <rect x="132" y="242" width="46" height="40" rx="4" fill="#ffffff" stroke="#777777" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="155" y="269" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <rect x="184" y="242" width="46" height="40" rx="4" fill="#ffffff" stroke="#777777" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="207" y="269" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <rect x="236" y="242" width="46" height="40" rx="4" fill="#ffffff" stroke="#777777" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="259" y="269" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <rect x="288" y="242" width="46" height="40" rx="4" fill="#ffffff" stroke="#777777" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="311" y="269" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <rect x="340" y="242" width="46" height="40" rx="4" fill="#fdecea" stroke="#777777" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="363" y="269" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="402" y="269" text-anchor="start" font-size="10.5" fill="#b85450" filter="url(#rough2)">最低位为 1 → 先 +1</text>
  <rect x="60" y="300" width="600" height="60" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="76" y="326" text-anchor="start" font-size="11.5" fill="#8a6015" filter="url(#rough2)">进位沿着一串 1 向左走；每个位置被进位访问次数总共 O(1)，</text>
  <text x="76" y="348" text-anchor="start" font-size="11.5" fill="#8a6015" filter="url(#rough2)">整体 O(L)，L ≤ 10^6。</text>
</svg>
