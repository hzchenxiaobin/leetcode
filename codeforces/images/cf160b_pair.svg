<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="657"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="290" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">两半排序后逐位比较</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">全部 &lt; 或 全部 &gt; 才 YES</text>
  <text x="120" y="100" text-anchor="start" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">前半</text>
  <g filter="url(#rough2)"><rect x="200" y="84" width="56" height="40" rx="3" fill="#cfe0f5" fill-opacity="0.55" stroke="#446688" stroke-width="1.4"/></g>
  <text x="228" y="110" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="270" y="84" width="56" height="40" rx="3" fill="#cfe0f5" fill-opacity="0.55" stroke="#446688" stroke-width="1.4"/></g>
  <text x="298" y="110" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">7</text>
  <text x="120" y="170" text-anchor="start" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">后半</text>
  <g filter="url(#rough2)"><rect x="200" y="154" width="56" height="40" rx="3" fill="#dcecd2" fill-opacity="0.55" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="228" y="180" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <g filter="url(#rough2)"><rect x="270" y="154" width="56" height="40" rx="3" fill="#dcecd2" fill-opacity="0.55" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="298" y="180" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="520" y="110" text-anchor="start" font-size="12" fill="#4a7a3a" filter="url(#rough2)">3 &lt; 5 ✓</text>
  <text x="520" y="146" text-anchor="start" font-size="12" fill="#8a2b28" filter="url(#rough2)">7 &gt; 4 ✗</text>
  <text x="520" y="186" text-anchor="start" font-size="12.5" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">方向冲突 ⇒ NO</text>
  <text x="450" y="250" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">配对可任意重排 ⇒ 只需看两个多重集</text>
</svg>
