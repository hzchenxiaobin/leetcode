<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">重叠判定：同奇偶且起点相差 2 或 4 才会撞键</text>
  <text x="360" y="54" text-anchor="middle" font-size="13" fill="#777" filter="url(#rough2)">三和弦 x 占据键 x、x+2、x+4，n = 8 时起点只有 1..4</text>

  <!-- ================= 面板 A：不同奇偶 ================= -->
  <rect x="26" y="70" width="322" height="152" rx="10" fill="#ffffff"
        stroke="#c8d4e0" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="187" y="94" text-anchor="middle" font-size="15" fill="#4a7a3a" filter="url(#rough2)">起点奇偶不同 ⇒ 必不相交</text>

  <rect x="48" y="108" width="34" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="65" y="132" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="88" y="108" width="34" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="105" y="132" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <rect x="128" y="108" width="34" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="145" y="132" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <rect x="168" y="108" width="34" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="185" y="132" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">4</text>
  <rect x="208" y="108" width="34" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="225" y="132" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">5</text>
  <rect x="248" y="108" width="34" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="265" y="132" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">6</text>
  <rect x="288" y="108" width="34" height="36" rx="4" fill="#eef0f2" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="305" y="132" text-anchor="middle" font-size="15" fill="#999" filter="url(#rough2)">7</text>

  <text x="70" y="166" font-size="13" fill="#446688" filter="url(#rough2)">蓝 = x=1　键 1,3,5</text>
  <text x="70" y="186" font-size="13" fill="#4a7a3a" filter="url(#rough2)">绿 = x=2　键 2,4,6</text>
  <text x="187" y="208" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">两个键集没有公共键 ✓</text>

  <!-- ================= 面板 B：同奇偶，距离 2 ================= -->
  <rect x="372" y="70" width="322" height="152" rx="10" fill="#ffffff"
        stroke="#e0cdb0" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="533" y="94" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">同奇偶且距离 2 ⇒ 共用两个键</text>

  <rect x="394" y="108" width="34" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="411" y="132" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="434" y="108" width="34" height="36" rx="4" fill="#eef0f2" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="451" y="132" text-anchor="middle" font-size="15" fill="#999" filter="url(#rough2)">2</text>
  <rect x="474" y="108" width="34" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="491" y="132" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <rect x="514" y="108" width="34" height="36" rx="4" fill="#eef0f2" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="531" y="132" text-anchor="middle" font-size="15" fill="#999" filter="url(#rough2)">4</text>
  <rect x="554" y="108" width="34" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="571" y="132" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">5</text>
  <rect x="594" y="108" width="34" height="36" rx="4" fill="#eef0f2" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="611" y="132" text-anchor="middle" font-size="15" fill="#999" filter="url(#rough2)">6</text>
  <rect x="634" y="108" width="34" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="651" y="132" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">7</text>

  <text x="416" y="166" font-size="13" fill="#446688" filter="url(#rough2)">蓝 = x=1　键 1,3,5</text>
  <text x="416" y="186" font-size="13" fill="#d6a040" filter="url(#rough2)">橙 = x=3　键 3,5,7</text>
  <text x="533" y="208" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">红格 3、5 被两把共用 ✗</text>

  <!-- ================= 通用规则 ================= -->
  <text x="34" y="252" font-size="14" fill="#333" filter="url(#rough2)">· 起点差 2：共用 2 个键（x+2 与 x+4）</text>
  <text x="34" y="278" font-size="14" fill="#333" filter="url(#rough2)">· 起点差 4：共用 1 个键（x+4）</text>
  <text x="34" y="304" font-size="14" fill="#333" filter="url(#rough2)">· 起点差 ≥ 6 或奇偶不同：键集完全分离</text>

  <rect x="150" y="322" width="420" height="54" rx="10" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="360" y="356" text-anchor="middle" font-size="16" fill="#2f5d25" filter="url(#rough2)">不相交 ⟺ 奇偶不同 或 |x − y| ≥ 6</text>
</svg>
