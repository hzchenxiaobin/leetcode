<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="331"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="290" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2：k = 3 的三进制乘法表</text>
  <g filter="url(#rough2)">
    <rect x="180" y="60" width="90" height="50" rx="6" fill="#f4f6f9" stroke="#8a94a6" stroke-width="1.4"/>
    <text x="225" y="91" text-anchor="middle" font-size="14" fill="#2b2b2b">1</text>
    <rect x="280" y="60" width="90" height="50" rx="6" fill="#f4f6f9" stroke="#8a94a6" stroke-width="1.4"/>
    <text x="325" y="91" text-anchor="middle" font-size="14" fill="#2b2b2b">2</text>
    <rect x="180" y="120" width="90" height="50" rx="6" fill="#f4f6f9" stroke="#8a94a6" stroke-width="1.4"/>
    <text x="225" y="151" text-anchor="middle" font-size="14" fill="#2b2b2b">2</text>
    <rect x="280" y="120" width="90" height="50" rx="6" fill="#eef4ec" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="325" y="151" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5223">11</text>
  </g>
  <text x="470" y="91" font-size="12" fill="#2f4a66" filter="url(#rough2)">← 1×1 = 1, 1×2 = 2</text>
  <text x="470" y="151" font-size="12" fill="#2f5223" filter="url(#rough2)">← 2×2 = 4 = (11)₃</text>
  <rect x="100" y="200" width="520" height="60" rx="9" fill="#eef4ec" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="116" y="224" font-size="12.5" fill="#2f5223" filter="url(#rough2)">共 k−1 = 2 行、2 列；行内用空格分隔（数量不限）。</text>
  <text x="116" y="246" font-size="12.5" fill="#2f5223" filter="url(#rough2)">输出两行：`1 2` 与 `2 11`。</text>
</svg>
