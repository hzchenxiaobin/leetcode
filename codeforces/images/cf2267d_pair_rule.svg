<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="21"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="820" height="500" fill="#fafafa"/>

  <text x="410" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">判据：按值降序两两配对，每对必须一奇一偶</text>
  <path d="M 200 44 Q 410 52 620 44" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- 面板 A -->
  <rect x="34" y="58" width="372" height="204" rx="10" fill="#f7fbf7" stroke="#a9a9a9"
        stroke-width="1.2" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="50" y="82" font-size="13" fill="#3c5e2e" filter="url(#rough2)">样例 3：a = 5 3 4 6 2 1 → YES</text>

  <rect x="50" y="94" width="48" height="46" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="74" y="117" text-anchor="middle" font-size="15" fill="#3c5e2e" filter="url(#rough2)">6</text>
  <text x="74" y="133" text-anchor="middle" font-size="10" fill="#3c5e2e" filter="url(#rough2)">@4</text>
  <rect x="104" y="94" width="48" height="46" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="128" y="117" text-anchor="middle" font-size="15" fill="#2f4a66" filter="url(#rough2)">5</text>
  <text x="128" y="133" text-anchor="middle" font-size="10" fill="#2f4a66" filter="url(#rough2)">@1</text>
  <rect x="158" y="94" width="48" height="46" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="182" y="117" text-anchor="middle" font-size="15" fill="#2f4a66" filter="url(#rough2)">4</text>
  <text x="182" y="133" text-anchor="middle" font-size="10" fill="#2f4a66" filter="url(#rough2)">@3</text>
  <rect x="212" y="94" width="48" height="46" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="236" y="117" text-anchor="middle" font-size="15" fill="#3c5e2e" filter="url(#rough2)">3</text>
  <text x="236" y="133" text-anchor="middle" font-size="10" fill="#3c5e2e" filter="url(#rough2)">@2</text>
  <rect x="266" y="94" width="48" height="46" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="117" text-anchor="middle" font-size="15" fill="#2f4a66" filter="url(#rough2)">2</text>
  <text x="290" y="133" text-anchor="middle" font-size="10" fill="#2f4a66" filter="url(#rough2)">@5</text>
  <rect x="320" y="94" width="48" height="46" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="344" y="117" text-anchor="middle" font-size="15" fill="#3c5e2e" filter="url(#rough2)">1</text>
  <text x="344" y="133" text-anchor="middle" font-size="10" fill="#3c5e2e" filter="url(#rough2)">@6</text>

  <path d="M 50 146 L 50 156 L 152 156 L 152 146" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="101" y="174" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">✓ 偶 / 奇</text>
  <path d="M 158 146 L 158 156 L 260 156 L 260 146" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="209" y="174" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">✓ 奇 / 偶</text>
  <path d="M 266 146 L 266 156 L 368 156 L 368 146" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="317" y="174" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">✓ 奇 / 偶</text>
  <text x="220" y="204" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">三对都异类 ⇒ YES</text>

  <!-- 面板 B -->
  <rect x="414" y="58" width="372" height="204" rx="10" fill="#fdf7f7" stroke="#a9a9a9"
        stroke-width="1.2" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="430" y="82" font-size="13" fill="#8c3b38" filter="url(#rough2)">样例 7：a = 4 1 3 2 6 5 → NO</text>

  <rect x="430" y="94" width="48" height="46" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="454" y="117" text-anchor="middle" font-size="15" fill="#2f4a66" filter="url(#rough2)">6</text>
  <text x="454" y="133" text-anchor="middle" font-size="10" fill="#2f4a66" filter="url(#rough2)">@5</text>
  <rect x="484" y="94" width="48" height="46" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="508" y="117" text-anchor="middle" font-size="15" fill="#3c5e2e" filter="url(#rough2)">5</text>
  <text x="508" y="133" text-anchor="middle" font-size="10" fill="#3c5e2e" filter="url(#rough2)">@6</text>
  <rect x="538" y="94" width="48" height="46" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="562" y="117" text-anchor="middle" font-size="15" fill="#2f4a66" filter="url(#rough2)">4</text>
  <text x="562" y="133" text-anchor="middle" font-size="10" fill="#2f4a66" filter="url(#rough2)">@1</text>
  <rect x="592" y="94" width="48" height="46" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.1" filter="url(#rough2)"/>
  <text x="616" y="117" text-anchor="middle" font-size="15" fill="#8c3b38" filter="url(#rough2)">3</text>
  <text x="616" y="133" text-anchor="middle" font-size="10" fill="#8c3b38" filter="url(#rough2)">@3</text>
  <rect x="646" y="94" width="48" height="46" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="670" y="117" text-anchor="middle" font-size="15" fill="#3c5e2e" filter="url(#rough2)">2</text>
  <text x="670" y="133" text-anchor="middle" font-size="10" fill="#3c5e2e" filter="url(#rough2)">@4</text>
  <rect x="700" y="94" width="48" height="46" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="724" y="117" text-anchor="middle" font-size="15" fill="#3c5e2e" filter="url(#rough2)">1</text>
  <text x="724" y="133" text-anchor="middle" font-size="10" fill="#3c5e2e" filter="url(#rough2)">@2</text>

  <path d="M 430 146 L 430 156 L 532 156 L 532 146" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="481" y="174" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">✓ 奇 / 偶</text>
  <path d="M 538 146 L 538 156 L 640 156 L 640 146" stroke="#b85450" stroke-width="1.9" fill="none" filter="url(#rough2)"/>
  <text x="589" y="174" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">✗ 奇 / 奇</text>
  <path d="M 646 146 L 646 156 L 748 156 L 748 146" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="697" y="174" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">✗ 偶 / 偶</text>
  <text x="600" y="204" text-anchor="middle" font-size="12.5" fill="#8c3b38" filter="url(#rough2)">第 2 对同为奇数下标 ⇒ NO</text>

  <!-- 推导要点 -->
  <rect x="50" y="282" width="720" height="140" rx="10" fill="none" stroke="#a9a9a9"
        stroke-width="1.3" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="70" y="310" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">① 峰的取值是全局最大 ⇒ 最大的 j 个值一定占据一段含峰的连续区间 [l, r]</text>
  <text x="70" y="338" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">② j 为奇数时 l、r 同奇偶，第 j+1 大的值只能落在与第 j 大相反的那一类</text>
  <text x="70" y="366" font-size="12.5" fill="#8c3b38" filter="url(#rough2)">③ 取 j = 2t−1 得必要条件：第 2t−1 大与第 2t 大的原下标必须一奇一偶</text>
  <text x="70" y="394" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">④ 它也是充分的：按同一规则从峰向两侧扩张，总能把所有值摆完（引理 4）</text>

  <text x="410" y="452" text-anchor="middle" font-size="12.5" fill="#446688"
        filter="url(#rough2)">实现：pos[值] = 原下标；v 从 n 起每步 −2，比较 pos[v] 与 pos[v−1] 的奇偶</text>
  <text x="410" y="476" text-anchor="middle" font-size="11.5" fill="#5a5a5a"
        filter="url(#rough2)">全部不同 ⇒ YES；任一对相同 ⇒ NO（n 为奇数时最小的值不参与配对）</text>
</svg>
