<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="330" fill="#fafafa"/>
  <text x="360.0" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">205A：最小值唯一才出发</text>
  <path d="M 144.00 46 Q 360.0 52 576.00 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="72" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">一趟扫描同时记录“当前最小值”和“它出现了几次”。</text>
  <text x="60" y="92" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">第二次遇到同样小的值时，就把计数加到 2 —— 之后只需判计数是否恰好为 1。</text>
  <rect x="90" y="130" width="64" height="46" rx="6" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="122" y="158" text-anchor="middle" font-size="13" fill="#3d3d3d" filter="url(#rough2)">7</text>
  <text x="122" y="192" text-anchor="middle" font-size="9.5" fill="#33506e" filter="url(#rough2)">i=1</text>
  <rect x="180" y="130" width="64" height="46" rx="6" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="212" y="158" text-anchor="middle" font-size="13" fill="#2f5b34" filter="url(#rough2)">4</text>
  <text x="212" y="192" text-anchor="middle" font-size="9.5" fill="#33506e" filter="url(#rough2)">i=2</text>
  <rect x="270" y="130" width="64" height="46" rx="6" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="302" y="158" text-anchor="middle" font-size="13" fill="#3d3d3d" filter="url(#rough2)">47</text>
  <text x="302" y="192" text-anchor="middle" font-size="9.5" fill="#33506e" filter="url(#rough2)">i=3</text>
  <rect x="360" y="130" width="64" height="46" rx="6" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="392" y="158" text-anchor="middle" font-size="13" fill="#3d3d3d" filter="url(#rough2)">100</text>
  <text x="392" y="192" text-anchor="middle" font-size="9.5" fill="#33506e" filter="url(#rough2)">i=4</text>
  <rect x="450" y="130" width="64" height="46" rx="6" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="482" y="158" text-anchor="middle" font-size="13" fill="#2f5b34" filter="url(#rough2)">4</text>
  <text x="482" y="192" text-anchor="middle" font-size="9.5" fill="#33506e" filter="url(#rough2)">i=5</text>
  <rect x="540" y="130" width="64" height="46" rx="6" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="572" y="158" text-anchor="middle" font-size="13" fill="#3d3d3d" filter="url(#rough2)">9</text>
  <text x="572" y="192" text-anchor="middle" font-size="9.5" fill="#33506e" filter="url(#rough2)">i=6</text>
  <text x="90" y="228" text-anchor="start" font-size="11" fill="#8a3a52" filter="url(#rough2)">最小值 4 出现两次（i=2 与 i=5）⇒ 无法决定 ⇒ 输出 Still Rozdil</text>
  <rect x="60" y="248" width="620" height="64" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="266" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">只需要一次遍历：O(n) 时间、O(1) 额外空间；n ≤ 10⁵，读入即可完成。</text>
  <text x="74" y="288" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">注意时间可达 10⁹，用 long long 或 int 均可（int 上限 2.1×10⁹ 也够）。</text>
</svg>
