<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="380" fill="#fafafa"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">F2 的树形背包：把 j 个名额分给各个儿子</text>
  <path d="M 193.36 46 Q 380.0 52 566.64 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="70.0" y="70.0" width="170.0" height="56.0" rx="8" fill="#fff3d6" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="155.0" y="104.0" text-anchor="middle" font-size="11.2" font-weight="bold" fill="#8a6015" filter="url(#rough2)">节点 v：cap = t[v]</text>
  <rect x="310.0" y="60.0" width="130.0" height="44.0" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="375.0" y="86.0" text-anchor="middle" font-size="11.0" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">儿子 u₁</text>
  <path d="M 242.0 98.0 L 308.0 82.0" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="310.0" y="130.0" width="130.0" height="44.0" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="375.0" y="156.0" text-anchor="middle" font-size="11.0" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">儿子 u₂</text>
  <path d="M 242.0 98.0 L 308.0 152.0" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="310.0" y="200.0" width="130.0" height="44.0" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="375.0" y="226.0" text-anchor="middle" font-size="11.0" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">终点串 t[v]</text>
  <path d="M 242.0 98.0 L 308.0 222.0" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="480.0" y="70.0" width="250.0" height="174.0" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="496.0" y="96.0" text-anchor="start" font-size="11.0" font-weight="bold" fill="#2f5b34" filter="url(#rough2)">dp[j] = 前几个儿子里选 j 个</text>
  <text x="496.0" y="122.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">ndp[j₁+j₂] = max( dp[j₁]</text>
  <text x="496.0" y="142.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">  + G[u][j₂] + ℓ·C(j₂,2) )</text>
  <text x="496.0" y="168.0" text-anchor="start" font-size="10.6" fill="#6b6b6b" filter="url(#rough2)">ℓ = 到儿子的边上有几层</text>
  <text x="496.0" y="190.0" text-anchor="start" font-size="10.6" fill="#6b6b6b" filter="url(#rough2)">终点串只占名额、不贡献更深层</text>
  <text x="496.0" y="212.0" text-anchor="start" font-size="10.6" fill="#6b6b6b" filter="url(#rough2)">⇒ 相当于 ℓ = 0 的儿子</text>
  <rect x="60.0" y="282.0" width="660.0" height="76.0" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="306.0" text-anchor="start" font-size="11.2" fill="#8a6015" filter="url(#rough2)">复杂度：合并两个大小 a、b 的背包代价 O(a·b)（截断到 k），</text>
  <text x="74.0" y="328.0" text-anchor="start" font-size="11.2" fill="#8a6015" filter="url(#rough2)">n ≤ 100、k ≤ 100 时随便写 O(n·k²) 都只有 10⁶；n = 2000 就得用 F3 的 O(n·k) 合并。</text>
</svg>
