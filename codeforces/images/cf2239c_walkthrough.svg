<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 450"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="780" height="450" fill="#fafafa"/>
  <text x="390" y="28" text-anchor="middle" font-size="15.5" fill="#333" filter="url(#rough2)">
    样例 4 走查：n=5，p1=1，p2=4，s3=0，p4=2，s5=4（答案 1 4 5 2 3）
  </text>

  <rect x="40" y="52" width="700" height="300" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="40" y="102" width="700" height="50" fill="#fff8e1" stroke="none" filter="url(#rough2)"/>
  <rect x="40" y="202" width="700" height="50" fill="#fff8e1" stroke="none" filter="url(#rough2)"/>
  <rect x="40" y="52" width="700" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="100" y1="52" x2="100" y2="352" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="250" y1="52" x2="250" y2="352" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="380" y1="52" x2="380" y2="352" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="660" y1="52" x2="660" y2="352" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="40" y1="102" x2="740" y2="102" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="40" y1="152" x2="740" y2="152" stroke="#9db4d0" stroke-width="1" filter="url(#rough2)"/>
  <line x1="40" y1="202" x2="740" y2="202" stroke="#9db4d0" stroke-width="1" filter="url(#rough2)"/>
  <line x1="40" y1="252" x2="740" y2="252" stroke="#9db4d0" stroke-width="1" filter="url(#rough2)"/>
  <line x1="40" y1="302" x2="740" y2="302" stroke="#9db4d0" stroke-width="1" filter="url(#rough2)"/>

  <text x="70" y="84" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">步 i</text>
  <text x="175" y="84" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">该位置给出的条件</text>
  <text x="315" y="84" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">可用值 S_i</text>
  <text x="520" y="84" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">关键计算</text>
  <text x="700" y="84" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">填 p_i</text>

  <text x="70" y="132" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="112" y="132" font-size="11.5" fill="#b85450" filter="url(#rough2)">s（段首）</text>
  <text x="262" y="132" font-size="11.5" fill="#446688" filter="url(#rough2)">1 2 3 4 5</text>
  <text x="390" y="122" font-size="11.5" fill="#333" filter="url(#rough2)">块={4}，const=0+3−0=3；K=5−4+3=4</text>
  <text x="390" y="140" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">v=3：rank 3 + cnt 1 = 4 ✓</text>
  <text x="700" y="132" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">3</text>

  <text x="70" y="182" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="112" y="182" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">p</text>
  <text x="262" y="182" font-size="11.5" fill="#446688" filter="url(#rough2)">1 2 4 5</text>
  <text x="390" y="182" font-size="11.5" fill="#333" filter="url(#rough2)">给定 2，直接删掉</text>
  <text x="700" y="182" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">2</text>

  <text x="70" y="232" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="112" y="232" font-size="11.5" fill="#b85450" filter="url(#rough2)">s（段首）</text>
  <text x="262" y="232" font-size="11.5" fill="#446688" filter="url(#rough2)">1 4 5</text>
  <text x="390" y="222" font-size="11.5" fill="#333" filter="url(#rough2)">块={1,2}，const=0+3−1=2；K=3−0+2=5</text>
  <text x="390" y="240" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">v=5：rank 3 + cnt 2 = 5 ✓</text>
  <text x="700" y="232" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">5</text>

  <text x="70" y="282" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="112" y="282" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">p</text>
  <text x="262" y="282" font-size="11.5" fill="#446688" filter="url(#rough2)">1 4</text>
  <text x="390" y="282" font-size="11.5" fill="#333" filter="url(#rough2)">给定 4，直接删掉</text>
  <text x="700" y="282" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">4</text>

  <text x="70" y="332" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="112" y="332" font-size="11.5" fill="#b85450" filter="url(#rough2)">s（i=1 特判）</text>
  <text x="262" y="332" font-size="11.5" fill="#446688" filter="url(#rough2)">1</text>
  <text x="390" y="332" font-size="11.5" fill="#333" filter="url(#rough2)">只剩一个可用值</text>
  <text x="700" y="332" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">1</text>

  <text x="42" y="378" font-size="12" fill="#333" filter="url(#rough2)">输出 1 4 5 2 3：前缀逆序对 s = [0,0,0,2,4]，命中 s3=0、s5=4 以及三个给定值 ✓</text>
  <text x="42" y="402" font-size="11.5" fill="#555" filter="url(#rough2)">每一步都只做「树上第 k 小」或「段首方程 + 树上二分」，用完即从可用集合删掉</text>
  <text x="42" y="426" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">段首的 const 由 s_{a−1}、#{v&gt;A_j}、块内上升对三部分组成（样例中分别是 0、3、1）</text>
</svg>
