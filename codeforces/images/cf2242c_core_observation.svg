<svg xmlns="http://www.w3.org/2000/svg" width="760" height="432" viewBox="0 0 760 432"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="432" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">有序数组里，每个不同值恰好被标记一张</text>
  <path d="M 196 42 Q 380 49 566 42" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- 数组格子 -->
  <text x="60" y="80" font-size="13" fill="#444" filter="url(#rough2)">a =</text>
  <rect x="96" y="62" width="48" height="42" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.3" filter="url(#rough2)"/>
  <text x="120" y="90" text-anchor="middle" font-size="17" font-weight="bold" fill="#8a6015" filter="url(#rough2)">1</text>
  <rect x="150" y="62" width="48" height="42" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="174" y="90" text-anchor="middle" font-size="17" fill="#2f4a66" filter="url(#rough2)">1</text>
  <rect x="204" y="62" width="48" height="42" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="228" y="90" text-anchor="middle" font-size="17" fill="#2f4a66" filter="url(#rough2)">1</text>
  <rect x="258" y="62" width="48" height="42" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.3" filter="url(#rough2)"/>
  <text x="282" y="90" text-anchor="middle" font-size="17" font-weight="bold" fill="#8a6015" filter="url(#rough2)">2</text>
  <rect x="312" y="62" width="48" height="42" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.3" filter="url(#rough2)"/>
  <text x="336" y="90" text-anchor="middle" font-size="17" font-weight="bold" fill="#8a6015" filter="url(#rough2)">4</text>
  <rect x="366" y="62" width="48" height="42" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="390" y="90" text-anchor="middle" font-size="17" fill="#2f4a66" filter="url(#rough2)">4</text>
  <rect x="420" y="62" width="48" height="42" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.3" filter="url(#rough2)"/>
  <text x="444" y="90" text-anchor="middle" font-size="17" font-weight="bold" fill="#8a6015" filter="url(#rough2)">5</text>

  <text x="490" y="78" font-size="12.5" fill="#8a6015" filter="url(#rough2)">橙色 = 被标记</text>
  <text x="490" y="97" font-size="12.5" fill="#555" filter="url(#rough2)">首个元素 + 每个新值的第一张</text>
  <text x="490" y="116" font-size="12.5" fill="#555" filter="url(#rough2)">⇒ 每个不同值正好一张</text>

  <text x="60" y="134" font-size="12.5" fill="#333" filter="url(#rough2)">计数向量：(c₁,c₂,c₄,c₅) = (3,1,2,1)，m = 4 个不同值</text>

  <!-- 分叉箭头 -->
  <path d="M 230 148 L 212 196" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 500 148 L 520 196" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 左：删除 -->
  <rect x="46" y="200" width="356" height="122" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="66" y="224" font-size="14" font-weight="bold" fill="#a14340" filter="url(#rough2)">① 删除全部标记</text>
  <text x="66" y="248" font-size="13" fill="#a14340" filter="url(#rough2)">每个计数 −1：(2,0,1,0)</text>
  <text x="66" y="272" font-size="13" fill="#a14340" filter="url(#rough2)">计数归零的值整组消失、不再复活</text>
  <text x="66" y="300" font-size="14" font-weight="bold" fill="#8a2a26" filter="url(#rough2)">→ [1,1,4]（长度 3）</text>

  <!-- 右：复制 -->
  <rect x="414" y="200" width="300" height="122" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="434" y="224" font-size="14" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">② 复制全部标记</text>
  <text x="434" y="248" font-size="13" fill="#3c5e2e" filter="url(#rough2)">每个计数 +1：(4,2,3,2)</text>
  <text x="434" y="272" font-size="13" fill="#3c5e2e" filter="url(#rough2)">每个不同值只多出一张，不会翻倍</text>
  <text x="434" y="300" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">→ [1,1,1,1,2,2,4,4,4,5,5]</text>

  <!-- 结论 -->
  <rect x="46" y="340" width="668" height="66" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="366" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">状态完全由「计数向量」决定：一次操作 = 全体 +1 或 全体 −1</text>
  <text x="380" y="390" text-anchor="middle" font-size="12" fill="#3f5c78" filter="url(#rough2)">谁被标记与具体数值无关，只与「谁是某个不同值的第一张」有关 —— 所以只需数每种值出现几次</text>
</svg>
