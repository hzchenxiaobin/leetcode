<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320" viewBox="0 0 700 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1345"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="700" height="320" fill="#fafafa"/>
  <text x="350.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">交换 ↔ 简单图</text>
  <path d="M 112.0 42 Q 350.0 48 588.0 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="350.0" y="306" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">第 i 人度数 = c_i；无自环、无重边</text>
  <circle cx="350.0" cy="70.0" r="24" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350.0" y="75.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">1</text>
  <circle cx="450.0" cy="170.0" r="24" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="450.0" y="175.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">2</text>
  <circle cx="350.0" cy="270.0" r="24" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350.0" y="275.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">3</text>
  <circle cx="250.0" cy="170.0" r="24" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250.0" y="175.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">4</text>
  <line x1="350.0" y1="70.0" x2="450.0" y2="170.0" stroke="#5a7fb0" stroke-width="1.4" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <line x1="350.0" y1="70.0" x2="350.0" y2="270.0" stroke="#5a7fb0" stroke-width="1.4" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <line x1="350.0" y1="70.0" x2="250.0" y2="170.0" stroke="#5a7fb0" stroke-width="1.4" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <line x1="450.0" y1="170.0" x2="350.0" y2="270.0" stroke="#5a7fb0" stroke-width="1.4" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <line x1="450.0" y1="170.0" x2="250.0" y2="170.0" stroke="#5a7fb0" stroke-width="1.4" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <line x1="350.0" y1="270.0" x2="250.0" y2="170.0" stroke="#5a7fb0" stroke-width="1.4" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <text x="350" y="300" text-anchor="middle" font-size="12" font-weight="bold" fill="#335478" filter="url(#rough2)">样例 1：c=(2,2,2,2) → 4-环；交换 4 次</text>
</svg>
