<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="97"/>
    <feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></defs>
  <rect width="720" height="300" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">从左到右：缺多少，就用「前缀最大补给」补几次</text>
  <rect x="40" y="60" width="640" height="60" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="54" y="84" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">扫描到第 i 座城：req = max(0, D_i − S_i)。若已累计的额外补给 coverage &lt; req：</text>
  <text x="54" y="106" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">t = ceil((req − coverage) / bestRate)，bestRate = max(s_1..s_i)，units += t，coverage += t × bestRate。</text>
  <rect x="40" y="140" width="640" height="60" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="54" y="164" font-size="11.5" fill="#2f5223" filter="url(#rough2)">答案 = Σ d_i + units × k（走完所有路的时间 + 等待补给的时间）。</text>
  <text x="54" y="186" font-size="11.5" fill="#2f5223" filter="url(#rough2)">为什么最优：每多一次补给都要花 k 小时，在补给量最大的城市等，单次补给覆盖的缺口最大。</text>
  <rect x="40" y="220" width="640" height="58" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="54" y="244" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">样例 2：m=2, k=3, d=(5,6), s=(5,5)。D=(5,11)，S=(5,10)；i=2 时 req=1，</text>
  <text x="54" y="266" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">bestRate=5，t=1，答案 = 11 + 3 = 14，与官方一致。</text>
</svg>
