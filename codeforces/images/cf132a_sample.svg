<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="227"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="300" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">样例开头三个字符的还原</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">Hello, World! → 238, 108, 112, …</text>
  <text x="120" y="100" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">字符</text>
  <text x="280" y="100" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">ASCII</text>
  <text x="430" y="100" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">R(ASCII)</text>
  <text x="600" y="100" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">R(上一个)</text>
  <text x="780" y="100" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">a_i</text>
  <g filter="url(#rough2)"><rect x="90" y="116" width="60" height="34" rx="4" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="120" y="139" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">H</text>
  <text x="280" y="139" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">72</text>
  <text x="430" y="139" text-anchor="middle" font-size="12" fill="#b06a1e" filter="url(#rough2)">18</text>
  <text x="600" y="139" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)"><rect x="750" y="116" width="70" height="34" rx="4" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="785" y="139" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">238</text>
  <g filter="url(#rough2)"><rect x="90" y="162" width="60" height="34" rx="4" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="120" y="185" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">e</text>
  <text x="280" y="185" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">101</text>
  <text x="430" y="185" text-anchor="middle" font-size="12" fill="#b06a1e" filter="url(#rough2)">166</text>
  <text x="600" y="185" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">18</text>
  <g filter="url(#rough2)"><rect x="750" y="162" width="70" height="34" rx="4" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="785" y="185" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">108</text>
  <g filter="url(#rough2)"><rect x="90" y="208" width="60" height="34" rx="4" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="120" y="231" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">l</text>
  <text x="280" y="231" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">108</text>
  <text x="430" y="231" text-anchor="middle" font-size="12" fill="#b06a1e" filter="url(#rough2)">54</text>
  <text x="600" y="231" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">166</text>
  <g filter="url(#rough2)"><rect x="750" y="208" width="70" height="34" rx="4" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="785" y="231" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">112</text>
  <text x="450" y="282" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">(18 − 166) mod 256 = 108，(166 − 54) mod 256 = 112</text>
</svg>
