<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="103"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="380" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">n = 10 时哪些位置被绑在一起</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">被约束的位置 = 某个素数 p（p ≤ n/2）的倍数；它们必须全部相等</text>
  <g filter="url(#rough2)"><rect x="70" y="110" width="58" height="46" rx="5" fill="#ffffff" fill-opacity="0.85" stroke="#bbbbbb" stroke-width="1.1"/></g>
  <text x="99" y="140" text-anchor="middle" font-size="15" fill="#666666" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="142" y="110" width="58" height="46" rx="5" fill="#f6e3c4" fill-opacity="0.85" stroke="#b06a1e" stroke-width="1.7"/></g>
  <text x="171" y="140" text-anchor="middle" font-size="15" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="214" y="110" width="58" height="46" rx="5" fill="#f6e3c4" fill-opacity="0.85" stroke="#b06a1e" stroke-width="1.7"/></g>
  <text x="243" y="140" text-anchor="middle" font-size="15" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="286" y="110" width="58" height="46" rx="5" fill="#f6e3c4" fill-opacity="0.85" stroke="#b06a1e" stroke-width="1.7"/></g>
  <text x="315" y="140" text-anchor="middle" font-size="15" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><rect x="358" y="110" width="58" height="46" rx="5" fill="#f6e3c4" fill-opacity="0.85" stroke="#b06a1e" stroke-width="1.7"/></g>
  <text x="387" y="140" text-anchor="middle" font-size="15" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">5</text>
  <g filter="url(#rough2)"><rect x="430" y="110" width="58" height="46" rx="5" fill="#f6e3c4" fill-opacity="0.85" stroke="#b06a1e" stroke-width="1.7"/></g>
  <text x="459" y="140" text-anchor="middle" font-size="15" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">6</text>
  <g filter="url(#rough2)"><rect x="502" y="110" width="58" height="46" rx="5" fill="#ffffff" fill-opacity="0.85" stroke="#bbbbbb" stroke-width="1.1"/></g>
  <text x="531" y="140" text-anchor="middle" font-size="15" fill="#666666" filter="url(#rough2)">7</text>
  <g filter="url(#rough2)"><rect x="574" y="110" width="58" height="46" rx="5" fill="#f6e3c4" fill-opacity="0.85" stroke="#b06a1e" stroke-width="1.7"/></g>
  <text x="603" y="140" text-anchor="middle" font-size="15" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">8</text>
  <g filter="url(#rough2)"><rect x="646" y="110" width="58" height="46" rx="5" fill="#f6e3c4" fill-opacity="0.85" stroke="#b06a1e" stroke-width="1.7"/></g>
  <text x="675" y="140" text-anchor="middle" font-size="15" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">9</text>
  <g filter="url(#rough2)"><rect x="718" y="110" width="58" height="46" rx="5" fill="#f6e3c4" fill-opacity="0.85" stroke="#b06a1e" stroke-width="1.7"/></g>
  <text x="747" y="140" text-anchor="middle" font-size="15" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">10</text>
  <text x="69" y="100" text-anchor="start" font-size="10.5" fill="#666666" filter="url(#rough2)">位置</text>
  <text x="70" y="190" text-anchor="start" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">p = 2 绑定 2, 4, 6, 8, 10</text>
  <text x="70" y="214" text-anchor="start" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">p = 3 绑定 3, 6, 9（6 已被 2 绑过）</text>
  <text x="70" y="238" text-anchor="start" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">p = 5 绑定 5, 10（10 也被 2 绑过）</text>
  <text x="70" y="262" text-anchor="start" font-size="11.5" fill="#666666" filter="url(#rough2)">p = 7 &gt; 10/2：唯一的倍数就是 7 自己，不产生约束</text>
  <g filter="url(#rough2)"><rect x="70" y="288" width="760" height="62" rx="6" fill="#f3d9d6" fill-opacity="0.55" stroke="#8a2b28" stroke-width="1.4"/></g>
  <text x="450" y="312" text-anchor="middle" font-size="12" fill="#8a2b28" filter="url(#rough2)">于是 s₂ = s₄ = s₆ = s₈ = s₁₀ = s₃ = s₉ = s₅ ⇒ 所有橙色位置同一个字符</text>
  <text x="450" y="336" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">自由位置只有 1 与 7（1 不是任何素数的倍数；7 的倍数只有它自己）</text>
</svg>
