<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="420" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="38" text-anchor="middle" font-size="18.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">37D：第一节课（多项式系数）× 第二节课（逐教室 DP）</text>
  <path d="M 137 50 Q 380 56 623 50" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="88" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">第一节课：n 个标号小组分到 m 间教室，第 i 间恰有 x_i 组 ⇒ 方案数 = n! / Π x_i!</text>
  <text x="60" y="114" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">第二节课：第 p 间的小组只能去 q &gt;= p 的教室，且第 j 间的第二节课人数 &lt;= y_j。</text>
  <rect x="60" y="136" width="640" height="96" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="76" y="164" text-anchor="start" font-size="12.5" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">DP：按教室 j 从左到右扫，S_j = x_1 + ... + x_j。</text>
  <text x="76" y="192" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">dp[a] = 已给 a 个小组安排好第二节课的方案数；第 j 间可用的“尚未安排”小组有 S_j - a 个，</text>
  <text x="76" y="218" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">从中选 b &lt;= min(y_j, S_j - a) 个放到第 j 间：dp[a+b] += dp[a] * C(S_j - a, b)。</text>
  <text x="60" y="268" text-anchor="start" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">答案 = (n! / Π x_i!) * dp[n]  (mod 1e9+7)</text>
  <text x="60" y="300" text-anchor="start" font-size="12.5" fill="#2f5223" font-weight="bold" filter="url(#rough2)">正确性要点：</text>
  <text x="60" y="326" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">· “可去 q &gt;= p” 是后缀条件 ⇒ 从左往右扫时，前 j 间已安排的小组全都在 S_j 里，未安排的恰有 S_j - a 个。</text>
  <text x="60" y="352" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">· 第二节课只受各教室容量 y_j 约束，组与组之间没有别的耦合。</text>
  <text x="60" y="392" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">样例 1：x=[1,1,1], y=[1,2,3] → 第一节课 6 种，第二节课 6 种 → 36。</text>
</svg>
