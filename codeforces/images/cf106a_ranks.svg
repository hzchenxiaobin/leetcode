<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1062"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="300" fill="#fafafa"/>
  <text x="360.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">点数顺序与两张样例牌</text>
  <path d="M 115.2 42 Q 360.0 48 604.8 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="360.0" y="286" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">点数必须查表：6 &lt; 7 &lt; 8 &lt; 9 &lt; T &lt; J &lt; Q &lt; K &lt; A</text>
  <rect x="60" y="90" width="56" height="56" rx="7" fill="#f4f4f1" stroke="#b8b8b0" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="88" y="125" text-anchor="middle" font-size="16" fill="#66665e" filter="url(#rough2)">6</text>
  <rect x="128" y="90" width="56" height="56" rx="7" fill="#f4f4f1" stroke="#b8b8b0" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="156" y="125" text-anchor="middle" font-size="16" fill="#66665e" filter="url(#rough2)">7</text>
  <rect x="196" y="90" width="56" height="56" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="224" y="125" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f5223" filter="url(#rough2)">8</text>
  <rect x="264" y="90" width="56" height="56" rx="7" fill="#f4f4f1" stroke="#b8b8b0" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="292" y="125" text-anchor="middle" font-size="16" fill="#66665e" filter="url(#rough2)">9</text>
  <rect x="332" y="90" width="56" height="56" rx="7" fill="#f4f4f1" stroke="#b8b8b0" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="360" y="125" text-anchor="middle" font-size="16" fill="#66665e" filter="url(#rough2)">T</text>
  <rect x="400" y="90" width="56" height="56" rx="7" fill="#f4f4f1" stroke="#b8b8b0" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="428" y="125" text-anchor="middle" font-size="16" fill="#66665e" filter="url(#rough2)">J</text>
  <rect x="468" y="90" width="56" height="56" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="496" y="125" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f5223" filter="url(#rough2)">Q</text>
  <rect x="536" y="90" width="56" height="56" rx="7" fill="#f4f4f1" stroke="#b8b8b0" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="564" y="125" text-anchor="middle" font-size="16" fill="#66665e" filter="url(#rough2)">K</text>
  <rect x="604" y="90" width="56" height="56" rx="7" fill="#f4f4f1" stroke="#b8b8b0" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="632" y="125" text-anchor="middle" font-size="16" fill="#66665e" filter="url(#rough2)">A</text>
  <text x="360" y="180" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">样例 1：QH vs 9S（QH 是王牌花色 H）→ YES</text>
  <text x="360" y="208" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">样例 2：8D vs 6D（同花色，8 &gt; 6）→ YES</text>
  <text x="360" y="236" text-anchor="middle" font-size="12" fill="#8c2f2c" filter="url(#rough2)">样例 3：7H vs AS（花色不同且 7H 非王牌）→ NO</text>
  <text x="360" y="268" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">ASCII 顺序不是点数顺序（T 在 J 之后），必须用表</text>
</svg>
