<svg xmlns="http://www.w3.org/2000/svg" width="880" height="392" viewBox="0 0 880 392"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="103"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/></marker>
  </defs>
  <rect width="880" height="392" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">判定流程：并查集连通 + m = n</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">或者：剥掉所有叶子，剩下的必须是一个长度 ≥ 3 的简单环</text>
  <g filter="url(#rough2)"><rect x="80" y="86" width="340" height="64" rx="4" fill="#cfe0f5" fill-opacity="0.5" stroke="#6688aa" stroke-width="1.4"/></g>
  <text x="250" y="112" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">读入 n, m 与 m 条边</text>
  <text x="250" y="136" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">并查集统计连通块数</text>
  <g filter="url(#rough2)"><rect x="460" y="86" width="340" height="64" rx="4" fill="#d7ecd0" fill-opacity="0.5" stroke="#6a9a58" stroke-width="1.4"/></g>
  <text x="630" y="112" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">连通块数 == 1？</text>
  <text x="630" y="136" text-anchor="middle" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">否 → NO</text>
  <g filter="url(#rough2)"><rect x="80" y="182" width="720" height="58" rx="4" fill="#f6e3c4" fill-opacity="0.5" stroke="#c9a86a" stroke-width="1.4"/></g>
  <text x="440" y="208" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">m == n ？（树 n−1 条，环多 1 条 → 恰好 n 条）</text>
  <text x="440" y="230" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">两者都成立 → FHTAGN!，否则 NO</text>
  <text x="440" y="286" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">为什么充分：连通 + m=n ⟹ 圈秩 m−n+1 = 1 ⟹ 恰有一个环；简单图里环长 ≥ 3</text>
  <text x="440" y="314" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">为什么必要：克苏鲁由环(长度等于环上点数) + 树构成，边数 = 环边数 + Σ(树点数−1) = n</text>
  <text x="440" y="352" text-anchor="middle" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">样例 2：n=6, m=5 → 直接 NO（连不成环）</text>
</svg>
