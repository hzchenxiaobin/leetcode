<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr71ed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="400" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">mask 从小到大转移：原子序数 [1,2,3]，目标 [3,3]</text>

  <g filter="url(#rough2)">
    <rect x="40" y="88" width="130" height="66" rx="8" fill="#eef4fb" stroke="#446688" stroke-width="1.7"/>
    <rect x="200" y="88" width="130" height="66" rx="8" fill="#eef4fb" stroke="#446688" stroke-width="1.7"/>
    <rect x="360" y="88" width="130" height="66" rx="8" fill="#fff8e1" stroke="#c9a227" stroke-width="1.7"/>
    <rect x="520" y="88" width="130" height="66" rx="8" fill="#e8f0e0" stroke="#4a7a3a" stroke-width="1.9"/>
  </g>
  <g font-size="11.5" fill="#2b3a4a" text-anchor="middle" filter="url(#rough2)">
    <text x="105" y="112">mask 000</text><text x="105" y="132">sum 0</text><text x="105" y="150">c = 0</text>
    <text x="265" y="112">mask 001</text><text x="265" y="132">sum 1</text><text x="265" y="150">c = 0，累加 1</text>
    <text x="425" y="112">mask 011</text><text x="425" y="132">sum 3 = pref1</text><text x="425" y="150">c = 1</text>
    <text x="585" y="112">mask 111</text><text x="585" y="132">sum 6 = pref2</text><text x="585" y="150">c = 2 ✓</text>
  </g>
  <g filter="url(#rough2)" stroke="#446688" stroke-width="2" fill="none">
    <path d="M172 121 L196 121" marker-end="url(#arr71ed)"/>
    <path d="M332 121 L356 121" marker-end="url(#arr71ed)"/>
    <path d="M492 121 L516 121" marker-end="url(#arr71ed)"/>
  </g>
  <g font-size="10.5" fill="#7a2f2c" text-anchor="middle" filter="url(#rough2)">
    <text x="184" y="80">加 a0=1</text>
    <text x="344" y="80">加 a1=2</text>
    <text x="504" y="80">加 a2=3</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="186" width="610" height="120" rx="10" fill="#fcfcfa" stroke="#c8c2b6" stroke-width="1.4"/>
  </g>
  <g font-size="12.5" fill="#33475c" filter="url(#rough2)">
    <text x="60" y="214">转移：ns =（sum[mask] − pref[c]）+ a[i]</text>
    <text x="60" y="244">ns &gt; 目标 → 跳过；ns = 目标 → c+1；否则 c 不变</text>
    <text x="60" y="274">dp[mask] 用位集保存所有可达的 c（k ≤ 17，一个 int 够用）</text>
  </g>

  <text x="380" y="342" text-anchor="middle" font-size="12.5" fill="#4a4a4a" filter="url(#rough2)">pref = [0, 3, 6]；上面这条路径把 {1,2} 分给第一个 3，把 {3} 分给第二个 3</text>
  <text x="380" y="372" text-anchor="middle" font-size="12.5" fill="#2f5223" filter="url(#rough2)">有解 ⇔ dp[全集] 含 c = k</text>
</svg>
