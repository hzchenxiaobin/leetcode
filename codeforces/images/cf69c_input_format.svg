<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" viewBox="0 0 860 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="860" height="470" fill="#fafafa"/>

  <text x="430" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">输入被分成四段：参数、基础神器、配方、购买记录</text>

  <!-- 第 1 段 -->
  <g filter="url(#rough2)">
    <rect x="60" y="56" width="740" height="70" rx="10" fill="#eef2f6" stroke="#446688" stroke-width="1.6"/>
    <text x="80" y="82" font-size="12.5" font-weight="bold" fill="#2f4a66">① 第 1 行：k  n  m  q</text>
    <text x="80" y="108" font-size="12" fill="#444444">例：2  3  2  5　（成员数、基础神器数、配方数、购买次数）</text>
  </g>

  <!-- 第 2 段 -->
  <g filter="url(#rough2)">
    <rect x="60" y="140" width="740" height="86" rx="10" fill="#eef6e8" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="80" y="166" font-size="12.5" font-weight="bold" fill="#2f5223">② 接下来 n 行：基础神器名</text>
    <text x="80" y="192" font-size="12" fill="#444444">例：desolator</text>
    <text x="80" y="212" font-size="12" fill="#444444">　　　refresher / perseverance（每行一个名字，只含小写字母）</text>
  </g>

  <!-- 第 3 段 -->
  <g filter="url(#rough2)">
    <rect x="60" y="240" width="740" height="110" rx="10" fill="#f6e3c4" stroke="#b58a3a" stroke-width="1.6"/>
    <text x="80" y="266" font-size="12.5" font-weight="bold" fill="#7a5a1b">③ 接下来 m 行：配方（冒号 + 逗号分隔）</text>
    <text x="80" y="294" font-size="12" fill="#444444">例：vanguard: desolator 1, refresher 1</text>
    <text x="80" y="316" font-size="11.5" fill="#8a6015">结构：名字 + ":" + 空格 + 「材料 数量」用 ", " 连接；材料只能是基础神器</text>
    <text x="80" y="338" font-size="11.5" fill="#8a6015">合成：消耗这些材料，产出一件同名高级神器</text>
  </g>

  <!-- 第 4 段 -->
  <g filter="url(#rough2)">
    <rect x="60" y="364" width="740" height="76" rx="10" fill="#cfe0f5" stroke="#446688" stroke-width="1.6"/>
    <text x="80" y="390" font-size="12.5" font-weight="bold" fill="#2f4a66">④ 最后 q 行：购买记录</text>
    <text x="80" y="416" font-size="12" fill="#444444">例：1 desolator　　（成员编号 + 买到的「基础」神器名）</text>
  </g>
</svg>
