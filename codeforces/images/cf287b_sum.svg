<svg xmlns="http://www.w3.org/2000/svg" width="700" height="350" viewBox="0 0 700 350"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="311"/>
    <feDisplacementMap in="SourceGraphic" scale="1.5"/></filter></defs>
  <rect width="700" height="350" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">用 x 口分流器 ⇒ 管道数净增 x−1</text>
  <path d="M 140 40 Q 350 46 560 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="58" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="13" fill="#22314a" filter="url(#rough2)">初始 1 条管道；用掉一个 x 口分流器：断开 1 条，接出 x 条 ⇒ 总数 +（x−1）。</text>
  <text x="76" y="104" font-size="12" fill="#2f4a66" filter="url(#rough2)">手上恰好各有一个 2、3、…、k 口分流器 ⇒ 可用的"增量"集合是 {1, 2, …, k−1}，每个最多用一次。</text>
  <g filter="url(#rough2)"><rect x="60" y="126" width="580" height="62" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="76" y="150" font-size="13" fill="#8a6015" filter="url(#rough2)">要 n 条管道 ⇒ 需要选一个集合 S ⊆ {1..k−1} 使 ΣS = n−1，并让 |S| 最小。</text>
  <text x="76" y="172" font-size="12" fill="#8a6015" filter="url(#rough2)">若 (k−1)k/2 &lt; n−1 ⇒ 全用上也不够 ⇒ −1。</text>
  <g filter="url(#rough2)"><rect x="60" y="198" width="580" height="62" rx="8" fill="#e8f4e0" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="222" font-size="13" fill="#2f5223" filter="url(#rough2)">取尽量大的数：m 个数能凑出的最大和是 top(m) = (k−1)+(k−2)+…+(k−m)。</text>
  <text x="76" y="244" font-size="12" fill="#3c5e2e" filter="url(#rough2)">top(m) 关于 m 递增 ⇒ 二分最小 m 使 top(m) ≥ n−1，答案就是 m。</text>
  <g filter="url(#rough2)"><rect x="60" y="270" width="580" height="58" rx="8" fill="#fbeeee" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="76" y="294" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">样例：n=4,k=3 ⇒ 需要 3，可选 {1,2}，top(1)=2&lt;3 ≤ top(2)=3 ⇒ 2 ✓</text>
  <text x="76" y="316" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">样例：n=5,k=5 ⇒ 需要 4，top(1)=4 ≥ 4 ⇒ 1 ✓；n=8,k=4 ⇒ 需要 7 &gt; 6 ⇒ −1 ✓</text>
</svg>
