<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 0 780 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="103"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>

  <rect width="780" height="440" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2：R1 与 R2 各 6 格，重叠 2 格</text>
  <path d="M 170 40 Q 390 46 610 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <rect x="100" y="110" width="60" height="60" fill="#cfe0f5" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="100" y="170" width="60" height="60" fill="#cfe0f5" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="100" y="230" width="60" height="60" fill="#ffffff" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="160" y="110" width="60" height="60" fill="#cfe0f5" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="160" y="170" width="60" height="60" fill="#fbe3c8" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="160" y="230" width="60" height="60" fill="#d9ecd4" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="220" y="110" width="60" height="60" fill="#cfe0f5" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="220" y="170" width="60" height="60" fill="#fbe3c8" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="220" y="230" width="60" height="60" fill="#d9ecd4" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="280" y="110" width="60" height="60" fill="#ffffff" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="280" y="170" width="60" height="60" fill="#d9ecd4" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="280" y="230" width="60" height="60" fill="#d9ecd4" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="220" y="318" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">列 1 … 4</text>
  <text x="86" y="170" text-anchor="end" font-size="10.5" fill="#777777" filter="url(#rough2)">行 1</text>
  <text x="86" y="290" text-anchor="end" font-size="10.5" fill="#777777" filter="url(#rough2)">行 3</text>
  <rect x="470" y="90" width="280" height="200" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="486" y="118" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">三种颜色分别表示</text>
  <rect x="486" y="132" width="34" height="22" fill="#cfe0f5" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="532" y="148" font-size="11" fill="#2f4a66" filter="url(#rough2)">只在 R1（激光 1 扫到）</text>
  <rect x="486" y="164" width="34" height="22" fill="#d9ecd4" stroke="#4a7a3a" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="532" y="180" font-size="11" fill="#2f5223" filter="url(#rough2)">只在 R2（激光 2 扫到）</text>
  <rect x="486" y="196" width="34" height="22" fill="#fbe3c8" stroke="#c98a2b" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="532" y="212" font-size="11" fill="#8a6015" filter="url(#rough2)">两束都会扫到（重叠）</text>
  <text x="486" y="246" font-size="11" fill="#2b2b2b" filter="url(#rough2)">白色两格永远融化不了</text>
  <text x="486" y="272" font-size="12" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">12 − (6 + 6 − 2) = 2</text>
  <text x="60" y="398" font-size="12" fill="#2b2b2b" filter="url(#rough2)">R1 是 3×2 的矩形，R2 是它整体向右下平移 (1,1) 后的副本；交集宽 4−2·1=2、高 3−2·1=1。</text>
  <text x="60" y="424" font-size="11.5" fill="#8a6015" filter="url(#rough2)">融化格子数 6+6−2=10，答案 12−10=2，与样例输出一致。</text>
</svg>
