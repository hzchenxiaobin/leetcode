<svg xmlns="http://www.w3.org/2000/svg" width="700" height="470" viewBox="0 0 700 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="700" height="470" fill="#fafafa"/>
  <text x="350" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" stroke="#fafafa" stroke-width="2.4" paint-order="stroke" filter="url(#rough2)">核心观察：把棋盘压成一维的 d = r + c</text>
  <text x="350" y="56" text-anchor="middle" font-size="12.5" fill="#8a8a8a" stroke="#fafafa" stroke-width="2.4" paint-order="stroke" filter="url(#rough2)">三种走法只让 d 变成 d+1 或 d−2 ⇒ 每秒 d mod 3 必然 +1</text>
  <rect x="282" y="282" width="62" height="62" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="220" y="220" width="62" height="62" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
