  <text x="127.0" y="318.0" text-anchor="middle" font-size="14" fill="#9a9a9a" stroke="#fafafa" stroke-width="2.4" paint-order="stroke" filter="url(#rough2)">2</text>
  <text x="189.0" y="318.0" text-anchor="middle" font-size="14" fill="#9a9a9a" stroke="#fafafa" stroke-width="2.4" paint-order="stroke" filter="url(#rough2)">3</text>
  <text x="251.0" y="318.0" text-anchor="middle" font-size="14" fill="#9a9a9a" stroke="#fafafa" stroke-width="2.4" paint-order="stroke" filter="url(#rough2)">4</text>
  <text x="313.0" y="318.0" text-anchor="middle" font-size="14" fill="#9a9a9a" stroke="#fafafa" stroke-width="2.4" paint-order="stroke" filter="url(#rough2)">5</text>
  <text x="127.0" y="256.0" text-anchor="middle" font-size="14" fill="#9a9a9a" stroke="#fafafa" stroke-width="2.4" paint-order="stroke" filter="url(#rough2)">3</text>
  <text x="189.0" y="256.0" text-anchor="middle" font-size="14" fill="#9a9a9a" stroke="#fafafa" stroke-width="2.4" paint-order="stroke" filter="url(#rough2)">4</text>
  <text x="251.0" y="256.0" text-anchor="middle" font-size="14" fill="#9a9a9a" stroke="#fafafa" stroke-width="2.4" paint-order="stroke" filter="url(#rough2)">5</text>
  <text x="313.0" y="256.0" text-anchor="middle" font-size="14" fill="#9a9a9a" stroke="#fafafa" stroke-width="2.4" paint-order="stroke" filter="url(#rough2)">6</text>
  <text x="127.0" y="194.0" text-anchor="middle" font-size="14" fill="#9a9a9a" stroke="#fafafa" stroke-width="2.4" paint-order="stroke" filter="url(#rough2)">4</text>
  <text x="212" y="212" text-anchor="end" font-size="11.5" fill="#7a7a7a" stroke="#fafafa" stroke-width="2.4" paint-order="stroke" filter="url(#rough2)">5</text>
  <text x="251.0" y="194.0" text-anchor="middle" font-size="14" fill="#9a9a9a" stroke="#fafafa" stroke-width="2.4" paint-order="stroke" filter="url(#rough2)">6</text>
  <text x="313.0" y="194.0" text-anchor="middle" font-size="14" fill="#9a9a9a" stroke="#fafafa" stroke-width="2.4" paint-order="stroke" filter="url(#rough2)">7</text>
  <text x="127.0" y="132.0" text-anchor="middle" font-size="14" fill="#9a9a9a" stroke="#fafafa" stroke-width="2.4" paint-order="stroke" filter="url(#rough2)">5</text>
  <text x="189.0" y="132.0" text-anchor="middle" font-size="14" fill="#9a9a9a" stroke="#fafafa" stroke-width="2.4" paint-order="stroke" filter="url(#rough2)">6</text>
  <text x="251.0" y="132.0" text-anchor="middle" font-size="14" fill="#9a9a9a" stroke="#fafafa" stroke-width="2.4" paint-order="stroke" filter="url(#rough2)">7</text>
  <text x="313.0" y="132.0" text-anchor="middle" font-size="14" fill="#9a9a9a" stroke="#fafafa" stroke-width="2.4" paint-order="stroke" filter="url(#rough2)">8</text>
  <text x="127.0" y="364" text-anchor="middle" font-size="12" fill="#8a8a8a" stroke="#fafafa" stroke-width="2.4" paint-order="stroke" filter="url(#rough2)">1</text>
  <text x="189.0" y="364" text-anchor="middle" font-size="12" fill="#8a8a8a" stroke="#fafafa" stroke-width="2.4" paint-order="stroke" filter="url(#rough2)">2</text>
  <text x="251.0" y="364" text-anchor="middle" font-size="12" fill="#8a8a8a" stroke="#fafafa" stroke-width="2.4" paint-order="stroke" filter="url(#rough2)">3</text>
  <text x="313.0" y="364" text-anchor="middle" font-size="12" fill="#8a8a8a" stroke="#fafafa" stroke-width="2.4" paint-order="stroke" filter="url(#rough2)">4</text>
  <text x="80" y="318.0" text-anchor="middle" font-size="12" fill="#8a8a8a" stroke="#fafafa" stroke-width="2.4" paint-order="stroke" filter="url(#rough2)">1</text>
  <text x="80" y="256.0" text-anchor="middle" font-size="12" fill="#8a8a8a" stroke="#fafafa" stroke-width="2.4" paint-order="stroke" filter="url(#rough2)">2</text>
  <text x="80" y="194.0" text-anchor="middle" font-size="12" fill="#8a8a8a" stroke="#fafafa" stroke-width="2.4" paint-order="stroke" filter="url(#rough2)">3</text>
  <text x="80" y="132.0" text-anchor="middle" font-size="12" fill="#8a8a8a" stroke="#fafafa" stroke-width="2.4" paint-order="stroke" filter="url(#rough2)">4</text>
  <text x="220" y="384" text-anchor="middle" font-size="11.5" fill="#8a8a8a" stroke="#fafafa" stroke-width="2.4" paint-order="stroke" filter="url(#rough2)">列 c →</text>
  <text x="66" y="88" text-anchor="middle" font-size="11.5" fill="#8a8a8a" stroke="#fafafa" stroke-width="2.4" paint-order="stroke" filter="url(#rough2)">行 r ↑</text>
  <circle cx="189.0" cy="189.0" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="189.0" y="195.0" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" stroke="#fafafa" stroke-width="2.4" paint-order="stroke" filter="url(#rough2)">R</text>
  <path d="M 189.0 172.0 L 189.0 144.0" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 206.0 189.0 L 234.0 189.0" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 176.0 202.0 L 140.0 238.0" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="213" y="112" text-anchor="end" font-size="11" fill="#446688" font-weight="bold" stroke="#fafafa" stroke-width="2.4" paint-order="stroke" filter="url(#rough2)">+1</text>
  <text x="275" y="174" text-anchor="end" font-size="11" fill="#446688" font-weight="bold" stroke="#fafafa" stroke-width="2.4" paint-order="stroke" filter="url(#rough2)">+1</text>
  <text x="103" y="275" text-anchor="start" font-size="11" fill="#d6a040" font-weight="bold" stroke="#fafafa" stroke-width="2.4" paint-order="stroke" filter="url(#rough2)">−2</text>
  <text x="96" y="406" text-anchor="start" font-size="11.5" fill="#6b6b6b" stroke="#fafafa" stroke-width="2.4" paint-order="stroke" filter="url(#rough2)">绿 = 当前对角线 d=5　蓝 = 上/右一步可到 d=6　橙 = 左下一步到 d=3</text>
  <rect x="404" y="92" width="282" height="300" rx="10" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="418" y="118" text-anchor="start" font-size="14" fill="#2b2b2b" font-weight="bold" stroke="#fafafa" stroke-width="2.4" paint-order="stroke" filter="url(#rough2)">把棋盘忘掉，只留下 d</text>
  <text x="418" y="140" text-anchor="start" font-size="12" fill="#2b2b2b" stroke="#fafafa" stroke-width="2.4" paint-order="stroke" filter="url(#rough2)">d = r + c ∈ [2, 2n]（反对角线编号）</text>
  <text x="418" y="166" text-anchor="start" font-size="12" fill="#446688" stroke="#fafafa" stroke-width="2.4" paint-order="stroke" filter="url(#rough2)">上 / 右：d ← d + 1</text>
  <text x="418" y="188" text-anchor="start" font-size="12" fill="#d6a040" stroke="#fafafa" stroke-width="2.4" paint-order="stroke" filter="url(#rough2)">左下：d ← d − 2</text>
  <text x="418" y="222" text-anchor="start" font-size="12" fill="#4a4a4a" stroke="#fafafa" stroke-width="2.4" paint-order="stroke" filter="url(#rough2)">关键：−2 ≡ +1 (mod 3)，故</text>
  <text x="418" y="244" text-anchor="start" font-size="12" fill="#4a4a4a" stroke="#fafafa" stroke-width="2.4" paint-order="stroke" filter="url(#rough2)">每一秒 d mod 3 恰好 +1。</text>
  <text x="418" y="266" text-anchor="start" font-size="12" fill="#4a4a4a" stroke="#fafafa" stroke-width="2.4" paint-order="stroke" filter="url(#rough2)">起点 d₀ 的模 3 类由「第几秒」决定，</text>
  <text x="418" y="288" text-anchor="start" font-size="12" fill="#4a4a4a" stroke="#fafafa" stroke-width="2.4" paint-order="stroke" filter="url(#rough2)">所以三类机器人必须分开处理。</text>
  <text x="418" y="322" text-anchor="start" font-size="12" fill="#7a5c1e" stroke="#fafafa" stroke-width="2.4" paint-order="stroke" filter="url(#rough2)">于是原题等价于：一条会走 +1 / −2 的</text>
  <text x="418" y="344" text-anchor="start" font-size="12" fill="#7a5c1e" stroke="#fafafa" stroke-width="2.4" paint-order="stroke" filter="url(#rough2)">隐藏数 d ∈ [2, 2n]，每秒钟被猜一次。</text>
  <text x="418" y="370" text-anchor="start" font-size="12" fill="#7a5c1e" stroke="#fafafa" stroke-width="2.4" paint-order="stroke" filter="url(#rough2)">猜中即胜，猜空它再走一步。</text>
</svg>
