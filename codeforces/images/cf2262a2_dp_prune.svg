<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="680" height="430" fill="#fafafa"/>

  <text x="185" y="26" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：禁块 → need[] → 按最大值 DP</text>

  <!-- ① -->
  <rect x="30" y="42" width="310" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="44" y="62" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">① 差分标记禁块，求可用集 U</text>
  <text x="44" y="80" font-size="9.5" fill="#555" filter="url(#rough2)">I_k = [k·a_k, k·a_k+k−1]，右端裁到 n−1</text>
  <text x="44" y="94" font-size="9.5" fill="#555" filter="url(#rough2)">diff[L]++，diff[R+1]−−；前缀和为 0 ⟹ 可用</text>

  <!-- ② -->
  <rect x="30" y="112" width="310" height="82" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="44" y="132" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">② 枚举必中块，压到 need[]</text>
  <text x="44" y="150" font-size="9.5" fill="#555" filter="url(#rough2)">β = [k·v, k·v+k−1]，0 ≤ v &lt; a_k</text>
  <text x="44" y="165" font-size="9.5" fill="#555" filter="url(#rough2)">low(β) = nxt[k·v]（块内最小可用位置）</text>
  <text x="44" y="180" font-size="9.5" fill="#555" filter="url(#rough2)">need[R] = max(need[R], low(β))</text>
  <text x="44" y="188" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">low(β) &gt; R ⟹ 块内无可用元素 ⟹ 无解</text>

  <!-- ③ -->
  <rect x="30" y="206" width="310" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="44" y="226" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">③ 扫描 p = 0..n−1</text>
  <text x="44" y="242" font-size="9.5" fill="#555" filter="url(#rough2)">p 可用：dp[p] = total（选 p，成为新最大值）</text>
  <text x="44" y="256" font-size="9.5" fill="#555" filter="url(#rough2)">然后 total ← 2·total（不选 p，旧方案全留下）</text>
  <text x="44" y="268" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">顺序不能反：先赋值，再翻倍</text>

  <!-- ④ -->
  <rect x="30" y="284" width="310" height="82" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="44" y="304" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">④ 剪枝（必须放在 ③ 之后）</text>
  <text x="44" y="322" font-size="9.5" fill="#555" filter="url(#rough2)">nd = need[p]：右端为 p 的块要求 max ≥ nd</text>
  <text x="44" y="337" font-size="9.5" fill="#555" filter="url(#rough2)">删掉所有 max &lt; nd 的状态（含空状态）</text>
  <text x="44" y="352" font-size="9.5" fill="#555" filter="url(#rough2)">键值单调递增 ⟹ 单指针 ptr 右移即可</text>

  <!-- ⑤ -->
  <rect x="30" y="378" width="310" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="44" y="400" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">⑤ 扫完后的 total 就是答案（模 1e9+7）</text>

  <path d="M 185 100 L 185 110" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 185 194 L 185 204" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 185 272 L 185 282" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 185 366 L 185 376" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 右侧：状态键示意 -->
  <text x="498" y="46" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">状态键 = 当前已选集合的最大值 m</text>
  <text x="480" y="70" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">切割线 nd</text>

  <rect x="360" y="78" width="38" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <rect x="400" y="78" width="38" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <rect x="440" y="78" width="38" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <rect x="480" y="78" width="38" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <rect x="520" y="78" width="38" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <rect x="560" y="78" width="38" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <rect x="600" y="78" width="38" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="379" y="101" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">空</text>
  <text x="419" y="101" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">0</text>
  <text x="459" y="101" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">1</text>
  <text x="499" y="101" text-anchor="middle" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">2</text>
  <text x="539" y="101" text-anchor="middle" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">3</text>
  <text x="579" y="101" text-anchor="middle" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">4</text>
  <text x="619" y="101" text-anchor="middle" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">5</text>
  <path d="M 480 66 L 480 122" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>

  <text x="405" y="140" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">max &lt; nd：全部删掉</text>
  <text x="560" y="140" text-anchor="middle" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">max ≥ nd：保留</text>

  <text x="362" y="172" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">为什么只记最大值就够？</text>
  <text x="362" y="192" font-size="9.5" fill="#555" filter="url(#rough2)">• 已处理完的块，只要求最大值落在块内</text>
  <text x="362" y="209" font-size="9.5" fill="#555" filter="url(#rough2)">• 更右的块只关心「最大值是否 ≥ low(β)」</text>
  <text x="362" y="226" font-size="9.5" fill="#555" filter="url(#rough2)">• 相同 m 的状态，后续可选方案完全一样</text>

  <rect x="356" y="240" width="300" height="94" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="368" y="260" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">low(β) 为什么不是块左端 k·v ？</text>
  <text x="368" y="279" font-size="9.5" fill="#555" filter="url(#rough2)">块左端可能整段落在禁块里（例如 β=[6,9]，</text>
  <text x="368" y="295" font-size="9.5" fill="#555" filter="url(#rough2)">而 6,7,8 全被禁用），此时块内最小可用位置</text>
  <text x="368" y="311" font-size="9.5" fill="#555" filter="url(#rough2)">是 9；写成 k·v 会少算约束、答案偏大。</text>
  <text x="368" y="327" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">nxt[i] = 后缀第一个可用位置，O(n) 预处理</text>

  <rect x="356" y="348" width="300" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="368" y="368" font-size="10.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">复杂度</text>
  <text x="368" y="386" font-size="9.5" fill="#555" filter="url(#rough2)">块枚举总量 Σ min(a_k, n/k+1) = O(n log n)</text>
  <text x="368" y="402" font-size="9.5" fill="#555" filter="url(#rough2)">剪枝：每个键只删一次 ⟹ O(n)；空间 O(n)</text>
</svg>
