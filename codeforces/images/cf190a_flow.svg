<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="320" fill="#fafafa"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">190A 的判定流程</text>
  <path d="M 293.49 46 Q 380.0 52 466.51 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="120.0" y="56.0" width="520.0" height="42.0" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="140.0" y="83.0" text-anchor="start" font-size="11.2" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">读 n, m</text>
  <path d="M 380.0 99.0 L 380.0 107.0" stroke="#446688" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120.0" y="108.0" width="520.0" height="42.0" rx="8" fill="#fff3d6" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="140.0" y="135.0" text-anchor="start" font-size="11.2" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">n = 0 ?</text>
  <path d="M 380.0 151.0 L 380.0 159.0" stroke="#446688" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120.0" y="160.0" width="520.0" height="42.0" rx="8" fill="#fdf0ef" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="140.0" y="187.0" text-anchor="start" font-size="11.2" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">m = 0 ? 输出 0 0 : Impossible</text>
  <path d="M 380.0 203.0 L 380.0 211.0" stroke="#446688" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120.0" y="212.0" width="520.0" height="42.0" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="140.0" y="239.0" text-anchor="start" font-size="11.2" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">m = 0 ? 输出 n n</text>
  <path d="M 380.0 255.0 L 380.0 263.0" stroke="#446688" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120.0" y="264.0" width="520.0" height="42.0" rx="8" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="140.0" y="291.0" text-anchor="start" font-size="11.2" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">输出 max(n,m) 与 n+m−1</text>
</svg>
