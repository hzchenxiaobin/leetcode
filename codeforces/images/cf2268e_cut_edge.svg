<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="430" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：切一条边，断下的是一个「连续段子树」</text>
  <text x="310" y="46" text-anchor="middle" font-size="10.5" fill="#888">根在 i ⇒ 左子段 [l, i−1]、右子段 [i+1, r]；任意子树的点集必是一段连续下标</text>

  <g filter="url(#rough2)">
    <rect x="60" y="62" width="64" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="128" y="62" width="64" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="196" y="62" width="64" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="264" y="62" width="64" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="332" y="62" width="64" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="400" y="62" width="64" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="92" y="84">a1</text>
    <text x="160" y="84">a2</text>
    <text x="228" y="84">a3</text>
    <text x="296" y="84">a4</text>
    <text x="364" y="84">a5</text>
    <text x="432" y="84">a6</text>
  </g>
  <g font-size="10" fill="#999" text-anchor="middle" filter="url(#rough2)">
    <text x="92" y="110">1</text>
    <text x="160" y="110">2</text>
    <text x="228" y="110">3</text>
    <text x="296" y="110">4</text>
    <text x="364" y="110">5</text>
    <text x="432" y="110">6</text>
  </g>
  <path d="M 264 122 L 464 122" stroke="#d6a040" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="500" y="96" font-size="11" fill="#8a6a20" filter="url(#rough2)">段 [4, 6] 被切下</text>
  <text x="500" y="114" font-size="10" fill="#8a6a20" filter="url(#rough2)">X = p6 ⊕ p3</text>

  <g filter="url(#rough2)" stroke="#886644" stroke-width="1.4" fill="none">
    <path d="M 170 140 L 95 205"/>
    <path d="M 170 140 L 245 205"/>
    <path d="M 95 205 L 135 270"/>
    <path d="M 245 205 L 210 270"/>
    <path d="M 245 205 L 285 270"/>
  </g>
  <rect x="182" y="182" width="122" height="106" fill="#fff8e1" fill-opacity="0.45" stroke="#d6a040"
        stroke-width="1.8" stroke-dasharray="6 4" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <circle cx="170" cy="140" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="170" y="145" fill="#2a3a52">3</text>
    <circle cx="95" cy="205" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="95" y="210" fill="#2a3a52">1</text>
    <circle cx="245" cy="205" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="245" y="210" fill="#7a5a18">5</text>
    <circle cx="135" cy="270" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="135" y="275" fill="#2a3a52">2</text>
    <circle cx="210" cy="270" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="210" y="275" fill="#7a5a18">4</text>
    <circle cx="285" cy="270" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="285" y="275" fill="#7a5a18">6</text>
  </g>
  <text x="170" y="312" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">节点 5 的子树 = {4,5,6} = 段 [4,6]</text>

  <rect x="325" y="130" width="278" height="172" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <g font-size="10" fill="#33502a" filter="url(#rough2)">
    <text x="338" y="150" font-weight="bold" font-size="10.5">把 [l,r] 收缩成一个叶子 x</text>
    <text x="338" y="170">⇒ 双射到：n−m+1 个键的 BST（x 是叶子）</text>
    <text x="338" y="188">　　　　×　段内部形状</text>
    <text x="338" y="212">叶子 x 的 BST 数与 x 无关：删掉叶子 ⇔ 插入，</text>
    <text x="338" y="230">双向唯一 ⇒ 恰 C(n−m) 种</text>
    <text x="338" y="254">段内是 m 个键的 BST ⇒ C(m) 种</text>
    <text x="338" y="284" font-weight="bold" font-size="11" fill="#2a5a24">cnt(l,r) = C(m) · C(n−m)</text>
  </g>
  <text x="325" y="322" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">只与段长 m 有关，与位置 l 无关 ⇒ 可按 m 合并</text>

  <rect x="30" y="334" width="560" height="84" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <g font-size="10" fill="#7a3a36" filter="url(#rough2)">
    <text x="44" y="354">① 每条被切的边，「子侧」恰好是一棵子树 = 一个连续段 [l,r]</text>
    <text x="44" y="374">② 段 [l,r]（m = r−l+1 &lt; n）能挂边的树数 = C(m)·C(n−m)</text>
    <text x="44" y="394">③ 该边能量 = X + (T⊕X)，X = p[r]⊕p[l−1]，T = p[n]</text>
    <text x="44" y="412" font-size="9.5" fill="#a05850">⇒ 答案 = Σ C(m)·C(n−m)·[X + (T⊕X)]，枚举全部 O(n²) 个段</text>
  </g>
</svg>
