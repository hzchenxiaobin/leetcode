<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="469"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="230" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">样例 1：223 / 232 / 112</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">第 1 列最大 2（学生 1、2）</text>
  <text x="450" y="104" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">列 1：max 2 → 学生 1、2；列 2：max 3 → 学生 2；列 3：max 3 → 学生 2</text>
  <text x="450" y="148" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">成功学生 = {1, 2} ⇒ 2</text>
  <text x="450" y="190" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">样例 2 中第 2 列全员并列 1，于是三人都成功</text>
</svg>
