  <rect x="60.0" y="306.0" width="620.0" height="66.0" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="330.0" text-anchor="start" font-size="11.4" fill="#8a6015" filter="url(#rough2)">n ≤ 4 时一共只有 n² ≤ 16 个格子；输入的 n² 个数要原样用完（多重集相等）。</text>
  <text x="74.0" y="352.0" text-anchor="start" font-size="11.4" fill="#8a6015" filter="url(#rough2)">s 由总和唯一确定：s = Σa / n（题面保证有解，所以一定整除）。</text>
