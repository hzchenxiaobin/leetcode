<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="430" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：两列同翻 ⇒ 奇偶不变量；把列两两配对 ⇒ 一步两份收益</text>
  <text x="330" y="46" text-anchor="middle" font-size="10.5" fill="#888">操作 (i,j)：第 j 列与第 j+1 列的第 i、i+1 行同时上下互换</text>

  <!-- left: 4x4 mini grid with an operation -->
  <g filter="url(#rough2)">
    <rect x="40" y="66" width="240" height="150" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
  </g>
  <text x="160" y="86" text-anchor="middle" font-size="10.5" fill="#2f4f6f" filter="url(#rough2)">一次操作只碰一个 2×2 子块</text>

  <!-- grid cells 4x4 -->
  <g filter="url(#rough2)">
    <rect x="72" y="98" width="34" height="26" fill="#ffffff" stroke="#8aa8c0" stroke-width="1.1" rx="3"/>
    <rect x="106" y="98" width="34" height="26" fill="#ffffff" stroke="#8aa8c0" stroke-width="1.1" rx="3"/>
    <rect x="140" y="98" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
    <rect x="174" y="98" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
    <rect x="72" y="124" width="34" height="26" fill="#ffffff" stroke="#8aa8c0" stroke-width="1.1" rx="3"/>
    <rect x="106" y="124" width="34" height="26" fill="#ffffff" stroke="#8aa8c0" stroke-width="1.1" rx="3"/>
    <rect x="140" y="124" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
    <rect x="174" y="124" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
    <rect x="72" y="150" width="34" height="26" fill="#ffffff" stroke="#8aa8c0" stroke-width="1.1" rx="3"/>
    <rect x="106" y="150" width="34" height="26" fill="#ffffff" stroke="#8aa8c0" stroke-width="1.1" rx="3"/>
    <rect x="140" y="150" width="34" height="26" fill="#ffffff" stroke="#8aa8c0" stroke-width="1.1" rx="3"/>
    <rect x="174" y="150" width="34" height="26" fill="#ffffff" stroke="#8aa8c0" stroke-width="1.1" rx="3"/>
  </g>
  <g font-size="11" fill="#334" text-anchor="middle" filter="url(#rough2)">
    <text x="89" y="116">a</text><text x="123" y="116">b</text><text x="157" y="116">c</text><text x="191" y="116">d</text>
    <text x="89" y="142">e</text><text x="123" y="142">f</text><text x="157" y="142">g</text><text x="191" y="142">h</text>
    <text x="89" y="168">…</text><text x="123" y="168">…</text><text x="157" y="168">…</text><text x="191" y="168">…</text>
  </g>
  <g stroke="#b85450" stroke-width="1.6" filter="url(#rough2)" fill="none">
    <path d="M150 112 C 156 118, 156 126, 150 132" marker-end="url(#arr)"/>
    <path d="M184 132 C 190 126, 190 118, 184 112" marker-end="url(#arr)"/>
  </g>
  <text x="160" y="192" text-anchor="middle" font-size="10" fill="#7a3a36" filter="url(#rough2)">c↔g、d↔h 同时发生（i 固定）</text>

  <!-- right: invariant box -->
  <g filter="url(#rough2)">
    <rect x="300" y="66" width="330" height="150" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10"/>
  </g>
  <g font-size="10.5" fill="#33502a" filter="url(#rough2)">
    <text x="314" y="88" font-weight="bold">不变量：所有列「逆序对奇偶性」的异或</text>
    <text x="314" y="110">一次操作 = 两列各做一次相邻交换</text>
    <text x="314" y="128">⇒ 两列的奇偶性同时翻转 ⇒ 异或不变</text>
    <text x="314" y="150">排好序时每列逆序对为 0（偶）⇒ 异或 = 0</text>
    <text x="314" y="176" font-weight="bold" fill="#2a5a24">xor = 1 ⇒ 无解，直接输出 −1</text>
    <text x="314" y="198" font-size="9.5" fill="#4a7a3a">n=2 时 165 888 个偶 xor 状态全部可达、奇 xor 全部不可达</text>
  </g>

  <!-- bottom: pairing -->
  <g filter="url(#rough2)">
    <rect x="40" y="232" width="590" height="176" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10"/>
  </g>
  <text x="56" y="254" font-size="11" fill="#7a5a20" font-weight="bold" filter="url(#rough2)">把 2n 列配成 n 组：(1,2) (3,4) … (2n−1,2n)，组内操作同时抬起两列的令牌</text>

  <g filter="url(#rough2)">
    <rect x="70" y="272" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="126" y="272" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="208" y="272" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="264" y="272" width="52" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="346" y="272" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="402" y="272" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="484" y="272" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="540" y="272" width="52" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
  </g>
  <g font-size="11" fill="#334" text-anchor="middle" filter="url(#rough2)">
    <text x="96" y="294">列 1</text><text x="152" y="294">列 2</text>
    <text x="234" y="294">列 3</text><text x="290" y="294">列 4</text>
    <text x="372" y="294">列 5</text><text x="428" y="294">列 6</text>
    <text x="510" y="294">列 7</text><text x="566" y="294">列 8</text>
  </g>
  <g stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)">
    <path d="M70 316 L70 326 L178 326 L178 316" marker-end="url(#arr)"/>
    <path d="M208 316 L208 326 L316 326 L316 316" marker-end="url(#arr)"/>
    <path d="M346 316 L346 326 L454 326 L454 316" marker-end="url(#arr)"/>
    <path d="M484 316 L484 326 L592 326 L592 316" marker-end="url(#arr)"/>
  </g>
  <g font-size="10" fill="#2f4f6f" text-anchor="middle" filter="url(#rough2)">
    <text x="124" y="344">组 1</text><text x="262" y="344">组 2</text><text x="400" y="344">组 3</text><text x="538" y="344">组 n</text>
  </g>
  <g font-size="10" fill="#7a5a20" filter="url(#rough2)">
    <text x="56" y="368">• 令牌（当前要归位的值 x）在组内两列的深度 p、q 一般不相等，只有等高才能「一起抬」</text>
    <text x="56" y="386">• 深浅不同 ⇒ 把深的那一个单独上移：借「外侧」邻列当拖拽列（左列借左邻，右列借右邻）</text>
    <text x="56" y="402" font-size="9.5" fill="#a07020">合计 Σ_x Σ_pair(max(p,q) − x) ≤ n·C(2n,2)，正好压进题目给的 n·C(2n,2) + 9n</text>
  </g>
</svg>
