<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="300" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1：一次操作 (2,3)</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">subtree(2)={2}，subtree(3)={3,4,5}，并集 4 个点 → 除节点 1 外都得到 3</text>
  <text x="150" y="110" text-anchor="start" font-size="12.5" fill="#555555" filter="url(#rough2)">树：1-2, 1-3, 3-4, 3-5</text>
  <text x="150" y="146" text-anchor="start" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">节点 2、3、4、5 互相共享标签 1</text>
  <text x="150" y="182" text-anchor="start" font-size="12.5" fill="#b05a5a" filter="url(#rough2)">节点 1 的列表为空 → c_1 = 0</text>
  <text x="150" y="220" text-anchor="start" font-size="14" fill="#2b2b2b" filter="url(#rough2)">输出 0 3 3 3 3</text>
</svg>
