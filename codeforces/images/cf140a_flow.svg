<svg xmlns="http://www.w3.org/2000/svg" width="680" height="200" viewBox="0 0 680 200"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1414"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="680" height="200" fill="#fafafa"/>
  <text x="340.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">判 定</text>
  <path d="M 108.8 42 Q 340.0 48 571.1999999999999 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="340.0" y="186" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">n=1 → r≤R；r&gt;R → NO；R−r&lt;r → NO；否则看角度</text>
  <text x="340" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">n·2·asin(r/(R−r)) ≤ 2π  ⇔  YES</text>
  <text x="340" y="130" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">浮点比较留 1e-12 容差；n=2 且 R−r=r 时相切成立</text>
</svg>
