<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 338" width="640" height="338">
<defs>
<filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="13" result="noise"/>
<feDisplacementMap in="SourceGraphic" in2="noise" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect x="0" y="0" width="640" height="338" fill="#fafafa"/>
<g font-family="Comic Sans MS, Kaiti SC, cursive">
<text x="320.0" y="24.0" font-size="15" fill="#33475b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">长度 n 的序列数 = 矩阵幂的转移计数</text>
<rect x="70.0" y="70.0" width="130.0" height="130.0" rx="10" fill="#eef4fb" stroke="#7a93a8" stroke-width="1.8" filter="url(#rough2)"/>
<text x="135.0" y="100.0" font-size="13" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">状态 0</text>
<text x="135.0" y="130.0" font-size="11" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">（初始）</text>
<line x1="206.0" y1="135.0" x2="250.0" y2="135.0" stroke="#8a6d3b" stroke-width="2.2" filter="url(#rough2)"/>
<polygon points="250.0,135.0 241.0,130.5 241.0,139.5" fill="#8a6d3b" filter="url(#rough2)"/>
<text x="228.0" y="122.0" font-size="13" fill="#8a6d3b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">×M</text>
<rect x="256.0" y="70.0" width="150.0" height="130.0" rx="10" fill="#cfe3d4" stroke="#4f7f60" stroke-width="1.8" filter="url(#rough2)"/>
<text x="331.0" y="100.0" font-size="14" fill="#3f6b4f" text-anchor="middle" font-weight="normal" filter="url(#rough2)">M^n</text>
<text x="331.0" y="130.0" font-size="11" fill="#3f6b4f" text-anchor="middle" font-weight="normal" filter="url(#rough2)">（二进制快速幂）</text>
<text x="331.0" y="160.0" font-size="12" fill="#3f6b4f" text-anchor="middle" font-weight="normal" filter="url(#rough2)">O(D³ log n)</text>
<line x1="410.0" y1="135.0" x2="452.0" y2="135.0" stroke="#8a6d3b" stroke-width="2.2" filter="url(#rough2)"/>
<polygon points="452.0,135.0 443.0,130.5 443.0,139.5" fill="#8a6d3b" filter="url(#rough2)"/>
<rect x="458.0" y="70.0" width="120.0" height="130.0" rx="10" fill="#f6d9b0" stroke="#a08050" stroke-width="1.8" filter="url(#rough2)"/>
<text x="518.0" y="100.0" font-size="12" fill="#7a5c2e" text-anchor="middle" font-weight="normal" filter="url(#rough2)">合法终态</text>
<text x="518.0" y="130.0" font-size="12" fill="#7a5c2e" text-anchor="middle" font-weight="normal" filter="url(#rough2)">求和</text>
<text x="518.0" y="160.0" font-size="11" fill="#7a5c2e" text-anchor="middle" font-weight="normal" filter="url(#rough2)">mod 12345</text>
<text x="320.0" y="240.0" font-size="13" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">M[s][s'] = 从状态 s 选一个罪名后到 s' 的方案数</text>
<rect x="90.0" y="262.0" width="460.0" height="62.0" rx="10" fill="#ffffff" stroke="#9ab" stroke-width="1.6" filter="url(#rough2)"/>
<text x="320.0" y="286.0" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">合法终态：每个出现过的罪名，至少一个条件的余数为 0</text>
<text x="320.0" y="308.0" font-size="11" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">（重数为 1 的条件恒满足，不需要占状态位）</text>
</g>
</svg>
