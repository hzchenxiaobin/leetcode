<svg xmlns="http://www.w3.org/2000/svg" width="880" height="270" viewBox="0 0 880 270"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="270" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">枚举段长 + 回文半串</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">只用给定数字，规模 &lt;= 10^6</text>
  <text x="150" y="105" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">把四段长度 (l0,l1,l2,l3) 各取 1..3，拼成 L=4..12 的串</text>
  <text x="150" y="145" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">串必须是回文 → 只需枚举前 ceil(L/2) 位（&lt;=6 位）再镜像</text>
  <text x="150" y="185" text-anchor="start" font-size="11.5" fill="#3d6b2f" filter="url(#rough2)">剪枝：段首不能是 0（除非单字符），每段值 &lt;= 255，数字集合必须恰好是给定集合</text>
</svg>
