<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="109"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="360" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">abcd 循环：同一个字母每隔 4 位出现一次</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">4 是幸运数，所以任意“相邻位置差”都合法</text>
  <g filter="url(#rough2)"><rect x="150" y="110" width="52" height="46" rx="3" fill="#cfe0f5" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="176.0" y="141" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="176.0" y="102" text-anchor="middle" font-size="9.5" fill="#999999" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="210" y="110" width="52" height="46" rx="3" fill="#d7ecd0" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="236.0" y="141" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="236.0" y="102" text-anchor="middle" font-size="9.5" fill="#999999" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="270" y="110" width="52" height="46" rx="3" fill="#f6e3c4" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="296.0" y="141" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="296.0" y="102" text-anchor="middle" font-size="9.5" fill="#999999" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="330" y="110" width="52" height="46" rx="3" fill="#f6d9d7" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="356.0" y="141" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">d</text>
  <text x="356.0" y="102" text-anchor="middle" font-size="9.5" fill="#999999" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><rect x="390" y="110" width="52" height="46" rx="3" fill="#cfe0f5" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="416.0" y="141" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="416.0" y="102" text-anchor="middle" font-size="9.5" fill="#999999" filter="url(#rough2)">5</text>
  <g filter="url(#rough2)"><rect x="450" y="110" width="52" height="46" rx="3" fill="#d7ecd0" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="476.0" y="141" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="476.0" y="102" text-anchor="middle" font-size="9.5" fill="#999999" filter="url(#rough2)">6</text>
  <g filter="url(#rough2)"><rect x="510" y="110" width="52" height="46" rx="3" fill="#f6e3c4" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="536.0" y="141" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="536.0" y="102" text-anchor="middle" font-size="9.5" fill="#999999" filter="url(#rough2)">7</text>
  <g filter="url(#rough2)"><rect x="570" y="110" width="52" height="46" rx="3" fill="#f6d9d7" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="596.0" y="141" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">d</text>
  <text x="596.0" y="102" text-anchor="middle" font-size="9.5" fill="#999999" filter="url(#rough2)">8</text>
  <g filter="url(#rough2)"><rect x="630" y="110" width="52" height="46" rx="3" fill="#cfe0f5" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="656.0" y="141" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="656.0" y="102" text-anchor="middle" font-size="9.5" fill="#999999" filter="url(#rough2)">9</text>
  <g filter="url(#rough2)"><rect x="690" y="110" width="52" height="46" rx="3" fill="#d7ecd0" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="716.0" y="141" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="716.0" y="102" text-anchor="middle" font-size="9.5" fill="#999999" filter="url(#rough2)">10</text>
  <g filter="url(#rough2)"><line x1="152" y1="168" x2="450" y2="168" stroke="#8a2b28" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrr)"/></g>
  <text x="330" y="190" text-anchor="middle" font-size="11" fill="#8a2b28" filter="url(#rough2)">a 的位置 1,5,9：差都是 4</text>
  <text x="440" y="240" text-anchor="middle" font-size="12" fill="#3d6b2f" font-weight="bold" filter="url(#rough2)">同字母间距 = 4（幸运数）→ 字符串合法</text>
  <text x="440" y="272" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">字母表顺序贪心：第 5 位可以再放 a（差 4），第 6 位放 b …… 故周期为 4</text>
  <text x="440" y="304" text-anchor="middle" font-size="12" fill="#8a2b28" filter="url(#rough2)">答案：s[i] = 'a' + i mod 4（i 从 0 开始）</text>
</svg>
