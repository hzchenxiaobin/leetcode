<svg xmlns="http://www.w3.org/2000/svg" width="840" height="320" viewBox="0 0 840 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="320" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">二进制编码：第 b 次练习按第 b 位分队</text>
  <text x="420" y="56" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">n=5，m=3：编号 1..5 的三位编码</text>
  <g filter="url(#rough2)"><rect x="200" y="100" width="72" height="48" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="236" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">001</text>
  <text x="236" y="164" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">#1</text>
  <g filter="url(#rough2)"><rect x="290" y="100" width="72" height="48" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="326" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">010</text>
  <text x="326" y="164" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">#2</text>
  <g filter="url(#rough2)"><rect x="380" y="100" width="72" height="48" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="416" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">011</text>
  <text x="416" y="164" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">#3</text>
  <g filter="url(#rough2)"><rect x="470" y="100" width="72" height="48" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="506" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">100</text>
  <text x="506" y="164" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">#4</text>
  <g filter="url(#rough2)"><rect x="560" y="100" width="72" height="48" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="596" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">101</text>
  <text x="596" y="164" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">#5</text>
  <text x="420" y="210" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">任意两个编码至少一位不同 ⇒ 该次练习把两人分开</text>
  <g filter="url(#rough2)"><rect x="220" y="236" width="400" height="40" rx="4" fill="#f7fbf4" fill-opacity="0.85" stroke="#a8c99a" stroke-width="1.3"/></g>
  <text x="420" y="262" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3d6b2f" filter="url(#rough2)">m = ⌈log₂ n⌉ 是最少次数（2^m ≥ n）</text>
</svg>
