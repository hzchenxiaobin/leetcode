<svg xmlns="http://www.w3.org/2000/svg" width="760" height="290" viewBox="0 0 760 290"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="67"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>

  <rect width="760" height="290" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">易错点：数的是「最长合法子串」，不是匹配对数</text>
  <path d="M 150 42 Q 380 47 610 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <rect x="50" y="66" width="304" height="116" rx="10" fill="#fdeceb" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="62" y="90" font-size="12" font-weight="bold" fill="#8c3a36" filter="url(#rough2)">✗ 把匹配对数当答案</text>
  <text x="62" y="120" font-size="18" fill="#8c3a36" font-family="'Courier New',monospace" filter="url(#rough2)">()()</text>
  <text x="150" y="120" font-size="11" fill="#8c3a36" filter="url(#rough2)">配对 2 对，会误答 4 2</text>
  <text x="62" y="146" font-size="10.5" fill="#8c3a36" filter="url(#rough2)">但长度 4 的子串只有 1 个（整个串），</text>
  <text x="62" y="166" font-size="10.5" fill="#8c3a36" filter="url(#rough2)">长度 2 的有 2 个 —— 计数对象不同。</text>

  <rect x="396" y="66" width="314" height="116" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="408" y="90" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">✓ 对每个右端点结算一次</text>
  <text x="408" y="120" font-size="18" fill="#2f5223" font-family="'Courier New',monospace" filter="url(#rough2)">()()</text>
  <text x="492" y="120" font-size="11" fill="#2f5223" filter="url(#rough2)">端点 1 → 2，端点 3 → 4</text>
  <text x="408" y="146" font-size="10.5" fill="#2f5223" filter="url(#rough2)">best = 4，取到 4 的端点只有 1 个，</text>
  <text x="408" y="166" font-size="10.5" fill="#2f5223" filter="url(#rough2)">所以 cnt = 1，输出 4 1。</text>

  <text x="50" y="212" font-size="11" fill="#2b2b2b" filter="url(#rough2)">同一个右端点、同一个长度只对应一个子串（起点由长度唯一确定），所以「端点计数」不会重复。</text>
  <text x="50" y="236" font-size="11" fill="#2b2b2b" filter="url(#rough2)">另一个坑：(()) 的匹配对数是 2，但答案是 4 1；而 ())((( 这种没有任何合法子串，必须输出 0 1。</text>
  <text x="50" y="260" font-size="11" fill="#8a6015" filter="url(#rough2)">注意「0 1」的第二项是 1 而不是 0：题面就是这么规定的默认值。</text>
</svg>
