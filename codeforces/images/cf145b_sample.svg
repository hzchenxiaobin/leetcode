<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1453"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="720" height="260" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1：a = (2, 2, 1, 1) 的两种块结构</text>
  <path d="M 150 42 Q 360 48 570 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <rect x="40" y="66" width="300" height="112" rx="9" fill="#eef5ea" stroke="#5a8a4a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="118" text-anchor="middle" font-size="34" font-weight="bold" fill="#2f5223" filter="url(#rough2)">4774</text>
  <text x="190" y="146" text-anchor="middle" font-size="11" fill="#335478" filter="url(#rough2)">首 4 末 4：4 块 2 个、7 块 1 个</text>
  <text x="190" y="166" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">cnt(47)=cnt(74)=1，首字符是 4</text>

  <rect x="380" y="66" width="300" height="112" rx="9" fill="#f4f4f1" stroke="#b8b8b0" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="530" y="118" text-anchor="middle" font-size="34" font-weight="bold" fill="#9a9a92" filter="url(#rough2)">7447</text>
  <line x1="466" y1="108" x2="594" y2="108" stroke="#c07070" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="530" y="146" text-anchor="middle" font-size="11" fill="#777777" filter="url(#rough2)">首 7 末 7：4 块 1 个、7 块 2 个</text>
  <text x="530" y="166" text-anchor="middle" font-size="11" fill="#a05a5a" filter="url(#rough2)">同样合法，但首字符是 7，更大</text>

  <text x="360" y="204" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">两者长度都是 4，逐位比较第一位的 4 &lt; 7，所以 4774 就是最小值</text>
  <text x="360" y="230" text-anchor="middle" font-size="11" fill="#8a5a86" filter="url(#rough2)">a3 = a4 时永远先试「首 4 末 4」，只有它不可行（a1 &lt; k+1 或 a2 &lt; k）才退而求其次</text>
</svg>
