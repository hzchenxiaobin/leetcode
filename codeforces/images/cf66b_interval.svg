<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#bbbbbb" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="880" height="400" fill="#fafafa"/>

  <text x="440" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">左右各沿一条不上升链滑到底，合起来是连续区间 [l, r]</text>
  <text x="440" y="60" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">h = [6, 2, 3, 4, 3, 3, 1, 5, 2]，起点为 4 号区域</text>

  <!-- 区间括号 -->
  <g filter="url(#rough2)">
    <path d="M 179 106 L 179 94 L 569 94 L 569 106" stroke="#4a7a3a" stroke-width="1.8" fill="none"/>
    <text x="374" y="86" text-anchor="middle" font-size="12" fill="#2f5223">浇灌区间 [l, r] = [2, 7]，共 6 个区域</text>
  </g>

  <!-- 九根柱子：基线 y=310，比例 34 px / 单位 -->
  <g filter="url(#rough2)">
    <rect x="70" y="106" width="62" height="204" fill="url(#hatch)" stroke="#999999" stroke-width="1.5"/>
    <rect x="148" y="242" width="62" height="68" fill="#cfe0f5" stroke="#446688" stroke-width="1.5"/>
    <rect x="226" y="208" width="62" height="102" fill="#cfe0f5" stroke="#446688" stroke-width="1.5"/>
    <rect x="304" y="174" width="62" height="136" fill="#f6d9d7" stroke="#b85450" stroke-width="1.8"/>
    <rect x="382" y="208" width="62" height="102" fill="#cfe0f5" stroke="#446688" stroke-width="1.5"/>
    <rect x="460" y="208" width="62" height="102" fill="#cfe0f5" stroke="#446688" stroke-width="1.5"/>
    <rect x="538" y="276" width="62" height="34" fill="#cfe0f5" stroke="#446688" stroke-width="1.5"/>
    <rect x="616" y="140" width="62" height="170" fill="url(#hatch)" stroke="#999999" stroke-width="1.5"/>
    <rect x="694" y="242" width="62" height="68" fill="#eeeeee" stroke="#999999" stroke-width="1.5"/>

    <text x="101" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#888888">6</text>
    <text x="179" y="266" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66">2</text>
    <text x="257" y="232" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66">3</text>
    <text x="335" y="198" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a2b28">4</text>
    <text x="413" y="232" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66">3</text>
    <text x="491" y="232" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66">3</text>
    <text x="569" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66">1</text>
    <text x="647" y="164" text-anchor="middle" font-size="13" font-weight="bold" fill="#888888">5</text>
    <text x="725" y="266" text-anchor="middle" font-size="13" font-weight="bold" fill="#888888">2</text>

    <line x1="50" y1="310" x2="780" y2="310" stroke="#666666" stroke-width="1.6"/>
    <text x="101" y="330" text-anchor="middle" font-size="10.5" fill="#999999">1</text>
    <text x="179" y="330" text-anchor="middle" font-size="10.5" fill="#2f4a66">2 = l</text>
    <text x="257" y="330" text-anchor="middle" font-size="10.5" fill="#2f4a66">3</text>
    <text x="335" y="330" text-anchor="middle" font-size="10.5" fill="#8a2b28">4 起点</text>
    <text x="413" y="330" text-anchor="middle" font-size="10.5" fill="#2f4a66">5</text>
    <text x="491" y="330" text-anchor="middle" font-size="10.5" fill="#2f4a66">6</text>
    <text x="569" y="330" text-anchor="middle" font-size="10.5" fill="#2f4a66">7 = r</text>
    <text x="647" y="330" text-anchor="middle" font-size="10.5" fill="#999999">8</text>
    <text x="725" y="330" text-anchor="middle" font-size="10.5" fill="#999999">9</text>
  </g>

  <!-- 起点向两侧扩展 -->
  <g filter="url(#rough2)">
    <path d="M 318 160 L 250 188" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)"/>
    <path d="M 352 160 L 430 190" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)"/>
    <text x="246" y="176" text-anchor="end" font-size="10.5" fill="#2f5223">向左：3 ≥ 2 通</text>
    <text x="440" y="176" font-size="10.5" fill="#2f5223">向右：3 ≥ 3 ≥ 1 通</text>
  </g>

  <g filter="url(#rough2)">
    <text x="70" y="358" font-size="11" fill="#8a2b28">左侧 6 &gt; 2：水过不去，l 停在 2</text>
    <text x="480" y="358" font-size="11" fill="#8a2b28">右侧 5 &gt; 1：水过不去，r 停在 7</text>
  </g>

  <text x="40" y="386" font-size="11" fill="#666666" filter="url(#rough2)">两条链都以起点为最高点向外单调不增（可以持平），所以可达集合一定是连续区间，长度 r − l + 1。</text>
</svg>
