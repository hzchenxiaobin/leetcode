<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="583"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="330" fill="#fafafa"/>
  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">面额序列必须构成整除链；每一层至少"除掉"一个质因子，所以链长有上界</text>
  <path d="M 60 40 Q 380 48 700 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <text x="40" y="80" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">例：n = 12，最多 4 枚（4 = Ω(12) + 1，Ω 为质因子个数，计重数）</text>
  <g font-size="14">
    <rect x="50" y="96" width="90" height="46" rx="9" fill="#cfe0f5" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="95" y="125" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">12</text>
    <rect x="190" y="96" width="90" height="46" rx="9" fill="#d9ecd4" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="235" y="125" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">6</text>
    <rect x="330" y="96" width="90" height="46" rx="9" fill="#fbe3c8" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="375" y="125" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">3</text>
    <rect x="470" y="96" width="90" height="46" rx="9" fill="#e8e0f5" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="515" y="125" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">1</text>
  </g>
  <path d="M 144 119 L 186 119" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 284 119 L 326 119" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 424 119 L 466 119" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="158" y="100" font-size="10" fill="#555" filter="url(#rough2)">÷2</text>
  <text x="298" y="100" font-size="10" fill="#555" filter="url(#rough2)">÷2</text>
  <text x="438" y="100" font-size="10" fill="#555" filter="url(#rough2)">÷3</text>
  <text x="580" y="110" font-size="10.5" fill="#8a2b28" filter="url(#rough2)">2 × 2 × 3 = 12</text>
  <text x="580" y="128" font-size="10.5" fill="#8a2b28" filter="url(#rough2)">3 个质因子 → 4 枚硬币</text>

  <rect x="40" y="176" width="330" height="120" rx="10" fill="#d9ecd4" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="56" y="200" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">为什么最多只能这么长</text>
  <text x="56" y="222" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">链 c1 &gt; c2 &gt; … &gt; cm 中，每个 ci+1 都整除 ci，</text>
  <text x="56" y="242" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">所以商 qi = ci / ci+1 是 ≥ 2 的整数。</text>
  <text x="56" y="262" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">c1 = q1 · q2 · … · qm-1 ≥ 2^(m-1)，</text>
  <text x="56" y="282" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">故 m − 1 ≤ Ω(c1)，m ≤ Ω(n) + 1。</text>

  <rect x="390" y="176" width="330" height="120" rx="10" fill="#fbe3c8" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="406" y="200" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">构造达到上界</text>
  <text x="406" y="222" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">把 n 的质因子（计重数）逐个除掉：</text>
  <text x="406" y="242" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">n, n/p1, n/(p1p2), …, 1。</text>
  <text x="406" y="262" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">每一步商都是质数 pi ≥ 2，得到 Ω(n)+1 枚；</text>
  <text x="406" y="282" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">相邻项整除，链合法。</text>

  <text x="40" y="318" font-size="10.5" fill="#555555" filter="url(#rough2)">注意：答案不唯一（先除哪个质因子都行）；样例按"先除最小质因子"的顺序，输出 10 5 1、4 2 1、3 1。</text>
</svg>
