<svg xmlns="http://www.w3.org/2000/svg" width="700" height="340" viewBox="0 0 700 340"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="301"/>
    <feDisplacementMap in="SourceGraphic" scale="1.5"/></filter></defs>
  <rect width="700" height="340" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">只看每个 2×2 块里黑格的数量</text>
  <path d="M 140 40 Q 350 46 560 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="60" y="60" width="130" height="46" rx="6" fill="#e8f4e0" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="200" y="60" width="130" height="46" rx="6" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="340" y="60" width="130" height="46" rx="6" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="480" y="60" width="160" height="46" rx="6" fill="#fbeeee" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <g font-size="13" text-anchor="middle" filter="url(#rough2)">
    <text x="125" y="88" fill="#2f5223">0 个黑：已经全白</text>
    <text x="265" y="88" fill="#2f5223">1 个黑：改它 → 全白</text>
    <text x="405" y="88" fill="#8a6015">3 个黑：改白那个</text>
    <text x="560" y="88" fill="#8a3a36">2 个黑：1 次改不动</text>
  </g>
  <g filter="url(#rough2)"><rect x="60" y="120" width="580" height="66" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="144" font-size="13" fill="#22314a" filter="url(#rough2)">4 个黑也算通过（本来就已经是"同色 2×2"）⇒ 判据：存在一个块的黑色数 ≠ 2。</text>
  <text x="76" y="168" font-size="12" fill="#2f4a66" filter="url(#rough2)">只有恰好 2 黑 2 白时，无论改哪一格都还是 1 黑或 3 黑之外…… 不对：改一格会变成 1 黑或 3 黑，</text>
  <text x="76" y="184" font-size="12" fill="#2f4a66" filter="url(#rough2)">但那一格只能改一次，所以"2 黑"的块永远变不成同色 ⇒ 该块不可用。</text>
  <g filter="url(#rough2)"><rect x="60" y="200" width="580" height="60" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="224" font-size="12.5" fill="#2f5223" filter="url(#rough2)">枚举 9 个左上角 (i,j)（i,j∈[0,2]），每块数 4 格。O(1)。</text>
  <text x="76" y="246" font-size="12.5" fill="#2f5223" filter="url(#rough2)">样例 1：块 (0,0)=#. / ## 有 3 黑 ⇒ YES。样例 2：所有块都是 2 黑 ⇒ NO ✓</text>
  <g filter="url(#rough2)"><rect x="60" y="272" width="580" height="52" rx="8" fill="#fbeeee" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="76" y="296" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">易错：把"改一格"理解成"每个块都能改一格"——实际上只有一次机会，所以必须有一个块本身差 ≤1。</text>
  <text x="76" y="316" font-size="12" fill="#8a3a36" filter="url(#rough2)">（"2 黑"的块需要改 2 格，一次改不完。）</text>
</svg>
