<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="300" fill="#fafafa"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">202B：输出格式（样例 1）</text>
  <path d="M 254.04999999999995 46 Q 380.0 52 505.95000000000005 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60.0" y="70.0" width="660.0" height="60.0" rx="9" fill="#fafafa" stroke="#6b6b6b" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="90.0" y="100.0" text-anchor="start" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="90.0" y="120.0" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">find the next palindrome</text>
  <rect x="60.0" y="150.0" width="660.0" height="60.0" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="174.0" text-anchor="start" font-size="10.8" fill="#8a6015" filter="url(#rough2)">归档题里 find(0) the(1) palindrome(3) next(8) 是递增子序列 ⇒ 排列 [0,1,3,2]，inv = 1。</text>
  <text x="74.0" y="196.0" text-anchor="start" font-size="10.8" fill="#8a6015" filter="url(#rough2)">p = 6 − 1 + 1 = 6 ⇒ 输出 6 个竖线：[:||||||:]</text>
  <rect x="60.0" y="230.0" width="660.0" height="50.0" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="258.0" text-anchor="start" font-size="11.0" fill="#2f5b34" filter="url(#rough2)">第一行是归档题编号（从 1 开始），第二行形如 [:|...|:]。</text>
</svg>
