<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1059"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="760" height="340" fill="#fafafa"/>
  <text x="380.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">三人柱：举起与投掷整体搬运</text>
  <path d="M 121.60000000000001 42 Q 380.0 48 638.4 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="380.0" y="326" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">被举者移到举者位置；投掷时整柱一起飞出去</text>
  <line x1="60" y1="250" x2="700" y2="250" stroke="#333333" stroke-width="2" filter="url(#rough2)"/>
  <line x1="120" y1="244" x2="120" y2="256" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="120" y="272" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">1</text>
  <line x1="200" y1="244" x2="200" y2="256" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="200" y="272" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">2</text>
  <line x1="280" y1="244" x2="280" y2="256" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="280" y="272" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">3</text>
  <line x1="360" y1="244" x2="360" y2="256" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="360" y="272" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">4</text>
  <line x1="440" y1="244" x2="440" y2="256" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="440" y="272" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">5</text>
  <line x1="520" y1="244" x2="520" y2="256" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="520" y="272" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">6</text>
  <line x1="600" y1="244" x2="600" y2="256" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="600" y="272" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">7</text>
  <line x1="660" y1="244" x2="660" y2="256" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="660" y="272" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">8</text>
  <rect x="190" y="200" width="20" height="44" rx="3" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="200" y="192" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">E</text>
  <rect x="330" y="170" width="20" height="74" rx="3" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="340" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">F</text>
  <rect x="420" y="130" width="20" height="114" rx="3" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="430" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#335478" filter="url(#rough2)">L</text>
  <line x1="240.0" y1="210.0" x2="320.0" y2="210.0" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="280" y="198" text-anchor="middle" font-size="11" fill="#8c2f2c" filter="url(#rough2)">举起</text>
  <line x1="450.0" y1="170.0" x2="560.0" y2="170.0" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="505" y="158" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">投掷</text>
  <text x="380" y="300" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">举着人不能走；被举着不能行动；投掷后被扔者落地可继续行动</text>
</svg>
