<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">组件分解 → 生成函数 → 闭式</text>

  <!-- row 1 -->
  <rect x="30" y="36" width="500" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="59" text-anchor="middle" font-size="12.5" fill="#223" filter="url(#rough2)">挂树（所有叶子都在 S 中）：R = y + (x+y)(e^R − 1)</text>
  <path d="M 280 74 L 280 88" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- row 2 -->
  <rect x="30" y="92" width="500" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="115" text-anchor="middle" font-size="12.5" fill="#223" filter="url(#rough2)">纯环（环上至少一个黑点）：P = Σ_{L≥2} [ (x+y)^L − x^L ] / L</text>
  <path d="M 280 130 L 280 144" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- row 3 -->
  <rect x="30" y="148" width="500" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="171" text-anchor="middle" font-size="12.5" fill="#223" filter="url(#rough2)">非纯环（至少挂一棵树）：T = Σ_{L≥2} [ ((x+y)e^R)^L − (x+y)^L ] / L</text>
  <path d="M 280 186 L 280 206" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- row 4 -->
  <rect x="30" y="210" width="500" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="235" text-anchor="middle" font-size="13" fill="#223" filter="url(#rough2)">G = exp(P+T) = (1−x) · e^(−R) / (1−x−R)</text>
  <path d="M 280 252 L 280 272" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- row 5 -->
  <rect x="30" y="276" width="500" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="294" text-anchor="middle" font-size="12.5" fill="#223" filter="url(#rough2)">换元 u := x+R，则 u = (x+y)e^(u−x)，G = (x+y)(1−x) / (u(1−u))</text>
  <text x="280" y="310" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">（分母只剩 u，环结构被彻底消掉）</text>
  <path d="M 280 318 L 280 338" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- row 6 -->
  <rect x="30" y="342" width="500" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="361" text-anchor="middle" font-size="12.5" fill="#223" filter="url(#rough2)">令 z = (x+y)e^(−x)：u = z·e^u，用拉格朗日反演</text>
  <text x="280" y="379" text-anchor="middle" font-size="12.5" fill="#223" filter="url(#rough2)">⇒ [z^j] e^(−u)/(1−u) = (j−1)^j / j!</text>
  <path d="M 280 390 L 280 408" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- row 7 -->
  <rect x="30" y="412" width="500" height="44" rx="8" fill="#fff8e1" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="431" text-anchor="middle" font-size="12.5" fill="#223" filter="url(#rough2)">A(n,m) = (n−1) · Σ_{t=0}^{k} (−1)^t C(k,t) · (n−1−t)^(n−1)，k = n−m</text>
  <text x="280" y="449" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">答案 = C(n,m) · A(n,m)</text>
</svg>
