<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="171"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="440" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">峰、谷与“不能水平”的折线</text>
  <path d="M 170 44 Q 380 50 590 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 坐标轴与网格 -->
  <line x1="70" y1="360" x2="700" y2="360" stroke="#2b2b2b" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="70" y1="360" x2="70" y2="140" stroke="#2b2b2b" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="70" y1="340" x2="680" y2="340" stroke="#e3ded4" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <line x1="70" y1="290" x2="680" y2="290" stroke="#e3ded4" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <line x1="70" y1="240" x2="680" y2="240" stroke="#e3ded4" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <line x1="70" y1="190" x2="680" y2="190" stroke="#e3ded4" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <text x="58" y="344" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="58" y="294" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">2</text>
  <text x="58" y="244" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">3</text>
  <text x="58" y="194" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">4</text>
  <text x="40" y="255" font-size="11" fill="#555" filter="url(#rough2)">y</text>

  <!-- 折线 1,3,2,4,1 -->
  <polyline points="130,340 250,240 370,290 490,190 610,340"
            fill="none" stroke="#446688" stroke-width="4" stroke-linejoin="round" filter="url(#rough2)"/>

  <circle cx="130" cy="340" r="6" fill="#fff" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="250" cy="240" r="7" fill="#fde8e8" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <circle cx="370" cy="290" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="2.4" filter="url(#rough2)"/>
  <circle cx="490" cy="190" r="7" fill="#fde8e8" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <circle cx="610" cy="340" r="6" fill="#fff" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>

  <text x="250" y="222" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">峰</text>
  <text x="490" y="172" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">峰</text>
  <text x="370" y="316" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">谷</text>

  <text x="130" y="382" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="250" y="382" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>
  <text x="370" y="382" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">3</text>
  <text x="490" y="382" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4</text>
  <text x="610" y="382" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">5</text>
  <text x="690" y="382" font-size="11" fill="#555" filter="url(#rough2)">i</text>

  <!-- 说明 -->
  <rect x="70" y="398" width="620" height="32" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="380" y="419" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">此例 n=5、t=2：2 个峰 + 1 个谷；相邻 y 不同，所以没有水平段</text>

  <text x="700" y="220" font-size="11" fill="#777" filter="url(#rough2)">1 ≤ y ≤ 4</text>
</svg>
