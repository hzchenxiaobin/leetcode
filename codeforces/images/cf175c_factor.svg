<svg xmlns="http://www.w3.org/2000/svg" width="740" height="380" viewBox="0 0 740 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="173"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="740" height="380" fill="#fafafa"/>
  <text x="370" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">倍率是阶梯函数：越靠后的位置权重越大</text>
  <path d="M 180 46 Q 370 52 560 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="90" y="256" width="174" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="177.0" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">f = 1</text>
  <rect x="264" y="222" width="174" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="351.0" y="214" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">f = 2</text>
  <rect x="438" y="188" width="116" height="102" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="496.0" y="180" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">f = 3</text>
  <line x1="90" y1="290" x2="90" y2="296" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="148" y1="290" x2="148" y2="296" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="206" y1="290" x2="206" y2="296" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="264" y1="290" x2="264" y2="296" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="322" y1="290" x2="322" y2="296" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="380" y1="290" x2="380" y2="296" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="438" y1="290" x2="438" y2="296" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="496" y1="290" x2="496" y2="296" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="554" y1="290" x2="554" y2="296" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="90" y1="290" x2="564" y2="290" stroke="#2b2b2b" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="70" y="316" text-anchor="start" font-size="11" font-weight="normal" fill="#555" filter="url(#rough2)">击杀次序 q = 1 … 8</text>
  <text x="90" y="334" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#b85450" filter="url(#rough2)">p=0</text>
  <text x="264" y="334" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#b85450" filter="url(#rough2)">p=3</text>
  <text x="438" y="334" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#b85450" filter="url(#rough2)">p=6</text>
  <rect x="60" y="60" width="300" height="60" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="74" y="84" text-anchor="start" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">f(q) 单调不减 ⇒ 贵的图形往后放</text>
  <text x="74" y="104" text-anchor="start" font-size="11" font-weight="normal" fill="#7a5a1b" filter="url(#rough2)">得分 = Σ c(第 q 个) · f(q)</text>
  <rect x="60" y="330" width="620" height="40" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="74" y="355" text-anchor="start" font-size="11" font-weight="bold" fill="#2f5223" filter="url(#rough2)">样例 1：5 个 ×10，前 3 个 ×1、后 2 个 ×2 → 30 + 40 = 70。</text>
</svg>
