  <rect x="24" y="342" width="712" height="94" rx="12" fill="#fff8e1" stroke="#e2c483" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="42" y="364" font-size="12" fill="#8a6015" filter="url(#rough2)">粗框 = 该行两个候选里较小的那个，也就是最终答案。</text>
  <text x="42" y="385" font-size="12" fill="#8a6015" filter="url(#rough2)">第 2 组「不动」胜出；第 3、4、6 组「换最大数」胜出；第 1、5 组打平。</text>
  <text x="42" y="406" font-size="12" fill="#8a6015" filter="url(#rough2)">第 3 组：10 → 2+3 = 5，得 (2,3,5)，极差 3；第 4 组：7 → 0+0 = 0，得 (0,0,0)，极差 0。</text>
  <text x="42" y="426" font-size="11.5" fill="#a3762a" filter="url(#rough2)">第 6 组：20 → 4+5 = 9，得 (4,5,9)，极差 5；而「不动」要 16 —— 所以别漏掉换最大数这一手。</text>
