  <text x="583" y="251" text-anchor="middle" font-size="12" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">0</text>
  <rect x="664" y="230" width="76" height="32" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="702" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="#a14340" filter="url(#rough2)">0</text>
  <rect x="30" y="266" width="152" height="32" rx="5" fill="#ffffff" stroke="#bbb" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="106" y="287" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">(2, 3, 5)</text>
  <rect x="188" y="266" width="158" height="32" rx="5" fill="#ffffff" stroke="#bbb" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="267" y="287" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">2 3 5</text>
  <rect x="352" y="266" width="150" height="32" rx="5" fill="#fff8e1" stroke="#446688" stroke-width="2.0" filter="url(#rough2)"/>
  <text x="427" y="287" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">3</text>
  <rect x="508" y="266" width="150" height="32" rx="5" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="583" y="287" text-anchor="middle" font-size="12"  fill="#666" filter="url(#rough2)">3</text>
  <rect x="664" y="266" width="76" height="32" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="702" y="288" text-anchor="middle" font-size="13" font-weight="bold" fill="#a14340" filter="url(#rough2)">3</text>
