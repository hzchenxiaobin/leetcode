<svg xmlns="http://www.w3.org/2000/svg" width="720" height="428" viewBox="0 0 720 428"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="428" fill="#fafafa"/>

  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">分段凸性：每个 cnt 不变的区间内，最大值必在端点</text>
  <path d="M 96 45 Q 360 51 624 45" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 常数区间底色 -->
  <rect x="190" y="92" width="202" height="228" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>
  <rect x="190" y="92" width="202" height="228" fill="none" stroke="#4a7a3a"
        stroke-width="1.2" stroke-dasharray="6 5" filter="url(#rough2)"/>

  <!-- 坐标轴 -->
  <path d="M 86 320 L 472 320" stroke="#2b2b2b" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 86 322 L 86 88" stroke="#2b2b2b" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="482" y="325" font-size="13" fill="#2b2b2b" filter="url(#rough2)">x</text>
  <text x="60" y="86" font-size="13" fill="#2b2b2b" filter="url(#rough2)">f(x)</text>

  <!-- 凸曲线 -->
  <path d="M 104 150 C 150 290 250 300 310 288 C 380 268 430 220 462 152"
        stroke="#446688" stroke-width="2.4" fill="none" filter="url(#rough2)"/>

  <!-- 端点竖线与红点 -->
  <path d="M 190 320 L 190 270" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <path d="M 392 320 L 392 245" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <circle cx="190" cy="270" r="5" fill="#b85450" stroke="#7a2f2b" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="392" cy="245" r="5" fill="#b85450" stroke="#7a2f2b" stroke-width="1.2" filter="url(#rough2)"/>

  <text x="190" y="338" text-anchor="middle" font-size="12" fill="#a33b36" filter="url(#rough2)">a_i</text>
  <text x="392" y="338" text-anchor="middle" font-size="12" fill="#a33b36" filter="url(#rough2)">a_{i+1} - 1</text>
  <text x="291" y="310" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">同一区间：cnt(x) 不变</text>

  <!-- 右侧推导 -->
  <rect x="486" y="90" width="214" height="212" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="500" y="114" font-size="11.5" fill="#8a6015" filter="url(#rough2)">区间内 cnt(x) = c 不变：</text>
  <text x="500" y="138" font-size="11.5" fill="#8a6015" filter="url(#rough2)">f(x) = C + k·x + ⌊(ℓ-1)/x⌋</text>
  <text x="500" y="162" font-size="11.5" fill="#8a6015" filter="url(#rough2)">k = n-1-c ≥ 1</text>
  <text x="500" y="186" font-size="11.5" fill="#8a6015" filter="url(#rough2)">实值 k·x + (ℓ-1)/x 是凸的</text>
  <text x="500" y="210" font-size="11.5" fill="#8a6015" filter="url(#rough2)">取整误差 &lt; 1，整数最优</text>
  <text x="500" y="234" font-size="11.5" fill="#8a6015" filter="url(#rough2)">值仍落在端点</text>
  <text x="500" y="264" font-size="11.5" font-weight="bold" fill="#a33b36" filter="url(#rough2)">⇒ 只查 a_i 与 a_{i+1}-1</text>
  <text x="500" y="286" font-size="11.5" fill="#7a2f2b" filter="url(#rough2)">红点 = 两个端点</text>

  <!-- 底部结论 -->
  <rect x="56" y="356" width="608" height="58" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="380" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">候选集 = {lo, hi} ∪ {a_i, a_i - 1}（i ≤ n-3），共 O(n) 个</text>
  <text x="360" y="402" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">再加情形 A 的 x = min(a_{n-1}, ⌊(ℓ-1)/a_n⌋)，每个候选 O(log n) 求值</text>
</svg>
