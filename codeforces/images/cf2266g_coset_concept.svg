<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" width="720" height="372"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="19"/>
      <feDisplacementMap in="SourceGraphic" scale="1.3"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="720" height="372" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：重复加同一个 S，只在模 g 的同一个同余类里打转</text>
  <path d="M 96 40 Q 360 47 624 40" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- 面板 ① -->
  <rect x="32" y="54" width="656" height="116" rx="10" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="48" y="78" font-size="13" fill="#2f4a66" filter="url(#rough2)">① b = 6，S = 2，a = 1：奇数类与偶数类互不相通</text>

  <rect x="56" y="92" width="44" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="78" y="114" text-anchor="middle" font-size="15" fill="#8a6015" filter="url(#rough2)">1</text>
  <rect x="146" y="92" width="44" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="168" y="114" text-anchor="middle" font-size="15" fill="#8a6015" filter="url(#rough2)">3</text>
  <rect x="236" y="92" width="44" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="258" y="114" text-anchor="middle" font-size="15" fill="#8a6015" filter="url(#rough2)">5</text>
  <path d="M 102 108 H 140" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 192 108 H 230" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="102" font-size="12" fill="#8a6015" filter="url(#rough2)">5 + 2 = 7 ≡ 1 (mod 6)</text>
  <text x="296" y="122" font-size="12" fill="#8a6015" filter="url(#rough2)">绕一整圈后回到起点</text>

  <rect x="470" y="86" width="202" height="72" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="481" y="106" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">g = gcd(S, b) = gcd(2, 6) = 2</text>
  <text x="481" y="126" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">可达 = {1, 3, 5}，最大 5</text>
  <text x="481" y="146" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">0 / 2 / 4 永远碰不到</text>

  <!-- 面板 ② -->
  <rect x="32" y="182" width="656" height="118" rx="10" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="48" y="206" font-size="13" fill="#2f4a66" filter="url(#rough2)">② b = 8，孩子的和先取 2 再取 4：两条轨道被合并成一条</text>

  <rect x="56" y="220" width="44" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="78" y="242" text-anchor="middle" font-size="15" fill="#3c6330" filter="url(#rough2)">0</text>
  <rect x="146" y="220" width="44" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="168" y="242" text-anchor="middle" font-size="15" fill="#8a6015" filter="url(#rough2)">2</text>
  <rect x="236" y="220" width="44" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="258" y="242" text-anchor="middle" font-size="15" fill="#3c6330" filter="url(#rough2)">4</text>
  <rect x="326" y="220" width="44" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="348" y="242" text-anchor="middle" font-size="15" fill="#8a6015" filter="url(#rough2)">6</text>
  <path d="M 102 236 H 140" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 192 236 H 230" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 282 236 H 320" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="398" y="230" font-size="11.5" fill="#3c6330" filter="url(#rough2)">只加 4：gcd(8,4)=4 ⇒ {0,4}，max 4</text>
  <text x="398" y="252" font-size="11.5" fill="#8a6015" filter="url(#rough2)">混用 2 与 4：gcd(8,2,4)=2</text>
  <text x="398" y="274" font-size="11.5" fill="#8a6015" filter="url(#rough2)">⇒ {0,2,4,6}，max 6</text>

  <!-- 结论公式 -->
  <text x="360" y="328" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">g_u = gcd( b_u , Σ_c a_c , { g_c : g_c &lt; b_c } )</text>
  <text x="360" y="354" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">m_u = a_u + ⌊ (b_u − 1 − a_u) / g_u ⌋ · g_u</text>
</svg>
