  <text x="407.5" y="180" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">C×2</text>
  <text x="420" y="220" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">每段内部同色，最终必须相邻不同 ⇒ 保留的原色位置互不相邻 ⇒ 至多保留 ⌈L/2⌉ 个</text>
  <text x="420" y="250" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">改动下界：Σ ⌊L_i / 2⌋ = 0 + 1 + 0 + 1 = 2</text>
  <g filter="url(#rough2)"><rect x="200" y="282" width="43" height="44" rx="4" fill="#f6d9d7" fill-opacity="0.95" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="221.5" y="314" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">A</text>
