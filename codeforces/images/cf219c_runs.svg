  <text x="191.5" y="180" text-anchor="middle" font-size="12" fill="#a0522d" filter="url(#rough2)">A×1</text>
  <g filter="url(#rough2)"><line x1="218" y1="158" x2="309" y2="158" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <g filter="url(#rough2)"><line x1="218" y1="152" x2="218" y2="164" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <g filter="url(#rough2)"><line x1="309" y1="152" x2="309" y2="164" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <text x="263.5" y="180" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">B×2</text>
  <g filter="url(#rough2)"><line x1="314" y1="158" x2="357" y2="158" stroke="#a0522d" stroke-width="1.6"/></g>
  <g filter="url(#rough2)"><line x1="314" y1="152" x2="314" y2="164" stroke="#a0522d" stroke-width="1.2"/></g>
  <g filter="url(#rough2)"><line x1="357" y1="152" x2="357" y2="164" stroke="#a0522d" stroke-width="1.2"/></g>
  <text x="335.5" y="180" text-anchor="middle" font-size="12" fill="#a0522d" filter="url(#rough2)">A×1</text>
  <g filter="url(#rough2)"><line x1="362" y1="158" x2="453" y2="158" stroke="#446688" stroke-width="1.6"/></g>
  <g filter="url(#rough2)"><line x1="362" y1="152" x2="362" y2="164" stroke="#446688" stroke-width="1.2"/></g>
