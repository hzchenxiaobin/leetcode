<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="400" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按极大同色段分解：每段至少要改动一半</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">s = ABBACC，k = 3：段长为 1, 2, 1, 2 → 下界 0 + 1 + 0 + 1 = 2</text>
  <g filter="url(#rough2)"><rect x="170" y="96" width="43" height="44" rx="4" fill="#f6d9d7" fill-opacity="0.95" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="191.5" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">A</text>
  <g filter="url(#rough2)"><rect x="218" y="96" width="43" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.95" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="239.5" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">B</text>
  <g filter="url(#rough2)"><rect x="266" y="96" width="43" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.95" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="287.5" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">B</text>
  <g filter="url(#rough2)"><rect x="314" y="96" width="43" height="44" rx="4" fill="#f6d9d7" fill-opacity="0.95" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="335.5" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">A</text>
  <g filter="url(#rough2)"><rect x="362" y="96" width="43" height="44" rx="4" fill="#d6e6f2" fill-opacity="0.95" stroke="#446688" stroke-width="1.3"/></g>
  <text x="383.5" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">C</text>
  <g filter="url(#rough2)"><rect x="410" y="96" width="43" height="44" rx="4" fill="#d6e6f2" fill-opacity="0.95" stroke="#446688" stroke-width="1.3"/></g>
  <text x="431.5" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">C</text>
