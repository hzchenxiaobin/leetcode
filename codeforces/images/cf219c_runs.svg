  <text x="269.5" y="314" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">B</text>
  <g filter="url(#rough2)"><rect x="296" y="282" width="43" height="44" rx="4" fill="#d6e6f2" fill-opacity="0.95" stroke="#446688" stroke-width="1.3"/></g>
  <text x="317.5" y="314" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">C</text>
  <g filter="url(#rough2)"><rect x="344" y="282" width="43" height="44" rx="4" fill="#f6d9d7" fill-opacity="0.95" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="365.5" y="314" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">A</text>
  <g filter="url(#rough2)"><rect x="392" y="282" width="43" height="44" rx="4" fill="#d6e6f2" fill-opacity="0.95" stroke="#446688" stroke-width="1.3"/></g>
  <text x="413.5" y="314" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">C</text>
  <g filter="url(#rough2)"><rect x="440" y="282" width="43" height="44" rx="4" fill="#f6d9d7" fill-opacity="0.95" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="461.5" y="314" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">A</text>
  <text x="420" y="350" text-anchor="middle" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">贪心恰好改动每段的第 2,4,6,… 个位置：ABBACC → ABCACA（2 次）</text>
  <text x="420" y="376" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">k ≥ 3 保证改色时"左右邻居都避开"总有颜色可选</text>
</svg>
