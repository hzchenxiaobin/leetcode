<svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 0 780 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1101"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr46a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b06a2c"/>
    </marker>
  </defs>

  <rect width="780" height="420" fill="#fafafa"/>
  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">n 个小朋友围成圈，第 i 次向前走 i 步</text>

  <!-- 圆环 -->
  <circle cx="390" cy="210" r="130" fill="none" stroke="#7a8ca6" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="390" cy="80" r="16" fill="#a8d8a8" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="85" text-anchor="middle" font-size="12" fill="#204a1e" filter="url(#rough2)">1</text>
  <circle cx="455" cy="88" r="16" fill="#dbe7fb" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="455" y="93" text-anchor="middle" font-size="12" fill="#23405c" filter="url(#rough2)">2</text>
  <circle cx="510" cy="115" r="16" fill="#ffd9b3" stroke="#b06a2c" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="510" y="120" text-anchor="middle" font-size="12" fill="#8a4a14" filter="url(#rough2)">3</text>
  <circle cx="548" cy="163" r="16" fill="#dbe7fb" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="548" y="168" text-anchor="middle" font-size="12" fill="#23405c" filter="url(#rough2)">4</text>
  <circle cx="560" cy="220" r="16" fill="#f0f0f0" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="560" y="225" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">5</text>
  <circle cx="540" cy="275" r="16" fill="#f0f0f0" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="540" y="280" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">6</text>
  <circle cx="495" cy="315" r="16" fill="#ffd9b3" stroke="#b06a2c" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="495" y="320" text-anchor="middle" font-size="12" fill="#8a4a14" filter="url(#rough2)">7</text>
  <circle cx="430" cy="332" r="16" fill="#f0f0f0" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="430" y="337" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">8</text>
  <circle cx="355" cy="332" r="16" fill="#f0f0f0" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="355" y="337" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">9</text>
  <circle cx="290" cy="305" r="16" fill="#f0f0f0" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="290" y="310" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">10</text>

  <!-- 弧线箭头示意 -->
  <path d="M 405 78 A 140 140 0 0 1 445 85" stroke="#b06a2c" stroke-width="2" fill="none" marker-end="url(#arr46a)" filter="url(#rough2)"/>
  <text x="440" y="60" font-size="10" fill="#8a4a14" filter="url(#rough2)">第 1 次走 1 步</text>
  <path d="M 468 105 A 150 150 0 0 1 500 122" stroke="#b06a2c" stroke-width="2" fill="none" marker-end="url(#arr46a)" filter="url(#rough2)"/>
  <text x="492" y="96" font-size="10" fill="#8a4a14" filter="url(#rough2)">第 2 次走 2 步</text>
  <path d="M 520 205 A 140 140 0 0 1 555 210" stroke="#b06a2c" stroke-width="2" fill="none" marker-end="url(#arr46a)" filter="url(#rough2)"/>
  <text x="520" y="196" font-size="10" fill="#8a4a14" filter="url(#rough2)">绕圈</text>

  <text x="60" y="72" font-size="11" fill="#446688" filter="url(#rough2)">绿色：起点 1 号</text>
  <text x="60" y="92" font-size="11" fill="#446688" filter="url(#rough2)">橙色：第 3、7 步的落点</text>

  <!-- 公式 -->
  <rect x="60" y="356" width="660" height="46" rx="9" fill="#eef4ff" stroke="#446688"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="76" y="384" font-size="14" fill="#23405c" filter="url(#rough2)">pos ← (pos − 1 + i) mod n + 1　（i = 1,2,…,n−1）</text>
</svg>
