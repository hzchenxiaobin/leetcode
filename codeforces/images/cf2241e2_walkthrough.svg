<svg xmlns="http://www.w3.org/2000/svg" width="880" height="584" viewBox="0 0 880 584" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough" x="-6%%" y="-6%%" width="112%%" height="112%%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="880" height="584" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="17.5" font-weight="bold" fill="#22303f" filter="url(#rough)">样例演算：按中位数逐点累加（样例 2，n = 10）</text>
  <rect x="40" y="58" width="800" height="246" rx="10" fill="#ffffff" stroke="#9aa8b6" stroke-width="1.6" filter="url(#rough)"/>
  <text x="88" y="88" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#173a5e" filter="url(#rough)">v</text>
  <text x="176" y="88" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#173a5e" filter="url(#rough)">aᵥ</text>
  <text x="300" y="88" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#173a5e" filter="url(#rough)">完全平方?</text>
  <text x="452" y="88" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#173a5e" filter="url(#rough)">分支大小</text>
  <text x="596" y="88" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#173a5e" filter="url(#rough)">e₂</text>
  <text x="668" y="88" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#173a5e" filter="url(#rough)">e₃</text>
  <text x="772" y="88" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#173a5e" filter="url(#rough)">贡献</text>
  <line x1="56" y1="100" x2="824" y2="100" stroke="#9aa8b6" stroke-width="1.2"/>
  <text x="88" y="128" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough)">1</text>
  <text x="176" y="128" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough)">1</text>
  <text x="300" y="128" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough)">是</text>
  <text x="452" y="128" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough)">8, 1</text>
  <text x="596" y="128" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough)">8</text>
  <text x="668" y="128" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough)">0</text>
  <text x="772" y="128" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough)">8</text>
  <text x="88" y="158" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough)">4</text>
  <text x="176" y="158" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough)">4</text>
  <text x="300" y="158" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough)">是</text>
  <text x="452" y="158" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough)">4, 4, 1</text>
  <text x="596" y="158" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough)">24</text>
  <text x="668" y="158" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough)">16</text>
  <text x="772" y="158" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough)">40</text>
  <text x="88" y="188" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough)">9</text>
  <text x="176" y="188" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough)">9</text>
  <text x="300" y="188" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough)">是</text>
  <text x="452" y="188" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough)">9</text>
  <text x="596" y="188" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough)">0</text>
  <text x="668" y="188" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough)">0</text>
  <text x="772" y="188" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough)">0</text>
  <text x="88" y="218" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough)">其余 7 个</text>
  <text x="176" y="218" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough)">2,3,5,…,10</text>
  <text x="300" y="218" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough)">否</text>
  <text x="452" y="218" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough)">—</text>
  <text x="596" y="218" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough)">—</text>
  <text x="668" y="218" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough)">—</text>
  <text x="772" y="218" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough)">0</text>
  <line x1="56" y1="224" x2="824" y2="224" stroke="#9aa8b6" stroke-width="1.2"/>
  <text x="88" y="248" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a3b12" filter="url(#rough)">合计</text>
  <text x="176" y="248" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a3b12" filter="url(#rough)">—</text>
  <text x="300" y="248" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a3b12" filter="url(#rough)">—</text>
  <text x="452" y="248" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a3b12" filter="url(#rough)">—</text>
  <text x="596" y="248" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a3b12" filter="url(#rough)">32</text>
  <text x="668" y="248" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a3b12" filter="url(#rough)">16</text>
  <text x="772" y="248" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a3b12" filter="url(#rough)">48</text>
  <rect x="40" y="322" width="392" height="106" rx="10" fill="#eef4e8" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough)"/>
  <text x="58" y="350" text-anchor="start" font-size="12" font-weight="bold" fill="#3c5e2e" filter="url(#rough)">样例 1（n = 5，全为 1）：全部顶点都是平方数</text>
  <text x="58" y="376" text-anchor="start" font-size="12" fill="#3c5e2e" filter="url(#rough)">v₂ 分支 [1,1,2] → 7；v₄ 分支 [3,1] → 3</text>
  <text x="58" y="402" text-anchor="start" font-size="12" fill="#3c5e2e" filter="url(#rough)">合计 10 = C(5,3)，与题面「全部三元组都好」一致</text>
  <rect x="448" y="322" width="392" height="106" rx="10" fill="#e8eef7" stroke="#446688" stroke-width="1.6" filter="url(#rough)"/>
  <text x="466" y="350" text-anchor="start" font-size="12" font-weight="bold" fill="#173a5e" filter="url(#rough)">样例 4（n = 8）：6 个顶点是平方数</text>
  <text x="466" y="376" text-anchor="start" font-size="12" fill="#173a5e" filter="url(#rough)">v₃ 分支 [3,2,1,1] → 17 + 17 = 34</text>
  <text x="466" y="402" text-anchor="start" font-size="12" fill="#173a5e" filter="url(#rough)">v₄ 分支 [6,1] → 6；其余叶状顶点贡献 0，共 40</text>
  <rect x="40" y="444" width="800" height="116" rx="10" fill="#fdf6dd" stroke="#b08d2e" stroke-width="1.6" filter="url(#rough)"/>
  <text x="58" y="472" text-anchor="start" font-size="12.5" fill="#5a4410" filter="url(#rough)">样例 3（n = 6）：只有 a₅ = 9 是完全平方数，但删掉顶点 5 后只剩一个 5 顶点分支，</text>
  <text x="58" y="496" text-anchor="start" font-size="12.5" fill="#5a4410" filter="url(#rough)">e₂ = e₃ = 0，答案 0 —— 平方数顶点只是「有资格当交点」，还需要真的有两个以上分支。</text>
  <text x="58" y="526" text-anchor="start" font-size="12.5" font-weight="bold" fill="#7a3b12" filter="url(#rough)">反例：12 = 4 · 3 含平方因子却不是完全平方，n = 3 全取 12 时乘积 12⁷ 不是平方，答案 0。</text>
</svg>
