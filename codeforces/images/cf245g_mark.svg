<svg xmlns="http://www.w3.org/2000/svg" width="720" height="310" viewBox="0 0 720 310"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="720" height="310" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">不为每对用户求交集：以「共同好友」为单位做累加</text>
  <rect x="60" y="60" width="240" height="70" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="180" y="92" text-anchor="middle" font-size="12" fill="#2f5223">标记 x 的好友集合</text>
  <text x="180" y="107" text-anchor="middle" font-size="12" fill="#2f5223">（O(1) 查询）</text>
  <rect x="60" y="170" width="240" height="70" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="180" y="202" text-anchor="middle" font-size="12" fill="#2f4a66">对每个 z ∈ N(x)：</text>
  <text x="180" y="217" text-anchor="middle" font-size="12" fill="#2f4a66">遍历 N(z)，给非好友 y 计数</text>
  <rect x="360" y="60" width="320" height="70" rx="8" fill="#fde9d9" stroke="#b4652a" stroke-width="1.5"/>
  <text x="520" y="92" text-anchor="middle" font-size="12" fill="#7a4b22">cnt[y] = |N(x) ∩ N(y)|</text>
  <text x="520" y="107" text-anchor="middle" font-size="12" fill="#7a4b22">（y 不是 x 的好友）</text>
  <rect x="360" y="170" width="320" height="70" rx="8" fill="#f3edf8" stroke="#7a4a9a" stroke-width="1.5"/>
  <text x="520" y="209" text-anchor="middle" font-size="12" fill="#4a2a62">取 max，数有多少个 y 达到 max</text>
  <line x1="302" y1="95" x2="356" y2="95" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="302" y1="205" x2="356" y2="205" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="40" y="272" text-anchor="start" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">复杂度 Σ_x Σ_{z∈N(x)} deg(z) = Σ_z deg(z)² ≤ (2m)² 量级，m ≤ 5000 时约 2.5×10^7</text>
  <text x="40" y="296" text-anchor="start" font-size="11.5" fill="#7a4b22" filter="url(#rough2)">计数数组用「触碰列表」清零，避免每次 O(用户数) 的 memset</text>
</svg>
