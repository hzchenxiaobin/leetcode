<svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 0 780 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="223"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="780" height="420" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">状态：距离“上一个幸运数字”的位置差 d（封顶 K+1）</text>
  <path d="M 156 39 Q 390 45 624 39" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="40" y="62" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">例：K = 2 时，“4 1 2 3 7” 的前缀演化</text>
  <rect x="40" y="74" width="52" height="40" rx="8" fill="#fff3d6" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="66.0" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#rough2)">4</text>
  <text x="66.0" y="132" text-anchor="middle" font-size="11" fill="#3f6b4a" filter="url(#rough2)">d=1</text>
  <rect x="150" y="74" width="52" height="40" rx="8" fill="#ffffff" stroke="#d6d6d6" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="176.0" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="176.0" y="132" text-anchor="middle" font-size="11" fill="#3f6b4a" filter="url(#rough2)">d=2</text>
  <rect x="260" y="74" width="52" height="40" rx="8" fill="#ffffff" stroke="#d6d6d6" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="286.0" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="286.0" y="132" text-anchor="middle" font-size="11" fill="#3f6b4a" filter="url(#rough2)">d=3（=K+1，安全）</text>
  <rect x="370" y="74" width="52" height="40" rx="8" fill="#ffffff" stroke="#d6d6d6" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="396.0" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="396.0" y="132" text-anchor="middle" font-size="11" fill="#3f6b4a" filter="url(#rough2)">d=K+1</text>
  <rect x="480" y="74" width="52" height="40" rx="8" fill="#fff3d6" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="506.0" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#rough2)">7</text>
  <text x="506.0" y="132" text-anchor="middle" font-size="11" fill="#3f6b4a" filter="url(#rough2)">d=1（新幸运数字）</text>
  <rect x="40" y="150" width="700" height="62" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="56" y="174" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">放一个幸运数字：仅当 d = K+1（最近 K 位都没有幸运数字）才合法，放完 d ← 1；</text>
  <text x="56" y="196" text-anchor="start" font-size="12" fill="#2f4a66" filter="url(#rough2)">放一个非幸运数字：d ← min(d+1, K+1)。d 一旦被顶到 K+1 就“安全”了（更早的幸运数字已经太远）。</text>
  <rect x="40" y="224" width="700" height="56" rx="8" fill="#f7ecec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="248" text-anchor="start" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">d ≤ K 时再放幸运数字 ⇒ 这两个幸运数字的距离 ≤ K ⇒ 这个数就是 nearly lucky（不该被计入“坏数”）。</text>
  <text x="56" y="270" text-anchor="start" font-size="12" fill="#8a3b37" filter="url(#rough2)">于是“非 nearly lucky”的数恰好对应：所有转移都合法的填法。</text>
  <rect x="40" y="292" width="700" height="78" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="316" text-anchor="start" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">10 个数字里，8 个非幸运数字都走同一条转移，只有 4、7 特殊，于是</text>
  <text x="56" y="338" text-anchor="start" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">f[len][d] = 8·f[len−1][min(d+1,K+1)] + (d &gt; K ? 2·f[len−1][1] : 0)</text>
  <text x="56" y="360" text-anchor="start" font-size="12" fill="#7a5a1b" filter="url(#rough2)">预处理 O(L·K) = 10⁶，每个查询 O(L·10) —— 1000 组 1000 位数也只要 10⁷。</text>
</svg>
