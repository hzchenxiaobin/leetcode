<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="340" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="38" text-anchor="middle" font-size="18.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">48B：样例 1（2×2 花园，找 1×1）</text>
  <path d="M 137 50 Q 380 56 623 50" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="90" y="110" width="70" height="70" fill="#3d3d3d" stroke="#bbb" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="125.0" y="150.0" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="normal" filter="url(#rough2)">1</text>
  <rect x="160" y="110" width="70" height="70" fill="#ffffff" stroke="#bbb" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="195.0" y="150.0" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">0</text>
  <rect x="90" y="180" width="70" height="70" fill="#3d3d3d" stroke="#bbb" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="125.0" y="220.0" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="normal" filter="url(#rough2)">1</text>
  <rect x="160" y="180" width="70" height="70" fill="#3d3d3d" stroke="#bbb" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="195.0" y="220.0" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="normal" filter="url(#rough2)">1</text>
  <text x="90" y="100" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">花园：1 0 / 1 1</text>
  <text x="300" y="150" text-anchor="start" font-size="12.5" fill="#2f5223" font-weight="bold" filter="url(#rough2)">a=1, b=1 → 四块里 (0,1) 这块没有树 ⇒ 0</text>
  <text x="300" y="186" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">即使 b×a 也一样；两种摆法取最小 ⇒ 输出 0。</text>
  <text x="300" y="232" text-anchor="start" font-size="12" fill="#8a8a8a" font-weight="normal" filter="url(#rough2)">注意 a&gt;b 或 a 大于 n 时只有一种摆法可行——</text>
  <text x="300" y="256" text-anchor="start" font-size="12" fill="#8a8a8a" font-weight="normal" filter="url(#rough2)">所以两个方向都要单独判断“放不放得下”。</text>
</svg>
