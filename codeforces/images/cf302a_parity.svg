<svg xmlns="http://www.w3.org/2000/svg" width="880" height="250" viewBox="0 0 880 250"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="250" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">区间长度与全局正负个数</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">与区间原来的内容无关</text>
  <text x="150" y="100" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">数组只有 +1 与 -1；区间长 k 的和为 0 ⇔ k 是偶数且能用 k/2 个 +1 与 k/2 个 -1</text>
  <text x="150" y="142" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">整个数组可任意重排，所以只要全局 +1/-1 的个数都够 k/2</text>
  <text x="150" y="184" text-anchor="start" font-size="13" fill="#3d6b2f" filter="url(#rough2)">答案 = (k 偶数) 且 min(正数, 负数) &gt;= k/2</text>
</svg>
