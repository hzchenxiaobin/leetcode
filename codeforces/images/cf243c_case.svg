<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="720" height="300" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1 的形状（R8, U9, L9, D8, L2）</text>
  <text x="60" y="60" text-anchor="start" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">被喷的床组成一条 4-连通折线，围出左上角的 8×8 区域</text>
  <rect x="120" y="90" width="360" height="150" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="300" y="169" text-anchor="middle" font-size="12" fill="#2f5223">内部 8×8 = 64 格（BFS 从外部到不了）</text>
  <rect x="120" y="90" width="360" height="20" rx="8" fill="#fde9d9" stroke="#b4652a" stroke-width="1.5"/>
  <text x="60" y="270" text-anchor="start" font-size="12" fill="#7a4b22" filter="url(#rough2)">再加上折线本身 37 格 → 一共 101 格不会被感染</text>
  <text x="60" y="60" text-anchor="start" font-size="gray" fill="#2b2b2b" filter="url(#rough2)"></text>
</svg>
