<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="73"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="720" height="340" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">为什么不可能超过 3n/2</text>
  <path d="M 144 41 Q 360 47 576 41" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="30" y="60" width="660" height="46" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="48" y="89" text-anchor="start" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">① 总击杀 = k₁ + k₂ + k₃，其中 k₃ ≤ min(n − k₁, n − k₂) = n − max(k₁, k₂)</text>
  <rect x="30" y="116" width="660" height="46" rx="8" fill="#e3eefb" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="48" y="145" text-anchor="start" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">② 于是总数 ≤ k₁ + k₂ + n − max(k₁, k₂) = n + min(k₁, k₂)</text>
  <rect x="30" y="172" width="660" height="46" rx="8" fill="#e9f4ec" stroke="#3f6b4a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="48" y="201" text-anchor="start" font-size="12.5" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">③ 又因为 k₂ ≤ n − k₁，故 min(k₁, k₂) ≤ min(k₁, n − k₁) ≤ n/2</text>
  <rect x="30" y="228" width="660" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="48" y="257" text-anchor="start" font-size="12.5" font-weight="bold" fill="#d6a040" filter="url(#rough2)">④ 代回得总数 ≤ n + n/2 = 3n/2，而 k₁ = k₂ = n/2 的构造正好达到</text>
  <text x="30" y="308" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">注意 k₁ 不能超过 n/2：杀得越多，Arcady 反击的人就越少，第三回合的火力也跟着减少</text>
</svg>
