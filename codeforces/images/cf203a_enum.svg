<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="320" fill="#fafafa"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">203A：每题每分钟掉分，可以不做</text>
  <path d="M 228.89 46 Q 380.0 52 531.11 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60.0" y="70.0" width="660.0" height="56.0" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="96.0" text-anchor="start" font-size="10.9" fill="#33506e" filter="url(#rough2)">第 i 分钟提交第 1 题得 a − i·d_a；第 2 题 b − i·d_b（i = 0..t−1）。</text>
  <rect x="60.0" y="140.0" width="660.0" height="56.0" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="166.0" text-anchor="start" font-size="10.9" fill="#2f5b34" filter="url(#rough2)">可以做 0、1、2 题 ⇒ 得分为 0、a−i·d_a、b−j·d_b 或两者之和。</text>
  <rect x="60.0" y="210.0" width="660.0" height="56.0" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="234.0" text-anchor="start" font-size="10.9" fill="#8a6015" filter="url(#rough2)">t ≤ 300 ⇒ 枚举 i、j 共 9×10⁴ 种组合即可。</text>
  <text x="74.0" y="256.0" text-anchor="start" font-size="10.9" fill="#8a6015" filter="url(#rough2)">注意 x = 0 恒为 YES（一题都不做）。</text>
</svg>
