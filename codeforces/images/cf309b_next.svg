<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="240" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">先算出"从第 i 个词起贪心填一行后，下一行从哪开始"</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">记作 next[i]，用双指针 O(n) 求出</text>
  <text x="150" y="100" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">next[i] = 从 i 开始，能放进一行（&lt;= c 个字符、词间单空格）的最远起点</text>
  <text x="150" y="140" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">窗口右端单调不减，所以两个指针一遍扫完</text>
  <text x="150" y="178" text-anchor="start" font-size="11.5" fill="#3d6b2f" filter="url(#rough2)">i 右移时要扣掉首词长度（窗口里还有别的词时再扣 1 个空格）</text>
</svg>
