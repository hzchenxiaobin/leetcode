<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="340" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">C：可达 ⟺ 目标串的“行程压缩”是 s 的子序列</text>
  <path d="M 130 42 Q 380 47 630 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <text x="52" y="76" font-size="11.5" fill="#777" filter="url(#rough2)">源串 s = abca</text>
  <rect x="52" y="84" width="46" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="102" y="84" width="46" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="152" y="84" width="46" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="202" y="84" width="46" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="75" y="109" text-anchor="middle" font-size="15" fill="#2f4a66" filter="url(#rough2)">a</text>
  <text x="125" y="109" text-anchor="middle" font-size="15" fill="#2f4a66" filter="url(#rough2)">b</text>
  <text x="175" y="109" text-anchor="middle" font-size="15" fill="#2f4a66" filter="url(#rough2)">c</text>
  <text x="225" y="109" text-anchor="middle" font-size="15" fill="#2f4a66" filter="url(#rough2)">a</text>
  <text x="75" y="138" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="125" y="138" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="175" y="138" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="225" y="138" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">4</text>

  <rect x="52" y="164" width="330" height="72" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="64" y="188" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">t = aabc → 压缩成 abc</text>
  <text x="64" y="212" font-size="11" fill="#3c5e2e" filter="url(#rough2)">a(1) b(2) c(3) 依次匹配 ✓ 可达</text>
  <text x="64" y="230" font-size="10" fill="#3c5e2e" filter="url(#rough2)">做法：先把 b 右移、再让 a 右扩一格</text>

  <rect x="52" y="248" width="330" height="72" rx="10" fill="#fdeceb" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="64" y="272" font-size="12" font-weight="bold" fill="#8c3a36" filter="url(#rough2)">t = aacb → 压缩成 acb</text>
  <text x="64" y="296" font-size="11" fill="#8c3a36" filter="url(#rough2)">a(1) c(3) 之后找不到 b ✗ 不可达</text>
  <text x="64" y="314" font-size="10" fill="#8c3a36" filter="url(#rough2)">想造 b 就得覆盖 c，c 就再也回不来了</text>

  <line x1="404" y1="70" x2="404" y2="330" stroke="#ddd" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <text x="424" y="90" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">两种操作的本质：</text>
  <text x="424" y="116" font-size="11" fill="#555" filter="url(#rough2)">相邻两格，把一格复制到另一格</text>
  <text x="424" y="142" font-size="11" fill="#555" filter="url(#rough2)">⟹ 一个字符只能“就地扩张”成一段连续块</text>
  <text x="424" y="168" font-size="11" fill="#555" filter="url(#rough2)">⟹ 最终串 = 若干个源字符各自扩张成块</text>
  <text x="424" y="194" font-size="11" fill="#555" filter="url(#rough2)">⟹ 相邻块字符不同，块序列就是“行程压缩”</text>
  <text x="424" y="220" font-size="11" fill="#2f5223" filter="url(#rough2)">所以压缩后必须是 s 的子序列（按顺序出现）</text>
  <text x="424" y="246" font-size="10.5" fill="#8a6015" filter="url(#rough2)">反过来，只要压缩是子序列，从右往左填块就能造出来</text>
  <text x="424" y="272" font-size="10.5" fill="#777" filter="url(#rough2)">（先填右边的块，再填左边，避免覆盖还没用的源）</text>
  <text x="424" y="300" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">这条判据已对长度 ≤ 6 的全部 a/b/c 串与 BFS 逐一核对</text>
</svg>
