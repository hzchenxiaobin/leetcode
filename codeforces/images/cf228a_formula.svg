<svg xmlns="http://www.w3.org/2000/svg" width="840" height="320" viewBox="0 0 840 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="320" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">答案 = 4 − d 的两向夹逼</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">d = 不同颜色数</text>
  <g filter="url(#rough2)"><rect x="120" y="92" width="280" height="90" rx="4" fill="#f7fbf4" fill-opacity="0.85" stroke="#a8c99a" stroke-width="1.3"/></g>
  <text x="260" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#3d6b2f" filter="url(#rough2)">下界 ≥ 4 − d</text>
  <text x="260" y="148" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">每种颜色最多留 1 只</text>
  <text x="260" y="168" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">共 d 种，至多留 d 只</text>
  <g filter="url(#rough2)"><rect x="440" y="92" width="280" height="90" rx="4" fill="#fdf6f4" fill-opacity="0.85" stroke="#d8a89a" stroke-width="1.3"/></g>
  <text x="580" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a4b2a" filter="url(#rough2)">上界 ≤ 4 − d</text>
  <text x="580" y="148" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">留每种各 1 只</text>
  <text x="580" y="168" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">再买 4 − d 只新颜色</text>
  <text x="420" y="226" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两界相等 ⇒ 最少购买数 = 4 − d</text>
  <text x="420" y="268" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">复杂度 O(1)，颜色值可达 10⁹ 也不影响</text>
</svg>
