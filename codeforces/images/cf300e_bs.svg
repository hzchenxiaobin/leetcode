<svg xmlns="http://www.w3.org/2000/svg" width="700" height="260" viewBox="0 0 700 260"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="903"/>
    <feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></defs>
  <rect width="700" height="260" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每个素数的 n_p 怎么求：在窄区间里二分</text>
  <path d="M 170 40 Q 350 46 530 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="66" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="12.5" fill="#22314a" filter="url(#rough2)">关键夹逼：v_p(x!) ≤ x/(p−1) 且 v_p(x!) ≥ x/(p−1) − log_p(x)·p/(p−1)</text>
  <text x="76" y="106" font-size="12.5" fill="#22314a" filter="url(#rough2)">⇒ n_p ∈ [S_p(p−1), S_p·p]（区间宽度只有 S_p，log 级别步数）。</text>
  <g filter="url(#rough2)"><rect x="60" y="134" width="580" height="76" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="158" font-size="12.5" fill="#2f5223" filter="url(#rough2)">v_p(x!) 用经典的 ⌊x/p⌋+⌊x/p²⌋+… 计算，O(log_p x)（多数素数只有 3–4 项）。</text>
  <text x="76" y="182" font-size="12.5" fill="#2f5223" filter="url(#rough2)">单素数代价 ≈ 44 步 × 4 次除法 ⇒ 全部 66 万个素数约 1.2·10⁸ 次基本运算。</text>
  <text x="76" y="202" font-size="12" fill="#3c5e2e" filter="url(#rough2)">实测 k=10⁶ 全 10⁷：0.30 s；随机：0.42 s（时限 5 s）。</text>
  <g filter="url(#rough2)"><rect x="60" y="214" width="580" height="34" rx="8" fill="#fbeeee" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="76" y="236" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">边界：全部 aᵢ=1 时 S_p 全为 0 ⇒ 答案 1（初值不能写 0）。</text>
</svg>
