<svg xmlns="http://www.w3.org/2000/svg" width="700" height="350" viewBox="0 0 700 350"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="19"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="700" height="350" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">自相似结构：整条 s 由同一个基础块 B 的拷贝拼成</text>
  <text x="350" y="52" text-anchor="middle" font-size="11.5" fill="#888888" filter="url(#rough2)">以 k = 3 为例：B₁ = 012，B₂ = 012 120 201</text>
  <text x="118" y="90" text-anchor="end" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">B₁ =</text>
  <rect x="130" y="72" width="38" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="149.0" y="94.4" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="170" y="72" width="38" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="189.0" y="94.4" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="210" y="72" width="38" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="229.0" y="94.4" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <line x1="190" y1="110" x2="190" y2="132" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar2)" filter="url(#rough2)"/>
  <text x="206" y="126" text-anchor="start" font-size="11" fill="#888888" filter="url(#rough2)">每个数字 +j（j = 0,1,2）</text>
  <text x="118" y="172" text-anchor="end" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">B₂ =</text>
  <rect x="130" y="150" width="32" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="146.0" y="171.04" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="164" y="150" width="32" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="180.0" y="171.04" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="198" y="150" width="32" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="214.0" y="171.04" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="232" y="150" width="32" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="248.0" y="171.04" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="266" y="150" width="32" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="282.0" y="171.04" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="300" y="150" width="32" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="316.0" y="171.04" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="334" y="150" width="32" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="350.0" y="171.04" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="368" y="150" width="32" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="384.0" y="171.04" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="402" y="150" width="32" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="418.0" y="171.04" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="178" y="200" text-anchor="middle" font-size="11" fill="#888888" filter="url(#rough2)">⊕0</text>
  <text x="280" y="200" text-anchor="middle" font-size="11" fill="#888888" filter="url(#rough2)">⊕1</text>
  <text x="382" y="200" text-anchor="middle" font-size="11" fill="#888888" filter="url(#rough2)">⊕2</text>
  <rect x="60" y="212" width="580" height="52" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="350" y="235" text-anchor="middle" font-size="13" fill="#8a6d20" font-weight="bold" filter="url(#rough2)">s[a·M + b] ≡ s_a + s_b (mod k)   (b &lt; M = k^L)</text>
  <text x="350" y="254" text-anchor="middle" font-size="11" fill="#888888" filter="url(#rough2)">⇒ 第 a 块 = 基础块 B_L 的每个数字加 s_a（模 k）</text>
  <text x="350" y="282" text-anchor="middle" font-size="11" fill="#888888" filter="url(#rough2)">B₃ = 三个 B₂ 分别加 0 / 1 / 2 后拼接（长度乘 k）</text>
  <rect x="60" y="292" width="180" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150.0" y="315.5" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">B₂ ⊕ 0</text>
  <rect x="260" y="292" width="180" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="350.0" y="315.5" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">B₂ ⊕ 1</text>
  <rect x="460" y="292" width="180" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="550.0" y="315.5" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">B₂ ⊕ 2</text>
</svg>
