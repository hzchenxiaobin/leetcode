<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="340" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例走查：6 个数里最少删 2 个</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">排序后 3,3,4,5,7,8；逐个 lo 试窗口，最好的窗口装下 4 个数</text>
  <text x="60" y="100" text-anchor="start" font-size="13" fill="#555555" filter="url(#rough2)">原数据</text>
  <g filter="url(#rough2)"><rect x="140" y="82" width="50" height="42" rx="4" fill="#f6e3c4" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="165.0" y="108.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><rect x="200" y="82" width="50" height="42" rx="4" fill="#f6e3c4" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="225.0" y="108.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <g filter="url(#rough2)"><rect x="260" y="82" width="50" height="42" rx="4" fill="#f6e3c4" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="285.0" y="108.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="320" y="82" width="50" height="42" rx="4" fill="#f6e3c4" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="345.0" y="108.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">8</text>
  <g filter="url(#rough2)"><rect x="380" y="82" width="50" height="42" rx="4" fill="#f6e3c4" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="405.0" y="108.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="440" y="82" width="50" height="42" rx="4" fill="#f6e3c4" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="465.0" y="108.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">7</text>
  <text x="60" y="172" text-anchor="start" font-size="13" fill="#555555" filter="url(#rough2)">排序后</text>
  <g filter="url(#rough2)"><rect x="140" y="154" width="50" height="42" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="165.0" y="180.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="200" y="154" width="50" height="42" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="225.0" y="180.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="260" y="154" width="50" height="42" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="285.0" y="180.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><rect x="320" y="154" width="50" height="42" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="345.0" y="180.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <g filter="url(#rough2)"><rect x="380" y="154" width="50" height="42" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="405.0" y="180.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">7</text>
  <g filter="url(#rough2)"><rect x="440" y="154" width="50" height="42" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="465.0" y="180.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">8</text>
  <text x="200" y="240" text-anchor="end" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">lo=3</text>
  <text x="240" y="240" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">[3,6]</text>
  <text x="380" y="240" text-anchor="start" font-size="12.5" fill="#555555" filter="url(#rough2)">3,3,4,5</text>
  <text x="540" y="240" text-anchor="start" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">保留 4</text>
  <text x="200" y="266" text-anchor="end" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">lo=4</text>
  <text x="240" y="266" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">[4,8]</text>
  <text x="380" y="266" text-anchor="start" font-size="12.5" fill="#555555" filter="url(#rough2)">4,5,7,8</text>
  <text x="540" y="266" text-anchor="start" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">保留 4</text>
  <text x="200" y="292" text-anchor="end" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">lo=5</text>
  <text x="240" y="292" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">[5,10]</text>
  <text x="380" y="292" text-anchor="start" font-size="12.5" fill="#555555" filter="url(#rough2)">5,7,8</text>
  <text x="540" y="292" text-anchor="start" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">保留 3</text>
  <text x="200" y="318" text-anchor="end" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">lo=7</text>
  <text x="240" y="318" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">[7,14]</text>
  <text x="380" y="318" text-anchor="start" font-size="12.5" fill="#555555" filter="url(#rough2)">7,8</text>
  <text x="540" y="318" text-anchor="start" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">保留 2</text>
  <text x="700" y="290" text-anchor="start" font-size="14" font-weight="bold" fill="#3d6b2f" filter="url(#rough2)">best = 4</text>
  <text x="700" y="316" text-anchor="start" font-size="14" font-weight="bold" fill="#b05a5a" filter="url(#rough2)">答案 6-4 = 2</text>
</svg>
