<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="617"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="300" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">按直径分组求 min，再按 (颜色,直径) 分组求 min</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">前者是配对数上界，后者是完美配对数上界</text>
  <g filter="url(#rough2)"><rect x="60" y="96" width="380" height="90" rx="6" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="250" y="126" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">u = Σ_d min(笔(d), 帽(d))</text>
  <text x="250" y="158" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">只受直径约束</text>
  <g filter="url(#rough2)"><rect x="480" y="96" width="380" height="90" rx="6" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="670" y="126" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">v = Σ_{c,d} min(笔(c,d), 帽(c,d))</text>
  <text x="670" y="158" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">颜色也要相同</text>
  <text x="450" y="222" text-anchor="middle" font-size="11.5" fill="#b06a1e" filter="url(#rough2)">完美配对本身也是配对，所以取满 v 不会减少 u</text>
  <text x="450" y="254" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">答案就是这两个和</text>
</svg>
