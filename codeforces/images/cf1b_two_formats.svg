<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrL" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto">
      <path d="M 8 0 L 0 4 L 8 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="340" fill="#fafafa"/>

  <text x="320" y="32" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">同一个格子的两种写法：BC23 与 R23C55</text>
  <text x="320" y="53" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">列用 26 进制字母（A=1 … Z=26，AA=27），行用十进制；两种记法描述的是同一个格子</text>

  <g filter="url(#rough2)">
    <rect x="38" y="74" width="228" height="96" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="152" y="96" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold">Excel 写法</text>
    <text x="152" y="130" text-anchor="middle" font-size="24" fill="#2b3a55">BC23</text>
    <text x="152" y="156" text-anchor="middle" font-size="9.5" fill="#3a4a66">字母在前：列 BC = 55，数字在后：行 23</text>

    <rect x="374" y="74" width="228" height="96" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="488" y="96" text-anchor="middle" font-size="10.5" fill="#3a5a30" font-weight="bold">RXCY 写法</text>
    <text x="488" y="130" text-anchor="middle" font-size="24" fill="#2c4a24">R23C55</text>
    <text x="488" y="156" text-anchor="middle" font-size="9.5" fill="#3a5a30">R 后是行 23，C 后是列 55（都是十进制）</text>

    <path d="M 282 122 L 358 122" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 358 108 L 282 108" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrL)"/>
    <text x="320" y="99" text-anchor="middle" font-size="8.5" fill="#446688">RXCY → Excel</text>
    <text x="320" y="140" text-anchor="middle" font-size="8.5" fill="#446688">Excel → RXCY</text>
  </g>

  <g filter="url(#rough2)" font-size="9" fill="#888" text-anchor="middle">
    <text x="320" y="186">Excel 的列序（列号 1 → 55）</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="35" y="196" width="58" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="64" y="216" text-anchor="middle" font-size="14" fill="#2b3a55">A</text>
    <text x="64" y="232" text-anchor="middle" font-size="9" fill="#3a4a66">1</text>

    <rect x="99" y="196" width="58" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="128" y="216" text-anchor="middle" font-size="14" fill="#2b3a55">B</text>
    <text x="128" y="232" text-anchor="middle" font-size="9" fill="#3a4a66">2</text>

    <rect x="163" y="196" width="58" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="192" y="216" text-anchor="middle" font-size="14" fill="#2b3a55">C</text>
    <text x="192" y="232" text-anchor="middle" font-size="9" fill="#3a4a66">3</text>

    <rect x="227" y="196" width="58" height="44" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="256" y="218" text-anchor="middle" font-size="14" fill="#999">…</text>
    <text x="256" y="232" text-anchor="middle" font-size="9" fill="#999">…</text>

    <rect x="291" y="196" width="58" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="320" y="216" text-anchor="middle" font-size="14" fill="#2b3a55">Z</text>
    <text x="320" y="232" text-anchor="middle" font-size="9" fill="#3a4a66">26</text>

    <rect x="355" y="196" width="58" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="384" y="216" text-anchor="middle" font-size="14" fill="#2b3a55">AA</text>
    <text x="384" y="232" text-anchor="middle" font-size="9" fill="#3a4a66">27</text>

    <rect x="419" y="196" width="58" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="448" y="216" text-anchor="middle" font-size="14" fill="#2b3a55">AB</text>
    <text x="448" y="232" text-anchor="middle" font-size="9" fill="#3a4a66">28</text>

    <rect x="483" y="196" width="58" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="512" y="216" text-anchor="middle" font-size="14" fill="#2b3a55">AZ</text>
    <text x="512" y="232" text-anchor="middle" font-size="9" fill="#3a4a66">52</text>

    <rect x="547" y="196" width="58" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <text x="576" y="216" text-anchor="middle" font-size="14" fill="#8a3a38">BC</text>
    <text x="576" y="232" text-anchor="middle" font-size="9" fill="#8a3a38">55</text>
  </g>

  <rect x="35" y="254" width="570" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="320" y="276" text-anchor="middle" font-size="10" fill="#5a4a20" filter="url(#rough2)">BC 的列号 = 2×26 + 3 = 55（A 记 1、没有 0，所以这是「双射 26 进制」）</text>

  <text x="320" y="314" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">第 55 列第 23 行：BC23 ⇔ R23C55，一个格子两种写法，互相唯一确定</text>
</svg>
