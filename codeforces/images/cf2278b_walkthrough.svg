<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="19"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：先算三个净胜数，再取最大的那一招</text>
  <path d="M 122 44 Q 360 51 598 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 表头 -->
  <text x="56" y="76" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">(x, y, z)</text>
  <text x="210" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">x−y</text>
  <text x="278" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">y−z</text>
  <text x="346" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">z−x</text>
  <text x="432" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">选中招式</text>
  <text x="530" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">输出</text>
  <text x="646" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">最坏净胜</text>
  <path d="M 48 84 L 672 84" stroke="#999" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- 第 1 行 (0,0,3)：z−x = 3 最大 -->
  <rect x="48" y="90" width="624" height="32" rx="4" fill="#eef2f7" stroke="#d8dee6" stroke-width="1" filter="url(#rough2)"/>
  <text x="56" y="112" font-size="13" fill="#333" filter="url(#rough2)">(0, 0, 3)</text>
  <text x="210" y="112" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="278" y="112" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">−3</text>
  <rect x="320" y="93" width="52" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="346" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d22" filter="url(#rough2)">3</text>
  <text x="432" y="112" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">S（剪刀）</text>
  <text x="530" y="112" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">SSS</text>
  <text x="646" y="112" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>

  <!-- 第 2 行 (1,1,2)：z−x = 1 最大 -->
  <text x="56" y="150" font-size="13" fill="#333" filter="url(#rough2)">(1, 1, 2)</text>
  <text x="210" y="150" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="278" y="150" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">−1</text>
  <rect x="320" y="131" width="52" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="346" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d22" filter="url(#rough2)">1</text>
  <text x="432" y="150" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">S（剪刀）</text>
  <text x="530" y="150" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">SSSS</text>
  <text x="646" y="150" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <!-- 第 3 行 (3,5,0)：y−z = 5 最大 -->
  <rect x="48" y="166" width="624" height="32" rx="4" fill="#eef2f7" stroke="#d8dee6" stroke-width="1" filter="url(#rough2)"/>
  <text x="56" y="188" font-size="13" fill="#333" filter="url(#rough2)">(3, 5, 0)</text>
  <text x="210" y="188" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">−2</text>
  <rect x="252" y="169" width="52" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="278" y="188" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d22" filter="url(#rough2)">5</text>
  <text x="346" y="188" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">−3</text>
  <text x="432" y="188" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">R（石头）</text>
  <text x="530" y="188" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">RRRRRRRR</text>
  <text x="646" y="188" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>

  <!-- 第 4 行 (2,0,3)：x−y = 2 最大 -->
  <text x="56" y="226" font-size="13" fill="#333" filter="url(#rough2)">(2, 0, 3)</text>
  <rect x="184" y="207" width="52" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="210" y="226" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5d22" filter="url(#rough2)">2</text>
  <text x="278" y="226" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">−3</text>
  <text x="346" y="226" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="432" y="226" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">P（布）</text>
  <text x="530" y="226" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">PPPPP</text>
  <text x="646" y="226" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>

  <path d="M 48 244 L 672 244" stroke="#999" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <text x="56" y="264" font-size="11" fill="#4a7a3a" filter="url(#rough2)">粗绿框 = 三个净胜数里最大的那个，它决定输出字符</text>

  <rect x="48" y="278" width="624" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="298" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">第 1、2 组就是官方样例：题面给的 RPS / SPSS 与我们的 SSS / SSSS 都合法</text>
  <text x="360" y="318" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">题目只要求「Bob 赢的局数 ≥ Alice」，任意一组合法解都接受</text>

  <rect x="48" y="336" width="624" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="356" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">净胜只要 ≥ 0 就算达标：官方样例的 RPS / SPSS 净胜为 0，同样合法</text>
  <text x="360" y="376" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">第 3 组 8 个字符、第 4 组 5 个字符：输出长度必须恰好等于 x+y+z</text>
</svg>
