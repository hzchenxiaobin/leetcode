<svg xmlns="http://www.w3.org/2000/svg" width="860" height="380" viewBox="0 0 860 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="75"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="860" height="380" fill="#fafafa"/>

  <text x="430" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">构造的四个阶段：先用 3-cycle 归位，再逐行排序</text>

  <g filter="url(#rough2)">
    <rect x="30" y="70" width="180" height="120" rx="10" fill="#e8e0f2" stroke="#6b5b9a" stroke-width="1.6"/>
    <text x="120" y="96" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4b3f66">① 奇偶修正</text>
    <text x="120" y="120" text-anchor="middle" font-size="10.5" fill="#444444">所有 3-cycle 都是偶置换</text>
    <text x="120" y="140" text-anchor="middle" font-size="10.5" fill="#444444">所需置换为奇时</text>
    <text x="120" y="158" text-anchor="middle" font-size="10.5" fill="#444444">先做一次行移动</text>
    <text x="120" y="178" text-anchor="middle" font-size="10" fill="#777777">（1 步）</text>

    <path d="M 210 130 L 246 130" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>

    <rect x="248" y="70" width="190" height="120" rx="10" fill="#cfe0f5" stroke="#446688" stroke-width="1.6"/>
    <text x="343" y="96" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66">② 归位第 1–4 行</text>
    <text x="343" y="120" text-anchor="middle" font-size="10.5" fill="#444444">逐格：把正确筹码</text>
    <text x="343" y="140" text-anchor="middle" font-size="10.5" fill="#444444">搬到目标旁，再 3-cycle</text>
    <text x="343" y="160" text-anchor="middle" font-size="10.5" fill="#444444">只经过未归位的格子</text>
    <text x="343" y="178" text-anchor="middle" font-size="10" fill="#777777">（每格约几十步）</text>

    <path d="M 438 130 L 474 130" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>

    <rect x="476" y="70" width="170" height="120" rx="10" fill="#d9ecd4" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="561" y="96" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5223">③ 聚拢第 5 行</text>
    <text x="561" y="120" text-anchor="middle" font-size="10.5" fill="#444444">把属于第 5 行的</text>
    <text x="561" y="140" text-anchor="middle" font-size="10.5" fill="#444444">筹码从第 0 行送进去</text>
    <text x="561" y="160" text-anchor="middle" font-size="10.5" fill="#444444">最多 6 次</text>

    <path d="M 646 130 L 682 130" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>

    <rect x="684" y="70" width="146" height="120" rx="10" fill="#f6e3c4" stroke="#b58a3a" stroke-width="1.6"/>
    <text x="757" y="96" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5a1b">④ 行内排序</text>
    <text x="757" y="120" text-anchor="middle" font-size="10.5" fill="#444444">连续三格 3-cycle</text>
    <text x="757" y="140" text-anchor="middle" font-size="10.5" fill="#444444">生成 A₆</text>
    <text x="757" y="160" text-anchor="middle" font-size="10.5" fill="#444444">先第 5 行，再第 0 行</text>
    <text x="757" y="178" text-anchor="middle" font-size="10" fill="#777777">（BFS 找行内序列）</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="228" width="740" height="118" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="76" y="254" font-size="11.5" fill="#8a6015">每做一次 3-cycle 是 4 步（R、D、R⁻¹、D⁻¹）；行内连续三格轮换是两个交换子，共 8 步。</text>
    <text x="76" y="280" font-size="11.5" fill="#8a6015">第 0、5 行始终不参与②，因此总能充当缓冲区；② 结束后它们正好剩下最后的 12 枚筹码。</text>
    <text x="76" y="306" font-size="11.5" fill="#8a6015">实测随机局面平均约 360 步、最坏 616 步，远低于题面上限 10000 步。</text>
    <text x="76" y="332" font-size="11" fill="#9a7020">最终用 checker 逐条执行输出，验证棋盘等于 0-9A-Z 的目标排列。</text>
  </g>
</svg>
