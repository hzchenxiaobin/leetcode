<svg xmlns="http://www.w3.org/2000/svg" width="840" height="420" viewBox="0 0 840 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="420" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">一次实验 = 给每片叶子指定一个菌落，读出一个比特</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">叶子可以重复使用同一菌落，也可以全部用同一个菌落</text>
  <g filter="url(#rough2)"><circle cx="300" cy="110" r="16" fill="#d6e6f2" fill-opacity="0.9" stroke="#446688" stroke-width="1.7"/></g>
  <text x="300" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">^</text>
  <g filter="url(#rough2)"><circle cx="220" cy="190" r="16" fill="#d7ecd0" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.7"/></g>
  <text x="220" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">&amp;</text>
  <g filter="url(#rough2)"><circle cx="380" cy="190" r="16" fill="#f6e3c4" fill-opacity="0.9" stroke="#a0522d" stroke-width="1.7"/></g>
  <text x="380" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">?</text>
  <g filter="url(#rough2)"><circle cx="160" cy="268" r="16" fill="#f6e3c4" fill-opacity="0.9" stroke="#a0522d" stroke-width="1.7"/></g>
  <text x="160" y="273" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">?</text>
  <g filter="url(#rough2)"><circle cx="280" cy="268" r="16" fill="#f6e3c4" fill-opacity="0.9" stroke="#a0522d" stroke-width="1.7"/></g>
  <text x="280" y="273" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">?</text>
  <g filter="url(#rough2)"><line x1="300" y1="126" x2="220" y2="174" stroke="#888888" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><line x1="300" y1="126" x2="380" y2="174" stroke="#888888" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><line x1="220" y1="206" x2="160" y2="252" stroke="#888888" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><line x1="220" y1="206" x2="280" y2="252" stroke="#888888" stroke-width="1.4"/></g>
  <text x="300" y="82" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">公式 F</text>
  <text x="160" y="308" text-anchor="middle" font-size="10.5" fill="#a0522d" filter="url(#rough2)">菌落 a</text>
  <text x="280" y="308" text-anchor="middle" font-size="10.5" fill="#a0522d" filter="url(#rough2)">菌落 b</text>
  <text x="380" y="230" text-anchor="middle" font-size="10.5" fill="#a0522d" filter="url(#rough2)">菌落 c</text>
  <g filter="url(#rough2)"><rect x="560" y="130" width="220" height="120" rx="4" fill="#faf3ec" fill-opacity="0.85" stroke="#c8a48a" stroke-width="1.3"/></g>
  <text x="670" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a4b2a" filter="url(#rough2)">观察结果</text>
  <text x="670" y="186" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">F(t_a, t_b, t_c)</text>
  <text x="670" y="212" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">0 → 红   1 → 蓝</text>
  <text x="670" y="238" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">一次只给 1 个比特</text>
  <g filter="url(#rough2)"><line x1="400" y1="190" x2="552" y2="190" stroke="#a0522d" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrr)"/></g>
  <g filter="url(#rough2)"><rect x="70" y="300" width="700" height="100" rx="4" fill="#f7fbf4" fill-opacity="0.85" stroke="#a8c99a" stroke-width="1.3"/></g>
  <text x="420" y="326" text-anchor="middle" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">关键：若把所有菌落类型整体取反成 t̄，同一次实验喂给 F 的输入也整体取反成 x̄</text>
  <text x="420" y="352" text-anchor="middle" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">若公式自补（F(x) = F(x̄) 恒成立），则 t 与 t̄ 的观察完全相同，永远分辨不出来</text>
  <text x="420" y="378" text-anchor="middle" font-size="12.5" fill="#8a4b2a" filter="url(#rough2)">而 t 与 t̄ 都不全同，都是合法候选 ⇒ 此时答案必为 NO</text>
</svg>
