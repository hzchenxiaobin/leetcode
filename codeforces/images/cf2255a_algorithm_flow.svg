<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="720" height="520" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">一次 O(n) 扫描的算法流程</text>
  <path d="M 244 42 Q 360 49 476 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <rect x="210" y="56" width="300" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="82" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">读入 n, k, s</text>

  <path d="M 360 98 L 360 116" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="120" width="380" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="141" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">total ← s 中 1 的总数（全程不变）</text>
  <text x="360" y="162" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">red ← 初始时编号为偶数的格子里 1 的个数</text>

  <path d="M 360 172 L 360 190" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="200" y="192" width="320" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="217" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">对 i = 0 .. 2n−1 循环（i+1 对 2n 取模）</text>

  <path d="M 360 232 L 360 244" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断 1 -->
  <path d="M 360 248 L 530 288 L 360 328 L 190 288 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="283" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">队尾？</text>
  <text x="360" y="302" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">s[i] = 1 且 s[i+1] = 0</text>

  <!-- 否 -->
  <path d="M 530 288 L 556 288" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="556" y="266" width="132" height="44" rx="8" fill="#fafafa" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="622" y="285" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">这个土豆不动</text>
  <text x="622" y="301" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">检查下一个 i</text>

  <!-- 是 -->
  <path d="M 360 328 L 360 340" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="372" y="338" text-anchor="start" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">是</text>

  <!-- 判断 2 -->
  <path d="M 360 344 L 510 384 L 360 424 L 210 384 Z" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="389" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">编号 i 是奇数吗？</text>

  <path d="M 210 384 L 184 384" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="38" y="360" width="146" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="111" y="380" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">奇 → 偶</text>
  <text x="111" y="397" text-anchor="middle" font-size="13" fill="#3c5e2e" filter="url(#rough2)">red ← red + 1</text>

  <path d="M 510 384 L 536 384" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="536" y="360" width="146" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="609" y="380" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">偶 → 奇</text>
  <text x="609" y="397" text-anchor="middle" font-size="13" fill="#a14340" filter="url(#rough2)">red ← red − 1</text>

  <!-- 汇总到输出 -->
  <path d="M 111 408 L 111 462 L 200 462" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 609 408 L 609 462 L 520 462" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="206" y="442" width="308" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="468" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">输出 red 与 total − red</text>

  <text x="360" y="506" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">k 只出现在输入里：最终答案与 k 无关，这正是本题最大的陷阱</text>
</svg>
