<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="720" height="420" fill="#fafafa"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两个问题：从原点出发 vs 自选起点</text>
  <path d="M 200 43 Q 360 49 520 43" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <rect x="54" y="76" width="300" height="150" rx="7" fill="#fdecea" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="70" y="102" text-anchor="start" font-size="12.5" font-weight="bold" fill="#7b2f2c" filter="url(#rough2)">情形 1：t=0 时在 x=0</text>
  <text x="70" y="130" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">直达条件 |x_i| ≤ V·t_i</text>
  <text x="70" y="156" text-anchor="start" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">⇔ p_i ≥ 0 且 q_i ≥ 0</text>
  <text x="70" y="184" text-anchor="start" font-size="11" fill="#777777" filter="url(#rough2)">只保留第一象限的事件，</text>
  <text x="70" y="206" text-anchor="start" font-size="11" fill="#777777" filter="url(#rough2)">再求最长链。</text>
  <path d="M 250 300 L 520 120" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <path d="M 250 300 L 120 120" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <circle cx="250" cy="300" r="6" fill="#fdecea" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="250" y="320" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">原点 (0,0)</text>
  <text x="390" y="96" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">可达区域</text>
  <rect x="380" y="340" width="300" height="62" rx="7" fill="#e9f4e2" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="396" y="364" text-anchor="start" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">情形 2：起点任意</text>
  <text x="396" y="386" text-anchor="start" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">任何链都可行：把起点选成第一个事件的位置</text>
  <rect x="54" y="246" width="626" height="76" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="70" y="272" text-anchor="start" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">两种情形都是「最长链」，区别只在是否过滤 p,q ≥ 0；</text>
  <text x="70" y="296" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">情形 2 的答案 ≥ 情形 1，且 N ≥ 1 时情形 2 至少为 1。</text>
  <text x="54" y="348" text-anchor="start" font-size="11" fill="#777777" filter="url(#rough2)">注意：同一时刻不同地点的事件不可比；</text>
  <text x="54" y="370" text-anchor="start" font-size="11" fill="#777777" filter="url(#rough2)">而我们的 (p,q) 支配关系会自动排除它们。</text>
</svg>
