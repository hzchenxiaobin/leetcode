<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="473"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="290" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">每个向量先算两个方向的上界，取最小</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">Δ 为 0 的方向不构成约束</text>
  <g filter="url(#rough2)"><rect x="60" y="96" width="380" height="100" rx="6" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="250" y="124" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">行方向</text>
  <text x="250" y="152" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">Δx&gt;0：⌊(n−x)/Δx⌋</text>
  <text x="250" y="176" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">Δx&lt;0：⌊(x−1)/(−Δx)⌋</text>
  <g filter="url(#rough2)"><rect x="480" y="96" width="380" height="100" rx="6" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="670" y="124" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">列方向</text>
  <text x="670" y="152" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">Δy&gt;0：⌊(m−y)/Δy⌋</text>
  <text x="670" y="176" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">Δy&lt;0：⌊(y−1)/(−Δy)⌋</text>
  <text x="450" y="230" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">t = min(行上界, 列上界)，然后 x += t·Δx、y += t·Δy</text>
  <text x="450" y="262" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">整体 O(k)，总步数可达 1e13 ⇒ 用 64 位整数</text>
</svg>
