<svg xmlns="http://www.w3.org/2000/svg" width="720" height="310" viewBox="0 0 720 310"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="720" height="310" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">总路程 = |OA_i| + |A_iB_j| + l_j，桥连左右岸各一点</text>
  <text x="70" y="60" text-anchor="start" font-size="12" fill="#2f4a66" filter="url(#rough2)">O=(0,0)</text>
  <text x="300" y="60" text-anchor="start" font-size="12" fill="#2f5223" filter="url(#rough2)">左岸 x=a（点 A_i）</text>
  <text x="560" y="60" text-anchor="start" font-size="12" fill="#7a4b22" filter="url(#rough2)">右岸 x=b（点 B_j）</text>
  <rect x="60" y="80" width="60" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="90" y="115" text-anchor="middle" font-size="13" fill="#2f5223">O</text>
  <rect x="280" y="80" width="60" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="310" y="115" text-anchor="middle" font-size="13" fill="#2f4a66">A_i</text>
  <rect x="560" y="80" width="60" height="60" rx="8" fill="#fde9d9" stroke="#b4652a" stroke-width="1.5"/>
  <text x="590" y="115" text-anchor="middle" font-size="13" fill="#7a4b22">B_j</text>
  <line x1="122" y1="110" x2="278" y2="110" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="342" y1="110" x2="558" y2="110" stroke="#b4652a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="100" text-anchor="start" font-size="11" fill="#446688" filter="url(#rough2)">√(a²+y_i²)</text>
  <text x="450" y="100" text-anchor="start" font-size="11" fill="#b4652a" filter="url(#rough2)">√((b−a)²+(y′_j−y_i)²)</text>
  <rect x="60" y="180" width="620" height="44" rx="8" fill="#f3edf8" stroke="#7a4a9a" stroke-width="1.5"/>
  <text x="370" y="206" text-anchor="middle" font-size="11.5" fill="#4a2a62">总代价 = |OA_i| + |A_iB_j| + l_j（l_j 是东村到 B_j 的小路长度，输入给出）</text>
  <text x="60" y="262" text-anchor="start" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">对固定的 j，前两项作为 y_i 的函数是凸的 → 可用二分找最小</text>
  <text x="60" y="288" text-anchor="start" font-size="11.5" fill="#7a4b22" filter="url(#rough2)">对所有 j 各求一次最优 i，再取全局最小（不必假设 j 方向单峰）</text>
</svg>
