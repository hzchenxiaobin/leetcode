<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="229"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="760" height="400" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">把 k 个连通块并成一个，恰好要修 k−1 条路</text>
  <path d="M 152 39 Q 380 45 608 39" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <circle cx="60" cy="80" r="14" fill="#dcebfb" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="94" cy="80" r="14" fill="#dcebfb" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="128" cy="80" r="14" fill="#dcebfb" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="94" y="120" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">大小 3</text>
  <circle cx="200" cy="80" r="14" fill="#e2f1e6" stroke="#3f6b4a" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="234" cy="80" r="14" fill="#e2f1e6" stroke="#3f6b4a" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="268" cy="80" r="14" fill="#e2f1e6" stroke="#3f6b4a" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="302" cy="80" r="14" fill="#e2f1e6" stroke="#3f6b4a" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="336" cy="80" r="14" fill="#e2f1e6" stroke="#3f6b4a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="268" y="120" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">大小 5</text>
  <circle cx="360" cy="80" r="14" fill="#fdf3e3" stroke="#8a6015" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="394" cy="80" r="14" fill="#fdf3e3" stroke="#8a6015" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="377" y="120" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">大小 2</text>
  <line x1="150" y1="80" x2="186" y2="80" stroke="#b85450" stroke-width="2.0" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <line x1="330" y1="80" x2="346" y2="80" stroke="#b85450" stroke-width="2.0" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="120" y="132" text-anchor="start" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">两条新路 → 一个大小 3+5+2 = 10 的区域</text>
  <rect x="40" y="158" width="690" height="62" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="56" y="182" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">若选出的 k 个连通块大小之和是幸运数 L ≤ n，则修 k−1 条路就能造出大小 L 的幸运区域；</text>
  <text x="56" y="204" text-anchor="start" font-size="12" fill="#2f4a66" filter="url(#rough2)">反过来，任何 k−1 条路最多把 k 个块连起来，所以“用 k 个块凑出 L”与“修 k−1 条路”等价。</text>
  <rect x="40" y="240" width="690" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="264" text-anchor="start" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">于是答案 = min{ k − 1 : 存在 k 个连通块，大小之和恰为幸运数 }；</text>
  <text x="56" y="286" text-anchor="start" font-size="12" fill="#7a5a1b" filter="url(#rough2)">若某个块本身就是幸运大小，k = 1，答案 0；完全凑不出则输出 −1。</text>
  <rect x="40" y="312" width="690" height="56" rx="8" fill="#e9f4ec" stroke="#3f6b4a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="56" y="336" text-anchor="start" font-size="12" fill="#3f6b4a" filter="url(#rough2)">幸运数只由 4、7 组成，n ≤ 10⁵ 时一共 62 个（4,7,44,47,…,77777），</text>
  <text x="56" y="358" text-anchor="start" font-size="12" fill="#2f4a66" filter="url(#rough2)">所以只需检查这些目标，不必对所有 L 都求答案。</text>
</svg>
