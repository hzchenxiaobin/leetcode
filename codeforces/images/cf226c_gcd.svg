<svg xmlns="http://www.w3.org/2000/svg" width="840" height="380" viewBox="0 0 840 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="380" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">gcd(F_a, F_b) = F_gcd(a,b)</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">例：gcd(F_4, F_8) = gcd(3, 21) = 3 = F_4</text>
  <g filter="url(#rough2)"><rect x="100" y="100" width="76" height="52" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="138" y="122" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">F_1</text>
  <text x="138" y="144" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="188" y="100" width="76" height="52" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="226" y="122" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">F_2</text>
  <text x="226" y="144" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="276" y="100" width="76" height="52" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="314" y="122" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">F_3</text>
  <text x="314" y="144" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="364" y="100" width="76" height="52" rx="4" fill="#f6d9d7" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="402" y="122" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">F_4</text>
  <text x="402" y="144" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="452" y="100" width="76" height="52" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="490" y="122" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">F_5</text>
  <text x="490" y="144" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <g filter="url(#rough2)"><rect x="540" y="100" width="76" height="52" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="578" y="122" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">F_6</text>
  <text x="578" y="144" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">8</text>
  <g filter="url(#rough2)"><rect x="628" y="100" width="76" height="52" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="666" y="122" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">F_7</text>
  <text x="666" y="144" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">13</text>
  <g filter="url(#rough2)"><rect x="716" y="100" width="76" height="52" rx="4" fill="#f6d9d7" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="754" y="122" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">F_8</text>
  <text x="754" y="144" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">21</text>
  <text x="420" y="190" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">下标 4 与 8 的 gcd 是 4，对应的斐波那契数 3 与 21 的 gcd 是 3 = F_4</text>
  <g filter="url(#rough2)"><rect x="90" y="220" width="660" height="60" rx="4" fill="#f7fbf4" fill-opacity="0.85" stroke="#a8c99a" stroke-width="1.3"/></g>
  <text x="420" y="246" text-anchor="middle" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">对 k 个下标同样成立：gcd(F_{a₁},…,F_{a_k}) = F_{gcd(a₁,…,a_k)}</text>
  <text x="420" y="268" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">而 F 单调不减 ⇒ 最大化 gcd 值 ⇔ 最大化下标的 gcd</text>
  <text x="420" y="320" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a4b2a" filter="url(#rough2)">所以答案 = F_{g*}，g* = max{ g : [l,r] 中至少 k 个 g 的倍数 }</text>
  <text x="420" y="350" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">1 ≤ l &lt; r ≤ 10¹² ⇒ F 的下标巨大，用快速倍增算 F_g mod m</text>
</svg>
