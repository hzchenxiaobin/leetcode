<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">每组测试用例 O(1) 判定流程</text>

  <!-- 1 -->
  <rect x="110" y="56" width="300" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="84" text-anchor="middle" font-size="12" fill="#2b4459" filter="url(#rough2)">读入 t，循环处理 t 组数据</text>

  <!-- 2 -->
  <rect x="110" y="128" width="300" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="150" text-anchor="middle" font-size="12" fill="#2b4459" filter="url(#rough2)">读入 n 与 h_1 … h_n</text>
  <text x="260" y="169" text-anchor="middle" font-size="12" fill="#2b4459" filter="url(#rough2)">求 m = min h_i，M = max h_i</text>

  <!-- 3 -->
  <rect x="110" y="208" width="300" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="230" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">公共高度取 H = M + 1</text>
  <text x="260" y="249" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">再抬高只会让所有 x_i 一起变大</text>

  <!-- 4 -->
  <rect x="110" y="288" width="300" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="316" text-anchor="middle" font-size="13" fill="#2f5a24" filter="url(#rough2)">输出 k = H − m = M − m + 1</text>

  <!-- 5 -->
  <rect x="110" y="360" width="300" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="386" text-anchor="middle" font-size="12" fill="#8f3b38" filter="url(#rough2)">该组结束，进入下一组</text>

  <!-- 竖箭头 -->
  <path d="M 260 100 L 260 124" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 260 180 L 260 204" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 260 260 L 260 284" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 260 332 L 260 356" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 回边 -->
  <path d="M 110 380 L 64 380 L 64 78 L 106 78" stroke="#446688" stroke-width="1.4" fill="none" stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="52" y="240" text-anchor="middle" font-size="11" fill="#446688" transform="rotate(-90 52 240)" filter="url(#rough2)">其余 t − 1 组</text>
</svg>
