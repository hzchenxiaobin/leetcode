<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="143"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="720" height="340" fill="#fafafa"/>
  <text x="360.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">三段式分解与“塞得下”的计数</text>
  <path d="M 115.2 42 Q 360.0 48 604.8 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="360.0" y="326" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">c 张 A、c−1 个空隙、L = n−2c+1 个尾部</text>
  <rect x="40" y="70" width="190" height="76" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="135" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">A 的照片</text>
  <text x="135" y="122" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">c 张，放在奇数位</text>
  <rect x="258" y="70" width="190" height="76" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="353" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">空隙</text>
  <text x="353" y="122" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">c−1 个，孤立位置</text>
  <rect x="476" y="70" width="200" height="76" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="576" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#335478" filter="url(#rough2)">尾部</text>
  <text x="576" y="122" text-anchor="middle" font-size="11.5" fill="#335478" filter="url(#rough2)">L = n−2c+1 个，连续</text>
  <text x="360" y="170" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">非 A 的计数 b₁ ≥ b₂ ≥ …，尾部每条颜色必须 ≤ h = ⌈L/2⌉ 才能排成线</text>
  <rect x="40" y="190" width="636" height="96" rx="9" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="358" y="214" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">需要塞进空隙的张数 = Σ max(0, bⱼ − h)，可以证明它 ≤ c − 1：</text>
  <text x="358" y="240" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">• 没有超限的颜色 → 和 = 0 ≤ c−1</text>
  <text x="358" y="262" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">• 只有一个 bⱼ &gt; h → bⱼ − h ≤ c − h ≤ c−1（h ≥ 1）</text>
  <text x="358" y="284" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">• 至少两个 bⱼ &gt; h → 和 ≤ (c−1+L) − 2h ≤ c−1（因为 2h ≥ L）</text>
  <text x="360" y="318" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">空隙一定够用，于是尾部每条颜色都 ≤ h，线贪心必成功</text>
</svg>
