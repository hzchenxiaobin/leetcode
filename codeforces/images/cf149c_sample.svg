<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="409"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="240" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">样例 1：技能 1 2 1</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">排序 1,1,2 ⇒ 队1={1,2}（技能 1+2），队2={3}（技能 1）</text>
  <text x="450" y="106" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">队1：编号 1、2（技能 1+2 = 3）</text>
  <text x="450" y="140" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">队2：编号 3（技能 1）</text>
  <text x="450" y="178" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">人数 2 vs 1（差 1），技能差 2 ≤ max = 2 ✓</text>
</svg>
