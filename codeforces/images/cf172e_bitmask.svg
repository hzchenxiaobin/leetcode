  <rect x="70" y="330" width="610" height="52" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="84" y="352" text-anchor="start" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">A(u) = A(父) | S(u)：把"自己能匹配到的层"并进祖先信息，留给子元素用。</text>
  <text x="84" y="372" text-anchor="start" font-size="11.5" font-weight="normal" fill="#7a5a1b" filter="url(#rough2)">第 n 位为 1 ⇒ 存在以 u 结尾的长度 n 的链，计数 +1。</text>
