<svg xmlns="http://www.w3.org/2000/svg" width="760" height="584" viewBox="0 0 760 584"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="584" fill="#fafafa"/>

  <text x="330" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">算法流程：排序 + 前缀和 + 枚举 k</text>
  <path d="M 150 44 Q 330 50 510 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <text x="566" y="52" font-size="11.5" fill="#8a8a8a" filter="url(#rough2)">每步开销</text>

  <!-- 1 -->
  <rect x="110" y="64" width="440" height="56" rx="8" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="88" text-anchor="middle" font-size="13" fill="#23405c" filter="url(#rough2)">读入 n、v，把货物分进 one[] 与 two[]</text>
  <text x="330" y="108" text-anchor="middle" font-size="12" fill="#3d5f80" filter="url(#rough2)">每项存 (容量 p, 原始编号 i)，编号 1 起</text>
  <text x="566" y="96" font-size="11.5" fill="#666" filter="url(#rough2)">O(n)</text>

  <!-- 2 -->
  <rect x="110" y="152" width="440" height="56" rx="8" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="176" text-anchor="middle" font-size="13" fill="#23405c" filter="url(#rough2)">one、two 各自按容量 p 降序排序</text>
  <text x="330" y="196" text-anchor="middle" font-size="12" fill="#3d5f80" filter="url(#rough2)">容量大的排在前面，取前缀即取最优组合</text>
  <text x="566" y="184" font-size="11.5" fill="#666" filter="url(#rough2)">O(n log n)</text>

  <!-- 3 -->
  <rect x="110" y="240" width="440" height="56" rx="8" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="264" text-anchor="middle" font-size="13" fill="#23405c" filter="url(#rough2)">求前缀和 pre1[0..c1]、pre2[0..c2]</text>
  <text x="330" y="284" text-anchor="middle" font-size="12" fill="#3d5f80" filter="url(#rough2)">pre(t) 即前 t 个货物的容量之和</text>
  <text x="566" y="272" font-size="11.5" fill="#666" filter="url(#rough2)">O(n)</text>

  <!-- 4 -->
  <rect x="110" y="328" width="440" height="56" rx="8" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="352" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">枚举 k = 0 … min(c2, v/2)，对每个 k 取</text>
  <text x="330" y="372" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">t = min(c1, v − 2k)（v/2 为整数除法）</text>
  <text x="566" y="360" font-size="11.5" fill="#666" filter="url(#rough2)">≤ c2 + 1 次</text>

  <!-- 5 -->
  <rect x="110" y="416" width="440" height="56" rx="8" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="440" text-anchor="middle" font-size="13" fill="#8c3b37" filter="url(#rough2)">cand = pre2[k] + pre1[t]，大于 best 则更新</text>
  <text x="330" y="460" text-anchor="middle" font-size="12" fill="#8c3b37" filter="url(#rough2)">同时记下产生 best 的 (k, t)</text>
  <text x="566" y="448" font-size="11.5" fill="#666" filter="url(#rough2)">O(1)</text>

  <!-- 6 -->
  <rect x="110" y="504" width="440" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="528" text-anchor="middle" font-size="13" fill="#2f5223" filter="url(#rough2)">输出 best，再输出 one 前 t 个与 two 前 k 个的编号</text>
  <text x="330" y="548" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">空格分隔，空集时第二行留空</text>

  <text x="566" y="536" font-size="11.5" fill="#666" filter="url(#rough2)">O(n)</text>

  <!-- 竖向箭头 -->
  <path d="M 330 120 L 330 148" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 330 208 L 330 236" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 330 296 L 330 324" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 330 384 L 330 412" stroke="#d6a040" stroke-width="1.8" fill="none"
        marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 330 472 L 330 500" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 回边：k++ -->
  <path d="M 110 444 L 76 444 L 76 356 L 104 356" stroke="#b85450" stroke-width="1.6" fill="none"
        marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="58" y="400" text-anchor="end" font-size="12" fill="#b85450" filter="url(#rough2)">k++</text>

  <!-- 右下角：总复杂度 -->
  <text x="566" y="500" font-size="11.5" fill="#8a6015" filter="url(#rough2)">总计 O(n log n)</text>
</svg>
