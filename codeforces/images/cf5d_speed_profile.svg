<svg xmlns="http://www.w3.org/2000/svg" width="780" height="480" viewBox="0 0 780 480"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2b2b2b"/>
    </marker>
  </defs>

  <rect width="780" height="480" fill="#fafafa"/>

  <text x="390" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">最优车速剖面：一路“顶格”加速，只在限速点刹车</text>

  <!-- 坐标轴 -->
  <line x1="90" y1="410" x2="710" y2="410" stroke="#2b2b2b" stroke-width="1.6" marker-end="url(#arw)" filter="url(#rough2)"/>
  <line x1="90" y1="410" x2="90" y2="88" stroke="#2b2b2b" stroke-width="1.6" marker-end="url(#arw)" filter="url(#rough2)"/>
  <text x="700" y="436" text-anchor="end" font-size="13" fill="#2b2b2b" filter="url(#rough2)">位置 x（公里）</text>
  <text x="52" y="100" font-size="13" fill="#2b2b2b" filter="url(#rough2)">速度</text>

  <!-- 速度上限参考线 -->
  <line x1="90" y1="150" x2="700" y2="150" stroke="#446688" stroke-width="1.2" stroke-dasharray="6 5" filter="url(#rough2)"/>
  <line x1="90" y1="270" x2="700" y2="270" stroke="#b85450" stroke-width="1.2" stroke-dasharray="6 5" filter="url(#rough2)"/>
  <text x="96" y="142" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">最高速 v</text>
  <text x="96" y="262" font-size="12.5" fill="#8f3b37" filter="url(#rough2)">限速 w</text>

  <!-- 车速曲线 -->
  <path d="M90,410 C104,310 120,192 230,150" fill="none" stroke="#4a7a3a" stroke-width="2.6" filter="url(#rough2)"/>
  <line x1="230" y1="150" x2="450" y2="150" stroke="#446688" stroke-width="2.6" filter="url(#rough2)"/>
  <path d="M450,150 C470,152 517,206 540,270" fill="none" stroke="#b85450" stroke-width="2.6" filter="url(#rough2)"/>
  <path d="M540,270 C552,214 576,164 640,150" fill="none" stroke="#4a7a3a" stroke-width="2.6" filter="url(#rough2)"/>
  <line x1="640" y1="150" x2="700" y2="150" stroke="#446688" stroke-width="2.6" filter="url(#rough2)"/>

  <!-- 限速点 d -->
  <line x1="540" y1="410" x2="540" y2="270" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <circle cx="540" cy="270" r="5.2" fill="#b85450" filter="url(#rough2)"/>
  <text x="540" y="434" text-anchor="middle" font-size="13" fill="#8f3b37" filter="url(#rough2)">d（限速牌）</text>
  <text x="700" y="396" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">l</text>
  <line x1="700" y1="410" x2="700" y2="380" stroke="#2b2b2b" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 五个相位编号 -->
  <g filter="url(#rough2)" font-size="12" font-weight="bold">
    <circle cx="160" cy="252" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="160" y="257" text-anchor="middle" fill="#2f5223">1</text>
    <circle cx="330" cy="150" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <text x="330" y="155" text-anchor="middle" fill="#2f4a66">2</text>
    <circle cx="487" cy="212" r="12" fill="#fce8e6" stroke="#b85450" stroke-width="1.3"/>
    <text x="487" y="217" text-anchor="middle" fill="#8f3b37">3</text>
    <circle cx="578" cy="204" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="578" y="209" text-anchor="middle" fill="#2f5223">4</text>
    <circle cx="670" cy="150" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <text x="670" y="155" text-anchor="middle" fill="#2f4a66">5</text>
  </g>

  <!-- 公式框 -->
  <rect x="248" y="300" width="248" height="86" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="330" font-size="13" fill="#8a6015" filter="url(#rough2)">总时间 = 曲线“倒数”的积分</text>
  <text x="260" y="356" font-size="16" font-weight="bold" fill="#6d4a10" filter="url(#rough2)">T = ∫ dx / v(x)</text>
  <text x="260" y="377" font-size="11.5" fill="#8a6015" filter="url(#rough2)">每处都开到允许的最快 ⇒ 时间最短</text>

  <!-- 图例 -->
  <g font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">
    <text x="96" y="466">1 全力加速</text>
    <text x="220" y="466">2 保持最高速</text>
    <text x="368" y="466">3 全力刹车</text>
    <text x="500" y="466">4 过牌后再加速</text>
    <text x="650" y="466">5 保持最高速</text>
  </g>

  <text x="556" y="312" font-size="12" fill="#8f3b37" filter="url(#rough2)">这里速度恰好 = w</text>
</svg>
