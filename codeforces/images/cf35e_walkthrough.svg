<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="291"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="320" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1 的折线：6 个顶点</text>
  <line x1="60" y1="220" x2="660" y2="220" stroke="#c9ced6" stroke-width="1.6" filter="url(#rough2)"/>
  <g stroke="#4a7a3a" stroke-width="2.6" fill="none" filter="url(#rough2)">
    <path d="M140,220 L140,140 L300,140 L300,100 L500,100 L500,220"/>
  </g>
  <g fill="#b85450" filter="url(#rough2)">
    <circle cx="140" cy="220" r="5"/><circle cx="140" cy="140" r="5"/>
    <circle cx="300" cy="140" r="5"/><circle cx="300" cy="100" r="5"/>
    <circle cx="500" cy="100" r="5"/><circle cx="500" cy="220" r="5"/>
  </g>
  <g font-size="11.5" fill="#2f4a66" filter="url(#rough2)">
    <text x="118" y="240" text-anchor="middle">(0,0)</text>
    <text x="112" y="130" text-anchor="middle">(0,3)</text>
    <text x="270" y="132" text-anchor="middle">(1,3)</text>
    <text x="272" y="90" text-anchor="middle">(1,4)</text>
    <text x="530" y="92" text-anchor="middle">(3,4)</text>
    <text x="530" y="240" text-anchor="middle">(3,0)</text>
  </g>
  <rect x="70" y="252" width="580" height="56" rx="9" fill="#eef4ec" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="86" y="276" font-size="12.5" fill="#2f5223" filter="url(#rough2)">段 [0,1) 高 3，段 [1,3) 高 4；起点、每处变化、终点各输出竖边的两个端点。</text>
  <text x="86" y="298" font-size="12.5" fill="#2f5223" filter="url(#rough2)">共 6 个顶点，首末高度为 0。</text>
</svg>
