<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr71br" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#6b6b6b"/>
    </marker>
  </defs>

  <rect width="720" height="300" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">Σ 只能取整数：取不超过 t% 的最大值</text>

  <!-- 数轴 -->
  <line x1="80" y1="170" x2="648" y2="170" stroke="#6b6b6b" stroke-width="1.8" marker-end="url(#arr71br)"
        filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="13" fill="#3a4a5a" text-anchor="middle">
    <circle cx="160" cy="170" r="6" fill="#cfd8cf" stroke="#6b7a6b" stroke-width="1.2"/>
    <circle cx="300" cy="170" r="7" fill="#8fbf6f" stroke="#3f6b2f" stroke-width="1.8"/>
    <circle cx="440" cy="170" r="6" fill="#e0b0b0" stroke="#a05050" stroke-width="1.2"/>
    <circle cx="580" cy="170" r="6" fill="#e0b0b0" stroke="#a05050" stroke-width="1.2"/>
    <text x="160" y="196">51</text>
    <text x="300" y="196">52</text>
    <text x="440" y="196">53</text>
    <text x="580" y="196">54</text>
  </g>

  <!-- 上界虚线 -->
  <line x1="427" y1="112" x2="427" y2="188" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4"
        filter="url(#rough2)"/>
  <text x="427" y="104" text-anchor="middle" font-size="12" fill="#7a2f2c" filter="url(#rough2)">上界 n·k·t/100 = 52.91</text>

  <!-- 选中 52 -->
  <ellipse cx="300" cy="170" rx="24" ry="24" fill="none" stroke="#3f6b2f" stroke-width="2.4"
           filter="url(#rough2)"/>
  <text x="300" y="232" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5223"
        filter="url(#rough2)">Σ* = 52（向下取整）</text>

  <!-- 53 越界 -->
  <path d="M440 146 L440 160" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr71br)"
        filter="url(#rough2)"/>
  <text x="470" y="240" text-anchor="middle" font-size="12" fill="#7a2f2c" filter="url(#rough2)">53 已超过上界</text>

  <text x="360" y="272" text-anchor="middle" font-size="12.5" fill="#4a4a4a" filter="url(#rough2)">若向上取整会得到 53，与样例 2 的官方输出冲突</text>
</svg>
