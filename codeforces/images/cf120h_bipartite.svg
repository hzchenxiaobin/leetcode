<svg xmlns="http://www.w3.org/2000/svg" width="740" height="340" viewBox="0 0 740 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1215"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="740" height="340" fill="#fafafa"/>
  <text x="370.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">词 ↔ 缩写的二分图匹配</text>
  <path d="M 118.4 42 Q 370.0 48 621.6 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="370.0" y="326" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">左边 n 个词，右边所有候选缩写串</text>
  <rect x="80" y="90" width="170" height="44" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="165" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">privet</text>
  <rect x="80" y="150" width="170" height="44" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="165" y="178" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">spasibo</text>
  <rect x="80" y="210" width="170" height="44" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="165" y="238" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">codeforces</text>
  <rect x="470" y="80" width="120" height="40" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="530" y="106" text-anchor="middle" font-size="12" font-weight="bold" fill="#335478" filter="url(#rough2)">e</text>
  <rect x="470" y="130" width="120" height="40" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="530" y="156" text-anchor="middle" font-size="12" font-weight="bold" fill="#335478" filter="url(#rough2)">ab</text>
  <rect x="470" y="180" width="120" height="40" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="530" y="206" text-anchor="middle" font-size="12" font-weight="bold" fill="#335478" filter="url(#rough2)">c</text>
  <rect x="470" y="230" width="120" height="40" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="530" y="256" text-anchor="middle" font-size="12" font-weight="bold" fill="#335478" filter="url(#rough2)">pret</text>
  <rect x="470" y="280" width="120" height="40" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="530" y="306" text-anchor="middle" font-size="12" font-weight="bold" fill="#335478" filter="url(#rough2)">sps</text>
  <line x1="252.0" y1="112.0" x2="468.0" y2="100.0" stroke="#999999" stroke-width="1.1" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <line x1="252.0" y1="112.0" x2="468.0" y2="250.0" stroke="#999999" stroke-width="1.1" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <line x1="252.0" y1="172.0" x2="468.0" y2="150.0" stroke="#999999" stroke-width="1.1" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <line x1="252.0" y1="172.0" x2="468.0" y2="300.0" stroke="#999999" stroke-width="1.1" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <line x1="252.0" y1="232.0" x2="468.0" y2="200.0" stroke="#999999" stroke-width="1.1" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <line x1="252.0" y1="232.0" x2="468.0" y2="100.0" stroke="#999999" stroke-width="1.1" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <text x="370" y="320" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">求完美匹配：每个词配一个不同缩写；匹配不满 n 则输出 -1</text>
</svg>
