<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="19"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="420" fill="#fafafa"/>

  <text x="380" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">5A：只有 Send 产生流量，流量 = 正文长度 × 在线人数</text>
  <path d="M 120 44 Q 380 50 640 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 纵轴 -->
  <line x1="70" y1="100" x2="70" y2="292" stroke="#777" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="70" y1="292" x2="722" y2="292" stroke="#777" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="128" text-anchor="end" font-size="12" fill="#555" filter="url(#rough2)">3</text>
  <text x="60" y="183" text-anchor="end" font-size="12" fill="#555" filter="url(#rough2)">2</text>
  <text x="60" y="238" text-anchor="end" font-size="12" fill="#555" filter="url(#rough2)">1</text>
  <text x="60" y="296" text-anchor="end" font-size="12" fill="#555" filter="url(#rough2)">0</text>
  <text x="34" y="196" text-anchor="middle" font-size="11.5" fill="#555" transform="rotate(-90 34 196)" filter="url(#rough2)">在线人数 k</text>

  <!-- 阶梯折线：+Mike / Mike:hello / +Kate / +Dmitry / -Dmitry / Kate:hi / -Kate -->
  <path d="M 100 237 L 280 237 L 280 182 L 370 182 L 370 127 L 460 127 L 460 182 L 640 182 L 640 237 L 700 237"
        stroke="#4a7a3a" stroke-width="2.4" fill="none" filter="url(#rough2)"/>

  <!-- 事件竖虚线 + 命令 -->
  <line x1="100" y1="292" x2="100" y2="312" stroke="#aaa" stroke-width="1" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <line x1="190" y1="292" x2="190" y2="312" stroke="#aaa" stroke-width="1" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <line x1="280" y1="292" x2="280" y2="312" stroke="#aaa" stroke-width="1" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <line x1="370" y1="292" x2="370" y2="312" stroke="#aaa" stroke-width="1" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <line x1="460" y1="292" x2="460" y2="312" stroke="#aaa" stroke-width="1" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <line x1="550" y1="292" x2="550" y2="312" stroke="#aaa" stroke-width="1" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <line x1="640" y1="292" x2="640" y2="312" stroke="#aaa" stroke-width="1" stroke-dasharray="3 3" filter="url(#rough2)"/>

  <text x="100" y="330" text-anchor="middle" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">+Mike</text>
  <text x="190" y="330" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">Mike:hello</text>
  <text x="280" y="330" text-anchor="middle" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">+Kate</text>
  <text x="370" y="330" text-anchor="middle" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">+Dmitry</text>
  <text x="460" y="330" text-anchor="middle" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">-Dmitry</text>
  <text x="550" y="330" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">Kate:hi</text>
  <text x="640" y="330" text-anchor="middle" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">-Kate</text>

  <text x="100" y="352" text-anchor="middle" font-size="10" fill="#8a8a8a" filter="url(#rough2)">k=1</text>
  <text x="190" y="352" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">+5×1</text>
  <text x="280" y="352" text-anchor="middle" font-size="10" fill="#8a8a8a" filter="url(#rough2)">k=2</text>
  <text x="370" y="352" text-anchor="middle" font-size="10" fill="#8a8a8a" filter="url(#rough2)">k=3</text>
  <text x="460" y="352" text-anchor="middle" font-size="10" fill="#8a8a8a" filter="url(#rough2)">k=2</text>
  <text x="550" y="352" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">+2×2</text>
  <text x="640" y="352" text-anchor="middle" font-size="10" fill="#8a8a8a" filter="url(#rough2)">k=1</text>

  <text x="415" y="118" text-anchor="middle" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">峰值 3 人</text>

  <rect x="60" y="366" width="300" height="42" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="72" y="392" font-size="12" fill="#2f5223" filter="url(#rough2)">加人/删人不发字节，只改后面的乘数 k</text>

  <rect x="384" y="366" width="330" height="42" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="396" y="392" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">总流量 = 5×1 + 2×2 = 9</text>
</svg>
