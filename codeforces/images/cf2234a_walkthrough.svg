<svg xmlns="http://www.w3.org/2000/svg" width="620" height="400" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">六组官方样例走查：排序 → 校验 → 输出</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">只有第 4、5 组能通过校验，其余三组一律输出 −1</text>

  <rect x="14" y="62" width="592" height="32" rx="6" fill="#eef2f7" stroke="#8fa3b8" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="42" y="83" text-anchor="middle" font-size="11" fill="#33445c" filter="url(#rough2)">组</text>
  <text x="178" y="83" text-anchor="middle" font-size="11" fill="#33445c" filter="url(#rough2)">降序排序后</text>
  <text x="401" y="83" text-anchor="middle" font-size="11" fill="#33445c" filter="url(#rough2)">逐位校验</text>
  <text x="560" y="83" text-anchor="middle" font-size="11" fill="#33445c" filter="url(#rough2)">输出</text>

  <rect x="14" y="96" width="592" height="42" rx="5" fill="#ffffff" stroke="#c9d4de" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="42" y="122" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="178" y="122" text-anchor="middle" font-size="11.5" fill="#33506b" filter="url(#rough2)">1　1</text>
  <text x="401" y="122" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">n = 2，无需校验</text>
  <text x="560" y="122" text-anchor="middle" font-size="11.5" fill="#3c6130" filter="url(#rough2)">1 1</text>

  <rect x="14" y="138" width="592" height="42" rx="5" fill="#f7f9fc" stroke="#c9d4de" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="42" y="164" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>
  <text x="178" y="164" text-anchor="middle" font-size="11.5" fill="#33506b" filter="url(#rough2)">2　1</text>
  <text x="401" y="164" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">n = 2，无需校验</text>
  <text x="560" y="164" text-anchor="middle" font-size="11.5" fill="#3c6130" filter="url(#rough2)">2 1</text>

  <rect x="14" y="180" width="592" height="42" rx="5" fill="#fdf6f7" stroke="#c9d4de" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="42" y="206" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">3</text>
  <text x="178" y="206" text-anchor="middle" font-size="11.5" fill="#33506b" filter="url(#rough2)">4　3　2　1</text>
  <text x="401" y="206" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">4 mod 3 = 1 ≠ 2　✗</text>
  <text x="560" y="206" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">−1</text>

  <rect x="14" y="222" width="592" height="42" rx="5" fill="#f4fbf5" stroke="#c9d4de" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="42" y="248" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4</text>
  <text x="178" y="248" text-anchor="middle" font-size="11.5" fill="#33506b" filter="url(#rough2)">6　4　2</text>
  <text x="401" y="248" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">6 mod 4 = 2　✓</text>
  <text x="560" y="248" text-anchor="middle" font-size="11.5" fill="#3c6130" filter="url(#rough2)">6 4</text>

  <rect x="14" y="264" width="592" height="42" rx="5" fill="#f4fbf5" stroke="#c9d4de" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="42" y="290" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">5</text>
  <text x="178" y="290" text-anchor="middle" font-size="11.5" fill="#33506b" filter="url(#rough2)">13　8　5　3</text>
  <text x="401" y="290" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">13 mod 8 = 5 ✓，8 mod 5 = 3 ✓</text>
  <text x="560" y="290" text-anchor="middle" font-size="11.5" fill="#3c6130" filter="url(#rough2)">13 8</text>

  <rect x="14" y="306" width="592" height="42" rx="5" fill="#fdf6f7" stroke="#c9d4de" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="42" y="332" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">6</text>
  <text x="178" y="332" text-anchor="middle" font-size="11.5" fill="#33506b" filter="url(#rough2)">1　1　1</text>
  <text x="401" y="332" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">1 mod 1 = 0 ≠ 1　✗</text>
  <text x="560" y="332" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">−1</text>

  <text x="310" y="370" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">第 6 组暴露了核心约束：1 mod 1 = 0 不是正整数，重复值在 n ≥ 3 时必然无解</text>
  <text x="310" y="390" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">第 3 组说明“数值集合看似合理”并不够，余数必须精确等于下一位</text>
</svg>
