<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="720" height="400" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">所有相邻 1 的间隔都相等</text>
  <path d="M 190 42 Q 360 48 530 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <line x1="60" y1="210" x2="680" y2="210" stroke="#2b2b2b" stroke-width="1.5" filter="url(#rough2)"/>
  <g font-size="11" text-anchor="middle" fill="#666" filter="url(#rough2)">
    <text x="90" y="234">0</text><text x="230" y="234">1</text><text x="370" y="234">2</text>
    <text x="510" y="234">3</text><text x="650" y="234">4</text>
  </g>

  <g filter="url(#rough2)">
    <circle cx="90" cy="210" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="230" cy="210" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="370" cy="210" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="510" cy="210" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#2f5223" font-weight="bold" filter="url(#rough2)">
    <text x="90" y="196">1</text><text x="230" y="196">1</text>
    <text x="370" y="196">1</text><text x="510" y="196">1</text>
  </g>

  <g stroke="#b85450" stroke-width="1.4" fill="none" filter="url(#rough2)">
    <path d="M 90 250 Q 160 285 230 250"/>
    <path d="M 230 250 Q 300 285 370 250"/>
    <path d="M 370 250 Q 440 285 510 250"/>
  </g>
  <g font-size="11" text-anchor="middle" fill="#a33a36" filter="url(#rough2)">
    <text x="160" y="296">d = 1</text><text x="300" y="296">d = 1</text><text x="440" y="296">d = 1</text>
  </g>

  <rect x="40" y="320" width="640" height="64" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <g font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">
    <text x="56" y="346">只需取第一个间隔 d = p₁ − p₀，再检查后面每个 pᵢ − pᵢ₋₁ 是否都等于 d。</text>
    <text x="56" y="370">前导 0、末尾 0 都不影响；题目保证至少有 3 个 1，所以 d 一定存在。</text>
  </g>
</svg>
