<svg xmlns="http://www.w3.org/2000/svg" width="700" height="400" viewBox="0 0 700 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="111"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="700" height="400" fill="#fafafa"/>
  <text x="350" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">K4 的 7 个简单环：4 个三角形 + 3 个四边形</text>

  <!-- K4 -->
  <g stroke="#8a94a6" stroke-width="2" filter="url(#rough2)">
    <line x1="100" y1="110" x2="290" y2="110"/>
    <line x1="290" y1="110" x2="290" y2="310"/>
    <line x1="290" y1="310" x2="100" y2="310"/>
    <line x1="100" y1="310" x2="100" y2="110"/>
    <line x1="100" y1="110" x2="290" y2="310"/>
    <line x1="290" y1="110" x2="100" y2="310"/>
  </g>
  <g filter="url(#rough2)">
    <circle cx="100" cy="110" r="17" fill="#fce8e6" stroke="#b85450" stroke-width="2.2"/>
    <text x="100" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#8f3b37">1</text>
    <circle cx="290" cy="110" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="290" y="115" text-anchor="middle" font-size="13" fill="#2f4a66">2</text>
    <circle cx="290" cy="310" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="290" y="315" text-anchor="middle" font-size="13" fill="#2f4a66">3</text>
    <circle cx="100" cy="310" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="100" y="315" text-anchor="middle" font-size="13" fill="#2f4a66">4</text>
  </g>
  <text x="195" y="352" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">6 条边，最小点 = 1 号</text>

  <!-- 计数面板 -->
  <rect x="368" y="70" width="300" height="128" rx="10" fill="#eef4ec" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="384" y="96" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">三角形（4 个）</text>
  <g font-size="12" fill="#2f5223" filter="url(#rough2)">
    <text x="384" y="120">1-2-3　　1-2-4</text>
    <text x="384" y="142">1-3-4　　2-3-4</text>
    <text x="384" y="172">每个三角形贡献 dp = 2 条路径</text>
  </g>

  <rect x="368" y="212" width="300" height="150" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="384" y="238" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">四边形（3 个）</text>
  <g font-size="12" fill="#8a6015" filter="url(#rough2)">
    <text x="384" y="262">1-2-3-4-1</text>
    <text x="384" y="284">1-2-4-3-1</text>
    <text x="384" y="306">1-3-2-4-1</text>
    <text x="384" y="336">4!/(4·2) = 3，方向与起点不重复</text>
  </g>

  <rect x="60" y="368" width="590" height="24" rx="7" fill="#f4f6f9" stroke="#8a94a6" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="355" y="385" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">合计 4 + 3 = 7，与样例输出一致</text>
</svg>
