<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="380" fill="#fafafa" filter="url(#rough2)"/>

  <text x="300" y="30" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    为什么连通块恰好是模 g 的剩余类
  </text>
  <text x="300" y="52" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">
    例：n = 9, x = 3, y = 6 → g = 3，每行是一个剩余类
  </text>

  <!-- 行标签 -->
  <text x="140" y="126" text-anchor="end" font-size="12" fill="#446688" filter="url(#rough2)">
    i ≡ 1 (mod 3)
  </text>
  <text x="140" y="206" text-anchor="end" font-size="12" fill="#446688" filter="url(#rough2)">
    i ≡ 2 (mod 3)
  </text>
  <text x="140" y="286" text-anchor="end" font-size="12" fill="#446688" filter="url(#rough2)">
    i ≡ 0 (mod 3)
  </text>

  <!-- 第一行：位置 1, 4, 7 -->
  <line x1="190" y1="120" x2="260" y2="120" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="300" y1="120" x2="370" y2="120" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="170" cy="120" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="280" cy="120" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="390" cy="120" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="170" y="125" text-anchor="middle" font-size="13" fill="#2f4f2f" filter="url(#rough2)">1</text>
  <text x="280" y="125" text-anchor="middle" font-size="13" fill="#2f4f2f" filter="url(#rough2)">4</text>
  <text x="390" y="125" text-anchor="middle" font-size="13" fill="#2f4f2f" filter="url(#rough2)">7</text>
  <text x="225" y="110" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">x=3</text>

  <!-- 第二行：位置 2, 5, 8 -->
  <line x1="190" y1="200" x2="260" y2="200" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="300" y1="200" x2="370" y2="200" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="170" cy="200" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="280" cy="200" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="390" cy="200" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="170" y="205" text-anchor="middle" font-size="13" fill="#7a5a1f" filter="url(#rough2)">2</text>
  <text x="280" y="205" text-anchor="middle" font-size="13" fill="#7a5a1f" filter="url(#rough2)">5</text>
  <text x="390" y="205" text-anchor="middle" font-size="13" fill="#7a5a1f" filter="url(#rough2)">8</text>

  <!-- 第三行：位置 3, 6, 9 -->
  <line x1="190" y1="280" x2="260" y2="280" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="300" y1="280" x2="370" y2="280" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="170" cy="280" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="280" cy="280" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="390" cy="280" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="170" y="285" text-anchor="middle" font-size="13" fill="#7a2f2f" filter="url(#rough2)">3</text>
  <text x="280" y="285" text-anchor="middle" font-size="13" fill="#7a2f2f" filter="url(#rough2)">6</text>
  <text x="390" y="285" text-anchor="middle" font-size="13" fill="#7a2f2f" filter="url(#rough2)">9</text>

  <!-- 行间“没有边”的示意 -->
  <line x1="460" y1="150" x2="460" y2="175" stroke="#b85450" stroke-width="2"
        stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="486" y="160" font-size="11" fill="#b85450" filter="url(#rough2)">没有边</text>
  <line x1="460" y1="228" x2="460" y2="253" stroke="#b85450" stroke-width="2"
        stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="486" y="238" font-size="11" fill="#b85450" filter="url(#rough2)">没有边</text>

  <text x="300" y="330" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    x、y 都是 g 的倍数 ⇒ 任何一次交换都不改变 i mod g
  </text>
  <text x="300" y="352" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">
    x + y ≤ n ⇒ 每行都足够长（≥ a + b 个点），行内被 ±x、±y 串成一条链
  </text>
</svg>
