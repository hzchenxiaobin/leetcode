<svg xmlns="http://www.w3.org/2000/svg" width="884" height="360" viewBox="0 0 884 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="121"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="884" height="360" fill="#fafafa"/>
  <text x="442" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">只有最后 m 个位置会被重排（m! ≥ k，m ≤ 13）</text>
  <text x="442" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">前面 n−m 个位置固定为 a_i = i</text>
  <g filter="url(#rough2)"><rect x="90" y="150" width="520" height="50" rx="4" fill="#e8e8e8" fill-opacity="0.5" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="350" y="180" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">位置 1 .. n−m ：a_i = i</text>
  <g filter="url(#rough2)"><rect x="620" y="150" width="180" height="50" rx="4" fill="#d7ecd0" fill-opacity="0.6" stroke="#6a9a58" stroke-width="1.3"/></g>
  <text x="710" y="180" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">后 m 个位置</text>
  <text x="442" y="240" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">前缀贡献 = 幸运数 i ≤ n−m 的个数</text>
  <text x="442" y="272" text-anchor="middle" font-size="11.5" fill="#3d6b2f" filter="url(#rough2)">后缀用 factoradic 求第 k 个排列，逐位判断 i 与 a_i 是否都幸运</text>
  <text x="442" y="308" text-anchor="middle" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">k &gt; n! 时不存在 → −1（n &lt; 13 才可能发生）</text>
</svg>
