<svg xmlns="http://www.w3.org/2000/svg" width="760" height="310" viewBox="0 0 760 310"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="271"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="310" fill="#fafafa"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">贪心构造 Sidon 集：新加入的数与已有数之和都不能重复</text>
  <path d="M 140 40 Q 400 46 660 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60" y="90" width="70" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="95" y="119" text-anchor="middle" font-size="13" fill="#2f5223" filter="url(#rough2)">1</text>
  <rect x="148" y="90" width="70" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="183" y="119" text-anchor="middle" font-size="13" fill="#2f5223" filter="url(#rough2)">2</text>
  <rect x="236" y="90" width="70" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="271" y="119" text-anchor="middle" font-size="13" fill="#2f5223" filter="url(#rough2)">3</text>
  <rect x="324" y="90" width="70" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="359" y="119" text-anchor="middle" font-size="13" fill="#2f5223" filter="url(#rough2)">5</text>
  <rect x="412" y="90" width="70" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="447" y="119" text-anchor="middle" font-size="13" fill="#2f5223" filter="url(#rough2)">8</text>
  <rect x="500" y="90" width="70" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="535" y="119" text-anchor="middle" font-size="13" fill="#2f5223" filter="url(#rough2)">14</text>
  <rect x="588" y="90" width="70" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="623" y="119" text-anchor="middle" font-size="13" fill="#2f5223" filter="url(#rough2)">22</text>
  <rect x="676" y="90" width="70" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="711" y="119" text-anchor="middle" font-size="13" fill="#2f5223" filter="url(#rough2)">31</text>
  <text x="60" y="176" font-size="12" fill="#2b2b2b" filter="url(#rough2)">已用和：3(1+2)、4(1+3)、5(2+3)、6(1+5)、7(2+5)、8(3+5) …</text>
  <text x="60" y="204" font-size="12" fill="#8a2b28" filter="url(#rough2)">尝试 4：1+4=5 已用过 → 跳过；尝试 5：6,7,8 全为新 → 加入。</text>
  <text x="60" y="248" font-size="12" fill="#2b2b2b" filter="url(#rough2)">N=20 时前 20 个元素最大 414，最大和 414+375=789 ≤ 1000。</text>
  <text x="60" y="276" font-size="11.5" fill="#555555" filter="url(#rough2)">因为集合里任意两数之和互不相同，所有边权 u_i+u_j 天然两两不同。</text>

</svg>
