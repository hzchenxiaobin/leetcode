<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="400" fill="#fafafa"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">E2（可旋转）：四阶中心矩对正方形有信号，对圆是 0</text>
  <path d="M 150.8600000000001 46 Q 380.0 52 609.1399999999999 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <circle cx="190.0" cy="150.0" r="72.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="190.0" y="250.0" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">圆：四个方向对称</text>
  <text x="190.0" y="272.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">Σ(dx+i·dy)^4 = 0</text>
  <rect x="330.0" y="78.0" width="130.0" height="144.0" fill="#fff3d6" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="395.0" y="246.0" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">正方形：四角贡献同相</text>
  <text x="395.0" y="268.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#d6a040" filter="url(#rough2)">|Σ(dx+i·dy)^4| = a⁶/60</text>
  <rect x="510.0" y="80.0" width="220.0" height="150.0" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="524.0" y="106.0" text-anchor="start" font-size="11.6" font-weight="bold" fill="#2f5b34" filter="url(#rough2)">归一化后：</text>
  <text x="524.0" y="132.0" text-anchor="start" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">圆     ≈ 0.001</text>
  <text x="524.0" y="154.0" text-anchor="start" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">正方形 ≈ 0.0167</text>
  <text x="524.0" y="180.0" text-anchor="start" font-size="11.6" font-weight="bold" fill="#2f5b34" filter="url(#rough2)">阈值 0.0095 分开</text>
  <text x="524.0" y="204.0" text-anchor="start" font-size="10.8" fill="#6b6b6b" filter="url(#rough2)">旋转只改相位，</text>
  <text x="524.0" y="220.0" text-anchor="start" font-size="10.8" fill="#6b6b6b" filter="url(#rough2)">不改模长 ⇒ 旋转不变</text>
  <rect x="60.0" y="296.0" width="660.0" height="60.0" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="320.0" text-anchor="start" font-size="11.4" fill="#8a6015" filter="url(#rough2)">a⁶/60 除以 A³（A = a²）恰是 1/60 ≈ 0.0167，与边长无关 —— 尺度不变。</text>
  <text x="74.0" y="340.0" text-anchor="start" font-size="11.4" fill="#8a6015" filter="url(#rough2)">圆盘的四阶矩在连续情形严格为 0，像素化误差只有 ~10⁻³ 量级。</text>
</svg>
