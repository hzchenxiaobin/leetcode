<svg xmlns="http://www.w3.org/2000/svg" width="880" height="250" viewBox="0 0 880 250"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="250" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按 a 的个数分类计数</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">n 可达 1e6，需 O(n) 预处理</text>
  <text x="150" y="100" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">枚举数字里 a 的个数 k（0..n）→ 数位和 = k*a + (n-k)*b</text>
  <text x="150" y="138" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">若该和只由 a、b 组成，则贡献 C(n,k)</text>
  <text x="150" y="176" text-anchor="start" font-size="11.5" fill="#3d6b2f" filter="url(#rough2)">组合数用阶乘 + 逆元，O(n)</text>
</svg>
