<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="340" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">插线板：消耗 1 个插座，换来 a_i 个</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">每用一个插线板，可用插座数增加 a_i - 1；先挑 a_i 大的</text>
  <g filter="url(#rough2)"><rect x="140" y="110" width="100" height="50" rx="4" fill="#cfe0f0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="190.0" y="139.68" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">k 个墙插</text>
  <line x1="245" y1="135" x2="305" y2="135" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="310" y="110" width="110" height="50" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="365.0" y="139.68" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">插线板 a=4</text>
  <line x1="425" y1="135" x2="485" y2="135" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="490" y="90" width="140" height="40" rx="4" fill="#f6e3c4" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="560.0" y="114.32" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">+4 个插座</text>
  <g filter="url(#rough2)"><rect x="490" y="150" width="140" height="40" rx="4" fill="#f6d9d7" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="560.0" y="174.32" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">-1（自己占了）</text>
  <text x="440" y="250" text-anchor="middle" font-size="13" fill="#3d6b2f" filter="url(#rough2)">可用插座 = k + Σ(a_i - 1) ≥ m 时，选用的个数就是这个答案</text>
  <text x="440" y="290" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">按 a_i 从大到小贪心，第一个满足的时刻就是最少个数</text>
</svg>
