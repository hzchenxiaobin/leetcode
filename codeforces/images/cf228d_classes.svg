<svg xmlns="http://www.w3.org/2000/svg" width="840" height="380" viewBox="0 0 840 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="380" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">系数按"模 P 的余类"分块</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">z=3 时 P=4，序列 1,2,3,2；同余类的元素共享同一个系数</text>
  <g filter="url(#rough2)"><rect x="220" y="100" width="70" height="52" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#667788" stroke-width="1.3"/></g>
  <text x="255" y="124" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="255" y="142" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">i=1</text>
  <text x="255" y="176" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">c=0</text>
  <g filter="url(#rough2)"><rect x="304" y="100" width="70" height="52" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#667788" stroke-width="1.3"/></g>
  <text x="339" y="124" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="339" y="142" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">i=2</text>
  <text x="339" y="176" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">c=1</text>
  <g filter="url(#rough2)"><rect x="388" y="100" width="70" height="52" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#667788" stroke-width="1.3"/></g>
  <text x="423" y="124" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="423" y="142" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">i=3</text>
  <text x="423" y="176" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">c=2</text>
  <g filter="url(#rough2)"><rect x="472" y="100" width="70" height="52" rx="4" fill="#f6d9d7" fill-opacity="0.85" stroke="#667788" stroke-width="1.3"/></g>
  <text x="507" y="124" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <text x="507" y="142" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">i=4</text>
  <text x="507" y="176" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">c=3</text>
  <g filter="url(#rough2)"><rect x="556" y="100" width="70" height="52" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#667788" stroke-width="1.3"/></g>
  <text x="591" y="124" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <text x="591" y="142" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">i=5</text>
  <text x="591" y="176" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">c=0</text>
  <text x="420" y="220" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">查询 [l,r]：每类求和后乘 S[((c − (l−1)) mod P) + 1]</text>
  <g filter="url(#rough2)"><rect x="150" y="244" width="540" height="54" rx="4" fill="#f7fbf4" fill-opacity="0.85" stroke="#a8c99a" stroke-width="1.3"/></g>
  <text x="420" y="268" text-anchor="middle" font-size="12" fill="#3d6b2f" filter="url(#rough2)">Z = Σ_c seq[(c − base) mod P] · sum(类 c 在 [l,r] 内)</text>
  <text x="420" y="288" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">base = (l−1) mod P</text>
  <text x="420" y="330" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">P = 2z−2 ∈ {2,4,6,8,10}，共 30 个余类</text>
</svg>
