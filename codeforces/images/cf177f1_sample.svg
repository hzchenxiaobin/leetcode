<svg xmlns="http://www.w3.org/2000/svg" width="770" height="430" viewBox="0 0 770 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="770" height="430" fill="#fafafa"/>
  <text x="385.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例：2×2 可行婚姻图恰有 7 个可接受方案</text>
  <path d="M 191.64500000000004 46 Q 385.0 52 578.355 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <circle cx="160.0" cy="96.0" r="25.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="160.0" y="101.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">男 1</text>
  <circle cx="320.0" cy="96.0" r="25.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="320.0" y="101.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">男 2</text>
  <circle cx="160.0" cy="268.0" r="25.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
