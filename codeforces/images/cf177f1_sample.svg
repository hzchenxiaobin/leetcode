  <text x="530.0" y="145.0" text-anchor="start" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">空集</text>
  <text x="710.0" y="145.0" text-anchor="start" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <path d="M 430.0 118.0 L 794.0 118.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="438.0" y="179.0" text-anchor="start" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="530.0" y="179.0" text-anchor="start" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">{1-1}</text>
  <text x="710.0" y="179.0" text-anchor="start" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <path d="M 430.0 152.0 L 794.0 152.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="438.0" y="213.0" text-anchor="start" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="530.0" y="213.0" text-anchor="start" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">{1-2}</text>
  <text x="710.0" y="213.0" text-anchor="start" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <path d="M 430.0 186.0 L 794.0 186.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="438.0" y="247.0" text-anchor="start" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="530.0" y="247.0" text-anchor="start" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">{2-1}</text>
  <text x="710.0" y="247.0" text-anchor="start" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <path d="M 430.0 220.0 L 794.0 220.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="438.0" y="281.0" text-anchor="start" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <text x="530.0" y="281.0" text-anchor="start" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">{1-2, 2-1}</text>
  <text x="710.0" y="281.0" text-anchor="start" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <path d="M 430.0 254.0 L 794.0 254.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="438.0" y="315.0" text-anchor="start" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">6</text>
  <text x="530.0" y="315.0" text-anchor="start" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">{2-2}</text>
  <text x="710.0" y="315.0" text-anchor="start" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">7</text>
  <path d="M 430.0 288.0 L 794.0 288.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="438.0" y="349.0" text-anchor="start" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">7</text>
  <text x="530.0" y="349.0" text-anchor="start" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">{1-1, 2-2}</text>
  <text x="710.0" y="349.0" text-anchor="start" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">8</text>
  <path d="M 430.0 322.0 L 794.0 322.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="436.0" y="372.0" text-anchor="start" font-size="11" fill="#6b6b6b" filter="url(#rough2)">二元方案只有 {1-2, 2-1}=5 与 {1-1, 2-2}=8 两种；</text>
  <text x="436.0" y="392.0" text-anchor="start" font-size="11" fill="#6b6b6b" filter="url(#rough2)">因此第 3 小是 2，第 7 小是 8（对应两个官方样例）。</text>
</svg>
