  <circle cx="320.0" cy="268.0" r="25.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="320.0" y="273.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">女 2</text>
  <path d="M 160.0 122.0 L 160.0 242.0" stroke="#6a5b8c" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="144.0" y="170.0" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#6a5b8c" filter="url(#rough2)">1</text>
  <path d="M 160.0 122.0 L 320.0 242.0" stroke="#6a5b8c" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="260.0" y="170.0" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#6a5b8c" filter="url(#rough2)">2</text>
  <path d="M 320.0 122.0 L 160.0 242.0" stroke="#6a5b8c" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="206.0" y="206.0" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#6a5b8c" filter="url(#rough2)">3</text>
  <path d="M 320.0 122.0 L 320.0 242.0" stroke="#6a5b8c" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="338.0" y="206.0" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#6a5b8c" filter="url(#rough2)">7</text>
  <text x="220.0" y="350.0" text-anchor="middle" font-size="11.2" fill="#6b6b6b" filter="url(#rough2)">边上的数字 = 这对 CP 的幸福值 r</text>
  <rect x="430.0" y="84.0" width="364.0" height="34.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="438.0" y="111.0" text-anchor="start" font-size="11.6" font-weight="bold" fill="#26405c" filter="url(#rough2)">升序位置</text>
  <text x="530.0" y="111.0" text-anchor="start" font-size="11.6" font-weight="bold" fill="#26405c" filter="url(#rough2)">方案（男-女）</text>
  <text x="710.0" y="111.0" text-anchor="start" font-size="11.6" font-weight="bold" fill="#26405c" filter="url(#rough2)">总幸福值</text>
  <path d="M 430.0 84.0 L 794.0 84.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
