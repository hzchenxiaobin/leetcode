<svg xmlns="http://www.w3.org/2000/svg" width="860" height="700" viewBox="0 0 860 700"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="860" height="700" fill="#fafafa"/>

  <text x="430" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">判词判定流程：四道非法检查，再看终局，最后看轮次</text>
  <path d="M 96 48 Q 430 54 764 48" stroke="#2b2b2b" stroke-width="1.2" fill="none"
        filter="url(#rough2)"/>

  <rect x="90" y="66" width="420" height="52" rx="9" fill="#eef1f7" stroke="#7a8ca6"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="88" text-anchor="middle" font-size="12.5" fill="#33445c"
        filter="url(#rough2)">读入 3×3 棋盘，摊平成 9 个字符</text>
  <text x="300" y="107" text-anchor="middle" font-size="11.5" fill="#44597a"
        filter="url(#rough2)">cx = X 的个数，co = 0 的个数，xw / ow = 是否已有三连线</text>

  <!-- 行 1 -->
  <rect x="52" y="130" width="430" height="44" rx="7" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="158" font-size="13" fill="#23405c" filter="url(#rough2)">① cx ≠ co 且 cx ≠ co + 1（X 先手，个数只能持平或多 1）</text>
  <path d="M 486 152 L 532 152" stroke="#446688" stroke-width="1.7" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="509" y="146" text-anchor="middle" font-size="11" fill="#8c3b37" filter="url(#rough2)">是</text>
  <rect x="540" y="130" width="300" height="44" rx="7" fill="#fde8e8" stroke="#b85450"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="690" y="157" text-anchor="middle" font-size="13" fill="#8c3b37"
        filter="url(#rough2)">illegal</text>

  <!-- 行 2 -->
  <rect x="52" y="190" width="430" height="44" rx="7" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="218" font-size="13" fill="#23405c" filter="url(#rough2)">② xw 且 ow（双方都连成三，比赛早该结束了）</text>
  <path d="M 486 212 L 532 212" stroke="#446688" stroke-width="1.7" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="509" y="206" text-anchor="middle" font-size="11" fill="#8c3b37" filter="url(#rough2)">是</text>
  <rect x="540" y="190" width="300" height="44" rx="7" fill="#fde8e8" stroke="#b85450"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="690" y="217" text-anchor="middle" font-size="13" fill="#8c3b37"
        filter="url(#rough2)">illegal</text>

  <!-- 行 3 -->
  <rect x="52" y="250" width="430" height="44" rx="7" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="278" font-size="13" fill="#23405c" filter="url(#rough2)">③ xw 且 cx ≠ co + 1（X 赢，却不是 X 刚下完）</text>
  <path d="M 486 272 L 532 272" stroke="#446688" stroke-width="1.7" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="509" y="266" text-anchor="middle" font-size="11" fill="#8c3b37" filter="url(#rough2)">是</text>
  <rect x="540" y="250" width="300" height="44" rx="7" fill="#fde8e8" stroke="#b85450"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="690" y="277" text-anchor="middle" font-size="13" fill="#8c3b37"
        filter="url(#rough2)">illegal</text>

  <!-- 行 4 -->
  <rect x="52" y="310" width="430" height="44" rx="7" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="338" font-size="13" fill="#23405c" filter="url(#rough2)">④ ow 且 cx ≠ co（0 赢，却不是 0 刚下完）</text>
  <path d="M 486 332 L 532 332" stroke="#446688" stroke-width="1.7" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="509" y="326" text-anchor="middle" font-size="11" fill="#8c3b37" filter="url(#rough2)">是</text>
  <rect x="540" y="310" width="300" height="44" rx="7" fill="#fde8e8" stroke="#b85450"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="690" y="337" text-anchor="middle" font-size="13" fill="#8c3b37"
        filter="url(#rough2)">illegal</text>

  <!-- 行 5 -->
  <rect x="52" y="370" width="430" height="44" rx="7" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="398" font-size="13" fill="#23405c" filter="url(#rough2)">⑤ xw（X 连成三，且已通过 ③）</text>
  <path d="M 486 392 L 532 392" stroke="#446688" stroke-width="1.7" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="509" y="386" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="540" y="370" width="300" height="44" rx="7" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="690" y="397" text-anchor="middle" font-size="13" fill="#8a6015"
        filter="url(#rough2)">the first player won</text>

  <!-- 行 6 -->
  <rect x="52" y="430" width="430" height="44" rx="7" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="458" font-size="13" fill="#23405c" filter="url(#rough2)">⑥ ow（0 连成三，且已通过 ④）</text>
  <path d="M 486 452 L 532 452" stroke="#446688" stroke-width="1.7" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="509" y="446" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="540" y="430" width="300" height="44" rx="7" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="690" y="457" text-anchor="middle" font-size="13" fill="#8a6015"
        filter="url(#rough2)">the second player won</text>

  <!-- 行 7 -->
  <rect x="52" y="490" width="430" height="44" rx="7" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="518" font-size="13" fill="#23405c" filter="url(#rough2)">⑦ cx + co = 9（9 格全满，无人成三）</text>
  <path d="M 486 512 L 532 512" stroke="#446688" stroke-width="1.7" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="509" y="506" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="540" y="490" width="300" height="44" rx="7" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="690" y="517" text-anchor="middle" font-size="13" fill="#2f5223"
        filter="url(#rough2)">draw</text>

  <!-- 行 8 -->
  <rect x="52" y="550" width="430" height="44" rx="7" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="578" font-size="13" fill="#23405c" filter="url(#rough2)">⑧ 还剩空位：cx = co ？</text>
  <path d="M 486 572 L 532 572" stroke="#446688" stroke-width="1.7" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="509" y="566" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是/否</text>
  <rect x="540" y="550" width="300" height="44" rx="7" fill="#eef1f7" stroke="#7a8ca6"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="690" y="570" text-anchor="middle" font-size="12" fill="#33445c"
        filter="url(#rough2)">first（cx = co）</text>
  <text x="690" y="586" text-anchor="middle" font-size="12" fill="#33445c"
        filter="url(#rough2)">second（cx = co + 1）</text>

  <!-- 否：向下箭头 -->
  <path d="M 267 118 L 267 126" stroke="#446688" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 267 178 L 267 186" stroke="#446688" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 267 238 L 267 246" stroke="#446688" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 267 298 L 267 306" stroke="#446688" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 267 358 L 267 366" stroke="#446688" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 267 418 L 267 426" stroke="#446688" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 267 478 L 267 486" stroke="#446688" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 267 538 L 267 546" stroke="#446688" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>


  <text x="430" y="634" text-anchor="middle" font-size="12" fill="#666"
        filter="url(#rough2)">命中任一非法检查就立即输出 illegal；终局判词（赢 / 平）优先于轮次判词。 </text>
  <text x="430" y="656" text-anchor="middle" font-size="11.5" fill="#8a8a8a"
        filter="url(#rough2)">向下的细箭头表示「不满足，继续检查下一条」。X 先手；棋盘上的 nought 是数字零 0，不是字母 O。</text>
</svg>
