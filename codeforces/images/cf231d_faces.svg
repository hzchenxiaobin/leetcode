<svg xmlns="http://www.w3.org/2000/svg" width="840" height="380" viewBox="0 0 840 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="380" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">六个面：点在哪一侧就看到哪一面</text>
  <text x="420" y="56" text-anchor="middle" font-size="11.8" fill="#666666" filter="url(#rough2)">a₁↔y=0, a₂↔y=y₁, a₃↔z=0, a₄↔z=z₁, a₅↔x=0, a₆↔x=x₁</text>
  <g filter="url(#rough2)"><rect x="280" y="120" width="200" height="140" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.6"/></g>
  <text x="380" y="196" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">盒子</text>
  <text x="250" y="140" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">a₁: y=0</text>
  <text x="510" y="140" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">a₂: y=y₁</text>
  <text x="270" y="290" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">a₅: x=0</text>
  <text x="520" y="290" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">a₆: x=x₁</text>
  <text x="380" y="106" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">a₃: z=0</text>
  <text x="380" y="292" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">a₄: z=z₁</text>
  <text x="420" y="336" text-anchor="middle" font-size="11.5" fill="#8a4b2a" filter="url(#rough2)">条件：严格在外侧（如 x&lt;0 才看得到 a₅；x=0 时看不到）</text>
  <text x="420" y="362" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">最多看到 3 个面，逐面判断 O(1)</text>
</svg>
