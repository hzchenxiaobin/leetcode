<svg xmlns="http://www.w3.org/2000/svg" width="860" height="500" viewBox="0 0 860 500"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#55606e"/>
    </marker>
  </defs>
  <rect width="860" height="500" fill="#fafafa"/>

  <text x="430" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">链上 DP：每个窗口只有「整块归左 / 整块归右」</text>
  <path d="M 130 40 Q 430 48 730 40" stroke="#2b2b2b" stroke-width="1.1" fill="none" filter="url(#rough2)"/>

  <!-- 链与变量 -->
  <g filter="url(#rough2)">
    <rect x="120" y="60" width="70" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="155" y="85" text-anchor="middle" font-size="12.5" fill="#2f4a66">a1</text>
    <rect x="190" y="70" width="80" height="22" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="230" y="86" text-anchor="middle" font-size="11.5" fill="#8a6520">w1</text>
    <rect x="270" y="60" width="70" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="305" y="85" text-anchor="middle" font-size="12.5" fill="#3c5e2e">a2</text>
    <rect x="340" y="70" width="80" height="22" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="380" y="86" text-anchor="middle" font-size="11.5" fill="#8a6520">w2</text>
    <rect x="420" y="60" width="70" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="455" y="85" text-anchor="middle" font-size="12.5" fill="#2f4a66">a3</text>
    <text x="512" y="86" font-size="14" fill="#8a8a8a">…</text>
    <rect x="540" y="60" width="70" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="575" y="85" text-anchor="middle" font-size="12.5" fill="#3c5e2e">aK</text>
    <text x="230" y="114" text-anchor="middle" font-size="11" fill="#55606e">x1</text>
    <text x="380" y="114" text-anchor="middle" font-size="11" fill="#55606e">x2</text>
  </g>

  <!-- 公式 -->
  <g filter="url(#rough2)">
    <rect x="110" y="124" width="640" height="38" rx="8" fill="#f7fbff" stroke="#446688" stroke-width="1.4"/>
    <text x="122" y="148" font-size="12.5" fill="#2f4a66">第 i 块长度 = a_i + (x_i = 1 ? w_i : 0) + (x_{i-1} = 0 ? w_{i-1} : 0)，且 x_0 = x_K = 0</text>
  </g>

  <!-- 状态框 -->
  <g filter="url(#rough2)">
    <rect x="56" y="186" width="252" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="70" y="206" font-size="12" font-weight="bold" fill="#2f4a66">dp[i-1][0] ：x_{i-1} = 0</text>
    <text x="70" y="226" font-size="11" fill="#2f4a66">w_{i-1} 还空着，能给第 i 块</text>

    <rect x="56" y="246" width="252" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="70" y="266" font-size="12" font-weight="bold" fill="#3c5e2e">dp[i-1][1] ：x_{i-1} = 1</text>
    <text x="70" y="286" font-size="11" fill="#3c5e2e">w_{i-1} 已被第 i-1 块拿走</text>

    <rect x="548" y="186" width="252" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="562" y="206" font-size="12" font-weight="bold" fill="#2f4a66">dp[i][0] ：x_i = 0</text>
    <text x="562" y="226" font-size="11" fill="#2f4a66">w_i 留给第 i+1 块</text>

    <rect x="548" y="246" width="252" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="562" y="266" font-size="12" font-weight="bold" fill="#3c5e2e">dp[i][1] ：x_i = 1</text>
    <text x="562" y="286" font-size="11" fill="#3c5e2e">w_i 归第 i 块</text>
  </g>

  <!-- 四条转移（不写字，靠下方表格解释） -->
  <g filter="url(#rough2)">
    <path d="M 310 204 C 400 182 470 182 546 202" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 310 222 C 380 250 400 276 546 276" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 310 278 C 400 262 470 232 546 226" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <path d="M 310 296 C 400 320 470 320 546 292" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
    <text x="430" y="184" text-anchor="middle" font-size="11" fill="#55606e">从上一状态“插入一个新长度”</text>
  </g>

  <!-- 转移表 -->
  <g filter="url(#rough2)">
    <rect x="56" y="312" width="744" height="118" rx="8" fill="#ffffff" stroke="#9aa7b5" stroke-width="1.3"/>
    <text x="76" y="334" font-size="12" font-weight="bold" fill="#2f4a66">转移</text>
    <text x="500" y="334" font-size="12" font-weight="bold" fill="#2f4a66">插入的新长度</text>
    <path d="M 66 342 Q 430 345 790 342" stroke="#d6d6d6" stroke-width="1" fill="none"/>

    <text x="80" y="362" font-size="11.5" fill="#2f4a66">① dp[i-1][0] → dp[i][0]</text>
    <text x="500" y="362" font-size="11.5" fill="#2f4a66">a_i + w_{i-1}</text>

    <text x="80" y="382" font-size="11.5" fill="#a03a36">② dp[i-1][0] → dp[i][1]</text>
    <text x="500" y="382" font-size="11.5" fill="#a03a36">a_i + w_{i-1} + w_i</text>

    <text x="80" y="402" font-size="11.5" fill="#a03a36">③ dp[i-1][1] → dp[i][0]</text>
    <text x="500" y="402" font-size="11.5" fill="#a03a36">a_i</text>

    <text x="80" y="422" font-size="11.5" fill="#3c5e2e">④ dp[i-1][1] → dp[i][1]</text>
    <text x="500" y="422" font-size="11.5" fill="#3c5e2e">a_i + w_i</text>

    <text x="652" y="362" font-size="11" fill="#8a8a8a">w_{i-1} 还在</text>
    <text x="652" y="382" font-size="11" fill="#8a8a8a">全拿</text>
    <text x="652" y="402" font-size="11" fill="#8a8a8a">只拿不到</text>
    <text x="652" y="422" font-size="11" fill="#8a8a8a">拿 w_i</text>
  </g>

  <!-- 结论 -->
  <g filter="url(#rough2)">
    <rect x="56" y="442" width="744" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="70" y="462" font-size="12" fill="#8a6520">dp[i][x] = 两条候选（分别把新长度插进 dp[i-1][0]、dp[i-1][1]）中降序向量字典序更大的那条</text>
    <text x="70" y="480" font-size="12" fill="#8a6520">答案 = dp[K][0]（最右块没有右窗口）；状态只有 2 个，每次“插入 + 比较”都是 O(K)。</text>
  </g>
</svg>
