<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="660" height="400" fill="#fafafa" filter="url(#rough2)"/>

  <text x="330" y="30" text-anchor="middle" font-size="16" fill="#333"
        filter="url(#rough2)">循环左移子节点 ⇒ 叶子序列整段重排</text>

  <!-- 左图：树 -->
  <path d="M 170 99 L 112 152" stroke="#446688" stroke-width="1.6" fill="none"
        filter="url(#rough2)"/>
  <path d="M 170 99 L 238 152" stroke="#446688" stroke-width="1.6" fill="none"
        filter="url(#rough2)"/>
  <path d="M 110 189 L 78 245" stroke="#446688" stroke-width="1.6" fill="none"
        filter="url(#rough2)"/>
  <path d="M 112 189 L 148 245" stroke="#446688" stroke-width="1.6" fill="none"
        filter="url(#rough2)"/>

  <circle cx="170" cy="80" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"
          filter="url(#rough2)"/>
  <text x="170" y="86" text-anchor="middle" font-size="14" fill="#334"
        filter="url(#rough2)">1</text>
  <circle cx="110" cy="170" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"
          filter="url(#rough2)"/>
  <text x="110" y="176" text-anchor="middle" font-size="14" fill="#334"
        filter="url(#rough2)">2</text>
  <circle cx="240" cy="170" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"
          filter="url(#rough2)"/>
  <text x="240" y="176" text-anchor="middle" font-size="14" fill="#334"
        filter="url(#rough2)">3</text>

  <rect x="47" y="245" width="62" height="34" rx="6" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="78" y="266" text-anchor="middle" font-size="11" fill="#334"
        filter="url(#rough2)">4号=2</text>
  <rect x="119" y="245" width="62" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="266" text-anchor="middle" font-size="11" fill="#334"
        filter="url(#rough2)">5号=1</text>
  <rect x="210" y="245" width="62" height="34" rx="6" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="241" y="266" text-anchor="middle" font-size="11" fill="#334"
        filter="url(#rough2)">3号=3</text>

  <text x="30" y="308" font-size="11" fill="#555"
        filter="url(#rough2)">在 2 上左移：孩子顺序 (4,5) → (5,4)</text>
  <text x="30" y="328" font-size="11" fill="#555"
        filter="url(#rough2)">只有 2 的子树内部顺序变化</text>
  <text x="30" y="348" font-size="11" fill="#555"
        filter="url(#rough2)">其他子树不动</text>

  <!-- 右图：叶子序列 -->
  <text x="350" y="62" font-size="12" fill="#333"
        filter="url(#rough2)">左→右读叶子（初始）</text>
  <rect x="352" y="74" width="40" height="34" rx="5" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="372" y="96" text-anchor="middle" font-size="14" fill="#334"
        filter="url(#rough2)">2</text>
  <rect x="398" y="74" width="40" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="418" y="96" text-anchor="middle" font-size="14" fill="#334"
        filter="url(#rough2)">1</text>
  <rect x="444" y="74" width="40" height="34" rx="5" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="464" y="96" text-anchor="middle" font-size="14" fill="#334"
        filter="url(#rough2)">3</text>
  <text x="496" y="96" font-size="11" fill="#b85450"
        filter="url(#rough2)">× 2,1,3</text>

  <path d="M 372 116 L 372 152" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="384" y="140" font-size="11" fill="#446688"
        filter="url(#rough2)">对 2 左移 1 次</text>

  <text x="350" y="182" font-size="12" fill="#333"
        filter="url(#rough2)">旋转后</text>
  <rect x="352" y="194" width="40" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="372" y="216" text-anchor="middle" font-size="14" fill="#334"
        filter="url(#rough2)">1</text>
  <rect x="398" y="194" width="40" height="34" rx="5" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="418" y="216" text-anchor="middle" font-size="14" fill="#334"
        filter="url(#rough2)">2</text>
  <rect x="444" y="194" width="40" height="34" rx="5" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="464" y="216" text-anchor="middle" font-size="14" fill="#334"
        filter="url(#rough2)">3</text>
  <text x="496" y="216" font-size="11" fill="#4a7a3a"
        filter="url(#rough2)">√ 1,2,3</text>

  <text x="350" y="270" font-size="11" fill="#666"
        filter="url(#rough2)">子树的叶子在最终序列里</text>
  <text x="350" y="290" font-size="11" fill="#666"
        filter="url(#rough2)">始终占连续的一段位置，</text>
  <text x="350" y="310" font-size="11" fill="#666"
        filter="url(#rough2)">因此也占连续的一段值 ——</text>
  <text x="350" y="330" font-size="11" fill="#666"
        filter="url(#rough2)">这是本题的核心不变量。</text>
</svg>
