<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="397"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="300" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">去前导零后的位数决定「有限」还是「无穷」</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">长度 ≥2 ⇒ 数值随进制增长 ⇒ 有限；一位 ⇒ 恒定</text>
  <g filter="url(#rough2)"><rect x="60" y="96" width="380" height="110" rx="6" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="250" y="124" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">长度 ≥ 2（如 11:20）</text>
  <text x="250" y="152" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">值 = b+1 与 2b，随 b 增长</text>
  <text x="250" y="180" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">⇒ 满足 b+1&lt;24、2b&lt;60 的有限个 b</text>
  <g filter="url(#rough2)"><rect x="480" y="96" width="380" height="110" rx="6" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="670" y="124" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">去掉前导零只剩一位</text>
  <text x="670" y="152" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">值恒为那个数字</text>
  <text x="670" y="180" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">⇒ 无穷多进制（合法则输出 -1）</text>
  <g filter="url(#rough2)"><rect x="60" y="226" width="800" height="52" rx="6" fill="#f3d9d6" fill-opacity="0.45" stroke="#8a2b28" stroke-width="1.4"/></g>
  <text x="460" y="258" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">还要检查：每位数字 &lt; 进制（下界 = 最大数字 + 1），且小时 &lt; 24、分钟 &lt; 60</text>
</svg>
