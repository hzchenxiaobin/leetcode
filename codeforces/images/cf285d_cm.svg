<svg xmlns="http://www.w3.org/2000/svg" width="700" height="330" viewBox="0 0 700 330"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="351"/>
    <feDisplacementMap in="SourceGraphic" scale="1.5"/></filter></defs>
  <rect width="700" height="330" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">化成"完全映射"：n! × (Z_n 的完全映射个数)</text>
  <path d="M 110 40 Q 350 46 590 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="76" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="13" fill="#22314a" filter="url(#rough2)">c_i = ((a_i−1)+(b_i−1)) mod n + 1 是排列 ⟺ a'_i+b'_i（mod n）是排列（a',b' 为 0..n−1 的排列）。</text>
  <text x="76" y="106" font-size="12.5" fill="#22314a" filter="url(#rough2)">固定 b' 后，满足条件的 a' 的个数与 b' 无关（把位置按 b' 重排即可看到）⇒ 总方案 = n! × A(n)，</text>
  <text x="76" y="126" font-size="12.5" fill="#22314a" filter="url(#rough2)">其中 A(n) = 满足"i + σ(i) 也是排列"的 σ 的个数（完全映射 / complete mapping）。</text>
  <g filter="url(#rough2)"><rect x="60" y="144" width="580" height="58" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="76" y="168" font-size="13" fill="#8a6015" filter="url(#rough2)">n 为偶数 ⇒ A(n)=0（奇偶/群论定理：Z_n 的 Sylow-2 子群循环 ⇒ 无完全映射）。</text>
  <text x="76" y="190" font-size="12" fill="#8a6015" filter="url(#rough2)">实测：A(1)=1, A(3)=3, A(5)=15, A(7)=133, A(9)=2025, A(11)=37851, A(13)=1030367, A(15)=36362925。</text>
  <g filter="url(#rough2)"><rect x="60" y="212" width="580" height="66" rx="8" fill="#e8f4e0" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="236" font-size="12.5" fill="#2f5223" filter="url(#rough2)">A(n) 用"逐行放、双掩码压缩"的 DP 算：状态 = (已用列集合, 已用对角集合)，都是 n 位掩码。</text>
  <text x="76" y="260" font-size="12" fill="#3c5e2e" filter="url(#rough2)">看似 4ⁿ，但可达状态极少：n=15 时峰值仅 2.6·10⁶ 个（用哈希表存）。</text>
  <g filter="url(#rough2)"><rect x="60" y="288" width="580" height="34" rx="8" fill="#fbeeee" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="76" y="310" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">样例：n=3 ⇒ 3!·3 = 18 ✓；n=5 ⇒ 5!·15 = 1800 ✓</text>
</svg>
