<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="720" height="430" fill="#fafafa"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">过滤后相邻 ⟺ 中间字母全被删掉</text>
  <path d="M 200 43 Q 360 49 520 43" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <rect x="120" y="84" width="52" height="44" rx="8" fill="#ffffff" stroke="#777777" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="146.0" y="114" text-anchor="middle" font-size="18" font-weight="bold" fill="#777777" filter="url(#rough2)">A</text>
  <text x="146.0" y="76" text-anchor="middle" font-size="9.5" fill="#777777" filter="url(#rough2)">p1</text>
  <rect x="182" y="84" width="52" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="208.0" y="114" text-anchor="middle" font-size="18" font-weight="bold" fill="#446688" filter="url(#rough2)">B</text>
  <text x="208.0" y="76" text-anchor="middle" font-size="9.5" fill="#777777" filter="url(#rough2)">p2</text>
  <rect x="244" y="84" width="52" height="44" rx="8" fill="#ffffff" stroke="#777777" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270.0" y="114" text-anchor="middle" font-size="18" font-weight="bold" fill="#777777" filter="url(#rough2)">C</text>
  <text x="270.0" y="76" text-anchor="middle" font-size="9.5" fill="#777777" filter="url(#rough2)">p3</text>
  <rect x="306" y="84" width="52" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="332.0" y="114" text-anchor="middle" font-size="18" font-weight="bold" fill="#446688" filter="url(#rough2)">B</text>
  <text x="332.0" y="76" text-anchor="middle" font-size="9.5" fill="#777777" filter="url(#rough2)">p4</text>
  <rect x="368" y="84" width="52" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="394.0" y="114" text-anchor="middle" font-size="18" font-weight="bold" fill="#446688" filter="url(#rough2)">D</text>
  <text x="394.0" y="76" text-anchor="middle" font-size="9.5" fill="#777777" filter="url(#rough2)">p5</text>
  <text x="360" y="150" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">保留 {B, D}：只剩 B B D，三对候选 (1,2) (2,4) (4,5)</text>
  <path d="M 146.0 136 L 208.0 136" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="177.0" y="128" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">D = ∅</text>
  <path d="M 332.0 136 L 394.0 136" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="363.0" y="128" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">D = ∅</text>
  <path d="M 208.0 108 Q 270.0 154 332.0 108" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="270.0" y="168" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">D = {C}，C 被删 → B、B 相邻</text>
  <path d="M 208.0 124 Q 301.0 204 394.0 128" stroke="#777777" stroke-width="1.4" fill="none" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="311.0" y="216" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">D 里含保留的 B 或 D → 不相邻</text>
  <rect x="60" y="296" width="600" height="110" rx="7" fill="#e9f4e2" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="76" y="322" text-anchor="start" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">把每个「候选相邻对」的贡献记到 mask T（被删集合）上：</text>
  <text x="76" y="346" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">需要 D ⊆ T 且 u, v ∉ T   ——  一个「下界 + 两个禁位」的子立方体</text>
  <text x="76" y="372" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">q 必须是 v 在 p 之后的首次出现，否则中间那个 v 也会保留，p,q 就不可能相邻</text>
  <text x="76" y="396" text-anchor="start" font-size="11" fill="#777777" filter="url(#rough2)">所以每个 p 只有「每个字母的首次出现位置」这至多 K 个候选 q。</text>
</svg>
