<svg xmlns="http://www.w3.org/2000/svg" width="840" height="340" viewBox="0 0 840 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="340" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">贪心流程</text>
  <g filter="url(#rough2)"><rect x="100" y="120" width="150" height="70" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="175" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">读入 s, n</text>
  <g filter="url(#rough2)"><line x1="254" y1="155" x2="276" y2="155" stroke="#888888" stroke-width="1.4" marker-end="url(#arrb)"/></g>
  <g filter="url(#rough2)"><rect x="280" y="120" width="150" height="70" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="355" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按 x 升序排序</text>
  <g filter="url(#rough2)"><line x1="434" y1="155" x2="456" y2="155" stroke="#888888" stroke-width="1.4" marker-end="url(#arrb)"/></g>
  <g filter="url(#rough2)"><rect x="460" y="120" width="150" height="70" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="535" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">s ≤ x_i ?</text>
  <g filter="url(#rough2)"><line x1="614" y1="155" x2="636" y2="155" stroke="#888888" stroke-width="1.4" marker-end="url(#arrb)"/></g>
  <g filter="url(#rough2)"><rect x="640" y="120" width="150" height="70" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="715" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">输出 NO / YES</text>
  <text x="310" y="230" text-anchor="middle" font-size="11" fill="#8a4b2a" filter="url(#rough2)">是 → 输出 NO</text>
  <text x="660" y="230" text-anchor="middle" font-size="11" fill="#3d6b2f" filter="url(#rough2)">全部通过 → YES</text>
  <text x="420" y="280" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">复杂度 O(n log n)，n ≤ 1000 实测 &lt; 1 ms</text>
</svg>
