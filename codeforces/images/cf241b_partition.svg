<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="29"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="pp" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b4652a"/>
    </marker>
  </defs>
  <rect width="720" height="330" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按「最高不同位 p」分组：高位前缀互补的两组合并计数</text>

  <g filter="url(#rough2)">
    <rect x="26"  y="96" width="98" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="140" y="96" width="98" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="254" y="96" width="98" height="56" rx="8" fill="#f2f2f2" stroke="#999999" stroke-width="1.4" stroke-dasharray="4 3"/>
    <rect x="368" y="96" width="98" height="56" rx="8" fill="#f2f2f2" stroke="#999999" stroke-width="1.4" stroke-dasharray="4 3"/>
    <rect x="482" y="96" width="98" height="56" rx="8" fill="#fde9d9" stroke="#b4652a" stroke-width="1.8"/>
    <rect x="596" y="96" width="98" height="56" rx="8" fill="#fde9d9" stroke="#b4652a" stroke-width="1.8"/>
  </g>
  <g font-size="11.5" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">
    <text x="75"  y="120">h = 0</text><text x="75"  y="140" font-size="10.5" fill="#4a7a3a">3 个</text>
    <text x="189" y="120">h = 1</text><text x="189" y="140" font-size="10.5" fill="#4a7a3a">5 个</text>
    <text x="303" y="120">h = 2</text><text x="303" y="140" font-size="10.5" fill="#777777">4 个</text>
    <text x="417" y="120">h = 3</text><text x="417" y="140" font-size="10.5" fill="#777777">2 个</text>
    <text x="531" y="120">h = 5</text><text x="531" y="140" font-size="10.5" fill="#7a4b22">6 个</text>
    <text x="645" y="120">h = 4</text><text x="645" y="140" font-size="10.5" fill="#7a4b22">1 个</text>
  </g>
  <g stroke="#b4652a" stroke-width="1.6" fill="none" filter="url(#rough2)">
    <path d="M75,96 C75,60 645,60 645,96" marker-end="url(#pp)"/>
    <path d="M189,96 C189,74 531,74 531,96" marker-end="url(#pp)"/>
  </g>
  <text x="360" y="54" text-anchor="middle" font-size="11" fill="#7a4b22" filter="url(#rough2)">pat = 5：h 与 h xor 5 配对（0↔5、1↔4）；2、3 找不到伙伴，跳过</text>
  <text x="303" y="176" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">无伙伴</text>
  <text x="417" y="176" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">无伙伴</text>

  <g filter="url(#rough2)">
    <rect x="40" y="196" width="640" height="120" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <g font-size="11.5" fill="#2f4a66" filter="url(#rough2)">
    <text x="56" y="218" font-weight="bold">每组 (h, h xor pat) 的贡献：</text>
    <text x="56" y="242">· 数对个数 = c_h × c_h'（低位随便取，所以是全部组合）</text>
    <text x="56" y="264">· 高位部分两两相同，等于 pat &lt;&lt; p，贡献 = c_h · c_h' · (pat &lt;&lt; p)</text>
    <text x="56" y="286">· 低 p 位用两组的「按位 1 的个数」逐位统计（见下一张图）</text>
    <text x="56" y="306">· 遍历时只取 h &lt; h xor pat 的一侧，避免同一无序对算两次</text>
  </g>
</svg>
