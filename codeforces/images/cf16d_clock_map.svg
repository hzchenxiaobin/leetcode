<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="301"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrS" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="420" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">12 小时制换算成"当天第几分钟"：上午 0–11，下午 12–23</text>

  <!-- 上午行 -->
  <text x="62" y="88" text-anchor="end" font-size="11.5" fill="#446688" filter="url(#rough2)">上午 a.m.</text>
  <rect x="70" y="58" width="48" height="30" rx="5" fill="#dbe7fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="120" y="58" width="48" height="30" rx="5" fill="#dbe7fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="170" y="58" width="48" height="30" rx="5" fill="#dbe7fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="220" y="58" width="48" height="30" rx="5" fill="#dbe7fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="270" y="58" width="48" height="30" rx="5" fill="#dbe7fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="320" y="58" width="48" height="30" rx="5" fill="#dbe7fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="370" y="58" width="48" height="30" rx="5" fill="#dbe7fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="420" y="58" width="48" height="30" rx="5" fill="#dbe7fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="470" y="58" width="48" height="30" rx="5" fill="#dbe7fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="520" y="58" width="48" height="30" rx="5" fill="#dbe7fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="570" y="58" width="48" height="30" rx="5" fill="#dbe7fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="620" y="58" width="48" height="30" rx="5" fill="#dbe7fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <text x="94" y="78" text-anchor="middle" font-size="11" fill="#23405c" filter="url(#rough2)">12</text>
  <text x="144" y="78" text-anchor="middle" font-size="11" fill="#23405c" filter="url(#rough2)">01</text>
  <text x="194" y="78" text-anchor="middle" font-size="11" fill="#23405c" filter="url(#rough2)">02</text>
  <text x="244" y="78" text-anchor="middle" font-size="11" fill="#23405c" filter="url(#rough2)">03</text>
  <text x="294" y="78" text-anchor="middle" font-size="11" fill="#23405c" filter="url(#rough2)">04</text>
  <text x="344" y="78" text-anchor="middle" font-size="11" fill="#23405c" filter="url(#rough2)">05</text>
  <text x="394" y="78" text-anchor="middle" font-size="11" fill="#23405c" filter="url(#rough2)">06</text>
  <text x="444" y="78" text-anchor="middle" font-size="11" fill="#23405c" filter="url(#rough2)">07</text>
  <text x="494" y="78" text-anchor="middle" font-size="11" fill="#23405c" filter="url(#rough2)">08</text>
  <text x="544" y="78" text-anchor="middle" font-size="11" fill="#23405c" filter="url(#rough2)">09</text>
  <text x="594" y="78" text-anchor="middle" font-size="11" fill="#23405c" filter="url(#rough2)">10</text>
  <text x="644" y="78" text-anchor="middle" font-size="11" fill="#23405c" filter="url(#rough2)">11</text>

  <!-- 24 小时值：上午 -->
  <text x="94" y="126" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">0</text>
  <text x="144" y="126" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">1</text>
  <text x="194" y="126" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">2</text>
  <text x="244" y="126" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">3</text>
  <text x="294" y="126" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">4</text>
  <text x="344" y="126" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">5</text>
  <text x="394" y="126" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">6</text>
  <text x="444" y="126" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">7</text>
  <text x="494" y="126" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">8</text>
  <text x="544" y="126" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">9</text>
  <text x="594" y="126" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">10</text>
  <text x="644" y="126" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">11</text>

  <!-- 下午行 -->
  <text x="62" y="172" text-anchor="end" font-size="11.5" fill="#8a4a14" filter="url(#rough2)">下午 p.m.</text>
  <rect x="70" y="142" width="48" height="30" rx="5" fill="#fff1e6" stroke="#b06a2c" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="120" y="142" width="48" height="30" rx="5" fill="#fff1e6" stroke="#b06a2c" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="170" y="142" width="48" height="30" rx="5" fill="#fff1e6" stroke="#b06a2c" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="220" y="142" width="48" height="30" rx="5" fill="#fff1e6" stroke="#b06a2c" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="270" y="142" width="48" height="30" rx="5" fill="#fff1e6" stroke="#b06a2c" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="320" y="142" width="48" height="30" rx="5" fill="#fff1e6" stroke="#b06a2c" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="370" y="142" width="48" height="30" rx="5" fill="#fff1e6" stroke="#b06a2c" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="420" y="142" width="48" height="30" rx="5" fill="#fff1e6" stroke="#b06a2c" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="470" y="142" width="48" height="30" rx="5" fill="#fff1e6" stroke="#b06a2c" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="520" y="142" width="48" height="30" rx="5" fill="#fff1e6" stroke="#b06a2c" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="570" y="142" width="48" height="30" rx="5" fill="#fff1e6" stroke="#b06a2c" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="620" y="142" width="48" height="30" rx="5" fill="#fff1e6" stroke="#b06a2c" stroke-width="1.2" filter="url(#rough2)"/>

  <text x="94" y="162" text-anchor="middle" font-size="11" fill="#8a4a14" filter="url(#rough2)">12</text>
  <text x="144" y="162" text-anchor="middle" font-size="11" fill="#8a4a14" filter="url(#rough2)">01</text>
  <text x="194" y="162" text-anchor="middle" font-size="11" fill="#8a4a14" filter="url(#rough2)">02</text>
  <text x="244" y="162" text-anchor="middle" font-size="11" fill="#8a4a14" filter="url(#rough2)">03</text>
  <text x="294" y="162" text-anchor="middle" font-size="11" fill="#8a4a14" filter="url(#rough2)">04</text>
  <text x="344" y="162" text-anchor="middle" font-size="11" fill="#8a4a14" filter="url(#rough2)">05</text>
  <text x="394" y="162" text-anchor="middle" font-size="11" fill="#8a4a14" filter="url(#rough2)">06</text>
  <text x="444" y="162" text-anchor="middle" font-size="11" fill="#8a4a14" filter="url(#rough2)">07</text>
  <text x="494" y="162" text-anchor="middle" font-size="11" fill="#8a4a14" filter="url(#rough2)">08</text>
  <text x="544" y="162" text-anchor="middle" font-size="11" fill="#8a4a14" filter="url(#rough2)">09</text>
  <text x="594" y="162" text-anchor="middle" font-size="11" fill="#8a4a14" filter="url(#rough2)">10</text>
  <text x="644" y="162" text-anchor="middle" font-size="11" fill="#8a4a14" filter="url(#rough2)">11</text>

  <!-- 24 小时值：下午 -->
  <text x="94" y="186" text-anchor="middle" font-size="11" fill="#8c3b37" filter="url(#rough2)">12</text>
  <text x="144" y="186" text-anchor="middle" font-size="11" fill="#8c3b37" filter="url(#rough2)">13</text>
  <text x="194" y="186" text-anchor="middle" font-size="11" fill="#8c3b37" filter="url(#rough2)">14</text>
  <text x="244" y="186" text-anchor="middle" font-size="11" fill="#8c3b37" filter="url(#rough2)">15</text>
  <text x="294" y="186" text-anchor="middle" font-size="11" fill="#8c3b37" filter="url(#rough2)">16</text>
  <text x="344" y="186" text-anchor="middle" font-size="11" fill="#8c3b37" filter="url(#rough2)">17</text>
  <text x="394" y="186" text-anchor="middle" font-size="11" fill="#8c3b37" filter="url(#rough2)">18</text>
  <text x="444" y="186" text-anchor="middle" font-size="11" fill="#8c3b37" filter="url(#rough2)">19</text>
  <text x="494" y="186" text-anchor="middle" font-size="11" fill="#8c3b37" filter="url(#rough2)">20</text>
  <text x="544" y="186" text-anchor="middle" font-size="11" fill="#8c3b37" filter="url(#rough2)">21</text>
  <text x="594" y="186" text-anchor="middle" font-size="11" fill="#8c3b37" filter="url(#rough2)">22</text>
  <text x="644" y="186" text-anchor="middle" font-size="11" fill="#8c3b37" filter="url(#rough2)">23</text>

  <!-- 公式 -->
  <rect x="60" y="214" width="640" height="72" rx="9" fill="#eef4ff" stroke="#446688"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="76" y="240" font-size="13" fill="#23405c" filter="url(#rough2)">hour = hh mod 12　然后：上午 "+0"、下午 "+12"　→　t = hour × 60 + mm</text>
  <text x="76" y="264" font-size="11.5" fill="#446688" filter="url(#rough2)">12 点取模得 0：上午 12 点 = 0 点（午夜），下午 12 点 = 12 点（正午）。</text>
  <text x="76" y="282" font-size="11.5" fill="#8c3b37" filter="url(#rough2)">不能直接比较字符串：字典序下 "01:13 p.m." 排在 "11:40 p.m." 前面，真实时间却相反。</text>

  <!-- 三个关键值 -->
  <rect x="60" y="304" width="200" height="60" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="160" y="326" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">12:00 a.m. → 0</text>
  <text x="160" y="348" text-anchor="middle" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">午夜，属于"新的一天"</text>

  <rect x="280" y="304" width="200" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="380" y="326" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">12:00 p.m. → 720</text>
  <text x="380" y="348" text-anchor="middle" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">正午，一天的中段</text>

  <rect x="500" y="304" width="200" height="60" rx="8" fill="#fdeef0" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="600" y="326" text-anchor="middle" font-size="12" fill="#8c3b37" filter="url(#rough2)">11:59 p.m. → 1439</text>
  <text x="600" y="348" text-anchor="middle" font-size="10.5" fill="#8c3b37" filter="url(#rough2)">一天里最后一分钟</text>

  <text x="60" y="392" font-size="11" fill="#666" filter="url(#rough2)">换算后，24 小时制分钟数在 [0, 1439] 上严格保序：同一天内 t 越大，真实时刻越晚。</text>
</svg>
