<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="340" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3×3 幻方：三行之和 = 总和 + 对角线和</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">记已知六个数之和为 K，则 3S = S + K → S = K/2，再逐行反解对角元</text>
  <g filter="url(#rough2)"><rect x="200" y="100" width="90" height="54" rx="4" fill="#f6d9d7" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="245.0" y="132.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">?</text>
  <g filter="url(#rough2)"><rect x="310" y="100" width="90" height="54" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="355.0" y="132.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">a</text>
  <g filter="url(#rough2)"><rect x="420" y="100" width="90" height="54" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="465.0" y="132.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">a</text>
  <g filter="url(#rough2)"><rect x="200" y="170" width="90" height="54" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="245.0" y="202.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">a</text>
  <g filter="url(#rough2)"><rect x="310" y="170" width="90" height="54" rx="4" fill="#f6d9d7" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="355.0" y="202.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">?</text>
  <g filter="url(#rough2)"><rect x="420" y="170" width="90" height="54" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="465.0" y="202.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">a</text>
  <g filter="url(#rough2)"><rect x="200" y="240" width="90" height="54" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="245.0" y="272.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">a</text>
  <g filter="url(#rough2)"><rect x="310" y="240" width="90" height="54" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="355.0" y="272.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">a</text>
  <g filter="url(#rough2)"><rect x="420" y="240" width="90" height="54" rx="4" fill="#f6d9d7" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="465.0" y="272.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">?</text>
  <text x="560" y="130" text-anchor="start" font-size="14" fill="#2b2b2b" filter="url(#rough2)">S = K / 2</text>
  <text x="560" y="160" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">x = S - a12 - a13</text>
  <text x="560" y="186" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">y = S - a21 - a23</text>
  <text x="560" y="212" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">z = S - a31 - a32</text>
  <text x="440" y="300" text-anchor="middle" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">三行之和相加时，对角元各被算两次 → 恰好抵消掉未知量</text>
</svg>
