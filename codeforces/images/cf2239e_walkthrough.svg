<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="720" height="440" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">样例 1 逐层演算：val = (10, 20, 5)，边 (1,2) w=5 low=2，(2,3) w=4 low=3</text>

  <!-- 表头 -->
  <rect x="24" y="46" width="672" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="68" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">层 c</text>
  <text x="240" y="68" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">F_c 的连通块</text>
  <text x="530" y="68" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">本层动作</text>

  <!-- 行 1 -->
  <rect x="24" y="84" width="672" height="52" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="60" y="115" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="240" y="115" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{1,2} ｜ {3}</text>
  <text x="356" y="115" font-size="12" fill="#4a7a3a" filter="url(#rough2)">w=5 的边 (1,2) → 候选 5+20 = 25 给 {1,2}</text>

  <!-- 行 2 -->
  <rect x="24" y="140" width="672" height="52" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="60" y="171" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="240" y="171" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{1,2,3}</text>
  <text x="356" y="171" font-size="12" fill="#4a7a3a" filter="url(#rough2)">w=4 的边 (2,3) → 候选 4+20 = 24 给 {1,2,3}</text>

  <!-- 行 3 -->
  <rect x="24" y="196" width="672" height="52" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="60" y="227" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="240" y="227" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{1,2,3}</text>
  <text x="356" y="227" font-size="12" fill="#8a6d3b" filter="url(#rough2)">low=3 的边 (2,3) → W=20 写进虚拟节点</text>

  <!-- 行 4 -->
  <rect x="24" y="252" width="672" height="52" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="60" y="283" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="240" y="283" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{1,2} ｜ {3}</text>
  <text x="356" y="283" font-size="12" fill="#8a6d3b" filter="url(#rough2)">low=2 的边 (1,2) → W=20；本层无候选</text>

  <!-- 结果 -->
  <rect x="24" y="316" width="672" height="60" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="44" y="342" font-size="13" fill="#333" filter="url(#rough2)">标记下推后：点 1、2 拿到 25（来自层 5 的块），点 3 只拿到 24（来自层 4 的块）</text>
  <text x="44" y="364" font-size="14" fill="#b85450" filter="url(#rough2)">答案 = 25 25 24 —— 与官方输出一致；点 3 的层 5 块是 {3}，没有 w=5 的边可以认证。</text>

  <rect x="24" y="388" width="672" height="40" rx="8" fill="#fafafa" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="44" y="414" font-size="12" fill="#446688" filter="url(#rough2)">注意层 4 时点 3 已与 {1,2} 连通（(2,3) 的 low=3 ≤ 4），所以它能拿到 4+20=24。</text>
</svg>
