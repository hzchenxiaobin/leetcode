  <text x="673" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">必须查</text>
  <text x="673" y="196" text-anchor="middle" font-size="18" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
