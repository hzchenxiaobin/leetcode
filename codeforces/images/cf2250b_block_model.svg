<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" width="780" height="440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="780" height="440" fill="#fafafa"/>

  <text x="390" y="32" text-anchor="middle" font-size="17" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">按“极长同字符段”切分：段数 b 与 k 一一对应</text>
  <text x="390" y="56" text-anchor="middle" font-size="12" fill="#66788c" filter="url(#rough2)">把 s 切成 b 段交替的 0/1 块，则相邻不等对恰为 b − 1 个</text>

  <text x="58" y="112" font-size="12" fill="#66788c" filter="url(#rough2)">例：n = 7，k = 4，b = 3</text>

  <rect x="92" y="126" width="40" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="136" y="126" width="40" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="180" y="126" width="40" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="224" y="126" width="40" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="268" y="126" width="40" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="312" y="126" width="40" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="356" y="126" width="40" height="40" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>

  <text x="112" y="153" text-anchor="middle" font-size="15" fill="#33506b" filter="url(#rough2)">0</text>
  <text x="156" y="153" text-anchor="middle" font-size="15" fill="#33506b" filter="url(#rough2)">0</text>
  <text x="200" y="153" text-anchor="middle" font-size="15" fill="#33506b" filter="url(#rough2)">0</text>
  <text x="244" y="153" text-anchor="middle" font-size="15" fill="#37662c" filter="url(#rough2)">1</text>
  <text x="288" y="153" text-anchor="middle" font-size="15" fill="#37662c" filter="url(#rough2)">1</text>
  <text x="332" y="153" text-anchor="middle" font-size="15" fill="#37662c" filter="url(#rough2)">1</text>
  <text x="376" y="153" text-anchor="middle" font-size="15" fill="#8a6320" filter="url(#rough2)">0</text>

  <path d="M 92 176 L 92 186 L 220 186 L 220 176" fill="none" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 224 176 L 224 186 L 352 186 L 352 176" fill="none" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 356 176 L 356 186 L 396 186 L 396 176" fill="none" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>

  <text x="156" y="206" text-anchor="middle" font-size="11.5" fill="#33506b" filter="url(#rough2)">第 1 段：0 × 3</text>
  <text x="288" y="206" text-anchor="middle" font-size="11.5" fill="#37662c" filter="url(#rough2)">第 2 段：1 × 3</text>
  <text x="376" y="206" text-anchor="middle" font-size="11.5" fill="#8a6320" filter="url(#rough2)">第 3 段</text>

  <path d="M 402 145 L 458 145" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="470" y="142" font-size="11.5" fill="#33506b" filter="url(#rough2)">k = (n−1) − (b−1) = n − b</text>
  <text x="470" y="164" font-size="11.5" fill="#33506b" filter="url(#rough2)">⇔ b = n − k，两者双射</text>

  <rect x="56" y="234" width="330" height="98" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="221" y="258" text-anchor="middle" font-size="12.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">段数分配（首段是 0 时）</text>
  <text x="221" y="282" text-anchor="middle" font-size="12.5" fill="#33506b" filter="url(#rough2)">0 段数 A = ⌈b/2⌉，1 段数 B = ⌊b/2⌋</text>
  <text x="221" y="306" text-anchor="middle" font-size="12.5" fill="#33506b" filter="url(#rough2)">每段长度 ≥ 1，总长恰为 n</text>
  <text x="221" y="324" text-anchor="middle" font-size="11" fill="#66788c" filter="url(#rough2)">A + B = b，A − B = b mod 2</text>

  <rect x="410" y="234" width="330" height="98" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="575" y="258" text-anchor="middle" font-size="12.5" fill="#37662c" font-weight="bold" filter="url(#rough2)">字符数被平衡条件钉死</text>
  <text x="575" y="282" text-anchor="middle" font-size="12.5" fill="#37662c" filter="url(#rough2)">0 的个数 = ⌈n/2⌉，1 的个数 = ⌊n/2⌋</text>
  <text x="575" y="306" text-anchor="middle" font-size="12.5" fill="#37662c" filter="url(#rough2)">A 段分到 ⌈n/2⌉ 个 0，B 段分到 ⌊n/2⌋ 个 1</text>
  <text x="575" y="324" text-anchor="middle" font-size="11" fill="#66788c" filter="url(#rough2)">多出来的字符全部塞进各自的第一段</text>

  <rect x="150" y="356" width="480" height="56" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="390" y="380" text-anchor="middle" font-size="13" fill="#a14340" font-weight="bold" filter="url(#rough2)">可行 ⟺ b ≥ 2 ⟺ k ≤ n − 2</text>
  <text x="390" y="400" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">b = 1 时整串只有一种字符，|#0 − #1| = n &gt; 1，必无解</text>
</svg>
