<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="720" height="300" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">坐标压缩：只保留「路径出现过的坐标」和它们之间的间隙段</text>
  <rect x="50" y="60" width="120" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="110" y="86" text-anchor="middle" font-size="11.5" fill="#2f4a66">x=-3</text>
  <rect x="180" y="60" width="120" height="44" rx="8" fill="#f2f2f2" stroke="#888888" stroke-width="1.5"/>
  <text x="240" y="86" text-anchor="middle" font-size="11.5" fill="#555555">间隙 -2</text>
  <rect x="310" y="60" width="120" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="370" y="86" text-anchor="middle" font-size="11.5" fill="#2f4a66">x=-1</text>
  <rect x="440" y="60" width="120" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="500" y="86" text-anchor="middle" font-size="11.5" fill="#2f4a66">x=0</text>
  <rect x="570" y="60" width="110" height="44" rx="8" fill="#f2f2f2" stroke="#888888" stroke-width="1.5"/>
  <text x="625" y="86" text-anchor="middle" font-size="11.5" fill="#555555">间隙 1..7</text>
  <text x="50" y="130" text-anchor="start" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">每个压缩格带一个「宽度 w」：坐标段 w=1，间隙段 w = 坐标差−1</text>
  <rect x="50" y="160" width="640" height="50" rx="8" fill="#fde9d9" stroke="#b4652a" stroke-width="1.5"/>
  <text x="370" y="189" text-anchor="middle" font-size="11.5" fill="#7a4b22">水平移动会喷满整行 ⇒ 与 [lo,hi] 完全包含的压缩列/行整段标记为「已喷」</text>
  <text x="50" y="244" text-anchor="start" font-size="11.5" fill="#2f5223" filter="url(#rough2)">被喷的格子贡献 w_x·w_y；没被喷、又 BFS 不到（从外侧哨兵出发）的格子也计入答案</text>
  <text x="50" y="270" text-anchor="start" font-size="11.5" fill="#7a4b22" filter="url(#rough2)">样例 1：37 个被喷 + 64 个被围 = 101 ✓</text>
</svg>
