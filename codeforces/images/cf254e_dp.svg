<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="340" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按天倒推 DP：状态只有"进这一天的旧食物量"</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">carry ≤ 400（等于前一天的 a），每天枚举"喂几个朋友"的前缀数</text>
  <text x="140" y="100" text-anchor="end" font-size="12.5" fill="#555555" filter="url(#rough2)">天</text>
  <g filter="url(#rough2)"><rect x="150" y="84" width="140" height="50" rx="4" fill="#d7ecd0" fill-opacity="0.7" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="220" y="114" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">第 1 天</text>
  <text x="220" y="150" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">carry ∈ [0,400]</text>
  <line x1="292" y1="110" x2="318" y2="110" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="320" y="84" width="140" height="50" rx="4" fill="#d7ecd0" fill-opacity="0.7" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="390" y="114" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">第 2 天</text>
  <text x="390" y="150" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">carry ∈ [0,400]</text>
  <line x1="462" y1="110" x2="488" y2="110" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="490" y="84" width="140" height="50" rx="4" fill="#d7ecd0" fill-opacity="0.7" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="560" y="114" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">第 3 天</text>
  <text x="560" y="150" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">carry ∈ [0,400]</text>
  <line x1="632" y1="110" x2="658" y2="110" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="660" y="84" width="140" height="50" rx="4" fill="#d7ecd0" fill-opacity="0.7" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="730" y="114" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">第 4 天</text>
  <text x="730" y="150" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">carry ∈ [0,400]</text>
  <text x="140" y="200" text-anchor="end" font-size="12.5" fill="#555555" filter="url(#rough2)">枚举</text>
  <text x="150" y="200" text-anchor="start" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">t = 0..maxT：t 个最便宜的朋友，花 pre[t] 千克</text>
  <text x="150" y="226" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">carry' = min(a_i, carry + a_i - v - pre[t])</text>
  <text x="150" y="252" text-anchor="start" font-size="12.5" fill="#b05a5a" filter="url(#rough2)">dp[i][carry] = max(t + dp[i+1][carry'])</text>
  <text x="440" y="306" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">状态数 400×401，转移 O(在场人数) → 总计约 6×10^7</text>
</svg>
