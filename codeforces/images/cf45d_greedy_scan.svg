<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="460"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8a2b28"/>
    </marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="380" fill="#fafafa"/>
  <text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">贪心流程：按 r 升序扫描；每个事件占它区间内最靠左的空闲日子</text>
  <path d="M 60 38 Q 380 46 700 38" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <rect x="30" y="60" width="270" height="120" rx="10" fill="#cfe0f5" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="44" y="84" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">第 1 步：按 r 升序排序</text>
  <text x="44" y="106" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">[1,3] r=3　→ 第 1 个</text>
  <text x="44" y="126" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">[3,5] r=5　→ 第 2 个</text>
  <text x="44" y="146" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">[2,6] r=6　→ 第 3 个</text>
  <text x="44" y="166" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">[7,9] r=9　→ 第 4 个</text>

  <rect x="30" y="196" width="270" height="90" rx="10" fill="#fbe3c8" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="44" y="220" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">第 2 步：为当前事件找日子</text>
  <text x="44" y="242" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">d = l；while (d 已被占用) d++；</text>
  <text x="44" y="262" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">占用 d 并记录为答案。</text>
  <text x="44" y="281" font-size="10" fill="#8a2b28" filter="url(#rough2)">已用日子 ≤ n−1 个，所以最多往右扫 n 步。</text>

  <g font-size="10">
    <rect x="330" y="60" width="50" height="34" rx="6" fill="#f6d5d5" stroke="#8a2b28" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="355" y="81" text-anchor="middle" fill="#8a2b28" filter="url(#rough2)">1 用</text>
    <rect x="386" y="60" width="50" height="34" rx="6" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="411" y="81" text-anchor="middle" fill="#555555" filter="url(#rough2)">2 空</text>
    <rect x="442" y="60" width="50" height="34" rx="6" fill="#f6d5d5" stroke="#8a2b28" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="467" y="81" text-anchor="middle" fill="#8a2b28" filter="url(#rough2)">3 用</text>
    <rect x="498" y="60" width="50" height="34" rx="6" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="523" y="81" text-anchor="middle" fill="#555555" filter="url(#rough2)">4 空</text>
    <rect x="554" y="60" width="50" height="34" rx="6" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="579" y="81" text-anchor="middle" fill="#555555" filter="url(#rough2)">5 空</text>
    <rect x="610" y="60" width="50" height="34" rx="6" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="635" y="81" text-anchor="middle" fill="#555555" filter="url(#rough2)">6 空</text>
    <rect x="666" y="60" width="50" height="34" rx="6" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="691" y="81" text-anchor="middle" fill="#555555" filter="url(#rough2)">7 空</text>
  </g>
  <text x="330" y="116" font-size="10" fill="#555555" filter="url(#rough2)">例：处理 [2,6]，l = 2；2 空 → 直接选 2。</text>

  <path d="M 330 150 L 700 150" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <g font-size="10">
    <rect x="330" y="170" width="50" height="34" rx="6" fill="#f6d5d5" stroke="#8a2b28" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="355" y="191" text-anchor="middle" fill="#8a2b28" filter="url(#rough2)">1 用</text>
    <rect x="386" y="170" width="50" height="34" rx="6" fill="#f6d5d5" stroke="#8a2b28" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="411" y="191" text-anchor="middle" fill="#8a2b28" filter="url(#rough2)">2 用</text>
    <rect x="442" y="170" width="50" height="34" rx="6" fill="#f6d5d5" stroke="#8a2b28" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="467" y="191" text-anchor="middle" fill="#8a2b28" filter="url(#rough2)">3 用</text>
    <rect x="498" y="170" width="50" height="34" rx="6" fill="#d9ecd4" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="523" y="191" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">4 空←</text>
    <rect x="554" y="170" width="50" height="34" rx="6" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="579" y="191" text-anchor="middle" fill="#555555" filter="url(#rough2)">5 空</text>
    <rect x="610" y="170" width="50" height="34" rx="6" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="635" y="191" text-anchor="middle" fill="#555555" filter="url(#rough2)">6 空</text>
    <rect x="666" y="170" width="50" height="34" rx="6" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="691" y="191" text-anchor="middle" fill="#555555" filter="url(#rough2)">7 空</text>
  </g>
  <text x="330" y="226" font-size="10" fill="#555555" filter="url(#rough2)">例：再处理 [3,5]，l = 3；3 被占 → 跳到 4，4 空 → 选 4。</text>
  <path d="M 455 240 Q 500 250 512 206" fill="none" stroke="#8a2b28" stroke-width="1.6"
        marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="330" y="262" font-size="10" fill="#8a2b28" filter="url(#rough2)">注：这个例子只为演示"向右扫描"，真实答案由程序按输入顺序输出。</text>

  <rect x="330" y="286" width="386" height="76" rx="10" fill="#d9ecd4" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="344" y="308" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">为什么按 r 排序是对的（直觉）</text>
  <text x="344" y="329" font-size="10.4" fill="#2b2b2b" filter="url(#rough2)">截止最早的事件最"急"：把它放在最靠左的空位，</text>
  <text x="344" y="347" font-size="10.4" fill="#2b2b2b" filter="url(#rough2)">不会挤占后面事件更宽裕的区间——交换论证见证明部分。</text>
</svg>
