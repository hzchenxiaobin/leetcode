<svg xmlns="http://www.w3.org/2000/svg" width="780" height="380" viewBox="0 0 780 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="229"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="780" height="380" fill="#fafafa"/>
  <text x="390" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每个变量拆成 x 与 ¬x：冲突对加 4 条蕴含边</text>
  <path d="M 120 40 Q 390 46 660 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <circle cx="120" cy="200" r="38" fill="#cfe0f5" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="206" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">x1</text>
  <circle cx="120" cy="320" r="38" fill="#fbe3c8" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="326" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">¬x1</text>
  <circle cx="420" cy="200" r="38" fill="#cfe0f5" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="420" y="206" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">x2</text>
  <circle cx="420" cy="320" r="38" fill="#fbe3c8" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="420" y="326" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">¬x2</text>
  <path d="M 158 200 C 250 200, 290 320, 378 320" fill="none" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)" marker-end="url(#arrr)"/>
  <path d="M 458 320 C 250 320, 290 200, 78 200" fill="none" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)" marker-end="url(#arrr)"/>
  <path d="M 458 200 C 250 200, 290 320, 78 320" fill="none" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)" marker-end="url(#arrr)"/>
  <path d="M 158 320 C 250 320, 290 200, 378 200" fill="none" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)" marker-end="url(#arrr)"/>
  <text x="600" y="200" font-size="12" fill="#2b2b2b" filter="url(#rough2)">x1 ≠ x2  ⇔</text>
  <text x="600" y="228" font-size="12" fill="#8a2b28" filter="url(#rough2)">(¬x1∨¬x2) ∧ (x1∨x2)</text>
  <text x="600" y="270" font-size="11" fill="#555555" filter="url(#rough2)">SCC 里 x 与 ¬x 同块</text>
  <text x="600" y="292" font-size="11" fill="#555555" filter="url(#rough2)">⇒ Impossible</text>

</svg>
