  <text x="633" y="322" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#777" filter="url(#rough2)">11</text>
  <rect x="664" y="272" width="46" height="38" fill="#f3e8fb" stroke="#7a4a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="687" y="296" text-anchor="middle" font-size="10" font-weight="normal" fill="#2b2b2b" filter="url(#rough2)">S/S</text>
  <text x="687" y="322" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#777" filter="url(#rough2)">12</text>
  <path d="M 394 264 L 394 250 M 70 250 L 394 250" stroke="#7a4a9a" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="232" y="244" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#7a4a9a" filter="url(#rough2)">前 6 局</text>
  <text x="556" y="244" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#7a4a9a" filter="url(#rough2)">后 6 局重复</text>
  <rect x="70" y="344" width="600" height="44" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="84" y="364" text-anchor="start" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">lcm(3,4) = 12：一个周期内的红点数 × (n / 12)，再加上 n mod 12 局的余量。</text>
  <text x="84" y="382" text-anchor="start" font-size="11" font-weight="normal" fill="#7a5a1b" filter="url(#rough2)">样例 1 的 n = 7 &lt; 12，所以整段都在余量里，不能直接乘。</text>
