  <rect x="132" y="176" width="52" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="158" y="203" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5223" filter="url(#rough2)">S</text>
  <rect x="194" y="176" width="52" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220" y="203" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5223" filter="url(#rough2)">P</text>
  <rect x="256" y="176" width="52" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
