<svg xmlns="http://www.w3.org/2000/svg" width="780" height="380" viewBox="0 0 780 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="780" height="380" fill="#fafafa"/>

  <text x="390" y="28" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">走查：P_min 与 32 的倍数各算一次代价，取小者再减 n</text>
  <path d="M 40 40 Q 390 47 740 40" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <rect x="30" y="56" width="720" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="63" y="81" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">n</text>
  <text x="144" y="81" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">M=⌊n/2⌋</text>
  <text x="276" y="81" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">P_min（φ）</text>
  <text x="440" y="81" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">2P_min + sumpos</text>
  <text x="595" y="81" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">32 的倍数候选</text>
  <text x="710" y="81" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">f(n)</text>

  <rect x="30" y="98" width="720" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="63" y="124" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">4</text>
  <text x="144" y="124" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">2</text>
  <text x="276" y="124" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">4（3）</text>
  <text x="440" y="124" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">8 + 2 = 10</text>
  <text x="595" y="124" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">32：64 ≥ 10，停</text>
  <text x="710" y="124" text-anchor="middle" font-size="12" font-weight="bold" fill="#a14340" filter="url(#rough2)">6</text>

  <rect x="30" y="142" width="720" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="63" y="168" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">52</text>
  <text x="144" y="168" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">26</text>
  <text x="276" y="168" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">30（4）</text>
  <text x="440" y="168" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">60 + 10 = 70</text>
  <text x="595" y="168" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">32：64+5 = 69 ✓</text>
  <text x="710" y="168" text-anchor="middle" font-size="12" font-weight="bold" fill="#a14340" filter="url(#rough2)">17</text>

  <rect x="30" y="186" width="720" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="63" y="212" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">53</text>
  <text x="144" y="212" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">26</text>
  <text x="276" y="212" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">30（4）</text>
  <text x="440" y="212" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">70</text>
  <text x="595" y="212" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">64：128 ≥ 69，停</text>
  <text x="710" y="212" text-anchor="middle" font-size="12" font-weight="bold" fill="#a14340" filter="url(#rough2)">16</text>

  <rect x="30" y="230" width="720" height="42" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="63" y="256" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">127</text>
  <text x="144" y="256" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">63</text>
  <text x="276" y="256" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">64（1）</text>
  <text x="440" y="256" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">128 + 6 = 134</text>
  <text x="595" y="256" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">64：134 不优，96 停</text>
  <text x="710" y="256" text-anchor="middle" font-size="12" font-weight="bold" fill="#a14340" filter="url(#rough2)">7</text>

  <rect x="30" y="288" width="360" height="76" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="210" y="312" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">sumpos 就是「1 的位置之和」</text>
  <text x="210" y="334" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">30 = 11110₂ ⇒ 1+2+3+4 = 10</text>
  <text x="210" y="354" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">32 = 100000₂ ⇒ 5，64 ⇒ 6</text>

  <rect x="410" y="288" width="340" height="76" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="580" y="312" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">52 这一行是「超过 P_min 也值」的例子</text>
  <text x="580" y="334" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">P_min=30 的 1 太分散（sumpos=10）</text>
  <text x="580" y="354" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">换成更小 sumpos 的 32 反而省 1 次操作</text>
</svg>
