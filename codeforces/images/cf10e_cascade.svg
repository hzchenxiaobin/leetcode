<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c9801f"/>
    </marker>
  </defs>

  <rect width="760" height="440" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="38" text-anchor="middle" font-size="18.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">同一子问题：把“超出量”按面值逐层拆开</text>
  <path d="M 152 50 Q 380 56 608 50" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="82" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">记 b = a_level - 1。要用 a_level 及更小的硬币凑出“超出量 &gt;= need”：</text>
  <rect x="60" y="100" width="300" height="70" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="210" y="126" text-anchor="middle" font-size="14" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">need = q*b + r</text>
  <text x="210" y="150" text-anchor="middle" font-size="11.5" fill="#2f4a66" font-weight="normal" filter="url(#rough2)">（0 &lt;= r &lt; b）</text>
  <path d="M 366 135 L 452 135" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="460" y="96" width="240" height="78" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="580" y="122" text-anchor="middle" font-size="12.5" fill="#2f5223" font-weight="bold" filter="url(#rough2)">① 用 q+1 枚 a_level</text>
  <text x="580" y="146" text-anchor="middle" font-size="11.5" fill="#2f5223" font-weight="normal" filter="url(#rough2)">超出量够了，尾部不用</text>
  <text x="580" y="164" text-anchor="middle" font-size="11.5" fill="#2f5223" font-weight="normal" filter="url(#rough2)">代价 (q+1)*a_level</text>
  <rect x="460" y="192" width="240" height="86" rx="9" fill="#fff3e0" stroke="#c9801f" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="580" y="216" text-anchor="middle" font-size="12.5" fill="#a8641a" font-weight="bold" filter="url(#rough2)">② 用 q 枚 a_level</text>
  <text x="580" y="240" text-anchor="middle" font-size="11.5" fill="#a8641a" font-weight="normal" filter="url(#rough2)">再把 r 交给更小的硬币</text>
  <text x="580" y="258" text-anchor="middle" font-size="11.5" fill="#a8641a" font-weight="normal" filter="url(#rough2)">代价 q*a_level + f(r)</text>
  <rect x="60" y="196" width="380" height="82" rx="9" fill="#fbfbfb" stroke="#2b2b2b" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="74" y="220" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">为什么只有这两种：q+2 枚一定更贵；</text>
  <text x="74" y="242" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">q-1 枚则会让尾部需要 &gt;= b 的超出量，</text>
  <text x="74" y="264" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">把这段折成一枚 a_level 只会更便宜。</text>
  <rect x="60" y="300" width="640" height="108" rx="9" fill="#fdecea" stroke="#b6483f" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="74" y="326" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">但“更少枚数”与“更小代价”并不总是同向：某个更贵的表示可能枚数更少，从而真的打败贪心。</text>
  <text x="74" y="352" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">所以① 里要把所有代价对应的“最小枚数”都保留下来（按代价去重），而不能只留一个最优代价。</text>
  <text x="74" y="378" text-anchor="start" font-size="12" fill="#b6483f" font-weight="bold" filter="url(#rough2)">最后对每个候选代价 T 算一次贪心枚数，若 k &lt; 贪心枚数，就更新答案。</text>
  <text x="60" y="428" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">递归深度 &lt;= n = 400；每层只分支常数次，配合代价上界与枚数上界剪枝。</text>
</svg>
