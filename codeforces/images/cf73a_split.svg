<svg xmlns="http://www.w3.org/2000/svg" width="700" height="380" viewBox="0 0 700 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="67"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ax2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2b2b2b"/>
    </marker>
  </defs>
  <rect width="700" height="380" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">固定总体积后，余下两维的最优切法是“尽量对半分”</text>
  <path d="M 130 40 Q 350 46 570 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <line x1="80" y1="250" x2="620" y2="250" stroke="#2b2b2b" stroke-width="1.6" marker-end="url(#ax2)" filter="url(#rough2)"/>
  <line x1="80" y1="250" x2="80" y2="80" stroke="#2b2b2b" stroke-width="1.6" marker-end="url(#ax2)" filter="url(#rough2)"/>
  <text x="626" y="268" font-size="12" fill="#333" filter="url(#rough2)">q</text>
  <text x="56" y="86" font-size="12" fill="#333" filter="url(#rough2)">f(q)</text>

  <!-- 可行区间 -->
  <rect x="200" y="120" width="260" height="130" fill="#e6f4ea" fill-opacity="0.7" filter="url(#rough2)"/>
  <text x="330" y="112" text-anchor="middle" font-size="11.5" fill="#1f5226" filter="url(#rough2)">q 的可行区间 [max(0,S-Z), min(Y,S)]</text>

  <!-- 抛物线 -->
  <path d="M 90 244 Q 330 60 570 244" stroke="#b85450" stroke-width="2.4" fill="none" filter="url(#rough2)"/>
  <circle cx="330" cy="126" r="5" fill="#8c2f2b" filter="url(#rough2)"/>
  <line x1="330" y1="126" x2="330" y2="250" stroke="#8c2f2b" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <text x="330" y="270" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8c2f2b" filter="url(#rough2)">q = S/2</text>
  <text x="392" y="118" font-size="12" fill="#8c2f2b" filter="url(#rough2)">f(S/2) 是最大值</text>

  <text x="120" y="212" font-size="11.5" fill="#555" filter="url(#rough2)">f(q) = (q+1)(S-q+1)</text>
  <text x="120" y="232" font-size="11.5" fill="#555" filter="url(#rough2)">开口向下 ⇒ 单峰</text>

  <rect x="80" y="296" width="540" height="62" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="96" y="320" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">若 $S/2$ 越界（例如 Y 很小），把 q 夹回区间端点处取最大</text>
  <text x="96" y="344" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">程序只枚举 q ∈ {lo, hi, ⌊S/2⌋, ⌊S/2⌋+1}，四次求值即可</text>
</svg>
