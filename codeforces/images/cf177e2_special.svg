<svg xmlns="http://www.w3.org/2000/svg" width="740" height="350" viewBox="0 0 740 350"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="740" height="350" fill="#fafafa"/>
  <text x="370.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">E2 相对 E1 多出来的两个坑：溢出与无穷解</text>
  <path d="M 177.24000000000007 46 Q 370.0 52 562.76 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="38.0" y="66.0" width="330.0" height="250.0" rx="10" fill="#eef3fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="56.0" y="92.0" text-anchor="start" font-size="13.5" font-weight="bold" fill="#446688" filter="url(#rough2)">① 乘法溢出</text>
  <text x="56.0" y="122.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">a_i ≤ 10^9，x 可达 10^18</text>
  <text x="56.0" y="144.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">a_i·x ≤ 10^27，long long 装不下</text>
  <rect x="56.0" y="158.0" width="294.0" height="64.0" rx="7" fill="#fffdf5" stroke="#c9c9c9" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="66.0" y="180.0" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">__int128 cur = (__int128)a[i] * x;</text>
  <text x="66.0" y="200.0" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">total += cur / b[i];</text>
  <text x="66.0" y="216.0" text-anchor="start" font-size="9.8" fill="#33506e" filter="url(#rough2)">if (total &gt; c) return c + 1;   // 提前截断</text>
  <text x="56.0" y="248.0" text-anchor="start" font-size="11.2" fill="#2b2b2b" filter="url(#rough2)">截断后累加最多到 c+1 ≤ 10^9+1，</text>
  <text x="56.0" y="268.0" text-anchor="start" font-size="11.2" fill="#2b2b2b" filter="url(#rough2)">既防溢出又不影响与 c 的比较</text>
  <text x="56.0" y="296.0" text-anchor="start" font-size="10.6" fill="#6b6b6b" filter="url(#rough2)">上限：某 a_i ≥ 1 ⇒ x ≤ c·b_max ≤ 10^18</text>
  <rect x="388.0" y="66.0" width="316.0" height="250.0" rx="10" fill="#fdf0ef" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="406.0" y="92.0" text-anchor="start" font-size="13.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">② 无穷多个 x</text>
  <text x="406.0" y="122.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">E2 允许 a_i = 0：这个星球</text>
  <text x="406.0" y="142.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">不论 x 多大都只待 1 天。</text>
  <text x="406.0" y="170.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">若所有 a_i = 0，则</text>
  <rect x="406.0" y="182.0" width="276.0" height="34.0" rx="7" fill="#fffdf5" stroke="#c9c9c9" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="420.0" y="204.0" text-anchor="start" font-size="12" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">D(x) ≡ n（常数函数）</text>
  <text x="406.0" y="242.0" text-anchor="start" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">c = n → 答案 -1；否则 0</text>
  <text x="406.0" y="272.0" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">只要有一个 a_i &gt; 0，D 就无界，</text>
  <text x="406.0" y="292.0" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">解集是有限区间，不会输出 -1</text>
</svg>
