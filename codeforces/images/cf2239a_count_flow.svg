<svg xmlns="http://www.w3.org/2000/svg" width="720" height="496" viewBox="0 0 720 496"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="496" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每组 O(n)：算一次异或和，再数合格的 k</text>
  <path d="M 190 43 Q 360 50 530 43" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <rect x="252" y="52" width="216" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="78" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">读入 n 与 a₁ … aₙ</text>

  <path d="M 360 94 L 360 114" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="196" y="118" width="328" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="139" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">S ← a₁ ⊕ a₂ ⊕ … ⊕ aₙ</text>
  <text x="360" y="158" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">pos ← 正数（a_i ＞ 0）的个数</text>

  <path d="M 360 166 L 360 184" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="360,186 428,214 360,242 292,214" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="360" y="219" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">pos ≤ 1 ?</text>

  <path d="M 292 214 L 170 214 L 170 266" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="232" y="205" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">是</text>

  <rect x="60" y="270" width="220" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="170" y="298" text-anchor="middle" font-size="13" font-weight="bold" fill="#a14340" filter="url(#rough2)">输出 0</text>
  <text x="170" y="338" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#rough2)">（n = 1 时只能走到这里）</text>

  <path d="M 360 242 L 360 262" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="374" y="258" font-size="11.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">否</text>

  <polygon points="360,264 428,292 360,320 292,292" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="360" y="297" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">S = 0 ?</text>

  <path d="M 428 292 L 468 292" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="446" y="283" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">是</text>

  <rect x="470" y="268" width="200" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="570" y="298" text-anchor="middle" font-size="13" font-weight="bold" fill="#a14340" filter="url(#rough2)">输出 1</text>
  <text x="570" y="338" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#rough2)">（b = a 一种走法）</text>

  <path d="M 360 320 L 360 342" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="374" y="336" font-size="11.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">否</text>

  <rect x="196" y="346" width="328" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="368" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">cnt ← 满足 (S ⊕ a_k) ≤ a_k 的 k 的个数</text>
  <text x="360" y="387" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">（每个 k 唯一确定一个 b，互不重复）</text>

  <path d="M 360 398 L 360 418" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="228" y="422" width="264" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="360" y="448" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">输出 cnt mod 998244353</text>

  <text x="360" y="484" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">三个分支互斥；只有一条位运算判据，无需排序、二分或枚举 b</text>
</svg>
