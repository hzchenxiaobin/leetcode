<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3.4" orient="auto">
      <path d="M0,0 L7,3.4 L0,6.8 Z" fill="#446688"/>
    </marker>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="7" refY="3.4" orient="auto">
      <path d="M0,0 L7,3.4 L0,6.8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="860" height="470" fill="#fafafa" filter="url(#rough2)"/>

  <text x="430" y="32" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">权值分类：cnt_b 相同的两个位可以互换（引理 2）</text>

  <!-- 左：公式 + n=14 例子 -->
  <rect x="34" y="52" width="396" height="290" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="78" font-size="13" fill="#446688" filter="url(#rough2)">第 b 位的目标 1 个数：</text>
  <text x="52" y="104" font-size="12.5" fill="#333" filter="url(#rough2)">cnt_b = ⌊n / 2^(b+1)⌋ · 2^b</text>
  <text x="52" y="126" font-size="12.5" fill="#333" filter="url(#rough2)">　　　+ max(0, (n mod 2^(b+1)) − 2^b + 1)</text>

  <text x="52" y="158" font-size="13" fill="#333" filter="url(#rough2)">例：n = 14，K = 4 ⇒ cnt = (7, 7, 7, 7)</text>
  <text x="52" y="182" font-size="13" fill="#333" filter="url(#rough2)">全部 4 个位落进同一个权值类，可以任意互换。</text>

  <text x="52" y="212" font-size="12.5" fill="#b85450" filter="url(#rough2)">交换第 0 位与第 3 位（D = 2^3 − 2^0 = 7）：</text>
  <rect x="56" y="224" width="44" height="26" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="78" y="242" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">1</text>
  <path d="M104,237 L128,237" stroke="#b85450" stroke-width="1.4" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <rect x="132" y="224" width="44" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="154" y="242" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">8</text>

  <rect x="196" y="224" width="44" height="26" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="218" y="242" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">3</text>
  <path d="M244,237 L268,237" stroke="#b85450" stroke-width="1.4" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <rect x="272" y="224" width="44" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="294" y="242" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">10</text>

  <rect x="56" y="258" width="44" height="26" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="78" y="276" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">5</text>
  <path d="M104,271 L128,271" stroke="#b85450" stroke-width="1.4" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <rect x="132" y="258" width="44" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="154" y="276" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">12</text>

  <rect x="196" y="258" width="44" height="26" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="218" y="276" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">7</text>
  <path d="M244,271 L268,271" stroke="#b85450" stroke-width="1.4" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <rect x="272" y="258" width="44" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="294" y="276" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">14</text>

  <text x="52" y="312" font-size="12.5" fill="#555" filter="url(#rough2)">其余 0,2,4,6,9,11,13 不动。</text>
  <text x="52" y="332" font-size="12.5" fill="#555" filter="url(#rough2)">交换后每个值仍在 [1,14] 内且互不重复。</text>

  <!-- 右：分桶 -->
  <rect x="452" y="52" width="376" height="302" rx="10" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470" y="78" font-size="13" fill="#4a7a3a" filter="url(#rough2)">把位按 cnt 值分桶，串按 Hamming 权值分桶：</text>

  <text x="470" y="100" font-size="12.5" fill="#555" filter="url(#rough2)">再以 n = 9（K = 4，cnt = (5,4,4,2)）为例：</text>
  <rect x="470" y="108" width="340" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="482" y="130" font-size="12.5" fill="#446688" filter="url(#rough2)">桶 w = 5：位 {0}，串 1 个 ⇒ 1! = 1 种配对</text>
  <text x="482" y="154" font-size="12.5" fill="#446688" filter="url(#rough2)">桶 w = 2：位 {3}，串 1 个 ⇒ 1! = 1 种配对</text>

  <rect x="470" y="174" width="340" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="482" y="196" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">桶 w = 4：位 {1,2}，串 2 个 ⇒ 2! = 2 种配对</text>
  <text x="482" y="220" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">若行校验通过，答案就是 2；重复串则再除以 c_t!</text>

  <rect x="470" y="240" width="340" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="482" y="262" font-size="12.5" fill="#8a6a20" filter="url(#rough2)">多重集不等（某权值没有对应串） ⇒ 输出 0</text>
  <text x="482" y="286" font-size="12.5" fill="#8a6a20" filter="url(#rough2)">例：need=(3,2,1) 而串权值只有 {3,2,3} 时无解</text>
  <text x="470" y="324" font-size="12.5" fill="#555" filter="url(#rough2)">总标注数 = ∏_w m_w! / ∏_t c_t!（c_t 为串 t 的重数）</text>
  <text x="470" y="344" font-size="12" fill="#777" filter="url(#rough2)">m_w = 权值为 w 的位数，必须等于权值为 w 的串数</text>

  <!-- 底部结论 -->
  <rect x="34" y="364" width="794" height="82" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="52" y="392" font-size="14.5" fill="#8a2f2a" filter="url(#rough2)">重要推论：同权值交换只是把每一行做一次“位交换” ψ，而引理 2 说明 ψ 是 [1,n] 到自身的双射，</text>
  <text x="52" y="418" font-size="14.5" fill="#8a2f2a" filter="url(#rough2)">所以“合法”这件事对整个权值桶要么全成立、要么全不成立 ⇒ 只需校验任意一种配对即可。</text>
  <text x="52" y="440" font-size="13" fill="#666" filter="url(#rough2)">于是答案为 0 或 ∏_w m_w! / ∏_t c_t!，一次 O(nK) 校验就能定论。</text>
</svg>
