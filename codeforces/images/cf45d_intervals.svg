<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="459"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="330" fill="#fafafa"/>
  <text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每个事件是一个区间，要给它选一个互不重复的日子</text>
  <path d="M 60 38 Q 380 46 700 38" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <g font-size="10">
    <text x="40" y="80" fill="#2b2b2b" filter="url(#rough2)">事件 1</text>
    <text x="40" y="128" fill="#2b2b2b" filter="url(#rough2)">事件 2</text>
    <text x="40" y="176" fill="#2b2b2b" filter="url(#rough2)">事件 3</text>
    <text x="40" y="224" fill="#2b2b2b" filter="url(#rough2)">事件 4</text>
  </g>

  <line x1="120" y1="250" x2="720" y2="250" stroke="#555555" stroke-width="1.3" filter="url(#rough2)"/>
  <g font-size="9" fill="#555555">
    <text x="120" y="266" text-anchor="middle" filter="url(#rough2)">1</text>
    <text x="180" y="266" text-anchor="middle" filter="url(#rough2)">2</text>
    <text x="240" y="266" text-anchor="middle" filter="url(#rough2)">3</text>
    <text x="300" y="266" text-anchor="middle" filter="url(#rough2)">4</text>
    <text x="360" y="266" text-anchor="middle" filter="url(#rough2)">5</text>
    <text x="420" y="266" text-anchor="middle" filter="url(#rough2)">6</text>
    <text x="480" y="266" text-anchor="middle" filter="url(#rough2)">7</text>
    <text x="540" y="266" text-anchor="middle" filter="url(#rough2)">8</text>
    <text x="600" y="266" text-anchor="middle" filter="url(#rough2)">9</text>
    <text x="660" y="266" text-anchor="middle" filter="url(#rough2)">10</text>
  </g>

  <rect x="120" y="66" width="120" height="20" rx="6" fill="#cfe0f5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="128" y="60" font-size="9" fill="#446688" filter="url(#rough2)">[1, 3]</text>
  <rect x="240" y="114" width="120" height="20" rx="6" fill="#d9ecd4" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="248" y="108" font-size="9" fill="#446688" filter="url(#rough2)">[3, 5]</text>
  <rect x="180" y="162" width="180" height="20" rx="6" fill="#fbe3c8" stroke="#8a2b28" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="188" y="156" font-size="9" fill="#8a2b28" filter="url(#rough2)">[2, 6]</text>
  <rect x="420" y="210" width="120" height="20" rx="6" fill="#f6d5d5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="428" y="204" font-size="9" fill="#446688" filter="url(#rough2)">[7, 9]</text>

  <circle cx="120" cy="76" r="5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="300" cy="124" r="5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="240" cy="172" r="5" fill="#8a2b28" filter="url(#rough2)"/>
  <circle cx="420" cy="220" r="5" fill="#446688" filter="url(#rough2)"/>
  <text x="640" y="80" font-size="10.5" fill="#8a2b28" filter="url(#rough2)">圆点 = 选中的日子</text>
  <text x="640" y="98" font-size="10" fill="#555555" filter="url(#rough2)">（这里 [1,3] 选 1、</text>
  <text x="640" y="112" font-size="10" fill="#555555" filter="url(#rough2)">[3,5] 选 3、[2,6] 选 2…）</text>

  <text x="40" y="300" font-size="11" fill="#555555" filter="url(#rough2)">关键：按"最晚可接受日期 r 从小到大"处理，每个事件都放到它区间内最靠左的空闲日子。</text>
</svg>
