<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="61"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="760" height="420" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">把「第几个」换算成公式：ρk 只依赖 k²δ²</text>
  <path d="M 152 39 Q 380 45 608 39" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="30" y="52" width="700" height="54" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="44" y="76" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">反演图上第 k 个绿色离 Guadeloupe 的距离 = k·2K</text>
  <text x="44" y="98" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">⇒ 参数 z_k = k·δ，其中 δ = (R − r)/√(Rr)</text>
  <rect x="30" y="116" width="700" height="54" rx="8" fill="#e9f4ec" stroke="#3f6b4a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="44" y="140" text-anchor="start" font-size="12.5" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">反演回去：半径 ρ(z) = (R − r)/(1 + z²)</text>
  <text x="44" y="162" text-anchor="start" font-size="12" fill="#2f5223" filter="url(#rough2)">（z 越大，圆越靠近切点，半径越小）</text>
  <rect x="30" y="180" width="700" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="44" y="206" text-anchor="start" font-size="15" font-weight="bold" fill="#8a6015" filter="url(#rough2)">ρk = (R − r) / (1 + k²·(R − r)²/(Rr))</text>
  <text x="44" y="228" text-anchor="start" font-size="12" fill="#7a5a1b" filter="url(#rough2)">等价写法：ρk = (R − r)·R·r / (R·r + k²(R − r)²)</text>
  <rect x="30" y="252" width="240" height="44" rx="8" fill="#f3e9f7" stroke="#7a4a86" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="150" y="280" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a4a86" filter="url(#rough2)">(R, r) = (4, 3)</text>
  <text x="330" y="280" text-anchor="start" font-size="12.5" fill="#5b5b5b" filter="url(#rough2)">k = 1</text>
  <rect x="400" y="252" width="330" height="44" rx="8" fill="#ffffff" stroke="#7a4a86" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="416" y="280" text-anchor="start" font-size="13" font-weight="bold" fill="#7a4a86" filter="url(#rough2)">12/13 ≈ 0.9230769231</text>
  <rect x="30" y="304" width="240" height="44" rx="8" fill="#f3e9f7" stroke="#7a4a86" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="150" y="332" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a4a86" filter="url(#rough2)">(R, r) = (4, 2)</text>
  <text x="330" y="332" text-anchor="start" font-size="12.5" fill="#5b5b5b" filter="url(#rough2)">k = 2</text>
  <rect x="400" y="304" width="330" height="44" rx="8" fill="#ffffff" stroke="#7a4a86" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="416" y="332" text-anchor="start" font-size="13" font-weight="bold" fill="#7a4a86" filter="url(#rough2)">2/3 ≈ 0.6666666667</text>
  <text x="30" y="372" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">两组数字正好是题面给出的两个样例输出（12/13 与 2/3）</text>
  <text x="30" y="396" text-anchor="start" font-size="12" fill="#5b5b5b" filter="url(#rough2)">Guadeloupe 自己对应 z = 0（k = 0），所以第一块绿色是 k = 1</text>
</svg>
