<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1417"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="720" height="300" fill="#fafafa"/>
  <text x="360.0" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">先取 S 最多的树，再逐条换出 S 边</text>
  <path d="M 115.2 42 Q 360.0 48 604.8 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="30" y="70" width="200" height="76" rx="5" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="130.0" y="105.0" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">① 只用 S 边建</text>
  <text x="130.0" y="119.3" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">生成森林（Kruskal）</text>
  <path d="M 232.0 108.0 L 253.0 108.0" stroke="#335478" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 262.0 108.0 L 253.0 112.0 L 253.0 104.0 Z" fill="#335478" filter="url(#rough2)"/>
  <rect x="264" y="70" width="200" height="76" rx="5" fill="#e8eef7" stroke="#335478" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="364.0" y="105.0" text-anchor="middle" font-size="11.5" fill="#335478" filter="url(#rough2)">② 再用 M 边连通</text>
  <text x="364.0" y="119.3" text-anchor="middle" font-size="11.5" fill="#335478" filter="url(#rough2)">得到生成树 T</text>
  <path d="M 466.0 108.0 L 487.0 108.0" stroke="#8c5a2c" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 496.0 108.0 L 487.0 112.0 L 487.0 104.0 Z" fill="#8c5a2c" filter="url(#rough2)"/>
  <rect x="498" y="70" width="192" height="76" rx="5" fill="#f7efe8" stroke="#8c5a2c" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="594.0" y="105.0" text-anchor="middle" font-size="11.5" fill="#8c5a2c" filter="url(#rough2)">③ S 边数 &gt; k 就换</text>
  <text x="594.0" y="119.3" text-anchor="middle" font-size="11.5" fill="#8c5a2c" filter="url(#rough2)">T ← T − e + f</text>
  <path d="M 594.0 148.0 L 594.0 167.0" stroke="#8c5a2c" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 594.0 176.0 L 590.0 167.0 L 598.0 167.0 Z" fill="#8c5a2c" filter="url(#rough2)"/>
  <rect x="30" y="178" width="660" height="74" rx="5" fill="#f5e8e8" stroke="#8c2f2c" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360.0" y="212.1" text-anchor="middle" font-size="11.0" fill="#8c2f2c" filter="url(#rough2)">把 T 上的 M 边缩点；找一条两端落在不同缩点的非树 M 边 f；</text>
  <text x="360.0" y="225.8" text-anchor="middle" font-size="11.0" fill="#8c2f2c" filter="url(#rough2)">f 的树上回路必含 S 边 e，换掉 e 后仍是生成树，S 计数恰减 1</text>
  <text x="360.0" y="280.0" text-anchor="middle" font-size="12.0" fill="#335478" font-weight="bold" filter="url(#rough2)">k = (n−1)/2，需要 S、M 各 k 条</text>
  <text x="360.0" y="286" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">每轮 S 计数减 1，直到等于 k</text>
</svg>
