<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="320" fill="#fafafa"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">190C 的判定：递归下降 + 两个失败出口</text>
  <path d="M 201.18 46 Q 380.0 52 558.8199999999999 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="130.0" y="60.0" width="500.0" height="44.0" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="150.0" y="88.0" text-anchor="start" font-size="11.4" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">readType()</text>
  <path d="M 380.0 105.0 L 380.0 113.0" stroke="#446688" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="130.0" y="114.0" width="500.0" height="44.0" rx="8" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="150.0" y="142.0" text-anchor="start" font-size="11.4" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">词是 int → 返回 "int"</text>
  <path d="M 380.0 159.0 L 380.0 167.0" stroke="#446688" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="130.0" y="168.0" width="500.0" height="44.0" rx="8" fill="#fff3d6" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="150.0" y="196.0" text-anchor="start" font-size="11.4" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">词是 pair → 递归读两个类型</text>
  <path d="M 380.0 213.0 L 380.0 221.0" stroke="#446688" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="130.0" y="222.0" width="500.0" height="44.0" rx="8" fill="#fdf0ef" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="150.0" y="250.0" text-anchor="start" font-size="11.4" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">词不够 / 读完还有剩余 → Error</text>
  <text x="60.0" y="300.0" text-anchor="start" font-size="10.9" fill="#6b6b6b" filter="url(#rough2)">输出长度 O(n)；n 与词数都不超过 10⁵，递归深度可能到 10⁵，C++ 用递归要小心栈（可改显式栈）。</text>
</svg>
