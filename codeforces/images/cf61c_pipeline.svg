<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400">
<defs>
  <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs>
<rect x="0" y="0" width="760" height="400" fill="#fafafa"/>
<text x="380.0" y="34" font-size="22" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="bold" text-anchor="middle" filter="url(#rough2)">先还原成数值，再按目标进制输出</text>
<rect x="30" y="90" width="210" height="60" rx="8" fill="#e8f0fe" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="135.0" y="124.9" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">c（a 进制，长度 ≤1000）</text>
<line x1="242" y1="120" x2="286" y2="120" stroke="#1a5fb4" stroke-width="2" filter="url(#rough2)"/>
<polygon points="286.0,120.0 275.0,115.0 275.0,125.0" fill="#1a5fb4" filter="url(#rough2)"/>
<rect x="288" y="90" width="190" height="60" rx="8" fill="#e6f4ea" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="383.0" y="124.9" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">逐位 v = v*a + d</text>
<line x1="480" y1="120" x2="524" y2="120" stroke="#1a5fb4" stroke-width="2" filter="url(#rough2)"/>
<polygon points="524.0,120.0 513.0,115.0 513.0,125.0" fill="#1a5fb4" filter="url(#rough2)"/>
<rect x="526" y="90" width="200" height="60" rx="8" fill="#fff4d6" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="626.0" y="124.9" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">v ≤ 1e15（R 时 ≤3000）</text>
<line x1="380" y1="152" x2="380" y2="200" stroke="#1a5fb4" stroke-width="2" filter="url(#rough2)"/>
<polygon points="380.0,200.0 385.0,189.0 375.0,189.0" fill="#1a5fb4" filter="url(#rough2)"/>
<rect x="120" y="205" width="250" height="60" rx="8" fill="#fde8e8" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="245.0" y="240.25" font-size="15" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">b = R → 罗马数字</text>
<rect x="400" y="205" width="250" height="60" rx="8" fill="#f0e6fa" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="525.0" y="240.25" font-size="15" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">否则 → 反复取模 b</text>
<text x="380" y="300" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="normal" text-anchor="middle" filter="url(#rough2)">罗马数字不超过 3000，可用固定的 13 个“值-符号”从大到小贪心拼接</text>
<text x="380" y="336" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#2e7d32" font-weight="normal" text-anchor="middle" filter="url(#rough2)">普通进制用 divmod，最后反转余数；0 要单独输出 "0"</text>
</svg>
