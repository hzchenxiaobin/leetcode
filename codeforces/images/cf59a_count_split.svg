<svg xmlns="http://www.w3.org/2000/svg" width="760" height="342" viewBox="0 0 760 342"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c9801f"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a8524a"/>
    </marker>
  </defs>
  <rect width="760" height="342" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="36.0" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">数一数：大写更多就全大写，否则全小写</text>
  <text x="380.0" y="62.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">橙色格子 = 大写字母，蓝色格子 = 小写字母（样例逐字）</text>
  <rect x="56.0" y="86.0" width="30.0" height="38.0" fill="#fdf3e3" stroke="#c9801f" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="71.0" y="110.4" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">H</text>
  <rect x="89.0" y="86.0" width="30.0" height="38.0" fill="#f7f9fc" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="104.0" y="110.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">o</text>
  <rect x="122.0" y="86.0" width="30.0" height="38.0" fill="#fdf3e3" stroke="#c9801f" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="137.0" y="110.4" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">U</text>
  <rect x="155.0" y="86.0" width="30.0" height="38.0" fill="#f7f9fc" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="170.0" y="110.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">s</text>
  <rect x="188.0" y="86.0" width="30.0" height="38.0" fill="#f7f9fc" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="203.0" y="110.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">e</text>
  <text x="280.0" y="112.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">大写 2 / 小写 3</text>
  <text x="430.0" y="112.0" text-anchor="start" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">→ 全小写</text>
  <text x="590.0" y="112.0" text-anchor="start" font-size="13.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">= house</text>
  <rect x="56.0" y="154.0" width="30.0" height="38.0" fill="#fdf3e3" stroke="#c9801f" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="71.0" y="178.4" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">V</text>
  <rect x="89.0" y="154.0" width="30.0" height="38.0" fill="#f7f9fc" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="104.0" y="178.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">i</text>
  <rect x="122.0" y="154.0" width="30.0" height="38.0" fill="#fdf3e3" stroke="#c9801f" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="137.0" y="178.4" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">P</text>
  <text x="280.0" y="180.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">大写 2 / 小写 1</text>
  <text x="430.0" y="180.0" text-anchor="start" font-size="13" fill="#c9801f" font-weight="bold" filter="url(#rough2)">→ 全大写</text>
  <text x="590.0" y="180.0" text-anchor="start" font-size="13.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">= VIP</text>
  <rect x="56.0" y="222.0" width="30.0" height="38.0" fill="#f7f9fc" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="71.0" y="246.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">m</text>
  <rect x="89.0" y="222.0" width="30.0" height="38.0" fill="#f7f9fc" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="104.0" y="246.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">a</text>
  <rect x="122.0" y="222.0" width="30.0" height="38.0" fill="#fdf3e3" stroke="#c9801f" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="137.0" y="246.4" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">T</text>
  <rect x="155.0" y="222.0" width="30.0" height="38.0" fill="#fdf3e3" stroke="#c9801f" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="170.0" y="246.4" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">R</text>
  <rect x="188.0" y="222.0" width="30.0" height="38.0" fill="#fdf3e3" stroke="#c9801f" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="203.0" y="246.4" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">I</text>
  <rect x="221.0" y="222.0" width="30.0" height="38.0" fill="#f7f9fc" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="236.0" y="246.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">x</text>
  <text x="280.0" y="248.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">大写 3 / 小写 3</text>
  <text x="430.0" y="248.0" text-anchor="start" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">→ 全平局→小写</text>
  <text x="590.0" y="248.0" text-anchor="start" font-size="13.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">= matrix</text>
  <rect x="34.0" y="300.0" width="692.0" height="32.0" rx="8" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.3" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="48.0" y="321.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">平局时必须选小写：maTRIx → matrix，而不是 MATRIX。</text>
</svg>
