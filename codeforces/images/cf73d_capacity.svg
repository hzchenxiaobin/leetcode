<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>

  <rect width="720" height="360" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每个省的隧道容量 = min(k, 省内城市数)</text>
  <path d="M 100 40 Q 360 46 620 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 三个省 -->
  <g filter="url(#rough2)">
    <ellipse cx="140" cy="130" rx="80" ry="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <ellipse cx="360" cy="130" rx="80" ry="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <ellipse cx="580" cy="130" rx="80" ry="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <!-- 城市点 -->
  <g filter="url(#rough2)">
    <circle cx="110" cy="115" r="6" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
    <circle cx="145" cy="150" r="6" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
    <circle cx="175" cy="110" r="6" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
    <circle cx="130" cy="170" r="6" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
    <circle cx="340" cy="120" r="6" fill="#ffffff" stroke="#d6a040" stroke-width="1.6"/>
    <circle cx="380" cy="150" r="6" fill="#ffffff" stroke="#d6a040" stroke-width="1.6"/>
    <circle cx="580" cy="130" r="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">
    <text x="140" y="76">省 1：4 个城市</text>
    <text x="360" y="76">省 2：2 个城市</text>
    <text x="580" y="76">省 3：1 个城市</text>
  </g>
  <g font-size="12.5" font-weight="bold" text-anchor="middle" filter="url(#rough2)">
    <text x="140" y="206" fill="#2f4a66">容量 = min(k, 4)</text>
    <text x="360" y="206" fill="#7a5a1b">容量 = min(k, 2)</text>
    <text x="580" y="206" fill="#2f5223">容量 = min(k, 1) = 1</text>
  </g>

  <!-- 隧道示意 -->
  <path d="M 180 100 Q 260 60 330 100" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <path d="M 400 100 Q 490 60 572 122" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="256" y="86" font-size="11" fill="#8a2b28" filter="url(#rough2)">隧道（每城至多 1 条）</text>
  <text x="490" y="86" font-size="11" fill="#8a2b28" filter="url(#rough2)">隧道</text>

  <rect x="60" y="232" width="600" height="46" rx="10" fill="#f4f0fa" stroke="#7a4a8a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="76" y="252" font-size="12.5" font-weight="bold" fill="#5a3a6a" filter="url(#rough2)">省间隧道图必须连通 ⇒ 需要一棵生成树，点 i 的度数 ≤ mᵢ = min(k, cᵢ)</text>
  <text x="76" y="270" font-size="12" fill="#5a3a6a" filter="url(#rough2)">树度序列：dᵢ ≥ 1 且 Σdᵢ = 2(s−1) ⇒ 可行 ⟺ Σmᵢ ≥ 2(s−1)</text>

  <rect x="60" y="292" width="600" height="50" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="76" y="313" font-size="12.5" fill="#2f5223" filter="url(#rough2)">左上例：s=3，Σmᵢ = min(k,4)+min(k,2)+1。k=2 时 = 2+2+1 = 5 ≥ 2(3−1)=4 ✓ 无需新路</text>
  <text x="76" y="332" font-size="12" fill="#2f5223" filter="url(#rough2)">若容量总和不够，就修路合并省份（省数减 1、需求减 2）</text>
</svg>
