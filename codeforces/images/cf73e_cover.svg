<svg xmlns="http://www.w3.org/2000/svg" width="720" height="368" viewBox="0 0 720 368"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr73e" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="368" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">素数 p 只能被 1 和 p 覆盖 ⇒ 每个素数都必须在列表里</text>
  <path d="M 90 40 Q 360 46 630 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 待覆盖的数 -->
  <text x="60" y="76" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">要覆盖的数 N = 2 .. x−1</text>
  <g filter="url(#rough2)">
    <rect x="60" y="88" width="46" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="112" y="88" width="46" height="34" fill="#fde8e6" stroke="#b85450" stroke-width="1.6"/>
    <rect x="164" y="88" width="46" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="216" y="88" width="46" height="34" fill="#fde8e6" stroke="#b85450" stroke-width="1.6"/>
    <rect x="268" y="88" width="46" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="320" y="88" width="46" height="34" fill="#fde8e6" stroke="#b85450" stroke-width="1.6"/>
    <rect x="372" y="88" width="46" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="424" y="88" width="46" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="476" y="88" width="46" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">
    <text x="83" y="110">2</text><text x="135" y="110">3</text><text x="187" y="110">4</text>
    <text x="239" y="110">5</text><text x="291" y="110">6</text><text x="343" y="110">7</text>
    <text x="395" y="110">8</text><text x="447" y="110">9</text><text x="499" y="110">10</text>
  </g>
  <text x="540" y="110" font-size="12" fill="#555" filter="url(#rough2)">…</text>
  <text x="60" y="140" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">红色 = 素数：它们的约数只有 1 与自身</text>

  <!-- 覆盖关系 -->
  <text x="60" y="176" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">选中的 a 能覆盖哪些数（a 的倍数）</text>
  <g font-size="12" filter="url(#rough2)">
    <text x="60" y="202" fill="#2f4a66">a = 2</text>
    <text x="140" y="202" fill="#2f4a66">覆盖 2, 4, 6, 8, 10, …</text>
    <text x="60" y="226" fill="#2f5223">a = 3</text>
    <text x="140" y="226" fill="#2f5223">覆盖 3, 6, 9, …</text>
    <text x="60" y="250" fill="#7a5a1b">a = 5</text>
    <text x="140" y="250" fill="#7a5a1b">覆盖 5, 10, …</text>
    <text x="60" y="274" fill="#8a2b28">a = 7</text>
    <text x="140" y="274" fill="#8a2b28">覆盖 7, 14, …（3 与 7 都只能靠自身覆盖）</text>
  </g>

  <rect x="400" y="160" width="270" height="120" rx="10" fill="#f4f0fa" stroke="#7a4a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="416" y="184" font-size="12.5" font-weight="bold" fill="#5a3a6a" filter="url(#rough2)">结论</text>
  <text x="416" y="208" font-size="11.5" fill="#5a3a6a" filter="url(#rough2)">1 ∉ 列表 ⇒ 每个素数 ≤ x−1 都必须选</text>
  <text x="416" y="230" font-size="11.5" fill="#5a3a6a" filter="url(#rough2)">⇒ 答案 ≥ π(x−1)</text>
  <text x="416" y="252" font-size="11.5" fill="#5a3a6a" filter="url(#rough2)">选齐所有素数后，合数被其素因子覆盖</text>
  <text x="416" y="272" font-size="11.5" fill="#5a3a6a" filter="url(#rough2)">⇒ 答案 = π(x−1)</text>

  <text x="60" y="312" font-size="12" fill="#2b2b2b" filter="url(#rough2)">所以只要比较"列表中 ≤ x−1 的不同素数个数 c"与 π(x−1)：相等则有解且答案为 π(x−1)，否则 −1。</text>
  <text x="60" y="336" font-size="12" fill="#2b2b2b" filter="url(#rough2)">π(x−1) 用 Lucy_Hedgehog 的 O(n^{3/4}) 素数计数（x ≤ 1e9 时约 4×10⁶ 次运算）。</text>
</svg>
