  <text x="585" y="468" text-anchor="start" font-size="11" fill="#555" font-weight="normal" filter="url(#rough2)">=19+6+0-4-0（把退化行补回）</text>
  <rect x="372" y="486" width="540" height="38" rx="5" fill="#fff8e1" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="510" text-anchor="start" font-size="13" fill="#333" font-weight="normal" filter="url(#rough2)">答案</text>
