  <text x="44" y="526" text-anchor="start" font-size="12.5" fill="#33502a" font-weight="normal" filter="url(#rough2)">容斥： |S∪L∪H∪V| = |S|+|L|+|H|+|V| − |S∩H| − |S∩V| − |L∩H| − |L∩V| − |H∩V| + |S∩H∩V| + |L∩H∩V|</text>
  <text x="44" y="550" text-anchor="start" font-size="12" fill="#33502a" font-weight="normal" filter="url(#rough2)">（S∩L=∅；对 5×5 棋盘 |L|=0，故只剩 6 项；答案 34 与官方输出一致）</text>
