<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="219"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="280" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">样例 1：程序 ,. 的拼接过程</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">',' → 1101，'.' → 1100，拼成 11011100 = 220</text>
  <g filter="url(#rough2)"><rect x="80" y="104" width="150" height="50" rx="5" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="155" y="137" text-anchor="middle" font-size="20" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">,</text>
  <text x="250" y="137" text-anchor="middle" font-size="16" fill="#666666" filter="url(#rough2)">→</text>
  <g filter="url(#rough2)"><rect x="290" y="104" width="170" height="50" rx="5" fill="#f6e3c4" fill-opacity="0.85" stroke="#b06a1e" stroke-width="1.4"/></g>
  <text x="375" y="137" text-anchor="middle" font-size="18" fill="#b06a1e" filter="url(#rough2)">1101</text>
  <text x="490" y="130" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">v = 0·16 + 13 = 13</text>
  <g filter="url(#rough2)"><rect x="80" y="172" width="150" height="50" rx="5" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="155" y="205" text-anchor="middle" font-size="20" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">.</text>
  <text x="250" y="205" text-anchor="middle" font-size="16" fill="#666666" filter="url(#rough2)">→</text>
  <g filter="url(#rough2)"><rect x="290" y="172" width="170" height="50" rx="5" fill="#f6e3c4" fill-opacity="0.85" stroke="#b06a1e" stroke-width="1.4"/></g>
  <text x="375" y="205" text-anchor="middle" font-size="18" fill="#b06a1e" filter="url(#rough2)">1100</text>
  <text x="490" y="198" text-anchor="start" font-size="12" fill="#4a7a3a" filter="url(#rough2)">v = 13·16 + 12 = 220</text>
  <text x="450" y="254" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">输出 220 ✓</text>
</svg>
