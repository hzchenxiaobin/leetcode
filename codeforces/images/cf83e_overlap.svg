<svg xmlns="http://www.w3.org/2000/svg" width="880" height="388" viewBox="0 0 880 388"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="83"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="388" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">f 的长度只由相邻两串的重叠决定</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">|f(s₁..s_k)| = L + Σ (L − ov(s_{i−1}, s_i))</text>
  <text x="70" y="110" text-anchor="start" font-size="12.5" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">例：f(001, 011)</text>
  <g filter="url(#rough2)"><rect x="70" y="124" width="30" height="34" rx="3" fill="#d7ecd0" fill-opacity="0.85" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="85" y="147" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)"><rect x="104" y="124" width="30" height="34" rx="3" fill="#d7ecd0" fill-opacity="0.85" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="119" y="147" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)"><rect x="138" y="124" width="30" height="34" rx="3" fill="#d7ecd0" fill-opacity="0.85" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="153" y="147" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="220" y="124" width="30" height="34" rx="3" fill="#f6e3c4" fill-opacity="0.85" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="235" y="147" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)"><rect x="254" y="124" width="30" height="34" rx="3" fill="#f6e3c4" fill-opacity="0.85" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="269" y="147" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="288" y="124" width="30" height="34" rx="3" fill="#f6e3c4" fill-opacity="0.85" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="303" y="147" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><path d="M 300 141 L 356 141" fill="none" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrg)"/></g>
  <text x="330" y="132" text-anchor="middle" font-size="11.5" fill="#3d6b2f" filter="url(#rough2)">重叠 2</text>
  <g filter="url(#rough2)"><rect x="380" y="124" width="30" height="34" rx="3" fill="#d7ecd0" fill-opacity="0.75" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="395" y="147" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)"><rect x="414" y="124" width="30" height="34" rx="3" fill="#d7ecd0" fill-opacity="0.75" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="429" y="147" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)"><rect x="448" y="124" width="30" height="34" rx="3" fill="#d7ecd0" fill-opacity="0.75" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="463" y="147" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="482" y="124" width="30" height="34" rx="3" fill="#f6e3c4" fill-opacity="0.75" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="497" y="147" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="70" y="196" text-anchor="start" font-size="12.5" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">|f| = 3 + (3 − 2) = 4</text>
  <text x="70" y="232" text-anchor="start" font-size="12.5" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">例：f(000, 000, 111) = 000111</text>
  <text x="70" y="256" text-anchor="start" font-size="12" fill="#3d6b2f" filter="url(#rough2)">ov(000,000) = 3 → 代价 0；ov(000,111) = 0 → 代价 3</text>
  <text x="70" y="280" text-anchor="start" font-size="12.5" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">|f| = 3 + 0 + 3 = 6</text>
  <g filter="url(#rough2)"><rect x="470" y="196" width="360" height="150" rx="4" fill="#ffffff" fill-opacity="0.0" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="5 4"/></g>
  <text x="650" y="222" text-anchor="middle" font-size="12.5" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">为什么只看相邻两串？</text>
  <text x="650" y="248" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">累积串 S 的末尾恰是上一串 a_{i−1}</text>
  <text x="650" y="272" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">重叠长度 ≤ L；等于 L 只可能是 a_i = a_{i−1}</text>
  <text x="650" y="296" text-anchor="middle" font-size="12" fill="#3d6b2f" filter="url(#rough2)">所以 ov(S, a_i) 完全由 (a_{i−1}, a_i) 决定</text>
  <text x="650" y="320" text-anchor="middle" font-size="12" fill="#8a2b28" filter="url(#rough2)">一次拼接的代价 = L − ov(a_{i−1}, a_i)</text>
</svg>
