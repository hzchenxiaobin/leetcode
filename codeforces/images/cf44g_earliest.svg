<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430">
<defs>
  <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs>
<rect x="0" y="0" width="760" height="430" fill="#fafafa"/>
<text x="380.0" y="34" font-size="22" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="bold" text-anchor="middle" filter="url(#rough2)">按 z 升序贪心：每个靶取“最早的空闲子弹”</text>
<text x="40" y="78" font-size="15" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="normal" text-anchor="start" filter="url(#rough2)">时间轴（射击顺序）</text>
<rect x="60" y="100" width="66" height="46" rx="4" fill="#e8f0fe" stroke="#999" stroke-width="2" filter="url(#rough2)"/>
<text x="93" y="129" font-size="17" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">1</text>
<rect x="142" y="100" width="66" height="46" rx="4" fill="#e8f0fe" stroke="#999" stroke-width="2" filter="url(#rough2)"/>
<text x="175" y="129" font-size="17" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">2</text>
<rect x="224" y="100" width="66" height="46" rx="4" fill="#e2e2e2" stroke="#999" stroke-width="2" filter="url(#rough2)"/>
<text x="257" y="129" font-size="17" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">3</text>
<rect x="306" y="100" width="66" height="46" rx="4" fill="#e8f0fe" stroke="#999" stroke-width="2" filter="url(#rough2)"/>
<text x="339" y="129" font-size="17" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">4</text>
<rect x="388" y="100" width="66" height="46" rx="4" fill="#e2e2e2" stroke="#999" stroke-width="2" filter="url(#rough2)"/>
<text x="421" y="129" font-size="17" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">5</text>
<rect x="470" y="100" width="66" height="46" rx="4" fill="#e8f0fe" stroke="#999" stroke-width="2" filter="url(#rough2)"/>
<text x="503" y="129" font-size="17" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">6</text>
<rect x="552" y="100" width="66" height="46" rx="4" fill="#e8f0fe" stroke="#999" stroke-width="2" filter="url(#rough2)"/>
<text x="585" y="129" font-size="17" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">7</text>
<rect x="634" y="100" width="66" height="46" rx="4" fill="#e8f0fe" stroke="#999" stroke-width="2" filter="url(#rough2)"/>
<text x="667" y="129" font-size="17" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">8</text>
<line x1="93" y1="205" x2="93" y2="150" stroke="#2e7d32" stroke-width="2" filter="url(#rough2)"/>
<polygon points="93.0,150.0 88.0,161.0 98.0,161.0" fill="#2e7d32" filter="url(#rough2)"/>
<line x1="257" y1="205" x2="257" y2="150" stroke="#2e7d32" stroke-width="2" filter="url(#rough2)"/>
<polygon points="257.0,150.0 252.0,161.0 262.0,161.0" fill="#2e7d32" filter="url(#rough2)"/>
<line x1="503" y1="205" x2="503" y2="150" stroke="#2e7d32" stroke-width="2" filter="url(#rough2)"/>
<polygon points="503.0,150.0 498.0,161.0 508.0,161.0" fill="#2e7d32" filter="url(#rough2)"/>
<text x="60" y="182" font-size="15" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="normal" text-anchor="start" filter="url(#rough2)">靶 A (z=1) 的矩形含第 1,3,6 发 → 取第 1 发</text>
<text x="60" y="245" font-size="15" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="normal" text-anchor="start" filter="url(#rough2)">靶 B (z=2) 的矩形也含第 1,3,6 发</text>
<text x="60" y="273" font-size="15" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#1a5fb4" font-weight="normal" text-anchor="start" filter="url(#rough2)">第 1 发已属于 A，不能再用 → 取第 3 发</text>
<text x="60" y="325" font-size="15" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="normal" text-anchor="start" filter="url(#rough2)">靶 C (z=3) 的矩形含第 3,4 发</text>
<text x="60" y="353" font-size="15" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#1a5fb4" font-weight="normal" text-anchor="start" filter="url(#rough2)">第 3 发已属于 B → 取第 4 发</text>
<text x="60" y="398" font-size="15" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#c0392b" font-weight="normal" text-anchor="start" filter="url(#rough2)">最终没有被任何靶取走的子弹，对应输出 0</text>
</svg>
