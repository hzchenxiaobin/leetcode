<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="720" height="300" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例：n = 7 的 1198733 → 2 + 3 + 2</text>

  <g font-size="22" font-family="monospace" filter="url(#rough2)">
    <text x="120" y="100" fill="#2f4a66">1</text><text x="150" y="100" fill="#2f4a66">1</text>
    <text x="200" y="100" fill="#2f4a66">9</text><text x="230" y="100" fill="#2f4a66">8</text><text x="260" y="100" fill="#2f4a66">7</text>
    <text x="310" y="100" fill="#2f4a66">3</text><text x="340" y="100" fill="#2f4a66">3</text>
  </g>
  <g stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)">
    <rect x="108" y="74" width="60" height="40" rx="6"/>
    <rect x="188" y="74" width="90" height="40" rx="6"/>
    <rect x="298" y="74" width="60" height="40" rx="6"/>
  </g>
  <g font-size="11.5" fill="#666" filter="url(#rough2)" text-anchor="middle">
    <text x="138" y="132">2 位</text>
    <text x="233" y="132">3 位</text>
    <text x="328" y="132">2 位</text>
  </g>
  <text x="360" y="180" text-anchor="middle" font-size="18" font-family="monospace" fill="#2f5223" filter="url(#rough2)">11-987-33</text>

  <rect x="120" y="210" width="480" height="60" rx="10" fill="#eef4ec" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="136" y="234" font-size="12.5" fill="#2f5223" filter="url(#rough2)">流程：7 &gt; 5 → 先取 2 位 "11"；剩 5 位 → 拆成 3 + 2（"987" 与 "33"）。</text>
  <text x="136" y="256" font-size="12.5" fill="#2f5223" filter="url(#rough2)">n = 6 时同理：6 &gt; 5 → 取 "54"，剩 4 → 2 + 2 → 54-98-71。</text>
</svg>
