<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>

  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">b 进制数字和：反复取余，再把余数相加</text>
  <path d="M 135 46 Q 360 52 585 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <rect x="45" y="90" width="140" height="80" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="55" y="110" font-size="11" fill="#667" filter="url(#rough2)">A</text>
  <text x="115" y="145" text-anchor="middle" font-size="28" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">123</text>

  <path d="M 187 130 L 224 130" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="230" y="90" width="230" height="80" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="345" y="122" text-anchor="middle" font-size="13" fill="#2f5223" filter="url(#rough2)">123 ÷ 16  →  商 7</text>
  <text x="345" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5223" filter="url(#rough2)">余 11</text>

  <path d="M 462 130 L 499 130" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="505" y="90" width="170" height="80" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="590" y="122" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">7 ÷ 16 → 商 0</text>
  <text x="590" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6015" filter="url(#rough2)">余 7</text>

  <text x="360" y="196" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">余数依次是 11、7（商为 0 时停止），数字和 = 11 + 7 = 18</text>

  <rect x="45" y="218" width="630" height="104" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <g font-size="12.5" fill="#7a5a1b" filter="url(#rough2)">
    <text x="62" y="248">对每个 b = 2 … A−1 重复：x = A；while x &gt; 0: sum += x % b; x /= b</text>
    <text x="62" y="276">所有数字和相加得 Σ，进制个数是 A−2；答案是 Σ/(A−2)，再用 gcd 约分</text>
    <text x="62" y="304">数字按“数值”累加：b &gt; 10 时一位数字可能大于 9（如 11），不是字符 B</text>
  </g>

  <text x="45" y="356" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">A = 5 的对照：101₂ 和为 2、12₃ 和为 3、11₄ 和为 2 → 平均 7/3。</text>
</svg>
