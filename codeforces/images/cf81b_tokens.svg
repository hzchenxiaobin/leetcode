<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="121"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>

  <rect width="720" height="340" fill="#fafafa"/>
  <text x="360.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">先切成词素：数字 / 逗号 / 三个点</text>
  <path d="M 115.2 42 Q 360.0 48 604.8 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="360.0" y="326" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">样例 1：1,2 ,3,...,     10</text>
  <rect x="62" y="96" width="50" height="42" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="87.0" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#335478" filter="url(#rough2)">1</text>
  <rect x="122" y="96" width="50" height="42" rx="7" fill="#fbeadb" stroke="#d98c3f" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="147.0" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#9a5d1c" filter="url(#rough2)">,</text>
  <rect x="182" y="96" width="50" height="42" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="207.0" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#335478" filter="url(#rough2)">2</text>
  <rect x="242" y="96" width="50" height="42" rx="7" fill="#fbeadb" stroke="#d98c3f" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="267.0" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#9a5d1c" filter="url(#rough2)">,</text>
  <rect x="302" y="96" width="50" height="42" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="327.0" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#335478" filter="url(#rough2)">3</text>
  <rect x="362" y="96" width="50" height="42" rx="7" fill="#fbeadb" stroke="#d98c3f" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="387.0" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#9a5d1c" filter="url(#rough2)">,</text>
  <rect x="422" y="96" width="60" height="42" rx="7" fill="#e2e3f1" stroke="#5b5f9e" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="452.0" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#383b6c" filter="url(#rough2)">...</text>
  <rect x="492" y="96" width="50" height="42" rx="7" fill="#fbeadb" stroke="#d98c3f" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="517.0" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#9a5d1c" filter="url(#rough2)">,</text>
  <rect x="552" y="96" width="56" height="42" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="580.0" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#335478" filter="url(#rough2)">10</text>
  <text x="360" y="78" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">空格被丢弃；“...” 整体是一个词素</text>
  <rect x="52" y="176" width="300" height="96" rx="9" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="202" y="200" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">数字词素</text>
  <text x="202" y="224" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">连续的数字整体取走</text>
  <text x="202" y="246" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">（没有前导零）</text>
  <rect x="372" y="176" width="296" height="96" rx="9" fill="#fbeeee" stroke="#a05a5a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="520" y="200" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#6b3030" filter="url(#rough2)">逗号 / 省略号</text>
  <text x="520" y="224" text-anchor="middle" font-size="11.5" fill="#6b3030" filter="url(#rough2)">单字符 “,” 与三字符 “...”</text>
  <text x="520" y="246" text-anchor="middle" font-size="11.5" fill="#6b3030" filter="url(#rough2)">两者各自独立成词素</text>
  <rect x="52" y="286" width="616" height="34" rx="8" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="360" y="308" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">题面只允许增删空格，所以词素序列在输出里必须一模一样</text>
</svg>
