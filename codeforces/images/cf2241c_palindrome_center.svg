<svg xmlns="http://www.w3.org/2000/svg" width="760" height="356" viewBox="0 0 760 356"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="356" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">任意 3 个 0/1 字符里，一定藏着长度 2 或 3 的回文</text>
  <path d="M 132 42 Q 380 50 630 42" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- 情况 A -->
  <rect x="48" y="62" width="316" height="150" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="66" y="88" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">情况 A：s₁ = s₂</text>
  <rect x="66" y="100" width="42" height="42" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="87" y="128" text-anchor="middle" font-size="17" font-weight="bold" fill="#8a2a26" filter="url(#rough2)">c</text>
  <rect x="112" y="100" width="42" height="42" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="133" y="128" text-anchor="middle" font-size="17" font-weight="bold" fill="#8a2a26" filter="url(#rough2)">c</text>
  <rect x="158" y="100" width="42" height="42" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="179" y="128" text-anchor="middle" font-size="16" fill="#5a6b7a" filter="url(#rough2)">?</text>
  <text x="66" y="170" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">「cc」本身就是长度 2 的回文</text>
  <text x="66" y="192" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">删掉其中一个字符即可缩短</text>

  <!-- 情况 B -->
  <rect x="396" y="62" width="316" height="150" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="414" y="88" font-size="14" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">情况 B：s₁ ≠ s₂</text>
  <rect x="414" y="100" width="42" height="42" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="435" y="128" text-anchor="middle" font-size="17" font-weight="bold" fill="#8a6015" filter="url(#rough2)">c</text>
  <rect x="460" y="100" width="42" height="42" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="481" y="128" text-anchor="middle" font-size="17" font-weight="bold" fill="#8a6015" filter="url(#rough2)">d</text>
  <rect x="506" y="100" width="42" height="42" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="527" y="128" text-anchor="middle" font-size="17" font-weight="bold" fill="#8a6015" filter="url(#rough2)">c</text>
  <text x="414" y="170" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">s₃ 只能是 c 或 d（只有两种字母）：</text>
  <text x="414" y="192" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">s₃ = d ⇒「dd」；s₃ = c ⇒「cdc」</text>

  <!-- 结论 -->
  <path d="M 206 214 L 206 230 L 374 230" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 554 214 L 554 230 L 386 230" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 380 230 L 380 248" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="48" y="250" width="664" height="62" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="276" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">⟹ n ≥ 3 时总能再删 1 个字符，故最小长度 ≤ 2</text>
  <text x="380" y="300" text-anchor="middle" font-size="12.5" fill="#7a5a1c" filter="url(#rough2)">答案只可能是 1 或 2：问题变成「能不能删到只剩 1 个字符」</text>

  <text x="380" y="336" text-anchor="middle" font-size="12" fill="#8a2a26" filter="url(#rough2)">⚠ 交替串（如 010）里同样有回文，别把「没有相邻相同」误当成终点</text>
</svg>
