<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="409"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="420" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">195A：等 t 秒，下载量必须始终追得上观看量</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <line x1="80.0" y1="250.0" x2="640.0" y2="250.0" stroke="#888888" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="80.0" y1="250.0" x2="80.0" y2="80.0" stroke="#888888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="640.0" y="276.0" text-anchor="end" font-size="10.5" fill="#666" filter="url(#rough2)">时间</text>
  <text x="70.0" y="80.0" text-anchor="start" font-size="10.5" fill="#666" filter="url(#rough2)">数据量</text>
  <line x1="80.0" y1="250.0" x2="640.0" y2="100.0" stroke="#4a7a3a" stroke-width="2.0" filter="url(#rough2)"/>
  <line x1="200.0" y1="250.0" x2="640.0" y2="100.0" stroke="#446688" stroke-width="2.0" filter="url(#rough2)"/>
  <text x="630.0" y="92.0" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">下载 b·t</text>
  <text x="630.0" y="130.0" text-anchor="end" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">观看 a·(t−t₀)</text>
  <line x1="200.0" y1="250.0" x2="200.0" y2="230.0" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="204.0" y="240.0" text-anchor="start" font-size="10.5" fill="#b85450" filter="url(#rough2)">开始观看</text>
  <rect x="60.0" y="290.0" width="600.0" height="70.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="74.0" y="313.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">最紧的约束在结尾 t₀=c+t：b(c+t) ≥ a·c</text>
  <text x="74.0" y="339.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">t ≥ (a−b)c/b，向上取整</text>
</svg>
