<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="101"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="720" height="420" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">模式 a 把数轴切成每段长 a 的块：N 与 N+1 不同块 ⟺ a | N</text>
  <path d="M 120 40 Q 360 46 600 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- a = 3 的块 -->
  <text x="80" y="92" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">a = 3</text>
  <g filter="url(#rough2)">
    <rect x="150" y="72" width="120" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="270" y="72" width="120" height="40" fill="#dbe7fa" stroke="#446688" stroke-width="1.5"/>
    <rect x="390" y="72" width="120" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="510" y="72" width="120" height="40" fill="#dbe7fa" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle" fill="#2f4a66">
    <text x="210" y="98">1,2,3 → 页1</text>
    <text x="330" y="98">4,5,6 → 页2</text>
    <text x="450" y="98">7,8,9 → 页3</text>
    <text x="570" y="98">10,11,12 → 页4</text>
  </g>
  <g filter="url(#rough2)" stroke="#8c2f2b" stroke-width="2">
    <line x1="270" y1="66" x2="270" y2="118"/>
    <line x1="390" y1="66" x2="390" y2="118"/>
    <line x1="510" y1="66" x2="510" y2="118"/>
  </g>
  <text x="270" y="134" text-anchor="middle" font-size="11" fill="#8c2f2b" filter="url(#rough2)">3 = a 的倍数</text>
  <text x="390" y="134" text-anchor="middle" font-size="11" fill="#8c2f2b" filter="url(#rough2)">6</text>
  <text x="510" y="134" text-anchor="middle" font-size="11" fill="#8c2f2b" filter="url(#rough2)">9</text>

  <!-- 相邻对 -->
  <text x="80" y="196" font-size="12.5" font-weight="bold" fill="#1f5226" filter="url(#rough2)">相邻对</text>
  <g filter="url(#rough2)" font-size="11.5">
    <text x="160" y="196" fill="#1f5226">(2,3)：3 是 3 的倍数 → 跨块 ✓ 可区分</text>
    <text x="160" y="220" fill="#8c2f2b">(3,4)：4 不是 3 的倍数 → 同块 ✗ 分不开（都落在页2？不，3 在页1）</text>
    <text x="160" y="244" fill="#555">准确说法：N 与 N+1 被模式 a 区分 ⟺ a | N（见第 4 节引理 2）</text>
  </g>

  <!-- 结论 -->
  <rect x="60" y="272" width="600" height="120" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="298" font-size="13" font-weight="bold" fill="#8a6015">于是“签名两两不同” ⟺ “每个 N ∈ [2, x−1] 都能被某个选中的 a 整除”</text>
  <text x="76" y="324" font-size="11.5" fill="#7a5a1b">⇐：若每个 N 都有 a | N，则对任意 N₁ &lt; N₂ 用 a | (N₂−1) 即可区分（N₂−1 ∈ (N₁−1, N₂−1]）。</text>
  <text x="76" y="350" font-size="11.5" fill="#7a5a1b">⇒：若所有 N 都被覆盖则显然；若某个 N 没被覆盖，则 N 与 N+1 在所有模式下都同块。</text>
  <text x="76" y="376" font-size="11.5" fill="#7a5a1b">这把 10⁹ 个候选 N 的问题，压缩成了“整数覆盖”问题。</text>
</svg>
