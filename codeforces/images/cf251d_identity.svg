<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="380" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">关键恒等式：x1 + x2 = X + 2·(x1 AND x2)</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">X 是所有数的异或，x1 XOR x2 = X 恒成立；相加时"两位都为 1"才会多进一位</text>
  <text x="120" y="110" text-anchor="end" font-size="12.5" fill="#555555" filter="url(#rough2)">X 的位</text>
  <text x="120" y="150" text-anchor="end" font-size="12.5" fill="#555555" filter="url(#rough2)">x1 的位</text>
  <text x="120" y="190" text-anchor="end" font-size="12.5" fill="#555555" filter="url(#rough2)">x2 的位</text>
  <text x="180" y="86" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">第 5 位</text>
  <g filter="url(#rough2)"><rect x="150" y="96" width="60" height="36" rx="4" fill="#f6e3c4" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="180.0" y="119.04" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="150" y="132" width="60" height="36" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="180.0" y="155.04" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)"><rect x="150" y="172" width="60" height="36" rx="4" fill="#cfe0f0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="180.0" y="195.04" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="266" y="86" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">第 4 位</text>
  <g filter="url(#rough2)"><rect x="236" y="96" width="60" height="36" rx="4" fill="#f6e3c4" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="266.0" y="119.04" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="236" y="132" width="60" height="36" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="266.0" y="155.04" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="236" y="172" width="60" height="36" rx="4" fill="#cfe0f0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="266.0" y="195.04" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="352" y="86" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">第 3 位</text>
  <g filter="url(#rough2)"><rect x="322" y="96" width="60" height="36" rx="4" fill="#f6e3c4" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="352.0" y="119.04" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)"><rect x="322" y="132" width="60" height="36" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="352.0" y="155.04" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)"><rect x="322" y="172" width="60" height="36" rx="4" fill="#cfe0f0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="352.0" y="195.04" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)"><rect x="322" y="206" width="60" height="34" rx="3" fill="#f6d9d7" fill-opacity="0.8" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="352" y="229" text-anchor="middle" font-size="11" fill="#b05a5a" filter="url(#rough2)">算 2 次</text>
  <text x="438" y="86" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">第 2 位</text>
  <g filter="url(#rough2)"><rect x="408" y="96" width="60" height="36" rx="4" fill="#f6e3c4" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="438.0" y="119.04" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="408" y="132" width="60" height="36" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="438.0" y="155.04" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="408" y="172" width="60" height="36" rx="4" fill="#cfe0f0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="438.0" y="195.04" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="524" y="86" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">第 1 位</text>
  <g filter="url(#rough2)"><rect x="494" y="96" width="60" height="36" rx="4" fill="#f6e3c4" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="524.0" y="119.04" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)"><rect x="494" y="132" width="60" height="36" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="524.0" y="155.04" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="494" y="172" width="60" height="36" rx="4" fill="#cfe0f0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="524.0" y="195.04" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)"><rect x="494" y="206" width="60" height="34" rx="3" fill="#f6d9d7" fill-opacity="0.8" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="524" y="229" text-anchor="middle" font-size="11" fill="#b05a5a" filter="url(#rough2)">算 2 次</text>
  <text x="440" y="268" text-anchor="middle" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">X 位为 0 → 两数该位相同：都为 1 时这一位既进 x1 又进 x2，贡献 2 倍</text>
  <text x="440" y="296" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">X 位为 1 → 两数该位必有一个 1，贡献恒为 1 倍，与怎么分无关</text>
  <text x="440" y="330" text-anchor="middle" font-size="13" fill="#b05a5a" filter="url(#rough2)">所以目标等价于：把"X 位为 0"的那些位尽量都做成 1（高位优先）</text>
</svg>
