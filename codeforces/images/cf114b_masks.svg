<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="380" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">把「队伍」压成 bitmask，冲突集合也是一个 bitmask</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">n ≤ 16 ⇒ 至多 2¹⁶ = 65536 个候选队伍，全枚举 6.5×10⁴ × 16 次判断</text>
  <text x="80" y="100" text-anchor="start" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">示例：n = 3，只有 A 与 B 不和</text>
  <g filter="url(#rough2)"><circle cx="120" cy="150" r="26" fill="#cfe0f5" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="120" y="154.32" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">A</text>
  <g filter="url(#rough2)"><circle cx="210" cy="150" r="26" fill="#cfe0f5" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="210" y="154.32" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">B</text>
  <g filter="url(#rough2)"><circle cx="300" cy="150" r="26" fill="#cfe0f5" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="300" y="154.32" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">C</text>
  <g filter="url(#rough2)"><line x1="146" y1="150" x2="184" y2="150" stroke="#8a2b28" stroke-width="2"/></g>
  <text x="165" y="132" text-anchor="middle" font-size="10.5" fill="#8a2b28" filter="url(#rough2)">不和</text>
  <text x="120" y="200" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">bad[A] = 010</text>
  <text x="120" y="222" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">bad[B] = 001</text>
  <text x="120" y="244" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">bad[C] = 000</text>
  <text x="330" y="100" text-anchor="start" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">枚举全部子集</text>
  <g filter="url(#rough2)"><rect x="330" y="102" width="120" height="24" rx="3" fill="#ffffff" fill-opacity="0.3" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="390" y="119" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">0 0 0</text>
  <text x="500" y="119" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">0</text>
  <text x="540" y="119" text-anchor="start" font-size="11" fill="#666666" filter="url(#rough2)">✓</text>
  <g filter="url(#rough2)"><rect x="330" y="132" width="120" height="24" rx="3" fill="#ffffff" fill-opacity="0.3" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="390" y="149" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">1 0 0</text>
  <text x="500" y="149" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">1</text>
  <text x="540" y="149" text-anchor="start" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓ C</text>
  <g filter="url(#rough2)"><rect x="330" y="162" width="120" height="24" rx="3" fill="#ffffff" fill-opacity="0.3" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="390" y="179" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">0 1 0</text>
  <text x="500" y="179" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">1</text>
  <text x="540" y="179" text-anchor="start" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓ B</text>
  <g filter="url(#rough2)"><rect x="330" y="192" width="120" height="24" rx="3" fill="#ffffff" fill-opacity="0.3" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="390" y="209" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">1 1 0</text>
  <text x="500" y="209" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">2</text>
  <text x="540" y="209" text-anchor="start" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓ B,C</text>
  <g filter="url(#rough2)"><rect x="330" y="222" width="120" height="24" rx="3" fill="#ffffff" fill-opacity="0.3" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="390" y="239" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">0 0 1</text>
  <text x="500" y="239" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">1</text>
  <text x="540" y="239" text-anchor="start" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓ A</text>
  <g filter="url(#rough2)"><rect x="330" y="252" width="120" height="24" rx="3" fill="#ffffff" fill-opacity="0.3" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="390" y="269" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">1 0 1</text>
  <text x="500" y="269" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">2</text>
  <text x="540" y="269" text-anchor="start" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓ A,C</text>
  <g filter="url(#rough2)"><rect x="330" y="282" width="120" height="24" rx="3" fill="#ffffff" fill-opacity="0.3" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="390" y="299" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">0 1 1</text>
  <text x="500" y="299" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">2</text>
  <text x="540" y="299" text-anchor="start" font-size="11" fill="#8a2b28" filter="url(#rough2)">✗ A,B 不和</text>
  <g filter="url(#rough2)"><rect x="330" y="312" width="120" height="24" rx="3" fill="#ffffff" fill-opacity="0.3" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="390" y="329" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">1 1 1</text>
  <text x="500" y="329" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">3</text>
  <text x="540" y="329" text-anchor="start" font-size="11" fill="#8a2b28" filter="url(#rough2)">✗ 含 A,B</text>
  <text x="600" y="130" text-anchor="start" font-size="12" fill="#b06a1e" font-weight="bold" filter="url(#rough2)">选最大人数 = 2</text>
  <text x="600" y="156" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">合法的 2 人队伍有</text>
  <text x="600" y="178" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">{B,C} 与 {A,C} 两组</text>
  <text x="600" y="206" text-anchor="start" font-size="11" fill="#666666" filter="url(#rough2)">任一均可接受</text>
  <g filter="url(#rough2)"><rect x="596" y="220" width="270" height="78" rx="6" fill="#f6e3c4" fill-opacity="0.85" stroke="#b06a1e" stroke-width="1.4" stroke-dasharray="5 4"/></g>
  <text x="731" y="246" text-anchor="middle" font-size="11" fill="#b06a1e" filter="url(#rough2)">实现里固定选字典序最小的那组</text>
  <text x="731" y="268" text-anchor="middle" font-size="11" fill="#b06a1e" filter="url(#rough2)">保证输出确定、样例可比对</text>
  <text x="731" y="290" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">判题只要人数最大 + 无冲突</text>
  <text x="450" y="348" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">判断一个 mask 是否可行：对 mask 里每个 i 检查 (bad[i] &amp; mask) == 0</text>
</svg>
