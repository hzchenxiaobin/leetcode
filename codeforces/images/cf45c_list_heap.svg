<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="457"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8a2b28"/>
    </marker>
  </defs>
  <rect width="760" height="400" fill="#fafafa"/>
  <text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">双向链表维护队列 + 小根堆维护候选；弹出时用 alive 和指针关系做惰性过滤</text>
  <path d="M 60 38 Q 380 46 700 38" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <g font-size="11">
    <circle cx="90" cy="105" r="22" fill="#d9ecd4" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="90" y="110" text-anchor="middle" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
    <circle cx="200" cy="105" r="22" fill="#f6d5d5" stroke="#8a2b28" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="200" y="110" text-anchor="middle" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">2</text>
    <circle cx="310" cy="105" r="22" fill="#f6d5d5" stroke="#8a2b28" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="310" y="110" text-anchor="middle" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">3</text>
    <circle cx="420" cy="105" r="22" fill="#d9ecd4" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="420" y="110" text-anchor="middle" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">4</text>
    <circle cx="530" cy="105" r="22" fill="#cfe0f5" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="530" y="110" text-anchor="middle" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">5</text>
  </g>
  <path d="M 112 98 L 176 98" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 222 98 L 286 98" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 332 98 L 396 98" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 442 98 L 506 98" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="128" y="88" font-size="9.5" fill="#555555" filter="url(#rough2)">nxt</text>

  <path d="M 176 132 Q 254 168 396 132" fill="none" stroke="#8a2b28" stroke-width="1.8"
        stroke-dasharray="6 4" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="248" y="176" font-size="10.5" fill="#8a2b28" filter="url(#rough2)">2、3 离开后：nxt[1] = 4，prv[4] = 1</text>
  <text x="248" y="192" font-size="10.5" fill="#8a2b28" filter="url(#rough2)">新增候选对 (1,4) 入堆</text>

  <rect x="60" y="214" width="640" height="120" rx="10" fill="#cfe0f5" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="76" y="238" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">小根堆（按 差值、左端点编号 排序）</text>
  <rect x="80" y="252" width="120" height="34" rx="7" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="140" y="274" text-anchor="middle" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">(1, 3, 4)</text>
  <rect x="216" y="252" width="120" height="34" rx="7" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="276" y="274" text-anchor="middle" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">(2, 1, 2)</text>
  <rect x="352" y="252" width="120" height="34" rx="7" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="412" y="274" text-anchor="middle" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">(2, 2, 3)</text>
  <rect x="488" y="252" width="190" height="34" rx="7" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="583" y="274" text-anchor="middle" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">(2, 3, 4) …</text>

  <text x="76" y="308" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">弹出 (d,i,j) 时：若 alive[i] 或 alive[j] 为假，或 nxt[i] ≠ j，说明这对已不相邻，直接丢弃。</text>
  <text x="76" y="326" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">否则它一定是当前所有合法相邻对里 (差值, 左端点) 最小的那一对，输出并删除。</text>

  <rect x="60" y="348" width="640" height="40" rx="8" fill="#d9ecd4" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="76" y="373" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">每次删除后只新增至多一个候选对，所以堆里最多 O(n) 条记录，总时间 O(n log n)。</text>
</svg>
