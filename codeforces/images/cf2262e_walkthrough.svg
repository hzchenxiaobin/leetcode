<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" width="580" height="380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">n = 3 走查：截断幂求 d_j，算 A_j，再做二项式反演</text>

  <!-- 表头 -->
  <rect x="30" y="40" width="520" height="24" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="58" y="57" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">j</text>
  <text x="150" y="57" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">R_j = Q^(j+1)，只保留到 z^(3−j)</text>
  <text x="352" y="57" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">d_j</text>
  <text x="455" y="57" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">A_j = C(6,j)·d_j/(j+1)</text>

  <!-- 行 -->
  <rect x="30" y="68" width="520" height="26" rx="5" fill="#ffffff" stroke="#c9d6e8" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="58" y="86" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="150" y="86" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">1 + z + 4z² + 25z³</text>
  <text x="352" y="86" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">25</text>
  <text x="455" y="86" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">1·25/1 = 25</text>

  <rect x="30" y="98" width="520" height="26" rx="5" fill="#ffffff" stroke="#c9d6e8" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="58" y="116" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="150" y="116" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">1 + 2z + 9z²</text>
  <text x="352" y="116" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">9</text>
  <text x="455" y="116" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">6·9/2 = 27</text>

  <rect x="30" y="128" width="520" height="26" rx="5" fill="#ffffff" stroke="#c9d6e8" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="58" y="146" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="150" y="146" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">1 + 3z</text>
  <text x="352" y="146" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <text x="455" y="146" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">15·3/3 = 15</text>

  <rect x="30" y="158" width="520" height="26" rx="5" fill="#ffffff" stroke="#c9d6e8" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="58" y="176" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="150" y="176" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">1</text>
  <text x="352" y="176" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="455" y="176" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">20·1/4 = 5</text>

  <path d="M 290 188 L 290 204" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- 反演 -->
  <rect x="40" y="208" width="500" height="112" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="58" y="234" font-size="12" fill="#33582a" filter="url(#rough2)">f_0 = A_0 − A_1 + A_2 − A_3 = 25 − 27 + 15 − 5 = 8</text>
  <text x="58" y="258" font-size="12" fill="#33582a" filter="url(#rough2)">f_1 = A_1 − 2·A_2 + 3·A_3 = 27 − 30 + 15 = 12</text>
  <text x="58" y="282" font-size="12" fill="#33582a" filter="url(#rough2)">f_2 = A_2 − 3·A_3 = 15 − 15 = 0   （公共弧 n−1 条 ⇒ 必全同）</text>
  <text x="58" y="306" font-size="12" fill="#33582a" filter="url(#rough2)">f_3 = A_3 = 5   （两条序列完全相同，5 = C_3 条序列）</text>

  <rect x="180" y="336" width="220" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="290" y="356" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">输出：8  12  0  5</text>
</svg>
