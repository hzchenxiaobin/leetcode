<svg xmlns="http://www.w3.org/2000/svg" width="880" height="336" viewBox="0 0 880 336"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="109"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="336" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例：n=11 → 47；n=10 → −1</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">11 = 4·1 + 7·1，位数 2；10 无法写成 4a+7b</text>
  <g filter="url(#rough2)"><rect x="120" y="110" width="300" height="70" rx="4" fill="#f6e3c4" fill-opacity="0.6" stroke="#c9a86a" stroke-width="1.4"/></g>
  <text x="270" y="140" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">n = 11</text>
  <text x="270" y="164" text-anchor="middle" font-size="12" fill="#3d6b2f" filter="url(#rough2)">a=1, b=1 → 47</text>
  <g filter="url(#rough2)"><rect x="470" y="110" width="300" height="70" rx="4" fill="#f6d9d7" fill-opacity="0.5" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="620" y="140" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">n = 10</text>
  <text x="620" y="164" text-anchor="middle" font-size="12" fill="#8a2b28" filter="url(#rough2)">4a+7b=10 无解 → −1</text>
  <text x="440" y="232" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">穷举 b：b=0 → 10%4≠0；b=1 → 3%4≠0；b&gt;1 时 7b&gt;10 → 无解</text>
  <text x="440" y="268" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">n ≤ 10⁶，循环 n/7 ≈ 1.4×10⁵ 次即可</text>
</svg>
