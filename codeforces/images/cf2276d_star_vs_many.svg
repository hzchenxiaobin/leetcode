<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">分类：星形图恰好 2 种，其余（无孤立点）都至少 4 种</text>

  <g filter="url(#rough2)">
    <rect x="18" y="46" width="292" height="192" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10"/>
    <text x="164" y="66" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold">星形图 K(1, n−1) → 答案 2</text>
  </g>

  <g filter="url(#rough2)" stroke-width="1.8">
    <path d="M 164 166 L 104 112" stroke="#8a8a8a" fill="none"/>
    <path d="M 164 166 L 224 112" stroke="#8a8a8a" fill="none"/>
    <path d="M 164 166 L 100 204" stroke="#8a8a8a" fill="none"/>
    <path d="M 164 166 L 228 204" stroke="#8a8a8a" fill="none"/>
    <circle cx="164" cy="166" r="19" fill="#fce4ec" stroke="#b85450"/>
    <text x="164" y="171" text-anchor="middle" font-size="11" fill="#8a3a36">红</text>
    <circle cx="104" cy="112" r="15" fill="#e8f0fe" stroke="#446688"/>
    <circle cx="224" cy="112" r="15" fill="#e8f0fe" stroke="#446688"/>
    <circle cx="100" cy="204" r="15" fill="#e8f0fe" stroke="#446688"/>
    <circle cx="228" cy="204" r="15" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <g filter="url(#rough2)" font-size="9.5" fill="#3a4a66" text-anchor="middle">
    <text x="104" y="116">蓝</text>
    <text x="224" y="116">蓝</text>
    <text x="100" y="208">蓝</text>
    <text x="228" y="208">蓝</text>
  </g>
  <g filter="url(#rough2)" font-size="9.5" fill="#3a5a30" text-anchor="middle">
    <text x="164" y="234">叶子被中心钉成反色 ⇒ 只剩这一种及其反色</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="330" y="46" width="292" height="192" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10"/>
    <text x="476" y="66" text-anchor="middle" font-size="11.5" fill="#3a4a66" font-weight="bold">非星形（无孤立点）→ 答案 Many</text>
  </g>

  <g filter="url(#rough2)" stroke-width="1.8">
    <path d="M 430 166 L 386 112" stroke="#8a8a8a" fill="none"/>
    <path d="M 430 166 L 386 204" stroke="#8a8a8a" fill="none"/>
    <path d="M 430 166 L 522 166" stroke="#8a8a8a" fill="none"/>
    <path d="M 522 166 L 566 112" stroke="#8a8a8a" fill="none"/>
    <path d="M 522 166 L 566 204" stroke="#8a8a8a" fill="none"/>
    <circle cx="430" cy="166" r="19" fill="#fce4ec" stroke="#b85450"/>
    <text x="430" y="171" text-anchor="middle" font-size="11" fill="#8a3a36">红</text>
    <circle cx="386" cy="112" r="15" fill="#e8f0fe" stroke="#446688"/>
    <circle cx="386" cy="204" r="15" fill="#e8f0fe" stroke="#446688"/>
    <circle cx="522" cy="166" r="19" fill="#e8f0fe" stroke="#446688"/>
    <text x="522" y="171" text-anchor="middle" font-size="11" fill="#3a4a66">蓝</text>
    <circle cx="566" cy="112" r="15" fill="#fce4ec" stroke="#b85450"/>
    <circle cx="566" cy="204" r="15" fill="#fce4ec" stroke="#b85450"/>
  </g>
  <g filter="url(#rough2)" font-size="9.5" text-anchor="middle">
    <text x="476" y="234" fill="#3a4a66">双星：u、v 各自任取颜色（叶子被强制）⇒ 4 种</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="252" width="580" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10"/>
    <text x="46" y="272" font-size="10" fill="#8a6a20">左（星形）：叶子只能是中心的反色 ⇒ 恰好 2 种，且翻转任何一点都会让该点自己失去异色邻居</text>
    <text x="46" y="291" font-size="10" fill="#8a6a20">右（双星）：两个中心各有 2 种选法 ⇒ 4 种；一般非星形图按 §5 引理 4 的两种构造同样得到 ≥ 4 种</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="316" width="580" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10"/>
    <text x="46" y="337" font-size="10.5" fill="#8a3a36" font-weight="bold">反色对称：把一种合法染色的两色互换仍是合法染色，且两者必不相同</text>
    <text x="46" y="356" font-size="10.5" fill="#8a3a36">⇒ 合法染色数一定是偶数 —— 题目输出里的 "1" 一次都不会出现，0 只可能来自孤立点</text>
    <text x="46" y="372" font-size="9.5" fill="#a06a66">于是答案只可能是：Brain Melt（有孤立点）/ 2（是星形图）/ Many（其余）</text>
  </g>
</svg>
