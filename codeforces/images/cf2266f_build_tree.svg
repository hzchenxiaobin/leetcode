<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="760" height="430" fill="#fafafa" filter="url(#rough2)"/>

  <text x="380" y="34" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">造出一个 3：构造树的叶子 = 被消耗的初始元素</text>

  <rect x="300" y="58" width="66" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="333" y="85" text-anchor="middle" font-size="16" fill="#7a5a10" filter="url(#rough2)">3</text>

  <path d="M314,100 L158,146" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M328,100 L268,146" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M354,100 L428,146" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="112" y="150" width="60" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="142" y="176" text-anchor="middle" font-size="15" fill="#3a5a2a" filter="url(#rough2)">0</text>
  <rect x="238" y="150" width="60" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="268" y="176" text-anchor="middle" font-size="15" fill="#3a5a2a" filter="url(#rough2)">1</text>
  <rect x="400" y="150" width="60" height="38" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="430" y="176" text-anchor="middle" font-size="15" fill="#8a2f2b" filter="url(#rough2)">2</text>

  <path d="M412,188 L362,246" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M448,188 L478,246" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="330" y="250" width="60" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="276" text-anchor="middle" font-size="15" fill="#3a5a2a" filter="url(#rough2)">0</text>
  <rect x="452" y="250" width="60" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="482" y="276" text-anchor="middle" font-size="15" fill="#3a5a2a" filter="url(#rough2)">1</text>

  <text x="530" y="140" font-size="12.5" fill="#8a2f2b" filter="url(#rough2)">节点 2 若不在初值里，</text>
  <text x="530" y="160" font-size="12.5" fill="#8a2f2b" filter="url(#rough2)">就得再补一份 0</text>
  <text x="530" y="180" font-size="12.5" fill="#8a2f2b" filter="url(#rough2)">和一份 1</text>
  <text x="530" y="264" font-size="12.5" fill="#3a5a2a" filter="url(#rough2)">绿色 = 叶子</text>
  <text x="530" y="284" font-size="12.5" fill="#3a5a2a" filter="url(#rough2)">（1 个初始元素）</text>

  <rect x="34" y="316" width="692" height="94" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="52" y="340" font-size="13" fill="#2c4a66" filter="url(#rough2)">叶子 j ≥ 2 只能用「初值恰为 j」的元素；叶子 0 / 1 可以由任意一个初始元素变成。</text>
  <text x="52" y="364" font-size="13" fill="#2c4a66" filter="url(#rough2)">全部展开时叶子数 = 2^(v−1)：造 v 的代价随 v 指数膨胀，所以高处的缺口几乎补不上。</text>
  <text x="52" y="388" font-size="13" fill="#2c4a66" filter="url(#rough2)">某层 j 已有现成副本时，整棵子树塌成 1 个叶子，白赚 2^(j−1) − 1 个元素。</text>
</svg>
