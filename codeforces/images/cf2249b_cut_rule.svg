<svg xmlns="http://www.w3.org/2000/svg" width="680" height="332" viewBox="0 0 680 332"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="332" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">切在 n 两侧：左边看前缀最大值，右边看后缀最大值</text>
  <text x="340" y="51" text-anchor="middle" font-size="11.5" fill="#888888"
        filter="url(#rough2)">示例 p = [2, 5, 1, 6, 3, 4]，n = 6 落在 pos = 4</text>
  <rect x="141.0" y="80.0" width="58.0" height="44.0" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170.0" y="108.0" text-anchor="middle" font-size="17" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="170.0" y="74.0" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">p[1]</text>
  <rect x="209.0" y="80.0" width="58.0" height="44.0" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="238.0" y="108.0" text-anchor="middle" font-size="17" fill="#446688" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="238.0" y="74.0" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">p[2]</text>
  <rect x="277.0" y="80.0" width="58.0" height="44.0" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="306.0" y="108.0" text-anchor="middle" font-size="17" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="306.0" y="74.0" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">p[3]</text>
  <rect x="345.0" y="80.0" width="58.0" height="44.0" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="374.0" y="108.0" text-anchor="middle" font-size="17" fill="#b85450" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="374.0" y="74.0" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">p[4]</text>
  <rect x="413.0" y="80.0" width="58.0" height="44.0" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="442.0" y="108.0" text-anchor="middle" font-size="17" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="442.0" y="74.0" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">p[5]</text>
  <rect x="481.0" y="80.0" width="58.0" height="44.0" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="510.0" y="108.0" text-anchor="middle" font-size="17" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="510.0" y="74.0" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">p[6]</text>
  <rect x="185.0" y="156.0" width="38.0" height="30.0" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="204.0" y="176.0" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="204.0" y="204.0" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">v[1]</text>
  <rect x="253.0" y="156.0" width="38.0" height="30.0" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="272.0" y="176.0" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="272.0" y="204.0" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">v[2]</text>
  <rect x="321.0" y="156.0" width="38.0" height="30.0" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="340.0" y="176.0" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="340.0" y="204.0" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">v[3]</text>
  <rect x="389.0" y="156.0" width="38.0" height="30.0" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="408.0" y="176.0" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="408.0" y="204.0" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">v[4]</text>
  <rect x="457.0" y="156.0" width="38.0" height="30.0" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="476.0" y="176.0" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="476.0" y="204.0" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">v[5]</text>
  <text x="340.0" y="230.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">i &lt; 4：右边含 n，min 取左边 → v[i] 就是前缀最大值，单调不减</text>
  <text x="340.0" y="252.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">i ≥ 4：左边含 n，min 取右边 → v[i] 就是后缀最大值，单调不增</text>
  <rect x="64.0" y="268.0" width="552.0" height="50.0" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="340.0" y="290.0" text-anchor="middle" font-size="13" fill="#8a6d20" font-weight="bold" filter="url(#rough2)">于是 a 必须「先单调不减、再单调不增」，且最大值恰好是 n − 1</text>
  <text x="340.0" y="309.0" text-anchor="middle" font-size="11" fill="#888888" filter="url(#rough2)">（含 n 的那一侧最大值为 n − 1，它必作为某个 a[i] 出现）</text>
</svg>
