<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
    <marker id="arrP" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect x="-8" y="-8" width="736" height="376" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">候选化简与双指针：只枚举奖励点对，O(m²)</text>
  <path d="M 120 42 Q 360 50 600 42" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- 左：固定 x 时 y 递增，指针右移 -->
  <text x="52" y="76" font-size="13" fill="#2b2b2b" filter="url(#rough2)">固定 x = p_i，让 y 扫过 p_1 … p_m：</text>

  <rect x="56" y="94" width="46" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="112" y="94" width="46" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="168" y="94" width="46" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="224" y="94" width="46" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="280" y="94" width="46" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="336" y="94" width="46" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="79" y="116" text-anchor="middle" font-size="12" fill="#2b4a66" filter="url(#rough2)">p₁</text>
  <text x="135" y="116" text-anchor="middle" font-size="12" fill="#2b4a66" filter="url(#rough2)">p₂</text>
  <text x="191" y="116" text-anchor="middle" font-size="12" fill="#2b4a66" filter="url(#rough2)">p₃</text>
  <text x="247" y="116" text-anchor="middle" font-size="12" fill="#8a6420" filter="url(#rough2)">p₄</text>
  <text x="303" y="116" text-anchor="middle" font-size="12" fill="#8a6420" filter="url(#rough2)">p₅</text>
  <text x="359" y="116" text-anchor="middle" font-size="12" fill="#8a6420" filter="url(#rough2)">p₆</text>

  <path d="M 60 144 L 378 144" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrP)" filter="url(#rough2)"/>
  <text x="200" y="162" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">j 增大 ⇒ s = x + p_j + 1 单调增</text>

  <path d="M 79 86 L 79 78" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 135 86 L 260 86" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="80" font-size="11" fill="#b85450" filter="url(#rough2)">奖励指针只右移</text>

  <!-- 右：rem 单调，跨 q 时归零 -->
  <rect x="404" y="66" width="284" height="112" rx="10" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="420" y="90" font-size="12" fill="#2b2b2b" filter="url(#rough2)">rem = s mod n 在同一个 q 内单调增</text>
  <text x="420" y="112" font-size="12" fill="#2b2b2b" filter="url(#rough2)">q 变化时（s 跨过 n）指针归零重扫</text>
  <text x="420" y="134" font-size="12" fill="#b85450" filter="url(#rough2)">每个 x 摊还 O(m) ⇒ 总 O(m²)</text>
  <text x="420" y="156" font-size="12" fill="#7a7a7a" filter="url(#rough2)">比较量只有 R(x) + R(y) − R(rem)，O(1)</text>

  <!-- 下：候选集合 -->
  <rect x="40" y="196" width="640" height="140" rx="12" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="60" y="222" font-size="13" fill="#2b4a66" filter="url(#rough2)">候选 1：x, y 都取奖励点 p_j（共 m² 对）</text>
  <text x="60" y="248" font-size="13" fill="#3a5f2c" filter="url(#rough2)">候选 2：互补对 (p_j, n − p_j)，覆盖 x + y = n 这一族</text>
  <text x="60" y="274" font-size="13" fill="#2b2b2b" filter="url(#rough2)">为什么够：固定 y 时 F 只在 x 撞到奖励点或跨过区间端点时才跳变，</text>
  <text x="60" y="296" font-size="13" fill="#2b2b2b" filter="url(#rough2)">端点 x = 1 代入恒为负（R 单调），故最大值必落在奖励点或互补点</text>
  <text x="60" y="322" font-size="13" fill="#b85450" filter="url(#rough2)">预处理前缀和 R，判断一对只要一次减法比较 ⇒ 稳过 2 s</text>
</svg>
