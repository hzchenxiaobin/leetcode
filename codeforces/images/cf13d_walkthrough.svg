<svg xmlns="http://www.w3.org/2000/svg" width="780" height="460" viewBox="0 0 780 460"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="780" height="460" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1：4 个红三角形里有 2 个是空的</text>
  <path d="M 170 40 Q 390 46 610 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 两个空三角形着色 -->
  <polygon points="110,400 450,60 280,270" fill="#d9ecd4" fill-opacity="0.75" stroke="none" filter="url(#rough2)"/>
  <polygon points="450,400 450,60 280,270" fill="#cfe0f5" fill-opacity="0.75" stroke="none" filter="url(#rough2)"/>

  <!-- 边 -->
  <g filter="url(#rough2)" stroke="#666666" stroke-width="1.4" fill="none">
    <line x1="110" y1="400" x2="450" y2="400"/>
    <line x1="450" y1="400" x2="450" y2="60"/>
    <line x1="450" y1="60" x2="110" y2="400"/>
    <line x1="110" y1="400" x2="280" y2="270"/>
    <line x1="450" y1="400" x2="280" y2="270"/>
    <line x1="450" y1="60" x2="280" y2="270"/>
  </g>

  <!-- 顶点 -->
  <circle cx="110" cy="400" r="4.5" fill="#8a6015" filter="url(#rough2)"/>
  <text x="88" y="424" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">A(0,0)</text>
  <circle cx="450" cy="400" r="4.5" fill="#8a6015" filter="url(#rough2)"/>
  <text x="458" y="424" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">B(10,0)</text>
  <circle cx="450" cy="60" r="4.5" fill="#8a6015" filter="url(#rough2)"/>
  <text x="458" y="56" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">C(10,10)</text>
  <circle cx="280" cy="270" r="4.5" fill="#8a6015" filter="url(#rough2)"/>
  <text x="222" y="268" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">D(5,4)</text>

  <!-- 蓝点 -->
  <circle cx="185" cy="370" r="6" fill="#b85450" filter="url(#rough2)"/>
  <text x="196" y="368" font-size="12" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">P(2,1)</text>

  <!-- 右侧结论 -->
  <rect x="500" y="70" width="256" height="220" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="514" y="96" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">逐个检查（i&lt;j&lt;k）</text>
  <text x="514" y="124" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">ABC：含 P，排除</text>
  <text x="514" y="150" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">ABD：含 P，排除</text>
  <text x="514" y="176" font-size="11.5" fill="#2f5223" filter="url(#rough2)">ACD：空，计数</text>
  <text x="514" y="202" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">BCD：空，计数</text>
  <text x="514" y="238" font-size="14" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">答案 = 2</text>
  <text x="514" y="268" font-size="10.5" fill="#9a7020" filter="url(#rough2)">绿、蓝两片就是空三角形</text>

  <text x="40" y="442" font-size="11.5" fill="#555555" filter="url(#rough2)">P 对 A→B、B→C、C→A 的叉积全为正，所以在 ABC 内部；但对 A→D 为负，所以不在 ACD 里。</text>
</svg>
