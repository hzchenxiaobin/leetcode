<svg xmlns="http://www.w3.org/2000/svg" width="840" height="440" viewBox="0 0 840 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="440" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1 走查：(?^?) 的两个叶子都是 0110</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">按笛卡尔积合成得到 { (0,0), (1,1) } = 1001，不含 (0,1)/(1,0) ⇒ NO</text>
  <text x="240" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">左叶 (a, a′)</text>
  <text x="440" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">右叶 (b, b′)</text>
  <text x="640" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">异或结果</text>
  <g filter="url(#rough2)"><line x1="150" y1="106" x2="750" y2="106" stroke="#c8a48a" stroke-width="1.1"/></g>
  <text x="240" y="136" text-anchor="middle" font-size="13" fill="#555555" filter="url(#rough2)">(0,1)</text>
  <text x="440" y="136" text-anchor="middle" font-size="13" fill="#555555" filter="url(#rough2)">(0,1)</text>
  <text x="640" y="136" text-anchor="middle" font-size="13" fill="#555555" filter="url(#rough2)">(0,0)</text>
  <text x="240" y="170" text-anchor="middle" font-size="13" fill="#555555" filter="url(#rough2)">(0,1)</text>
  <text x="440" y="170" text-anchor="middle" font-size="13" fill="#555555" filter="url(#rough2)">(1,0)</text>
  <text x="640" y="170" text-anchor="middle" font-size="13" fill="#555555" filter="url(#rough2)">(1,1)</text>
  <text x="240" y="204" text-anchor="middle" font-size="13" fill="#555555" filter="url(#rough2)">(1,0)</text>
  <text x="440" y="204" text-anchor="middle" font-size="13" fill="#555555" filter="url(#rough2)">(0,1)</text>
  <text x="640" y="204" text-anchor="middle" font-size="13" fill="#555555" filter="url(#rough2)">(1,1)</text>
  <text x="240" y="238" text-anchor="middle" font-size="13" fill="#555555" filter="url(#rough2)">(1,0)</text>
  <text x="440" y="238" text-anchor="middle" font-size="13" fill="#555555" filter="url(#rough2)">(1,0)</text>
  <text x="640" y="238" text-anchor="middle" font-size="13" fill="#555555" filter="url(#rough2)">(0,0)</text>
  <text x="420" y="300" text-anchor="middle" font-size="11.5" fill="#3d6b2f" filter="url(#rough2)">再做一次 (17, ?) 的对比：左子式 1001 &amp; 叶子 0110 = { (0,0), (0,1), (1,0) } ⇒ 含 (0,1) ⇒ YES</text>
  <g filter="url(#rough2)"><rect x="90" y="322" width="660" height="96" rx="4" fill="#faf3ec" fill-opacity="0.85" stroke="#c8a48a" stroke-width="1.3"/></g>
  <text x="420" y="348" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a4b2a" filter="url(#rough2)">结论对照</text>
  <text x="420" y="374" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">? ⇒ 0110 ⇒ YES     |     (?^?) ⇒ 1001 ⇒ NO     |     ((?^?)&amp;?) ⇒ 1110 ⇒ YES</text>
  <text x="420" y="400" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">与三个官方样例的答案 NO / YES / YES 一致</text>
</svg>
