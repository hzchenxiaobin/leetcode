<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="760" height="480" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：找一棵「非单点树」当 hub，再挑一个游离点 r</text>
  <path d="M 90 42 Q 380 49 670 42" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <rect x="270" y="58" width="220" height="38" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="82" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">读入 k 棵树，建邻接表</text>

  <path d="M 380 98 L 380 112" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <polygon points="380,116 500,154 380,192 260,154" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="380" y="152" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">存在 n ≥ 2 的树？</text>
  <text x="380" y="171" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">（有边即有游离点）</text>

  <path d="M 260 154 L 196 154 L 196 206" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="228" y="146" text-anchor="middle" font-size="12" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">是</text>

  <path d="M 500 154 L 566 154 L 566 206" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="532" y="146" text-anchor="middle" font-size="12" font-weight="bold" fill="#a14340" filter="url(#rough2)">否</text>

  <rect x="46" y="210" width="300" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="196" y="236" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">hub = 这棵 n ≥ 2 的树（任取一棵即可）</text>

  <path d="M 196 252 L 196 274" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="46" y="278" width="300" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="196" y="301" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">树形 DP 求出一个最大独立集 X</text>
  <text x="196" y="322" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">r = 第一个不在 X 中的顶点（必然存在）</text>

  <rect x="470" y="210" width="240" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="590" y="233" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">全是单点树：hub = 1 号树</text>
  <text x="590" y="254" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">r = 1（它唯一顶点）→ 得 S − 1</text>

  <path d="M 196 334 L 196 356 L 380 356 L 380 372" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 590 266 L 590 330 L 470 330 L 470 372" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="196" y="378" width="368" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="400" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">其余每棵树挑自己的 1 号点，连到 (hub, r)</text>
  <text x="380" y="421" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">按编号顺序输出恰好 k − 1 条边</text>

  <text x="380" y="456" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">两种情形都是同一个构造：中心为 (hub, r) 的「块级星形」，总复杂度 O(Σn + Σk)。</text>
</svg>
