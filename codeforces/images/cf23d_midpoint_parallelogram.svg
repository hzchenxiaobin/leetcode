<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 0 780 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="501"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="780" height="440" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">四条边的中点必构成平行四边形：缺的那个可以被补出来</text>

  <!-- 四边形 -->
  <polygon points="90,110 340,70 470,220 200,310" fill="#eef4ff" stroke="#446688" stroke-width="1.8"
           filter="url(#rough2)"/>
  <circle cx="90" cy="110" r="5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="340" cy="70" r="5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="470" cy="220" r="5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="200" cy="310" r="5" fill="#446688" filter="url(#rough2)"/>

  <text x="74" y="104" font-size="13" fill="#23405c" filter="url(#rough2)">A</text>
  <text x="346" y="62" font-size="13" fill="#23405c" filter="url(#rough2)">B</text>
  <text x="478" y="216" font-size="13" fill="#23405c" filter="url(#rough2)">C</text>
  <text x="186" y="330" font-size="13" fill="#23405c" filter="url(#rough2)">D</text>

  <!-- 中点 -->
  <circle cx="215" cy="90" r="6" fill="#b85450" stroke="#8c3b37" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="405" cy="145" r="6" fill="#b85450" stroke="#8c3b37" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="335" cy="265" r="6" fill="#b85450" stroke="#8c3b37" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="145" cy="210" r="6" fill="#b85450" stroke="#8c3b37" stroke-width="1.2" filter="url(#rough2)"/>

  <text x="222" y="80" font-size="11" fill="#8c3b37" filter="url(#rough2)">M1</text>
  <text x="412" y="138" font-size="11" fill="#8c3b37" filter="url(#rough2)">M2</text>
  <text x="342" y="284" font-size="11" fill="#8c3b37" filter="url(#rough2)">M3</text>
  <text x="128" y="202" font-size="11" fill="#8c3b37" filter="url(#rough2)">M4</text>

  <!-- 平行四边形 -->
  <polygon points="215,90 405,145 335,265 145,210" fill="none" stroke="#c0392b" stroke-width="1.8"
           stroke-dasharray="6 4" filter="url(#rough2)"/>

  <!-- 右侧公式 -->
  <rect x="510" y="76" width="236" height="150" rx="10" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="526" y="102" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">中点公式给出</text>
  <text x="526" y="128" font-size="13" fill="#8a6015" filter="url(#rough2)">M1 + M3 = M2 + M4</text>
  <text x="526" y="152" font-size="11" fill="#7a5a1b" filter="url(#rough2)">即对角线互相平分 → 平行四边形</text>
  <text x="526" y="180" font-size="11" fill="#7a5a1b" filter="url(#rough2)">给定 P, Q, R，第四个只可能是</text>
  <text x="526" y="204" font-size="11.5" fill="#8c3b37" filter="url(#rough2)">P+Q-R、P+R-Q、Q+R-P</text>

  <!-- 说明 -->
  <rect x="510" y="244" width="236" height="118" rx="10" fill="#eef4ff" stroke="#446688"
        stroke-width="1.3" filter="url(#rough2)"/>
  <text x="526" y="268" font-size="11" fill="#23405c" filter="url(#rough2)">三种补全分别对应"哪个点是</text>
  <text x="526" y="288" font-size="11" fill="#23405c" filter="url(#rough2)">平行四边形的中间顶点"。</text>
  <text x="526" y="314" font-size="11" fill="#23405c" filter="url(#rough2)">样例 1 三点共线 → 平行四边形</text>
  <text x="526" y="334" font-size="11" fill="#23405c" filter="url(#rough2)">退化 → 直接 NO。</text>

  <text x="60" y="368" font-size="11.5" fill="#555" filter="url(#rough2)">对角线 M1M3 与 M2M4 的交点就是"四个顶点的重心" (A+B+C+D)/4，两条对角线互相平分。</text>
  <text x="60" y="392" font-size="11.5" fill="#8c3b37" filter="url(#rough2)">红色虚线的平行四边形与蓝四边形边长无关：它只由"中点"决定，是本题全部结构的来源。</text>
  <text x="60" y="414" font-size="11.5" fill="#666" filter="url(#rough2)">注意：给定三个中点后，四边形仍不唯一（还差一个自由度），要靠"三条边等长"把它定死。</text>
</svg>
