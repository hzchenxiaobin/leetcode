<svg xmlns="http://www.w3.org/2000/svg" width="740" height="380" viewBox="0 0 740 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="53"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="740" height="380" fill="#fafafa"/>
  <text x="370" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每个年份长度唯一写成 L = s·q²（s 无平方因子）</text>
  <path d="M 170 46 Q 370 52 570 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="50" y="82" width="86" height="52" rx="8" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="93" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">L = 25</text>
  <text x="93" y="126" text-anchor="middle" font-size="10" font-weight="normal" fill="#777" filter="url(#rough2)">年份天数</text>
  <line x1="140" y1="108" x2="196" y2="108" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="204" y="82" width="170" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="289" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1 · 5²</text>
  <line x1="382" y1="108" x2="438" y2="108" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="446" y="82" width="240" height="52" rx="8" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="566" y="114" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#2b2b2b" filter="url(#rough2)">1 个月 × 25 天</text>
  <rect x="50" y="152" width="86" height="52" rx="8" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="93" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">L = 27</text>
  <text x="93" y="196" text-anchor="middle" font-size="10" font-weight="normal" fill="#777" filter="url(#rough2)">年份天数</text>
  <line x1="140" y1="178" x2="196" y2="178" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="204" y="152" width="170" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="289" y="184" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3 · 3²</text>
  <line x1="382" y1="178" x2="438" y2="178" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="446" y="152" width="240" height="52" rx="8" fill="#ffffff" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="566" y="184" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#2b2b2b" filter="url(#rough2)">3 个月 × 9 天</text>
  <rect x="50" y="222" width="86" height="52" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="93" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">L = 54</text>
  <text x="93" y="266" text-anchor="middle" font-size="10" font-weight="normal" fill="#777" filter="url(#rough2)">年份天数</text>
  <line x1="140" y1="248" x2="196" y2="248" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="204" y="222" width="170" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="289" y="254" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">6 · 3²</text>
  <line x1="382" y1="248" x2="438" y2="248" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="446" y="222" width="240" height="52" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="566" y="254" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#2b2b2b" filter="url(#rough2)">6 个月 × 9 天</text>
  <rect x="50" y="292" width="86" height="52" rx="8" fill="#ffffff" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="93" y="318" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">L = 26</text>
  <text x="93" y="336" text-anchor="middle" font-size="10" font-weight="normal" fill="#777" filter="url(#rough2)">年份天数</text>
  <line x1="140" y1="318" x2="196" y2="318" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="204" y="292" width="170" height="52" rx="8" fill="#fdecea" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="289" y="324" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">26 · 1²</text>
  <line x1="382" y1="318" x2="438" y2="318" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="446" y="292" width="240" height="52" rx="8" fill="#ffffff" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="566" y="324" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#2b2b2b" filter="url(#rough2)">26 个月 × 1 天</text>
  <rect x="50" y="352" width="636" height="20" rx="6" fill="#fafafa" stroke="#cfcfcf" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="366" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555" filter="url(#rough2)">月数 = L / q² = s，正好等于无平方因子部分</text>
</svg>
