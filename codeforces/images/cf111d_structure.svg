<svg xmlns="http://www.w3.org/2000/svg" width="740" height="320" viewBox="0 0 740 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1121"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="740" height="320" fill="#fafafa"/>
  <text x="370.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">条件推出结构</text>
  <path d="M 118.4 42 Q 370.0 48 621.6 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="370.0" y="306" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">所有前缀的颜色数必须恒等于 t = |C₁|</text>
  <rect x="60" y="70" width="180" height="100" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">第 1 列</text>
  <text x="150" y="130" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">C₁（恰好 t 色）</text>
  <text x="150" y="155" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">列宽 n</text>
  <rect x="270" y="70" width="180" height="100" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">中间列</text>
  <text x="360" y="130" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">⊆ C₁ ∩ Cₘ</text>
  <text x="360" y="155" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">列宽 n</text>
  <rect x="480" y="70" width="180" height="100" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="570" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#5a7fb0" filter="url(#rough2)">第 m 列</text>
  <text x="570" y="130" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">Cₘ（恰好 t 色）</text>
  <text x="570" y="155" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">列宽 n</text>
  <text x="360" y="195" text-anchor="middle" font-size="12" fill="#335478" filter="url(#rough2)">|L_c| 单调不减、|R_c| 单调不增，二者恒等 ⇒ 恒为 t</text>
  <text x="360" y="225" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">⇒ 中间列不能引入 C₁ 之外的颜色，也不能引入 Cₘ 之外的颜色</text>
  <text x="360" y="255" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">⇒ 中间列只能用交集 C₁ ∩ Cₘ（设大小 s），每列 sⁿ 种</text>
  <text x="360" y="285" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">两端列必须用满各自的 t 种颜色：surj(n,t)² 种</text>
</svg>
