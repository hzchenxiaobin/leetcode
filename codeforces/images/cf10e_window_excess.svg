<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c9801f"/>
    </marker>
  </defs>

  <rect width="760" height="420" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="38" text-anchor="middle" font-size="18.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">核心观察：T = a_i + s，且最优解只用比 a_i 小的硬币</text>
  <path d="M 152 50 Q 380 56 608 50" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60" y="84" width="640" height="62" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="76" y="112" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">贪心在 T 处先拿 a_i（即 a_i &lt;= T &lt; a_{i-1}），剩下 s = T - a_i 继续贪心；</text>
  <text x="76" y="134" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">最优解若用了 &gt;= a_i 的硬币，把它去掉就得到更小的反例 —— 与 T 的最小性矛盾。</text>
  <rect x="60" y="176" width="640" height="96" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="76" y="204" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">因此最优解全部用 a_{i+1}..a_n，设用了 k 枚、和为 T：</text>
  <text x="76" y="232" text-anchor="start" font-size="13" fill="#2f5223" font-weight="bold" filter="url(#rough2)">T = k + Σ(每枚硬币的“超出量”) ，超出量 = 币值 - 1</text>
  <text x="76" y="258" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">要求 k &lt;= 贪心枚数 - 1，于是 Σ(币值-1) &gt;= a_i  —— 这就是“超出量”判据。</text>
  <rect x="60" y="296" width="300" height="84" rx="10" fill="#fff3e0" stroke="#c9801f" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="210" y="322" text-anchor="middle" font-size="12.5" fill="#a8641a" font-weight="bold" filter="url(#rough2)">贪心：1 + s 枚（全是 1）</text>
  <text x="210" y="346" text-anchor="middle" font-size="11.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">只要 s &lt; a_{i+1}，尾部的贪心</text>
  <text x="210" y="366" text-anchor="middle" font-size="11.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">就只能是 s 枚 1</text>
  <rect x="400" y="296" width="300" height="84" rx="10" fill="#fdecea" stroke="#b6483f" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="550" y="322" text-anchor="middle" font-size="12.5" fill="#b6483f" font-weight="bold" filter="url(#rough2)">若尾部还有更优的贪心</text>
  <text x="550" y="346" text-anchor="middle" font-size="11.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">（s &gt;= a_{i+1}），判据要更严：</text>
  <text x="550" y="366" text-anchor="middle" font-size="11.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">还要真的比贪心少</text>
  <text x="60" y="404" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">所以答案 = 每个窗口 i 里最小的 T，使“用 a_{i+1}.. 表示的枚数” &lt; 贪心枚数。</text>
</svg>
