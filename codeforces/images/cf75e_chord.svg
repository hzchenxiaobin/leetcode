<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr75e" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="720" height="360" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">穿越点 A、B 在边上滑动：F = |SA| + 2|AB| + |BE| 是凸函数</text>

  <!-- 岛 -->
  <polygon points="300,120 430,100 520,170 500,280 360,300 270,220" fill="#dfe9f2" fill-opacity="0.85"
           stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- 路径 -->
  <g filter="url(#rough2)">
    <path d="M120 292 L285 175" stroke="#4a7a3a" stroke-width="2.4" fill="none"/>
    <path d="M285 175 L430 290" stroke="#b85450" stroke-width="4" fill="none"/>
    <path d="M430 290 L640 84" stroke="#4a7a3a" stroke-width="2.4" fill="none"/>
  </g>
  <!-- 备选位置 A' -->
  <g filter="url(#rough2)" stroke="#9aa4ac" stroke-width="1.5" fill="none" stroke-dasharray="5 4">
    <path d="M120 292 L322 130"/>
    <path d="M322 130 L430 290"/>
  </g>

  <!-- 点 -->
  <g filter="url(#rough2)">
    <circle cx="120" cy="292" r="6" fill="#2b3a4a"/>
    <circle cx="640" cy="84" r="6" fill="#2b3a4a"/>
    <circle cx="285" cy="175" r="5.5" fill="#b85450"/>
    <circle cx="430" cy="290" r="5.5" fill="#b85450"/>
    <circle cx="322" cy="130" r="4.5" fill="#9aa4ac"/>
  </g>
  <g font-size="12.5" fill="#2b3a2a" filter="url(#rough2)">
    <text x="98" y="314">S</text>
    <text x="650" y="76">E</text>
    <text x="252" y="168" fill="#7a2f2c">A</text>
    <text x="436" y="312" fill="#7a2f2c">B</text>
    <text x="300" y="118" fill="#6b6b66">A&apos;</text>
  </g>

  <!-- 标注 -->
  <text x="150" y="238" font-size="11.5" fill="#2f5223" filter="url(#rough2)">海面 |SA|，单价 1</text>
  <text x="330" y="220" font-size="11.5" fill="#7a2f2c" filter="url(#rough2)">岛内 2|AB|，单价 2</text>
  <text x="520" y="230" font-size="11.5" fill="#2f5223" filter="url(#rough2)">海面 |BE|，单价 1</text>

  <!-- 滑动箭头 -->
  <path d="M278 190 L316 142" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr75e)"
        filter="url(#rough2)"/>
  <text x="330" y="160" font-size="11" fill="#7a2f2c" filter="url(#rough2)">A 往上滑：|SA| 变长、|AB| 变短</text>

  <g filter="url(#rough2)">
    <rect x="40" y="322" width="640" height="28" rx="6" fill="#fcfcfa" stroke="#c8c2b6" stroke-width="1.2"/>
  </g>
  <text x="360" y="341" text-anchor="middle" font-size="12" fill="#33475c" filter="url(#rough2)">每条边上 F 都是凸函数 ⇒ 外层对 A 三分、内层对 B 三分，即可求到全局最小</text>
</svg>
