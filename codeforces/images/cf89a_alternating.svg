<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="891"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="320" fill="#fafafa"/>
  <text x="360.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">相邻和不变 ⇒ 状态交替增减</text>
  <path d="M 115.2 42 Q 360.0 48 604.8 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="360.0" y="306" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">bᵢ = aᵢ + (-1)^(i-1)·t</text>
  <rect x="60" y="96" width="90" height="66" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="105" y="124" text-anchor="middle" font-size="12.5" fill="#2f5223" filter="url(#rough2)">a1 = 4</text>
  <text x="105" y="148" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5223" filter="url(#rough2)">+t</text>
  <rect x="170" y="96" width="90" height="66" rx="7" fill="#fbeadb" stroke="#d98c3f" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="215" y="124" text-anchor="middle" font-size="12.5" fill="#9a5d1c" filter="url(#rough2)">a2 = 1</text>
  <text x="215" y="148" text-anchor="middle" font-size="14" font-weight="bold" fill="#9a5d1c" filter="url(#rough2)">−t</text>
  <line x1="150.0" y1="129.0" x2="168.0" y2="129.0" stroke="#bdbdb5" stroke-width="1.6" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <rect x="280" y="96" width="90" height="66" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="325" y="124" text-anchor="middle" font-size="12.5" fill="#2f5223" filter="url(#rough2)">a3 = 3</text>
  <text x="325" y="148" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5223" filter="url(#rough2)">+t</text>
  <line x1="260.0" y1="129.0" x2="278.0" y2="129.0" stroke="#bdbdb5" stroke-width="1.6" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <rect x="390" y="96" width="90" height="66" rx="7" fill="#fbeadb" stroke="#d98c3f" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="435" y="124" text-anchor="middle" font-size="12.5" fill="#9a5d1c" filter="url(#rough2)">a4 = 2</text>
  <text x="435" y="148" text-anchor="middle" font-size="14" font-weight="bold" fill="#9a5d1c" filter="url(#rough2)">−t</text>
  <line x1="370.0" y1="129.0" x2="388.0" y2="129.0" stroke="#bdbdb5" stroke-width="1.6" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <rect x="500" y="96" width="90" height="66" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="545" y="124" text-anchor="middle" font-size="12.5" fill="#2f5223" filter="url(#rough2)">a5 = 5</text>
  <text x="545" y="148" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5223" filter="url(#rough2)">+t</text>
  <line x1="480.0" y1="129.0" x2="498.0" y2="129.0" stroke="#bdbdb5" stroke-width="1.6" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <text x="360" y="78" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">奇数格 +t，偶数格 −t（t 为第 1 格的变化量）</text>
  <rect x="60" y="194" width="600" height="44" rx="9" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="213" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">偷走总数 = Σa − Σb = −t·Σ(−1)^(i−1) = −t（n 为奇数）或 0（n 为偶数）</text>
  <rect x="60" y="250" width="600" height="40" rx="9" fill="#fbeeee" stroke="#a05a5a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="275" text-anchor="middle" font-size="12.5" fill="#6b3030" filter="url(#rough2)">n 为偶数时 0；n 为奇数时答案受 |t| ≤ min(奇数格 aᵢ) 限制</text>
</svg>
