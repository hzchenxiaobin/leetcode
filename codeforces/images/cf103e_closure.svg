<svg xmlns="http://www.w3.org/2000/svg" width="884" height="412" viewBox="0 0 884 412"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="103"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/></marker>
  </defs>
  <rect width="884" height="412" fill="#fafafa"/>
  <text x="442" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">完美匹配 → 闭合约束 i → match[e]</text>
  <text x="442" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">Hall 条件保证匹配存在；可行集合 = 闭合集</text>
  <g filter="url(#rough2)"><rect x="98" y="90" width="104" height="40" rx="4" fill="#f6e3c4" fill-opacity="0.6" stroke="#c9a86a" stroke-width="1.3"/></g>
  <text x="150" y="115" text-anchor="middle" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">集合 1</text>
  <g filter="url(#rough2)"><circle cx="560" cy="110" r="20" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="560" y="115" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">e1</text>
  <g filter="url(#rough2)"><rect x="98" y="160" width="104" height="40" rx="4" fill="#f6e3c4" fill-opacity="0.6" stroke="#c9a86a" stroke-width="1.3"/></g>
  <text x="150" y="185" text-anchor="middle" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">集合 2</text>
  <g filter="url(#rough2)"><circle cx="560" cy="180" r="20" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="560" y="185" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">e2</text>
  <g filter="url(#rough2)"><rect x="98" y="230" width="104" height="40" rx="4" fill="#f6e3c4" fill-opacity="0.6" stroke="#c9a86a" stroke-width="1.3"/></g>
  <text x="150" y="255" text-anchor="middle" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">集合 3</text>
  <g filter="url(#rough2)"><circle cx="560" cy="250" r="20" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="560" y="255" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">e3</text>
  <g filter="url(#rough2)"><line x1="204" y1="110" x2="538" y2="110" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrg)"/></g>
  <g filter="url(#rough2)"><line x1="204" y1="180" x2="538" y2="180" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrg)"/></g>
  <g filter="url(#rough2)"><line x1="204" y1="250" x2="538" y2="250" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrg)"/></g>
  <text x="340" y="104" text-anchor="middle" font-size="11" fill="#3d6b2f" filter="url(#rough2)">匹配（Hall 保证）</text>
  <g filter="url(#rough2)"><path d="M 150 92 C 90 60, 90 160, 148 160" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrr)" stroke-dasharray="6 4"/></g>
  <text x="96" y="142" text-anchor="end" font-size="10.5" fill="#8a2b28" filter="url(#rough2)">S1 含 e2</text>
  <text x="96" y="162" text-anchor="end" font-size="10.5" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">⇒ S1 → S2</text>
  <text x="700" y="120" text-anchor="middle" font-size="11" fill="#8a2b28" filter="url(#rough2)">若选了 S1 就必须选 S2</text>
  <text x="700" y="146" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">这类边做成 ∞ 容量</text>
  <text x="442" y="318" text-anchor="middle" font-size="12" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">T 合法 ⟺ 对每个 i∈T、每个 e∈S_i 都有 match[e]∈T（闭合）</text>
  <text x="442" y="346" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">（此时 N(T) ⊆ match(T) 且 |N(T)| ≥ |T|，故等号成立）</text>
  <text x="442" y="380" text-anchor="middle" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">问题变成：在有向图上选一个闭合集，使点权和最小（价格可负）</text>
</svg>
