<svg xmlns="http://www.w3.org/2000/svg" width="740" height="360" viewBox="0 0 740 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="43"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="740" height="360" fill="#fafafa"/>
  <text x="370" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">排序后累加：到达时刻 = 发车 + x + 前面各站的延时</text>
  <path d="M 180 46 Q 370 52 560 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="52" y="76" width="250" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="66" y="105" text-anchor="start" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">第 1 站 x=4，1 人</text>
  <rect x="316" y="76" width="216" height="46" rx="8" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="330" y="105" text-anchor="start" font-size="11.5" font-weight="normal" fill="#2f4a66" filter="url(#rough2)">T = T0 + 4 + 0</text>
  <rect x="546" y="76" width="140" height="46" rx="8" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.3" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="616" y="105" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#8a6015" filter="url(#rough2)">delay ← 1</text>
  <rect x="52" y="138" width="250" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="66" y="167" text-anchor="start" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">第 2 站 x=6，1 人</text>
  <rect x="316" y="138" width="216" height="46" rx="8" fill="#ffffff" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="330" y="167" text-anchor="start" font-size="11.5" font-weight="normal" fill="#2f4a66" filter="url(#rough2)">T = T0 + 6 + 1</text>
  <rect x="546" y="138" width="140" height="46" rx="8" fill="#fafafa" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="616" y="167" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#8a6015" filter="url(#rough2)">delay ← 2</text>
  <rect x="52" y="200" width="250" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="66" y="229" text-anchor="start" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">第 3 站 x=13，2 人</text>
  <rect x="316" y="200" width="216" height="46" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="330" y="229" text-anchor="start" font-size="11.5" font-weight="normal" fill="#2f4a66" filter="url(#rough2)">T = T0 + 13 + 2</text>
  <rect x="546" y="200" width="140" height="46" rx="8" fill="#fafafa" stroke="#446688" stroke-width="1.3" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="616" y="229" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#8a6015" filter="url(#rough2)">delay ← 4</text>
  <rect x="52" y="262" width="250" height="46" rx="8" fill="#fdecea" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="66" y="291" text-anchor="start" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">掉头返回 x=0</text>
  <rect x="316" y="262" width="216" height="46" rx="8" fill="#ffffff" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="330" y="291" text-anchor="start" font-size="11.5" font-weight="normal" fill="#2f4a66" filter="url(#rough2)">T = T0 + 26 + 4</text>
  <rect x="546" y="262" width="140" height="46" rx="8" fill="#fafafa" stroke="#b85450" stroke-width="1.3" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="616" y="291" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#8a6015" filter="url(#rough2)">车可用</text>
  <text x="52" y="322" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555" filter="url(#rough2)">示例：样例 4 的第一批，T0 = 36，按 x 升序 4 → 6 → 13。</text>
</svg>
