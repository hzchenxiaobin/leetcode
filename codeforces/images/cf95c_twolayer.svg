<svg xmlns="http://www.w3.org/2000/svg" width="780" height="430" viewBox="0 0 780 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="199"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="780" height="430" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两层建模：先算“路网距离”，再在“出租车跳跃图”上跑最短路</text>
  <path d="M 156 39 Q 390 45 624 39" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="30" y="54" width="340" height="40" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="46" y="80" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">第一层：路网（无向、带权，m ≤ 1000）</text>
  <line x1="90" y1="130" x2="240" y2="110" stroke="#9bb3cc" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="90" y1="130" x2="170" y2="200" stroke="#9bb3cc" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="240" y1="110" x2="170" y2="200" stroke="#9bb3cc" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="240" y1="110" x2="320" y2="190" stroke="#9bb3cc" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="90" cy="130" r="17" fill="#dcebfb" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90" y="135" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">1</text>
  <circle cx="240" cy="110" r="17" fill="#dcebfb" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="240" y="115" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">2</text>
  <circle cx="320" cy="190" r="17" fill="#dcebfb" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">3</text>
  <circle cx="170" cy="200" r="17" fill="#dcebfb" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="205" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">4</text>
  <text x="46" y="236" text-anchor="start" font-size="12" fill="#2f4a66" filter="url(#rough2)">以每个顶点为源跑一次 Dijkstra ⇒ dist(i, j)</text>
  <rect x="30" y="258" width="340" height="54" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="46" y="282" text-anchor="start" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">复杂度 O(n·m log n)：n = m = 1000 时约 10⁷</text>
  <text x="46" y="302" text-anchor="start" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">即使 m 很小（≤ 1000），也完全够用</text>
  <rect x="410" y="54" width="340" height="40" rx="8" fill="#e9f4ec" stroke="#3f6b4a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="426" y="80" text-anchor="start" font-size="12.5" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">第二层：出租车跳跃 i → j（花费 c_i）</text>
  <circle cx="470" cy="130" r="17" fill="#e2f1e6" stroke="#3f6b4a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470" y="135" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">1</text>
  <circle cx="620" cy="110" r="17" fill="#e2f1e6" stroke="#3f6b4a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="620" y="115" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">2</text>
  <circle cx="700" cy="190" r="17" fill="#e2f1e6" stroke="#3f6b4a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="700" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">3</text>
  <circle cx="550" cy="200" r="17" fill="#e2f1e6" stroke="#3f6b4a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="550" y="205" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">4</text>
  <line x1="470" y1="130" x2="620" y2="110" stroke="#3f6b4a" stroke-width="1.9" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <line x1="620" y1="110" x2="700" y2="190" stroke="#3f6b4a" stroke-width="1.9" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <line x1="470" y1="130" x2="700" y2="190" stroke="#c9e2d0" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <text x="430" y="236" text-anchor="start" font-size="12" fill="#3f6b4a" filter="url(#rough2)">若 dist(i,j) ≤ t_i，就连一条花费 c_i 的有向边</text>
  <rect x="410" y="258" width="340" height="54" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="426" y="282" text-anchor="start" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">在这张图上从 x 跑 Dijkstra，到 y 的距离就是答案</text>
  <text x="426" y="302" text-anchor="start" font-size="11.5" fill="#5b5b5b" filter="url(#rough2)">（走不通输出 −1）</text>
  <rect x="30" y="330" width="720" height="66" rx="8" fill="#f7ecec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="46" y="354" text-anchor="start" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">为什么不能直接在路网上跑最短路：换乘出租车的“代价”只与上车点有关，</text>
  <text x="46" y="376" text-anchor="start" font-size="12" fill="#8a3b37" filter="url(#rough2)">一次跳跃可以跨很多条路；所以必须先把“一次能到哪”算清楚，再做第二层最短路。</text>
</svg>
