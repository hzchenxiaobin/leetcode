<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="400" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="38" text-anchor="middle" font-size="18.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">37A：相同的长度才能叠在一起</text>
  <path d="M 137 50 Q 380 56 623 50" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="90" y="280" width="90" height="30" rx="6" fill="#fff3e0" stroke="#c9801f" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="135" y="301" text-anchor="middle" font-size="13" fill="#c9801f" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="90" y="246" width="90" height="30" rx="6" fill="#fff3e0" stroke="#c9801f" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="135" y="267" text-anchor="middle" font-size="13" fill="#c9801f" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="135" y="336" text-anchor="middle" font-size="12" fill="#c9801f" font-weight="normal" filter="url(#rough2)">高度 2</text>
  <rect x="230" y="280" width="90" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="275" y="301" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="275" y="336" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="normal" filter="url(#rough2)">高度 1</text>
  <rect x="370" y="280" width="90" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="415" y="301" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="415" y="336" text-anchor="middle" font-size="12" fill="#446688" font-weight="normal" filter="url(#rough2)">高度 1</text>
  <text x="60" y="90" text-anchor="start" font-size="13" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">把同长度的木头摞成一摞：</text>
  <text x="60" y="116" text-anchor="start" font-size="12.5" fill="#2f4a66" font-weight="normal" filter="url(#rough2)">· 摞数 = 不同长度的个数（每种长度至少一摞）</text>
  <text x="60" y="142" text-anchor="start" font-size="12.5" fill="#2f4a66" font-weight="normal" filter="url(#rough2)">· 最高摞 = 出现次数最多的那种长度的个数</text>
  <text x="60" y="168" text-anchor="start" font-size="12.5" fill="#2f5223" font-weight="bold" filter="url(#rough2)">每根木头恰好用一次 ⇒ 塔数 = 不同长度数，最高塔 = 最大频数。</text>
  <rect x="60" y="186" width="640" height="54" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="72" y="208" text-anchor="start" font-size="12.5" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">输出顺序：先“最大塔高”，再“塔的总数”。</text>
  <text x="72" y="230" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">样例 2：6 5 6 7 → 频数 {6:2, 5:1, 7:1} → 输出 2 3。</text>
</svg>
