<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="287"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="350" fill="#fafafa"/>
  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">颜色数：1 / 2 / 3，由 S 的质数性决定</text>
  <path d="M 140 40 Q 380 46 620 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60" y="80" width="300" height="42" rx="8" fill="#d9ecd4" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="76" y="107" font-size="12" fill="#2b2b2b" filter="url(#rough2)">S 是质数</text>
  <text x="380" y="107" font-size="12" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">1 色</text>
  <rect x="60" y="132" width="300" height="42" rx="8" fill="#cfe0f5" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="76" y="159" font-size="12" fill="#2b2b2b" filter="url(#rough2)">S 是偶数</text>
  <text x="380" y="159" font-size="12" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">2 色（哥德巴赫）</text>
  <rect x="60" y="184" width="300" height="42" rx="8" fill="#cfe0f5" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="76" y="211" font-size="12" fill="#2b2b2b" filter="url(#rough2)">S 奇且 S-2 是质数</text>
  <text x="380" y="211" font-size="12" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">2 色（2 + S-2）</text>
  <rect x="60" y="236" width="300" height="42" rx="8" fill="#fbe3c8" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="76" y="263" font-size="12" fill="#2b2b2b" filter="url(#rough2)">其余（S 奇、S-2 非质）</text>
  <text x="380" y="263" font-size="12" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">3 色（3 + 哥德巴赫）</text>
  <text x="60" y="320" font-size="11.5" fill="#555555" filter="url(#rough2)">S = n(n+1)/2 ≤ 1.8×10^7，范围内哥德巴赫已被完全验证。</text>

</svg>
