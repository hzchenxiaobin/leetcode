<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="113"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="720" height="340" fill="#fafafa"/>
  <text x="360.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">栈顶与新字符只有两种关系</text>
  <path d="M 115.2 42 Q 360.0 48 604.8 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="360.0" y="326" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">压栈 or 弹栈，连锁消去自动完成</text>
  <rect x="36" y="70" width="300" height="170" rx="10" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="186" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">栈顶 ≠ 新字符：压栈</text>
  <rect x="70" y="116" width="34" height="34" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="87" y="139" text-anchor="middle" font-size="14" fill="#2f5223" filter="url(#rough2)">w</text>
  <rect x="110" y="116" width="34" height="34" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="127" y="139" text-anchor="middle" font-size="14" fill="#2f5223" filter="url(#rough2)">a</text>
  <text x="186" y="138" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">栈：w a</text>
  <path d="M 186 156 L 186 182" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <rect x="120" y="188" width="130" height="34" rx="7" fill="#f7f7f2" stroke="#8a8a8a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="185" y="211" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">读入 r</text>
  <text x="186" y="262" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">r ≠ a → 压栈，变成 w a r</text>
  <rect x="384" y="70" width="300" height="170" rx="10" fill="#ffffff" stroke="#a05a5a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="534" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#6b3030" filter="url(#rough2)">栈顶 == 新字符：弹栈</text>
  <rect x="418" y="116" width="34" height="34" rx="7" fill="#fbeeee" stroke="#a05a5a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="435" y="139" text-anchor="middle" font-size="14" fill="#6b3030" filter="url(#rough2)">r</text>
  <rect x="458" y="116" width="34" height="34" rx="7" fill="#fbeeee" stroke="#a05a5a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="475" y="139" text-anchor="middle" font-size="14" fill="#6b3030" filter="url(#rough2)">e</text>
  <text x="534" y="138" text-anchor="middle" font-size="12" fill="#6b3030" filter="url(#rough2)">栈：r e</text>
  <path d="M 534 156 L 534 182" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <rect x="468" y="188" width="130" height="34" rx="7" fill="#f7f7f2" stroke="#8a8a8a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="533" y="211" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">读入 e</text>
  <text x="534" y="262" text-anchor="middle" font-size="11.5" fill="#6b3030" filter="url(#rough2)">e == 栈顶 → 弹出，回到 r</text>
  <rect x="36" y="284" width="648" height="40" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="310" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">连锁：reallazy → 消 ll → reaazy → 消 aa → rezy（两次弹栈）</text>
</svg>
