<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="29"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="360" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">反复除以 k：除到 1 就属于 petriciumus cifera</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">petricium = k、petricium la petricium = k²、… 所以 l = kᵗ 时 la 的个数是 t−1</text>
  <g filter="url(#rough2)"><rect x="60" y="96" width="190" height="54" rx="6" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="155" y="130" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">x = l，t = 0</text>
  <g filter="url(#rough2)"><line x1="250" y1="123" x2="320" y2="123" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)"/></g>
  <g filter="url(#rough2)"><rect x="320" y="96" width="250" height="54" rx="6" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="445" y="130" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">x % k == 0 ？ 是 ⇒ x /= k，t++</text>
  <g filter="url(#rough2)"><line x1="570" y1="123" x2="640" y2="123" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)"/></g>
  <g filter="url(#rough2)"><rect x="640" y="96" width="200" height="54" rx="6" fill="#f6e3c4" fill-opacity="0.85" stroke="#b06a1e" stroke-width="1.4"/></g>
  <text x="740" y="130" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">否则停：x 是 1 吗？</text>
  <text x="285" y="84" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">循环</text>
  <g filter="url(#rough2)"><path d="M 740 96 C 740 40, 445 40, 445 92" fill="none" stroke="#b06a1e" stroke-width="1.3" stroke-dasharray="6 5" marker-end="url(#arr)"/></g>
  <text x="590" y="40" text-anchor="middle" font-size="11" fill="#b06a1e" filter="url(#rough2)">继续除</text>
  <g filter="url(#rough2)"><rect x="640" y="190" width="200" height="62" rx="6" fill="#ffffff" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="740" y="216" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">x == 1 → YES</text>
  <text x="740" y="238" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">importance = t − 1</text>
  <g filter="url(#rough2)"><rect x="640" y="270" width="200" height="62" rx="6" fill="#ffffff" fill-opacity="0.85" stroke="#8a2b28" stroke-width="1.4"/></g>
  <text x="740" y="296" text-anchor="middle" font-size="12.5" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">x ≠ 1 → NO</text>
  <text x="740" y="318" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">l 根本不含 k 这个因子</text>
  <g filter="url(#rough2)"><line x1="740" y1="150" x2="740" y2="186" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)"/></g>
  <g filter="url(#rough2)"><line x1="740" y1="252" x2="740" y2="266" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)"/></g>
  <text x="70" y="210" text-anchor="start" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">为什么用除法而不是乘法：</text>
  <text x="70" y="236" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">l ≤ 2³¹−1，k² 很快溢出 32 位；</text>
  <text x="70" y="258" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">不断整除绝不越界（long long 都不用）。</text>
  <text x="70" y="288" text-anchor="start" font-size="11.5" fill="#666666" filter="url(#rough2)">上界：t ≤ 30（2³⁰ &lt; 2³¹−1 &lt; 2³¹）。</text>
  <text x="70" y="330" text-anchor="start" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">注意 l = k 时 t = 1，importance = 0，输出第一行后还得打印 0。</text>
</svg>
