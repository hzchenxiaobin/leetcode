<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="240" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例：1 / 2 / 6720</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">与官方一致</text>
  <text x="150" y="105" text-anchor="start" font-size="13" fill="#2b2b2b" filter="url(#rough2)">n=11,m=2（4 与 8）→ 9!/(3!3!3!) x 2^2 = 6720</text>
  <text x="150" y="150" text-anchor="start" font-size="13" fill="#2f4a66" filter="url(#rough2)">n=4,m=2（1 与 4）→ 2!/(2!) x 2^1 = 2</text>
</svg>
