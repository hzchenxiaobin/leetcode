  <text x="180" y="157" font-size="11" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="234" y="142" width="62" height="46" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="265.0" y="173.0" font-size="20" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0</text>
