  <rect x="232" y="140" width="128" height="96" rx="6" fill="none" stroke="#b85450" stroke-width="2.2" stroke-dasharray="7 4" filter="url(#rough2)"/>
  <text x="392" y="156" font-size="12" fill="#b85450" text-anchor="start" font-weight="normal" filter="url(#rough2)">数字 = 重建顺序</text>
  <text x="392" y="174" font-size="12" fill="#b85450" text-anchor="start" font-weight="normal" filter="url(#rough2)">红框 = 一个 2×2 块</text>
  <text x="392" y="192" font-size="12" fill="#446688" text-anchor="start" font-weight="normal" filter="url(#rough2)">蓝格 = 自由格</text>
  <text x="30" y="262" font-size="13" fill="#333" text-anchor="start" font-weight="normal" filter="url(#rough2)">① a(2,2) = a(1,1)⊕a(1,2)⊕a(2,1) = 1⊕1⊕0 = 0</text>
  <text x="30" y="290" font-size="13" fill="#333" text-anchor="start" font-weight="normal" filter="url(#rough2)">② a(3,3) = a(2,2)⊕a(2,3)⊕a(3,2) = 0⊕0⊕1 = 1</text>
  <text x="30" y="318" font-size="13" fill="#333" text-anchor="start" font-weight="normal" filter="url(#rough2)">③ 6 个 2×2 块全部异或为 0 → 合法；e = 12 − 2×3 = 6</text>
  <text x="30" y="348" font-size="12" fill="#666" text-anchor="start" font-weight="normal" filter="url(#rough2)">4 组样例 3/4/5 的 64 / 128 / 512 也由此式给出</text>
</svg>
