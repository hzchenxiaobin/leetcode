  <rect width="560" height="380" fill="#fafafa" filter="url(#rough2)"/>
  <text x="26" y="36" font-size="16" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">样例演算：n=3, m=4, r=2, c=2 → e=6, 答案 64</text>
