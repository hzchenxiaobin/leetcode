<svg xmlns="http://www.w3.org/2000/svg" width="780" height="430" viewBox="0 0 780 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="173"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="780" height="430" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每一步关于 A 做中心对称：A 是线段 M(i−1)M(i) 的中点</text>
  <path d="M 120 40 Q 390 46 660 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <path d="M 300 380 L 480 260" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 480 260 L 480 140" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <circle cx="300" cy="380" r="7" fill="#c98a2b" filter="url(#rough2)"/>
  <text x="286" y="404" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">M0(0,0)</text>
  <circle cx="390" cy="320" r="7" fill="#b85450" filter="url(#rough2)"/>
  <text x="336" y="312" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">A0(1,1)</text>
  <circle cx="480" cy="260" r="7" fill="#c98a2b" filter="url(#rough2)"/>
  <text x="492" y="256" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">M1(2,2)</text>
  <circle cx="480" cy="200" r="7" fill="#b85450" filter="url(#rough2)"/>
  <text x="492" y="196" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">A1(2,3)</text>
  <circle cx="480" cy="140" r="7" fill="#c98a2b" filter="url(#rough2)"/>
  <text x="492" y="136" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">M2(2,4)</text>

  <path d="M 310 372 L 380 328" stroke="#999999" stroke-width="1.1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 400 312 L 470 268" stroke="#999999" stroke-width="1.1" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <rect x="540" y="90" width="220" height="150" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="556" y="118" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">递推式</text>
  <text x="556" y="148" font-size="12.5" fill="#7a5a1b" filter="url(#rough2)">M(i) = 2·A((i−1) mod n) − M(i−1)</text>
  <text x="556" y="180" font-size="11" fill="#9a7020" filter="url(#rough2)">A 是线段 M(i−1)M(i) 的中点，</text>
  <text x="556" y="202" font-size="11" fill="#9a7020" filter="url(#rough2)">所以 M(i) 是 M(i−1) 关于 A 的对称点。</text>

  <text x="60" y="360" font-size="11.5" fill="#555555" filter="url(#rough2)">样例 1 的前几步：M0→A0→M1 共线且 A0 居中；M1→A1→M2 同理。</text>
  <text x="60" y="424" font-size="11.5" fill="#8a6015" filter="url(#rough2)">注意对称点公式是 2A − M：与“中点公式 (A+M)/2”正好互为反解。</text>
</svg>
