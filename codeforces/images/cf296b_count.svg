<svg xmlns="http://www.w3.org/2000/svg" width="700" height="310" viewBox="0 0 700 310"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="611"/>
    <feDisplacementMap in="SourceGraphic" scale="1.5"/></filter></defs>
  <rect width="700" height="310" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">"不可比" = 总数 − (处处 ≥) − (处处 ≤) + (处处 =)</text>
  <path d="M 110 40 Q 350 46 590 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="76" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="12.5" fill="#22314a" filter="url(#rough2)">不可比 ⟺ ∃i: s_i &gt; w_i 且 ∃j: s_j &lt; w_j ⇒ 既不是"处处 s ≥ w"，也不是"处处 s ≤ w"。</text>
  <text x="76" y="106" font-size="12.5" fill="#22314a" filter="url(#rough2)">容斥：答案 = 总数 − A − B + C，其中</text>
  <text x="76" y="130" font-size="12.5" fill="#22314a" filter="url(#rough2)">A = #(所有位 s ≥ w)、B = #(所有位 s ≤ w)、C = #(所有位 s = w)。</text>
  <g filter="url(#rough2)"><rect x="60" y="146" width="580" height="76" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="76" y="170" font-size="12.5" fill="#8a6015" filter="url(#rough2)">逐位独立：设该位可选集合为 S、W（'?' ⇒ 10 个数字，否则 1 个）。</text>
  <text x="76" y="194" font-size="12.5" fill="#8a6015" filter="url(#rough2)">记 ge = #{(x,y): x∈S,y∈W,x≥y}、le 同理、eq 同理 ⇒ A=Πge、B=Πle、C=Πeq。</text>
  <text x="76" y="214" font-size="11.5" fill="#8a6015" filter="url(#rough2)">（'?' 对 '?' 时 ge=le=55、eq=10，因为 1+2+…+10=55。）</text>
  <g filter="url(#rough2)"><rect x="60" y="232" width="580" height="66" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="256" font-size="12.5" fill="#2f5223" filter="url(#rough2)">样例 1：s=90, w=09 ⇒ A: 位0 9≥0 ✓、位1 0≥9 ✗ ⇒ A=0；B 同理 0；C=0</text>
  <text x="76" y="280" font-size="12.5" fill="#2f5223" filter="url(#rough2)">⇒ 答案 = 1 − 0 − 0 + 0 = 1 ✓</text>
  <text x="76" y="298" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">样例 3：全部 '?' ⇒ 10¹⁰ − 2·55⁵ + 10⁵ ≡ 993531194 ✓</text>
</svg>
