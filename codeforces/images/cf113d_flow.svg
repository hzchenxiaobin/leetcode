<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="330" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">算法五步</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">K = n(n−1)/2 ≤ 231：一次消元就够，不需要迭代</text>
  <g filter="url(#rough2)"><rect x="26" y="96" width="156" height="132" rx="6" fill="#ffffff" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="104" y="120" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 建转移</text>
  <text x="104" y="144" text-anchor="middle" font-size="10" fill="#2b2b2b" filter="url(#rough2)">P(u,u) = p_u</text>
  <text x="104" y="169" text-anchor="middle" font-size="10" fill="#2b2b2b" filter="url(#rough2)">P(u,v) = (1−p_u)/deg(u)</text>
  <text x="104" y="194" text-anchor="middle" font-size="10" fill="#2b2b2b" filter="url(#rough2)">v 与 u 相邻</text>
  <g filter="url(#rough2)"><rect x="200" y="96" width="156" height="132" rx="6" fill="#ffffff" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="278" y="120" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">② 编号无序对</text>
  <text x="278" y="144" text-anchor="middle" font-size="10" fill="#2b2b2b" filter="url(#rough2)">(u,v), u&lt;v ↦ 0…K−1</text>
  <text x="278" y="169" text-anchor="middle" font-size="10" fill="#2b2b2b" filter="url(#rough2)">K ≤ 231</text>
  <text x="278" y="194" text-anchor="middle" font-size="10" fill="#2b2b2b" filter="url(#rough2)">顺带记下起点 s</text>
  <g filter="url(#rough2)"><rect x="374" y="96" width="156" height="132" rx="6" fill="#ffffff" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="452" y="120" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">③ 组矩阵</text>
  <text x="452" y="144" text-anchor="middle" font-size="10" fill="#2b2b2b" filter="url(#rough2)">A = I − Q</text>
  <text x="452" y="169" text-anchor="middle" font-size="10" fill="#2b2b2b" filter="url(#rough2)">Q 是未相遇态之间的转移</text>
  <text x="452" y="194" text-anchor="middle" font-size="10" fill="#2b2b2b" filter="url(#rough2)">规模 K×K ≤ 231</text>
  <g filter="url(#rough2)"><rect x="548" y="96" width="156" height="132" rx="6" fill="#ffffff" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="626" y="120" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">④ 解方程</text>
  <text x="626" y="144" text-anchor="middle" font-size="10" fill="#2b2b2b" filter="url(#rough2)">Aᵀ y = e_s</text>
  <text x="626" y="169" text-anchor="middle" font-size="10" fill="#2b2b2b" filter="url(#rough2)">部分主元高斯消元</text>
  <text x="626" y="194" text-anchor="middle" font-size="10" fill="#2b2b2b" filter="url(#rough2)">long double 80 位</text>
  <g filter="url(#rough2)"><rect x="722" y="96" width="156" height="132" rx="6" fill="#ffffff" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="800" y="120" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">⑤ 收答案</text>
  <text x="800" y="144" text-anchor="middle" font-size="10" fill="#2b2b2b" filter="url(#rough2)">ans_i = Σ_t y_t·P(u_t,i)·P(v_t,i)</text>
  <text x="800" y="169" text-anchor="middle" font-size="10" fill="#2b2b2b" filter="url(#rough2)">t 跑遍 K 个无序对</text>
  <text x="800" y="194" text-anchor="middle" font-size="10" fill="#2b2b2b" filter="url(#rough2)">O(K·n)</text>
  <g filter="url(#rough2)"><line x1="182" y1="162" x2="222" y2="162" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)"/></g>
  <g filter="url(#rough2)"><line x1="356" y1="162" x2="396" y2="162" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)"/></g>
  <g filter="url(#rough2)"><line x1="530" y1="162" x2="570" y2="162" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)"/></g>
  <g filter="url(#rough2)"><line x1="704" y1="162" x2="744" y2="162" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)"/></g>
  <g filter="url(#rough2)"><rect x="26" y="248" width="848" height="58" rx="6" fill="#f6e3c4" fill-opacity="0.85" stroke="#b06a1e" stroke-width="1.4" stroke-dasharray="5 4"/></g>
  <text x="450" y="272" text-anchor="middle" font-size="11.5" fill="#b06a1e" filter="url(#rough2)">为什么只解一次方程：我们只要 A⁻¹ 的「起点那一行」，即 y = A⁻ᵀe_s，</text>
  <text x="450" y="294" text-anchor="middle" font-size="11.5" fill="#8a5a14" filter="url(#rough2)">再对每个房间做一次点积，省掉 n 次回代（22 次 × 231² ≈ 1.2×10⁶ 次冗余运算）</text>
</svg>
