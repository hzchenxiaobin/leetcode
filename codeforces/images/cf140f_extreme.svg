<svg xmlns="http://www.w3.org/2000/svg" width="720" height="302" viewBox="0 0 720 302"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1423"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="720" height="302" fill="#fafafa"/>
  <text x="360.0" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">用极值点把候选中心压到 (k+1)⁴ 个</text>
  <path d="M 115.2 42 Q 360.0 48 604.8 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 50.0 180.0 L 670.0 180.0" stroke="#555555" stroke-width="1.4" fill="none" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <circle cx="90.0" cy="180.0" r="10.0" fill="#f5e8e8" stroke="#8c2f2c" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="150.0" cy="180.0" r="10.0" fill="#e8eef7" stroke="#335478" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="215.0" cy="180.0" r="10.0" fill="#e8eef7" stroke="#335478" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="290.0" cy="180.0" r="10.0" fill="#e8eef7" stroke="#335478" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="370.0" cy="180.0" r="10.0" fill="#e8eef7" stroke="#335478" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="445.0" cy="180.0" r="10.0" fill="#e8eef7" stroke="#335478" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="520.0" cy="180.0" r="10.0" fill="#e8eef7" stroke="#335478" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="605.0" cy="180.0" r="10.0" fill="#f5e8e8" stroke="#8c2f2c" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90.0" y="214.0" text-anchor="middle" font-size="10.5" fill="#8c2f2c" font-weight="bold" filter="url(#rough2)">x_min 幸存者</text>
  <text x="605.0" y="214.0" text-anchor="middle" font-size="10.5" fill="#8c2f2c" font-weight="bold" filter="url(#rough2)">x_max 幸存者</text>
  <path d="M 78.0 132.0 L 232.0 132.0" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 78.0 132.0 L 78.0 148.0" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 232.0 132.0 L 232.0 148.0" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="155.0" y="124.0" text-anchor="middle" font-size="11.0" fill="#2f5223" font-weight="bold" filter="url(#rough2)">前 k+1 个点</text>
  <path d="M 448.0 132.0 L 632.0 132.0" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 448.0 132.0 L 448.0 148.0" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 632.0 132.0 L 632.0 148.0" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="540.0" y="124.0" text-anchor="middle" font-size="11.0" fill="#2f5223" font-weight="bold" filter="url(#rough2)">后 k+1 个点</text>
  <path d="M 90.0 156.0 L 596.0 156.0" stroke="#8c5a2c" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 605.0 156.0 L 596.0 160.0 L 596.0 152.0 Z" fill="#8c5a2c" filter="url(#rough2)"/>
  <text x="348.0" y="84.0" text-anchor="middle" font-size="11.5" fill="#8c5a2c" filter="url(#rough2)">它们互为镜像 ⇒ O_x = (x_min + x_max) / 2</text>
  <rect x="50" y="236" width="620" height="48" rx="5" fill="#f5e8e8" stroke="#8c2f2c" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360.0" y="257.3" text-anchor="middle" font-size="10.5" fill="#8c2f2c" filter="url(#rough2)">最多熔掉 k 个 ⇒ 幸存的最小 x 一定出现在输入最左 k+1 个里</text>
  <text x="360.0" y="270.3" text-anchor="middle" font-size="10.5" fill="#8c2f2c" filter="url(#rough2)">y 方向同理，于是候选中心只有 (k+1)⁴ 个</text>
  <text x="360.0" y="288" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">k ≤ 10 时候选数 ≤ 14641</text>
</svg>
