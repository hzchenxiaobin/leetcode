<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="101"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="450" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">183A：换到 u=x+y, v=x−y，四种移动变成四种符号组合</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <line x1="80.0" y1="240.0" x2="300.0" y2="240.0" stroke="#aaaaaa" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="190.0" y1="130.0" x2="190.0" y2="350.0" stroke="#aaaaaa" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="190.0" y1="240.0" x2="190.0" y2="170.0" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="190.0" y="158.6" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">U</text>
  <text x="200.0" y="131.5" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">(+,−)</text>
  <line x1="190.0" y1="240.0" x2="190.0" y2="310.0" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="190.0" y="329.4" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">D</text>
  <text x="200.0" y="348.5" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">(−,+)</text>
  <line x1="190.0" y1="240.0" x2="260.0" y2="240.0" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="275.4" y="244.0" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">R</text>
  <text x="308.5" y="240.0" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">(+,+)</text>
  <line x1="190.0" y1="240.0" x2="120.0" y2="240.0" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="104.6" y="244.0" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">L</text>
  <text x="75.5" y="240.0" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">(−,−)</text>
  <text x="190.0" y="385.0" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">(u,v) = (x+y, x−y)</text>
  <text x="430.0" y="92.0" text-anchor="start" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">记录 → 固定的坐标 / 自由的坐标</text>
  <rect x="400.0" y="120.0" width="70.0" height="34.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="435.0" y="143.0" text-anchor="middle" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">UL</text>
  <text x="486.0" y="143.0" text-anchor="start" font-size="10.8" fill="#444" filter="url(#rough2)">v 固定 −1</text>
  <text x="596.0" y="143.0" text-anchor="start" font-size="10.8" fill="#444" font-weight="bold" filter="url(#rough2)">u 自由</text>
  <rect x="400.0" y="166.0" width="70.0" height="34.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="435.0" y="189.0" text-anchor="middle" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">UR</text>
  <text x="486.0" y="189.0" text-anchor="start" font-size="10.8" fill="#444" filter="url(#rough2)">u 固定 +1</text>
  <text x="596.0" y="189.0" text-anchor="start" font-size="10.8" fill="#444" font-weight="bold" filter="url(#rough2)">v 自由</text>
  <rect x="400.0" y="212.0" width="70.0" height="34.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="435.0" y="235.0" text-anchor="middle" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">DL</text>
  <text x="486.0" y="235.0" text-anchor="start" font-size="10.8" fill="#444" filter="url(#rough2)">u 固定 −1</text>
  <text x="596.0" y="235.0" text-anchor="start" font-size="10.8" fill="#444" font-weight="bold" filter="url(#rough2)">v 自由</text>
  <rect x="400.0" y="258.0" width="70.0" height="34.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="435.0" y="281.0" text-anchor="middle" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">DR</text>
  <text x="486.0" y="281.0" text-anchor="start" font-size="10.8" fill="#444" filter="url(#rough2)">v 固定 +1</text>
  <text x="596.0" y="281.0" text-anchor="start" font-size="10.8" fill="#444" font-weight="bold" filter="url(#rough2)">u 自由</text>
  <rect x="400.0" y="304.0" width="70.0" height="34.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="435.0" y="327.0" text-anchor="middle" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">ULDR</text>
  <text x="486.0" y="327.0" text-anchor="start" font-size="10.8" fill="#444" filter="url(#rough2)">u、v 都自由</text>
  <text x="596.0" y="327.0" text-anchor="start" font-size="10.8" fill="#444" filter="url(#rough2)">—</text>
  <rect x="40.0" y="372.0" width="640.0" height="56.0" fill="#f3e8fd" stroke="#6b4c9a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="54.0" y="395.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">自由坐标每步 ±1 → 取值个数 = 自由步数 + 1；u、v 的选择互相独立</text>
</svg>
