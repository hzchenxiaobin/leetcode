<svg xmlns="http://www.w3.org/2000/svg" width="700" height="270" viewBox="0 0 700 270"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="443"/>
    <feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></defs>
  <rect width="700" height="270" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">最优性直觉</text>
  <path d="M 200 40 Q 350 46 500 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="66" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="12.5" fill="#22314a" filter="url(#rough2)">设 M = 2^b−1 为 ≥ n 的最小全 1 数。区间 [M−n, n] 里的数两两配对可让双方都拿到 M（满位）。</text>
  <text x="76" y="106" font-size="12.5" fill="#22314a" filter="url(#rough2)">这些配对是"上界饱和"的（异或 = M 已是 2^(b+1) 范围内最大）⇒ 不可能更优。</text>
  <g filter="url(#rough2)"><rect x="60" y="134" width="580" height="66" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="158" font-size="12.5" fill="#2f5223" filter="url(#rough2)">剩下的 [0, M−n−1] 递归地在上一个 bit 层做同样的事（mask 降一层）⇒ 贪心递归正确。</text>
  <text x="76" y="182" font-size="12.5" fill="#2f5223" filter="url(#rough2)">实现上就是"从 n 往下扫、用当前 mask 补"这一件事。</text>
  <g filter="url(#rough2)"><rect x="60" y="212" width="580" height="46" rx="8" fill="#fbeeee" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="76" y="240" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">注意 pair(i,j) 要给 beauty 加两次异或值（i 与 j 各贡献一次）。</text>
</svg>
