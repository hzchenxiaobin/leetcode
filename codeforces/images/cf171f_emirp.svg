<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="873"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="270" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">emirp：p 与 reverse(p) 都是素数且互不相同</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">回文素数（2,3,5,7,11,101…）不算</text>
  <g filter="url(#rough2)"><rect x="90" y="100" width="240" height="56" rx="6" fill="#dcecd2" fill-opacity="0.4" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="210" y="134" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">13 是素数</text>
  <g filter="url(#rough2)"><rect x="480" y="100" width="240" height="56" rx="6" fill="#dcecd2" fill-opacity="0.4" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="600" y="134" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">31 也是素数</text>
  <text x="410" y="134" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">rev</text>
  <g filter="url(#rough2)"><line x1="340" y1="128" x2="470" y2="128" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)"/></g>
  <text x="450" y="200" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">前 10 个：13 17 31 37 71 73 79 97 107 113</text>
  <text x="450" y="234" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">第 11184 个 = 999983（筛到 10⁶ 足够）</text>
</svg>
