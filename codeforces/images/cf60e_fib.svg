<svg xmlns="http://www.w3.org/2000/svg" width="740" height="380" viewBox="0 0 740 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="609"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="740" height="380" fill="#fafafa"/>

  <text x="370" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">x 分钟后的最大值：最后一段按 Fibonacci 增长</text>
  <path d="M 110 40 Q 370 46 610 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 最后一段 -->
  <text x="60" y="76" font-size="12.5" font-weight="bold" fill="#2b4a68" filter="url(#rough2)">只看最后一段（aₙ₋₁, aₙ）：</text>
  <g filter="url(#rough2)">
    <rect x="60" y="90" width="120" height="34" fill="#fdf6e6" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="200" y="90" width="440" height="34" fill="#ffffff" stroke="#ddd" stroke-width="1.2"/>
  </g>
  <text x="120" y="113" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#6b4a10" filter="url(#rough2)">分钟 x</text>
  <text x="420" y="113" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#6b4a10" filter="url(#rough2)">这一段里的最大值</text>

  <g filter="url(#rough2)">
    <rect x="60" y="124" width="120" height="30" fill="#ffffff" stroke="#ddd" stroke-width="1.2"/>
    <rect x="200" y="124" width="440" height="30" fill="#ffffff" stroke="#ddd" stroke-width="1.2"/>
    <rect x="60" y="154" width="120" height="30" fill="#fafafa" stroke="#ddd" stroke-width="1.2"/>
    <rect x="200" y="154" width="440" height="30" fill="#fafafa" stroke="#ddd" stroke-width="1.2"/>
    <rect x="60" y="184" width="120" height="30" fill="#ffffff" stroke="#ddd" stroke-width="1.2"/>
    <rect x="200" y="184" width="440" height="30" fill="#ffffff" stroke="#ddd" stroke-width="1.2"/>
    <rect x="60" y="214" width="120" height="30" fill="#fafafa" stroke="#ddd" stroke-width="1.2"/>
    <rect x="200" y="214" width="440" height="30" fill="#fafafa" stroke="#ddd" stroke-width="1.2"/>
    <rect x="60" y="244" width="120" height="30" fill="#ffffff" stroke="#ddd" stroke-width="1.2"/>
    <rect x="200" y="244" width="440" height="30" fill="#ffffff" stroke="#ddd" stroke-width="1.2"/>
  </g>
  <text x="120" y="144" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="420" y="144" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">aₙ = F₀·aₙ₋₁ + F₁·aₙ</text>
  <text x="120" y="174" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="420" y="174" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">aₙ₋₁ + aₙ = F₁·aₙ₋₁ + F₂·aₙ</text>
  <text x="120" y="204" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="420" y="204" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">aₙ₋₁ + 2aₙ = F₂·aₙ₋₁ + F₃·aₙ</text>
  <text x="120" y="234" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="420" y="234" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2aₙ₋₁ + 3aₙ = F₃·aₙ₋₁ + F₄·aₙ</text>
  <text x="120" y="264" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">…</text>
  <text x="420" y="264" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">mₓ = Fₓ·aₙ₋₁ + Fₓ₊₁·aₙ（F₀=0, F₁=1）</text>

  <!-- 结论 -->
  <rect x="60" y="292" width="620" height="76" rx="8" fill="#f4f8ee" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="316" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">为什么全局最大值一定在最后一段：</text>
  <text x="76" y="338" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">每段的最大值 = Fₓ·(左端) + Fₓ₊₁·(右端)，系数非负；而输入非降序，</text>
  <text x="76" y="358" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">最后一段的左右端都是最大的，所以它的最大值就是整体最大值 mₓ。</text>
</svg>
