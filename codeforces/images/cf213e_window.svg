<svg xmlns="http://www.w3.org/2000/svg" width="730" height="300" viewBox="0 0 730 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="730" height="300" fill="#fafafa"/>
  <text x="365.0" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">213E：窗口 = 连续值 [d+1, d+n]</text>
  <path d="M 146.00 46 Q 365.0 52 584.00 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60" y="78" width="290" height="132" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="95" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">d 固定时，c=a+d 的取值恰好是 d+1..d+n</text>
  <text x="74" y="116" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">条件 ⟺ 这些值在 b 中的下标递增</text>
  <text x="74" y="137" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">⟺ b 中只保留窗口值后，读出的序列</text>
  <text x="74" y="158" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">恰好是 a 整体加 d</text>
  <rect x="380" y="78" width="290" height="132" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="394" y="95" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">用“值减首元素”消去 d：</text>
  <text x="394" y="116" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">序列 (v_j − v_1) 应等于 (a_j − a_1)</text>
  <text x="394" y="137" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">首元素 v_1 = 窗口中下标最小的值</text>
  <text x="394" y="158" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">⇒ 可 O(1) 比较</text>
  <text x="60" y="200" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">d 从 0 增到 m−n：窗口只删一个值、加一个值。</text>
</svg>
