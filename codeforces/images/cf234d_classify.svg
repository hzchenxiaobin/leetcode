<svg xmlns="http://www.w3.org/2000/svg" width="840" height="300" viewBox="0 0 840 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="300" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">三类判定：0 一定最爱 / 1 一定不是 / 2 都可能</text>
  <g filter="url(#rough2)"><rect x="120" y="96" width="280" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="260" y="124" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">0 一定是最爱</text>
  <text x="520" y="124" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">mn_i ≥ mx_j 对所有 j≠i</text>
  <g filter="url(#rough2)"><rect x="120" y="156" width="280" height="44" rx="4" fill="#f6d9d7" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="260" y="184" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1 一定不是</text>
  <text x="520" y="184" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">存在 j≠i：mn_j &gt; mx_i</text>
  <g filter="url(#rough2)"><rect x="120" y="216" width="280" height="44" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="260" y="244" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2 都可能</text>
  <text x="520" y="244" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">否则</text>
  <text x="420" y="290" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">并列也算最爱（用 ≥）</text>
</svg>
