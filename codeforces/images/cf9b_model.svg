<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="101"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="a9bmarr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="a9bmred" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="760" height="440" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">在 i 号站下车：总时间 = x_i / vb + d_i / vs</text>
  <path d="M 120 44 Q 380 50 640 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <text x="60" y="76" font-size="12" fill="#555" filter="url(#rough2)">小巴沿 x 轴行驶，学生只能在第 2 ~ n 站下车</text>

  <!-- 地面与行驶方向 -->
  <line x1="60" y1="310" x2="712" y2="310" stroke="#2b2b2b" stroke-width="1.8" marker-end="url(#a9bmarr)" filter="url(#rough2)"/>
  <text x="650" y="332" font-size="11" fill="#555" filter="url(#rough2)">x 轴</text>

  <!-- 站点 -->
  <circle cx="100" cy="310" r="9" fill="#fde8e8" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="94" y1="304" x2="106" y2="316" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="100" y="336" text-anchor="middle" font-size="11" fill="#8a3b36" filter="url(#rough2)">1 号（不能下车）</text>

  <circle cx="240" cy="310" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="338" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">2 号</text>

  <circle cx="380" cy="310" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="338" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">3 号</text>

  <circle cx="520" cy="310" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="520" y="338" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">4 号</text>

  <!-- 考场 -->
  <rect x="356" y="196" width="48" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <polygon points="350,196 380,176 410,196" fill="#f6c26b" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="218" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">考场</text>
  <text x="424" y="190" font-size="11" fill="#8a6015" filter="url(#rough2)">(xu, yu)</text>

  <!-- 距离标注 -->
  <line x1="380" y1="230" x2="380" y2="302" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="392" y="274" font-size="12" font-weight="bold" fill="#8a3b36" filter="url(#rough2)">d₃</text>

  <line x1="240" y1="310" x2="350" y2="206" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <text x="268" y="250" font-size="11.5" fill="#8a3b36" filter="url(#rough2)">d₂</text>

  <!-- 坐车距离 -->
  <line x1="100" y1="296" x2="380" y2="296" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="100" y1="290" x2="100" y2="302" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="380" y1="290" x2="380" y2="302" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="240" y="290" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">x₃ / vb</text>

  <!-- 说明卡片 -->
  <rect x="40" y="358" width="680" height="66" rx="10" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="58" y="382" font-size="12" fill="#2b2b2b" filter="url(#rough2)">对 i = 2 … n 各算一次 (tᵢ, dᵢ)；tᵢ 最小者入选，tᵢ 并列时选 dᵢ 更小的。</text>
  <text x="58" y="406" font-size="11.5" fill="#777" filter="url(#rough2)">第 1 站是上车站，必须排除；终点站 n 也是一次合法的下车机会。</text>
</svg>
