<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="340" fill="#fafafa"/>
  <text x="380.0" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">200D：T 是通配符，其余类型必须逐一相等</text>
  <path d="M 152.00 46 Q 380.0 52 608.00 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="72" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">实参类型固定，形参两种写法：具体类型（int/string/double）或通配 T。</text>
  <text x="60" y="92" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">例：变量表 a→int，s→string；调用 f(a, s) 该匹配哪些过程？</text>
  <rect x="60" y="120" width="640" height="34" rx="6" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="142" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">void f(int, T)</text>
  <text x="300" y="142" text-anchor="start" font-size="11" fill="#3d3d3d" filter="url(#rough2)">int vs int ✓</text>
  <text x="470" y="142" text-anchor="start" font-size="11" fill="#3d3d3d" filter="url(#rough2)">T 通配 ✓</text>
  <text x="640" y="142" text-anchor="start" font-size="11.5" fill="#2f5b34" font-weight="bold" filter="url(#rough2)">匹配</text>
  <rect x="60" y="160" width="640" height="34" rx="6" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="182" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">void f(T, T)</text>
  <text x="300" y="182" text-anchor="start" font-size="11" fill="#3d3d3d" filter="url(#rough2)">T 通配 ✓</text>
  <text x="470" y="182" text-anchor="start" font-size="11" fill="#3d3d3d" filter="url(#rough2)">T 通配 ✓</text>
  <text x="640" y="182" text-anchor="start" font-size="11.5" fill="#2f5b34" font-weight="bold" filter="url(#rough2)">匹配</text>
  <rect x="60" y="200" width="640" height="34" rx="6" fill="#fdeef1" stroke="#c0708a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="222" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">void f(T, int)</text>
  <text x="300" y="222" text-anchor="start" font-size="11" fill="#3d3d3d" filter="url(#rough2)">T 通配 ✓</text>
  <text x="470" y="222" text-anchor="start" font-size="11" fill="#3d3d3d" filter="url(#rough2)">int ≠ string ✗</text>
  <text x="640" y="222" text-anchor="start" font-size="11.5" fill="#8a3a52" font-weight="bold" filter="url(#rough2)">不匹配</text>
  <rect x="60" y="240" width="640" height="34" rx="6" fill="#fdeef1" stroke="#c0708a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="262" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">void g(int, T)</text>
  <text x="300" y="262" text-anchor="start" font-size="11" fill="#3d3d3d" filter="url(#rough2)">名字不同 ✗</text>
  <text x="470" y="262" text-anchor="start" font-size="11" fill="#3d3d3d" filter="url(#rough2)">—</text>
  <text x="640" y="262" text-anchor="start" font-size="11.5" fill="#8a3a52" font-weight="bold" filter="url(#rough2)">不匹配</text>
  <rect x="60" y="280" width="640" height="34" rx="6" fill="#fdeef1" stroke="#c0708a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="302" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">void f(T)</text>
  <text x="300" y="302" text-anchor="start" font-size="11" fill="#3d3d3d" filter="url(#rough2)">参数个数 1 ≠ 2 ✗</text>
  <text x="470" y="302" text-anchor="start" font-size="11" fill="#3d3d3d" filter="url(#rough2)">—</text>
  <text x="640" y="302" text-anchor="start" font-size="11.5" fill="#8a3a52" font-weight="bold" filter="url(#rough2)">不匹配</text>
  <text x="60" y="336" text-anchor="start" font-size="12" fill="#2f5b34" font-weight="bold" filter="url(#rough2)">⇒ 答案 2（前两个过程）。</text>
</svg>
