<svg xmlns="http://www.w3.org/2000/svg" width="740" height="440" viewBox="0 0 740 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="107"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="a9warr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="740" height="440" fill="#fafafa"/>

  <text x="370" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1 走查：三站的耗时对比</text>
  <path d="M 160 44 Q 370 50 580 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="370" y="64" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">n = 4，vb = 5，vs = 2，站点 0 2 4 6，考场 (4, 1)</text>

  <!-- 左表 -->
  <rect x="26" y="80" width="250" height="196" rx="10" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="40" y="104" font-size="11" fill="#777" filter="url(#rough2)">站号</text>
  <text x="96" y="104" font-size="11" fill="#777" filter="url(#rough2)">xᵢ</text>
  <text x="146" y="104" font-size="11" fill="#777" filter="url(#rough2)">dᵢ</text>
  <text x="206" y="104" font-size="11" fill="#777" filter="url(#rough2)">tᵢ</text>
  <g filter="url(#rough2)">
    <rect x="34" y="112" width="234" height="44" fill="#ffffff" stroke="#e3ded4" stroke-width="1"/>
    <rect x="34" y="156" width="234" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="34" y="200" width="234" height="44" fill="#ffffff" stroke="#e3ded4" stroke-width="1"/>
  </g>
  <text x="42" y="140" font-size="13" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="42" y="184" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">3</text>
  <text x="42" y="228" font-size="13" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="96" y="140" font-size="13" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="96" y="184" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">4</text>
  <text x="96" y="228" font-size="13" fill="#2b2b2b" filter="url(#rough2)">6</text>
  <text x="140" y="140" font-size="12" fill="#2b2b2b" filter="url(#rough2)">2.236</text>
  <text x="140" y="184" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">1.000</text>
  <text x="140" y="228" font-size="12" fill="#2b2b2b" filter="url(#rough2)">2.236</text>
  <text x="200" y="140" font-size="12" fill="#2b2b2b" filter="url(#rough2)">1.518</text>
  <text x="200" y="184" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">1.300</text>
  <text x="200" y="228" font-size="12" fill="#2b2b2b" filter="url(#rough2)">2.318</text>

  <!-- 横轴：0 ~ 2.5，每 0.5 = 72px -->
  <line x1="340" y1="300" x2="700" y2="300" stroke="#2b2b2b" stroke-width="1.6" marker-end="url(#a9warr)" filter="url(#rough2)"/>
  <line x1="340" y1="300" x2="340" y2="306" stroke="#2b2b2b" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="376" y1="300" x2="376" y2="306" stroke="#2b2b2b" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="412" y1="300" x2="412" y2="306" stroke="#2b2b2b" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="448" y1="300" x2="448" y2="306" stroke="#2b2b2b" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="484" y1="300" x2="484" y2="306" stroke="#2b2b2b" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="520" y1="300" x2="520" y2="306" stroke="#2b2b2b" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="340" y="322" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">0</text>
  <text x="376" y="322" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">0.5</text>
  <text x="412" y="322" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">1.0</text>
  <text x="448" y="322" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">1.5</text>
  <text x="484" y="322" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">2.0</text>
  <text x="520" y="322" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">2.5</text>
  <text x="590" y="322" font-size="10.5" fill="#777" filter="url(#rough2)">耗时（秒）</text>

  <!-- 条形 -->
  <rect x="340" y="128" width="109" height="28" fill="#cfe0f5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="458" y="148" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">2 号：1.518</text>
  <rect x="340" y="180" width="94" height="28" fill="#f6c26b" stroke="#b9822a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="442" y="200" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">3 号：1.300（最短）</text>
  <rect x="340" y="232" width="167" height="28" fill="#cfe0f5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="516" y="252" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">4 号：2.318</text>

  <!-- 结论 -->
  <rect x="26" y="336" width="688" height="86" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="46" y="364" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">最小耗时是 3 号站的 1.300，所以输出 3</text>
  <text x="46" y="388" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">计算：t₂ = 2/5 + √5/2 ≈ 1.518，t₃ = 4/5 + 1/2 = 1.300，t₄ = 6/5 + √5/2 ≈ 2.318</text>
  <text x="46" y="410" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">样例 2 中 n = 2，唯一可下车的 2 号站就是终点站，输出 2。</text>
</svg>
