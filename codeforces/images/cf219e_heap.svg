<svg xmlns="http://www.w3.org/2000/svg" width="840" height="420" viewBox="0 0 840 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="420" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">用有序集合 + 空隙集合维护候选</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">occ 存已占位；gaps 的键是 (−距离, 最佳位置)，另存端点用于校验</text>
  <g filter="url(#rough2)"><rect x="60" y="92" width="220" height="116" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="170" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#3d6b2f" filter="url(#rough2)">occ（有序集合）</text>
  <text x="170" y="144" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1  2  4  7</text>
  <text x="170" y="170" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">begin() = 1，rbegin() = 7</text>
  <text x="170" y="192" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">用于前缀 / 后缀候选</text>
  <g filter="url(#rough2)"><rect x="330" y="92" width="300" height="116" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="480" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">gaps（(2,4) 与 (4,7)）</text>
  <text x="480" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">(−1, 3)      (−1, 5)</text>
  <text x="480" y="172" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">最小键 = 距离最大的空隙</text>
  <text x="480" y="194" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">并列时键的第二元保证取小编号</text>
  <g filter="url(#rough2)"><rect x="660" y="92" width="130" height="116" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="725" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a4b2a" filter="url(#rough2)">答案</text>
  <text x="725" y="146" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">距离最大</text>
  <text x="725" y="168" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">并列取小</text>
  <text x="725" y="190" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a0522d" filter="url(#rough2)">→ 位置 3</text>
  <g filter="url(#rough2)"><rect x="80" y="250" width="330" height="140" rx="4" fill="#f7fbf4" fill-opacity="0.85" stroke="#a8c99a" stroke-width="1.3"/></g>
  <text x="245" y="276" text-anchor="middle" font-size="13" font-weight="bold" fill="#3d6b2f" filter="url(#rough2)">到达：插入 p</text>
  <text x="245" y="302" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">找到前驱 l、后继 r</text>
  <text x="245" y="324" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">删掉空隙 (l,r)，加入 (l,p)、(p,r)</text>
  <text x="245" y="346" text-anchor="middle" font-size="11" fill="#777777" filter="url(#rough2)">（没有空位的段不加入）</text>
  <text x="245" y="370" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">前缀/后缀由 occ 的极值实时给出</text>
  <g filter="url(#rough2)"><rect x="450" y="250" width="330" height="140" rx="4" fill="#fdf6f4" fill-opacity="0.85" stroke="#d8a89a" stroke-width="1.3"/></g>
  <text x="615" y="276" text-anchor="middle" font-size="13" font-weight="bold" fill="#a0522d" filter="url(#rough2)">离开：删除 p</text>
  <text x="615" y="302" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">找到前驱 l、后继 r</text>
  <text x="615" y="324" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">删掉 (l,p)、(p,r)，加入 (l,r)</text>
  <text x="615" y="346" text-anchor="middle" font-size="11.5" fill="#8a4b2a" filter="url(#rough2)">车号 → 车位号要用映射查回</text>
  <text x="615" y="370" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">两个端点是精确键，不会误删别的空隙</text>
</svg>
