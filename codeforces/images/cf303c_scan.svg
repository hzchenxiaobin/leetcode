<svg xmlns="http://www.w3.org/2000/svg" width="700" height="270" viewBox="0 0 700 270"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="823"/>
    <feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></defs>
  <rect width="700" height="270" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">实现细节：时间戳避免每次清空</text>
  <path d="M 170 40 Q 350 46 530 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="86" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="12.5" fill="#22314a" filter="url(#rough2)">每个 m 都要标记"哪些余数已出现"：用 stamp[r] 存"最后一次被哪个 m 用到"。</text>
  <text x="76" y="106" font-size="12.5" fill="#22314a" filter="url(#rough2)">当前 m 进来时 stamp[r] ≠ m 就当空 ⇒ 免去 O(m) 的清零，单次检查严格 O(n)。</text>
  <text x="76" y="130" font-size="12.5" fill="#22314a" filter="url(#rough2)">再配一个删除计数，超过 k 立即返回 false。</text>
  <g filter="url(#rough2)"><rect x="60" y="156" width="580" height="66" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="180" font-size="12.5" fill="#2f5223" filter="url(#rough2)">复杂度 O(ans · n)：n ≤ 5000，实测最坏（n=5000 随机、k=4）答案 ≈ 4.5×10⁵、</text>
  <text x="76" y="204" font-size="12.5" fill="#2f5223" filter="url(#rough2)">耗时 0.66 s（2 s 时限的 33%）；结构化数据（等差倍数）答案仅 ~5000、0.04 s。</text>
  <g filter="url(#rough2)"><rect x="60" y="234" width="580" height="30" rx="6" fill="#fbeeee" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="76" y="254" font-size="12" fill="#8a3a36" filter="url(#rough2)">易错：余数数组要开到 max(m) 以上（m 可能到 10⁶ 量级）。</text>
</svg>
