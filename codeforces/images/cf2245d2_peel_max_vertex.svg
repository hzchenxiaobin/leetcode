<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">最大模长的元素一定有可剥离的</text>
  <text x="280" y="45" text-anchor="middle" font-size="10.5" fill="#888">设 M = max |a_i|，取一个模长为 M 的下标 x，分两种情形</text>

  <!-- 情形 A -->
  <rect x="24" y="60" width="248" height="176" fill="#f7fbff" stroke="#8aa6c8" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="148" y="80" text-anchor="middle" font-size="11" fill="#3a4a66">情形 A：a_x = +M（非负）</text>
  <rect x="38" y="90" width="220" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="148" y="108" text-anchor="middle" font-size="10" fill="#3a4a66">若存在 2 型边 (x, y)：</text>
  <text x="148" y="126" text-anchor="middle" font-size="10" fill="#3a4a66">要求 a_y &lt; −M</text>
  <rect x="38" y="150" width="220" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="148" y="168" text-anchor="middle" font-size="10" fill="#8a3a36">但 |a_y| ≤ M ⇒ a_y ≥ −M</text>
  <text x="148" y="184" text-anchor="middle" font-size="10" fill="#8a3a36">⇒ 矛盾</text>
  <rect x="38" y="198" width="220" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="148" y="216" text-anchor="middle" font-size="10" fill="#3a5a30">⇒ x 的边全为 1 型 ⇒ x 可剥离</text>

  <!-- 情形 B -->
  <rect x="288" y="60" width="248" height="176" fill="#fffdf5" stroke="#d6a040" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="412" y="80" text-anchor="middle" font-size="11" fill="#8a6a20">情形 B：a_x = −M（为负）</text>
  <rect x="302" y="90" width="220" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="412" y="108" text-anchor="middle" font-size="10" fill="#8a6a20">2 型边 (x, y)：只需 a_y &lt; M，</text>
  <text x="412" y="126" text-anchor="middle" font-size="10" fill="#8a6a20">总能满足（不构成障碍）</text>
  <rect x="302" y="150" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="412" y="168" text-anchor="middle" font-size="10" fill="#3a4a66">1 型边 (x, y)：a_y ≥ M ⇒ a_y = +M</text>
  <text x="412" y="184" text-anchor="middle" font-size="10" fill="#3a4a66">⇒ y 也是极大且非负</text>
  <rect x="302" y="198" width="220" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="412" y="216" text-anchor="middle" font-size="10" fill="#3a5a30">⇒ 由 A，y 可剥离</text>

  <text x="280" y="262" text-anchor="middle" font-size="10" fill="#666">若 2 型边一条都没有，则 x 自己就可剥离；若 M = 0，全数组为 0，所有边必为 1 型</text>

  <rect x="24" y="278" width="512" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="40" y="298" font-size="10.5" fill="#3a5a30">结论 1：合法 ⇒ 每个诱导子图里都有「关联边同色」的点（剥离不会卡住）</text>
  <text x="40" y="316" font-size="10.5" fill="#3a5a30">结论 2：剥离只会删边 ⇒ 计数只减不增 ⇒ 可剥离性单调 ⇒ 贪心顺序无所谓</text>
</svg>
