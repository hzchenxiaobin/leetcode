<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="89"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="720" height="420" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">把边划分成「简单路径」和「简单环」，问最少 / 最多几条线</text>
  <path d="M 70 42 Q 360 48 650 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 径向线 -->
  <text x="150" y="76" text-anchor="middle" font-size="13" fill="#2f5223" filter="url(#rough2)">radial line（简单路径）</text>
  <g filter="url(#rough2)">
    <circle cx="70" cy="130" r="14" fill="#e8f4e0" stroke="#4a7a3a" stroke-width="1.6"/>
    <circle cx="130" cy="100" r="14" fill="#e8f4e0" stroke="#4a7a3a" stroke-width="1.6"/>
    <circle cx="190" cy="130" r="14" fill="#e8f4e0" stroke="#4a7a3a" stroke-width="1.6"/>
    <circle cx="250" cy="100" r="14" fill="#e8f4e0" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <g stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)">
    <line x1="80" y1="124" x2="120" y2="106"/>
    <line x1="140" y1="106" x2="180" y2="124"/>
    <line x1="200" y1="124" x2="240" y2="106"/>
  </g>
  <text x="150" y="164" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">两端是「线端」，占用 2 个端点</text>

  <!-- 环线 -->
  <text x="540" y="76" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">loop line（简单环）</text>
  <g filter="url(#rough2)">
    <circle cx="500" cy="110" r="14" fill="#dfeafc" stroke="#446688" stroke-width="1.6"/>
    <circle cx="580" cy="110" r="14" fill="#dfeafc" stroke="#446688" stroke-width="1.6"/>
    <circle cx="580" cy="160" r="14" fill="#dfeafc" stroke="#446688" stroke-width="1.6"/>
    <circle cx="500" cy="160" r="14" fill="#dfeafc" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)">
    <line x1="514" y1="110" x2="566" y2="110"/>
    <line x1="580" y1="124" x2="580" y2="146"/>
    <line x1="566" y1="160" x2="514" y2="160"/>
    <line x1="500" y1="146" x2="500" y2="124"/>
  </g>
  <text x="540" y="196" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">没有端点，整块算 1 条线</text>

  <!-- 关键计数 -->
  <g filter="url(#rough2)">
    <rect x="60" y="216" width="600" height="76" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/>
  </g>
  <g font-size="12.5" fill="#22314a" filter="url(#rough2)">
    <text x="74" y="240">在某点 v：经过 v 的线两两配对占用 2 条边，结束在 v 的线只占 1 条边。</text>
    <text x="74" y="264">所以「线端数」≡ deg(v) (mod 2) ⇒ 每个奇度点至少贡献 1 个线端。</text>
    <text x="74" y="284">线数 = 线端数/2 + 环线条数 ⇒ 下界 #odd/2。</text>
  </g>

  <!-- 极值 -->
  <g filter="url(#rough2)">
    <rect x="60" y="304" width="286" height="86" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="374" y="304" width="286" height="86" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <g font-size="12.5" filter="url(#rough2)">
    <text x="74" y="328" fill="#2f5223">最大值：每条边单独成一条径向线</text>
    <text x="74" y="350" fill="#2f5223">⇒ 恰好 m 条（不需要任何合并）。</text>
    <text x="74" y="376" fill="#2f5223">这总是合法：径向线允许只有一条边。</text>

    <text x="388" y="328" fill="#8a6015">最小值 = 奇度点的一半 +</text>
    <text x="388" y="350" fill="#8a6015">「附着点 ≤ 1 的环块」的个数。</text>
    <text x="388" y="376" fill="#8a6015">（环块的定义与证明见下一张图）</text>
  </g>
</svg>
