<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1209"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="780" height="400" fill="#fafafa"/>
  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">样例走查：库存 S=1, M=0, L=2, XL=0, XXL=1</text>

  <rect x="40" y="56" width="700" height="30" fill="#eef1f4" stroke="#7a8ca6" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="56" y="76" font-size="10.5" font-weight="bold" fill="#33445c" filter="url(#rough2)">人</text>
  <text x="120" y="76" font-size="10.5" font-weight="bold" fill="#33445c" filter="url(#rough2)">理想</text>
  <text x="220" y="76" font-size="10.5" font-weight="bold" fill="#33445c" filter="url(#rough2)">偏好顺序</text>
  <text x="470" y="76" font-size="10.5" font-weight="bold" fill="#33445c" filter="url(#rough2)">库存变化</text>
  <text x="650" y="76" font-size="10.5" font-weight="bold" fill="#33445c" filter="url(#rough2)">拿到</text>

  <rect x="40" y="86" width="700" height="40" fill="#ffffff" stroke="#d6d6d6" stroke-width="1" filter="url(#rough2)"/>
  <text x="56" y="110" font-size="10.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="120" y="110" font-size="10.5" fill="#555" filter="url(#rough2)">XL</text>
  <text x="220" y="110" font-size="10" fill="#555" filter="url(#rough2)">XL, XXL, L, S, M</text>
  <text x="470" y="110" font-size="10" fill="#555" filter="url(#rough2)">XL 无 → XXL 有</text>
  <text x="650" y="110" font-size="10.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">XXL</text>

  <rect x="40" y="126" width="700" height="40" fill="#f7fbff" stroke="#d6d6d6" stroke-width="1" filter="url(#rough2)"/>
  <text x="56" y="150" font-size="10.5" fill="#555" filter="url(#rough2)">2</text>
  <text x="120" y="150" font-size="10.5" fill="#555" filter="url(#rough2)">XXL</text>
  <text x="220" y="150" font-size="10" fill="#555" filter="url(#rough2)">XXL, XL, L, M, S</text>
  <text x="470" y="150" font-size="10" fill="#555" filter="url(#rough2)">XXL 无 → XL 无 → L 有</text>
  <text x="650" y="150" font-size="10.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">L</text>

  <rect x="40" y="166" width="700" height="40" fill="#ffffff" stroke="#d6d6d6" stroke-width="1" filter="url(#rough2)"/>
  <text x="56" y="190" font-size="10.5" fill="#555" filter="url(#rough2)">3</text>
  <text x="120" y="190" font-size="10.5" fill="#555" filter="url(#rough2)">M</text>
  <text x="220" y="190" font-size="10" fill="#555" filter="url(#rough2)">M, L, S, XL, XXL</text>
  <text x="470" y="190" font-size="10" fill="#555" filter="url(#rough2)">M 无 → L 有</text>
  <text x="650" y="190" font-size="10.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">L</text>

  <!-- 剩余库存 -->
  <rect x="40" y="222" width="700" height="52" rx="9" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.3" filter="url(#rough2)"/>
  <text x="56" y="244" font-size="11" fill="#8a6015" filter="url(#rough2)">三人拿完后库存：S=1, M=0, L=0, XL=0, XXL=0　（L 从 2 减到 0，XXL 从 1 减到 0）</text>
  <text x="56" y="264" font-size="11" fill="#8a6015" filter="url(#rough2)">注意第 2、3 个人都拿了 L：第 2 人拿走一件后，第 3 人看到的是"L 剩 1 件"。</text>

  <text x="40" y="306" font-size="10.5" fill="#555" filter="url(#rough2)">关键点：同距离（如 XL 与 M 相对于 L）时，先试更大的（XL）；因此第 1 个人拿到 XXL 而不是 M。</text>
  <text x="40" y="328" font-size="10.5" fill="#555" filter="url(#rough2)">若把顺序写反（先小后大），第 1 个人会拿 M —— 但 M 库存为 0，会继续到 L，结果完全不同。</text>
  <text x="40" y="350" font-size="10.5" fill="#8c3b37" filter="url(#rough2)">每拿一件立刻扣库存，这是"在线"模拟，不能先统计再分配。</text>
</svg>
