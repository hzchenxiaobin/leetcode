<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="95"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="720" height="480" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1：Z 被反应堆围死，只剩时间限制 t = 3</text>
  <path d="M 130 42 Q 360 48 590 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="120" y="84" width="84" height="84" rx="6" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="162" y="120" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">实验室</text>
  <text x="162" y="144" text-anchor="middle" font-size="10.5" fill="#666655" filter="url(#rough2)">c = 0</text>
  <rect x="212" y="84" width="84" height="84" rx="6" fill="#e4e4df" stroke="#9a9a90" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="254" y="134" text-anchor="middle" font-size="17" font-weight="bold" fill="#6a6a60" filter="url(#rough2)">Y</text>
  <rect x="304" y="84" width="84" height="84" rx="6" fill="#eebcbc" stroke="#b03a36" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="346" y="120" text-anchor="middle" font-size="17" font-weight="bold" fill="#8c2f2c" filter="url(#rough2)">Z</text>
  <text x="346" y="144" text-anchor="middle" font-size="11" fill="#8c2f2c" filter="url(#rough2)">d = 0</text>
  <rect x="120" y="176" width="84" height="84" rx="6" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="162" y="212" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">实验室</text>
  <text x="162" y="236" text-anchor="middle" font-size="10.5" fill="#666655" filter="url(#rough2)">c = 0</text>
  <rect x="212" y="176" width="84" height="84" rx="6" fill="#e4e4df" stroke="#9a9a90" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="254" y="226" text-anchor="middle" font-size="17" font-weight="bold" fill="#6a6a60" filter="url(#rough2)">Y</text>
  <rect x="304" y="176" width="84" height="84" rx="6" fill="#e4e4df" stroke="#9a9a90" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="346" y="226" text-anchor="middle" font-size="17" font-weight="bold" fill="#6a6a60" filter="url(#rough2)">Y</text>
  <rect x="120" y="268" width="84" height="84" rx="6" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="162" y="304" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">实验室</text>
  <text x="162" y="328" text-anchor="middle" font-size="10.5" fill="#666655" filter="url(#rough2)">c = 0</text>
  <rect x="212" y="268" width="84" height="84" rx="6" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="254" y="304" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">实验室</text>
  <text x="254" y="328" text-anchor="middle" font-size="10.5" fill="#666655" filter="url(#rough2)">c = 0</text>
  <rect x="304" y="268" width="84" height="84" rx="6" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="346" y="304" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">实验室</text>
  <text x="346" y="328" text-anchor="middle" font-size="10.5" fill="#666655" filter="url(#rough2)">c = 3</text>
  <path d="M 246 336 L 288 336" stroke="#4a7a3a" stroke-width="2.0" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 204 252 L 204 314" stroke="#4a7a3a" stroke-width="2.0" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="250" y="250" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">2 步</text>
  <text x="168" y="290" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">1 步</text>
  <text x="96" y="342" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">1 步</text>
  <rect x="430" y="84" width="258" height="290" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="559" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">谁能在 3 分钟内到 (2,2)</text>
  <text x="559" y="142" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">(2,0)：距离 2 → 能到</text>
  <text x="559" y="168" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">(1,0)：距离 3 → 能到</text>
  <text x="559" y="194" text-anchor="middle" font-size="12" fill="#8c2f2c" filter="url(#rough2)">(0,0)：距离 4 > 3 → 不能</text>
  <text x="559" y="228" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">污染扩散不出去：</text>
  <text x="559" y="252" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">Z 的邻居全是 Y</text>
  <text x="559" y="276" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">所以 d 全为 ∞，</text>
  <text x="559" y="300" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">规则退化成最短路 ≤ t</text>
  <text x="559" y="336" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5223" filter="url(#rough2)">最大流 = 2</text>
  <text x="360" y="440" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">三个科学家都在左列；救援舱 (2,2) 有 3 个，但只有两人来得及</text>
  <text x="360" y="462" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">(2,0) 与 (1,0) 分头走，走廊容量无限，互不影响</text>
</svg>
