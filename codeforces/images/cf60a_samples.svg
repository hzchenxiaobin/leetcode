<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="66"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="720" height="330" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 3 与样例 4：区间怎么被夹空</text>
  <path d="M 200 40 Q 360 46 520 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 样例 3 -->
  <text x="40" y="78" font-size="12.5" font-weight="bold" fill="#2b4a68" filter="url(#rough2)">n = 3，提示「To the left of 3」</text>
  <g filter="url(#rough2)">
    <rect x="60" y="94" width="66" height="40" fill="#f4f8ee" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="136" y="94" width="66" height="40" fill="#f4f8ee" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="212" y="94" width="66" height="40" fill="#fdf0ef" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="93" y="121" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="169" y="121" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="245" y="121" text-anchor="middle" font-size="13" fill="#8c3a37" filter="url(#rough2)">3 ✗</text>
  <text x="300" y="120" font-size="12" fill="#2b4a68" filter="url(#rough2)">hi = 2，区间 [1,2] ⇒ 答案 2</text>

  <!-- 样例 4 -->
  <text x="40" y="176" font-size="12.5" font-weight="bold" fill="#8c3a37" filter="url(#rough2)">n = 3，提示「To the left of 2」与「To the right of 1」</text>
  <g filter="url(#rough2)">
    <rect x="60" y="192" width="66" height="40" fill="#fdf0ef" stroke="#b85450" stroke-width="1.8"/>
    <rect x="136" y="192" width="66" height="40" fill="#fdf0ef" stroke="#b85450" stroke-width="1.8"/>
    <rect x="212" y="192" width="66" height="40" fill="#fdf0ef" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="93" y="219" text-anchor="middle" font-size="13" fill="#8c3a37" filter="url(#rough2)">1 ✗</text>
  <text x="169" y="219" text-anchor="middle" font-size="13" fill="#8c3a37" filter="url(#rough2)">2 ✗</text>
  <text x="245" y="219" text-anchor="middle" font-size="13" fill="#8c3a37" filter="url(#rough2)">3 ✗</text>
  <text x="300" y="210" font-size="12" fill="#8c3a37" filter="url(#rough2)">left 2 → hi = 1；right 1 → lo = 2</text>
  <text x="300" y="230" font-size="12" font-weight="bold" fill="#8c3a37" filter="url(#rough2)">lo &gt; hi ⇒ 输出 −1</text>

  <!-- 结论 -->
  <rect x="46" y="264" width="628" height="46" rx="8" fill="#eef3f8" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="292" text-anchor="middle" font-size="12.5" fill="#2b4a68" filter="url(#rough2)">区间始终是「所有提示的交集」，所以只需要维护两个端点；区间长度就是必须检查的盒子数</text>
</svg>
