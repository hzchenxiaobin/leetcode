<svg xmlns="http://www.w3.org/2000/svg" width="740" height="380" viewBox="0 0 740 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="610"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="p1" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="740" height="380" fill="#fafafa"/>

  <text x="370" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两段公式：只需 3ˣ、3ʸ 与 Fibonacci 数</text>
  <path d="M 150 40 Q 370 46 590 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 第一段 -->
  <rect x="40" y="62" width="300" height="112" rx="8" fill="#eef3f8" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="56" y="86" font-size="12.5" font-weight="bold" fill="#2b4a68" filter="url(#rough2)">第一段 x 分钟（不排序）</text>
  <text x="56" y="112" font-size="12" fill="#33506b" filter="url(#rough2)">W = Σ(aᵢ + aᵢ₊₁)，I = Σ 中间项</text>
  <text x="56" y="136" font-size="12" fill="#33506b" filter="url(#rough2)">Sₓ = ((3ˣ + 1)/2)·W − I</text>
  <text x="56" y="158" font-size="11" fill="#33506b" filter="url(#rough2)">等价于 3ˣ·S₀ − (a₁+aₙ)(3ˣ−1)/2</text>

  <!-- 中间：排序 -->
  <path d="M 344 118 L 392 118" stroke="#446688" stroke-width="1.8" marker-end="url(#p1)" filter="url(#rough2)"/>
  <text x="368" y="104" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">排序</text>

  <!-- 第二段 -->
  <rect x="396" y="62" width="304" height="112" rx="8" fill="#fdf0ef" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="412" y="86" font-size="12.5" font-weight="bold" fill="#8c3a37" filter="url(#rough2)">第二段 y 分钟</text>
  <text x="412" y="112" font-size="12" fill="#8c3a37" filter="url(#rough2)">首 = a₁（最小值不变）</text>
  <text x="412" y="136" font-size="12" fill="#8c3a37" filter="url(#rough2)">尾 = mₓ = Fₓ·aₙ₋₁ + Fₓ₊₁·aₙ</text>
  <text x="412" y="158" font-size="11" fill="#8c3a37" filter="url(#rough2)">S = 3ʸ·Sₓ − (a₁ + mₓ)(3ʸ − 1)/2</text>

  <!-- 取模 -->
  <rect x="60" y="196" width="620" height="86" rx="8" fill="#fdf6e6" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="76" y="220" font-size="12.5" font-weight="bold" fill="#6b4a10" filter="url(#rough2)">取模 p 时怎么处理除以 2：</text>
  <text x="76" y="242" font-size="11.5" fill="#8a6015" filter="url(#rough2)">p 可能是偶数，2 未必可逆；但 3ˣ 一定是奇数，所以先算 3ˣ mod (2p)：</text>
  <text x="76" y="264" font-size="12" fill="#8a6015" filter="url(#rough2)">记 u = 3ˣ mod 2p（奇数），则 (3ˣ − 1)/2 ≡ (u − 1)/2 (mod p)，(3ˣ + 1)/2 ≡ (u + 1)/2 (mod p)</text>

  <!-- 结论 -->
  <rect x="60" y="296" width="620" height="72" rx="8" fill="#f4f8ee" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="320" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">最终答案</text>
  <text x="76" y="342" font-size="13" fill="#2f5223" filter="url(#rough2)">ans = 3ʸ·Sₓ − (a₁ + mₓ)·(3ʸ − 1)/2　（全部对 p 取模）</text>
  <text x="76" y="362" font-size="11" fill="#3c5e2e" filter="url(#rough2)">3ˣ、3ʸ 快速幂 O(log x)；Fₓ 用快速倍增 O(log x)；其余 O(n) 读入求和</text>
</svg>
