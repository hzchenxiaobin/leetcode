<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="400" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1 的 DP 走查</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">h = 8 2 7 3 1，前缀和 8 10 17 20 21</text>
  <g filter="url(#rough2)"><rect x="120" y="90" width="130" height="40" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="185" y="116" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">dp[1]</text>
  <text x="280" y="116" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">(0, 8)</text>
  <text x="520" y="116" text-anchor="start" font-size="11" fill="#555555" filter="url(#rough2)">整段 [1,1]</text>
  <g filter="url(#rough2)"><rect x="120" y="146" width="130" height="40" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="185" y="172" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">dp[2]</text>
  <text x="280" y="172" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">(1, 10)</text>
  <text x="520" y="172" text-anchor="start" font-size="11" fill="#555555" filter="url(#rough2)">8,2 必须合并</text>
  <g filter="url(#rough2)"><rect x="120" y="202" width="130" height="40" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="185" y="228" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">dp[3]</text>
  <text x="280" y="228" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">(1, 9)</text>
  <text x="520" y="228" text-anchor="start" font-size="11" fill="#555555" filter="url(#rough2)">[8,2] 后接 7</text>
  <g filter="url(#rough2)"><rect x="120" y="258" width="130" height="40" rx="4" fill="#f6d9d7" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="185" y="284" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">dp[4]</text>
  <text x="280" y="284" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">(2, 10)</text>
  <text x="520" y="284" text-anchor="start" font-size="11" fill="#555555" filter="url(#rough2)">[8,2] [7] 后接 3</text>
  <g filter="url(#rough2)"><rect x="120" y="314" width="130" height="40" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="185" y="340" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">dp[5]</text>
  <text x="280" y="340" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">(3, 11)</text>
  <text x="520" y="340" text-anchor="start" font-size="11" fill="#555555" filter="url(#rough2)">最终 10,10,11</text>
  <text x="420" y="380" text-anchor="middle" font-size="13" font-weight="bold" fill="#3d6b2f" filter="url(#rough2)">答案 ops[5] = 3</text>
</svg>
