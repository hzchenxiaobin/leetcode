<svg xmlns="http://www.w3.org/2000/svg" width="760" height="448" viewBox="0 0 760 448"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="760" height="448" fill="#fafafa"/>
  <text x="380" y="30" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">一次查询的五步流水线</text>
  <text x="380" y="52" text-anchor="middle" font-size="11.5" fill="#888888" filter="url(#rough2)">时间 O(k·n + k^2 + k·log_k X)，空间 O(k·n)（k·n ≤ 1.2·10^8）</text>
  <rect x="70" y="66" width="620" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="93" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">① 块长 M = 最小的 k^L ≥ n；基础块 B 跨查询缓存，只建一次</text>
  <rect x="70" y="122" width="620" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="149" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">② 在差分串 D_B 上跑 KMP 找 D_t ⇒ vreq[b] 与 cnt[v]</text>
  <rect x="70" y="178" width="620" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="205" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">③ 两段长 2n 的 Z ⇒ n−1 个跨界偏移的常数对 (u_b, w_b)</text>
  <rect x="70" y="234" width="620" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="261" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">④ O(k·log_k X) 数论：g(A−1, v) 与 D_δ(u)</text>
  <rect x="70" y="290" width="620" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="317" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">⑤ F(X) = Σ cnt[v]·g + Σ D_δ(u_b) + 尾块直扫</text>
  <line x1="380" y1="110" x2="380" y2="120" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar2)" filter="url(#rough2)"/>
  <line x1="380" y1="166" x2="380" y2="176" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar2)" filter="url(#rough2)"/>
  <line x1="380" y1="222" x2="380" y2="232" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar2)" filter="url(#rough2)"/>
  <line x1="380" y1="278" x2="380" y2="288" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar2)" filter="url(#rough2)"/>
  <rect x="60" y="346" width="640" height="66" rx="8" fill="#fdfdfd" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="380" y="366" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">g(N,v) = ⌊N/k⌋ + [ ((v − s_{⌊N/k⌋}) mod k) ≤ N mod k ]</text>
  <text x="380" y="386" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">a = b·k^{r+1} + d·k^r + (k^r − 1)  ⇒  s_a ≡ s_b + d − r (mod k)</text>
  <text x="380" y="404" text-anchor="middle" font-size="10.5" fill="#888888" filter="url(#rough2)">按末尾 (k−1) 的个数 r 与第 r 位 d 分类：每个 (r,d) 只加一段循环区间</text>
  <text x="380" y="432" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">答案 = F(r−n+1) − F(l−1)</text>
</svg>
