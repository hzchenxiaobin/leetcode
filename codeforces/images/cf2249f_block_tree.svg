<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="880" height="480" fill="#fafafa"/>
  <text x="28" y="34" font-size="17" fill="#22333b" filter="url(#rough2)">简单路径 = 块-割点树上 1→n 路径中各块的段拼接</text>
  <text x="28" y="58" font-size="13" fill="#666" filter="url(#rough2)">块之间只共享割点 ⇒ 每段在块内简单 ⇒ 拼起来自动简单</text>
  <circle cx="58" cy="178" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="58" y="182.68" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">1</text>
  <rect x="92" y="118" width="176" height="118" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="140" font-size="12.5" fill="#4a7a3a" text-anchor="middle" font-weight="normal" filter="url(#rough2)">块 A：2-连通</text>
  <line x1="72" y1="190" x2="108" y2="196" stroke="#446688" stroke-width="1.6" opacity="1.0" filter="url(#rough2)"/>
  <line x1="108" y1="196" x2="180" y2="168" stroke="#446688" stroke-width="1.6" opacity="1.0" filter="url(#rough2)"/>
  <line x1="180" y1="168" x2="226" y2="196" stroke="#446688" stroke-width="1.6" opacity="1.0" filter="url(#rough2)"/>
  <line x1="108" y1="196" x2="226" y2="196" stroke="#446688" stroke-width="1.6" opacity="1.0" filter="url(#rough2)"/>
  <circle cx="108" cy="196" r="14" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="108" y="200.32" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">2</text>
  <circle cx="180" cy="168" r="14" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="172.32" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">3</text>
  <circle cx="226" cy="196" r="14" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="226" y="200.32" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">4</text>
  <text x="180" y="226" font-size="11.5" fill="#4a7a3a" text-anchor="middle" font-weight="normal" filter="url(#rough2)">偶段、奇段都可能</text>
  <line x1="242" y1="196" x2="288" y2="184" stroke="#446688" stroke-width="1.6" opacity="1.0" filter="url(#rough2)"/>
  <circle cx="306" cy="178" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="306" y="182.68" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">5</text>
  <text x="306" y="212" font-size="11" fill="#777" text-anchor="middle" font-weight="normal" filter="url(#rough2)">割点</text>
  <line x1="325" y1="178" x2="400" y2="178" stroke="#b85450" stroke-width="2.6" opacity="1.0" filter="url(#rough2)"/>
  <text x="362" y="166" font-size="12.5" fill="#b85450" text-anchor="middle" font-weight="normal" filter="url(#rough2)">桥</text>
  <text x="356" y="204" font-size="11.5" fill="#b85450" text-anchor="middle" font-weight="normal" filter="url(#rough2)">段长恒 1（奇）</text>
  <circle cx="418" cy="178" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="418" y="182.68" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">6</text>
  <text x="418" y="212" font-size="11" fill="#777" text-anchor="middle" font-weight="normal" filter="url(#rough2)">割点</text>
  <rect x="452" y="118" width="196" height="118" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="550" y="140" font-size="12.5" fill="#4a7a3a" text-anchor="middle" font-weight="normal" filter="url(#rough2)">块 C：2-连通</text>
  <line x1="437" y1="182" x2="470" y2="216" stroke="#446688" stroke-width="1.6" opacity="1.0" filter="url(#rough2)"/>
  <line x1="437" y1="182" x2="588" y2="210" stroke="#446688" stroke-width="1.6" opacity="1.0" filter="url(#rough2)"/>
  <line x1="484" y1="214" x2="548" y2="184" stroke="#446688" stroke-width="1.6" opacity="1.0" filter="url(#rough2)"/>
  <line x1="548" y1="184" x2="604" y2="214" stroke="#446688" stroke-width="1.6" opacity="1.0" filter="url(#rough2)"/>
  <line x1="484" y1="214" x2="604" y2="214" stroke="#446688" stroke-width="1.6" opacity="1.0" filter="url(#rough2)"/>
  <circle cx="484" cy="214" r="14" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="484" y="218.32" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">7</text>
  <circle cx="548" cy="184" r="14" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="548" y="188.32" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">8</text>
  <circle cx="604" cy="214" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="604" y="218.32" font-size="12" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">n</text>
  <text x="550" y="228" font-size="11.5" fill="#4a7a3a" text-anchor="middle" font-weight="normal" filter="url(#rough2)">偶/奇两段 → 进 DP</text>
  <rect x="28" y="292" width="252" height="104" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="42" y="318" font-size="13" fill="#8a6d1f" text-anchor="start" font-weight="normal" filter="url(#rough2)">① 桥（割边）</text>
  <text x="42" y="344" font-size="12" fill="#333333" text-anchor="start" font-weight="normal" filter="url(#rough2)">唯一走法 = 这条边，段长 1</text>
  <text x="42" y="368" font-size="12" fill="#333333" text-anchor="start" font-weight="normal" filter="url(#rough2)">对整个答案贡献奇数</text>
  <rect x="310" y="292" width="262" height="104" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="324" y="318" font-size="13" fill="#4a7a3a" text-anchor="start" font-weight="normal" filter="url(#rough2)">② 2-连通块</text>
  <text x="324" y="344" font-size="12" fill="#333333" text-anchor="start" font-weight="normal" filter="url(#rough2)">非二分：偶、奇段都存在</text>
  <text x="324" y="368" font-size="12" fill="#333333" text-anchor="start" font-weight="normal" filter="url(#rough2)">二分：奇偶由染色唯一确定</text>
  <rect x="602" y="292" width="250" height="104" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="616" y="318" font-size="13" fill="#446688" text-anchor="start" font-weight="normal" filter="url(#rough2)">③ 每块只留两个数</text>
  <text x="616" y="344" font-size="12" fill="#333333" text-anchor="start" font-weight="normal" filter="url(#rough2)">（偶最短路，奇最短路）</text>
  <text x="616" y="368" font-size="12" fill="#333333" text-anchor="start" font-weight="normal" filter="url(#rough2)">再逐块做 O(1) 奇偶 DP</text>
  <text x="28" y="432" font-size="12" fill="#666" text-anchor="start" font-weight="normal" filter="url(#rough2)">注：块内“最短奇偶走法”的长度 = “最短奇偶简单路径”的长度（§5 引理 2）</text>
</svg>
