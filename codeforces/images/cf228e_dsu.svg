<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="400" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">带权并查集：边权是到父亲的异或值</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">w_v = x_v ⊕ x_{par(v)}；find 时路径压缩并累加异或</text>
  <g filter="url(#rough2)"><circle cx="180" cy="120" r="24" fill="#d6e6f2" fill-opacity="0.9" stroke="#446688" stroke-width="1.7"/></g>
  <text x="180" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><circle cx="340" cy="120" r="24" fill="#d6e6f2" fill-opacity="0.9" stroke="#446688" stroke-width="1.7"/></g>
  <text x="340" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><circle cx="500" cy="120" r="24" fill="#d6e6f2" fill-opacity="0.9" stroke="#446688" stroke-width="1.7"/></g>
  <text x="500" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><circle cx="660" cy="120" r="24" fill="#d6e6f2" fill-opacity="0.9" stroke="#446688" stroke-width="1.7"/></g>
  <text x="660" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><line x1="204" y1="120" x2="316" y2="120" stroke="#888888" stroke-width="1.5"/></g>
  <text x="260" y="108" text-anchor="middle" font-size="11" fill="#a0522d" filter="url(#rough2)">w=?</text>
  <g filter="url(#rough2)"><line x1="364" y1="120" x2="476" y2="120" stroke="#888888" stroke-width="1.5"/></g>
  <text x="420" y="108" text-anchor="middle" font-size="11" fill="#a0522d" filter="url(#rough2)">w=?</text>
  <g filter="url(#rough2)"><line x1="524" y1="120" x2="636" y2="120" stroke="#888888" stroke-width="1.5"/></g>
  <text x="580" y="108" text-anchor="middle" font-size="11" fill="#a0522d" filter="url(#rough2)">w=?</text>
  <g filter="url(#rough2)"><rect x="140" y="190" width="120" height="34" rx="4" fill="#f7fbf4" fill-opacity="0.85" stroke="#a8c99a" stroke-width="1.3"/></g>
  <text x="200" y="213" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">1-2</text>
  <text x="300" y="213" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">要求异或 0</text>
  <g filter="url(#rough2)"><rect x="140" y="234" width="120" height="34" rx="4" fill="#f7fbf4" fill-opacity="0.85" stroke="#a8c99a" stroke-width="1.3"/></g>
  <text x="200" y="257" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">2-4</text>
  <text x="300" y="257" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">要求异或 1</text>
  <g filter="url(#rough2)"><rect x="140" y="278" width="120" height="34" rx="4" fill="#f7fbf4" fill-opacity="0.85" stroke="#a8c99a" stroke-width="1.3"/></g>
  <text x="200" y="301" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">4-3</text>
  <text x="300" y="301" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">要求异或 0</text>
  <g filter="url(#rough2)"><rect x="140" y="322" width="120" height="34" rx="4" fill="#f7fbf4" fill-opacity="0.85" stroke="#a8c99a" stroke-width="1.3"/></g>
  <text x="200" y="345" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">3-2</text>
  <text x="300" y="345" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">要求异或 1</text>
  <text x="620" y="240" text-anchor="middle" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">合并：w_ru = d ⊕ w_u ⊕ w_v</text>
  <text x="620" y="268" text-anchor="middle" font-size="12" fill="#8a4b2a" filter="url(#rough2)">冲突：同集合且 w_u ⊕ w_v ≠ d</text>
  <text x="620" y="296" text-anchor="middle" font-size="12" fill="#8a4b2a" filter="url(#rough2)">⇒ Impossible</text>
  <text x="420" y="370" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">复杂度 O((n+m)α(n))，10⁵ 规模约 20 ms（限 1 s）</text>
</svg>
