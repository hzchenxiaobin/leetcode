<svg xmlns="http://www.w3.org/2000/svg" width="740" height="470" viewBox="0 0 740 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="740" height="470" fill="#fafafa"/>
  <text x="370" y="34" font-size="20" fill="#2b2b2b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">样例 3×3：13 个根，−1 重复一次 → 12</text>
  <rect x="60" y="66" width="180" height="210" rx="10" fill="#e8f0fe" stroke="#2f4a66" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="92" font-size="14" fill="#2f4a66" text-anchor="middle" font-weight="bold" filter="url(#rough2)">b = 1</text>
  <text x="150" y="122" font-size="12.5" fill="#2f4a66" text-anchor="middle" filter="url(#rough2)">−1（重根）</text>
  <text x="150" y="152" font-size="12.5" fill="#2f4a66" text-anchor="middle" filter="url(#rough2)">（c=2,3 无实根）</text>
  <rect x="280" y="66" width="180" height="210" rx="10" fill="#e6f4ea" stroke="#2f5223" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="370" y="92" font-size="14" fill="#2f5223" text-anchor="middle" font-weight="bold" filter="url(#rough2)">b = 2</text>
  <text x="370" y="122" font-size="12.5" fill="#2f5223" text-anchor="middle" filter="url(#rough2)">−2 ± √3</text>
  <text x="370" y="152" font-size="12.5" fill="#2f5223" text-anchor="middle" filter="url(#rough2)">−2 ± √2</text>
  <text x="370" y="182" font-size="12.5" fill="#2f5223" text-anchor="middle" filter="url(#rough2)">−1 ， −3</text>
  <rect x="500" y="66" width="180" height="210" rx="10" fill="#fff3e0" stroke="#7a5a1b" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="590" y="92" font-size="14" fill="#7a5a1b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">b = 3</text>
  <text x="590" y="122" font-size="12.5" fill="#7a5a1b" text-anchor="middle" filter="url(#rough2)">−3 ± √8</text>
  <text x="590" y="152" font-size="12.5" fill="#7a5a1b" text-anchor="middle" filter="url(#rough2)">−3 ± √7</text>
  <text x="590" y="182" font-size="12.5" fill="#7a5a1b" text-anchor="middle" filter="url(#rough2)">−3 ± √6</text>
  <text x="60" y="306" font-size="12" fill="#2b2b2b" text-anchor="start" filter="url(#rough2)">b = 1：1 个        b = 2：6 个        b = 3：6 个        合计 13 个（按重数）</text>
  <rect x="60" y="322" width="300" height="108" rx="10" fill="#fdeaea" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="78" y="348" font-size="12.5" fill="#8a3030" text-anchor="start" font-weight="bold" filter="url(#rough2)">重复只出现在整数根 −1 上</text>
  <text x="78" y="374" font-size="11.5" fill="#8a3030" text-anchor="start" filter="url(#rough2)">b=1,c=1 的重根 −1</text>
  <text x="78" y="396" font-size="11.5" fill="#8a3030" text-anchor="start" filter="url(#rough2)">b=2,c=3 的左根 −1</text>
  <text x="78" y="420" font-size="11.5" fill="#8a3030" text-anchor="start" filter="url(#rough2)">两个 −1 只算一次</text>
  <path d="M 120 250 C 160 300 250 320 330 330" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <rect x="380" y="322" width="300" height="108" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="398" y="348" font-size="12.5" fill="#2f5223" text-anchor="start" font-weight="bold" filter="url(#rough2)">去重后的另一类：非整数根</text>
  <text x="398" y="374" font-size="11" fill="#3c5e2e" text-anchor="start" filter="url(#rough2)">−2±√3、−2±√2、−3±√8、−3±√7、−3±√6</text>
  <text x="398" y="396" font-size="11.5" fill="#3c5e2e" text-anchor="start" filter="url(#rough2)">共 10 个，两两不同（有理根定理）</text>
  <text x="398" y="420" font-size="12.5" fill="#2f5223" text-anchor="start" font-weight="bold" filter="url(#rough2)">10 + 2 = 12 ✓</text>
</svg>
