<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="340" fill="#fafafa"/>
  <text x="360.0" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">201D：为什么不能只留“最小逆序数”</text>
  <path d="M 144.00 46 Q 360.0 52 576.00 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="72" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">反例：Lesha 的词是 a &lt; b &lt; c（原序），文本是 “b a b c”。</text>
  <text x="60" y="92" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">集合 {a,b} 的两种排列：</text>
  <rect x="60" y="112" width="280" height="92" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="130" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">排列 “a b”：逆序数 0</text>
  <text x="74" y="152" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">  匹配 a@2, b@4 → end = 4</text>
  <text x="74" y="174" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">排列 “b a”：逆序数 1</text>
  <text x="74" y="196" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">  匹配 b@1, a@2 → end = 2</text>
  <rect x="380" y="112" width="280" height="92" rx="9" fill="#fdeef1" stroke="#c0708a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="394" y="130" text-anchor="start" font-size="11" fill="#8a3a52" filter="url(#rough2)">若只留“最小逆序数”：</text>
  <text x="394" y="152" text-anchor="start" font-size="11" fill="#8a3a52" filter="url(#rough2)">  (0, end=4)</text>
  <text x="394" y="174" text-anchor="start" font-size="11" fill="#8a3a52" filter="url(#rough2)">再追加 c：c 只在位置 3</text>
  <text x="394" y="196" text-anchor="start" font-size="11" fill="#8a3a52" filter="url(#rough2)">  → 4 后面没有 c，判为无解</text>
  <path d="M 346 158 L 376 158" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="60" y="232" text-anchor="start" font-size="11" fill="#8a3a52" filter="url(#rough2)">但真正的答案是 “b a c”（逆序数 1）：c 在位置 3，a b 的排列必须结束于 2 之前。</text>
  <rect x="60" y="252" width="600" height="66" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="270" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">所以必须对每个逆序数 x 分别记录最小 end：x=0 时 end=4，x=1 时 end=2，</text>
  <text x="74" y="292" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">两者都需要保留，才能既不错判无解、也不漏掉更优的 x。</text>
</svg>
