<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="520" fill="#fafafa"/>

  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">算法流程：只枚举 4 个候选串的「种子」</text>
  <text x="360" y="47" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">不需要填 ? 的 2^(#?) 种可能，只需要试 (s_1, s_2) 的 4 种组合</text>

  <rect x="170" y="56" width="380" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="360" y="76" text-anchor="middle" font-size="10.5" fill="#2c3e50" filter="url(#rough2)">读入 n 与字符串 s（0-indexed 存成 s[0..n−1]）</text>
  <text x="360" y="93" text-anchor="middle" font-size="9" fill="#7a8fa6" filter="url(#rough2)">s[i] 对应 1-indexed 位置 p = i + 1</text>

  <path d="M 360 102 L 360 126" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="128" width="380" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="360" y="148" text-anchor="middle" font-size="10.5" fill="#2c3e50" filter="url(#rough2)">for b1 ∈ {0,1}：for b2 ∈ {0,1}：共 4 组</text>
  <text x="360" y="166" text-anchor="middle" font-size="9" fill="#7a8fa6" filter="url(#rough2)">b1 是 1 号位的值，b2 是 2 号位的值</text>

  <path d="M 360 176 L 360 200" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="202" width="380" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="360" y="222" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">候选串 t 不显式生成，边比对边推：</text>
  <text x="360" y="242" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">t_p = b1 ⊕ ⌊(p−1)/2⌋ mod 2　（p 奇）</text>
  <text x="360" y="257" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">t_p = b2 ⊕ ⌊(p−2)/2⌋ mod 2　（p 偶）</text>

  <path d="M 360 262 L 360 284" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="360,286 522,330 360,374 198,330" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="324" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">所有固定位都匹配？</text>
  <text x="360" y="342" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">即每个 s[i] ≠ '?' 处 t_p = s[i]</text>

  <!-- 是分支 -->
  <path d="M 198 330 L 162 330" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="178" y="320" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="46" y="306" width="112" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="102" y="327" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5527" filter="url(#rough2)">ans += 1</text>
  <text x="102" y="344" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">这一组装法合法</text>

  <!-- 否分支 -->
  <path d="M 522 330 L 558 330" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="540" y="320" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="560" y="306" width="136" height="48" fill="#fdf0f2" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="628" y="327" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">该候选作废</text>
  <text x="628" y="344" text-anchor="middle" font-size="8.5" fill="#b0797c" filter="url(#rough2)">与已知字符冲突</text>

  <!-- 枚举循环 -->
  <path d="M 102 306 L 102 152 L 164 152" stroke="#8a9bb0" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="86" y="238" text-anchor="middle" font-size="9.5" fill="#7a8fa6" transform="rotate(-90 86 238)" filter="url(#rough2)">换下一组 (b1, b2)</text>

  <!-- 汇合 -->
  <path d="M 102 354 L 102 396 L 628 396 L 628 354" stroke="#8a9bb0" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 360 396 L 360 414" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="238" y="390" font-size="9" fill="#999" filter="url(#rough2)">4 组都试完后汇合</text>

  <rect x="200" y="416" width="320" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="360" y="437" text-anchor="middle" font-size="10.5" fill="#2c3e50" filter="url(#rough2)">输出 ans mod 998244353</text>
  <text x="360" y="454" text-anchor="middle" font-size="9" fill="#7a8fa6" filter="url(#rough2)">答案不超过 4，模数实际永不生效</text>

  <text x="360" y="492" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">每个候选只要一次 O(n) 比对：总复杂度 O(4n) = O(n)，且完全不用递归 / 建串</text>
  <text x="360" y="508" text-anchor="middle" font-size="9" fill="#bbb" filter="url(#rough2)">也可以直接把这 4 个候选串算出来再逐位比较，写法更短，复杂度相同</text>
</svg>
