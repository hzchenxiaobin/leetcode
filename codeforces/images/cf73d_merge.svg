<svg xmlns="http://www.w3.org/2000/svg" width="720" height="372" viewBox="0 0 720 372"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr73d" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="372" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">合并两个单点省：省数 −1、容量不变、缺口 −2（k ≥ 2）</text>
  <path d="M 90 40 Q 360 46 630 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 合并前 -->
  <text x="60" y="76" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">合并前：s 个省</text>
  <g filter="url(#rough2)">
    <circle cx="90" cy="118" r="16" fill="#fde8e6" stroke="#b85450" stroke-width="1.7"/>
    <circle cx="150" cy="118" r="16" fill="#fde8e6" stroke="#b85450" stroke-width="1.7"/>
    <circle cx="210" cy="118" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.7"/>
    <circle cx="270" cy="118" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.7"/>
  </g>
  <g font-size="11" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">
    <text x="90" y="122">1</text>
    <text x="150" y="122">1</text>
    <text x="210" y="122">c₃</text>
    <text x="270" y="122">c₄</text>
  </g>
  <text x="90" y="152" font-size="10.5" text-anchor="middle" fill="#8a2b28" filter="url(#rough2)">容量 1</text>
  <text x="150" y="152" font-size="10.5" text-anchor="middle" fill="#8a2b28" filter="url(#rough2)">容量 1</text>
  <text x="330" y="122" font-size="12" fill="#555" filter="url(#rough2)">…</text>

  <text x="60" y="182" font-size="12" fill="#5a3a6a" filter="url(#rough2)">Σm = 1+1 + (其余) ；需求 2(s−1)</text>

  <!-- 箭头 -->
  <path d="M 380 118 Q 360 200 380 226" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr73d)" filter="url(#rough2)"/>
  <text x="395" y="176" font-size="12" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">修一条路</text>
  <text x="395" y="196" font-size="11" fill="#8a2b28" filter="url(#rough2)">把两个单点省并成 2 城省</text>
  <text x="395" y="214" font-size="11" fill="#8a2b28" filter="url(#rough2)">容量：1 + 1 → min(k,2) = 2（k≥2 时不变）</text>

  <!-- 合并后 -->
  <text x="60" y="256" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">合并后：s−1 个省</text>
  <g filter="url(#rough2)">
    <circle cx="120" cy="298" r="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.9"/>
    <circle cx="210" cy="298" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.7"/>
    <circle cx="270" cy="298" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.7"/>
  </g>
  <text x="120" y="303" font-size="11.5" text-anchor="middle" fill="#7a5a1b" filter="url(#rough2)">2</text>
  <g font-size="11" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">
    <text x="210" y="302">c₃</text>
    <text x="270" y="302">c₄</text>
  </g>
  <text x="120" y="336" font-size="10.5" text-anchor="middle" fill="#7a5a1b" filter="url(#rough2)">容量 min(k,2)=2</text>

  <rect x="420" y="248" width="270" height="94" rx="10" fill="#f4f0fa" stroke="#7a4a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="436" y="270" font-size="12.5" font-weight="bold" fill="#5a3a6a" filter="url(#rough2)">缺口 D = 2(s−1) − Σm</text>
  <text x="436" y="292" font-size="11.5" fill="#5a3a6a" filter="url(#rough2)">合并：需求 −2，容量 −loss</text>
  <text x="436" y="312" font-size="11.5" fill="#5a3a6a" filter="url(#rough2)">D → D − 2 + loss</text>
  <text x="436" y="332" font-size="11.5" fill="#5a3a6a" filter="url(#rough2)">单点省合并 loss = 0 ⇒ D 恰好 −2</text>
</svg>
