<svg xmlns="http://www.w3.org/2000/svg" width="700" height="400" viewBox="0 0 700 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="97"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="mg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2f7a3a"/>
    </marker>
  </defs>
  <rect width="700" height="400" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每次把最小的两个省合并：损失最小、端点总数最大</text>
  <path d="M 140 40 Q 350 46 570 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 合并示意 -->
  <g filter="url(#rough2)">
    <rect x="60" y="76" width="70" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="95" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66">1</text>
    <rect x="150" y="76" width="70" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="185" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66">1</text>
    <rect x="240" y="76" width="70" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="275" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66">5</text>
  </g>
  <text x="95" y="144" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">最小</text>
  <text x="185" y="144" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">次小</text>
  <g filter="url(#rough2)" stroke="#2f7a3a" stroke-width="2.2" fill="none">
    <path d="M 130 99 C 150 60 200 60 220 92" marker-end="url(#mg)"/>
  </g>
  <text x="175" y="56" text-anchor="middle" font-size="11" fill="#1f5226" filter="url(#rough2)">合并</text>
  <g filter="url(#rough2)">
    <rect x="330" y="76" width="90" height="46" rx="8" fill="#e6f4ea" stroke="#2f7a3a" stroke-width="1.8"/>
    <text x="375" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f5226">2</text>
    <rect x="440" y="76" width="70" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="475" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66">5</text>
  </g>
  <text x="375" y="144" text-anchor="middle" font-size="10.5" fill="#1f5226" filter="url(#rough2)">合并后（回到堆里）</text>

  <!-- 损失公式 -->
  <rect x="60" y="170" width="580" height="86" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="196" font-size="12.5" font-weight="bold" fill="#8a6015">合并 a、b 的端点损失：</text>
  <text x="76" y="222" font-size="13" font-weight="bold" fill="#8c2f2b">loss(a,b) = min(k,a) + min(k,b) − min(k,a+b)</text>
  <text x="76" y="246" font-size="11.5" fill="#7a5a1b">a+b ≤ k 时 loss=0（免费）；两边都 ≥ k 时 loss 最大。loss 随 a、b 单调不减 ⇒ 合并最小的两块最划算。</text>

  <!-- 进度示意 -->
  <rect x="60" y="272" width="580" height="110" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="76" y="298" font-size="12.5" font-weight="bold" fill="#2f4a66">样例三（4 个孤立城，k=2）：</text>
  <text x="76" y="322" font-size="11.5" fill="#2f4a66">初始 C = 1+1+1+1 = 4，需求 2(p−1) = 6 → 差 2</text>
  <text x="76" y="346" font-size="11.5" fill="#2f4a66">合并两个 1（loss = 0）：C = 4，g = 3，需求 4 → 满足 ✓ 修 1 条路</text>
  <text x="76" y="370" font-size="11.5" fill="#2f4a66">每合并一次，需求降 2、C 最多降 loss ⇒ 收益 2 − loss；loss=0 时收益最大</text>
</svg>
