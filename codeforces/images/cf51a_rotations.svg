<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="720" height="400" fill="#fafafa"/>
  <text x="360.0" y="33" font-size="20" font-weight="bold" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">2×2 牌面的四种旋转</text>
  <path d="M 300 44 Q 360.0 50 420 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="114" y="76" font-size="13" font-weight="bold" fill="#555" text-anchor="middle" filter="url(#rough2)">0°</text>
  <g filter="url(#rough2)">
    <rect x="60" y="88" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="114" y="88" width="54" height="54" fill="#fff8e1" stroke="#446688" stroke-width="1.3"/>
    <rect x="60" y="142" width="54" height="54" fill="#fff8e1" stroke="#446688" stroke-width="1.3"/>
    <rect x="114" y="142" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="87.0" y="122.2" font-size="20" font-weight="normal" fill="#22303f" text-anchor="middle" filter="url(#rough2)">3</text>
  <text x="141.0" y="122.2" font-size="20" font-weight="normal" fill="#22303f" text-anchor="middle" filter="url(#rough2)">1</text>
  <text x="87.0" y="176.2" font-size="20" font-weight="normal" fill="#22303f" text-anchor="middle" filter="url(#rough2)">2</text>
  <text x="141.0" y="176.2" font-size="20" font-weight="normal" fill="#22303f" text-anchor="middle" filter="url(#rough2)">3</text>
  <text x="114" y="218" font-size="13" font-weight="normal" fill="#22303f" text-anchor="middle" filter="url(#rough2)">(3,1,2,3)</text>
  <g filter="url(#rough2)">
    <path d="M 172 142 L 204 142" stroke="#7a8b9a" stroke-width="1.4" fill="none"/>
    <polygon points="204,142 195,137 195,147" fill="#7a8b9a"/>
  </g>
  <text x="264" y="76" font-size="13" font-weight="bold" fill="#555" text-anchor="middle" filter="url(#rough2)">90°</text>
  <g filter="url(#rough2)">
    <rect x="210" y="88" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="264" y="88" width="54" height="54" fill="#fff8e1" stroke="#446688" stroke-width="1.3"/>
    <rect x="210" y="142" width="54" height="54" fill="#fff8e1" stroke="#446688" stroke-width="1.3"/>
    <rect x="264" y="142" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="237.0" y="122.2" font-size="20" font-weight="normal" fill="#22303f" text-anchor="middle" filter="url(#rough2)">2</text>
  <text x="291.0" y="122.2" font-size="20" font-weight="normal" fill="#22303f" text-anchor="middle" filter="url(#rough2)">3</text>
  <text x="237.0" y="176.2" font-size="20" font-weight="normal" fill="#22303f" text-anchor="middle" filter="url(#rough2)">3</text>
  <text x="291.0" y="176.2" font-size="20" font-weight="normal" fill="#22303f" text-anchor="middle" filter="url(#rough2)">1</text>
  <text x="264" y="218" font-size="13" font-weight="normal" fill="#22303f" text-anchor="middle" filter="url(#rough2)">(2,3,3,1)</text>
  <g filter="url(#rough2)">
    <path d="M 322 142 L 354 142" stroke="#7a8b9a" stroke-width="1.4" fill="none"/>
    <polygon points="354,142 345,137 345,147" fill="#7a8b9a"/>
  </g>
  <text x="414" y="76" font-size="13" font-weight="bold" fill="#555" text-anchor="middle" filter="url(#rough2)">180°</text>
  <g filter="url(#rough2)">
    <rect x="360" y="88" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="414" y="88" width="54" height="54" fill="#fff8e1" stroke="#446688" stroke-width="1.3"/>
    <rect x="360" y="142" width="54" height="54" fill="#fff8e1" stroke="#446688" stroke-width="1.3"/>
    <rect x="414" y="142" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="387.0" y="122.2" font-size="20" font-weight="normal" fill="#22303f" text-anchor="middle" filter="url(#rough2)">3</text>
  <text x="441.0" y="122.2" font-size="20" font-weight="normal" fill="#22303f" text-anchor="middle" filter="url(#rough2)">2</text>
  <text x="387.0" y="176.2" font-size="20" font-weight="normal" fill="#22303f" text-anchor="middle" filter="url(#rough2)">1</text>
  <text x="441.0" y="176.2" font-size="20" font-weight="normal" fill="#22303f" text-anchor="middle" filter="url(#rough2)">3</text>
  <text x="414" y="218" font-size="13" font-weight="normal" fill="#22303f" text-anchor="middle" filter="url(#rough2)">(3,2,1,3)</text>
  <g filter="url(#rough2)">
    <path d="M 472 142 L 504 142" stroke="#7a8b9a" stroke-width="1.4" fill="none"/>
    <polygon points="504,142 495,137 495,147" fill="#7a8b9a"/>
  </g>
  <text x="564" y="76" font-size="13" font-weight="bold" fill="#555" text-anchor="middle" filter="url(#rough2)">270°</text>
  <g filter="url(#rough2)">
    <rect x="510" y="88" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="564" y="88" width="54" height="54" fill="#fff8e1" stroke="#446688" stroke-width="1.3"/>
    <rect x="510" y="142" width="54" height="54" fill="#fff8e1" stroke="#446688" stroke-width="1.3"/>
    <rect x="564" y="142" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="537.0" y="122.2" font-size="20" font-weight="normal" fill="#22303f" text-anchor="middle" filter="url(#rough2)">1</text>
  <text x="591.0" y="122.2" font-size="20" font-weight="normal" fill="#22303f" text-anchor="middle" filter="url(#rough2)">3</text>
  <text x="537.0" y="176.2" font-size="20" font-weight="normal" fill="#22303f" text-anchor="middle" filter="url(#rough2)">3</text>
  <text x="591.0" y="176.2" font-size="20" font-weight="normal" fill="#22303f" text-anchor="middle" filter="url(#rough2)">2</text>
  <text x="564" y="218" font-size="13" font-weight="bold" fill="#22303f" text-anchor="middle" filter="url(#rough2)">(1,3,3,2)</text>
  <text x="360" y="244" font-size="11.5" font-weight="normal" fill="#666" text-anchor="middle" filter="url(#rough2)">每转 90° 就把四个数字按 (a,b,c,d) → (c,a,d,b) 重排</text>
  <rect x="60" y="258" width="600" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="280" font-size="13" font-weight="bold" fill="#2f5223" text-anchor="middle" filter="url(#rough2)">四个元组里字典序最小的是 (1,3,3,2)：整条旋转轨道只保留它</text>
  <text x="360" y="299" font-size="12" font-weight="normal" fill="#2f5223" text-anchor="middle" filter="url(#rough2)">两张牌相似 ⇔ 规范化后完全相等；堆数 = 不同规范形的个数</text>
  <text x="360" y="338" font-size="12.5" font-weight="bold" fill="#7a3b36" text-anchor="middle" filter="url(#rough2)">只允许旋转 90° / 180° / 270°，不许翻面</text>
  <text x="360" y="358" font-size="11.5" font-weight="normal" fill="#7a3b36" text-anchor="middle" filter="url(#rough2)">翻面会把 12/34 变成 21/43，这两张牌本题不认为相似</text>
</svg>
