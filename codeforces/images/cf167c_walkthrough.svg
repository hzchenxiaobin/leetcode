<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="760" height="470" fill="#fafafa"/>

  <text x="56" y="70" font-size="11.5" text-anchor="start" fill="#35507a" font-weight="bold" filter="url(#rough2)">输入 (a,b)</text>
  <text x="176" y="70" font-size="11.5" text-anchor="start" fill="#35507a" font-weight="bold" filter="url(#rough2)">余数与步数</text>
  <text x="306" y="70" font-size="11.5" text-anchor="start" fill="#35507a" font-weight="bold" filter="url(#rough2)">递归子局面</text>
  <text x="470" y="70" font-size="11.5" text-anchor="start" fill="#35507a" font-weight="bold" filter="url(#rough2)">g</text>
  <text x="540" y="70" font-size="11.5" text-anchor="start" fill="#35507a" font-weight="bold" filter="url(#rough2)">链内判定</text>
  <text x="668" y="70" font-size="11.5" text-anchor="start" fill="#35507a" font-weight="bold" filter="url(#rough2)">答案</text>
  <line x1="40" y1="79" x2="720" y2="79" stroke="#555" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="34" y="83" width="692" height="62" rx="6" fill="#f7fbf4" stroke="#c9d6e4" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="56" y="104" font-size="12" text-anchor="start" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">10 21</text>
  <text x="176" y="104" font-size="11.5" text-anchor="start" fill="#35507a" filter="url(#rough2)">r=1, j=2</text>
  <text x="306" y="104" font-size="10.5" text-anchor="start" fill="#555" filter="url(#rough2)">(1,10)：取模走到 0 → 必胜</text>
  <text x="470" y="104" font-size="11.5" text-anchor="start" fill="#7a2f2f" filter="url(#rough2)">g=真</text>
  <text x="540" y="104" font-size="10.5" text-anchor="start" fill="#555" filter="url(#rough2)">a=10 偶, 2 mod 11 偶</text>
  <text x="668" y="104" font-size="12.5" text-anchor="start" fill="#2f5223" font-weight="bold" filter="url(#rough2)">First</text>
  <rect x="34" y="157" width="692" height="62" rx="6" fill="#fdf7f7" stroke="#c9d6e4" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="56" y="178" font-size="12" text-anchor="start" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">31 10</text>
  <text x="176" y="178" font-size="11.5" text-anchor="start" fill="#35507a" filter="url(#rough2)">r=1, j=3</text>
  <text x="306" y="178" font-size="10.5" text-anchor="start" fill="#555" filter="url(#rough2)">(1,10)：取模走到 0 → 必胜</text>
  <text x="470" y="178" font-size="11.5" text-anchor="start" fill="#7a2f2f" filter="url(#rough2)">g=真</text>
  <text x="540" y="178" font-size="10.5" text-anchor="start" fill="#555" filter="url(#rough2)">a=10 偶, 3 mod 11 奇</text>
  <text x="668" y="178" font-size="12.5" text-anchor="start" fill="#b85450" font-weight="bold" filter="url(#rough2)">Second</text>
  <rect x="34" y="231" width="692" height="62" rx="6" fill="#fdf7f7" stroke="#c9d6e4" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="56" y="252" font-size="12" text-anchor="start" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">0 1</text>
  <text x="176" y="252" font-size="11.5" text-anchor="start" fill="#35507a" filter="url(#rough2)">a=0</text>
  <text x="306" y="252" font-size="10.5" text-anchor="start" fill="#555" filter="url(#rough2)">无路可走</text>
  <text x="470" y="252" font-size="11.5" text-anchor="start" fill="#2f5223" filter="url(#rough2)">g=假</text>
  <text x="540" y="252" font-size="10.5" text-anchor="start" fill="#555" filter="url(#rough2)">—</text>
  <text x="668" y="252" font-size="12.5" text-anchor="start" fill="#b85450" font-weight="bold" filter="url(#rough2)">Second</text>
  <rect x="34" y="305" width="692" height="62" rx="6" fill="#f7fbf4" stroke="#c9d6e4" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="56" y="326" font-size="12" text-anchor="start" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">10 30</text>
  <text x="176" y="326" font-size="11.5" text-anchor="start" fill="#35507a" filter="url(#rough2)">r=0, j=3</text>
  <text x="306" y="326" font-size="10.5" text-anchor="start" fill="#555" filter="url(#rough2)">(0,10)：有 0 → 必败</text>
  <text x="470" y="326" font-size="11.5" text-anchor="start" fill="#2f5223" filter="url(#rough2)">g=假</text>
  <text x="540" y="326" font-size="10.5" text-anchor="start" fill="#555" filter="url(#rough2)">取模直接获胜</text>
  <text x="668" y="326" font-size="12.5" text-anchor="start" fill="#2f5223" font-weight="bold" filter="url(#rough2)">First</text>
  <text x="40" y="406" font-size="11.5" text-anchor="start" fill="#2b2b2b" filter="url(#rough2)">注意 g 的含义：它是“轮到对手走 (r,a) 时对手是否必胜”。g 为假，当前玩家取模即胜。</text>
  <text x="40" y="430" font-size="11.5" text-anchor="start" fill="#555" filter="url(#rough2)">因此 g 为假 → 链上任意 j ≥ 1 都必胜；g 为真 → 才需要看 j 的模式。</text>
  <text x="380.0" y="36" font-size="20" text-anchor="middle" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">样例走查：先递归到底，再按 j 的奇偶性判定</text>
  <path d="M 120 46 Q 380.0 52 640 46" fill="none" stroke="#2b2b2b" stroke-width="1.3" filter="url(#rough2)"/>
</svg>
