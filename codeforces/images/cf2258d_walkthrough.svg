<svg xmlns="http://www.w3.org/2000/svg" width="860" height="450" viewBox="0 0 860 450"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#55606e"/>
    </marker>
  </defs>
  <rect width="860" height="450" fill="#fafafa"/>

  <text x="430" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">演算：最大段都是 110，靠第二个元素分胜负</text>
  <path d="M 140 40 Q 430 48 720 40" stroke="#2b2b2b" stroke-width="1.1" fill="none" filter="url(#rough2)"/>

  <text x="430" y="62" text-anchor="middle" font-size="12.5" fill="#55606e" filter="url(#rough2)">链：a1=1（列1）  w1=15  a2=10（列2）  w2=10  a3=100（列1）</text>

  <!-- 链条示意（宽度按数量级缩放） -->
  <g filter="url(#rough2)">
    <rect x="40" y="76" width="34" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="57" y="102" text-anchor="middle" font-size="11" fill="#2f4a66">1</text>
    <line x1="74" y1="97" x2="212" y2="97" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="5 3"/>
    <text x="143" y="90" text-anchor="middle" font-size="11" fill="#8a6520">w1 = 15</text>
    <rect x="212" y="76" width="92" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="258" y="102" text-anchor="middle" font-size="11" fill="#3c5e2e">10</text>
    <line x1="304" y1="97" x2="408" y2="97" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="5 3"/>
    <text x="356" y="90" text-anchor="middle" font-size="11" fill="#8a6520">w2 = 10</text>
    <rect x="408" y="76" width="150" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="483" y="102" text-anchor="middle" font-size="11" fill="#2f4a66">100</text>

    <text x="57" y="134" text-anchor="middle" font-size="10.5" fill="#8a8a8a">a1</text>
    <text x="258" y="134" text-anchor="middle" font-size="10.5" fill="#8a8a8a">a2</text>
    <text x="483" y="134" text-anchor="middle" font-size="10.5" fill="#8a8a8a">a3</text>

    <rect x="590" y="76" width="240" height="58" rx="8" fill="#f7fbff" stroke="#446688" stroke-width="1.3"/>
    <text x="604" y="96" font-size="11.5" fill="#2f4a66">x1=1：w1 给 a1；x1=0：w1 给 a2</text>
    <text x="604" y="116" font-size="11.5" fill="#2f4a66">x2=1：w2 给 a2；x2=0：w2 给 a3</text>
  </g>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="56" y="166" width="748" height="30" rx="6" fill="#eef2f7" stroke="#9aa7b5" stroke-width="1.2"/>
    <text x="90" y="186" text-anchor="middle" font-size="12" fill="#2f4a66">x1</text>
    <text x="140" y="186" text-anchor="middle" font-size="12" fill="#2f4a66">x2</text>
    <text x="250" y="186" text-anchor="middle" font-size="12" fill="#2f4a66">c1</text>
    <text x="330" y="186" text-anchor="middle" font-size="12" fill="#2f4a66">c2</text>
    <text x="410" y="186" text-anchor="middle" font-size="12" fill="#2f4a66">c3</text>
    <text x="560" y="186" text-anchor="middle" font-size="12" fill="#2f4a66">降序的三段长</text>
    <text x="710" y="186" text-anchor="middle" font-size="12" fill="#2f4a66">结论</text>

    <!-- 行 1 -->
    <text x="90" y="218" text-anchor="middle" font-size="12.5" fill="#333">1</text>
    <text x="140" y="218" text-anchor="middle" font-size="12.5" fill="#333">1</text>
    <text x="250" y="218" text-anchor="middle" font-size="12.5" fill="#333">16</text>
    <text x="330" y="218" text-anchor="middle" font-size="12.5" fill="#333">20</text>
    <text x="410" y="218" text-anchor="middle" font-size="12.5" fill="#333">100</text>
    <text x="560" y="218" text-anchor="middle" font-size="12.5" fill="#333">100, 20, 16</text>
    <text x="710" y="218" text-anchor="middle" font-size="11.5" fill="#8a8a8a">最大只有 100</text>

    <!-- 行 2 -->
    <text x="90" y="252" text-anchor="middle" font-size="12.5" fill="#333">1</text>
    <text x="140" y="252" text-anchor="middle" font-size="12.5" fill="#333">0</text>
    <text x="250" y="252" text-anchor="middle" font-size="12.5" fill="#333">16</text>
    <text x="330" y="252" text-anchor="middle" font-size="12.5" fill="#333">10</text>
    <text x="410" y="252" text-anchor="middle" font-size="12.5" fill="#333">110</text>
    <text x="560" y="252" text-anchor="middle" font-size="12.5" fill="#333">110, 16, 10</text>
    <text x="710" y="252" text-anchor="middle" font-size="11.5" fill="#a03a36">次优：110 平手、16 落后</text>

    <!-- 行 3 -->
    <text x="90" y="286" text-anchor="middle" font-size="12.5" fill="#333">0</text>
    <text x="140" y="286" text-anchor="middle" font-size="12.5" fill="#333">1</text>
    <text x="250" y="286" text-anchor="middle" font-size="12.5" fill="#333">1</text>
    <text x="330" y="286" text-anchor="middle" font-size="12.5" fill="#333">35</text>
    <text x="410" y="286" text-anchor="middle" font-size="12.5" fill="#333">100</text>
    <text x="560" y="286" text-anchor="middle" font-size="12.5" fill="#333">100, 35, 1</text>
    <text x="710" y="286" text-anchor="middle" font-size="11.5" fill="#8a8a8a">最大只有 100</text>

    <!-- 行 4（最优） -->
    <rect x="60" y="298" width="740" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="90" y="320" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e">0</text>
    <text x="140" y="320" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e">0</text>
    <text x="250" y="320" text-anchor="middle" font-size="12.5" fill="#3c5e2e">1</text>
    <text x="330" y="320" text-anchor="middle" font-size="12.5" fill="#3c5e2e">25</text>
    <text x="410" y="320" text-anchor="middle" font-size="12.5" fill="#3c5e2e">110</text>
    <text x="560" y="320" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e">110, 25, 1</text>
    <text x="710" y="320" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3c5e2e">最优</text>
  </g>

  <!-- 说明 -->
  <g filter="url(#rough2)">
    <rect x="60" y="348" width="360" height="82" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="74" y="370" font-size="12" font-weight="bold" fill="#8a6520">为什么不能只看“最大段”？</text>
    <text x="74" y="390" font-size="11.5" fill="#8a6520">(1,0) 与 (0,0) 的最大段都是 110；</text>
    <text x="74" y="408" font-size="11.5" fill="#8a6520">再比第二个：25 &gt; 16，所以 (0,0) 更优。</text>
    <text x="74" y="424" font-size="11.5" fill="#8a6520">这正是 DP 要比“整个降序向量”的原因。</text>

    <rect x="452" y="348" width="348" height="82" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <text x="466" y="370" font-size="12" font-weight="bold" fill="#a03a36">对照贪心：先拿最大块会翻车</text>
    <text x="466" y="390" font-size="11.5" fill="#a03a36">“先让 a2 吃掉两个窗口”得 (16,20,100)，</text>
    <text x="466" y="408" font-size="11.5" fill="#a03a36">最大段只有 100，输给 (0,0) 的 110。</text>
    <text x="466" y="424" font-size="11.5" fill="#a03a36">窗口该给谁，取决于最终长度的大小。</text>
  </g>
</svg>
