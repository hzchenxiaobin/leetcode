<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="660" height="400" fill="#fafafa" filter="url(#rough2)"/>

  <text x="330" y="30" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    算法流程：一步判定，O(n) 构造
  </text>

  <rect x="230" y="48" width="200" height="42" rx="8" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="75" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    读入 n, k, m
  </text>

  <path d="M330,90 L330,112" stroke="#446688" stroke-width="1.6"
        marker-end="url(#arr3)" fill="none" filter="url(#rough2)"/>

  <polygon points="330,114 470,154 330,194 190,154" fill="#fff8e1" stroke="#d6a040"
           stroke-width="2" filter="url(#rough2)"/>
  <text x="330" y="160" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">k &gt; m ?</text>

  <path d="M190,154 L128,154" stroke="#446688" stroke-width="1.6"
        marker-end="url(#arr3)" fill="none" filter="url(#rough2)"/>
  <text x="158" y="144" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>

  <rect x="24" y="132" width="102" height="44" rx="8" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.8" filter="url(#rough2)"/>
  <text x="75" y="160" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">输出 NO</text>

  <path d="M330,194 L330,220" stroke="#446688" stroke-width="1.6"
        marker-end="url(#arr3)" fill="none" filter="url(#rough2)"/>
  <text x="346" y="212" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <rect x="230" y="222" width="200" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="249" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">
    输出 YES
  </text>

  <path d="M330,264 L330,290" stroke="#446688" stroke-width="1.6"
        marker-end="url(#arr3)" fill="none" filter="url(#rough2)"/>

  <rect x="120" y="292" width="420" height="54" rx="8" fill="#ffffff" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="315" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    构造前缀余数 pi = i mod k（以 k 为周期，取值 0..k-1 ⊂ 0..m-1）
  </text>
  <text x="330" y="336" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    再取 ai ≡ pi - p(i-1) (mod m) 的最小正代表
  </text>

  <text x="330" y="374" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">
    即 ai = 1（i mod k ≠ 0），ai = m - k + 1（i mod k = 0）
  </text>
</svg>
