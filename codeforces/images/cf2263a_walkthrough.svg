<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="350" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：数一遍 1，再和阈值 E 比大小</text>

  <text x="50" y="66" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#rough2)">用例</text>
  <text x="228" y="66" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#rough2)">数组（绿格 = 1）</text>
  <text x="390" y="66" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#rough2)">统计与比较</text>
  <text x="580" y="66" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#rough2)">胜者</text>

  <!-- 例 1：n=5, 1 0 1 0 1 -->
  <text x="36" y="102" font-size="12.5" fill="#444" filter="url(#rough2)">例1 n=5</text>
  <rect x="140" y="80" width="32" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="176" y="80" width="32" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="212" y="80" width="32" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="248" y="80" width="32" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="284" y="80" width="32" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="156" y="102" text-anchor="middle" font-size="15" fill="#33582a" filter="url(#rough2)">1</text>
  <text x="192" y="102" text-anchor="middle" font-size="15" fill="#2f4a66" filter="url(#rough2)">0</text>
  <text x="228" y="102" text-anchor="middle" font-size="15" fill="#33582a" filter="url(#rough2)">1</text>
  <text x="264" y="102" text-anchor="middle" font-size="15" fill="#2f4a66" filter="url(#rough2)">0</text>
  <text x="300" y="102" text-anchor="middle" font-size="15" fill="#33582a" filter="url(#rough2)">1</text>
  <text x="340" y="102" font-size="12.5" fill="#7a4a46" filter="url(#rough2)">c=3，E=2，3 &gt; 2</text>
  <rect x="520" y="81" width="120" height="30" rx="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="580" y="101" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#33582a" filter="url(#rough2)">Bessie</text>

  <!-- 例 2：n=3, 0 0 1 -->
  <text x="36" y="146" font-size="12.5" fill="#444" filter="url(#rough2)">例2 n=3</text>
  <rect x="140" y="124" width="32" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="176" y="124" width="32" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="212" y="124" width="32" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="156" y="146" text-anchor="middle" font-size="15" fill="#2f4a66" filter="url(#rough2)">0</text>
  <text x="192" y="146" text-anchor="middle" font-size="15" fill="#2f4a66" filter="url(#rough2)">0</text>
  <text x="228" y="146" text-anchor="middle" font-size="15" fill="#33582a" filter="url(#rough2)">1</text>
  <text x="340" y="146" font-size="12.5" fill="#7a4a46" filter="url(#rough2)">c=1，E=1，1 ≤ 1</text>
  <rect x="520" y="125" width="120" height="30" rx="15" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="580" y="145" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8c3a37" filter="url(#rough2)">Elsie</text>

  <!-- 例 3：n=4, 1 1 0 0 -->
  <text x="36" y="190" font-size="12.5" fill="#444" filter="url(#rough2)">例3 n=4</text>
  <rect x="140" y="168" width="32" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="176" y="168" width="32" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="212" y="168" width="32" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="248" y="168" width="32" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="156" y="190" text-anchor="middle" font-size="15" fill="#33582a" filter="url(#rough2)">1</text>
  <text x="192" y="190" text-anchor="middle" font-size="15" fill="#33582a" filter="url(#rough2)">1</text>
  <text x="228" y="190" text-anchor="middle" font-size="15" fill="#2f4a66" filter="url(#rough2)">0</text>
  <text x="264" y="190" text-anchor="middle" font-size="15" fill="#2f4a66" filter="url(#rough2)">0</text>
  <text x="340" y="190" font-size="12.5" fill="#7a4a46" filter="url(#rough2)">c=2，E=1，2 &gt; 1</text>
  <rect x="520" y="169" width="120" height="30" rx="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="580" y="189" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#33582a" filter="url(#rough2)">Bessie</text>

  <!-- 阈值表 -->
  <text x="380" y="228" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">阈值表：Bessie 至少需要 ceil(n/2) 个 1</text>
  <rect x="134" y="240" width="60" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="206" y="240" width="60" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="278" y="240" width="60" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="350" y="240" width="60" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="422" y="240" width="60" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="494" y="240" width="60" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="566" y="240" width="60" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="164" y="260" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#rough2)">n=2</text>
  <text x="236" y="260" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#rough2)">n=3</text>
  <text x="308" y="260" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#rough2)">n=4</text>
  <text x="380" y="260" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#rough2)">n=5</text>
  <text x="452" y="260" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#rough2)">n=6</text>
  <text x="524" y="260" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#rough2)">n=7</text>
  <text x="596" y="260" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#rough2)">n=8</text>
  <text x="164" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">c ≥ 1</text>
  <text x="236" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">c ≥ 2</text>
  <text x="308" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">c ≥ 2</text>
  <text x="380" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">c ≥ 3</text>
  <text x="452" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">c ≥ 3</text>
  <text x="524" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">c ≥ 4</text>
  <text x="596" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">c ≥ 4</text>

  <text x="380" y="310" text-anchor="middle" font-size="11.5" fill="#6b6b6b" filter="url(#rough2)">n 为偶数且恰好一半是 1（2c = n）时仍是 Bessie 胜，等号方向别写反。</text>
  <text x="380" y="330" text-anchor="middle" font-size="11.5" fill="#6b6b6b" filter="url(#rough2)">n 为奇数时需要 (n+1)/2 个 1，例如 n=5 必须凑够 3 个。</text>
</svg>
