<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 344" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="344" fill="#fafafa" filter="url(#rough2)"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">补集视角：把「删除的数 + 美丽数」打包成 D</text>
  <text x="280" y="52" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">设全部数字之和为 T，无交并拆分 [l, r] = D ∪ A，其中 D = 删除的数 ∪ {x}，A = 留下的其余数字</text>

  <rect x="88" y="76" width="182" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="179" y="96" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">D = 删除的数 ∪ {x}</text>
  <text x="179" y="114" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">Σ(D) = T，删除数 = |D| − 1</text>

  <rect x="290" y="76" width="182" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="381" y="96" text-anchor="middle" font-size="12" fill="#3a5a30" filter="url(#rough2)">A = 留下的其余数字</text>
  <text x="381" y="114" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">Σ(A) = 0，因为 x 美丽</text>

  <path d="M 270 100 L 288 100" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="70" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">补集</text>

  <rect x="52" y="142" width="456" height="62" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="68" y="162" font-size="10.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">两个方向都成立</text>
  <text x="68" y="180" font-size="10" fill="#555" filter="url(#rough2)">⇒ 任一合法方案都给出非空 D ⊆ [l, r]，Σ(D) = T（A 的和为 0 被减掉）；</text>
  <text x="68" y="197" font-size="10" fill="#555" filter="url(#rough2)">⇐ 任取这样的 D 与任意 x ∈ D，令其余数字为 A，则 Σ(A) = T − Σ(D) = 0，x 必美丽。</text>

  <rect x="52" y="214" width="456" height="50" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="236" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f3f5c" filter="url(#rough2)">答案 = min{ |D| : D ≠ ∅, Σ(D) = T } − 1</text>
  <text x="280" y="254" text-anchor="middle" font-size="9.5" fill="#667" filter="url(#rough2)">所以问题变成：在 l..r 中挑最少的互不相同的数字，使它们的和恰好等于 T</text>

  <path d="M 280 264 L 280 286" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="88" y="288" width="384" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="314" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">k = n 时 D 只能取全集，Σ(D) = T 必然可行 ⇒ 答案不超过 n − 1</text>
</svg>
