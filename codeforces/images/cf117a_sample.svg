<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="117"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="340" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1：m=4，T=6</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">楼层序列 1,2,3,4,3,2,1,…</text>
  <g filter="url(#rough2)"><rect x="62" y="110" width="76" height="54" rx="4" fill="#cfe0f5" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="100" y="134" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="100" y="152" text-anchor="middle" font-size="9.5" fill="#777777" filter="url(#rough2)">t=0</text>
  <g filter="url(#rough2)"><rect x="182" y="110" width="76" height="54" rx="4" fill="#d7ecd0" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="220" y="134" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="220" y="152" text-anchor="middle" font-size="9.5" fill="#777777" filter="url(#rough2)">t=1</text>
  <g filter="url(#rough2)"><rect x="302" y="110" width="76" height="54" rx="4" fill="#f6e3c4" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="340" y="134" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="340" y="152" text-anchor="middle" font-size="9.5" fill="#777777" filter="url(#rough2)">t=2</text>
  <g filter="url(#rough2)"><rect x="422" y="110" width="76" height="54" rx="4" fill="#f6d9d7" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="460" y="134" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="460" y="152" text-anchor="middle" font-size="9.5" fill="#777777" filter="url(#rough2)">t=3</text>
  <g filter="url(#rough2)"><rect x="542" y="110" width="76" height="54" rx="4" fill="#f6e3c4" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="580" y="134" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="580" y="152" text-anchor="middle" font-size="9.5" fill="#777777" filter="url(#rough2)">t=4</text>
  <g filter="url(#rough2)"><rect x="662" y="110" width="76" height="54" rx="4" fill="#d7ecd0" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="700" y="134" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="700" y="152" text-anchor="middle" font-size="9.5" fill="#777777" filter="url(#rough2)">t=5</text>
  <text x="440" y="212" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">(2,4,3)：t=3 后首次在 2 层是 5，到 4 层是 9 → 9</text>
  <text x="440" y="242" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">(1,2,1)：下一次在 1 层是 6，到 2 层是 7 → 7</text>
  <text x="440" y="286" text-anchor="middle" font-size="12.5" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">输出 9 1 0 7 10 7 5</text>
</svg>
