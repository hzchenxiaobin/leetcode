<svg xmlns="http://www.w3.org/2000/svg" width="740" height="400" viewBox="0 0 740 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="233"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="740" height="400" fill="#fafafa"/>
  <text x="370" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">把现存村庄按 DFS 序排成环，环上相邻距离之和 = 2 × 子树总长</text>
  <path d="M 170 46 Q 370 52 570 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <line x1="170" y1="90" x2="80" y2="170" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="131.0" y="130.0" text-anchor="start" font-size="10.5" font-weight="normal" fill="#446688" filter="url(#rough2)">1</text>
  <line x1="170" y1="90" x2="250" y2="170" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="216.0" y="130.0" text-anchor="start" font-size="10.5" font-weight="normal" fill="#446688" filter="url(#rough2)">5</text>
  <line x1="170" y1="90" x2="170" y2="220" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="176.0" y="155.0" text-anchor="start" font-size="10.5" font-weight="normal" fill="#446688" filter="url(#rough2)">7</text>
  <line x1="170" y1="220" x2="300" y2="290" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="241.0" y="255.0" text-anchor="start" font-size="10.5" font-weight="normal" fill="#446688" filter="url(#rough2)">3</text>
  <line x1="170" y1="220" x2="80" y2="300" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="131.0" y="260.0" text-anchor="start" font-size="10.5" font-weight="normal" fill="#446688" filter="url(#rough2)">2</text>
  <circle cx="170" cy="90" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="170" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <circle cx="80" cy="170" r="20" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="80" y="175" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <circle cx="250" cy="170" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="250" y="175" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <circle cx="170" cy="220" r="20" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="170" y="225" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <circle cx="300" cy="290" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="295" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <circle cx="80" cy="300" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="80" y="305" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">6</text>
  <text x="40" y="350" text-anchor="start" font-size="10.5" font-weight="normal" fill="#4a7a3a" filter="url(#rough2)">绿色 = 现存村庄（样例中 +5 之后的 {1,3,5,6}）</text>
  <rect x="400" y="86" width="310" height="140" rx="10" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="414" y="110" text-anchor="start" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">按 tin 排序成环：</text>
  <circle cx="430" cy="150" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="430" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <line x1="452" y1="150" x2="474" y2="150" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <circle cx="496" cy="150" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="496" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">6</text>
  <line x1="518" y1="150" x2="540" y2="150" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <circle cx="562" cy="150" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="562" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <line x1="584" y1="150" x2="606" y2="150" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <circle cx="628" cy="150" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="628" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <path d="M 628 172 Q 529.0 210 430 172" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="560" y="205" text-anchor="middle" font-size="10" font-weight="normal" fill="#b85450" filter="url(#rough2)">首尾也相邻</text>
  <rect x="400" y="240" width="310" height="90" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="414" y="264" text-anchor="start" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">每条子树边恰被跨过 2 次：</text>
  <text x="414" y="286" text-anchor="start" font-size="10.5" font-weight="normal" fill="#7a5a1b" filter="url(#rough2)">子树在 tin 上是连续区间 ⇒ 序列被切成</text>
  <text x="414" y="306" text-anchor="start" font-size="10.5" font-weight="normal" fill="#7a5a1b" filter="url(#rough2)">两段 ⇒ 环上恰有 2 处跨边。</text>
</svg>
