<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="273"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="300" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">样例 1：n = 4 的六个有序三元组</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">最小的被偷数是 28（(x,y,z)=(1,2,2)），最大是 41（(4,1,1)）</text>
  <text x="120" y="100" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">(x,y,z)</text>
  <text x="290" y="100" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">(x+1)(y+2)(z+2)</text>
  <text x="560" y="100" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">被偷数</text>
  <g filter="url(#rough2)"><rect x="60" y="112" width="128" height="70" rx="5" fill="#ffffff" fill-opacity="0.85" stroke="#cccccc" stroke-width="1.0"/></g>
  <text x="124" y="138" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">(1,1,4)</text>
  <text x="124" y="158" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">36</text>
  <text x="124" y="176" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">32</text>
  <g filter="url(#rough2)"><rect x="200" y="112" width="128" height="70" rx="5" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.7"/></g>
  <text x="264" y="138" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">(1,2,2)</text>
  <text x="264" y="158" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">32</text>
  <text x="264" y="176" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">28</text>
  <g filter="url(#rough2)"><rect x="340" y="112" width="128" height="70" rx="5" fill="#ffffff" fill-opacity="0.85" stroke="#cccccc" stroke-width="1.0"/></g>
  <text x="404" y="138" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">(1,4,1)</text>
  <text x="404" y="158" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">36</text>
  <text x="404" y="176" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">32</text>
  <g filter="url(#rough2)"><rect x="480" y="112" width="128" height="70" rx="5" fill="#ffffff" fill-opacity="0.85" stroke="#cccccc" stroke-width="1.0"/></g>
  <text x="544" y="138" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">(2,1,2)</text>
  <text x="544" y="158" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">36</text>
  <text x="544" y="176" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">32</text>
  <g filter="url(#rough2)"><rect x="620" y="112" width="128" height="70" rx="5" fill="#ffffff" fill-opacity="0.85" stroke="#cccccc" stroke-width="1.0"/></g>
  <text x="684" y="138" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">(2,2,1)</text>
  <text x="684" y="158" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">36</text>
  <text x="684" y="176" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">32</text>
  <g filter="url(#rough2)"><rect x="760" y="112" width="128" height="70" rx="5" fill="#f3d9d6" fill-opacity="0.85" stroke="#8a2b28" stroke-width="1.7"/></g>
  <text x="824" y="138" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">(4,1,1)</text>
  <text x="824" y="158" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">45</text>
  <text x="824" y="176" text-anchor="middle" font-size="14" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">41</text>
  <text x="450" y="226" text-anchor="middle" font-size="12" fill="#b06a1e" filter="url(#rough2)">A 只加 1，B、C 各加 2 —— 所以三元组的「有序」很重要</text>
  <text x="450" y="256" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">输出 28 41</text>
</svg>
