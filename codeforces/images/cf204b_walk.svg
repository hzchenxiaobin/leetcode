<svg xmlns="http://www.w3.org/2000/svg" width="720" height="362" viewBox="0 0 720 362"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="362" fill="#fafafa"/>
  <text x="360.0" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">204B：样例二逐张核对</text>
  <path d="M 144.00 46 Q 360.0 52 576.00 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="72" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">样例二（n=5, need=3）：逐张看正面/背面，统计颜色 7。</text>
  <text x="90" y="100" text-anchor="start" font-size="10.5" fill="#33506e" font-weight="bold" filter="url(#rough2)">卡片</text>
  <text x="190" y="100" text-anchor="start" font-size="10.5" fill="#33506e" font-weight="bold" filter="url(#rough2)">正面</text>
  <text x="290" y="100" text-anchor="start" font-size="10.5" fill="#33506e" font-weight="bold" filter="url(#rough2)">背面</text>
  <text x="420" y="100" text-anchor="start" font-size="10.5" fill="#33506e" font-weight="bold" filter="url(#rough2)">对颜色 7 的作用</text>
  <rect x="80" y="112" width="560" height="30" rx="5" fill="#eef8ef" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="100" y="132" text-anchor="start" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="190" y="132" text-anchor="start" font-size="10.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="290" y="132" text-anchor="start" font-size="10.5" fill="#333" filter="url(#rough2)">7</text>
  <text x="420" y="132" text-anchor="start" font-size="10.5" fill="#2f5b34" filter="url(#rough2)">背面是 7 → 可翻</text>
  <rect x="80" y="146" width="560" height="30" rx="5" fill="#eef8ef" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="100" y="166" text-anchor="start" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="190" y="166" text-anchor="start" font-size="10.5" fill="#333" filter="url(#rough2)">7</text>
  <text x="290" y="166" text-anchor="start" font-size="10.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="420" y="166" text-anchor="start" font-size="10.5" fill="#2f5b34" filter="url(#rough2)">正面已是 7</text>
  <rect x="80" y="180" width="560" height="30" rx="5" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="100" y="200" text-anchor="start" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="190" y="200" text-anchor="start" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="290" y="200" text-anchor="start" font-size="10.5" fill="#333" filter="url(#rough2)">11</text>
  <text x="420" y="200" text-anchor="start" font-size="10.5" fill="#8a8a8a" filter="url(#rough2)">无关</text>
  <rect x="80" y="214" width="560" height="30" rx="5" fill="#eef8ef" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="100" y="234" text-anchor="start" font-size="10.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="190" y="234" text-anchor="start" font-size="10.5" fill="#333" filter="url(#rough2)">9</text>
  <text x="290" y="234" text-anchor="start" font-size="10.5" fill="#333" filter="url(#rough2)">7</text>
  <text x="420" y="234" text-anchor="start" font-size="10.5" fill="#2f5b34" filter="url(#rough2)">背面是 7 → 可翻</text>
  <rect x="80" y="248" width="560" height="30" rx="5" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="100" y="268" text-anchor="start" font-size="10.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="190" y="268" text-anchor="start" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="290" y="268" text-anchor="start" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="420" y="268" text-anchor="start" font-size="10.5" fill="#8a8a8a" filter="url(#rough2)">无关</text>
  <rect x="60" y="290" width="620" height="56" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="307" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">f(7)=1，g(7)=2 ⇒ 需要 3−1=2 次翻转，2 ≤ 2 可行 ⇒ 答案 2。</text>
  <text x="74" y="328" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">颜色 4：f=1、g=1 ⇒ 需要 2 &gt; 1，不可行。</text>
</svg>
