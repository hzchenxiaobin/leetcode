<svg xmlns="http://www.w3.org/2000/svg" width="880" height="250" viewBox="0 0 880 250"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="250" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">正三角形三边各被 n 个洞等分，每边两端各 m 个洞不可用</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">取三边上各一个可用洞，问有多少个钝角三角形</text>
  <text x="150" y="105" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">设 P（AB 上）、Q（BC 上）、R（CA 上）在边上的编号为 U、T、S（1..n，去掉两端 m 个）</text>
  <text x="150" y="145" text-anchor="start" font-size="12" fill="#2f4a66" filter="url(#rough2)">P 处为钝角 ⇔ (Q-P)·(R-P) &lt; 0，代入 L=n+1 后整理为：</text>
  <text x="150" y="185" text-anchor="start" font-size="13" fill="#3d6b2f" filter="url(#rough2)">S·(L-U+T) &lt; U·(2L-T-2U)</text>
  <text x="150" y="222" text-anchor="start" font-size="11.5" fill="#b05a5a" filter="url(#rough2)">三角形至多一个钝角 ⇒ 答案 = 3 × 满足上式的 (U,T,S) 个数</text>
</svg>
