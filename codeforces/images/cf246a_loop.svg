<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="720" height="300" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">Valera 的冒泡：内层 j 从 i 开始（而不是从 1）</text>
  <rect x="60" y="60" width="600" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="360" y="79" text-anchor="middle" font-size="12" fill="#2f4a66">for i = 1 .. n-1:</text>
  <text x="360" y="94" text-anchor="middle" font-size="12" fill="#2f4a66">    for j = i .. n-1:</text>
  <text x="360" y="109" text-anchor="middle" font-size="12" fill="#2f4a66">        if a[j] &gt; a[j+1]: swap</text>
  <rect x="60" y="150" width="290" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="205" y="177" text-anchor="middle" font-size="12" fill="#2f5223">i = 1：j 从 1 开始</text>
  <text x="205" y="192" text-anchor="middle" font-size="12" fill="#2f5223">= 正常的完整一趟</text>
  <rect x="370" y="150" width="290" height="60" rx="8" fill="#fde9d9" stroke="#b4652a" stroke-width="1.5"/>
  <text x="515" y="177" text-anchor="middle" font-size="12" fill="#7a4b22">i ≥ 2：j 从 i 开始</text>
  <text x="515" y="192" text-anchor="middle" font-size="12" fill="#7a4b22">位置 1、2 再也不会被比较</text>
  <text x="60" y="250" text-anchor="start" font-size="12" fill="#7a4b22" filter="url(#rough2)">所以只要「小元素卡在位置 2 附近」，后面就再也换不回去</text>
  <text x="60" y="276" text-anchor="start" font-size="12" fill="#2f5223" filter="url(#rough2)">n ≥ 3 时把数组写成降序 (n, n-1, …, 1) 就是一个反例</text>
</svg>
