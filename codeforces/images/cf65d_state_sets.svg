<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="81"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="440" fill="#fafafa"/>

  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例一的状态集合：'?' 分叉、字母确定、相同状态合并</text>
  <path d="M 92 44 Q 360 51 628 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 第一行 -->
  <rect x="26" y="66" width="132" height="52" rx="8" fill="#eaf3ff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="92" y="88" text-anchor="middle" font-size="11.5" fill="#2f4a63" filter="url(#rough2)">'G' 之后</text>
  <text x="92" y="106" text-anchor="middle" font-size="11.5" fill="#2f4a63" filter="url(#rough2)">(1,0,0,0)｜1 个</text>

  <rect x="188" y="66" width="150" height="52" rx="8" fill="#fff7e2" stroke="#c99a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="263" y="88" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">第 1 个 '?'</text>
  <text x="263" y="106" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">改 H/R/S｜3 个</text>

  <rect x="368" y="66" width="150" height="52" rx="8" fill="#fff7e2" stroke="#c99a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="443" y="88" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">第 2 个 '?'</text>
  <text x="443" y="106" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">仍是 3 个</text>

  <rect x="548" y="66" width="146" height="52" rx="8" fill="#eef6ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="621" y="88" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">第 3 个 '?'</text>
  <text x="621" y="106" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">合并成 1 个 (1,1,1,1)</text>

  <line x1="160" y1="92" x2="184" y2="92" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <line x1="340" y1="92" x2="364" y2="92" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <line x1="520" y1="92" x2="544" y2="92" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 第二行 -->
  <rect x="26" y="150" width="132" height="52" rx="8" fill="#fff7e2" stroke="#c99a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="92" y="172" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">第 4 个 '?'</text>
  <text x="92" y="190" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">谁都可以加｜4 个</text>

  <rect x="188" y="150" width="150" height="52" rx="8" fill="#f3eefb" stroke="#6b5b95" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="263" y="172" text-anchor="middle" font-size="11.5" fill="#4a3d6b" filter="url(#rough2)">'S' 'S' 两次</text>
  <text x="263" y="190" text-anchor="middle" font-size="11.5" fill="#4a3d6b" filter="url(#rough2)">Slytherin 直接 +2</text>

  <rect x="368" y="150" width="150" height="52" rx="8" fill="#fff7e2" stroke="#c99a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="443" y="172" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">第 5 个 '?'</text>
  <text x="443" y="190" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">6 个（分叉最多）</text>

  <rect x="548" y="150" width="146" height="52" rx="8" fill="#eef6ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="621" y="172" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">后面两个 '?'</text>
  <text x="621" y="190" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">收敛回 4 个</text>

  <line x1="160" y1="176" x2="184" y2="176" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <line x1="340" y1="176" x2="364" y2="176" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <line x1="520" y1="176" x2="544" y2="176" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 关键提示 -->
  <rect x="26" y="228" width="668" height="86" rx="10" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="360" y="252" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两条规则让状态数一直很小</text>
  <text x="360" y="276" text-anchor="middle" font-size="12" fill="#2f4a63" filter="url(#rough2)">① 字母步对所有状态是同一个坐标 +1，不产生分叉；</text>
  <text x="360" y="298" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">② '?' 步只在"当前最少"的学院里分叉，分叉之后计数又迅速被拉平。</text>

  <!-- 底部结论 -->
  <rect x="130" y="334" width="460" height="56" rx="10" fill="#eef6ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="358" text-anchor="middle" font-size="12.5" fill="#2f5223" filter="url(#rough2)">本样例每个前缀的状态数：1, 3, 3, 1, 4, 4, 4, 6, 4, 4, 4</text>
  <text x="360" y="380" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">用哈希集合去重，转移代价只与这个很小的数成正比</text>

  <text x="360" y="424" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">把每个前缀的可达计数向量当成一个"状态"，整题退化成一个集合上的确定性转移</text>
</svg>
