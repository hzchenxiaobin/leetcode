<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="53"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1 走查：每步都在上一步的结果上继续加</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="50.0" y="92.0" text-anchor="start" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">步骤</text>
  <text x="150.0" y="92.0" text-anchor="start" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">起点</text>
  <text x="240.0" y="92.0" text-anchor="start" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">受影响的 a</text>
  <text x="380.0" y="92.0" text-anchor="start" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">加上的 b</text>
  <text x="520.0" y="92.0" text-anchor="start" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">取模后 a</text>
  <rect x="40.0" y="108.0" width="640.0" height="44.0" fill="#ffffff" stroke="#dddddd" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="50.0" y="136.0" text-anchor="start" font-size="12.5" fill="#666" filter="url(#rough2)">初始</text>
  <text x="150.0" y="136.0" text-anchor="start" font-size="12.5" fill="#666" filter="url(#rough2)">—</text>
  <text x="240.0" y="136.0" text-anchor="start" font-size="12.5" fill="#666" filter="url(#rough2)">—</text>
  <text x="380.0" y="136.0" text-anchor="start" font-size="12.5" fill="#666" filter="url(#rough2)">—</text>
  <text x="520.0" y="136.0" text-anchor="start" font-size="12.5" fill="#666" filter="url(#rough2)">1 1 1 1</text>
  <rect x="40.0" y="164.0" width="640.0" height="44.0" fill="#ffffff" stroke="#dddddd" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="50.0" y="192.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="150.0" y="192.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="240.0" y="192.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">a₀…a₂</text>
  <text x="380.0" y="192.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">1 1 1</text>
  <text x="520.0" y="192.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">0 0 0 1</text>
  <rect x="40.0" y="220.0" width="640.0" height="44.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="50.0" y="248.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="150.0" y="248.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="240.0" y="248.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">a₁…a₃</text>
  <text x="380.0" y="248.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">1 1 1</text>
  <text x="520.0" y="248.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">0 1 1 0</text>
  <rect x="40.0" y="306.0" width="640.0" height="70.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="54.0" y="330.5" text-anchor="start" font-size="12.5" fill="#3f3420" filter="url(#rough2)">第 2 步读到的是第 1 步已经改过的 a（题面特别强调这一点）</text>
  <text x="54.0" y="356.5" text-anchor="start" font-size="12.5" fill="#3f3420" filter="url(#rough2)">所有加法都对 c 取模；样例里 c = 2</text>
</svg>
