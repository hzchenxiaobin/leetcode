<svg xmlns="http://www.w3.org/2000/svg" width="840" height="430" viewBox="0 0 840 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="430" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">最小值的交换论证：把小飞机先坐空，收入不增</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">例：飞机 a=3 与 a=5，要卖 k=4 张票；两种卖法对比</text>
  <text x="90" y="100" text-anchor="start" font-size="12.5" font-weight="bold" fill="#a0522d" filter="url(#rough2)">方案 A：全在大飞机上卖 4 张</text>
  <g filter="url(#rough2)"><rect x="90" y="110" width="48" height="34" rx="4" fill="#f6d9d7" fill-opacity="0.9" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="114" y="132" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <g filter="url(#rough2)"><rect x="144" y="110" width="48" height="34" rx="4" fill="#f6d9d7" fill-opacity="0.9" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="168" y="132" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><rect x="198" y="110" width="48" height="34" rx="4" fill="#f6d9d7" fill-opacity="0.9" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="222" y="132" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="252" y="110" width="48" height="34" rx="4" fill="#f6d9d7" fill-opacity="0.9" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="276" y="132" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="330" y="133" text-anchor="start" font-size="14" font-weight="bold" fill="#a0522d" filter="url(#rough2)">5+4+3+2 = 14</text>
  <text x="90" y="230" text-anchor="start" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">方案 B：先坐空小飞机（3 张），再在大飞机卖 1 张</text>
  <g filter="url(#rough2)"><rect x="90" y="240" width="48" height="34" rx="4" fill="#d7ecd0" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="114" y="262" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="144" y="240" width="48" height="34" rx="4" fill="#d7ecd0" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="168" y="262" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="198" y="240" width="48" height="34" rx="4" fill="#d7ecd0" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="222" y="262" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="290" y="230" text-anchor="start" font-size="12.5" font-weight="bold" fill="#a0522d" filter="url(#rough2)"></text>
  <g filter="url(#rough2)"><rect x="290" y="240" width="48" height="34" rx="4" fill="#f6d9d7" fill-opacity="0.9" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="314" y="262" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <text x="360" y="263" text-anchor="start" font-size="14" font-weight="bold" fill="#3d6b2f" filter="url(#rough2)">3+2+1+5 = 11</text>
  <text x="420" y="330" text-anchor="middle" font-size="13.5" fill="#2b2b2b" filter="url(#rough2)">变化量 = a_u · (k − a_v) = 3 · (4 − 5) = −3 &lt; 0</text>
  <text x="420" y="356" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">故"先坐空小飞机"的收入 11 严格小于"全用大飞机"的收入 14</text>
  <text x="420" y="388" text-anchor="middle" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">反复做这个变换 ⇒ 按空座升序坐空就是最小收入</text>
  <text x="420" y="412" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">（最大化则相反：每次挑当前空座最多的那架，等价于取前 n 大边际价格）</text>
</svg>
