<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="157"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="300" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">F 的闭式：出现 k 次 ⇒ k(k+1)/2</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">列表的非空连续段由一对下标 (i ≤ j) 唯一确定</text>
  <text x="90" y="104" text-anchor="start" font-size="11.5" fill="#446688" filter="url(#rough2)">出现位置列表（升序）</text>
  <g filter="url(#rough2)"><rect x="300" y="86" width="96" height="34" rx="4" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="348" y="110" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">(1,4)</text>
  <text x="400" y="110" text-anchor="middle" font-size="13" fill="#666666" filter="url(#rough2)">…</text>
  <g filter="url(#rough2)"><rect x="420" y="86" width="96" height="34" rx="4" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="468" y="110" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">(5,8)</text>
  <text x="520" y="110" text-anchor="middle" font-size="13" fill="#666666" filter="url(#rough2)">…</text>
  <g filter="url(#rough2)"><rect x="540" y="86" width="96" height="34" rx="4" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="588" y="110" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">(9,12)</text>
  <text x="90" y="160" text-anchor="start" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">k = 3 时的 6 个连续段：</text>
  <g filter="url(#rough2)"><rect x="90" y="178" width="100" height="34" rx="4" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="140" y="201" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">①(1,4)</text>
  <g filter="url(#rough2)"><rect x="208" y="178" width="100" height="34" rx="4" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="258" y="201" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">②(4,7)</text>
  <g filter="url(#rough2)"><rect x="326" y="178" width="100" height="34" rx="4" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="376" y="201" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">③(9,12)</text>
  <g filter="url(#rough2)"><rect x="444" y="178" width="100" height="34" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="494" y="201" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">①②</text>
  <g filter="url(#rough2)"><rect x="562" y="178" width="100" height="34" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="612" y="201" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">②③</text>
  <g filter="url(#rough2)"><rect x="680" y="178" width="100" height="34" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="730" y="201" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">①②③</text>
  <text x="450" y="250" text-anchor="middle" font-size="13" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">3 + 2 + 1 = 6 = 3·4/2</text>
  <text x="450" y="280" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">所以问题变成：对每个不同子串统计出现次数 k，累加 k(k+1)/2</text>
</svg>
