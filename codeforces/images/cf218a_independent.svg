<svg xmlns="http://www.w3.org/2000/svg" width="820" height="450" viewBox="0 0 820 450"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="820" height="450" fill="#fafafa"/>
  <text x="410" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">独立判定：山峰只需和左右两个"不变"的山谷比较</text>
  <text x="410" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">山谷 r1 r3 r5 在循环中从不被改写 → 每个峰的"可降"与否互不影响</text>
  <g filter="url(#rough2)"><path d=" M 126.0,284.0 L 172.0,100.0 L 218.0,238.0 L 264.0,100.0 L 310.0,284.0" fill="none" stroke="#446688" stroke-width="2.4" stroke-linejoin="round"/></g>
  <g filter="url(#rough2)"><circle cx="126" cy="284" r="8" fill="#d6e6f2" fill-opacity="0.9" stroke="#446688" stroke-width="1.8"/></g>
  <text x="126" y="268" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="126" y="356" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">山谷 1</text>
  <g filter="url(#rough2)"><circle cx="172" cy="100" r="8" fill="#f6d9d7" fill-opacity="0.9" stroke="#a0522d" stroke-width="1.8"/></g>
  <text x="172" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <text x="172" y="356" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">山峰 1</text>
  <g filter="url(#rough2)"><circle cx="218" cy="238" r="8" fill="#d6e6f2" fill-opacity="0.9" stroke="#446688" stroke-width="1.8"/></g>
  <text x="218" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="218" y="356" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">山谷 2</text>
  <g filter="url(#rough2)"><circle cx="264" cy="100" r="8" fill="#f6d9d7" fill-opacity="0.9" stroke="#a0522d" stroke-width="1.8"/></g>
  <text x="264" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <text x="264" y="356" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">山峰 2</text>
  <g filter="url(#rough2)"><circle cx="310" cy="284" r="8" fill="#d6e6f2" fill-opacity="0.9" stroke="#446688" stroke-width="1.8"/></g>
  <text x="310" y="268" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="310" y="356" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">山谷 3</text>
  <g filter="url(#rough2)"><line x1="172" y1="114" x2="126" y2="274" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="4 4"/></g>
  <g filter="url(#rough2)"><line x1="172" y1="114" x2="218" y2="228" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="4 4"/></g>
  <text x="430" y="130" text-anchor="start" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">山峰 1：5−1 = 4 &gt; 左谷 1、右谷 2 → 可降</text>
  <text x="430" y="162" text-anchor="start" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">山峰 2：5−1 = 4 &gt; 左谷 2、右谷 1 → 可降</text>
  <text x="430" y="200" text-anchor="start" font-size="12.5" fill="#8a4b2a" filter="url(#rough2)">两个判定都只看奇数下标的 r，</text>
  <text x="430" y="224" text-anchor="start" font-size="12.5" fill="#8a4b2a" filter="url(#rough2)">彼此独立，可以分别决定。</text>
  <g filter="url(#rough2)"><rect x="70" y="372" width="680" height="62" rx="4" fill="#faf3ec" fill-opacity="0.85" stroke="#c8a48a" stroke-width="1.3"/></g>
  <text x="410" y="396" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">所以：从前往后扫，遇到可降的峰就降，凑够 k 个即停，一定成功</text>
  <text x="410" y="420" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">（题面保证输入来自某合法初始图 ⇒ 可降的山峰至少有 k 个）</text>
</svg>
