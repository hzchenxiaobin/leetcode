<svg xmlns="http://www.w3.org/2000/svg" width="860" height="480" viewBox="0 0 860 480"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="51"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="a12e" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="860" height="480" fill="#fafafa"/>
  <text x="430" y="34" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">n = 4 的合法矩阵：对称、对角全 0、每行每列是 0..3 的排列</text>
  <path d="M 110 46 Q 430 52 750 46" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="150" y="80" width="70" height="66" fill="#eef1f7" stroke="#446688" stroke-width="1.5"/>
    <rect x="220" y="80" width="70" height="66" fill="#ffffff" stroke="#9ab" stroke-width="1.2"/>
    <rect x="290" y="80" width="70" height="66" fill="#ffffff" stroke="#9ab" stroke-width="1.2"/>
    <rect x="360" y="80" width="70" height="66" fill="#ffffff" stroke="#9ab" stroke-width="1.2"/>
    <rect x="150" y="146" width="70" height="66" fill="#ffffff" stroke="#9ab" stroke-width="1.2"/>
    <rect x="220" y="146" width="70" height="66" fill="#eef1f7" stroke="#446688" stroke-width="1.5"/>
    <rect x="290" y="146" width="70" height="66" fill="#ffffff" stroke="#9ab" stroke-width="1.2"/>
    <rect x="360" y="146" width="70" height="66" fill="#ffffff" stroke="#9ab" stroke-width="1.2"/>
    <rect x="150" y="212" width="70" height="66" fill="#ffffff" stroke="#9ab" stroke-width="1.2"/>
    <rect x="220" y="212" width="70" height="66" fill="#ffffff" stroke="#9ab" stroke-width="1.2"/>
    <rect x="290" y="212" width="70" height="66" fill="#eef1f7" stroke="#446688" stroke-width="1.5"/>
    <rect x="360" y="212" width="70" height="66" fill="#ffffff" stroke="#9ab" stroke-width="1.2"/>
    <rect x="150" y="278" width="70" height="66" fill="#ffffff" stroke="#9ab" stroke-width="1.2"/>
    <rect x="220" y="278" width="70" height="66" fill="#ffffff" stroke="#9ab" stroke-width="1.2"/>
    <rect x="290" y="278" width="70" height="66" fill="#ffffff" stroke="#9ab" stroke-width="1.2"/>
    <rect x="360" y="278" width="70" height="66" fill="#eef1f7" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g font-size="22" text-anchor="middle" filter="url(#rough2)">
    <text x="185" y="122" fill="#23405c">0</text><text x="255" y="122" fill="#23405c">3</text><text x="325" y="122" fill="#23405c">2</text><text x="395" y="122" fill="#23405c">1</text>
    <text x="185" y="188" fill="#23405c">3</text><text x="255" y="188" fill="#23405c">0</text><text x="325" y="188" fill="#23405c">1</text><text x="395" y="188" fill="#23405c">2</text>
    <text x="185" y="254" fill="#23405c">2</text><text x="255" y="254" fill="#23405c">1</text><text x="325" y="254" fill="#23405c">0</text><text x="395" y="254" fill="#23405c">3</text>
    <text x="185" y="320" fill="#23405c">1</text><text x="255" y="320" fill="#23405c">2</text><text x="325" y="320" fill="#23405c">3</text><text x="395" y="320" fill="#23405c">0</text>
  </g>
  <path d="M 160 92 L 420 356" stroke="#b85450" stroke-width="1.4" stroke-dasharray="6 4" fill="none" filter="url(#rough2)"/>
  <text x="470" y="120" font-size="12.5" fill="#8c3b37" filter="url(#rough2)">灰色格 = 主对角线，全部填 0</text>
  <text x="470" y="150" font-size="12.5" fill="#23405c" filter="url(#rough2)">a[i][j] = a[j][i]（关于对角线镜像对称）</text>
  <text x="470" y="180" font-size="12.5" fill="#23405c" filter="url(#rough2)">每一行、每一列都正好含 0..n-1 各一次</text>
  <text x="470" y="216" font-size="11.5" fill="#666" filter="url(#rough2)">三条要求一起意味着：去掉对角线后，</text>
  <text x="470" y="238" font-size="11.5" fill="#666" filter="url(#rough2)">剩下的 n(n-1) 个格子被 n-1 种颜色染色，</text>
  <text x="470" y="260" font-size="11.5" fill="#666" filter="url(#rough2)">每种颜色恰好是一个完美匹配。</text>
  <text x="430" y="396" text-anchor="middle" font-size="11.5" fill="#8a8a8a" filter="url(#rough2)">构造思路：把 K_n（n 为偶数）的 n-1 个完美匹配编号 1..n-1，</text>
  <text x="430" y="418" text-anchor="middle" font-size="11.5" fill="#8a8a8a" filter="url(#rough2)">i≠j 时令 a[i][j] = 边 {i,j} 的颜色，对角线上填 0。</text>
</svg>
