<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="101"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="420" fill="#fafafa"/>

  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">把"能挪的楼梯"当成一种资源：池子 A 与欠债 D</text>
  <path d="M 92 44 Q 360 51 628 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 池子 -->
  <rect x="34" y="76" width="210" height="112" rx="10" fill="#eaf3ff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="139" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a63" filter="url(#rough2)">可用楼梯池 A</text>
  <text x="139" y="126" text-anchor="middle" font-size="11.5" fill="#2f4a63" filter="url(#rough2)">当前可达区域里</text>
  <text x="139" y="146" text-anchor="middle" font-size="11.5" fill="#2f4a63" filter="url(#rough2)">还没被挪过的楼梯</text>
  <text x="139" y="170" text-anchor="middle" font-size="11.5" fill="#8a3b37" filter="url(#rough2)">初始值 = 1 号所在块的边数</text>

  <!-- 欠债 -->
  <rect x="476" y="76" width="210" height="112" rx="10" fill="#fdeeee" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="581" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a3b37" filter="url(#rough2)">欠债 D</text>
  <text x="581" y="126" text-anchor="middle" font-size="11.5" fill="#8a3b37" filter="url(#rough2)">摘叶子时被孤立、</text>
  <text x="581" y="146" text-anchor="middle" font-size="11.5" fill="#8a3b37" filter="url(#rough2)">之后要用一条可用边接回来的楼层</text>
  <text x="581" y="170" text-anchor="middle" font-size="11.5" fill="#8a3b37" filter="url(#rough2)">每还一笔花掉 1 条可用边</text>

  <!-- 三种操作 -->
  <rect x="34" y="212" width="652" height="44" rx="8" fill="#eef6ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="48" y="240" font-size="12" fill="#2f5223" filter="url(#rough2)">① 有环块：用自己的非桥边接入 → 不花 A，A += e − 1，D 不变</text>
  <rect x="34" y="266" width="652" height="44" rx="8" fill="#fff7e2" stroke="#c99a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="48" y="294" font-size="12" fill="#8a6015" filter="url(#rough2)">② 有可用边时：花 1 条 A 把整块接进来 → A += e − 1，D 不变</text>
  <rect x="34" y="320" width="652" height="44" rx="8" fill="#f3eefb" stroke="#6b5b95" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="48" y="348" font-size="12" fill="#4a3d6b" filter="url(#rough2)">③ 没可用边时：摘掉它的一片叶子接到当前位置 → A += e − 1，但 D += 1</text>

  <text x="360" y="396" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">最后只要 A ≥ D（且过程中没卡死）就行：把所有欠债一次还清</text>
</svg>
