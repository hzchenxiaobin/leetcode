<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 336" width="640" height="336">
<defs>
<filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="13" result="noise"/>
<feDisplacementMap in="SourceGraphic" in2="noise" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect x="0" y="0" width="640" height="336" fill="#fafafa"/>
<g font-family="Comic Sans MS, Kaiti SC, cursive">
<text x="320.0" y="24.0" font-size="15" fill="#33475b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">函数图 = 若干条有向链 + 若干个有向环</text>
<circle cx="80.0" cy="90.0" r="20.0" fill="#f6d9b0" stroke="#a08050" stroke-width="1.8" filter="url(#rough2)"/>
<text x="80.0" y="96.0" font-size="14" fill="#7a5c2e" text-anchor="middle" font-weight="normal" filter="url(#rough2)">1</text>
<circle cx="190.0" cy="90.0" r="20.0" fill="#f6d9b0" stroke="#a08050" stroke-width="1.8" filter="url(#rough2)"/>
<text x="190.0" y="96.0" font-size="14" fill="#7a5c2e" text-anchor="middle" font-weight="normal" filter="url(#rough2)">2</text>
<circle cx="300.0" cy="90.0" r="20.0" fill="#f6d9b0" stroke="#a08050" stroke-width="1.8" filter="url(#rough2)"/>
<text x="300.0" y="96.0" font-size="14" fill="#7a5c2e" text-anchor="middle" font-weight="normal" filter="url(#rough2)">3</text>
<line x1="102.0" y1="90.0" x2="168.0" y2="90.0" stroke="#7a93a8" stroke-width="2.2" filter="url(#rough2)"/>
<polygon points="168.0,90.0 159.0,85.5 159.0,94.5" fill="#7a93a8" filter="url(#rough2)"/>
<text x="135.0" y="78.0" font-size="12" fill="#3a5a72" text-anchor="middle" font-weight="normal" filter="url(#rough2)">10</text>
<line x1="212.0" y1="90.0" x2="278.0" y2="90.0" stroke="#7a93a8" stroke-width="2.2" filter="url(#rough2)"/>
<polygon points="278.0,90.0 269.0,85.5 269.0,94.5" fill="#7a93a8" filter="url(#rough2)"/>
<text x="245.0" y="78.0" font-size="12" fill="#3a5a72" text-anchor="middle" font-weight="normal" filter="url(#rough2)">20</text>
<text x="80.0" y="140.0" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">水塔</text>
<text x="190.0" y="140.0" font-size="11" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">中间(出入都有)</text>
<text x="300.0" y="140.0" font-size="12" fill="#1f6f43" text-anchor="middle" font-weight="normal" filter="url(#rough2)">龙头</text>
<line x1="470.4" y1="76.0" x2="506.0" y2="120.4" stroke="#7a93a8" stroke-width="2.0" filter="url(#rough2)"/>
<polygon points="506.0,120.4 503.9,110.6 496.9,116.2" fill="#7a93a8" filter="url(#rough2)"/>
<line x1="499.2" y1="127.4" x2="443.0" y2="136.0" stroke="#7a93a8" stroke-width="2.0" filter="url(#rough2)"/>
<polygon points="443.0,136.0 452.5,139.1 451.2,130.2" fill="#7a93a8" filter="url(#rough2)"/>
<line x1="440.3" y1="126.6" x2="461.0" y2="73.6" stroke="#7a93a8" stroke-width="2.0" filter="url(#rough2)"/>
<polygon points="461.0,73.6 453.5,80.3 461.9,83.6" fill="#7a93a8" filter="url(#rough2)"/>
<circle cx="470.0" cy="58.0" r="18.0" fill="#d8d3ec" stroke="#6a5f9a" stroke-width="1.6" filter="url(#rough2)"/>
<text x="470.0" y="63.0" font-size="11" fill="#4a3f7a" text-anchor="middle" font-weight="normal" filter="url(#rough2)">环</text>
<circle cx="515.0" cy="136.0" r="18.0" fill="#d8d3ec" stroke="#6a5f9a" stroke-width="1.6" filter="url(#rough2)"/>
<text x="515.0" y="141.0" font-size="11" fill="#4a3f7a" text-anchor="middle" font-weight="normal" filter="url(#rough2)">环</text>
<circle cx="425.0" cy="136.0" r="18.0" fill="#d8d3ec" stroke="#6a5f9a" stroke-width="1.6" filter="url(#rough2)"/>
<text x="425.0" y="141.0" font-size="11" fill="#4a3f7a" text-anchor="middle" font-weight="normal" filter="url(#rough2)">环</text>
<text x="470.0" y="206.0" font-size="12" fill="#4a3f7a" text-anchor="middle" font-weight="normal" filter="url(#rough2)">环：既没水塔也没龙头</text>
<rect x="60.0" y="200.0" width="520.0" height="90.0" rx="10" fill="#ffffff" stroke="#9ab" stroke-width="1.6" filter="url(#rough2)"/>
<text x="90.0" y="228.0" font-size="13" fill="#c0392b" text-anchor="start" font-weight="normal" filter="url(#rough2)">水塔 = 出度 1、入度 0（链头）</text>
<text x="90.0" y="252.0" font-size="13" fill="#1f6f43" text-anchor="start" font-weight="normal" filter="url(#rough2)">龙头 = 入度 1、出度 0（链尾）</text>
<text x="90.0" y="276.0" font-size="13" fill="#33475b" text-anchor="start" font-weight="normal" filter="url(#rough2)">瓶颈 = 链上所有直径的最小值（样例 1：min(10,20)=10）</text>
<text x="320.0" y="320.0" font-size="13" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">每个点入度、出度都 ≤ 1 ⇒ 不会分叉，链唯一</text>
</g>
</svg>
