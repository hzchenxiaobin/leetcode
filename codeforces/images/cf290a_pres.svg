<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="451"/>
    <feDisplacementMap in="SourceGraphic" scale="1.5"/></filter></defs>
  <rect width="700" height="300" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">"Mysterious strings" 的梗：输出第 a 任美国总统的姓</text>
  <path d="M 90 40 Q 350 46 610 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="70" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="12.5" fill="#22314a" filter="url(#rough2)">题面没有任何描述（只剩输入输出格式），只能靠三组样例反推：</text>
  <text x="76" y="106" font-size="12.5" fill="#22314a" filter="url(#rough2)">2 → Adams、8 → Van Buren、29 → Harding —— 这正好是"第几任总统"。</text>
  <g filter="url(#rough2)"><rect x="60" y="142" width="580" height="86" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="166" font-size="12.5" fill="#2f5223" filter="url(#rough2)">1 Washington、2 Adams、3 Jefferson、4 Madison、5 Monroe、6 Adams、7 Jackson、8 Van Buren、</text>
  <text x="76" y="190" font-size="12.5" fill="#2f5222" filter="url(#rough2)">9 Harrison、10 Tyler、…、29 Harding、30 Coolidge、…、40 Reagan（共 40 个，与 a ≤ 40 吻合）。</text>
  <text x="76" y="214" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">注意第 2 与第 6 都是 Adams（父子总统），第 22/24 都是 Cleveland，第 26/32 都是 Roosevelt。</text>
  <g filter="url(#rough2)"><rect x="60" y="240" width="580" height="48" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="76" y="264" font-size="12.5" fill="#8a6015" filter="url(#rough2)">这就是"答案与输入无关的常量表"：只需 40 个字符串，O(1) 查表。</text>
  <text x="76" y="282" font-size="11.5" fill="#8a6015" filter="url(#rough2)">证据：3/3 样例全中，且 a 的上界 40 正好等于当时"前 40 任"的划分。</text>
</svg>
