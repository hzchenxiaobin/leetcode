<svg xmlns="http://www.w3.org/2000/svg" width="880" height="260" viewBox="0 0 880 260"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="260" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">只看出现次数最多的元素</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">重排不改变各元素个数</text>
  <text x="150" y="100" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">能重排成"相邻互不相同" ⇔ 最多的那个数出现次数 &lt;= ceil(n/2)</text>
  <text x="150" y="142" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">即 2*maxcnt &lt;= n+1：多出来的那一个可以放在两端</text>
  <text x="150" y="184" text-anchor="start" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">否则必然有两个相同元素被迫相邻</text>
</svg>
