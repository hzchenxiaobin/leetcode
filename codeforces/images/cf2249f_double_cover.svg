<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="880" height="400" fill="#fafafa"/>
  <text x="28" y="34" font-size="17" fill="#22333b" filter="url(#rough2)">双层图：把每个点拆成 (v,0) 与 (v,1) 两个状态</text>
  <text x="28" y="58" font-size="13" fill="#666" filter="url(#rough2)">每条边只连 0 层与 1 层；BFS 层数就是路径长度，奇偶自动对上</text>
  <text x="40" y="124" font-size="13" fill="#446688" text-anchor="start" font-weight="normal" filter="url(#rough2)">p = 0</text>
  <text x="40" y="274" font-size="13" fill="#d6a040" text-anchor="start" font-weight="normal" filter="url(#rough2)">p = 1</text>
  <line x1="110" y1="142" x2="110" y2="252" stroke="#c9c9c9" stroke-width="1.1" stroke-dasharray="4 4" opacity="1.0" filter="url(#rough2)"/>
  <line x1="230" y1="142" x2="230" y2="252" stroke="#c9c9c9" stroke-width="1.1" stroke-dasharray="4 4" opacity="1.0" filter="url(#rough2)"/>
  <line x1="350" y1="142" x2="350" y2="252" stroke="#c9c9c9" stroke-width="1.1" stroke-dasharray="4 4" opacity="1.0" filter="url(#rough2)"/>
  <line x1="470" y1="142" x2="470" y2="252" stroke="#c9c9c9" stroke-width="1.1" stroke-dasharray="4 4" opacity="1.0" filter="url(#rough2)"/>
  <line x1="590" y1="142" x2="590" y2="252" stroke="#c9c9c9" stroke-width="1.1" stroke-dasharray="4 4" opacity="1.0" filter="url(#rough2)"/>
  <line x1="126" y1="120" x2="214" y2="270" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" opacity="0.85" filter="url(#rough2)"/>
  <line x1="246" y1="120" x2="94" y2="270" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" opacity="0.85" filter="url(#rough2)"/>
  <line x1="246" y1="120" x2="334" y2="270" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" opacity="0.85" filter="url(#rough2)"/>
  <line x1="366" y1="120" x2="214" y2="270" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" opacity="0.85" filter="url(#rough2)"/>
  <line x1="486" y1="120" x2="574" y2="270" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" opacity="0.85" filter="url(#rough2)"/>
  <line x1="606" y1="120" x2="454" y2="270" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" opacity="0.85" filter="url(#rough2)"/>
  <line x1="366" y1="120" x2="574" y2="270" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" opacity="0.85" filter="url(#rough2)"/>
  <circle cx="110" cy="120" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="110" y="124.68" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">1</text>
  <circle cx="110" cy="270" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="110" y="274.68" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">1</text>
  <circle cx="230" cy="120" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="124.68" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">2</text>
  <circle cx="230" cy="270" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="274.68" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">2</text>
  <circle cx="350" cy="120" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="124.68" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">3</text>
  <circle cx="350" cy="270" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="274.68" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">3</text>
  <circle cx="470" cy="120" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="470" y="124.68" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">4</text>
  <circle cx="470" cy="270" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="470" y="274.68" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">4</text>
  <circle cx="590" cy="120" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="590" y="124.68" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">5</text>
  <circle cx="590" cy="270" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="590" y="274.68" font-size="13" fill="#333333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">5</text>
  <rect x="660" y="92" width="192" height="152" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="674" y="118" font-size="12.5" fill="#446688" text-anchor="start" font-weight="normal" filter="url(#rough2)">状态 2n 个、边 2m 条</text>
  <text x="674" y="144" font-size="12.5" fill="#333333" text-anchor="start" font-weight="normal" filter="url(#rough2)">层数 = 原图走法长度</text>
  <text x="674" y="170" font-size="12.5" fill="#333333" text-anchor="start" font-weight="normal" filter="url(#rough2)">偶数长 ⇒ 落在 (n,0)</text>
  <text x="674" y="196" font-size="12.5" fill="#333333" text-anchor="start" font-weight="normal" filter="url(#rough2)">奇数长 ⇒ 落在 (n,1)</text>
  <text x="674" y="222" font-size="12.5" fill="#4a7a3a" text-anchor="start" font-weight="normal" filter="url(#rough2)">一次 BFS 得两种奇偶</text>
  <rect x="28" y="300" width="620" height="78" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="42" y="328" font-size="13" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">⚠ 投影回原图可能重复顶点：走法 ≠ 简单路径</text>
  <text x="42" y="354" font-size="12" fill="#333333" text-anchor="start" font-weight="normal" filter="url(#rough2)">例：只有 1-6 一条边通向 6，另有三角 1-2-4-1；偶走法 1-2-4-1-6 存在，</text>
  <text x="42" y="374" font-size="12" fill="#333333" text-anchor="start" font-weight="normal" filter="url(#rough2)">但任何简单路径只能是 1-6（长 1），答案应为 -1</text>
</svg>
