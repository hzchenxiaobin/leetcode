  <circle cx="366.0" cy="254.0" r="3.2" fill="#2f5223" filter="url(#rough2)"/>
  <circle cx="340.0" cy="280.0" r="3.2" fill="#2f5223" filter="url(#rough2)"/>
  <circle cx="262.0" cy="254.0" r="3.6" fill="#b85450" stroke="#8a3030" stroke-width="0.8" filter="url(#rough2)"/>
  <circle cx="340.0" cy="176.0" r="3.6" fill="#b85450" stroke="#8a3030" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="301.0" y="300" font-size="11.5" fill="#2f5223" text-anchor="middle" filter="url(#rough2)">m=5, n=5 → 10 步</text>
  <text x="473.0" y="78" font-size="13" fill="#7a5a1b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">m 奇 n 偶</text>
  <rect x="434" y="176" width="78" height="52" rx="3" fill="#fdeaea" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <polygon points="408.0,254.0 408.0,150.0 512.0,150.0 538.0,176.0 538.0,228.0 512.0,254.0" fill="#e6f4ea" fill-opacity="0.35" stroke="#7a5a1b" stroke-width="2.2" filter="url(#rough2)"/>
  <circle cx="408.0" cy="254.0" r="3.2" fill="#7a5a1b" filter="url(#rough2)"/>
  <circle cx="408.0" cy="150.0" r="3.2" fill="#7a5a1b" filter="url(#rough2)"/>
  <circle cx="512.0" cy="150.0" r="3.2" fill="#7a5a1b" filter="url(#rough2)"/>
  <circle cx="538.0" cy="176.0" r="3.2" fill="#7a5a1b" filter="url(#rough2)"/>
  <circle cx="538.0" cy="228.0" r="3.2" fill="#7a5a1b" filter="url(#rough2)"/>
  <circle cx="512.0" cy="254.0" r="3.2" fill="#7a5a1b" filter="url(#rough2)"/>
  <circle cx="434.0" cy="228.0" r="3.6" fill="#b85450" stroke="#8a3030" stroke-width="0.8" filter="url(#rough2)"/>
  <circle cx="512.0" cy="176.0" r="3.6" fill="#b85450" stroke="#8a3030" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="473.0" y="274" font-size="11.5" fill="#7a5a1b" text-anchor="middle" filter="url(#rough2)">m=5, n=4 → 9 步</text>
  <text x="624.0" y="78" font-size="13" fill="#7a4a7a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">m 偶 n 奇</text>
  <rect x="598" y="176" width="52" height="78" rx="3" fill="#fdeaea" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <polygon points="572.0,280.0 572.0,176.0 598.0,150.0 650.0,150.0 676.0,176.0 676.0,280.0" fill="#e6f4ea" fill-opacity="0.35" stroke="#7a4a7a" stroke-width="2.2" filter="url(#rough2)"/>
  <circle cx="572.0" cy="280.0" r="3.2" fill="#7a4a7a" filter="url(#rough2)"/>
  <circle cx="572.0" cy="176.0" r="3.2" fill="#7a4a7a" filter="url(#rough2)"/>
  <circle cx="598.0" cy="150.0" r="3.2" fill="#7a4a7a" filter="url(#rough2)"/>
  <circle cx="650.0" cy="150.0" r="3.2" fill="#7a4a7a" filter="url(#rough2)"/>
  <circle cx="676.0" cy="176.0" r="3.2" fill="#7a4a7a" filter="url(#rough2)"/>
  <circle cx="676.0" cy="280.0" r="3.2" fill="#7a4a7a" filter="url(#rough2)"/>
  <circle cx="598.0" cy="254.0" r="3.6" fill="#b85450" stroke="#8a3030" stroke-width="0.8" filter="url(#rough2)"/>
  <circle cx="650.0" cy="176.0" r="3.6" fill="#b85450" stroke="#8a3030" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="624.0" y="300" font-size="11.5" fill="#7a4a7a" text-anchor="middle" filter="url(#rough2)">m=4, n=5 → 9 步</text>
  <rect x="60" y="352" width="650" height="74" rx="10" fill="#f2f6fb" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="78" y="376" font-size="11.5" fill="#2b2b2b" text-anchor="start" filter="url(#rough2)">红点：奶牛；虚线：内盒 [1,m−1]×[1,n−1]；实线：回路。</text>
  <text x="78" y="398" font-size="11.5" fill="#2b2b2b" text-anchor="start" filter="url(#rough2)">每条边要么是偶数长的轴段（拆成 (2,0)/(0,2) 步子），要么是一步斜边 (1,±1)，</text>
  <text x="78" y="418" font-size="11.5" fill="#2b2b2b" text-anchor="start" filter="url(#rough2)">因此顶点都是格点、总步数正好 m+n = A+B+4，且内盒（含全部奶牛）严格在内部。</text>
</svg>
