<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrb2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="430" fill="#fafafa"/>
  <text x="380" y="34" font-size="20" fill="#2b2b2b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">四种奇偶情形：都恰好 m + n 步</text>
  <text x="122.0" y="78" font-size="13" fill="#2f4a66" text-anchor="middle" font-weight="bold" filter="url(#rough2)">m、n 均偶：矩形</text>
  <rect x="70" y="176" width="104" height="52" rx="3" fill="#fdeaea" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <polygon points="44.0,254.0 44.0,150.0 200.0,150.0 200.0,254.0" fill="#e6f4ea" fill-opacity="0.35" stroke="#2f4a66" stroke-width="2.2" filter="url(#rough2)"/>
