  <circle cx="44.0" cy="150.0" r="3.2" fill="#2f4a66" filter="url(#rough2)"/>
  <circle cx="200.0" cy="150.0" r="3.2" fill="#2f4a66" filter="url(#rough2)"/>
  <circle cx="200.0" cy="254.0" r="3.2" fill="#2f4a66" filter="url(#rough2)"/>
  <circle cx="70.0" cy="228.0" r="3.6" fill="#b85450" stroke="#8a3030" stroke-width="0.8" filter="url(#rough2)"/>
  <circle cx="174.0" cy="176.0" r="3.6" fill="#b85450" stroke="#8a3030" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="122.0" y="274" font-size="11.5" fill="#2f4a66" text-anchor="middle" filter="url(#rough2)">m=6, n=4 → 10 步</text>
  <text x="301.0" y="78" font-size="13" fill="#2f5223" text-anchor="middle" font-weight="bold" filter="url(#rough2)">m、n 均奇：六边形</text>
  <rect x="262" y="176" width="78" height="78" rx="3" fill="#fdeaea" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <polygon points="236.0,280.0 236.0,176.0 262.0,150.0 366.0,150.0 366.0,254.0 340.0,280.0" fill="#e6f4ea" fill-opacity="0.35" stroke="#2f5223" stroke-width="2.2" filter="url(#rough2)"/>
