<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="19"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="430" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">建图：源 → 字符串 → 字母 → 汇</text>
  <path d="M 190 42 Q 360 48 530 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- S -->
  <rect x="30" y="182" width="64" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="62" y="212" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">S</text>

  <!-- 字符串层 -->
  <rect x="150" y="76" width="130" height="46" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="150" y="150" width="130" height="46" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="150" y="224" width="130" height="46" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="215" y="104" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">s1，a1 个上限</text>
  <text x="215" y="178" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">s2，a2 个上限</text>
  <text x="215" y="252" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">s3，a3 个上限</text>
  <text x="215" y="300" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">每一层只连向自己含有的字母</text>

  <!-- S -> 字符串 -->
  <path d="M 96 198 C 120 170 122 110 148 100" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 96 206 L 146 174" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 96 214 C 120 240 122 248 146 250" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="104" y="150" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">cap a_i</text>
  <text x="104" y="166" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">cost i</text>

  <!-- 字母层 -->
  <rect x="360" y="90" width="96" height="44" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="360" y="162" width="96" height="44" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="360" y="234" width="96" height="44" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="408" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">字母 a</text>
  <text x="408" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">字母 b</text>
  <text x="408" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">字母 c</text>

  <!-- 字符串 -> 字母 -->
  <path d="M 282 100 C 310 100 330 108 358 112" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 282 174 C 310 186 330 200 358 210" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 282 248 C 310 252 330 250 358 254" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="330" font-size="10.5" fill="#2f5223" filter="url(#rough2)">cap = 该串中该字母的个数，cost 0</text>

  <!-- 汇 -->
  <rect x="540" y="182" width="70" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="575" y="212" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">T</text>
  <path d="M 458 112 C 500 130 520 160 538 190" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 458 184 L 536 196" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 458 256 C 500 240 520 220 538 214" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="512" y="170" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">cap = t 中该字母个数</text>

  <rect x="40" y="352" width="640" height="62" rx="9" fill="#fde8e8" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="54" y="376" font-size="12" fill="#8c2f2b" filter="url(#rough2)">求最小费用流：费用只在 S→s_i 的边上（每单位 i 元），字母层与汇边的费用都是 0。</text>
  <text x="54" y="398" font-size="12" fill="#8c2f2b" filter="url(#rough2)">若最大流量小于 |t|，说明某些字母凑不齐 → 输出 -1；否则最小费用就是答案。</text>
</svg>
