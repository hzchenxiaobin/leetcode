<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="767"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="290" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">把 A 的连续弧映射到 B 的位置</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">需要位置序列（绕环展开后）严格递增且跨度 &lt; l_b</text>
  <text x="90" y="110" text-anchor="start" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">A：1 3 5 2</text>
  <text x="90" y="150" text-anchor="start" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">B：1 2 3 4 5 6</text>
  <text x="90" y="196" text-anchor="start" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">弧 1,3,5 → B 位置 0,1,2 ⇒ 长度 3 ✓</text>
  <text x="90" y="228" text-anchor="start" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">再加 2 → 位置 0,1,2 后接 3? 实际是 1 ⇒ 回头 ✗</text>
  <g filter="url(#rough2)"><rect x="560" y="96" width="300" height="90" rx="6" fill="#cfe0f5" fill-opacity="0.35" stroke="#446688" stroke-width="1.4"/></g>
  <text x="710" y="126" text-anchor="middle" font-size="10.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">双指针：窗口内最多一次下降</text>
  <text x="710" y="156" text-anchor="middle" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">跨度 c[r] + desc·l_b − c[l] &lt; l_b</text>
  <text x="710" y="182" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">长度 ≤ l_a</text>
</svg>
