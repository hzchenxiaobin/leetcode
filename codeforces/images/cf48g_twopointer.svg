<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="400" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="38" text-anchor="middle" font-size="18.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">48G：环上的距离和用“双倍化 + 双指针”算</text>
  <path d="M 137 50 Q 380 56 623 50" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <line x1="250" y1="140" x2="332" y2="188" stroke="#446688" stroke-width="2.0" filter="url(#rough2)"/>
  <line x1="332" y1="188" x2="332" y2="282" stroke="#446688" stroke-width="2.0" filter="url(#rough2)"/>
  <line x1="332" y1="282" x2="250" y2="330" stroke="#446688" stroke-width="2.0" filter="url(#rough2)"/>
  <line x1="250" y1="330" x2="168" y2="282" stroke="#446688" stroke-width="2.0" filter="url(#rough2)"/>
  <line x1="168" y1="282" x2="168" y2="188" stroke="#446688" stroke-width="2.0" filter="url(#rough2)"/>
  <line x1="168" y1="188" x2="250" y2="140" stroke="#446688" stroke-width="2.0" filter="url(#rough2)"/>
  <circle cx="250" cy="140" r="8" fill="#446688" stroke="none" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="250" y="126" text-anchor="middle" font-size="10.5" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">c0</text>
  <circle cx="332" cy="188" r="8" fill="#446688" stroke="none" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="332" y="174" text-anchor="middle" font-size="10.5" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">c1</text>
  <circle cx="332" cy="282" r="8" fill="#446688" stroke="none" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="332" y="268" text-anchor="middle" font-size="10.5" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">c2</text>
  <circle cx="250" cy="330" r="8" fill="#446688" stroke="none" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="250" y="316" text-anchor="middle" font-size="10.5" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">c3</text>
  <circle cx="168" cy="282" r="8" fill="#446688" stroke="none" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="168" y="268" text-anchor="middle" font-size="10.5" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">c4</text>
  <circle cx="168" cy="188" r="8" fill="#446688" stroke="none" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="168" y="174" text-anchor="middle" font-size="10.5" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">c5</text>
  <text x="60" y="84" text-anchor="start" font-size="11.5" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">对每个 i，找最远的 r 使顺时针距离 ≤ L/2：</text>
  <text x="60" y="110" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">(i, r] 内的点走顺时针更近，(r, i+k) 内的点走逆时针更近。</text>
  <rect x="400" y="140" width="320" height="150" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="416" y="168" text-anchor="start" font-size="11.5" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">前缀和一次算两段：</text>
  <text x="416" y="194" text-anchor="start" font-size="11" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">Σ 顺时针 = Σ m_j·(p_j − p_i)</text>
  <text x="416" y="218" text-anchor="start" font-size="11" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">Σ 逆时针 = Σ m_j·(L − (p_j − p_i))</text>
  <text x="416" y="242" text-anchor="start" font-size="11" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">r 单调增 ⇒ 总 O(k)</text>
  <text x="416" y="268" text-anchor="start" font-size="11" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">L = 环总长，p = 沿环前缀位置</text>
  <text x="60" y="350" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">样例 3（4 环，边长 3 2 1 4）：1 号点到 3 号点两条路都是 5，取 5 ⇒ 12 8 8 8。</text>
  <text x="60" y="378" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">每个点还要加上“挂树内部”的距离和（换根 DP O(n)）。</text>
</svg>
