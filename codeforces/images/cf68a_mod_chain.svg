<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>

  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">取模链只降不升：回到 x 必须每步都不变</text>
  <path d="M 130 44 Q 360 50 590 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 第一行：会下降的例子 -->
  <text x="34" y="94" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">x = 46，顺序 (31, 41, 59, 26)</text>
  <g filter="url(#rough2)">
    <rect x="40" y="108" width="64" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="72" y="136" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f4a66">46</text>
    <rect x="164" y="108" width="64" height="44" rx="8" fill="#fdecea" stroke="#b85450" stroke-width="1.8"/>
    <text x="196" y="136" text-anchor="middle" font-size="16" font-weight="bold" fill="#8c2f2b">15</text>
    <rect x="288" y="108" width="64" height="44" rx="8" fill="#fdecea" stroke="#b85450" stroke-width="1.6"/>
    <text x="320" y="136" text-anchor="middle" font-size="16" font-weight="bold" fill="#8c2f2b">15</text>
    <rect x="412" y="108" width="64" height="44" rx="8" fill="#fdecea" stroke="#b85450" stroke-width="1.6"/>
    <text x="444" y="136" text-anchor="middle" font-size="16" font-weight="bold" fill="#8c2f2b">15</text>
    <rect x="536" y="108" width="64" height="44" rx="8" fill="#fdecea" stroke="#b85450" stroke-width="1.6"/>
    <text x="568" y="136" text-anchor="middle" font-size="16" font-weight="bold" fill="#8c2f2b">15</text>
  </g>
  <g filter="url(#rough2)" stroke="#446688" stroke-width="1.5" fill="none">
    <line x1="104" y1="130" x2="158" y2="130" marker-end="url(#arr)"/>
    <line x1="228" y1="130" x2="282" y2="130" marker-end="url(#arr)"/>
    <line x1="352" y1="130" x2="406" y2="130" marker-end="url(#arr)"/>
    <line x1="476" y1="130" x2="530" y2="130" marker-end="url(#arr)"/>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#555">
    <text x="131" y="122" text-anchor="middle">mod 31</text>
    <text x="255" y="122" text-anchor="middle">mod 41</text>
    <text x="379" y="122" text-anchor="middle">mod 59</text>
    <text x="503" y="122" text-anchor="middle">mod 26</text>
  </g>
  <text x="616" y="128" font-size="12" fill="#8c2f2b" filter="url(#rough2)">第一步严格</text>
  <text x="616" y="146" font-size="12" fill="#8c2f2b" filter="url(#rough2)">下降，回不去</text>
  <text x="40" y="178" font-size="11.5" fill="#8c2f2b" filter="url(#rough2)">46 ≥ 31 ⇒ 46 mod 31 = 15 &lt; 46，此后每步都只能更小或持平，f(x) = 15 ≠ 46</text>

  <line x1="40" y1="196" x2="680" y2="196" stroke="#cccccc" stroke-width="1" stroke-dasharray="6 5" filter="url(#rough2)"/>

  <!-- 第二行：恒等的例子 -->
  <text x="34" y="230" font-size="13" font-weight="bold" fill="#2f7a3a" filter="url(#rough2)">x = 25（同一个顺序）</text>
  <g filter="url(#rough2)">
    <rect x="40" y="244" width="64" height="44" rx="8" fill="#e6f4ea" stroke="#2f7a3a" stroke-width="1.6"/>
    <text x="72" y="272" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f5226">25</text>
    <rect x="164" y="244" width="64" height="44" rx="8" fill="#e6f4ea" stroke="#2f7a3a" stroke-width="1.6"/>
    <text x="196" y="272" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f5226">25</text>
    <rect x="288" y="244" width="64" height="44" rx="8" fill="#e6f4ea" stroke="#2f7a3a" stroke-width="1.6"/>
    <text x="320" y="272" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f5226">25</text>
    <rect x="412" y="244" width="64" height="44" rx="8" fill="#e6f4ea" stroke="#2f7a3a" stroke-width="1.6"/>
    <text x="444" y="272" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f5226">25</text>
    <rect x="536" y="244" width="64" height="44" rx="8" fill="#e6f4ea" stroke="#2f7a3a" stroke-width="1.6"/>
    <text x="568" y="272" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f5226">25</text>
  </g>
  <g filter="url(#rough2)" stroke="#2f7a3a" stroke-width="1.5" fill="none">
    <line x1="104" y1="266" x2="158" y2="266" marker-end="url(#arr)"/>
    <line x1="228" y1="266" x2="282" y2="266" marker-end="url(#arr)"/>
    <line x1="352" y1="266" x2="406" y2="266" marker-end="url(#arr)"/>
    <line x1="476" y1="266" x2="530" y2="266" marker-end="url(#arr)"/>
  </g>
  <text x="616" y="264" font-size="12" fill="#1f5226" filter="url(#rough2)">25 &lt; 26，</text>
  <text x="616" y="282" font-size="12" fill="#1f5226" filter="url(#rough2)">24 种顺序全成功</text>
  <text x="40" y="314" font-size="11.5" fill="#1f5226" filter="url(#rough2)">x 小于全部四个模数 ⇒ 每一步取模都是恒等 ⇒ 无论什么顺序，f(x) = x</text>

  <!-- 结论框 -->
  <rect x="40" y="338" width="640" height="74" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="366" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">f(x) = x  ⟺  x &lt; min(p₁,p₂,p₃,p₄) = m，与取模顺序无关</text>
  <text x="56" y="392" font-size="12" fill="#7a5a1b" filter="url(#rough2)">于是每个 x 的成功排列数非 0 即 24："至少 7 种" 等价于 "24 种"，门槛是干扰项</text>
</svg>
