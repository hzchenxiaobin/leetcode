<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="221"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">187D：灯周期 M=g+r，绿灯 [0,g)；红灯就等到下一个 M 的倍数</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="70.0" y="170.0" width="580.0" height="40.0" fill="#ffffff" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="70.0" y="170.0" width="116.0" height="40.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.0" filter="url(#rough2)"/>
  <rect x="186.0" y="170.0" width="77.3" height="40.0" fill="#fde8e8" stroke="#b85450" stroke-width="1.0" filter="url(#rough2)"/>
  <rect x="263.3" y="170.0" width="116.0" height="40.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.0" filter="url(#rough2)"/>
  <rect x="379.3" y="170.0" width="77.3" height="40.0" fill="#fde8e8" stroke="#b85450" stroke-width="1.0" filter="url(#rough2)"/>
  <rect x="456.7" y="170.0" width="116.0" height="40.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.0" filter="url(#rough2)"/>
  <rect x="572.7" y="170.0" width="77.3" height="40.0" fill="#fde8e8" stroke="#b85450" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="360.0" y="196.0" text-anchor="middle" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">绿 0..g    红 g..M    绿 M..M+g    红 ……</text>
  <text x="70.0" y="250.0" text-anchor="start" font-size="12" fill="#444" filter="url(#rough2)">到达相位 φ ≥ g → 等待 M−φ 秒；等待后时刻 ≡ 0 (mod M)</text>
  <rect x="60.0" y="280.0" width="600.0" height="60.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="74.0" y="303.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">若在路口 i 停下，之后「下一个停下的路口」只取决于 i</text>
  <text x="74.0" y="327.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">因为过灯时刻都是 M 的倍数</text>
  <rect x="60.0" y="352.0" width="600.0" height="56.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="74.0" y="376.0" text-anchor="start" font-size="12" fill="#3f3420" filter="url(#rough2)">nxt[i] = 最小 j&gt;i 使 (P[j]−P[i]) mod M ≥ g</text>
</svg>
