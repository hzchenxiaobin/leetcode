<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>

  <rect width="720" height="440" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2：1920 × 1200，目标 16 : 9</text>
  <path d="M 160 44 Q 360 50 560 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <rect x="100" y="70" width="480" height="300" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="8 4" filter="url(#rough2)"/>
  <rect x="100" y="70" width="480" height="270" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="100" y="340" width="480" height="30" fill="#fde8e8" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>

  <text x="340" y="212" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f5223" filter="url(#rough2)">新屏幕 1920 × 1080</text>
  <text x="340" y="362" text-anchor="middle" font-size="11" fill="#a33a36" filter="url(#rough2)">空出 120（高度方向没吃满）</text>
  <text x="588" y="80" font-size="11" fill="#a33a36" filter="url(#rough2)">可用 1920 × 1200</text>

  <text x="40" y="404" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">k = min(⌊1920 / 16⌋, ⌊1200 / 9⌋) = min(120, 133) = 120。</text>
  <text x="40" y="430" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">120 × (16, 9) = (1920, 1080)；面积 2 073 600，是所有合法缩放里最大的。</text>
</svg>
