<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="321" />
      <feDisplacementMap in="SourceGraphic" scale="1.5" />
    </filter>
  </defs>
  <rect width="760" height="420" fill="#fafafa" />
  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">排序后，对每个左端点找最远的右端点</text>
  <path d="M 120 44 Q 380 50 640 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)" />

  <text x="60" y="80" font-size="11.5" fill="#555" filter="url(#rough2)">身高（已升序），d = 10：</text>
  <g>
    <rect x="60" y="92" width="100" height="48" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)" />
    <rect x="180" y="92" width="100" height="48" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)" />
    <rect x="300" y="92" width="100" height="48" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)" />
    <rect x="420" y="92" width="100" height="48" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)" />
    <rect x="540" y="92" width="100" height="48" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)" />
  </g>
  <text x="110" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">10</text>
  <text x="230" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">20</text>
  <text x="350" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5223" filter="url(#rough2)">50</text>
  <text x="470" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5223" filter="url(#rough2)">60</text>
  <text x="590" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6015" filter="url(#rough2)">65</text>

  
  <path d="M 60 156 L 60 170 L 280 170 L 280 156" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)" />
  <text x="170" y="190" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">i=0：10 与 20 的差 ≤ 10</text>

  <path d="M 300 202 L 300 216 L 520 216 L 520 202" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)" />
  <text x="410" y="236" text-anchor="middle" font-size="10.5" fill="#2f5223" filter="url(#rough2)">i=2：50 与 60 的差 ≤ 10（65 差 15，不行）</text>

  <path d="M 420 248 L 420 262 L 640 262 L 640 248" fill="none" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)" />
  <text x="530" y="282" text-anchor="middle" font-size="10.5" fill="#8a6015" filter="url(#rough2)">i=3：60 与 65 的差 ≤ 10</text>

  <rect x="60" y="310" width="640" height="86" rx="10" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.5" filter="url(#rough2)" />
  <text x="80" y="336" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">无序对：3 组 —— (10,20)、(50,60)、(60,65)</text>
  <text x="80" y="360" font-size="12" fill="#555" filter="url(#rough2)">题目把 (1,2) 和 (2,1) 视为不同方案，所以答案 = 3 × 2 = 6。</text>
  <text x="80" y="382" font-size="11.5" fill="#777" filter="url(#rough2)">右指针 j 只前进不后退：排序后 a[j]-a[i] 随 i 增大而减小，总复杂度 O(n log n + n)。</text>
</svg>