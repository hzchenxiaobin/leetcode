<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="343" />
      <feDisplacementMap in="SourceGraphic" scale="1.5" />
    </filter>
  </defs>
  <rect width="760" height="430" fill="#fafafa" />
  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">一维：n=5，s=2 时每个余数类的大小</text>
  <path d="M 120 44 Q 380 50 640 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)" />

  <g>
    <rect x="60" y="80" width="70" height="48" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)" />
    <rect x="140" y="80" width="70" height="48" rx="6" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)" />
    <rect x="220" y="80" width="70" height="48" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)" />
    <rect x="300" y="80" width="70" height="48" rx="6" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)" />
    <rect x="380" y="80" width="70" height="48" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)" />
  </g>
  <text x="95" y="110" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">0</text>
  <text x="175" y="110" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">1</text>
  <text x="255" y="110" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">2</text>
  <text x="335" y="110" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">3</text>
  <text x="415" y="110" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">4</text>

  <text x="95" y="152" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">行号 0</text>
  <text x="175" y="152" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">行号 1</text>
  <text x="255" y="152" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">行号 2</text>
  <text x="335" y="152" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">行号 3</text>
  <text x="415" y="152" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">行号 4</text>

  <text x="60" y="192" font-size="12" fill="#2f4a66" filter="url(#rough2)">余数 0：{0,2,4}，大小 3</text>
  <text x="60" y="214" font-size="12" fill="#555" filter="url(#rough2)">余数 1：{1,3}，大小 2</text>
  <text x="300" y="192" font-size="12" fill="#8a6015" filter="url(#rough2)">最大大小 Rmax = 3</text>
  <text x="300" y="214" font-size="12" fill="#8a6015" filter="url(#rough2)">处于最大类的行：0、2、4，共 3 行</text>

  
  <rect x="50" y="244" width="660" height="140" rx="10" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.5" filter="url(#rough2)" />
  <text x="70" y="270" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">长度 len、步长 s 的“最大类坐标个数”：</text>
  <text x="70" y="296" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">q = len / s，r = len % s</text>
  <text x="70" y="322" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">若 r = 0：所有 len 个坐标都属于最大类；</text>
  <text x="70" y="348" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">若 r &gt; 0：前 r 个余数类各有 q+1 个点，共 r × (q+1) 个坐标。</text>
  <text x="70" y="374" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">答案 = best_rows(n,s) × best_cols(m,s)。</text>
</svg>