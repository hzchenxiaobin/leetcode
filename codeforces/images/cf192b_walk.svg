<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="360" fill="#fafafa"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">192B：每次走 1 或 2 格；连续两格塌了才过不去</text>
  <path d="M 165.65000000000006 46 Q 380.0 52 594.3499999999999 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="70.0" y="90.0" width="80.0" height="50.0" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="110.0" y="120.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#26405c" filter="url(#rough2)">1</text>
  <rect x="160.0" y="90.0" width="80.0" height="50.0" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="200.0" y="120.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#26405c" filter="url(#rough2)">2</text>
  <rect x="250.0" y="90.0" width="80.0" height="50.0" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="290.0" y="120.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#26405c" filter="url(#rough2)">3</text>
  <rect x="340.0" y="90.0" width="80.0" height="50.0" rx="6" fill="#fdf0ef" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="380.0" y="120.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">4</text>
  <text x="380.0" y="160.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">塌</text>
  <rect x="430.0" y="90.0" width="80.0" height="50.0" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="470.0" y="120.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#26405c" filter="url(#rough2)">5</text>
  <rect x="520.0" y="90.0" width="80.0" height="50.0" rx="6" fill="#fdf0ef" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="560.0" y="120.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">6</text>
  <text x="560.0" y="160.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">塌</text>
  <rect x="610.0" y="90.0" width="80.0" height="50.0" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="650.0" y="120.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#26405c" filter="url(#rough2)">7</text>
  <path d="M 70.0 66.0 L 610.0 66.0" stroke="#6b6b6b" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="340.0" y="56.0" text-anchor="middle" font-size="10.8" fill="#6b6b6b" filter="url(#rough2)">只能向右走 1 或 2 格</text>
  <rect x="60.0" y="200.0" width="640.0" height="60.0" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="224.0" text-anchor="start" font-size="11.2" fill="#8a6015" filter="url(#rough2)">只有一格塌：可以跳过 ✓（如 3 号塌，2 → 4）。</text>
  <text x="74.0" y="246.0" text-anchor="start" font-size="11.2" fill="#8a6015" filter="url(#rough2)">连续两格塌：跨度 3，跳不过去 ✗（如 5、6 都塌）。</text>
  <rect x="60.0" y="274.0" width="640.0" height="56.0" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="298.0" text-anchor="start" font-size="11.1" fill="#2f5b34" filter="url(#rough2)">第 d 天能走 ⇔ d ≤ a₁、d ≤ aₙ，且每对相邻格子至少有一个没塌：d ≤ max(aᵢ, aᵢ₊₁)。</text>
  <text x="74.0" y="320.0" text-anchor="start" font-size="11.1" fill="#2f5b34" filter="url(#rough2)">所以答案 = min(a₁, aₙ, minᵢ max(aᵢ, aᵢ₊₁))。</text>
</svg>
