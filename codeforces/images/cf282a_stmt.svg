<svg xmlns="http://www.w3.org/2000/svg" width="700" height="330" viewBox="0 0 700 330"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="151"/>
    <feDisplacementMap in="SourceGraphic" scale="1.5"/></filter></defs>
  <rect width="700" height="330" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">语句的四种写法，只有两种语义</text>
  <path d="M 130 40 Q 350 46 570 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="62" width="270" height="60" rx="8" fill="#e8f4e0" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="195" y="88" text-anchor="middle" font-size="15" fill="#2f5223" filter="url(#rough2)">++X   /   X++</text>
  <text x="195" y="110" text-anchor="middle" font-size="12.5" fill="#2f5223" filter="url(#rough2)">x ← x + 1</text>
  <g filter="url(#rough2)"><rect x="370" y="62" width="270" height="60" rx="8" fill="#fbeeee" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="505" y="88" text-anchor="middle" font-size="15" fill="#8a3a36" filter="url(#rough2)">--X   /   X--</text>
  <text x="505" y="110" text-anchor="middle" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">x ← x − 1</text>
  <g filter="url(#rough2)"><rect x="60" y="140" width="580" height="66" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="164" font-size="13" fill="#22314a" filter="url(#rough2)">判断依据：语句里含子串 "++" 就加一，含 "--" 就减一（X 的位置不影响语义）。</text>
  <text x="76" y="188" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">所以只要逐行看中间那个字符（第 2 个字符）是 '+' 还是 '−' 就够了。</text>
  <g filter="url(#rough2)"><rect x="60" y="220" width="580" height="88" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="244" font-size="13" fill="#2f5223" filter="url(#rough2)">样例 1：1 条语句 "++X" ⇒ x = 0 + 1 = 1 ✓</text>
  <text x="76" y="268" font-size="13" fill="#2f5223" filter="url(#rough2)">样例 2："X++" 然后 "--X" ⇒ x = 0 + 1 − 1 = 0 ✓</text>
  <text x="76" y="292" font-size="12" fill="#2f5223" filter="url(#rough2)">$n\le150$，直接模拟即可，无需任何数据结构。</text>
</svg>
