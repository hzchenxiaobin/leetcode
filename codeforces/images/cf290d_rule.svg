<svg xmlns="http://www.w3.org/2000/svg" width="700" height="280" viewBox="0 0 700 280"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="471"/>
    <feDisplacementMap in="SourceGraphic" scale="1.5"/></filter></defs>
  <rect width="700" height="280" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">290D：字母序号 ≤ n 的转大写，其余转小写</text>
  <path d="M 120 40 Q 350 46 580 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="76" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="12.5" fill="#22314a" filter="url(#rough2)">样例：输入 "AprilFool" 与 14 ⇒ 输出 "AprILFooL"。</text>
  <text x="76" y="106" font-size="12.5" fill="#22314a" filter="url(#rough2)">逐字对照：i(9)→I、l(12)→L、l(12)→L 被大写；p(16)、r(18)、o(15)、o(15) 被小写；</text>
  <text x="76" y="130" font-size="12.5" fill="#22314a" filter="url(#rough2)">A(1)→A、F(6)→F 本来就大写 ✓ —— 判据正是"字母序号 ≤ 14"。</text>
  <g filter="url(#rough2)"><rect x="60" y="146" width="580" height="66" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="170" font-size="12.5" fill="#2f5223" filter="url(#rough2)">题面原本靠一张图说明规则（愚人节梗），数值 0..26 与"字母表序号"范围一致。</text>
  <text x="76" y="194" font-size="12.5" fill="#2f5223" filter="url(#rough2)">实现：对每个字符取 idx（a=1..z=26，大小写同值），idx ≤ n 就 toupper 否则 tolower。</text>
  <g filter="url(#rough2)"><rect x="60" y="222" width="580" height="46" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="76" y="246" font-size="12.5" fill="#8a6015" filter="url(#rough2)">n=0 ⇒ 全小写；n=26 ⇒ 全大写。O(|s|)，|s| ≤ 50。</text>
  <text x="76" y="266" font-size="11.5" fill="#8a6015" filter="url(#rough2)">易错：区分大小写无关（'A' 与 'a' 都按序号 1 处理）。</text>
</svg>
