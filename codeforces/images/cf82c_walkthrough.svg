<svg xmlns="http://www.w3.org/2000/svg" width="700" height="400" viewBox="0 0 700 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="700" height="400" fill="#fafafa"/>
  <text x="350" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2：a = 5 4 3 2 1，树 1-2, 2-3, 2-4, 4-5</text>
  <path d="M 190 43 Q 350 49 510 43" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 350 80 L 350 170" stroke="#777777" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 350 170 L 200 260" stroke="#777777" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 350 170 L 450 260" stroke="#777777" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 450 260 L 450 350" stroke="#777777" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <circle cx="350" cy="80" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <circle cx="350" cy="170" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="175" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <circle cx="200" cy="260" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="265" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <circle cx="450" cy="260" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="450" y="265" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <circle cx="450" cy="350" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="450" y="355" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <text x="376" y="85" text-anchor="start" font-size="10.5" fill="#8a6015" filter="url(#rough2)">首都</text>
  <text x="324" y="175" text-anchor="end" font-size="10" fill="#446688" filter="url(#rough2)">a=4</text>
  <text x="190" y="290" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">a=3</text>
  <text x="460" y="290" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">a=2</text>
  <text x="472" y="355" text-anchor="start" font-size="10" fill="#446688" filter="url(#rough2)">a=1</text>
  <rect x="40" y="300" width="250" height="82" rx="7" fill="#e9f4e2" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="56" y="324" text-anchor="start" font-size="11" font-weight="bold" fill="#2f5223" filter="url(#rough2)">优先级：5 &gt; 4 &gt; 3 &gt; 2 &gt; 1</text>
  <text x="56" y="346" text-anchor="start" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">2 号城每天只能发 1 个：</text>
  <text x="56" y="368" text-anchor="start" font-size="10" fill="#3c5e2e" filter="url(#rough2)">第 0 天 2 号、第 1 天 4 号、第 2 天 5 号、第 3 天 3 号</text>
  <text x="320" y="340" text-anchor="start" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">答案 0 1 4 2 3</text>
  <text x="320" y="368" text-anchor="start" font-size="10.5" fill="#777777" filter="url(#rough2)">（与样例输出一致）</text>
</svg>
