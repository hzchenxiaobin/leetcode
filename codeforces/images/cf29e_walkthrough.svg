<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>

  <text x="360" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 3：k = 6 的两条路线</text>
  <path d="M 220 40 Q 360 46 500 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 时间表 -->
  <g font-size="11" text-anchor="middle" fill="#555" filter="url(#rough2)">
    <text x="90" y="80">时刻</text>
    <text x="180" y="80">0</text><text x="240" y="80">1</text><text x="300" y="80">2</text>
    <text x="360" y="80">3</text><text x="420" y="80">4</text><text x="480" y="80">5</text>
    <text x="540" y="80">6</text>
  </g>
  <text x="90" y="118" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">Bob</text>
  <text x="90" y="156" text-anchor="middle" font-size="11" font-weight="bold" fill="#a33a36" filter="url(#rough2)">Alex</text>

  <g filter="url(#rough2)">
    <rect x="150" y="94" width="420" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="150" y="132" width="420" height="34" rx="6" fill="#fde8e8" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">
    <text x="180" y="116">1</text><text x="240" y="116">2</text><text x="300" y="116">3</text>
    <text x="360" y="116">4</text><text x="420" y="116">3</text><text x="480" y="116">2</text>
    <text x="540" y="116">7</text>
    <text x="180" y="154">7</text><text x="240" y="154">6</text><text x="300" y="154">7</text>
    <text x="360" y="154">2</text><text x="420" y="154">1</text><text x="480" y="154">5</text>
    <text x="540" y="154">1</text>
  </g>

  <text x="360" y="196" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">每一列的两个位置都不同：6, 2, 3, 2, 3, 5, 7 与 1 / 6 / 7 / 2 / 1 / 5 / 1 逐列比较均不相等。</text>

  <rect x="40" y="216" width="640" height="96" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <g font-size="11.5" fill="#2f5223" filter="url(#rough2)">
    <text x="56" y="242">Bob 路线：1 2 3 4 3 2 7；Alex 路线：7 6 7 2 1 5 1，长度都是 6。</text>
    <text x="56" y="268">样例 2 的图不连通到目标：k 无解输出 -1；样例 1 只有一条边，两人直接对穿，k = 1。</text>
    <text x="56" y="294">BFS 找到的 k 是最短的；题目要求两条路线等长，正是因为两人每一步都必须移动。</text>
  </g>

  <text x="40" y="344" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">起点 (1, 7)，终点 (7, 1)；若存在多组最短路线，任意一组均可（本实现按 BFS 顺序输出）。</text>
  <text x="40" y="370" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">如果终点不可达，说明在"不能同点"的约束下无解，输出 -1。</text>
  <text x="40" y="400" font-size="11.5" fill="#555" filter="url(#rough2)">检查器会验证：长度相同、逐点相邻、每一时刻位置不同、且 k 等于 BFS 最小值。</text>
</svg>
