<svg xmlns="http://www.w3.org/2000/svg" width="740" height="360" viewBox="0 0 740 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="151"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="740" height="360" fill="#fafafa"/>
  <text x="370" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两个切点决定三段：逐段检查是否是无前导零的合法数</text>
  <path d="M 180 46 Q 370 52 560 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="24" y="152" text-anchor="start" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">s =</text>
  <rect x="120" y="120" width="52" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="146.0" y="150" text-anchor="middle" font-size="18" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">1</text>
  <text x="146.0" y="112" text-anchor="middle" font-size="10" font-weight="normal" fill="#888" filter="url(#rough2)">0</text>
  <rect x="180" y="120" width="52" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="206.0" y="150" text-anchor="middle" font-size="18" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">2</text>
  <text x="206.0" y="112" text-anchor="middle" font-size="10" font-weight="normal" fill="#888" filter="url(#rough2)">1</text>
  <rect x="240" y="120" width="52" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="266.0" y="150" text-anchor="middle" font-size="18" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">3</text>
  <text x="266.0" y="112" text-anchor="middle" font-size="10" font-weight="normal" fill="#888" filter="url(#rough2)">2</text>
  <rect x="300" y="120" width="52" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="326.0" y="150" text-anchor="middle" font-size="18" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">4</text>
  <text x="326.0" y="112" text-anchor="middle" font-size="10" font-weight="normal" fill="#888" filter="url(#rough2)">3</text>
  <line x1="176" y1="96" x2="176" y2="186" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="176" y="204" text-anchor="middle" font-size="10" font-weight="normal" fill="#b85450" filter="url(#rough2)">i=1</text>
  <line x1="236" y1="96" x2="236" y2="186" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="236" y="204" text-anchor="middle" font-size="10" font-weight="normal" fill="#b85450" filter="url(#rough2)">i=2</text>
  <rect x="120" y="228" width="52" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="146.0" y="251" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <rect x="180" y="228" width="52" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="206.0" y="251" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <rect x="240" y="228" width="112" height="34" rx="6" fill="#fde9d9" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="296.0" y="251" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">34</text>
  <text x="120" y="288" text-anchor="start" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1 + 2 + 34 = 37（样例 1 的最大值）</text>
  <rect x="60" y="286" width="620" height="56" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="74" y="308" text-anchor="start" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">一段合法 ⇔ ① 非空且长度 ≤ 7  ② 长度 &gt; 1 时首位不是 0  ③ 数值 ≤ 10⁶</text>
  <text x="74" y="328" text-anchor="start" font-size="11" font-weight="normal" fill="#7a5a1b" filter="url(#rough2)">三条同时成立才能当一轮的得分；任何一段不合法，这个切法作废。</text>
</svg>
