<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-6%" y="-6%" width="112%" height="112%"><feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="397" /><feDisplacementMap in="SourceGraphic" scale="1.5" /></filter></defs>
  <rect width="760" height="400" fill="#fafafa" />
  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">输出 b_i = 2000 + 选中下标</text>
  <path d="M 150 44 Q 380 50 610 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)" />

  <text x="60" y="82" font-size="12" fill="#555" filter="url(#rough2)">选中下标：</text>
  <g font-size="13" text-anchor="middle" fill="#2b2b2b">
    <text x="220" y="82" filter="url(#rough2)">2</text><text x="300" y="82" filter="url(#rough2)">5</text><text x="380" y="82" filter="url(#rough2)">6</text><text x="460" y="82" filter="url(#rough2)">7</text><text x="540" y="82" filter="url(#rough2)">10</text>
  </g>
  <text x="60" y="116" font-size="12" fill="#2b2b2b" filter="url(#rough2)">加 2000：</text>
  <g font-size="13" text-anchor="middle" fill="#2f5223">
    <text x="220" y="116" filter="url(#rough2)">2002</text><text x="300" y="116" filter="url(#rough2)">2005</text><text x="380" y="116" filter="url(#rough2)">2006</text><text x="460" y="116" filter="url(#rough2)">2007</text><text x="540" y="116" filter="url(#rough2)">2010</text>
  </g>

  <rect x="50" y="150" width="660" height="80" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)" />
  <text x="70" y="176" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">为什么加 2000？</text>
  <text x="70" y="200" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">题面要求 a_{b_i - 2000} = i，所以 b_i = 2000 + 选中的原始下标。</text>
  <text x="70" y="220" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">输出按原始下标升序；选中顺序本身就是从左到右扫描，天然有序。</text>

  <rect x="50" y="254" width="660" height="110" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)" />
  <text x="70" y="280" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">样例 2：a = [-1,-2,-3]</text>
  <text x="70" y="304" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">需要 1，但整个数组没有 1，K=0；只输出一行 `0`，第二行不输出。</text>
  <text x="70" y="328" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">不要输出空行，也不要输出 `2000` 之类的占位。</text>
  <text x="70" y="350" font-size="11.5" fill="#777" filter="url(#rough2)">K=0 时答案行数为 0，所以没有第二行。</text>
</svg>