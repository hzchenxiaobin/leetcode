<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="29"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="720" height="420" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">先把退化情形分出去，再按 4b 与 a 的大小二选一</text>
  <path d="M 144 41 Q 360 47 576 41" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="30" y="60" width="300" height="54" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="46" y="84" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">读入 a, b（p ∈ [0,a], q ∈ [−b,b]）</text>
  <text x="46" y="104" text-anchor="start" font-size="11.5" fill="#5b5b5b" filter="url(#rough2)">命中条件：p − 4q ≥ 0</text>
  <rect x="30" y="136" width="130" height="44" rx="8" fill="#f3e9f7" stroke="#7a4a86" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="95" y="164" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a4a86" filter="url(#rough2)">a = 0 且 b = 0</text>
  <text x="174" y="158" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">p = q = 0 唯一取值，恒命中</text>
  <rect x="556" y="136" width="134" height="44" rx="8" fill="#ffffff" stroke="#7a4a86" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="623" y="164" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a4a86" filter="url(#rough2)">1</text>
  <rect x="30" y="188" width="130" height="44" rx="8" fill="#f3e9f7" stroke="#7a4a86" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="95" y="216" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a4a86" filter="url(#rough2)">a = 0，b &gt; 0</text>
  <text x="174" y="210" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">只有 q ≤ 0 时命中，占一半</text>
  <rect x="556" y="188" width="134" height="44" rx="8" fill="#ffffff" stroke="#7a4a86" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="623" y="216" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a4a86" filter="url(#rough2)">1/2</text>
  <rect x="30" y="240" width="130" height="44" rx="8" fill="#f3e9f7" stroke="#7a4a86" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="95" y="268" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a4a86" filter="url(#rough2)">b = 0，a &gt; 0</text>
  <text x="174" y="262" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">只有 q = 0，恒有 p ≥ 0</text>
  <rect x="556" y="240" width="134" height="44" rx="8" fill="#ffffff" stroke="#7a4a86" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="623" y="268" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a4a86" filter="url(#rough2)">1</text>
  <rect x="30" y="292" width="130" height="44" rx="8" fill="#e9f4ec" stroke="#3f6b4a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="95" y="320" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">a ≥ 4b</text>
  <text x="174" y="314" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">命中面积 = ab + (ab − 2b²) = 2ab − 2b²</text>
  <rect x="556" y="292" width="134" height="44" rx="8" fill="#ffffff" stroke="#3f6b4a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="623" y="320" text-anchor="middle" font-size="14" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">1 − b/a</text>
  <rect x="30" y="344" width="130" height="44" rx="8" fill="#e9f4ec" stroke="#3f6b4a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="95" y="372" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">a &lt; 4b</text>
  <text x="174" y="366" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">命中面积 = ab + a²/8</text>
  <rect x="556" y="344" width="134" height="44" rx="8" fill="#ffffff" stroke="#3f6b4a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="623" y="372" text-anchor="middle" font-size="14" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">1/2 + a/(16b)</text>
  <text x="30" y="404" text-anchor="start" font-size="11.5" fill="#6a6a6a" filter="url(#rough2)">两条面积分支在 a = 4b 处给出同一个值 3/4，所以用整数比较 4b ≤ a 还是 4b &lt; a 都不影响正确性</text>
</svg>
