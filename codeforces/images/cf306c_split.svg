<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="240" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">把 n 天切成"白-黑-白"三段，每段至少 1 天</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">事件同型且按天分组，事件本身互异且组内有顺序</text>
  <text x="150" y="100" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">设黑段 q 天 → 两段白共 n-q 天，切法有 n-q-1 种</text>
  <text x="150" y="140" text-anchor="start" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">w 个好事件 → w! × C(w-1, n-q-1)（排列后切块）；坏事件 → b! × C(b-1, q-1)</text>
  <text x="150" y="178" text-anchor="start" font-size="12" fill="#3d6b2f" filter="url(#rough2)">答案 = w!·b!·Σ_q (n-q-1)·C(b-1,q-1)·C(w-1,n-q-1)</text>
</svg>
