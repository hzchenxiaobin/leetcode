<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="440" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">21B 判定流程</text>
  <path d="M 280 42 Q 360 48 440 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <rect x="40" y="60" width="200" height="64" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">每条方程分类</text>
  <text x="140" y="108" text-anchor="middle" font-size="10.5" fill="#3c5a73" filter="url(#rough2)">空集 / 直线 / 全平面</text>

  <path d="M 242 92 L 286 92" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <rect x="290" y="60" width="180" height="64" rx="10" fill="#fde8e8" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#a33a36" filter="url(#rough2)">任一为空集？</text>
  <text x="380" y="108" text-anchor="middle" font-size="10.5" fill="#8a3b38" filter="url(#rough2)">是 → 0</text>

  <path d="M 472 92 L 516 92" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <rect x="520" y="60" width="180" height="64" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="610" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">任一为全平面？</text>
  <text x="610" y="108" text-anchor="middle" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">是 → -1</text>

  <path d="M 360 126 L 360 154" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="370" y="146" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">否则两条都是直线</text>

  <rect x="230" y="158" width="260" height="60" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="184" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">det = A1·B2 − A2·B1</text>
  <text x="360" y="206" text-anchor="middle" font-size="10.5" fill="#2f5223" filter="url(#rough2)">det ≠ 0 → 输出 1</text>

  <path d="M 360 220 L 360 248" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="370" y="242" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">det = 0：再看是否共线</text>

  <rect x="180" y="252" width="360" height="66" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">A1·C2 = A2·C1 且 B1·C2 = B2·C1 ？</text>
  <text x="360" y="302" text-anchor="middle" font-size="10.5" fill="#3c5a73" filter="url(#rough2)">成立（同一条线）→ -1；否则（平行不重合）→ 0</text>

  <rect x="40" y="340" width="640" height="80" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <g font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">
    <text x="56" y="368">样例 1：(1,1,0) 与 (2,2,0)：det=0，C 全为 0，两式同比 → -1。</text>
    <text x="56" y="394">样例 2：(1,1,0) 与 (2,-2,0)：det=1·(-2)-2·1=-4≠0 → 恰有 1 个交点。</text>
  </g>
</svg>
