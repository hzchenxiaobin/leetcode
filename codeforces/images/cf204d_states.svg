<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="340" fill="#fafafa"/>
  <text x="360.0" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">204D：按第一个 B^k 块的结束位置分类</text>
  <path d="M 144.00 46 Q 360.0 52 576.00 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="72" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">美丽 = 存在 B^k 在左、W^k 在右（左块结束位置 b &lt; 右块开始位置 c）。</text>
  <text x="60" y="92" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">按“第一个 B^k 块的结束位置 i”分类：每个美丽串恰好被数一次。</text>
  <text x="76" y="143.0" text-anchor="end" font-size="10" fill="#333" filter="url(#rough2)">s:</text>
  <rect x="90" y="120" width="38" height="38" fill="#ffffff" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="109.0" y="143.0" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="128" y="120" width="38" height="38" fill="#ffffff" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="147.0" y="143.0" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="166" y="120" width="38" height="38" fill="#8fbf86" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="185.0" y="143.0" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="204" y="120" width="38" height="38" fill="#cfe3c8" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="223.0" y="143.0" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="242" y="120" width="38" height="38" fill="#cfe3c8" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="261.0" y="143.0" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">5</text>
  <rect x="280" y="120" width="38" height="38" fill="#cfe3c8" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="299.0" y="143.0" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">6</text>
  <rect x="318" y="120" width="38" height="38" fill="#ffffff" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="337.0" y="143.0" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">7</text>
  <rect x="356" y="120" width="38" height="38" fill="#f3c9d3" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="375.0" y="143.0" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">8</text>
  <rect x="394" y="120" width="38" height="38" fill="#f3c9d3" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="413.0" y="143.0" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">9</text>
  <rect x="432" y="120" width="38" height="38" fill="#f3c9d3" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="451.0" y="143.0" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">10</text>
  <rect x="470" y="120" width="38" height="38" fill="#ffffff" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="489.0" y="143.0" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">11</text>
  <rect x="508" y="120" width="38" height="38" fill="#ffffff" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="527.0" y="143.0" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">12</text>
  <text x="204" y="176" text-anchor="middle" font-size="10" fill="#2f5b34" filter="url(#rough2)">i = k（第一个 B 块结束）</text>
  <text x="356" y="196" text-anchor="middle" font-size="10" fill="#8a3a52" filter="url(#rough2)">i 之后要能出现 W^k</text>
  <rect x="60" y="222" width="620" height="96" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="240" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">第一个 B^k 块结束于 i 的充要条件：① i−k+1..i 全部可为 B；② i−k 位必须是 W（或 i=k，即块从开头起）；</text>
  <text x="74" y="262" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">③ 前缀 1..i−k−1 中没有 B^k 块。</text>
  <text x="74" y="284" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">于是贡献 = NB[i−k−1] · [i−k 位可为 W]，再乘上“后缀 i+1..n 至少含一个 W^k”的赋值数。</text>
</svg>
