<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="107"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">三种"把一块接进来"的手法</text>
  <path d="M 176 42 Q 360 49 546 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 左：方法 A -->
  <text x="132" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a63" filter="url(#rough2)">A：花一条可用叶子边</text>
  <!-- 已访问区 -->
  <rect x="26" y="88" width="212" height="118" rx="9" fill="#eaf3ff" stroke="#446688" stroke-width="1.5" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="132" y="108" text-anchor="middle" font-size="11" fill="#2f4a63" filter="url(#rough2)">已访问区（连通）</text>
  <circle cx="76" cy="150" r="13" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="155" text-anchor="middle" font-size="11" fill="#2f4a63" filter="url(#rough2)">p</text>
  <circle cx="150" cy="150" r="13" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="155" text-anchor="middle" font-size="11" fill="#2f4a63" filter="url(#rough2)">ℓ</text>
  <line x1="89" y1="150" x2="137" y2="150" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="113" y="182" text-anchor="middle" font-size="10.5" fill="#8a3b37" filter="url(#rough2)">ℓ 是叶子：挪走不丢东西</text>
  <!-- 新块 -->
  <rect x="26" y="222" width="212" height="72" rx="9" fill="#eef6ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="132" y="246" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">待接的连通块 Y</text>
  <circle cx="90" cy="270" r="11" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="90" y="274" text-anchor="middle" font-size="10" fill="#2f5223" filter="url(#rough2)">c</text>
  <circle cx="170" cy="270" r="11" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="101" y1="270" x2="159" y2="270" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="82" y1="163" x2="88" y2="257" stroke="#b85450" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="132" y="310" text-anchor="middle" font-size="10.5" fill="#4a3d6b" filter="url(#rough2)">(p,ℓ) 挪成 (p,c)，整块一次进来</text>

  <!-- 中：方法 B -->
  <text x="368" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a3d6b" filter="url(#rough2)">B：有环块自带非桥边</text>
  <rect x="262" y="88" width="212" height="118" rx="9" fill="#f3eefb" stroke="#6b5b95" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="368" y="108" text-anchor="middle" font-size="11" fill="#4a3d6b" filter="url(#rough2)">块里有环 ⇒ 拆一条边也不断</text>
  <circle cx="310" cy="140" r="12" fill="#ffffff" stroke="#6b5b95" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="368" cy="122" r="12" fill="#ffffff" stroke="#6b5b95" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="426" cy="140" r="12" fill="#ffffff" stroke="#6b5b95" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="321" y1="135" x2="357" y2="125" stroke="#6b5b95" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="379" y1="125" x2="415" y2="135" stroke="#6b5b95" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="316" y1="150" x2="420" y2="150" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="368" y="176" text-anchor="middle" font-size="10.5" fill="#8a3b37" filter="url(#rough2)">虚线是回边：挪它不会把块拆开</text>
  <!-- 新块下方 -->
  <rect x="262" y="222" width="212" height="72" rx="9" fill="#eef6ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="368" y="246" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">把这条回边挪成 (a, 当前位置)</text>
  <text x="368" y="270" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">整块立刻连通，一分 A 都不花</text>
  <line x1="368" y1="196" x2="368" y2="216" stroke="#4a7a3a" stroke-width="1.7" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- 右：方法 C -->
  <text x="604" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">C：没边可用就摘叶子</text>
  <rect x="498" y="88" width="212" height="118" rx="9" fill="#fff7e2" stroke="#c99a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="604" y="108" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">树 Y：挑一片叶子 ℓ</text>
  <circle cx="560" cy="136" r="11" fill="#ffffff" stroke="#c99a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="560" y="140" text-anchor="middle" font-size="10" fill="#8a6015" filter="url(#rough2)">ℓ</text>
  <circle cx="620" cy="136" r="11" fill="#ffffff" stroke="#c99a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="620" y="140" text-anchor="middle" font-size="10" fill="#8a6015" filter="url(#rough2)">p</text>
  <circle cx="672" cy="172" r="11" fill="#ffffff" stroke="#c99a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="571" y1="136" x2="609" y2="136" stroke="#c99a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="628" y1="142" x2="664" y2="164" stroke="#c99a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="604" y="196" text-anchor="middle" font-size="10.5" fill="#8a3b37" filter="url(#rough2)">(ℓ,p) 挪成 (p,当前位置)</text>
  <rect x="498" y="222" width="212" height="72" rx="9" fill="#fdeeee" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="604" y="246" text-anchor="middle" font-size="11" fill="#8a3b37" filter="url(#rough2)">Y∖{ℓ} 进来并带回 e−1 条可用边</text>
  <text x="604" y="270" text-anchor="middle" font-size="11" fill="#8a3b37" filter="url(#rough2)">ℓ 记一笔债，最后用可用边接回</text>
  <line x1="604" y1="196" x2="604" y2="216" stroke="#b85450" stroke-width="1.7" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <text x="360" y="352" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">可用边一律按生成树后序消耗（先摘最深的叶子），保证"挪走的边不会带走别的可用边"</text>
  <text x="360" y="378" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">这样每一步的转移都能在 O(1) 均摊时间内完成，整套构造是 O(n + m)</text>
  <text x="360" y="406" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">走法用一棵随时可重建的生成树给出路径，总长度 O(n + m)</text>
</svg>
