<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="867"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="260" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">按位置加权求和：Σ aᵢ·i</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">a₀ 只表示后面有几个数</text>
  <g filter="url(#rough2)"><rect x="180" y="100" width="110" height="44" rx="4" fill="#cfe0f5" fill-opacity="0.45" stroke="#446688" stroke-width="1.4"/></g>
  <text x="235" y="128" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="235" y="168" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">× 1 = 1</text>
  <g filter="url(#rough2)"><rect x="320" y="100" width="110" height="44" rx="4" fill="#f6e3c4" fill-opacity="0.45" stroke="#446688" stroke-width="1.4"/></g>
  <text x="375" y="128" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="375" y="168" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">× 2 = 4</text>
  <g filter="url(#rough2)"><rect x="460" y="100" width="110" height="44" rx="4" fill="#dcecd2" fill-opacity="0.45" stroke="#446688" stroke-width="1.4"/></g>
  <text x="515" y="128" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="515" y="168" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">× 3 = 9</text>
  <g filter="url(#rough2)"><rect x="600" y="100" width="110" height="44" rx="4" fill="#f3d9d6" fill-opacity="0.45" stroke="#446688" stroke-width="1.4"/></g>
  <text x="655" y="128" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="655" y="168" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">× 4 = 16</text>
  <text x="450" y="210" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1 + 4 + 9 + 16 = 30</text>
  <text x="450" y="240" text-anchor="middle" font-size="10.5" fill="#8a2b28" filter="url(#rough2)">菜谱正文是干扰项</text>
</svg>
