<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="29"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="800" height="430" fill="#fafafa"/>

  <text x="400" y="30" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">四组官方样例走查：装不下环就没有可删的环</text>
  <text x="400" y="53" text-anchor="middle" font-size="12.5" fill="#66788c" filter="url(#rough2)">E'' 是“两端在 2-核里度数都 ≥3”的边；rr 是 E'' 子图的回路秩，rr = 0 直接 NO</text>

  <!-- 表头 -->
  <rect x="44" y="72" width="712" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="132" y="94" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">样例</text>
  <text x="286" y="94" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">n, m；r</text>
  <text x="406" y="94" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">|V''|</text>
  <text x="496" y="94" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">|E''|</text>
  <text x="576" y="94" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">rr</text>
  <text x="680" y="94" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">结论</text>

  <!-- 行 1 -->
  <rect x="44" y="110" width="712" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="132" y="132" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">① K₄</text>
  <text x="286" y="132" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">4, 6；r = 3</text>
  <text x="406" y="132" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">4</text>
  <text x="496" y="132" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">6</text>
  <text x="576" y="132" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">3</text>
  <text x="680" y="132" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">YES</text>

  <!-- 行 2 -->
  <rect x="44" y="148" width="712" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="132" y="170" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">② 三角形</text>
  <text x="286" y="170" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">3, 3；r = 1</text>
  <text x="406" y="170" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">0</text>
  <text x="496" y="170" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">0</text>
  <text x="576" y="170" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">0</text>
  <text x="680" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#a14340" filter="url(#rough2)">NO</text>

  <!-- 行 3 -->
  <rect x="44" y="186" width="712" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="132" y="208" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">③ 三个三角形共点</text>
  <text x="286" y="208" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">7, 9；r = 3</text>
  <text x="406" y="208" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">1</text>
  <text x="496" y="208" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">0</text>
  <text x="576" y="208" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">0</text>
  <text x="680" y="208" text-anchor="middle" font-size="13" font-weight="bold" fill="#a14340" filter="url(#rough2)">NO</text>

  <!-- 行 4 -->
  <rect x="44" y="224" width="712" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="132" y="246" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">④ 4-环 + 中心点</text>
  <text x="286" y="246" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">5, 8；r = 4</text>
  <text x="406" y="246" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">5</text>
  <text x="496" y="246" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">8</text>
  <text x="576" y="246" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">4</text>
  <text x="680" y="246" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">YES</text>

  <!-- 说明 -->
  <rect x="44" y="276" width="712" height="128" rx="9" fill="#ffffff" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="60" y="300" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">② 三个点度数都是 2 ⇒ V'' 为空：整个 2-核就是一个环，删掉它所有点都没边了，必然不连通。</text>
  <text x="60" y="324" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">③ 公共点度数为 6，但另外六个点度数都是 2 ⇒ V'' 只有 1 个点、E'' 没有边，rr = 0。</text>
  <text x="60" y="348" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">① 删掉环 1-2-4 后，1-3-2 与 3-4 仍把四个点连成一片 ⇒ YES；可行染色：E₁={2-4}，E₂={1-2,1-4}，E₃=其余三条。</text>
  <text x="60" y="372" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">④ 删掉三角形 1-2-5 后，剩下的 2-3-4-1 与 5-3、5-4 仍连通 ⇒ YES。</text>
  <text x="60" y="394" font-size="12" fill="#a14340" filter="url(#rough2)">注意“图里有环”不等于“有可删的环”：②③ 都有环，但没有任何环能被整条删掉。</text>
</svg>
