<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="83"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="320" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">B：比较的是「数字字符串」本身</text>
  <path d="M 180 42 Q 380 47 580 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="380" y="60" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">Bob 的答案可能带前导零，题面要求逐字符相等才算 OK</text>

  <!-- 三个例子 -->
  <rect x="36" y="80" width="222" height="200" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="147" y="106" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">样本 1</text>
  <text x="147" y="136" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">n = 3310 → 排成 0133 → 1033</text>
  <text x="147" y="166" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">Bob：1033</text>
  <text x="147" y="200" text-anchor="middle" font-size="22" fill="#2f5223" font-family="'Courier New',monospace" filter="url(#rough2)">1033 == 1033</text>
  <text x="147" y="240" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5223" filter="url(#rough2)">OK</text>
  <text x="147" y="264" text-anchor="middle" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">首位非零、其余升序</text>

  <rect x="270" y="80" width="222" height="200" rx="10" fill="#fdeceb" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="381" y="106" text-anchor="middle" font-size="12" font-weight="bold" fill="#8c3a36" filter="url(#rough2)">样本 2</text>
  <text x="381" y="136" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">n = 4 → 只有 "4"</text>
  <text x="381" y="166" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">Bob：5</text>
  <text x="381" y="200" text-anchor="middle" font-size="22" fill="#8c3a36" font-family="'Courier New',monospace" filter="url(#rough2)">"4" != "5"</text>
  <text x="381" y="240" text-anchor="middle" font-size="15" font-weight="bold" fill="#8c3a36" filter="url(#rough2)">WRONG_ANSWER</text>
  <text x="381" y="264" text-anchor="middle" font-size="10.5" fill="#8c3a36" filter="url(#rough2)">数位都不一样</text>

  <rect x="504" y="80" width="220" height="200" rx="10" fill="#fdeceb" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="614" y="106" text-anchor="middle" font-size="12" font-weight="bold" fill="#8c3a36" filter="url(#rough2)">前导零陷阱</text>
  <text x="614" y="136" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">n = 10 → 排成 01 → 10</text>
  <text x="614" y="166" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">Bob：01</text>
  <text x="614" y="200" text-anchor="middle" font-size="22" fill="#8c3a36" font-family="'Courier New',monospace" filter="url(#rough2)">"10" != "01"</text>
  <text x="614" y="240" text-anchor="middle" font-size="15" font-weight="bold" fill="#8c3a36" filter="url(#rough2)">WRONG_ANSWER</text>
  <text x="614" y="264" text-anchor="middle" font-size="10.5" fill="#8c3a36" filter="url(#rough2)">01 是 1，不是 10</text>

  <text x="380" y="304" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">所以不要读成整数再比：读成整数会悄悄丢掉前导零，把错的答案判成对的</text>
</svg>
