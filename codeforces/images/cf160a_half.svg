<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="651"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="280" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">降序取，直到 2·已取 &gt; 总额</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">枚数最少 ⇔ 每枚尽量大</text>
  <g filter="url(#rough2)"><rect x="110" y="96" width="120" height="56" rx="4" fill="#ffffff" fill-opacity="0.55" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="170" y="130" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="170" y="176" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">累计 5</text>
  <g filter="url(#rough2)"><rect x="260" y="96" width="120" height="56" rx="4" fill="#dcecd2" fill-opacity="0.55" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="320" y="130" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="320" y="176" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">累计 9</text>
  <g filter="url(#rough2)"><rect x="410" y="96" width="120" height="56" rx="4" fill="#dcecd2" fill-opacity="0.55" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="470" y="130" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="470" y="176" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">累计 12</text>
  <g filter="url(#rough2)"><rect x="560" y="96" width="120" height="56" rx="4" fill="#dcecd2" fill-opacity="0.55" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="620" y="130" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="620" y="176" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">累计 14</text>
  <text x="450" y="226" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">总额 14，需要 &gt; 7：取 5+4=9 ✓ ⇒ 2 枚</text>
</svg>
