<svg xmlns="http://www.w3.org/2000/svg" width="700" height="420" viewBox="0 0 700 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="989"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="700" height="420" fill="#fafafa"/>
  <text x="350.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">L 形走廊与棺材的临界位置</text>
  <path d="M 112.0 42 Q 350.0 48 588.0 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="350.0" y="406" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">内侧长边过凹角 (0,a)；外角贴地、前端顶远墙</text>
  <path d="M 40 300 L 300 300 L 300 40 M 40 450 L 220 450 M 470 40 L 470 390" stroke="#b8b8b0" stroke-width="1.4" stroke-dasharray="6 5" fill="none" filter="url(#rough2)"/>
  <line x1="40" y1="300" x2="300" y2="300" stroke="#5a5a5a" stroke-width="2.4" filter="url(#rough2)"/>
  <line x1="40" y1="450" x2="300" y2="450" stroke="#5a5a5a" stroke-width="2.4" filter="url(#rough2)"/>
  <line x1="470" y1="40" x2="470" y2="390" stroke="#5a5a5a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="308" y="316" text-anchor="start" font-size="11" fill="#8c2f2c" filter="url(#rough2)">(0,a) 凹角</text>
  <text x="476" y="70" text-anchor="start" font-size="11" fill="#335478" filter="url(#rough2)">x=b</text>
  <text x="60" y="292" text-anchor="start" font-size="11" fill="#555555" filter="url(#rough2)">地面 y=0</text>
  <path d="M 193.9 406.1 L 300.0 300.0 L 406.1 193.9 L 438.6 226.5 L 226.5 438.6 Z" fill="#fbeadb" fill-opacity="0.9" stroke="#d98c40" stroke-width="2" filter="url(#rough2)"/>
  <text x="290.0" y="274.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">棺材 l × w</text>
  <text x="430" y="200" text-anchor="start" font-size="11" fill="#8c2f2c" filter="url(#rough2)">外侧后端角贴地</text>
  <text x="430" y="220" text-anchor="start" font-size="11" fill="#335478" filter="url(#rough2)">外侧前端角 x = b</text>
  <text x="70" y="350" text-anchor="start" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">L(θ) = a/sinθ + b/cosθ − w(cotθ + tanθ)</text>
  <text x="70" y="374" text-anchor="start" font-size="12" fill="#555555" filter="url(#rough2)">θ = 45°、a = b = 2 时：L = 4√2 − 2w</text>
  <text x="70" y="396" text-anchor="start" font-size="12" fill="#555555" filter="url(#rough2)">令 L = l 得 w = (4√2 − l)/2</text>
</svg>
