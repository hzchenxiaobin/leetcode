<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="380" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">事件驱动模拟：一次连打若干页，不必逐秒走</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">只在"有任务到达"或"当前任务打完"这两个时刻才需要重新决策</text>
  <line x1="90" y1="300" x2="820" y2="300" stroke="#8899aa" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="120" y1="292" x2="120" y2="308" stroke="#8899aa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="120" y="330" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">0</text>
  <line x1="260" y1="292" x2="260" y2="308" stroke="#8899aa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="260" y="330" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">1</text>
  <line x1="520" y1="292" x2="520" y2="308" stroke="#8899aa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="520" y="330" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">4</text>
  <line x1="700" y1="292" x2="700" y2="308" stroke="#8899aa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="700" y="330" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">7</text>
  <line x1="800" y1="292" x2="800" y2="308" stroke="#8899aa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="800" y="330" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">8</text>
  <g filter="url(#rough2)"><rect x="120" y="240" width="140" height="44" rx="3" fill="#d7ecd0" fill-opacity="0.7" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="190.0" y="266" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)"></text>
  <g filter="url(#rough2)"><rect x="260" y="240" width="260" height="44" rx="3" fill="#cfe0f0" fill-opacity="0.7" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="390.0" y="266" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">任务3 打 3 页（新到、优先级更高）</text>
  <g filter="url(#rough2)"><rect x="520" y="240" width="180" height="44" rx="3" fill="#f6d9d7" fill-opacity="0.7" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="610.0" y="266" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">任务1 打 3 页</text>
  <g filter="url(#rough2)"><rect x="700" y="240" width="100" height="44" rx="3" fill="#f6e3c4" fill-opacity="0.7" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="750.0" y="266" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)"></text>
  <text x="440" y="120" text-anchor="middle" font-size="13" fill="#3d6b2f" filter="url(#rough2)">每个事件：把堆顶任务打印 min(剩余页数, 下个到达时刻 - 当前时刻) 页</text>
  <text x="440" y="150" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">若打印不完就放回堆（被更高优先级的新任务打断）</text>
  <text x="440" y="182" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">总事件数 O(n)，每次 O(log n)</text>
  <text x="440" y="368" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">样例 1：p₁=4 时，任务 3 在 t=4 结束、任务 1 在 t=7 结束、任务 2 最后在 t=8 结束</text>
</svg>
