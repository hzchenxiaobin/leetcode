<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <filter id="rough3" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
  </defs>

  <rect width="720" height="380" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">割权分解：代价只由「选哪个顶点当顶 t」决定</text>

  <!-- S 区域背景 -->
  <ellipse cx="140" cy="292" rx="105" ry="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="6 4" filter="url(#rough3)"/>
  <text x="48" y="371" font-size="12" fill="#4a7a3a" filter="url(#rough2)">S：k=2 的连通块</text>

  <!-- 边 -->
  <path d="M90 80 L150 160" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M210 80 L150 160" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M150 160 L320 160" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M150 160 L150 255" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M150 255 L85 330" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M150 255 L250 330" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <!-- 边上的割权 -->
  <text x="98" y="122" font-size="14" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="190" y="122" font-size="14" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="238" y="150" font-size="14" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="168" y="212" font-size="14" fill="#b85450" filter="url(#rough2)">3</text>
  <text x="212" y="300" font-size="14" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="78" y="300" font-size="12" fill="#4a7a3a" filter="url(#rough2)">0 内部</text>

  <!-- 顶点 -->
  <circle cx="90" cy="80" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="90" y="85" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">A</text>
  <circle cx="210" cy="80" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="210" y="85" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">B</text>
  <circle cx="150" cy="160" r="15" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="165" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">C</text>
  <circle cx="320" cy="160" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="165" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">D</text>
  <circle cx="150" cy="255" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="150" y="260" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">E</text>
  <circle cx="85" cy="330" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="85" y="335" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">F</text>
  <circle cx="250" cy="330" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="250" y="335" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">G</text>

  <!-- 右栏说明 -->
  <rect x="392" y="56" width="300" height="118" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="408" y="82" font-size="13" fill="#333" filter="url(#rough2)">对任意 t ∈ S：</text>
  <text x="408" y="106" font-size="13" fill="#333" filter="url(#rough2)">cost(S) = Σ 远离 S 一侧的端点数</text>
  <text x="408" y="130" font-size="13" fill="#333" filter="url(#rough2)">（e 取遍不在 S 内部的边）</text>
  <text x="408" y="158" font-size="13" fill="#b85450" filter="url(#rough2)">本图：1+1+1+3+1 = 7</text>

  <rect x="392" y="196" width="300" height="86" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="408" y="222" font-size="13" fill="#333" filter="url(#rough2)">以 t 为根时，每条边贡献</text>
  <text x="408" y="246" font-size="13" fill="#333" filter="url(#rough2)">「子树内端点数」——沿根向下</text>
  <text x="408" y="270" font-size="13" fill="#333" filter="url(#rough2)">单调不增，故贪心取前 k-1 大即可</text>

  <rect x="392" y="300" width="300" height="56" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="408" y="324" font-size="13" fill="#333" filter="url(#rough2)">非斯坦纳边恒为 0 ⇒ 只关心</text>
  <text x="408" y="346" font-size="13" fill="#333" filter="url(#rough2)">s = |斯坦纳树|-1 个割权</text>
</svg>
