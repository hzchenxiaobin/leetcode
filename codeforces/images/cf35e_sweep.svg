<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="281"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="320" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">扫描端点：每段高度 = 覆盖该段的最大高度</text>
  <line x1="60" y1="180" x2="660" y2="180" stroke="#c9ced6" stroke-width="1.6" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="90" y="100" width="170" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" opacity="0.75"/>
    <rect x="210" y="70" width="210" height="110" fill="#eef4ec" stroke="#4a7a3a" stroke-width="1.5" opacity="0.75"/>
    <rect x="470" y="120" width="120" height="60" fill="#fdf3e3" stroke="#d6a040" stroke-width="1.5" opacity="0.75"/>
  </g>
  <g font-size="11.5" fill="#666" filter="url(#rough2)">
    <text x="175" y="94">h=3</text>
    <text x="315" y="64">h=4</text>
    <text x="530" y="114">h=2</text>
  </g>
  <g stroke="#b85450" stroke-width="2.6" fill="none" filter="url(#rough2)">
    <path d="M90,180 L90,100 L210,100 L210,70 L420,70 L420,180"/>
  </g>
  <g font-size="11" fill="#8f3b37" filter="url(#rough2)">
    <text x="90" y="200" text-anchor="middle">l1</text>
    <text x="210" y="200" text-anchor="middle">l2</text>
    <text x="420" y="200" text-anchor="middle">r2</text>
  </g>
  <rect x="70" y="220" width="580" height="84" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="86" y="244" font-size="12.5" fill="#8a6015" filter="url(#rough2)">把所有 l_i、r_i 排序去重，相邻端点之间的高度恒定。</text>
  <text x="86" y="268" font-size="12.5" fill="#8a6015" filter="url(#rough2)">扫描时用大根堆维护"当前仍覆盖"的建筑，堆顶就是段高度。</text>
  <text x="86" y="292" font-size="12.5" fill="#8a6015" filter="url(#rough2)">高度变化处输出两个顶点（同一 x：旧高、新高）。</text>
</svg>
