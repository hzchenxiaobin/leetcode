<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="79"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="760" height="400" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">圆心都在 x 轴上且两两不交 ⇒ 投影区间互不重叠</text>
  <path d="M 152 39 Q 380 45 608 39" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <line x1="40" y1="210" x2="720" y2="210" stroke="#2b2b2b" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="724" y="214" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">x</text>
  <circle cx="120" cy="206" r="40" fill="#dcebfb" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="120" y1="216" x2="120" y2="232" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="120" y="250" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">目标 1</text>
  <text x="120" y="160" text-anchor="middle" font-size="10.5" fill="#6a6a6a" filter="url(#rough2)">[80, 160]</text>
  <circle cx="250" cy="206" r="55" fill="#e9f4ec" stroke="#3f6b4a" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="250" y1="216" x2="250" y2="232" stroke="#3f6b4a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="250" y="250" text-anchor="middle" font-size="11" fill="#3f6b4a" filter="url(#rough2)">目标 2</text>
  <text x="250" y="145" text-anchor="middle" font-size="10.5" fill="#6a6a6a" filter="url(#rough2)">[195, 305]</text>
  <circle cx="420" cy="206" r="35" fill="#fdf3e3" stroke="#8a6015" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="420" y1="216" x2="420" y2="232" stroke="#8a6015" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="420" y="250" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">目标 3</text>
  <text x="420" y="165" text-anchor="middle" font-size="10.5" fill="#6a6a6a" filter="url(#rough2)">[385, 455]</text>
  <circle cx="600" cy="206" r="60" fill="#f7ecef" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="600" y1="216" x2="600" y2="232" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="600" y="250" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">目标 4</text>
  <text x="600" y="140" text-anchor="middle" font-size="10.5" fill="#6a6a6a" filter="url(#rough2)">[540, 660]</text>
  <line x1="300" y1="206" x2="300" y2="60" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="306" y="66" text-anchor="start" font-size="11.5" fill="#b85450" filter="url(#rough2)">某次射击的 x</text>
  <text x="306" y="84" text-anchor="start" font-size="11.5" fill="#b85450" filter="url(#rough2)">二分找到“最后一个左端点 ≤ x”的区间</text>
  <rect x="40" y="268" width="690" height="52" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="56" y="292" text-anchor="start" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">因为区间互不重叠，x 最多落在 1 个区间里（相切时最多 2 个），</text>
  <text x="56" y="312" text-anchor="start" font-size="12" fill="#2f4a66" filter="url(#rough2)">命中判据只需再查 y² ≤ r² − (x − cx)²，每次射击 O(log n)。</text>
  <text x="40" y="350" text-anchor="start" font-size="12" fill="#5b5b5b" filter="url(#rough2)">若改用“对每个靶子扫一遍所有射击”的写法，复杂度是 O(nm) = 2×10⁹，必然超时。</text>
</svg>
