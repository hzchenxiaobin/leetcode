<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="up" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="760" height="400" fill="#fafafa"/>
  <text x="380" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例走查：1 3 3 2，d = 2，每个元素刚好超过前一个</text>

  <!-- 坐标轴 -->
  <line x1="70" y1="340" x2="720" y2="340" stroke="#2b2b2b" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="345" text-anchor="end" font-size="12" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <g font-size="11" fill="#8a8a8a" filter="url(#rough2)">
    <text x="60" y="310" text-anchor="end">2</text>
    <text x="60" y="275" text-anchor="end">4</text>
    <text x="60" y="240" text-anchor="end">6</text>
    <text x="60" y="205" text-anchor="end">8</text>
  </g>
  <g stroke="#e2e2e2" stroke-width="1" stroke-dasharray="4 5" filter="url(#rough2)">
    <line x1="70" y1="305" x2="720" y2="305"/>
    <line x1="70" y1="270" x2="720" y2="270"/>
    <line x1="70" y1="235" x2="720" y2="235"/>
    <line x1="70" y1="200" x2="720" y2="200"/>
  </g>

  <!-- 第 1 列：1 -> 1 -->
  <g filter="url(#rough2)">
    <rect x="100" y="270" width="34" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="138" y="270" width="34" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="117" y="262" text-anchor="middle" font-size="12" fill="#2f4a66">1</text>
    <text x="155" y="262" text-anchor="middle" font-size="12" fill="#2f5223">1</text>
    <text x="136" y="362" text-anchor="middle" font-size="12" fill="#2b2b2b">原 1 → 终 1</text>
    <text x="136" y="382" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223">+0 次</text>
  </g>

  <!-- 第 2 列：3 -> 3 -->
  <g filter="url(#rough2)">
    <rect x="270" y="235" width="34" height="105" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="308" y="235" width="34" height="105" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="287" y="227" text-anchor="middle" font-size="12" fill="#2f4a66">3</text>
    <text x="325" y="227" text-anchor="middle" font-size="12" fill="#2f5223">3</text>
    <text x="306" y="362" text-anchor="middle" font-size="12" fill="#2b2b2b">原 3 → 终 3</text>
    <text x="306" y="382" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223">+0 次</text>
  </g>

  <!-- 第 3 列：3 -> 5 -->
  <g filter="url(#rough2)">
    <rect x="440" y="235" width="34" height="105" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="478" y="192" width="34" height="148" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="457" y="227" text-anchor="middle" font-size="12" fill="#2f4a66">3</text>
    <text x="495" y="184" text-anchor="middle" font-size="12" fill="#2f5223">5</text>
    <line x1="457" y1="230" x2="493" y2="200" stroke="#b85450" stroke-width="1.4" marker-end="url(#up)"/>
    <text x="476" y="362" text-anchor="middle" font-size="12" fill="#2b2b2b">原 3 → 终 5</text>
    <text x="476" y="382" text-anchor="middle" font-size="12" font-weight="bold" fill="#8f3b37">+1 次</text>
  </g>

  <!-- 第 4 列：2 -> 6 -->
  <g filter="url(#rough2)">
    <rect x="610" y="270" width="34" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="648" y="157" width="34" height="183" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="627" y="262" text-anchor="middle" font-size="12" fill="#2f4a66">2</text>
    <text x="665" y="149" text-anchor="middle" font-size="12" fill="#2f5223">6</text>
    <line x1="627" y1="265" x2="663" y2="170" stroke="#b85450" stroke-width="1.4" marker-end="url(#up)"/>
    <text x="646" y="362" text-anchor="middle" font-size="12" fill="#2b2b2b">原 2 → 终 6</text>
    <text x="646" y="382" text-anchor="middle" font-size="12" font-weight="bold" fill="#8f3b37">+2 次</text>
  </g>

  <text x="390" y="66" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">蓝 = 原值，绿 = 处理后的值；每列只需要"刚好大于前一列的绿柱"</text>
</svg>
