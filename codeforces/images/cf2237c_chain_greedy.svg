<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：一次操作让「大值」向右吞并「小值」</text>
  <text x="300" y="46" text-anchor="middle" font-size="11" fill="#888">(x, y) 且 x &gt; y  →  (y, x + y)：左堆拿到 y，右堆变成 x + y</text>

  <rect x="52" y="62" width="496" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="70" y="84" font-size="11" fill="#3a4a66" font-weight="bold">例：相邻两堆 7 与 3</text>
  <rect x="70" y="92" width="54" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="97" y="110" text-anchor="middle" font-size="13" fill="#333">7</text>
  <rect x="130" y="92" width="54" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="157" y="110" text-anchor="middle" font-size="13" fill="#333">3</text>
  <path d="M 194 105 L 228 105" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="238" y="92" width="54" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="265" y="110" text-anchor="middle" font-size="13" fill="#7a5c10">3</text>
  <rect x="298" y="92" width="54" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="325" y="110" text-anchor="middle" font-size="13" fill="#8a3a36">10</text>
  <text x="366" y="110" font-size="10.5" fill="#555">3 + 7 = 10，右堆变重</text>

  <text x="300" y="152" text-anchor="middle" font-size="11.5" fill="#444">于是「大值」可以一路向右走，每走一步就把路过的元素加进自己：这就是一条 <tspan font-weight="bold">链</tspan></text>

  <rect x="52" y="168" width="496" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="70" y="190" font-size="11" fill="#3a5a30" font-weight="bold">数组 1 4 3 2 5：从 4 出发的链</text>
  <rect x="70" y="202" width="46" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="93" y="220" text-anchor="middle" font-size="12" fill="#333">4</text>
  <path d="M 122 215 L 150 215" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="136" y="208" text-anchor="middle" font-size="9.5" fill="#666">+3</text>
  <rect x="156" y="202" width="46" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="179" y="220" text-anchor="middle" font-size="12" fill="#333">7</text>
  <path d="M 208 215 L 236 215" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="222" y="208" text-anchor="middle" font-size="9.5" fill="#666">+2</text>
  <rect x="242" y="202" width="46" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="265" y="220" text-anchor="middle" font-size="12" fill="#333">9</text>
  <path d="M 294 215 L 322 215" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="308" y="208" text-anchor="middle" font-size="9.5" fill="#666">+5</text>
  <rect x="328" y="202" width="52" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="354" y="220" text-anchor="middle" font-size="12" fill="#8a3a36">14</text>
  <text x="70" y="252" font-size="10" fill="#555">链值只增不减，最终停在最右端；答案就是这条链最后的读数 14</text>

  <rect x="52" y="278" width="496" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="70" y="299" font-size="10.5" fill="#7a5c10" font-weight="bold">链什么时候断？</text>
  <text x="70" y="318" font-size="10" fill="#555">当 a_i ≥ 当前链值 c 时，两堆已经有序、不必再吞：直接令 c = a_i，从 a_i 重新起一条链。</text>

  <text x="300" y="362" text-anchor="middle" font-size="10.5" fill="#666">于是整个过程可以压成一次左到右扫描：c 遇到 ≥ c 的元素就重置，否则并入 c</text>
  <text x="300" y="382" text-anchor="middle" font-size="10" fill="#999">数组 1 4 3 2 5 的扫描：1 → 4 → 7 → 9 → 14，答案 14（官方第 6 组样例）</text>
</svg>
