<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="79"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="820" height="470" fill="#fafafa"/>

  <text x="410" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">块内逆序重建：三种情况互斥且完备</text>
  <path d="M 160 40 Q 410 46 650 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 顶部：整块逆序 -->
  <path d="M 470 72 L 120 72" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="300" y="62" text-anchor="middle" font-size="11" fill="#8a2b28" filter="url(#rough2)">从右往左重算：处理 i 时 i+a[i] 一定已经算好</text>

  <rect x="106" y="86" width="368" height="44" rx="8" fill="#f2f2f2" stroke="#999999" stroke-width="1.2" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <rect x="118" y="92" width="62" height="32" rx="6" fill="#ffffff" stroke="#777777" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="149" y="113" text-anchor="middle" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">L</text>
  <rect x="190" y="92" width="62" height="32" rx="6" fill="#ffffff" stroke="#777777" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="221" y="113" text-anchor="middle" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">L+1</text>
  <rect x="262" y="92" width="62" height="32" rx="6" fill="#ffffff" stroke="#777777" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="293" y="113" text-anchor="middle" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">to</text>
  <rect x="334" y="92" width="62" height="32" rx="6" fill="#ffffff" stroke="#777777" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="365" y="113" text-anchor="middle" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">…</text>
  <rect x="406" y="92" width="62" height="32" rx="6" fill="#ffffff" stroke="#777777" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="437" y="113" text-anchor="middle" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">R</text>
  <text x="70" y="201" font-size="15" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">①</text>
  <text x="104" y="166" font-size="11" fill="#555555" filter="url(#rough2)">i + a(i) > N</text>
  <rect x="104" y="174" width="64" height="38" rx="6" fill="#f6d9d7" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="136" y="199" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">i</text>
  <path d="M 172 193 L 236 193" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="242" y="174" width="76" height="38" rx="6" fill="#ffffff" stroke="#b85450" stroke-width="1.3" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="280" y="199" text-anchor="middle" font-size="11" fill="#8a2b28" filter="url(#rough2)">N+1</text>
  <text x="360" y="190" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">nxt[i] = N+1, cnt[i] = 1, lst[i] = i</text>
  <text x="360" y="210" font-size="10.5" fill="#777777" filter="url(#rough2)">跳出整行</text>
  <text x="70" y="293" font-size="15" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">②</text>
  <text x="104" y="258" font-size="11" fill="#555555" filter="url(#rough2)">L ≤ i, i + a(i) > R</text>
  <rect x="96" y="260" width="86" height="50" rx="8" fill="#eef4fb" stroke="#446688" stroke-width="1.2" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <rect x="104" y="266" width="64" height="38" rx="6" fill="#ffffff" stroke="#777777" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="136" y="291" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">i</text>
  <path d="M 172 285 L 236 285" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="242" y="266" width="76" height="38" rx="6" fill="#ffffff" stroke="#777777" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="280" y="291" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">to</text>
  <text x="360" y="282" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">nxt[i] = to, cnt[i] = 1, lst[i] = i</text>
  <text x="360" y="302" font-size="10.5" fill="#777777" filter="url(#rough2)">跳出本块、仍在行内</text>
  <text x="70" y="385" font-size="15" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">③</text>
  <text x="104" y="350" font-size="11" fill="#555555" filter="url(#rough2)">L ≤ i + a(i) ≤ R</text>
  <rect x="96" y="352" width="86" height="50" rx="8" fill="#eef4fb" stroke="#446688" stroke-width="1.2" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <rect x="104" y="358" width="64" height="38" rx="6" fill="#ffffff" stroke="#777777" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="136" y="383" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">i</text>
  <rect x="96" y="352" width="232" height="50" rx="8" fill="#eef4fb" stroke="#446688" stroke-width="1.2" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <path d="M 172 377 L 236 377" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="242" y="358" width="64" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="274" y="383" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">to</text>
  <text x="360" y="374" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">nxt[i] = nxt[to], cnt[i] = cnt[to] + 1, lst[i] = lst[to]</text>
  <text x="360" y="394" font-size="10.5" fill="#777777" filter="url(#rough2)">to 已算好，直接接上</text>
  <text x="40" y="442" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">重建只做一遍倒序扫描，每个位置 O(1)；一次修改最多重算 B 个位置，所以更新是 O(B)。</text>
</svg>
