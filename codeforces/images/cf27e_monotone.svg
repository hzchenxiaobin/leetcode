<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="233"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="760" height="380" fill="#fafafa"/>
  <text x="390" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">大的指数必须配小的质数：e1 ≥ e2 ≥ e3 ≥ …</text>
  <path d="M 120 40 Q 390 46 660 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="100" y="90" width="120" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="160" y="119" text-anchor="middle" font-size="13" fill="#2f5223" filter="url(#rough2)">2^3</text>
  <rect x="250" y="90" width="120" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="310" y="119" text-anchor="middle" font-size="13" fill="#2f5223" filter="url(#rough2)">3^2</text>
  <rect x="400" y="90" width="120" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="460" y="119" text-anchor="middle" font-size="13" fill="#2f5223" filter="url(#rough2)">5^1</text>
  <text x="560" y="119" font-size="12" fill="#2b2b2b" filter="url(#rough2)">360 = 2³·3²·5</text>
  <rect x="100" y="180" width="120" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="160" y="209" text-anchor="middle" font-size="13" fill="#2f5223" filter="url(#rough2)">指数 3</text>
  <rect x="250" y="180" width="120" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="310" y="209" text-anchor="middle" font-size="13" fill="#2f5223" filter="url(#rough2)">指数 2</text>
  <rect x="400" y="180" width="120" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="460" y="209" text-anchor="middle" font-size="13" fill="#2f5223" filter="url(#rough2)">指数 1</text>
  <text x="560" y="209" font-size="12" fill="#2b2b2b" filter="url(#rough2)">d = 4×3×2 = 24</text>
  <text x="70" y="290" font-size="12" fill="#2b2b2b" filter="url(#rough2)">交换论证：p &lt; q 但 e_p &lt; e_q 时，交换两个指数数值变小、约数个数不变。</text>
  <text x="70" y="318" font-size="12" fill="#2b2b2b" filter="url(#rough2)">所以最优解一定非增；同理只用前 k 个质数（第 k+1 个换成第 k 个更小）。</text>
  <text x="70" y="352" font-size="11.5" fill="#8a6015" filter="url(#rough2)">360 = 2³·3²·5 是“24 个约数”的最小解：24 = 4·3·2 对应指数 3,2,1。</text>

</svg>
