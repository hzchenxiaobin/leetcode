<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="37"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="540" fill="#fafafa"/>

  <text x="380" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：区间就是「点 l 到点 r+1 的边」</text>
  <path d="M 158 44 Q 380 51 602 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 边 (1,6)：最外层弧，画在下方 -->
  <path d="M 90 186 Q 340 300 590 186" stroke="#4a7a3a" stroke-width="2"
        fill="none" filter="url(#rough2)"/>
  <text x="340" y="278" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">区间 [1,5] ⇒ 边 (1,6)</text>

  <!-- 边 (3,6)：大弧，画在上方 -->
  <path d="M 290 154 Q 440 80 590 154" stroke="#d6a040" stroke-width="2"
        fill="none" filter="url(#rough2)"/>
  <text x="452" y="88" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">区间 [3,5] ⇒ 边 (3,6)</text>

  <!-- 边 (1,3)：小弧，画在上方 -->
  <path d="M 90 154 Q 190 100 290 154" stroke="#446688" stroke-width="2"
        fill="none" filter="url(#rough2)"/>
  <text x="190" y="110" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">[1,2] ⇒ 边 (1,3)</text>

  <!-- 六个点 -->
  <circle cx="90" cy="170" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="90" y="175" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">1</text>
  <circle cx="190" cy="170" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="190" y="175" text-anchor="middle" font-size="13" font-weight="bold" fill="#a14340" filter="url(#rough2)">2</text>
  <circle cx="290" cy="170" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="290" y="175" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">3</text>
  <circle cx="390" cy="170" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="390" y="175" text-anchor="middle" font-size="13" font-weight="bold" fill="#a14340" filter="url(#rough2)">4</text>
  <circle cx="490" cy="170" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="490" y="175" text-anchor="middle" font-size="13" font-weight="bold" fill="#a14340" filter="url(#rough2)">5</text>
  <circle cx="590" cy="170" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="590" y="175" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">6</text>
  <text x="340" y="214" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">点 1 … n+1 表示位置边界，共 n+1 个点（n = 5）</text>

  <!-- 结论条 -->
  <rect x="40" y="296" width="680" height="64" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="322" text-anchor="middle" font-size="13.5" fill="#8a6015" filter="url(#rough2)">需求图的连通块：{1,3,6}、{2}、{4}、{5} —— 共 C = 4 块</text>
  <text x="380" y="346" text-anchor="middle" font-size="15" font-weight="bold" fill="#a14340" filter="url(#rough2)">答案 = (n + 1) − C = 6 − 4 = 2</text>

  <!-- 下界 -->
  <rect x="40" y="378" width="330" height="146" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="205" y="404" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">下界：一条查询最多合并两块</text>
  <text x="56" y="432" font-size="12" fill="#3c5e2e" filter="url(#rough2)">· 需求 [l,r] 迫使 l 与 r+1 连通</text>
  <text x="56" y="456" font-size="12" fill="#3c5e2e" filter="url(#rough2)">· k 条边最多把 n+1 点分成 n+1−k 块</text>
  <text x="56" y="480" font-size="12" fill="#3c5e2e" filter="url(#rough2)">· 所以 k ≥ (n+1) − C</text>
  <text x="56" y="504" font-size="12" fill="#3c5e2e" filter="url(#rough2)">· C 只由需求边集决定，与顺序无关</text>

  <!-- 上界 -->
  <rect x="390" y="378" width="330" height="146" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="555" y="404" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">上界：块内排序连成递增链</text>
  <text x="406" y="432" font-size="12" fill="#2f4a66" filter="url(#rough2)">· 块内点按编号排成 v₁ &lt; v₂ &lt; … &lt; v_s</text>
  <text x="406" y="456" font-size="12" fill="#2f4a66" filter="url(#rough2)">· 相邻两点之间各查一条，共 s−1 条</text>
  <text x="406" y="480" font-size="12" fill="#2f4a66" filter="url(#rough2)">· 链按编号递增 ⇒ 任何需求都能拼</text>
  <text x="406" y="504" font-size="12" fill="#2f4a66" filter="url(#rough2)">· 总代价 Σ(s−1) = (n+1) − C</text>
</svg>
