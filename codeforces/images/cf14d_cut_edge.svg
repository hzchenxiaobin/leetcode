<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="141"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="440" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">删去一条边，两条路径就分居两侧</text>
  <path d="M 160 44 Q 380 50 600 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 左组件 -->
  <rect x="36" y="70" width="300" height="250" rx="12" fill="#eef4fb" stroke="#a9c0d8" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="186" y="96" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">组件 A（直径 d_A）</text>
  <line x1="80" y1="230" x2="150" y2="150" stroke="#446688" stroke-width="4" filter="url(#rough2)"/>
  <line x1="150" y1="150" x2="220" y2="230" stroke="#446688" stroke-width="4" filter="url(#rough2)"/>
  <circle cx="80" cy="230" r="8" fill="#ffffff" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="150" cy="150" r="8" fill="#ffffff" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="220" cy="230" r="8" fill="#ffffff" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="270" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">路径 P 的长度 ≤ d_A</text>

  <!-- 右组件 -->
  <rect x="424" y="70" width="300" height="250" rx="12" fill="#eef7f0" stroke="#a9c6a9" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="574" y="96" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">组件 B（直径 d_B）</text>
  <line x1="500" y1="230" x2="570" y2="150" stroke="#4a7a3a" stroke-width="4" filter="url(#rough2)"/>
  <line x1="570" y1="150" x2="640" y2="230" stroke="#4a7a3a" stroke-width="4" filter="url(#rough2)"/>
  <circle cx="500" cy="230" r="8" fill="#ffffff" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="570" cy="150" r="8" fill="#ffffff" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="640" cy="230" r="8" fill="#ffffff" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="570" y="270" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">路径 Q 的长度 ≤ d_B</text>

  <!-- 断边 -->
  <line x1="220" y1="230" x2="500" y2="230" stroke="#b85450" stroke-width="3" stroke-dasharray="8 5" filter="url(#rough2)"/>
  <line x1="360" y1="212" x2="360" y2="248" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="360" y="205" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3b36" filter="url(#rough2)">e</text>
  <text x="360" y="268" text-anchor="middle" font-size="11" fill="#8a3b36" filter="url(#rough2)">删去 e</text>

  <!-- 结论 -->
  <rect x="36" y="338" width="688" height="76" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="364" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">任取一对不相交的路径 P、Q：沿 P 到 Q 的最短路走，第一条边 e 就能把二者分开。</text>
  <text x="56" y="390" font-size="12" fill="#7a5a1b" filter="url(#rough2)">于是 |P| ≤ d_A、|Q| ≤ d_B，最大乘积只需在所有断边 e 上取 d_A · d_B 的最大值。</text>
</svg>
