  <circle cx="160.0" cy="96.0" r="17.0" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160.0" y="101.0" text-anchor="middle" font-size="12.0" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="212.0" cy="96.0" r="17.0" fill="#f7efe8" stroke="#8c5a2c" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="212.0" y="101.0" text-anchor="middle" font-size="12.0" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">2</text>
  <circle cx="264.0" cy="96.0" r="17.0" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="264.0" y="101.0" text-anchor="middle" font-size="12.0" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="320.0" y="101.0" text-anchor="start" font-size="11.5" fill="#335478" filter="url(#rough2)">{1,2}  共 3 盏</text>
  <text x="60.0" y="168.0" text-anchor="start" font-size="11.0" fill="#555555" filter="url(#rough2)">第 2 层</text>
  <circle cx="160.0" cy="162.0" r="17.0" fill="#f7efe8" stroke="#8c5a2c" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160.0" y="167.0" text-anchor="middle" font-size="12.0" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="320.0" y="167.0" text-anchor="start" font-size="11.5" fill="#335478" filter="url(#rough2)">{2}  共 1 盏</text>
  <text x="60.0" y="234.0" text-anchor="start" font-size="11.0" fill="#555555" filter="url(#rough2)">第 3 层</text>
