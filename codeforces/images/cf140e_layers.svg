  <text x="320.0" y="233.0" text-anchor="start" font-size="11.5" fill="#335478" filter="url(#rough2)">{1,2}  共 2 盏</text>
  <text x="60.0" y="286.0" text-anchor="start" font-size="11.5" fill="#8c2f2c" filter="url(#rough2)">层内相邻异色，相邻两层的颜色集合不同（{1,2} → {2} → {1,2}）</text>
  <text x="360.0" y="292" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">l = (3, 1, 2)，m = 2，答案 8</text>
