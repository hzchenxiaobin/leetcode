<svg xmlns="http://www.w3.org/2000/svg" width="740" height="340" viewBox="0 0 740 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1119"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="740" height="340" fill="#fafafa"/>
  <text x="370.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">移动 ↔ 支配集</text>
  <path d="M 118.4 42 Q 370.0 48 621.6 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="370.0" y="326" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">每只蜘蛛落进 T；T 必须支配全棋盘</text>
  <rect x="170" y="90" width="70" height="70" rx="7" fill="#f4f4f1" stroke="#c8c8c0" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="205.0" y="131.0" text-anchor="middle" font-size="11" fill="#777777" filter="url(#rough2)">1,1</text>
  <rect x="240" y="90" width="70" height="70" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="275.0" y="131.0" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">1,2</text>
  <rect x="310" y="90" width="70" height="70" rx="7" fill="#f4f4f1" stroke="#c8c8c0" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="345.0" y="131.0" text-anchor="middle" font-size="11" fill="#777777" filter="url(#rough2)">1,3</text>
  <rect x="170" y="160" width="70" height="70" rx="7" fill="#f4f4f1" stroke="#c8c8c0" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="205.0" y="201.0" text-anchor="middle" font-size="11" fill="#777777" filter="url(#rough2)">2,1</text>
  <rect x="240" y="160" width="70" height="70" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="275.0" y="201.0" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">2,2</text>
  <rect x="310" y="160" width="70" height="70" rx="7" fill="#f4f4f1" stroke="#c8c8c0" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="345.0" y="201.0" text-anchor="middle" font-size="11" fill="#777777" filter="url(#rough2)">2,3</text>
  <line x1="205.0" y1="125.0" x2="302.0" y2="125.0" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <line x1="345.0" y1="125.0" x2="248.0" y2="125.0" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <line x1="205.0" y1="195.0" x2="302.0" y2="195.0" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <line x1="345.0" y1="195.0" x2="248.0" y2="195.0" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="560" y="130" text-anchor="start" font-size="12" fill="#8c2f2c" filter="url(#rough2)">6 只蜘蛛 → 2 个落点</text>
  <text x="560" y="160" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">空格 = 6 − 2 = 4</text>
  <text x="560" y="195" text-anchor="start" font-size="12" fill="#335478" filter="url(#rough2)">一般地：最大空格 = N − γ</text>
  <text x="370" y="300" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">γ = 最小支配集大小（自己或四邻居在 T 中）</text>
</svg>
