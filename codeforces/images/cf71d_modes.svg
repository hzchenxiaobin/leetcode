<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>

  <rect width="760" height="360" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">一个 3×3 方块合法的两种形态</text>

  <g font-size="13.5" fill="#33475c" text-anchor="middle" filter="url(#rough2)">
    <text x="106" y="56">① 九张同花色</text>
    <text x="366" y="56">② 点数两两不同</text>
    <text x="626" y="56">③ 两者都不满足</text>
  </g>

  <!-- 棋盘 1：全红桃 -->
  <g filter="url(#rough2)" font-size="13.5" fill="#2b3a4a" text-anchor="middle">
    <rect x="40" y="68" width="132" height="132" fill="#fdf3f2" stroke="#b85450" stroke-width="1.6"/>
    <line x1="84" y1="68" x2="84" y2="200" stroke="#b85450" stroke-width="1.2"/>
    <line x1="128" y1="68" x2="128" y2="200" stroke="#b85450" stroke-width="1.2"/>
    <line x1="40" y1="112" x2="172" y2="112" stroke="#b85450" stroke-width="1.2"/>
    <line x1="40" y1="156" x2="172" y2="156" stroke="#b85450" stroke-width="1.2"/>
    <text x="62" y="96">2H</text>
    <text x="106" y="96">5H</text>
    <text x="150" y="96">9H</text>
    <text x="62" y="140">JH</text>
    <text x="106" y="140">QH</text>
    <text x="150" y="140">3H</text>
    <text x="62" y="184">7H</text>
    <text x="106" y="184">AH</text>
    <text x="150" y="184">4H</text>
  </g>
  <text x="106" y="230" text-anchor="middle" font-size="12" fill="#7a2f2c" filter="url(#rough2)">九张全是红桃 ✓</text>

  <!-- 棋盘 2：点数互异 -->
  <g filter="url(#rough2)" font-size="13.5" fill="#2b3a4a" text-anchor="middle">
    <rect x="300" y="68" width="132" height="132" fill="#eef4fb" stroke="#446688" stroke-width="1.6"/>
    <line x1="344" y1="68" x2="344" y2="200" stroke="#446688" stroke-width="1.2"/>
    <line x1="388" y1="68" x2="388" y2="200" stroke="#446688" stroke-width="1.2"/>
    <line x1="300" y1="112" x2="432" y2="112" stroke="#446688" stroke-width="1.2"/>
    <line x1="300" y1="156" x2="432" y2="156" stroke="#446688" stroke-width="1.2"/>
    <text x="322" y="96">2C</text>
    <text x="366" y="96">3D</text>
    <text x="410" y="96">4H</text>
    <text x="322" y="140">5S</text>
    <text x="366" y="140">6C</text>
    <text x="410" y="140">7D</text>
    <text x="322" y="184">8H</text>
    <text x="366" y="184">9S</text>
    <text x="410" y="184">TC</text>
  </g>
  <text x="366" y="230" text-anchor="middle" font-size="12" fill="#33475c" filter="url(#rough2)">点数 2 到 T 各一次 ✓</text>

  <!-- 棋盘 3：不合法 -->
  <g filter="url(#rough2)" font-size="13.5" fill="#6b6b66" text-anchor="middle">
    <rect x="560" y="68" width="132" height="132" fill="#f2f2f2" stroke="#a8a8a2" stroke-width="1.6"/>
    <line x1="604" y1="68" x2="604" y2="200" stroke="#a8a8a2" stroke-width="1.2"/>
    <line x1="648" y1="68" x2="648" y2="200" stroke="#a8a8a2" stroke-width="1.2"/>
    <line x1="560" y1="112" x2="692" y2="112" stroke="#a8a8a2" stroke-width="1.2"/>
    <line x1="560" y1="156" x2="692" y2="156" stroke="#a8a8a2" stroke-width="1.2"/>
    <text x="582" y="96">2C</text>
    <text x="626" y="96">2D</text>
    <text x="670" y="96">9H</text>
    <text x="582" y="140">5S</text>
    <text x="626" y="140">KC</text>
    <text x="670" y="140">7D</text>
    <text x="582" y="184">8H</text>
    <text x="626" y="184">9S</text>
    <text x="670" y="184">TC</text>
  </g>
  <text x="626" y="230" text-anchor="middle" font-size="12" fill="#6b6b66" filter="url(#rough2)">2、9 重复且花色不齐 ✗</text>

  <path d="M40 252 Q 380 262 720 252" stroke="#c9c2b6" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="380" y="288" text-anchor="middle" font-size="13" fill="#4a4a4a" filter="url(#rough2)">合法 ⇔ 同花色 或 点数两两不同（满足其一即可）</text>
  <text x="380" y="320" text-anchor="middle" font-size="12.5" fill="#33475c" filter="url(#rough2)">方块里有王牌时，就按这两种形态反推每张王牌能填哪些牌</text>
</svg>
