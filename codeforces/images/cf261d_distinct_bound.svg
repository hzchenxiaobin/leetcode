<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar4" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="420" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">副本次数够多时，每个不同值各取一次就能凑满 c</text>
  <path d="M 96 42 Q 360 48 624 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <text x="60" y="72" font-size="13" fill="#333" filter="url(#rough2)">b = (3, 1, 2)，不同值 c = 3；t = 3 个副本，a 长 9</text>

  <!-- 三个副本 -->
  <g font-size="11.5" fill="#556" filter="url(#rough2)">
    <text x="60" y="102">副本 1</text>
    <text x="60" y="162">副本 2</text>
    <text x="60" y="222">副本 3</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="120" y="84" width="64" height="48" rx="6" fill="#f2f2f2" stroke="#999" stroke-width="1.3"/>
    <rect x="190" y="84" width="64" height="48" rx="6" fill="#f2f2f2" stroke="#999" stroke-width="1.3"/>
    <rect x="260" y="84" width="64" height="48" rx="6" fill="#f2f2f2" stroke="#999" stroke-width="1.3"/>

    <rect x="120" y="144" width="64" height="48" rx="6" fill="#f2f2f2" stroke="#999" stroke-width="1.3"/>
    <rect x="190" y="144" width="64" height="48" rx="6" fill="#f2f2f2" stroke="#999" stroke-width="1.3"/>
    <rect x="260" y="144" width="64" height="48" rx="6" fill="#f2f2f2" stroke="#999" stroke-width="1.3"/>

    <rect x="120" y="204" width="64" height="48" rx="6" fill="#f2f2f2" stroke="#999" stroke-width="1.3"/>
    <rect x="190" y="204" width="64" height="48" rx="6" fill="#f2f2f2" stroke="#999" stroke-width="1.3"/>
    <rect x="260" y="204" width="64" height="48" rx="6" fill="#f2f2f2" stroke="#999" stroke-width="1.3"/>
  </g>
  <g font-size="17" text-anchor="middle" fill="#333" filter="url(#rough2)">
    <text x="152" y="116">3</text><text x="222" y="116">1</text><text x="292" y="116">2</text>
    <text x="152" y="176">3</text><text x="222" y="176">1</text><text x="292" y="176">2</text>
    <text x="152" y="236">3</text><text x="222" y="236">1</text><text x="292" y="236">2</text>
  </g>

  <!-- 选中：值 1 取副本 1，值 2 取副本 2，值 3 取副本 3 -->
  <g filter="url(#rough2)">
    <rect x="190" y="84" width="64" height="48" rx="6" fill="#e8f4e0" stroke="#4a7a3a" stroke-width="2.6"/>
    <rect x="260" y="144" width="64" height="48" rx="6" fill="#e8f4e0" stroke="#4a7a3a" stroke-width="2.6"/>
    <rect x="120" y="204" width="64" height="48" rx="6" fill="#e8f4e0" stroke="#4a7a3a" stroke-width="2.6"/>
  </g>
  <g font-size="17" text-anchor="middle" fill="#2f5223" font-weight="bold" filter="url(#rough2)">
    <text x="222" y="116">1</text>
    <text x="292" y="176">2</text>
    <text x="152" y="236">3</text>
  </g>

  <!-- 箭头 -->
  <path d="M 224 134 L 264 142" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#ar4)" filter="url(#rough2)"/>
  <path d="M 296 194 L 176 202" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#ar4)" filter="url(#rough2)"/>

  <!-- 结论 -->
  <g filter="url(#rough2)">
    <rect x="380" y="84" width="290" height="168" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.3"/>
  </g>
  <g font-size="12" fill="#22314a" filter="url(#rough2)">
    <text x="396" y="108">上界：严格上升子序列取值互不相同，</text>
    <text x="396" y="128">而 a 只有 b 里的 c 种值，故 LIS ≤ c。</text>
    <text x="396" y="156">下界（t ≥ c）：把不同值排成</text>
    <text x="396" y="176">v₁ &lt; … &lt; v_c，让 v_j 取第 j 个</text>
    <text x="396" y="196">副本里的那一次出现。</text>
    <text x="396" y="220">副本下标递增 ⇒ 位置递增，长度 = c。</text>
    <text x="396" y="244">两个方向夹住，答案就是 c。</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="286" width="600" height="50" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="360" y="316" text-anchor="middle" font-size="14" fill="#22314a" filter="url(#rough2)">
    t ≥ c 时答案恒为 c：既不用展开 n×t，也不用管 t 有多大（t 可达 10⁹）
  </text>

  <text x="60" y="368" font-size="12.5" fill="#a04a46" filter="url(#rough2)">
    只有 t &lt; c 时才需要真的展开——此时 n×t &lt; n×c ≤ n×maxb ≤ 2×10⁷，规模受控。
  </text>
  <text x="60" y="392" font-size="12.5" fill="#333" filter="url(#rough2)">
    （样例第三组：b = (2,3,1)，t = 2 &lt; c = 3，展开后 LIS = 3，见下一张图。）
  </text>
</svg>
