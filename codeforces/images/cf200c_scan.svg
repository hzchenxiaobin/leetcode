<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="340" fill="#fafafa"/>
  <text x="360.0" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">200C：按 (d, Y) 字典序扫描</text>
  <path d="M 144.00 46 Q 360.0 52 576.00 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="72" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">搜索顺序：外层 d = X-Y 从 1 递增（第一关键字），内层 Y 从 0 递增（第二关键字）。</text>
  <text x="60" y="92" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">命中即停 —— 保证 X-Y 最小；同一 d 内先命中的 Y 最小。</text>
  <text x="60" y="122" text-anchor="start" font-size="10.5" fill="#33506e" font-weight="bold" filter="url(#rough2)">d = X - Y</text>
  <text x="60" y="200" text-anchor="start" font-size="10.5" fill="#33506e" font-weight="bold" filter="url(#rough2)">Y ↑</text>
  <rect x="150" y="130" width="52" height="30" rx="4" fill="#f2f2f2" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
