  <text x="280.0" y="122" text-anchor="middle" font-size="10" fill="#2f5b34" filter="url(#rough2)">↑ 命中</text>
  <rect x="60" y="280" width="620" height="44" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="298" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">固定 d 时：BERLAND 的净胜球 = 原值+d、对手的净胜球 = 原值-d，都与 Y 无关；Y 只影响进球数。</text>
