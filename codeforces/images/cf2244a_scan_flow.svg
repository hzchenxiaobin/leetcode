<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="520" fill="#fafafa" filter="url(#rough2)"/>

  <text x="280" y="34" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">
    一次线性扫描：只记最长连续 # 段
  </text>

  <rect x="170" y="52" width="220" height="40" rx="8" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="78" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    读入 t，循环 t 组测试
  </text>

  <path d="M 280 92 L 280 118" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="118" width="260" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="138" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    读入 n 与 s，令 cur = 0、best = 0
  </text>
  <text x="280" y="156" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">
    cur：当前连续 # 的长度　best：历史最长
  </text>

  <path d="M 280 164 L 280 190" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="190" width="220" height="40" rx="8" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="216" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    从左到右扫描 s 的每个字符
  </text>

  <path d="M 280 230 L 280 256" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,256 392,300 280,344 168,300" fill="#fff8e1" stroke="#d6a040"
           stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="306" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    当前字符是 # ？
  </text>

  <path d="M 168 300 L 120 300 L 120 350" stroke="#4a7a3a" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 392 300 L 440 300 L 440 350" stroke="#b85450" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="108" y="292" text-anchor="end" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <text x="452" y="292" text-anchor="start" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="20" y="350" width="200" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="371" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    cur = cur + 1
  </text>
  <text x="120" y="390" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    best = max(best, cur)
  </text>

  <rect x="340" y="350" width="200" height="52" rx="8" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="440" y="371" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    cur = 0
  </text>
  <text x="440" y="390" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    一条线段到此结束
  </text>

  <path d="M 120 402 L 120 420 L 280 420" stroke="#666" stroke-width="1.6" fill="none"
        filter="url(#rough2)"/>
  <path d="M 440 402 L 440 420 L 280 420" stroke="#666" stroke-width="1.6" fill="none"
        filter="url(#rough2)"/>
  <path d="M 280 420 L 280 442" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="442" width="280" height="44" rx="8" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="470" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">
    本组答案 = (best + 1) / 2
  </text>

  <text x="280" y="508" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">
    best 在遇到 # 的当下就更新，所以字符串末尾的线段也不会被漏掉
  </text>
</svg>
