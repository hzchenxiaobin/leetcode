<svg xmlns="http://www.w3.org/2000/svg" width="760" height="366" viewBox="0 0 760 366"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c9801f"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a8524a"/>
    </marker>
  </defs>
  <rect width="760" height="366" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">「Loves」⟺ 花瓣总数是奇数</text>
  <text x="380.0" y="60.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">从「Loves」开始交替念，第 1、3、5… 片花瓣落在「Loves」上</text>
  <rect x="310.0" y="78.0" width="140.0" height="42.0" fill="#fdf3e3" stroke="#c9801f" stroke-width="2.0" filter="url(#rough2)"/>
  <text x="380.0" y="104.4" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">总和 S</text>
  <path d="M 360.0 120.0 L 160.0 158.0" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 380.0 120.0 L 380.0 158.0" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 400.0 120.0 L 600.0 158.0" stroke="#a8524a" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="40.0" y="160.0" width="200.0" height="108.0" rx="10" fill="#f7f9fc" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="140.0" y="186.0" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">S 是奇数</text>
  <text x="140.0" y="214.0" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">直接取全部花朵</text>
  <text x="140.0" y="240.0" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">答案 = S</text>
  <rect x="280.0" y="160.0" width="200.0" height="108.0" rx="10" fill="#f4f9f2" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380.0" y="186.0" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">S 偶 + 有奇数花瓣</text>
  <text x="380.0" y="214.0" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">去掉最小的那朵奇数</text>
  <text x="380.0" y="240.0" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">答案 = S − minOdd</text>
  <rect x="520.0" y="160.0" width="200.0" height="108.0" rx="10" fill="#fbeeee" stroke="#a8524a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="620.0" y="186.0" text-anchor="middle" font-size="12.5" fill="#a8524a" font-weight="bold" filter="url(#rough2)">S 偶 + 全是偶数</text>
  <text x="620.0" y="214.0" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">任何子集和都是偶数</text>
  <text x="620.0" y="240.0" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">答案 = 0</text>
  <rect x="34.0" y="288.0" width="692.0" height="64.0" rx="8" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.4" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="48.0" y="312.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">为什么只去掉一朵：若 S 为偶数且有奇数花瓣，奇数花瓣至少有 2 朵；</text>
  <text x="48.0" y="336.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">去掉一朵最小的奇数，剩下的花非空，且 S − 最小奇数 是最大的可行奇数。</text>
</svg>
