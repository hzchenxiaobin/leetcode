<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="311"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="380" fill="#fafafa"/>
  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两半分放：h 与 h+1 放在不相邻的格子上</text>
  <path d="M 140 40 Q 380 46 620 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="100" y="90" width="120" height="80" fill="#eef4fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="220" y="90" width="120" height="80" fill="#fbe3c8" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="340" y="90" width="120" height="80" fill="#eef4fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="460" y="90" width="120" height="80" fill="#fbe3c8" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="100" y="170" width="120" height="80" fill="#fbe3c8" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="220" y="170" width="120" height="80" fill="#eef4fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="340" y="170" width="120" height="80" fill="#fbe3c8" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="460" y="170" width="120" height="80" fill="#eef4fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="100" y="292" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">白格放 1..h，黑格放 h+1..N</text>
  <text x="100" y="322" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">只有 h 与 h+1 相邻才会差 1，所以把它们分开</text>
  <text x="100" y="356" font-size="12" fill="#8a6015" filter="url(#rough2)">相邻格一黑一白 → 差 ≥ 2（在 h/h+1 分开后） → 方案合法。</text>

</svg>
