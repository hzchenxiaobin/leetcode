<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">一次遍历定答案：先算出必须被吃掉的张数 K</text>
  <path d="M 132 40 Q 360 47 600 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <rect x="196" y="56" width="330" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="361" y="76" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">读入 n 与 a[1..n]，累加总和 S</text>
  <text x="361" y="93" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">（多测：每组都要重新清空计数桶）</text>

  <path d="M 361 102 L 361 128" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="196" y="130" width="330" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="361" y="150" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">统计出现次数，取众数：值 v，频率 f</text>
  <text x="361" y="167" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">并列时不影响结果（此时 K 必为 0）</text>

  <path d="M 361 176 L 361 202" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="361,206 505,254 361,302 217,254" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="361" y="250" text-anchor="middle" font-size="14" fill="#8a6320" filter="url(#rough2)">2f ≤ n + 2 ?</text>
  <text x="361" y="269" text-anchor="middle" font-size="11" fill="#8a6320" filter="url(#rough2)">即 f ≤ (n−f) + 2</text>

  <path d="M 217 254 Q 168 282 150 316" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="286" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">成立</text>

  <path d="M 505 254 Q 556 282 574 316" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="556" y="286" font-size="12.5" fill="#a14340" filter="url(#rough2)">不成立</text>

  <rect x="40" y="322" width="240" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="344" text-anchor="middle" font-size="13" fill="#3c5e2e" filter="url(#rough2)">K = 0，无需牺牲任何牌</text>
  <text x="160" y="366" text-anchor="middle" font-size="14" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">答案 = S</text>

  <rect x="440" y="322" width="240" height="60" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="560" y="344" text-anchor="middle" font-size="13" fill="#a14340" filter="url(#rough2)">K = 2f − n − 2 = f − (r + 2)</text>
  <text x="560" y="366" text-anchor="middle" font-size="14" font-weight="bold" fill="#a14340" filter="url(#rough2)">答案 = S − K · v</text>

  <path d="M 160 382 Q 360 400 560 382" stroke="#c9d3dc" stroke-width="1.1" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <text x="360" y="416" text-anchor="middle" font-size="12" fill="#66788c" filter="url(#rough2)">两组分支可以合并成一行：答案 = S − max(0, 2f − n − 2) · v</text>
</svg>
