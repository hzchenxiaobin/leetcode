<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="430" fill="#fafafa"/>

  <text x="380" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：答案同时被「奶酪富余量」和「香肠总数」卡住</text>
  <path d="M 122 46 Q 380 53 638 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 单块三明治示意：香肠片 -->
  <circle cx="98" cy="120" r="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="152" cy="120" r="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="206" cy="120" r="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="152" y="164" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">s_i 片香肠（每块 ≥ 1）</text>

  <path d="M 234 120 L 262 120" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 奶酪片 -->
  <rect x="272" y="98" width="42" height="44" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="320" y="98" width="42" height="44" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="368" y="98" width="42" height="44" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="416" y="98" width="42" height="44" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="365" y="164" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">c_i 片奶酪（必须更多）</text>

  <text x="482" y="112" font-size="13" fill="#2b2b2b" filter="url(#rough2)">每块三明治都必须满足</text>
  <text x="482" y="140" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">c_i &gt; s_i ，即 c_i − s_i ≥ 1</text>

  <!-- 上界一 -->
  <rect x="32" y="184" width="340" height="132" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="202" y="210" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">上界一：奶酪富余量</text>
  <text x="50" y="238" font-size="12" fill="#2f4a66" filter="url(#rough2)">把每块的差加起来：a − b = Σ(c_i − s_i)</text>
  <text x="50" y="262" font-size="12" fill="#2f4a66" filter="url(#rough2)">每块的差都 ≥ 1，共 k 块 ⇒ a − b ≥ k</text>
  <text x="50" y="288" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">所以 k ≤ a − b</text>
  <text x="50" y="308" font-size="11.5" fill="#446688" filter="url(#rough2)">奶酪不够多，就撑不起 k 块三明治</text>

  <!-- 上界二 -->
  <rect x="388" y="184" width="340" height="132" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="558" y="210" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">上界二：香肠总数</text>
  <text x="406" y="238" font-size="12" fill="#3c5e2e" filter="url(#rough2)">每块至少要 1 片香肠：b = Σ s_i</text>
  <text x="406" y="262" font-size="12" fill="#3c5e2e" filter="url(#rough2)">每块 s_i ≥ 1，共 k 块 ⇒ b ≥ k</text>
  <text x="406" y="288" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">所以 k ≤ b</text>
  <text x="406" y="308" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">香肠只够分给 b 块，块数上不去</text>

  <!-- 结论条 -->
  <rect x="32" y="330" width="696" height="86" rx="9" fill="#ffffff" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="356" text-anchor="middle" font-size="14" font-weight="bold" fill="#a14340" filter="url(#rough2)">两条上界取较小者：k = min(a − b, b)，前提 a &gt; b，否则 −1</text>
  <text x="380" y="380" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">这个上界能构造达到：每块先放 1 片香肠 + 2 片奶酪，</text>
  <text x="380" y="402" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">剩下的 b − k 片香肠、a − 2k 片奶酪全部堆到第 1 块</text>
</svg>
