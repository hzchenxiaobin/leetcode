<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 490"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="19"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="490" fill="#fafafa" filter="url(#rough2)"/>

  <text x="380" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">样例 1：初值 {0:3, 1:2, 2:2, 4:1}，N = 8</text>

  <text x="52" y="58" font-size="14" fill="#3a5a2a" filter="url(#rough2)">check(4) = 可行</text>
  <rect x="40" y="66" width="600" height="126" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="46" y="92" font-size="12.5" fill="#2f4a20" filter="url(#rough2)">j</text>
  <text x="134" y="92" font-size="12.5" fill="#2f4a20" filter="url(#rough2)">c_j</text>
  <text x="222" y="92" font-size="12.5" fill="#2f4a20" filter="url(#rough2)">S（上层）</text>
  <text x="318" y="92" font-size="12.5" fill="#2f4a20" filter="url(#rough2)">d = 1+S</text>
  <text x="412" y="92" font-size="12.5" fill="#2f4a20" filter="url(#rough2)">m_j</text>
  <text x="496" y="92" font-size="12.5" fill="#2f4a20" filter="url(#rough2)">e_j</text>
  <text x="576" y="92" font-size="12.5" fill="#2f4a20" filter="url(#rough2)">S′</text>
  <path d="M44,100 L636,100" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>

  <text x="46" y="124" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="134" y="124" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="222" y="124" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="318" y="124" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="412" y="124" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="496" y="124" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="576" y="124" font-size="13" fill="#333" filter="url(#rough2)">0</text>

  <text x="46" y="154" font-size="13" fill="#b85450" filter="url(#rough2)">3</text>
  <text x="134" y="154" font-size="13" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="222" y="154" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="318" y="154" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="412" y="154" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="496" y="154" font-size="13" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="576" y="154" font-size="13" fill="#b85450" filter="url(#rough2)">1</text>

  <text x="46" y="184" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="134" y="184" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="222" y="184" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="318" y="184" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="412" y="184" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="496" y="184" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="576" y="184" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <text x="652" y="146" font-size="11.5" fill="#b85450" filter="url(#rough2)">3 缺席</text>
  <text x="652" y="164" font-size="11.5" fill="#b85450" filter="url(#rough2)">S: 0→1</text>

  <text x="52" y="216" font-size="13.5" fill="#3a5a2a" filter="url(#rough2)">叶子 = 2×(1+1) + (1+0+2) = 7 ≤ 8 ✓</text>

  <text x="52" y="252" font-size="14" fill="#8a2f2b" filter="url(#rough2)">check(5) = 不可行</text>
  <rect x="40" y="260" width="600" height="152" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="46" y="284" font-size="12.5" fill="#6a2020" filter="url(#rough2)">j</text>
  <text x="134" y="284" font-size="12.5" fill="#6a2020" filter="url(#rough2)">c_j</text>
  <text x="222" y="284" font-size="12.5" fill="#6a2020" filter="url(#rough2)">S（上层）</text>
  <text x="318" y="284" font-size="12.5" fill="#6a2020" filter="url(#rough2)">d = 1+S</text>
  <text x="412" y="284" font-size="12.5" fill="#6a2020" filter="url(#rough2)">m_j</text>
  <text x="496" y="284" font-size="12.5" fill="#6a2020" filter="url(#rough2)">e_j</text>
  <text x="576" y="284" font-size="12.5" fill="#6a2020" filter="url(#rough2)">S′</text>
  <path d="M44,292 L636,292" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>

  <text x="46" y="314" font-size="13" fill="#b85450" filter="url(#rough2)">5</text>
  <text x="134" y="314" font-size="13" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="222" y="314" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="318" y="314" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="412" y="314" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="496" y="314" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="576" y="314" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <text x="46" y="344" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="134" y="344" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="222" y="344" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="318" y="344" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="412" y="344" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="496" y="344" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="576" y="344" font-size="13" fill="#333" filter="url(#rough2)">2</text>

  <text x="46" y="374" font-size="13" fill="#b85450" filter="url(#rough2)">3</text>
  <text x="134" y="374" font-size="13" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="222" y="374" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="318" y="374" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="412" y="374" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="496" y="374" font-size="13" fill="#b85450" filter="url(#rough2)">3</text>
  <text x="576" y="374" font-size="13" fill="#b85450" filter="url(#rough2)">5</text>

  <text x="46" y="402" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="134" y="402" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="222" y="402" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="318" y="402" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <text x="412" y="402" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="496" y="402" font-size="13" fill="#b85450" filter="url(#rough2)">4</text>
  <text x="576" y="402" font-size="13" fill="#b85450" filter="url(#rough2)">9</text>

  <text x="652" y="356" font-size="11.5" fill="#b85450" filter="url(#rough2)">两处缺席</text>
  <text x="652" y="374" font-size="11.5" fill="#b85450" filter="url(#rough2)">S 翻倍两次</text>

  <text x="52" y="434" font-size="13.5" fill="#8a2f2b" filter="url(#rough2)">叶子 = 2×(1+9) + (0+1+0+2) = 23 &gt; 8 ✗</text>

  <rect x="60" y="446" width="640" height="36" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="469" text-anchor="middle" font-size="13" fill="#2c4a66" filter="url(#rough2)">L = 4 ⇒ 答案 = max(4, L+1) = 5：{0,1,2}→3 得 {0,0,1,2,3,4}，再整体 →5</text>
</svg>
