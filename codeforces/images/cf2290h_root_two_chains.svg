<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough3" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
  </defs>

  <rect width="800" height="460" fill="#fafafa"/>

  <text x="400" y="28" text-anchor="middle" font-size="17.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">覆盖集 = 从首都向下的两条链，未覆盖的才是代价</text>
  <path d="M 186 38 Q 400 45 614 38" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <text x="40" y="62" font-size="11.5" fill="#446688" filter="url(#rough2)">① 两条链必须起步于根的两个不同儿子（否则路径不合法或没用到根）</text>
  <text x="40" y="80" font-size="11.5" fill="#66788c" filter="url(#rough2)">② 未覆盖 = 没选的儿子整棵子树 + 链上节点「除重儿子外」的子树</text>

  <!-- 橙色：整棵未覆盖的第三棵子树 -->
  <ellipse cx="400" cy="240" rx="82" ry="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"
           stroke-dasharray="7 4" filter="url(#rough3)"/>

  <!-- 粉色：链上节点的「非重儿子」子树 -->
  <circle cx="104" cy="286" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="104" y="291" text-anchor="middle" font-size="11" fill="#a14340" filter="url(#rough2)">s₁</text>
  <circle cx="696" cy="286" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="696" y="291" text-anchor="middle" font-size="11" fill="#a14340" filter="url(#rough2)">s₂</text>

  <!-- 灰边 -->
  <line x1="400" y1="120" x2="400" y2="196" stroke="#7a7a7a" stroke-width="1.7" filter="url(#rough2)"/>
  <line x1="400" y1="196" x2="352" y2="286" stroke="#7a7a7a" stroke-width="1.7" filter="url(#rough2)"/>
  <line x1="400" y1="196" x2="448" y2="286" stroke="#7a7a7a" stroke-width="1.7" filter="url(#rough2)"/>
  <line x1="200" y1="196" x2="104" y2="286" stroke="#7a7a7a" stroke-width="1.7" filter="url(#rough2)"/>
  <line x1="600" y1="196" x2="696" y2="286" stroke="#7a7a7a" stroke-width="1.7" filter="url(#rough2)"/>

  <!-- 蓝边：两条重链 -->
  <line x1="400" y1="120" x2="200" y2="196" stroke="#446688" stroke-width="3" filter="url(#rough2)"/>
  <line x1="200" y1="196" x2="200" y2="286" stroke="#446688" stroke-width="3" filter="url(#rough2)"/>
  <line x1="200" y1="286" x2="200" y2="372" stroke="#446688" stroke-width="3" filter="url(#rough2)"/>
  <line x1="400" y1="120" x2="600" y2="196" stroke="#446688" stroke-width="3" filter="url(#rough2)"/>
  <line x1="600" y1="196" x2="600" y2="286" stroke="#446688" stroke-width="3" filter="url(#rough2)"/>
  <line x1="600" y1="286" x2="600" y2="372" stroke="#446688" stroke-width="3" filter="url(#rough2)"/>

  <!-- 节点 -->
  <circle cx="400" cy="120" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="400" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">1</text>
  <text x="424" y="110" font-size="11" fill="#446688" filter="url(#rough2)">首都</text>

  <circle cx="200" cy="196" r="15" fill="#e3eefc" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="201" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">c₁</text>
  <circle cx="400" cy="196" r="15" fill="#fdf6e3" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="400" y="201" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">c₃</text>
  <circle cx="600" cy="196" r="15" fill="#e3eefc" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="600" y="201" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">c₂</text>

  <circle cx="200" cy="286" r="14" fill="#e3eefc" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <circle cx="200" cy="372" r="14" fill="#e3eefc" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <circle cx="600" cy="286" r="14" fill="#e3eefc" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <circle cx="600" cy="372" r="14" fill="#e3eefc" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <circle cx="352" cy="286" r="14" fill="#fdf6e3" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <circle cx="448" cy="286" r="14" fill="#fdf6e3" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>

  <!-- 图内标注 -->
  <text x="400" y="232" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">整棵未覆盖</text>
  <text x="400" y="252" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6015" filter="url(#rough2)">贡献 sz[c₃]</text>
  <text x="104" y="316" text-anchor="middle" font-size="10.5" fill="#a14340" filter="url(#rough2)">s₂(c₁)</text>
  <text x="696" y="316" text-anchor="middle" font-size="10.5" fill="#a14340" filter="url(#rough2)">s₂(c₂)</text>
  <text x="216" y="244" font-size="10.5" fill="#446688" filter="url(#rough2)">重儿子链</text>
  <text x="616" y="244" font-size="10.5" fill="#446688" filter="url(#rough2)">第 2 条链</text>

  <!-- 结论 -->
  <rect x="40" y="404" width="720" height="48" rx="9" fill="#f2f7fd" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="400" y="423" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">dp(x) = max( s₂(x), dp(重儿子) )：链上每个节点只留一个隐患，叶子 dp = 0</text>
  <text x="400" y="442" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f3a55" filter="url(#rough2)">根上合并：M = max( sz[c₃], dp[c₁], dp[c₂] )，答案 = n − M</text>
</svg>
