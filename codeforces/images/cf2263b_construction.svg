  <g filter="url(#rough2)" font-size="10.5">
    <rect x="316" y="82" width="24" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="350" y="96" fill="#8a6a20">对角线 (i,i)，i &lt; x：放 1..x</text>
    <text x="350" y="112" fill="#777">一步同时认领第 i 行 + 第 i 列（双重）</text>

    <rect x="316" y="136" width="24" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="350" y="150" fill="#3a5a30">第 0 列，行 r ≥ x：放 x+1..n</text>
    <text x="350" y="166" fill="#777">第 0 列早已认领 ⇒ 只认领第 r 行</text>

    <rect x="316" y="190" width="24" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <text x="350" y="204" fill="#3a4a66">第 0 行，列 c ≥ x：放 n+1..k</text>
    <text x="350" y="220" fill="#777">第 0 行早已认领 ⇒ 只认领第 c 列</text>

    <rect x="316" y="244" width="24" height="18" fill="#f0f0f0" stroke="#999" stroke-width="1.4" rx="4"/>
    <text x="350" y="258" fill="#666">其余空格：放 k+1..n²</text>
    <text x="350" y="274" fill="#777">此时 2n 行/列全部已认领 ⇒ 0 次认领</text>
  </g>

  <rect x="40" y="344" width="560" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11">
    <text x="56" y="366" fill="#3a4a66" font-weight="bold">步数核对：x + (n − x) + (n − x) = 2n − x = k</text>
    <text x="56" y="386" fill="#555">认领次数核对：2x（双重）+ (n − x) + (n − x) = 2n ✓ ，即每行每列恰好被认领一次，不多不少</text>
    <text x="56" y="403" fill="#999" font-size="10">x 的范围：k ≤ 2n−1 ⇒ x ≥ 1（保证第 0 列/行确实已被认领）；k ≥ n ⇒ x ≤ n（对角线不越界）</text>
  </g>
</svg>
