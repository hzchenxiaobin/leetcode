    <text x="320" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">构造：先算 x = 2n − k，再用三步把 2n 次认领摊到 k 步里</text>
    <text x="320" y="48" text-anchor="middle" font-size="11" fill="#888">图例取 n = 6、k = 9 ⇒ x = 3：橙格走对角线（一步认领行+列），绿格只认领行，蓝格只认领列</text>
  </g>

