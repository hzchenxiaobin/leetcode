<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="761"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="290" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">正向从赋值出发、反向从使用出发</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">两条 BFS 都只经过非赋值状态</text>
  <g filter="url(#rough2)"><circle cx="150" cy="130" r="22" fill="#dcecd2" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="150" y="133.24" text-anchor="middle" font-size="9" fill="#2b2b2b" filter="url(#rough2)">赋值</text>
  <g filter="url(#rough2)"><circle cx="300" cy="130" r="22" fill="#ffffff" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="300" y="133.24" text-anchor="middle" font-size="9" fill="#2b2b2b" filter="url(#rough2)">忽略</text>
  <g filter="url(#rough2)"><circle cx="450" cy="130" r="22" fill="#f3d9d6" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="450" y="133.24" text-anchor="middle" font-size="9" fill="#2b2b2b" filter="url(#rough2)">使用</text>
  <g filter="url(#rough2)"><line x1="172" y1="130" x2="228" y2="130" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)"/></g>
  <g filter="url(#rough2)"><line x1="322" y1="130" x2="378" y2="130" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)"/></g>
  <text x="450" y="200" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">F：从赋值可达（中间无赋值）　G：可到达使用（中间无赋值）</text>
  <text x="450" y="232" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">有意义 ⟺ (f_v = 1 或 F[v]) 且 G[v]</text>
  <text x="450" y="264" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">路径允许重复经过状态 ⇒ 两次独立 BFS 就够</text>
</svg>
