<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="121"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="300" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1：4 段，k=7 → 1</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">把 [6,9] 左移 2 变成 [4,7]</text>
  <text x="120" y="120" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">[1,4]  [6,9]  [4,7]  [3,5]</text>
  <text x="120" y="156" text-anchor="start" font-size="10.5" fill="#555555" filter="url(#rough2)">最短段长 1（[4,7] 长 3，[3,5] 长 2…实际最短 3？见正文）</text>
  <text x="120" y="196" text-anchor="start" font-size="11" fill="#3d6b2f" filter="url(#rough2)">把 [6,9] 左移 2 → [4,7]：花费 2 ≤ 7</text>
  <text x="120" y="228" text-anchor="start" font-size="12" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">此时 4 属于所有段 → 答案 1</text>
  <text x="120" y="264" text-anchor="start" font-size="11" fill="#2f4a66" filter="url(#rough2)">样例 2：两段 [40,45]、[47,74]，k=7 → 2</text>
</svg>
