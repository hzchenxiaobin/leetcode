<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="113"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="720" height="420" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例一：三块拼图，两次挪楼梯，三条走法</text>
  <path d="M 150 42 Q 360 49 570 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 三角形 -->
  <rect x="34" y="70" width="212" height="180" rx="10" fill="#eaf3ff" stroke="#446688" stroke-width="1.4" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="140" y="92" text-anchor="middle" font-size="12" fill="#2f4a63" filter="url(#rough2)">连通块 1：三角形（有环）</text>
  <circle cx="90" cy="140" r="16" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="90" y="145" text-anchor="middle" font-size="12" fill="#2f4a63" filter="url(#rough2)">1</text>
  <circle cx="190" cy="140" r="16" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="145" text-anchor="middle" font-size="12" fill="#2f4a63" filter="url(#rough2)">2</text>
  <circle cx="140" cy="212" r="16" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="140" y="217" text-anchor="middle" font-size="12" fill="#2f4a63" filter="url(#rough2)">3</text>
  <line x1="104" y1="146" x2="176" y2="146" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <line x1="100" y1="154" x2="132" y2="202" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <line x1="180" y1="154" x2="148" y2="202" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="140" y="238" text-anchor="middle" font-size="11" fill="#8a3b37" filter="url(#rough2)">走法 1：1 → 2 → 3</text>

  <!-- 边 4-5 -->
  <rect x="272" y="70" width="182" height="180" rx="10" fill="#fff7e2" stroke="#c99a3a" stroke-width="1.4" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="363" y="92" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">连通块 2：一条边</text>
  <circle cx="320" cy="150" r="16" fill="#ffffff" stroke="#c99a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="155" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">4</text>
  <circle cx="406" cy="150" r="16" fill="#ffffff" stroke="#c99a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="406" y="155" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">5</text>
  <line x1="336" y1="150" x2="390" y2="150" stroke="#c99a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="363" y="200" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">楼梯 4 = (4,5)</text>
  <text x="363" y="222" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">可用边池 A = 3 + 1 = 4</text>

  <!-- 孤立点 6 -->
  <rect x="490" y="70" width="196" height="180" rx="10" fill="#fdeeee" stroke="#b85450" stroke-width="1.4" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="588" y="92" text-anchor="middle" font-size="12" fill="#8a3b37" filter="url(#rough2)">连通块 3：孤立楼层</text>
  <circle cx="588" cy="150" r="16" fill="#ffffff" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="588" y="155" text-anchor="middle" font-size="12" fill="#8a3b37" filter="url(#rough2)">6</text>
  <text x="588" y="200" text-anchor="middle" font-size="11" fill="#8a3b37" filter="url(#rough2)">只能靠一条楼梯接进来</text>
  <text x="588" y="222" text-anchor="middle" font-size="11" fill="#8a3b37" filter="url(#rough2)">（花 1 条可用边）</text>

  <!-- 移动说明 -->
  <rect x="34" y="272" width="652" height="52" rx="8" fill="#eef6ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="48" y="292" font-size="11.5" fill="#2f5223" filter="url(#rough2)">挪 1：楼梯 2 = (1,3) → (3,5)：把边块接到三角形上；此时 A 还剩 3，走法 2：5 → 4 → 5</text>
  <text x="48" y="313" font-size="11.5" fill="#2f5223" filter="url(#rough2)">挪 2：楼梯 4 = (4,5) → (5,6)：把孤立点 6 接上；A 还剩 2，走法 3：6 → 5 → 3</text>
  <line x1="246" y1="150" x2="272" y2="150" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <text x="360" y="352" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">两次挪动都保留了原来的一端： (1,3) 保留 3，(4,5) 保留 5 —— 合法</text>
  <text x="360" y="378" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">三块 + 两次挪动 = 全部楼层 1…6 都被访问；这就是 k−1 次挪动的典型形态</text>
  <text x="360" y="402" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">若把顺序倒过来（先接孤立点再接边块），A 会一路变少，但只要 A ≥ 0 仍然可行</text>
</svg>
