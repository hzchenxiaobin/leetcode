<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="320" fill="#fafafa"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">F1（n ≤ 20）：枚举所有 C(n,k) 个子集</text>
  <path d="M 195.14500000000004 46 Q 380.0 52 564.855 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60.0" y="76.0" width="300.0" height="150.0" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="76.0" y="100.0" text-anchor="start" font-size="11.6" font-weight="bold" fill="#446688" filter="url(#rough2)">枚举组合（DFS 选/不选）</text>
  <text x="76.0" y="128.0" text-anchor="start" font-size="11.2" fill="#2b2b2b" filter="url(#rough2)">C(20,10) = 184756 个</text>
  <text x="76.0" y="150.0" text-anchor="start" font-size="11.0" fill="#2b2b2b" filter="url(#rough2)">每个子集增量维护 O(k) 的 LCP 和</text>
  <text x="76.0" y="172.0" text-anchor="start" font-size="11.0" fill="#6b6b6b" filter="url(#rough2)">≈ 2×10⁶ 次 LCP 计算</text>
  <text x="76.0" y="196.0" text-anchor="start" font-size="11.0" fill="#6b6b6b" filter="url(#rough2)">直接取最大值即可</text>
  <rect x="400.0" y="76.0" width="320.0" height="150.0" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="416.0" y="100.0" text-anchor="start" font-size="11.6" font-weight="bold" fill="#8a6015" filter="url(#rough2)">n = 100 / 2000 时？</text>
  <text x="416.0" y="128.0" text-anchor="start" font-size="11.2" fill="#2b2b2b" filter="url(#rough2)">C(2000,1000) 天文数字</text>
  <text x="416.0" y="150.0" text-anchor="start" font-size="11.2" fill="#2b2b2b" filter="url(#rough2)">⇒ 必须用前缀树上的 DP</text>
  <text x="416.0" y="176.0" text-anchor="start" font-size="11.0" fill="#6b6b6b" filter="url(#rough2)">这正是 F2 / F3 的差别所在</text>
  <rect x="60.0" y="250.0" width="660.0" height="48.0" rx="9" fill="#fdf0ef" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="274.0" text-anchor="start" font-size="11.4" fill="#8a3a36" filter="url(#rough2)">F1 只用 n ≤ 20 的 30 分档：暴力枚举 + 直接求和即可，不需要任何结构。</text>
  <text x="74.0" y="291.0" text-anchor="start" font-size="11.2" fill="#8a3a36" filter="url(#rough2)">注意子集里可以出现相同的串（题面说 not necessarily distinct）。</text>
</svg>
