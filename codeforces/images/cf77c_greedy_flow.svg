<svg xmlns="http://www.w3.org/2000/svg" width="780" height="470" viewBox="0 0 780 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="780" height="470" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">一次进入 u 的最优方案：先首访儿子，再把预算花在“还剩河狸”的地方</text>
  <path d="M 156 39 Q 390 45 624 39" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="30" y="56" width="720" height="42" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="44" y="83" text-anchor="start" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">①  进入 u：吃掉 1 只，预算 b = k_u − 1</text>
  <rect x="30" y="108" width="720" height="42" rx="8" fill="#f3e9f7" stroke="#7a4a86" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="44" y="135" text-anchor="start" font-size="12.5" font-weight="bold" fill="#7a4a86" filter="url(#rough2)">②  递归得到每个儿子 c 的 (eat_c, rest_c)：进去一次最多吃多少、之后还剩多少只</text>
  <rect x="30" y="160" width="720" height="42" rx="8" fill="#e9f4ec" stroke="#3f6b4a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="44" y="187" text-anchor="start" font-size="12.5" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">③  按 eat_c 从大到小首访：每访一个花 1 点预算，收益 eat_c + 1，并累加 rest_c</text>
  <rect x="30" y="212" width="720" height="42" rx="8" fill="#fdf3e3" stroke="#8a6015" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="44" y="239" text-anchor="start" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">④  若还有预算 b 且 Σrest &gt; 0：在这些子树里来回，每趟花 1 点预算、吃 2 只</text>
  <rect x="30" y="264" width="720" height="42" rx="8" fill="#f7ecec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="44" y="291" text-anchor="start" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">⑤  返回 (eat_u, rest_u = 剩余预算)，它同时就是 u 上最多还能被吃几只</text>
  <line x1="60" y1="98" x2="60" y2="106" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <line x1="60" y1="150" x2="60" y2="158" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <line x1="60" y1="202" x2="60" y2="210" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <line x1="60" y1="254" x2="60" y2="262" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="30" y="336" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">为什么③在④前面：首访收益 eat_c + 1 ≥ 2，恰好等于一次来回的收益，所以「先看新地方」永远不亏；</text>
  <text x="30" y="358" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">而预算有限时，按 eat_c 从大到小挑，是标准的「单位花费收益最大者优先」。</text>
  <rect x="30" y="376" width="720" height="66" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="44" y="398" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">根节点 s 特殊：不存在「进门吃 1 只」，所以 b = k_s、eat = 0，其余步骤完全一样。</text>
  <text x="44" y="422" text-anchor="start" font-size="12" fill="#2f4a66" filter="url(#rough2)">实现时按后序（迭代）自底向上算，答案就是 eat_s。</text>
</svg>
