<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="720" height="280" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两个样例的还原结果</text>
  <rect x="40" y="60" width="200" height="54" rx="8" fill="#f2f2f2" stroke="#888888" stroke-width="1.5"/>
  <text x="140" y="91" text-anchor="middle" font-size="12" fill="#555555">httpsunrux</text>
  <rect x="264" y="60" width="250" height="54" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="389" y="91" text-anchor="middle" font-size="11" fill="#2f4a66">http + sun + ru + x</text>
  <rect x="538" y="60" width="164" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="620" y="91" text-anchor="middle" font-size="11" fill="#2f5223">http://sun.ru/x</text>
  <line x1="242" y1="87" x2="262" y2="87" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="516" y1="87" x2="536" y2="87" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="40" y="156" width="200" height="54" rx="8" fill="#f2f2f2" stroke="#888888" stroke-width="1.5"/>
  <text x="140" y="187" text-anchor="middle" font-size="12" fill="#555555">ftphttprururu</text>
  <rect x="264" y="156" width="250" height="54" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="389" y="187" text-anchor="middle" font-size="11" fill="#2f4a66">ftp + http + ru + ruru</text>
  <rect x="538" y="156" width="164" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="620" y="187" text-anchor="middle" font-size="11" fill="#2f5223">ftp://http.ru/ruru</text>
  <line x1="242" y1="183" x2="262" y2="183" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="516" y1="183" x2="536" y2="183" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="360" y="250" text-anchor="middle" font-size="12" fill="#7a4b22" filter="url(#rough2)">只要 domain 非空、剩余部分当 context，任何分割都合法（多解）</text>
</svg>
