<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="720" height="380" fill="#fafafa"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">把 n 逐轮拆掉：5、10、20、40 …</text>
  <path d="M 200 43 Q 360 49 520 43" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <rect x="60" y="96" width="60" height="52" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="90.0" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <rect x="128" y="96" width="90" height="52" rx="7" fill="#e9f4e2" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="173.0" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">10</text>
  <rect x="226" y="96" width="140" height="52" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="296.0" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">20</text>
  <rect x="374" y="96" width="90" height="52" rx="7" fill="#f0eafa" stroke="#7a5aa0" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="419.0" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">40</text>
  <text x="478" y="122" text-anchor="start" font-size="11" fill="#777777" filter="url(#rough2)">…… 每轮翻倍</text>
  <text x="60" y="178" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">n 落在哪一轮，就减去前面所有轮的总人数；余下的 m ∈ [1, 本轮人数]。</text>
  <text x="60" y="202" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">本轮每个人重复 reps = 本轮人数 / 5 次，所以第 m 个属于下标 (m-1)/reps 的人。</text>
  <rect x="60" y="226" width="600" height="60" rx="7" fill="#fdecea" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="76" y="250" text-anchor="start" font-size="11.5" fill="#7b2f2c" filter="url(#rough2)">n = 1802：减到余 527，本轮 1280 = 5×256，</text>
  <text x="76" y="274" text-anchor="start" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">下标 = (527-1)/256 = 2 → 队列第 3 人 Penny</text>
  <text x="60" y="316" text-anchor="start" font-size="11" fill="#777777" filter="url(#rough2)">边界：n ≤ 5 时一轮都不用减，下标 = n-1；n 很大时轮数只有 ⌈log2(n/5)⌉+1 ≈ 30 轮。</text>
  <text x="60" y="342" text-anchor="start" font-size="11" fill="#777777" filter="url(#rough2)">所有运算都是整数，n ≤ 10^9 时 block 最多到 ~1.3×10^9，用 long long 更稳。</text>
</svg>
