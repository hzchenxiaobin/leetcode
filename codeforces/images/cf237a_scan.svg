<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="400" fill="#fafafa"/>

  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">一次线性扫描：边读边计数</text>
  <path d="M 190 44 Q 360 50 540 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 流程框 -->
  <rect x="40" y="76" width="170" height="58" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="125" y="102" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">读入 n 与 (h, m)</text>
  <text x="125" y="121" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">按时间升序给出</text>

  <line x1="212" y1="105" x2="256" y2="105" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="260" y="76" width="160" height="58" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="340" y="102" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">key = 60h + m</text>
  <text x="340" y="121" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">把时刻压成整数</text>

  <line x1="422" y1="105" x2="466" y2="105" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="470" y="76" width="200" height="58" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="570" y="102" text-anchor="middle" font-size="12.5" fill="#2f5223" filter="url(#rough2)">cnt[key] += 1</text>
  <text x="570" y="121" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">best 取本次计数的最大值</text>

  <path d="M 570 136 L 570 166" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="470" y="170" width="200" height="54" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="570" y="194" text-anchor="middle" font-size="12.5" fill="#7a5a1b" filter="url(#rough2)">扫描结束输出 best</text>
  <text x="570" y="213" text-anchor="middle" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">即所有时刻计数的最大值</text>

  <line x1="468" y1="197" x2="424" y2="197" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="260" y="170" width="160" height="54" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="340" y="194" text-anchor="middle" font-size="12.5" fill="#7a5a1b" filter="url(#rough2)">答案 = best</text>
  <text x="340" y="213" text-anchor="middle" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">无需排序，也无需数组</text>

  <!-- 样例走查 -->
  <rect x="40" y="252" width="630" height="122" rx="10" fill="#ffffff" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="56" y="276" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例走查</text>
  <text x="56" y="302" font-size="12" fill="#2b2b2b" filter="url(#rough2)">样例 1：8:00 → 1，8:10 → 2，8:45 → 1，最大值 2</text>
  <text x="56" y="326" font-size="12" fill="#2b2b2b" filter="url(#rough2)">样例 2：0:12 → 1，10:11 → 1，22:22 → 1，最大值 1</text>
  <text x="56" y="352" font-size="12" fill="#2b2b2b" filter="url(#rough2)">n = 1 时直接得 1；全部同一时刻时答案就是 n</text>
  <text x="56" y="366" font-size="11" fill="#888" filter="url(#rough2)">（每个时刻单独统计，互不影响）</text>
</svg>
