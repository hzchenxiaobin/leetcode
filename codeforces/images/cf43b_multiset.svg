<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2b2b2b"/>
    </marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arra" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="720" height="420" fill="#fafafa"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">多重集比较：每类字母的库存 ≥ 需求</text>
  <path d="M 200 44 Q 360 50 520 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="185" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">报纸 s1 的库存</text>
  <text x="505" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">信件 s2 的需求</text>
  <rect x="110" y="166" width="36" height="140" rx="0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="128" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="128" y="328" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">a</text>
  <rect x="162" y="236" width="36" height="70" rx="0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="228" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="180" y="328" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">b</text>
  <rect x="214" y="166" width="36" height="140" rx="0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="232" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="232" y="328" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">c</text>
  <rect x="266" y="290" width="36" height="16" rx="0" fill="#ffffff" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="284" y="284" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="284" y="328" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">w</text>
  <rect x="430" y="236" width="36" height="70" rx="0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="448" y="228" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <text x="448" y="328" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">a</text>
  <rect x="482" y="236" width="36" height="70" rx="0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="500" y="228" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <text x="500" y="328" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">b</text>
  <rect x="534" y="166" width="36" height="140" rx="0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="552" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">2</text>
  <text x="552" y="328" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">c</text>
  <rect x="586" y="236" width="36" height="70" rx="0" fill="#fdecea" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="604" y="228" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="604" y="328" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">w</text>
  <text x="360" y="150" text-anchor="middle" font-size="20" font-weight="bold" fill="#8a6015" filter="url(#rough2)">库存 ≥ 需求</text>
  <text x="360" y="178" text-anchor="middle" font-size="12" fill="#8a8a8a" filter="url(#rough2)">逐类比较</text>
  <text x="360" y="372" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">w：需求 1、库存 0，剪不出来 → 输出 NO</text>
  <text x="360" y="398" text-anchor="middle" font-size="12" fill="#8a8a8a" filter="url(#rough2)">a、b、c 三类都够；空格不参与比较</text>
</svg>
