<svg xmlns="http://www.w3.org/2000/svg" width="700" height="330" viewBox="0 0 700 330"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="321"/>
    <feDisplacementMap in="SourceGraphic" scale="1.5"/></filter></defs>
  <rect width="700" height="330" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">构造：前面递增，最后 k+1 个数整体递减</text>
  <path d="M 120 40 Q 350 46 580 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="62" width="330" height="46" rx="6" fill="#e8f4e0" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="225" y="90" text-anchor="middle" font-size="13" fill="#2f5223" filter="url(#rough2)">1, 2, …, n−k−1（递增，0 个下降）</text>
  <g filter="url(#rough2)"><rect x="400" y="62" width="240" height="46" rx="6" fill="#fbeeee" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="520" y="90" text-anchor="middle" font-size="13" fill="#8a3a36" filter="url(#rough2)">n, n−1, …, n−k（递减，k 个下降）</text>
  <g filter="url(#rough2)"><rect x="60" y="122" width="580" height="70" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="146" font-size="13" fill="#22314a" filter="url(#rough2)">两段的接缝处：n−k−1 &lt; n ⇒ 上升，不贡献下降 ⇒ 总下降数恰好 k ✓</text>
  <text x="76" y="170" font-size="12" fill="#2f4a66" filter="url(#rough2)">k=0 时第二段为空，整串严格递增；k=n−1 时第一段为空，整串严格递减。</text>
  <g filter="url(#rough2)"><rect x="60" y="202" width="580" height="60" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="76" y="226" font-size="12.5" fill="#8a6015" filter="url(#rough2)">样例 n=5,k=2：1 2 | 5 4 3 ⇒ "1 2 5 4 3"，下降在 5&gt;4、4&gt;3 ⇒ 2 ✓</text>
  <text x="76" y="250" font-size="12.5" fill="#8a6015" filter="url(#rough2)">（官方给的 "1 5 2 4 3" 也对；本题多解，输出任意合法即可。）</text>
  <g filter="url(#rough2)"><rect x="60" y="274" width="580" height="46" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="302" font-size="12.5" fill="#2f5223" filter="url(#rough2)">O(n) 输出；n ≤ 10⁵。</text>
</svg>
