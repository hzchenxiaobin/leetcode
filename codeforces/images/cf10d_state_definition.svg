<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c9801f"/>
    </marker>
  </defs>

  <rect width="760" height="430" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="38" text-anchor="middle" font-size="18.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">状态 f[i][j]：以 b[j] 结尾的公共递增子序列</text>
  <path d="M 152 50 Q 380 56 608 50" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="82" text-anchor="start" font-size="13" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">a = [2, 3, 1, 6, 5, 4, 6]</text>
  <text x="60" y="106" text-anchor="start" font-size="13" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">b = [1, 3, 5, 6]</text>
  <rect x="70" y="126" width="52" height="34" fill="#f7f9fc" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="96" y="150" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">2</text>
  <rect x="122" y="126" width="52" height="34" fill="#f7f9fc" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="148" y="150" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">3</text>
  <rect x="174" y="126" width="52" height="34" fill="#f7f9fc" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="200" y="150" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">1</text>
  <rect x="226" y="126" width="52" height="34" fill="#f7f9fc" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="252" y="150" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">6</text>
  <rect x="278" y="126" width="52" height="34" fill="#f7f9fc" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="304" y="150" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">5</text>
  <rect x="330" y="126" width="52" height="34" fill="#f7f9fc" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="356" y="150" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">4</text>
  <rect x="382" y="126" width="52" height="34" fill="#f7f9fc" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="408" y="150" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">6</text>
  <rect x="70" y="176" width="52" height="34" fill="#f4f9f2" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="96" y="200" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">1</text>
  <rect x="122" y="176" width="52" height="34" fill="#f4f9f2" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="148" y="200" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">3</text>
  <rect x="174" y="176" width="52" height="34" fill="#f4f9f2" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="200" y="200" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">5</text>
  <rect x="226" y="176" width="52" height="34" fill="#f4f9f2" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="252" y="200" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">6</text>
  <rect x="226" y="176" width="52" height="34" rx="0" fill="none" stroke="#c9801f" stroke-width="2.6" filter="url(#rough2)"/>
  <text x="380" y="246" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">f[4][4] = 3，对应子序列 3 5 6（在 a 中取 a2, a5, a6）</text>
  <rect x="70" y="280" width="620" height="110" rx="10" fill="#fbfbfb" stroke="#2b2b2b" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="84" y="306" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">f[i][j] = 只用 a[1..i]、b[1..j]，且以 b[j] 结尾（因此必须 a[i] == b[j]）的最长公共递增子序列长度。</text>
  <text x="84" y="332" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">转移：a[i]==b[j] 时 f[i][j] = 1 + max{ f[i-1][k] : k&lt;j 且 b[k]&lt;b[j] }；否则继承 f[i-1][j]。</text>
  <text x="84" y="358" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">答案 = max_j f[n][j]；前驱 pj[i][j] 记录上面那个 k，用于回溯出序列。</text>
</svg>
