<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="458"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="330" fill="#fafafa"/>
  <text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两个官方样例的走查：每轮选最小差值，删除后队列合拢</text>
  <path d="M 60 38 Q 380 46 700 38" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <text x="30" y="66" font-size="12.5" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">样例 1：BGBG，技能 4 2 4 3</text>

  <g font-size="10.5">
    <rect x="30" y="78" width="60" height="46" rx="7" fill="#cfe0f5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="60" y="96" text-anchor="middle" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">B 4</text>
    <text x="60" y="113" text-anchor="middle" font-size="9" fill="#555555" filter="url(#rough2)">①</text>
    <rect x="106" y="78" width="60" height="46" rx="7" fill="#f6d5d5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="136" y="96" text-anchor="middle" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">G 2</text>
    <text x="136" y="113" text-anchor="middle" font-size="9" fill="#555555" filter="url(#rough2)">②</text>
    <rect x="182" y="78" width="60" height="46" rx="7" fill="#cfe0f5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="212" y="96" text-anchor="middle" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">B 4</text>
    <text x="212" y="113" text-anchor="middle" font-size="9" fill="#555555" filter="url(#rough2)">③</text>
    <rect x="258" y="78" width="60" height="46" rx="7" fill="#f6d5d5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="288" y="96" text-anchor="middle" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">G 3</text>
    <text x="288" y="113" text-anchor="middle" font-size="9" fill="#555555" filter="url(#rough2)">④</text>
  </g>
  <text x="30" y="142" font-size="10" fill="#555555" filter="url(#rough2)">候选：①②差 2，②③差 2，③④差 1 → 先跳 ③④（差 1）</text>
  <text x="330" y="96" font-size="10.5" fill="#8a2b28" filter="url(#rough2)">→ 输出 3 4</text>

  <g font-size="10.5">
    <rect x="330" y="112" width="60" height="42" rx="7" fill="#d9ecd4" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="360" y="130" text-anchor="middle" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">B 4</text>
    <text x="360" y="146" text-anchor="middle" font-size="9" fill="#555555" filter="url(#rough2)">①</text>
    <rect x="406" y="112" width="60" height="42" rx="7" fill="#d9ecd4" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="436" y="130" text-anchor="middle" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">G 2</text>
    <text x="436" y="146" text-anchor="middle" font-size="9" fill="#555555" filter="url(#rough2)">②</text>
  </g>
  <text x="482" y="128" font-size="10.5" fill="#8a2b28" filter="url(#rough2)">合拢后只剩 ①②，差 2 → 输出 1 2</text>
  <text x="482" y="146" font-size="10" fill="#555555" filter="url(#rough2)">与样例输出 "2 / 3 4 / 1 2" 一致</text>

  <text x="30" y="196" font-size="12.5" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">样例 2：BBGG，技能 4 6 1 5</text>

  <g font-size="10.5">
    <rect x="30" y="208" width="60" height="46" rx="7" fill="#cfe0f5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="60" y="226" text-anchor="middle" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">B 4</text>
    <text x="60" y="243" text-anchor="middle" font-size="9" fill="#555555" filter="url(#rough2)">①</text>
    <rect x="106" y="208" width="60" height="46" rx="7" fill="#cfe0f5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="136" y="226" text-anchor="middle" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">B 6</text>
    <text x="136" y="243" text-anchor="middle" font-size="9" fill="#555555" filter="url(#rough2)">②</text>
    <rect x="182" y="208" width="60" height="46" rx="7" fill="#f6d5d5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="212" y="226" text-anchor="middle" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">G 1</text>
    <text x="212" y="243" text-anchor="middle" font-size="9" fill="#555555" filter="url(#rough2)">③</text>
    <rect x="258" y="208" width="60" height="46" rx="7" fill="#f6d5d5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="288" y="226" text-anchor="middle" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">G 5</text>
    <text x="288" y="243" text-anchor="middle" font-size="9" fill="#555555" filter="url(#rough2)">④</text>
  </g>
  <text x="30" y="272" font-size="10" fill="#555555" filter="url(#rough2)">①②同男、③④同女都不是候选；唯一候选 ②③ 差 5 → 输出 2 3</text>

  <g font-size="10.5">
    <rect x="330" y="208" width="60" height="42" rx="7" fill="#d9ecd4" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="360" y="226" text-anchor="middle" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">B 4</text>
    <text x="360" y="242" text-anchor="middle" font-size="9" fill="#555555" filter="url(#rough2)">①</text>
    <rect x="406" y="208" width="60" height="42" rx="7" fill="#d9ecd4" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="436" y="226" text-anchor="middle" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">G 5</text>
    <text x="436" y="242" text-anchor="middle" font-size="9" fill="#555555" filter="url(#rough2)">④</text>
  </g>
  <text x="482" y="226" font-size="10.5" fill="#8a2b28" filter="url(#rough2)">合拢后 ①④ 差 1 → 输出 1 4</text>
  <text x="482" y="244" font-size="10" fill="#555555" filter="url(#rough2)">与样例输出 "2 / 2 3 / 1 4" 一致</text>
</svg>
