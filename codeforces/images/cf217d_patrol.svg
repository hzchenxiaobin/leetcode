<svg xmlns="http://www.w3.org/2000/svg" width="840" height="450" viewBox="0 0 840 450"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="450" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">巡逻 = 若干个 ±a_i 的总位移落在某个站点上</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">站点在圆周上是 m 的整数倍位置 ⇒ 条件 = 带符号子集和 ≡ 0 (mod m)</text>
  <g filter="url(#rough2)"><circle cx="260" cy="190" r="100" fill="#f7fbf4" fill-opacity="0.9" stroke="#a8c99a" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><circle cx="260.0" cy="90.0" r="11" fill="#d6e6f2" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="260.0" y="94.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><circle cx="346.60254037844385" cy="140.0" r="11" fill="#d6e6f2" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="346.60254037844385" y="144.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><circle cx="346.6025403784439" cy="240.0" r="11" fill="#d6e6f2" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="346.6025403784439" y="244.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><circle cx="260.0" cy="290.0" r="11" fill="#d6e6f2" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="260.0" y="294.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><circle cx="173.39745962155615" cy="240.00000000000003" r="11" fill="#d6e6f2" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="173.39745962155615" y="244.00000000000003" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <g filter="url(#rough2)"><circle cx="173.39745962155615" cy="140.0" r="11" fill="#d6e6f2" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="173.39745962155615" y="144.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">6</text>
  <g filter="url(#rough2)"><path d="M 260.0 90.0 A 100 100 0 0 1 346.6 240.0" fill="none" stroke="#a0522d" stroke-width="2.0" marker-end="url(#arrr)" stroke-linejoin="round"/></g>
  <g filter="url(#rough2)"><path d="M 346.6 240.0 A 100 100 0 0 1 173.4 240.0" fill="none" stroke="#a0522d" stroke-width="2.0" marker-end="url(#arrr)" stroke-linejoin="round"/></g>
  <g filter="url(#rough2)"><path d="M 173.4 240.0 A 100 100 0 0 0 260.0 290.0" fill="none" stroke="#446688" stroke-width="2.0" marker-end="url(#arrb)" stroke-linejoin="round"/></g>
  <text x="260" y="184" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">站点均匀分布</text>
  <text x="260" y="202" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">间距 m</text>
  <g filter="url(#rough2)"><rect x="470" y="90" width="340" height="120" rx="4" fill="#faf3ec" fill-opacity="0.85" stroke="#c8a48a" stroke-width="1.3"/></g>
  <text x="640" y="116" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a4b2a" filter="url(#rough2)">示例：n=3, m=60</text>
  <text x="640" y="142" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">100 顺时针 + 90 顺时针 + 10 逆时针</text>
  <text x="640" y="166" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">总位移 180 ≡ 0 (mod 60) ⇒ 回到站点</text>
  <text x="640" y="192" text-anchor="middle" font-size="11.5" fill="#3d6b2f" filter="url(#rough2)">因此这是一次合法巡逻</text>
  <text x="420" y="316" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">结论：存在非空子集 S 与符号 ε_i ∈ {+1,−1}，使 Σ ε_i a_i ≡ 0 (mod m)</text>
  <text x="420" y="342" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">整圈周长 n·m 与 n 都不影响判定，只需对 m 取模</text>
  <g filter="url(#rough2)"><rect x="120" y="366" width="600" height="56" rx="4" fill="#f7fbf4" fill-opacity="0.85" stroke="#a8c99a" stroke-width="1.3"/></g>
  <text x="420" y="390" text-anchor="middle" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">要"阻止巡逻"，就要让剩余燃料箱中不存在任何带符号的零和</text>
  <text x="420" y="412" text-anchor="middle" font-size="12.5" fill="#8a4b2a" filter="url(#rough2)">等价于：剩余集合的全部子集和（模 m）两两不同</text>
</svg>
