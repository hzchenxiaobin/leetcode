<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="330" fill="#fafafa"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">E2 的流程：两次「首个 D ≥ t」的二分夹出区间</text>
  <path d="M 165.73500000000004 46 Q 380.0 52 594.265 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="36.0" y="92.0" width="164.0" height="62.0" rx="10" fill="#eef3fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="118.0" y="127.2" text-anchor="middle" font-size="11.6" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">读入 n, c 与 (a_i, b_i)</text>
  <rect x="222.0" y="92.0" width="152.0" height="62.0" rx="10" fill="#fdf0ef" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="298.0" y="127.2" text-anchor="middle" font-size="11.6" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">全部 a_i = 0 ?</text>
  <rect x="398.0" y="92.0" width="150.0" height="62.0" rx="10" fill="#eef3fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="473.0" y="127.2" text-anchor="middle" font-size="11.6" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">L = firstAtLeast(c)</text>
  <rect x="568.0" y="92.0" width="160.0" height="62.0" rx="10" fill="#eef3fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="648.0" y="127.2" text-anchor="middle" font-size="11.6" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">R1 = firstAtLeast(c+1)</text>
  <path d="M 200.0 123.0 L 220.0 123.0" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 374.0 123.0 L 394.0 123.0" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 548.0 123.0 L 568.0 123.0" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="298.0" y="82.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">是 → -1 / 0</text>
  <text x="472.0" y="82.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">D(L) ≠ c</text>
  <path d="M 473.0 154.0 L 473.0 196.0" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="480.0" y="180.0" text-anchor="start" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">→ 输出 0</text>
  <rect x="330.0" y="206.0" width="390.0" height="52.0" rx="10" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="348.0" y="228.0" text-anchor="start" font-size="11.8" font-weight="bold" fill="#2f5b34" filter="url(#rough2)">答案 = R1 − L，其中 R1 是首个 D ≥ c+1 的 x</text>
  <text x="348.0" y="248.0" text-anchor="start" font-size="11.2" fill="#2f5b34" filter="url(#rough2)">即 {x : D(x) = c} = [L, R1 − 1]</text>
  <path d="M 648.0 155.0 L 648.0 204.0" stroke="#5b8c5a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="36.0" y="274.0" width="688.0" height="40.0" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="50.0" y="299.0" text-anchor="start" font-size="11.4" fill="#8a6015" filter="url(#rough2)">D 的求值用 __int128 并把和截断在 c+1；二分上界靠倍增找，最多 60 步</text>
</svg>
