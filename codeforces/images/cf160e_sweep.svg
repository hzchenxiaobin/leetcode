<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="675"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="300" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">按右端点降序扫描 + 线段树按 t 找最左可行</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">已加入 ⇔ f ≥ r；后缀 t ≥ b 中找 min s ≤ l</text>
  <g filter="url(#rough2)"><rect x="60" y="96" width="780" height="60" rx="6" fill="#cfe0f5" fill-opacity="0.35" stroke="#446688" stroke-width="1.4"/></g>
  <text x="450" y="130" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">车按 f 降序插入；乘客按 r 降序查询</text>
  <g filter="url(#rough2)"><rect x="60" y="180" width="380" height="60" rx="6" fill="#dcecd2" fill-opacity="0.4" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="250" y="206" text-anchor="middle" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">线段树叶子 = 该 t 上最小的 s</text>
  <text x="250" y="228" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">节点存区间 min s 与车号</text>
  <g filter="url(#rough2)"><rect x="480" y="180" width="360" height="60" rx="6" fill="#f3d9d6" fill-opacity="0.4" stroke="#8a2b28" stroke-width="1.4"/></g>
  <text x="660" y="206" text-anchor="middle" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">查询：在 [t ≥ b] 里找</text>
  <text x="660" y="228" text-anchor="middle" font-size="10.5" fill="#8a2b28" filter="url(#rough2)">最左的 min s ≤ l</text>
  <text x="450" y="278" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">最左 ⇒ 最小 t ⇒ 题面要求</text>
</svg>
