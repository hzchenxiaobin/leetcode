<svg xmlns="http://www.w3.org/2000/svg" width="780" height="500" viewBox="0 0 780 500"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="780" height="500" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">前缀和 g(n)：已预处理的一整段 + 一次递归 + 一段等差数列</text>
  <path d="M 92 42 Q 390 48 694 42" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <rect x="56" y="62" width="250" height="44" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="181" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">第一段 [0, 2^k − 1]</text>
  <text x="181" y="100" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">直接用预处理值 pre[k]</text>

  <rect x="316" y="62" width="250" height="44" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="441" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">第二段 [2^k, 2^k + t − 2]</text>
  <text x="441" y="100" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">全部走方案 A，整体平移</text>

  <rect x="576" y="62" width="168" height="44" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="660" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#a14340" filter="url(#rough2)">第三段 [last+1, n]</text>
  <text x="660" y="100" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">全是方案 B</text>

  <line x1="60" y1="128" x2="742" y2="128" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="306" y1="122" x2="306" y2="136" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="566" y1="122" x2="566" y2="136" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="742" y1="122" x2="742" y2="136" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="152" text-anchor="middle" font-size="12" fill="#6b6b6b" filter="url(#rough2)">0</text>
  <text x="306" y="152" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">2^k − 1</text>
  <text x="566" y="152" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">last = 2^k + t − 2</text>
  <text x="742" y="152" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">n</text>

  <rect x="60" y="172" width="700" height="80" rx="9" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="196" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">第二段怎么变成一次递归：n′ 从 2^k 走到 2^k + t − 2 时，m′ = n′ − 2^k + 2 从 2 走到 t</text>
  <text x="76" y="222" font-size="13" fill="#3c5e2e" filter="url(#rough2)">Σ f(n′) = Σ (f(m′) + k + 1) = ( g(t) − g(1) ) + (t − 1)(k + 1)</text>
  <text x="76" y="244" font-size="12" fill="#3c5e2e" filter="url(#rough2)">其中 t = min(n − 2^k + 2, pos[k])：截断点由上一张图的单调性给出</text>

  <rect x="60" y="264" width="700" height="74" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="288" font-size="13" font-weight="bold" fill="#a14340" filter="url(#rough2)">第三段是一串等差数列：f(n′) = 2^(k+1) − n′ + k，n′ 从 last + 1 增到 n</text>
  <text x="76" y="314" font-size="13" fill="#a14340" filter="url(#rough2)">Σ = (n − last) · (2^(k+2) + 2k − last − n − 1) / 2</text>
  <text x="76" y="332" font-size="12" fill="#a14340" filter="url(#rough2)">最后一段最多 O(k²) 项，但用公式 O(1) 算完，不用逐项枚举</text>

  <rect x="60" y="352" width="700" height="58" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="410" y="376" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">g(n) = pre[k] + [ g(t) − 1 + (t − 1)(k + 1) ] + [ 第三段等差和 ]</text>
  <text x="410" y="398" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">t 每层至少减半 ⇒ 递归深度 ≤ 60，单次询问 O(log V)</text>

  <rect x="60" y="426" width="700" height="58" rx="9" fill="#fafafa" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="76" y="450" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">pre[k] = g(2^k − 1) 按 k 从小到大预计算：算 pre[k] 时只用到 pre[0..k−1] 和 pos[k]</text>
  <text x="76" y="472" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">区间询问 [l, r] 就是 g(r) − g(l − 1)，注意 l = 0 时 g(−1) 要返回 0</text>
</svg>
