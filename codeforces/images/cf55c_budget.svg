<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="720" height="430" fill="#fafafa"/>
  <text x="360.0" y="33" font-size="20" font-weight="bold" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">封锁预算：d−1 条余量 vs 4 个角</text>
  <path d="M 256 44 Q 360.0 50 464 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="40" y="80" width="250" height="250" rx="8" fill="#eef4fb" stroke="#9aa8b8" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="56" y="106" font-size="11.5" font-weight="bold" fill="#2b2b2b" text-anchor="start" filter="url(#rough2)">一个角有两条外侧边</text>
  <rect x="90" y="130" width="150" height="150" rx="0" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="120" y="190" font-size="12" font-weight="normal" fill="#22303f" text-anchor="middle" filter="url(#rough2)">角格</text>
  <path d="M 90 130 L 240 130" stroke="#b85450" stroke-width="3" fill="none" filter="url(#rough2)"/>
  <path d="M 90 130 L 90 280" stroke="#b85450" stroke-width="3" fill="none" filter="url(#rough2)"/>
  <text x="170" y="120" font-size="9.5" font-weight="normal" fill="#b85450" text-anchor="middle" filter="url(#rough2)">外侧边 1</text>
  <text x="70" y="210" font-size="9.5" font-weight="bold" fill="#b85450" text-anchor="middle" filter="url(#rough2)">外侧边 2</text>
  <text x="56" y="306" font-size="10" font-weight="normal" fill="#555" text-anchor="start" filter="url(#rough2)">预封 1 条 + 到达时封 1 条</text>
  <text x="56" y="322" font-size="10" font-weight="normal" fill="#555" text-anchor="start" filter="url(#rough2)">→ 两条都被封住</text>
  <rect x="330" y="100" width="60" height="40" rx="4" fill="#f3f6fa" stroke="#7a8b9a" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="360.0" y="126" font-size="11.5" font-weight="bold" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">d</text>
  <rect x="390" y="100" width="90" height="40" rx="4" fill="#f3f6fa" stroke="#7a8b9a" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="435.0" y="126" font-size="11.5" font-weight="bold" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">d−1 余量</text>
  <rect x="480" y="100" width="140" height="40" rx="4" fill="#f3f6fa" stroke="#7a8b9a" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="550.0" y="126" font-size="11.5" font-weight="bold" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">能预封几个角</text>
  <rect x="620" y="100" width="70" height="40" rx="4" fill="#f3f6fa" stroke="#7a8b9a" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="655.0" y="126" font-size="11.5" font-weight="bold" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">结果</text>
  <rect x="330" y="146" width="60" height="40" rx="4" fill="#ffffff" stroke="#c9d4e0" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="360.0" y="172" font-size="11" font-weight="normal" fill="#2f5223" text-anchor="middle" filter="url(#rough2)">3</text>
  <rect x="390" y="146" width="90" height="40" rx="4" fill="#ffffff" stroke="#c9d4e0" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="435.0" y="172" font-size="11" font-weight="normal" fill="#2f5223" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="480" y="146" width="140" height="40" rx="4" fill="#ffffff" stroke="#c9d4e0" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="550.0" y="172" font-size="11" font-weight="normal" fill="#2f5223" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="620" y="146" width="70" height="40" rx="4" fill="#ffffff" stroke="#c9d4e0" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="655.0" y="172" font-size="11" font-weight="bold" fill="#2f5223" text-anchor="middle" filter="url(#rough2)">YES</text>
  <rect x="330" y="192" width="60" height="40" rx="4" fill="#f7f9fc" stroke="#c9d4e0" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="360.0" y="218" font-size="11" font-weight="normal" fill="#2f5223" text-anchor="middle" filter="url(#rough2)">4</text>
  <rect x="390" y="192" width="90" height="40" rx="4" fill="#f7f9fc" stroke="#c9d4e0" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="435.0" y="218" font-size="11" font-weight="normal" fill="#2f5223" text-anchor="middle" filter="url(#rough2)">3</text>
  <rect x="480" y="192" width="140" height="40" rx="4" fill="#f7f9fc" stroke="#c9d4e0" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="550.0" y="218" font-size="11" font-weight="normal" fill="#2f5223" text-anchor="middle" filter="url(#rough2)">3</text>
  <rect x="620" y="192" width="70" height="40" rx="4" fill="#f7f9fc" stroke="#c9d4e0" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="655.0" y="218" font-size="11" font-weight="bold" fill="#2f5223" text-anchor="middle" filter="url(#rough2)">YES</text>
  <rect x="330" y="238" width="60" height="40" rx="4" fill="#ffffff" stroke="#c9d4e0" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="360.0" y="264" font-size="11" font-weight="normal" fill="#7a3b36" text-anchor="middle" filter="url(#rough2)">5</text>
  <rect x="390" y="238" width="90" height="40" rx="4" fill="#ffffff" stroke="#c9d4e0" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="435.0" y="264" font-size="11" font-weight="normal" fill="#7a3b36" text-anchor="middle" filter="url(#rough2)">4</text>
  <rect x="480" y="238" width="140" height="40" rx="4" fill="#ffffff" stroke="#c9d4e0" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="550.0" y="264" font-size="11" font-weight="normal" fill="#7a3b36" text-anchor="middle" filter="url(#rough2)">4</text>
  <rect x="620" y="238" width="70" height="40" rx="4" fill="#ffffff" stroke="#c9d4e0" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="655.0" y="264" font-size="11" font-weight="bold" fill="#7a3b36" text-anchor="middle" filter="url(#rough2)">NO</text>
  <rect x="330" y="284" width="60" height="40" rx="4" fill="#f7f9fc" stroke="#c9d4e0" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="360.0" y="310" font-size="11" font-weight="normal" fill="#7a3b36" text-anchor="middle" filter="url(#rough2)">6</text>
  <rect x="390" y="284" width="90" height="40" rx="4" fill="#f7f9fc" stroke="#c9d4e0" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="435.0" y="310" font-size="11" font-weight="normal" fill="#7a3b36" text-anchor="middle" filter="url(#rough2)">5</text>
  <rect x="480" y="284" width="140" height="40" rx="4" fill="#f7f9fc" stroke="#c9d4e0" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="550.0" y="310" font-size="11" font-weight="normal" fill="#7a3b36" text-anchor="middle" filter="url(#rough2)">4（只需 4）</text>
  <rect x="620" y="284" width="70" height="40" rx="4" fill="#f7f9fc" stroke="#c9d4e0" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="655.0" y="310" font-size="11" font-weight="bold" fill="#7a3b36" text-anchor="middle" filter="url(#rough2)">NO</text>
  <text x="560" y="350" font-size="11" font-weight="normal" fill="#333" text-anchor="middle" filter="url(#rough2)">4 个角都要各预封一条</text>
  <text x="560" y="372" font-size="11" font-weight="normal" fill="#333" text-anchor="middle" filter="url(#rough2)">余量 &lt; 4 时必有一个角漏掉</text>
  <rect x="330" y="382" width="370" height="34" rx="6" fill="#fff8e1" stroke="#b08a2e" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="515" y="404" font-size="11.5" font-weight="bold" fill="#5b4a2a" text-anchor="middle" filter="url(#rough2)">阈值就在 d−1 = 4，即 d = 5</text>
</svg>
