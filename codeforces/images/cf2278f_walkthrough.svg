<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">③ 演算：n = 3, m = 1 的三个数组如何被分成两种情形</text>

  <!-- 表头 -->
  <rect x="40" y="40" width="540" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="88" y="60" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">数组 a</text>
  <text x="162" y="60" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">c</text>
  <text x="250" y="60" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">(d1, d2)</text>
  <text x="336" y="60" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">D</text>
  <text x="380" y="60" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">E</text>
  <text x="486" y="60" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">归类</text>

  <!-- 第 1 行 -->
  <rect x="40" y="70" width="540" height="32" rx="4" fill="#f4f9f4" stroke="#cfd8cf" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="88" y="91" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[3, 2, 2]</text>
  <text x="162" y="91" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="250" y="91" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(1, 0)</text>
  <text x="336" y="91" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="380" y="91" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="486" y="91" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">① a_n = 2</text>

  <!-- 第 2 行 -->
  <rect x="40" y="104" width="540" height="32" rx="4" fill="#f4f9f4" stroke="#cfd8cf" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="88" y="125" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[3, 3, 2]</text>
  <text x="162" y="125" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="250" y="125" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(0, 1)</text>
  <text x="336" y="125" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="380" y="125" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="486" y="125" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">① a_n = 2</text>

  <!-- 第 3 行 -->
  <rect x="40" y="138" width="540" height="32" rx="4" fill="#fdf3f5" stroke="#e2c8ce" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="88" y="159" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[3, 2, 1]</text>
  <text x="162" y="159" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="250" y="159" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(1, 1)</text>
  <text x="336" y="159" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="380" y="159" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="486" y="159" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">② k = 2（a3 = 1）</text>

  <text x="310" y="190" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">校验：3 mod 2 + 2 mod 2 = 1；3 mod 3 + 3 mod 2 = 1；3 mod 2 + 2 mod 1 = 1 + 0 = 1</text>

  <rect x="40" y="200" width="540" height="34" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="222" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">答案 = F(2,1) + F(1,1) + F(0,1) = 2 + 1 + 0 = 3 ✓</text>

  <!-- 下半部分：n=6, m=7 -->
  <text x="310" y="262" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">同一套式子算 n = 6, m = 7（官方样例 3）：逐层读 dp[m] 累加</text>

  <rect x="56" y="276" width="58" height="46" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="122" y="276" width="58" height="46" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="188" y="276" width="58" height="46" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="254" y="276" width="58" height="46" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="320" y="276" width="58" height="46" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="386" y="276" width="58" height="46" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>

  <text x="85" y="294" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">L=0</text>
  <text x="151" y="294" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">L=1</text>
  <text x="217" y="294" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">L=2</text>
  <text x="283" y="294" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">L=3</text>
  <text x="349" y="294" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">L=4</text>
  <text x="415" y="294" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">L=5</text>

  <text x="85" y="315" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="151" y="315" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="217" y="315" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="283" y="315" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="349" y="315" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">10</text>
  <text x="415" y="315" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">49</text>

  <path d="M 349 328 L 349 342" stroke="#4a7a3a" stroke-width="1.3" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 415 328 L 415 342" stroke="#446688" stroke-width="1.3" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <text x="210" y="356" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">情形 ② 求和：0+0+0+1+10 = 11</text>
  <text x="440" y="356" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">情形 ①：49</text>

  <rect x="120" y="366" width="380" height="34" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="388" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">11 + 49 = 60，与官方输出一致 ✓</text>
</svg>
