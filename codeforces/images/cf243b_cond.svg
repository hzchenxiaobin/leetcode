<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="720" height="300" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">判定：取 A = N(u)\{v}, B = N(v)\{u}，能选出 h+t 个互不相同的点</text>
  <rect x="60" y="60" width="600" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="360" y="89" text-anchor="middle" font-size="12" fill="#2f5223">充要条件：|A| ≥ h，|B| ≥ t，|A ∪ B| ≥ h + t</text>
  <rect x="60" y="130" width="290" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="205" y="157" text-anchor="middle" font-size="11.5" fill="#2f4a66">A 很大（≥ h+t）时：</text>
  <text x="205" y="171" text-anchor="middle" font-size="11.5" fill="#2f4a66">先取 h 个做头，再从 B 里挑尾</text>
  <rect x="370" y="130" width="290" height="60" rx="8" fill="#fde9d9" stroke="#b4652a" stroke-width="1.5"/>
  <text x="515" y="157" text-anchor="middle" font-size="11.5" fill="#7a4b22">两侧都小（&lt; h+t ≤ 200）时：</text>
  <text x="515" y="171" text-anchor="middle" font-size="11.5" fill="#7a4b22">精确算 |A∩B|，按 |A∪B| 判定</text>
  <text x="60" y="236" text-anchor="start" font-size="11.5" fill="#4a2a62" filter="url(#rough2)">「头里的点在 B 中」时才需要从 A∩B 里挪：先把已定的尾标记，再从 A 里补头</text>
  <text x="60" y="262" text-anchor="start" font-size="11.5" fill="#2f5223" filter="url(#rough2)">总复杂度 Σ(deg u + deg v) 在关键剪枝下 ≤ O(m(h+t))，实测 22 ms</text>
</svg>
