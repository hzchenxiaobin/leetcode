<svg xmlns="http://www.w3.org/2000/svg" width="780" height="430" viewBox="0 0 780 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="401"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr19a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="780" height="430" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">样例 2 走查：先取最短的重复段（x=1 的 7|7）</text>

  <text x="60" y="56" font-size="11.5" fill="#555" filter="url(#rough2)">当前串：4 5 6 5 6 7 7</text>

  <!-- 被删除区域 -->
  <rect x="52" y="82" width="344" height="60" rx="6" fill="#fdeef0" stroke="none" filter="url(#rough2)"/>
  <text x="60" y="160" font-size="10.5" fill="#b85450" filter="url(#rough2)">这一段（含 7 号位的左半）会被删掉</text>

  <!-- 七个数 -->
  <rect x="60" y="90" width="50" height="44" rx="7" fill="#ffffff" stroke="#7a8ca6" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="116" y="90" width="50" height="44" rx="7" fill="#ffffff" stroke="#7a8ca6" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="172" y="90" width="50" height="44" rx="7" fill="#ffffff" stroke="#7a8ca6" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="228" y="90" width="50" height="44" rx="7" fill="#ffffff" stroke="#7a8ca6" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="284" y="90" width="50" height="44" rx="7" fill="#ffffff" stroke="#7a8ca6" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="340" y="90" width="50" height="44" rx="7" fill="#ffd9b3" stroke="#b06a2c" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="396" y="90" width="50" height="44" rx="7" fill="#a8d8a8" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>

  <text x="85" y="119" text-anchor="middle" font-size="18" fill="#33445c" filter="url(#rough2)">4</text>
  <text x="141" y="119" text-anchor="middle" font-size="18" fill="#33445c" filter="url(#rough2)">5</text>
  <text x="197" y="119" text-anchor="middle" font-size="18" fill="#33445c" filter="url(#rough2)">6</text>
  <text x="253" y="119" text-anchor="middle" font-size="18" fill="#33445c" filter="url(#rough2)">5</text>
  <text x="309" y="119" text-anchor="middle" font-size="18" fill="#33445c" filter="url(#rough2)">6</text>
  <text x="365" y="119" text-anchor="middle" font-size="18" fill="#8a4a14" filter="url(#rough2)">7</text>
  <text x="421" y="119" text-anchor="middle" font-size="18" fill="#204a1e" filter="url(#rough2)">7</text>

  <text x="85" y="148" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="141" y="148" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="197" y="148" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="253" y="148" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="309" y="148" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">4</text>
  <text x="365" y="148" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">5</text>
  <text x="421" y="148" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">6</text>

  <!-- 平方括号 -->
  <path d="M 116 84 L 116 78 L 284 78 L 284 84" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="200" y="72" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">x=2：5 6 | 5 6</text>

  <path d="M 340 84 L 340 62 L 446 62 L 446 84" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="393" y="56" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">x=1：7 | 7 ← 最短，选它</text>

  <!-- 切割线 -->
  <line x1="396" y1="86" x2="396" y2="142" stroke="#c0392b" stroke-width="2"
        stroke-dasharray="6 4" filter="url(#rough2)"/>
  <path d="M 400 176 L 400 162" stroke="#c0392b" stroke-width="1.6" fill="none"
        marker-end="url(#arr19a)" filter="url(#rough2)"/>
  <text x="408" y="192" font-size="10.5" fill="#c0392b" filter="url(#rough2)">删掉左半与它左边的一切，从"中点"（下标 6）开始</text>

  <!-- 第二轮 -->
  <text x="60" y="228" font-size="11.5" fill="#555" filter="url(#rough2)">删除后：只剩 7</text>
  <rect x="60" y="240" width="50" height="44" rx="7" fill="#a8d8a8" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="85" y="269" text-anchor="middle" font-size="18" fill="#204a1e" filter="url(#rough2)">7</text>
  <text x="126" y="258" font-size="10.5" fill="#2f5223" filter="url(#rough2)">长度为 1，凑不出 2x 的子串</text>
  <text x="126" y="276" font-size="10.5" fill="#2f5223" filter="url(#rough2)">→ 没有重复段，过程结束</text>

  <!-- 底部结论 -->
  <rect x="52" y="310" width="676" height="58" rx="9" fill="#eef4ff" stroke="#446688"
        stroke-width="1.3" filter="url(#rough2)"/>
  <text x="68" y="334" font-size="12" fill="#23405c" filter="url(#rough2)">程序里：bucket[1] = [5]，bucket[2] = [1]；先扫 x=1 取 l=5 → start=6；</text>
  <text x="68" y="356" font-size="12" fill="#23405c" filter="url(#rough2)">再扫 x=2 时 l=1 &lt; 6 已出局 → 输出长度 1 与后缀 [7]。</text>

  <text x="52" y="392" font-size="11" fill="#8c3b37" filter="url(#rough2)">若按"最左优先"，会先选 (2,1) 的 5 6 | 5 6，剩下的串是 6 5 6 7 7 —— 与正确结果完全不同。</text>
  <text x="52" y="412" font-size="11" fill="#666" filter="url(#rough2)">注意"删除左半"是把下标 0 到 5 全删掉，新串从下标 6 开始，这正是 7|7 的中点。</text>
</svg>
