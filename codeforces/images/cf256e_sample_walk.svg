<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>

  <rect width="720" height="420" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">样例第一问：a = (1, 0, 0) 时恰有 3 种填法</text>
  <path d="M 128 42 Q 360 48 592 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- w 矩阵 -->
  <text x="120" y="76" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">好对矩阵 w</text>
  <g filter="url(#rough2)">
    <rect x="56" y="86" width="128" height="92" fill="#f4f8ff" stroke="#7a93b8" stroke-width="1.3"/>
    <line x1="98" y1="86" x2="98" y2="178" stroke="#c8d4e6" stroke-width="1"/>
    <line x1="140" y1="86" x2="140" y2="178" stroke="#c8d4e6" stroke-width="1"/>
    <line x1="56" y1="116" x2="184" y2="116" stroke="#c8d4e6" stroke-width="1"/>
    <line x1="56" y1="146" x2="184" y2="146" stroke="#c8d4e6" stroke-width="1"/>
  </g>
  <g font-size="14" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">
    <text x="77" y="110">1</text><text x="119" y="110">1</text><text x="161" y="110">0</text>
    <text x="77" y="140">1</text><text x="119" y="140">0</text><text x="161" y="140">0</text>
    <text x="77" y="170">1</text><text x="119" y="170">1</text><text x="161" y="170">1</text>
  </g>

  <!-- 三条路径 -->
  <g font-size="14" text-anchor="middle" filter="url(#rough2)">
    <g>
      <rect x="230" y="86" width="44" height="38" rx="6" fill="#dfeafc" stroke="#446688" stroke-width="1.4"/>
      <rect x="300" y="86" width="44" height="38" rx="6" fill="#dfeafc" stroke="#446688" stroke-width="1.4"/>
      <rect x="370" y="86" width="44" height="38" rx="6" fill="#dfeafc" stroke="#446688" stroke-width="1.4"/>
      <text x="252" y="112" fill="#22314a">1</text>
      <text x="322" y="112" fill="#22314a">1</text>
      <text x="392" y="112" fill="#22314a">1</text>
      <text x="560" y="112" fill="#2f5223">(1,1,1) 合法</text>
    </g>
    <g>
      <rect x="230" y="150" width="44" height="38" rx="6" fill="#dfeafc" stroke="#446688" stroke-width="1.4"/>
      <rect x="300" y="150" width="44" height="38" rx="6" fill="#dfeafc" stroke="#446688" stroke-width="1.4"/>
      <rect x="370" y="150" width="44" height="38" rx="6" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.4"/>
      <text x="252" y="176" fill="#22314a">1</text>
      <text x="322" y="176" fill="#22314a">1</text>
      <text x="392" y="176" fill="#8a6015">2</text>
      <text x="560" y="176" fill="#2f5223">(1,1,2) 合法</text>
    </g>
    <g>
      <rect x="230" y="214" width="44" height="38" rx="6" fill="#dfeafc" stroke="#446688" stroke-width="1.4"/>
      <rect x="300" y="214" width="44" height="38" rx="6" fill="#dfeafc" stroke="#446688" stroke-width="1.4"/>
      <rect x="370" y="214" width="44" height="38" rx="6" fill="#dfeafc" stroke="#446688" stroke-width="1.4"/>
      <text x="252" y="240" fill="#22314a">1</text>
      <text x="322" y="240" fill="#22314a">2</text>
      <text x="392" y="240" fill="#22314a">1</text>
      <text x="560" y="240" fill="#2f5223">(1,2,1) 合法</text>
    </g>
    <g>
      <rect x="230" y="278" width="44" height="38" rx="6" fill="#fbeeee" stroke="#b85450" stroke-width="1.4"/>
      <rect x="300" y="278" width="44" height="38" rx="6" fill="#fbeeee" stroke="#b85450" stroke-width="1.4"/>
      <rect x="370" y="278" width="44" height="38" rx="6" fill="#fbeeee" stroke="#b85450" stroke-width="1.4"/>
      <text x="252" y="304" fill="#8a3a36">1</text>
      <text x="322" y="304" fill="#8a3a36">3</text>
      <text x="392" y="304" fill="#8a3a36">?</text>
      <text x="560" y="304" fill="#8a3a36">(1,3,·) 不合法</text>
    </g>
  </g>

  <g font-size="11.5" fill="#556" filter="url(#rough2)">
    <text x="230" y="76">位置 1</text>
    <text x="300" y="76">位置 2</text>
    <text x="370" y="76">位置 3</text>
  </g>

  <g font-size="12.5" fill="#8a6015" filter="url(#rough2)">
    <text x="440" y="200">w[1][1]=1，w[1][2]=1，w[1][3]=0</text>
    <text x="440" y="222">w[2][1]=1，其余为 0</text>
    <text x="404" y="330" font-size="11.5">a₁ 已固定为 1，第 1 位只剩一种取值</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="56" y="352" width="610" height="48" rx="8" fill="#e8f4e0" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <text x="72" y="382" font-size="13" fill="#2f5223" filter="url(#rough2)">
    矩阵视角：M₁ = 第 1 位允许行 × w，M₂ 同理；连乘后再对末位求和，得到 3。
  </text>
</svg>
