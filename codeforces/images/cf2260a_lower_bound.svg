<svg xmlns="http://www.w3.org/2000/svg" width="760" height="408" viewBox="0 0 760 408"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="19"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="760" height="408" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两端都 hard 时：下界 2 次，且 2 次真的够</text>
  <path d="M 168 40 Q 380 47 592 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 初始数组 a = 1 0 1 1 0 1 -->
  <text x="46" y="72" font-size="12.5" fill="#66788c" filter="url(#rough2)">初始 a（z = 2，两端都是 1）</text>

  <rect x="86" y="82" width="60" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.3" filter="url(#rough2)"/>
  <text x="116" y="108" text-anchor="middle" font-size="18" font-weight="bold" fill="#a14340" filter="url(#rough2)">1</text>
  <rect x="152" y="82" width="60" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="182" y="108" text-anchor="middle" font-size="18" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">0</text>
  <rect x="218" y="82" width="60" height="40" rx="6" fill="#f2f2f2" stroke="#9a9a9a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="248" y="108" text-anchor="middle" font-size="18" fill="#6f6f6f" filter="url(#rough2)">1</text>
  <rect x="284" y="82" width="60" height="40" rx="6" fill="#f2f2f2" stroke="#9a9a9a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="314" y="108" text-anchor="middle" font-size="18" fill="#6f6f6f" filter="url(#rough2)">1</text>
  <rect x="350" y="82" width="60" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="108" text-anchor="middle" font-size="18" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">0</text>
  <rect x="416" y="82" width="60" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.3" filter="url(#rough2)"/>
  <text x="446" y="108" text-anchor="middle" font-size="18" font-weight="bold" fill="#a14340" filter="url(#rough2)">1</text>

  <text x="116" y="138" text-anchor="middle" font-size="11" fill="#a14340" filter="url(#rough2)">位置 0：坏</text>
  <text x="446" y="138" text-anchor="middle" font-size="11" fill="#a14340" filter="url(#rough2)">位置 n−1：坏</text>
  <text x="182" y="138" text-anchor="middle" font-size="11" fill="#3c5e2e" filter="url(#rough2)">D₁</text>
  <text x="380" y="138" text-anchor="middle" font-size="11" fill="#3c5e2e" filter="url(#rough2)">D₂</text>

  <!-- 箭头 -->
  <path d="M 246 148 L 246 172" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="256" y="166" font-size="11.5" fill="#446688" filter="url(#rough2)">swap(0,1) 与 swap(4,5)</text>

  <!-- 终态数组 -->
  <rect x="86" y="180" width="60" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.3" filter="url(#rough2)"/>
  <text x="116" y="206" text-anchor="middle" font-size="18" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">0</text>
  <rect x="152" y="180" width="60" height="40" rx="6" fill="#f2f2f2" stroke="#9a9a9a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="182" y="206" text-anchor="middle" font-size="18" fill="#6f6f6f" filter="url(#rough2)">1</text>
  <rect x="218" y="180" width="60" height="40" rx="6" fill="#f2f2f2" stroke="#9a9a9a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="248" y="206" text-anchor="middle" font-size="18" fill="#6f6f6f" filter="url(#rough2)">1</text>
  <rect x="284" y="180" width="60" height="40" rx="6" fill="#f2f2f2" stroke="#9a9a9a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="314" y="206" text-anchor="middle" font-size="18" fill="#6f6f6f" filter="url(#rough2)">1</text>
  <rect x="350" y="180" width="60" height="40" rx="6" fill="#f2f2f2" stroke="#9a9a9a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="380" y="206" text-anchor="middle" font-size="18" fill="#6f6f6f" filter="url(#rough2)">1</text>
  <rect x="416" y="180" width="60" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.3" filter="url(#rough2)"/>
  <text x="446" y="206" text-anchor="middle" font-size="18" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">0</text>

  <text x="500" y="196" font-size="12" fill="#3c5e2e" filter="url(#rough2)">两次交换后两端都是 0，</text>
  <text x="500" y="214" font-size="12" fill="#3c5e2e" filter="url(#rough2)">中间怎么变都无所谓。</text>

  <!-- 左侧：下界 -->
  <rect x="40" y="240" width="336" height="118" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="208" y="264" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">下界：至少 2 次</text>
  <text x="56" y="288" font-size="11.5" fill="#a14340" filter="url(#rough2)">位置 0 上的 1 必须变成 0，这只能由</text>
  <text x="56" y="307" font-size="11.5" fill="#a14340" filter="url(#rough2)">「含位置 0 的交换」完成；位置 n−1 同理。</text>
  <text x="56" y="326" font-size="11.5" fill="#a14340" filter="url(#rough2)">若一次交换同时含这两个位置，那是把两</text>
  <text x="56" y="345" font-size="11.5" fill="#a14340" filter="url(#rough2)">个 1 对调——什么都没变，故不可能一次搞定。</text>

  <!-- 右侧：构造 -->
  <rect x="392" y="240" width="330" height="118" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="557" y="264" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">上界：2 次够</text>
  <text x="408" y="288" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">z ≥ 2 时总能取到两个不同的 0（记 D₁、D₂）。</text>
  <text x="408" y="307" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">把 D₁ 与位置 0 交换、D₂ 与位置 n−1 交换；</text>
  <text x="408" y="326" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">若 D₁、D₂ 恰好就在端点上，那端点本来就是</text>
  <text x="408" y="345" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">0，属于前一档——本档一定两次完成。∎</text>

  <rect x="40" y="370" width="682" height="30" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="381" y="390" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">同一套论证对「恰一端 hard」给出下界 1 与构造 1，答案就是两端 hard 的个数</text>
</svg>
