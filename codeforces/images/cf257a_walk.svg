<svg xmlns="http://www.w3.org/2000/svg" width="880" height="280" viewBox="0 0 880 280"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="280" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2：k=2，需要 7 个插座</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">排序后 4,3,3,2：用一个 4 → 5 个；再用一个 3 → 7 个 ✓</text>
  <g filter="url(#rough2)"><rect x="160" y="110" width="160" height="60" rx="4" fill="#d7ecd0" fill-opacity="0.7" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="240" y="136" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">初始</text>
  <text x="240" y="158" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="380" y="110" width="160" height="60" rx="4" fill="#d7ecd0" fill-opacity="0.7" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="460" y="136" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">用 4</text>
  <text x="460" y="158" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">+3 → 5</text>
  <g filter="url(#rough2)"><rect x="600" y="110" width="160" height="60" rx="4" fill="#f6e3c4" fill-opacity="0.7" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="680" y="136" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">用 3</text>
  <text x="680" y="158" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">+2 → 7</text>
  <text x="440" y="240" text-anchor="middle" font-size="15" fill="#b05a5a" filter="url(#rough2)">答案 2</text>
</svg>
