<svg xmlns="http://www.w3.org/2000/svg" width="700" height="250" viewBox="0 0 700 250"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="603"/>
    <feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></defs>
  <rect width="700" height="250" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">实现：统计最大频次</text>
  <path d="M 200 40 Q 350 46 500 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="48" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="88" font-size="13" fill="#22314a" filter="url(#rough2)">用 map 或桶统计每个值的出现次数，取最大 c。</text>
  <g filter="url(#rough2)"><rect x="60" y="116" width="580" height="48" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="146" font-size="13" fill="#2f5223" filter="url(#rough2)">输出 YES ⟺ c ≤ (n+1)/2（整数除法）</text>
  <g filter="url(#rough2)"><rect x="60" y="174" width="580" height="48" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="76" y="204" font-size="12.5" fill="#8a6015" filter="url(#rough2)">复杂度 O(n)，n ≤ 100（值域 aᵢ ≤ 1000）。</text>
  <text x="76" y="222" font-size="11.5" fill="#8a6015" filter="url(#rough2)">注意 n 为偶数/奇数时上界都是 floor((n+1)/2)。</text>
</svg>
