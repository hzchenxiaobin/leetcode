<svg xmlns="http://www.w3.org/2000/svg" width="840" height="380" viewBox="0 0 840 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="380" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每个 (z, 余类) 一棵树状数组</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">单点修改更新 30 棵树；询问只查对应 z 的 P 棵树</text>
  <g filter="url(#rough2)"><rect x="110" y="96" width="200" height="70" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="210" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">a[p] 修改</text>
  <text x="210" y="150" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">delta = v − 旧值</text>
  <g filter="url(#rough2)"><rect x="380" y="96" width="200" height="70" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="480" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">30 次单点更新</text>
  <text x="480" y="150" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">每个 z 的 p mod P 类</text>
  <g filter="url(#rough2)"><rect x="650" y="96" width="140" height="70" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="720" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">树状数组</text>
  <text x="720" y="150" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">O(log n)</text>
  <g filter="url(#rough2)"><line x1="310" y1="131" x2="380" y2="131" stroke="#8899aa" stroke-width="1.4" marker-end="url(#arrb)"/></g>
  <g filter="url(#rough2)"><line x1="580" y1="131" x2="650" y2="131" stroke="#8899aa" stroke-width="1.4" marker-end="url(#arrb)"/></g>
  <g filter="url(#rough2)"><rect x="110" y="200" width="260" height="100" rx="4" fill="#fdf6f4" fill-opacity="0.85" stroke="#d8a89a" stroke-width="1.3"/></g>
  <text x="240" y="228" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a4b2a" filter="url(#rough2)">询问 [l,r,z]</text>
  <text x="240" y="254" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">z 对应 P 个余类</text>
  <text x="240" y="276" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">每类两次前缀和</text>
  <g filter="url(#rough2)"><rect x="420" y="200" width="300" height="100" rx="4" fill="#f7fbf4" fill-opacity="0.85" stroke="#a8c99a" stroke-width="1.3"/></g>
  <text x="570" y="228" text-anchor="middle" font-size="13" font-weight="bold" fill="#3d6b2f" filter="url(#rough2)">O(P log n) ≤ O(10 log n)</text>
  <text x="570" y="254" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">乘系数后求和</text>
  <text x="570" y="276" text-anchor="middle" font-size="11.5" fill="#8a4b2a" filter="url(#rough2)">答案最大 6·10¹⁴，用 64 位</text>
  <text x="420" y="340" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">总复杂度 O((n + m log n)·30)，实测 10⁵ 次混合操作约 70 ms</text>
</svg>
