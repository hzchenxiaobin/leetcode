<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c9801f"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a8524a"/>
    </marker>
  </defs>
  <rect width="760" height="330" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">样例与自造数据走查</text>
  <rect x="24.0" y="58.0" width="714.0" height="32.0" rx="6" fill="#eef1f7" stroke="#2b2b2b" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="137.0" y="79.0" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">花瓣</text>
  <text x="340.0" y="79.0" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">总和 S</text>
  <text x="510.0" y="79.0" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">判定</text>
  <text x="664.0" y="79.0" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">答案</text>
  <rect x="24.0" y="90.0" width="714.0" height="38.0" rx="5" fill="#f7f9fc" stroke="#9aa3b2" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="34.0" y="115.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="340.0" y="115.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="440.0" y="115.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">奇数，直接取</text>
  <text x="664.0" y="115.0" text-anchor="middle" font-size="13.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="24.0" y="130.0" width="714.0" height="38.0" rx="5" fill="#fbfbfb" stroke="#9aa3b2" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="34.0" y="155.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="340.0" y="155.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="440.0" y="155.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">偶且没有奇数花瓣</text>
  <text x="664.0" y="155.0" text-anchor="middle" font-size="13.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="24.0" y="170.0" width="714.0" height="38.0" rx="5" fill="#f7f9fc" stroke="#9aa3b2" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="34.0" y="195.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">5 6 7</text>
  <text x="340.0" y="195.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">18</text>
  <text x="440.0" y="195.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">偶，minOdd = 5</text>
  <text x="664.0" y="195.0" text-anchor="middle" font-size="13.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">13</text>
  <rect x="24.0" y="210.0" width="714.0" height="38.0" rx="5" fill="#fbfbfb" stroke="#9aa3b2" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="34.0" y="235.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">2 4 6 8</text>
  <text x="340.0" y="235.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">20</text>
  <text x="440.0" y="235.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">自造：全偶</text>
  <text x="664.0" y="235.0" text-anchor="middle" font-size="13.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="24.0" y="250.0" width="714.0" height="38.0" rx="5" fill="#f7f9fc" stroke="#9aa3b2" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="34.0" y="275.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">1 3</text>
  <text x="340.0" y="275.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="440.0" y="275.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">自造：偶，minOdd = 1</text>
  <text x="664.0" y="275.0" text-anchor="middle" font-size="13.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="380.0" y="318.0" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">前 3 行是官方样例，后 2 行标注「自造」；单朵偶数花的答案就是 0。</text>
</svg>
