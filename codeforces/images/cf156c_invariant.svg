<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="545"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="280" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">操作保持「长度 + 字母和」</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">相邻两位一加一减 ⇒ 总和不变</text>
  <text x="90" y="104" text-anchor="start" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">ab</text>
  <text x="90" y="140" text-anchor="start" font-size="11" fill="#666666" filter="url(#rough2)">↓ 相邻 +1/−1</text>
  <text x="90" y="176" text-anchor="start" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">ba</text>
  <text x="300" y="104" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">和：1+2 = 3</text>
  <text x="300" y="140" text-anchor="start" font-size="12" fill="#4a7a3a" filter="url(#rough2)">和：2+1 = 3</text>
  <g filter="url(#rough2)"><rect x="560" y="96" width="280" height="100" rx="6" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="700" y="126" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 = cnt[L][S] − 1</text>
  <text x="700" y="156" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">L 长度、S 字母和</text>
  <text x="700" y="180" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">同长同和即可互达</text>
  <text x="450" y="236" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">预处理 cnt[len][sum]，长度 ≤100、和 ≤2600</text>
</svg>
