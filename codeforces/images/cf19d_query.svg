<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="420" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">find 的精确定义：严格右上，先最小 x、再最小 y</text>
  <path d="M 130 42 Q 360 48 590 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 右上区域 -->
  <rect x="250" y="90" width="380" height="140" fill="#fff8e1" opacity="0.7" stroke="none" filter="url(#rough2)"/>
  <line x1="250" y1="90" x2="250" y2="350" stroke="#b85450" stroke-width="1.3" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <line x1="70" y1="230" x2="640" y2="230" stroke="#b85450" stroke-width="1.3" stroke-dasharray="6 4" filter="url(#rough2)"/>

  <!-- 坐标轴 -->
  <line x1="70" y1="350" x2="660" y2="350" stroke="#2b2b2b" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <line x1="70" y1="350" x2="70" y2="70" stroke="#2b2b2b" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="668" y="354" font-size="12" fill="#2b2b2b" filter="url(#rough2)">x</text>
  <text x="76" y="68" font-size="12" fill="#2b2b2b" filter="url(#rough2)">y</text>
  <text x="76" y="366" font-size="11" fill="#555" filter="url(#rough2)">O</text>

  <!-- 查询点 -->
  <line x1="242" y1="222" x2="258" y2="238" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <line x1="242" y1="238" x2="258" y2="222" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="262" y="250" font-size="12" font-weight="bold" fill="#a33a36" filter="url(#rough2)">Q = (3, 4)</text>

  <!-- 点 -->
  <circle cx="310" cy="260" r="5" fill="#446688" filter="url(#rough2)"/>
  <text x="320" y="270" font-size="10.5" fill="#777" filter="url(#rough2)">(4,3)：y 不够大 ✗</text>

  <circle cx="190" cy="200" r="5" fill="#446688" filter="url(#rough2)"/>
  <text x="120" y="192" font-size="10.5" fill="#777" filter="url(#rough2)">(2,5)：x 不够大 ✗</text>

  <circle cx="310" cy="170" r="7" fill="#4a7a3a" stroke="#2f5223" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="322" y="166" font-size="11.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">答案 (4,6)</text>
  <text x="322" y="182" font-size="10" fill="#2f5223" filter="url(#rough2)">x 最小，且同 x 里 y 最小</text>

  <circle cx="310" cy="80" r="5" fill="#446688" filter="url(#rough2)"/>
  <text x="322" y="78" font-size="10.5" fill="#777" filter="url(#rough2)">(4,9)：同 x=4，但 y 更大 ✗</text>

  <circle cx="430" cy="200" r="5" fill="#446688" filter="url(#rough2)"/>
  <text x="440" y="206" font-size="10.5" fill="#777" filter="url(#rough2)">(6,5)：x 更大 ✗</text>

  <circle cx="490" cy="110" r="5" fill="#446688" filter="url(#rough2)"/>
  <text x="500" y="114" font-size="10.5" fill="#777" filter="url(#rough2)">(7,8)</text>

  <text x="40" y="392" font-size="12" fill="#2b2b2b" filter="url(#rough2)">黄色：x &gt; 3 且 y &gt; 4 的严格右上方区域；先比 x，再比 y，取字典序最小的点。</text>
  <text x="40" y="414" font-size="11" fill="#555" filter="url(#rough2)">右侧另有 (6,5)、(7,8)，但它们 x 更大，只有在 x=4 没有候选时才会轮到它们。</text>
</svg>
