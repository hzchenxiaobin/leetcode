<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="37"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="hd" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2f7a3a"/>
    </marker>
    <marker id="lt" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="450" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">重链唯一，轻步一步定胜负：2^h 个叶子被压成 h+1 类</text>
  <path d="M 110 38 Q 360 44 610 38" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 重链节点 -->
  <g filter="url(#rough2)" font-size="13" font-weight="bold" text-anchor="middle">
    <rect x="300" y="58" width="76" height="34" rx="8" fill="#e6f4ea" stroke="#2f7a3a" stroke-width="1.6"/>
    <text x="338" y="80" fill="#1f5226">v₀ = 1</text>
    <rect x="300" y="146" width="76" height="34" rx="8" fill="#e6f4ea" stroke="#2f7a3a" stroke-width="1.6"/>
    <text x="338" y="168" fill="#1f5226">v₁</text>
    <rect x="300" y="234" width="76" height="34" rx="8" fill="#e6f4ea" stroke="#2f7a3a" stroke-width="1.6"/>
    <text x="338" y="256" fill="#1f5226">v₂</text>
    <text x="338" y="296" font-size="16" fill="#555">⋮</text>
    <rect x="300" y="312" width="76" height="34" rx="8" fill="#e6f4ea" stroke="#2f7a3a" stroke-width="1.6"/>
    <text x="338" y="334" fill="#1f5226">v_h</text>
  </g>

  <!-- 重边 -->
  <g filter="url(#rough2)" stroke="#2f7a3a" stroke-width="2" fill="none">
    <line x1="338" y1="92" x2="338" y2="140" marker-end="url(#hd)"/>
    <line x1="338" y1="180" x2="338" y2="228" marker-end="url(#hd)"/>
    <line x1="338" y1="268" x2="338" y2="306" marker-end="url(#hd)"/>
  </g>
  <text x="352" y="118" font-size="11" fill="#1f5226" filter="url(#rough2)">走重孩子（唯一）</text>
  <text x="352" y="206" font-size="11" fill="#1f5226" filter="url(#rough2)">走重孩子</text>
  <text x="352" y="292" font-size="11" fill="#1f5226" filter="url(#rough2)">走重孩子</text>

  <!-- 轻子树分支 -->
  <g filter="url(#rough2)" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="6 4">
    <path d="M 300 75 L 214 108" marker-end="url(#lt)"/>
    <path d="M 300 163 L 214 196" marker-end="url(#lt)"/>
    <path d="M 300 251 L 214 284" marker-end="url(#lt)"/>
  </g>
  <g filter="url(#rough2)" font-size="11" fill="#8c2f2b">
    <text x="70" y="112">轻子树 w₀</text>
    <text x="70" y="128">2^{h-1} 个叶子</text>
    <text x="70" y="200">轻子树 w₁</text>
    <text x="70" y="216">2^{h-2} 个叶子</text>
    <text x="70" y="288">轻子树 w₂</text>
    <text x="70" y="304">2^{h-3} 个叶子</text>
  </g>

  <!-- 每层分量 -->
  <g filter="url(#rough2)" font-size="11.5" fill="#2f4a66">
    <text x="430" y="70">走重：C₀ = β₀ = a(1)+S(轻)</text>
    <text x="430" y="90">走轻：C₀ = γ₀ = a(1)+S(重) ≥ 下面一切</text>
    <text x="430" y="158">走重：C₁ = β₁</text>
    <text x="430" y="178">走轻：C₁ = γ₁ ≥ 下面一切</text>
    <text x="430" y="246">走重：C₂ = β₂</text>
    <text x="430" y="266">走轻：C₂ = γ₂ ≥ 下面一切</text>
    <text x="430" y="334">叶子：C_h = a(v_h)</text>
  </g>

  <!-- 概率 -->
  <g filter="url(#rough2)" font-size="11.5" font-weight="bold" fill="#8a6015">
    <text x="618" y="112">P = 1/2</text>
    <text x="618" y="200">P = 1/4</text>
    <text x="618" y="288">P = 1/8</text>
    <text x="618" y="340">P = 1/2^h</text>
  </g>

  <!-- 结论 -->
  <rect x="24" y="362" width="672" height="76" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="40" y="386" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">E = Σ_{d=0}^{h-1} 2^{-(d+1)} · max(β₀,…,β_{d-1}, γ_d)</text>
  <text x="330" y="386" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">+ 2^{-h} · max(β₀,…,β_{h-1}, a(v_h))</text>
  <text x="40" y="410" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">h = 1、a = (3,10,11)：β₀ = 3+10 = 13，γ₀ = 3+11 = 14 ⇒ E = 14/2 + 13/2 = 13.5</text>
  <text x="40" y="430" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">注意最后一类的权重是 2^{-h}（在 d = h−1 处它与 2^{-(d+1)} 相同），不是 2^{-(h+1)}</text>
</svg>
