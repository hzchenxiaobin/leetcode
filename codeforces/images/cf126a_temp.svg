<svg xmlns="http://www.w3.org/2000/svg" width="884" height="380" viewBox="0 0 884 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="125"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/></marker>
  </defs>
  <rect width="884" height="380" fill="#fafafa"/>
  <text x="442" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">固定热水流量 y₂ 后，温度随 y₁ 递减</text>
  <text x="442" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">取满足 T ≥ t₀ 的最大 y₁，就得到最接近 t₀ 的温度</text>
  <g filter="url(#rough2)"><line x1="120" y1="300" x2="740" y2="300" stroke="#999999" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><line x1="120" y1="300" x2="120" y2="100" stroke="#999999" stroke-width="1.4"/></g>
  <text x="108" y="140" text-anchor="end" font-size="12" fill="#777777" filter="url(#rough2)">T</text>
  <text x="750" y="318" text-anchor="start" font-size="12" fill="#777777" filter="url(#rough2)">y₁</text>
  <g filter="url(#rough2)"><line x1="120" y1="260" x2="720" y2="150" stroke="#4a7a3a" stroke-width="2.6"/></g>
  <g filter="url(#rough2)"><line x1="120" y1="90" x2="120" y2="260" stroke="#999999" stroke-width="0" stroke-dasharray="4 4"/></g>
  <g filter="url(#rough2)"><line x1="120" y1="160" x2="720" y2="160" stroke="#8a2b28" stroke-width="1.6" stroke-dasharray="6 4"/></g>
  <text x="730" y="164" text-anchor="start" font-size="12" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">t₀</text>
  <text x="160" y="124" text-anchor="start" font-size="11" fill="#3d6b2f" filter="url(#rough2)">T = (t₁y₁ + t₂y₂)/(y₁+y₂) 单调递减</text>
  <text x="442" y="344" text-anchor="middle" font-size="12" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">对每个 y₂ ∈ [1, x₂]，y₁ = min(x₁, ⌊y₂(t₂−t₀)/(t₀−t₁)⌋)</text>
  <text x="442" y="372" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">比较温度差用分数交叉相乘；并列时取 y₁+y₂ 更大者</text>
</svg>
