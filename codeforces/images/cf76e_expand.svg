<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="720" height="400" fill="#fafafa"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">平方和拆成 x、y 两个独立的一维问题</text>
  <path d="M 200 43 Q 360 49 520 43" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <rect x="70" y="78" width="580" height="74" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="360" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">Σ_{i&lt;j} (dx² + dy²) = Σ_{i&lt;j} dx² + Σ_{i&lt;j} dy²</text>
  <text x="360" y="136" text-anchor="middle" font-size="11" fill="#777777" filter="url(#rough2)">x 与 y 完全分离，各算一份再相加</text>
  <rect x="70" y="174" width="580" height="90" rx="7" fill="#e9f4e2" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="360" y="202" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5223" filter="url(#rough2)">Σ_{i&lt;j} (x_i - x_j)² = n·Σ x_i² - (Σ x_i)²</text>
  <text x="360" y="230" text-anchor="middle" font-size="11" fill="#3c5e2e" filter="url(#rough2)">因为每个 x_i² 出现在 (n-1) 对里，而每个 2·x_i·x_j 恰好被减一次：</text>
  <text x="360" y="252" text-anchor="middle" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">n·Σx² - (Σx)² = (n-1)Σx² - 2Σ_{i&lt;j} x_i x_j = Σ_{i&lt;j}(x_i-x_j)²</text>
  <rect x="70" y="286" width="580" height="66" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="360" y="312" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">只扫一遍：维护 Σx、Σx²、Σy、Σy²，O(N) 时间、O(1) 额外空间</text>
  <text x="360" y="338" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">没有除法、没有浮点，全程 64 位整数</text>
  <text x="360" y="382" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">量级：n·Σx² ≤ 10^5 × 10^5 × 10^8 = 10^18，答案 ≤ 2×10^18，64 位装得下。</text>
</svg>
