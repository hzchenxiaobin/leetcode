<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1：n = 7，按 b 降序依次取</text>
  <path d="M 180 44 Q 360 50 540 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 三个容器（按 b 降序排列） -->
  <text x="100" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">10 根 × 5 盒</text>
  <g fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" filter="url(#rough2)">
    <rect x="90" y="110" width="30" height="30"/><rect x="90" y="142" width="30" height="30"/>
    <rect x="90" y="174" width="30" height="30"/><rect x="90" y="206" width="30" height="30"/>
    <rect x="90" y="238" width="30" height="30"/>
  </g>
  <text x="105" y="292" text-anchor="middle" font-size="10.5" fill="#2f5223" filter="url(#rough2)">先取 5 盒</text>

  <text x="240" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">6 根 × 3 盒</text>
  <g fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" filter="url(#rough2)">
    <rect x="225" y="174" width="30" height="30"/><rect x="225" y="206" width="30" height="30"/>
    <rect x="225" y="238" width="30" height="30"/>
  </g>
  <text x="240" y="292" text-anchor="middle" font-size="10.5" fill="#8a6015" filter="url(#rough2)">再取 2 盒</text>

  <text x="380" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#a33a36" filter="url(#rough2)">5 根 × 2 盒</text>
  <g fill="#fde8e8" stroke="#b85450" stroke-width="1.1" filter="url(#rough2)">
    <rect x="365" y="206" width="30" height="30" opacity="0.55"/><rect x="365" y="238" width="30" height="30" opacity="0.55"/>
  </g>
  <text x="380" y="292" text-anchor="middle" font-size="10.5" fill="#a33a36" filter="url(#rough2)">背包满，不取</text>

  <!-- 右侧计算 -->
  <g font-size="12" fill="#2b2b2b" filter="url(#rough2)">
    <text x="470" y="112">取 5 盒 × 10 根 = 50</text>
    <text x="470" y="142">背包剩 7 − 5 = 2 盒</text>
    <text x="470" y="172">取 2 盒 × 6 根 = 12</text>
    <text x="470" y="202">第三档已无容量</text>
  </g>
  <rect x="462" y="218" width="220" height="58" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="478" y="244" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">合计 50 + 12 = 62</text>
  <text x="478" y="264" font-size="10.5" fill="#2f5223" filter="url(#rough2)">与样例输出一致</text>

  <!-- 背包条形图 -->
  <text x="70" y="344" font-size="12" fill="#2b2b2b" filter="url(#rough2)">背包 7 盒：</text>
  <g filter="url(#rough2)">
    <rect x="160" y="326" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="200" y="326" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="240" y="326" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="280" y="326" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="320" y="326" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="360" y="326" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="400" y="326" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <g font-size="11" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">
    <text x="180" y="348">10</text><text x="220" y="348">10</text><text x="260" y="348">10</text>
    <text x="300" y="348">10</text><text x="340" y="348">10</text>
    <text x="380" y="348">6</text><text x="420" y="348">6</text>
  </g>
  <text x="470" y="350" font-size="11.5" fill="#555" filter="url(#rough2)">（绿：10 根；黄：6 根）</text>
</svg>
