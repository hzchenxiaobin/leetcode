<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>

  <rect width="720" height="500" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 3 走查：a = [3, 9, 1, 6, 4, 5] ⇒ 40</text>

  <text x="70" y="62" text-anchor="start" font-size="12" font-weight="bold" fill="#666" filter="url(#rough2)">i</text>
  <text x="130" y="62" text-anchor="start" font-size="12" font-weight="bold" fill="#666" filter="url(#rough2)">aᵢ</text>
  <text x="210" y="62" text-anchor="start" font-size="12" font-weight="bold" fill="#666" filter="url(#rough2)">分解</text>
  <path d="M 62 70 L 392 70" stroke="#888" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 118 52 L 118 276" stroke="#ddd" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 190 52 L 190 276" stroke="#ddd" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <text x="78" y="96" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">1</text>
  <text x="138" y="96" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">3</text>
  <text x="216" y="96" text-anchor="start" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">3¹</text>

  <text x="78" y="130" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">2</text>
  <text x="138" y="130" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">9</text>
  <text x="216" y="130" text-anchor="start" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">3²</text>

  <text x="78" y="164" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">3</text>
  <text x="138" y="164" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">1</text>
  <text x="216" y="164" text-anchor="start" font-size="12.5" fill="#999" filter="url(#rough2)">空（跳过）</text>

  <text x="78" y="198" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">4</text>
  <text x="138" y="198" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">6</text>
  <text x="216" y="198" text-anchor="start" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">2¹ · 3¹</text>

  <text x="78" y="232" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">5</text>
  <text x="138" y="232" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">4</text>
  <text x="216" y="232" text-anchor="start" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">2²</text>

  <text x="78" y="266" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">6</text>
  <text x="138" y="266" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">5</text>
  <text x="216" y="266" text-anchor="start" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">5¹</text>

  <text x="540" y="62" text-anchor="middle" font-size="12" font-weight="bold" fill="#666" filter="url(#rough2)">每个素因子的系数</text>

  <rect x="404" y="76" width="256" height="58" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="532" y="99" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">q = 2：v(6) + v(4) = 1 + 2 = 3</text>
  <text x="532" y="121" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">系数 = 3 + 1 = 4</text>

  <rect x="404" y="146" width="256" height="58" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="532" y="169" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">q = 3：v(3) + v(9) + v(6) = 1 + 2 + 1 = 4</text>
  <text x="532" y="191" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">系数 = 4 + 1 = 5</text>

  <rect x="404" y="216" width="256" height="58" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="532" y="239" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">q = 5：v(5) = 1</text>
  <text x="532" y="261" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">系数 = 1 + 1 = 2</text>

  <rect x="120" y="300" width="480" height="46" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="360" y="330" text-anchor="middle" font-size="16" font-weight="bold" fill="#a14340" filter="url(#rough2)">ans = 4 × 5 × 2 = 40</text>

  <text x="70" y="376" text-anchor="start" font-size="11.5" fill="#555" filter="url(#rough2)">• a₃ = 1 没有任何素因子，它的 1 个选择被乘数里天然含掉了，不需要额外乘 1</text>
  <text x="70" y="400" text-anchor="start" font-size="11.5" fill="#555" filter="url(#rough2)">• 素因子 2 不会出现在任何 pᵢ，这本身也是 1 种合法选择，所以每个系数都要 +1</text>
  <text x="70" y="424" text-anchor="start" font-size="11.5" fill="#555" filter="url(#rough2)">• 3 同时出现在 a₁、a₂、a₄ 中，选法有 1 + 2 + 1 = 4 种，指数可以不取满</text>
  <text x="70" y="448" text-anchor="start" font-size="11.5" fill="#555" filter="url(#rough2)">• 三个素因子的选择互相独立，把系数直接相乘即是答案（分组独立乘法原理）</text>

  <text x="360" y="478" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">答案 = ∏ (1 + Σᵢ v_p(aᵢ))，只需知道每个素因子的指数和</text>
</svg>
