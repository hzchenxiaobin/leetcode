<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="37"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="720" height="400" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两个兄弟 = 切开一条边，两侧各自最优</text>
  <path d="M 140 42 Q 360 48 580 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 两侧区域 -->
  <rect x="40" y="70" width="290" height="150" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="390" y="70" width="290" height="150" rx="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="94" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">A 侧（含 r1）</text>
  <text x="406" y="94" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">B 侧（含 r2）</text>
  <text x="56" y="120" font-size="11.5" fill="#2f5223" filter="url(#rough2)">把 A 内部的方向改成从 r1 向外</text>
  <text x="56" y="142" font-size="11.5" fill="#2f5223" filter="url(#rough2)">所需翻转 = bestIn</text>
  <text x="406" y="120" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">把 B 内部的方向改成从 r2 向外</text>
  <text x="406" y="142" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">所需翻转 = bestOut</text>

  <!-- 切边 -->
  <line x1="330" y1="145" x2="390" y2="145" stroke="#b85450" stroke-width="2.4" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="360" y="132" text-anchor="middle" font-size="10.5" fill="#8c2f2b" filter="url(#rough2)">切边 e</text>
  <text x="360" y="168" text-anchor="middle" font-size="10.5" fill="#8c2f2b" filter="url(#rough2)">不用管方向</text>

  <text x="360" y="196" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">A、B 恰好是删去 e 后的两个连通块</text>

  <!-- 公式 -->
  <rect x="50" y="244" width="290" height="76" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="64" y="268" font-size="12" fill="#7a5a1b" filter="url(#rough2)">bestIn[v] = U_sub[v] − maxW[v]</text>
  <text x="64" y="290" font-size="11" fill="#7a5a1b" filter="url(#rough2)">子树内 up 边数 − 子树内向下最大权和</text>
  <text x="64" y="310" font-size="11" fill="#7a5a1b" filter="url(#rough2)">maxW[v] 用一次后序 DFS 求出</text>

  <rect x="390" y="244" width="290" height="76" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="404" y="268" font-size="12" fill="#7a5a1b" filter="url(#rough2)">bestOut[v] = U_out[v] − maxOut[v]</text>
  <text x="404" y="290" font-size="11" fill="#7a5a1b" filter="url(#rough2)">U_out = U − U_sub[v] − (e 是 up 边)</text>
  <text x="404" y="310" font-size="11" fill="#7a5a1b" filter="url(#rough2)">maxOut 用先序区间的前后缀最大值求出</text>

  <text x="360" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">答案 = min(单根最优, 所有切边上 bestIn + bestOut)</text>
  <text x="360" y="376" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">全部 O(n)：一次 DFS + 前后缀最大值，n ≤ 3000 也绰绰有余</text>
</svg>
