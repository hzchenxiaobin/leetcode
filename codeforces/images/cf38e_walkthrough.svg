<svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 0 780 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="717"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="780" height="420" fill="#fafafa"/>
  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">样例 2 走查：x = 1,3,5,6　c = 7,1,10,1</text>

  <!-- 表头 -->
  <rect x="40" y="58" width="700" height="30" fill="#eef1f4" stroke="#7a8ca6" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="60" y="78" font-size="10.5" font-weight="bold" fill="#33445c" filter="url(#rough2)">i</text>
  <text x="130" y="78" font-size="10.5" font-weight="bold" fill="#33445c" filter="url(#rough2)">x[i]</text>
  <text x="220" y="78" font-size="10.5" font-weight="bold" fill="#33445c" filter="url(#rough2)">c[i]</text>
  <text x="310" y="78" font-size="10.5" font-weight="bold" fill="#33445c" filter="url(#rough2)">dp[i] 候选</text>
  <text x="560" y="78" font-size="10.5" font-weight="bold" fill="#33445c" filter="url(#rough2)">dp[i]</text>

  <rect x="40" y="88" width="700" height="28" fill="#a8d8a8" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="60" y="107" font-size="10.5" fill="#204a1e" filter="url(#rough2)">0</text>
  <text x="130" y="107" font-size="10.5" fill="#204a1e" filter="url(#rough2)">1</text>
  <text x="220" y="107" font-size="10.5" fill="#204a1e" filter="url(#rough2)">7</text>
  <text x="310" y="107" font-size="10.5" fill="#204a1e" filter="url(#rough2)">初值（最左必须插针）</text>
  <text x="560" y="107" font-size="10.5" fill="#204a1e" filter="url(#rough2)">7</text>

  <rect x="40" y="116" width="700" height="28" fill="#ffffff" stroke="#d6d6d6" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="135" font-size="10.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="130" y="135" font-size="10.5" fill="#555" filter="url(#rough2)">3</text>
  <text x="220" y="135" font-size="10.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="310" y="135" font-size="10.5" fill="#555" filter="url(#rough2)">dp[0]+1+0 = 8</text>
  <text x="560" y="135" font-size="10.5" fill="#555" filter="url(#rough2)">8</text>

  <rect x="40" y="144" width="700" height="28" fill="#f7fbff" stroke="#d6d6d6" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="163" font-size="10.5" fill="#555" filter="url(#rough2)">2</text>
  <text x="130" y="163" font-size="10.5" fill="#555" filter="url(#rough2)">5</text>
  <text x="220" y="163" font-size="10.5" fill="#555" filter="url(#rough2)">10</text>
  <text x="310" y="163" font-size="10.5" fill="#555" filter="url(#rough2)">dp[1]+10+0 = 18；dp[0]+10+(3−1) = 19</text>
  <text x="560" y="163" font-size="10.5" fill="#555" filter="url(#rough2)">18</text>

  <rect x="40" y="172" width="700" height="28" fill="#ffffff" stroke="#d6d6d6" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="191" font-size="10.5" fill="#555" filter="url(#rough2)">3</text>
  <text x="130" y="191" font-size="10.5" fill="#555" filter="url(#rough2)">6</text>
  <text x="220" y="191" font-size="10.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="310" y="191" font-size="9.5" fill="#555" filter="url(#rough2)">dp[2]+1=19；dp[1]+3=11；dp[0]+7=14</text>
  <text x="660" y="191" font-size="10.5" fill="#555" filter="url(#rough2)">11</text>

  <!-- 最后一根针 -->
  <rect x="40" y="210" width="700" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="60" y="230" font-size="10.5" fill="#8a6015" filter="url(#rough2)">答案</text>
  <text x="310" y="230" font-size="10.5" fill="#8a6015" filter="url(#rough2)">min(dp[0]+2+4+5, dp[1]+2+3, dp[2]+1, dp[3]) = min(18,13,19,11)</text>
  <text x="700" y="230" font-size="10.5" font-weight="bold" fill="#8c3b37" filter="url(#rough2)">11</text>

  <!-- 方案图 -->
  <rect x="40" y="258" width="700" height="132" rx="9" fill="#eef4ff" stroke="#446688"
        stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="90" y1="330" x2="700" y2="330" stroke="#7a8ca6" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="140" cy="330" r="9" fill="#a8d8a8" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="290" cy="330" r="9" fill="#a8d8a8" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="440" cy="330" r="9" fill="#ffd9b3" stroke="#b06a2c" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="620" cy="330" r="9" fill="#a8d8a8" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="134" y="356" font-size="10" fill="#204a1e" filter="url(#rough2)">x=1</text>
  <text x="284" y="356" font-size="10" fill="#204a1e" filter="url(#rough2)">x=3</text>
  <text x="434" y="356" font-size="10" fill="#8a4a14" filter="url(#rough2)">x=5</text>
  <text x="614" y="356" font-size="10" fill="#204a1e" filter="url(#rough2)">x=6</text>
  <path d="M 440 316 L 305 316" stroke="#b06a2c" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="470" y="304" font-size="10" fill="#8a4a14" filter="url(#rough2)">x=5 滚到 x=3，距离 2</text>
  <text x="60" y="284" font-size="10.5" fill="#23405c" filter="url(#rough2)">最优方案：插 1、3、6 三根针（花费 7+1+1 = 9），x=5 滚 2 格，总罚金 11。</text>

  <text x="60" y="408" font-size="11" fill="#666" filter="url(#rough2)">注意 dp[3] 的两个候选：从 dp[1] 来是"针 1、3、6"，从 dp[0] 来是"针 1、6"（x=3 和 x=5 都滚到 1，更贵）。</text>
</svg>
