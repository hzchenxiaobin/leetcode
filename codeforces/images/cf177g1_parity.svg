<svg xmlns="http://www.w3.org/2000/svg" width="790" height="460" viewBox="0 0 790 460"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="790" height="460" fill="#fafafa"/>
  <text x="395.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">后缀按奇偶二值摆动：suf_{L−1}(f_i) 只会取两个值</text>
  <path d="M 167.5600000000001 46 Q 395.0 52 622.4399999999999 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="70.0" y="64.0" width="600.0" height="30.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="78.0" y="87.0" text-anchor="start" font-size="11.6" font-weight="bold" fill="#26405c" filter="url(#rough2)">i</text>
  <text x="138.0" y="87.0" text-anchor="start" font-size="11.6" font-weight="bold" fill="#26405c" filter="url(#rough2)">f_i</text>
  <text x="388.0" y="87.0" text-anchor="start" font-size="11.6" font-weight="bold" fill="#26405c" filter="url(#rough2)">suf_3(f_i)</text>
  <text x="548.0" y="87.0" text-anchor="start" font-size="11.6" font-weight="bold" fill="#26405c" filter="url(#rough2)">i 的奇偶</text>
  <path d="M 70.0 64.0 L 670.0 64.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="78.0" y="117.0" text-anchor="start" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="138.0" y="117.0" text-anchor="start" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">bab</text>
  <text x="388.0" y="117.0" text-anchor="start" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">bab</text>
  <text x="548.0" y="117.0" text-anchor="start" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">偶</text>
  <path d="M 70.0 94.0 L 670.0 94.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="78.0" y="147.0" text-anchor="start" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <text x="138.0" y="147.0" text-anchor="start" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">babba</text>
  <text x="388.0" y="147.0" text-anchor="start" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">bba</text>
  <text x="548.0" y="147.0" text-anchor="start" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">奇</text>
  <path d="M 70.0 124.0 L 670.0 124.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="78.0" y="177.0" text-anchor="start" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">6</text>
  <text x="138.0" y="177.0" text-anchor="start" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">babbabab</text>
  <text x="388.0" y="177.0" text-anchor="start" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">bab</text>
  <text x="548.0" y="177.0" text-anchor="start" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">偶</text>
  <path d="M 70.0 154.0 L 670.0 154.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="78.0" y="207.0" text-anchor="start" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">7</text>
  <text x="138.0" y="207.0" text-anchor="start" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">babbababbabba</text>
  <text x="388.0" y="207.0" text-anchor="start" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">bba</text>
  <text x="548.0" y="207.0" text-anchor="start" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">奇</text>
  <path d="M 70.0 184.0 L 670.0 184.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="78.0" y="237.0" text-anchor="start" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">8</text>
  <text x="138.0" y="237.0" text-anchor="start" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">f_7 f_6（长 21）</text>
  <text x="388.0" y="237.0" text-anchor="start" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">bab</text>
  <text x="548.0" y="237.0" text-anchor="start" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">偶</text>
  <path d="M 70.0 214.0 L 670.0 214.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="78.0" y="267.0" text-anchor="start" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">9</text>
  <text x="138.0" y="267.0" text-anchor="start" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">f_8 f_7（长 34）</text>
  <text x="388.0" y="267.0" text-anchor="start" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">bba</text>
  <text x="548.0" y="267.0" text-anchor="start" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">奇</text>
  <path d="M 70.0 244.0 L 670.0 244.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="70.0" y="290.0" text-anchor="start" font-size="11.2" fill="#6b6b6b" filter="url(#rough2)">上表 L−1 = 3：后缀隔 2 行完全重复（bab / bba 交替），与 i 的奇偶一一对应。</text>
  <rect x="70.0" y="306.0" width="650.0" height="46.0" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="84.0" y="329.0" text-anchor="start" font-size="11.4" fill="#8a6015" filter="url(#rough2)">因为 f_i = f_{i−1} f_{i−2}，当 |f_{i−2}| ≥ L−1 时 suf(f_i) = suf(f_{i−2})：</text>
  <text x="84.0" y="348.0" text-anchor="start" font-size="11.4" fill="#8a6015" filter="url(#rough2)">下标隔 2 相同 ⇒ 整个后缀序列分成奇、偶两条常数链。</text>
  <rect x="70.0" y="362.0" width="650.0" height="50.0" rx="9" fill="#fdf0ef" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="84.0" y="384.0" text-anchor="start" font-size="11.2" fill="#8a3a36" filter="url(#rough2)">前缀在 i ≥ i0 后完全稳定；于是 k ≥ M = i0+3 时 cross_k 只由 k 的奇偶决定：</text>
  <text x="84.0" y="403.0" text-anchor="start" font-size="11.2" fill="#8a3a36" filter="url(#rough2)">记 cpar[0] = cross(偶 k)，cpar[1] = cross(奇 k)，只有两个常数要算。</text>
</svg>
