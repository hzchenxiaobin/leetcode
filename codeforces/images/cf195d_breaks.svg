<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="421"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">195D：y=|kx+b| 在 x=−b/k 处折，s(x) 的折点 = 不同 x=−b/k</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <line x1="100.0" y1="260.0" x2="620.0" y2="260.0" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="360.0" y1="90.0" x2="360.0" y2="300.0" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 140 140 L 240 260 L 340 160" fill="#4a7a3a" stroke="1.8" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 380 220 L 480 260 L 580 140" fill="#446688" stroke="1.8" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="240.0" cy="260.0" r="6.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="480.0" cy="260.0" r="6.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="230.0" y="286.0" text-anchor="middle" font-size="10.5" fill="#8a6015" font-weight="bold" filter="url(#rough2)">x=−b₁/k₁</text>
  <text x="490.0" y="286.0" text-anchor="middle" font-size="10.5" fill="#8a6015" font-weight="bold" filter="url(#rough2)">x=−b₂/k₂</text>
  <rect x="60.0" y="320.0" width="600.0" height="56.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="74.0" y="343.3" text-anchor="start" font-size="11.3" fill="#3f3420" filter="url(#rough2)">每个折点处斜率跳变 2|k|&gt;0（k≠0）→ 该点必是 ≠180° 的角</text>
  <text x="74.0" y="367.3" text-anchor="start" font-size="11.3" fill="#3f3420" filter="url(#rough2)">答案 = 不同最简分数 (−b/k) 的个数</text>
</svg>
