<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="357"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="300" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">受伤 = 四个倍数集合的并集</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">不能把四个商直接相加（同一条龙可能被多种方式修理）</text>
  <g filter="url(#rough2)"><rect x="70" y="96" width="180" height="56" rx="5" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="160" y="120" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">A_k</text>
  <text x="160" y="142" text-anchor="middle" font-size="10" fill="#666666" filter="url(#rough2)">k 的倍数：平底锅</text>
  <g filter="url(#rough2)"><rect x="270" y="96" width="180" height="56" rx="5" fill="#f6e3c4" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="360" y="120" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">A_l</text>
  <text x="360" y="142" text-anchor="middle" font-size="10" fill="#666666" filter="url(#rough2)">l 的倍数：夹尾巴</text>
  <g filter="url(#rough2)"><rect x="470" y="96" width="180" height="56" rx="5" fill="#dcecd2" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="560" y="120" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">A_m</text>
  <text x="560" y="142" text-anchor="middle" font-size="10" fill="#666666" filter="url(#rough2)">m 的倍数：踩爪子</text>
  <g filter="url(#rough2)"><rect x="670" y="96" width="180" height="56" rx="5" fill="#f3d9d6" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="760" y="120" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">A_n</text>
  <text x="760" y="142" text-anchor="middle" font-size="10" fill="#666666" filter="url(#rough2)">n 的倍数：喊妈妈</text>
  <text x="450" y="186" text-anchor="middle" font-size="14" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">|A_k ∪ A_l ∪ A_m ∪ A_n| = 受伤龙数</text>
  <g filter="url(#rough2)"><rect x="60" y="212" width="780" height="66" rx="6" fill="#cfe0f5" fill-opacity="0.45" stroke="#446688" stroke-width="1.4"/></g>
  <text x="450" y="240" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">d ≤ 10^5 ⇒ 直接枚举 i = 1..d，四个取模判断</text>
  <text x="450" y="264" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">若 d 到 10^9 则用容斥（15 个交集，lcm ≤ 2520）</text>
</svg>
