<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="29"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="760" height="420" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 n = 5：反解出的命令恰好 4 条</text>
  <path d="M 220 42 Q 380 50 540 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 左：输入画面 -->
  <text x="120" y="72" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">输入画面</text>
  <g filter="url(#rough2)" font-family="'Courier New',monospace" font-size="16" fill="#2b2b2b">
    <rect x="56" y="82" width="128" height="120" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.3"/>
    <text x="68" y="104">01110</text>
    <text x="68" y="124">10010</text>
    <text x="68" y="144">10001</text>
    <text x="68" y="164">10011</text>
    <text x="68" y="184">11110</text>
  </g>

  <!-- 中：命令矩阵 -->
  <text x="310" y="72" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8b3a37" filter="url(#rough2)">解出的 O</text>
  <g filter="url(#rough2)" font-family="'Courier New',monospace" font-size="16" fill="#2b2b2b">
    <rect x="246" y="82" width="128" height="120" rx="6" fill="#fdecea" stroke="#b85450" stroke-width="1.3"/>
    <text x="258" y="104">00010</text>
    <text x="258" y="124">00000</text>
    <text x="258" y="144">00101</text>
    <text x="258" y="164">00000</text>
    <text x="258" y="184">10000</text>
  </g>
  <text x="310" y="220" text-anchor="middle" font-size="12" fill="#8b3a37" filter="url(#rough2)">O 里正好 4 个 1，相加即答案</text>

  <!-- 右：四条命令 -->
  <text x="590" y="72" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">对应的四条命令</text>
  <g filter="url(#rough2)">
    <rect x="470" y="82" width="240" height="26" rx="5" fill="#e9f5e6" stroke="#4a7a3a" stroke-width="1.1"/>
    <text x="484" y="100" font-size="13" fill="#2f5223">O[1][4] = 1 → 命令 (1,4)</text>
    <rect x="470" y="114" width="240" height="26" rx="5" fill="#e9f5e6" stroke="#4a7a3a" stroke-width="1.1"/>
    <text x="484" y="132" font-size="13" fill="#2f5223">O[3][3] = 1 → 命令 (3,3)</text>
    <rect x="470" y="146" width="240" height="26" rx="5" fill="#e9f5e6" stroke="#4a7a3a" stroke-width="1.1"/>
    <text x="484" y="164" font-size="13" fill="#2f5223">O[3][5] = 1 → 命令 (3,5)</text>
    <rect x="470" y="178" width="240" height="26" rx="5" fill="#e9f5e6" stroke="#4a7a3a" stroke-width="1.1"/>
    <text x="484" y="196" font-size="13" fill="#2f5223">O[5][1] = 1 → 命令 (5,1)</text>
  </g>

  <!-- 走查表 -->
  <g filter="url(#rough2)">
    <rect x="56" y="240" width="654" height="130" rx="9" fill="#ffffff" stroke="#888" stroke-width="1.2"/>
    <text x="72" y="264" font-size="13" font-weight="bold" fill="#2b2b2b">为什么恰好是这四条</text>
    <text x="72" y="288" font-size="12.5" fill="#2b2b2b">· 第 1 行只剩 (1,4) 能为格子 (1,4) 负责：i = 1 时列前缀为空，后缀异或直接等于 O[1][4]。</text>
    <text x="72" y="310" font-size="12.5" fill="#2b2b2b">· 上三角逐行从右往左差分后，(3,3)、(3,5) 依次被钉死；下三角从下往上只解出 (5,1)。</text>
    <text x="72" y="332" font-size="12.5" fill="#2b2b2b">· 对角线 O[3][3] 由 cell(3,3) ⊕ 第 3 行其余 ⊕ 第 3 列其余得到，其余四个对角元都是 0。</text>
    <text x="72" y="356" font-size="12.5" fill="#8b3a37">· 四个 1 相加即答案 4，与官方输出一致；命令集合唯一，所以不可能更少。</text>
  </g>

  <text x="380" y="396" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">题面示例里的 (1,4)(3,5)(5,1)(3,3) 生成的画面正是这张图，条数同为 4，完全吻合。</text>
</svg>
