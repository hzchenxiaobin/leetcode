<svg xmlns="http://www.w3.org/2000/svg" width="884" height="392" viewBox="0 0 884 392"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="117"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="884" height="392" fill="#fafafa"/>
  <text x="442" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">F 对应按低位分左右的二叉树</text>
  <text x="442" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">左孩子 = 原位置奇数（x 最低位 0），右 = 偶数</text>
  <g filter="url(#rough2)"><rect x="384" y="66" width="116" height="36" rx="4" fill="#f6e3c4" fill-opacity="0.65" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="442" y="89" text-anchor="middle" font-size="10.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">全部 x</text>
  <g filter="url(#rough2)"><rect x="192" y="142" width="116" height="36" rx="4" fill="#d7ecd0" fill-opacity="0.65" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="250" y="165" text-anchor="middle" font-size="10.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">x 偶数</text>
  <g filter="url(#rough2)"><rect x="576" y="142" width="116" height="36" rx="4" fill="#cfe0f5" fill-opacity="0.65" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="634" y="165" text-anchor="middle" font-size="10.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">x 奇数</text>
  <g filter="url(#rough2)"><rect x="92" y="218" width="116" height="36" rx="4" fill="#d7ecd0" fill-opacity="0.65" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="150" y="241" text-anchor="middle" font-size="10.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">x≡0(4)</text>
  <g filter="url(#rough2)"><rect x="292" y="218" width="116" height="36" rx="4" fill="#d7ecd0" fill-opacity="0.65" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="350" y="241" text-anchor="middle" font-size="10.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">x≡2(4)</text>
  <g filter="url(#rough2)"><rect x="482" y="218" width="116" height="36" rx="4" fill="#cfe0f5" fill-opacity="0.65" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="540" y="241" text-anchor="middle" font-size="10.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">x≡1(4)</text>
  <g filter="url(#rough2)"><rect x="672" y="218" width="116" height="36" rx="4" fill="#cfe0f5" fill-opacity="0.65" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="730" y="241" text-anchor="middle" font-size="10.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">x≡3(4)</text>
  <g filter="url(#rough2)"><line x1="442" y1="102" x2="250" y2="142" stroke="#bbbbbb" stroke-width="1.2"/></g>
  <g filter="url(#rough2)"><line x1="442" y1="102" x2="634" y2="142" stroke="#bbbbbb" stroke-width="1.2"/></g>
  <g filter="url(#rough2)"><line x1="250" y1="178" x2="150" y2="218" stroke="#bbbbbb" stroke-width="1.2"/></g>
  <g filter="url(#rough2)"><line x1="250" y1="178" x2="350" y2="218" stroke="#bbbbbb" stroke-width="1.2"/></g>
  <g filter="url(#rough2)"><line x1="634" y1="178" x2="540" y2="218" stroke="#bbbbbb" stroke-width="1.2"/></g>
  <g filter="url(#rough2)"><line x1="634" y1="178" x2="730" y2="218" stroke="#bbbbbb" stroke-width="1.2"/></g>
  <text x="442" y="290" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">b 是这棵树的“左先序”叶子序列；结点 = 类 {x&lt;n : x≡t (mod 2^d)}</text>
  <text x="442" y="320" text-anchor="middle" font-size="11.5" fill="#3d6b2f" filter="url(#rough2)">[l,r] 拆成 O(log n) 个完整结点 + O(log n) 残结点</text>
  <text x="442" y="352" text-anchor="middle" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">完整结点内 x 是等差列，与 [u,v] 相交部分等差求和 O(1)</text>
</svg>
