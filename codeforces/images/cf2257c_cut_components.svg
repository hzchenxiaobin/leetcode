<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="430" fill="#fafafa"/>

  <text x="330" y="28" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#444" filter="url(#rough2)">核心模型：装摄像头 = 把这条边「砍掉」</text>
  <text x="330" y="50" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">观测序列 = 根到终点的路径上、按深度排列的摄像头边；绿 = 坝，橙 = 摄像头</text>

  <!-- 树边 -->
  <path d="M 330 62 L 180 150" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 330 62 L 480 150" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 180 150 L 105 240" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 180 150 L 255 240" stroke="#d6a040" stroke-width="3" fill="none" filter="url(#rough2)"/>
  <path d="M 480 150 L 405 240" stroke="#d6a040" stroke-width="3" fill="none" filter="url(#rough2)"/>
  <path d="M 480 150 L 555 240" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <!-- 摄像头标记 -->
  <g filter="url(#rough2)">
    <rect x="203" y="186" width="30" height="19" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <circle cx="218" cy="195.5" r="4.5" fill="none" stroke="#d6a040" stroke-width="1.5"/>
    <text x="236" y="182" font-size="11" fill="#b8860b">c1</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="428" y="186" width="30" height="19" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <circle cx="443" cy="195.5" r="4.5" fill="none" stroke="#d6a040" stroke-width="1.5"/>
    <text x="461" y="182" font-size="11" fill="#b8860b">c2</text>
  </g>

  <!-- 结点 -->
  <g filter="url(#rough2)">
    <circle cx="330" cy="62" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="330" y="67" text-anchor="middle" font-size="12.5" fill="#333">1</text>
    <circle cx="180" cy="150" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="180" y="155" text-anchor="middle" font-size="12.5" fill="#333">2</text>
    <circle cx="105" cy="240" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="105" y="245" text-anchor="middle" font-size="12.5" fill="#333">4</text>
    <circle cx="480" cy="150" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="480" y="155" text-anchor="middle" font-size="12.5" fill="#2f5a24">3</text>
    <circle cx="255" cy="240" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="255" y="245" text-anchor="middle" font-size="12.5" fill="#2f5a24">5</text>
    <circle cx="405" cy="240" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="405" y="245" text-anchor="middle" font-size="12.5" fill="#2f5a24">6</text>
    <circle cx="555" cy="240" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="555" y="245" text-anchor="middle" font-size="12.5" fill="#333">7</text>
  </g>

  <!-- 观测序列 -->
  <g filter="url(#rough2)">
    <rect x="515" y="118" width="112" height="24" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <text x="571" y="134" text-anchor="middle" font-size="11.5" fill="#8d3b37">坝 3 → [ ]</text>
    <rect x="190" y="272" width="128" height="24" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <text x="254" y="288" text-anchor="middle" font-size="11.5" fill="#8d3b37">坝 5 → [c1]</text>
    <rect x="341" y="272" width="128" height="24" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <text x="405" y="288" text-anchor="middle" font-size="11.5" fill="#8d3b37">坝 6 → [c2]</text>
  </g>

  <!-- 结论框 -->
  <g filter="url(#rough2)">
    <rect x="30" y="312" width="600" height="98" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="48" y="340" font-size="13.5" fill="#2c4257">删掉 k 条边 → 树裂成 k+1 个连通块；同一块里的两个坝，观测序列完全相同。</text>
    <text x="48" y="366" font-size="13.5" fill="#2c4257">m 个坝必须落在不同的块里 ⇒ k+1 ≥ m ⇒ k ≥ m − 1。</text>
    <text x="48" y="392" font-size="13.5" fill="#2c4257">反过来，不同块的两个坝路径上必有摄像头，序列必然不同。</text>
  </g>
</svg>
