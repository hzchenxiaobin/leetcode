<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 382" width="640" height="382">
<defs>
<filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="9" result="noise"/>
<feDisplacementMap in="SourceGraphic" in2="noise" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect x="0" y="0" width="640" height="382" fill="#fafafa"/>
<g font-family="Comic Sans MS, Kaiti SC, cursive">
<text x="320.0" y="24.0" font-size="15" fill="#33475b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">样例：2 个点 → 补 1 个点就变「良」</text>
<line x1="140.0" y1="320.0" x2="420.0" y2="320.0" stroke="#666" stroke-width="1.6" filter="url(#rough2)"/>
<line x1="140.0" y1="320.0" x2="140.0" y2="82.0" stroke="#666" stroke-width="1.6" filter="url(#rough2)"/>
<text x="436.0" y="324.0" font-size="14" fill="#666" text-anchor="middle" font-weight="normal" filter="url(#rough2)">x</text>
<text x="124.0" y="82.0" font-size="14" fill="#666" text-anchor="middle" font-weight="normal" filter="url(#rough2)">y</text>
<text x="210.0" y="338.0" font-size="12" fill="#888" text-anchor="middle" font-weight="normal" filter="url(#rough2)">1</text>
<text x="126.0" y="254.0" font-size="12" fill="#888" text-anchor="middle" font-weight="normal" filter="url(#rough2)">1</text>
<text x="280.0" y="338.0" font-size="12" fill="#888" text-anchor="middle" font-weight="normal" filter="url(#rough2)">2</text>
<text x="126.0" y="184.0" font-size="12" fill="#888" text-anchor="middle" font-weight="normal" filter="url(#rough2)">2</text>
<text x="350.0" y="338.0" font-size="12" fill="#888" text-anchor="middle" font-weight="normal" filter="url(#rough2)">3</text>
<text x="126.0" y="114.0" font-size="12" fill="#888" text-anchor="middle" font-weight="normal" filter="url(#rough2)">3</text>
<rect x="210.0" y="180.0" width="70.0" height="70.0" rx="4" fill="#eef4fb" stroke="#9ab" stroke-width="1.5" stroke-dasharray="6 5" filter="url(#rough2)"/>
<circle cx="210.0" cy="250.0" r="7.0" fill="#33475b" stroke="#33475b" stroke-width="1.4" filter="url(#rough2)"/>
<text x="204.0" y="274.0" font-size="12" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">(1,1)</text>
<circle cx="280.0" cy="180.0" r="7.0" fill="#33475b" stroke="#33475b" stroke-width="1.4" filter="url(#rough2)"/>
<text x="286.0" y="166.0" font-size="12" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">(2,2)</text>
<circle cx="280.0" cy="250.0" r="8.0" fill="#f6d9b0" stroke="#c0392b" stroke-width="2.0" filter="url(#rough2)"/>
<text x="320.0" y="255.0" font-size="13" fill="#c0392b" text-anchor="start" font-weight="normal" filter="url(#rough2)">(2,1) 新补</text>
<text x="320.0" y="366.0" font-size="13" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">(1,1)-(2,1) 同行，(2,2)-(2,1) 同列，(1,1)-(2,2) 的盒内有 (2,1)</text>
</g>
</svg>
