<svg xmlns="http://www.w3.org/2000/svg" width="720" height="404" viewBox="0 0 720 404"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="4.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="404" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1 走查：[1, 2, 3, 4] → 9，总损失只有 1</text>
  <path d="M 150 39 Q 360 45 570 39" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <text x="112" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">步骤</text>
  <text x="212" y="86" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">序列（拆完后的样子）</text>
  <text x="656" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">本次损失</text>
  <path d="M 24 94 L 700 94" stroke="#888" stroke-width="1.1" fill="none" filter="url(#rough2)"/>

  <!-- 第 0 行 -->
  <text x="30" y="126" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">初始序列</text>
  <rect x="212" y="104" width="54" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="239" y="126" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <rect x="268" y="104" width="54" height="32" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="295" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6015" filter="url(#rough2)">2</text>
  <rect x="324" y="104" width="54" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="351" y="126" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <rect x="380" y="104" width="54" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="407" y="126" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="656" y="126" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">—</text>

  <path d="M 295 138 L 295 152" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 第 1 行 -->
  <text x="30" y="174" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">① 拆 a₂ = 2 → 1+1</text>
  <rect x="212" y="152" width="54" height="32" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="239" y="174" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5d22" filter="url(#rough2)">2</text>
  <rect x="268" y="152" width="54" height="32" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="295" y="174" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6015" filter="url(#rough2)">4</text>
  <rect x="324" y="152" width="54" height="32" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="351" y="174" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5d22" filter="url(#rough2)">4</text>
  <text x="656" y="174" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>

  <path d="M 295 186 L 295 200" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 第 2 行 -->
  <text x="30" y="222" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">② 拆中间 4 → 1+3</text>
  <rect x="212" y="200" width="54" height="32" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="239" y="222" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6015" filter="url(#rough2)">3</text>
  <rect x="268" y="200" width="54" height="32" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="295" y="222" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5d22" filter="url(#rough2)">7</text>
  <text x="656" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>

  <path d="M 239 234 L 239 248" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 第 3 行 -->
  <text x="30" y="270" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">③ 拆 3 → 1+2（队首）</text>
  <rect x="212" y="248" width="54" height="32" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.3" filter="url(#rough2)"/>
  <text x="239" y="270" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f5d22" filter="url(#rough2)">9</text>
  <text x="656" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#a14340" filter="url(#rough2)">1</text>

  <rect x="24" y="296" width="672" height="96" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="318" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">① 2 = 1 + 1：一份给左邻（1→2）、一份给右邻（3→4），两份都有人接 → 损失 0</text>
  <text x="360" y="342" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">② 4 = 1 + 3：1 给左邻（2→3）、3 给右邻（4→7），仍在内部 → 损失 0</text>
  <text x="360" y="366" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">③ 3 = 1 + 2：3 已在队首，1 无处可给、永久损失，2 给右邻 → 损失 1</text>
  <text x="360" y="386" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">Σa = 10，总损失 0 + 0 + 1 = 1，答案 10 − 1 = 9</text>
</svg>
