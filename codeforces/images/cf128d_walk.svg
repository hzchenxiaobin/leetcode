<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1281"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="340" fill="#fafafa"/>
  <text x="360.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">闭合游走与穿边次数</text>
  <path d="M 115.2 42 Q 360.0 48 604.8 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="360.0" y="326" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">2c_i = e_{i−1} + e_i，e_0 = e_p = 0</text>
  <circle cx="150" cy="150" r="26" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="156" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">v1</text>
  <circle cx="280" cy="150" r="26" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="156" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">v2</text>
  <circle cx="410" cy="150" r="26" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="410" y="156" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">v3</text>
  <circle cx="540" cy="150" r="26" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="540" y="156" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">v4</text>
  <line x1="176" y1="150" x2="254" y2="150" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="215" y="130" text-anchor="middle" font-size="11" fill="#8c2f2c" filter="url(#rough2)">e1</text>
  <line x1="306" y1="150" x2="384" y2="150" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="345" y="130" text-anchor="middle" font-size="11" fill="#8c2f2c" filter="url(#rough2)">e2</text>
  <line x1="436" y1="150" x2="514" y2="150" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="475" y="130" text-anchor="middle" font-size="11" fill="#8c2f2c" filter="url(#rough2)">e3</text>
  <text x="360" y="220" text-anchor="middle" font-size="11.5" fill="#335478" filter="url(#rough2)">c=(2,3,1) 时：e1=4, e2=2, e3=0 ✓（可为每个 e_i ≥ 2 的内部边找欧拉回路）</text>
  <text x="360" y="250" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">每条边复制 e_i 次 ⇒ 连通偶度多重图 ⇒ 欧拉回路就是圆环</text>
  <text x="360" y="285" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">判定：值连续 + 中间 e_i≥2 + 末尾 e_p=0</text>
</svg>
