<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">算法流程：排序一次，扫描一遍</text>
  <text x="300" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每组 O(n log n)，t ≤ 500、n ≤ 100 时总运算量可以忽略</text>

  <rect x="180" y="64" width="240" height="42" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="90" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">读入 n 与 b₁ … bₙ</text>
  <path d="M300,106 L300,128" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="130" width="300" height="42" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="156" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">降序排序：a₁ ≥ a₂ ≥ … ≥ aₙ</text>
  <path d="M300,172 L300,194" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="196" width="380" height="46" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="218" text-anchor="middle" font-size="11.5" fill="#33506b" filter="url(#rough2)">对 i = 1 … n−2 检查 a[i] mod a[i+1] = a[i+2]</text>
  <text x="300" y="234" text-anchor="middle" font-size="10" fill="#7a8ba6" filter="url(#rough2)">一旦某一位不成立，立刻 break</text>

  <path d="M300,242 L300,258" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M300,258 L172,276" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M300,258 L428,276" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="212" y="266" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <text x="388" y="266" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="60" y="280" width="212" height="52" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="166" y="302" text-anchor="middle" font-size="11.5" fill="#3c6130" filter="url(#rough2)">全部成立：输出 x = a₁, y = a₂</text>
  <text x="166" y="320" text-anchor="middle" font-size="10" fill="#5f8a50" filter="url(#rough2)">降序序列本身就是合法链</text>

  <rect x="328" y="280" width="212" height="52" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="434" y="302" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">任意一位不成立：输出 −1</text>
  <text x="434" y="320" text-anchor="middle" font-size="10" fill="#a8605c" filter="url(#rough2)">重排无法挽救顺序</text>

  <text x="300" y="360" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">不需要枚举 (x, y) 对：候选顺序只有降序这一种</text>
  <text x="300" y="382" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">多测共 t 组，逐组独立处理，无跨组状态</text>
</svg>
