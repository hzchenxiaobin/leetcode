<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="21"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2b2b2b"/>
    </marker>
  </defs>

  <rect width="760" height="400" fill="#fafafa"/>
  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 3 走查：n = 19，"Hello! Do you like fish? Why?" → 3 条</text>
  <path d="M 70 40 Q 380 46 690 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 三条短信的容量条：宽 190，x 从 70 开始，末端 260 -->
  <g filter="url(#rough2)" stroke="#446688" stroke-width="1.2" fill="#eef2f7">
    <rect x="70" y="70"  width="190" height="24"/>
    <rect x="70" y="150" width="190" height="24"/>
    <rect x="70" y="230" width="190" height="24"/>
  </g>
  <g font-size="11" fill="#2f4a66" filter="url(#rough2)">
    <text x="70" y="64">短信 1 容量 19</text>
    <text x="70" y="144">短信 2 容量 19</text>
    <text x="70" y="224">短信 3 容量 19</text>
  </g>

  <!-- 行 1：Hello!(6) 然后尝试 Do you like fish?(17) -->
  <g filter="url(#rough2)">
    <rect x="70" y="70" width="60" height="24" fill="#d7ecd9" stroke="#2f7a3a" stroke-width="1.4"/>
    <text x="100" y="87" text-anchor="middle" font-size="10.5" fill="#1f5226">Hello!</text>
    <rect x="140" y="70" width="10" height="24" fill="#f0f0f0" stroke="#aaa" stroke-width="0.8"/>
    <rect x="150" y="70" width="170" height="24" fill="#fdecea" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="235" y="87" text-anchor="middle" font-size="10.5" fill="#8c2f2b">Do you like fish?（17）</text>
  </g>
  <text x="330" y="87" font-size="11.5" fill="#8c2f2b" filter="url(#rough2)">6 + 1 + 17 = 24 &gt; 19 → 放不下</text>

  <!-- 行 2：Do you like fish?(17) 尝试 Why?(4) -->
  <g filter="url(#rough2)">
    <rect x="70" y="150" width="170" height="24" fill="#d7ecd9" stroke="#2f7a3a" stroke-width="1.4"/>
    <text x="155" y="167" text-anchor="middle" font-size="10.5" fill="#1f5226">Do you like fish?</text>
    <rect x="240" y="150" width="10" height="24" fill="#f0f0f0" stroke="#aaa" stroke-width="0.8"/>
    <rect x="250" y="150" width="40" height="24" fill="#fdecea" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="270" y="167" text-anchor="middle" font-size="10.5" fill="#8c2f2b">Why?</text>
  </g>
  <text x="330" y="167" font-size="11.5" fill="#8c2f2b" filter="url(#rough2)">17 + 1 + 4 = 22 &gt; 19 → 放不下</text>

  <!-- 行 3：Why?(4) -->
  <g filter="url(#rough2)">
    <rect x="70" y="230" width="40" height="24" fill="#d7ecd9" stroke="#2f7a3a" stroke-width="1.4"/>
    <text x="90" y="247" text-anchor="middle" font-size="10.5" fill="#1f5226">Why?</text>
  </g>
  <text x="330" y="247" font-size="11.5" fill="#555" filter="url(#rough2)">单独一条即可</text>

  <!-- 结论 -->
  <rect x="60" y="286" width="640" height="46" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="307" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">共 3 条短信，与官方输出 3 一致。每条的长度依次是 6、17、4，都 ≤ 19。</text>
  <text x="76" y="326" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">句子内部不许断：若某句本身就比 n 长（样例 2 的 "How are you?" 有 12 &gt; 2），直接 Impossible。</text>

  <rect x="60" y="344" width="640" height="42" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="76" y="366" font-size="12" fill="#2f4a66" filter="url(#rough2)">切分只发生在句子之间；句子之间的空格在跨短信时被丢掉，所以不计入长度。</text>
  <text x="76" y="382" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">这三处"放不下"的判断正是贪心的全部内容：一遍扫描，O(文本长度)。</text>
</svg>
