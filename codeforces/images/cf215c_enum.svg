<svg xmlns="http://www.w3.org/2000/svg" width="730" height="290" viewBox="0 0 730 290"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="730" height="290" fill="#fafafa"/>
  <text x="365.0" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">215C：枚举与去重</text>
  <path d="M 146.00 46 Q 365.0 52 584.00 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60" y="78" width="290" height="110" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="95" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">a,c ≤ (n−1)/2，b,d ≤ (m−1)/2</text>
  <text x="74" y="116" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">否则放置数为 0</text>
  <text x="74" y="137" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">固定 a,b,c 后 d 唯一（每种情形）</text>
  <rect x="380" y="78" width="290" height="110" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="394" y="95" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">退化情形 C1 = minA 且 s = A1·B1 时</text>
  <text x="394" y="116" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">所有 d &lt; b 都成立，要循环累加</text>
  <text x="394" y="137" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">时间 O(n²m) ≤ 1.6×10⁷</text>
  <text x="60" y="196" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">样例 2 2 1 → 4；3 4 5 → 4。</text>
</svg>
