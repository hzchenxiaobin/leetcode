<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="453"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="330" fill="#fafafa"/>
  <text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">第 i 天：热度 b_i 的新闻沿 g 恰好传到 b_i 个人</text>
  <path d="M 60 38 Q 380 46 700 38" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <g font-size="10.5">
    <rect x="34" y="70" width="112" height="58" rx="9" fill="#d9ecd4" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="90" y="92" text-anchor="middle" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">a_i</text>
    <text x="90" y="108" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">热度 b_i</text>
    <text x="90" y="121" text-anchor="middle" font-size="9" fill="#555555" filter="url(#rough2)">第 1 个（新）</text>

    <rect x="176" y="70" width="112" height="58" rx="9" fill="#d9ecd4" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="232" y="92" text-anchor="middle" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">g(a_i)</text>
    <text x="232" y="108" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">热度 b_i − 1</text>
    <text x="232" y="121" text-anchor="middle" font-size="9" fill="#555555" filter="url(#rough2)">第 2 个（新）</text>

    <rect x="318" y="70" width="112" height="58" rx="9" fill="#f6d5d5" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="374" y="92" text-anchor="middle" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">g²(a_i)</text>
    <text x="374" y="108" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">热度 b_i − 2</text>
    <text x="374" y="121" text-anchor="middle" font-size="9" fill="#8a2b28" filter="url(#rough2)">以前学过，不计数</text>

    <rect x="460" y="70" width="112" height="58" rx="9" fill="#f6d5d5" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="516" y="92" text-anchor="middle" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">g³(a_i)</text>
    <text x="516" y="108" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">热度 b_i − 3</text>
    <text x="516" y="121" text-anchor="middle" font-size="9" fill="#8a2b28" filter="url(#rough2)">以前学过，不计数</text>

    <rect x="602" y="70" width="124" height="58" rx="9" fill="#cfe0f5" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="664" y="92" text-anchor="middle" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">g^(b_i−1)(a_i)</text>
    <text x="664" y="108" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">热度 1</text>
    <text x="664" y="121" text-anchor="middle" font-size="9" fill="#555555" filter="url(#rough2)">第 b_i 个</text>
  </g>
  <path d="M 148 99 L 172 99" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 290 99 L 314 99" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 432 99 L 456 99" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 574 99 L 598 99" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <text x="34" y="160" font-size="11.5" fill="#555555" filter="url(#rough2)">路径长度 = b_i：a_i 自己算第 1 个，之后每转述一次热度减 1，共 b_i 个人收到这条新闻。</text>

  <rect x="34" y="180" width="692" height="56" rx="9" fill="#fbe3c8" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="50" y="202" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">res_i 只统计"在 m 天里第一次学到新闻"的人：路径上已被前面的新闻点亮的人不再计数。</text>
  <text x="50" y="222" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">同一个人可以在同一天以不同热度多次收到同一条新闻，但最多只算一次。</text>

  <rect x="34" y="250" width="692" height="56" rx="9" fill="#cfe0f5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="50" y="272" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">每天新闻的起点由前一天的结果决定：a_i = ((v_i + res_(i−1) − 1) mod n) + 1，res_0 = 0。</text>
  <text x="50" y="292" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">所以必须按天依次计算，不能离线重排。</text>
</svg>
