<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="350" fill="#fafafa" filter="url(#rough2)"/>

  <text x="290" y="28" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#444" filter="url(#rough2)">连续整数的 k 项和：区间 [min_k, max_k] 里的整数全都能取到</text>
  <text x="290" y="50" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">取最小的 k 个数得 min_k，取最大的 k 个数得 max_k；每次把某个数 +1 就能让和 +1，故中间没有空洞</text>

  <path d="M 96 82 L 530 82" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 528 78 L 536 82 L 528 86" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <path d="M 132 78 L 132 86" stroke="#999" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 168 78 L 168 86" stroke="#999" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 204 78 L 204 86" stroke="#999" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 240 78 L 240 86" stroke="#999" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 276 78 L 276 86" stroke="#999" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 312 78 L 312 86" stroke="#999" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 348 78 L 348 86" stroke="#999" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 384 78 L 384 86" stroke="#999" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 420 78 L 420 86" stroke="#999" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 456 78 L 456 86" stroke="#999" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 492 78 L 492 86" stroke="#999" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <text x="132" y="98" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">0</text>
  <text x="168" y="98" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">1</text>
  <text x="204" y="98" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">2</text>
  <text x="240" y="98" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">3</text>
  <text x="276" y="98" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">4</text>
  <text x="312" y="98" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">5</text>
  <text x="348" y="98" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">6</text>
  <text x="384" y="98" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">7</text>
  <text x="420" y="98" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">8</text>
  <text x="456" y="98" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">9</text>
  <text x="492" y="98" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">10</text>

  <path d="M 492 68 L 492 204" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 3" fill="none" filter="url(#rough2)"/>
  <text x="492" y="218" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">T = 10</text>

  <rect x="132" y="106" width="144" height="18" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="168" y="130" width="216" height="18" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="240" y="154" width="216" height="18" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="348" y="178" width="144" height="18" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>

  <text x="126" y="119" text-anchor="end" font-size="10" fill="#3a4a66" filter="url(#rough2)">k = 1</text>
  <text x="126" y="143" text-anchor="end" font-size="10" fill="#3a4a66" filter="url(#rough2)">k = 2</text>
  <text x="126" y="167" text-anchor="end" font-size="10" fill="#3a4a66" filter="url(#rough2)">k = 3</text>
  <text x="126" y="191" text-anchor="end" font-size="10" fill="#3a5a30" filter="url(#rough2)">k = 4</text>

  <text x="204" y="119" text-anchor="middle" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">[0, 4]</text>
  <text x="276" y="143" text-anchor="middle" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">[1, 7]</text>
  <text x="348" y="167" text-anchor="middle" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">[3, 9]</text>
  <text x="420" y="191" text-anchor="middle" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">[6, 10]</text>

  <text x="288" y="120" font-size="12" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="396" y="144" font-size="12" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="468" y="168" font-size="12" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="504" y="192" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <rect x="52" y="232" width="476" height="52" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="68" y="252" font-size="10" fill="#8a6a20" filter="url(#rough2)">min_k = k·l + k(k−1)/2（取 k 个最小数）    max_k = k·r − k(k−1)/2（取 k 个最大数）</text>
  <text x="68" y="272" font-size="10" fill="#555" filter="url(#rough2)">k 项和能取遍区间内每个整数 ⇒ 存在 k 个不同的数之和恰为 T ⟺ min_k ≤ T ≤ max_k</text>

  <rect x="52" y="294" width="476" height="40" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="319" text-anchor="middle" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">[0, 4]：T = 10；k = 1, 2, 3 均不含 10，k = 4 的 [6, 10] 含 10 ⇒ 答案 = 4 − 1 = 3</text>

  <text x="290" y="346" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">k = n 时 min_n = max_n = T，所以一定有解，答案最大为 n − 1</text>
</svg>
