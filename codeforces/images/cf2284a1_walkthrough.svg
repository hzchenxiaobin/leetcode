<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="340" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">样例走查：S = ⌊n/2⌋ · ⌈n/2⌉ = ⌊n²/4⌋</text>

  <rect x="34" y="42" width="572" height="266" rx="8" fill="#ffffff"
        stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M44,80 L596,80" stroke="#999" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M44,124 L596,124" stroke="#ddd" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M44,166 L596,166" stroke="#ddd" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M44,208 L596,208" stroke="#ddd" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M44,250 L596,250" stroke="#ddd" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <text x="70" y="70" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">n</text>
  <text x="145" y="70" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">⌊n/2⌋</text>
  <text x="210" y="70" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">⌈n/2⌉</text>
  <text x="330" y="70" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">构造 (A;B;C)</text>
  <text x="460" y="70" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">S</text>
  <text x="560" y="70" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">官方输出</text>

  <text x="70" y="112" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="145" y="112" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="210" y="112" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="330" y="112" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(0,0) (1,0) (0,1)</text>
  <text x="460" y="112" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="560" y="112" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1 ✓</text>

  <text x="70" y="154" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="145" y="154" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="210" y="154" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="330" y="154" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(0,0) (3,0) (0,2)</text>
  <text x="460" y="154" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">6</text>
  <text x="560" y="154" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">6 ✓</text>

  <text x="70" y="196" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">15</text>
  <text x="145" y="196" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <text x="210" y="196" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>
  <text x="330" y="196" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(0,0) (8,0) (0,7)</text>
  <text x="460" y="196" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">56</text>
  <text x="560" y="196" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">56 ✓</text>

  <text x="70" y="238" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">43</text>
  <text x="145" y="238" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">21</text>
  <text x="210" y="238" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">22</text>
  <text x="330" y="238" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(0,0) (22,0) (0,21)</text>
  <text x="460" y="238" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">462</text>
  <text x="560" y="238" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">462 ✓</text>

  <rect x="44" y="252" width="552" height="42" rx="6" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="70" y="280" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">769</text>
  <text x="145" y="280" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">384</text>
  <text x="210" y="280" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">385</text>
  <text x="330" y="280" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(0,0) (385,0) (0,384)</text>
  <text x="460" y="280" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">147840</text>
  <text x="560" y="280" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">147840 ✓</text>

  <text x="320" y="325" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">奇数 n 时两列不等，乘积仍恰为 floor(n²/4)</text>
</svg>
