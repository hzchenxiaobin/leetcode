<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="89"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="tn" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="720" height="420" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">省与省之间只能靠隧道连通，每个省能出的端点数 ≤ min(k, 省大小)</text>
  <path d="M 100 40 Q 360 46 620 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 三个省 -->
  <g filter="url(#rough2)">
    <ellipse cx="150" cy="150" rx="82" ry="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <ellipse cx="390" cy="112" rx="72" ry="50" fill="#e6f4ea" stroke="#2f7a3a" stroke-width="1.8"/>
    <ellipse cx="400" cy="268" rx="88" ry="58" fill="#fdecea" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="150" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">省 A（3 城）</text>
  <text x="390" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f5226" filter="url(#rough2)">省 B（2 城）</text>
  <text x="400" y="218" text-anchor="middle" font-size="12" font-weight="bold" fill="#8c2f2b" filter="url(#rough2)">省 C（1 城）</text>

  <g filter="url(#rough2)">
    <circle cx="118" cy="140" r="7" fill="#2f4a66"/><circle cx="150" cy="168" r="7" fill="#2f4a66"/><circle cx="182" cy="138" r="7" fill="#2f4a66"/>
    <circle cx="368" cy="106" r="7" fill="#1f5226"/><circle cx="412" cy="122" r="7" fill="#1f5226"/>
    <circle cx="400" cy="268" r="7" fill="#8c2f2b"/>
  </g>
  <text x="150" y="200" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">d_A = min(k,3)</text>
  <text x="390" y="158" text-anchor="middle" font-size="11" fill="#1f5226" filter="url(#rough2)">d_B = min(k,2)</text>
  <text x="400" y="308" text-anchor="middle" font-size="11" fill="#8c2f2b" filter="url(#rough2)">d_C = min(k,1)</text>

  <!-- 隧道 -->
  <g filter="url(#rough2)" stroke="#b85450" stroke-width="2.4" fill="none" stroke-dasharray="7 4">
    <line x1="228" y1="140" x2="322" y2="120" marker-end="url(#tn)"/>
    <line x1="360" y1="158" x2="368" y2="226" marker-end="url(#tn)"/>
  </g>
  <text x="266" y="112" text-anchor="middle" font-size="11" fill="#8c2f2b" filter="url(#rough2)">隧道 1</text>
  <text x="336" y="200" text-anchor="middle" font-size="11" fill="#8c2f2b" filter="url(#rough2)">隧道 2</text>

  <!-- 条件框 -->
  <rect x="510" y="120" width="180" height="150" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="526" y="146" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">可行性条件</text>
  <text x="526" y="176" font-size="13" font-weight="bold" fill="#8c2f2b" filter="url(#rough2)">Σ d_i ≥ 2(p−1)</text>
  <text x="526" y="202" font-size="11" fill="#7a5a1b" filter="url(#rough2)">p 个省需要 p−1 条</text>
  <text x="526" y="220" font-size="11" fill="#7a5a1b" filter="url(#rough2)">隧道、2(p−1) 个端点</text>
  <text x="526" y="248" font-size="11" fill="#7a5a1b" filter="url(#rough2)">且每个 d_i ≥ 1</text>

  <!-- 修路 -->
  <rect x="60" y="344" width="620" height="60" rx="10" fill="#e6f4ea" stroke="#2f7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="368" font-size="12.5" font-weight="bold" fill="#1f5226" filter="url(#rough2)">新修一条道路 = 把两个省合并成一个省（省的大小相加、个数减 1）</text>
  <text x="76" y="392" font-size="11.5" fill="#2f5223" filter="url(#rough2)">所以“最少修路”= “用最少的合并次数让 Σ min(k, 合并后的省大小) ≥ 2(省数−1)”</text>
</svg>
