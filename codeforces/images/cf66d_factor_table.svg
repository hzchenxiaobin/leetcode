<svg xmlns="http://www.w3.org/2000/svg" width="820" height="450" viewBox="0 0 820 450"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="29"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="820" height="450" fill="#fafafa"/>

  <text x="410" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">因子表：每列恰被两个数占用，没有一列被三个数同时占用</text>
  <text x="410" y="58" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">「有该素因子」记 ✓，「没有」记 ×</text>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="80" y="78" width="400" height="42" rx="6" fill="#eef2f6" stroke="#888888" stroke-width="1.4"/>
    <text x="150" y="105" text-anchor="middle" font-size="13" fill="#444444">数</text>
    <text x="265" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66">2</text>
    <text x="360" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5223">3</text>
    <text x="455" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a2b28">5</text>
  </g>

  <!-- 三行 -->
  <g filter="url(#rough2)">
    <rect x="80" y="120" width="400" height="52" fill="#fbfbfb" stroke="#cccccc" stroke-width="1.2"/>
    <rect x="80" y="172" width="400" height="52" fill="#fbfbfb" stroke="#cccccc" stroke-width="1.2"/>
    <rect x="80" y="224" width="400" height="52" fill="#fbfbfb" stroke="#cccccc" stroke-width="1.2"/>
    <line x1="215" y1="78" x2="215" y2="276" stroke="#cccccc" stroke-width="1.2"/>
    <line x1="310" y1="78" x2="310" y2="276" stroke="#cccccc" stroke-width="1.2"/>
    <line x1="405" y1="78" x2="405" y2="276" stroke="#cccccc" stroke-width="1.2"/>

    <text x="150" y="152" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">15</text>
    <text x="150" y="204" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">10</text>
    <text x="150" y="256" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">6</text>

    <text x="265" y="152" text-anchor="middle" font-size="16" fill="#b85450">×</text>
    <text x="360" y="152" text-anchor="middle" font-size="16" fill="#4a7a3a">✓</text>
    <text x="455" y="152" text-anchor="middle" font-size="16" fill="#4a7a3a">✓</text>

    <text x="265" y="204" text-anchor="middle" font-size="16" fill="#4a7a3a">✓</text>
    <text x="360" y="204" text-anchor="middle" font-size="16" fill="#b85450">×</text>
    <text x="455" y="204" text-anchor="middle" font-size="16" fill="#4a7a3a">✓</text>

    <text x="265" y="256" text-anchor="middle" font-size="16" fill="#4a7a3a">✓</text>
    <text x="360" y="256" text-anchor="middle" font-size="16" fill="#4a7a3a">✓</text>
    <text x="455" y="256" text-anchor="middle" font-size="16" fill="#b85450">×</text>
  </g>

  <!-- 右侧结论 -->
  <g filter="url(#rough2)">
    <rect x="520" y="78" width="260" height="198" rx="10" fill="#eef6e8" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="536" y="104" font-size="12" font-weight="bold" fill="#2f5223">两两 gcd</text>
    <text x="536" y="130" font-size="11.5" fill="#2f5223">gcd(15, 10) = 5</text>
    <text x="536" y="154" font-size="11.5" fill="#2f5223">gcd(15, 6) = 3</text>
    <text x="536" y="178" font-size="11.5" fill="#2f5223">gcd(10, 6) = 2</text>
    <line x1="536" y1="196" x2="764" y2="196" stroke="#4a7a3a" stroke-width="1.1" stroke-dasharray="4 3"/>
    <text x="536" y="220" font-size="12" font-weight="bold" fill="#8a2b28">整体 gcd</text>
    <text x="536" y="246" font-size="11.5" fill="#8a2b28">gcd(15, 10, 6) = 1</text>
    <text x="536" y="266" font-size="10.5" fill="#8a2b28">（三列没有公共的 ✓）</text>
  </g>

  <g filter="url(#rough2)">
    <text x="80" y="316" font-size="12" fill="#444444">每一列都恰好有两个 ✓：任意两个数都共享至少一个素因子。</text>
    <text x="80" y="342" font-size="12" fill="#444444">没有任何一列有三个 ✓：三个数没有公共素因子。</text>
    <text x="80" y="368" font-size="12" fill="#444444">于是两两 gcd 全都大于 1，而整体 gcd 等于 1。</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="394" width="700" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="76" y="419" font-size="11.5" fill="#8a6015">剩下的 n−3 个数取 30k：它们同时占满三列，与上面三个数、与彼此都相交，但无法把某一列变成「三列全 ✓」。</text>
  </g>
</svg>
