<svg xmlns="http://www.w3.org/2000/svg" width="700" height="420" viewBox="0 0 700 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="29"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="700" height="420" fill="#fafafa"/>

  <text x="350" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：第 m 个 1 的边际代价是 2^(m−1)</text>
  <path d="M 160 40 Q 350 47 540 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="350" y="60" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">同样要 m 个 1，最便宜的整数就是 2^m − 1：把 1 全塞在最低位</text>

  <rect x="34" y="76" width="320" height="244" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="52" y="98" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">m 个 1 的最小整数 = 2^m − 1</text>

  <g font-size="12" fill="#5a4a20" filter="url(#rough2)">
    <text x="58" y="124" font-weight="bold">m</text>
    <text x="120" y="124" font-weight="bold">最小整数</text>
    <text x="218" y="124" font-weight="bold">二进制</text>
    <text x="296" y="124" font-weight="bold">花费</text>
    <path d="M 52 132 L 336 132" stroke="#d6a040" stroke-width="1.1" fill="none"/>

    <text x="64" y="156">1</text><text x="122" y="156">1</text><text x="226" y="156">1</text><text x="302" y="156">1</text>
    <text x="64" y="184">2</text><text x="122" y="184">3</text><text x="226" y="184">11</text><text x="302" y="184">3</text>
    <text x="64" y="212">3</text><text x="122" y="212">7</text><text x="226" y="212">111</text><text x="302" y="212">7</text>
    <text x="64" y="240">4</text><text x="122" y="240">15</text><text x="226" y="240">1111</text><text x="302" y="240">15</text>
    <text x="64" y="268">5</text><text x="122" y="268">31</text><text x="226" y="268">11111</text><text x="302" y="268">31</text>
  </g>

  <text x="50" y="296" font-size="11.5" fill="#8a6015" filter="url(#rough2)">每多要一个 1，就多花「翻倍」的钱：1 → 2 → 4 → 8</text>
  <text x="50" y="312" font-size="11" fill="#a08040" filter="url(#rough2)">因为 popcount(a) = m 时必有 a ≥ 2^m − 1</text>

  <rect x="374" y="90" width="292" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="520" y="114" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">第 1 个 1：代价 1（把 0 变成 1）</text>

  <path d="M 520 130 L 520 148" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="374" y="152" width="292" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="520" y="176" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">第 2 个 1：再花 2（升到 11）</text>

  <path d="M 520 192 L 520 210" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="374" y="214" width="292" height="38" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="520" y="238" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">第 3 个 1：再花 4（升到 111）</text>

  <path d="M 520 254 L 520 272" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="374" y="276" width="292" height="38" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="520" y="300" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">第 4 个 1：再花 8（升到 1111）</text>

  <rect x="34" y="332" width="632" height="66" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="356" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">k 个数各自的边际代价拼成一条非降序列</text>
  <text x="350" y="376" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">1,…,1(k 个)，2,…,2(k 个)，4,…,4(k 个)，8,…  →  从便宜到贵依次买，能买几个就是答案</text>
</svg>
