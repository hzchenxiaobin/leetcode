<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="410" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">③ 固定 M：向上取整到 2^M 的倍数，再取后缀最小值</text>
  <text x="320" y="50" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">h_M(a) = S_M(a) − a，S_M(a) = min{ P(x) : x ≥ a 且 2^M 整除 x }，其中 P(x) = x + f(x)</text>

  <text x="40" y="80" font-size="12" fill="#33517a" filter="url(#rough2)">x（M = 1 时的偶数倍数）</text>
  <g filter="url(#rough2)">
    <rect x="40" y="90" width="100" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="152" y="90" width="100" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="264" y="90" width="100" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="376" y="90" width="100" height="40" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="488" y="90" width="100" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g font-size="15" text-anchor="middle" font-weight="bold" fill="#33517a" filter="url(#rough2)">
    <text x="90" y="117">58</text>
    <text x="202" y="117">60</text>
    <text x="314" y="117">62</text>
    <text x="426" y="117" fill="#7a5a10">64</text>
    <text x="538" y="117">66</text>
  </g>

  <text x="40" y="154" font-size="12" fill="#8a3a36" filter="url(#rough2)">P(x) = x + f(x)（不单调：62 → 64 反而变小）</text>
  <g filter="url(#rough2)">
    <rect x="40" y="164" width="100" height="40" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="152" y="164" width="100" height="40" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="264" y="164" width="100" height="40" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="376" y="164" width="100" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="488" y="164" width="100" height="40" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <g font-size="15" text-anchor="middle" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">
    <text x="90" y="191">67</text>
    <text x="202" y="191">69</text>
    <text x="314" y="191">72</text>
    <text x="426" y="191" fill="#3a5a30">71</text>
    <text x="538" y="191">74</text>
  </g>

  <g filter="url(#rough2)" stroke="#888" stroke-width="1.2" fill="none">
    <path d="M 314 208 L 314 220" marker-end="url(#arr)"/>
    <path d="M 426 208 L 426 220" marker-end="url(#arr)"/>
    <path d="M 538 208 L 538 220" marker-end="url(#arr)"/>
  </g>

  <text x="40" y="240" font-size="12" fill="#3a5a30" filter="url(#rough2)">S_M(a)：从右往左取 min（后缀最小）</text>
  <g filter="url(#rough2)">
    <rect x="40" y="250" width="100" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="152" y="250" width="100" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="264" y="250" width="100" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="376" y="250" width="100" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="488" y="250" width="100" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <g font-size="15" text-anchor="middle" font-weight="bold" fill="#3a5a30" filter="url(#rough2)">
    <text x="90" y="277">67</text>
    <text x="202" y="277">69</text>
    <text x="314" y="277">71</text>
    <text x="426" y="277">71</text>
    <text x="538" y="277">74</text>
  </g>

  <g font-size="11.5" fill="#555" filter="url(#rough2)">
    <text x="40" y="314">例：a = 62 时只取「下一个倍数」会得到 P(62) = 72；而 S(62) = min(72, 71, 74) = 71</text>
    <text x="40" y="332">来自 x = 64 —— 跳到更远的倍数反而更便宜，所以必须预处理后缀最小，而不是只算下一个倍数。</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="36" y="346" width="568" height="50" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7"/>
  </g>
  <g font-size="13" text-anchor="middle" filter="url(#rough2)">
    <text x="320" y="376" fill="#7a5a10" font-weight="bold">F(M) = Σ h_M(a_i) −（n − 1）· M　，　答案 = min{ F(M) : 0 ≤ M ≤ 17 }</text>
  </g>
</svg>
