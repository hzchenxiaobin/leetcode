  <text x="60" y="352" font-size="12" fill="#2b2b2b" filter="url(#rough2)">绿色 = need 为 0 的 ready 格，红色 = 本轮选中的值，"用" = 已放置</text>
  <text x="60" y="374" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">答案 4 1 5 2 3，与官方输出一致</text>
