  <g font-size="13" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">
    <text x="76" y="262">3</text>
    <text x="153" y="262">用</text>
    <text x="238" y="262">0</text>
    <text x="323" y="262">0</text>
    <text x="408" y="262">用</text>
    <text x="493" y="262">用</text>
    <text x="586" y="262" font-weight="bold" fill="#8a2b28">2</text>
  </g>

  <g filter="url(#rough2)">
