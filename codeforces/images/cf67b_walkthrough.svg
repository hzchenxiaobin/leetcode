<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>
  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 n=5, k=2, b=(1,2,1,0,0) 的逐位走查</text>
  <path d="M 90 42 Q 360 48 630 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 表头 -->
  <text x="60" y="76" font-size="12" fill="#555" filter="url(#rough2)">步</text>
  <text x="130" y="76" font-size="12" fill="#555" filter="url(#rough2)">need[1]</text>
  <text x="215" y="76" font-size="12" fill="#555" filter="url(#rough2)">need[2]</text>
  <text x="300" y="76" font-size="12" fill="#555" filter="url(#rough2)">need[3]</text>
  <text x="385" y="76" font-size="12" fill="#555" filter="url(#rough2)">need[4]</text>
  <text x="470" y="76" font-size="12" fill="#555" filter="url(#rough2)">need[5]</text>
  <text x="570" y="76" font-size="12" fill="#555" filter="url(#rough2)">选中</text>

  <!-- 行 -->
  <g filter="url(#rough2)">
    <rect x="52" y="86" width="48" height="42" fill="#f4f0fa" stroke="#7a4a8a" stroke-width="1.2"/>
    <rect x="120" y="86" width="66" height="42" fill="#ffffff" stroke="#999" stroke-width="1.1"/>
    <rect x="205" y="86" width="66" height="42" fill="#ffffff" stroke="#999" stroke-width="1.1"/>
    <rect x="290" y="86" width="66" height="42" fill="#ffffff" stroke="#999" stroke-width="1.1"/>
    <rect x="375" y="86" width="66" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="460" y="86" width="66" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="546" y="86" width="80" height="42" fill="#fde8e6" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">
