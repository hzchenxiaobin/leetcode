    <text x="153" y="212">用</text>
    <text x="238" y="212">1</text>
    <text x="323" y="212">1</text>
    <text x="408" y="212">用</text>
    <text x="493" y="212">0</text>
    <text x="586" y="212" font-weight="bold" fill="#8a2b28">5</text>
  </g>

  <g filter="url(#rough2)">
