    <rect x="120" y="286" width="66" height="42" fill="#f2f2f2" stroke="#999" stroke-width="1.1" stroke-dasharray="4 3"/>
    <rect x="205" y="286" width="66" height="42" fill="#f2f2f2" stroke="#999" stroke-width="1.1" stroke-dasharray="4 3"/>
    <rect x="290" y="286" width="66" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="375" y="286" width="66" height="42" fill="#f2f2f2" stroke="#999" stroke-width="1.1" stroke-dasharray="4 3"/>
    <rect x="460" y="286" width="66" height="42" fill="#f2f2f2" stroke="#999" stroke-width="1.1" stroke-dasharray="4 3"/>
