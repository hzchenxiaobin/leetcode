<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough1">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="660" height="420" fill="#fafafa"/>

  <text x="330" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">
    全局 BFS 序 B：前缀 = 层前缀，答案关于长度单调
  </text>

  <!-- ===== left: BFS tree with levels ===== -->
  <line x1="40" y1="120" x2="322" y2="120" stroke="#bbbbbb" stroke-width="1.2"
        stroke-dasharray="5 5" filter="url(#rough2)"/>
  <line x1="40" y1="184" x2="322" y2="184" stroke="#bbbbbb" stroke-width="1.2"
        stroke-dasharray="5 5" filter="url(#rough2)"/>
  <text x="44" y="116" font-size="10" fill="#999" filter="url(#rough2)">第 0 层</text>
  <text x="44" y="180" font-size="10" fill="#999" filter="url(#rough2)">第 1 层</text>
  <text x="44" y="244" font-size="10" fill="#999" filter="url(#rough2)">第 2 层</text>

  <line x1="170" y1="86" x2="110" y2="150" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="170" y1="86" x2="230" y2="150" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="110" y1="150" x2="75" y2="214" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="110" y1="150" x2="150" y2="214" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="230" y1="150" x2="215" y2="214" stroke="#9a9a9a" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="230" y1="150" x2="285" y2="214" stroke="#9a9a9a" stroke-width="1.6" filter="url(#rough2)"/>

  <circle cx="170" cy="86" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="110" cy="150" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="230" cy="150" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="75" cy="214" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="150" cy="214" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="215" cy="214" r="14" fill="#eeeeee" stroke="#9a9a9a" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="285" cy="214" r="14" fill="#eeeeee" stroke="#9a9a9a" stroke-width="1.6" filter="url(#rough2)"/>

  <text x="170" y="91" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">r</text>
  <text x="170" y="264" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <text x="100" y="266" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="238" y="266" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="63" y="266" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <text x="160" y="266" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">4</text>
  <text x="205" y="266" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">5</text>
  <text x="288" y="266" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">6</text>
  <text x="160" y="290" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">
    绿色 = 在前缀 B[0..4] 内
  </text>

  <!-- ===== right: step function ===== -->
  <line x1="390" y1="290" x2="640" y2="290" stroke="#446688" stroke-width="1.8"
        marker-end="url(#arrG)" filter="url(#rough2)"/>
  <line x1="390" y1="290" x2="390" y2="96" stroke="#446688" stroke-width="1.8"
        marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="378" y="110" text-anchor="end" font-size="12" fill="#446688" filter="url(#rough2)">f(j)</text>
  <text x="634" y="308" text-anchor="end" font-size="12" fill="#446688" filter="url(#rough2)">j</text>

  <path d="M 392 138 L 528 138 L 528 236 L 634 236" fill="none" stroke="#b85450"
        stroke-width="2.4" filter="url(#rough2)"/>
  <line x1="528" y1="138" x2="528" y2="288" stroke="#b85450" stroke-width="1.2"
        stroke-dasharray="5 4" filter="url(#rough2)"/>

  <text x="400" y="130" font-size="12" fill="#333" filter="url(#rough2)">1（二分）</text>
  <text x="540" y="228" font-size="12" fill="#333" filter="url(#rough2)">0（非二分）</text>
  <text x="528" y="308" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">P</text>
  <text x="572" y="276" text-anchor="middle" font-size="12" fill="#8c3a36" filter="url(#rough2)">
    j ≥ P ⇒ 四端点都在
  </text>

  <!-- ===== bottom note ===== -->
  <rect x="34" y="330" width="592" height="78" rx="10" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough1)"/>
  <text x="330" y="356" text-anchor="middle" font-size="13" fill="#2f4f3a" filter="url(#rough2)">
    问 S = B[0..j-1]：答 0 ⟺ 四个端点全在 S 内 ⟹ f 单调 ⟹ 二分出 P（≤11 次）
  </text>
  <text x="330" y="382" text-anchor="middle" font-size="13" fill="#2f4f3a" filter="url(#rough2)">
    x = B[P-1] 即“BFS 位置最靠后”的隐藏端点；② ③ 复用同一个层前缀手法
  </text>
</svg>
