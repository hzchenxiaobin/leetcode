<svg xmlns="http://www.w3.org/2000/svg" width="740" height="440" viewBox="0 0 740 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="740" height="440" fill="#fafafa"/>
  <text x="370" y="34" font-size="19" fill="#2b2b2b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">逐目标 DP：dp[j] = 恰好摧毁 j 个的概率（只保留 j &lt; K）</text>
  <text x="70" y="92" font-size="12.5" fill="#44546a" text-anchor="start" font-weight="bold" filter="url(#rough2)">处理第 i 个目标之前</text>
  <rect x="70" y="104" width="104" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="122.0" y="133" font-size="13" fill="#2f4a66" text-anchor="middle" filter="url(#rough2)">dp[0]</text>
  <rect x="186" y="104" width="104" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="238.0" y="133" font-size="13" fill="#2f4a66" text-anchor="middle" filter="url(#rough2)">dp[1]</text>
  <rect x="302" y="104" width="104" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="354.0" y="133" font-size="13" fill="#2f4a66" text-anchor="middle" filter="url(#rough2)">dp[2]</text>
  <rect x="418" y="104" width="104" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470.0" y="133" font-size="13" fill="#2f4a66" text-anchor="middle" filter="url(#rough2)">dp[3]</text>
  <rect x="534" y="104" width="104" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="586.0" y="133" font-size="13" fill="#2f4a66" text-anchor="middle" filter="url(#rough2)">dp[4]</text>
  <text x="70" y="226" font-size="12.5" fill="#2f5223" text-anchor="start" font-weight="bold" filter="url(#rough2)">处理之后（p = 第 i 个目标的摧毁概率）</text>
  <rect x="70" y="238" width="104" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="122.0" y="267" font-size="13" fill="#2f5223" text-anchor="middle" filter="url(#rough2)">dp′[0]</text>
  <rect x="186" y="238" width="104" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="238.0" y="267" font-size="13" fill="#2f5223" text-anchor="middle" filter="url(#rough2)">dp′[1]</text>
  <rect x="302" y="238" width="104" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="354.0" y="267" font-size="13" fill="#2f5223" text-anchor="middle" filter="url(#rough2)">dp′[2]</text>
  <rect x="418" y="238" width="104" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470.0" y="267" font-size="13" fill="#2f5223" text-anchor="middle" filter="url(#rough2)">dp′[3]</text>
  <rect x="534" y="238" width="104" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="586.0" y="267" font-size="13" fill="#2f5223" text-anchor="middle" filter="url(#rough2)">dp′[4]</text>
  <line x1="112.0" y1="152" x2="112.0" y2="236" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb2)" filter="url(#rough2)"/>
  <text x="128.0" y="196" font-size="10.5" fill="#2f4a66" text-anchor="start" filter="url(#rough2)">×(1−p)</text>
  <line x1="228.0" y1="152" x2="228.0" y2="236" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb2)" filter="url(#rough2)"/>
  <text x="244.0" y="196" font-size="10.5" fill="#2f4a66" text-anchor="start" filter="url(#rough2)">×(1−p)</text>
  <line x1="344.0" y1="152" x2="344.0" y2="236" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb2)" filter="url(#rough2)"/>
  <text x="360.0" y="196" font-size="10.5" fill="#2f4a66" text-anchor="start" filter="url(#rough2)">×(1−p)</text>
  <line x1="460.0" y1="152" x2="460.0" y2="236" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb2)" filter="url(#rough2)"/>
  <text x="476.0" y="196" font-size="10.5" fill="#2f4a66" text-anchor="start" filter="url(#rough2)">×(1−p)</text>
  <line x1="576.0" y1="152" x2="576.0" y2="236" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb2)" filter="url(#rough2)"/>
  <text x="592.0" y="196" font-size="10.5" fill="#2f4a66" text-anchor="start" filter="url(#rough2)">×(1−p)</text>
  <path d="M 136.0 152 C 152.0 196 208.0 196 224.0 236" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr2)" filter="url(#rough2)"/>
  <path d="M 252.0 152 C 268.0 196 324.0 196 340.0 236" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr2)" filter="url(#rough2)"/>
  <path d="M 368.0 152 C 384.0 196 440.0 196 456.0 236" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr2)" filter="url(#rough2)"/>
  <path d="M 484.0 152 C 500.0 196 556.0 196 572.0 236" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr2)" filter="url(#rough2)"/>
  <text x="332" y="214" font-size="11" fill="#8a3030" text-anchor="start" filter="url(#rough2)">×p（来自 j−1）</text>
  <rect x="60" y="306" width="640" height="112" rx="10" fill="#f2f6fb" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="78" y="332" font-size="13" fill="#2f4a66" text-anchor="start" font-weight="bold" filter="url(#rough2)">每次更新：dp_new[j] = dp_old[j]·(1−p) + dp_old[j−1]·p</text>
  <text x="78" y="356" font-size="11.5" fill="#44546a" text-anchor="start" filter="url(#rough2)">· 第一项：前 i−1 个里已摧毁 j 个，第 i 个没被摧毁</text>
  <text x="78" y="378" font-size="11.5" fill="#44546a" text-anchor="start" filter="url(#rough2)">· 第二项：前 i−1 个里已摧毁 j−1 个，第 i 个被摧毁（两事件独立，概率相乘）</text>
  <text x="78" y="402" font-size="12" fill="#8a6015" text-anchor="start" font-weight="bold" filter="url(#rough2)">失败概率 F(R) = Σ_{j&lt;K} dp[j]：只累加 j &lt; K 的状态，所以数组开 K 个就够。</text>
</svg>
