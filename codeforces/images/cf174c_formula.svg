<svg xmlns="http://www.w3.org/2000/svg" width="740" height="380" viewBox="0 0 740 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="149"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="740" height="380" fill="#fafafa"/>
  <text x="370" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">下界 = 每次“上升”都必须新开层；构造恰好达到下界</text>
  <path d="M 180 46 Q 370 52 560 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="80" y="218" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="110.0" y="270" text-anchor="middle" font-size="10" font-weight="normal" fill="#555" filter="url(#rough2)">a1=1</text>
  <rect x="156" y="186" width="60" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="186.0" y="270" text-anchor="middle" font-size="10" font-weight="normal" fill="#555" filter="url(#rough2)">a2=2</text>
  <rect x="232" y="218" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="262.0" y="270" text-anchor="middle" font-size="10" font-weight="normal" fill="#555" filter="url(#rough2)">a3=1</text>
  <rect x="308" y="218" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="338.0" y="270" text-anchor="middle" font-size="10" font-weight="normal" fill="#555" filter="url(#rough2)">a4=1</text>
  <rect x="384" y="122" width="60" height="128" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="414.0" y="270" text-anchor="middle" font-size="10" font-weight="normal" fill="#555" filter="url(#rough2)">a5=4</text>
  <rect x="460" y="218" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="490.0" y="270" text-anchor="middle" font-size="10" font-weight="normal" fill="#555" filter="url(#rough2)">a6=1</text>
  <line x1="66" y1="250" x2="528" y2="250" stroke="#2b2b2b" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="186.0" y1="218" x2="186.0" y2="182" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="192.0" y="206.0" text-anchor="start" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">+1</text>
  <line x1="262.0" y1="186" x2="262.0" y2="214" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="268.0" y="206.0" text-anchor="start" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">+1</text>
  <line x1="490.0" y1="122" x2="490.0" y2="214" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="496.0" y="174.0" text-anchor="start" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">+3</text>
  <text x="80" y="300" text-anchor="start" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">三次上升分别 +1、+1、+3 ⇒ 至少 5 次调用；本构造恰好用 5 次。</text>
  <rect x="60" y="316" width="620" height="50" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="74" y="338" text-anchor="start" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">t_min = a₁ + Σ_{i≥2} max(0, aᵢ − aᵢ₋₁) = 1 + 1 + 0 + 0 + 3 + 0 = 5</text>
  <text x="74" y="358" text-anchor="start" font-size="11" font-weight="normal" fill="#7a5a1b" filter="url(#rough2)">构造：上升处压栈（新层），下降处弹栈（关闭层），末尾统一关到 n。</text>
</svg>
