<svg xmlns="http://www.w3.org/2000/svg" width="740" height="360" viewBox="0 0 740 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="740" height="360" fill="#fafafa"/>
  <text x="370" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">均匀伤害 = 前缀和上的一段窗口，每枪只需 O(hp)</text>
  <path d="M 170 46 Q 370 52 570 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="90" y="215" width="52" height="35" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="116.0" y="270" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#777" filter="url(#rough2)">0</text>
  <rect x="152" y="166" width="52" height="84" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="178.0" y="270" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#777" filter="url(#rough2)">1</text>
  <rect x="214" y="187" width="52" height="63" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="240.0" y="270" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#777" filter="url(#rough2)">2</text>
  <rect x="276" y="145" width="52" height="105" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="302.0" y="270" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#777" filter="url(#rough2)">3</text>
  <rect x="338" y="173" width="52" height="77" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="364.0" y="270" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#777" filter="url(#rough2)">4</text>
  <rect x="400" y="194" width="52" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="426.0" y="270" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#777" filter="url(#rough2)">5</text>
  <rect x="462" y="208" width="52" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="488.0" y="270" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#777" filter="url(#rough2)">6</text>
  <rect x="524" y="222" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="550.0" y="270" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#777" filter="url(#rough2)">7</text>
  <rect x="210" y="120" width="248" height="140" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="338" y="110" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">窗口 [s−r, s−l]</text>
  <text x="90" y="290" text-anchor="start" font-size="11" font-weight="normal" fill="#555" filter="url(#rough2)">f[s]：打完若干枪后“累计伤害 = s 且还没死”的概率</text>
  <rect x="60" y="290" width="620" height="56" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="74" y="312" text-anchor="start" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">f′[s] = p·f[s] + (1−p)/(r−l+1) · (pref[s−l+1] − pref[max(s−r,0)])</text>
  <text x="74" y="332" text-anchor="start" font-size="11" font-weight="normal" fill="#7a5a1b" filter="url(#rough2)">致死概率则从“差值 ≥ hp−s”的那些 s 上累加，同样 O(hp)。</text>
</svg>
