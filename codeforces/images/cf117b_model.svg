<svg xmlns="http://www.w3.org/2000/svg" width="884" height="360" viewBox="0 0 884 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="117"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="884" height="360" fill="#fafafa"/>
  <text x="442" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">拼接数 = s1·10⁹ + s2</text>
  <text x="442" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">后手赢 ⟺ 存在 s2 ≤ b 使 s2 ≡ −s1·10⁹ (mod mod)</text>
  <g filter="url(#rough2)"><rect x="110" y="96" width="300" height="50" rx="4" fill="#f6e3c4" fill-opacity="0.6" stroke="#c9a86a" stroke-width="1.3"/></g>
  <text x="260" y="127" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">s1（9 位，≤ a）</text>
  <g filter="url(#rough2)"><rect x="470" y="96" width="300" height="50" rx="4" fill="#cfe0f5" fill-opacity="0.6" stroke="#6688aa" stroke-width="1.3"/></g>
  <text x="620" y="127" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">s2（9 位，≤ b）</text>
  <text x="442" y="182" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">最小非负解 r = (−s1·10⁹) mod mod；r ≤ b 时后手写 r 即可赢</text>
  <text x="442" y="214" text-anchor="middle" font-size="12.5" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">先手制胜：找最小的 s1 ≤ a 使 r &gt; b</text>
  <text x="442" y="256" text-anchor="middle" font-size="11.5" fill="#3d6b2f" filter="url(#rough2)">r 只依赖 s1 mod mod ⇒ 枚举 s1 = 0..min(a, mod−1)（mod ≤ 10⁷）</text>
  <text x="442" y="292" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">定长 9 位时字典序 = 数值序，所以第一个可行的 s1 就是答案</text>
</svg>
