<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 404" width="660" height="404" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="660" height="404" fill="#fafafa"/>

  <text x="330" y="30" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">构造：m = 不超过 n 的最大 2 的幂，把 2m 个前缀值各访问两次</text>
  <text x="330" y="52" text-anchor="middle" font-size="12" fill="#7a7a7a" filter="url(#rough2)">所有 ai ≤ n &lt; 2m，所以前缀只可能落在 V = 2m 个值上；块内异或都 &lt; m ≤ n，可随意跳</text>

  <!-- 低半区 -->
  <g filter="url(#rough2)">
    <rect x="66" y="70" width="528" height="120" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" stroke-dasharray="7 4"/>
    <rect x="96" y="102" width="52" height="32" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
    <rect x="158" y="102" width="52" height="32" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
    <rect x="220" y="102" width="52" height="32" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
    <rect x="330" y="102" width="66" height="32" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="330" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#rough2)">低半区 L = {0, 1, …, m−1}：m 个值，各访问 2 次</text>
  <g font-size="13.5" font-weight="bold" text-anchor="middle" fill="#33517a">
    <text x="122" y="123" filter="url(#rough2)">0</text>
    <text x="184" y="123" filter="url(#rough2)">1</text>
    <text x="246" y="123" filter="url(#rough2)">2</text>
    <text x="286" y="123" fill="#9a9a9a" filter="url(#rough2)">…</text>
    <text x="363" y="123" filter="url(#rough2)">m−1</text>
  </g>
  <path d="M104,150 L420,150" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="170" text-anchor="end" font-size="11" fill="#33517a" filter="url(#rough2)">往返：0 → 1 → … → m−1 → … → 1 → 0（终点回到 0）</text>

  <!-- 跨界 -->
  <path d="M122,190 L122,238" fill="none" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="136" y="210" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">跨界一次：0 ⊕ m = m ≤ n</text>
  <text x="136" y="228" font-size="11" fill="#7a7a7a" filter="url(#rough2)">（0 与 m 都还没被用满，各只出现 1 次）</text>

  <!-- 高半区 -->
  <g filter="url(#rough2)">
    <rect x="66" y="236" width="528" height="120" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="7 4"/>
    <rect x="96" y="268" width="52" height="32" rx="5" fill="#ffffff" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="158" y="268" width="60" height="32" rx="5" fill="#ffffff" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="228" y="268" width="60" height="32" rx="5" fill="#ffffff" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="330" y="268" width="72" height="32" rx="5" fill="#ffffff" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="330" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#a0761e" filter="url(#rough2)">高半区 H = {m, m+1, …, 2m−1}：m 个值，各访问 2 次</text>
  <g font-size="13" font-weight="bold" text-anchor="middle" fill="#a0761e">
    <text x="122" y="289" filter="url(#rough2)">m</text>
    <text x="188" y="289" filter="url(#rough2)">m+1</text>
    <text x="258" y="289" filter="url(#rough2)">m+2</text>
    <text x="298" y="289" fill="#9a9a9a" filter="url(#rough2)">…</text>
    <text x="366" y="289" filter="url(#rough2)">2m−1</text>
  </g>
  <text x="330" y="320" text-anchor="middle" font-size="11" fill="#a0761e" filter="url(#rough2)">H 内两数 (m+x) ⊕ (m+y) = x ⊕ y &lt; m ≤ n</text>
  <path d="M104,332 L420,332" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="350" text-anchor="end" font-size="11" fill="#a0761e" filter="url(#rough2)">往返：m → … → 2m−1 → … → m</text>

  <text x="330" y="382" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">共 4m 个前缀位置，每个值恰好 2 次 ⇒ k = 4m − 1 = 2V − 1，beauty = (4m−1) − 2m = V − 1</text>
</svg>
