<svg xmlns="http://www.w3.org/2000/svg" width="880" height="372" viewBox="0 0 880 372"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="101"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="372" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2：abacaba，k = 4</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">答案 m=1，输出 aaaa</text>
  <g filter="url(#rough2)"><rect x="190" y="110" width="40" height="40" rx="3" fill="#d7ecd0" fill-opacity="0.65" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="210.0" y="137" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="210.0" y="102" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)"><rect x="236" y="110" width="40" height="40" rx="3" fill="#f6d9d7" fill-opacity="0.65" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="256.0" y="137" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="256.0" y="102" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="282" y="110" width="40" height="40" rx="3" fill="#d7ecd0" fill-opacity="0.65" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="302.0" y="137" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="302.0" y="102" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="328" y="110" width="40" height="40" rx="3" fill="#f6d9d7" fill-opacity="0.65" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="348.0" y="137" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="348.0" y="102" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="374" y="110" width="40" height="40" rx="3" fill="#d7ecd0" fill-opacity="0.65" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="394.0" y="137" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="394.0" y="102" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><rect x="420" y="110" width="40" height="40" rx="3" fill="#f6d9d7" fill-opacity="0.65" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="440.0" y="137" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="440.0" y="102" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">5</text>
  <g filter="url(#rough2)"><rect x="466" y="110" width="40" height="40" rx="3" fill="#d7ecd0" fill-opacity="0.65" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="486.0" y="137" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="486.0" y="102" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">6</text>
  <text x="440" y="186" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">次数：a=4, b=2, c=1 → 排序 c, b, a</text>
  <text x="440" y="214" text-anchor="middle" font-size="12" fill="#8a2b28" filter="url(#rough2)">k=4：删 c 用 1，剩 3；删 b 用 2，剩 1；a 要 4 &gt; 1 删不动</text>
  <text x="440" y="242" text-anchor="middle" font-size="12" fill="#3d6b2f" filter="url(#rough2)">保留 a 的 4 个位置，滤出来正好是 aaaa（长度 4 ≤ 7）</text>
</svg>
