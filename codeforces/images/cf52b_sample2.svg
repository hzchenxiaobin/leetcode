  <text x="180" y="154" font-size="11" font-weight="bold" fill="#b85450" text-anchor="end" filter="url(#rough2)">+0</text>
  <rect x="186" y="140" width="62" height="62" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="217.0" y="173.0" font-size="20" font-weight="bold" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">*</text>
  <text x="217.0" y="194" font-size="9" font-weight="normal" fill="#666" text-anchor="middle" filter="url(#rough2)">(1,2)</text>
