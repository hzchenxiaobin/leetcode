  <text x="50" y="113.0" font-size="10" font-weight="normal" fill="#555" text-anchor="end" filter="url(#rough2)">行 0</text>
  <text x="50" y="175.0" font-size="10" font-weight="normal" fill="#555" text-anchor="end" filter="url(#rough2)">行 1</text>
  <text x="50" y="237.0" font-size="10" font-weight="normal" fill="#555" text-anchor="end" filter="url(#rough2)">行 2</text>
  <rect x="360" y="80" width="330" height="300" rx="8" fill="#f3f6fa" stroke="#9aa8b8" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="376" y="108" font-size="11.5" font-weight="bold" fill="#2b2b2b" text-anchor="start" filter="url(#rough2)">行内 * 数：</text>
  <text x="376" y="130" font-size="12" font-weight="normal" fill="#22303f" text-anchor="start" filter="url(#rough2)">R = (2, 2, 3)</text>
  <text x="376" y="158" font-size="11.5" font-weight="bold" fill="#2b2b2b" text-anchor="start" filter="url(#rough2)">列内 * 数：</text>
  <text x="376" y="180" font-size="12" font-weight="normal" fill="#22303f" text-anchor="start" filter="url(#rough2)">C = (2, 1, 2, 2)</text>
  <text x="376" y="212" font-size="11.5" font-weight="bold" fill="#2b2b2b" text-anchor="start" filter="url(#rough2)">各顶点贡献：</text>
  <text x="376" y="236" font-size="10" font-weight="normal" fill="#333" text-anchor="start" filter="url(#rough2)">(0,0): 1×1=1    (0,3): 1×1=1</text>
  <text x="376" y="258" font-size="10" font-weight="normal" fill="#333" text-anchor="start" filter="url(#rough2)">(1,1): 1×0=0    (1,2): 1×1=1</text>
  <text x="376" y="280" font-size="10" font-weight="normal" fill="#333" text-anchor="start" filter="url(#rough2)">(2,0): 2×1=2    (2,2): 2×1=2</text>
  <text x="376" y="302" font-size="10" font-weight="normal" fill="#333" text-anchor="start" filter="url(#rough2)">(2,3): 2×1=2</text>
  <rect x="376" y="326" width="298" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="525" y="351" font-size="12.5" font-weight="bold" fill="#2f5223" text-anchor="middle" filter="url(#rough2)">合计 1+1+0+1+2+2+2 = 9</text>
  <text x="360" y="402" font-size="10.5" font-weight="normal" fill="#666" text-anchor="middle" filter="url(#rough2)">(1,1) 所在列只有它自己，C−1 = 0，贡献为 0；其余星号按同一公式累加</text>
</svg>
