  <text x="279.0" y="132" font-size="9" font-weight="normal" fill="#666" text-anchor="middle" filter="url(#rough2)">(0,3)</text>
  <text x="304" y="92" font-size="11" font-weight="bold" fill="#4a7a3a" text-anchor="end" filter="url(#rough2)">+1</text>
  <rect x="62" y="140" width="62" height="62" rx="3" fill="#ffffff" stroke="#c9d4e0" stroke-width="1.0" filter="url(#rough2)"/>
  <rect x="124" y="140" width="62" height="62" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
