  <text x="242" y="216" font-size="11" font-weight="bold" fill="#4a7a3a" text-anchor="end" filter="url(#rough2)">+2</text>
  <rect x="248" y="202" width="62" height="62" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="279.0" y="235.0" font-size="20" font-weight="bold" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">*</text>
  <text x="279.0" y="256" font-size="9" font-weight="normal" fill="#666" text-anchor="middle" filter="url(#rough2)">(2,3)</text>
  <text x="304" y="216" font-size="11" font-weight="bold" fill="#4a7a3a" text-anchor="end" filter="url(#rough2)">+2</text>
  <text x="93.0" y="284" font-size="10" font-weight="normal" fill="#555" text-anchor="middle" filter="url(#rough2)">列 0</text>
