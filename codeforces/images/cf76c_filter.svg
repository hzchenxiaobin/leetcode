<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="720" height="400" fill="#fafafa"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">突变 = 删掉某些字母类型的全部出现</text>
  <path d="M 200 43 Q 360 49 520 43" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <rect x="90" y="96" width="54" height="46" rx="8" fill="#fdecea" stroke="#b85450" stroke-width="1.7" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="117.0" y="127" text-anchor="middle" font-size="19" font-weight="bold" fill="#b85450" filter="url(#rough2)">B</text>
  <text x="117.0" y="88" text-anchor="middle" font-size="9.5" fill="#777777" filter="url(#rough2)">#1</text>
  <rect x="156" y="96" width="54" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="183.0" y="127" text-anchor="middle" font-size="19" font-weight="bold" fill="#446688" filter="url(#rough2)">A</text>
  <text x="183.0" y="88" text-anchor="middle" font-size="9.5" fill="#777777" filter="url(#rough2)">#2</text>
  <rect x="222" y="96" width="54" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="249.0" y="127" text-anchor="middle" font-size="19" font-weight="bold" fill="#446688" filter="url(#rough2)">C</text>
  <text x="249.0" y="88" text-anchor="middle" font-size="9.5" fill="#777777" filter="url(#rough2)">#3</text>
  <rect x="288" y="96" width="54" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="315.0" y="127" text-anchor="middle" font-size="19" font-weight="bold" fill="#446688" filter="url(#rough2)">A</text>
  <text x="315.0" y="88" text-anchor="middle" font-size="9.5" fill="#777777" filter="url(#rough2)">#4</text>
  <rect x="354" y="96" width="54" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="381.0" y="127" text-anchor="middle" font-size="19" font-weight="bold" fill="#446688" filter="url(#rough2)">C</text>
  <text x="381.0" y="88" text-anchor="middle" font-size="9.5" fill="#777777" filter="url(#rough2)">#5</text>
  <text x="360" y="178" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">删除类型 B（代价 t_B = 1）</text>
  <rect x="150" y="204" width="54" height="46" rx="8" fill="#e9f4e2" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="177.0" y="235" text-anchor="middle" font-size="19" font-weight="bold" fill="#2f5223" filter="url(#rough2)">A</text>
  <rect x="216" y="204" width="54" height="46" rx="8" fill="#e9f4e2" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="243.0" y="235" text-anchor="middle" font-size="19" font-weight="bold" fill="#2f5223" filter="url(#rough2)">C</text>
  <rect x="282" y="204" width="54" height="46" rx="8" fill="#e9f4e2" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="309.0" y="235" text-anchor="middle" font-size="19" font-weight="bold" fill="#2f5223" filter="url(#rough2)">A</text>
  <rect x="348" y="204" width="54" height="46" rx="8" fill="#e9f4e2" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="375.0" y="235" text-anchor="middle" font-size="19" font-weight="bold" fill="#2f5223" filter="url(#rough2)">C</text>
  <text x="360" y="282" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">风险 = a[A][C] + a[C][A] + a[A][C] + t_B</text>
  <text x="360" y="312" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">删除只花 t_i，但重排后的相邻对风险全部按 a 重新计算</text>
  <rect x="120" y="330" width="480" height="46" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="360" y="359" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">不同子集删除的字母不同 → 剩下的字符串一定不同，可以直接按集合计数</text>
</svg>
