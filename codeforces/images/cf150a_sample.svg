<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="433"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="240" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">两个样例</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">6 有两个质因子 ⇒ 必败；30 有三个 ⇒ 走到 6</text>
  <text x="450" y="104" text-anchor="middle" font-size="12" fill="#8a2b28" filter="url(#rough2)">6 = 2×3：先手只能写 2 或 3 ⇒ 后手无法移动 ⇒ 后手胜</text>
  <text x="450" y="140" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">30 = 2×3×5：先手写 6 = 2×3 ⇒ 后手只能写 2/3 ⇒ 先手胜</text>
  <text x="450" y="180" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">样例 3：q = 1 ⇒ 先手无法移动 ⇒ 输出 1 与 0</text>
</svg>
