<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="29"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2b2b2b"/>
    </marker>
  </defs>

  <rect width="760" height="400" fill="#fafafa"/>
  <text x="380" y="30" text-anchor="middle" font-size="17.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2：max_x = 132，max_y = 10，w = 35 —— 一位数全是"rev 不变"</text>
  <path d="M 70 40 Q 380 46 690 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 9x10 网格：列 a=1..9，行 b=1..10（只画前 10 列以示意） -->
  <g filter="url(#rough2)" stroke="#9fbfa4" stroke-width="0.5">
    <rect x="60" y="64" width="26" height="22" fill="#d7ecd9"/><rect x="86" y="64" width="26" height="22" fill="#d7ecd9"/><rect x="112" y="64" width="26" height="22" fill="#d7ecd9"/><rect x="138" y="64" width="26" height="22" fill="#d7ecd9"/><rect x="164" y="64" width="26" height="22" fill="#d7ecd9"/><rect x="190" y="64" width="26" height="22" fill="#d7ecd9"/><rect x="216" y="64" width="26" height="22" fill="#d7ecd9"/><rect x="242" y="64" width="26" height="22" fill="#d7ecd9"/><rect x="268" y="64" width="26" height="22" fill="#d7ecd9"/>
    <rect x="60" y="86" width="26" height="22" fill="#d7ecd9"/><rect x="86" y="86" width="26" height="22" fill="#d7ecd9"/><rect x="112" y="86" width="26" height="22" fill="#d7ecd9"/><rect x="138" y="86" width="26" height="22" fill="#d7ecd9"/><rect x="164" y="86" width="26" height="22" fill="#d7ecd9"/><rect x="190" y="86" width="26" height="22" fill="#d7ecd9"/><rect x="216" y="86" width="26" height="22" fill="#d7ecd9"/><rect x="242" y="86" width="26" height="22" fill="#d7ecd9"/><rect x="268" y="86" width="26" height="22" fill="#d7ecd9"/>
    <rect x="60" y="108" width="26" height="22" fill="#d7ecd9"/><rect x="86" y="108" width="26" height="22" fill="#d7ecd9"/><rect x="112" y="108" width="26" height="22" fill="#d7ecd9"/><rect x="138" y="108" width="26" height="22" fill="#d7ecd9"/><rect x="164" y="108" width="26" height="22" fill="#d7ecd9"/><rect x="190" y="108" width="26" height="22" fill="#d7ecd9"/><rect x="216" y="108" width="26" height="22" fill="#d7ecd9"/><rect x="242" y="108" width="26" height="22" fill="#d7ecd9"/><rect x="268" y="108" width="26" height="22" fill="#d7ecd9"/>
    <rect x="60" y="130" width="26" height="22" fill="#d7ecd9"/><rect x="86" y="130" width="26" height="22" fill="#d7ecd9"/><rect x="112" y="130" width="26" height="22" fill="#d7ecd9"/><rect x="138" y="130" width="26" height="22" fill="#d7ecd9"/><rect x="164" y="130" width="26" height="22" fill="#d7ecd9"/><rect x="190" y="130" width="26" height="22" fill="#d7ecd9"/><rect x="216" y="130" width="26" height="22" fill="#d7ecd9"/><rect x="242" y="130" width="26" height="22" fill="#d7ecd9"/><rect x="268" y="130" width="26" height="22" fill="#d7ecd9"/>
    <rect x="60" y="152" width="26" height="22" fill="#d7ecd9"/><rect x="86" y="152" width="26" height="22" fill="#d7ecd9"/><rect x="112" y="152" width="26" height="22" fill="#d7ecd9"/><rect x="138" y="152" width="26" height="22" fill="#d7ecd9"/><rect x="164" y="152" width="26" height="22" fill="#d7ecd9"/><rect x="190" y="152" width="26" height="22" fill="#d7ecd9"/><rect x="216" y="152" width="26" height="22" fill="#d7ecd9"/><rect x="242" y="152" width="26" height="22" fill="#d7ecd9"/><rect x="268" y="152" width="26" height="22" fill="#d7ecd9"/>
    <rect x="60" y="174" width="26" height="22" fill="#d7ecd9"/><rect x="86" y="174" width="26" height="22" fill="#d7ecd9"/><rect x="112" y="174" width="26" height="22" fill="#d7ecd9"/><rect x="138" y="174" width="26" height="22" fill="#d7ecd9"/><rect x="164" y="174" width="26" height="22" fill="#d7ecd9"/><rect x="190" y="174" width="26" height="22" fill="#d7ecd9"/><rect x="216" y="174" width="26" height="22" fill="#d7ecd9"/><rect x="242" y="174" width="26" height="22" fill="#d7ecd9"/><rect x="268" y="174" width="26" height="22" fill="#d7ecd9"/>
    <rect x="60" y="196" width="26" height="22" fill="#d7ecd9"/><rect x="86" y="196" width="26" height="22" fill="#d7ecd9"/><rect x="112" y="196" width="26" height="22" fill="#d7ecd9"/><rect x="138" y="196" width="26" height="22" fill="#d7ecd9"/><rect x="164" y="196" width="26" height="22" fill="#d7ecd9"/><rect x="190" y="196" width="26" height="22" fill="#d7ecd9"/><rect x="216" y="196" width="26" height="22" fill="#d7ecd9"/><rect x="242" y="196" width="26" height="22" fill="#d7ecd9"/><rect x="268" y="196" width="26" height="22" fill="#d7ecd9"/>
    <rect x="60" y="218" width="26" height="22" fill="#d7ecd9"/><rect x="86" y="218" width="26" height="22" fill="#d7ecd9"/><rect x="112" y="218" width="26" height="22" fill="#d7ecd9"/><rect x="138" y="218" width="26" height="22" fill="#d7ecd9"/><rect x="164" y="218" width="26" height="22" fill="#d7ecd9"/><rect x="190" y="218" width="26" height="22" fill="#d7ecd9"/><rect x="216" y="218" width="26" height="22" fill="#d7ecd9"/><rect x="242" y="218" width="26" height="22" fill="#d7ecd9"/><rect x="268" y="218" width="26" height="22" fill="#d7ecd9"/>
    <rect x="60" y="240" width="26" height="22" fill="#d7ecd9"/><rect x="86" y="240" width="26" height="22" fill="#d7ecd9"/><rect x="112" y="240" width="26" height="22" fill="#d7ecd9"/><rect x="138" y="240" width="26" height="22" fill="#d7ecd9"/><rect x="164" y="240" width="26" height="22" fill="#d7ecd9"/><rect x="190" y="240" width="26" height="22" fill="#d7ecd9"/><rect x="216" y="240" width="26" height="22" fill="#d7ecd9"/><rect x="242" y="240" width="26" height="22" fill="#d7ecd9"/><rect x="268" y="240" width="26" height="22" fill="#d7ecd9"/>
    <rect x="60" y="262" width="26" height="22" fill="#fdecea"/><rect x="86" y="262" width="26" height="22" fill="#fdecea"/><rect x="112" y="262" width="26" height="22" fill="#fdecea"/><rect x="138" y="262" width="26" height="22" fill="#fdecea"/><rect x="164" y="262" width="26" height="22" fill="#fdecea"/><rect x="190" y="262" width="26" height="22" fill="#fdecea"/><rect x="216" y="262" width="26" height="22" fill="#fdecea"/><rect x="242" y="262" width="26" height="22" fill="#fdecea"/><rect x="268" y="262" width="26" height="22" fill="#fdecea"/>
  </g>
  <rect x="60" y="64" width="234" height="220" fill="none" stroke="#2b2b2b" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="177" y="300" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">列 a = 1..9，行 b = 1..10：绿色都可配对（81 格）</text>
  <text x="177" y="318" text-anchor="middle" font-size="11" fill="#8c2f2b" filter="url(#rough2)">b = 10 整行不行：rev(10) = 1 ≠ 10</text>

  <!-- 右侧：每个 x 的最小 y 表 -->
  <g filter="url(#rough2)">
    <rect x="330" y="64" width="380" height="30" fill="#f2f2f2" stroke="#888" stroke-width="1.2"/>
    <text x="344" y="84" font-size="11.5" fill="#333">x</text>
    <text x="404" y="84" font-size="11.5" fill="#333">最大可配对 b 数（P(10)=9）</text>
    <text x="580" y="84" font-size="11.5" fill="#333">最小 y</text>
    <text x="654" y="84" font-size="11.5" fill="#333">x·y</text>
  </g>
  <g font-size="11.5" fill="#333" filter="url(#rough2)">
    <text x="344" y="110">1..3</text><text x="404" y="110">最多 9·x = 9/18/27 &lt; 35</text><text x="580" y="110">无解</text><text x="654" y="110">—</text>
    <text x="344" y="132">4</text><text x="404" y="132">4 × 9 = 36 ≥ 35，4 × 8 = 32 &lt; 35</text><text x="580" y="132">9</text><text x="654" y="132">36</text>
    <text x="344" y="154">5</text><text x="404" y="154">5 × 7 = 35（第 7 个回文数是 7）</text><text x="580" y="154">7</text><text x="654" y="154">35 ★</text>
    <text x="344" y="176">6</text><text x="404" y="176">6 × 6 = 36 ≥ 35，6 × 5 = 30 &lt; 35</text><text x="580" y="176">6</text><text x="654" y="176">36</text>
    <text x="344" y="198">7</text><text x="404" y="198">7 × 5 = 35（第 5 个回文数是 5）</text><text x="580" y="198">5</text><text x="654" y="198">35 ★</text>
    <text x="344" y="220">8</text><text x="404" y="220">8 × 5 = 40，8 × 4 = 32 &lt; 35</text><text x="580" y="220">5</text><text x="654" y="220">40</text>
    <text x="344" y="242">9</text><text x="404" y="242">9 × 4 = 36 ≥ 35，9 × 3 = 27</text><text x="580" y="242">4</text><text x="654" y="242">36</text>
  </g>
  <text x="330" y="272" font-size="11.5" fill="#8c2f2b" filter="url(#rough2)">最小的 x·y 是 35，有两种取法：(5,7) 与 (7,5)。官方给的是 (7,5)。</text>

  <rect x="30" y="330" width="700" height="52" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="46" y="352" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">本题"任输出一组最小面积解"，所以 (5,7)、(7,5) 都对；本仓库的评测用 checker 校验"面积最小 + 票数足够"。</text>
  <text x="46" y="372" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">注意 a ≤ 9 时 rev(a) = a，b ≤ 9 时 rev(b) = b，所以这些格子全部幸运 —— 第 2 节的样例正是靠这个"前缀全绿"结构做出来的。</text>
</svg>
