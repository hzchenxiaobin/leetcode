<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="223"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">187D：nxt 构成函数图，用二进制提升一次跳过所有停靠</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="60.0" y="94.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">停靠链：i0 → nxt[i0] → nxt[nxt[i0]] → …</text>
  <circle cx="100.0" cy="170.0" r="20.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="100.0" y="175.0" text-anchor="middle" font-size="11.5" fill="#8a6015" font-weight="bold" filter="url(#rough2)">i0</text>
  <circle cx="220.0" cy="170.0" r="20.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="220.0" y="175.0" text-anchor="middle" font-size="11.5" fill="#8a6015" font-weight="bold" filter="url(#rough2)">i1</text>
  <line x1="122.0" y1="170.0" x2="198.0" y2="170.0" stroke="#8a6015" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <circle cx="340.0" cy="170.0" r="20.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="340.0" y="175.0" text-anchor="middle" font-size="11.5" fill="#8a6015" font-weight="bold" filter="url(#rough2)">i2</text>
  <line x1="242.0" y1="170.0" x2="318.0" y2="170.0" stroke="#8a6015" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <circle cx="460.0" cy="170.0" r="20.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="460.0" y="175.0" text-anchor="middle" font-size="11.5" fill="#8a6015" font-weight="bold" filter="url(#rough2)">i3</text>
  <line x1="362.0" y1="170.0" x2="438.0" y2="170.0" stroke="#8a6015" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <circle cx="580.0" cy="170.0" r="20.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="580.0" y="175.0" text-anchor="middle" font-size="11.5" fill="#8a6015" font-weight="bold" filter="url(#rough2)">i4</text>
  <line x1="482.0" y1="170.0" x2="558.0" y2="170.0" stroke="#8a6015" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="60.0" y="220.0" width="600.0" height="70.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="74.0" y="243.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">等待时间求和：sm[k][i] = sm[k-1][i] + sm[k-1][ up[k-1][i] ]</text>
  <text x="74.0" y="267.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">up[k][i] = 2^k 次 nxt 后的节点</text>
  <rect x="60.0" y="306.0" width="600.0" height="70.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="74.0" y="329.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">每个查询：先求第一个红灯路口（按值线段树查最小下标）</text>
  <text x="74.0" y="353.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">再沿 nxt 跳到底，累加等待；答案 = t + 总路程 + 总等待</text>
</svg>
