<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="360" fill="#fafafa"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">189B：对角线平行于坐标轴的菱形 = 两条互相垂直的整数对角线的组合</text>
  <path d="M 84.56000000000012 46 Q 380.0 52 675.4399999999998 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="80.0" y="60.0" width="280.0" height="240.0" rx="6" fill="#fafafa" stroke="#6b6b6b" stroke-width="1.0" filter="url(#rough2)"/>
  <path d="M 130 180 L 220 120 L 310 180 L 220 240 Z" stroke="#e8f0fe" stroke-width="#446688" fill="1.6" filter="url(#rough2)"/>
  <path d="M 130.0 180.0 L 310.0 180.0" stroke="#b85450" stroke-width="1.3" fill="none" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <path d="M 220.0 120.0 L 220.0 240.0" stroke="#5b8c5a" stroke-width="1.3" fill="none" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <circle cx="220.0" cy="180.0" r="4.0" fill="#d6a040" stroke="#d6a040" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="220.0" y="198.0" text-anchor="middle" font-size="10.6" font-weight="bold" fill="#8a6015" filter="url(#rough2)">中心 (x₀,y₀)</text>
  <text x="130.0" y="168.0" text-anchor="start" font-size="10.4" fill="#b85450" filter="url(#rough2)">水平半对角 dx</text>
  <text x="228.0" y="118.0" text-anchor="start" font-size="10.4" fill="#2f5b34" filter="url(#rough2)">竖直半对角 dy</text>
  <rect x="420.0" y="70.0" width="300.0" height="120.0" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="436.0" y="96.0" text-anchor="start" font-size="11.2" font-weight="bold" fill="#446688" filter="url(#rough2)">计数：中心 + dx + dy 唯一确定</text>
  <text x="436.0" y="122.0" text-anchor="start" font-size="11.0" fill="#2b2b2b" filter="url(#rough2)">dx ≥ 1，dy ≥ 1（面积 &gt; 0）</text>
  <text x="436.0" y="146.0" text-anchor="start" font-size="11.0" fill="#2b2b2b" filter="url(#rough2)">dx ≤ min(x₀, w−x₀)</text>
  <text x="436.0" y="170.0" text-anchor="start" font-size="11.0" fill="#2b2b2b" filter="url(#rough2)">dy ≤ min(y₀, h−y₀)</text>
  <rect x="60.0" y="268.0" width="660.0" height="70.0" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="292.0" text-anchor="start" font-size="11.1" fill="#8a6015" filter="url(#rough2)">菱形四边等长：顶点到中心距离 sqrt(dx²+dy²) 四条边都相等 ⇒ 只要 dx、dy 为正就一定是菱形。</text>
  <text x="74.0" y="314.0" text-anchor="start" font-size="11.1" fill="#8a6015" filter="url(#rough2)">中心坐标必须是整数（否则另一条对角线的端点就不在整点上）⇒ x 方向与 y 方向可以独立计数。</text>
</svg>
