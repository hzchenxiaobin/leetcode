<svg xmlns="http://www.w3.org/2000/svg" width="840" height="340" viewBox="0 0 840 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="340" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">附加点只连团内 t 个点，恰好新增 C(t,2) 个三角形</text>
  <text x="420" y="56" text-anchor="middle" font-size="11.8" fill="#666666" filter="url(#rough2)">附加点之间不连边 ⇒ 不会多出三角形</text>
  <g filter="url(#rough2)"><line x1="200.0" y1="90.0" x2="270.0" y2="160.0" stroke="#9bb3c9" stroke-width="1.1"/></g>
  <g filter="url(#rough2)"><line x1="200.0" y1="90.0" x2="200.0" y2="230.0" stroke="#9bb3c9" stroke-width="1.1"/></g>
  <g filter="url(#rough2)"><line x1="200.0" y1="90.0" x2="130.0" y2="160.0" stroke="#9bb3c9" stroke-width="1.1"/></g>
  <g filter="url(#rough2)"><line x1="270.0" y1="160.0" x2="200.0" y2="230.0" stroke="#9bb3c9" stroke-width="1.1"/></g>
  <g filter="url(#rough2)"><line x1="270.0" y1="160.0" x2="130.0" y2="160.0" stroke="#9bb3c9" stroke-width="1.1"/></g>
  <g filter="url(#rough2)"><line x1="200.0" y1="230.0" x2="130.0" y2="160.0" stroke="#9bb3c9" stroke-width="1.1"/></g>
  <g filter="url(#rough2)"><circle cx="200.0" cy="90.0" r="16" fill="#d6e6f2" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="200.0" y="95.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><circle cx="270.0" cy="160.0" r="16" fill="#d6e6f2" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="270.0" y="165.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><circle cx="200.0" cy="230.0" r="16" fill="#d6e6f2" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="200.0" y="235.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><circle cx="130.0" cy="160.0" r="16" fill="#d6e6f2" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="130.0" y="165.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><circle cx="430" cy="160" r="18" fill="#f6e3c4" fill-opacity="0.9" stroke="#a0522d" stroke-width="1.6"/></g>
  <text x="430" y="166" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">v</text>
  <g filter="url(#rough2)"><line x1="430" y1="160" x2="200.0" y2="90.0" stroke="#a0522d" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><line x1="430" y1="160" x2="270.0" y2="160.0" stroke="#a0522d" stroke-width="1.5"/></g>
  <text x="560" y="130" text-anchor="start" font-size="11.5" fill="#8a4b2a" filter="url(#rough2)">v 连 t=2 个团点</text>
  <text x="560" y="156" text-anchor="start" font-size="11.5" fill="#8a4b2a" filter="url(#rough2)">新增 C(2,2) = 1 个三角形</text>
  <text x="560" y="182" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">v 若连 t=3 个团点</text>
  <text x="560" y="206" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">新增 C(3,2) = 3 个</text>
  <text x="420" y="270" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">贪心消去剩余 r：每轮取最大 t ≤ c 使 C(t,2) ≤ r</text>
  <g filter="url(#rough2)"><rect x="230" y="292" width="380" height="34" rx="4" fill="#f7fbf4" fill-opacity="0.85" stroke="#a8c99a" stroke-width="1.3"/></g>
  <text x="420" y="314" text-anchor="middle" font-size="12" font-weight="bold" fill="#3d6b2f" filter="url(#rough2)">k=10⁵ 时总点数 89 ≤ 100</text>
</svg>
