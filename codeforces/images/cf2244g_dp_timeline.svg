<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa" filter="url(#rough2)"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    拆成两条前缀约束 + 时间轴激活
  </text>

  <!-- 左：原始条件拆解 -->
  <rect x="26" y="46" width="252" height="94" rx="8" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="152" y="68" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    |i - j| &gt; max(a_i, a_j)  等价于
  </text>
  <text x="152" y="94" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">
    j &lt;= i - a_i - 1
  </text>
  <text x="152" y="114" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">
    且 j + a_j &lt;= i - 1
  </text>
  <text x="152" y="132" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">
    两条都只限制 j 的上界 ⇒ 前缀
  </text>

  <!-- 右：dp 转移 -->
  <rect x="292" y="46" width="242" height="94" rx="8" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="413" y="70" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    dp[i] = a_i + best
  </text>
  <text x="413" y="92" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    best = max{ dp[j] : 两条都满足 }
  </text>
  <text x="413" y="114" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">
    dp[i]：以 i 为最后一个元素的答案
  </text>
  <text x="413" y="132" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">
    答案 = max dp[i]（也可以只选一个）
  </text>

  <!-- 时间轴 -->
  <text x="60" y="164" font-size="12" fill="#333" filter="url(#rough2)">
    时刻 i 从左到右扫，j 在 t_j = j + a_j + 1 时刻才允许做前驱
  </text>

  <path d="M 58 246 L 508 246" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 刻度 1..6 -->
  <g font-size="11" fill="#777">
    <path d="M 80 246 L 80 252" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="80" y="268" text-anchor="middle" filter="url(#rough2)">1</text>
    <path d="M 148 246 L 148 252" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="148" y="268" text-anchor="middle" filter="url(#rough2)">2</text>
    <path d="M 216 246 L 216 252" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="216" y="268" text-anchor="middle" filter="url(#rough2)">3</text>
    <path d="M 284 246 L 284 252" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="284" y="268" text-anchor="middle" filter="url(#rough2)">4</text>
    <path d="M 352 246 L 352 252" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="352" y="268" text-anchor="middle" filter="url(#rough2)">5</text>
    <path d="M 420 246 L 420 252" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="420" y="268" text-anchor="middle" filter="url(#rough2)">6</text>
  </g>

  <!-- t=4: j=2 -->
  <circle cx="284" cy="246" r="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2"
          filter="url(#rough2)"/>
  <path d="M 284 241 L 284 224" stroke="#d6a040" stroke-width="1.4" fill="none"
        filter="url(#rough2)"/>
  <text x="284" y="218" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">
    j=2（dp=1）
  </text>

  <!-- t=5: j=1,3 -->
  <circle cx="352" cy="246" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="2"
          filter="url(#rough2)"/>
  <path d="M 352 241 L 352 196" stroke="#b85450" stroke-width="1.4" fill="none"
        filter="url(#rough2)"/>
  <text x="352" y="190" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">
    j=1, 3 入场
  </text>

  <!-- t=6: j=4，但超过 n，不会入场 -->
  <circle cx="420" cy="246" r="5" fill="#eeeeee" stroke="#999" stroke-width="2"
          filter="url(#rough2)"/>
  <path d="M 420 241 L 420 224" stroke="#999" stroke-width="1.4" fill="none"
        filter="url(#rough2)"/>
  <text x="420" y="218" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">
    j=4：t=6 &gt; n，不激活
  </text>

  <text x="508" y="284" text-anchor="end" font-size="10" fill="#777" filter="url(#rough2)">
    这里 n = 5：j=4、j=5 的激活时刻都 &gt; n，永远不入场
  </text>

  <!-- 查询说明 -->
  <rect x="40" y="288" width="480" height="44" rx="8" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="308" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    查询：lim = i - a_i - 1，在树状数组里取下标 &lt;= lim 的最大 dp
  </text>
  <text x="280" y="325" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">
    点更新取 max、前缀查询取 max，正好是树状数组的标准用法
  </text>

  <rect x="40" y="342" width="480" height="42" rx="8" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="361" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    lim &lt; 1 时没有可用前驱，best 记 0；因为 a_i &gt;= 0，lim 永远 &lt;= n - 1
  </text>
  <text x="280" y="377" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">
    激活只需做一次，故总插入次数恰为 n 次
  </text>
</svg>
