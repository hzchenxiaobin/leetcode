<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="225"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">187D 样例 2：t=1 的停靠过程</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="60.0" y="96.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">M=10，绿 [0,3)；路段 10,1,1,8,9e8,1e9</text>
  <text x="80.0" y="140.0" text-anchor="start" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">路口</text>
  <text x="220.0" y="140.0" text-anchor="start" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">到达</text>
  <text x="380.0" y="140.0" text-anchor="start" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">处理</text>
  <text x="80.0" y="172.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="220.0" y="172.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">11 → φ=1</text>
  <text x="380.0" y="172.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">绿，不停</text>
  <text x="80.0" y="210.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="220.0" y="210.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">12 → φ=2</text>
  <text x="380.0" y="210.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">绿，不停</text>
  <text x="80.0" y="248.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="220.0" y="248.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">13 → φ=3</text>
  <text x="380.0" y="248.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">红灯，等到 20</text>
  <text x="80.0" y="286.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="220.0" y="286.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">28 → φ=8</text>
  <text x="380.0" y="286.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">红灯，等到 30</text>
  <text x="80.0" y="324.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <text x="220.0" y="324.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">9e8+35 → φ=5</text>
  <text x="380.0" y="324.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">红灯，等到 9e8+40</text>
  <rect x="60.0" y="350.0" width="600.0" height="40.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="74.0" y="373.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">+1e9 到终点 → 1900000040，与官方输出一致</text>
</svg>
