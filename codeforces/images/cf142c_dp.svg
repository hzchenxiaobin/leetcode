<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="287"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="340" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">按列 DP：状态 = 右侧两列的占用掩码 (A, B)</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">左边缘为 c 的犁占列 c, c+1, c+2 —— 影响只往右伸两列</text>
  <text x="90" y="100" text-anchor="start" font-size="10.5" fill="#666666" filter="url(#rough2)">列序号</text>
  <g filter="url(#rough2)"><rect x="90" y="112" width="92" height="44" rx="3" fill="#cfe0f5" fill-opacity="0.5" stroke="#446688" stroke-width="1.4"/></g>
  <text x="136" y="140" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">≤ c−1</text>
  <g filter="url(#rough2)"><rect x="190" y="112" width="92" height="44" rx="3" fill="#cfe0f5" fill-opacity="0.5" stroke="#446688" stroke-width="1.4"/></g>
  <text x="236" y="140" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">≤ c−1</text>
  <text x="186" y="176" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">已定型</text>
  <g filter="url(#rough2)"><rect x="290" y="112" width="92" height="44" rx="3" fill="#f3d9d6" fill-opacity="0.8" stroke="#8a2b28" stroke-width="1.4"/></g>
  <text x="336" y="140" text-anchor="middle" font-size="11.5" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">A：列 c</text>
  <g filter="url(#rough2)"><rect x="390" y="112" width="92" height="44" rx="3" fill="#f6e3c4" fill-opacity="0.8" stroke="#b06a1e" stroke-width="1.4"/></g>
  <text x="436" y="140" text-anchor="middle" font-size="11" fill="#b06a1e" font-weight="bold" filter="url(#rough2)">B：列 c+1</text>
  <text x="336" y="176" text-anchor="middle" font-size="10.5" fill="#8a2b28" filter="url(#rough2)">当前列</text>
  <text x="436" y="176" text-anchor="middle" font-size="10.5" fill="#b06a1e" filter="url(#rough2)">下一列</text>
  <g filter="url(#rough2)"><rect x="490" y="112" width="92" height="44" rx="3" fill="#ffffff" fill-opacity="0.3" stroke="#bbbbbb" stroke-width="1.4"/></g>
  <text x="536" y="140" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">空</text>
  <g filter="url(#rough2)"><rect x="590" y="112" width="92" height="44" rx="3" fill="#ffffff" fill-opacity="0.3" stroke="#bbbbbb" stroke-width="1.4"/></g>
  <text x="636" y="140" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">空</text>
  <g filter="url(#rough2)"><rect x="690" y="112" width="92" height="44" rx="3" fill="#ffffff" fill-opacity="0.3" stroke="#bbbbbb" stroke-width="1.4"/></g>
  <text x="736" y="140" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">空</text>
  <g filter="url(#rough2)"><rect x="70" y="208" width="760" height="92" rx="6" fill="#ffffff" fill-opacity="0.3" stroke="#cccccc" stroke-width="1.4" stroke-dasharray="5 4"/></g>
  <text x="450" y="234" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">在本列放一个集合 S（两两不重叠的若干台犁）：</text>
  <text x="450" y="262" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">要求 S.occ₀ &amp; A = 0 且 S.occ₁ &amp; B = 0（不重叠、不越界）</text>
  <text x="450" y="288" text-anchor="middle" font-size="12" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">转移：(A, B) → ( B | S.occ₁ , S.occ₂ )，台数 + |S|</text>
  <text x="450" y="322" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">行数 ≤ 9 ⇒ 状态 ≤ 2¹⁸；先把棋盘转置，让行数 = min(n,m)</text>
</svg>
