<svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 0 780 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1409"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="780" height="420" fill="#fafafa"/>
  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">样例 2 走查：L=30, b=1, f=1（删掉请求 2 的车后出现可插的空隙）</text>

  <!-- 第 1 次 -->
  <line x1="80" y1="90" x2="700" y2="90" stroke="#c9c9c9" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="80" y="76" width="120" height="28" rx="4" fill="#a8d8a8" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="95" text-anchor="middle" font-size="10" fill="#204a1e" filter="url(#rough2)">请求1: [0,5)</text>
  <text x="230" y="95" font-size="10" fill="#555" filter="url(#rough2)">→ 停在 0</text>

  <!-- 第 2 次 -->
  <line x1="80" y1="140" x2="700" y2="140" stroke="#c9c9c9" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="80" y="126" width="120" height="28" rx="4" fill="#a8d8a8" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="145" text-anchor="middle" font-size="10" fill="#204a1e" filter="url(#rough2)">[0,5)</text>
  <rect x="224" y="126" width="96" height="28" rx="4" fill="#ffd9b3" stroke="#b06a2c" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="272" y="145" text-anchor="middle" font-size="10" fill="#8a4a14" filter="url(#rough2)">请求2: [6,10)</text>
  <text x="340" y="145" font-size="10" fill="#555" filter="url(#rough2)">→ 5+1=6（左边放不下 4+1≤0）</text>

  <!-- 第 3 次 -->
  <line x1="80" y1="190" x2="700" y2="190" stroke="#c9c9c9" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="80" y="176" width="120" height="28" rx="4" fill="#a8d8a8" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="195" text-anchor="middle" font-size="10" fill="#204a1e" filter="url(#rough2)">[0,5)</text>
  <rect x="224" y="176" width="96" height="28" rx="4" fill="#ffd9b3" stroke="#b06a2c" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="272" y="195" text-anchor="middle" font-size="10" fill="#8a4a14" filter="url(#rough2)">[6,10)</text>
  <rect x="344" y="176" width="120" height="28" rx="4" fill="#a8d8a8" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="404" y="195" text-anchor="middle" font-size="10" fill="#204a1e" filter="url(#rough2)">请求3: [11,16)</text>

  <!-- 删除后 -->
  <line x1="80" y1="248" x2="700" y2="248" stroke="#c9c9c9" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="80" y="234" width="120" height="28" rx="4" fill="#a8d8a8" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="253" text-anchor="middle" font-size="10" fill="#204a1e" filter="url(#rough2)">[0,5)</text>
  <rect x="344" y="234" width="120" height="28" rx="4" fill="#a8d8a8" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="404" y="253" text-anchor="middle" font-size="10" fill="#204a1e" filter="url(#rough2)">[11,16)</text>
  <text x="500" y="253" font-size="10" fill="#8c3b37" filter="url(#rough2)">删除请求 2 → 空隙 5..11</text>

  <!-- 请求 6 插空 -->
  <line x1="80" y1="306" x2="700" y2="306" stroke="#c9c9c9" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="80" y="292" width="120" height="28" rx="4" fill="#a8d8a8" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="311" text-anchor="middle" font-size="10" fill="#204a1e" filter="url(#rough2)">[0,5)</text>
  <rect x="224" y="292" width="96" height="28" rx="4" fill="#c0392b" stroke="#8c2318" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="272" y="311" text-anchor="middle" font-size="10" fill="#ffffff" filter="url(#rough2)">请求6: [6,10)</text>
  <rect x="344" y="292" width="120" height="28" rx="4" fill="#a8d8a8" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="404" y="311" text-anchor="middle" font-size="10" fill="#204a1e" filter="url(#rough2)">[11,16)</text>
  <text x="500" y="311" font-size="10" fill="#8c3b37" filter="url(#rough2)">x=6：6+4=10 ≤ 11−1=10 ✓</text>

  <rect x="60" y="336" width="660" height="66" rx="9" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.3" filter="url(#rough2)"/>
  <text x="76" y="360" font-size="11" fill="#2f5223" filter="url(#rough2)">对比样例 1（f=2）：6+4=10 ≤ 11−2=9 不成立，所以请求 6 只能停到 23；</text>
  <text x="76" y="382" font-size="11" fill="#2f5223" filter="url(#rough2)">而 f=1 时空隙刚好够 → 停在 6。f 的取值直接决定"插空"是否成功。</text>
</svg>
