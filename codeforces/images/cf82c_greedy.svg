<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="720" height="440" fill="#fafafa"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每条边按「优先级」排队，每天发出容量 c 个</text>
  <path d="M 200 43 Q 360 49 520 43" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <rect x="50" y="70" width="620" height="96" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="66" y="96" text-anchor="start" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">把每个师看成一次「停车」：在第 v 座城市（边 v→父，容量 c_v）</text>
  <text x="66" y="122" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">出发日 = 满足「当天已排 ≤ c_v - 1 个」的最小日期 ≥ 到达日</text>
  <text x="66" y="148" text-anchor="start" font-size="11.5" fill="#777777" filter="url(#rough2)">按优先级从高到低依次占位 → 得到的就是真实发车过程（引理见正文）</text>
  <text x="60" y="200" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">第 d 天这一格最多 c 个师</text>
  <rect x="60" y="212" width="62" height="46" rx="4" fill="#ffffff" stroke="#777777" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="91" y="253" text-anchor="middle" font-size="9" fill="#777777" filter="url(#rough2)">第 0 天</text>
  <rect x="138" y="212" width="62" height="46" rx="4" fill="#ffffff" stroke="#777777" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="169" y="253" text-anchor="middle" font-size="9" fill="#777777" filter="url(#rough2)">第 1 天</text>
  <rect x="216" y="212" width="62" height="46" rx="4" fill="#ffffff" stroke="#777777" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="247" y="253" text-anchor="middle" font-size="9" fill="#777777" filter="url(#rough2)">第 2 天</text>
  <rect x="294" y="212" width="62" height="46" rx="4" fill="#ffffff" stroke="#777777" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="325" y="253" text-anchor="middle" font-size="9" fill="#777777" filter="url(#rough2)">第 3 天</text>
  <rect x="372" y="212" width="62" height="46" rx="4" fill="#ffffff" stroke="#777777" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="403" y="253" text-anchor="middle" font-size="9" fill="#777777" filter="url(#rough2)">第 4 天</text>
  <rect x="450" y="212" width="62" height="46" rx="4" fill="#ffffff" stroke="#777777" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="481" y="253" text-anchor="middle" font-size="9" fill="#777777" filter="url(#rough2)">第 5 天</text>
  <rect x="528" y="212" width="62" height="46" rx="4" fill="#ffffff" stroke="#777777" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="559" y="253" text-anchor="middle" font-size="9" fill="#777777" filter="url(#rough2)">第 6 天</text>
  <rect x="606" y="212" width="62" height="46" rx="4" fill="#ffffff" stroke="#777777" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="637" y="253" text-anchor="middle" font-size="9" fill="#777777" filter="url(#rough2)">第 7 天</text>
  <rect x="63" y="216" width="22" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="74" y="234" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">A</text>
  <rect x="141" y="216" width="22" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="152" y="234" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">B</text>
  <rect x="167" y="216" width="22" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="178" y="234" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">C</text>
  <rect x="297" y="216" width="22" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="308" y="234" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">D</text>
  <rect x="401" y="216" width="22" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="412" y="234" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">E</text>
  <rect x="453" y="216" width="22" height="26" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="464" y="234" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">F</text>
  <text x="60" y="286" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">A、B 都到达于第 0 天 → 占第 0、1 个位置；C 到达第 1 天，第 1 天已满 → 顺延</text>
  <text x="60" y="308" text-anchor="start" font-size="11" fill="#777777" filter="url(#rough2)">「满日」用并查集式的后继指针跳过，均摊 O(1)</text>
  <rect x="50" y="326" width="620" height="96" rx="7" fill="#e9f4e2" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="66" y="352" text-anchor="start" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">自底向上：先把子树里的师按优先级合并成有序表，再在父节点统一排出发日。</text>
  <text x="66" y="378" text-anchor="start" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">每个师在每个祖先处被处理一次；树链最坏 Σ 深度 = N(N-1)/2 ≈ 1.25×10^7 次。</text>
  <text x="66" y="402" text-anchor="start" font-size="11" fill="#3c5e2e" filter="url(#rough2)">合并用 k 路归并；容量为 1 的边只维护后继指针。</text>
</svg>
