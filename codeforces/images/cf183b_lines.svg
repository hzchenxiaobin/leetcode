<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="105"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="450" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">183B：过两只火烈鸟的直线，与 x 轴的交点 t 必须是整数</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <line x1="50.0" y1="330.0" x2="700.0" y2="330.0" stroke="#bbbbbb" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="68.0" y="324.0" width="24.0" height="14.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="80.0" y="354.0" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">1</text>
  <rect x="178.0" y="324.0" width="24.0" height="14.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="190.0" y="354.0" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">2</text>
  <rect x="288.0" y="324.0" width="24.0" height="14.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="300.0" y="354.0" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">3</text>
  <rect x="398.0" y="324.0" width="24.0" height="14.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="410.0" y="354.0" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">4</text>
  <rect x="508.0" y="324.0" width="24.0" height="14.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="520.0" y="354.0" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">5</text>
  <circle cx="190.0" cy="270.0" r="7.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="202.0" y="274.0" text-anchor="start" font-size="10.5" fill="#555" filter="url(#rough2)">(2,1)</text>
  <circle cx="410.0" cy="270.0" r="7.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="422.0" y="274.0" text-anchor="start" font-size="10.5" fill="#555" filter="url(#rough2)">(4,1)</text>
  <circle cx="300.0" cy="210.0" r="7.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="312.0" y="214.0" text-anchor="start" font-size="10.5" fill="#555" filter="url(#rough2)">(3,2)</text>
  <circle cx="410.0" cy="150.0" r="7.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="422.0" y="154.0" text-anchor="start" font-size="10.5" fill="#555" filter="url(#rough2)">(4,3)</text>
  <circle cx="410.0" cy="90.0" r="7.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="422.0" y="94.0" text-anchor="start" font-size="10.5" fill="#555" filter="url(#rough2)">(4,4)</text>
  <line x1="80.0" y1="330.0" x2="410.0" y2="150.0" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="124.0" y="264.0" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">t=1</text>
  <line x1="410.0" y1="330.0" x2="410.0" y2="66.0" stroke="#6b4c9a" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="418.0" y="66.0" text-anchor="start" font-size="10.5" fill="#6b4c9a" filter="url(#rough2)">x=4 → t=4</text>
  <rect x="40.0" y="372.0" width="640.0" height="56.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="54.0" y="395.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">截距 t = (x₁y₂ − x₂y₁) / (y₂ − y₁)：整除且 1 ≤ t ≤ n 才能被望远镜 t 使用</text>
</svg>
