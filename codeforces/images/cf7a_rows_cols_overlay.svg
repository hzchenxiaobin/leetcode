  <text x="352" y="268" text-anchor="start" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">答案 = r + c = 3</text>
  <text x="352" y="306" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">这 3 条线恰好盖住全部黑格，</text>
  <text x="352" y="330" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">而且少一条就会留下白格。</text>
