<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="720" height="300" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">窗口 = [t−n+1, t]：右端随记录前移，左端只增不减</text>
  <rect x="46" y="120" width="48" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="70" y="142" text-anchor="middle" font-size="10" fill="#2f4a66">t1</text>
  <rect x="126" y="120" width="48" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="150" y="142" text-anchor="middle" font-size="10" fill="#2f4a66">t2</text>
  <rect x="206" y="120" width="48" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="230" y="142" text-anchor="middle" font-size="10" fill="#2f4a66">t3</text>
  <rect x="286" y="120" width="48" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="310" y="142" text-anchor="middle" font-size="10" fill="#2f4a66">t4</text>
  <rect x="366" y="120" width="48" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="390" y="142" text-anchor="middle" font-size="10" fill="#2f4a66">t5</text>
  <rect x="446" y="120" width="48" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="470" y="142" text-anchor="middle" font-size="10" fill="#2f4a66">t6</text>
  <rect x="526" y="120" width="48" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="550" y="142" text-anchor="middle" font-size="10" fill="#2f4a66">t7</text>
  <rect x="606" y="120" width="48" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="630" y="142" text-anchor="middle" font-size="10" fill="#2f4a66">t8</text>
  <line x1="70" y1="196" x2="290" y2="196" stroke="#b4652a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="216" text-anchor="middle" font-size="11.5" fill="#7a4b22" filter="url(#rough2)">窗口右端：当前记录 t</text>
  <line x1="300" y1="232" x2="548" y2="232" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="424" y="252" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">窗口左端：只要 t − t_left ≥ n 就右移</text>
  <rect x="60" y="258" width="600" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="360" y="278" text-anchor="middle" font-size="11.5" fill="#2f5223">维护 left 指针：每个记录最多被 left 扫过一次 ⇒ O(记录数)</text>
</svg>
