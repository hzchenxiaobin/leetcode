<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">S 成功的等价刻画：① 每个叶子都在 S 中　② 每个纯环都含 S 中的点</text>

  <!-- 左面板：非纯环分量 -->
  <rect x="14" y="44" width="262" height="340" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="145" y="64" text-anchor="middle" font-size="13" fill="#8a6a1a" filter="url(#rough2)">非纯环分量（环上有挂树）</text>

  <!-- 环：4 个节点 -->
  <path d="M 96 244 Q 122 198 158 206" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 176 216 Q 196 250 180 278" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 166 294 Q 130 306 104 294" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 86 284 Q 68 262 78 250" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <circle cx="90" cy="238" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="90" y="243" text-anchor="middle" font-size="12" fill="#223" filter="url(#rough2)">a</text>
  <circle cx="170" cy="210" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="170" y="215" text-anchor="middle" font-size="12" fill="#223" filter="url(#rough2)">b</text>
  <circle cx="184" cy="286" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="184" y="291" text-anchor="middle" font-size="12" fill="#223" filter="url(#rough2)">c</text>
  <circle cx="96" cy="300" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="96" y="305" text-anchor="middle" font-size="12" fill="#223" filter="url(#rough2)">d</text>

  <!-- b 上方的挂树：b <- e <- (f,g 两个叶子，黑色=S) -->
  <path d="M 170 192 Q 166 168 172 154" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <circle cx="174" cy="140" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="174" y="145" text-anchor="middle" font-size="12" fill="#223" filter="url(#rough2)">e</text>
  <path d="M 160 128 Q 146 108 134 98" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 188 128 Q 202 110 214 100" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <circle cx="128" cy="86" r="15" fill="#446688" stroke="#223" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="128" y="91" text-anchor="middle" font-size="11" fill="#fff" filter="url(#rough2)">f</text>
  <circle cx="220" cy="88" r="15" fill="#446688" stroke="#223" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="220" y="93" text-anchor="middle" font-size="11" fill="#fff" filter="url(#rough2)">g</text>

  <!-- d 上的挂树：d <- h <- i（黑） -->
  <path d="M 88 314 Q 70 328 56 338" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <circle cx="48" cy="345" r="13" fill="#446688" stroke="#223" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="48" y="349" text-anchor="middle" font-size="11" fill="#fff" filter="url(#rough2)">i</text>

  <text x="170" y="352" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">深色 = S 中的点</text>
  <text x="152" y="378" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">叶子全在 S ⇒ 每个反向子树含黑点</text>

  <!-- 右面板：纯环分量 -->
  <rect x="292" y="44" width="254" height="340" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="419" y="68" text-anchor="middle" font-size="13" fill="#3a6030" filter="url(#rough2)">纯环分量（环上没有挂树）</text>

  <path d="M 386 216 Q 420 186 458 200" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 472 216 Q 480 262 448 284" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 428 292 Q 388 274 380 240" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <circle cx="374" cy="226" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="374" y="231" text-anchor="middle" font-size="12" fill="#223" filter="url(#rough2)">u</text>
  <circle cx="472" cy="204" r="19" fill="#446688" stroke="#223" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="472" y="209" text-anchor="middle" font-size="12" fill="#fff" filter="url(#rough2)">v</text>
  <circle cx="440" cy="294" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="440" y="299" text-anchor="middle" font-size="12" fill="#223" filter="url(#rough2)">w</text>

  <text x="419" y="86" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">没有叶子 ⇒ 必须靠环上的点覆盖</text>
  <text x="419" y="340" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">这里 v 在 S 中</text>
  <text x="419" y="376" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">若环全白 ⇒ S 失败</text>
</svg>
