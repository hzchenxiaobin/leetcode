<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>

  <text x="320" y="27" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：两次 BFS + 一次多源 Dijkstra + 三支取 min</text>

  <!-- input -->
  <rect x="200" y="46" width="240" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="320" y="68" text-anchor="middle" font-size="12" fill="#6b4e12" filter="url(#rough2)">读入 G、w、x、y、z</text>
  <path d="M 320 80 L 320 98" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <line x1="180" y1="98" x2="460" y2="98" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 180 98 L 180 102" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 460 98 L 460 102" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- two BFS -->
  <rect x="70" y="104" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="180" y="129" text-anchor="middle" font-size="11.5" fill="#2c4a66" filter="url(#rough2)">BFS(x) ⇒ d(x, ·)</text>
  <rect x="350" y="104" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="460" y="129" text-anchor="middle" font-size="11.5" fill="#2c4a66" filter="url(#rough2)">BFS(z) ⇒ d(z, ·)</text>
  <path d="M 180 144 L 180 170" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 460 144 L 460 170" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- multi-source dijkstra -->
  <rect x="70" y="170" width="500" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="320" y="194" text-anchor="middle" font-size="11.5" fill="#2f5220" filter="url(#rough2)">多源 Dijkstra：边权恒为 3，源点集 N(w)，源 v 的初值 d(x,v)</text>
  <text x="320" y="219" text-anchor="middle" font-size="11.5" fill="#2f5220" filter="url(#rough2)">⇒ A[u] = min over v∈N(w) of [ d(x,v) + 3·d(v,u) ]</text>
  <path d="M 320 236 L 320 252" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <line x1="112" y1="252" x2="528" y2="252" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 112 252 L 112 268" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 320 252 L 320 268" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 528 252 L 528 268" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- three branches -->
  <rect x="18" y="268" width="188" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="112" y="288" text-anchor="middle" font-size="10.5" fill="#5a7a99" filter="url(#rough2)">分支①  w = y 时</text>
  <text x="112" y="308" text-anchor="middle" font-size="11.5" fill="#2c4a66" filter="url(#rough2)">d(x, z)</text>

  <rect x="226" y="268" width="188" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="320" y="288" text-anchor="middle" font-size="10.5" fill="#5a7a99" filter="url(#rough2)">分支②  w ~ y 时</text>
  <text x="320" y="308" text-anchor="middle" font-size="11.5" fill="#2c4a66" filter="url(#rough2)">d(x,y) + 1 + d(w,z)</text>

  <rect x="434" y="268" width="188" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="528" y="288" text-anchor="middle" font-size="10.5" fill="#a05752" filter="url(#rough2)">分支③  一般情形</text>
  <text x="528" y="308" text-anchor="middle" font-size="10.5" fill="#8a3b37" filter="url(#rough2)">min_{u∈N(y)} A[u]+4+d(z,u)</text>

  <path d="M 112 320 L 112 334" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 320 320 L 320 342" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 528 320 L 528 334" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <line x1="112" y1="334" x2="528" y2="334" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>

  <rect x="200" y="342" width="240" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="320" y="365" text-anchor="middle" font-size="12" fill="#6b4e12" filter="url(#rough2)">ans = 三支取最小，输出</text>

  <text x="320" y="404" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">单组 O((n+m) log n)；三支必须都参与取 min（样例 2 由分支② 取胜）</text>
</svg>
