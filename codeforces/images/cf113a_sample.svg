<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="61"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="300" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">样例 3 的逐词归类：nataliala kataliala vetra feinites</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">四个词都是阴性，词性顺序为 形容词 形容词 名词 动词 ⇒ YES</text>
  <g filter="url(#rough2)"><rect x="40" y="96" width="190" height="92" rx="6" fill="#ffffff" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="135" y="124" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">nataliala</text>
  <text x="135" y="148" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">词性：形容词</text>
  <text x="135" y="170" text-anchor="middle" font-size="11.5" fill="#b06a1e" filter="url(#rough2)">性别：阴</text>
  <g filter="url(#rough2)"><rect x="100" y="200" width="70" height="26" rx="4" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="135" y="218" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">phase 0</text>
  <g filter="url(#rough2)"><rect x="255" y="96" width="190" height="92" rx="6" fill="#ffffff" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="350" y="124" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">kataliala</text>
  <text x="350" y="148" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">词性：形容词</text>
  <text x="350" y="170" text-anchor="middle" font-size="11.5" fill="#b06a1e" filter="url(#rough2)">性别：阴</text>
  <g filter="url(#rough2)"><line x1="233" y1="142" x2="251" y2="142" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)"/></g>
  <g filter="url(#rough2)"><rect x="315" y="200" width="70" height="26" rx="4" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="350" y="218" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">phase 0</text>
  <g filter="url(#rough2)"><rect x="470" y="96" width="190" height="92" rx="6" fill="#ffffff" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="565" y="124" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">vetra</text>
  <text x="565" y="148" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">词性：名词</text>
  <text x="565" y="170" text-anchor="middle" font-size="11.5" fill="#b06a1e" filter="url(#rough2)">性别：阴</text>
  <g filter="url(#rough2)"><line x1="448" y1="142" x2="466" y2="142" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)"/></g>
  <g filter="url(#rough2)"><rect x="530" y="200" width="70" height="26" rx="4" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="565" y="218" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">phase 1</text>
  <g filter="url(#rough2)"><rect x="685" y="96" width="190" height="92" rx="6" fill="#ffffff" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="780" y="124" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">feinites</text>
  <text x="780" y="148" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">词性：动词</text>
  <text x="780" y="170" text-anchor="middle" font-size="11.5" fill="#b06a1e" filter="url(#rough2)">性别：阴</text>
  <g filter="url(#rough2)"><line x1="663" y1="142" x2="681" y2="142" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)"/></g>
  <g filter="url(#rough2)"><rect x="745" y="200" width="70" height="26" rx="4" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="780" y="218" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">phase 2</text>
  <text x="450" y="262" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">名词数 = 1，性别集合只有 {阴} ⇒ 恰好一个陈述句 ⇒ YES</text>
</svg>
