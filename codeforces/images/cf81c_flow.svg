<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="133"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>

  <rect width="720" height="340" fill="#fafafa"/>
  <text x="360.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">三种情况与挑选方式</text>
  <path d="M 115.2 42 Q 360.0 48 604.8 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="360.0" y="326" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">目标 = T/b + S1·(1/a − 1/b)</text>
  <rect x="40" y="66" width="200" height="54" rx="7" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="140" y="90" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">读入 n, a, b, t</text>
  <text x="140" y="108" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">目标只依赖 S1</text>
  <rect x="268" y="66" width="180" height="54" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="358" y="90" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">a == b ?</text>
  <rect x="476" y="60" width="204" height="66" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="578" y="84" text-anchor="middle" font-size="12.5" fill="#2f5223" filter="url(#rough2)">前 a 个标 1</text>
  <text x="578" y="106" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">其余标 2（字典序最小）</text>
  <path d="M 240 93 L 264 93" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <path d="M 448 93 L 472 93" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <text x="460" y="82" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">是</text>
  <rect x="268" y="160" width="180" height="54" rx="7" fill="#fbeeee" stroke="#a05a5a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="358" y="184" text-anchor="middle" font-size="13" fill="#6b3030" filter="url(#rough2)">a &lt; b ?</text>
  <path d="M 358 120 L 358 156" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <text x="374" y="144" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">否</text>
  <rect x="476" y="154" width="204" height="66" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="578" y="178" text-anchor="middle" font-size="12.5" fill="#2f5223" filter="url(#rough2)">最大化 S1</text>
  <text x="578" y="200" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">v = 第 a 大</text>
  <path d="M 448 187 L 472 187" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <text x="460" y="176" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">是</text>
  <rect x="476" y="158" width="0" height="0" rx="7" fill="none" stroke="none" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="268" y="244" width="180" height="54" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="358" y="268" text-anchor="middle" font-size="12.5" fill="#335478" filter="url(#rough2)">else（a &gt; b）</text>
  <text x="358" y="286" text-anchor="middle" font-size="10.5" fill="#335478" filter="url(#rough2)">最小化 S1，v = 第 a 小</text>
  <path d="M 358 214 L 358 240" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <text x="374" y="232" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">否</text>
  <text x="140" y="170" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">同一目标：</text>
  <text x="140" y="190" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">系数 1/a − 1/b</text>
  <text x="140" y="210" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">决定最大化还是最小化</text>
  <rect x="40" y="244" width="204" height="54" rx="9" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="142" y="268" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">必选 = 严格好于 v 的</text>
  <text x="142" y="288" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">再取最早的 k 个 = v</text>
</svg>
