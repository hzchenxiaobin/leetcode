<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 345" width="780" height="345" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6" />
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a" />
    </marker>
  </defs>
  <rect width="780" height="345" fill="#fafafa" filter="url(#rough2)" />

  <text x="390" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">美丽数组 = 切成若干连续段，每段两端相等且等于段内最大值</text>
  <text x="390" y="54" text-anchor="middle" font-size="11.5" fill="#7a7a7a" filter="url(#rough2)">好对子只可能在段内出现；段与段之间互不影响，可以各自决定改哪些位置</text>

  
  <g>
    <rect x="90" y="150" width="62" height="42" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)" />
    <rect x="166" y="150" width="62" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" />
    <rect x="242" y="150" width="62" height="42" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)" />
    <rect x="318" y="150" width="62" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" />
    <rect x="394" y="150" width="62" height="42" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)" />
  </g>
  
  <g>
    <rect x="470" y="150" width="62" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)" />
    <rect x="546" y="150" width="62" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)" />
  </g>

  <g font-size="16" font-weight="bold" text-anchor="middle" fill="#3a3a3a">
    <text x="121" y="178" filter="url(#rough2)">4</text>
    <text x="197" y="178" filter="url(#rough2)">2</text>
    <text x="273" y="178" filter="url(#rough2)">4</text>
    <text x="349" y="178" filter="url(#rough2)">1</text>
    <text x="425" y="178" filter="url(#rough2)">4</text>
    <text x="501" y="178" filter="url(#rough2)">3</text>
    <text x="577" y="178" filter="url(#rough2)">3</text>
  </g>
  <g font-size="11" text-anchor="middle" fill="#8a8a8a">
    <text x="121" y="208" filter="url(#rough2)">1</text>
    <text x="197" y="208" filter="url(#rough2)">2</text>
    <text x="273" y="208" filter="url(#rough2)">3</text>
    <text x="349" y="208" filter="url(#rough2)">4</text>
    <text x="425" y="208" filter="url(#rough2)">5</text>
    <text x="501" y="208" filter="url(#rough2)">6</text>
    <text x="577" y="208" filter="url(#rough2)">7</text>
  </g>

  
  <path d="M121,146 Q197,98 273,146" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)" />
  <path d="M273,146 Q349,98 425,146" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)" />
  <path d="M501,146 Q539,110 577,146" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)" />
  <g font-size="12" font-weight="bold" text-anchor="middle" fill="#a03a36">
    <text x="197" y="92" filter="url(#rough2)">v = 4</text>
    <text x="349" y="92" filter="url(#rough2)">v = 4</text>
  </g>
  <text x="539" y="118" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#2e6e2e" filter="url(#rough2)">v = 3</text>

  
  <g fill="none" stroke="#4a7a3a" stroke-width="1.8">
    <path d="M90,236 L90,226 M90,236 L456,236 M456,236 L456,226" filter="url(#rough2)" />
  </g>
  <g fill="none" stroke="#d6a040" stroke-width="1.8">
    <path d="M470,236 L470,226 M470,236 L608,236 M608,236 L608,226" filter="url(#rough2)" />
  </g>
  <text x="273" y="258" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">段 1：b1 = b5 = 4 = 段内最大值</text>
  <text x="539" y="258" text-anchor="middle" font-size="12" font-weight="bold" fill="#a0761e" filter="url(#rough2)">段 2：b6 = b7 = 3</text>

  
  <text x="390" y="292" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">段 1 里 (1,3)、(3,5) 都共享下标 3，因此两端必然同值；段 2 与段 1 只是整数相邻，值可以不同</text>
  <text x="390" y="314" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">反过来：把每段里所有取到最大值的下标按顺序连成好对子，就能盖满整段</text>
</svg>