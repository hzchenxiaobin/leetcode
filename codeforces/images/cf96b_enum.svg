<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="720" height="400" fill="#fafafa"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按长度枚举超幸运数：偶数长度，4 与 7 各一半</text>
  <path d="M 200 43 Q 360 49 520 43" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="60" y="76" text-anchor="start" font-size="10.5" fill="#777777" filter="url(#rough2)">长度</text>
  <text x="150" y="76" text-anchor="start" font-size="10.5" fill="#777777" filter="url(#rough2)">个数 C(len, len/2)</text>
  <text x="320" y="76" text-anchor="start" font-size="10.5" fill="#777777" filter="url(#rough2)">例子</text>
  <rect x="50" y="100" width="620" height="40" rx="4" fill="#e8f0fe" stroke="#777777" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="125" text-anchor="start" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="150" y="125" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="320" y="125" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">47, 74</text>
  <rect x="50" y="144" width="620" height="40" rx="4" fill="#ffffff" stroke="#777777" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="169" text-anchor="start" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="150" y="169" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">6</text>
  <text x="320" y="169" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">4477 … 7744</text>
  <rect x="50" y="188" width="620" height="40" rx="4" fill="#e8f0fe" stroke="#777777" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="213" text-anchor="start" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">6</text>
  <text x="150" y="213" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">20</text>
  <text x="320" y="213" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">444777 … 777444</text>
  <rect x="50" y="232" width="620" height="40" rx="4" fill="#ffffff" stroke="#777777" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="257" text-anchor="start" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">8</text>
  <text x="150" y="257" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">70</text>
  <text x="320" y="257" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">…</text>
  <rect x="50" y="276" width="620" height="40" rx="4" fill="#ffffff" stroke="#777777" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="301" text-anchor="start" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">10</text>
  <text x="150" y="301" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">252</text>
  <text x="320" y="301" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">…</text>
  <rect x="50" y="300" width="620" height="56" rx="7" fill="#e9f4e2" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="66" y="324" text-anchor="start" font-size="11.5" fill="#2f5223" filter="url(#rough2)">总数只有 350 个，全部生成后取「≥ n 的最小值」即可。</text>
  <text x="66" y="344" text-anchor="start" font-size="11.5" fill="#2f5223" filter="url(#rough2)">n ≤ 10^9 时答案长度不超过 10（4444477777 &gt; 10^9）。</text>
  <text x="50" y="380" text-anchor="start" font-size="10.5" fill="#777777" filter="url(#rough2)">生成方式：枚举 2^len 个 0/1 mask，0→4、1→7，只保留 popcount = len/2 的。</text>
</svg>
