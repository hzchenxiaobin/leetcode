<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="602"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="c1" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="360" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">一条边 (g, l) 把两端完全绑定：乘起来是 g·l</text>
  <path d="M 150 42 Q 360 48 570 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 边的两端 -->
  <circle cx="170" cy="150" r="30" fill="#eef3f8" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="156" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a68" filter="url(#rough2)">aᵤ</text>
  <circle cx="470" cy="150" r="30" fill="#eef3f8" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="470" y="156" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a68" filter="url(#rough2)">aᵥ</text>
  <line x1="202" y1="150" x2="438" y2="150" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="138" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a68" filter="url(#rough2)">gcd = g，lcm = l</text>

  <!-- 关系 -->
  <rect x="120" y="200" width="480" height="52" rx="8" fill="#fdf6e6" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="224" text-anchor="middle" font-size="14" font-weight="bold" fill="#6b4a10" filter="url(#rough2)">aᵤ · aᵥ = g · l　且　g | aᵤ | l，g | aᵥ | l</text>
  <text x="360" y="244" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">写 aᵤ = g·x、aᵥ = g·y，则 gcd(x,y)=1 且 x·y = l/g</text>

  <!-- 传播 -->
  <path d="M 170 184 L 170 200" stroke="#446688" stroke-width="1.6" marker-end="url(#c1)" filter="url(#rough2)"/>
  <text x="60" y="272" font-size="12.5" font-weight="bold" fill="#8c3a37" filter="url(#rough2)">已知 aᵤ ⇒ aᵥ 唯一确定：</text>
  <text x="60" y="296" font-size="13" fill="#8c3a37" filter="url(#rough2)">aᵥ = g · l / aᵤ（必须整除）</text>
  <text x="60" y="318" font-size="11.5" fill="#8c3a37" filter="url(#rough2)">算完再验一遍 gcd(aᵤ,aᵥ)=g、lcm(aᵤ,aᵥ)=l</text>

  <rect x="400" y="262" width="290" height="66" rx="8" fill="#f4f8ee" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="414" y="284" font-size="11.5" fill="#2f5223" filter="url(#rough2)">所以：连通块里只要定下一个点的值，</text>
  <text x="414" y="303" font-size="11.5" fill="#2f5223" filter="url(#rough2)">整块就被唯一确定；枚举这个点的候选值</text>
  <text x="414" y="322" font-size="11.5" fill="#2f5223" filter="url(#rough2)">即可（候选只有它的 lcm 的因子）。</text>
</svg>
