<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="720" height="430" fill="#fafafa"/>
  <text x="360.0" y="33" font-size="20" font-weight="bold" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">直角顶点：行伙伴 × 列伙伴</text>
  <path d="M 287 44 Q 360.0 50 433 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="66" y="76" width="288" height="288" rx="4" fill="#f4f6f9" stroke="#9aa8b8" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 70 80 L 350 80" stroke="#c9d4e0" stroke-width="0.9" fill="none" filter="url(#rough2)"/>
  <path d="M 70 80 L 70 360" stroke="#c9d4e0" stroke-width="0.9" fill="none" filter="url(#rough2)"/>
  <path d="M 70 136 L 350 136" stroke="#c9d4e0" stroke-width="0.9" fill="none" filter="url(#rough2)"/>
  <path d="M 126 80 L 126 360" stroke="#c9d4e0" stroke-width="0.9" fill="none" filter="url(#rough2)"/>
  <path d="M 70 192 L 350 192" stroke="#c9d4e0" stroke-width="0.9" fill="none" filter="url(#rough2)"/>
  <path d="M 182 80 L 182 360" stroke="#c9d4e0" stroke-width="0.9" fill="none" filter="url(#rough2)"/>
  <path d="M 70 248 L 350 248" stroke="#c9d4e0" stroke-width="0.9" fill="none" filter="url(#rough2)"/>
  <path d="M 238 80 L 238 360" stroke="#c9d4e0" stroke-width="0.9" fill="none" filter="url(#rough2)"/>
  <path d="M 70 304 L 350 304" stroke="#c9d4e0" stroke-width="0.9" fill="none" filter="url(#rough2)"/>
  <path d="M 294 80 L 294 360" stroke="#c9d4e0" stroke-width="0.9" fill="none" filter="url(#rough2)"/>
  <path d="M 70 360 L 350 360" stroke="#c9d4e0" stroke-width="0.9" fill="none" filter="url(#rough2)"/>
  <path d="M 350 80 L 350 360" stroke="#c9d4e0" stroke-width="0.9" fill="none" filter="url(#rough2)"/>
  <circle cx="322.0" cy="220.0" r="7" fill="#22303f" filter="url(#rough2)"/>
  <circle cx="210.0" cy="108.0" r="7" fill="#22303f" filter="url(#rough2)"/>
  <circle cx="210.0" cy="220.0" r="7" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="98.0" cy="220.0" r="7" fill="#22303f" filter="url(#rough2)"/>
  <circle cx="210.0" cy="332.0" r="7" fill="#22303f" filter="url(#rough2)"/>
  <path d="M 210.0 220.0 L 98.0 220.0" stroke="#4a7a3a" stroke-width="2.0" fill="none" filter="url(#rough2)"/>
  <circle cx="98.0" cy="220.0" r="8" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 210.0 220.0 L 322.0 220.0" stroke="#4a7a3a" stroke-width="2.0" fill="none" filter="url(#rough2)"/>
  <circle cx="322.0" cy="220.0" r="8" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 210.0 220.0 L 210.0 108.0" stroke="#446688" stroke-width="2.0" fill="none" filter="url(#rough2)"/>
  <circle cx="210.0" cy="108.0" r="8" fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 210.0 220.0 L 210.0 332.0" stroke="#446688" stroke-width="2.0" fill="none" filter="url(#rough2)"/>
  <circle cx="210.0" cy="332.0" r="8" fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="210.0" y="206.0" font-size="10" font-weight="bold" fill="#b85450" text-anchor="middle" filter="url(#rough2)">直角顶点</text>
  <text x="182" y="382" font-size="10.5" font-weight="normal" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">第 i 行：3 个 *（含顶点）</text>
  <text x="362" y="204" font-size="10.5" font-weight="normal" fill="#446688" text-anchor="start" filter="url(#rough2)">第 j 列</text>
  <rect x="400" y="90" width="300" height="300" rx="8" fill="#f3f6fa" stroke="#9aa8b8" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="416" y="118" font-size="13" font-weight="bold" fill="#2b2b2b" text-anchor="start" filter="url(#rough2)">以 (i, j) 为直角顶点</text>
  <text x="416" y="148" font-size="11" font-weight="normal" fill="#2f5223" text-anchor="start" filter="url(#rough2)">水平边端点：第 i 行其余 *</text>
  <text x="416" y="168" font-size="12" font-weight="bold" fill="#4a7a3a" text-anchor="start" filter="url(#rough2)">→ R(i) − 1 = 2 种</text>
  <text x="416" y="198" font-size="11" font-weight="normal" fill="#2f5230" text-anchor="start" filter="url(#rough2)">竖直边端点：第 j 列其余 *</text>
  <text x="416" y="218" font-size="12" font-weight="bold" fill="#446688" text-anchor="start" filter="url(#rough2)">→ C(j) − 1 = 2 种</text>
  <text x="416" y="248" font-size="12" font-weight="normal" fill="#333" text-anchor="start" filter="url(#rough2)">乘法原理：</text>
  <rect x="416" y="258" width="264" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="548" y="284" font-size="13" font-weight="bold" fill="#2f5223" text-anchor="middle" filter="url(#rough2)">(R(i)−1)(C(j)−1) = 4</text>
  <text x="416" y="326" font-size="10.5" font-weight="normal" fill="#555" text-anchor="start" filter="url(#rough2)">每个三角形只有唯一的直角顶点，</text>
  <text x="416" y="344" font-size="10.5" font-weight="normal" fill="#555" text-anchor="start" filter="url(#rough2)">所以按顶点求和不会重复计数。</text>
  <text x="416" y="370" font-size="10" font-weight="normal" fill="#666" text-anchor="start" filter="url(#rough2)">行伙伴与列伙伴必不相同 → 非退化</text>
  <text x="360" y="410" font-size="10.5" font-weight="normal" fill="#666" text-anchor="middle" filter="url(#rough2)">绿色：同一行的候选伙伴；蓝色：同一列的候选伙伴；红色：当前直角顶点</text>
</svg>
