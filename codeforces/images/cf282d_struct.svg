<svg xmlns="http://www.w3.org/2000/svg" width="700" height="400" viewBox="0 0 700 400"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="183"/>
    <feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></defs>
  <rect width="700" height="400" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">把「是否存在到达必败态的一步」拆成四个 O(1) 查询</text>
  <path d="M 60 40 Q 350 46 640 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="64" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="13" fill="#22314a" filter="url(#rough2)">① 减第一堆：需要「存在 a' &lt; a 使 (a',b,c) 必败」</text>
  <text x="76" y="106" font-size="12" fill="#2f4a66" filter="url(#rough2)">⇒ 维护 minA[b][c] = 固定 (b,c) 时必败态里最小的 a；判 minA[b][c] &lt; a</text>
  <g filter="url(#rough2)"><rect x="60" y="130" width="580" height="64" rx="8" fill="#e8f4e0" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="154" font-size="13" fill="#2f5223" filter="url(#rough2)">②③ 同理维护 minB[a][c]、minC[a][b]</text>
  <text x="76" y="178" font-size="12" fill="#3c5e2e" filter="url(#rough2)">⇒ 分别判 minB[a][c] &lt; b、minC[a][b] &lt; c</text>
  <g filter="url(#rough2)"><rect x="60" y="202" width="580" height="88" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="76" y="226" font-size="13" fill="#8a6015" filter="url(#rough2)">④ 全体减 x：保持所有差值 a−b、b−c 不变！</text>
  <text x="76" y="250" font-size="12.5" fill="#8a6015" filter="url(#rough2)">⇒ 用键 (a−b, b−c) 维护 diag[·][·] = 该"对角线"上必败态的最小 min(a,b,c)；</text>
  <text x="76" y="274" font-size="12.5" fill="#8a6015" filter="url(#rough2)">判 diag[a−b][b−c] &lt; min(a,b,c)</text>
  <g filter="url(#rough2)"><rect x="60" y="300" width="580" height="86" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="324" font-size="13" fill="#2f5223" filter="url(#rough2)">四个条件任一成立 ⇒ 当前状态必胜；否则必败，并把它记进四个结构。</text>
  <text x="76" y="348" font-size="12" fill="#2f5223" filter="url(#rough2)">按总和递增推进 ⇒ 每个状态只算一次，转移 O(1)（不必枚举 x）。</text>
  <text x="76" y="372" font-size="12" fill="#2f5223" filter="url(#rough2)">复杂度：n=3 时 O(300³) = 2.7·10⁷，实测 0.10 s。</text>
</svg>
