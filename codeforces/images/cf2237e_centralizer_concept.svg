<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrb" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arra" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="430" fill="#fafafa"/>

  <g filter="url(#rough2)">
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心观察：b 与 a 交换 ⇔ 把 a 的每个环整体搬到等长的环上</text>
  <text x="310" y="46" text-anchor="middle" font-size="10.5" fill="#888">b 由环内任意一个点的像完全决定：b(a^i(x)) = a^i(b(x))，所以只剩一个「平移量」可选</text>
  </g>

  <g filter="url(#rough2)">
    <text x="150" y="80" text-anchor="middle" font-size="11" fill="#446688">a 的环 C = (1 2 3 4)</text>
    <path d="M 450 108 C 470 66, 130 66, 152 106" fill="none" stroke="#446688" stroke-width="1.6"
          stroke-dasharray="5 3" marker-end="url(#arra)"/>
  </g>

  <g filter="url(#rough2)">
    <rect x="115" y="110" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="215" y="110" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="315" y="110" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="415" y="110" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="150" y="132" text-anchor="middle" font-size="13" fill="#2f4d6b" font-weight="bold">1</text>
    <text x="250" y="132" text-anchor="middle" font-size="13" fill="#2f4d6b" font-weight="bold">2</text>
    <text x="350" y="132" text-anchor="middle" font-size="13" fill="#2f4d6b" font-weight="bold">3</text>
    <text x="450" y="132" text-anchor="middle" font-size="13" fill="#2f4d6b" font-weight="bold">4</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 187 127 L 211 127" stroke="#446688" stroke-width="1.6" marker-end="url(#arra)"/>
    <path d="M 287 127 L 311 127" stroke="#446688" stroke-width="1.6" marker-end="url(#arra)"/>
    <path d="M 387 127 L 411 127" stroke="#446688" stroke-width="1.6" marker-end="url(#arra)"/>
    <text x="300" y="104" text-anchor="middle" font-size="10" fill="#446688">a</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 150 150 L 150 234" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrb)"/>
    <path d="M 250 150 L 250 234" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrb)"/>
    <path d="M 350 150 L 350 234" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrb)"/>
    <path d="M 450 150 L 450 234" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrb)"/>
    <text x="512" y="196" font-size="12" fill="#3a5a30">b：1↦5，2↦6</text>
    <text x="512" y="214" font-size="12" fill="#3a5a30">3↦7，4↦8</text>
    <text x="512" y="232" font-size="10.5" fill="#6a8a60">（这里 shift = 0）</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="115" y="240" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="215" y="240" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="315" y="240" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="415" y="240" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="150" y="262" text-anchor="middle" font-size="13" fill="#3a5a30" font-weight="bold">5</text>
    <text x="250" y="262" text-anchor="middle" font-size="13" fill="#3a5a30" font-weight="bold">6</text>
    <text x="350" y="262" text-anchor="middle" font-size="13" fill="#3a5a30" font-weight="bold">7</text>
    <text x="450" y="262" text-anchor="middle" font-size="13" fill="#3a5a30" font-weight="bold">8</text>
    <path d="M 187 257 L 211 257" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrb)"/>
    <path d="M 287 257 L 311 257" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrb)"/>
    <path d="M 387 257 L 411 257" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrb)"/>
    <text x="300" y="290" text-anchor="middle" font-size="10" fill="#4a7a3a">a</text>
    <path d="M 450 278 C 470 320, 130 320, 152 280" fill="none" stroke="#4a7a3a" stroke-width="1.6"
          stroke-dasharray="5 3" marker-end="url(#arrb)"/>
  </g>

  <g filter="url(#rough2)">
    <rect x="70" y="336" width="480" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8"/>
    <text x="86" y="356" font-size="10.5" fill="#8a6a20">同一环内元素必须「等距」搬运；换一个平移量就得到另一个合法解</text>
    <text x="86" y="374" font-size="10.5" fill="#8a6a20">环与环之间只能「等长配对」，每个长度 L 的 k_L 个环可任意配对</text>
    <text x="86" y="392" font-size="10.5" fill="#8a6a20">因此合法 b 的总数 = 各长度 k_L! · L^{k_L} 的连乘（可用于对拍计数）</text>
  </g>
</svg>
