<svg xmlns="http://www.w3.org/2000/svg" width="840" height="440" viewBox="0 0 840 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="440" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1 走查：m=6，c₄=1, c₅=2, c₀=2</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">余数 0 的两件必须全摧毁；对余数 4、5 枚举合法集合，按件数加权</text>
  <text x="160" y="100" text-anchor="middle" font-size="13" fill="#555555" filter="url(#rough2)">∅</text>
  <text x="340" y="100" text-anchor="middle" font-size="13" fill="#555555" filter="url(#rough2)">{0}</text>
  <text x="560" y="100" text-anchor="middle" font-size="13" fill="#555555" filter="url(#rough2)">4, 5</text>
  <text x="730" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="160" y="146" text-anchor="middle" font-size="13" fill="#555555" filter="url(#rough2)">{4}</text>
  <text x="340" y="146" text-anchor="middle" font-size="13" fill="#555555" filter="url(#rough2)">{0,2,4}</text>
  <text x="560" y="146" text-anchor="middle" font-size="13" fill="#555555" filter="url(#rough2)">5</text>
  <text x="730" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">c₄ = 1</text>
  <text x="160" y="192" text-anchor="middle" font-size="13" fill="#555555" filter="url(#rough2)">{5}</text>
  <text x="340" y="192" text-anchor="middle" font-size="13" fill="#555555" filter="url(#rough2)">{0,1,5}</text>
  <text x="560" y="192" text-anchor="middle" font-size="13" fill="#555555" filter="url(#rough2)">无</text>
  <text x="730" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">c₅ = 2</text>
  <text x="160" y="238" text-anchor="middle" font-size="13" fill="#555555" filter="url(#rough2)">{4,5}</text>
  <text x="340" y="238" text-anchor="middle" font-size="13" fill="#555555" filter="url(#rough2)">{0,1,2,3,4,5}</text>
  <text x="560" y="238" text-anchor="middle" font-size="13" fill="#555555" filter="url(#rough2)">无</text>
  <text x="730" y="238" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">c₄·c₅ = 2</text>
  <g filter="url(#rough2)"><line x1="90" y1="112" x2="830" y2="112" stroke="#c8a48a" stroke-width="1.1"/></g>
  <text x="420" y="306" text-anchor="middle" font-size="14" font-weight="bold" fill="#3d6b2f" filter="url(#rough2)">四个节点贡献相加：1 + 1 + 2 + 2 = 6</text>
  <g filter="url(#rough2)"><rect x="120" y="330" width="600" height="84" rx="4" fill="#f7fbf4" fill-opacity="0.85" stroke="#a8c99a" stroke-width="1.3"/></g>
  <text x="420" y="356" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">{5} 之后没有更大的余数可加（按升序枚举，避免重复计数）</text>
  <text x="420" y="380" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">{4,5} 的差集覆盖全部余数，无法继续扩展</text>
  <text x="420" y="404" text-anchor="middle" font-size="11.5" fill="#8a4b2a" filter="url(#rough2)">两个 5 不能同时留下：加入第二个 5 时 5 已在差集中</text>
</svg>
