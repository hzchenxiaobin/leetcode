<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="360" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 3 走查：k=3，s = q 的逆排列</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">硬币序列 正-反-反 → 指数 0 → 1 → 0 → -1；中间两步都不是 s</text>
  <g filter="url(#rough2)"><rect x="60" y="120" width="176" height="64" rx="4" fill="#d7ecd0" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="148" y="146" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">开局</text>
  <text x="148" y="170" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">d=0  恒等排列</text>
  <g filter="url(#rough2)"><rect x="266" y="120" width="176" height="64" rx="4" fill="#d7ecd0" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="354" y="146" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">第1步 正</text>
  <text x="354" y="170" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">d=1  得到 q</text>
  <line x1="240" y1="152" x2="262" y2="152" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="472" y="120" width="176" height="64" rx="4" fill="#d7ecd0" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="560" y="146" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">第2步 反</text>
  <text x="560" y="170" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">d=0  回到恒等</text>
  <line x1="446" y1="152" x2="468" y2="152" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="678" y="120" width="176" height="64" rx="4" fill="#f6d9d7" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="766" y="146" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">第3步 反</text>
  <text x="766" y="170" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">d=-1  得到 q 的逆 = s</text>
  <line x1="652" y1="152" x2="674" y2="152" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="440" y="240" text-anchor="middle" font-size="13" fill="#3d6b2f" filter="url(#rough2)">每一步都检查：当前排列 ≠ s，所以"k 步之前从未出现"成立</text>
  <text x="440" y="272" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">若中途某步提前命中 s，这条路径就作废，需要换一条</text>
  <text x="440" y="304" text-anchor="middle" font-size="14" font-weight="bold" fill="#b05a5a" filter="url(#rough2)">最终答案是 YES</text>
</svg>
