<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="179"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="800" height="360" fill="#fafafa"/>

  <text x="400" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">连续 n 步是对合变换，于是整条序列以 2n 为周期</text>
  <path d="M 120 40 Q 400 46 680 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <rect x="40" y="110" width="90" height="42" rx="8" fill="#cfe0f5" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="85" y="137" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">M0</text>
  <rect x="160" y="110" width="90" height="42" rx="8" fill="#e4eefa" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="205" y="137" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">M1</text>
  <text x="278" y="137" font-size="16" fill="#777777" filter="url(#rough2)">…</text>
  <rect x="310" y="110" width="110" height="42" rx="8" fill="#e4eefa" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="365" y="137" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">M(n−1)</text>

  <rect x="450" y="110" width="140" height="42" rx="8" fill="#fbe3c8" stroke="#c98a2b" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="520" y="137" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">Mn = S − M0</text>
  <text x="612" y="137" font-size="16" fill="#777777" filter="url(#rough2)">…</text>
  <rect x="640" y="110" width="130" height="42" rx="8" fill="#f6d9d7" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="705" y="137" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">M(2n) = M0</text>

  <path d="M 132 131 L 156 131" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 252 131 L 306 131" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 422 131 L 446 131" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 592 131 L 636 131" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <path d="M 705 160 C 705 230 85 230 85 160" stroke="#b85450" stroke-width="1.6" fill="none"
        stroke-dasharray="6 4" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="395" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">周期 = 2n：M(i+2n) = M(i)</text>

  <text x="40" y="300" font-size="12" fill="#2b2b2b" filter="url(#rough2)">推导：M(i+n) = S(i) − M(i)，而 S(i) 只依赖 i mod n，故 S(i+n) = S(i)；</text>
  <text x="40" y="326" font-size="12" fill="#2b2b2b" filter="url(#rough2)">再走 n 步：M(i+2n) = S(i) − (S(i) − M(i)) = M(i)。</text>
  <text x="40" y="352" font-size="11.5" fill="#8a6015" filter="url(#rough2)">于是 M(j) = M(j mod 2n)，只需迭代至多 2n−1 步。</text>
</svg>
