<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="61"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">区间 [5,7] 只在差分数组上改两个位置，前缀和还原覆盖次数</text>
  <path d="M 96 42 Q 360 48 624 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 天数行 -->
  <text x="30" y="104" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">天</text>
  <g filter="url(#rough2)" font-size="12.5">
    <!-- 9 个格子，x 从 62 起，宽 62 -->
    <rect x="62" y="78" width="62" height="36" fill="#ffffff" stroke="#446688" stroke-width="1.3"/>
    <rect x="124" y="78" width="62" height="36" fill="#ffffff" stroke="#446688" stroke-width="1.3"/>
    <rect x="186" y="78" width="62" height="36" fill="#ffffff" stroke="#446688" stroke-width="1.3"/>
    <rect x="248" y="78" width="62" height="36" fill="#ffffff" stroke="#446688" stroke-width="1.3"/>
    <rect x="310" y="78" width="62" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="372" y="78" width="62" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="434" y="78" width="62" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="496" y="78" width="62" height="36" fill="#ffffff" stroke="#446688" stroke-width="1.3"/>
    <rect x="558" y="78" width="62" height="36" fill="#f4f4f4" stroke="#999" stroke-width="1.2" stroke-dasharray="5 3"/>
    <text x="93" y="101" text-anchor="middle" fill="#2b2b2b">1</text>
    <text x="155" y="101" text-anchor="middle" fill="#2b2b2b">2</text>
    <text x="217" y="101" text-anchor="middle" fill="#2b2b2b">3</text>
    <text x="279" y="101" text-anchor="middle" fill="#2b2b2b">4</text>
    <text x="341" y="101" text-anchor="middle" fill="#2f5223">5</text>
    <text x="403" y="101" text-anchor="middle" fill="#2f5223">6</text>
    <text x="465" y="101" text-anchor="middle" fill="#2f5223">7</text>
    <text x="527" y="101" text-anchor="middle" fill="#2b2b2b">8</text>
    <text x="589" y="101" text-anchor="middle" fill="#777" font-size="11">9=n+1</text>
  </g>
  <text x="341" y="140" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">区间 [5,7] 覆盖这 3 天</text>

  <!-- 箭头 -->
  <g filter="url(#rough2)">
    <path d="M 341 150 L 341 176" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#ab)"/>
    <path d="M 465 150 L 465 176" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#ab)"/>
  </g>

  <!-- 差分行 -->
  <text x="30" y="196" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">差分 d</text>
  <g filter="url(#rough2)" font-size="12.5">
    <rect x="62" y="172" width="62" height="34" fill="#ffffff" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="124" y="172" width="62" height="34" fill="#ffffff" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="186" y="172" width="62" height="34" fill="#ffffff" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="248" y="172" width="62" height="34" fill="#ffffff" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="310" y="172" width="62" height="34" fill="#fff8e1" stroke="#b85450" stroke-width="1.8"/>
    <rect x="372" y="172" width="62" height="34" fill="#ffffff" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="434" y="172" width="62" height="34" fill="#ffffff" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="496" y="172" width="62" height="34" fill="#fff8e1" stroke="#b85450" stroke-width="1.8"/>
    <rect x="558" y="172" width="62" height="34" fill="#f4f4f4" stroke="#999" stroke-width="1.2" stroke-dasharray="5 3"/>
    <text x="93" y="195" text-anchor="middle" fill="#777">0</text>
    <text x="155" y="195" text-anchor="middle" fill="#777">0</text>
    <text x="217" y="195" text-anchor="middle" fill="#777">0</text>
    <text x="279" y="195" text-anchor="middle" fill="#777">0</text>
    <text x="341" y="195" text-anchor="middle" font-weight="bold" fill="#b85450">+1</text>
    <text x="403" y="195" text-anchor="middle" fill="#777">0</text>
    <text x="465" y="195" text-anchor="middle" fill="#777">0</text>
    <text x="527" y="195" text-anchor="middle" font-weight="bold" fill="#b85450">−1</text>
    <text x="589" y="195" text-anchor="middle" fill="#777">0</text>
  </g>
  <text x="341" y="228" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">d[a]+=1 表示「从第 a 天起多一个人浇」</text>
  <text x="527" y="228" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">d[b+1]−=1 表示「从 b+1 天起这个人停了」</text>

  <!-- 前缀和行 -->
  <text x="30" y="290" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">前缀和 c</text>
  <g filter="url(#rough2)" font-size="12.5">
    <rect x="62" y="266" width="62" height="34" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="124" y="266" width="62" height="34" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="186" y="266" width="62" height="34" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="248" y="266" width="62" height="34" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="310" y="266" width="62" height="34" fill="#e6f4ea" stroke="#2f5223" stroke-width="1.8"/>
    <rect x="372" y="266" width="62" height="34" fill="#e6f4ea" stroke="#2f5223" stroke-width="1.8"/>
    <rect x="434" y="266" width="62" height="34" fill="#e6f4ea" stroke="#2f5223" stroke-width="1.8"/>
    <rect x="496" y="266" width="62" height="34" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="558" y="266" width="62" height="34" fill="#f4f4f4" stroke="#999" stroke-width="1.2" stroke-dasharray="5 3"/>
    <text x="93" y="289" text-anchor="middle" fill="#777">0</text>
    <text x="155" y="289" text-anchor="middle" fill="#777">0</text>
    <text x="217" y="289" text-anchor="middle" fill="#777">0</text>
    <text x="279" y="289" text-anchor="middle" fill="#777">0</text>
    <text x="341" y="289" text-anchor="middle" font-weight="bold" fill="#2f5223">1</text>
    <text x="403" y="289" text-anchor="middle" font-weight="bold" fill="#2f5223">1</text>
    <text x="465" y="289" text-anchor="middle" font-weight="bold" fill="#2f5223">1</text>
    <text x="527" y="289" text-anchor="middle" fill="#777">0</text>
    <text x="589" y="289" text-anchor="middle" fill="#777">0</text>
  </g>

  <rect x="62" y="322" width="558" height="76" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="76" y="348" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">m 个区间 → 2m 次单点修改；再从 1 到 n 扫一遍前缀和，找第一个 ≠ 1 的天。</text>
  <text x="76" y="370" font-size="12" fill="#2f4a66" filter="url(#rough2)">若整段前缀和都等于 1，说明每天恰好浇一次，输出 OK。</text>
  <text x="76" y="390" font-size="12" fill="#8a6015" filter="url(#rough2)">时间 O(n+m)，空间 O(n)；差分数组要开到 n+2，容纳 d[b_i+1]。</text>
</svg>
