<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="477"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="230" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">样例 1：从 (1,1) 出发</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">(1,1) 走 3 步 → (4,4)；再走 0 步；最后 1 步 → (4,2)</text>
  <text x="450" y="106" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">① (1,1)：min(3, 4) = 3 ⇒ (4,4)</text>
  <text x="450" y="140" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">② (1,1)：min(0, 1) = 0 ⇒ 不动</text>
  <text x="450" y="174" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">③ (0,−2)：min(∞, ⌊(4−1)/2⌋=1) = 1 ⇒ (4,2)</text>
  <text x="450" y="210" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">合计 4</text>
</svg>
