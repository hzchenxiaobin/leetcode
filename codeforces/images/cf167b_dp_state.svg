<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="760" height="400" fill="#fafafa"/>

  <rect x="50" y="150" width="170" height="76" rx="8" fill="#eef4fd" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="135" y="182" font-size="11.5" text-anchor="middle" fill="#35507a" filter="url(#rough2)">第 i 场开始前</text>
  <text x="135" y="210" font-size="17" text-anchor="middle" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">(j, c)</text>
  <rect x="400" y="66" width="316" height="58" rx="8" fill="#ffffff" stroke="#9db4cc" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="414" y="90" font-size="11.5" text-anchor="start" fill="#555" filter="url(#rough2)">不赢这场 (1−pᵢ)</text>
  <text x="414" y="114" font-size="12" text-anchor="start" fill="#35507a" font-weight="bold" filter="url(#rough2)">(j, c) 不变</text>
  <rect x="400" y="162" width="316" height="58" rx="8" fill="#f2f8ee" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="414" y="186" font-size="11.5" text-anchor="start" fill="#2f5223" filter="url(#rough2)">赢到背包 aᵢ (pᵢ)</text>
  <text x="414" y="210" font-size="12" text-anchor="start" fill="#2f5223" font-weight="bold" filter="url(#rough2)">(j+1, min(n, c+aᵢ))</text>
  <rect x="400" y="258" width="316" height="58" rx="8" fill="#fdf0ef" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="414" y="282" font-size="11.5" text-anchor="start" fill="#7a2f2f" filter="url(#rough2)">赢到巨大奖品 (pᵢ)</text>
  <text x="414" y="306" font-size="12" text-anchor="start" fill="#7a2f2f" font-weight="bold" filter="url(#rough2)">(j+1, c−1)</text>
  <line x1="222" y1="172" x2="392" y2="96" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="222" y1="190" x2="392" y2="190" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="222" y1="208" x2="392" y2="282" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="50" y="350" font-size="11.5" text-anchor="start" fill="#2b2b2b" filter="url(#rough2)">c = min(k, n) + 已赢得的背包容量 − 已赢得的巨大奖品数</text>
  <text x="50" y="376" font-size="11.5" text-anchor="start" fill="#b85450" filter="url(#rough2)">c 允许为负（先拿到奖品、后拿到背包），只有最终 c ≥ 0 才算成功</text>
  <text x="380.0" y="36" font-size="20" text-anchor="middle" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">状态 (已赢场次 j, 剩余容量 c) 的两个分支</text>
  <path d="M 120 46 Q 380.0 52 640 46" fill="none" stroke="#2b2b2b" stroke-width="1.3" filter="url(#rough2)"/>
</svg>
