<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1367"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="700" height="300" fill="#fafafa"/>
  <text x="350.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">缺几个值就改几个</text>
  <path d="M 112.0 42 Q 350.0 48 588.0 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="350.0" y="286" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">答案 = n − |{a_i ≤ n}|</text>
  <rect x="70" y="80" width="250" height="80" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="195" y="110" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">n = 5</text>
  <text x="195" y="140" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">a = 5 3 3 3 1</text>
  <text x="350" y="120" text-anchor="middle" font-size="20" fill="#333333" filter="url(#rough2)">→</text>
  <rect x="400" y="80" width="240" height="80" rx="7" fill="#fbeeee" stroke="#a05a5a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="520" y="110" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8c2f2c" filter="url(#rough2)">缺失 {2,4}</text>
  <text x="520" y="140" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">答案 2</text>
  <text x="350" y="205" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">>n 的值必须改；重复值多余；改一个位置即可补一个缺失值</text>
</svg>
