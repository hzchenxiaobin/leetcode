<svg xmlns="http://www.w3.org/2000/svg" width="840" height="300" viewBox="0 0 840 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="300" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">统计不同字母数</text>
  <text x="420" y="56" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">wjmzbmr → {w,j,m,z,b,r} = 6 个</text>
  <g filter="url(#rough2)"><rect x="200" y="100" width="56" height="44" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="228" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">w</text>
  <g filter="url(#rough2)"><rect x="270" y="100" width="56" height="44" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="298" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">j</text>
  <g filter="url(#rough2)"><rect x="340" y="100" width="56" height="44" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="368" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">m</text>
  <g filter="url(#rough2)"><rect x="410" y="100" width="56" height="44" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="438" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">z</text>
  <g filter="url(#rough2)"><rect x="480" y="100" width="56" height="44" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="508" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">b</text>
  <g filter="url(#rough2)"><rect x="550" y="100" width="56" height="44" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="578" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">m</text>
  <g filter="url(#rough2)"><rect x="620" y="100" width="56" height="44" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="648" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">r</text>
  <text x="420" y="190" text-anchor="middle" font-size="11.5" fill="#8a4b2a" filter="url(#rough2)">重复的 m 只计一次</text>
  <text x="420" y="226" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">不同字母数 6（偶）⇒ CHAT WITH HER!</text>
</svg>
