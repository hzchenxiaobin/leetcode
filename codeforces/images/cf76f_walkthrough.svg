<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="720" height="440" fill="#fafafa"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例：V = 2，三个事件在 (p,q) 平面</text>
  <path d="M 200 43 Q 360 49 520 43" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 60 250 L 680 250" stroke="#777777" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 400 400 L 400 60" stroke="#777777" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="684" y="264" text-anchor="start" font-size="12" fill="#777777" filter="url(#rough2)">p</text>
  <text x="410" y="56" text-anchor="start" font-size="12" fill="#777777" filter="url(#rough2)">q</text>
  <path d="M 400 250 L 400 254" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="394" y="270" text-anchor="end" font-size="10.5" fill="#b85450" filter="url(#rough2)">O</text>
  <circle cx="403.96" cy="240.82" r="7" fill="#e9f4e2" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="415.96" y="244.82" text-anchor="start" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">e₁ (1,3)</text>
  <circle cx="621.76" cy="335.68" r="7" fill="#fdecea" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="633.76" y="339.68" text-anchor="start" font-size="10.5" fill="#b85450" filter="url(#rough2)">e₂ (56,-28)</text>
  <circle cx="621.76" cy="323.44" r="7" fill="#fdecea" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="633.76" y="327.44" text-anchor="start" font-size="10.5" fill="#b85450" filter="url(#rough2)">e₃ (56,-24)</text>
  <path d="M 621.76 335.68 L 621.76 323.44" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="310" y="402" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">情形 1：q ≥ 0 的只有 e₁ → 1</text>
  <text x="310" y="426" text-anchor="start" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">情形 2：e₂ → e₃ 可比 → 2（样例输出 1 2）</text>
  <text x="90" y="120" text-anchor="start" font-size="11" fill="#4a7a3a" filter="url(#rough2)">e₁: p=2·1+(-1)=1, q=2·1-(-1)=3</text>
  <text x="90" y="146" text-anchor="start" font-size="11" fill="#b85450" filter="url(#rough2)">e₂: p=14+42=56, q=14-42=-28</text>
  <text x="90" y="172" text-anchor="start" font-size="11" fill="#b85450" filter="url(#rough2)">e₃: p=16+40=56, q=16-40=-24</text>
  <text x="90" y="206" text-anchor="start" font-size="10.5" fill="#777777" filter="url(#rough2)">e₂、e₃ 的 p 相同、q 递增，</text>
  <text x="90" y="228" text-anchor="start" font-size="10.5" fill="#777777" filter="url(#rough2)">所以它们可以连续参观。</text>
</svg>
