<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-6%" y="-6%" width="112%" height="112%"><feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="403" /><feDisplacementMap in="SourceGraphic" scale="1.5" /></filter></defs>
  <rect width="760" height="400" fill="#fafafa" />
  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">三个样例的坐标比较</text>
  <path d="M 150 44 Q 380 50 610 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)" />

  <g>
    <rect x="40" y="70" width="220" height="110" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)" />
    <rect x="270" y="70" width="220" height="110" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)" />
    <rect x="500" y="70" width="220" height="110" rx="9" fill="#fde8e8" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)" />
  </g>
  <text x="150" y="96" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">(0,0,0) 与 (0,1,0)</text>
  <text x="150" y="122" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">x、z 相同</text>
  <text x="150" y="152" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f5223" filter="url(#rough2)">YES</text>

  <text x="380" y="96" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">(1,1,0) 与 (0,1,0)</text>
  <text x="380" y="122" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">y、z 相同</text>
  <text x="380" y="152" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f5223" filter="url(#rough2)">YES</text>

  <text x="610" y="96" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">(0,0,0) 与 (1,1,1)</text>
  <text x="610" y="122" text-anchor="middle" font-size="11" fill="#8a3b36" filter="url(#rough2)">三个坐标都不同</text>
  <text x="610" y="152" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a3b36" filter="url(#rough2)">NO</text>

  <rect x="60" y="212" width="640" height="130" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)" />
  <text x="80" y="238" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">为什么“至少一个坐标相同”就够了？</text>
  <text x="80" y="264" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">正方体每个面都固定一个坐标为 0 或 1；两个顶点若共享某个坐标，就同在这个坐标对应的面上。</text>
  <text x="80" y="288" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">反过来，若三个坐标都不同，由于每个坐标只能取 0/1，它们就是体对角线的两个端点，不在任何同一面。</text>
  <text x="80" y="312" font-size="11.5" fill="#2f5223" filter="url(#rough2)">代码只需三次比较，$O(1)$。</text>
</svg>