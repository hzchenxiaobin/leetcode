<svg xmlns="http://www.w3.org/2000/svg" width="880" height="384" viewBox="0 0 880 384"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="101"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="384" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2：1—3—2—4 的链</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">到达时刻 2, 5, 6 → 平均 13/3</text>
  <g filter="url(#rough2)"><line x1="180" y1="120" x2="360" y2="120" stroke="#7a9a6a" stroke-width="2.4"/></g>
  <text x="270.0" y="112.0" text-anchor="middle" font-size="11.5" fill="#3d6b2f" font-weight="bold" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><line x1="360" y1="120" x2="540" y2="120" stroke="#7a9a6a" stroke-width="2.4"/></g>
  <text x="450.0" y="112.0" text-anchor="middle" font-size="11.5" fill="#3d6b2f" font-weight="bold" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><line x1="540" y1="120" x2="700" y2="200" stroke="#7a9a6a" stroke-width="2.4"/></g>
  <text x="620.0" y="152.0" text-anchor="middle" font-size="11.5" fill="#3d6b2f" font-weight="bold" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><circle cx="180" cy="120" r="20" fill="#f6e3c4" fill-opacity="0.9" stroke="#c9a86a" stroke-width="1.6"/></g>
  <text x="180" y="125" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><circle cx="360" cy="120" r="20" fill="#f6e3c4" fill-opacity="0.9" stroke="#c9a86a" stroke-width="1.6"/></g>
  <text x="360" y="125" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><circle cx="540" cy="120" r="20" fill="#f6e3c4" fill-opacity="0.9" stroke="#c9a86a" stroke-width="1.6"/></g>
  <text x="540" y="125" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><circle cx="700" cy="200" r="20" fill="#f6e3c4" fill-opacity="0.9" stroke="#c9a86a" stroke-width="1.6"/></g>
  <text x="700" y="205" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="440" y="268" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">从大厅 1 出发：3 号 t=2，2 号 t=5，4 号 t=6</text>
  <text x="440" y="296" text-anchor="middle" font-size="12" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">平均 = (2+5+6)/3 = 4.3333…</text>
  <text x="440" y="330" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">回程：3→1 要 2，(2,4) 子树来回共 2×(3+1)+3+3 = 14 分钟——但期望只统计"首次到达"时刻</text>
</svg>
