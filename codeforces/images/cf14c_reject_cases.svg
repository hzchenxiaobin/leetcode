<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="167"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="440" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两种典型的 NO：多出一段 / 少一条边</text>
  <path d="M 150 44 Q 380 50 610 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 左：样例 2 -->
  <rect x="24" y="60" width="350" height="350" rx="12" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="42" y="86" font-size="12.5" font-weight="bold" fill="#8a3b36" filter="url(#rough2)">官方样例 2：左边过长</text>

  <line x1="90" y1="320" x2="250" y2="320" stroke="#446688" stroke-width="4" filter="url(#rough2)"/>
  <line x1="250" y1="320" x2="250" y2="160" stroke="#4a7a3a" stroke-width="4" filter="url(#rough2)"/>
  <line x1="90" y1="160" x2="250" y2="160" stroke="#d6a040" stroke-width="4" filter="url(#rough2)"/>
  <line x1="90" y1="320" x2="90" y2="160" stroke="#7a5a9a" stroke-width="4" filter="url(#rough2)"/>
  <line x1="90" y1="160" x2="90" y2="80" stroke="#b85450" stroke-width="4" stroke-dasharray="7 5" filter="url(#rough2)"/>

  <circle cx="90" cy="320" r="5" fill="#fff" stroke="#2b2b2b" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="250" cy="320" r="5" fill="#fff" stroke="#2b2b2b" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="250" cy="160" r="5" fill="#fff" stroke="#2b2b2b" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="90" cy="160" r="5" fill="#fff" stroke="#2b2b2b" stroke-width="1.4" filter="url(#rough2)"/>

  <text x="100" y="108" font-size="11" fill="#b85450" filter="url(#rough2)">多出 y = 2..3 这段</text>
  <text x="100" y="126" font-size="11" fill="#b85450" filter="url(#rough2)">（矩形只到 y = 2）</text>
  <text x="42" y="350" font-size="11.5" fill="#555" filter="url(#rough2)">左边这条线段长度是 3，而矩形的</text>
  <text x="42" y="370" font-size="11.5" fill="#555" filter="url(#rough2)">竖直跨度只有 2：线段伸出了矩形，</text>
  <text x="42" y="390" font-size="12" font-weight="bold" fill="#8a3b36" filter="url(#rough2)">覆盖不精确 → 输出 NO</text>

  <!-- 右：H 形 -->
  <rect x="386" y="60" width="350" height="350" rx="12" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="404" y="86" font-size="12.5" font-weight="bold" fill="#8a3b36" filter="url(#rough2)">H 形：少了一条竖边</text>

  <line x1="430" y1="320" x2="690" y2="320" stroke="#446688" stroke-width="4" filter="url(#rough2)"/>
  <line x1="430" y1="160" x2="690" y2="160" stroke="#d6a040" stroke-width="4" filter="url(#rough2)"/>
  <line x1="430" y1="160" x2="430" y2="320" stroke="#7a5a9a" stroke-width="4" filter="url(#rough2)"/>
  <line x1="560" y1="160" x2="560" y2="320" stroke="#7a5a9a" stroke-width="4" filter="url(#rough2)"/>
  <line x1="690" y1="160" x2="690" y2="320" stroke="#b85450" stroke-width="2.2" stroke-dasharray="6 6" filter="url(#rough2)"/>
  <text x="610" y="246" font-size="11" fill="#b85450" filter="url(#rough2)">缺 x = 4 的竖线</text>

  <circle cx="430" cy="320" r="4.5" fill="#fff" stroke="#2b2b2b" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="690" cy="320" r="4.5" fill="#fff" stroke="#2b2b2b" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="690" cy="160" r="4.5" fill="#fff" stroke="#2b2b2b" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="430" cy="160" r="4.5" fill="#fff" stroke="#2b2b2b" stroke-width="1.4" filter="url(#rough2)"/>

  <text x="404" y="350" font-size="11.5" fill="#555" filter="url(#rough2)">两条竖线的 x 只有 0 和 2，而水平边</text>
  <text x="404" y="370" font-size="11.5" fill="#555" filter="url(#rough2)">的跨度是 0..4：右端点接不上。</text>
  <text x="404" y="390" font-size="12" font-weight="bold" fill="#8a3b36" filter="url(#rough2)">角点不闭合 → 输出 NO</text>
</svg>
