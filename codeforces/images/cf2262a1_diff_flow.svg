<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：O(1) 标记每个 k，一次前缀和收集答案</text>

  <!-- 步骤 1 -->
  <rect x="40" y="46" width="250" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="54" y="68" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">① 读入 n 与 a₁..a_n（多测逐组处理）</text>
  <text x="54" y="88" font-size="10.5" fill="#6a7a99" filter="url(#rough2)">diff[0..n] 全部清零</text>

  <!-- 步骤 2 -->
  <rect x="40" y="118" width="250" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="54" y="140" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">② for k = 1..n：算禁用区间</text>
  <text x="54" y="160" font-size="10.5" fill="#555" filter="url(#rough2)">L = a_k·k（long long）；若 L ≥ n 跳过</text>
  <text x="54" y="178" font-size="10.5" fill="#555" filter="url(#rough2)">R = min(n−1, L + k − 1)</text>

  <!-- 步骤 3 -->
  <rect x="40" y="208" width="250" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="54" y="230" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">③ 差分标记这一段</text>
  <text x="54" y="250" font-size="10.5" fill="#555" filter="url(#rough2)">diff[L]++；diff[R+1]−−</text>

  <!-- 步骤 4 -->
  <rect x="40" y="288" width="250" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="54" y="310" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">④ 前缀和扫描 x = 0..n−1</text>
  <text x="54" y="330" font-size="10.5" fill="#555" filter="url(#rough2)">cover += diff[x]；cover == 0 则 x 入 B</text>

  <!-- 步骤 5 -->
  <rect x="40" y="368" width="250" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="54" y="395" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">⑤ 输出 |B|，再输出 B（空集输出空行）</text>

  <!-- 箭头 -->
  <path d="M 165 98 L 165 116" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 165 188 L 165 206" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 165 268 L 165 286" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 165 348 L 165 366" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 右侧：区间覆盖示意 -->
  <text x="470" y="60" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">差分数组等价于「区间加 1」</text>

  <!-- 坐标轴 0..11 -->
  <path d="M 330 150 L 610 150" stroke="#999" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g font-size="9" fill="#999" text-anchor="middle" filter="url(#rough2)">
    <text x="330" y="166">0</text><text x="355" y="166">1</text><text x="380" y="166">2</text>
    <text x="405" y="166">3</text><text x="430" y="166">4</text><text x="455" y="166">5</text>
    <text x="480" y="166">6</text><text x="505" y="166">7</text><text x="530" y="166">8</text>
    <text x="555" y="166">9</text><text x="580" y="166">10</text><text x="605" y="166">11</text>
  </g>

  <!-- 三段禁用区间 -->
  <rect x="352" y="108" width="56" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="380" y="102" text-anchor="middle" font-size="9" fill="#8a3a36" filter="url(#rough2)">k=2: [2,3]</text>

  <rect x="418" y="86" width="100" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="470" y="80" text-anchor="middle" font-size="9" fill="#8a6a20" filter="url(#rough2)">k=4: [4,7]</text>

  <rect x="466" y="126" width="77" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="505" y="122" text-anchor="middle" font-size="9" fill="#3a5a30" filter="url(#rough2)">k=3: [6,8]</text>

  <!-- 覆盖计数条 -->
  <g font-size="9" fill="#555" text-anchor="middle" filter="url(#rough2)">
    <text x="330" y="196">0</text><text x="355" y="196">0</text><text x="380" y="196">1</text>
    <text x="405" y="196">1</text><text x="430" y="196">1</text><text x="455" y="196">1</text>
    <text x="480" y="196">2</text><text x="505" y="196">2</text><text x="530" y="196">1</text>
    <text x="555" y="196">0</text><text x="580" y="196">0</text><text x="605" y="196">0</text>
  </g>
  <text x="320" y="196" text-anchor="end" font-size="9.5" fill="#777" filter="url(#rough2)">覆盖数</text>

  <path d="M 330 214 L 610 214" stroke="#999" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <g font-size="10.5" fill="#3a5a30" text-anchor="middle" filter="url(#rough2)">
    <text x="330" y="236">✓</text><text x="355" y="236">✓</text><text x="380" y="236">✗</text>
    <text x="405" y="236">✗</text><text x="430" y="236">✗</text><text x="455" y="236">✗</text>
    <text x="480" y="236">✗</text><text x="505" y="236">✗</text><text x="530" y="236">✗</text>
    <text x="555" y="236">✓</text><text x="580" y="236">✓</text><text x="605" y="236">✓</text>
  </g>
  <text x="320" y="236" text-anchor="end" font-size="9.5" fill="#777" filter="url(#rough2)">可入 B?</text>

  <text x="470" y="268" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">覆盖数 &gt; 0 即禁用；用前缀和一次求出</text>

  <rect x="330" y="288" width="280" height="124" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="346" y="310" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">为什么不需要更复杂的构造？</text>
  <text x="346" y="330" font-size="10.5" fill="#555" filter="url(#rough2)">• 每个 k 只禁止「一个商值」，即一段连续区间</text>
  <text x="346" y="348" font-size="10.5" fill="#555" filter="url(#rough2)">• 可用集 U 是所有合法 B 的公共超集</text>
  <text x="346" y="366" font-size="10.5" fill="#555" filter="url(#rough2)">• 取满 U 恰好补全所有需要的商值</text>
  <text x="346" y="384" font-size="10.5" fill="#555" filter="url(#rough2)">• 于是「最大解」直接就是答案</text>
  <text x="346" y="402" font-size="10" fill="#8a3a36" filter="url(#rough2)">困难版（A2）问的是合法 B 的个数，才需要计数</text>
</svg>
