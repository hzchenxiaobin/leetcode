<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="400" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="38" text-anchor="middle" font-size="18.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">48D：cnt 必须非增，第 k 次出现的 v 就标成第 k 个排列</text>
  <path d="M 137 50 Q 380 56 623 50" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="84" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">长度为 L 的排列恰含 1..L 各一次 ⇒ “长度 ≥ v 的排列个数” 必须等于 cnt[v]。</text>
  <text x="60" y="110" text-anchor="start" font-size="11.5" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">于是 cnt[1] ≥ cnt[2] ≥ … ≥ cnt[maxV]，且排列总数 = cnt[1]。</text>
  <rect x="90" y="230" width="64" height="30" fill="#fff3e0" stroke="#bbb" stroke-width="1.0" filter="url(#rough2)"/>
  <rect x="90" y="196" width="64" height="30" fill="#fff3e0" stroke="#bbb" stroke-width="1.0" filter="url(#rough2)"/>
  <rect x="90" y="162" width="64" height="30" fill="#fff3e0" stroke="#bbb" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="122" y="250" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">cnt[1]</text>
  <rect x="210" y="230" width="64" height="30" fill="#fff3e0" stroke="#bbb" stroke-width="1.0" filter="url(#rough2)"/>
  <rect x="210" y="196" width="64" height="30" fill="#fff3e0" stroke="#bbb" stroke-width="1.0" filter="url(#rough2)"/>
  <rect x="210" y="162" width="64" height="30" fill="#fff3e0" stroke="#bbb" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="242" y="250" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">cnt[2]</text>
  <rect x="330" y="230" width="64" height="30" fill="#fff3e0" stroke="#bbb" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="362" y="250" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">cnt[3]</text>
  <rect x="450" y="230" width="64" height="30" fill="#fff3e0" stroke="#bbb" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="482" y="250" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">cnt[4]</text>
  <rect x="570" y="230" width="64" height="30" fill="#fff3e0" stroke="#bbb" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="602" y="250" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">cnt[5]</text>
  <text x="60" y="278" text-anchor="start" font-size="11.5" fill="#2f5223" font-weight="normal" filter="url(#rough2)">样例 1：cnt = 3,3,1,1,1 ⇒ 3 个排列，长度 5、2、2</text>
  <rect x="60" y="300" width="640" height="76" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="76" y="326" text-anchor="start" font-size="11.5" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">第 p 个排列 = {1..L_p}，L_p = max{ v : cnt[v] ≥ p }</text>
  <text x="76" y="352" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">给每个值按“出现次序”编号 1,2,…,cnt[v] 即可（顺序无关，任意标注都合法）。</text>
</svg>
