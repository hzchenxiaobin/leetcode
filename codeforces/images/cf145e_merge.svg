<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1451"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="720" height="300" fill="#fafafa"/>
  <text x="360.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">结点合并：切分点只可能在两个子段内</text>
  <path d="M 115.2 42 Q 360.0 48 604.8 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="360.0" y="286" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">inc = max(L.inc + R.c7, L.c4 + R.inc)</text>
  <rect x="70" y="80" width="220" height="70" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="110" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">左段</text>
  <text x="180" y="132" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">c4 / c7 / inc / dec</text>
  <rect x="430" y="80" width="220" height="70" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="540" y="110" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#335478" filter="url(#rough2)">右段</text>
  <text x="540" y="132" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">c4 / c7 / inc / dec</text>
  <text x="360" y="115" text-anchor="middle" font-size="20" fill="#333333" filter="url(#rough2)">+</text>
  <text x="360" y="190" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">切在左段内：L.inc + R.c7 ；切在右段内：L.c4 + R.inc</text>
  <text x="360" y="225" text-anchor="middle" font-size="11.5" fill="#335478" filter="url(#rough2)">dec 同理（非增 = 7…7 4…4）</text>
  <text x="360" y="262" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8c2f2c" filter="url(#rough2)">翻转：swap(c4,c7) 且 swap(inc,dec)——不是 len−inc</text>
</svg>
