<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="315"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">191E 样例 3：n=8, k=10 → 2</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="60.0" y="96.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">a = 1 -2 3 -4 5 -6 7 -8</text>
  <text x="60.0" y="130.0" text-anchor="start" font-size="11" fill="#555" filter="url(#rough2)">子段和最大的几个：7, 6(=5+7-6?), 5, 5, 3, 3, …</text>
  <rect x="60.0" y="170.0" width="600.0" height="70.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="74.0" y="193.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">第 10 大的子段和为 2</text>
  <text x="74.0" y="219.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">二分：count(X ≥ 2) ≥ 10，而 count(X ≥ 3) &lt; 10</text>
  <rect x="60.0" y="258.0" width="600.0" height="70.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="74.0" y="281.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">每次 count 用树状数组：O(n log n)，共 48 次二分</text>
  <text x="74.0" y="307.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">总 O(n log n log S)，C++ 约 0.5 s</text>
</svg>
