<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="4"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">逐格判定：四个条件任意一个成立就是好格</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="42.0" y="120.0" width="52.0" height="52.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="68.0" y="152.0" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="98.0" y="120.0" width="52.0" height="52.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="124.0" y="152.0" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="154.0" y="120.0" width="52.0" height="52.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="180.0" y="152.0" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="42.0" y="176.0" width="52.0" height="52.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="68.0" y="208.0" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="98.0" y="176.0" width="52.0" height="52.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="124.0" y="208.0" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="154.0" y="176.0" width="52.0" height="52.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="180.0" y="208.0" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="42.0" y="232.0" width="52.0" height="52.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="68.0" y="264.0" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="98.0" y="232.0" width="52.0" height="52.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="124.0" y="264.0" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">8</text>
  <rect x="154.0" y="232.0" width="52.0" height="52.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="180.0" y="264.0" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="124.0" y="104.0" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">样例 1：a[i][j]</text>
  <text x="124.0" y="312.0" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">n = 3, mid = 1</text>
  <rect x="250.0" y="96.0" width="240.0" height="150.0" fill="#ffffff" stroke="#6b4c9a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="262.0" y="120.0" text-anchor="start" font-size="12.5" fill="#6b4c9a" font-weight="bold" filter="url(#rough2)">对格子 (i, j) 依次判：</text>
  <text x="262.0" y="148.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">① i == j（主对角线）</text>
  <text x="262.0" y="172.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">② i + j == n − 1（副对角线）</text>
  <text x="262.0" y="196.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">③ i == mid（中间行）</text>
  <text x="262.0" y="220.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">④ j == mid（中间列）</text>
  <line x1="216.0" y1="202.0" x2="246.0" y2="202.0" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="512.0" y="108.0" width="190.0" height="126.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="522.0" y="136.0" text-anchor="start" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">任意一条成立</text>
  <text x="522.0" y="162.0" text-anchor="start" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">就 sum += a[i][j]</text>
  <text x="522.0" y="188.0" text-anchor="start" font-size="12" fill="#4a7a3a" filter="url(#rough2)">每格只加一次</text>
  <text x="522.0" y="214.0" text-anchor="start" font-size="12" fill="#4a7a3a" filter="url(#rough2)">天然不会重复计数</text>
  <line x1="492.0" y1="171.0" x2="508.0" y2="171.0" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="40.0" y="352.0" text-anchor="start" font-size="12" fill="#444" filter="url(#rough2)">n = 3 时 9 个格子全部命中（每条线都占满整行/整列/整对角线）</text>
  <text x="40.0" y="380.0" text-anchor="start" font-size="12" fill="#444" filter="url(#rough2)">复杂度 O(n²)：n ≤ 101 时约 10⁴ 次判断，远低于 2 s 时限</text>
</svg>
