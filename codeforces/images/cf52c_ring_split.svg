<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="720" height="420" fill="#fafafa"/>
  <text x="360.0" y="33" font-size="20" font-weight="bold" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">环形区间：lf &gt; rg 时拆成两段</text>
  <path d="M 266 44 Q 360.0 50 454 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <circle cx="220" cy="220" r="112" fill="none" stroke="#c9d4e0" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 123.00515477614289 276.00000000000006 L 123.00515477614287 164.0 L 220.0 108.0 L 316.9948452238571 164.0 L 316.99484522385717 276.0" stroke="#4a7a3a" stroke-width="4.0" fill="none" filter="url(#rough2)"/>
  <circle cx="220.0" cy="108.0" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="220.0" y="113.0" font-size="13" font-weight="bold" fill="#22303f" text-anchor="middle" filter="url(#rough2)">0</text>
  <circle cx="316.9948452238571" cy="164.0" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="316.9948452238571" y="169.0" font-size="13" font-weight="bold" fill="#22303f" text-anchor="middle" filter="url(#rough2)">1</text>
  <circle cx="316.99484522385717" cy="276.0" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="316.99484522385717" y="281.0" font-size="13" font-weight="bold" fill="#22303f" text-anchor="middle" filter="url(#rough2)">2</text>
  <circle cx="220.0" cy="332.0" r="19" fill="#ffffff" stroke="#9aa8b8" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="220.0" y="337.0" font-size="13" font-weight="bold" fill="#22303f" text-anchor="middle" filter="url(#rough2)">3</text>
  <circle cx="123.00515477614289" cy="276.00000000000006" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="123.00515477614289" y="281.00000000000006" font-size="13" font-weight="bold" fill="#22303f" text-anchor="middle" filter="url(#rough2)">4</text>
  <circle cx="123.00515477614287" cy="164.0" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="123.00515477614287" y="169.0" font-size="13" font-weight="bold" fill="#22303f" text-anchor="middle" filter="url(#rough2)">5</text>
  <text x="97.00515477614289" y="280.00000000000006" font-size="12" font-weight="bold" fill="#4a7a3a" text-anchor="end" filter="url(#rough2)">lf = 4</text>
  <text x="340.99484522385717" y="284.0" font-size="12" font-weight="bold" fill="#4a7a3a" text-anchor="start" filter="url(#rough2)">rg = 2</text>
  <text x="220" y="212" font-size="11" font-weight="normal" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">顺时针经过</text>
  <text x="220" y="230" font-size="11" font-weight="bold" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">4 → 5 → 0 → 1 → 2</text>
  <text x="420" y="96" font-size="11.5" font-weight="bold" fill="#2b2b2b" text-anchor="start" filter="url(#rough2)">线性下标：</text>
  <rect x="420" y="112" width="42" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="441.0" y="138" font-size="13" font-weight="bold" fill="#22303f" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="462" y="112" width="42" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="483.0" y="138" font-size="13" font-weight="bold" fill="#22303f" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="504" y="112" width="42" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="525.0" y="138" font-size="13" font-weight="bold" fill="#22303f" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="546" y="112" width="42" height="38" rx="4" fill="#ffffff" stroke="#9aa8b8" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="567.0" y="138" font-size="13" font-weight="bold" fill="#22303f" text-anchor="middle" filter="url(#rough2)">3</text>
  <rect x="588" y="112" width="42" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="609.0" y="138" font-size="13" font-weight="bold" fill="#22303f" text-anchor="middle" filter="url(#rough2)">4</text>
  <rect x="630" y="112" width="42" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="651.0" y="138" font-size="13" font-weight="bold" fill="#22303f" text-anchor="middle" filter="url(#rough2)">5</text>
  <path d="M 588 160 L 588 168 L 672 168 L 672 160" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="630" y="186" font-size="11" font-weight="normal" fill="#446688" text-anchor="middle" filter="url(#rough2)">[4, 5]</text>
  <path d="M 420 160 L 420 168 L 546 168 L 546 160" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="483.0" y="186" font-size="11" font-weight="normal" fill="#446688" text-anchor="middle" filter="url(#rough2)">[0, 2]</text>
  <text x="525" y="236" font-size="12" font-weight="bold" fill="#22303f" text-anchor="middle" filter="url(#rough2)">min( [4,5] , [0,2] ) 即为答案</text>
  <rect x="400" y="262" width="300" height="92" rx="8" fill="#f3f6fa" stroke="#9aa8b8" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="416" y="286" font-size="11.5" font-weight="normal" fill="#333" text-anchor="start" filter="url(#rough2)">lf ≤ rg：一段 [lf, rg]</text>
  <text x="416" y="308" font-size="11.5" font-weight="normal" fill="#333" text-anchor="start" filter="url(#rough2)">lf &gt; rg：[lf, n−1] ∪ [0, rg]</text>
  <text x="416" y="332" font-size="11" font-weight="normal" fill="#666" text-anchor="start" filter="url(#rough2)">两段不交，操作数至多 ×2</text>
  <text x="360" y="396" font-size="10.5" font-weight="normal" fill="#666" text-anchor="middle" filter="url(#rough2)">加法分别作用在两段上；查询取两段最小值的较小者</text>
</svg>
