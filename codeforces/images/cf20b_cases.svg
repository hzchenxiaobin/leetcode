<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="780" height="400" fill="#fafafa"/>
  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按 A、B、C 是否为 0 分类讨论</text>

  <!-- 根节点 -->
  <rect x="300" y="50" width="180" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="390" y="76" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">A = 0 ?</text>

  <line x1="360" y1="90" x2="200" y2="126" stroke="#446688" stroke-width="1.4" marker-end="url(#ar)" filter="url(#rough2)"/>
  <line x1="420" y1="90" x2="580" y2="126" stroke="#446688" stroke-width="1.4" marker-end="url(#ar)" filter="url(#rough2)"/>
  <text x="250" y="112" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">是</text>
  <text x="510" y="112" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">否 → 二次方程</text>

  <!-- 左：A=0 -->
  <rect x="80" y="128" width="240" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="200" y="154" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">B = 0 ?</text>
  <line x1="160" y1="168" x2="130" y2="200" stroke="#446688" stroke-width="1.3" marker-end="url(#ar)" filter="url(#rough2)"/>
  <line x1="240" y1="168" x2="270" y2="200" stroke="#446688" stroke-width="1.3" marker-end="url(#ar)" filter="url(#rough2)"/>
  <text x="110" y="190" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">是</text>
  <text x="286" y="190" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">否</text>

  <rect x="40" y="202" width="150" height="52" rx="8" fill="#fbeeee" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="115" y="224" text-anchor="middle" font-size="11.5" fill="#8f3b37" filter="url(#rough2)">C = 0 ?</text>
  <text x="115" y="244" text-anchor="middle" font-size="11" fill="#8f3b37" filter="url(#rough2)">-1 : 0</text>

  <rect x="206" y="202" width="150" height="52" rx="8" fill="#eef4ec" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="281" y="224" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">一次方程</text>
  <text x="281" y="244" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">根 = −C / B</text>

  <!-- 右：A != 0 -->
  <rect x="470" y="128" width="250" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="595" y="154" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">D = B² − 4AC</text>
  <g stroke="#446688" stroke-width="1.3" filter="url(#rough2)">
    <line x1="510" y1="168" x2="450" y2="204" marker-end="url(#ar)"/>
    <line x1="595" y1="168" x2="595" y2="204" marker-end="url(#ar)"/>
    <line x1="680" y1="168" x2="730" y2="204" marker-end="url(#ar)"/>
  </g>
  <rect x="390" y="206" width="110" height="52" rx="8" fill="#fbeeee" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="445" y="228" text-anchor="middle" font-size="11.5" fill="#8f3b37" filter="url(#rough2)">D &lt; 0</text>
  <text x="445" y="248" text-anchor="middle" font-size="12" font-weight="bold" fill="#8f3b37" filter="url(#rough2)">0</text>

  <rect x="540" y="206" width="110" height="52" rx="8" fill="#fdf3e3" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="595" y="228" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">D = 0</text>
  <text x="595" y="248" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">1 个根</text>

  <rect x="676" y="206" width="100" height="52" rx="8" fill="#eef4ec" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="726" y="228" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">D &gt; 0</text>
  <text x="726" y="248" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">2 个根</text>

  <rect x="60" y="292" width="660" height="88" rx="10" fill="#f4f6f9" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <g font-size="12" fill="#2f4a66" filter="url(#rough2)">
    <text x="76" y="316">· D 用整数算：B² − 4AC ≤ 5×10¹⁰，精确判断 &lt;0 / =0 / &gt;0。</text>
    <text x="76" y="340">· 两个根用稳定公式 q = −(B + sgn(B)√D)/2，x₁ = q/A，x₂ = C/q，避免大数相消。</text>
    <text x="76" y="364">· 输出前把两根升序排序（A &lt; 0 时公式给出的顺序是反的）。</text>
  </g>
</svg>
