<svg xmlns="http://www.w3.org/2000/svg" width="720" height="312" viewBox="0 0 720 312"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1424"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="720" height="312" fill="#fafafa"/>
  <text x="360.0" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">一个候选中心如何校验</text>
  <path d="M 115.2 42 Q 360.0 48 604.8 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 170.0 70.0 L 170.0 280.0" stroke="#555555" stroke-width="1.4" fill="none" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="170.0" y="62.0" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">对称轴 x = O_x</text>
  <circle cx="120.0" cy="110.0" r="12.0" fill="#e8eef7" stroke="#335478" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="220.0" cy="110.0" r="12.0" fill="#e8eef7" stroke="#335478" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 132.0 110.0 L 208.0 110.0" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <circle cx="120.0" cy="165.0" r="12.0" fill="#e8eef7" stroke="#335478" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="220.0" cy="165.0" r="12.0" fill="#e8eef7" stroke="#335478" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 132.0 165.0 L 208.0 165.0" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <circle cx="120.0" cy="220.0" r="12.0" fill="#e8eef7" stroke="#335478" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="220.0" cy="220.0" r="12.0" fill="#e8eef7" stroke="#335478" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 132.0 220.0 L 208.0 220.0" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <circle cx="170.0" cy="165.0" r="7.0" fill="#f7efe8" stroke="#8c5a2c" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170.0" y="300.0" text-anchor="middle" font-size="10.5" fill="#2f5223" filter="url(#rough2)">成对的点：镜像都在输入里</text>
  <circle cx="300.0" cy="110.0" r="12.0" fill="#f5e8e8" stroke="#8c2f2c" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="380.0" cy="220.0" r="12.0" fill="#f5e8e8" stroke="#8c2f2c" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300.0" y="88.0" text-anchor="middle" font-size="10.5" fill="#8c2f2c" font-weight="bold" filter="url(#rough2)">镜像缺失 → 熔掉</text>
  <text x="396.0" y="220.0" text-anchor="start" font-size="10.5" fill="#8c2f2c" font-weight="bold" filter="url(#rough2)">镜像缺失 → 熔掉</text>
  <rect x="430" y="96" width="280" height="90" rx="5" fill="#f5e8e8" stroke="#8c2f2c" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="570.0" y="131.8" text-anchor="middle" font-size="10.5" fill="#8c2f2c" filter="url(#rough2)">统计「镜像不在输入里」的点数 bad</text>
  <text x="570.0" y="144.8" text-anchor="middle" font-size="10.5" fill="#8c2f2c" filter="url(#rough2)">bad ≤ k ⇒ 该中心合法</text>
  <text x="570.0" y="157.8" text-anchor="middle" font-size="10.5" fill="#8c2f2c" filter="url(#rough2)">bad &gt; k ⇒ 直接否决</text>
  <text x="490.0" y="250.0" text-anchor="start" font-size="10.5" fill="#555555" filter="url(#rough2)">先查极值点，错误候选很快出局</text>
  <text x="360.0" y="298" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">这些缺失镜像的点必须全部熔化，其余点天然成对</text>
</svg>
