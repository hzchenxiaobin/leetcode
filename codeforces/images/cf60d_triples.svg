<svg xmlns="http://www.w3.org/2000/svg" width="740" height="380" viewBox="0 0 740 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="604"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="740" height="380" fill="#fafafa"/>

  <text x="370" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">「美丽三元组」= 本原勾股三元组，全部由 (m,n) 生成</text>
  <path d="M 120 40 Q 370 46 620 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 定义 -->
  <rect x="40" y="60" width="310" height="104" rx="8" fill="#eef3f8" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="56" y="84" font-size="12.5" font-weight="bold" fill="#2b4a68" filter="url(#rough2)">题面里的美丽三元组：</text>
  <text x="56" y="108" font-size="12" fill="#33506b" filter="url(#rough2)">x, y, z 两两互质，且 x² + y² = z²</text>
  <text x="56" y="130" font-size="12" fill="#33506b" filter="url(#rough2)">⇒ 正是「本原勾股三元组」</text>
  <text x="56" y="152" font-size="11.5" fill="#8a6015" filter="url(#rough2)">两块草坪能传笑 ⇔ 它们的数同处一个这样的三元组</text>

  <!-- 参数化 -->
  <rect x="390" y="60" width="310" height="104" rx="8" fill="#f4f8ee" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="406" y="84" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">本原三元组的完整参数化：</text>
  <text x="406" y="110" font-size="13" fill="#2f5223" filter="url(#rough2)">x = m² − n²，y = 2mn，z = m² + n²</text>
  <text x="406" y="132" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">m &gt; n ≥ 1，gcd(m,n) = 1，m、n 一奇一偶</text>
  <text x="406" y="152" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">反过来每个本原三元组都能这样唯一生成</text>

  <!-- 表格：例子 -->
  <g filter="url(#rough2)">
    <rect x="60" y="190" width="600" height="30" fill="#fdf6e6" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="60" y="220" width="600" height="28" fill="#ffffff" stroke="#ddd" stroke-width="1.2"/>
    <rect x="60" y="248" width="600" height="28" fill="#ffffff" stroke="#ddd" stroke-width="1.2"/>
    <rect x="60" y="276" width="600" height="28" fill="#ffffff" stroke="#ddd" stroke-width="1.2"/>
  </g>
  <text x="80" y="210" font-size="11.5" font-weight="bold" fill="#6b4a10" filter="url(#rough2)">(m, n)</text>
  <text x="220" y="210" font-size="11.5" font-weight="bold" fill="#6b4a10" filter="url(#rough2)">m² − n²</text>
  <text x="360" y="210" font-size="11.5" font-weight="bold" fill="#6b4a10" filter="url(#rough2)">2mn</text>
  <text x="500" y="210" font-size="11.5" font-weight="bold" fill="#6b4a10" filter="url(#rough2)">m² + n²</text>
  <text x="80" y="240" font-size="11.5" fill="#333" filter="url(#rough2)">(2, 1)</text>
  <text x="220" y="240" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="360" y="240" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="500" y="240" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="80" y="268" font-size="11.5" fill="#333" filter="url(#rough2)">(3, 2)</text>
  <text x="220" y="268" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="360" y="268" font-size="11.5" fill="#333" filter="url(#rough2)">12</text>
  <text x="500" y="268" font-size="11.5" fill="#333" filter="url(#rough2)">13</text>
  <text x="80" y="296" font-size="11.5" fill="#333" filter="url(#rough2)">(4, 1)</text>
  <text x="220" y="296" font-size="11.5" fill="#333" filter="url(#rough2)">15</text>
  <text x="360" y="296" font-size="11.5" fill="#333" filter="url(#rough2)">8</text>
  <text x="500" y="296" font-size="11.5" fill="#333" filter="url(#rough2)">17</text>

  <!-- 结论 -->
  <rect x="60" y="322" width="620" height="46" rx="8" fill="#fdf0ef" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="370" y="344" text-anchor="middle" font-size="12.5" fill="#8c3a37" filter="url(#rough2)">于是「i 能传给 j」⇔ aᵢ 与 aⱼ 出现在同一个参数化三元组里；</text>
  <text x="370" y="362" text-anchor="middle" font-size="12.5" fill="#8c3a37" filter="url(#rough2)">把所有三元组枚举出来、把其中出现过的 a 值并起来，答案就是连通块个数。</text>
</svg>
