<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="527"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="300" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">按 b 降序（同 b 按 a 降序）出牌</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">b ≥ 1 的牌净不减少计数器，越早出越好</text>
  <g filter="url(#rough2)"><rect x="80" y="96" width="120" height="44" rx="4" fill="#ffffff" fill-opacity="0.35" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="140" y="125" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">(0,2)</text>
  <text x="230" y="125" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">cnt: 1 → 2</text>
  <text x="430" y="125" text-anchor="start" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">先出，攒额度</text>
  <g filter="url(#rough2)"><rect x="80" y="152" width="120" height="44" rx="4" fill="#ffffff" fill-opacity="0.35" stroke="#b06a1e" stroke-width="1.4"/></g>
  <text x="140" y="181" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">(2,0)</text>
  <text x="230" y="181" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">cnt: 2 → 1</text>
  <text x="430" y="181" text-anchor="start" font-size="11.5" fill="#b06a1e" filter="url(#rough2)">用额度</text>
  <g filter="url(#rough2)"><rect x="80" y="208" width="120" height="44" rx="4" fill="#ffffff" fill-opacity="0.35" stroke="#b06a1e" stroke-width="1.4"/></g>
  <text x="140" y="237" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">(1,0)</text>
  <text x="230" y="237" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">cnt: 1 → 0</text>
  <text x="430" y="237" text-anchor="start" font-size="11.5" fill="#b06a1e" filter="url(#rough2)">用额度</text>
  <text x="450" y="262" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">得分 0 + 2 + 1 = 3（若先出 (2,0)，计数器归零只得 2）</text>
</svg>
