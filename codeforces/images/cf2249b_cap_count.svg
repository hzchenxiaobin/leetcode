<svg xmlns="http://www.w3.org/2000/svg" width="680" height="396" viewBox="0 0 680 396"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="37"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="396" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">两种身份 + 一次贪心：钉死位直接填，自由位按上界升序配值</text>
  <text x="340" y="51" text-anchor="middle" font-size="11.5" fill="#888888"
        filter="url(#rough2)">固定切点后，每个非 n 位置只有「钉死成某个值」或「自由但必须小于某值」两种可能</text>
  <rect x="34.0" y="68.0" width="302.0" height="160.0" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="185.0" y="92.0" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">左块 · i ≤ pos − 1（前缀 max = a[i]）</text>
  <text x="48.0" y="122.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">a[i] &gt; a[i-1] → p[i] = a[i]（钉死）</text>
  <text x="48.0" y="148.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">a[i] = a[i-1] → p[i] &lt; a[i]（自由）</text>
  <text x="48.0" y="174.0" text-anchor="start" font-size="12" fill="#b85450" filter="url(#rough2)">a[i] &lt; a[i-1] → 前缀 max 不单调，无解</text>
  <text x="48.0" y="204.0" text-anchor="start" font-size="11" fill="#888888" filter="url(#rough2)">i = 1 视作 a[0] = 0，故 a[1] 必为钉死位</text>
  <rect x="344.0" y="68.0" width="302.0" height="160.0" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="495.0" y="92.0" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">右块 · i ≥ pos + 1（后缀 max = a[i-1]）</text>
  <text x="358.0" y="120.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">i = n → p[n] = a[n-1]（钉死）</text>
  <text x="358.0" y="144.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">a[i-1] &gt; a[i] → p[i] = a[i-1]（钉死）</text>
  <text x="358.0" y="168.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">a[i-1] = a[i] → p[i] &lt; a[i]（自由）</text>
  <text x="358.0" y="192.0" text-anchor="start" font-size="12" fill="#b85450" filter="url(#rough2)">a[i-1] &lt; a[i] → 后缀 max 不单调，无解</text>
  <text x="358.0" y="214.0" text-anchor="start" font-size="12" fill="#b85450" filter="url(#rough2)">同一数值被钉死两次 → 无解</text>
  <rect x="34.0" y="248.0" width="612.0" height="128.0" rx="10" fill="#ffffff" stroke="#b0b0b0" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="340.0" y="272.0" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold" filter="url(#rough2)">自由位贪心：上界 b 从小到大处理</text>
  <rect x="96.0" y="284.0" width="488.0" height="40.0" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="340.0" y="309.0" text-anchor="middle" font-size="13" fill="#8a6d20" font-weight="bold" filter="url(#rough2)">K(b) = (b − 1) − 钉死值 &lt; b 的个数 − 上界更小的自由位个数</text>
  <text x="340.0" y="344.0" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">上界同为 b 的 f 个位置依次乘 K, K − 1, …, K − f + 1</text>
  <text x="340.0" y="365.0" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">任何一步出现 ≤ 0，说明值不够用 → 该切点贡献 0</text>
</svg>
