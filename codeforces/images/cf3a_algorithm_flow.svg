<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L6.5,3 L0,6 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L6.5,3 L0,6 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L6.5,3 L0,6 Z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">最短步数 + 逐字拼步的流程</text>
  <rect x="90" y="46" width="230" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="205" y="72" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">读入 s、t（各两个字符）</text>
  <rect x="80" y="110" width="250" height="76" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="205" y="132" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">dx = t列 − s列</text>
  <text x="205" y="154" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">dy = t行 − s行</text>
  <text x="205" y="176" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">steps = max(|dx|, |dy|)</text>
  <rect x="90" y="208" width="230" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="205" y="234" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">输出 steps</text>
  <path d="M205,264 L305,324 L205,384 L105,324 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" stroke-linecap="round" filter="url(#rough2)"/>
  <text x="205" y="320" text-anchor="middle" font-size="12" fill="#8a6d3b" filter="url(#rough2)">dx ≠ 0 或</text>
  <text x="205" y="338" text-anchor="middle" font-size="12" fill="#8a6d3b" filter="url(#rough2)">dy ≠ 0 ?</text>
  <rect x="380" y="270" width="240" height="56" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="500" y="294" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">拼一步：横字母 + 纵字母</text>
  <text x="500" y="314" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">某方向为 0 就只写一个字母</text>
  <rect x="380" y="344" width="240" height="56" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="500" y="368" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">输出本步，i ← i + 1</text>
  <text x="500" y="388" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">用到的分量各自向 0 移 1</text>
  <rect x="120" y="412" width="170" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="205" y="438" text-anchor="middle" font-size="12.5" fill="#7a3b38" filter="url(#rough2)">结束（已到 t）</text>
  <path d="M205,88 L205,110" fill="none" stroke="#446688" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M205,186 L205,208" fill="none" stroke="#446688" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M205,250 L205,260" fill="none" stroke="#446688" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M205,384 L205,412" fill="none" stroke="#b85450" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="216" y="400" text-anchor="start" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M305,324 L374,304" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="322" y="306" text-anchor="start" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M500,326 L500,344" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M380,372 L336,372 L336,324 L312,324" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="326" y="352" text-anchor="middle" font-size="10" fill="#4a7a3a" transform="rotate(-90 326 352)" filter="url(#rough2)">回到判断</text>
</svg>
