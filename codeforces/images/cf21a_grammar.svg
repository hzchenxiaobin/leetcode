<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">地址 = username @ hostname [ / resource ]</text>
  <path d="M 135 44 Q 360 50 585 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <rect x="35" y="90" width="180" height="80" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="125" y="126" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">username</text>
  <text x="125" y="150" text-anchor="middle" font-size="11" fill="#3c5a73" filter="url(#rough2)">字母 / 数字 / 下划线</text>

  <text x="232" y="138" text-anchor="middle" font-size="24" font-weight="bold" fill="#b85450" filter="url(#rough2)">@</text>

  <rect x="250" y="90" width="280" height="80" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5223" filter="url(#rough2)">hostname（用 . 分段）</text>
  <text x="390" y="144" text-anchor="middle" font-size="11" fill="#3c5e2e" filter="url(#rough2)">codeforces . com</text>

  <text x="544" y="138" text-anchor="middle" font-size="24" font-weight="bold" fill="#b85450" filter="url(#rough2)">/</text>

  <rect x="558" y="90" width="130" height="80" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="7 4" filter="url(#rough2)"/>
  <text x="623" y="126" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">resource</text>
  <text x="623" y="150" text-anchor="middle" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">可省略</text>

  <g font-size="11.5" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">
    <text x="125" y="196">长度 1 … 16</text>
    <text x="390" y="196">总长 1 … 32，每段 1 … 16</text>
    <text x="623" y="196">长度 1 … 16</text>
  </g>

  <rect x="35" y="228" width="650" height="136" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <g font-size="12" fill="#7a5a1b" filter="url(#rough2)">
    <text x="52" y="258">① username：只允许 A-Z、a-z、0-9、_，长度 1…16；不能含 '.'、'/'、'@'。</text>
    <text x="52" y="286">② hostname：只允许同样的字符与 '.'；按 '.' 切开的每一段长度 1…16，不能有空段；整个 hostname 长度 1…32。</text>
    <text x="52" y="314">③ resource：与 username 字符集、长度完全相同；有 '/' 时 resource 不能为空，也不能再含 '/'。</text>
    <text x="52" y="342">④ 输入保证字符 ASCII 33…127（没有空格），长度不超过 100；整行只读一个 token 即可。</text>
  </g>
</svg>
