<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="365"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="280" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">两个样例：c = 10 要 2 颗，c = 8 只要 1 颗</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">差别只在第 2 轮追上位置是否 ≥ c</text>
  <g filter="url(#rough2)"><rect x="60" y="96" width="120" height="60" rx="5" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="120" y="132" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">c = 10</text>
  <text x="210" y="122" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">第 1 轮追上于 2</text>
  <text x="210" y="144" text-anchor="start" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">第 2 轮追上于 8 &lt; 10 ⇒ 再丢 1 颗</text>
  <g filter="url(#rough2)"><rect x="740" y="96" width="120" height="60" rx="5" fill="#ffffff" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="800" y="132" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2 颗</text>
  <g filter="url(#rough2)"><rect x="60" y="172" width="120" height="60" rx="5" fill="#f6e3c4" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="120" y="208" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">c = 8</text>
  <text x="210" y="198" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">第 1 轮追上于 2</text>
  <text x="210" y="220" text-anchor="start" font-size="11.5" fill="#b06a1e" filter="url(#rough2)">第 2 轮追上于 8 = c ⇒ 公主先到</text>
  <g filter="url(#rough2)"><rect x="740" y="172" width="120" height="60" rx="5" fill="#ffffff" fill-opacity="0.85" stroke="#b06a1e" stroke-width="1.4"/></g>
  <text x="800" y="208" text-anchor="middle" font-size="13" fill="#b06a1e" font-weight="bold" filter="url(#rough2)">1 颗</text>
  <text x="450" y="254" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">「恰好同时到达」按题意算公主赢，所以 c = 8 时第 2 颗宝石不需要</text>
</svg>
