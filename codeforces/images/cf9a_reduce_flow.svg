<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="97"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="a9barr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">先数获胜面，再约成最简分数</text>
  <path d="M 160 44 Q 360 50 560 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 左：流程 -->
  <rect x="40" y="66" width="250" height="48" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="165" y="96" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">读入 Y, W</text>
  <line x1="165" y1="114" x2="165" y2="132" stroke="#446688" stroke-width="1.7" marker-end="url(#a9barr)" filter="url(#rough2)"/>

  <rect x="40" y="134" width="250" height="48" rx="10" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="165" y="164" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">m = max(Y, W)</text>
  <line x1="165" y1="182" x2="165" y2="200" stroke="#446688" stroke-width="1.7" marker-end="url(#a9barr)" filter="url(#rough2)"/>

  <rect x="40" y="202" width="250" height="48" rx="10" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="165" y="232" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">A = 7 - m，B = 6</text>
  <line x1="165" y1="250" x2="165" y2="268" stroke="#446688" stroke-width="1.7" marker-end="url(#a9barr)" filter="url(#rough2)"/>

  <rect x="40" y="270" width="250" height="48" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="165" y="300" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">g = gcd(A, B)</text>
  <line x1="165" y1="318" x2="165" y2="336" stroke="#446688" stroke-width="1.7" marker-end="url(#a9barr)" filter="url(#rough2)"/>

  <rect x="40" y="338" width="250" height="48" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="165" y="368" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">输出 A/g ÷ B/g</text>

  <!-- 右：三个约分实例 -->
  <rect x="330" y="66" width="360" height="320" rx="12" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="352" y="92" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">约分实例</text>

  <text x="352" y="128" font-size="12" fill="#555" filter="url(#rough2)">m = 4</text>
  <text x="420" y="128" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">3/6</text>
  <text x="468" y="128" font-size="12" fill="#b85450" filter="url(#rough2)">÷3</text>
  <line x1="498" y1="122" x2="540" y2="122" stroke="#446688" stroke-width="1.6" marker-end="url(#a9barr)" filter="url(#rough2)"/>
  <text x="556" y="128" font-size="16" font-weight="bold" fill="#2f5223" filter="url(#rough2)">1/2</text>

  <text x="352" y="178" font-size="12" fill="#555" filter="url(#rough2)">m = 5</text>
  <text x="420" y="178" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">2/6</text>
  <text x="468" y="178" font-size="12" fill="#b85450" filter="url(#rough2)">÷2</text>
  <line x1="498" y1="172" x2="540" y2="172" stroke="#446688" stroke-width="1.6" marker-end="url(#a9barr)" filter="url(#rough2)"/>
  <text x="556" y="178" font-size="16" font-weight="bold" fill="#2f5223" filter="url(#rough2)">1/3</text>

  <text x="352" y="228" font-size="12" fill="#555" filter="url(#rough2)">m = 1</text>
  <text x="420" y="228" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">6/6</text>
  <text x="468" y="228" font-size="12" fill="#b85450" filter="url(#rough2)">÷6</text>
  <line x1="498" y1="222" x2="540" y2="222" stroke="#446688" stroke-width="1.6" marker-end="url(#a9barr)" filter="url(#rough2)"/>
  <text x="556" y="228" font-size="16" font-weight="bold" fill="#2f5223" filter="url(#rough2)">1/1</text>

  <text x="352" y="278" font-size="12" fill="#555" filter="url(#rough2)">m = 6</text>
  <text x="420" y="278" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">1/6</text>
  <text x="468" y="278" font-size="12" fill="#b85450" filter="url(#rough2)">÷1</text>
  <line x1="498" y1="272" x2="540" y2="272" stroke="#446688" stroke-width="1.6" marker-end="url(#a9barr)" filter="url(#rough2)"/>
  <text x="556" y="278" font-size="16" font-weight="bold" fill="#2f5223" filter="url(#rough2)">1/6</text>

  <text x="352" y="322" font-size="11.5" fill="#777" filter="url(#rough2)">A ≥ 1（m ≤ 6），所以概率永远不会是 0/1。</text>
  <text x="352" y="346" font-size="11.5" fill="#777" filter="url(#rough2)">输出必须互质：样例若写 3/6 会被判错。</text>
</svg>
