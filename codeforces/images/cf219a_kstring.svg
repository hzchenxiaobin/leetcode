<svg xmlns="http://www.w3.org/2000/svg" width="840" height="380" viewBox="0 0 840 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="380" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">k-串 = 同一个基本块重复 k 遍</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">例如 k = 3、基本块 b = "ab"：三份拷贝拼成 "ababab"</text>
  <g filter="url(#rough2)"><rect x="250" y="110" width="84" height="46" rx="4" fill="#d7ecd0" fill-opacity="0.95" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="292.0" y="140" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">ab</text>
  <text x="292.0" y="98" text-anchor="middle" font-size="11.5" fill="#3d6b2f" filter="url(#rough2)">第 1 份</text>
  <g filter="url(#rough2)"><rect x="358" y="110" width="84" height="46" rx="4" fill="#d7ecd0" fill-opacity="0.95" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="400.0" y="140" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">ab</text>
  <text x="400.0" y="98" text-anchor="middle" font-size="11.5" fill="#3d6b2f" filter="url(#rough2)">第 2 份</text>
  <g filter="url(#rough2)"><rect x="466" y="110" width="84" height="46" rx="4" fill="#d7ecd0" fill-opacity="0.95" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="508.0" y="140" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">ab</text>
  <text x="508.0" y="98" text-anchor="middle" font-size="11.5" fill="#3d6b2f" filter="url(#rough2)">第 3 份</text>
  <text x="420" y="196" text-anchor="middle" font-size="24" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">a b a b a b</text>
  <g filter="url(#rough2)"><circle cx="300" cy="186" r="4" fill="#a0522d" fill-opacity="0.9" stroke="#a0522d" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><circle cx="468" cy="186" r="4" fill="#a0522d" fill-opacity="0.9" stroke="#a0522d" stroke-width="1.4"/></g>
  <text x="420" y="232" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">每个字母在各份里出现次数相同 ⇒ 总次数必是 k 的倍数</text>
  <g filter="url(#rough2)"><rect x="120" y="262" width="600" height="84" rx="4" fill="#faf3ec" fill-opacity="0.85" stroke="#c8a48a" stroke-width="1.3"/></g>
  <text x="420" y="288" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">反推：若每个字母总次数都能被 k 整除，就令基本块含 cnt_c / k 个字母 c，</text>
  <text x="420" y="312" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">再把基本块重复 k 遍 —— 总次数与 s 完全一致，所以它是 s 的重排，且合法。</text>
  <text x="420" y="336" text-anchor="middle" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">于是判定条件就是：26 个 cnt[c] mod k 全为 0。</text>
</svg>
