<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 0 780 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="53"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="780" height="440" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">盘沿、Honduras、Guadeloupe 与一圈绿色半熟蛋</text>
  <path d="M 156 39 Q 390 45 624 39" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <circle cx="250" cy="240" r="150.0" fill="#f4f4f4" stroke="#2b2b2b" stroke-width="2.0" filter="url(#rough2)"/>
  <circle cx="325.0" cy="240" r="75.0" fill="#fdf3e3" stroke="#8a6015" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="175.0" cy="240" r="75.0" fill="#f7e8ef" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="250.0" cy="140.0" r="50.0" fill="#e2f1e6" stroke="#3f6b4a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250.0" y="144.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">ρ1</text>
  <circle cx="325.0" cy="140.0" r="25.000000000000004" fill="#e2f1e6" stroke="#3f6b4a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="325.0" y="144.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">ρ2</text>
  <circle cx="359.0909090909091" cy="158.1818181818182" r="13.636363636363638" fill="#e2f1e6" stroke="#3f6b4a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="378.72727272727275" y="162.1818181818182" text-anchor="start" font-size="11" font-weight="bold" fill="#2f5223" filter="url(#rough2)">ρ3</text>
  <text x="108.0" y="412.0" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">盘子，半径 R</text>
  <text x="335.0" y="335.0" text-anchor="start" font-size="12.5" fill="#8a6015" filter="url(#rough2)">Honduras 半径 r（内切盘沿）</text>
  <text x="145.0" y="337.0" text-anchor="start" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">Guadeloupe 半径 R − r</text>
  <text x="165.0" y="246" text-anchor="start" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">ρ0</text>
  <line x1="221.0" y1="196" x2="466" y2="150" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <rect x="468" y="118" width="292" height="66" rx="8" fill="#f7ecec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="480" y="142" text-anchor="start" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">Guadeloupe 是能塞进缝隙的最大圆：</text>
  <text x="480" y="164" text-anchor="start" font-size="12" fill="#8a3b37" filter="url(#rough2)">半径 R − r，与盘沿、Honduras 都相切</text>
  <rect x="468" y="200" width="292" height="96" rx="8" fill="#e2f1e6" stroke="#3f6b4a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="480" y="224" text-anchor="start" font-size="12" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">绿色依次相切：每块都同时</text>
  <text x="480" y="246" text-anchor="start" font-size="12" fill="#2f5223" filter="url(#rough2)">内切盘沿、外切 Honduras、外切上一块</text>
  <text x="480" y="268" text-anchor="start" font-size="12" fill="#2f5223" filter="url(#rough2)">ρ1 &gt; ρ2 &gt; ρ3 &gt; …，越绕越小</text>
  <text x="480" y="290" text-anchor="start" font-size="11" fill="#6a6a6a" filter="url(#rough2)">（图按 R=2, r=1 等比绘制）</text>
</svg>
