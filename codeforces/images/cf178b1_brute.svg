<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">B1 的暴力：逐条删边 + BFS 判连通</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="150.0" y="76.0" width="400.0" height="44.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="166.0" y="102.5" text-anchor="start" font-size="12.5" fill="#3f3420" filter="url(#rough2)">for 每个商人 (s, l)</text>
  <rect x="150.0" y="140.0" width="400.0" height="44.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="166.0" y="166.5" text-anchor="start" font-size="12.5" fill="#3f3420" filter="url(#rough2)">for ban = 0 .. m-1</text>
  <line x1="350.0" y1="120.0" x2="350.0" y2="136.0" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150.0" y="204.0" width="400.0" height="44.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="166.0" y="230.5" text-anchor="start" font-size="12.5" fill="#3f3420" filter="url(#rough2)">BFS(s)，跳过第 ban 条边</text>
  <line x1="350.0" y1="184.0" x2="350.0" y2="200.0" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150.0" y="268.0" width="400.0" height="44.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="166.0" y="294.5" text-anchor="start" font-size="12.5" fill="#3f3420" filter="url(#rough2)">l 不可达 → important++</text>
  <line x1="350.0" y1="248.0" x2="350.0" y2="264.0" stroke="#8a6015" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150.0" y="332.0" width="400.0" height="44.0" fill="#f3e8fd" stroke="#6b4c9a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="166.0" y="358.5" text-anchor="start" font-size="12.5" fill="#3f3420" filter="url(#rough2)">输出 important</text>
  <line x1="350.0" y1="312.0" x2="350.0" y2="328.0" stroke="#6b4c9a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="566.0" y="100.0" text-anchor="start" font-size="11.5" fill="#555" filter="url(#rough2)">k 个商人</text>
  <text x="566.0" y="228.0" text-anchor="start" font-size="11.5" fill="#555" filter="url(#rough2)">m 条边 → O(m(n+m))</text>
  <text x="566.0" y="356.0" text-anchor="start" font-size="11.5" fill="#555" filter="url(#rough2)">共 O(k·m·(n+m))</text>
  <text x="40.0" y="408.0" text-anchor="start" font-size="12.5" fill="#444" filter="url(#rough2)">n,m,k ≤ 200 时约 1.6×10⁷ 次操作；50/100 分档必须换 Tarjan。</text>
</svg>
