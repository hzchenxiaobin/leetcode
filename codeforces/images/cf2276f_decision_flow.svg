<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 476" width="740" height="476" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="740" height="476" fill="#fafafa"/>

  <text x="370" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">判定流程：只看「环长多重集」</text>
  <text x="370" y="46" text-anchor="middle" font-size="10.5" fill="#8a8a8a" filter="url(#rough2)">按顺序检查，命中即输出；f = 自环个数，b = 环长恰为 k+1 的环个数</text>
  <text x="370" y="60" text-anchor="middle" font-size="10.5" fill="#8a8a8a" filter="url(#rough2)">S_m = 长度在 2..k 的环长之和，r = f mod (k+1)</text>

  <!-- 1 -->
  <rect x="30" y="62" width="256" height="32" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="158" y="83" text-anchor="middle" font-size="11.5" fill="#33517a" filter="url(#rough2)">① n ≤ k ？</text>
  <path d="M 292 78 L 322 78" fill="none" stroke="#5a5a5a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#rough2)"/>
  <rect x="326" y="62" width="380" height="32" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="516" y="83" text-anchor="middle" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">是 → Alice（一回合把全部元素染成同色）</text>

  <!-- 2 -->
  <rect x="30" y="106" width="256" height="32" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="158" y="127" text-anchor="middle" font-size="11.5" fill="#33517a" filter="url(#rough2)">② 存在环长 ≥ k + 2 ？</text>
  <path d="M 292 122 L 322 122" fill="none" stroke="#5a5a5a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#rough2)"/>
  <rect x="326" y="106" width="380" height="32" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="516" y="127" text-anchor="middle" font-size="11.5" fill="#8d3a35" filter="url(#rough2)">是 → Bob（开环后剩 ≥ k+1 个白口子，补不完）</text>

  <!-- 3 -->
  <rect x="30" y="150" width="256" height="32" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="158" y="171" text-anchor="middle" font-size="11.5" fill="#33517a" filter="url(#rough2)">③ k = 1 ？</text>
  <path d="M 292 166 L 322 166" fill="none" stroke="#5a5a5a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#rough2)"/>
  <rect x="326" y="150" width="380" height="32" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="516" y="171" text-anchor="middle" font-size="11.5" fill="#a0761e" filter="url(#rough2)">无 2-环 → Alice；有 2-环：f 奇 → Alice，f 偶 → Bob</text>

  <!-- 4 -->
  <rect x="30" y="204" width="256" height="32" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="158" y="225" text-anchor="middle" font-size="11.5" fill="#33517a" filter="url(#rough2)">④ b ≥ 2 ？</text>
  <path d="M 292 220 L 322 220" fill="none" stroke="#5a5a5a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#rough2)"/>
  <rect x="326" y="204" width="380" height="32" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="516" y="225" text-anchor="middle" font-size="11.5" fill="#8d3a35" filter="url(#rough2)">是 → Bob（两个 (k+1)-环就能凑出 &gt; k 个白口子）</text>

  <!-- 5 -->
  <rect x="30" y="248" width="256" height="32" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="158" y="269" text-anchor="middle" font-size="11.5" fill="#33517a" filter="url(#rough2)">⑤ b = 1 ？</text>
  <path d="M 292 264 L 322 264" fill="none" stroke="#5a5a5a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#rough2)"/>
  <rect x="326" y="248" width="380" height="32" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="516" y="269" text-anchor="middle" font-size="10.5" fill="#a0761e" filter="url(#rough2)">Alice ⟺ S_m ≤ k 且 r + S_m ≤ k 且 (S_m &gt; 0 或 r &gt; 0)，否则 Bob</text>

  <!-- 6 -->
  <rect x="30" y="296" width="256" height="32" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="158" y="317" text-anchor="middle" font-size="11.5" fill="#33517a" filter="url(#rough2)">⑥ b = 0，M 不坏 ？</text>
  <path d="M 292 312 L 322 312" fill="none" stroke="#5a5a5a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#rough2)"/>
  <rect x="326" y="296" width="380" height="32" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="516" y="317" text-anchor="middle" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">是 → Alice（随便整染一个环，不坏性单调保持）</text>

  <!-- 7 -->
  <rect x="30" y="340" width="256" height="32" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="158" y="361" text-anchor="middle" font-size="11.5" fill="#33517a" filter="url(#rough2)">⑦ 坏，且 A = 长度 ≥ 3 的环长之和 ≤ k ？</text>
  <path d="M 292 356 L 322 356" fill="none" stroke="#5a5a5a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#rough2)"/>
  <rect x="326" y="340" width="380" height="32" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="516" y="361" text-anchor="middle" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">是 → Alice（把长环全染掉，只剩 2-环与自环）</text>

  <!-- 8 -->
  <rect x="30" y="384" width="256" height="46" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="158" y="403" text-anchor="middle" font-size="11.5" fill="#33517a" filter="url(#rough2)">⑧ 否则（E = Σ(c−1)，m = 非自环个数）</text>
  <text x="158" y="421" text-anchor="middle" font-size="11" fill="#33517a" filter="url(#rough2)">2m &gt; 3k → Bob；否则做小背包</text>
  <path d="M 292 407 L 322 407" fill="none" stroke="#5a5a5a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#rough2)"/>
  <rect x="326" y="384" width="380" height="46" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="516" y="403" text-anchor="middle" font-size="10.5" fill="#a0761e" filter="url(#rough2)">存在删法：删 j ≥ m − k 环、总长 c ≤ k、c − j ≥ E − k → Alice</text>
  <text x="516" y="421" text-anchor="middle" font-size="11" fill="#a0761e" filter="url(#rough2)">否则 Bob（位集 DP，j ≤ k/2，O(k²)）</text>

  <text x="370" y="456" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">每个测试点 O(n + k²)，Σn ≤ 2·10^5、k ≤ 20，轻松通过 3 s</text>
</svg>
