<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="420" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">样例 2 的对称归约：4 个环房间，起点 {1,2}</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">P(不动) = 1/2，P(去某个邻居) = 1/4，两人各 2 个邻居</text>
  <g filter="url(#rough2)"><line x1="170" y1="150" x2="170" y2="320" stroke="#446688" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><line x1="170" y1="320" x2="360" y2="320" stroke="#446688" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><line x1="360" y1="320" x2="360" y2="150" stroke="#446688" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><line x1="360" y1="150" x2="170" y2="150" stroke="#446688" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><circle cx="170" cy="150" r="34" fill="#f6e3c4" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="170" y="154.32" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><circle cx="170" cy="320" r="34" fill="#f6e3c4" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="170" y="324.32" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><circle cx="360" cy="320" r="34" fill="#cfe0f5" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="360" y="324.32" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><circle cx="360" cy="150" r="34" fill="#cfe0f5" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="360" y="154.32" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="265" y="380" text-anchor="middle" font-size="11.5" fill="#b06a1e" filter="url(#rough2)">起点：1 号房与 2 号房</text>
  <text x="265" y="402" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">橙色 = 起点所在的两个房间</text>
  <g filter="url(#rough2)"><rect x="470" y="96" width="400" height="300" rx="6" fill="#ffffff" fill-opacity="0.4" stroke="#cccccc" stroke-width="1.4" stroke-dasharray="5 4"/></g>
  <text x="670" y="118" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">设从 {1,2} 出发的答案向量为 (a, a, b, b)</text>
  <text x="492" y="148" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">房间 3、4 对称 ⇒ 同为 b；房间 1、2 ⇒ 同为 a；且 2a+2b = 1。</text>
  <text x="492" y="176" text-anchor="start" font-size="11" fill="#666666" filter="url(#rough2)">从 {1,2} 走一步（9 种组合）：</text>
  <text x="492" y="202" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">· 相遇在 1：P(1,1)P(2,1) = 1/2·1/4 = 1/8</text>
  <text x="492" y="224" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">· 相遇在 2：P(1,2)P(2,2) = 1/4·1/2 = 1/8</text>
  <text x="492" y="246" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">· 回到 {1,2}：1/4 + 1/16 = 5/16，留在 {3,4}：1/16</text>
  <text x="492" y="268" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">· 其余 5/16 流向对角态 {1,3}、{2,4} 与 {1,4}、{2,3}</text>
  <text x="492" y="300" text-anchor="start" font-size="11" fill="#446688" filter="url(#rough2)">a = 1/8 + (5/16)a + (1/16)(b+b) + (1/16)a + (1/8)(c+d)</text>
  <text x="492" y="324" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">对角态的 c+d = 1/2，b = 1/2 − a 代入：</text>
  <text x="492" y="350" text-anchor="start" font-size="12" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">(3/4)a = 1/4  ⇒  a = 1/3，b = 1/6</text>
  <text x="492" y="376" text-anchor="start" font-size="10.5" fill="#666666" filter="url(#rough2)">输出 0.333… 0.333… 0.166… 0.166… ✓</text>
</svg>
