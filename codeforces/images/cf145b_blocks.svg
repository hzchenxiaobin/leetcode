<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1451"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="720" height="360" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按「同字符块」拆开数 47 / 74</text>
  <path d="M 160 42 Q 360 48 560 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <rect x="48" y="66" width="44" height="40" rx="6" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="70" y="92" text-anchor="middle" font-size="12" fill="#335478" filter="url(#rough2)">444</text>
  <rect x="100" y="66" width="44" height="40" rx="6" fill="#f6efd8" stroke="#b09040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="122" y="92" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">7</text>
  <rect x="152" y="66" width="44" height="40" rx="6" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="174" y="92" text-anchor="middle" font-size="12" fill="#335478" filter="url(#rough2)">44</text>
  <rect x="204" y="66" width="44" height="40" rx="6" fill="#f6efd8" stroke="#b09040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="226" y="92" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">77</text>
  <rect x="256" y="66" width="44" height="40" rx="6" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="278" y="92" text-anchor="middle" font-size="12" fill="#335478" filter="url(#rough2)">4</text>

  <text x="96" y="126" text-anchor="middle" font-size="10" fill="#a05a5a" filter="url(#rough2)">47</text>
  <text x="148" y="126" text-anchor="middle" font-size="10" fill="#2f5223" filter="url(#rough2)">74</text>
  <text x="200" y="126" text-anchor="middle" font-size="10" fill="#a05a5a" filter="url(#rough2)">47</text>
  <text x="252" y="126" text-anchor="middle" font-size="10" fill="#2f5223" filter="url(#rough2)">74</text>
  <text x="48" y="126" font-size="10" fill="#777777" filter="url(#rough2)">4 块</text>
  <text x="48" y="158" font-size="10" fill="#777777" filter="url(#rough2)">块交界才产生 47 或 74，块内部永远数不出这两个串</text>

  <text x="330" y="80" font-size="11.5" fill="#335478" filter="url(#rough2)">R = 3 个 4 块，S = 2 个 7 块</text>
  <text x="330" y="102" font-size="11.5" fill="#335478" filter="url(#rough2)">a1 = 8，a2 = 5（块内字符总数）</text>
  <text x="330" y="124" font-size="11.5" fill="#a05a5a" filter="url(#rough2)">a3 = #47 = R − [末块是 4] = 2</text>
  <text x="330" y="146" font-size="11.5" fill="#2f5223" filter="url(#rough2)">a4 = #74 = S − [末块是 7] = 2</text>

  <rect x="40" y="168" width="310" height="72" rx="8" fill="#eef5ea" stroke="#5a8a4a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="56" y="192" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">① 首 4 末 4：R = S + 1</text>
  <text x="56" y="214" font-size="11.5" fill="#2f5223" filter="url(#rough2)">a3 = R − 1 = S，a4 = S ⇒ a3 = a4</text>
  <text x="56" y="232" font-size="10.5" fill="#777777" filter="url(#rough2)">块数 B = 2k+1，k = a3 = a4</text>

  <rect x="370" y="168" width="310" height="72" rx="8" fill="#f6eef4" stroke="#a05a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="386" y="192" font-size="12" font-weight="bold" fill="#8a5a86" filter="url(#rough2)">② 首 4 末 7：R = S</text>
  <text x="386" y="214" font-size="11.5" fill="#8a5a86" filter="url(#rough2)">a3 = R，a4 = S − 1 ⇒ a3 = a4 + 1</text>
  <text x="386" y="232" font-size="10.5" fill="#777777" filter="url(#rough2)">块数 B = 2·a3</text>

  <rect x="40" y="254" width="310" height="72" rx="8" fill="#f6eef4" stroke="#a05a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="56" y="278" font-size="12" font-weight="bold" fill="#8a5a86" filter="url(#rough2)">③ 首 7 末 4：R = S</text>
  <text x="56" y="300" font-size="11.5" fill="#8a5a86" filter="url(#rough2)">a3 = R − 1，a4 = S ⇒ a4 = a3 + 1</text>
  <text x="56" y="318" font-size="10.5" fill="#777777" filter="url(#rough2)">块数 B = 2·a4</text>

  <rect x="370" y="254" width="310" height="72" rx="8" fill="#eef5ea" stroke="#5a8a4a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="386" y="278" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">④ 首 7 末 7：S = R + 1</text>
  <text x="386" y="300" font-size="11.5" fill="#2f5223" filter="url(#rough2)">a3 = R，a4 = S − 1 = R ⇒ a3 = a4</text>
  <text x="386" y="318" font-size="10.5" fill="#777777" filter="url(#rough2)">块数 B = 2k+1，k = a3 = a4</text>

  <text x="360" y="348" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">所以 a3 − a4 只能是 −1、0、1；为 0 时首块是 4 还是 7 各有一种结构</text>
</svg>
