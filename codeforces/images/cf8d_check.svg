<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="a8dc" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="880" height="540" fill="#fafafa"/>

  <text x="440" y="34" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">判定 d 是否可行：三个闭圆是否有公共点</text>
  <path d="M 120 46 Q 440 52 760 46" stroke="#2b2b2b" stroke-width="1.2" fill="none"
        filter="url(#rough2)"/>

  <!-- 三个圆 -->
  <circle cx="250" cy="270" r="118" fill="#e8f0fe" fill-opacity="0.55" stroke="#446688"
          stroke-width="1.7" filter="url(#rough2)"/>
  <circle cx="400" cy="230" r="96" fill="#fff3d6" fill-opacity="0.6" stroke="#d6a040"
          stroke-width="1.7" filter="url(#rough2)"/>
  <circle cx="330" cy="350" r="88" fill="#e6f4ea" fill-opacity="0.6" stroke="#4a7a3a"
          stroke-width="1.7" filter="url(#rough2)"/>
  <circle cx="250" cy="270" r="3.5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="400" cy="230" r="3.5" fill="#d6a040" filter="url(#rough2)"/>
  <circle cx="330" cy="350" r="3.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="331" cy="277" r="6" fill="#ffffff" stroke="#b85450" stroke-width="2.2"
          filter="url(#rough2)"/>
  <text x="342" y="272" font-size="11.5" fill="#8c3b37" filter="url(#rough2)">公共点 P</text>
  <text x="250" y="160" text-anchor="middle" font-size="11" fill="#23405c" filter="url(#rough2)">圆心 A，半径 d</text>
  <text x="400" y="120" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">圆心 B，半径 AB+t2−d</text>
  <text x="330" y="458" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">圆心 C，半径 AC+t1−d</text>

  <text x="560" y="150" font-size="12.5" fill="#23405c" filter="url(#rough2)">三圆求交的判定（O(1)）：</text>
  <text x="560" y="176" font-size="11.5" fill="#444" filter="url(#rough2)">① 三个圆心是否都在三个圆内；</text>
  <text x="560" y="200" font-size="11.5" fill="#444" filter="url(#rough2)">② 两两圆周的交点是否在第三个圆内；</text>
  <text x="560" y="224" font-size="11.5" fill="#444" filter="url(#rough2)">③ 相切（内切/外切）时把切点也作为候选。</text>
  <text x="560" y="256" font-size="11.5" fill="#666" filter="url(#rough2)">若交非空，则存在点 P 使三条预算同时成立。</text>
  <text x="560" y="280" font-size="11.5" fill="#666" filter="url(#rough2)">情形 2 只需判断两圆相交：</text>
  <text x="560" y="302" font-size="11.5" fill="#666" filter="url(#rough2)">|BC| ≤ (d−AC) + (R−d)，R = min(AB+t2, AC+CB+t1)。</text>

  <!-- 单调性与二分 -->
  <text x="120" y="470" font-size="12.5" fill="#23405c" filter="url(#rough2)">可行性关于 d 单调：d 可行则更小的 d 也可行</text>
  <path d="M 560 380 L 800 380" stroke="#9a9a9a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 560 380 L 560 340" stroke="#9a9a9a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="800" y="398" text-anchor="end" font-size="11" fill="#7a8ca6" filter="url(#rough2)">d</text>
  <path d="M 580 376 C 640 372 660 350 690 354 C 720 358 730 372 760 376" stroke="#446688"
        stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 690 336 L 690 384" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3"
        fill="none" filter="url(#rough2)"/>
  <text x="690" y="330" text-anchor="middle" font-size="11.5" fill="#8c3b37" filter="url(#rough2)">答案</text>
  <text x="610" y="404" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">可行区间</text>
  <text x="780" y="404" text-anchor="middle" font-size="10.5" fill="#8a8a8a" filter="url(#rough2)">不可行</text>
</svg>
