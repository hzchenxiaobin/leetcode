<svg xmlns="http://www.w3.org/2000/svg" width="780" height="430" viewBox="0 0 780 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="780" height="430" fill="#fafafa"/>
  <text x="390" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">一个新增雪堆最多合并两个连通块</text>
  <text x="390" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">新点 (x,y) 的邻居只可能来自「横坐标 = x 的那一块」与「纵坐标 = y 的那一块」</text>
  <text x="190" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#3d6b2f" filter="url(#rough2)">C_x</text>
  <g filter="url(#rough2)"><line x1="190" y1="130" x2="190" y2="185" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <g filter="url(#rough2)"><line x1="190" y1="200" x2="190" y2="255" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <g filter="url(#rough2)"><line x1="190" y1="270" x2="190" y2="325" stroke="#4a7a3a" stroke-width="2.2"/></g>
  <g filter="url(#rough2)"><circle cx="190" cy="130" r="11" fill="#d7ecd0" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><circle cx="190" cy="200" r="11" fill="#d7ecd0" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><circle cx="190" cy="270" r="11" fill="#d7ecd0" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="190" y="310" text-anchor="middle" font-size="12" fill="#3d6b2f" filter="url(#rough2)">横坐标都等于 x</text>
  <text x="560" y="250" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">C_y</text>
  <g filter="url(#rough2)"><line x1="420" y1="290" x2="475" y2="290" stroke="#446688" stroke-width="2.2"/></g>
  <g filter="url(#rough2)"><line x1="500" y1="290" x2="555" y2="290" stroke="#446688" stroke-width="2.2"/></g>
  <g filter="url(#rough2)"><line x1="580" y1="290" x2="635" y2="290" stroke="#446688" stroke-width="2.2"/></g>
  <g filter="url(#rough2)"><circle cx="420" cy="290" r="11" fill="#d6e6f2" fill-opacity="0.9" stroke="#446688" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><circle cx="500" cy="290" r="11" fill="#d6e6f2" fill-opacity="0.9" stroke="#446688" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><circle cx="580" cy="290" r="11" fill="#d6e6f2" fill-opacity="0.9" stroke="#446688" stroke-width="1.4"/></g>
  <text x="560" y="318" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">纵坐标都等于 y</text>
  <g filter="url(#rough2)"><circle cx="190" cy="290" r="13" fill="#f6d9d7" fill-opacity="0.9" stroke="#a0522d" stroke-width="2.0"/></g>
  <text x="178" y="296" text-anchor="end" font-size="14" font-weight="bold" fill="#a0522d" filter="url(#rough2)">p</text>
  <g filter="url(#rough2)"><line x1="206" y1="290" x2="400" y2="290" stroke="#a0522d" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrr)"/></g>
  <g filter="url(#rough2)"><line x1="190" y1="276" x2="190" y2="300" stroke="#a0522d" stroke-width="1.2"/></g>
  <text x="390" y="150" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">p 与 C_x 的每个点同列、与 C_y 的每个点同行</text>
  <text x="390" y="172" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">但 C_x 内部早已连通，C_y 内部也早已连通</text>
  <text x="390" y="194" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">所以 p 至多把两个块接成一个</text>
  <text x="390" y="382" text-anchor="middle" font-size="12" fill="#8a4b2a" filter="url(#rough2)">若 x 或 y 是全新坐标：p 谁都不连，甚至会多出一个块</text>
  <text x="390" y="406" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">结论：每加一个点，连通块数至多减少 1 → 至少要 c − 1 个新点</text>
</svg>
