<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="760" height="420" fill="#fafafa"/>

  <rect x="30" y="58" width="340" height="300" rx="8" fill="#ffffff" stroke="#c9d6e4" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="200" y="82" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">① y ≤ 100：所需人数不超过 n</text>
  <line x1="55" y1="300" x2="345" y2="300" stroke="#555" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="318" y="304" font-size="10.5" text-anchor="start" fill="#2b2b2b" filter="url(#rough2)">人数</text>
  <rect x="55" y="262" width="60" height="16" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="85" y="254" font-size="10.5" text-anchor="middle" fill="#35507a" filter="url(#rough2)">x 个巫师</text>
  <rect x="115" y="262" width="90" height="16" rx="2" fill="#fff3d6" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="160" y="254" font-size="10.5" text-anchor="middle" fill="#8a6015" filter="url(#rough2)">克隆人</text>
  <line x1="205" y1="300" x2="205" y2="264" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="205" y="316" font-size="11" text-anchor="middle" fill="#7a2f2f" filter="url(#rough2)">need</text>
  <text x="285" y="316" font-size="11" text-anchor="middle" fill="#555" filter="url(#rough2)">n</text>
  <line x1="290" y1="300" x2="290" y2="264" stroke="#555" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="200" y="342" font-size="11" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">克隆数 = need − x（可能为 0）</text>
  <rect x="390" y="58" width="340" height="300" rx="8" fill="#ffffff" stroke="#c9d6e4" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="560" y="82" font-size="12.5" text-anchor="middle" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">② y &gt; 100：所需人数超过 n</text>
  <line x1="415" y1="300" x2="700" y2="300" stroke="#555" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="658" y="304" font-size="10.5" text-anchor="start" fill="#2b2b2b" filter="url(#rough2)">人数</text>
  <rect x="415" y="262" width="55" height="16" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="442" y="254" font-size="10.5" text-anchor="middle" fill="#35507a" filter="url(#rough2)">x</text>
  <rect x="470" y="262" width="130" height="16" rx="2" fill="#fff3d6" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="535" y="254" font-size="10.5" text-anchor="middle" fill="#8a6015" filter="url(#rough2)">克隆人很多</text>
  <line x1="600" y1="300" x2="600" y2="264" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="600" y="316" font-size="11" text-anchor="middle" fill="#7a2f2f" filter="url(#rough2)">need &gt; n</text>
  <line x1="540" y1="300" x2="540" y2="264" stroke="#555" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="540" y="316" font-size="11" text-anchor="middle" fill="#555" filter="url(#rough2)">n</text>
  <text x="560" y="342" font-size="10.5" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">百分比按真实总人数 n 算，克隆人不计入</text>
  <text x="380.0" y="36" font-size="20" text-anchor="middle" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">需要的人数要向上取整，巫师不够就造克隆人</text>
  <path d="M 120 46 Q 380.0 52 640 46" fill="none" stroke="#2b2b2b" stroke-width="1.3" filter="url(#rough2)"/>
</svg>
