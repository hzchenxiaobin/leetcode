<svg xmlns="http://www.w3.org/2000/svg" width="740" height="340" viewBox="0 0 740 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="181"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="740" height="340" fill="#fafafa"/>
  <text x="370" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">一发子弹的两种结局：打不穿（伤害 0）或均匀伤害</text>
  <path d="M 170 46 Q 370 52 570 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="60" y="140" width="150" height="56" rx="10" fill="#f3e8fb" stroke="#7a4a9a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="135" y="164" text-anchor="middle" font-size="13" font-weight="bold" fill="#5a3075" filter="url(#rough2)">开一枪</text>
  <text x="135" y="184" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#7a4a9a" filter="url(#rough2)">伤害随机变量 D</text>
  <path d="M 214 152 L 300 110" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 214 184 L 300 226" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="238" y="122" text-anchor="start" font-size="10.5" font-weight="normal" fill="#b85450" filter="url(#rough2)">p = 打不穿的概率</text>
  <text x="238" y="220" text-anchor="start" font-size="10.5" font-weight="normal" fill="#4a7a3a" filter="url(#rough2)">1 − p = 击穿的概率</text>
  <rect x="310" y="84" width="380" height="52" rx="9" fill="#fdecea" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="324" y="108" text-anchor="start" font-size="11.5" font-weight="bold" fill="#8c3a36" filter="url(#rough2)">D = 0：对方一点血都不掉（概率 p）</text>
  <text x="324" y="126" text-anchor="start" font-size="10.5" font-weight="normal" fill="#8c3a36" filter="url(#rough2)">这是战斗可能无限拖长的唯一原因</text>
  <rect x="310" y="200" width="380" height="52" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="324" y="224" text-anchor="start" font-size="11.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">D ~ U{l, r} 上的整数，每个值概率 (1−p)/(r−l+1)</text>
  <text x="324" y="242" text-anchor="start" font-size="10.5" font-weight="normal" fill="#4a7a3a" filter="url(#rough2)">均匀性是滑动窗口优化的来源</text>
  <rect x="60" y="266" width="620" height="52" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="74" y="288" text-anchor="start" font-size="11" font-weight="bold" fill="#8a6015" filter="url(#rough2)">血量 ≤ 200、最小伤害 ≥ 10 ⇒ 命中 20 次内必杀；但打不穿概率可达 99%，</text>
  <text x="74" y="308" text-anchor="start" font-size="11" font-weight="normal" fill="#7a5a1b" filter="url(#rough2)">开枪次数可能上千 —— “命中次数小、开枪次数大”正是 DP 可以截断的原因。</text>
</svg>
