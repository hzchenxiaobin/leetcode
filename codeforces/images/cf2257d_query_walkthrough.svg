<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="720" height="500" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">S = 6、查询 (x, y) = (4, 5)：3 个完整段 + 1 个残段</text>
  <text x="360" y="52" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每段里的列共享同一个高度 v_j，贡献 = 段长 × min(y, v_j)</text>

  <g filter="url(#rough2)">
    <rect x="48" y="76" width="636" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="7"/>
    <text x="80" y="98" text-anchor="middle" font-size="10.2" font-weight="bold" fill="#2c3e50">j</text>
    <text x="145" y="98" text-anchor="middle" font-size="10.2" font-weight="bold" fill="#2c3e50">d_j</text>
    <text x="265" y="98" text-anchor="middle" font-size="10.2" font-weight="bold" fill="#2c3e50">覆盖的列</text>
    <text x="400" y="98" text-anchor="middle" font-size="10.2" font-weight="bold" fill="#2c3e50">段长 L_j</text>
    <text x="492" y="98" text-anchor="middle" font-size="10.2" font-weight="bold" fill="#2c3e50">段高 v_j = S/d_j</text>
    <text x="588" y="98" text-anchor="middle" font-size="10.2" font-weight="bold" fill="#2c3e50">min(5, v_j)</text>
    <text x="662" y="98" text-anchor="middle" font-size="10.2" font-weight="bold" fill="#2c3e50">贡献</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="48" y="110" width="636" height="34" fill="#ffffff" stroke="#c8d6e5" stroke-width="1.4" rx="6"/>
    <text x="80" y="132" text-anchor="middle" font-size="10.4" fill="#333">1</text>
    <text x="145" y="132" text-anchor="middle" font-size="10.4" fill="#333">1</text>
    <text x="265" y="132" text-anchor="middle" font-size="10.4" fill="#333">[1, 1]</text>
    <text x="400" y="132" text-anchor="middle" font-size="10.4" fill="#333">1</text>
    <text x="492" y="132" text-anchor="middle" font-size="10.4" fill="#333">6</text>
    <text x="588" y="132" text-anchor="middle" font-size="10.4" fill="#333">5</text>
    <text x="662" y="132" text-anchor="middle" font-size="10.4" font-weight="bold" fill="#333">5</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="48" y="144" width="636" height="34" fill="#f7f9fc" stroke="#c8d6e5" stroke-width="1.4" rx="6"/>
    <text x="80" y="166" text-anchor="middle" font-size="10.4" fill="#333">2</text>
    <text x="145" y="166" text-anchor="middle" font-size="10.4" fill="#333">2</text>
    <text x="265" y="166" text-anchor="middle" font-size="10.4" fill="#333">[2, 2]</text>
    <text x="400" y="166" text-anchor="middle" font-size="10.4" fill="#333">1</text>
    <text x="492" y="166" text-anchor="middle" font-size="10.4" fill="#333">3</text>
    <text x="588" y="166" text-anchor="middle" font-size="10.4" fill="#333">3</text>
    <text x="662" y="166" text-anchor="middle" font-size="10.4" font-weight="bold" fill="#333">3</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="48" y="178" width="636" height="34" fill="#ffffff" stroke="#c8d6e5" stroke-width="1.4" rx="6"/>
    <text x="80" y="200" text-anchor="middle" font-size="10.4" fill="#333">3</text>
    <text x="145" y="200" text-anchor="middle" font-size="10.4" fill="#333">3</text>
    <text x="265" y="200" text-anchor="middle" font-size="10.4" fill="#333">[3, 3]</text>
    <text x="400" y="200" text-anchor="middle" font-size="10.4" fill="#333">1</text>
    <text x="492" y="200" text-anchor="middle" font-size="10.4" fill="#333">2</text>
    <text x="588" y="200" text-anchor="middle" font-size="10.4" fill="#333">2</text>
    <text x="662" y="200" text-anchor="middle" font-size="10.4" font-weight="bold" fill="#333">2</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="48" y="212" width="636" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6"/>
    <text x="80" y="234" text-anchor="middle" font-size="10.4" fill="#333">4</text>
    <text x="145" y="234" text-anchor="middle" font-size="10.4" fill="#333">6</text>
    <text x="265" y="234" text-anchor="middle" font-size="10.4" fill="#333">[4, 6]</text>
    <text x="400" y="234" text-anchor="middle" font-size="10.4" fill="#333">3</text>
    <text x="492" y="234" text-anchor="middle" font-size="10.4" fill="#333">1</text>
    <text x="588" y="234" text-anchor="middle" font-size="10.4" fill="#333">1</text>
    <text x="662" y="234" text-anchor="middle" font-size="10.4" font-weight="bold" fill="#333">1</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="48" y="256" width="636" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"/>
    <text x="66" y="281" font-size="10.6" fill="#8a3a36">残段：x = 4 落在第 4 段 [4, 6] 内，只覆盖 (4 − 3) = 1 列，贡献 1 × min(5, 6/6) = 1</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="48" y="308" width="300" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="198" y="333" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3a5a30">5 + 3 + 2 + 1 = 11</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="366" y="308" width="318" height="38" fill="#fffdf5" stroke="#d6a040" stroke-width="1.6" rx="8"/>
    <text x="525" y="333" text-anchor="middle" font-size="9.6" fill="#8a6a20">与暴力逐格统计的 11 一致</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="48" y="362" width="636" height="62" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="9"/>
    <text x="66" y="384" font-size="10.4" fill="#333">用前缀和一次算出：m = 3，m0 = #d ≤ ⌊6/5⌋ = 1，fm = min(3,1) = 1</text>
    <text x="66" y="406" font-size="10.4" fill="#333">ans = 5 · d₁ + (B₃ − B₁) + (4 − 3) · min(5, 1) = 5 + (11 − 6) + 1 = 11</text>
  </g>

  <text x="66" y="448" font-size="9.4" fill="#666" filter="url(#rough2)">B₁ = 1×6 = 6，B₃ = 1×6 + 1×3 + 1×2 = 11，所以 B₃ − B₁ = 5（中间段的 S/d_l 之和）</text>
  <text x="66" y="468" font-size="9.4" fill="#666" filter="url(#rough2)">残段的高度必须取 d_{m+1} = 6 对应的 S/6 = 1，而不是 d_m = 3 的 2</text>
  <text x="66" y="488" font-size="9.4" fill="#666" filter="url(#rough2)">若 x 恰好等于某个因子（如 x = 3），残段长度为 0，结果仍是前 m 段之和</text>
</svg>
