<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="760" height="420" fill="#fafafa"/>

  <line x1="60" y1="150" x2="700" y2="150" stroke="#c9d6e4" stroke-width="1.2" stroke-dasharray="6 5" filter="url(#rough2)"/>
  <circle cx="90" cy="150" r="8" fill="#b85450" stroke="none" filter="url(#rough2)"/>
  <text x="90" y="186" font-size="11" text-anchor="middle" fill="#7a2f2f" filter="url(#rough2)">b₀ = r</text>
  <circle cx="210" cy="150" r="8" fill="#446688" stroke="none" filter="url(#rough2)"/>
  <text x="210" y="186" font-size="11" text-anchor="middle" fill="#2f4a66" filter="url(#rough2)">b₁ = r+a</text>
  <circle cx="330" cy="150" r="8" fill="#446688" stroke="none" filter="url(#rough2)"/>
  <text x="330" y="186" font-size="11" text-anchor="middle" fill="#2f4a66" filter="url(#rough2)">b₂ = r+2a</text>
  <circle cx="450" cy="150" r="8" fill="#446688" stroke="none" filter="url(#rough2)"/>
  <text x="450" y="186" font-size="11" text-anchor="middle" fill="#2f4a66" filter="url(#rough2)">b₃ = r+3a</text>
  <circle cx="590" cy="150" r="8" fill="#446688" stroke="none" filter="url(#rough2)"/>
  <text x="590" y="186" font-size="11" text-anchor="middle" fill="#2f4a66" filter="url(#rough2)">b_j = r+j·a</text>
  <text x="520" y="150" font-size="20" text-anchor="middle" fill="#888" filter="url(#rough2)">…</text>
  <line x1="450" y1="128" x2="366" y2="128" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="408" y="118" font-size="11" text-anchor="middle" fill="#35507a" filter="url(#rough2)">−a</text>
  <line x1="590" y1="104" x2="470" y2="104" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="534" y="94" font-size="10.5" text-anchor="middle" fill="#2f5223" filter="url(#rough2)">−a² （退 a 步）</text>
  <path d="M 590 150 Q 340 250 104 162" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="340" y="246" font-size="11.5" text-anchor="middle" fill="#7a2f2f" filter="url(#rough2)">直接取模 b mod a：一跳回到 b₀</text>
  <text x="60" y="286" font-size="11.5" text-anchor="start" fill="#2b2b2b" filter="url(#rough2)">关键：链上的“减 a^k”只在链内后退 a^{k−1} 步，而 b₀ 对应的状态正是 (r, a)，</text>
  <text x="60" y="310" font-size="11.5" text-anchor="start" fill="#2b2b2b" filter="url(#rough2)">可以递归求解。于是 (a, b) 的胜负 = 一个“链内减法游戏” + 底部的递归结果。</text>
  <text x="60" y="344" font-size="11.5" text-anchor="start" fill="#b85450" filter="url(#rough2)">若 (r, a) 对行动者必败（g = 假），那么链上任何 b_j (j ≥ 1) 只要取模就赢。</text>
  <text x="60" y="368" font-size="11.5" text-anchor="start" fill="#2f5223" filter="url(#rough2)">否则链内既不能取模求胜，又只剩减法，问题化为一维的“减 1 / 减 a / 减 a² …”游戏。</text>
  <text x="380.0" y="36" font-size="20" text-anchor="middle" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">固定较小的 a：状态按 b mod a 分成一条条“阶梯链”</text>
  <path d="M 120 46 Q 380.0 52 640 46" fill="none" stroke="#2b2b2b" stroke-width="1.3" filter="url(#rough2)"/>
</svg>
