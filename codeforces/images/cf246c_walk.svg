<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="720" height="260" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 n=3, k=3, a={1,2,3}：输出 {1}、{2}、{3}</text>
  <rect x="60" y="60" width="600" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="360" y="86" text-anchor="middle" font-size="11.5" fill="#2f5223">按值排序 a1 ≤ a2 ≤ …，用 64 位掩码记录被选的下标</text>
  <rect x="60" y="130" width="600" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="360" y="156" text-anchor="middle" font-size="11.5" fill="#2f4a66">每个状态 (和, 掩码)：弹出时若「和」是新值就输出该子集</text>
  <text x="60" y="220" text-anchor="start" font-size="11.5" fill="#7a4b22" filter="url(#rough2)">本文输出 1 1 / 1 2 / 1 3，三个和 1、2、3 互不相同（与官方的 1、2、5 都合法）</text>
</svg>
