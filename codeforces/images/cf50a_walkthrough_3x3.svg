<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="720" height="400" fill="#fafafa"/>
  <text x="360" y="36" font-size="20" fill="#2b2b2b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">样例 3 × 3 的走查：4 张，剩右下角一格</text>
  <path d="M 130 46 Q 360 52 590 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <line x1="80" y1="100" x2="266" y2="100" stroke="#7f8c99" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="80" y1="162" x2="266" y2="162" stroke="#7f8c99" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="80" y1="224" x2="266" y2="224" stroke="#7f8c99" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="80" y1="286" x2="266" y2="286" stroke="#7f8c99" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="80" y1="100" x2="80" y2="286" stroke="#7f8c99" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="142" y1="100" x2="142" y2="286" stroke="#7f8c99" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="204" y1="100" x2="204" y2="286" stroke="#7f8c99" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="266" y1="100" x2="266" y2="286" stroke="#7f8c99" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="83" y="103" width="56" height="118" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="111.0" y="166.32" font-size="12" fill="#3a3a2a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="145" y="103" width="56" height="118" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="173.0" y="166.32" font-size="12" fill="#3a3a2a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="207" y="103" width="56" height="118" rx="7" fill="#fff3e0" stroke="#d6a040" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="235.0" y="166.32" font-size="12" fill="#3a3a2a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="83" y="227" width="118" height="56" rx="7" fill="#fdeaea" stroke="#b85450" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="142.0" y="259.32" font-size="12" fill="#3a3a2a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="209" y="229" width="52" height="52" rx="6" fill="#e4e4e4" stroke="#9a9a9a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="235.0" y="260.0" font-size="13" fill="#666" text-anchor="middle" font-weight="bold" filter="url(#rough2)">剩</text>
  <text x="173.0" y="312" font-size="12.5" fill="#44546a" text-anchor="middle" filter="url(#rough2)">9 格，4 张骨牌占 8 格</text>
  <text x="330" y="116" font-size="14" fill="#8a6015" text-anchor="start" font-weight="bold" filter="url(#rough2)">面积上界</text>
  <text x="330" y="142" font-size="12.5" fill="#2b2b2b" text-anchor="start" filter="url(#rough2)">9 格 ÷ 每张 2 格 → 至多 ⌊9/2⌋ = 4 张</text>
  <text x="330" y="186" font-size="14" fill="#2f5223" text-anchor="start" font-weight="bold" filter="url(#rough2)">构造（本题取法）</text>
  <text x="330" y="212" font-size="12.5" fill="#2b2b2b" text-anchor="start" filter="url(#rough2)">① 第 1、2 行：三张竖牌盖住 6 格</text>
  <text x="330" y="236" font-size="12.5" fill="#2b2b2b" text-anchor="start" filter="url(#rough2)">② 第 3 行：一张横牌盖住第 1、2 列</text>
  <text x="330" y="260" font-size="12.5" fill="#2b2b2b" text-anchor="start" filter="url(#rough2)">③ 第 3 行第 3 列剩 1 格，任何骨牌都盖不住</text>
  <rect x="330" y="288" width="330" height="86" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="348" y="316" font-size="14" fill="#8a6015" text-anchor="start" font-weight="bold" filter="url(#rough2)">上界 4 已被构造达到</text>
  <text x="348" y="340" font-size="14" fill="#8a6015" text-anchor="start" font-weight="bold" filter="url(#rough2)">⇒ 最大值 = 4</text>
  <text x="348" y="362" font-size="12" fill="#2b2b2b" text-anchor="start" filter="url(#rough2)">5 张需要 10 格 > 9 格，直接矛盾</text>
</svg>
