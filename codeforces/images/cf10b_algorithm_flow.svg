<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="800" height="560" fill="#fafafa"/>

  <text x="400" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">单个请求的处理流程与空闲段维护</text>
  <path d="M 180 40 Q 400 46 620 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 流程 -->
  <rect x="60" y="62" width="350" height="34" rx="9" fill="#eef4fb" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="235" y="84" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">y* = c − ⌊M/2⌋，best 置空</text>
  <path d="M 235 96 L 235 114" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <rect x="60" y="116" width="350" height="34" rx="9" fill="#eef4fb" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="235" y="138" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">枚举每行 x 的每个空闲段 [a, b]</text>
  <path d="M 235 150 L 235 166" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <polygon points="235,168 340,206 235,244 130,206" fill="#fdf3e0" stroke="#c98a2b" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="235" y="210" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">段长 ≥ M 吗？</text>

  <path d="M 130 206 L 44 206 L 44 133 L 58 133" stroke="#b85450" stroke-width="1.4" fill="none"
        stroke-dasharray="5 3" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="150" y="232" font-size="10.5" fill="#9a4a47" filter="url(#rough2)">否：换下一个空闲段</text>

  <path d="M 235 244 L 235 262" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="245" y="258" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="60" y="264" width="350" height="34" rx="9" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="235" y="286" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">y = clamp(y*, a, b − M + 1)</text>
  <path d="M 235 298 L 235 316" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <rect x="60" y="318" width="350" height="34" rx="9" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="235" y="340" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">S = M·|x−c| + f(y)，用 (S, x, y) 更新 best</text>
  <path d="M 235 352 L 235 370" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <rect x="60" y="372" width="350" height="34" rx="9" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="235" y="394" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">所有 (x, 段) 遍历完毕</text>
  <path d="M 235 406 L 235 424" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <rect x="60" y="426" width="350" height="52" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="72" y="448" font-size="11" fill="#2f5223" filter="url(#rough2)">有候选：输出 x y y+M−1，并在第 x 行切段</text>
  <text x="72" y="468" font-size="11" fill="#8a2b28" filter="url(#rough2)">没候选：输出 -1，座位状态不变</text>

  <text x="40" y="512" font-size="11" fill="#555555" filter="url(#rough2)">f 用等差数列闭式求和，O(1)：sum |t−c| 按 a、b 与 c 的位置分三段。</text>
  <text x="40" y="536" font-size="11" fill="#555555" filter="url(#rough2)">每次请求访问 O(K + 段数) 个对象；全场的空闲段总数不超过 K + N。</text>

  <!-- 右侧：切段示意 -->
  <rect x="446" y="150" width="334" height="268" rx="12" fill="#fdeeee" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="460" y="176" font-size="11.5" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">切段：从空闲段里挖走 [y, y+M−1]</text>

  <g filter="url(#rough2)">
    <rect x="462" y="188" width="30" height="30" fill="#ededed" stroke="#999999" stroke-width="1.2"/>
    <rect x="495" y="188" width="30" height="30" fill="#ededed" stroke="#999999" stroke-width="1.2"/>
    <rect x="528" y="188" width="30" height="30" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="561" y="188" width="30" height="30" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="594" y="188" width="30" height="30" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="627" y="188" width="30" height="30" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="660" y="188" width="30" height="30" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="693" y="188" width="30" height="30" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="726" y="188" width="30" height="30" fill="#ededed" stroke="#999999" stroke-width="1.2"/>
  </g>
  <text x="460" y="234" font-size="10.5" fill="#555555" filter="url(#rough2)">切之前：整段 [3, 8] 都是空的</text>

  <path d="M 610 240 L 610 268" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="620" y="258" font-size="10.5" fill="#8a2b28" filter="url(#rough2)">卖掉 4、5、6</text>

  <g filter="url(#rough2)">
    <rect x="462" y="278" width="30" height="30" fill="#ededed" stroke="#999999" stroke-width="1.2"/>
    <rect x="495" y="278" width="30" height="30" fill="#ededed" stroke="#999999" stroke-width="1.2"/>
    <rect x="528" y="278" width="30" height="30" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="561" y="278" width="30" height="30" fill="#fbe3c8" stroke="#c98a2b" stroke-width="1.5"/>
    <rect x="594" y="278" width="30" height="30" fill="#fbe3c8" stroke="#c98a2b" stroke-width="1.5"/>
    <rect x="627" y="278" width="30" height="30" fill="#fbe3c8" stroke="#c98a2b" stroke-width="1.5"/>
    <rect x="660" y="278" width="30" height="30" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="693" y="278" width="30" height="30" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="726" y="278" width="30" height="30" fill="#ededed" stroke="#999999" stroke-width="1.2"/>
  </g>
  <g filter="url(#rough2)" stroke="#4a7a3a" stroke-width="2">
    <line x1="528" y1="314" x2="558" y2="314"/>
    <line x1="660" y1="314" x2="723" y2="314"/>
  </g>
  <text x="543" y="330" text-anchor="middle" font-size="9.5" fill="#2f5223" filter="url(#rough2)">[3,3]</text>
  <text x="691" y="330" text-anchor="middle" font-size="9.5" fill="#2f5223" filter="url(#rough2)">[7,8]</text>

  <text x="460" y="360" font-size="10.5" fill="#555555" filter="url(#rough2)">段列表：(3,8) → (3,3) 和 (7,8)</text>
  <text x="460" y="382" font-size="10.5" fill="#555555" filter="url(#rough2)">整段被占满 → 该段删除</text>
  <text x="460" y="404" font-size="10.5" fill="#9a4a47" filter="url(#rough2)">某行段列表为空，就再也放不下人</text>
</svg>
