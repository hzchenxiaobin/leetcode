<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="21"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a05a5a"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>

  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">判定流程：一次扫描即可</text>
  <path d="M 170 46 Q 360 52 550 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <rect x="40" y="78" width="164" height="64" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="122" y="104" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">按行读入</text>
  <text x="122" y="126" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">getline × 3</text>

  <path d="M 208 110 L 244 110" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="250" y="78" width="220" height="64" rx="10" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="360" y="104" text-anchor="middle" font-size="14" fill="#2f5223" filter="url(#rough2)">逐字符判断</text>
  <text x="360" y="126" text-anchor="middle" font-size="13" fill="#2f5223" filter="url(#rough2)">是 a e i o u 就 +1</text>

  <path d="M 474 110 L 510 110" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="516" y="78" width="164" height="64" rx="10" fill="#ffffff" stroke="#a05a5a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="598" y="104" text-anchor="middle" font-size="14" fill="#6b3030" filter="url(#rough2)">三个计数</text>
  <text x="598" y="126" text-anchor="middle" font-size="13" fill="#6b3030" filter="url(#rough2)">c₁ c₂ c₃</text>

  <path d="M 598 146 L 598 176 L 400 176 L 400 206" stroke="#5a5a5a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 400 210 L 512 268 L 400 326 L 288 268 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="400" y="262" text-anchor="middle" font-size="14" fill="#8a6015" filter="url(#rough2)">c 等于</text>
  <text x="400" y="284" text-anchor="middle" font-size="14" fill="#8a6015" filter="url(#rough2)">(5, 7, 5) 吗？</text>

  <path d="M 288 268 L 196 268" stroke="#4a7a3a" stroke-width="1.7" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="240" y="258" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">是</text>
  <rect x="60" y="246" width="132" height="44" rx="9" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="126" y="274" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5223" filter="url(#rough2)">输出 YES</text>

  <path d="M 512 268 L 560 268" stroke="#a05a5a" stroke-width="1.7" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="536" y="258" text-anchor="middle" font-size="12" fill="#6b3030" filter="url(#rough2)">否</text>
  <rect x="564" y="246" width="126" height="44" rx="9" fill="#fbeeee" stroke="#a05a5a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="627" y="274" text-anchor="middle" font-size="15" font-weight="bold" fill="#6b3030" filter="url(#rough2)">输出 NO</text>

  <text x="360" y="356" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">时间 O(总字符数)，空间只存当前行</text>
</svg>
