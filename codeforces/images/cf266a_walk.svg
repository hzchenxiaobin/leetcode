<svg xmlns="http://www.w3.org/2000/svg" width="880" height="270" viewBox="0 0 880 270"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="270" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1：RRG</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">相邻同色只有第 1、2 块 → 删 1 个</text>
  <g filter="url(#rough2)"><rect x="160" y="120" width="80" height="50" rx="4" fill="#f6d9d7" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="200.0" y="150.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">R</text>
  <g filter="url(#rough2)"><rect x="260" y="120" width="80" height="50" rx="4" fill="#f6d9d7" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="300.0" y="150.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">R</text>
  <g filter="url(#rough2)"><rect x="360" y="120" width="80" height="50" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="400.0" y="150.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">G</text>
  <text x="480" y="150" text-anchor="start" font-size="13" fill="#2b2b2b" filter="url(#rough2)">删掉一个 R → RG</text>
  <text x="440" y="220" text-anchor="middle" font-size="14" fill="#3d6b2f" filter="url(#rough2)">输出 1</text>
</svg>
