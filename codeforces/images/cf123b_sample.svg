<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="113"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="300" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">样例 2：u 从 21 走到 1，跨过 5 条坏线</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">a = b = 2，2a = 2b = 4；v = x−y 恒为 −1，一条线都不用跨</text>
  <g filter="url(#rough2)"><line x1="80" y1="150" x2="830" y2="150" stroke="#999999" stroke-width="1.6"/></g>
  <g filter="url(#rough2)"><circle cx="110.0" cy="150" r="16" fill="#cfe0f5" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="110.0" y="153.96" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><circle cx="215.0" cy="150" r="16" fill="#f3d9d6" fill-opacity="0.9" stroke="#8a2b28" stroke-width="1.5"/></g>
  <text x="215.0" y="153.96" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="215.0" y="118" text-anchor="middle" font-size="10" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">坏格</text>
  <g filter="url(#rough2)"><circle cx="355.0" cy="150" r="16" fill="#f3d9d6" fill-opacity="0.9" stroke="#8a2b28" stroke-width="1.5"/></g>
  <text x="355.0" y="153.96" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">8</text>
  <text x="355.0" y="118" text-anchor="middle" font-size="10" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">坏格</text>
  <g filter="url(#rough2)"><circle cx="495.00000000000006" cy="150" r="16" fill="#f3d9d6" fill-opacity="0.9" stroke="#8a2b28" stroke-width="1.5"/></g>
  <text x="495.00000000000006" y="153.96" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">12</text>
  <text x="495.00000000000006" y="118" text-anchor="middle" font-size="10" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">坏格</text>
  <g filter="url(#rough2)"><circle cx="635.0" cy="150" r="16" fill="#f3d9d6" fill-opacity="0.9" stroke="#8a2b28" stroke-width="1.5"/></g>
  <text x="635.0" y="153.96" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">16</text>
  <text x="635.0" y="118" text-anchor="middle" font-size="10" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">坏格</text>
  <g filter="url(#rough2)"><circle cx="775.0" cy="150" r="16" fill="#f3d9d6" fill-opacity="0.9" stroke="#8a2b28" stroke-width="1.5"/></g>
  <text x="775.0" y="153.96" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">20</text>
  <text x="775.0" y="118" text-anchor="middle" font-size="10" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">坏格</text>
  <g filter="url(#rough2)"><circle cx="810.0" cy="150" r="16" fill="#cfe0f5" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="810.0" y="153.96" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">21</text>
  <text x="110" y="196" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">u = 1</text>
  <text x="806" y="196" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">u = 21</text>
  <text x="450" y="232" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">c₁ = #{4, 8, 12, 16, 20} = 5，c₂ = 0 ⇒ 答案 5</text>
  <text x="450" y="264" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">路径上必须依次踩过这 5 个 u≡0 的格子，一个也省不掉</text>
</svg>
