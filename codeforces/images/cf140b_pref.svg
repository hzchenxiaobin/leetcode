<svg xmlns="http://www.w3.org/2000/svg" width="720" height="324" viewBox="0 0 720 324"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1420"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="720" height="324" fill="#fafafa"/>
  <text x="360.0" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每个朋友独立挑「名次最好、时间最早」的卡片</text>
  <path d="M 115.2 42 Q 360.0 48 604.8 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="40.0" y="76.0" text-anchor="start" font-size="12.0" fill="#335478" font-weight="bold" filter="url(#rough2)">把 4 个时刻分别寄给朋友 4（偏好 3 4 2 1）</text>
  <text x="36.0" y="120.0" text-anchor="start" font-size="10.5" fill="#555555" filter="url(#rough2)">t</text>
  <text x="36.0" y="176.0" text-anchor="start" font-size="10.5" fill="#555555" filter="url(#rough2)">寄出卡片</text>
  <text x="36.0" y="232.0" text-anchor="start" font-size="10.5" fill="#555555" filter="url(#rough2)">朋友 4 的名次</text>
  <rect x="40" y="92" width="150" height="40" rx="5" fill="#f0f0f0" stroke="#555555" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115.0" y="116.3" text-anchor="middle" font-size="12.0" fill="#555555" filter="url(#rough2)">1</text>
  <rect x="40" y="148" width="150" height="40" rx="5" fill="#e8eef7" stroke="#335478" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115.0" y="172.3" text-anchor="middle" font-size="12.0" fill="#335478" filter="url(#rough2)">1</text>
  <rect x="40" y="204" width="150" height="40" rx="5" fill="#f5e8e8" stroke="#8c2f2c" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115.0" y="228.3" text-anchor="middle" font-size="12.0" fill="#8c2f2c" filter="url(#rough2)">4</text>
  <rect x="200" y="92" width="150" height="40" rx="5" fill="#f0f0f0" stroke="#555555" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="275.0" y="116.3" text-anchor="middle" font-size="12.0" fill="#555555" filter="url(#rough2)">2</text>
  <rect x="200" y="148" width="150" height="40" rx="5" fill="#e8eef7" stroke="#335478" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="275.0" y="172.3" text-anchor="middle" font-size="12.0" fill="#335478" filter="url(#rough2)">1</text>
  <rect x="200" y="204" width="150" height="40" rx="5" fill="#f5e8e8" stroke="#8c2f2c" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="275.0" y="228.3" text-anchor="middle" font-size="12.0" fill="#8c2f2c" filter="url(#rough2)">4</text>
  <rect x="360" y="92" width="150" height="40" rx="5" fill="#f0f0f0" stroke="#555555" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="435.0" y="116.3" text-anchor="middle" font-size="12.0" fill="#555555" filter="url(#rough2)">3</text>
  <rect x="360" y="148" width="150" height="40" rx="5" fill="#e8eef7" stroke="#335478" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="435.0" y="172.3" text-anchor="middle" font-size="12.0" fill="#335478" filter="url(#rough2)">3</text>
  <rect x="360" y="204" width="150" height="40" rx="5" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="435.0" y="228.3" text-anchor="middle" font-size="12.0" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <rect x="520" y="92" width="150" height="40" rx="5" fill="#f0f0f0" stroke="#555555" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="595.0" y="116.3" text-anchor="middle" font-size="12.0" fill="#555555" filter="url(#rough2)">4</text>
  <rect x="520" y="148" width="150" height="40" rx="5" fill="#e8eef7" stroke="#335478" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="595.0" y="172.3" text-anchor="middle" font-size="12.0" fill="#335478" filter="url(#rough2)">3</text>
  <rect x="520" y="204" width="150" height="40" rx="5" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="595.0" y="228.3" text-anchor="middle" font-size="12.0" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <rect x="40" y="272" width="632" height="44" rx="5" fill="#f5e8e8" stroke="#8c2f2c" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="356.0" y="297.8" text-anchor="middle" font-size="10.5" fill="#8c2f2c" filter="url(#rough2)">名次 1（卡片 3）最早在 t=3 达成 → 这一位输出 3；样例输出 4 同样合法</text>
  <text x="360.0" y="310" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">因为寄卡不消耗卡片，各朋友之间互不干扰</text>
</svg>
