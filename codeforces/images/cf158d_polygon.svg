<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="591"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="300" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">保留 k 个顶点 ⇒ 间隔必须是 n/k</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">所以只枚举 k | n 且 k ≥ 3</text>
  <g filter="url(#rough2)"><circle cx="220.0" cy="60.0" r="14" fill="#dcecd2" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="220.0" y="63.24" text-anchor="middle" font-size="9" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><circle cx="315.2627944162882" cy="115.0" r="14" fill="#ffffff" fill-opacity="0.9" stroke="#cccccc" stroke-width="1.5"/></g>
  <text x="315.2627944162882" y="118.24" text-anchor="middle" font-size="9" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><circle cx="315.2627944162883" cy="224.99999999999997" r="14" fill="#dcecd2" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="315.2627944162883" y="228.23999999999998" text-anchor="middle" font-size="9" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><circle cx="220.0" cy="280.0" r="14" fill="#ffffff" fill-opacity="0.9" stroke="#cccccc" stroke-width="1.5"/></g>
  <text x="220.0" y="283.24" text-anchor="middle" font-size="9" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><circle cx="124.73720558371177" cy="225.00000000000003" r="14" fill="#dcecd2" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="124.73720558371177" y="228.24000000000004" text-anchor="middle" font-size="9" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <g filter="url(#rough2)"><circle cx="124.73720558371176" cy="114.99999999999999" r="14" fill="#ffffff" fill-opacity="0.9" stroke="#cccccc" stroke-width="1.5"/></g>
  <text x="124.73720558371176" y="118.23999999999998" text-anchor="middle" font-size="9" fill="#2b2b2b" filter="url(#rough2)">6</text>
  <g filter="url(#rough2)"><path d="M 110 170 A 110 110 0 1 0 330 170 A 110 110 0 1 0 110 170 Z" fill="none" stroke="#cccccc" stroke-width="1.0" stroke-dasharray="4 4"/></g>
  <text x="600" y="120" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">n = 6：k ∈ {3, 6}</text>
  <text x="600" y="150" text-anchor="start" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">k=3 ⇒ step=2（取 1,3,5）</text>
  <text x="600" y="180" text-anchor="start" font-size="11.5" fill="#446688" filter="url(#rough2)">k=6 ⇒ step=1（全取）</text>
  <text x="600" y="214" text-anchor="start" font-size="11" fill="#666666" filter="url(#rough2)">对每个 k 枚举 step 个起点</text>
</svg>
