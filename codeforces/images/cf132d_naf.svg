<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="239"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="330" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">低位到高位 + 进位：t = bit + carry</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">t = 1 且下一位是 1 时，用 −2^i 并进位（把 ...11 变成 1... 减 1）</text>
  <g filter="url(#rough2)"><rect x="80" y="96" width="200" height="36" rx="4" fill="#ffffff" fill-opacity="0.3" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="180" y="120" text-anchor="middle" font-size="12" fill="#666666" font-weight="bold" filter="url(#rough2)">t = 0</text>
  <g filter="url(#rough2)"><rect x="300" y="96" width="220" height="36" rx="4" fill="#ffffff" fill-opacity="0.3" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="410" y="120" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">本位记 0</text>
  <g filter="url(#rough2)"><rect x="540" y="96" width="160" height="36" rx="4" fill="#ffffff" fill-opacity="0.3" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="620" y="120" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">carry ← 0</text>
  <g filter="url(#rough2)"><rect x="80" y="142" width="200" height="36" rx="4" fill="#ffffff" fill-opacity="0.3" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="180" y="166" text-anchor="middle" font-size="12" fill="#b06a1e" font-weight="bold" filter="url(#rough2)">t = 2</text>
  <g filter="url(#rough2)"><rect x="300" y="142" width="220" height="36" rx="4" fill="#ffffff" fill-opacity="0.3" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="410" y="166" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">本位记 0</text>
  <g filter="url(#rough2)"><rect x="540" y="142" width="160" height="36" rx="4" fill="#ffffff" fill-opacity="0.3" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="620" y="166" text-anchor="middle" font-size="12" fill="#b06a1e" filter="url(#rough2)">carry ← 1</text>
  <g filter="url(#rough2)"><rect x="80" y="188" width="200" height="36" rx="4" fill="#ffffff" fill-opacity="0.3" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="180" y="212" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">t = 1，下一位 0</text>
  <g filter="url(#rough2)"><rect x="300" y="188" width="220" height="36" rx="4" fill="#ffffff" fill-opacity="0.3" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="410" y="212" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">记 +2^i</text>
  <g filter="url(#rough2)"><rect x="540" y="188" width="160" height="36" rx="4" fill="#ffffff" fill-opacity="0.3" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="620" y="212" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">carry ← 0</text>
  <g filter="url(#rough2)"><rect x="80" y="234" width="200" height="36" rx="4" fill="#ffffff" fill-opacity="0.3" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="180" y="258" text-anchor="middle" font-size="12" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">t = 1，下一位 1</text>
  <g filter="url(#rough2)"><rect x="300" y="234" width="220" height="36" rx="4" fill="#ffffff" fill-opacity="0.3" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="410" y="258" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">记 −2^i</text>
  <g filter="url(#rough2)"><rect x="540" y="234" width="160" height="36" rx="4" fill="#ffffff" fill-opacity="0.3" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="620" y="258" text-anchor="middle" font-size="12" fill="#8a2b28" filter="url(#rough2)">carry ← 1</text>
  <text x="450" y="296" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">这样得到的表示没有相邻非零位（规范形），并且项数最少</text>
</svg>
