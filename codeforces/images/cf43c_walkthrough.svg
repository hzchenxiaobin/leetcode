<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2b2b2b"/>
    </marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arra" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2：1 1 1 23 10 3 的分桶与配对</text>
  <path d="M 200 44 Q 360 50 520 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="26" y="62" width="98" height="76" rx="0" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="75" y="104" text-anchor="middle" font-size="21" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <text x="75" y="126" text-anchor="middle" font-size="10.5" fill="#8a8a8a" filter="url(#rough2)">mod 3 = 1</text>
  <rect x="139" y="62" width="98" height="76" rx="0" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="188" y="104" text-anchor="middle" font-size="21" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <text x="188" y="126" text-anchor="middle" font-size="10.5" fill="#8a8a8a" filter="url(#rough2)">mod 3 = 1</text>
  <rect x="252" y="62" width="98" height="76" rx="0" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="301" y="104" text-anchor="middle" font-size="21" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <text x="301" y="126" text-anchor="middle" font-size="10.5" fill="#8a8a8a" filter="url(#rough2)">mod 3 = 1</text>
  <rect x="365" y="62" width="98" height="76" rx="0" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="414" y="104" text-anchor="middle" font-size="21" font-weight="bold" fill="#d6a040" filter="url(#rough2)">23</text>
  <text x="414" y="126" text-anchor="middle" font-size="10.5" fill="#8a8a8a" filter="url(#rough2)">mod 3 = 2</text>
  <rect x="478" y="62" width="98" height="76" rx="0" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="527" y="104" text-anchor="middle" font-size="21" font-weight="bold" fill="#d6a040" filter="url(#rough2)">10</text>
  <text x="527" y="126" text-anchor="middle" font-size="10.5" fill="#8a8a8a" filter="url(#rough2)">mod 3 = 1</text>
  <rect x="591" y="62" width="98" height="76" rx="0" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="640" y="104" text-anchor="middle" font-size="21" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <text x="640" y="126" text-anchor="middle" font-size="10.5" fill="#8a8a8a" filter="url(#rough2)">mod 3 = 0</text>
  <text x="50" y="176" text-anchor="start" font-size="12" fill="#4a7a3a" filter="url(#rough2)">余数 0：3（1 片）→ 0 对</text>
  <text x="50" y="198" text-anchor="start" font-size="12" fill="#446688" filter="url(#rough2)">余数 1：1, 1, 1, 10（4 片）</text>
  <text x="50" y="220" text-anchor="start" font-size="12" fill="#d6a040" filter="url(#rough2)">余数 2：23（1 片）</text>
  <text x="430" y="176" text-anchor="start" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">min(4, 1) = 1 对</text>
  <text x="430" y="200" text-anchor="start" font-size="11" fill="#8a8a8a" filter="url(#rough2)">3 剩下一片，弃置</text>
  <line x1="400" y1="138" x2="300" y2="262" stroke="#d6a040" stroke-width="1.6" opacity="1.0" marker-end="url(#arra)" filter="url(#rough2)"/>
  <line x1="514" y1="138" x2="420" y2="262" stroke="#d6a040" stroke-width="1.6" opacity="1.0" marker-end="url(#arra)" filter="url(#rough2)"/>
  <rect x="150" y="276" width="420" height="76" rx="0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="306" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5223" filter="url(#rough2)">23 与 10 拼成 2310（或 1023）</text>
  <text x="360" y="332" text-anchor="middle" font-size="12.5" fill="#2f5223" filter="url(#rough2)">数字和 5 + 1 = 6，能被 3 整除 → 幸运票</text>
  <text x="620" y="322" text-anchor="middle" font-size="18" font-weight="bold" fill="#b85450" filter="url(#rough2)">答案 1</text>
  <text x="360" y="400" text-anchor="middle" font-size="12" fill="#8a8a8a" filter="url(#rough2)">余数 0 只有 1 片，凑不成一对；余数 1 与 2 配出 1 张</text>
</svg>
