<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="720" height="440" fill="#fafafa"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">把「能不能赶上」变成二维偏序</text>
  <path d="M 200 43 Q 360 49 520 43" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <rect x="60" y="72" width="300" height="118" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="76" y="98" text-anchor="start" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">事件 j 接在 i 之后：</text>
  <text x="76" y="126" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">t_j ≥ t_i 且 |x_j - x_i| ≤ V(t_j - t_i)</text>
  <text x="76" y="154" text-anchor="start" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">令 p = V·t + x，q = V·t - x</text>
  <text x="76" y="178" text-anchor="start" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">两个不等式 ⇔ p_j ≥ p_i 且 q_j ≥ q_i</text>
  <path d="M 206 190 L 206 218" stroke="#2b2b2b" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="214" y="210" text-anchor="start" font-size="10.5" fill="#777777" filter="url(#rough2)">而且两式相加还能推出 t_j ≥ t_i</text>
  <path d="M 220 360 L 620 360" stroke="#777777" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 470 420 L 470 110" stroke="#777777" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="622" y="374" text-anchor="start" font-size="12" fill="#777777" filter="url(#rough2)">p</text>
  <text x="478" y="110" text-anchor="start" font-size="12" fill="#777777" filter="url(#rough2)">q</text>
  <circle cx="280" cy="320" r="6" fill="#e9f4e2" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="289" y="316" text-anchor="start" font-size="9.5" fill="#3c5e2e" filter="url(#rough2)">e0</text>
  <circle cx="350" cy="270" r="6" fill="#e9f4e2" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="359" y="266" text-anchor="start" font-size="9.5" fill="#3c5e2e" filter="url(#rough2)">e1</text>
  <circle cx="410" cy="240" r="6" fill="#e9f4e2" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="419" y="236" text-anchor="start" font-size="9.5" fill="#3c5e2e" filter="url(#rough2)">e2</text>
  <circle cx="480" cy="210" r="6" fill="#e9f4e2" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="489" y="206" text-anchor="start" font-size="9.5" fill="#3c5e2e" filter="url(#rough2)">e3</text>
  <circle cx="540" cy="170" r="6" fill="#e9f4e2" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="549" y="166" text-anchor="start" font-size="9.5" fill="#3c5e2e" filter="url(#rough2)">e4</text>
  <path d="M 280 320 L 350 270" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 350 270 L 410 240" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 410 240 L 480 210" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 480 210 L 540 170" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="410" y="400" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">最长链 = 最多能看的事件数</text>
  <text x="60" y="330" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">把 (p,q) 按 p 升序、q 升序排好，</text>
  <text x="60" y="354" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">再对 q 做一次「非降」LIS 即可。</text>
  <text x="60" y="382" text-anchor="start" font-size="11" fill="#777777" filter="url(#rough2)">q 相等也允许（p 严格变大时两事件仍可比）。</text>
  <text x="60" y="410" text-anchor="start" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">复杂度 O(N log N)。</text>
</svg>
