<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c9801f"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a8524a"/>
    </marker>
  </defs>
  <rect width="760" height="380" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">枚举 5040 个候选，逐条回复过滤</text>
  <rect x="250.0" y="62.0" width="260.0" height="42.0" fill="#f7f9fc" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380.0" y="87.5" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">5040 个四位数位互异候选</text>
  <rect x="210.0" y="118.0" width="340.0" height="44.0" rx="8" fill="#fbfbfb" stroke="#9aa3b2" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="380.0" y="138.0" text-anchor="middle" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">第 1 条回复 (b1,c1)</text>
  <text x="380.0" y="155.0" text-anchor="middle" font-size="10.5" fill="#8a8a8a" filter="url(#rough2)">只保留 bulls/cows 都匹配的</text>
  <path d="M 380.0 112.0 L 380.0 122.0" stroke="#2b2b2b" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="210.0" y="172.0" width="340.0" height="44.0" rx="8" fill="#fbfbfb" stroke="#9aa3b2" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="380.0" y="192.0" text-anchor="middle" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">第 2 条回复 (b2,c2)</text>
  <text x="380.0" y="209.0" text-anchor="middle" font-size="10.5" fill="#8a8a8a" filter="url(#rough2)">继续过滤</text>
  <path d="M 380.0 166.0 L 380.0 176.0" stroke="#2b2b2b" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="210.0" y="226.0" width="340.0" height="44.0" rx="8" fill="#fbfbfb" stroke="#9aa3b2" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="380.0" y="246.0" text-anchor="middle" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">…… 第 n 条回复</text>
  <text x="380.0" y="263.0" text-anchor="middle" font-size="10.5" fill="#8a8a8a" filter="url(#rough2)">剩下来的就是所有可能答案</text>
  <path d="M 380.0 220.0 L 380.0 230.0" stroke="#2b2b2b" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="40.0" y="296.0" width="216.0" height="66.0" rx="10" fill="#fbeeee" stroke="#a8524a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="148.0" y="320.0" text-anchor="middle" font-size="12" fill="#a8524a" font-weight="bold" filter="url(#rough2)">0 个候选</text>
  <text x="148.0" y="344.0" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">Incorrect data</text>
  <rect x="272.0" y="296.0" width="216.0" height="66.0" rx="10" fill="#f4f9f2" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380.0" y="320.0" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1 个候选</text>
  <text x="380.0" y="344.0" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">输出该数（补前导零）</text>
  <rect x="504.0" y="296.0" width="216.0" height="66.0" rx="10" fill="#fdf3e3" stroke="#c9801f" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="612.0" y="320.0" text-anchor="middle" font-size="12" fill="#c9801f" font-weight="bold" filter="url(#rough2)">≥2 个候选</text>
  <text x="612.0" y="344.0" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">Need more data</text>
</svg>
