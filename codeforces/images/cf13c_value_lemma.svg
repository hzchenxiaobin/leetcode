<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">相同的 b 值可以挪到输入出现过的数上</text>
  <path d="M 150 44 Q 360 50 570 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 可行区间 -->
  <rect x="128" y="90" width="336" height="220" fill="#fff8e1" opacity="0.75" stroke="none" filter="url(#rough2)"/>
  <text x="150" y="84" font-size="11" fill="#8a6015" filter="url(#rough2)">阴影 = b 值允许活动的范围 [b_{l−1}, b_{r+1}]</text>

  <!-- 坐标轴 -->
  <line x1="60" y1="310" x2="690" y2="310" stroke="#2b2b2b" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="664" y="330" font-size="12" fill="#2b2b2b" filter="url(#rough2)">x</text>
  <text x="62" y="128" font-size="12" fill="#2b2b2b" filter="url(#rough2)">g(x)</text>

  <!-- 凸折线 -->
  <polyline points="80,142 176,214 320,250 416,226 560,118 656,46"
            fill="none" stroke="#446688" stroke-width="2.4" filter="url(#rough2)"/>
  <circle cx="176" cy="214" r="4.5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="320" cy="250" r="4.5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="416" cy="226" r="4.5" fill="#446688" filter="url(#rough2)"/>
  <g font-size="12" font-weight="bold" text-anchor="middle" fill="#2f4a66" filter="url(#rough2)">
    <text x="176" y="330">2</text><text x="320" y="330">5</text><text x="416" y="330">7</text>
  </g>
  <text x="320" y="352" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">折点都是输入值 a_i</text>

  <!-- 非折点挪到折点 -->
  <circle cx="368" cy="238" r="4.5" fill="#b85450" filter="url(#rough2)"/>
  <path d="M 360 240 L 332 248" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="330" y="288" font-size="10.5" fill="#a33a36" filter="url(#rough2)">非折点挪到折点，代价不增</text>

  <text x="40" y="370" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">g(x) = Σ|a_i − x| 是凸折线；在可行区间内取最小，要么取到折点，要么整段同值。</text>
  <text x="40" y="390" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">整段同值时把它挪到区间端点（邻居块的值）并合并，块数减少，反复后所有值都落在输入集合里。</text>
</svg>
