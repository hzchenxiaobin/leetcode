<svg xmlns="http://www.w3.org/2000/svg" width="840" height="380" viewBox="0 0 840 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="380" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">等待：从到达时刻起跳过连续的"有人到达"时刻</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">到达 2 号星球时刻 1，而 1、2 都是到达时刻 ⇒ 等到 3 才能出发</text>
  <g filter="url(#rough2)"><line x1="120" y1="200" x2="720" y2="200" stroke="#888888" stroke-width="1.5" marker-end="url(#arrb)"/></g>
  <g filter="url(#rough2)"><line x1="150" y1="192" x2="150" y2="208" stroke="#888888" stroke-width="1.2"/></g>
  <text x="150" y="228" text-anchor="middle" font-size="11" fill="#777777" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)"><line x1="224" y1="192" x2="224" y2="208" stroke="#888888" stroke-width="1.2"/></g>
  <text x="224" y="228" text-anchor="middle" font-size="11" fill="#777777" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><circle cx="224" cy="200" r="8" fill="#f6d9d7" fill-opacity="0.9" stroke="#a0522d" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><line x1="298" y1="192" x2="298" y2="208" stroke="#888888" stroke-width="1.2"/></g>
  <text x="298" y="228" text-anchor="middle" font-size="11" fill="#777777" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><circle cx="298" cy="200" r="8" fill="#f6d9d7" fill-opacity="0.9" stroke="#a0522d" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><line x1="372" y1="192" x2="372" y2="208" stroke="#888888" stroke-width="1.2"/></g>
  <text x="372" y="228" text-anchor="middle" font-size="11" fill="#777777" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><line x1="446" y1="192" x2="446" y2="208" stroke="#888888" stroke-width="1.2"/></g>
  <text x="446" y="228" text-anchor="middle" font-size="11" fill="#777777" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><line x1="520" y1="192" x2="520" y2="208" stroke="#888888" stroke-width="1.2"/></g>
  <text x="520" y="228" text-anchor="middle" font-size="11" fill="#777777" filter="url(#rough2)">5</text>
  <g filter="url(#rough2)"><line x1="594" y1="192" x2="594" y2="208" stroke="#888888" stroke-width="1.2"/></g>
  <text x="594" y="228" text-anchor="middle" font-size="11" fill="#777777" filter="url(#rough2)">6</text>
  <g filter="url(#rough2)"><line x1="668" y1="192" x2="668" y2="208" stroke="#888888" stroke-width="1.2"/></g>
  <text x="668" y="228" text-anchor="middle" font-size="11" fill="#777777" filter="url(#rough2)">7</text>
  <text x="224" y="172" text-anchor="middle" font-size="10.5" fill="#a0522d" filter="url(#rough2)">到达</text>
  <text x="298" y="172" text-anchor="middle" font-size="10.5" fill="#a0522d" filter="url(#rough2)">到达</text>
  <g filter="url(#rough2)"><path d="M 224 236 Q 260 262 298 236" fill="none" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="4 3" stroke-linejoin="round"/></g>
  <text x="262" y="280" text-anchor="middle" font-size="10.5" fill="#3d6b2f" filter="url(#rough2)">等待 1 秒</text>
  <text x="420" y="316" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">出发时刻 = 第一个 ∉ T_u 且 ≥ 到达时刻的 t</text>
  <text x="420" y="344" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">连续段末尾用二分：T_u[j] − j 单调不减</text>
</svg>
