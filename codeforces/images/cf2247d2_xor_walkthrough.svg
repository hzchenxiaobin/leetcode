<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 356"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="356" fill="#fafafa" filter="url(#rough2)"/>

  <text x="330" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    样例第 3 组的三个状态：各层级坏节点计数与答案（N = 8）
  </text>
  <text x="330" y="48" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">
    答案 = 2^(最高的非空坏层级)；全部清空即为 0
  </text>

  <rect x="26" y="64" width="608" height="160" rx="4" fill="#ffffff" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="26" y="64" width="608" height="34" rx="4" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.2" filter="url(#rough2)"/>
  <g stroke="#446688" stroke-width="1" filter="url(#rough2)">
    <path d="M26,64 L26,224"/><path d="M102,64 L102,224"/><path d="M354,64 L354,224"/>
    <path d="M422,64 L422,224"/><path d="M490,64 L490,224"/><path d="M558,64 L558,224"/>
    <path d="M634,64 L634,224"/>
    <path d="M26,98 L634,98"/><path d="M26,140 L634,140"/><path d="M26,182 L634,182"/>
  </g>

  <g font-size="11.5" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="64" y="86">状态</text>
    <text x="228" y="86">数组 a（末尾补 +∞）</text>
    <text x="388" y="86">v=0 坏</text>
    <text x="456" y="86">v=1 坏</text>
    <text x="524" y="86">v=2 坏</text>
    <text x="596" y="86">答案</text>
  </g>

  <text x="64" y="123" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">初始</text>
  <text x="228" y="123" font-size="11.5" fill="#333" text-anchor="middle" filter="url(#rough2)">2,5,3,4,1,6,∞,∞</text>
  <text x="388" y="123" font-size="13" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">0</text>
  <text x="456" y="123" font-size="13" fill="#b85450" text-anchor="middle" filter="url(#rough2)">1</text>
  <text x="524" y="123" font-size="13" fill="#b85450" text-anchor="middle" filter="url(#rough2)">1</text>
  <text x="596" y="123" font-size="14" fill="#b85450" text-anchor="middle" filter="url(#rough2)">4</text>

  <text x="64" y="165" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">a[1] ← 2</text>
  <text x="228" y="165" font-size="11.5" fill="#333" text-anchor="middle" filter="url(#rough2)">2,2,3,4,1,6,∞,∞</text>
  <text x="388" y="165" font-size="13" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">0</text>
  <text x="456" y="165" font-size="13" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">0</text>
  <text x="524" y="165" font-size="13" fill="#b85450" text-anchor="middle" filter="url(#rough2)">1</text>
  <text x="596" y="165" font-size="14" fill="#b85450" text-anchor="middle" filter="url(#rough2)">4</text>

  <text x="64" y="207" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">a[4] ← 5</text>
  <text x="228" y="207" font-size="11.5" fill="#333" text-anchor="middle" filter="url(#rough2)">2,2,3,4,5,6,∞,∞</text>
  <text x="388" y="207" font-size="13" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">0</text>
  <text x="456" y="207" font-size="13" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">0</text>
  <text x="524" y="207" font-size="13" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">0</text>
  <text x="596" y="207" font-size="14" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">0</text>

  <rect x="26" y="244" width="608" height="94" rx="9" fill="#fffdf5" stroke="#d6a040"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="42" y="268" font-size="12" fill="#333" filter="url(#rough2)">
    改 a[1] 只重算包含位置 1 的那一列边界 m = 1, 2, 4，即叶到根的 O(log N) 个节点
  </text>
  <text x="42" y="292" font-size="12" fill="#333" filter="url(#rough2)">
    v=2 那一位一直坏：边界 m = 4 处左块最大 &gt; 右块最小 1；把 a[4] 改成 5 后左右才排好
  </text>
  <text x="42" y="316" font-size="12" fill="#b85450" filter="url(#rough2)">
    mask = 0 表示每个对齐分界都「左边 ≤ 右边」，也就是整个数组已有序 ⇒ 输出 0
  </text>
</svg>
