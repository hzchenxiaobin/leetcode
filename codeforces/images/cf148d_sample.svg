<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="379"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="270" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">样例 1：w = 1, b = 3 → 0.5</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">两条路：第一次就抽到白，或撑到只剩白鼠</text>
  <text x="450" y="106" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">抽白：1/4</text>
  <text x="450" y="136" text-anchor="middle" font-size="12" fill="#b06a1e" filter="url(#rough2)">抽黑 3/4 → 龙抽黑 2/3 → 跳出黑 1/2 → 剩 1 白 0 黑 ⇒ 必赢</text>
  <text x="450" y="172" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">P = 1/4 + 3/4 · 2/3 · 1/2 = 1/4 + 1/4 = 1/2</text>
  <text x="450" y="214" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">输出 0.500000000</text>
  <text x="450" y="246" text-anchor="middle" font-size="10.5" fill="#8a2b28" filter="url(#rough2)">另一种情形：跳出白 ⇒ 剩 0 白 1 黑 ⇒ 公主永远抽不到白，输</text>
</svg>
