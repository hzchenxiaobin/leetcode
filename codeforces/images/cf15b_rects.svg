<svg xmlns="http://www.w3.org/2000/svg" width="780" height="470" viewBox="0 0 780 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="101"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="780" height="470" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两束激光的可达区域是两个同样大小、互相平移的矩形</text>
  <path d="M 130 40 Q 390 46 650 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <g filter="url(#rough2)" stroke="#cccccc" stroke-width="1">
    <line x1="90" y1="90" x2="90" y2="290"/>
    <line x1="90" y1="90" x2="290" y2="90"/>
    <line x1="130" y1="90" x2="130" y2="290"/>
    <line x1="90" y1="130" x2="290" y2="130"/>
    <line x1="170" y1="90" x2="170" y2="290"/>
    <line x1="90" y1="170" x2="290" y2="170"/>
    <line x1="210" y1="90" x2="210" y2="290"/>
    <line x1="90" y1="210" x2="290" y2="210"/>
    <line x1="250" y1="90" x2="250" y2="290"/>
    <line x1="90" y1="250" x2="290" y2="250"/>
    <line x1="290" y1="90" x2="290" y2="290"/>
    <line x1="90" y1="290" x2="290" y2="290"/>
  </g>
  <rect x="90" y="90" width="120" height="120" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="170" y="130" width="120" height="120" fill="#d9ecd4" fill-opacity="0.75" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="106" y="122" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">R1</text>
  <text x="320" y="320" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">R2</text>
  <path d="M 210 228 L 290 228" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 308 210 L 308 250" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 90 302 L 168 302" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="129" y="324" text-anchor="middle" font-size="11" fill="#8a2b28" filter="url(#rough2)">Δx = 2 格</text>
  <path d="M 320 128 L 320 92" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="346" y="116" font-size="11" fill="#8a2b28" filter="url(#rough2)">Δy = 1</text>
  <rect x="430" y="80" width="320" height="230" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="446" y="108" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">容斥公式</text>
  <text x="446" y="140" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">|R1| = (n − Δx)(m − Δy)</text>
  <text x="446" y="172" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">|R2| = |R1|（整体平移）</text>
  <text x="446" y="204" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">|R1∩R2| =</text>
  <text x="446" y="226" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">　max(0, n−2Δx)·max(0, m−2Δy)</text>
  <text x="446" y="258" font-size="12" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">答案 = nm − 2|R1| + |R1∩R2|</text>
  <text x="446" y="288" font-size="10.5" fill="#9a7020" filter="url(#rough2)">相减的两项都要用 long long（≤10^18）</text>
  <text x="50" y="400" font-size="12" fill="#2b2b2b" filter="url(#rough2)">平移量的取值范围是一个矩形：p ∈ [1−min(x1,x2), n−max(x1,x2)]，q 同理。</text>
  <text x="50" y="426" font-size="12" fill="#2b2b2b" filter="url(#rough2)">于是激光 1 的可达格子数 = 矩形边长之积 (n−Δx)(m−Δy)，与它在棋盘上的具体位置无关。</text>
  <text x="50" y="452" font-size="11.5" fill="#8a6015" filter="url(#rough2)">两个矩形重叠部分随 Δ 增大而变小，Δ 超过一半时直接为 0。</text>
</svg>
