<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="400" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="38" text-anchor="middle" font-size="18.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">37E：样例 1（棋盘）两次操作的反向“剥层”</text>
  <path d="M 137 50 Q 380 56 623 50" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="70" y="120" width="70" height="70" fill="#3d3d3d" stroke="#bbb" stroke-width="1.0" filter="url(#rough2)"/>
  <rect x="140" y="120" width="70" height="70" fill="#ffffff" stroke="#bbb" stroke-width="1.0" filter="url(#rough2)"/>
  <rect x="210" y="120" width="70" height="70" fill="#3d3d3d" stroke="#bbb" stroke-width="1.0" filter="url(#rough2)"/>
  <rect x="70" y="190" width="70" height="70" fill="#ffffff" stroke="#bbb" stroke-width="1.0" filter="url(#rough2)"/>
  <rect x="140" y="190" width="70" height="70" fill="#3d3d3d" stroke="#bbb" stroke-width="1.0" filter="url(#rough2)"/>
  <rect x="210" y="190" width="70" height="70" fill="#ffffff" stroke="#bbb" stroke-width="1.0" filter="url(#rough2)"/>
  <rect x="70" y="260" width="70" height="70" fill="#3d3d3d" stroke="#bbb" stroke-width="1.0" filter="url(#rough2)"/>
  <rect x="140" y="260" width="70" height="70" fill="#ffffff" stroke="#bbb" stroke-width="1.0" filter="url(#rough2)"/>
  <rect x="210" y="260" width="70" height="70" fill="#3d3d3d" stroke="#bbb" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="175.0" y="110" text-anchor="middle" font-size="11.5" fill="#2f4a66" font-weight="normal" filter="url(#rough2)">目标</text>
  <text x="70" y="350" text-anchor="start" font-size="11" fill="#4a7a3a" font-weight="normal" filter="url(#rough2)">第 1 刀（反向）：中心 W 一块</text>
  <text x="70" y="374" text-anchor="start" font-size="11" fill="#c9801f" font-weight="normal" filter="url(#rough2)">第 2 刀：4 个黑块借中心连成一片</text>
  <rect x="330" y="100" width="380" height="200" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="346" y="126" text-anchor="start" font-size="12.5" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">正向做法（2 次）：</text>
  <text x="346" y="154" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">① 把“十字”（中心 + 4 条边中点）涂黑</text>
  <text x="346" y="180" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">② 把中心涂白</text>
  <text x="346" y="206" text-anchor="start" font-size="11.5" fill="#2f5223" font-weight="normal" filter="url(#rough2)">⇒ 棋盘 ✓（中心被①弄黑、②再改白）</text>
  <text x="346" y="240" text-anchor="start" font-size="11.5" fill="#b6483f" font-weight="normal" filter="url(#rough2)">为什么不能 1 次：一个连通单色块无法同时</text>
  <text x="346" y="264" text-anchor="start" font-size="11.5" fill="#b6483f" font-weight="normal" filter="url(#rough2)">得到 4 个互不相邻的黑格。</text>
  <text x="346" y="290" text-anchor="start" font-size="11" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">而 (2,1),(2,2),(1,2) 三个白格连通成一块 ⇒ 块图只有 7 个点。</text>
</svg>
