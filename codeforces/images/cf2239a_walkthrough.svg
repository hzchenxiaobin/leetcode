<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="720" height="470" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 3 走查：a = [1,4,5,2,6]，异或和 S = 4</text>
  <path d="M 148 43 Q 360 50 572 43" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 表头 -->
  <rect x="40" y="62" width="660" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="66" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">k</text>
  <text x="127" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">a_k</text>
  <text x="207" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">S⊕a_k</text>
  <text x="322" y="82" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">S⊕a_k ≤ a_k ?</text>
  <text x="546" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">收尾局面 a − b（其余位置清零）</text>

  <!-- 五行 -->
  <rect x="40" y="92" width="660" height="30" fill="#fce4ec" stroke="#c9b6b6" stroke-width="1" filter="url(#rough2)"/>
  <rect x="40" y="122" width="660" height="30" fill="#e6f4ea" stroke="#c9b6b6" stroke-width="1" filter="url(#rough2)"/>
  <rect x="40" y="152" width="660" height="30" fill="#e6f4ea" stroke="#c9b6b6" stroke-width="1" filter="url(#rough2)"/>
  <rect x="40" y="182" width="660" height="30" fill="#fce4ec" stroke="#c9b6b6" stroke-width="1" filter="url(#rough2)"/>
  <rect x="40" y="212" width="660" height="30" fill="#e6f4ea" stroke="#c9b6b6" stroke-width="1" filter="url(#rough2)"/>

  <text x="66" y="113" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">1</text>
  <text x="127" y="113" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">1</text>
  <text x="207" y="113" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">5</text>
  <text x="322" y="113" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">✗ 5 ＞ 1 越界</text>
  <text x="546" y="113" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">不可行</text>

  <text x="66" y="143" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">2</text>
  <text x="127" y="143" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">4</text>
  <text x="207" y="143" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">0</text>
  <text x="322" y="143" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">✓ 0 ≤ 4</text>
  <text x="546" y="143" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">第 2 位 = 4 − 0 = 4</text>

  <text x="66" y="173" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">3</text>
  <text x="127" y="173" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">5</text>
  <text x="207" y="173" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">1</text>
  <text x="322" y="173" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">✓ 1 ≤ 5</text>
  <text x="546" y="173" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">第 3 位 = 5 − 1 = 4</text>

  <text x="66" y="203" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">4</text>
  <text x="127" y="203" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">2</text>
  <text x="207" y="203" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">6</text>
  <text x="322" y="203" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">✗ 6 ＞ 2 越界</text>
  <text x="546" y="203" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">不可行</text>

  <text x="66" y="233" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">5</text>
  <text x="127" y="233" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">6</text>
  <text x="207" y="233" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">2</text>
  <text x="322" y="233" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">✓ 2 ≤ 6</text>
  <text x="546" y="233" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">第 5 位 = 6 − 2 = 4</text>

  <path d="M 92 62 L 92 242" stroke="#446688" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 162 62 L 162 242" stroke="#446688" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 252 62 L 252 242" stroke="#446688" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 392 62 L 392 242" stroke="#446688" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <text x="360" y="268" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">S ≠ 0 ⟹ 答案 = 可行的 k 的个数 = 3</text>

  <!-- S = 0 特例 -->
  <rect x="40" y="288" width="660" height="104" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="370" y="314" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">特例 S = 0：a = [1,2,3] 时三个 k 都满足 S⊕a_k = a_k ≤ a_k</text>
  <text x="370" y="338" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">但它们给出的首步 b 全是 a = (1,2,3)，是同一步，只能算一次</text>
  <text x="370" y="366" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">⟹ S = 0 时答案恒为 1，不能输出 cnt = n</text>

  <text x="360" y="424" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">判据只有一条位运算比较；每个 k 至多贡献 1 种首步，逐个扫一遍即可</text>
  <text x="360" y="448" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">S 的最高位保证了 S ≠ 0 时至少有 1 个 k 合格，答案不会意外变成 0</text>
</svg>
