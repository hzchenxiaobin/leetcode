<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="461"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="320" fill="#fafafa"/>
  <text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例走查：按 r 升序逐个占最靠左的空闲日</text>
  <path d="M 60 38 Q 380 46 700 38" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <text x="30" y="66" font-size="12.5" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">样例 1：[1,2] [2,3] [3,4]</text>

  <g font-size="10">
    <rect x="30" y="78" width="96" height="38" rx="7" fill="#cfe0f5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="78" y="94" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">[1,2] r=2</text>
    <text x="78" y="109" text-anchor="middle" font-size="9" fill="#555555" filter="url(#rough2)">第 1 个处理</text>

    <rect x="146" y="78" width="96" height="38" rx="7" fill="#d9ecd4" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="194" y="94" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">d = 1</text>
    <text x="194" y="109" text-anchor="middle" font-size="9" fill="#555555" filter="url(#rough2)">1 空闲</text>

    <rect x="262" y="78" width="96" height="38" rx="7" fill="#cfe0f5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="310" y="94" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">[2,3] r=3</text>
    <text x="310" y="109" text-anchor="middle" font-size="9" fill="#555555" filter="url(#rough2)">第 2 个处理</text>

    <rect x="378" y="78" width="96" height="38" rx="7" fill="#d9ecd4" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="426" y="94" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">d = 2</text>
    <text x="426" y="109" text-anchor="middle" font-size="9" fill="#555555" filter="url(#rough2)">2 空闲</text>

    <rect x="494" y="78" width="96" height="38" rx="7" fill="#cfe0f5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="542" y="94" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">[3,4] r=4</text>
    <text x="542" y="109" text-anchor="middle" font-size="9" fill="#555555" filter="url(#rough2)">第 3 个处理</text>

    <rect x="610" y="78" width="96" height="38" rx="7" fill="#d9ecd4" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="658" y="94" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">d = 3</text>
    <text x="658" y="109" text-anchor="middle" font-size="9" fill="#555555" filter="url(#rough2)">3 空闲</text>
  </g>
  <path d="M 128 97 L 142 97" stroke="#446688" stroke-width="1.4" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 244 97 L 258 97" stroke="#446688" stroke-width="1.4" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 360 97 L 374 97" stroke="#446688" stroke-width="1.4" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 476 97 L 490 97" stroke="#446688" stroke-width="1.4" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 592 97 L 606 97" stroke="#446688" stroke-width="1.4" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <text x="30" y="140" font-size="10.5" fill="#555555" filter="url(#rough2)">结果按输入顺序输出：事件 1 → 1，事件 2 → 2，事件 3 → 3，即 "1 2 3"。</text>

  <text x="30" y="182" font-size="12.5" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">样例 2：[1,3] [1,3]</text>

  <g font-size="10">
    <rect x="30" y="194" width="96" height="38" rx="7" fill="#cfe0f5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="78" y="210" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">事件 1</text>
    <text x="78" y="225" text-anchor="middle" font-size="9" fill="#555555" filter="url(#rough2)">[1,3]</text>

    <rect x="146" y="194" width="96" height="38" rx="7" fill="#d9ecd4" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="194" y="210" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">d = 1</text>
    <text x="194" y="225" text-anchor="middle" font-size="9" fill="#555555" filter="url(#rough2)">1 空闲</text>

    <rect x="262" y="194" width="96" height="38" rx="7" fill="#cfe0f5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="310" y="210" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">事件 2</text>
    <text x="310" y="225" text-anchor="middle" font-size="9" fill="#555555" filter="url(#rough2)">[1,3]</text>

    <rect x="378" y="194" width="96" height="38" rx="7" fill="#fbe3c8" stroke="#8a2b28" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="426" y="210" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">d = 2</text>
    <text x="426" y="225" text-anchor="middle" font-size="9" fill="#8a2b28" filter="url(#rough2)">1 被占 → 2</text>
  </g>
  <path d="M 128 213 L 142 213" stroke="#446688" stroke-width="1.4" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 244 213 L 258 213" stroke="#446688" stroke-width="1.4" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 360 213 L 374 213" stroke="#446688" stroke-width="1.4" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <text x="30" y="256" font-size="10.5" fill="#555555" filter="url(#rough2)">两个事件区间相同，第二个只能往后挪一天，输出 "1 2"；样例输出末尾的空格不影响答案。</text>

  <rect x="30" y="274" width="700" height="34" rx="8" fill="#e8e0f5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="44" y="296" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">题目保证有解，所以每个事件扫描到的一定是 ≤ r 的空闲日；输出任意一组合法方案都算对。</text>
</svg>
