<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1057"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="760" height="320" fill="#fafafa"/>
  <text x="380.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">颜色类只合并、格子只计数</text>
  <path d="M 121.60000000000001 42 Q 380.0 48 638.4 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="380.0" y="306" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">每次重涂把"当前颜色的整个类"并入目标颜色</text>
  <rect x="40" y="70" width="300" height="100" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">类 C：颜色 1</text>
  <text x="190" y="120" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">格子数 cnt = 12</text>
  <text x="190" y="144" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">符号表（仍在场）</text>
  <line x1="346.0" y1="120.0" x2="414.0" y2="120.0" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="380" y="106" text-anchor="middle" font-size="11" fill="#8c2f2c" filter="url(#rough2)">重涂</text>
  <rect x="420" y="70" width="300" height="100" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="570" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">类 T：颜色 2</text>
  <text x="570" y="120" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">cnt += 12</text>
  <text x="570" y="144" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">符号表：T 原有 + 0</text>
  <text x="380" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#8c2f2c" filter="url(#rough2)">颜色 1 从此在场上消失（旧颜色映射必须删掉）</text>
  <text x="380" y="232" text-anchor="middle" font-size="12.5" fill="#2f5223" filter="url(#rough2)">答案 += cnt(C) = 12，不需要逐格重涂</text>
  <text x="380" y="264" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">类 C 符号表里的符号按螺旋序入队，每个符号全局只入队一次</text>
  <text x="380" y="292" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">总复杂度 O(N + S log S)，S ≤ 9×10⁴</text>
</svg>
