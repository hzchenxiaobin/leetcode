<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="660" height="430" fill="#fafafa"/>

  <text x="330" y="28" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#444" filter="url(#rough2)">构造：保留最浅的坝 r，其余坝的父边全装摄像头</text>

  <!-- 左侧流程 -->
  <g filter="url(#rough2)">
    <rect x="36" y="58" width="272" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="48" y="78" font-size="12.5" fill="#2c4257">① 读入 n、p2..pn、m、a1..am</text>
    <text x="48" y="95" font-size="10" fill="#7a8a99">总规模 Σn ≤ 1e5，必须 O(n+m)</text>

    <rect x="36" y="122" width="272" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="48" y="142" font-size="12.5" fill="#2c4257">② 正序递推 depth[i] = depth[pi] + 1</text>
    <text x="48" y="159" font-size="10" fill="#7a8a99">pi &lt; i，不需要 DFS，也不会爆栈</text>

    <rect x="36" y="186" width="272" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="48" y="206" font-size="12.5" fill="#2f5a24">③ r ← depth 最小的那个坝</text>
    <text x="48" y="223" font-size="10" fill="#5c7a4f">r 的祖先里一定没有坝</text>

    <rect x="36" y="250" width="272" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="48" y="270" font-size="12.5" fill="#8a6a1f">④ 对每个坝 v ≠ r：在 (pv, v) 装摄像头</text>
    <text x="48" y="287" font-size="10" fill="#a08a4f">不砍 r 的父边，正好省下 1 个</text>

    <rect x="36" y="314" width="272" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="48" y="334" font-size="12.5" fill="#8d3b37">⑤ 输出 k = m − 1 与这些顶点 v</text>
    <text x="48" y="351" font-size="10" fill="#a86a66">顺序任意，答案不唯一</text>
  </g>

  <path d="M 172 104 L 172 120" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 172 168 L 172 184" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 172 232 L 172 248" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 172 296 L 172 312" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 右侧小树 -->
  <path d="M 500 80 L 420 175" stroke="#446688" stroke-width="1.7" fill="none" filter="url(#rough2)"/>
  <path d="M 500 80 L 575 175" stroke="#446688" stroke-width="1.7" fill="none" filter="url(#rough2)"/>
  <path d="M 420 175 L 388 265" stroke="#d6a040" stroke-width="3" fill="none" filter="url(#rough2)"/>
  <path d="M 420 175 L 458 265" stroke="#446688" stroke-width="1.7" fill="none" filter="url(#rough2)"/>
  <path d="M 575 175 L 575 265" stroke="#d6a040" stroke-width="3" fill="none" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="390" y="211" width="28" height="18" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <circle cx="404" cy="220" r="4" fill="none" stroke="#d6a040" stroke-width="1.4"/>
    <text x="368" y="206" font-size="10.5" fill="#b8860b">砍 5</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="561" y="211" width="28" height="18" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <circle cx="575" cy="220" r="4" fill="none" stroke="#d6a040" stroke-width="1.4"/>
    <text x="592" y="206" font-size="10.5" fill="#b8860b">砍 6</text>
  </g>

  <g filter="url(#rough2)">
    <circle cx="500" cy="80" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
    <text x="500" y="85" text-anchor="middle" font-size="12" fill="#2f5a24">r</text>
    <text x="500" y="52" text-anchor="middle" font-size="10.5" fill="#4a7a3a">最浅的坝</text>
    <circle cx="420" cy="175" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.7"/>
    <text x="420" y="180" text-anchor="middle" font-size="12" fill="#333">2</text>
    <circle cx="575" cy="175" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.7"/>
    <text x="575" y="180" text-anchor="middle" font-size="12" fill="#333">3</text>
    <circle cx="388" cy="265" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="388" y="270" text-anchor="middle" font-size="12" fill="#2f5a24">5</text>
    <circle cx="458" cy="265" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.7"/>
    <text x="458" y="270" text-anchor="middle" font-size="12" fill="#333">4</text>
    <circle cx="575" cy="265" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="575" y="270" text-anchor="middle" font-size="12" fill="#2f5a24">6</text>
  </g>

  <text x="500" y="312" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">分块 {r,2,3,4} | {5} | {6}</text>
  <text x="500" y="334" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">每块恰有 1 个坝 ⇒ 两两可区分</text>

  <g filter="url(#rough2)">
    <rect x="30" y="372" width="600" height="44" rx="8" fill="#fafafa" stroke="#999" stroke-width="1.3" stroke-dasharray="6 4"/>
    <text x="46" y="399" font-size="12" fill="#555">为什么行得通：r 上方没有坝；其余坝的父边全砍掉后，r 的块里再也走不到任何别的坝。</text>
  </g>
</svg>
