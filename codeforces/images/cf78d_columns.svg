<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="61"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>

  <rect width="720" height="470" fill="#fafafa"/>
  <text x="360" y="32" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">固定第 a 列：可能的 q 是连续一段（且与 a 同奇偶）</text>
  <path d="M 120 44 Q 360 50 600 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <polygon points="374.0,250.0 337.0,185.9 263.0,185.9 226.0,250.0 263.0,314.1 337.0,314.1" fill="#f7f7f4" stroke="#bfbfb6" stroke-width="1.3" filter="url(#rough2)"/>
  <polygon points="374.0,121.8 337.0,57.7 263.0,57.7 226.0,121.8 263.0,185.9 337.0,185.9" fill="#f7f7f4" stroke="#bfbfb6" stroke-width="1.3" filter="url(#rough2)"/>
  <polygon points="374.0,378.2 337.0,314.1 263.0,314.1 226.0,378.2 263.0,442.3 337.0,442.3" fill="#f7f7f4" stroke="#bfbfb6" stroke-width="1.3" filter="url(#rough2)"/>
  <polygon points="374.0,-6.3 337.0,-70.4 263.0,-70.4 226.0,-6.3 263.0,57.7 337.0,57.7" fill="#f7f7f4" stroke="#bfbfb6" stroke-width="1.3" filter="url(#rough2)"/>
  <polygon points="485.0,185.9 448.0,121.8 374.0,121.8 337.0,185.9 374.0,250.0 448.0,250.0" fill="#f7f7f4" stroke="#bfbfb6" stroke-width="1.3" filter="url(#rough2)"/>
  <polygon points="485.0,314.1 448.0,250.0 374.0,250.0 337.0,314.1 374.0,378.2 448.0,378.2" fill="#f7f7f4" stroke="#bfbfb6" stroke-width="1.3" filter="url(#rough2)"/>
  <polygon points="485.0,57.7 448.0,-6.3 374.0,-6.3 337.0,57.7 374.0,121.8 448.0,121.8" fill="#f7f7f4" stroke="#bfbfb6" stroke-width="1.3" filter="url(#rough2)"/>
  <polygon points="263.0,314.1 226.0,250.0 152.0,250.0 115.0,314.1 152.0,378.2 226.0,378.2" fill="#f7f7f4" stroke="#bfbfb6" stroke-width="1.3" filter="url(#rough2)"/>
  <polygon points="263.0,185.9 226.0,121.8 152.0,121.8 115.0,185.9 152.0,250.0 226.0,250.0" fill="#f7f7f4" stroke="#bfbfb6" stroke-width="1.3" filter="url(#rough2)"/>
  <polygon points="263.0,442.3 226.0,378.2 152.0,378.2 115.0,442.3 152.0,506.3 226.0,506.3" fill="#f7f7f4" stroke="#bfbfb6" stroke-width="1.3" filter="url(#rough2)"/>
  <polygon points="596.0,250.0 559.0,185.9 485.0,185.9 448.0,250.0 485.0,314.1 559.0,314.1" fill="#f7f7f4" stroke="#bfbfb6" stroke-width="1.3" filter="url(#rough2)"/>
  <polygon points="596.0,121.8 559.0,57.7 485.0,57.7 448.0,121.8 485.0,185.9 559.0,185.9" fill="#f7f7f4" stroke="#bfbfb6" stroke-width="1.3" filter="url(#rough2)"/>
  <polygon points="152.0,250.0 115.0,185.9 41.0,185.9 4.0,250.0 41.0,314.1 115.0,314.1" fill="#f7f7f4" stroke="#bfbfb6" stroke-width="1.3" filter="url(#rough2)"/>
  <polygon points="152.0,378.2 115.0,314.1 41.0,314.1 4.0,378.2 41.0,442.3 115.0,442.3" fill="#f7f7f4" stroke="#bfbfb6" stroke-width="1.3" filter="url(#rough2)"/>
  <polygon points="485.0,185.9 448.0,121.8 374.0,121.8 337.0,185.9 374.0,250.0 448.0,250.0" fill="#e6f0dd" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <polygon points="485.0,314.1 448.0,250.0 374.0,250.0 337.0,314.1 374.0,378.2 448.0,378.2" fill="#e6f0dd" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <polygon points="485.0,57.7 448.0,-6.3 374.0,-6.3 337.0,57.7 374.0,121.8 448.0,121.8" fill="#e6f0dd" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <polygon points="485.0,442.3 448.0,378.2 374.0,378.2 337.0,442.3 374.0,506.3 448.0,506.3" fill="#e6f0dd" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <polygon points="485.0,-70.4 448.0,-134.5 374.0,-134.5 337.0,-70.4 374.0,-6.3 448.0,-6.3" fill="#e6f0dd" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="333.0" y="96" width="156.0" height="308" rx="10" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="411.0" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">第 a = 1 列</text>
  <text x="411.0" y="190.91412011995155" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">q=1</text>
  <text x="411.0" y="319.0858798800484" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">q=-1</text>
  <text x="411.0" y="62.742360359854615" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">q=3</text>
  <text x="411.0" y="447.2576396401454" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">q=-3</text>
  <path d="M 515.0 120 L 515.0 384" stroke="#a05a5a" stroke-width="1.6" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <path d="M 515.0 120 L 535.0 120" stroke="#a05a5a" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 515.0 384 L 535.0 384" stroke="#a05a5a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="585.0" y="110" text-anchor="middle" font-size="11.5" fill="#6b3030" filter="url(#rough2)">q ≤ q_hi</text>
  <text x="585.0" y="400" text-anchor="middle" font-size="11.5" fill="#6b3030" filter="url(#rough2)">q ≥ q_lo</text>
  <rect x="470" y="150" width="222" height="196" rx="10" fill="#fbeeee" stroke="#a05a5a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="581" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#6b3030" filter="url(#rough2)">三条区间取交</text>
  <text x="581" y="204" text-anchor="middle" font-size="12.5" fill="#6b3030" filter="url(#rough2)">|q| ≤ u</text>
  <text x="581" y="228" text-anchor="middle" font-size="12.5" fill="#6b3030" filter="url(#rough2)">1−v ≤ q ≤ v−1</text>
  <text x="581" y="252" text-anchor="middle" font-size="12.5" fill="#6b3030" filter="url(#rough2)">1−w ≤ q ≤ w−1</text>
  <text x="581" y="284" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">q 步长 2（同奇偶）</text>
  <text x="581" y="308" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">u, v, w 都是整数开方</text>
  <text x="581" y="332" text-anchor="middle" font-size="12" fill="#333333" filter="url(#rough2)">每列 O(1)，共 O(k) 列</text>
  <text x="360" y="432" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">列的范围：|a| ≤ ⌊(2k−2)/3⌋；第 a 列与第 −a 列格数相同，只算一半</text>
</svg>
