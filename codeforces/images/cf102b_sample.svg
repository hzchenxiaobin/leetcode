<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="101"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="320" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2 与样例 1</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">10 → 1（1 次）；0 本身一位数（0 次）</text>
  <g filter="url(#rough2)"><rect x="140" y="120" width="160" height="56" rx="4" fill="#f6e3c4" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.3"/></g>
  <text x="220" y="156" text-anchor="middle" font-size="20" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">10</text>
  <g filter="url(#rough2)"><path d="M 310 148 L 380 148" fill="none" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrg)"/></g>
  <g filter="url(#rough2)"><rect x="390" y="120" width="160" height="56" rx="4" fill="#d7ecd0" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.3"/></g>
  <text x="470" y="156" text-anchor="middle" font-size="20" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="220" y="208" text-anchor="middle" font-size="11.5" fill="#3d6b2f" filter="url(#rough2)">1+0 = 1</text>
  <text x="700" y="148" text-anchor="start" font-size="13" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">答案 1</text>
  <text x="440" y="268" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">n 可有 10⁵ 位：用字符串逐位求和；只有 1 位数时答案为 0</text>
</svg>
