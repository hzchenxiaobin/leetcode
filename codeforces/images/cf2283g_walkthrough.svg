<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 530" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="680" height="530" fill="#fafafa"/>

  <text x="340" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">样例 3 演算：a = [8, 3, 5, 1]，t = 1 ⇒ 输出 3 5 3 5</text>
  <text x="340" y="47" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">降序 α₁=8（点1），α₂=5（点3），α₃=3（点2），α₄=1（点4）；对每个前缀掩码求一次 φ^t</text>

  <!-- graph of example 3 -->
  <g filter="url(#rough2)">
    <rect x="20" y="62" width="290" height="180" fill="#ffffff" stroke="#8899aa" stroke-width="1.3" rx="10"/>
    <text x="165" y="84" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">图：1⇄2⇄3⇄4，另有自环 1、2</text>

    <path d="M 46 160 C 40 132 62 128 66 148" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
    <path d="M 92 160 C 86 132 108 128 112 148" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>

    <line x1="84" y1="146" x2="126" y2="146" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>
    <line x1="126" y1="160" x2="84" y2="160" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>
    <line x1="154" y1="146" x2="196" y2="146" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>
    <line x1="196" y1="160" x2="154" y2="160" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>
    <line x1="224" y1="146" x2="264" y2="146" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>
    <line x1="264" y1="160" x2="224" y2="160" stroke="#666" stroke-width="1.2" marker-end="url(#arr)"/>

    <circle cx="60" cy="153" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="60" y="157" text-anchor="middle" font-size="11" fill="#2f4f6f">1</text>
    <circle cx="140" cy="153" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="140" y="157" text-anchor="middle" font-size="11" fill="#2f4f6f">2</text>
    <circle cx="210" cy="153" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="210" y="157" text-anchor="middle" font-size="11" fill="#2f4f6f">3</text>
    <circle cx="278" cy="153" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="278" y="157" text-anchor="middle" font-size="11" fill="#2f4f6f">4</text>

    <text x="60" y="188" text-anchor="middle" font-size="9.5" fill="#8a6a20">k=1 c=2</text>
    <text x="140" y="188" text-anchor="middle" font-size="9.5" fill="#8a6a20">k=2 c=2</text>
    <text x="210" y="188" text-anchor="middle" font-size="9.5" fill="#8a6a20">k=2 c=1</text>
    <text x="278" y="188" text-anchor="middle" font-size="9.5" fill="#8a6a20">k=1 c=1</text>
    <text x="165" y="212" text-anchor="middle" font-size="9.5" fill="#666">c_v = d_v − k_v + 1：入边中至少几个 ≥ X</text>
    <text x="165" y="230" text-anchor="middle" font-size="9.5" fill="#666">点 4 只有入边 3→4，所以它永远复制点 3</text>
  </g>

  <!-- prefix masks table -->
  <g filter="url(#rough2)">
    <rect x="322" y="62" width="338" height="180" fill="#ffffff" stroke="#8899aa" stroke-width="1.3" rx="10"/>
    <text x="491" y="84" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">t = 1：对前 p 大的集合掩码求一次 φ</text>

    <rect x="334" y="94" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="378" y="94" width="104" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="486" y="94" width="90" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="580" y="94" width="68" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <text x="354" y="109" text-anchor="middle" font-size="9.5" fill="#2f4f6f">p</text>
    <text x="430" y="109" text-anchor="middle" font-size="9.5" fill="#2f4f6f">top-p（值）</text>
    <text x="531" y="109" text-anchor="middle" font-size="9.5" fill="#2f4f6f">R_p = φ(top-p)</text>
    <text x="614" y="109" text-anchor="middle" font-size="9.5" fill="#2f4f6f">新增点</text>

    <rect x="334" y="120" width="40" height="22" fill="#ffffff" stroke="#8899aa" stroke-width="1.2" rx="4"/>
    <rect x="378" y="120" width="104" height="22" fill="#ffffff" stroke="#8899aa" stroke-width="1.2" rx="4"/>
    <rect x="486" y="120" width="90" height="22" fill="#ffffff" stroke="#8899aa" stroke-width="1.2" rx="4"/>
    <rect x="580" y="120" width="68" height="22" fill="#ffffff" stroke="#8899aa" stroke-width="1.2" rx="4"/>
    <text x="354" y="135" text-anchor="middle" font-size="10" fill="#444">1</text>
    <text x="430" y="135" text-anchor="middle" font-size="10" fill="#444">{1}（8）</text>
    <text x="531" y="135" text-anchor="middle" font-size="10" fill="#888">∅</text>
    <text x="614" y="135" text-anchor="middle" font-size="10" fill="#888">—</text>

    <rect x="334" y="146" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="378" y="146" width="104" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="486" y="146" width="90" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="580" y="146" width="68" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="354" y="161" text-anchor="middle" font-size="10" fill="#3a5a30">2</text>
    <text x="430" y="161" text-anchor="middle" font-size="10" fill="#3a5a30">{1,3}（8,5）</text>
    <text x="531" y="161" text-anchor="middle" font-size="10" fill="#3a5a30">{2,4}</text>
    <text x="614" y="161" text-anchor="middle" font-size="10" fill="#3a5a30">2, 4</text>

    <rect x="334" y="172" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="378" y="172" width="104" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="486" y="172" width="90" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="580" y="172" width="68" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="354" y="187" text-anchor="middle" font-size="10" fill="#3a5a30">3</text>
    <text x="430" y="187" text-anchor="middle" font-size="10" fill="#3a5a30">{1,2,3}（8,3,5）</text>
    <text x="531" y="187" text-anchor="middle" font-size="10" fill="#3a5a30">{1,2,3,4}</text>
    <text x="614" y="187" text-anchor="middle" font-size="10" fill="#3a5a30">1, 3</text>

    <rect x="334" y="198" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <rect x="378" y="198" width="104" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <rect x="486" y="198" width="90" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <rect x="580" y="198" width="68" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <text x="354" y="213" text-anchor="middle" font-size="10" fill="#8a6a20">4</text>
    <text x="430" y="213" text-anchor="middle" font-size="10" fill="#8a6a20">全集（8,3,5,1）</text>
    <text x="531" y="213" text-anchor="middle" font-size="10" fill="#8a6a20">全集（不动点）</text>
    <text x="614" y="213" text-anchor="middle" font-size="10" fill="#8a6a20">—</text>

    <text x="491" y="234" text-anchor="middle" font-size="9.5" fill="#666">R_p 关于 p 单调递增，所以「第一次出现」就是答案</text>
  </g>

  <!-- conclusion -->
  <g filter="url(#rough2)">
    <rect x="20" y="256" width="640" height="118" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <text x="36" y="278" font-size="11" fill="#3a5a30" font-weight="bold">把「哪一行第一次点亮某点」读出来，就得到 r_v：</text>
    <text x="36" y="300" font-size="10.5" fill="#3a5a30">点 1 首次出现在 R₃ ⇒ r₁=3；点 2 首次出现在 R₂ ⇒ r₂=2；点 3 首次出现在 R₃ ⇒ r₃=3；点 4 首次出现在 R₂ ⇒ r₄=2。</text>
    <text x="36" y="322" font-size="10.5" fill="#3a5a30">答案 = (α_{r₁}, α_{r₂}, α_{r₃}, α_{r₄}) = (α₃, α₂, α₃, α₂) = (3, 5, 3, 5)，与官方输出一致。</text>
    <text x="36" y="344" font-size="10.5" fill="#4a7a3a">t = 2 时同样可算：R₂ = φ({2,4}) = {3}，R₃ = φ(全集) = 全集 ⇒ r = (3,3,2,3) ⇒ (3,3,5,3)，也与官方一致。</text>
    <text x="36" y="364" font-size="10" fill="#666">t 再大也只需把同一批掩码沿 φ 多跳几步 —— 这就是为什么可以预处理 2ⁿ 状态后 O(n log t) 回答。</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="20" y="392" width="640" height="112" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <text x="36" y="414" font-size="11" fill="#8a6a20" font-weight="bold">两个必查的细节：</text>
    <text x="36" y="436" font-size="10.5" fill="#8a6a20">・阈值比较必须用「≥ X」。用「&gt; X」会在相邻两点值相等时把 r 算大，样例 3 的 3 与 5 就会偏。</text>
    <text x="36" y="458" font-size="10.5" fill="#8a6a20">・全集一定是 φ 的不动点（每点入边数 d_v ≥ c_v），所以 r_v ≤ n 恒成立，不必处理「永远不亮」。</text>
    <text x="36" y="480" font-size="10.5" fill="#8a6a20">・t = 0 时所有 r_v = 1…n 由 φ⁰ 决定，即只点亮自己：答案原样输出 a。</text>
    <text x="36" y="498" font-size="9.5" fill="#999">（φ⁰ = 恒等映射，环分支的 dist = 0 且 entryPos 指向自己，因此 t = 0 也走同一条代码路径。）</text>
  </g>
</svg>
