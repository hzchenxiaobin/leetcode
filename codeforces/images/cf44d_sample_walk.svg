<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="107"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="aa" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="450" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例：三颗行星到 1 号距离都是 1，两两距离都是 √2 ≈ 1.4142136</text>
  <path d="M 60 42 Q 360 48 660 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 三条坐标轴 -->
  <g filter="url(#rough2)">
    <line x1="150" y1="300" x2="440" y2="300" stroke="#446688" stroke-width="1.8" marker-end="url(#aa)"/>
    <line x1="150" y1="300" x2="300" y2="160" stroke="#446688" stroke-width="1.8" marker-end="url(#aa)"/>
    <line x1="150" y1="300" x2="150" y2="120" stroke="#446688" stroke-width="1.8" marker-end="url(#aa)"/>
    <text x="446" y="306" font-size="12" fill="#2f4a66">x</text>
    <text x="304" y="152" font-size="12" fill="#2f4a66">y</text>
    <text x="136" y="112" font-size="12" fill="#2f4a66">z</text>

    <!-- 行星 1 -->
    <circle cx="150" cy="300" r="8" fill="#e8f0fe" stroke="#2f4a66" stroke-width="2"/>
    <text x="120" y="316" font-size="12" font-weight="bold" fill="#2f4a66">1 (0,0,0)</text>

    <!-- 行星 2 在 z 轴 -->
    <circle cx="150" cy="150" r="8" fill="#e6f4ea" stroke="#2f5223" stroke-width="2"/>
    <text x="164" y="146" font-size="11.5" fill="#2f5223">2 (0,0,1)</text>

    <!-- 行星 3 在 y 轴 -->
    <circle cx="300" cy="160" r="8" fill="#fff8e1" stroke="#8a6015" stroke-width="2"/>
    <text x="310" y="150" font-size="11.5" fill="#8a6015">3 (0,1,0)</text>

    <!-- 行星 4 在 x 轴 -->
    <circle cx="430" cy="300" r="8" fill="#fdecea" stroke="#b85450" stroke-width="2"/>
    <text x="400" y="322" font-size="11.5" fill="#8f3a34">4 (1,0,0)</text>

    <!-- 两两连线 -->
    <line x1="300" y1="160" x2="430" y2="300" stroke="#999" stroke-width="1.3" stroke-dasharray="5 4"/>
    <line x1="150" y1="150" x2="300" y2="160" stroke="#999" stroke-width="1.3" stroke-dasharray="5 4"/>
    <line x1="150" y1="150" x2="430" y2="300" stroke="#999" stroke-width="1.3" stroke-dasharray="5 4"/>
    <text x="368" y="222" font-size="10.5" fill="#666">√2</text>

    <text x="170" y="230" font-size="11" fill="#2f4a66">d(1,·)=1</text>
  </g>

  <!-- 右侧：三对候选 -->
  <g filter="url(#rough2)">
    <rect x="466" y="86" width="226" height="150" rx="12" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="480" y="112" font-size="12.5" font-weight="bold" fill="#2f5223">三对候选时间</text>
    <text x="480" y="138" font-size="11.5" fill="#2b2b2b">(2,3): (1+1+1.4142)/2</text>
    <text x="480" y="160" font-size="11.5" fill="#2b2b2b">(2,4): (1+1+1.4142)/2</text>
    <text x="480" y="182" font-size="11.5" fill="#2b2b2b">(3,4): (1+1+1.4142)/2</text>
    <line x1="480" y1="194" x2="678" y2="194" stroke="#9bb0c4" stroke-width="1"/>
    <text x="480" y="216" font-size="13" font-weight="bold" fill="#b85450">= 1.7071067812</text>
  </g>

  <rect x="466" y="248" width="226" height="86" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="480" y="272" font-size="11.5" font-weight="bold" fill="#8a6015">t = 1 时发生了什么？</text>
  <text x="480" y="292" font-size="10.8" fill="#7a5a1b">三艘船同时抵达 2、3、4，</text>
  <text x="480" y="310" font-size="10.8" fill="#7a5a1b">立刻又同时派出新船。</text>
  <text x="480" y="328" font-size="10.8" fill="#8f3a34">端点重合，不算相撞。</text>

  <rect x="40" y="352" width="652" height="66" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="56" y="376" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">真正的第一次相撞：2→3 与 3→2 这两艘飞船在 t = 1 + √2/2 ≈ 1.7071 时刻相遇于线段中点。</text>
  <text x="56" y="398" font-size="11.5" fill="#2f5223" filter="url(#rough2)">若把「抵达 / 出发瞬间在行星上重合」也算相撞，答案会是 1，与官方输出 1.7071067812 矛盾。</text>
</svg>
