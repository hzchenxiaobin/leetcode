<svg xmlns="http://www.w3.org/2000/svg" width="740" height="400" viewBox="0 0 740 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="740" height="400" fill="#fafafa"/>
  <text x="370.0" y="36" font-size="20" fill="#2b2b2b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">样例 2：p = 1/2 与 2/3，阈值 t = 1</text>
  <path d="M 133 46 Q 370 52 607 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60" y="84" width="300" height="120" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="78" y="108" font-size="13" fill="#2f4a66" text-anchor="start" font-weight="bold" filter="url(#rough2)">变量 1：[1, 2]</text>
  <text x="78" y="134" font-size="11.5" fill="#44546a" text-anchor="start" filter="url(#rough2)">首位为 1 的只有 1</text>
  <text x="78" y="158" font-size="13" fill="#2f4a66" text-anchor="start" font-weight="bold" filter="url(#rough2)">p₁ = 1 / 2</text>
  <text x="78" y="184" font-size="12" fill="#44546a" text-anchor="start" filter="url(#rough2)">1  2  →  ✔ ✘</text>
  <rect x="380" y="84" width="300" height="120" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="398" y="108" font-size="13" fill="#2f5223" text-anchor="start" font-weight="bold" filter="url(#rough2)">变量 2：[9, 11]</text>
  <text x="398" y="134" font-size="11.5" fill="#3c5e2e" text-anchor="start" filter="url(#rough2)">首位为 1 的是 10、11</text>
  <text x="398" y="158" font-size="13" fill="#2f5223" text-anchor="start" font-weight="bold" filter="url(#rough2)">p₂ = 2 / 3</text>
  <text x="398" y="184" font-size="12" fill="#3c5e2e" text-anchor="start" filter="url(#rough2)">9  10  11  →  ✘ ✔ ✔</text>
  <text x="370" y="232" font-size="12.5" fill="#2b2b2b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">K = 50、N = 2  ⇒  t = ceil(50·2/100) = 1（至少 1 个）</text>
  <rect x="60" y="250" width="620" height="64" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="78" y="276" font-size="13" fill="#8a6015" text-anchor="start" font-weight="bold" filter="url(#rough2)">P(X ≥ 1) = 1 − (1 − p₁)(1 − p₂) = 1 − (1/2)(1/3) = 5/6</text>
  <text x="78" y="300" font-size="12" fill="#7a5a1b" text-anchor="start" filter="url(#rough2)">= 0.833333333333333…（与样例一致）</text>
  <rect x="60" y="326" width="620" height="56" rx="10" fill="#f2f6fb" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="78" y="352" font-size="12.5" fill="#2f4a66" text-anchor="start" filter="url(#rough2)">DP 视角：dp = [1/6, 1/2, 1/3]，从 j ≥ t = 1 求和 = 1/2 + 1/3 = 5/6</text>
</svg>
