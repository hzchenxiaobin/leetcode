<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="760" height="500" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="17" fill="#333"
        filter="url(#rough2)">走查 (2184, 2200)：d = 16，k = 2 全灭，k = 3 才是最优</text>
  <text x="380" y="52" text-anchor="middle" font-size="12" fill="#666"
        filter="url(#rough2)">2184 = 2³·3·7·13，2200 = 2³·5²·11，两者不互素（都含 2³）</text>

  <rect x="50" y="70" width="660" height="30" rx="6" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="110" y="90" text-anchor="middle" font-size="11.5" fill="#2c4a6b"
        filter="url(#rough2)">候选 j</text>
  <text x="270" y="90" text-anchor="middle" font-size="11.5" fill="#2c4a6b"
        filter="url(#rough2)">gcd(a, j) = 1 ？</text>
  <text x="420" y="90" text-anchor="middle" font-size="11.5" fill="#2c4a6b"
        filter="url(#rough2)">m = a + j</text>
  <text x="560" y="90" text-anchor="middle" font-size="11.5" fill="#2c4a6b"
        filter="url(#rough2)">gcd(m, b)</text>
  <text x="670" y="90" text-anchor="middle" font-size="11.5" fill="#2c4a6b"
        filter="url(#rough2)">能否 k = 2</text>

  <rect x="50" y="100" width="660" height="36" rx="4" fill="#ffffff" stroke="#cfd8e3"
        stroke-width="1.1" filter="url(#rough2)"/>
  <text x="110" y="124" text-anchor="middle" font-size="12.5" fill="#333"
        filter="url(#rough2)">j = 1</text>
  <text x="270" y="124" text-anchor="middle" font-size="12.5" fill="#2f5a24"
        filter="url(#rough2)">gcd(2184, 1) = 1 ✓</text>
  <text x="420" y="124" text-anchor="middle" font-size="12.5" fill="#333"
        filter="url(#rough2)">2185 = 5·19·23</text>
  <text x="560" y="124" text-anchor="middle" font-size="12.5" fill="#8a3a36"
        filter="url(#rough2)">5</text>
  <text x="670" y="124" text-anchor="middle" font-size="12.5" fill="#8a3a36"
        filter="url(#rough2)">= 5 &gt; 1，否</text>

  <rect x="50" y="136" width="660" height="36" rx="4" fill="#ffffff" stroke="#cfd8e3"
        stroke-width="1.1" filter="url(#rough2)"/>
  <text x="110" y="160" text-anchor="middle" font-size="12.5" fill="#333"
        filter="url(#rough2)">j = 5</text>
  <text x="270" y="160" text-anchor="middle" font-size="12.5" fill="#2f5a24"
        filter="url(#rough2)">gcd(2184, 5) = 1 ✓</text>
  <text x="420" y="160" text-anchor="middle" font-size="12.5" fill="#333"
        filter="url(#rough2)">2189 = 11·199</text>
  <text x="560" y="160" text-anchor="middle" font-size="12.5" fill="#8a3a36"
        filter="url(#rough2)">11</text>
  <text x="670" y="160" text-anchor="middle" font-size="12.5" fill="#8a3a36"
        filter="url(#rough2)">= 11 &gt; 1，否</text>

  <rect x="50" y="172" width="660" height="36" rx="4" fill="#ffffff" stroke="#cfd8e3"
        stroke-width="1.1" filter="url(#rough2)"/>
  <text x="110" y="196" text-anchor="middle" font-size="12.5" fill="#333"
        filter="url(#rough2)">j = 11</text>
  <text x="270" y="196" text-anchor="middle" font-size="12.5" fill="#2f5a24"
        filter="url(#rough2)">gcd(2184, 11) = 1 ✓</text>
  <text x="420" y="196" text-anchor="middle" font-size="12.5" fill="#333"
        filter="url(#rough2)">2195 = 5·439</text>
  <text x="560" y="196" text-anchor="middle" font-size="12.5" fill="#8a3a36"
        filter="url(#rough2)">5</text>
  <text x="670" y="196" text-anchor="middle" font-size="12.5" fill="#8a3a36"
        filter="url(#rough2)">= 5 &gt; 1，否</text>

  <text x="60" y="228" text-anchor="start" font-size="11.5" fill="#666"
        filter="url(#rough2)">j = 2,3,4,6,7,8,9,10,12,13,14,15 这 12 个候选直接被 gcd(j, 2184) &gt; 1 淘汰（2/3/7/13 的倍数）</text>

  <text x="60" y="262" text-anchor="start" font-size="13" fill="#8a3a36"
        filter="url(#rough2)">⇒ 2 步走不通；改成 3 步，中间夹一个 3 的幂 2187 = 3⁷ 就破了局：</text>

  <rect x="60" y="282" width="110" height="50" rx="7" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="115" y="312" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c4a6b"
        filter="url(#rough2)">2184</text>

  <rect x="230" y="282" width="110" height="50" rx="7" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="285" y="312" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5a24"
        filter="url(#rough2)">2185</text>

  <rect x="400" y="282" width="110" height="50" rx="7" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="455" y="312" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5a24"
        filter="url(#rough2)">2187</text>

  <rect x="570" y="282" width="110" height="50" rx="7" fill="#fff8e1" stroke="#d6a040"
        stroke-width="2" filter="url(#rough2)"/>
  <text x="625" y="312" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a5a00"
        filter="url(#rough2)">2200</text>

  <path d="M172,307 L226,307" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M342,307 L396,307" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M512,307 L566,307" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="199" y="300" text-anchor="middle" font-size="11" fill="#446688"
        filter="url(#rough2)">+1</text>
  <text x="369" y="300" text-anchor="middle" font-size="11" fill="#446688"
        filter="url(#rough2)">+2</text>
  <text x="539" y="300" text-anchor="middle" font-size="11" fill="#446688"
        filter="url(#rough2)">+13</text>

  <text x="199" y="322" text-anchor="middle" font-size="9.5" fill="#4a7a3a"
        filter="url(#rough2)">gcd=1</text>
  <text x="369" y="322" text-anchor="middle" font-size="9.5" fill="#4a7a3a"
        filter="url(#rough2)">gcd=1</text>
  <text x="539" y="322" text-anchor="middle" font-size="9.5" fill="#4a7a3a"
        filter="url(#rough2)">gcd=1</text>

  <text x="60" y="356" text-anchor="start" font-size="11.5" fill="#666"
        filter="url(#rough2)">合法性：gcd(2184, 1)=1，gcd(2185, 2)=1，gcd(2187, 13)=1（2187 = 3⁷ 与 13 互素）</text>

  <rect x="60" y="378" width="640" height="86" rx="9" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="402" text-anchor="start" font-size="12.5" fill="#8a5a00"
        filter="url(#rough2)">对照组 (15, 25)：d = 10，2200 换成 25 = 5²，但 15 = 3·5</text>
  <text x="80" y="426" text-anchor="start" font-size="12.5" fill="#8a5a00"
        filter="url(#rough2)">gcd(15, 25) = 5 &gt; 1 ⇒ k ≥ 2；取 j = 1：gcd(15,1)=1，gcd(16,25)=1 ⇒ k = 2</text>
  <text x="80" y="450" text-anchor="start" font-size="12.5" fill="#8a5a00"
        filter="url(#rough2)">链：15 →(+1) 16 →(+9) 25，两步到位，就是官方样例的最优解</text>
</svg>
