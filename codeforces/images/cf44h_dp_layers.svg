<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420">
<defs>
  <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs>
<rect x="0" y="0" width="760" height="420" fill="#fafafa"/>
<text x="380.0" y="34" font-size="22" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="bold" text-anchor="middle" filter="url(#rough2)">后缀 DP：从右往左累加</text>
<rect x="55" y="170" width="175" height="70" rx="8" fill="#e8f0fe" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="142.5" y="212.0" font-size="20" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">dp[i][d]</text>
<text x="142" y="260" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="normal" text-anchor="middle" filter="url(#rough2)">已经定下 t[i-1] = d</text>
<rect x="380" y="85" width="235" height="66" rx="8" fill="#e6f4ea" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="497.5" y="123.6" font-size="16" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">dp[i+1][ ⌊(s_i+d)/2⌋ ]</text>
<rect x="380" y="275" width="235" height="66" rx="8" fill="#e6f4ea" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="497.5" y="313.6" font-size="16" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">dp[i+1][ ⌈(s_i+d)/2⌉ ]</text>
<line x1="232" y1="190" x2="376" y2="122" stroke="#1a5fb4" stroke-width="2" filter="url(#rough2)"/>
<polygon points="376.0,122.0 363.9,122.2 368.2,131.2" fill="#1a5fb4" filter="url(#rough2)"/>
<line x1="232" y1="222" x2="376" y2="292" stroke="#1a5fb4" stroke-width="2" filter="url(#rough2)"/>
<polygon points="376.0,292.0 368.3,282.7 363.9,291.7" fill="#1a5fb4" filter="url(#rough2)"/>
<text x="300" y="145" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#2e7d32" font-weight="normal" text-anchor="middle" filter="url(#rough2)">和为偶数，只走左边</text>
<text x="300" y="292" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#c0392b" font-weight="normal" text-anchor="middle" filter="url(#rough2)">和为奇数，两条都走</text>
<rect x="60" y="330" width="430" height="52" rx="8" fill="#fff4d6" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="275.0" y="361.6" font-size="16" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">dp[n][*] = 1   (后缀为空)</text>
<text x="60" y="400" font-size="16" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="normal" text-anchor="start" filter="url(#rough2)">答案 = Σ_{d=0}^{9} dp[1][d] 减去 s 自身（若可达）</text>
</svg>
