<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="429"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="300" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">胜负只取决于 Ω(q)（质因子个数，带重数）</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">不能移动者胜 ⇒ Ω=2 是唯一的必败态</text>
  <g filter="url(#rough2)"><rect x="60" y="96" width="150" height="50" rx="5" fill="#cfe0f5" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="135" y="128" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">Ω ≤ 1</text>
  <text x="230" y="118" text-anchor="start" font-size="11.5" fill="#666666" filter="url(#rough2)">1 或素数</text>
  <text x="340" y="118" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">无法移动 ⇒ 先手胜</text>
  <text x="760" y="128" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1 与 0</text>
  <g filter="url(#rough2)"><rect x="60" y="158" width="150" height="50" rx="5" fill="#f6e3c4" fill-opacity="0.85" stroke="#8a2b28" stroke-width="1.4"/></g>
  <text x="135" y="190" text-anchor="middle" font-size="13" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">Ω = 2</text>
  <text x="230" y="180" text-anchor="start" font-size="11.5" fill="#666666" filter="url(#rough2)">p·q</text>
  <text x="340" y="180" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">只能走到素数 ⇒ 后手胜</text>
  <text x="760" y="190" text-anchor="middle" font-size="12" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="60" y="220" width="150" height="50" rx="5" fill="#dcecd2" fill-opacity="0.85" stroke="#b06a1e" stroke-width="1.4"/></g>
  <text x="135" y="252" text-anchor="middle" font-size="13" fill="#b06a1e" font-weight="bold" filter="url(#rough2)">Ω ≥ 3</text>
  <text x="230" y="242" text-anchor="start" font-size="11.5" fill="#666666" filter="url(#rough2)">p·q·r…</text>
  <text x="340" y="242" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">走到 p·q（Ω=2）⇒ 先手胜</text>
  <text x="760" y="252" text-anchor="middle" font-size="12" fill="#b06a1e" font-weight="bold" filter="url(#rough2)">1 与 p·q</text>
</svg>
