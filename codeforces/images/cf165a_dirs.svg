<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="779"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="280" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">四个方向各至少要有一个点</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">同行/同列，不含斜方向</text>
  <g filter="url(#rough2)"><circle cx="450" cy="150" r="18" fill="#dcecd2" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="450" y="152.88" text-anchor="middle" font-size="8" fill="#2b2b2b" filter="url(#rough2)">(x,y)</text>
  <g filter="url(#rough2)"><circle cx="450" cy="80" r="13" fill="#ffffff" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="450" y="82.88" text-anchor="middle" font-size="8" fill="#2b2b2b" filter="url(#rough2)">U</text>
  <g filter="url(#rough2)"><circle cx="450" cy="220" r="13" fill="#ffffff" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="450" y="222.88" text-anchor="middle" font-size="8" fill="#2b2b2b" filter="url(#rough2)">D</text>
  <g filter="url(#rough2)"><circle cx="380" cy="150" r="13" fill="#ffffff" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="380" y="152.88" text-anchor="middle" font-size="8" fill="#2b2b2b" filter="url(#rough2)">L</text>
  <g filter="url(#rough2)"><circle cx="520" cy="150" r="13" fill="#ffffff" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="520" y="152.88" text-anchor="middle" font-size="8" fill="#2b2b2b" filter="url(#rough2)">R</text>
  <g filter="url(#rough2)"><line x1="450" y1="132" x2="450" y2="96" stroke="#446688" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><line x1="450" y1="168" x2="450" y2="204" stroke="#446688" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><line x1="432" y1="150" x2="396" y2="150" stroke="#446688" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><line x1="468" y1="150" x2="504" y2="150" stroke="#446688" stroke-width="1.4"/></g>
  <text x="450" y="258" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">四者齐备才是超级中心（n ≤ 200 ⇒ O(n²) 直接判）</text>
</svg>
