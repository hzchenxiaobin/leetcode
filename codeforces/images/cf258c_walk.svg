<svg xmlns="http://www.w3.org/2000/svg" width="880" height="280" viewBox="0 0 880 280"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="280" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1：a = 1 4 3 2，答案 15</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">把所有 M 的贡献相加：M=1 贡献 1，M=2、3 各贡献若干，M=4 贡献最大</text>
  <text x="150" y="110" text-anchor="start" font-size="12.5" fill="#555555" filter="url(#rough2)">M=1：b 全为 1（1 种）</text>
  <text x="150" y="146" text-anchor="start" font-size="12.5" fill="#555555" filter="url(#rough2)">M=2：b_i ∈ 约数{1,2} 且 ≤ a_i，且至少一个 2</text>
  <text x="150" y="182" text-anchor="start" font-size="12.5" fill="#555555" filter="url(#rough2)">M=4：b_i ∈ {1,2,4} 且 ≤ a_i，且至少一个 4</text>
  <text x="150" y="230" text-anchor="start" font-size="14" fill="#3d6b2f" filter="url(#rough2)">总计 15，与官方输出一致</text>
</svg>
