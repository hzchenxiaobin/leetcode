<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1391"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>

  <rect width="700" height="300" fill="#fafafa"/>
  <text x="350.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">整周取模再逐天减</text>
  <path d="M 112.0 42 Q 350.0 48 588.0 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="350.0" y="286" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">n mod S（为 0 时取 S），第一次减到 ≤0 的那天</text>
  <rect x="70" y="80" width="70" height="60" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="105" y="106" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">一</text>
  <text x="105" y="128" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">15</text>
  <rect x="154" y="80" width="70" height="60" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="189" y="106" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">二</text>
  <text x="189" y="128" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">20</text>
  <rect x="238" y="80" width="70" height="60" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="273" y="106" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">三</text>
  <text x="273" y="128" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">20</text>
  <rect x="322" y="80" width="70" height="60" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="357" y="106" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">四</text>
  <text x="357" y="128" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">15</text>
  <rect x="406" y="80" width="70" height="60" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="441" y="106" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">五</text>
  <text x="441" y="128" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">10</text>
  <rect x="490" y="80" width="70" height="60" rx="7" fill="#fbeeee" stroke="#a05a5a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="525" y="106" text-anchor="middle" font-size="12" font-weight="bold" fill="#8c2f2c" filter="url(#rough2)">六</text>
  <text x="525" y="128" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">30</text>
  <rect x="574" y="80" width="70" height="60" rx="7" fill="#fbeeee" stroke="#a05a5a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="609" y="106" text-anchor="middle" font-size="12" font-weight="bold" fill="#8c2f2c" filter="url(#rough2)">日</text>
  <text x="609" y="128" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">45</text>
  <text x="350" y="175" text-anchor="middle" font-size="12" font-weight="bold" fill="#335478" filter="url(#rough2)">一周 155 页；100 mod 155 = 100</text>
  <text x="350" y="205" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">15→85, 20→65, 20→45, 15→30, 10→20, 30→−10 ⇒ 第 6 天</text>
  <text x="350" y="245" text-anchor="middle" font-size="11" fill="#8c2f2c" filter="url(#rough2)">余数为 0 表示最后一页正好落在周日</text>
</svg>
