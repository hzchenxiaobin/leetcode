  <text x="185" y="240" text-anchor="middle" font-size="11" fill="#b05a5a" filter="url(#rough2)">替换</text>
  <g filter="url(#rough2)"><rect x="250" y="100" width="70" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="285.0" y="127.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">D</text>
  <g filter="url(#rough2)"><rect x="250" y="180" width="70" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="285.0" y="207.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">D</text>
