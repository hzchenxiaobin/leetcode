  <text x="385.0" y="127.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">B</text>
  <g filter="url(#rough2)"><rect x="350" y="180" width="70" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="385.0" y="207.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">B</text>
