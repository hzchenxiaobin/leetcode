  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2 的走查：CDBABC → ADBADC</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">两个改动分别发生在位置 1 和位置 6；字典序最小的解是 ADBADC</text>
  <g filter="url(#rough2)"><rect x="150" y="100" width="70" height="44" rx="4" fill="#f6d9d7" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="185.0" y="127.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">C</text>
