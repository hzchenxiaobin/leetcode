<svg xmlns="http://www.w3.org/2000/svg" width="880" height="280" viewBox="0 0 880 280"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="280" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1：输出 3 1 3 与 3 2 2</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">多解：任意一棵满足度数和的二分树都行</text>
  <text x="150" y="120" text-anchor="start" font-size="13" fill="#2b2b2b" filter="url(#rough2)">1(黑,3)   2(黑,2)   3(白,5)</text>
  <text x="150" y="162" text-anchor="start" font-size="13" fill="#2f4a66" filter="url(#rough2)">取剩余值最小的黑白对 (3,2)，权 min(5,2)=2</text>
  <text x="150" y="204" text-anchor="start" font-size="13" fill="#2f4a66" filter="url(#rough2)">3 剩 3，再与 1 以权 3 相连</text>
  <text x="150" y="246" text-anchor="start" font-size="13" fill="#3d6b2f" filter="url(#rough2)">两个点的边权和分别等于 3、2、5 ✓</text>
</svg>
