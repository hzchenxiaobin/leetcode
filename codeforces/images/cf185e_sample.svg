<svg xmlns="http://www.w3.org/2000/svg" width="780" height="360" viewBox="0 0 780 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="780" height="360" fill="#fafafa"/>
  <text x="390.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2：dwarves (5,−3)、(−4,−5)，站 (−4,0)、(−3,−2)，答案 6</text>
  <path d="M 106.46000000000015 46 Q 390.0 52 673.5399999999998 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60.0" y="76.0" width="600.0" height="38.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="68.0" y="107.0" text-anchor="start" font-size="11.2" font-weight="bold" fill="#26405c" filter="url(#rough2)">量</text>
  <text x="148.0" y="107.0" text-anchor="start" font-size="11.2" font-weight="bold" fill="#26405c" filter="url(#rough2)">值</text>
  <text x="238.0" y="107.0" text-anchor="start" font-size="11.2" font-weight="bold" fill="#26405c" filter="url(#rough2)">说明</text>
  <path d="M 60.0 76.0 L 660.0 76.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="68.0" y="145.0" text-anchor="start" font-size="11.2" fill="#2b2b2b" filter="url(#rough2)">A₁</text>
  <text x="148.0" y="145.0" text-anchor="start" font-size="11.2" fill="#2b2b2b" filter="url(#rough2)">9</text>
  <text x="238.0" y="145.0" text-anchor="start" font-size="11.2" fill="#2b2b2b" filter="url(#rough2)">(5,−3) 到 (−3,−2) 的曼哈顿距离</text>
  <path d="M 60.0 114.0 L 660.0 114.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="68.0" y="183.0" text-anchor="start" font-size="11.2" fill="#2b2b2b" filter="url(#rough2)">A₂</text>
  <text x="148.0" y="183.0" text-anchor="start" font-size="11.2" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="238.0" y="183.0" text-anchor="start" font-size="11.2" fill="#2b2b2b" filter="url(#rough2)">(−4,−5) 到 (−4,0) 距离 5，到 (−3,−2) 距离 4</text>
  <path d="M 60.0 152.0 L 660.0 152.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="68.0" y="221.0" text-anchor="start" font-size="11.2" fill="#2b2b2b" filter="url(#rough2)">R₂</text>
  <text x="148.0" y="221.0" text-anchor="start" font-size="11.2" fill="#2b2b2b" filter="url(#rough2)">6</text>
  <text x="238.0" y="221.0" text-anchor="start" font-size="11.2" fill="#2b2b2b" filter="url(#rough2)">两点 L1 距离 11 ⇒ 1-center 半径 ⌈11/2⌉ = 6</text>
  <path d="M 60.0 190.0 L 660.0 190.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="68.0" y="259.0" text-anchor="start" font-size="11.2" fill="#2b2b2b" filter="url(#rough2)">答案</text>
  <text x="148.0" y="259.0" text-anchor="start" font-size="11.2" fill="#2b2b2b" filter="url(#rough2)">6</text>
  <text x="238.0" y="259.0" text-anchor="start" font-size="11.2" fill="#2b2b2b" filter="url(#rough2)">min(max A = 9, 其它候选, R₂ = 6) = 6</text>
  <path d="M 60.0 228.0 L 660.0 228.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <rect x="60.0" y="290.0" width="660.0" height="48.0" rx="9" fill="#eef8fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="314.0" text-anchor="start" font-size="11.1" fill="#33506e" filter="url(#rough2)">此例地铁帮不上忙（两站都贴着 dwarf 但彼此太远），最优就是在 L1 中点附近见面。</text>
</svg>
