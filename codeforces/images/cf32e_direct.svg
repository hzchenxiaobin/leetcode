<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="361" />
      <feDisplacementMap in="SourceGraphic" scale="1.5" />
    </filter>
    <marker id="a32e" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450" />
    </marker>
  </defs>
  <rect width="760" height="430" fill="#fafafa" />
  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">直射：墙挡路；镜子只在“平行”时不算障碍</text>
  <path d="M 110 44 Q 380 50 650 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)" />

  
  <rect x="30" y="66" width="340" height="300" rx="10" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.4" filter="url(#rough2)" />
  <text x="200" y="92" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3b36" filter="url(#rough2)">墙与视线相交 → 被挡住</text>

  <line x1="70" y1="250" x2="330" y2="250" stroke="#b85450" stroke-width="2" stroke-dasharray="5 4" filter="url(#rough2)" />
  <line x1="200" y1="185" x2="200" y2="315" stroke="#2b2b2b" stroke-width="5" filter="url(#rough2)" />
  <circle cx="90" cy="250" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" />
  <circle cx="310" cy="250" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)" />
  <text x="90" y="278" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">V</text>
  <text x="310" y="278" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">P</text>
  <text x="220" y="200" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">墙</text>
  <text x="200" y="340" text-anchor="middle" font-size="11" fill="#8a3b36" filter="url(#rough2)">墙是不透明线段，交点即阻挡</text>

  
  <rect x="390" y="66" width="340" height="300" rx="10" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.4" filter="url(#rough2)" />
  <text x="560" y="92" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">视线与镜子平行 → 镜子不挡</text>

  <line x1="430" y1="250" x2="690" y2="250" stroke="#b85450" stroke-width="2" stroke-dasharray="5 4" filter="url(#rough2)" />
  <line x1="520" y1="250" x2="590" y2="250" stroke="#8a6015" stroke-width="5" filter="url(#rough2)" />
  <circle cx="440" cy="250" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" />
  <circle cx="680" cy="250" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)" />
  <text x="440" y="278" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">V</text>
  <text x="680" y="278" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">P</text>
  <text x="555" y="240" text-anchor="middle" font-size="10.5" fill="#8a6015" filter="url(#rough2)">镜子</text>
  <text x="560" y="340" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">没有反射，但也不把镜子当障碍</text>

  <rect x="60" y="382" width="640" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)" />
  <text x="80" y="405" font-size="11.5" fill="#8a6015" filter="url(#rough2)">若视线与镜子相交且不平行，V、P 分居两侧，反射不可能，直射也被镜子挡住 → NO。</text>
</svg>