<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="720" height="300" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">子集枚举树：每个子集恰有一条从 {a_1} 出发的路径</text>
  <rect x="280" y="50" width="160" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="360" y="74" text-anchor="middle" font-size="12" fill="#2f5223">{a1}</text>
  <rect x="140" y="120" width="150" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="215" y="144" text-anchor="middle" font-size="11.5" fill="#2f4a66">{a1,a2}</text>
  <rect x="430" y="120" width="150" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="505" y="144" text-anchor="middle" font-size="11.5" fill="#2f4a66">{a2}</text>
  <rect x="40" y="200" width="140" height="40" rx="8" fill="#f2f2f2" stroke="#888888" stroke-width="1.5"/>
  <text x="110" y="224" text-anchor="middle" font-size="10.5" fill="#555555">{a1,a2,a3}</text>
  <rect x="200" y="200" width="140" height="40" rx="8" fill="#f2f2f2" stroke="#888888" stroke-width="1.5"/>
  <text x="270" y="224" text-anchor="middle" font-size="10.5" fill="#555555">{a1,a3}</text>
  <rect x="370" y="200" width="140" height="40" rx="8" fill="#f2f2f2" stroke="#888888" stroke-width="1.5"/>
  <text x="440" y="224" text-anchor="middle" font-size="10.5" fill="#555555">{a2,a3}</text>
  <rect x="530" y="200" width="140" height="40" rx="8" fill="#f2f2f2" stroke="#888888" stroke-width="1.5"/>
  <text x="600" y="224" text-anchor="middle" font-size="10.5" fill="#555555">{a3}</text>
  <line x1="360" y1="90" x2="215" y2="120" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="360" y1="90" x2="505" y2="120" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="180" y1="160" x2="110" y2="200" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="180" y1="160" x2="270" y2="200" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="470" y1="160" x2="440" y2="200" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="470" y1="160" x2="600" y2="200" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="40" y="262" text-anchor="start" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">孩子：加一个更大的 a_{m+1}，或把最大的 a_m 换成 a_{m+1}</text>
  <text x="40" y="286" text-anchor="start" font-size="11.5" fill="#7a4b22" filter="url(#rough2)">按和去重；凑够 k 个不同和就停（n ≤ 50，k 不大）</text>
</svg>
