<svg xmlns="http://www.w3.org/2000/svg" width="720" height="410" viewBox="0 0 720 410"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>

  <rect width="720" height="410" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">奇度点两两配对：把图补成欧拉图</text>
  <path d="M 150 42 Q 360 48 570 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 图 -->
  <g stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)">
    <line x1="150" y1="100" x2="300" y2="80"/>
    <line x1="300" y1="80" x2="380" y2="200"/>
    <line x1="380" y1="200" x2="220" y2="260"/>
    <line x1="220" y1="260" x2="150" y2="100"/>
    <line x1="150" y1="100" x2="380" y2="200"/>
  </g>
  <g filter="url(#rough2)">
    <circle cx="150" cy="100" r="11" fill="#fde8e8" stroke="#b85450" stroke-width="2"/>
    <circle cx="300" cy="80" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="380" cy="200" r="11" fill="#fde8e8" stroke="#b85450" stroke-width="2"/>
    <circle cx="220" cy="260" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g font-size="11" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">
    <text x="150" y="104">1</text><text x="300" y="84">2</text>
    <text x="380" y="204">3</text><text x="220" y="264">4</text>
  </g>
  <text x="150" y="78" text-anchor="middle" font-size="10" fill="#a33a36" filter="url(#rough2)">奇度</text>
  <text x="380" y="178" text-anchor="middle" font-size="10" fill="#a33a36" filter="url(#rough2)">奇度</text>

  <text x="40" y="322" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">红色点度数为奇数（1 和 3），其余为偶数；沿 1—3 的最短路再走一遍，两端奇偶性翻转、其余不变。</text>

  <rect x="40" y="338" width="640" height="58" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <g font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">
    <text x="56" y="362">答案 = 所有边的权和 + 奇度点集合上的最小完美匹配代价（两点代价 = 最短路）。</text>
    <text x="56" y="386">前提：所有边必须在 1 号点所在连通块里；否则怎么补都走不到，输出 -1。</text>
  </g>
</svg>
