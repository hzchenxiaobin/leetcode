<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="269"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="350" fill="#fafafa"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心恒等式：c(i,j) = u_i + u_j ⇒ 任意环费用 = 2Σu</text>
  <path d="M 140 40 Q 400 46 660 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <circle cx="200" cy="150" r="34" fill="#cfe0f5" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="156" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">u1=1</text>
  <circle cx="420" cy="150" r="34" fill="#d9ecd4" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="420" y="156" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">u2=2</text>
  <circle cx="640" cy="150" r="34" fill="#fbe3c8" stroke="#c98a2b" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="640" y="156" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">u3=3</text>
  <path d="M 232 140 L 388 140" stroke="#8a2b28" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="130" text-anchor="middle" font-size="11" fill="#8a2b28" filter="url(#rough2)">c12 = 3</text>
  <path d="M 446 140 L 608 140" stroke="#8a2b28" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="527" y="130" text-anchor="middle" font-size="11" fill="#8a2b28" filter="url(#rough2)">c23 = 5</text>
  <path d="M 620 172 C 560 220 280 220 220 172" stroke="#8a2b28" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="420" y="238" text-anchor="middle" font-size="11" fill="#8a2b28" filter="url(#rough2)">c31 = 4</text>
  <text x="60" y="290" font-size="12" fill="#2b2b2b" filter="url(#rough2)">一个环里每个顶点恰被两条边用到，所以 Σ(u_a+u_b) = 2(u1+u2+u3)，与环的形状无关。</text>
  <text x="60" y="320" font-size="11.5" fill="#8a6015" filter="url(#rough2)">样例 N=3 正是 u=(1,2,3)：边权 3,4,5。</text>

</svg>
