<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>

  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例一：一圈净赚 200 克金，于是可以无限重复</text>
  <path d="M 92 44 Q 360 51 628 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 沙 500 -->
  <rect x="40" y="86" width="168" height="70" rx="9" fill="#eaf3ff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="124" y="114" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f4a63" filter="url(#rough2)">沙 500 克</text>
  <text x="124" y="139" text-anchor="middle" font-size="11.5" fill="#5a7285" filter="url(#rough2)">每圈开始时都回到这里</text>

  <!-- 铅 1000 -->
  <rect x="40" y="210" width="168" height="70" rx="9" fill="#f3eefb" stroke="#6b5b95" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="124" y="238" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#4a3d6b" filter="url(#rough2)">铅 1000 克</text>
  <text x="124" y="263" text-anchor="middle" font-size="11.5" fill="#6a5c8a" filter="url(#rough2)">咒语一用 5 次（100→200）</text>

  <!-- 金 600 -->
  <rect x="40" y="322" width="168" height="60" rx="9" fill="#fff7e2" stroke="#c99a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="124" y="348" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">金 600 克</text>
  <text x="124" y="371" text-anchor="middle" font-size="11.5" fill="#9c7a36" filter="url(#rough2)">咒语二用 4 次（250→150）</text>

  <!-- 沙 -> 铅 箭头 -->
  <line x1="124" y1="158" x2="124" y2="204" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <!-- 铅 -> 金 箭头 -->
  <line x1="124" y1="282" x2="124" y2="316" stroke="#6b5b95" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 金 -> 沙 回归弧 -->
  <path d="M 210 360 Q 300 240 300 130 Q 300 116 214 118" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="352" y="250" text-anchor="middle" font-size="12" fill="#8a3b37" filter="url(#rough2)">拿 400 克金走咒语三</text>
  <text x="352" y="270" text-anchor="middle" font-size="12" fill="#8a3b37" filter="url(#rough2)">400 × (250/200) = 500 克沙</text>

  <!-- 净赚卡片 -->
  <rect x="486" y="120" width="204" height="120" rx="10" fill="#eef6ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="588" y="148" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">每圈净剩</text>
  <text x="588" y="178" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a3b37" filter="url(#rough2)">600 − 400 = 200 克金</text>
  <text x="588" y="204" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">沙子回到 500 克，可以再来</text>
  <text x="588" y="226" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">金：200, 400, 600, …</text>

  <line x1="588" y1="240" x2="588" y2="268" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="588" y="290" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">b·d·f = 7 500 000</text>
  <text x="588" y="310" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">a·c·e = 5 000 000</text>
  <text x="588" y="332" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">左边更大 ⇒ Ron</text>
</svg>
