  <rect x="80" y="80" width="64" height="56" rx="7" fill="#f4f4f1" stroke="#c8c8c0" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="112" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#777777" filter="url(#rough2)">b</text>
