  <text x="472" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#777777" filter="url(#rough2)">?</text>
  <rect x="512" y="80" width="64" height="56" rx="7" fill="#f4f4f1" stroke="#c8c8c0" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="544" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#777777" filter="url(#rough2)">?</text>
  <rect x="584" y="80" width="64" height="56" rx="7" fill="#f4f4f1" stroke="#c8c8c0" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="616" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#777777" filter="url(#rough2)">?</text>
