  <text x="184" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">b</text>
  <rect x="224" y="80" width="64" height="56" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="256" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">?</text>
  <rect x="296" y="80" width="64" height="56" rx="7" fill="#f4f4f1" stroke="#c8c8c0" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="328" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#777777" filter="url(#rough2)">?</text>
  <rect x="368" y="80" width="64" height="56" rx="7" fill="#f4f4f1" stroke="#c8c8c0" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="400" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#777777" filter="url(#rough2)">x</text>
