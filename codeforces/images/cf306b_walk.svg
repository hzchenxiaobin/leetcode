<svg xmlns="http://www.w3.org/2000/svg" width="880" height="200" viewBox="0 0 880 200"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="200" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1：删除 2 条（2 3）</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">与官方一致</text>
  <text x="150" y="90" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">样例 1：区间 [3,5]、[3,3]、[4,4]、[9,10]</text>
  <text x="150" y="130" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">并集 {3,4,5,9,10}；贪心选 1 与 4 → 删除 2、3 共 2 条</text>
</svg>
