<svg xmlns="http://www.w3.org/2000/svg" width="840" height="340" viewBox="0 0 840 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="340" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">DP：红漆用量 × 最后一色</text>
  <text x="420" y="56" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">dp[r] / dpG[r] = 用 r 面积红漆、最后一块红/绿的最小不美观值</text>
  <g filter="url(#rough2)"><rect x="110" y="100" width="300" height="90" rx="4" fill="#f6d9d7" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="260" y="128" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a4b2a" filter="url(#rough2)">dp[r]：最后为红</text>
  <text x="260" y="158" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">继续红：代价 0</text>
  <text x="260" y="180" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">红→绿：+min(h_{i−1}, h_i)</text>
  <g filter="url(#rough2)"><rect x="430" y="100" width="300" height="90" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="580" y="128" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3d6b2f" filter="url(#rough2)">dpG[r]：最后为绿</text>
  <text x="580" y="158" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">继续绿：代价 0</text>
  <text x="580" y="180" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">绿→红：+min(h_{i−1}, h_i)</text>
  <text x="420" y="230" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">约束：新红量 ≤ a 且 新绿量 = 前缀和 − 新红量 ≤ b</text>
  <g filter="url(#rough2)"><rect x="220" y="256" width="400" height="40" rx="4" fill="#f7fbf4" fill-opacity="0.85" stroke="#a8c99a" stroke-width="1.3"/></g>
  <text x="420" y="282" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3d6b2f" filter="url(#rough2)">答案 = 终态所有状态的最小值；无状态则 −1</text>
  <text x="420" y="320" text-anchor="middle" font-size="11" fill="#777777" filter="url(#rough2)">O(n·min(a,Σh)) ≤ 8×10⁶</text>
</svg>
