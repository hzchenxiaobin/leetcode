<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="760" height="340" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">三种动态的「按位置解析」模板</text>

  <!-- 第 1 行：posted -->
  <g font-size="13" fill="#2b3a4a" text-anchor="middle" filter="url(#rough2)">
    <rect x="30" y="56" width="92" height="38" rx="5" fill="#eef4fb" stroke="#446688" stroke-width="1.5"/>
    <rect x="130" y="56" width="110" height="38" rx="5" fill="#fff8e1" stroke="#c9a227" stroke-width="2"/>
    <rect x="248" y="56" width="60" height="38" rx="5" fill="#f2f2f2" stroke="#a8a8a2" stroke-width="1.2"/>
    <rect x="316" y="56" width="92" height="38" rx="5" fill="#e8f0e0" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="416" y="56" width="72" height="38" rx="5" fill="#f2f2f2" stroke="#a8a8a2" stroke-width="1.2"/>
    <text x="76" y="81">ahmed</text>
    <text x="185" y="81">posted</text>
    <text x="278" y="81">on</text>
    <text x="362" y="81">fatma's</text>
    <text x="452" y="81">wall</text>
  </g>
  <g font-size="10.5" fill="#7a7a70" text-anchor="middle" filter="url(#rough2)">
    <text x="30" y="52" text-anchor="start">w[0]=X</text>
    <text x="130" y="52" text-anchor="start">w[1]=动词，+15</text>
    <text x="316" y="52" text-anchor="start">w[3]=Y's</text>
    <text x="590" y="80" font-size="12" fill="#8a6015" text-anchor="start">5 个词</text>
  </g>

  <!-- 第 2 行：commented -->
  <g font-size="13" fill="#2b3a4a" text-anchor="middle" filter="url(#rough2)">
    <rect x="30" y="128" width="92" height="38" rx="5" fill="#eef4fb" stroke="#446688" stroke-width="1.5"/>
    <rect x="130" y="128" width="124" height="38" rx="5" fill="#fff8e1" stroke="#c9a227" stroke-width="2"/>
    <rect x="262" y="128" width="60" height="38" rx="5" fill="#f2f2f2" stroke="#a8a8a2" stroke-width="1.2"/>
    <rect x="330" y="128" width="92" height="38" rx="5" fill="#e8f0e0" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="430" y="128" width="72" height="38" rx="5" fill="#f2f2f2" stroke="#a8a8a2" stroke-width="1.2"/>
    <text x="76" y="153">fatma</text>
    <text x="192" y="153">commented</text>
    <text x="292" y="153">on</text>
    <text x="376" y="153">ahmed's</text>
    <text x="466" y="153">post</text>
  </g>
  <g font-size="10.5" fill="#7a7a70" text-anchor="middle" filter="url(#rough2)">
    <text x="30" y="124" text-anchor="start">w[0]=X</text>
    <text x="130" y="124" text-anchor="start">w[1]=动词，+10</text>
    <text x="330" y="124" text-anchor="start">w[3]=Y's</text>
    <text x="590" y="152" font-size="12" fill="#8a6015" text-anchor="start">5 个词</text>
  </g>

  <!-- 第 3 行：likes（名字与关键字重名） -->
  <g font-size="13" fill="#2b3a4a" text-anchor="middle" filter="url(#rough2)">
    <rect x="30" y="200" width="92" height="38" rx="5" fill="#eef4fb" stroke="#446688" stroke-width="1.5"/>
    <rect x="130" y="200" width="92" height="38" rx="5" fill="#fff8e1" stroke="#c9a227" stroke-width="2"/>
    <rect x="230" y="200" width="104" height="38" rx="5" fill="#e8f0e0" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="342" y="200" width="72" height="38" rx="5" fill="#f2f2f2" stroke="#a8a8a2" stroke-width="1.2"/>
    <text x="76" y="225">likes</text>
    <text x="176" y="225">likes</text>
    <text x="282" y="225">posted's</text>
    <text x="378" y="225">post</text>
  </g>
  <g font-size="10.5" fill="#7a7a70" text-anchor="middle" filter="url(#rough2)">
    <text x="30" y="196" text-anchor="start">w[0]=X</text>
    <text x="130" y="196" text-anchor="start">w[1]=动词，+5</text>
    <text x="230" y="196" text-anchor="start">w[2]=Y's</text>
    <text x="590" y="224" font-size="12" fill="#8a6015" text-anchor="start">4 个词</text>
  </g>

  <text x="380" y="278" text-anchor="middle" font-size="12.5" fill="#7a2f2c" filter="url(#rough2)">动作词恒在 w[1]；注意最上面一行的 X 名字本身就是 likes，所以只能按位置切分</text>
  <text x="380" y="306" text-anchor="middle" font-size="12.5" fill="#33475c" filter="url(#rough2)">Y 永远是以 &apos;s 结尾的那个词，去掉最后两个字符即可</text>
</svg>
