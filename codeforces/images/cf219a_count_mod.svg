<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="400" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">判定：每个字母的次数取模 k 必须为 0</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">k = 3，逐个检查 cnt mod 3；只要有一个非 0 就无解</text>
  <text x="280" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">字母</text>
  <text x="450" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">cnt</text>
  <text x="600" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">cnt mod 3</text>
  <text x="740" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">判定</text>
  <g filter="url(#rough2)"><rect x="230" y="96" width="100" height="36" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="280" y="120" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">a</text>
  <text x="450" y="120" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">6</text>
  <text x="600" y="120" text-anchor="middle" font-size="15" font-weight="bold" fill="#3d6b2f" filter="url(#rough2)">0</text>
  <text x="740" y="120" text-anchor="start" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">OK</text>
  <g filter="url(#rough2)"><rect x="230" y="146" width="100" height="36" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="280" y="170" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">b</text>
  <text x="450" y="170" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="600" y="170" text-anchor="middle" font-size="15" font-weight="bold" fill="#3d6b2f" filter="url(#rough2)">0</text>
  <text x="740" y="170" text-anchor="start" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">OK</text>
  <g filter="url(#rough2)"><rect x="230" y="196" width="100" height="36" rx="4" fill="#f6d9d7" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="280" y="220" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">c</text>
  <text x="450" y="220" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="600" y="220" text-anchor="middle" font-size="15" font-weight="bold" fill="#a0522d" filter="url(#rough2)">2</text>
  <text x="740" y="220" text-anchor="start" font-size="12.5" fill="#a0522d" filter="url(#rough2)">不整除 ⇒ 无解</text>
  <g filter="url(#rough2)"><rect x="230" y="246" width="100" height="36" rx="4" fill="#f6d9d7" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="280" y="270" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">z</text>
  <text x="450" y="270" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="600" y="270" text-anchor="middle" font-size="15" font-weight="bold" fill="#a0522d" filter="url(#rough2)">1</text>
  <text x="740" y="270" text-anchor="start" font-size="12.5" fill="#a0522d" filter="url(#rough2)">不整除 ⇒ 无解</text>
  <g filter="url(#rough2)"><rect x="230" y="296" width="100" height="36" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="280" y="320" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">…</text>
  <text x="450" y="320" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="600" y="320" text-anchor="middle" font-size="15" font-weight="bold" fill="#3d6b2f" filter="url(#rough2)">0</text>
  <text x="740" y="320" text-anchor="start" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">OK</text>
  <text x="420" y="368" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">只要出现一个红叉，就输出 -1；全绿则按 cnt/k 构造基本块</text>
</svg>
