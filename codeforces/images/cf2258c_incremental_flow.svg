<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="77"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#55606e"/>
    </marker>
  </defs>
  <rect width="760" height="500" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：两轮「一次基础询问 + 单调增量」</text>
  <path d="M 110 41 Q 380 48 650 41" stroke="#2b2b2b" stroke-width="1.1" fill="none" filter="url(#rough2)"/>

  <!-- 左列：主流程 -->
  <g filter="url(#rough2)">
    <rect x="50" y="58" width="400" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="250" y="83" text-anchor="middle" font-size="13" fill="#2f4a66">每组读入 n（多测：d 与 last 全部重来）</text>

    <path d="M 250 98 L 250 116" stroke="#55606e" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>

    <rect x="50" y="118" width="400" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="250" y="146" text-anchor="middle" font-size="13" fill="#8a6520">d ← 0，last ← 1（不变式 dist(1,last) = d）</text>

    <path d="M 250 162 L 250 180" stroke="#55606e" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>

    <rect x="50" y="182" width="400" height="66" rx="8" fill="#f7fbff" stroke="#446688" stroke-width="1.6"/>
    <text x="250" y="206" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66">第一轮：for v = 2 … n</text>
    <text x="250" y="230" text-anchor="middle" font-size="12.5" fill="#2f4a66">while ask(1, v, d+1)：d++，last ← v</text>

    <path d="M 250 248 L 250 266" stroke="#55606e" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>

    <rect x="50" y="268" width="400" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="250" y="296" text-anchor="middle" font-size="13" fill="#3c5e2e">A ← last：直径端点，dist(1,A) = d</text>

    <path d="M 250 312 L 250 330" stroke="#55606e" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>

    <rect x="50" y="332" width="400" height="66" rx="8" fill="#fffdf7" stroke="#d6a040" stroke-width="1.6"/>
    <text x="250" y="356" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6520">第二轮：for v = 1 … n，v ≠ A</text>
    <text x="250" y="380" text-anchor="middle" font-size="12.5" fill="#8a6520">while ask(A, v, d+1)：d++，B ← v（d 不重置）</text>

    <path d="M 250 398 L 250 416" stroke="#55606e" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>

    <rect x="80" y="418" width="300" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="230" y="445" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8f3a36">输出  ! A B d</text>
  </g>

  <!-- 右列：预算核算 -->
  <g filter="url(#rough2)">
    <rect x="492" y="58" width="248" height="46" rx="8" fill="#f7fbff" stroke="#446688" stroke-width="1.4"/>
    <text x="616" y="77" text-anchor="middle" font-size="12.5" fill="#2f4a66">询问 "? u v d"：返回 1 当且仅当</text>
    <text x="616" y="95" text-anchor="middle" font-size="12.5" fill="#2f4a66">dist(u,v) ≥ d（0 ≤ d ≤ n）</text>

    <rect x="492" y="118" width="248" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="616" y="139" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66">基础查询 = 2(n−1)</text>
    <text x="616" y="158" text-anchor="middle" font-size="12" fill="#2f4a66">每个点恰好一次</text>

    <rect x="492" y="182" width="248" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="616" y="203" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6520">增量查询 = D</text>
    <text x="616" y="222" text-anchor="middle" font-size="12" fill="#8a6520">两轮共享同一个 d</text>

    <path d="M 616 234 L 616 252" stroke="#55606e" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>

    <rect x="492" y="254" width="248" height="66" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="616" y="278" text-anchor="middle" font-size="13" font-weight="bold" fill="#8f3a36">合计 2(n−1) + D</text>
    <text x="616" y="300" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8f3a36">≤ 3n − 3  &lt;  3n</text>

    <rect x="492" y="332" width="248" height="76" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="616" y="353" text-anchor="middle" font-size="12" font-weight="bold" fill="#3c5e2e">最坏算例（n = 1000 的路径）</text>
    <text x="616" y="373" text-anchor="middle" font-size="12" fill="#3c5e2e">2·999 + 999 = 2997 次</text>
    <text x="616" y="393" text-anchor="middle" font-size="12" fill="#3c5e2e">上限 3n = 3000 次，仍有余量</text>

    <text x="380" y="484" text-anchor="middle" font-size="12" fill="#555">每一轮结束后 d 恰好等于这一轮根节点的偏心距，最远点 last 与根的距离也正是 d</text>
  </g>
</svg>
