<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="720" height="360" fill="#fafafa"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">一次扫描的状态机</text>
  <path d="M 200 43 Q 360 49 520 43" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <rect x="50" y="90" width="145" height="60" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="122" y="116" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">run=1</text>
  <text x="122" y="136" text-anchor="middle" font-size="9.5" fill="#777777" filter="url(#rough2)">起点</text>
  <path d="M 198 120 L 212 120" stroke="#2b2b2b" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="215" y="90" width="145" height="60" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="287" y="116" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">遇到相同字符</text>
  <text x="287" y="136" text-anchor="middle" font-size="9.5" fill="#777777" filter="url(#rough2)">run ← run+1</text>
  <path d="M 363 120 L 377 120" stroke="#2b2b2b" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="380" y="90" width="145" height="60" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="452" y="116" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">遇到不同字符</text>
  <text x="452" y="136" text-anchor="middle" font-size="9.5" fill="#777777" filter="url(#rough2)">run ← 1</text>
  <path d="M 528 120 L 542 120" stroke="#2b2b2b" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="545" y="90" width="145" height="60" rx="7" fill="#fdecea" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="617" y="116" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">run ≥ 7</text>
  <text x="617" y="136" text-anchor="middle" font-size="9.5" fill="#777777" filter="url(#rough2)">输出 YES</text>
  <text x="60" y="190" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">扫描结束仍未到 7 → 输出 NO。</text>
  <rect x="60" y="216" width="600" height="60" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="76" y="242" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">边界：整串只有 0 或只有 1 时，run 会一直增长；长度为 7 的合法串必须判断 YES。</text>
  <text x="76" y="262" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">题面保证两队都至少有一人，但代码不必依赖这一点。</text>
  <text x="60" y="310" text-anchor="start" font-size="11.5" fill="#777777" filter="url(#rough2)">时间 O(L)、空间 O(1)。</text>
</svg>
