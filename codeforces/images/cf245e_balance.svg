<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="720" height="300" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">馆内人数是前缀余额曲线：最少人数 = 最高点 − 最低点</text>
  <line x1="70" y1="150" x2="150" y2="110" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="150" y1="110" x2="230" y2="150" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="230" y1="150" x2="310" y2="190" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="310" y1="190" x2="390" y2="150" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="390" y1="150" x2="470" y2="110" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="470" y1="110" x2="550" y2="150" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="550" y1="150" x2="630" y2="190" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="70" y="270" text-anchor="start" font-size="11.5" fill="#446688" filter="url(#rough2)">横轴 = 事件序列，纵轴 = 馆内人数（以开局为 0 的相对值）</text>
  <text x="150" y="96" text-anchor="start" font-size="11" fill="#2f5223" filter="url(#rough2)">最高点 +1</text>
  <text x="310" y="214" text-anchor="start" font-size="11" fill="#7a4b22" filter="url(#rough2)">最低点 −1</text>
  <text x="560" y="60" text-anchor="start" font-size="13" fill="#b4652a" filter="url(#rough2)">答案 = 1 − (−1) = 2</text>
</svg>
