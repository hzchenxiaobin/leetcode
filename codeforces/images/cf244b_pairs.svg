<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="107"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="b4" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="320" fill="#fafafa"/>
  <text x="360" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">只有 55 种数字对：每种生成全部数，再用集合去重</text>

  <g filter="url(#rough2)">
    <rect x="40" y="44" width="250" height="250" rx="8" fill="#eef6ec" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <g font-size="10" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">
    <text x="160" y="62">x ≤ y，共 10·11/2 = 55 种组合</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="56" y="72" width="218" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="56" y="106" width="196" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="56" y="140" width="174" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="56" y="174" width="152" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="56" y="208" width="130" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="56" y="242" width="108" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <g font-size="10.5" fill="#2f5223" filter="url(#rough2)">
    <text x="66" y="94">(0,0) (0,1) … (0,9)：10 种</text>
    <text x="66" y="128">(1,1) (1,2) … (1,9)：9 种</text>
    <text x="66" y="162">(2,2) … (2,9)：8 种</text>
    <text x="66" y="196">…</text>
    <text x="66" y="230">(8,8) (8,9)：2 种</text>
    <text x="66" y="264">(9,9)：1 种</text>
  </g>

  <line x1="296" y1="168" x2="330" y2="168" stroke="#446688" stroke-width="1.6" marker-end="url(#b4)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="344" y="44" width="336" height="250" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <g font-size="11.5" fill="#2f4a66" filter="url(#rough2)">
    <text x="358" y="66" font-weight="bold">以 (x,y) = (4,7) 为例：一棵二叉树</text>
    <text x="358" y="90">长度 1：4、7</text>
    <text x="358" y="112">长度 2：44、47、74、77</text>
    <text x="358" y="134">长度 3：444、447、474、477、744、747、774、777</text>
    <text x="358" y="156">…… 长度 L 有 2^L 个（x = y 时只有 1 个）</text>
    <text x="358" y="184" fill="#7a4b22">n ≤ 10^9 ⇒ 长度最多 10 位</text>
    <text x="358" y="206">每个数在 DFS 里只被「生成 + 试插集合」一次</text>
    <text x="358" y="228">总规模 55 × (2^1 + … + 2^10) ≈ 11 万</text>
    <text x="358" y="252" fill="#2f5223">用 set 去重：同一个数可能被多个数对生成</text>
    <text x="358" y="274" fill="#2f5223">（例如 4 既能由 (4,4) 也能由 (4,7) 生成）</text>
  </g>
</svg>
