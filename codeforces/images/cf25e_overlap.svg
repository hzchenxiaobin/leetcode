<svg xmlns="http://www.w3.org/2000/svg" width="740" height="320" viewBox="0 0 740 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="91"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="740" height="320" fill="#fafafa"/>
  <text x="370" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">重叠拼接：ab 的尾巴与 bc 的头重合，长度 2+2−1 = 3</text>

  <!-- 上：a -->
  <g font-size="24" font-family="monospace" filter="url(#rough2)">
    <text x="150" y="100" fill="#2f4a66">a</text><text x="180" y="100" fill="#2f4a66">b</text>
  </g>
  <rect x="138" y="76" width="62" height="36" rx="5" fill="none" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <!-- 下：b, c -->
  <g font-size="24" font-family="monospace" filter="url(#rough2)">
    <text x="205" y="160" fill="#8a6015">b</text><text x="235" y="160" fill="#8a6015">c</text>
  </g>
  <rect x="193" y="136" width="62" height="36" rx="5" fill="none" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- 对齐虚线 -->
  <line x1="180" y1="104" x2="180" y2="196" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <line x1="228" y1="104" x2="228" y2="196" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <text x="260" y="196" font-size="12" fill="#8f3b37" filter="url(#rough2)">重叠 1 个字符 "b"，两串首尾对齐</text>

  <!-- 合并结果 -->
  <text x="150" y="250" font-size="13" fill="#2b2b2b" filter="url(#rough2)">合并结果：</text>
  <g font-size="24" font-family="monospace" filter="url(#rough2)">
    <text x="250" y="250" fill="#2f5223">a</text><text x="280" y="250" fill="#2f5223">b</text><text x="310" y="250" fill="#2f5223">c</text>
  </g>
  <text x="400" y="250" font-size="12" fill="#555" filter="url(#rough2)">长度 = |a| + |b| − ov(a,b)</text>

  <rect x="60" y="272" width="620" height="40" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="76" y="297" font-size="12.5" fill="#8a6015" filter="url(#rough2)">三个串时枚举 6 种顺序，每种算 |a|+|b|+|c| − ov(a,b) − ov(b,c)，取最小。</text>
</svg>
