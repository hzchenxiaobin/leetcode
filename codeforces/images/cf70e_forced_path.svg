<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="47"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2b2b2b"/>
    </marker>
  </defs>

  <rect width="760" height="460" fill="#fafafa"/>
  <text x="380" y="30" text-anchor="middle" font-size="17.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">关键引理：c 是 v 的最近中心且 c 在 u* 子树内 ⇒ 整条 v→c 路径都由 c 负责</text>
  <path d="M 60 40 Q 380 46 700 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 树 -->
  <g filter="url(#rough2)" stroke="#b0b0b0" stroke-width="1.6" fill="none">
    <line x1="380" y1="90" x2="270" y2="170"/>
    <line x1="380" y1="90" x2="480" y2="170"/>
    <line x1="380" y1="90" x2="580" y2="170"/>
    <line x1="270" y1="170" x2="200" y2="250"/>
    <line x1="200" y1="250" x2="140" y2="330"/>
  </g>
  <g filter="url(#rough2)" stroke="#d98026" stroke-width="3.2" fill="none">
    <line x1="380" y1="90" x2="270" y2="170"/>
    <line x1="270" y1="170" x2="200" y2="250"/>
    <line x1="200" y1="250" x2="140" y2="330"/>
  </g>
  <g filter="url(#rough2)">
    <circle cx="380" cy="90" r="16" fill="#d7ecd9" stroke="#2f7a3a" stroke-width="1.8"/>
    <circle cx="270" cy="170" r="15" fill="#fbe3c8" stroke="#d98026" stroke-width="1.8"/>
    <circle cx="200" cy="250" r="14" fill="#fbe3c8" stroke="#d98026" stroke-width="1.8"/>
    <circle cx="140" cy="330" r="16" fill="#fdecea" stroke="#b85450" stroke-width="2"/>
    <circle cx="480" cy="170" r="14" fill="#eef2f7" stroke="#446688" stroke-width="1.5"/>
    <circle cx="580" cy="170" r="14" fill="#eef2f7" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)" text-anchor="middle">
    <text x="380" y="95">v</text>
    <text x="270" y="175">u*</text>
    <text x="200" y="255">w</text>
    <text x="140" y="335" fill="#8c2f2b">c</text>
    <text x="480" y="175">u₂</text>
    <text x="580" y="175">u₃</text>
  </g>
  <text x="112" y="360" font-size="11.5" font-weight="bold" fill="#8c2f2b" filter="url(#rough2)">中心，付 k</text>
  <text x="316" y="126" font-size="10.5" fill="#a8590f" filter="url(#rough2)">d₁</text>
  <text x="224" y="206" font-size="10.5" fill="#a8590f" filter="url(#rough2)">d₂</text>
  <text x="152" y="288" font-size="10.5" fill="#a8590f" filter="url(#rough2)">d₃</text>
  <text x="480" y="204" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">min(E[·][c], G[·])</text>
  <text x="580" y="204" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">min(E[·][c], G[·])</text>

  <text x="300" y="300" font-size="11.5" fill="#a8590f" filter="url(#rough2)">v、u*、w 都直接由 c 负责，代价 d₁ + d₂ + d₃，k 只在 c 处付一次</text>

  <!-- 左上：状态公式 -->
  <rect x="26" y="60" width="240" height="126" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="42" y="84" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">路径上用的状态 H[v][c]</text>
  <text x="42" y="108" font-size="11.3" fill="#2f4a66" filter="url(#rough2)">H[v][c] = d[dist(v,c)]</text>
  <text x="56" y="128" font-size="11.3" fill="#2f4a66" filter="url(#rough2)">+ Σ min(E[u][c], G[u])</text>
  <text x="56" y="148" font-size="11.3" fill="#2f4a66" filter="url(#rough2)">+ H[u*][c]（沿路径递归）</text>
  <text x="42" y="170" font-size="10.8" fill="#2f4a66" filter="url(#rough2)">c = v 时首项换成 k，路径到此为止</text>

  <!-- 底部：引理说明 -->
  <rect x="30" y="378" width="700" height="70" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="46" y="400" font-size="12.3" font-weight="bold" fill="#8a6015" filter="url(#rough2)">为什么整条路径必须一起交给 c？</text>
  <text x="46" y="420" font-size="11.4" fill="#7a5a1b" filter="url(#rough2)">若 y 是子树 u* 内的中心：dist(v,y)=dist(v,u*)+dist(u*,y) ≥ dist(v,c)，即子树内没有点比 c 更近；</text>
  <text x="46" y="439" font-size="11.4" fill="#7a5a1b" filter="url(#rough2)">于是 c 也是 u* 的最近中心（同理逐层），u*、w … 都必须由 c 负责 —— 否则会重复付 k，或让 v 改用更远的中心。</text>
</svg>
