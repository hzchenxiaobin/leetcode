<svg xmlns="http://www.w3.org/2000/svg" width="720" height="336" viewBox="0 0 720 336"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="336" fill="#fafafa"/>
  <text x="360.0" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">208B：样例一的合并过程</text>
  <path d="M 144.00 46 Q 360.0 52 576.00 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="72" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">样例一：2S 2S 2C 2C</text>
  <rect x="60" y="104" width="600" height="32" rx="5" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="125" text-anchor="start" font-size="10.5" fill="#33506e" filter="url(#rough2)">初始</text>
  <text x="420" y="125" text-anchor="start" font-size="10.5" fill="#2f5b34" filter="url(#rough2)">2S 2S 2C 2C</text>
  <rect x="60" y="142" width="600" height="32" rx="5" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="163" text-anchor="start" font-size="10.5" fill="#33506e" filter="url(#rough2)">把第 4 堆放到第 3 堆（2C=2C）</text>
  <text x="420" y="163" text-anchor="start" font-size="10.5" fill="#2f5b34" filter="url(#rough2)">2S 2S 2C</text>
  <rect x="60" y="180" width="600" height="32" rx="5" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="201" text-anchor="start" font-size="10.5" fill="#33506e" filter="url(#rough2)">把第 3 堆放到第 2 堆（同值 2）</text>
  <text x="420" y="201" text-anchor="start" font-size="10.5" fill="#2f5b34" filter="url(#rough2)">2S 2C</text>
  <rect x="60" y="218" width="600" height="32" rx="5" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="239" text-anchor="start" font-size="10.5" fill="#33506e" filter="url(#rough2)">把第 2 堆放到第 1 堆（2S=2S）</text>
  <text x="420" y="239" text-anchor="start" font-size="10.5" fill="#2f5b34" filter="url(#rough2)">2S</text>
  <rect x="60" y="264" width="600" height="56" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="281" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">合并到只剩一堆 ⇒ YES。样例二 3S 与 2C 花色点数都不同 ⇒ 无法合并 ⇒ NO。</text>
</svg>
