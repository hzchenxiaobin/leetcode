<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="760" height="420" fill="#fafafa"/>

  <text x="60" y="96" font-size="13" text-anchor="middle" fill="#35507a" font-weight="bold" filter="url(#rough2)">s₁</text>
  <text x="60" y="256" font-size="13" text-anchor="middle" fill="#35507a" font-weight="bold" filter="url(#rough2)">s₂</text>
  <text x="300" y="96" font-size="13" text-anchor="middle" fill="#7a2f2f" font-weight="bold" filter="url(#rough2)">t₁</text>
  <text x="300" y="256" font-size="13" text-anchor="middle" fill="#7a2f2f" font-weight="bold" filter="url(#rough2)">t₂</text>
  <circle cx="60" cy="100" r="5" fill="#446688" stroke="none" filter="url(#rough2)"/>
  <circle cx="60" cy="260" r="5" fill="#446688" stroke="none" filter="url(#rough2)"/>
  <circle cx="300" cy="100" r="5" fill="#b85450" stroke="none" filter="url(#rough2)"/>
  <circle cx="300" cy="260" r="5" fill="#b85450" stroke="none" filter="url(#rough2)"/>
  <line x1="70" y1="100" x2="290" y2="100" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="92" font-size="10.5" text-anchor="middle" fill="#35507a" filter="url(#rough2)">a 条形如…</text>
  <line x1="70" y1="260" x2="290" y2="260" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="280" font-size="10.5" text-anchor="middle" fill="#35507a" filter="url(#rough2)">d 条形如…</text>
  <line x1="70" y1="112" x2="290" y2="248" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="116" y="196" font-size="10.5" text-anchor="start" fill="#2f5223" filter="url(#rough2)">c 条</text>
  <line x1="70" y1="248" x2="290" y2="112" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="248" y="196" font-size="10.5" text-anchor="start" fill="#2f5223" filter="url(#rough2)">b 条</text>
  <rect x="370" y="70" width="150" height="116" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="445" y="104" font-size="13" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">[ a  c ]</text>
  <text x="445" y="132" font-size="13" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">[ b  d ]</text>
  <text x="445" y="166" font-size="11.5" text-anchor="middle" fill="#7a2f2f" filter="url(#rough2)">det = ad − bc</text>
  <line x1="320" y1="180" x2="362" y2="150" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="540" y="70" width="180" height="92" rx="6" fill="#eaf5e6" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="630" y="94" font-size="11.5" text-anchor="middle" fill="#2f5223" font-weight="bold" filter="url(#rough2)">恒等配对 +1</text>
  <text x="630" y="118" font-size="10.5" text-anchor="middle" fill="#2f5223" filter="url(#rough2)">s₁→t₁, s₂→t₂</text>
  <text x="630" y="142" font-size="10.5" text-anchor="middle" fill="#2f5223" filter="url(#rough2)">逆序数 0（偶）</text>
  <rect x="540" y="176" width="180" height="92" rx="6" fill="#fdf0ef" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="630" y="200" font-size="11.5" text-anchor="middle" fill="#7a2f2f" font-weight="bold" filter="url(#rough2)">交叉配对 −1</text>
  <text x="630" y="224" font-size="10.5" text-anchor="middle" fill="#7a2f2f" filter="url(#rough2)">s₁→t₂, s₂→t₁</text>
  <text x="630" y="248" font-size="10.5" text-anchor="middle" fill="#7a2f2f" filter="url(#rough2)">逆序数 1（奇）</text>
  <text x="540" y="296" font-size="11" text-anchor="start" fill="#2b2b2b" filter="url(#rough2)">只有顶点不相交的系统</text>
  <text x="540" y="316" font-size="11" text-anchor="start" fill="#2b2b2b" filter="url(#rough2)">才有机会留下来</text>
  <text x="50" y="356" font-size="11.5" text-anchor="start" fill="#2b2b2b" filter="url(#rough2)">M[i][j] = 源 i 到汇 j 的路径条数（平行边分别计数，全对 p 取模）。</text>
  <text x="50" y="380" font-size="11.5" text-anchor="start" fill="#35507a" filter="url(#rough2)">det(M) 展开后每一项都是“一个配对 + 一组路径”，符号正好是配对排列的符号。</text>
  <text x="380.0" y="36" font-size="20" text-anchor="middle" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">LGV：路径条数矩阵的行列式 = 带符号的“不相交路径系统”总数</text>
  <path d="M 120 46 Q 380.0 52 640 46" fill="none" stroke="#2b2b2b" stroke-width="1.3" filter="url(#rough2)"/>
</svg>
