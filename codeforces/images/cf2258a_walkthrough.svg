<svg xmlns="http://www.w3.org/2000/svg" width="760" height="404" viewBox="0 0 760 404"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="53"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="404" fill="#fafafa"/>

  <text x="380" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">演算：四组官方样例 + 一组自造边界</text>
  <path d="M 214 44 Q 380 51 546 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 表头 -->
  <rect x="24" y="56" width="54" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="51" y="80" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">用例</text>
  <rect x="82" y="56" width="296" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="230" y="80" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">数组 a</text>
  <rect x="382" y="56" width="150" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="457" y="80" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">首尾 a1, an</text>
  <rect x="536" y="56" width="110" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="591" y="80" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">gcd(首,尾)</text>
  <rect x="650" y="56" width="86" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="693" y="80" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">答案</text>

  <!-- 行 1 -->
  <rect x="24" y="98" width="54" height="36" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="51" y="121" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="82" y="98" width="296" height="36" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="230" y="121" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2 4 6 7 8 9 10</text>
  <rect x="382" y="98" width="150" height="36" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="457" y="121" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2, 10</text>
  <rect x="536" y="98" width="110" height="36" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="591" y="121" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="650" y="98" width="86" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="693" y="121" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">2</text>

  <!-- 行 2 -->
  <rect x="24" y="138" width="54" height="36" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="51" y="161" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="82" y="138" width="296" height="36" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="230" y="161" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">55 55555</text>
  <rect x="382" y="138" width="150" height="36" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="457" y="161" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">55, 55555</text>
  <rect x="536" y="138" width="110" height="36" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="591" y="161" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="650" y="138" width="86" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="693" y="161" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">5</text>

  <!-- 行 3 -->
  <rect x="24" y="178" width="54" height="36" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="51" y="201" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="82" y="178" width="296" height="36" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="230" y="201" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1000000 1000 1 1000000000</text>
  <rect x="382" y="178" width="150" height="36" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="457" y="201" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1000000, 1000000000</text>
  <rect x="536" y="178" width="110" height="36" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="591" y="201" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1000000</text>
  <rect x="650" y="178" width="86" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="693" y="201" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">1000000</text>

  <!-- 行 4 -->
  <rect x="24" y="218" width="54" height="36" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="51" y="241" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="82" y="218" width="296" height="36" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="230" y="241" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">23 32 23 32 23</text>
  <rect x="382" y="218" width="150" height="36" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="457" y="241" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">23, 23</text>
  <rect x="536" y="218" width="110" height="36" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="591" y="241" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">23</text>
  <rect x="650" y="218" width="86" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="693" y="241" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">23</text>

  <!-- 行 5（自造） -->
  <rect x="24" y="258" width="54" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="51" y="281" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">自造</text>
  <rect x="82" y="258" width="296" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="230" y="281" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">7</text>
  <rect x="382" y="258" width="150" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="457" y="281" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">7, 7</text>
  <rect x="536" y="258" width="110" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="591" y="281" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">7</text>
  <rect x="650" y="258" width="86" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="693" y="281" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">7</text>

  <!-- 说明 -->
  <rect x="24" y="308" width="712" height="82" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="332" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">第 3 组最直观：擦掉中间的 1000 与 1，只剩 [1000000, 1000000000]，gcd = 1000000</text>
  <text x="380" y="356" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">第 4 组说明重复元素不影响结论：首尾都是 23，答案就是 23</text>
  <text x="380" y="380" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">第 5 组是 n = 1 的边界：数组只有一个 7，首尾同指一个元素，答案 7</text>
</svg>
