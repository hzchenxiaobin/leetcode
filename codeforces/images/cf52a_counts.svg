<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="720" height="400" fill="#fafafa"/>
  <text x="360.0" y="33" font-size="20" font-weight="bold" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">三种数的出现次数决定答案</text>
  <path d="M 298 44 Q 360.0 50 422 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 70 288 L 650 288" stroke="#555" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <rect x="120" y="174" width="92" height="114" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="166" y="164" font-size="14" font-weight="bold" fill="#446688" text-anchor="middle" filter="url(#rough2)">c1 = 3</text>
  <text x="166" y="312" font-size="12" font-weight="normal" fill="#555" text-anchor="middle" filter="url(#rough2)">数值 1</text>
  <rect x="300" y="136" width="92" height="152" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="346" y="126" font-size="14" font-weight="bold" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">c2 = 4</text>
  <text x="346" y="312" font-size="12" font-weight="normal" fill="#555" text-anchor="middle" filter="url(#rough2)">数值 2</text>
  <rect x="480" y="212" width="92" height="76" rx="6" fill="#fde8e8" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="526" y="202" font-size="14" font-weight="bold" fill="#b85450" text-anchor="middle" filter="url(#rough2)">c3 = 2</text>
  <text x="526" y="312" font-size="12" font-weight="normal" fill="#555" text-anchor="middle" filter="url(#rough2)">数值 3</text>
  <text x="346" y="102" font-size="12" font-weight="bold" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">众数：保留它</text>
  <path d="M 346 110 L 346 130" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="90" y="322" width="540" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="346" font-size="15" font-weight="bold" fill="#2f5223" text-anchor="middle" filter="url(#rough2)">ans = n − max(c₁, c₂, c₃) = 9 − 4 = 5</text>
  <text x="360" y="368" font-size="12" font-weight="normal" fill="#2f5223" text-anchor="middle" filter="url(#rough2)">把其余 5 个数都改成 2，序列统一</text>
  <text x="360" y="392" font-size="11" font-weight="normal" fill="#666" text-anchor="middle" filter="url(#rough2)">统一成 1 要改 6 个、统一成 3 要改 7 个 —— 只有众数最省</text>
</svg>
