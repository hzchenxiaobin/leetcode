<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="456"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="340" fill="#fafafa"/>
  <text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">相邻的男女对里选技能差最小的；差相同取最靠左的一对</text>
  <path d="M 60 38 Q 380 46 700 38" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <g font-size="12">
    <rect x="60" y="92" width="76" height="62" rx="9" fill="#cfe0f5" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="98" y="116" text-anchor="middle" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">B</text>
    <text x="98" y="138" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">4</text>
    <text x="98" y="172" text-anchor="middle" font-size="9.5" fill="#555555" filter="url(#rough2)">第 1 人</text>

    <rect x="196" y="92" width="76" height="62" rx="9" fill="#f6d5d5" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="234" y="116" text-anchor="middle" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">G</text>
    <text x="234" y="138" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">2</text>
    <text x="234" y="172" text-anchor="middle" font-size="9.5" fill="#555555" filter="url(#rough2)">第 2 人</text>

    <rect x="332" y="92" width="76" height="62" rx="9" fill="#cfe0f5" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="370" y="116" text-anchor="middle" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">B</text>
    <text x="370" y="138" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">4</text>
    <text x="370" y="172" text-anchor="middle" font-size="9.5" fill="#555555" filter="url(#rough2)">第 3 人</text>

    <rect x="468" y="92" width="76" height="62" rx="9" fill="#f6d5d5" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="506" y="116" text-anchor="middle" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">G</text>
    <text x="506" y="138" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">3</text>
    <text x="506" y="172" text-anchor="middle" font-size="9.5" fill="#555555" filter="url(#rough2)">第 4 人</text>
  </g>

  <path d="M 140 123 L 192 123" stroke="#446688" stroke-width="1.4" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 276 123 L 328 123" stroke="#446688" stroke-width="1.4" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 412 123 L 464 123" stroke="#446688" stroke-width="1.4" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <rect x="120" y="196" width="120" height="40" rx="8" fill="#d9ecd4" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="180" y="221" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">(1,2) 差 2</text>
  <rect x="256" y="196" width="120" height="40" rx="8" fill="#d9ecd4" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="316" y="221" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">(2,3) 差 2</text>
  <rect x="392" y="196" width="120" height="40" rx="8" fill="#fbe3c8" stroke="#8a2b28" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="452" y="221" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">(3,4) 差 1</text>

  <text x="60" y="268" font-size="11.5" fill="#555555" filter="url(#rough2)">(3,4) 最小，先跳；两人离开后队列合拢，1 与 2 变成相邻，继续比较。</text>
  <text x="60" y="290" font-size="11.5" fill="#555555" filter="url(#rough2)">只有"男 + 女"的相邻对才算候选；同性别相邻对永远不跳。</text>

  <rect x="60" y="304" width="640" height="26" rx="6" fill="#e8e0f5" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="72" y="322" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">注意：编号按最初排队顺序固定，两人离开后不重新编号，输出时小的编号在前。</text>
</svg>
