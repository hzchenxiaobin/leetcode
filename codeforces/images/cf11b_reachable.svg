<svg xmlns="http://www.w3.org/2000/svg" width="740" height="370" viewBox="0 0 740 370"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="740" height="370" fill="#fafafa"/>
  <text x="370" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">k 次跳跃的可达位置：同奇偶、且不超过 S_k 的一整段</text>

  <!-- 数轴 -->
  <line x1="100" y1="230" x2="690" y2="230" stroke="#2b2b2b" stroke-width="1.6" filter="url(#rough2)"/>
  <g font-size="10.5" fill="#8a8a8a" filter="url(#rough2)" text-anchor="middle">
    <text x="100" y="250">-7</text><text x="140" y="250">-6</text><text x="180" y="250">-5</text>
    <text x="220" y="250">-4</text><text x="260" y="250">-3</text><text x="300" y="250">-2</text>
    <text x="340" y="250">-1</text><text x="380" y="250">0</text><text x="420" y="250">1</text>
    <text x="460" y="250">2</text><text x="500" y="250">3</text><text x="540" y="250">4</text>
    <text x="580" y="250">5</text><text x="620" y="250">6</text><text x="660" y="250">7</text>
  </g>

  <!-- k=1 -->
  <text x="86" y="110" text-anchor="end" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">k=1, S=1</text>
  <g filter="url(#rough2)">
    <circle cx="340" cy="115" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="420" cy="115" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>

  <!-- k=2 -->
  <text x="86" y="160" text-anchor="end" font-size="11.5" fill="#2f5223" filter="url(#rough2)">k=2, S=3</text>
  <g filter="url(#rough2)">
    <circle cx="260" cy="165" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="340" cy="165" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="420" cy="165" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="500" cy="165" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>

  <!-- k=3 -->
  <text x="86" y="210" text-anchor="end" font-size="11.5" fill="#8a6015" filter="url(#rough2)">k=3, S=6</text>
  <g filter="url(#rough2)">
    <circle cx="140" cy="215" r="7" fill="#fdf3e3" stroke="#d6a040" stroke-width="1.8"/>
    <circle cx="220" cy="215" r="7" fill="#fdf3e3" stroke="#d6a040" stroke-width="1.8"/>
    <circle cx="300" cy="215" r="7" fill="#fdf3e3" stroke="#d6a040" stroke-width="1.8"/>
    <circle cx="380" cy="215" r="7" fill="#fdf3e3" stroke="#d6a040" stroke-width="1.8"/>
    <circle cx="460" cy="215" r="7" fill="#fdf3e3" stroke="#d6a040" stroke-width="1.8"/>
    <circle cx="540" cy="215" r="7" fill="#fdf3e3" stroke="#d6a040" stroke-width="1.8"/>
    <circle cx="620" cy="215" r="7" fill="#fdf3e3" stroke="#d6a040" stroke-width="1.8"/>
  </g>

  <!-- 结论卡片 -->
  <rect x="80" y="272" width="580" height="80" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="96" y="296" font-size="13" fill="#8a6015" filter="url(#rough2)">规律：R_k = { p : |p| ≤ S_k 且 p ≡ S_k (mod 2) }</text>
  <text x="96" y="318" font-size="12" fill="#8a6015" filter="url(#rough2)">每加一步，可达集合变成两段步长 2 的等差数列，恰好拼成更大的一段。</text>
  <text x="96" y="340" font-size="12" fill="#8a6015" filter="url(#rough2)">所以要判断"k 步能否到 x"，只需两个条件，不必搜索。</text>
</svg>
