<svg xmlns="http://www.w3.org/2000/svg" width="720" height="310" viewBox="0 0 720 310"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr3" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b4652a"/>
    </marker>
  </defs>
  <rect width="720" height="310" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">第 k 分钟：找出包含它的「街区时间片」</text>

  <line x1="60" y1="150" x2="632" y2="150" stroke="#2b2b2b" stroke-width="1.5" filter="url(#rough2)"/>
  <g stroke="#2b2b2b" stroke-width="1.3" filter="url(#rough2)">
    <line x1="60"  y1="144" x2="60"  y2="156"/>
    <line x1="130" y1="144" x2="130" y2="156"/>
    <line x1="200" y1="144" x2="200" y2="156"/>
    <line x1="270" y1="144" x2="270" y2="156"/>
    <line x1="480" y1="144" x2="480" y2="156"/>
    <line x1="550" y1="144" x2="550" y2="156"/>
    <line x1="620" y1="144" x2="620" y2="156"/>
  </g>
  <g font-size="12" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">
    <text x="60"  y="176">0</text><text x="130" y="176">1</text><text x="200" y="176">2</text>
    <text x="270" y="176">3</text><text x="480" y="176">6</text><text x="550" y="176">7</text>
    <text x="620" y="176">8</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="60"  y="106" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="130" y="106" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="200" y="106" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="270" y="106" width="210" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="480" y="106" width="70" height="34" fill="#fde9d9" stroke="#b4652a" stroke-width="2.2"/>
    <rect x="550" y="106" width="70" height="34" fill="#eef6ec" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <g font-size="11.5" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">
    <text x="95"  y="128">起点 1</text><text x="165" y="128">a</text><text x="235" y="128">(2,5)</text>
    <text x="375" y="128">(2,6) w = 3</text><text x="515" y="128">(2,7)</text><text x="585" y="128">(2,8)</text>
  </g>
  <line x1="480" y1="196" x2="480" y2="150" stroke="#b4652a" stroke-width="1.8" marker-end="url(#arr3)" filter="url(#rough2)"/>
  <text x="360" y="214" text-anchor="middle" font-size="12.5" fill="#b4652a" filter="url(#rough2)">k = 6 落在 (2,7) 的时间片 [6,7)，所以答案取 (2,7)</text>
  <text x="360" y="240" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">规则：取「到达时间 ≤ k」的最后一个街区；到达时间 = 出发街区代价的累加</text>

  <g filter="url(#rough2)">
    <rect x="60" y="256" width="600" height="38" rx="8" fill="#f3edf8" stroke="#7a4a9a" stroke-width="1.2"/>
  </g>
  <text x="360" y="280" text-anchor="middle" font-size="12" fill="#4a2a62" filter="url(#rough2)">样例 1（k = 12）总时间只有 5 分钟：走完整条路后一直停在终点 (2,8)</text>
</svg>
