<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="47"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="720" height="420" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2 走查：一行四格，两次交换搞定</text>
  <path d="M 140 42 Q 360 48 580 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 初始 -->
  <text x="60" y="86" font-size="12.5" fill="#555" filter="url(#rough2)">初始</text>
  <g filter="url(#rough2)">
    <rect x="130" y="64" width="60" height="54" fill="#fde8e8" stroke="#b85450" stroke-width="1.7"/>
    <rect x="190" y="64" width="60" height="54" fill="#ffffff" stroke="#888" stroke-width="1.5"/>
    <rect x="250" y="64" width="60" height="54" fill="#ffffff" stroke="#888" stroke-width="1.5"/>
    <rect x="310" y="64" width="60" height="54" fill="#fde8e8" stroke="#b85450" stroke-width="1.7"/>
  </g>
  <text x="160" y="100" text-anchor="middle" font-size="20" font-weight="bold" fill="#8c2f2b" filter="url(#rough2)">4</text>
  <text x="220" y="100" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="280" y="100" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="340" y="100" text-anchor="middle" font-size="20" font-weight="bold" fill="#8c2f2b" filter="url(#rough2)">1</text>
  <text x="390" y="88" font-size="11.5" fill="#8c2f2b" filter="url(#rough2)">第 1 格该放 1，1 在第 4 格</text>
  <text x="390" y="110" font-size="11.5" fill="#8c2f2b" filter="url(#rough2)">→ 交换 (1,1) 与 (1,4)</text>

  <!-- 第一次交换箭头 -->
  <path d="M 200 126 C 200 142 250 146 300 142" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="360" y="146" font-size="11.5" fill="#8c2f2b" filter="url(#rough2)">交换第 1、4 格</text>

  <!-- 第二步 -->
  <text x="60" y="192" font-size="12.5" fill="#555" filter="url(#rough2)">第一步后</text>
  <g filter="url(#rough2)">
    <rect x="130" y="170" width="60" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7"/>
    <rect x="190" y="170" width="60" height="54" fill="#fde8e8" stroke="#b85450" stroke-width="1.7"/>
    <rect x="250" y="170" width="60" height="54" fill="#fde8e8" stroke="#b85450" stroke-width="1.7"/>
    <rect x="310" y="170" width="60" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7"/>
  </g>
  <text x="160" y="206" text-anchor="middle" font-size="20" font-weight="bold" fill="#2f5223" filter="url(#rough2)">1</text>
  <text x="220" y="206" text-anchor="middle" font-size="20" font-weight="bold" fill="#8c2f2b" filter="url(#rough2)">3</text>
  <text x="280" y="206" text-anchor="middle" font-size="20" font-weight="bold" fill="#8c2f2b" filter="url(#rough2)">2</text>
  <text x="340" y="206" text-anchor="middle" font-size="20" font-weight="bold" fill="#2f5223" filter="url(#rough2)">4</text>
  <text x="390" y="194" font-size="11.5" fill="#8c2f2b" filter="url(#rough2)">第 2 格该放 2，2 在第 3 格</text>
  <text x="390" y="216" font-size="11.5" fill="#8c2f2b" filter="url(#rough2)">→ 交换 (1,2) 与 (1,3)</text>

  <path d="M 200 232 C 200 248 250 252 300 248" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="360" y="252" font-size="11.5" fill="#8c2f2b" filter="url(#rough2)">交换第 2、3 格</text>

  <!-- 最终 -->
  <text x="60" y="298" font-size="12.5" fill="#555" filter="url(#rough2)">最终</text>
  <g filter="url(#rough2)">
    <rect x="130" y="276" width="60" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7"/>
    <rect x="190" y="276" width="60" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7"/>
    <rect x="250" y="276" width="60" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7"/>
    <rect x="310" y="276" width="60" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7"/>
  </g>
  <text x="160" y="312" text-anchor="middle" font-size="20" font-weight="bold" fill="#2f5223" filter="url(#rough2)">1</text>
  <text x="220" y="312" text-anchor="middle" font-size="20" font-weight="bold" fill="#2f5223" filter="url(#rough2)">2</text>
  <text x="280" y="312" text-anchor="middle" font-size="20" font-weight="bold" fill="#2f5223" filter="url(#rough2)">3</text>
  <text x="340" y="312" text-anchor="middle" font-size="20" font-weight="bold" fill="#2f5223" filter="url(#rough2)">4</text>
  <text x="390" y="300" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">严格递增 ✓</text>
  <text x="390" y="320" font-size="11.5" fill="#2f5223" filter="url(#rough2)">m = 2 ≤ s = 4</text>

  <rect x="60" y="352" width="600" height="52" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="74" y="374" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">一般做法：按目标值从小到大处理，每个不在位的数都去和「它该在的格子」里的数交换</text>
  <text x="74" y="394" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">每个交换至少让一个格子永久归位，所以总次数不超过 s - 1，必定满足 m ≤ s</text>
</svg>
