<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="79"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="900" height="420" fill="#fafafa"/>
  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">把路径写成 r₁ ≤ r₂ ≤ … ≤ rₙ</text>
  <text x="450" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">rⱼ = 第 j 列被进入时的行号；剩余列的最优填法是三段常数</text>
  <g filter="url(#rough2)"><line x1="84" y1="368" x2="84" y2="76" stroke="#888888" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><line x1="84" y1="368" x2="470" y2="368" stroke="#888888" stroke-width="1.4"/></g>
  <text x="76" y="70" text-anchor="end" font-size="11" fill="#777777" filter="url(#rough2)">行</text>
  <text x="470" y="386" text-anchor="end" font-size="11" fill="#777777" filter="url(#rough2)">列 j</text>
  <g filter="url(#rough2)"><rect x="130" y="82" width="68" height="290" rx="4" fill="#f6e3c4" fill-opacity="0.38" stroke="#c9a86a" stroke-width="1.2" stroke-dasharray="5 4"/></g>
  <g filter="url(#rough2)"><rect x="198" y="82" width="136" height="290" rx="4" fill="#d7ecd0" fill-opacity="0.3" stroke="#6a9a58" stroke-width="1.2" stroke-dasharray="5 4"/></g>
  <g filter="url(#rough2)"><rect x="334" y="82" width="102" height="290" rx="4" fill="#cfe0f5" fill-opacity="0.3" stroke="#6688aa" stroke-width="1.2" stroke-dasharray="5 4"/></g>
  <g filter="url(#rough2)"><path d="M 130.0 368.0 L 164.0 368.0 L 198.0 368.0 L 232.0 232.0 L 266.0 232.0 L 300.0 232.0 L 334.0 232.0 L 368.0 130.0 L 402.0 130.0 L 436.0 130.0" fill="none" stroke="#4a7a3a" stroke-width="2.6"/></g>
  <g filter="url(#rough2)"><circle cx="130" cy="368" r="3.4" fill="#4a7a3a" fill-opacity="1" stroke="#3d6b2f" stroke-width="1.2"/></g>
  <g filter="url(#rough2)"><circle cx="164" cy="368" r="3.4" fill="#4a7a3a" fill-opacity="1" stroke="#3d6b2f" stroke-width="1.2"/></g>
  <g filter="url(#rough2)"><circle cx="198" cy="368" r="3.4" fill="#4a7a3a" fill-opacity="1" stroke="#3d6b2f" stroke-width="1.2"/></g>
  <g filter="url(#rough2)"><circle cx="232" cy="232" r="3.4" fill="#4a7a3a" fill-opacity="1" stroke="#3d6b2f" stroke-width="1.2"/></g>
  <g filter="url(#rough2)"><circle cx="266" cy="232" r="3.4" fill="#4a7a3a" fill-opacity="1" stroke="#3d6b2f" stroke-width="1.2"/></g>
  <g filter="url(#rough2)"><circle cx="300" cy="232" r="3.4" fill="#4a7a3a" fill-opacity="1" stroke="#3d6b2f" stroke-width="1.2"/></g>
  <g filter="url(#rough2)"><circle cx="334" cy="232" r="3.4" fill="#4a7a3a" fill-opacity="1" stroke="#3d6b2f" stroke-width="1.2"/></g>
  <g filter="url(#rough2)"><circle cx="368" cy="130" r="3.4" fill="#4a7a3a" fill-opacity="1" stroke="#3d6b2f" stroke-width="1.2"/></g>
  <g filter="url(#rough2)"><circle cx="402" cy="130" r="3.4" fill="#4a7a3a" fill-opacity="1" stroke="#3d6b2f" stroke-width="1.2"/></g>
  <g filter="url(#rough2)"><circle cx="436" cy="130" r="3.4" fill="#4a7a3a" fill-opacity="1" stroke="#3d6b2f" stroke-width="1.2"/></g>
  <text x="78" y="372" text-anchor="end" font-size="10.5" fill="#999999" filter="url(#rough2)">1</text>
  <text x="78" y="338" text-anchor="end" font-size="10.5" fill="#999999" filter="url(#rough2)">2</text>
  <text x="78" y="304" text-anchor="end" font-size="10.5" fill="#999999" filter="url(#rough2)">3</text>
  <text x="78" y="270" text-anchor="end" font-size="10.5" fill="#999999" filter="url(#rough2)">4</text>
  <text x="78" y="236" text-anchor="end" font-size="10.5" fill="#999999" filter="url(#rough2)">5</text>
  <text x="78" y="202" text-anchor="end" font-size="10.5" fill="#999999" filter="url(#rough2)">6</text>
  <text x="78" y="168" text-anchor="end" font-size="10.5" fill="#999999" filter="url(#rough2)">7</text>
  <text x="78" y="134" text-anchor="end" font-size="10.5" fill="#999999" filter="url(#rough2)">8</text>
  <text x="78" y="100" text-anchor="end" font-size="10.5" fill="#999999" filter="url(#rough2)">9</text>
  <g filter="url(#rough2)"><rect x="130" y="102" width="68" height="20" rx="4" fill="#ffffff" fill-opacity="0.0" stroke="none" stroke-width="0"/></g>
  <text x="135.1" y="100" text-anchor="start" font-size="11.5" fill="#8a6a2f" font-weight="bold" filter="url(#rough2)">① j ≤ a：尽量低</text>
  <text x="208.2" y="220" text-anchor="start" font-size="11.5" fill="#3d6b2f" font-weight="bold" filter="url(#rough2)">② a &lt; j ≤ A：统一取中段高度 x</text>
  <text x="340.8" y="118" text-anchor="start" font-size="11.5" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">③ j &gt; A：抬到 B 以上</text>
  <g filter="url(#rough2)"><line x1="266" y1="242" x2="266" y2="272" stroke="#b85450" stroke-width="2" marker-end="url(#arrb)"/></g>
  <g filter="url(#rough2)"><line x1="266" y1="272" x2="266" y2="298" stroke="#b85450" stroke-width="2" marker-end="url(#arrb)"/></g>
  <text x="274" y="276" text-anchor="start" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">x 可调（受非减约束 x ≥ r_p）</text>
  <text x="450" y="372" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">三段常数对所有约束同时最优：段内每列贡献相同，混合只会让四个惩罚一起变大</text>
  <text x="450" y="396" text-anchor="middle" font-size="12" fill="#3d6b2f" filter="url(#rough2)">于是「能否补完」退化成对中段高度 x 的一维区间判断 —— 贪心每步 O(1)</text>
</svg>
