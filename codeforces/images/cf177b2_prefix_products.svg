<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="20"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="440" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">倒过来看：n 除以「前缀积」，前缀积越小越好</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="40.0" y="92.0" text-anchor="start" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">n = 12，前缀积 P 与对应的 n / P</text>
  <rect x="40.0" y="108.0" width="140.0" height="62.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="110.0" y="130.0" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">P = 1</text>
  <text x="110.0" y="156.0" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold" filter="url(#rough2)">12</text>
  <rect x="210.0" y="108.0" width="140.0" height="62.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280.0" y="130.0" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">P = 2</text>
  <text x="280.0" y="156.0" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="380.0" y="108.0" width="140.0" height="62.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="450.0" y="130.0" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">P = 4</text>
  <text x="450.0" y="156.0" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="550.0" y="108.0" width="140.0" height="62.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="620.0" y="130.0" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">P = 12</text>
  <text x="620.0" y="156.0" text-anchor="middle" font-size="18" fill="#8a6015" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="40.0" y="200.0" text-anchor="start" font-size="13.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">12 + 6 + 3 + 1 = 22</text>
  <text x="40.0" y="226.0" text-anchor="start" font-size="11.5" fill="#666" filter="url(#rough2)">（P 是每一步之后的「已乘掉的因子」）</text>
  <text x="40.0" y="270.0" text-anchor="start" font-size="13" fill="#2b2b2b" filter="url(#rough2)">n = 10：1、2、10 → 10、5、1，和 16</text>
  <rect x="40.0" y="286.0" width="140.0" height="56.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="110.0" y="308.0" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">P=1</text>
  <text x="110.0" y="332.0" text-anchor="middle" font-size="17" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">10</text>
  <rect x="210.0" y="286.0" width="140.0" height="56.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="280.0" y="308.0" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">P=2</text>
  <text x="280.0" y="332.0" text-anchor="middle" font-size="17" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="380.0" y="286.0" width="140.0" height="56.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="450.0" y="308.0" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">P=10</text>
  <text x="450.0" y="332.0" text-anchor="middle" font-size="17" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="40.0" y="366.0" width="640.0" height="60.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="54.0" y="390.5" text-anchor="start" font-size="12.5" fill="#3f3420" filter="url(#rough2)">任意链的第 k 个前缀积 ≥ 前 k 个最小质因子之积</text>
</svg>
