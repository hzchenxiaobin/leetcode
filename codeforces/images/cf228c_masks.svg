<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="400" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按层递推的掩码：黑象限查前缀和，白象限查上一层</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">mask[k][i][j] 的第 p 位 = 该方块是否等于 B_p(k)</text>
  <text x="200" y="96" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">k−1 层（边长 2^{k−1}）</text>
  <g filter="url(#rough2)"><rect x="140" y="110" width="56" height="56" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="168" y="146" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">q0</text>
  <g filter="url(#rough2)"><rect x="202" y="110" width="56" height="56" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="230" y="146" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">q1</text>
  <g filter="url(#rough2)"><rect x="140" y="172" width="56" height="56" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="168" y="208" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">q2</text>
  <g filter="url(#rough2)"><rect x="202" y="172" width="56" height="56" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="230" y="208" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">q3</text>
  <text x="620" y="96" text-anchor="middle" font-size="12" fill="#a0522d" filter="url(#rough2)">k 层（边长 2^k）</text>
  <g filter="url(#rough2)"><rect x="520" y="110" width="124" height="124" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="582" y="168" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">四象限</text>
  <text x="582" y="192" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">逐 p 检查</text>
  <text x="420" y="280" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">P_q=1 → 该象限必须全黑（二维前缀和 O(1)）；P_q=0 → mask[k−1] 的第 p 位必须为 1</text>
  <text x="420" y="308" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">16 个图案 × 4 个象限 = 每块 64 次判断，O(nm log min(n,m))</text>
  <g filter="url(#rough2)"><rect x="220" y="330" width="400" height="44" rx="4" fill="#faf3ec" fill-opacity="0.85" stroke="#c8a48a" stroke-width="1.3"/></g>
  <text x="420" y="358" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3d6b2f" filter="url(#rough2)">500×500 实测约 20 ms（限 4 s）</text>
</svg>
