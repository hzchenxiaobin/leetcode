<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr75c" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="330" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">a 与 b 的公共约数 = gcd(a,b) 的约数</text>

  <!-- 两个集合示意 -->
  <ellipse cx="238" cy="130" rx="150" ry="72" fill="#eef4fb" fill-opacity="0.75" stroke="#446688"
           stroke-width="1.6" filter="url(#rough2)"/>
  <ellipse cx="470" cy="130" rx="150" ry="72" fill="#f5e6c8" fill-opacity="0.55" stroke="#c9a227"
           stroke-width="1.6" filter="url(#rough2)"/>
  <text x="140" y="76" font-size="13" fill="#33475c" filter="url(#rough2)">a 的约数</text>
  <text x="576" y="76" font-size="13" fill="#8a6015" filter="url(#rough2)">b 的约数</text>
  <text x="360" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223"
        filter="url(#rough2)">公共约数</text>
  <text x="360" y="146" text-anchor="middle" font-size="13" fill="#2f5223" filter="url(#rough2)">= g 的约数</text>

  <path d="M360 176 L360 204" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr75c)"
        filter="url(#rough2)"/>
  <text x="378" y="196" font-size="12" fill="#446688" filter="url(#rough2)">g = gcd(a, b)，只需枚举 g 的约数</text>

  <!-- 约数表 -->
  <g font-size="12.5" fill="#2b3a4a" filter="url(#rough2)">
    <text x="40" y="234">例：a = 9, b = 27 → g = 9 → 约数表</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="300" y="216" width="54" height="32" rx="5" fill="#e8f0e0" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="362" y="216" width="54" height="32" rx="5" fill="#e8f0e0" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="424" y="216" width="54" height="32" rx="5" fill="#e8f0e0" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <g font-size="14" fill="#2f5223" text-anchor="middle" filter="url(#rough2)">
    <text x="327" y="238">1</text>
    <text x="389" y="238">3</text>
    <text x="451" y="238">9</text>
  </g>
  <text x="40" y="282" font-size="12" fill="#6b6b66" filter="url(#rough2)">枚举方式：试除 i = 1..⌊√g⌋，若整除则加入 i 与 g/i（相同只加一次）</text>
  <text x="40" y="308" font-size="12" fill="#6b6b66" filter="url(#rough2)">g ≤ 10⁹ 时试除上界 31623，约数最多 1344 个</text>
</svg>
