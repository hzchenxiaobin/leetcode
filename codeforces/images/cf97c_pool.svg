<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" width="640" height="350">
<defs>
<filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="9" result="noise"/>
<feDisplacementMap in="SourceGraphic" in2="noise" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect x="0" y="0" width="640" height="350" fill="#fafafa"/>
<g font-family="Comic Sans MS, Kaiti SC, cursive">
<text x="320.0" y="24.0" font-size="15" fill="#33475b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">老兵池：每届新增「只参加过一次」的人，再被用掉 a_k 个</text>
<rect x="230.0" y="80.0" width="180.0" height="150.0" rx="12" fill="#eef4fb" stroke="#7a93a8" stroke-width="2.0" filter="url(#rough2)"/>
<text x="320.0" y="130.0" font-size="14" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">一次性选手池</text>
<text x="320.0" y="156.0" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">P_k = kn − 2S_k</text>
<text x="320.0" y="182.0" font-size="14" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">P_k ≥ a_{k+1}</text>
<line x1="140.0" y1="120.0" x2="224.0" y2="120.0" stroke="#1f6f43" stroke-width="2.2" filter="url(#rough2)"/>
<polygon points="224.0,120.0 215.0,115.5 215.0,124.5" fill="#1f6f43" filter="url(#rough2)"/>
<text x="120.0" y="108.0" font-size="12" fill="#1f6f43" text-anchor="middle" font-weight="normal" filter="url(#rough2)">n − a_k（新手）</text>
<line x1="230.0" y1="200.0" x2="150.0" y2="200.0" stroke="#c0392b" stroke-width="2.2" filter="url(#rough2)"/>
<polygon points="150.0,200.0 159.0,204.5 159.0,195.5" fill="#c0392b" filter="url(#rough2)"/>
<text x="130.0" y="222.0" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">a_{k+1}（变老兵）</text>
<line x1="320.0" y1="60.0" x2="320.0" y2="76.0" stroke="#7a93a8" stroke-width="1.8" filter="url(#rough2)"/>
<polygon points="320.0,76.0 324.5,67.0 315.5,67.0" fill="#7a93a8" filter="url(#rough2)"/>
<text x="440.0" y="110.0" font-size="13" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">约束</text>
<text x="408.0" y="136.0" font-size="13" fill="#c0392b" text-anchor="start" font-weight="normal" filter="url(#rough2)">a_{k+1} + 2S_k ≤ kn</text>
<text x="408.0" y="170.0" font-size="13" fill="#33475b" text-anchor="start" font-weight="normal" filter="url(#rough2)">P_k ≥ 0 ⇒ S_k ≤ kn/2</text>
<text x="320.0" y="268.0" font-size="13" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">逐步累加：S_{k+1} + S_k ≤ kn 且 S 单调不减 ⇒ S_K ≤ Kn/2</text>
<text x="320.0" y="296.0" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">长期平均老兵数 ē ≤ n/2 —— 这就是「每人最多两次」的宏观含义</text>
<text x="320.0" y="330.0" font-size="12" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">池子可以养大（多做 a=0 的届），所以任何平均 ē = n/2 的混合都可达</text>
</g>
</svg>
