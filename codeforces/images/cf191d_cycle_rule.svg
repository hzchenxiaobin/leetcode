<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="97"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">一个环块：附着点 ≥2 可以「打断」，≤1 只能整块成环或多花一条线</text>
  <path d="M 40 42 Q 360 48 680 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 情形 A：两个附着点 -->
  <text x="180" y="76" text-anchor="middle" font-size="13" fill="#2f5223" filter="url(#rough2)">附着点 = 2（可打断）</text>
  <g filter="url(#rough2)">
    <circle cx="110" cy="130" r="18" fill="#fff5f4" stroke="#b85450" stroke-width="2.2"/>
    <circle cx="250" cy="130" r="18" fill="#fff5f4" stroke="#b85450" stroke-width="2.2"/>
    <circle cx="180" cy="80" r="16" fill="#e8f4e0" stroke="#4a7a3a" stroke-width="1.6"/>
    <circle cx="180" cy="180" r="16" fill="#e8f4e0" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <g stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)">
    <line x1="126" y1="118" x2="166" y2="88"/>
    <line x1="194" y1="88" x2="234" y2="118"/>
    <line x1="234" y1="142" x2="194" y2="172"/>
    <line x1="166" y1="172" x2="126" y2="142"/>
  </g>
  <g stroke="#b85450" stroke-width="2" filter="url(#rough2)">
    <line x1="110" y1="112" x2="110" y2="88"/>
    <line x1="250" y1="112" x2="250" y2="88"/>
  </g>
  <text x="110" y="80" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">桥</text>
  <text x="250" y="80" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">桥</text>
  <text x="180" y="214" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">
    环被切成两条弧，各接一座桥
  </text>
  <text x="180" y="234" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">
    不需要环线，不多花线端
  </text>

  <!-- 情形 B：一个附着点 -->
  <text x="540" y="76" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">附着点 = 1（打断会露馅）</text>
  <g filter="url(#rough2)">
    <circle cx="470" cy="130" r="18" fill="#fff5f4" stroke="#b85450" stroke-width="2.2"/>
    <circle cx="610" cy="130" r="18" fill="#e8f4e0" stroke="#4a7a3a" stroke-width="1.6"/>
    <circle cx="540" cy="180" r="16" fill="#e8f4e0" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <g stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)">
    <line x1="486" y1="118" x2="596" y2="118"/>
    <line x1="606" y1="146" x2="554" y2="172"/>
    <line x1="528" y1="172" x2="476" y2="146"/>
  </g>
  <g stroke="#b85450" stroke-width="2" filter="url(#rough2)">
    <line x1="470" y1="112" x2="470" y2="88"/>
  </g>
  <text x="470" y="80" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">桥</text>
  <text x="540" y="214" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">
    弧的两端只能落在同一个点 ⇒ 不简单
  </text>
  <text x="540" y="234" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">
    要么整块成 ring（+1），要么多花一对线端（+1）
  </text>

  <!-- 公式 -->
  <g filter="url(#rough2)">
    <rect x="60" y="256" width="600" height="66" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="360" y="282" text-anchor="middle" font-size="15" fill="#22314a" filter="url(#rough2)">
    min = #odd / 2 + #{ 环块 C : C 上带桥的顶点数 a(C) ≤ 1 }
  </text>
  <text x="360" y="306" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">
    环块 = 去掉所有桥之后的非平凡连通分量（顶点 cactus 里必是简单环）
  </text>

  <!-- 样例 -->
  <g filter="url(#rough2)">
    <rect x="60" y="334" width="600" height="56" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <g font-size="12.5" fill="#2f5223" filter="url(#rough2)">
    <text x="74" y="358">样例 1（纯三角形）：#odd = 0、环的 a = 0 ⇒ min = 1，max = m = 3 ✓</text>
    <text x="74" y="380">样例 3：环 2-3-5 的 a = 3（三个点都带桥）⇒ 不额外加，min = 6/2 = 3 ✓</text>
  </g>
</svg>
