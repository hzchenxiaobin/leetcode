<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="760" height="410"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="760" height="410" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：非单点树必有一个「免费挂载点」r</text>
  <path d="M 130 42 Q 380 49 630 42" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- 左：一块 n ≥ 2 的树 -->
  <rect x="26" y="54" width="334" height="246" rx="9" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="193" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">某棵 n ≥ 2 的树，最大独立集 X</text>

  <path d="M 193 155 Q 165 185 138 212" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 193 155 Q 222 185 248 212" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <circle cx="193" cy="155" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="193" y="160" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">1</text>

  <circle cx="135" cy="215" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="135" y="220" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">2</text>
  <circle cx="251" cy="215" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="251" y="220" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">3</text>

  <text x="193" y="254" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">X = {2,3}，M = |X| = 2（绿点）</text>
  <text x="193" y="276" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">红点 1 ∉ X ⟹ 可选作挂载点 r</text>

  <path d="M 364 178 L 394 178" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- 右：挂到 r 上 -->
  <rect x="400" y="54" width="334" height="246" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="567" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">其余每棵树都挂到 r = 1 上</text>

  <path d="M 540 168 Q 512 200 483 228" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 540 168 Q 569 200 597 228" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 557 168 L 640 168" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <circle cx="540" cy="168" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="540" y="173" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">1</text>
  <circle cx="480" cy="231" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="480" y="236" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">2</text>
  <circle cx="600" cy="231" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="600" y="236" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">3</text>
  <circle cx="660" cy="168" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="660" y="173" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">T₂</text>
  <text x="600" y="156" text-anchor="middle" font-size="11" fill="#a14340" filter="url(#rough2)">新增边</text>

  <text x="567" y="262" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">r 未被选中 ⟹ 新增边不会「两端都被选」</text>
  <text x="567" y="284" text-anchor="middle" font-size="12" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">总数 = 2 + 1 = 3 = S（上界达到）</text>

  <!-- 底部：唯一例外 -->
  <rect x="26" y="316" width="708" height="76" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="342" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">唯一例外：全部是单点树时没有「免费挂载点」</text>
  <text x="44" y="366" font-size="11.5" fill="#8a6015" filter="url(#rough2)">任何 k ≥ 2 个点的树都有边，独立集装不下全部 k 个点，所以 S = k 达不到，最优恰为 k − 1（星形）。</text>
  <text x="44" y="384" font-size="11.5" fill="#b85450" filter="url(#rough2)">于是答案只有两种取值：存在 n ≥ 2 的树 → S；全是单点树 → S − 1。构造对两种情形都够用。</text>
</svg>
