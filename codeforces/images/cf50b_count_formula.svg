<svg xmlns="http://www.w3.org/2000/svg" width="740" height="400" viewBox="0 0 740 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="740" height="400" fill="#fafafa"/>
  <text x="370" y="36" font-size="20" fill="#2b2b2b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">按字符分组：每个字符 c 贡献 k_c² 对</text>
  <path d="M 150 46 Q 370 52 590 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="86" font-size="14" fill="#2f4a66" text-anchor="start" font-weight="bold" filter="url(#rough2)">例 1：great10（7 个字符各不相同）</text>
  <rect x="60" y="100" width="40" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="80.0" y="127" font-size="16" fill="#2f4a66" text-anchor="middle" font-weight="bold" filter="url(#rough2)">g</text>
  <text x="80.0" y="160" font-size="12" fill="#7a5a1b" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="100" y="100" width="40" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="120.0" y="127" font-size="16" fill="#2f4a66" text-anchor="middle" font-weight="bold" filter="url(#rough2)">r</text>
  <text x="120.0" y="160" font-size="12" fill="#7a5a1b" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="140" y="100" width="40" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="160.0" y="127" font-size="16" fill="#2f4a66" text-anchor="middle" font-weight="bold" filter="url(#rough2)">e</text>
  <text x="160.0" y="160" font-size="12" fill="#7a5a1b" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="180" y="100" width="40" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="200.0" y="127" font-size="16" fill="#2f4a66" text-anchor="middle" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="200.0" y="160" font-size="12" fill="#7a5a1b" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="220" y="100" width="40" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="240.0" y="127" font-size="16" fill="#2f4a66" text-anchor="middle" font-weight="bold" filter="url(#rough2)">t</text>
  <text x="240.0" y="160" font-size="12" fill="#7a5a1b" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="260" y="100" width="40" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280.0" y="127" font-size="16" fill="#2f4a66" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="280.0" y="160" font-size="12" fill="#7a5a1b" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="300" y="100" width="40" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="320.0" y="127" font-size="16" fill="#2f4a66" text-anchor="middle" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="320.0" y="160" font-size="12" fill="#7a5a1b" text-anchor="middle" filter="url(#rough2)">1</text>
  <text x="60" y="184" font-size="12.5" fill="#44546a" text-anchor="start" filter="url(#rough2)">k = 1 → k² = 1，共 7 个字符 ⇒ 7</text>
  <text x="60" y="232" font-size="14" fill="#2f5223" text-anchor="start" font-weight="bold" filter="url(#rough2)">例 2：aab（a 出现 2 次，b 出现 1 次）</text>
  <rect x="60" y="246" width="40" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="80.0" y="273" font-size="16" fill="#2f5223" text-anchor="middle" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="100" y="246" width="40" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="120.0" y="273" font-size="16" fill="#2f5223" text-anchor="middle" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="140" y="246" width="40" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="160.0" y="273" font-size="16" fill="#2f5223" text-anchor="middle" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="60" y="306" font-size="12.5" fill="#3c5e2e" text-anchor="start" filter="url(#rough2)">k_a = 2 → 4 对，k_b = 1 → 1 对 ⇒ 5</text>
  <rect x="400" y="96" width="300" height="118" rx="10" fill="#f2f6fb" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="420" y="128" font-size="14" fill="#2f4a66" text-anchor="start" font-weight="bold" filter="url(#rough2)">答案公式</text>
  <text x="420" y="158" font-size="20" fill="#2f4a66" text-anchor="start" font-weight="bold" filter="url(#rough2)">ans = Σ_c  k_c²</text>
  <text x="420" y="186" font-size="12" fill="#44546a" text-anchor="start" filter="url(#rough2)">c 取遍所有出现过的字符</text>
  <rect x="400" y="236" width="300" height="96" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="420" y="266" font-size="13" fill="#8a6015" text-anchor="start" font-weight="bold" filter="url(#rough2)">为什么是 k² 而不是 C(k,2)</text>
  <text x="420" y="290" font-size="12" fill="#7a5a1b" text-anchor="start" filter="url(#rough2)">有序对：i、j 各自独立地取 k 个位置</text>
  <text x="420" y="314" font-size="12" fill="#7a5a1b" text-anchor="start" filter="url(#rough2)">(i,j) 与 (j,i) 分别计数，i=j 也算</text>
  <text x="370" y="372" font-size="12.5" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">great10 → 7           aab → 5           aaaaaaaaaa → 10² = 100</text>
</svg>
