<svg xmlns="http://www.w3.org/2000/svg" width="760" height="372" viewBox="0 0 760 372"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c9801f"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a8524a"/>
    </marker>
  </defs>
  <rect width="760" height="372" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">样例走查：n = 5 的构造与因数个数</text>
  <rect x="24.0" y="58.0" width="714.0" height="32.0" rx="6" fill="#eef1f7" stroke="#2b2b2b" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="66.0" y="79.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">j</text>
  <text x="150.0" y="79.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="234.0" y="79.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="318.0" y="79.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="402.0" y="79.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="486.0" y="79.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="633.0" y="79.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">说明</text>
  <rect x="24.0" y="90.0" width="714.0" height="42.0" rx="5" fill="#f7f9fc" stroke="#9aa3b2" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="32.0" y="117.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">p(j)</text>
  <text x="150.0" y="117.0" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="234.0" y="117.0" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="318.0" y="117.0" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="402.0" y="117.0" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <text x="486.0" y="117.0" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="538.0" y="117.0" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">交换 (2,3) 与 (4,5)，1 号位不动</text>
  <rect x="24.0" y="134.0" width="714.0" height="42.0" rx="5" fill="#f4f9f2" stroke="#9aa3b2" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="32.0" y="161.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">gcd(j,p(j))</text>
  <text x="150.0" y="161.0" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="234.0" y="161.0" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="318.0" y="161.0" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="402.0" y="161.0" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="486.0" y="161.0" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="538.0" y="161.0" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">每个位置都互素</text>
  <text x="56.0" y="240.0" text-anchor="start" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">逐个检查 i：</text>
  <rect x="170.0" y="214.0" width="96.0" height="38.0" rx="8" fill="#f4f9f2" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="218.0" y="240.0" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">i = 1  ✓</text>
  <rect x="278.0" y="214.0" width="96.0" height="38.0" rx="8" fill="#fbeeee" stroke="#a8524a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="326.0" y="240.0" text-anchor="middle" font-size="13" fill="#a8524a" font-weight="bold" filter="url(#rough2)">i = 2  ✗</text>
  <rect x="386.0" y="214.0" width="96.0" height="38.0" rx="8" fill="#fbeeee" stroke="#a8524a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="434.0" y="240.0" text-anchor="middle" font-size="13" fill="#a8524a" font-weight="bold" filter="url(#rough2)">i = 3  ✗</text>
  <rect x="494.0" y="214.0" width="96.0" height="38.0" rx="8" fill="#fbeeee" stroke="#a8524a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="542.0" y="240.0" text-anchor="middle" font-size="13" fill="#a8524a" font-weight="bold" filter="url(#rough2)">i = 4  ✗</text>
  <rect x="602.0" y="214.0" width="96.0" height="38.0" rx="8" fill="#fbeeee" stroke="#a8524a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="650.0" y="240.0" text-anchor="middle" font-size="13" fill="#a8524a" font-weight="bold" filter="url(#rough2)">i = 5  ✗</text>
  <text x="56.0" y="288.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">i = 1 一定计入（1 整除一切）；i = 2..5 都找不到「j 与 p(j) 同时被 i 整除」的位置。</text>
  <rect x="34.0" y="312.0" width="692.0" height="42.0" rx="8" fill="#fdf3e3" stroke="#c9801f" stroke-width="1.5" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="48.0" y="340.0" text-anchor="start" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">所以分布的因数个数 = 1，达到理论下界；输出 1 3 2 5 4 即为一个最优排列。</text>
</svg>
