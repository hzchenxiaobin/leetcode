<svg xmlns="http://www.w3.org/2000/svg" width="700" height="290" viewBox="0 0 700 290"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="333"/>
    <feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></defs>
  <rect width="700" height="290" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">三种结局</text>
  <path d="M 200 40 Q 350 46 500 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="46" rx="8" fill="#e8f4e0" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="86" font-size="13" fill="#2f5223" filter="url(#rough2)">① 走 ≤ n 步到达 t ⇒ 答案是步数（s=t 时为 0）</text>
  <g filter="url(#rough2)"><rect x="60" y="116" width="580" height="46" rx="8" fill="#fbeeee" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="76" y="144" font-size="13" fill="#8a3a36" filter="url(#rough2)">② 走了 n 步还没到 t ⇒ t 在别的环/链上 ⇒ −1（如样例 3、4）</text>
  <g filter="url(#rough2)"><rect x="60" y="174" width="580" height="46" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="202" font-size="13" fill="#22314a" filter="url(#rough2)">③ 一开始 s=t ⇒ 0 次洗牌（题面允许 0 次）</text>
  <g filter="url(#rough2)"><rect x="60" y="236" width="580" height="40" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="262" font-size="12.5" fill="#2f5223" filter="url(#rough2)">实现：while (steps ≤ n) { if (cur==t) 输出 steps; cur=p[cur]; steps++ } 输出 −1。</text>
</svg>
