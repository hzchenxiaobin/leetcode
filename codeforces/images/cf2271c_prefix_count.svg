<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 402" width="660" height="402" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="660" height="402" fill="#fafafa"/>

  <text x="330" y="30" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：子数组异或为 0 ⟺ 两个前缀异或相等</text>
  <text x="330" y="52" text-anchor="middle" font-size="12" fill="#7a7a7a" filter="url(#rough2)">记 p0 = 0，pi = a1 ⊕ a2 ⊕ … ⊕ ai，则 a[l..r] 异或为 0 ⟺ p(l−1) = pr</text>

  <!-- 前缀格子 -->
  <g filter="url(#rough2)">
    <rect x="84" y="96" width="58" height="36" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="146" y="96" width="58" height="36" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="208" y="96" width="58" height="36" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <rect x="270" y="96" width="58" height="36" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="332" y="96" width="58" height="36" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="394" y="96" width="58" height="36" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="456" y="96" width="58" height="36" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="518" y="96" width="58" height="36" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <g font-size="16" font-weight="bold" text-anchor="middle">
    <text x="113" y="120" fill="#33517a" filter="url(#rough2)">0</text>
    <text x="175" y="120" fill="#2e6e2e" filter="url(#rough2)">2</text>
    <text x="237" y="120" fill="#33517a" filter="url(#rough2)">0</text>
    <text x="299" y="120" fill="#a0761e" filter="url(#rough2)">1</text>
    <text x="361" y="120" fill="#a0761e" filter="url(#rough2)">1</text>
    <text x="423" y="120" fill="#8d3a3a" filter="url(#rough2)">3</text>
    <text x="485" y="120" fill="#8d3a3a" filter="url(#rough2)">3</text>
    <text x="547" y="120" fill="#2e6e2e" filter="url(#rough2)">2</text>
  </g>
  <g font-size="10.5" fill="#9a9a9a" text-anchor="middle">
    <text x="113" y="148" filter="url(#rough2)">p0</text>
    <text x="175" y="148" filter="url(#rough2)">p1</text>
    <text x="237" y="148" filter="url(#rough2)">p2</text>
    <text x="299" y="148" filter="url(#rough2)">p3</text>
    <text x="361" y="148" filter="url(#rough2)">p4</text>
    <text x="423" y="148" filter="url(#rough2)">p5</text>
    <text x="485" y="148" filter="url(#rough2)">p6</text>
    <text x="547" y="148" filter="url(#rough2)">p7</text>
  </g>

  <!-- 两条弧线示意相等的两个前缀夹出一个异或为 0 的区间 -->
  <path d="M113,94 Q175,64 237,94" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="175" y="72" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">a1..a2 = 2⊕2 = 0</text>
  <path d="M299,94 Q330,72 361,94" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="76" text-anchor="middle" font-size="10.5" fill="#a0761e" filter="url(#rough2)">a4 = 0</text>

  <!-- 计数表 -->
  <g filter="url(#rough2)">
    <rect x="40" y="170" width="286" height="118" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
    <rect x="352" y="170" width="268" height="118" rx="10" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="183" y="196" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#33517a" filter="url(#rough2)">f(a) = Σv C(cv, 2)</text>
  <g font-size="11.5" text-anchor="middle" fill="#444">
    <text x="82" y="222" filter="url(#rough2)">值 v</text>
    <text x="134" y="222" filter="url(#rough2)">0</text>
    <text x="180" y="222" filter="url(#rough2)">1</text>
    <text x="226" y="222" filter="url(#rough2)">2</text>
    <text x="272" y="222" filter="url(#rough2)">3</text>
    <text x="82" y="244" filter="url(#rough2)">次数 c</text>
    <text x="134" y="244" filter="url(#rough2)">2</text>
    <text x="180" y="244" filter="url(#rough2)">2</text>
    <text x="226" y="244" filter="url(#rough2)">2</text>
    <text x="272" y="244" filter="url(#rough2)">2</text>
    <text x="82" y="262" filter="url(#rough2)">C(c,2)</text>
    <text x="134" y="262" fill="#b85450" filter="url(#rough2)">1</text>
    <text x="180" y="262" fill="#b85450" filter="url(#rough2)">1</text>
    <text x="226" y="262" fill="#b85450" filter="url(#rough2)">1</text>
    <text x="272" y="262" fill="#b85450" filter="url(#rough2)">1</text>
  </g>
  <text x="183" y="282" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">4 个值各出现 2 次 ⇒ f = 4</text>

  <text x="486" y="196" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">beauty = k − f(a)</text>
  <text x="486" y="226" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">k = Σv cv − 1，于是</text>
  <text x="486" y="252" text-anchor="middle" font-size="12.5" fill="#2e6e2e" filter="url(#rough2)">beauty = Σv g(cv) − 1</text>
  <text x="486" y="272" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">g(c) = c − C(c,2) = c(3−c)/2</text>

  <!-- g(c) 表 -->
  <g filter="url(#rough2)">
    <rect x="60" y="300" width="540" height="58" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="330" y="320" text-anchor="middle" font-size="12" fill="#a0761e" filter="url(#rough2)">每个值对 beauty 的贡献 g(c)：只有出现 1 次或 2 次才「不亏」</text>
  <g font-size="12" text-anchor="middle">
    <text x="140" y="346" fill="#4a7a3a" filter="url(#rough2)">c = 1 → g = 1</text>
    <text x="278" y="346" fill="#4a7a3a" filter="url(#rough2)">c = 2 → g = 1</text>
    <text x="416" y="346" fill="#a0761e" filter="url(#rough2)">c = 3 → g = 0</text>
    <text x="546" y="346" fill="#b85450" filter="url(#rough2)">c = 4 → g = −2</text>
  </g>
  <text x="330" y="382" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">⇒ beauty ≤ V − 1，且达到时每个前缀值恰好用 1 或 2 次</text>
</svg>
