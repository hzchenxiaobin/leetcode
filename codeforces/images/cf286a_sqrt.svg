<svg xmlns="http://www.w3.org/2000/svg" width="700" height="330" viewBox="0 0 700 330"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="361"/>
    <feDisplacementMap in="SourceGraphic" scale="1.5"/></filter></defs>
  <rect width="700" height="330" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">条件 p∘p = 反转（rev: i ↦ n+1−i）⇒ 求"平方根"</text>
  <path d="M 110 40 Q 350 46 590 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="80" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="13" fill="#22314a" filter="url(#rough2)">rev 的轮换结构：⌊n/2⌋ 个 2-轮换 (i, n+1−i)，n 为奇数时再加 1 个不动点 (n+1)/2。</text>
  <text x="76" y="106" font-size="13" fill="#22314a" filter="url(#rough2)">p² 的轮换结构：p 的 4-轮换 → 两个 2-轮换；p 的 2-轮换 → 两个不动点；p 的 1-轮换 → 1 个不动点。</text>
  <text x="76" y="130" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">所以 rev 的每个 2-轮换必须由 p 的某个 4-轮换"贡献"，而一个 4-轮换正好给出两个 2-轮换 ⇒ 2-轮换个数的必须是偶数。</text>
  <g filter="url(#rough2)"><rect x="60" y="148" width="580" height="66" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="76" y="172" font-size="13" fill="#8a6015" filter="url(#rough2)">n 偶数：2-轮换有 n/2 个 ⇒ 需要 n/2 为偶数 ⇒ n ≡ 0 (mod 4)。</text>
  <text x="76" y="194" font-size="13" fill="#8a6015" filter="url(#rough2)">n 奇数：2-轮换有 (n−1)/2 个 ⇒ 需要 (n−1)/2 偶 ⇒ n ≡ 1 (mod 4)；不动点单独用 1-轮换 ✓。</text>
  <text x="76" y="212" font-size="11.5" fill="#8a6015" filter="url(#rough2)">⇒ 不存在的情况：n ≡ 2,3 (mod 4)。</text>
  <g filter="url(#rough2)"><rect x="60" y="226" width="580" height="86" rx="8" fill="#e8f4e0" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="250" font-size="12.5" fill="#2f5222" filter="url(#rough2)">构造：把 rev 的 2-轮换两两配对 (a,b)、(c,d)，写成 4-轮换 p = (a, c, b, d)：</text>
  <text x="76" y="274" font-size="12.5" fill="#2f5222" filter="url(#rough2)">a→c→b→d→a ⇒ p²：a→b、c→d，正好是两个 2-轮换 ✓</text>
  <text x="76" y="298" font-size="12" fill="#2f5222" filter="url(#rough2)">n 为奇数时再令 p((n+1)/2) = (n+1)/2（不动点）✓</text>
</svg>
