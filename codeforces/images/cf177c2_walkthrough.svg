<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="380" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例走查：块的 size 与坏标记</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="80.0" y="92.0" text-anchor="start" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">块根</text>
  <text x="230.0" y="92.0" text-anchor="start" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">size</text>
  <text x="330.0" y="92.0" text-anchor="start" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">块内是否有讨厌边</text>
  <text x="600.0" y="92.0" text-anchor="start" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">候选答案</text>
  <rect x="70.0" y="109.0" width="580.0" height="42.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="80.0" y="136.0" text-anchor="start" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="230.0" y="136.0" text-anchor="start" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="330.0" y="136.0" text-anchor="start" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <text x="600.0" y="136.0" text-anchor="start" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="70.0" y="163.0" width="580.0" height="42.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="80.0" y="190.0" text-anchor="start" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="230.0" y="190.0" text-anchor="start" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="330.0" y="190.0" text-anchor="start" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <text x="600.0" y="190.0" text-anchor="start" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="70.0" y="217.0" width="580.0" height="42.0" fill="#fde8e8" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="80.0" y="244.0" text-anchor="start" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="230.0" y="244.0" text-anchor="start" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="330.0" y="244.0" text-anchor="start" font-size="12.5" fill="#b85450" filter="url(#rough2)">是（含 7–9）</text>
  <text x="600.0" y="244.0" text-anchor="start" font-size="13" fill="#888" font-weight="bold" filter="url(#rough2)">跳过</text>
  <rect x="70.0" y="300.0" width="580.0" height="56.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="84.0" y="325.0" text-anchor="start" font-size="13" fill="#3f3420" filter="url(#rough2)">答案 = max(3, 2) = 3，与官方输出一致</text>
</svg>
