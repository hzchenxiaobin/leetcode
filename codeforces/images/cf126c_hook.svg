<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr126c" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="470" fill="#fafafa"/>

  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">命令 (x,y) 翻转一只「钩子」：第 x 行的 x..y 段 + 第 y 列的 x..y 段</text>
  <path d="M 96 44 Q 360 52 624 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 5x5 网格，cell 44px，起点 (110,70) -->
  <g filter="url(#rough2)">
    <!-- 行 2（第 2 行） cols 2..4 -->
    <rect x="154" y="114" width="132" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <!-- 列 4 rows 2..4 -->
    <rect x="242" y="114" width="44" height="132" fill="#fdecea" stroke="#b85450" stroke-width="1.2"/>
    <!-- 交点 -->
    <rect x="242" y="114" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <g filter="url(#rough2)" stroke="#bbbbbb" fill="none" stroke-width="1">
    <rect x="110" y="70" width="220" height="220"/>
    <line x1="154" y1="70" x2="154" y2="290"/><line x1="198" y1="70" x2="198" y2="290"/>
    <line x1="242" y1="70" x2="242" y2="290"/><line x1="286" y1="70" x2="286" y2="290"/>
    <line x1="110" y1="114" x2="330" y2="114"/><line x1="110" y1="158" x2="330" y2="158"/>
    <line x1="110" y1="202" x2="330" y2="202"/><line x1="110" y1="246" x2="330" y2="246"/>
  </g>
  <g filter="url(#rough2)" font-size="11.5" fill="#666" text-anchor="middle">
    <text x="132" y="62">1</text><text x="176" y="62">2</text><text x="220" y="62">3</text>
    <text x="264" y="62">4</text><text x="308" y="62">5</text>
    <text x="96" y="98">1</text><text x="96" y="142">2</text><text x="96" y="186">3</text>
    <text x="96" y="230">4</text><text x="96" y="274">5</text>
  </g>
  <text x="176" y="142" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">行 x=2</text>
  <text x="264" y="186" text-anchor="middle" font-size="12" fill="#8b3a37" filter="url(#rough2)">列 y=4</text>
  <text x="264" y="142" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">(x,y)</text>

  <g filter="url(#rough2)">
    <rect x="380" y="70" width="310" height="100" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.3"/>
    <text x="396" y="94" font-size="13" font-weight="bold" fill="#2f4a66">两段共用角点 (x,y)</text>
    <text x="396" y="118" font-size="12.5" fill="#2b2b2b">交集的像素「至少属于一段」就算翻转，</text>
    <text x="396" y="140" font-size="12.5" fill="#2b2b2b">所以角点只翻一次，不是两次。</text>
    <text x="396" y="160" font-size="12.5" fill="#555">x = y 时两段退化成同一个格子 (x,x)。</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="380" y="190" width="310" height="120" rx="8" fill="#e9f5e6" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="396" y="214" font-size="13" font-weight="bold" fill="#2f5223">钩子的方向由 x、y 的大小决定</text>
    <text x="396" y="238" font-size="12.5" fill="#2b2b2b">x &lt; y：向右 再向下；</text>
    <text x="396" y="260" font-size="12.5" fill="#2b2b2b">x &gt; y：向左 再向上；</text>
    <text x="396" y="282" font-size="12.5" fill="#2b2b2b">x = y：只翻 (x,x) 一个格子。</text>
    <text x="396" y="302" font-size="12" fill="#555">段的范围是 [min(x,y), max(x,y)]。</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="330" width="630" height="110" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <text x="76" y="356" font-size="13.5" font-weight="bold" fill="#8a6015">关键：格子 (i,j)（i &lt; j）只被「本行右侧」与「本列上方」的命令覆盖</text>
    <text x="76" y="382" font-size="13" fill="#2b2b2b">被覆盖 ⟺ 命令是 (i, y) 且 y ≥ j，或者命令是 (x, j) 且 x ≤ i；两者交集恰好是 (i,j) 自己。</text>
    <text x="76" y="408" font-size="13" fill="#2b2b2b">于是 cell(i,j) = 行 i 的后缀异或 ⊕ 列 j 的前缀异或（去掉重复算的 (i,j) 后正好抵消）。</text>
    <text x="76" y="430" font-size="13" fill="#8a6015">这条等式把「上三角的命令」和「上三角的画面」一一对应，可以逐行反解。</text>
  </g>
</svg>
