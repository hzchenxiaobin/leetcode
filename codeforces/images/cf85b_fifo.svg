<svg xmlns="http://www.w3.org/2000/svg" width="880" height="368" viewBox="0 0 880 368"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="85"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="368" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">为什么 FIFO 最优：一次交换不会让任何人变慢</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">设 i 比 j 先到（c_i ≤ c_j），若让 j 先占窗口 i 就会更晚结束</text>
  <g filter="url(#rough2)"><line x1="110" y1="140" x2="760" y2="140" stroke="#888888" stroke-width="1.4" marker-end="url(#arrg)"/></g>
  <text x="760" y="132" text-anchor="end" font-size="11" fill="#777777" filter="url(#rough2)">时间</text>
  <g filter="url(#rough2)"><line x1="110" y1="270" x2="760" y2="270" stroke="#888888" stroke-width="1.4" marker-end="url(#arrg)"/></g>
  <text x="760" y="262" text-anchor="end" font-size="11" fill="#777777" filter="url(#rough2)">时间</text>
  <text x="96" y="120" text-anchor="end" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">方案 A（j 先）</text>
  <text x="96" y="250" text-anchor="end" font-size="11.5" fill="#3d6b2f" filter="url(#rough2)">方案 B（i 先）</text>
  <g filter="url(#rough2)"><rect x="150" y="150" width="180" height="34" rx="4" fill="#f6d9d7" fill-opacity="0.7" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="240" y="172" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">j</text>
  <g filter="url(#rough2)"><rect x="330" y="150" width="150" height="34" rx="4" fill="#d7ecd0" fill-opacity="0.7" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="405" y="172" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">i</text>
  <g filter="url(#rough2)"><rect x="150" y="280" width="150" height="34" rx="4" fill="#d7ecd0" fill-opacity="0.7" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="225" y="302" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">i</text>
  <g filter="url(#rough2)"><rect x="300" y="280" width="180" height="34" rx="4" fill="#f6d9d7" fill-opacity="0.7" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="390" y="302" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">j</text>
  <text x="150" y="196" text-anchor="start" font-size="10.5" fill="#8a2b28" filter="url(#rough2)">j 先开始</text>
  <text x="330" y="196" text-anchor="start" font-size="10.5" fill="#3d6b2f" filter="url(#rough2)">i 被推后</text>
  <text x="150" y="326" text-anchor="start" font-size="10.5" fill="#3d6b2f" filter="url(#rough2)">i 先开始</text>
  <text x="300" y="326" text-anchor="start" font-size="10.5" fill="#8a2b28" filter="url(#rough2)">j 也不会更晚（j 到达 ≥ i）</text>
  <text x="440" y="350" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">两项服务时间相同 ⇒ 交换后 i 的完成更早、j 的完成不晚，故按到达顺序贪心最优</text>
</svg>
