<svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 0 780 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1109"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="780" height="420" fill="#fafafa"/>
  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">样例 1 走查：n = 10，逐次加 i 并对 10 取模</text>

  <!-- 表头 -->
  <rect x="40" y="56" width="700" height="30" fill="#eef1f4" stroke="#7a8ca6" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="58" y="76" font-size="10.5" font-weight="bold" fill="#33445c" filter="url(#rough2)">第 i 次</text>
  <text x="150" y="76" font-size="10.5" font-weight="bold" fill="#33445c" filter="url(#rough2)">起点</text>
  <text x="250" y="76" font-size="10.5" font-weight="bold" fill="#33445c" filter="url(#rough2)">加 i</text>
  <text x="350" y="76" font-size="10.5" font-weight="bold" fill="#33445c" filter="url(#rough2)">未取模</text>
  <text x="520" y="76" font-size="10.5" font-weight="bold" fill="#33445c" filter="url(#rough2)">取模后（答案）</text>

  <rect x="40" y="86" width="700" height="26" fill="#ffffff" stroke="#d6d6d6" stroke-width="1" filter="url(#rough2)"/>
  <text x="58" y="104" font-size="10.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="150" y="104" font-size="10.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="250" y="104" font-size="10.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="350" y="104" font-size="10.5" fill="#555" filter="url(#rough2)">2</text>
  <text x="520" y="104" font-size="10.5" fill="#555" filter="url(#rough2)">2</text>

  <rect x="40" y="112" width="700" height="26" fill="#f7fbff" stroke="#d6d6d6" stroke-width="1" filter="url(#rough2)"/>
  <text x="58" y="130" font-size="10.5" fill="#555" filter="url(#rough2)">2</text>
  <text x="150" y="130" font-size="10.5" fill="#555" filter="url(#rough2)">2</text>
  <text x="250" y="130" font-size="10.5" fill="#555" filter="url(#rough2)">2</text>
  <text x="350" y="130" font-size="10.5" fill="#555" filter="url(#rough2)">4</text>
  <text x="520" y="130" font-size="10.5" fill="#555" filter="url(#rough2)">4</text>

  <rect x="40" y="138" width="700" height="26" fill="#ffffff" stroke="#d6d6d6" stroke-width="1" filter="url(#rough2)"/>
  <text x="58" y="156" font-size="10.5" fill="#555" filter="url(#rough2)">3</text>
  <text x="150" y="156" font-size="10.5" fill="#555" filter="url(#rough2)">4</text>
  <text x="250" y="156" font-size="10.5" fill="#555" filter="url(#rough2)">3</text>
  <text x="350" y="156" font-size="10.5" fill="#555" filter="url(#rough2)">7</text>
  <text x="520" y="156" font-size="10.5" fill="#555" filter="url(#rough2)">7</text>

  <rect x="40" y="164" width="700" height="26" fill="#f7fbff" stroke="#d6d6d6" stroke-width="1" filter="url(#rough2)"/>
  <text x="58" y="182" font-size="10.5" fill="#555" filter="url(#rough2)">4</text>
  <text x="150" y="182" font-size="10.5" fill="#555" filter="url(#rough2)">7</text>
  <text x="250" y="182" font-size="10.5" fill="#555" filter="url(#rough2)">4</text>
  <text x="350" y="182" font-size="10.5" fill="#8c3b37" filter="url(#rough2)">11</text>
  <text x="520" y="182" font-size="10.5" fill="#8c3b37" filter="url(#rough2)">1（绕回）</text>

  <rect x="40" y="190" width="700" height="26" fill="#ffffff" stroke="#d6d6d6" stroke-width="1" filter="url(#rough2)"/>
  <text x="58" y="208" font-size="10.5" fill="#555" filter="url(#rough2)">5</text>
  <text x="150" y="208" font-size="10.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="250" y="208" font-size="10.5" fill="#555" filter="url(#rough2)">5</text>
  <text x="350" y="208" font-size="10.5" fill="#555" filter="url(#rough2)">6</text>
  <text x="520" y="208" font-size="10.5" fill="#555" filter="url(#rough2)">6</text>

  <rect x="40" y="216" width="700" height="26" fill="#f7fbff" stroke="#d6d6d6" stroke-width="1" filter="url(#rough2)"/>
  <text x="58" y="234" font-size="10.5" fill="#555" filter="url(#rough2)">6</text>
  <text x="150" y="234" font-size="10.5" fill="#555" filter="url(#rough2)">6</text>
  <text x="250" y="234" font-size="10.5" fill="#555" filter="url(#rough2)">6</text>
  <text x="350" y="234" font-size="10.5" fill="#8c3b37" filter="url(#rough2)">12</text>
  <text x="520" y="234" font-size="10.5" fill="#8c3b37" filter="url(#rough2)">2（绕回）</text>

  <rect x="40" y="242" width="700" height="26" fill="#ffffff" stroke="#d6d6d6" stroke-width="1" filter="url(#rough2)"/>
  <text x="58" y="260" font-size="10.5" fill="#555" filter="url(#rough2)">7</text>
  <text x="150" y="260" font-size="10.5" fill="#555" filter="url(#rough2)">2</text>
  <text x="250" y="260" font-size="10.5" fill="#555" filter="url(#rough2)">7</text>
  <text x="350" y="260" font-size="10.5" fill="#555" filter="url(#rough2)">9</text>
  <text x="520" y="260" font-size="10.5" fill="#555" filter="url(#rough2)">9</text>

  <rect x="40" y="268" width="700" height="26" fill="#f7fbff" stroke="#d6d6d6" stroke-width="1" filter="url(#rough2)"/>
  <text x="58" y="286" font-size="10.5" fill="#555" filter="url(#rough2)">8</text>
  <text x="150" y="286" font-size="10.5" fill="#555" filter="url(#rough2)">9</text>
  <text x="250" y="286" font-size="10.5" fill="#555" filter="url(#rough2)">8</text>
  <text x="350" y="286" font-size="10.5" fill="#8c3b37" filter="url(#rough2)">17</text>
  <text x="520" y="286" font-size="10.5" fill="#8c3b37" filter="url(#rough2)">7（绕回）</text>

  <rect x="40" y="294" width="700" height="26" fill="#ffffff" stroke="#d6d6d6" stroke-width="1" filter="url(#rough2)"/>
  <text x="58" y="312" font-size="10.5" fill="#555" filter="url(#rough2)">9</text>
  <text x="150" y="312" font-size="10.5" fill="#555" filter="url(#rough2)">7</text>
  <text x="250" y="312" font-size="10.5" fill="#555" filter="url(#rough2)">9</text>
  <text x="350" y="312" font-size="10.5" fill="#8c3b37" filter="url(#rough2)">16</text>
  <text x="520" y="312" font-size="10.5" fill="#8c3b37" filter="url(#rough2)">6（绕回）</text>

  <rect x="40" y="336" width="700" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="56" y="362" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">答案：2 4 7 1 6 2 9 7 6　（红字是发生绕圈的行）</text>

  <text x="40" y="400" font-size="10.5" fill="#666" filter="url(#rough2)">注意第 i 次加的是 i 本身（不是 i+1）；位置从 1 开始，所以取模前后要先减 1 再加 1。</text>
</svg>
