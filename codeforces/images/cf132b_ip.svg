<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="251"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="360" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">IP 的三部分：BP 指块、DP 指方向、CP 相对 DP 偏左/右 90°</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">初始：BP = 左上角所在块，DP 向右，CP 向左</text>
  <g filter="url(#rough2)"><rect x="60" y="92" width="340" height="230" rx="6" fill="#ffffff" fill-opacity="0.35" stroke="#cccccc" stroke-width="1.4" stroke-dasharray="5 4"/></g>
  <g filter="url(#rough2)"><rect x="110" y="130" width="100" height="100" rx="3" fill="#cfe0f5" fill-opacity="0.85" stroke="#999999" stroke-width="1.4"/></g>
  <text x="160" y="192" text-anchor="middle" font-size="20" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="220" y="130" width="100" height="100" rx="3" fill="#f6e3c4" fill-opacity="0.85" stroke="#999999" stroke-width="1.4"/></g>
  <text x="270" y="192" text-anchor="middle" font-size="20" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="110" y="240" width="100" height="100" rx="3" fill="#dcecd2" fill-opacity="0.85" stroke="#999999" stroke-width="1.4"/></g>
  <text x="160" y="302" text-anchor="middle" font-size="20" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><rect x="220" y="240" width="100" height="100" rx="3" fill="#f3d9d6" fill-opacity="0.85" stroke="#999999" stroke-width="1.4"/></g>
  <text x="270" y="302" text-anchor="middle" font-size="20" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="230" y="106" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">样例 1 的 2×2 程序</text>
  <g filter="url(#rough2)"><path d="M 160 200 L 240 200" fill="none" stroke="#8a2b28" stroke-width="2.4" marker-end="url(#arr)"/></g>
  <text x="200" y="190" text-anchor="middle" font-size="11" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">DP</text>
  <g filter="url(#rough2)"><path d="M 160 200 L 160 130" fill="none" stroke="#4a7a3a" stroke-width="2.0" marker-end="url(#arr)"/></g>
  <text x="140" y="150" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">CP</text>
  <g filter="url(#rough2)"><circle cx="160" cy="180" r="12" fill="#f6e3c4" fill-opacity="0.9" stroke="#b06a1e" stroke-width="1.5"/></g>
  <text x="160" y="235" text-anchor="middle" font-size="10.5" fill="#b06a1e" filter="url(#rough2)">BP 看块</text>
  <g filter="url(#rough2)"><rect x="430" y="92" width="430" height="230" rx="6" fill="#ffffff" fill-opacity="0.35" stroke="#cccccc" stroke-width="1.4" stroke-dasharray="5 4"/></g>
  <text x="645" y="118" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">一步的规则</text>
  <text x="450" y="146" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">① 块内沿 DP 找最远的边</text>
  <text x="450" y="170" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">② 该边上沿 CP 找最远的像素</text>
  <text x="450" y="194" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">③ 从它沿 DP 再走一格：</text>
  <text x="470" y="218" text-anchor="start" font-size="11" fill="#4a7a3a" filter="url(#rough2)">落进色块 ⇒ BP = 该块（DP、CP 不变）</text>
  <text x="470" y="242" text-anchor="start" font-size="11" fill="#8a2b28" filter="url(#rough2)">黑格/界外 ⇒ BP 不动：</text>
  <text x="490" y="264" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">CP 左转右（DP 不变）</text>
  <text x="490" y="286" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">CP 右转左 且 DP 顺时针 90°</text>
  <text x="450" y="340" text-anchor="middle" font-size="12" fill="#b06a1e" filter="url(#rough2)">状态有限：(块, DP, CP) ≤ 2500×4×2 → 必有周期</text>
</svg>
