<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" width="780" height="520"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="29"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="780" height="520" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法主线：一个 while 循环走完整条 SCC 链</text>
  <path d="M 152 40 Q 390 47 628 40" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- 1 -->
  <rect x="230" y="58" width="320" height="46" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="390" y="78" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">① 读入 a、b：存在 aᵢ &gt; bᵢ ⇒ -1</text>
  <text x="390" y="96" text-anchor="middle" font-size="11.5" fill="#5b7a99" filter="url(#rough2)">出边只增，超过目标的点永远拉不回来</text>

  <!-- 2 -->
  <rect x="230" y="124" width="320" height="46" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="390" y="144" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">② start ← 最小的脏点；rem ← 脏点个数</text>
  <text x="390" y="162" text-anchor="middle" font-size="11.5" fill="#5b7a99" filter="url(#rough2)">rem = 0 ⇒ 输出「0 1」和空行</text>

  <!-- 3 -->
  <rect x="200" y="190" width="380" height="62" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="211" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">③ 站在 p：只要 a_p &lt; b_p 且目标「已归位」或「下标 ≥ p」</text>
  <text x="390" y="230" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">就 a_p++ 并输出 1（把这种目标直接跨过去）</text>
  <text x="390" y="247" text-anchor="middle" font-size="11.5" fill="#a3620f" filter="url(#rough2)">循环直到 a_p = b_p，或者目标是一个「左边还脏」的点</text>

  <!-- 4 -->
  <rect x="240" y="272" width="300" height="44" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="390" y="291" text-anchor="middle" font-size="13" fill="#3c5e2e" filter="url(#rough2)">④ 若 a_p = b_p：p 归位，rem ← rem − 1</text>
  <text x="390" y="309" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">只有「进入时 a_p &lt; b_p」才计数，避免重复</text>

  <!-- decisions -->
  <rect x="240" y="336" width="300" height="40" rx="8" fill="#f5f7fa" stroke="#8a94a0" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="390" y="361" text-anchor="middle" font-size="12.5" fill="#4a5a6a" filter="url(#rough2)">⑤ rem = 0 ？</text>
  <path d="M 540 356 L 596 356" stroke="#4a7a3a" stroke-width="1.7" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="566" y="345" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">是</text>
  <rect x="600" y="334" width="150" height="44" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="675" y="353" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">输出 o、start、</text>
  <text x="675" y="370" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">操作串，结束本组</text>

  <rect x="240" y="396" width="300" height="40" rx="8" fill="#f5f7fa" stroke="#8a94a0" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="390" y="421" text-anchor="middle" font-size="12.5" fill="#4a5a6a" filter="url(#rough2)">⑥ a_p = p ？（在 b 根上原地打转）</text>
  <path d="M 240 416 L 184 416" stroke="#b85450" stroke-width="1.7" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="212" y="405" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">是</text>
  <rect x="40" y="394" width="140" height="44" rx="9" fill="#fdecea" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="110" y="413" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">输出 -1</text>
  <text x="110" y="430" text-anchor="middle" font-size="11" fill="#a14340" filter="url(#rough2)">（真的无解）</text>

  <!-- 7 -->
  <rect x="240" y="456" width="300" height="42" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="390" y="475" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">⑦ 输出 2（沿 a_p 跳一步），p ← a_p</text>
  <text x="390" y="491" text-anchor="middle" font-size="11.5" fill="#5b7a99" filter="url(#rough2)">回到 ③ 继续处理新位置</text>

  <!-- arrows -->
  <path d="M 390 104 L 390 122" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 390 170 L 390 188" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 390 252 L 390 270" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 390 316 L 390 334" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 390 376 L 390 394" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 390 436 L 390 454" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 540 477 L 580 477 Q 600 477 600 460 L 600 230 Q 600 221 592 221" stroke="#446688" stroke-width="1.6" fill="none" stroke-dasharray="7 5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- side note left -->
  <rect x="40" y="58" width="168" height="120" rx="10" fill="#ffffff" stroke="#c9d3dd" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="124" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">为什么能跨过去？</text>
  <text x="52" y="102" font-size="11" fill="#4a5a6a" filter="url(#rough2)">归位点出边唯一（= b），</text>
  <text x="52" y="120" font-size="11" fill="#4a5a6a" filter="url(#rough2)">跳过去只会顺着 b 往上跑；</text>
  <text x="52" y="138" font-size="11" fill="#4a5a6a" filter="url(#rough2)">下标 ≥ p 的点不是下级。</text>
  <text x="52" y="160" font-size="11" fill="#a14340" filter="url(#rough2)">都不必经 a_p 过去。</text>

  <!-- side note right -->
  <rect x="584" y="58" width="176" height="144" rx="10" fill="#ffffff" stroke="#c9d3dd" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="665" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">为什么必须现在跳？</text>
  <text x="592" y="102" font-size="11" fill="#4a5a6a" filter="url(#rough2)">a_p 只增不减；一旦越过</text>
  <text x="592" y="120" font-size="11" fill="#4a5a6a" filter="url(#rough2)">还脏的 v &lt; p，就再也回不</text>
  <text x="592" y="138" font-size="11" fill="#4a5a6a" filter="url(#rough2)">到 v 这个值了，而 p 归位</text>
  <text x="592" y="156" font-size="11" fill="#4a5a6a" filter="url(#rough2)">后 a_p = b_p ≥ p &gt; v，更够</text>
  <text x="592" y="174" font-size="11" fill="#4a5a6a" filter="url(#rough2)">不到 v。</text>

  <text x="390" y="512" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">时间 O(n + o) = O(n²)，空间 O(n)；n = 1000 的最坏构造 ≈ 1.0×10⁶ 步，仍在 2n² 以内</text>
</svg>
