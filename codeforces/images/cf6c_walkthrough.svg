<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 0 780 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="97"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrJ" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="780" height="440" fill="#fafafa"/>

  <text x="390" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">样例走查：t = 2 9 8 2 7 的真实时间线（1 秒 = 26 像素）</text>

  <!-- 时间轴 -->
  <line x1="90" y1="76" x2="620" y2="76" stroke="#7a8ca6" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="90" y1="76" x2="90" y2="84" stroke="#7a8ca6" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="142" y1="76" x2="142" y2="84" stroke="#7a8ca6" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="272" y1="76" x2="272" y2="84" stroke="#7a8ca6" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="324" y1="76" x2="324" y2="84" stroke="#7a8ca6" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="376" y1="76" x2="376" y2="84" stroke="#c0392b" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="532" y1="76" x2="532" y2="84" stroke="#7a8ca6" stroke-width="1.3" filter="url(#rough2)"/>

  <text x="90" y="68" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="142" y="68" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>
  <text x="272" y="68" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">7</text>
  <text x="324" y="68" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">9</text>
  <text x="376" y="64" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b" filter="url(#rough2)">11</text>
  <text x="532" y="68" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">17</text>

  <!-- Alice 轨道 -->
  <text x="48" y="132" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">Alice</text>
  <rect x="90" y="112" width="52" height="34" fill="#cfeacf" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="142" y="112" width="234" height="34" fill="#a8d8a8" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="116" y="134" text-anchor="middle" font-size="10" fill="#204a1e" filter="url(#rough2)">1 号</text>
  <text x="259" y="134" text-anchor="middle" font-size="11" fill="#204a1e" filter="url(#rough2)">2 号（9 s，吃到 t=11）</text>

  <!-- Bob 轨道 -->
  <text x="48" y="206" font-size="12" font-weight="bold" fill="#8a4a14" filter="url(#rough2)">Bob</text>
  <rect x="90" y="186" width="182" height="34" fill="#ffd9b3" stroke="#b06a2c" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="272" y="186" width="52" height="34" fill="#ffc78f" stroke="#b06a2c" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="324" y="186" width="208" height="34" fill="#ffb870" stroke="#b06a2c" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="181" y="208" text-anchor="middle" font-size="10" fill="#6b3a10" filter="url(#rough2)">5 号（7 s）</text>
  <text x="298" y="208" text-anchor="middle" font-size="10" fill="#6b3a10" filter="url(#rough2)">4 号</text>
  <text x="428" y="208" text-anchor="middle" font-size="10" fill="#6b3a10" filter="url(#rough2)">3 号（8 s）</text>

  <!-- t=11 竖线 -->
  <line x1="376" y1="88" x2="376" y2="246" stroke="#c0392b" stroke-width="1.5"
        stroke-dasharray="5 4" filter="url(#rough2)"/>
  <circle cx="376" cy="232" r="4" fill="#c0392b" filter="url(#rough2)"/>
  <text x="384" y="252" font-size="10.5" fill="#c0392b" filter="url(#rough2)">t=11：Alice 空出来，3 号却已被 Bob 从 t=9 吃上了 → 没有可拿的</text>

  <!-- 底部结论 -->
  <rect x="40" y="272" width="700" height="70" rx="9" fill="#eef4ff" stroke="#446688"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="56" y="298" font-size="12.5" fill="#23405c" filter="url(#rough2)">双指针五轮：Alice 拿 1 号、2 号；Bob 拿 5 号、4 号、3 号。</text>
  <text x="56" y="320" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">累计：aliceTime = 2 + 9 = 11，bobTime = 7 + 2 + 8 = 17，加起来正好 28 = 全部用时</text>

  <rect x="40" y="356" width="700" height="66" rx="9" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.3" filter="url(#rough2)"/>
  <text x="56" y="380" font-size="11.5" fill="#8a6015" filter="url(#rough2)">为什么第 5 轮是 Bob 拿 3 号？因为比较的是「谁先空出来」：11 &gt; 9，Bob 早于 Alice 两秒，</text>
  <text x="56" y="402" font-size="11.5" fill="#8a6015" filter="url(#rough2)">自然先伸手。若按「前缀和首次超过总和一半」切分，28/2 = 14，前缀 2、11、19 首次超过 14 是 19，会错判成 3 2。</text>
</svg>
