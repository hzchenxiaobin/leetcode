<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="380" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="38" text-anchor="middle" font-size="18.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">48A：四个官方样例</text>
  <path d="M 137 50 Q 380 56 623 50" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="86" text-anchor="start" font-size="11.5" fill="#8a8a8a" font-weight="normal" filter="url(#rough2)">输入（F / M / S 三人的手势）</text>
  <rect x="60" y="100" width="640" height="52" rx="8" fill="#fbfbfb" stroke="#dcdcdc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="80" y="132" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">rock</text>
  <text x="200" y="132" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">rock</text>
  <text x="320" y="132" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">rock</text>
  <text x="430" y="132" text-anchor="middle" font-size="13" fill="#8a8a8a" font-weight="normal" filter="url(#rough2)">→</text>
  <text x="470" y="132" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">?</text>
  <text x="510" y="132" text-anchor="start" font-size="11" fill="#555" font-weight="normal" filter="url(#rough2)">三人相同，无人赢过两人</text>
  <rect x="60" y="162" width="640" height="52" rx="8" fill="#fbfbfb" stroke="#dcdcdc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="80" y="194" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">paper</text>
  <text x="200" y="194" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">rock</text>
  <text x="320" y="194" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">rock</text>
  <text x="430" y="194" text-anchor="middle" font-size="13" fill="#8a8a8a" font-weight="normal" filter="url(#rough2)">→</text>
  <text x="470" y="194" text-anchor="middle" font-size="15" fill="#b6483f" font-weight="bold" filter="url(#rough2)">F</text>
  <text x="510" y="194" text-anchor="start" font-size="11" fill="#555" font-weight="normal" filter="url(#rough2)">纸裹石头：F 同时赢 M、S</text>
  <rect x="60" y="224" width="640" height="52" rx="8" fill="#fbfbfb" stroke="#dcdcdc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="80" y="256" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">scissors</text>
  <text x="200" y="256" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">rock</text>
  <text x="320" y="256" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">rock</text>
  <text x="430" y="256" text-anchor="middle" font-size="13" fill="#8a8a8a" font-weight="normal" filter="url(#rough2)">→</text>
  <text x="470" y="256" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">?</text>
  <text x="510" y="256" text-anchor="start" font-size="11" fill="#555" font-weight="normal" filter="url(#rough2)">剪刀赢不了石头，M 与 S 打平</text>
  <rect x="60" y="286" width="640" height="52" rx="8" fill="#fbfbfb" stroke="#dcdcdc" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="80" y="318" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">scissors</text>
  <text x="200" y="318" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">paper</text>
  <text x="320" y="318" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">rock</text>
  <text x="430" y="318" text-anchor="middle" font-size="13" fill="#8a8a8a" font-weight="normal" filter="url(#rough2)">→</text>
  <text x="470" y="318" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">?</text>
  <text x="510" y="318" text-anchor="start" font-size="11" fill="#555" font-weight="normal" filter="url(#rough2)">F 赢 M、M 赢 S、S 赢 F —— 成环</text>
</svg>
