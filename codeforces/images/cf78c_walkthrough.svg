<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1（n=1, m=15, k=4）的判定走查</text>
  <path d="M 150 42 Q 360 48 570 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <rect x="50" y="56" width="330" height="46" rx="9" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="215" y="85" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">① n = 1 是奇数 → 不做偶数剪枝</text>

  <path d="M 215 104 L 215 122" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arrk)" filter="url(#rough2)"/>

  <rect x="50" y="126" width="330" height="46" rx="9" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="215" y="155" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">② m = 15 ≠ 1 → 有真因子可谈</text>

  <path d="M 215 174 L 215 192" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arrk)" filter="url(#rough2)"/>

  <rect x="50" y="196" width="330" height="46" rx="9" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="215" y="225" text-anchor="middle" font-size="13" fill="#2f5223" filter="url(#rough2)">③ 试除：2 不整除，3 整除 → p = 3</text>

  <path d="M 215 244 L 215 262" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arrk)" filter="url(#rough2)"/>

  <rect x="50" y="266" width="330" height="46" rx="9" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="215" y="295" text-anchor="middle" font-size="13" fill="#2f5223" filter="url(#rough2)">④ 最大真因子 15 / 3 = 5，与 k = 4 比</text>

  <path d="M 215 314 L 215 332" stroke="#4a7a3a" stroke-width="1.7" marker-end="url(#arrk)" filter="url(#rough2)"/>

  <rect x="50" y="336" width="330" height="46" rx="9" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="215" y="365" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5223" filter="url(#rough2)">⑤ 5 ≥ 4 → 输出 Timur</text>

  <rect x="410" y="126" width="270" height="120" rx="10" fill="#fbeeee" stroke="#a05a5a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="545" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#6b3030" filter="url(#rough2)">提前判 Marsel 的两种情形</text>
  <text x="545" y="180" text-anchor="middle" font-size="12.5" fill="#6b3030" filter="url(#rough2)">n 为偶数（总异或恒为 0）</text>
  <text x="545" y="204" text-anchor="middle" font-size="12.5" fill="#6b3030" filter="url(#rough2)">m = 1（没有真因子）</text>
  <text x="545" y="232" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">④ 若为否则同样 Marsel</text>

  <rect x="410" y="266" width="270" height="116" rx="10" fill="#f4f4f0" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="545" y="292" text-anchor="middle" font-size="12.5" fill="#333333" filter="url(#rough2)">为什么只看最大真因子：</text>
  <text x="545" y="316" text-anchor="middle" font-size="12.5" fill="#333333" filter="url(#rough2)">能切 ⟺ 存在真因子 ≥ k，</text>
  <text x="545" y="340" text-anchor="middle" font-size="12.5" fill="#333333" filter="url(#rough2)">而真因子里最大的就是 m / p。</text>
  <text x="545" y="366" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">所以只要求出 p 即可。</text>
</svg>
