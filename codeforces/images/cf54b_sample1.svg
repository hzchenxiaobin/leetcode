<svg xmlns="http://www.w3.org/2000/svg" width="740" height="420" viewBox="0 0 740 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="740" height="420" fill="#fafafa"/>
  <text x="370.0" y="36" font-size="20" fill="#2b2b2b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">样例 1：三对好拼图</text>
  <path d="M 133 46 Q 370 52 607 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="70" y="80" font-size="13" fill="#2f4a66" text-anchor="start" font-weight="bold" filter="url(#rough2)">(2, 1)</text>
  <text x="70" y="98" font-size="11" fill="#7a5a1b" text-anchor="start" filter="url(#rough2)">四列 AA / BB / DD / CC 互不相同</text>
  <rect x="70" y="112" width="40" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="90" y="138" font-size="12" fill="#2f4a66" text-anchor="middle" font-weight="bold" filter="url(#rough2)">AA</text>
  <rect x="116" y="112" width="40" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="136" y="138" font-size="12" fill="#2f4a66" text-anchor="middle" font-weight="bold" filter="url(#rough2)">BB</text>
  <rect x="162" y="112" width="40" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="182" y="138" font-size="12" fill="#2f4a66" text-anchor="middle" font-weight="bold" filter="url(#rough2)">DD</text>
  <rect x="208" y="112" width="40" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="228" y="138" font-size="12" fill="#2f4a66" text-anchor="middle" font-weight="bold" filter="url(#rough2)">CC</text>
  <text x="70" y="184" font-size="13" fill="#2f4a66" text-anchor="start" font-weight="bold" filter="url(#rough2)">(2, 2)</text>
  <text x="70" y="202" font-size="11" fill="#7a5a1b" text-anchor="start" filter="url(#rough2)">两块 2×2：左上 AB/AB，右侧 DC/DC</text>
  <rect x="70" y="216" width="40" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="90" y="242" font-size="12" fill="#2f4a66" text-anchor="middle" font-weight="bold" filter="url(#rough2)">AB AB</text>
  <rect x="116" y="216" width="40" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="136" y="242" font-size="12" fill="#2f4a66" text-anchor="middle" font-weight="bold" filter="url(#rough2)">DC DC</text>
  <text x="70" y="288" font-size="13" fill="#2f4a66" text-anchor="start" font-weight="bold" filter="url(#rough2)">(2, 4)</text>
  <text x="70" y="306" font-size="11" fill="#7a5a1b" text-anchor="start" filter="url(#rough2)">只有一块，必然好</text>
  <rect x="70" y="320" width="40" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="90" y="346" font-size="12" fill="#2f4a66" text-anchor="middle" font-weight="bold" filter="url(#rough2)">整张图</text>
  <rect x="420" y="96" width="260" height="150" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="438" y="122" font-size="12" fill="#8a6015" text-anchor="start" font-weight="bold" filter="url(#rough2)">为什么 (1,1)、(1,2)、(1,4) 不好？</text>
  <text x="438" y="148" font-size="11.5" fill="#7a5a1b" text-anchor="start" filter="url(#rough2)">(1,1)：字母 A、B 都出现两次</text>
  <text x="438" y="170" font-size="11.5" fill="#7a5a1b" text-anchor="start" filter="url(#rough2)">(1,2)：AB 与 DC 各出现两次</text>
  <text x="438" y="192" font-size="11.5" fill="#7a5a1b" text-anchor="start" filter="url(#rough2)">(1,4)：两行完全相同</text>
  <text x="438" y="218" font-size="12" fill="#8a6015" text-anchor="start" font-weight="bold" filter="url(#rough2)">⇒ 好拼图共 3 个</text>
  <text x="370" y="386" font-size="11.5" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">最小元素：面积 2 的 (2,1)（比 (1,2) 更小的是 X 更大的那个，题面按面积再按 X 比较）</text>
</svg>
