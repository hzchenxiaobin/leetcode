<svg xmlns="http://www.w3.org/2000/svg" width="780" height="430" viewBox="0 0 780 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="901"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="780" height="430" fill="#fafafa"/>
  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">把 (用时, 起点编号) 编码成整数键：排名就是键的升序</text>

  <!-- 时间轴 -->
  <line x1="70" y1="170" x2="700" y2="170" stroke="#7a8ca6" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="706" y="174" font-size="10" fill="#777" filter="url(#rough2)">用时</text>
  <text x="120" y="192" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">t=1</text>
  <text x="300" y="192" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">t=2</text>
  <text x="480" y="192" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">t=3</text>
  <text x="640" y="192" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">t=4</text>

  <!-- 同一时刻多人 -->
  <circle cx="120" cy="150" r="14" fill="#a8d8a8" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="155" text-anchor="middle" font-size="10" fill="#204a1e" filter="url(#rough2)">1</text>
  <circle cx="152" cy="150" r="14" fill="#dbe7fb" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="152" y="155" text-anchor="middle" font-size="10" fill="#23405c" filter="url(#rough2)">2</text>
  <circle cx="184" cy="150" r="14" fill="#ffd9b3" stroke="#b06a2c" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="184" y="155" text-anchor="middle" font-size="10" fill="#8a4a14" filter="url(#rough2)">3</text>
  <text x="120" y="128" text-anchor="middle" font-size="9" fill="#8c3b37" filter="url(#rough2)">t 相同 → 编号小的在前</text>

  <circle cx="300" cy="150" r="14" fill="#dbe7fb" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="155" text-anchor="middle" font-size="10" fill="#23405c" filter="url(#rough2)">4</text>
  <circle cx="480" cy="150" r="14" fill="#dbe7fb" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="480" y="155" text-anchor="middle" font-size="10" fill="#23405c" filter="url(#rough2)">5</text>
  <circle cx="640" cy="150" r="14" fill="#dbe7fb" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="640" y="155" text-anchor="middle" font-size="10" fill="#23405c" filter="url(#rough2)">6</text>

  <!-- 公式 -->
  <rect x="60" y="222" width="660" height="70" rx="10" fill="#eef4ff" stroke="#446688"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="76" y="250" font-size="15" font-weight="bold" fill="#23405c" filter="url(#rough2)">key(i, t) = t · (n + 1) + i</text>
  <text x="76" y="276" font-size="11" fill="#446688" filter="url(#rough2)">由于 1 ≤ i ≤ n &lt; n + 1，key 的"商"是用时、"余数"是编号，比较 key 就等于按 (用时, 编号) 字典序比较。</text>

  <!-- 示例表 -->
  <rect x="60" y="306" width="660" height="30" fill="#eef1f4" stroke="#7a8ca6" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="80" y="326" font-size="10.5" font-weight="bold" fill="#33445c" filter="url(#rough2)">运动员（n=3）</text>
  <text x="330" y="326" font-size="10.5" font-weight="bold" fill="#33445c" filter="url(#rough2)">可选用时</text>
  <text x="560" y="326" font-size="10.5" font-weight="bold" fill="#33445c" filter="url(#rough2)">键集合</text>

  <rect x="60" y="336" width="660" height="26" fill="#ffffff" stroke="#d6d6d6" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="354" font-size="10.5" fill="#555" filter="url(#rough2)">1 号</text>
  <text x="330" y="354" font-size="10.5" fill="#555" filter="url(#rough2)">{1, 2}</text>
  <text x="560" y="354" font-size="10.5" fill="#555" filter="url(#rough2)">{5, 9}</text>

  <rect x="60" y="362" width="660" height="26" fill="#f7fbff" stroke="#d6d6d6" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="380" font-size="10.5" fill="#555" filter="url(#rough2)">2 号</text>
  <text x="330" y="380" font-size="10.5" fill="#555" filter="url(#rough2)">{1}</text>
  <text x="560" y="380" font-size="10.5" fill="#555" filter="url(#rough2)">{6}</text>

  <rect x="60" y="388" width="660" height="26" fill="#ffffff" stroke="#d6d6d6" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="406" font-size="10.5" fill="#555" filter="url(#rough2)">3 号</text>
  <text x="330" y="406" font-size="10.5" fill="#555" filter="url(#rough2)">{1, 2}</text>
  <text x="560" y="406" font-size="10.5" fill="#555" filter="url(#rough2)">{7, 11}</text>
</svg>
