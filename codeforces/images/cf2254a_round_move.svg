<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="660" height="360" fill="#fafafa" filter="url(#rough2)"/>

  <text x="330" y="34" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">排序后只有两端在动：最多者给最少者 1 枚</text>
  <text x="330" y="64" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">本轮开始前（三数严格互异）</text>

  <!-- 第一行 -->
  <rect x="60" y="80" width="104" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="112" y="106" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">x = a[0]</text>
  <text x="112" y="126" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">最少</text>

  <rect x="250" y="80" width="104" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="302" y="106" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">y = a[1]</text>
  <text x="302" y="126" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">中间，不动</text>

  <rect x="440" y="80" width="104" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="492" y="106" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">z = a[2]</text>
  <text x="492" y="126" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">最多</text>

  <text x="207" y="106" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">d₁ = y − x</text>
  <text x="397" y="106" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">d₂ = z − y</text>

  <path d="M 486 146 C 420 186, 200 186, 122 148" fill="none" stroke="#b85450" stroke-width="2.2"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="302" y="200" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">z − 1，x + 1（一轮）</text>

  <!-- 第二行 -->
  <text x="330" y="232" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">下一轮开始前</text>
  <rect x="60" y="244" width="104" height="54" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="112" y="277" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">x + 1</text>
  <rect x="250" y="244" width="104" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="302" y="277" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">y</text>
  <rect x="440" y="244" width="104" height="54" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="492" y="277" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">z − 1</text>

  <text x="207" y="277" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">d₁ − 1</text>
  <text x="397" y="277" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">d₂ − 1</text>

  <text x="330" y="324" text-anchor="middle" font-size="13" fill="#444" filter="url(#rough2)">一旦 x+1 = y 或 z−1 = y 就立刻结束；否则两个间隙各减 1</text>
  <text x="330" y="350" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">答案 = min(d₁, d₂)</text>
</svg>
