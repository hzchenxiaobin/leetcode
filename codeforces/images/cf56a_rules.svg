<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2b2b2b"/>
    </marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arra" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">一位客人要不要检查？</text>
  <path d="M 200 44 Q 360 50 520 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="50" y="74" width="290" height="236" rx="0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="195" y="108" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f5223" filter="url(#rough2)">这行是年龄</text>
  <text x="72" y="156" text-anchor="start" font-size="14" fill="#2b2b2b" filter="url(#rough2)">年龄 ≥ 18</text>
  <text x="72" y="184" text-anchor="start" font-size="11.5" fill="#8a8a8a" filter="url(#rough2)">→ 已成年，喝什么都合法</text>
  <text x="300" y="156" text-anchor="end" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">不用查</text>
  <line x1="72" y1="198" x2="320" y2="198" stroke="#4a7a3a" stroke-width="1" opacity="1.0" filter="url(#rough2)"/>
  <text x="72" y="236" text-anchor="start" font-size="14" fill="#2b2b2b" filter="url(#rough2)">年龄 &lt; 18</text>
  <text x="72" y="264" text-anchor="start" font-size="11.5" fill="#8a8a8a" filter="url(#rough2)">→ 不知道喝的是不是酒</text>
  <text x="300" y="236" text-anchor="end" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">必须查</text>
  <rect x="380" y="74" width="290" height="236" rx="0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="525" y="108" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">这行是饮料</text>
  <text x="402" y="156" text-anchor="start" font-size="14" fill="#2b2b2b" filter="url(#rough2)">是酒精饮料</text>
  <text x="402" y="184" text-anchor="start" font-size="11.5" fill="#8a8a8a" filter="url(#rough2)">→ 不知道年龄是否 ≥ 18</text>
  <text x="630" y="156" text-anchor="end" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">必须查</text>
  <line x1="402" y1="198" x2="650" y2="198" stroke="#446688" stroke-width="1" opacity="1.0" filter="url(#rough2)"/>
  <text x="402" y="236" text-anchor="start" font-size="14" fill="#2b2b2b" filter="url(#rough2)">不是酒精</text>
  <text x="402" y="264" text-anchor="start" font-size="11.5" fill="#8a8a8a" filter="url(#rough2)">→ 无论几岁都合法</text>
  <text x="630" y="236" text-anchor="end" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">不用查</text>
  <rect x="120" y="336" width="480" height="62" rx="0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="374" text-anchor="middle" font-size="17" font-weight="bold" fill="#8a6015" filter="url(#rough2)">答案 = #年龄小于 18 + #饮料是酒精</text>
</svg>
