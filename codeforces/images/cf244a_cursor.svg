<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="103"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="c4" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b4652a"/>
    </marker>
  </defs>
  <rect width="720" height="290" fill="#fafafa"/>
  <text x="360" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">游标 nxt 只向右走：补号时永远取最小的未使用编号</text>

  <g filter="url(#rough2)">
    <rect x="60"  y="70" width="58" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="126" y="70" width="58" height="44" rx="6" fill="#f2f2f2" stroke="#888888" stroke-width="1.5"/>
    <rect x="192" y="70" width="58" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="258" y="70" width="58" height="44" rx="6" fill="#f2f2f2" stroke="#888888" stroke-width="1.5"/>
    <rect x="324" y="70" width="58" height="44" rx="6" fill="#f2f2f2" stroke="#888888" stroke-width="1.5"/>
    <rect x="390" y="70" width="58" height="44" rx="6" fill="#f2f2f2" stroke="#888888" stroke-width="1.5"/>
    <rect x="456" y="70" width="58" height="44" rx="6" fill="#f2f2f2" stroke="#888888" stroke-width="1.5"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">
    <text x="89" y="98">1</text><text x="155" y="98">2</text><text x="221" y="98">3</text>
    <text x="287" y="98">4</text><text x="353" y="98">5</text><text x="419" y="98">6</text>
    <text x="485" y="98">7</text>
  </g>
  <g font-size="10" text-anchor="middle" fill="#446688" filter="url(#rough2)">
    <text x="89" y="130">已占用</text><text x="221" y="130">点名 a_1</text>
  </g>
  <line x1="155" y1="150" x2="155" y2="128" stroke="#b4652a" stroke-width="1.8" marker-end="url(#c4)" filter="url(#rough2)"/>
  <text x="155" y="168" text-anchor="middle" font-size="11.5" fill="#b4652a" filter="url(#rough2)">nxt 停在这里</text>
  <text x="430" y="168" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">未被占用的号留待后面</text>

  <g filter="url(#rough2)">
    <rect x="60" y="190" width="600" height="80" rx="9" fill="#f3edf8" stroke="#7a4a9a" stroke-width="1.2"/>
  </g>
  <g font-size="11.5" fill="#4a2a62" filter="url(#rough2)">
    <text x="76" y="214" font-weight="bold">为什么不必回头：</text>
    <text x="76" y="238">每个编号只会被用一次；nxt 左边全是「已用」，右边至少还有足够多的空闲编号</text>
    <text x="76" y="260">（共 n·k 个编号、总共正好要填 n·k 个位置），所以一次线性扫描即可 O(n·k)</text>
  </g>
</svg>
