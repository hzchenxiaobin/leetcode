<svg xmlns="http://www.w3.org/2000/svg" width="780" height="428" viewBox="0 0 780 428"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="780" height="428" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">K ≥ 0（前面有 W）：两侧候选并起来仍是一个连续区间</text>
  <path d="M 118 42 Q 390 50 662 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- s 侧主区间 -->
  <rect x="118" y="94" width="444" height="38" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="2.1" filter="url(#rough2)"/>
  <text x="340" y="118" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">s 侧区间 [K+1, K+m+1]：把最后一个 W 定为 s[K]，位置 K+x+1（x = 0..m）</text>

  <!-- t 侧窗口 -->
  <rect x="150" y="156" width="110" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="205" y="152" text-anchor="middle" font-size="10.5" fill="#2f5d22" filter="url(#rough2)">L = 0 的窗口</text>

  <rect x="300" y="186" width="110" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="355" y="182" text-anchor="middle" font-size="10.5" fill="#2f5d22" filter="url(#rough2)">L = 2 的窗口</text>

  <rect x="470" y="216" width="170" height="26" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="555" y="212" text-anchor="middle" font-size="10.5" fill="#8a6015" filter="url(#rough2)">L = L_max 的窗口（最长能伸到区间外）</text>

  <text x="676" y="234" font-size="10.5" fill="#8a6015" filter="url(#rough2)">[L+K+2, L+i+1]</text>
  <text x="676" y="250" font-size="10.5" fill="#8a6015" filter="url(#rough2)">长度 w = i − K</text>

  <!-- 边界虚线 -->
  <path d="M 118 84 L 118 268" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <path d="M 562 84 L 562 268" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>

  <!-- 坐标轴 -->
  <path d="M 70 268 L 726 268" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="118" y="288" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">K+1</text>
  <text x="562" y="288" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">K+m+1</text>
  <text x="646" y="288" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">L_max+i+1</text>

  <!-- 结论 -->
  <rect x="58" y="302" width="664" height="112" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="72" y="326" font-size="12" font-weight="bold" fill="#a14340" filter="url(#rough2)">为什么一定相交：窗口起点 L+K+2 ≤ (m−1)+K+2 = K+m+1（落在主区间内），</text>
  <text x="72" y="348" font-size="12" fill="#a14340" filter="url(#rough2)">且窗口终点 L+i+1 ≥ K+2 &gt; K+1（越过主区间起点）。于是每个窗口都与主区间相交，</text>
  <text x="72" y="370" font-size="12" fill="#a14340" filter="url(#rough2)">并集就是 [K+1, max(K+m+1, L_max+i+1)]，元素个数 = max(m+1, L_max+i−K+1)。</text>
  <text x="72" y="394" font-size="11.5" fill="#a14340" filter="url(#rough2)">其中 L_max 是另一条串里最后一个 W 的下标（没有 W 时答案直接是 m+1）。</text>
</svg>
