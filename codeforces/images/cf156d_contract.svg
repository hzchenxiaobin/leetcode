<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="551"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="290" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">把连通块缩成超点，连成一棵树</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">方案数 = n^(c−2) · Π s_i</text>
  <text x="150" y="100" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">原图</text>
  <g filter="url(#rough2)"><circle cx="90" cy="140" r="16" fill="#cfe0f5" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="90" y="143.6" text-anchor="middle" font-size="10" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><circle cx="160" cy="140" r="16" fill="#cfe0f5" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="160" y="143.6" text-anchor="middle" font-size="10" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><line x1="106" y1="140" x2="144" y2="140" stroke="#446688" stroke-width="1.8"/></g>
  <g filter="url(#rough2)"><circle cx="240" cy="140" r="16" fill="#dcecd2" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="240" y="143.6" text-anchor="middle" font-size="10" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><circle cx="300" cy="140" r="16" fill="#dcecd2" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="300" y="143.6" text-anchor="middle" font-size="10" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="200" y="190" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">块：{1,4}, {2}, {3}</text>
  <text x="480" y="140" text-anchor="middle" font-size="22" fill="#666666" filter="url(#rough2)">⟹</text>
  <text x="700" y="100" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">缩点后（大小 2,1,1）</text>
  <g filter="url(#rough2)"><circle cx="640" cy="150" r="20" fill="#cfe0f5" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="640" y="153.96" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><circle cx="740" cy="120" r="14" fill="#dcecd2" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="740" y="123.24" text-anchor="middle" font-size="9" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><circle cx="740" cy="190" r="14" fill="#dcecd2" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="740" y="193.24" text-anchor="middle" font-size="9" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><line x1="655" y1="143" x2="728" y2="126" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <g filter="url(#rough2)"><line x1="655" y1="157" x2="728" y2="184" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="450" y="240" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">c = 3，n = 4 ⇒ 4^(3−2) · (2·1·1) = 8</text>
</svg>
