<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="173"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="a15earr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="760" height="440" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">一层凹槽：m 个梯形，能走进多深？</text>
  <path d="M 150 44 Q 380 50 610 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 直接返回 -->
  <path d="M 90 120 Q 380 100 670 120" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="380" y="106" text-anchor="middle" font-size="10.5" fill="#2f5223" filter="url(#rough2)">1 种：不深入，直接沿外边界返回</text>

  <!-- 梯形块 -->
  <g filter="url(#rough2)">
    <polygon points="90,170 170,170 190,240 70,240" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <polygon points="220,170 300,170 320,240 200,240" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <polygon points="350,170 430,170 450,240 330,240" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <polygon points="480,170 560,170 580,240 460,240" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="130" y="210" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">1</text>
  <text x="260" y="210" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">2</text>
  <text x="390" y="210" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">3</text>
  <text x="520" y="210" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">m</text>

  <!-- 向下箭头 -->
  <line x1="130" y1="240" x2="130" y2="272" stroke="#b85450" stroke-width="1.5" marker-end="url(#a15earr)" filter="url(#rough2)"/>
  <line x1="260" y1="240" x2="260" y2="272" stroke="#b85450" stroke-width="1.5" marker-end="url(#a15earr)" filter="url(#rough2)"/>
  <line x1="390" y1="240" x2="390" y2="272" stroke="#b85450" stroke-width="1.5" marker-end="url(#a15earr)" filter="url(#rough2)"/>
  <line x1="520" y1="240" x2="520" y2="272" stroke="#b85450" stroke-width="1.5" marker-end="url(#a15earr)" filter="url(#rough2)"/>

  <text x="130" y="292" text-anchor="middle" font-size="10" fill="#8a3b36" filter="url(#rough2)">2 种出口</text>
  <text x="260" y="292" text-anchor="middle" font-size="10" fill="#8a3b36" filter="url(#rough2)">2 种出口</text>
  <text x="390" y="292" text-anchor="middle" font-size="10" fill="#8a3b36" filter="url(#rough2)">2 种出口</text>
  <text x="520" y="292" text-anchor="middle" font-size="10" fill="#8a3b36" filter="url(#rough2)">2 种返回</text>

  <text x="520" y="160" text-anchor="middle" font-size="10" fill="#8a6015" filter="url(#rough2)">最后一个梯形</text>

  <!-- 计数公式 -->
  <rect x="70" y="318" width="620" height="96" rx="10" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90" y="344" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">恰好用到 t 个梯形：2 个出口 × … × 2 个出口 × 2 种返回 = 2^(t+1) 种</text>
  <text x="90" y="370" font-size="12" fill="#555" filter="url(#rough2)">总方案数 T(m) = 1 + 2² + 2³ + … + 2^(m+1) = 2^(m+2) − 3</text>
  <text x="90" y="396" font-size="12" fill="#2f5223" filter="url(#rough2)">第 j 层最多深入 j−2 个梯形 ⇒ 这一层的因子是 2^j − 3。</text>
</svg>
