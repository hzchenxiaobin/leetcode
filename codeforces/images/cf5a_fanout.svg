<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="300" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">一条 Send：给每个在线者各发一份 l 字节</text>
  <path d="M 170 42 Q 380 48 590 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <rect x="60" y="96" width="206" height="84" rx="10" fill="#fff8e1" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="72" y="124" font-size="10.5" fill="#8a6015" filter="url(#rough2)">server 收到一行</text>
  <text x="72" y="148" font-size="17" fill="#b85450"
        font-family="'Courier New',monospace" filter="url(#rough2)">Kate:hi</text>
  <text x="72" y="170" font-size="12" fill="#8a6015" filter="url(#rough2)">正文 l = 2 字节</text>

  <path d="M 270 126 Q 350 110 414 118" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 270 152 Q 350 200 414 202" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <text x="348" y="106" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">+2 字节</text>
  <text x="348" y="228" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">+2 字节</text>

  <rect x="420" y="96" width="150" height="50" rx="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="495" y="127" text-anchor="middle" font-size="14" fill="#2f5223" filter="url(#rough2)">Mike</text>
  <rect x="420" y="178" width="150" height="50" rx="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="495" y="209" text-anchor="middle" font-size="14" fill="#2f5223" filter="url(#rough2)">Kate</text>

  <text x="590" y="126" font-size="11" fill="#555" filter="url(#rough2)">在线成员，各收一份</text>
  <text x="590" y="208" font-size="11" fill="#555" filter="url(#rough2)">发送者本人也算在内</text>

  <rect x="420" y="244" width="286" height="42" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="432" y="271" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">本条流量 = l × k = 2 × 2 = 4</text>

  <text x="60" y="256" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">k = 当前在线人数；</text>
  <text x="60" y="278" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">Add/Remove 只改 k，不发字节</text>
</svg>
