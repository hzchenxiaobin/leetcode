<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 448"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="660" height="448" fill="#fafafa" filter="url(#rough2)"/>

  <text x="330" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    两个条件 = 两条 ±1 游走：g 看前缀里的 1，f 看前缀里的 3
  </text>
  <text x="330" y="50" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">
    样例 1：a = [2, 1, 1, 3, 3, 1, 2, 3]；遇 1 让 g 上升、遇 3 让 f 上升，其余一律下降
  </text>

  <g font-size="14" fill="#333" text-anchor="middle">
    <rect x="108" y="62" width="54" height="36" rx="4" fill="#e8f0fe" stroke="#446688"
          stroke-width="1.5" filter="url(#rough2)"/>
    <text x="135" y="86" filter="url(#rough2)">2</text>
    <rect x="173" y="62" width="54" height="36" rx="4" fill="#e8f0fe" stroke="#446688"
          stroke-width="1.5" filter="url(#rough2)"/>
    <text x="200" y="86" filter="url(#rough2)">1</text>
    <rect x="238" y="62" width="54" height="36" rx="4" fill="#e8f0fe" stroke="#446688"
          stroke-width="1.5" filter="url(#rough2)"/>
    <text x="265" y="86" filter="url(#rough2)">1</text>
    <rect x="303" y="62" width="54" height="36" rx="4" fill="#e8f0fe" stroke="#446688"
          stroke-width="1.5" filter="url(#rough2)"/>
    <text x="330" y="86" filter="url(#rough2)">3</text>
    <rect x="368" y="62" width="54" height="36" rx="4" fill="#e8f0fe" stroke="#446688"
          stroke-width="1.5" filter="url(#rough2)"/>
    <text x="395" y="86" filter="url(#rough2)">3</text>
    <rect x="433" y="62" width="54" height="36" rx="4" fill="#e8f0fe" stroke="#446688"
          stroke-width="1.5" filter="url(#rough2)"/>
    <text x="460" y="86" filter="url(#rough2)">1</text>
    <rect x="498" y="62" width="54" height="36" rx="4" fill="#e8f0fe" stroke="#446688"
          stroke-width="1.5" filter="url(#rough2)"/>
    <text x="525" y="86" filter="url(#rough2)">2</text>
    <rect x="563" y="62" width="54" height="36" rx="4" fill="#e8f0fe" stroke="#446688"
          stroke-width="1.5" filter="url(#rough2)"/>
    <text x="590" y="86" filter="url(#rough2)">3</text>
  </g>

  <g font-size="11" fill="#666" text-anchor="middle">
    <text x="70" y="118" filter="url(#rough2)">i=0</text>
    <text x="135" y="118" filter="url(#rough2)">1</text>
    <text x="200" y="118" filter="url(#rough2)">2</text>
    <text x="265" y="118" filter="url(#rough2)">3</text>
    <text x="330" y="118" filter="url(#rough2)">4</text>
    <text x="395" y="118" filter="url(#rough2)">5</text>
    <text x="460" y="118" filter="url(#rough2)">6</text>
    <text x="525" y="118" filter="url(#rough2)">7</text>
    <text x="590" y="118" filter="url(#rough2)">8</text>
  </g>

  <path d="M 58 215 L 622 215" stroke="#bbb" stroke-width="1.2" fill="none"
        stroke-dasharray="7 6" filter="url(#rough2)"/>
  <text x="46" y="219" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">0</text>

  <polyline points="70,215 135,241 200,215 265,189 330,215 395,241 460,215 525,241 590,267"
            fill="none" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <g fill="#4a7a3a" filter="url(#rough2)">
    <circle cx="70" cy="215" r="4"/>
    <circle cx="135" cy="241" r="4"/>
    <circle cx="200" cy="215" r="4"/>
    <circle cx="265" cy="189" r="4"/>
    <circle cx="330" cy="215" r="4"/>
    <circle cx="395" cy="241" r="4"/>
    <circle cx="460" cy="215" r="4"/>
    <circle cx="525" cy="241" r="4"/>
    <circle cx="590" cy="267" r="4"/>
  </g>

  <polyline points="70,215 135,241 200,267 265,293 330,267 395,241 460,267 525,293 590,267"
            fill="none" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <g fill="#d6a040" filter="url(#rough2)">
    <circle cx="70" cy="215" r="4"/>
    <circle cx="135" cy="241" r="4"/>
    <circle cx="200" cy="267" r="4"/>
    <circle cx="265" cy="293" r="4"/>
    <circle cx="330" cy="267" r="4"/>
    <circle cx="395" cy="241" r="4"/>
    <circle cx="460" cy="267" r="4"/>
    <circle cx="525" cy="293" r="4"/>
    <circle cx="590" cy="267" r="4"/>
  </g>

  <circle cx="460" cy="267" r="10" fill="none" stroke="#b85450" stroke-width="2"
          filter="url(#rough2)"/>
  <path d="M 468 271 L 519 289" stroke="#b85450" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="498" y="313" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">f_7 ≤ f_6 ⇒ 中段合法</text>

  <path d="M 265 176 L 265 190" stroke="#4a7a3a" stroke-width="1.6" fill="none"
        marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="300" y="170" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">g_3 = 1 ≥ 0：左段合法</text>

  <g font-size="11.5" fill="#333" filter="url(#rough2)">
    <circle cx="66" cy="338" r="5" fill="#4a7a3a"/>
    <text x="78" y="342">绿线 g_i = 2·pref1_i − i：遇 1 加 1，遇 2/3 减 1</text>
    <circle cx="66" cy="362" r="5" fill="#d6a040"/>
    <text x="78" y="366">橙线 f_i = 2·pref3_i − i：遇 3 加 1，遇 1/2 减 1</text>
  </g>

  <rect x="42" y="374" width="576" height="64" rx="10" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="394" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    左段 a[1..i] 合法 ⟺ g_i ≥ 0；右段只要非空，没有条件
  </text>
  <text x="330" y="412" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    中段 a[i+1..j] 合法 ⟺ f_j ≤ f_i，即窗口 [i+1, n−1] 里 f 的最小值 ≤ f_i
  </text>
  <text x="330" y="430" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">
    只需找一对 1 ≤ i &lt; j ≤ n−1（于是 i ≤ n−2）满足上面两条
  </text>
</svg>
