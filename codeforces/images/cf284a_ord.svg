<svg xmlns="http://www.w3.org/2000/svg" width="700" height="400" viewBox="0 0 700 400"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="131"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="700" height="400" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">原根 = 阶恰好为 p−1 的元（模 p 乘法群里生成整个群）</text>
  <path d="M 100 40 Q 350 46 600 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="60" y="62" width="580" height="96" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="76" y="86" font-size="13" fill="#22314a" filter="url(#rough2)">模 p 的乘法群 (Z/pZ)* 是 p−1 阶循环群，同构于 Z/(p−1)Z。</text>
  <text x="76" y="110" font-size="13" fill="#22314a" filter="url(#rough2)">x 的阶 ord(x) 必然是 p−1 的因子；x 是原根 ⟺ ord(x)=p−1。</text>
  <text x="76" y="134" font-size="13" fill="#22314a" filter="url(#rough2)">在循环群 Z/(p−1)Z 中，元素 k 的阶是 (p−1)/gcd(k,p−1) ⇒ 阶满 ⟺ gcd(k,p−1)=1。</text>
  <g filter="url(#rough2)">
    <rect x="60" y="170" width="580" height="76" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="76" y="194" font-size="13" fill="#8a6015" filter="url(#rough2)">所以原根的个数 = 与 p−1 互素的 1..p−1 的个数 = φ(p−1)。</text>
  <text x="76" y="218" font-size="12" fill="#8a6015" filter="url(#rough2)">只需对 p−1 试除分解，再套 φ(n)=n·Π(1−1/q)（q 取 n 的素因子）。</text>
  <text x="76" y="238" font-size="12" fill="#8a6015" filter="url(#rough2)">p &lt; 2000 ⇒ 试除到 √1999 ≈ 45 就够，几乎零成本。</text>
  <g filter="url(#rough2)">
    <rect x="60" y="258" width="580" height="120" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <text x="76" y="282" font-size="13" fill="#2f5223" filter="url(#rough2)">例：p = 13，p−1 = 12 = 2²·3 ⇒ φ(12) = 12·(1/2)·(2/3) = 4。</text>
  <text x="76" y="306" font-size="13" fill="#2f5223" filter="url(#rough2)">真的原根：2, 6, 7, 11 —— 恰好 4 个（逐个验 2⁶=64≡12≠1，2⁴=16≡3≠1…）。</text>
  <text x="76" y="330" font-size="12" fill="#2f5223" filter="url(#rough2)">例：p = 5，p−1 = 4 ⇒ φ(4) = 2，原根是 2 和 3。</text>
  <text x="76" y="352" font-size="12" fill="#2f5223" filter="url(#rough2)">例：p = 3，p−1 = 2 ⇒ φ(2) = 1，原根是 2。</text>
  <text x="76" y="370" font-size="11.5" fill="#556" filter="url(#rough2)">（题面样例：p=3 → 1，p=5 → 2，与公式一致。）</text>
</svg>
