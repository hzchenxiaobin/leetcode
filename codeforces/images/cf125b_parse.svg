<svg xmlns="http://www.w3.org/2000/svg" width="884" height="360" viewBox="0 0 884 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="125"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/></marker>
  </defs>
  <rect width="884" height="360" fill="#fafafa"/>
  <text x="442" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">从左到右扫标签：开标签先打印再加深，闭标签先回退再打印</text>
  <text x="442" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">每个标签独占一行，缩进 2·深度</text>
  <text x="120" y="110" text-anchor="start" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">&lt;a&gt;</text>
  <text x="260" y="110" text-anchor="start" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">深度 0 → 缩进 0 空格</text>
  <g filter="url(#rough2)"><rect x="100" y="94" width="420" height="24" rx="3" fill="#cfe0f5" fill-opacity="0.35" stroke="#8899aa" stroke-width="1.0"/></g>
  <text x="120" y="144" text-anchor="start" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">&lt;b&gt;</text>
  <text x="260" y="144" text-anchor="start" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">深度 1 → 缩进 2 空格</text>
  <g filter="url(#rough2)"><rect x="100" y="128" width="420" height="24" rx="3" fill="#cfe0f5" fill-opacity="0.35" stroke="#8899aa" stroke-width="1.0"/></g>
  <text x="120" y="178" text-anchor="start" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">&lt;c&gt;</text>
  <text x="260" y="178" text-anchor="start" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">深度 2 → 缩进 4 空格</text>
  <g filter="url(#rough2)"><rect x="100" y="162" width="420" height="24" rx="3" fill="#cfe0f5" fill-opacity="0.35" stroke="#8899aa" stroke-width="1.0"/></g>
  <text x="120" y="212" text-anchor="start" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">&lt;/c&gt;</text>
  <text x="260" y="212" text-anchor="start" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">深度 2 → 缩进 4 空格</text>
  <g filter="url(#rough2)"><rect x="100" y="196" width="420" height="24" rx="3" fill="#f6e3c4" fill-opacity="0.35" stroke="#8899aa" stroke-width="1.0"/></g>
  <text x="120" y="246" text-anchor="start" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">&lt;/b&gt;</text>
  <text x="260" y="246" text-anchor="start" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">深度 1 → 缩进 2 空格</text>
  <g filter="url(#rough2)"><rect x="100" y="230" width="420" height="24" rx="3" fill="#f6e3c4" fill-opacity="0.35" stroke="#8899aa" stroke-width="1.0"/></g>
  <text x="120" y="280" text-anchor="start" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">&lt;/a&gt;</text>
  <text x="260" y="280" text-anchor="start" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">深度 0 → 缩进 0 空格</text>
  <g filter="url(#rough2)"><rect x="100" y="264" width="420" height="24" rx="3" fill="#f6e3c4" fill-opacity="0.35" stroke="#8899aa" stroke-width="1.0"/></g>
  <text x="600" y="150" text-anchor="start" font-size="11" fill="#3d6b2f" filter="url(#rough2)">开标签：先输出，再 depth++</text>
  <text x="600" y="180" text-anchor="start" font-size="11" fill="#8a2b28" filter="url(#rough2)">闭标签：先 depth--，再输出</text>
  <text x="600" y="214" text-anchor="start" font-size="11" fill="#555555" filter="url(#rough2)">题面保证没有自闭合标签</text>
  <text x="442" y="330" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">字符串长 ≤ 1000，O(长度)</text>
</svg>
