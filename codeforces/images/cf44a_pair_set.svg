<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="420" fill="#fafafa"/>

  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">把每片叶子插入集合：重复的插入不改变大小</text>
  <path d="M 120 44 Q 360 50 600 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 左侧：按到达顺序的叶子 -->
  <rect x="24" y="62" width="272" height="286" rx="12" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">按到达顺序的 5 片叶子</text>

  <g filter="url(#rough2)" font-size="12.5" fill="#2b2b2b">
    <circle cx="48" cy="118" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="48" y="122" text-anchor="middle" font-size="11" fill="#2f4a66">1</text>
    <text x="68" y="123">(birch, yellow)</text>

    <circle cx="48" cy="158" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="48" y="162" text-anchor="middle" font-size="11" fill="#2f4a66">2</text>
    <text x="68" y="163">(maple, red)</text>

    <circle cx="48" cy="198" r="11" fill="#fdecea" stroke="#b85450" stroke-width="1.2"/>
    <text x="48" y="202" text-anchor="middle" font-size="11" fill="#8f3a34">3</text>
    <text x="68" y="203" fill="#8f3a34">(birch, yellow)</text>
    <line x1="66" y1="199" x2="188" y2="199" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3"/>

    <circle cx="48" cy="238" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="48" y="242" text-anchor="middle" font-size="11" fill="#2f4a66">4</text>
    <text x="68" y="243">(maple, yellow)</text>

    <circle cx="48" cy="278" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="48" y="282" text-anchor="middle" font-size="11" fill="#2f4a66">5</text>
    <text x="68" y="283">(maple, green)</text>
  </g>
  <text x="160" y="322" text-anchor="middle" font-size="11" fill="#8f3a34" filter="url(#rough2)">第 3 片与第 1 片完全相同 → 拒收</text>

  <!-- 中间箭头 -->
  <g filter="url(#rough2)">
    <path d="M 300 118 L 420 118" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#ag)"/>
    <path d="M 300 158 L 420 158" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#ag)"/>
    <path d="M 300 198 L 372 198" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#ar)"/>
    <path d="M 300 238 L 420 238" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#ag)"/>
    <path d="M 300 278 L 420 278" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#ag)"/>
    <path d="M 366 184 L 390 212 M 390 184 L 366 212" stroke="#b85450" stroke-width="2.2" fill="none"/>
  </g>

  <!-- 右侧：集合 -->
  <rect x="424" y="62" width="272" height="286" rx="12" fill="#f3f7ee" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="560" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">集合 S（自动去重）</text>

  <g filter="url(#rough2)" font-size="12.5" fill="#2b2b2b">
    <rect x="440" y="102" width="240" height="30" rx="7" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="452" y="122">(birch, yellow)</text>

    <rect x="440" y="142" width="240" height="30" rx="7" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="452" y="162">(maple, red)</text>

    <rect x="440" y="182" width="240" height="30" rx="7" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="452" y="202">(maple, yellow)</text>

    <rect x="440" y="222" width="240" height="30" rx="7" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="452" y="242">(maple, green)</text>
  </g>
  <text x="560" y="288" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5223" filter="url(#rough2)">|S| = 4 = 答案</text>
  <text x="560" y="312" text-anchor="middle" font-size="11" fill="#3c5e2e" filter="url(#rough2)">第 3 片的插入被集合吞掉</text>

  <text x="360" y="380" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">解 = 不同 (树种, 颜色) 二元组的个数；顺序与出现次数都不影响结果</text>
  <text x="360" y="402" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">注意第 2 片与第 4 片「树种相同、颜色不同」，它们是两个不同的二元组</text>
</svg>
