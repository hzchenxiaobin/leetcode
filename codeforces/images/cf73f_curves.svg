<svg xmlns="http://www.w3.org/2000/svg" width="720" height="392" viewBox="0 0 720 392"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>

  <rect width="720" height="392" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">f(s)=s/δ(s) 的两种形状：最大值在端点或在切段内的驻点</text>
  <path d="M 110 40 Q 360 46 610 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 左图：单调 -->
  <text x="60" y="76" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">① δ 单调 ⇒ f 单调（最大值在 s=L）</text>
  <line x1="70" y1="250" x2="330" y2="250" stroke="#555" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="70" y1="250" x2="70" y2="96" stroke="#555" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 70 250 Q 180 240 250 170 Q 290 138 320 112" stroke="#446688" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <circle cx="320" cy="112" r="5.5" fill="#b85450"/>
  </g>
  <text x="300" y="100" text-anchor="end" font-size="11" fill="#8a2b28" filter="url(#rough2)">f(L)=L/δ(L)</text>
  <text x="200" y="272" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">s →</text>
  <text x="58" y="120" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">f</text>
  <text x="150" y="236" font-size="11" fill="#2f4a66" filter="url(#rough2)">s 增大时 δ 减小 ⇒ f 递增</text>

  <!-- 右图：先增后减的 δ -->
  <text x="400" y="76" font-size="12.5" font-weight="bold" fill="#7a4a8a" filter="url(#rough2)">② δ 先增后减 ⇒ f 可能"增—减—增"</text>
  <line x1="410" y1="250" x2="680" y2="250" stroke="#555" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="410" y1="250" x2="410" y2="96" stroke="#555" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 410 250 Q 460 232 500 190 Q 520 174 560 186 Q 600 200 640 168 Q 660 150 676 140"
        stroke="#7a4a8a" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <circle cx="500" cy="190" r="5.5" fill="#b85450"/>
    <circle cx="560" cy="186" r="4.5" fill="#4a7a3a"/>
    <circle cx="676" cy="140" r="5.5" fill="#b85450"/>
  </g>
  <text x="496" y="178" text-anchor="middle" font-size="10.5" fill="#8a2b28" filter="url(#rough2)">驻点 s₁</text>
  <text x="560" y="206" text-anchor="middle" font-size="10.5" fill="#2f5223" filter="url(#rough2)">切点 s_anti（δ=π）</text>
  <text x="676" y="128" text-anchor="middle" font-size="10.5" fill="#8a2b28" filter="url(#rough2)">s=L</text>
  <text x="540" y="272" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">s →</text>
  <text x="400" y="120" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">f</text>
  <text x="430" y="238" font-size="10.5" fill="#7a4a8a" filter="url(#rough2)">三分会误收敛到局部极大</text>

  <!-- 说明 -->
  <rect x="60" y="292" width="600" height="86" rx="10" fill="#f4f0fa" stroke="#7a4a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="314" font-size="12.5" font-weight="bold" fill="#5a3a6a" filter="url(#rough2)">候选点法：按 s₀（垂足）与 s_anti（δ 的最大点）把 [0,L] 切段</text>
  <text x="76" y="336" font-size="11.5" fill="#5a3a6a" filter="url(#rough2)">每段上 δ 单调（δ' 定符号）、且 g = δ − s·δ' 也单调 ⇒ 段内至多一个驻点，二分求出</text>
  <text x="76" y="356" font-size="11.5" fill="#5a3a6a" filter="url(#rough2)">取 {切点} ∪ {各段驻点} 处 f 的最大值 ⇒ V = w·max f（结构完备，无需单峰假设）</text>
  <text x="76" y="374" font-size="11" fill="#5a3a6a" filter="url(#rough2)">g' 的符号只由 s−s₀ 决定：这就是"切在垂足"的原因</text>
</svg>
