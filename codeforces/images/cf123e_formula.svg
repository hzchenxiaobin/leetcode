<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="179"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="330" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">把双重求和压成一次树遍历</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">E = (n−1) − Σ_t q_t [ (n−1) − Σ_{u∈N(t)} sz(t→u)·Q(t→u) ]</text>
  <g filter="url(#rough2)"><rect x="60" y="84" width="780" height="96" rx="6" fill="#cfe0f5" fill-opacity="0.45" stroke="#446688" stroke-width="1.4"/></g>
  <text x="450" y="112" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">E[count | s,t] = d + Σᵢ ( sub(vᵢ) − 1 − sub(vᵢ₊₁) ) = (n−1) − sub_s(t)</text>
  <text x="450" y="140" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">路径边 d 次；侧子树以 1/2 概率被探索、每次 2×边数 ⇒ 期望正好是「子树边数」</text>
  <text x="450" y="164" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">望远镜求和后 d 被消掉，只剩「s 为根时 t 的子树边数」</text>
  <text x="450" y="210" text-anchor="middle" font-size="12" fill="#b06a1e" filter="url(#rough2)">对 s、t 加权平均，再把 sub_s(t) 按「删掉 t 后 c 所在的分量」展开：</text>
  <text x="450" y="240" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">sz(t→u) = 该分量的点数，Q(t→u) = 该分量内 q 之和</text>
  <text x="450" y="270" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">以 1 为根：儿子方向 sz = sub[u]、Q = sx[u]；父亲方向 sz = n−sub[t]、Q = 1−sx[t]</text>
  <text x="450" y="304" text-anchor="middle" font-size="12" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">一次 DFS 求出 sub 与 sx，再扫一遍所有点及其邻居 ⇒ O(n)</text>
</svg>
