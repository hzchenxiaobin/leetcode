<svg xmlns="http://www.w3.org/2000/svg" width="790" height="430" viewBox="0 0 790 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="790" height="430" fill="#fafafa"/>
  <text x="395.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">G2 单次查询的流程：先建小串拿基值，再用矩阵幂跨过 10^18</text>
  <path d="M 133.39000000000016 46 Q 395.0 52 656.6099999999999 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="50.0" y="62.0" width="690.0" height="50.0" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="66.0" y="93.0" text-anchor="start" font-size="11.4" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">① 长度表 len_i：1, 1, 2, 3, 5, …（超过 4×10^18 就封顶）</text>
  <path d="M 395.0 113.0 L 395.0 126.0" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="50.0" y="126.0" width="690.0" height="50.0" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="66.0" y="157.0" text-anchor="start" font-size="11.4" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">② i0 = 第一个 len_i ≥ L−1 的下标，M = i0 + 3</text>
  <path d="M 395.0 177.0 L 395.0 190.0" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="50.0" y="190.0" width="690.0" height="50.0" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="66.0" y="221.0" text-anchor="start" font-size="11.4" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">③ 建 f_1 … f_{M+1}（长度 ≤ 8L），KMP 跑出 ans[1..M+1]</text>
  <path d="M 395.0 241.0 L 395.0 254.0" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="50.0" y="254.0" width="690.0" height="50.0" rx="9" fill="#fff3d6" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="66.0" y="285.0" text-anchor="start" font-size="11.4" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">④ cpar[M&amp;1] = ans[M]−ans[M−1]−ans[M−2]，另一个用 M+1 同理</text>
  <path d="M 395.0 305.0 L 395.0 318.0" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="50.0" y="318.0" width="690.0" height="50.0" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="66.0" y="349.0" text-anchor="start" font-size="11.4" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">⑤ k ≤ M+1 直接输出；否则 B^{(k−M)/2} 求出 ans_{M+2q}，奇余数再补一步</text>
  <rect x="50.0" y="388.0" width="690.0" height="46.0" rx="9" fill="#fdf0ef" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="64.0" y="416.0" text-anchor="start" font-size="11.2" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">每篇的区别：G1 的 k ≤ 3000，第 ⑤ 步直接 for 循环；G2 的 k 到 10^18，必须换成快速幂。</text>
</svg>
