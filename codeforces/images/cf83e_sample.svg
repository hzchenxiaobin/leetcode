<svg xmlns="http://www.w3.org/2000/svg" width="864" height="404" viewBox="0 0 864 404"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="83"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="864" height="404" fill="#fafafa"/>
  <text x="432" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2：000,111,110,001 分成两段</text>
  <text x="432" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">b = {000, 001} → f = 0001；c = {111, 110} → f = 1110；S = 4 + 4 = 8</text>
  <g filter="url(#rough2)"><rect x="120" y="110" width="120" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.7" stroke="#8899aa" stroke-width="1.4"/></g>
  <text x="180" y="139" text-anchor="middle" font-size="17" fill="#2b2b2b" filter="url(#rough2)">000</text>
  <text x="180" y="102" text-anchor="middle" font-size="11" fill="#777777" filter="url(#rough2)">a1</text>
  <g filter="url(#rough2)"><rect x="290" y="110" width="120" height="44" rx="4" fill="#cfe0f5" fill-opacity="0.7" stroke="#8899aa" stroke-width="1.4"/></g>
  <text x="350" y="139" text-anchor="middle" font-size="17" fill="#2b2b2b" filter="url(#rough2)">111</text>
  <text x="350" y="102" text-anchor="middle" font-size="11" fill="#777777" filter="url(#rough2)">a2</text>
  <g filter="url(#rough2)"><rect x="460" y="110" width="120" height="44" rx="4" fill="#cfe0f5" fill-opacity="0.7" stroke="#8899aa" stroke-width="1.4"/></g>
  <text x="520" y="139" text-anchor="middle" font-size="17" fill="#2b2b2b" filter="url(#rough2)">110</text>
  <text x="520" y="102" text-anchor="middle" font-size="11" fill="#777777" filter="url(#rough2)">a3</text>
  <g filter="url(#rough2)"><rect x="630" y="110" width="120" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.7" stroke="#8899aa" stroke-width="1.4"/></g>
  <text x="690" y="139" text-anchor="middle" font-size="17" fill="#2b2b2b" filter="url(#rough2)">001</text>
  <text x="690" y="102" text-anchor="middle" font-size="11" fill="#777777" filter="url(#rough2)">a4</text>
  <text x="430" y="186" text-anchor="middle" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">b（下标 1、4）：f(000,001) = 0001，长度 4</text>
  <text x="430" y="212" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">c（下标 2、3）：f(111,110) = 1110，长度 4</text>
  <text x="430" y="244" text-anchor="middle" font-size="12" fill="#8a2b28" filter="url(#rough2)">S = 4 + 4 = 8（两个子序列都非空，各贡献一个 L 的“底”加相邻拼接代价）</text>
  <text x="430" y="280" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">对比：全放一起 f(000,111,110,001)：代价 3 + 3 + 3 = 9，长度 12；分成两段只要 8</text>
</svg>
