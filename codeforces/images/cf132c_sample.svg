<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="233"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="280" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">样例 2：FFFTFFF、n = 2 → 6</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">把第 1 条 F 改成 T、第 4 条 T 改成 F，得到 TFFFFFF</text>
  <g filter="url(#rough2)"><rect x="60" y="96" width="780" height="42" rx="5" fill="#ffffff" fill-opacity="0.4" stroke="#bbbbbb" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><rect x="90" y="100" width="60" height="34" rx="4" fill="#f3d9d6" fill-opacity="0.85" stroke="#8a2b28" stroke-width="1.7"/></g>
  <text x="120" y="123" text-anchor="middle" font-size="15" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">F</text>
  <g filter="url(#rough2)"><rect x="198" y="100" width="60" height="34" rx="4" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.1"/></g>
  <text x="228" y="123" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">F</text>
  <g filter="url(#rough2)"><rect x="306" y="100" width="60" height="34" rx="4" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.1"/></g>
  <text x="336" y="123" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">F</text>
  <g filter="url(#rough2)"><rect x="414" y="100" width="60" height="34" rx="4" fill="#f3d9d6" fill-opacity="0.85" stroke="#8a2b28" stroke-width="1.7"/></g>
  <text x="444" y="123" text-anchor="middle" font-size="15" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">T</text>
  <g filter="url(#rough2)"><rect x="522" y="100" width="60" height="34" rx="4" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.1"/></g>
  <text x="552" y="123" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">F</text>
  <g filter="url(#rough2)"><rect x="630" y="100" width="60" height="34" rx="4" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.1"/></g>
  <text x="660" y="123" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">F</text>
  <g filter="url(#rough2)"><rect x="738" y="100" width="60" height="34" rx="4" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.1"/></g>
  <text x="768" y="123" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">F</text>
  <text x="450" y="168" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">T F F F F F F</text>
  <text x="450" y="196" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">掉头（方向变负）后连续前进 6 步 ⇒ 位置 −6，距离 6</text>
  <text x="450" y="232" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">样例 1：FT、n = 1 → 改 T 为 F 得 FF，距离 2</text>
  <text x="450" y="258" text-anchor="middle" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">要点：多余的修改必须两两配对用掉（奇偶约束）</text>
</svg>
