<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="820" height="400" fill="#fafafa"/>
  <text x="410" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：并查集维护「同 x / 同 y」的连通块</text>
  <text x="410" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">初始 c = n，每成功合并一次 c 减 1，最后输出 c − 1</text>
  <g filter="url(#rough2)"><rect x="40" y="95" width="150" height="62" rx="4" fill="#f6f0dd" fill-opacity="0.85" stroke="#8899aa" stroke-width="1.3"/></g>
  <text x="115" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">读入 n 个点</text>
  <text x="115" y="140" text-anchor="middle" font-size="13" fill="#555555" filter="url(#rough2)">c ← n</text>
  <g filter="url(#rough2)"><rect x="240" y="95" width="190" height="62" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#8899aa" stroke-width="1.3"/></g>
  <text x="335" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">枚举点对 i &lt; j</text>
  <text x="335" y="140" text-anchor="middle" font-size="12" fill="#3d6b2f" filter="url(#rough2)">x_i = x_j 或 y_i = y_j ?</text>
  <g filter="url(#rough2)"><rect x="480" y="78" width="180" height="96" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#8899aa" stroke-width="1.3"/></g>
  <text x="570" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">find(i) ≠ find(j)</text>
  <text x="570" y="130" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">→ 合并两块</text>
  <text x="570" y="152" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">c ← c − 1</text>
  <g filter="url(#rough2)"><rect x="690" y="95" width="92" height="62" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#8899aa" stroke-width="1.3"/></g>
  <text x="736" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">输出</text>
  <text x="736" y="142" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">c − 1</text>
  <g filter="url(#rough2)"><line x1="190" y1="126" x2="240" y2="126" stroke="#8899aa" stroke-width="1.4" marker-end="url(#arrb)"/></g>
  <g filter="url(#rough2)"><line x1="430" y1="126" x2="480" y2="126" stroke="#8899aa" stroke-width="1.4" marker-end="url(#arrb)"/></g>
  <g filter="url(#rough2)"><line x1="660" y1="126" x2="690" y2="126" stroke="#8899aa" stroke-width="1.4" marker-end="url(#arrb)"/></g>
  <g filter="url(#rough2)"><line x1="570" y1="174" x2="570" y2="210" stroke="#8899aa" stroke-width="1.2" stroke-dasharray="4 4"/></g>
  <text x="570" y="232" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">否则跳过（同一块或坐标都不同）</text>
  <g filter="url(#rough2)"><rect x="60" y="268" width="700" height="100" rx="4" fill="#faf3ec" fill-opacity="0.85" stroke="#c8a48a" stroke-width="1.3"/></g>
  <text x="410" y="294" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a4b2a" filter="url(#rough2)">正确性依据</text>
  <text x="410" y="318" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">同 x 的雪堆两两可达、同 y 的雪堆两两可达，传递闭包就是并查集的等价类；</text>
  <text x="410" y="340" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">按任意顺序合并同一批边，最终划分唯一，因此枚举顺序不影响答案。</text>
  <text x="410" y="362" text-anchor="middle" font-size="12" fill="#3d6b2f" filter="url(#rough2)">复杂度 O(n² α(n))，空间 O(n)</text>
</svg>
