<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text x="300" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">先做全部行操作、再做全部列操作，并留一列不碰</text>
  <text x="300" y="50" text-anchor="middle" font-size="11" fill="#888">格子内容 = 行、列两条“最后操作”里较晚的那条；没被列写过的那一列可以保留行值</text>

  <g filter="url(#rough2)" font-size="12" text-anchor="middle" fill="#666">
    <text x="188" y="84">列值 1</text>
    <text x="264" y="84">列值 2</text>
    <text x="340" y="84">列值 3</text>
    <text x="416" y="84" fill="#8a6a20" font-weight="bold">空列</text>
  </g>

  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="150" y="92" width="76" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <text x="188" y="121" fill="#3a4a66">1</text>
    <rect x="226" y="92" width="76" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <text x="264" y="121" fill="#3a4a66">2</text>
    <rect x="302" y="92" width="76" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <text x="340" y="121" fill="#3a4a66">3</text>
    <rect x="378" y="92" width="76" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="5"/>
    <text x="416" y="121" fill="#8a6a20" font-weight="bold">5</text>

    <rect x="150" y="138" width="76" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <text x="188" y="167" fill="#3a4a66">1</text>
    <rect x="226" y="138" width="76" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <text x="264" y="167" fill="#3a4a66">2</text>
    <rect x="302" y="138" width="76" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <text x="340" y="167" fill="#3a4a66">3</text>
    <rect x="378" y="138" width="76" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="5"/>
    <text x="416" y="167" fill="#8a6a20" font-weight="bold">6</text>

    <rect x="150" y="184" width="76" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <text x="188" y="213" fill="#3a4a66">1</text>
    <rect x="226" y="184" width="76" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <text x="264" y="213" fill="#3a4a66">2</text>
    <rect x="302" y="184" width="76" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5"/>
    <text x="340" y="213" fill="#3a4a66">3</text>
    <rect x="378" y="184" width="76" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="5"/>
    <text x="416" y="213" fill="#8a6a20" font-weight="bold">7</text>
  </g>

  <g filter="url(#rough2)" font-size="12" text-anchor="end" fill="#4a7a3a">
    <text x="136" y="121">行值 5</text>
    <text x="136" y="167">行值 6</text>
    <text x="136" y="213">行值 7</text>
  </g>

  <rect x="58" y="244" width="484" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="300" y="269" text-anchor="middle" font-size="11.5" fill="#3a4a66">列操作排在最后，所以前三列的每一格都被列值覆盖：1、2、3 各自现身一次</text>

  <rect x="58" y="292" width="484" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="317" text-anchor="middle" font-size="11.5" fill="#8a6a20">第 4 列从未被列写过，保留每行的最后值 → 行的 5、6、7 全部露出来</text>

  <text x="300" y="368" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">cost = 1 + 2 + 3 + 5 + 6 + 7 = 24（两组值互不吞并）</text>
</svg>
