<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <filter id="rough3" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="2.2"/>
    </filter>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>

  <text x="360" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">样例 3 · 颜色 1：终端 1,3,5，m=3，s=4，k=2 ⇒ R=3</text>

  <!-- 路径 1..6 -->
  <text x="26" y="72" font-size="12" fill="#446688" filter="url(#rough2)">链 1-2-3-4-5-6（颜色 1 2 1 2 1 2）</text>
  <path d="M90 104 L590 104" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <circle cx="90" cy="104" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="90" y="109" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="190" cy="104" r="13" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="190" y="109" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <circle cx="290" cy="104" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="290" y="109" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <circle cx="390" cy="104" r="13" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="390" y="109" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <circle cx="490" cy="104" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="490" y="109" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <circle cx="590" cy="104" r="13" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="590" y="109" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>

  <!-- 虚树弧线 -->
  <path d="M96 130 Q190 156 284 130" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="7 4" filter="url(#rough3)"/>
  <text x="190" y="152" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">压缩边：L=2, a=2</text>
  <path d="M296 130 Q390 156 484 130" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="7 4" filter="url(#rough3)"/>
  <text x="390" y="152" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">压缩边：L=2, a=1</text>

  <!-- 表头 -->
  <text x="60" y="196" font-size="13" fill="#446688" filter="url(#rough2)">顶 t</text>
  <text x="150" y="196" font-size="13" fill="#446688" filter="url(#rough2)">被翻转的压缩边</text>
  <text x="352" y="196" font-size="13" fill="#446688" filter="url(#rough2)">当前割权多重集</text>
  <text x="536" y="196" font-size="13" fill="#446688" filter="url(#rough2)">最小 3 个之和</text>
  <path d="M44 206 L680 206" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- 行 1 -->
  <text x="70" y="240" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="150" y="240" font-size="13" fill="#333" filter="url(#rough2)">无</text>
  <text x="352" y="240" font-size="13" fill="#333" filter="url(#rough2)">{2, 2, 1, 1}</text>
  <text x="556" y="240" font-size="13" fill="#333" filter="url(#rough2)">1+1+2 = 4</text>

  <!-- 行 2 -->
  <rect x="40" y="252" width="642" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="70" y="275" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="150" y="275" font-size="13" fill="#333" filter="url(#rough2)">1−3（L=2 份）</text>
  <text x="352" y="275" font-size="13" fill="#333" filter="url(#rough2)">{1, 1, 1, 1}</text>
  <text x="556" y="275" font-size="13" fill="#4a7a3a" filter="url(#rough2)">1+1+1 = 3 ← 最优</text>

  <!-- 行 3 -->
  <text x="70" y="312" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="150" y="312" font-size="13" fill="#333" filter="url(#rough2)">1−3 与 3−5</text>
  <text x="352" y="312" font-size="13" fill="#333" filter="url(#rough2)">{1, 1, 2, 2}</text>
  <text x="556" y="312" font-size="13" fill="#333" filter="url(#rough2)">1+1+2 = 4</text>

  <rect x="40" y="336" width="642" height="44" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="364" font-size="13" fill="#333" filter="url(#rough2)">答案 = min{4, 3, 4} = 3，与官方输出一致；同法得颜色 2 的答案为 2</text>
</svg>
