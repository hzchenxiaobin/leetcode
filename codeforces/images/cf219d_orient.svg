<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="400" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">代价的定义：指向根的边必须反转</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">以 r 为首都，每条边都要"背离 r"；箭头指向 r 的边数就是代价</text>
  <g filter="url(#rough2)"><circle cx="420" cy="200" r="17" fill="#f6e3c4" fill-opacity="0.9" stroke="#a0522d" stroke-width="1.8"/></g>
  <text x="420" y="205" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">r</text>
  <g filter="url(#rough2)"><circle cx="300" cy="130" r="14" fill="#e8eef4" fill-opacity="0.9" stroke="#8899aa" stroke-width="1.8"/></g>
  <text x="300" y="135" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">a</text>
  <g filter="url(#rough2)"><line x1="420" y1="200" x2="300" y2="130" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)"/></g>
  <text x="300" y="104" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">背离</text>
  <g filter="url(#rough2)"><circle cx="540" cy="130" r="14" fill="#e8eef4" fill-opacity="0.9" stroke="#8899aa" stroke-width="1.8"/></g>
  <text x="540" y="135" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">b</text>
  <g filter="url(#rough2)"><line x1="420" y1="200" x2="540" y2="130" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)"/></g>
  <text x="540" y="104" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">背离</text>
  <g filter="url(#rough2)"><circle cx="300" cy="270" r="14" fill="#e8eef4" fill-opacity="0.9" stroke="#8899aa" stroke-width="1.8"/></g>
  <text x="300" y="275" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">c</text>
  <g filter="url(#rough2)"><line x1="300" y1="270" x2="420" y2="200" stroke="#a0522d" stroke-width="1.6" marker-end="url(#arrr)"/></g>
  <text x="300" y="304" text-anchor="middle" font-size="11.5" fill="#a0522d" filter="url(#rough2)">指向 → 要反转</text>
  <g filter="url(#rough2)"><circle cx="540" cy="270" r="14" fill="#e8eef4" fill-opacity="0.9" stroke="#8899aa" stroke-width="1.8"/></g>
  <text x="540" y="275" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">d</text>
  <g filter="url(#rough2)"><line x1="420" y1="200" x2="540" y2="270" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)"/></g>
  <text x="540" y="244" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">背离</text>
  <text x="420" y="330" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">答案就是"指向根"的箭头条数：这里为 1</text>
  <text x="420" y="358" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">换根到某个邻居时，只有连接它们的这条边的箭头方向要求翻转</text>
  <text x="420" y="382" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">（树中路径唯一，所以"背离根"是充要条件，不需要考虑绕路）</text>
</svg>
