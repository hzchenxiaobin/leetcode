<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 560"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="560" fill="#fafafa" filter="url(#rough2)"/>

  <text x="290" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">
    一遍扫描：边加前缀和，边和 i(i+1)/2 比
  </text>

  <rect x="160" y="52" width="260" height="40" rx="8" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="78" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    读入 n 与 a_1 … a_n
  </text>

  <path d="M 290 92 L 290 114" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="114" width="280" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="134" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    pref = 0　ok = true　i = 1
  </text>
  <text x="290" y="151" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">
    pref 只累加，绝不需要回退
  </text>

  <path d="M 290 158 L 290 188" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="290,192 400,232 290,272 180,232" fill="#fff8e1" stroke="#d6a040"
           stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="238" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">
    i ≤ n ?
  </text>

  <path d="M 290 272 L 290 296" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="303" y="288" text-anchor="start" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="150" y="296" width="280" height="56" rx="8" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="318" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    pref += a_i
  </text>
  <text x="290" y="337" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">
    pref &lt; i(i+1)/2 时把 ok 置 false
  </text>

  <path d="M 290 352 L 290 376" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="210" y="376" width="160" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="400" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    i = i + 1
  </text>

  <path d="M 370 395 L 520 395 L 520 232 L 408 232" stroke="#446688" stroke-width="1.8"
        fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="530" y="316" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">
    回到循环
  </text>

  <path d="M 180 232 L 60 232 L 60 476 L 146 476" stroke="#b85450" stroke-width="1.8"
        fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="74" y="224" text-anchor="start" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="150" y="452" width="300" height="48" rx="8" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="474" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">
    输出 ok ? "YES" : "NO"
  </text>
  <text x="300" y="492" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">
    单组 O(n)，多测总计 O(Σn)
  </text>

  <text x="290" y="528" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">
    注意：无论 ok 是否已经为 false，剩下的 a_i 都要读进来，否则下一组会错位
  </text>
</svg>
