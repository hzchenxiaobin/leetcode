<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 404"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="660" height="404" fill="#fafafa" filter="url(#rough2)"/>

  <text x="330" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    样例 1 的官方切分：i = 4、j = 7，两个条件各自结算
  </text>
  <text x="330" y="50" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">
    左段看「1 够不够一半」，中段看「3 够不够一半」，右段只要非空
  </text>

  <g font-size="15" fill="#333" text-anchor="middle">
    <rect x="101" y="62" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688"
          stroke-width="1.6" filter="url(#rough2)"/>
    <text x="129" y="87" filter="url(#rough2)">2</text>
    <rect x="165" y="62" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688"
          stroke-width="1.6" filter="url(#rough2)"/>
    <text x="193" y="87" filter="url(#rough2)">1</text>
    <rect x="229" y="62" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688"
          stroke-width="1.6" filter="url(#rough2)"/>
    <text x="257" y="87" filter="url(#rough2)">1</text>
    <rect x="293" y="62" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688"
          stroke-width="1.6" filter="url(#rough2)"/>
    <text x="321" y="87" filter="url(#rough2)">3</text>
    <rect x="357" y="62" width="56" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a"
          stroke-width="1.6" filter="url(#rough2)"/>
    <text x="385" y="87" filter="url(#rough2)">3</text>
    <rect x="421" y="62" width="56" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a"
          stroke-width="1.6" filter="url(#rough2)"/>
    <text x="449" y="87" filter="url(#rough2)">1</text>
    <rect x="485" y="62" width="56" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a"
          stroke-width="1.6" filter="url(#rough2)"/>
    <text x="513" y="87" filter="url(#rough2)">2</text>
    <rect x="549" y="62" width="56" height="38" rx="4" fill="#fce4ec" stroke="#b85450"
          stroke-width="1.6" filter="url(#rough2)"/>
    <text x="577" y="87" filter="url(#rough2)">3</text>
  </g>

  <g font-size="10" fill="#888" text-anchor="middle">
    <text x="129" y="116" filter="url(#rough2)">1</text>
    <text x="193" y="116" filter="url(#rough2)">2</text>
    <text x="257" y="116" filter="url(#rough2)">3</text>
    <text x="321" y="116" filter="url(#rough2)">4</text>
    <text x="385" y="116" filter="url(#rough2)">5</text>
    <text x="449" y="116" filter="url(#rough2)">6</text>
    <text x="513" y="116" filter="url(#rough2)">7</text>
    <text x="577" y="116" filter="url(#rough2)">8</text>
  </g>

  <text x="92" y="143" text-anchor="end" font-size="12" fill="#d6a040" filter="url(#rough2)">f_i</text>
  <g font-size="13" fill="#333" text-anchor="middle">
    <rect x="101" y="124" width="56" height="28" rx="4" fill="#fff8e1" stroke="#d6a040"
          stroke-width="1.4" filter="url(#rough2)"/>
    <text x="129" y="143" filter="url(#rough2)">−1</text>
    <rect x="165" y="124" width="56" height="28" rx="4" fill="#fff8e1" stroke="#d6a040"
          stroke-width="1.4" filter="url(#rough2)"/>
    <text x="193" y="143" filter="url(#rough2)">−2</text>
    <rect x="229" y="124" width="56" height="28" rx="4" fill="#fff8e1" stroke="#d6a040"
          stroke-width="1.4" filter="url(#rough2)"/>
    <text x="257" y="143" filter="url(#rough2)">−3</text>
    <rect x="293" y="124" width="56" height="28" rx="4" fill="#fff8e1" stroke="#b85450"
          stroke-width="2.4" filter="url(#rough2)"/>
    <text x="321" y="143" filter="url(#rough2)">−2</text>
    <rect x="357" y="124" width="56" height="28" rx="4" fill="#fff8e1" stroke="#d6a040"
          stroke-width="1.4" filter="url(#rough2)"/>
    <text x="385" y="143" filter="url(#rough2)">−1</text>
    <rect x="421" y="124" width="56" height="28" rx="4" fill="#fff8e1" stroke="#d6a040"
          stroke-width="1.4" filter="url(#rough2)"/>
    <text x="449" y="143" filter="url(#rough2)">−2</text>
    <rect x="485" y="124" width="56" height="28" rx="4" fill="#fff8e1" stroke="#b85450"
          stroke-width="2.4" filter="url(#rough2)"/>
    <text x="513" y="143" filter="url(#rough2)">−3</text>
    <rect x="549" y="124" width="56" height="28" rx="4" fill="#fff8e1" stroke="#d6a040"
          stroke-width="1.4" filter="url(#rough2)"/>
    <text x="577" y="143" filter="url(#rough2)">−2</text>
  </g>

  <path d="M 101 158 L 349 158" stroke="#446688" stroke-width="1.6" fill="none"
        marker-start="url(#arrb)" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 357 158 L 541 158" stroke="#4a7a3a" stroke-width="1.6" fill="none"
        marker-start="url(#arrg)" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 549 158 L 605 158" stroke="#b85450" stroke-width="1.6" fill="none"
        marker-start="url(#arrp)" marker-end="url(#arrp)" filter="url(#rough2)"/>
  <text x="225" y="178" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">左段（i = 4）</text>
  <text x="449" y="178" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">中段（j = 7）</text>
  <text x="577" y="178" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">右段</text>

  <rect x="34" y="192" width="288" height="92" rx="10" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="178" y="213" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">左段 [1..4]：1 的个数 ≥ 其余</text>
  <text x="178" y="233" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1 有 2 个，2/3 也有 2 个</text>
  <text x="178" y="253" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">g_4 = 2·pref1_4 − 4 = 0 ≥ 0 ✓</text>
  <text x="178" y="273" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">正好一半，取等号也合法</text>

  <rect x="338" y="192" width="288" height="92" rx="10" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="482" y="213" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">中段 [5..7]：3 的个数 ≤ 一半</text>
  <text x="482" y="233" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">段内只有 1 个 3（长度 3）</text>
  <text x="482" y="253" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">f_7 − f_4 = −3 − (−2) = −1 ≤ 0 ✓</text>
  <text x="482" y="273" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">等价于 f_7 = −3 ≤ f_4 = −2</text>

  <rect x="34" y="298" width="592" height="58" rx="10" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="319" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">
    中段长度不固定：只要窗口 [i+1, n−1] 里存在 j 使 f_j ≤ f_i，就说明「某个中段」满足条件
  </text>
  <text x="330" y="340" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">
    于是定义后缀最小值 M_i = min(f_{i+1}, …, f_{n−1})，条件缩成一句 M_i ≤ f_i
  </text>

  <text x="330" y="378" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">
    本例 M_4 = min(−1, −2, −3) = −3 ≤ −2，命中；切分为 [2,1,1,3] [3,1,2] [3]
  </text>
  <text x="330" y="396" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">
    蓝色 = 左段，绿色 = 中段，粉色 = 右段；橙框里是各前缀的 f_i
  </text>
</svg>
