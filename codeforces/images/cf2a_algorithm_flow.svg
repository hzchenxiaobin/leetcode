<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="520" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：两趟扫描，O(n)</text>
  <text x="300" y="44" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">第一趟求 m（与顺序无关），第二趟按时序找最早达标者</text>

  <g filter="url(#rough2)">
    <rect x="160" y="52" width="280" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="300" y="70" text-anchor="middle" font-size="10.5" fill="#33445c">读入 n（本题只有一组数据，没有多测）</text>
    <text x="300" y="85" text-anchor="middle" font-size="9" fill="#6a7a94">2010 年的旧格式：首行是 n，不是测试组数</text>
  </g>
  <path d="M 300 92 L 300 106" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="120" y="106" width="360" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="300" y="124" text-anchor="middle" font-size="10.5" fill="#33445c">按顺序读入 n 行 name score</text>
    <text x="300" y="141" text-anchor="middle" font-size="10.5" fill="#33445c">total[name] += score（累加最终总分）</text>
  </g>
  <path d="M 300 150 L 300 164" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="160" y="164" width="280" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <text x="300" y="188" text-anchor="middle" font-size="11" fill="#3a5a30">m = max(total[name])　（取最大最终总分）</text>
  </g>
  <path d="M 300 202 L 300 216" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="140" y="216" width="320" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
    <text x="300" y="239" text-anchor="middle" font-size="10.5" fill="#8a6a20">i = 1，实时分数表 cur 全部清零</text>
  </g>
  <path d="M 300 252 L 300 266" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="140" y="266" width="320" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
    <text x="300" y="285" text-anchor="middle" font-size="10.5" fill="#8a6a20">取第 i 轮 (name[i], score[i])</text>
    <text x="300" y="300" text-anchor="middle" font-size="10.5" fill="#8a6a20">cur[name[i]] += score[i]</text>
  </g>
  <path d="M 300 306 L 300 322" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <polygon points="300,322 456,368 300,414 144,368" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="300" y="362" text-anchor="middle" font-size="10.5" fill="#8a3a36">cur[name[i]] ≥ m</text>
    <text x="300" y="378" text-anchor="middle" font-size="10.5" fill="#8a3a36">且 total[name[i]] = m ?</text>
  </g>

  <path d="M 456 368 L 486 368" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="470" y="360" text-anchor="middle" font-size="10" fill="#b85450">是</text>
  <g filter="url(#rough2)">
    <rect x="490" y="342" width="130" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="555" y="362" text-anchor="middle" font-size="10.5" fill="#3a5a30">输出 name[i]</text>
    <text x="555" y="379" text-anchor="middle" font-size="9.5" fill="#4a7a3a">立即结束程序</text>
  </g>

  <path d="M 300 414 L 300 436" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="430" text-anchor="end" font-size="10" fill="#666">否</text>

  <g filter="url(#rough2)">
    <rect x="230" y="436" width="140" height="36" fill="#ffffff" stroke="#666" stroke-width="1.4" rx="8"/>
    <text x="300" y="459" text-anchor="middle" font-size="10.5" fill="#444">i ← i + 1</text>
  </g>

  <path d="M 230 454 L 100 454 L 100 286 L 134 286" fill="none" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="108" y="472" font-size="9.5" fill="#888" filter="url(#rough2)">回到重放步骤</text>

  <text x="40" y="500" font-size="9.5" fill="#888" filter="url(#rough2)">循环一定在 i ≤ n 内终止：任一最终 m 分者，在自己最后一次得分的那一轮必然达到 m。</text>
</svg>
