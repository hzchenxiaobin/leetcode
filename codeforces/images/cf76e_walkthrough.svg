<svg xmlns="http://www.w3.org/2000/svg" width="700" height="420" viewBox="0 0 700 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="700" height="420" fill="#fafafa"/>
  <text x="350" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例：四个角点，6 对距离平方全是 4</text>
  <path d="M 190 43 Q 350 49 510 43" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 130 230 L 370 230" stroke="#777777" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 250 350 L 250 110" stroke="#777777" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <circle cx="160" cy="320" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="148" y="336" text-anchor="end" font-size="10.5" fill="#446688" filter="url(#rough2)">(-1,-1)</text>
  <circle cx="340" cy="320" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="352" y="336" text-anchor="start" font-size="10.5" fill="#446688" filter="url(#rough2)">(1,-1)</text>
  <circle cx="340" cy="140" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="352" y="132" text-anchor="start" font-size="10.5" fill="#446688" filter="url(#rough2)">(1,1)</text>
  <circle cx="160" cy="140" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="148" y="132" text-anchor="end" font-size="10.5" fill="#446688" filter="url(#rough2)">(-1,1)</text>
  <rect x="430" y="74" width="240" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="550" y="96" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6015" filter="url(#rough2)">6 对点，每对 dx²+dy² = 4</text>
  <rect x="430" y="118" width="240" height="28" rx="4" fill="#ffffff" stroke="#777777" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="442" y="137" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">第 1 对</text>
  <text x="656" y="137" text-anchor="end" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">4</text>
  <rect x="430" y="152" width="240" height="28" rx="4" fill="#ffffff" stroke="#777777" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="442" y="171" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">第 2 对</text>
  <text x="656" y="171" text-anchor="end" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">4</text>
  <rect x="430" y="186" width="240" height="28" rx="4" fill="#ffffff" stroke="#777777" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="442" y="205" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">第 3 对</text>
  <text x="656" y="205" text-anchor="end" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">4</text>
  <rect x="430" y="220" width="240" height="28" rx="4" fill="#ffffff" stroke="#777777" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="442" y="239" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">第 4 对</text>
  <text x="656" y="239" text-anchor="end" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">4</text>
  <rect x="430" y="254" width="240" height="28" rx="4" fill="#ffffff" stroke="#777777" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="442" y="273" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">第 5 对</text>
  <text x="656" y="273" text-anchor="end" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">4</text>
  <rect x="430" y="288" width="240" height="28" rx="4" fill="#ffffff" stroke="#777777" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="442" y="307" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">第 6 对</text>
  <text x="656" y="307" text-anchor="end" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">4</text>
  <text x="430" y="344" text-anchor="start" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">Σ = 6 × 4 = 32</text>
  <text x="430" y="372" text-anchor="start" font-size="11" fill="#777777" filter="url(#rough2)">公式：(4·4 - 0) + (4·4 - 0) = 32</text>
  <text x="60" y="360" text-anchor="start" font-size="11" fill="#777777" filter="url(#rough2)">Σx = 0, Σx² = 4</text>
  <text x="60" y="384" text-anchor="start" font-size="11" fill="#777777" filter="url(#rough2)">Σy = 0, Σy² = 4</text>
  <text x="60" y="408" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">4·4 - 0² = 16，两维共 32</text>
</svg>
