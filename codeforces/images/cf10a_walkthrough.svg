<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="820" height="470" fill="#fafafa"/>

  <text x="410" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2 走查：80 分钟拆成 5 段，合计 570</text>
  <path d="M 170 42 Q 410 48 650 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 阶段名 -->
  <text x="120" y="100" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">工作</text>
  <text x="165" y="100" text-anchor="middle" font-size="10.5" fill="#4a6b8a" filter="url(#rough2)">仍正常</text>
  <text x="210" y="100" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">屏幕保护</text>
  <text x="255" y="100" text-anchor="middle" font-size="11" fill="#8a2b28" filter="url(#rough2)">睡眠</text>
  <text x="420" y="100" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">工作</text>

  <!-- 时间条 -->
  <g filter="url(#rough2)">
    <rect x="90" y="140" width="60" height="44" fill="#cfe0f5" stroke="#446688" stroke-width="1.5"/>
    <rect x="150" y="140" width="30" height="44" fill="#e4eefa" stroke="#446688" stroke-width="1.5" stroke-dasharray="4 3"/>
    <rect x="180" y="140" width="60" height="44" fill="#d9ecd4" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="240" y="140" width="30" height="44" fill="#f6d9d7" stroke="#b85450" stroke-width="1.5"/>
    <rect x="270" y="140" width="300" height="44" fill="#cfe0f5" stroke="#446688" stroke-width="1.5"/>
  </g>

  <text x="120" y="167" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">10×8=80</text>
  <text x="210" y="167" text-anchor="middle" font-size="10.5" fill="#2f5223" filter="url(#rough2)">10×4=40</text>
  <text x="420" y="167" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">50 × 8 = 400</text>

  <line x1="165" y1="136" x2="165" y2="126" stroke="#4a6b8a" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="165" y="120" text-anchor="middle" font-size="10.5" fill="#4a6b8a" filter="url(#rough2)">5×8=40</text>
  <line x1="255" y1="136" x2="255" y2="126" stroke="#9a4a47" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="255" y="120" text-anchor="middle" font-size="10.5" fill="#9a4a47" filter="url(#rough2)">5×2=10</text>

  <!-- 刻度 -->
  <g filter="url(#rough2)" stroke="#999999" stroke-width="1.1">
    <line x1="90" y1="184" x2="90" y2="194"/>
    <line x1="150" y1="184" x2="150" y2="194"/>
    <line x1="180" y1="184" x2="180" y2="194"/>
    <line x1="240" y1="184" x2="240" y2="194"/>
    <line x1="270" y1="184" x2="270" y2="194"/>
    <line x1="570" y1="184" x2="570" y2="194"/>
  </g>
  <g filter="url(#rough2)" font-size="10" fill="#777777" text-anchor="middle">
    <text x="90" y="208">20</text>
    <text x="150" y="208">30</text>
    <text x="180" y="208">35</text>
    <text x="240" y="208">45</text>
    <text x="270" y="208">50</text>
    <text x="570" y="208">100</text>
  </g>

  <!-- 段宽说明 -->
  <g filter="url(#rough2)" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="4 3">
    <line x1="150" y1="220" x2="180" y2="220"/>
    <line x1="240" y1="220" x2="270" y2="220"/>
  </g>
  <text x="165" y="236" text-anchor="middle" font-size="9.5" fill="#888888" filter="url(#rough2)">5 分钟</text>
  <text x="255" y="236" text-anchor="middle" font-size="9.5" fill="#888888" filter="url(#rough2)">5 分钟</text>

  <!-- 汇总 -->
  <rect x="40" y="258" width="740" height="186" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="58" y="286" font-size="13.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">逐段累加</text>
  <text x="58" y="314" font-size="12.5" fill="#7a5a1b" filter="url(#rough2)">工作 [20,30)：10 × P1 = 10 × 8 = 80</text>
  <text x="58" y="340" font-size="12.5" fill="#7a5a1b" filter="url(#rough2)">空档 [30,50)，d = 20：前 5 分钟 P1（40）、接着 10 分钟 P2（40）、剩下 5 分钟 P3（10）</text>
  <text x="58" y="366" font-size="12.5" fill="#7a5a1b" filter="url(#rough2)">工作 [50,100)：50 × P1 = 50 × 8 = 400</text>
  <text x="58" y="398" font-size="14" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">合计 80 + 40 + 40 + 10 + 400 = 570</text>
  <text x="58" y="426" font-size="11" fill="#9a7020" filter="url(#rough2)">空档 d = 20 &gt; T1 + T2 = 15，所以三段都出现过；若 d 只有 12，第三段长度就是 0。</text>
</svg>
