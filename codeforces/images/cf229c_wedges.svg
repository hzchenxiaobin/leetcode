<svg xmlns="http://www.w3.org/2000/svg" width="840" height="380" viewBox="0 0 840 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="380" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">楔形计数：S_A = Σ C(d_v, 2)</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">每个"两条 A 边共享端点"的路径贡献一次</text>
  <g filter="url(#rough2)"><circle cx="300" cy="110" r="22" fill="#f6e3c4" fill-opacity="0.9" stroke="#a0522d" stroke-width="1.7"/></g>
  <text x="300" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">v</text>
  <g filter="url(#rough2)"><circle cx="180" cy="200" r="20" fill="#d6e6f2" fill-opacity="0.9" stroke="#446688" stroke-width="1.6"/></g>
  <text x="180" y="205" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">x</text>
  <g filter="url(#rough2)"><line x1="280" y1="128" x2="194" y2="186" stroke="#888888" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><circle cx="420" cy="200" r="20" fill="#d6e6f2" fill-opacity="0.9" stroke="#446688" stroke-width="1.6"/></g>
  <text x="420" y="205" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">y</text>
  <g filter="url(#rough2)"><line x1="280" y1="128" x2="434" y2="186" stroke="#888888" stroke-width="1.5"/></g>
  <text x="300" y="250" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">以 v 为中心的两条 A 边 ⇒ 一个"楔形"</text>
  <g filter="url(#rough2)"><rect x="560" y="96" width="240" height="120" rx="4" fill="#f7fbf4" fill-opacity="0.85" stroke="#a8c99a" stroke-width="1.3"/></g>
  <text x="680" y="122" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3d6b2f" filter="url(#rough2)">计数关系</text>
  <text x="680" y="150" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">S_A = 3T_A + N₂</text>
  <text x="680" y="176" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">S_B = 3T_B + N₁</text>
  <text x="680" y="202" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">C(n,3)=T_A+N₂+N₁+T_B</text>
  <text x="420" y="300" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">3A 三元组被数 3 次；2A+1B 只在两条 A 边的公共端点被数 1 次</text>
  <g filter="url(#rough2)"><rect x="200" y="320" width="440" height="40" rx="4" fill="#faf3ec" fill-opacity="0.85" stroke="#c8a48a" stroke-width="1.3"/></g>
  <text x="420" y="346" text-anchor="middle" font-size="13" font-weight="bold" fill="#3d6b2f" filter="url(#rough2)">T_A + T_B = (S_A + S_B − C(n,3)) / 2</text>
</svg>
