<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320" viewBox="0 0 700 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="61"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="700" height="320" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2：n = 3，两次加边后的距离矩阵</text>

  <g font-size="12.5" filter="url(#rough2)">
    <text x="70" y="70" fill="#666">阶段</text>
    <text x="230" y="70" fill="#666">d12</text>
    <text x="330" y="70" fill="#666">d13</text>
    <text x="430" y="70" fill="#666">d23</text>
    <text x="560" y="70" fill="#666">和</text>
  </g>
  <g stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)">
    <line x1="60" y1="82" x2="640" y2="82"/>
    <line x1="60" y1="126" x2="640" y2="126"/>
    <line x1="60" y1="170" x2="640" y2="170"/>
  </g>
  <g font-size="13.5" filter="url(#rough2)">
    <text x="70" y="110" fill="#2f4a66">初始</text>
    <text x="230" y="110" fill="#2b2b2b">4</text>
    <text x="330" y="110" fill="#2b2b2b">5</text>
    <text x="430" y="110" fill="#2b2b2b">9</text>
    <text x="560" y="110" font-weight="bold" fill="#2f4a66">18</text>

    <text x="70" y="154" fill="#2f4a66">修 (2,3,8)</text>
    <text x="230" y="154" fill="#2b2b2b">4</text>
    <text x="330" y="154" fill="#2b2b2b">5</text>
    <text x="430" y="154" font-weight="bold" fill="#8f3b37">8</text>
    <text x="560" y="154" font-weight="bold" fill="#2f4a66">17</text>

    <text x="70" y="198" fill="#2f4a66">修 (1,2,1)</text>
    <text x="230" y="198" font-weight="bold" fill="#8f3b37">1</text>
    <text x="330" y="198" fill="#2b2b2b">5</text>
    <text x="430" y="198" font-weight="bold" fill="#8f3b37">6</text>
    <text x="560" y="198" font-weight="bold" fill="#2f4a66">12</text>
  </g>

  <rect x="60" y="226" width="580" height="70" rx="9" fill="#eef4ec" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="76" y="250" font-size="12.5" fill="#2f5223" filter="url(#rough2)">修 (2,3,8) 后 d23 从 9 变 8，其余不变，和 = 4+5+8 = 17。</text>
  <text x="76" y="272" font-size="12.5" fill="#2f5223" filter="url(#rough2)">修 (1,2,1)：d12 = 1，d13 = min(5, 1+8) = 5，d23 = min(8, 1+5) = 6，和 = 12。</text>
  <text x="76" y="290" font-size="12" fill="#2f5223" filter="url(#rough2)">答案输出：17 12</text>
</svg>
