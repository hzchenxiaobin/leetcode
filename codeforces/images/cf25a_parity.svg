<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="720" height="330" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按奇偶分成两堆，找出只有 1 个的那一堆</text>

  <rect x="40" y="60" width="300" height="150" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">偶数</text>
  <g font-size="13" fill="#2f4a66" filter="url(#rough2)" text-anchor="middle">
    <text x="90" y="118">2</text><text x="150" y="118">4</text><text x="250" y="118">8</text>
    <text x="90" y="150">10</text><text x="150" y="150">…</text>
  </g>
  <text x="190" y="192" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">4 个（多数派）</text>

  <rect x="380" y="60" width="300" height="150" rx="10" fill="#fdf3e3" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="530" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">奇数</text>
  <g font-size="13" fill="#8a6015" filter="url(#rough2)" text-anchor="middle">
    <text x="470" y="118">7</text>
  </g>
  <text x="530" y="192" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">1 个（少数派）</text>

  <path d="M470,132 L478,168" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="470" y="224" font-size="12" fill="#8f3b37" filter="url(#rough2)">这一个就是答案，输出它的下标</text>

  <rect x="60" y="240" width="600" height="64" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="76" y="264" font-size="12.5" fill="#8a6015" filter="url(#rough2)">若偶数个数 == 1，答案是那个偶数；否则答案是那个奇数（此时奇数个数必为 1）。</text>
  <text x="76" y="288" font-size="12.5" fill="#8a6015" filter="url(#rough2)">题面保证"恰好一个数不同"，所以两种情况必有且仅有一种成立。</text>
</svg>
