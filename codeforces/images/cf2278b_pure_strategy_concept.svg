<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="440" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：顺序完全无关，只出同一招也能达标</text>
  <path d="M 96 44 Q 360 51 624 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 左列：招式克制环 -->
  <text x="56" y="80" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">① 招式克制环</text>

  <circle cx="205" cy="130" r="31" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="205" y="139" text-anchor="middle" font-size="19" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">R</text>
  <text x="205" y="180" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">石头</text>

  <circle cx="118" cy="262" r="31" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="118" y="271" text-anchor="middle" font-size="19" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">S</text>
  <text x="118" y="312" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">剪刀</text>

  <circle cx="292" cy="262" r="31" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="292" y="271" text-anchor="middle" font-size="19" font-weight="bold" fill="#8a6015" filter="url(#rough2)">P</text>
  <text x="292" y="312" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">布</text>

  <path d="M 186 158 L 137 233" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="132" y="214" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">赢</text>

  <path d="M 152 262 L 258 262" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="205" y="252" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">赢</text>

  <path d="M 274 233 L 224 158" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="281" y="214" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">赢</text>

  <text x="205" y="352" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">箭头方向：出手方赢下这一局</text>

  <!-- 右列：计数决定一切 -->
  <text x="360" y="80" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">② 只比较每种牌的张数</text>
  <text x="360" y="108" font-size="12" fill="#444" filter="url(#rough2)">Alice：x 张 R、y 张 S、z 张 P，顺序未知</text>
  <text x="360" y="132" font-size="12" fill="#444" filter="url(#rough2)">Bob：n = x+y+z 张牌，赛前一次定好</text>
  <text x="360" y="156" font-size="12" fill="#444" filter="url(#rough2)">Alice 可任意置换位置 ⇒ 等价于任意配对</text>

  <rect x="356" y="176" width="336" height="110" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="372" y="202" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">若 Bob 全出 P（共 n 张）</text>
  <text x="372" y="228" font-size="12" fill="#2f5d22" filter="url(#rough2)">对 R 赢 x 局，被 S 打输 y 局，对 P 平 z 局</text>
  <text x="372" y="258" font-size="13" font-weight="bold" fill="#2f5d22" filter="url(#rough2)">净胜 T = x − y，与顺序无关</text>

  <rect x="356" y="300" width="336" height="110" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="372" y="326" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">达标条件：T ≥ 0</text>
  <text x="372" y="352" font-size="12" fill="#8a6015" filter="url(#rough2)">⇔ 被这一招克制的牌，张数不少于克制它的牌</text>
  <text x="372" y="378" font-size="12" fill="#8a6015" filter="url(#rough2)">例：x ≥ y 时，全出 P 一定合法</text>
</svg>
