<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="680" height="420" fill="#fafafa"/>

  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">为什么必须删「最左」的那个 0</text>
  <text x="340" y="51" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#rough2)">s = 0101：两个 0 各删一次，结果从第一位就开始不同</text>

  <!-- 删第一个 0 -->
  <text x="46" y="92" font-size="13" fill="#2e6e2e" filter="url(#rough2)">删第 1 个 0</text>
  <text x="46" y="109" font-size="11" fill="#2e6e2e" filter="url(#rough2)">（位置 p = 1）</text>
  <g>
    <rect x="196" y="76" width="38" height="38" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
    <rect x="242" y="76" width="38" height="38" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <rect x="288" y="76" width="38" height="38" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  </g>
  <g font-size="17" font-weight="bold" text-anchor="middle" fill="#2b2b2b">
    <text x="215" y="101" filter="url(#rough2)">1</text>
    <text x="261" y="101" filter="url(#rough2)">0</text>
    <text x="307" y="101" filter="url(#rough2)">1</text>
  </g>
  <text x="350" y="101" font-size="13" fill="#2e6e2e" filter="url(#rough2)">✓ 字典序更大</text>

  <!-- 删第二个 0 -->
  <text x="46" y="150" font-size="13" fill="#b85450" filter="url(#rough2)">删第 2 个 0</text>
  <text x="46" y="167" font-size="11" fill="#b85450" filter="url(#rough2)">（位置 q = 3）</text>
  <g>
    <rect x="196" y="134" width="38" height="38" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
    <rect x="242" y="134" width="38" height="38" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
    <rect x="288" y="134" width="38" height="38" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  </g>
  <g font-size="17" font-weight="bold" text-anchor="middle" fill="#2b2b2b">
    <text x="215" y="159" filter="url(#rough2)">0</text>
    <text x="261" y="159" filter="url(#rough2)">1</text>
    <text x="307" y="159" filter="url(#rough2)">1</text>
  </g>
  <text x="350" y="159" font-size="13" fill="#b85450" filter="url(#rough2)">✗ 更小，被淘汰</text>

  <!-- 首位比较 -->
  <path d="M336 120 L336 132" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="432" y="130" font-size="11.5" fill="#b85450" filter="url(#rough2)">首位 1 &gt; 0 已定胜负</text>

  <!-- 一般化说明 -->
  <rect x="46" y="190" width="588" height="168" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="64" y="216" font-size="13" font-weight="bold" fill="#33517a" filter="url(#rough2)">一般化：把两个候选位置 p &lt; q 之间的窗口对齐比较</text>
  <text x="64" y="242" font-size="12.5" fill="#33517a" filter="url(#rough2)">记 u = T[p..q−1]（以 0 开头，长度 L = q − p）。</text>
  <text x="64" y="266" font-size="12.5" fill="#33517a" filter="url(#rough2)">删 p 时这段窗口读作 u[1..] 再接 0，删 q 时读作 u 本身。</text>
  <text x="64" y="290" font-size="12.5" fill="#33517a" filter="url(#rough2)">若 u 全为 0：两种删法的窗口完全相同，其后部分也相同，打平。</text>
  <text x="64" y="314" font-size="12.5" fill="#33517a" filter="url(#rough2)">否则设 u 里第一个 1 在位置 z ≥ 1：前 z−1 位都是 1，</text>
  <text x="64" y="338" font-size="12.5" fill="#33517a" filter="url(#rough2)">第 z 位前者取 1、后者取 u[z] = 0 —— 删更靠左的 0 严格更大。</text>

  <!-- 结论 -->
  <rect x="46" y="366" width="588" height="44" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="64" y="394" font-size="12.5" fill="#7a5410" filter="url(#rough2)">把 0 换成 1、把「更大」换成「更小」逐字重写，即得 Bob 的结论：删最左的 1。</text>
</svg>
