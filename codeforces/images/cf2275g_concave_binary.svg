<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="440" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">f(k) 是单峰（凹）函数 ⇒ 每个 x 只需二分最优 k</text>
  <path d="M 168 42 Q 380 50 592 42" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- 坐标轴 -->
  <path d="M 92 306 L 706 306" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 92 306 L 92 78" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="712" y="300" font-size="12" fill="#666" filter="url(#rough2)">k</text>
  <text x="74" y="76" font-size="12" fill="#666" filter="url(#rough2)">f(k)</text>

  <!-- 曲线：点 (k, f) -->
  <polyline points="128,272 232,196 336,142 440,118 544,132 648,178"
            fill="none" stroke="#446688" stroke-width="2.4" stroke-linejoin="round" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <circle cx="128" cy="272" r="4.5" fill="#fff" stroke="#446688" stroke-width="2"/>
    <circle cx="232" cy="196" r="4.5" fill="#fff" stroke="#446688" stroke-width="2"/>
    <circle cx="336" cy="142" r="4.5" fill="#fff" stroke="#446688" stroke-width="2"/>
    <circle cx="440" cy="118" r="6.5" fill="#fce4ec" stroke="#b85450" stroke-width="2.6"/>
    <circle cx="544" cy="132" r="4.5" fill="#fff" stroke="#446688" stroke-width="2"/>
    <circle cx="648" cy="178" r="4.5" fill="#fff" stroke="#446688" stroke-width="2"/>
  </g>

  <text x="128" y="326" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">0</text>
  <text x="232" y="326" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">1</text>
  <text x="336" y="326" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">2</text>
  <text x="440" y="326" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">3</text>
  <text x="544" y="326" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">4</text>
  <text x="648" y="326" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">5</text>

  <!-- 最优点 -->
  <path d="M 440 124 L 440 300" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <rect x="462" y="86" width="176" height="30" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="550" y="106" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">k*：取到最大值，此处 k*=3</text>

  <!-- 差分公式框 -->
  <rect x="26" y="344" width="708" height="80" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="44" y="368" font-size="13" font-weight="bold" fill="#7a5a18" filter="url(#rough2)">相邻差分：f(k) − f(k−1) = x·(n−k) − w_k = x·n − (w_k + x·k)</text>
  <text x="44" y="390" font-size="11.5" fill="#7a5a18" filter="url(#rough2)">w_k 不降、x·k 严格升 ⇒ (w_k + x·k) 严格递增 ⇒ 差分严格递减 ⇒ f 单峰</text>
  <text x="44" y="412" font-size="11.5" fill="#7a5a18" filter="url(#rough2)">于是「可行」的 k 构成前缀：取最大的 k 使 w_k + x·k ≤ x·n，二分即可</text>
</svg>
