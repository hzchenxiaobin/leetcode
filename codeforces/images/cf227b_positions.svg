<svg xmlns="http://www.w3.org/2000/svg" width="840" height="380" viewBox="0 0 840 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="380" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">比较次数只取决于元素下标</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">排列 a = [3, 1, 2]（n = 3），查询值 1 在下标 2</text>
  <g filter="url(#rough2)"><rect x="180" y="120" width="100" height="56" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="230.0" y="156" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="230.0" y="108" text-anchor="middle" font-size="11" fill="#777777" filter="url(#rough2)">下标 1</text>
  <g filter="url(#rough2)"><rect x="290" y="120" width="100" height="56" rx="4" fill="#f6d9d7" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="340.0" y="156" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="340.0" y="108" text-anchor="middle" font-size="11" fill="#777777" filter="url(#rough2)">下标 2</text>
  <g filter="url(#rough2)"><rect x="400" y="120" width="100" height="56" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="450.0" y="156" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="450.0" y="108" text-anchor="middle" font-size="11" fill="#777777" filter="url(#rough2)">下标 3</text>
  <g filter="url(#rough2)"><line x1="335" y1="192" x2="335" y2="210" stroke="#a0522d" stroke-width="1.4"/></g>
  <text x="335" y="228" text-anchor="middle" font-size="13" font-weight="bold" fill="#a0522d" filter="url(#rough2)">p = 2</text>
  <g filter="url(#rough2)"><rect x="90" y="228" width="320" height="78" rx="4" fill="#f7fbf4" fill-opacity="0.85" stroke="#a8c99a" stroke-width="1.3"/></g>
  <text x="250" y="254" text-anchor="middle" font-size="13" font-weight="bold" fill="#3d6b2f" filter="url(#rough2)">Vasya（从左往右）</text>
  <text x="250" y="280" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">比较 a₁ … a_p ⇒ p 次</text>
  <text x="250" y="298" text-anchor="middle" font-size="11" fill="#777777" filter="url(#rough2)">这里 p = 2 次</text>
  <g filter="url(#rough2)"><rect x="430" y="228" width="320" height="78" rx="4" fill="#fdf6f4" fill-opacity="0.85" stroke="#d8a89a" stroke-width="1.3"/></g>
  <text x="590" y="254" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a4b2a" filter="url(#rough2)">Petya（从右往左）</text>
  <text x="590" y="280" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">比较 a_n … a_p ⇒ n − p + 1 次</text>
  <text x="590" y="298" text-anchor="middle" font-size="11" fill="#777777" filter="url(#rough2)">这里 3 − 2 + 1 = 2 次</text>
  <text x="420" y="342" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">所以预处理 pos[值] = 下标，每个查询 O(1)</text>
</svg>
