<svg xmlns="http://www.w3.org/2000/svg" width="660" height="220" viewBox="0 0 660 220"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1204"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="660" height="220" fill="#fafafa"/>
  <text x="330.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">流程</text>
  <path d="M 105.60000000000001 42 Q 330.0 48 554.4 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="330.0" y="206" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">O(n)</text>
  <rect x="30.0" y="80" width="190.66666666666666" height="54" rx="7" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="125.33333333333333" y="112.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">读 n,k,a</text>
  <line x1="221.7" y1="107.0" x2="231.7" y2="107.0" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <rect x="234.66666666666666" y="80" width="190.66666666666666" height="54" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330.0" y="105.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#5a7fb0" filter="url(#rough2)">t=0..n-1</text>
  <text x="330.0" y="123.0" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">i=((k-1+t) mod n)+1</text>
  <line x1="426.3" y1="107.0" x2="436.3" y2="107.0" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <rect x="439.3333333333333" y="80" width="190.66666666666666" height="54" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="534.6666666666666" y="105.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">a[i]==1?</text>
  <text x="534.6666666666666" y="123.0" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">是 → 输出 i</text>
</svg>
