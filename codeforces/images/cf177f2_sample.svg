<svg xmlns="http://www.w3.org/2000/svg" width="770" height="400" viewBox="0 0 770 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="770" height="400" fill="#fafafa"/>
  <text x="385.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例走查：7 个方案按值升序，两个查询分别落在第 3、第 7 位</text>
  <path d="M 116.93000000000018 46 Q 385.0 52 653.0699999999998 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="66.0" y="70.0" width="600.0" height="32.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="74.0" y="95.0" text-anchor="start" font-size="12" font-weight="bold" fill="#26405c" filter="url(#rough2)">升序位置</text>
  <text x="174.0" y="95.0" text-anchor="start" font-size="12" font-weight="bold" fill="#26405c" filter="url(#rough2)">方案</text>
  <text x="374.0" y="95.0" text-anchor="start" font-size="12" font-weight="bold" fill="#26405c" filter="url(#rough2)">总幸福值</text>
  <text x="484.0" y="95.0" text-anchor="start" font-size="12" font-weight="bold" fill="#26405c" filter="url(#rough2)">对应查询</text>
  <path d="M 66.0 70.0 L 666.0 70.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="74.0" y="127.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="174.0" y="127.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">空集</text>
  <text x="374.0" y="127.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="484.0" y="127.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)"></text>
  <path d="M 66.0 102.0 L 666.0 102.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="74.0" y="159.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="174.0" y="159.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">{1-1}</text>
  <text x="374.0" y="159.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="484.0" y="159.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)"></text>
  <path d="M 66.0 134.0 L 666.0 134.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="74.0" y="191.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="174.0" y="191.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">{1-2}</text>
  <text x="374.0" y="191.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="484.0" y="191.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">t = 3 的答案</text>
  <path d="M 66.0 166.0 L 666.0 166.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="74.0" y="223.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="174.0" y="223.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">{2-1}</text>
  <text x="374.0" y="223.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="484.0" y="223.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)"></text>
  <path d="M 66.0 198.0 L 666.0 198.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="74.0" y="255.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <text x="174.0" y="255.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">{1-2, 2-1}</text>
  <text x="374.0" y="255.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <text x="484.0" y="255.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)"></text>
  <path d="M 66.0 230.0 L 666.0 230.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="74.0" y="287.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">6</text>
  <text x="174.0" y="287.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">{2-2}</text>
  <text x="374.0" y="287.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">7</text>
  <text x="484.0" y="287.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)"></text>
  <path d="M 66.0 262.0 L 666.0 262.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="74.0" y="319.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">7</text>
  <text x="174.0" y="319.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">{1-1, 2-2}</text>
  <text x="374.0" y="319.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">8</text>
  <text x="484.0" y="319.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">t = 7 的答案</text>
  <path d="M 66.0 294.0 L 666.0 294.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="66.0" y="356.0" text-anchor="start" font-size="11.4" fill="#6b6b6b" filter="url(#rough2)">两个官方样例分别问 t=3 与 t=7：输出 2 与 8。</text>
  <text x="66.0" y="378.0" text-anchor="start" font-size="11.4" fill="#6b6b6b" filter="url(#rough2)">只按「值」排序，同值方案互换不影响答案。</text>
</svg>
