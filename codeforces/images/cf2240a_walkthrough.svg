<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="29"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">走查：n = 13，k = 3 → 答案 7</text>
  <path d="M 240 40 Q 360 47 480 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="360" y="58" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">三档代价 1 / 2 / 4 各能买 3 次，第三次只买到 1 个</text>

  <rect x="30" y="76" width="660" height="34" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <g font-size="12.5" font-weight="bold" fill="#2f4a66" text-anchor="middle" filter="url(#rough2)">
    <text x="76" y="98">轮</text>
    <text x="168" y="98">代价 bit</text>
    <text x="300" y="98">take = min(3, rem/bit)</text>
    <text x="436" y="98">ans</text>
    <text x="500" y="98">rem</text>
    <text x="612" y="98">三个数的 popcount</text>
  </g>

  <rect x="30" y="110" width="660" height="34" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <g font-size="12" fill="#5a4a20" text-anchor="middle" filter="url(#rough2)">
    <text x="76" y="132">1</text>
    <text x="168" y="132">1</text>
    <text x="300" y="132">min(3, 13) = 3</text>
    <text x="436" y="132">3</text>
    <text x="500" y="132">10</text>
    <text x="612" y="132">1, 1, 1</text>
  </g>

  <rect x="30" y="144" width="660" height="34" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <g font-size="12" fill="#3c5e2e" text-anchor="middle" filter="url(#rough2)">
    <text x="76" y="166">2</text>
    <text x="168" y="166">2</text>
    <text x="300" y="166">min(3, 5) = 3</text>
    <text x="436" y="166">6</text>
    <text x="500" y="166">4</text>
    <text x="612" y="166">2, 2, 2</text>
  </g>

  <rect x="30" y="178" width="660" height="34" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <g font-size="12" fill="#5a4a20" text-anchor="middle" filter="url(#rough2)">
    <text x="76" y="200">3</text>
    <text x="168" y="200">4</text>
    <text x="300" y="200">min(3, 1) = 1</text>
    <text x="436" y="200">7</text>
    <text x="500" y="200">0</text>
    <text x="612" y="200">3, 2, 2</text>
  </g>

  <rect x="30" y="212" width="660" height="34" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <g font-size="12" fill="#a14340" text-anchor="middle" filter="url(#rough2)">
    <text x="76" y="234">4</text>
    <text x="168" y="234">8</text>
    <text x="300" y="234">8 &gt; rem = 0，停</text>
    <text x="436" y="234">7</text>
    <text x="500" y="234">0</text>
    <text x="612" y="234">保持不变</text>
  </g>

  <rect x="34" y="262" width="316" height="86" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="192" y="284" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">还原出来的最优序列</text>
  <text x="192" y="308" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">a = [7, 3, 3]</text>
  <text x="192" y="330" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">和 = 13 ≤ 13，popcount 和 = 3+2+2 = 7</text>

  <rect x="366" y="262" width="320" height="86" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="526" y="284" text-anchor="middle" font-size="12" font-weight="bold" fill="#a14340" filter="url(#rough2)">为什么拿不到 8 个 1</text>
  <text x="526" y="308" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">8 分给 3 个数最省是 3+3+2 → 7+7+3</text>
  <text x="526" y="330" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">= 17 &gt; 13，预算不够</text>

  <text x="360" y="372" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">注意每轮 take 是「全买同一档」，因为同一档内所有数的边际代价相同，先补哪个数都不影响最终答案</text>
  <text x="360" y="390" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">同一档里只买到 take &lt; k 个时预算必已小于 bit，下一档更贵，循环自然结束，无需额外 break</text>
</svg>
