<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="600" height="430" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">1 宽列块里的竖直链：为什么 [1,2,1] 不行</text>

  <!-- LEFT: bad chain -->
  <text x="36" y="66" font-size="14" fill="#b85450" filter="url(#rough2)">a = [1, 2, 1]</text>
  <g filter="url(#rough2)">
    <rect x="40" y="80" width="86" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="62" y="106" font-size="15" fill="#333">1</text>
    <rect x="40" y="126" width="86" height="76" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="62" y="152" font-size="15" fill="#333">2</text>
    <text x="62" y="186" font-size="15" fill="#333">1</text>
    <rect x="40" y="208" width="86" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="62" y="234" font-size="15" fill="#333">1</text>
  </g>
  <g font-size="12" fill="#666" filter="url(#rough2)">
    <text x="136" y="105">顶=底=1（唯一值）</text>
    <text x="136" y="140">顶 ≠ 1 ⇒ 顶只能 2</text>
    <text x="136" y="160">于是底被挤成 1</text>
    <text x="136" y="200">中间这段被“逼”成 (2,1)</text>
    <text x="136" y="234">底=1，下一块顶也=1 ⇒ 冲突</text>
  </g>
  <g stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)">
    <path d="M84,248 C104,262 120,262 132,250"/>
  </g>
  <text x="64" y="288" font-size="13" fill="#b85450" filter="url(#rough2)">两处 1 之间没有 ≥3 的块垫底 ⇒ 无解</text>

  <!-- RIGHT: good chain -->
  <text x="330" y="66" font-size="14" fill="#4a7a3a" filter="url(#rough2)">a = [1, 3, 1]</text>
  <g filter="url(#rough2)">
    <rect x="334" y="80" width="86" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="356" y="106" font-size="15" fill="#333">1</text>
    <rect x="334" y="126" width="86" height="110" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="356" y="152" font-size="15" fill="#333">3</text>
    <text x="356" y="186" font-size="15" fill="#333">1</text>
    <text x="356" y="220" font-size="15" fill="#333">2</text>
    <rect x="334" y="242" width="86" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="356" y="268" font-size="15" fill="#333">1</text>
  </g>
  <g font-size="12" fill="#666" filter="url(#rough2)">
    <text x="430" y="105">顶 = 1；底 ≠ 1 也做得到</text>
    <text x="430" y="150">块里有 3 个值可挑</text>
    <text x="430" y="170">顶取 3、底取 2 即可</text>
    <text x="430" y="222">（顶、底相互独立）</text>
    <text x="430" y="268">顶 ≠ 上一块底 = 2 ⇒ 取 1 ✓</text>
  </g>
  <text x="330" y="308" font-size="13" fill="#4a7a3a" filter="url(#rough2)">块长 ≥ 3 时端点完全自由：可以“截断”矛盾</text>

  <rect x="36" y="330" width="530" height="76" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <g font-size="13" fill="#5a4a10" filter="url(#rough2)">
    <text x="52" y="356">结论：把序列按 ≥3 的元素“切段”，每段（只含 1、2）里最多出现一个 1。</text>
    <text x="52" y="380">这条规则对“行块高度序列 a”和“列块宽度序列 b”分别检查，只在对应方向存在 1 宽/1 高块时生效。</text>
  </g>
</svg>
