<svg xmlns="http://www.w3.org/2000/svg" width="740" height="380" viewBox="0 0 740 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="163"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="740" height="380" fill="#fafafa"/>
  <text x="370" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">五个段位区间：全部化成整数乘法，顺序 if/else if 即可</text>
  <path d="M 180 46 Q 370 52 560 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <line x1="70" y1="150" x2="680" y2="150" stroke="#2b2b2b" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="70" y="176" text-anchor="start" font-size="10" font-weight="normal" fill="#555" filter="url(#rough2)">b = 0（没人比他好）</text>
  <text x="640" y="176" text-anchor="start" font-size="10" font-weight="normal" fill="#555" filter="url(#rough2)">b 增大</text>
  <rect x="70.0" y="92" width="10" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="76.1" y="92" width="54.900000000000006" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="103.55" y="118" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">hardcore</text>
  <rect x="131.0" y="92" width="61.0" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="161.5" y="118" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">average</text>
  <rect x="192.0" y="92" width="183.0" height="40" fill="#fde9d9" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="283.5" y="118" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">random</text>
  <rect x="375.0" y="92" width="305.0" height="40" fill="#f3e8fb" stroke="#7a4a9a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="527.5" y="118" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">noob</text>
  <line x1="70.0" y1="84" x2="70.0" y2="136" stroke="#888" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="70.0" y="76" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#777" filter="url(#rough2)">b=0</text>
  <line x1="76.1" y1="84" x2="76.1" y2="136" stroke="#888" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="76.1" y="76" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#777" filter="url(#rough2)">1%</text>
  <line x1="131.0" y1="84" x2="131.0" y2="136" stroke="#888" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="131.0" y="76" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#777" filter="url(#rough2)">10%</text>
  <line x1="192.0" y1="84" x2="192.0" y2="136" stroke="#888" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="192.0" y="76" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#777" filter="url(#rough2)">20%</text>
  <line x1="375.0" y1="84" x2="375.0" y2="136" stroke="#888" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="375.0" y="76" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#777" filter="url(#rough2)">50%</text>
  <line x1="680.0" y1="84" x2="680.0" y2="136" stroke="#888" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="680.0" y="76" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#777" filter="url(#rough2)">m</text>
  <rect x="70" y="206" width="600" height="120" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="86" y="230" text-anchor="start" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">判据（b 为“严格比他好”的人数，m 为参赛人数）：</text>
  <text x="92" y="252" text-anchor="start" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">noob     </text>
  <text x="190" y="252" text-anchor="start" font-size="11" font-weight="normal" fill="#2b2b2b" filter="url(#rough2)">2b &gt; m</text>
  <text x="92" y="269" text-anchor="start" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">random   </text>
  <text x="190" y="269" text-anchor="start" font-size="11" font-weight="normal" fill="#2b2b2b" filter="url(#rough2)">2b ≤ m 且 5b &gt; m</text>
  <text x="92" y="286" text-anchor="start" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">average  </text>
  <text x="190" y="286" text-anchor="start" font-size="11" font-weight="normal" fill="#2b2b2b" filter="url(#rough2)">5b ≤ m 且 10b &gt; m</text>
  <text x="92" y="303" text-anchor="start" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">hardcore </text>
  <text x="190" y="303" text-anchor="start" font-size="11" font-weight="normal" fill="#2b2b2b" filter="url(#rough2)">10b ≤ m 且 100b &gt; m</text>
  <text x="92" y="320" text-anchor="start" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">pro      </text>
  <text x="190" y="320" text-anchor="start" font-size="11" font-weight="normal" fill="#2b2b2b" filter="url(#rough2)">100b ≤ m</text>
  <rect x="70" y="338" width="600" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="84" y="358" text-anchor="start" font-size="10.5" font-weight="normal" fill="#8a6015" filter="url(#rough2)">阈值彼此首尾相接、互不重叠，所以从上到下第一个命中的就是答案。</text>
</svg>
