<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="59"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="760" height="360" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">C：栈顶就是分界，长度 = 当前下标 − 栈顶</text>
  <path d="M 130 42 Q 380 47 630 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="380" y="58" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">以串 ) ( ( ( ) ) ) 为例，括号下是 0 起的下标</text>

  <text x="140" y="84" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">0</text>
  <text x="180" y="84" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">1</text>
  <text x="220" y="84" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">2</text>
  <text x="260" y="84" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">3</text>
  <text x="300" y="84" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">4</text>
  <text x="340" y="84" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">5</text>
  <text x="380" y="84" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">6</text>

  <rect x="120" y="92" width="40" height="40" fill="#fdeceb" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="160" y="92" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="200" y="92" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="240" y="92" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="280" y="92" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="320" y="92" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="360" y="92" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>

  <text x="140" y="121" text-anchor="middle" font-size="17" fill="#b85450" font-family="'Courier New',monospace" filter="url(#rough2)">)</text>
  <text x="180" y="121" text-anchor="middle" font-size="17" fill="#2b2b2b" font-family="'Courier New',monospace" filter="url(#rough2)">(</text>
  <text x="220" y="121" text-anchor="middle" font-size="17" fill="#2b2b2b" font-family="'Courier New',monospace" filter="url(#rough2)">(</text>
  <text x="260" y="121" text-anchor="middle" font-size="17" fill="#2b2b2b" font-family="'Courier New',monospace" filter="url(#rough2)">(</text>
  <text x="300" y="121" text-anchor="middle" font-size="17" fill="#2b2b2b" font-family="'Courier New',monospace" filter="url(#rough2)">)</text>
  <text x="340" y="121" text-anchor="middle" font-size="17" fill="#2b2b2b" font-family="'Courier New',monospace" filter="url(#rough2)">)</text>
  <text x="380" y="121" text-anchor="middle" font-size="17" fill="#2b2b2b" font-family="'Courier New',monospace" filter="url(#rough2)">)</text>

  <line x1="162" y1="144" x2="398" y2="144" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <line x1="162" y1="144" x2="162" y2="138" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="398" y1="144" x2="398" y2="138" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="162" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">下标 1..6 恰好是 ((()))，长度 6</text>

  <text x="140" y="162" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">分界</text>

  <text x="440" y="84" font-size="11" fill="#666" filter="url(#rough2)">i = 6 时的栈（栈底在下）：</text>
  <rect x="470" y="94" width="64" height="30" rx="5" fill="#fff3cd" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="502" y="115" text-anchor="middle" font-size="14" fill="#8a6015" font-family="'Courier New',monospace" filter="url(#rough2)">1</text>
  <rect x="470" y="126" width="64" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="502" y="147" text-anchor="middle" font-size="14" fill="#2f5223" font-family="'Courier New',monospace" filter="url(#rough2)">0</text>
  <text x="546" y="115" font-size="10.5" fill="#8a6015" filter="url(#rough2)">← 下标 1 的 '('</text>
  <text x="546" y="147" font-size="10.5" fill="#2f5223" filter="url(#rough2)">← 新栈顶＝分界</text>
  <text x="546" y="168" font-size="10" fill="#777" filter="url(#rough2)">弹出 1 之后</text>

  <rect x="50" y="182" width="342" height="112" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="62" y="206" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">① 弹出的不是分界 → 长度 = i − 新栈顶</text>
  <text x="62" y="232" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">弹出下标 1 的 '('，栈顶变成 0，</text>
  <text x="62" y="254" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">于是 len = 6 − 0 = 6，正好是 ((()))</text>
  <text x="62" y="276" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">这一段一定是「以 i 结尾的最长合法串」</text>

  <rect x="408" y="182" width="302" height="112" rx="10" fill="#fdeceb" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="420" y="206" font-size="12.5" font-weight="bold" fill="#8c3a36" filter="url(#rough2)">② 弹出的是分界 → 栈空</text>
  <text x="420" y="232" font-size="11.5" fill="#8c3a36" filter="url(#rough2)">说明这个 ')' 谁也配不上，</text>
  <text x="420" y="254" font-size="11.5" fill="#8c3a36" filter="url(#rough2)">把它自己压栈当新分界（例子里的 0）；</text>
  <text x="420" y="276" font-size="11.5" fill="#8c3a36" filter="url(#rough2)">本位不产生任何合法子串。</text>

  <text x="50" y="322" font-size="11" fill="#2b2b2b" filter="url(#rough2)">栈里永远是「未匹配 '(' 的下标」加上一个分界（-1 或某个失配 ')' 的下标）。</text>
  <text x="50" y="344" font-size="11" fill="#2b2b2b" filter="url(#rough2)">分界之后到 i 的所有括号恰好两两配对，所以 i − 分界 就是以 i 结尾的最长合法长度。</text>
</svg>
