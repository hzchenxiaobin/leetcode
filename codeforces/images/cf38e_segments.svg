<svg xmlns="http://www.w3.org/2000/svg" width="780" height="430" viewBox="0 0 780 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="701"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr38e" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b06a2c"/>
    </marker>
  </defs>

  <rect width="780" height="430" fill="#fafafa"/>
  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">针把数轴切成若干段：段内弹珠都滚向段首那根针</text>

  <!-- 数轴 -->
  <line x1="60" y1="210" x2="720" y2="210" stroke="#7a8ca6" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="726" y="214" font-size="11" fill="#777" filter="url(#rough2)">x</text>

  <!-- 弹珠 -->
  <circle cx="110" cy="210" r="10" fill="#a8d8a8" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="200" cy="210" r="10" fill="#ffd9b3" stroke="#b06a2c" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="290" cy="210" r="10" fill="#ffd9b3" stroke="#b06a2c" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="380" cy="210" r="10" fill="#a8d8a8" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="470" cy="210" r="10" fill="#ffd9b3" stroke="#b06a2c" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="560" cy="210" r="10" fill="#ffd9b3" stroke="#b06a2c" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="650" cy="210" r="10" fill="#a8d8a8" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>

  <!-- 针标记 -->
  <line x1="110" y1="188" x2="110" y2="232" stroke="#2f5223" stroke-width="3" filter="url(#rough2)"/>
  <line x1="380" y1="188" x2="380" y2="232" stroke="#2f5223" stroke-width="3" filter="url(#rough2)"/>
  <line x1="650" y1="188" x2="650" y2="232" stroke="#2f5223" stroke-width="3" filter="url(#rough2)"/>
  <text x="98" y="180" font-size="10" fill="#2f5223" filter="url(#rough2)">针</text>
  <text x="368" y="180" font-size="10" fill="#2f5223" filter="url(#rough2)">针</text>
  <text x="638" y="180" font-size="10" fill="#2f5223" filter="url(#rough2)">针</text>

  <!-- 滚动箭头 -->
  <path d="M 200 250 L 125 250" stroke="#b06a2c" stroke-width="1.8" fill="none" marker-end="url(#arr38e)" filter="url(#rough2)"/>
  <path d="M 290 250 L 125 250" stroke="#b06a2c" stroke-width="1.8" fill="none" marker-end="url(#arr38e)" filter="url(#rough2)"/>
  <path d="M 470 250 L 395 250" stroke="#b06a2c" stroke-width="1.8" fill="none" marker-end="url(#arr38e)" filter="url(#rough2)"/>
  <path d="M 560 250 L 395 250" stroke="#b06a2c" stroke-width="1.8" fill="none" marker-end="url(#arr38e)" filter="url(#rough2)"/>

  <!-- 段括号 -->
  <path d="M 110 300 L 110 292 L 380 292 L 380 300" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 380 300 L 380 292 L 650 292 L 650 300" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="245" y="286" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">第 1 段：滚到 x=110</text>
  <text x="515" y="286" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">第 2 段：滚到 x=380</text>
  <text x="700" y="286" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">第 3 段</text>

  <!-- 说明 -->
  <rect x="40" y="330" width="700" height="82" rx="9" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.3" filter="url(#rough2)"/>
  <text x="56" y="354" font-size="11.5" fill="#2f5223" filter="url(#rough2)">绿色 = 插了针的弹珠（不动）；橙色 = 未插针（向左滚到最近的针）。</text>
  <text x="56" y="376" font-size="11.5" fill="#8c3b37" filter="url(#rough2)">最左边那颗必须插针，否则它左边没有针，会滚到 −∞，罚金无穷大。</text>
  <text x="56" y="398" font-size="11.5" fill="#555" filter="url(#rough2)">于是方案 = 选若干"段首"插针；每段代价 = 段首针费 + 段内各弹珠到段首的距离和。</text>
</svg>
