<svg xmlns="http://www.w3.org/2000/svg" width="880" height="404" viewBox="0 0 880 404"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="91"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="404" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">三种颜色的缆车各自独立</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">红车在 0,3,6…；绿车在 1,4,7…；蓝车在 2,5,8…（每车 2 人，上山 30 分钟）</text>
  <g filter="url(#rough2)"><line x1="120" y1="100" x2="120" y2="230" stroke="#e5e5e5" stroke-width="1"/></g>
  <text x="120" y="246" text-anchor="middle" font-size="10.5" fill="#999999" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)"><line x1="166" y1="100" x2="166" y2="230" stroke="#e5e5e5" stroke-width="1"/></g>
  <text x="166" y="246" text-anchor="middle" font-size="10.5" fill="#999999" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><line x1="212" y1="100" x2="212" y2="230" stroke="#e5e5e5" stroke-width="1"/></g>
  <text x="212" y="246" text-anchor="middle" font-size="10.5" fill="#999999" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><line x1="258" y1="100" x2="258" y2="230" stroke="#e5e5e5" stroke-width="1"/></g>
  <text x="258" y="246" text-anchor="middle" font-size="10.5" fill="#999999" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><line x1="304" y1="100" x2="304" y2="230" stroke="#e5e5e5" stroke-width="1"/></g>
  <text x="304" y="246" text-anchor="middle" font-size="10.5" fill="#999999" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><line x1="350" y1="100" x2="350" y2="230" stroke="#e5e5e5" stroke-width="1"/></g>
  <text x="350" y="246" text-anchor="middle" font-size="10.5" fill="#999999" filter="url(#rough2)">5</text>
  <g filter="url(#rough2)"><line x1="396" y1="100" x2="396" y2="230" stroke="#e5e5e5" stroke-width="1"/></g>
  <text x="396" y="246" text-anchor="middle" font-size="10.5" fill="#999999" filter="url(#rough2)">6</text>
  <g filter="url(#rough2)"><line x1="442" y1="100" x2="442" y2="230" stroke="#e5e5e5" stroke-width="1"/></g>
  <text x="442" y="246" text-anchor="middle" font-size="10.5" fill="#999999" filter="url(#rough2)">7</text>
  <g filter="url(#rough2)"><line x1="488" y1="100" x2="488" y2="230" stroke="#e5e5e5" stroke-width="1"/></g>
  <text x="488" y="246" text-anchor="middle" font-size="10.5" fill="#999999" filter="url(#rough2)">8</text>
  <g filter="url(#rough2)"><line x1="534" y1="100" x2="534" y2="230" stroke="#e5e5e5" stroke-width="1"/></g>
  <text x="534" y="246" text-anchor="middle" font-size="10.5" fill="#999999" filter="url(#rough2)">9</text>
  <text x="108" y="114" text-anchor="end" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">红</text>
  <text x="108" y="154" text-anchor="end" font-size="12" fill="#3d6b2f" font-weight="bold" filter="url(#rough2)">绿</text>
  <text x="108" y="194" text-anchor="end" font-size="12" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">蓝</text>
  <g filter="url(#rough2)"><rect x="106" y="102" width="28" height="28" rx="3" fill="#f6d9d7" fill-opacity="0.8" stroke="#778899" stroke-width="1.1"/></g>
  <g filter="url(#rough2)"><rect x="244" y="102" width="28" height="28" rx="3" fill="#f6d9d7" fill-opacity="0.8" stroke="#778899" stroke-width="1.1"/></g>
  <g filter="url(#rough2)"><rect x="382" y="102" width="28" height="28" rx="3" fill="#f6d9d7" fill-opacity="0.8" stroke="#778899" stroke-width="1.1"/></g>
  <g filter="url(#rough2)"><rect x="152" y="142" width="28" height="28" rx="3" fill="#d7ecd0" fill-opacity="0.8" stroke="#778899" stroke-width="1.1"/></g>
  <g filter="url(#rough2)"><rect x="290" y="142" width="28" height="28" rx="3" fill="#d7ecd0" fill-opacity="0.8" stroke="#778899" stroke-width="1.1"/></g>
  <g filter="url(#rough2)"><rect x="428" y="142" width="28" height="28" rx="3" fill="#d7ecd0" fill-opacity="0.8" stroke="#778899" stroke-width="1.1"/></g>
  <g filter="url(#rough2)"><rect x="198" y="182" width="28" height="28" rx="3" fill="#cfe0f5" fill-opacity="0.8" stroke="#778899" stroke-width="1.1"/></g>
  <g filter="url(#rough2)"><rect x="336" y="182" width="28" height="28" rx="3" fill="#cfe0f5" fill-opacity="0.8" stroke="#778899" stroke-width="1.1"/></g>
  <g filter="url(#rough2)"><rect x="474" y="182" width="28" height="28" rx="3" fill="#cfe0f5" fill-opacity="0.8" stroke="#778899" stroke-width="1.1"/></g>
  <text x="440" y="196" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">第 k 辆该色车到站时刻 = 颜色偏移 + 3(k−1)，到山顶 = 再 +30</text>
  <g filter="url(#rough2)"><rect x="120" y="262" width="640" height="112" rx="4" fill="#ffffff" fill-opacity="0.0" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="5 4"/></g>
  <text x="440" y="288" text-anchor="middle" font-size="12" fill="#3d6b2f" filter="url(#rough2)">每组需要 ⌈人数/2⌉ 辆车，所以该组完成时刻 = 偏移 + 3(⌈人数/2⌉−1) + 30</text>
  <text x="440" y="316" text-anchor="middle" font-size="12" fill="#8a2b28" filter="url(#rough2)">三组互不干扰（学生只坐自己颜色的车），答案取三者的最大值</text>
  <text x="440" y="344" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">人数为 0 的组不参与比较</text>
</svg>
