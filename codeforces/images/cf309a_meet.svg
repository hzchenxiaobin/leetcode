<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="240" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两人只有在相向而行时才可能相遇</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">同向同速 → 距离恒定，永不相遇</text>
  <text x="150" y="100" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">设顺时针距离 d = a_j - a_i；两种情况：</text>
  <text x="150" y="140" text-anchor="start" font-size="12" fill="#2f4a66" filter="url(#rough2)">① 先相遇于 d（时间 d/2），之后每 l/2 一次：次数 = floor((2t-d)/l)+1</text>
  <text x="150" y="178" text-anchor="start" font-size="12" fill="#3d6b2f" filter="url(#rough2)">② 先相遇于 l-d，同理次数 = floor((2t-(l-d))/l)+1</text>
</svg>
