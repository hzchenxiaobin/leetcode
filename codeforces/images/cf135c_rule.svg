<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1351"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="320" fill="#fafafa"/>
  <text x="360.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">固定串的结局判据</text>
  <path d="M 115.2 42 Q 360.0 48 604.8 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="360.0" y="306" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">m=n−2；0 出现 ⇔ c0>⌊m/2⌋；1 出现 ⇔ c1>⌈m/2⌉</text>
  <rect x="60" y="80" width="600" height="60" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#335478" filter="url(#rough2)">两者都出现 ⇒ 结果 = (另一种数字) + 原串最后一张</text>
  <text x="360" y="130" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">只出现 0 ⇒ "00"；只出现 1 ⇒ "11"</text>
  <rect x="60" y="175" width="600" height="50" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="205" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">样例 1010：c0=c1=2，m=2 ⇒ 都出现，末位 0 → "10"</text>
  <text x="360" y="260" text-anchor="middle" font-size="11" fill="#8c2f2c" filter="url(#rough2)">判据已对 n≤7 全串 + 完整博弈搜索逐一验证</text>
</svg>
