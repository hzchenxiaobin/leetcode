<svg xmlns="http://www.w3.org/2000/svg" width="740" height="380" viewBox="0 0 740 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="131"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="740" height="380" fill="#fafafa"/>
  <text x="370" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">相邻两个点的距离 = ext + name + 至少一个点，故只能落在 3..12</text>
  <path d="M 180 46 Q 370 52 560 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="90" y="86" text-anchor="start" font-size="12" font-weight="normal" fill="#555" filter="url(#rough2)">一段的结构：</text>
  <rect x="90" y="98" width="27" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="103.5" y="118" text-anchor="middle" font-size="10" font-weight="normal" fill="#2f4a66" filter="url(#rough2)">a</text>
  <rect x="120" y="98" width="27" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="133.5" y="118" text-anchor="middle" font-size="10" font-weight="normal" fill="#2f4a66" filter="url(#rough2)">b</text>
  <rect x="150" y="98" width="27" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="163.5" y="118" text-anchor="middle" font-size="10" font-weight="normal" fill="#2f4a66" filter="url(#rough2)">c</text>
  <rect x="180" y="98" width="27" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="193.5" y="118" text-anchor="middle" font-size="10" font-weight="normal" fill="#2f4a66" filter="url(#rough2)">d</text>
  <rect x="210" y="98" width="27" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="223.5" y="118" text-anchor="middle" font-size="10" font-weight="normal" fill="#2f4a66" filter="url(#rough2)">e</text>
  <rect x="240" y="98" width="27" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="253.5" y="118" text-anchor="middle" font-size="10" font-weight="normal" fill="#2f4a66" filter="url(#rough2)">f</text>
  <rect x="270" y="98" width="27" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="283.5" y="118" text-anchor="middle" font-size="10" font-weight="normal" fill="#2f4a66" filter="url(#rough2)">g</text>
  <rect x="300" y="98" width="27" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="313.5" y="118" text-anchor="middle" font-size="10" font-weight="normal" fill="#2f4a66" filter="url(#rough2)">h</text>
  <text x="338" y="118" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">.</text>
  <rect x="352" y="98" width="27" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="365.5" y="118" text-anchor="middle" font-size="10" font-weight="normal" fill="#2f5223" filter="url(#rough2)">x</text>
  <rect x="382" y="98" width="27" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="395.5" y="118" text-anchor="middle" font-size="10" font-weight="normal" fill="#2f5223" filter="url(#rough2)">x</text>
  <rect x="412" y="98" width="27" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="425.5" y="118" text-anchor="middle" font-size="10" font-weight="normal" fill="#2f5223" filter="url(#rough2)">x</text>
  <text x="210" y="148" text-anchor="middle" font-size="11" font-weight="normal" fill="#2f4a66" filter="url(#rough2)">name：1..8 个字母</text>
  <text x="370" y="148" text-anchor="middle" font-size="11" font-weight="normal" fill="#2f5223" filter="url(#rough2)">ext：1..3 个字母</text>
  <text x="70" y="206" text-anchor="start" font-size="12" font-weight="normal" fill="#555" filter="url(#rough2)">相邻两个点：</text>
  <circle cx="170" cy="230" r="7" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="470" cy="230" r="7" fill="#b85450" filter="url(#rough2)"/>
  <text x="170" y="254" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#b85450" filter="url(#rough2)">点 i-1</text>
  <text x="470" y="254" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#b85450" filter="url(#rough2)">点 i</text>
  <line x1="170" y1="230" x2="470" y2="230" stroke="#446688" stroke-width="1.4" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="320.0" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">g = e + a + 1</text>
  <text x="360.0" y="246" text-anchor="start" font-size="10.5" font-weight="normal" fill="#4a7a3a" filter="url(#rough2)">最小 1+1+1 = 3</text>
  <text x="360.0" y="262" text-anchor="start" font-size="10.5" font-weight="normal" fill="#b85450" filter="url(#rough2)">最大 3+8+1 = 12</text>
  <rect x="70" y="288" width="600" height="76" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="86" y="312" text-anchor="start" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">四条判定：① 有点  ② 首点下标 ∈ [1,8]  ③ 点距 ∈ [3,12]  ④ 末段 ext 长 ∈ [1,3]</text>
  <text x="86" y="334" text-anchor="start" font-size="11" font-weight="normal" fill="#7a5a1b" filter="url(#rough2)">构造时取 e = max(1, 点距 − 9)：既保证下一段 name ≤ 8，又保证 e ≤ 3。</text>
  <text x="86" y="354" text-anchor="start" font-size="11" font-weight="normal" fill="#7a5a1b" filter="url(#rough2)">四个条件全过就一定切得出来——因为每段的 e 只影响下一段 name 长，彼此独立。</text>
</svg>
