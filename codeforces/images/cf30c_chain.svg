<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="151"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="300" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按时间排序，能接上的前驱才能转移</text>
  <g filter="url(#rough2)">
    <circle cx="90" cy="120" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="90" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66">t=0</text>
    <circle cx="250" cy="120" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="250" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66">t=3</text>
    <circle cx="410" cy="120" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="410" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66">t=5</text>
    <circle cx="570" cy="120" r="24" fill="#fdf3e3" stroke="#d6a040" stroke-width="2"/>
    <text x="570" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6015">t=9</text>
  </g>
  <g stroke="#446688" stroke-width="1.8" filter="url(#rough2)">
    <line x1="114" y1="120" x2="222" y2="120" marker-end="url(#ar)"/>
    <line x1="274" y1="120" x2="382" y2="120" marker-end="url(#ar)"/>
    <line x1="434" y1="120" x2="542" y2="120" marker-end="url(#ar)"/>
  </g>
  <g font-size="11.5" fill="#555" filter="url(#rough2)" text-anchor="middle">
    <text x="168" y="108">距离 ≤ 3</text>
    <text x="328" y="108">距离 ≤ 2</text>
    <text x="488" y="108">距离 ≤ 4</text>
  </g>
  <text x="360" y="176" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">dp[i] = p_i + max(0, dp[j] for 可达的 j)，答案 = max dp[i]</text>
  <rect x="70" y="200" width="580" height="76" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="86" y="224" font-size="12.5" fill="#8a6015" filter="url(#rough2)">期望可加：瞄准 k 个靶子的期望就是它们的 p 之和（命中相互独立）。</text>
  <text x="86" y="248" font-size="12.5" fill="#8a6015" filter="url(#rough2)">t=0 时准星可以放在任意位置，所以第一个靶子不受限制（best 从 0 开始）。</text>
  <text x="86" y="270" font-size="12" fill="#8a6015" filter="url(#rough2)">同一时刻、不同位置的两个靶子距离 &gt; 0 = Δt，无法连续命中。</text>
</svg>
