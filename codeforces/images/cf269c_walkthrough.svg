<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="59"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="a10" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">样例 2 走查：1 → 3 → 2 → 4，边权都是 10 与 5</text>
  <path d="M 110 42 Q 360 48 610 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 图 -->
  <g filter="url(#rough2)">
    <circle cx="120" cy="110" r="26" fill="#dfeafc" stroke="#446688" stroke-width="1.8"/>
    <circle cx="300" cy="110" r="26" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="480" cy="110" r="26" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.8"/>
    <circle cx="620" cy="180" r="26" fill="#fbeeee" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <g font-size="15" text-anchor="middle" fill="#22314a" filter="url(#rough2)">
    <text x="120" y="116">1</text>
    <text x="300" y="116">3</text>
    <text x="480" y="116">2</text>
    <text x="620" y="186">4</text>
  </g>
  <g font-size="12" fill="#556" filter="url(#rough2)">
    <text x="200" y="98">10</text>
    <text x="390" y="98">10</text>
    <text x="390" y="140">5</text>
    <text x="560" y="130">15</text>
    <text x="556" y="210">5</text>
  </g>
  <g stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)">
    <path d="M 146 110 L 270 110" marker-end="url(#a10)"/>
    <path d="M 326 110 L 450 110" marker-end="url(#a10)"/>
    <path d="M 462 132 L 336 132" marker-end="url(#a10)"/>
    <path d="M 494 132 L 602 166" marker-end="url(#a10)"/>
    <path d="M 480 136 L 480 168" marker-end="url(#a10)"/>
  </g>

  <!-- 步骤 -->
  <g filter="url(#rough2)">
    <rect x="60" y="222" width="620" height="150" rx="8" fill="#ffffff" stroke="#888" stroke-width="1.2"/>
  </g>
  <g font-size="12.5" fill="#333" filter="url(#rough2)">
    <text x="74" y="246">W = (20, 30, 20, 20)：1 号 10+10，2 号 10+5+15，3 号 10+5+5，4 号 15+5。</text>
    <text x="74" y="272">处理 1：把 1-2、1-3 都朝外 ⇒ in[2]=10，in[3]=10 = 20/2 ⇒ 3 入队。</text>
    <text x="74" y="296">处理 3：把 3-2 朝 3→2、3-4 朝 3→4 ⇒ in[2]=15 = 30/2 ⇒ 2 入队，in[4]=5。</text>
    <text x="74" y="320">处理 2：把 2-4 朝 2→4 ⇒ in[4]=20（4 是终点，不检查一半）。</text>
    <text x="74" y="344">所有边都定向完，4 从未进队列（也不该进）。</text>
    <text x="74" y="364" fill="#8a3a36">输出方向：0 0 1 1 0 —— 与样例一致。</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="384" width="620" height="36" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="74" y="408" font-size="12.5" fill="#22314a" filter="url(#rough2)">
    注意 2 号点先收到 10，再收到 5 才正好到一半——「恰好一半」这一刻才允许把剩余边全推出去。
  </text>
</svg>
