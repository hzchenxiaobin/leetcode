<svg xmlns="http://www.w3.org/2000/svg" width="740" height="350" viewBox="0 0 740 350"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="139"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ga" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="gb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="740" height="350" fill="#fafafa"/>
  <text x="370" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">把"插入休息"换成"相邻两步之间隔几拍"：g₁ = 3，g₂ = 2，g₃ = 1</text>

  <!-- 拍尺 -->
  <line x1="70" y1="150" x2="690" y2="150" stroke="#2b2b2b" stroke-width="1.6" filter="url(#rough2)"/>
  <g font-size="10.5" fill="#8a8a8a" filter="url(#rough2)" text-anchor="middle">
    <text x="110" y="170">0</text><text x="190" y="170">1</text><text x="270" y="170">2</text>
    <text x="350" y="170">3</text><text x="430" y="170">4</text><text x="510" y="170">5</text>
    <text x="590" y="170">6</text><text x="670" y="170">7</text>
  </g>
  <g stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)">
    <line x1="110" y1="140" x2="110" y2="158"/><line x1="190" y1="140" x2="190" y2="158"/>
    <line x1="270" y1="140" x2="270" y2="158"/><line x1="350" y1="140" x2="350" y2="158"/>
    <line x1="430" y1="140" x2="430" y2="158"/><line x1="510" y1="140" x2="510" y2="158"/>
    <line x1="590" y1="140" x2="590" y2="158"/><line x1="670" y1="140" x2="670" y2="158"/>
  </g>

  <!-- 三个步 -->
  <g filter="url(#rough2)">
    <circle cx="110" cy="150" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="110" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66">L</text>
    <circle cx="350" cy="150" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="350" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66">R</text>
    <circle cx="510" cy="150" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="510" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66">R</text>
    <circle cx="590" cy="150" r="15" fill="#fce8e6" stroke="#b85450" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="590" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#8f3b37">L</text>
  </g>

  <!-- 间隔弧 -->
  <path d="M118,132 Q230,74 342,132" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#ga)" filter="url(#rough2)"/>
  <text x="230" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">g₁ = 3（奇数，相位翻转）</text>

  <path d="M358,132 Q430,86 502,132" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#ga)" filter="url(#rough2)"/>
  <text x="430" y="104" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">g₂ = 2（偶数）</text>

  <path d="M518,132 Q555,104 585,132" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#gb)" filter="url(#rough2)"/>
  <text x="612" y="112" font-size="12" fill="#8f3b37" filter="url(#rough2)">g₃ = 1</text>

  <!-- 下界说明 -->
  <rect x="60" y="196" width="620" height="132" rx="10" fill="#f4f6f9" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <g font-size="12.5" fill="#2f4a66" filter="url(#rough2)">
    <text x="76" y="222">原序列 LXRR 中，L 与第一个 R 之间有 1 个 X ⇒ g₁ ≥ 2；两个 R 同脚 ⇒ g₂ ≥ 2；R 回到 L 没有 X ⇒ g₃ ≥ 1。</text>
    <text x="76" y="248">最优解把 g₁ 抬到 3（为了翻转相位），g₂ = 2，g₃ = 1，于是 T = 3+2+1 = 6，与 LXXRXR 的 6 拍一致。</text>
    <text x="76" y="274">一般地：g_i ≥ m_i = max(1 + x_i, 同脚 ? 2 : 1)，而"多抬 1"就是唯一的调节手段（偶数抬升只增大分母）。</text>
    <text x="76" y="304" font-weight="bold" fill="#8f3b37">相位 σ_i = b_i mod 2 决定第 i 步是否正确；g 奇则翻转，g 偶则保持。</text>
  </g>
</svg>
