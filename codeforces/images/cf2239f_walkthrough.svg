<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 404" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="404" fill="#fafafa" filter="url(#rough2)"/>
  <text x="310" y="26" text-anchor="middle" font-size="15.5" fill="#333" filter="url(#rough2)">示例 4 演算：n = 3，区间 (1,2), (1,1), (1,1)</text>
  <text x="310" y="42" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">三个颜色都有下界 ⇒ m = (0,0,0)，δ = (2,1,1)，L = 0；枚举 U 的 8 种取法</text>

  <!-- counted rows -->
  <rect x="24" y="76" width="572" height="30" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="24" y="226" width="572" height="30" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="24" y="256" width="572" height="30" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="24" y="286" width="572" height="30" fill="#e6f4ea" filter="url(#rough2)"/>

  <rect x="24" y="46" width="572" height="270" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <line x1="24" y1="76" x2="596" y2="76" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="24" y1="106" x2="596" y2="106" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="24" y1="136" x2="596" y2="136" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="24" y1="166" x2="596" y2="166" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="24" y1="196" x2="596" y2="196" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="24" y1="226" x2="596" y2="226" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="24" y1="256" x2="596" y2="256" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="24" y1="286" x2="596" y2="286" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="24" y1="316" x2="596" y2="316" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>

  <line x1="120" y1="46" x2="120" y2="316" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="290" y1="46" x2="290" y2="316" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="350" y1="46" x2="350" y2="316" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="420" y1="46" x2="420" y2="316" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="556" y1="46" x2="556" y2="316" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <text x="72" y="65" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">U</text>
  <text x="205" y="65" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">b^U = (b₁,b₂,b₃)</text>
  <text x="320" y="65" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">S</text>
  <text x="385" y="65" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">2·max</text>
  <text x="488" y="65" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">S 偶 且 2max ≤ S</text>
  <text x="576" y="65" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">计入</text>

  <text x="72" y="96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">∅</text>
  <text x="205" y="96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(0,0,0)</text>
  <text x="320" y="96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="385" y="96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="488" y="96" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">偶, 0 ≤ 0 ✓</text>
  <text x="576" y="96" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <text x="72" y="126" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{1}</text>
  <text x="205" y="126" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(2,0,0)</text>
  <text x="320" y="126" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="385" y="126" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="488" y="126" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">4 &gt; 2 色 1 支配</text>
  <text x="576" y="126" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗</text>

  <text x="72" y="156" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{2}</text>
  <text x="205" y="156" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(0,1,0)</text>
  <text x="320" y="156" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="385" y="156" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="488" y="156" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">S 为奇 ✗</text>
  <text x="576" y="156" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗</text>

  <text x="72" y="186" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{3}</text>
  <text x="205" y="186" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(0,0,1)</text>
  <text x="320" y="186" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="385" y="186" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="488" y="186" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">S 为奇 ✗</text>
  <text x="576" y="186" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗</text>

  <text x="72" y="216" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{1,2}</text>
  <text x="205" y="216" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(2,1,0)</text>
  <text x="320" y="216" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="385" y="216" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="488" y="216" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">S 为奇 ✗</text>
  <text x="576" y="216" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗</text>

  <text x="72" y="246" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{1,3}</text>
  <text x="205" y="246" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(2,0,1)</text>
  <text x="320" y="246" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="385" y="246" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="488" y="246" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">S 为奇 ✗</text>
  <text x="576" y="246" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗</text>

  <text x="72" y="276" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{2,3}</text>
  <text x="205" y="276" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(0,1,1)</text>
  <text x="320" y="276" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="385" y="276" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="488" y="276" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">偶, 2 ≤ 2 ✓</text>
  <text x="576" y="276" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <text x="72" y="306" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{1,2,3}</text>
  <text x="205" y="306" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(2,1,1)</text>
  <text x="320" y="306" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="385" y="306" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="488" y="306" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">偶, 4 ≤ 4 ✓</text>
  <text x="576" y="306" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <text x="310" y="342" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">绿色 3 行计入 ⇒ 答案 3 ≡ 1 (mod 2)，与样例输出 1 一致</text>
  <text x="310" y="364" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">A = #{S 偶} = 4（∅, {1}, {2,3}, {1,2,3}），B = #{被支配} = 1（即 {1}），A − B = 3</text>
</svg>
