<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 424" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#777"/>
    </marker>
  </defs>

  <rect width="660" height="424" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">按「a_i 与 b_i 是否相等」把下标分成四类</text>
  <text x="330" y="52" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">一次操作 = 选非空下标集 S，要求 S 中「当前的 1」个数为奇数，再整集取反</text>
  <text x="64" y="106" text-anchor="end" font-size="13" fill="#555" filter="url(#rough2)">a</text>
  <text x="64" y="146" text-anchor="end" font-size="13" fill="#555" filter="url(#rough2)">b</text>
  <text x="64" y="186" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">类型</text>
  <rect x="78" y="84" width="56" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
