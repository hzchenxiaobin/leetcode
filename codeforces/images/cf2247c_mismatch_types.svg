  <text x="170" y="106" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="142" y="124" width="56" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="170" y="146" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="142" y="164" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="170" y="181" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">D</text>
