  <text x="234" y="106" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="206" y="124" width="56" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="234" y="146" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="206" y="164" width="56" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="234" y="181" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">C</text>
  <rect x="270" y="84" width="56" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="298" y="106" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="270" y="124" width="56" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="298" y="146" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="270" y="164" width="56" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="298" y="181" text-anchor="middle" font-size="12" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">C</text>
  <rect x="334" y="84" width="56" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="362" y="106" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="334" y="124" width="56" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="362" y="146" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="334" y="164" width="56" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="362" y="181" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">B</text>
  <rect x="398" y="84" width="56" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="426" y="106" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="398" y="124" width="56" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="426" y="146" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="398" y="164" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="426" y="181" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">D</text>
