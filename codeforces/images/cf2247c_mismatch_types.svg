  <rect x="462" y="164" width="56" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="490" y="181" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">A</text>
  <rect x="526" y="84" width="56" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="554" y="106" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="526" y="124" width="56" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="554" y="146" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="526" y="164" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="554" y="181" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">D</text>
  <text x="330" y="208" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">↓ 本例：A 型 2 个（p=2）、B 型 1 个、C 型 2 个、D 型 3 个</text>
  <rect x="64" y="224" width="272" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="74" y="247" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">A：a=1, b=0（1→0 型），共 p 个</text>
  <rect x="364" y="224" width="272" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="374" y="247" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">B：a=0, b=1（0→1 型）</text>
  <rect x="64" y="270" width="272" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="74" y="293" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">C：a=b=1（相等的 1，可当跳板）</text>
  <rect x="364" y="270" width="272" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="374" y="293" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">D：a=b=0（相等的 0，可当跳板）</text>
  <rect x="64" y="330" width="532" height="62" fill="#ffffff" stroke="#888" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="76" y="352" font-size="11" fill="#444" filter="url(#rough2)">取 S = D（全部差异位）：S 中 1 的个数恰为 p  ⇒  p 为奇数时一次操作就能收工</text>
  <text x="76" y="376" font-size="11" fill="#444" filter="url(#rough2)">p 为偶数时这一刀「和为偶」砍不动：p≥2 就拆成两块，p=0 则要借两个跳板位</text>
</svg>
