<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="585"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8a2b28"/>
    </marker>
  </defs>
  <rect width="760" height="340" fill="#fafafa"/>
  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">美丽序列的形状固定：b_i = h + d_i，d_i = min(i, n−1−i)，只差一个整体抬升 h</text>
  <path d="M 60 40 Q 380 48 700 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <text x="40" y="80" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">位移 d_i（n = 9）</text>
  <g font-size="10">
    <rect x="50" y="86" width="40" height="26" rx="5" fill="#cfe0f5" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="70" y="103" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">0</text>
    <rect x="96" y="86" width="40" height="26" rx="5" fill="#cfe0f5" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="116" y="103" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">1</text>
    <rect x="142" y="86" width="40" height="26" rx="5" fill="#cfe0f5" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="162" y="103" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">2</text>
    <rect x="188" y="86" width="40" height="26" rx="5" fill="#cfe0f5" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="208" y="103" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">3</text>
    <rect x="234" y="86" width="40" height="26" rx="5" fill="#fbe3c8" stroke="#8a2b28" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="254" y="103" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">4</text>
    <rect x="280" y="86" width="40" height="26" rx="5" fill="#cfe0f5" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="300" y="103" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">3</text>
    <rect x="326" y="86" width="40" height="26" rx="5" fill="#cfe0f5" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="346" y="103" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">2</text>
    <rect x="372" y="86" width="40" height="26" rx="5" fill="#cfe0f5" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="392" y="103" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">1</text>
    <rect x="418" y="86" width="40" height="26" rx="5" fill="#cfe0f5" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="438" y="103" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">0</text>
  </g>

  <text x="40" y="150" font-size="11.5" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">每棵树给出一个候选 h = a_i − d_i</text>
  <rect x="50" y="162" width="408" height="56" rx="8" fill="#d9ecd4" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="64" y="184" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">例：a = 5 6 7 9 10 7 6 5 3</text>
  <text x="64" y="204" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">候选 h：5 5 5 6 6 4 4 4 3（h 必须 ≥ 1）</text>
  <text x="474" y="184" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">取出现次数最多的 h</text>
  <text x="474" y="204" font-size="10.8" fill="#8a2b28" filter="url(#rough2)">h = 5 出现 3 次 → 改 6 棵</text>

  <rect x="40" y="238" width="680" height="44" rx="9" fill="#f6d5d5" stroke="#8a2b28" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="54" y="258" font-size="11" fill="#2b2b2b" filter="url(#rough2)">a_i 与 h + d_i 相同的树不用改；不同的树必须改。所以固定 h 时改动数 = n − (满足 a_i − d_i = h 的 i 的个数)。</text>
  <text x="54" y="275" font-size="11" fill="#2b2b2b" filter="url(#rough2)">枚举所有可能的 h（a_i − d_i ≥ 1 的那些），取计数最大者即可；h 只有 n 个候选。</text>

  <text x="40" y="308" font-size="10.5" fill="#555555" filter="url(#rough2)">注意 h + d_i 必须为正整数：h = a_i − d_i 只有 ≥ 1 时才可能是答案。</text>
  <text x="40" y="326" font-size="10.5" fill="#555555" filter="url(#rough2)">若所有候选都 &lt; 1，说明没有任何 h 能"顺便"保留任何树，答案就是 n（任选 h = 1 全部改）。</text>
</svg>
