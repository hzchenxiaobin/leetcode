<svg xmlns="http://www.w3.org/2000/svg" width="880" height="510" viewBox="0 0 880 510"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr8" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="880" height="510" fill="#fafafa"/>

  <text x="440" y="34" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">示例 1：atob / a / b —— 只有一个方向说得通</text>
  <path d="M 120 46 Q 440 52 760 46" stroke="#2b2b2b" stroke-width="1.2" fill="none"
        filter="url(#rough2)"/>

  <text x="60" y="82" font-size="13" fill="#44597a" filter="url(#rough2)">A → B：站序 s0</text>
  <text x="346" y="82" font-size="12" fill="#8a8a8a" filter="url(#rough2)">（4 个站，站上没有旗子的方向不参与）</text>

  <rect x="60" y="92" width="68" height="68" rx="6" fill="#dbe7fb" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="128" y="92" width="68" height="68" rx="6" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="196" y="92" width="68" height="68" rx="6" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="264" y="92" width="68" height="68" rx="6" fill="#fff3d6" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="94.0" y="135.0" text-anchor="middle" font-size="30" fill="#23405c" filter="url(#rough2)">a</text>
  <text x="162.0" y="135.0" text-anchor="middle" font-size="30" fill="#555" filter="url(#rough2)">t</text>
  <text x="230.0" y="135.0" text-anchor="middle" font-size="30" fill="#555" filter="url(#rough2)">o</text>
  <text x="298.0" y="135.0" text-anchor="middle" font-size="30" fill="#8a6015" filter="url(#rough2)">b</text>

  <path d="M 60 168 L 60 175 L 128 175 L 128 168" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="94.0" y="196" text-anchor="middle" font-size="12" fill="#23405c" filter="url(#rough2)">s1 = a（第 0 站）</text>
  <path d="M 264 168 L 264 175 L 332 175 L 332 168" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="298.0" y="196" text-anchor="middle" font-size="12" fill="#23405c" filter="url(#rough2)">s2 = b（第 3 站）</text>

  <text x="362" y="140" font-size="12.5" fill="#23405c" filter="url(#rough2)">① 先找到 s1：0 号站是 a</text>
  <text x="362" y="162" font-size="12.5" fill="#23405c" filter="url(#rough2)">② 从 1 号站往后找 s2：3 号站是 b</text>
  <text x="362" y="186" font-size="13" fill="#2f5223" filter="url(#rough2)">A → B 可行 ✓</text>

  <!-- 反转 -->
  <path d="M 200 238 L 200 258" stroke="#b85450" stroke-width="1.6" fill="none"
        marker-end="url(#arr8)" filter="url(#rough2)"/>
  <text x="212" y="252" font-size="12" fill="#8c3b37" filter="url(#rough2)">反转站序</text>

  <text x="60" y="292" font-size="13" fill="#44597a" filter="url(#rough2)">B → A：站序变成 s0 的反转</text>

  <rect x="60" y="302" width="68" height="68" rx="6" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="128" y="302" width="68" height="68" rx="6" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="196" y="302" width="68" height="68" rx="6" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="264" y="302" width="68" height="68" rx="6" fill="#dbe7fb" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="94.0" y="345.0" text-anchor="middle" font-size="30" fill="#555" filter="url(#rough2)">b</text>
  <text x="162.0" y="345.0" text-anchor="middle" font-size="30" fill="#555" filter="url(#rough2)">o</text>
  <text x="230.0" y="345.0" text-anchor="middle" font-size="30" fill="#555" filter="url(#rough2)">t</text>
  <text x="298.0" y="345.0" text-anchor="middle" font-size="30" fill="#23405c" filter="url(#rough2)">a</text>

  <path d="M 264 378 L 264 385 L 332 385 L 332 378" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="298.0" y="406" text-anchor="middle" font-size="12" fill="#23405c" filter="url(#rough2)">s1 = a（第 3 站）</text>

  <text x="362" y="350" font-size="12.5" fill="#23405c" filter="url(#rough2)">① s1 只能落在 3 号站（最后一个）</text>
  <text x="362" y="372" font-size="12.5" fill="#23405c" filter="url(#rough2)">② 它右边已经没有任何站，找不到 s2</text>
  <text x="362" y="396" font-size="13" fill="#8c3b37" filter="url(#rough2)">B → A 不可行 ✗</text>

  <rect x="286" y="430" width="308" height="52" rx="8" fill="#eef1f7" stroke="#7a8ca6"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="440" y="452" text-anchor="middle" font-size="12" fill="#44597a" filter="url(#rough2)">两个方向各查一次，只有 A→B 成立</text>
  <text x="440" y="472" text-anchor="middle" font-size="15" font-weight="bold" fill="#23405c"
        filter="url(#rough2)">输出 forward</text>
</svg>
