<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="489"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="320" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">Steiner 树 DP：dp[mask][v]</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">① 在同一格合并两个子集　② 沿网格做最短路松弛</text>
  <g filter="url(#rough2)"><rect x="60" y="96" width="380" height="76" rx="6" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="250" y="124" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">① 合并</text>
  <text x="250" y="152" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">dp[sub][v] + dp[mask^sub][v] − a[v]</text>
  <g filter="url(#rough2)"><rect x="480" y="96" width="380" height="76" rx="6" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="670" y="124" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">② 扩展</text>
  <text x="670" y="152" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">dp[mask][u] + a[v]（v 与 u 相邻）</text>
  <g filter="url(#rough2)"><rect x="60" y="196" width="800" height="50" rx="6" fill="#f3d9d6" fill-opacity="0.4" stroke="#8a2b28" stroke-width="1.4"/></g>
  <text x="460" y="226" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">答案 = min_v dp[2^k−1][v]；回溯时按父指针标记经过的格子</text>
  <text x="450" y="282" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">k ≤ 7 ⇒ 状态 2^7 × 200 = 25600，合并 3^7 × 200 ≈ 4.4e5</text>
</svg>
