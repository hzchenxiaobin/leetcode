<svg xmlns="http://www.w3.org/2000/svg" width="760" height="392" viewBox="0 0 760 392"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c9801f"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a8524a"/>
    </marker>
  </defs>
  <rect width="760" height="392" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">样例走查：什么时候无解，什么时候最小</text>
  <rect x="40.0" y="64.0" width="680.0" height="90.0" rx="10" fill="#fbeeee" stroke="#a8524a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="58.0" y="90.0" text-anchor="start" font-size="13" fill="#a8524a" font-weight="bold" filter="url(#rough2)">样例 1：k = 3，a?c</text>
  <text x="58.0" y="116.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">镜像对 (a, c) 冲突：回文要求两端相同</text>
  <text x="58.0" y="138.0" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">又无问号可改 → IMPOSSIBLE</text>
  <rect x="40.0" y="168.0" width="680.0" height="90.0" rx="10" fill="#f4f9f2" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="58.0" y="194.0" text-anchor="start" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">样例 2：k = 2，a??a</text>
  <text x="58.0" y="220.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">两端 a 固定；中间一对空闲，缺失 {b}</text>
  <text x="58.0" y="242.0" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">填 b → abba（唯一解）</text>
  <rect x="40.0" y="272.0" width="680.0" height="90.0" rx="10" fill="#f7f9fc" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="58.0" y="298.0" text-anchor="start" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">样例 3：k = 2，?b?a</text>
  <text x="58.0" y="324.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">(?, a) → 写 a；(b, ?) → 写 b</text>
  <text x="58.0" y="346.0" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">对齐后无空闲，已含 a、b → abba</text>
  <text x="380.0" y="382.0" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">无解的本质：回文约束把模板钉死，剩下的空位不够放满 k 个字母。</text>
</svg>
