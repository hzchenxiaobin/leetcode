<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="340" fill="#fafafa"/>
  <text x="380.0" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">203B：计数器代替每次重扫全图</text>
  <path d="M 152.00 46 Q 380.0 52 608.00 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60" y="70" width="190" height="52" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="88" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">读入第 t 步 (x, y)</text>
  <rect x="300" y="70" width="250" height="52" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="314" y="88" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">枚举 9 个左上角 (i, j)</text>
  <text x="314" y="110" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">cnt[i][j] += 1</text>
  <rect x="600" y="70" width="130" height="52" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="614" y="88" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">任一 cnt = 9 ?</text>
  <path d="M 250 96 L 298 96" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 550 96 L 598 96" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="665" y="150" text-anchor="middle" font-size="11" fill="#2f5b34" filter="url(#rough2)">是 → 输出 t，结束</text>
  <path d="M 665 122 L 665 138" stroke="#5b8c5a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="300" y="160" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">否 → t ← t+1，继续读下一子</text>
  <path d="M 425 122 L 425 142 L 155 142 L 155 124" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <rect x="60" y="185" width="640" height="60" rx="9" fill="#fdeef1" stroke="#c0708a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="203" text-anchor="start" font-size="11" fill="#8a3a52" filter="url(#rough2)">全部 m 步都没有 cnt 到 9 ⇒ 纸面上不存在全黑 3×3，输出 -1。</text>
  <text x="74" y="225" text-anchor="start" font-size="11" fill="#8a3a52" filter="url(#rough2)">cnt[i][j] 只会增加，所以第一次达到 9 的步号就是最早步号。</text>
  <rect x="60" y="262" width="640" height="56" rx="9" fill="#f2f2f2" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="280" text-anchor="start" font-size="11" fill="#3d3d3d" filter="url(#rough2)">复杂度：时间 O(9m)，空间 O(n²)（1000×1000 的 int 计数器 4 MB，远小于 256 MB）。</text>
</svg>
