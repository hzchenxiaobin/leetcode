<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1207"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="320" fill="#fafafa"/>
  <text x="360.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两条同向平行线</text>
  <path d="M 115.2 42 Q 360.0 48 604.8 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="360.0" y="306" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">横切 (i,j) 或竖切 (i,j)，三块产量不计顺序</text>
  <rect x="60" y="70" width="260" height="200" rx="7" fill="#f4f4f1" stroke="#b8b8b0" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="60" y1="136" x2="320" y2="136" stroke="#c8c8c0" stroke-width="1" filter="url(#rough2)"/>
  <line x1="60" y1="202" x2="320" y2="202" stroke="#c8c8c0" stroke-width="1" filter="url(#rough2)"/>
  <line x1="60" y1="268" x2="320" y2="268" stroke="#c8c8c0" stroke-width="1" filter="url(#rough2)"/>
  <line x1="60" y1="136" x2="320" y2="136" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <line x1="60" y1="202" x2="320" y2="202" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="190" y="100" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">块 1</text>
  <text x="190" y="166" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">块 2</text>
  <text x="190" y="232" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">块 3</text>
  <rect x="400" y="70" width="260" height="200" rx="7" fill="#f4f4f1" stroke="#b8b8b0" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="487" y1="70" x2="487" y2="270" stroke="#c8c8c0" stroke-width="1" filter="url(#rough2)"/>
  <line x1="574" y1="70" x2="574" y2="270" stroke="#c8c8c0" stroke-width="1" filter="url(#rough2)"/>
  <line x1="661" y1="70" x2="661" y2="270" stroke="#c8c8c0" stroke-width="1" filter="url(#rough2)"/>
  <line x1="487" y1="70" x2="487" y2="270" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <line x1="574" y1="70" x2="574" y2="270" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="360" y="295" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">横切（红）与竖切（绿）互不叠加；各枚举两条线的位置</text>
</svg>
