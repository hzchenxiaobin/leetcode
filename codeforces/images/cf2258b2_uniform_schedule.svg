<svg xmlns="http://www.w3.org/2000/svg" width="740" height="372" viewBox="0 0 740 372"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#55606e"/>
    </marker>
  </defs>
  <rect width="740" height="372" fill="#fafafa"/>
  <text x="370" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">统一切法：第 t 次操作取 x = 2^(k−t)·L（示例 a = 10L，k = 3）</text>
  <path d="M 130 40 Q 370 48 610 40" stroke="#2b2b2b" stroke-width="1.1" fill="none" filter="url(#rough2)"/>
  <rect x="16" y="62" width="214" height="46" rx="8" fill="#f4f6f8" stroke="#8899aa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="123" y="82" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33475b" filter="url(#rough2)">初始</text>
  <text x="123" y="100" text-anchor="middle" font-size="11" fill="#66788a" filter="url(#rough2)">只有一根 10L</text>
  <rect x="250" y="68" width="58" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="279" y="90" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">10L</text>
  <rect x="16" y="128" width="214" height="46" rx="8" fill="#f4f6f8" stroke="#8899aa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="123" y="148" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33475b" filter="url(#rough2)">第 1 次  x = 4L</text>
  <text x="123" y="166" text-anchor="middle" font-size="11" fill="#66788a" filter="url(#rough2)">10L = 4L + 6L</text>
  <rect x="250" y="134" width="58" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="279" y="156" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">4L</text>
  <rect x="322" y="134" width="58" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="351" y="156" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">6L</text>
  <rect x="16" y="194" width="214" height="46" rx="8" fill="#f4f6f8" stroke="#8899aa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="123" y="214" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33475b" filter="url(#rough2)">第 2 次  x = 2L</text>
  <text x="123" y="232" text-anchor="middle" font-size="11" fill="#66788a" filter="url(#rough2)">两个大块各切一刀</text>
  <rect x="250" y="200" width="50" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="275" y="222" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">2L</text>
  <rect x="314" y="200" width="50" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="339" y="222" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">2L</text>
  <rect x="378" y="200" width="50" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="403" y="222" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">2L</text>
  <rect x="442" y="200" width="50" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="467" y="222" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">4L</text>
  <rect x="16" y="260" width="214" height="46" rx="8" fill="#f4f6f8" stroke="#8899aa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="123" y="280" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33475b" filter="url(#rough2)">第 3 次  x = L</text>
  <text x="123" y="298" text-anchor="middle" font-size="11" fill="#66788a" filter="url(#rough2)">每块 2L 变两块 L</text>
  <rect x="250" y="266" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="288" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">L</text>
  <rect x="304" y="266" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="324" y="288" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">L</text>
  <rect x="358" y="266" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="378" y="288" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">L</text>
  <rect x="412" y="266" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="432" y="288" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">L</text>
  <rect x="466" y="266" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="486" y="288" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">L</text>
  <rect x="520" y="266" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="540" y="288" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">L</text>
  <rect x="574" y="266" width="40" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="594" y="288" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">L</text>
  <rect x="628" y="266" width="46" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="651" y="288" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8f3a36" filter="url(#rough2)">3L</text>
  <text x="370" y="322" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">7 块 L = min(⌊10L/L⌋, 2³ − 1)</text>
  <text x="370" y="344" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">同一 x 序列对所有胡萝卜通用 ⇒ 每根各自成树，块数可以相加</text>
</svg>
