<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="660" height="340" fill="#fafafa"/>

  <text x="330" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">
    一次区间翻转 = 在差分数组 b 上翻两个位置（最少操作数 = run 数）
  </text>

  <!-- T 列号 -->
  <text x="112" y="64" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">1</text>
  <text x="160" y="64" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">2</text>
  <text x="208" y="64" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">3</text>
  <text x="256" y="64" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">4</text>
  <text x="304" y="64" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">5</text>
  <text x="352" y="64" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">6</text>

  <text x="72" y="99" text-anchor="end" font-size="14" fill="#b85450" filter="url(#rough2)">T</text>

  <!-- T 行：0 1 1 0 0 1 -->
  <rect x="90" y="74" width="44" height="34" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.2"
        filter="url(#rough2)"/>
  <text x="112" y="97" text-anchor="middle" font-size="15" fill="#666" filter="url(#rough2)">0</text>
  <rect x="138" y="74" width="44" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"
        filter="url(#rough2)"/>
  <text x="160" y="97" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="186" y="74" width="44" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"
        filter="url(#rough2)"/>
  <text x="208" y="97" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="234" y="74" width="44" height="34" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.2"
        filter="url(#rough2)"/>
  <text x="256" y="97" text-anchor="middle" font-size="15" fill="#666" filter="url(#rough2)">0</text>
  <rect x="282" y="74" width="44" height="34" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.2"
        filter="url(#rough2)"/>
  <text x="304" y="97" text-anchor="middle" font-size="15" fill="#666" filter="url(#rough2)">0</text>
  <rect x="330" y="74" width="44" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"
        filter="url(#rough2)"/>
  <text x="352" y="97" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>

  <!-- run 括号 -->
  <path d="M 140 120 L 140 112 L 228 112 L 228 120" fill="none" stroke="#b85450"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="184" y="134" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">run [2,3]</text>
  <path d="M 332 120 L 332 112 L 372 112 L 372 120" fill="none" stroke="#b85450"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="392" y="118" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">run [6,6]</text>

  <!-- 箭头：run 的两端 → b 的两个位置 -->
  <path d="M 160 146 C 160 170 136 170 136 192" fill="none" stroke="#b85450" stroke-width="1.5"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 208 146 C 208 170 232 170 232 192" fill="none" stroke="#b85450" stroke-width="1.5"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 344 146 C 344 172 328 172 328 192" fill="none" stroke="#d6a040" stroke-width="1.5"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 360 146 C 360 172 376 172 376 192" fill="none" stroke="#d6a040" stroke-width="1.5"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="48" y="221" text-anchor="end" font-size="14" fill="#446688" filter="url(#rough2)">b</text>

  <!-- b 行：0 1 0 1 0 1 1 -->
  <rect x="66" y="196" width="44" height="34" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.2"
        filter="url(#rough2)"/>
  <text x="88" y="219" text-anchor="middle" font-size="15" fill="#666" filter="url(#rough2)">0</text>
  <rect x="114" y="196" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"
        filter="url(#rough2)"/>
  <text x="136" y="219" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="162" y="196" width="44" height="34" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.2"
        filter="url(#rough2)"/>
  <text x="184" y="219" text-anchor="middle" font-size="15" fill="#666" filter="url(#rough2)">0</text>
  <rect x="210" y="196" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"
        filter="url(#rough2)"/>
  <text x="232" y="219" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="258" y="196" width="44" height="34" rx="4" fill="#ffffff" stroke="#888" stroke-width="1.2"
        filter="url(#rough2)"/>
  <text x="280" y="219" text-anchor="middle" font-size="15" fill="#666" filter="url(#rough2)">0</text>
  <rect x="306" y="196" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"
        filter="url(#rough2)"/>
  <text x="328" y="219" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="354" y="196" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2"
        filter="url(#rough2)"/>
  <text x="376" y="219" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>

  <!-- b 的下标 -->
  <text x="88" y="248" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">b0</text>
  <text x="136" y="248" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">b1</text>
  <text x="184" y="248" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">b2</text>
  <text x="232" y="248" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">b3</text>
  <text x="280" y="248" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">b4</text>
  <text x="328" y="248" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">b5</text>
  <text x="376" y="248" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">b6</text>

  <text x="330" y="278" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    b_i = T_i ⊕ T_{i+1}，约定 T_0 = T_{m+1} = 0；翻转 [a,b] ⇔ 翻 b_{a−1} 与 b_b
  </text>
  <text x="330" y="302" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">
    一次操作最多造出 2 个 1 ⇒ 操作数 ≥ #1(b)/2 = run 数，而按每条 run 各翻一次恰好取到等号
  </text>
  <text x="330" y="326" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">
    于是「变为交替串的最少操作数」= 不匹配位置的最大连续段数
  </text>
</svg>
