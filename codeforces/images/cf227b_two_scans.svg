<svg xmlns="http://www.w3.org/2000/svg" width="840" height="360" viewBox="0 0 840 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="360" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两种扫描方向覆盖的下标数</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">值在下标 p 处：Vasya 数从 1 到 p，Petya 数从 n 到 p</text>
  <g filter="url(#rough2)"><rect x="120" y="96" width="68" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="154" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="198" y="96" width="68" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="232" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="276" y="96" width="68" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="310" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="354" y="96" width="68" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="388" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><rect x="432" y="96" width="68" height="44" rx="4" fill="#eeeeee" fill-opacity="0.85" stroke="#aaaaaa" stroke-width="1.3"/></g>
  <text x="466" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <g filter="url(#rough2)"><rect x="510" y="96" width="68" height="44" rx="4" fill="#eeeeee" fill-opacity="0.85" stroke="#aaaaaa" stroke-width="1.3"/></g>
  <text x="544" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">6</text>
  <g filter="url(#rough2)"><rect x="588" y="96" width="68" height="44" rx="4" fill="#eeeeee" fill-opacity="0.85" stroke="#aaaaaa" stroke-width="1.3"/></g>
  <text x="622" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">7</text>
  <g filter="url(#rough2)"><rect x="666" y="96" width="68" height="44" rx="4" fill="#eeeeee" fill-opacity="0.85" stroke="#aaaaaa" stroke-width="1.3"/></g>
  <text x="700" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">8</text>
  <g filter="url(#rough2)"><line x1="154" y1="160" x2="388" y2="160" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)"/></g>
  <text x="271" y="182" text-anchor="middle" font-size="12" fill="#3d6b2f" filter="url(#rough2)">Vasya：p = 4 次</text>
  <g filter="url(#rough2)"><rect x="120" y="210" width="68" height="44" rx="4" fill="#eeeeee" fill-opacity="0.85" stroke="#aaaaaa" stroke-width="1.3"/></g>
  <text x="154" y="239" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="198" y="210" width="68" height="44" rx="4" fill="#eeeeee" fill-opacity="0.85" stroke="#aaaaaa" stroke-width="1.3"/></g>
  <text x="232" y="239" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="276" y="210" width="68" height="44" rx="4" fill="#eeeeee" fill-opacity="0.85" stroke="#aaaaaa" stroke-width="1.3"/></g>
  <text x="310" y="239" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="354" y="210" width="68" height="44" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="388" y="239" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><rect x="432" y="210" width="68" height="44" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="466" y="239" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <g filter="url(#rough2)"><rect x="510" y="210" width="68" height="44" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="544" y="239" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">6</text>
  <g filter="url(#rough2)"><rect x="588" y="210" width="68" height="44" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="622" y="239" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">7</text>
  <g filter="url(#rough2)"><rect x="666" y="210" width="68" height="44" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="700" y="239" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">8</text>
  <g filter="url(#rough2)"><line x1="700" y1="274" x2="388" y2="274" stroke="#a0522d" stroke-width="1.8" marker-end="url(#arrr)"/></g>
  <text x="544" y="296" text-anchor="middle" font-size="12" fill="#8a4b2a" filter="url(#rough2)">Petya：n − p + 1 = 5 次</text>
  <text x="420" y="332" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">两个数相加与查询顺序无关 ⇒ 分别累加即可</text>
</svg>
