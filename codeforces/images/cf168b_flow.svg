<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="760" height="400" fill="#fafafa"/>

  <rect x="40" y="70" width="150" height="66" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="115" y="100" font-size="13" text-anchor="middle" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">读入一行</text>
  <text x="115" y="122" font-size="10.5" text-anchor="middle" fill="#777" filter="url(#rough2)">去掉行尾 CR</text>
  <line x1="190" y1="103" x2="236" y2="103" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="236" y="70" width="170" height="66" rx="8" fill="#eef4fd" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="321" y="100" font-size="12.5" text-anchor="middle" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">是增强行吗？</text>
  <text x="321" y="122" font-size="10.5" text-anchor="middle" fill="#777" filter="url(#rough2)">看第一个非空格</text>
  <line x1="321" y1="136" x2="321" y2="196" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="332" y="168" font-size="12" text-anchor="start" fill="#7a2f2f" filter="url(#rough2)">是</text>
  <line x1="406" y1="103" x2="452" y2="103" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="424" y="94" font-size="12" text-anchor="start" fill="#2f5223" filter="url(#rough2)">否</text>
  <rect x="452" y="70" width="170" height="66" rx="8" fill="#f2f8ee" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="537" y="100" font-size="12.5" text-anchor="middle" fill="#2f5223" font-weight="bold" filter="url(#rough2)">普通行</text>
  <text x="537" y="122" font-size="10.5" text-anchor="middle" fill="#2f5223" filter="url(#rough2)">删空格 → 追加 pending</text>
  <rect x="452" y="210" width="170" height="66" rx="8" fill="#eef4fd" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="537" y="240" font-size="12.5" text-anchor="middle" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">增强行</text>
  <text x="537" y="262" font-size="10.5" text-anchor="middle" fill="#2f4a66" filter="url(#rough2)">冲刷 pending 再输出本行</text>
  <line x1="452" y1="243" x2="420" y2="243" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="330" y1="276" x2="330" y2="300" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="180" y="300" width="300" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="330" y="326" font-size="11.5" text-anchor="middle" fill="#8a6015" filter="url(#rough2)">全部输出行末尾补换行</text>
  <text x="640" y="250" font-size="11.5" text-anchor="start" fill="#555" filter="url(#rough2)">输入结束后</text>
  <text x="640" y="268" font-size="11.5" text-anchor="start" fill="#555" filter="url(#rough2)">pending 非空</text>
  <text x="640" y="286" font-size="11.5" text-anchor="start" fill="#b85450" filter="url(#rough2)">也要冲刷一次</text>
  <text x="380.0" y="36" font-size="20" text-anchor="middle" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">扫描流程：pending 缓冲区攒普通行，遇增强行先冲刷</text>
  <path d="M 120 46 Q 380.0 52 640 46" fill="none" stroke="#2b2b2b" stroke-width="1.3" filter="url(#rough2)"/>
</svg>
