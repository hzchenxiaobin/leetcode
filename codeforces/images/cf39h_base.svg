<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="321"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="320" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">乘出十进制结果，再除基取余转成 k 进制</text>
  <g filter="url(#rough2)">
    <rect x="60" y="56" width="180" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="150" y="85" text-anchor="middle" font-size="13" fill="#2f4a66">v = i * j</text>
    <rect x="290" y="56" width="180" height="46" rx="8" fill="#fdf3e3" stroke="#d6a040" stroke-width="1.5"/>
    <text x="380" y="85" text-anchor="middle" font-size="13" fill="#8a6015">r = v % k</text>
    <rect x="520" y="56" width="150" height="46" rx="8" fill="#eef4ec" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="595" y="85" text-anchor="middle" font-size="13" fill="#2f5223">v = v / k</text>
  </g>
  <g stroke="#446688" stroke-width="1.4" filter="url(#rough2)">
    <line x1="240" y1="79" x2="286" y2="79" marker-end="url(#ar)"/>
    <line x1="470" y1="79" x2="516" y2="79" marker-end="url(#ar)"/>
  </g>
  <text x="360" y="130" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">余数从低位到高位产生，最后逆序拼接</text>
  <g font-size="12.5" filter="url(#rough2)">
    <text x="80" y="170" fill="#2f4a66">k = 3，i = j = 2：v = 4</text>
    <text x="80" y="196" fill="#2f4a66">4 % 3 = 1，v = 1；1 % 3 = 1，v = 0</text>
    <text x="80" y="222" fill="#2f5223" font-weight="bold">逆序拼出 "11"，即 (11)₃ = 4</text>
  </g>
  <rect x="70" y="244" width="580" height="52" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="86" y="268" font-size="12.5" fill="#8a6015" filter="url(#rough2)">k ≤ 10 ⇒ 余数 0..9 直接用字符 '0'+r，不需要字母。</text>
  <text x="86" y="288" font-size="12" fill="#8a6015" filter="url(#rough2)">结果最大 (k−1)² ≤ 81，最多两位。</text>
</svg>
