<svg xmlns="http://www.w3.org/2000/svg" width="740" height="430" viewBox="0 0 740 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="740" height="430" fill="#fafafa"/>
  <text x="370" y="34" font-size="20" fill="#2b2b2b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">整数根 −t：t 的奇偶决定最小的 (b, c)</text>
  <path d="M 140 46 Q 370 52 600 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60" y="74" width="620" height="104" rx="10" fill="#f2f6fb" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="78" y="100" font-size="14" fill="#2f4a66" text-anchor="start" font-weight="bold" filter="url(#rough2)">t 为奇数</text>
  <text x="78" y="126" font-size="12.5" fill="#2f4a66" text-anchor="start" filter="url(#rough2)">2b − t 是奇数，最小取 1 ⇒ b = (t+1)/2，c = t</text>
  <text x="78" y="150" font-size="12.5" fill="#2f4a66" text-anchor="start" filter="url(#rough2)">可行条件：t ≤ m 且 (t+1)/2 ≤ n ⇔ t ≤ min(m, 2n−1)</text>
  <text x="78" y="170" font-size="11.5" fill="#7a5a1b" text-anchor="start" filter="url(#rough2)">例：t = 1 → (b,c) = (1,1)；t = 3 → (2,3)</text>
  <rect x="60" y="194" width="620" height="104" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="78" y="220" font-size="14" fill="#8a6015" text-anchor="start" font-weight="bold" filter="url(#rough2)">t 为偶数</text>
  <text x="78" y="246" font-size="12.5" fill="#8a6015" text-anchor="start" filter="url(#rough2)">2b − t 是偶数，最小取 2 ⇒ b = t/2 + 1，c = 2t</text>
  <text x="78" y="270" font-size="12.5" fill="#8a6015" text-anchor="start" filter="url(#rough2)">可行条件：2t ≤ m 且 t/2 + 1 ≤ n ⇔ t ≤ min(⌊m/2⌋, 2n−2)</text>
  <text x="78" y="290" font-size="11.5" fill="#7a5a1b" text-anchor="start" filter="url(#rough2)">例：t = 2 → (b,c) = (2,4)（要求 m ≥ 4）</text>
  <rect x="60" y="314" width="620" height="56" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="78" y="340" font-size="13" fill="#2f5223" text-anchor="start" font-weight="bold" filter="url(#rough2)">不同整数根的个数 R = 满足上式的奇数 t 个数 + 偶数 t 个数</text>
  <text x="78" y="362" font-size="11.5" fill="#3c5e2e" text-anchor="start" filter="url(#rough2)">两个条件都由「c = t(2b−t) 随 b 递增」推出：最小的 b 对应最小的 c。</text>
  <text x="370" y="400" font-size="12.5" fill="#2b2b2b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">t 的枚举上界：由根 −b ± √(b²−c) 的模 ≤ 2b−1 ≤ 2n−1 给出</text>
</svg>
