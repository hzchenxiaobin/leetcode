<svg xmlns="http://www.w3.org/2000/svg" width="780" height="410" viewBox="0 0 780 410"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1309"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="780" height="410" fill="#fafafa"/>
  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">样例 2 走查：H T H T H T H H T，h = 5</text>

  <rect x="40" y="56" width="700" height="28" fill="#eef1f4" stroke="#7a8ca6" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="56" y="75" font-size="10.5" font-weight="bold" fill="#33445c" filter="url(#rough2)">起点 s</text>
  <text x="150" y="75" font-size="10.5" font-weight="bold" fill="#33445c" filter="url(#rough2)">窗口内容</text>
  <text x="480" y="75" font-size="10.5" font-weight="bold" fill="#33445c" filter="url(#rough2)">H 数</text>

  <rect x="40" y="84" width="700" height="24" fill="#ffffff" stroke="#d6d6d6" stroke-width="1" filter="url(#rough2)"/>
  <text x="56" y="101" font-size="10.5" fill="#555" filter="url(#rough2)">0</text>
  <text x="150" y="101" font-size="10.5" fill="#555" filter="url(#rough2)">H T H T H</text>
  <text x="480" y="101" font-size="10.5" fill="#555" filter="url(#rough2)">3</text>

  <rect x="40" y="108" width="700" height="24" fill="#f7fbff" stroke="#d6d6d6" stroke-width="1" filter="url(#rough2)"/>
  <text x="56" y="125" font-size="10.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="150" y="125" font-size="10.5" fill="#555" filter="url(#rough2)">T H T H T</text>
  <text x="480" y="125" font-size="10.5" fill="#555" filter="url(#rough2)">2</text>

  <rect x="40" y="132" width="700" height="24" fill="#ffffff" stroke="#d6d6d6" stroke-width="1" filter="url(#rough2)"/>
  <text x="56" y="149" font-size="10.5" fill="#555" filter="url(#rough2)">2</text>
  <text x="150" y="149" font-size="10.5" fill="#555" filter="url(#rough2)">H T H T H</text>
  <text x="480" y="149" font-size="10.5" fill="#555" filter="url(#rough2)">3</text>

  <rect x="40" y="156" width="700" height="24" fill="#f7fbff" stroke="#d6d6d6" stroke-width="1" filter="url(#rough2)"/>
  <text x="56" y="173" font-size="10.5" fill="#555" filter="url(#rough2)">3</text>
  <text x="150" y="173" font-size="10.5" fill="#555" filter="url(#rough2)">T H T H H</text>
  <text x="480" y="173" font-size="10.5" fill="#555" filter="url(#rough2)">3</text>

  <rect x="40" y="180" width="700" height="24" fill="#ffffff" stroke="#d6d6d6" stroke-width="1" filter="url(#rough2)"/>
  <text x="56" y="197" font-size="10.5" fill="#555" filter="url(#rough2)">4</text>
  <text x="150" y="197" font-size="10.5" fill="#555" filter="url(#rough2)">H T H H T</text>
  <text x="480" y="197" font-size="10.5" fill="#555" filter="url(#rough2)">3</text>

  <rect x="40" y="204" width="700" height="24" fill="#f7fbff" stroke="#d6d6d6" stroke-width="1" filter="url(#rough2)"/>
  <text x="56" y="221" font-size="10.5" fill="#555" filter="url(#rough2)">5</text>
  <text x="150" y="221" font-size="10.5" fill="#555" filter="url(#rough2)">T H H T H</text>
  <text x="480" y="221" font-size="10.5" fill="#555" filter="url(#rough2)">3</text>

  <rect x="40" y="228" width="700" height="24" fill="#ffffff" stroke="#d6d6d6" stroke-width="1" filter="url(#rough2)"/>
  <text x="56" y="245" font-size="10.5" fill="#555" filter="url(#rough2)">6</text>
  <text x="150" y="245" font-size="10.5" fill="#555" filter="url(#rough2)">H H T H T</text>
  <text x="480" y="245" font-size="10.5" fill="#555" filter="url(#rough2)">3</text>

  <rect x="40" y="252" width="700" height="24" fill="#f7fbff" stroke="#d6d6d6" stroke-width="1" filter="url(#rough2)"/>
  <text x="56" y="269" font-size="10.5" fill="#555" filter="url(#rough2)">7</text>
  <text x="150" y="269" font-size="10.5" fill="#555" filter="url(#rough2)">H T H T H</text>
  <text x="480" y="269" font-size="10.5" fill="#555" filter="url(#rough2)">3</text>

  <rect x="40" y="276" width="700" height="24" fill="#ffffff" stroke="#d6d6d6" stroke-width="1" filter="url(#rough2)"/>
  <text x="56" y="293" font-size="10.5" fill="#555" filter="url(#rough2)">8</text>
  <text x="150" y="293" font-size="10.5" fill="#555" filter="url(#rough2)">T H T H T</text>
  <text x="480" y="293" font-size="10.5" fill="#555" filter="url(#rough2)">2</text>

  <rect x="40" y="312" width="700" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="56" y="338" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">最大窗口 H 数 = 3，h = 5 → 答案 = 5 − 3 = 2</text>

  <text x="40" y="376" font-size="10.5" fill="#666" filter="url(#rough2)">窗口跨越末尾时从开头绕回（例如 s=7 的窗口包含位置 7、8、0、1、2）。</text>
  <text x="40" y="398" font-size="10.5" fill="#8c3b37" filter="url(#rough2)">起点只需枚举 0..n−1：再往后就是重复的窗口了。</text>
</svg>
