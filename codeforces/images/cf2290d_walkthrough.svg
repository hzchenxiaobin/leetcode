<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="19"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="680" height="400" fill="#fafafa"/>

  <text x="26" y="34" font-size="16" font-weight="bold" fill="#33333a" filter="url(#rough2)">样例走查：s = abdc（n = 4），答案是 3</text>

  <rect x="40" y="54" width="600" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="76" text-anchor="middle" font-size="13" fill="#22364d" filter="url(#rough2)">对称对 (i, j)</text>
  <text x="220" y="76" text-anchor="middle" font-size="13" fill="#22364d" filter="url(#rough2)">字符</text>
  <text x="340" y="76" text-anchor="middle" font-size="13" fill="#22364d" filter="url(#rough2)">区间 [l, r]</text>
  <text x="520" y="76" text-anchor="middle" font-size="13" fill="#22364d" filter="url(#rough2)">必须标记的边</text>

  <rect x="40" y="88" width="600" height="44" fill="#ffffff" stroke="#c8cedb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="100" y="115" text-anchor="middle" font-size="13.5" fill="#33333a" filter="url(#rough2)">(0, 3)</text>
  <text x="220" y="115" text-anchor="middle" font-size="13.5" fill="#33333a" filter="url(#rough2)">a ↔ c</text>
  <text x="340" y="115" text-anchor="middle" font-size="13.5" fill="#33333a" filter="url(#rough2)">[a, c]</text>
  <text x="520" y="115" text-anchor="middle" font-size="13.5" fill="#b85450" filter="url(#rough2)">a–b, b–c</text>

  <rect x="40" y="132" width="600" height="44" fill="#ffffff" stroke="#c8cedb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="100" y="159" text-anchor="middle" font-size="13.5" fill="#33333a" filter="url(#rough2)">(1, 2)</text>
  <text x="220" y="159" text-anchor="middle" font-size="13.5" fill="#33333a" filter="url(#rough2)">b ↔ d</text>
  <text x="340" y="159" text-anchor="middle" font-size="13.5" fill="#33333a" filter="url(#rough2)">[b, d]</text>
  <text x="520" y="159" text-anchor="middle" font-size="13.5" fill="#b85450" filter="url(#rough2)">b–c, c–d</text>

  <path d="M160,54 L160,176" stroke="#c8cedb" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M280,54 L280,176" stroke="#c8cedb" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M400,54 L400,176" stroke="#c8cedb" stroke-width="1.2" filter="url(#rough2)"/>

  <rect x="40" y="188" width="600" height="54" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="212" font-size="14" fill="#5c4a1a" filter="url(#rough2)">两条区间重叠 ⇒ 并集是 {a–b, b–c, c–d}，共 3 条边</text>
  <text x="60" y="233" font-size="14" fill="#5c4a1a" filter="url(#rough2)">从高到低执行：abdc → abcc → abbb → aaaa，恰好 3 步</text>

  <rect x="40" y="256" width="600" height="126" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="282" font-size="14" fill="#2f4a24" filter="url(#rough2)">zaza：(z, a) 与 (a, z) 共用同一个区间 [a, z]</text>
  <text x="60" y="304" font-size="14" fill="#2f4a24" filter="url(#rough2)">⇒ 边 a–b, b–c, …, y–z 共 25 条全部标记 ⇒ 答案 25</text>
  <text x="60" y="326" font-size="14" fill="#2f4a24" filter="url(#rough2)">racecar：每个对称字符本就相同，一条边都不标记 ⇒ 0</text>
  <text x="60" y="356" font-size="14" fill="#b85450" filter="url(#rough2)">答案 = 被强制标记的边数，与串长无关，最大只到 25</text>
</svg>
