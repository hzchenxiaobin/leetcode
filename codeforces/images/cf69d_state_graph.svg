<svg xmlns="http://www.w3.org/2000/svg" width="860" height="450" viewBox="0 0 860 450"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="81"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrp" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#7a5b9a"/>
    </marker>
  </defs>

  <rect width="860" height="450" fill="#fafafa"/>

  <text x="430" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">把局势压缩成四元组：(x, y, 轮到谁, 对称余额)</text>
  <text x="430" y="56" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">两种操作分别让 x+y 变大、让 mask 变小，因此状态图无环</text>

  <g filter="url(#rough2)">
    <rect x="300" y="82" width="260" height="72" rx="12" fill="#eef2f6" stroke="#446688" stroke-width="1.8"/>
    <text x="430" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66">状态 (x, y, turn, mask)</text>
    <text x="430" y="130" text-anchor="middle" font-size="10.5" fill="#446688">turn：0 = Anton，1 = Dasha</text>
    <text x="430" y="146" text-anchor="middle" font-size="10.5" fill="#446688">mask：两位分别表示两人对称是否还在</text>
  </g>

  <!-- 平移边 -->
  <g filter="url(#rough2)">
    <path d="M 320 154 L 220 218" stroke="#446688" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="60" y="222" width="290" height="76" rx="12" fill="#cfe0f5" stroke="#446688" stroke-width="1.6"/>
    <text x="205" y="246" text-anchor="middle" font-size="12" fill="#2f4a66">平移 vᵢ：(x+vx, y+vy, turn⊕1, mask)</text>
    <text x="205" y="268" text-anchor="middle" font-size="10.5" fill="#2f4a66">x+y 严格增大（向量非零且坐标非负）</text>
    <text x="205" y="286" text-anchor="middle" font-size="10.5" fill="#b85450">若新位置模长 &gt; d，这步直接判负，剪掉</text>
  </g>

  <!-- 对称边 -->
  <g filter="url(#rough2)">
    <path d="M 540 154 L 640 218" stroke="#7a5b9a" stroke-width="2" marker-end="url(#arrp)"/>
    <rect x="510" y="222" width="300" height="76" rx="12" fill="#e8e0f2" stroke="#6b5b9a" stroke-width="1.6"/>
    <text x="660" y="246" text-anchor="middle" font-size="12" fill="#4b3f66">对称：(y, x, turn⊕1, mask⊕bit)</text>
    <text x="660" y="268" text-anchor="middle" font-size="10.5" fill="#4b3f66">模长不变，永不判负，只消耗一次机会</text>
    <text x="660" y="286" text-anchor="middle" font-size="10.5" fill="#6b4f8a">mask 少一位 ⇒ 每人至多一次</text>
  </g>

  <!-- 递推 -->
  <g filter="url(#rough2)">
    <rect x="60" y="330" width="740" height="94" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="76" y="354" font-size="12" fill="#8a6015">f(x, y, turn, mask) = 是否存在一步合法的操作，使对手状态 (turn⊕1) 的 f 为假。</text>
    <text x="76" y="378" font-size="11.5" fill="#9a7020">任意一步到"对手必败"即必胜；所有走法都到"对手必胜"则必败。</text>
    <text x="76" y="402" font-size="11.5" fill="#9a7020">状态数 ≤ (2d+1)² × 2 × 4，d = 200 时约 1.3 × 10⁶，每个状态至多 n+1 条转移。</text>
  </g>
</svg>
