<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="263"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="320" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">样例 2：三个变量各一条路径，惩罚 4</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">1,2,3,1,2,3 与 m = 3：把 1→4、2→5、3→6 各连一条边</text>
  <text x="90" y="104" text-anchor="start" font-size="10.5" fill="#666666" filter="url(#rough2)">位置</text>
  <g filter="url(#rough2)"><rect x="150" y="92" width="80" height="40" rx="4" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="190" y="118" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="190" y="84" text-anchor="middle" font-size="10" fill="#666666" filter="url(#rough2)">i=1</text>
  <g filter="url(#rough2)"><rect x="260" y="92" width="80" height="40" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="300" y="118" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="300" y="84" text-anchor="middle" font-size="10" fill="#666666" filter="url(#rough2)">i=2</text>
  <g filter="url(#rough2)"><rect x="370" y="92" width="80" height="40" rx="4" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="410" y="118" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="410" y="84" text-anchor="middle" font-size="10" fill="#666666" filter="url(#rough2)">i=3</text>
  <g filter="url(#rough2)"><rect x="480" y="92" width="80" height="40" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="520" y="118" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="520" y="84" text-anchor="middle" font-size="10" fill="#666666" filter="url(#rough2)">i=4</text>
  <g filter="url(#rough2)"><rect x="590" y="92" width="80" height="40" rx="4" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="630" y="118" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="630" y="84" text-anchor="middle" font-size="10" fill="#666666" filter="url(#rough2)">i=5</text>
  <g filter="url(#rough2)"><rect x="700" y="92" width="80" height="40" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="740" y="118" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="740" y="84" text-anchor="middle" font-size="10" fill="#666666" filter="url(#rough2)">i=6</text>
  <g filter="url(#rough2)"><path d="M 190 134 C 190 176, 520 176, 520 136" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)"/></g>
  <text x="355.0" y="172" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">免费复用</text>
  <g filter="url(#rough2)"><path d="M 300 134 C 300 176, 630 176, 630 136" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)"/></g>
  <text x="465.0" y="172" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">免费复用</text>
  <g filter="url(#rough2)"><path d="M 410 134 C 410 176, 740 176, 740 136" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)"/></g>
  <text x="575.0" y="172" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">免费复用</text>
  <g filter="url(#rough2)"><rect x="80" y="200" width="740" height="92" rx="6" fill="#ffffff" fill-opacity="0.35" stroke="#cccccc" stroke-width="1.4" stroke-dasharray="5 4"/></g>
  <text x="450" y="226" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">程序：c=1 print(c)  b=2 print(b)  a=3 print(a)  print(c) print(b) print(a)</text>
  <text x="450" y="254" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">惩罚 = 1 + 1 + 2 = 4，行数 = 3 次赋值 + 6 次打印 = 9</text>
  <text x="450" y="280" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">对比：三个值各打印两次，若不复用要 8 次赋值</text>
</svg>
