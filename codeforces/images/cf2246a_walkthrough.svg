<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="19"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="720" height="470" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">走查：乘积全偶则和恒偶；有奇数项就可能凑出 1</text>

  <rect x="36" y="64" width="672" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="68" y="89" text-anchor="middle" font-size="13" fill="#223" filter="url(#rough2)">n</text>
  <text x="232" y="89" text-anchor="middle" font-size="13" fill="#223" filter="url(#rough2)">p</text>
  <text x="499" y="89" text-anchor="middle" font-size="13" fill="#223" filter="url(#rough2)">i·p_i（逐项）</text>
  <text x="677" y="89" text-anchor="middle" font-size="13" fill="#223" filter="url(#rough2)">结论</text>

  <rect x="36" y="110" width="672" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="68" y="138" text-anchor="middle" font-size="14" fill="#223" filter="url(#rough2)">2</text>
  <text x="232" y="138" text-anchor="middle" font-size="13.5" fill="#223" filter="url(#rough2)">[2, 1]</text>
  <text x="499" y="138" text-anchor="middle" font-size="13.5" fill="#223" filter="url(#rough2)">[2, 2]</text>
  <text x="677" y="138" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <rect x="36" y="166" width="672" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="68" y="194" text-anchor="middle" font-size="14" fill="#223" filter="url(#rough2)">4</text>
  <text x="232" y="194" text-anchor="middle" font-size="13.5" fill="#223" filter="url(#rough2)">[2, 1, 4, 3]</text>
  <text x="499" y="194" text-anchor="middle" font-size="13.5" fill="#223" filter="url(#rough2)">[2, 2, 12, 12]</text>
  <text x="677" y="194" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <rect x="36" y="222" width="672" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="68" y="250" text-anchor="middle" font-size="14" fill="#223" filter="url(#rough2)">6</text>
  <text x="232" y="250" text-anchor="middle" font-size="13.5" fill="#223" filter="url(#rough2)">[2, 1, 4, 3, 6, 5]</text>
  <text x="499" y="250" text-anchor="middle" font-size="13.5" fill="#223" filter="url(#rough2)">[2, 2, 12, 12, 30, 30]</text>
  <text x="677" y="250" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <rect x="36" y="278" width="672" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="68" y="306" text-anchor="middle" font-size="14" fill="#223" filter="url(#rough2)">4</text>
  <text x="232" y="306" text-anchor="middle" font-size="13.5" fill="#223" filter="url(#rough2)">[1, 2, 3, 4]（恒等）</text>
  <text x="499" y="306" text-anchor="middle" font-size="13.5" fill="#223" filter="url(#rough2)">[1, 4, 9, 16]</text>
  <text x="677" y="306" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">✗</text>

  <rect x="36" y="344" width="672" height="96" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="372" y="370" text-anchor="middle" font-size="12.5" fill="#6a4a10" filter="url(#rough2)">反例一行为何失败：1·1 = 1 是奇数，取 x₁ = +1、其余全 0 就得到 c_final = 1。</text>
  <text x="372" y="394" text-anchor="middle" font-size="12.5" fill="#6a4a10" filter="url(#rough2)">n = 2 时可达和只有 {−4, −2, 0, 2, 4}；n 越大可达和越多，但上面三行始终落在偶数集合里。</text>
  <text x="372" y="418" text-anchor="middle" font-size="12.5" fill="#6a4a10" filter="url(#rough2)">所以不必枚举 3ⁿ 种选择：只要证明每一项都是偶数，和的奇偶性就被锁死了。</text>
</svg>
