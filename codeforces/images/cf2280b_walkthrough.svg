<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">样例走查：k 定分界，c 定性质</text>
  <text x="320" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每条记录：查询 ① 得 k，查询 ② 得 c = 前 k 位中 1 的个数</text>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="30" y="62" width="150" height="30" fill="#eef2f7" stroke="#8a9bb0" stroke-width="1.4" rx="5"/>
    <rect x="184" y="62" width="66" height="30" fill="#eef2f7" stroke="#8a9bb0" stroke-width="1.4" rx="5"/>
    <rect x="254" y="62" width="104" height="30" fill="#eef2f7" stroke="#8a9bb0" stroke-width="1.4" rx="5"/>
    <rect x="362" y="62" width="130" height="30" fill="#eef2f7" stroke="#8a9bb0" stroke-width="1.4" rx="5"/>
    <rect x="496" y="62" width="114" height="30" fill="#eef2f7" stroke="#8a9bb0" stroke-width="1.4" rx="5"/>
    <text x="105" y="82" text-anchor="middle" font-size="10.5" fill="#445">隐藏串 s（n=5）</text>
    <text x="217" y="82" text-anchor="middle" font-size="10.5" fill="#445">k</text>
    <text x="306" y="82" text-anchor="middle" font-size="10.5" fill="#445">c = [1,k] 的 1</text>
    <text x="427" y="82" text-anchor="middle" font-size="10.5" fill="#445">比较</text>
    <text x="553" y="82" text-anchor="middle" font-size="10.5" fill="#445">输出</text>
  </g>

  <!-- 行 1：10101 -->
  <g filter="url(#rough2)">
    <rect x="30" y="96" width="150" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5"/>
    <rect x="184" y="96" width="66" height="34" fill="#f7fafc" stroke="#8a9bb0" stroke-width="1.2" rx="5"/>
    <rect x="254" y="96" width="104" height="34" fill="#f7fafc" stroke="#8a9bb0" stroke-width="1.2" rx="5"/>
    <rect x="362" y="96" width="130" height="34" fill="#f7fafc" stroke="#8a9bb0" stroke-width="1.2" rx="5"/>
    <rect x="496" y="96" width="114" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5"/>
    <text x="105" y="119" text-anchor="middle" font-size="13" fill="#2c3e50">1 0 1 0 1</text>
    <text x="217" y="119" text-anchor="middle" font-size="11.5" fill="#333">3</text>
    <text x="306" y="119" text-anchor="middle" font-size="11.5" fill="#333">2（c &lt; k）</text>
    <text x="427" y="119" text-anchor="middle" font-size="10.5" fill="#8a3a36">2 &lt; 3，前 3 位有 0</text>
    <text x="553" y="119" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4f28">YES</text>
  </g>

  <!-- 行 2：11000 -->
  <g filter="url(#rough2)">
    <rect x="30" y="134" width="150" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5"/>
    <rect x="184" y="134" width="66" height="34" fill="#f7fafc" stroke="#8a9bb0" stroke-width="1.2" rx="5"/>
    <rect x="254" y="134" width="104" height="34" fill="#f7fafc" stroke="#8a9bb0" stroke-width="1.2" rx="5"/>
    <rect x="362" y="134" width="130" height="34" fill="#f7fafc" stroke="#8a9bb0" stroke-width="1.2" rx="5"/>
    <rect x="496" y="134" width="114" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="5"/>
    <text x="105" y="157" text-anchor="middle" font-size="13" fill="#2c3e50">1 1 0 0 0</text>
    <text x="217" y="157" text-anchor="middle" font-size="11.5" fill="#333">2</text>
    <text x="306" y="157" text-anchor="middle" font-size="11.5" fill="#333">2（c = k）</text>
    <text x="427" y="157" text-anchor="middle" font-size="10.5" fill="#8a3a36">2 = 2，前 2 位全是 1</text>
    <text x="553" y="157" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36">NO</text>
  </g>

  <!-- 行 3：00111 -->
  <g filter="url(#rough2)">
    <rect x="30" y="172" width="150" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5"/>
    <rect x="184" y="172" width="66" height="34" fill="#f7fafc" stroke="#8a9bb0" stroke-width="1.2" rx="5"/>
    <rect x="254" y="172" width="104" height="34" fill="#f7fafc" stroke="#8a9bb0" stroke-width="1.2" rx="5"/>
    <rect x="362" y="172" width="130" height="34" fill="#f7fafc" stroke="#8a9bb0" stroke-width="1.2" rx="5"/>
    <rect x="496" y="172" width="114" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5"/>
    <text x="105" y="195" text-anchor="middle" font-size="13" fill="#2c3e50">0 0 1 1 1</text>
    <text x="217" y="195" text-anchor="middle" font-size="11.5" fill="#333">3</text>
    <text x="306" y="195" text-anchor="middle" font-size="11.5" fill="#333">1（c &lt; k）</text>
    <text x="427" y="195" text-anchor="middle" font-size="10.5" fill="#8a3a36">1 &lt; 3，前 3 位有 0</text>
    <text x="553" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4f28">YES</text>
  </g>

  <!-- 行 4：11111 -->
  <g filter="url(#rough2)">
    <rect x="30" y="210" width="150" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5"/>
    <rect x="184" y="210" width="66" height="34" fill="#f7fafc" stroke="#8a9bb0" stroke-width="1.2" rx="5"/>
    <rect x="254" y="210" width="104" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="5"/>
    <rect x="362" y="210" width="130" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="5"/>
    <rect x="496" y="210" width="114" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="5"/>
    <text x="105" y="233" text-anchor="middle" font-size="13" fill="#2c3e50">1 1 1 1 1</text>
    <text x="217" y="233" text-anchor="middle" font-size="11.5" fill="#333">5</text>
    <text x="306" y="233" text-anchor="middle" font-size="10" fill="#8a6a20">跳过（k = n）</text>
    <text x="427" y="233" text-anchor="middle" font-size="10" fill="#8a6a20">全 1，无需再问</text>
    <text x="553" y="233" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36">NO</text>
  </g>

  <!-- 行 5：00000 -->
  <g filter="url(#rough2)">
    <rect x="30" y="248" width="150" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5"/>
    <rect x="184" y="248" width="66" height="34" fill="#f7fafc" stroke="#8a9bb0" stroke-width="1.2" rx="5"/>
    <rect x="254" y="248" width="104" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="5"/>
    <rect x="362" y="248" width="130" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="5"/>
    <rect x="496" y="248" width="114" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="5"/>
    <text x="105" y="271" text-anchor="middle" font-size="13" fill="#2c3e50">0 0 0 0 0</text>
    <text x="217" y="271" text-anchor="middle" font-size="11.5" fill="#333">0</text>
    <text x="306" y="271" text-anchor="middle" font-size="10" fill="#8a6a20">跳过（k = 0）</text>
    <text x="427" y="271" text-anchor="middle" font-size="10" fill="#8a6a20">全 0，禁问 [1,0]</text>
    <text x="553" y="271" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36">NO</text>
  </g>

  <!-- 结论条 -->
  <rect x="34" y="300" width="572" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="320" y="320" text-anchor="middle" font-size="11.5" fill="#2f4f28" font-weight="bold" filter="url(#rough2)">c &lt; k 时：前 k 位里有 0，而总数还是 k ⇒ 后面必有 1 ⇒ 必有一条 0→1</text>
  <text x="320" y="336" text-anchor="middle" font-size="10" fill="#3a5a30" filter="url(#rough2)">c = k 时：前 k 位全是 1，后 n−k 位全是 0，正是 1^k 0^(n−k)</text>

  <text x="320" y="368" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">行 1、2 恰好是官方样例的两组：10101 答 YES，而 10000 / 00000 都答 NO</text>
  <text x="320" y="386" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">注意行 4、5 只用 1 次查询就收工，所以总查询数上限是 2 而不是 4</text>
</svg>
