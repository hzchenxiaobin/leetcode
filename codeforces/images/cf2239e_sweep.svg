<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="21"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrS" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="460" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">线段树 + 可撤销 DSU：从高层往低层 DFS，标记随回滚下推</text>

  <rect x="30" y="46" width="660" height="58" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="48" y="70" font-size="13" fill="#333" filter="url(#rough2)">① 把所有 low / w 压缩成 K 个层；每条边挂到线段树的 O(log K) 个结点上（区间分解）</text>
  <text x="48" y="92" font-size="12" fill="#446688" filter="url(#rough2)">实边挂 [low, w]，虚拟边挂 [0, low-1] —— 一个区间 = 该边「一直有效」的那些层</text>

  <path d="M360,104 L360,122" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrS)" filter="url(#rough2)"/>

  <rect x="30" y="124" width="660" height="74" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="48" y="148" font-size="13" fill="#333" filter="url(#rough2)">② DFS：先走右子树（高层），再走左子树（低层）；进结点时 union 该结点的边，出结点时回滚</text>
  <text x="48" y="172" font-size="12" fill="#4a7a3a" filter="url(#rough2)">DSU 维护 F_c 的连通块，块顶记「块内最大 val」；虚拟节点带着各自的值一起参与合并</text>
  <text x="48" y="192" font-size="12" fill="#4a7a3a" filter="url(#rough2)">（虚拟节点的值在更靠右的叶子上算好，所以进入低层结点时已经就绪）</text>

  <path d="M360,198 L360,216" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrS)" filter="url(#rough2)"/>

  <rect x="30" y="218" width="660" height="80" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="48" y="242" font-size="13" fill="#333" filter="url(#rough2)">③ 到叶子（层 c）分两步：</text>
  <text x="48" y="264" font-size="12" fill="#8a6d3b" filter="url(#rough2)">low = c 的边：W_e ← 端点在当前块里的最大 val，写进它的两个虚拟节点（此时它们还孤立）</text>
  <text x="48" y="286" font-size="12" fill="#8a6d3b" filter="url(#rough2)">w = c 的边：把候选 c +（所在块的最大 val）打进该块根上的「标记」</text>

  <path d="M360,298 L360,316" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrS)" filter="url(#rough2)"/>

  <rect x="30" y="318" width="660" height="70" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="48" y="342" font-size="13" fill="#333" filter="url(#rough2)">④ 回滚一个 union（块 C = A ∪ B）时：把 C 的标记同时下推给 A 和 B</text>
  <text x="48" y="366" font-size="12" fill="#b85450" filter="url(#rough2)">标记只装「对整块都成立」的候选，所以下推不会高估；子块各自的历史标记保持独立</text>

  <path d="M360,388 L360,406" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrS)" filter="url(#rough2)"/>

  <rect x="30" y="408" width="660" height="42" rx="10" fill="#fafafa" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="360" y="436" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">DFS 结束后每个点自己手里的标记就是答案</text>
</svg>
