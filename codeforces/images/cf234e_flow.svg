<svg xmlns="http://www.w3.org/2000/svg" width="840" height="300" viewBox="0 0 840 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="300" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">模拟流程</text>
  <g filter="url(#rough2)"><rect x="100" y="110" width="160" height="64" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#667788" stroke-width="1.3"/></g>
  <text x="180" y="148" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按评分排序</text>
  <g filter="url(#rough2)"><line x1="264" y1="142" x2="286" y2="142" stroke="#888888" stroke-width="1.4" marker-end="url(#arrb)"/></g>
  <g filter="url(#rough2)"><rect x="290" y="110" width="160" height="64" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#667788" stroke-width="1.3"/></g>
  <text x="370" y="148" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">分 4 档</text>
  <g filter="url(#rough2)"><line x1="454" y1="142" x2="476" y2="142" stroke="#888888" stroke-width="1.4" marker-end="url(#arrb)"/></g>
  <g filter="url(#rough2)"><rect x="480" y="110" width="160" height="64" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#667788" stroke-width="1.3"/></g>
  <text x="560" y="148" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每轮各档取一支</text>
  <g filter="url(#rough2)"><line x1="644" y1="142" x2="666" y2="142" stroke="#888888" stroke-width="1.4" marker-end="url(#arrb)"/></g>
  <g filter="url(#rough2)"><rect x="670" y="110" width="160" height="64" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#667788" stroke-width="1.3"/></g>
  <text x="750" y="148" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">组内降序输出</text>
  <text x="420" y="220" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">m = n/4；RNG 参数 x,a,b,c 按题面递推</text>
  <text x="420" y="254" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">注意：先更新 x，再取模；取出后从档中删除</text>
</svg>
