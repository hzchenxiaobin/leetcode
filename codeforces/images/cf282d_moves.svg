<svg xmlns="http://www.w3.org/2000/svg" width="700" height="380" viewBox="0 0 700 380"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="181"/>
    <feDisplacementMap in="SourceGraphic" scale="1.5"/></filter></defs>
  <rect width="700" height="380" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两种走法：减一堆任意多，或所有堆一起减同样的量</text>
  <path d="M 90 40 Q 350 46 610 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="270" height="96" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="195" y="84" text-anchor="middle" font-size="14" fill="#22314a" filter="url(#rough2)">走法 A：单堆</text>
  <text x="195" y="108" text-anchor="middle" font-size="13" fill="#22314a" filter="url(#rough2)">选 i 和 x∈[1,aᵢ]</text>
  <text x="195" y="130" text-anchor="middle" font-size="13" fill="#22314a" filter="url(#rough2)">aᵢ ← aᵢ − x</text>
  <text x="195" y="148" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">n=1 时这就是普通 Nim</text>
  <g filter="url(#rough2)"><rect x="370" y="58" width="270" height="96" rx="8" fill="#e8f4e0" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="505" y="84" text-anchor="middle" font-size="14" fill="#2f5223" filter="url(#rough2)">走法 B：全体</text>
  <text x="505" y="108" text-anchor="middle" font-size="13" fill="#2f5223" filter="url(#rough2)">选 x∈[1, min aᵢ]</text>
  <text x="505" y="130" text-anchor="middle" font-size="13" fill="#2f5223" filter="url(#rough2)">所有 aᵢ ← aᵢ − x</text>
  <text x="505" y="148" text-anchor="middle" font-size="11" fill="#3c5e2e" filter="url(#rough2)">n=2 时即 Wythoff 游戏</text>
  <g filter="url(#rough2)"><rect x="60" y="170" width="580" height="90" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="76" y="194" font-size="13" fill="#8a6015" filter="url(#rough2)">关键观察：两种走法都让「总和」严格变小 ⇒ 状态图是 DAG，可按 a₁+a₂(+a₃) 递增递推。</text>
  <text x="76" y="218" font-size="13" fill="#8a6015" filter="url(#rough2)">必败态（P-position）的判定：没有任何一步能走到必败态 ⇒ 必胜。</text>
  <text x="76" y="242" font-size="12" fill="#8a6015" filter="url(#rough2)">aᵢ &lt; 300 且 n ≤ 3 ⇒ 状态总数 ≤ 300³ = 2.7·10⁷，可以全 DP。</text>
  <g filter="url(#rough2)"><rect x="60" y="276" width="580" height="86" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="300" font-size="13" fill="#2f5223" filter="url(#rough2)">样例：n=2, (1,1) 先手能"全体减 1"直达 (0,0) ⇒ BitLGM（先手胜）。</text>
  <text x="76" y="324" font-size="13" fill="#2f5223" filter="url(#rough2)">样例：n=2, (1,2) 所有走法都到必胜态 ⇒ BitAryo（后手胜）；它是 Wythoff 的第一个必败态。</text>
  <text x="76" y="348" font-size="12" fill="#2f5223" filter="url(#rough2)">样例：n=3, (1,2,1) ⇒ BitLGM（先手胜）。</text>
</svg>
