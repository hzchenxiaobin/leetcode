<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="300" fill="#fafafa"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">193A 的判定流程</text>
  <path d="M 293.49 46 Q 380.0 52 466.51 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="130.0" y="46.0" width="500.0" height="40.0" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="150.0" y="72.0" text-anchor="start" font-size="11.4" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">读网格，数格子 cnt</text>
  <path d="M 380.0 87.0 L 380.0 95.0" stroke="#446688" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="130.0" y="96.0" width="500.0" height="40.0" rx="8" fill="#fdf0ef" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="150.0" y="122.0" text-anchor="start" font-size="11.4" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">cnt ≤ 2 ⇒ -1</text>
  <path d="M 380.0 137.0 L 380.0 145.0" stroke="#446688" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="130.0" y="146.0" width="500.0" height="40.0" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="150.0" y="172.0" text-anchor="start" font-size="11.4" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">对每个格子：删掉后 BFS 检查连通性</text>
  <path d="M 380.0 187.0 L 380.0 195.0" stroke="#446688" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="130.0" y="196.0" width="500.0" height="40.0" rx="8" fill="#fff3d6" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="150.0" y="222.0" text-anchor="start" font-size="11.4" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">断开 ⇒ 1</text>
  <path d="M 380.0 237.0 L 380.0 245.0" stroke="#446688" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="130.0" y="246.0" width="500.0" height="40.0" rx="8" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="150.0" y="272.0" text-anchor="start" font-size="11.4" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">都不行 ⇒ 2</text>
</svg>
