<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="57"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="q" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="qr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b4652a"/>
    </marker>
  </defs>
  <rect width="720" height="340" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="17.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">反例：只有「最长路」这一组最小解会漏掉可行解</text>

  <g filter="url(#rough2)">
    <circle cx="70"  cy="150" r="25" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="175" cy="82"  r="25" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="305" cy="150" r="25" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="175" cy="220" r="25" fill="#fde9d9" stroke="#b4652a" stroke-width="1.8"/>
    <circle cx="440" cy="150" r="25" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="575" cy="150" r="25" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <g font-size="12.5" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">
    <text x="70"  y="155">1</text><text x="175" y="87">2</text><text x="305" y="155">3</text>
    <text x="175" y="225">4</text><text x="440" y="155">5</text><text x="575" y="155">n=6</text>
  </g>
  <g stroke="#446688" stroke-width="1.6" filter="url(#rough2)">
    <line x1="92"  y1="138" x2="155" y2="98"  marker-end="url(#q)"/>
    <line x1="95"  y1="150" x2="278" y2="150" marker-end="url(#q)"/>
    <line x1="92"  y1="162" x2="155" y2="205" marker-end="url(#q)"/>
    <line x1="198" y1="95"  x2="282" y2="138" marker-end="url(#q)"/>
    <line x1="330" y1="150" x2="412" y2="150" marker-end="url(#q)"/>
    <line x1="465" y1="150" x2="548" y2="150" marker-end="url(#q)"/>
  </g>
  <line x1="198" y1="208" x2="552" y2="160" stroke="#b4652a" stroke-width="2.2" marker-end="url(#qr)" filter="url(#rough2)"/>
  <text x="380" y="196" text-anchor="middle" font-size="11.5" fill="#b4652a" filter="url(#rough2)">4 → 6（关键边）</text>

  <g font-size="12" fill="#2b2b2b" filter="url(#rough2)">
    <text x="48" y="268">点</text>
    <text x="150" y="268">1</text><text x="210" y="268">2</text><text x="270" y="268">3</text>
    <text x="330" y="268">4</text><text x="390" y="268">5</text><text x="450" y="268">6</text>
    <text x="48" y="292" fill="#4a7a3a">可行 d</text>
    <text x="150" y="292" fill="#4a7a3a">0</text><text x="210" y="292" fill="#4a7a3a">1</text><text x="270" y="292" fill="#4a7a3a">2</text>
    <text x="330" y="292" fill="#4a7a3a">2</text><text x="390" y="292" fill="#4a7a3a">3</text><text x="450" y="292" fill="#4a7a3a">4</text>
    <text x="48" y="316" fill="#b4652a">最长路 d</text>
    <text x="150" y="316" fill="#b4652a">0</text><text x="210" y="316" fill="#b4652a">1</text><text x="270" y="316" fill="#b4652a">2</text>
    <text x="330" y="316" fill="#b4652a">1</text><text x="390" y="316" fill="#b4652a">3</text><text x="450" y="316" fill="#b4652a">4</text>
  </g>
  <g font-size="11.5" fill="#b4652a" filter="url(#rough2)">
    <text x="500" y="292">d[6]−d[4] = 2 ✓</text>
    <text x="500" y="316">d[6]−d[4] = 3 ✗ 误判 No</text>
  </g>
</svg>
