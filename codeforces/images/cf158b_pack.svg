<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="579"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="300" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">按 4 → 3 → 2 → 1 的顺序拼车</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">组不可拆，但一车可装多组</text>
  <g filter="url(#rough2)"><rect x="60" y="96" width="130" height="34" rx="4" fill="#ffffff" fill-opacity="0.3" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="125" y="119" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">4 人组</text>
  <text x="210" y="119" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">独占一车</text>
  <text x="760" y="119" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">c4 辆</text>
  <g filter="url(#rough2)"><rect x="60" y="140" width="130" height="34" rx="4" fill="#ffffff" fill-opacity="0.3" stroke="#b06a1e" stroke-width="1.4"/></g>
  <text x="125" y="163" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">3 人组</text>
  <text x="210" y="163" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">各配 1 个 1 人组</text>
  <text x="760" y="163" text-anchor="middle" font-size="12" fill="#b06a1e" font-weight="bold" filter="url(#rough2)">c3 辆</text>
  <g filter="url(#rough2)"><rect x="60" y="184" width="130" height="34" rx="4" fill="#ffffff" fill-opacity="0.3" stroke="#446688" stroke-width="1.4"/></g>
  <text x="125" y="207" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">2 人组</text>
  <text x="210" y="207" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">两两一车；剩一个再配 2 个 1 人组</text>
  <text x="760" y="207" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">⌈c2/2⌉ 辆</text>
  <g filter="url(#rough2)"><rect x="60" y="228" width="130" height="34" rx="4" fill="#ffffff" fill-opacity="0.3" stroke="#8a2b28" stroke-width="1.4"/></g>
  <text x="125" y="251" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">1 人组</text>
  <text x="210" y="251" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">每 4 个一车</text>
  <text x="760" y="251" text-anchor="middle" font-size="12" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">⌈c1/4⌉ 辆</text>
  <text x="450" y="284" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">答案 = 四者之和</text>
</svg>
