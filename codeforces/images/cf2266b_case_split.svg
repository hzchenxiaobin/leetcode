<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 424" width="780" height="424"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="29"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="780" height="424" fill="#fafafa"/>

  <text x="390" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">分三种情形：什么时候「拿光」，什么时候「全空手」</text>
  <path d="M 168 42 Q 390 49 612 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <rect x="292" y="56" width="196" height="40" rx="9" fill="#fafafa" stroke="#2b2b2b" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="390" y="82" text-anchor="middle" font-size="13.5" fill="#2b2b2b" filter="url(#rough2)">d = a − b，e = |d|</text>

  <path d="M 390 98 C 390 112 250 108 140 130" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 390 98 L 390 130" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 390 98 C 390 112 530 108 640 130" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ① -->
  <rect x="26" y="136" width="218" height="164" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="135" y="162" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#33582a" filter="url(#rough2)">① d ≥ 0（Alice 不落后）</text>
  <text x="135" y="190" text-anchor="middle" font-size="12" fill="#33582a" filter="url(#rough2)">Alice：一次拿光 c 颗</text>
  <text x="135" y="214" text-anchor="middle" font-size="12" fill="#33582a" filter="url(#rough2)">终局 A − B = d + c</text>
  <text x="135" y="238" text-anchor="middle" font-size="12" fill="#33582a" filter="url(#rough2)">= |d + c| ≥ |d|</text>
  <text x="135" y="274" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">ans = d + c</text>

  <!-- ② -->
  <rect x="281" y="136" width="218" height="164" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="390" y="162" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">② d &lt; 0 且 c ≥ 2e</text>
  <text x="390" y="190" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">Alice：一次拿光 c 颗</text>
  <text x="390" y="214" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">终局 = d + c = c − e</text>
  <text x="390" y="238" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">= |d + c| ≥ |d|</text>
  <text x="390" y="274" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">ans = c − e</text>

  <!-- ③ -->
  <rect x="536" y="136" width="218" height="164" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="645" y="162" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8c3a37" filter="url(#rough2)">③ d &lt; 0 且 c &lt; 2e</text>
  <text x="645" y="190" text-anchor="middle" font-size="12" fill="#8c3a37" filter="url(#rough2)">Alice：每轮都取 0</text>
  <text x="645" y="214" text-anchor="middle" font-size="12" fill="#8c3a37" filter="url(#rough2)">Bob 取石子只会拉大差距</text>
  <text x="645" y="238" text-anchor="middle" font-size="12" fill="#8c3a37" filter="url(#rough2)">⇒ 比分 ≥ e = |d|</text>
  <text x="645" y="274" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">ans = e = |d|</text>

  <text x="135" y="318" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">上界 = d + c（Bob 躺平也只能到这儿）</text>
  <text x="390" y="318" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">上界 = c − e，正好被拿满</text>
  <text x="645" y="318" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">上界 = e，|d + c| = e − c &lt; e</text>

  <rect x="40" y="336" width="700" height="72" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="390" y="360" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">三种情形的结论可以合并成一行（两个候选值取较大者）</text>
  <text x="390" y="392" text-anchor="middle" font-size="18" font-weight="bold" fill="#a14340" filter="url(#rough2)">ans = max(|d|, |d + c|)</text>
</svg>
