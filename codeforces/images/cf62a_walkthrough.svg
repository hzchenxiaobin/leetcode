<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400">
<defs>
  <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs>
<rect x="0" y="0" width="760" height="400" fill="#fafafa"/>
<text x="380.0" y="34" font-size="22" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="bold" text-anchor="middle" filter="url(#rough2)">样例：两种握手方式各试一次</text>
<text x="40" y="110" font-size="15" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="normal" text-anchor="start" filter="url(#rough2)">样例 1：a=(5,1)，b=(10,5)</text>
<text x="40" y="140" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#1a5fb4" font-weight="normal" text-anchor="start" filter="url(#rough2)">(女左5, 男右5) → 5∈[4,12] ✓</text>
<rect x="600" y="100" width="100" height="46" rx="6" fill="#e6f4ea" stroke="#999" stroke-width="2" filter="url(#rough2)"/>
<text x="650" y="130" font-size="17" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#2e7d32" font-weight="normal" text-anchor="middle" filter="url(#rough2)">YES</text>
<text x="40" y="205" font-size="15" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="normal" text-anchor="start" filter="url(#rough2)">样例 2：a=(4,5)，b=(3,3)</text>
<text x="40" y="235" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#1a5fb4" font-weight="normal" text-anchor="start" filter="url(#rough2)">(女左4, 男右3) → 3∈[3,10] ✓</text>
<rect x="600" y="195" width="100" height="46" rx="6" fill="#e6f4ea" stroke="#999" stroke-width="2" filter="url(#rough2)"/>
<text x="650" y="225" font-size="17" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#2e7d32" font-weight="normal" text-anchor="middle" filter="url(#rough2)">YES</text>
<text x="40" y="300" font-size="15" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="normal" text-anchor="start" filter="url(#rough2)">样例 3：a=(1,2)，b=(11,6)</text>
<text x="40" y="330" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#1a5fb4" font-weight="normal" text-anchor="start" filter="url(#rough2)">(1,6) → 6&gt;4 ✗；(2,11) → 11&gt;6 ✗</text>
<rect x="600" y="290" width="100" height="46" rx="6" fill="#fde8e8" stroke="#999" stroke-width="2" filter="url(#rough2)"/>
<text x="650" y="320" font-size="17" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#c0392b" font-weight="normal" text-anchor="middle" filter="url(#rough2)">NO</text>
<text x="380" y="382" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="normal" text-anchor="middle" filter="url(#rough2)">只有 (女左, 男右) 与 (女右, 男左) 两种配对</text>
</svg>
