<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="300" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">图的绝对中心：可以在边的内部取点</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">每个 x 给出两条直线的最小值（一个"帐篷"）</text>
  <g filter="url(#rough2)"><rect x="140" y="100" width="600" height="40" rx="3" fill="#eeeeee" fill-opacity="0.5" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="170" y="160" text-anchor="start" font-size="13" fill="#2f4a66" filter="url(#rough2)">边 (u,v,w)：点距 u 为 t（0&lt;=t&lt;=w）</text>
  <text x="170" y="200" text-anchor="start" font-size="13" fill="#2f4a66" filter="url(#rough2)">到 x 的距离 = min(d[u][x]+t, d[v][x]+w-t)</text>
  <text x="170" y="244" text-anchor="start" font-size="13" fill="#3d6b2f" filter="url(#rough2)">取所有 x 的最大，再对 t 求最小</text>
</svg>
