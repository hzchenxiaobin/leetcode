<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="440" fill="#fafafa"/>

  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两个方向各自向上取整，再相乘</text>
  <path d="M 150 46 Q 360 52 570 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 纵向边 m -->
  <rect x="60" y="100" width="40" height="280" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="60" y1="180" x2="100" y2="180" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="60" y1="280" x2="100" y2="280" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="236" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">a</text>
  <text x="80" y="336" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">a</text>
  <text x="80" y="146" text-anchor="middle" font-size="10" fill="#8a6015" filter="url(#rough2)">余</text>

  <!-- 第 3 块石板：伸出上边界 -->
  <rect x="60" y="80" width="40" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"
        stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="112" y="92" font-size="11" fill="#8a6015" filter="url(#rough2)">越界部分允许</text>

  <text x="112" y="124" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">⌈m/a⌉ = 3 行</text>
  <text x="112" y="148" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">前 2 块正好铺满整段</text>
  <text x="112" y="168" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">第 3 块只盖住余量</text>

  <!-- 横向边 n -->
  <rect x="60" y="340" width="500" height="40" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="195" y1="340" x2="195" y2="380" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="330" y1="340" x2="330" y2="380" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="465" y1="340" x2="465" y2="380" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="127" y="366" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">a</text>
  <text x="262" y="366" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">a</text>
  <text x="397" y="366" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">a</text>
  <text x="512" y="366" text-anchor="middle" font-size="10" fill="#8a6015" filter="url(#rough2)">余量</text>

  <!-- 第 4 块石板：伸出右边界 -->
  <rect x="465" y="340" width="135" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"
        stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="604" y="366" font-size="10" fill="#8a6015" filter="url(#rough2)">越界</text>

  <text x="60" y="404" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">n 方向：3 段完整的 a + 1 段余量 → ⌈n/a⌉ = 4 列</text>

  <!-- 右侧：列 × 行 -->
  <text x="498" y="76" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">列数 × 行数</text>
  <g filter="url(#rough2)">
    <rect x="430" y="90" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="464" y="90" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="498" y="90" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="532" y="90" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="430" y="124" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="464" y="124" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="498" y="124" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="532" y="124" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="430" y="158" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="464" y="158" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="498" y="158" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="532" y="158" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <text x="498" y="214" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">4 × 3 = 12 块</text>

  <rect x="400" y="230" width="290" height="100" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="412" y="260" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">答案 = ⌈n/a⌉ × ⌈m/a⌉</text>
  <text x="412" y="286" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">整数写法（避免浮点）：</text>
  <text x="412" y="308" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">(n + a - 1) / a × (m + a - 1) / a</text>
</svg>
