<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="330" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">A：两个样例——一个可解，一个无解</text>
  <path d="M 180 42 Q 380 47 580 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <rect x="40" y="70" width="330" height="238" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="94" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">样例 1：5 条，长度 1 2 3 5 7</text>
  <text x="52" y="120" font-size="11" fill="#3c5e2e" filter="url(#rough2)">a = [1, 2, 3, 5, 7]（下标 1..5）</text>
  <text x="52" y="146" font-size="11" fill="#3c5e2e" filter="url(#rough2)">试 i=3（a=3）：3 = 2 + 1 ✓</text>
  <text x="52" y="172" font-size="11" fill="#3c5e2e" filter="url(#rough2)">于是 j、k 可以取下标 2 和 1</text>

  <rect x="60" y="188" width="60" height="30" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="90" y="208" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">1</text>
  <rect x="128" y="188" width="60" height="30" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="158" y="208" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">2</text>
  <rect x="196" y="188" width="60" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="226" y="208" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">3</text>
  <rect x="264" y="188" width="60" height="30" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="294" y="208" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">5</text>
  <text x="52" y="242" font-size="11" fill="#2f5223" filter="url(#rough2)">输出 “3 2 1”（或 “3 1 2”，都对）</text>
  <text x="52" y="266" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">判分是 special judge：任意一组合法下标都算过</text>
  <text x="52" y="292" font-size="10.5" fill="#8c3a36" filter="url(#rough2)">别输出 “1 2 3”：那样 a_1 = 1 ≠ 2+3</text>

  <rect x="392" y="70" width="328" height="238" rx="10" fill="#fdeceb" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="404" y="94" font-size="12" font-weight="bold" fill="#8c3a36" filter="url(#rough2)">样例 2：5 条，长度 1 8 1 5 1</text>
  <text x="404" y="120" font-size="11" fill="#8c3a36" filter="url(#rough2)">a = [1, 8, 1, 5, 1]</text>
  <text x="404" y="146" font-size="11" fill="#8c3a36" filter="url(#rough2)">可能的和：1+1=2、1+5=6、1+8=9、5+8=13 …</text>
  <text x="404" y="172" font-size="11" fill="#8c3a36" filter="url(#rough2)">这些和都不在 {1, 8, 1, 5, 1} 里</text>
  <text x="404" y="198" font-size="11" fill="#8c3a36" filter="url(#rough2)">所以无解，输出 -1</text>
  <rect x="404" y="214" width="120" height="30" rx="5" fill="#ffffff" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="464" y="234" text-anchor="middle" font-size="11" fill="#8c3a36" filter="url(#rough2)">1</text>
  <rect x="532" y="214" width="120" height="30" rx="5" fill="#ffffff" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="592" y="234" text-anchor="middle" font-size="11" fill="#8c3a36" filter="url(#rough2)">8</text>
  <text x="404" y="270" font-size="10.5" fill="#8c3a36" filter="url(#rough2)">重复的 1 说明“等长”是允许的，但三个下标必须不同：</text>
  <text x="404" y="292" font-size="10.5" fill="#8c3a36" filter="url(#rough2)">1 = 1 + 0 不成立（没有长度为 0 的蠕虫）。</text>
</svg>
