<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="4.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="440" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">内部全是 1：质量只能从端点一格格搬，每搬一格丢 1</text>
  <path d="M 128 39 Q 360 45 592 39" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- 全 1 的情形 -->
  <rect x="24" y="50" width="672" height="62" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="42" y="77" font-size="12" fill="#a14340" filter="url(#rough2)">全部 aᵢ = 1：每个核都 &lt; 2，一步也拆不动</text>
  <text x="42" y="99" font-size="12" font-weight="bold" fill="#a14340" filter="url(#rough2)">→ 输出 −1（不是 0，也不是 n）</text>
  <rect x="470" y="64" width="34" height="26" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="487" y="83" text-anchor="middle" font-size="13" fill="#a14340" filter="url(#rough2)">1</text>
  <rect x="514" y="64" width="34" height="26" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="531" y="83" text-anchor="middle" font-size="13" fill="#a14340" filter="url(#rough2)">1</text>
  <rect x="558" y="64" width="34" height="26" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="575" y="83" text-anchor="middle" font-size="13" fill="#a14340" filter="url(#rough2)">1</text>
  <text x="646" y="83" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">卡死</text>

  <!-- 级联 -->
  <rect x="24" y="126" width="672" height="252" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="42" y="150" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">内部两格都是 1，只有右端 5 能拆 → 质量被迫一路向左推</text>

  <text x="42" y="196" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">初始</text>
  <rect x="190" y="170" width="54" height="34" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="217" y="193" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <rect x="250" y="170" width="54" height="34" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="277" y="193" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <rect x="310" y="170" width="54" height="34" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="337" y="193" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <rect x="370" y="170" width="54" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.3" filter="url(#rough2)"/>
  <text x="397" y="193" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6015" filter="url(#rough2)">5</text>
  <text x="452" y="193" font-size="11.5" fill="#888" filter="url(#rough2)">先拆它：5 = 4 + 1</text>

  <text x="42" y="248" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">第 1 次</text>
  <rect x="190" y="222" width="54" height="34" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="217" y="245" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <rect x="250" y="222" width="54" height="34" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="277" y="245" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <rect x="310" y="222" width="54" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.3" filter="url(#rough2)"/>
  <text x="337" y="245" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5d22" filter="url(#rough2)">5</text>
  <path d="M 432 200 L 432 222" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="452" y="245" font-size="11.5" fill="#a14340" filter="url(#rough2)">1 丢给环境 → 损失 1</text>

  <text x="42" y="300" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">第 2 次</text>
  <rect x="190" y="274" width="54" height="34" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="217" y="297" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <rect x="250" y="274" width="54" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.3" filter="url(#rough2)"/>
  <text x="277" y="297" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5d22" filter="url(#rough2)">5</text>
  <path d="M 432 252 L 432 274" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="452" y="297" font-size="11.5" fill="#a14340" filter="url(#rough2)">再丢 1 → 损失累计 2</text>

  <text x="42" y="352" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">第 3 次</text>
  <rect x="190" y="326" width="54" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.6" filter="url(#rough2)"/>
  <text x="217" y="349" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f5d22" filter="url(#rough2)">5</text>
  <path d="M 432 304 L 432 326" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="452" y="349" font-size="11.5" fill="#a14340" filter="url(#rough2)">再丢 1 → 损失累计 3</text>

  <rect x="24" y="392" width="672" height="40" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="417" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">Σa = 8，损失 = n − 1 = 3，答案 8 − 3 = 5（此时不可能更好）</text>
</svg>
