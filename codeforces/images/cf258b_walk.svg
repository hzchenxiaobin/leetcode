<svg xmlns="http://www.w3.org/2000/svg" width="880" height="280" viewBox="0 0 880 280"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="280" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 m=8：cnt = {0:6, 1:2}</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">小象取一个"幸运号"（4 或 7，2 种），剩下 6 个政党只能拿 6 个非幸运号 → 6! 种</text>
  <text x="150" y="110" text-anchor="start" font-size="12.5" fill="#555555" filter="url(#rough2)">数字 1..8：1 2 3 5 6 8 有 0 个幸运数字；4、7 有 1 个</text>
  <text x="150" y="150" text-anchor="start" font-size="12.5" fill="#b05a5a" filter="url(#rough2)">若小象取 0 个幸运数字的号 → 其余 6 个必须总幸运数 &lt; 0，不可能</text>
  <text x="150" y="190" text-anchor="start" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">若小象取 1 个幸运数字的号（2 选 1）→ 其余 6 个必须全是 0</text>
  <text x="150" y="230" text-anchor="start" font-size="14" fill="#2b2b2b" filter="url(#rough2)">方案数 = 2 × 6! = 1440</text>
</svg>
