<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="18"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">n = 12：先除以最小质因子 2 的链更大</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <circle cx="108.0" cy="130.0" r="24.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="108.0" y="138.0" text-anchor="middle" font-size="17" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">12</text>
  <circle cx="298.0" cy="130.0" r="24.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="298.0" y="138.0" text-anchor="middle" font-size="17" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">6</text>
  <circle cx="478.0" cy="130.0" r="24.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="478.0" y="138.0" text-anchor="middle" font-size="17" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <circle cx="638.0" cy="130.0" r="24.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="638.0" y="138.0" text-anchor="middle" font-size="17" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <line x1="134.0" y1="130.0" x2="274.0" y2="130.0" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <line x1="324.0" y1="130.0" x2="454.0" y2="130.0" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <line x1="504.0" y1="130.0" x2="614.0" y2="130.0" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="203.0" y="118.0" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">÷2</text>
  <text x="388.0" y="118.0" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">÷2</text>
  <text x="558.0" y="118.0" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">÷3</text>
  <text x="90.0" y="176.0" text-anchor="start" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">12 → 6 → 3 → 1：12 + 6 + 3 + 1 = 22 ★</text>
  <circle cx="108.0" cy="250.0" r="24.0" fill="#eeeeee" stroke="#888888" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="108.0" y="258.0" text-anchor="middle" font-size="17" fill="#555" font-weight="bold" filter="url(#rough2)">12</text>
  <circle cx="298.0" cy="250.0" r="24.0" fill="#eeeeee" stroke="#888888" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="298.0" y="258.0" text-anchor="middle" font-size="17" fill="#555" font-weight="bold" filter="url(#rough2)">4</text>
  <circle cx="478.0" cy="250.0" r="24.0" fill="#eeeeee" stroke="#888888" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="478.0" y="258.0" text-anchor="middle" font-size="17" fill="#555" font-weight="bold" filter="url(#rough2)">2</text>
  <circle cx="638.0" cy="250.0" r="24.0" fill="#eeeeee" stroke="#888888" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="638.0" y="258.0" text-anchor="middle" font-size="17" fill="#555" font-weight="bold" filter="url(#rough2)">1</text>
  <line x1="134.0" y1="250.0" x2="274.0" y2="250.0" stroke="#888888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="324.0" y1="250.0" x2="454.0" y2="250.0" stroke="#888888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="504.0" y1="250.0" x2="614.0" y2="250.0" stroke="#888888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="203.0" y="238.0" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">÷3</text>
  <text x="388.0" y="238.0" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">÷2</text>
  <text x="558.0" y="238.0" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">÷2</text>
  <text x="90.0" y="296.0" text-anchor="start" font-size="13" fill="#666" filter="url(#rough2)">12 → 4 → 2 → 1：12 + 4 + 2 + 1 = 19</text>
  <rect x="40.0" y="322.0" width="640.0" height="88.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="54.0" y="346.5" text-anchor="start" font-size="12.5" fill="#3f3420" filter="url(#rough2)">12 的最大真约数是 6 = 12 / spf(12)，比 4 更值得选</text>
  <text x="54.0" y="372.5" text-anchor="start" font-size="12.5" fill="#3f3420" filter="url(#rough2)">spf(x) 表示 x 的最小质因子；每步取 x / spf(x)</text>
  <text x="54.0" y="398.5" text-anchor="start" font-size="12.5" fill="#3f3420" filter="url(#rough2)">先小后大的除法让前缀值更大，和也更大</text>
</svg>
