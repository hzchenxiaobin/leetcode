<svg xmlns="http://www.w3.org/2000/svg" width="700" height="260" viewBox="0 0 700 260"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="1503"/>
    <feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></defs>
  <rect width="700" height="260" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">负数时"删一位"＝把绝对值变小 ⇒ 账户变大</text>
  <path d="M 150 40 Q 350 46 550 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="66" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="12.5" fill="#22314a" filter="url(#rough2)">n ≥ 0：删任何一位只会变小 ⇒ 答案是 n 本身。</text>
  <text x="76" y="106" font-size="12.5" fill="#22314a" filter="url(#rough2)">n &lt; 0：删末位 n/10、删次末位 (n/100)*10 + n%10，取三者最大。</text>
  <g filter="url(#rough2)"><rect x="60" y="132" width="580" height="76" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="156" font-size="12.5" fill="#2f5223" filter="url(#rough2)">样例 −10 ⇒ {−10, −1, 0} ⇒ 0 ✓（删次末位得到 −0 即 0）</text>
  <text x="76" y="180" font-size="12.5" fill="#2f5223" filter="url(#rough2)">样例 −100003 ⇒ {−100003, −10000, −10003} ⇒ −10000 ✓</text>
  <text x="76" y="200" font-size="12" fill="#3c5e2e" filter="url(#rough2)">样例 2230 ⇒ {2230, 223, 220} ⇒ 2230 ✓</text>
  <g filter="url(#rough2)"><rect x="60" y="216" width="580" height="34" rx="8" fill="#fbeeee" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="76" y="238" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">易错：C++ 负数除法向零截断，正好符合"删末位"语义（−10/10 = −1 ✓）。</text>
</svg>
