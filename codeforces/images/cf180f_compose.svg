<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="85"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="440" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">180F：由 p² = a、p³ = b 反推 p</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="80.0" y="120.0" width="130.0" height="54.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="145.0" y="152.8" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold" filter="url(#rough2)">p</text>
  <rect x="300.0" y="120.0" width="130.0" height="54.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="365.0" y="152.0" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">p² = a</text>
  <rect x="520.0" y="120.0" width="130.0" height="54.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="585.0" y="152.0" text-anchor="middle" font-size="14" fill="#8a6015" font-weight="bold" filter="url(#rough2)">p³ = b</text>
  <line x1="214.0" y1="147.0" x2="294.0" y2="147.0" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="254.0" y="132.0" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">再复合 p</text>
  <line x1="434.0" y1="147.0" x2="514.0" y2="147.0" stroke="#8a6015" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="474.0" y="132.0" text-anchor="middle" font-size="10.5" fill="#8a6015" filter="url(#rough2)">再复合 p</text>
  <rect x="40.0" y="210.0" width="640.0" height="90.0" fill="#f3e8fd" stroke="#6b4c9a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="54.0" y="234.5" text-anchor="start" font-size="12.5" fill="#3f3420" filter="url(#rough2)">b = p³ = a ∘ p（因为 a = p²，再复合一次 p）</text>
  <text x="54.0" y="262.5" text-anchor="start" font-size="12.5" fill="#3f3420" filter="url(#rough2)">所以 p = a⁻¹ ∘ b，即 p[i] = inv_a[ b[i] ]</text>
  <rect x="40.0" y="316.0" width="640.0" height="76.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="54.0" y="339.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">a 是排列，a⁻¹ 只需一行：inv[a[i]] = i</text>
  <text x="54.0" y="365.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">题目保证解存在且唯一，求出的 p 必然满足 p² = a</text>
</svg>
