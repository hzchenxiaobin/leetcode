<svg xmlns="http://www.w3.org/2000/svg" width="720" height="270" viewBox="0 0 720 270"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="351"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="270" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2：a = "aa"，b = "a"，L = 1，R = 1</text>
  <g font-size="13" filter="url(#rough2)">
    <text x="90" y="80" fill="#666">删除位置</text>
    <text x="260" y="80" fill="#666">删后</text>
    <text x="420" y="80" fill="#666">是否等于 b</text>
  </g>
  <g stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)">
    <line x1="80" y1="92" x2="640" y2="92"/><line x1="80" y1="132" x2="640" y2="132"/>
  </g>
  <g font-size="13" filter="url(#rough2)">
    <text x="90" y="120" fill="#2f5223">1</text><text x="260" y="120" fill="#2f5223">"a"</text><text x="420" y="120" fill="#2f5223">✓</text>
    <text x="90" y="160" fill="#2f5223">2</text><text x="260" y="160" fill="#2f5223">"a"</text><text x="420" y="160" fill="#2f5223">✓</text>
  </g>
  <rect x="80" y="184" width="560" height="60" rx="9" fill="#eef4ec" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="96" y="208" font-size="12.5" fill="#2f5223" filter="url(#rough2)">区间 [m−1−R, L] = [2−1−1, 1] = [0, 1]，即位置 1 和 2。</text>
  <text x="96" y="230" font-size="12.5" fill="#2f5223" filter="url(#rough2)">输出 2，第二行 1 2。</text>
</svg>
