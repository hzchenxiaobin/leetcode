<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="461"/>
    <feDisplacementMap in="SourceGraphic" scale="1.5"/></filter></defs>
  <rect width="700" height="300" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">题面那张"二维码"其实是 33×33 的数据表</text>
  <path d="M 120 40 Q 350 46 580 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="86" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="12.5" fill="#22314a" filter="url(#rough2)">把官方图片存下来量一下：有效区域 198×198 像素、最小游程 6 像素 ⇒ 恰好 33×33 个模块。</text>
  <text x="76" y="106" font-size="12.5" fill="#22314a" filter="url(#rough2)">而输入是 0..32 的两个整数 —— 与 33 完全对上！所以</text>
  <text x="76" y="130" font-size="13" fill="#8a3a36" filter="url(#rough2)">答案 = 该 33×33 位图中第 (a₁, a₂) 格的像素值（0/1）。</text>
  <g filter="url(#rough2)"><rect x="60" y="158" width="580" height="66" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="182" font-size="12.5" fill="#2f5223" filter="url(#rough2)">验证：样例 (1,1)→0、(3,7)→0、(13,10)→1，与位图 g[a₁][a₂] 完全一致 ✓</text>
  <text x="76" y="206" font-size="12.5" fill="#2f5223" filter="url(#rough2)">（转置 g[a₂][a₁] 在 (13,10) 处会得 0 ≠ 1 ⇒ 行列顺序也被样例钉死了。）</text>
  <g filter="url(#rough2)"><rect x="60" y="238" width="580" height="46" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="76" y="262" font-size="12.5" fill="#8a6015" filter="url(#rough2)">解法：把 33 行位图硬编码成 33 个字符串，输出对应字符，O(1)。</text>
  <text x="76" y="280" font-size="11.5" fill="#8a6015" filter="url(#rough2)">这就是"答案与输入无关、只与图片有关"的常量表。</text>
</svg>
