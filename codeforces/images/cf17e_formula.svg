<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="61"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="320" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">E：相交对 = 全部对 − 不相交对</text>
  <path d="M 150 42 Q 380 47 610 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <text x="52" y="80" font-size="11.5" fill="#555" filter="url(#rough2)">不相交的两个回文之间必有一条“缝”：前一个在 i 结束，后一个从 ≥ i+1 开始，且这种切法是唯一的。</text>

  <line x1="52" y1="130" x2="700" y2="130" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="96" y="112" width="120" height="18" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="156" y="126" text-anchor="middle" font-size="10" fill="#2f5223" filter="url(#rough2)">回文 A（在 i 结束）</text>
  <line x1="216" y1="104" x2="216" y2="136" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="216" y="152" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">i</text>
  <rect x="250" y="112" width="150" height="18" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="325" y="126" text-anchor="middle" font-size="10" fill="#2f4a66" filter="url(#rough2)">回文 B（从 ≥ i+1 开始）</text>

  <rect x="52" y="170" width="300" height="130" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="64" y="194" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">公式</text>
  <text x="64" y="220" font-size="10.5" fill="#3c5e88" filter="url(#rough2)">P = Σ endCnt[i]　（回文总数）</text>
  <text x="64" y="244" font-size="10.5" fill="#3c5e88" filter="url(#rough2)">不相交 = Σ_i endCnt[i] · suffixStart[i+1]</text>
  <text x="64" y="268" font-size="10.5" fill="#3c5e88" filter="url(#rough2)">答案 = C(P, 2) − 不相交</text>
  <text x="64" y="290" font-size="10" fill="#8c3a36" filter="url(#rough2)">（suffixStart 是“从 ≥ 某位置开头的回文个数”）</text>

  <rect x="376" y="170" width="336" height="130" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="388" y="194" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">为什么这样拆分不重不漏</text>
  <text x="388" y="218" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">· 每一对回文，要么有公共位置，要么没有；</text>
  <text x="388" y="240" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">· 没有公共位置时，按“前一个的右端点 i”</text>
  <text x="388" y="260" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">　归类，i 唯一，后一个必须完全在 i 右侧；</text>
  <text x="388" y="282" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">· 于是按 i 枚举 endCnt[i] × suffixStart[i+1]</text>
  <text x="388" y="298" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">　正好把每个不相交对数了恰好一次。</text>

  <text x="52" y="308" font-size="10" fill="#777" filter="url(#rough2)">取模 51123987：C(P,2) 先对 2·MOD 取模再除 2，避免 P² ≈ 4·10^24 溢出 64 位。</text>
</svg>
