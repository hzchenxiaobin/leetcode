<svg xmlns="http://www.w3.org/2000/svg" width="740" height="430" viewBox="0 0 740 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrb2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="740" height="430" fill="#fafafa"/>
  <text x="370" y="36" font-size="20" fill="#2b2b2b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">把棋盘转 45°：每步都有 |Δu| + |Δv| = 2</text>
  <path d="M 130 46 Q 370 52 610 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <line x1="21" y1="327" x2="389" y2="327" stroke="#eceef0" stroke-width="1" filter="url(#rough2)"/>
  <line x1="113" y1="51" x2="113" y2="419" stroke="#eceef0" stroke-width="1" filter="url(#rough2)"/>
  <line x1="21" y1="281" x2="389" y2="281" stroke="#eceef0" stroke-width="1" filter="url(#rough2)"/>
  <line x1="159" y1="51" x2="159" y2="419" stroke="#eceef0" stroke-width="1" filter="url(#rough2)"/>
  <line x1="21" y1="235" x2="389" y2="235" stroke="#eceef0" stroke-width="1" filter="url(#rough2)"/>
  <line x1="205" y1="51" x2="205" y2="419" stroke="#eceef0" stroke-width="1" filter="url(#rough2)"/>
  <line x1="21" y1="189" x2="389" y2="189" stroke="#eceef0" stroke-width="1" filter="url(#rough2)"/>
  <line x1="251" y1="51" x2="251" y2="419" stroke="#eceef0" stroke-width="1" filter="url(#rough2)"/>
  <line x1="21" y1="143" x2="389" y2="143" stroke="#eceef0" stroke-width="1" filter="url(#rough2)"/>
  <line x1="297" y1="51" x2="297" y2="419" stroke="#eceef0" stroke-width="1" filter="url(#rough2)"/>
  <line x1="205" y1="235" x2="297" y2="235" stroke="#446688" stroke-width="2" marker-end="url(#arrb2)" filter="url(#rough2)"/>
  <text x="325" y="239" font-size="11.5" fill="#2f4a66" text-anchor="middle" filter="url(#rough2)">(1, 1)</text>
  <line x1="205" y1="235" x2="297" y2="143" stroke="#446688" stroke-width="2" marker-end="url(#arrb2)" filter="url(#rough2)"/>
  <text x="325" y="119" font-size="11.5" fill="#2f4a66" text-anchor="middle" filter="url(#rough2)">(2, 0)</text>
  <line x1="205" y1="235" x2="205" y2="143" stroke="#446688" stroke-width="2" marker-end="url(#arrb2)" filter="url(#rough2)"/>
  <text x="205" y="119" font-size="11.5" fill="#2f4a66" text-anchor="middle" filter="url(#rough2)">(1, -1)</text>
  <line x1="205" y1="235" x2="113" y2="143" stroke="#446688" stroke-width="2" marker-end="url(#arrb2)" filter="url(#rough2)"/>
  <text x="85" y="119" font-size="11.5" fill="#2f4a66" text-anchor="middle" filter="url(#rough2)">(0, -2)</text>
  <line x1="205" y1="235" x2="113" y2="235" stroke="#446688" stroke-width="2" marker-end="url(#arrb2)" filter="url(#rough2)"/>
  <text x="85" y="239" font-size="11.5" fill="#2f4a66" text-anchor="middle" filter="url(#rough2)">(-1, -1)</text>
  <line x1="205" y1="235" x2="113" y2="327" stroke="#446688" stroke-width="2" marker-end="url(#arrb2)" filter="url(#rough2)"/>
  <text x="85" y="359" font-size="11.5" fill="#2f4a66" text-anchor="middle" filter="url(#rough2)">(-2, 0)</text>
  <line x1="205" y1="235" x2="205" y2="327" stroke="#446688" stroke-width="2" marker-end="url(#arrb2)" filter="url(#rough2)"/>
  <text x="205" y="359" font-size="11.5" fill="#2f4a66" text-anchor="middle" filter="url(#rough2)">(-1, 1)</text>
  <line x1="205" y1="235" x2="297" y2="327" stroke="#446688" stroke-width="2" marker-end="url(#arrb2)" filter="url(#rough2)"/>
  <text x="325" y="359" font-size="11.5" fill="#2f4a66" text-anchor="middle" filter="url(#rough2)">(0, 2)</text>
  <circle cx="205" cy="235" r="5" fill="#b85450" stroke="#8a3030" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="430" y="90" width="280" height="118" rx="10" fill="#f2f6fb" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="450" y="120" font-size="14" fill="#2f4a66" text-anchor="start" font-weight="bold" filter="url(#rough2)">旋转坐标</text>
  <text x="450" y="148" font-size="16" fill="#2f4a66" text-anchor="start" font-weight="bold" filter="url(#rough2)">u = x + y ,  v = x − y</text>
  <text x="450" y="176" font-size="11.5" fill="#44546a" text-anchor="start" filter="url(#rough2)">顶点格点 ⇒ u ≡ v (mod 2)</text>
  <text x="450" y="196" font-size="11.5" fill="#44546a" text-anchor="start" filter="url(#rough2)">反之 (u,v) 同奇偶即可还原整数点</text>
  <rect x="430" y="230" width="280" height="96" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="450" y="258" font-size="14" fill="#8a6015" text-anchor="start" font-weight="bold" filter="url(#rough2)">总变差恒等式</text>
  <text x="450" y="288" font-size="17" fill="#8a6015" text-anchor="start" font-weight="bold" filter="url(#rough2)">TV_u + TV_v = 2N</text>
  <text x="450" y="314" font-size="11.5" fill="#7a5a1b" text-anchor="start" filter="url(#rough2)">（每一步贡献恰好 2）</text>
  <rect x="60" y="348" width="650" height="64" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="80" y="374" font-size="12" fill="#2b2b2b" text-anchor="start" filter="url(#rough2)">于是「最少步数」= 「u 方向总行程 + v 方向总行程」的一半：把两维的行程合并在一步里，</text>
  <text x="80" y="398" font-size="12" fill="#2b2b2b" text-anchor="start" filter="url(#rough2)">所以八方向的答案比只走四方向（曼哈顿）少一半。</text>
</svg>
