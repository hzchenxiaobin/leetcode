<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="101"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="a4" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="300" fill="#fafafa"/>
  <text x="360" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">先满足点名要的块，再用最小可用编号补满 n 个</text>

  <g font-size="11" fill="#446688" text-anchor="middle" filter="url(#rough2)">
    <text x="360" y="48">样例：n = 2, k = 3, a = (5, 1, 3)，橙子共 6 块</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="80"  y="60" width="76" height="46" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="170" y="60" width="76" height="46" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="260" y="60" width="76" height="46" rx="7" fill="#fde9d9" stroke="#b4652a" stroke-width="1.6"/>
    <rect x="350" y="60" width="76" height="46" rx="7" fill="#f2f2f2" stroke="#888888" stroke-width="1.6"/>
    <rect x="440" y="60" width="76" height="46" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
    <rect x="530" y="60" width="76" height="46" rx="7" fill="#f2f2f2" stroke="#888888" stroke-width="1.6"/>
  </g>
  <g font-size="15" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">
    <text x="118" y="90">1</text><text x="208" y="90">2</text><text x="298" y="90">3</text>
    <text x="388" y="90">4</text><text x="478" y="90">5</text><text x="568" y="90">6</text>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#446688" filter="url(#rough2)">
    <text x="118" y="122">/</text><text x="208" y="122">②</text><text x="298" y="122">③</text>
    <text x="388" y="122">/</text><text x="478" y="122">①</text><text x="568" y="122">/</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="146" width="600" height="130" rx="9" fill="#eef6ec" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <g font-size="12" fill="#2f5223" filter="url(#rough2)">
    <text x="76" y="170" font-weight="bold">分配结果（每个孩子 2 块）</text>
    <text x="76" y="196">孩子 1：要 5 → {5, 2}（2 是最小空闲号）</text>
    <text x="76" y="220">孩子 2：要 1 → {1, 4}（4 是最小空闲号）</text>
    <text x="76" y="244">孩子 3：要 3 → {3, 6}（6 是最小空闲号）</text>
    <text x="76" y="268" fill="#7a4b22">只要每个孩子拿到 n 块且互不重叠，顺序随意（本题是 special judge）</text>
  </g>
</svg>
