<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="720" height="400" fill="#fafafa"/>
  <text x="360.0" y="33" font-size="20" font-weight="bold" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">固定 d 的判定：从左往右贪心铺 3 段</text>
  <path d="M 250 44 Q 360.0 50 470 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 60 250 L 680 250" stroke="#555" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 90 244 L 90 256" stroke="#555" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="90" y="274" font-size="10.5" font-weight="normal" fill="#555" text-anchor="middle" filter="url(#rough2)">x1</text>
  <path d="M 150 244 L 150 256" stroke="#555" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="150" y="274" font-size="10.5" font-weight="normal" fill="#555" text-anchor="middle" filter="url(#rough2)">x2</text>
  <path d="M 210 244 L 210 256" stroke="#555" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="210" y="274" font-size="10.5" font-weight="normal" fill="#555" text-anchor="middle" filter="url(#rough2)">x3</text>
  <path d="M 320 244 L 320 256" stroke="#555" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="320" y="274" font-size="10.5" font-weight="normal" fill="#555" text-anchor="middle" filter="url(#rough2)">x4</text>
  <path d="M 380 244 L 380 256" stroke="#555" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="380" y="274" font-size="10.5" font-weight="normal" fill="#555" text-anchor="middle" filter="url(#rough2)">x5</text>
  <path d="M 470 244 L 470 256" stroke="#555" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="470" y="274" font-size="10.5" font-weight="normal" fill="#555" text-anchor="middle" filter="url(#rough2)">x6</text>
  <path d="M 540 244 L 540 256" stroke="#555" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="540" y="274" font-size="10.5" font-weight="normal" fill="#555" text-anchor="middle" filter="url(#rough2)">x7</text>
  <path d="M 600 244 L 600 256" stroke="#555" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="600" y="274" font-size="10.5" font-weight="normal" fill="#555" text-anchor="middle" filter="url(#rough2)">x8</text>
  <rect x="86" y="152" width="128" height="22" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 150.0 156 L 150.0 170" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="150.0" y="146" font-size="10" font-weight="bold" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">段 1：中心 x₁ + d</text>
  <path d="M 90 246 L 90 174" stroke="#c0cbd6" stroke-width="1.0" fill="none" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <path d="M 150 246 L 150 174" stroke="#c0cbd6" stroke-width="1.0" fill="none" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <path d="M 210 246 L 210 174" stroke="#c0cbd6" stroke-width="1.0" fill="none" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <rect x="316" y="152" width="68" height="22" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 350.0 156 L 350.0 170" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="350.0" y="146" font-size="10" font-weight="bold" fill="#446688" text-anchor="middle" filter="url(#rough2)">段 2：中心 x₄ + d</text>
  <path d="M 320 246 L 320 174" stroke="#c0cbd6" stroke-width="1.0" fill="none" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <path d="M 380 246 L 380 174" stroke="#c0cbd6" stroke-width="1.0" fill="none" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <rect x="466" y="152" width="138" height="22" rx="8" fill="#fff8e1" stroke="#b08a2e" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 535.0 156 L 535.0 170" stroke="#b08a2e" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="535.0" y="146" font-size="10" font-weight="bold" fill="#b08a2e" text-anchor="middle" filter="url(#rough2)">段 3：中心 x₆ + d</text>
  <path d="M 470 246 L 470 174" stroke="#c0cbd6" stroke-width="1.0" fill="none" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <path d="M 540 246 L 540 174" stroke="#c0cbd6" stroke-width="1.0" fill="none" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <path d="M 600 246 L 600 174" stroke="#c0cbd6" stroke-width="1.0" fill="none" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <text x="360" y="302" font-size="12" font-weight="normal" fill="#333" text-anchor="middle" filter="url(#rough2)">第 k 段：取最左未覆盖点 xᵢ，把区间左端顶到 xᵢ，右端自然到 xᵢ + 2d</text>
  <text x="360" y="322" font-size="11.5" font-weight="normal" fill="#555" text-anchor="middle" filter="url(#rough2)">然后跳过所有 ≤ xᵢ + 2d 的点，进入下一段；3 段用尽仍有点没盖住就判不可行</text>
  <text x="360" y="350" font-size="11.5" font-weight="normal" fill="#2f5223" text-anchor="middle" filter="url(#rough2)">为什么最优：任何盖住 xᵢ 的区间右端都不超过 xᵢ + 2d，</text>
  <text x="360" y="370" font-size="11.5" font-weight="normal" fill="#2f5223" text-anchor="middle" filter="url(#rough2)">所以把左端推到底不会比别的放法少盖点 → 贪心每步覆盖最多的前缀。</text>
</svg>
