<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="61"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>

  <rect width="760" height="470" fill="#fafafa"/>

  <text x="380" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">走查表：官方 9 组样例的判定过程</text>
  <path d="M 196 44 Q 380 51 564 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 表头 -->
  <rect x="40" y="56" width="680" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="75" y="79" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">a</text>
  <text x="145" y="79" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">b</text>
  <text x="235" y="79" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">b ≤ a+1 ?</text>
  <text x="345" y="79" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">a − b 奇偶</text>
  <text x="510" y="79" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">被访问的时刻</text>
  <text x="670" y="79" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">答案</text>

  <!-- 第 1 行 -->
  <rect x="40" y="92" width="680" height="34" fill="#fafafa" stroke="#b9c6d4" stroke-width="1" filter="url(#rough2)"/>
  <text x="75" y="114" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="145" y="114" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="235" y="114" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">是</text>
  <text x="345" y="114" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">偶</text>
  <text x="510" y="114" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">第 0 次（起点）</text>
  <text x="670" y="114" text-anchor="middle" font-size="13" fill="#3c5e2e" filter="url(#rough2)">0</text>

  <!-- 第 2 行 -->
  <rect x="40" y="126" width="680" height="34" fill="#f6f8fb" stroke="#b9c6d4" stroke-width="1" filter="url(#rough2)"/>
  <text x="75" y="148" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="145" y="148" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="235" y="148" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">是</text>
  <text x="345" y="148" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">奇</text>
  <text x="510" y="148" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">第 1 次竖移后</text>
  <text x="670" y="148" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">1</text>

  <!-- 第 3 行 -->
  <rect x="40" y="160" width="680" height="34" fill="#fce4ec" stroke="#b9c6d4" stroke-width="1" filter="url(#rough2)"/>
  <text x="75" y="182" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="145" y="182" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="235" y="182" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">否</text>
  <text x="345" y="182" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">偶</text>
  <text x="510" y="182" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">不可能（|y| 超界）</text>
  <text x="670" y="182" text-anchor="middle" font-size="13" fill="#a14340" filter="url(#rough2)">−1</text>

  <!-- 第 4 行 -->
  <rect x="40" y="194" width="680" height="34" fill="#fafafa" stroke="#b9c6d4" stroke-width="1" filter="url(#rough2)"/>
  <text x="75" y="216" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="145" y="216" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="235" y="216" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">是</text>
  <text x="345" y="216" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">奇</text>
  <text x="510" y="216" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">第 2 次竖移后</text>
  <text x="670" y="216" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">2</text>

  <!-- 第 5 行 -->
  <rect x="40" y="228" width="680" height="34" fill="#f6f8fb" stroke="#b9c6d4" stroke-width="1" filter="url(#rough2)"/>
  <text x="75" y="250" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="145" y="250" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="235" y="250" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">是</text>
  <text x="345" y="250" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">奇</text>
  <text x="510" y="250" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">第 3 次竖移后</text>
  <text x="670" y="250" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">3</text>

  <!-- 第 6 行 -->
  <rect x="40" y="262" width="680" height="34" fill="#fafafa" stroke="#b9c6d4" stroke-width="1" filter="url(#rough2)"/>
  <text x="75" y="284" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="145" y="284" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="235" y="284" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">是</text>
  <text x="345" y="284" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">奇</text>
  <text x="510" y="284" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">第 3 次竖移后</text>
  <text x="670" y="284" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">3</text>

  <!-- 第 7 行 -->
  <rect x="40" y="296" width="680" height="34" fill="#f6f8fb" stroke="#b9c6d4" stroke-width="1" filter="url(#rough2)"/>
  <text x="75" y="318" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <text x="145" y="318" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">6</text>
  <text x="235" y="318" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">是</text>
  <text x="345" y="318" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">奇</text>
  <text x="510" y="318" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">第 6 次竖移后</text>
  <text x="670" y="318" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">6</text>

  <!-- 第 8 行 -->
  <rect x="40" y="330" width="680" height="34" fill="#fafafa" stroke="#b9c6d4" stroke-width="1" filter="url(#rough2)"/>
  <text x="75" y="352" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">1000</text>
  <text x="145" y="352" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">999</text>
  <text x="235" y="352" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">是</text>
  <text x="345" y="352" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">奇</text>
  <text x="510" y="352" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">第 1001 次竖移后</text>
  <text x="670" y="352" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">1001</text>

  <!-- 第 9 行 -->
  <rect x="40" y="364" width="680" height="34" fill="#f6f8fb" stroke="#b9c6d4" stroke-width="1" filter="url(#rough2)"/>
  <text x="75" y="386" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">1000</text>
  <text x="145" y="386" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">1000</text>
  <text x="235" y="386" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">是</text>
  <text x="345" y="386" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">偶</text>
  <text x="510" y="386" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">第 1000 次结束</text>
  <text x="670" y="386" text-anchor="middle" font-size="13" fill="#3c5e2e" filter="url(#rough2)">1000</text>

  <!-- 列分隔线 -->
  <path d="M 110 56 L 110 398 M 180 56 L 180 398 M 290 56 L 290 398 M 400 56 L 400 398 M 620 56 L 620 398"
        stroke="#b9c6d4" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <!-- 说明 -->
  <rect x="40" y="406" width="680" height="52" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="380" y="428" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">看第 3 行：b = a + 2 与 a 同奇偶，却仍然到不了 —— 因为 |y_a| ≤ a 把它拦住了</text>
  <text x="380" y="448" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">看第 4、5 行：奇偶不符并不等于不可达，只是要多走一次操作</text>
</svg>
