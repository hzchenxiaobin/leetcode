<svg xmlns="http://www.w3.org/2000/svg" width="780" height="430" viewBox="0 0 780 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.027" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="780" height="430" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：一遍差分 + 一遍前缀和 + 一遍检查</text>
  <text x="390" y="52" text-anchor="middle" font-size="12" fill="#66788c" filter="url(#rough2)">不需要真的写 2-SAT：禁止约束是"负向"的，未禁即宝最安全</text>

  <!-- ① 差分标记 -->
  <rect x="230" y="66" width="320" height="54" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="88" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">① 差分标记：每个 b_i = d &gt; 0</text>
  <text x="390" y="108" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">把开区间 (i−d, i+d) 的内部整体加一</text>
  <path d="M390,122 L390,142" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② 前缀和 -->
  <rect x="230" y="144" width="320" height="54" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="166" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">② 前缀和 → forbidden[j]</text>
  <text x="390" y="186" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">被覆盖次数 &gt; 0 的位置禁止藏宝</text>
  <path d="M390,200 L390,220" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ③ 检查 -->
  <rect x="230" y="222" width="320" height="76" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="390" y="244" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">③ 逐条检查已知位</text>
  <text x="390" y="264" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">b_i = 0 → 岛 i 必须没被禁</text>
  <text x="390" y="284" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">b_i = d &gt; 0 → i±d 至少一个没被禁</text>

  <!-- 失败分支 -->
  <path d="M552,260 L600,260" fill="none" stroke="#b85450" stroke-width="1.7" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="604" y="234" width="140" height="52" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="2.1" filter="url(#rough2)"/>
  <text x="674" y="256" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">任一条失败</text>
  <text x="674" y="275" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">输出 −1</text>

  <path d="M390,300 L390,320" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ④ 输出 -->
  <rect x="230" y="322" width="320" height="52" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.1" filter="url(#rough2)"/>
  <text x="390" y="344" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">④ 输出：forbidden[j] ? 0 : 1</text>
  <text x="390" y="364" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">未被禁的位置全部藏宝（保证非空）</text>

  <text x="390" y="394" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">每个 b_i = d 的"命中"由第 ③ 步担保，而所有宝藏都在禁止区间外，故最近距离恰为 d</text>
  <text x="390" y="414" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">整张图已毁时没有禁止区间，输出全 1；n = 1 时同样退化为单个 1</text>
</svg>
