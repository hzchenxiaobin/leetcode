<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2b2b2b"/>
    </marker>
  </defs>

  <rect width="760" height="400" fill="#fafafa"/>
  <text x="380" y="30" text-anchor="middle" font-size="17.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">凸包拆成两条 x 单调的链：点在内 ⟺ 下(x) ≤ y ≤ 上(x)</text>
  <path d="M 70 40 Q 380 46 690 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 坐标轴 -->
  <line x1="50" y1="330" x2="700" y2="330" stroke="#2b2b2b" stroke-width="1.4" marker-end="url(#ar2)" filter="url(#rough2)"/>
  <line x1="50" y1="330" x2="50" y2="60" stroke="#2b2b2b" stroke-width="1.4" marker-end="url(#ar2)" filter="url(#rough2)"/>
  <text x="704" y="334" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">x</text>
  <text x="36" y="58" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">y</text>

  <!-- 凸包 -->
  <polygon points="90,300 210,150 380,120 540,200 650,300 380,300" fill="#eef2f7" stroke="none" filter="url(#rough2)"/>
  <!-- 上链 -->
  <polyline points="90,300 210,150 380,120 540,200 650,300" fill="none" stroke="#446688" stroke-width="2.4" filter="url(#rough2)"/>
  <!-- 下链 -->
  <polyline points="90,300 380,300 650,300" fill="none" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>

  <!-- 顶点 -->
  <g fill="#2b2b2b" filter="url(#rough2)">
    <circle cx="90" cy="300" r="3.6"/>
    <circle cx="210" cy="150" r="3.6"/>
    <circle cx="380" cy="120" r="3.6"/>
    <circle cx="540" cy="200" r="3.6"/>
    <circle cx="650" cy="300" r="3.6"/>
  </g>

  <!-- x = 450 的截面 -->
  <line x1="450" y1="330" x2="450" y2="96" stroke="#8a6015" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <line x1="450" y1="330" x2="450" y2="176" stroke="#8a6015" stroke-width="3" filter="url(#rough2)"/>
  <text x="456" y="92" font-size="11.5" fill="#8a6015" filter="url(#rough2)">x = t</text>
  <circle cx="450" cy="150" r="4.6" fill="#2f7a3a" filter="url(#rough2)"/>
  <text x="462" y="152" font-size="11.5" fill="#1f5226" filter="url(#rough2)">P 在内：YES</text>
  <circle cx="450" cy="255" r="4.6" fill="#b85450" filter="url(#rough2)"/>
  <text x="462" y="258" font-size="11.5" fill="#8c2f2b" filter="url(#rough2)">Q 在外：NO</text>

  <!-- 标注 -->
  <text x="300" y="106" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">上凸壳（斜率严格递减）</text>
  <text x="250" y="326" font-size="12.5" font-weight="bold" fill="#8c2f2b" filter="url(#rough2)">下凸壳（斜率严格递增）</text>
  <text x="456" y="316" font-size="11" fill="#8a6015" filter="url(#rough2)">截面 [下(t), 上(t)]</text>

  <!-- 右侧结论 -->
  <rect x="470" y="58" width="252" height="112" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="484" y="80" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">查询只需两次判断</text>
  <text x="484" y="102" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">① x 在 [minx, maxx] 之外 → NO</text>
  <text x="484" y="124" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">② 否则比较 y 与 上(x)、下(x)：</text>
  <text x="484" y="146" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">　下(x) ≤ y ≤ 上(x) 才是 YES</text>
  <text x="484" y="164" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">链上相邻点用叉积插值，整数运算</text>

  <rect x="40" y="350" width="680" height="40" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="375" font-size="12" fill="#2f4a66" filter="url(#rough2)">竖直边只可能出现在最左 / 最右的 x 上：此时上链存该 x 的最大 y、下链存最小 y，比较仍然正确。</text>
</svg>
