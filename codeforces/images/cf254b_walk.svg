<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="320" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2：12 月 7 日需要 1+2 = 3 个人</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">三场比赛的准备期在 12 月 7 日重叠，答案 3</text>
  <line x1="110" y1="180" x2="800" y2="180" stroke="#8899aa" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="140" y1="172" x2="140" y2="188" stroke="#8899aa" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="140" y="208" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">12/5</text>
  <line x1="260" y1="172" x2="260" y2="188" stroke="#8899aa" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="260" y="208" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">12/6</text>
  <line x1="380" y1="172" x2="380" y2="188" stroke="#8899aa" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="380" y="208" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">12/7</text>
  <line x1="500" y1="172" x2="500" y2="188" stroke="#8899aa" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="500" y="208" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">12/8</text>
  <line x1="620" y1="172" x2="620" y2="188" stroke="#8899aa" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="620" y="208" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">12/9</text>
  <g filter="url(#rough2)"><rect x="140" y="96" width="240" height="34" rx="3" fill="#cfe0f0" fill-opacity="0.75" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="260" y="120" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">B: p=1, 覆盖 12/5-12/7</text>
  <g filter="url(#rough2)"><rect x="260" y="136" width="120" height="34" rx="3" fill="#f6d9d7" fill-opacity="0.75" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="320" y="160" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">C: p=2, 12/6-12/7</text>
  <g filter="url(#rough2)"><rect x="500" y="140" width="60" height="34" rx="3" fill="#d7ecd0" fill-opacity="0.8" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="560" y="164" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">A: 12/8</text>
  <text x="380" y="250" text-anchor="middle" font-size="13" fill="#b05a5a" filter="url(#rough2)">12/7：B 的 1 人 + C 的 2 人 = 3</text>
  <text x="440" y="292" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">其他日期都不超过 3，所以陪审团至少 3 人，且 3 人足够</text>
</svg>
