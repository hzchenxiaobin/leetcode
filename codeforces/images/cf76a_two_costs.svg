<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="720" height="440" fill="#fafafa"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">礼物的两个维度：金币门槛 a 与银币门槛 b</text>
  <path d="M 200 43 Q 360 49 520 43" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 80 360 L 640 360" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 80 360 L 80 90" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="640" y="382" text-anchor="end" font-size="12" fill="#446688" filter="url(#rough2)">金币门槛 a</text>
  <text x="96" y="86" text-anchor="start" font-size="12" fill="#446688" filter="url(#rough2)">银币门槛 b</text>
  <rect x="80" y="200" width="300" height="160" rx="2" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="6 5" filter="url(#rough2)"/>
  <text x="230" y="186" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">礼物 (a,b)：只买通矩形内的边</text>
  <circle cx="150" cy="320" r="6" fill="#e9f4e2" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="159" y="324" text-anchor="start" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">e1</text>
  <circle cx="200" cy="260" r="6" fill="#e9f4e2" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="209" y="264" text-anchor="start" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">e2</text>
  <circle cx="250" cy="300" r="6" fill="#e9f4e2" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="259" y="304" text-anchor="start" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">e3</text>
  <circle cx="330" cy="220" r="6" fill="#e9f4e2" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="339" y="224" text-anchor="start" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">e4</text>
  <circle cx="430" cy="160" r="6" fill="#ffffff" stroke="#777777" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="439" y="164" text-anchor="start" font-size="10.5" fill="#777777" filter="url(#rough2)">e5</text>
  <circle cx="500" cy="250" r="6" fill="#ffffff" stroke="#777777" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="509" y="254" text-anchor="start" font-size="10.5" fill="#777777" filter="url(#rough2)">e6</text>
  <circle cx="390" cy="330" r="6" fill="#ffffff" stroke="#777777" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="399" y="334" text-anchor="start" font-size="10.5" fill="#777777" filter="url(#rough2)">e7</text>
  <text x="90" y="400" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">g_i ≤ a 且 s_i ≤ b 的边全部安全；其余照旧被抢。</text>
  <text x="90" y="424" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">最优解里 a 一定取某条边的 g_i（再大只多花钱），于是只需在 N-1 条候选 a 上枚举。</text>
  <rect x="470" y="96" width="226" height="132" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="583" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">总花费</text>
  <text x="583" y="148" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">cost = a·G + b·S</text>
  <text x="583" y="176" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">固定 a = g_i 后</text>
  <text x="583" y="198" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">只需让最大 s 最小</text>
  <text x="583" y="220" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">→ 最小瓶颈生成树</text>
  <rect x="452" y="262" width="250" height="78" rx="7" fill="#e9f4e2" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="577" y="286" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">瓶颈 = MST 里最后一条边</text>
  <text x="577" y="308" text-anchor="middle" font-size="11" fill="#3c5e2e" filter="url(#rough2)">按 s 升序做 Kruskal，</text>
  <text x="577" y="328" text-anchor="middle" font-size="11" fill="#3c5e2e" filter="url(#rough2)">最大 s 就落在最后一条上</text>
</svg>
