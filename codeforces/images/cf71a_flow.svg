<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr71af" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="300" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">每个单词只做一次长度判断</text>

  <rect x="30" y="112" width="140" height="56" rx="8" fill="#eef4fb" stroke="#446688" stroke-width="1.8"
        filter="url(#rough2)"/>
  <text x="100" y="145" text-anchor="middle" font-size="14" fill="#2b3a4a" filter="url(#rough2)">读入单词 s</text>

  <path d="M170 140 L206 140" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr71af)"
        filter="url(#rough2)"/>

  <polygon points="210,140 300,92 390,140 300,188" fill="#fff8e1" stroke="#c9a227" stroke-width="1.8"
           filter="url(#rough2)"/>
  <text x="300" y="145" text-anchor="middle" font-size="14" fill="#6b4e12" filter="url(#rough2)">|s| &gt; 10 ?</text>

  <path d="M390 120 Q 424 100 452 88" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr71af)"
        filter="url(#rough2)"/>
  <text x="410" y="108" font-size="13" fill="#446688" filter="url(#rough2)">是</text>
  <path d="M390 160 Q 424 180 452 192" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr71af)"
        filter="url(#rough2)"/>
  <text x="410" y="182" font-size="13" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="455" y="52" width="235" height="58" rx="8" fill="#e8f0e0" stroke="#4a7a3a" stroke-width="1.8"
        filter="url(#rough2)"/>
  <text x="572" y="78" text-anchor="middle" font-size="13" fill="#2f5223" filter="url(#rough2)">首字母 + (|s|-2) + 末字母</text>
  <text x="572" y="98" text-anchor="middle" font-size="11" fill="#4a6a3c" filter="url(#rough2)">例：internationalization → i18n</text>

  <rect x="455" y="168" width="235" height="58" rx="8" fill="#f7e6e6" stroke="#b85450" stroke-width="1.8"
        filter="url(#rough2)"/>
  <text x="572" y="194" text-anchor="middle" font-size="13" fill="#7a2f2c" filter="url(#rough2)">原样输出 s</text>
  <text x="572" y="214" text-anchor="middle" font-size="11" fill="#8a4a46" filter="url(#rough2)">例：word（长度 4）→ word</text>

  <text x="60" y="262" font-size="12.5" fill="#4a4a4a" filter="url(#rough2)">判断只看长度，中间的字母内容完全不影响结果</text>
</svg>
