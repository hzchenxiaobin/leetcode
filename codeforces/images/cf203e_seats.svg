<svg xmlns="http://www.w3.org/2000/svg" width="720" height="370" viewBox="0 0 720 370"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="370" fill="#fafafa"/>
  <text x="360.0" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">203E：座位即“容量 - 自身”，结构是一棵森林</text>
  <path d="M 144.00 46 Q 360.0 52 576.00 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="70" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">搬运结构是一棵树：自己走的机器人是根，每个“被搬运”的机器人占 1 个座位、同时又提供 c_i 个座位。</text>
  <text x="60" y="90" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">所以能开始搬运，当且仅当根（自己走的机器人）的座位总数 ≥ 1。</text>
  <circle cx="200" cy="140" r="22" fill="#cfe3c8" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="200" y="145" text-anchor="middle" font-size="11" fill="#2f5b34" filter="url(#rough2)">c=2</text>
  <text x="200" y="112" text-anchor="middle" font-size="10" fill="#2f5b34" filter="url(#rough2)">自己走 (l ≥ d)</text>
  <circle cx="120" cy="215" r="20" fill="#f6e3a8" stroke="#c08a30" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="120" y="220" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">c=1</text>
  <circle cx="290" cy="215" r="20" fill="#f3c9d3" stroke="#c0708a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="290" y="220" text-anchor="middle" font-size="11" fill="#8a3a52" filter="url(#rough2)">c=0</text>
  <circle cx="150" cy="285" r="20" fill="#f3c9d3" stroke="#c0708a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="150" y="290" text-anchor="middle" font-size="11" fill="#8a3a52" filter="url(#rough2)">c=0</text>
  <line x1="182" y1="158" x2="134" y2="198" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="220" y1="150" x2="272" y2="200" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="128" y1="234" x2="145" y2="268" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="360" y="150" text-anchor="start" font-size="10.5" fill="#2f5b34" filter="url(#rough2)">根 c=2：占 0 座位、提供 2 个</text>
  <text x="360" y="172" text-anchor="start" font-size="10.5" fill="#8a6015" filter="url(#rough2)">c=1 被搬运：占 1、提供 1（净 0）</text>
  <text x="360" y="194" text-anchor="start" font-size="10.5" fill="#8a3a52" filter="url(#rough2)">c=0 被搬运：占 1、提供 0（净 -1）</text>
  <rect x="60" y="276" width="620" height="56" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="294" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">记 K = Σ_{c_i ≥ 1}(c_i - 1)（所有“有座位”机器人净贡献之和），m1 = 自己走的中 c_i ≥ 1 的个数。</text>
  <text x="74" y="316" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">搬完全部 c_i ≥ 1 的机器人后剩余座位 = K + m1，再用它去搬 c_i = 0 的机器人。</text>
</svg>
