<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>

  <rect width="760" height="420" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">演算：n = 6，k = 2，a = [0, 0, 2, 1, 0, 0]</text>
  <path d="M 150 42 Q 380 49 610 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="380" y="66" text-anchor="middle" font-size="12.5" fill="#66788c" filter="url(#rough2)">cnt = [4, 1, 1, 0, 0, …]，S(v) 即前缀个数</text>

  <rect x="40" y="84" width="680" height="36" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="105" y="107" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">v</text>
  <text x="235" y="107" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">cnt[v]</text>
  <text x="370" y="107" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">S(v)</text>
  <text x="505" y="107" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">(v+1)·k</text>
  <text x="640" y="107" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">判定</text>

  <rect x="40" y="120" width="680" height="36" rx="5" fill="#fafafa" stroke="#c8d0d8" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="105" y="143" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="235" y="143" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="370" y="143" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="505" y="143" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="640" y="143" text-anchor="middle" font-size="13" fill="#3c5e2e" filter="url(#rough2)">✓ 可行</text>

  <rect x="40" y="156" width="680" height="36" rx="5" fill="#fafafa" stroke="#c8d0d8" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="105" y="179" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="235" y="179" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="370" y="179" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="505" y="179" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="640" y="179" text-anchor="middle" font-size="13" fill="#3c5e2e" filter="url(#rough2)">✓ 可行</text>

  <rect x="40" y="192" width="680" height="36" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="105" y="215" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="235" y="215" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="370" y="215" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <text x="505" y="215" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <text x="640" y="215" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">✓ 恰好相等</text>

  <rect x="40" y="228" width="680" height="36" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="105" y="251" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="235" y="251" text-anchor="middle" font-size="13" font-weight="bold" fill="#a14340" filter="url(#rough2)">0</text>
  <text x="370" y="251" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <text x="505" y="251" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>
  <text x="640" y="251" text-anchor="middle" font-size="13" font-weight="bold" fill="#a14340" filter="url(#rough2)">✗ 停止</text>

  <rect x="40" y="282" width="680" height="112" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="306" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">对应分组：{0, 0}、{0, 1}、{2, 0}，最大值集合 {0, 1, 2} ⇒ mex = 3</text>
  <text x="56" y="332" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">v = 3 时 cnt[3] = 0：没有任何元素能当“最大值为 3”的组长，故 mex 不可能到 4</text>
  <text x="56" y="358" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">v = 2 处 S(2) = 6 与 (2+1)·2 = 6 恰好相等，说明元素刚好够用，一个不多</text>
  <text x="56" y="382" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">答案 = 最后一个成功处 + 1 = 3，与样例输出一致</text>
</svg>
