<svg xmlns="http://www.w3.org/2000/svg" width="780" height="430" viewBox="0 0 780 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="817"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="780" height="430" fill="#fafafa"/>
  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">样例 3 走查：队列逐步变化</text>

  <!-- 行模板：编号小球 + 说明 -->
  <!-- 第 1 行 -->
  <text x="40" y="80" font-size="10.5" fill="#555" filter="url(#rough2)">人 1 (a=2,c=3)</text>
  <circle cx="200" cy="76" r="17" fill="#dbe7fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="200" y="81" text-anchor="middle" font-size="11" fill="#23405c" filter="url(#rough2)">1</text>
  <text x="240" y="80" font-size="10" fill="#446688" filter="url(#rough2)">队列空，直接入队</text>

  <!-- 第 2 行 -->
  <text x="40" y="130" font-size="10.5" fill="#555" filter="url(#rough2)">人 2 (a=1,c=4)</text>
  <circle cx="200" cy="126" r="17" fill="#dbe7fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="200" y="131" text-anchor="middle" font-size="11" fill="#23405c" filter="url(#rough2)">1</text>
  <circle cx="245" cy="126" r="17" fill="#a8d8a8" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="245" y="131" text-anchor="middle" font-size="11" fill="#204a1e" filter="url(#rough2)">2</text>
  <text x="280" y="130" font-size="10" fill="#446688" filter="url(#rough2)">前面 a=2 &gt; 1，挡住不动</text>

  <!-- 第 3 行 -->
  <text x="40" y="180" font-size="10.5" fill="#555" filter="url(#rough2)">人 3 (a=4,c=3)</text>
  <circle cx="200" cy="176" r="17" fill="#a8d8a8" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="181" text-anchor="middle" font-size="11" fill="#204a1e" filter="url(#rough2)">3</text>
  <circle cx="245" cy="176" r="17" fill="#dbe7fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="245" y="181" text-anchor="middle" font-size="11" fill="#23405c" filter="url(#rough2)">1</text>
  <circle cx="290" cy="176" r="17" fill="#dbe7fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="290" y="181" text-anchor="middle" font-size="11" fill="#23405c" filter="url(#rough2)">2</text>
  <text x="325" y="180" font-size="10" fill="#446688" filter="url(#rough2)">越过 2、1 共 2 次，到队头</text>

  <!-- 第 4 行 -->
  <text x="40" y="230" font-size="10.5" fill="#555" filter="url(#rough2)">人 4 (a=3,c=1)</text>
  <circle cx="200" cy="226" r="17" fill="#a8d8a8" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="231" text-anchor="middle" font-size="11" fill="#204a1e" filter="url(#rough2)">3</text>
  <circle cx="245" cy="226" r="17" fill="#dbe7fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="245" y="231" text-anchor="middle" font-size="11" fill="#23405c" filter="url(#rough2)">1</text>
  <circle cx="290" cy="226" r="17" fill="#ffd9b3" stroke="#b06a2c" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="231" text-anchor="middle" font-size="11" fill="#8a4a14" filter="url(#rough2)">4</text>
  <circle cx="335" cy="226" r="17" fill="#dbe7fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="335" y="231" text-anchor="middle" font-size="11" fill="#23405c" filter="url(#rough2)">2</text>
  <text x="370" y="230" font-size="10" fill="#446688" filter="url(#rough2)">越过 1 一次，c=1 用尽</text>

  <!-- 第 5 行 -->
  <text x="40" y="280" font-size="10.5" fill="#555" filter="url(#rough2)">人 5 (a=5,c=2)</text>
  <circle cx="200" cy="276" r="17" fill="#a8d8a8" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="281" text-anchor="middle" font-size="11" fill="#204a1e" filter="url(#rough2)">3</text>
  <circle cx="245" cy="276" r="17" fill="#dbe7fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="245" y="281" text-anchor="middle" font-size="11" fill="#23405c" filter="url(#rough2)">1</text>
  <circle cx="290" cy="276" r="17" fill="#c0392b" stroke="#8c2318" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="281" text-anchor="middle" font-size="11" fill="#ffffff" filter="url(#rough2)">5</text>
  <circle cx="335" cy="276" r="17" fill="#ffd9b3" stroke="#b06a2c" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="335" y="281" text-anchor="middle" font-size="11" fill="#8a4a14" filter="url(#rough2)">4</text>
  <circle cx="380" cy="276" r="17" fill="#dbe7fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="380" y="281" text-anchor="middle" font-size="11" fill="#23405c" filter="url(#rough2)">2</text>
  <text x="415" y="280" font-size="10" fill="#446688" filter="url(#rough2)">越过 1、3 两次</text>

  <!-- 结果 -->
  <rect x="40" y="308" width="700" height="44" rx="9" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="56" y="336" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">最终队列：3 1 5 4 2</text>
  <text x="260" y="336" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">（红球是刚插入的人 5）</text>

  <text x="40" y="376" font-size="10.5" fill="#666" filter="url(#rough2)">每行是该人插入"之后"的队伍，右边说明这一步越过了几个人；插入位置 = max(L − c, p + 1)。</text>
  <text x="40" y="398" font-size="10.5" fill="#8c3b37" filter="url(#rough2)">例如第 4 步：L=3，p=0（a=4 在人 3 处最大且 &gt; 3），pos = max(3−1, 1) = 2。</text>
  <text x="40" y="418" font-size="10.5" fill="#8c3b37" filter="url(#rough2)">第 5 步：L=4，p=−1（没有比 5 大的），pos = max(4−2, 0) = 2。</text>
</svg>
