<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="420" fill="#fafafa"/>
  <text x="360" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">样例 3 走查：n = 12，共 8 把三和弦</text>
  <text x="360" y="46" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">f[x] 写在 a[x] 的正下方，颜色表示数值是否相同</text>

  <text x="26" y="86" font-size="14" fill="#446688" filter="url(#rough2)">a</text>
  <text x="26" y="142" font-size="14" fill="#b85450" filter="url(#rough2)">f</text>

  <!-- a 行 -->
  <text x="74" y="64" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">1</text>
  <rect x="52" y="68" width="44" height="32" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="90" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">−4</text>

  <text x="124" y="64" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">2</text>
  <rect x="102" y="68" width="44" height="32" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="124" y="90" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>

  <text x="174" y="64" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">3</text>
  <rect x="152" y="68" width="44" height="32" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="174" y="90" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>

  <text x="224" y="64" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">4</text>
  <rect x="202" y="68" width="44" height="32" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="224" y="90" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">−4</text>

  <text x="274" y="64" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">5</text>
  <rect x="252" y="68" width="44" height="32" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="274" y="90" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">−4</text>

  <text x="324" y="64" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">6</text>
  <rect x="302" y="68" width="44" height="32" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="324" y="90" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">−1</text>

  <text x="374" y="64" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">7</text>
  <rect x="352" y="68" width="44" height="32" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="374" y="90" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">−4</text>

  <text x="424" y="64" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">8</text>
  <rect x="402" y="68" width="44" height="32" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="424" y="90" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <text x="474" y="64" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">9</text>
  <rect x="452" y="68" width="44" height="32" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="474" y="90" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">−3</text>

  <text x="524" y="64" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">10</text>
  <rect x="502" y="68" width="44" height="32" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="524" y="90" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">−2</text>

  <text x="574" y="64" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">11</text>
  <rect x="552" y="68" width="44" height="32" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="574" y="90" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">−2</text>

  <text x="624" y="64" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">12</text>
  <rect x="602" y="68" width="44" height="32" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="624" y="90" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">−1</text>

  <!-- f 行 -->
  <text x="74" y="116" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">x=1</text>
  <rect x="52" y="120" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="74" y="143" text-anchor="middle" font-size="15" fill="#2f5d25" filter="url(#rough2)">0</text>

  <text x="124" y="116" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">2</text>
  <rect x="102" y="120" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="124" y="143" text-anchor="middle" font-size="15" fill="#2f5d25" filter="url(#rough2)">0</text>

  <text x="174" y="116" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">3</text>
  <rect x="152" y="120" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="174" y="143" text-anchor="middle" font-size="15" fill="#2f5d25" filter="url(#rough2)">0</text>

  <text x="224" y="116" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">4</text>
  <rect x="202" y="120" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="224" y="143" text-anchor="middle" font-size="14" fill="#2b4a66" filter="url(#rough2)">−6</text>

  <text x="274" y="116" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">5</text>
  <rect x="252" y="120" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="274" y="143" text-anchor="middle" font-size="14" fill="#8a5c10" filter="url(#rough2)">−5</text>

  <text x="324" y="116" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">6</text>
  <rect x="302" y="120" width="44" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="324" y="143" text-anchor="middle" font-size="15" fill="#8f3a37" filter="url(#rough2)">2</text>

  <text x="374" y="116" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">7</text>
  <rect x="352" y="120" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="374" y="143" text-anchor="middle" font-size="14" fill="#8a5c10" filter="url(#rough2)">−5</text>

  <text x="424" y="116" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">8</text>
  <rect x="402" y="120" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="424" y="143" text-anchor="middle" font-size="15" fill="#2f5d25" filter="url(#rough2)">0</text>

  <!-- 撞键弧线：差 2 的同值对 -->
  <path d="M74,156 Q124,178 172,156" stroke="#b85450" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M274,156 Q324,178 372,156" stroke="#b85450" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="123" y="192" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">差 2，撞键</text>
  <text x="323" y="192" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">差 2，撞键</text>

  <!-- 分组结论 -->
  <rect x="52" y="204" width="300" height="94" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="70" y="230" font-size="13" fill="#2f5d25" filter="url(#rough2)">值 0：起点 1, 2, 3, 8</text>
  <text x="70" y="256" font-size="13" fill="#333" filter="url(#rough2)">C(4,2) = 6 对，(1,3) 撞键要减</text>
  <text x="70" y="282" font-size="13" fill="#2f5d25" filter="url(#rough2)">净得 6 − 1 = 5</text>

  <rect x="368" y="204" width="238" height="94" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="386" y="230" font-size="13" fill="#8a5c10" filter="url(#rough2)">值 −5：起点 5, 7</text>
  <text x="386" y="256" font-size="13" fill="#333" filter="url(#rough2)">C(2,2)=1 对，(5,7) 撞键</text>
  <text x="386" y="282" font-size="13" fill="#8a5c10" filter="url(#rough2)">净得 1 − 1 = 0</text>

  <rect x="150" y="318" width="420" height="50" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="360" y="349" text-anchor="middle" font-size="16" fill="#2b4a66" filter="url(#rough2)">总数 6 + 1 = 7，减去撞键 2 对 ⇒ 答案 5</text>

  <text x="360" y="394" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">值 −6 与值 2 各只出现一次，凑不出成对的组合</text>
</svg>
