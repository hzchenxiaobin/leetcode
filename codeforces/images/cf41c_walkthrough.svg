<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="451"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="280" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2：dotdotdotatdotdotat → dot..@..at</text>
  <g font-family="monospace" font-size="15" filter="url(#rough2)">
    <text x="50" y="94" fill="#2f4a66">dot</text><text x="105" y="94" fill="#2f4a66">dot</text><text x="160" y="94" fill="#2f4a66">dot</text>
    <text x="215" y="94" fill="#d6a040">at</text><text x="255" y="94" fill="#2f4a66">dot</text><text x="310" y="94" fill="#2f4a66">dot</text><text x="365" y="94" fill="#d6a040">at</text>
  </g>
  <g font-size="11" fill="#666" filter="url(#rough2)" text-anchor="middle">
    <text x="72" y="70">保留</text><text x="127" y="70">还原</text><text x="182" y="70">还原</text>
    <text x="230" y="70">选它</text><text x="277" y="70">还原</text><text x="332" y="70">保留</text><text x="382" y="70">保留</text>
  </g>
  <g font-family="monospace" font-size="18" filter="url(#rough2)">
    <text x="70" y="160" fill="#2f5223">dot</text>
    <text x="130" y="160" fill="#2f5223">.</text>
    <text x="160" y="160" fill="#2f5223">.</text>
    <text x="190" y="160" fill="#8f3b37">@</text>
    <text x="220" y="160" fill="#2f5223">.</text>
    <text x="250" y="160" fill="#2f5223">.</text>
    <text x="280" y="160" fill="#2f5223">at</text>
  </g>
  <rect x="70" y="196" width="580" height="56" rx="9" fill="#eef4ec" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="86" y="220" font-size="12.5" fill="#2f5223" filter="url(#rough2)">开头的 dot 与结尾的 at 都不能替，其余全部替换。</text>
  <text x="86" y="242" font-size="12.5" fill="#2f5223" filter="url(#rough2)">输出 dot..@..at。</text>
</svg>
