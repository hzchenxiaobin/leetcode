<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 424" width="840" height="424"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="21"/>
      <feDisplacementMap in="SourceGraphic" scale="1.3"/>
    </filter>
  </defs>

  <rect width="840" height="424" fill="#fafafa"/>

  <text x="420" y="30" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">第 5 组样例走查：a = [2, 7, 1, 10, 4]</text>
  <text x="420" y="52" text-anchor="middle" font-size="12.2" fill="#777" filter="url(#rough2)">降序 a = [10, 7, 4, 2, 1]，n = 5，fact = 4! = 24；每轮先记贡献，再并入前缀</text>

  <!-- 表头 -->
  <rect x="60" y="72" width="730" height="36" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="100" y="95" text-anchor="middle" font-size="11.6" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">轮次 j</text>
  <text x="200" y="95" text-anchor="middle" font-size="11.6" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">a[v_j]</text>
  <text x="365" y="95" text-anchor="middle" font-size="11.6" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">pref = 更大评分之和</text>
  <text x="560" y="95" text-anchor="middle" font-size="11.6" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">(n−1)!/j</text>
  <text x="720" y="95" text-anchor="middle" font-size="11.6" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">本轮贡献</text>

  <!-- 行 1 -->
  <rect x="60" y="108" width="730" height="40" rx="4" fill="#ffffff" stroke="#8fa8c0" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="100" y="134" text-anchor="middle" font-size="12.6" fill="#333" filter="url(#rough2)">1</text>
  <text x="200" y="134" text-anchor="middle" font-size="12.6" fill="#333" filter="url(#rough2)">7</text>
  <text x="365" y="134" text-anchor="middle" font-size="12.6" fill="#333" filter="url(#rough2)">10</text>
  <text x="560" y="134" text-anchor="middle" font-size="12.6" fill="#333" filter="url(#rough2)">24 / 1 = 24</text>
  <text x="720" y="134" text-anchor="middle" font-size="12.6" font-weight="bold" fill="#8a6015" filter="url(#rough2)">240</text>

  <!-- 行 2 -->
  <rect x="60" y="148" width="730" height="40" rx="4" fill="#f7f9fc" stroke="#8fa8c0" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="100" y="174" text-anchor="middle" font-size="12.6" fill="#333" filter="url(#rough2)">2</text>
  <text x="200" y="174" text-anchor="middle" font-size="12.6" fill="#333" filter="url(#rough2)">4</text>
  <text x="365" y="174" text-anchor="middle" font-size="12.6" fill="#333" filter="url(#rough2)">10 + 7 = 17</text>
  <text x="560" y="174" text-anchor="middle" font-size="12.6" fill="#333" filter="url(#rough2)">24 / 2 = 12</text>
  <text x="720" y="174" text-anchor="middle" font-size="12.6" font-weight="bold" fill="#8a6015" filter="url(#rough2)">204</text>

  <!-- 行 3 -->
  <rect x="60" y="188" width="730" height="40" rx="4" fill="#ffffff" stroke="#8fa8c0" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="100" y="214" text-anchor="middle" font-size="12.6" fill="#333" filter="url(#rough2)">3</text>
  <text x="200" y="214" text-anchor="middle" font-size="12.6" fill="#333" filter="url(#rough2)">2</text>
  <text x="365" y="214" text-anchor="middle" font-size="12.6" fill="#333" filter="url(#rough2)">10 + 7 + 4 = 21</text>
  <text x="560" y="214" text-anchor="middle" font-size="12.6" fill="#333" filter="url(#rough2)">24 / 3 = 8</text>
  <text x="720" y="214" text-anchor="middle" font-size="12.6" font-weight="bold" fill="#8a6015" filter="url(#rough2)">168</text>

  <!-- 行 4 -->
  <rect x="60" y="228" width="730" height="40" rx="4" fill="#f7f9fc" stroke="#8fa8c0" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="100" y="254" text-anchor="middle" font-size="12.6" fill="#333" filter="url(#rough2)">4</text>
  <text x="200" y="254" text-anchor="middle" font-size="12.6" fill="#333" filter="url(#rough2)">1</text>
  <text x="365" y="254" text-anchor="middle" font-size="12.6" fill="#333" filter="url(#rough2)">10 + 7 + 4 + 2 = 23</text>
  <text x="560" y="254" text-anchor="middle" font-size="12.6" fill="#333" filter="url(#rough2)">24 / 4 = 6</text>
  <text x="720" y="254" text-anchor="middle" font-size="12.6" font-weight="bold" fill="#8a6015" filter="url(#rough2)">138</text>

  <!-- 汇总 -->
  <rect x="60" y="282" width="730" height="62" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="78" y="306" font-size="12" fill="#8a6015" filter="url(#rough2)">Σ 贡献 = 240 + 204 + 168 + 138 = 750　；　(S − a[max])·fact = (24 − 10) × 24 = 336</text>
  <text x="78" y="331" font-size="15" font-weight="bold" fill="#8a6015" filter="url(#rough2)">ans = 750 − 336 = 414　✓ 与官方输出一致</text>

  <!-- 解读 -->
  <rect x="60" y="356" width="730" height="52" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="78" y="378" font-size="11.6" fill="#33582a" filter="url(#rough2)">读法：最低分 1 有 4 个候选父亲，每个恰在 24/4 = 6 棵王朝里当它的父亲，故 138 = 6 × (10+7+4+2)；</text>
  <text x="78" y="398" font-size="11.6" fill="#33582a" filter="url(#rough2)">而 7 只有 10 一个候选，边 7→10 出现在全部 24 棵王朝里，故 240 = 24 × 10。</text>
</svg>
