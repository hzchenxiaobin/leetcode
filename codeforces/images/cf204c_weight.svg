<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="340" fill="#fafafa"/>
  <text x="360.0" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">204C：为什么权重长这样</text>
  <path d="M 144.00 46 Q 360.0 52 576.00 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="72" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">固定 a 的位置 p=2、b 的位置 q=1（0 基），长度 L 与偏移 t 的自由度：</text>
  <text x="60" y="92" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">t 可取 0..min(p,q)=1；对每个 t，L 有 n−max(p,q)=n−2 种选择。</text>
  <text x="156" y="144" text-anchor="end" font-size="11" fill="#33506e" filter="url(#rough2)">a:</text>
  <text x="156" y="184" text-anchor="end" font-size="11" fill="#33506e" filter="url(#rough2)">b:</text>
  <rect x="180" y="120" width="40" height="40" fill="#ffffff" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="180" y="160" width="40" height="40" fill="#ffffff" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="220" y="120" width="40" height="40" fill="#ffffff" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="220" y="160" width="40" height="40" fill="#cfe3c8" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="260" y="120" width="40" height="40" fill="#f6e3a8" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="260" y="160" width="40" height="40" fill="#ffffff" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="300" y="120" width="40" height="40" fill="#ffffff" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="300" y="160" width="40" height="40" fill="#ffffff" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="340" y="120" width="40" height="40" fill="#ffffff" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="340" y="160" width="40" height="40" fill="#ffffff" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="380" y="120" width="40" height="40" fill="#ffffff" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="380" y="160" width="40" height="40" fill="#ffffff" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="280.0" y="112" text-anchor="middle" font-size="10" fill="#8a6015" font-weight="bold" filter="url(#rough2)">p</text>
  <text x="240.0" y="218" text-anchor="middle" font-size="10" fill="#2f5b34" font-weight="bold" filter="url(#rough2)">q</text>
  <path d="M 280.0 166 L 240.0 154" stroke="#8a3a52" stroke-width="1.5" fill="none" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <rect x="60" y="236" width="620" height="80" rx="9" fill="#fdeef1" stroke="#c0708a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="254" text-anchor="start" font-size="11" fill="#8a3a52" filter="url(#rough2)">把 p、q 当成“对齐点”：偏移 t 决定哪个字符对对齐（t ≤ min(p,q)），</text>
  <text x="74" y="276" text-anchor="start" font-size="11" fill="#8a3a52" filter="url(#rough2)">长度 L 决定还能向右延伸多少（L 的个数 = n − max(p,q) 与 t 无关）。</text>
  <text x="74" y="298" text-anchor="start" font-size="11" fill="#8a3a52" filter="url(#rough2)">所以贡献 = (min(p,q)+1)·(n−max(p,q)) —— 与 L 的具体值无关。</text>
</svg>
