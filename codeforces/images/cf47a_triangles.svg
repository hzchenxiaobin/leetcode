<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="471"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="320" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">A：三角数就是 1+2+…+k 个点</text>
  <path d="M 200 40 Q 380 45 560 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 边长 4 的三角点阵 -->
  <circle cx="150" cy="80" r="5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="120" cy="120" r="5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="180" cy="120" r="5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="90" cy="160" r="5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="150" cy="160" r="5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="210" cy="160" r="5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="60" cy="200" r="5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="120" cy="200" r="5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="180" cy="200" r="5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="240" cy="200" r="5" fill="#446688" filter="url(#rough2)"/>
  <text x="150" y="234" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">边长 4：1+2+3+4 = 10 个点</text>

  <rect x="380" y="70" width="340" height="100" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="392" y="94" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">第 k 个三角数</text>
  <text x="392" y="120" font-size="13" fill="#2f4a66" filter="url(#rough2)">T(k) = 1 + 2 + … + k = k(k+1)/2</text>
  <text x="392" y="146" font-size="10.5" fill="#3c5e88" filter="url(#rough2)">n ≤ 500 ⇒ k ≤ 31（T(31)=496，T(32)=528）</text>

  <rect x="60" y="250" width="660" height="54" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="72" y="274" font-size="11" fill="#2f5223" filter="url(#rough2)">做法一：从 k=1 开始累加/直接算 k(k+1)/2，直到超过 n —— O(√n)，500 以内最多 31 步。</text>
  <text x="72" y="294" font-size="11" fill="#2f5223" filter="url(#rough2)">做法二：解 8n+1 是否为完全平方数（判别式），同样 O(√n)；两种做法可互相验证。</text>
</svg>
