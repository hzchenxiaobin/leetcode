<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="360" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法四步：算起点 → 逐个枚举倍数</text>
  <path d="M 180 42 Q 360 48 540 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <rect x="40" y="72" width="180" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="130" y="94" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">x ≥ 1 → t ≥ y+1</text>
  <text x="130" y="112" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">总量的下界</text>

  <line x1="222" y1="98" x2="248" y2="98" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="252" y="72" width="200" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="352" y="94" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">start = ⌈(y+1)/k⌉·k</text>
  <text x="352" y="112" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">第一个不小于 y+1 的倍数</text>

  <line x1="454" y1="98" x2="480" y2="98" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="484" y="72" width="190" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="579" y="94" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">t = start, start+k, …</text>
  <text x="579" y="112" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">直到 t &gt; n 为止</text>

  <path d="M 579 128 L 579 152" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="430" y="156" width="250" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="555" y="178" text-anchor="middle" font-size="12" fill="#7a5a1b" filter="url(#rough2)">输出 x = t − y</text>
  <text x="555" y="196" text-anchor="middle" font-size="11" fill="#7a5a1b" filter="url(#rough2)">每个 t 恰好对应一个 x</text>

  <rect x="60" y="156" width="330" height="52" rx="8" fill="#fde8e8" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="74" y="178" font-size="12" fill="#8c2f2b" filter="url(#rough2)">若 start &gt; n，一个答案都没有</text>
  <text x="74" y="196" font-size="11.5" fill="#8c2f2b" filter="url(#rough2)">此时输出单个 −1（样例 1 就是这种情况）</text>

  <rect x="60" y="236" width="600" height="96" rx="9" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="260" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1：y=10, k=1, n=10</text>
  <text x="74" y="282" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">x ≥ 1 → t ≥ 11 &gt; n = 10，连一个合法总量都没有 → 输出 −1</text>
  <text x="74" y="306" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2：start = ⌈11/6⌉·6 = 12，然后 t = 12,18,24,30,36（42 &gt; 40 停）</text>
  <text x="74" y="326" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">输出 2 8 14 20 26，与官方一致</text>
</svg>
