<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="780" height="400" fill="#fafafa"/>
  <text x="390.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按 A 降序，前 k−1 个必须“靠走”，第 k 个开始可以坐地铁</text>
  <path d="M 135.36000000000013 46 Q 390.0 52 644.6399999999999 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60.0" y="66.0" width="660.0" height="58.0" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="92.0" text-anchor="start" font-size="11.8" font-weight="bold" fill="#2f5b34" filter="url(#rough2)">答案 = min( max A, min_k max( A_k, R_{k−1}, ⌈(A_k + W_{k−1})/2⌉ ), R_n )</text>
  <text x="74.0" y="114.0" text-anchor="start" font-size="11.0" fill="#2b2b2b" filter="url(#rough2)">R_j = 前 j 个 dwarf 的曼哈顿 1-center 半径（含奇偶修正）；R_n 是全部 dwarf。</text>
  <rect x="60.0" y="134.0" width="660.0" height="34.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="68.0" y="161.0" text-anchor="start" font-size="10.6" font-weight="bold" fill="#26405c" filter="url(#rough2)">量</text>
  <text x="178.0" y="161.0" text-anchor="start" font-size="10.6" font-weight="bold" fill="#26405c" filter="url(#rough2)">含义</text>
  <path d="M 60.0 134.0 L 720.0 134.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="68.0" y="195.0" text-anchor="start" font-size="10.6" fill="#2b2b2b" filter="url(#rough2)">A_k</text>
  <text x="178.0" y="195.0" text-anchor="start" font-size="10.6" fill="#2b2b2b" filter="url(#rough2)">第 k 大“到最近站距离”：它改坐地铁 ⇒ 时间至少 A_k</text>
  <path d="M 60.0 168.0 L 720.0 168.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="68.0" y="229.0" text-anchor="start" font-size="10.6" fill="#2b2b2b" filter="url(#rough2)">R_{k−1}</text>
  <text x="178.0" y="229.0" text-anchor="start" font-size="10.6" fill="#2b2b2b" filter="url(#rough2)">前 k−1 个都在 T 以内 ⇒ 交集框非空 ⇒ T ≥ 1-center 半径</text>
  <path d="M 60.0 202.0 L 720.0 202.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="68.0" y="263.0" text-anchor="start" font-size="10.6" fill="#2b2b2b" filter="url(#rough2)">W_{k−1}</text>
  <text x="178.0" y="263.0" text-anchor="start" font-size="10.6" fill="#2b2b2b" filter="url(#rough2)">地铁站到“前缀框四个角”的最大切比雪夫距离；2T ≥ A_k + W</text>
  <path d="M 60.0 236.0 L 720.0 236.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <rect x="60.0" y="288.0" width="660.0" height="62.0" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="312.0" text-anchor="start" font-size="11.1" fill="#8a6015" filter="url(#rough2)">为什么只出现“最大角距离”：可行性要求某个站落在框外扩 W 的盒子里，而扩张后要覆盖整框，</text>
  <text x="74.0" y="334.0" text-anchor="start" font-size="11.1" fill="#8a6015" filter="url(#rough2)">所以 W 必须同时 ≥ 站到 u 两端、v 两端的距离 —— 取四者最大。</text>
  <text x="60.0" y="376.0" text-anchor="start" font-size="10.9" fill="#6b6b6b" filter="url(#rough2)">整体二分 T 也行，但按这个公式 O(n log n) 直接算更快（排序 + 前缀 1-center + kd 树）。</text>
</svg>
