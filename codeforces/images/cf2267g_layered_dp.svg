<svg xmlns="http://www.w3.org/2000/svg" width="840" height="520" viewBox="0 0 840 520"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="21"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="840" height="520" fill="#fafafa"/>

  <text x="420" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">状态转移：把 1 + S 拆成 (1 + y^1)(1 + y^2)(1 + y^4)… 的乘积，再逐列填表</text>
  <text x="420" y="52" text-anchor="middle" font-size="12.5" fill="#6a6a6a"
        filter="url(#rough2)">例子：m = 3 = 11₂，位为 c₁ = 1、c₂ = 2；表中 g 是当前要求解的级数（f 或 h）</text>
  <path d="M 100 62 Q 420 70 740 62" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- 表头 -->
  <text x="120" y="112" text-anchor="end" font-size="12" fill="#6a6a6a" filter="url(#rough2)">位置 i</text>
  <text x="173" y="112" text-anchor="middle" font-size="12" fill="#6a6a6a" filter="url(#rough2)">0</text>
  <text x="239" y="112" text-anchor="middle" font-size="12" fill="#6a6a6a" filter="url(#rough2)">1</text>
  <text x="305" y="112" text-anchor="middle" font-size="12" fill="#6a6a6a" filter="url(#rough2)">2</text>
  <text x="371" y="112" text-anchor="middle" font-size="12" fill="#6a6a6a" filter="url(#rough2)">3</text>
  <text x="437" y="112" text-anchor="middle" font-size="12" fill="#6a6a6a" filter="url(#rough2)">4</text>

  <!-- 第 0 行 D0 = g = f -->
  <text x="120" y="144" text-anchor="end" font-size="12" fill="#2f4a66" filter="url(#rough2)">D₀ = g = f</text>
  <rect x="140" y="120" width="66" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="173" y="145" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">1</text>
  <rect x="206" y="120" width="66" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="239" y="145" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">1</text>
  <rect x="272" y="120" width="66" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="305" y="145" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">2</text>
  <rect x="338" y="120" width="66" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.6" filter="url(#rough2)"/>
  <text x="371" y="145" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">4</text>
  <rect x="404" y="120" width="66" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.6" filter="url(#rough2)"/>
  <text x="437" y="145" text-anchor="middle" font-size="14" font-weight="bold" fill="#8c3b38" filter="url(#rough2)">7</text>

  <!-- 第 1 行 D1 -->
  <text x="120" y="190" text-anchor="end" font-size="12" fill="#4a7a3a" filter="url(#rough2)">D₁</text>
  <rect x="140" y="166" width="66" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="173" y="191" text-anchor="middle" font-size="14" fill="#3c5e2e" filter="url(#rough2)">1</text>
  <rect x="206" y="166" width="66" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="239" y="191" text-anchor="middle" font-size="14" fill="#3c5e2e" filter="url(#rough2)">2</text>
  <rect x="272" y="166" width="66" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.6" filter="url(#rough2)"/>
  <text x="305" y="191" text-anchor="middle" font-size="14" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">3</text>
  <rect x="338" y="166" width="66" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="371" y="191" text-anchor="middle" font-size="14" fill="#3c5e2e" filter="url(#rough2)">5</text>
  <rect x="404" y="166" width="66" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="437" y="191" text-anchor="middle" font-size="14" fill="#3c5e2e" filter="url(#rough2)">11</text>

  <!-- 目标计算框 -->
  <rect x="150" y="228" width="380" height="54" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="340" y="250" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">f[4] = D₀[4 − c₁] + D₁[4 − c₂]</text>
  <text x="340" y="272" text-anchor="middle" font-size="13" filter="url(#rough2)">= <tspan fill="#2f4a66" font-weight="bold">D₀[3]</tspan> + <tspan fill="#3c5e2e" font-weight="bold">D₁[2]</tspan> = <tspan fill="#2f4a66" font-weight="bold">4</tspan> + <tspan fill="#3c5e2e" font-weight="bold">3</tspan> = 7</text>

  <text x="478" y="145" font-size="11.5" fill="#8c3b38" filter="url(#rough2)">← 待求的 f[4]</text>

  <!-- 右侧说明 -->
  <rect x="556" y="106" width="252" height="176" rx="10" fill="none" stroke="#a9a9a9" stroke-width="1.3"
        stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="570" y="130" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">每个格子只依赖两处：</text>
  <text x="570" y="152" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">① 同列上一行 Dₜ₋₁[i]</text>
  <text x="570" y="174" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">② 更早一列 Dₜ₋₁[i − c_t]</text>
  <text x="570" y="204" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">所以按 i 从 0 到 n</text>
  <text x="570" y="226" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">（列优先）扫一遍即可，</text>
  <text x="570" y="248" font-size="12.5" fill="#8c3b38" filter="url(#rough2)">永远不需要回头改旧列。</text>
  <text x="570" y="270" font-size="12.5" fill="#8c3b38" filter="url(#rough2)">每列 O(r) 次加法。</text>

  <!-- 公式面板 -->
  <rect x="48" y="300" width="744" height="126" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"
        stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="66" y="326" font-size="13.5" fill="#2b2b2b" filter="url(#rough2)">Dₜ[i] = Dₜ₋₁[i] + Dₜ₋₁[i − cₜ]　（D₀ = g；i &lt; 0 时记 0）</text>
  <text x="66" y="352" font-size="13.5" fill="#2f4a66" filter="url(#rough2)">g[i] = src[i] + Σ Dₜ₋₁[i − cₜ]　（t = 1 … r）</text>
  <text x="66" y="378" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">求 f 时 src = (1, 0, 0, …)；求 h = f ∗ f 时 src = f（同一张表再扫一遍）</text>
  <text x="66" y="404" font-size="12.5" fill="#8c3b38" filter="url(#rough2)">时间 O(n · r)；空间 O(n · r) 个 32 位整数（r ≤ 20、n &lt; 2²⁰ 时约 80 MB）</text>

  <text x="60" y="454" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">分组理由：每个非零子掩码 x 有唯一的「最高位」c_t，去掉它剩 x′，x′ 只用到编号更小的位。</text>
  <text x="60" y="478" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">于是所有非零步长的贡献 = D₀[i − c₁] + D₁[i − c₂] + …（一直到第 r 层）。</text>
  <text x="60" y="502" font-size="12.5" fill="#8c3b38" filter="url(#rough2)">这就是「按位分层」：每多一个二进制位，只是多一行前缀和，没有卷积。</text>
</svg>
