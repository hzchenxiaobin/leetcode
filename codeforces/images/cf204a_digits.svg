<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="330" fill="#fafafa"/>
  <text x="360.0" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">204A：按长度与首位分类计数</text>
  <path d="M 144.00 46 Q 360.0 52 576.00 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="72" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">首末位相同的数可以按长度分类枚举：f 中间任意 f，共 10^{L-2} 个（L≥2）。</text>
  <text x="60" y="92" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">对每个长度 L 与首位 f，算出“≤ N”的个数，再相减得到区间答案。</text>
  <rect x="60" y="112" width="290" height="120" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="130" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">L=1：1..9 全算，9 个</text>
  <text x="74" y="152" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">L=2：11,22,…,99  9 个</text>
  <text x="74" y="174" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">L=3：101,111,…,999  90 个</text>
  <text x="74" y="196" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">L=4：1001,…  900 个</text>
  <text x="74" y="218" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">通式：9·10^{L-2}</text>
  <rect x="380" y="112" width="290" height="120" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="394" y="130" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">截断：base = f·10^{L-1} + f</text>
  <text x="394" y="152" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">cnt = (N − base)/10 + 1</text>
  <text x="394" y="174" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">若 cnt &gt; 10^{L-2} 就取 10^{L-2}</text>
  <text x="394" y="196" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">累加所有 base ≤ N 的 (L,f)</text>
  <text x="394" y="218" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">答案 = cnt(r) − cnt(l−1)</text>
  <text x="60" y="270" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">r ≤ 10^{18}：最大 19 位数，循环至多 19×9 次，O(1) 完成。</text>
  <text x="60" y="294" text-anchor="start" font-size="11" fill="#8a3a52" filter="url(#rough2)">用 unsigned long long（10^{18} &lt; 2^{63}），Python 大整数天然安全。</text>
</svg>
