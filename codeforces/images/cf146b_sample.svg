<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="341"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="250" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">样例 2：a = 100，b = 47 → 147</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">101..146 的面具都不是 47；147 的 4 和 7 依次出现</text>
  <g filter="url(#rough2)"><rect x="60" y="96" width="780" height="44" rx="4" fill="#ffffff" fill-opacity="0.3" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="450" y="124" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">101 … 146：面具只能是 4 或 7 或空，凑不出 47</text>
  <g filter="url(#rough2)"><rect x="300" y="152" width="300" height="56" rx="6" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="450" y="188" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">147　→　4, 7　⇒ 面具 47 ✓</text>
  <text x="450" y="236" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">输出 147</text>
</svg>
