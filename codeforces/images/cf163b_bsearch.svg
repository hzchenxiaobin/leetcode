<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="727"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="300" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">二分时间 t，再按 (重量, 速度) 升序贪心分配</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">低台给又轻又慢的，快的留给高台</text>
  <g filter="url(#rough2)"><rect x="60" y="96" width="780" height="54" rx="6" fill="#cfe0f5" fill-opacity="0.35" stroke="#446688" stroke-width="1.4"/></g>
  <text x="450" y="128" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">判定：第 j 个空台分给第一个 v ≥ j·h / t 的旅鼠</text>
  <g filter="url(#rough2)"><rect x="200" y="176" width="160" height="50" rx="4" fill="#dcecd2" fill-opacity="0.4" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="280" y="206" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">台 1（高 1h）</text>
  <g filter="url(#rough2)"><rect x="400" y="176" width="160" height="50" rx="4" fill="#dcecd2" fill-opacity="0.4" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="480" y="206" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">台 2（高 2h）</text>
  <g filter="url(#rough2)"><rect x="600" y="176" width="160" height="50" rx="4" fill="#dcecd2" fill-opacity="0.4" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="680" y="206" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">台 3（高 3h）</text>
  <text x="450" y="262" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">t 单调 ⇒ 二分 100 次后取可行侧</text>
</svg>
