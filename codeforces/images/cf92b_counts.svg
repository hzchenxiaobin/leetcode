<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="720" height="380" fill="#fafafa"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">为什么末尾的一串 1 只花两次操作</text>
  <path d="M 200 43 Q 360 49 520 43" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="60" y="80" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">设当前数末尾有 t 个连续的 1：  …0 11…1</text>
  <text x="60" y="108" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">① +1：这 t 个 1 全部变成 0，前一位 0 变成 1（若没有前导 0 就多出一位）</text>
  <text x="60" y="134" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">② /2：删掉最低位（已经是 0），于是问题规模减少 1</text>
  <rect x="60" y="160" width="600" height="60" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="76" y="186" text-anchor="start" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">所以「奇数」这一步固定贡献 2 次操作，随后指针跳过整段 0。</text>
  <text x="76" y="208" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">每个 0 贡献 1 次 /2，每个 1 段贡献 2 次（除非它就是最高位）。</text>
  <text x="60" y="258" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">样例 101110（46）：46→23→24→12→6→3→4→2→1，共 8 次。</text>
  <text x="60" y="284" text-anchor="start" font-size="11.5" fill="#777777" filter="url(#rough2)">串上模拟时注意：+1 可能让最高位左边再多出一位，要预留一格缓冲。</text>
  <text x="60" y="316" text-anchor="start" font-size="11" fill="#777777" filter="url(#rough2)">答案最大约 2L，L ≤ 10^6，用 int 也够，但输出用 long long 更稳。</text>
</svg>
