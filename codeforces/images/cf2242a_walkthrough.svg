<svg xmlns="http://www.w3.org/2000/svg" width="720" height="442" viewBox="0 0 720 442"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>

  <rect width="720" height="442" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">七组官方样例走查：只数两个量</text>
  <path d="M 232 40 Q 360 47 488 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 表头 -->
  <rect x="46" y="58" width="628" height="34" rx="6" fill="#eef1f5" stroke="#8899aa" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="79" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#33475c" filter="url(#rough2)">组</text>
  <text x="190" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#33475c" filter="url(#rough2)">c（张数）</text>
  <text x="306" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#33475c" filter="url(#rough2)">#≥2</text>
  <text x="380" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#33475c" filter="url(#rough2)">max</text>
  <text x="501" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#33475c" filter="url(#rough2)">一个可行 / 不可行的构造</text>
  <text x="630" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#33475c" filter="url(#rough2)">结论</text>

  <!-- 行 1 -->
  <rect x="46" y="94" width="628" height="38" rx="4" fill="#fce4ec" stroke="#d9a7a5" stroke-width="1" filter="url(#rough2)"/>
  <text x="79" y="118" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">1</text>
  <text x="190" y="118" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">1</text>
  <text x="306" y="118" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">0</text>
  <text x="380" y="118" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">1</text>
  <text x="501" y="118" text-anchor="middle" font-size="11.5" fill="#8a3a37" filter="url(#rough2)">a（长度 1，没有双字母组）</text>
  <text x="630" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#a14340" filter="url(#rough2)">NO</text>

  <!-- 行 2 -->
  <rect x="46" y="132" width="628" height="38" rx="4" fill="#e6f4ea" stroke="#9fc4a8" stroke-width="1" filter="url(#rough2)"/>
  <text x="79" y="156" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">2</text>
  <text x="190" y="156" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">3</text>
  <text x="306" y="156" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">1</text>
  <text x="380" y="156" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">3</text>
  <text x="501" y="156" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">aaa（aa 出现两次）</text>
  <text x="630" y="156" text-anchor="middle" font-size="12" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">YES</text>

  <!-- 行 3 -->
  <rect x="46" y="170" width="628" height="38" rx="4" fill="#e6f4ea" stroke="#9fc4a8" stroke-width="1" filter="url(#rough2)"/>
  <text x="79" y="194" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">3</text>
  <text x="190" y="194" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">4</text>
  <text x="306" y="194" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">1</text>
  <text x="380" y="194" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">4</text>
  <text x="501" y="194" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">aaaa（aa 出现三次）</text>
  <text x="630" y="194" text-anchor="middle" font-size="12" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">YES</text>

  <!-- 行 4 -->
  <rect x="46" y="208" width="628" height="38" rx="4" fill="#fce4ec" stroke="#d9a7a5" stroke-width="1" filter="url(#rough2)"/>
  <text x="79" y="232" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">4</text>
  <text x="190" y="232" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">2 1</text>
  <text x="306" y="232" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">1</text>
  <text x="380" y="232" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">2</text>
  <text x="501" y="232" text-anchor="middle" font-size="11.5" fill="#8a3a37" filter="url(#rough2)">aab / aba / baa 全都不行</text>
  <text x="630" y="232" text-anchor="middle" font-size="12" font-weight="bold" fill="#a14340" filter="url(#rough2)">NO</text>

  <!-- 行 5 -->
  <rect x="46" y="246" width="628" height="38" rx="4" fill="#e6f4ea" stroke="#9fc4a8" stroke-width="1" filter="url(#rough2)"/>
  <text x="79" y="270" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">5</text>
  <text x="190" y="270" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">3 2</text>
  <text x="306" y="270" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">2</text>
  <text x="380" y="270" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">3</text>
  <text x="501" y="270" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">aabab（ab 出现两次）</text>
  <text x="630" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">YES</text>

  <!-- 行 6 -->
  <rect x="46" y="284" width="628" height="38" rx="4" fill="#fce4ec" stroke="#d9a7a5" stroke-width="1" filter="url(#rough2)"/>
  <text x="79" y="308" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">6</text>
  <text x="190" y="308" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">1 1 2</text>
  <text x="306" y="308" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">1</text>
  <text x="380" y="308" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">2</text>
  <text x="501" y="308" text-anchor="middle" font-size="11.5" fill="#8a3a37" filter="url(#rough2)">只有 c 有 2 张，怎么排都不行</text>
  <text x="630" y="308" text-anchor="middle" font-size="12" font-weight="bold" fill="#a14340" filter="url(#rough2)">NO</text>

  <!-- 行 7 -->
  <rect x="46" y="322" width="628" height="38" rx="4" fill="#e6f4ea" stroke="#9fc4a8" stroke-width="1" filter="url(#rough2)"/>
  <text x="79" y="346" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">7</text>
  <text x="190" y="346" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">1 1 2 2</text>
  <text x="306" y="346" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">2</text>
  <text x="380" y="346" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">2</text>
  <text x="501" y="346" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">cdcdab（cd 出现两次）</text>
  <text x="630" y="346" text-anchor="middle" font-size="12" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">YES</text>

  <!-- 表格外框 -->
  <rect x="46" y="58" width="628" height="302" rx="6" fill="none" stroke="#8899aa" stroke-width="1.4" filter="url(#rough2)"/>

  <text x="360" y="386" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">第 4、6 组是同一类陷阱：只有一个字母恰好 2 张、剩下都是 1 张 ⇒ 必为 NO</text>
  <text x="360" y="408" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">第 5、7 组两条路都能走通：一个字母 ≥ 3（送分），或两个字母都 ≥ 2（abab 交替）</text>
  <text x="360" y="428" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">注意 #≥2 这一列只统计「张数 ≥ 2 的字母个数」，而不是张数本身</text>
</svg>
