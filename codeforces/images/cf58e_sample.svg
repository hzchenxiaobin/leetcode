<svg xmlns="http://www.w3.org/2000/svg" width="760" height="310" viewBox="0 0 760 310"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="592"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="310" fill="#fafafa"/>
  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1 走查：2+4=5 的 5 位最优解 21+4=25 是怎么逐列拼出来的</text>
  <path d="M 60 40 Q 380 48 700 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <g font-size="10.5">
    <text x="60" y="78" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">列（从低位到高位）</text>
    <text x="260" y="78" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">x 的位</text>
    <text x="370" y="78" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">y 的位</text>
    <text x="480" y="78" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">z 的位</text>
    <text x="590" y="78" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">进位 / 状态</text>

    <text x="60" y="112" fill="#2b2b2b" filter="url(#rough2)">第 0 列（个位）</text>
    <text x="260" y="112" fill="#8a2b28" filter="url(#rough2)">1（插入）</text>
    <text x="370" y="112" fill="#2b2b2b" filter="url(#rough2)">4（= b）</text>
    <text x="480" y="112" fill="#2b2b2b" filter="url(#rough2)">5（= c）</text>
    <text x="590" y="112" fill="#555555" filter="url(#rough2)">0 → 0；i=0,j=1,k=1</text>

    <text x="60" y="142" fill="#2b2b2b" filter="url(#rough2)">第 1 列（十位）</text>
    <text x="260" y="142" fill="#2b2b2b" filter="url(#rough2)">2（= a）</text>
    <text x="370" y="142" fill="#555555" filter="url(#rough2)">（y 已结束，记 0）</text>
    <text x="480" y="142" fill="#8a2b28" filter="url(#rough2)">2（插入）</text>
    <text x="590" y="142" fill="#555555" filter="url(#rough2)">1+4=5 无进位；1+0=2</text>

    <text x="60" y="172" fill="#2b2b2b" filter="url(#rough2)">结束</text>
    <text x="260" y="172" fill="#2b2b2b" filter="url(#rough2)">x = 21</text>
    <text x="370" y="172" fill="#2b2b2b" filter="url(#rough2)">y = 4</text>
    <text x="480" y="172" fill="#2b2b2b" filter="url(#rough2)">z = 25</text>
    <text x="590" y="172" fill="#8a2b28" filter="url(#rough2)">全部结束，代价 5</text>
  </g>

  <rect x="40" y="192" width="340" height="62" rx="9" fill="#d9ecd4" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="54" y="214" font-size="10.6" fill="#2b2b2b" filter="url(#rough2)">校验：21+4=25 ✓；"2" 是 "21" 的子序列 ✓；</text>
  <text x="54" y="234" font-size="10.6" fill="#2b2b2b" filter="url(#rough2)">"4" 是 "4" 的子序列 ✓；"5" 是 "25" 的子序列 ✓。</text>

  <rect x="396" y="192" width="324" height="62" rx="9" fill="#fbe3c8" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="410" y="214" font-size="10.6" fill="#2b2b2b" filter="url(#rough2)">为什么不能更短：3 位只有 2+4=6，不满足 c=5；</text>
  <text x="410" y="234" font-size="10.6" fill="#2b2b2b" filter="url(#rough2)">4 位时 y 必须是 1 位数 4，x 只能个位、z 也不会含 5。</text>

  <rect x="40" y="266" width="680" height="34" rx="8" fill="#cfe0f5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="54" y="288" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">另两个官方样例：1+1=3 → 1+31=32（本题还有同长的 12+1=13，输出任意最短解）；1+1=2 → 1+1=2。</text>
</svg>
