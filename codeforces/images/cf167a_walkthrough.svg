<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="760" height="420" fill="#fafafa"/>

  <rect x="50" y="100" width="640" height="70" rx="8" fill="#ffffff" stroke="#c9d6e4" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="130" font-size="14" text-anchor="start" fill="#35507a" font-weight="bold" filter="url(#rough2)">车 1</text>
  <text x="70" y="152" font-size="11.5" text-anchor="start" fill="#555" filter="url(#rough2)">t=0, v=10</text>
  <text x="230" y="130" font-size="12.5" text-anchor="start" fill="#2f5223" filter="url(#rough2)">自由 1000.50</text>
  <text x="230" y="152" font-size="10.5" text-anchor="start" fill="#8a8a8a" filter="url(#rough2)">按物理公式单独算</text>
  <line x1="430" y1="135" x2="480" y2="135" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="492" y="141" font-size="13.5" text-anchor="start" fill="#7a2f2f" font-weight="bold" filter="url(#rough2)">到站 1000.50</text>
  <text x="640" y="141" font-size="11" text-anchor="start" fill="#8a8a8a" filter="url(#rough2)">基准</text>
  <rect x="50" y="188" width="640" height="70" rx="8" fill="#ffffff" stroke="#c9d6e4" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="218" font-size="14" text-anchor="start" fill="#35507a" font-weight="bold" filter="url(#rough2)">车 2</text>
  <text x="70" y="240" font-size="11.5" text-anchor="start" fill="#555" filter="url(#rough2)">t=5, v=11</text>
  <text x="230" y="218" font-size="12.5" text-anchor="start" fill="#2f5223" filter="url(#rough2)">自由 914.64</text>
  <text x="230" y="240" font-size="10.5" text-anchor="start" fill="#8a8a8a" filter="url(#rough2)">按物理公式单独算</text>
  <line x1="430" y1="223" x2="480" y2="223" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="492" y="229" font-size="13.5" text-anchor="start" fill="#7a2f2f" font-weight="bold" filter="url(#rough2)">到站 1000.50</text>
  <text x="612" y="229" font-size="11" text-anchor="start" fill="#b85450" filter="url(#rough2)">被前车顶住</text>
  <rect x="50" y="276" width="640" height="70" rx="8" fill="#ffffff" stroke="#c9d6e4" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="306" font-size="14" text-anchor="start" fill="#35507a" font-weight="bold" filter="url(#rough2)">车 3</text>
  <text x="70" y="328" font-size="11.5" text-anchor="start" fill="#555" filter="url(#rough2)">t=1000, v=1</text>
  <text x="230" y="306" font-size="12.5" text-anchor="start" fill="#2f5223" filter="url(#rough2)">自由 11000.05</text>
  <text x="230" y="328" font-size="10.5" text-anchor="start" fill="#8a8a8a" filter="url(#rough2)">按物理公式单独算</text>
  <line x1="430" y1="311" x2="480" y2="311" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="492" y="317" font-size="13.5" text-anchor="start" fill="#2b2b2b" filter="url(#rough2)">到站 11000.05</text>
  <text x="640" y="317" font-size="11" text-anchor="start" fill="#8a8a8a" filter="url(#rough2)">自己更晚</text>
  <text x="50" y="388" font-size="13" text-anchor="start" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">答案 = 逐个取 max：1000.50, 1000.50, 11000.05</text>
  <text x="380.0" y="36" font-size="20" text-anchor="middle" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">样例 1 走查：自由到站时间被前车“顶”成 1000.5</text>
  <path d="M 120 46 Q 380.0 52 640 46" fill="none" stroke="#2b2b2b" stroke-width="1.3" filter="url(#rough2)"/>
</svg>
