<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="360" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">最小覆盖角 = 360° − 最大空隙角</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">把所有点的极角排序，最大的一段"没有点"的扇形就是可以省掉的角度</text>
  <g filter="url(#rough2)"><rect x="180" y="90" width="320" height="240" rx="8" fill="#ffffff" fill-opacity="0.35" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="340" y="80" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">以原点为顶点</text>
  <path d="M340,210 L340,110" fill="none" stroke="#3d6b2f" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M340,210 L470,240" fill="none" stroke="#3d6b2f" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="130" text-anchor="middle" font-size="13" fill="#3d6b2f" filter="url(#rough2)">α</text>
  <text x="560" y="140" text-anchor="start" font-size="12.5" fill="#555555" filter="url(#rough2)">角度排序后相邻两点之间的差</text>
  <text x="560" y="168" text-anchor="start" font-size="12.5" fill="#555555" filter="url(#rough2)">最后一个与第一个的差要 +360（环绕）</text>
  <text x="560" y="196" text-anchor="start" font-size="13" fill="#2b2b2b" filter="url(#rough2)">最大差 d ⇒ 答案 360 - d</text>
  <text x="560" y="240" text-anchor="start" font-size="12.5" fill="#b05a5a" filter="url(#rough2)">n=1 时答案为 0</text>
  <text x="440" y="330" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">用 atan2 求角，注意把负角加 360 归到 [0,360)</text>
</svg>
