<svg xmlns="http://www.w3.org/2000/svg" width="780" height="380" viewBox="0 0 780 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="780" height="380" fill="#fafafa"/>
  <text x="390.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">190E：未访问集合用链表维护，BFS 摊还 O(n+m)</text>
  <path d="M 171.06000000000006 46 Q 390.0 52 608.9399999999999 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60.0" y="70.0" width="660.0" height="70.0" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="96.0" text-anchor="start" font-size="11.2" font-weight="bold" fill="#33506e" filter="url(#rough2)">未访问链表：1 → 2 → … → n（删除 O(1)）</text>
  <text x="74.0" y="122.0" text-anchor="start" font-size="11.1" fill="#2b2b2b" filter="url(#rough2)">取队首 v：沿链表扫每个未访问 u，若 (v,u) 不是地图边 ⇒ 补图有边 ⇒ 删 u、入队。</text>
  <rect x="60.0" y="160.0" width="320.0" height="90.0" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="76.0" y="186.0" text-anchor="start" font-size="11.6" font-weight="bold" fill="#2f5b34" filter="url(#rough2)">摊还分析</text>
  <text x="76.0" y="212.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">每次扫描的 u 只有两种结局：</text>
  <text x="76.0" y="236.0" text-anchor="start" font-size="10.4" fill="#2b2b2b" filter="url(#rough2)">删除（全局 ≤ n 次）或被跳过 = u 是 v 的地图邻居（≤ m 次）</text>
  <rect x="400.0" y="160.0" width="330.0" height="90.0" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="416.0" y="186.0" text-anchor="start" font-size="11.6" font-weight="bold" fill="#8a6015" filter="url(#rough2)">复杂度</text>
  <text x="416.0" y="212.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">O(n + m) 次判断，每次二分查找</text>
  <text x="416.0" y="236.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">⇒ O((n+m) log deg)</text>
  <rect x="60.0" y="268.0" width="670.0" height="74.0" rx="9" fill="#fdf0ef" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="292.0" text-anchor="start" font-size="11.1" fill="#8a3a36" filter="url(#rough2)">易错：不能用“对每个点枚举所有点”的 O(n²)；也不能显式建补图。</text>
  <text x="74.0" y="314.0" text-anchor="start" font-size="11.1" fill="#8a3a36" filter="url(#rough2)">链表删除要维护前驱后继；输出时组内与组间排序，保证与样例逐字一致。</text>
  <text x="74.0" y="336.0" text-anchor="start" font-size="11.1" fill="#8a3a36" filter="url(#rough2)">m=0 时补图是完全图 ⇒ 只有一个分量。</text>
</svg>
