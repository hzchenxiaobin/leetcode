<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="300" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">区间赋值 + 带权求和</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">赋值时用前缀和 Σ i^j 直接算出新的六个和</text>
  <g filter="url(#rough2)"><rect x="140" y="110" width="80" height="46" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="180.0" y="137.68" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">a_l</text>
  <g filter="url(#rough2)"><rect x="240" y="110" width="80" height="46" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="280.0" y="137.68" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">…</text>
  <g filter="url(#rough2)"><rect x="340" y="110" width="80" height="46" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="380.0" y="137.68" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">a_r</text>
  <text x="470" y="140" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">区间赋值 → 整段变成 x</text>
  <text x="470" y="180" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">查询 Σ a_i·(i-l+1)^k，k≤5</text>
  <text x="470" y="222" text-anchor="start" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">线段树每个节点存 Σ a_i·i^j (j=0..5)</text>
</svg>
