<svg xmlns="http://www.w3.org/2000/svg" width="840" height="430" viewBox="0 0 840 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="55"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="840" height="430" fill="#fafafa"/>

  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">三个坐标各自累加，最后一起判零</text>
  <text x="420" y="58" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">样例二：x 方向 3, −5, 2；y 方向 −1, 2, −1；z 方向 7, −4, −3</text>

  <!-- 三列 -->
  <g filter="url(#rough2)">
    <text x="170" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66">x 分量</text>
    <text x="420" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223">y 分量</text>
    <text x="670" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a2b28">z 分量</text>

    <rect x="120" y="112" width="100" height="34" rx="6" fill="#cfe0f5" stroke="#446688" stroke-width="1.4"/>
    <rect x="120" y="154" width="100" height="34" rx="6" fill="#cfe0f5" stroke="#446688" stroke-width="1.4"/>
    <rect x="120" y="196" width="100" height="34" rx="6" fill="#cfe0f5" stroke="#446688" stroke-width="1.4"/>
    <text x="170" y="135" text-anchor="middle" font-size="13" fill="#2f4a66">3</text>
    <text x="170" y="177" text-anchor="middle" font-size="13" fill="#2f4a66">−5</text>
    <text x="170" y="219" text-anchor="middle" font-size="13" fill="#2f4a66">2</text>

    <rect x="370" y="112" width="100" height="34" rx="6" fill="#d9ecd4" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="370" y="154" width="100" height="34" rx="6" fill="#d9ecd4" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="370" y="196" width="100" height="34" rx="6" fill="#d9ecd4" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="420" y="135" text-anchor="middle" font-size="13" fill="#2f5223">−1</text>
    <text x="420" y="177" text-anchor="middle" font-size="13" fill="#2f5223">2</text>
    <text x="420" y="219" text-anchor="middle" font-size="13" fill="#2f5223">−1</text>

    <rect x="620" y="112" width="100" height="34" rx="6" fill="#f6d9d7" stroke="#b85450" stroke-width="1.4"/>
    <rect x="620" y="154" width="100" height="34" rx="6" fill="#f6d9d7" stroke="#b85450" stroke-width="1.4"/>
    <rect x="620" y="196" width="100" height="34" rx="6" fill="#f6d9d7" stroke="#b85450" stroke-width="1.4"/>
    <text x="670" y="135" text-anchor="middle" font-size="13" fill="#8a2b28">7</text>
    <text x="670" y="177" text-anchor="middle" font-size="13" fill="#8a2b28">−4</text>
    <text x="670" y="219" text-anchor="middle" font-size="13" fill="#8a2b28">−3</text>

    <path d="M 170 236 L 170 262" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>
    <path d="M 420 236 L 420 262" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>
    <path d="M 670 236 L 670 262" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>

    <rect x="115" y="266" width="110" height="38" rx="8" fill="#eef2f6" stroke="#446688" stroke-width="1.5"/>
    <rect x="365" y="266" width="110" height="38" rx="8" fill="#eef2f6" stroke="#446688" stroke-width="1.5"/>
    <rect x="615" y="266" width="110" height="38" rx="8" fill="#eef2f6" stroke="#446688" stroke-width="1.5"/>
    <text x="170" y="291" text-anchor="middle" font-size="12.5" fill="#2f4a66">Σx = 0</text>
    <text x="420" y="291" text-anchor="middle" font-size="12.5" fill="#2f5223">Σy = 0</text>
    <text x="670" y="291" text-anchor="middle" font-size="12.5" fill="#8a2b28">Σz = 0</text>
  </g>

  <!-- 合并判定 -->
  <g filter="url(#rough2)">
    <path d="M 170 304 L 300 344" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <path d="M 420 304 L 420 344" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <path d="M 670 304 L 540 344" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
    <rect x="300" y="346" width="240" height="40" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="420" y="371" text-anchor="middle" font-size="12.5" fill="#8a6015">三者全为 0 ？</text>
    <text x="568" y="371" font-size="12" fill="#2f5223">是 → YES</text>
    <text x="568" y="393" font-size="12" fill="#8a2b28">否 → NO</text>
  </g>

  <text x="420" y="414" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">三条累加链互不影响，判零时用逻辑与合起来：任何一个分量非零，合力就不为零。</text>
</svg>
