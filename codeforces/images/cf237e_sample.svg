<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="89"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="720" height="400" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2：每个字母从最便宜的可用串里取</text>
  <path d="M 130 42 Q 360 48 590 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="60" y="66" font-size="11.5" fill="#666" filter="url(#rough2)">t = "abacaba"：a 需要 4 个，b 需要 2 个，c 需要 1 个</text>

  <!-- 四个来源 -->
  <g filter="url(#rough2)">
    <rect x="50" y="86" width="140" height="104" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="212" y="86" width="140" height="104" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="374" y="86" width="140" height="104" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="536" y="86" width="140" height="104" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="120" y="110" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">s1 = "aba"，a1 = 2</text>
  <text x="282" y="110" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">s2 = "bcc"，a2 = 1</text>
  <text x="444" y="110" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">s3 = "caa"，a3 = 2</text>
  <text x="606" y="110" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">s4 = "bbb"，a4 = 5</text>
  <text x="120" y="136" text-anchor="middle" font-size="11" fill="#3c5e2e" filter="url(#rough2)">取 a × 2，单价 1</text>
  <text x="282" y="136" text-anchor="middle" font-size="11" fill="#3c5e2e" filter="url(#rough2)">取 c × 1，单价 2</text>
  <text x="444" y="136" text-anchor="middle" font-size="11" fill="#3c5e2e" filter="url(#rough2)">取 a × 2，单价 3</text>
  <text x="606" y="136" text-anchor="middle" font-size="11" fill="#3c5e2e" filter="url(#rough2)">取 b × 2，单价 4</text>
  <text x="120" y="166" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">小计 2</text>
  <text x="282" y="166" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">小计 2</text>
  <text x="444" y="166" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">小计 6</text>
  <text x="606" y="166" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">小计 8</text>

  <text x="120" y="182" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">s1 装得下 2 个</text>
  <text x="282" y="182" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">s2 只准删 1 个</text>
  <text x="444" y="182" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">s3 装得下 2 个</text>
  <text x="606" y="182" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">s4 有 3 个 b</text>

  <path d="M 120 208 L 340 244" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 282 208 L 350 240" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 444 208 L 380 240" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 606 208 L 410 244" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="250" y="250" width="220" height="48" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="280" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6015" filter="url(#rough2)">总费用 = 2+2+6+8 = 18</text>

  <rect x="60" y="316" width="600" height="66" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="74" y="340" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">a 只有 s1、s3 能提供，容量恰好 2 + 2 = 4，必须全部给 a；于是 s2 的名额只能给 c，</text>
  <text x="74" y="362" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">b 全部来自 s4（它有 3 个 b，取 2 个）。这个分配是被需求「卡」出来的，</text>
  <text x="74" y="380" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">恰好与官方解释一致：2×1 + 1×2 + 2×3 + 2×4 = 18。</text>
</svg>
