<svg xmlns="http://www.w3.org/2000/svg" width="884" height="412" viewBox="0 0 884 412"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="109"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="884" height="412" fill="#fafafa"/>
  <text x="442" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">基例（块数 ≤ 9）：枚举低两位 + 数位贪心</text>
  <text x="442" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">b = 100H + L，L 只有 100 种；再求最小 H</text>
  <g filter="url(#rough2)"><rect x="90" y="88" width="700" height="54" rx="4" fill="#f6e3c4" fill-opacity="0.5" stroke="#c9a86a" stroke-width="1.3"/></g>
  <text x="440" y="112" text-anchor="middle" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">对每个 L ∈ [0,100)：设 c_i = [L+i ≥ 100]，low_i = (L+i) mod 100</text>
  <text x="440" y="132" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">F(b+i) = F(H + c_i) + F(low_i) ⇒ F(H) 与 F(H+1) 被唯一确定（不一致则该 L 不可行）</text>
  <g filter="url(#rough2)"><rect x="90" y="158" width="700" height="54" rx="4" fill="#d7ecd0" fill-opacity="0.5" stroke="#6a9a58" stroke-width="1.3"/></g>
  <text x="440" y="182" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">求最小 H ≥ H0 使 F(H)=u0、F(H+1)=u1</text>
  <text x="440" y="202" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">按 H 末尾 9 的个数 j 与最高位 d 分类：H = P·10^{j+1} + d·10^j + (10^j−1)</text>
  <text x="440" y="246" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">于是 F(H) = F(P) + lucky(d)，F(H+1) = F(P) + lucky(d+1)</text>
  <text x="440" y="272" text-anchor="middle" font-size="11.5" fill="#3d6b2f" filter="url(#rough2)">两式相减即知 d 是否可行；随后只需“最小 P ≥ P0 且 F(P)=uP”</text>
  <g filter="url(#rough2)"><rect x="90" y="300" width="700" height="58" rx="4" fill="#cfe0f5" fill-opacity="0.4" stroke="#6688aa" stroke-width="1.3"/></g>
  <text x="440" y="324" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">“最小 P ≥ P0 且数位里恰有 u 个 4/7”：从右往左找到第一个可以增大的数位，</text>
  <text x="440" y="344" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">后面补最少量的 4（0 比 4 小，所以先把 0 放前面）</text>
  <text x="440" y="392" text-anchor="middle" font-size="11" fill="#8a2b28" filter="url(#rough2)">例：a=777777777, l=1 → b=1444444444（最小的大于它且恰有 9 个幸运位的数）</text>
</svg>
