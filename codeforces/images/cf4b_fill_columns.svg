<svg xmlns="http://www.w3.org/2000/svg" width="740" height="470" viewBox="0 0 740 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="740" height="470" fill="#fafafa"/>

  <text x="370" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">从每天的下界出发，把 rest 小时一格格加进去</text>
  <path d="M 120 44 Q 370 50 620 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 图例 -->
  <rect x="62" y="58" width="14" height="12" fill="#cfe0f5" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="82" y="69" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">下界（已计入 L）</text>
  <rect x="250" y="58" width="14" height="12" fill="#f6c26b" stroke="#b9822a" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="270" y="69" font-size="11.5" fill="#8a6015" filter="url(#rough2)">追加的小时</text>
  <rect x="430" y="58" width="14" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="450" y="69" font-size="11.5" fill="#8a6015" filter="url(#rough2)">上界内剩余空间</text>

  <!-- 纵轴 -->
  <line x1="64" y1="190" x2="64" y2="392" stroke="#2b2b2b" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="60" y1="390" x2="560" y2="390" stroke="#2b2b2b" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="52" y="394" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <line x1="60" y1="350" x2="66" y2="350" stroke="#2b2b2b" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="52" y="354" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <line x1="60" y1="310" x2="66" y2="310" stroke="#2b2b2b" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="52" y="314" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">2</text>
  <line x1="60" y1="270" x2="66" y2="270" stroke="#2b2b2b" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="52" y="274" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">3</text>
  <line x1="60" y1="230" x2="66" y2="230" stroke="#2b2b2b" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="52" y="234" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">4</text>
  <line x1="60" y1="190" x2="66" y2="190" stroke="#2b2b2b" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="52" y="194" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">5</text>
  <text x="70" y="112" font-size="11" fill="#555" filter="url(#rough2)">单位：小时</text>

  <!-- 第 1 天 [1,3]，追加 2 -->
  <rect x="120" y="270" width="60" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <rect x="120" y="350" width="60" height="40" fill="#cfe0f5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="120" y="270" width="60" height="80" fill="#f6c26b" stroke="#b9822a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="150" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">3</text>

  <!-- 第 2 天 [0,4]，追加 3 -->
  <rect x="290" y="230" width="60" height="160" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <rect x="290" y="270" width="60" height="120" fill="#f6c26b" stroke="#b9822a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="320" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">3</text>

  <!-- 第 3 天 [2,5]，追加 0 -->
  <rect x="460" y="190" width="60" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <rect x="460" y="310" width="60" height="80" fill="#cfe0f5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="490" y="182" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">2</text>

  <!-- 列标签 -->
  <text x="150" y="412" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">第 1 天 [1,3]</text>
  <text x="320" y="412" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">第 2 天 [0,4]</text>
  <text x="490" y="412" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">第 3 天 [2,5]</text>
  <text x="150" y="436" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">+2（rest 5→3）</text>
  <text x="320" y="436" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">+3（rest 3→0）</text>
  <text x="490" y="436" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">+0（已加完）</text>

  <!-- 右侧规则框 -->
  <rect x="570" y="230" width="150" height="150" rx="10" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="584" y="254" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每天最多加</text>
  <text x="584" y="278" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">hi - lo</text>
  <text x="584" y="304" font-size="11" fill="#555" filter="url(#rough2)">取</text>
  <text x="584" y="324" font-size="11.5" fill="#555" filter="url(#rough2)">min(rest, hi-lo)</text>
  <text x="584" y="352" font-size="11" fill="#2f5223" filter="url(#rough2)">加完 rest = 0</text>
  <text x="584" y="370" font-size="11" fill="#2f5223" filter="url(#rough2)">⇒ 输出 YES</text>

  <text x="584" y="120" font-size="11.5" fill="#555" filter="url(#rough2)">L = 1 + 0 + 2 = 3</text>
  <text x="584" y="142" font-size="11.5" fill="#555" filter="url(#rough2)">sumTime = 8</text>
  <text x="584" y="164" font-size="11.5" fill="#555" filter="url(#rough2)">rest = 8 - 3 = 5</text>

  <text x="60" y="462" font-size="11.5" fill="#777" filter="url(#rough2)">示意数据（自造）：d = 3，sumTime = 8；合法答案 3 3 2</text>
</svg>
