<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="300" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">答案 = |行-3| + |列-3|</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">相邻行/列交换各花费 1，行列互不影响</text>
  <g filter="url(#rough2)"><rect x="120" y="90" width="400" height="180" rx="6" fill="#ffffff" fill-opacity="0.4" stroke="#8899aa" stroke-width="1.2"/></g>
  <line x1="120" y1="150" x2="520" y2="150" stroke="#8899aa" stroke-width="1" filter="url(#rough2)"/>
  <text x="320" y="80" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">5×5</text>
  <text x="560" y="120" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">行方向需要 |i-3| 次交换</text>
  <text x="560" y="152" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">列方向需要 |j-3| 次交换</text>
  <text x="560" y="190" text-anchor="start" font-size="13" fill="#3d6b2f" filter="url(#rough2)">总次数 = 两者之和</text>
</svg>
