  <text x="40" y="426" font-size="12" fill="#2b2b2b" filter="url(#rough2)">每个半平面只占 ⌈M/64⌉ 个 64 位字，所以“判断一个三角形”是 3 次按位与 + 若干次判零，而不是扫 500 个蓝点。</text>
  <text x="40" y="452" font-size="11.5" fill="#8a6015" filter="url(#rough2)">N² 个有序对 × 8 个字 × 8 字节 ≈ 16 MB，正好装进 64 MB。</text>
