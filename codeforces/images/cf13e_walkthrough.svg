  <text x="480" y="376" font-size="12" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">输出 7 3</text>
  <text x="210" y="406" font-size="10.5" fill="#555555" filter="url(#rough2)">2 + 1 = 3 跳，最后停在 7</text>
  <text x="40" y="428" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">颜色相同的连续几跳属于同一个块：查询时一次读完 cnt 与 lst，再跳到 nxt。</text>
  <text x="40" y="452" font-size="11.5" fill="#8a6015" filter="url(#rough2)">修改只影响同块内 ≤ x 的位置，所以第 ②、③ 行里后面几个块的信息完全不用重算。</text>
