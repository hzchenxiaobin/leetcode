  <text x="300" y="377" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <path d="M 326 371 L 338 371" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="342" y="354" width="48" height="34" rx="7" fill="#f6d9d7" stroke="#555555" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="366" y="377" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">7</text>
  <path d="M 392 371 L 404 371" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
