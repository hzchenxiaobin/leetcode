  <text x="612" y="258" font-size="12" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">输出 8 5</text>
  <text x="210" y="288" font-size="10.5" fill="#555555" filter="url(#rough2)">1 + 3 + 1 = 5 跳，最后停在 8</text>
  <text x="40" y="376" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">③ 0 3 4 之后查 2</text>
  <rect x="210" y="354" width="48" height="34" rx="7" fill="#cfe0f5" stroke="#555555" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="234" y="377" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <path d="M 260 371 L 272 371" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
