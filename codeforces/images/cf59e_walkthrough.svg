<svg xmlns="http://www.w3.org/2000/svg" width="760" height="416" viewBox="0 0 760 416"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c9801f"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a8524a"/>
    </marker>
  </defs>
  <rect width="760" height="416" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">样例 3 走查：节点 BFS 会给出错误答案 2</text>
  <path d="M 100 200 L 310 96" stroke="#9aa3b2" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 310 96 L 310 300" stroke="#9aa3b2" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 310 300 L 560 200" stroke="#9aa3b2" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 100 200 L 310 300" stroke="#9aa3b2" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <rect x="70.0" y="174.0" width="60.0" height="52.0" rx="26" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="100.0" y="207.0" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="280.0" y="70.0" width="60.0" height="52.0" rx="26" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310.0" y="103.0" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="280.0" y="274.0" width="60.0" height="52.0" rx="26" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310.0" y="307.0" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="530.0" y="174.0" width="60.0" height="52.0" rx="26" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="560.0" y="207.0" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="150.0" y="96.0" text-anchor="start" font-size="11" fill="#a8524a" font-weight="bold" filter="url(#rough2)">禁 1→2→3</text>
  <text x="380.0" y="84.0" text-anchor="start" font-size="11" fill="#a8524a" font-weight="bold" filter="url(#rough2)">禁 1→3→4</text>
  <path d="M 133.0 186.0 L 258.0 116.0" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 340.0 300.0 L 530.0 216.0" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="150.0" y="236.0" text-anchor="start" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">实际最短路径：1 → 3 → 2 → 3 → 4</text>
  <text x="150.0" y="260.0" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">到了 3 不能直接去 4（(1,3,4) 是禁咒）</text>
  <text x="150.0" y="282.0" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">只能绕回 2 换个来路，再去 4</text>
  <rect x="40.0" y="300.0" width="680.0" height="46.0" rx="8" fill="#fbeeee" stroke="#a8524a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56.0" y="324.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">若只按城市 BFS：1→3→4 只有 2 条路，但它违反 (1,3,4)；</text>
  <text x="56.0" y="340.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">1→2→3→4 也被 (1,2,3) 挡掉 —— 所以答案既不是 2 也不是 3。</text>
  <rect x="40.0" y="356.0" width="680.0" height="50.0" rx="8" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.4" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="56.0" y="380.0" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">状态 BFS：1→3 (d=1) → 3→2 (d=2) → 2→3 (d=3) → 3→4 (d=4)，输出 4 与路径。</text>
</svg>
