<svg xmlns="http://www.w3.org/2000/svg" width="760" height="462" viewBox="0 0 760 462"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c9801f"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a8524a"/>
    </marker>
  </defs>
  <rect width="760" height="462" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">样例 3 走查：按城市 BFS 会答错</text>
  <text x="380.0" y="60.0" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">边 1-2、2-3、3-4、1-3；禁咒 (1,2,3) 与 (1,3,4)</text>
  <path d="M 90 186 L 310 100" stroke="#9aa3b2" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 310 100 L 310 288" stroke="#9aa3b2" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 310 288 L 570 186" stroke="#9aa3b2" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 90 186 L 310 288" stroke="#9aa3b2" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 90 186 L 310 288" stroke="#4a7a3a" stroke-width="3.0" fill="none" filter="url(#rough2)"/>
  <path d="M 310 100 L 310 288" stroke="#4a7a3a" stroke-width="3.0" fill="none" filter="url(#rough2)"/>
  <path d="M 310 288 L 570 186" stroke="#4a7a3a" stroke-width="3.0" fill="none" filter="url(#rough2)"/>
  <rect x="60.0" y="160.0" width="60.0" height="52.0" rx="26" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="90.0" y="193.0" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="280.0" y="74.0" width="60.0" height="52.0" rx="26" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310.0" y="107.0" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="280.0" y="262.0" width="60.0" height="52.0" rx="26" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310.0" y="295.0" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="540.0" y="160.0" width="60.0" height="52.0" rx="26" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="570.0" y="193.0" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="140.0" y="112.0" text-anchor="start" font-size="11.5" fill="#a8524a" font-weight="bold" filter="url(#rough2)">禁 1→2→3</text>
  <text x="392.0" y="194.0" text-anchor="start" font-size="11.5" fill="#a8524a" font-weight="bold" filter="url(#rough2)">禁 1→3→4</text>
  <text x="64.0" y="244.0" text-anchor="start" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">绿线为实际路径</text>
  <text x="64.0" y="266.0" text-anchor="start" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1 → 3 → 2 → 3 → 4</text>
  <text x="64.0" y="292.0" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">(3→2 与 2→3 是同一条边，</text>
  <text x="64.0" y="312.0" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">只是来路不同，所以允许)</text>
  <rect x="40.0" y="332.0" width="680.0" height="52.0" rx="8" fill="#fbeeee" stroke="#a8524a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56.0" y="354.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">城市 BFS 会说 1→3→4 只要 2 步，但它违反 (1,3,4)；</text>
  <text x="56.0" y="374.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">1→2→3→4 也被 (1,2,3) 挡掉 —— 答案既不是 2 也不是 3。</text>
  <rect x="40.0" y="394.0" width="680.0" height="52.0" rx="8" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.4" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="56.0" y="416.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">状态 BFS：1→3 (d=1) → 3→2 (d=2) → 2→3 (d=3) → 3→4 (d=4)，</text>
  <text x="56.0" y="436.0" text-anchor="start" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">输出 d = 4 与路径 1 3 2 3 4。</text>
</svg>
