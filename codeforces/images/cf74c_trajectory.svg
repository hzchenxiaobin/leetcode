<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="51"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="820" height="430" fill="#fafafa"/>

  <text x="410" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3×4 棋盘上一条反弹轨迹（行 0–2，列 0–3）</text>
  <text x="410" y="56" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">从 (0,0) 出发沿右下方向，碰到边界就反弹，角落反弹两次后原路返回</text>

  <!-- 3x4 网格 -->
  <g filter="url(#rough2)">
    <rect x="110" y="80" width="320" height="240" fill="#ffffff" stroke="#444444" stroke-width="1.8"/>
    <line x1="190" y1="80" x2="190" y2="320" stroke="#bbbbbb" stroke-width="1.2"/>
    <line x1="270" y1="80" x2="270" y2="320" stroke="#bbbbbb" stroke-width="1.2"/>
    <line x1="350" y1="80" x2="350" y2="320" stroke="#bbbbbb" stroke-width="1.2"/>
    <line x1="110" y1="160" x2="430" y2="160" stroke="#bbbbbb" stroke-width="1.2"/>
    <line x1="110" y1="240" x2="430" y2="240" stroke="#bbbbbb" stroke-width="1.2"/>
  </g>

  <!-- 轨迹：中心点 (150+80c, 120+80r) -->
  <g filter="url(#rough2)">
    <path d="M 150 120 L 230 200 L 310 280 L 390 200 L 310 120 L 230 200"
          fill="none" stroke="#446688" stroke-width="2.4"/>
    <path d="M 300 273 L 320 287" stroke="#446688" stroke-width="2.4" marker-end="url(#arr)"/>
    <path d="M 383 208 L 397 195" stroke="#446688" stroke-width="2.4" marker-end="url(#arr)"/>
    <path d="M 322 122 L 298 118" stroke="#446688" stroke-width="2.4" marker-end="url(#arr)"/>
    <path d="M 240 208 L 220 192" stroke="#446688" stroke-width="2.4" marker-end="url(#arr)"/>

    <circle cx="150" cy="120" r="6" fill="#2b2b2b"/>
    <circle cx="230" cy="200" r="5" fill="#446688"/>
    <circle cx="310" cy="280" r="6" fill="#b85450"/>
    <circle cx="390" cy="200" r="6" fill="#b85450"/>
    <circle cx="310" cy="120" r="6" fill="#b85450"/>

    <text x="140" y="108" text-anchor="end" font-size="11" fill="#2b2b2b">起点 (0,0)</text>
    <text x="222" y="224" text-anchor="end" font-size="11" fill="#2f4a66">(1,1)</text>
    <text x="318" y="300" font-size="11" fill="#8a2b28">(2,2)：下边界反弹</text>
    <text x="390" y="206" font-size="11" fill="#8a2b28">(1,3) 反弹</text>
    <text x="302" y="108" text-anchor="end" font-size="11" fill="#8a2b28">(0,2)：上边界反弹</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="470" y="96" width="310" height="208" rx="12" fill="#eef2f6" stroke="#446688" stroke-width="1.5"/>
    <text x="486" y="122" font-size="12" font-weight="bold" fill="#2f4a66">展开思路</text>
    <text x="486" y="150" font-size="11.5" fill="#444444">把棋盘沿边界镜像复制，球在无限平面里</text>
    <text x="486" y="172" font-size="11.5" fill="#444444">沿斜率为 ±1 的直线前进。</text>
    <text x="486" y="200" font-size="11.5" fill="#444444">一维坐标的周期是 2(n−1) 与 2(m−1)，</text>
    <text x="486" y="222" font-size="11.5" fill="#444444">即 X ≡ ±i，Y ≡ ±j。</text>
    <text x="486" y="250" font-size="11.5" fill="#444444">两条轨迹相交 ⇔ 两个"签名"</text>
    <text x="486" y="272" font-size="11.5" fill="#444444">{±(i+j), ±(i−j)} mod 2g 有公共元素。</text>
    <text x="486" y="296" font-size="11" fill="#777777">其中 g = gcd(n−1, m−1)。</text>
  </g>

  <text x="410" y="404" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">3×4 时 g = gcd(2,3) = 1，签名只有 {0}、{1} 两种，所以最多放 2 枚。</text>
</svg>
