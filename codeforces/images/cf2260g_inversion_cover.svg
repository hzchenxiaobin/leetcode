<svg xmlns="http://www.w3.org/2000/svg" width="660" height="436" viewBox="0 0 660 436" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="19" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="660" height="436" fill="#fafafa"/>

  <text x="330" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#r)">核心观察：删掉 x 的倍数位后递增 ⇔ 每条逆序对都被这些位置「盖住」</text>
  <text x="330" y="52" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#r)">例：π = [1,3,6,4,5,2]，取 x = 3，删掉第 3、6 位，剩下 [1,3,4,5] 严格递增</text>

  <!-- array -->
  <g filter="url(#r)">
    <rect x="78" y="76" width="46" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="130" y="76" width="46" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="182" y="76" width="46" height="40" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="234" y="76" width="46" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="286" y="76" width="46" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="338" y="76" width="46" height="40" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <g font-size="11" fill="#777" text-anchor="middle">
    <text x="101" y="70" filter="url(#r)">1</text><text x="153" y="70" filter="url(#r)">2</text>
    <text x="205" y="70" filter="url(#r)">3</text><text x="257" y="70" filter="url(#r)">4</text>
    <text x="309" y="70" filter="url(#r)">5</text><text x="361" y="70" filter="url(#r)">6</text>
  </g>
  <g font-size="15" font-weight="bold" fill="#2b2b2b" text-anchor="middle">
    <text x="101" y="103" filter="url(#r)">1</text><text x="153" y="103" filter="url(#r)">3</text>
    <text x="205" y="103" filter="url(#r)">6</text><text x="257" y="103" filter="url(#r)">4</text>
    <text x="309" y="103" filter="url(#r)">5</text><text x="361" y="103" filter="url(#r)">2</text>
  </g>
  <g font-size="11" text-anchor="middle" fill="#b85450">
    <text x="182" y="132" filter="url(#r)">×3</text>
    <text x="338" y="132" filter="url(#r)">×6</text>
  </g>
  <text x="470" y="92" font-size="12" fill="#4a7a3a" filter="url(#r)">保留位（3 不整除的位）</text>
  <text x="470" y="112" font-size="12" fill="#b85450" filter="url(#r)">删除位（3 的倍数位）</text>
  <text x="470" y="140" font-size="12" fill="#2b2b2b" filter="url(#r)">保留序列 1,3,4,5 ✓ 递增</text>

  <!-- inversion cards -->
  <g filter="url(#r)">
    <rect x="52" y="168" width="176" height="76" rx="9" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <rect x="242" y="168" width="176" height="76" rx="9" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <rect x="432" y="168" width="176" height="76" rx="9" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g font-size="12.5" fill="#33517a" text-anchor="middle">
    <text x="140" y="192" filter="url(#r)">逆序对 (3,4)</text>
    <text x="140" y="212" filter="url(#r)">π₃=6 &gt; π₄=4</text>
    <text x="140" y="232" filter="url(#r)" fill="#4a7a3a">位置 3 是 3 的倍数 ✓</text>
    <text x="330" y="192" filter="url(#r)">逆序对 (3,6)</text>
    <text x="330" y="212" filter="url(#r)">π₃=6 &gt; π₆=2</text>
    <text x="330" y="232" filter="url(#r)" fill="#4a7a3a">位置 3、6 都是 ✓</text>
    <text x="520" y="192" filter="url(#r)">逆序对 (5,6)</text>
    <text x="520" y="212" filter="url(#r)">π₅=5 &gt; π₆=2</text>
    <text x="520" y="232" filter="url(#r)" fill="#4a7a3a">位置 6 是 3 的倍数 ✓</text>
  </g>

  <text x="330" y="272" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#r)">只要每条逆序对 (a,b) 都满足 3 | a 或 3 | b，删完就递增；否则总会剩下一对逆序</text>

  <!-- closure band -->
  <g filter="url(#r)">
    <rect x="52" y="290" width="556" height="128" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="76" y="318" width="120" height="34" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="268" y="318" width="86" height="34" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="268" y="366" width="86" height="34" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="426" y="318" width="150" height="82" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="136" y="340" text-anchor="middle" font-size="12.5" fill="#2e6e2e" filter="url(#r)">6 的倍数位被删</text>
  <text x="311" y="340" text-anchor="middle" font-size="12.5" fill="#2e6e2e" filter="url(#r)">⇒ x=2</text>
  <text x="311" y="388" text-anchor="middle" font-size="12.5" fill="#2e6e2e" filter="url(#r)">⇒ x=3</text>
  <path d="M 200 335 L 262 335" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#ag)"/>
  <path d="M 200 340 C 220 384 240 384 262 383" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#ag)"/>
  <text x="501" y="344" text-anchor="middle" font-size="12" fill="#a87f2a" filter="url(#r)">因子闭包：K₂ ⊇ K₆</text>
  <text x="501" y="364" text-anchor="middle" font-size="12" fill="#a87f2a" filter="url(#r)">x 成立则其约数也成立</text>
  <text x="501" y="384" text-anchor="middle" font-size="12" fill="#a87f2a" filter="url(#r)">⇒ 只需枚举质数 p</text>
</svg>
