<svg xmlns="http://www.w3.org/2000/svg" width="700" height="270" viewBox="0 0 700 270"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="813"/>
    <feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></defs>
  <rect width="700" height="270" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">为什么位置可以拆成两个一维问题</text>
  <path d="M 180 40 Q 350 46 520 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="76" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="12.5" fill="#22314a" filter="url(#rough2)">矩形尺寸固定后，中心 = (x₁ + w/2, y₁ + h/2)，到 (x,y) 的距离平方可分离：</text>
  <text x="76" y="106" font-size="12.5" fill="#22314a" filter="url(#rough2)">(x₁ + w/2 − x)² + (y₁ + h/2 − y)² ⇒ x₁ 与 y₁ 各自独立最小化 ✓</text>
  <g filter="url(#rough2)"><rect x="60" y="146" width="580" height="60" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="170" font-size="12.5" fill="#2f5223" filter="url(#rough2)">并列时取字典序最小 ⇒ 先比 x₁ 再比 y₁（都取更小者）。</text>
  <text x="76" y="192" font-size="12.5" fill="#2f5223" filter="url(#rough2)">边界处（点贴边/贴角）x₁ 只能取 0 或 n−w，夹紧即可。</text>
  <g filter="url(#rough2)"><rect x="60" y="218" width="580" height="44" rx="8" fill="#fbeeee" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="76" y="246" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">易错：n,m ≤ 10⁹，所有乘法用 64 位；t 必须整除两个方向（用 min 保证）。</text>
</svg>
