<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">三个样例走查</text>
  <path d="M 290 42 Q 360 48 430 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 样例 1 -->
  <text x="40" y="76" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">样例 1：n=4, a=[1,2,3,3]，S=9, T=3, 2T=6</text>
  <g font-size="11" text-anchor="middle" fill="#555" filter="url(#rough2)">
    <text x="70" y="108">pref</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="95" y="92" width="52" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="147" y="92" width="52" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="199" y="92" width="52" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="251" y="92" width="52" height="34" rx="6" fill="#fde8e8" stroke="#b85450" stroke-width="1.6"/>
    <rect x="303" y="92" width="52" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">
    <text x="121" y="114">0</text><text x="173" y="114">1</text><text x="225" y="114">3</text>
    <text x="277" y="114">6</text><text x="329" y="114">9</text>
  </g>
  <text x="225" y="142" text-anchor="middle" font-size="10.5" fill="#2f5223" filter="url(#rough2)">T</text>
  <text x="277" y="142" text-anchor="middle" font-size="10.5" fill="#a33a36" filter="url(#rough2)">2T</text>
  <text x="380" y="110" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">j=3 时 pref[3]=6=2T，可用 i=2（pref[2]=3=T）→ 1 种。</text>

  <!-- 样例 2 -->
  <text x="40" y="186" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">样例 2：n=5, a=[1,2,3,4,5]，S=15, T=5</text>
  <g filter="url(#rough2)">
    <rect x="95" y="202" width="52" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="147" y="202" width="52" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="199" y="202" width="52" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="251" y="202" width="52" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="303" y="202" width="52" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="355" y="202" width="52" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">
    <text x="121" y="224">0</text><text x="173" y="224">1</text><text x="225" y="224">3</text>
    <text x="277" y="224">6</text><text x="329" y="224">10</text><text x="381" y="224">15</text>
  </g>
  <text x="420" y="216" font-size="11" fill="#a33a36" filter="url(#rough2)">前缀里没有 5（T），</text>
  <text x="420" y="234" font-size="11" fill="#a33a36" filter="url(#rough2)">也没有可用的 2T=10</text>
  <text x="420" y="252" font-size="11" fill="#a33a36" filter="url(#rough2)">（j ≤ 4）→ 0。</text>

  <!-- 全 0 -->
  <text x="40" y="276" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">全 0：n=4, a=[0,0,0,0]，T=0, 2T=0</text>
  <g filter="url(#rough2)">
    <rect x="95" y="292" width="52" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="147" y="292" width="52" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="199" y="292" width="52" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="251" y="292" width="52" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="303" y="292" width="52" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">
    <text x="121" y="314">0</text><text x="173" y="314">0</text><text x="225" y="314">0</text>
    <text x="277" y="314">0</text><text x="329" y="314">0</text>
  </g>
  <text x="380" y="310" font-size="11.5" fill="#2f5223" filter="url(#rough2)">所有 i≥1、j≤3 的前缀都等于 0；</text>
  <text x="380" y="330" font-size="11.5" fill="#2f5223" filter="url(#rough2)">方案数 = C(3,2) = 3（任选两个切点）。</text>

  <text x="40" y="386" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">三个例子分别验证了：正常命中、S=15 的 T=5 不命中、以及 T=0 的重复前缀计数。</text>
  <text x="40" y="408" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">注意 S 不能被 3 整除时答案为 0；n &lt; 3 时循环不会产生任何合法切点。</text>
</svg>
