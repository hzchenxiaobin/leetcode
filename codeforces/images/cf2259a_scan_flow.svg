<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="29"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="480" fill="#fafafa"/>

  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按块扫描的流程：一次比较一个农场</text>
  <path d="M 206 44 Q 360 51 514 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <rect x="250" y="58" width="220" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="84" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">读入 t（数据组数）</text>
  <path d="M 360 98 L 360 114" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="210" y="118" width="300" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="144" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">读 n, k, s；ans ← 0</text>
  <path d="M 360 158 L 360 178" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <path d="M 360 182 L 490 226 L 360 270 L 230 226 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="232" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">start &lt; n ?</text>

  <!-- 否分支 -->
  <path d="M 490 226 L 512 226" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="500" y="218" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">否</text>
  <rect x="518" y="204" width="176" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="606" y="224" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">输出 ans</text>
  <text x="606" y="240" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">处理下一组数据</text>

  <!-- 是分支 -->
  <path d="M 360 270 L 360 286" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="374" y="286" text-anchor="start" font-size="12" fill="#446688" filter="url(#rough2)">是</text>

  <rect x="190" y="290" width="340" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="316" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">检查块 [start, start + k) 里有没有 0</text>

  <path d="M 300 330 L 236 360" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 420 330 L 484 360" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="118" y="364" width="196" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="216" y="384" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">含 0：免费</text>
  <text x="216" y="400" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">ans 不变</text>

  <rect x="406" y="364" width="196" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="504" y="384" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">整块全 1</text>
  <text x="504" y="400" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">ans ← ans + 1</text>

  <path d="M 216 408 L 300 432" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 504 408 L 420 432" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="290" y="436" width="220" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="400" y="460" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">start ← start + k</text>

  <!-- 回边 -->
  <path d="M 290 455 L 62 455 L 62 226 L 222 226" stroke="#446688" stroke-width="1.5" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="74" y="336" text-anchor="start" font-size="11.5" fill="#446688" filter="url(#rough2)">跳到下一块</text>
  <text x="74" y="354" text-anchor="start" font-size="11.5" fill="#446688" filter="url(#rough2)">再判一次</text>
</svg>
