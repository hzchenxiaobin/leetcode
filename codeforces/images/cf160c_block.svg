<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="663"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="300" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">按第一元素分块，块大小 = 该值出现次数 × n</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">块内第二元素把每个值重复 c 次</text>
  <text x="90" y="100" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">排序后 a = [0, 1, 2, 2]，n = 4</text>
  <g filter="url(#rough2)"><rect x="80" y="130" width="320" height="34" rx="4" fill="#ffffff" fill-opacity="0.3" stroke="#446688" stroke-width="1.4"/></g>
  <text x="240" y="152" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">第一元素 0（c=1）</text>
  <text x="430" y="152" text-anchor="start" font-size="11" fill="#446688" filter="url(#rough2)">4 个对：0 0, 0 1, 0 2, 0 2</text>
  <g filter="url(#rough2)"><rect x="80" y="176" width="320" height="34" rx="4" fill="#ffffff" fill-opacity="0.3" stroke="#b06a1e" stroke-width="1.4"/></g>
  <text x="240" y="198" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">第一元素 1（c=1）</text>
  <text x="430" y="198" text-anchor="start" font-size="11" fill="#b06a1e" filter="url(#rough2)">4 个对：1 0, 1 1, 1 2, 1 2</text>
  <g filter="url(#rough2)"><rect x="80" y="222" width="320" height="34" rx="4" fill="#ffffff" fill-opacity="0.3" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="240" y="244" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">第一元素 2（c=2）</text>
  <text x="430" y="244" text-anchor="start" font-size="11" fill="#4a7a3a" filter="url(#rough2)">8 个对：2 0×2, 2 1×2, 2 2×2, 2 2×2</text>
  <text x="450" y="280" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">块内偏移 p ⇒ 第二元素 = a[p // c]</text>
</svg>
