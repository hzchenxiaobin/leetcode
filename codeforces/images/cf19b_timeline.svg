<svg xmlns="http://www.w3.org/2000/svg" width="740" height="330" viewBox="0 0 740 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="91"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="740" height="330" fill="#fafafa"/>
  <text x="370" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">付钱集合 S 的时间线：收银员忙碌的 T 秒里偷 T 件</text>

  <!-- 时间条 -->
  <rect x="80" y="90" width="240" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="320" y="90" width="120" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="440" y="90" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="116" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">付钱商品① t=2 秒</text>
  <text x="380" y="116" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">② t=1</text>
  <text x="540" y="116" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">③ t=2 秒</text>

  <!-- 偷窃刻度 -->
  <g font-size="10.5" fill="#8f3b37" filter="url(#rough2)">
    <text x="110" y="150">偷 1</text><text x="170" y="150">偷 2</text>
    <text x="350" y="150">偷 3</text>
    <text x="470" y="150">偷 4</text><text x="560" y="150">偷 5</text>
  </g>
  <g stroke="#b85450" stroke-width="1" stroke-dasharray="3 3" filter="url(#rough2)">
    <line x1="110" y1="130" x2="110" y2="144"/><line x1="170" y1="130" x2="170" y2="144"/>
    <line x1="350" y1="130" x2="350" y2="144"/>
    <line x1="470" y1="130" x2="470" y2="144"/><line x1="560" y1="130" x2="560" y2="144"/>
  </g>
  <text x="360" y="186" text-anchor="middle" font-size="12" fill="#8f3b37" filter="url(#rough2)">T = 2 + 1 + 2 = 5 秒 ⇒ 最多偷 5 件；加上 3 件付钱的，共能处理 8 件</text>

  <rect x="70" y="212" width="600" height="96" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <g font-size="12.5" fill="#8a6015" filter="url(#rough2)">
    <text x="86" y="236">可行性：|S| + Σ_{i∈S} t_i ≥ n，即 Σ_{i∈S} (t_i + 1) ≥ n。</text>
    <text x="86" y="260">于是每件商品贡献"容量" t_i + 1、花费 c_i，问题变成"容量达到 n 的最小花费"背包。</text>
    <text x="86" y="284" font-weight="bold" fill="#8f3b37">偷的顺序无关紧要：只要总时间够，Bob 总能在这些间隙里偷完剩下的。</text>
  </g>
</svg>
