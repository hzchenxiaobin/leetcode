<svg xmlns="http://www.w3.org/2000/svg" width="700" height="290" viewBox="0 0 700 290"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="1303"/>
    <feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></defs>
  <rect width="700" height="290" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">线段树：每节点 48 个相位和 + 懒标记</text>
  <path d="M 140 40 Q 350 46 560 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="76" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="12.5" fill="#22314a" filter="url(#rough2)">sum[i] = 该区间整体再立方 i 次后的和（i = 0..47）。</text>
  <text x="76" y="106" font-size="12.5" fill="#22314a" filter="url(#rough2)">区间立方 = 把 sum 循环左移 1 位 + lazy++（mod 48）—— 整段 O(48) 或纯标记。</text>
  <text x="76" y="130" font-size="12.5" fill="#22314a" filter="url(#rough2)">查询 = sum[0]；合并 = 逐相位相加（两边相位对齐）。</text>
  <g filter="url(#rough2)"><rect x="60" y="146" width="580" height="66" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="170" font-size="12.5" fill="#2f5223" filter="url(#rough2)">建树：叶子预计算 48 次立方；内部节点逐相位求和。</text>
  <text x="76" y="194" font-size="12.5" fill="#2f5223" filter="url(#rough2)">复杂度 O(48·log n) 每次操作；n=q=1e5 实测 0.37 s（时限 6 s）。</text>
  <g filter="url(#rough2)"><rect x="60" y="222" width="580" height="56" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="76" y="246" font-size="12.5" fill="#8a6015" filter="url(#rough2)">内存：4n 个节点 × 48 × 4B ≈ 77 MB（限 256 MB）✓</text>
  <text x="76" y="268" font-size="12px" fill="#8a6015" filter="url(#rough2)">区间和用 int：两两相加后 &lt; 2M &lt; 2³¹ ✓ 每步取模。</text>
</svg>
