<svg xmlns="http://www.w3.org/2000/svg" width="700" height="400" viewBox="0 0 700 400"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="221"/>
    <feDisplacementMap in="SourceGraphic" scale="1.5"/></filter></defs>
  <rect width="700" height="400" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">约束 b→c（cnt[b] &gt; cnt[c]）且 b 互不相同、c 互不相同 ⇒ 只可能是链或环</text>
  <path d="M 80 40 Q 350 46 620 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <circle cx="120" cy="90" r="22" fill="#dfeafc" stroke="#446688" stroke-width="1.8"/>
    <circle cx="280" cy="90" r="22" fill="#dfeafc" stroke="#446688" stroke-width="1.8"/>
    <circle cx="440" cy="90" r="22" fill="#dfeafc" stroke="#446688" stroke-width="1.8"/>
    <circle cx="600" cy="90" r="22" fill="#dfeafc" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#22314a" filter="url(#rough2)">
    <text x="120" y="95">v₁</text><text x="280" y="95">v₂</text><text x="440" y="95">v₃</text><text x="600" y="95">v₄</text>
  </g>
  <g stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)">
    <line x1="144" y1="90" x2="256" y2="90"/><line x1="304" y1="90" x2="416" y2="90"/><line x1="464" y1="90" x2="576" y2="90"/>
  </g>
  <g font-size="11.5" fill="#8a3a36" filter="url(#rough2)">
    <text x="200" y="80" text-anchor="middle">&gt;</text><text x="360" y="80" text-anchor="middle">&gt;</text><text x="520" y="80" text-anchor="middle">&gt;</text>
  </g>
  <text x="360" y="126" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">cnt[v₁] &gt; cnt[v₂] &gt; cnt[v₃] &gt; cnt[v₄] ≥ 0</text>
  <g filter="url(#rough2)"><rect x="60" y="144" width="580" height="92" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="76" y="168" font-size="12.5" fill="#8a6015" filter="url(#rough2)">代入：cnt[v_j] = (m−j) + Σ_{k≥j} d_k，其中 d_k ≥ 0 是第 k 条边的"松弛量"，d_m = cnt[v_m] ≥ 0。</text>
  <text x="76" y="192" font-size="12.5" fill="#8a6015" filter="url(#rough2)">每个 d_k 在总价里的系数 = Σ_{j≤k} a_{v_j}（链的前缀和）⇒ 每种 d_k 是一个"无限次可用"的物品。</text>
  <text x="76" y="214" font-size="12" fill="#8a6015" filter="url(#rough2)">常数项（d 全 0 时的最小花费）base = Σ a_{v_j}·(m−j)。</text>
  <text x="76" y="232" font-size="11.5" fill="#8a6015" filter="url(#rough2)">孤立点（既非 b 也非 c）：cnt ≥ 0 自由 ⇒ 物品重量 a_i。</text>
  <g filter="url(#rough2)"><rect x="60" y="246" width="580" height="70" rx="8" fill="#fbeeee" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="76" y="270" font-size="13" fill="#8a3a36" filter="url(#rough2)">出现环（如 1→2、2→1）⇒ 约束自相矛盾 ⇒ 答案 0（样例 3）。</text>
  <text x="76" y="294" font-size="12" fill="#8a3a36" filter="url(#rough2)">自环不存在（b≠c），但长度 ≥2 的环会出现在"没有入边的起点"遍历不到的点里。</text>
  <g filter="url(#rough2)"><rect x="60" y="326" width="580" height="58" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="350" font-size="12.5" fill="#2f5223" filter="url(#rough2)">答案 = 在 T = t − base 上做"无限背包计数"（物品 = 各 d_k 与前缀和 + 孤立点），模 1e9+7。</text>
  <text x="76" y="372" font-size="12" fill="#2f5223" filter="url(#rough2)">复杂度 O(n·t)，n ≤ 300、t ≤ 1e5 ⇒ 3·10⁷。</text>
</svg>
