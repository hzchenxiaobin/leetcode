<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1442"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="720" height="320" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">距离相同的人：只看行号会不会撞上</text>
  <path d="M 170 42 Q 360 48 550 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <text x="185" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">① 起点、终点行序一致 ⇒ 不撞</text>
  <rect x="40" y="84" width="290" height="140" rx="7" fill="#eef5ea" stroke="#5a8a4a" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="80" y1="200" x2="300" y2="200" stroke="#999999" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="80" y1="100" x2="80" y2="210" stroke="#999999" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="72" y="106" text-anchor="end" font-size="10" fill="#777777" filter="url(#rough2)">r=4</text>
  <text x="72" y="136" text-anchor="end" font-size="10" fill="#777777" filter="url(#rough2)">r=3</text>
  <text x="72" y="166" text-anchor="end" font-size="10" fill="#777777" filter="url(#rough2)">r=2</text>
  <text x="72" y="196" text-anchor="end" font-size="10" fill="#777777" filter="url(#rough2)">r=1</text>
  <text x="80" y="222" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">t=0</text>
  <text x="185" y="222" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">t=1</text>
  <text x="290" y="222" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">t=2</text>
  <polyline points="80,126 185,156 290,186" fill="none" stroke="#a05a5a" stroke-width="2.2" filter="url(#rough2)"/>
  <polyline points="80,96 185,126 290,156" fill="none" stroke="#335478" stroke-width="2.2" filter="url(#rough2)"/>
  <circle cx="80" cy="126" r="5" fill="#a05a5a" filter="url(#rough2)"/>
  <circle cx="185" cy="156" r="5" fill="#a05a5a" filter="url(#rough2)"/>
  <circle cx="290" cy="186" r="5" fill="#a05a5a" filter="url(#rough2)"/>
  <circle cx="80" cy="96" r="5" fill="#335478" filter="url(#rough2)"/>
  <circle cx="185" cy="126" r="5" fill="#335478" filter="url(#rough2)"/>
  <circle cx="290" cy="156" r="5" fill="#335478" filter="url(#rough2)"/>
  <text x="300" y="126" text-anchor="end" font-size="10" fill="#335478" filter="url(#rough2)">甲</text>
  <text x="300" y="196" text-anchor="end" font-size="10" fill="#a05a5a" filter="url(#rough2)">乙</text>

  <text x="545" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#a05a5a" filter="url(#rough2)">② 行序被颠倒 ⇒ 某一秒必同格</text>
  <rect x="400" y="84" width="290" height="140" rx="7" fill="#fbeeee" stroke="#a05a5a" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="440" y1="200" x2="660" y2="200" stroke="#999999" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="440" y1="100" x2="440" y2="210" stroke="#999999" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="432" y="106" text-anchor="end" font-size="10" fill="#777777" filter="url(#rough2)">r=4</text>
  <text x="432" y="136" text-anchor="end" font-size="10" fill="#777777" filter="url(#rough2)">r=3</text>
  <text x="432" y="166" text-anchor="end" font-size="10" fill="#777777" filter="url(#rough2)">r=2</text>
  <text x="432" y="196" text-anchor="end" font-size="10" fill="#777777" filter="url(#rough2)">r=1</text>
  <text x="440" y="222" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">t=0</text>
  <text x="545" y="222" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">t=1</text>
  <text x="650" y="222" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">t=2</text>
  <polyline points="440,126 545,126 650,126" fill="none" stroke="#a05a5a" stroke-width="2.2" filter="url(#rough2)"/>
  <polyline points="440,96 545,126 650,156" fill="none" stroke="#335478" stroke-width="2.2" filter="url(#rough2)"/>
  <circle cx="440" cy="126" r="5" fill="#a05a5a" filter="url(#rough2)"/>
  <circle cx="545" cy="126" r="5" fill="#a05a5a" filter="url(#rough2)"/>
  <circle cx="650" cy="126" r="5" fill="#a05a5a" filter="url(#rough2)"/>
  <circle cx="440" cy="96" r="5" fill="#335478" filter="url(#rough2)"/>
  <circle cx="545" cy="126" r="5" fill="#335478" filter="url(#rough2)"/>
  <circle cx="650" cy="156" r="5" fill="#335478" filter="url(#rough2)"/>
  <circle cx="545" cy="126" r="13" fill="none" stroke="#c07070" stroke-width="1.6" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="560" y="112" font-size="10.5" font-weight="bold" fill="#a05a5a" filter="url(#rough2)">同格！</text>

  <text x="360" y="262" text-anchor="middle" font-size="11.5" fill="#335478" filter="url(#rough2)">同一个 d ⇒ 同一秒两人都在同一条副对角线上（r+c 相同）⇒ 是否同格只取决于行号 r 是否相等</text>
  <text x="360" y="286" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">每步行号只能「减 1（上移）」或「不变（左移）」，所以起点行序必须与终点行序一致，否则必有某一秒相等</text>
  <text x="360" y="308" text-anchor="middle" font-size="11" fill="#777777" filter="url(#rough2)">不同 d 的人同一秒处在不同副对角线上，永不同格；副对角线上的格子最后只能各站一人</text>
</svg>
