<svg xmlns="http://www.w3.org/2000/svg" width="660" height="522" viewBox="0 0 660 522"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="660" height="522" fill="#fafafa"/>

  <text x="330" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：一次扫描统计 + 只枚举 3 个 t 值</text>
  <text x="330" y="48" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">每组数据 O(n) 时间、O(1) 额外空间，没有任何数据结构</text>

  <g filter="url(#rough2)">
    <ellipse cx="300" cy="80" rx="48" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="300" y="85" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33517a" filter="url(#rough2)">开始</text>
  <path d="M 300 100 L 300 110" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar2)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="110" y="112" width="380" height="54" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="300" y="133" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">扫描 s：Z ← 0 的个数，O ← 1 的个数，d ← Z − O</text>
  <text x="300" y="153" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">行程长度编码：p ← 0 段个数，q ← 1 段个数</text>
  <path d="M 300 166 L 300 180" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar2)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="196" y="182" width="208" height="36" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="300" y="205" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">best ← −1（可保留的最长长度）</text>
  <path d="M 300 218 L 300 224" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar2)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <polygon points="300,226 400,257 300,288 200,257" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="300" y="253" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a0761e" filter="url(#rough2)">还有 t ∈ {−1, 0, 1}</text>
  <text x="300" y="270" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a0761e" filter="url(#rough2)">没试过？</text>
  <path d="M 400 257 L 448 257" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar2)" filter="url(#rough2)"/>
  <text x="424" y="249" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">否</text>

  <g filter="url(#rough2)">
    <rect x="452" y="234" width="176" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="540" y="254" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">输出 n − best</text>
  <text x="540" y="271" text-anchor="middle" font-size="10.5" fill="#2e6e2e" filter="url(#rough2)">（best = −1 则输出 −1）</text>

  <text x="300" y="303" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">是</text>
  <path d="M 300 288 L 300 306" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar2)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="104" y="308" width="392" height="88" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="118" y="330" font-size="11.5" fill="#333" filter="url(#rough2)">① |d − t| ≤ 1 ？否则 m = −∞（删除计数差会超标）</text>
  <text x="118" y="354" font-size="11.5" fill="#333" filter="url(#rough2)">② t ≥ 0：m = 2 · min(q, p − t) + t（需 p ≥ t）</text>
  <text x="118" y="378" font-size="11.5" fill="#333" filter="url(#rough2)">③ t &lt; 0：m = 2 · min(p, q + t) + |t|（需 q ≥ |t|）</text>
  <path d="M 300 396 L 300 410" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar2)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="210" y="412" width="180" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="300" y="435" text-anchor="middle" font-size="11.5" fill="#33517a" filter="url(#rough2)">best ← max(best, m)</text>

  <path d="M 210 430 L 70 430 L 70 257 L 198 257" stroke="#4a7a3a" stroke-width="1.7" fill="none"
        stroke-dasharray="6,4" marker-end="url(#ar2)" filter="url(#rough2)"/>
  <text x="80" y="340" font-size="10.5" fill="#4a7a3a" transform="rotate(-90 80 340)" filter="url(#rough2)">下一个 t</text>

  <g filter="url(#rough2)">
    <rect x="104" y="462" width="452" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="330" y="481" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">t 只要试 3 个值：答案 = n − best，即「总长度 − 最多能保留多少」</text>
  <text x="330" y="499" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">若 3 个 t 全不可行，说明最小删除次数都凑不出合法删除序 → −1</text>
</svg>
