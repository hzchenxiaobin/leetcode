<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="720" height="420" fill="#fafafa"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">逐位定方案：X 取 C 最小，Y 取 C+B</text>
  <path d="M 200 43 Q 360 49 520 43" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <rect x="64" y="72" width="592" height="96" rx="7" fill="#e9f4e2" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="80" y="100" text-anchor="start" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">C 的位 = 1：X、Y 都是 1（xor 位必为 0）</text>
  <text x="80" y="126" text-anchor="start" font-size="12" fill="#2f5223" filter="url(#rough2)">C 的位 = 0、B 的位 = 1：X、Y 一 1 一 0（谁 1 谁 0 可自由选）</text>
  <text x="80" y="152" text-anchor="start" font-size="12" fill="#2f5223" filter="url(#rough2)">C、B 该位都是 0：X、Y 都是 0</text>
  <rect x="64" y="186" width="592" height="76" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="80" y="212" text-anchor="start" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">要让 X 最小：C 里为 1 的位躲不掉，必须留给 X；</text>
  <text x="80" y="238" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">B 里为 1 的位全部塞给 Y 即可 → X = C，Y = C + B（C &amp; B = 0，加法不进位）</text>
  <rect x="64" y="280" width="592" height="108" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="80" y="306" text-anchor="start" font-size="11.5" fill="#8a6015" filter="url(#rough2)">样例：A = 142 = 10001110，B = 76 = 1001100，C = (142-76)/2 = 33 = 100001</text>
  <text x="80" y="332" text-anchor="start" font-size="11.5" fill="#8a6015" filter="url(#rough2)">检查 C &amp; B = 100001 &amp; 1001100 = 0 ✓</text>
  <text x="80" y="358" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">X = 33 = 100001，Y = 33 + 76 = 109 = 1101101；33 + 109 = 142，33 xor 109 = 76 ✓</text>
  <text x="360" y="412" text-anchor="middle" font-size="11" fill="#777777" filter="url(#rough2)">无解只有两种：A &lt; B 或 A-B 为奇数；以及 C &amp; B ≠ 0（同一位不能既 and 又 xor）。</text>
</svg>
