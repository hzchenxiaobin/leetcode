<svg xmlns="http://www.w3.org/2000/svg" width="880" height="404" viewBox="0 0 880 404"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="99"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="404" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">所有杯子原本一样多：平均数是“基准线”</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">一次倒果汁 = 一个杯子少 v、另一个多 v，其余不动</text>
  <g filter="url(#rough2)"><line x1="70" y1="252.0" x2="800" y2="252.0" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="7 5"/></g>
  <text x="806" y="256.0" text-anchor="start" font-size="11.5" fill="#3d6b2f" font-weight="bold" filter="url(#rough2)">V = 250</text>
  <g filter="url(#rough2)"><rect x="110" y="140" width="96" height="160" rx="4" fill="#f6d9d7" fill-opacity="0.5" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="158.0" y="134" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">1</text>
  <text x="158.0" y="318" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">270</text>
  <g filter="url(#rough2)"><rect x="230" y="140" width="96" height="160" rx="4" fill="#d7ecd0" fill-opacity="0.5" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="278.0" y="134" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">2</text>
  <text x="278.0" y="318" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">250</text>
  <g filter="url(#rough2)"><rect x="350" y="140" width="96" height="160" rx="4" fill="#d7ecd0" fill-opacity="0.5" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="398.0" y="134" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">3</text>
  <text x="398.0" y="318" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">250</text>
  <g filter="url(#rough2)"><rect x="470" y="140" width="96" height="160" rx="4" fill="#cfe0f5" fill-opacity="0.5" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="518.0" y="134" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">4</text>
  <text x="518.0" y="318" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">230</text>
  <g filter="url(#rough2)"><rect x="590" y="140" width="96" height="160" rx="4" fill="#d7ecd0" fill-opacity="0.5" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="638.0" y="134" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">5</text>
  <text x="638.0" y="318" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">250</text>
  <text x="440" y="352" text-anchor="middle" font-size="12" fill="#8a2b28" filter="url(#rough2)">偏差 +20 的杯子（#1）是倒入方，偏差 −20 的杯子（#4）是倒出方</text>
  <g filter="url(#rough2)"><rect x="80" y="364" width="720" height="34" rx="4" fill="#ffffff" fill-opacity="0.0" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="5 4"/></g>
  <text x="440" y="384" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">判定：和能被 n 整除；偏差全 0 → Exemplary；恰一正一负且绝对值相等 → 输出 v 与两端；否则 Unrecoverable</text>
</svg>
