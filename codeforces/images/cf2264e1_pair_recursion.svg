<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 424" width="880" height="424"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="880" height="424" fill="#fafafa"/>

  <text x="440" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">双元素递归：平滑数 K 与「墙」B(u)</text>
  <text x="440" y="55" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#rough2)">u 的平滑数 = 只由 u 的质因子拼出来的数；墙 B(u) 是比 u 大的最小平滑数</text>

  <!-- 数轴 -->
  <path d="M 60 132 L 822 132" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 6 -->
  <rect x="88" y="104" width="36" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="106" y="124" text-anchor="middle" font-size="13" fill="#8c3a37" filter="url(#rough2)">6</text>
  <text x="106" y="160" text-anchor="middle" font-size="11.5" fill="#8c3a37" filter="url(#rough2)">u = 6</text>

  <!-- 8 墙 -->
  <rect x="200" y="104" width="36" height="28" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="218" y="124" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">8</text>
  <text x="218" y="160" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">B(6) = 8（墙）</text>
  <path d="M 218 96 L 218 78" stroke="#d6a040" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="218" y="72" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">rad = {2} ⊆ rad(6)</text>

  <!-- 平滑数 9,12,16,18 -->
  <rect x="352" y="104" width="36" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="370" y="124" text-anchor="middle" font-size="13" fill="#33582a" filter="url(#rough2)">9</text>
  <rect x="452" y="104" width="36" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470" y="124" text-anchor="middle" font-size="13" fill="#33582a" filter="url(#rough2)">12</text>
  <rect x="562" y="104" width="36" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="580" y="124" text-anchor="middle" font-size="13" fill="#33582a" filter="url(#rough2)">16</text>
  <text x="470" y="160" text-anchor="middle" font-size="11.5" fill="#33582a" filter="url(#rough2)">6 的平滑数（2^a·3^b）</text>

  <!-- K=18 -->
  <rect x="662" y="104" width="40" height="28" rx="6" fill="#4a7a3a" stroke="#33582a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="682" y="124" text-anchor="middle" font-size="13" fill="#ffffff" filter="url(#rough2)">18</text>
  <text x="682" y="160" text-anchor="middle" font-size="11.5" fill="#33582a" filter="url(#rough2)">K = 18（≤ v 的最大平滑数）</text>

  <!-- v=20 -->
  <rect x="764" y="104" width="36" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="782" y="124" text-anchor="middle" font-size="13" fill="#8c3a37" filter="url(#rough2)">20</text>
  <text x="782" y="160" text-anchor="middle" font-size="11.5" fill="#8c3a37" filter="url(#rough2)">v = 20</text>

  <!-- 区间标注 -->
  <path d="M 124 196 L 746 196" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 124 192 L 124 200 M 746 192 L 746 200" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="435" y="214" text-anchor="middle" font-size="11.8" fill="#33582a" filter="url(#rough2)">这一段里每个数都有不整除 u = 6 的质因子 ⇒ v 可以「单独」一路降到 K</text>

  <!-- 流程 -->
  <rect x="40" y="292" width="250" height="52" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="165" y="314" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">F(u, v)</text>
  <text x="165" y="334" text-anchor="middle" font-size="11.3" fill="#2f4a66" filter="url(#rough2)">双元素到达的最大公共值</text>

  <path d="M 296 318 L 336 318" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="316" y="308" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">判定</text>

  <!-- 菱形 -->
  <polygon points="430,286 520,318 430,350 340,318" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="430" y="314" text-anchor="middle" font-size="11.8" fill="#8a6015" filter="url(#rough2)">v &lt; B(u) ?</text>
  <text x="430" y="331" text-anchor="middle" font-size="10.5" fill="#8a6015" filter="url(#rough2)">（没有墙）</text>

  <path d="M 430 286 L 430 252 L 540 252" stroke="#4a7a3a" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="470" y="246" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="546" y="232" width="150" height="40" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="621" y="258" text-anchor="middle" font-size="12.8" fill="#33582a" filter="url(#rough2)">F(u, v) = u</text>

  <path d="M 520 318 L 566 318" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="543" y="308" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">否</text>
  <rect x="572" y="292" width="268" height="52" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="706" y="313" text-anchor="middle" font-size="12.3" fill="#8c3a37" filter="url(#rough2)">F(u, v) = F(u − 1, K − 1)</text>
  <text x="706" y="333" text-anchor="middle" font-size="11" fill="#8c3a37" filter="url(#rough2)">K = 最大的 u-平滑数且 K ≤ v</text>

  <rect x="40" y="376" width="800" height="38" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="400" font-size="12.2" fill="#2f4a66" filter="url(#rough2)">例：K = 18 是 6 的平滑数，用 p | 6 把它降 1 会同时降 u，于是 F(6, 20) = F(5, 17) = 5。</text>
</svg>
