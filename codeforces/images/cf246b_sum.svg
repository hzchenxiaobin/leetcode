<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="720" height="280" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">操作 a_i+1、a_j−1 保持总和不变</text>
  <rect x="60" y="60" width="600" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="360" y="89" text-anchor="middle" font-size="12" fill="#2f5223">Σ a_i 是不变量 ⇒ 若最终 n 个都相等，则每个都等于 mean = Σ/n</text>
  <rect x="60" y="130" width="290" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="205" y="157" text-anchor="middle" font-size="12" fill="#2f4a66">Σ 能被 n 整除</text>
  <text x="205" y="172" text-anchor="middle" font-size="12" fill="#2f4a66">→ 可以让 n 个全相等</text>
  <rect x="370" y="130" width="290" height="60" rx="8" fill="#fde9d9" stroke="#b4652a" stroke-width="1.5"/>
  <text x="515" y="157" text-anchor="middle" font-size="12" fill="#7a4b22">否则最多 n−1 个相等</text>
  <text x="515" y="172" text-anchor="middle" font-size="12" fill="#7a4b22">（n 个相等会推出矛盾）</text>
  <text x="60" y="236" text-anchor="start" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">构造：多退少补，把差距从「大于平均」的元素搬到「小于平均」的元素上</text>
</svg>
