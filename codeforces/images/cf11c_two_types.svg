<svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 0 780 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="780" height="420" fill="#fafafa"/>
  <text x="390" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两类正方形：边框全 1，外圈（含内侧相邻）不能有 1</text>

  <text x="162" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">① 与矩阵边平行（4×4）</text>
  <g filter="url(#rough2)">
    <rect x="60" y="76" width="204" height="204" fill="#ffffff" stroke="#c9ced6" stroke-width="1.2"/>
    <g stroke="#e4e6ea" stroke-width="1">
      <line x1="94" y1="76" x2="94" y2="280"/>
      <line x1="128" y1="76" x2="128" y2="280"/>
      <line x1="162" y1="76" x2="162" y2="280"/>
      <line x1="196" y1="76" x2="196" y2="280"/>
      <line x1="230" y1="76" x2="230" y2="280"/>
      <line x1="60" y1="110" x2="264" y2="110"/>
      <line x1="60" y1="144" x2="264" y2="144"/>
      <line x1="60" y1="178" x2="264" y2="178"/>
      <line x1="60" y1="212" x2="264" y2="212"/>
      <line x1="60" y1="246" x2="264" y2="246"/>
    </g>
    <g fill="#fbeeee">
      <rect x="60" y="76" width="34" height="34"/>
      <rect x="94" y="76" width="34" height="34"/>
      <rect x="128" y="76" width="34" height="34"/>
      <rect x="162" y="76" width="34" height="34"/>
      <rect x="196" y="76" width="34" height="34"/>
      <rect x="230" y="76" width="34" height="34"/>
      <rect x="60" y="110" width="34" height="34"/>
      <rect x="230" y="110" width="34" height="34"/>
      <rect x="60" y="144" width="34" height="34"/>
      <rect x="128" y="144" width="34" height="34"/>
      <rect x="162" y="144" width="34" height="34"/>
      <rect x="230" y="144" width="34" height="34"/>
      <rect x="60" y="178" width="34" height="34"/>
      <rect x="128" y="178" width="34" height="34"/>
      <rect x="162" y="178" width="34" height="34"/>
      <rect x="230" y="178" width="34" height="34"/>
      <rect x="60" y="212" width="34" height="34"/>
      <rect x="230" y="212" width="34" height="34"/>
      <rect x="60" y="246" width="34" height="34"/>
      <rect x="94" y="246" width="34" height="34"/>
      <rect x="128" y="246" width="34" height="34"/>
      <rect x="162" y="246" width="34" height="34"/>
      <rect x="196" y="246" width="34" height="34"/>
      <rect x="230" y="246" width="34" height="34"/>
    </g>
    <g fill="#446688">
      <rect x="94" y="110" width="34" height="34"/>
      <rect x="128" y="110" width="34" height="34"/>
      <rect x="162" y="110" width="34" height="34"/>
      <rect x="196" y="110" width="34" height="34"/>
      <rect x="94" y="144" width="34" height="34"/>
      <rect x="196" y="144" width="34" height="34"/>
      <rect x="94" y="178" width="34" height="34"/>
      <rect x="196" y="178" width="34" height="34"/>
      <rect x="94" y="212" width="34" height="34"/>
      <rect x="128" y="212" width="34" height="34"/>
      <rect x="162" y="212" width="34" height="34"/>
      <rect x="196" y="212" width="34" height="34"/>
    </g>
  </g>
  <text x="162" y="312" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">12 格边框 = 4k−4（k=4）；浅红是隔离带</text>
  <text x="162" y="332" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">隔离带里只要有一个 1 就不算</text>

  <text x="560" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">② 与矩阵对角线平行（r=2）</text>
  <g filter="url(#rough2)">
    <rect x="448" y="76" width="224" height="224" fill="#ffffff" stroke="#c9ced6" stroke-width="1.2"/>
    <g stroke="#e4e6ea" stroke-width="1">
      <line x1="480" y1="76" x2="480" y2="300"/>
      <line x1="512" y1="76" x2="512" y2="300"/>
      <line x1="544" y1="76" x2="544" y2="300"/>
      <line x1="576" y1="76" x2="576" y2="300"/>
      <line x1="608" y1="76" x2="608" y2="300"/>
      <line x1="640" y1="76" x2="640" y2="300"/>
      <line x1="448" y1="108" x2="672" y2="108"/>
      <line x1="448" y1="140" x2="672" y2="140"/>
      <line x1="448" y1="172" x2="672" y2="172"/>
      <line x1="448" y1="204" x2="672" y2="204"/>
      <line x1="448" y1="236" x2="672" y2="236"/>
      <line x1="448" y1="268" x2="672" y2="268"/>
    </g>
    <g fill="#fbeeee">
      <rect x="544" y="76" width="32" height="32"/>
      <rect x="512" y="108" width="32" height="32"/>
      <rect x="576" y="108" width="32" height="32"/>
      <rect x="480" y="140" width="32" height="32"/>
      <rect x="544" y="140" width="32" height="32"/>
      <rect x="608" y="140" width="32" height="32"/>
      <rect x="448" y="172" width="32" height="32"/>
      <rect x="512" y="172" width="32" height="32"/>
      <rect x="576" y="172" width="32" height="32"/>
      <rect x="640" y="172" width="32" height="32"/>
      <rect x="480" y="204" width="32" height="32"/>
      <rect x="544" y="204" width="32" height="32"/>
      <rect x="608" y="204" width="32" height="32"/>
      <rect x="512" y="236" width="32" height="32"/>
      <rect x="576" y="236" width="32" height="32"/>
      <rect x="544" y="268" width="32" height="32"/>
    </g>
    <g fill="#d6a040">
      <rect x="544" y="108" width="32" height="32"/>
      <rect x="512" y="140" width="32" height="32"/>
      <rect x="576" y="140" width="32" height="32"/>
      <rect x="480" y="172" width="32" height="32"/>
      <rect x="608" y="172" width="32" height="32"/>
      <rect x="512" y="204" width="32" height="32"/>
      <rect x="576" y="204" width="32" height="32"/>
      <rect x="544" y="236" width="32" height="32"/>
    </g>
  </g>
  <text x="560" y="326" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">8 格 = 4r（r=2），包围盒 (2r+1)×(2r+1)</text>
  <text x="560" y="346" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">r=1 时是 4 格的最小菱形</text>

  <text x="390" y="382" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">关键：一个合法正方形恰好就是一个 8 连通块，块里没有边框以外的 1。</text>
  <text x="390" y="404" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">于是“数正方形”=“数一数有多少个块恰好长成这两种边框”。</text>
</svg>
