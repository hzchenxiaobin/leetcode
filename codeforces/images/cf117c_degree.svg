<svg xmlns="http://www.w3.org/2000/svg" width="884" height="360" viewBox="0 0 884 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="117"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="884" height="360" fill="#fafafa"/>
  <text x="442" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">出度降序后检查是否全序</text>
  <text x="442" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">传递竞赛图出度恰为 0..n−1</text>
  <g filter="url(#rough2)"><rect x="88" y="140" width="84" height="50" rx="4" fill="#d7ecd0" fill-opacity="0.55" stroke="#6a9a58" stroke-width="1.3"/></g>
  <text x="130" y="160" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">v1</text>
  <text x="130" y="178" text-anchor="middle" font-size="9.5" fill="#555555" filter="url(#rough2)">出度 5</text>
  <g filter="url(#rough2)"><rect x="218" y="140" width="84" height="50" rx="4" fill="#d7ecd0" fill-opacity="0.55" stroke="#6a9a58" stroke-width="1.3"/></g>
  <text x="260" y="160" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">v2</text>
  <text x="260" y="178" text-anchor="middle" font-size="9.5" fill="#555555" filter="url(#rough2)">出度 4</text>
  <g filter="url(#rough2)"><rect x="348" y="140" width="84" height="50" rx="4" fill="#d7ecd0" fill-opacity="0.55" stroke="#6a9a58" stroke-width="1.3"/></g>
  <text x="390" y="160" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">v3</text>
  <text x="390" y="178" text-anchor="middle" font-size="9.5" fill="#555555" filter="url(#rough2)">出度 3</text>
  <g filter="url(#rough2)"><rect x="478" y="140" width="84" height="50" rx="4" fill="#d7ecd0" fill-opacity="0.55" stroke="#6a9a58" stroke-width="1.3"/></g>
  <text x="520" y="160" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">v4</text>
  <text x="520" y="178" text-anchor="middle" font-size="9.5" fill="#555555" filter="url(#rough2)">出度 2</text>
  <g filter="url(#rough2)"><rect x="608" y="140" width="84" height="50" rx="4" fill="#d7ecd0" fill-opacity="0.55" stroke="#6a9a58" stroke-width="1.3"/></g>
  <text x="650" y="160" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">v5</text>
  <text x="650" y="178" text-anchor="middle" font-size="9.5" fill="#555555" filter="url(#rough2)">出度 1</text>
  <g filter="url(#rough2)"><rect x="718" y="140" width="84" height="50" rx="4" fill="#d7ecd0" fill-opacity="0.55" stroke="#6a9a58" stroke-width="1.3"/></g>
  <text x="760" y="160" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">v6</text>
  <text x="760" y="178" text-anchor="middle" font-size="9.5" fill="#555555" filter="url(#rough2)">出度 0</text>
  <text x="442" y="232" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">所有边从左指向右 → 传递 → 无三元环 → −1</text>
  <text x="442" y="264" text-anchor="middle" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">否则存在 i&lt;j 且 v_j→v_i；必有 k 使 v_i→k、k→v_j（否则出度矛盾）</text>
  <text x="442" y="300" text-anchor="middle" font-size="12" fill="#3d6b2f" font-weight="bold" filter="url(#rough2)">三元环 v_i→k→v_j→v_i，O(n²)</text>
</svg>
