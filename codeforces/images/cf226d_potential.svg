<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="400" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">势函数：翻转负的行/列会让总和 S 严格增大</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">行的和为 r &lt; 0 时翻转，S 增加 −2r ≥ 2；而 |S| ≤ Σ|aᵢⱼ| ≤ 10⁶</text>
  <text x="140" y="110" text-anchor="start" font-size="12" fill="#555555" filter="url(#rough2)">S 的变化范围</text>
  <g filter="url(#rough2)"><line x1="160" y1="150" x2="700" y2="150" stroke="#888888" stroke-width="1.5" marker-end="url(#arrb)"/></g>
  <g filter="url(#rough2)"><line x1="160" y1="150" x2="160" y2="120" stroke="#888888" stroke-width="1.2"/></g>
  <text x="160" y="172" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">−Σ</text>
  <text x="700" y="172" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">+Σ</text>
  <g filter="url(#rough2)"><line x1="320" y1="142" x2="320" y2="158" stroke="#a0522d" stroke-width="1.6"/></g>
  <text x="320" y="132" text-anchor="middle" font-size="11" fill="#a0522d" filter="url(#rough2)">S₀</text>
  <g filter="url(#rough2)"><line x1="420" y1="142" x2="420" y2="158" stroke="#a0522d" stroke-width="1.6"/></g>
  <text x="420" y="132" text-anchor="middle" font-size="11" fill="#a0522d" filter="url(#rough2)">S₁</text>
  <g filter="url(#rough2)"><line x1="520" y1="142" x2="520" y2="158" stroke="#a0522d" stroke-width="1.6"/></g>
  <text x="520" y="132" text-anchor="middle" font-size="11" fill="#a0522d" filter="url(#rough2)">S₂</text>
  <g filter="url(#rough2)"><line x1="620" y1="142" x2="620" y2="158" stroke="#a0522d" stroke-width="1.6"/></g>
  <text x="620" y="132" text-anchor="middle" font-size="11" fill="#a0522d" filter="url(#rough2)">…</text>
  <g filter="url(#rough2)"><path d="M 320 120 Q 370 90 420 120 Q 470 90 520 120" fill="none" stroke="#a0522d" stroke-width="1.4" stroke-dasharray="4 3" stroke-linejoin="round"/></g>
  <text x="420" y="100" text-anchor="middle" font-size="11" fill="#a0522d" filter="url(#rough2)">每步至少 +2</text>
  <g filter="url(#rough2)"><rect x="90" y="200" width="320" height="110" rx="4" fill="#f7fbf4" fill-opacity="0.85" stroke="#a8c99a" stroke-width="1.3"/></g>
  <text x="250" y="224" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3d6b2f" filter="url(#rough2)">终止性</text>
  <text x="250" y="252" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">S 是严格递增的整数</text>
  <text x="250" y="276" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">且始终在 [−Σ, Σ] 内</text>
  <text x="250" y="298" text-anchor="middle" font-size="11.5" fill="#3d6b2f" filter="url(#rough2)">⇒ 至多 Σ/2 次翻转</text>
  <g filter="url(#rough2)"><rect x="440" y="200" width="320" height="110" rx="4" fill="#fdf6f4" fill-opacity="0.85" stroke="#d8a89a" stroke-width="1.3"/></g>
  <text x="600" y="224" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a4b2a" filter="url(#rough2)">停机即合法</text>
  <text x="600" y="252" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">循环只在"存在负行和或负列和"时</text>
  <text x="600" y="276" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">继续；停下来就说明全部非负</text>
  <text x="600" y="298" text-anchor="middle" font-size="11.5" fill="#8a4b2a" filter="url(#rough2)">⇒ 满足题目要求</text>
  <text x="420" y="352" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">输出只需记录每行/每列翻转次数的奇偶性（下标互不相同）</text>
  <text x="420" y="378" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">总复杂度 O(Σ·max(n,m))，本题 Σ ≤ 10⁶，实测毫秒级</text>
</svg>
