<svg xmlns="http://www.w3.org/2000/svg" width="740" height="360" viewBox="0 0 740 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="211"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="740" height="360" fill="#fafafa"/>
  <text x="370" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">固定“在哪买、在哪卖”后，每种商品只剩一个单位利润</text>
  <path d="M 170 46 Q 370 52 570 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="80" y="74" text-anchor="start" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">Venus 买（a）</text>
  <text x="300" y="74" text-anchor="start" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">Earth 卖（b）</text>
  <text x="470" y="74" text-anchor="start" font-size="11" font-weight="bold" fill="#8a6015" filter="url(#rough2)">单位利润 b−a</text>
  <text x="610" y="74" text-anchor="start" font-size="11" font-weight="bold" fill="#555" filter="url(#rough2)">Venus 库存</text>
  <text x="60" y="116" text-anchor="start" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">商品 1</text>
  <rect x="150" y="92" width="80" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="190" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">6</text>
  <path d="M 238 109 L 288 109" stroke="#446688" stroke-width="1.4" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="300" y="92" width="80" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="340" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">9</text>
  <rect x="470" y="92" width="100" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="520" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">+3</text>
  <text x="640" y="116" text-anchor="middle" font-size="12" font-weight="normal" fill="#555" filter="url(#rough2)">3</text>
  <text x="60" y="172" text-anchor="start" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">商品 2</text>
  <rect x="150" y="148" width="80" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="190" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">7</text>
  <path d="M 238 165 L 288 165" stroke="#446688" stroke-width="1.4" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="300" y="148" width="80" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="340" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">6</text>
  <rect x="470" y="148" width="100" height="34" rx="6" fill="#fdecea" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="520" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">−1</text>
  <text x="640" y="172" text-anchor="middle" font-size="12" font-weight="normal" fill="#555" filter="url(#rough2)">5</text>
  <text x="60" y="228" text-anchor="start" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">商品 3</text>
  <rect x="150" y="204" width="80" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="190" y="228" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">8</text>
  <path d="M 238 221 L 288 221" stroke="#446688" stroke-width="1.4" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="300" y="204" width="80" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="340" y="228" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">9</text>
  <rect x="470" y="204" width="100" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="520" y="228" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">+1</text>
  <text x="640" y="228" text-anchor="middle" font-size="12" font-weight="normal" fill="#555" filter="url(#rough2)">10</text>
  <rect x="60" y="278" width="620" height="60" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="74" y="302" text-anchor="start" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">利润只由“买星球 / 卖星球”这一对决定；同一种商品每件利润相同。</text>
  <text x="74" y="322" text-anchor="start" font-size="11" font-weight="normal" fill="#7a5a1b" filter="url(#rough2)">所以 n² 对星球各做一次“带库存上限的分数背包”，就能覆盖全部合法方案。</text>
</svg>
