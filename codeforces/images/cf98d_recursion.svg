<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="995"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="330" fill="#fafafa"/>
  <text x="360.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">P(T) 的搬运结构（底组 m ≥ 2）</text>
  <path d="M 115.2 42 Q 360.0 48 604.8 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="30" y="80" width="124" height="92" rx="8" fill="#dfe8f3" stroke="#5a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="92" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#555555" filter="url(#rough2)">1</text>
  <text x="92" y="130" text-anchor="middle" font-size="10.5" fill="#333333" filter="url(#rough2)">① 把 H 搬到 3 号柱</text>
  <text x="92" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#8c2f2c" filter="url(#rough2)">P(H)</text>
  <line x1="156.0" y1="126.0" x2="164.0" y2="126.0" stroke="#5a5a5a" stroke-width="1.3" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <rect x="168" y="80" width="124" height="92" rx="8" fill="#eef5ea" stroke="#8a6015" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#555555" filter="url(#rough2)">2</text>
  <text x="230" y="130" text-anchor="middle" font-size="10.5" fill="#333333" filter="url(#rough2)">② 底组颠倒搬到 2 号柱</text>
  <text x="230" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#8c2f2c" filter="url(#rough2)">m</text>
  <line x1="294.0" y1="126.0" x2="302.0" y2="126.0" stroke="#5a5a5a" stroke-width="1.3" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <rect x="306" y="80" width="124" height="92" rx="8" fill="#dfe8f3" stroke="#5a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="368" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#555555" filter="url(#rough2)">3</text>
  <text x="368" y="130" text-anchor="middle" font-size="10.5" fill="#333333" filter="url(#rough2)">③ 把 H 搬回 1 号柱</text>
  <text x="368" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#8c2f2c" filter="url(#rough2)">F(H)</text>
  <line x1="432.0" y1="126.0" x2="440.0" y2="126.0" stroke="#5a5a5a" stroke-width="1.3" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <rect x="444" y="80" width="124" height="92" rx="8" fill="#eef5ea" stroke="#8a6015" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="506" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#555555" filter="url(#rough2)">4</text>
  <text x="506" y="130" text-anchor="middle" font-size="10.5" fill="#333333" filter="url(#rough2)">④ 底组颠倒搬到 3 号柱</text>
  <text x="506" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#8c2f2c" filter="url(#rough2)">m</text>
  <line x1="570.0" y1="126.0" x2="578.0" y2="126.0" stroke="#5a5a5a" stroke-width="1.3" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <rect x="582" y="80" width="124" height="92" rx="8" fill="#dfe8f3" stroke="#5a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="644" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#555555" filter="url(#rough2)">5</text>
  <text x="644" y="130" text-anchor="middle" font-size="10.5" fill="#333333" filter="url(#rough2)">⑤ 把 H 搬到 3 号柱</text>
  <text x="644" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#8c2f2c" filter="url(#rough2)">F(H)</text>
  <rect x="30" y="190" width="660" height="52" rx="9" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="212" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">P(T) = P(H) + 2m + 2·F(H)</text>
  <text x="360" y="233" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">F(T) = m + 2·F(H)（只做 ①②⑤ 的两趟版本，底组只颠倒一次）</text>
  <rect x="30" y="256" width="660" height="50" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="360" y="277" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">底组 m = 1 时没有"颠倒"：P(T) = F(T) = 1 + 2·F(H)</text>
  <text x="360" y="296" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">最顶组：P = 2m−1，F = m</text>
  <text x="360" y="318" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">答案 = P(整座塔)，按"从最顶组往下"递推</text>
</svg>
