<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="780" height="400" fill="#fafafa"/>
  <text x="390.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">196E：多源 Dijkstra 求“到最近传送门”，再用候选边做 Kruskal</text>
  <path d="M 110.37000000000012 46 Q 390.0 52 669.6299999999999 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60.0" y="70.0" width="660.0" height="56.0" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="94.0" text-anchor="start" font-size="10.9" fill="#33506e" filter="url(#rough2)">① 以所有传送门为源跑 Dijkstra：d[v] = 到最近传送门的距离，owner[v] = 那个传送门。</text>
  <text x="74.0" y="116.0" text-anchor="start" font-size="10.9" fill="#33506e" filter="url(#rough2)">② 每条原边 (u,v,w) 给出候选边 (owner[u], owner[v]) 权重 d[u]+w+d[v]。</text>
  <rect x="60.0" y="146.0" width="660.0" height="56.0" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="170.0" text-anchor="start" font-size="10.9" fill="#2f5b34" filter="url(#rough2)">③ 对 k 个传送门做 Kruskal 得到 MST 权重 W（这些候选边足以给出度量闭包的 MST）。</text>
  <text x="74.0" y="192.0" text-anchor="start" font-size="11.2" font-weight="bold" fill="#2f5b34" filter="url(#rough2)">④ 答案 = W + d[起点 1]。</text>
  <rect x="60.0" y="222.0" width="650.0" height="32.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="68.0" y="247.0" text-anchor="start" font-size="10.8" font-weight="bold" fill="#26405c" filter="url(#rough2)">样例</text>
  <text x="138.0" y="247.0" text-anchor="start" font-size="10.8" font-weight="bold" fill="#26405c" filter="url(#rough2)">W（传送门 MST）</text>
  <text x="358.0" y="247.0" text-anchor="start" font-size="10.8" font-weight="bold" fill="#26405c" filter="url(#rough2)">d[1]</text>
  <text x="558.0" y="247.0" text-anchor="start" font-size="10.8" font-weight="bold" fill="#26405c" filter="url(#rough2)">答案</text>
  <path d="M 60.0 222.0 L 710.0 222.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="68.0" y="279.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="138.0" y="279.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">1+1=2</text>
  <text x="358.0" y="279.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">0（1 是传送门）</text>
  <text x="558.0" y="279.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <path d="M 60.0 254.0 L 710.0 254.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="68.0" y="311.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="138.0" y="311.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">5+10=15</text>
  <text x="358.0" y="311.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="558.0" y="311.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">16</text>
  <path d="M 60.0 286.0 L 710.0 286.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="68.0" y="343.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="138.0" y="343.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">3×10⁹</text>
  <text x="358.0" y="343.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="558.0" y="343.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">3×10⁹</text>
  <path d="M 60.0 318.0 L 710.0 318.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="60.0" y="372.0" text-anchor="start" font-size="10.6" fill="#6b6b6b" filter="url(#rough2)">为什么是 MST：走过的路必须连通“起点 + 所有传送门”（传送只在已开传送门之间生效并且免费）。</text>
</svg>
