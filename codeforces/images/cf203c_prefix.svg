<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="340" fill="#fafafa"/>
  <text x="380.0" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">203C：把客户按花费排序后取前缀</text>
  <path d="M 152.00 46 Q 380.0 52 608.00 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="72" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">每个客户只贡献一个标量代价 w_i = a·x_i + b·y_i，</text>
  <text x="60" y="92" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">相机只看“总占用 ≤ d”，与客户先后顺序无关。</text>
  <text x="60" y="118" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">按 w_i 升序排队，从左往右尽量装：</text>
  <rect x="70" y="140" width="62" height="40" rx="6" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="101.0" y="166" text-anchor="middle" font-size="13" fill="#2f5b34" filter="url(#rough2)">3</text>
  <rect x="142" y="140" width="62" height="40" rx="6" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="173.0" y="166" text-anchor="middle" font-size="13" fill="#2f5b34" filter="url(#rough2)">5</text>
  <rect x="214" y="140" width="62" height="40" rx="6" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="245.0" y="166" text-anchor="middle" font-size="13" fill="#2f5b34" filter="url(#rough2)">7</text>
  <rect x="286" y="140" width="62" height="40" rx="6" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="317.0" y="166" text-anchor="middle" font-size="13" fill="#2f5b34" filter="url(#rough2)">9</text>
  <rect x="358" y="140" width="62" height="40" rx="6" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="389.0" y="166" text-anchor="middle" font-size="13" fill="#2f5b34" filter="url(#rough2)">12</text>
  <rect x="430" y="140" width="62" height="40" rx="6" fill="#fdeef1" stroke="#c0708a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="461.0" y="166" text-anchor="middle" font-size="13" fill="#8a3a52" filter="url(#rough2)">15</text>
  <rect x="502" y="140" width="62" height="40" rx="6" fill="#fdeef1" stroke="#c0708a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="533.0" y="166" text-anchor="middle" font-size="13" fill="#8a3a52" filter="url(#rough2)">20</text>
  <rect x="574" y="140" width="62" height="40" rx="6" fill="#fdeef1" stroke="#c0708a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="605.0" y="166" text-anchor="middle" font-size="13" fill="#8a3a52" filter="url(#rough2)">26</text>
  <text x="70" y="202" text-anchor="start" font-size="10.5" fill="#2f5b34" filter="url(#rough2)">选中的前缀：3+5+7+9+12 = 36 ≤ d = 40</text>
  <text x="70" y="222" text-anchor="start" font-size="10.5" fill="#8a3a52" filter="url(#rough2)">再加 15 会变成 51 > 40 ⇒ 服务 5 个客户</text>
  <path d="M 425 126 L 425 186" stroke="#8a3a52" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <rect x="60" y="252" width="640" height="66" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="270" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">若把某个被选中的客户换成更贵的客户，总花费只增不减，人数不变差；</text>
  <text x="74" y="292" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">所以“按 w 升序取最长可行前缀”已经是人数最多的方案。</text>
</svg>
