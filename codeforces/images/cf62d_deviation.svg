<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430">
<defs>
  <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs>
<rect x="0" y="0" width="760" height="430" fill="#fafafa"/>
<text x="380.0" y="34" font-size="22" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="bold" text-anchor="middle" filter="url(#rough2)">在尽量靠右的位置把下一个房间换大，然后贪心补完</text>
<rect x="60" y="100" width="70" height="50" rx="8" fill="#e8f0fe" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="95.0" y="130.25" font-size="15" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">1</text>
<rect x="155" y="100" width="70" height="50" rx="8" fill="#e8f0fe" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="190.0" y="130.25" font-size="15" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">2</text>
<rect x="250" y="100" width="70" height="50" rx="8" fill="#e8f0fe" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="285.0" y="130.25" font-size="15" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">3</text>
<rect x="345" y="100" width="70" height="50" rx="8" fill="#e8f0fe" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="380.0" y="130.25" font-size="15" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">4</text>
<rect x="440" y="100" width="70" height="50" rx="8" fill="#e8f0fe" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="475.0" y="130.25" font-size="15" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">5</text>
<rect x="535" y="100" width="70" height="50" rx="8" fill="#e8f0fe" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="570.0" y="130.25" font-size="15" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">6</text>
<rect x="630" y="100" width="70" height="50" rx="8" fill="#e8f0fe" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="665.0" y="130.25" font-size="15" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">7</text>
<text x="60" y="80" font-size="13" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="normal" text-anchor="start" filter="url(#rough2)">旧回路 p[0..m]</text>
<rect x="440" y="94" width="80" height="62" rx="10" fill="#ffffff" stroke="#1a5fb4" stroke-width="2" filter="url(#rough2)"/>
<text x="480" y="84" font-size="12" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#1a5fb4" font-weight="normal" text-anchor="middle" filter="url(#rough2)">偏差位置 i</text>
<text x="60" y="200" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#c0392b" font-weight="normal" text-anchor="start" filter="url(#rough2)">在位置 i 选一个比旧 p[i] 大的邻居 v（边未用过）</text>
<text x="60" y="232" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#2e7d32" font-weight="normal" text-anchor="start" filter="url(#rough2)">之后从 v 出发，每一步选最小的“非桥”边，贪心补完</text>
<text x="60" y="264" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#1a5fb4" font-weight="normal" text-anchor="start" filter="url(#rough2)">若该位置无解，就向左退一步再试</text>
<text x="60" y="320" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="normal" text-anchor="start" filter="url(#rough2)">为什么从右往左：公共前缀越长，字典序越小；同位置则 v 越小越好</text>
</svg>
