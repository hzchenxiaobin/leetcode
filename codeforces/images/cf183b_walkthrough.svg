<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="107"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">183B 样例 1：每个望远镜最多看到的数量 3+2+1+3+2 = 11</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="48.0" y="94.0" width="84.0" height="40.0" fill="#ffffff" stroke="#dddddd" stroke-width="1.1" rx="6" filter="url(#rough2)"/>
  <text x="90.0" y="121.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">望远镜 t</text>
  <rect x="153.0" y="94.0" width="84.0" height="40.0" fill="#ffffff" stroke="#dddddd" stroke-width="1.1" rx="6" filter="url(#rough2)"/>
  <text x="195.0" y="121.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="258.0" y="94.0" width="84.0" height="40.0" fill="#ffffff" stroke="#dddddd" stroke-width="1.1" rx="6" filter="url(#rough2)"/>
  <text x="300.0" y="121.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="363.0" y="94.0" width="84.0" height="40.0" fill="#ffffff" stroke="#dddddd" stroke-width="1.1" rx="6" filter="url(#rough2)"/>
  <text x="405.0" y="121.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="468.0" y="94.0" width="84.0" height="40.0" fill="#ffffff" stroke="#dddddd" stroke-width="1.1" rx="6" filter="url(#rough2)"/>
  <text x="510.0" y="121.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="573.0" y="94.0" width="84.0" height="40.0" fill="#ffffff" stroke="#dddddd" stroke-width="1.1" rx="6" filter="url(#rough2)"/>
  <text x="615.0" y="121.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="48.0" y="144.0" width="84.0" height="40.0" fill="#ffffff" stroke="#dddddd" stroke-width="1.1" rx="6" filter="url(#rough2)"/>
  <text x="90.0" y="171.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">最多看到</text>
  <rect x="153.0" y="144.0" width="84.0" height="40.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.1" rx="6" filter="url(#rough2)"/>
  <text x="195.0" y="171.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <rect x="258.0" y="144.0" width="84.0" height="40.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.1" rx="6" filter="url(#rough2)"/>
  <text x="300.0" y="171.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <rect x="363.0" y="144.0" width="84.0" height="40.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.1" rx="6" filter="url(#rough2)"/>
  <text x="405.0" y="171.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <rect x="468.0" y="144.0" width="84.0" height="40.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.1" rx="6" filter="url(#rough2)"/>
  <text x="510.0" y="171.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <rect x="573.0" y="144.0" width="84.0" height="40.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.1" rx="6" filter="url(#rough2)"/>
  <text x="615.0" y="171.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="70.0" y="240.0" text-anchor="start" font-size="12" fill="#4a7a3a" filter="url(#rough2)">t=1：过 (2,1),(3,2),(4,3) 的直线 → 3 只</text>
  <text x="70.0" y="270.0" text-anchor="start" font-size="12" fill="#6b4c9a" filter="url(#rough2)">t=4：竖直线 x=4 上有 (4,1),(4,3),(4,4) → 3 只</text>
  <text x="70.0" y="300.0" text-anchor="start" font-size="12" fill="#444" filter="url(#rough2)">其余望远镜各 1–2 只；总和 11，与官方输出一致</text>
  <rect x="40.0" y="336.0" width="640.0" height="44.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="54.0" y="359.0" text-anchor="start" font-size="11" fill="#3f3420" filter="url(#rough2)">对所有「火烈鸟对」求截距、统计同一直线上的火烈鸟数，再对每个 t 取最大</text>
</svg>
