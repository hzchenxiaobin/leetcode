<svg xmlns="http://www.w3.org/2000/svg" width="860" height="392" viewBox="0 0 860 392"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="99"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="860" height="392" fill="#fafafa"/>
  <text x="430" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1：270 250 250 230 250</text>
  <text x="430" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">V = 250；#1 多 20，#4 少 20 → 从 #4 倒 20 到 #1</text>
  <g filter="url(#rough2)"><rect x="120" y="150" width="104" height="58" rx="3" fill="#f6d9d7" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="172.0" y="186" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">270</text>
  <text x="172.0" y="142" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">#1</text>
  <g filter="url(#rough2)"><rect x="240" y="150" width="104" height="58" rx="3" fill="#d7ecd0" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="292.0" y="186" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">250</text>
  <text x="292.0" y="142" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">#2</text>
  <g filter="url(#rough2)"><rect x="360" y="150" width="104" height="58" rx="3" fill="#d7ecd0" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="412.0" y="186" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">250</text>
  <text x="412.0" y="142" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">#3</text>
  <g filter="url(#rough2)"><rect x="480" y="150" width="104" height="58" rx="3" fill="#cfe0f5" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="532.0" y="186" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">230</text>
  <text x="532.0" y="142" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">#4</text>
  <g filter="url(#rough2)"><rect x="600" y="150" width="104" height="58" rx="3" fill="#d7ecd0" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="652.0" y="186" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">250</text>
  <text x="652.0" y="142" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">#5</text>
  <g filter="url(#rough2)"><line x1="122" y1="224" x2="464" y2="224" stroke="#8a2b28" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#arrb)"/></g>
  <text x="292.0" y="246" text-anchor="middle" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">倒 20 ml</text>
  <text x="430" y="290" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">源：体积最少的杯子（#4）；目标：体积最多的杯子（#1）；体积差 20 = 500−480 的一半？</text>
  <text x="430" y="314" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">更直接：v = a[#1] − 250 = 250 − a[#4] = 20</text>
  <text x="430" y="346" text-anchor="middle" font-size="12" fill="#3d6b2f" font-weight="bold" filter="url(#rough2)">输出格式：20 ml. from cup #4 to cup #1.</text>
</svg>
