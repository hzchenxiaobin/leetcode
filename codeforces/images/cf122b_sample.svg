<svg xmlns="http://www.w3.org/2000/svg" width="880" height="270" viewBox="0 0 880 270"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="121"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="270" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例：047 → 4；472747 → 7；16 → -1</text>
  <text x="130" y="120" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">047：'4' 出现 1 次，'7' 出现 1 次 → 取 '4'</text>
  <text x="130" y="156" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">472747：'7' 出现 3 次 &gt; '4' 2 次 → 取 '7'</text>
  <text x="130" y="192" text-anchor="start" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">16：没有 4/7 → -1</text>
</svg>
