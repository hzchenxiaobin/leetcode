<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="660" height="420" fill="#fafafa"/>

  <text x="330" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">把每座塔补到同一个公共高度 H</text>
  <text x="330" y="52" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">例：h = [5, 4, 6, 6, 1]，m = 1，M = 6，取 H = 7</text>

  <!-- 原始塔高 h_i -->
  <rect x="50" y="200" width="44" height="130" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="115" y="226" width="44" height="104" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="180" y="174" width="44" height="156" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="245" y="174" width="44" height="156" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="310" y="304" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <!-- 需要补的 x_i -->
  <rect x="50" y="148" width="44" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="115" y="148" width="44" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="180" y="148" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="245" y="148" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="310" y="148" width="44" height="156" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>

  <!-- 公共高度线 -->
  <path d="M 34 148 L 376 148" stroke="#b85450" stroke-width="2" stroke-dasharray="7 5" fill="none" filter="url(#rough2)"/>
  <text x="382" y="152" font-size="13" fill="#b85450" filter="url(#rough2)">H = 7</text>

  <!-- 基线 -->
  <path d="M 30 330 L 380 330" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="72" y="350" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">5</text>
  <text x="137" y="350" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">4</text>
  <text x="202" y="350" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">6</text>
  <text x="267" y="350" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">6</text>
  <text x="332" y="350" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">1</text>

  <!-- x_i 数值 -->
  <text x="72" y="178" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">2</text>
  <text x="137" y="192" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">3</text>
  <text x="202" y="166" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">1</text>
  <text x="267" y="166" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">1</text>
  <text x="332" y="232" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">6</text>

  <text x="40" y="382" font-size="12" fill="#333" filter="url(#rough2)">蓝 = 原高 h_i，黄/红 = 补上的 x_i = H − h_i，要求 1 ≤ x_i ≤ k</text>

  <!-- 右侧推导框 -->
  <rect x="404" y="86" width="232" height="186" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="420" y="116" font-size="12" fill="#2f5a24" filter="url(#rough2)">x_i ≥ 1 ⇒ H ≥ M + 1</text>
  <text x="420" y="146" font-size="12" fill="#2f5a24" filter="url(#rough2)">x_i ≤ k ⇒ k ≥ H − m</text>
  <text x="420" y="186" font-size="14" fill="#b85450" filter="url(#rough2)">k_min = M − m + 1</text>
  <text x="420" y="214" font-size="11" fill="#3a5a30" filter="url(#rough2)">M = max h，m = min h</text>
  <text x="420" y="238" font-size="11" fill="#3a5a30" filter="url(#rough2)">H 取 M+1 时 k 最小</text>
  <text x="420" y="260" font-size="11" fill="#3a5a30" filter="url(#rough2)">k 至少为 1（x_i ≥ 1）</text>

  <!-- 指向最大 x 的标注 -->
  <path d="M 396 232 L 360 232" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
</svg>
