<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="61"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="860" height="430" fill="#fafafa"/>

  <text x="430" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每个赛段独立挑用时最短的选手</text>
  <text x="430" y="58" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">样例一：4 个赛段、4 名选手，横条是选手覆盖的赛段</text>

  <!-- 赛段列 -->
  <g filter="url(#rough2)">
    <rect x="200" y="80" width="480" height="260" fill="none" stroke="#dddddd" stroke-width="1.2"/>
    <line x1="320" y1="80" x2="320" y2="340" stroke="#dddddd" stroke-width="1.2"/>
    <line x1="440" y1="80" x2="440" y2="340" stroke="#dddddd" stroke-width="1.2"/>
    <line x1="560" y1="80" x2="560" y2="340" stroke="#dddddd" stroke-width="1.2"/>
    <text x="260" y="102" text-anchor="middle" font-size="11.5" fill="#888888">赛段 1</text>
    <text x="380" y="102" text-anchor="middle" font-size="11.5" fill="#888888">赛段 2</text>
    <text x="500" y="102" text-anchor="middle" font-size="11.5" fill="#888888">赛段 3</text>
    <text x="620" y="102" text-anchor="middle" font-size="11.5" fill="#888888">赛段 4</text>
  </g>

  <!-- 选手横条 -->
  <g filter="url(#rough2)">
    <rect x="200" y="118" width="480" height="34" rx="6" fill="#cfe0f5" stroke="#446688" stroke-width="1.5"/>
    <text x="212" y="140" font-size="11.5" fill="#2f4a66">选手 1：t=20, c=5（覆盖 1–4）</text>

    <rect x="200" y="164" width="360" height="34" rx="6" fill="#d9ecd4" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="212" y="186" font-size="11.5" fill="#2f5223">选手 2：t=21, c=10（覆盖 1–3）</text>

    <rect x="440" y="210" width="120" height="34" rx="6" fill="#f6e3c4" stroke="#b58a3a" stroke-width="1.5"/>
    <text x="450" y="232" font-size="11" fill="#7a5a1b">选手 3：t=4, c=30</text>

    <rect x="440" y="256" width="240" height="34" rx="6" fill="#f6d9d7" stroke="#b85450" stroke-width="1.5"/>
    <text x="450" y="278" font-size="11" fill="#8a2b28">选手 4：t=4, c=20（覆盖 3–4）</text>
  </g>

  <!-- 每列胜者 -->
  <g filter="url(#rough2)">
    <path d="M 260 340 L 260 366" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)"/>
    <path d="M 380 340 L 380 366" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)"/>
    <path d="M 500 340 L 500 366" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)"/>
    <path d="M 620 340 L 620 366" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)"/>

    <text x="260" y="384" text-anchor="middle" font-size="11.5" fill="#2f4a66">胜者 1 → 5</text>
    <text x="380" y="384" text-anchor="middle" font-size="11.5" fill="#2f4a66">胜者 1 → 5</text>
    <text x="500" y="384" text-anchor="middle" font-size="11.5" fill="#8a2b28">胜者 3 → 30</text>
    <text x="620" y="384" text-anchor="middle" font-size="11.5" fill="#8a2b28">胜者 4 → 20</text>
    <text x="430" y="412" text-anchor="middle" font-size="12" fill="#8a6015">总收益 5 + 5 + 30 + 20 = 60</text>
  </g>
</svg>
