<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="300" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">统计每个数里 4/7 的个数</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">逐个数字扫一遍，个数 &lt;= k 就计入答案</text>
  <g filter="url(#rough2)"><rect x="120" y="120" width="120" height="50" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="180.0" y="149.68" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">47</text>
  <text x="180" y="200" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">2 个幸运数字</text>
  <g filter="url(#rough2)"><rect x="270" y="120" width="120" height="50" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="330.0" y="149.68" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">123</text>
  <text x="330" y="200" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">0 个幸运数字</text>
  <g filter="url(#rough2)"><rect x="420" y="120" width="120" height="50" rx="4" fill="#f6d9d7" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="480.0" y="149.68" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">4477</text>
  <text x="480" y="200" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">4 个幸运数字</text>
  <text x="440" y="260" text-anchor="middle" font-size="12.5" fill="#b05a5a" filter="url(#rough2)">样例 2：k=2 时 447 不合格（3 &gt; 2）</text>
</svg>
