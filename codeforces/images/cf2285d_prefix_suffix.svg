<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：k 是合法切点 ⟺ 前 k 项和 = 后 k 项和</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">以 a = [2, 5, 1, 4, 3]（n = 5）为例</text>

  <!-- row 1: array a -->
  <text x="134" y="83" text-anchor="end" font-size="12" fill="#666" filter="url(#rough2)">a</text>
  <rect x="150" y="58" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="81" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="212" y="58" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="81" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <rect x="274" y="58" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="302" y="81" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="336" y="58" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="364" y="81" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <rect x="398" y="58" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="426" y="81" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>

  <text x="178" y="106" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">1</text>
  <text x="240" y="106" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">2</text>
  <text x="302" y="106" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">3</text>
  <text x="364" y="106" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">4</text>
  <text x="426" y="106" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">5</text>

  <!-- row 2: prefix sums -->
  <text x="134" y="145" text-anchor="end" font-size="12" fill="#666" filter="url(#rough2)">S_k</text>
  <rect x="150" y="120" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="143" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="212" y="120" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="143" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <rect x="274" y="120" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="302" y="143" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>
  <rect x="336" y="120" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="364" y="143" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">12</text>
  <rect x="398" y="120" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="426" y="143" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">15</text>

  <!-- row 3: suffix sums -->
  <text x="134" y="195" text-anchor="end" font-size="12" fill="#666" filter="url(#rough2)">S*_k</text>
  <rect x="150" y="170" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="193" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="212" y="170" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="193" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <rect x="274" y="170" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="302" y="193" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>
  <rect x="336" y="170" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="364" y="193" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">13</text>
  <rect x="398" y="170" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="426" y="193" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">15</text>

  <path d="M 310 156 L 310 168" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="322" y="167" font-size="10" fill="#4a7a3a" filter="url(#rough2)">从右往左累加</text>

  <!-- row 4: D -->
  <text x="134" y="245" text-anchor="end" font-size="12" fill="#666" filter="url(#rough2)">D_k</text>
  <rect x="150" y="220" width="56" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="178" y="243" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">−1</text>
  <rect x="212" y="220" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="240" y="243" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="274" y="220" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="302" y="243" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="336" y="220" width="56" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="364" y="243" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">−1</text>
  <rect x="398" y="220" width="56" height="34" fill="#eeeeee" stroke="#999999" stroke-width="1.5" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="426" y="243" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">0</text>

  <text x="240" y="270" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="302" y="270" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="178" y="270" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">×</text>
  <text x="364" y="270" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">×</text>
  <text x="426" y="270" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">k=n 恒 0</text>

  <!-- formula box -->
  <rect x="40" y="286" width="540" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="310" y="310" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">D_k = S_k − S*_k = S_k + S_{n−k} − T ，且 D_{n−k} = D_k ，D_0 = D_n = 0</text>
  <text x="310" y="334" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">切点只能取在 k ∈ [1, n−1]：D_k = 0 即可选</text>

  <text x="310" y="376" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">合法切点 g = 2（k = 2, 3）；m = 2 时答案 = C(g, m−1) = C(2,1) = 2</text>
  <text x="310" y="398" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">任取 m−1 个合法切点从小到大排列，就唯一确定一个划分 p</text>
</svg>
