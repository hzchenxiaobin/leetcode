<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="79"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="330" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">平方数模 4 只有 0 和 1，所以 a²+b² 永远不等于 3 mod 4</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">于是「能否写成两平方和」对素数而言只剩一个判定：p = 2 或 p ≡ 1 (mod 4)</text>
  <text x="200" y="100" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">a 的奇偶 → a² mod 4</text>
  <g filter="url(#rough2)"><rect x="60" y="120" width="120" height="32" rx="4" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="120" y="142" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">a 偶</text>
  <text x="205" y="142" text-anchor="middle" font-size="13" fill="#666666" filter="url(#rough2)">⇒</text>
  <g filter="url(#rough2)"><rect x="230" y="120" width="90" height="32" rx="4" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="275" y="142" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)"><rect x="60" y="162" width="120" height="32" rx="4" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="120" y="184" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">a 奇</text>
  <text x="205" y="184" text-anchor="middle" font-size="13" fill="#666666" filter="url(#rough2)">⇒</text>
  <g filter="url(#rough2)"><rect x="230" y="162" width="90" height="32" rx="4" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="275" y="184" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="200" y="230" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">组合 a²+b² 的余数</text>
  <g filter="url(#rough2)"><rect x="55" y="248" width="84" height="46" rx="4" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="97" y="268" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">0+0</text>
  <text x="97" y="286" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)"><rect x="147" y="248" width="84" height="46" rx="4" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="189" y="268" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">0+1</text>
  <text x="189" y="286" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="239" y="248" width="84" height="46" rx="4" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="281" y="268" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">1+1</text>
  <text x="281" y="286" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="331" y="248" width="84" height="46" rx="4" fill="#f3d9d6" fill-opacity="0.85" stroke="#8a2b28" stroke-width="1.4"/></g>
  <text x="373" y="268" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">余 3</text>
  <text x="373" y="286" text-anchor="middle" font-size="11" fill="#8a2b28" filter="url(#rough2)">无解</text>
  <g filter="url(#rough2)"><rect x="470" y="96" width="400" height="200" rx="6" fill="#ffffff" fill-opacity="0.4" stroke="#cccccc" stroke-width="1.4" stroke-dasharray="5 4"/></g>
  <text x="670" y="120" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">结论（对素数 p）</text>
  <text x="490" y="150" text-anchor="start" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">p ≡ 3 (mod 4)：一定不能写成 a²+b²</text>
  <text x="490" y="178" text-anchor="start" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">p ≡ 1 (mod 4)：一定能（Fermat 两平方和定理）</text>
  <text x="490" y="206" text-anchor="start" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">p = 2：2 = 1² + 1²，也能</text>
  <text x="490" y="240" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">所以本题 = 数区间内的素数，</text>
  <text x="490" y="262" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">只把 2 与 ≡ 1 (mod 4) 的那些计入答案</text>
  <text x="450" y="320" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">反方向（1 mod 4 一定能表示）是 Fermat 定理，正文第 4 节给了完整证明</text>
</svg>
