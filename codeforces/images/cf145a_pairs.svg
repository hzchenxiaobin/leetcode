<svg xmlns="http://www.w3.org/2000/svg" width="700" height="260" viewBox="0 0 700 260"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1447"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="700" height="260" fill="#fafafa"/>
  <text x="350.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两种错位配对</text>
  <path d="M 112.0 42 Q 350.0 48 588.0 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="350.0" y="246" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">交换修一对，剩下的逐个取反</text>
  <text x="200" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#8c2f2c" filter="url(#rough2)">a = 4 7 4 7 7</text>
  <text x="200" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#335478" filter="url(#rough2)">b = 7 4 4 4 4</text>
  <text x="200" y="150" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">x=1（4→7）, y=3（7→4）</text>
  <text x="340" y="80" text-anchor="middle" font-size="18" fill="#333333" filter="url(#rough2)">⇒</text>
  <rect x="420" y="60" width="240" height="110" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="540" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">1 次交换修 2 处</text>
  <text x="540" y="118" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">剩 2 处逐个取反</text>
  <text x="540" y="146" text-anchor="middle" font-size="12" font-weight="bold" fill="#8c2f2c" filter="url(#rough2)">答案 = max(x,y)</text>
  <text x="350" y="215" text-anchor="middle" font-size="11.5" fill="#335478" filter="url(#rough2)">样例 3：x=0,y=3 → 3</text>
</svg>
