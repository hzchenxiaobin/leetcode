<svg xmlns="http://www.w3.org/2000/svg" width="700" height="270" viewBox="0 0 700 270"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="703"/>
    <feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></defs>
  <rect width="700" height="270" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2 走查：".RRRLLLLL.."（n=11）</text>
  <path d="M 170 40 Q 350 46 530 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="66" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="12.5" fill="#22314a" filter="url(#rough2)">R 在 2..4（B=4），L 在 5..9（C=9），A=2</text>
  <text x="76" y="106" font-size="12.5" fill="#22314a" filter="url(#rough2)">按公式：s=A=2，t=B+1=5 ⇒ (2,5)</text>
  <g filter="url(#rough2)"><rect x="60" y="134" width="580" height="86" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="158" font-size="12.5" fill="#2f5223" filter="url(#rough2)">走法：2→3→4→…→9（沿路留下 R@2..8），再 9→8→7→6→5（留下 L@9..5）。</text>
  <text x="76" y="182" font-size="12.5" fill="#2f5223" filter="url(#rough2)">最终：2,3,4 的最后一次离开是「向右」⇒ R；5..9 是「向左」⇒ L ✓</text>
  <text x="76" y="206" font-size="12" fill="#3c5e2e" filter="url(#rough2)">正好是 ".RRRLLLLL.." ✓（官方样例给的是 (7,5)，也合法）</text>
  <g filter="url(#rough2)"><rect x="60" y="232" width="580" height="30" rx="6" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.2"/></g>
  <text x="76" y="252" font-size="12" fill="#8a6015" filter="url(#rough2)">O(n) 扫描求出 A、B、C 即可。</text>
</svg>
