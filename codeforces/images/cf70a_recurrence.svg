<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2b2b2b"/>
    </marker>
  </defs>

  <rect width="760" height="420" fill="#fafafa"/>
  <text x="380" y="30" text-anchor="middle" font-size="17.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">下三角 L_s 放一块 s/2 的曲奇后，恰好裂成 3 个互不相接的 L_{s/2}</text>
  <path d="M 60 40 Q 380 46 700 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 8x8 网格，cell 26，原点 (48,70) -->
  <g filter="url(#rough2)" stroke="#8a8a8a" stroke-width="0.5">
    <!-- A：行 1..3 -->
    <rect x="74"  y="96"  width="26" height="26" fill="#cfe3f7"/>
    <rect x="74"  y="122" width="26" height="26" fill="#cfe3f7"/>
    <rect x="100" y="122" width="26" height="26" fill="#cfe3f7"/>
    <rect x="74"  y="148" width="26" height="26" fill="#cfe3f7"/>
    <rect x="100" y="148" width="26" height="26" fill="#cfe3f7"/>
    <rect x="126" y="148" width="26" height="26" fill="#cfe3f7"/>
    <!-- 已放的 4 曲奇：行 4..7、列 0..3、c>=r-4 -->
    <rect x="48"  y="174" width="26" height="26" fill="#c9cdd4"/>
    <rect x="74"  y="174" width="26" height="26" fill="#c9cdd4"/>
    <rect x="100" y="174" width="26" height="26" fill="#c9cdd4"/>
    <rect x="126" y="174" width="26" height="26" fill="#c9cdd4"/>
    <rect x="74"  y="200" width="26" height="26" fill="#c9cdd4"/>
    <rect x="100" y="200" width="26" height="26" fill="#c9cdd4"/>
    <rect x="126" y="200" width="26" height="26" fill="#c9cdd4"/>
    <rect x="100" y="226" width="26" height="26" fill="#c9cdd4"/>
    <rect x="126" y="226" width="26" height="26" fill="#c9cdd4"/>
    <rect x="126" y="252" width="26" height="26" fill="#c9cdd4"/>
    <!-- B：行 4..7、列 0..r-5 -->
    <rect x="48"  y="200" width="26" height="26" fill="#d7ecd9"/>
    <rect x="48"  y="226" width="26" height="26" fill="#d7ecd9"/>
    <rect x="74"  y="226" width="26" height="26" fill="#d7ecd9"/>
    <rect x="48"  y="252" width="26" height="26" fill="#d7ecd9"/>
    <rect x="74"  y="252" width="26" height="26" fill="#d7ecd9"/>
    <rect x="100" y="252" width="26" height="26" fill="#d7ecd9"/>
    <!-- C：行 4..7、列 4..r-1 -->
    <rect x="152" y="200" width="26" height="26" fill="#f7dfd0"/>
    <rect x="152" y="226" width="26" height="26" fill="#f7dfd0"/>
    <rect x="178" y="226" width="26" height="26" fill="#f7dfd0"/>
    <rect x="152" y="252" width="26" height="26" fill="#f7dfd0"/>
    <rect x="178" y="252" width="26" height="26" fill="#f7dfd0"/>
    <rect x="204" y="252" width="26" height="26" fill="#f7dfd0"/>
  </g>
  <rect x="48" y="70" width="208" height="208" fill="none" stroke="#2b2b2b" stroke-width="1.8" filter="url(#rough2)"/>
  <g font-size="12" fill="#2b2b2b" filter="url(#rough2)">
    <text x="88" y="112" font-size="11" fill="#2f4a66">A</text>
    <text x="56" y="192" font-size="11" fill="#1f5226">B</text>
    <text x="166" y="244" font-size="11" fill="#8c2f2b">C</text>
    <text x="100" y="196" font-size="10.5" fill="#3a3a3a">已放</text>
    <text x="100" y="208" font-size="10.5" fill="#3a3a3a">4 曲奇</text>
    <text x="152" y="296" text-anchor="middle" font-size="11.5" fill="#555">L_8（s = 8，图中 8×8 的下三角）</text>
  </g>

  <!-- 右侧：三个 L_4 -->
  <g filter="url(#rough2)" stroke="#8a8a8a" stroke-width="0.5">
    <!-- A' -->
    <g>
      <rect x="300" y="108" width="22" height="22" fill="#cfe3f7"/>
      <rect x="300" y="130" width="22" height="22" fill="#cfe3f7"/>
      <rect x="322" y="130" width="22" height="22" fill="#cfe3f7"/>
      <rect x="300" y="152" width="22" height="22" fill="#cfe3f7"/>
      <rect x="322" y="152" width="22" height="22" fill="#cfe3f7"/>
      <rect x="344" y="152" width="22" height="22" fill="#cfe3f7"/>
    </g>
    <!-- B' -->
    <g>
      <rect x="440" y="108" width="22" height="22" fill="#d7ecd9"/>
      <rect x="440" y="130" width="22" height="22" fill="#d7ecd9"/>
      <rect x="462" y="130" width="22" height="22" fill="#d7ecd9"/>
      <rect x="440" y="152" width="22" height="22" fill="#d7ecd9"/>
      <rect x="462" y="152" width="22" height="22" fill="#d7ecd9"/>
      <rect x="484" y="152" width="22" height="22" fill="#d7ecd9"/>
    </g>
    <!-- C' -->
    <g>
      <rect x="580" y="108" width="22" height="22" fill="#f7dfd0"/>
      <rect x="580" y="130" width="22" height="22" fill="#f7dfd0"/>
      <rect x="602" y="130" width="22" height="22" fill="#f7dfd0"/>
      <rect x="580" y="152" width="22" height="22" fill="#f7dfd0"/>
      <rect x="602" y="152" width="22" height="22" fill="#f7dfd0"/>
      <rect x="624" y="152" width="22" height="22" fill="#f7dfd0"/>
    </g>
  </g>
  <g font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">
    <text x="322" y="196" text-anchor="middle" font-size="13" font-weight="bold">区域 A ≅ L_4</text>
    <text x="462" y="196" text-anchor="middle" font-size="13" font-weight="bold">区域 B ≅ L_4</text>
    <text x="602" y="196" text-anchor="middle" font-size="13" font-weight="bold">区域 C ≅ L_4</text>
    <text x="380" y="222" text-anchor="middle" font-size="12" fill="#555">三块全等、互不跨越，且中间隔着已放的格子</text>
  </g>

  <path d="M 182 272 Q 260 240 336 214" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#ar2)" filter="url(#rough2)"/>
  <path d="M 200 280 Q 330 260 470 214" stroke="#2f7a3a" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#ar2)" filter="url(#rough2)"/>
  <path d="M 214 288 Q 400 290 600 212" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#ar2)" filter="url(#rough2)"/>

  <rect x="40" y="312" width="690" height="86" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="338" font-size="13.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">递推：g(s) = 3 · g(s/2)，g(2) = 1  ⟹  g(2^k) = 3^(k-1)</text>
  <text x="60" y="362" font-size="12" fill="#7a5a1b" filter="url(#rough2)">n ≥ 1 时第一次放的是边长 2^n 的曲奇，余下 L_{2^n}，所以答案 = g(2^n) = 3^(n-1)。</text>
  <text x="60" y="384" font-size="12" fill="#7a5a1b" filter="url(#rough2)">n = 0 的盒子只有 1×1 一格，最小的饼干是 2×2，放不下，答案单独为 1。</text>
</svg>
