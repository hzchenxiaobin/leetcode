<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="179"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="760" height="400" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">10 个三元组逐一检查：相识边数 ∈ {0, 3} 就是 WIN</text>
  <path d="M 152 39 Q 380 45 608 39" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="40" y="60" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">样例 1（m = 4：1-3、2-3、1-4、5-3）</text>
  <rect x="40" y="74" width="136" height="42" rx="5" fill="#ffffff" stroke="#d6d6d6" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="52" y="101" text-anchor="start" font-size="12" fill="#7a7a7a" filter="url(#rough2)">(1,2,3)</text>
  <text x="140" y="101" text-anchor="start" font-size="10.5" fill="#9b9b9b" filter="url(#rough2)">边数 2</text>
  <rect x="184" y="74" width="136" height="42" rx="5" fill="#ffffff" stroke="#d6d6d6" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="196" y="101" text-anchor="start" font-size="12" fill="#7a7a7a" filter="url(#rough2)">(1,2,4)</text>
  <text x="284" y="101" text-anchor="start" font-size="10.5" fill="#9b9b9b" filter="url(#rough2)">边数 1</text>
  <rect x="328" y="74" width="136" height="42" rx="5" fill="#e9f4ec" stroke="#3f6b4a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="340" y="101" text-anchor="start" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">(1,2,5)</text>
  <text x="428" y="101" text-anchor="start" font-size="10.5" fill="#3f6b4a" filter="url(#rough2)">边数 0</text>
  <rect x="472" y="74" width="136" height="42" rx="5" fill="#ffffff" stroke="#d6d6d6" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="484" y="101" text-anchor="start" font-size="12" fill="#7a7a7a" filter="url(#rough2)">(1,3,4)</text>
  <text x="572" y="101" text-anchor="start" font-size="10.5" fill="#9b9b9b" filter="url(#rough2)">边数 2</text>
  <rect x="616" y="74" width="136" height="42" rx="5" fill="#ffffff" stroke="#d6d6d6" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="628" y="101" text-anchor="start" font-size="12" fill="#7a7a7a" filter="url(#rough2)">(1,3,5)</text>
  <text x="716" y="101" text-anchor="start" font-size="10.5" fill="#9b9b9b" filter="url(#rough2)">边数 1</text>
  <rect x="40" y="126" width="136" height="42" rx="5" fill="#ffffff" stroke="#d6d6d6" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="52" y="153" text-anchor="start" font-size="12" fill="#7a7a7a" filter="url(#rough2)">(1,4,5)</text>
  <text x="140" y="153" text-anchor="start" font-size="10.5" fill="#9b9b9b" filter="url(#rough2)">边数 1</text>
  <rect x="184" y="126" width="136" height="42" rx="5" fill="#ffffff" stroke="#d6d6d6" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="196" y="153" text-anchor="start" font-size="12" fill="#7a7a7a" filter="url(#rough2)">(2,3,4)</text>
  <text x="284" y="153" text-anchor="start" font-size="10.5" fill="#9b9b9b" filter="url(#rough2)">边数 1</text>
  <rect x="328" y="126" width="136" height="42" rx="5" fill="#ffffff" stroke="#d6d6d6" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="340" y="153" text-anchor="start" font-size="12" fill="#7a7a7a" filter="url(#rough2)">(2,3,5)</text>
  <text x="428" y="153" text-anchor="start" font-size="10.5" fill="#9b9b9b" filter="url(#rough2)">边数 1</text>
  <rect x="472" y="126" width="136" height="42" rx="5" fill="#e9f4ec" stroke="#3f6b4a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="484" y="153" text-anchor="start" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">(2,4,5)</text>
  <text x="572" y="153" text-anchor="start" font-size="10.5" fill="#3f6b4a" filter="url(#rough2)">边数 0</text>
  <rect x="616" y="126" width="136" height="42" rx="5" fill="#e9f4ec" stroke="#3f6b4a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="628" y="153" text-anchor="start" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">(3,4,5)</text>
  <text x="716" y="153" text-anchor="start" font-size="10.5" fill="#3f6b4a" filter="url(#rough2)">边数 0</text>
  <rect x="40" y="200" width="690" height="50" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="56" y="224" text-anchor="start" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">只要有一个三元组边数为 3（三人两两相识）或 0（三人两两不识），就输出 WIN；</text>
  <text x="56" y="244" text-anchor="start" font-size="12" fill="#2f4a66" filter="url(#rough2)">10 个都既不 0 也不 3，才是 FAIL（例如样例 2 的 5 环）。</text>
  <rect x="40" y="264" width="690" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="288" text-anchor="start" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">为什么人数是 5：R(3,3)=6，六个人一定出现上述两种情况；</text>
  <text x="56" y="308" text-anchor="start" font-size="12" fill="#7a5a1b" filter="url(#rough2)">五个人可以“逃掉”（5 环就是反例），所以本题才有 FAIL 这个输出。</text>
  <text x="40" y="348" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">实现：5×5 的布尔邻接表 + 三重循环枚举三元组，O(1) 级别。</text>
  <text x="40" y="370" text-anchor="start" font-size="12" fill="#5b5b5b" filter="url(#rough2)">易错：把“两两不识”漏掉（只判三角形），或把 a_i,b_i 当成从 0 开始的下标。</text>
</svg>
