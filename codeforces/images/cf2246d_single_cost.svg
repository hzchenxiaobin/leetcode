<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 356" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="356" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">① 单元素代价 f(x) = bitlen(x) + popcount(x) − 1</text>
  <text x="310" y="50" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">以 x = 5 为例：D 是减一（把最低位的 1 清零），H 是减半（整体右移一位）</text>

  <g font-size="11" fill="#999" text-anchor="middle" filter="url(#rough2)">
    <text x="80" y="84">二进制 101</text>
    <text x="200" y="84">100</text>
    <text x="320" y="84">10</text>
    <text x="440" y="84">1</text>
    <text x="560" y="84">空</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="48" y="94" width="64" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="168" y="94" width="64" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="288" y="94" width="64" height="44" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="408" y="94" width="64" height="44" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="528" y="94" width="64" height="44" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <g font-size="18" font-weight="bold" text-anchor="middle" filter="url(#rough2)">
    <text x="80" y="124" fill="#33517a">5</text>
    <text x="200" y="124" fill="#33517a">4</text>
    <text x="320" y="124" fill="#3a5a30">2</text>
    <text x="440" y="124" fill="#3a5a30">1</text>
    <text x="560" y="124" fill="#8a3a36">0</text>
  </g>

  <g filter="url(#rough2)" stroke="#666" stroke-width="1.3" fill="none">
    <path d="M 115 116 L 163 116" marker-end="url(#arr)"/>
    <path d="M 235 116 L 283 116" marker-end="url(#arr)"/>
    <path d="M 355 116 L 403 116" marker-end="url(#arr)"/>
    <path d="M 475 116 L 523 116" marker-end="url(#arr)"/>
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle" fill="#b85450" filter="url(#rough2)">
    <text x="139" y="110">D</text>
    <text x="259" y="110">H</text>
    <text x="379" y="110">H</text>
    <text x="499" y="110">D</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="36" y="184" width="270" height="72" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="314" y="184" width="270" height="72" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="36" y="272" width="548" height="64" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <g font-size="11.5" fill="#555" filter="url(#rough2)">
    <text x="50" y="208" fill="#8a3a36" font-weight="bold">D 减一：仅当第一个元素为奇数时</text>
    <text x="50" y="230">把最低位的 1 清零，代价 1 步；</text>
    <text x="50" y="248">可做的减一总数 = popcount(x)</text>
    <text x="328" y="208" fill="#33517a" font-weight="bold">H 减半：第一个元素为偶数时</text>
    <text x="328" y="230">把偶数前缀整体右移，代价 1 步；</text>
    <text x="328" y="248">减半次数 = bitlen(x) − 1</text>
    <text x="310" y="300" text-anchor="middle" font-size="13" fill="#7a5a10" font-weight="bold">总步数 f(5) = 2 + 2 = 4，通式 f(x) = bitlen(x) + popcount(x) − 1</text>
    <text x="310" y="322" text-anchor="middle" font-size="11.5" fill="#8a6a20">f 只由 x 的二进制决定，与数组下标、与谁先谁后都无关</text>
  </g>
</svg>
