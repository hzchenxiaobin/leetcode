<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="205"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">186B：两种顺序取较大值，高度用「百分之一米」整数精确计算</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="50.0" y="78.0" width="620.0" height="88.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="64.0" y="101.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">顺序 1：a 段用 a_i，休息后缩水 (100-k)%，再用 b_i</text>
  <text x="64.0" y="127.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">h1 = a*t1*(100-k) + b*t2*100  （单位 1/100 米）</text>
  <rect x="50.0" y="184.0" width="620.0" height="88.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="64.0" y="207.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">顺序 2：a 段用 b_i，休息后缩水，再用 a_i</text>
  <text x="64.0" y="233.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">h2 = b*t1*(100-k) + a*t2*100</text>
  <rect x="50.0" y="290.0" width="620.0" height="60.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="64.0" y="314.0" text-anchor="start" font-size="12" fill="#3f3420" filter="url(#rough2)">取 h = max(h1, h2)；按 h 降序、编号升序输出 h/100.h%100</text>
  <text x="60.0" y="384.0" text-anchor="start" font-size="11.5" fill="#555" filter="url(#rough2)">缩水只作用于第一段：先乘 (100-k)，再除以 100；第二段不缩水。</text>
</svg>
