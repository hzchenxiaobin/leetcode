  <text x="190.0" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">e</text>
  <rect x="222" y="110" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="246.0" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">a</text>
  <rect x="278" y="110" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="302.0" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">d</text>
  <rect x="334" y="110" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="358.0" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">c</text>
  <rect x="390" y="110" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="414.0" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">u</text>
  <rect x="446" y="110" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="470.0" y="138" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">t</text>
  <line x1="330" y1="84" x2="330" y2="178" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="336" y="78" text-anchor="start" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">r = 4</text>
  <text x="110" y="176" text-anchor="start" font-size="11" font-weight="normal" fill="#2f4a66" filter="url(#rough2)">x = read</text>
  <text x="342" y="176" text-anchor="start" font-size="11" font-weight="normal" fill="#2f5223" filter="url(#rough2)">y = cut</text>
  <rect x="110" y="210" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="134.0" y="238" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5223" filter="url(#rough2)">c</text>
  <rect x="166" y="210" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="190.0" y="238" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5223" filter="url(#rough2)">u</text>
  <rect x="222" y="210" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="246.0" y="238" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5223" filter="url(#rough2)">t</text>
  <rect x="278" y="210" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="302.0" y="238" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5223" filter="url(#rough2)">r</text>
  <rect x="334" y="210" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="358.0" y="238" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5223" filter="url(#rough2)">e</text>
  <rect x="390" y="210" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="414.0" y="238" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5223" filter="url(#rough2)">a</text>
  <rect x="446" y="210" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="470.0" y="238" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5223" filter="url(#rough2)">d</text>
  <path d="M 330 154 L 330 202" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="604" y="234" text-anchor="start" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">= yx</text>
  <rect x="60" y="286" width="620" height="40" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="74" y="312" text-anchor="start" font-size="11" font-weight="bold" fill="#8a6015" filter="url(#rough2)">所以一步操作只取决于位移量 r ∈ [1, n−1]；k 步之后只取决于 r₁+…+r_k (mod n)。</text>
</svg>
