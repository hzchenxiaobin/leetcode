<svg xmlns="http://www.w3.org/2000/svg" width="840" height="340" viewBox="0 0 840 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="340" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每个三元组的四分类</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">三条边分属 A 或 B，四类互斥且穷尽</text>
  <g filter="url(#rough2)"><rect x="90" y="100" width="160" height="80" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="170" y="132" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3 条 A</text>
  <text x="170" y="162" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">T_A</text>
  <g filter="url(#rough2)"><rect x="270" y="100" width="160" height="80" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="350" y="132" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2A + 1B</text>
  <text x="350" y="162" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">N₂</text>
  <g filter="url(#rough2)"><rect x="450" y="100" width="160" height="80" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="530" y="132" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1A + 2B</text>
  <text x="530" y="162" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">N₁</text>
  <g filter="url(#rough2)"><rect x="630" y="100" width="160" height="80" rx="4" fill="#f6d9d7" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="710" y="132" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3 条 B</text>
  <text x="710" y="162" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">T_B</text>
  <text x="420" y="220" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">只有第 1、4 类计入答案；第 2、3 类是"混合三元组"</text>
  <g filter="url(#rough2)"><rect x="170" y="246" width="500" height="56" rx="4" fill="#f7fbf4" fill-opacity="0.85" stroke="#a8c99a" stroke-width="1.3"/></g>
  <text x="420" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#3d6b2f" filter="url(#rough2)">S_A + S_B − C(n,3) = 2(T_A + T_B)</text>
  <text x="420" y="292" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">一次 O(n+m) 扫描即可</text>
</svg>
