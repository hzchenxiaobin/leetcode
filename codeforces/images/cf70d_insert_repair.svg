<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="37"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2b2b2b"/>
    </marker>
  </defs>

  <rect width="760" height="430" fill="#fafafa"/>
  <text x="380" y="30" text-anchor="middle" font-size="17.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">插入 p：先判"是否在上方"，再从 p 向两侧删掉凹点（叉积 ≥ 0 即冗余）</text>
  <path d="M 70 40 Q 380 46 690 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 左图：插入前 -->
  <text x="190" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">插入前：A、B、C、D 是上链顶点</text>
  <g filter="url(#rough2)">
    <polyline points="70,300 140,210 210,165 280,165" fill="none" stroke="#446688" stroke-width="2.2"/>
    <line x1="280" y1="165" x2="245" y2="75" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5 4"/>
    <line x1="210" y1="165" x2="245" y2="75" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5 4"/>
  </g>
  <g filter="url(#rough2)">
    <circle cx="70" cy="300" r="4" fill="#2b2b2b"/>
    <circle cx="140" cy="210" r="4" fill="#2b2b2b"/>
    <circle cx="210" cy="165" r="4" fill="#2b2b2b"/>
    <circle cx="280" cy="165" r="4" fill="#2b2b2b"/>
    <circle cx="245" cy="75" r="5" fill="#b85450"/>
  </g>
  <g font-size="12" fill="#2b2b2b" filter="url(#rough2)">
    <text x="58" y="318">A</text>
    <text x="128" y="228">B</text>
    <text x="196" y="184">C</text>
    <text x="288" y="184">D</text>
    <text x="252" y="66" fill="#8c2f2b">p（新点）</text>
  </g>
  <text x="190" y="352" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">链的边斜率：A→B = 2，B→C = 1，C→D = 0，严格递减</text>
  <text x="190" y="372" text-anchor="middle" font-size="11.5" fill="#8c2f2b" filter="url(#rough2)">p 在 C→D 边的上方，所以 p 一定成为新顶点</text>

  <!-- 箭头 -->
  <path d="M 330 230 L 400 230" stroke="#2b2b2b" stroke-width="1.6" marker-end="url(#ar2)" filter="url(#rough2)"/>
  <text x="365" y="220" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">插入并修复</text>

  <!-- 右图：插入后 -->
  <text x="570" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f5226" filter="url(#rough2)">插入后：只剩 A、p、D 三个顶点</text>
  <g filter="url(#rough2)">
    <polyline points="430,300 605,75 640,165" fill="none" stroke="#2f7a3a" stroke-width="2.4"/>
    <line x1="430" y1="300" x2="570" y2="210" stroke="#c9cdd4" stroke-width="1.4" stroke-dasharray="4 4"/>
    <line x1="570" y1="210" x2="640" y2="165" stroke="#c9cdd4" stroke-width="1.4" stroke-dasharray="4 4"/>
  </g>
  <g filter="url(#rough2)">
    <circle cx="430" cy="300" r="4" fill="#2b2b2b"/>
    <circle cx="605" cy="75" r="5" fill="#2f7a3a"/>
    <circle cx="640" cy="165" r="4" fill="#2b2b2b"/>
    <circle cx="500" cy="255" r="4" fill="#c9cdd4"/>
    <circle cx="570" cy="210" r="4" fill="#c9cdd4"/>
  </g>
  <g filter="url(#rough2)" stroke="#b85450" stroke-width="2">
    <line x1="494" y1="249" x2="506" y2="261"/>
    <line x1="506" y1="249" x2="494" y2="261"/>
    <line x1="564" y1="204" x2="576" y2="216"/>
    <line x1="576" y1="204" x2="564" y2="216"/>
  </g>
  <g font-size="12" fill="#2b2b2b" filter="url(#rough2)">
    <text x="416" y="318">A</text>
    <text x="614" y="66" fill="#1f5226">p</text>
    <text x="650" y="184">D</text>
    <text x="480" y="272" fill="#8c2f2b">B 删除</text>
    <text x="556" y="236" fill="#8c2f2b">C 删除</text>
  </g>
  <text x="570" y="352" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">删 B：cross(A,B,p) = 0（共线，保留端点即可）</text>
  <text x="570" y="372" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">删 C：cross(B,C,p) = 1.5 &gt; 0（向内凹）</text>

  <!-- 底部结论 -->
  <rect x="40" y="386" width="680" height="36" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="409" font-size="11.8" fill="#7a5a1b" filter="url(#rough2)">每个点最多被插入一次、删除一次；set 的插入/删除/查找都是 O(log q)，总复杂度 O(q log q)。</text>
</svg>
