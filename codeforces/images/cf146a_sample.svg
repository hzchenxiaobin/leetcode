<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="333"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="260" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">样例：4774 的两半</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">前半 4+7 = 11，后半 7+4 = 11</text>
  <g filter="url(#rough2)"><rect x="250" y="96" width="92" height="60" rx="5" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="296" y="134" text-anchor="middle" font-size="20" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><rect x="350" y="96" width="92" height="60" rx="5" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="396" y="134" text-anchor="middle" font-size="20" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">7</text>
  <g filter="url(#rough2)"><rect x="450" y="96" width="92" height="60" rx="5" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="496" y="134" text-anchor="middle" font-size="20" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">7</text>
  <g filter="url(#rough2)"><rect x="550" y="96" width="92" height="60" rx="5" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="596" y="134" text-anchor="middle" font-size="20" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="450" y="190" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4 + 7 = 11　　　＝　　　7 + 4 = 11</text>
  <text x="450" y="226" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">全部是幸运数字 ⇒ YES</text>
</svg>
