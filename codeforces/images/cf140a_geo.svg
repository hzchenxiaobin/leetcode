<svg xmlns="http://www.w3.org/2000/svg" width="700" height="350" viewBox="0 0 700 350"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1413"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="700" height="320" fill="#fafafa"/>
  <text x="350.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">盘心在半径 R−r 的圆上</text>
  <path d="M 112.0 42 Q 350.0 48 588.0 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="350.0" y="306" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">相邻夹角 ≥ 2·asin(r/(R−r))，n 个总和 ≤ 2π</text>
  <circle cx="350" cy="170" r="120" fill="none" stroke="#5a7fb0" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="350" cy="170" r="72" fill="none" stroke="#b8b8b0" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <circle cx="350.0" cy="98.0" r="40" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="422.0" cy="170.0" r="40" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="350.0" cy="242.0" r="40" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="278.0" cy="170.0" r="40" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="350" y="92" text-anchor="middle" font-size="11" fill="#335478" filter="url(#rough2)">R</text>
  <text x="350" y="316" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">样例 4 个 r=4 在 R=10：4×83.6° = 334.5° ≤ 360° → YES</text>
</svg>
