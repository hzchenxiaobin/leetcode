<rect x="198" y="169" width="60" height="60" rx="4" fill="#e6e6e6" stroke="#555" stroke-width="2" filter="url(#rough2)"/>
<text x="228" y="207" font-size="18" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#222" font-weight="normal" text-anchor="middle" filter="url(#rough2)">黑</text>
<rect x="134" y="233" width="60" height="60" rx="4" fill="#e6e6e6" stroke="#555" stroke-width="2" filter="url(#rough2)"/>
<text x="164" y="271" font-size="18" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#222" font-weight="normal" text-anchor="middle" filter="url(#rough2)">黑</text>
<line x1="190" y1="199" x2="206" y2="199" stroke="#2e7d32" stroke-width="3" filter="url(#rough2)"/>
<polygon points="206.0,199.0 195.0,194.0 195.0,204.0" fill="#2e7d32" filter="url(#rough2)"/>
