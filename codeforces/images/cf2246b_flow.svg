<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="34" text-anchor="middle" font-size="18" fill="#333"
        filter="url(#rough2)">算法流程：三分类构造</text>

  <rect x="190" y="52" width="240" height="34" rx="8" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="74" text-anchor="middle" font-size="13" fill="#2a3f55" filter="url(#rough2)">对每组读入 n</text>

  <path d="M 310 86 L 310 110" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="310,110 400,140 310,170 220,140" fill="#fce4ec" stroke="#b85450"
           stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="145" text-anchor="middle" font-size="13" fill="#6d2f2c" filter="url(#rough2)">n = 1 ?</text>

  <path d="M 220 140 L 130 140" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="172" y="132" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="24" y="124" width="104" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="76" y="145" text-anchor="middle" font-size="12.5" fill="#33502a" filter="url(#rough2)">输出单个 1</text>

  <path d="M 310 170 L 310 196" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="322" y="188" font-size="11.5" fill="#b85450" filter="url(#rough2)">否</text>

  <polygon points="310,196 400,226 310,256 220,226" fill="#fce4ec" stroke="#b85450"
           stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="231" text-anchor="middle" font-size="13" fill="#6d2f2c" filter="url(#rough2)">n = 2 ?</text>

  <path d="M 220 226 L 130 226" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="172" y="218" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="24" y="210" width="104" height="32" rx="8" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="76" y="231" text-anchor="middle" font-size="12.5" fill="#6d2f2c" filter="url(#rough2)">输出 -1</text>

  <path d="M 310 256 L 310 282" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="322" y="274" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">否（n ≥ 3）</text>

  <rect x="176" y="282" width="268" height="34" rx="8" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="304" text-anchor="middle" font-size="12.5" fill="#2a3f55"
        filter="url(#rough2)">输出 1 2，令 v = 3</text>

  <path d="M 310 316 L 310 336" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="336" width="340" height="44" rx="8" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="354" text-anchor="middle" font-size="12.5" fill="#5a4208"
        filter="url(#rough2)">重复 n-2 次：输出 v，然后 v ← 2v</text>
  <text x="310" y="372" text-anchor="middle" font-size="11.5" fill="#8a5a10"
        filter="url(#rough2)">（输出序列 1, 2, 3, 6, 12, … 恰好 n 个数）</text>
</svg>
