<svg xmlns="http://www.w3.org/2000/svg" width="740" height="380" viewBox="0 0 740 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="109"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="740" height="380" fill="#fafafa"/>

  <text x="370" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2：n=6，集合 {CAT, TACT}，恰好两个串合格</text>
  <path d="M 148 39 Q 370 45 592 39" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="60" y="64" width="48" height="46" rx="8" fill="#e9f4ec" stroke="#3f6b4a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="84" y="96" text-anchor="middle" font-size="18" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">C</text>
  <rect x="112" y="64" width="48" height="46" rx="8" fill="#e9f4ec" stroke="#3f6b4a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="136" y="96" text-anchor="middle" font-size="18" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">A</text>
  <rect x="164" y="64" width="48" height="46" rx="8" fill="#e9f4ec" stroke="#3f6b4a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="188" y="96" text-anchor="middle" font-size="18" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">T</text>
  <rect x="216" y="64" width="48" height="46" rx="8" fill="#e9f4ec" stroke="#3f6b4a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="240" y="96" text-anchor="middle" font-size="18" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">A</text>
  <rect x="268" y="64" width="48" height="46" rx="8" fill="#e9f4ec" stroke="#3f6b4a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="292" y="96" text-anchor="middle" font-size="18" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">C</text>
  <rect x="320" y="64" width="48" height="46" rx="8" fill="#e9f4ec" stroke="#3f6b4a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="344" y="96" text-anchor="middle" font-size="18" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">T</text>
  <text x="380" y="94" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">CAT 覆盖 1–3，TACT 覆盖 3–6</text>
  <rect x="60" y="134" width="48" height="46" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="84" y="166" text-anchor="middle" font-size="18" font-weight="bold" fill="#446688" filter="url(#rough2)">C</text>
  <rect x="112" y="134" width="48" height="46" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="136" y="166" text-anchor="middle" font-size="18" font-weight="bold" fill="#446688" filter="url(#rough2)">A</text>
  <rect x="164" y="134" width="48" height="46" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="188" y="166" text-anchor="middle" font-size="18" font-weight="bold" fill="#446688" filter="url(#rough2)">T</text>
  <rect x="216" y="134" width="48" height="46" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="240" y="166" text-anchor="middle" font-size="18" font-weight="bold" fill="#446688" filter="url(#rough2)">C</text>
  <rect x="268" y="134" width="48" height="46" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="292" y="166" text-anchor="middle" font-size="18" font-weight="bold" fill="#446688" filter="url(#rough2)">A</text>
  <rect x="320" y="134" width="48" height="46" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="344" y="166" text-anchor="middle" font-size="18" font-weight="bold" fill="#446688" filter="url(#rough2)">T</text>
  <text x="380" y="164" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">CAT 覆盖 1–3，另一个 CAT 覆盖 4–6</text>
  <text x="60" y="216" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">覆盖要求：每个位置都必须落在某个模式的一次出现里（出现之间可以互相重叠）</text>
  <text x="60" y="240" text-anchor="start" font-size="12" fill="#5b5b5b" filter="url(#rough2)">这两个串的共同点：位置 3 同时被两个模式覆盖，衔接处不能留空。</text>
  <rect x="40" y="264" width="660" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="56" y="292" text-anchor="start" font-size="12" fill="#8a6015" filter="url(#rough2)">DP 走查（以 CATCAT 为例）：前 3 个字符把前沿推到 3；第 4 个字符 C 起 u 开始增长，</text>
  <text x="56" y="312" text-anchor="start" font-size="12" fill="#8a6015" filter="url(#rough2)">到第 6 个字符时后缀 CAT 的 L=3 ≥ u+1，前沿推到最后 ⇒ 合法。</text>
  <text x="40" y="344" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">TACT 的情形同理：前缀 CAT 推到 3，后缀 TACT 一次盖住 3–6。</text>
</svg>
