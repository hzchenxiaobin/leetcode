<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">合法窗口：最大值 − 最小值 ≤ k</text>
  <path d="M 170 44 Q 360 50 550 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 当前窗口 [2..6] -->
  <rect x="140" y="100" width="398" height="154" rx="6" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" stroke-dasharray="6 4" opacity="0.75" filter="url(#rough2)"/>

  <!-- 柱子 -->
  <g stroke="#446688" stroke-width="1.5" fill="#e8f0fe" filter="url(#rough2)">
    <rect x="60" y="200" width="54" height="50"/>
    <rect x="144" y="170" width="54" height="80"/>
    <rect x="228" y="130" width="54" height="120"/>
    <rect x="312" y="190" width="54" height="60"/>
    <rect x="396" y="180" width="54" height="70"/>
    <rect x="480" y="210" width="54" height="40"/>
  </g>
  <rect x="564" y="110" width="54" height="140" fill="#fde8e8" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="50" y1="250" x2="630" y2="250" stroke="#2b2b2b" stroke-width="1.6" filter="url(#rough2)"/>

  <g font-size="12" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">
    <text x="87" y="192">5</text>
    <text x="171" y="162">8</text>
    <text x="339" y="182">6</text>
    <text x="423" y="172">7</text>
  </g>
  <text x="255" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">max 12</text>
  <text x="507" y="202" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">min 4</text>
  <text x="591" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#a33a36" filter="url(#rough2)">14</text>
  <text x="640" y="150" font-size="12" fill="#8a6015" filter="url(#rough2)">k = 8</text>

  <g font-size="12" fill="#2b2b2b" filter="url(#rough2)">
    <text x="60" y="278">纳入 7 号后：14 − 4 = 10 &gt; 8 → 这已经不是合法窗口。</text>
    <text x="60" y="306">只看 [2..6]：12 − 4 = 8 = k → 合法（虚线框）。</text>
    <text x="60" y="334">合法窗口的任意子窗口一定合法：极差只会变小。</text>
    <text x="60" y="362">非法窗口的任意超窗口一定非法：这正是双指针可行的依据。</text>
  </g>
</svg>
