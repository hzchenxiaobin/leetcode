<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="350" fill="#fafafa"/>
  <text x="360.0" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">208C：最短路上放警察局的收益</text>
  <path d="M 144.00 46 Q 360.0 52 576.00 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="72" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">所有最短路长度相同（无权图），先 BFS 求 dist1[]、distn[] 与最短路条数。</text>
  <text x="60" y="92" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">警察局放在 v：一条最短路“安全”当且仅当它经过 v（内部点贡献 2 条安全边，端点贡献 1 条）。</text>
  <rect x="60" y="116" width="300" height="96" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="134" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">内部点 v：avg = 2·c1[v]·cn[v] / total</text>
  <text x="74" y="156" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">端点 1 或 n：avg = 1</text>
  <text x="74" y="178" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">不在任何最短路上：0</text>
  <text x="74" y="200" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">取所有 v 的最大值。</text>
  <rect x="380" y="116" width="290" height="96" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="394" y="134" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">c1[v]：1 → v 的最短路条数</text>
  <text x="394" y="156" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">cn[v]：v → n 的最短路条数</text>
  <text x="394" y="178" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">total = c1[n] = 最短路总数</text>
  <text x="394" y="200" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">经过 v 的条数 = c1[v]·cn[v]</text>
  <text x="60" y="240" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">n ≤ 100：路径条数最多 2^100 量级，用 double 存即可。</text>
  <rect x="60" y="262" width="620" height="62" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="279" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">样例二：最短路共 7 条，某点经过 6 条 ⇒ 2·6/7 = 1.714285714…，与输出一致。</text>
</svg>
