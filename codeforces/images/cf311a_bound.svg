<svg xmlns="http://www.w3.org/2000/svg" width="700" height="240" viewBox="0 0 700 240"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="1103"/>
    <feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></defs>
  <rect width="700" height="240" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">上界与量级</text>
  <path d="M 200 40 Q 350 46 500 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="60" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="12.5" fill="#22314a" filter="url(#rough2)">tot ≤ n(n−1)/2：每对 (i,j) 至多被数一次。</text>
  <text x="76" y="104" font-size="12.5" fill="#22314a" filter="url(#rough2)">n ≤ 2000 ⇒ 上界 ≈ 2·10⁶；k ≤ 10⁹ ⇒ k 很大时一律 no solution。</text>
  <g filter="url(#rough2)"><rect x="60" y="130" width="580" height="60" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="154" font-size="12.5" fill="#2f5223" filter="url(#rough2)">构造 O(n) 输出；判断 O(1)。</text>
  <text x="76" y="176" font-size="12.5" fill="#2f5223" filter="url(#rough2)">坐标范围 |x|,|y| ≤ 10⁹ ✓（用 0..n−1 即可）。</text>
  <g filter="url(#rough2)"><rect x="60" y="202" width="580" height="30" rx="6" fill="#fbeeee" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="76" y="222" font-size="12" fill="#8a3a36" filter="url(#rough2)">易错：k 与 n(n−1)/2 比较要用 64 位（n=2000 时上界 2·10⁶ 不溢出，但习惯上仍用 long long）。</text>
</svg>
