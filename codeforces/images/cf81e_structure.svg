<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="151"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L10,4.5 L0,9 z" fill="#2f5223"/>
    </marker>
  </defs>

  <rect width="720" height="380" fill="#fafafa"/>
  <text x="360.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">函数图 = 一个环 + 挂在环上的树</text>
  <path d="M 115.2 42 Q 360.0 48 604.8 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="360.0" y="366" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">每个点出度 1 ⇒ 每个连通分量恰有一个环</text>
  <circle cx="240" cy="120" r="20" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="240" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#335478" filter="url(#rough2)">1</text>
  <circle cx="380" cy="120" r="20" fill="#fbeadb" stroke="#d98c3f" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="380" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a5d1c" filter="url(#rough2)">2</text>
  <circle cx="380" cy="250" r="20" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="380" y="255" text-anchor="middle" font-size="13" font-weight="bold" fill="#335478" filter="url(#rough2)">3</text>
  <circle cx="240" cy="250" r="20" fill="#fbeadb" stroke="#d98c3f" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="240" y="255" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a5d1c" filter="url(#rough2)">4</text>
  <circle cx="120" cy="120" r="20" fill="#fbeadb" stroke="#d98c3f" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="120" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a5d1c" filter="url(#rough2)">5</text>
  <circle cx="120" cy="220" r="20" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="120" y="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#335478" filter="url(#rough2)">6</text>
  <circle cx="520" cy="250" r="20" fill="#fbeadb" stroke="#d98c3f" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="520" y="255" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a5d1c" filter="url(#rough2)">7</text>
  <circle cx="520" cy="120" r="20" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="520" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#335478" filter="url(#rough2)">8</text>
  <text x="168" y="108" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">5</text>
  <text x="410" y="216" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">7</text>
  <rect x="556" y="60" width="140" height="96" rx="9" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="586" cy="88" r="13" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="586" y="93" text-anchor="middle" font-size="13" font-weight="bold" fill="#335478" filter="url(#rough2)">B</text>
  <text x="608" y="92" text-anchor="start" font-size="11" fill="#335478" filter="url(#rough2)">男生</text>
  <circle cx="586" cy="124" r="13" fill="#fbeadb" stroke="#d98c3f" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="586" y="129" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a5d1c" filter="url(#rough2)">G</text>
  <text x="608" y="128" text-anchor="start" font-size="11" fill="#9a5d1c" filter="url(#rough2)">女生</text>
  <line x1="566.0" y1="156.0" x2="636.0" y2="156.0" stroke="#2f5223" stroke-width="3.0" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="360" y="300" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">环上的每个点还可以挂若干棵内向树（箭头指向父亲）</text>
  <rect x="56" y="318" width="608" height="34" rx="8" fill="#f4f4f0" stroke="#8a8a8a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="360" y="340" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">粗边 = 配成一对（匹配边）；每条边权 = (n+1) + [男女搭配]</text>
</svg>
