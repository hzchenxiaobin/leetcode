<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="700" height="320" fill="#fafafa" filter="url(#rough2)"/>

  <text x="350" y="32" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    官方样例走查：先看 k 与 m，再照公式填数
  </text>

  <rect x="24" y="48" width="140" height="34" rx="6" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="164" y="48" width="240" height="34" rx="6" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="404" y="48" width="208" height="34" rx="6" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="612" y="48" width="64" height="34" rx="6" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>

  <text x="94" y="70" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">(n, k, m)</text>
  <text x="284" y="70" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">前缀余数 p0 … pn</text>
  <text x="508" y="70" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">输出数组 a</text>
  <text x="644" y="70" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">结论</text>

  <rect x="24" y="86" width="652" height="40" rx="4" fill="#ffffff" stroke="#cccccc"
        stroke-width="1" filter="url(#rough2)"/>
  <text x="94" y="112" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(1, 1, 1)</text>
  <text x="284" y="112" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0, 0</text>
  <text x="508" y="112" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="644" y="112" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">YES</text>

  <rect x="24" y="130" width="652" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.2" filter="url(#rough2)"/>
  <text x="94" y="156" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(5, 3, 5)</text>
  <text x="284" y="156" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0, 1, 2, 0, 1, 2</text>
  <text x="508" y="156" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1 1 3 1 1</text>
  <text x="644" y="156" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">YES</text>

  <rect x="24" y="174" width="652" height="40" rx="4" fill="#ffffff" stroke="#cccccc"
        stroke-width="1" filter="url(#rough2)"/>
  <text x="94" y="200" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(2, 2, 1e9)</text>
  <text x="284" y="200" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0, 1, 0</text>
  <text x="508" y="200" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1 999999999</text>
  <text x="644" y="200" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">YES</text>

  <rect x="24" y="218" width="652" height="40" rx="4" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.2" filter="url(#rough2)"/>
  <text x="94" y="244" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(6, 4, 3)</text>
  <text x="284" y="244" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">k &gt; m，凑不出 4 个不同余数</text>
  <text x="508" y="244" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">—</text>
  <text x="644" y="244" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">NO</text>

  <text x="350" y="286" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    第 2 行：p0 = p3 ⇒ 子段 [1,3] 的和为 5；任意相邻两余数都不同 ⇒ 长度 1、2 都不行
  </text>
  <text x="350" y="308" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">
    第 3 行：a2 = 1e9 - 2 + 1 = 999999999，单个元素都不是 m 的倍数
  </text>
</svg>
