<svg xmlns="http://www.w3.org/2000/svg" width="700" height="404" viewBox="0 0 700 404"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="700" height="404" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">算法流程：排序取前 k 大，四行主体代码</text>
  <text x="350" y="51" text-anchor="middle" font-size="11.5" fill="#888888"
        filter="url(#rough2)">每组三件事：算 g、降序排序、把前 k 个正 g 累加</text>

  <rect x="36" y="72" width="344" height="56" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="54" y="96" text-anchor="start" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">① 读入 n、c、a；S = Σ a_i，g_i = c − a_i</text>
  <text x="54" y="117" text-anchor="start" font-size="11" fill="#888888" filter="url(#rough2)">一次线性扫描同时求 S 与 g，无需额外数组</text>

  <path d="M 208 132 L 208 146" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar2)" filter="url(#rough2)"/>

  <rect x="36" y="150" width="344" height="56" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="54" y="174" text-anchor="start" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">② 把 g 按降序排序（g_(1) ≥ g_(2) ≥ … ≥ g_(n)）</text>
  <text x="54" y="195" text-anchor="start" font-size="11" fill="#888888" filter="url(#rough2)">O(n log n)；n ≤ 2·10^5，1.5 s 绰绰有余</text>

  <path d="M 208 210 L 208 224" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar2)" filter="url(#rough2)"/>

  <rect x="36" y="228" width="344" height="56" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="54" y="252" text-anchor="start" font-size="12.5" font-weight="bold" fill="#8a6d20" filter="url(#rough2)">③ k = min(⌊n/2⌋, 正 g 个数)，G = g_(1) + … + g_(k)</text>
  <text x="54" y="273" text-anchor="start" font-size="11" fill="#888888" filter="url(#rough2)">降序后遇到 g ≤ 0 就直接 break</text>

  <path d="M 208 288 L 208 302" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar2)" filter="url(#rough2)"/>

  <rect x="36" y="306" width="344" height="56" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="54" y="330" text-anchor="start" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">④ 输出 ans = S − n · c + G</text>
  <text x="54" y="351" text-anchor="start" font-size="11" fill="#888888" filter="url(#rough2)">全用 long long，答案可以是负数</text>

  <rect x="410" y="72" width="256" height="290" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="428" y="96" text-anchor="start" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">两处边界要想清楚</text>

  <text x="428" y="126" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">k ≤ ⌊n/2⌋：</text>
  <text x="428" y="146" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">k 个吸收者与 k 个被吸收者</text>
  <text x="428" y="164" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">必须是两批不同的元素，</text>
  <text x="428" y="182" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">所以最多只能配 ⌊n/2⌋ 对。</text>

  <text x="428" y="214" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">只加正的 g：</text>
  <text x="428" y="234" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">g = c − a ≤ 0 表示这个元素</text>
  <text x="428" y="252" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">不值得被吸收（多付一次 c</text>
  <text x="428" y="270" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">还不如单删），少配更好。</text>

  <text x="428" y="302" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">g = 0 时配不配同分：</text>
  <text x="428" y="322" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">break 与继续都得到同一答案，</text>
  <text x="428" y="340" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">直接 break 最省事。</text>

  <text x="350" y="392" text-anchor="middle" font-size="11" fill="#888888"
        filter="url(#rough2)">总复杂度 O(Σ n log n)，空间 O(n)，与「区间 DP」的 O(n^3) 形成鲜明对比</text>
</svg>
