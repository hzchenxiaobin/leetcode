<svg xmlns="http://www.w3.org/2000/svg" width="860" height="380" viewBox="0 0 860 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="860" height="380" fill="#fafafa"/>

  <text x="430" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">查票员路线完全固定：在车头与车尾之间往返</text>
  <text x="430" y="56" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">样例一：n = 5，从 2 号出发朝车头；位置序列 2 → 1 → 2 → 3 → 4 → 5 → 4 → 3</text>

  <g filter="url(#rough2)" stroke="#dddddd" stroke-width="1">
    <line x1="100" y1="300" x2="800" y2="300"/>
    <line x1="100" y1="245" x2="800" y2="245"/>
    <line x1="100" y1="190" x2="800" y2="190"/>
    <line x1="100" y1="135" x2="800" y2="135"/>
    <line x1="100" y1="80" x2="800" y2="80"/>
  </g>
  <g filter="url(#rough2)" text-anchor="end" font-size="11" fill="#888888">
    <text x="92" y="304">1 号（车头）</text>
    <text x="92" y="249">2 号</text>
    <text x="92" y="194">3 号</text>
    <text x="92" y="139">4 号</text>
    <text x="92" y="84">5 号（车尾）</text>
  </g>

  <g filter="url(#rough2)">
    <polyline points="140,245 230,300 320,245 410,190 500,135 590,80 680,135 770,190"
              fill="none" stroke="#446688" stroke-width="2.2"/>
    <circle cx="140" cy="245" r="5" fill="#2b2b2b"/>
    <circle cx="230" cy="300" r="5" fill="#b85450"/>
    <circle cx="320" cy="245" r="5" fill="#446688"/>
    <circle cx="410" cy="190" r="5" fill="#446688"/>
    <circle cx="500" cy="135" r="5" fill="#446688"/>
    <circle cx="590" cy="80" r="5" fill="#b85450"/>
    <circle cx="680" cy="135" r="5" fill="#446688"/>
    <circle cx="770" cy="190" r="5" fill="#446688"/>

    <text x="230" y="330" text-anchor="middle" font-size="10" fill="#8a2b28">到车头，掉头</text>
    <text x="590" y="66" text-anchor="middle" font-size="10" fill="#8a2b28">到车尾，掉头</text>

    <g text-anchor="middle" font-size="10" fill="#777777">
      <text x="140" y="356">t=0</text>
      <text x="230" y="356">1</text>
      <text x="320" y="356">2</text>
      <text x="410" y="356">3</text>
      <text x="500" y="356">4</text>
      <text x="590" y="356">5</text>
      <text x="680" y="356">6</text>
      <text x="770" y="356">7</text>
    </g>
  </g>

  <g filter="url(#rough2)">
    <path d="M 100 300 L 800 300" stroke="#999999" stroke-width="1.2" marker-end="url(#arr)"/>
    <text x="806" y="304" font-size="10.5" fill="#777777">分钟</text>
  </g>
</svg>
