<svg xmlns="http://www.w3.org/2000/svg" width="740" height="380" viewBox="0 0 740 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="193"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="740" height="380" fill="#fafafa"/>
  <text x="370" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两把枪各自的时刻表：谁先摧毁对方谁赢（同时算 Vasya 赢）</text>
  <path d="M 170 46 Q 370 52 570 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <line x1="80" y1="120" x2="366" y2="120" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="80" y="98" text-anchor="start" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">Vasya（dt₁ = 3）</text>
  <line x1="80" y1="112" x2="80" y2="128" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="80" y="144" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#446688" filter="url(#rough2)">1</text>
  <line x1="158" y1="112" x2="158" y2="128" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="158" y="144" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#446688" filter="url(#rough2)">2</text>
  <line x1="236" y1="112" x2="236" y2="128" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="236" y="144" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#446688" filter="url(#rough2)">3</text>
  <line x1="314" y1="112" x2="314" y2="128" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="314" y="144" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#446688" filter="url(#rough2)">4</text>
  <line x1="80" y1="210" x2="366" y2="210" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="80" y="188" text-anchor="start" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">对手（dt₂ = 2）</text>
  <line x1="80" y1="202" x2="80" y2="218" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="80" y="234" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <line x1="132" y1="202" x2="132" y2="218" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="132" y="234" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <line x1="184" y1="202" x2="184" y2="218" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="184" y="234" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <line x1="236" y1="202" x2="236" y2="218" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="236" y="234" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#4a7a3a" filter="url(#rough2)">4</text>
  <line x1="288" y1="202" x2="288" y2="218" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="288" y="234" text-anchor="middle" font-size="9.5" font-weight="normal" fill="#4a7a3a" filter="url(#rough2)">5</text>
  <line x1="158" y1="80" x2="158" y2="250" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="164" y="262" text-anchor="start" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">Vasya 打死亡的时刻（第 T₁=2 枪，t=3）</text>
  <text x="80" y="300" text-anchor="start" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">要赢：对手的致死时刻 ≥ 3 ⇒ 第 T₂ 枪满足 (T₂−1)·2 ≥ 3 ⇒ T₂ ≥ 3。</text>
  <rect x="60" y="314" width="620" height="52" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="74" y="336" text-anchor="start" font-size="11" font-weight="bold" fill="#8a6015" filter="url(#rough2)">m(k) = ⌊((k−1)·dt₁ + 2·dt₂ − 1) / dt₂⌋，答案 = Σₖ P(T₁=k)·P(T₂ ≥ m(k))。</text>
  <text x="74" y="356" text-anchor="start" font-size="11" font-weight="normal" fill="#7a5a1b" filter="url(#rough2)">P(T₂ ≥ m) 就是“打 m−1 枪还活着”的概率，DP 里顺手就有。</text>
</svg>
