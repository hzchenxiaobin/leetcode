<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="380" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">食物的保质期：今天剩的只能明天吃</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">所以"跨天的余量"永远是最新一天的食物；旧食物必须在当天吃掉</text>
  <text x="130" y="110" text-anchor="end" font-size="12.5" fill="#555555" filter="url(#rough2)">第 i-1 天</text>
  <g filter="url(#rough2)"><rect x="150" y="92" width="150" height="34" rx="3" fill="#cfe0f0" fill-opacity="0.8" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="225" y="116" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">a_{i-1}</text>
  <text x="130" y="176" text-anchor="end" font-size="12.5" fill="#555555" filter="url(#rough2)">第 i 天</text>
  <g filter="url(#rough2)"><rect x="300" y="158" width="130" height="34" rx="3" fill="#f6e3c4" fill-opacity="0.8" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="365" y="182" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">旧食物（今天必须吃完）</text>
  <g filter="url(#rough2)"><rect x="430" y="158" width="100" height="34" rx="3" fill="#d7ecd0" fill-opacity="0.8" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="480" y="182" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">a_i（新的）</text>
  <text x="130" y="246" text-anchor="end" font-size="12.5" fill="#555555" filter="url(#rough2)">第 i+1 天</text>
  <g filter="url(#rough2)"><rect x="430" y="228" width="100" height="34" rx="3" fill="#f6d9d7" fill-opacity="0.8" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="480" y="252" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">剩余 ≤ a_i</text>
  <line x1="375" y1="202" x2="375" y2="224" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="600" y="176" text-anchor="start" font-size="12.5" fill="#b05a5a" filter="url(#rough2)">每天固定吃 v 千克</text>
  <text x="600" y="200" text-anchor="start" font-size="12.5" fill="#b05a5a" filter="url(#rough2)">剩下的才能喂朋友</text>
  <text x="600" y="250" text-anchor="start" font-size="13" fill="#3d6b2f" filter="url(#rough2)">余量 = min(a_i, 可用 - v - 喂出)</text>
  <text x="440" y="330" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">每天"喂谁"只需要按食量从小到大取前缀：同样的食物换最多的评级</text>
</svg>
