    <text x="455.0" y="271.2" text-anchor="middle" font-size="12" fill="#2c4a66" font-weight="bold">6</text>
  </g>
  <path d="M 396 267 L 422 267" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="60" y="318" text-anchor="start" font-size="10.5" fill="#8a6a20" font-weight="normal" filter="url(#rough2)">余类 1：下标 1 → 3 → 5</text>
  <g filter="url(#rough2)">
    <rect x="150" y="330" width="58" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="179.0" y="351.2" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold">1</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="242" y="330" width="58" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="271.0" y="351.2" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold">3</text>
  </g>
  <path d="M 212 347 L 238 347" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="334" y="330" width="58" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="363.0" y="351.2" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold">5</text>
  </g>
  <path d="M 304 347 L 330 347" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330.0" y="398" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="normal" filter="url(#rough2)">每条链内 1 的个数 mod 2 是不变量 ⇒ 必须全部为偶数</text>
</svg>
