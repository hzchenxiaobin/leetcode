  <rect width="660" height="420" fill="#fafafa"/>
  <text x="330.0" y="32" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">k = 2：操作只在同一个余类的链内传播</text>
  <text x="330.0" y="54" text-anchor="middle" font-size="10.5" fill="#888" font-weight="normal" filter="url(#rough2)">下标按 i mod k 分组（0 基）；一次操作翻转同一条链上相邻的两个格子</text>
  <text x="70" y="100.0" text-anchor="middle" font-size="13" fill="#666" font-weight="bold" filter="url(#rough2)">s</text>
  <g filter="url(#rough2)">
