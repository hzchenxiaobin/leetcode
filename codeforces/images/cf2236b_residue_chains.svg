  <path d="M 256.0 116 Q 322.0 140 388.0 116" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <path d="M 322.0 116 Q 388.0 158 454.0 116" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="4 4" filter="url(#rough2)"/>
