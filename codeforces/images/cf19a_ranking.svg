<svg xmlns="http://www.w3.org/2000/svg" width="740" height="360" viewBox="0 0 740 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="da2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2b2b2b"/>
    </marker>
  </defs>
  <rect width="740" height="360" fill="#fafafa"/>
  <text x="370" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">排序键：积分 → 净胜球 → 进球数，全部降序</text>

  <!-- 四个队列 -->
  <g filter="url(#rough2)">
    <rect x="70" y="70" width="150" height="52" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="145" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5223">D</text>
    <text x="145" y="112" text-anchor="middle" font-size="11.5" fill="#2f5223">6 分，+5，6 球</text>

    <rect x="240" y="70" width="150" height="52" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="315" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5223">A</text>
    <text x="315" y="112" text-anchor="middle" font-size="11.5" fill="#2f5223">5 分，+1，4 球</text>

    <rect x="410" y="70" width="150" height="52" rx="9" fill="#fbeeee" stroke="#b85450" stroke-width="1.6"/>
    <text x="485" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#8f3b37">B</text>
    <text x="485" y="112" text-anchor="middle" font-size="11.5" fill="#8f3b37">4 分，−2，2 球</text>

    <rect x="580" y="70" width="110" height="52" rx="9" fill="#fbeeee" stroke="#b85450" stroke-width="1.6"/>
    <text x="635" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#8f3b37">C</text>
    <text x="635" y="112" text-anchor="middle" font-size="11.5" fill="#8f3b37">4 分，−4</text>
  </g>

  <text x="145" y="58" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">第 1 名</text>
  <text x="315" y="58" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">第 2 名（出线）</text>
  <text x="485" y="58" text-anchor="middle" font-size="11" fill="#8f3b37" filter="url(#rough2)">第 3 名</text>
  <text x="635" y="58" text-anchor="middle" font-size="11" fill="#8f3b37" filter="url(#rough2)">第 4 名</text>

  <!-- 名次箭头 -->
  <line x1="380" y1="140" x2="380" y2="164" stroke="#2b2b2b" stroke-width="1.4" marker-end="url(#da2)" filter="url(#rough2)"/>
  <text x="392" y="158" font-size="11.5" fill="#555" filter="url(#rough2)">取前 n/2 名，再按字典序输出</text>

  <g filter="url(#rough2)">
    <rect x="250" y="170" width="120" height="42" rx="8" fill="#eef4ec" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="310" y="196" text-anchor="middle" font-size="13" fill="#2f5223">A</text>
    <rect x="390" y="170" width="120" height="42" rx="8" fill="#eef4ec" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="450" y="196" text-anchor="middle" font-size="13" fill="#2f5223">D</text>
  </g>

  <rect x="70" y="240" width="620" height="96" rx="10" fill="#f4f6f9" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <g font-size="12.5" fill="#2f4a66" filter="url(#rough2)">
    <text x="86" y="264">· 胜 3 分、平 1 分、负 0 分；净胜球 = 总进球 − 总失球。</text>
    <text x="86" y="288">· 依次比较：积分高者在前；同分看净胜球；仍相同看进球数。题面保证不会出现三项全同。</text>
    <text x="86" y="312" font-weight="bold" fill="#8f3b37">· 输出的是"出线队的名字按字典序"，不是按名次输出。</text>
  </g>
</svg>
