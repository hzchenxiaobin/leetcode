<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="300" fill="#fafafa"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">D1（n ≤ 3）：9! 个排列全部试一遍，够用</text>
  <path d="M 190.38500000000005 46 Q 380.0 52 569.615 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="40.0" y="66.0" width="320.0" height="64.0" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="200.0" y="102.1" text-anchor="middle" font-size="11.4" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">① 排序 a[0..8]</text>
  <path d="M 362.0 98.0 L 396.0 98.0" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="400.0" y="66.0" width="320.0" height="64.0" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="560.0" y="102.1" text-anchor="middle" font-size="11.4" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">② next_permutation 枚举</text>
  <rect x="40.0" y="154.0" width="320.0" height="64.0" rx="9" fill="#fff3d6" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="200.0" y="190.1" text-anchor="middle" font-size="11.4" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">③ 检查 3 行 + 3 列 + 2 条对角线</text>
  <path d="M 362.0 186.0 L 396.0 186.0" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="400.0" y="154.0" width="320.0" height="64.0" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="560.0" y="190.1" text-anchor="middle" font-size="11.4" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">④ 输出第一个合法方阵</text>
  <rect x="40.0" y="240.0" width="680.0" height="46.0" rx="9" fill="#fdf0ef" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="54.0" y="264.0" text-anchor="start" font-size="11.3" fill="#8a3a36" filter="url(#rough2)">9! = 362880 个排列，每个只做 8 条线求和；n = 4 时 16! 就完全不可行了。</text>
</svg>
