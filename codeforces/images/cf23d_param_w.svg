<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 0 780 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="509"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr23a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arr23b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b06a2c"/>
    </marker>
  </defs>

  <rect width="780" height="440" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">把顶点写成 M1 + w：四条边长只差一个向量 w</text>

  <!-- 左：参数化 -->
  <rect x="40" y="52" width="380" height="300" rx="10" fill="#ffffff" stroke="#c9c9c9"
        stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="120" y1="240" x2="300" y2="240" stroke="#7a8ca6" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="120" y1="240" x2="120" y2="110" stroke="#7a8ca6" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="306" y="246" font-size="10" fill="#777" filter="url(#rough2)">x</text>
  <text x="112" y="104" font-size="10" fill="#777" filter="url(#rough2)">y</text>

  <circle cx="120" cy="240" r="4" fill="#8c3b37" filter="url(#rough2)"/>
  <text x="104" y="258" font-size="11" fill="#8c3b37" filter="url(#rough2)">M1</text>
  <circle cx="190" cy="180" r="5" fill="#23405c" filter="url(#rough2)"/>
  <text x="196" y="174" font-size="12" fill="#23405c" filter="url(#rough2)">A</text>
  <circle cx="50" cy="300" r="5" fill="#23405c" filter="url(#rough2)"/>
  <text x="34" y="320" font-size="12" fill="#23405c" filter="url(#rough2)">B</text>

  <path d="M 120 240 L 190 180" stroke="#4a7a3a" stroke-width="2" fill="none"
        marker-end="url(#arr23a)" filter="url(#rough2)"/>
  <text x="150" y="200" font-size="11" fill="#2f5223" filter="url(#rough2)">w</text>
  <path d="M 120 240 L 50 300" stroke="#4a7a3a" stroke-width="2" fill="none"
        marker-end="url(#arr23a)" filter="url(#rough2)"/>
  <text x="58" y="264" font-size="11" fill="#2f5223" filter="url(#rough2)">-w</text>

  <text x="60" y="86" font-size="11.5" fill="#23405c" filter="url(#rough2)">A = M1 + w，B = M1 - w，C = 2M2 - B，D = 2M3 - C</text>
  <text x="60" y="286" font-size="11" fill="#666" filter="url(#rough2)">u = M2 - M1，v = M3 - M2</text>
  <text x="60" y="330" font-size="11" fill="#8c3b37" filter="url(#rough2)">边长的一半：|w| , |u+w| , |v-u-w| , |w-v|</text>

  <!-- 右：垂直平分线 -->
  <rect x="440" y="52" width="310" height="300" rx="10" fill="#eef4ff" stroke="#446688"
        stroke-width="1.3" filter="url(#rough2)"/>
  <text x="456" y="78" font-size="12" font-weight="bold" fill="#23405c" filter="url(#rough2)">三边等长 = w 落在两条垂直平分线上</text>

  <circle cx="500" cy="170" r="5" fill="#b06a2c" filter="url(#rough2)"/>
  <text x="478" y="162" font-size="11" fill="#8a4a14" filter="url(#rough2)">ci</text>
  <circle cx="640" cy="120" r="5" fill="#b06a2c" filter="url(#rough2)"/>
  <text x="648" y="114" font-size="11" fill="#8a4a14" filter="url(#rough2)">cj</text>
  <line x1="500" y1="170" x2="640" y2="120" stroke="#b06a2c" stroke-width="1.4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <line x1="570" y1="98" x2="570" y2="240" stroke="#c0392b" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="576" y="100" font-size="10" fill="#c0392b" filter="url(#rough2)">垂直平分线 1</text>

  <circle cx="600" cy="220" r="5" fill="#2f5223" filter="url(#rough2)"/>
  <text x="608" y="228" font-size="11" fill="#2f5223" filter="url(#rough2)">ck</text>
  <line x1="500" y1="170" x2="600" y2="220" stroke="#2f5223" stroke-width="1.4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <line x1="520" y1="260" x2="690" y2="150" stroke="#c0392b" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="626" y="278" font-size="10" fill="#c0392b" filter="url(#rough2)">垂直平分线 2</text>

  <circle cx="646" cy="176" r="6" fill="#8c3b37" filter="url(#rough2)"/>
  <text x="654" y="172" font-size="12" font-weight="bold" fill="#8c3b37" filter="url(#rough2)">w</text>

  <text x="456" y="310" font-size="10.5" fill="#23405c" filter="url(#rough2)">2(cj-ci)·w = |cj|² - |ci|²　（平方展开后二次项抵消）</text>

  <!-- 底部 -->
  <rect x="40" y="366" width="710" height="56" rx="9" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.3" filter="url(#rough2)"/>
  <text x="56" y="390" font-size="11.5" fill="#2f5223" filter="url(#rough2)">两条垂直平分线的交点唯一（只要三点不共线，系数行列式 = cross(u,v) ≠ 0）→ 四边形被唯一确定。</text>
  <text x="56" y="410" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">若三条给定边不是 AB、BC、CD 而是别的三边，只需把三个中点做个排列重来（共 6 种）。</text>
</svg>
