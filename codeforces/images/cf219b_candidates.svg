<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="400" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">末尾至少 t 个 9 的数：公差 10^t 的等差数列</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">p = 1029；每一行只画到不超过 p 的最大者 c_t（红框）</text>
  <text x="104" y="126" text-anchor="end" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">t = 1</text>
  <g filter="url(#rough2)"><rect x="120" y="100" width="90" height="36" rx="4" fill="#e8eef4" fill-opacity="0.85" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="165" y="125" text-anchor="middle" font-size="13.5" fill="#2b2b2b" filter="url(#rough2)">9</text>
  <g filter="url(#rough2)"><rect x="224" y="100" width="90" height="36" rx="4" fill="#f6d9d7" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.5"/></g>
  <text x="269" y="125" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">19</text>
  <g filter="url(#rough2)"><rect x="328" y="100" width="90" height="36" rx="4" fill="#e8eef4" fill-opacity="0.85" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="373" y="125" text-anchor="middle" font-size="13.5" fill="#2b2b2b" filter="url(#rough2)">29</text>
  <g filter="url(#rough2)"><rect x="432" y="100" width="90" height="36" rx="4" fill="#e8eef4" fill-opacity="0.85" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="477" y="125" text-anchor="middle" font-size="13.5" fill="#2b2b2b" filter="url(#rough2)">…</text>
  <g filter="url(#rough2)"><rect x="536" y="100" width="90" height="36" rx="4" fill="#e8eef4" fill-opacity="0.85" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="581" y="125" text-anchor="middle" font-size="13.5" fill="#2b2b2b" filter="url(#rough2)">1019</text>
  <g filter="url(#rough2)"><rect x="640" y="100" width="90" height="36" rx="4" fill="#e8eef4" fill-opacity="0.85" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="685" y="125" text-anchor="middle" font-size="13.5" fill="#2b2b2b" filter="url(#rough2)">1029</text>
  <text x="704" y="126" text-anchor="start" font-size="16" fill="#999999" filter="url(#rough2)">…</text>
  <text x="104" y="210" text-anchor="end" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">t = 2</text>
  <g filter="url(#rough2)"><rect x="120" y="184" width="90" height="36" rx="4" fill="#e8eef4" fill-opacity="0.85" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="165" y="209" text-anchor="middle" font-size="13.5" fill="#2b2b2b" filter="url(#rough2)">99</text>
  <g filter="url(#rough2)"><rect x="224" y="184" width="90" height="36" rx="4" fill="#e8eef4" fill-opacity="0.85" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="269" y="209" text-anchor="middle" font-size="13.5" fill="#2b2b2b" filter="url(#rough2)">199</text>
  <g filter="url(#rough2)"><rect x="328" y="184" width="90" height="36" rx="4" fill="#e8eef4" fill-opacity="0.85" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="373" y="209" text-anchor="middle" font-size="13.5" fill="#2b2b2b" filter="url(#rough2)">…</text>
  <g filter="url(#rough2)"><rect x="432" y="184" width="90" height="36" rx="4" fill="#e8eef4" fill-opacity="0.85" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="477" y="209" text-anchor="middle" font-size="13.5" fill="#2b2b2b" filter="url(#rough2)">899</text>
  <g filter="url(#rough2)"><rect x="536" y="184" width="90" height="36" rx="4" fill="#f6d9d7" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.5"/></g>
  <text x="581" y="209" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">999</text>
  <text x="600" y="210" text-anchor="start" font-size="16" fill="#999999" filter="url(#rough2)">…</text>
  <text x="104" y="294" text-anchor="end" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">t = 3</text>
  <g filter="url(#rough2)"><rect x="120" y="268" width="90" height="36" rx="4" fill="#f6d9d7" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.5"/></g>
  <text x="165" y="293" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">999</text>
  <text x="420" y="350" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">每类只需检查"不超过 p 的最大者"：若它都降价太多，整类出局；否则它就是该类里最值钱的</text>
  <text x="420" y="376" text-anchor="middle" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">因此候选只有 O(log p) 个：p 本身 + 每个 t 对应的一个 c_t</text>
</svg>
