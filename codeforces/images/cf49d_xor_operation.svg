<svg xmlns="http://www.w3.org/2000/svg" width="760" height="386" viewBox="0 0 760 386"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c9801f"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a8524a"/>
    </marker>
  </defs>
  <rect width="760" height="386" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">一次操作在差异串里长什么样</text>
  <text x="56.0" y="96.0" text-anchor="start" font-size="13" fill="#2b2b2b" filter="url(#rough2)">原条带 s 与目标 t2 逐位异或得到 a2：</text>
  <rect x="200.0" y="112.0" width="36.0" height="38.0" fill="#fdf3e3" stroke="#c9801f" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="218.0" y="136.4" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="244.0" y="112.0" width="36.0" height="38.0" fill="#f4f9f2" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="262.0" y="136.4" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="288.0" y="112.0" width="36.0" height="38.0" fill="#f4f9f2" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="306.0" y="136.4" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="332.0" y="112.0" width="36.0" height="38.0" fill="#fdf3e3" stroke="#c9801f" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="350.0" y="136.4" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="376.0" y="112.0" width="36.0" height="38.0" fill="#f4f9f2" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="394.0" y="136.4" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="420.0" y="112.0" width="36.0" height="38.0" fill="#f4f9f2" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="438.0" y="136.4" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="464.0" y="112.0" width="36.0" height="38.0" fill="#f4f9f2" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="482.0" y="136.4" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="518.0" y="130.0" text-anchor="start" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">a2 = 1001000</text>
  <rect x="34.0" y="180.0" width="692.0" height="62.0" rx="8" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.5" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="50.0" y="206.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">操作选相邻 (i, i+1) 且 s_i = s_{i+1} ⟺ 在 a 中 a_i ≠ a_{i+1}；</text>
  <text x="50.0" y="230.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">因为 s_i = t_i ⊕ a_i、t 是交错串，故 s_i = s_{i+1} ⟺ a_i ⊕ a_{i+1} = 1。</text>
  <rect x="197.0" y="109.0" width="86.0" height="44.0" rx="6" fill="none" stroke="#c9801f" stroke-width="2.0" filter="url(#rough2)"/>
  <text x="240.0" y="172.0" text-anchor="middle" font-size="11" fill="#c9801f" font-weight="bold" filter="url(#rough2)">可选：a1≠a2</text>
  <rect x="329.0" y="109.0" width="86.0" height="44.0" rx="6" fill="none" stroke="#c9801f" stroke-width="2.0" filter="url(#rough2)"/>
  <text x="372.0" y="172.0" text-anchor="middle" font-size="11" fill="#c9801f" font-weight="bold" filter="url(#rough2)">可选：a4≠a5</text>
  <text x="56.0" y="272.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">操作后这两位可以涂成任意颜色，也就是 a 的这两位可以任意重设（典型地改成 0 0）。</text>
  <rect x="34.0" y="288.0" width="692.0" height="86.0" rx="8" fill="#f7f9fc" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="50.0" y="314.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">下界：能选中的一对在 a 中必是一个 0 与一个 1，所以一步最多把 1 的个数减少 1。</text>
  <text x="50.0" y="338.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">上界：只要 a 不全为 1，每个 1 段的端点都挨着 0，总可以「消掉一个端点上的 1」。</text>
  <text x="50.0" y="362.0" text-anchor="start" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">于是对固定目标，最少步数 = a 中 1 的个数；a 全 1 时说明 s 就是另一个目标（0 步）。</text>
</svg>
