<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="507"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="380" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">198B：BFS 层数就是时间，首次到达即最早</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="70.0" y="100.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">状态 (墙, 位置)，最多 2n 个；位置 &gt; n 直接 YES</text>
  <rect x="60.0" y="140.0" width="600.0" height="80.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="74.0" y="163.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">水位随时间升高：同一状态越早到越好</text>
  <text x="74.0" y="189.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">所以普通 BFS + 访问标记就够（不需要分层最短路）</text>
  <rect x="60.0" y="240.0" width="600.0" height="60.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="74.0" y="263.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">危险格 X 不能站；越界（&gt;n）算逃出</text>
  <text x="74.0" y="287.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">时间 t 的移动后位置必须 &gt; t+1</text>
</svg>
