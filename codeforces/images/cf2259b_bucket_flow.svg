<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#8a6d3b" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="700" height="470" fill="#fafafa"/>

  <text x="350" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">一遍扫描：每个 a[i] 只进三个桶中的一个</text>

  <rect x="280" y="46" width="140" height="32" rx="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="350" y="67" text-anchor="middle" font-size="13" fill="#2b4a6b" filter="url(#rough2)">读入 t</text>

  <path d="M350,78 L350,95" stroke="#8a6d3b" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="230" y="96" width="240" height="34" rx="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="350" y="118" text-anchor="middle" font-size="13" fill="#2b4a6b" filter="url(#rough2)">每组读入 n 与 a[1..n]</text>

  <path d="M350,130 L350,151" stroke="#8a6d3b" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="100" y="152" width="500" height="190" rx="10" fill="none" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="6 5" filter="url(#rough2)"/>
  <text x="118" y="174" font-size="12" fill="#777" filter="url(#rough2)">对每个元素分类计数（odd / c0 / c2 初值 0）</text>

  <rect x="125" y="190" width="200" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="225" y="211" text-anchor="middle" font-size="13" fill="#2f4f2f" filter="url(#rough2)">a[i] 为奇数</text>
  <text x="225" y="229" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">odd += 1</text>

  <rect x="375" y="190" width="200" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="475" y="211" text-anchor="middle" font-size="13" fill="#2b4a6b" filter="url(#rough2)">a[i] % 4 == 0</text>
  <text x="475" y="229" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">c0 += 1</text>

  <rect x="250" y="262" width="200" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="350" y="283" text-anchor="middle" font-size="13" fill="#8a6d3b" filter="url(#rough2)">其余偶数（% 4 == 2）</text>
  <text x="350" y="301" text-anchor="middle" font-size="12" fill="#b8860b" filter="url(#rough2)">c2 += 1</text>

  <path d="M350,342 L350,366" stroke="#8a6d3b" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="240" y="368" width="230" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="355" y="394" text-anchor="middle" font-size="13" fill="#7a2f2b" filter="url(#rough2)">ans = max(odd, c0, c2)</text>

  <text x="350" y="436" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">每组输出 ans 并进入下一组；单组 O(n)，总计 O(Σn)</text>
</svg>
