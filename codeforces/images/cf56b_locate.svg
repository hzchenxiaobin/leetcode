<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2b2b2b"/>
    </marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arra" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">首末不匹配位置夹出唯一的翻转区间</text>
  <path d="M 200 44 Q 360 50 520 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="40" y="112" width="70" height="70" rx="0" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="75.0" y="142" text-anchor="middle" font-size="10" fill="#8a8a8a" filter="url(#rough2)">1</text>
  <text x="75.0" y="168" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <rect x="120" y="112" width="70" height="70" rx="0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="155.0" y="142" text-anchor="middle" font-size="10" fill="#8a8a8a" filter="url(#rough2)">2</text>
  <text x="155.0" y="168" text-anchor="middle" font-size="18" font-weight="bold" fill="#8a6015" filter="url(#rough2)">6</text>
  <rect x="200" y="112" width="70" height="70" rx="0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="235.0" y="142" text-anchor="middle" font-size="10" fill="#8a8a8a" filter="url(#rough2)">3</text>
  <text x="235.0" y="168" text-anchor="middle" font-size="18" font-weight="bold" fill="#8a6015" filter="url(#rough2)">5</text>
  <rect x="280" y="112" width="70" height="70" rx="0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="315.0" y="142" text-anchor="middle" font-size="10" fill="#8a8a8a" filter="url(#rough2)">4</text>
  <text x="315.0" y="168" text-anchor="middle" font-size="18" font-weight="bold" fill="#8a6015" filter="url(#rough2)">4</text>
  <rect x="360" y="112" width="70" height="70" rx="0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="395.0" y="142" text-anchor="middle" font-size="10" fill="#8a8a8a" filter="url(#rough2)">5</text>
  <text x="395.0" y="168" text-anchor="middle" font-size="18" font-weight="bold" fill="#8a6015" filter="url(#rough2)">3</text>
  <rect x="440" y="112" width="70" height="70" rx="0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="475.0" y="142" text-anchor="middle" font-size="10" fill="#8a8a8a" filter="url(#rough2)">6</text>
  <text x="475.0" y="168" text-anchor="middle" font-size="18" font-weight="bold" fill="#8a6015" filter="url(#rough2)">2</text>
  <rect x="520" y="112" width="70" height="70" rx="0" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="555.0" y="142" text-anchor="middle" font-size="10" fill="#8a8a8a" filter="url(#rough2)">7</text>
  <text x="555.0" y="168" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">7</text>
  <rect x="600" y="112" width="70" height="70" rx="0" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="635.0" y="142" text-anchor="middle" font-size="10" fill="#8a8a8a" filter="url(#rough2)">8</text>
  <text x="635.0" y="168" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">8</text>
  <text x="155.0" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">l = 2</text>
  <text x="475.0" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">r = 6</text>
  <path d="M 149.0 194 Q 315.0 228 481.0 194" stroke="#b85450" stroke-width="1.8" fill="none" opacity="1.0" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="315.0" y="244" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">2 ↔ 6</text>
  <path d="M 229.0 194 Q 315.0 264 401.0 194" stroke="#b85450" stroke-width="1.8" fill="none" opacity="1.0" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="315.0" y="282" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">3 ↔ 5</text>
  <text x="315.0" y="306" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#rough2)">4 落在中心</text>
  <text x="360" y="336" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">区间外必须 p[k] = k；区间内必须 p[k] = l + r - k</text>
  <text x="360" y="366" text-anchor="middle" font-size="13" fill="#8a8a8a" filter="url(#rough2)">等价于：区间内 p[k] + k 恒等于 l + r</text>
  <text x="360" y="400" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">升序序列不算：必须恰好一次非平凡翻转</text>
</svg>
