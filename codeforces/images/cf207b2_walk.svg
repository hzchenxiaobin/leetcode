<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="340" fill="#fafafa"/>
  <text x="360.0" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">207B2：同样的走查（规模不同）</text>
  <path d="M 144.00 46 Q 360.0 52 576.00 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="72" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">样例一：n=3，a=(2,1,1)。三条消息对应的循环移位与最少跳数：</text>
  <rect x="60" y="110" width="620" height="34" rx="5" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="132" text-anchor="start" font-size="10.5" fill="#33506e" filter="url(#rough2)">队首 x=1</text>
  <text x="190" y="132" text-anchor="start" font-size="10.5" fill="#33506e" filter="url(#rough2)">位置坦克 1,2,3</text>
  <text x="360" y="132" text-anchor="start" font-size="10.5" fill="#8a6015" filter="url(#rough2)">a 序列 2,1,1</text>
  <text x="540" y="132" text-anchor="start" font-size="10.5" fill="#2f5b34" font-weight="bold" filter="url(#rough2)">dp[3]=2</text>
  <rect x="60" y="150" width="620" height="34" rx="5" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="172" text-anchor="start" font-size="10.5" fill="#33506e" filter="url(#rough2)">队首 x=2</text>
  <text x="190" y="172" text-anchor="start" font-size="10.5" fill="#33506e" filter="url(#rough2)">位置坦克 2,3,1</text>
  <text x="360" y="172" text-anchor="start" font-size="10.5" fill="#8a6015" filter="url(#rough2)">a 序列 1,1,2</text>
  <text x="540" y="172" text-anchor="start" font-size="10.5" fill="#2f5b34" font-weight="bold" filter="url(#rough2)">dp[3]=1</text>
  <rect x="60" y="190" width="620" height="34" rx="5" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="212" text-anchor="start" font-size="10.5" fill="#33506e" filter="url(#rough2)">队首 x=3</text>
  <text x="190" y="212" text-anchor="start" font-size="10.5" fill="#33506e" filter="url(#rough2)">位置坦克 3,1,2</text>
  <text x="360" y="212" text-anchor="start" font-size="10.5" fill="#8a6015" filter="url(#rough2)">a 序列 1,2,1</text>
  <text x="540" y="212" text-anchor="start" font-size="10.5" fill="#2f5b34" font-weight="bold" filter="url(#rough2)">dp[3]=2</text>
  <rect x="60" y="240" width="620" height="76" rx="9" fill="#fdeef1" stroke="#c0708a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="257" text-anchor="start" font-size="11" fill="#8a3a52" filter="url(#rough2)">总时间 = 2 + 1 + 2 = 5 ✓（与样例一致）。</text>
  <text x="74" y="278" text-anchor="start" font-size="11" fill="#8a3a52" filter="url(#rough2)">n 到 10000 时仍可逐条 O(n) 模拟。</text>
</svg>
