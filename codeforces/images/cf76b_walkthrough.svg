<svg xmlns="http://www.w3.org/2000/svg" width="700" height="400" viewBox="0 0 700 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="700" height="400" fill="#fafafa"/>
  <text x="350" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例：三只老鼠都奔向 x = 2 的奶酪</text>
  <path d="M 190 43 Q 350 49 510 43" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 60 240 L 640 240" stroke="#777777" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="632" y="262" text-anchor="end" font-size="10.5" fill="#777777" filter="url(#rough2)">老鼠线 y = 0</text>
  <path d="M 60 140 L 640 140" stroke="#777777" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="632" y="128" text-anchor="end" font-size="10.5" fill="#777777" filter="url(#rough2)">奶酪线 y = 2</text>
  <path d="M 60 236 L 60 244" stroke="#777777" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="60" y="258" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">-1</text>
  <path d="M 130 236 L 130 244" stroke="#777777" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="130" y="258" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">0</text>
  <path d="M 200 236 L 200 244" stroke="#777777" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="200" y="258" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">1</text>
  <path d="M 270 236 L 270 244" stroke="#777777" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="270" y="258" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">2</text>
  <path d="M 340 236 L 340 244" stroke="#777777" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="340" y="258" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">3</text>
  <path d="M 480 236 L 480 244" stroke="#777777" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="480" y="258" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">5</text>
  <circle cx="130" cy="240" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="130" y="224" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">m₀</text>
  <circle cx="200" cy="240" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="224" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">m₁</text>
  <circle cx="340" cy="240" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="340" y="224" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">m₂</text>
  <rect x="255" y="126" width="30" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="116" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">奶酪 c₀</text>
  <rect x="465" y="126" width="30" height="28" rx="4" fill="#ffffff" stroke="#777777" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="480" y="116" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#777777" filter="url(#rough2)">奶酪 c₁</text>
  <path d="M 130 228 L 270 160" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 200 228 L 270 160" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 340 228 L 270 160" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="350" y="300" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">横向距离：m₀ 为 2，m₁ 与 m₂ 都是 1（最近，平了也是各自唯一最近）</text>
  <text x="350" y="326" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">斜边长度：m₁、m₂ = √(1²+2²) = √5，m₀ = √(2²+2²) = 2√2</text>
  <text x="350" y="352" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">m₁、m₂ 同时到达 → 一起吃掉 c₀；m₀ 晚到 → 饿肚子。c₁ 没人要</text>
  <text x="350" y="380" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">答案 = 1（样例输出一致）</text>
</svg>
