<svg xmlns="http://www.w3.org/2000/svg" width="780" height="430" viewBox="0 0 780 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="317"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrU" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="780" height="430" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">样例 1 走查：5 条记录、1 次后退 → 2 天</text>

  <!-- 表头 -->
  <rect x="50" y="52" width="680" height="34" fill="#eef1f4" stroke="#7a8ca6" stroke-width="1.2"
        filter="url(#rough2)"/>
  <text x="92" y="74" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33445c" filter="url(#rough2)">#</text>
  <text x="190" y="74" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33445c" filter="url(#rough2)">原始时间</text>
  <text x="320" y="74" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33445c" filter="url(#rough2)">分钟数</text>
  <text x="440" y="74" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33445c" filter="url(#rough2)">与上一条比较</text>
  <text x="556" y="74" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33445c" filter="url(#rough2)">same</text>
  <text x="660" y="74" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33445c" filter="url(#rough2)">days</text>

  <!-- 行 1 -->
  <rect x="50" y="86" width="680" height="40" fill="#ffffff" stroke="#d6d6d6" stroke-width="1" filter="url(#rough2)"/>
  <text x="92" y="112" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">1</text>
  <text x="190" y="112" text-anchor="middle" font-size="12" fill="#23405c" filter="url(#rough2)">05:00 a.m.</text>
  <text x="320" y="112" text-anchor="middle" font-size="12" fill="#23405c" filter="url(#rough2)">300</text>
  <text x="440" y="112" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">—（初始化）</text>
  <text x="556" y="112" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">1</text>
  <text x="660" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">1</text>

  <!-- 行 2 -->
  <rect x="50" y="126" width="680" height="40" fill="#f7fbff" stroke="#d6d6d6" stroke-width="1" filter="url(#rough2)"/>
  <text x="92" y="152" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">2</text>
  <text x="190" y="152" text-anchor="middle" font-size="12" fill="#23405c" filter="url(#rough2)">05:00 a.m.</text>
  <text x="320" y="152" text-anchor="middle" font-size="12" fill="#23405c" filter="url(#rough2)">300</text>
  <text x="440" y="152" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">相等，同一分钟</text>
  <text x="556" y="152" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">2</text>
  <text x="660" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">1</text>

  <!-- 行 3 -->
  <rect x="50" y="166" width="680" height="40" fill="#ffffff" stroke="#d6d6d6" stroke-width="1" filter="url(#rough2)"/>
  <text x="92" y="192" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">3</text>
  <text x="190" y="192" text-anchor="middle" font-size="12" fill="#23405c" filter="url(#rough2)">01:13 p.m.</text>
  <text x="320" y="192" text-anchor="middle" font-size="12" fill="#23405c" filter="url(#rough2)">793</text>
  <text x="440" y="192" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">前进</text>
  <text x="556" y="192" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">1</text>
  <text x="660" y="192" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">1</text>

  <!-- 行 4：换天 -->
  <rect x="50" y="206" width="680" height="40" fill="#fdeef0" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="92" y="232" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">4</text>
  <text x="190" y="232" text-anchor="middle" font-size="12" fill="#8c3b37" filter="url(#rough2)">01:10 p.m.</text>
  <text x="320" y="232" text-anchor="middle" font-size="12" fill="#8c3b37" filter="url(#rough2)">790</text>
  <text x="440" y="232" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8c3b37" filter="url(#rough2)">后退 790 &lt; 793</text>
  <text x="556" y="232" text-anchor="middle" font-size="12" fill="#8c3b37" filter="url(#rough2)">1</text>
  <text x="660" y="232" text-anchor="middle" font-size="12" font-weight="bold" fill="#8c3b37" filter="url(#rough2)">2</text>

  <!-- 行 5 -->
  <rect x="50" y="246" width="680" height="40" fill="#f7fbff" stroke="#d6d6d6" stroke-width="1" filter="url(#rough2)"/>
  <text x="92" y="272" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">5</text>
  <text x="190" y="272" text-anchor="middle" font-size="12" fill="#23405c" filter="url(#rough2)">11:40 p.m.</text>
  <text x="320" y="272" text-anchor="middle" font-size="12" fill="#23405c" filter="url(#rough2)">1420</text>
  <text x="440" y="272" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">前进</text>
  <text x="556" y="272" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">1</text>
  <text x="660" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">2</text>

  <!-- 竖线 -->
  <line x1="130" y1="52" x2="130" y2="286" stroke="#7a8ca6" stroke-width="1" filter="url(#rough2)"/>
  <line x1="250" y1="52" x2="250" y2="286" stroke="#7a8ca6" stroke-width="1" filter="url(#rough2)"/>
  <line x1="390" y1="52" x2="390" y2="286" stroke="#7a8ca6" stroke-width="1" filter="url(#rough2)"/>
  <line x1="510" y1="52" x2="510" y2="286" stroke="#7a8ca6" stroke-width="1" filter="url(#rough2)"/>
  <line x1="600" y1="52" x2="600" y2="286" stroke="#7a8ca6" stroke-width="1" filter="url(#rough2)"/>

  <!-- 结论 -->
  <path d="M 390 292 L 390 312" stroke="#4a7a3a" stroke-width="1.7" fill="none"
        marker-end="url(#arrU)" filter="url(#rough2)"/>
  <rect x="50" y="318" width="680" height="44" rx="9" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="66" y="345" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">输出 2：三次前进/相等都留在同一天，唯一的一次后退把日志切成两天</text>

  <text x="50" y="384" font-size="11" fill="#666" filter="url(#rough2)">对照样例 2（540、480、420）：每一步都后退，所以天数是 3 —— 每一对相邻记录都必须换天。</text>
  <text x="50" y="404" font-size="11" fill="#8c3b37" filter="url(#rough2)">若用字符串直接比大小，"01:13 p.m." &lt; "11:40 p.m." 会漏掉第 4 条那一次后退。</text>
</svg>
