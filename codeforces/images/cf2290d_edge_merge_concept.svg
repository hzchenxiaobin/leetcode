<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="680" height="360" fill="#fafafa"/>

  <text x="26" y="34" font-size="17" font-weight="bold" fill="#33333a" filter="url(#rough2)">核心模型：字母表是一条链，一次操作 = 合并一条相邻边</text>
  <text x="26" y="62" font-size="14" fill="#5a5a66" filter="url(#rough2)">对 x 操作一次 ⇒ 串中所有 x 变成 x−1（只能朝 a 走，a 永远不变）</text>

  <!-- 必须合并的区间底色 -->
  <rect x="108" y="88" width="188" height="64" rx="10" fill="#fce4ec"
        stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="202" y="80" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">冲突对 (b, d) 强制这两条边</text>

  <!-- 字母盒子 -->
  <rect x="50" y="96" width="46" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="73" y="127" text-anchor="middle" font-size="20" fill="#22364d" filter="url(#rough2)">a</text>

  <rect x="114" y="96" width="46" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="137" y="127" text-anchor="middle" font-size="20" fill="#5c4a1a" filter="url(#rough2)">b</text>

  <rect x="178" y="96" width="46" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="201" y="127" text-anchor="middle" font-size="20" fill="#5c4a1a" filter="url(#rough2)">c</text>

  <rect x="242" y="96" width="46" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="265" y="127" text-anchor="middle" font-size="20" fill="#5c4a1a" filter="url(#rough2)">d</text>

  <rect x="306" y="96" width="46" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="329" y="127" text-anchor="middle" font-size="20" fill="#22364d" filter="url(#rough2)">e</text>

  <text x="386" y="128" text-anchor="middle" font-size="20" fill="#8a8a96" filter="url(#rough2)">⋯</text>

  <rect x="420" y="96" width="46" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="443" y="127" text-anchor="middle" font-size="20" fill="#22364d" filter="url(#rough2)">z</text>

  <!-- 边：灰色 = 不必做，红色 = 必须做 -->
  <path d="M96,119 L112,119" stroke="#9aa2b1" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M176,119 L160,119" stroke="#b85450" stroke-width="3.4" fill="none"
        marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <path d="M240,119 L224,119" stroke="#b85450" stroke-width="3.4" fill="none"
        marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <path d="M304,119 L288,119" stroke="#9aa2b1" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M400,119 L420,119" stroke="#9aa2b1" stroke-width="1.6" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>

  <text x="50" y="182" font-size="14" fill="#3d4a3d" filter="url(#rough2)">连通块 [l, r]：块内所有字母最终都降到 l（= 块内最小字母）</text>
  <text x="50" y="208" font-size="14" fill="#3d4a3d" filter="url(#rough2)">代价 = r − l 次操作：从 r 开始往小做，每条边恰好用一次</text>

  <rect x="44" y="226" width="596" height="94" rx="10" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="64" y="252" font-size="14" fill="#22364d" filter="url(#rough2)">中间字母躲不掉：想把 d 变成 b，必须 d→c、c→b 各做一次</text>
  <text x="64" y="276" font-size="14" fill="#22364d" filter="url(#rough2)">并且 c 上原有的字母也一起被降到 b —— 这就是“连通块”的含义</text>
  <text x="64" y="300" font-size="14" fill="#b85450" filter="url(#rough2)">于是：b 与 d 同块 ⇔ 边 b–c、c–d 都被执行 ⇒ 最小代价 = 被强制边数</text>
</svg>
