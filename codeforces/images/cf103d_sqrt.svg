<svg xmlns="http://www.w3.org/2000/svg" width="884" height="404" viewBox="0 0 884 404"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="103"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/></marker>
  </defs>
  <rect width="884" height="404" fill="#fafafa"/>
  <text x="442" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">根号分治：小步长预处理、大步长暴力</text>
  <text x="442" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">b ≤ B 时按 b 分组做后缀和；b > B 时每问最多 n/B 项</text>
  <g filter="url(#rough2)"><rect x="70" y="84" width="360" height="120" rx="4" fill="#d7ecd0" fill-opacity="0.45" stroke="#6a9a58" stroke-width="1.4"/></g>
  <text x="250" y="110" text-anchor="middle" font-size="13" fill="#3d6b2f" font-weight="bold" filter="url(#rough2)">b ≤ B ≈ √n</text>
  <text x="250" y="136" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">对每个出现过的 b：</text>
  <text x="250" y="158" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">suf[i] = w[i] + suf[i+b]</text>
  <text x="250" y="182" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">O(n) 一次，共 O(B·n)</text>
  <g filter="url(#rough2)"><rect x="454" y="84" width="360" height="120" rx="4" fill="#cfe0f5" fill-opacity="0.45" stroke="#6688aa" stroke-width="1.4"/></g>
  <text x="634" y="110" text-anchor="middle" font-size="13" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">b &gt; B</text>
  <text x="634" y="136" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">每个询问直接从 a 往后跳</text>
  <text x="634" y="158" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">最多 ⌈n/B⌉ 项</text>
  <text x="634" y="182" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">共 O(p·n/B)</text>
  <text x="442" y="240" text-anchor="middle" font-size="12.5" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">B = √n 时 O((B + p/B)·n) ≈ O(n√n)，n = p = 3·10⁵ → 约 3·10⁸</text>
  <g filter="url(#rough2)"><rect x="70" y="266" width="744" height="58" rx="4" fill="#f6e3c4" fill-opacity="0.4" stroke="#c9a86a" stroke-width="1.3"/></g>
  <text x="442" y="292" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">内存只需 O(n)：一个后缀和数组 + 询问数组（限制 70 MB）</text>
  <text x="442" y="314" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">查询离线按 b 分组，小 b 一次扫描回答同 b 的所有询问</text>
  <text x="442" y="362" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">答案可能到 3·10⁵ × 10⁹ = 3·10¹⁴，必须 64 位整数</text>
</svg>
