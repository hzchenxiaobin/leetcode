<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="430" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每列只有三种形态（题面保证每列至少一只青蛙）</text>
  <path d="M 132 42 Q 380 49 628 42" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- 卡片 1：上单蛙 -->
  <rect x="34" y="58" width="212" height="150" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">① 上单蛙 U</text>
  <rect x="70" y="94" width="56" height="36" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="98" cy="112" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="70" y="130" width="56" height="36" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="98" y="154" text-anchor="middle" font-size="13" fill="#9aa7b4" filter="url(#rough2)">o</text>
  <text x="146" y="112" font-size="12" fill="#2f4a66" filter="url(#rough2)">只有顶部有蛙</text>
  <text x="146" y="134" font-size="12" fill="#2f4a66" filter="url(#rough2)">只能：竖跳 ↓</text>
  <text x="146" y="156" font-size="12" fill="#2f4a66" filter="url(#rough2)">或横跳 ←/→</text>
  <text x="140" y="194" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">c = 1，可竖跳可横跳</text>

  <!-- 卡片 2：下单蛙 -->
  <rect x="274" y="58" width="212" height="150" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">② 下单蛙 D</text>
  <rect x="310" y="94" width="56" height="36" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="338" y="118" text-anchor="middle" font-size="13" fill="#9aa7b4" filter="url(#rough2)">o</text>
  <rect x="310" y="130" width="56" height="36" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="338" cy="148" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="386" y="112" font-size="12" fill="#3c5e2e" filter="url(#rough2)">只有底部有蛙</text>
  <text x="386" y="134" font-size="12" fill="#3c5e2e" filter="url(#rough2)">只能：竖跳 ↑</text>
  <text x="386" y="156" font-size="12" fill="#3c5e2e" filter="url(#rough2)">或横跳 ←/→</text>
  <text x="380" y="194" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">c = 1，同样两种选择</text>

  <!-- 卡片 3：双蛙 -->
  <rect x="514" y="58" width="212" height="150" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="620" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">③ 双蛙 B</text>
  <rect x="550" y="94" width="56" height="36" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="578" cy="112" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="550" y="130" width="56" height="36" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="578" cy="148" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="626" y="112" font-size="12" fill="#8a6015" filter="url(#rough2)">上下各一只</text>
  <text x="626" y="134" font-size="12" fill="#8a6015" filter="url(#rough2)">上下互换即可</text>
  <text x="626" y="156" font-size="12" fill="#8a6015" filter="url(#rough2)">自带零代价方案</text>
  <text x="620" y="194" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">c = 2，自身就是「中立项」</text>

  <!-- 守恒推推导 -->
  <rect x="34" y="222" width="692" height="192" rx="9" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="248" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">水平守恒：每条边界上，向右与向左的青蛙数必须相等</text>

  <text x="56" y="276" font-size="12.5" fill="#333" filter="url(#rough2)">设边界 j（第 j 列与第 j+1 列之间）向右跳 a_j 只、向左跳 b_j 只</text>
  <text x="56" y="300" font-size="12.5" fill="#333" filter="url(#rough2)">第 j 列横向跳出 a_j + b_{j−1} 只，横向跳入 b_j + a_{j−1} 只</text>
  <text x="56" y="324" font-size="12.5" fill="#333" filter="url(#rough2)">列青蛙数不变 ⟹ 跳出 = 跳入 ⟹ a_j − b_j = a_{j−1} − b_{j−1}</text>
  <text x="56" y="352" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">最左边 a₀ = b₀ = 0，于是每条边界都满足 a_j = b_j</text>
  <text x="56" y="378" font-size="12.5" fill="#333" filter="url(#rough2)">记第 j 列的横跳青蛙数为 h_j = a_{j−1} + a_j，它不能超过该列青蛙数 c_j</text>
  <text x="56" y="402" font-size="11.5" fill="#66788c" filter="url(#rough2)">横跳保持所在行不变；竖跳才改变行号——行数是否守恒，只由竖跳的「上下抵消」决定</text>
</svg>
