<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="29"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="720" height="470" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">D1 算法流程：一次线性扫描 + 一次拓扑最长路</text>
  <text x="360" y="50" text-anchor="middle" font-size="11.5" fill="#888888"
        filter="url(#rough2)">全程 O(n + m)，每组数据只建 2n 个点的差分图</text>

  <rect x="50" y="66" width="620" height="52" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"
        filter="url(#rough2)"/>
  <circle cx="80" cy="92" r="14" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="97" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <text x="110" y="87" font-size="12" fill="#2b2b2b" filter="url(#rough2)">读入 n、m 与全部 (o,i,j)；遇到 i = j 时记 diag[i] = o</text>
  <text x="110" y="107" font-size="11" fill="#888888" filter="url(#rough2)">完整版保证每组 (i,i) 都出现，故 diag 一定被填满</text>

  <path d="M 360 118 L 360 128" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar2)"
        filter="url(#rough2)"/>

  <rect x="50" y="128" width="620" height="52" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"
        filter="url(#rough2)"/>
  <circle cx="80" cy="154" r="14" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="159" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">2</text>
  <text x="110" y="149" font-size="12" fill="#2b2b2b" filter="url(#rough2)">定符号：diag[i] = 1 → i ∈ P（a_i ≥ 0）；diag[i] = 2 → i ∈ N（a_i &lt; 0）</text>
  <text x="110" y="169" font-size="11" fill="#888888" filter="url(#rough2)">符号是「≥ 0 / &lt; 0」的划分，0 属于 P</text>

  <path d="M 360 180 L 360 190" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar2)"
        filter="url(#rough2)"/>

  <rect x="50" y="190" width="620" height="52" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"
        filter="url(#rough2)"/>
  <circle cx="80" cy="216" r="14" fill="#ffffff" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="221" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">3</text>
  <text x="110" y="211" font-size="12" fill="#2b2b2b" filter="url(#rough2)">扫一遍所有约束检查相容性：o=1 却 N–N，或 o=2 却 P–P ⟹ 输出 NO</text>
  <text x="110" y="231" font-size="11" fill="#888888" filter="url(#rough2)">同号对的和天然满足对应标签，冲突只可能来自「标签与符号不符」</text>

  <path d="M 360 242 L 360 252" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar2)"
        filter="url(#rough2)"/>

  <rect x="50" y="252" width="620" height="52" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"
        filter="url(#rough2)"/>
  <circle cx="80" cy="278" r="14" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="283" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d20" filter="url(#rough2)">4</text>
  <text x="110" y="273" font-size="12" fill="#2b2b2b" filter="url(#rough2)">只为跨号对建边：o=1 加 y_q → x_p（权 0），o=2 加 x_p → y_q（权 1）</text>
  <text x="110" y="293" font-size="11" fill="#888888" filter="url(#rough2)">同号对不建边，否则会凭空造出假环</text>

  <path d="M 360 304 L 360 314" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar2)"
        filter="url(#rough2)"/>

  <rect x="50" y="314" width="620" height="52" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"
        filter="url(#rough2)"/>
  <circle cx="80" cy="340" r="14" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="345" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">5</text>
  <text x="110" y="335" font-size="12" fill="#2b2b2b" filter="url(#rough2)">Kahn 拓扑排序：成环 ⟹ 输出 NO；否则按拓扑序做最长路（x 初值 0，y 初值 1）</text>
  <text x="110" y="355" font-size="11" fill="#888888" filter="url(#rough2)">每条 x → y 边权为 1 ⇒ 任何环权和都 ≥ 1 &gt; 0，必然矛盾</text>

  <path d="M 360 366 L 360 376" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar2)"
        filter="url(#rough2)"/>

  <rect x="50" y="376" width="620" height="52" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"
        filter="url(#rough2)"/>
  <circle cx="80" cy="402" r="14" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="407" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">6</text>
  <text x="110" y="397" font-size="12" fill="#2b2b2b" filter="url(#rough2)">输出：i ∈ P 取 a_i = x_i；i ∈ N 取 a_i = −y_i（y_i ≥ 1 保证严格为负）</text>
  <text x="110" y="417" font-size="11" fill="#888888" filter="url(#rough2)">数值最大约「跨号边数 + 1」≤ 10^6 + 1，远小于 10^9</text>

  <text x="360" y="452" text-anchor="middle" font-size="11" fill="#888888"
        filter="url(#rough2)">任意合法解都可以，不需要最小化；多测只需把数组按组重建</text>
</svg>
