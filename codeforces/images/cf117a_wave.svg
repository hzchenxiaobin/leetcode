  <rect width="884" height="384" fill="#fafafa"/>
  <text x="442" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">电梯位置是周期 2(m−1) 的三角波</text>
  <text x="442" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">pos(t)=1+r 或 2m−1−r（r = t mod T）</text>
