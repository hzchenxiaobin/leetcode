  <text x="442" y="304" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">底层/顶层每周期出现 1 次，中间层出现 2 次</text>
  <text x="442" y="334" text-anchor="middle" font-size="11.5" fill="#3d6b2f" filter="url(#rough2)">上车 = 两类同余解中不小于 t 的最小者；到站 = 再解一次同余</text>
  <text x="442" y="364" text-anchor="middle" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">s = f 时答案就是 t</text>
