<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1443"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="720" height="240" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程</text>
  <path d="M 220 42 Q 360 48 500 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <rect x="20" y="74" width="118" height="56" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="79" y="108" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#335478" filter="url(#rough2)">读入建图</text>
  <text x="79" y="152" text-anchor="middle" font-size="10" fill="#555555" filter="url(#rough2)">n, m, s</text>
  <text x="79" y="168" text-anchor="middle" font-size="10" fill="#555555" filter="url(#rough2)">m 条双向边 + l</text>

  <line x1="142" y1="102" x2="162" y2="102" stroke="#555555" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 162 102 l -8 -4 l 0 8 z" fill="#555555" filter="url(#rough2)"/>

  <rect x="168" y="74" width="118" height="56" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="227" y="108" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#335478" filter="url(#rough2)">Dijkstra</text>
  <text x="227" y="152" text-anchor="middle" font-size="10" fill="#555555" filter="url(#rough2)">以 s 为源</text>
  <text x="227" y="168" text-anchor="middle" font-size="10" fill="#555555" filter="url(#rough2)">得 d[1..n]</text>

  <line x1="290" y1="102" x2="310" y2="102" stroke="#555555" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 310 102 l -8 -4 l 0 8 z" fill="#555555" filter="url(#rough2)"/>

  <rect x="316" y="74" width="118" height="56" rx="7" fill="#eef5ea" stroke="#5a8a4a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="375" y="108" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">数城市</text>
  <text x="375" y="152" text-anchor="middle" font-size="10" fill="#555555" filter="url(#rough2)">d[v] == l</text>
  <text x="375" y="168" text-anchor="middle" font-size="10" fill="#555555" filter="url(#rough2)">先各记 1 个</text>

  <line x1="438" y1="102" x2="458" y2="102" stroke="#555555" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 458 102 l -8 -4 l 0 8 z" fill="#555555" filter="url(#rough2)"/>

  <rect x="464" y="74" width="118" height="56" rx="7" fill="#f6eef4" stroke="#a05a9a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="523" y="108" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a5a86" filter="url(#rough2)">扫每条边</text>
  <text x="523" y="152" text-anchor="middle" font-size="10" fill="#555555" filter="url(#rough2)">S = d[u]+d[v]+w</text>
  <text x="523" y="168" text-anchor="middle" font-size="10" fill="#555555" filter="url(#rough2)">与 2l 比大小</text>

  <line x1="586" y1="102" x2="606" y2="102" stroke="#555555" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 606 102 l -8 -4 l 0 8 z" fill="#555555" filter="url(#rough2)"/>

  <rect x="612" y="74" width="88" height="56" rx="7" fill="#fbeeee" stroke="#a05a5a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="656" y="108" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a05a5a" filter="url(#rough2)">输出</text>
  <text x="656" y="152" text-anchor="middle" font-size="10" fill="#555555" filter="url(#rough2)">ans</text>
  <text x="656" y="168" text-anchor="middle" font-size="10" fill="#555555" filter="url(#rough2)">最大 3×10⁵</text>

  <text x="360" y="212" text-anchor="middle" font-size="11.5" fill="#335478" filter="url(#rough2)">城市与边各扫一遍，边内不是「采样」而是解析求解，所以答案是精确整数</text>
</svg>
