<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="25"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="480" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">缩掉非桥边：原图变成一棵「桥树」</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <line x1="270.0" y1="250.0" x2="360.0" y2="200.0" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="360.0" y1="200.0" x2="430.0" y2="260.0" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="430.0" y1="260.0" x2="360.0" y2="120.0" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="270.0" y1="250.0" x2="430.0" y2="260.0" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="360.0" y1="200.0" x2="360.0" y2="120.0" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="60.0" y1="150.0" x2="150.0" y2="220.0" stroke="#b85450" stroke-width="2.8" filter="url(#rough2)"/>
  <line x1="150.0" y1="220.0" x2="270.0" y2="250.0" stroke="#b85450" stroke-width="2.8" filter="url(#rough2)"/>
  <line x1="430.0" y1="260.0" x2="520.0" y2="120.0" stroke="#b85450" stroke-width="2.8" filter="url(#rough2)"/>
  <circle cx="60.0" cy="150.0" r="17.0" fill="#eeeeee" stroke="#777777" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="60.0" y="154.3" text-anchor="middle" font-size="12" fill="#777777" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="150.0" cy="220.0" r="17.0" fill="#eeeeee" stroke="#777777" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="150.0" y="224.3" text-anchor="middle" font-size="12" fill="#777777" font-weight="bold" filter="url(#rough2)">2</text>
  <circle cx="270.0" cy="250.0" r="17.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="270.0" y="254.3" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <circle cx="360.0" cy="200.0" r="17.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="360.0" y="204.3" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>
  <circle cx="430.0" cy="260.0" r="17.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="430.0" y="264.3" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">5</text>
  <circle cx="520.0" cy="120.0" r="17.0" fill="#eeeeee" stroke="#777777" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="520.0" y="124.3" text-anchor="middle" font-size="12" fill="#777777" font-weight="bold" filter="url(#rough2)">6</text>
  <circle cx="360.0" cy="120.0" r="17.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="360.0" y="124.3" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="60.0" y="100.0" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">原图</text>
  <line x1="560.0" y1="200.0" x2="592.0" y2="200.0" stroke="#6b4c9a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="576.0" y="184.0" text-anchor="middle" font-size="11" fill="#6b4c9a" filter="url(#rough2)">缩点</text>
  <text x="610.0" y="80.0" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">桥树</text>
  <circle cx="610.0" cy="110.0" r="26.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="610.0" y="114.0" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">{1}</text>
  <circle cx="610.0" cy="190.0" r="26.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="610.0" y="194.0" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">{2}</text>
  <circle cx="610.0" cy="270.0" r="26.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="610.0" y="274.0" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">{3,4,5,7}</text>
  <circle cx="610.0" cy="350.0" r="26.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="610.0" y="354.0" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">{6}</text>
  <line x1="610.0" y1="136.0" x2="610.0" y2="164.0" stroke="#b85450" stroke-width="2.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="610.0" y1="216.0" x2="610.0" y2="244.0" stroke="#b85450" stroke-width="2.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="610.0" y1="296.0" x2="610.0" y2="324.0" stroke="#b85450" stroke-width="2.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="650.0" y="150.0" text-anchor="start" font-size="10.5" fill="#b85450" filter="url(#rough2)">桥 (1,2)</text>
  <text x="650.0" y="230.0" text-anchor="start" font-size="10.5" fill="#b85450" filter="url(#rough2)">桥 (2,3)</text>
  <text x="650.0" y="310.0" text-anchor="start" font-size="10.5" fill="#b85450" filter="url(#rough2)">桥 (5,6)</text>
  <rect x="40.0" y="396.0" width="640.0" height="66.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="54.0" y="420.0" text-anchor="start" font-size="12" fill="#3f3420" filter="url(#rough2)">非桥边连接的点在同一个 2-边连通块里，缩成一个点；桥变成树边</text>
</svg>
