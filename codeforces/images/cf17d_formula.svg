<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="43"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="330" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">D：先数清“有多少个合法数”，再看最后一页</text>
  <path d="M 150 42 Q 380 47 610 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <rect x="40" y="70" width="300" height="92" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="94" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">长度为 n 的 b 进制数（无前导零）</text>
  <text x="52" y="120" font-size="11" fill="#3c5e88" filter="url(#rough2)">首位：1..b-1 共 b-1 种</text>
  <text x="52" y="142" font-size="11" fill="#3c5e88" filter="url(#rough2)">其余 n-1 位：各 b 种</text>
  <text x="52" y="156" font-size="11" fill="#2f4a66" filter="url(#rough2)">N = (b-1) · b^(n-1)</text>

  <rect x="360" y="70" width="180" height="92" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="372" y="94" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">每页 c 个</text>
  <text x="372" y="118" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">页数 = ⌈N / c⌉</text>
  <text x="372" y="140" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">最后一页装剩下的</text>

  <rect x="560" y="70" width="160" height="92" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="640" y="94" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">最后一页的数量</text>
  <text x="640" y="122" text-anchor="middle" font-size="13" fill="#2f5223" filter="url(#rough2)">(N − 1) mod c + 1</text>
  <text x="640" y="146" text-anchor="middle" font-size="10" fill="#3c5e2e" filter="url(#rough2)">N mod c = 0 时恰好是 c</text>

  <text x="52" y="192" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">样例 1：b = 2，n = 3，c = 3</text>
  <text x="52" y="214" font-size="11" fill="#555" filter="url(#rough2)">N = 1 · 2² = 4；(4−1) mod 3 = 0，最后一页 = 0 + 1 = 1 ✓</text>
  <text x="52" y="236" font-size="11" fill="#8c3a36" filter="url(#rough2)">四页数写成 3 + 1：第一页 3 个，第二页 1 个，所以最后一页是 1。</text>

  <text x="52" y="262" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">样例 2：b = 2，n = 3，c = 4</text>
  <text x="52" y="284" font-size="11" fill="#555" filter="url(#rough2)">N = 4；(4−1) mod 4 + 1 = 3 + 1 = 4 ✓（全部在一页）</text>

  <rect x="52" y="296" width="656" height="26" rx="8" fill="#f3e8fd" stroke="#8a6d9a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="64" y="314" font-size="10.5" fill="#5b3a6e" filter="url(#rough2)">难点不在公式，而在 b、n 都是最长 10^6 位的十进制串：取模、指数降幂都要按字符串处理。</text>
</svg>
