<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>

  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1 走查：逐片插入，集合大小 1 → 2 → 2 → 3 → 4</text>
  <path d="M 96 44 Q 360 50 624 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 表头 -->
  <g filter="url(#rough2)" font-size="12.5" font-weight="bold" fill="#2f4a66">
    <text x="62" y="82" text-anchor="middle">序号</text>
    <text x="150" y="82">叶子 (树种, 颜色)</text>
    <text x="410" y="82" text-anchor="middle">集合中已有？</text>
    <text x="590" y="82" text-anchor="middle">|S|</text>
  </g>
  <line x1="40" y1="92" x2="680" y2="92" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- 行 -->
  <g filter="url(#rough2)" font-size="12.5" fill="#2b2b2b">
    <circle cx="62" cy="120" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="62" y="124.5" text-anchor="middle" font-size="11.5" fill="#2f4a66">1</text>
    <text x="150" y="125">(birch, yellow)</text>
    <text x="410" y="125" text-anchor="middle" fill="#2f5223">否 → 收下</text>
    <text x="590" y="125" text-anchor="middle" font-weight="bold" fill="#2f5223">1</text>

    <circle cx="62" cy="164" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="62" y="168.5" text-anchor="middle" font-size="11.5" fill="#2f4a66">2</text>
    <text x="150" y="169">(maple, red)</text>
    <text x="410" y="169" text-anchor="middle" fill="#2f5223">否 → 收下</text>
    <text x="590" y="169" text-anchor="middle" font-weight="bold" fill="#2f5223">2</text>

    <rect x="34" y="184" width="652" height="42" rx="8" fill="#fdecea" stroke="#b85450" stroke-width="1.4"/>
    <circle cx="62" cy="205" r="12" fill="#ffffff" stroke="#b85450" stroke-width="1.2"/>
    <text x="62" y="209.5" text-anchor="middle" font-size="11.5" fill="#8f3a34">3</text>
    <text x="150" y="210" fill="#8f3a34">(birch, yellow)</text>
    <text x="410" y="210" text-anchor="middle" fill="#8f3a34">是，与第 1 片相同 → 拒收</text>
    <text x="590" y="210" text-anchor="middle" font-weight="bold" fill="#8f3a34">2</text>

    <circle cx="62" cy="258" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="62" y="262.5" text-anchor="middle" font-size="11.5" fill="#2f4a66">4</text>
    <text x="150" y="263">(maple, yellow)</text>
    <text x="410" y="263" text-anchor="middle" fill="#2f5223">否（树种同、颜色不同）→ 收下</text>
    <text x="590" y="263" text-anchor="middle" font-weight="bold" fill="#2f5223">3</text>

    <circle cx="62" cy="302" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="62" y="306.5" text-anchor="middle" font-size="11.5" fill="#2f4a66">5</text>
    <text x="150" y="307">(maple, green)</text>
    <text x="410" y="307" text-anchor="middle" fill="#2f5223">否 → 收下</text>
    <text x="590" y="307" text-anchor="middle" font-weight="bold" fill="#2f5223">4</text>
  </g>

  <line x1="40" y1="330" x2="680" y2="330" stroke="#9bb0c4" stroke-width="1.2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="360" y="358" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">最终 |S| = 4，与官方输出 4 一致；样例 2 中三片完全相同，只留下 1 个元素</text>
  <text x="360" y="382" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">集合大小只在「新二元组」出现时 +1，所以它可以和「收下的叶子数」同步增长</text>
</svg>
