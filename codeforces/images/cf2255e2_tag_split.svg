<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="900" height="440" fill="#fafafa"/>

  <text x="450" y="30" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">把「一段操作」压成一个可合成的小对象：按第一次赋值切成两半</text>

  <!-- 操作序列 -->
  <text x="60" y="76" font-size="13.5" fill="#666" filter="url(#rough2)">标签 = 一串「改值 + 追加」的步骤</text>
  <g filter="url(#rough2)">
    <rect x="70" y="88" width="52" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="128" y="88" width="52" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="186" y="88" width="52" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="244" y="88" width="66" height="34" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <rect x="316" y="88" width="52" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="374" y="88" width="52" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="432" y="88" width="52" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="96" y="110" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">取反</text>
  <text x="154" y="110" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">max0</text>
  <text x="212" y="110" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">取反</text>
  <text x="277" y="110" text-anchor="middle" font-size="12" fill="#8f3a36" filter="url(#rough2)">赋值 x</text>
  <text x="342" y="110" text-anchor="middle" font-size="12" fill="#3f6633" filter="url(#rough2)">取反</text>
  <text x="400" y="110" text-anchor="middle" font-size="12" fill="#3f6633" filter="url(#rough2)">max0</text>
  <text x="458" y="110" text-anchor="middle" font-size="12" fill="#3f6633" filter="url(#rough2)">取反</text>

  <path d="M250,132 L250,150 L184,150 L184,132" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M254,132 L254,150 L320,150 L320,132" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="184" y="170" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">前半：没有赋值</text>
  <text x="322" y="170" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">后半：数值已知（常数）</text>

  <!-- 两个压缩结果 -->
  <rect x="46" y="190" width="400" height="150" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="246" y="216" text-anchor="middle" font-size="14.5" fill="#33506b" filter="url(#rough2)">前半（符号未知）</text>
  <text x="66" y="244" font-size="13" fill="#33506b" filter="url(#rough2)">info₊ ：假定初值 x = +1 时的 (s,p,q,m)</text>
  <text x="66" y="268" font-size="13" fill="#33506b" filter="url(#rough2)">info₋ ：假定初值 x = -1 时的 (s,p,q,m)</text>
  <text x="66" y="292" font-size="13" fill="#33506b" filter="url(#rough2)">σ₊ / σ₋ ：值为 1 或 -1 时走向哪个符号</text>
  <text x="66" y="318" font-size="12" fill="#7a8ea6" filter="url(#rough2)">实际 info = |x| · info(sign x)，只差一个正因子</text>

  <rect x="470" y="190" width="384" height="150" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="662" y="216" text-anchor="middle" font-size="14.5" fill="#3f6633" filter="url(#rough2)">后半（常数）</text>
  <text x="490" y="244" font-size="13" fill="#3f6633" filter="url(#rough2)">post ：赋值之后追加的常数序列的 (s,p,q,m)</text>
  <text x="490" y="268" font-size="13" fill="#3f6633" filter="url(#rough2)">fin ：整段做完后这个位置的值（常数）</text>
  <text x="490" y="296" font-size="12" fill="#6d8f5e" filter="url(#rough2)">这两项在「合成时」就能算出来，</text>
  <text x="490" y="316" font-size="12" fill="#6d8f5e" filter="url(#rough2)">因为进入后半时数值是已知常数</text>

  <path d="M446,254 L466,254" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 结论 -->
  <rect x="46" y="358" width="808" height="62" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="450" y="382" text-anchor="middle" font-size="13.5" fill="#8a6420" filter="url(#rough2)">合成两个标签分 4 种情况，全部只需 O(1)：前-前 / 前-后 / 后-前 / 后-后</text>
  <text x="450" y="406" text-anchor="middle" font-size="13" fill="#8a6420" filter="url(#rough2)">关键：只要左边出现了赋值，右边整段都能用「常数」代入，无需再关心 x</text>
</svg>
