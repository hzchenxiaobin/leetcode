<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.8" stroke-linecap="round" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-linecap="round" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#b85450" stroke-width="1.8" stroke-linecap="round" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="700" height="470" fill="#fafafa"/>

  <text x="350" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：按权值升序扫，每个点占住「它能到达的最深未占用内部点」</text>

  <g filter="url(#rough2)">
    <rect x="205" y="46" width="290" height="38" rx="7" fill="#f0f4ff" stroke="#446688" stroke-width="1.6"/>
    <rect x="205" y="102" width="290" height="38" rx="7" fill="#f0f4ff" stroke="#446688" stroke-width="1.6"/>
    <rect x="205" y="158" width="290" height="38" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <polygon points="350,204 525,250 350,296 175,250" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <rect x="60" y="308" width="270" height="50" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="380" y="308" width="270" height="50" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="60" y="392" width="590" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>

  <g font-size="11.5" fill="#2a4660" filter="url(#rough2)">
    <text x="222" y="71">① 标出内部点（有儿子的点）与叶子，L = 叶子数</text>
    <text x="222" y="127">② 把 n 个点按 a 升序排序</text>
    <text x="222" y="183" font-size="12" font-weight="bold">③ 取出下一个点 x</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 350 84 L 350 100" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)"/>
    <path d="M 350 140 L 350 156" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)"/>
    <path d="M 350 196 L 350 202" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)"/>
  </g>

  <g font-size="10.5" text-anchor="middle" filter="url(#rough2)" fill="#8a6a20">
    <text x="350" y="240">path(x) 上还有</text>
    <text x="350" y="257">未占用的内部点 w 吗？</text>
    <text x="350" y="274">（即 find(x) ≠ 0）</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 262 273 L 195 306" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)"/>
    <path d="M 437 273 L 515 306" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)"/>
  </g>
  <g font-size="11" font-weight="bold" filter="url(#rough2)">
    <text x="230" y="296" fill="#3c6b30">有</text>
    <text x="446" y="292" fill="#8a4a46">没有</text>
  </g>

  <g font-size="11.5" filter="url(#rough2)">
    <text x="76" y="330" fill="#2f5424">a_x 成为 gain；占住 w：</text>
    <text x="76" y="348" fill="#2f5424">nxt[w] ← find(p_w)</text>
    <text x="396" y="330" fill="#7a4a48">x 留在 base</text>
    <text x="396" y="348" fill="#7a4a48">（它的权值不会被弹出）</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 650 333 L 682 333 L 682 177 L 500 177" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arr)"/>
  </g>
  <text x="512" y="169" font-size="10.5" fill="#888" filter="url(#rough2)">↺ 回到 ③，直到点取完</text>

  <g filter="url(#rough2)">
    <path d="M 195 358 L 195 390" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)"/>
    <path d="M 515 358 L 515 390" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)"/>
  </g>

  <g font-size="11.5" filter="url(#rough2)">
    <text x="78" y="413" fill="#7a5c16">④ gain 降序排序；k &lt; L → -1；k ≥ L → base + 前 (k − L) 个 gain 的前缀和</text>
    <text x="78" y="432" font-size="10.5" fill="#8a6a20">base = Σa − Σgain（等价实现：自底向上合并子堆、插入 a_v、内部点弹最小值，弹出的就是 gain）</text>
  </g>
</svg>
