<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="417"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="440" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">195C：在包含 throw 的块里选 catch 最早且类型匹配者</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="60.0" y="90.0" width="300.0" height="200.0" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <rect x="110.0" y="90.0" width="190.0" height="200.0" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <rect x="170.0" y="90.0" width="70.0" height="200.0" fill="#ffffff" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="70.0" y="116.0" text-anchor="start" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">try 行</text>
  <text x="120.0" y="150.0" text-anchor="start" font-size="10.5" fill="#446688" filter="url(#rough2)">try 行</text>
  <text x="190.0" y="210.0" text-anchor="start" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">throw(AE)</text>
  <text x="70.0" y="276.0" text-anchor="start" font-size="11" fill="#4a7a3a" filter="url(#rough2)">catch(AE, msg)</text>
  <text x="120.0" y="246.0" text-anchor="start" font-size="11" fill="#446688" filter="url(#rough2)">catch(BE, ...)</text>
  <rect x="420.0" y="100.0" width="270.0" height="110.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="434.0" y="122.8" text-anchor="start" font-size="10.8" fill="#3f3420" filter="url(#rough2)">候选：外层块（AE 匹配）</text>
  <text x="434.0" y="148.8" text-anchor="start" font-size="10.8" fill="#3f3420" filter="url(#rough2)">内层块类型 BE 不匹配</text>
  <text x="434.0" y="174.8" text-anchor="start" font-size="10.8" fill="#3f3420" filter="url(#rough2)">答：外层的消息</text>
  <rect x="60.0" y="330.0" width="620.0" height="70.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="74.0" y="353.0" text-anchor="start" font-size="11" fill="#3f3420" filter="url(#rough2)">用栈配对 try/catch 得到 (try 行, catch 行, 类型, 消息)</text>
  <text x="74.0" y="377.0" text-anchor="start" font-size="11" fill="#3f3420" filter="url(#rough2)">在所有 try行&lt;L&lt;catch行 且类型匹配的块中取 catch 行最小者</text>
</svg>
