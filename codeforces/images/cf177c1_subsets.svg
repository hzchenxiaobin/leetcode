<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="33"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="470" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2ⁿ 枚举子集，三条检查依次过滤</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="180.0" y="74.0" width="360.0" height="52.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="194.0" y="98.5" text-anchor="start" font-size="12.5" fill="#3f3420" filter="url(#rough2)">mask = 1 … 2ⁿ − 1：枚举所有候选集合</text>
  <rect x="180.0" y="152.0" width="360.0" height="52.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="194.0" y="176.5" text-anchor="start" font-size="12.5" fill="#3f3420" filter="url(#rough2)">条件 A：朋友边两端必须同进同出</text>
  <line x1="360.0" y1="126.0" x2="360.0" y2="148.0" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="180.0" y="230.0" width="360.0" height="52.0" fill="#fde8e8" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="194.0" y="254.5" text-anchor="start" font-size="12.5" fill="#3f3420" filter="url(#rough2)">条件 B：讨厌边不能两端都入集</text>
  <line x1="360.0" y1="204.0" x2="360.0" y2="226.0" stroke="#b85450" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="180.0" y="308.0" width="360.0" height="52.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="194.0" y="332.5" text-anchor="start" font-size="12.5" fill="#3f3420" filter="url(#rough2)">条件 C：集合内朋友图必须连通</text>
  <line x1="360.0" y1="282.0" x2="360.0" y2="304.0" stroke="#8a6015" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="180.0" y="386.0" width="360.0" height="52.0" fill="#f3e8fd" stroke="#6b4c9a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="194.0" y="410.5" text-anchor="start" font-size="12.5" fill="#3f3420" filter="url(#rough2)">best = max(best, |mask|)</text>
  <line x1="360.0" y1="360.0" x2="360.0" y2="382.0" stroke="#6b4c9a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="556.0" y="100.0" text-anchor="start" font-size="11.5" fill="#555" filter="url(#rough2)">n ≤ 14 时 16384 个 mask</text>
  <text x="556.0" y="178.0" text-anchor="start" font-size="11.5" fill="#555" filter="url(#rough2)">A 不满足 → 直接否决</text>
  <text x="556.0" y="256.0" text-anchor="start" font-size="11.5" fill="#555" filter="url(#rough2)">B 不满足 → 否决</text>
  <text x="556.0" y="334.0" text-anchor="start" font-size="11.5" fill="#555" filter="url(#rough2)">C 用 BFS 在 mask 内走一遍</text>
  <text x="556.0" y="412.0" text-anchor="start" font-size="11.5" fill="#555" filter="url(#rough2)">全部通过才更新答案</text>
</svg>
