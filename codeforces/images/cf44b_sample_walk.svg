<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="53"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="720" height="420" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1 走查：n=10，a=b=c=5，逐 k 计数</text>
  <path d="M 150 42 Q 360 48 570 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 表头 -->
  <g filter="url(#rough2)" font-size="12" font-weight="bold" fill="#2f4a66">
    <text x="70" y="78" text-anchor="middle">k</text>
    <text x="140" y="78" text-anchor="middle">rest=20−4k</text>
    <text x="268" y="78" text-anchor="middle">[lo, hi]</text>
    <text x="420" y="78" text-anchor="middle">合法 i</text>
    <text x="560" y="78" text-anchor="middle">本行方案数</text>
  </g>
  <line x1="30" y1="88" x2="690" y2="88" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="12.5" fill="#2b2b2b">
    <text x="70" y="120" text-anchor="middle">0</text>
    <text x="140" y="120" text-anchor="middle">20</text>
    <text x="268" y="120" text-anchor="middle">[10, 5]</text>
    <text x="420" y="120" text-anchor="middle" fill="#999">空（lo &gt; hi）</text>
    <text x="560" y="120" text-anchor="middle" fill="#999">0</text>

    <text x="70" y="156" text-anchor="middle">1</text>
    <text x="140" y="156" text-anchor="middle">16</text>
    <text x="268" y="156" text-anchor="middle">[6, 5]</text>
    <text x="420" y="156" text-anchor="middle" fill="#999">空</text>
    <text x="560" y="156" text-anchor="middle" fill="#999">0</text>

    <text x="70" y="192" text-anchor="middle">2</text>
    <text x="140" y="192" text-anchor="middle">12</text>
    <text x="268" y="192" text-anchor="middle">[2, 5]</text>
    <text x="420" y="192" text-anchor="middle" fill="#2f5223">2, 4</text>
    <text x="560" y="192" text-anchor="middle" font-weight="bold" fill="#2f5223">2</text>

    <text x="70" y="228" text-anchor="middle">3</text>
    <text x="140" y="228" text-anchor="middle">8</text>
    <text x="268" y="228" text-anchor="middle">[0, 5]</text>
    <text x="420" y="228" text-anchor="middle" fill="#2f5223">0, 2, 4</text>
    <text x="560" y="228" text-anchor="middle" font-weight="bold" fill="#2f5223">3</text>

    <text x="70" y="264" text-anchor="middle">4</text>
    <text x="140" y="264" text-anchor="middle">4</text>
    <text x="268" y="264" text-anchor="middle">[0, 4]</text>
    <text x="420" y="264" text-anchor="middle" fill="#2f5223">0, 2, 4</text>
    <text x="560" y="264" text-anchor="middle" font-weight="bold" fill="#2f5223">3</text>

    <text x="70" y="300" text-anchor="middle">5</text>
    <text x="140" y="300" text-anchor="middle">0</text>
    <text x="268" y="300" text-anchor="middle">[0, 0]</text>
    <text x="420" y="300" text-anchor="middle" fill="#2f5223">0</text>
    <text x="560" y="300" text-anchor="middle" font-weight="bold" fill="#2f5223">1</text>
  </g>

  <line x1="30" y1="318" x2="690" y2="318" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="560" y="342" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">合计 = 9</text>

  <!-- 底部：9 种方案 -->
  <rect x="30" y="356" width="660" height="48" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="46" y="378" font-size="11.5" fill="#2f5223" filter="url(#rough2)">9 种 (i,j,k)：(2,5,2) (4,4,2) (0,4,3) (2,3,3) (4,2,3) (0,2,4) (2,1,4) (4,0,4) (0,0,5)</text>
  <text x="46" y="396" font-size="11" fill="#3c5e2e" filter="url(#rough2)">验算：2·0.5+5+2·2 = 10 ✓　4·0.5+4+2·2 = 10 ✓　0·0.5+0+2·5 = 10 ✓</text>
</svg>
