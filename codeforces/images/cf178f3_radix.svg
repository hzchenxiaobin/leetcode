<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="780" height="400" fill="#fafafa"/>
  <text x="390.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">F3：把前缀树压缩成基数树，节点数从 O(总长) 降到 O(n)</text>
  <path d="M 137.40000000000012 46 Q 390.0 52 642.5999999999999 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60.0" y="70.0" width="660.0" height="110.0" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="76.0" y="94.0" text-anchor="start" font-size="11.0" fill="#33506e" filter="url(#rough2)">普通前缀树：2000 个串 × 500 字符 ⇒ 最多 10⁶ 个节点，每个节点存 k+1 的 DP 数组会爆内存</text>
  <rect x="90.0" y="110.0" width="34.0" height="24.0" rx="3" fill="#c9d8ee" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="128.0" y="110.0" width="34.0" height="24.0" rx="3" fill="#c9d8ee" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="166.0" y="110.0" width="34.0" height="24.0" rx="3" fill="#c9d8ee" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="204.0" y="110.0" width="34.0" height="24.0" rx="3" fill="#c9d8ee" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="242.0" y="110.0" width="34.0" height="24.0" rx="3" fill="#c9d8ee" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="280.0" y="110.0" width="34.0" height="24.0" rx="3" fill="#c9d8ee" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="318.0" y="110.0" width="34.0" height="24.0" rx="3" fill="#c9d8ee" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="356.0" y="110.0" width="34.0" height="24.0" rx="3" fill="#c9d8ee" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="394.0" y="110.0" width="34.0" height="24.0" rx="3" fill="#c9d8ee" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="432.0" y="110.0" width="34.0" height="24.0" rx="3" fill="#c9d8ee" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="470.0" y="110.0" width="34.0" height="24.0" rx="3" fill="#c9d8ee" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="508.0" y="110.0" width="34.0" height="24.0" rx="3" fill="#c9d8ee" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="546.0" y="110.0" width="34.0" height="24.0" rx="3" fill="#c9d8ee" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="584.0" y="110.0" width="34.0" height="24.0" rx="3" fill="#c9d8ee" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="622.0" y="110.0" width="34.0" height="24.0" rx="3" fill="#c9d8ee" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="660.0" y="110.0" width="34.0" height="24.0" rx="3" fill="#c9d8ee" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="76.0" y="160.0" text-anchor="start" font-size="10.8" fill="#6b6b6b" filter="url(#rough2)">…… 一条长链上的节点子树内容完全相同（都只含同一批串）</text>
  <rect x="60.0" y="200.0" width="660.0" height="110.0" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="76.0" y="224.0" text-anchor="start" font-size="11.0" fill="#2f5b34" filter="url(#rough2)">压缩后：只保留「分叉点」和「串尾」，边上记层数 ℓ</text>
  <rect x="120.0" y="240.0" width="90.0" height="40.0" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="165.0" y="265.0" text-anchor="middle" font-size="10.5" fill="#26405c" filter="url(#rough2)">root</text>
  <rect x="250.0" y="240.0" width="110.0" height="40.0" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="305.0" y="265.0" text-anchor="middle" font-size="10.5" fill="#26405c" filter="url(#rough2)">节点 ℓ=3</text>
  <rect x="420.0" y="240.0" width="120.0" height="40.0" rx="6" fill="#fff3d6" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="480.0" y="265.0" text-anchor="middle" font-size="10.5" fill="#8a6015" filter="url(#rough2)">分叉 ℓ=2</text>
  <path d="M 212.0 260.0 L 248.0 260.0" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 362.0 260.0 L 418.0 260.0" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="76.0" y="302.0" text-anchor="start" font-size="10.8" fill="#2f5b34" filter="url(#rough2)">压缩树上最多 2n 个节点 ⇒ 每个节点存 O(k) 的 DP 也只有 O(nk) 内存。</text>
  <rect x="60.0" y="330.0" width="660.0" height="56.0" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="354.0" text-anchor="start" font-size="11.2" fill="#8a6015" filter="url(#rough2)">边上 ℓ 层的贡献：这 ℓ 个节点的选中数都是 j ⇒ 记 ℓ·C(j,2) 一次性加上。</text>
  <text x="74.0" y="374.0" text-anchor="start" font-size="11.2" fill="#8a6015" filter="url(#rough2)">压缩用「排序后按 LCP 分组」递归建树，O(总长) 时间。</text>
</svg>
