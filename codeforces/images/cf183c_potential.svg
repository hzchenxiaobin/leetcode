<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="109"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="450" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">183C：DFS 赋势能，冲突给出 k 必须整除的差值</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <circle cx="140.0" cy="150.0" r="22.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="140.0" y="155.0" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <circle cx="320.0" cy="110.0" r="22.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="320.0" y="115.0" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="500.0" cy="170.0" r="22.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="500.0" y="175.0" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <circle cx="200.0" cy="300.0" r="22.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="200.0" y="305.0" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">−1</text>
  <circle cx="420.0" cy="300.0" r="22.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="420.0" y="305.0" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <line x1="140.0" y1="150.0" x2="320.0" y2="110.0" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="185.0" y="115.0" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+1</text>
  <line x1="320.0" y1="110.0" x2="500.0" y2="170.0" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="375.0" y="120.0" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+1</text>
  <line x1="140.0" y1="150.0" x2="200.0" y2="300.0" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150.0" y="230.0" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">−1</text>
  <line x1="500.0" y1="170.0" x2="420.0" y2="300.0" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="485.0" y="245.0" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">−1</text>
  <line x1="200.0" y1="300.0" x2="420.0" y2="300.0" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300.0" y="320.0" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">?</text>
  <rect x="400.0" y="60.0" width="280.0" height="70.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="414.0" y="82.8" text-anchor="start" font-size="10.8" fill="#3f3420" filter="url(#rough2)">沿弧 u→v：d[v] = d[u] + 1</text>
  <text x="414.0" y="106.8" text-anchor="start" font-size="10.8" fill="#3f3420" filter="url(#rough2)">反向沿同一条弧：d[u] = d[v] − 1</text>
  <rect x="40.0" y="366.0" width="640.0" height="62.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="54.0" y="389.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">遇到已访问的 v：k 必须整除 d[u] + delta − d[v]</text>
  <text x="54.0" y="413.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">把所有冲突取 gcd，就是最大的 k</text>
</svg>
