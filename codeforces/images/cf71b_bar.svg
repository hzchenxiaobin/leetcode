<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>

  <rect width="720" height="330" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">前缀满格 k、至多一个过渡格、后缀为 0</text>

  <!-- 样例 1：n=10 k=10 t=54 -->
  <text x="70" y="66" font-size="12.5" fill="#445566" filter="url(#rough2)">样例 1：n = 10, k = 10, t = 54% → Σ = 54</text>
  <g filter="url(#rough2)" font-size="13" fill="#2b3a4a" text-anchor="middle">
    <rect x="70" y="78" width="58" height="44" fill="#e8f0e0" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="128" y="78" width="58" height="44" fill="#e8f0e0" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="186" y="78" width="58" height="44" fill="#e8f0e0" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="244" y="78" width="58" height="44" fill="#e8f0e0" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="302" y="78" width="58" height="44" fill="#e8f0e0" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="360" y="78" width="58" height="44" fill="#fff8e1" stroke="#c9a227" stroke-width="2"/>
    <rect x="418" y="78" width="58" height="44" fill="#f2f2f2" stroke="#b0aca4" stroke-width="1.2"/>
    <rect x="476" y="78" width="58" height="44" fill="#f2f2f2" stroke="#b0aca4" stroke-width="1.2"/>
    <rect x="534" y="78" width="58" height="44" fill="#f2f2f2" stroke="#b0aca4" stroke-width="1.2"/>
    <rect x="592" y="78" width="58" height="44" fill="#f2f2f2" stroke="#b0aca4" stroke-width="1.2"/>
    <text x="99" y="106">10</text>
    <text x="157" y="106">10</text>
    <text x="215" y="106">10</text>
    <text x="273" y="106">10</text>
    <text x="331" y="106">10</text>
    <text x="389" y="106">4</text>
    <text x="447" y="106">0</text>
    <text x="505" y="106">0</text>
    <text x="563" y="106">0</text>
    <text x="621" y="106">0</text>
  </g>
  <text x="360" y="146" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">5 个满格 = 50，过渡格 4，总和 54</text>

  <!-- 样例 2：n=11 k=13 t=37 -->
  <text x="70" y="190" font-size="12.5" fill="#445566" filter="url(#rough2)">样例 2：n = 11, k = 13, t = 37% → Σ = ⌊52.91⌋ = 52</text>
  <g filter="url(#rough2)" font-size="12.5" fill="#2b3a4a" text-anchor="middle">
    <rect x="70" y="202" width="52" height="42" fill="#e8f0e0" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="122" y="202" width="52" height="42" fill="#e8f0e0" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="174" y="202" width="52" height="42" fill="#e8f0e0" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="226" y="202" width="52" height="42" fill="#e8f0e0" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="278" y="202" width="52" height="42" fill="#f2f2f2" stroke="#b0aca4" stroke-width="1.2"/>
    <rect x="330" y="202" width="52" height="42" fill="#f2f2f2" stroke="#b0aca4" stroke-width="1.2"/>
    <rect x="382" y="202" width="52" height="42" fill="#f2f2f2" stroke="#b0aca4" stroke-width="1.2"/>
    <rect x="434" y="202" width="52" height="42" fill="#f2f2f2" stroke="#b0aca4" stroke-width="1.2"/>
    <rect x="486" y="202" width="52" height="42" fill="#f2f2f2" stroke="#b0aca4" stroke-width="1.2"/>
    <rect x="538" y="202" width="52" height="42" fill="#f2f2f2" stroke="#b0aca4" stroke-width="1.2"/>
    <rect x="590" y="202" width="52" height="42" fill="#f2f2f2" stroke="#b0aca4" stroke-width="1.2"/>
    <text x="96" y="229">13</text>
    <text x="148" y="229">13</text>
    <text x="200" y="229">13</text>
    <text x="252" y="229">13</text>
    <text x="304" y="229">0</text>
    <text x="356" y="229">0</text>
    <text x="408" y="229">0</text>
    <text x="460" y="229">0</text>
    <text x="512" y="229">0</text>
    <text x="564" y="229">0</text>
    <text x="616" y="229">0</text>
  </g>
  <text x="360" y="272" text-anchor="middle" font-size="12" fill="#7a2f2c" filter="url(#rough2)">4 个满格 = 52；第 5 格若取 1 就会超过 37%，所以只能为 0</text>

  <text x="360" y="312" text-anchor="middle" font-size="12" fill="#4a4a4a" filter="url(#rough2)">格子值 = clamp(Σ - (i-1)·k, 0, k)，其中 Σ = ⌊n·k·t/100⌋</text>
</svg>
