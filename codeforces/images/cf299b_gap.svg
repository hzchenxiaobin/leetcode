<svg xmlns="http://www.w3.org/2000/svg" width="700" height="290" viewBox="0 0 700 290"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="731"/>
    <feDisplacementMap in="SourceGraphic" scale="1.5"/></filter></defs>
  <rect width="700" height="290" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">只能一次跳 ≤ k 格 ⇒ 连续石头段长 L 必须满足 L+1 ≤ k</text>
  <path d="M 110 40 Q 350 46 590 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="76" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="12.5" fill="#22314a" filter="url(#rough2)">要跨过一段长 L 的连续石头，必须从石头前一格直接跳到石头后一格：</text>
  <text x="76" y="106" font-size="12.5" fill="#22314a" filter="url(#rough2)">跳跃距离 = L + 1 格，因此必须 L + 1 ≤ k。</text>
  <text x="76" y="130" font-size="12.5" fill="#22314a" filter="url(#rough2)">反之若所有石头段都满足 L+1 ≤ k，就能逐段跳过 ⇒ 充分。</text>
  <g filter="url(#rough2)"><rect x="60" y="146" width="580" height="76" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="76" y="170" font-size="12.5" fill="#8a6015" filter="url(#rough2)">所以只需扫描最长的连续 '#' 段：若存在长度 ≥ k 的段 ⇒ NO，否则 YES。</text>
  <text x="76" y="194" font-size="12.5" fill="#8a6015" filter="url(#rough2)">（起点和终点保证是 '.'，所以不用考虑出发/落脚被石头挡住。）</text>
  <text x="76" y="212" font-size="11.5" fill="#8a6015" filter="url(#rough2)">注意：不是"石头总数"，而是"最长连续段"。</text>
  <g filter="url(#rough2)"><rect x="60" y="234" width="580" height="46" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="258" font-size="12.5" fill="#2f5223" filter="url(#rough2)">样例 2：".#.#."、k=2 ⇒ 每段长 1 ≤ 1 ✓ YES；样例 3：".#.###."、k=3 ⇒ 有长 3 段 ⇒ NO ✓</text>
  <text x="76" y="276" font-size="11.5" fill="#2f5223" filter="url(#rough2)">O(n)，n ≤ 3·10⁵。</text>
</svg>
