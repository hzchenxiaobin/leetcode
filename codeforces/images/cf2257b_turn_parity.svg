<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">整个算法只有一个不等式</text>
  <text x="320" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">把「逐回合模拟」换成两个闭式公式，再比一次大小</text>

  <!-- 步骤 1 -->
  <rect x="170" y="64" width="300" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="320" y="84" text-anchor="middle" font-size="11" fill="#2c3e50" filter="url(#rough2)">读入 n, m 与两座山脉</text>
  <text x="320" y="100" text-anchor="middle" font-size="9.5" fill="#5b7a99" filter="url(#rough2)">只需留住 a_1 与 b_1，其余数字读掉即弃</text>

  <path d="M 320 110 L 320 130" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 2 -->
  <rect x="80" y="132" width="480" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="320" y="154" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">T_A = a_1 + (n − 1)　←　Ver 要砸中 Bea 这么多次才能赢</text>
  <text x="320" y="176" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">T_V = b_1 + (m − 1)　←　Bea 要砸中 Ver 这么多次才能赢</text>
  <text x="320" y="196" text-anchor="middle" font-size="9.5" fill="#6b8f5c" filter="url(#rough2)">两者都只依赖「首座高度 + 山数 − 1」</text>

  <path d="M 320 210 L 320 228" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="320,230 470,274 320,318 170,274" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">T_V ≤ T_A ?</text>
  <text x="320" y="288" text-anchor="middle" font-size="9" fill="#8a6a20" filter="url(#rough2)">（含相等）</text>

  <path d="M 196 296 L 160 330" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="196" y="322" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 444 296 L 480 330" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="452" y="318" font-size="9.5" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="60" y="332" width="200" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="160" y="358" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">输出 1：Bea 胜</text>

  <rect x="380" y="332" width="200" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="480" y="358" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">输出 2：Ver 胜</text>

  <!-- 回合表 -->
  <text x="40" y="400" font-size="10.5" font-weight="bold" fill="#555" filter="url(#rough2)">为什么判据含相等：同一序号 k 的两次投石，Bea 总在前</text>

  <rect x="40" y="410" width="120" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="100" y="428" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">回合 1：Bea #1</text>
  <rect x="180" y="410" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="240" y="428" text-anchor="middle" font-size="10" fill="#2c3e50" filter="url(#rough2)">回合 2：Ver #1</text>
  <rect x="320" y="410" width="120" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="380" y="428" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">回合 3：Bea #2</text>
  <rect x="460" y="410" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="520" y="428" text-anchor="middle" font-size="10" fill="#2c3e50" filter="url(#rough2)">回合 4：Ver #2</text>
  <text x="604" y="429" font-size="13" fill="#888" filter="url(#rough2)">…</text>

  <text x="320" y="460" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">Bea 第 k 次投石落在第 2k−1 回合，Ver 第 k 次落在第 2k 回合；T_V = T_A 时 Bea 抢先砸空对手</text>
</svg>
