<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="380" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每场奥赛占一段准备期，答案是"同一天的人数峰值"</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">准备期 = [比赛日 - t, 比赛日 - 1]，用差分数组累加即可</text>
  <g filter="url(#rough2)"><rect x="120" y="110" width="120" height="36" rx="3" fill="#d7ecd0" fill-opacity="0.75" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="110" y="134" text-anchor="end" font-size="12" fill="#555555" filter="url(#rough2)">奥赛 A（p=2, t=3）</text>
  <g filter="url(#rough2)"><rect x="210" y="164" width="120" height="36" rx="3" fill="#cfe0f0" fill-opacity="0.75" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="200" y="188" text-anchor="end" font-size="12" fill="#555555" filter="url(#rough2)">奥赛 B（p=1, t=3）</text>
  <g filter="url(#rough2)"><rect x="270" y="218" width="120" height="36" rx="3" fill="#f6d9d7" fill-opacity="0.75" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="260" y="242" text-anchor="end" font-size="12" fill="#555555" filter="url(#rough2)">奥赛 C（p=2, t=2）</text>
  <line x1="240" y1="96" x2="240" y2="300" stroke="#b05a5a" stroke-width="1.1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="240" y="318" text-anchor="middle" font-size="11" fill="#b05a5a" filter="url(#rough2)">B 开始</text>
  <line x1="330" y1="96" x2="330" y2="300" stroke="#b05a5a" stroke-width="1.1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="330" y="318" text-anchor="middle" font-size="11" fill="#b05a5a" filter="url(#rough2)">B 结束</text>
  <line x1="390" y1="96" x2="390" y2="300" stroke="#b05a5a" stroke-width="1.1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="390" y="318" text-anchor="middle" font-size="11" fill="#b05a5a" filter="url(#rough2)">C 结束</text>
  <text x="440" y="356" text-anchor="middle" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">同一天重叠的人数 = 当天要同时工作的人数，取最大值就是最小陪审团规模</text>
</svg>
