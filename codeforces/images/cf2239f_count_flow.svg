<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 412" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="620" height="412" fill="#fafafa" filter="url(#rough2)"/>
  <text x="310" y="26" text-anchor="middle" font-size="15.5" fill="#333" filter="url(#rough2)">算法流程：容斥 → 数「S 偶 且不被单色支配」的选取</text>

  <rect x="60" y="44" width="500" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="72" y="66" font-size="11.5" fill="#333" filter="url(#rough2)">① 容斥：答案 ≡ #{T : F(b^T) 为奇} (mod 2)，b^T_i = l_i−1 (i∈T) 或 r_i</text>
  <text x="72" y="85" font-size="11" fill="#446688" filter="url(#rough2)">F(b) 为奇 ⟺ Σb 偶 且 2·max b ≤ Σb（上一页的引理）</text>

  <line x1="310" y1="94" x2="310" y2="102" stroke="#446688" stroke-width="1.4" marker-end="url(#arr3)" filter="url(#rough2)"/>

  <rect x="60" y="104" width="500" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="72" y="126" font-size="11.5" fill="#333" filter="url(#rough2)">② 每色二选一：高值 r_i / 低值 l_i−1；记 m_i 为较小者，δ_i = r_i − m_i，L = Σm_i</text>
  <text x="72" y="145" font-size="11" fill="#4a7a3a" filter="url(#rough2)">选高值的集合 U ⊆ K = {i : l_i ≥ 1}，则 S = L + Σ_{i∈U} δ_i</text>

  <line x1="310" y1="154" x2="310" y2="162" stroke="#446688" stroke-width="1.4" marker-end="url(#arr3)" filter="url(#rough2)"/>

  <rect x="60" y="164" width="500" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="72" y="186" font-size="11.5" fill="#333" filter="url(#rough2)">③ A = #{U : S 偶}：S 的奇偶只由 Σδ 决定，按「奇数个奇数 δ_i」直接算出</text>
  <text x="72" y="205" font-size="11" fill="#d6a040" filter="url(#rough2)">④ B = #{U : S 偶 且存在支配色}：支配色唯一，且 S &lt; 2·max r_i 才可能支配</text>

  <line x1="310" y1="214" x2="310" y2="222" stroke="#446688" stroke-width="1.4" marker-end="url(#arr3)" filter="url(#rough2)"/>

  <rect x="60" y="224" width="500" height="50" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="72" y="246" font-size="11.5" fill="#333" filter="url(#rough2)">⑤ 固定支配色 i 与取值 v：其余颜色独立选取</text>
  <text x="72" y="265" font-size="11" fill="#b85450" filter="url(#rough2)">需 D′ &lt; R 且 D′ ≡ R (mod 2)，其中 R = v + m_i − L ≤ max r_i</text>

  <line x1="310" y1="274" x2="310" y2="282" stroke="#446688" stroke-width="1.4" marker-end="url(#arr3)" filter="url(#rough2)"/>

  <rect x="60" y="284" width="500" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="72" y="306" font-size="11.5" fill="#333" filter="url(#rough2)">⑥ P(x) = ∏(1+x^{δ_j}) mod 2；W[n] = 同奇偶前缀异或 ⇒ contrib = W[R−2] ⊕ W[R−2−δ_i] ⊕ …</text>
  <text x="72" y="325" font-size="11" fill="#446688" filter="url(#rough2)">同色合并 + 位集移位异或：总代价 O(max r² / 64)</text>

  <line x1="310" y1="334" x2="310" y2="342" stroke="#446688" stroke-width="1.4" marker-end="url(#arr3)" filter="url(#rough2)"/>

  <rect x="150" y="344" width="320" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="366" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">answer = (A − B) mod 2</text>
  <text x="310" y="383" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">l_i = 0 的强制色：不排除自己，contrib = W[2r_i−L−2]</text>
</svg>
