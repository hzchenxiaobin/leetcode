<svg xmlns="http://www.w3.org/2000/svg" width="780" height="470" viewBox="0 0 780 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="19"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="780" height="470" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：x = 3, y = 8, k = 6 ⇒ d = 5, m = 3</text>
  <text x="390" y="52" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">红色三行按定义取余，绿色三行余数全部等于 d = 5</text>

  <!-- 表头 -->
  <rect x="60" y="70" width="80" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="91" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">月份 i</text>
  <rect x="140" y="70" width="115" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="197" y="91" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">a = x + i</text>
  <rect x="255" y="70" width="115" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="312" y="91" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">b = y + i</text>
  <rect x="370" y="70" width="130" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="435" y="91" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">b mod a</text>

  <!-- 行 0..2：需要真取余 -->
  <rect x="60" y="104" width="80" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="100" y="125" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">0</text>
  <rect x="140" y="104" width="115" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="197" y="125" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">3</text>
  <rect x="255" y="104" width="115" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="312" y="125" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">8</text>
  <rect x="370" y="104" width="130" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="435" y="125" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">5 mod 3 = 2</text>

  <rect x="60" y="136" width="80" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="100" y="157" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">1</text>
  <rect x="140" y="136" width="115" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="197" y="157" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">4</text>
  <rect x="255" y="136" width="115" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="312" y="157" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">9</text>
  <rect x="370" y="136" width="130" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="435" y="157" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">5 mod 4 = 1</text>

  <rect x="60" y="168" width="80" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="100" y="189" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">2</text>
  <rect x="140" y="168" width="115" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="197" y="189" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">5</text>
  <rect x="255" y="168" width="115" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="312" y="189" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">10</text>
  <rect x="370" y="168" width="130" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="435" y="189" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">5 mod 5 = 0</text>

  <!-- 行 3..5：余数恒为 d -->
  <rect x="60" y="200" width="80" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="100" y="221" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">3</text>
  <rect x="140" y="200" width="115" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="197" y="221" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">6</text>
  <rect x="255" y="200" width="115" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="312" y="221" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">11</text>
  <rect x="370" y="200" width="130" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="435" y="221" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">5 mod 6 = 5</text>

  <rect x="60" y="232" width="80" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="100" y="253" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">4</text>
  <rect x="140" y="232" width="115" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="197" y="253" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">7</text>
  <rect x="255" y="232" width="115" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="312" y="253" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">12</text>
  <rect x="370" y="232" width="130" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="435" y="253" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">5 mod 7 = 5</text>

  <rect x="60" y="264" width="80" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="100" y="285" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">5</text>
  <rect x="140" y="264" width="115" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="197" y="285" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">8</text>
  <rect x="255" y="264" width="115" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="312" y="285" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">13</text>
  <rect x="370" y="264" width="130" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="435" y="285" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">5 mod 8 = 5</text>

  <rect x="518" y="70" width="242" height="226" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="534" y="96" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">读表三件事</text>
  <text x="534" y="122" font-size="11" fill="#8a6015" filter="url(#rough2)">① a 与 b 同步 +1，差恒为 5</text>
  <text x="534" y="146" font-size="11" fill="#8a6015" filter="url(#rough2)">② a ≤ 5 时余数随 a 变化</text>
  <text x="534" y="170" font-size="11" fill="#8a6015" filter="url(#rough2)">③ a &gt; 5 时余数一律是 5</text>
  <text x="534" y="200" font-size="11" fill="#a14340" filter="url(#rough2)">红：2 + 1 + 0 = 3（3 次取余）</text>
  <text x="534" y="224" font-size="11" fill="#3c5e2e" filter="url(#rough2)">绿：5 × 3 = 15（一次乘法）</text>
  <text x="534" y="256" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3 + 15 = 18</text>
  <text x="534" y="280" font-size="10.5" fill="#66788c" filter="url(#rough2)">与官方解释逐月 2,1,0,5,5,5 一致</text>

  <rect x="60" y="316" width="700" height="132" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="78" y="344" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">合并：答案 = 前缀和 + (k − m) × d = 3 + (6 − 3) × 5 = 18</text>
  <text x="78" y="370" font-size="11.5" fill="#446688" filter="url(#rough2)">另取例 2：x = 10, y = 25, k = 100 ⇒ d = 15，m = min(100, 15 − 10 + 1) = 6</text>
  <text x="78" y="396" font-size="11.5" fill="#446688" filter="url(#rough2)">前 6 月：15%10 + 15%11 + 15%12 + 15%13 + 15%14 + 15%15 = 5 + 4 + 3 + 2 + 1 + 0 = 15</text>
  <text x="78" y="422" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">后 94 月：94 × 15 = 1410 ⇒ 15 + 1410 = 1425，与官方样例一致</text>
</svg>
