<svg xmlns="http://www.w3.org/2000/svg" width="880" height="260" viewBox="0 0 880 260"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="260" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例：NO 与 YES</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">单列也按同样规则判定</text>
  <text x="150" y="110" text-anchor="start" font-size="13" fill="#2b2b2b" filter="url(#rough2)">样例 1：WWBW / BWWW / WWWB 三个黑格互不相邻</text>
  <text x="150" y="150" text-anchor="start" font-size="13" fill="#b05a5a" filter="url(#rough2)">任意 L 路径都会经过白格 → NO</text>
  <text x="150" y="196" text-anchor="start" font-size="13" fill="#3d6b2f" filter="url(#rough2)">样例 2：3×1 的 BB W → 一条竖线 → YES</text>
</svg>
