<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="461"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="260" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">样例 1 的三行推荐</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">出租车 1 人、披萨 3 人并列、女孩 1 人</text>
  <text x="450" y="100" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">出租车：Rogulenko（6 个）</text>
  <text x="450" y="134" text-anchor="middle" font-size="12.5" fill="#b06a1e" filter="url(#rough2)">披萨：Fedorov, Rogulenko, Kaluzhin（各 1 个）</text>
  <text x="450" y="168" text-anchor="middle" font-size="12.5" fill="#8a2b28" filter="url(#rough2)">女孩：Melnikov（3 个）</text>
  <text x="450" y="214" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">输出格式：短语 + 名字(逗号分隔) + 句点</text>
</svg>
