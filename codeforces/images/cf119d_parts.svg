<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1197"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="760" height="320" fill="#fafafa"/>
  <text x="380.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">三段分解</text>
  <path d="M 121.60000000000001 42 Q 380.0 48 638.4 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="380.0" y="306" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">b = a[i+1..j−1] + rev(a[j..n−1]) + rev(a[0..i])</text>
  <rect x="70" y="80" width="200" height="70" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170.0" y="108" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">a[i+1..j−1]</text>
  <text x="170.0" y="130" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">长度 t = j−1−i</text>
  <rect x="270" y="80" width="200" height="70" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="370.0" y="108" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#d6a040" filter="url(#rough2)">rev(a[j..n−1])</text>
  <text x="370.0" y="130" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">长度 L−t</text>
  <rect x="470" y="80" width="200" height="70" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="570.0" y="108" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#5a7fb0" filter="url(#rough2)">rev(a[0..i])</text>
  <text x="570.0" y="130" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">长度 i+1</text>
  <text x="380" y="185" text-anchor="middle" font-size="12" fill="#335478" filter="url(#rough2)">尾部：b 的后 i+1 位 = rev(a[0..i]) ⇔ i+1 ≤ LCS(b, rev(a))</text>
  <text x="380" y="215" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">头部：b[0..L−1] = S[0..t−1] + rev(a)[0..L−1−t]</text>
  <text x="380" y="245" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">用两份 Z 函数把 LCP 变 O(1)，线段树查最小的 t 使 f(t) = Z3[t]+t ≥ L</text>
  <text x="380" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">从大到小枚举 i：第一个可行的就是最大 i，其最小 t 给出最小 j</text>
</svg>
