<svg xmlns="http://www.w3.org/2000/svg" width="760" height="398" viewBox="0 0 760 398"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c9801f"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a8524a"/>
    </marker>
  </defs>
  <rect width="760" height="398" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">什么算「一步」：同一条直线上的连续巧克力</text>
  <text x="380.0" y="60.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">示例直线：O O . O O（5 个位置）</text>
  <rect x="170.0" y="84.0" width="72.0" height="48.0" fill="#fdf3e3" stroke="#c9801f" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="206.0" y="114.5" text-anchor="middle" font-size="18" fill="#2b2b2b" filter="url(#rough2)">O</text>
  <rect x="254.0" y="84.0" width="72.0" height="48.0" fill="#fdf3e3" stroke="#c9801f" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290.0" y="114.5" text-anchor="middle" font-size="18" fill="#2b2b2b" filter="url(#rough2)">O</text>
  <rect x="338.0" y="84.0" width="72.0" height="48.0" fill="#f2f2f2" stroke="#cfcfcf" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="374.0" y="114.5" text-anchor="middle" font-size="18" fill="#2b2b2b" filter="url(#rough2)">.</text>
  <rect x="422.0" y="84.0" width="72.0" height="48.0" fill="#fdf3e3" stroke="#c9801f" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="458.0" y="114.5" text-anchor="middle" font-size="18" fill="#2b2b2b" filter="url(#rough2)">O</text>
  <rect x="506.0" y="84.0" width="72.0" height="48.0" fill="#fdf3e3" stroke="#c9801f" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="542.0" y="114.5" text-anchor="middle" font-size="18" fill="#2b2b2b" filter="url(#rough2)">O</text>
  <rect x="60.0" y="156.0" width="640.0" height="36.0" rx="8" fill="#f4f9f2" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="74.0" y="180.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">吃第 1 个</text>
  <text x="330.0" y="180.0" text-anchor="start" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">合法（长度 1 的段）</text>
  <rect x="60.0" y="198.0" width="640.0" height="36.0" rx="8" fill="#f4f9f2" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="74.0" y="222.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">吃第 1、2 个</text>
  <text x="330.0" y="222.0" text-anchor="start" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">合法（相邻两格）</text>
  <rect x="60.0" y="240.0" width="640.0" height="36.0" rx="8" fill="#f4f9f2" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="74.0" y="264.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">吃第 4、5 个</text>
  <text x="330.0" y="264.0" text-anchor="start" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">合法（相邻两格）</text>
  <rect x="60.0" y="282.0" width="640.0" height="36.0" rx="8" fill="#fbeeee" stroke="#a8524a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="74.0" y="306.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">吃第 1、2、4、5 个</text>
  <text x="330.0" y="306.0" text-anchor="start" font-size="11.5" fill="#a8524a" font-weight="bold" filter="url(#rough2)">非法：中间隔着空格，不连续</text>
  <rect x="60.0" y="324.0" width="640.0" height="36.0" rx="8" fill="#fbeeee" stroke="#a8524a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="74.0" y="348.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">吃第 1、4 个</text>
  <text x="330.0" y="348.0" text-anchor="start" font-size="11.5" fill="#a8524a" font-weight="bold" filter="url(#rough2)">非法：不连续</text>
  <text x="380.0" y="384.0" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">只能吃「一条直线上的一段连续巧克力」，不能跨空格、不能跨直线。</text>
</svg>
