<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="380" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">一步能把 x 变成区间 [x^{1/4}, x^{1/2}] 里的任意 y</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">所以 g(x) = mex{ g(y) : y 在这个区间里 }</text>
  <line x1="90" y1="240" x2="800" y2="240" stroke="#8899aa" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="120" y="268" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">0</text>
  <text x="400" y="268" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">x^{1/4}</text>
  <text x="620" y="268" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">x^{1/2}</text>
  <text x="760" y="268" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">x</text>
  <line x1="400" y1="232" x2="400" y2="248" stroke="#8899aa" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="620" y1="232" x2="620" y2="248" stroke="#8899aa" stroke-width="1.1" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="400" y="210" width="220" height="30" rx="3" fill="#d7ecd0" fill-opacity="0.8" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="510" y="200" text-anchor="middle" font-size="12" fill="#3d6b2f" filter="url(#rough2)">可选的 y</text>
  <text x="510" y="300" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">区间内的 g 值决定 mex</text>
  <text x="120" y="130" text-anchor="start" font-size="13" fill="#2b2b2b" filter="url(#rough2)">关键：区间上界 floor(sqrt(x)) 一定 ≤ sqrt(max a)</text>
  <text x="120" y="158" text-anchor="start" font-size="13" fill="#2f4a66" filter="url(#rough2)">→ 只需把 g 预处理到 sqrt(7.7e11) ≈ 881917</text>
  <text x="120" y="186" text-anchor="start" font-size="12.5" fill="#555555" filter="url(#rough2)">更大的 x 的 g 值可以"现算"：区间落在已算好的范围内</text>
  <text x="440" y="350" text-anchor="middle" font-size="12.5" fill="#b05a5a" filter="url(#rough2)">整体：预处理 8.8×10^5 项 + 每个询问 O(1) 次二分</text>
</svg>
