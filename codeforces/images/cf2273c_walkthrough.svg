<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="720" height="420" fill="#fafafa"/>

  <text x="360" y="38" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">样例 2 走查：C 的四个格子怎么变</text>

  <!-- 表头 -->
  <rect x="24" y="100" width="240" height="40" fill="#c9dbf5" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="144" y="125" text-anchor="middle" font-size="12" fill="#2f4f6f" filter="url(#rough2)">操作</text>
  <rect x="264" y="100" width="70" height="40" fill="#c9dbf5" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="299" y="125" text-anchor="middle" font-size="12" fill="#2f4f6f" filter="url(#rough2)">C(2,2)</text>
  <rect x="334" y="100" width="70" height="40" fill="#c9dbf5" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="369" y="125" text-anchor="middle" font-size="12" fill="#2f4f6f" filter="url(#rough2)">C(2,3)</text>
  <rect x="404" y="100" width="70" height="40" fill="#c9dbf5" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="439" y="125" text-anchor="middle" font-size="12" fill="#2f4f6f" filter="url(#rough2)">C(3,2)</text>
  <rect x="474" y="100" width="70" height="40" fill="#c9dbf5" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="509" y="125" text-anchor="middle" font-size="12" fill="#2f4f6f" filter="url(#rough2)">C(3,3)</text>
  <rect x="544" y="100" width="156" height="40" fill="#c9dbf5" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="622" y="125" text-anchor="middle" font-size="12" fill="#2f4f6f" filter="url(#rough2)">判定</text>

  <!-- 第 1 行：初始 -->
  <rect x="24" y="140" width="240" height="40" fill="#eef1f5" stroke="#8a97a8" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="144" y="165" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">初始（d = 3i + j − 3）</text>
  <rect x="264" y="140" width="70" height="40" fill="#eef1f5" stroke="#8a97a8" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="299" y="165" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="334" y="140" width="70" height="40" fill="#eef1f5" stroke="#8a97a8" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="369" y="165" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="404" y="140" width="70" height="40" fill="#eef1f5" stroke="#8a97a8" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="439" y="165" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="474" y="140" width="70" height="40" fill="#eef1f5" stroke="#8a97a8" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="509" y="165" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="544" y="140" width="156" height="40" fill="#eef1f5" stroke="#8a97a8" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="622" y="165" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">—</text>

  <!-- 第 2 行：第一次询问 -->
  <rect x="24" y="180" width="240" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="144" y="205" text-anchor="middle" font-size="11.5" fill="#33502a" filter="url(#rough2)">Q 1 1 2 3</text>
  <rect x="264" y="180" width="70" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="299" y="205" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="334" y="180" width="70" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="369" y="205" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="404" y="180" width="70" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="439" y="205" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="474" y="180" width="70" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="509" y="205" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="544" y="180" width="156" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="622" y="205" text-anchor="middle" font-size="12" fill="#33502a" filter="url(#rough2)">YES</text>

  <!-- 第 3 行：第一次更新 -->
  <rect x="24" y="220" width="240" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="144" y="245" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">U 1 1 1 1 5</text>
  <rect x="264" y="220" width="70" height="40" fill="#fff8e1" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="299" y="245" text-anchor="middle" font-size="12" fill="#8a3030" filter="url(#rough2)">−5</text>
  <rect x="334" y="220" width="70" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="369" y="245" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="404" y="220" width="70" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="439" y="245" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="474" y="220" width="70" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="509" y="245" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="544" y="220" width="156" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="622" y="245" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">只有角 ① 在域内</text>

  <!-- 第 4 行：第二次询问 -->
  <rect x="24" y="260" width="240" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="144" y="285" text-anchor="middle" font-size="11.5" fill="#8a3030" filter="url(#rough2)">Q 1 1 2 3</text>
  <rect x="264" y="260" width="70" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="299" y="285" text-anchor="middle" font-size="12" fill="#8a3030" filter="url(#rough2)">−5</text>
  <rect x="334" y="260" width="70" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="369" y="285" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="404" y="260" width="70" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="439" y="285" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="474" y="260" width="70" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="509" y="285" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="544" y="260" width="156" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="622" y="285" text-anchor="middle" font-size="12" fill="#8a3030" filter="url(#rough2)">NO</text>

  <!-- 第 5 行：第二次更新 -->
  <rect x="24" y="300" width="240" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="144" y="325" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">U 1 2 1 3 5</text>
  <rect x="264" y="300" width="70" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="299" y="325" text-anchor="middle" font-size="12" fill="#33502a" filter="url(#rough2)">0</text>
  <rect x="334" y="300" width="70" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="369" y="325" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="404" y="300" width="70" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="439" y="325" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="474" y="300" width="70" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="509" y="325" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="544" y="300" width="156" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="622" y="325" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">角 ① 得 +5</text>

  <!-- 第 6 行：第三次询问 -->
  <rect x="24" y="340" width="240" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="144" y="365" text-anchor="middle" font-size="11.5" fill="#33502a" filter="url(#rough2)">Q 1 1 2 3</text>
  <rect x="264" y="340" width="70" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="299" y="365" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="334" y="340" width="70" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="369" y="365" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="404" y="340" width="70" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="439" y="365" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="474" y="340" width="70" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="509" y="365" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="544" y="340" width="156" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="622" y="365" text-anchor="middle" font-size="12" fill="#33502a" filter="url(#rough2)">YES</text>

  <text x="24" y="404" font-size="11.5" fill="#555" filter="url(#rough2)">n = 3 时 C 只有 (2,2)、(2,3)、(3,2)、(3,3) 四格；初始 d = 3i + j − 3 可分解为 h_i + w_j，故 C 全 0。</text>
</svg>
