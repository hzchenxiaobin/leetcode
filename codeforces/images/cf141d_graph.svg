<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1415"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="720" height="320" fill="#fafafa"/>
  <text x="360.0" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">坐标压缩后跑 Dijkstra</text>
  <path d="M 115.2 42 Q 360.0 48 604.8 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 40.0 170.0 L 668.0 170.0" stroke="#555555" stroke-width="1.4" fill="none" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <rect x="46" y="152" width="44" height="34" rx="5" fill="#e8eef7" stroke="#335478" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="68.0" y="173.3" text-anchor="middle" font-size="12.0" fill="#335478" filter="url(#rough2)">0</text>
  <rect x="183" y="152" width="44" height="34" rx="5" fill="#e8eef7" stroke="#335478" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="205.0" y="173.3" text-anchor="middle" font-size="12.0" fill="#335478" filter="url(#rough2)">5</text>
  <rect x="448" y="152" width="44" height="34" rx="5" fill="#e8eef7" stroke="#335478" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470.0" y="173.3" text-anchor="middle" font-size="12.0" fill="#335478" filter="url(#rough2)">15</text>
  <rect x="598" y="152" width="44" height="34" rx="5" fill="#e8eef7" stroke="#335478" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="620.0" y="173.3" text-anchor="middle" font-size="12.0" fill="#335478" filter="url(#rough2)">20</text>
  <path d="M 90.0 166.0 L 174.0 166.0" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 183.0 166.0 L 174.0 170.0 L 174.0 162.0 Z" fill="#4a7a3a" filter="url(#rough2)"/>
  <path d="M 183.0 174.0 L 99.0 174.0" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 90.0 174.0 L 99.0 170.0 L 99.0 178.0 Z" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="136.5" y="224.0" text-anchor="middle" font-size="11.0" fill="#2f5223" filter="url(#rough2)">5 m</text>
  <path d="M 227.0 166.0 L 439.0 166.0" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 448.0 166.0 L 439.0 170.0 L 439.0 162.0 Z" fill="#4a7a3a" filter="url(#rough2)"/>
  <path d="M 448.0 174.0 L 236.0 174.0" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 227.0 174.0 L 236.0 170.0 L 236.0 178.0 Z" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="337.5" y="224.0" text-anchor="middle" font-size="11.0" fill="#2f5223" filter="url(#rough2)">10 m</text>
  <path d="M 492.0 166.0 L 589.0 166.0" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 598.0 166.0 L 589.0 170.0 L 589.0 162.0 Z" fill="#4a7a3a" filter="url(#rough2)"/>
  <path d="M 598.0 174.0 L 501.0 174.0" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 492.0 174.0 L 501.0 170.0 L 501.0 178.0 Z" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="545.0" y="224.0" text-anchor="middle" font-size="11.0" fill="#2f5223" filter="url(#rough2)">5 m</text>
  <text x="90.0" y="246.0" text-anchor="start" font-size="11.0" fill="#555555" filter="url(#rough2)">走路边：双向，代价 = 坐标差</text>
  <path d="M 90.0 152.0 L 253.8 77.7" stroke="#8c5a2c" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 262.0 74.0 L 255.5 81.4 L 252.2 74.1 Z" fill="#8c5a2c" filter="url(#rough2)"/>
  <text x="268.0" y="66.0" text-anchor="start" font-size="11.5" fill="#8c5a2c" filter="url(#rough2)">跳板 1：从 0 助跑 5 m、飞行 5 s → 落在 15，代价 p+t = 10</text>
  <text x="60.0" y="292.0" text-anchor="start" font-size="11.5" fill="#8c2f2c" filter="url(#rough2)">跳板 2 需要从 x = −3 助跑，越过起点线，直接丢掉这条边</text>
  <text x="360.0" y="306" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">点集 = {0, L} ∪ {x_i, x_i+d_i, x_i−p_i}，共 O(n) 个</text>
</svg>
