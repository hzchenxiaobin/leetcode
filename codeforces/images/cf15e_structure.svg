<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="171"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="440" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">n = 2k 层：顶部小三角 + 左右两条“半路线”</text>
  <path d="M 120 44 Q 380 50 640 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 外三角 -->
  <polygon points="380,64 120,360 640,360" fill="#ffffff" stroke="#2b2b2b" stroke-width="2" filter="url(#rough2)"/>

  <!-- 层线 -->
  <line x1="330" y1="120" x2="430" y2="120" stroke="#c9c2b4" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <line x1="300" y1="160" x2="460" y2="160" stroke="#c9c2b4" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <line x1="270" y1="200" x2="490" y2="200" stroke="#c9c2b4" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <line x1="240" y1="240" x2="520" y2="240" stroke="#c9c2b4" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <line x1="210" y1="280" x2="550" y2="280" stroke="#c9c2b4" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <line x1="180" y1="320" x2="580" y2="320" stroke="#c9c2b4" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- 顶部小三角 -->
  <polygon points="380,64 330,120 430,120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="58" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">H</text>
  <text x="380" y="106" text-anchor="middle" font-size="10" fill="#2f5223" filter="url(#rough2)">顶部</text>

  <!-- 中央密林 -->
  <polygon points="380,140 300,340 460,340" fill="#d9d9d9" stroke="#8a8a8a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="260" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">中央密林</text>
  <text x="380" y="278" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">（路线不能进入）</text>

  <!-- 阶梯边 -->
  <polyline points="380,140 360,140 360,180 345,180 345,220 330,220 330,260 315,260 315,300 300,300 300,340"
            fill="none" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <polyline points="380,140 400,140 400,180 415,180 415,220 430,220 430,260 445,260 445,300 460,300 460,340"
            fill="none" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- 左右两侧路线示意 -->
  <polyline points="380,64 260,280 300,300 330,220 380,140" fill="none" stroke="#446688" stroke-width="2.2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <polyline points="380,64 500,280 460,300 430,220 380,140" fill="none" stroke="#4a7a3a" stroke-width="2.2" stroke-dasharray="6 4" filter="url(#rough2)"/>

  <text x="180" y="300" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">左半边</text>
  <text x="580" y="300" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">右半边</text>

  <!-- 层号 -->
  <text x="118" y="124" font-size="10" fill="#777" filter="url(#rough2)">第 1 层</text>
  <text x="96" y="164" font-size="10" fill="#777" filter="url(#rough2)">第 2 层</text>
  <text x="76" y="204" font-size="10" fill="#777" filter="url(#rough2)">第 3 层</text>
  <text x="60" y="244" font-size="10" fill="#777" filter="url(#rough2)">…</text>
  <text x="60" y="324" font-size="10" fill="#777" filter="url(#rough2)">第 k 层</text>

  <!-- 结论 -->
  <rect x="60" y="376" width="640" height="48" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="78" y="397" font-size="11.5" fill="#8a6015" filter="url(#rough2)">图关于竖直中线对称；只需数“左半边向下再回来”的半路线数 H，右半边同样多。</text>
  <text x="78" y="416" font-size="11.5" fill="#8a6015" filter="url(#rough2)">最终路线数 = 2H² + 8H + 10（两边都用 / 只用一边 / 都不用）。</text>
</svg>
