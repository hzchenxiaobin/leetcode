<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="350" fill="#fafafa"/>
  <text x="360.0" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">207C3：二分 + 字符串树 + 树状数组</text>
  <path d="M 144.00 46 Q 360.0 52 576.00 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="72" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">好组合 (i,j,q)：树 2 中 j 到 q 的前向路径串 = 树 1 中 i 到根的后向路径串。</text>
  <text x="60" y="92" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">记 S1(i) 为 i 到根的边字母串（向上串），P2(q) 为根到 q 的串（向下串）。</text>
  <rect x="60" y="116" width="300" height="96" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="134" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">条件 ⟺ S1(i) 是 P2(q) 的某个后缀</text>
  <text x="74" y="156" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">（后缀长度 = depth(q) − depth(j)）。</text>
  <text x="74" y="178" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">于是答案 = Σ_q #{i : S1(i) 为 P2(q) 的后缀}</text>
  <text x="74" y="200" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">每次操作增量地维护它。</text>
  <rect x="380" y="116" width="290" height="96" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="394" y="134" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">用 64 位哈希表示串：</text>
  <text x="394" y="156" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">S1(i) = c + S1(parent)（前插）</text>
  <text x="394" y="178" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">P2(q) 的后缀哈希用根路径哈希相减</text>
  <text x="394" y="200" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">维护 cnt1[hash]、cnt2[hash] 两个表。</text>
  <text x="60" y="240" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">新增树 1 叶子：答案 += cnt2[S1(i)]；新增树 2 叶子 q：沿祖先链把所有后缀 +1。</text>
  <rect x="60" y="262" width="620" height="62" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="279" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">本</text>
  <text x="74" y="300" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">版</text>
  <text x="74" y="321" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">：</text>
  <text x="74" y="342" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">1</text>
  <text x="74" y="363" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)"> </text>
  <text x="74" y="384" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">≤</text>
  <text x="74" y="405" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)"> </text>
  <text x="74" y="426" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">n</text>
  <text x="74" y="447" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)"> </text>
  <text x="74" y="468" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">≤</text>
  <text x="74" y="489" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)"> </text>
  <text x="74" y="510" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">1</text>
  <text x="74" y="531" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">0</text>
  <text x="74" y="552" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">⁵</text>
  <text x="74" y="573" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">，</text>
  <text x="74" y="594" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">需</text>
  <text x="74" y="615" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">要</text>
  <text x="74" y="636" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)"> </text>
  <text x="74" y="657" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">O</text>
  <text x="74" y="678" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">(</text>
  <text x="74" y="699" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">n</text>
  <text x="74" y="720" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)"> </text>
  <text x="74" y="741" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">l</text>
  <text x="74" y="762" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">o</text>
  <text x="74" y="783" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">g</text>
  <text x="74" y="804" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)"> </text>
  <text x="74" y="825" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">n</text>
  <text x="74" y="846" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">)</text>
  <text x="74" y="867" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">。</text>
</svg>
