<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="487"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 z" fill="#8a6015"/>
    </marker>
  </defs>

  <rect width="760" height="320" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">C：枚举 6! 种角色分配，取字典序最小的网格</text>
  <path d="M 170 40 Q 380 45 590 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <rect x="40" y="64" width="150" height="62" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="115" y="88" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">六个词 → 六个角色</text>
  <text x="115" y="110" text-anchor="middle" font-size="10.5" fill="#3c5e88" filter="url(#rough2)">6! = 720 种</text>

  <line x1="192" y1="95" x2="222" y2="95" stroke="#8a6015" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <rect x="226" y="64" width="160" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="306" y="86" text-anchor="middle" font-size="10.5" fill="#8a6015" filter="url(#rough2)">检查长度是否相容</text>
  <text x="306" y="108" text-anchor="middle" font-size="10" fill="#7a5a1b" filter="url(#rough2)">c=L−a+1，d=H−b+1</text>

  <line x1="388" y1="95" x2="418" y2="95" stroke="#8a6015" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <rect x="422" y="64" width="150" height="62" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="497" y="86" text-anchor="middle" font-size="10.5" fill="#2f5223" filter="url(#rough2)">检查 7 个交叉点</text>
  <text x="497" y="108" text-anchor="middle" font-size="10" fill="#3c5e2e" filter="url(#rough2)">任一不等就丢弃</text>

  <line x1="574" y1="95" x2="604" y2="95" stroke="#8a6015" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <rect x="608" y="64" width="122" height="62" rx="8" fill="#fdeceb" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="669" y="86" text-anchor="middle" font-size="10.5" fill="#8c3a36" filter="url(#rough2)">建网格</text>
  <text x="669" y="108" text-anchor="middle" font-size="10" fill="#8c3a36" filter="url(#rough2)">与当前最优比较</text>

  <rect x="40" y="150" width="690" height="76" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="52" y="174" font-size="11" fill="#2f4a66" filter="url(#rough2)">比较规则（题面原文）：先比第一行，若相同再比第二行，依此类推；行与行用现代语言的 &lt; 比较，</text>
  <text x="52" y="196" font-size="11" fill="#2f4a66" filter="url(#rough2)">而 '.' 的 ASCII 比大写字母小，所以“点更靠前、行更短”的方案更小。把每行拼成字符串放进 vector，</text>
  <text x="52" y="216" font-size="11" fill="#2f4a66" filter="url(#rough2)">直接用 vector&lt;string&gt; 的字典序比较即可。</text>

  <rect x="40" y="240" width="690" height="62" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="52" y="264" font-size="11" fill="#8a6015" filter="url(#rough2)">一个都不用就输出 Impossible。复杂度：720 × (检查 7 个字符 + 建一个 ≤30×30 的网格)，总共不到 1 ms。</text>
  <text x="52" y="286" font-size="10" fill="#7a5a1b" filter="url(#rough2)">注意：输入里可能有重复单词（样例 2 全是 A），按“下标”枚举排列即可，重复不影响正确性。</text>
</svg>
