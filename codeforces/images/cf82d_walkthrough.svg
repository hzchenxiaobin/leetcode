<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="720" height="420" fill="#fafafa"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2：n = 5，a = 2 4 3 1 4</text>
  <path d="M 200 43 Q 360 49 520 43" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <rect x="60" y="76" width="600" height="70" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="78" y="106" text-anchor="start" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">[1 2 3 4 5]</text>
  <text x="78" y="130" text-anchor="start" font-size="11" fill="#777777" filter="url(#rough2)">从队首三人里挑 (1,3)</text>
  <text x="640" y="118" text-anchor="end" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">max(2,3)=3</text>
  <path d="M 360 146 L 360 160" stroke="#2b2b2b" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="60" y="160" width="600" height="70" rx="7" fill="#e9f4e2" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="78" y="190" text-anchor="start" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">[2 4 5]</text>
  <text x="78" y="214" text-anchor="start" font-size="11" fill="#777777" filter="url(#rough2)">挑 (2,5)</text>
  <text x="640" y="202" text-anchor="end" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">max(4,4)=4</text>
  <path d="M 360 230 L 360 244" stroke="#2b2b2b" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="60" y="244" width="600" height="70" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="78" y="274" text-anchor="start" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">[4]</text>
  <text x="78" y="298" text-anchor="start" font-size="11" fill="#777777" filter="url(#rough2)">只剩一人，单独服务</text>
  <text x="640" y="286" text-anchor="end" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">a₄=1</text>
  <text x="60" y="342" text-anchor="start" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">总时间 3 + 4 + 1 = 8，输出三行：1 3 / 2 5 / 4（与样例一致）。</text>
  <text x="60" y="368" text-anchor="start" font-size="11" fill="#777777" filter="url(#rough2)">注意每阶段只允许动队首三人：留下的人自然成为新的队首，</text>
  <text x="60" y="390" text-anchor="start" font-size="11" fill="#777777" filter="url(#rough2)">所以队列形状始终是「一个残留 + 一段连续后缀」。</text>
</svg>
