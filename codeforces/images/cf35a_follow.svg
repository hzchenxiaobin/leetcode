<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="201"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="290" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">球只跟着"位置"走：交换 (a,b) 时 a↔b</text>
  <g filter="url(#rough2)">
    <rect x="80" y="60" width="120" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="140" y="98" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f4a66">位置 1</text>
    <rect x="240" y="60" width="120" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="300" y="98" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f4a66">位置 2</text>
    <rect x="400" y="60" width="120" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="460" y="98" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f4a66">位置 3</text>
  </g>
  <circle cx="140" cy="140" r="10" fill="#fce8e6" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="140" y="168" text-anchor="middle" font-size="11.5" fill="#8f3b37" filter="url(#rough2)">球</text>
  <path d="M160,140 L280,140" stroke="#b85450" stroke-width="1.8" marker-end="url(#ar)" filter="url(#rough2)"/>
  <text x="220" y="132" text-anchor="middle" font-size="11.5" fill="#8f3b37" filter="url(#rough2)">交换 (1,2)</text>
  <circle cx="300" cy="140" r="10" fill="#fce8e6" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="168" text-anchor="middle" font-size="11.5" fill="#8f3b37" filter="url(#rough2)">球跟到 2</text>
  <rect x="70" y="196" width="580" height="72" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="86" y="220" font-size="12.5" fill="#8a6015" filter="url(#rough2)">p == a 时 p = b；p == b 时 p = a；否则不变。</text>
  <text x="86" y="244" font-size="12.5" fill="#8a6015" filter="url(#rough2)">只有 3 次交换，直接按顺序模拟即可。</text>
  <text x="86" y="262" font-size="12" fill="#8a6015" filter="url(#rough2)">不需要维护"哪个杯子在哪"。</text>
</svg>
