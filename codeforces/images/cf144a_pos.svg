<svg xmlns="http://www.w3.org/2000/svg" width="700" height="280" viewBox="0 0 700 280"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1441"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="700" height="280" fill="#fafafa"/>
  <text x="350.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">最左最大值 + 最右最小值</text>
  <path d="M 112.0 42 Q 350.0 48 588.0 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="350.0" y="266" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">交叉时省一步</text>
  <rect x="80" y="80" width="64" height="60" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="112" y="117" text-anchor="middle" font-size="12" font-weight="bold" fill="#5a7fb0" filter="url(#rough2)">10</text>
  <text x="112" y="158" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">0</text>
  <rect x="156" y="80" width="64" height="60" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="188" y="117" text-anchor="middle" font-size="12" font-weight="bold" fill="#5a7fb0" filter="url(#rough2)">10</text>
  <text x="188" y="158" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">1</text>
  <rect x="232" y="80" width="64" height="60" rx="7" fill="#f4f4f1" stroke="#b8b8b0" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="264" y="117" text-anchor="middle" font-size="12" font-weight="bold" fill="#b8b8b0" filter="url(#rough2)">58</text>
  <text x="264" y="158" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">2</text>
  <rect x="308" y="80" width="64" height="60" rx="7" fill="#f4f4f1" stroke="#b8b8b0" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="340" y="117" text-anchor="middle" font-size="12" font-weight="bold" fill="#b8b8b0" filter="url(#rough2)">31</text>
  <text x="340" y="158" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">3</text>
  <rect x="384" y="80" width="64" height="60" rx="7" fill="#f4f4f1" stroke="#b8b8b0" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="416" y="117" text-anchor="middle" font-size="12" font-weight="bold" fill="#b8b8b0" filter="url(#rough2)">63</text>
  <text x="416" y="158" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">4</text>
  <rect x="460" y="80" width="64" height="60" rx="7" fill="#f4f4f1" stroke="#b8b8b0" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="492" y="117" text-anchor="middle" font-size="12" font-weight="bold" fill="#b8b8b0" filter="url(#rough2)">40</text>
  <text x="492" y="158" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">5</text>
  <rect x="536" y="80" width="64" height="60" rx="7" fill="#fbeeee" stroke="#a05a5a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="568" y="117" text-anchor="middle" font-size="12" font-weight="bold" fill="#a05a5a" filter="url(#rough2)">76</text>
  <text x="568" y="158" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">6</text>
  <text x="350" y="200" text-anchor="middle" font-size="11.5" fill="#335478" filter="url(#rough2)">最大 76 在下标 6 → 6 步；最小 10 取最右（下标 1）→ 5 步</text>
  <text x="350" y="235" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">6 > 1 ⇒ 交叉省 1 步 ⇒ 答案 10</text>
