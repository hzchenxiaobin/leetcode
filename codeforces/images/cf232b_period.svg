<svg xmlns="http://www.w3.org/2000/svg" width="840" height="360" viewBox="0 0 840 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="360" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">n×n 窗口滑动：相减得到列点数周期 n</text>
  <text x="420" y="56" text-anchor="middle" font-size="11.8" fill="#666666" filter="url(#rough2)">每个窗口点数都为 k ⇒ c_{j+n} = c_j 且一个周期和为 k</text>
  <g filter="url(#rough2)"><rect x="150" y="96" width="66" height="46" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="183" y="124" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">c1</text>
  <g filter="url(#rough2)"><rect x="230" y="96" width="66" height="46" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="263" y="124" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">c2</text>
  <g filter="url(#rough2)"><rect x="310" y="96" width="66" height="46" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="343" y="124" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">c3</text>
  <g filter="url(#rough2)"><rect x="390" y="96" width="66" height="46" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="423" y="124" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">c4</text>
  <g filter="url(#rough2)"><rect x="470" y="96" width="66" height="46" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="503" y="124" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">c5</text>
  <g filter="url(#rough2)"><rect x="550" y="96" width="66" height="46" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="583" y="124" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">c6</text>
  <g filter="url(#rough2)"><rect x="150" y="156" width="338" height="30" rx="4" fill="none" fill-opacity="0.85" stroke="#446688" stroke-width="1.4" stroke-dasharray="5 3"/></g>
  <text x="360" y="200" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">窗口 [1,5]：c₁+…+c₅ = k</text>
  <g filter="url(#rough2)"><rect x="230" y="212" width="338" height="30" rx="4" fill="none" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.4" stroke-dasharray="5 3"/></g>
  <text x="500" y="256" text-anchor="middle" font-size="11.5" fill="#8a4b2a" filter="url(#rough2)">窗口 [2,6]：c₂+…+c₆ = k</text>
  <text x="420" y="290" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">相减 ⇒ c₆ = c₁，依此类推 c_{j+n} = c_j</text>
  <g filter="url(#rough2)"><rect x="200" y="312" width="440" height="34" rx="4" fill="#f7fbf4" fill-opacity="0.85" stroke="#a8c99a" stroke-width="1.3"/></g>
  <text x="420" y="334" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3d6b2f" filter="url(#rough2)">每类列的个数 cnt_j = ⌊(m−j)/n⌋+1</text>
</svg>
