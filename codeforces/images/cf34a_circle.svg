<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="311"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="360" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">A：站成一圈，相邻关系多一条“首尾”边</text>
  <path d="M 170 42 Q 380 47 590 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <circle cx="240" cy="160" r="88" fill="none" stroke="#ccc" stroke-width="1.2" stroke-dasharray="5 5" filter="url(#rough2)"/>
  <line x1="257" y1="84" x2="307" y2="120" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="317" y1="153" x2="298" y2="211" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="271" y1="231" x2="209" y2="231" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="182" y1="211" x2="163" y2="153" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <line x1="173" y1="120" x2="223" y2="84" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <circle cx="240" cy="72" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240" y="78" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">10</text>
  <circle cx="324" cy="133" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="324" y="139" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">12</text>
  <circle cx="292" cy="231" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="292" y="237" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">13</text>
  <circle cx="188" cy="231" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="188" y="237" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">15</text>
  <circle cx="156" cy="133" r="19" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="156" y="139" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">10</text>

  <text x="40" y="108" font-size="10.5" fill="#8c3a36" filter="url(#rough2)">红边：差值为 0 的一对</text>

  <rect x="372" y="66" width="352" height="112" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="384" y="90" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">相邻对（环上共 n 对）</text>
  <text x="384" y="114" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">(1,2)=2　(2,3)=1　(3,4)=2</text>
  <text x="384" y="136" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">(4,5)=5　(5,1)=0 ← 首尾这一对！</text>
  <text x="384" y="160" font-size="10.5" fill="#8c3a36" filter="url(#rough2)">最小值 0 出现在 (5,1)，输出 5 1</text>

  <rect x="40" y="248" width="680" height="100" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="52" y="272" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">做法：枚举 i = 0..n-1，比较 a[i] 与 a[(i+1) % n]</text>
  <text x="52" y="296" font-size="10.5" fill="#3c5e88" filter="url(#rough2)">· 取差值最小的一对，记录当时的两个下标</text>
  <text x="52" y="318" font-size="10.5" fill="#3c5e88" filter="url(#rough2)">· 只有严格更小才更新，并列时保留最先遇到的（任意一组都对）</text>
  <text x="52" y="338" font-size="10" fill="#8c3a36" filter="url(#rough2)">n = 2 时 (1,2) 与 (2,1) 是同一对，代码会算两次，结果仍正确。</text>
</svg>
