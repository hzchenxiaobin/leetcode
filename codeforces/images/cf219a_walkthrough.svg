<svg xmlns="http://www.w3.org/2000/svg" width="840" height="430" viewBox="0 0 840 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="430" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两个样例的走查</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">左：k=2、aazz 可行；右：k=3、abcabcabz 不可行</text>
  <g filter="url(#rough2)"><rect x="60" y="86" width="350" height="300" rx="4" fill="#f7fbf4" fill-opacity="0.85" stroke="#a8c99a" stroke-width="1.3"/></g>
  <text x="235" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#3d6b2f" filter="url(#rough2)">k = 2,  s = "aazz"</text>
  <text x="235" y="146" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">cnt: a = 2, z = 2, 其余 0</text>
  <text x="235" y="170" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">cnt / 2: a = 1, z = 1</text>
  <text x="235" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">基本块 = "az"</text>
  <g filter="url(#rough2)"><rect x="145" y="222" width="84" height="40" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="187" y="248" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">az</text>
  <g filter="url(#rough2)"><rect x="237" y="222" width="84" height="40" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="279" y="248" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">az</text>
  <text x="235" y="292" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3d6b2f" filter="url(#rough2)">结果 = az + az = "azaz"</text>
  <text x="235" y="330" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">（每个 cnt 都是 2 的倍数 ⇒ 可行）</text>
  <text x="235" y="362" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">若基本块写 "za" 则得 "zaza"，也合法</text>
  <g filter="url(#rough2)"><rect x="440" y="86" width="350" height="300" rx="4" fill="#fdf6f4" fill-opacity="0.85" stroke="#d8a89a" stroke-width="1.3"/></g>
  <text x="615" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#a0522d" filter="url(#rough2)">k = 3,  s = "abcabcabz"</text>
  <text x="615" y="146" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">cnt: a = 3, b = 3, c = 2, z = 1</text>
  <text x="615" y="170" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">cnt mod 3: a = 0, b = 0, c = 2, z = 1</text>
  <text x="615" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#a0522d" filter="url(#rough2)">c 与 z 的次数不被 3 整除</text>
  <text x="615" y="236" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">无论怎么重排，三份拷贝里</text>
  <text x="615" y="258" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">c 的总数都只能是 3 的倍数</text>
  <text x="615" y="292" text-anchor="middle" font-size="14" font-weight="bold" fill="#a0522d" filter="url(#rough2)">结论：输出 -1</text>
  <text x="615" y="330" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">（必要条件的直接反例）</text>
  <text x="615" y="362" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">长度 9 虽是 3 的倍数，仍不足以判定</text>
</svg>
