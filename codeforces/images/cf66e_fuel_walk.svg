<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="45"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="900" height="430" fill="#fafafa"/>

  <text x="450" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例一的两个可行起点：油量曲线始终在 0 以上，最后恰好回到 0</text>

  <!-- 左panel：顺时针从 2 号 -->
  <text x="80" y="62" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">顺时针，从 2 号站出发</text>
  <g filter="url(#rough2)">
    <line x1="70" y1="350" x2="405" y2="350" stroke="#666666" stroke-width="1.5"/>
    <text x="64" y="354" text-anchor="end" font-size="9.5" fill="#999999">0</text>
    <line x1="70" y1="220" x2="405" y2="220" stroke="#eeeeee" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="64" y="224" text-anchor="end" font-size="9.5" fill="#bbbbbb">5</text>

    <polyline points="80,168 120,194 160,142 200,168 240,90 280,168 320,142 360,350"
              fill="none" stroke="#4a7a3a" stroke-width="2.2"/>
    <circle cx="80" cy="168" r="4.5" fill="#4a7a3a"/>
    <circle cx="120" cy="194" r="4.5" fill="#4a7a3a"/>
    <circle cx="160" cy="142" r="4.5" fill="#4a7a3a"/>
    <circle cx="200" cy="168" r="4.5" fill="#4a7a3a"/>
    <circle cx="240" cy="90" r="5.5" fill="#b85450"/>
    <circle cx="280" cy="168" r="4.5" fill="#4a7a3a"/>
    <circle cx="320" cy="142" r="4.5" fill="#4a7a3a"/>
    <circle cx="360" cy="350" r="4.5" fill="#b85450"/>
  </g>

  <g filter="url(#rough2)" text-anchor="middle" font-size="10">
    <text x="80" y="156" fill="#2f5223">7</text>
    <text x="120" y="184" fill="#2f5223">6</text>
    <text x="160" y="130" fill="#2f5223">8</text>
    <text x="200" y="156" fill="#2f5223">7</text>
    <text x="240" y="78" fill="#8a2b28">10</text>
    <text x="280" y="156" fill="#2f5223">7</text>
    <text x="320" y="130" fill="#2f5223">8</text>
    <text x="360" y="338" fill="#8a2b28">0</text>

    <g fill="#888888">
      <text x="80" y="370">2</text>
      <text x="120" y="370">3</text>
      <text x="160" y="370">3</text>
      <text x="200" y="370">4</text>
      <text x="240" y="370">4</text>
      <text x="280" y="370">1</text>
      <text x="320" y="370">1</text>
      <text x="360" y="370">2</text>
    </g>
  </g>
  <text x="80" y="396" font-size="10" fill="#777777" filter="url(#rough2)">下方数字：当前所在站；折线在每个站加油后上升、行驶后下降。</text>

  <!-- 右panel：逆时针从 4 号 -->
  <text x="520" y="62" font-size="12.5" font-weight="bold" fill="#7a5a1b" filter="url(#rough2)">逆时针，从 4 号站出发</text>
  <g filter="url(#rough2)">
    <line x1="510" y1="350" x2="845" y2="350" stroke="#666666" stroke-width="1.5"/>
    <text x="504" y="354" text-anchor="end" font-size="9.5" fill="#999999">0</text>
    <line x1="510" y1="220" x2="845" y2="220" stroke="#eeeeee" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="504" y="224" text-anchor="end" font-size="9.5" fill="#bbbbbb">5</text>

    <polyline points="520,272 560,298 600,246 640,272 680,90 720,298 760,272 800,350"
              fill="none" stroke="#b58a3a" stroke-width="2.2"/>
    <circle cx="520" cy="272" r="4.5" fill="#b58a3a"/>
    <circle cx="560" cy="298" r="4.5" fill="#b58a3a"/>
    <circle cx="600" cy="246" r="4.5" fill="#b58a3a"/>
    <circle cx="640" cy="272" r="4.5" fill="#b58a3a"/>
    <circle cx="680" cy="90" r="5.5" fill="#b85450"/>
    <circle cx="720" cy="298" r="4.5" fill="#b58a3a"/>
    <circle cx="760" cy="272" r="4.5" fill="#b58a3a"/>
    <circle cx="800" cy="350" r="4.5" fill="#b85450"/>
  </g>

  <g filter="url(#rough2)" text-anchor="middle" font-size="10">
    <text x="520" y="260" fill="#7a5a1b">3</text>
    <text x="560" y="288" fill="#7a5a1b">2</text>
    <text x="600" y="234" fill="#7a5a1b">4</text>
    <text x="640" y="260" fill="#7a5a1b">3</text>
    <text x="680" y="78" fill="#8a2b28">10</text>
    <text x="720" y="288" fill="#7a5a1b">2</text>
    <text x="760" y="260" fill="#7a5a1b">3</text>
    <text x="800" y="338" fill="#8a2b28">0</text>

    <g fill="#888888">
      <text x="520" y="370">4</text>
      <text x="560" y="370">3</text>
      <text x="600" y="370">3</text>
      <text x="640" y="370">2</text>
      <text x="680" y="370">2</text>
      <text x="720" y="370">1</text>
      <text x="760" y="370">1</text>
      <text x="800" y="370">4</text>
    </g>
  </g>
  <text x="520" y="396" font-size="10" fill="#777777" filter="url(#rough2)">峰值 10 出现在 4 号（左）与 2 号（右）加油之后，随后长途行驶把油量拉回 0。</text>

  <g filter="url(#rough2)">
    <rect x="60" y="406" width="780" height="18" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <text x="70" y="419" font-size="10.5" fill="#8a6015">其它起点会在某一刻跌破 0：从 4 号顺时针，到 1 号只剩 1 升，再跑 b₁ = 8 就变负。</text>
  </g>
</svg>
