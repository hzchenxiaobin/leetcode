<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="430" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1 走查：a = [3, −5, 1, −4, 2]，答案 24</text>
  <path d="M 150 42 Q 380 49 610 42" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- 表头 -->
  <rect x="40" y="56" width="680" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="72" y="79" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">i</text>
  <text x="165" y="79" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">a_i</text>
  <text x="285" y="79" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">hi（P 最大）</text>
  <text x="380" y="79" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">lo（P 最小）</text>
  <text x="530" y="79" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">候选 a_i + max(hi, −lo)</text>
  <text x="668" y="79" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">ans</text>

  <!-- 数据行 -->
  <rect x="40" y="92" width="680" height="40" fill="#ffffff" stroke="#c9d6e4" stroke-width="1" filter="url(#rough2)"/>
  <rect x="40" y="132" width="680" height="40" fill="#f7fbff" stroke="#c9d6e4" stroke-width="1" filter="url(#rough2)"/>
  <rect x="40" y="172" width="680" height="40" fill="#ffffff" stroke="#c9d6e4" stroke-width="1" filter="url(#rough2)"/>
  <rect x="40" y="212" width="680" height="40" fill="#f7fbff" stroke="#c9d6e4" stroke-width="1" filter="url(#rough2)"/>
  <rect x="40" y="252" width="680" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>

  <text x="72" y="117" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="165" y="117" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="285" y="117" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="380" y="117" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="530" y="117" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3（= a_1）</text>
  <text x="668" y="117" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>

  <text x="72" y="157" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="165" y="157" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">−5</text>
  <text x="285" y="157" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="380" y="157" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="530" y="157" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">−5 + 3 = −2</text>
  <text x="668" y="157" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>

  <text x="72" y="197" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="165" y="197" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="285" y="197" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="380" y="197" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">−5</text>
  <text x="530" y="197" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1 + 5 = 6</text>
  <text x="668" y="197" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">6</text>

  <text x="72" y="237" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="165" y="237" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">−4</text>
  <text x="285" y="237" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="380" y="237" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">−9</text>
  <text x="530" y="237" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">−4 + 9 = 5</text>
  <text x="668" y="237" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">6</text>

  <text x="72" y="277" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">5</text>
  <text x="165" y="277" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="285" y="277" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="380" y="277" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">−22</text>
  <text x="530" y="277" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">2 + 22 = 24</text>
  <text x="668" y="277" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">24</text>

  <!-- 说明 -->
  <text x="56" y="322" font-size="11.5" fill="#333" filter="url(#rough2)">第 2 行的端点更新：hi = max(−5, −5+3, −5+6) = 1，lo = min(−5, −5+3, −5+6) = −5</text>
  <text x="56" y="346" font-size="11.5" fill="#333" filter="url(#rough2)">第 4 行的端点更新：hi = max(−4, −1, 2) = 2，lo = min(−4, −13, −22) = −22 —— 负方向被放大到 −22</text>
  <text x="56" y="372" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">最后一位用 2 − (−22) = 24 收口，与官方样例输出一致</text>
  <text x="56" y="400" font-size="11" fill="#66788c" filter="url(#rough2)">表中 hi / lo 都是「处理第 i 位之前」的值，即 P_{i−1} 的两端；第 1 行的候选就是 a_1 本身</text>

</svg>
