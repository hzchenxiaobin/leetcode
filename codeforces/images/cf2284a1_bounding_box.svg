<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.6"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="640" height="360" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">包围盒卡住面积，曼哈顿预算卡住跨度</text>

  <rect x="60" y="55" width="300" height="200" fill="#fff8e1" stroke="#d6a040"
        stroke-width="2" rx="6" stroke-dasharray="9 6" filter="url(#rough2)"/>
  <polygon points="78,235 342,215 200,70" fill="#e8f0fe" stroke="#446688"
           stroke-width="2" filter="url(#rough2)"/>

  <circle cx="78" cy="235" r="5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="342" cy="215" r="5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="200" cy="70" r="5" fill="#b85450" filter="url(#rough2)"/>
  <text x="56" y="252" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">A</text>
  <text x="356" y="230" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">B</text>
  <text x="200" y="60" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">C</text>

  <path d="M60,278 L360,278" stroke="#446688" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M360,278 L60,278" stroke="#446688" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="210" y="300" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">w = max x − min x</text>

  <path d="M42,55 L42,255" stroke="#446688" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M42,255 L42,55" stroke="#446688" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="30" y="160" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">h</text>

  <text x="392" y="82" font-size="13" fill="#333" filter="url(#rough2)">三角形整个落在 w × h 矩形里</text>
  <text x="392" y="122" font-size="14" fill="#446688" filter="url(#rough2)">2S = |det| ≤ w · h</text>
  <text x="392" y="156" font-size="13" fill="#333" filter="url(#rough2)">每点至少走 |x| + |y| 步 ⇒</text>
  <text x="392" y="186" font-size="14" fill="#446688" filter="url(#rough2)">w + h ≤ n</text>
  <text x="392" y="222" font-size="13" fill="#333" filter="url(#rough2)">⇒ 2S ≤ ((w+h)/2)² ≤ n²/4</text>

  <rect x="386" y="240" width="238" height="52" rx="8" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="505" y="262" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">2S 是整数 ⇒ 2S ≤ ⌊n²/4⌋</text>
  <text x="505" y="282" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">取整不丢值，因为答案必为整数</text>

  <text x="60" y="335" font-size="12" fill="#888" filter="url(#rough2)">矩形内任意三角形面积 ≤ 矩形一半（仿射缩放后即单位正方形情形）</text>
</svg>
