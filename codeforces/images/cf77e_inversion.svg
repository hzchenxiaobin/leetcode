<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 0 780 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="59"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="780" height="440" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">以切点为反演中心：盘沿与 Honduras 变成两条平行直线</text>
  <path d="M 156 39 Q 390 45 624 39" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <line x1="300" y1="70" x2="300" y2="380" stroke="#2b2b2b" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="480" y1="70" x2="480" y2="380" stroke="#8a6015" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="292" y="64" text-anchor="end" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">盘沿的像</text>
  <text x="488" y="64" text-anchor="start" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">Honduras 的像</text>
  <text x="390.0" y="400" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">两条平行线之间的距离 = 2K</text>
  <circle cx="390.0" cy="110" r="30" fill="#e2f1e6" stroke="#3f6b4a" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="390.0" cy="170" r="30" fill="#e2f1e6" stroke="#3f6b4a" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="390.0" cy="230" r="30" fill="#f7e8ef" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="390.0" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">ρ0</text>
  <circle cx="390.0" cy="290" r="30" fill="#e2f1e6" stroke="#3f6b4a" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="390.0" cy="350" r="30" fill="#e2f1e6" stroke="#3f6b4a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="548" y="176" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">相邻圆心间距 = 2K</text>
  <line x1="548" y1="182" x2="512" y2="190" stroke="#446688" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <rect x="40" y="96" width="220" height="128" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="52" y="120" text-anchor="start" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">反演把「相切的圆」</text>
  <text x="52" y="142" text-anchor="start" font-size="12" fill="#2f4a66" filter="url(#rough2)">变成「相切的圆或直线」：</text>
  <text x="52" y="164" text-anchor="start" font-size="12" fill="#2f4a66" filter="url(#rough2)">过切点的盘沿与 Honduras</text>
  <text x="52" y="186" text-anchor="start" font-size="12" fill="#2f4a66" filter="url(#rough2)">→ 两条平行线；</text>
  <text x="52" y="208" text-anchor="start" font-size="12" fill="#2f4a66" filter="url(#rough2)">其它圆 → 两条线之间的等圆</text>
  <rect x="40" y="240" width="220" height="120" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="52" y="264" text-anchor="start" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">于是绿色在反演图里</text>
  <text x="52" y="286" text-anchor="start" font-size="12" fill="#8a6015" filter="url(#rough2)">变成一排「等大、等距」的圆：</text>
  <text x="52" y="308" text-anchor="start" font-size="12" fill="#8a6015" filter="url(#rough2)">半径都是 K，圆心间距都是 2K，</text>
  <text x="52" y="330" text-anchor="start" font-size="12" fill="#8a6015" filter="url(#rough2)">Guadeloupe 也正好在这一排里。</text>
  <text x="40" y="392" text-anchor="start" font-size="11.5" fill="#6a6a6a" filter="url(#rough2)">反演中心取在盘子与 Honduras 的切点上，半径的平方 k² 可任取（答案与 k 无关）</text>
</svg>
