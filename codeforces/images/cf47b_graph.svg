<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="477"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="330" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">B：把“A&gt;B”看成一条有向边，找一条能通过所有边的顺序</text>
  <path d="M 120 40 Q 380 45 640 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 三角形 A,B,C -->
  <circle cx="200" cy="90" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="96" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">A</text>
  <circle cx="140" cy="190" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="196" text-anchor="middle" font-size="13" fill="#2f5223" filter="url(#rough2)">C</text>
  <circle cx="262" cy="190" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="262" y="196" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">B</text>

  <line x1="192" y1="110" x2="150" y2="170" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="146" y="130" font-size="10" fill="#2f4a66" filter="url(#rough2)">A&gt;C</text>
  <line x1="212" y1="108" x2="252" y2="170" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="252" y="130" font-size="10" fill="#2f4a66" filter="url(#rough2)">A&gt;B</text>
  <line x1="160" y1="196" x2="242" y2="196" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="200" y="216" text-anchor="middle" font-size="10" fill="#2f4a66" filter="url(#rough2)">B&gt;C</text>

  <text x="60" y="262" font-size="10.5" fill="#555" filter="url(#rough2)">箭头指向“更轻”的一枚：A&gt;B 表示 A 比 B 重，所以边是 B → A。</text>

  <rect x="360" y="70" width="360" height="120" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="372" y="94" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">换成“从轻到重”的排列</text>
  <text x="372" y="118" font-size="10.5" fill="#3c5e88" filter="url(#rough2)">只有 3 枚硬币 ⇒ 枚举 3! = 6 种排列</text>
  <text x="372" y="140" font-size="10.5" fill="#3c5e88" filter="url(#rough2)">对每种排列检查三条比较是否都成立</text>
  <text x="372" y="162" font-size="10.5" fill="#3c5e88" filter="url(#rough2)">若某种排列全部成立 → 输出它</text>
  <text x="372" y="182" font-size="10" fill="#8c3a36" filter="url(#rough2)">6 种都失败 ⇒ 称量结果自相矛盾 ⇒ Impossible</text>

  <rect x="360" y="206" width="360" height="80" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="372" y="230" font-size="11.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">为什么最多只有一个解？</text>
  <text x="372" y="252" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">三对都称过 ⇒ 任意两枚都有确定的轻重</text>
  <text x="372" y="272" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">⇒ 关系是“全序”，排列唯一（若一致）</text>

  <text x="60" y="300" font-size="10" fill="#777" filter="url(#rough2)">注意：输入保证每一对恰好称一次，所以不会出现“A、B 没比过”的不可比情况。</text>
</svg>
