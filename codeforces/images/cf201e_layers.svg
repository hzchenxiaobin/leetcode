<svg xmlns="http://www.w3.org/2000/svg" width="720" height="370" viewBox="0 0 720 370"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="370" fill="#fafafa"/>
  <text x="360.0" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">201E：按列大小分层，取满再补余量</text>
  <path d="M 144.00 46 Q 360.0 52 576.00 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="70" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">给定 k，怎样让可区分数最多？按列的“大小”从小到大分层填满。</text>
  <rect x="60" y="94" width="300" height="120" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="108" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">第 0 层：空集        1 个</text>
  <text x="74" y="126" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">第 1 层：单元素      k 个</text>
  <text x="74" y="144" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">第 2 层：二元子集    C(k,2) 个</text>
  <text x="74" y="162" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">……</text>
  <text x="74" y="180" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">每取满一层 s，每个请求的</text>
  <text x="74" y="198" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">度数增加 C(k-1, s-1)</text>
  <rect x="380" y="94" width="290" height="120" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="394" y="108" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">若下一层会超出配额 m：</text>
  <text x="394" y="126" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">  剩余配额 r = m - deg</text>
  <text x="394" y="144" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">  还能放 floor(r·k / (s+1)) 个</text>
  <text x="394" y="162" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">  s+1 元子集（把 r·k 个配额</text>
  <text x="394" y="180" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">  按每列 s+1 个均摊）</text>
  <text x="394" y="198" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">  → 结束</text>
  <path d="M 364 154 L 376 154" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="60" y="244" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">为什么先取小的？一个 s 元列只换来 1 个人，却要消耗 s 份“行配额”，越小越划算。</text>
  <text x="60" y="266" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">层内取全部子集时每个请求的度数相同（对称），所以层与层之间可以放心地“整层取满”。</text>
  <rect x="60" y="286" width="620" height="56" rx="9" fill="#fdeef1" stroke="#c0708a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="304" text-anchor="start" font-size="11" fill="#8a3a52" filter="url(#rough2)">样本核对：k=10, m=7 → 1 + 10 + floor(6·10/2) = 41 &lt; 42；k=11 → 1 + 11 + floor(6·11/2) = 45 ≥ 42。</text>
</svg>
