<svg xmlns="http://www.w3.org/2000/svg" width="840" height="440" viewBox="0 0 840 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="51"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="840" height="440" fill="#fafafa"/>

  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">矢量和为零：首尾相接，最后一步回到原点</text>
  <text x="420" y="58" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">样例二的 xy 投影（三个点在投影里仍然闭合），z 分量单独相加</text>

  <!-- 坐标轴 -->
  <g filter="url(#rough2)" stroke="#cccccc" stroke-width="1">
    <line x1="120" y1="250" x2="720" y2="250"/>
    <line x1="400" y1="110" x2="400" y2="400"/>
    <text x="726" y="254" font-size="10" fill="#aaaaaa">x</text>
    <text x="406" y="104" font-size="10" fill="#aaaaaa">y</text>
  </g>

  <!-- 三条边 -->
  <g filter="url(#rough2)">
    <path d="M 400 250 L 572 306" stroke="#446688" stroke-width="2.6" fill="none" marker-end="url(#arrb)"/>
    <path d="M 580 310 L 288 194" stroke="#4a7a3a" stroke-width="2.6" fill="none" marker-end="url(#arrg)"/>
    <path d="M 280 190 L 394 246" stroke="#b85450" stroke-width="2.6" fill="none" marker-end="url(#arrr)"/>

    <text x="470" y="300" font-size="12" fill="#2f4a66">(3, −1, 7)</text>
    <text x="452" y="214" font-size="12" fill="#2f5223">(−5, 2, −4)</text>
    <text x="250" y="246" text-anchor="end" font-size="12" fill="#8a2b28">(2, −1, −3)</text>
  </g>

  <!-- 顶点 -->
  <g filter="url(#rough2)">
    <circle cx="400" cy="250" r="6" fill="#2b2b2b"/>
    <circle cx="580" cy="310" r="6" fill="#2f4a66"/>
    <circle cx="280" cy="190" r="6" fill="#2f5223"/>
    <text x="386" y="272" text-anchor="end" font-size="11.5" fill="#444444">O (0,0,0)</text>
    <text x="592" y="330" font-size="11.5" fill="#2f4a66">(3, −1, 7)</text>
    <text x="268" y="178" text-anchor="end" font-size="11.5" fill="#2f5223">(−2, 1, 3)</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="360" width="720" height="60" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="76" y="384" font-size="11.5" fill="#8a6015">把三个向量按分量拆开：x 方向 3 − 5 + 2 = 0，y 方向 −1 + 2 − 1 = 0，z 方向 7 − 4 − 3 = 0。</text>
    <text x="76" y="406" font-size="11.5" fill="#8a6015">三个分量各自归零，合力才是零向量；只要有一个不为 0，物体就会沿该方向持续加速。</text>
  </g>
</svg>
