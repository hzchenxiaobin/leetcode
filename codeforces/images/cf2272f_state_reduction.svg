<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" width="780" height="520"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="780" height="520" fill="#fafafa"/>

  <text x="390" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：根只沿一条简单路径走，历史塌缩成一个「袋子」</text>
  <path d="M 96 44 Q 390 51 684 44" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- 图例 -->
  <rect x="36" y="54" width="330" height="98" rx="9" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="80" font-size="11.5" fill="#d6a040" filter="url(#rough2)">橙实线：根路径 r₀ → r₁ → r₂</text>
  <text x="52" y="106" font-size="11.5" fill="#b85450" filter="url(#rough2)">红虚线：回退边（上一个根）不能换根</text>
  <text x="52" y="132" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">绿实线：前向子树，可换根 / 可删除</text>

  <!-- 树 -->
  <path d="M 420 120 L 200 255" stroke="#b85450" stroke-width="2.2" stroke-dasharray="6 4" fill="none" filter="url(#rough2)"/>
  <path d="M 200 255 L 150 325" stroke="#d6a040" stroke-width="2.4" fill="none" filter="url(#rough2)"/>
  <path d="M 200 255 L 280 325" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 420 120 L 500 255" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 420 120 L 660 255" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 500 255 L 470 335" stroke="#4a7a3a" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 500 255 L 540 335" stroke="#4a7a3a" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 660 255 L 630 335" stroke="#4a7a3a" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 660 255 L 695 335" stroke="#4a7a3a" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 袋子 -->
  <rect x="100" y="196" width="290" height="170" rx="12" fill="#e8f0fe" fill-opacity="0.55"
        stroke="#446688" stroke-width="1.6" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="118" y="216" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">袋子</text>

  <circle cx="420" cy="120" r="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="420" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6015" filter="url(#rough2)">r₂</text>
  <text x="420" y="84" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">当前根</text>

  <circle cx="200" cy="255" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="261" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">r₁</text>
  <circle cx="150" cy="325" r="18" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="330" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">r₀</text>
  <circle cx="280" cy="325" r="18" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="330" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">s</text>

  <circle cx="500" cy="255" r="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="500" y="261" text-anchor="middle" font-size="14" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">A</text>
  <circle cx="660" cy="255" r="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="660" y="261" text-anchor="middle" font-size="14" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">B</text>
  <circle cx="470" cy="335" r="15" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="540" cy="335" r="15" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="630" cy="335" r="15" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="695" cy="335" r="15" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>

  <text x="245" y="384" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">袋子 = 历史，整块删掉只是一次 pass</text>
  <text x="500" y="380" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">✓ 换根  ✓ 删除</text>
  <text x="660" y="380" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">✓ 换根  ✓ 删除</text>

  <!-- 结论条 -->
  <rect x="40" y="404" width="700" height="100" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="430" font-size="12.5" fill="#8a6015" filter="url(#rough2)">局面 =（当前根 r，前向孩子集合 S）。删掉袋子 → 回到无袋局面 A(S)，前向部分一点没变。</text>
  <text x="60" y="456" font-size="12.5" fill="#8a6015" filter="url(#rough2)">换根进入前向孩子 v 后，其余前向子树立刻进袋，对手面对的就是 B(v)：v 的前方（不含 r）。</text>
  <text x="60" y="482" font-size="12.5" fill="#b85450" filter="url(#rough2)">于是每个位置只剩两类有效着法：删掉一个前向子树，或换根进入一个前向子树。</text>
</svg>
