<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="817"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="280" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">凸多边形按 v₀ 扇形剖分 + 二分定位扇区</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">再判点严格在边 vᵢvᵢ₊₁ 左侧</text>
  <g filter="url(#rough2)"><line x1="250.0" y1="65.0" x2="250.0" y2="65.0" stroke="#cccccc" stroke-width="1.0" stroke-dasharray="4 4"/></g>
  <g filter="url(#rough2)"><circle cx="250.0" cy="65.0" r="12" fill="#cfe0f5" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="250.0" y="67.88" text-anchor="middle" font-size="8" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)"><line x1="250.0" y1="65.0" x2="336.60254037844385" y2="115.0" stroke="#cccccc" stroke-width="1.0" stroke-dasharray="4 4"/></g>
  <g filter="url(#rough2)"><circle cx="336.60254037844385" cy="115.0" r="12" fill="#cfe0f5" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="336.60254037844385" y="117.88" text-anchor="middle" font-size="8" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><line x1="250.0" y1="65.0" x2="336.6025403784439" y2="215.0" stroke="#cccccc" stroke-width="1.0" stroke-dasharray="4 4"/></g>
  <g filter="url(#rough2)"><circle cx="336.6025403784439" cy="215.0" r="12" fill="#cfe0f5" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="336.6025403784439" y="217.88" text-anchor="middle" font-size="8" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><line x1="250.0" y1="65.0" x2="250.0" y2="265.0" stroke="#cccccc" stroke-width="1.0" stroke-dasharray="4 4"/></g>
  <g filter="url(#rough2)"><circle cx="250.0" cy="265.0" r="12" fill="#cfe0f5" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="250.0" y="267.88" text-anchor="middle" font-size="8" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><line x1="250.0" y1="65.0" x2="163.39745962155615" y2="215.00000000000003" stroke="#cccccc" stroke-width="1.0" stroke-dasharray="4 4"/></g>
  <g filter="url(#rough2)"><circle cx="163.39745962155615" cy="215.00000000000003" r="12" fill="#cfe0f5" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="163.39745962155615" y="217.88000000000002" text-anchor="middle" font-size="8" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><line x1="250.0" y1="65.0" x2="163.39745962155615" y2="114.99999999999999" stroke="#cccccc" stroke-width="1.0" stroke-dasharray="4 4"/></g>
  <g filter="url(#rough2)"><circle cx="163.39745962155615" cy="114.99999999999999" r="12" fill="#cfe0f5" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="163.39745962155615" y="117.87999999999998" text-anchor="middle" font-size="8" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <g filter="url(#rough2)"><circle cx="250.0" cy="65.0" r="14" fill="#dcecd2" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="250.0" y="67.88" text-anchor="middle" font-size="8" fill="#2b2b2b" filter="url(#rough2)">v₀</text>
  <text x="620" y="120" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">逆时针统一（题面给顺时针）</text>
  <text x="620" y="152" text-anchor="start" font-size="11" fill="#446688" filter="url(#rough2)">叉积二分 O(log n) 定位扇区</text>
  <text x="620" y="184" text-anchor="start" font-size="11" fill="#8a2b28" filter="url(#rough2)">严格判定：不能用 &lt;=</text>
  <text x="450" y="250" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">B 的每个顶点都要严格在内部（凸集包含引理）</text>
</svg>
