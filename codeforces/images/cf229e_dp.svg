<svg xmlns="http://www.w3.org/2000/svg" width="840" height="380" viewBox="0 0 840 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="380" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">DP：同时累计方案数与概率和</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">对名字逐个做"取 0 或 1 件阈值礼物"的卷积</text>
  <g filter="url(#rough2)"><rect x="110" y="96" width="200" height="80" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="210" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">sum[j]</text>
  <text x="210" y="150" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">Σ Π 概率</text>
  <text x="210" y="168" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">已选 j 件阈值礼物</text>
  <g filter="url(#rough2)"><rect x="350" y="96" width="200" height="80" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="450" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">cnt[j]</text>
  <text x="450" y="150" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">方案数</text>
  <text x="450" y="168" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">同样按 j 统计</text>
  <g filter="url(#rough2)"><rect x="590" y="96" width="160" height="80" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="670" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">答案</text>
  <text x="670" y="150" text-anchor="middle" font-size="12" fill="#8a4b2a" filter="url(#rough2)">sum[r] / cnt[r]</text>
  <g filter="url(#rough2)"><line x1="310" y1="136" x2="350" y2="136" stroke="#8899aa" stroke-width="1.4" marker-end="url(#arrb)"/></g>
  <g filter="url(#rough2)"><line x1="550" y1="136" x2="590" y2="136" stroke="#8899aa" stroke-width="1.4" marker-end="url(#arrb)"/></g>
  <text x="420" y="220" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">转移：sum′[j+b] += sum[j] / C(k_i, a_i+b)；cnt′[j+b] += cnt[j]</text>
  <text x="420" y="252" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">b ∈ {0,1}（同名价格互异，c_i ≤ 1）</text>
  <g filter="url(#rough2)"><rect x="200" y="280" width="440" height="44" rx="4" fill="#f7fbf4" fill-opacity="0.85" stroke="#a8c99a" stroke-width="1.3"/></g>
  <text x="420" y="308" text-anchor="middle" font-size="12" font-weight="bold" fill="#3d6b2f" filter="url(#rough2)">复杂度 O(m·r) ≤ 10⁶，组合数表 O(1000²)</text>
  <text x="420" y="348" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">样例 2：r=1，唯一方案 ⇒ 1/6</text>
</svg>
