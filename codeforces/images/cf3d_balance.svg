<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" viewBox="0 0 860 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="83"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="a3d" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="860" height="470" fill="#fafafa"/>
  <text x="430" y="34" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">平衡量：'(' 加一、')' 减一，任何时候不能为负</text>
  <path d="M 120 46 Q 430 52 740 46" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <line x1="70" y1="250" x2="800" y2="250" stroke="#9a9a9a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="70" y="272" font-size="11.5" fill="#7a8ca6" filter="url(#rough2)">平衡量 0</text>

  <path d="M 110 250 L 170 190 L 230 250 L 290 310 L 350 250 L 410 190 L 470 250 L 530 310 L 590 250 L 650 190 L 710 250"
        stroke="#446688" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <path d="M 290 310 L 350 250" stroke="#b85450" stroke-width="2.4" fill="none" filter="url(#rough2)"/>
  <circle cx="290" cy="310" r="7" fill="#fde8e8" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="292" y="338" text-anchor="middle" font-size="11.5" fill="#8c3b37" filter="url(#rough2)">这里掉到 −1：必须翻转</text>
  <text x="292" y="358" text-anchor="middle" font-size="11.5" fill="#8c3b37" filter="url(#rough2)">某个之前当 ')' 的 '?'</text>

  <g font-size="12" fill="#44597a" filter="url(#rough2)">
    <text x="110" y="232" text-anchor="middle">'('</text><text x="170" y="180" text-anchor="middle">')'</text>
    <text x="230" y="232" text-anchor="middle">'?'</text><text x="350" y="180" text-anchor="middle">'('</text>
    <text x="410" y="232" text-anchor="middle">'?'</text><text x="470" y="232" text-anchor="middle">')'</text>
    <text x="530" y="300" text-anchor="middle">'?'</text><text x="590" y="232" text-anchor="middle">')'</text>
    <text x="650" y="180" text-anchor="middle">'('</text><text x="710" y="232" text-anchor="middle">')'</text>
  </g>

  <rect x="70" y="380" width="720" height="66" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="88" y="404" font-size="12.5" fill="#8a6015" filter="url(#rough2)">每次平衡量变负，就从"已经扫过的 '?' 里"挑一个改成 '('：它的净增代价是 a_i − b_i。</text>
  <text x="88" y="428" font-size="12.5" fill="#8a6015" filter="url(#rough2)">用小根堆取最小净增代价，平衡量 +2；若堆空则无解。</text>
</svg>
