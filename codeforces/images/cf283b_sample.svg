<svg xmlns="http://www.w3.org/2000/svg" width="700" height="330" viewBox="0 0 700 330"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="213"/>
    <feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></defs>
  <rect width="700" height="330" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1 走查：n=4，a₂=2, a₃=4, a₄=1</text>
  <path d="M 150 40 Q 350 46 550 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="56" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="12.5" fill="#22314a" filter="url(#rough2)">i=1：step2 x=1+1=2, y=1；step3 y+=a₂=2 ⇒ 3，x=2−2=0 越界 ⇒ 3 ✓</text>
  <text x="76" y="104" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">（step3 用的是"更新后的 x"对应的 a[x]，即 a₂）</text>
  <g filter="url(#rough2)"><rect x="60" y="122" width="580" height="56" rx="8" fill="#e8f4e0" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="146" font-size="12.5" fill="#2f5223" filter="url(#rough2)">i=2：step2 x=3, y=2；step3 y+=a₃=4 ⇒ 6，x=3−4=−1 越界 ⇒ 6 ✓</text>
  <g filter="url(#rough2)"><rect x="60" y="186" width="580" height="72" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="76" y="210" font-size="12.5" fill="#8a6015" filter="url(#rough2)">i=3：step2 x=4, y=3；step3 y+=a₄=1 ⇒ 4，x=3；step2 y+=a₃=4 ⇒ 8，x=7 &gt; 4 越界 ⇒ 8 ✓</text>
  <text x="76" y="234" font-size="11.5" fill="#8a6015" filter="url(#rough2)">注意最后那次 step2 的 y 增量也要算（y=4+4=8）。</text>
  <text x="76" y="252" font-size="11.5" fill="#8a6015" filter="url(#rough2)">容易错的地方：以为终止那一步不加 y。</text>
  <g filter="url(#rough2)"><rect x="60" y="270" width="580" height="50" rx="8" fill="#fbeeee" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="76" y="300" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">样例 2（n=3，a₂=1, a₃=2）两次询问都死循环 ⇒ 输出 −1 −1（x=1 往返）</text>
</svg>
