  <text x="79" y="178" font-size="10" fill="#555" text-anchor="middle" filter="url(#rough2)">原图 P</text>
  <text x="259" y="178" font-size="10" fill="#555" text-anchor="middle" filter="url(#rough2)">顺时针转 90°</text>
  <text x="439" y="178" font-size="10" fill="#555" text-anchor="middle" filter="url(#rough2)">黑白互换（23 个黑格）</text>
  <rect x="30" y="192" width="500" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="9" filter="url(#rough2)"/>
  <text x="44" y="212" font-size="10.5" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">A(L·P + t) = L·A(P) + t　（L 是 8 个有符号置换矩阵之一，t 是平移量）</text>
  <text x="44" y="232" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">A(P 的反色) = A(P)　因为全体格子坐标和 ≡ 0，且 −w ≡ n² − w (mod n)</text>
  <rect x="30" y="256" width="500" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="9" filter="url(#rough2)"/>
  <text x="44" y="276" font-size="11" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">为什么 w 一定要与 n 互质？</text>
  <text x="44" y="295" font-size="10" fill="#4a5a42" filter="url(#rough2)">若某个非零平移 δ 把图形映到自己，轨道大小 ord(δ) > 1 同时整除 n 与 w，</text>
  <text x="44" y="312" font-size="10" fill="#4a5a42" filter="url(#rough2)">立刻得到 gcd(n, w) > 1，矛盾 —— 所以图形永远“没有非平凡的平移对称”。</text>
  <text x="280" y="344" font-size="10" fill="#8a8a92" text-anchor="middle" filter="url(#rough2)">橙点 = 锚点 A(P)；注意第 3 幅图反色后锚点仍停在 (3,1)</text>
  <text x="280" y="362" font-size="9.5" fill="#a0a0a8" text-anchor="middle" filter="url(#rough2)">（坐标为 0-indexed，(3,1) 意为第 4 行第 2 列）</text>
