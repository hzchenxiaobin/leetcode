<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430">
<defs>
  <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs>
<rect x="0" y="0" width="760" height="430" fill="#fafafa"/>
<text x="380.0" y="34" font-size="22" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="bold" text-anchor="middle" filter="url(#rough2)">每条边至少走两次，只有最后不回根的那条路径省一次</text>
<line x1="380" y1="90" x2="200" y2="160" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
<line x1="380" y1="90" x2="560" y2="160" stroke="#2e7d32" stroke-width="4" filter="url(#rough2)"/>
<line x1="200" y1="160" x2="120" y2="250" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
<line x1="200" y1="160" x2="280" y2="250" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
<line x1="560" y1="160" x2="500" y2="250" stroke="#2e7d32" stroke-width="4" filter="url(#rough2)"/>
<line x1="560" y1="160" x2="640" y2="250" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
<rect x="356" y="66" width="48" height="48" rx="24" fill="#e6f4ea" stroke="#777" stroke-width="2" filter="url(#rough2)"/>
<text x="380" y="97" font-size="16" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">1</text>
<rect x="176" y="136" width="48" height="48" rx="24" fill="#e8f0fe" stroke="#777" stroke-width="2" filter="url(#rough2)"/>
<text x="200" y="167" font-size="16" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">2</text>
<rect x="536" y="136" width="48" height="48" rx="24" fill="#e6f4ea" stroke="#777" stroke-width="2" filter="url(#rough2)"/>
<text x="560" y="167" font-size="16" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">3</text>
<rect x="96" y="226" width="48" height="48" rx="24" fill="#e8f0fe" stroke="#777" stroke-width="2" filter="url(#rough2)"/>
<text x="120" y="257" font-size="16" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">4</text>
<rect x="256" y="226" width="48" height="48" rx="24" fill="#e8f0fe" stroke="#777" stroke-width="2" filter="url(#rough2)"/>
<text x="280" y="257" font-size="16" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">5</text>
<rect x="476" y="226" width="48" height="48" rx="24" fill="#e6f4ea" stroke="#777" stroke-width="2" filter="url(#rough2)"/>
<text x="500" y="257" font-size="16" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">6</text>
<rect x="616" y="226" width="48" height="48" rx="24" fill="#e8f0fe" stroke="#777" stroke-width="2" filter="url(#rough2)"/>
<text x="640" y="257" font-size="16" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">7</text>
<text x="80" y="320" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#2e7d32" font-weight="normal" text-anchor="start" filter="url(#rough2)">绿色：选定的终点路径（1→3→6），只走一次</text>
<text x="80" y="350" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#1a5fb4" font-weight="normal" text-anchor="start" filter="url(#rough2)">其余边：下去再回来，走两次</text>
<text x="80" y="388" font-size="15" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#c0392b" font-weight="normal" text-anchor="start" filter="url(#rough2)">答案 = 2 × 总权值 − 根到终点的最大距离</text>
</svg>
