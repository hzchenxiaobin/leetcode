<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="780" height="400" fill="#fafafa"/>
  <text x="390.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">196C：选最左点放根，其余点按极角排序后按子树大小切块</text>
  <path d="M 143.52000000000012 46 Q 390.0 52 636.4799999999999 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <circle cx="110.0" cy="200.0" r="9.0" fill="#d6a040" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="110.0" y="178.0" text-anchor="middle" font-size="10.4" font-weight="bold" fill="#8a6015" filter="url(#rough2)">最左点 → 根</text>
  <circle cx="300.0" cy="120.0" r="8.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 110.0 200.0 L 300.0 120.0" stroke="#6b6b6b" stroke-width="1.0" fill="none" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <circle cx="360.0" cy="210.0" r="8.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 110.0 200.0 L 360.0 210.0" stroke="#6b6b6b" stroke-width="1.0" fill="none" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <circle cx="330.0" cy="300.0" r="8.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 110.0 200.0 L 330.0 300.0" stroke="#6b6b6b" stroke-width="1.0" fill="none" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <circle cx="200.0" cy="150.0" r="8.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 110.0 200.0 L 200.0 150.0" stroke="#6b6b6b" stroke-width="1.0" fill="none" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <circle cx="210.0" cy="290.0" r="8.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 110.0 200.0 L 210.0 290.0" stroke="#6b6b6b" stroke-width="1.0" fill="none" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <path d="M 110 200 L 420 90 A 330 330 0 0 1 420 330 Z" stroke="none" stroke-width="#5b8c5a" fill="1.2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <rect x="60.0" y="300.0" width="660.0" height="84.0" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="324.0" text-anchor="start" font-size="10.8" fill="#8a6015" filter="url(#rough2)">根被放在凸包上（x 最小）⇒ 其余点全部落在它的右侧半平面，按极角排序后每个子树占据一个连续扇区；</text>
  <text x="74.0" y="346.0" text-anchor="start" font-size="10.8" fill="#8a6015" filter="url(#rough2)">把子树大小作为扇区大小依次切分，子树之间不会相交（扇区互不重叠）。</text>
  <text x="74.0" y="368.0" text-anchor="start" font-size="10.8" fill="#8a6015" filter="url(#rough2)">递归处理每个子树：子树内的点再取最左点当子根，重排极角。</text>
</svg>
