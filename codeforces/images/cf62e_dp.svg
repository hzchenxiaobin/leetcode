<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420">
<defs>
  <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs>
<rect x="0" y="0" width="760" height="420" fill="#fafafa"/>
<text x="380.0" y="34" font-size="22" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="bold" text-anchor="middle" filter="url(#rough2)">DP 转移：O(m·n·2^n)</text>
<text x="40" y="80" font-size="15" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="normal" text-anchor="start" filter="url(#rough2)">dp[B] ← vcut(B) + min_A ( dp[A] + Σ_r [A_r≠B_r] h_r )</text>
<text x="40" y="130" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="normal" text-anchor="start" filter="url(#rough2)">内层是对超立方体的最短路变换：逐位松弛</text>
<rect x="60" y="170" width="200" height="50" rx="8" fill="#e8f0fe" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="160.0" y="200.25" font-size="15" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">g = dp</text>
<rect x="300" y="170" width="180" height="50" rx="8" fill="#fff4d6" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="390.0" y="200.25" font-size="15" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">对每个 r：</text>
<rect x="520" y="170" width="200" height="50" rx="8" fill="#e6f4ea" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="620.0" y="199.55" font-size="13" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">g[B]=min(g[B],g[B⊕r]+h_r)</text>
<line x1="262" y1="195" x2="296" y2="195" stroke="#1a5fb4" stroke-width="2" filter="url(#rough2)"/>
<polygon points="296.0,195.0 285.0,190.0 285.0,200.0" fill="#1a5fb4" filter="url(#rough2)"/>
<line x1="482" y1="195" x2="516" y2="195" stroke="#1a5fb4" stroke-width="2" filter="url(#rough2)"/>
<polygon points="516.0,195.0 505.0,190.0 505.0,200.0" fill="#1a5fb4" filter="url(#rough2)"/>
<text x="40" y="270" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#1a5fb4" font-weight="normal" text-anchor="start" filter="url(#rough2)">n ≤ 5 → 每列 5×32 次松弛，总约 1.7×10^7 次运算</text>
<text x="40" y="310" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#c0392b" font-weight="normal" text-anchor="start" filter="url(#rough2)">容量用 64 位整数：和不超过 10^15</text>
<text x="40" y="350" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#2e7d32" font-weight="normal" text-anchor="start" filter="url(#rough2)">本质：最大流 = 最小割（最大流最小割定理）</text>
</svg>
