<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="501"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="290" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">每对禁忌字母独立处理：段内保留多数的那个字母</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">每段只能全留一种字母 ⇒ 删掉较少的</text>
  <text x="60" y="100" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">s =</text>
  <g filter="url(#rough2)"><rect x="140" y="84" width="56" height="44" rx="3" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="168" y="113" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">a</text>
  <g filter="url(#rough2)"><rect x="202" y="84" width="56" height="44" rx="3" fill="#f6e3c4" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="230" y="113" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">b</text>
  <g filter="url(#rough2)"><rect x="264" y="84" width="56" height="44" rx="3" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="292" y="113" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">a</text>
  <g filter="url(#rough2)"><rect x="326" y="84" width="56" height="44" rx="3" fill="#f6e3c4" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="354" y="113" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">b</text>
  <g filter="url(#rough2)"><rect x="388" y="84" width="56" height="44" rx="3" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="416" y="113" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="60" y="168" text-anchor="start" font-size="12" fill="#8a2b28" filter="url(#rough2)">禁忌对 {a,b}</text>
  <text x="60" y="196" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">a 有 3 个、b 有 2 个</text>
  <g filter="url(#rough2)"><rect x="60" y="212" width="780" height="44" rx="6" fill="#dcecd2" fill-opacity="0.45" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="450" y="240" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">保留 3 个 a（或 3 个 b 中的一种），删 min(3,2) = 2</text>
</svg>
