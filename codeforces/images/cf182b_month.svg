<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="330" fill="#fafafa"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">单月内部：只有第 1 天需要手动拨，其余靠自然进位</text>
  <path d="M 156.98000000000008 46 Q 380.0 52 603.02 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="70.0" y="80.0" width="140.0" height="50.0" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="140.0" y="109.0" text-anchor="middle" font-size="11.0" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">第 1 天</text>
  <rect x="235.0" y="80.0" width="140.0" height="50.0" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="305.0" y="109.0" text-anchor="middle" font-size="11.0" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">第 2 天</text>
  <rect x="400.0" y="80.0" width="140.0" height="50.0" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="470.0" y="109.0" text-anchor="middle" font-size="11.0" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">…</text>
  <rect x="565.0" y="80.0" width="140.0" height="50.0" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="635.0" y="109.0" text-anchor="middle" font-size="11.0" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">第 a_i 天</text>
  <text x="140.0" y="156.0" text-anchor="middle" font-size="10.6" font-weight="bold" fill="#b85450" filter="url(#rough2)">需要 = 1</text>
  <path d="M 140.0 132.0 L 140.0 70.0" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="305.0" y="156.0" text-anchor="middle" font-size="10.6" fill="#5b8c5a" filter="url(#rough2)">自然 +1</text>
  <text x="470.0" y="156.0" text-anchor="middle" font-size="10.6" fill="#5b8c5a" filter="url(#rough2)">自然 +1</text>
  <rect x="70.0" y="190.0" width="620.0" height="56.0" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="84.0" y="214.0" text-anchor="start" font-size="11.2" fill="#8a6015" filter="url(#rough2)">月初时钟显示 c：先补 (1−c+d) mod d 次；此后每天自动 +1，不会越过 d（因为 a_i ≤ d）。</text>
  <text x="84.0" y="236.0" text-anchor="start" font-size="11.2" fill="#8a6015" filter="url(#rough2)">月末最后一天显示 a_i，下月第一天自然进位到 a_i mod d + 1。</text>
  <rect x="70.0" y="258.0" width="620.0" height="50.0" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="84.0" y="282.0" text-anchor="start" font-size="11.2" fill="#2f5b34" filter="url(#rough2)">样例 3（d=31，闰年式 12 个月）逐月累加得 0+0+3+0+1+0+1+0+0+1+0+1 = 7。</text>
</svg>
