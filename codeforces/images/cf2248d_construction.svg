<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="720" height="450" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">充分性构造：三步清空整段（不妨设 p ≥ q）</text>
  <text x="360" y="52" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">记 d = p − q ≥ 0，已知 A + B ≥ d</text>

  <rect x="40" y="70" width="640" height="98" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="56" y="96" font-size="14" font-weight="bold" fill="#33517a" filter="url(#rough2)">① 反向异字符两两配对：不花任何同字符位置</text>
  <text x="56" y="122" font-size="12" fill="#446688" filter="url(#rough2)">每个 (0,1) 配一个 (1,0)，取 x = y = 1、a = 0；此时 |x − y| = 0，操作合法。</text>
  <text x="56" y="148" font-size="12" fill="#446688" filter="url(#rough2)">共配对 min(p,q) = q 次，把 q 个 (1,0) 全部用光。</text>

  <line x1="360" y1="170" x2="360" y2="186" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="188" width="640" height="98" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="56" y="214" font-size="14" font-weight="bold" fill="#8a6212" filter="url(#rough2)">② 剩下 d 个同向异字符：每个配 1 个同字符位置</text>
  <text x="56" y="240" font-size="12" fill="#8a6212" filter="url(#rough2)">取 x = 1、y = 0、a = 1：|x − y| = 1，合法；也可以换成 b = 1，用 (1,1) 来补。</text>
  <text x="56" y="266" font-size="12" fill="#8a6212" filter="url(#rough2)">这一步共需 d 个同字符位置，由 A + B ≥ d 保证凑得出。</text>

  <line x1="360" y1="288" x2="360" y2="304" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="306" width="640" height="74" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="56" y="332" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">③ 余下的同字符位置各自单独删</text>
  <text x="56" y="356" font-size="12" fill="#2e6e2e" filter="url(#rough2)">k = 1，c 取它自己的字符：1 ≥ ⌈1/2⌉，一定合法。</text>

  <text x="360" y="406" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">⟹ 可以清空 ⟺ A + B ≥ |p − q| ⟺ 2 · max(p, q) ≤ m</text>
  <text x="360" y="430" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">样例三：p = 2、q = 0 ⇒ d = 2；A = 1、B = 2，1 + 2 ≥ 2 ⇒ YES</text>
</svg>
