<svg xmlns="http://www.w3.org/2000/svg" width="700" height="290" viewBox="0 0 700 290"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1601"/>
    <feDisplacementMap in="SourceGraphic" scale="1.5"/></filter></defs>
  <rect width="700" height="290" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">区间覆盖 DP：枚举"最后修的一段"</text>
  <path d="M 130 40 Q 350 46 570 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="76" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="12.5" fill="#22314a">先把公司压成 cost[l][r] = 覆盖 [l,r] 的最便宜一家（同一区间取 min）。</text>
  <text x="76" y="106" font-size="12.5" fill="#22314a">dp[i][j] = 只考虑前 i 个洞、修好 j 个的最小花费。</text>
  <text x="76" y="130" font-size="12.5" fill="#22314a">转移：dp[i][j] = min( dp[i−1][j], min_l dp[l−1][j−len] + cost[l][i] )</text>
  <g filter="url(#rough2)"><rect x="60" y="152" width="580" height="66" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="76" y="176" font-size="12.5" fill="#8a6015">"至少 k 个"是软要求 ⇒ 状态封顶：nj = min(k, j+len)，答案取 dp[n][k]。</text>
  <text x="76" y="200" font-size="12.5" fill="#8a6015">重复覆盖不降价 ⇒ 最优解可化为若干不相交段 ✓</text>
  <g filter="url(#rough2)"><rect x="60" y="228" width="580" height="52" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="252" font-size="12.5" fill="#2f5223">样例 2（k=1）：最便宜的一段是 [1,4] 花 2 ⇒ 答案 2 ✓</text>
  <text x="76" y="272" font-size="12.5" fill="#2f5223">样例 3：只有 [5,10] 花 14，最多修 6 个 &lt; 9 ⇒ −1 ✓</text>
</svg>
