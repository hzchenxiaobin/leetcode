<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr67d" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="380" fill="#fafafa"/>
  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每个值有一份"配额"：只有 need = 0 才允许放下</text>
  <path d="M 110 42 Q 360 48 610 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 值 1..5 -->
  <g filter="url(#rough2)">
    <rect x="60" y="70" width="90" height="50" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7"/>
    <rect x="180" y="70" width="90" height="50" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7"/>
    <rect x="300" y="70" width="90" height="50" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7"/>
    <rect x="420" y="70" width="90" height="50" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7"/>
    <rect x="540" y="70" width="90" height="50" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">
    <text x="105" y="92">值 1</text>
    <text x="225" y="92">值 2</text>
    <text x="345" y="92">值 3</text>
    <text x="465" y="92">值 4</text>
    <text x="585" y="92">值 5</text>
  </g>
  <g font-size="12.5" font-weight="bold" text-anchor="middle" fill="#8a2b28" filter="url(#rough2)">
    <text x="105" y="111">need 1</text>
    <text x="225" y="111">need 2</text>
    <text x="345" y="111">need 1</text>
    <text x="465" y="111">need 0</text>
    <text x="585" y="111">need 0</text>
  </g>
  <text x="60" y="145" font-size="12" fill="#555" filter="url(#rough2)">样例 1 开局：need = b = (1, 2, 1, 0, 0)，绿色两格是 ready（可以立刻放下）</text>

  <!-- 放下 4 之后 -->
  <path d="M 465 152 L 465 184" stroke="#b85450" stroke-width="1.7" fill="none" marker-end="url(#arr67d)" filter="url(#rough2)"/>
  <text x="480" y="174" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">放下 4，v − k = 2</text>

  <g filter="url(#rough2)">
    <rect x="60" y="192" width="90" height="46" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7"/>
    <rect x="180" y="192" width="90" height="46" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7"/>
    <rect x="300" y="192" width="90" height="46" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7"/>
    <rect x="420" y="192" width="90" height="46" rx="7" fill="#f2f2f2" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4"/>
    <rect x="540" y="192" width="90" height="46" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7"/>
  </g>
  <g font-size="12.5" font-weight="bold" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">
    <text x="105" y="212">0</text>
    <text x="225" y="212">1</text>
    <text x="345" y="212">1</text>
    <text x="465" y="212">已用</text>
    <text x="585" y="212">0</text>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#8a2b28" filter="url(#rough2)">
    <text x="105" y="230">−1</text>
    <text x="225" y="230">−1</text>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#2f5223" filter="url(#rough2)">
    <text x="585" y="230">ready</text>
  </g>

  <path d="M 60 200 Q 105 262 150 258" stroke="#8a2b28" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 180 200 Q 200 262 240 258" stroke="#8a2b28" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="60" y="276" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">所有 i ≤ v − k（这里 i = 1, 2）的配额被 4 消耗一格</text>

  <rect x="60" y="296" width="600" height="66" rx="10" fill="#f4f0fa" stroke="#7a4a8a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="76" y="318" font-size="12.5" font-weight="bold" fill="#5a3a6a" filter="url(#rough2)">两个方向的必要条件把结构钉死了</text>
  <text x="76" y="338" font-size="11.5" fill="#5a3a6a" filter="url(#rough2)">放下 i 时必须 need[i] = 0（之后放到右边的元素再也不可能插到它左边）</text>
  <text x="76" y="356" font-size="11.5" fill="#5a3a6a" filter="url(#rough2)">反过来，每步都挑 need = 0 的值，得到的排列一定合法</text>
</svg>
