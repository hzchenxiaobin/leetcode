<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="53"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="760" height="560" fill="#fafafa"/>

  <text x="380" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：O(n) 一次扫描定答案</text>
  <path d="M 214 44 Q 380 51 546 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 读入 -->
  <rect x="230" y="62" width="300" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="84" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">读入 n, k, a₁ … a_n</text>
  <text x="380" y="102" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">排列 ⇒ 记录 pos[值] = 下标</text>

  <path d="M 380 116 L 380 146" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 计算 m 与缺失集合 -->
  <rect x="210" y="150" width="340" height="62" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="172" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">m ← n − k + 1</text>
  <text x="380" y="192" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">缺失集合 S = { v &lt; m ： pos[v] &gt; m }，令 s = |S|</text>
  <text x="380" y="206" text-anchor="middle" font-size="10.5" fill="#66788c" filter="url(#rough2)">（pos[v] &gt; m 即 v 不在前 m 个里）</text>

  <path d="M 380 216 L 380 246" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="380,248 578,306 380,364 182,306" fill="#fff8e1" stroke="#d6a040" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="380" y="300" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">s == 0 ?</text>
  <text x="380" y="320" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">前 m 个已含 0 … m−1</text>

  <!-- 真分支 -->
  <path d="M 236 348 L 168 396" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="176" y="368" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">真</text>
  <rect x="40" y="400" width="270" height="86" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="175" y="424" text-anchor="middle" font-size="14" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">输出 −1</text>
  <text x="175" y="446" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">mex 已经是 m，达到上界</text>
  <text x="175" y="466" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">任何交换都不会更好，不必操作</text>

  <!-- 假分支 -->
  <path d="M 524 348 L 592 396" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="586" y="368" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">假</text>
  <rect x="450" y="400" width="270" height="86" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="585" y="422" text-anchor="middle" font-size="13" font-weight="bold" fill="#a14340" filter="url(#rough2)">v ← S 中的最小值</text>
  <text x="585" y="442" text-anchor="middle" font-size="13" font-weight="bold" fill="#a14340" filter="url(#rough2)">p ← 满足 a_p ≥ m 的下标 p ≤ m</text>
  <text x="585" y="464" text-anchor="middle" font-size="13" font-weight="bold" fill="#a14340" filter="url(#rough2)">输出 p  pos[v]</text>
  <text x="585" y="480" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">两者必然不同：p ≤ m &lt; pos[v]</text>

  <!-- 底部说明 -->
  <rect x="40" y="502" width="680" height="46" rx="9" fill="#fafafa" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="380" y="521" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">s = 1：换入唯一缺失值 ⇒ 前缀恰为 0 … m−1，mex = m（最优）</text>
  <text x="380" y="540" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">s ≥ 2：一次只补得进一个值 ⇒ 上界为第二小缺失值，换入最小缺失值即可达到</text>
</svg>
