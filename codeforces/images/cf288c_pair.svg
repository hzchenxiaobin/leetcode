<svg xmlns="http://www.w3.org/2000/svg" width="700" height="290" viewBox="0 0 700 290"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="441"/>
    <feDisplacementMap in="SourceGraphic" scale="1.5"/></filter></defs>
  <rect width="700" height="290" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">贪心配对：让每个 i 与它的"全 1 互补数"配对</text>
  <path d="M 120 40 Q 350 46 580 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="70" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="12.5" fill="#22314a" filter="url(#rough2)">对 i 取最小的 mask = 2^b − 1 ≥ i（全 1 的数），令 j = mask − i。</text>
  <text x="76" y="106" font-size="12.5" fill="#22314a" filter="url(#ruff)">则 i xor j = mask（全是 1）—— 这是 i 能拿到的最大单点异或值。</text>
  <g filter="url(#rough2)"><rect x="60" y="142" width="580" height="70" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="166" font-size="12.5" fill="#2f5223" filter="url(#rough2)">从 n 到 0 倒着处理：若 j ≤ n 且未配对就配对；否则 i 与自己配对（异或 0）。</text>
  <text x="76" y="190" font-size="12.5" fill="#2f5223" filter="url(#rough2)">倒序保证大数优先拿到"满意的补数"，不会把小数的补数抢走。</text>
  <g filter="url(#rough2)"><rect x="60" y="226" width="580" height="50" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="76" y="248" font-size="12.5" fill="#8a6015" filter="url(#rough2)">样例 n=4：4↔3（7）、2↔1（3）、0↔0（0）⇒ 总和 20；排列 0 2 1 4 3 ✓</text>
  <text x="76" y="268" font-size="11.5" fill="#8a6015" filter="url(#rough2)">O(n) 时间、O(n) 空间；n ≤ 10⁶。</text>
</svg>
