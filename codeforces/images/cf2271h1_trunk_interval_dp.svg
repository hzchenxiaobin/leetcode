<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" width="780" height="440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="780" height="440" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="17.6" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">主干上的区间 DP：黑干点永远是「前缀 ∪ 后缀」</text>

  <!-- 主干格子 -->
  <g filter="url(#rough2)">
    <rect x="52" y="76" width="54" height="34" rx="6" fill="#446688" stroke="#2f4a66" stroke-width="2"/>
    <rect x="112" y="76" width="54" height="34" rx="6" fill="#446688" stroke="#2f4a66" stroke-width="2"/>
    <rect x="172" y="76" width="54" height="34" rx="6" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.8"/>
    <rect x="232" y="76" width="54" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="292" y="76" width="54" height="34" rx="6" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.8"/>
    <rect x="352" y="76" width="54" height="34" rx="6" fill="#446688" stroke="#2f4a66" stroke-width="2"/>
    <rect x="412" y="76" width="54" height="34" rx="6" fill="#446688" stroke="#2f4a66" stroke-width="2"/>
  </g>
  <g font-size="12.5" text-anchor="middle">
    <text x="79" y="98" fill="#ffffff" filter="url(#rough2)">x=p0</text>
    <text x="139" y="98" fill="#ffffff" filter="url(#rough2)">p1</text>
    <text x="199" y="98" fill="#555" filter="url(#rough2)">p2</text>
    <text x="259" y="98" fill="#8a6015" filter="url(#rough2)">p3</text>
    <text x="319" y="98" fill="#555" filter="url(#rough2)">p4</text>
    <text x="379" y="98" fill="#ffffff" filter="url(#rough2)">p5</text>
    <text x="439" y="98" fill="#ffffff" filter="url(#rough2)">y=p6</text>
  </g>

  <!-- 旁支三角 -->
  <g filter="url(#rough2)">
    <path d="M 62 110 L 96 110 L 79 142 Z" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <path d="M 122 110 L 156 110 L 139 142 Z" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <path d="M 182 110 L 216 110 L 199 142 Z" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <path d="M 242 110 L 276 110 L 259 142 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <path d="M 302 110 L 336 110 L 319 142 Z" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <path d="M 362 110 L 396 110 L 379 142 Z" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <path d="M 422 110 L 456 110 L 439 142 Z" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <g font-size="10.6" text-anchor="middle" fill="#446688">
    <text x="79" y="160" filter="url(#rough2)">sz0</text>
    <text x="139" y="160" filter="url(#rough2)">sz1</text>
    <text x="199" y="160" filter="url(#rough2)">sz2</text>
    <text x="259" y="160" fill="#8c3a37" filter="url(#rough2)">sz3</text>
    <text x="319" y="160" filter="url(#rough2)">sz4</text>
    <text x="379" y="160" filter="url(#rough2)">sz5</text>
    <text x="439" y="160" filter="url(#rough2)">sz6</text>
  </g>

  <!-- 区间标注 -->
  <path d="M 52 182 L 166 182" stroke="#2f4a66" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 52 176 L 52 188" stroke="#2f4a66" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 166 176 L 166 188" stroke="#2f4a66" stroke-width="2" filter="url(#rough2)"/>
  <text x="109" y="202" text-anchor="middle" font-size="11.2" fill="#2f4a66" filter="url(#rough2)">黑前缀 [0..i]</text>

  <path d="M 406 182 L 466 182" stroke="#2f4a66" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 406 176 L 406 188" stroke="#2f4a66" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 466 176 L 466 188" stroke="#2f4a66" stroke-width="2" filter="url(#rough2)"/>
  <text x="436" y="202" text-anchor="middle" font-size="11.2" fill="#2f4a66" filter="url(#rough2)">黑后缀 [j..L−1]</text>

  <path d="M 172 182 L 406 182" stroke="#d6a040" stroke-width="2.2" stroke-dasharray="7 5" fill="none" filter="url(#rough2)"/>
  <text x="289" y="202" text-anchor="middle" font-size="11.4" fill="#8a6015" filter="url(#rough2)">白缺口 [i+1..j−1]</text>
  <path d="M 259 68 L 259 52" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="259" y="46" text-anchor="middle" font-size="10.8" fill="#8c3a37" filter="url(#rough2)">缺口只剩它时 = 结束点</text>

  <!-- 右侧说明 -->
  <rect x="500" y="70" width="258" height="140" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="512" y="94" font-size="12.2" font-weight="bold" fill="#33582a" filter="url(#rough2)">两个量决定局面</text>
  <text x="512" y="118" font-size="11.4" fill="#33582a" filter="url(#rough2)">① 区间 (i,j)：主干还剩哪段白的</text>
  <text x="512" y="140" font-size="11.4" fill="#33582a" filter="url(#rough2)">② c 的奇偶：已经吃掉的旁支点数</text>
  <text x="512" y="166" font-size="11.4" fill="#33582a" filter="url(#rough2)">池 r = cnt − c，只有 r 的奇偶有意义</text>
  <text x="512" y="188" font-size="11.4" fill="#33582a" filter="url(#rough2)">cnt = 挂在黑干点上的旁支点总数</text>

  <!-- 转移图 -->
  <rect x="52" y="240" width="196" height="66" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="266" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">f(i,j)：c 为偶数</text>
  <text x="150" y="290" text-anchor="middle" font-size="10.6" fill="#2f4a66" filter="url(#rough2)">= max(1−f(i+1,j), 1−f(i,j−1))</text>

  <rect x="52" y="322" width="196" height="66" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="348" text-anchor="middle" font-size="13" font-weight="bold" fill="#8c3a37" filter="url(#rough2)">g(i,j)：c 为奇数</text>
  <text x="150" y="372" text-anchor="middle" font-size="10.6" fill="#8c3a37" filter="url(#rough2)">= max(1−g(i+1,j), 1−g(i,j−1))</text>

  <path d="M 254 273 L 296 273" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 254 355 L 296 355" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="300" y="240" width="196" height="66" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="398" y="262" text-anchor="middle" font-size="11.8" fill="#8a6015" filter="url(#rough2)">吃一个旁支点（得 1 分）：</text>
  <text x="398" y="282" text-anchor="middle" font-size="11.8" fill="#8a6015" filter="url(#rough2)">f(i,j) ← 1 − g(i,j)</text>
  <text x="398" y="300" text-anchor="middle" font-size="10.8" fill="#8a6015" filter="url(#rough2)">仅当 r 为奇数（保证池非空）</text>

  <rect x="300" y="322" width="196" height="66" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="398" y="344" text-anchor="middle" font-size="11.8" fill="#8a6015" filter="url(#rough2)">g(i,j) ← 1 − f(i,j)</text>
  <text x="398" y="364" text-anchor="middle" font-size="10.8" fill="#8a6015" filter="url(#rough2)">g 态下 r 的奇偶正好反过来</text>

  <rect x="512" y="240" width="246" height="148" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="524" y="264" font-size="12.2" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">边界（缺口只剩 p[i+1]）</text>
  <text x="524" y="288" font-size="11.4" fill="#2f4a66" filter="url(#rough2)">f(i,i+2) = cnt mod 2</text>
  <text x="524" y="310" font-size="11.4" fill="#2f4a66" filter="url(#rough2)">g(i,i+2) = 1 − cnt mod 2</text>
  <text x="524" y="336" font-size="11" fill="#2f4a66" filter="url(#rough2)">此时结束点连同它的挂载子树</text>
  <text x="524" y="354" font-size="11" fill="#2f4a66" filter="url(#rough2)">净贡献为 0，只剩池的奇偶</text>
  <text x="524" y="378" font-size="11.4" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">答案 = f(0, L−1)</text>

  <text x="390" y="420" text-anchor="middle" font-size="11.2" fill="#66788c" filter="url(#rough2)">缺口长度每轮减 1：L−1 个缺口 → 全部状态 O(L²) 个，每个 O(1) 转移</text>
</svg>
