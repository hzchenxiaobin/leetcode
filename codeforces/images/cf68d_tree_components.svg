<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">删掉根到叶子的链后，每个分量 = 链上一点 + 它的另一棵子树</text>
  <path d="M 100 38 Q 360 44 620 38" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 分量底色 -->
  <ellipse cx="512" cy="188" rx="150" ry="72" fill="#e8f0fe" fill-opacity="0.8" stroke="#446688" stroke-width="1.4" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <ellipse cx="196" cy="206" rx="96" ry="62" fill="#e6f4ea" fill-opacity="0.85" stroke="#2f7a3a" stroke-width="1.4" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <circle cx="284" cy="248" r="30" fill="#fdecea" fill-opacity="0.9" stroke="#b85450" stroke-width="1.4" stroke-dasharray="6 4" filter="url(#rough2)"/>

  <!-- 边 -->
  <g filter="url(#rough2)" stroke="#666" stroke-width="1.6" fill="none">
    <line x1="360" y1="86" x2="204" y2="140"/>
    <line x1="360" y1="86" x2="516" y2="140"/>
    <line x1="516" y1="164" x2="444" y2="228"/>
    <line x1="516" y1="164" x2="588" y2="228"/>
    <line x1="204" y1="164" x2="128" y2="228"/>
  </g>
  <!-- 被删的边 -->
  <g filter="url(#rough2)" stroke="#b85450" stroke-width="2.4" stroke-dasharray="7 5" fill="none">
    <line x1="360" y1="86" x2="204" y2="140"/>
    <line x1="204" y1="164" x2="284" y2="226"/>
  </g>
  <g filter="url(#rough2)" stroke="#b85450" stroke-width="2.6">
    <line x1="266" y1="100" x2="288" y2="122"/>
    <line x1="288" y1="100" x2="266" y2="122"/>
    <line x1="228" y1="186" x2="250" y2="208"/>
    <line x1="250" y1="186" x2="228" y2="208"/>
  </g>

  <!-- 节点 -->
  <g filter="url(#rough2)" font-size="15" font-weight="bold" text-anchor="middle">
    <circle cx="360" cy="76" r="22" fill="#ffffff" stroke="#333" stroke-width="1.8"/>
    <text x="360" y="82" fill="#2b2b2b">1</text>
    <circle cx="204" cy="152" r="22" fill="#ffffff" stroke="#2f7a3a" stroke-width="1.8"/>
    <text x="204" y="158" fill="#1f5226">2</text>
    <circle cx="516" cy="152" r="22" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
    <text x="516" y="158" fill="#2f4a66">3</text>
    <circle cx="124" cy="244" r="20" fill="#ffffff" stroke="#2f7a3a" stroke-width="1.6"/>
    <text x="124" y="250" fill="#1f5226">4</text>
    <circle cx="284" cy="244" r="20" fill="#ffffff" stroke="#b85450" stroke-width="1.8"/>
    <text x="284" y="250" fill="#8c2f2b">5</text>
    <circle cx="440" cy="244" r="20" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
    <text x="440" y="250" fill="#2f4a66">6</text>
    <circle cx="592" cy="244" r="20" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
    <text x="592" y="250" fill="#2f4a66">7</text>
  </g>

  <!-- 分量说明 -->
  <text x="512" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">C₀ = a(1) + S(3)</text>
  <text x="196" y="214" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f5226" filter="url(#rough2)">C₁ = a(2) + S(4)</text>
  <text x="284" y="300" text-anchor="middle" font-size="12" font-weight="bold" fill="#8c2f2b" filter="url(#rough2)">C₂ = a(5)</text>

  <text x="24" y="86" font-size="11.5" fill="#8c2f2b" filter="url(#rough2)">红色虚线 = 被删掉的边</text>
  <text x="24" y="108" font-size="11.5" fill="#8c2f2b" filter="url(#rough2)">（这里选中的叶子是 5）</text>

  <!-- 公式条 -->
  <rect x="24" y="322" width="672" height="58" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="40" y="346" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">电势 = max(C₀, C₁, C₂)；且 C_d = S(v_d) - S(v_{d+1})，只依赖链上相邻两点的子树和</text>
  <text x="40" y="370" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">叶子 5 单独成块（电荷 7），它的父边被删；分量 C₀、C₁ 各自并上"另一棵子树"</text>
</svg>
