<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="760" height="500" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="17" fill="#333"
        filter="url(#rough2)">判定流程：0 / 1 / 2 / 3 四层，逐层下探</text>
  <text x="380" y="52" text-anchor="middle" font-size="12" fill="#666"
        filter="url(#rough2)">每层只花 O(1) 或 O(扫描上限) 次 gcd，命中即返回</text>

  <rect x="120" y="70" width="220" height="42" rx="10" fill="#f2f2f2" stroke="#666"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="230" y="96" text-anchor="middle" font-size="12.5" fill="#333"
        filter="url(#rough2)">读入 a, b（多测）</text>

  <path d="M230,112 L230,138" stroke="#446688" stroke-width="1.7" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="230,140 340,175 230,210 120,175" fill="#fff8e1" stroke="#d6a040"
           stroke-width="1.7" filter="url(#rough2)"/>
  <text x="230" y="180" text-anchor="middle" font-size="13" fill="#8a5a00"
        filter="url(#rough2)">a = b ?</text>

  <path d="M342,175 L386,175" stroke="#b85450" stroke-width="1.7" fill="none"
        marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="364" y="166" text-anchor="middle" font-size="10.5" fill="#8a3a36"
        filter="url(#rough2)">是</text>
  <rect x="392" y="153" width="300" height="42" rx="9" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="542" y="179" text-anchor="middle" font-size="12.5" fill="#2f5a24"
        filter="url(#rough2)">k = 0，第二行可省略</text>

  <path d="M230,210 L230,238" stroke="#446688" stroke-width="1.7" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="240" y="230" text-anchor="start" font-size="10.5" fill="#666"
        filter="url(#rough2)">否</text>

  <polygon points="230,240 340,275 230,310 120,275" fill="#fff8e1" stroke="#d6a040"
           stroke-width="1.7" filter="url(#rough2)"/>
  <text x="230" y="280" text-anchor="middle" font-size="12.5" fill="#8a5a00"
        filter="url(#rough2)">gcd(a, b) = 1 ?</text>

  <path d="M342,275 L386,275" stroke="#b85450" stroke-width="1.7" fill="none"
        marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="364" y="266" text-anchor="middle" font-size="10.5" fill="#8a3a36"
        filter="url(#rough2)">是</text>
  <rect x="392" y="253" width="300" height="42" rx="9" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="542" y="279" text-anchor="middle" font-size="12.5" fill="#2f5a24"
        filter="url(#rough2)">k = 1，输出 x = b − a</text>

  <path d="M230,310 L230,338" stroke="#446688" stroke-width="1.7" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="240" y="330" text-anchor="start" font-size="10.5" fill="#666"
        filter="url(#rough2)">否</text>

  <rect x="86" y="340" width="288" height="52" rx="8" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230" y="361" text-anchor="middle" font-size="11.5" fill="#2c4a6b"
        filter="url(#rough2)">枚举 j = 1 … min(d − 1, CAP)，m = a + j</text>
  <text x="230" y="381" text-anchor="middle" font-size="11.5" fill="#2c4a6b"
        filter="url(#rough2)">gcd(a, j) = 1 且 gcd(a + j, b) = 1 ？</text>

  <path d="M376,366 L386,366" stroke="#b85450" stroke-width="1.7" fill="none"
        marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="392" y="344" width="300" height="44" rx="9" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="542" y="371" text-anchor="middle" font-size="12.5" fill="#2f5a24"
        filter="url(#rough2)">k = 2，输出 (j, d − j)</text>

  <path d="M230,392 L230,420" stroke="#446688" stroke-width="1.7" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="240" y="412" text-anchor="start" font-size="10.5" fill="#666"
        filter="url(#rough2)">全不中</text>

  <rect x="86" y="420" width="288" height="60" rx="8" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230" y="442" text-anchor="middle" font-size="11.5" fill="#8a3a36"
        filter="url(#rough2)">k = 3：先挑 m₁（与 a 互素），</text>
  <text x="230" y="462" text-anchor="middle" font-size="11.5" fill="#8a3a36"
        filter="url(#rough2)">再挑 m₂ ∈ (m₁, b)（与 m₁、b 都互素）</text>

  <path d="M376,448 L386,448" stroke="#b85450" stroke-width="1.7" fill="none"
        marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="392" y="424" width="300" height="48" rx="9" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.7" filter="url(#rough2)"/>
  <text x="542" y="453" text-anchor="middle" font-size="11.5" fill="#8a5a00"
        filter="url(#rough2)">k = 3，输出 (m₁−a, m₂−m₁, b−m₂)</text>

</svg>
