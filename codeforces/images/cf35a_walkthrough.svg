<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="211"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="280" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1：1 →(1,2) 2 →(2,1) 1 →(2,1) 2</text>
  <g filter="url(#rough2)">
    <circle cx="90" cy="120" r="26" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="90" y="127" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">1</text>
    <text x="90" y="170" text-anchor="middle" font-size="11" fill="#666">起点</text>
    <circle cx="230" cy="120" r="26" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="230" y="127" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">2</text>
    <text x="230" y="170" text-anchor="middle" font-size="11" fill="#666">交换(1,2)</text>
    <circle cx="370" cy="120" r="26" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="370" y="127" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">1</text>
    <text x="370" y="170" text-anchor="middle" font-size="11" fill="#666">交换(2,1)</text>
    <circle cx="510" cy="120" r="26" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="510" y="127" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">2</text>
    <text x="510" y="170" text-anchor="middle" font-size="11" fill="#666">交换(2,1)</text>
    <circle cx="640" cy="120" r="26" fill="#eef4ec" stroke="#4a7a3a" stroke-width="2"/>
    <text x="640" y="127" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">2</text>
    <text x="640" y="170" text-anchor="middle" font-size="11" fill="#666">结果</text>
  </g>
  <g stroke="#446688" stroke-width="1.6" filter="url(#rough2)">
    <line x1="118" y1="120" x2="200" y2="120" marker-end="url(#ar)"/>
    <line x1="258" y1="120" x2="340" y2="120" marker-end="url(#ar)"/>
    <line x1="398" y1="120" x2="480" y2="120" marker-end="url(#ar)"/>
    <line x1="538" y1="120" x2="612" y2="120" marker-end="url(#ar)"/>
  </g>
  <rect x="70" y="204" width="580" height="56" rx="9" fill="#eef4ec" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="86" y="228" font-size="12.5" fill="#2f5223" filter="url(#rough2)">球的位置序列：1, 2, 1, 2，输出 2。</text>
  <text x="86" y="250" font-size="12.5" fill="#2f5223" filter="url(#rough2)">第二次交换 (2,1) 与第一次方向相反，但效果对称。</text>
</svg>
