<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar6" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">操作序列 = 先把自己的 b 加到最大，再乘一串非降的因子</text>
  <path d="M 76 42 Q 360 48 644 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 两个格子 -->
  <g filter="url(#rough2)">
    <rect x="60" y="66" width="120" height="52" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.6"/>
    <rect x="200" y="66" width="120" height="52" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#22314a" filter="url(#rough2)">
    <text x="120" y="86">第一格 a</text>
    <text x="260" y="86">第二格 b</text>
  </g>
  <g font-size="17" text-anchor="middle" fill="#22314a" filter="url(#rough2)">
    <text x="120" y="110">1</text>
    <text x="260" y="110">0</text>
  </g>

  <!-- 操作序列 -->
  <text x="60" y="152" font-size="13" fill="#333" filter="url(#rough2)">例：要得到 x = 6</text>
  <g font-size="12.5" text-anchor="middle" filter="url(#rough2)">
    <rect x="60" y="164" width="86" height="40" rx="6" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.4"/>
    <text x="103" y="182" fill="#8a6015">b: 0→1</text>
    <text x="103" y="198" fill="#8a6015">a=1×1=1</text>

    <rect x="166" y="164" width="86" height="40" rx="6" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.4"/>
    <text x="209" y="182" fill="#8a6015">b: 1→2</text>
    <text x="209" y="198" fill="#8a6015">a=1×2=2</text>

    <rect x="272" y="164" width="86" height="40" rx="6" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.4"/>
    <text x="315" y="182" fill="#8a6015">b: 2→3</text>
    <text x="315" y="198" fill="#8a6015">a=2×3=6</text>
  </g>
  <g stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)">
    <path d="M 148 184 L 162 184" marker-end="url(#ar6)"/>
    <path d="M 254 184 L 268 184" marker-end="url(#ar6)"/>
  </g>
  <text x="400" y="180" font-size="12.5" fill="#333" filter="url(#rough2)">共 5 步：3 次自增 + 2 次乘法</text>
  <text x="400" y="202" font-size="12.5" fill="#333" filter="url(#rough2)">x = 1 × 2 × 3 = 6，因子 (2,3) 非降</text>

  <!-- 结论 -->
  <g filter="url(#rough2)">
    <rect x="60" y="218" width="600" height="84" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.2"/>
  </g>
  <g font-size="12.5" fill="#22314a" filter="url(#rough2)">
    <text x="74" y="244">b 只增不减，所以用到的乘数（因子）必然非降；</text>
    <text x="74" y="266">反过来任何非降因子序列都能实现：先自增到 f₁ 再乘，</text>
    <text x="74" y="288">再自增到 f₂ 再乘，……最后停在 f_k。</text>
  </g>

  <!-- 数值 -->
  <g filter="url(#rough2)">
    <rect x="60" y="308" width="286" height="104" rx="8" fill="#ffffff" stroke="#888" stroke-width="1.2"/>
    <rect x="374" y="308" width="286" height="104" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <g font-size="12.5" fill="#333" filter="url(#rough2)">
    <text x="74" y="332">x = 12 的几种分解（p = 100）：</text>
    <text x="74" y="354">12 = 12 → 12+1 = 13 步</text>
    <text x="74" y="374">12 = 3×4 → 4+2 = 6 步</text>
    <text x="74" y="394">12 = 2×2×3 → 3+3 = 6 步</text>
  </g>
  <g font-size="12.5" fill="#2f5223" filter="url(#rough2)">
    <text x="388" y="332">所有因子 ≤ p-1 ≤ 99，</text>
    <text x="388" y="354">所以 x 的素因子全 ≤ 97：</text>
    <text x="388" y="374">x 必是 97-光滑数，</text>
    <text x="388" y="394">≤ 10⁹ 的只有 2 944 730 个。</text>
  </g>
</svg>
