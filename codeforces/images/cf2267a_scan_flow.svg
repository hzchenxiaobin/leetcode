<svg xmlns="http://www.w3.org/2000/svg" width="780" height="500" viewBox="0 0 780 500"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="780" height="500" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：扫过每个镜像对，按三类代价累加</text>
  <path d="M 130 40 Q 390 48 650 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 循环框 -->
  <rect x="56" y="52" width="660" height="376" rx="12" fill="none" stroke="#a9a9a9" stroke-width="1.4"
        stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="72" y="74" font-size="12" fill="#6a6a6a" filter="url(#rough2)">对 i = 1 … ⌊n/2⌋ 与 j = n+1−i，逐个镜像对结算</text>

  <!-- 判断 1 -->
  <polygon points="154,156 240,124 326,156 240,188" fill="#fff8e1" stroke="#d6a040" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="240" y="161" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">sᵢ = sⱼ ？</text>

  <!-- 是：代价 0 -->
  <path d="M 328 156 L 422 156" stroke="#4a7a3a" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="376" y="148" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="428" y="132" width="232" height="48" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="544" y="153" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">代价 0</text>
  <text x="544" y="171" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">本来就对称，直接跳过</text>

  <!-- 否 -->
  <path d="M 240 190 L 240 208" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="252" y="204" font-size="11.5" fill="#446688" filter="url(#rough2)">否</text>

  <!-- 判断 2 -->
  <polygon points="144,242 240,210 336,242 240,274" fill="#fff8e1" stroke="#d6a040" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="240" y="247" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">sᵢ 或 sⱼ 是 c ？</text>

  <!-- 是：代价 1 -->
  <path d="M 338 242 L 422 242" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="381" y="234" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">是</text>
  <rect x="428" y="218" width="232" height="48" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="544" y="239" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">代价 1</text>
  <text x="544" y="257" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">把另一侧也覆盖成 c</text>

  <!-- 否 -->
  <path d="M 240 276 L 240 296" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="252" y="292" font-size="11.5" fill="#446688" filter="url(#rough2)">否</text>

  <!-- 代价 2 -->
  <rect x="140" y="300" width="200" height="52" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="240" y="322" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8c3b38" filter="url(#rough2)">代价 2</text>
  <text x="240" y="341" text-anchor="middle" font-size="11.5" fill="#8c3b38" filter="url(#rough2)">两侧都必须覆盖成 c</text>

  <!-- 右侧汇流轨 -->
  <path d="M 660 156 L 688 156 L 688 392" stroke="#8a6015" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 660 242 L 688 242" stroke="#8a6015" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 688 392 L 538 392" stroke="#8a6015" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 累加框 -->
  <path d="M 240 354 L 240 364" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150" y="368" width="384" height="48" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="342" y="388" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">ans += 该对代价，再 i++、j−−</text>
  <text x="342" y="406" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">扫完 ⌊n/2⌋ 对后输出 ans</text>

  <text x="390" y="452" text-anchor="middle" font-size="12.5" fill="#5a5a5a" filter="url(#rough2)">多测：每组的 ans 从 0 重新开始，逐组输出；n 为奇数时中间字符不参与任何一对</text>
  <text x="390" y="476" text-anchor="middle" font-size="12.5" fill="#5a5a5a" filter="url(#rough2)">三类判断互斥且完备，所以每对代价可以单独决定，不需要回头修改</text>
</svg>
