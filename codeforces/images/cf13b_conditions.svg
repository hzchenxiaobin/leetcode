<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>

  <rect width="720" height="420" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">字母 A：两条腿 + 一条横杠</text>
  <path d="M 175 44 Q 360 50 545 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 两条腿 -->
  <path d="M 360 80 L 240 320" stroke="#446688" stroke-width="3.2" fill="none" filter="url(#rough2)"/>
  <path d="M 360 80 L 480 320" stroke="#446688" stroke-width="3.2" fill="none" filter="url(#rough2)"/>
  <!-- 横杠 -->
  <path d="M 300 200 L 420 200" stroke="#b85450" stroke-width="3.2" fill="none" filter="url(#rough2)"/>

  <!-- 角 -->
  <path d="M 339 121 A 46 46 0 0 1 381 121" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="360" y="146" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">θ</text>
  <text x="360" y="164" text-anchor="middle" font-size="10.5" fill="#8a6015" filter="url(#rough2)">0° &lt; θ ≤ 90°</text>

  <!-- 端点 -->
  <circle cx="360" cy="80" r="4.5" fill="#2b2b2b" filter="url(#rough2)"/>
  <text x="360" y="58" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">公共端点 O</text>
  <circle cx="300" cy="200" r="4" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="420" cy="200" r="4" fill="#b85450" filter="url(#rough2)"/>
  <text x="286" y="194" text-anchor="end" font-size="12" font-weight="bold" fill="#a33a36" filter="url(#rough2)">Q₁</text>
  <text x="434" y="194" font-size="12" font-weight="bold" fill="#a33a36" filter="url(#rough2)">Q₂</text>
  <text x="300" y="220" text-anchor="middle" font-size="10.5" fill="#a33a36" filter="url(#rough2)">t₁</text>
  <text x="420" y="220" text-anchor="middle" font-size="10.5" fill="#a33a36" filter="url(#rough2)">t₂</text>
  <text x="228" y="338" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">A₁</text>
  <text x="492" y="338" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">A₂</text>

  <rect x="30" y="356" width="660" height="54" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="46" y="380" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">① 两条腿共享端点 O；② 0° &lt; θ ≤ 90°；③ 横杠两端分别落在两条腿上（不同腿）</text>
  <text x="46" y="402" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">④ 比例：t = OQ/OA ∈ [1/5, 4/5]，等价于短段/长段 ≥ 1/4</text>
</svg>
