<svg xmlns="http://www.w3.org/2000/svg" width="880" height="350" viewBox="0 0 880 350"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="350" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 3：(1,10) → (1,1) 反而要绕到第 2 行</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">a = [10,1,10]；直接左移要 9 步，借短行压列只要 3 步</text>
  <g filter="url(#rough2)"><rect x="60" y="130" width="176" height="56" rx="4" fill="#cfe0f0" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="148" y="163" text-anchor="middle" font-size="13.5" fill="#2b2b2b" filter="url(#rough2)">起点 (1,10)</text>
  <g filter="url(#rough2)"><rect x="266" y="130" width="176" height="56" rx="4" fill="#f6e3c4" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="354" y="163" text-anchor="middle" font-size="13.5" fill="#2b2b2b" filter="url(#rough2)">下移 → (2,2)</text>
  <line x1="240" y1="158" x2="262" y2="158" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="472" y="130" width="176" height="56" rx="4" fill="#d7ecd0" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="560" y="163" text-anchor="middle" font-size="13.5" fill="#2b2b2b" filter="url(#rough2)">上移 → (1,2)</text>
  <line x1="446" y1="158" x2="468" y2="158" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="678" y="130" width="176" height="56" rx="4" fill="#f6d9d7" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="766" y="163" text-anchor="middle" font-size="13.5" fill="#2b2b2b" filter="url(#rough2)">左移 → (1,1)</text>
  <line x1="652" y1="158" x2="674" y2="158" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="440" y="232" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">第 2 行只有 1 个字符 → 顶点的行末位置是 2，于是列被夹到 2</text>
  <text x="440" y="266" text-anchor="middle" font-size="13" fill="#3d6b2f" filter="url(#rough2)">直接在第 1 行左移 9 步；绕行只要 1+1+1 = 3 步</text>
  <text x="440" y="300" text-anchor="middle" font-size="12.5" fill="#b05a5a" filter="url(#rough2)">这就是不能“只沿竖直方向直走 + 最后横向补齐”的原因</text>
</svg>
