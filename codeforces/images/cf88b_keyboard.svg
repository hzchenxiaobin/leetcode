<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="885"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="340" fill="#fafafa"/>
  <text x="360.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">键盘上量距离：比较 d² 与 x²</text>
  <path d="M 115.2 42 Q 360.0 48 604.8 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="360.0" y="326" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">样例 3：S 在 (1,1)，x = 1</text>
  <rect x="90" y="70" width="66" height="66" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="123.0" y="111.0" text-anchor="middle" font-size="20" font-weight="bold" fill="#2f5223" filter="url(#rough2)">a</text>
  <rect x="156" y="70" width="66" height="66" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="189.0" y="111.0" text-anchor="middle" font-size="20" font-weight="bold" fill="#2f5223" filter="url(#rough2)">b</text>
  <rect x="90" y="136" width="66" height="66" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="123.0" y="177.0" text-anchor="middle" font-size="20" font-weight="bold" fill="#2f5223" filter="url(#rough2)">c</text>
  <rect x="156" y="136" width="66" height="66" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="189.0" y="177.0" text-anchor="middle" font-size="20" font-weight="bold" fill="#8a6015" filter="url(#rough2)">S</text>
  <line x1="123.0" y1="103.0" x2="189.0" y2="169.0" stroke="#5a7fb0" stroke-width="1.5" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <text x="159.3" y="145.89999999999998" text-anchor="middle" font-size="12" fill="#335478" filter="url(#rough2)">√2</text>
  <line x1="189.0" y1="103.0" x2="189.0" y2="169.0" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <text x="179.10000000000002" y="136.0" text-anchor="middle" font-size="12" fill="#8c2f2c" filter="url(#rough2)">1</text>
  <rect x="300" y="70" width="380" height="120" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490" y="96" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">a → S：d² = 1² + 1² = 2 &gt; 1 → 大写 A 要换手</text>
  <text x="490" y="122" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">b → S：d² = 1 → 大写 B 不用换手</text>
  <text x="490" y="148" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">c → S：d² = 1 → 大写 C 不用换手</text>
  <text x="490" y="172" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">比较用整数平方，避免 sqrt 的误差</text>
  <rect x="90" y="232" width="570" height="44" rx="8" fill="#f4f4f0" stroke="#8a8a8a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="375" y="250" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">键是边长 1 的正方形且无缝隙 ⇒ 相邻键中心距为 1</text>
  <text x="375" y="268" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">所以 d² = Δ行² + Δ列²</text>
</svg>
