<svg xmlns="http://www.w3.org/2000/svg" width="660" height="418" viewBox="0 0 660 418"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="660" height="418" fill="#fafafa"/>

  <text x="330" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">关键观察：删除顺序可以任意安排，只剩计数约束</text>
  <text x="330" y="52" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">同一批字符换个删除顺序就能合法 —— 顺序不是限制，「删了几个 0 / 几个 1」才是限制</text>

  <!-- 字符串条：s = 1 0 0 0 1 0 -->
  <text x="176" y="74" text-anchor="end" font-size="12" fill="#666" filter="url(#rough2)">s =</text>
  <g filter="url(#rough2)">
    <rect x="178" y="76" width="44" height="44" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="230" y="76" width="44" height="44" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="282" y="76" width="44" height="44" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="334" y="76" width="44" height="44" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="386" y="76" width="44" height="44" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="438" y="76" width="44" height="44" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <g font-size="13" fill="#555" filter="url(#rough2)">
    <text x="200" y="70" text-anchor="middle">0</text>
    <text x="252" y="70" text-anchor="middle">1</text>
    <text x="304" y="70" text-anchor="middle">2</text>
    <text x="356" y="70" text-anchor="middle">3</text>
    <text x="408" y="70" text-anchor="middle">4</text>
    <text x="460" y="70" text-anchor="middle">5</text>
  </g>
  <g font-size="19" font-weight="bold" filter="url(#rough2)">
    <text x="200" y="105" text-anchor="middle" fill="#8a4a44">1</text>
    <text x="252" y="105" text-anchor="middle" fill="#2e6e2e">0</text>
    <text x="304" y="105" text-anchor="middle" fill="#8a4a44">0</text>
    <text x="356" y="105" text-anchor="middle" fill="#8a4a44">0</text>
    <text x="408" y="105" text-anchor="middle" fill="#2e6e2e">1</text>
    <text x="460" y="105" text-anchor="middle" fill="#2e6e2e">0</text>
  </g>
  <text x="500" y="96" font-size="11.5" fill="#8a4a44" filter="url(#rough2)">红 = 删除</text>
  <text x="500" y="113" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">绿 = 保留</text>
  <text x="330" y="140" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">删掉 s[0]=1、s[2]=0、s[3]=0，留下的 "010" 已是交替串</text>

  <!-- 两条删除顺序 -->
  <g filter="url(#rough2)">
    <rect x="44" y="158" width="272" height="86" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7"/>
  </g>
  <text x="180" y="182" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">删除序 ①：0 → 1 → 0</text>
  <text x="180" y="207" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">✓ 严格交替，合法</text>
  <text x="180" y="228" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">删 2 个 0、1 个 1，差 1</text>

  <g filter="url(#rough2)">
    <rect x="344" y="158" width="272" height="86" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.7"/>
  </g>
  <text x="480" y="182" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a4a44" filter="url(#rough2)">删除序 ②：0 → 0 → 1</text>
  <text x="480" y="207" text-anchor="middle" font-size="11.5" fill="#8a4a44" filter="url(#rough2)">✗ 出现相邻相同字符</text>
  <text x="480" y="228" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">同一批字符，只是排错了顺序</text>

  <text x="330" y="266" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">⇒ 只要 |删0 − 删1| ≤ 1，总能把删除序排成 0101… 或 1010…</text>

  <!-- 结论框 -->
  <g filter="url(#rough2)">
    <rect x="44" y="282" width="572" height="112" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="60" y="308" font-size="12.5" font-weight="bold" fill="#33517a" filter="url(#rough2)">于是「能删掉」⇔ |删0 − 删1| ≤ 1，同时保留串必须是交替子序列</text>
  <text x="60" y="334" font-size="12" fill="#33517a" filter="url(#rough2)">删0 = Z − a，删1 = O − b　（Z, O 为全串 0/1 总数，a, b 为保留下来的 0/1 个数）</text>
  <text x="60" y="360" font-size="12" fill="#33517a" filter="url(#rough2)">代入得：|(Z − O) − (a − b)| = |d − t| ≤ 1，其中 d = Z − O，t = a − b</text>
  <text x="60" y="382" font-size="11.5" fill="#446688" filter="url(#rough2)">交替串必满足 |a − b| ≤ 1，所以 t 只需要试 −1、0、1 三个值</text>
</svg>
