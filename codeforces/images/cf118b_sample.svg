<svg xmlns="http://www.w3.org/2000/svg" width="880" height="290" viewBox="0 0 880 290"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="117"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="290" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 n=2</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">缩进 4,2,0,2,4</text>
  <text x="320" y="104" text-anchor="start" font-size="14" fill="#2b2b2b" filter="url(#rough2)">    0</text>
  <text x="320" y="138" text-anchor="start" font-size="14" fill="#2b2b2b" filter="url(#rough2)">  0 1 0</text>
  <text x="320" y="172" text-anchor="start" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">0 1 2 1 0</text>
  <text x="320" y="206" text-anchor="start" font-size="14" fill="#2b2b2b" filter="url(#rough2)">  0 1 0</text>
  <text x="320" y="240" text-anchor="start" font-size="14" fill="#2b2b2b" filter="url(#rough2)">    0</text>
  <text x="600" y="150" text-anchor="start" font-size="11" fill="#3d6b2f" filter="url(#rough2)">严格按此格式输出</text>
