<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="720" height="280" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每个文件夹最多 2 天亏损；贪心：遇到第 3 个亏损就切一刀</text>
  <rect x="60" y="60" width="600" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="360" y="87" text-anchor="middle" font-size="11.5" fill="#2f5223">顺序扫描，累计当前文件夹的亏损天数；若再来一天亏损且已达 2 → 先开新文件夹</text>
  <rect x="60" y="130" width="600" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="360" y="157" text-anchor="middle" font-size="11.5" fill="#2f4a66">为什么最优：任何方案的第 3 个亏损天必须落在新文件夹，切在「刚好第 3 个亏损之前」不浪费名额</text>
  <text x="60" y="214" text-anchor="start" font-size="11.5" fill="#7a4b22" filter="url(#rough2)">样例 1：1 2 3 -4 -5 | -6 5 -5 | -6 -7 6 → 3 个文件夹（5 3 3）</text>
  <text x="60" y="240" text-anchor="start" font-size="11.5" fill="#2f5223" filter="url(#rough2)">样例 2：0 -1 100 -1 0 只有 2 个亏损 → 一个文件夹 ✓</text>
</svg>
