<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 0 780 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="331"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrV" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrW" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b06a2c"/>
    </marker>
  </defs>

  <rect width="780" height="440" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">状态是"还活着哪些鱼"：选一对（等概率），再按 a 决定谁吃谁</text>

  <!-- 顶层 -->
  <rect x="300" y="50" width="180" height="42" rx="9" fill="#dbe7fb" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="390" y="77" text-anchor="middle" font-size="14" fill="#23405c" filter="url(#rough2)">{1, 2, 3}　k = 3</text>

  <!-- 选对 (1,2) -->
  <path d="M 390 92 L 390 132" stroke="#446688" stroke-width="1.7" fill="none"
        marker-end="url(#arrV)" filter="url(#rough2)"/>
  <text x="400" y="118" font-size="10.5" fill="#446688" filter="url(#rough2)">选中 ({1,2}) 的概率 = 1/3</text>

  <rect x="320" y="136" width="140" height="36" rx="8" fill="#eef4ff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="390" y="159" text-anchor="middle" font-size="12" fill="#23405c" filter="url(#rough2)">相遇对 {1, 2}</text>

  <!-- 两个结果 -->
  <path d="M 360 172 L 268 218" stroke="#b06a2c" stroke-width="1.6" fill="none"
        marker-end="url(#arrW)" filter="url(#rough2)"/>
  <text x="270" y="196" font-size="10.5" fill="#8a4a14" filter="url(#rough2)">1 吃 2，概率 a₁₂</text>

  <path d="M 420 172 L 512 218" stroke="#b06a2c" stroke-width="1.6" fill="none"
        marker-end="url(#arrW)" filter="url(#rough2)"/>
  <text x="430" y="196" font-size="10.5" fill="#8a4a14" filter="url(#rough2)">2 吃 1，概率 a₂₁ = 1 - a₁₂</text>

  <rect x="180" y="222" width="150" height="42" rx="9" fill="#fff1e6" stroke="#b06a2c" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="255" y="249" text-anchor="middle" font-size="14" fill="#8a4a14" filter="url(#rough2)">{1, 3}　k = 2</text>

  <rect x="450" y="222" width="150" height="42" rx="9" fill="#fff1e6" stroke="#b06a2c" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="525" y="249" text-anchor="middle" font-size="14" fill="#8a4a14" filter="url(#rough2)">{2, 3}　k = 2</text>

  <!-- 其它两对 -->
  <rect x="66" y="136" width="130" height="34" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.2"
        stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="131" y="158" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">相遇对 {1, 3}</text>
  <rect x="584" y="136" width="130" height="34" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.2"
        stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="649" y="158" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">相遇对 {2, 3}</text>

  <path d="M 330 92 L 150 132" stroke="#999999" stroke-width="1.3" stroke-dasharray="5 4" fill="none"
        marker-end="url(#arrV)" filter="url(#rough2)"/>
  <path d="M 450 92 L 630 132" stroke="#999999" stroke-width="1.3" stroke-dasharray="5 4" fill="none"
        marker-end="url(#arrV)" filter="url(#rough2)"/>
  <text x="150" y="116" font-size="9.5" fill="#888" filter="url(#rough2)">同样 1/3</text>
  <text x="640" y="116" font-size="9.5" fill="#888" filter="url(#rough2)">同样 1/3</text>

  <!-- 单点 -->
  <path d="M 255 264 L 255 300" stroke="#4a7a3a" stroke-width="1.5" fill="none"
        marker-end="url(#arrV)" filter="url(#rough2)"/>
  <path d="M 525 264 L 525 300" stroke="#4a7a3a" stroke-width="1.5" fill="none"
        marker-end="url(#arrV)" filter="url(#rough2)"/>
  <text x="262" y="286" font-size="10" fill="#2f5223" filter="url(#rough2)">再相遇一次 → {1} 或 {3}</text>
  <text x="532" y="286" font-size="10" fill="#2f5223" filter="url(#rough2)">再相遇一次 → {2} 或 {3}</text>

  <rect x="180" y="304" width="150" height="34" rx="8" fill="#cfeacf" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="255" y="326" text-anchor="middle" font-size="12" fill="#204a1e" filter="url(#rough2)">{1} 或 {3}</text>
  <rect x="450" y="304" width="150" height="34" rx="8" fill="#cfeacf" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="525" y="326" text-anchor="middle" font-size="12" fill="#204a1e" filter="url(#rough2)">{2} 或 {3}</text>

  <!-- 公式 -->
  <rect x="40" y="356" width="700" height="66" rx="9" fill="#eef1f7" stroke="#7a8ca6"
        stroke-width="1.3" filter="url(#rough2)"/>
  <text x="56" y="380" font-size="12" fill="#33445c" filter="url(#rough2)">k 条鱼时共有 C(k,2) = k(k-1)/2 对，等概率 → 每对的概率是 2 / (k(k-1))。</text>
  <text x="56" y="402" font-size="12" fill="#33445c" filter="url(#rough2)">于是 f[S 去掉 j] += f[S] · 2/(k(k-1)) · Σ_{i∈S, i≠j} a[i][j]（对每个 j ∈ S 各算一次）。</text>
</svg>
