<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="320" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">状态维护：集合"非空楼层" + 前缀和</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">up/down 用总数减去前缀和 O(log m)；下一个停靠层用有序集合 O(log m)</text>
  <text x="150" y="110" text-anchor="start" font-size="12.5" fill="#555555" filter="url(#rough2)">总人数 = 等待中 + 电梯内</text>
  <text x="150" y="146" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">p_up = 总数 − 前缀(当前层)</text>
  <text x="150" y="178" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">p_down = 前缀(当前层 − 1)</text>
  <text x="150" y="214" text-anchor="start" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">p_up ≥ p_down → 上行，否则下行</text>
  <text x="150" y="250" text-anchor="start" font-size="12.5" fill="#b05a5a" filter="url(#rough2)">若两者都为 0 → 空闲，跳到下一个到达时刻</text>
  <text x="440" y="300" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">每个事件 O(log m)，事件总数 O(n)</text>
</svg>
