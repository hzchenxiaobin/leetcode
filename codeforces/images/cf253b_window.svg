<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="340" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">固定最小值 lo，能保留的正是值域窗口 [lo, 2lo]</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">窗口内全部保留、窗口外全部删掉，对给定的 lo 这是最优的</text>
  <line x1="90" y1="200" x2="800" y2="200" stroke="#8899aa" stroke-width="1.2" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="130" y="176" width="44" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="152.0" y="203.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="130" y="176" width="44" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="152.0" y="203.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="212" y="176" width="44" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="234.0" y="203.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><rect x="294" y="176" width="44" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="316.0" y="203.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <g filter="url(#rough2)"><rect x="458" y="176" width="44" height="44" rx="4" fill="#eeeeee" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="480.0" y="203.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">7</text>
  <g filter="url(#rough2)"><rect x="540" y="176" width="44" height="44" rx="4" fill="#eeeeee" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="562.0" y="203.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">8</text>
  <path d="M104,246 L104,262 L434,262 L434,246" fill="none" stroke="#b05a5a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="269" y="284" text-anchor="middle" font-size="12.5" fill="#b05a5a" filter="url(#rough2)">lo=3 的窗口 [3,6]：留下 3,3,4,5 共 4 个</text>
  <text x="617" y="150" text-anchor="middle" font-size="12.5" fill="#b05a5a" filter="url(#rough2)">7 和 8 超出 2·lo</text>
  <text x="440" y="322" text-anchor="middle" font-size="13" fill="#3d6b2f" filter="url(#rough2)">扫描 lo = 1..5000，取窗口内计数的最大值 best，答案就是 n - best</text>
</svg>
