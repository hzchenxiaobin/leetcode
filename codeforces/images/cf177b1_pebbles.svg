<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="16"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="470" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2 走查：8 颗石子的最优取法</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <circle cx="80.0" cy="90.0" r="11.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="110.0" cy="90.0" r="11.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="140.0" cy="90.0" r="11.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="170.0" cy="90.0" r="11.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="80.0" cy="120.0" r="11.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="110.0" cy="120.0" r="11.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="140.0" cy="120.0" r="11.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="170.0" cy="120.0" r="11.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="220.0" y="106.0" text-anchor="start" font-size="13" fill="#446688" filter="url(#rough2)">8 颗：分成 2 行 × 4 颗</text>
  <text x="220.0" y="130.0" text-anchor="start" font-size="12.5" fill="#555" filter="url(#rough2)">取回一行 → 剩 4 颗</text>
  <line x1="200.0" y1="120.0" x2="230.0" y2="120.0" stroke="#446688" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <circle cx="80.0" cy="190.0" r="11.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="110.0" cy="190.0" r="11.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="80.0" cy="220.0" r="11.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="110.0" cy="220.0" r="11.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="220.0" y="206.0" text-anchor="start" font-size="13" fill="#4a7a3a" filter="url(#rough2)">4 颗：分成 2 行 × 2 颗</text>
  <text x="220.0" y="230.0" text-anchor="start" font-size="12.5" fill="#555" filter="url(#rough2)">取回一行 → 剩 2 颗</text>
  <circle cx="80.0" cy="290.0" r="11.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="80.0" cy="320.0" r="11.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="220.0" y="306.0" text-anchor="start" font-size="13" fill="#8a6015" filter="url(#rough2)">2 颗：只能分成 2 行 × 1 颗</text>
  <text x="220.0" y="330.0" text-anchor="start" font-size="12.5" fill="#555" filter="url(#rough2)">取回一行 → 剩 1 颗，结束</text>
  <circle cx="91.0" cy="390.0" r="11.0" fill="#eeeeee" stroke="#777777" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="220.0" y="396.0" text-anchor="start" font-size="13" fill="#555" filter="url(#rough2)">1 颗</text>
  <rect x="400.0" y="70.0" width="280.0" height="120.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="414.0" y="94.5" text-anchor="start" font-size="12.5" fill="#3f3420" filter="url(#rough2)">和 = 8 + 4 + 2 + 1 = 15</text>
  <text x="414.0" y="122.5" text-anchor="start" font-size="12.5" fill="#3f3420" filter="url(#rough2)">另一条链 8 → 2 → 1</text>
  <text x="414.0" y="150.5" text-anchor="start" font-size="12.5" fill="#3f3420" filter="url(#rough2)">和只有 8 + 2 + 1 = 11</text>
  <text x="400.0" y="226.0" text-anchor="start" font-size="12.5" fill="#444" filter="url(#rough2)">每步都取「最大的可选行数」</text>
</svg>
