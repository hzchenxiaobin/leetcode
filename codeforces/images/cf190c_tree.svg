<svg xmlns="http://www.w3.org/2000/svg" width="780" height="380" viewBox="0 0 780 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="780" height="380" fill="#fafafa"/>
  <text x="390.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">190C：唯一的括号结构 —— pair&lt;type,type&gt; 递归展开</text>
  <path d="M 149.81000000000012 46 Q 390.0 52 630.1899999999998 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="320.0" y="50.0" width="140.0" height="36.0" rx="6" fill="#fff3d6" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="390.0" y="73.0" text-anchor="middle" font-size="11.6" font-weight="bold" fill="#8a6015" filter="url(#rough2)">pair</text>
  <rect x="120.0" y="130.0" width="140.0" height="36.0" rx="6" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="190.0" y="153.0" text-anchor="middle" font-size="11.4" font-weight="bold" fill="#33506e" filter="url(#rough2)">pair</text>
  <rect x="500.0" y="130.0" width="140.0" height="36.0" rx="6" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="570.0" y="153.0" text-anchor="middle" font-size="11.4" font-weight="bold" fill="#2f5b34" filter="url(#rough2)">int</text>
  <rect x="40.0" y="210.0" width="100.0" height="34.0" rx="6" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="90.0" y="232.0" text-anchor="middle" font-size="11.0" fill="#33506e" filter="url(#rough2)">int</text>
  <rect x="200.0" y="210.0" width="100.0" height="34.0" rx="6" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="250.0" y="232.0" text-anchor="middle" font-size="11.0" fill="#33506e" filter="url(#rough2)">int</text>
  <path d="M 370.0 87.0 L 220.0 128.0" stroke="#446688" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 410.0 87.0 L 560.0 128.0" stroke="#446688" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 180.0 167.0 L 110.0 208.0" stroke="#446688" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 210.0 167.0 L 240.0 208.0" stroke="#446688" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="660.0" y="120.0" text-anchor="start" font-size="11.2" font-weight="bold" fill="#b85450" filter="url(#rough2)">词法流：</text>
  <text x="660.0" y="144.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">pair pair int int int</text>
  <text x="660.0" y="172.0" text-anchor="start" font-size="10.8" fill="#b85450" filter="url(#rough2)">↓ 递归下降</text>
  <text x="660.0" y="196.0" text-anchor="start" font-size="10.4" fill="#2b2b2b" filter="url(#rough2)">pair&lt;pair&lt;int,int&gt;,int&gt;</text>
  <rect x="60.0" y="280.0" width="660.0" height="60.0" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="304.0" text-anchor="start" font-size="11.1" fill="#8a6015" filter="url(#rough2)">规则：遇到 int 就返回；遇到 pair 就要“吃掉”两个完整的类型。词用完了还想要类型 ⇒ Error。</text>
  <text x="74.0" y="326.0" text-anchor="start" font-size="11.1" fill="#8a6015" filter="url(#rough2)">全部词读完却还有剩余 ⇒ Error（样例 2：pair int 只够一个左孩子，右孩子缺）。</text>
</svg>
