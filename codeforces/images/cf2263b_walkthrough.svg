<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>

  <g filter="url(#rough2)">
    <text x="320" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">演算：n = 5, k = 7 ⇒ x = 2n − k = 3</text>
    <text x="320" y="48" text-anchor="middle" font-size="10.5" fill="#888">橙 = 行列都最小；绿 = 仅行最小；蓝 = 仅列最小；灰 = 都不是</text>
  </g>

  <g filter="url(#rough2)" font-size="15" text-anchor="middle">
    <rect x="40" y="96" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <text x="62" y="124" fill="#8a6a20">1</text>
    <rect x="84" y="96" width="44" height="44" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4"/>
    <text x="106" y="124" fill="#999">8</text>
    <rect x="128" y="96" width="44" height="44" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4"/>
    <text x="150" y="124" fill="#999">9</text>
    <rect x="172" y="96" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4"/>
    <text x="194" y="124" fill="#3a4a66">6</text>
    <rect x="216" y="96" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4"/>
    <text x="238" y="124" fill="#3a4a66">7</text>

    <rect x="40" y="140" width="44" height="44" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4"/>
    <text x="62" y="168" fill="#999">10</text>
    <rect x="84" y="140" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <text x="106" y="168" fill="#8a6a20">2</text>
    <rect x="128" y="140" width="44" height="44" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4"/>
    <text x="150" y="168" fill="#999">11</text>
    <rect x="172" y="140" width="44" height="44" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4"/>
    <text x="194" y="168" fill="#999">12</text>
    <rect x="216" y="140" width="44" height="44" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4"/>
    <text x="238" y="168" fill="#999">13</text>

    <rect x="40" y="184" width="44" height="44" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4"/>
    <text x="62" y="212" fill="#999">14</text>
    <rect x="84" y="184" width="44" height="44" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4"/>
    <text x="106" y="212" fill="#999">15</text>
    <rect x="128" y="184" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <text x="150" y="212" fill="#8a6a20">3</text>
    <rect x="172" y="184" width="44" height="44" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4"/>
    <text x="194" y="212" fill="#999">16</text>
    <rect x="216" y="184" width="44" height="44" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4"/>
    <text x="238" y="212" fill="#999">17</text>

    <rect x="40" y="228" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <text x="62" y="256" fill="#3a5a30">4</text>
    <rect x="84" y="228" width="44" height="44" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4"/>
    <text x="106" y="256" fill="#999">18</text>
    <rect x="128" y="228" width="44" height="44" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4"/>
    <text x="150" y="256" fill="#999">19</text>
    <rect x="172" y="228" width="44" height="44" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4"/>
    <text x="194" y="256" fill="#999">20</text>
    <rect x="216" y="228" width="44" height="44" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4"/>
    <text x="238" y="256" fill="#999">21</text>

    <rect x="40" y="272" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <text x="62" y="300" fill="#3a5a30">5</text>
    <rect x="84" y="272" width="44" height="44" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4"/>
    <text x="106" y="300" fill="#999">22</text>
    <rect x="128" y="272" width="44" height="44" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4"/>
    <text x="150" y="300" fill="#999">23</text>
    <rect x="172" y="272" width="44" height="44" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4"/>
    <text x="194" y="300" fill="#999">24</text>
    <rect x="216" y="272" width="44" height="44" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4"/>
    <text x="238" y="300" fill="#999">25</text>
  </g>

  <g filter="url(#rough2)" font-size="11">
    <text x="286" y="106" fill="#3a5a30" font-weight="bold">行最小（5 个）</text>
    <text x="286" y="124" fill="#555">1, 2, 3, 4, 5</text>
    <text x="286" y="152" fill="#3a4a66" font-weight="bold">列最小（5 个）</text>
    <text x="286" y="170" fill="#555">1, 2, 3, 6, 7</text>
    <text x="286" y="198" fill="#8a3a36" font-weight="bold">f(A) = 并集</text>
    <text x="286" y="216" fill="#555">{1,2,3,4,5} ∪ {1,2,3,6,7}</text>
    <text x="286" y="234" fill="#555">= {1, 2, 3, 4, 5, 6, 7}</text>
    <text x="286" y="262" fill="#8a3a36">|f(A)| = 7 = k ✓</text>
  </g>

  <rect x="40" y="332" width="560" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="56" y="352" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">认领步：1↔行0+列0，2↔行1+列1，3↔行2+列2，4↔行3，5↔行4，6↔列3，7↔列4</text>

  <g filter="url(#rough2)" font-size="10.5">
    <text x="40" y="382" fill="#555">共 2n = 10 次认领挤在 7 步里：x = 3 步双重（6 次）+ 4 步单次（4 次）= 10 ✓，步数 3 + 4 = 7 = k ✓</text>
    <text x="40" y="404" fill="#888">每行最小值互不相同（1..5），每列最小值也互不相同（1,2,3,6,7），且值 1 同时出现在两侧</text>
  </g>
</svg>
