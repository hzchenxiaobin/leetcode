<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="367"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arre" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 z" fill="#8a6015"/>
    </marker>
  </defs>

  <rect width="760" height="340" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">E：事件驱动——每次直接跳到“下一次碰撞”</text>
  <path d="M 130 40 Q 380 45 630 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <line x1="60" y1="200" x2="700" y2="200" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="60" y="222" font-size="9.5" fill="#777" filter="url(#rough2)">位置轴</text>

  <!-- t=0 -->
  <circle cx="140" cy="200" r="9" fill="#446688" filter="url(#rough2)"/>
  <circle cx="300" cy="200" r="9" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="470" cy="200" r="9" fill="#b85450" filter="url(#rough2)"/>
  <text x="140" y="180" text-anchor="middle" font-size="10" fill="#2f4a66" filter="url(#rough2)">x1</text>
  <text x="300" y="180" text-anchor="middle" font-size="10" fill="#2f5223" filter="url(#rough2)">x2</text>
  <text x="470" y="180" text-anchor="middle" font-size="10" fill="#8c3a36" filter="url(#rough2)">x3</text>
  <line x1="140" y1="236" x2="196" y2="236" stroke="#8a6015" stroke-width="1.6" marker-end="url(#arre)" filter="url(#rough2)"/>
  <text x="168" y="256" text-anchor="middle" font-size="9.5" fill="#8a6015" filter="url(#rough2)">v1</text>

  <!-- 时间轴 -->
  <line x1="120" y1="96" x2="640" y2="96" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="120" cy="96" r="4" fill="#446688" filter="url(#rough2)"/>
  <circle cx="330" cy="96" r="4" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="540" cy="96" r="4" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="120" y="82" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">0</text>
  <text x="330" y="82" text-anchor="middle" font-size="9.5" fill="#8c3a36" filter="url(#rough2)">t1</text>
  <text x="540" y="82" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">t2</text>
  <text x="650" y="100" font-size="9.5" fill="#555" filter="url(#rough2)">时间</text>

  <rect x="60" y="266" width="300" height="62" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="72" y="288" font-size="10" fill="#2f4a66" filter="url(#rough2)">相邻两球可能相撞的条件：</text>
  <text x="72" y="310" font-size="11" fill="#2f4a66" font-family="'Courier New',monospace" filter="url(#rough2)">v[i] &gt; v[i+1] 时 dt = (x[i+1]-x[i])/(v[i]-v[i+1])</text>

  <rect x="392" y="266" width="328" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="404" y="288" font-size="10" fill="#8a6015" filter="url(#rough2)">取所有相邻对里最小的 dt，一起推进；</text>
  <text x="404" y="310" font-size="10" fill="#8a6015" filter="url(#rough2)">若 cur + dt &gt; t 就停止，最后再平移到 t。</text>

  <text x="60" y="146" font-size="10.5" fill="#555" filter="url(#rough2)">关键：小球不能互相穿过 ⇒ 相对顺序永远不变 ⇒ 只有“当前相邻”的两球可能相撞。</text>
  <text x="60" y="164" font-size="10.5" fill="#555" filter="url(#rough2)">⇒ 每次只需检查 n−1 对，n ≤ 10，总事件数在数据范围内只有几十次。</text>
</svg>
