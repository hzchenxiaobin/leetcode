<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="233"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="340" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">C：排序后扫一遍，先找出一对冲突</text>
  <path d="M 150 42 Q 380 47 610 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="380" y="60" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">区间 [l, r]，端点相等（r1 = l2）不算重叠</text>

  <line x1="60" y1="150" x2="700" y2="150" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="60" y="172" font-size="10" fill="#777" filter="url(#rough2)">1</text>
  <text x="700" y="172" font-size="10" fill="#777" filter="url(#rough2)">10</text>

  <rect x="76" y="96" width="96" height="16" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="124" y="90" text-anchor="middle" font-size="9.5" fill="#2f5223" filter="url(#rough2)">[1,3]</text>
  <rect x="76" y="118" width="196" height="16" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="174" y="112" text-anchor="middle" font-size="9.5" fill="#2f4a66" filter="url(#rough2)">[1,5]</text>
  <rect x="256" y="140" width="120" height="14" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="316" y="134" text-anchor="middle" font-size="9.5" fill="#8a6015" filter="url(#rough2)">[3,7]</text>

  <line x1="76" y1="176" x2="272" y2="176" stroke="#b85450" stroke-width="2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="174" y="194" text-anchor="middle" font-size="10" fill="#8c3a36" filter="url(#rough2)">扫描到 [1,5] 时，最大右端点 3 &gt; 新的左端点 1 → 冲突！</text>

  <rect x="360" y="96" width="340" height="96" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="372" y="120" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">扫描规则</text>
  <text x="372" y="144" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">按左端点排序，维护「已见区间的最大右端点 R」</text>
  <text x="372" y="166" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">若新区间左端点 &lt; R → 它与某个已见区间相交</text>
  <text x="372" y="184" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">（R 来自某个左端点 ≤ 它的区间）</text>

  <rect x="40" y="212" width="300" height="106" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="236" font-size="11.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">没有冲突</text>
  <text x="52" y="260" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">本来就不重叠 ⇒ 取消任意一个都行</text>
  <text x="52" y="282" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">答案 = 1..n 全部编号</text>
  <text x="52" y="304" font-size="10" fill="#777" filter="url(#rough2)">（样例 1 就是这种情形）</text>

  <rect x="360" y="212" width="360" height="106" rx="10" fill="#fdeceb" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="372" y="236" font-size="11.5" font-weight="bold" fill="#8c3a36" filter="url(#rough2)">找到了冲突 (a,b)</text>
  <text x="372" y="260" font-size="10.5" fill="#8c3a36" filter="url(#rough2)">任何只删一个的方案，都必须删掉 a 或 b</text>
  <text x="372" y="282" font-size="10.5" fill="#8c3a36" filter="url(#rough2)">⇒ 候选只有 2 个，逐个验证即可</text>
  <text x="372" y="304" font-size="10" fill="#777" filter="url(#rough2)">验证：删掉后按左端点扫一遍，看还有没有冲突</text>

  <line x1="340" y1="265" x2="356" y2="265" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
</svg>
