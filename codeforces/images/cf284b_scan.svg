<svg xmlns="http://www.w3.org/2000/svg" width="700" height="340" viewBox="0 0 700 340"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="143"/>
    <feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></defs>
  <rect width="700" height="340" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">一次线性扫描：只数 A 和 I 的个数</text>
  <path d="M 130 40 Q 350 46 570 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="60" width="580" height="50" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="90" font-size="13" fill="#22314a" filter="url(#rough2)">读 n 与字符串 s；cntA=0, cntI=0；扫一遍：遇 A 加 cntA，遇 I 加 cntI，遇 F 跳过。</text>
  <g filter="url(#rough2)"><rect x="60" y="122" width="580" height="50" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="76" y="152" font-size="13" fill="#8a6015" filter="url(#rough2)">输出：cntI==0 ? cntA : (cntI==1 ? 1 : 0)。</text>
  <g filter="url(#rough2)"><rect x="60" y="184" width="580" height="70" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="208" font-size="12.5" fill="#2f5223" filter="url(#rough2)">复杂度 O(n)，n ≤ 2·10⁵，实测 &lt;1 ms。</text>
  <text x="76" y="232" font-size="12.5" fill="#2f5223" filter="url(#rough2)">注意 cntI==0 时答案不是 "所有非 F 的人"，因为 I 不存在，等于 cntA。</text>
  <g filter="url(#rough2)"><rect x="60" y="266" width="580" height="56" rx="8" fill="#fbeeee" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="76" y="290" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">易错：把"自己"也算进"其他人"里 ⇒ cntI==1 时误判为 0。</text>
</svg>
