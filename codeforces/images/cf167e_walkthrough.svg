<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="760" height="440" fill="#fafafa"/>

  <text x="44" y="70" font-size="11.5" text-anchor="start" fill="#35507a" font-weight="bold" filter="url(#rough2)">样例</text>
  <text x="132" y="70" font-size="11.5" text-anchor="start" fill="#35507a" font-weight="bold" filter="url(#rough2)">边</text>
  <text x="300" y="70" font-size="11.5" text-anchor="start" fill="#35507a" font-weight="bold" filter="url(#rough2)">源 / 汇</text>
  <text x="470" y="70" font-size="11.5" text-anchor="start" fill="#35507a" font-weight="bold" filter="url(#rough2)">矩阵 M</text>
  <text x="570" y="70" font-size="11.5" text-anchor="start" fill="#35507a" font-weight="bold" filter="url(#rough2)">行列式</text>
  <text x="668" y="70" font-size="11.5" text-anchor="start" fill="#35507a" font-weight="bold" filter="url(#rough2)">输出</text>
  <line x1="34" y1="79" x2="726" y2="79" stroke="#555" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="30" y="82" width="700" height="84" rx="6" fill="#ffffff" stroke="#c9d6e4" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="44" y="106" font-size="11.5" text-anchor="start" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">样例 1</text>
  <text x="132" y="100" font-size="10" text-anchor="start" fill="#555" filter="url(#rough2)">1→3, 2→4</text>
  <text x="300" y="106" font-size="10" text-anchor="start" fill="#555" filter="url(#rough2)">源 (1,2) 汇 (3,4)</text>
  <text x="470" y="106" font-size="12" text-anchor="start" fill="#35507a" filter="url(#rough2)">[1 0; 0 1]</text>
  <text x="570" y="106" font-size="11.5" text-anchor="start" fill="#7a2f2f" filter="url(#rough2)">det = 1</text>
  <text x="668" y="106" font-size="12.5" text-anchor="start" fill="#2f5223" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="30" y="176" width="700" height="84" rx="6" fill="#ffffff" stroke="#c9d6e4" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="44" y="200" font-size="11.5" text-anchor="start" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">样例 2</text>
  <text x="132" y="194" font-size="10" text-anchor="start" fill="#555" filter="url(#rough2)">4→1, 3→2</text>
  <text x="300" y="200" font-size="10" text-anchor="start" fill="#555" filter="url(#rough2)">源 (3,4) 汇 (1,2)</text>
  <text x="470" y="200" font-size="12" text-anchor="start" fill="#35507a" filter="url(#rough2)">[0 1; 1 0]</text>
  <text x="570" y="200" font-size="11.5" text-anchor="start" fill="#7a2f2f" filter="url(#rough2)">det = −1</text>
  <text x="668" y="200" font-size="12.5" text-anchor="start" fill="#2f5223" font-weight="bold" filter="url(#rough2)">1000002</text>
  <rect x="30" y="270" width="700" height="84" rx="6" fill="#ffffff" stroke="#c9d6e4" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="44" y="294" font-size="11.5" text-anchor="start" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">样例 3</text>
  <text x="132" y="288" font-size="10" text-anchor="start" fill="#555" filter="url(#rough2)">2→1, 2→4, 3→1, 3→4</text>
  <text x="300" y="294" font-size="10" text-anchor="start" fill="#555" filter="url(#rough2)">源 (2,3) 汇 (1,4)</text>
  <text x="470" y="294" font-size="12" text-anchor="start" fill="#35507a" filter="url(#rough2)">[1 1; 1 1]</text>
  <text x="570" y="294" font-size="11.5" text-anchor="start" fill="#7a2f2f" filter="url(#rough2)">det = 0</text>
  <text x="668" y="294" font-size="12.5" text-anchor="start" fill="#2f5223" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="30" y="386" font-size="11.5" text-anchor="start" fill="#2b2b2b" filter="url(#rough2)">注意样例 2：det = −1，取模后要输出非负剩余 1000002（p = 1000003）。</text>
  <text x="30" y="410" font-size="11.5" text-anchor="start" fill="#555" filter="url(#rough2)">样例 4、5 的矩阵也都能手算：前者有两行相同（det = 0），后者 det = 1。</text>
  <text x="380.0" y="36" font-size="20" text-anchor="middle" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">样例 1–3：把矩阵写出来，算行列式再取模</text>
  <path d="M 120 46 Q 380.0 52 640 46" fill="none" stroke="#2b2b2b" stroke-width="1.3" filter="url(#rough2)"/>
</svg>
