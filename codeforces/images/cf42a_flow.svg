<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="251"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="300" fill="#fafafa"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">一次线性扫描：求和、求最小比值、取 min</text>
  <path d="M 140 40 Q 400 46 660 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="80" y="110" width="140" height="70" rx="10" fill="#eef4fb" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="152" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">读入 n, V, a, b</text>
  <path d="M 224 145 L 246 145" stroke="#446688" stroke-width="1.5" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <rect x="250" y="110" width="140" height="70" rx="10" fill="#eef4fb" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="152" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">S = Σ a_i</text>
  <path d="M 394 145 L 416 145" stroke="#446688" stroke-width="1.5" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <rect x="420" y="110" width="140" height="70" rx="10" fill="#eef4fb" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490" y="152" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">r = min b_i/a_i</text>
  <path d="M 564 145 L 586 145" stroke="#446688" stroke-width="1.5" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <rect x="590" y="110" width="140" height="70" rx="10" fill="#eef4fb" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="660" y="152" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">输出 min(V, S·r)</text>
  <text x="80" y="240" font-size="12" fill="#2b2b2b" filter="url(#rough2)">复杂度 O(n)；n ≤ 20、V ≤ 10^4，单次运行远小于 1 ms。</text>
  <text x="80" y="272" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">注意 C++ 中 b[i]/a[i] 必须先转 double，否则整数除法会截断。</text>

</svg>
