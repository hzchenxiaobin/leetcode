<svg xmlns="http://www.w3.org/2000/svg" width="840" height="320" viewBox="0 0 840 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="320" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">完美置换 = 无不动点的对合 = 两两配对</text>
  <text x="420" y="56" text-anchor="middle" font-size="11.8" fill="#666666" filter="url(#rough2)">p_{p_i}=i ⇒ 轮换长度 ≤ 2；p_i≠i ⇒ 没有长度 1 的轮换</text>
  <g filter="url(#rough2)"><circle cx="170" cy="120" r="26" fill="#d6e6f2" fill-opacity="0.9" stroke="#446688" stroke-width="1.6"/></g>
  <text x="170" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><circle cx="250" cy="120" r="26" fill="#d7ecd0" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="250" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><line x1="196" y1="120" x2="224" y2="120" stroke="#888888" stroke-width="1.6" marker-end="url(#arrb)"/></g>
  <g filter="url(#rough2)"><line x1="224" y1="132" x2="196" y2="132" stroke="#888888" stroke-width="1.6" marker-end="url(#arrb)"/></g>
  <g filter="url(#rough2)"><circle cx="370" cy="120" r="26" fill="#d6e6f2" fill-opacity="0.9" stroke="#446688" stroke-width="1.6"/></g>
  <text x="370" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><circle cx="450" cy="120" r="26" fill="#d7ecd0" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="450" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><line x1="396" y1="120" x2="424" y2="120" stroke="#888888" stroke-width="1.6" marker-end="url(#arrb)"/></g>
  <g filter="url(#rough2)"><line x1="424" y1="132" x2="396" y2="132" stroke="#888888" stroke-width="1.6" marker-end="url(#arrb)"/></g>
  <g filter="url(#rough2)"><circle cx="570" cy="120" r="26" fill="#d6e6f2" fill-opacity="0.9" stroke="#446688" stroke-width="1.6"/></g>
  <text x="570" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <g filter="url(#rough2)"><circle cx="650" cy="120" r="26" fill="#d7ecd0" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="650" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">6</text>
  <g filter="url(#rough2)"><line x1="596" y1="120" x2="624" y2="120" stroke="#888888" stroke-width="1.6" marker-end="url(#arrb)"/></g>
  <g filter="url(#rough2)"><line x1="624" y1="132" x2="596" y2="132" stroke="#888888" stroke-width="1.6" marker-end="url(#arrb)"/></g>
  <text x="420" y="210" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">每组 (2k−1, 2k) 互换：p_{2k−1}=2k，p_{2k}=2k−1</text>
  <g filter="url(#rough2)"><rect x="220" y="240" width="400" height="40" rx="4" fill="#f7fbf4" fill-opacity="0.85" stroke="#a8c99a" stroke-width="1.3"/></g>
  <text x="420" y="266" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3d6b2f" filter="url(#rough2)">n 偶数：输出 2 1 4 3 … n n−1</text>
  <text x="420" y="300" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">n=2 ⇒ 2 1；n=4 ⇒ 2 1 4 3（与样例一致）</text>
</svg>
