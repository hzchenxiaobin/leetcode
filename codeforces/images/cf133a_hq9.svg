<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="211"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="340" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">HQ9+ 的四条指令：只有三条会输出</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">'+' 只修改累加器；其余字符一律忽略（H、Q 区分大小写）</text>
  <g filter="url(#rough2)"><rect x="90" y="96" width="110" height="38" rx="5" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="145" y="122" text-anchor="middle" font-size="17" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">H</text>
  <text x="230" y="122" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">执行：Hello, World!</text>
  <g filter="url(#rough2)"><rect x="660" y="96" width="150" height="38" rx="5" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="735" y="121" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">有输出</text>
  <g filter="url(#rough2)"><rect x="90" y="148" width="110" height="38" rx="5" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="145" y="174" text-anchor="middle" font-size="17" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">Q</text>
  <text x="230" y="174" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">执行：程序自身的源代码</text>
  <g filter="url(#rough2)"><rect x="660" y="148" width="150" height="38" rx="5" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="735" y="173" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">有输出</text>
  <g filter="url(#rough2)"><rect x="90" y="200" width="110" height="38" rx="5" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="145" y="226" text-anchor="middle" font-size="17" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="230" y="226" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">执行：99 Bottles of Beer 的歌词</text>
  <g filter="url(#rough2)"><rect x="660" y="200" width="150" height="38" rx="5" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="735" y="225" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">有输出</text>
  <g filter="url(#rough2)"><rect x="90" y="252" width="110" height="38" rx="5" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="145" y="278" text-anchor="middle" font-size="17" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">+</text>
  <text x="230" y="278" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">执行：累加器 +1</text>
  <g filter="url(#rough2)"><rect x="660" y="252" width="150" height="38" rx="5" fill="#f3d9d6" fill-opacity="0.85" stroke="#8a2b28" stroke-width="1.4"/></g>
  <text x="735" y="277" text-anchor="middle" font-size="12" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">无输出</text>
  <text x="450" y="316" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">所以：程序里出现 H、Q、9 中任意一个 ⇒ YES，否则 NO</text>
</svg>
