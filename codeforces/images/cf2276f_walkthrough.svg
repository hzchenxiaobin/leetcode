<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 400" width="740" height="400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
  </defs>
  <rect width="740" height="400" fill="#fafafa"/>

  <text x="370" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">官方样例走查：把排列拆成环，套判定</text>
  <text x="370" y="48" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#rough2)">E = Σ(c−1)（非自环），m = 非自环个数，b = 长度恰为 k+1 的环个数，f = 自环个数</text>

  <rect x="30" y="62" width="680" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="72" y="82" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33517a" filter="url(#rough2)">(n, k)</text>
  <text x="170" y="82" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33517a" filter="url(#rough2)">环长分解</text>
  <text x="420" y="82" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33517a" filter="url(#rough2)">关键判定</text>
  <text x="654" y="82" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33517a" filter="url(#rough2)">胜者</text>

  <!-- rows -->
  <rect x="30" y="96" width="680" height="32" fill="#ffffff" stroke="#ddd" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="72" y="117" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">(2, 1)</text>
  <text x="170" y="117" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">1 + 1</text>
  <text x="420" y="117" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">没有 2-环 → k=1 规则直接给 Alice</text>
  <text x="654" y="117" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3a5a30" filter="url(#rough2)">Alice</text>

  <rect x="30" y="128" width="680" height="32" fill="#fafafa" stroke="#ddd" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="72" y="149" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">(2, 1)</text>
  <text x="170" y="149" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">2</text>
  <text x="420" y="149" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">有 2-环且 f = 0 为偶 → Bob 反色</text>
  <text x="654" y="149" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8d3a35" filter="url(#rough2)">Bob</text>

  <rect x="30" y="160" width="680" height="32" fill="#ffffff" stroke="#ddd" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="72" y="181" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">(3, 2)</text>
  <text x="170" y="181" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">3</text>
  <text x="420" y="181" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">b=1，S_m=0，f=0 → r=0 且 S_m=0 → Bob</text>
  <text x="654" y="181" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8d3a35" filter="url(#rough2)">Bob</text>

  <rect x="30" y="192" width="680" height="32" fill="#fafafa" stroke="#ddd" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="72" y="213" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">(4, 2)</text>
  <text x="170" y="213" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">1 + 3</text>
  <text x="420" y="213" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">b=1，f=1 → r=1 ≤ k−S_m=2 → Alice</text>
  <text x="654" y="213" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3a5a30" filter="url(#rough2)">Alice</text>

  <rect x="30" y="224" width="680" height="32" fill="#ffffff" stroke="#ddd" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="72" y="245" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">(8, 3)</text>
  <text x="170" y="245" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">2 + 3 + 3</text>
  <text x="420" y="245" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">坏（2+2+1=5&gt;3），但 A=6 删不全；删一个 3-环：c−j=2 ≥ E−k=2</text>
  <text x="654" y="245" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3a5a30" filter="url(#rough2)">Alice</text>

  <rect x="30" y="256" width="680" height="32" fill="#fafafa" stroke="#ddd" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="72" y="277" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">(10, 3)</text>
  <text x="170" y="277" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">2 + 2 + 3 + 3</text>
  <text x="420" y="277" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">坏，E−k=3；删 1 环最多 c−j=2，删 2 环总长 ≥4&gt;3 → Bob</text>
  <text x="654" y="277" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8d3a35" filter="url(#rough2)">Bob</text>

  <rect x="30" y="288" width="680" height="32" fill="#ffffff" stroke="#ddd" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="72" y="309" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">(6, 2)</text>
  <text x="170" y="309" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">1 + 1 + 1 + 3</text>
  <text x="420" y="309" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">b=1，f=3，r = f mod 3 = 0 → S_m=0 且 r=0 → Bob</text>
  <text x="654" y="309" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8d3a35" filter="url(#rough2)">Bob</text>

  <rect x="30" y="320" width="680" height="32" fill="#fafafa" stroke="#ddd" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="72" y="341" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">(8, 1)</text>
  <text x="170" y="341" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">1 + 1 + 2 + 2 + 2</text>
  <text x="420" y="341" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">有 2-环且 f=2 为偶 → Bob（对比 (7,1)：f=1 奇 → Alice）</text>
  <text x="654" y="341" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8d3a35" filter="url(#rough2)">Bob</text>

  <text x="370" y="378" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">结论只依赖环长多重集，与环上具体元素顺序无关</text>
</svg>
