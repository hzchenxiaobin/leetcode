<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="113"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="aax" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">总长 L 落在 [k·a, k·b] 内才可能分成 k 行</text>
  <path d="M 130 42 Q 360 48 590 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 数轴 -->
  <g filter="url(#rough2)">
    <rect x="300" y="140" width="220" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <line x1="80" y1="157" x2="660" y2="157" stroke="#446688" stroke-width="1.8" marker-end="url(#aax)"/>
    <line x1="300" y1="132" x2="300" y2="182" stroke="#2f5223" stroke-width="2"/>
    <line x1="520" y1="132" x2="520" y2="182" stroke="#2f5223" stroke-width="2"/>
    <text x="300" y="128" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5223">k·a</text>
    <text x="520" y="128" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5223">k·b</text>
    <text x="410" y="162" text-anchor="middle" font-size="12" fill="#2f5223">可行区间</text>
    <text x="86" y="176" font-size="11" fill="#666">0</text>

    <!-- 小于 ka -->
    <line x1="180" y1="186" x2="180" y2="206" stroke="#b85450" stroke-width="1.6"/>
    <circle cx="180" cy="186" r="4.5" fill="#b85450"/>
    <text x="180" y="222" text-anchor="middle" font-size="11.5" fill="#8f3a34">L &lt; k·a</text>

    <!-- 区间内 -->
    <line x1="410" y1="186" x2="410" y2="206" stroke="#2f5223" stroke-width="1.6"/>
    <circle cx="410" cy="186" r="4.5" fill="#4a7a3a"/>
    <text x="410" y="222" text-anchor="middle" font-size="11.5" fill="#2f5223">k·a ≤ L ≤ k·b</text>

    <!-- 大于 kb -->
    <line x1="590" y1="186" x2="590" y2="206" stroke="#b85450" stroke-width="1.6"/>
    <circle cx="590" cy="186" r="4.5" fill="#b85450"/>
    <text x="590" y="222" text-anchor="middle" font-size="11.5" fill="#8f3a34">L &gt; k·b</text>
  </g>

  <!-- 三种结论卡片 -->
  <g filter="url(#rough2)">
    <rect x="46" y="244" width="196" height="104" rx="10" fill="#fdecea" stroke="#b85450" stroke-width="1.6"/>
    <text x="60" y="270" font-size="12" font-weight="bold" fill="#8f3a34">L &lt; k·a</text>
    <text x="60" y="292" font-size="11" fill="#7a3a34">k 行每行至少 a 个，</text>
    <text x="60" y="310" font-size="11" fill="#7a3a34">总长至少 k·a，不够分。</text>
    <text x="60" y="334" font-size="12" font-weight="bold" fill="#8f3a34">→ No solution</text>

    <rect x="262" y="244" width="196" height="104" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="276" y="270" font-size="12" font-weight="bold" fill="#2f5223">k·a ≤ L ≤ k·b</text>
    <text x="276" y="292" font-size="11" fill="#3c5e2e">区间内每个整数都能取到：</text>
    <text x="276" y="310" font-size="11" fill="#3c5e2e">从全 a 出发逐个 +1 即可。</text>
    <text x="276" y="334" font-size="12" font-weight="bold" fill="#2f5223">→ 一定有解</text>

    <rect x="478" y="244" width="196" height="104" rx="10" fill="#fdecea" stroke="#b85450" stroke-width="1.6"/>
    <text x="492" y="270" font-size="12" font-weight="bold" fill="#8f3a34">L &gt; k·b</text>
    <text x="492" y="292" font-size="11" fill="#7a3a34">k 行每行至多 b 个，</text>
    <text x="492" y="310" font-size="11" fill="#7a3a34">总长最多 k·b，装不下。</text>
    <text x="492" y="334" font-size="12" font-weight="bold" fill="#8f3a34">→ No solution</text>
  </g>

  <text x="360" y="378" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">样例 1：k=3，a=2，b=5，L=11，落在 [6,15] 内 → 有解；样例 2：k=4，a=1，b=2，L=11 &gt; 8 → No solution</text>
</svg>
