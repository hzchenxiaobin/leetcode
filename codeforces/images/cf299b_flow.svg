<svg xmlns="http://www.w3.org/2000/svg" width="700" height="240" viewBox="0 0 700 240"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="733"/>
    <feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></defs>
  <rect width="700" height="240" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">为什么不需要 BFS</text>
  <path d="M 200 40 Q 350 46 500 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="60" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="12.5" fill="#22314a" filter="url(#rough2)">只要有可落脚的点，能跳的空格数是"连续"的：跳得越远越不亏。</text>
  <text x="76" y="104" font-size="12.5" fill="#22314a" filter="url(#rough2)">所以唯一的不可能来自"某段石头太长、任何一步都跨不过"。</text>
  <g filter="url(#rough2)"><rect x="60" y="126" width="580" height="60" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="150" font-size="12.5" fill="#2f5223" filter="url(#rough2)">实现：一次扫描维护当前连续 '#' 长度 run，一旦 run ≥ k 就输出 NO。</text>
  <text x="76" y="172" font-size="12.5" fill="#2f5223" filter="url(#rough2)">扫完没问题输出 YES。O(n) 时间、O(1) 额外空间。</text>
  <g filter="url(#rough2)"><rect x="60" y="194" width="580" height="32" rx="6" fill="#fbeeee" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="76" y="215" font-size="12" fill="#8a3a36" filter="url(#rough2)">实测 n=3·10⁵ 全 '.'：&lt;1 ms。</text>
</svg>
