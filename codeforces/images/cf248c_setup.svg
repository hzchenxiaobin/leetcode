<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="101"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="a15" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="a16" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="440" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">把球心关于「弹跳线 y = y_w − r」镜像，折线就变成一条直线</text>
  <path d="M 60 40 Q 360 46 660 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 场地 -->
  <g filter="url(#rough2)">
    <rect x="80" y="80" width="560" height="290" fill="#ffffff" stroke="#333" stroke-width="1.8"/>
  </g>
  <!-- 球心弹跳线 -->
  <line x1="80" y1="102" x2="640" y2="102" stroke="#999" stroke-width="1.2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="470" y="96" font-size="11" fill="#777" filter="url(#rough2)">球心弹跳线 y = y_w − r</text>
  <text x="648" y="104" font-size="12" fill="#333" filter="url(#rough2)">y_w</text>

  <!-- 门与门柱 -->
  <g filter="url(#rough2)">
    <line x1="80" y1="230" x2="80" y2="300" stroke="#4a7a3a" stroke-width="6"/>
  </g>
  <g filter="url(#rough2)">
    <circle cx="80" cy="230" r="4" fill="#4a7a3a"/>
    <circle cx="80" cy="300" r="4" fill="#4a7a3a"/>
  </g>
  <text x="96" y="224" font-size="11.5" fill="#2f5223" filter="url(#rough2)">(0, y₂)</text>
  <text x="96" y="316" font-size="11.5" fill="#2f5223" filter="url(#rough2)">(0, y₁)</text>
  <text x="60" y="270" font-size="11" fill="#2f5223" text-anchor="end" filter="url(#rough2)">球门</text>

  <!-- 球 -->
  <g filter="url(#rough2)">
    <circle cx="470" cy="330" r="14" fill="#dfeafc" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="470" y="358" text-anchor="middle" font-size="11" fill="#22314a" filter="url(#rough2)">球 (x_b, y_b)，半径 r</text>

  <!-- 折线路径 -->
  <g stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)">
    <path d="M 470 316 L 300 102" marker-end="url(#a15)"/>
    <path d="M 300 102 L 80 262" marker-end="url(#a15)"/>
  </g>
  <text x="316" y="94" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">弹跳点 (x_w, y_w)</text>

  <!-- 镜像 -->
  <g stroke="#446688" stroke-width="1.6" stroke-dasharray="5 4" fill="none" filter="url(#rough2)">
    <path d="M 470 344 L 300 102 L 80 262" opacity="0.0"/>
  </g>
  <g filter="url(#rough2)">
    <circle cx="470" cy="188" r="12" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="492" y="192" font-size="11" fill="#8a6015" filter="url(#rough2)">镜像点 (x_b, 2(y_w−r)−y_b)</text>
  <g stroke="#446688" stroke-width="1.8" stroke-dasharray="6 4" fill="none" filter="url(#rough2)">
    <path d="M 470 176 L 80 262" marker-end="url(#a16)"/>
  </g>
  <text x="150" y="212" font-size="11" fill="#2f4a66" filter="url(#rough2)">镜像后是一条直线</text>

  <!-- 说明 -->
  <g filter="url(#rough2)">
    <rect x="80" y="376" width="560" height="52" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.2"/>
  </g>
  <g font-size="12" fill="#22314a" filter="url(#rough2)">
    <text x="94" y="398">球心到墙时高度是 y_w − r（球面贴墙），所以「关于 y_w − r 镜像」才是正确的反射。</text>
    <text x="94" y="418">镜像点画一条直线到目标 (0, y_c)，它与 y = y_w − r 的交点横坐标就是瞄点 x_w。</text>
  </g>
</svg>
