<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="57"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="440" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">把连续的 b 下标区间换成前缀和相减</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="112.0" y="120.0" width="68.0" height="68.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="146.0" y="160.0" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">b0=1</text>
  <rect x="184.0" y="120.0" width="68.0" height="68.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="218.0" y="160.0" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">b1=1</text>
  <rect x="256.0" y="120.0" width="68.0" height="68.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="290.0" y="160.0" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">b2=1</text>
  <text x="110.0" y="106.0" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">pref[0]=0</text>
  <text x="182.0" y="106.0" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">pref[1]=1</text>
  <text x="254.0" y="106.0" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">pref[2]=2</text>
  <text x="326.0" y="106.0" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">pref[3]=3</text>
  <line x1="186.0" y1="208.0" x2="322.0" y2="208.0" stroke="#8a6015" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="186.0" y1="202.0" x2="186.0" y2="214.0" stroke="#8a6015" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="322.0" y1="202.0" x2="322.0" y2="214.0" stroke="#8a6015" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="254.0" y="232.0" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">n = 6, j = 4 时只覆盖 b₁ 到 b₂</text>
  <rect x="40.0" y="300.0" width="640.0" height="108.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="54.0" y="325.0" text-anchor="start" font-size="13" fill="#3f3420" filter="url(#rough2)">lo = max(0, j − m + 1)，hi = min(j, n − m)</text>
  <text x="54.0" y="353.0" text-anchor="start" font-size="13" fill="#3f3420" filter="url(#rough2)">覆盖到的 b 下标区间是 [j − hi, j − lo]</text>
  <text x="54.0" y="381.0" text-anchor="start" font-size="13" fill="#3f3420" filter="url(#rough2)">add = pref[j − lo + 1] − pref[j − hi]</text>
  <text x="40.0" y="92.0" text-anchor="start" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">b 的前缀和 pref[t] = b₀ + … + b_{t−1}</text>
</svg>
