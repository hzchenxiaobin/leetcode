<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="350" fill="#fafafa"/>
  <text x="360.0" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">201C：奇偶分工与 a=1 屏障</text>
  <path d="M 144.00 46 Q 360.0 52 576.00 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="72" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">固定起点 s、终点 t（不妨 s ≤ t）：桥 i 的奇偶性完全由“它在不在 s..t 之间”决定。</text>
  <rect x="60" y="92" width="290" height="76" rx="9" fill="#fdeef1" stroke="#c0708a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="110" text-anchor="start" font-size="11" fill="#8a3a52" filter="url(#rough2)">s ≤ i &lt; t（在 s 到 t 的路径上）</text>
  <text x="74" y="132" text-anchor="start" font-size="11" fill="#8a3a52" filter="url(#rough2)">走过奇数次：取 odd_i</text>
  <text x="74" y="154" text-anchor="start" font-size="11" fill="#8a3a52" filter="url(#rough2)">a_i 奇 → a_i，否则 a_i-1</text>
  <rect x="370" y="92" width="290" height="76" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="384" y="110" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">i &lt; s 或 i ≥ t（两侧的来回）</text>
  <text x="384" y="132" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">走过偶数次：取 even_i</text>
  <text x="384" y="154" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">a_i 偶 → a_i，否则 a_i-1；须 ≥2</text>
  <text x="60" y="196" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">两侧能扩到多远？一直扩到撞上 a_k = 1 的桥为止：它只能被走 1 次，无法“过去再回来”。</text>
  <circle cx="100" cy="250" r="14" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="190" cy="250" r="14" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="280" cy="250" r="14" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="370" cy="250" r="14" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="460" cy="250" r="14" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="550" cy="250" r="14" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="145.0" y="238" text-anchor="middle" font-size="10" fill="#2f5b34" filter="url(#rough2)">2</text>
  <text x="235.0" y="238" text-anchor="middle" font-size="10" fill="#2f5b34" filter="url(#rough2)">3</text>
  <text x="325.0" y="238" text-anchor="middle" font-size="10" fill="#2f5b34" filter="url(#rough2)">1</text>
  <text x="415.0" y="238" text-anchor="middle" font-size="10" fill="#2f5b34" filter="url(#rough2)">4</text>
  <text x="505.0" y="238" text-anchor="middle" font-size="10" fill="#2f5b34" filter="url(#rough2)">2</text>
  <text x="280" y="286" text-anchor="middle" font-size="10" fill="#c0708a" filter="url(#rough2)">a=1 是屏障：两侧的偶数扩展在这里断开</text>
  <text x="60" y="318" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">用前缀和 O(1) 求每段 even 之和，再扫一遍取最优 (s,t)。</text>
</svg>
