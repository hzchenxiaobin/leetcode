<svg xmlns="http://www.w3.org/2000/svg" width="700" height="360" viewBox="0 0 700 360"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="223"/>
    <feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></defs>
  <rect width="700" height="360" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">无限背包：dp[s] 表示凑出 s 分的方案数</text>
  <path d="M 150 40 Q 350 46 550 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="52" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="13" fill="#22314a" filter="url(#rough2)">dp[0] = 1；对每个物品重量 w：for s = w..T: dp[s] += dp[s−w]</text>
  <text x="76" y="102" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">（正序循环就是"无限次可用"；倒序则变成 0/1 背包——这是最容易写错的地方）</text>
  <g filter="url(#rough2)"><rect x="60" y="122" width="580" height="80" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="76" y="146" font-size="12.5" fill="#8a6015" filter="url(#rough2)">样例 1：n=4,t=17,a=[3,1,2,5]，链 3&gt;4&gt;2（a₃=2,a₄=5,a₂=1）</text>
  <text x="76" y="170" font-size="12.5" fill="#8a6015" filter="url(#rough2)">base = 2·2 + 5·1 + 1·0 = 9 ⇒ T = 8；物品：2（前缀 2）、7（前缀 7）、8（整链）、3（孤立点 1）</text>
  <text x="76" y="192" font-size="12.5" fill="#8a6015" filter="url(#rough2)">凑 8 的方案：8；2×4；2+3×2 ⇒ 共 3 种 ✓（与样例输出一致）</text>
  <g filter="url(#rough2)"><rect x="60" y="214" width="580" height="60" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="238" font-size="12.5" fill="#2f5223" filter="url(#rough2)">样例 2：链 1&gt;2&gt;3，base = 2·3+1·1+0·1 = 7 &gt; t=6 ⇒ 0 ✓</text>
  <text x="76" y="260" font-size="12.5" fill="#2f5223" filter="url(#rough2)">样例 3：1→2、2→1 成环 ⇒ 0 ✓</text>
  <g filter="url(#rough2)"><rect x="60" y="286" width="580" height="58" rx="8" fill="#fbeeee" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="76" y="310" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">易错：把链的松弛量当成同一种物品（应分别是前缀和 2、7、8），会少算方案。</text>
  <text x="76" y="332" font-size="12" fill="#8a3a36" filter="url(#rough2)">实测：n=300、t=1e5 时 0.03 s（2 s 时限）。</text>
</svg>
