<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 384"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>

  <rect width="640" height="384" fill="#fafafa"/>

  <text x="320" y="32" text-anchor="middle" font-size="18" fill="#333"
        filter="url(#rough2)">演算：n = 1…6 的构造与校验</text>
  <text x="320" y="52" text-anchor="middle" font-size="11.5" fill="#666"
        filter="url(#rough2)">每行的 S 都是上一行的两倍；只有 n = 2 无解</text>

  <!-- 表头 -->
  <rect x="26" y="64" width="56" height="30" rx="4" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="54" y="84" text-anchor="middle" font-size="12.5" fill="#2a3f55" filter="url(#rough2)">n</text>
  <rect x="82" y="64" width="276" height="30" rx="4" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220" y="84" text-anchor="middle" font-size="12.5" fill="#2a3f55"
        filter="url(#rough2)">输出的数组</text>
  <rect x="358" y="64" width="94" height="30" rx="4" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="405" y="84" text-anchor="middle" font-size="12.5" fill="#2a3f55"
        filter="url(#rough2)">总和 S</text>
  <rect x="452" y="64" width="162" height="30" rx="4" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="533" y="84" text-anchor="middle" font-size="12.5" fill="#2a3f55"
        filter="url(#rough2)">整除校验</text>

  <!-- 第 1 行 n=1 -->
  <rect x="26" y="94" width="56" height="32" rx="4" fill="#ffffff" stroke="#8aa3bb"
        stroke-width="1.2" filter="url(#rough2)"/>
  <text x="54" y="115" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="82" y="94" width="276" height="32" rx="4" fill="#ffffff" stroke="#8aa3bb"
        stroke-width="1.2" filter="url(#rough2)"/>
  <text x="220" y="115" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="358" y="94" width="94" height="32" rx="4" fill="#ffffff" stroke="#8aa3bb"
        stroke-width="1.2" filter="url(#rough2)"/>
  <text x="405" y="115" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="452" y="94" width="162" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.2" filter="url(#rough2)"/>
  <text x="533" y="115" text-anchor="middle" font-size="12" fill="#33502a"
        filter="url(#rough2)">1 | 1 ✓</text>

  <!-- 第 2 行 n=2 -->
  <rect x="26" y="126" width="56" height="32" rx="4" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.2" filter="url(#rough2)"/>
  <text x="54" y="147" text-anchor="middle" font-size="12.5" fill="#6d2f2c" filter="url(#rough2)">2</text>
  <rect x="82" y="126" width="276" height="32" rx="4" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.2" filter="url(#rough2)"/>
  <text x="220" y="147" text-anchor="middle" font-size="12.5" fill="#6d2f2c"
        filter="url(#rough2)">-1</text>
  <rect x="358" y="126" width="94" height="32" rx="4" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.2" filter="url(#rough2)"/>
  <text x="405" y="147" text-anchor="middle" font-size="12.5" fill="#6d2f2c"
        filter="url(#rough2)">—</text>
  <rect x="452" y="126" width="162" height="32" rx="4" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.2" filter="url(#rough2)"/>
  <text x="533" y="147" text-anchor="middle" font-size="12" fill="#6d2f2c"
        filter="url(#rough2)">a | b 且 b | a 矛盾</text>

  <!-- 第 3 行 n=3 -->
  <rect x="26" y="158" width="56" height="32" rx="4" fill="#ffffff" stroke="#8aa3bb"
        stroke-width="1.2" filter="url(#rough2)"/>
  <text x="54" y="179" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="82" y="158" width="276" height="32" rx="4" fill="#ffffff" stroke="#8aa3bb"
        stroke-width="1.2" filter="url(#rough2)"/>
  <text x="220" y="179" text-anchor="middle" font-size="12.5" fill="#333"
        filter="url(#rough2)">1  2  3</text>
  <rect x="358" y="158" width="94" height="32" rx="4" fill="#ffffff" stroke="#8aa3bb"
        stroke-width="1.2" filter="url(#rough2)"/>
  <text x="405" y="179" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">6</text>
  <rect x="452" y="158" width="162" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.2" filter="url(#rough2)"/>
  <text x="533" y="179" text-anchor="middle" font-size="12" fill="#33502a"
        filter="url(#rough2)">6÷1, ÷2, ÷3 均整除 ✓</text>

  <!-- 第 4 行 n=4 -->
  <rect x="26" y="190" width="56" height="32" rx="4" fill="#ffffff" stroke="#8aa3bb"
        stroke-width="1.2" filter="url(#rough2)"/>
  <text x="54" y="211" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="82" y="190" width="276" height="32" rx="4" fill="#ffffff" stroke="#8aa3bb"
        stroke-width="1.2" filter="url(#rough2)"/>
  <text x="220" y="211" text-anchor="middle" font-size="12.5" fill="#333"
        filter="url(#rough2)">1  2  3  6</text>
  <rect x="358" y="190" width="94" height="32" rx="4" fill="#ffffff" stroke="#8aa3bb"
        stroke-width="1.2" filter="url(#rough2)"/>
  <text x="405" y="211" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">12</text>
  <rect x="452" y="190" width="162" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.2" filter="url(#rough2)"/>
  <text x="533" y="211" text-anchor="middle" font-size="12" fill="#33502a"
        filter="url(#rough2)">1, 2, 3, 6 | 12 ✓</text>

  <!-- 第 5 行 n=5 -->
  <rect x="26" y="222" width="56" height="32" rx="4" fill="#ffffff" stroke="#8aa3bb"
        stroke-width="1.2" filter="url(#rough2)"/>
  <text x="54" y="243" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">5</text>
  <rect x="82" y="222" width="276" height="32" rx="4" fill="#ffffff" stroke="#8aa3bb"
        stroke-width="1.2" filter="url(#rough2)"/>
  <text x="220" y="243" text-anchor="middle" font-size="12.5" fill="#333"
        filter="url(#rough2)">1  2  3  6  12</text>
  <rect x="358" y="222" width="94" height="32" rx="4" fill="#ffffff" stroke="#8aa3bb"
        stroke-width="1.2" filter="url(#rough2)"/>
  <text x="405" y="243" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">24</text>
  <rect x="452" y="222" width="162" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.2" filter="url(#rough2)"/>
  <text x="533" y="243" text-anchor="middle" font-size="12" fill="#33502a"
        filter="url(#rough2)">全部整除 24 ✓</text>

  <!-- 第 6 行 n=6 -->
  <rect x="26" y="254" width="56" height="32" rx="4" fill="#ffffff" stroke="#8aa3bb"
        stroke-width="1.2" filter="url(#rough2)"/>
  <text x="54" y="275" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">6</text>
  <rect x="82" y="254" width="276" height="32" rx="4" fill="#ffffff" stroke="#8aa3bb"
        stroke-width="1.2" filter="url(#rough2)"/>
  <text x="220" y="275" text-anchor="middle" font-size="12.5" fill="#333"
        filter="url(#rough2)">1  2  3  6  12  24</text>
  <rect x="358" y="254" width="94" height="32" rx="4" fill="#ffffff" stroke="#8aa3bb"
        stroke-width="1.2" filter="url(#rough2)"/>
  <text x="405" y="275" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">48</text>
  <rect x="452" y="254" width="162" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.2" filter="url(#rough2)"/>
  <text x="533" y="275" text-anchor="middle" font-size="12" fill="#33502a"
        filter="url(#rough2)">全部整除 48 ✓</text>

  <text x="320" y="316" text-anchor="middle" font-size="12.5" fill="#5a4208"
        filter="url(#rough2)">官方样例给出的是 [1,9,2,6] / [12,3,10,20,15]，同样是 S = 18 / 60 的因子</text>
  <text x="320" y="338" text-anchor="middle" font-size="12.5" fill="#5a4208"
        filter="url(#rough2)">多解任意输出一组即可；本构造的数组从第 2 项起严格递增，天然互异</text>
  <text x="320" y="360" text-anchor="middle" font-size="12.5" fill="#4a7a3a"
        filter="url(#rough2)">n = 50：S = 3·2^48 ≈ 8.4·10^14，最大元素 ≈ 4.2·10^14 &lt; 10^17</text>
</svg>
