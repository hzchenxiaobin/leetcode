<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="588"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="760" height="330" fill="#fafafa"/>
  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">一行的两种写法取较小者：min(x + d + y, y + d + x)</text>
  <path d="M 60 40 Q 380 48 700 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <rect x="40" y="62" width="330" height="100" rx="9" fill="#d9ecd4" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="56" y="86" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">情形 A：两个名字互不为前缀</text>
  <text x="56" y="108" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">比较在第 min(|x|,|y|) 位之前就分出胜负，</text>
  <text x="56" y="128" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">与分隔符 d 无关：字典序小的名字在前。</text>
  <text x="56" y="150" font-size="10.5" fill="#8a2b28" filter="url(#rough2)">例：ab 与 cd → "ab.cd"</text>

  <rect x="390" y="62" width="330" height="100" rx="9" fill="#fbe3c8" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="406" y="86" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">情形 B：x 是 y 的真前缀</text>
  <text x="406" y="108" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">x 之后跟着 d，y 之后跟着一个字母；</text>
  <text x="406" y="128" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">比较 d 与 y[|x|] 的大小决定谁在前。</text>
  <text x="406" y="150" font-size="10.5" fill="#8a2b28" filter="url(#rough2)">d &lt; 'a' 短名在前；d &gt; 'z' 长名在前。</text>

  <rect x="40" y="178" width="330" height="120" rx="9" fill="#cfe0f5" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="56" y="202" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2：d = '!'（33 &lt; 'a'）</text>
  <text x="56" y="224" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">名字 a 与 aa：</text>
  <text x="56" y="244" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">"a!aa" 与 "aa!a" 在第 2 个字符比较：</text>
  <text x="56" y="264" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">'!' &lt; 'a' → 取 "a!aa"</text>
  <text x="56" y="286" font-size="10.2" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">输出 a!aa</text>

  <rect x="390" y="178" width="330" height="120" rx="9" fill="#e8e0f5" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="406" y="202" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 3：d = '|'（124 &gt; 'z'）</text>
  <text x="406" y="224" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">名字 a 与 aa：</text>
  <text x="406" y="244" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">"a|aa" 与 "aa|a" 在第 2 个字符比较：</text>
  <text x="406" y="264" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">'|' &gt; 'a' → 取 "aa|a"</text>
  <text x="406" y="286" font-size="10.2" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">输出 aa|a</text>

  <text x="40" y="320" font-size="10.5" fill="#555555" filter="url(#rough2)">因为 d 不是小写字母，必满足 d ≤ 96 或 d ≥ 123，所以前缀情形的取向只取决于"d 比所有小写字母小还是大"，与具体字母无关。</text>
</svg>
