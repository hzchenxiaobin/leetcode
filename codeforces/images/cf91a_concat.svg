<svg xmlns="http://www.w3.org/2000/svg" width="880" height="368" viewBox="0 0 880 368"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="91"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="368" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">把 s1 首尾相接，s2 必须是它的子序列</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">贪心：每匹配一个字符就跳到它下一次出现的位置，跳不动就换下一份</text>
  <text x="90" y="104" text-anchor="start" font-size="11.5" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">s1 = abc（拼 2 份）</text>
  <g filter="url(#rough2)"><rect x="190" y="92" width="50" height="44" rx="3" fill="#d7ecd0" fill-opacity="0.7" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="215.0" y="121" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">a</text>
  <text x="215.0" y="84" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)"><rect x="246" y="92" width="50" height="44" rx="3" fill="#d7ecd0" fill-opacity="0.7" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="271.0" y="121" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">b</text>
  <text x="271.0" y="84" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="302" y="92" width="50" height="44" rx="3" fill="#d7ecd0" fill-opacity="0.7" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="327.0" y="121" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">c</text>
  <text x="327.0" y="84" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="358" y="92" width="50" height="44" rx="3" fill="#f6e3c4" fill-opacity="0.7" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="383.0" y="121" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">a</text>
  <text x="383.0" y="84" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="414" y="92" width="50" height="44" rx="3" fill="#f6e3c4" fill-opacity="0.7" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="439.0" y="121" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">b</text>
  <text x="439.0" y="84" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><rect x="470" y="92" width="50" height="44" rx="3" fill="#f6e3c4" fill-opacity="0.7" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="495.0" y="121" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">c</text>
  <text x="495.0" y="84" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">5</text>
  <text x="90" y="172" text-anchor="start" font-size="11.5" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">s2 = dabc</text>
  <text x="190" y="172" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">d 只出现在第 2 份的第 0 位 → 第 1 份用完，答案 2</text>
  <g filter="url(#rough2)"><rect x="120" y="236" width="640" height="88" rx="4" fill="#ffffff" fill-opacity="0.0" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="5 4"/></g>
  <text x="440" y="262" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">预处理 nxt[i][c] = 从位置 i 起（含 i）第一次出现 c 的位置</text>
  <text x="440" y="288" text-anchor="middle" font-size="12" fill="#3d6b2f" filter="url(#rough2)">匹配 s2 的每个字符：查 nxt[pos][c]；不存在则 copies+1 并从 nxt[0][c] 重新开始</text>
  <text x="440" y="312" text-anchor="middle" font-size="12" fill="#8a2b28" filter="url(#rough2)">若某个字符在 s1 中完全不存在 → 输出 −1</text>
</svg>
