<line x1="60" y1="332" x2="700" y2="332" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
<text x="380" y="392" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#c0392b" font-weight="normal" text-anchor="middle" filter="url(#rough2)">n-1 个跳远刚好取遍 1..n-1，所以必然两两不同</text>
