<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420">
<defs>
  <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs>
<rect x="0" y="0" width="760" height="420" fill="#fafafa"/>
<text x="380.0" y="34" font-size="22" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="bold" text-anchor="middle" filter="url(#rough2)">n = 7 时的跳远序列</text>
<rect x="80" y="78" width="64" height="252" rx="4" fill="#e8f0fe" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
<text x="112" y="68" font-size="16" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">6</text>
<text x="112" y="356" font-size="13" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">第1跳</text>
<rect x="180" y="120" width="64" height="210" rx="4" fill="#e6f4ea" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
<text x="212" y="110" font-size="16" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">5</text>
<text x="212" y="356" font-size="13" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">第2跳</text>
<rect x="280" y="162" width="64" height="168" rx="4" fill="#e8f0fe" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
<text x="312" y="152" font-size="16" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">4</text>
<text x="312" y="356" font-size="13" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">第3跳</text>
<rect x="380" y="204" width="64" height="126" rx="4" fill="#e6f4ea" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
