<text x="412" y="356" font-size="13" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">第4跳</text>
<rect x="480" y="246" width="64" height="84" rx="4" fill="#e8f0fe" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
<text x="512" y="236" font-size="16" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">2</text>
<text x="512" y="356" font-size="13" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">第5跳</text>
