<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="413"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">195B：m=3 时篮子的固定优先级：2 → 1 → 3</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="140.0" y="110.0" width="120.0" height="60.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="200.0" y="144.7" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">篮子 1</text>
  <text x="200.0" y="196.0" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">|2i−(m+1)| = 2</text>
  <rect x="300.0" y="110.0" width="120.0" height="60.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="360.0" y="144.7" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">篮子 2</text>
  <text x="360.0" y="196.0" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">|2i−(m+1)| = 0</text>
  <rect x="460.0" y="110.0" width="120.0" height="60.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="520.0" y="144.7" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">篮子 3</text>
  <text x="520.0" y="196.0" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">|2i−(m+1)| = 2</text>
  <text x="140.0" y="250.0" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">优先：球少 → 离中间近 → 编号小</text>
  <rect x="60.0" y="280.0" width="600.0" height="60.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="74.0" y="303.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">每轮所有篮子各加一个球，顺序固定 → 答案以 m 为周期</text>
  <text x="74.0" y="327.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">第 i 个球放进 order[(i−1) mod m]</text>
  <rect x="60.0" y="356.0" width="600.0" height="44.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="74.0" y="379.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">样例 n=4,m=3 → 2 1 3 2</text>
</svg>
