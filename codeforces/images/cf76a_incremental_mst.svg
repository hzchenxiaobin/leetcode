<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="720" height="460" fill="#fafafa"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按 g 升序加边，只维护 s 上的 MST</text>
  <path d="M 200 43 Q 360 49 520 43" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <rect x="70" y="74" width="250" height="62" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="86" y="98" text-anchor="start" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">① 边按 g 排序</text>
  <text x="86" y="120" text-anchor="start" font-size="10.5" fill="#777777" filter="url(#rough2)">前缀 = 所有 g ≤ 当前 g 的边</text>
  <path d="M 195 136 L 195 156" stroke="#2b2b2b" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="70" y="156" width="250" height="62" rx="7" fill="#e9f4e2" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="86" y="180" text-anchor="start" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">② 新边并入候选集</text>
  <text x="86" y="202" text-anchor="start" font-size="10.5" fill="#777777" filter="url(#rough2)">|候选| ≤ N（旧 MST 的 N-1 条 + 1）</text>
  <path d="M 195 218 L 195 238" stroke="#2b2b2b" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="70" y="238" width="250" height="62" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="86" y="262" text-anchor="start" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">③ 按 s 跑 Kruskal</text>
  <text x="86" y="284" text-anchor="start" font-size="10.5" fill="#777777" filter="url(#rough2)">重算 MST，压回 N-1 条</text>
  <path d="M 195 300 L 195 320" stroke="#2b2b2b" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="70" y="320" width="250" height="62" rx="7" fill="#e9f4e2" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="86" y="344" text-anchor="start" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">④ 若连通就更新答案</text>
  <text x="86" y="366" text-anchor="start" font-size="10.5" fill="#777777" filter="url(#rough2)">cost = g_i·G + s_max·S</text>
  <rect x="380" y="96" width="292" height="128" rx="7" fill="#ffffff" stroke="#7a5aa0" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="526" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5aa0" filter="url(#rough2)">为什么能压缩？</text>
  <text x="526" y="150" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">旧 MST T 加一条边 e 后，</text>
  <text x="526" y="172" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">新 MST ⊆ T ∪ {e}</text>
  <text x="526" y="198" text-anchor="middle" font-size="11" fill="#777777" filter="url(#rough2)">被丢掉的边永远不可能回来</text>
  <rect x="380" y="248" width="292" height="104" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="526" y="274" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">候选集大小</text>
  <text x="526" y="298" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">≤ N = 200</text>
  <text x="526" y="322" text-anchor="middle" font-size="10.5" fill="#8a6015" filter="url(#rough2)">每步 O(N α) → 总 O(M·N α)</text>
  <text x="60" y="404" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">候选集用「按 s 有序的数组」保存，插入与 Kruskal 都只碰 ≤200 条边；</text>
  <text x="60" y="430" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">M = 50000 步 × 200 ≈ 10^7 次并查集操作，2 s 绰绰有余。</text>
</svg>
