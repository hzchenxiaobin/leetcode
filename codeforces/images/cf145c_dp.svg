<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1455"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="720" height="360" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">幸运部分做背包，普通数用组合数收尾</text>
  <path d="M 130 42 Q 360 48 590 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <rect x="40" y="64" width="90" height="44" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="85" y="92" text-anchor="middle" font-size="12.5" fill="#335478" filter="url(#rough2)">1 + 2x</text>
  <text x="85" y="126" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">v=4，c=2</text>
  <text x="142" y="92" text-anchor="middle" font-size="15" fill="#555555" filter="url(#rough2)">×</text>

  <rect x="156" y="64" width="90" height="44" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="201" y="92" text-anchor="middle" font-size="12.5" fill="#335478" filter="url(#rough2)">1 + 3x</text>
  <text x="201" y="126" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">v=7，c=3</text>
  <text x="258" y="92" text-anchor="middle" font-size="15" fill="#555555" filter="url(#rough2)">×</text>

  <rect x="272" y="64" width="90" height="44" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="317" y="92" text-anchor="middle" font-size="12.5" fill="#335478" filter="url(#rough2)">1 + 1x</text>
  <text x="317" y="126" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">v=44，c=1</text>
  <text x="374" y="92" text-anchor="middle" font-size="14" fill="#555555" filter="url(#rough2)">× …</text>

  <rect x="408" y="64" width="130" height="44" rx="7" fill="#f6efd8" stroke="#b09040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="473" y="92" text-anchor="middle" font-size="12.5" fill="#8a6a20" filter="url(#rough2)">(1 + x)^U</text>
  <text x="473" y="126" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">U 个普通数</text>

  <text x="360" y="152" text-anchor="middle" font-size="11.5" fill="#335478" filter="url(#rough2)">每个幸运值 v 有 c_v 个副本、最多取 1 个 ⇒ 因子 (1 + c_v·x)，系数已包含"挑哪个副本"</text>

  <text x="40" y="180" font-size="11.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">dp[j] = 从前若干个幸运值里选 j 个互不相同的方案数，j ≤ K = min(k, 1022)</text>

  <rect x="80" y="192" width="70" height="40" rx="6" fill="#eef5ea" stroke="#5a8a4a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="115" y="218" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">dp[0]</text>
  <rect x="160" y="192" width="70" height="40" rx="6" fill="#eef5ea" stroke="#5a8a4a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="195" y="218" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">dp[1]</text>
  <rect x="240" y="192" width="70" height="40" rx="6" fill="#eef5ea" stroke="#5a8a4a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="275" y="218" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">dp[2]</text>
  <text x="326" y="218" font-size="14" fill="#777777" filter="url(#rough2)">…</text>
  <rect x="348" y="192" width="70" height="40" rx="6" fill="#eef5ea" stroke="#5a8a4a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="383" y="218" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">dp[K]</text>
  <text x="440" y="218" font-size="11" fill="#8a5a86" filter="url(#rough2)">转移（j 倒序）：dp[j+1] += dp[j]·c_v</text>

  <path d="M 195 232 L 195 254" stroke="#2f5223" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 383 232 L 383 254" stroke="#2f5223" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <rect x="60" y="260" width="600" height="56" rx="8" fill="#fbeeee" stroke="#a05a5a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="360" y="284" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a05a5a" filter="url(#rough2)">答案 = Σ(j=0..K) dp[j] · C(U, k−j)（仅当 0 ≤ k−j ≤ U）mod 10⁹+7</text>
  <text x="360" y="304" text-anchor="middle" font-size="11" fill="#777777" filter="url(#rough2)">普通数可以随便重复，选 k−j 个只要 C(U, k−j)；两部分选出的下标集合天然不重叠</text>

  <text x="360" y="340" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">复杂度 O(n + 1022²)，与 k 无关（DP 维度被不同的幸运值个数封顶）</text>
</svg>
