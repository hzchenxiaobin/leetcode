<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="360" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">子树 = 欧拉序上的一段连续区间</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">一次操作给 subtree(a) 与 subtree(b) 都打上标签 i；每个点要求"包含它的所有区间的并"大小</text>
  <g filter="url(#rough2)"><rect x="120" y="100" width="300" height="200" rx="6" fill="#ffffff" fill-opacity="0.4" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="270" y="90" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">欧拉序（子树 → 区间）</text>
  <g filter="url(#rough2)"><rect x="150" y="130" width="120" height="40" rx="3" fill="#d7ecd0" fill-opacity="0.8" stroke="#8899aa" stroke-width="1.2"/></g>
  <g filter="url(#rough2)"><rect x="200" y="180" width="180" height="40" rx="3" fill="#cfe0f0" fill-opacity="0.8" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="270" y="240" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">两条区间可以重叠</text>
  <text x="470" y="120" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">DFS 时"进入节点加、离开节点减"</text>
  <text x="470" y="148" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">线段树维护"被覆盖（计数≥1）的位置数"</text>
  <text x="470" y="176" text-anchor="start" font-size="13" fill="#3d6b2f" filter="url(#rough2)">c_v = 覆盖数 - 1</text>
  <text x="470" y="214" text-anchor="start" font-size="13" fill="#b05a5a" filter="url(#rough2)">总复杂度 O((n+m) log n)</text>
  <text x="440" y="320" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">同一操作在 a、b 处各加一次 → 用"覆盖计数"而不是布尔标记</text>
</svg>
