<svg xmlns="http://www.w3.org/2000/svg" width="720" height="486" viewBox="0 0 720 486"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>

  <rect width="720" height="486" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：把 x · lcm = ∏p 拆到每个素因子 q 上</text>
  <path d="M 106 42 Q 360 49 614 42" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="360" y="64" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">记 cᵢ = v_q(aᵢ)，M_q = maxᵢ v_q(pᵢ)，S_q = Σᵢ v_q(pᵢ)：条件 ⟺ 每个 q 都满足 v_q(x) + M_q = S_q</text>

  <rect x="34" y="84" width="306" height="204" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="187" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">q ∤ x（E_q = 0）</text>
  <text x="187" y="140" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">S_q = M_q</text>
  <text x="187" y="166" text-anchor="middle" font-size="11.5" fill="#33556f" filter="url(#rough2)">除最大者外不允许再有任何正指数</text>
  <text x="187" y="192" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">⇒ 至多一个 pᵢ 含 q</text>
  <text x="187" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f3a52" filter="url(#rough2)">f_q = 1 + Σᵢ cᵢ</text>
  <text x="187" y="248" text-anchor="middle" font-size="11.5" fill="#33556f" filter="url(#rough2)">“谁都不拿” 1 种 + 归给第 i 人时的 cᵢ 种指数</text>
  <text x="187" y="272" text-anchor="middle" font-size="11.5" fill="#33556f" filter="url(#rough2)">例：c = (1, 2, 0) ⇒ 1 + 3 = 4</text>

  <rect x="380" y="84" width="306" height="204" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="533" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">q | x（此处 x = 4，E_q = 2）</text>
  <text x="533" y="140" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">S_q − M_q = E_q = 2</text>
  <text x="533" y="166" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">非最大指数之和必须恰为 2，至少两人分摊</text>

  <rect x="404" y="180" width="44" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="456" y="180" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="508" y="180" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="560" y="180" width="44" height="34" rx="4" fill="#f2f2f2" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="612" y="180" width="44" height="34" rx="4" fill="#f2f2f2" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="426" y="203" text-anchor="middle" font-size="14" font-weight="bold" fill="#a14340" filter="url(#rough2)">3</text>
  <text x="478" y="203" text-anchor="middle" font-size="14" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">1</text>
  <text x="530" y="203" text-anchor="middle" font-size="14" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">1</text>
  <text x="582" y="203" text-anchor="middle" font-size="14" fill="#aaa" filter="url(#rough2)">0</text>
  <text x="634" y="203" text-anchor="middle" font-size="14" fill="#aaa" filter="url(#rough2)">0</text>
  <text x="533" y="238" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">红色是最大指数 3；绿色之和 1 + 1 = 2 ✓</text>
  <text x="533" y="264" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">⇒ 必须按“最大指数 m”分层单独计数 f_q</text>

  <rect x="34" y="302" width="652" height="58" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="326" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">不同素数的选择互不干扰：它们只是各往某个 pᵢ 上乘一个素数幂，可落在同一人身上</text>
  <text x="360" y="350" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">⇒ ans = ∏_q f_q mod (10⁹+7)</text>

  <text x="360" y="392" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">F1 只有 E_q = 0 的情形，一行公式即可；F2 多了 E_q &gt; 0 的素数，每个都要算 f_q</text>
  <text x="360" y="418" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">好消息：v_q(x) ≤ 18（2¹⁹ &gt; 5·10⁵），且 x ≤ 5·10⁵ 最多只有 6 个不同素因子</text>
  <text x="360" y="444" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">所以 f_q 的计数虽然绕，却只需要在“指数 ≤ 18、人数 ≤ 19”的极小状态空间里做</text>
</svg>
