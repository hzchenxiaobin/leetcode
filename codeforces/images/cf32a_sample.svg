<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="323" />
      <feDisplacementMap in="SourceGraphic" scale="1.5" />
    </filter>
  </defs>
  <rect width="760" height="420" fill="#fafafa" />
  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2：55 30 29 31 55，d = 1</text>
  <path d="M 100 44 Q 380 50 660 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)" />

  <text x="60" y="80" font-size="11.5" fill="#555" filter="url(#rough2)">排序后：</text>
  <g>
    <rect x="56" y="92" width="96" height="46" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)" />
    <rect x="164" y="92" width="96" height="46" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)" />
    <rect x="272" y="92" width="96" height="46" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)" />
    <rect x="380" y="92" width="96" height="46" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)" />
    <rect x="488" y="92" width="96" height="46" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)" />
  </g>
  <text x="104" y="120" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">29</text>
  <text x="212" y="120" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">30</text>
  <text x="320" y="120" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">31</text>
  <text x="428" y="120" text-anchor="middle" font-size="14" fill="#8a6015" filter="url(#rough2)">55</text>
  <text x="536" y="120" text-anchor="middle" font-size="14" fill="#8a6015" filter="url(#rough2)">55</text>

  <path d="M 56 154 L 56 168 L 368 168 L 368 154" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)" />
  <text x="212" y="188" text-anchor="middle" font-size="10.5" fill="#2f5223" filter="url(#rough2)">29-30、30-31 两对满足差 ≤1；29 与 31 差 2，不行</text>
  <path d="M 380 210 L 380 224 L 584 224 L 584 210" fill="none" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)" />
  <text x="482" y="244" text-anchor="middle" font-size="10.5" fill="#8a6015" filter="url(#rough2)">两个 55 差 0：1 对</text>

  <rect x="60" y="276" width="640" height="108" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)" />
  <text x="80" y="302" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">注意重复身高与“同一个人”</text>
  <text x="80" y="326" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">排序后 55 出现两次，它们是两个不同的士兵，组成 1 个无序对；</text>
  <text x="80" y="348" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">29-30、30-31 两对满足差 ≤1；29 与 31 差 2，不能配对。</text>
  <text x="80" y="370" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">无序对共 3 组：29-30、30-31、两个 55。有序方案 = 3 × 2 = 6，与样例一致。</text>
</svg>