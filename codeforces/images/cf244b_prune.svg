<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="109"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="p4" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b4652a"/>
    </marker>
  </defs>
  <rect width="720" height="300" fill="#fafafa"/>
  <text x="360" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">生成时的两条剪枝：前导零不生成、超过 n 立刻回头</text>

  <g filter="url(#rough2)">
    <rect x="40" y="52" width="300" height="98" rx="9" fill="#fde9d9" stroke="#b4652a" stroke-width="1.4"/>
  </g>
  <g font-size="11.5" fill="#7a4b22" filter="url(#rough2)">
    <text x="54" y="74" font-weight="bold">剪枝 1：前导零</text>
    <text x="54" y="96">从空串开始，第一位不能放 0；</text>
    <text x="54" y="116">放好第一位以后，后面的位可以是 0。</text>
    <text x="54" y="138">所以 (0,7) 只会生成 7、70、77、700 ……</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="364" y="52" width="316" height="98" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <g font-size="11.5" fill="#2f4a66" filter="url(#rough2)">
    <text x="378" y="74" font-weight="bold">剪枝 2：超过 n 就停</text>
    <text x="378" y="96">w = v·10 + d；若 w &gt; n，这条路整条断掉，</text>
    <text x="378" y="116">因为再往后只会更大（十进制左移加位）。</text>
    <text x="378" y="138">n = 123 时，124 这条路不会再产生 1240。</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="170" width="640" height="112" rx="9" fill="#eef6ec" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <g font-size="11.5" fill="#2f5223" filter="url(#rough2)">
    <text x="54" y="192" font-weight="bold">样例 n = 123 为什么是 113</text>
    <text x="54" y="214">1 位：1..9 —— 9 个</text>
    <text x="54" y="236">2 位：10..99 —— 90 个（两位数最多两种数字，全都合法）</text>
    <text x="54" y="258">3 位且 ≤ 123：100、101、110~119、121、122 共 14 个；102~109 与 120、123 含 3 种数字，排除</text>
    <text x="430" y="278" fill="#7a4b22">9 + 90 + 14 = 113</text>
  </g>
</svg>
