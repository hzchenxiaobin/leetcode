<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="330" fill="#fafafa"/>
  <text x="360.0" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">204C：把期望拆成“字符位置对”的贡献</text>
  <path d="M 144.00 46 Q 360.0 52 576.00 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="72" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">等概率选择“一对等长子串”：长度 L 有 (n−L+1)² 对，总对数 P = Σ (n−L+1)²。</text>
  <text x="60" y="92" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">期望 = 总匹配数 / P。按位置拆开计数，把“二元组”变成“两个字符位置”。</text>
  <rect x="60" y="114" width="300" height="96" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="132" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">E[f] = (1/P) · Σ_{p,q} [a_p = b_q] · 权重</text>
  <text x="74" y="154" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">权重 = (min(p,q)+1) · (n − max(p,q))</text>
  <text x="74" y="176" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">p、q 为两个字符串中的字符位置</text>
  <rect x="380" y="114" width="300" height="96" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="394" y="132" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">拆成两部分：</text>
  <text x="394" y="154" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">p ≤ q：(p+1)(n−q)</text>
  <text x="394" y="176" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">p &gt; q：(q+1)(n−p)</text>
  <text x="394" y="198" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">各自用 26 个前缀和 O(n) 累加</text>
  <text x="60" y="244" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">a: A B   b: B A   ⇒  5 对子串里 2 对在第 1 位相同 ⇒ 0.4</text>
  <text x="60" y="268" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">固定字符位置 p、q：所有“同时覆盖它们且对齐”的子串对数量就是那个权重。</text>
</svg>
