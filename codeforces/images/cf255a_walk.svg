<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="300" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 3：3 3 2 7 9 6 8</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">chest = 3+7+8 = 18，biceps = 3+9 = 12，back = 2+6 = 8</text>
  <g filter="url(#rough2)"><rect x="120" y="100" width="74" height="46" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="157.0" y="128.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="157" y="168" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">chest</text>
  <g filter="url(#rough2)"><rect x="216" y="100" width="74" height="46" rx="4" fill="#cfe0f0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="253.0" y="128.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="253" y="168" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">biceps</text>
  <g filter="url(#rough2)"><rect x="312" y="100" width="74" height="46" rx="4" fill="#f6e3c4" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="349.0" y="128.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="349" y="168" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">back</text>
  <g filter="url(#rough2)"><rect x="408" y="100" width="74" height="46" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="445.0" y="128.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">7</text>
  <text x="445" y="168" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">chest</text>
  <g filter="url(#rough2)"><rect x="504" y="100" width="74" height="46" rx="4" fill="#cfe0f0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="541.0" y="128.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">9</text>
  <text x="541" y="168" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">biceps</text>
  <g filter="url(#rough2)"><rect x="600" y="100" width="74" height="46" rx="4" fill="#f6e3c4" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="637.0" y="128.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">6</text>
  <text x="637" y="168" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">back</text>
  <g filter="url(#rough2)"><rect x="696" y="100" width="74" height="46" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="733.0" y="128.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">8</text>
  <text x="733" y="168" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">chest</text>
  <text x="440" y="220" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">chest 18　biceps 12　back 8</text>
  <text x="440" y="256" text-anchor="middle" font-size="13" fill="#b05a5a" filter="url(#rough2)">最大是 chest → 输出 "chest"</text>
</svg>
