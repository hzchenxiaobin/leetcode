<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="43"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar8" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="440" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">容斥：把「某个值恰好被说 v 次」当作坏事件</text>
  <path d="M 96 42 Q 360 48 624 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <text x="60" y="72" font-size="13" fill="#333" filter="url(#rough2)">
    固定 h，说谎者人数 m = n - h，可选答案集合 A（|A| = n-1；h = 0 时 |A| = n）
  </text>

  <g filter="url(#rough2)">
    <rect x="60" y="84" width="600" height="72" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="360" y="108" text-anchor="middle" font-size="12" fill="#22314a" filter="url(#rough2)">
    D = Σ_{S ⊆ A} (-1)^{|S|} · C(m, s) · (s! / ∏ v!) · (|A| - c)^(m - s)
  </text>
  <text x="360" y="130" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">
    其中 s = Σ_{v∈S} v，c = |S|
  </text>
  

  <!-- 三个部件 -->
  <g filter="url(#rough2)">
    <rect x="60" y="172" width="188" height="92" rx="8" fill="#ffffff" stroke="#888" stroke-width="1.2"/>
    <rect x="266" y="172" width="188" height="92" rx="8" fill="#ffffff" stroke="#888" stroke-width="1.2"/>
    <rect x="472" y="172" width="188" height="92" rx="8" fill="#ffffff" stroke="#888" stroke-width="1.2"/>
  </g>
  <g font-size="12" filter="url(#rough2)">
    <text x="74" y="194" fill="#333">① 挑出 s 个人去填 S：</text>
    <text x="74" y="216" fill="#2f4a66">C(m, s) 种</text>
    <text x="74" y="240" fill="#556">这 s 人要用到，</text>
    <text x="74" y="258" fill="#556">所以要 s ≤ m</text>

    <text x="280" y="194" fill="#333">② 把 s 人按大小分给各值：</text>
    <text x="280" y="216" fill="#2f4a66">s! / ∏ v!  种</text>
    <text x="280" y="240" fill="#556">即多项式系数，</text>
    <text x="280" y="258" fill="#556">记作 T[s][c] 的权</text>

    <text x="486" y="194" fill="#333">③ 剩下的人随便说：</text>
    <text x="486" y="216" fill="#2f4a66">(|A| - c)^{m - s} 种</text>
    <text x="486" y="240" fill="#556">c = |S|，指数 0 时</text>
    <text x="486" y="258" fill="#556">按 1 处理（0⁰ = 1）</text>
  </g>

  <!-- DP -->
  <text x="60" y="296" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">
    把「选哪些值」压成 O(m²) 的 DP：T[s][c] = Σ_{|S| = c, ΣS = s} s! / ∏ v!
  </text>

  <g filter="url(#rough2)">
    <rect x="60" y="308" width="600" height="56" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <g font-size="12.5" fill="#2f5223" filter="url(#rough2)">
    <text x="74" y="330">对每个 v = 1..n（跳过 v = h，且只需 v ≤ m）：</text>
    <text x="74" y="352">T[s + v][c + 1] += T[s][c] · C(s + v, v)，s 倒序枚举（每个值最多用一次）</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="376" width="600" height="52" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <g font-size="12.5" fill="#8a6015" filter="url(#rough2)">
    <text x="74" y="398">为什么 c ≤ 22：ΣS ≥ 1+2+…+c = c(c+1)/2 ≤ m ≤ 256；s 只到 m，c 只到 22，</text>
    <text x="74" y="418">整张表 256×23，对每个 v 扫一遍，总计约 1.4×10⁶ 次乘加。</text>
  </g>
</svg>
