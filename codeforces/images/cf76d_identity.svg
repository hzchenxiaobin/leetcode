  <text x="360" y="292" text-anchor="middle" font-size="11.5" fill="#7b2f2c" filter="url(#rough2)">只有 1+1 这一列会进位，且进位值恰好是 x and y 的那一位 → X+Y = xor + 2·and</text>
  <text x="80" y="342" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">于是 C := X and Y = (A - B) / 2，且要求 A ≥ B、(A-B) 为偶数。</text>
  <text x="80" y="370" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">若 C 的某一位为 1（X、Y 该位都是 1），则 xor 该位必为 0 → 要求 C &amp; B = 0。</text>
