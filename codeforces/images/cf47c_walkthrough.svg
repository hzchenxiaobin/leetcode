<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="491"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="330" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">C：样例 1 的六个词各就各位</text>
  <path d="M 200 40 Q 380 45 560 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <text x="50" y="70" font-size="11" fill="#555" filter="url(#rough2)">输入六词：NOD、BAA、YARD、AIRWAY、NEWTON、BURN</text>

  <rect x="50" y="84" width="300" height="140" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="62" y="106" font-size="11" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">角色分配（一种可行解）</text>
  <text x="62" y="128" font-size="10.5" fill="#3c5e88" filter="url(#rough2)">H1 = BAA　（a = 3）</text>
  <text x="62" y="148" font-size="10.5" fill="#3c5e88" filter="url(#rough2)">V1 = BURN　（b = 4）</text>
  <text x="62" y="168" font-size="10.5" fill="#3c5e88" filter="url(#rough2)">M  = NEWTON（L = 6）</text>
  <text x="62" y="188" font-size="10.5" fill="#3c5e88" filter="url(#rough2)">V2 = AIRWAY（H = 6）</text>
  <text x="62" y="208" font-size="10.5" fill="#3c5e88" filter="url(#rough2)">H3 = YARD（c = 4 = 6−3+1 ✓）　V3 = NOD（d = 3 = 6−4+1 ✓）</text>

  <rect x="376" y="84" width="330" height="140" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="388" y="106" font-size="11" font-weight="bold" fill="#2f5223" filter="url(#rough2)">7 个交叉点逐一对上</text>
  <text x="388" y="128" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">(0,0) B = B　　(0,2) A = A</text>
  <text x="388" y="148" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">(3,0) N = N　　(3,2) W = W</text>
  <text x="388" y="168" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">(3,5) N = N　　(5,2) Y = Y</text>
  <text x="388" y="188" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">(5,5) D = D</text>
  <text x="388" y="210" font-size="10" fill="#777" filter="url(#rough2)">全部相等 ⇒ 这是一种合法拼法</text>

  <rect x="50" y="238" width="656" height="80" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="62" y="262" font-size="10.5" fill="#8a6015" filter="url(#rough2)">得到的网格（6 行 × 6 列）：</text>
  <text x="62" y="284" font-size="11" fill="#2f4a66" font-family="'Courier New',monospace" filter="url(#rough2)">BAA...   U.I...   R.R...   NEWTON   ..A..O   ..YARD</text>
  <text x="62" y="306" font-size="10" fill="#777" filter="url(#rough2)">点表示空格；行内第 0 行是 H1，第 3 行（b−1）是 M，第 5 行（H−1）是 H3。</text>
</svg>
