<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>

  <rect width="720" height="380" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">放不下时输出 0 0</text>
  <path d="M 240 44 Q 360 50 480 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 左：样例 3 -->
  <rect x="40" y="60" width="320" height="250" rx="12" fill="#fde8e8" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="86" font-size="12.5" font-weight="bold" fill="#a33a36" filter="url(#rough2)">样例 3：a = b = 1，目标 1 : 2</text>
  <rect x="80" y="120" width="100" height="100" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="130" y="176" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">屏幕 1 × 1</text>
  <rect x="230" y="90" width="60" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6 3" filter="url(#rough2)"/>
  <text x="260" y="156" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">1 : 2</text>
  <text x="218" y="230" font-size="10.5" fill="#a33a36" filter="url(#rough2)">需要高 2，屏幕只有 1</text>
  <text x="56" y="268" font-size="11.5" fill="#8a3b38" filter="url(#rough2)">k = min(⌊1/1⌋, ⌊1/2⌋) = min(1, 0) = 0</text>
  <text x="56" y="292" font-size="11.5" fill="#8a3b38" filter="url(#rough2)">→ 输出 0 0</text>

  <!-- 右：可行对照 -->
  <rect x="380" y="60" width="300" height="250" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="396" y="86" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">可行对照：a = 2, b = 4，1 : 2</text>
  <rect x="410" y="110" width="80" height="160" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="450" y="196" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">2 × 4</text>
  <rect x="530" y="150" width="40" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="550" y="198" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">1:2</text>
  <text x="396" y="290" font-size="11.5" fill="#2f5223" filter="url(#rough2)">k = min(2, 2) = 2 → 输出 2 4</text>

  <text x="40" y="344" font-size="12" fill="#2b2b2b" filter="url(#rough2)">一般式：k = min(⌊a / x′⌋, ⌊b / y′⌋)；k = 0 表示连一块最简比例都放不下。</text>
</svg>
