<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="240" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">cf316a_count.svg</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">计数 = 字母的单射方案 × 10^{(问号个数)}（再处理首位不能为 0）</text>
  <text x="150" y="95" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">设 K = 不同字母个数：无首位限制时 10·9·…·(10-K+1)</text>
  <text x="150" y="133" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">首位是字母 → 该字母 9 种（非 0），其余 P(9,K-1)</text>
  <text x="150" y="171" text-anchor="start" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">首位是 ? → 9 种（非 0），其余问号各 10 种</text>
</svg>
