<svg xmlns="http://www.w3.org/2000/svg" width="620" height="320" viewBox="0 0 620 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="45"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="320" fill="#fafafa"/>
  <text x="310" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例：3 个点、两条边 1−2、2−3，补一条 1−3 闭合成环</text>

  <g stroke="#446688" stroke-width="2.6" filter="url(#rough2)">
    <line x1="310" y1="80" x2="200" y2="200"/>
    <line x1="200" y1="200" x2="420" y2="200"/>
  </g>
  <line x1="420" y1="200" x2="310" y2="80" stroke="#b85450" stroke-width="2.6" stroke-dasharray="7 5" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <circle cx="310" cy="80" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="310" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66">2</text>
    <circle cx="200" cy="200" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="200" y="206" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66">1</text>
    <circle cx="420" cy="200" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="420" y="206" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66">3</text>
  </g>

  <text x="245" y="128" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">已有</text>
  <text x="310" y="220" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">已有</text>
  <text x="360" y="130" font-size="11.5" fill="#8f3b37" filter="url(#rough2)">新增 (1,3)</text>

  <rect x="60" y="252" width="500" height="52" rx="9" fill="#eef4ec" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="76" y="274" font-size="12.5" fill="#2f5223" filter="url(#rough2)">初始图是一条路径（1 个连通块），只需闭合：端点 1 与 3 连边。</text>
  <text x="76" y="294" font-size="12.5" fill="#2f5223" filter="url(#rough2)">输出：YES / 1 / 1 3。</text>
</svg>
