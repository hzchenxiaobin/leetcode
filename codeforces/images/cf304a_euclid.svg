<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="240" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">欧几里得生成本原勾股数</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">只需枚举到 m^2+1 &lt;= n</text>
  <text x="150" y="95" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">本原勾股数由 m&gt;k、gcd(m,k)=1、m-k 为奇数生成：</text>
  <text x="150" y="135" text-anchor="start" font-size="13" fill="#2f4a66" filter="url(#rough2)">a = m^2-k^2, b = 2mk, c = m^2+k^2</text>
  <text x="150" y="175" text-anchor="start" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">每个本原三元组按倍数放大 t 倍，贡献 floor(n/c) 个</text>
</svg>
