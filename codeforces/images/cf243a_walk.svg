<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="720" height="280" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1：1 2 0 的所有子数组 OR</text>
  <rect x="60" y="54" width="160" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="140" y="75" text-anchor="middle" font-size="11.5" fill="#2f4a66">i=1</text>
  <rect x="250" y="54" width="300" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="400" y="75" text-anchor="middle" font-size="12" fill="#2f5223">{1}</text>
  <rect x="60" y="98" width="160" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="140" y="119" text-anchor="middle" font-size="11.5" fill="#2f4a66">i=2</text>
  <rect x="250" y="98" width="300" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="400" y="119" text-anchor="middle" font-size="12" fill="#2f5223">{2, 1|2=3}</text>
  <rect x="60" y="142" width="160" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="140" y="163" text-anchor="middle" font-size="11.5" fill="#2f4a66">i=3</text>
  <rect x="250" y="142" width="300" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="400" y="163" text-anchor="middle" font-size="12" fill="#2f5223">{0, 2|0=2, 3|0=3}</text>
  <text x="60" y="222" text-anchor="start" font-size="12" fill="#7a4b22" filter="url(#rough2)">并集 = {0,1,2,3}，共 4 个 ✓</text>
</svg>
