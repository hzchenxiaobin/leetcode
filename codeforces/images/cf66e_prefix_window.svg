<svg xmlns="http://www.w3.org/2000/svg" width="880" height="450" viewBox="0 0 880 450"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="37"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="880" height="450" fill="#fafafa"/>

  <text x="440" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">把前缀和复制一份：起点 i 只需看一个长度 n−1 的窗口</text>
  <text x="440" y="58" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">样例一：c = a − b = [−7, 6, 1, 0]，S = [0, −7, −1, 0]，S[4] = 0（总油量 = 总路程）</text>

  <!-- 窗口底色（i=1，k=1..4） -->
  <g filter="url(#rough2)">
    <rect x="186" y="96" width="288" height="176" fill="#cfe0f5" fill-opacity="0.45" stroke="#446688" stroke-width="1.4" stroke-dasharray="6 4"/>
    <text x="330" y="90" text-anchor="middle" font-size="11.5" fill="#2f4a66">窗口 [i+1, i+n−1] = [2, 4]</text>
  </g>

  <!-- 坐标轴 -->
  <g filter="url(#rough2)">
    <line x1="70" y1="220" x2="810" y2="220" stroke="#999999" stroke-width="1.4" stroke-dasharray="5 4"/>
    <text x="60" y="224" text-anchor="end" font-size="10.5" fill="#999999">S = 0</text>
    <line x1="70" y1="280" x2="810" y2="280" stroke="#dddddd" stroke-width="1"/>
    <text x="60" y="284" text-anchor="end" font-size="10" fill="#bbbbbb">−7</text>
  </g>

  <!-- 折线：k=0..7，x=100+k*95，y=220+S*12 -->
  <g filter="url(#rough2)">
    <polyline points="100,220 195,136 290,208 385,220 480,220 575,136 670,208 765,220"
              fill="none" stroke="#446688" stroke-width="2"/>
    <circle cx="100" cy="220" r="4.5" fill="#446688"/>
    <circle cx="195" cy="136" r="5.5" fill="#b85450"/>
    <circle cx="290" cy="208" r="4.5" fill="#446688"/>
    <circle cx="385" cy="220" r="4.5" fill="#446688"/>
    <circle cx="480" cy="220" r="4.5" fill="#446688"/>
    <circle cx="575" cy="136" r="4.5" fill="#446688"/>
    <circle cx="670" cy="208" r="4.5" fill="#446688"/>
    <circle cx="765" cy="220" r="4.5" fill="#446688"/>
  </g>

  <!-- 数值与下标 -->
  <g filter="url(#rough2)" text-anchor="middle" font-size="10.5">
    <text x="100" y="208" fill="#446688">0</text>
    <text x="195" y="122" fill="#b85450">−7 = S₁</text>
    <text x="290" y="198" fill="#446688">−1</text>
    <text x="385" y="210" fill="#446688">0</text>
    <text x="480" y="210" fill="#446688">0</text>
    <text x="575" y="122" fill="#446688">−7</text>
    <text x="670" y="198" fill="#446688">−1</text>
    <text x="765" y="210" fill="#446688">0</text>

    <text x="100" y="300" fill="#888888">k=0</text>
    <text x="195" y="300" fill="#b85450">k=1</text>
    <text x="290" y="300" fill="#888888">k=2</text>
    <text x="385" y="300" fill="#888888">k=3</text>
    <text x="480" y="300" fill="#888888">k=4</text>
    <text x="575" y="300" fill="#888888">k=5</text>
    <text x="670" y="300" fill="#888888">k=6</text>
    <text x="765" y="300" fill="#888888">k=7</text>
  </g>

  <!-- 周期分隔 -->
  <g filter="url(#rough2)">
    <line x1="432" y1="100" x2="432" y2="286" stroke="#b58a3a" stroke-width="1.3" stroke-dasharray="5 4"/>
    <text x="380" y="322" font-size="10.5" fill="#8a6015">S[4] = S[0]：S 以 n = 4 为周期</text>
  </g>

  <!-- 判定标注 -->
  <g filter="url(#rough2)">
    <path d="M 195 150 L 290 176" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="300" y="172" font-size="11" fill="#8a2b28">窗口最小 −1 ≥ −7 ⇒ 可行</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="330" width="760" height="96" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="76" y="354" font-size="11.5" fill="#8a6015">对每个起点 i（0 基）：若 min(T[i+1 … i+n−1]) ≥ S[i]，则从 i 出发能走完一圈。</text>
    <text x="76" y="378" font-size="11.5" fill="#8a6015">T[k] = S[k mod n] 是把 S 复制一份后的数组；j = i+n 那项等于 S[i]，自动成立，可以去掉。</text>
    <text x="76" y="402" font-size="11.5" fill="#8a6015">所有窗口等长、右端逐格右移：用单调队列 O(n) 求出全部窗口最小值，不必每个起点重扫一遍。</text>
    <text x="76" y="420" font-size="10.5" fill="#9a7020">（此图只画顺时针；逆时针把 a、b 翻转后再算一遍，见下一幅图。）</text>
  </g>
</svg>
