<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="500" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例：三个朋友块，讨厌边分跨块与块内两种</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <line x1="110.0" y1="190.0" x2="58.0" y2="310.0" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="110.0" y1="190.0" x2="168.0" y2="310.0" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="58.0" y1="310.0" x2="168.0" y2="310.0" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="300.0" y1="190.0" x2="300.0" y2="320.0" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="470.0" y1="120.0" x2="620.0" y2="190.0" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="620.0" y1="190.0" x2="620.0" y2="340.0" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="620.0" y1="340.0" x2="470.0" y2="410.0" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="470.0" y1="410.0" x2="470.0" y2="120.0" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="110.0" y1="190.0" x2="470.0" y2="120.0" stroke="#b85450" stroke-width="1.5" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <line x1="620.0" y1="190.0" x2="470.0" y2="410.0" stroke="#b85450" stroke-width="1.5" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <circle cx="110.0" cy="190.0" r="20.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="110.0" y="195.0" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="58.0" cy="310.0" r="20.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="58.0" y="315.0" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <circle cx="168.0" cy="310.0" r="20.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="168.0" y="315.0" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <circle cx="300.0" cy="190.0" r="20.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="300.0" y="195.0" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
  <circle cx="300.0" cy="320.0" r="20.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="300.0" y="325.0" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5</text>
  <circle cx="470.0" cy="120.0" r="20.0" fill="#fde8e8" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="470.0" y="125.0" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">6</text>
  <circle cx="620.0" cy="190.0" r="20.0" fill="#fde8e8" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="620.0" y="195.0" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">7</text>
  <circle cx="620.0" cy="340.0" r="20.0" fill="#fde8e8" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="620.0" y="345.0" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">8</text>
  <circle cx="470.0" cy="410.0" r="20.0" fill="#fde8e8" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="470.0" y="415.0" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="470.0" y="96.0" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">块 {6,7,8,9}</text>
  <text x="110.0" y="160.0" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">块 {1,2,3}</text>
  <text x="300.0" y="160.0" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">块 {4,5}</text>
  <text x="455.0" y="300.0" text-anchor="end" font-size="11.5" fill="#b85450" filter="url(#rough2)">7–9 在块内</text>
  <text x="300.0" y="250.0" text-anchor="start" font-size="11.5" fill="#b85450" filter="url(#rough2)">1–6 跨块</text>
  <text x="40.0" y="452.0" text-anchor="start" font-size="12.5" fill="#444" filter="url(#rough2)">实线 = 朋友，红色虚线 = 讨厌；跨块的讨厌边不影响任何候选集合。</text>
</svg>
