<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="21"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="940" height="470" fill="#fafafa"/>

  <text x="470" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例三的文件夹树：同名的 file 是四个不同结点</text>
  <text x="470" y="60" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">两条路径只共用前缀 C:\file\file\file，之后分叉为 file 与 file2</text>

  <!-- 边 -->
  <g filter="url(#rough2)" stroke="#446688" stroke-width="1.6" fill="none">
    <path d="M 146 215 L 178 215"/>
    <path d="M 266 215 L 308 215"/>
    <path d="M 396 215 L 438 215"/>
    <path d="M 526 215 L 568 215"/>
    <path d="M 602 235 L 660 178"/>
    <path d="M 602 235 L 660 292"/>
    <path d="M 710 178 L 710 196"/>
    <path d="M 710 328 L 710 346"/>
  </g>

  <!-- 结点 -->
  <g filter="url(#rough2)">
    <rect x="60" y="195" width="86" height="40" rx="8" fill="#eeeeee" stroke="#888888" stroke-width="1.6"/>
    <text x="103" y="220" text-anchor="middle" font-size="12" fill="#555555">虚拟根</text>

    <rect x="178" y="195" width="88" height="40" rx="8" fill="#f4f4f4" stroke="#888888" stroke-width="1.6" stroke-dasharray="6 3"/>
    <text x="222" y="220" text-anchor="middle" font-size="13" fill="#555555">C:</text>

    <rect x="308" y="195" width="88" height="40" rx="8" fill="#d9ecd4" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="352" y="220" text-anchor="middle" font-size="13" fill="#2f5223">file</text>

    <rect x="438" y="195" width="88" height="40" rx="8" fill="#cfe0f5" stroke="#446688" stroke-width="1.6"/>
    <text x="482" y="220" text-anchor="middle" font-size="13" fill="#2f4a66">file</text>

    <rect x="568" y="195" width="88" height="40" rx="8" fill="#cfe0f5" stroke="#446688" stroke-width="1.6"/>
    <text x="612" y="220" text-anchor="middle" font-size="13" fill="#2f4a66">file</text>

    <rect x="660" y="140" width="100" height="38" rx="8" fill="#f6e3c4" stroke="#b58a3a" stroke-width="1.6"/>
    <text x="710" y="164" text-anchor="middle" font-size="13" fill="#7a5a1b">file</text>

    <rect x="660" y="292" width="100" height="38" rx="8" fill="#f6e3c4" stroke="#b58a3a" stroke-width="1.6"/>
    <text x="710" y="316" text-anchor="middle" font-size="13" fill="#7a5a1b">file2</text>
  </g>

  <!-- 计数标注 -->
  <g filter="url(#rough2)">
    <text x="352" y="252" text-anchor="middle" font-size="10.5" fill="#2f5223">子 4 个，文 2 个</text>
    <text x="482" y="252" text-anchor="middle" font-size="10.5" fill="#2f4a66">子 3 个，文 2 个</text>
    <text x="612" y="252" text-anchor="middle" font-size="10.5" fill="#2f4a66">子 2 个，文 2 个</text>
    <text x="710" y="196" text-anchor="middle" font-size="10.5" fill="#7a5a1b">file.txt ×1</text>
    <text x="710" y="348" text-anchor="middle" font-size="10.5" fill="#7a5a1b">file.txt ×1</text>

    <text x="352" y="182" text-anchor="middle" font-size="10" fill="#4a7a3a">C:\file</text>
    <text x="482" y="182" text-anchor="middle" font-size="10" fill="#446688">C:\file\file</text>
    <text x="612" y="182" text-anchor="middle" font-size="10" fill="#446688">…\file</text>
  </g>

  <!-- 答案强调 -->
  <g filter="url(#rough2)">
    <rect x="40" y="300" width="230" height="86" rx="10" fill="#eef6e8" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="56" y="324" font-size="12" font-weight="bold" fill="#2f5223">最外层 file 的子树</text>
    <text x="56" y="346" font-size="11.5" fill="#2f5223">文件夹：下面 3 层 file + file2 = 4 个</text>
    <text x="56" y="368" font-size="11.5" fill="#2f5223">文件：两个 file.txt = 2 个 → 答案 4 2</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="300" y="392" width="600" height="56" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="316" y="414" font-size="11.5" fill="#8a6015">C: 是盘符，不是文件夹：取最大值时必须跳过它。</text>
    <text x="316" y="436" font-size="11.5" fill="#8a6015">若把 C: 也算进去，它的子树有 5 个文件夹，会错误输出 5 2。</text>
  </g>
</svg>
