<svg xmlns="http://www.w3.org/2000/svg" width="720" height="410" viewBox="0 0 720 410"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="157"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="a14carr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="410" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">离交集最近：三种位置，一个公式</text>
  <path d="M 160 44 Q 360 50 560 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 卡片 1 -->
  <rect x="24" y="66" width="214" height="230" rx="11" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="40" y="94" font-size="13" font-weight="bold" fill="#8a3b36" filter="url(#rough2)">x0 &lt; L</text>
  <!-- 迷你轴 -->
  <line x1="44" y1="150" x2="218" y2="150" stroke="#2b2b2b" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="120" y="136" width="70" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="120" y="128" text-anchor="middle" font-size="10" fill="#2f5223" filter="url(#rough2)">L</text>
  <text x="190" y="128" text-anchor="middle" font-size="10" fill="#2f5223" filter="url(#rough2)">R</text>
  <circle cx="70" cy="150" r="4.5" fill="#b85450" filter="url(#rough2)"/>
  <text x="70" y="172" text-anchor="middle" font-size="10" fill="#8a3b36" filter="url(#rough2)">x0</text>
  <line x1="76" y1="143" x2="114" y2="143" stroke="#b85450" stroke-width="1.7" marker-end="url(#a14carr)" filter="url(#rough2)"/>
  <text x="44" y="206" font-size="11.5" fill="#555" filter="url(#rough2)">最近的位置是 L，</text>
  <text x="44" y="226" font-size="11.5" fill="#555" filter="url(#rough2)">距离 = L - x0。</text>
  <text x="44" y="262" font-size="13" font-weight="bold" fill="#8a3b36" filter="url(#rough2)">L - x0</text>

  <!-- 卡片 2 -->
  <rect x="253" y="66" width="214" height="230" rx="11" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="269" y="94" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">L ≤ x0 ≤ R</text>
  <line x1="273" y1="150" x2="447" y2="150" stroke="#2b2b2b" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="320" y="136" width="100" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="320" y="128" text-anchor="middle" font-size="10" fill="#2f5223" filter="url(#rough2)">L</text>
  <text x="420" y="128" text-anchor="middle" font-size="10" fill="#2f5223" filter="url(#rough2)">R</text>
  <circle cx="370" cy="150" r="4.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="370" y="172" text-anchor="middle" font-size="10" fill="#2f5223" filter="url(#rough2)">x0</text>
  <text x="273" y="206" font-size="11.5" fill="#555" filter="url(#rough2)">已经站在交集内部，</text>
  <text x="273" y="226" font-size="11.5" fill="#555" filter="url(#rough2)">不需要移动。</text>
  <text x="273" y="262" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">0</text>

  <!-- 卡片 3 -->
  <rect x="482" y="66" width="214" height="230" rx="11" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="498" y="94" font-size="13" font-weight="bold" fill="#8a3b36" filter="url(#rough2)">x0 &gt; R</text>
  <line x1="502" y1="150" x2="676" y2="150" stroke="#2b2b2b" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="540" y="136" width="70" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="540" y="128" text-anchor="middle" font-size="10" fill="#2f5223" filter="url(#rough2)">L</text>
  <text x="610" y="128" text-anchor="middle" font-size="10" fill="#2f5223" filter="url(#rough2)">R</text>
  <circle cx="650" cy="150" r="4.5" fill="#b85450" filter="url(#rough2)"/>
  <text x="650" y="172" text-anchor="middle" font-size="10" fill="#8a3b36" filter="url(#rough2)">x0</text>
  <line x1="644" y1="143" x2="616" y2="143" stroke="#b85450" stroke-width="1.7" marker-end="url(#a14carr)" filter="url(#rough2)"/>
  <text x="502" y="206" font-size="11.5" fill="#555" filter="url(#rough2)">最近的位置是 R，</text>
  <text x="502" y="226" font-size="11.5" fill="#555" filter="url(#rough2)">距离 = x0 - R。</text>
  <text x="502" y="262" font-size="13" font-weight="bold" fill="#8a3b36" filter="url(#rough2)">x0 - R</text>

  <!-- 底部公式 -->
  <rect x="24" y="314" width="672" height="72" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="44" y="342" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">答案 = max(0, L - x0, x0 - R)</text>
  <text x="44" y="368" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">其中 L = max(min(ai,bi))，R = min(max(ai,bi))；若 L &gt; R 则交集为空，输出 -1。</text>
</svg>
