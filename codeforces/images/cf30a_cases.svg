<svg xmlns="http://www.w3.org/2000/svg" width="740" height="320" viewBox="0 0 740 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="111"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="740" height="320" fill="#fafafa"/>
  <text x="370" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">先看 A 是不是 0</text>
  <g filter="url(#rough2)">
    <rect x="60" y="56" width="260" height="120" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="190" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66">A = 0</text>
    <text x="80" y="110" font-size="12.5" fill="#2f4a66">B = 0 → 任意 X（取 5）</text>
    <text x="80" y="136" font-size="12.5" fill="#2f4a66">B ≠ 0 → No solution</text>
    <rect x="360" y="56" width="320" height="120" rx="10" fill="#eef4ec" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="520" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5223">A ≠ 0</text>
    <text x="380" y="110" font-size="12.5" fill="#2f5223">B mod A ≠ 0 → No solution</text>
    <text x="380" y="136" font-size="12.5" fill="#2f5223">否则 q = B / A，枚举 X 使 X^n = q</text>
  </g>
  <rect x="60" y="200" width="620" height="96" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="76" y="226" font-size="12.5" fill="#8a6015" filter="url(#rough2)">|q| ≤ 1000，而 |X|^n = |q|，所以 |X| ≤ 1000，枚举 2001 个整数即可。</text>
  <text x="76" y="252" font-size="12.5" fill="#8a6015" filter="url(#rough2)">n 为偶数时 ±X 都成立（先输出非负解）；n 为奇数时符号与 q 一致。</text>
  <text x="76" y="278" font-size="12" fill="#8a6015" filter="url(#rough2)">注意 1000¹⁰ 会溢出，求幂时要饱和保护。</text>
</svg>
