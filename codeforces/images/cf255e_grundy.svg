<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="340" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">实测得到的 g(x) 分段结构（1..7.7×10^11）</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">每段内 g 恒定；用独立的按段枚举程序与暴力 mex 双重核对过</text>
  <g filter="url(#rough2)"><rect x="120" y="100" width="300" height="26" rx="3" fill="#eeeeee" fill-opacity="0.8" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="140" y="119" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">[1, 3]</text>
  <text x="460" y="119" text-anchor="start" font-size="12" fill="#b05a5a" filter="url(#rough2)">g = 0</text>
  <g filter="url(#rough2)"><rect x="120" y="132" width="300" height="26" rx="3" fill="#d7ecd0" fill-opacity="0.8" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="140" y="151" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">[4, 15]</text>
  <text x="460" y="151" text-anchor="start" font-size="12" fill="#b05a5a" filter="url(#rough2)">g = 1</text>
  <g filter="url(#rough2)"><rect x="120" y="164" width="300" height="26" rx="3" fill="#cfe0f0" fill-opacity="0.8" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="140" y="183" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">[16, 81]</text>
  <text x="460" y="183" text-anchor="start" font-size="12" fill="#b05a5a" filter="url(#rough2)">g = 2</text>
  <g filter="url(#rough2)"><rect x="120" y="196" width="300" height="26" rx="3" fill="#eeeeee" fill-opacity="0.8" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="140" y="215" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">[82, 6723]</text>
  <text x="460" y="215" text-anchor="start" font-size="12" fill="#b05a5a" filter="url(#rough2)">g = 0</text>
  <g filter="url(#rough2)"><rect x="120" y="228" width="300" height="26" rx="3" fill="#f6e3c4" fill-opacity="0.8" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="140" y="247" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">[6724, 50625]</text>
  <text x="460" y="247" text-anchor="start" font-size="12" fill="#b05a5a" filter="url(#rough2)">g = 3</text>
  <g filter="url(#rough2)"><rect x="120" y="260" width="300" height="26" rx="3" fill="#d7ecd0" fill-opacity="0.8" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="140" y="279" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">[50626, 50626^2-1]</text>
  <text x="460" y="279" text-anchor="start" font-size="12" fill="#b05a5a" filter="url(#rough2)">g = 1</text>
  <g filter="url(#rough2)"><rect x="120" y="292" width="300" height="26" rx="3" fill="#cfe0f0" fill-opacity="0.8" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="140" y="311" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">[50626^2, ...]</text>
  <text x="460" y="311" text-anchor="start" font-size="12" fill="#b05a5a" filter="url(#rough2)">g = 2</text>
  <text x="560" y="140" text-anchor="start" font-size="12.5" fill="#555555" filter="url(#rough2)">g=0 的两段很窄，</text>
  <text x="560" y="164" text-anchor="start" font-size="12.5" fill="#555555" filter="url(#rough2)">g=1 与 g=2 覆盖了绝大部分范围</text>
  <text x="560" y="200" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">因此大堆的 Grundy 值通常只有 1 或 2，</text>
  <text x="560" y="224" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">XOR 的奇偶性几乎决定了胜负</text>
  <text x="440" y="320" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">（表中的 50626^2 = 2562991876，与二分求值的结果一致）</text>
</svg>
