<svg xmlns="http://www.w3.org/2000/svg" width="720" height="456" viewBox="0 0 720 456"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="47"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="720" height="456" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">演算：5 组官方样例的差分量</text>
  <path d="M 222 43 Q 360 50 498 43" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 表头 -->
  <rect x="30" y="60" width="44" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="52" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">#</text>
  <rect x="78" y="60" width="150" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="153" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">分子 p</text>
  <rect x="232" y="60" width="150" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="307" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">分母 q</text>
  <rect x="386" y="60" width="188" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="480" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">p − q 的剩余</text>
  <rect x="578" y="60" width="108" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="632" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">结论</text>

  <!-- 行 1：sinx / n -->
  <rect x="30" y="104" width="44" height="44" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="52" y="131" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="78" y="104" width="150" height="44" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="153" y="131" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">sinx</text>
  <rect x="232" y="104" width="150" height="44" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="307" y="131" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">n</text>
  <rect x="386" y="104" width="188" height="44" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="480" y="131" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">剩 i、s、x，其余 0</text>
  <rect x="578" y="104" width="108" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="632" y="131" text-anchor="middle" font-size="14" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">YES</text>

  <!-- 行 2：xixsms / mixsxim -->
  <rect x="30" y="150" width="44" height="44" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="52" y="177" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="78" y="150" width="150" height="44" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="153" y="177" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">xixsms</text>
  <rect x="232" y="150" width="150" height="44" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="307" y="177" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">mixsxim</text>
  <rect x="386" y="150" width="188" height="44" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="480" y="177" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">分母多 1 个 i，差为 −1</text>
  <rect x="578" y="150" width="108" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="632" y="177" text-anchor="middle" font-size="14" font-weight="bold" fill="#a14340" filter="url(#rough2)">NO</text>

  <!-- 行 3：fixtures / frute -->
  <rect x="30" y="196" width="44" height="44" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="52" y="223" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="78" y="196" width="150" height="44" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="153" y="223" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">fixtures</text>
  <rect x="232" y="196" width="150" height="44" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="307" y="223" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">frute</text>
  <rect x="386" y="196" width="188" height="44" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="480" y="223" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">剩 i、s、x，其余 0</text>
  <rect x="578" y="196" width="108" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="632" y="223" text-anchor="middle" font-size="14" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">YES</text>

  <!-- 行 4：abc / def -->
  <rect x="30" y="242" width="44" height="44" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="52" y="269" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="78" y="242" width="150" height="44" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="153" y="269" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">abc</text>
  <rect x="232" y="242" width="150" height="44" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="307" y="269" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">def</text>
  <rect x="386" y="242" width="188" height="44" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="480" y="269" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">a、b、c 为 +1，d、e、f 为 −1</text>
  <rect x="578" y="242" width="108" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="632" y="269" text-anchor="middle" font-size="14" font-weight="bold" fill="#a14340" filter="url(#rough2)">NO</text>

  <!-- 行 5：sixty / codeforces -->
  <rect x="30" y="288" width="44" height="44" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="52" y="315" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="78" y="288" width="150" height="44" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="153" y="315" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">sixty</text>
  <rect x="232" y="288" width="150" height="44" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="307" y="315" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">codeforces</text>
  <rect x="386" y="288" width="188" height="44" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="480" y="307" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">|q| = 10 &gt; |p| = 5</text>
  <text x="480" y="324" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">多出的 t、y 无处安放</text>
  <rect x="578" y="288" width="108" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="632" y="315" text-anchor="middle" font-size="14" font-weight="bold" fill="#a14340" filter="url(#rough2)">NO</text>

  <rect x="30" y="346" width="656" height="94" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="370" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">第 2 组最容易被看漏：p 有 x2、i1、s2，q 有 x2、i2、s1</text>
  <text x="360" y="392" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">相减后 i 的差是 −1，分母里还剩一个 i，永远换不到 six</text>
  <text x="360" y="414" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">第 5 组则说明长度本身就是硬约束：只剩 5 个字符时，凑不出也不够凑</text>
  <text x="360" y="432" text-anchor="middle" font-size="11.5" fill="#a3762a" filter="url(#rough2)">差向量必须与 want = (s:1, i:1, x:1, 其余 0) 逐位完全一致</text>
</svg>
