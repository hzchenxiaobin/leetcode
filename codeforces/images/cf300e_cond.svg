<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="901"/>
    <feDisplacementMap in="SourceGraphic" scale="1.5"/></filter></defs>
  <rect width="700" height="300" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">n! 能被 Π aᵢ! 整除 ⟺ 每个素因子的指数都够</text>
  <path d="M 110 40 Q 350 46 590 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="76" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="12.5" fill="#22314a" filter="url(#rough2)">要求 v_p(n!) ≥ S_p = Σᵢ v_p(aᵢ!) 对所有素数 p 成立。</text>
  <text x="76" y="106" font-size="12.5" fill="#22314a" filter="url(#rough2)">每个条件是 n 的单调条件 ⇒ 最小 n = max_p n_p（n_p 是满足该 p 的最小 n）。</text>
  <text x="76" y="130" font-size="12.5" fill="#22314a" filter="url(#rough2)">答案用 64 位：k ≤ 10⁶、aᵢ ≤ 10⁷ ⇒ 可达 ~10¹³。</text>
  <g filter="url(#rough2)"><rect x="60" y="152" width="580" height="86" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="76" y="176" font-size="12.5" fill="#8a6015" filter="url(#rough2)">S_p 不能逐个数：Σᵢ v_p(aᵢ!) = Σⱼ Σᵢ ⌊aᵢ/pʲ⌋ = Σⱼ Σ_q suf[q·pʲ]，</text>
  <text x="76" y="200" font-size="12.5" fill="#8a6015" filter="url(#rough2)">其中 suf[t] = #{i : aᵢ ≥ t}（一次后缀和预处理）。</text>
  <text x="76" y="224" font-size="12.5" fill="#8a6015" filter="url(#rough2)">总代价 Σ_p maxA/(p−1) ≈ maxA·3.1 ≈ 3·10⁷（maxA = 10⁷）。</text>
  <g filter="url(#rough2)"><rect x="60" y="248" width="580" height="46" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="272" font-size="12.5" fill="#2f5223" filter="url(#rough2)">样例 1：a=[1000,1000] ⇒ 答案是 p=5 顶出来的 2000（1999 时 v₅ 差 2）</text>
  <text x="76" y="290" font-size="12.5" fill="#2f5223" filter="url(#rough2)">样例 2：a=[2] ⇒ S₂=1 ⇒ n₂=2 ✓</text>
</svg>
