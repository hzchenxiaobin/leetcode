<svg xmlns="http://www.w3.org/2000/svg" width="840" height="440" viewBox="0 0 840 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="440" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">倍增爬树：找"第 k 个可用点"</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">cnt(u) = a（不含）到 u（含）的可用数，随 u 上升单调不减</text>
  <g filter="url(#rough2)"><circle cx="300" cy="292" r="17" fill="#d7ecd0" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="300" y="297" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">a</text>
  <g filter="url(#rough2)"><line x1="300" y1="275" x2="300" y2="267" stroke="#999999" stroke-width="1.3"/></g>
  <g filter="url(#rough2)"><circle cx="300" cy="250" r="17" fill="#e8e8e8" fill-opacity="0.9" stroke="#999999" stroke-width="1.6"/></g>
  <text x="300" y="255" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">·</text>
  <g filter="url(#rough2)"><line x1="300" y1="233" x2="300" y2="225" stroke="#999999" stroke-width="1.3"/></g>
  <g filter="url(#rough2)"><circle cx="300" cy="208" r="17" fill="#d7ecd0" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="300" y="213" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">·</text>
  <g filter="url(#rough2)"><line x1="300" y1="191" x2="300" y2="183" stroke="#999999" stroke-width="1.3"/></g>
  <g filter="url(#rough2)"><circle cx="300" cy="166" r="17" fill="#e8e8e8" fill-opacity="0.9" stroke="#999999" stroke-width="1.6"/></g>
  <text x="300" y="171" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">l</text>
  <g filter="url(#rough2)"><line x1="300" y1="149" x2="300" y2="141" stroke="#999999" stroke-width="1.3"/></g>
  <g filter="url(#rough2)"><circle cx="300" cy="124" r="17" fill="#d7ecd0" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="300" y="129" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">·</text>
  <g filter="url(#rough2)"><line x1="300" y1="107" x2="300" y2="99" stroke="#999999" stroke-width="1.3"/></g>
  <g filter="url(#rough2)"><circle cx="300" cy="82" r="17" fill="#d7ecd0" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="300" y="87" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">·</text>
  <text x="274" y="296" text-anchor="end" font-size="10.5" fill="#777777" filter="url(#rough2)">cnt=0</text>
  <text x="274" y="212" text-anchor="end" font-size="10.5" fill="#3d6b2f" filter="url(#rough2)">cnt=1</text>
  <text x="274" y="170" text-anchor="end" font-size="10.5" fill="#3d6b2f" filter="url(#rough2)">cnt=2</text>
  <text x="274" y="86" text-anchor="end" font-size="10.5" fill="#3d6b2f" filter="url(#rough2)">cnt=3</text>
  <g filter="url(#rough2)"><rect x="430" y="96" width="340" height="150" rx="4" fill="#faf3ec" fill-opacity="0.85" stroke="#c8a48a" stroke-width="1.3"/></g>
  <text x="600" y="122" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a4b2a" filter="url(#rough2)">倍增做法（k = 2 为例）</text>
  <text x="600" y="150" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">从 a 出发，先试跳 2^j 层</text>
  <text x="600" y="174" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">若 cnt(目标) &lt; k 就跳过去</text>
  <text x="600" y="198" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">否则不动，减小 j</text>
  <text x="600" y="222" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">最后停在 cnt&lt;k 的最深祖先</text>
  <text x="600" y="244" text-anchor="middle" font-size="11.5" fill="#3d6b2f" filter="url(#rough2)">⇒ 其父亲就是第 k 个可用点</text>
  <text x="420" y="340" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">b 侧对称：第 k 个若落在 LCA→b 段，转成"从 b 往上数第 t 个"再爬一次</text>
  <text x="420" y="370" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">每次爬树 O(log n) 步，每步 O(log m) 查可持久化线段树 ⇒ O(log n log m)/查询</text>
  <g filter="url(#rough2)"><rect x="230" y="392" width="380" height="32" rx="4" fill="#f7fbf4" fill-opacity="0.85" stroke="#a8c99a" stroke-width="1.3"/></g>
  <text x="420" y="414" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3d6b2f" filter="url(#rough2)">总复杂度 O((n + m) log n log m)</text>
</svg>
