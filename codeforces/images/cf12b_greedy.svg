<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="79"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="330" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">B：先升序排序，再把第一个非零数位换到最前</text>
  <path d="M 120 42 Q 380 47 640 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <rect x="36" y="90" width="170" height="78" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="121" y="116" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">输入 n</text>
  <text x="121" y="146" text-anchor="middle" font-size="22" fill="#2b2b2b" font-family="'Courier New',monospace" filter="url(#rough2)">3310</text>

  <line x1="208" y1="129" x2="244" y2="129" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="226" y="118" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">排序</text>

  <rect x="248" y="90" width="170" height="78" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="333" y="116" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">数位升序</text>
  <text x="333" y="146" text-anchor="middle" font-size="22" fill="#8a6015" font-family="'Courier New',monospace" filter="url(#rough2)">0133</text>

  <line x1="420" y1="129" x2="456" y2="129" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="438" y="118" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">换首位</text>

  <rect x="460" y="90" width="170" height="78" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="545" y="116" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">最小无前导零排列</text>
  <text x="545" y="146" text-anchor="middle" font-size="22" fill="#2f5223" font-family="'Courier New',monospace" filter="url(#rough2)">1033</text>

  <text x="646" y="136" font-size="11" fill="#666" filter="url(#rough2)">= 答案</text>

  <text x="40" y="204" font-size="12" fill="#2b2b2b" filter="url(#rough2)">① 数位升序后，除了首位之外的部分已经是最小的；</text>
  <text x="40" y="228" font-size="12" fill="#2b2b2b" filter="url(#rough2)">② 首位不能为 0，所以只能换成「最小的非零数位」，其余顺序不变；</text>
  <text x="40" y="252" font-size="12" fill="#2b2b2b" filter="url(#rough2)">③ 若根本没有非零数位（只能 n = 0），排列仍是 "0"。</text>

  <rect x="40" y="272" width="430" height="44" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="52" y="299" font-size="12" fill="#2f4a66" filter="url(#rough2)">0 放在最前面会让整数位数变少 → 必须避开</text>

  <rect x="492" y="272" width="228" height="44" rx="10" fill="#fff3cd" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="504" y="299" font-size="12" fill="#8a6015" filter="url(#rough2)">n = 0 时答案就是 "0"</text>
</svg>
