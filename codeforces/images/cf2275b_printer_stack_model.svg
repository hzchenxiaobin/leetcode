<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold"
        filter="url(#rough2)">打印机内存 = 后进先出栈（LIFO）</text>
  <text x="320" y="50" text-anchor="middle" font-size="11" fill="#888"
        filter="url(#rough2)">第 i 条命令恰好对应文档 i；栈顶是最后被扫描进来的文档</text>

  <rect x="25" y="70" width="360" height="248" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="42" y="92" font-size="12" fill="#3a4a66" font-weight="bold"
        filter="url(#rough2)">三条命令的语义</text>

  <rect x="42" y="106" width="26" height="24" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="55" y="123" text-anchor="middle" font-size="13" fill="#8a6a20"
        font-weight="bold" filter="url(#rough2)">1</text>
  <text x="80" y="123" font-size="11" fill="#333" filter="url(#rough2)">扫描：文档 i 压入内存，成为栈顶</text>

  <rect x="42" y="144" width="26" height="24" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="55" y="161" text-anchor="middle" font-size="13" fill="#8a3a3a"
        font-weight="bold" filter="url(#rough2)">2</text>
  <text x="80" y="155" font-size="11" fill="#333" filter="url(#rough2)">内存非空 → 弹出栈顶并打印它</text>
  <text x="80" y="177" font-size="11" fill="#333" filter="url(#rough2)">内存为空 → 直接打印文档 i 自己</text>

  <rect x="42" y="196" width="26" height="24" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="55" y="213" text-anchor="middle" font-size="13" fill="#3a5a30"
        font-weight="bold" filter="url(#rough2)">3</text>
  <text x="80" y="213" font-size="11" fill="#333" filter="url(#rough2)">快印：打印文档 i，内存一个元素都不动</text>

  <rect x="42" y="236" width="326" height="64" fill="#ffffff" stroke="#8899bb"
        stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="56" y="257" font-size="10" fill="#555" filter="url(#rough2)">最终仍在内存里的文档 + 命令 2 弹栈时“被跳过”的文档 i</text>
  <text x="56" y="276" font-size="10" fill="#555" filter="url(#rough2)">= 全部未打印文档；关键：命令 2 不把文档 i 放进内存</text>
  <text x="56" y="293" font-size="10" fill="#999" filter="url(#rough2)">每份文档最多进内存一次、最多出内存一次，故扫描一遍即可</text>

  <text x="525" y="92" text-anchor="middle" font-size="11" fill="#3a4a66"
        font-weight="bold" filter="url(#rough2)">内存（栈）</text>

  <rect x="450" y="146" width="150" height="40" fill="#fff8e1" stroke="#d6a040"
        stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="525" y="171" text-anchor="middle" font-size="13" fill="#8a6a20"
        filter="url(#rough2)">9 ← 栈顶</text>
  <rect x="450" y="192" width="150" height="40" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="525" y="217" text-anchor="middle" font-size="13" fill="#3a4a66"
        filter="url(#rough2)">3</text>
  <rect x="450" y="238" width="150" height="40" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="525" y="263" text-anchor="middle" font-size="13" fill="#3a4a66"
        filter="url(#rough2)">7</text>
  <rect x="450" y="284" width="150" height="40" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="525" y="309" text-anchor="middle" font-size="13" fill="#3a5a30"
        filter="url(#rough2)">1 ← 栈底</text>

  <text x="525" y="128" text-anchor="middle" font-size="9.5" fill="#b85450"
        filter="url(#rough2)">橙色 = 命令 2 下一个要弹出的对象</text>

  <text x="320" y="344" text-anchor="middle" font-size="10" fill="#999"
        filter="url(#rough2)">栈底是最早扫描的文档，最晚才会被命令 2 取走；栈空时命令 2 才“退而求其次”打印自己的文档 i</text>
  <text x="320" y="366" text-anchor="middle" font-size="10" fill="#999"
        filter="url(#rough2)">因此只需一个栈 + 一个"已打印"标记数组，全程 O(n)</text>
</svg>
