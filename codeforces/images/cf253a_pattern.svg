<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="340" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">谁的人多，谁就排在两端</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">把少的一方塞进多的一方之间的空隙里，能拿到的“相邻不同”对数最多</text>
  <text x="120" y="110" text-anchor="start" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">n &gt; m</text>
  <g filter="url(#rough2)"><rect x="150" y="92" width="48" height="42" rx="4" fill="#cfe0f0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="174.0" y="118.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">B</text>
  <g filter="url(#rough2)"><rect x="208" y="92" width="48" height="42" rx="4" fill="#f6d9d7" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="232.0" y="118.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">G</text>
  <g filter="url(#rough2)"><rect x="266" y="92" width="48" height="42" rx="4" fill="#cfe0f0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="290.0" y="118.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">B</text>
  <g filter="url(#rough2)"><rect x="324" y="92" width="48" height="42" rx="4" fill="#f6d9d7" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="348.0" y="118.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">G</text>
  <g filter="url(#rough2)"><rect x="382" y="92" width="48" height="42" rx="4" fill="#cfe0f0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="406.0" y="118.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">B</text>
  <g filter="url(#rough2)"><rect x="440" y="92" width="48" height="42" rx="4" fill="#cfe0f0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="464.0" y="118.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">B</text>
  <text x="130" y="165" text-anchor="start" font-size="12.5" fill="#555555" filter="url(#rough2)">n=4, m=2：B 全用上，再把 2 个 G 塞进前两个空档</text>
  <text x="120" y="240" text-anchor="start" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">n ≤ m</text>
  <g filter="url(#rough2)"><rect x="150" y="222" width="48" height="42" rx="4" fill="#f6d9d7" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="174.0" y="248.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">G</text>
  <g filter="url(#rough2)"><rect x="208" y="222" width="48" height="42" rx="4" fill="#cfe0f0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="232.0" y="248.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">B</text>
  <g filter="url(#rough2)"><rect x="266" y="222" width="48" height="42" rx="4" fill="#f6d9d7" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="290.0" y="248.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">G</text>
  <g filter="url(#rough2)"><rect x="324" y="222" width="48" height="42" rx="4" fill="#cfe0f0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="348.0" y="248.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">B</text>
  <g filter="url(#rough2)"><rect x="382" y="222" width="48" height="42" rx="4" fill="#f6d9d7" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="406.0" y="248.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">G</text>
  <g filter="url(#rough2)"><rect x="440" y="222" width="48" height="42" rx="4" fill="#cfe0f0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="464.0" y="248.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">B</text>
  <text x="130" y="295" text-anchor="start" font-size="12.5" fill="#555555" filter="url(#rough2)">n=3, m=3：以 G 开头，交替到底，得到 5 对相邻不同</text>
  <text x="770" y="240" text-anchor="middle" font-size="12.5" fill="#b05a5a" filter="url(#rough2)">最少一方</text>
  <text x="770" y="264" text-anchor="middle" font-size="12.5" fill="#b05a5a" filter="url(#rough2)">决定开头</text>
</svg>
