<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>

  <rect width="760" height="430" fill="#fafafa"/>

  <text x="380" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：先看奶酪富余量，再看香肠够不够分</text>
  <path d="M 150 44 Q 380 51 610 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 表头 -->
  <rect x="32" y="62" width="696" height="48" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="104" y="92" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">(a, b)</text>
  <text x="236" y="92" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">a − b</text>
  <text x="336" y="92" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">b</text>
  <text x="433" y="92" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">min(a−b, b)</text>
  <text x="500" y="92" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">输出与一组可行构造</text>

  <!-- 行 1：(6,4) -->
  <rect x="32" y="110" width="696" height="52" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="104" y="144" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">(6, 4)</text>
  <text x="236" y="144" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="336" y="144" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="433" y="144" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">2</text>
  <text x="500" y="144" font-size="12" fill="#3c5e2e" filter="url(#rough2)">2 ✓  两块：(4, 3) + (2, 1)</text>

  <!-- 行 2：(5,1) -->
  <rect x="32" y="162" width="696" height="52" fill="#f3f6f9" stroke="#c9d3dc" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="104" y="196" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">(5, 1)</text>
  <text x="236" y="196" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="336" y="196" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="433" y="196" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">1</text>
  <text x="500" y="196" font-size="12" fill="#3c5e2e" filter="url(#rough2)">1 ✓  一块：(5, 1)</text>

  <!-- 行 3：(4,5) 无解 -->
  <rect x="32" y="214" width="696" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="104" y="248" text-anchor="middle" font-size="13" fill="#a14340" filter="url(#rough2)">(4, 5)</text>
  <text x="236" y="248" text-anchor="middle" font-size="13" fill="#a14340" filter="url(#rough2)">−1</text>
  <text x="336" y="248" text-anchor="middle" font-size="13" fill="#a14340" filter="url(#rough2)">5</text>
  <text x="433" y="248" text-anchor="middle" font-size="13" fill="#a14340" filter="url(#rough2)">—</text>
  <text x="500" y="248" font-size="12" fill="#a14340" filter="url(#rough2)">−1 ✗  上界 a − b ≤ 0，无解</text>

  <!-- 行 4：(7,2) 自造 -->
  <rect x="32" y="266" width="696" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="104" y="300" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">(7, 2) ★</text>
  <text x="236" y="300" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">5</text>
  <text x="336" y="300" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">2</text>
  <text x="433" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">2</text>
  <text x="500" y="300" font-size="12" fill="#8a6015" filter="url(#rough2)">2 ✓  两块：(5, 1) + (2, 1)</text>

  <!-- 行 5：(100,99) 自造 -->
  <rect x="32" y="318" width="696" height="52" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="104" y="352" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">(100, 99) ★</text>
  <text x="236" y="352" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="336" y="352" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">99</text>
  <text x="433" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">1</text>
  <text x="500" y="352" font-size="12" fill="#3c5e2e" filter="url(#rough2)">1 ✓  一块：(100, 99)</text>

  <!-- 竖分隔线 -->
  <path d="M 176 62 L 176 370" stroke="#9fb0c0" stroke-width="1.1" fill="none" filter="url(#rough2)"/>
  <path d="M 296 62 L 296 370" stroke="#9fb0c0" stroke-width="1.1" fill="none" filter="url(#rough2)"/>
  <path d="M 376 62 L 376 370" stroke="#9fb0c0" stroke-width="1.1" fill="none" filter="url(#rough2)"/>
  <path d="M 490 62 L 490 370" stroke="#9fb0c0" stroke-width="1.1" fill="none" filter="url(#rough2)"/>

  <text x="380" y="398" text-anchor="middle" font-size="12" fill="#66788c" filter="url(#rough2)">★ 为自造用例；红色行是「否」分支，绿色 / 橙色行是 min 上界被构造取到的情形</text>
  <text x="380" y="418" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">(100, 99) 说明 a − b = 1 时答案只能是 1：一块里塞 100 片奶酪、99 片香肠也合法</text>
</svg>
