<svg xmlns="http://www.w3.org/2000/svg" width="840" height="320" viewBox="0 0 840 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="320" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">数位和上界与开方精度</text>
  <text x="200" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">x ≤ 10⁹</text>
  <text x="200" y="130" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">最大数位和 = 81</text>
  <text x="200" y="160" text-anchor="middle" font-size="11" fill="#777777" filter="url(#rough2)">(x = 999999999)</text>
  <text x="560" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#a0522d" filter="url(#rough2)">D = s² + 4n</text>
  <text x="560" y="130" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">≤ 81² + 4·10¹⁸ &lt; 4.1·10¹⁸</text>
  <text x="560" y="160" text-anchor="middle" font-size="11" fill="#777777" filter="url(#rough2)">long long 够用</text>
  <g filter="url(#rough2)"><line x1="300" y1="130" x2="460" y2="130" stroke="#888888" stroke-width="1.4" stroke-dasharray="5 3"/></g>
  <g filter="url(#rough2)"><rect x="200" y="200" width="440" height="44" rx="4" fill="#fdf6f4" fill-opacity="0.85" stroke="#d8a89a" stroke-width="1.3"/></g>
  <text x="420" y="228" text-anchor="middle" font-size="11.5" fill="#8a4b2a" filter="url(#rough2)">浮点 sqrt 有误差 ⇒ 在 r−2..r+2 内找平方数</text>
  <text x="420" y="280" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">样例：n=2 → 1；n=110 → 10；n=4 → -1</text>
</svg>
