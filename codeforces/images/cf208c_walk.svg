<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="350" fill="#fafafa"/>
  <text x="360.0" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">208C：样例一的图与平均值</text>
  <path d="M 144.00 46 Q 360.0 52 576.00 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="72" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">样例一：1–2–4 与 1–3–4 两条最短路，各长 2。</text>
  <line x1="150" y1="110" x2="330" y2="110" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="330" y1="110" x2="510" y2="110" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="150" y1="110" x2="330" y2="220" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="330" y1="220" x2="510" y2="110" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="150" cy="110" r="18" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="150" y="115" text-anchor="middle" font-size="12" fill="#33506e" filter="url(#rough2)">1</text>
  <circle cx="330" cy="110" r="18" fill="#cfe3c8" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="330" y="115" text-anchor="middle" font-size="12" fill="#33506e" filter="url(#rough2)">2</text>
  <circle cx="510" cy="110" r="18" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="510" y="115" text-anchor="middle" font-size="12" fill="#33506e" filter="url(#rough2)">4</text>
  <circle cx="330" cy="220" r="18" fill="#cfe3c8" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="330" y="225" text-anchor="middle" font-size="12" fill="#33506e" filter="url(#rough2)">3</text>
  <rect x="60" y="270" width="620" height="62" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="287" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">v=1 或 v=4：每条最短路各有 1 条边与它相连 ⇒ 平均值 1。</text>
  <text x="74" y="308" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">v=2（或 3）：一条路贡献 2 条、另一条 0 条 ⇒ (2+0)/2 = 1。所以最大是 1.0。</text>
</svg>
