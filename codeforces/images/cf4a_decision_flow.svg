<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="a4farr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="470" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">先判奇偶，再判够不够大</text>
  <path d="M 170 44 Q 380 50 590 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 起点 -->
  <rect x="280" y="58" width="200" height="44" rx="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="86" text-anchor="middle" font-size="13.5" fill="#2f4a66" filter="url(#rough2)">读入 w（1 ≤ w ≤ 100）</text>
  <line x1="380" y1="102" x2="380" y2="120" stroke="#446688" stroke-width="1.7" marker-end="url(#a4farr)" filter="url(#rough2)"/>

  <!-- 判定 1 -->
  <polygon points="380,124 490,174 380,224 270,174" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">w 是偶数？</text>

  <line x1="490" y1="174" x2="584" y2="174" stroke="#446688" stroke-width="1.7" marker-end="url(#a4farr)" filter="url(#rough2)"/>
  <text x="528" y="166" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="590" y="150" width="140" height="48" rx="10" fill="#fde8e8" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="660" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a3b36" filter="url(#rough2)">输出 NO</text>
  <text x="600" y="216" font-size="11" fill="#8a3b36" filter="url(#rough2)">奇数不能拆成两偶</text>

  <line x1="380" y1="224" x2="380" y2="260" stroke="#446688" stroke-width="1.7" marker-end="url(#a4farr)" filter="url(#rough2)"/>
  <text x="394" y="248" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 判定 2 -->
  <polygon points="380,264 500,314 380,364 260,314" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="320" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">w ≥ 4？</text>

  <line x1="260" y1="314" x2="166" y2="314" stroke="#446688" stroke-width="1.7" marker-end="url(#a4farr)" filter="url(#rough2)"/>
  <text x="212" y="306" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="20" y="290" width="140" height="48" rx="10" fill="#fde8e8" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="90" y="320" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a3b36" filter="url(#rough2)">输出 NO</text>
  <text x="30" y="356" font-size="11" fill="#8a3b36" filter="url(#rough2)">w = 2 时两块只能 1 + 1</text>

  <line x1="380" y1="364" x2="380" y2="398" stroke="#446688" stroke-width="1.7" marker-end="url(#a4farr)" filter="url(#rough2)"/>
  <text x="394" y="386" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="310" y="402" width="140" height="48" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="432" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5223" filter="url(#rough2)">输出 YES</text>

  <text x="470" y="410" font-size="12" fill="#2b2b2b" filter="url(#rough2)">例：w = 8 → 偶且 ≥ 4 → YES</text>
  <text x="470" y="434" font-size="12" fill="#2b2b2b" filter="url(#rough2)">例：w = 2 → 偶但 &lt; 4 → NO</text>
</svg>
