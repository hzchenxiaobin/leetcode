<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 425" width="800" height="425" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6" />
    </filter>
  </defs>
  <rect width="800" height="425" fill="#fafafa" filter="url(#rough2)" />

  <text x="400" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2 演算：a = [5,3,2,5,1,7,9,9]，答案 1 次</text>
  <text x="400" y="52" text-anchor="middle" font-size="11.5" fill="#7a7a7a" filter="url(#rough2)">dp[i] = 覆盖前 i 个数的最少操作数；g₁ 是左边最近的、值严格大于 a_r 的位置（没有记 0）</text>

  <rect x="70" y="64" width="670" height="30" fill="#eef2f7" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" />
  <path d="M250,64 L250,94" fill="none" stroke="#9aa9bb" stroke-width="1.2" filter="url(#rough2)" />
  <path d="M350,64 L350,94" fill="none" stroke="#9aa9bb" stroke-width="1.2" filter="url(#rough2)" />
  <path d="M450,64 L450,94" fill="none" stroke="#9aa9bb" stroke-width="1.2" filter="url(#rough2)" />
  <path d="M740,64 L740,94" fill="none" stroke="#9aa9bb" stroke-width="1.2" filter="url(#rough2)" />
  <text x="105" y="84" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33517a" filter="url(#rough2)">r</text>
  <text x="195" y="84" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33517a" filter="url(#rough2)">a_r</text>
  <text x="300" y="84" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33517a" filter="url(#rough2)">g₁</text>
  <text x="400" y="84" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33517a" filter="url(#rough2)">dp[r]</text>
  <text x="460" y="84" text-anchor="start" font-size="11.5" font-weight="bold" fill="#33517a" filter="url(#rough2)">本步用到的转移（段的左端 l）</text>
  <rect x="70" y="96" width="670" height="30" fill="#fdfdfd" stroke="none" filter="url(#rough2)" />
  <rect x="350" y="96" width="100" height="30" fill="#f0f0f0" stroke="#999999" stroke-width="1.6" filter="url(#rough2)" />
  <path d="M70,126 L740,126" fill="none" stroke="#c8d2dd" stroke-width="1.1" filter="url(#rough2)" />
  <text x="105" y="116" text-anchor="middle" font-size="12.5" fill="#3a3a3a" filter="url(#rough2)">1</text>
  <text x="195" y="116" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3a3a3a" filter="url(#rough2)">5</text>
  <text x="300" y="116" text-anchor="middle" font-size="12.5" fill="#7a5a1e" filter="url(#rough2)">—</text>
  <text x="400" y="117" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#999999" filter="url(#rough2)">∞</text>
  <text x="460" y="116" font-size="10.5" fill="#4a4a4a" filter="url(#rough2)">前缀长度 1，还不成段</text>
  <rect x="70" y="128" width="670" height="30" fill="#f7f9fb" stroke="none" filter="url(#rough2)" />
  <rect x="350" y="128" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)" />
  <path d="M70,158 L740,158" fill="none" stroke="#c8d2dd" stroke-width="1.1" filter="url(#rough2)" />
  <text x="105" y="148" text-anchor="middle" font-size="12.5" fill="#3a3a3a" filter="url(#rough2)">2</text>
  <text x="195" y="148" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3a3a3a" filter="url(#rough2)">3</text>
  <text x="300" y="148" text-anchor="middle" font-size="12.5" fill="#7a5a1e" filter="url(#rough2)">1</text>
  <text x="400" y="149" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <text x="460" y="148" font-size="10.5" fill="#4a4a4a" filter="url(#rough2)">情形 A，l=1：a₁=5 是最大值 → 改 a₂</text>
  <rect x="70" y="160" width="670" height="30" fill="#fdfdfd" stroke="none" filter="url(#rough2)" />
  <rect x="350" y="160" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)" />
  <path d="M70,190 L740,190" fill="none" stroke="#c8d2dd" stroke-width="1.1" filter="url(#rough2)" />
  <text x="105" y="180" text-anchor="middle" font-size="12.5" fill="#3a3a3a" filter="url(#rough2)">3</text>
  <text x="195" y="180" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3a3a3a" filter="url(#rough2)">2</text>
  <text x="300" y="180" text-anchor="middle" font-size="12.5" fill="#7a5a1e" filter="url(#rough2)">2</text>
  <text x="400" y="181" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <text x="460" y="180" font-size="10.5" fill="#4a4a4a" filter="url(#rough2)">情形 A，l=1 → 改 a₃ 为 5</text>
  <rect x="70" y="192" width="670" height="30" fill="#f7f9fb" stroke="none" filter="url(#rough2)" />
  <rect x="350" y="192" width="100" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)" />
  <path d="M70,222 L740,222" fill="none" stroke="#c8d2dd" stroke-width="1.1" filter="url(#rough2)" />
  <text x="105" y="212" text-anchor="middle" font-size="12.5" fill="#3a3a3a" filter="url(#rough2)">4</text>
  <text x="195" y="212" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3a3a3a" filter="url(#rough2)">5</text>
  <text x="300" y="212" text-anchor="middle" font-size="12.5" fill="#7a5a1e" filter="url(#rough2)">0</text>
  <text x="400" y="213" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <text x="460" y="212" font-size="10.5" fill="#4a4a4a" filter="url(#rough2)">代价 0，l=1：a₁=a₄=5 → 段 [1,4]</text>
  <rect x="70" y="224" width="670" height="30" fill="#fdfdfd" stroke="none" filter="url(#rough2)" />
  <rect x="350" y="224" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)" />
  <path d="M70,254 L740,254" fill="none" stroke="#c8d2dd" stroke-width="1.1" filter="url(#rough2)" />
  <text x="105" y="244" text-anchor="middle" font-size="12.5" fill="#3a3a3a" filter="url(#rough2)">5</text>
  <text x="195" y="244" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3a3a3a" filter="url(#rough2)">1</text>
  <text x="300" y="244" text-anchor="middle" font-size="12.5" fill="#7a5a1e" filter="url(#rough2)">4</text>
  <text x="400" y="245" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <text x="460" y="244" font-size="10.5" fill="#4a4a4a" filter="url(#rough2)">情形 A，l=4 → 改 a₅ 为 5</text>
  <rect x="70" y="256" width="670" height="30" fill="#f7f9fb" stroke="none" filter="url(#rough2)" />
  <rect x="350" y="256" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)" />
  <path d="M70,286 L740,286" fill="none" stroke="#c8d2dd" stroke-width="1.1" filter="url(#rough2)" />
  <text x="105" y="276" text-anchor="middle" font-size="12.5" fill="#3a3a3a" filter="url(#rough2)">6</text>
  <text x="195" y="276" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3a3a3a" filter="url(#rough2)">7</text>
  <text x="300" y="276" text-anchor="middle" font-size="12.5" fill="#7a5a1e" filter="url(#rough2)">0</text>
  <text x="400" y="277" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <text x="460" y="276" font-size="10.5" fill="#4a4a4a" filter="url(#rough2)">情形 B，l=1：改 a₁ 为 7 → 段 [1,6]</text>
  <rect x="70" y="288" width="670" height="30" fill="#fdfdfd" stroke="none" filter="url(#rough2)" />
  <rect x="350" y="288" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)" />
  <path d="M70,318 L740,318" fill="none" stroke="#c8d2dd" stroke-width="1.1" filter="url(#rough2)" />
  <text x="105" y="308" text-anchor="middle" font-size="12.5" fill="#3a3a3a" filter="url(#rough2)">7</text>
  <text x="195" y="308" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3a3a3a" filter="url(#rough2)">9</text>
  <text x="300" y="308" text-anchor="middle" font-size="12.5" fill="#7a5a1e" filter="url(#rough2)">0</text>
  <text x="400" y="309" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <text x="460" y="308" font-size="10.5" fill="#4a4a4a" filter="url(#rough2)">情形 B，l=1 → 段 [1,7]</text>
  <rect x="70" y="320" width="670" height="30" fill="#f7f9fb" stroke="none" filter="url(#rough2)" />
  <rect x="350" y="320" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)" />
  <path d="M70,350 L740,350" fill="none" stroke="#c8d2dd" stroke-width="1.1" filter="url(#rough2)" />
  <text x="105" y="340" text-anchor="middle" font-size="12.5" fill="#3a3a3a" filter="url(#rough2)">8</text>
  <text x="195" y="340" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3a3a3a" filter="url(#rough2)">9</text>
  <text x="300" y="340" text-anchor="middle" font-size="12.5" fill="#7a5a1e" filter="url(#rough2)">0</text>
  <text x="400" y="341" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <text x="460" y="340" font-size="10.5" fill="#4a4a4a" filter="url(#rough2)">代价 0，l=7（dp[6]=1）→ 段 [7,8]</text>
  <path d="M140,96 L140,350" fill="none" stroke="#c8d2dd" stroke-width="1.1" filter="url(#rough2)" />
  <path d="M250,96 L250,350" fill="none" stroke="#c8d2dd" stroke-width="1.1" filter="url(#rough2)" />
  <path d="M350,96 L350,350" fill="none" stroke="#c8d2dd" stroke-width="1.1" filter="url(#rough2)" />
  <path d="M450,96 L450,350" fill="none" stroke="#c8d2dd" stroke-width="1.1" filter="url(#rough2)" />
  <path d="M70,96 L70,350" fill="none" stroke="#9aa9bb" stroke-width="1.4" filter="url(#rough2)" />
  <path d="M740,96 L740,350" fill="none" stroke="#9aa9bb" stroke-width="1.4" filter="url(#rough2)" />

  <text x="400" y="382" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">g₁ 把「段内是否还有比 a_r 更大的数」变成一个边界：代价 0 要求同值出现的位置落在 (g₁, r) 内</text>
  <text x="400" y="404" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">答案 dp[8]=1：把 a₁ 改成 7 后，段 [1,6] 与段 [7,8] 恰好覆盖全部下标</text>
</svg>