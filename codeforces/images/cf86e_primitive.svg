<svg xmlns="http://www.w3.org/2000/svg" width="750" height="420" viewBox="0 0 750 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="151"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="750" height="420" fill="#fafafa"/>

  <text x="375" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">判据：x 的阶恰为 m = 2^k − 1</text>
  <path d="M 150 39 Q 375 45 600 39" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="30" y="54" width="690" height="52" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="46" y="78" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">顺序试 c（t = 1, 3, 5, …，让常数项 c_k = 1），对每个候选 f 做两件事：</text>
  <text x="46" y="100" text-anchor="start" font-size="12" fill="#5b5b5b" filter="url(#rough2)">多项式乘法用“移位 + 条件异或 f”实现，O(k) 一次，快速幂 O(k log m)</text>
  <rect x="30" y="116" width="690" height="50" rx="8" fill="#e9f4ec" stroke="#3f6b4a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="46" y="138" text-anchor="start" font-size="12.5" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">① 先验证 x^m ≡ 1 (mod f)</text>
  <text x="46" y="157" text-anchor="start" font-size="11.5" fill="#3f6b4a" filter="url(#rough2)">若不等，说明 m 根本不是周期，直接换下一个候选</text>
  <rect x="30" y="172" width="690" height="50" rx="8" fill="#fdf3e3" stroke="#8a6015" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="46" y="194" text-anchor="start" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">② 再对 m 的每个素因子 q 验证 x^(m/q) ≢ 1 (mod f)</text>
  <text x="46" y="213" text-anchor="start" font-size="11.5" fill="#8a6015" filter="url(#rough2)">全部成立 ⇒ x 的阶恰为 m（阶整除 m，且不被任何 m/q 整除）</text>
  <rect x="30" y="228" width="690" height="50" rx="8" fill="#f7ecec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="46" y="250" text-anchor="start" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">③ 于是 f 本原（x 的阶 = |R|−1 ⇒ 所有非零元都是 x 的幂 ⇒ R 是域）</text>
  <text x="46" y="269" text-anchor="start" font-size="11.5" fill="#b85450" filter="url(#rough2)">输出 c_i = f 的系数，初值取非零的 (1,0,…,0)</text>
  <rect x="30" y="296" width="690" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="46" y="320" text-anchor="start" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">为什么一定找得到：每个次数 k ≥ 1 都存在本原多项式（φ(2^k−1)/k 个），</text>
  <text x="46" y="342" text-anchor="start" font-size="12" fill="#7a5a1b" filter="url(#rough2)">实测按 t = 1,3,5,… 顺序试，k ≤ 50 最多 152 次就能命中，永不输出 −1。</text>
  <text x="30" y="380" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">注意：只有“阶 = m”才够。仅保证 x^m ≡ 1 得到的是“周期整除 m”，可能是更小的周期。</text>
  <text x="30" y="402" text-anchor="start" font-size="12" fill="#5b5b5b" filter="url(#rough2)">本题输出任意合法解即可，所以初值随便取一个非零 k 元组都行。</text>
</svg>
