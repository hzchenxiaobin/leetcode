<svg xmlns="http://www.w3.org/2000/svg" width="770" height="360" viewBox="0 0 770 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="770" height="360" fill="#fafafa"/>
  <text x="385.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">拼接处的窗口：跨过交界的出现，只可能落在两侧各 L−1 个字符里</text>
  <path d="M 107.75000000000017 46 Q 385.0 52 662.2499999999998 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="46.0" y="120.0" width="340.0" height="76.0" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="386.0" y="120.0" width="340.0" height="76.0" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="216.0" y="108.0" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">f_{k−1}</text>
  <text x="556.0" y="108.0" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">f_{k−2}</text>
  <rect x="300.0" y="120.0" width="86.0" height="76.0" rx="6" fill="#fff3d6" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="386.0" y="120.0" width="86.0" height="76.0" rx="6" fill="#fff3d6" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="300.0" y="168.0" text-anchor="middle" font-size="10.8" font-weight="bold" fill="#8a6015" filter="url(#rough2)">后缀 L−1</text>
  <text x="472.0" y="168.0" text-anchor="middle" font-size="10.8" font-weight="bold" fill="#8a6015" filter="url(#rough2)">前缀 L−1</text>
  <path d="M 386.0 96.0 L 386.0 216.0" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="388.0" y="92.0" text-anchor="start" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">交界</text>
  <rect x="348.0" y="138.0" width="92.0" height="22.0" rx="5" fill="#fdf0ef" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="394.0" y="154.0" text-anchor="middle" font-size="10.2" fill="#8a3a36" filter="url(#rough2)">s 横跨交界</text>
  <path d="M 300 226 L 300 236 L 472 236 L 472 226" stroke="#6a5b8c" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="386.0" y="256.0" text-anchor="middle" font-size="11.4" font-weight="bold" fill="#6a5b8c" filter="url(#rough2)">窗口 = suf_{L−1}(f_{k−1}) + pre_{L−1}(f_{k−2})，长 2L−2</text>
  <rect x="46.0" y="280.0" width="680.0" height="60.0" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="60.0" y="304.0" text-anchor="start" font-size="11.4" font-weight="bold" fill="#8a6015" filter="url(#rough2)">cross_k = 窗口中起点 ≤ L−2 且终点 ≥ L−1 的匹配数；</text>
  <text x="60.0" y="326.0" text-anchor="start" font-size="11.4" fill="#8a6015" filter="url(#rough2)">完全落在 f_{k−1} 或 f_{k−2} 内部的匹配已在 ans_{k−1}、ans_{k−2} 里数过，不会重复。</text>
</svg>
