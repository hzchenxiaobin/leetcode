<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="895"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="330" fill="#fafafa"/>
  <text x="360.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1 的嵌套图（箭头 = 被 pack 进）</text>
  <path d="M 115.2 42 Q 360.0 48 604.8 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="360.0" y="316" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">子控件算完后父盒子才能算尺寸</text>
  <rect x="70" y="210" width="110" height="44" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="125" y="238" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">me 50×40</text>
  <rect x="220" y="210" width="130" height="44" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="285" y="238" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">brother 30×60</text>
  <rect x="210" y="130" width="150" height="44" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="285" y="158" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">father 80×60</text>
  <rect x="430" y="130" width="190" height="44" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="525" y="158" text-anchor="middle" font-size="12" fill="#335478" filter="url(#rough2)">uncle 100×20</text>
  <rect x="220" y="60" width="200" height="44" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="88" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">grandpa 120×120</text>
  <text x="190" y="196" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">HBox</text>
  <text x="300" y="118" text-anchor="middle" font-size="10.5" fill="#335478" filter="url(#rough2)">VBox border 10</text>
  <rect x="70" y="276" width="580" height="38" rx="8" fill="#f4f4f0" stroke="#8a8a8a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="360" y="300" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">多个父控件可以共享同一个子控件；空盒子尺寸恒为 0×0</text>
</svg>
