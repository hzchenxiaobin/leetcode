<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="223"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="760" height="320" fill="#fafafa"/>
  <text x="390" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">预处理前缀/后缀最值，O(n) 判定每个“中间元素”</text>
  <path d="M 120 40 Q 390 46 660 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="90" y="80" width="100" height="46" rx="8" fill="#eef4fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="140" y="110" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">67</text>
  <text x="140" y="146" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">a[0]</text>
  <rect x="220" y="80" width="100" height="46" rx="8" fill="#eef4fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="270" y="110" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">499</text>
  <text x="270" y="146" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">a[1]</text>
  <rect x="350" y="80" width="100" height="46" rx="8" fill="#eef4fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="400" y="110" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">600</text>
  <text x="400" y="146" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">a[2]</text>
  <rect x="480" y="80" width="100" height="46" rx="8" fill="#eef4fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="530" y="110" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">42</text>
  <text x="530" y="146" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">a[3]</text>
  <rect x="610" y="80" width="100" height="46" rx="8" fill="#eef4fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="660" y="110" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">23</text>
  <text x="660" y="146" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">a[4]</text>
  <text x="90" y="196" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">Lmin[j] = 左边最小值；Rmin[j] = 右边最小值</text>
  <text x="90" y="222" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">若 Lmin[j] &lt; a[j] 且 Rmin[j] &lt; a[j] → 谷底；对称地判断尖峰。</text>
  <text x="90" y="262" font-size="12" fill="#2b2b2b" filter="url(#rough2)">样例 1：j=1（值 499），左边最小 67 &lt; 499，右边最小 23 &lt; 499 → 输出 3 个下标。</text>
  <text x="90" y="292" font-size="11.5" fill="#555555" filter="url(#rough2)">全部 j 都不满足 ⇒ 序列单调 ⇒ 输出 0。</text>

</svg>
