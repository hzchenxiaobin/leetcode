<svg xmlns="http://www.w3.org/2000/svg" width="700" height="230" viewBox="0 0 700 230"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="723"/>
    <feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></defs>
  <rect width="700" height="230" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">实现</text>
  <path d="M 210 40 Q 350 46 490 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="48" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="88" font-size="13" fill="#22314a" filter="url(#rough2)">读入数组，求最小值 m。</text>
  <g filter="url(#rough2)"><rect x="60" y="116" width="580" height="48" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="146" font-size="13" fill="#2f5223" filter="url(#rough2)">扫一遍：若存在 aᵢ % m ≠ 0 ⇒ 输出 −1；否则输出 m。</text>
  <g filter="url(#rough2)"><rect x="60" y="174" width="580" height="36" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="76" y="197" font-size="12.5" fill="#8a6015" filter="url(#rough2)">O(n)；多解时输出最小值一定合法。</text>
</svg>
