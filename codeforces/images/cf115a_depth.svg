<svg xmlns="http://www.w3.org/2000/svg" width="700" height="340" viewBox="0 0 700 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1165"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="700" height="340" fill="#fafafa"/>
  <text x="350.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">森林与深度</text>
  <path d="M 112.0 42 Q 350.0 48 588.0 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="350.0" y="326" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">答案 = 最大深度：3</text>
  <circle cx="350" cy="70" r="24" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="76" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5223" filter="url(#rough2)">1</text>
  <circle cx="220" cy="150" r="24" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="156" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5223" filter="url(#rough2)">2</text>
  <circle cx="480" cy="150" r="24" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="480" y="156" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5223" filter="url(#rough2)">4</text>
  <circle cx="600" cy="70" r="24" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="600" y="76" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5223" filter="url(#rough2)">5</text>
  <circle cx="150" cy="240" r="24" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="246" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5223" filter="url(#rough2)">3</text>
  <line x1="350.0" y1="94.0" x2="220.0" y2="124.0" stroke="#5a7fb0" stroke-width="1.6" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <line x1="350.0" y1="94.0" x2="480.0" y2="124.0" stroke="#5a7fb0" stroke-width="1.6" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <line x1="220.0" y1="174.0" x2="150.0" y2="214.0" stroke="#5a7fb0" stroke-width="1.6" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <text x="350" y="305" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">1、2、3 构成深度 3 的链；4 是 1 的下属；5 是另一棵树的根</text>
</svg>
