<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="83"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="760" height="420" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例：4 城 5 路，要恰好 2 条首都路</text>
  <path d="M 190 42 Q 380 50 570 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 图 -->
  <g filter="url(#rough2)">
    <!-- 边 3-4 (未选) -->
    <line x1="180" y1="250" x2="340" y2="250" stroke="#bbbbbb" stroke-width="2"/>
    <!-- 边 1-3 (未选, w3) -->
    <line x1="180" y1="120" x2="340" y2="250" stroke="#bbbbbb" stroke-width="2" stroke-dasharray="6 4"/>
    <!-- 选中：1-2, 2-3, 1-4 -->
    <line x1="180" y1="120" x2="340" y2="120" stroke="#b85450" stroke-width="3.4"/>
    <line x1="340" y1="120" x2="340" y2="250" stroke="#b85450" stroke-width="3.4"/>
    <line x1="180" y1="120" x2="180" y2="250" stroke="#b85450" stroke-width="3.4"/>
    <!-- 顶点 -->
    <circle cx="180" cy="120" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="340" cy="120" r="18" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
    <circle cx="340" cy="250" r="18" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
    <circle cx="180" cy="250" r="18" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
    <text x="180" y="127" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66">1</text>
    <text x="340" y="127" text-anchor="middle" font-size="15" fill="#2f4a66">2</text>
    <text x="340" y="257" text-anchor="middle" font-size="15" fill="#2f4a66">3</text>
    <text x="180" y="257" text-anchor="middle" font-size="15" fill="#2f4a66">4</text>
  </g>
  <g filter="url(#rough2)" font-size="11.5" fill="#555">
    <text x="258" y="112" text-anchor="middle">边1 w1</text>
    <text x="352" y="188" text-anchor="middle">边2 w1</text>
    <text x="258" y="274" text-anchor="middle">边3 w1</text>
    <text x="252" y="188" fill="#999">边4 w3</text>
    <text x="166" y="190" fill="#8b3a37">边5 w2</text>
  </g>
  <text x="250" y="330" text-anchor="middle" font-size="12" fill="#8b3a37" filter="url(#rough2)">红色 = 选中的三条（边 1、2、5）</text>

  <!-- 右侧推导 -->
  <g filter="url(#rough2)">
    <rect x="420" y="60" width="310" height="330" rx="10" fill="#ffffff" stroke="#888" stroke-width="1.2"/>
    <text x="436" y="84" font-size="13" font-weight="bold" fill="#2b2b2b">恰好 c 条首都边的最优值</text>
    <text x="436" y="108" font-size="12.5" fill="#2b2b2b">f(1) = 3：{边1, 边2, 边3}，只有边1 是首都边</text>
    <text x="436" y="130" font-size="12.5" fill="#2b2b2b">f(2) = 4：{边1, 边2, 边5}，边1、边5 是首都边</text>
    <text x="436" y="152" font-size="12.5" fill="#2b2b2b">f(3) = 6：{边1, 边4, 边5} 即三条首都边</text>
    <text x="436" y="182" font-size="12.5" font-weight="bold" fill="#8a6015">取 λ = −1（奖励首都边）</text>
    <text x="436" y="206" font-size="12.5" fill="#2b2b2b">W(边1)=0, W(边5)=1, W(边2)=1,</text>
    <text x="436" y="228" font-size="12.5" fill="#2b2b2b">W(边3)=1, W(边4)=2；同权时首都边优先，</text>
    <text x="436" y="250" font-size="12.5" fill="#2b2b2b">Kruskal 依次取 边1 → 边5 → 边2，</text>
    <text x="436" y="272" font-size="12.5" fill="#8b3a37">正好 2 条首都边 = k → 收工。</text>
    <text x="436" y="302" font-size="12.5" font-weight="bold" fill="#2f5223">为什么 λ = −1：</text>
    <text x="436" y="324" font-size="12.5" fill="#2b2b2b">λ = 0 时最优只有 1 条首都边（f(1)=3），</text>
    <text x="436" y="346" font-size="12.5" fill="#2b2b2b">λ = −1 时最优可达 2 条，λ = −2 时可达 3 条；</text>
    <text x="436" y="368" font-size="12.5" fill="#2b2b2b">最大且条数 ≥ 2 的 λ 就是 −1。</text>
  </g>

  <text x="380" y="404" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">答案 3 条边：1 5 2（总长 1+2+1 = 4，恰两条首都边，与官方输出等价）。</text>
</svg>
