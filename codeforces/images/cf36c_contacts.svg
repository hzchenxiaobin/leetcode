<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="720" height="420" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">三类接触：取最先碰到的那个</text>
  <path d="M 190 40 Q 360 46 530 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 面板1 -->
  <rect x="20" y="62" width="220" height="260" rx="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="130" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">① 底沿碰内壁</text>
  <path d="M 60 130 L 90 290 L 170 290 L 200 130" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 95 180 L 110 270 L 150 270 L 165 180" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="110" cy="270" r="5" fill="#b85450" filter="url(#rough2)"/>
  <text x="130" y="312" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">解 f_j(t) = r_i</text>
  <text x="130" y="330" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">t₁ = (r_i−r_j)h_j/(R_j−r_j)</text>

  <!-- 面板2 -->
  <rect x="250" y="62" width="220" height="260" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="360" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">② 顶沿碰内壁</text>
  <path d="M 290 130 L 320 290 L 400 290 L 430 130" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 315 170 L 335 250 L 385 250 L 405 170" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="405" cy="170" r="5" fill="#b85450" filter="url(#rough2)"/>
  <text x="360" y="312" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">解 f_j(t+h_i) = R_i（顶在下方顶之下）</text>
  <text x="360" y="330" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">A = (R_i−r_j)h_j/(R_j−r_j) − h_i</text>

  <!-- 面板3 -->
  <rect x="480" y="62" width="220" height="260" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="590" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">③ 侧壁碰下方顶沿</text>
  <path d="M 520 130 L 550 290 L 630 290 L 660 130" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 535 100 L 560 210 L 620 210 L 645 100" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="560" cy="210" r="5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="620" cy="210" r="5" fill="#b85450" filter="url(#rough2)"/>
  <text x="590" y="312" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">解 f_i(h_j) = R_j（顶在下方顶之上）</text>
  <text x="590" y="330" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">B = h_j − (R_j−r_i)h_i/(R_i−r_i)</text>

  <rect x="40" y="344" width="640" height="62" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <g font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">
    <text x="56" y="368">每个接触给出一个偏移；从上方下降时最先碰到的是最大的有效偏移，所以 off = max(t₁, A, B)。</text>
    <text x="56" y="392">A 仅在 0&lt;A≤h_j−h_i 有效；B 仅在 h_j−h_i≤B≤h_j 有效；t₁ 需 clamp 到 [0,h_j]。</text>
  </g>
</svg>
