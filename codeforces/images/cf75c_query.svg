<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr75cq" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#6b6b6b"/>
    </marker>
  </defs>
  <rect width="720" height="320" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">在约数轴上二分：不超过 high 的最大约数</text>

  <!-- 数轴 1..12 -->
  <line x1="60" y1="150" x2="660" y2="150" stroke="#6b6b6b" stroke-width="1.8" marker-end="url(#arr75cq)"
        filter="url(#rough2)"/>
  <g font-size="13" fill="#3a4a5a" text-anchor="middle" filter="url(#rough2)">
    <text x="60" y="176">1</text>
    <text x="160" y="176">3</text>
    <text x="260" y="176">5</text>
    <text x="360" y="176">7</text>
    <text x="460" y="176">9</text>
    <text x="560" y="176">11</text>
    <text x="620" y="176">12</text>
  </g>
  <!-- 约数点：1,3,9 -->
  <g filter="url(#rough2)">
    <circle cx="60" cy="150" r="8" fill="#8fbf6f" stroke="#3f6b2f" stroke-width="1.8"/>
    <circle cx="160" cy="150" r="8" fill="#8fbf6f" stroke="#3f6b2f" stroke-width="1.8"/>
    <circle cx="460" cy="150" r="8" fill="#8fbf6f" stroke="#3f6b2f" stroke-width="1.8"/>
  </g>

  <!-- 查询 1： [1,5] -->
  <g filter="url(#rough2)">
    <rect x="40" y="76" width="190" height="34" rx="6" fill="#fff8e1" stroke="#c9a227" stroke-width="1.6"/>
    <text x="135" y="98" text-anchor="middle" font-size="12" fill="#6b4e12">查询 [1, 5] → 3</text>
    <path d="M135 110 L135 138" stroke="#c9a227" stroke-width="1.6" fill="none" marker-end="url(#arr75cq)"/>
  </g>
  <!-- 查询 2： [9,11] -->
  <g filter="url(#rough2)">
    <rect x="270" y="76" width="190" height="34" rx="6" fill="#eef4fb" stroke="#446688" stroke-width="1.6"/>
    <text x="365" y="98" text-anchor="middle" font-size="12" fill="#33475c">查询 [9, 11] → 9</text>
    <path d="M420 110 L450 138" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr75cq)"/>
  </g>
  <!-- 查询 3： [10,11] -->
  <g filter="url(#rough2)">
    <rect x="490" y="76" width="200" height="34" rx="6" fill="#f7e6e6" stroke="#b85450" stroke-width="1.6"/>
    <text x="590" y="98" text-anchor="middle" font-size="12" fill="#7a2f2c">查询 [10, 11] → -1</text>
    <path d="M560 110 L520 138" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr75cq)"/>
  </g>

  <text x="360" y="222" text-anchor="middle" font-size="12.5" fill="#33475c" filter="url(#rough2)">约数表升序：{1, 3, 9}；upper_bound(high) 的前一个元素就是候选 d</text>
  <text x="360" y="252" text-anchor="middle" font-size="12.5" fill="#4a4a4a" filter="url(#rough2)">再检查 d ≥ low：是则输出 d，否则区间内没有公共约数，输出 -1</text>
  <text x="360" y="286" text-anchor="middle" font-size="12" fill="#6b6b66" filter="url(#rough2)">绿点 = g 的约数（= 公共约数），其余位置不可能有答案</text>
</svg>
