<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="720" height="430" fill="#fafafa"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按边权从小到大合并：每层算 2·s·(S−s)</text>
  <path d="M 200 43 Q 360 49 520 43" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <rect x="50" y="66" width="330" height="56" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="66" y="88" text-anchor="start" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">① 边权升序分组</text>
  <text x="66" y="108" text-anchor="start" font-size="10" fill="#777777" filter="url(#rough2)">同权重的边一起处理</text>
  <path d="M 215 122 L 215 136" stroke="#2b2b2b" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="50" y="136" width="330" height="56" rx="7" fill="#e9f4e2" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="66" y="158" text-anchor="start" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">② 当前分量由 &lt;w 的边构成</text>
  <text x="66" y="178" text-anchor="start" font-size="10" fill="#777777" filter="url(#rough2)">每个分量是一个「点」</text>
  <path d="M 215 192 L 215 206" stroke="#2b2b2b" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="50" y="206" width="330" height="56" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="66" y="228" text-anchor="start" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">③ 用权值 = w 的边连成分量树</text>
  <text x="66" y="248" text-anchor="start" font-size="10" fill="#777777" filter="url(#rough2)">求出每条边两侧的城市数 s</text>
  <path d="M 215 262 L 215 276" stroke="#2b2b2b" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="50" y="276" width="330" height="56" rx="7" fill="#e9f4e2" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="66" y="298" text-anchor="start" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">④ 贡献 = 2·s·(S−s)</text>
  <text x="66" y="318" text-anchor="start" font-size="10" fill="#777777" filter="url(#rough2)">S 是这棵分量树的总城市数</text>
  <path d="M 215 332 L 215 346" stroke="#2b2b2b" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="50" y="346" width="330" height="56" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="66" y="368" text-anchor="start" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">⑤ 再把这一层的边全部合并</text>
  <text x="66" y="388" text-anchor="start" font-size="10" fill="#777777" filter="url(#rough2)">进入下一个权重</text>
  <rect x="410" y="76" width="260" height="120" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="426" y="102" text-anchor="start" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">为什么是「从小到大」？</text>
  <text x="426" y="128" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">一条边 e 是某条路径的最大边</text>
  <text x="426" y="150" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">⇔ 路径全部边 ≤ w(e)</text>
  <text x="426" y="172" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">⇔ 两城市在 ≤ w 的同一个</text>
  <text x="426" y="190" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">   分量里、且被 e 分开</text>
  <rect x="410" y="216" width="260" height="96" rx="7" fill="#fdecea" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="426" y="242" text-anchor="start" font-size="11" font-weight="bold" fill="#7b2f2c" filter="url(#rough2)">从小到大合并的 DSU 正好</text>
  <text x="426" y="264" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">就是「≤ w 的分量」；</text>
  <text x="426" y="286" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">每一层里用 w 边连成分量树，</text>
  <text x="426" y="306" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">树形 DP 求两侧大小即可。</text>
  <text x="50" y="420" text-anchor="start" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">总复杂度 O(n log n + n α)；n=10^5 实测 0.06 s。</text>
</svg>
