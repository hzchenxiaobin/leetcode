<svg xmlns="http://www.w3.org/2000/svg" width="880" height="280" viewBox="0 0 880 280"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="121"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="280" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1：n=7, k=4 → 第 4 个排列是 1 2 3 4 5 7 6</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">答案 1</text>
  <g filter="url(#rough2)"><rect x="104" y="110" width="72" height="46" rx="4" fill="#e8e8e8" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="140" y="132" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">i=1</text>
  <text x="140" y="152" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="194" y="110" width="72" height="46" rx="4" fill="#e8e8e8" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="230" y="132" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">i=2</text>
  <text x="230" y="152" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="284" y="110" width="72" height="46" rx="4" fill="#e8e8e8" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="320" y="132" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">i=3</text>
  <text x="320" y="152" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="374" y="110" width="72" height="46" rx="4" fill="#f6e3c4" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="410" y="132" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">i=4</text>
  <text x="410" y="152" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><rect x="464" y="110" width="72" height="46" rx="4" fill="#e8e8e8" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="500" y="132" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">i=5</text>
  <text x="500" y="152" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">5</text>
  <g filter="url(#rough2)"><rect x="554" y="110" width="72" height="46" rx="4" fill="#e8e8e8" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="590" y="132" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">i=6</text>
  <text x="590" y="152" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">7</text>
  <g filter="url(#rough2)"><rect x="644" y="110" width="72" height="46" rx="4" fill="#e8e8e8" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="680" y="132" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">i=7</text>
  <text x="680" y="152" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="442" y="214" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">只有 i=4（值 4）与 i=7（值 6）里，i=4 同时满足两个都是幸运数</text>
</svg>
