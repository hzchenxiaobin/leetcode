<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="340" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">循环移位保持"循环相邻"关系</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">一行能变成交替色 ⇔ 它首尾相接看也没有相邻同色（8 是偶数，两种交替相位互为循环移位）</text>
  <g filter="url(#rough2)"><rect x="120" y="110" width="62" height="44" rx="4" fill="#f6e3c4" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="151.0" y="137.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">W</text>
  <g filter="url(#rough2)"><rect x="192" y="110" width="62" height="44" rx="4" fill="#cfe0f0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="223.0" y="137.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">B</text>
  <g filter="url(#rough2)"><rect x="264" y="110" width="62" height="44" rx="4" fill="#f6e3c4" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="295.0" y="137.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">W</text>
  <g filter="url(#rough2)"><rect x="336" y="110" width="62" height="44" rx="4" fill="#cfe0f0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="367.0" y="137.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">B</text>
  <g filter="url(#rough2)"><rect x="408" y="110" width="62" height="44" rx="4" fill="#f6e3c4" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="439.0" y="137.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">W</text>
  <g filter="url(#rough2)"><rect x="480" y="110" width="62" height="44" rx="4" fill="#cfe0f0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="511.0" y="137.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">B</text>
  <g filter="url(#rough2)"><rect x="552" y="110" width="62" height="44" rx="4" fill="#f6e3c4" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="583.0" y="137.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">W</text>
  <g filter="url(#rough2)"><rect x="624" y="110" width="62" height="44" rx="4" fill="#cfe0f0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="655.0" y="137.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">B</text>
  <path d="M120,170 L120,196 L664,196 L664,170" fill="none" stroke="#3d6b2f" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="392" y="220" text-anchor="middle" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">首尾也算相邻（循环）</text>
  <text x="440" y="270" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">只要每一行都是"循环交替"的，就能各自旋转到需要的相位</text>
  <text x="440" y="300" text-anchor="middle" font-size="12.5" fill="#b05a5a" filter="url(#rough2)">任一行出现同色相邻（含首尾）→ 输出 NO</text>
</svg>
