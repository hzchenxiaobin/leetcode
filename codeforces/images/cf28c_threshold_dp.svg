<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="430" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="38" text-anchor="middle" font-size="18.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">28C：E[M] = Σ P(M &gt; t)，每个 t 用一次卷积 DP</text>
  <path d="M 137 50 Q 380 56 623 50" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="86" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">把 m 个房间依次处理：dp[s] = Σ ∏ 1/k_i!（已分配 s 人，且每间 k_i &lt;= t·a_i）</text>
  <text x="60" y="112" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">最后 P(M &lt;= t) = n!/m^n · dp[n]。</text>
  <text x="60" y="138" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">实现细节：只在 [0, min(t·a_i, n)] 内卷积，复杂度 O(n·m·n·n) &lt;= 6.25e6。</text>
  <rect x="70" y="170" width="150" height="70" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="145" y="198" text-anchor="middle" font-size="13" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">t=0</text>
  <text x="145" y="224" text-anchor="middle" font-size="10.5" fill="#2f4a66" font-weight="normal" filter="url(#rough2)">P(M&lt;=0)=0</text>
  <rect x="240" y="170" width="150" height="70" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="315" y="198" text-anchor="middle" font-size="13" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">t=1</text>
  <text x="315" y="224" text-anchor="middle" font-size="10.5" fill="#2f4a66" font-weight="normal" filter="url(#rough2)">每间 k_i&lt;=a_i</text>
  <rect x="410" y="170" width="150" height="70" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="485" y="198" text-anchor="middle" font-size="13" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">t=2</text>
  <text x="485" y="224" text-anchor="middle" font-size="10.5" fill="#2f4a66" font-weight="normal" filter="url(#rough2)">每间 k_i&lt;=2a_i</text>
  <rect x="580" y="170" width="150" height="70" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="655" y="198" text-anchor="middle" font-size="13" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">...</text>
  <text x="655" y="224" text-anchor="middle" font-size="10.5" fill="#2f4a66" font-weight="normal" filter="url(#rough2)">...</text>
  <text x="60" y="280" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">于是 E[M] = Σ_{t=0}^{n-1} (1 - P(M &lt;= t))（t 只需到 n-1，因为 M &lt;= n 恒成立）。</text>
  <rect x="60" y="300" width="640" height="106" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="76" y="328" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">精度：用 long double 累积 1/k! 与小概率，n &lt;= 50 时 1/50! ≈ 3e-65 也在范围内；</text>
  <text x="76" y="354" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">最后乘 n!/m^n（&lt;= 50! ≈ 3e64）。相对误差远小于 1e-9，样例 3/4 的期望与精确枚举一致。</text>
  <text x="76" y="382" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">也可以用 double 做蒙特卡洛核对（第 8 节）。</text>
</svg>
