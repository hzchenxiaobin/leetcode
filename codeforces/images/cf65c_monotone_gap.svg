<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="61"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="420" fill="#fafafa"/>

  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">间距函数 g(t) 单调不增，零点就是答案</text>
  <path d="M 130 44 Q 360 51 590 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 坐标轴 -->
  <line x1="90" y1="330" x2="660" y2="330" stroke="#2b2b2b" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="90" y1="330" x2="90" y2="90" stroke="#2b2b2b" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="672" y="336" font-size="13" fill="#2b2b2b" filter="url(#rough2)">t</text>
  <text x="78" y="86" font-size="13" fill="#2b2b2b" filter="url(#rough2)">g</text>
  <text x="60" y="334" font-size="11" fill="#666666" filter="url(#rough2)">0</text>

  <!-- 不可行区（g>0）浅红 -->
  <rect x="90" y="90" width="330" height="240" fill="#fdeeee" opacity="0.75" filter="url(#rough2)"/>
  <!-- 可行区（g<=0）浅绿 -->
  <rect x="420" y="240" width="240" height="90" fill="#eef6ea" opacity="0.9" filter="url(#rough2)"/>

  <!-- 曲线 -->
  <path d="M 96 106 C 220 150 330 210 420 240 C 500 266 580 276 650 280"
        stroke="#446688" stroke-width="2.4" fill="none" filter="url(#rough2)"/>
  <line x1="420" y1="240" x2="420" y2="330" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <circle cx="420" cy="240" r="5.5" fill="#b85450" filter="url(#rough2)"/>
  <text x="420" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3b37" filter="url(#rough2)">t*</text>

  <!-- 标注 -->
  <text x="200" y="124" font-size="12.5" fill="#8a3b37" filter="url(#rough2)">g &gt; 0：还追不上</text>
  <text x="560" y="312" font-size="12.5" fill="#2f5223" filter="url(#rough2)">g ≤ 0：追得上</text>
  <text x="560" y="222" font-size="12" fill="#2f5223" filter="url(#rough2)">最小值即最早时刻</text>

  <!-- 箭头到零点 -->
  <path d="M 268 148 Q 330 170 404 226" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <!-- 下方公式 -->
  <rect x="120" y="366" width="480" height="42" rx="8" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="360" y="392" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">g(t) = |P − S(t)| − vp·t，且 |S(t) − S(t')| ≤ vs·|t − t'| ≤ vp·|t − t'|</text>
</svg>
