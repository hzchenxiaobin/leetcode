<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="430" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="38" text-anchor="middle" font-size="18.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">28A：折返点 = 环上的点覆盖，且两两不相邻</text>
  <path d="M 137 50 Q 380 56 623 50" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <line x1="210" y1="130" x2="295" y2="165" stroke="#9a9a9a" stroke-width="2.0" filter="url(#rough2)"/>
  <line x1="295" y1="165" x2="330" y2="250" stroke="#9a9a9a" stroke-width="2.0" filter="url(#rough2)"/>
  <line x1="330" y1="250" x2="295" y2="335" stroke="#9a9a9a" stroke-width="2.0" filter="url(#rough2)"/>
  <line x1="295" y1="335" x2="210" y2="370" stroke="#9a9a9a" stroke-width="2.0" filter="url(#rough2)"/>
  <line x1="210" y1="370" x2="125" y2="335" stroke="#9a9a9a" stroke-width="2.0" filter="url(#rough2)"/>
  <line x1="125" y1="335" x2="90" y2="250" stroke="#9a9a9a" stroke-width="2.0" filter="url(#rough2)"/>
  <line x1="90" y1="250" x2="125" y2="165" stroke="#9a9a9a" stroke-width="2.0" filter="url(#rough2)"/>
  <line x1="125" y1="165" x2="210" y2="130" stroke="#9a9a9a" stroke-width="2.0" filter="url(#rough2)"/>
  <circle cx="210" cy="130" r="8" fill="#3d3d3d" stroke="none" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="224" y="120" text-anchor="start" font-size="12" fill="#c9801f" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="295" cy="165" r="8" fill="#3d3d3d" stroke="none" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="309" y="155" text-anchor="start" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <circle cx="330" cy="250" r="8" fill="#3d3d3d" stroke="none" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="344" y="240" text-anchor="start" font-size="12" fill="#c9801f" font-weight="bold" filter="url(#rough2)">3</text>
  <circle cx="295" cy="335" r="8" fill="#3d3d3d" stroke="none" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="309" y="325" text-anchor="start" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
  <circle cx="210" cy="370" r="8" fill="#3d3d3d" stroke="none" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="224" y="360" text-anchor="start" font-size="12" fill="#c9801f" font-weight="bold" filter="url(#rough2)">5</text>
  <circle cx="125" cy="335" r="8" fill="#3d3d3d" stroke="none" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="111" y="325" text-anchor="end" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">6</text>
  <circle cx="90" cy="250" r="8" fill="#3d3d3d" stroke="none" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="76" y="240" text-anchor="end" font-size="12" fill="#c9801f" font-weight="bold" filter="url(#rough2)">7</text>
  <circle cx="125" cy="165" r="8" fill="#3d3d3d" stroke="none" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="111" y="155" text-anchor="end" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="210" y="96" text-anchor="middle" font-size="12.5" fill="#c9801f" font-weight="bold" filter="url(#rough2)">奇数号作为折返点</text>
  <rect x="330" y="100" width="400" height="120" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="344" y="128" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">一个折返点 i 用掉钉子 i-1, i, i+1（两根臂）</text>
  <text x="344" y="154" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">所以相邻两个钉子不能同时当折返点</text>
  <text x="344" y="180" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">而每条线段都必须被某根杆盖住</text>
  <text x="344" y="206" text-anchor="start" font-size="12" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">⇒ 折返点恰为「全奇」或「全偶」两种</text>
  <rect x="330" y="254" width="400" height="130" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="344" y="282" text-anchor="start" font-size="12.5" fill="#2f5223" font-weight="bold" filter="url(#rough2)">再检查“杆长是否够用”：</text>
  <text x="344" y="310" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">折返点 i 需要长度 = |P(i-1)P(i)| + |P(i)P(i+1)|</text>
  <text x="344" y="336" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">把这 n/2 个需求长度与 m 根杆做多重集匹配，</text>
  <text x="344" y="362" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">两种奇偶方案任一匹配成功即 YES，否则 NO。</text>
  <text x="60" y="404" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">例：正方形四点、杆长 {4,4} → 奇/偶两种方案都能匹配，输出 YES 与 "1 -1 2 -1"。</text>
</svg>
