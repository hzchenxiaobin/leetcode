<svg xmlns="http://www.w3.org/2000/svg" width="780" height="430" viewBox="0 0 780 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="909"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr38h" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8c3b37"/>
    </marker>
  </defs>

  <rect width="780" height="430" fill="#fafafa"/>
  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">可行分配的两个分界者：金牌中 m 最大者 r，铜牌中 M 最小者 t</text>

  <!-- 键轴 -->
  <line x1="60" y1="210" x2="720" y2="210" stroke="#7a8ca6" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="726" y="214" font-size="10" fill="#777" filter="url(#rough2)">键</text>

  <!-- 金牌区 -->
  <rect x="70" y="120" width="200" height="60" rx="8" fill="#fff3c4" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="170" y="146" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">金牌 G（g 个）</text>
  <text x="170" y="166" text-anchor="middle" font-size="10" fill="#8a6015" filter="url(#rough2)">都取 ≤ a 的键</text>

  <!-- 银牌区 -->
  <rect x="300" y="120" width="180" height="60" rx="8" fill="#dbe7fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="390" y="146" text-anchor="middle" font-size="12" font-weight="bold" fill="#23405c" filter="url(#rough2)">银牌 S（s 个）</text>
  <text x="390" y="166" text-anchor="middle" font-size="10" fill="#23405c" filter="url(#rough2)">键落在 (a, b) 内</text>

  <!-- 铜牌区 -->
  <rect x="510" y="120" width="200" height="60" rx="8" fill="#ffd9b3" stroke="#b06a2c" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="610" y="146" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a4a14" filter="url(#rough2)">铜牌 B（其余）</text>
  <text x="610" y="166" text-anchor="middle" font-size="10" fill="#8a4a14" filter="url(#rough2)">都取 ≥ b 的键</text>

  <!-- 分界点 -->
  <circle cx="285" cy="210" r="6" fill="#8c3b37" filter="url(#rough2)"/>
  <text x="262" y="236" font-size="11" font-weight="bold" fill="#8c3b37" filter="url(#rough2)">a = max mᵢ（r 处）</text>
  <circle cx="495" cy="210" r="6" fill="#8c3b37" filter="url(#rough2)"/>
  <text x="470" y="236" font-size="11" font-weight="bold" fill="#8c3b37" filter="url(#rough2)">b = min Mⱼ（t 处）</text>

  <path d="M 300 196 L 300 224" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 480 196 L 480 224" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- 条件 -->
  <rect x="60" y="256" width="660" height="78" rx="10" fill="#fdeef0" stroke="#b85450"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="76" y="280" font-size="12" fill="#8c3b37" filter="url(#rough2)">可行 ⇔ a &lt; b，且对每个银牌选手 i：nᵢ(a) &lt; b</text>
  <text x="76" y="304" font-size="10.5" fill="#8c3b37" filter="url(#rough2)">其中 nᵢ(a) = 选手 i 能取到的、严格大于 a 的最小键（没有就是 +∞）。</text>
  <text x="76" y="324" font-size="10.5" fill="#8c3b37" filter="url(#rough2)">银牌取自己最小的可用键最有利；只要它落在 b 之前，就能按 G &lt; S &lt; B 排开。</text>

  <!-- 唯一性 -->
  <rect x="60" y="348" width="660" height="62" rx="9" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="76" y="372" font-size="11.5" fill="#2f5223" filter="url(#rough2)">每个可行分配对应唯一的 (r, t)：键互不相同 ⇒ mᵢ 与 Mⱼ 各自两两不同，最大/最小唯一。</text>
  <text x="76" y="396" font-size="11.5" fill="#2f5223" filter="url(#rough2)">于是枚举 (r, t) 共 n² 对，每对做一次二维背包（金/银计数），不重不漏。</text>
</svg>
