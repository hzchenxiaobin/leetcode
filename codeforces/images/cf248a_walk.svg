<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="720" height="260" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例走查：n=5，左门开 2 个、右门开 4 个</text>
  <rect x="70" y="48" width="250" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="195" y="68" text-anchor="middle" font-size="11.5" fill="#2f4a66">左门 0/1</text>
  <rect x="360" y="48" width="300" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="510" y="68" text-anchor="middle" font-size="11.5" fill="#2f5223">0 1 0 1 0 → 开 2</text>
  <rect x="70" y="88" width="250" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="195" y="108" text-anchor="middle" font-size="11.5" fill="#2f4a66">左门两种目标</text>
  <rect x="360" y="88" width="300" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="510" y="108" text-anchor="middle" font-size="11.5" fill="#2f5223">全关改 2 次 / 全开改 3 次 → 2</text>
  <rect x="70" y="128" width="250" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="195" y="148" text-anchor="middle" font-size="11.5" fill="#2f4a66">右门 0/1</text>
  <rect x="360" y="128" width="300" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="510" y="148" text-anchor="middle" font-size="11.5" fill="#2f5223">1 0 1 1 1 → 开 4</text>
  <rect x="70" y="168" width="250" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="195" y="188" text-anchor="middle" font-size="11.5" fill="#2f4a66">右门两种目标</text>
  <rect x="360" y="168" width="300" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="510" y="188" text-anchor="middle" font-size="11.5" fill="#2f5223">全开改 1 次 / 全关改 4 次 → 1</text>
  <text x="70" y="236" text-anchor="start" font-size="12" fill="#7a4b22" filter="url(#rough2)">答案 = 2 + 1 = 3 ✓（与样例输出一致）</text>
</svg>
