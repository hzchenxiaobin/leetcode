<svg xmlns="http://www.w3.org/2000/svg" width="880" height="280" viewBox="0 0 880 280"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="280" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例：21-12-2013 出现 3 次</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">其余日期出现次数更少，答案 13-12-2013</text>
  <text x="150" y="110" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">...-21-12-2013-12-2013-12-2013-...</text>
  <text x="150" y="150" text-anchor="start" font-size="12.5" fill="#555555" filter="url(#rough2)">前一个窗口：12-10-2013？不是，是 21-12-2013/12-12-2013 之类</text>
  <text x="150" y="195" text-anchor="start" font-size="13" fill="#3d6b2f" filter="url(#rough2)">统计后 13-12-2013 出现次数最多且唯一</text>
</svg>
