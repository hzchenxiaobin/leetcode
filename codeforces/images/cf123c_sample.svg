<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="153"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="330" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">样例 3：k = 2，按 d = 3, 4, 2, 5 的顺序逐位确定</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">长度 4 的合法括号序列只有 (()) 与 ()()</text>
  <g filter="url(#rough2)"><rect x="60" y="96" width="170" height="32" rx="4" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="145" y="117" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">第 2 位（d=3）</text>
  <text x="250" y="117" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">试 '('：只剩 (())，count=1 &lt; 2</text>
  <text x="700" y="117" text-anchor="start" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">取 ')'，k ← 1</text>
  <g filter="url(#rough2)"><rect x="60" y="140" width="170" height="32" rx="4" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="145" y="161" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">第 3 位（d=4）</text>
  <text x="250" y="161" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">试 '('：只剩 ()()，count=1 ≥ 1</text>
  <text x="700" y="161" text-anchor="start" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">取 '('</text>
  <g filter="url(#rough2)"><rect x="60" y="184" width="170" height="32" rx="4" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="145" y="205" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">第 1 位（d=2）</text>
  <text x="250" y="205" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">试 '('：count=1 ≥ 1</text>
  <text x="700" y="205" text-anchor="start" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">取 '('</text>
  <g filter="url(#rough2)"><rect x="60" y="228" width="170" height="32" rx="4" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="145" y="249" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">第 4 位（d=5）</text>
  <text x="250" y="249" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">试 '('：count=0 &lt; 1</text>
  <text x="700" y="249" text-anchor="start" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">取 ')'</text>
  <text x="450" y="290" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">序列 = ( ) ( ) ⇒ 每格取所在反对角线的值，输出</text>
  <g filter="url(#rough2)"><rect x="300" y="300" width="300" height="24" rx="6" fill="#ffffff" fill-opacity="0.3" stroke="#cccccc" stroke-width="1.4" stroke-dasharray="4 3"/></g>
  <text x="450" y="317" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">() / )( / ()</text>
</svg>
