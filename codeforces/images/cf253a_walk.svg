<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="320" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">目标：让相邻不同的对数尽量多</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">相邻不同对数 = min(n+m-1, 2·min(n,m))，交替排法正好达到这个上界</text>
  <text x="150" y="110" text-anchor="start" font-size="20" fill="#2b2b2b" filter="url(#rough2)">B G B G B G</text>
  <text x="150" y="140" text-anchor="start" font-size="12.5" fill="#555555" filter="url(#rough2)">3 个 B + 3 个 G，5 对相邻全部不同</text>
  <text x="150" y="210" text-anchor="start" font-size="20" fill="#2b2b2b" filter="url(#rough2)">B G B G B B</text>
  <text x="150" y="240" text-anchor="start" font-size="12.5" fill="#555555" filter="url(#rough2)">4 个 B + 2 个 G：4 对相邻不同，最后两个 B 只能相邻</text>
  <text x="440" y="292" text-anchor="middle" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">上界证明：每个 G 最多贡献 2 对“不同”，若两种人都还有剩余则必有同性别相邻</text>
</svg>
