<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
  </defs>

  <rect width="820" height="470" fill="#fafafa"/>

  <text x="410" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">n, m ≥ 2：整矩阵操作逐格最优</text>
  <text x="410" y="54" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">例：n = 4, m = 5；红框是 2 行 × 3 列的操作区域，格内数字是这次的 f 减量</text>

  <!-- 4×5 网格 -->
  <rect x="40" y="76" width="72" height="44" fill="#f2f2f2" stroke="#999999" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="112" y="76" width="72" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="184" y="76" width="72" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="256" y="76" width="72" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="328" y="76" width="72" height="44" fill="#f2f2f2" stroke="#999999" stroke-width="1.3" filter="url(#rough2)"/>

  <rect x="40" y="120" width="72" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="112" y="120" width="72" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="184" y="120" width="72" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="256" y="120" width="72" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="328" y="120" width="72" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>

  <rect x="40" y="164" width="72" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="112" y="164" width="72" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="184" y="164" width="72" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="256" y="164" width="72" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="328" y="164" width="72" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>

  <rect x="40" y="208" width="72" height="44" fill="#f2f2f2" stroke="#999999" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="112" y="208" width="72" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="184" y="208" width="72" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="256" y="208" width="72" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="328" y="208" width="72" height="44" fill="#f2f2f2" stroke="#999999" stroke-width="1.3" filter="url(#rough2)"/>

  <!-- 数字：内部 2，只同行 3，只同列 2，外面 0 -->
  <text x="76" y="104" text-anchor="middle" font-size="15" font-weight="bold" fill="#777" filter="url(#rough2)">0</text>
  <text x="148" y="104" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">2</text>
  <text x="220" y="104" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">2</text>
  <text x="292" y="104" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">2</text>
  <text x="364" y="104" text-anchor="middle" font-size="15" font-weight="bold" fill="#777" filter="url(#rough2)">0</text>

  <text x="76" y="148" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">3</text>
  <text x="148" y="148" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6212" filter="url(#rough2)">2</text>
  <text x="220" y="148" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6212" filter="url(#rough2)">2</text>
  <text x="292" y="148" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6212" filter="url(#rough2)">2</text>
  <text x="364" y="148" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">3</text>

  <text x="76" y="192" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">3</text>
  <text x="148" y="192" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6212" filter="url(#rough2)">2</text>
  <text x="220" y="192" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6212" filter="url(#rough2)">2</text>
  <text x="292" y="192" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6212" filter="url(#rough2)">2</text>
  <text x="364" y="192" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">3</text>

  <text x="76" y="236" text-anchor="middle" font-size="15" font-weight="bold" fill="#777" filter="url(#rough2)">0</text>
  <text x="148" y="236" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">2</text>
  <text x="220" y="236" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">2</text>
  <text x="292" y="236" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">2</text>
  <text x="364" y="236" text-anchor="middle" font-size="15" font-weight="bold" fill="#777" filter="url(#rough2)">0</text>

  <rect x="112" y="120" width="216" height="88" fill="none" stroke="#b85450" stroke-width="2.4" stroke-dasharray="7 5" filter="url(#rough2)"/>

  <text x="40" y="272" font-size="11.5" fill="#666" filter="url(#rough2)">同一张网格上，整矩阵操作会让每一格都减 6；下面看它为什么永远不亏</text>

  <!-- 右侧图例 -->
  <text x="430" y="84" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">格内数字 = 本次操作给该格 f 的减量</text>

  <rect x="430" y="94" width="14" height="14" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="452" y="106" font-size="11.5" fill="#8a6212" filter="url(#rough2)">矩形内部 a + b − 3 = 2 + 3 − 3 = 2</text>

  <rect x="430" y="120" width="14" height="14" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="452" y="132" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">只同行（列被排除）b = 3</text>

  <rect x="430" y="146" width="14" height="14" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="452" y="158" font-size="11.5" fill="#33517a" filter="url(#rough2)">只同列（行被排除）a = 2</text>

  <rect x="430" y="172" width="14" height="14" rx="3" fill="#f2f2f2" stroke="#999999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="452" y="184" font-size="11.5" fill="#666" filter="url(#rough2)">全在外 0</text>

  <rect x="424" y="204" width="372" height="116" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="438" y="230" font-size="12" fill="#2e6e2e" filter="url(#rough2)">整矩阵覆盖（a = 4, b = 5）时每格都是</text>
  <text x="438" y="254" font-size="13.5" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">n + m − 3 = 6 ≥ 2, 3, 0</text>
  <text x="438" y="280" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">所以 n, m ≥ 2 时最优解只由整矩阵操作组成；</text>
  <text x="438" y="302" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">唯独 1 维情形这种替换会失效，需要另议。</text>

  <rect x="40" y="380" width="756" height="72" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="58" y="408" font-size="15" font-weight="bold" fill="#33517a" filter="url(#rough2)">ans = max(0, ⌈ F_k / (n + m − 3) ⌉)</text>
  <text x="58" y="434" font-size="11.5" fill="#446688" filter="url(#rough2)">F_k = 全体 f 中第 k 小的值：每次整矩阵操作把它们一起压低 n+m−3，已合格的格子只会更稳</text>
</svg>
