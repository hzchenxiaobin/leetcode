<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="380" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">操作二只能把 a 减到最近的 x 的倍数</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">落点 a - (a mod x) 与 a 的距离小于 x ≤ k ≤ 15，所以 dp 是"短跳 + 长平移"的结合</text>
  <line x1="90" y1="260" x2="800" y2="260" stroke="#8899aa" stroke-width="1.3" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="94" y="236" width="52" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="120.0" y="263.04" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">10</text>
  <text x="120" y="300" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">a=10</text>
  <g filter="url(#rough2)"><rect x="274" y="236" width="52" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="300.0" y="263.04" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">8</text>
  <text x="300" y="300" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">8=8</text>
  <g filter="url(#rough2)"><rect x="494" y="236" width="52" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="520.0" y="263.04" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">7</text>
  <text x="520" y="300" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">7=7</text>
  <g filter="url(#rough2)"><rect x="674" y="236" width="52" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="700.0" y="263.04" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="700" y="300" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">4=4</text>
  <line x1="146" y1="236" x2="274" y2="236" stroke="#b05a5a" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="210" y="214" text-anchor="middle" font-size="11.5" fill="#b05a5a" filter="url(#rough2)">-2（mod 4）</text>
  <line x1="326" y1="236" x2="340" y2="236" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="345" y="214" text-anchor="start" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">-1</text>
  <line x1="546" y1="236" x2="674" y2="236" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="610" y="214" text-anchor="middle" font-size="11.5" fill="#3d6b2f" filter="url(#rough2)">-3（mod 4）</text>
  <text x="440" y="110" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">另一个操作是纯 -1，所以 dp 的递推只有两类转移</text>
  <text x="440" y="140" text-anchor="middle" font-size="13.5" fill="#2f4a66" filter="url(#rough2)">f(v) = 1 + min( f(v-1), min_x f(v - v mod x) )</text>
  <text x="440" y="340" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">关键：每个转移的落点都在 v-k 之后，所以 f 的差分只受"最近的 k 个值"影响</text>
  <text x="440" y="366" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">而 v mod x 只依赖 v 对 2..k 取模 → 差分具有周期 L = lcm(2..k)</text>
</svg>
