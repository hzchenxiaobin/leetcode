<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="330" fill="#fafafa"/>
  <text x="360.0" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">208D：每次取最贵且买得起的奖品</text>
  <path d="M 144.00 46 Q 360.0 52 576.00 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="72" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">贪心：每次攒够最少的一档（a）就兑换；能兑换时永远选最贵且买得起的。</text>
  <text x="60" y="92" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">因为奖品价格固定且递增，一次操作只会让分数变小，所以直接 while 循环即可。</text>
  <rect x="60" y="116" width="300" height="110" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="134" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">for 每个 p_i：</text>
  <text x="74" y="156" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">  pts += p_i</text>
  <text x="74" y="178" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">  while pts &gt;= a:</text>
  <text x="74" y="200" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">    找到最大的 k 使 cost[k] &lt;= pts</text>
  <text x="74" y="222" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">    pts -= cost[k]; cnt[k]++</text>
  <rect x="380" y="116" width="290" height="110" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="394" y="134" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">样例一：</text>
  <text x="394" y="156" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">3 → 兑 2，余 1</text>
  <text x="394" y="178" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">10+1=11 → 兑 10，余 1</text>
  <text x="394" y="200" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">1+4=5 → 兑 4，余 1</text>
  <text x="394" y="222" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">结果 1 1 1 0 0，余 1 分</text>
  <text x="60" y="250" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">n ≤ 50，p_i、价格 ≤ 10⁹：用 long long，兑换次数不大。</text>
</svg>
