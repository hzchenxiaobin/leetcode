<svg xmlns="http://www.w3.org/2000/svg" width="740" height="430" viewBox="0 0 740 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="740" height="430" fill="#fafafa"/>
  <text x="370.0" y="36" font-size="20" fill="#2b2b2b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">样例 1 与样例 3 的走查</text>
  <path d="M 118 46 Q 370 52 622 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="84" font-size="13" fill="#2f5223" text-anchor="start" font-weight="bold" filter="url(#rough2)">样例 1：P = aba，b = 101</text>
  <rect x="60" y="96" width="46" height="46" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="83" y="125" font-size="15" fill="#2f5223" text-anchor="middle" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="83" y="160" font-size="10.5" fill="#44546a" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="106" y="96" width="46" height="46" rx="5" fill="#e8f0fe" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="129" y="125" font-size="15" fill="#2f5223" text-anchor="middle" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="129" y="160" font-size="10.5" fill="#44546a" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="152" y="96" width="46" height="46" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="175" y="125" font-size="15" fill="#2f5223" text-anchor="middle" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="175" y="160" font-size="10.5" fill="#44546a" text-anchor="middle" filter="url(#rough2)">3</text>
  <rect x="198" y="96" width="46" height="46" rx="5" fill="#e8f0fe" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="221" y="125" font-size="15" fill="#2f5223" text-anchor="middle" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="221" y="160" font-size="10.5" fill="#44546a" text-anchor="middle" filter="url(#rough2)">4</text>
  <rect x="244" y="96" width="46" height="46" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="267" y="125" font-size="15" fill="#2f5223" text-anchor="middle" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="267" y="160" font-size="10.5" fill="#44546a" text-anchor="middle" filter="url(#rough2)">5</text>
  <line x1="83.0" y1="90.0" x2="175.0" y2="90.0" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb2)" filter="url(#rough2)"/>
  <line x1="175.0" y1="90.0" x2="267.0" y2="90.0" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb2)" filter="url(#rough2)"/>
  <text x="360" y="84" font-size="10.5" fill="#2f4a66" text-anchor="middle" filter="url(#rough2)">↑ 两个箭头 = 两个强制出现（起点 1 与 3）</text>
  <text x="60" y="192" font-size="12" fill="#2f5223" text-anchor="start" filter="url(#rough2)">两个强制窗口在位置 3 重叠且都是 'b' → 一致，得到 ababa ✓</text>
  <text x="60" y="214" font-size="13" fill="#8a3030" text-anchor="start" font-weight="bold" filter="url(#rough2)">样例 3：P = abba，b = 101</text>
  <rect x="60" y="226" width="46" height="46" rx="5" fill="#fdeaea" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="83" y="255" font-size="15" fill="#8a3030" text-anchor="middle" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="83" y="288" font-size="10.5" fill="#44546a" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="106" y="226" width="46" height="46" rx="5" fill="#fdeaea" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="129" y="255" font-size="15" fill="#8a3030" text-anchor="middle" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="129" y="288" font-size="10.5" fill="#44546a" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="152" y="226" width="46" height="46" rx="5" fill="#fdeaea" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="175" y="255" font-size="15" fill="#8a3030" text-anchor="middle" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="175" y="288" font-size="10.5" fill="#44546a" text-anchor="middle" filter="url(#rough2)">3</text>
  <rect x="198" y="226" width="46" height="46" rx="5" fill="#fdeaea" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="221" y="255" font-size="15" fill="#8a3030" text-anchor="middle" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="221" y="288" font-size="10.5" fill="#44546a" text-anchor="middle" filter="url(#rough2)">4</text>
  <rect x="244" y="226" width="46" height="46" rx="5" fill="#fdeaea" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="267" y="255" font-size="15" fill="#8a3030" text-anchor="middle" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="267" y="288" font-size="10.5" fill="#44546a" text-anchor="middle" filter="url(#rough2)">5</text>
  <rect x="290" y="226" width="46" height="46" rx="5" fill="#fdeaea" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="313" y="255" font-size="15" fill="#8a3030" text-anchor="middle" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="313" y="288" font-size="10.5" fill="#44546a" text-anchor="middle" filter="url(#rough2)">6</text>
  <line x1="83.0" y1="220.0" x2="221.0" y2="220.0" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr2)" filter="url(#rough2)"/>
  <line x1="175.0" y1="304.0" x2="313.0" y2="304.0" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr2)" filter="url(#rough2)"/>
  <text x="370" y="214" font-size="10.5" fill="#8a3030" text-anchor="middle" filter="url(#rough2)">↑ 起点 1：abba</text>
  <text x="370" y="320" font-size="10.5" fill="#8a3030" text-anchor="middle" filter="url(#rough2)">↑ 起点 3：abba</text>
  <text x="60" y="348" font-size="12" fill="#8a3030" text-anchor="start" font-weight="bold" filter="url(#rough2)">位置 3 被要求既是 'b'（第一段）又是 'a'（第二段）→ 冲突 ⇒ No solution</text>
  <rect x="60" y="366" width="620" height="50" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="78" y="390" font-size="12" fill="#8a6015" text-anchor="start" filter="url(#rough2)">所以：先把所有 b=1 的窗口盖上并检查冲突，是判断无解的第一道关卡。</text>
  <text x="78" y="408" font-size="12" fill="#8a6015" text-anchor="start" filter="url(#rough2)">剩下的自由位置用自动机 DP 保证「不会在 b=0 处意外出现」。</text>
</svg>
