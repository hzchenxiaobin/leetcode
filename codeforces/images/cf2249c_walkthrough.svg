<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="700" height="380" fill="#fafafa"/>

  <text x="350" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold"
        filter="url(#rough2)">样例 p = [1,3,5,2,4] 的逐 s 演算（位置 0-indexed）</text>
  <text x="350" y="46" text-anchor="middle" font-size="10.5" fill="#777"
        filter="url(#rough2)">C(p)：位置 p 被多少个 v 的块首区间覆盖；1 未读时块数 = C(p)，1 已读时块数 = C(p) + 1</text>

  <!-- 表头 -->
  <rect x="30" y="58" width="640" height="34" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <g font-size="11" fill="#3a4a66" text-anchor="middle" filter="url(#rough2)">
    <text x="65" y="80">s</text>
    <text x="167" y="80">激活的 v（s ∈ B_v）</text>
    <text x="327" y="80">C(p)，p = 0..4</text>
    <text x="470" y="80">max P1 ≤ 2</text>
    <text x="565" y="80">max P2 ≤ 1</text>
    <text x="640" y="80">好?</text>
  </g>

  <!-- 第 1 行：s = 0，坏 -->
  <rect x="30" y="92" width="640" height="40" fill="#fce4ec" fill-opacity="0.55"
        stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <g font-size="11.5" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="65" y="117">0</text>
    <text x="167" y="117">v = 3, 5</text>
    <text x="327" y="117">0  1  2  1  0</text>
    <text x="470" y="117">空</text>
    <text x="565" y="117" fill="#b85450" font-weight="bold">2</text>
    <text x="640" y="117" fill="#b85450" font-weight="bold">坏</text>
  </g>

  <!-- 第 2 行：s = 1，好 -->
  <rect x="30" y="132" width="640" height="40" fill="#ffffff" stroke="#ddd"
        stroke-width="1" filter="url(#rough2)"/>
  <g font-size="11.5" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="65" y="157">1</text>
    <text x="167" y="157">v = 2, 3, 5</text>
    <text x="327" y="157">0  1  2  2  1</text>
    <text x="470" y="157">2</text>
    <text x="565" y="157">0</text>
    <text x="640" y="157" fill="#4a7a3a" font-weight="bold">好</text>
  </g>

  <!-- 第 3 行：s = 2，好 -->
  <rect x="30" y="172" width="640" height="40" fill="#ffffff" stroke="#ddd"
        stroke-width="1" filter="url(#rough2)"/>
  <g font-size="11.5" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="65" y="197">2</text>
    <text x="167" y="197">v = 2, 4, 5</text>
    <text x="327" y="197">1  0  1  2  2</text>
    <text x="470" y="197">2</text>
    <text x="565" y="197">1</text>
    <text x="640" y="197" fill="#4a7a3a" font-weight="bold">好</text>
  </g>

  <!-- 第 4 行：s = 3，好 -->
  <rect x="30" y="212" width="640" height="40" fill="#ffffff" stroke="#ddd"
        stroke-width="1" filter="url(#rough2)"/>
  <g font-size="11.5" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="65" y="237">3</text>
    <text x="167" y="237">v = 4</text>
    <text x="327" y="237">1  0  0  0  1</text>
    <text x="470" y="237">1</text>
    <text x="565" y="237">1</text>
    <text x="640" y="237" fill="#4a7a3a" font-weight="bold">好</text>
  </g>

  <!-- 第 5 行：s = 4，好 -->
  <rect x="30" y="252" width="640" height="40" fill="#ffffff" stroke="#ddd"
        stroke-width="1" filter="url(#rough2)"/>
  <g font-size="11.5" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="65" y="277">4</text>
    <text x="167" y="277">v = 3, 4</text>
    <text x="327" y="277">1  1  1  0  1</text>
    <text x="470" y="277">1</text>
    <text x="565" y="277">1</text>
    <text x="640" y="277" fill="#4a7a3a" font-weight="bold">好</text>
  </g>

  <path d="M 30 92 L 30 292" stroke="#446688" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 100 58 L 100 292" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 235 58 L 235 292" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 420 58 L 420 292" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 520 58 L 520 292" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 610 58 L 610 292" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 670 58 L 670 292" stroke="#446688" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <rect x="30" y="302" width="640" height="56" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="350" y="322" text-anchor="middle" font-size="11" fill="#8a6a20"
        filter="url(#rough2)">ans = 4，与官方样例 2 的输出一致</text>
  <text x="350" y="342" text-anchor="middle" font-size="10.5" fill="#666"
        filter="url(#rough2)">s = 0 坏在 pos[1] = s：此时 P1 为空、P2 退化成整圈，要求 max C ≤ 1，但 C(2) = 2</text>
</svg>
