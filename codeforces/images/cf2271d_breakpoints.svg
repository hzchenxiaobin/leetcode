<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 390" width="700" height="390" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="700" height="390" fill="#fafafa"/>

  <text x="350" y="30" text-anchor="middle" font-size="17.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">换挡点只有 4 类：把两个区间都画在 s 轴上</text>
  <text x="350" y="52" text-anchor="middle" font-size="12.5" fill="#7a7a7a" filter="url(#rough2)">d(s) = 1[s ∈ [l−m, r−m]] − 1[s ∈ [l, r]]，四个端点就是全部断点</text>

  <!-- cov(s+m) = 1 的区间（橙色，向左平移 m） -->
  <text x="211" y="78" text-anchor="middle" font-size="11.5" fill="#a0761e" filter="url(#rough2)">cov(s+m) = 1</text>
  <rect x="178" y="86" width="67" height="24" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="211" y="103" text-anchor="middle" font-size="12" fill="#a0761e" filter="url(#rough2)">[l−m, r−m]</text>

  <!-- cov(s) = 1 的区间（绿色） -->
  <text x="346" y="136" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">cov(s) = 1</text>
  <rect x="313" y="144" width="67" height="24" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="346" y="161" text-anchor="middle" font-size="12" fill="#2e6e2e" filter="url(#rough2)">[l, r]</text>

  <!-- 断点竖线 -->
  <g stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 3" filter="url(#rough2)">
    <path d="M178,112 L178,196"/>
    <path d="M245,112 L245,196"/>
    <path d="M313,112 L313,196"/>
    <path d="M380,112 L380,196"/>
  </g>

  <!-- s 轴 -->
  <path d="M64,186 L636,186" stroke="#555" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="646" y="190" font-size="12" fill="#555" filter="url(#rough2)">s</text>

  <!-- 断点标签 -->
  <g font-size="11" text-anchor="middle" fill="#b85450">
    <text x="178" y="212" filter="url(#rough2)">l−m</text>
    <text x="245" y="212" filter="url(#rough2)">r−m+1</text>
    <text x="313" y="212" filter="url(#rough2)">l</text>
    <text x="380" y="212" filter="url(#rough2)">r+1</text>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#9a9a9a">
    <text x="178" y="228" filter="url(#rough2)">20</text>
    <text x="245" y="228" filter="url(#rough2)">25</text>
    <text x="313" y="228" filter="url(#rough2)">30</text>
    <text x="380" y="228" filter="url(#rough2)">35</text>
  </g>

  <!-- 各段的 d 值 -->
  <g font-size="11.5" text-anchor="middle">
    <text x="120" y="248" fill="#777" filter="url(#rough2)">d = 0</text>
    <text x="211" y="248" fill="#a0761e" filter="url(#rough2)">d = +1</text>
    <text x="279" y="248" fill="#777" filter="url(#rough2)">d = 0</text>
    <text x="346" y="248" fill="#2e6e2e" filter="url(#rough2)">d = −1</text>
    <text x="470" y="248" fill="#777" filter="url(#rough2)">d = 0</text>
  </g>
  <text x="350" y="268" text-anchor="middle" font-size="11" fill="#9a9a9a" filter="url(#rough2)">示例取 m = 10, l = 30, r = 34：4 个断点把 s 轴切成 5 段，段内 d 恒定</text>

  <!-- 结论框 -->
  <rect x="36" y="278" width="628" height="46" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="298" text-anchor="middle" font-size="12.5" fill="#33517a" filter="url(#rough2)">候选点 = 4n 个断点 ∪ {1, R}，排序去重后 f 在 [c_j, c_{j+1}−1] 上是等差数列，公差 d</text>
  <text x="350" y="316" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">断点只是「换挡点的超集」：多切几刀不影响正确性，只是多算几次</text>

  <rect x="36" y="332" width="628" height="48" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="352" text-anchor="middle" font-size="12.5" fill="#a0761e" filter="url(#rough2)">解 f(c_j) + t·d = k：t = (k − f(c_j)) / d，要求整除且 0 ≤ t &lt; len = c_{j+1} − c_j</text>
  <text x="350" y="370" text-anchor="middle" font-size="11.5" fill="#8d6a1f" filter="url(#rough2)">d = 0 时该段只可能整段相等；跳到下一段用 f(c_{j+1}) = f(c_j) + d·len</text>
</svg>
