<svg xmlns="http://www.w3.org/2000/svg" width="740" height="420" viewBox="0 0 740 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="91"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="740" height="420" fill="#fafafa"/>
  <text x="370" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">查询 a b b：沿祖先链找匹配，链尾必须正好是它</text>
  <path d="M 170 46 Q 370 52 570 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="86" y="68" width="68" height="44" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">&lt;a&gt;</text>
  <rect x="86" y="158" width="68" height="44" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="186" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">&lt;b&gt;</text>
  <rect x="86" y="248" width="68" height="44" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="276" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">&lt;b&gt;</text>
  <rect x="86" y="328" width="68" height="44" rx="9" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="356" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">&lt;v&gt;</text>
  <line x1="120" y1="112" x2="120" y2="158" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <line x1="120" y1="202" x2="120" y2="248" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <line x1="120" y1="292" x2="120" y2="328" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="140" y="140" text-anchor="start" font-size="10.5" font-weight="normal" fill="#b85450" filter="url(#rough2)">父 → 子</text>
  <rect x="266" y="68" width="68" height="44" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">&lt;a&gt;</text>
  <rect x="266" y="158" width="68" height="44" rx="9" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="186" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">&lt;b&gt;</text>
  <rect x="266" y="248" width="68" height="44" rx="9" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="276" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">&lt;b&gt;</text>
  <line x1="300" y1="112" x2="300" y2="158" stroke="#888" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <line x1="300" y1="202" x2="300" y2="248" stroke="#888" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="310" y="150" text-anchor="start" font-size="10" font-weight="normal" fill="#888" filter="url(#rough2)">兄弟，不是子</text>
  <rect x="400" y="80" width="310" height="120" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="414" y="104" text-anchor="start" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">匹配成功的例子：</text>
  <text x="414" y="128" text-anchor="start" font-size="11.5" font-weight="normal" fill="#2f5223" filter="url(#rough2)">a ⊃ b ⊃ b（第 1、2、3 个元素）</text>
  <text x="414" y="150" text-anchor="start" font-size="11.5" font-weight="normal" fill="#2f5223" filter="url(#rough2)">链尾是第 3 个元素 → 计数 +1</text>
  <text x="414" y="176" text-anchor="start" font-size="11" font-weight="normal" fill="#4a7a3a" filter="url(#rough2)">第 2 个 a 内部两个 b 是兄弟，</text>
  <text x="414" y="192" text-anchor="start" font-size="11" font-weight="normal" fill="#4a7a3a" filter="url(#rough2)">凑不出 a ⊃ b ⊃ b。</text>
  <rect x="400" y="220" width="310" height="150" rx="9" fill="#fdecea" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="414" y="244" text-anchor="start" font-size="12" font-weight="bold" fill="#8c3a36" filter="url(#rough2)">关键：只用"祖先方向"的信息</text>
  <text x="414" y="268" text-anchor="start" font-size="11" font-weight="normal" fill="#8c3a36" filter="url(#rough2)">每个元素只有一条到根的路径，</text>
  <text x="414" y="286" text-anchor="start" font-size="11" font-weight="normal" fill="#8c3a36" filter="url(#rough2)">所以把"能匹配到第几层"从父亲传下来</text>
  <text x="414" y="304" text-anchor="start" font-size="11" font-weight="normal" fill="#8c3a36" filter="url(#rough2)">即可，完全不用看子树形状。</text>
  <text x="414" y="330" text-anchor="start" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">每个元素只处理一次 ⇒ O(元素数)</text>
  <text x="414" y="352" text-anchor="start" font-size="11" font-weight="normal" fill="#b85450" filter="url(#rough2)">与嵌套深度无关（深度可达 10⁵）</text>
</svg>
