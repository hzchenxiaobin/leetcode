<svg xmlns="http://www.w3.org/2000/svg" width="760" height="240" viewBox="0 0 760 240"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1064"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="760" height="240" fill="#fafafa"/>
  <text x="380.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">实现流程</text>
  <path d="M 121.60000000000001 42 Q 380.0 48 638.4 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="380.0" y="226" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">O(n²) 即可</text>
  <rect x="30.0" y="80" width="128.8" height="54" rx="7" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="94.4" y="105.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">读入 n 台</text>
  <text x="94.4" y="123.0" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">三项参数 + 价格</text>
  <line x1="159.8" y1="107.0" x2="169.8" y2="107.0" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <rect x="172.8" y="80" width="128.8" height="54" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="237.20000000000002" y="105.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#5a7fb0" filter="url(#rough2)">枚举 i</text>
  <text x="237.20000000000002" y="123.0" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">对每个 i 找 j</text>
  <line x1="302.6" y1="107.0" x2="312.6" y2="107.0" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <rect x="315.6" y="80" width="128.8" height="54" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380.0" y="105.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#d6a040" filter="url(#rough2)">存在 j 三项全大?</text>
  <text x="380.0" y="123.0" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">是 → i 过时</text>
  <line x1="445.4" y1="107.0" x2="455.4" y2="107.0" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <rect x="458.40000000000003" y="80" width="128.8" height="54" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="522.8000000000001" y="105.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">未过时里取最便宜</text>
  <text x="522.8000000000001" y="123.0" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">价格唯一</text>
  <line x1="588.2" y1="107.0" x2="598.2" y2="107.0" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <rect x="601.2" y="80" width="128.8" height="54" rx="7" fill="#fbeeee" stroke="#a05a5a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="665.6" y="105.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a05a5a" filter="url(#rough2)">输出编号</text>
  <text x="665.6" y="123.0" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">1 基</text>
</svg>
