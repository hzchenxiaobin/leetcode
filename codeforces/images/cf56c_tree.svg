<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2b2b2b"/>
    </marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arra" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="760" height="470" fill="#fafafa"/>
  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1 的公司树：3 对同名上下级</text>
  <path d="M 220 42 Q 380 48 540 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="334.0" y="58" width="92" height="44" rx="8" fill="#fdecea" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">MIKE</text>
  <rect x="134.0" y="178" width="92" height="44" rx="8" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="206" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">MAX</text>
  <line x1="380" y1="102" x2="180" y2="178" stroke="#8a8a8a" stroke-width="1.5" opacity="1.0" filter="url(#rough2)"/>
  <rect x="334.0" y="178" width="92" height="44" rx="8" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="206" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">ARTEM</text>
  <line x1="380" y1="102" x2="380" y2="178" stroke="#8a8a8a" stroke-width="1.5" opacity="1.0" filter="url(#rough2)"/>
  <rect x="544.0" y="178" width="92" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="590" y="206" text-anchor="middle" font-size="14" font-weight="bold" fill="#d6a040" filter="url(#rough2)">DMITRY</text>
  <line x1="380" y1="102" x2="590" y2="178" stroke="#8a8a8a" stroke-width="1.5" opacity="1.0" filter="url(#rough2)"/>
  <rect x="334.0" y="308" width="92" height="44" rx="8" fill="#fdecea" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="336" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">MIKE</text>
  <line x1="380" y1="222" x2="380" y2="308" stroke="#8a8a8a" stroke-width="1.5" opacity="1.0" filter="url(#rough2)"/>
  <rect x="474.0" y="308" width="92" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="520" y="336" text-anchor="middle" font-size="14" font-weight="bold" fill="#d6a040" filter="url(#rough2)">DMITRY</text>
  <rect x="604.0" y="308" width="92" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="650" y="336" text-anchor="middle" font-size="14" font-weight="bold" fill="#d6a040" filter="url(#rough2)">DMITRY</text>
  <line x1="590" y1="222" x2="520" y2="308" stroke="#8a8a8a" stroke-width="1.5" opacity="1.0" filter="url(#rough2)"/>
  <line x1="590" y1="222" x2="650" y2="308" stroke="#8a8a8a" stroke-width="1.5" opacity="1.0" filter="url(#rough2)"/>
  <path d="M 330 84 Q 200 140 330 300" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="6 4" opacity="1.0" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 630 210 Q 700 280 680 318" stroke="#d6a040" stroke-width="1.8" fill="none" stroke-dasharray="6 4" opacity="1.0" filter="url(#rough2)"/>
  <path d="M 620 214 Q 540 280 540 308" stroke="#d6a040" stroke-width="1.8" fill="none" stroke-dasharray="6 4" opacity="1.0" filter="url(#rough2)"/>
  <text x="200" y="140" text-anchor="start" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">同名：1 对</text>
  <text x="690" y="250" text-anchor="start" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">同名：2 对</text>
  <text x="380" y="404" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">每对 = 一个祖先 + 一个同名后代；兄弟同名不算</text>
  <text x="380" y="434" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#rough2)">总计 1 + 2 = 3</text>
