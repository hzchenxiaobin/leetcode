<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="157"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="430" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按 (花费, 行, 列) 排序后，一次扫描</text>
  <path d="M 150 44 Q 380 50 610 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <text x="34" y="76" font-size="11.5" fill="#555" filter="url(#rough2)">排序后的候选（括号内为左上角行、列）：</text>

  <!-- 卡片 -->
  <g filter="url(#rough2)">
    <rect x="34" y="90" width="92" height="150" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="134" y="90" width="92" height="150" rx="9" fill="#fde8e8" stroke="#b85450" stroke-width="1.5"/>
    <rect x="234" y="90" width="92" height="150" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="334" y="90" width="92" height="150" rx="9" fill="#f4f0f0" stroke="#b0a6a6" stroke-width="1.3"/>
    <rect x="434" y="90" width="92" height="150" rx="9" fill="#f4f0f0" stroke="#b0a6a6" stroke-width="1.3"/>
    <rect x="534" y="90" width="92" height="150" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="634" y="90" width="92" height="150" rx="9" fill="#f4f0f0" stroke="#b0a6a6" stroke-width="1.3"/>
  </g>

  <text x="80" y="116" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">cost</text>
  <text x="180" y="116" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">cost</text>
  <text x="280" y="116" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">cost</text>
  <text x="380" y="116" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">cost</text>
  <text x="480" y="116" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">cost</text>
  <text x="580" y="116" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">cost</text>
  <text x="680" y="116" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">cost</text>

  <text x="80" y="152" text-anchor="middle" font-size="22" font-weight="bold" fill="#2f5223" filter="url(#rough2)">2</text>
  <text x="180" y="152" text-anchor="middle" font-size="22" font-weight="bold" fill="#8a3b36" filter="url(#rough2)">2</text>
  <text x="280" y="152" text-anchor="middle" font-size="22" font-weight="bold" fill="#2f5223" filter="url(#rough2)">3</text>
  <text x="380" y="152" text-anchor="middle" font-size="22" font-weight="bold" fill="#777" filter="url(#rough2)">7</text>
  <text x="480" y="152" text-anchor="middle" font-size="22" font-weight="bold" fill="#777" filter="url(#rough2)">7</text>
  <text x="580" y="152" text-anchor="middle" font-size="22" font-weight="bold" fill="#2f5223" filter="url(#rough2)">9</text>
  <text x="680" y="152" text-anchor="middle" font-size="22" font-weight="bold" fill="#777" filter="url(#rough2)">10</text>

  <text x="80" y="180" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">(3, 1)</text>
  <text x="180" y="180" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">(3, 2)</text>
  <text x="280" y="180" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">(3, 3)</text>
  <text x="380" y="180" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">(2, 1)</text>
  <text x="480" y="180" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">(2, 3)</text>
  <text x="580" y="180" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">(1, 2)</text>
  <text x="680" y="180" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">(1, 3)</text>

  <text x="80" y="212" text-anchor="middle" font-size="20" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓ 选</text>
  <text x="180" y="212" text-anchor="middle" font-size="20" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗ 跳</text>
  <text x="280" y="212" text-anchor="middle" font-size="20" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓ 选</text>
  <text x="380" y="212" text-anchor="middle" font-size="20" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗ 跳</text>
  <text x="480" y="212" text-anchor="middle" font-size="20" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗ 跳</text>
  <text x="580" y="212" text-anchor="middle" font-size="20" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓ 选</text>
  <text x="680" y="212" text-anchor="middle" font-size="20" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗ 跳</text>

  <!-- 说明 -->
  <rect x="34" y="270" width="692" height="60" rx="9" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="52" y="294" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">候选按花费排序；花费相同再按行、列。第二次出现的 (3,2) 与已选的 (3,1) 重叠，永久跳过。</text>
  <text x="52" y="316" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">后续 (2,1)、(2,3) 也都与已选城市重叠；(1,2) 仍可行，所以它是当前最优。</text>

  <rect x="34" y="346" width="692" height="62" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="370" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">关键：已选集合只增不减 ⇒ “重叠”一旦成立就永远成立。</text>
  <text x="52" y="392" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">所以扫描到的第一个可行候选，就是原算法这一轮会选的最小花费候选。</text>
</svg>
