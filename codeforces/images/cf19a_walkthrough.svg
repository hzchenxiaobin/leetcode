<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320" viewBox="0 0 700 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="83"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="700" height="320" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1 的积分榜：A、D 出线</text>

  <g font-size="12" filter="url(#rough2)">
    <text x="70" y="66" fill="#666">队</text>
    <text x="150" y="66" fill="#666">积分</text>
    <text x="240" y="66" fill="#666">进球</text>
    <text x="330" y="66" fill="#666">失球</text>
    <text x="420" y="66" fill="#666">净胜球</text>
    <text x="520" y="66" fill="#666">名次</text>
  </g>
  <g stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)">
    <line x1="60" y1="76" x2="640" y2="76"/>
    <line x1="60" y1="118" x2="640" y2="118"/>
    <line x1="60" y1="160" x2="640" y2="160"/>
    <line x1="60" y1="202" x2="640" y2="202"/>
  </g>
  <g font-size="13" filter="url(#rough2)">
    <text x="70" y="104" font-weight="bold" fill="#2f5223">A</text>
    <text x="150" y="104" fill="#2b2b2b">5</text>
    <text x="240" y="104" fill="#2b2b2b">4</text>
    <text x="330" y="104" fill="#2b2b2b">3</text>
    <text x="420" y="104" fill="#2b2b2b">+1</text>
    <text x="530" y="104" fill="#2f5223" font-weight="bold">2 ✓</text>

    <text x="70" y="146" font-weight="bold" fill="#2f5223">D</text>
    <text x="150" y="146" fill="#2b2b2b">6</text>
    <text x="240" y="146" fill="#2b2b2b">6</text>
    <text x="330" y="146" fill="#2b2b2b">1</text>
    <text x="420" y="146" fill="#2b2b2b">+5</text>
    <text x="530" y="146" fill="#2f5223" font-weight="bold">1 ✓</text>

    <text x="70" y="188" fill="#8f3b37">B</text>
    <text x="150" y="188" fill="#2b2b2b">4</text>
    <text x="240" y="188" fill="#2b2b2b">2</text>
    <text x="330" y="188" fill="#2b2b2b">4</text>
    <text x="420" y="188" fill="#2b2b2b">−2</text>
    <text x="540" y="188" fill="#8f3b37">3</text>

    <text x="70" y="230" fill="#8f3b37">C</text>
    <text x="150" y="230" fill="#2b2b2b">4</text>
    <text x="240" y="230" fill="#2b2b2b">2</text>
    <text x="330" y="230" fill="#2b2b2b">6</text>
    <text x="420" y="230" fill="#2b2b2b">−4</text>
    <text x="540" y="230" fill="#8f3b37">4</text>
  </g>

  <rect x="60" y="256" width="580" height="48" rx="9" fill="#eef4ec" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="76" y="278" font-size="12.5" fill="#2f5223" filter="url(#rough2)">B 与 C 同为 4 分，靠净胜球（−2 &gt; −4）分出先后；前两名是 D、A。</text>
  <text x="76" y="296" font-size="12.5" fill="#2f5223" filter="url(#rough2)">输出按字典序：先 A 后 D。</text>
</svg>
