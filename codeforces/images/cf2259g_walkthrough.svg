<svg xmlns="http://www.w3.org/2000/svg" width="660" height="430" viewBox="0 0 660 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="430" fill="#fafafa"/>

  <text x="330" y="28" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">样例 3 走查：a = [1, 8, 9, 16, 20]，k = 7</text>
  <text x="330" y="50" text-anchor="middle" font-size="11.5" fill="#888"
        filter="url(#rough2)">缝余量 sᵤ = k − (aᵤ₊₁ − aᵤ)，前缀和 S[t] = Σᵤ&lt;ₜ sᵤ</text>

  <!-- 数组与缝 -->
  <rect x="154" y="68" width="64" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="226" y="68" width="64" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="298" y="68" width="64" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="370" y="68" width="64" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="442" y="68" width="64" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <g font-size="16" font-weight="bold" fill="#2b2b2b" text-anchor="middle">
    <text x="186" y="94" filter="url(#rough2)">1</text>
    <text x="258" y="94" filter="url(#rough2)">8</text>
    <text x="330" y="94" filter="url(#rough2)">9</text>
    <text x="402" y="94" filter="url(#rough2)">16</text>
    <text x="474" y="94" filter="url(#rough2)">20</text>
  </g>
  <g font-size="9.5" text-anchor="middle">
    <text x="222" y="122" fill="#999" filter="url(#rough2)">Δ=7</text>
    <text x="294" y="122" fill="#999" filter="url(#rough2)">Δ=1</text>
    <text x="366" y="122" fill="#999" filter="url(#rough2)">Δ=7</text>
    <text x="438" y="122" fill="#999" filter="url(#rough2)">Δ=4</text>
    <text x="222" y="136" fill="#4a7a3a" filter="url(#rough2)">s=0</text>
    <text x="294" y="136" fill="#4a7a3a" filter="url(#rough2)">s=6</text>
    <text x="366" y="136" fill="#4a7a3a" filter="url(#rough2)">s=0</text>
    <text x="438" y="136" fill="#4a7a3a" filter="url(#rough2)">s=3</text>
  </g>
  <g font-size="10.5" fill="#446688" text-anchor="middle">
    <text x="186" y="162" filter="url(#rough2)">S=0</text>
    <text x="258" y="162" filter="url(#rough2)">S=0</text>
    <text x="330" y="162" filter="url(#rough2)">S=6</text>
    <text x="402" y="162" filter="url(#rough2)">S=6</text>
    <text x="474" y="162" filter="url(#rough2)">S=9</text>
  </g>

  <!-- 表格 -->
  <rect x="76" y="180" width="508" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="76" y="206" width="508" height="26" fill="#ffffff" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="76" y="232" width="508" height="26" fill="#fbfbfb" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="76" y="258" width="508" height="26" fill="#ffffff" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <rect x="76" y="284" width="508" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="76" y="310" width="508" height="26" fill="#ffffff" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <g font-size="11" fill="#555" text-anchor="middle">
    <text x="112" y="198" filter="url(#rough2)">i</text>
    <text x="204" y="198" filter="url(#rough2)">eᵢ</text>
    <text x="330" y="198" filter="url(#rough2)">V = eᵢ + S[i+1]</text>
    <text x="436" y="198" filter="url(#rough2)">R</text>
    <text x="525" y="198" filter="url(#rough2)">答案</text>
  </g>
  <g font-size="11" fill="#2b2b2b" text-anchor="middle">
    <text x="112" y="224" filter="url(#rough2)">1</text>
    <text x="204" y="224" filter="url(#rough2)">—</text>
    <text x="330" y="224" filter="url(#rough2)">—</text>
    <text x="436" y="224" filter="url(#rough2)">—</text>
    <text x="525" y="224" filter="url(#rough2)">0</text>

    <text x="112" y="250" filter="url(#rough2)">2</text>
    <text x="204" y="250" filter="url(#rough2)">9−1−7=1</text>
    <text x="330" y="250" filter="url(#rough2)">1+S₃=7</text>
    <text x="436" y="250" filter="url(#rough2)">4</text>
    <text x="525" y="250" fill="#b85450" filter="url(#rough2)">2</text>

    <text x="112" y="276" filter="url(#rough2)">3</text>
    <text x="204" y="276" filter="url(#rough2)">16−8−7=1</text>
    <text x="330" y="276" filter="url(#rough2)">1+S₄=7</text>
    <text x="436" y="276" filter="url(#rough2)">4</text>
    <text x="525" y="276" fill="#b85450" filter="url(#rough2)">1</text>

    <text x="112" y="302" filter="url(#rough2)">4</text>
    <text x="204" y="302" filter="url(#rough2)">20−9−7=4</text>
    <text x="330" y="302" filter="url(#rough2)">4+S₅=13</text>
    <text x="436" y="302" filter="url(#rough2)">5</text>
    <text x="525" y="302" fill="#b85450" filter="url(#rough2)">4</text>

    <text x="112" y="328" filter="url(#rough2)">5</text>
    <text x="204" y="328" filter="url(#rough2)">—</text>
    <text x="330" y="328" filter="url(#rough2)">—</text>
    <text x="436" y="328" filter="url(#rough2)">—</text>
    <text x="525" y="328" filter="url(#rough2)">0</text>
  </g>
  <g stroke="#e2e2e2" stroke-width="1">
    <path d="M152,180 L152,336" filter="url(#rough2)"/>
    <path d="M262,180 L262,336" filter="url(#rough2)"/>
    <path d="M400,180 L400,336" filter="url(#rough2)"/>
    <path d="M476,180 L476,336" filter="url(#rough2)"/>
  </g>

  <text x="330" y="368" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold"
        filter="url(#rough2)">输出 0 2 1 4 0，与官方样例第 3 组一致 ✓</text>
  <text x="330" y="392" text-anchor="middle" font-size="10.5" fill="#666"
        filter="url(#rough2)">以 i=4 为例：e = 20−9−7 = 4，V = 4+S₅ = 13，只有 S₅ = 9 &lt; 13 ⇒ 答案 = (5−4)·13 − 9 = 4</text>
  <text x="330" y="412" text-anchor="middle" font-size="10.5" fill="#999"
        filter="url(#rough2)">i=1、i=5 删的是首/尾元素，没有产生新缝，答案恒为 0</text>
</svg>
