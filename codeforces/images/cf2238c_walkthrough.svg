<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="400" fill="#fafafa"/>

  <text x="380" y="28" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 3 走查：n = 7，p = (1, 2, 1, 3, 5, 5)</text>
  <path d="M 156 38 Q 380 46 604 38" stroke="#2b2b2b" stroke-width="1.1" fill="none" filter="url(#rough2)"/>

  <!-- 树 -->
  <path d="M 150 80 L 80 148" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 150 80 L 222 148" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 80 148 L 80 212" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 80 212 L 80 276" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 80 276 L 46 340" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 80 276 L 114 340" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <circle cx="150" cy="80" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="150" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">1</text>

  <circle cx="80" cy="148" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="80" y="154" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">2</text>

  <circle cx="222" cy="148" r="17" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="222" y="154" text-anchor="middle" font-size="14" fill="#5a6b7a" filter="url(#rough2)">4</text>

  <circle cx="80" cy="212" r="17" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="218" text-anchor="middle" font-size="14" fill="#5a6b7a" filter="url(#rough2)">3</text>

  <circle cx="80" cy="276" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="80" y="282" text-anchor="middle" font-size="14" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">5</text>

  <circle cx="46" cy="340" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="46" y="346" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">6</text>

  <circle cx="114" cy="340" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="114" y="346" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">7</text>

  <text x="172" y="84" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">h=4</text>
  <text x="102" y="152" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">h=3</text>
  <text x="242" y="152" font-size="11.5" fill="#5a6b7a" filter="url(#rough2)">h=0</text>
  <text x="102" y="216" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">h=2</text>
  <text x="102" y="280" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">h=1</text>
  <text x="66" y="344" font-size="11.5" fill="#8a6015" filter="url(#rough2)">h=0</text>
  <text x="134" y="344" font-size="11.5" fill="#8a6015" filter="url(#rough2)">h=0</text>

  <text x="26" y="380" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">绿色 u：贡献非 0，其余贡献 0</text>

  <!-- 表 -->
  <rect x="292" y="46" width="448" height="338" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="330" y="82" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a2a26" filter="url(#rough2)">u</text>
  <text x="424" y="82" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a2a26" filter="url(#rough2)">儿子高度</text>
  <text x="536" y="82" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a2a26" filter="url(#rough2)">b₂(u)</text>
  <text x="646" y="82" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a2a26" filter="url(#rough2)">新增集合</text>
  <line x1="306" y1="94" x2="726" y2="94" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>

  <text x="330" y="122" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="424" y="122" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">3, 0</text>
  <text x="536" y="122" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="646" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">1</text>

  <text x="330" y="152" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="424" y="152" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="536" y="152" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="646" y="152" text-anchor="middle" font-size="13" fill="#5a6b7a" filter="url(#rough2)">0</text>

  <text x="330" y="182" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="424" y="182" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="536" y="182" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="646" y="182" text-anchor="middle" font-size="13" fill="#5a6b7a" filter="url(#rough2)">0</text>

  <text x="330" y="212" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <text x="424" y="212" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">0, 0</text>
  <text x="536" y="212" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="646" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">1</text>

  <text x="330" y="242" text-anchor="middle" font-size="13" fill="#5a6b7a" filter="url(#rough2)">其余</text>
  <text x="424" y="242" text-anchor="middle" font-size="13" fill="#5a6b7a" filter="url(#rough2)">—</text>
  <text x="536" y="242" text-anchor="middle" font-size="13" fill="#5a6b7a" filter="url(#rough2)">0</text>
  <text x="646" y="242" text-anchor="middle" font-size="13" fill="#5a6b7a" filter="url(#rough2)">0</text>
  <line x1="306" y1="258" x2="726" y2="258" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>

  <text x="316" y="288" font-size="13.5" font-weight="bold" fill="#8a2a26" filter="url(#rough2)">答案 = 7（单点）+ 1 + 1 = 9</text>
  <text x="316" y="316" font-size="12" fill="#2b2b2b" filter="url(#rough2)">u = 1：d = 1 得 {2, 4}，LCA = 1</text>
  <text x="316" y="340" font-size="12" fill="#2b2b2b" filter="url(#rough2)">u = 5：d = 4 得 {6, 7}，LCA = 5</text>
  <text x="316" y="364" font-size="12" fill="#5a6b7a" filter="url(#rough2)">其余层只有一个分支，归更深的点</text>
</svg>
