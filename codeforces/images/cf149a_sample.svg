<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="393"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="250" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">样例 3：k = 11，增益 5 4 4 …</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">前两个只有 9，第三个到 13</text>
  <text x="450" y="104" text-anchor="middle" font-size="14" fill="#8a2b28" filter="url(#rough2)">5 + 4 = 9 &lt; 11</text>
  <text x="450" y="140" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5 + 4 + 4 = 13 ≥ 11</text>
  <text x="450" y="186" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 3 个月</text>
  <text x="450" y="222" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">样例 1：3 + 2 = 5 ≥ 5 ⇒ 2 个月；样例 2：k = 0 ⇒ 0 个月</text>
</svg>
