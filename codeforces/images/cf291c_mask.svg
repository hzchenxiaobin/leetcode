<svg xmlns="http://www.w3.org/2000/svg" width="880" height="280" viewBox="0 0 880 280"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="280" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">枚举前缀长度 L</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">最少 1 的个数 = 最小的可行 L</text>
  <text x="150" y="110" text-anchor="start" font-size="13" fill="#2b2b2b" filter="url(#rough2)">掩码 = 32 位中前 L 个 1、后 32-L 个 0（1 &lt;= L &lt;= 31）</text>
  <text x="150" y="152" text-anchor="start" font-size="13" fill="#2f4a66" filter="url(#rough2)">L 越大网络越细，网络数随 L 单调不减</text>
  <text x="150" y="196" text-anchor="start" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">排序后统计不同前缀数 = 网络数；取最小的 L 使网络数恰为 k</text>
</svg>
