<svg xmlns="http://www.w3.org/2000/svg" width="730" height="290" viewBox="0 0 730 290"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="730" height="290" fill="#fafafa"/>
  <text x="365.0" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">214B：能被 30 整除的构造</text>
  <path d="M 146.00 46 Q 365.0 52 584.00 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60" y="78" width="290" height="110" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="95" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">能被 2、3、5 整除 ⟺ 能被 30 整除</text>
  <text x="74" y="116" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">⇒ 末位必须是 0，且各位数字和 ≡ 0 mod 3</text>
  <text x="74" y="137" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">没有 0 ⇒ 无解（输出 −1）</text>
  <rect x="380" y="78" width="290" height="132" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="394" y="95" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">设非零数字和 sum：</text>
  <text x="394" y="116" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">sum%3==1：删一个 %3==1 的最小数字</text>
  <text x="394" y="137" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">       否则删两个 %3==2 的最小数字</text>
  <text x="394" y="158" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">sum%3==2 对称处理</text>
  <text x="60" y="196" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">删完后按数字降序输出，末尾接上所有 0；若没有非零数字剩 ⇒ 输出 0。</text>
</svg>
