<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="263"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="720" height="420" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">容斥：两类各 C(2n−1, n) 个，交集是 n 个常数数组</text>
  <path d="M 90 40 Q 360 46 630 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 韦恩图 -->
  <g filter="url(#rough2)">
    <circle cx="270" cy="180" r="108" fill="#e6f4ea" fill-opacity="0.75" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="430" cy="180" r="108" fill="#e8f0fe" fill-opacity="0.65" stroke="#446688" stroke-width="2"/>
    <text x="196" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223">非递减</text>
    <text x="196" y="140" text-anchor="middle" font-size="11.5" fill="#3c5e2e">C(2n−1, n) 个</text>
    <text x="508" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66">非递增</text>
    <text x="508" y="140" text-anchor="middle" font-size="11.5" fill="#2f4a66">C(2n−1, n) 个</text>
    <text x="350" y="176" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015">交集</text>
    <text x="350" y="196" text-anchor="middle" font-size="11.5" fill="#8a6015">n 个常数数组</text>
    <text x="350" y="214" text-anchor="middle" font-size="11" fill="#8a6015">(v,v,…,v)</text>
  </g>

  <!-- 公式 -->
  <g filter="url(#rough2)">
    <rect x="60" y="296" width="600" height="104" rx="12" fill="#ffffff" stroke="#b85450" stroke-width="1.8"/>
    <text x="76" y="320" font-size="12" fill="#555">既非递减又非递增 ⇒ 相邻两项互相「不大于」又「不小于」⇒ 全部相等。</text>
    <text x="76" y="344" font-size="13" font-weight="bold" fill="#2b2b2b">|A ∪ B| = |A| + |B| − |A ∩ B|</text>
    <text x="76" y="368" font-size="13.5" font-weight="bold" fill="#b85450">答案 = 2·C(2n−1, n) − n　（mod 1e9+7）</text>
    <text x="76" y="390" font-size="11" fill="#666">n=3：2·C(5,3) − 3 = 2·10 − 3 = 17，与官方样例一致。</text>
  </g>

</svg>
