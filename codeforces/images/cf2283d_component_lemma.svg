<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 404" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="404" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="13.5" fill="#444" font-weight="bold" filter="url(#rough2)">判定引理：m 在路径 (a,b) 上 ⟺ a、b 属于 T−{m} 的不同连通块</text>

  <!-- subtree regions -->
  <ellipse cx="158" cy="94" rx="112" ry="62" fill="#e8f0fe" opacity="0.75" filter="url(#rough2)"/>
  <ellipse cx="462" cy="94" rx="112" ry="62" fill="#e6f4ea" opacity="0.75" filter="url(#rough2)"/>
  <ellipse cx="310" cy="340" rx="102" ry="56" fill="#fff8e1" opacity="0.8" filter="url(#rough2)"/>

  <!-- edges m - children -->
  <line x1="310" y1="210" x2="158" y2="120" stroke="#7d8b99" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="310" y1="210" x2="462" y2="120" stroke="#7d8b99" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="310" y1="210" x2="310" y2="320" stroke="#7d8b99" stroke-width="1.6" filter="url(#rough2)"/>
  <!-- edges children - leaves -->
  <line x1="158" y1="120" x2="97" y2="62" stroke="#7d8b99" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="158" y1="120" x2="218" y2="62" stroke="#7d8b99" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="462" y1="120" x2="402" y2="62" stroke="#7d8b99" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="462" y1="120" x2="522" y2="62" stroke="#7d8b99" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="310" y1="320" x2="252" y2="374" stroke="#7d8b99" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="310" y1="320" x2="368" y2="374" stroke="#7d8b99" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- highlighted path a - c1 - m - c2 - b -->
  <path d="M 97 62 L 158 120 L 310 210 L 462 120 L 522 62" fill="none" stroke="#b85450" stroke-width="2.6" stroke-dasharray="7 4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- nodes -->
  <circle cx="310" cy="210" r="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="310" y="216" text-anchor="middle" font-size="14" fill="#8a3b37" font-weight="bold" filter="url(#rough2)">m</text>

  <circle cx="158" cy="120" r="17" fill="#dce8f8" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="158" y="126" text-anchor="middle" font-size="12" fill="#2c4a66" filter="url(#rough2)">c₁</text>
  <circle cx="462" cy="120" r="17" fill="#dcead9" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="462" y="126" text-anchor="middle" font-size="12" fill="#2f5220" filter="url(#rough2)">c₂</text>
  <circle cx="310" cy="320" r="17" fill="#fdf0c8" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="310" y="326" text-anchor="middle" font-size="12" fill="#6b4e12" filter="url(#rough2)">c₃</text>

  <circle cx="97" cy="62" r="14" fill="#dce8f8" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="97" y="67" text-anchor="middle" font-size="12" fill="#2c4a66" filter="url(#rough2)">a</text>
  <circle cx="218" cy="62" r="14" fill="#dce8f8" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="218" y="67" text-anchor="middle" font-size="12" fill="#2c4a66" filter="url(#rough2)">a′</text>
  <circle cx="402" cy="62" r="14" fill="#dcead9" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="402" y="67" text-anchor="middle" font-size="12" fill="#2f5220" filter="url(#rough2)">b′</text>
  <circle cx="522" cy="62" r="14" fill="#dcead9" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="522" y="67" text-anchor="middle" font-size="12" fill="#2f5220" filter="url(#rough2)">b</text>
  <circle cx="252" cy="374" r="13" fill="#fdf0c8" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="368" cy="374" r="13" fill="#fdf0c8" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>

  <text x="310" y="98" text-anchor="middle" font-size="11.5" fill="#8a3b37" filter="url(#rough2)">不同块 ⇒ 唯一路径必穿过 m</text>

  <!-- legend boxes -->
  <rect x="26" y="252" width="252" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="152" y="274" text-anchor="middle" font-size="10.5" fill="#2c4a66" filter="url(#rough2)">同块（如 a 与 a′）：路径绕开 m</text>
  <text x="152" y="291" text-anchor="middle" font-size="10.5" fill="#2c4a66" filter="url(#rough2)">⇒ m 颜色不变</text>

  <rect x="342" y="252" width="252" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="468" y="274" text-anchor="middle" font-size="10.5" fill="#8a3b37" filter="url(#rough2)">不同块（如 a 与 b）：路径必过 m</text>
  <text x="468" y="291" text-anchor="middle" font-size="10.5" fill="#8a3b37" filter="url(#rough2)">⇒ m 若仍为白则变灰，且永不再变</text>

  <text x="310" y="399" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">每个 k 只需一次 O(n) 标号：comp[v] = 从 m 出发经过的哪个邻居</text>
</svg>
