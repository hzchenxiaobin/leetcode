<svg xmlns="http://www.w3.org/2000/svg" width="700" height="280" viewBox="0 0 700 280"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="199"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="700" height="280" fill="#fafafa"/>
  <text x="390" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">相邻两人胜场相同：两种补法都与已知结果一致</text>
  <path d="M 140 40 Q 390 46 640 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60" y="80" width="120" height="46" rx="8" fill="#cfe0f5" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="120" y="109" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">u（更强）</text>
  <rect x="240" y="80" width="120" height="46" rx="8" fill="#fbe3c8" stroke="#c98a2b" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="300" y="109" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">v（更弱）</text>
  <text x="380" y="109" font-size="12" fill="#777777" filter="url(#rough2)">← 序中相邻，中间没有第三人</text>
  <text x="60" y="170" font-size="12" fill="#2b2b2b" filter="url(#rough2)">已知 w(u) = w(v) = k；补 u 赢 → (k+1, k)；补 v 赢 → (k, k+1)。</text>
  <text x="60" y="198" font-size="12" fill="#2b2b2b" filter="url(#rough2)">两种都满足“强者胜场不少于弱者”，都不会与任何已给结果冲突。</text>
  <text x="60" y="238" font-size="12.5" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">所以相等时输出任意方向都合法（题面允许多解）。</text>

</svg>
