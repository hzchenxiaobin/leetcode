<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="470" fill="#fafafa"/>

  <text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">区间 DP：枚举根的位置 p，把「右链长度」当状态</text>

  <text x="52" y="62" font-size="12" fill="#666" filter="url(#rough2)">区间 [l, r]（共 len = r−l+1 个位置）</text>

  <rect x="52" y="74" width="46" height="36" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="75" y="98" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">l</text>
  <rect x="102" y="74" width="46" height="36" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="125" y="98" text-anchor="middle" font-size="12" fill="#7b8fa6" filter="url(#rough2)">…</text>
  <rect x="152" y="74" width="46" height="36" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="175" y="98" text-anchor="middle" font-size="12" fill="#7b8fa6" filter="url(#rough2)">…</text>
  <rect x="202" y="74" width="46" height="36" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="225" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">p</text>
  <rect x="252" y="74" width="46" height="36" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="275" y="98" text-anchor="middle" font-size="12" fill="#7b8fa6" filter="url(#rough2)">…</text>
  <rect x="302" y="74" width="46" height="36" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="325" y="98" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">r</text>
  <text x="225" y="128" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">根（区间最小值）</text>

  <path d="M 200 132 L 150 168" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 250 132 L 330 168" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <rect x="40" y="172" width="230" height="86" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="155" y="196" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">左子树 [l, p−1]</text>
  <text x="155" y="218" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">根的右链长度必须等于 </text>
  <text x="155" y="238" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">a_p（a_p = 0 时要求左子树为空）</text>

  <rect x="300" y="172" width="230" height="86" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="415" y="196" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">右子树 [p+1, r]</text>
  <text x="415" y="218" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">根的右链长度 = k − 1</text>
  <text x="415" y="238" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">（k = 1 时右子树必须为空）</text>

  <rect x="552" y="172" width="176" height="86" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="640" y="196" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">拉平右链</text>
  <text x="640" y="218" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">根的右链</text>
  <text x="640" y="238" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">= 根 → 右子树的链</text>

  <rect x="40" y="272" width="688" height="82" rx="10" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="384" y="298" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">f[l][r][k] = Σ over p of C(r−l, p−l) · L(l, p−1, a_p) · f[p+1][r][k−1]</text>
  <text x="384" y="322" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">C(r−l, p−l)：从 r−l 个数里挑 p−l 个给左子树（左右子树内部相对序只需各自计数）</text>
  <text x="384" y="344" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">L 取值为：a_p = −1 → G[l][p−1]；a_p = 0 → 1 if p = l else 0；a_p = t &gt; 0 → f[l][p−1][t]</text>

  <rect x="40" y="366" width="688" height="88" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="384" y="390" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8f3a37" filter="url(#rough2)">关键剪枝：每个数最多被弹一次 ⇒ Σb_i ≤ n，所以 Σa_i &gt; n 直接输出 0</text>
  <text x="384" y="414" text-anchor="middle" font-size="12" fill="#8f3a37" filter="url(#rough2)">区间 [l,r] 只会作为 r+1 的左子树 ⇒ 只存 k ≤ a_{r+1}；a_{r+1} = −1 时只留总和 G</text>
  <text x="384" y="438" text-anchor="middle" font-size="12" fill="#8f3a37" filter="url(#rough2)">状态数 O(n·Σa_i) = O(n²)，转移 O(n) ⇒ 时间 O(n³)、空间 O(n²)</text>
</svg>
