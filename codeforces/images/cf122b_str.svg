<svg xmlns="http://www.w3.org/2000/svg" width="884" height="340" viewBox="0 0 884 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="121"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="884" height="340" fill="#fafafa"/>
  <text x="442" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">答案一定是单个数字 4 或 7</text>
  <text x="442" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">任何长幸运串的出现次数 ≤ 其中某个数字的出现次数</text>
  <g filter="url(#rough2)"><rect x="90" y="96" width="700" height="54" rx="4" fill="#d7ecd0" fill-opacity="0.45" stroke="#6a9a58" stroke-width="1.3"/></g>
  <text x="440" y="128" text-anchor="middle" font-size="12" fill="#3d6b2f" filter="url(#rough2)">count(T) ≤ count('4') 或 ≤ count('7')（按首次出现的字符计）</text>
  <text x="440" y="186" text-anchor="middle" font-size="12" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">所以只需比较 4 与 7 的出现次数；相等时取字典序更小的 '4'</text>
  <g filter="url(#rough2)"><rect x="90" y="216" width="700" height="50" rx="4" fill="#f6d9d7" fill-opacity="0.4" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="440" y="246" text-anchor="middle" font-size="12" fill="#8a2b28" filter="url(#rough2)">两者都为 0 → 输出 -1</text>
</svg>
