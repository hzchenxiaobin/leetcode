  <text x="115.0" y="151.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#26405c" filter="url(#rough2)">a</text>
  <rect x="144.0" y="122.0" width="50.0" height="44.0" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="169.0" y="151.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#26405c" filter="url(#rough2)">b</text>
  <rect x="198.0" y="122.0" width="50.0" height="44.0" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="223.0" y="151.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#26405c" filter="url(#rough2)">d</text>
  <rect x="90.0" y="174.0" width="50.0" height="44.0" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="115.0" y="203.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#26405c" filter="url(#rough2)">a</text>
  <rect x="144.0" y="174.0" width="50.0" height="44.0" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="169.0" y="203.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#26405c" filter="url(#rough2)">b</text>
