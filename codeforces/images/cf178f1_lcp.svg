  <text x="223.0" y="203.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#26405c" filter="url(#rough2)">e</text>
  <path d="M 260 70 L 268 70 M 260 122 L 268 122" stroke="#6b6b6b" stroke-width="1.0" fill="none" filter="url(#rough2)"/>
  <rect x="300.0" y="70.0" width="400.0" height="146.0" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="316.0" y="96.0" text-anchor="start" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">f(abc,abd) = 2</text>
  <text x="316.0" y="118.0" text-anchor="start" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">f(abc,abe) = 2</text>
  <text x="316.0" y="140.0" text-anchor="start" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">f(abd,abe) = 2</text>
  <text x="316.0" y="168.0" text-anchor="start" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">总和 = 6（与题面例子一致）</text>
  <text x="316.0" y="194.0" text-anchor="start" font-size="10.8" fill="#6b6b6b" filter="url(#rough2)">空集/单元素集合的值为 0</text>
  <rect x="70.0" y="250.0" width="640.0" height="50.0" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="84.0" y="274.0" text-anchor="start" font-size="11.4" fill="#2f5b34" filter="url(#rough2)">把它拆到前缀（trie）上：每个前缀 p 被选中的 c 个串共享，贡献 C(c,2)。</text>
  <text x="84.0" y="292.0" text-anchor="start" font-size="11.4" fill="#2f5b34" filter="url(#rough2)">于是“选 k 个串使总和最大”变成前缀树上的 DP。</text>
