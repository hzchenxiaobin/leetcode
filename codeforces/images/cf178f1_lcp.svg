    </marker>
  </defs>
  <rect width="760" height="360" fill="#fafafa"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">representativity = 所有无序对的 LCP 之和</text>
  <path d="M 178.40000000000003 46 Q 380.0 52 581.5999999999999 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
