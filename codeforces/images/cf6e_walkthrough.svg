<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 3：h = 8 19 10 13，k = 5，答案 2 1 → 3 4</text>
  <path d="M 130 44 Q 360 50 590 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <g stroke="#446688" stroke-width="1.6" fill="#e8f0fe" filter="url(#rough2)">
    <rect x="119" y="181" width="62" height="59"/>
    <rect x="254" y="100" width="62" height="140"/>
    <rect x="389" y="166" width="62" height="74"/>
    <rect x="524" y="144" width="62" height="96"/>
  </g>
  <line x1="95" y1="240" x2="615" y2="240" stroke="#2b2b2b" stroke-width="1.6" filter="url(#rough2)"/>
  <g font-size="13" font-weight="bold" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">
    <text x="150" y="173">8</text><text x="285" y="92">19</text>
    <text x="420" y="158">10</text><text x="555" y="136">13</text>
  </g>

  <!-- 长度 2 的窗口 -->
  <g stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)">
    <path d="M 119 252 L 119 262 L 316 262 L 316 252"/>
    <path d="M 254 252 L 254 262 L 451 262 L 451 252"/>
    <path d="M 389 252 L 389 262 L 586 262 L 586 252"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">
    <text x="217" y="282">差 11 ✗</text>
    <text x="352" y="282">差 9 ✗</text>
    <text x="487" y="282" fill="#2f5223">差 3 ✓</text>
  </g>

  <!-- 长度 3 的窗口 -->
  <g stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="5 3" filter="url(#rough2)">
    <path d="M 119 296 L 119 306 L 451 306 L 451 296"/>
    <path d="M 254 296 L 254 306 L 586 306 L 586 296"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#a33a36" filter="url(#rough2)">
    <text x="285" y="326">差 11 ✗</text>
    <text x="420" y="326">差 9 ✗</text>
  </g>

  <rect x="40" y="344" width="640" height="74" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <g font-size="12" fill="#7a5a1b" filter="url(#rough2)">
    <text x="56" y="372">长度 1 全合法；长度 2 只有 [3,4] 合法；长度 3 全部非法。</text>
    <text x="56" y="398">故 a = 2、b = 1，满足条件的时间段是 3 4（第 3、4 本）。</text>
  </g>
</svg>
