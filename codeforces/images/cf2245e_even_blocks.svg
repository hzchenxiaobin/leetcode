<svg xmlns="http://www.w3.org/2000/svg" width="740" height="400" viewBox="0 0 740 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="740" height="400" fill="#fafafa"/>
  <text x="370" y="30" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">计数转化：奇度端点 + 偶度内部 ⇒ 偶块组合数</text>
  <text x="370" y="52" text-anchor="middle" font-size="11.5" fill="#888888"
        filter="url(#rough2)">合法的首条路径只有两类：相邻两点都奇；或者隔着同一个「偶度连通块」</text>

  <path d="M 85 110 L 170 185 L 280 185 L 365 260" stroke="#d6a040" stroke-width="7"
        fill="none" opacity="0.28" stroke-linecap="round" filter="url(#rough2)"/>
  <line x1="85" y1="110" x2="170" y2="185" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <line x1="85" y1="260" x2="170" y2="185" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <line x1="170" y1="185" x2="280" y2="185" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <line x1="280" y1="185" x2="365" y2="110" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <line x1="280" y1="185" x2="365" y2="260" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>

  <rect x="128" y="146" width="194" height="78" rx="10" fill="none" stroke="#4a7a3a"
        stroke-width="1.7" stroke-dasharray="7 5" filter="url(#rough2)"/>

  <circle cx="170" cy="185" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="191" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">偶</text>
  <circle cx="280" cy="185" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="191" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">偶</text>
  <circle cx="85" cy="110" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="85" y="116" text-anchor="middle" font-size="12" fill="#8a6d20" filter="url(#rough2)">奇</text>
  <circle cx="85" cy="260" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="85" y="266" text-anchor="middle" font-size="12" fill="#8a6d20" filter="url(#rough2)">奇</text>
  <circle cx="365" cy="110" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="365" y="116" text-anchor="middle" font-size="12" fill="#8a6d20" filter="url(#rough2)">奇</text>
  <circle cx="365" cy="260" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="365" y="266" text-anchor="middle" font-size="12" fill="#8a6d20" filter="url(#rough2)">奇</text>

  <text x="225" y="243" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">偶块 C（只用偶-偶边连通）</text>
  <text x="225" y="278" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">k_C = 4（块上挂着的奇度邻居）</text>
  <text x="225" y="298" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">贡献 C(4,2) = 6 条合法路径</text>

  <rect x="450" y="88" width="252" height="216" rx="9" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="468" y="112" text-anchor="start" font-size="12.5" font-weight="bold" fill="#4a7a3a"
        filter="url(#rough2)">ans = E奇奇 + Σ C(k_C,2)</text>
  <text x="468" y="136" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">E奇奇 = 两端度数都奇的边数</text>
  <text x="468" y="158" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">k_C = 偶块 C 的奇度邻居数</text>
  <text x="468" y="188" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">· 同一个奇点与同一块之间</text>
  <text x="468" y="206" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">  最多一条边（否则成环）</text>
  <text x="468" y="228" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">· k_C 必为偶数：块内度数</text>
  <text x="468" y="246" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">  之和 = 2|E(C)| + k_C</text>
  <text x="468" y="268" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">· 树上路径唯一 ⇒ 每个</text>
  <text x="468" y="286" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">  合法端点对恰好被数一次</text>

  <rect x="40" y="318" width="662" height="66" rx="9" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="58" y="342" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">① u、v 相邻且度数都奇：路径没有内部点，天然合法 ⇒ 直接数这样的边。</text>
  <text x="58" y="368" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">② u、v 挂在同一个偶块上：路径内部全在块里 ⇒ 合法；挂在不同块上，中间必经奇点 ⇒ 非法。</text>
</svg>
