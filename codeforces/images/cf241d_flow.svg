<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="83"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="f" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="330" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">三种情形分别处理：按 p 与 n 分流</text>

  <g filter="url(#rough2)">
    <rect x="40" y="52" width="300" height="66" rx="10" fill="#fde9d9" stroke="#b4652a" stroke-width="1.8"/>
    <rect x="380" y="52" width="300" height="66" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="380" y="150" width="300" height="66" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="380" y="248" width="300" height="66" rx="10" fill="#f3edf8" stroke="#7a4a9a" stroke-width="1.8"/>
  </g>
  <g font-size="12" fill="#2b2b2b" filter="url(#rough2)">
    <text x="56" y="76" fill="#7a4b22" font-weight="bold">情形 1：p = 2 或 p = 5</text>
    <text x="56" y="98">余数只看最后一个元素 a_j 的末位</text>
    <text x="56" y="114">→ 线性基找前缀子集，O(16n)</text>

    <text x="396" y="76" fill="#2f5223" font-weight="bold">情形 2：n ≤ 44</text>
    <text x="396" y="98">对全部 n 个元素折半枚举</text>
    <text x="396" y="114">2^22 + 2^22，判定精确（含 No）</text>

    <text x="396" y="174" fill="#2f4a66" font-weight="bold">情形 3：n &gt; 44</text>
    <text x="396" y="196">取 42 个元素（首 / 尾 / 中 / 随机）</text>
    <text x="396" y="212">折半枚举，最多试 8 个窗口</text>

    <text x="396" y="272" fill="#4a2a62" font-weight="bold">8 个窗口都失败才输出 No</text>
    <text x="396" y="294">单个窗口失败概率 ≈ e^(−1300)</text>
    <text x="396" y="310">实际数据里等同于不可能</text>
  </g>

  <g stroke="#446688" stroke-width="1.6" filter="url(#rough2)">
    <line x1="340" y1="85" x2="376" y2="85" marker-end="url(#f)"/>
    <line x1="530" y1="118" x2="530" y2="146" marker-end="url(#f)"/>
    <line x1="530" y1="216" x2="530" y2="244" marker-end="url(#f)"/>
  </g>
  <g font-size="11" fill="#446688" filter="url(#rough2)">
    <text x="348" y="78">否则</text>
    <text x="536" y="138">否则</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="150" width="300" height="164" rx="9" fill="#eef6ec" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <g font-size="11.5" fill="#2f5223" filter="url(#rough2)">
    <text x="54" y="172" font-weight="bold">为什么 42 个元素就够（计数论证）</text>
    <text x="54" y="194">· 42 个数在 GF(2)^16 里，</text>
    <text x="54" y="212">  零异或子集至少 2^(42−16)=2^26 个</text>
    <text x="54" y="234">· 余数落在 p ≤ 50000 个桶里，</text>
    <text x="54" y="252">  期望命中 ≈ 2^26 / 50000 ≈ 1300 个</text>
    <text x="54" y="274">· 要求全部 2^26 个都避开 0 号桶，</text>
    <text x="54" y="292">  概率 ≈ e^(−1300)</text>
    <text x="54" y="308" fill="#7a4b22">（是概率论证，不是形式化证明）</text>
  </g>
</svg>
