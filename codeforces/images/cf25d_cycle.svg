<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="720" height="320" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">并查集扫边：两端已连通 ⇒ 这条边在环上，可以拆</text>

  <!-- 三角形 1-2-3 -->
  <g stroke="#c9ced6" stroke-width="2" filter="url(#rough2)">
    <line x1="150" y1="110" x2="270" y2="110"/>
    <line x1="270" y1="110" x2="210" y2="200"/>
  </g>
  <line x1="210" y1="200" x2="150" y2="110" stroke="#b85450" stroke-width="2.6" stroke-dasharray="7 4" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <circle cx="150" cy="110" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="150" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66">1</text>
    <circle cx="270" cy="110" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="270" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66">2</text>
    <circle cx="210" cy="200" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="210" y="206" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66">3</text>
  </g>
  <text x="360" y="120" font-size="12" fill="#8f3b37" filter="url(#rough2)">处理 (3,1) 时 3 与 1 已连通</text>
  <text x="360" y="142" font-size="12" fill="#8f3b37" filter="url(#rough2)">⇒ 记下这条多余边，删掉不影响连通</text>

  <!-- 链 4-5-6-7 -->
  <g stroke="#c9ced6" stroke-width="2" filter="url(#rough2)">
    <line x1="470" y1="200" x2="530" y2="200"/>
    <line x1="530" y1="200" x2="590" y2="200"/>
    <line x1="590" y1="200" x2="650" y2="200"/>
  </g>
  <g filter="url(#rough2)">
    <circle cx="470" cy="200" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="470" y="205" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223">4</text>
    <circle cx="530" cy="200" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="530" y="205" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223">5</text>
    <circle cx="590" cy="200" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="590" y="205" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223">6</text>
    <circle cx="650" cy="200" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="650" y="205" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223">7</text>
  </g>
  <text x="560" y="238" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">没有环，全部保留</text>

  <rect x="60" y="256" width="600" height="48" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="76" y="280" font-size="12.5" fill="#8a6015" filter="url(#rough2)">多余边数 = (n−1) − (n−c) = c−1（c 为连通块数），这里 c = 2，多余边 1 条。</text>
  <text x="76" y="298" font-size="12" fill="#8a6015" filter="url(#rough2)">至少要拆掉全部多余边（否则留下环，就不是树），所以天数 ≥ c−1。</text>
</svg>
