<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="53"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="400" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">六种后缀 = 3 种词性 × 2 种性别</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">句子的骨架：零个或多个形容词 + 恰好一个名词 + 零个或多个动词，且全句性别一致</text>
  <text x="240" y="108" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">后缀表</text>
  <text x="120" y="136" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">形容词</text>
  <text x="275" y="136" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">名词</text>
  <text x="430" y="136" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">动词</text>
  <text x="46" y="186" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">阳性</text>
  <g filter="url(#rough2)"><rect x="80" y="160" width="96" height="34" rx="4" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="128" y="183" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">lios</text>
  <g filter="url(#rough2)"><rect x="185" y="160" width="96" height="34" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="233" y="183" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">etr</text>
  <g filter="url(#rough2)"><rect x="290" y="160" width="96" height="34" rx="4" fill="#dcecd2" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="338" y="183" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">initis</text>
  <text x="46" y="248" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">阴性</text>
  <g filter="url(#rough2)"><rect x="80" y="222" width="96" height="34" rx="4" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="128" y="245" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">liala</text>
  <g filter="url(#rough2)"><rect x="185" y="222" width="96" height="34" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="233" y="245" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">etra</text>
  <g filter="url(#rough2)"><rect x="290" y="222" width="96" height="34" rx="4" fill="#dcecd2" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="338" y="245" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">inites</text>
  <text x="240" y="300" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">同一个词至多命中一种后缀</text>
  <text x="240" y="322" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">（六种后缀两两互不为后缀）</text>
  <g filter="url(#rough2)"><rect x="480" y="100" width="390" height="230" rx="6" fill="#ffffff" fill-opacity="0.4" stroke="#cccccc" stroke-width="1.4" stroke-dasharray="5 4"/></g>
  <text x="675" y="124" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">合法句子的词性骨架</text>
  <g filter="url(#rough2)"><rect x="510" y="150" width="100" height="46" rx="6" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="560" y="179" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">形容词</text>
  <text x="560" y="214" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">0 个或多个</text>
  <g filter="url(#rough2)"><line x1="614" y1="173" x2="650" y2="173" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)"/></g>
  <g filter="url(#rough2)"><rect x="654" y="150" width="100" height="46" rx="6" fill="#f6e3c4" fill-opacity="0.85" stroke="#b06a1e" stroke-width="1.4"/></g>
  <text x="704" y="179" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">名词</text>
  <text x="704" y="214" text-anchor="middle" font-size="10.5" fill="#b06a1e" filter="url(#rough2)">恰好 1 个</text>
  <g filter="url(#rough2)"><line x1="758" y1="173" x2="794" y2="173" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)"/></g>
  <g filter="url(#rough2)"><rect x="798" y="150" width="60" height="46" rx="6" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="828" y="179" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">动词</text>
  <text x="828" y="214" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">0+</text>
  <g filter="url(#rough2)"><path d="M 512 240 L 856 240" fill="none" stroke="#8a2b28" stroke-width="1.3"/></g>
  <g filter="url(#rough2)"><line x1="512" y1="234" x2="512" y2="246" stroke="#8a2b28" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><line x1="856" y1="234" x2="856" y2="246" stroke="#8a2b28" stroke-width="1.4"/></g>
  <text x="684" y="262" text-anchor="middle" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">所有词性别必须相同</text>
  <text x="675" y="300" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">单个合法词也算一句（任何词性都行）</text>
  <text x="450" y="372" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">判定顺序：先做词法（后缀 → 词性/性别），再做句法（词性序列 + 性别一致）</text>
</svg>
