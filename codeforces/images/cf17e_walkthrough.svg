<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="67"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="340" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">E：样例 1（babb）——6 个回文，15 对里 9 对不相交</text>
  <path d="M 130 42 Q 380 47 630 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <text x="60" y="76" font-size="11.5" fill="#777" filter="url(#rough2)">全部回文出现（区间，1 起）：</text>
  <line x1="70" y1="150" x2="420" y2="150" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="70" y="172" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">1</text>
  <text x="156" y="172" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">2</text>
  <text x="242" y="172" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">3</text>
  <text x="328" y="172" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">4</text>
  <text x="70" y="100" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">b</text>
  <text x="156" y="100" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">a</text>
  <text x="242" y="100" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">b</text>
  <text x="328" y="100" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">b</text>

  <line x1="70" y1="128" x2="70" y2="150" stroke="#4a7a3a" stroke-width="4" filter="url(#rough2)"/>
  <line x1="156" y1="128" x2="156" y2="150" stroke="#446688" stroke-width="4" filter="url(#rough2)"/>
  <line x1="242" y1="128" x2="242" y2="150" stroke="#4a7a3a" stroke-width="4" filter="url(#rough2)"/>
  <line x1="328" y1="128" x2="328" y2="150" stroke="#4a7a3a" stroke-width="4" filter="url(#rough2)"/>
  <line x1="70" y1="134" x2="156" y2="134" stroke="#b85450" stroke-width="3" filter="url(#rough2)"/>
  <text x="113" y="126" text-anchor="middle" font-size="9" fill="#8c3a36" filter="url(#rough2)">bab</text>
  <line x1="242" y1="140" x2="328" y2="140" stroke="#8a6015" stroke-width="3" filter="url(#rough2)"/>
  <text x="285" y="126" text-anchor="middle" font-size="9" fill="#8a6015" filter="url(#rough2)">bb</text>

  <text x="60" y="200" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">endCnt = 1, 1, 2, 2　　startCnt = 2, 1, 2, 1　　P = 6</text>

  <rect x="60" y="216" width="300" height="100" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="72" y="240" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">不相交对数</text>
  <text x="72" y="264" font-size="10.5" fill="#3c5e88" filter="url(#rough2)">i=1：1 × (start 2..4 之和 = 4) = 4</text>
  <text x="72" y="286" font-size="10.5" fill="#3c5e88" filter="url(#rough2)">i=2：1 × (start 3..4 之和 = 3) = 3</text>
  <text x="72" y="308" font-size="10.5" fill="#3c5e88" filter="url(#rough2)">i=3：2 × (start 4 之和 = 1) = 2</text>

  <rect x="392" y="216" width="320" height="100" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="404" y="240" font-size="11.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">答案</text>
  <text x="404" y="264" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">不相交 = 4 + 3 + 2 = 9</text>
  <text x="404" y="286" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">总对数 = C(6,2) = 15</text>
  <text x="404" y="308" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">相交 = 15 − 9 = 6 ✓</text>

  <text x="60" y="334" font-size="10" fill="#777" filter="url(#rough2)">第二个样例 "aa"：回文 a、a、aa 共 3 个 → 3 对，其中 1 对不相交，答案 2 ✓</text>
</svg>
