<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="91"/>
    <feDisplacementMap in="SourceGraphic" scale="1.6"/></filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker></defs>
  <rect width="720" height="340" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">油量账本：基础补给 S_i 与总路程 D_i 的差</text>
  <g filter="url(#rough2)">
    <circle cx="120" cy="120" r="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7"/>
    <circle cx="280" cy="120" r="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7"/>
    <circle cx="440" cy="120" r="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7"/>
    <circle cx="600" cy="120" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.7"/>
  </g>
  <text x="120" y="126" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">c1</text>
  <text x="280" y="126" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">c2</text>
  <text x="440" y="126" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">c3</text>
  <text x="600" y="126" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">c4</text>
  <line x1="144" y1="120" x2="252" y2="120" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="304" y1="120" x2="412" y2="120" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="464" y1="120" x2="572" y2="120" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="198" y="108" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">d1</text>
  <text x="358" y="108" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">d2</text>
  <text x="518" y="108" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">d3</text>
  <text x="120" y="166" text-anchor="middle" font-size="10.5" fill="#2f5223" filter="url(#rough2)">补给 s1</text>
  <text x="280" y="166" text-anchor="middle" font-size="10.5" fill="#2f5223" filter="url(#rough2)">补给 s2</text>
  <text x="440" y="166" text-anchor="middle" font-size="10.5" fill="#2f5223" filter="url(#rough2)">补给 s3</text>
  <text x="600" y="166" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">终点无补给</text>

  <rect x="60" y="196" width="620" height="60" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="74" y="220" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">走过前 i 条路之前，油量 = (s1+…+si) + 额外补给 − (d1+…+d(i−1))，必须 ≥ d_i</text>
  <text x="74" y="242" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">等价于：额外补给 ≥ D_i − S_i，其中 D_i = d1+…+di，S_i = s1+…+si</text>

  <text x="60" y="288" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">每等 k 小时，某个城市再补给 s_i 升。额外补给的「单价」是 k 小时，所以总是优先在 s_i 最大的城市等。</text>
  <text x="60" y="310" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">总时间 = 总路程 Σd_i + k × 需要的额外补给次数。</text>
</svg>
