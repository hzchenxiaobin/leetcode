<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="720" height="430" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 3：把同一个点的集合串成链</text>
  <path d="M 170 42 Q 360 48 550 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="60" y="66" font-size="11.5" fill="#666" filter="url(#rough2)">原树：以 1 为中心的星形（边 2-1、3-1、4-1），n = 4，m = n-1 = 3</text>

  <!-- t 的结点 -->
  <g filter="url(#rough2)">
    <rect x="60" y="110" width="110" height="54" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="250" y="110" width="110" height="54" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="440" y="110" width="110" height="54" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <line x1="172" y1="137" x2="248" y2="137" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <line x1="362" y1="137" x2="438" y2="137" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="115" y="144" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">x1={2,1}</text>
  <text x="305" y="144" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">x2={3,1}</text>
  <text x="495" y="144" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">x3={4,1}</text>

  <!-- 括号：点 1 -->
  <path d="M 60 186 L 60 196 L 550 196 L 550 186" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="305" y="214" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">含点 1 的集合是 x1,x2,x3 —— 在 t 中连成一段 ✓</text>

  <!-- 含点 2 / 3 / 4 -->
  <text x="115" y="250" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">含 2 的只有 x1</text>
  <text x="305" y="250" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">含 3 的只有 x2</text>
  <text x="495" y="250" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">含 4 的只有 x3</text>
  <text x="60" y="276" font-size="11" fill="#666" filter="url(#rough2)">单点集合自然连通（条件 3 对只有一个集合的情况总是成立）</text>

  <!-- 计数 -->
  <rect x="60" y="294" width="600" height="56" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="74" y="316" font-size="12" fill="#7a5a1b" filter="url(#rough2)">t 的边数 = Σ_v (deg_s(v) - 1) = Σ_v deg_s(v) - n = 2(n-1) - n = n - 2 = m - 1</text>
  <text x="74" y="338" font-size="12" fill="#7a5a1b" filter="url(#rough2)">每个点把关联集合串成一条链，链上相邻两个集合都含该点，故条件 3 成立</text>

  <!-- 连通性 -->
  <rect x="60" y="362" width="600" height="52" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="74" y="384" font-size="11.5" fill="#2f5223" filter="url(#rough2)">t 连通：s 中任意两条边之间有一条边序列，相邻两条共享某个点，已在该点的链里相连</text>
  <text x="74" y="404" font-size="11.5" fill="#2f5223" filter="url(#rough2)">m-1 条边 + 连通 ⇒ t 是树（无环、无重边，因为原树里两条边不可能共享两个端点）</text>
</svg>
