<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <g filter="url(#rough2)">
    <text x="310" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">认领模型：把 1..n² 按从小到大填进格子</text>
    <text x="310" y="50" text-anchor="middle" font-size="11" fill="#888">数 v 落在 (r,c)：第 r 行此前为空 ⇒ v 是行最小；第 c 列此前为空 ⇒ v 是列最小</text>
  </g>

  <g filter="url(#rough2)" font-size="17" text-anchor="middle">
    <text x="121" y="74" font-size="11" fill="#888">例：n = 3，k = 4</text>

    <rect x="40" y="80" width="54" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4"/>
    <text x="67" y="115" fill="#8a6a20">1</text>
    <rect x="94" y="80" width="54" height="54" fill="#f0f0f0" stroke="#999" stroke-width="1.3" rx="4"/>
    <text x="121" y="115" fill="#777">5</text>
    <rect x="148" y="80" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="2.4" rx="4"/>
    <text x="175" y="115" fill="#3a4a66">4</text>

    <rect x="40" y="134" width="54" height="54" fill="#f0f0f0" stroke="#999" stroke-width="1.3" rx="4"/>
    <text x="67" y="169" fill="#777">6</text>
    <rect x="94" y="134" width="54" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4"/>
    <text x="121" y="169" fill="#8a6a20">2</text>
    <rect x="148" y="134" width="54" height="54" fill="#f0f0f0" stroke="#999" stroke-width="1.3" rx="4"/>
    <text x="175" y="169" fill="#777">7</text>

    <rect x="40" y="188" width="54" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4"/>
    <text x="67" y="223" fill="#3a5a30">3</text>
    <rect x="94" y="188" width="54" height="54" fill="#f0f0f0" stroke="#999" stroke-width="1.3" rx="4"/>
    <text x="121" y="223" fill="#777">8</text>
    <rect x="148" y="188" width="54" height="54" fill="#f0f0f0" stroke="#999" stroke-width="1.3" rx="4"/>
    <text x="175" y="223" fill="#777">9</text>
  </g>

  <g filter="url(#rough2)" font-size="11">
    <rect x="240" y="88" width="26" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="276" y="103" fill="#8a6a20">行列都最小：1、2（双重认领）</text>
    <rect x="240" y="128" width="26" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="276" y="143" fill="#3a5a30">仅行最小：3（只认领一行）</text>
    <rect x="240" y="168" width="26" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <text x="276" y="183" fill="#3a4a66">仅列最小：4（只认领一列）</text>
    <rect x="240" y="208" width="26" height="20" fill="#f0f0f0" stroke="#999" stroke-width="1.4" rx="4"/>
    <text x="276" y="223" fill="#777">都不是：5..9（不认领）</text>
  </g>

  <rect x="40" y="262" width="540" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11">
    <text x="56" y="282" fill="#3a5a30" font-weight="bold">下界：认领步数就是 |f(A)|</text>
    <text x="56" y="302" fill="#555">一共 2n 次认领（n 行 + n 列各一次），每一步最多认领 1 行 + 1 列 ⇒ k ≥ 2n/2 = n</text>
  </g>

  <path d="M 310 320 L 310 332" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="340" width="540" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11">
    <text x="56" y="360" fill="#8a3a36" font-weight="bold">上界：值是 1 的格子必同时是行最小与列最小</text>
    <text x="56" y="380" fill="#555">于是 2n 次认领里至少有一对挤在同一步 ⇒ 步数 k ≤ 2n − 1；本例 6 次认领挤成 4 步（2 次双重）</text>
  </g>
</svg>
