<svg xmlns="http://www.w3.org/2000/svg" width="880" height="290" viewBox="0 0 880 290"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="290" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1：a = 1 3 4 5，k = 3</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">t=3 时 max(x,y)=3，被 {3,4,5} 三个正方形包含</text>
  <text x="150" y="120" text-anchor="start" font-size="13" fill="#2b2b2b" filter="url(#rough2)">n=4, k=3, a = [5,1,3,4]</text>
  <text x="150" y="165" text-anchor="start" font-size="13" fill="#2f4a66" filter="url(#rough2)">排序后 1 3 4 5，第 k 大 = 3</text>
  <text x="150" y="210" text-anchor="start" font-size="13" fill="#3d6b2f" filter="url(#rough2)">输出 (3,0)：max=3 → 3 个正方形 ✓</text>
  <text x="150" y="250" text-anchor="start" font-size="12.5" fill="#555555" filter="url(#rough2)">样例给的是 (2,1)，同样合法（多解）</text>
</svg>
