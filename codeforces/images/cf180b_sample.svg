<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="69"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">180B 两个样例</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="180.0" y="92.0" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">样例 1：b=10, d=10</text>
  <text x="180.0" y="124.0" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">10 | 10¹，L = 1</text>
  <text x="180.0" y="152.0" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">输出 2-type / 1</text>
  <text x="540.0" y="92.0" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">样例 2：b=2, d=3</text>
  <text x="540.0" y="124.0" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">2 ≡ -1 (mod 3)</text>
  <text x="540.0" y="152.0" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">输出 11-type</text>
  <rect x="40.0" y="200.0" width="300.0" height="120.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="54.0" y="223.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">2-type：只看末尾 L 位</text>
  <text x="54.0" y="251.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">L 是最小的使 d | b^L 的数</text>
  <text x="54.0" y="279.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">d=10 时末尾 1 位为 0 即可</text>
  <rect x="380.0" y="200.0" width="300.0" height="120.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="394.0" y="223.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">11-type：交错和</text>
  <text x="394.0" y="251.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">b ≡ -1 (mod d) 时，</text>
  <text x="394.0" y="279.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">N 与交错和同余 mod d</text>
  <text x="40.0" y="366.0" text-anchor="start" font-size="11.5" fill="#444" filter="url(#rough2)">注意：11-type 的位次按数字从右往左数（最低位是第 0 位）也不影响结论。</text>
</svg>
