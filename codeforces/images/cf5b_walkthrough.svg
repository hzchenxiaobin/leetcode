<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="47"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>

  <rect width="760" height="340" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1 走查：W = 10，边框 12 个 *</text>
  <path d="M 170 42 Q 380 48 590 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="380" y="60" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">左右两列是每行左右补的空格数（红字 = 无法完美居中的行）</text>

  <text x="196" y="76" text-anchor="end" font-size="10.5" fill="#777" filter="url(#rough2)">长度与余量</text>
  <text x="288" y="76" text-anchor="end" font-size="10.5" fill="#777" filter="url(#rough2)">左 / 右空格</text>

  <rect x="292" y="70" width="112" height="202" rx="4" fill="#ffffff" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <text x="300" y="88" font-size="13" fill="#2b2b2b" font-family="'Courier New',monospace" filter="url(#rough2)">************</text>
  <text x="288" y="88" text-anchor="end" font-size="10.5" fill="#8a8a8a" filter="url(#rough2)">边框 12 个 *</text>
  <text x="300" y="112" font-size="13" fill="#2b2b2b" font-family="'Courier New',monospace" filter="url(#rough2)">* This  is *</text>
  <text x="196" y="112" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">len 8, diff 2</text>
  <text x="288" y="112" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">1 / 1</text>
  <text x="300" y="136" font-size="13" fill="#2b2b2b" font-family="'Courier New',monospace" filter="url(#rough2)">*          *</text>
  <text x="196" y="136" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">len 0, diff 10</text>
  <text x="288" y="136" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">5 / 5</text>
  <text x="300" y="160" font-size="13" fill="#2b2b2b" font-family="'Courier New',monospace" filter="url(#rough2)">*Codeforces*</text>
  <text x="196" y="160" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">len 10, diff 0</text>
  <text x="288" y="160" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">0 / 0</text>
  <text x="300" y="184" font-size="13" fill="#2b2b2b" font-family="'Courier New',monospace" filter="url(#rough2)">*   Beta   *</text>
  <text x="196" y="184" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">len 4, diff 6</text>
  <text x="288" y="184" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">3 / 3</text>
  <text x="300" y="208" font-size="13" fill="#2b2b2b" font-family="'Courier New',monospace" filter="url(#rough2)">*  Round   *</text>
  <text x="196" y="208" text-anchor="end" font-size="11" fill="#b85450" filter="url(#rough2)">len 5, diff 5</text>
  <text x="288" y="208" text-anchor="end" font-size="11" fill="#b85450" filter="url(#rough2)">2 / 3</text>
  <text x="300" y="232" font-size="13" fill="#2b2b2b" font-family="'Courier New',monospace" filter="url(#rough2)">*     5    *</text>
  <text x="196" y="232" text-anchor="end" font-size="11" fill="#b85450" filter="url(#rough2)">len 1, diff 9</text>
  <text x="288" y="232" text-anchor="end" font-size="11" fill="#b85450" filter="url(#rough2)">5 / 4</text>
  <text x="300" y="256" font-size="13" fill="#2b2b2b" font-family="'Courier New',monospace" filter="url(#rough2)">************</text>
  <text x="288" y="256" text-anchor="end" font-size="10.5" fill="#8a8a8a" filter="url(#rough2)">边框 12 个 *</text>

  <text x="60" y="296" font-size="11.5" fill="#b85450" filter="url(#rough2)">奇数余量的第 1 行（Round）靠左：左 2 右 3；第 2 行（5）靠右：左 5 右 4</text>
  <text x="60" y="318" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">偶数余量的行左右必然相等；空行补满 10 个空格，不改变开关状态</text>
</svg>
