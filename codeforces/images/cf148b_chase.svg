<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="363"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="320" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">一轮：追及 → 丢宝石 → 龙回洞 → 重新出发</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">起点 s 时公主已跑 v_p·s；追上位置 = v_p·s·v_d/(v_d−v_p)</text>
  <g filter="url(#rough2)"><rect x="60" y="96" width="780" height="54" rx="6" fill="#cfe0f5" fill-opacity="0.45" stroke="#446688" stroke-width="1.4"/></g>
  <text x="450" y="128" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">龙从洞口出发（时刻 s），公主在 v_p·s 处</text>
  <g filter="url(#rough2)"><rect x="60" y="166" width="240" height="54" rx="5" fill="#f3d9d6" fill-opacity="0.85" stroke="#8a2b28" stroke-width="1.4"/></g>
  <text x="180" y="198" text-anchor="middle" font-size="12" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">追上：位置 X</text>
  <g filter="url(#rough2)"><rect x="330" y="166" width="230" height="54" rx="5" fill="#f6e3c4" fill-opacity="0.85" stroke="#b06a1e" stroke-width="1.4"/></g>
  <text x="445" y="198" text-anchor="middle" font-size="12" fill="#b06a1e" font-weight="bold" filter="url(#rough2)">公主丢 1 颗宝石</text>
  <g filter="url(#rough2)"><rect x="590" y="166" width="250" height="54" rx="5" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="715" y="198" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">龙飞回洞口 + f 小时</text>
  <g filter="url(#rough2)"><line x1="304" y1="193" x2="326" y2="193" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)"/></g>
  <g filter="url(#rough2)"><line x1="564" y1="193" x2="586" y2="193" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)"/></g>
  <text x="450" y="252" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">若 X ≥ c：公主已到城堡（含「恰好同时」）⇒ 不再丢宝石，结束</text>
  <text x="450" y="284" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">下一轮起点 s' = 追上时刻 + X / v_d + f</text>
</svg>
