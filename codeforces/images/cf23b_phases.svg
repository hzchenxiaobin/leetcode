<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="243" />
      <feDisplacementMap in="SourceGraphic" scale="1.5" />
    </filter>
    <marker id="a23barr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688" />
    </marker>
  </defs>

  <rect width="760" height="430" fill="#fafafa" />

  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">阶段 k：当前恰好有 k 个朋友的人离开</text>
  <path d="M 130 44 Q 380 50 630 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)" />

  
  <g font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
    <rect x="24" y="80" width="132" height="96" rx="9" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.3" filter="url(#rough2)" />
    <rect x="172" y="80" width="132" height="96" rx="9" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.3" filter="url(#rough2)" />
    <rect x="320" y="80" width="132" height="96" rx="9" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.3" filter="url(#rough2)" />
    <rect x="468" y="80" width="132" height="96" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)" />
    <rect x="616" y="80" width="120" height="96" rx="9" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.3" filter="url(#rough2)" />
  </g>
  <text x="90" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">k = 0</text>
  <text x="238" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">k = 1</text>
  <text x="386" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">k = 2</text>
  <text x="534" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">k = n-2</text>
  <text x="676" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">k = n-1</text>

  <text x="90" y="138" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">离开 0 人</text>
  <text x="238" y="138" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">离开 0 人</text>
  <text x="386" y="138" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">离开 0 人</text>
  <text x="534" y="138" text-anchor="middle" font-size="11" fill="#8a3b36" filter="url(#rough2)">a、b 离开</text>
  <text x="676" y="138" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">离开 0 人</text>
  <text x="90" y="160" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">…</text>
  <text x="238" y="160" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">…</text>
  <text x="386" y="160" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">…</text>
  <text x="534" y="160" text-anchor="middle" font-size="10" fill="#2f5223" filter="url(#rough2)">簇内降为 n-3</text>
  <text x="676" y="160" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">…</text>

  
  <line x1="156" y1="128" x2="168" y2="128" stroke="#446688" stroke-width="1.4" marker-end="url(#a23barr)" filter="url(#rough2)" />
  <line x1="304" y1="128" x2="316" y2="128" stroke="#446688" stroke-width="1.4" marker-end="url(#a23barr)" filter="url(#rough2)" />
  <line x1="452" y1="128" x2="464" y2="128" stroke="#446688" stroke-width="1.4" marker-end="url(#a23barr)" filter="url(#rough2)" />
  <line x1="600" y1="128" x2="612" y2="128" stroke="#446688" stroke-width="1.4" marker-end="url(#a23barr)" filter="url(#rough2)" />

  
  <rect x="250" y="204" width="260" height="54" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)" />
  <text x="380" y="226" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">最终剩下团内 n-2 人</text>
  <text x="380" y="247" text-anchor="middle" font-size="11" fill="#3c5e2e" filter="url(#rough2)">n = 5 时剩下 3 人</text>

  
  <rect x="60" y="280" width="640" height="124" rx="10" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.5" filter="url(#rough2)" />
  <text x="80" y="306" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">为什么不能留下 n-1 人？</text>
  <text x="80" y="330" font-size="11.5" fill="#555" filter="url(#rough2)">若只有一人 u 离开（在第 k 阶段），则所有幸存者在第 k 阶段前的度数必须 ≥ k+1，</text>
  <text x="80" y="352" font-size="11.5" fill="#555" filter="url(#rough2)">才能在阶段 0..k 都不被移除；u 离开后它们度数降到 k，且必须都邻接 u（否则度数仍 ≠k）。</text>
  <text x="80" y="374" font-size="11.5" fill="#555" filter="url(#rough2)">于是 u 至少有 n-1 个邻居，度数为 n-1，即 k=n-1；但此时幸存者阶段前的度数是 n，矛盾。</text>
  <text x="80" y="396" font-size="11.5" fill="#2f5223" filter="url(#rough2)">所以至少两人离开，答案 ≤ n-2；构造又恰好达到 n-2。</text>
</svg>