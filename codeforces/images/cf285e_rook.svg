<svg xmlns="http://www.w3.org/2000/svg" width="700" height="330" viewBox="0 0 700 330"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="371"/>
    <feDisplacementMap in="SourceGraphic" scale="1.5"/></filter></defs>
  <rect width="700" height="330" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">"好位置"拼成一个带状棋盘，数它的车多项式</text>
  <path d="M 110 40 Q 350 46 590 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="76" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="13" fill="#22314a" filter="url(#rough2)">位置 i 是"好"的 ⟺ p_i ∈ {i−1, i+1} ⇒ 在 (行=位置, 列=值) 的 n×n 棋盘上，好格子是两条斜带。</text>
  <text x="76" y="106" font-size="12.5" fill="#22314a" filter="url(#rough2)">令 g[j] = 在这两条带上放 j 个互不同行同列的车 的方案数（车的摆放 ↔ 指定 j 个位置"必须是好"的部分排列）。</text>
  <text x="76" y="126" font-size="12" fill="#2f4a66" filter="url(#rough2)">冲突只发生在"相邻两列"之间：第 c 列的格子在第 c−1、c+1 行；与第 c+2 列同行。</text>
  <g filter="url(#rough2)"><rect x="60" y="144" width="580" height="76" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="76" y="168" font-size="12.5" fill="#8a6015" filter="url(#rough2)">逐列 DP，状态 = 前两列各自的 "down 位"（是否占了下一行），共 4 种：</text>
  <text x="76" y="192" font-size="12.5" fill="#8a6015" filter="url(#rough2)">第 v 列可选：不选 / 选 up=(v−1,v)（要求 v−2 列的 down 为空）/ 选 down=(v+1,v)（要求 v+1 ≤ n）。</text>
  <text x="76" y="212" font-size="12" fill="#8a6015" filter="url(#rough2)">O(n²) 时间、O(n) 空间即可算出所有 g[j]。</text>
  <g filter="url(#rough2)"><rect x="60" y="230" width="580" height="82" rx="8" fill="#e8f4e0" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="254" font-size="12.5" fill="#2f5223" filter="url(#rough2)">容斥：恰好 k 个好位置 = Σ_{j≥k} (−1)^{j−k} C(j,k)·g[j]·(n−j)!</text>
  <text x="76" y="278" font-size="12" fill="#3c5e2e" filter="url(#rough2)">含义：g[j]·(n−j)! = "指定的 j 个好位置都好"的排列数（其余位置随便排）；</text>
  <text x="76" y="300" font-size="12" fill="#3c5e2e" filter="url(#rough2)">对"至少好 j 个"做二项式反演即得"恰好 k 个"。</text>
</svg>
