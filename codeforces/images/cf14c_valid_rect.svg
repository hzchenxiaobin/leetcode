<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="161"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="440" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">四条线段 = 矩形的四条边</text>
  <path d="M 180 44 Q 380 50 580 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="380" y="64" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">两条水平边成对，两条竖直边成对；每条线段只能用一次</text>

  <!-- 四条边 -->
  <line x1="150" y1="330" x2="600" y2="330" stroke="#446688" stroke-width="5" filter="url(#rough2)"/>
  <line x1="600" y1="330" x2="600" y2="130" stroke="#4a7a3a" stroke-width="5" filter="url(#rough2)"/>
  <line x1="150" y1="130" x2="600" y2="130" stroke="#d6a040" stroke-width="5" filter="url(#rough2)"/>
  <line x1="150" y1="130" x2="150" y2="330" stroke="#7a5a9a" stroke-width="5" filter="url(#rough2)"/>

  <!-- 角点 -->
  <circle cx="150" cy="330" r="6" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="600" cy="330" r="6" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="600" cy="130" r="6" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="150" cy="130" r="6" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.6" filter="url(#rough2)"/>

  <text x="150" y="118" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">(xL, yT)</text>
  <text x="600" y="118" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">(xR, yT)</text>
  <text x="150" y="354" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">(xL, yB)</text>
  <text x="600" y="354" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">(xR, yB)</text>

  <!-- 边的说明 -->
  <text x="375" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">顶边：水平，y = yT，x 从 xL 到 xR</text>
  <text x="375" y="374" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">底边：水平，y = yB，x 从 xL 到 xR</text>
  <text x="126" y="230" text-anchor="end" font-size="12" font-weight="bold" fill="#5a3f78" filter="url(#rough2)">左边：竖直</text>
  <text x="126" y="248" text-anchor="end" font-size="11" fill="#5a3f78" filter="url(#rough2)">x = xL，y 从 yB 到 yT</text>
  <text x="624" y="230" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">右边：竖直</text>
  <text x="624" y="248" font-size="11" fill="#2f5223" filter="url(#rough2)">x = xR，y 从 yB 到 yT</text>

  <!-- 尺寸标注 -->
  <line x1="150" y1="392" x2="600" y2="392" stroke="#777" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="150" y1="386" x2="150" y2="398" stroke="#777" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="600" y1="386" x2="600" y2="398" stroke="#777" stroke-width="1.2" filter="url(#rough2)"/>

  <text x="375" y="414" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">两条水平边长度都等于 xR - xL</text>
  <text x="375" y="432" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">两条竖直边长度都等于 yT - yB</text>
</svg>
