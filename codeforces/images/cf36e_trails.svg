<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arro" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d68a2a"/>
    </marker>
  </defs>
  <rect width="720" height="420" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">把边集分成两条欧拉迹</text>
  <path d="M 210 40 Q 360 46 510 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 图 -->
  <g filter="url(#rough2)">
    <circle cx="170" cy="130" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="330" cy="130" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="250" cy="250" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="250" cy="350" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="430" cy="350" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">
    <text x="170" y="135">1</text><text x="330" y="135">2</text><text x="250" y="255">3</text>
    <text x="250" y="355">4</text><text x="430" y="355">5</text>
  </g>

  <g stroke="#4a7a3a" stroke-width="2.4" fill="none" filter="url(#rough2)">
    <line x1="188" y1="130" x2="312" y2="130" marker-end="url(#arrg)"/>
    <line x1="326" y1="148" x2="266" y2="234" marker-end="url(#arrg)"/>
    <line x1="234" y1="240" x2="184" y2="146" marker-end="url(#arrg)"/>
  </g>
  <g stroke="#d68a2a" stroke-width="2.4" fill="none" filter="url(#rough2)">
    <line x1="250" y1="268" x2="250" y2="332" marker-end="url(#arro)"/>
    <line x1="268" y1="350" x2="412" y2="350" marker-end="url(#arro)"/>
  </g>

  <g font-size="10.5" fill="#555" filter="url(#rough2)">
    <text x="250" y="118">e1</text><text x="315" y="200">e2</text><text x="195" y="200">e3</text>
    <text x="262" y="300">e4</text><text x="335" y="342">e5</text>
  </g>

  <rect x="480" y="80" width="210" height="120" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="494" y="106" font-size="11.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">路径 A（绿色）</text>
  <text x="494" y="130" font-size="10.5" fill="#2f5223" filter="url(#rough2)">e1 → e2 → e3</text>
  <text x="494" y="152" font-size="10.5" fill="#2f5223" filter="url(#rough2)">1→2→3→1，闭合回路</text>
  <text x="494" y="176" font-size="10" fill="#2f5223" filter="url(#rough2)">所有点度数为偶</text>

  <rect x="480" y="220" width="210" height="110" rx="10" fill="#fff2df" stroke="#d68a2a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="494" y="246" font-size="11.5" font-weight="bold" fill="#8a5415" filter="url(#rough2)">路径 B（橙色）</text>
  <text x="494" y="270" font-size="10.5" fill="#8a5415" filter="url(#rough2)">e4 → e5</text>
  <text x="494" y="292" font-size="10.5" fill="#8a5415" filter="url(#rough2)">3→4→5，开放路径</text>
  <text x="494" y="316" font-size="10" fill="#8a5415" filter="url(#rough2)">奇度点只有 3、5</text>

  <rect x="40" y="372" width="640" height="36" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="56" y="395" font-size="11" fill="#2f4a66" filter="url(#rough2)">每条路径对应一个连通子图，奇度点数 ≤ 2 时存在欧拉迹；这就是本题的判定核心。</text>
</svg>
