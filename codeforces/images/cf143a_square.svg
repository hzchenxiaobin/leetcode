<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="297"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="320" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">2×2 的四个格子与六个和</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">a+b=r₁，c+d=r₂，a+c=c₁，b+d=c₂，a+d=d₁，b+c=d₂</text>
  <g filter="url(#rough2)"><rect x="330" y="110" width="130" height="90" rx="6" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="395" y="168" text-anchor="middle" font-size="22" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">a</text>
  <g filter="url(#rough2)"><rect x="470" y="110" width="130" height="90" rx="6" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="535" y="168" text-anchor="middle" font-size="22" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">b</text>
  <g filter="url(#rough2)"><rect x="330" y="210" width="130" height="90" rx="6" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="395" y="268" text-anchor="middle" font-size="22" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">c</text>
  <g filter="url(#rough2)"><rect x="470" y="210" width="130" height="90" rx="6" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="535" y="268" text-anchor="middle" font-size="22" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">d</text>
  <text x="400" y="96" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">r₁</text>
  <text x="400" y="300" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">r₂</text>
  <text x="300" y="165" text-anchor="middle" font-size="12" fill="#b06a1e" font-weight="bold" filter="url(#rough2)">c₁</text>
  <text x="624" y="165" text-anchor="middle" font-size="12" fill="#b06a1e" font-weight="bold" filter="url(#rough2)">c₂</text>
  <text x="660" y="120" text-anchor="start" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">主对角线 a+d = d₁</text>
  <text x="660" y="146" text-anchor="start" font-size="11.5" fill="#8a5a14" filter="url(#rough2)">副对角线 b+c = d₂</text>
  <text x="660" y="182" text-anchor="start" font-size="11.5" fill="#666666" filter="url(#rough2)">四数互不相同、都在 1..9</text>
  <text x="660" y="208" text-anchor="start" font-size="11.5" fill="#446688" filter="url(#rough2)">枚举 9⁴ = 6561 种即可</text>
</svg>
