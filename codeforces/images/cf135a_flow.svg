<svg xmlns="http://www.w3.org/2000/svg" width="720" height="210" viewBox="0 0 720 210"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1348"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="210" fill="#fafafa"/>
  <text x="360.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">流程</text>
  <path d="M 115.2 42 Q 360.0 48 604.8 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="360.0" y="196" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">O(n log n)</text>
  <rect x="30.0" y="80" width="154.5" height="54" rx="7" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="107.25" y="112.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">排序</text>
  <line x1="185.5" y1="107.0" x2="195.5" y2="107.0" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <rect x="198.5" y="80" width="154.5" height="54" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="275.75" y="112.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#5a7fb0" filter="url(#rough2)">ans[0]=1</text>
  <line x1="354.0" y1="107.0" x2="364.0" y2="107.0" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <rect x="367.0" y="80" width="154.5" height="54" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="444.25" y="105.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">ans[i]=a[i−1]</text>
  <text x="444.25" y="123.0" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">1≤i≤n−2</text>
  <line x1="522.5" y1="107.0" x2="532.5" y2="107.0" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <rect x="535.5" y="80" width="154.5" height="54" rx="7" fill="#fbeeee" stroke="#a05a5a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="612.75" y="105.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a05a5a" filter="url(#rough2)">末位特判</text>
  <text x="612.75" y="123.0" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">全 1 → 2</text>
</svg>
