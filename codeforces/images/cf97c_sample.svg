<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 372" width="640" height="372">
<defs>
<filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="9" result="noise"/>
<feDisplacementMap in="SourceGraphic" in2="noise" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect x="0" y="0" width="640" height="372" fill="#fafafa"/>
<g font-family="Comic Sans MS, Kaiti SC, cursive">
<text x="320.0" y="24.0" font-size="15" fill="#33475b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">样例 1：四条跨过 n/2=1.5 的候选弦</text>
<rect x="90.0" y="66.0" width="470.0" height="40.0" rx="6" fill="#dfe8f2" stroke="#7a93a8" stroke-width="1.5" filter="url(#rough2)"/>
<text x="160.0" y="91.0" font-size="13" fill="#33475b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">弦 (i,j)</text>
<text x="300.0" y="91.0" font-size="13" fill="#33475b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">值</text>
<text x="460.0" y="91.0" font-size="13" fill="#33475b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">点评</text>
<rect x="90.0" y="110.0" width="470.0" height="40.0" rx="6" fill="#ffffff" stroke="#b9c6d6" stroke-width="1.2" filter="url(#rough2)"/>
<text x="160.0" y="135.0" font-size="13" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">(0,2)</text>
<text x="300.0" y="135.0" font-size="13" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">0.3612435</text>
<text x="460.0" y="135.0" font-size="11" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">两个都是低值，浪费了 p 的增量</text>
<rect x="90.0" y="154.0" width="470.0" height="40.0" rx="6" fill="#ffffff" stroke="#b9c6d6" stroke-width="1.2" filter="url(#rough2)"/>
<text x="160.0" y="179.0" font-size="13" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">(0,3)</text>
<text x="300.0" y="179.0" font-size="13" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">0.3389730</text>
<text x="460.0" y="179.0" font-size="11" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">权重各半，中庸</text>
<rect x="90.0" y="198.0" width="470.0" height="40.0" rx="6" fill="#ffffff" stroke="#b9c6d6" stroke-width="1.2" filter="url(#rough2)"/>
<text x="160.0" y="223.0" font-size="13" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">(1,2)</text>
<text x="300.0" y="223.0" font-size="13" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">0.4135795</text>
<text x="460.0" y="223.0" font-size="11" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">较好，但 p₂ 不够高</text>
<rect x="90.0" y="242.0" width="470.0" height="40.0" rx="6" fill="#fdf3d8" stroke="#b9c6d6" stroke-width="1.2" filter="url(#rough2)"/>
<text x="160.0" y="267.0" font-size="13" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">(1,3)</text>
<text x="300.0" y="267.0" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">0.4286123</text>
<text x="460.0" y="267.0" font-size="11" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">最优：¾·p₁ + ¼·p₃</text>
<text x="320.0" y="300.0" font-size="13" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">p = (0.115590, 0.384031, 0.443128, 0.562356)，n = 3</text>
<text x="320.0" y="330.0" font-size="13" fill="#1f6f43" text-anchor="middle" font-weight="normal" filter="url(#rough2)">最优策略：4 届一周期，3 届 a=1、1 届 a=3，池子在 3↔6 之间摆动</text>
<text x="320.0" y="356.0" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">输出 0.4286122500，与官方一致</text>
</g>
</svg>
