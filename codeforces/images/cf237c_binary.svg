<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="59"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="400" fill="#fafafa"/>

  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">可行性单调：二分出最小的 l</text>
  <path d="M 170 44 Q 360 50 550 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 可行区域底色 -->
  <rect x="336" y="76" width="288" height="76" rx="8" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="480" y="66" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">所有窗口都通过的区域</text>

  <!-- 8 个 l 的格子 -->
  <g filter="url(#rough2)">
    <rect x="76" y="82" width="56" height="52" fill="#fde8e8" stroke="#b85450" stroke-width="1.7"/>
    <rect x="140" y="82" width="56" height="52" fill="#fde8e8" stroke="#b85450" stroke-width="1.7"/>
    <rect x="204" y="82" width="56" height="52" fill="#fde8e8" stroke="#b85450" stroke-width="1.7"/>
    <rect x="268" y="82" width="56" height="52" fill="#f0f0f0" stroke="#999" stroke-width="1.5"/>
    <rect x="340" y="82" width="56" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="404" y="82" width="56" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="468" y="82" width="56" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="532" y="82" width="56" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="104" y="118" text-anchor="middle" font-size="20" font-weight="bold" fill="#8c2f2b" filter="url(#rough2)">✗</text>
  <text x="168" y="118" text-anchor="middle" font-size="20" font-weight="bold" fill="#8c2f2b" filter="url(#rough2)">✗</text>
  <text x="232" y="118" text-anchor="middle" font-size="20" font-weight="bold" fill="#8c2f2b" filter="url(#rough2)">✗</text>
  <text x="296" y="118" text-anchor="middle" font-size="20" font-weight="bold" fill="#888" filter="url(#rough2)">?</text>
  <text x="368" y="118" text-anchor="middle" font-size="20" font-weight="bold" fill="#2f5223" filter="url(#rough2)">✓</text>
  <text x="432" y="118" text-anchor="middle" font-size="20" font-weight="bold" fill="#2f5223" filter="url(#rough2)">✓</text>
  <text x="496" y="118" text-anchor="middle" font-size="20" font-weight="bold" fill="#2f5223" filter="url(#rough2)">✓</text>
  <text x="560" y="118" text-anchor="middle" font-size="20" font-weight="bold" fill="#2f5223" filter="url(#rough2)">✓</text>
  <text x="104" y="154" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">l=1</text>
  <text x="168" y="154" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">l=2</text>
  <text x="232" y="154" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">l=3</text>
  <text x="296" y="154" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">l=4</text>
  <text x="368" y="154" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">l=5</text>
  <text x="432" y="154" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">l=6</text>
  <text x="496" y="154" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">l=7</text>
  <text x="560" y="154" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">l=8</text>

  <!-- 答案箭头 -->
  <path d="M 296 74 L 296 62" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="56" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8c2f2b" filter="url(#rough2)">二分答案落在这里</text>

  <!-- 单调性说明 -->
  <rect x="60" y="188" width="600" height="74" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="72" y="210" font-size="12" fill="#2f4a66" filter="url(#rough2)">单调性：若每个长度 l 的窗口都 ≥ k 个素数，那么长度 l+1 的窗口</text>
  <text x="72" y="232" font-size="12" fill="#2f4a66" filter="url(#rough2)">一定包含其中一个长度 l 的子窗口，它也必然 ≥ k 个 → l+1 也可行。</text>
  <text x="72" y="254" font-size="12" fill="#2f4a66" filter="url(#rough2)">于是「可行」是一段后缀，可以用二分找它的左端点。</text>

  <!-- 判定公式 -->
  <rect x="60" y="276" width="600" height="74" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="72" y="298" font-size="12" font-weight="bold" fill="#7a5a1b" filter="url(#rough2)">单次判定 O(len)：枚举起点 x，用前缀和数区间内的素数</text>
  <text x="72" y="322" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">pre[x + l - 1] - pre[x - 1] ≥ k,  x = a..b-l+1</text>
  <text x="72" y="342" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">总复杂度 O(b log log b + (b-a+1) log(b-a+1))，1e6 规模约 2e7 次基本操作</text>

  <text x="360" y="380" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">边界：l = b-a+1 只有整段一个窗口；整段素数都不足 k 时直接 -1</text>
</svg>
