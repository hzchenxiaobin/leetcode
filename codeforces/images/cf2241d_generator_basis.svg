<svg xmlns="http://www.w3.org/2000/svg" width="760" height="486" viewBox="0 0 760 486"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="486" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="17.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">一次操作 = 若干「左移」积木 + 至多一个「造点」积木</text>
  <path d="M 126 40 Q 380 47 634 40" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="40" y="70" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">① 取 l=1, r=5：五个位置依次 +1 −1 +1 −1 +1</text>
  <rect x="58" y="80" width="54" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="85.0" y="104.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">+1</text>
  <rect x="120" y="80" width="54" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="147.0" y="104.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">-1</text>
  <rect x="182" y="80" width="54" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="209.0" y="104.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">+1</text>
  <rect x="244" y="80" width="54" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="271.0" y="104.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">-1</text>
  <rect x="306" y="80" width="54" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="333.0" y="104.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">+1</text>
  <text x="85" y="132" text-anchor="middle" font-size="10.5" fill="#6b7f92" filter="url(#rough2)">i=1</text>
  <text x="147" y="132" text-anchor="middle" font-size="10.5" fill="#6b7f92" filter="url(#rough2)">i=2</text>
  <text x="209" y="132" text-anchor="middle" font-size="10.5" fill="#6b7f92" filter="url(#rough2)">i=3</text>
  <text x="271" y="132" text-anchor="middle" font-size="10.5" fill="#6b7f92" filter="url(#rough2)">i=4</text>
  <text x="333" y="132" text-anchor="middle" font-size="10.5" fill="#6b7f92" filter="url(#rough2)">i=5</text>
  <text x="392" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a6015" filter="url(#rough2)">=</text>
  <text x="40" y="158" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">② 拆开：相邻两格是「搬运」，落单的一格是「造点」</text>
  <rect x="50" y="166" width="132" height="54" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <rect x="58" y="172" width="52" height="40" rx="5" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="84.0" y="197.0" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">+1</text>
  <rect x="116" y="172" width="52" height="40" rx="5" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="142.0" y="197.0" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">-1</text>
  <text x="116.0" y="238" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">[1,2]</text>
  <rect x="202" y="166" width="132" height="54" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <rect x="210" y="172" width="52" height="40" rx="5" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="236.0" y="197.0" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">+1</text>
  <rect x="268" y="172" width="52" height="40" rx="5" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="294.0" y="197.0" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">-1</text>
  <text x="268.0" y="238" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">[3,4]</text>
  <rect x="354" y="166" width="74" height="54" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <rect x="362" y="172" width="52" height="40" rx="5" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="388.0" y="197.0" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">+1</text>
  <text x="391.0" y="238" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">[5,5]</text>
  <text x="194" y="202" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a6015" filter="url(#rough2)">+</text>
  <text x="342" y="202" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a6015" filter="url(#rough2)">+</text>
  <rect x="34" y="252" width="344" height="98" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="50" y="274" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">「搬运」积木　B_i = 区间 [i, i+1]</text>
  <rect x="60" y="286" width="46" height="34" rx="5" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="83.0" y="308.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">+1</text>
  <rect x="150" y="286" width="46" height="34" rx="5" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="173.0" y="308.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">-1</text>
  <path d="M 148 303 L 110 303" stroke="#8a6015" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="204" y="308" font-size="11.5" fill="#7a5a1c" filter="url(#rough2)">把 1 个单位从 i+1 挪到 i</text>
  <text x="50" y="340" font-size="11.5" fill="#7a5a1c" filter="url(#rough2)">只能往左搬；系数 = 搬几次（≥ 0）</text>
  <rect x="382" y="252" width="344" height="98" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="398" y="274" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">「造点」积木　A_l = 区间 [l, l]</text>
  <rect x="408" y="286" width="46" height="34" rx="5" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="431.0" y="308.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5223" filter="url(#rough2)">+1</text>
  <text x="470" y="308" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">在任意位置凭空 +1，想要几个都行</text>
  <text x="398" y="340" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">这就是「总量只增不减」的来源</text>
  <rect x="34" y="364" width="692" height="108" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="50" y="388" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">两条推论（这就是全部答案）</text>
  <text x="50" y="412" font-size="12" fill="#2f4a66" filter="url(#rough2)">必要：A_l 让 k ≥ l 的 S_k 各 +1，B_i 只让 S_i +1；两种积木都只抬不压 ⇒ S_k ≥ 0 恒成立。</text>
  <text x="50" y="434" font-size="12" fill="#2f4a66" filter="url(#rough2)">充分（构造）：i 从 n 往 1 扫。d_i &lt; 0 就搬 |d_i| 次 B_(i−1) 把亏空推给左边，d_i &gt; 0 就造 d_i 次 A_i，</text>
  <text x="50" y="456" font-size="12" fill="#2f4a66" filter="url(#rough2)">最后 A_1 补齐 d_1。S_k ≥ 0 恰好保证「推过来的亏空」不会超过 d_1，所以一定收得住。</text>
</svg>
