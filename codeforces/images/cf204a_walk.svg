<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="320" fill="#fafafa"/>
  <text x="360.0" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">204A：两个样例的逐步清点</text>
  <path d="M 144.00 46 Q 360.0 52 576.00 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="72" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">样例一 [2,47]：满足条件的数 = 1 位数 2..9（8 个）+ 11,22,33,44（4 个）= 12。</text>
  <text x="60" y="92" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">样例二 [47,1024]：55..99（5 个）+ 三位数全部 90 个 + 1001,1011,1021（3 个）= 98。</text>
  <rect x="90" y="120" width="78" height="44" rx="6" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="129" y="147" text-anchor="middle" font-size="10" fill="#2f5b34" filter="url(#rough2)">2..9</text>
  <rect x="180" y="120" width="78" height="44" rx="6" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="219" y="147" text-anchor="middle" font-size="10" fill="#2f5b34" filter="url(#rough2)">11</text>
  <rect x="270" y="120" width="78" height="44" rx="6" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="309" y="147" text-anchor="middle" font-size="10" fill="#2f5b34" filter="url(#rough2)">22</text>
  <rect x="360" y="120" width="78" height="44" rx="6" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="399" y="147" text-anchor="middle" font-size="10" fill="#2f5b34" filter="url(#rough2)">33</text>
  <rect x="450" y="120" width="78" height="44" rx="6" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="489" y="147" text-anchor="middle" font-size="10" fill="#2f5b34" filter="url(#rough2)">44</text>
  <rect x="540" y="120" width="78" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="579" y="147" text-anchor="middle" font-size="10" fill="#8a6015" filter="url(#rough2)">55..99</text>
  <rect x="630" y="120" width="78" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="669" y="147" text-anchor="middle" font-size="10" fill="#8a6015" filter="url(#rough2)">101..999</text>
  <text x="60" y="196" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">L 位数的合法数：f·10^{L-1} + m·10 + f（m 取 0..10^{L-2}-1），每个 f 有 10^{L-2} 个。</text>
  <rect x="60" y="216" width="620" height="80" rx="9" fill="#fdeef1" stroke="#c0708a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="234" text-anchor="start" font-size="11" fill="#8a3a52" filter="url(#rough2)">截断到 ≤ N：base = f·10^{L-1} + f，个数 = min(10^{L-2}, (N−base)/10 + 1)。</text>
  <text x="74" y="256" text-anchor="start" font-size="11" fill="#8a3a52" filter="url(#rough2)">答案 = countUpTo(r) − countUpTo(l−1)。</text>
</svg>
