<svg xmlns="http://www.w3.org/2000/svg" width="660" height="430" viewBox="0 0 660 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="430" fill="#fafafa"/>

  <text x="330" y="30" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">走查：a = [1,1,2,2,2,4]，k = 1</text>

  <rect x="64" y="52" width="44" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="86" y="76" text-anchor="middle" font-size="16" fill="#33506b" filter="url(#rough2)">1</text>
  <rect x="112" y="52" width="44" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="134" y="76" text-anchor="middle" font-size="16" fill="#33506b" filter="url(#rough2)">1</text>
  <rect x="160" y="52" width="44" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="182" y="76" text-anchor="middle" font-size="16" fill="#3c6130" filter="url(#rough2)">2</text>
  <rect x="208" y="52" width="44" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230" y="76" text-anchor="middle" font-size="16" fill="#3c6130" filter="url(#rough2)">2</text>
  <rect x="256" y="52" width="44" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="278" y="76" text-anchor="middle" font-size="16" fill="#3c6130" filter="url(#rough2)">2</text>
  <rect x="304" y="52" width="44" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="326" y="76" text-anchor="middle" font-size="16" fill="#8a6420" filter="url(#rough2)">4</text>

  <path d="M64,94 L152,94" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="108" y="112" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">v1 = 1，c1 = 2</text>
  <path d="M160,94 L296,94" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="228" y="112" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">v2 = 2，c2 = 3</text>
  <path d="M304,94 L348,94" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="326" y="112" text-anchor="middle" font-size="12" fill="#8a6420" filter="url(#rough2)">v3 = 4，c3 = 1</text>

  <text x="56" y="142" font-size="12" fill="#446688" filter="url(#rough2)">步</text>
  <text x="112" y="142" font-size="12" fill="#446688" filter="url(#rough2)">j</text>
  <text x="152" y="142" font-size="12" fill="#446688" filter="url(#rough2)">v_j</text>
  <text x="196" y="142" font-size="12" fill="#446688" filter="url(#rough2)">c_j</text>
  <text x="248" y="142" font-size="12" fill="#446688" filter="url(#rough2)">窗口内有 bad？</text>
  <text x="400" y="142" font-size="12" fill="#446688" filter="url(#rough2)">Q_j</text>
  <text x="456" y="142" font-size="12" fill="#446688" filter="url(#rough2)">bad？</text>
  <text x="524" y="142" font-size="12" fill="#446688" filter="url(#rough2)">lastBad</text>
  <path d="M50,150 L612,150" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>

  <text x="56" y="172" font-size="12" fill="#444" filter="url(#rough2)">1</text>
  <text x="112" y="172" font-size="12" fill="#444" filter="url(#rough2)">3</text>
  <text x="152" y="172" font-size="12" fill="#444" filter="url(#rough2)">4</text>
  <text x="196" y="172" font-size="12" fill="#444" filter="url(#rough2)">1</text>
  <text x="248" y="172" font-size="12" fill="#444" filter="url(#rough2)">没有，无子可跳</text>
  <text x="400" y="172" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <text x="456" y="172" font-size="12" fill="#b85450" filter="url(#rough2)">是</text>
  <text x="524" y="172" font-size="12" fill="#444" filter="url(#rough2)">3</text>
  <path d="M50,180 L612,180" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>

  <text x="56" y="200" font-size="12" fill="#444" filter="url(#rough2)">2</text>
  <text x="112" y="200" font-size="12" fill="#444" filter="url(#rough2)">2</text>
  <text x="152" y="200" font-size="12" fill="#444" filter="url(#rough2)">2</text>
  <text x="196" y="200" font-size="12" fill="#444" filter="url(#rough2)">3</text>
  <text x="248" y="200" font-size="12" fill="#444" filter="url(#rough2)">4 − 2 = 2 &gt; k，出界</text>
  <text x="400" y="200" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <text x="456" y="200" font-size="12" fill="#b85450" filter="url(#rough2)">是</text>
  <text x="524" y="200" font-size="12" fill="#444" filter="url(#rough2)">2</text>
  <path d="M50,208 L612,208" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>

  <text x="56" y="228" font-size="12" fill="#444" filter="url(#rough2)">3</text>
  <text x="112" y="228" font-size="12" fill="#444" filter="url(#rough2)">1</text>
  <text x="152" y="228" font-size="12" fill="#444" filter="url(#rough2)">1</text>
  <text x="196" y="228" font-size="12" fill="#444" filter="url(#rough2)">2</text>
  <text x="248" y="228" font-size="12" fill="#444" filter="url(#rough2)">2 − 1 = 1 ≤ k，命中</text>
  <text x="400" y="228" font-size="12" fill="#2f5228" filter="url(#rough2)">是</text>
  <text x="456" y="228" font-size="12" fill="#2f5228" filter="url(#rough2)">否</text>
  <text x="524" y="228" font-size="12" fill="#444" filter="url(#rough2)">2</text>
  <path d="M50,236 L612,236" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>

  <rect x="44" y="252" width="572" height="92" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="60" y="276" font-size="13" fill="#2f5228" filter="url(#rough2)">下标 1 的窗口里有 bad（下标 2）⇒ Q1 = 真 ⇒ 1 不是 bad</text>
  <text x="60" y="300" font-size="13" fill="#2f5228" filter="url(#rough2)">存在非 bad 的下标 ⇒ 存在可行的首手 ⇒ 输出 YES</text>
  <text x="60" y="324" font-size="12" fill="#666666" filter="url(#rough2)">手算：取走 1 → Egor 取 2 跳到 (2,2) → 两边各吃一个 2 → Dabir 无子可走</text>

  <rect x="44" y="356" width="572" height="54" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="378" font-size="13" fill="#8f3b38" filter="url(#rough2)">对照样例 6：a = [1,3,1,1]，k = 1</text>
  <text x="60" y="400" font-size="12" fill="#8f3b38" filter="url(#rough2)">差 2 &gt; 1 且个数全奇（3 与 1）⇒ 每个下标都 bad ⇒ 输出 NO</text>
</svg>
