<svg xmlns="http://www.w3.org/2000/svg" width="760" height="418" viewBox="0 0 760 418"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c9801f"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a8524a"/>
    </marker>
  </defs>
  <rect width="760" height="418" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">样例 1 走查：最短祖先 "a c"，长度 2</text>
  <text x="56.0" y="78.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">候选祖先 w</text>
  <rect x="300.0" y="60.0" width="56.0" height="38.0" fill="#fdf3e3" stroke="#c9801f" stroke-width="2.0" filter="url(#rough2)"/>
  <text x="328.0" y="84.8" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="364.0" y="60.0" width="56.0" height="38.0" fill="#fdf3e3" stroke="#c9801f" stroke-width="2.0" filter="url(#rough2)"/>
  <text x="392.0" y="84.8" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="430.0" y="84.0" text-anchor="start" font-size="12.5" fill="#c9801f" font-weight="bold" filter="url(#rough2)">|w| = 2</text>
  <rect x="30.0" y="118.0" width="330.0" height="130.0" rx="10" fill="#f7f9fc" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="195.0" y="144.0" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">a ⇒* "a" 且 a ⇒* "a"</text>
  <text x="56.0" y="174.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">s1 的 a 段："a"（第 1 位）</text>
  <text x="56.0" y="200.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">s2 的 a 段："a"（第 1 位）</text>
  <text x="56.0" y="228.0" text-anchor="start" font-size="11.5" fill="#8a8a8a" filter="url(#rough2)">符号 a 没有替换规则，只能原地不动</text>
  <rect x="392.0" y="118.0" width="340.0" height="130.0" rx="10" fill="#f4f9f2" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="562.0" y="144.0" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">c ⇒* "baba" 且 c ⇒* "ba"</text>
  <text x="410.0" y="172.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">c ⇒ cc ⇒ ba ba = "baba"（s1 的 2..5 位）</text>
  <text x="410.0" y="196.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">c ⇒ ba = "ba"（s2 的 2..3 位）</text>
  <text x="410.0" y="224.0" text-anchor="start" font-size="11.5" fill="#8a8a8a" filter="url(#rough2)">同一符号、两条不同步数的推导路径</text>
  <path d="M 195.0 252.0 L 195.0 274.0" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 562.0 252.0 L 562.0 274.0" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="30.0" y="276.0" width="330.0" height="56.0" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="195.0" y="300.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">s1 = "a" + "baba" = ababa</text>
  <text x="195.0" y="322.0" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">对应 w = a c</text>
  <rect x="392.0" y="276.0" width="340.0" height="56.0" rx="8" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="562.0" y="300.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">s2 = "a" + "ba" = aba</text>
  <text x="562.0" y="322.0" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">对应同一个 w = a c</text>
  <rect x="30.0" y="344.0" width="702.0" height="66.0" rx="8" fill="#fdf3e3" stroke="#c9801f" stroke-width="1.5" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="46.0" y="368.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">为什么长度 1 不行：样例只有 c→ba、c→cc 两条规则，c 只能推出 (ba)^L，</text>
  <text x="46.0" y="390.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">首字符必是 b；而 s1 以 a 开头，a、b 都没有规则，所以没有单个符号能推出 ababa。</text>
</svg>
