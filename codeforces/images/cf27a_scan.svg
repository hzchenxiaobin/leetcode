<svg xmlns="http://www.w3.org/2000/svg" width="760" height="310" viewBox="0 0 760 310"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="760" height="310" fill="#fafafa"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">从 1 往上扫，第一个“没出现”的就是答案</text>
  <path d="M 140 40 Q 400 46 660 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="120" y="90" width="90" height="44" rx="8" fill="#d9ecd4" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="165" y="118" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">seen[1]</text>
  <text x="165" y="156" text-anchor="middle" font-size="10.5" fill="#2f5223" filter="url(#rough2)">✓ 出现</text>
  <rect x="230" y="90" width="90" height="44" rx="8" fill="#d9ecd4" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="275" y="118" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">seen[2]</text>
  <text x="275" y="156" text-anchor="middle" font-size="10.5" fill="#2f5223" filter="url(#rough2)">✓ 出现</text>
  <rect x="340" y="90" width="90" height="44" rx="8" fill="#fdeeee" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="385" y="118" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">seen[3]</text>
  <text x="385" y="156" text-anchor="middle" font-size="10.5" fill="#8a2b28" filter="url(#rough2)">✗ 没出现</text>
  <rect x="450" y="90" width="90" height="44" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="495" y="118" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">seen[4]</text>
  <text x="495" y="156" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">?</text>
  <rect x="560" y="90" width="90" height="44" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="605" y="118" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">seen[5]</text>
  <text x="605" y="156" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">?</text>
  <path d="M 120 180 L 640 180" stroke="#777777" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="120" y="206" font-size="11.5" fill="#777777" filter="url(#rough2)">扫描方向 →</text>
  <text x="120" y="246" font-size="12.5" fill="#8a2b28" filter="url(#rough2)">样例 1：seen = {1,2,7}，1 ✓、2 ✓、3 ✗ → 输出 3</text>
  <text x="120" y="276" font-size="11.5" fill="#555555" filter="url(#rough2)">7 超过 n+1 = 4，不可能是答案，标不标记都可以。</text>

</svg>
