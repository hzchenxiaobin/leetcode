<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 452"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="720" height="452" fill="#fafafa" filter="url(#rough2)"/>

  <text x="360" y="36" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">
    样例 3 演算：a = [8, 76, 49, 26, 24, 80, 99]
  </text>
  <text x="360" y="58" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">
    每个元素单独抬到下一个素数，累计代价只需与 Σa = 362 比一次
  </text>

  <!-- table frame -->
  <rect x="60" y="76" width="600" height="314" rx="6" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.8"
        filter="url(#rough2)"/>
  <!-- header band -->
  <rect x="60" y="76" width="600" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"
        filter="url(#rough2)"/>
  <rect x="60" y="356" width="600" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"
        filter="url(#rough2)"/>

  <!-- vertical separators -->
  <g stroke="#b9b9b9" stroke-width="1" filter="url(#rough2)">
    <path d="M130,76 L130,390"/>
    <path d="M250,76 L250,390"/>
    <path d="M392,76 L392,390"/>
    <path d="M490,76 L490,390"/>
  </g>
  <!-- horizontal separators -->
  <g stroke="#c9c9c9" stroke-width="1" filter="url(#rough2)">
    <path d="M60,116 L660,116"/>
    <path d="M60,150 L660,150"/>
    <path d="M60,184 L660,184"/>
    <path d="M60,218 L660,218"/>
    <path d="M60,252 L660,252"/>
    <path d="M60,286 L660,286"/>
    <path d="M60,320 L660,320"/>
    <path d="M60,356 L660,356"/>
  </g>

  <!-- header text -->
  <g font-size="12" fill="#1f3b57" filter="url(#rough2)">
    <text x="95" y="101" text-anchor="middle">i</text>
    <text x="190" y="101" text-anchor="middle">a_i</text>
    <text x="321" y="101" text-anchor="middle">b_i = nxt[a_i]</text>
    <text x="441" y="101" text-anchor="middle">x_i = b_i − a_i</text>
    <text x="575" y="101" text-anchor="middle">累计 Σx</text>
  </g>

  <!-- rows -->
  <g font-size="13" fill="#333" filter="url(#rough2)">
    <text x="95" y="138" text-anchor="middle">1</text>
    <text x="190" y="138" text-anchor="middle">8</text>
    <text x="321" y="138" text-anchor="middle">11</text>
    <text x="441" y="138" text-anchor="middle">3</text>
    <text x="575" y="138" text-anchor="middle">3</text>

    <text x="95" y="172" text-anchor="middle">2</text>
    <text x="190" y="172" text-anchor="middle">76</text>
    <text x="321" y="172" text-anchor="middle">79</text>
    <text x="441" y="172" text-anchor="middle">3</text>
    <text x="575" y="172" text-anchor="middle">6</text>

    <text x="95" y="206" text-anchor="middle">3</text>
    <text x="190" y="206" text-anchor="middle">49</text>
    <text x="321" y="206" text-anchor="middle">53</text>
    <text x="441" y="206" text-anchor="middle">4</text>
    <text x="575" y="206" text-anchor="middle">10</text>

    <text x="95" y="240" text-anchor="middle">4</text>
    <text x="190" y="240" text-anchor="middle">26</text>
    <text x="441" y="240" text-anchor="middle">3</text>
    <text x="575" y="240" text-anchor="middle">13</text>

    <text x="95" y="274" text-anchor="middle">5</text>
    <text x="190" y="274" text-anchor="middle">24</text>
    <text x="441" y="274" text-anchor="middle">5</text>
    <text x="575" y="274" text-anchor="middle">18</text>

    <text x="95" y="308" text-anchor="middle">6</text>
    <text x="190" y="308" text-anchor="middle">80</text>
    <text x="321" y="308" text-anchor="middle">83</text>
    <text x="441" y="308" text-anchor="middle">3</text>
    <text x="575" y="308" text-anchor="middle">21</text>

    <text x="95" y="342" text-anchor="middle">7</text>
    <text x="190" y="342" text-anchor="middle">99</text>
    <text x="321" y="342" text-anchor="middle">101</text>
    <text x="441" y="342" text-anchor="middle">2</text>
    <text x="575" y="342" text-anchor="middle">23</text>
  </g>

  <!-- duplicate prime highlight: rows 4 and 5 both map to 29 -->
  <g filter="url(#rough2)">
    <rect x="252" y="220" width="138" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="321" y="240" text-anchor="middle" font-size="13" fill="#2c4a22">29</text>
    <rect x="252" y="254" width="138" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="321" y="274" text-anchor="middle" font-size="13" fill="#2c4a22">29</text>
  </g>

  <!-- total row -->
  <text x="190" y="378" text-anchor="middle" font-size="12.5" fill="#6b4c12" filter="url(#rough2)">
    合计 Σx = 23
  </text>
  <text x="441" y="378" text-anchor="middle" font-size="12.5" fill="#6b4c12" filter="url(#rough2)">
    ≤ Σa = 362 ✓
  </text>
  <text x="590" y="378" text-anchor="middle" font-size="12.5" fill="#6b4c12" filter="url(#rough2)">
    操作 7 ≤ 17 ✓</text>

  <text x="360" y="416" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">
    绿格：26 与 24 都变成 29（相等 ⇒ gcd = min，合法），因此无需去重
  </text>
  <text x="360" y="438" text-anchor="middle" font-size="12" fill="#8d3b38" filter="url(#rough2)">
    注意代价是「相对值」而非「绝对差」：a_i = 8 只加 3 就用了 37.5% 的预算
  </text>
</svg>
