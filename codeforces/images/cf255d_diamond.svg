<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="380" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">已点亮的格子 = 与 (x,y) 曼哈顿距离 ≤ t 的格子</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">被 n×n 边界裁掉，用"三角形计数"公式 O(1) 算每个象限</text>
  <g filter="url(#rough2)"><rect x="150" y="90" width="260" height="260" rx="4" fill="#ffffff" fill-opacity="0.4" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="280" y="80" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">n × n 棋盘</text>
  <line x1="280" y1="90" x2="280" y2="350" stroke="#cccccc" stroke-width="1.0" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <line x1="150" y1="220" x2="410" y2="220" stroke="#cccccc" stroke-width="1.0" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="258" y="198" width="44" height="44" rx="4" fill="#f6d9d7" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="280.0" y="223.6" text-anchor="middle" font-size="10" fill="#2b2b2b" filter="url(#rough2)">(x,y)</text>
  <text x="430" y="120" text-anchor="start" font-size="12.5" fill="#555555" filter="url(#rough2)">四个象限互不重叠（坐标轴归入其中一侧）</text>
  <text x="430" y="148" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">T(a,b,t) = C2(t) - C2(t-a-1) - C2(t-b-1) + C2(t-a-b-2)</text>
  <text x="430" y="176" text-anchor="start" font-size="12" fill="#2f4a66" filter="url(#rough2)">其中 C2(u) = (u+1)(u+2)/2 是 dx+dy ≤ u 的解数</text>
  <text x="430" y="212" text-anchor="start" font-size="13" fill="#3d6b2f" filter="url(#rough2)">答案关于 t 单调 → 二分 t ∈ [0, 2n]</text>
  <text x="430" y="240" text-anchor="start" font-size="12.5" fill="#555555" filter="url(#rough2)">约 31 次 O(1) 求值</text>
  <text x="440" y="340" text-anchor="middle" font-size="12.5" fill="#b05a5a" filter="url(#rough2)">n 可达 10^9，必须用 64/128 位整数（C2 最大约 2×10^18）</text>
</svg>
