<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="417"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="240" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">样例 1：(()) → 12</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">两对括号各染一个，再排除相邻同色</text>
  <text x="450" y="106" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">()() 结构：外层一对、内层一对</text>
  <text x="450" y="142" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">每对 4 种选法（左红/左蓝/右红/右蓝）</text>
  <text x="450" y="180" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4 × 4 − 4（相邻同色）= 12</text>
  <text x="450" y="216" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">样例 3：() 只有 4 种 ✓</text>
</svg>
