<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="883"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="300" fill="#fafafa"/>
  <text x="360.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">判定流程：6 个排列逐一检查</text>
  <path d="M 115.2 42 Q 360.0 48 604.8 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="360.0" y="286" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">距离 = (序号差) mod 12</text>
  <rect x="36" y="72" width="150" height="52" rx="7" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="111" y="102" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">读入 3 个音名</text>
  <rect x="212" y="72" width="150" height="52" rx="7" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="287" y="102" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">查表 → 序号</text>
  <rect x="388" y="60" width="148" height="76" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="462" y="88" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">6 个排列</text>
  <text x="462" y="112" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">(4,3) 或 (3,4) ?</text>
  <rect x="560" y="60" width="130" height="76" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="625" y="88" text-anchor="middle" font-size="12.5" fill="#2f5223" filter="url(#rough2)">major /</text>
  <text x="625" y="112" text-anchor="middle" font-size="12.5" fill="#2f5223" filter="url(#rough2)">minor /</text>
  <line x1="186.0" y1="98.0" x2="208.0" y2="98.0" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <line x1="362.0" y1="98.0" x2="384.0" y2="98.0" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <line x1="536.0" y1="98.0" x2="556.0" y2="98.0" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <rect x="80" y="168" width="260" height="52" rx="7" fill="#fbeeee" stroke="#a05a5a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="210" y="198" text-anchor="middle" font-size="12.5" fill="#6b3030" filter="url(#rough2)">都不命中 → strange</text>
  <line x1="462.0" y1="136.0" x2="462.0" y2="160.0" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="500" y="156" text-anchor="middle" font-size="11" fill="#8c2f2c" filter="url(#rough2)">否</text>
  <line x1="462.0" y1="160.0" x2="342.0" y2="188.0" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <rect x="80" y="232" width="560" height="40" rx="8" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="360" y="257" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">样例 2 的 C# B F 要重排成 B C# F 才看出小三和弦</text>
</svg>
