<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 322" width="640" height="322">
<defs>
<filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="13" result="noise"/>
<feDisplacementMap in="SourceGraphic" in2="noise" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect x="0" y="0" width="640" height="322" fill="#fafafa"/>
<g font-family="Comic Sans MS, Kaiti SC, cursive">
<text x="320.0" y="24.0" font-size="15" fill="#33475b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">样例 3：S=4，s_h=2，O=2，选 2 人</text>
<rect x="80.0" y="60.0" width="240.0" height="120.0" rx="10" fill="#ffffff" stroke="#9ab" stroke-width="1.6" filter="url(#rough2)"/>
<text x="200.0" y="86.0" font-size="12" fill="#7a5c2e" text-anchor="middle" font-weight="normal" filter="url(#rough2)">Wafa 的系（2 人）</text>
<circle cx="150.0" cy="130.0" r="20.0" fill="#f6d9b0" stroke="#a08050" stroke-width="1.8" filter="url(#rough2)"/>
<text x="150.0" y="136.0" font-size="13" fill="#7a5c2e" text-anchor="middle" font-weight="normal" filter="url(#rough2)">W</text>
<circle cx="230.0" cy="130.0" r="20.0" fill="#f6d9b0" stroke="#a08050" stroke-width="1.8" filter="url(#rough2)"/>
<text x="230.0" y="136.0" font-size="13" fill="#7a5c2e" text-anchor="middle" font-weight="normal" filter="url(#rough2)">队</text>
<rect x="360.0" y="60.0" width="200.0" height="120.0" rx="10" fill="#ffffff" stroke="#9ab" stroke-width="1.6" filter="url(#rough2)"/>
<text x="460.0" y="86.0" font-size="12" fill="#3f6b4f" text-anchor="middle" font-weight="normal" filter="url(#rough2)">别的系（2 人）</text>
<circle cx="420.0" cy="130.0" r="20.0" fill="#cfe3d4" stroke="#4f7f60" stroke-width="1.8" filter="url(#rough2)"/>
<circle cx="500.0" cy="130.0" r="20.0" fill="#cfe3d4" stroke="#4f7f60" stroke-width="1.8" filter="url(#rough2)"/>
<text x="320.0" y="210.0" font-size="13" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">候选 3 人里选 2 人：C(3,2) = 3 种</text>
<text x="320.0" y="236.0" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">「没有同系队友」= 两个都来自别的系：只有 1 种</text>
<text x="320.0" y="268.0" font-size="15" fill="#1f6f43" text-anchor="middle" font-weight="bold" filter="url(#rough2)">P = 1 − 1/3 = 2/3 = 0.666667</text>
<text x="320.0" y="306.0" font-size="12" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">（样例 1 的 O=1 不够填 2 个名额 → 概率 1；样例 2 是 S&lt;n → -1）</text>
</g>
</svg>
