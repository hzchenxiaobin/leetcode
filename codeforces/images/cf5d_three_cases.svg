<svg xmlns="http://www.w3.org/2000/svg" width="780" height="360" viewBox="0 0 780 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="780" height="360" fill="#fafafa"/>
  <text x="390" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">三种情形：限速牌到底管不管用，取决于 d 处的可达速度</text>

  <!-- ============ 面板 1 ============ -->
  <text x="140" y="62" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">① V_d ≤ w：牌子管不着</text>
  <line x1="40" y1="250" x2="230" y2="250" stroke="#2b2b2b" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="40" y1="250" x2="40" y2="100" stroke="#2b2b2b" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="40" y1="120" x2="230" y2="120" stroke="#b85450" stroke-width="1.2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <line x1="40" y1="95" x2="230" y2="95" stroke="#446688" stroke-width="1.2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="46" y="114" font-size="11" fill="#8f3b37" filter="url(#rough2)">w</text>
  <text x="46" y="90" font-size="11" fill="#2f4a66" filter="url(#rough2)">v</text>
  <line x1="150" y1="250" x2="150" y2="160" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <text x="150" y="268" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">d</text>
  <path d="M40,250 C52,196 70,168 150,155" fill="none" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <path d="M150,155 C176,150 200,130 226,112" fill="none" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <circle cx="150" cy="155" r="4.2" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="60" y="300" font-size="11" fill="#2f5223" filter="url(#rough2)">到 d 时还没到 w，</text>
  <text x="60" y="318" font-size="11" fill="#2f5223" filter="url(#rough2)">限速自动满足</text>

  <!-- ============ 面板 2 ============ -->
  <text x="390" y="62" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">② u &lt; v：加速再刹车</text>
  <line x1="290" y1="250" x2="480" y2="250" stroke="#2b2b2b" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="290" y1="250" x2="290" y2="100" stroke="#2b2b2b" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="290" y1="175" x2="480" y2="175" stroke="#b85450" stroke-width="1.2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <line x1="290" y1="105" x2="480" y2="105" stroke="#446688" stroke-width="1.2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="296" y="169" font-size="11" fill="#8f3b37" filter="url(#rough2)">w</text>
  <text x="296" y="100" font-size="11" fill="#2f4a66" filter="url(#rough2)">v</text>
  <line x1="420" y1="250" x2="420" y2="175" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <text x="420" y="268" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">d</text>
  <path d="M290,250 C300,190 316,152 356,138" fill="none" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <path d="M356,138 C382,142 408,160 420,175" fill="none" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <path d="M420,175 C440,168 462,140 476,124" fill="none" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <circle cx="356" cy="138" r="4.2" fill="#d6a040" filter="url(#rough2)"/>
  <text x="330" y="128" font-size="11" fill="#8a6015" filter="url(#rough2)">峰值 u</text>
  <text x="310" y="300" font-size="11" fill="#6d4a10" filter="url(#rough2)">u = √(ad + w²/2)</text>
  <text x="310" y="318" font-size="11" fill="#6d4a10" filter="url(#rough2)">把速度用满，最后一刻刹到 w</text>

  <!-- ============ 面板 3 ============ -->
  <text x="650" y="62" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8f3b37" filter="url(#rough2)">③ u ≥ v：先顶到 v 再刹车</text>
  <line x1="540" y1="250" x2="740" y2="250" stroke="#2b2b2b" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="540" y1="250" x2="540" y2="100" stroke="#2b2b2b" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="540" y1="175" x2="740" y2="175" stroke="#b85450" stroke-width="1.2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <line x1="540" y1="105" x2="740" y2="105" stroke="#446688" stroke-width="1.2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="546" y="169" font-size="11" fill="#8f3b37" filter="url(#rough2)">w</text>
  <text x="546" y="100" font-size="11" fill="#2f4a66" filter="url(#rough2)">v</text>
  <line x1="680" y1="250" x2="680" y2="175" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <text x="680" y="268" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">d</text>
  <path d="M540,250 C550,190 566,128 606,108" fill="none" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <line x1="606" y1="106" x2="646" y2="106" stroke="#446688" stroke-width="2.4" filter="url(#rough2)"/>
  <path d="M646,106 C662,110 674,142 680,175" fill="none" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <path d="M680,175 C700,168 718,140 734,124" fill="none" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="560" y="300" font-size="11" fill="#8f3b37" filter="url(#rough2)">中间能以 v 匀速一段</text>
  <text x="560" y="318" font-size="11" fill="#8f3b37" filter="url(#rough2)">刹车距离用足 d 点前的路</text>

  <!-- 分栏细线 -->
  <line x1="258" y1="60" x2="258" y2="330" stroke="#d0d0d0" stroke-width="1" stroke-dasharray="4 6" filter="url(#rough2)"/>
  <line x1="508" y1="60" x2="508" y2="330" stroke="#d0d0d0" stroke-width="1" stroke-dasharray="4 6" filter="url(#rough2)"/>

  <text x="390" y="346" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">V_d = min(v, √(2ad))；若 V_d ≤ w，则根本不用理会牌子，否则在 d 处速度取 w</text>
</svg>
