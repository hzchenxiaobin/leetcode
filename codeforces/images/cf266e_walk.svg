<svg xmlns="http://www.w3.org/2000/svg" width="880" height="280" viewBox="0 0 880 280"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="280" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">二项式展开把"平移"转成"幂和"</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">每层存 6 个幂和就够</text>
  <text x="150" y="110" text-anchor="start" font-size="13" fill="#2b2b2b" filter="url(#rough2)">(i-l+1)^k = Σ_j C(k,j)·(i)^j·(-(l-1))^{k-j}</text>
  <text x="150" y="156" text-anchor="start" font-size="13" fill="#2f4a66" filter="url(#rough2)">所以只需拿区间上的 Σ a_i·i^j（j≤k）做线性组合</text>
  <text x="150" y="200" text-anchor="start" font-size="13" fill="#3d6b2f" filter="url(#rough2)">样例：? 2 4 3 在 a=[5,0,2,1] 上得 43</text>
  <text x="150" y="244" text-anchor="start" font-size="13" fill="#b05a5a" filter="url(#rough2)">O(6 log n) 每次操作</text>
</svg>
