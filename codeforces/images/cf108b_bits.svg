<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 328" width="640" height="328">
<defs>
<filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="13" result="noise"/>
<feDisplacementMap in="SourceGraphic" in2="noise" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect x="0" y="0" width="640" height="328" fill="#fafafa"/>
<g font-family="Comic Sans MS, Kaiti SC, cursive">
<text x="320.0" y="24.0" font-size="15" fill="#33475b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">固定 a_i 时，取最大的 x = 2^a − 1 最有利</text>
<line x1="80.0" y1="120.0" x2="560.0" y2="120.0" stroke="#555" stroke-width="1.8" filter="url(#rough2)"/>
<line x1="140.0" y1="108.0" x2="140.0" y2="132.0" stroke="#555" stroke-width="1.6" filter="url(#rough2)"/>
<text x="140.0" y="152.0" font-size="11" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">0</text>
<line x1="260.0" y1="108.0" x2="260.0" y2="132.0" stroke="#555" stroke-width="1.6" filter="url(#rough2)"/>
<text x="260.0" y="152.0" font-size="11" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">2^a − 1</text>
<line x1="420.0" y1="108.0" x2="420.0" y2="132.0" stroke="#555" stroke-width="1.6" filter="url(#rough2)"/>
<text x="420.0" y="152.0" font-size="11" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">2^b − 1</text>
<rect x="140.0" y="96.0" width="120.0" height="48.0" rx="6" fill="none" stroke="#4f7f60" stroke-width="2.0" stroke-dasharray="5 4" filter="url(#rough2)"/>
<text x="200.0" y="88.0" font-size="11" fill="#3f6b4f" text-anchor="middle" font-weight="normal" filter="url(#rough2)">x 放得进 a 位</text>
<line x1="260.0" y1="70.0" x2="420.0" y2="70.0" stroke="#8a6d3b" stroke-width="2.0" filter="url(#rough2)"/>
<polygon points="420.0,70.0 411.0,65.5 411.0,74.5" fill="#8a6d3b" filter="url(#rough2)"/>
<text x="340.0" y="60.0" font-size="11" fill="#8a6d3b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">x² 需要 2a 位左右</text>
<rect x="80.0" y="190.0" width="480.0" height="64.0" rx="10" fill="#ffffff" stroke="#9ab" stroke-width="1.6" filter="url(#rough2)"/>
<text x="320.0" y="214.0" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">(2^a − 1)² ≥ 2^b  ⟺  b ≤ 2a − 1 且 a ≥ 2</text>
<text x="320.0" y="238.0" font-size="11" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">（a=1 时 1 &lt; 2^b，永远不行；b = 2a 时 2^b 反而更大）</text>
<text x="320.0" y="288.0" font-size="13" fill="#1f6f43" text-anchor="middle" font-weight="normal" filter="url(#rough2)">只需检查排序去重后相邻的两个位数</text>
<text x="320.0" y="314.0" font-size="12" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">16→32：32 ≤ 31 不成立；32→64：64 ≤ 63 不成立 → NO</text>
</g>
</svg>
