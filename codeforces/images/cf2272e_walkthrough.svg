<svg xmlns="http://www.w3.org/2000/svg" width="780" height="424" viewBox="0 0 780 424"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="780" height="424" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 3 走查：s = WRW，t = RWR（n = m = 3）</text>
  <path d="M 120 42 Q 390 50 660 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <text x="60" y="72" font-size="11.5" fill="#446688" filter="url(#rough2)">s 的 W 下标：{0, 2}（末位 L_max = 2）；t 的 W 下标：{1}（末位 L_max = 1）；K 指「本串前缀里最后一个 W 的下标」</text>

  <!-- 表头 -->
  <rect x="50" y="92" width="680" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="62" y="112" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">读数</text>
  <text x="200" y="112" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">K</text>
  <text x="312" y="112" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">另一条串的 W 位置</text>
  <text x="440" y="112" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">可取值集合</text>
  <text x="690" y="112" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">个数</text>

  <!-- 行 1 -->
  <rect x="50" y="124" width="680" height="46" fill="#ffffff" stroke="#d8d8d8" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="62" y="152" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">s[1]（s 的 R）</text>
  <text x="200" y="152" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="312" y="152" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">t：{1}</text>
  <text x="440" y="152" font-size="11.5" fill="#a14340" filter="url(#rough2)">[K+1, K+m+1] = [1, 4]</text>
  <text x="690" y="152" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">4</text>

  <!-- 行 2 -->
  <rect x="50" y="170" width="680" height="46" fill="#fafafa" stroke="#d8d8d8" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="62" y="198" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">t[0]（t 的 R）</text>
  <text x="200" y="198" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">−1</text>
  <text x="312" y="198" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">s：{0, 2}</text>
  <text x="440" y="198" font-size="10.5" fill="#a14340" filter="url(#rough2)">{0} ∪ [1,1] ∪ [3,3] = {0,1,3}</text>
  <text x="690" y="198" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">3</text>

  <!-- 行 3 -->
  <rect x="50" y="216" width="680" height="46" fill="#ffffff" stroke="#d8d8d8" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="62" y="244" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">t[2]（t 的 R）</text>
  <text x="200" y="244" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="312" y="244" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">s：{0, 2}</text>
  <text x="440" y="244" font-size="11.5" fill="#a14340" filter="url(#rough2)">[K+1, K+n+1] = [2, 5]</text>
  <text x="690" y="244" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">4</text>

  <!-- 计算过程 -->
  <rect x="50" y="274" width="680" height="128" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="64" y="298" font-size="11.5" font-weight="bold" fill="#2f5d22" filter="url(#rough2)">行 1：K = 0 ≥ 0 → max(m+1, L_max+i−K+1) = max(3+1, 1+1−0+1) = max(4, 3) = 4</text>
  <text x="64" y="322" font-size="11.5" fill="#2f5d22" filter="url(#rough2)">行 2：K = −1 → q = 2，w = i+1 = 1，间隙 {2} 全部 &gt; 1 → 并集 = 2·1 = 2，答案 = 1 + 2 = 3</text>
  <text x="64" y="346" font-size="11.5" fill="#2f5d22" filter="url(#rough2)">行 3：K = 1 ≥ 0 → max(n+1, L_max+i−K+1) = max(3+1, 2+2−1+1) = max(4, 4) = 4</text>
  <text x="64" y="372" font-size="11.5" font-weight="bold" fill="#2f5d22" filter="url(#rough2)">输出：第一行「4」，第二行「3 4」——与官方样例完全一致。</text>
  <text x="64" y="392" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">注意行 2 的 0：它来自「一个 W 都没执行」的情形，这是唯一可能取到 0 的场合。</text>
</svg>
