<svg xmlns="http://www.w3.org/2000/svg" width="740" height="390" viewBox="0 0 740 390"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="97"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="dg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="dr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="740" height="390" fill="#fafafa"/>
  <text x="370" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">状态 dp[mask][v]：从 mask 的最小点出发、停在 v 的路径条数</text>

  <!-- 图：0 - 1 - 2 是一条已走的路径，2 -> 3 是待扩展的边 -->
  <g stroke="#c9ced6" stroke-width="1.6" filter="url(#rough2)">
    <line x1="110" y1="130" x2="250" y2="110"/>
    <line x1="250" y1="110" x2="390" y2="160"/>
    <line x1="110" y1="130" x2="390" y2="160"/>
    <line x1="390" y1="160" x2="530" y2="120"/>
    <line x1="250" y1="110" x2="530" y2="120"/>
  </g>
  <g stroke="#4a7a3a" stroke-width="2.6" filter="url(#rough2)">
    <line x1="110" y1="130" x2="244" y2="111" marker-end="url(#dg)"/>
    <line x1="256" y1="111" x2="384" y2="158" marker-end="url(#dg)"/>
  </g>
  <line x1="396" y1="160" x2="524" y2="122" stroke="#b85450" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#dr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <circle cx="110" cy="130" r="17" fill="#fce8e6" stroke="#b85450" stroke-width="2.2"/>
    <text x="110" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="#8f3b37">0</text>
    <circle cx="250" cy="110" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="250" y="115" text-anchor="middle" font-size="13" fill="#2f5223">1</text>
    <circle cx="390" cy="160" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="390" y="165" text-anchor="middle" font-size="13" fill="#2f5223">2</text>
    <circle cx="530" cy="120" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="530" y="125" text-anchor="middle" font-size="13" fill="#2f4a66">3</text>
  </g>
  <text x="110" y="162" text-anchor="middle" font-size="11" fill="#8f3b37" filter="url(#rough2)">起点 = lowbit</text>
  <text x="330" y="200" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">已走路径 0→1→2，mask = {0,1,2}</text>
  <text x="470" y="160" font-size="11.5" fill="#8f3b37" filter="url(#rough2)">扩展：3 &gt; 0 且不在 mask 里</text>

  <!-- 状态与转移 -->
  <rect x="60" y="222" width="620" height="130" rx="10" fill="#f4f6f9" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="76" y="248" font-size="13" fill="#2f4a66" filter="url(#rough2)">状态：dp[mask][v]，mask 记录已访问顶点，v 是当前所在点</text>
  <text x="76" y="274" font-size="13" fill="#2f4a66" filter="url(#rough2)">转移：对 v 的邻居 u，若 u = lowbit(mask) 且 |mask| ≥ 3 ⇒ 形成一个环，计入答案</text>
  <text x="76" y="300" font-size="13" fill="#2f4a66" filter="url(#rough2)">　　　若 u &gt; lowbit(mask) 且 u 不在 mask 中 ⇒ dp[mask ∪ {u}][u] += dp[mask][v]</text>
  <text x="76" y="330" font-size="12.5" fill="#8f3b37" filter="url(#rough2)">每个 mask 只从它的最小点出发，因此每个环恰好在自己的最小点处被数到（正反各一次）。</text>
</svg>
