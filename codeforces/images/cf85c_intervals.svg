<svg xmlns="http://www.w3.org/2000/svg" width="880" height="352" viewBox="0 0 880 352"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="85"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="352" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每个叶子对应一段查询区间，答案在区间内是常数</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">期望 = (路径上各节点的“错误结果”之和) / 路径长度</text>
  <g filter="url(#rough2)"><line x1="110" y1="150" x2="770" y2="150" stroke="#888888" stroke-width="1.8" marker-end="url(#arrg)"/></g>
  <g filter="url(#rough2)"><rect x="110.0" y="120" width="92.4" height="26" rx="2" fill="#d7ecd0" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="156.2" y="138" text-anchor="middle" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">(−∞,2) 结果 2</text>
  <g filter="url(#rough2)"><rect x="202.4" y="120" width="105.6" height="26" rx="2" fill="#cfe0f5" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="255.2" y="138" text-anchor="middle" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">(2,4) 结果 6</text>
  <g filter="url(#rough2)"><rect x="308.0" y="120" width="132.0" height="26" rx="2" fill="#f6e3c4" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="374.0" y="138" text-anchor="middle" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">(4,6) …</text>
  <g filter="url(#rough2)"><rect x="440.0" y="120" width="132.0" height="26" rx="2" fill="#f6d9d7" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="506.0" y="138" text-anchor="middle" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">(6,8) …</text>
  <g filter="url(#rough2)"><rect x="572.0" y="120" width="105.60000000000002" height="26" rx="2" fill="#e8e8e8" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="624.8" y="138" text-anchor="middle" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">(8,12) …</text>
  <g filter="url(#rough2)"><rect x="677.6" y="120" width="92.39999999999998" height="26" rx="2" fill="#d7ecd0" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="723.8" y="138" text-anchor="middle" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">(12,∞) …</text>
  <g filter="url(#rough2)"><line x1="198.0" y1="146" x2="198.0" y2="158" stroke="#b85450" stroke-width="2"/></g>
  <text x="198.0" y="176" text-anchor="middle" font-size="11" fill="#8a2b28" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><line x1="286.0" y1="146" x2="286.0" y2="158" stroke="#b85450" stroke-width="2"/></g>
  <text x="286.0" y="176" text-anchor="middle" font-size="11" fill="#8a2b28" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><line x1="374.0" y1="146" x2="374.0" y2="158" stroke="#b85450" stroke-width="2"/></g>
  <text x="374.0" y="176" text-anchor="middle" font-size="11" fill="#8a2b28" filter="url(#rough2)">6</text>
  <g filter="url(#rough2)"><line x1="462.0" y1="146" x2="462.0" y2="158" stroke="#b85450" stroke-width="2"/></g>
  <text x="462.0" y="176" text-anchor="middle" font-size="11" fill="#8a2b28" filter="url(#rough2)">8</text>
  <g filter="url(#rough2)"><line x1="550.0" y1="146" x2="550.0" y2="158" stroke="#b85450" stroke-width="2"/></g>
  <text x="550.0" y="176" text-anchor="middle" font-size="11" fill="#8a2b28" filter="url(#rough2)">10</text>
  <g filter="url(#rough2)"><line x1="638.0" y1="146" x2="638.0" y2="158" stroke="#b85450" stroke-width="2"/></g>
  <text x="638.0" y="176" text-anchor="middle" font-size="11" fill="#8a2b28" filter="url(#rough2)">12</text>
  <g filter="url(#rough2)"><line x1="726.0" y1="146" x2="726.0" y2="158" stroke="#b85450" stroke-width="2"/></g>
  <text x="726.0" y="176" text-anchor="middle" font-size="11" fill="#8a2b28" filter="url(#rough2)">14</text>
  <text x="440" y="240" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">同一段区间里的查询键，走的是同一条根→叶路径，每个节点的“错误分支结果”也相同</text>
  <text x="440" y="266" text-anchor="middle" font-size="12" fill="#3d6b2f" filter="url(#rough2)">所以只需对每个叶子算一次 S = Σ 错误结果 与深度 d，答案 = S / d</text>
  <text x="440" y="300" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">离线做法：DFS 携带 (lo, hi, S, d) 给叶子标区间，查询二分定位 → O((n+k) log n)</text>
</svg>
