<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="353"/>
    <feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></defs>
  <rect width="700" height="300" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">双掩码 DP：逐行放棋子</text>
  <path d="M 150 40 Q 350 46 550 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="60" width="580" height="70" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="84" font-size="13" fill="#22314a" filter="url(#rough2)">第 i 行选一列 j（未被占用），它落在对角 d=(i+j) mod n（也未被占用）。</text>
  <text x="76" y="108" font-size="12.5" fill="#22314a" filter="url(#rough2)">dp[(cols|1&lt;&lt;j, diags|1&lt;&lt;d)] += dp[(cols,diags)]；最后把所有状态的值加起来就是 A(n)。</text>
  <text x="76" y="126" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">（第 i 行由已放行数 = |cols| 唯一确定，所以不用把 i 放进状态。）</text>
  <g filter="url(#rough2)"><rect x="60" y="142" width="580" height="70" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="166" font-size="12.5" fill="#2f5223" filter="url(#rough2)">键 = cols·2ⁿ + diags（n ≤ 16 ⇒ 32 位掩码，64 位键够用），用 unordered_map 存。</text>
  <text x="76" y="190" font-size="12.5" fill="#2f5223" filter="url(#rough2)">n=15 时状态数峰值 2.6·10⁶，每个状态枚举 ≤ 15 列 ⇒ 约 4·10⁷ 次转移。</text>
  <text x="76" y="208" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">实测 n=15：2.2 s（3 s 时限，偏紧但可过；C++ 建议开 -O2）。</text>
  <g filter="url(#rough2)"><rect x="60" y="224" width="580" height="60" rx="8" fill="#fbeeee" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="76" y="248" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">易错 1：n 为偶数直接输出 0（否则 DP 也能跑，但白费时间）。</text>
  <text x="76" y="270" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">易错 2：最后要把 n! 乘上去（模 1e9+7），别把 A(n) 当答案。</text>
</svg>
