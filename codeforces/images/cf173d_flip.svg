<svg xmlns="http://www.w3.org/2000/svg" width="740" height="400" viewBox="0 0 740 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="101"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="740" height="400" fill="#fafafa"/>
  <text x="370" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每个连通块可整体翻转：用 3 状态 DP 把 0 侧点数调成 3 的倍数</text>
  <path d="M 170 46 Q 370 52 570 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="50" y="88" width="150" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="125" y="108" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">块 1：{1,2}  (1,1)</text>
  <text x="125" y="126" text-anchor="middle" font-size="10" font-weight="normal" fill="#446688" filter="url(#rough2)">贡献 1 或 1</text>
  <line x1="125" y1="134" x2="125" y2="162" stroke="#446688" stroke-width="1.4" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="50" y="162" width="150" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="125" y="182" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">块 2：{3}  (1,0)</text>
  <text x="125" y="200" text-anchor="middle" font-size="10" font-weight="normal" fill="#446688" filter="url(#rough2)">贡献 1 或 0</text>
  <line x1="125" y1="208" x2="125" y2="236" stroke="#446688" stroke-width="1.4" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="50" y="236" width="150" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="125" y="256" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">块 3：{4,5,6}  (1,2)</text>
  <text x="125" y="274" text-anchor="middle" font-size="10" font-weight="normal" fill="#446688" filter="url(#rough2)">贡献 1 或 2</text>
  <text x="250" y="76" text-anchor="start" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">DP：可达的“0 侧点数 mod 3”</text>
  <text x="240" y="112" text-anchor="end" font-size="10.5" font-weight="normal" fill="#555" filter="url(#rough2)">初始</text>
  <rect x="250" y="88" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="278" y="110" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">✓</text>
  <rect x="312" y="88" width="56" height="34" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="340" y="110" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">·</text>
  <rect x="374" y="88" width="56" height="34" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="402" y="110" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">·</text>
  <text x="240" y="152" text-anchor="end" font-size="10.5" font-weight="normal" fill="#555" filter="url(#rough2)">块1 (1,1)</text>
  <rect x="250" y="128" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="278" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">✓</text>
  <rect x="312" y="128" width="56" height="34" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="340" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">·</text>
  <rect x="374" y="128" width="56" height="34" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="402" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">·</text>
  <text x="240" y="192" text-anchor="end" font-size="10.5" font-weight="normal" fill="#555" filter="url(#rough2)">块2 (1,0)</text>
  <rect x="250" y="168" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="278" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">✓</text>
  <rect x="312" y="168" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="340" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">✓</text>
  <rect x="374" y="168" width="56" height="34" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="402" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">·</text>
  <text x="240" y="232" text-anchor="end" font-size="10.5" font-weight="normal" fill="#555" filter="url(#rough2)">块3 (1,2)</text>
  <rect x="250" y="208" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="278" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">✓</text>
  <rect x="312" y="208" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="340" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">✓</text>
  <rect x="374" y="208" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="402" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">✓</text>
  <text x="256" y="242" text-anchor="start" font-size="10.5" font-weight="normal" fill="#777" filter="url(#rough2)">余数 → 0   1   2</text>
  <rect x="50" y="310" width="290" height="72" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="64" y="332" text-anchor="start" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">情况 A：a ≡ 0 (mod 3)</text>
  <text x="64" y="352" text-anchor="start" font-size="11" font-weight="normal" fill="#7a5a1b" filter="url(#rough2)">两侧点数都被 3 整除 →</text>
  <text x="64" y="370" text-anchor="start" font-size="11" font-weight="normal" fill="#7a5a1b" filter="url(#rough2)">同色三三分组即可，一定无桥。</text>
  <rect x="380" y="310" width="310" height="72" rx="9" fill="#fdecea" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="394" y="332" text-anchor="start" font-size="12" font-weight="bold" fill="#8c3a36" filter="url(#rough2)">情况 B：怎么翻都到不了 0</text>
  <text x="394" y="352" text-anchor="start" font-size="11" font-weight="normal" fill="#8c3a36" filter="url(#rough2)">例如只有一块 (1,1) 和一块 (1,0)：</text>
  <text x="394" y="370" text-anchor="start" font-size="11" font-weight="normal" fill="#8c3a36" filter="url(#rough2)">a 只能取 1 或 2 → 必须混色。</text>
</svg>
