<svg xmlns="http://www.w3.org/2000/svg" width="760" height="342" viewBox="0 0 760 342"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c9801f"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a8524a"/>
    </marker>
  </defs>
  <rect width="760" height="342" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">进位才是位数 +1 的唯一原因</text>
  <rect x="30.0" y="60.0" width="350.0" height="214.0" rx="10" fill="#f7f9fc" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="205.0" y="88.0" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">9 进制：78 + 87</text>
  <text x="80.0" y="128.0" text-anchor="start" font-size="20" fill="#2b2b2b" filter="url(#rough2)">7 8</text>
  <text x="80.0" y="160.0" text-anchor="start" font-size="20" fill="#2b2b2b" filter="url(#rough2)">8 7</text>
  <text x="48.0" y="160.0" text-anchor="middle" font-size="18" fill="#2b2b2b" filter="url(#rough2)">+</text>
  <path d="M 70 174 L 300 174" stroke="#2b2b2b" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="80.0" y="212.0" text-anchor="start" font-size="20" fill="#c9801f" font-weight="bold" filter="url(#rough2)">1 7 6</text>
  <text x="50.0" y="246.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">8+7=15=1·9+6 → 写 6 进 1</text>
  <text x="50.0" y="266.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">7+8+1=16=1·9+7 → 写 7 再进 1</text>
  <text x="300.0" y="246.0" text-anchor="start" font-size="13" fill="#c9801f" font-weight="bold" filter="url(#rough2)">共 3 位</text>
  <rect x="380.0" y="60.0" width="350.0" height="214.0" rx="10" fill="#f4f9f2" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="555.0" y="88.0" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">16 进制：78 + 87</text>
  <text x="430.0" y="128.0" text-anchor="start" font-size="20" fill="#2b2b2b" filter="url(#rough2)">7 8</text>
  <text x="430.0" y="160.0" text-anchor="start" font-size="20" fill="#2b2b2b" filter="url(#rough2)">8 7</text>
  <text x="398.0" y="160.0" text-anchor="middle" font-size="18" fill="#2b2b2b" filter="url(#rough2)">+</text>
  <path d="M 420 174 L 650 174" stroke="#2b2b2b" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="430.0" y="212.0" text-anchor="start" font-size="20" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">F F</text>
  <text x="400.0" y="246.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">8+7=15=F，最高位没有进位</text>
  <text x="400.0" y="266.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">数值 255 只需 2 位十六进制</text>
  <text x="650.0" y="246.0" text-anchor="start" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">共 2 位</text>
  <text x="380.0" y="306.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">同样两个数，9 进制是 176（3 位），16 进制是 FF（2 位）：</text>
  <text x="380.0" y="330.0" text-anchor="middle" font-size="12.5" fill="#c9801f" font-weight="bold" filter="url(#rough2)">进制越大权值越大，但只有最高位进位会让位数从 m 变成 m+1。</text>
</svg>
