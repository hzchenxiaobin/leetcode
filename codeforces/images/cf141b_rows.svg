<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1411"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="720" height="320" fill="#fafafa"/>
  <text x="360.0" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">跳房子的行结构与编号</text>
  <path d="M 115.2 42 Q 360.0 48 604.8 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="177" y="248" width="46" height="32" rx="5" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200.0" y="268.1" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">#1</text>
  <text x="120.0" y="270.0" text-anchor="end" font-size="11.0" fill="#555555" filter="url(#rough2)">r = 0</text>
  <rect x="177" y="212" width="46" height="32" rx="5" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200.0" y="232.1" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">#2</text>
  <text x="120.0" y="234.0" text-anchor="end" font-size="11.0" fill="#555555" filter="url(#rough2)">r = 1</text>
  <rect x="154" y="176" width="46" height="32" rx="5" fill="#e8eef7" stroke="#335478" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="177.0" y="196.1" text-anchor="middle" font-size="11.5" fill="#335478" filter="url(#rough2)">#3</text>
  <rect x="200" y="176" width="46" height="32" rx="5" fill="#e8eef7" stroke="#335478" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="223.0" y="196.1" text-anchor="middle" font-size="11.5" fill="#335478" filter="url(#rough2)">#4</text>
  <text x="120.0" y="198.0" text-anchor="end" font-size="11.0" fill="#555555" filter="url(#rough2)">r = 2</text>
  <rect x="177" y="140" width="46" height="32" rx="5" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200.0" y="160.1" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">#5</text>
  <text x="120.0" y="162.0" text-anchor="end" font-size="11.0" fill="#555555" filter="url(#rough2)">r = 3</text>
  <rect x="154" y="104" width="46" height="32" rx="5" fill="#e8eef7" stroke="#335478" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="177.0" y="124.1" text-anchor="middle" font-size="11.5" fill="#335478" filter="url(#rough2)">#6</text>
  <rect x="200" y="104" width="46" height="32" rx="5" fill="#e8eef7" stroke="#335478" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="223.0" y="124.1" text-anchor="middle" font-size="11.5" fill="#335478" filter="url(#rough2)">#7</text>
  <text x="120.0" y="126.0" text-anchor="end" font-size="11.0" fill="#555555" filter="url(#rough2)">r = 4</text>
  <rect x="177" y="68" width="46" height="32" rx="5" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200.0" y="88.1" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">#8</text>
  <text x="120.0" y="90.0" text-anchor="end" font-size="11.0" fill="#555555" filter="url(#rough2)">r = 5</text>
  <path d="M 200.0 58.0 L 200.0 292.0" stroke="#8c2f2c" stroke-width="1.4" fill="none" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="204.0" y="66.0" text-anchor="start" font-size="11.0" fill="#8c2f2c" filter="url(#rough2)">x = 0</text>
  <text x="330.0" y="92.0" text-anchor="start" font-size="12.5" fill="#335478" font-weight="bold" filter="url(#rough2)">行号 r = y / a（从 0 起数）</text>
  <text x="330.0" y="122.0" text-anchor="start" font-size="11.5" fill="#2f5223" filter="url(#rough2)">r = 0、1：1 格，编号 1、2</text>
  <text x="330.0" y="150.0" text-anchor="start" font-size="11.5" fill="#335478" filter="url(#rough2)">r 偶 (≥2)：2 格 → 2+3(r−2)/2 与 +1</text>
  <text x="330.0" y="178.0" text-anchor="start" font-size="11.5" fill="#2f5223" filter="url(#rough2)">r 奇 (≥3)：1 格 → 4+3(r−3)/2 + 1</text>
  <rect x="322" y="196" width="370" height="82" rx="5" fill="#f5e8e8" stroke="#8c2f2c" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="507.0" y="193.2" text-anchor="middle" font-size="11.0" fill="#8c2f2c" filter="url(#rough2)">半宽内才算命中：单格行 2</text>
  <text x="507.0" y="206.9" text-anchor="middle" font-size="11.0" fill="#8c2f2c" filter="url(#rough2)">x</text>
  <text x="507.0" y="220.5" text-anchor="middle" font-size="11.0" fill="#8c2f2c" filter="url(#rough2)"> &lt; a，双格行 </text>
  <text x="507.0" y="234.1" text-anchor="middle" font-size="11.0" fill="#8c2f2c" filter="url(#rough2)">x</text>
  <text x="507.0" y="247.8" text-anchor="middle" font-size="11.0" fill="#8c2f2c" filter="url(#rough2)"> &lt; a</text>
  <text x="507.0" y="261.4" text-anchor="middle" font-size="11.0" fill="#8c2f2c" filter="url(#rough2)">任何边界（x=0、</text>
  <text x="507.0" y="275.1" text-anchor="middle" font-size="11.0" fill="#8c2f2c" filter="url(#rough2)">x</text>
  <text x="507.0" y="288.7" text-anchor="middle" font-size="11.0" fill="#8c2f2c" filter="url(#rough2)"> 恰为半宽、y 为 a 的倍数）都输出 -1</text>
  <text x="360.0" y="306" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">格子数按 1、1、2、1、2… 排布，x=0 是双格行的分界线</text>
</svg>
