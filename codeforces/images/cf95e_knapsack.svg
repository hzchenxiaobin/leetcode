<svg xmlns="http://www.w3.org/2000/svg" width="770" height="420" viewBox="0 0 770 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="233"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="770" height="420" fill="#fafafa"/>

  <text x="385" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按“块大小”分组后做有界背包：dp[s] = 凑出 s 所需的最少块数</text>
  <path d="M 154 39 Q 385 45 616 39" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="30" y="54" width="710" height="54" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="46" y="78" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">连通块大小总和 ≤ n ⇒ 不同的“大小”最多只有 O(√n) 种（1+2+…+t ≤ n）</text>
  <text x="46" y="98" text-anchor="start" font-size="12" fill="#5b5b5b" filter="url(#rough2)">（n = 10⁵ 时 t ≤ 447），于是可以按“大小 v”分组，每组 cnt[v] 个块</text>
  <rect x="30" y="116" width="710" height="66" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="46" y="140" text-anchor="start" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">有界背包：dp2[s] = min_{0 ≤ j ≤ cnt[v], j·v ≤ s} dp[s − j·v] + j</text>
  <text x="46" y="162" text-anchor="start" font-size="12" fill="#7a5a1b" filter="url(#rough2)">按 s mod v 的剩余类分别处理，用单调队列维护 dp[s − j·v] − j 的滑动最小值 ⇒ 每组 O(n)</text>
  <rect x="30" y="190" width="710" height="60" rx="8" fill="#e9f4ec" stroke="#3f6b4a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="46" y="214" text-anchor="start" font-size="12.5" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">总复杂度 O((√n + n/v)·n)? 更准确地说是 O(D·n)，D ≤ 447 ⇒ 约 4.5×10⁷ 次操作</text>
  <text x="46" y="236" text-anchor="start" font-size="12" fill="#2f4a66" filter="url(#rough2)">如果对每个块做 0/1 背包会是 10¹⁰；如果按块数拆分（二进制拆分）也要 7.6×10⁸。</text>
  <text x="46" y="278" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">样例 1：4 个点分成大小 3 与 1 两块 → 3+1=4 是幸运数，修 1 条路 → 输出 1</text>
  <text x="46" y="300" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">样例 2：大小 2 与 3 两块 → 只能凑出 2、3、5，凑不出 4 → 输出 −1</text>
  <rect x="30" y="318" width="710" height="60" rx="8" fill="#f7ecec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="46" y="342" text-anchor="start" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">易错：① 自环与重边不影响连通性；② 只有“块大小”有意义，块内结构无影响；</text>
  <text x="46" y="364" text-anchor="start" font-size="12" fill="#8a3b37" filter="url(#rough2)">③ 幸运数判断是对“大小”的十进制表示，别漏了 4 与 7 本身；④ dp 要允许“一个块都不用”。</text>
</svg>
