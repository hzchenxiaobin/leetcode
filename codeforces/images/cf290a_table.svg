<svg xmlns="http://www.w3.org/2000/svg" width="700" height="250" viewBox="0 0 700 250"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="453"/>
    <feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></defs>
  <rect width="700" height="250" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">愚人节题的通行做法</text>
  <path d="M 190 40 Q 350 46 510 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="60" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="12.5" fill="#22314a" filter="url(#rough2)">① 从样例反推"输入 → 输出"的规律（本例是常识序列：总统名单）。</text>
  <text x="76" y="104" font-size="12.5" fill="#22314a" filter="url(#rough2)">② 若规律只能覆盖样例、无法自证，就报 blocked，不要猜。</text>
  <g filter="url(#rough2)"><rect x="60" y="130" width="580" height="60" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="154" font-size="12.5" fill="#2f5223" filter="url(#rough2)">本例可自证：样例三点定出"总统序"，且范围 1..40 与"第 40 任 = Reagan"完全吻合。</text>
  <text x="76" y="176" font-size="12.5" fill="#2f5223" filter="url(#rough2)">实现：40 个常量字符串 + 查表，O(1)。</text>
  <g filter="url(#rough2)"><rect x="60" y="202" width="580" height="36" rx="8" fill="#fbeeee" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="76" y="225" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">易错：拼写（Van Buren 有空格；Cleveland / Roosevelt / Adams 各出现两次）。</text>
</svg>
