<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>

  <rect width="760" height="520" fill="#fafafa"/>

  <text x="380" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：答案完全由「n+1 是否质数」决定</text>
  <path d="M 120 44 Q 380 51 640 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 表头 -->
  <rect x="30" y="62" width="700" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="72" y="89" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">n</text>
  <text x="170" y="89" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">n+1（候选王）</text>
  <text x="262" y="89" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">质数？</text>
  <text x="342" y="89" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">答案</text>
  <text x="404" y="89" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">判定理由（官方 5 组 + 3 组补测 ★）</text>

  <!-- 行 1：n=2 -->
  <rect x="30" y="106" width="700" height="44" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="72" y="133" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="170" y="133" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="262" y="133" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">质数</text>
  <text x="342" y="133" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">YES</text>
  <text x="404" y="133" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">唯一对手是 2，3 &gt; 2 且互不整除，3 赢</text>

  <!-- 行 2：n=3 -->
  <rect x="30" y="150" width="700" height="44" fill="#f3f6f9" stroke="#c9d3dc" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="72" y="177" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="170" y="177" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="262" y="177" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">合数</text>
  <text x="342" y="177" text-anchor="middle" font-size="13" font-weight="bold" fill="#a14340" filter="url(#rough2)">NO</text>
  <text x="404" y="177" font-size="11.5" fill="#a14340" filter="url(#rough2)">4 = 2·2，牌 2 整除 4，小牌 2 赢</text>

  <!-- 行 3：n=4 -->
  <rect x="30" y="194" width="700" height="44" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="72" y="221" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="170" y="221" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <text x="262" y="221" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">质数</text>
  <text x="342" y="221" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">YES</text>
  <text x="404" y="221" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">5 对 2、3、4 都无整除关系，大的赢</text>

  <!-- 行 4：n=5 -->
  <rect x="30" y="238" width="700" height="44" fill="#f3f6f9" stroke="#c9d3dc" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="72" y="265" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <text x="170" y="265" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">6</text>
  <text x="262" y="265" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">合数</text>
  <text x="342" y="265" text-anchor="middle" font-size="13" font-weight="bold" fill="#a14340" filter="url(#rough2)">NO</text>
  <text x="404" y="265" font-size="11.5" fill="#a14340" filter="url(#rough2)">6 = 2·3，牌 2 整除 6，6 被 2 击败（样例）</text>

  <!-- 行 5：n=8 -->
  <rect x="30" y="282" width="700" height="44" fill="#f3f6f9" stroke="#c9d3dc" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="72" y="309" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">8</text>
  <text x="170" y="309" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">9</text>
  <text x="262" y="309" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">合数</text>
  <text x="342" y="309" text-anchor="middle" font-size="13" font-weight="bold" fill="#a14340" filter="url(#rough2)">NO</text>
  <text x="404" y="309" font-size="11.5" fill="#a14340" filter="url(#rough2)">9 = 3·3，牌 3 整除 9，9 被 3 击败（样例）</text>

  <!-- 行 6：n=6 补测 -->
  <rect x="30" y="326" width="700" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="72" y="353" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">6 ★</text>
  <text x="170" y="353" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">7</text>
  <text x="262" y="353" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">质数</text>
  <text x="342" y="353" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">YES</text>
  <text x="404" y="353" font-size="11.5" fill="#8a6015" filter="url(#rough2)">补测：7 无真因子，对 2…6 全部获胜</text>

  <!-- 行 7：n=10 补测 -->
  <rect x="30" y="370" width="700" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="72" y="397" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">10 ★</text>
  <text x="170" y="397" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">11</text>
  <text x="262" y="397" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">质数</text>
  <text x="342" y="397" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">YES</text>
  <text x="404" y="397" font-size="11.5" fill="#8a6015" filter="url(#rough2)">补测：11 是质数 → 11 全胜</text>

  <!-- 行 8：n=200000 边界 -->
  <rect x="30" y="414" width="700" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="72" y="441" text-anchor="middle" font-size="13" fill="#a14340" filter="url(#rough2)">200000 ★</text>
  <text x="170" y="441" text-anchor="middle" font-size="13" fill="#a14340" filter="url(#rough2)">200001</text>
  <text x="262" y="441" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">合数</text>
  <text x="342" y="441" text-anchor="middle" font-size="13" font-weight="bold" fill="#a14340" filter="url(#rough2)">NO</text>
  <text x="404" y="441" font-size="11.5" fill="#a14340" filter="url(#rough2)">上限：200001 = 3·163·409，牌 3 即可击败它</text>

  <!-- 竖分隔线 -->
  <path d="M 118 62 L 118 458" stroke="#9fb0c0" stroke-width="1.1" fill="none" filter="url(#rough2)"/>
  <path d="M 212 62 L 212 458" stroke="#9fb0c0" stroke-width="1.1" fill="none" filter="url(#rough2)"/>
  <path d="M 300 62 L 300 458" stroke="#9fb0c0" stroke-width="1.1" fill="none" filter="url(#rough2)"/>
  <path d="M 384 62 L 384 458" stroke="#9fb0c0" stroke-width="1.1" fill="none" filter="url(#rough2)"/>

  <text x="380" y="486" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">★ 为自造用例；绿色 = YES（n+1 为质数），红色 = NO（n+1 是合数）</text>
  <text x="380" y="506" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">前 5 行即官方样例，输出 YES/NO/YES/NO/NO 与官方完全一致</text>
</svg>
