<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="780" height="400" fill="#fafafa"/>
  <text x="390.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">把每个 trench 当成一个点：距离 ≤ a 就能在下一个充能期内赶到</text>
  <path d="M 107.39500000000021 46 Q 390.0 52 672.6049999999998 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <circle cx="70.0" cy="90.0" r="26.0" fill="#fff3d6" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="70.0" y="95.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">A</text>
  <circle cx="230.0" cy="60.0" r="26.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="230.0" y="65.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">T1</text>
  <circle cx="230.0" cy="170.0" r="26.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="230.0" y="175.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">T2</text>
  <circle cx="430.0" cy="120.0" r="26.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="430.0" y="125.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">T3</text>
  <circle cx="620.0" cy="200.0" r="26.0" fill="#fff3d6" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="620.0" y="205.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">B</text>
  <path d="M 70.0 90.0 L 230.0 60.0" stroke="#446688" stroke-width="1.2" fill="none" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <path d="M 70.0 90.0 L 230.0 170.0" stroke="#446688" stroke-width="1.2" fill="none" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <path d="M 230.0 60.0 L 230.0 170.0" stroke="#446688" stroke-width="1.2" fill="none" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <path d="M 230.0 60.0 L 430.0 120.0" stroke="#446688" stroke-width="1.2" fill="none" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <path d="M 230.0 170.0 L 430.0 120.0" stroke="#446688" stroke-width="1.2" fill="none" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <path d="M 430.0 120.0 L 620.0 200.0" stroke="#446688" stroke-width="1.2" fill="none" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="120.0" y="60.0" text-anchor="middle" font-size="10.2" fill="#446688" filter="url(#rough2)">dist ≤ a</text>
  <text x="300.0" y="300.0" text-anchor="start" font-size="11.4" font-weight="bold" fill="#446688" filter="url(#rough2)">BFS 求最少「躲过几次射击」d[i]</text>
  <rect x="60.0" y="320.0" width="660.0" height="66.0" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="344.0" text-anchor="start" font-size="11.2" fill="#8a6015" filter="url(#rough2)">答案 = min（ 直接走：dist(A,B) ≤ a 时就是 dist(A,B)；</text>
  <text x="74.0" y="366.0" text-anchor="start" font-size="11.2" fill="#8a6015" filter="url(#rough2)">        躲过 d[i] 次：d[i]·(a+b) + dist(trench_i, B)，要求 dist(trench_i,B) ≤ a ）</text>
</svg>
