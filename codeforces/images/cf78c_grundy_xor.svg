<svg xmlns="http://www.w3.org/2000/svg" width="720" height="390" viewBox="0 0 720 390"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>

  <rect width="720" height="390" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">n 根同样的木头：偶数必败，奇数看单根能否切</text>
  <path d="M 120 44 Q 360 50 600 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 左：n 偶 -->
  <rect x="36" y="62" width="316" height="240" rx="10" fill="#fbeeee" stroke="#a05a5a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="194" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#6b3030" filter="url(#rough2)">n = 2（偶数）</text>
  <rect x="70" y="104" width="248" height="30" rx="5" fill="#f3dede" stroke="#a05a5a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="194" y="125" text-anchor="middle" font-size="12.5" fill="#6b3030" filter="url(#rough2)">木头 1：g(m)</text>
  <rect x="70" y="146" width="248" height="30" rx="5" fill="#f3dede" stroke="#a05a5a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="194" y="167" text-anchor="middle" font-size="12.5" fill="#6b3030" filter="url(#rough2)">木头 2：g(m)</text>
  <text x="194" y="208" text-anchor="middle" font-size="14" fill="#6b3030" filter="url(#rough2)">异或 = g(m) ⊕ g(m) = 0</text>
  <text x="194" y="238" text-anchor="middle" font-size="15" font-weight="bold" fill="#8c2f2c" filter="url(#rough2)">先手必败 → Marsel</text>
  <text x="194" y="268" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">与 m、k 完全无关</text>

  <!-- 右：n 奇 -->
  <rect x="368" y="62" width="316" height="240" rx="10" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="526" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5223" filter="url(#rough2)">n = 3（奇数）</text>
  <rect x="402" y="100" width="248" height="26" rx="5" fill="#e6f0dd" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="526" y="119" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">木头 1：g(m)</text>
  <rect x="402" y="132" width="248" height="26" rx="5" fill="#e6f0dd" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="526" y="151" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">木头 2：g(m)</text>
  <rect x="402" y="164" width="248" height="26" rx="5" fill="#e6f0dd" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="526" y="183" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">木头 3：g(m)</text>
  <text x="526" y="216" text-anchor="middle" font-size="14" fill="#2f5223" filter="url(#rough2)">异或 = g(m) ≠ 0</text>
  <text x="526" y="244" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5223" filter="url(#rough2)">先手胜 → Timur</text>
  <text x="526" y="272" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">前提：g(m) ≠ 0，即 m 可切</text>

  <rect x="36" y="318" width="648" height="56" rx="9" fill="#f4f4f0" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="341" text-anchor="middle" font-size="12.5" fill="#333333" filter="url(#rough2)">g(m) ≠ 0 ⟺ m 至少能切一次 ⟺ 存在 m 的真因子 ≥ k ⟺ m / p ≥ k（p 为 m 的最小质因子）</text>
  <text x="360" y="363" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">于是只需试除到 √m 求最小质因子，O(√m) 判定</text>
</svg>
