<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="350" fill="#fafafa"/>
  <text x="360.0" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">205B：样例三的逐步走查（共 6 步）</text>
  <path d="M 144.00 46 Q 360.0 52 576.00 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="72" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">样例三 [7,4,1,47]：每一步都把当前下降点右侧的整段抬高 1。</text>
  <rect x="60" y="100" width="620" height="30" rx="5" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="120" text-anchor="start" font-size="10.5" fill="#33506e" filter="url(#rough2)">[7, 4, 1, 47]</text>
  <text x="260" y="120" text-anchor="start" font-size="10" fill="#8a3a52" filter="url(#rough2)">初始：下降 7&gt;4、4&gt;1</text>
  <text x="480" y="120" text-anchor="start" font-size="10" fill="#2f5b34" filter="url(#rough2)">+1 到 [2..4]</text>
  <rect x="60" y="134" width="620" height="30" rx="5" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="154" text-anchor="start" font-size="10.5" fill="#33506e" filter="url(#rough2)">[7, 5, 2, 48]</text>
  <text x="260" y="154" text-anchor="start" font-size="10" fill="#8a3a52" filter="url(#rough2)">仍在 7&gt;5、5&gt;2</text>
  <text x="480" y="154" text-anchor="start" font-size="10" fill="#2f5b34" filter="url(#rough2)">+1 到 [2..4]</text>
  <rect x="60" y="168" width="620" height="30" rx="5" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="188" text-anchor="start" font-size="10.5" fill="#33506e" filter="url(#rough2)">[7, 6, 3, 49]</text>
  <text x="260" y="188" text-anchor="start" font-size="10" fill="#8a3a52" filter="url(#rough2)">仍在下降</text>
  <text x="480" y="188" text-anchor="start" font-size="10" fill="#2f5b34" filter="url(#rough2)">+1 到 [2..4]</text>
  <rect x="60" y="202" width="620" height="30" rx="5" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="222" text-anchor="start" font-size="10.5" fill="#33506e" filter="url(#rough2)">[7, 7, 4, 50]</text>
  <text x="260" y="222" text-anchor="start" font-size="10" fill="#8a3a52" filter="url(#rough2)">4&gt;1 已变成 7&gt;4 / 4&gt;1？</text>
  <text x="480" y="222" text-anchor="start" font-size="10" fill="#2f5b34" filter="url(#rough2)">改 +1 到 [3..4]</text>
  <rect x="60" y="236" width="620" height="30" rx="5" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="256" text-anchor="start" font-size="10.5" fill="#33506e" filter="url(#rough2)">[7, 7, 5, 51]</text>
  <text x="260" y="256" text-anchor="start" font-size="10" fill="#8a3a52" filter="url(#rough2)"></text>
  <text x="480" y="256" text-anchor="start" font-size="10" fill="#2f5b34" filter="url(#rough2)">+1 到 [3..4]</text>
  <rect x="60" y="270" width="620" height="30" rx="5" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="290" text-anchor="start" font-size="10.5" fill="#33506e" filter="url(#rough2)">[7, 7, 6, 52]</text>
  <text x="260" y="290" text-anchor="start" font-size="10" fill="#8a3a52" filter="url(#rough2)"></text>
  <text x="480" y="290" text-anchor="start" font-size="10" fill="#2f5b34" filter="url(#rough2)">+1 到 [3..4]</text>
  <rect x="60" y="304" width="620" height="30" rx="5" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="324" text-anchor="start" font-size="10.5" fill="#33506e" filter="url(#rough2)">[7, 7, 7, 53]</text>
  <text x="260" y="324" text-anchor="start" font-size="10" fill="#8a3a52" filter="url(#rough2)">非递减 ✓</text>
  <text x="480" y="324" text-anchor="start" font-size="10" fill="#2f5b34" filter="url(#rough2)">共 6 步</text>
</svg>
