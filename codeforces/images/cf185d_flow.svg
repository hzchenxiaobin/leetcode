<svg xmlns="http://www.w3.org/2000/svg" width="780" height="330" viewBox="0 0 780 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="780" height="330" fill="#fafafa"/>
  <text x="390.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">单次询问的处理流程</text>
  <path d="M 293.97 46 Q 390.0 52 486.03 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="110.0" y="46.0" width="560.0" height="38.0" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="130.0" y="71.0" text-anchor="start" font-size="11.2" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">读 k,l,r,p</text>
  <path d="M 390.0 85.0 L 390.0 93.0" stroke="#446688" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="110.0" y="94.0" width="560.0" height="38.0" rx="8" fill="#fff3d6" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="130.0" y="119.0" text-anchor="start" font-size="11.2" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">p = 2? → 按 k 的奇偶答 0/1</text>
  <path d="M 390.0 133.0 L 390.0 141.0" stroke="#446688" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="110.0" y="142.0" width="560.0" height="38.0" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="130.0" y="167.0" text-anchor="start" font-size="11.2" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">x = k^{2^l} mod p</text>
  <path d="M 390.0 181.0 L 390.0 189.0" stroke="#446688" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="110.0" y="190.0" width="560.0" height="38.0" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="130.0" y="215.0" text-anchor="start" font-size="11.2" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">x≡0 ? → 1；x≡1 ? → m；否则等比公式</text>
  <path d="M 390.0 229.0 L 390.0 237.0" stroke="#446688" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="110.0" y="238.0" width="560.0" height="38.0" rx="8" fill="#fff3d6" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="130.0" y="263.0" text-anchor="start" font-size="11.2" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">k 奇？除以 2^d</text>
  <path d="M 390.0 277.0 L 390.0 285.0" stroke="#446688" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="110.0" y="286.0" width="560.0" height="38.0" rx="8" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="130.0" y="311.0" text-anchor="start" font-size="11.2" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">输出</text>
  <text x="60.0" y="322.0" text-anchor="start" font-size="11.0" fill="#6b6b6b" filter="url(#rough2)">每次询问 O(log p)，t ≤ 10⁵ 也能过。</text>
</svg>
