<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="103"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ka" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="340" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">dp[j]：总容量至少 j 时的最小花费（超过 n 截断到 n）</text>

  <!-- 状态格子 -->
  <g filter="url(#rough2)">
    <rect x="80" y="80" width="80" height="46" rx="7" fill="#eef4ec" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="120" y="100" text-anchor="middle" font-size="11" fill="#2f5223">j = 0</text>
    <text x="120" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223">0</text>

    <rect x="180" y="80" width="80" height="46" rx="7" fill="#f4f6f9" stroke="#8a94a6" stroke-width="1.4"/>
    <text x="220" y="100" text-anchor="middle" font-size="11" fill="#555">j = 1</text>
    <text x="220" y="118" text-anchor="middle" font-size="12" fill="#555">20</text>

    <rect x="280" y="80" width="80" height="46" rx="7" fill="#f4f6f9" stroke="#8a94a6" stroke-width="1.4"/>
    <text x="320" y="100" text-anchor="middle" font-size="11" fill="#555">j = 2</text>
    <text x="320" y="118" text-anchor="middle" font-size="12" fill="#555">5</text>

    <rect x="380" y="80" width="80" height="46" rx="7" fill="#f4f6f9" stroke="#8a94a6" stroke-width="1.4"/>
    <text x="420" y="100" text-anchor="middle" font-size="11" fill="#555">j = 3</text>
    <text x="420" y="118" text-anchor="middle" font-size="12" fill="#555">10</text>

    <rect x="480" y="80" width="80" height="46" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="520" y="100" text-anchor="middle" font-size="11" fill="#8a6015">j = 4 = n</text>
    <text x="520" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6015">8</text>
  </g>

  <!-- 转移箭头 -->
  <path d="M200,140 Q160,176 130,140" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#ka)" filter="url(#rough2)"/>
  <text x="160" y="196" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">容量 1 的商品：j → j+1</text>

  <path d="M300,140 Q250,186 200,140" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#ka)" filter="url(#rough2)"/>
  <text x="262" y="216" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">容量 2：j → j+2</text>

  <path d="M500,140 Q440,196 380,140" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#ka)" filter="url(#rough2)"/>
  <text x="450" y="228" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">容量 3：可能直接冲到 n（截断）</text>

  <rect x="70" y="252" width="590" height="72" rx="10" fill="#eef4ec" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <g font-size="12.5" fill="#2f5223" filter="url(#rough2)">
    <text x="86" y="276">· 每件商品容量 w = t_i + 1，花费 c_i；倒序枚举 j 保证每件只用一次。</text>
    <text x="86" y="300">· 转移 dp[min(n, j+w)] = min(dp[...], dp[j] + c)；答案 dp[n]。</text>
  </g>
</svg>
