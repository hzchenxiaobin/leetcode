<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">k = 1：固定刀具参数 x，目标长度 y = x</text>
  <text x="280" y="56" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">单根长度 l 的胡萝卜最终能贡献几根长度 x 的碎块</text>

  <rect x="30" y="74" width="500" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="110" y="96" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">情形</text>
  <text x="290" y="96" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">切开后的碎块</text>
  <text x="480" y="96" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">贡献</text>

  <rect x="30" y="116" width="500" height="46" fill="#ffffff" stroke="#dddddd" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="110" y="145" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">l &lt; x</text>
  <text x="290" y="145" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">太短，切不动 → 仍是 l</text>
  <text x="480" y="145" text-anchor="middle" font-size="15" font-weight="bold" fill="#999999" filter="url(#rough2)">0</text>

  <rect x="30" y="168" width="500" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="110" y="197" text-anchor="middle" font-size="13" fill="#2f5424" filter="url(#rough2)">l = x</text>
  <text x="290" y="197" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">l ≤ x 不受影响，自己就是一根 x</text>
  <text x="480" y="197" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <rect x="30" y="220" width="500" height="46" fill="#ffffff" stroke="#dddddd" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="110" y="249" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">x &lt; l &lt; 2x</text>
  <text x="290" y="249" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">x 与 l − x，后者不足 x</text>
  <text x="480" y="249" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>

  <rect x="30" y="272" width="500" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="110" y="301" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">l = 2x</text>
  <text x="290" y="301" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">x 与 x —— 一刀直接出两根</text>
  <text x="480" y="301" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#rough2)">2</text>

  <rect x="30" y="324" width="500" height="46" fill="#ffffff" stroke="#dddddd" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="110" y="353" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">l &gt; 2x</text>
  <text x="290" y="353" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">x 与 l − x，后者仍大于 x</text>
  <text x="480" y="353" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>

  <rect x="96" y="384" width="368" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="406" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">总数 = #{a_i ≥ x} + #{a_i = 2x}</text>
</svg>
