<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2f7a3a"/>
    </marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="420" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">盈余方每送出 1 单位，缺口方只到账 (100-k)/100 单位</text>
  <path d="M 150 40 Q 360 46 570 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 电池柱状图 -->
  <line x1="60" y1="300" x2="380" y2="300" stroke="#2b2b2b" stroke-width="1.6" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="86" y="100" width="56" height="200" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="106" y="200" width="56" height="100" fill="#e6f4ea" stroke="#2f7a3a" stroke-width="1.6"/>
    <rect x="266" y="250" width="56" height="50" fill="#fdecea" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="114" y="322" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="222" y="322" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="294" y="322" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="180" y="340" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">a = (4, 2, 1)，目标 x = 2</text>

  <!-- 目标线 -->
  <line x1="60" y1="200" x2="380" y2="200" stroke="#8a6015" stroke-width="1.5" stroke-dasharray="6 5" filter="url(#rough2)"/>
  <text x="386" y="196" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">x = 2</text>

  <!-- 标注盈余/缺口 -->
  <text x="152" y="150" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">盈余 S = 2</text>
  <text x="330" y="272" font-size="12" font-weight="bold" fill="#8c2f2b" filter="url(#rough2)">缺口 D = 1</text>

  <!-- 转移箭头 -->
  <path d="M 170 128 Q 250 90 282 248" stroke="#2f7a3a" stroke-width="1.8" fill="none" marker-end="url(#ag)" filter="url(#rough2)"/>
  <text x="240" y="76" font-size="11.5" fill="#2f7a3a" filter="url(#rough2)">送出 2，到账 1（k = 50）</text>

  <!-- 右侧判定框 -->
  <rect x="410" y="70" width="286" height="112" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="426" y="98" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">可达判据（固定 x）</text>
  <text x="426" y="126" font-size="15" font-weight="bold" fill="#8c2f2b" filter="url(#rough2)">(100-k)·S(x) ≥ 100·D(x)</text>
  <text x="426" y="150" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">左：盈余方能送到的总量</text>
  <text x="426" y="170" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">右：缺口方总共要补的量</text>

  <!-- 样例计算 -->
  <rect x="410" y="200" width="286" height="86" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="426" y="226" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">样例一 x = 2：</text>
  <text x="426" y="250" font-size="12" fill="#7a5a1b" filter="url(#rough2)">50 · 2 = 100 ≥ 100 · 1 = 100</text>
  <text x="426" y="272" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">恰在等号上 ⇒ x = 2 就是最大解</text>

  <!-- 底部公式 -->
  <rect x="60" y="356" width="636" height="50" rx="10" fill="#f3e8fd" stroke="#7b4fa8" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="378" font-size="12.5" font-weight="bold" fill="#4b2a70" filter="url(#rough2)">S、D 都是 x 的分段线性函数：S 单调不增、D 单调不减 ⇒ 判据关于 x 单调</text>
  <text x="76" y="398" font-size="11.5" fill="#4b2a70" filter="url(#rough2)">于是可行集合是一个区间 [0, x*]，x* 为等号成立处，二分即可逼近</text>
</svg>
