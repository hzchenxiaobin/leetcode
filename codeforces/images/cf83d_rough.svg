  <text x="440" y="190" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">以 k = 3（&lt; k 的素数只有 2）为例：偶数全部划掉，剩下的 m 的素因子都 ≥ 3</text>
  <text x="440" y="218" text-anchor="middle" font-size="12" fill="#3d6b2f" filter="url(#rough2)">x = 3m：如 m = 5 → x = 15（最小素因子 3）；m = 4 被划掉 → x = 12 的最小素因子是 2</text>
  <g filter="url(#rough2)"><rect x="150" y="242" width="580" height="52" rx="4" fill="#ffffff" fill-opacity="0.0" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="5 4"/></g>
  <text x="440" y="264" text-anchor="middle" font-size="12" fill="#8a2b28" filter="url(#rough2)">容斥写法：count(N) = N − Σ_p count(N/p)，p 取遍小于 k 的素数</text>
  <text x="440" y="284" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">只需对乘积 ≤ N 的子集递归，节点数与 squarefree 乘积个数同阶（实测最坏约 2.6·10⁵）</text>
</svg>
