<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr67i" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#7a4a8a"/>
    </marker>
  </defs>

  <rect width="720" height="360" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按入口洞号排好后，出口洞号序列的递减子序列</text>
  <path d="M 120 40 Q 360 46 600 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 入口轴 -->
  <text x="40" y="86" font-size="12" fill="#2f4a66" filter="url(#rough2)">入口洞号</text>
  <g filter="url(#rough2)">
    <rect x="130" y="66" width="80" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="230" y="66" width="80" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="330" y="66" width="80" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="430" y="66" width="80" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="530" y="66" width="80" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#2f4a66" filter="url(#rough2)">
    <text x="170" y="88">1</text>
    <text x="270" y="88">2</text>
    <text x="370" y="88">3</text>
    <text x="470" y="88">4</text>
    <text x="570" y="88">5</text>
  </g>

  <!-- 光线 -->
  <text x="40" y="128" font-size="12" fill="#7a4a8a" filter="url(#rough2)">光线编号</text>
  <g font-size="13" text-anchor="middle" fill="#5a3a6a" filter="url(#rough2)">
    <text x="170" y="128">1</text>
    <text x="270" y="128">4</text>
    <text x="370" y="128">5</text>
    <text x="470" y="128">2</text>
    <text x="570" y="128">3</text>
  </g>
  <path d="M 150 96 L 150 116" stroke="#7a4a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 250 96 L 250 116" stroke="#7a4a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 350 96 L 350 116" stroke="#7a4a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 450 96 L 450 116" stroke="#7a4a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 550 96 L 550 116" stroke="#7a4a8a" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 出口序列 -->
  <text x="40" y="182" font-size="12" fill="#2f5223" filter="url(#rough2)">出口洞号 s</text>
  <g filter="url(#rough2)">
    <rect x="130" y="156" width="80" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="230" y="156" width="80" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="330" y="156" width="80" height="44" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.3"/>
    <rect x="430" y="156" width="80" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="530" y="156" width="80" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <g font-size="15" font-weight="bold" text-anchor="middle" fill="#2f5223" filter="url(#rough2)">
    <text x="170" y="184">4</text>
    <text x="270" y="184">2</text>
    <text x="370" y="184" fill="#999">5</text>
    <text x="470" y="184">3</text>
    <text x="570" y="184">1</text>
  </g>

  <!-- 递减箭头：4 -> 2 -> 1 -->
  <path d="M 180 208 Q 225 244 262 208" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr67i)" filter="url(#rough2)"/>
  <path d="M 280 208 Q 420 258 562 208" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr67i)" filter="url(#rough2)"/>
  <text x="370" y="256" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">绿色格 = 选中的递减子序列 4 &gt; 2 &gt; 1（长度 3）</text>
  <text x="370" y="278" text-anchor="middle" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">另一组同样长的是 5 &gt; 3 &gt; 1；灰色格 5 不在第一组里</text>

  <rect x="130" y="292" width="480" height="54" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="146" y="314" font-size="12" font-weight="bold" fill="#7a5a1b" filter="url(#rough2)">对应的光线集合：{1, 4, 3}（入口 1,2,5 / 出口 4,2,1）</text>
  <text x="146" y="334" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">它们两两相交；题面 hint 给出的正是这一组，答案是 3</text>
</svg>
