<svg xmlns="http://www.w3.org/2000/svg" width="860" height="372" viewBox="0 0 860 372"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="85"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="860" height="372" fill="#fafafa"/>
  <text x="430" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">答案对 D 单调，二分即可</text>
  <text x="430" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">P(D)：距离 > D 的冲突图是二分图（等价于能分成两支各直径 ≤ D 的军队）</text>
  <g filter="url(#rough2)"><line x1="110" y1="240" x2="750" y2="240" stroke="#888888" stroke-width="1.4" marker-end="url(#arrg)"/></g>
  <g filter="url(#rough2)"><line x1="110" y1="240" x2="110" y2="130" stroke="#888888" stroke-width="1.4" marker-end="url(#arrg)"/></g>
  <text x="750" y="262" text-anchor="end" font-size="12" fill="#777777" filter="url(#rough2)">D</text>
  <text x="100" y="124" text-anchor="end" font-size="12" fill="#777777" filter="url(#rough2)">P(D)</text>
  <g filter="url(#rough2)"><rect x="110" y="238" width="268.8" height="6" rx="4" fill="#f6d9d7" fill-opacity="0.6" stroke="none" stroke-width="0"/></g>
  <g filter="url(#rough2)"><rect x="378.8" y="130" width="371.20000000000005" height="110" rx="4" fill="#d7ecd0" fill-opacity="0.35" stroke="none" stroke-width="0"/></g>
  <g filter="url(#rough2)"><path d="M 110.0 236.0 L 378.8 236.0 L 378.8 134.0 L 750.0 134.0" fill="none" stroke="#2f4a66" stroke-width="2.4"/></g>
  <g filter="url(#rough2)"><line x1="378.8" y1="240" x2="378.8" y2="130" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4"/></g>
  <text x="378.8" y="262" text-anchor="middle" font-size="12" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">D*</text>
  <text x="244.4" y="220" text-anchor="middle" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">不可行</text>
  <text x="538.8" y="116" text-anchor="middle" font-size="11.5" fill="#3d6b2f" filter="url(#rough2)">可行（可二分）</text>
  <text x="430" y="300" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">D 只可能取 0..10000（坐标 ≤ 5000）→ 最多 14 次判定</text>
  <text x="430" y="326" text-anchor="middle" font-size="12" fill="#3d6b2f" filter="url(#rough2)">每次判定 = 染色 BFS；在最小 D 上再数一次连通分量 c，输出 D 与 2^c mod 1e9+7</text>
  <text x="430" y="352" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">D 越大冲突边越少，P(D) 单调不减</text>
</svg>
