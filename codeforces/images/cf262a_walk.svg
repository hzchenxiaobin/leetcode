<svg xmlns="http://www.w3.org/2000/svg" width="880" height="280" viewBox="0 0 880 280"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="280" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例走查：447、44、77 与 k=2</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">447 有 3 个幸运数字 → 不要；44、77 各 2 个 → 要</text>
  <text x="140" y="140" text-anchor="start" font-size="16" fill="#2b2b2b" filter="url(#rough2)">447</text>
  <text x="300" y="140" text-anchor="start" font-size="16" fill=" #3d6b2f" filter="url(#rough2)">跳过</text>
  <text x="340" y="140" text-anchor="start" font-size="16" fill="#2b2b2b" filter="url(#rough2)">44</text>
  <text x="500" y="140" text-anchor="start" font-size="16" fill=" #3d6b2f" filter="url(#rough2)">计入</text>
  <text x="540" y="140" text-anchor="start" font-size="16" fill="#2b2b2b" filter="url(#rough2)">77</text>
  <text x="700" y="140" text-anchor="start" font-size="16" fill=" #3d6b2f" filter="url(#rough2)">计入</text>
  <text x="440" y="240" text-anchor="middle" font-size="15" fill="#3d6b2f" filter="url(#rough2)">答案 2</text>
</svg>
