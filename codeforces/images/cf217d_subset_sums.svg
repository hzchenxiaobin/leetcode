  <text x="491.5" y="214" text-anchor="middle" font-size="9" fill="#2b2b2b" filter="url(#rough2)">29</text>
  <text x="180" y="240" text-anchor="start" font-size="11.5" fill="#a0522d" filter="url(#rough2)">S + r（把 S 整体平移 r）</text>
  <g filter="url(#rough2)"><rect x="520" y="100" width="290" height="150" rx="4" fill="#fdf6f4" fill-opacity="0.85" stroke="#d8a89a" stroke-width="1.3"/></g>
  <text x="665" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#a0522d" filter="url(#rough2)">D = S − S（mod m）</text>
  <text x="665" y="152" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">D 记录"哪些差值已经出现"</text>
  <text x="665" y="176" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">r ∈ D ⇒ S 与 S+r 相交</text>
  <text x="665" y="200" text-anchor="middle" font-size="11.5" fill="#3d6b2f" filter="url(#rough2)">r ∉ D ⇒ 可以加入，和集翻倍</text>
  <text x="665" y="226" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">新增：D′ = D ∪ (D+r) ∪ (D−r)</text>
  <text x="420" y="320" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">为什么等价：S ∩ (S+r) ≠ ∅ ⟺ ∃x,y∈S, x = y+r ⟺ r ∈ S − S = D</text>
  <text x="420" y="348" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">加入 r 后 S′ = S ∪ (S+r)，其差集四块：S−S、S−(S+r)=D−r、(S+r)−S=D+r、(S+r)−(S+r)=D</text>
  <text x="420" y="376" text-anchor="middle" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">于是 D′ = D ∪ (D+r) ∪ (D−r)，用 m 位掩码循环移位即可 O(1) 更新</text>
  <text x="420" y="408" text-anchor="middle" font-size="12" fill="#8a4b2a" filter="url(#rough2)">限制：2^{|R|} ≤ m ≤ 120 ⇒ |R| ≤ 6；且同一余数最多留一件</text>
</svg>
