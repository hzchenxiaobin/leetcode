<svg xmlns="http://www.w3.org/2000/svg" width="720" height="302" viewBox="0 0 720 302"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1422"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="720" height="302" fill="#fafafa"/>
  <text x="360.0" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">层内计数 × 层间去重</text>
  <path d="M 115.2 42 Q 360.0 48 604.8 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="24" y="68" width="330" height="92" rx="5" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="189.0" y="104.8" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">f[len][j] = j·f[len−1][j−1]</text>
  <text x="189.0" y="117.8" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">+ (j−1)·f[len−1][j]</text>
  <text x="189.0" y="130.8" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">固定 j 色集合、用满 j 色、相邻异色</text>
  <path d="M 240.0 162.0 L 292.2 191.6" stroke="#335478" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 300.0 196.0 L 290.2 195.0 L 294.1 188.1 Z" fill="#335478" filter="url(#rough2)"/>
  <rect x="380" y="68" width="316" height="92" rx="5" fill="#e8eef7" stroke="#335478" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="538.0" y="111.3" text-anchor="middle" font-size="10.5" fill="#335478" filter="url(#rough2)">D_i[j] = f[l_i][j]·(T_{i−1} − D_{i−1}[j])</text>
  <text x="538.0" y="124.3" text-anchor="middle" font-size="10.5" fill="#335478" filter="url(#rough2)">收尾层恰好用某个固定 j 色集合</text>
  <path d="M 470.0 162.0 L 427.4 190.9" stroke="#8c5a2c" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 420.0 196.0 L 425.2 187.6 L 429.7 194.2 Z" fill="#8c5a2c" filter="url(#rough2)"/>
  <rect x="220" y="198" width="380" height="62" rx="5" fill="#f7efe8" stroke="#8c5a2c" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="410.0" y="233.3" text-anchor="middle" font-size="12.0" fill="#8c5a2c" filter="url(#rough2)">T_i = Σ_j C(m,j) · D_i[j]</text>
  <text x="360.0" y="284.0" text-anchor="middle" font-size="11.5" fill="#8c2f2c" filter="url(#rough2)">C(m,j) mod p 用素因子指数维护，p 不需要是素数</text>
  <text x="360.0" y="288" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">D 只依赖集合大小 j，所以状态是 O(5000) 的</text>
</svg>
