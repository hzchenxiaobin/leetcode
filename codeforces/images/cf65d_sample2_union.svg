<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="93"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>

  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例二：赫敏本人的去向，是"每种终局的最少学院"之并</text>
  <path d="M 66 44 Q 360 51 654 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 起点 -->
  <rect x="26" y="72" width="126" height="50" rx="8" fill="#eaf3ff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="89" y="94" text-anchor="middle" font-size="12" fill="#2f4a63" filter="url(#rough2)">学生 'H'</text>
  <text x="89" y="112" text-anchor="middle" font-size="11.5" fill="#5a7285" filter="url(#rough2)">(0,1,0,0)</text>

  <line x1="156" y1="97" x2="196" y2="97" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="176" y="88" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">'?'</text>

  <!-- 三种终局 -->
  <rect x="200" y="66" width="150" height="62" rx="8" fill="#fff7e2" stroke="#c99a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="275" y="88" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">给 G：(1,1,0,0)</text>
  <text x="275" y="110" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">最少的是 R、S</text>

  <rect x="200" y="140" width="150" height="62" rx="8" fill="#fff7e2" stroke="#c99a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="275" y="162" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">给 R：(0,1,1,0)</text>
  <text x="275" y="184" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">最少的是 G、S</text>

  <rect x="200" y="214" width="150" height="62" rx="8" fill="#fff7e2" stroke="#c99a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="275" y="236" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">给 S：(0,1,0,1)</text>
  <text x="275" y="258" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">最少的是 G、R</text>

  <!-- 右侧：赫敏的选择 -->
  <line x1="354" y1="97" x2="404" y2="120" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <line x1="354" y1="171" x2="404" y2="171" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <line x1="354" y1="245" x2="404" y2="222" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <rect x="408" y="96" width="286" height="170" rx="10" fill="#eef6ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="551" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">赫敏可以去的学院（并集）</text>
  <text x="551" y="150" text-anchor="middle" font-size="13" fill="#2f5223" filter="url(#rough2)">Gryffindor（G）</text>
  <text x="551" y="176" text-anchor="middle" font-size="13" fill="#2f5223" filter="url(#rough2)">Ravenclaw（R）</text>
  <text x="551" y="202" text-anchor="middle" font-size="13" fill="#2f5223" filter="url(#rough2)">Slytherin（S）</text>
  <text x="551" y="234" text-anchor="middle" font-size="12" fill="#8a3b37" filter="url(#rough2)">Hufflepuff 永远不是最少，去不了</text>
  <text x="551" y="254" text-anchor="middle" font-size="11.5" fill="#8a3b37" filter="url(#rough2)">它已经有 1 个人，是最多的那一档</text>

  <!-- 说明 -->
  <rect x="26" y="300" width="668" height="72" rx="10" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="360" y="324" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">注意：三种终局里没有任何一种让赫敏在 {G, H, R, S} 四个学院里自由挑，</text>
  <text x="360" y="346" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">但"她可能去 G"和"她可能去 R"分别由不同的终局实现，所以并集才是答案。</text>
  <text x="360" y="366" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">这也是题面 hint 强调的重点：不能只看某一条分支。</text>
</svg>
