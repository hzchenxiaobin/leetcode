<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="155"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L10,4.5 L0,9 z" fill="#2f5223"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>
  <text x="360.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 3：4 对，其中 1 对男女搭配</text>
  <path d="M 115.2 42 Q 360.0 48 604.8 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="360.0" y="386" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">f = (2,3,5,3,6,5,8,7)，粗线 = 配成一对</text>
  <line x1="150.0" y1="300.0" x2="260.0" y2="300.0" stroke="#2f5223" stroke-width="5" stroke-linecap="round" opacity="0.55" filter="url(#rough2)"/>
  <line x1="330.0" y1="200.0" x2="200.0" y2="120.0" stroke="#2f5223" stroke-width="5" stroke-linecap="round" opacity="0.55" filter="url(#rough2)"/>
  <line x1="470.0" y1="120.0" x2="470.0" y2="250.0" stroke="#2f5223" stroke-width="5" stroke-linecap="round" opacity="0.55" filter="url(#rough2)"/>
  <line x1="600.0" y1="300.0" x2="600.0" y2="160.0" stroke="#2f5223" stroke-width="5" stroke-linecap="round" opacity="0.55" filter="url(#rough2)"/>
  <circle cx="150" cy="300" r="21" fill="#fbeadb" stroke="#d98c3f" stroke-width="3.2" filter="url(#rough2)"/>
  <text x="150" y="305" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a5d1c" filter="url(#rough2)">1</text>
  <circle cx="260" cy="300" r="21" fill="#fbeadb" stroke="#d98c3f" stroke-width="3.2" filter="url(#rough2)"/>
  <text x="260" y="305" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a5d1c" filter="url(#rough2)">2</text>
  <circle cx="330" cy="200" r="21" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="3.2" filter="url(#rough2)"/>
  <text x="330" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#335478" filter="url(#rough2)">3</text>
  <circle cx="200" cy="120" r="21" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="3.2" filter="url(#rough2)"/>
  <text x="200" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#335478" filter="url(#rough2)">4</text>
  <circle cx="470" cy="120" r="21" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="3.2" filter="url(#rough2)"/>
  <text x="470" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#335478" filter="url(#rough2)">5</text>
  <circle cx="470" cy="250" r="21" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="3.2" filter="url(#rough2)"/>
  <text x="470" y="255" text-anchor="middle" font-size="13" font-weight="bold" fill="#335478" filter="url(#rough2)">6</text>
  <circle cx="600" cy="300" r="21" fill="#fbeadb" stroke="#d98c3f" stroke-width="3.2" filter="url(#rough2)"/>
  <text x="600" y="305" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a5d1c" filter="url(#rough2)">7</text>
  <circle cx="600" cy="160" r="21" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="3.2" filter="url(#rough2)"/>
  <text x="600" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#335478" filter="url(#rough2)">8</text>
  <rect x="36" y="340" width="648" height="44" rx="9" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="358" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">配对：{5,6} 双男、{3,4} 双男、{2,1} 双女、{7,8} 男+女</text>
  <text x="360" y="378" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">共 4 对，混合 1 对 → 输出 “4 1”（与样例一致）</text>
</svg>
