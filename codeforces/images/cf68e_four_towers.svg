<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="29"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="e5a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例一：四座塔放四艘船，③④ 全等共用同一组塔</text>
  <path d="M 150 40 Q 360 46 570 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 坐标系 -->
  <line x1="90" y1="330" x2="650" y2="330" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="90" y1="330" x2="90" y2="80" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="656" y="334" font-size="11" fill="#777" filter="url(#rough2)">x</text>
  <text x="76" y="86" font-size="11" fill="#777" filter="url(#rough2)">y</text>

  <!-- 塔点 -->
  <g filter="url(#rough2)">
    <circle cx="170" cy="270" r="6" fill="#2b2b2b"/>
    <text x="170" y="298" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">(0,0)</text>
    <circle cx="250" cy="270" r="6" fill="#2b2b2b"/>
    <text x="250" y="298" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">(1,0)</text>
    <circle cx="410" cy="270" r="6" fill="#2b2b2b"/>
    <text x="410" y="298" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">(3,0)</text>
    <circle cx="250" cy="110" r="6" fill="#2b2b2b"/>
    <text x="250" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">(1,2)</text>
  </g>

  <!-- ① -->
  <g filter="url(#rough2)" stroke="#446688" stroke-width="2.2" fill="none">
    <path d="M 170 270 L 250 270 L 250 110 Z"/>
  </g>
  <text x="196" y="228" font-size="11.5" font-weight="bold" fill="#2f4a66">① 1, 2, √5</text>

  <!-- ② -->
  <g filter="url(#rough2)" stroke="#2f7a3a" stroke-width="2.2" fill="none" stroke-dasharray="7 4">
    <path d="M 250 270 L 410 270 L 250 110 Z"/>
  </g>
  <text x="322" y="214" font-size="11.5" font-weight="bold" fill="#1f5226">② 2, 2, 2√2</text>

  <!-- ③④ -->
  <g filter="url(#rough2)" stroke="#b85450" stroke-width="2.2" fill="none" stroke-dasharray="3 4">
    <path d="M 170 270 L 410 270 L 250 110 Z"/>
  </g>
  <text x="300" y="150" font-size="11.5" font-weight="bold" fill="#8c2f2b">③④ 3, √5, 2√2</text>

  <!-- 说明 -->
  <rect x="430" y="86" width="270" height="150" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="446" y="112" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">四座塔、四条边</text>
  <text x="446" y="136" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">② 复用 ① 的 (1,0)-(1,2) 边</text>
  <text x="446" y="158" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">（距离平方 4 = ② 的边长）</text>
  <text x="446" y="182" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">圆-圆交点得第三个塔 (3,0)</text>
  <text x="446" y="206" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">③ 用 (0,0),(3,0),(1,2)</text>
  <text x="446" y="228" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">④ 与 ③ 全等 ⇒ 塔数不变</text>

  <rect x="430" y="248" width="270" height="64" rx="10" fill="#fdecea" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="446" y="272" font-size="12" font-weight="bold" fill="#8c2f2b" filter="url(#rough2)">为什么 3 座不行：</text>
  <text x="446" y="294" font-size="11.5" fill="#8c2f2b" filter="url(#rough2)">三座塔只给出一个三角形，而 ① ② 不全等</text>

  <text x="90" y="366" font-size="11.5" fill="#555" filter="url(#rough2)">判定全等不需要开方：直接比较三边长度的平方 {1,4,5}、{4,4,8}、{9,8,5}</text>
  <text x="90" y="388" font-size="11.5" fill="#555" filter="url(#rough2)">① 与 ② 的公共边长为 2（平方 4），这正是 ② 能省下一座塔的原因</text>
</svg>
