<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="181"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="380" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">样例 3：7 个点、概率均匀，E = 6 − 96/49 = 198/49</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">q_i = 1/7，对每个 t 算 Σ_u sz·Q</text>
  <g filter="url(#rough2)"><line x1="450" y1="106" x2="300" y2="144" stroke="#999999" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><line x1="450" y1="106" x2="600" y2="144" stroke="#999999" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><line x1="300" y1="196" x2="200" y2="234" stroke="#999999" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><line x1="300" y1="196" x2="400" y2="234" stroke="#999999" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><line x1="600" y1="196" x2="520" y2="234" stroke="#999999" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><line x1="600" y1="196" x2="720" y2="234" stroke="#999999" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><circle cx="450" cy="80" r="26" fill="#cfe0f5" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="450" y="84.32" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><circle cx="300" cy="170" r="26" fill="#cfe0f5" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="300" y="174.32" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><circle cx="600" cy="170" r="26" fill="#cfe0f5" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="600" y="174.32" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><circle cx="200" cy="260" r="26" fill="#cfe0f5" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="200" y="264.32" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><circle cx="400" cy="260" r="26" fill="#cfe0f5" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="400" y="264.32" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <g filter="url(#rough2)"><circle cx="520" cy="260" r="26" fill="#cfe0f5" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="520" y="264.32" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">6</text>
  <g filter="url(#rough2)"><circle cx="720" cy="260" r="26" fill="#cfe0f5" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="720" y="264.32" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">7</text>
  <text x="150" y="110" text-anchor="start" font-size="11" fill="#4a7a3a" filter="url(#rough2)">t = 1,2,3：括号 = 24/7</text>
  <text x="150" y="132" text-anchor="start" font-size="10.5" fill="#666666" filter="url(#rough2)">各贡献 24/49</text>
  <text x="150" y="176" text-anchor="start" font-size="11" fill="#b06a1e" filter="url(#rough2)">t = 4,5,6,7：括号 = 6/7</text>
  <text x="150" y="198" text-anchor="start" font-size="10.5" fill="#666666" filter="url(#rough2)">各贡献 6/49</text>
  <g filter="url(#rough2)"><rect x="150" y="290" width="600" height="70" rx="6" fill="#f3d9d6" fill-opacity="0.45" stroke="#8a2b28" stroke-width="1.4"/></g>
  <text x="450" y="316" text-anchor="middle" font-size="12.5" fill="#8a2b28" filter="url(#rough2)">S = (3·24 + 4·6)/49 = 96/49</text>
  <text x="450" y="342" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">E = 6 − 96/49 = 198/49 ≈ 4.0408163265</text>
</svg>
