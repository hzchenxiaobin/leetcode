<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="227"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="760" height="400" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">数位 DP：贴着 n 的前缀走，第一个“变小”的位置之后随便填</text>
  <path d="M 152 39 Q 380 45 608 39" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="60" y="70" width="50" height="42" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="85.0" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">4</text>
  <rect x="116" y="70" width="50" height="42" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="141.0" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">7</text>
  <rect x="172" y="70" width="50" height="42" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="197.0" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">1</text>
  <rect x="228" y="70" width="50" height="42" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="253.0" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">2</text>
  <rect x="284" y="70" width="50" height="42" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="309.0" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">3</text>
  <text x="60" y="60" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">n 的十进制</text>
  <text x="85.0" y="130" text-anchor="middle" font-size="10.5" fill="#8a6015" filter="url(#rough2)">tight</text>
  <text x="141.0" y="130" text-anchor="middle" font-size="10.5" fill="#8a6015" filter="url(#rough2)">tight</text>
  <text x="197.0" y="130" text-anchor="middle" font-size="10.5" fill="#8a6015" filter="url(#rough2)">tight</text>
  <text x="253.0" y="130" text-anchor="middle" font-size="10.5" fill="#8a6015" filter="url(#rough2)">tight</text>
  <text x="309.0" y="130" text-anchor="middle" font-size="10.5" fill="#8a6015" filter="url(#rough2)">tight</text>
  <text x="400" y="84" text-anchor="start" font-size="12" fill="#2f4a66" filter="url(#rough2)">在第 i 位放一个比 n[i] 小的数字 ⇒ 后面剩余 rem 位随便填，</text>
  <text x="400" y="106" text-anchor="start" font-size="12" fill="#2f4a66" filter="url(#rough2)">贡献 f[rem][新状态]（预处理表直接查）</text>
  <rect x="40" y="152" width="680" height="60" rx="8" fill="#e9f4ec" stroke="#3f6b4a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="56" y="176" text-anchor="start" font-size="12" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">统计 [0, N] 中“非 nearly lucky”的个数 bad(N)：按位枚举“这一位取 0..lim−1”的自由分支 + 走 tight 分支；</text>
  <text x="56" y="198" text-anchor="start" font-size="12" fill="#2f4a66" filter="url(#rough2)">tight 分支若中途出现非法（两个幸运数字太近），后面的位就都不再贡献。</text>
  <rect x="40" y="224" width="680" height="60" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="248" text-anchor="start" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">nearly(N) = (N + 1) − bad(N)    （0..N 共 N+1 个数，mod 1e9+7 计算）</text>
  <text x="56" y="270" text-anchor="start" font-size="12" fill="#7a5a1b" filter="url(#rough2)">答案 = nearly(r) − nearly(l−1)（l−1 用十进制字符串做一次借位减法）</text>
  <rect x="40" y="298" width="680" height="70" rx="8" fill="#f7ecec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="56" y="322" text-anchor="start" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">易错：① 前导零不是“位数”，不能累计距离；② N 本身也要计入（tight 走到最后且全程合法时 +1）；</text>
  <text x="56" y="344" text-anchor="start" font-size="12" fill="#8a3b37" filter="url(#rough2)">③ N 有 1000 位，必须按字符串处理，(N+1) 只能对 1e9+7 取模；④ k 与“距离”的严格不等号方向。</text>
</svg>
