<svg xmlns="http://www.w3.org/2000/svg" width="720" height="410" viewBox="0 0 720 410"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
  </defs>

  <rect width="720" height="410" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">四种位置类型：同字符位置投两票，异字符位置只投一票</text>
  <text x="360" y="52" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">逐位看一对 (s_i, t_i)，整段被压缩成四个计数 A、B、p、q</text>

  <!-- 卡片 1：A -->
  <rect x="28" y="78" width="158" height="132" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="107" y="104" text-anchor="middle" font-size="15" font-weight="bold" fill="#33517a" filter="url(#rough2)">s,t = 0,0</text>
  <text x="107" y="126" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">共 A 个</text>
  <text x="107" y="156" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">模式 0：2 票</text>
  <text x="107" y="180" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">模式 1：0 票</text>

  <!-- 卡片 2：B -->
  <rect x="196" y="78" width="158" height="132" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="275" y="104" text-anchor="middle" font-size="15" font-weight="bold" fill="#33517a" filter="url(#rough2)">s,t = 1,1</text>
  <text x="275" y="126" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">共 B 个</text>
  <text x="275" y="156" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">模式 1：2 票</text>
  <text x="275" y="180" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">模式 0：0 票</text>

  <!-- 卡片 3：p -->
  <rect x="364" y="78" width="158" height="132" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="443" y="104" text-anchor="middle" font-size="15" font-weight="bold" fill="#9c3b38" filter="url(#rough2)">s,t = 0,1</text>
  <text x="443" y="126" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">共 p 个</text>
  <text x="443" y="156" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">模式 0：1 票</text>
  <text x="443" y="180" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">模式 1：1 票</text>

  <!-- 卡片 4：q -->
  <rect x="532" y="78" width="158" height="132" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="611" y="104" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">s,t = 1,0</text>
  <text x="611" y="126" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">共 q 个</text>
  <text x="611" y="156" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">模式 0：1 票</text>
  <text x="611" y="180" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">模式 1：1 票</text>

  <!-- 操作条件 -->
  <rect x="28" y="222" width="662" height="74" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="44" y="248" font-size="12" fill="#8a6212" filter="url(#rough2)">一次操作取走位置集合 S（|S| = k）：存在某个 c，使</text>
  <text x="44" y="272" font-size="12" fill="#8a6212" filter="url(#rough2)">s 侧 c 的个数 ≥ ⌈k/2⌉ 且 t 侧 c 的个数 ≥ ⌈k/2⌉（半数打平也算模式）</text>

  <!-- 结论 -->
  <rect x="28" y="308" width="662" height="90" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="44" y="336" font-size="15" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">清空整段 ⟺ 2 · max(p, q) ≤ 区间长度 m</text>
  <text x="44" y="362" font-size="12" fill="#2e6e2e" filter="url(#rough2)">p = #(s=0,t=1)，q = #(s=1,t=0)：只统计两个方向的异字符位置</text>
  <text x="44" y="386" font-size="12" fill="#2e6e2e" filter="url(#rough2)">同字符位置 A、B 不直接出现在判据里，它们的作用是「补上差额」——见下一张图</text>
</svg>
