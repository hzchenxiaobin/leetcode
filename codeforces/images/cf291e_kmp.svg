<svg xmlns="http://www.w3.org/2000/svg" width="880" height="280" viewBox="0 0 880 280"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="280" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">树上沿路径做 KMP</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">每个匹配结束位置计数一次</text>
  <text x="150" y="110" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">一个位置 (v,x) 就是一个"结束位置"；把根到它的字符连起来</text>
  <text x="150" y="152" text-anchor="start" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">DFS 时用 KMP 维护"当前路径后缀匹配 t 的最长前缀"，每追加一个字符判断是否匹配完</text>
  <text x="150" y="196" text-anchor="start" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">回溯时用栈恢复 KMP 状态，总 O(总字母数)</text>
</svg>
