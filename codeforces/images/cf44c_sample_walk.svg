<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ac" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 3 走查：5 个区间叠加后，最早异常是第 4 天（0 次）</text>
  <path d="M 80 42 Q 360 48 640 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 区间条：每天一格，x=70 起，宽 60，10 天 -->
  <g filter="url(#rough2)" font-size="11.5">
    <text x="30" y="76" fill="#2f4a66">[1,2]</text>
    <rect x="70" y="64" width="120" height="16" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <text x="30" y="100" fill="#2f4a66">[3,3]</text>
    <rect x="190" y="88" width="60" height="16" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <text x="30" y="124" fill="#2f4a66">[5,7]</text>
    <rect x="310" y="112" width="180" height="16" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="30" y="148" fill="#2f4a66">[7,7]</text>
    <rect x="430" y="136" width="60" height="16" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <text x="30" y="172" fill="#2f4a66">[7,10]</text>
    <rect x="430" y="160" width="240" height="16" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>

  <!-- 天数轴 -->
  <g filter="url(#rough2)" font-size="10.5" fill="#666">
    <line x1="70" y1="190" x2="670" y2="190" stroke="#9bb0c4" stroke-width="1.2"/>
    <text x="100" y="206" text-anchor="middle">1</text>
    <text x="160" y="206" text-anchor="middle">2</text>
    <text x="220" y="206" text-anchor="middle">3</text>
    <text x="280" y="206" text-anchor="middle">4</text>
    <text x="340" y="206" text-anchor="middle">5</text>
    <text x="400" y="206" text-anchor="middle">6</text>
    <text x="460" y="206" text-anchor="middle">7</text>
    <text x="520" y="206" text-anchor="middle">8</text>
    <text x="580" y="206" text-anchor="middle">9</text>
    <text x="640" y="206" text-anchor="middle">10</text>
  </g>

  <!-- 覆盖次数方格 -->
  <g filter="url(#rough2)" font-size="14">
    <rect x="72" y="224" width="56" height="46" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="100" y="253" text-anchor="middle" font-weight="bold" fill="#2f5223">1</text>
    <rect x="132" y="224" width="56" height="46" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="160" y="253" text-anchor="middle" font-weight="bold" fill="#2f5223">1</text>
    <rect x="192" y="224" width="56" height="46" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="220" y="253" text-anchor="middle" font-weight="bold" fill="#2f5223">1</text>
    <rect x="252" y="224" width="56" height="46" fill="#fdecea" stroke="#b85450" stroke-width="2"/>
    <text x="280" y="253" text-anchor="middle" font-weight="bold" fill="#b85450">0</text>
    <rect x="312" y="224" width="56" height="46" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="340" y="253" text-anchor="middle" font-weight="bold" fill="#2f5223">1</text>
    <rect x="372" y="224" width="56" height="46" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="400" y="253" text-anchor="middle" font-weight="bold" fill="#2f5223">1</text>
    <rect x="432" y="224" width="56" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="460" y="253" text-anchor="middle" font-weight="bold" fill="#8a6015">3</text>
    <rect x="492" y="224" width="56" height="46" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="520" y="253" text-anchor="middle" font-weight="bold" fill="#2f5223">1</text>
    <rect x="552" y="224" width="56" height="46" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="580" y="253" text-anchor="middle" font-weight="bold" fill="#2f5223">1</text>
    <rect x="612" y="224" width="56" height="46" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="640" y="253" text-anchor="middle" font-weight="bold" fill="#2f5223">1</text>
  </g>
  <text x="360" y="292" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">覆盖次数 c[1..10]：注意第 7 天被三段区间同时覆盖，浇了 3 次</text>

  <!-- 最早异常箭头 -->
  <g filter="url(#rough2)">
    <path d="M 280 200 L 280 218" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#ac)"/>
    <path d="M 280 336 L 280 300" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#ac)"/>
  </g>
  <text x="280" y="336" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">第一个 ≠ 1：第 4 天，输出「4 0」</text>

  <rect x="70" y="356" width="598" height="52" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="84" y="380" font-size="12" fill="#2b2b2b" filter="url(#rough2)">第 7 天也是异常（3 次），但题面要求「编号最小的那一天」，所以答案是 4 而不是 7。</text>
  <text x="84" y="400" font-size="12" fill="#2f4a66" filter="url(#rough2)">从 1 开始扫描并在第一个异常处立即返回，正好保证最小天号。</text>
</svg>
