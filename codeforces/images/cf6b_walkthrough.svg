<svg xmlns="http://www.w3.org/2000/svg" width="780" height="430" viewBox="0 0 780 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="67"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrF" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="780" height="430" fill="#fafafa"/>

  <text x="390" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">样例走查：3 4 R / G.B. / .RR. / TTT. 的两格四邻</text>

  <!-- 表头 -->
  <rect x="40" y="58" width="700" height="40" fill="#eef1f4" stroke="#7a8ca6" stroke-width="1.3"
        filter="url(#rough2)"/>
  <text x="105" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#33445c" filter="url(#rough2)">总统桌格</text>
  <text x="235" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#33445c" filter="url(#rough2)">上</text>
  <text x="325" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#33445c" filter="url(#rough2)">下</text>
  <text x="415" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#33445c" filter="url(#rough2)">左</text>
  <text x="515" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#33445c" filter="url(#rough2)">右</text>
  <text x="655" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#33445c" filter="url(#rough2)">这一行记下</text>

  <!-- 第一行 -->
  <rect x="40" y="98" width="700" height="52" fill="#f7faff" stroke="#7a8ca6" stroke-width="1.2"
        filter="url(#rough2)"/>
  <text x="105" y="130" text-anchor="middle" font-size="13" fill="#23405c" filter="url(#rough2)">(1,1)</text>
  <text x="235" y="130" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">. 跳过</text>
  <text x="325" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">T 记下</text>
  <text x="415" y="130" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">. 跳过</text>
  <text x="515" y="130" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">R 自己</text>
  <text x="655" y="130" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">T</text>

  <!-- 第二行 -->
  <rect x="40" y="150" width="700" height="52" fill="#ffffff" stroke="#7a8ca6" stroke-width="1.2"
        filter="url(#rough2)"/>
  <text x="105" y="182" text-anchor="middle" font-size="13" fill="#23405c" filter="url(#rough2)">(1,2)</text>
  <text x="235" y="182" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">B 记下</text>
  <text x="325" y="182" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">T 记下</text>
  <text x="415" y="182" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">R 自己</text>
  <text x="515" y="182" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">. 跳过</text>
  <text x="655" y="182" text-anchor="middle" font-size="13" fill="#2f5223" filter="url(#rough2)">B</text>

  <!-- 表格竖线 -->
  <line x1="170" y1="58" x2="170" y2="202" stroke="#7a8ca6" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="280" y1="58" x2="280" y2="202" stroke="#7a8ca6" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="370" y1="58" x2="370" y2="202" stroke="#7a8ca6" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="460" y1="58" x2="460" y2="202" stroke="#7a8ca6" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="580" y1="58" x2="580" y2="202" stroke="#7a8ca6" stroke-width="1.1" filter="url(#rough2)"/>

  <!-- 结果 -->
  <path d="M 390 206 L 390 226" stroke="#446688" stroke-width="1.6" fill="none"
        marker-end="url(#arrF)" filter="url(#rough2)"/>
  <rect x="40" y="232" width="700" height="58" rx="10" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="58" y="258" font-size="13" fill="#2f5223" filter="url(#rough2)">布尔数组里为真的是 B 与 T（T 被两格各置真一次，仍算一张）。</text>
  <text x="58" y="280" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">真实颜色数 = |{B, T}| = 2 → 输出 2</text>

  <!-- 反例：G -->
  <rect x="40" y="304" width="346" height="106" rx="9" fill="#fdeef0" stroke="#b85450"
        stroke-width="1.3" filter="url(#rough2)"/>
  <text x="56" y="330" font-size="12" font-weight="bold" fill="#8c3b37" filter="url(#rough2)">为什么 G 不在表里？</text>
  <text x="56" y="354" font-size="11.5" fill="#8c3b37" filter="url(#rough2)">G 在 (0,0)，它唯一的"贴边"方向是 (1,0)。</text>
  <text x="56" y="376" font-size="11.5" fill="#8c3b37" filter="url(#rough2)">而 (1,0) 是 '.'，R 在 (1,1) —— 斜对角。</text>
  <text x="56" y="398" font-size="11.5" fill="#8c3b37" filter="url(#rough2)">只共顶点，没有公共边，所以不计入。</text>

  <!-- 若误用计数 -->
  <rect x="404" y="304" width="336" height="106" rx="9" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.3" filter="url(#rough2)"/>
  <text x="420" y="330" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">若把"相邻次数"当答案</text>
  <text x="420" y="354" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">并且连"自己是自己"也不排除：</text>
  <text x="420" y="376" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">T 2 次 + B 1 次 + R 2 次 = 5，</text>
  <text x="420" y="398" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">而正确答案是 2。</text>
</svg>
