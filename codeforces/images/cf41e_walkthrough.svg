<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="491"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="720" height="340" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">n = 5：A = {1,2}，B = {3,4,5}，共 6 条边</text>
  <g filter="url(#rough2)">
    <circle cx="160" cy="110" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="160" y="116" text-anchor="middle" font-size="13" fill="#2f4a66">1</text>
    <circle cx="160" cy="200" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="160" y="206" text-anchor="middle" font-size="13" fill="#2f4a66">2</text>
    <circle cx="520" cy="80" r="17" fill="#eef4ec" stroke="#4a7a3a" stroke-width="2"/>
    <text x="520" y="86" text-anchor="middle" font-size="13" fill="#2f5223">3</text>
    <circle cx="520" cy="155" r="17" fill="#eef4ec" stroke="#4a7a3a" stroke-width="2"/>
    <text x="520" y="161" text-anchor="middle" font-size="13" fill="#2f5223">4</text>
    <circle cx="520" cy="230" r="17" fill="#eef4ec" stroke="#4a7a3a" stroke-width="2"/>
    <text x="520" y="236" text-anchor="middle" font-size="13" fill="#2f5223">5</text>
  </g>
  <g stroke="#8a94a6" stroke-width="1.5" filter="url(#rough2)">
    <line x1="176" y1="110" x2="504" y2="80"/><line x1="176" y1="110" x2="504" y2="155"/><line x1="176" y1="110" x2="504" y2="230"/>
    <line x1="176" y1="200" x2="504" y2="80"/><line x1="176" y1="200" x2="504" y2="155"/><line x1="176" y1="200" x2="504" y2="230"/>
  </g>
  <text x="360" y="290" text-anchor="middle" font-size="13" fill="#2f5223" filter="url(#rough2)">2 × 3 = 6 = ⌊25/4⌋ ✓，且没有三角形</text>
  <text x="360" y="316" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">输出：第一行 6，随后 6 行每条跨侧边。</text>
</svg>
