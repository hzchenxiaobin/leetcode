  <text x="580.0" y="160.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="100.0" y="210.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">10</text>
  <text x="210.0" y="210.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">3</text>
