  <text x="430.0" y="110.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">(a−b)c</text>
  <text x="580.0" y="110.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">答案</text>
