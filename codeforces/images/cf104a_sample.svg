<svg xmlns="http://www.w3.org/2000/svg" width="880" height="356" viewBox="0 0 880 356"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="103"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/></marker>
  </defs>
  <rect width="880" height="356" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例：n=12 → need=2（4 张）；n=20 → need=10（15 张）</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">n=10 → need=0，无牌可补 → 0</text>
  <g filter="url(#rough2)"><rect x="120" y="120" width="260" height="60" rx="4" fill="#f6e3c4" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.3"/></g>
  <text x="250" y="146" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">need = 2</text>
  <text x="250" y="168" text-anchor="middle" font-size="11.5" fill="#3d6b2f" filter="url(#rough2)">4 张 2 → 答案 4</text>
  <g filter="url(#rough2)"><rect x="480" y="120" width="280" height="60" rx="4" fill="#d7ecd0" fill-opacity="0.6" stroke="#6a9a58" stroke-width="1.3"/></g>
  <text x="620" y="146" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">need = 10</text>
  <text x="620" y="168" text-anchor="middle" font-size="11.5" fill="#3d6b2f" filter="url(#rough2)">16 − 1 = 15 张 → 答案 15</text>
  <text x="440" y="232" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">A 是唯一能“一牌两值”的牌：算 1 或算 11，所以 1 和 11 两个目标都能由 A 补上</text>
  <text x="440" y="262" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">其余牌的点数固定；不同花色是不同的牌，所以要乘 4（10/J/Q/K 共 16 张）</text>
  <text x="440" y="308" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">输出所有可能第二张牌的个数（顺序无关），n ≤ 25 直接查表</text>
</svg>
