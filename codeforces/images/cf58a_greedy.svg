<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="582"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8a2b28"/>
    </marker>
  </defs>
  <rect width="760" height="320" fill="#fafafa"/>
  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">为什么"能匹配就立刻匹配"不会错过答案：贪心位置永远不晚于任何合法匹配</text>
  <path d="M 60 40 Q 380 48 700 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <text x="40" y="86" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">某个合法匹配把 hello 放在：</text>
  <g font-size="11">
    <rect x="300" y="66" width="34" height="30" rx="5" fill="#cfe0f5" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="317" y="86" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">h</text>
    <rect x="350" y="66" width="34" height="30" rx="5" fill="#cfe0f5" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="367" y="86" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">e</text>
    <rect x="400" y="66" width="34" height="30" rx="5" fill="#cfe0f5" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="417" y="86" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">l</text>
    <rect x="450" y="66" width="34" height="30" rx="5" fill="#cfe0f5" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="467" y="86" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">l</text>
    <rect x="500" y="66" width="34" height="30" rx="5" fill="#cfe0f5" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="517" y="86" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">o</text>
    <text x="548" y="86" font-size="10" fill="#555555" filter="url(#rough2)">（位置 p1…p5）</text>
  </g>

  <text x="40" y="150" font-size="11.5" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">贪心匹配的位置：</text>
  <g font-size="11">
    <rect x="260" y="130" width="34" height="30" rx="5" fill="#d9ecd4" stroke="#8a2b28" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="277" y="150" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">h</text>
    <rect x="310" y="130" width="34" height="30" rx="5" fill="#d9ecd4" stroke="#8a2b28" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="327" y="150" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">e</text>
    <rect x="360" y="130" width="34" height="30" rx="5" fill="#d9ecd4" stroke="#8a2b28" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="377" y="150" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">l</text>
    <rect x="410" y="130" width="34" height="30" rx="5" fill="#d9ecd4" stroke="#8a2b28" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="427" y="150" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">l</text>
    <rect x="460" y="130" width="34" height="30" rx="5" fill="#d9ecd4" stroke="#8a2b28" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="477" y="150" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">o</text>
    <text x="508" y="150" font-size="10" fill="#8a2b28" filter="url(#rough2)">（位置 g1…g5，每个都 ≤ 对应的 p）</text>
  </g>
  <path d="M 317 100 L 317 126" stroke="#8a2b28" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 367 100 L 367 126" stroke="#8a2b28" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 417 100 L 417 126" stroke="#8a2b28" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 467 100 L 467 126" stroke="#8a2b28" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 517 100 L 517 126" stroke="#8a2b28" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <rect x="40" y="186" width="680" height="52" rx="9" fill="#fbe3c8" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="56" y="208" font-size="11" fill="#2b2b2b" filter="url(#rough2)">归纳：第 1 位取最靠左的 h，它一定 ≤ p1；第 2 位从它右边开始找 e，得到的位置 ≤ p2；</text>
  <text x="56" y="228" font-size="11" fill="#2b2b2b" filter="url(#rough2)">如此类推，贪心的每个匹配位置都不晚于任意合法匹配——所以只要存在合法匹配，贪心一定找得到。</text>

  <rect x="40" y="250" width="680" height="50" rx="9" fill="#cfe0f5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="56" y="272" font-size="11" fill="#2b2b2b" filter="url(#rough2)">反过来，贪心若成功匹配，直接删掉所有未选中的字母就得到 hello，说明答案确实存在。</text>
  <text x="56" y="290" font-size="11" fill="#2b2b2b" filter="url(#rough2)">因此"贪心指针走到 5"与"hello 是 s 的子序列"完全等价。</text>
</svg>
