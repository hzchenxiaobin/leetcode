<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="720" height="380" fill="#fafafa"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2：升序逐层合并</text>
  <path d="M 200 43 Q 360 49 520 43" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <rect x="40" y="66" width="640" height="40" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="56" y="92" text-anchor="start" font-size="11.5" fill="#8a6015" filter="url(#rough2)">边：1-2 (1)、3-4 (2)、3-5 (3)、3-6 (4)、1-3 (5)</text>
  <rect x="40" y="120" width="640" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="56" y="145" text-anchor="start" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">w=1</text>
  <text x="120" y="145" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">边 1-2</text>
  <text x="230" y="145" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">两侧 1 / 1</text>
  <text x="370" y="145" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">2·1·1 = 2</text>
  <text x="560" y="145" text-anchor="start" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">边 1</text>
  <rect x="40" y="164" width="640" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="56" y="189" text-anchor="start" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">w=2</text>
  <text x="120" y="189" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">边 3-4</text>
  <text x="230" y="189" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">两侧 1 / 1</text>
  <text x="370" y="189" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">2·1·1 = 2</text>
  <text x="560" y="189" text-anchor="start" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">边 3</text>
  <rect x="40" y="208" width="640" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="56" y="233" text-anchor="start" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">w=3</text>
  <text x="120" y="233" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">边 3-5</text>
  <text x="230" y="233" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">两侧 1 / 2</text>
  <text x="370" y="233" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">2·1·2 = 4</text>
  <text x="560" y="233" text-anchor="start" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">边 4</text>
  <rect x="40" y="252" width="640" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="56" y="277" text-anchor="start" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">w=4</text>
  <text x="120" y="277" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">边 3-6</text>
  <text x="230" y="277" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">两侧 1 / 3</text>
  <text x="370" y="277" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">2·1·3 = 6</text>
  <text x="560" y="277" text-anchor="start" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">边 5</text>
  <rect x="40" y="296" width="640" height="38" rx="4" fill="#e9f4e2" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="56" y="321" text-anchor="start" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">w=5</text>
  <text x="120" y="321" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">边 1-3</text>
  <text x="230" y="321" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">两侧 2 / 4</text>
  <text x="370" y="321" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">2·2·4 = 16</text>
  <text x="560" y="321" text-anchor="start" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">边 2</text>
  <text x="40" y="366" text-anchor="start" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">最大是 16、只有边 2 → 输出「16 1」和「2」。</text>
</svg>
