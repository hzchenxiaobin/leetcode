<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c9801f"/>
    </marker>
  </defs>

  <rect width="760" height="420" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="38" text-anchor="middle" font-size="18.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">Billy 判「相等」的集合 ⊇ 真正相等的集合</text>
  <path d="M 152 50 Q 380 56 608 50" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60" y="90" width="640" height="150" rx="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="120" text-anchor="middle" font-size="15" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">Billy 认为相等：d(d(A)*d(B)) == d(C)</text>
  <rect x="250" y="150" width="260" height="70" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="178" text-anchor="middle" font-size="14" fill="#2f5223" font-weight="bold" filter="url(#rough2)">真正相等：A*B == C</text>
  <text x="380" y="202" text-anchor="middle" font-size="12" fill="#2f5223" font-weight="normal" filter="url(#rough2)">共 sum_{A=1}^{N} N/A 组</text>
  <text x="620" y="178" text-anchor="middle" font-size="13" fill="#b6483f" font-weight="bold" filter="url(#rough2)">差值 = 误判</text>
  <text x="60" y="290" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">为什么真相等一定被 Billy 判对：数字根满足 d(xy) = d(d(x)d(y))，故 A*B = C 时必有 d(d(A)d(B)) = d(C)。</text>
  <text x="60" y="316" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">于是 Billy 出错的三元组数 = 「他判相等」的组数 − 「真的相等」的组数，两个都能 O(N) 求出。</text>
  <text x="60" y="360" text-anchor="start" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">答案 = sum_{r,s} cnt[r]*cnt[s]*cnt[d(r*s)] − sum_{A=1}^{N} floor(N/A)</text>
</svg>
