<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="720" height="400" fill="#fafafa"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">交集长度关于 y 是分段线性的</text>
  <path d="M 200 43 Q 360 49 520 43" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 90 320 L 660 320" stroke="#777777" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 90 340 L 90 118" stroke="#777777" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="662" y="334" text-anchor="start" font-size="11" fill="#777777" filter="url(#rough2)">y</text>
  <text x="96" y="116" text-anchor="start" font-size="11" fill="#777777" filter="url(#rough2)">长度</text>
  <path d="M 130 290 L 230 200 L 340 170 L 470 240 L 630 280" stroke="#446688" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <circle cx="130" cy="290" r="5" fill="#fdecea" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="130" y="336" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">y1</text>
  <circle cx="230" cy="200" r="5" fill="#fdecea" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="230" y="336" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">y2</text>
  <text x="180.0" y="235.0" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">线性</text>
  <circle cx="340" cy="170" r="5" fill="#fdecea" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="340" y="336" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">y3</text>
  <text x="285.0" y="175.0" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">线性</text>
  <circle cx="470" cy="240" r="5" fill="#fdecea" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="470" y="336" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">y4</text>
  <text x="405.0" y="195.0" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">线性</text>
  <circle cx="630" cy="280" r="5" fill="#fdecea" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="630" y="336" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">y5</text>
  <text x="550.0" y="250.0" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">线性</text>
  <rect x="60" y="42" width="600" height="56" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="76" y="66" text-anchor="start" font-size="11.5" fill="#8a6015" filter="url(#rough2)">断点只有 4 类：r_i·u = r_j·v、l_i·u = l_j·v、r_i·u = l_j·v、r_j·v = l_i·u</text>
  <text x="76" y="88" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">每个窗户对至多 4 个断点 → 总复杂度 O(n²)</text>
  <text x="90" y="356" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">两段之间是直线，用梯形公式就精确，没有积分误差；</text>
  <text x="90" y="378" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">端点交叉之处的值正好是 0（两光斑刚好错开），把负数截成 0 即可。</text>
</svg>
