<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="505"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="440" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">198B：两堵墙、水位每秒涨 1，状态 (墙, 位置) 做 BFS</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="150.0" y="70.0" width="90.0" height="280.0" fill="#ffffff" stroke="#999999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="195.0" y="60.0" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">左墙</text>
  <rect x="410.0" y="70.0" width="90.0" height="280.0" fill="#ffffff" stroke="#999999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="455.0" y="60.0" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">右墙</text>
  <rect x="120.0" y="300.0" width="420.0" height="50.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="330.0" y="332.0" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">水位（每秒 +1）</text>
  <text x="120.0" y="310.0" text-anchor="end" font-size="9.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="520.0" y="310.0" text-anchor="start" font-size="9.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="120.0" y="276.0" text-anchor="end" font-size="9.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="520.0" y="276.0" text-anchor="start" font-size="9.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="120.0" y="242.0" text-anchor="end" font-size="9.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="520.0" y="242.0" text-anchor="start" font-size="9.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="120.0" y="208.0" text-anchor="end" font-size="9.5" fill="#888" filter="url(#rough2)">4</text>
  <text x="520.0" y="208.0" text-anchor="start" font-size="9.5" fill="#888" filter="url(#rough2)">4</text>
  <text x="120.0" y="174.0" text-anchor="end" font-size="9.5" fill="#888" filter="url(#rough2)">5</text>
  <text x="520.0" y="174.0" text-anchor="start" font-size="9.5" fill="#888" filter="url(#rough2)">5</text>
  <text x="120.0" y="140.0" text-anchor="end" font-size="9.5" fill="#888" filter="url(#rough2)">6</text>
  <text x="520.0" y="140.0" text-anchor="start" font-size="9.5" fill="#888" filter="url(#rough2)">6</text>
  <text x="120.0" y="106.0" text-anchor="end" font-size="9.5" fill="#888" filter="url(#rough2)">7</text>
  <text x="520.0" y="106.0" text-anchor="start" font-size="9.5" fill="#888" filter="url(#rough2)">7</text>
  <line x1="240.0" y1="200.0" x2="410.0" y2="130.0" stroke="#8a6015" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320.0" y="150.0" text-anchor="middle" font-size="10.5" fill="#8a6015" filter="url(#rough2)">跳 +k 到另一堵墙</text>
  <rect x="60.0" y="376.0" width="620.0" height="50.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="74.0" y="399.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">每步：上/下 1，或换墙 +k；移动后要求 位置 &gt; 时间+1</text>
</svg>
