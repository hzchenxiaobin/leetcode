<svg xmlns="http://www.w3.org/2000/svg" width="700" height="400" viewBox="0 0 700 400"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="211"/>
    <feDisplacementMap in="SourceGraphic" scale="1.5"/></filter></defs>
  <rect width="700" height="400" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">程序的状态 = (当前位置 x, 下一步是 step2 还是 step3)</text>
  <path d="M 90 40 Q 350 46 610 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="260" height="92" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="190" y="84" text-anchor="middle" font-size="14" fill="#22314a" filter="url(#rough2)">状态 (x, 0)：该做 step 2</text>
  <text x="190" y="108" text-anchor="middle" font-size="12.5" fill="#22314a" filter="url(#rough2)">y += a[x]，x += a[x]</text>
  <text x="190" y="130" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">x 越界 ⇒ 结束；否则 → (x, 1)</text>
  <text x="190" y="148" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">注意：新的 x 可能 &gt; n</text>
  <g filter="url(#rough2)"><rect x="380" y="58" width="260" height="92" rx="8" fill="#e8f4e0" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="510" y="84" text-anchor="middle" font-size="14" fill="#2f5223" filter="url(#rough2)">状态 (x, 1)：该做 step 3</text>
  <text x="510" y="108" text-anchor="middle" font-size="12.5" fill="#2f5223" filter="url(#rough2)">y += a[x]，x -= a[x]</text>
  <text x="510" y="130" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">x ≤ 0 ⇒ 结束；否则 → (x, 0)</text>
  <text x="510" y="148" text-anchor="middle" font-size="11" fill="#3c5e2e" filter="url(#rough2)">x 在 [1,n] 内继续</text>
  <g filter="url(#rough2)"><rect x="60" y="166" width="580" height="76" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="76" y="190" font-size="13" fill="#8a6015" filter="url(#rough2)">共 2n 个状态；每个状态只有一条出边 ⇒ 这是"函数图"（functional graph）。</text>
  <text x="76" y="214" font-size="13" fill="#8a6015" filter="url(#rough2)">沿着出边走：要么到达终点（越界），要么走进一个环 ⇒ 环上的状态全部"不终止"（−1）。</text>
  <text x="76" y="236" font-size="12" fill="#8a6015" filter="url(#rough2)">记忆化 DFS：栈上再次遇到 = 环 ⇒ 返回 −1；已完成的状态直接查表。</text>
  <g filter="url(#rough2)"><rect x="60" y="258" width="580" height="132" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="282" font-size="13" fill="#2f5223" filter="url(#rough2)">关键：题目要对每个 i 跑一遍 a₁ = i。但 a[x]（x ≥ 2）与 i 无关！</text>
  <text x="76" y="306" font-size="12.5" fill="#2f5223" filter="url(#rough2)">所以先对 x ≥ 2 的所有状态算好 f(x,phase) = 从该状态起累计的 y 增量（−1 表示不终止）；</text>
  <text x="76" y="330" font-size="12.5" fill="#2f5223" filter="url(#rough2)">每个询问只需"手工做第一步"：y = i，x = 1 + i。</text>
  <text x="76" y="354" font-size="12.5" fill="#2f5223" filter="url(#rough2)">若 1+i &gt; n ⇒ 答案就是 i；否则答案 = i + f(1+i, 1)（f 为 −1 时输出 −1）。</text>
  <text x="76" y="378" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">复杂度 O(n)，n ≤ 2·10⁵。</text>
</svg>
