<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="440" fill="#fafafa"/>

  <text x="330" y="34" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">
    两组官方样例的走查：min(0-run 数, 1-run 数) 与 k 比较
  </text>

  <rect x="50" y="54" width="560" height="40" rx="6" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="78" y="80" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">组</text>
  <text x="130" y="80" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">询问</text>
  <text x="190" y="80" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">k</text>
  <text x="280" y="80" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">y[l..r]</text>
  <text x="385" y="80" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">r0</text>
  <text x="432" y="80" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">r1</text>
  <text x="480" y="80" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">min</text>
  <text x="550" y="80" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">判定</text>

  <rect x="50" y="94" width="560" height="40" fill="#ffffff" stroke="#446688" stroke-width="0.8"
        filter="url(#rough2)"/>
  <rect x="50" y="134" width="560" height="40" fill="#ffffff" stroke="#446688" stroke-width="0.8"
        filter="url(#rough2)"/>
  <rect x="50" y="174" width="560" height="40" fill="#ffffff" stroke="#446688" stroke-width="0.8"
        filter="url(#rough2)"/>
  <rect x="50" y="214" width="560" height="40" fill="#ffffff" stroke="#446688" stroke-width="0.8"
        filter="url(#rough2)"/>
  <rect x="50" y="254" width="560" height="40" fill="#ffffff" stroke="#446688" stroke-width="0.8"
        filter="url(#rough2)"/>
  <rect x="50" y="294" width="560" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8"
        filter="url(#rough2)"/>
  <rect x="50" y="334" width="560" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8"
        filter="url(#rough2)"/>

  <!-- 第 1 行 -->
  <text x="78" y="120" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#rough2)">T1</text>
  <text x="130" y="120" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">[1,5]</text>
  <text x="190" y="120" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="280" y="120" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">10011</text>
  <text x="385" y="120" text-anchor="middle" font-size="12.5" fill="#b8860b" filter="url(#rough2)">1</text>
  <text x="432" y="120" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">2</text>
  <text x="480" y="120" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="550" y="120" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">YES</text>

  <!-- 第 2 行 -->
  <text x="78" y="160" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#rough2)">T1</text>
  <text x="130" y="160" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">[1,5]</text>
  <text x="190" y="160" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="280" y="160" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">10011</text>
  <text x="385" y="160" text-anchor="middle" font-size="12.5" fill="#b8860b" filter="url(#rough2)">1</text>
  <text x="432" y="160" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">2</text>
  <text x="480" y="160" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="550" y="160" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">YES</text>

  <!-- 第 3 行 -->
  <text x="78" y="200" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#rough2)">T1</text>
  <text x="130" y="200" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">[2,4]</text>
  <text x="190" y="200" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="280" y="200" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">001</text>
  <text x="385" y="200" text-anchor="middle" font-size="12.5" fill="#b8860b" filter="url(#rough2)">1</text>
  <text x="432" y="200" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">1</text>
  <text x="480" y="200" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="550" y="200" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">YES</text>

  <!-- 第 4 行 -->
  <text x="78" y="240" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#rough2)">T1</text>
  <text x="130" y="240" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">[1,2]</text>
  <text x="190" y="240" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="280" y="240" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">10</text>
  <text x="385" y="240" text-anchor="middle" font-size="12.5" fill="#b8860b" filter="url(#rough2)">1</text>
  <text x="432" y="240" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">1</text>
  <text x="480" y="240" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="550" y="240" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">NO</text>

  <!-- 第 5 行 -->
  <text x="78" y="280" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#rough2)">T1</text>
  <text x="130" y="280" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">[3,4]</text>
  <text x="190" y="280" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="280" y="280" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">01</text>
  <text x="385" y="280" text-anchor="middle" font-size="12.5" fill="#b8860b" filter="url(#rough2)">1</text>
  <text x="432" y="280" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">1</text>
  <text x="480" y="280" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="550" y="280" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">NO</text>

  <!-- 第 6 行 -->
  <text x="78" y="320" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#rough2)">T2</text>
  <text x="130" y="320" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">[1,4]</text>
  <text x="190" y="320" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="280" y="320" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0000</text>
  <text x="385" y="320" text-anchor="middle" font-size="12.5" fill="#b8860b" filter="url(#rough2)">1</text>
  <text x="432" y="320" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">0</text>
  <text x="480" y="320" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="550" y="320" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">YES</text>

  <!-- 第 7 行 -->
  <text x="78" y="360" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#rough2)">T2</text>
  <text x="130" y="360" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">[2,3]</text>
  <text x="190" y="360" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="280" y="360" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">00</text>
  <text x="385" y="360" text-anchor="middle" font-size="12.5" fill="#b8860b" filter="url(#rough2)">1</text>
  <text x="432" y="360" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">0</text>
  <text x="480" y="360" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="550" y="360" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">YES</text>

  <text x="330" y="398" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">
    T1：s = 00110 ⇒ y = 10011　　T2：s = 1010 ⇒ y = 0000
  </text>
  <text x="330" y="420" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">
    第 7 行 y2 = y3 = 0 ⇒ 0-run 被 l 截断，靠 +1 修正才得到 r0 = 1
  </text>
</svg>
