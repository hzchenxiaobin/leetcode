<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1055"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="760" height="320" fill="#fafafa"/>
  <text x="380.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">三类居民各管一个属性</text>
  <path d="M 121.60000000000001 42 Q 380.0 48 638.4 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="380.0" y="306" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">分离性：武器只吃 gladiator、护甲只吃 sentry、法球只吃 physician</text>
  <rect x="40" y="70" width="220" height="150" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">weapon</text>
  <text x="150" y="130" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">基础 atk</text>
  <text x="150" y="160" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">＋ Σ gladiator</text>
  <text x="150" y="190" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">只取该类居民</text>
  <rect x="280" y="70" width="220" height="150" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="390" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#5a7fb0" filter="url(#rough2)">armor</text>
  <text x="390" y="130" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">基础 def</text>
  <text x="390" y="160" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#5a7fb0" filter="url(#rough2)">＋ Σ sentry</text>
  <text x="390" y="190" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">只取该类居民</text>
  <rect x="520" y="70" width="220" height="150" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="630" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#d6a040" filter="url(#rough2)">orb</text>
  <text x="630" y="130" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">基础 res</text>
  <text x="630" y="160" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#d6a040" filter="url(#rough2)">＋ Σ physician</text>
  <text x="630" y="190" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">只取该类居民</text>
  <rect x="40" y="236" width="680" height="46" rx="7" fill="#fbeeee" stroke="#a05a5a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="258" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b3030" filter="url(#rough2)">总容量 = 居民数 ⇒ 一个空位都没有 ⇒ 谁也不能动（样例 2）</text>
  <text x="380" y="296" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">总容量 &gt; 居民数 ⇒ 空位可当令牌，任意重排可达</text>
</svg>
