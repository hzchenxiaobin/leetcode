<svg xmlns="http://www.w3.org/2000/svg" width="800" height="570" viewBox="0 0 800 570"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="43"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="800" height="570" fill="#fafafa"/>

  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">耐心排序维护 tailH，再用 par 还原方案</text>
  <path d="M 150 42 Q 400 48 650 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 输入序列 -->
  <g filter="url(#rough2)">
    <rect x="30" y="56" width="112" height="44" rx="8" fill="#eef4fb" stroke="#446688" stroke-width="1.4"/>
    <text x="86" y="76" text-anchor="middle" font-size="11" fill="#2f4a66">位置 0</text>
    <text x="86" y="93" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">h = 4</text>
    <rect x="155" y="56" width="112" height="44" rx="8" fill="#eef4fb" stroke="#446688" stroke-width="1.4"/>
    <text x="211" y="76" text-anchor="middle" font-size="11" fill="#2f4a66">位置 1</text>
    <text x="211" y="93" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">h = 8</text>
    <rect x="280" y="56" width="112" height="44" rx="8" fill="#eef4fb" stroke="#446688" stroke-width="1.4"/>
    <text x="336" y="76" text-anchor="middle" font-size="11" fill="#2f4a66">位置 2</text>
    <text x="336" y="93" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">h = 3</text>
    <rect x="405" y="56" width="112" height="44" rx="8" fill="#eef4fb" stroke="#446688" stroke-width="1.4"/>
    <text x="461" y="76" text-anchor="middle" font-size="11" fill="#2f4a66">位置 3</text>
    <text x="461" y="93" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">h = 11</text>
    <rect x="530" y="56" width="112" height="44" rx="8" fill="#eef4fb" stroke="#446688" stroke-width="1.4"/>
    <text x="586" y="76" text-anchor="middle" font-size="11" fill="#2f4a66">位置 4</text>
    <text x="586" y="93" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">h = 8</text>
    <rect x="655" y="56" width="112" height="44" rx="8" fill="#eef4fb" stroke="#446688" stroke-width="1.4"/>
    <text x="711" y="76" text-anchor="middle" font-size="11" fill="#2f4a66">位置 5</text>
    <text x="711" y="93" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">h = 12</text>
  </g>
  <text x="30" y="120" font-size="11.5" fill="#4a6b8a" filter="url(#rough2)">上排是排好序后的高序列（位置是排序位置，不是原编号）</text>

  <!-- 左面板：tailH 状态 -->
  <rect x="24" y="134" width="368" height="200" rx="12" fill="#eef7ee" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="40" y="160" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">扫描完的 tailH：每个长度的最小结尾</text>

  <g filter="url(#rough2)">
    <text x="40" y="192" font-size="11.5" fill="#3c5e2e">长度 1</text>
    <rect x="104" y="176" width="52" height="24" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="130" y="193" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">3</text>
    <text x="176" y="192" font-size="11" fill="#3c5e2e">tailId = 2</text>

    <text x="40" y="226" font-size="11.5" fill="#3c5e2e">长度 2</text>
    <rect x="104" y="210" width="52" height="24" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="130" y="227" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">8</text>
    <text x="176" y="226" font-size="11" fill="#3c5e2e">tailId = 1</text>

    <text x="40" y="260" font-size="11.5" fill="#3c5e2e">长度 3</text>
    <rect x="104" y="244" width="52" height="24" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="130" y="261" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">11</text>
    <text x="176" y="260" font-size="11" fill="#3c5e2e">tailId = 3</text>

    <text x="40" y="294" font-size="11.5" fill="#3c5e2e">长度 4</text>
    <rect x="104" y="278" width="52" height="24" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="130" y="295" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">12</text>
    <text x="176" y="294" font-size="11" fill="#3c5e2e">tailId = 5</text>
  </g>
  <text x="40" y="320" font-size="11" fill="#4a7a3a" filter="url(#rough2)">tailH 恒严格递增，所以能对它二分（lower_bound）</text>

  <!-- 右面板：三种情形 -->
  <rect x="408" y="134" width="368" height="200" rx="12" fill="#fdeeee" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="424" y="160" font-size="12.5" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">每个元素只做一次 lower_bound</text>

  <text x="424" y="190" font-size="11.5" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">① pos = 长度：追加</text>
  <text x="424" y="210" font-size="11" fill="#8a2b28" filter="url(#rough2)">[3, 8] 接上 h = 11 → [3, 8, 11]</text>

  <text x="424" y="240" font-size="11.5" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">② tailH[pos] &gt; h：替换</text>
  <text x="424" y="260" font-size="11" fill="#8a2b28" filter="url(#rough2)">[4] 遇上 h = 3 → [3]（结尾更小更优）</text>

  <text x="424" y="290" font-size="11.5" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">③ tailH[pos] == h：跳过</text>
  <text x="424" y="310" font-size="11" fill="#8a2b28" filter="url(#rough2)">[3, 8] 遇上 h = 8 → 不变（严格递增）</text>

  <text x="424" y="328" font-size="10.5" fill="#9a4a47" filter="url(#rough2)">追加/替换时写 par[i] = tailId[pos-1]</text>

  <!-- 底部：par 链 -->
  <rect x="24" y="352" width="752" height="132" rx="12" fill="#f4f4f4" stroke="#9a9a9a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="40" y="378" font-size="12.5" font-weight="bold" fill="#4a4a4a" filter="url(#rough2)">沿 par 回溯：5 → 3 → 1 → 0</text>

  <g filter="url(#rough2)">
    <rect x="48" y="392" width="96" height="36" rx="8" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="96" y="415" text-anchor="middle" font-size="11.5" fill="#2b2b2b">0: h=4</text>
    <rect x="196" y="392" width="96" height="36" rx="8" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="244" y="415" text-anchor="middle" font-size="11.5" fill="#2b2b2b">1: h=8</text>
    <rect x="344" y="392" width="96" height="36" rx="8" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="392" y="415" text-anchor="middle" font-size="11.5" fill="#2b2b2b">3: h=11</text>
    <rect x="492" y="392" width="96" height="36" rx="8" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="540" y="415" text-anchor="middle" font-size="11.5" fill="#2b2b2b">5: h=12</text>
  </g>
  <path d="M 146 410 L 190 410" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 294 410 L 338 410" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 442 410 L 486 410" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <text x="616" y="406" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">reverse 后：0, 1, 3, 5</text>
  <text x="616" y="426" font-size="11.5" fill="#2f5223" filter="url(#rough2)">h = 4, 8, 11, 12 严格递增</text>
  <text x="48" y="458" font-size="11" fill="#5a5a5a" filter="url(#rough2)">链长 = |tailH| = 4；把排序位置换回原编号（+1）就是最终答案</text>

  <!-- 底部说明 -->
  <text x="24" y="512" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">为什么 tailH 的长度就是答案：长度 L 的可达性只取决于各长度的最小结尾，而 lower_bound 恰好维护了“同长度结尾尽量小”。</text>
  <text x="24" y="538" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">回溯链只在“追加 / 替换”时更新前驱，因此链上相邻两项的高度一定严格递增，是一条真链。</text>
</svg>
