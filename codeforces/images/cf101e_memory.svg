<svg xmlns="http://www.w3.org/2000/svg" width="884" height="412" viewBox="0 0 884 412"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="101"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="884" height="412" fill="#fafafa"/>
  <text x="442" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">O(m) 内存 + 检查点 + 分块回溯</text>
  <text x="442" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">正着算 dp，倒着沿决策位走回 (0,0)</text>
  <text x="90" y="96" text-anchor="start" font-size="11.5" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">正向扫描（行优先）</text>
  <g filter="url(#rough2)"><rect x="90" y="112" width="300" height="20" rx="2" fill="#ffffff" fill-opacity="0.7" stroke="#99aabb" stroke-width="1.0"/></g>
  <g filter="url(#rough2)"><rect x="90" y="140" width="300" height="20" rx="2" fill="#ffffff" fill-opacity="0.7" stroke="#99aabb" stroke-width="1.0"/></g>
  <g filter="url(#rough2)"><rect x="90" y="168" width="300" height="20" rx="2" fill="#cfe0f5" fill-opacity="0.5" stroke="#99aabb" stroke-width="1.0"/></g>
  <g filter="url(#rough2)"><rect x="90" y="196" width="300" height="20" rx="2" fill="#ffffff" fill-opacity="0.7" stroke="#99aabb" stroke-width="1.0"/></g>
  <g filter="url(#rough2)"><rect x="90" y="224" width="300" height="20" rx="2" fill="#ffffff" fill-opacity="0.7" stroke="#99aabb" stroke-width="1.0"/></g>
  <g filter="url(#rough2)"><rect x="90" y="252" width="300" height="20" rx="2" fill="#cfe0f5" fill-opacity="0.5" stroke="#99aabb" stroke-width="1.0"/></g>
  <g filter="url(#rough2)"><rect x="90" y="280" width="300" height="20" rx="2" fill="#ffffff" fill-opacity="0.7" stroke="#99aabb" stroke-width="1.0"/></g>
  <g filter="url(#rough2)"><rect x="90" y="308" width="300" height="20" rx="2" fill="#ffffff" fill-opacity="0.7" stroke="#99aabb" stroke-width="1.0"/></g>
  <text x="400" y="240" text-anchor="start" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">每 R 行存一份 dp 行（检查点）</text>
  <text x="400" y="264" text-anchor="start" font-size="10.5" fill="#555555" filter="url(#rough2)">R ≈ 1024 → 仅约 3 MB</text>
  <text x="520" y="96" text-anchor="start" font-size="11.5" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">倒向回溯（按块重算决策位）</text>
  <g filter="url(#rough2)"><rect x="520" y="112" width="300" height="20" rx="2" fill="#ffffff" fill-opacity="0.7" stroke="#99aabb" stroke-width="1.0"/></g>
  <g filter="url(#rough2)"><rect x="520" y="140" width="300" height="20" rx="2" fill="#ffffff" fill-opacity="0.7" stroke="#99aabb" stroke-width="1.0"/></g>
  <g filter="url(#rough2)"><rect x="520" y="168" width="300" height="20" rx="2" fill="#f6e3c4" fill-opacity="0.5" stroke="#99aabb" stroke-width="1.0"/></g>
  <g filter="url(#rough2)"><rect x="520" y="196" width="300" height="20" rx="2" fill="#ffffff" fill-opacity="0.7" stroke="#99aabb" stroke-width="1.0"/></g>
  <g filter="url(#rough2)"><rect x="520" y="224" width="300" height="20" rx="2" fill="#ffffff" fill-opacity="0.7" stroke="#99aabb" stroke-width="1.0"/></g>
  <g filter="url(#rough2)"><rect x="520" y="252" width="300" height="20" rx="2" fill="#f6e3c4" fill-opacity="0.5" stroke="#99aabb" stroke-width="1.0"/></g>
  <g filter="url(#rough2)"><rect x="520" y="280" width="300" height="20" rx="2" fill="#ffffff" fill-opacity="0.7" stroke="#99aabb" stroke-width="1.0"/></g>
  <g filter="url(#rough2)"><rect x="520" y="308" width="300" height="20" rx="2" fill="#ffffff" fill-opacity="0.7" stroke="#99aabb" stroke-width="1.0"/></g>
  <text x="520" y="352" text-anchor="start" font-size="10.5" fill="#8a2b28" filter="url(#rough2)">块内重算 R 行（共 4×10⁸ 次，与正向同阶）</text>
  <text x="520" y="376" text-anchor="start" font-size="10.5" fill="#555555" filter="url(#rough2)">决策位：1=从上方来(C)，0=从左方来(S)</text>
  <text x="440" y="404" text-anchor="middle" font-size="11" fill="#3d6b2f" filter="url(#rough2)">内存 = 检查点 (n/R)·m·8 + 决策位 R·m/8 ≈ 6 MB，远低于 45 MB 限制</text>
</svg>
