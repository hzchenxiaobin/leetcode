<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="79"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="860" height="330" fill="#fafafa"/>
  <text x="430" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2：x = 3, y = 22 的每一步</text>
  <text x="430" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">轮到谁、取哪种、剩余多少</text>
  <g filter="url(#rough2)"><rect x="34" y="96" width="170" height="96" rx="4" fill="#f6e3c4" fill-opacity="0.8" stroke="#444444" stroke-width="1.6"/></g>
  <text x="119" y="122" text-anchor="middle" font-size="13.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">初始</text>
  <text x="119" y="152" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">x = 3</text>
  <text x="119" y="174" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">y = 22</text>
  <g filter="url(#rough2)"><line x1="208" y1="144" x2="240" y2="144" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrg)"/></g>
  <g filter="url(#rough2)"><rect x="244" y="96" width="170" height="96" rx="4" fill="#d7ecd0" fill-opacity="0.8" stroke="#444444" stroke-width="1.6"/></g>
  <text x="329" y="122" text-anchor="middle" font-size="13.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">Ciel 取 (2,2)</text>
  <text x="329" y="152" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">x = 1</text>
  <text x="329" y="174" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">y = 20</text>
  <g filter="url(#rough2)"><line x1="418" y1="144" x2="450" y2="144" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrg)"/></g>
  <g filter="url(#rough2)"><rect x="454" y="96" width="170" height="96" rx="4" fill="#cfe0f5" fill-opacity="0.8" stroke="#444444" stroke-width="1.6"/></g>
  <text x="539" y="122" text-anchor="middle" font-size="13.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">Hanako 取 (1,12)</text>
  <text x="539" y="152" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">x = 0</text>
  <text x="539" y="174" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">y = 8</text>
  <g filter="url(#rough2)"><line x1="628" y1="144" x2="660" y2="144" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrg)"/></g>
  <g filter="url(#rough2)"><rect x="664" y="96" width="170" height="96" rx="4" fill="#f6d9d7" fill-opacity="0.8" stroke="#444444" stroke-width="1.6"/></g>
  <text x="749" y="122" text-anchor="middle" font-size="13.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">Ciel 无法凑 220</text>
  <text x="749" y="152" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">Hanako 胜</text>
  <text x="430" y="236" text-anchor="middle" font-size="12.5" fill="#8a2b28" filter="url(#rough2)">Ciel 只剩 8 枚 10 元硬币，凑不出 220 → 判负</text>
  <text x="430" y="266" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">注意：Ciel 的第一手不会去选 (1,12)，因为存在含 100 元更多的取法</text>
  <g filter="url(#rough2)"><rect x="120" y="288" width="620" height="30" rx="4" fill="#ffffff" fill-opacity="0.0" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="5 4"/></g>
  <text x="430" y="308" text-anchor="middle" font-size="12" fill="#3d6b2f" filter="url(#rough2)">每回合只取决于 (x, y)：局面是确定的，直接模拟即可</text>
</svg>
