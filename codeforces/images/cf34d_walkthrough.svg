<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="359"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="330" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">D：为什么“重新建图 + 从新根 BFS”就对了</text>
  <path d="M 160 42 Q 380 47 600 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <rect x="40" y="70" width="330" height="120" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="94" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">第一步：还原无向树</text>
  <text x="52" y="118" font-size="10.5" fill="#3c5e88" filter="url(#rough2)">输入给了每个城市 i ≠ r1 的父亲 p(i)</text>
  <text x="52" y="140" font-size="10.5" fill="#3c5e88" filter="url(#rough2)">把每条 (p(i), i) 加成双向边</text>
  <text x="52" y="162" font-size="10.5" fill="#3c5e88" filter="url(#rough2)">就得到整棵树的邻接表（n−1 条边）</text>
  <text x="52" y="182" font-size="10" fill="#8c3a36" filter="url(#rough2)">原来的方向只是"以 r1 为根"时的视角</text>

  <rect x="392" y="70" width="328" height="120" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="404" y="94" font-size="11.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">第二步：从 r2 出发 BFS</text>
  <text x="404" y="118" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">BFS 时第一次访问到 v 的那个点 u</text>
  <text x="404" y="140" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">就是 v 在新树里的父亲</text>
  <text x="404" y="162" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">（因为树上从 r2 到 v 唯一路径上</text>
  <text x="404" y="182" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">的倒数第二个点，正是它的父亲）</text>

  <rect x="40" y="204" width="680" height="52" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="228" font-size="11" fill="#8a6015" filter="url(#rough2)">输出：按编号 1..n 递增，跳过新首都 r2，依次打印每个点的父亲 —— 共 n−1 个数。</text>
  <text x="52" y="248" font-size="10" fill="#7a5a1b" filter="url(#rough2)">复杂度 O(n)：邻接表 n−1 条边，BFS 每个点进出一次；n ≤ 5·10^4 时不到 1 ms。</text>

  <rect x="40" y="270" width="680" height="46" rx="10" fill="#fdeceb" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="52" y="292" font-size="10.5" fill="#8c3a36" filter="url(#rough2)">易错：不要试图"把父亲数组整体搬过去"。换根后，只有 r2 到 r1 这条路径上的边的方向会翻转，</text>
  <text x="52" y="310" font-size="10.5" fill="#8c3a36" filter="url(#rough2)">其余子树内部的父子关系保持不变；BFS 写法最省心。</text>
</svg>
