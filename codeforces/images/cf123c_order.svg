<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="151"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="360" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">比较顺序 = 按「反对角线最小优先级」排序后的字典序</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">同一反对角线上的格子同值，所以差异位置是整条线；比较规则就取 p_d 最小的那条</text>
  <text x="150" y="100" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">反对角线 d</text>
  <text x="330" y="100" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">线上格子（优先级）</text>
  <text x="640" y="100" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">p_d</text>
  <text x="760" y="100" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">排序后第几位</text>
  <g filter="url(#rough2)"><rect x="80" y="116" width="140" height="26" rx="3" fill="#ffffff" fill-opacity="0.25" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="150" y="134" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="240" y="116" width="340" height="26" rx="3" fill="#ffffff" fill-opacity="0.25" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="410" y="134" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">(1,1)=3</text>
  <text x="640" y="134" text-anchor="middle" font-size="12" fill="#b06a1e" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="760" y="134" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="80" y="150" width="140" height="26" rx="3" fill="#ffffff" fill-opacity="0.25" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="150" y="168" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="240" y="150" width="340" height="26" rx="3" fill="#ffffff" fill-opacity="0.25" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="410" y="168" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">(1,2)=6, (2,1)=1</text>
  <text x="640" y="168" text-anchor="middle" font-size="12" fill="#b06a1e" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="760" y="168" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="80" y="184" width="140" height="26" rx="3" fill="#ffffff" fill-opacity="0.25" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="150" y="202" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><rect x="240" y="184" width="340" height="26" rx="3" fill="#ffffff" fill-opacity="0.25" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="410" y="202" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">(2,2)=4, (3,1)=2</text>
  <text x="640" y="202" text-anchor="middle" font-size="12" fill="#b06a1e" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="760" y="202" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="80" y="218" width="140" height="26" rx="3" fill="#ffffff" fill-opacity="0.25" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="150" y="236" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <g filter="url(#rough2)"><rect x="240" y="218" width="340" height="26" rx="3" fill="#ffffff" fill-opacity="0.25" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="410" y="236" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">(3,2)=5</text>
  <text x="640" y="236" text-anchor="middle" font-size="12" fill="#b06a1e" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="760" y="236" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="450" y="280" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">排序后依次确定：d = 3 → 4 → 2 → 5</text>
  <text x="450" y="308" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">每一步先试 '('，数「剩余还有多少合法括号序列」：</text>
  <text x="450" y="330" text-anchor="middle" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">count ≥ k 就取 '('，否则取 ')' 并令 k ← k − count</text>
</svg>
