<svg xmlns="http://www.w3.org/2000/svg" width="780" height="372" viewBox="0 0 780 372"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="780" height="372" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">归并后的全局时间轴：READ 读到「它前面最后一个 WRITE 的时间戳」</text>
  <path d="M 96 42 Q 390 50 684 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 一条具体的归并：t0 s0 s1 t1 s2 t2 -->
  <text x="163" y="66" font-size="12" fill="#446688" filter="url(#rough2)">蓝色 = 来自 s，橙色 = 来自 t；粗框 = W（写）</text>

  <!-- 位置号 -->
  <text x="191" y="92" text-anchor="middle" font-size="11" fill="#7a7a7a" filter="url(#rough2)">1</text>
  <text x="271" y="92" text-anchor="middle" font-size="11" fill="#7a7a7a" filter="url(#rough2)">2</text>
  <text x="351" y="92" text-anchor="middle" font-size="11" fill="#7a7a7a" filter="url(#rough2)">3</text>
  <text x="431" y="92" text-anchor="middle" font-size="11" fill="#7a7a7a" filter="url(#rough2)">4</text>
  <text x="511" y="92" text-anchor="middle" font-size="11" fill="#7a7a7a" filter="url(#rough2)">5</text>
  <text x="591" y="92" text-anchor="middle" font-size="11" fill="#7a7a7a" filter="url(#rough2)">6</text>

  <!-- t0 = R -->
  <rect x="163" y="100" width="56" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="191" y="130" text-anchor="middle" font-size="21" fill="#8a6015" filter="url(#rough2)">R</text>
  <text x="191" y="143" text-anchor="middle" font-size="9" fill="#8a6015" filter="url(#rough2)">t0</text>
  <!-- s0 = W -->
  <rect x="243" y="100" width="56" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2.6" filter="url(#rough2)"/>
  <text x="271" y="130" text-anchor="middle" font-size="21" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">W</text>
  <text x="271" y="143" text-anchor="middle" font-size="9" fill="#2f4a66" filter="url(#rough2)">s0</text>
  <!-- s1 = R -->
  <rect x="323" y="100" width="56" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="351" y="130" text-anchor="middle" font-size="21" fill="#2f4a66" filter="url(#rough2)">R</text>
  <text x="351" y="143" text-anchor="middle" font-size="9" fill="#2f4a66" filter="url(#rough2)">s1</text>
  <!-- t1 = W -->
  <rect x="403" y="100" width="56" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.6" filter="url(#rough2)"/>
  <text x="431" y="130" text-anchor="middle" font-size="21" font-weight="bold" fill="#8a6015" filter="url(#rough2)">W</text>
  <text x="431" y="143" text-anchor="middle" font-size="9" fill="#8a6015" filter="url(#rough2)">t1</text>
  <!-- s2 = W -->
  <rect x="483" y="100" width="56" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2.6" filter="url(#rough2)"/>
  <text x="511" y="130" text-anchor="middle" font-size="21" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">W</text>
  <text x="511" y="143" text-anchor="middle" font-size="9" fill="#2f4a66" filter="url(#rough2)">s2</text>
  <!-- t2 = R -->
  <rect x="563" y="100" width="56" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="591" y="130" text-anchor="middle" font-size="21" fill="#8a6015" filter="url(#rough2)">R</text>
  <text x="591" y="143" text-anchor="middle" font-size="9" fill="#8a6015" filter="url(#rough2)">t2</text>

  <!-- 读值标注 -->
  <path d="M 191 150 L 191 176" stroke="#b85450" stroke-width="1.7" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="199" y="192" font-size="12" fill="#a14340" filter="url(#rough2)">读到 0（前面没有 W）</text>

  <path d="M 351 152 Q 311 196 279 150" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="357" y="192" font-size="12" fill="#a14340" filter="url(#rough2)">读到 2</text>

  <path d="M 591 152 Q 551 196 519 150" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="597" y="192" font-size="12" fill="#a14340" filter="url(#rough2)">读到 4</text>

  <!-- 说明框 -->
  <rect x="58" y="212" width="664" height="132" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="72" y="238" font-size="12.5" font-weight="bold" fill="#2f5d22" filter="url(#rough2)">关键问题：READ 前面到底「已经执行了哪些命令」？</text>
  <text x="72" y="262" font-size="12" fill="#2f5d22" filter="url(#rough2)">对 s[i] 这个 READ：s 的前缀 s[0..i-1] 必须全部执行完（顺序固定），</text>
  <text x="72" y="284" font-size="12" fill="#2f5d22" filter="url(#rough2)">而 t 只需执行到一个前缀 t[0..x-1]，x 可以取 0..m 中的任意值。</text>
  <text x="72" y="306" font-size="12" fill="#2f5d22" filter="url(#rough2)">所以「最后一次写」只能来自两个位置：s 侧前缀的最后一个 W，或 t 侧前缀的最后一个 W；</text>
  <text x="72" y="328" font-size="12" fill="#2f5d22" filter="url(#rough2)">把它摆在哪个时间戳，就是我们可以自由控制的量 —— 这就是后面两类候选区间的来源。</text>

  <text x="58" y="362" font-size="11" fill="#7a7a7a" filter="url(#rough2)">上图是 s = WRW、t = RWR 的一个具体归并 t0 s0 s1 t1 s2 t2（全局串 R W R W W R）。</text>
</svg>
