<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr67f" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="330" fill="#fafafa"/>
  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">最优脚本的规范形：删 → 换 → 替 → 插</text>
  <path d="M 130 42 Q 360 48 590 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 四步流水线 -->
  <g filter="url(#rough2)">
    <rect x="30" y="70" width="148" height="66" rx="10" fill="#fde8e6" stroke="#b85450" stroke-width="1.7"/>
    <rect x="202" y="70" width="148" height="66" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.7"/>
    <rect x="374" y="70" width="148" height="66" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7"/>
    <rect x="546" y="70" width="148" height="66" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7"/>
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle" filter="url(#rough2)">
    <text x="104" y="96" fill="#8a2b28">① 删除</text>
    <text x="276" y="96" fill="#2f4a66">② 交换</text>
    <text x="448" y="96" fill="#7a5a1b">③ 替换</text>
    <text x="620" y="96" fill="#2f5223">④ 插入</text>
  </g>
  <g font-size="11" text-anchor="middle" filter="url(#rough2)">
    <text x="104" y="118" fill="#8a2b28">删掉不要的字符</text>
    <text x="104" y="132" fill="#8a2b28">每个 t_d</text>
    <text x="276" y="118" fill="#2f4a66">不相交的相邻对</text>
    <text x="276" y="132" fill="#2f4a66">每对 t_e</text>
    <text x="448" y="118" fill="#7a5a1b">改动字符的值</text>
    <text x="448" y="132" fill="#7a5a1b">每个 t_r</text>
    <text x="620" y="118" fill="#2f5223">补出剩下的字符</text>
    <text x="620" y="132" fill="#2f5223">每个 t_i</text>
  </g>
  <path d="M 178 103 L 200 103" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr67f)" filter="url(#rough2)"/>
  <path d="M 350 103 L 372 103" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr67f)" filter="url(#rough2)"/>
  <path d="M 522 103 L 544 103" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr67f)" filter="url(#rough2)"/>

  <text x="30" y="168" font-size="12" fill="#2b2b2b" filter="url(#rough2)">代价 = 删除数 × t_d + 交换对数 × t_e + 替换数 × t_r + 插入数 × t_i，四类操作互不重叠</text>

  <!-- 关键示例 -->
  <g filter="url(#rough2)">
    <rect x="30" y="190" width="300" height="112" rx="10" fill="#f4f0fa" stroke="#7a4a8a" stroke-width="1.5"/>
  </g>
  <text x="46" y="214" font-size="13" font-weight="bold" fill="#5a3a6a" filter="url(#rough2)">xmy → yx（t_i=t_d=t_e=1, t_r=100）</text>
  <text x="46" y="240" font-size="12" fill="#5a3a6a" filter="url(#rough2)">① 删掉 m（1）：x y</text>
  <text x="46" y="262" font-size="12" fill="#5a3a6a" filter="url(#rough2)">② 交换 x,y（1）：y x</text>
  <text x="46" y="284" font-size="12" fill="#5a3a6a" filter="url(#rough2)">总代价 2 —— 交换"跨过"了一个被删的字符</text>

  <g filter="url(#rough2)">
    <rect x="360" y="190" width="334" height="112" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="376" y="214" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">规范化不改变代价</text>
  <text x="376" y="240" font-size="11.5" fill="#2f5223" filter="url(#rough2)">删除可以提前：交换的两个字符之间不会有存活的字符</text>
  <text x="376" y="262" font-size="11.5" fill="#2f5223" filter="url(#rough2)">替换可以后置：先换位、再在落点上替换，等价</text>
  <text x="376" y="284" font-size="11.5" fill="#2f5223" filter="url(#rough2)">插入可以后置：插入不改变已有字符的相对次序</text>
</svg>
