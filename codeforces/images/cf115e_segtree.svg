<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1171"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="760" height="340" fill="#fafafa"/>
  <text x="380.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">线段树维护 g[j]</text>
  <path d="M 121.60000000000001 42 Q 380.0 48 638.4 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="380.0" y="326" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">j = 当前修的路段左端；g[j] = f[j−1] − 修路花费 + 可举办比赛收入</text>
  <line x1="80" y1="120" x2="700" y2="120" stroke="#333333" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="110" y="95" width="70" height="50" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="145" y="127" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">j=1</text>
  <rect x="200" y="95" width="70" height="50" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="235" y="127" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">j=2</text>
  <rect x="290" y="95" width="70" height="50" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="325" y="127" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">j=3</text>
  <rect x="380" y="95" width="70" height="50" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="415" y="127" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">j=4</text>
  <rect x="470" y="95" width="70" height="50" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="505" y="127" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">j=5</text>
  <rect x="560" y="95" width="70" height="50" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="595" y="127" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">j=6</text>
  <rect x="650" y="95" width="70" height="50" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="685" y="127" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">j=7</text>
  <line x1="110.0" y1="90.0" x2="620.0" y2="90.0" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="265" y="78" text-anchor="start" font-size="11" fill="#8c2f2c" filter="url(#rough2)">每前进一步：全体 −c[i]（延长）</text>
  <line x1="620.0" y1="165.0" x2="320.0" y2="165.0" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="470" y="185" text-anchor="start" font-size="11" fill="#2f5223" filter="url(#rough2)">以 i 结尾的比赛：对 j ≤ lb 加 p</text>
  <text x="380" y="230" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">第 i 步：① 全体减 c[i] ② 新候选 g[i] = f[i−1] − c[i]</text>
  <text x="380" y="258" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">③ 对 ub=i 的比赛在 [1, lb] 上加 p ④ f[i] = max(f[i−1], 全局最大值)</text>
  <text x="380" y="292" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">区间加 + 全局最大值：懒标记线段树 O((n+m) log n)</text>
</svg>
