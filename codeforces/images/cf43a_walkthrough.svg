<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2b2b2b"/>
    </marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arra" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="760" height="440" fill="#fafafa"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2：五行记录与滚动计数</text>
  <path d="M 220 44 Q 380 50 540 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="40" y="64" width="118" height="58" rx="0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="99" y="82" text-anchor="middle" font-size="9" fill="#8a8a8a" filter="url(#rough2)">第 1 行</text>
  <text x="99" y="110" text-anchor="middle" font-size="17" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">A</text>
  <text x="99" y="152" text-anchor="middle" font-size="10.5" fill="#8a8a8a" filter="url(#rough2)">A 1 · ABA 0</text>
  <rect x="182" y="64" width="118" height="58" rx="0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="241" y="82" text-anchor="middle" font-size="9" fill="#8a8a8a" filter="url(#rough2)">第 2 行</text>
  <text x="241" y="110" text-anchor="middle" font-size="17" font-weight="bold" fill="#446688" filter="url(#rough2)">ABA</text>
  <text x="241" y="152" text-anchor="middle" font-size="10.5" fill="#8a8a8a" filter="url(#rough2)">A 1 · ABA 1</text>
  <rect x="324" y="64" width="118" height="58" rx="0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="383" y="82" text-anchor="middle" font-size="9" fill="#8a8a8a" filter="url(#rough2)">第 3 行</text>
  <text x="383" y="110" text-anchor="middle" font-size="17" font-weight="bold" fill="#446688" filter="url(#rough2)">ABA</text>
  <text x="383" y="152" text-anchor="middle" font-size="10.5" fill="#8a8a8a" filter="url(#rough2)">A 1 · ABA 2</text>
  <rect x="466" y="64" width="118" height="58" rx="0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="525" y="82" text-anchor="middle" font-size="9" fill="#8a8a8a" filter="url(#rough2)">第 4 行</text>
  <text x="525" y="110" text-anchor="middle" font-size="17" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">A</text>
  <text x="525" y="152" text-anchor="middle" font-size="10.5" fill="#8a8a8a" filter="url(#rough2)">A 2 · ABA 2</text>
  <rect x="608" y="64" width="118" height="58" rx="0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="667" y="82" text-anchor="middle" font-size="9" fill="#8a8a8a" filter="url(#rough2)">第 5 行</text>
  <text x="667" y="110" text-anchor="middle" font-size="17" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">A</text>
  <text x="667" y="152" text-anchor="middle" font-size="10.5" fill="#8a8a8a" filter="url(#rough2)">A 3 · ABA 2</text>
  <text x="80" y="250" text-anchor="start" font-size="16" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">A</text>
  <rect x="132" y="226" width="240" height="34" rx="0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="384" y="250" text-anchor="start" font-size="16" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <text x="80" y="322" text-anchor="start" font-size="16" font-weight="bold" fill="#446688" filter="url(#rough2)">ABA</text>
  <rect x="132" y="298" width="160" height="34" rx="0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="304" y="322" text-anchor="start" font-size="16" font-weight="bold" fill="#446688" filter="url(#rough2)">2</text>
  <text x="520" y="258" text-anchor="start" font-size="13" fill="#8a8a8a" filter="url(#rough2)">最终计数</text>
  <text x="520" y="282" text-anchor="start" font-size="13" fill="#2b2b2b" filter="url(#rough2)">A = 3，ABA = 2</text>
  <text x="520" y="306" text-anchor="start" font-size="13" fill="#2b2b2b" filter="url(#rough2)">严格最大者为胜</text>
  <text x="380" y="402" text-anchor="middle" font-size="12.5" fill="#8a8a8a" filter="url(#rough2)">第 4 行时两队都是 2，代码用严格大于保持稳定；第 5 行 A 反超</text>
</svg>
