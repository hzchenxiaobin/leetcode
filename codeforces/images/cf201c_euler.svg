<svg xmlns="http://www.w3.org/2000/svg" width="720" height="370" viewBox="0 0 720 370"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="370" fill="#fafafa"/>
  <text x="360.0" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">201C：走法 = 多重图上的欧拉迹</text>
  <path d="M 144.00 46 Q 360.0 52 576.00 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="70" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">把每座桥看成一条边，“过桥次数”就是这条边在走法里被用的次数 c_i。</text>
  <text x="60" y="90" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">一条从 s 到 t 的走法 = 这张多重图里的一条欧拉迹（s、t 是仅有的两个奇度点）。</text>
  <circle cx="110" cy="160" r="16" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="110" y="165" text-anchor="middle" font-size="11" fill="#33506e" filter="url(#rough2)">1</text>
  <circle cx="220" cy="160" r="16" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="220" y="165" text-anchor="middle" font-size="11" fill="#33506e" filter="url(#rough2)">2</text>
  <circle cx="330" cy="160" r="16" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="330" y="165" text-anchor="middle" font-size="11" fill="#33506e" filter="url(#rough2)">3</text>
  <circle cx="440" cy="160" r="16" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="440" y="165" text-anchor="middle" font-size="11" fill="#33506e" filter="url(#rough2)">4</text>
  <circle cx="550" cy="160" r="16" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="550" y="165" text-anchor="middle" font-size="11" fill="#33506e" filter="url(#rough2)">5</text>
  <line x1="126" y1="160" x2="204" y2="160" stroke="#5b8c5a" stroke-width="2" filter="url(#rough2)"/>
  <text x="165.0" y="148" text-anchor="middle" font-size="10" fill="#2f5b34" filter="url(#rough2)">c₁=2</text>
  <line x1="236" y1="160" x2="314" y2="160" stroke="#5b8c5a" stroke-width="2" filter="url(#rough2)"/>
  <text x="275.0" y="148" text-anchor="middle" font-size="10" fill="#2f5b34" filter="url(#rough2)">c₂=3</text>
  <line x1="346" y1="160" x2="424" y2="160" stroke="#5b8c5a" stroke-width="2" filter="url(#rough2)"/>
  <text x="385.0" y="148" text-anchor="middle" font-size="10" fill="#2f5b34" filter="url(#rough2)">c₃=2</text>
  <line x1="456" y1="160" x2="534" y2="160" stroke="#5b8c5a" stroke-width="2" filter="url(#rough2)"/>
  <text x="495.0" y="148" text-anchor="middle" font-size="10" fill="#2f5b34" filter="url(#rough2)">c₄=0</text>
  <text x="110" y="196" text-anchor="middle" font-size="12" fill="#8a3a52" font-weight="bold" filter="url(#rough2)">s</text>
  <text x="330" y="196" text-anchor="middle" font-size="12" fill="#8a3a52" font-weight="bold" filter="url(#rough2)">t</text>
  <text x="440" y="196" text-anchor="start" font-size="10" fill="#8a3a52" filter="url(#rough2)">终点在 3：桥 4 没走过</text>
  <rect x="60" y="216" width="620" height="56" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="234" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">度数：点 1 是 c₁=2（偶），点 2 是 c₁+c₂=5（奇），点 3 是 c₂+c₃=5（奇），点 4 是 c₃+c₄=2（偶）。</text>
  <text x="74" y="256" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">奇度点恰为 s=2 与 t=3 ⇒ 存在欧拉迹；总得分 = Σc_i = 7。</text>
  <rect x="60" y="286" width="620" height="56" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="304" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">反过来，任意给定 c_i（满足奇偶与“区间内 ≥1”），都有欧拉迹 ⇒ 每座桥都可以独立地取到最大可用次数。</text>
</svg>
