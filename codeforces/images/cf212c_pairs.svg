<svg xmlns="http://www.w3.org/2000/svg" width="730" height="300" viewBox="0 0 730 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="730" height="300" fill="#fafafa"/>
  <text x="365.0" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">212C：一秒变换 = 同时翻转所有相邻的 AB</text>
  <path d="M 146.00 46 Q 365.0 52 584.00 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60" y="78" width="290" height="132" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="95" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">若 i 处是 A 且 i+1 处是 B，两者互指</text>
  <text x="74" y="116" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">下一秒同时变成 BA；其它人不动</text>
  <text x="74" y="137" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">两个 AB 不可能相邻（否则中间那位</text>
  <text x="74" y="158" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">要同时是 B 和 A），故可同时翻转</text>
  <rect x="380" y="78" width="290" height="132" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="394" y="95" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">要求“上一秒状态 t 使 T(t)=s”</text>
  <text x="394" y="116" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">即选一组互不相邻的位置 P 作为 AB 对</text>
  <text x="394" y="137" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">i∈P：s[i]=B, s[i+1]=A；</text>
  <text x="394" y="158" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">且不能出现计划外的 AB</text>
  <text x="60" y="200" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">在环上做 DP：状态只需记前一位是否属于 P，枚举第 0 位是否属于 P 处理环。</text>
</svg>
