<svg xmlns="http://www.w3.org/2000/svg" width="740" height="420" viewBox="0 0 740 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="139"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="740" height="420" fill="#fafafa"/>
  <text x="370" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">把数组看成直方图：每层是一个区间，下降处必须关掉若干层</text>
  <path d="M 180 46 Q 370 52 560 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="90" y="284" width="58" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="119.0" y="350" text-anchor="middle" font-size="10" font-weight="normal" fill="#555" filter="url(#rough2)">i=1</text>
  <text x="119.0" y="276" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">1</text>
  <rect x="164" y="238" width="58" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="193.0" y="350" text-anchor="middle" font-size="10" font-weight="normal" fill="#555" filter="url(#rough2)">i=2</text>
  <text x="193.0" y="230" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">2</text>
  <rect x="238" y="284" width="58" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="267.0" y="350" text-anchor="middle" font-size="10" font-weight="normal" fill="#555" filter="url(#rough2)">i=3</text>
  <text x="267.0" y="276" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">1</text>
  <rect x="312" y="284" width="58" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="341.0" y="350" text-anchor="middle" font-size="10" font-weight="normal" fill="#555" filter="url(#rough2)">i=4</text>
  <text x="341.0" y="276" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">1</text>
  <rect x="386" y="146" width="58" height="184" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="415.0" y="350" text-anchor="middle" font-size="10" font-weight="normal" fill="#555" filter="url(#rough2)">i=5</text>
  <text x="415.0" y="138" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">4</text>
  <rect x="460" y="284" width="58" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="489.0" y="350" text-anchor="middle" font-size="10" font-weight="normal" fill="#555" filter="url(#rough2)">i=6</text>
  <text x="489.0" y="276" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">1</text>
  <line x1="76" y1="330" x2="528" y2="330" stroke="#2b2b2b" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="90" y="70" width="428" height="16" rx="6" fill="#e6f4ea" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="94" y="64" text-anchor="start" font-size="10" font-weight="normal" fill="#555" filter="url(#rough2)">[1,6]</text>
  <rect x="164" y="196" width="58" height="16" rx="6" fill="#fff8e1" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="168" y="190" text-anchor="start" font-size="10" font-weight="normal" fill="#555" filter="url(#rough2)">[2,2]</text>
  <rect x="386" y="230" width="58" height="16" rx="6" fill="#fde9d9" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="390" y="224" text-anchor="start" font-size="10" font-weight="normal" fill="#555" filter="url(#rough2)">[5,5]</text>
  <text x="514" y="74" text-anchor="end" font-size="10" font-weight="normal" fill="#4a7a3a" filter="url(#rough2)">整段 1 次</text>
  <text x="204" y="132" text-anchor="start" font-size="10" font-weight="normal" fill="#8a6015" filter="url(#rough2)">i=2 处上升 → 新开 1 层，区间 [2,2]</text>
  <text x="356" y="166" text-anchor="start" font-size="10" font-weight="normal" fill="#b85450" filter="url(#rough2)">i=5 处上升 3 → 新开 3 层，都在 [5,5] 结束</text>
  <rect x="60" y="366" width="620" height="44" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="74" y="388" text-anchor="start" font-size="10.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">次数 = a₁ + Σ max(0, aᵢ − aᵢ₋₁) = 1 + (1+3) = 5；每个上升处都必须新开一层，每个下降处关掉若干层。</text>
  <text x="74" y="404" text-anchor="start" font-size="10.5" font-weight="normal" fill="#7a5a1b" filter="url(#rough2)">构造：用栈记录"未关闭的层"及其起点，下降时 pop 出对应层数并输出区间。</text>
</svg>
