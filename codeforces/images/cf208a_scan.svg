<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="320" fill="#fafafa"/>
  <text x="360.0" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">208A：逐字符扫描的流程</text>
  <path d="M 144.00 46 Q 360.0 52 576.00 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60" y="86" width="180" height="56" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="104" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">i 指向当前字符</text>
  <rect x="280" y="72" width="200" height="52" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="294" y="90" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">s[i..i+2] == WUB ?</text>
  <rect x="280" y="146" width="200" height="52" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="294" y="164" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">否则吃到下一个 WUB</text>
  <rect x="520" y="86" width="170" height="100" rx="9" fill="#fdeef1" stroke="#c0708a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="534" y="103" text-anchor="start" font-size="11" fill="#8a3a52" filter="url(#rough2)">是：i += 3</text>
  <text x="534" y="124" text-anchor="start" font-size="11" fill="#8a3a52" filter="url(#rough2)">    （跳过分隔符）</text>
  <text x="534" y="145" text-anchor="start" font-size="11" fill="#8a3a52" filter="url(#rough2)">否：截出一段词，</text>
  <text x="534" y="166" text-anchor="start" font-size="11" fill="#8a3a52" filter="url(#rough2)">    加入答案</text>
  <path d="M 244 110 L 276 98" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 244 120 L 276 168" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 484 98 L 516 120" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 484 172 L 516 150" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="60" y="270" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">两种写法（逐字符 / split）等价，输出用空格连接非空段。</text>
</svg>
