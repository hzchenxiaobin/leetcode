  <text x="414.0" y="322.0" text-anchor="start" font-size="12" fill="#3f3420" filter="url(#rough2)">= 落点与起点的链内距离</text>
  <text x="40.0" y="440.0" text-anchor="start" font-size="12.5" fill="#444" filter="url(#rough2)">h=10, m=2 时，哈希为 0 的对象只能落在 0、2、4、6、8 这五个格子里。</text>
