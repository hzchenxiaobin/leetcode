<svg xmlns="http://www.w3.org/2000/svg" width="720" height="410" viewBox="0 0 720 410"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="720" height="410" fill="#fafafa"/>
  <text x="360.0" y="33" font-size="20" font-weight="bold" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">两个样例：d = 0 与 d = 24</text>
  <path d="M 261 44 Q 360.0 50 459 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="30" y="80" width="300" height="260" rx="8" fill="#eef4fb" stroke="#9aa8b8" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="46" y="106" font-size="11" font-weight="bold" fill="#2b2b2b" text-anchor="start" filter="url(#rough2)">样例 1：2×2，馅饼在 (1,2)</text>
  <rect x="90" y="140" width="50" height="50" rx="0" fill="#ffffff" stroke="#7a8b9a" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="140" y="140" width="50" height="50" rx="0" fill="#ffffff" stroke="#7a8b9a" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="90" y="190" width="50" height="50" rx="0" fill="#ffffff" stroke="#7a8b9a" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="140" y="190" width="50" height="50" rx="0" fill="#ffffff" stroke="#7a8b9a" stroke-width="1.1" filter="url(#rough2)"/>
  <circle cx="165.0" cy="165.0" r="8" fill="#b85450" filter="url(#rough2)"/>
  <text x="165.0" y="262" font-size="10" font-weight="normal" fill="#7a3b36" text-anchor="middle" filter="url(#rough2)">(1,2)</text>
  <g filter="url(#rough2)">
    <path d="M 165.0 165.0 L 243.0 160" stroke="#b85450" stroke-width="1.6" fill="none"/>
    <polygon points="243.0,160 238.0,151 248.0,151" fill="#b85450"/>
  </g>
  <text x="248.0" y="154" font-size="10" font-weight="bold" fill="#7a3b36" text-anchor="middle" filter="url(#rough2)">直接移出</text>
  <text x="180" y="320" font-size="12" font-weight="bold" fill="#2f5223" text-anchor="middle" filter="url(#rough2)">d = 0 ≤ 4 → YES</text>
  <rect x="370" y="80" width="320" height="260" rx="8" fill="#fbf6ea" stroke="#b08a2e" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="386" y="106" font-size="11" font-weight="bold" fill="#5b4a2a" text-anchor="start" filter="url(#rough2)">样例 3：100×50，馅饼在 (50,25)</text>
  <rect x="410" y="130" width="240" height="120" rx="0" fill="#ffffff" stroke="#7a8b9a" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="530" cy="190" r="8" fill="#b85450" filter="url(#rough2)"/>
  <text x="530" y="196" font-size="10" font-weight="bold" fill="#7a3b36" text-anchor="middle" filter="url(#rough2)">d = 24</text>
  <path d="M 410 130 L 410 250" stroke="#c9d4e0" stroke-width="0.8" fill="none" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <path d="M 416 130 L 416 250" stroke="#c9d4e0" stroke-width="0.8" fill="none" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <path d="M 422 130 L 422 250" stroke="#c9d4e0" stroke-width="0.8" fill="none" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <path d="M 428 130 L 428 250" stroke="#c9d4e0" stroke-width="0.8" fill="none" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <text x="530" y="290" font-size="10.5" font-weight="normal" fill="#5b4a2a" text-anchor="middle" filter="url(#rough2)">Vlad 有 24 轮预封四个角</text>
  <text x="530" y="310" font-size="12" font-weight="bold" fill="#7a3b36" text-anchor="middle" filter="url(#rough2)">d = 24 ≥ 5 → NO</text>
  <text x="360" y="372" font-size="11" font-weight="normal" fill="#666" text-anchor="middle" filter="url(#rough2)">样例 2（k=0）没有任何馅饼，也直接输出 NO</text>
</svg>
