<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ak" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">固定 k 后：在矩形 [0,a]×[0,b] 内数 i+2j=rest 的整点</text>
  <path d="M 110 42 Q 360 48 610 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 坐标轴：i 向右 0..5，j 向上 0..5，每格 52px -->
  <g filter="url(#rough2)">
    <line x1="70" y1="350" x2="400" y2="350" stroke="#2b2b2b" stroke-width="1.8" marker-end="url(#ak)"/>
    <line x1="70" y1="350" x2="70" y2="82" stroke="#2b2b2b" stroke-width="1.8" marker-end="url(#ak)"/>
    <text x="404" y="356" font-size="13" fill="#2b2b2b">i</text>
    <text x="58" y="76" font-size="13" fill="#2b2b2b">j</text>

    <!-- 矩形 [0,a]x[0,b] -->
    <rect x="70" y="128" width="260" height="222" fill="#e8f0fe" fill-opacity="0.55" stroke="#446688" stroke-width="1.6" stroke-dasharray="6 4"/>
    <text x="200" y="122" text-anchor="middle" font-size="11.5" fill="#2f4a66">库存矩形：0 ≤ i ≤ a=5，0 ≤ j ≤ b=5</text>

    <!-- 刻度 -->
    <g font-size="11" fill="#555">
      <text x="70" y="368" text-anchor="middle">0</text>
      <text x="122" y="368" text-anchor="middle">1</text>
      <text x="174" y="368" text-anchor="middle">2</text>
      <text x="226" y="368" text-anchor="middle">3</text>
      <text x="278" y="368" text-anchor="middle">4</text>
      <text x="330" y="368" text-anchor="middle">5</text>
      <text x="56" y="354" text-anchor="end">0</text>
      <text x="56" y="302" text-anchor="end">1</text>
      <text x="56" y="250" text-anchor="end">2</text>
      <text x="56" y="198" text-anchor="end">3</text>
      <text x="56" y="146" text-anchor="end">4</text>
      <text x="56" y="94" text-anchor="end">5</text>
    </g>

    <!-- 网格 -->
    <g stroke="#c8d4e0" stroke-width="0.9">
      <line x1="122" y1="128" x2="122" y2="350"/>
      <line x1="174" y1="128" x2="174" y2="350"/>
      <line x1="226" y1="128" x2="226" y2="350"/>
      <line x1="278" y1="128" x2="278" y2="350"/>
      <line x1="330" y1="128" x2="330" y2="350"/>
      <line x1="70" y1="302" x2="330" y2="302"/>
      <line x1="70" y1="250" x2="330" y2="250"/>
      <line x1="70" y1="198" x2="330" y2="198"/>
      <line x1="70" y1="146" x2="330" y2="146"/>
      <line x1="70" y1="94" x2="330" y2="94"/>
    </g>

    <!-- 直线 i + 2j = 12 在矩形内的部分：(2,5) (4,4) -->
    <line x1="174" y1="94" x2="278" y2="146" stroke="#b85450" stroke-width="2.2"/>
    <text x="286" y="96" font-size="12" fill="#8f3a34">i+2j = rest = 12</text>

    <!-- 合法整点 -->
    <circle cx="174" cy="94" r="6" fill="#4a7a3a" stroke="#2f5223" stroke-width="1.4"/>
    <circle cx="278" cy="146" r="6" fill="#4a7a3a" stroke="#2f5223" stroke-width="1.4"/>
    <text x="186" y="86" font-size="11.5" fill="#2f5223">(2,5)</text>
    <text x="292" y="150" font-size="11.5" fill="#2f5223">(4,4)</text>

    <!-- 非法整点（i 与 rest 异奇偶） -->
    <circle cx="226" cy="120" r="5" fill="#ffffff" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3 2"/>

    <!-- i 的可行区间投影 -->
    <line x1="174" y1="386" x2="278" y2="386" stroke="#4a7a3a" stroke-width="2.4"/>
    <line x1="174" y1="380" x2="174" y2="392" stroke="#4a7a3a" stroke-width="1.6"/>
    <line x1="278" y1="380" x2="278" y2="392" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="226" y="406" text-anchor="middle" font-size="11.5" fill="#2f5223">i ∈ [lo, hi]，只取与 rest 同奇偶的值（空心点被跳过）</text>
  </g>

  <!-- 右侧公式 -->
  <g filter="url(#rough2)">
    <rect x="428" y="80" width="266" height="140" rx="12" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="444" y="108" font-size="13" font-weight="bold" fill="#2f5223">整数区间计数</text>
    <text x="444" y="134" font-size="12" fill="#2b2b2b">lo = max(0, rest−2b)</text>
    <text x="444" y="156" font-size="12" fill="#2b2b2b">hi = min(a, rest)</text>
    <text x="444" y="178" font-size="12" fill="#2b2b2b">把 lo 调到与 rest 同奇偶</text>
    <text x="444" y="202" font-size="12.5" font-weight="bold" fill="#2f5223">个数 = (hi−lo)/2 + 1</text>

    <rect x="428" y="240" width="266" height="128" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="444" y="268" font-size="12.5" font-weight="bold" fill="#8a6015">为什么能裁剪</text>
    <text x="444" y="292" font-size="11.5" fill="#7a5a1b">rest 太大：i ≤ a 卡住上界；</text>
    <text x="444" y="312" font-size="11.5" fill="#7a5a1b">rest 太大时 j ≥ rest−2b 卡住下界；</text>
    <text x="444" y="332" font-size="11.5" fill="#7a5a1b">rest 为负：i+2j 不可能，直接 break。</text>
    <text x="444" y="356" font-size="11.5" fill="#7a5a1b">每轮 O(1)，总共 O(c) 轮。</text>
  </g>
</svg>
