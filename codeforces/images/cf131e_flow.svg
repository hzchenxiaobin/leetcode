  <line x1="537.5" y1="107.0" x2="547.5" y2="107.0" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <rect x="550.5" y="80" width="159.5" height="54" rx="7" fill="#fbeeee" stroke="#a05a5a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="630.25" y="112.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a05a5a" filter="url(#rough2)">统计 t0..t8</text>
