  <text x="109.75" y="123.0" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">(key,pos,idx)</text>
  <line x1="190.5" y1="107.0" x2="200.5" y2="107.0" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <rect x="203.5" y="80" width="159.5" height="54" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="283.25" y="112.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#5a7fb0" filter="url(#rough2)">各排序</text>
