<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>

  <rect width="720" height="380" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">样例 2：座位 1、3、5 构成正三角形</text>

  <circle cx="320" cy="205" r="112" fill="none" stroke="#c3d0dd" stroke-width="1.6"
          stroke-dasharray="4 5" filter="url(#rough2)"/>

  <polygon points="320,93 417,261 223,261" fill="#446688" fill-opacity="0.08" stroke="#446688"
           stroke-width="2" filter="url(#rough2)"/>

  <!-- 六个座位 -->
  <g filter="url(#rough2)">
    <circle cx="320" cy="93" r="10" fill="#8fbf6f" stroke="#3f6b2f" stroke-width="2"/>
    <circle cx="417" cy="149" r="10" fill="#e0a0a0" stroke="#a05050" stroke-width="2"/>
    <circle cx="417" cy="261" r="10" fill="#8fbf6f" stroke="#3f6b2f" stroke-width="2"/>
    <circle cx="320" cy="317" r="10" fill="#8fbf6f" stroke="#3f6b2f" stroke-width="2"/>
    <circle cx="223" cy="261" r="10" fill="#8fbf6f" stroke="#3f6b2f" stroke-width="2"/>
    <circle cx="223" cy="149" r="10" fill="#e0a0a0" stroke="#a05050" stroke-width="2"/>
  </g>
  <g font-size="14" fill="#2b3a4a" text-anchor="middle" filter="url(#rough2)">
    <text x="320" y="65">1</text>
    <text x="441" y="135">2</text>
    <text x="441" y="275">3</text>
    <text x="320" y="347">4</text>
    <text x="199" y="275">5</text>
    <text x="199" y="135">6</text>
  </g>

  <!-- 图例 -->
  <g filter="url(#rough2)">
    <circle cx="536" cy="78" r="7" fill="#8fbf6f" stroke="#3f6b2f" stroke-width="1.6"/>
    <text x="552" y="83" font-size="12" fill="#2f5223">好心情（1）</text>
    <circle cx="536" cy="106" r="7" fill="#e0a0a0" stroke="#a05050" stroke-width="1.6"/>
    <text x="552" y="111" font-size="12" fill="#7a2f2c">坏心情（0）</text>
    <line x1="526" y1="134" x2="546" y2="134" stroke="#446688" stroke-width="2.2"/>
    <text x="552" y="139" font-size="12" fill="#33475c">正三角形</text>
  </g>

  <text x="320" y="372" text-anchor="middle" font-size="12.5" fill="#4a4a4a" filter="url(#rough2)">p = 3 整除 n = 6，步长 d = n/p = 2；顶点恰为同余类 {1,3,5}</text>
</svg>
