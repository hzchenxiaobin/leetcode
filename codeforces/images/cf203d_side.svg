<svg xmlns="http://www.w3.org/2000/svg" width="720" height="370" viewBox="0 0 720 370"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="370" fill="#fafafa"/>
  <text x="360.0" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">203D：走廊侧视图与球的起点</text>
  <path d="M 144.00 46 Q 360.0 52 576.00 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="70" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">侧视图（z 为高度、y 为离门的距离）：球从地板上 (a/2, m, 0) 出发，</text>
  <text x="60" y="90" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">速度 (vx, vy, vz)，vy &lt; 0 保证它最终会到达 y = 0 的门平面。</text>
  <line x1="90" y1="250" x2="600" y2="250" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <line x1="90" y1="150" x2="600" y2="150" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="610" y="254" text-anchor="start" font-size="10" fill="#33506e" filter="url(#rough2)">地板 z=0</text>
  <text x="610" y="154" text-anchor="start" font-size="10" fill="#33506e" filter="url(#rough2)">天花板 z=b</text>
  <line x1="90" y1="150" x2="90" y2="250" stroke="#c0708a" stroke-width="3" filter="url(#rough2)"/>
  <text x="78" y="270" text-anchor="start" font-size="10" fill="#8a3a52" filter="url(#rough2)">门 y=0</text>
  <circle cx="250" cy="248" r="6" fill="#f6e3a8" stroke="#c08a30" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="228" y="286" text-anchor="start" font-size="10" fill="#8a6015" filter="url(#rough2)">起点 (a/2, m, 0)</text>
  <path d="M 258 242 L 330 182" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="336" y="180" text-anchor="start" font-size="10" fill="#33506e" filter="url(#rough2)">vz &gt; 0 时向上飞</text>
  <path d="M 250 248 L 330 152 L 420 250 L 500 152 L 560 210" stroke="#5b8c5a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="430" y="290" text-anchor="start" font-size="10.5" fill="#2f5b34" filter="url(#rough2)">撞天花板/地板反弹（入射角 = 反射角）</text>
  <rect x="60" y="300" width="620" height="48" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="318" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">y 方向只有一个速度 vy&lt;0：命中门的时刻唯一确定，t = m / |vy|。</text>
</svg>
