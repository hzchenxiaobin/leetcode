<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="760" height="430" fill="#fafafa"/>

  <text x="380" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：b = 2(a &amp; c)，三元组 ↔ 位划分 (k, p)</text>
  <path d="M 78 45 Q 380 52 682 45" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 等距数轴 -->
  <text x="52" y="98" font-size="12.5" fill="#66788c" filter="url(#rough2)">a、b、c 等距：</text>

  <rect x="150" y="82" width="76" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="188" y="108" text-anchor="middle" font-size="18" fill="#33506b" filter="url(#rough2)">a</text>
  <rect x="342" y="82" width="76" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="108" text-anchor="middle" font-size="18" fill="#3c5e2e" filter="url(#rough2)">b</text>
  <rect x="534" y="82" width="76" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="572" y="108" text-anchor="middle" font-size="18" fill="#8a6a1f" filter="url(#rough2)">c</text>

  <path d="M 232 102 L 336 102" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 424 102 L 528 102" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="94" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">d</text>
  <text x="476" y="94" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">d</text>

  <text x="188" y="142" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">a = k + p</text>
  <text x="380" y="142" text-anchor="middle" font-size="13" fill="#3c5e2e" filter="url(#rough2)">b = 2k</text>
  <text x="572" y="142" text-anchor="middle" font-size="13" fill="#8a6a1f" filter="url(#rough2)">c = k + q</text>

  <!-- 位划分 -->
  <rect x="150" y="158" width="115" height="34" rx="7" fill="#ffffff" stroke="#8c9bab" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="207" y="180" text-anchor="middle" font-size="12.5" fill="#44566a" filter="url(#rough2)">p = a &amp; ~c</text>
  <rect x="272" y="158" width="115" height="34" rx="7" fill="#ffffff" stroke="#8c9bab" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="329" y="180" text-anchor="middle" font-size="12.5" fill="#44566a" filter="url(#rough2)">q = ~a &amp; c</text>
  <rect x="394" y="158" width="115" height="34" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="451" y="180" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">p + q = 2k</text>
  <rect x="516" y="158" width="100" height="34" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="566" y="180" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">p &amp; q = 0</text>

  <text x="52" y="216" font-size="12.5" fill="#66788c" filter="url(#rough2)">又因 a &lt; b &lt; c 即 p &lt; k &lt; q，于是 p、q 就是 2k 的二进制位的一组划分。</text>
  <text x="52" y="240" font-size="13" font-weight="bold" fill="#a14340" filter="url(#rough2)">⇒ 合法当且仅当 k &amp; 2k = 0（k 的二进制里没有相邻的两个 1）</text>

  <path d="M 60 252 Q 380 258 700 252" stroke="#c9d3dc" stroke-width="1.1" fill="none" filter="url(#rough2)"/>

  <!-- 例 -->
  <rect x="46" y="264" width="330" height="128" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="288" font-size="13.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">例：(a,b,c) = (5,10,15)</text>
  <text x="60" y="312" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">k = a &amp; c = 5 = 101，2k = 1010</text>
  <text x="60" y="334" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">k &amp; 2k = 101 &amp; 1010 = 0 ✓</text>
  <text x="60" y="356" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">p = 0，q = 10 ⇒ c = k + q = 15</text>
  <text x="60" y="378" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">校验：5 ^ 10 ^ 15 = 0 ✓</text>

  <!-- 反例 -->
  <rect x="396" y="264" width="318" height="128" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="410" y="288" font-size="13.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">反例：k = 3 = 11</text>
  <text x="410" y="312" font-size="12.5" fill="#a14340" filter="url(#rough2)">2k = 110，k &amp; 2k = 010 ≠ 0</text>
  <text x="410" y="334" font-size="12.5" fill="#a14340" filter="url(#rough2)">此时 k 与 p+q 抢同一位，</text>
  <text x="410" y="356" font-size="12.5" fill="#a14340" filter="url(#rough2)">a &amp; c 就不可能等于 k，</text>
  <text x="410" y="378" font-size="12.5" fill="#a14340" filter="url(#rough2)">故 b/2 含相邻 1 时无解。</text>

  <text x="380" y="416" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">结论：只需枚举 k（b/2）与 p，且 c = 3k - p，问题变成「数位计数」</text>
</svg>
