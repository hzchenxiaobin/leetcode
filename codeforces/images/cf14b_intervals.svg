<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="151"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="a14barr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="760" height="430" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">所有训练区间的交集 [L, R]</text>
  <path d="M 180 44 Q 380 50 580 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 交集带 -->
  <rect x="240" y="104" width="80" height="166" fill="#e6f4ea" opacity="0.75" filter="url(#rough2)"/>
  <line x1="240" y1="104" x2="240" y2="270" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <line x1="320" y1="104" x2="320" y2="270" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="240" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">L = 4</text>
  <text x="320" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">R = 6</text>

  <!-- 三条区间 -->
  <line x1="80" y1="150" x2="360" y2="150" stroke="#446688" stroke-width="3" filter="url(#rough2)"/>
  <circle cx="80" cy="150" r="4" fill="#446688" filter="url(#rough2)"/>
  <circle cx="360" cy="150" r="4" fill="#446688" filter="url(#rough2)"/>
  <text x="370" y="154" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">1 号：[0, 7]</text>

  <line x1="160" y1="185" x2="640" y2="185" stroke="#d6a040" stroke-width="3" filter="url(#rough2)"/>
  <circle cx="160" cy="185" r="4" fill="#d6a040" filter="url(#rough2)"/>
  <circle cx="640" cy="185" r="4" fill="#d6a040" filter="url(#rough2)"/>
  <text x="650" y="189" font-size="11.5" fill="#8a6015" filter="url(#rough2)">2 号：[2, 14]</text>

  <line x1="240" y1="220" x2="320" y2="220" stroke="#7a5a9a" stroke-width="3" filter="url(#rough2)"/>
  <circle cx="240" cy="220" r="4" fill="#7a5a9a" filter="url(#rough2)"/>
  <circle cx="320" cy="220" r="4" fill="#7a5a9a" filter="url(#rough2)"/>
  <text x="330" y="224" font-size="11.5" fill="#5a3f78" filter="url(#rough2)">3 号：[4, 6]</text>

  <!-- x0 -->
  <circle cx="200" cy="270" r="5" fill="#b85450" stroke="#ffffff" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="200" y="246" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3b36" filter="url(#rough2)">x0 = 3</text>
  <line x1="200" y1="276" x2="200" y2="320" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <line x1="240" y1="276" x2="240" y2="320" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <line x1="204" y1="320" x2="236" y2="320" stroke="#b85450" stroke-width="1.8" marker-end="url(#a14barr)" filter="url(#rough2)"/>
  <text x="220" y="342" text-anchor="middle" font-size="11.5" fill="#8a3b36" filter="url(#rough2)">移动 1</text>

  <!-- 数轴 -->
  <line x1="70" y1="270" x2="710" y2="270" stroke="#2b2b2b" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="80" y="292" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">0</text>
  <text x="120" y="292" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="160" y="292" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">2</text>
  <text x="200" y="292" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">3</text>
  <text x="240" y="292" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">4</text>
  <text x="280" y="292" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">5</text>
  <text x="320" y="292" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">6</text>
  <text x="360" y="292" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">7</text>
  <text x="400" y="292" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">8</text>
  <text x="440" y="292" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">9</text>
  <text x="480" y="292" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">10</text>
  <text x="520" y="292" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">11</text>
  <text x="560" y="292" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">12</text>
  <text x="600" y="292" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">13</text>
  <text x="640" y="292" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">14</text>
  <text x="680" y="292" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">15</text>

  <!-- 结论 -->
  <rect x="70" y="362" width="620" height="54" rx="9" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="88" y="386" font-size="12" fill="#2b2b2b" filter="url(#rough2)">三条区间都覆盖 [4,6]，x0=3 在区间外左侧，最近走到 4 即可。</text>
  <text x="88" y="406" font-size="11.5" fill="#777" filter="url(#rough2)">若交集为空（L &gt; R），无论怎么走都拍不到全部人，输出 -1。</text>
</svg>
