<svg xmlns="http://www.w3.org/2000/svg" width="700" height="360" viewBox="0 0 700 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="63"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="700" height="360" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例：最短路 1 → 4 → 3 → 5，长度 1 + 3 + 1 = 5</text>

  <!-- 普通边 -->
  <g stroke="#c9ced6" stroke-width="1.8" filter="url(#rough2)">
    <line x1="140" y1="120" x2="330" y2="80"/>
    <line x1="330" y1="80" x2="540" y2="140"/>
    <line x1="330" y1="80" x2="330" y2="250"/>
  </g>
  <!-- 最短路 1-4-3-5 -->
  <g stroke="#4a7a3a" stroke-width="3" filter="url(#rough2)">
    <line x1="140" y1="120" x2="520" y2="250"/>
    <line x1="520" y1="250" x2="330" y2="250"/>
    <line x1="330" y1="250" x2="540" y2="140"/>
  </g>
  <!-- 边权 -->
  <g font-size="11.5" fill="#666" filter="url(#rough2)">
    <text x="228" y="88">2</text>
    <text x="424" y="98">5</text>
    <text x="340" y="170">4</text>
    <text x="322" y="196">1</text>
    <text x="420" y="270">3</text>
    <text x="446" y="186">1</text>
    <text x="352" y="210">1</text>
  </g>

  <g filter="url(#rough2)">
    <circle cx="140" cy="120" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <text x="140" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66">1</text>
    <circle cx="330" cy="80" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <text x="330" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66">2</text>
    <circle cx="330" cy="250" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
    <text x="330" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223">3</text>
    <circle cx="520" cy="250" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
    <text x="520" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223">4</text>
    <circle cx="540" cy="140" r="19" fill="#fce8e6" stroke="#b85450" stroke-width="2.4"/>
    <text x="540" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#8f3b37">5</text>
  </g>

  <text x="350" y="314" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">绿色：最短路径 1 → 4 → 3 → 5（1+3+1 = 5）；红色：终点 5</text>
  <text x="350" y="336" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">对照：1→2→5 长度 7，1→2→3→5 长度 7，都不是最短路。</text>
</svg>
