<svg xmlns="http://www.w3.org/2000/svg" width="720" height="410" viewBox="0 0 720 410"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="720" height="410" fill="#fafafa"/>
  <text x="360.0" y="33" font-size="20" font-weight="bold" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">n = 8 = 2³：八个三角数恰好铺满</text>
  <path d="M 256 44 Q 360.0 50 464 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <circle cx="200.0" cy="112.0" r="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200.0" y="117.0" font-size="13" font-weight="bold" fill="#22303f" text-anchor="middle" filter="url(#rough2)">0</text>
  <circle cx="283.4386001800126" cy="146.5613998199874" r="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="283.4386001800126" y="151.5613998199874" font-size="13" font-weight="bold" fill="#22303f" text-anchor="middle" filter="url(#rough2)">1</text>
  <circle cx="318.0" cy="230.0" r="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="318.0" y="235.0" font-size="13" font-weight="bold" fill="#22303f" text-anchor="middle" filter="url(#rough2)">3</text>
  <circle cx="283.4386001800126" cy="313.4386001800126" r="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="283.4386001800126" y="318.4386001800126" font-size="13" font-weight="bold" fill="#22303f" text-anchor="middle" filter="url(#rough2)">6</text>
  <circle cx="200.0" cy="348.0" r="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200.0" y="353.0" font-size="13" font-weight="bold" fill="#22303f" text-anchor="middle" filter="url(#rough2)">2</text>
  <circle cx="116.5613998199874" cy="313.4386001800126" r="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="116.5613998199874" y="318.4386001800126" font-size="13" font-weight="bold" fill="#22303f" text-anchor="middle" filter="url(#rough2)">7</text>
  <circle cx="82.0" cy="230.00000000000003" r="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="82.0" y="235.00000000000003" font-size="13" font-weight="bold" fill="#22303f" text-anchor="middle" filter="url(#rough2)">5</text>
  <circle cx="116.56139981998737" cy="146.5613998199874" r="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="116.56139981998737" y="151.5613998199874" font-size="13" font-weight="bold" fill="#22303f" text-anchor="middle" filter="url(#rough2)">4</text>
  <text x="200" y="226" font-size="12" font-weight="bold" fill="#2f5223" text-anchor="middle" filter="url(#rough2)">T_k mod 8</text>
  <text x="200" y="246" font-size="10.5" font-weight="normal" fill="#2f5223" text-anchor="middle" filter="url(#rough2)">0,1,3,6,2,7,5,4</text>
  <rect x="360" y="84" width="330" height="120" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="376" y="110" font-size="12.5" font-weight="bold" fill="#2f5223" text-anchor="start" filter="url(#rough2)">n = 2^k 时：</text>
  <text x="376" y="134" font-size="11.5" font-weight="normal" fill="#2f5223" text-anchor="start" filter="url(#rough2)">T_0, …, T_{n−1} 两两不同</text>
  <text x="376" y="156" font-size="10.5" font-weight="normal" fill="#2f5223" text-anchor="start" filter="url(#rough2)">（2-进赋值的反证，见正文）</text>
  <text x="376" y="182" font-size="11.5" font-weight="bold" fill="#2f5223" text-anchor="start" filter="url(#rough2)">n 个值 = n 个位置 → 全覆盖</text>
  <rect x="360" y="224" width="330" height="140" rx="8" fill="#fde8e8" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="376" y="250" font-size="12" font-weight="bold" fill="#7a3b36" text-anchor="start" filter="url(#rough2)">n = 2^s · d，d &gt; 1 为奇数：</text>
  <text x="376" y="274" font-size="11.5" font-weight="normal" fill="#7a3b36" text-anchor="start" filter="url(#rough2)">T_{m+d} ≡ T_m (mod d)</text>
  <text x="376" y="296" font-size="11.5" font-weight="normal" fill="#7a3b36" text-anchor="start" filter="url(#rough2)">T_{d−1−m} ≡ T_m (mod d)</text>
  <text x="376" y="318" font-size="11.5" font-weight="normal" fill="#7a3b36" text-anchor="start" filter="url(#rough2)">d 个值配对，至多 (d+1)/2 种</text>
  <text x="376" y="344" font-size="11.5" font-weight="bold" fill="#7a3b36" text-anchor="start" filter="url(#rough2)">模 d 都取不全 → 必为 NO</text>
  <text x="360" y="390" font-size="12" font-weight="bold" fill="#22303f" text-anchor="middle" filter="url(#rough2)">判定：n &amp; (n−1) == 0 ? YES : NO</text>
</svg>
