<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="780" height="400" fill="#fafafa"/>
  <text x="390.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">193C：每一位（列）就是 K₄ 的一个割，7 种非空割</text>
  <path d="M 165.6200000000001 46 Q 390.0 52 614.3799999999999 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60.0" y="70.0" width="330.0" height="100.0" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="76.0" y="96.0" text-anchor="start" font-size="11.6" font-weight="bold" fill="#446688" filter="url(#rough2)">孤立型（4 种）</text>
  <text x="76.0" y="122.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">某串是 b、其余是 a：</text>
  <text x="76.0" y="146.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">贡献 3 对距离（涉及该串的 3 对）</text>
  <rect x="410.0" y="70.0" width="330.0" height="100.0" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="426.0" y="96.0" text-anchor="start" font-size="11.6" font-weight="bold" fill="#2f5b34" filter="url(#rough2)">平分型（3 种）</text>
  <text x="426.0" y="122.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">12|34、13|24、14|23</text>
  <text x="426.0" y="146.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">贡献 4 对距离</text>
  <rect x="60.0" y="190.0" width="650.0" height="32.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="68.0" y="215.0" text-anchor="start" font-size="10.6" font-weight="bold" fill="#26405c" filter="url(#rough2)">变量</text>
  <text x="158.0" y="215.0" text-anchor="start" font-size="10.6" font-weight="bold" fill="#26405c" filter="url(#rough2)">含义</text>
  <text x="418.0" y="215.0" text-anchor="start" font-size="10.6" font-weight="bold" fill="#26405c" filter="url(#rough2)">影响的距离</text>
  <path d="M 60.0 190.0 L 710.0 190.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="68.0" y="247.0" text-anchor="start" font-size="10.6" fill="#2b2b2b" filter="url(#rough2)">x₁…x₄</text>
  <text x="158.0" y="247.0" text-anchor="start" font-size="10.6" fill="#2b2b2b" filter="url(#rough2)">孤立对应串的列数</text>
  <text x="418.0" y="247.0" text-anchor="start" font-size="10.6" fill="#2b2b2b" filter="url(#rough2)">d(1,i) 等 3 对</text>
  <path d="M 60.0 222.0 L 710.0 222.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="68.0" y="279.0" text-anchor="start" font-size="10.6" fill="#2b2b2b" filter="url(#rough2)">A</text>
  <text x="158.0" y="279.0" text-anchor="start" font-size="10.6" fill="#2b2b2b" filter="url(#rough2)">12|34 的列数</text>
  <text x="418.0" y="279.0" text-anchor="start" font-size="10.6" fill="#2b2b2b" filter="url(#rough2)">d13,d14,d23,d24</text>
  <path d="M 60.0 254.0 L 710.0 254.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="68.0" y="311.0" text-anchor="start" font-size="10.6" fill="#2b2b2b" filter="url(#rough2)">B</text>
  <text x="158.0" y="311.0" text-anchor="start" font-size="10.6" fill="#2b2b2b" filter="url(#rough2)">13|24 的列数</text>
  <text x="418.0" y="311.0" text-anchor="start" font-size="10.6" fill="#2b2b2b" filter="url(#rough2)">d12,d14,d23,d34</text>
  <path d="M 60.0 286.0 L 710.0 286.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="68.0" y="343.0" text-anchor="start" font-size="10.6" fill="#2b2b2b" filter="url(#rough2)">C</text>
  <text x="158.0" y="343.0" text-anchor="start" font-size="10.6" fill="#2b2b2b" filter="url(#rough2)">14|23 的列数</text>
  <text x="418.0" y="343.0" text-anchor="start" font-size="10.6" fill="#2b2b2b" filter="url(#rough2)">d12,d13,d24,d34</text>
  <path d="M 60.0 318.0 L 710.0 318.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="60.0" y="366.0" text-anchor="start" font-size="10.8" fill="#6b6b6b" filter="url(#rough2)">必要性：d13−d23 = d14−d24 = x₁−x₂；其余变量由 x₂ 与 x₃ 两个自由量参数化，逐个试 x₂ 即可。</text>
</svg>
