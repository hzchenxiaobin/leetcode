<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>

  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">给 7 个英雄各贴一个队伍标签：3^7 = 2187 种分法</text>
  <path d="M 144 43 Q 360 49 576 43" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="40" y="72" text-anchor="start" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">7 位英雄</text>
  <rect x="40" y="88" width="158" height="28" rx="6" fill="#eef3fb" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="119" y="107" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">Anka</text>
  <rect x="40" y="124" width="158" height="28" rx="6" fill="#eef3fb" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="119" y="143" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">Chapay</text>
  <rect x="40" y="160" width="158" height="28" rx="6" fill="#eef3fb" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="119" y="179" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">Cleo</text>
  <rect x="40" y="196" width="158" height="28" rx="6" fill="#eef3fb" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="119" y="215" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">Troll</text>
  <rect x="40" y="232" width="158" height="28" rx="6" fill="#eef3fb" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="119" y="251" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">Dracul</text>
  <rect x="40" y="268" width="158" height="28" rx="6" fill="#eef3fb" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="119" y="287" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">Snowy</text>
  <rect x="40" y="304" width="158" height="28" rx="6" fill="#eef3fb" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="119" y="323" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">Hexadecimal</text>
  <line x1="232" y1="102" x2="232" y2="314" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="198" y1="102" x2="232" y2="102" stroke="#9bb3cc" stroke-width="1.0" filter="url(#rough2)"/>
  <line x1="198" y1="138" x2="232" y2="138" stroke="#9bb3cc" stroke-width="1.0" filter="url(#rough2)"/>
  <line x1="198" y1="174" x2="232" y2="174" stroke="#9bb3cc" stroke-width="1.0" filter="url(#rough2)"/>
  <line x1="198" y1="210" x2="232" y2="210" stroke="#9bb3cc" stroke-width="1.0" filter="url(#rough2)"/>
  <line x1="198" y1="246" x2="232" y2="246" stroke="#9bb3cc" stroke-width="1.0" filter="url(#rough2)"/>
  <line x1="198" y1="282" x2="232" y2="282" stroke="#9bb3cc" stroke-width="1.0" filter="url(#rough2)"/>
  <line x1="198" y1="318" x2="232" y2="318" stroke="#9bb3cc" stroke-width="1.0" filter="url(#rough2)"/>
  <rect x="300" y="96" width="380" height="62" rx="8" fill="#f3e9f7" stroke="#7a4a86" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="316" y="123" text-anchor="start" font-size="13.5" font-weight="bold" fill="#7a4a86" filter="url(#rough2)">队伍 0 → Mephisto：a 点经验</text>
  <text x="316" y="145" text-anchor="start" font-size="11.5" fill="#5b5b5b" filter="url(#rough2)">每名队员得 ⌊ 经验 / 本队人数 ⌋</text>
  <line x1="232" y1="102" x2="296" y2="127" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="300" y="180" width="380" height="62" rx="8" fill="#e9f4ec" stroke="#3f6b4a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="316" y="207" text-anchor="start" font-size="13.5" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">队伍 1 → Diablo：b 点经验</text>
  <text x="316" y="229" text-anchor="start" font-size="11.5" fill="#5b5b5b" filter="url(#rough2)">每名队员得 ⌊ 经验 / 本队人数 ⌋</text>
  <line x1="232" y1="102" x2="296" y2="211" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="300" y="264" width="380" height="62" rx="8" fill="#fdf3e3" stroke="#8a6015" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="316" y="291" text-anchor="start" font-size="13.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">队伍 2 → Baal：c 点经验</text>
  <text x="316" y="313" text-anchor="start" font-size="11.5" fill="#5b5b5b" filter="url(#rough2)">每名队员得 ⌊ 经验 / 本队人数 ⌋</text>
  <line x1="232" y1="102" x2="296" y2="295" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="40" y="356" width="640" height="60" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="380" text-anchor="start" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">合法分队 = 三队都非空：3^7 − 3·2^7 + 3 = 1806 种（空队直接跳过）</text>
  <text x="56" y="402" text-anchor="start" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">对每种分队算 极差 = 最大经验 − 最小经验，再数同队“喜欢”的有序对，按字典序取最优</text>
</svg>
