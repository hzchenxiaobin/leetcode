<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <g filter="url(#rough2)">
    <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">五组官方样例走查：只数偶数个数</text>
    <text x="310" y="48" text-anchor="middle" font-size="10.5" fill="#888">k 为偶数看 evenA ≤ evenB；k 为奇数看 evenA ≥ evenB</text>

    <rect x="30" y="64" width="560" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="62" y="85" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold">组</text>
    <text x="142" y="85" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold">k</text>
    <text x="218" y="85" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold">k 的奇偶</text>
    <text x="302" y="85" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold">evenA</text>
    <text x="378" y="85" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold">evenB</text>
    <text x="468" y="85" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold">判据</text>
    <text x="566" y="85" text-anchor="middle" font-size="10.5" fill="#3a4a66" font-weight="bold">答案</text>

    <rect x="30" y="96" width="560" height="34" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="3"/>
    <text x="62" y="118" text-anchor="middle" font-size="11" fill="#555">1</text>
    <text x="142" y="118" text-anchor="middle" font-size="11" fill="#555">4</text>
    <text x="218" y="118" text-anchor="middle" font-size="10.5" fill="#446688">偶</text>
    <text x="302" y="118" text-anchor="middle" font-size="11" fill="#555">1</text>
    <text x="378" y="118" text-anchor="middle" font-size="11" fill="#555">1</text>
    <text x="468" y="118" text-anchor="middle" font-size="10.5" fill="#3a5a30">1 ≤ 1 ✓</text>
    <text x="566" y="118" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">YES</text>

    <rect x="30" y="130" width="560" height="34" fill="#fff8e1" stroke="#dddddd" stroke-width="1" rx="3"/>
    <text x="62" y="152" text-anchor="middle" font-size="11" fill="#555">2</text>
    <text x="142" y="152" text-anchor="middle" font-size="11" fill="#555">1</text>
    <text x="218" y="152" text-anchor="middle" font-size="10.5" fill="#b85450">奇</text>
    <text x="302" y="152" text-anchor="middle" font-size="11" fill="#555">1</text>
    <text x="378" y="152" text-anchor="middle" font-size="11" fill="#555">0</text>
    <text x="468" y="152" text-anchor="middle" font-size="10.5" fill="#3a5a30">1 ≥ 0 ✓</text>
    <text x="566" y="152" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">YES</text>

    <rect x="30" y="164" width="560" height="34" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="3"/>
    <text x="62" y="186" text-anchor="middle" font-size="11" fill="#555">3</text>
    <text x="142" y="186" text-anchor="middle" font-size="11" fill="#555">1</text>
    <text x="218" y="186" text-anchor="middle" font-size="10.5" fill="#b85450">奇</text>
    <text x="302" y="186" text-anchor="middle" font-size="11" fill="#555">0</text>
    <text x="378" y="186" text-anchor="middle" font-size="11" fill="#555">1</text>
    <text x="468" y="186" text-anchor="middle" font-size="10.5" fill="#8a3a36">0 ≥ 1 ✗</text>
    <text x="566" y="186" text-anchor="middle" font-size="11" fill="#8a3a36" font-weight="bold">NO</text>

    <rect x="30" y="198" width="560" height="34" fill="#fff8e1" stroke="#dddddd" stroke-width="1" rx="3"/>
    <text x="62" y="220" text-anchor="middle" font-size="11" fill="#555">4</text>
    <text x="142" y="220" text-anchor="middle" font-size="11" fill="#555">1</text>
    <text x="218" y="220" text-anchor="middle" font-size="10.5" fill="#b85450">奇</text>
    <text x="302" y="220" text-anchor="middle" font-size="11" fill="#555">6</text>
    <text x="378" y="220" text-anchor="middle" font-size="11" fill="#555">0</text>
    <text x="468" y="220" text-anchor="middle" font-size="10.5" fill="#3a5a30">6 ≥ 0 ✓</text>
    <text x="566" y="220" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">YES</text>

    <rect x="30" y="232" width="560" height="34" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="3"/>
    <text x="62" y="254" text-anchor="middle" font-size="11" fill="#555">5</text>
    <text x="142" y="254" text-anchor="middle" font-size="8.5" fill="#555">1000000</text>
    <text x="218" y="254" text-anchor="middle" font-size="10.5" fill="#446688">偶</text>
    <text x="302" y="254" text-anchor="middle" font-size="11" fill="#555">0</text>
    <text x="378" y="254" text-anchor="middle" font-size="11" fill="#555">1</text>
    <text x="468" y="254" text-anchor="middle" font-size="10.5" fill="#3a5a30">0 ≤ 1 ✓</text>
    <text x="566" y="254" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">YES</text>

    <rect x="30" y="280" width="560" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8"/>
    <text x="44" y="302" font-size="10" fill="#8a6a20">第 3 组：a = [1] 是奇数，k = 1 也是奇数 ⇒ 奇元素被锁死在奇类，而 b = [0] 是偶数，放不下。</text>
    <text x="44" y="324" font-size="10" fill="#8a6a20">第 4 组：6 个 0 全是偶数，k 奇时偶数可单向变奇，1,3,7,15,31,63 恰好全是奇数，故全放得下。</text>

    <text x="310" y="374" text-anchor="middle" font-size="10" fill="#999">五组判定依次为 YES / YES / NO / YES / YES，与题面 Note 完全一致</text>
  </g>
</svg>
