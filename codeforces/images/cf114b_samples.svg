<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="43"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="330" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">样例 1：3 个人只有 Petya 与 Vasya 不和</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">Petya、Vasya、Masha 三人都可取时最多 2 人；两组 2 人都合法，输出字典序小的一组</text>
  <g filter="url(#rough2)"><rect x="40" y="96" width="830" height="54" rx="6" fill="#cfe0f5" fill-opacity="0.5" stroke="#446688" stroke-width="1.4"/></g>
  <text x="60" y="128" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">不和：Petya — Vasya</text>
  <text x="780" y="128" text-anchor="end" font-size="11" fill="#666666" filter="url(#rough2)">n = 3，m = 1</text>
  <g filter="url(#rough2)"><rect x="40" y="154" width="830" height="38" rx="6" fill="#ffffff" fill-opacity="0.4" stroke="#cccccc" stroke-width="1.4" stroke-dasharray="5 4"/></g>
  <text x="60" y="180" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">{Petya, Vasya}</text>
  <text x="330" y="180" text-anchor="start" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">✗ 内部有冲突边</text>
  <text x="760" y="180" text-anchor="middle" font-size="12" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">—</text>
  <g filter="url(#rough2)"><rect x="40" y="200" width="830" height="38" rx="6" fill="#ffffff" fill-opacity="0.4" stroke="#cccccc" stroke-width="1.4" stroke-dasharray="5 4"/></g>
  <text x="60" y="226" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">{Petya, Masha}</text>
  <text x="330" y="226" text-anchor="start" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">✓ 2 人，字典序 (Masha, Petya)</text>
  <text x="760" y="226" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2 人</text>
  <g filter="url(#rough2)"><rect x="40" y="246" width="830" height="38" rx="6" fill="#ffffff" fill-opacity="0.4" stroke="#cccccc" stroke-width="1.4" stroke-dasharray="5 4"/></g>
  <text x="60" y="272" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">{Vasya, Masha}</text>
  <text x="330" y="272" text-anchor="start" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">✓ 2 人，字典序 (Masha, Vasya)</text>
  <text x="760" y="272" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2 人</text>
  <text x="450" y="314" text-anchor="middle" font-size="12.5" fill="#b06a1e" font-weight="bold" filter="url(#rough2)">输出：2 / Masha / Petya（按字典序，人数最大）</text>
</svg>
