<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="193"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="760" height="400" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">“超级幸运数” = 位数偶数、且 4 与 7 各占一半</text>
  <path d="M 152 39 Q 380 45 608 39" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="30" y="64" width="130" height="46" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="95" y="92" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">4 位数</text>
  <text x="176" y="92" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">C(4,2) = 6 个</text>
  <text x="300" y="92" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">4477 4747 4774 7447 7474 7744</text>
  <rect x="30" y="118" width="130" height="46" rx="8" fill="#e9f4ec" stroke="#3f6b4a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="95" y="146" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">2 位数</text>
  <text x="176" y="146" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">C(2,1) = 2 个</text>
  <text x="300" y="146" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">47 74</text>
  <rect x="30" y="172" width="130" height="46" rx="8" fill="#fdf3e3" stroke="#8a6015" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="95" y="200" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">6 位数</text>
  <text x="176" y="200" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">C(6,3) = 20 个</text>
  <text x="300" y="200" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">444777 … 777444（按字典序共 20 个）</text>
  <rect x="30" y="232" width="700" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="46" y="256" text-anchor="start" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">若 n 的位数是奇数，任何同长度数都不可能是超级幸运数 ⇒ 答案取“最小的大一位数”：</text>
  <text x="46" y="278" text-anchor="start" font-size="12" fill="#7a5a1b" filter="url(#rough2)">即 (L+1) 位：前一半全是 4、后一半全是 7（这也是所有 L+1 位数里最小的超级幸运数）。</text>
  <rect x="30" y="304" width="700" height="68" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="46" y="328" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">若位数 L 是偶数：要在全部 C(L, L/2) 个超级幸运数里找“最小的 ≥ n”。</text>
  <text x="46" y="350" text-anchor="start" font-size="12" fill="#2f4a66" filter="url(#rough2)">做法：从右往左找第一个可以“放一个比 n[j] 大的数字”的位置 j（前缀必须与 n 完全一致），</text>
  <text x="46" y="370" text-anchor="start" font-size="12" fill="#2f4a66" filter="url(#rough2)">把 j 处放大、后面按“先 4 后 7”填满，就是该 j 下最小的候选；j 越大候选越小。</text>
</svg>
