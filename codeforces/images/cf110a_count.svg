<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="109"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="360" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">数一数有多少个 4/7：再看这个“个数”本身是否只由 4/7 组成</text>
  <g filter="url(#rough2)"><rect x="120" y="110" width="260" height="64" rx="4" fill="#f6e3c4" fill-opacity="0.6" stroke="#c9a86a" stroke-width="1.3"/></g>
  <text x="250" y="146" text-anchor="middle" font-size="20" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">40047</text>
  <text x="250" y="166" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">幸运数字：4,4,7 → 3 个</text>
  <g filter="url(#rough2)"><path d="M 390 142 L 460 142" fill="none" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrg)"/></g>
  <g filter="url(#rough2)"><rect x="470" y="110" width="300" height="64" rx="4" fill="#f6d9d7" fill-opacity="0.5" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="620" y="140" text-anchor="middle" font-size="13" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">3 不是幸运数</text>
  <text x="620" y="162" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">（只含 4/7 才是）→ NO</text>
  <text x="440" y="250" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">注意 0 个幸运数字也算 NO（0 不是幸运数）</text>
  <text x="440" y="290" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">n 到 10¹⁸ → 用字符串读入，逐个数字判断</text>
</svg>
