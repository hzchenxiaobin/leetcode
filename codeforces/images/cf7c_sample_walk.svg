<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c9801f"/>
    </marker>
  </defs>

  <rect width="760" height="430" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="38" text-anchor="middle" font-size="18.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">样例走查：2x + 5y + 3 = 0</text>
  <path d="M 152 50 Q 380 56 608 50" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60" y="74" width="640" height="38" rx="7" fill="#f7f9fc" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="76" y="99" text-anchor="start" font-size="13" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">1. g = gcd(2, 5) = 1，且 1 整除 3 -&gt; 有整数解</text>
  <rect x="60" y="120" width="640" height="38" rx="7" fill="#f7f9fc" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="76" y="145" text-anchor="start" font-size="13" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">2. 约化：a = 2, b = 5, c = -C/g = -3，即解 2x + 5y = -3</text>
  <rect x="60" y="166" width="640" height="38" rx="7" fill="#f7f9fc" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="76" y="191" text-anchor="start" font-size="13" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">3. 扩欧：2*(-2) + 5*1 = 1，得到 p = -2, q = 1</text>
  <rect x="60" y="212" width="640" height="38" rx="7" fill="#f7f9fc" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="76" y="237" text-anchor="start" font-size="13" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">4. 特解：x0 = p*c = 6, y0 = q*c = -3（正是官方样例给出的 6 -3）</text>
  <rect x="60" y="258" width="640" height="38" rx="7" fill="#f7f9fc" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="76" y="283" text-anchor="start" font-size="13" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">5. 平移：t = -x0/b = -6/5 = -1（截断除法），得 x = 6-5 = 1, y = -3+2 = -1</text>
  <rect x="60" y="304" width="640" height="38" rx="7" fill="#fff3e0" stroke="#c9801f" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="76" y="329" text-anchor="start" font-size="13" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">6. 验算：2*1 + 5*(-1) + 3 = 0，两个坐标都远在 5*10^18 之内</text>
  <text x="60" y="378" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">官方样例输出是 (6, -3)，我们的程序输出 (1, -1)：本题为特殊评测，任意一组合法整点都算通过。</text>
  <text x="60" y="404" text-anchor="start" font-size="12.5" fill="#2f5223" font-weight="bold" filter="url(#rough2)">两答案正好相差一次 (b, -a) = (5, -2) 平移，与 5. 的推演完全一致。</text>
</svg>
