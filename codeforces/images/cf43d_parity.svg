<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2b2b2b"/>
    </marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arra" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="720" height="470" fill="#fafafa"/>
  <text x="360" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3×3 棋盘染色：黑格 5 个、白格 4 个</text>
  <path d="M 200 42 Q 360 48 520 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="90" y="80" width="72" height="72" rx="0" fill="#c9d8f0" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="154" y="98" text-anchor="end" font-size="10" fill="#8a8a8a" filter="url(#rough2)">黑</text>
  <text x="126.0" y="126.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#b85450" filter="url(#rough2)">首都</text>
  <rect x="162" y="80" width="72" height="72" rx="0" fill="#f6e7c8" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="226" y="98" text-anchor="end" font-size="10" fill="#8a8a8a" filter="url(#rough2)">白</text>
  <rect x="234" y="80" width="72" height="72" rx="0" fill="#c9d8f0" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="298" y="98" text-anchor="end" font-size="10" fill="#8a8a8a" filter="url(#rough2)">黑</text>
  <rect x="90" y="152" width="72" height="72" rx="0" fill="#f6e7c8" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="154" y="170" text-anchor="end" font-size="10" fill="#8a8a8a" filter="url(#rough2)">白</text>
  <rect x="162" y="152" width="72" height="72" rx="0" fill="#c9d8f0" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="226" y="170" text-anchor="end" font-size="10" fill="#8a8a8a" filter="url(#rough2)">黑</text>
  <rect x="234" y="152" width="72" height="72" rx="0" fill="#f6e7c8" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="298" y="170" text-anchor="end" font-size="10" fill="#8a8a8a" filter="url(#rough2)">白</text>
  <rect x="90" y="224" width="72" height="72" rx="0" fill="#c9d8f0" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="154" y="242" text-anchor="end" font-size="10" fill="#8a8a8a" filter="url(#rough2)">黑</text>
  <rect x="162" y="224" width="72" height="72" rx="0" fill="#f6e7c8" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="226" y="242" text-anchor="end" font-size="10" fill="#8a8a8a" filter="url(#rough2)">白</text>
  <rect x="234" y="224" width="72" height="72" rx="0" fill="#c9d8f0" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="298" y="242" text-anchor="end" font-size="10" fill="#8a8a8a" filter="url(#rough2)">黑</text>
  <text x="270.0" y="320" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#rough2)">行 1..3</text>
  <text x="350" y="112" text-anchor="start" font-size="13.5" fill="#2b2b2b" filter="url(#rough2)">只走相邻格 ⇒ 颜色必须交替</text>
  <text x="350" y="142" text-anchor="start" font-size="13.5" fill="#2b2b2b" filter="url(#rough2)">闭合路线首尾同色，两种颜色的</text>
  <text x="350" y="166" text-anchor="start" font-size="13.5" fill="#2b2b2b" filter="url(#rough2)">访问次数只能相差 1</text>
  <text x="350" y="210" text-anchor="start" font-size="13.5" fill="#b85450" filter="url(#rough2)">本题要求：黑格访问 6 次</text>
  <text x="350" y="234" text-anchor="start" font-size="13.5" fill="#b85450" filter="url(#rough2)">白格访问 4 次，相差 2</text>
  <text x="350" y="278" text-anchor="start" font-size="15" font-weight="bold" fill="#b85450" filter="url(#rough2)">⇒ 0 个传送门不可能</text>
  <text x="350" y="306" text-anchor="start" font-size="15" font-weight="bold" fill="#b85450" filter="url(#rough2)">⇒ 至少需要 1 个传送门</text>
  <text x="350" y="336" text-anchor="start" font-size="11" fill="#8a8a8a" filter="url(#rough2)">（1×2 折返是唯一例外，可 0 个）</text>
  <text x="360" y="370" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">黑格 = 5 格各一次 + 首都再一次 = 6 次</text>
  <text x="360" y="394" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">白格 = 4 格各一次 = 4 次</text>
  <text x="360" y="434" text-anchor="middle" font-size="13" fill="#8a8a8a" filter="url(#rough2)">奇数面积必需要 1 个；偶数面积可 0 个</text>
</svg>
