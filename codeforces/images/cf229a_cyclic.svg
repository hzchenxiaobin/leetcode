  <text x="200" y="200" text-anchor="start" font-size="11.5" fill="#446688" filter="url(#rough2)">← 左移 s 格</text>
  <text x="640" y="200" text-anchor="start" font-size="11.5" fill="#a0522d" filter="url(#rough2)">右移 s 格 →</text>
  <g filter="url(#rough2)"><path d="M 300 205 Q 420 240 540 205" fill="none" stroke="#a0522d" stroke-width="1.4" stroke-dasharray="5 3" stroke-linejoin="round"/></g>
  <text x="420" y="250" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">到达同一列的两条路径：向左绕或向右绕</text>
  <g filter="url(#rough2)"><rect x="230" y="276" width="380" height="40" rx="4" fill="#faf3ec" fill-opacity="0.85" stroke="#c8a48a" stroke-width="1.3"/></g>
  <text x="420" y="302" text-anchor="middle" font-size="13" font-weight="bold" fill="#3d6b2f" filter="url(#rough2)">d(p,j) = min((j−p) mod m, (p−j) mod m)</text>
  <text x="420" y="338" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">每行独立，按列求和后取最小</text>
