  <text x="329" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)"><rect x="362" y="118" width="50" height="40" rx="4" fill="#ffffff" fill-opacity="0.85" stroke="#667788" stroke-width="1.3"/></g>
  <text x="387" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)"><rect x="420" y="118" width="50" height="40" rx="4" fill="#ffffff" fill-opacity="0.85" stroke="#667788" stroke-width="1.3"/></g>
  <text x="445" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">0</text>
