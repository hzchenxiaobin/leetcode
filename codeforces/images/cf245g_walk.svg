<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="720" height="300" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1 中 David 的候选：共同好友数 1 出现两次 → 答案 2</text>
  <rect x="40" y="54" width="150" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="115" y="84" text-anchor="middle" font-size="13" fill="#2f5223">David</text>
  <rect x="240" y="54" width="150" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="315" y="84" text-anchor="middle" font-size="13" fill="#2f4a66">Gerald</text>
  <rect x="440" y="54" width="150" height="50" rx="8" fill="#f3edf8" stroke="#7a4a9a" stroke-width="1.5"/>
  <text x="515" y="83" text-anchor="middle" font-size="11" fill="#4a2a62">N(David)={Gerald}</text>
  <text x="40" y="140" text-anchor="start" font-size="11.5" fill="#446688" filter="url(#rough2)">候选 y（非好友）          共同好友 = |{Gerald} ∩ N(y)|</text>
  <rect x="60" y="160" width="120" height="32" rx="8" fill="#f2f2f2" stroke="#888888" stroke-width="1.5"/>
  <text x="120" y="180" text-anchor="middle" font-size="11" fill="#555555">Mike</text>
  <rect x="200" y="160" width="240" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="320" y="180" text-anchor="middle" font-size="10.5" fill="#2f4a66">{Gerald, Kate}</text>
  <rect x="470" y="160" width="90" height="32" rx="8" fill="#fde9d9" stroke="#b4652a" stroke-width="1.5"/>
  <text x="515" y="180" text-anchor="middle" font-size="12" fill="#7a4b22">1</text>
  <rect x="60" y="202" width="120" height="32" rx="8" fill="#f2f2f2" stroke="#888888" stroke-width="1.5"/>
  <text x="120" y="222" text-anchor="middle" font-size="11" fill="#555555">Kate</text>
  <rect x="200" y="202" width="240" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="320" y="222" text-anchor="middle" font-size="10.5" fill="#2f4a66">{Mike, Tank}</text>
  <rect x="470" y="202" width="90" height="32" rx="8" fill="#fde9d9" stroke="#b4652a" stroke-width="1.5"/>
  <text x="515" y="222" text-anchor="middle" font-size="12" fill="#7a4b22">0</text>
  <rect x="60" y="244" width="120" height="32" rx="8" fill="#f2f2f2" stroke="#888888" stroke-width="1.5"/>
  <text x="120" y="264" text-anchor="middle" font-size="11" fill="#555555">Tank</text>
  <rect x="200" y="244" width="240" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="320" y="264" text-anchor="middle" font-size="10.5" fill="#2f4a66">{Kate, Gerald}</text>
  <rect x="470" y="244" width="90" height="32" rx="8" fill="#fde9d9" stroke="#b4652a" stroke-width="1.5"/>
  <text x="515" y="264" text-anchor="middle" font-size="12" fill="#7a4b22">1</text>
  <text x="40" y="300" text-anchor="start" font-size="11.5" fill="#7a4b22" filter="url(#rough2)">max = 1，达到它的候选有 2 个（Mike、Tank）⇒ 输出 2</text>
</svg>
