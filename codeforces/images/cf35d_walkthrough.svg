<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="271"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="290" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1：n = 3, X = 4, c = [1,1,1]</text>
  <g font-size="12.5" filter="url(#rough2)">
    <text x="70" y="72" fill="#666">天</text><text x="170" y="72" fill="#666">c_i</text><text x="270" y="72" fill="#666">剩余天数</text><text x="420" y="72" fill="#666">w_i</text>
  </g>
  <g stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)">
    <line x1="60" y1="84" x2="640" y2="84"/><line x1="60" y1="120" x2="640" y2="120"/><line x1="60" y1="156" x2="640" y2="156"/>
  </g>
  <g font-size="13" filter="url(#rough2)">
    <text x="70" y="108" fill="#2b2b2b">1</text><text x="170" y="108" fill="#2b2b2b">1</text><text x="270" y="108" fill="#2b2b2b">3</text><text x="420" y="108" fill="#2b2b2b">3</text>
    <text x="70" y="144" fill="#2b2b2b">2</text><text x="170" y="144" fill="#2b2b2b">1</text><text x="270" y="144" fill="#2b2b2b">2</text><text x="420" y="144" fill="#2b2b2b">2</text>
    <text x="70" y="180" fill="#2b2b2b">3</text><text x="170" y="180" fill="#2b2b2b">1</text><text x="270" y="180" fill="#2b2b2b">1</text><text x="420" y="180" fill="#2b2b2b">1</text>
  </g>
  <rect x="70" y="204" width="580" height="58" rx="9" fill="#eef4ec" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="86" y="228" font-size="12.5" fill="#2f5223" filter="url(#rough2)">升序：1, 2, 3。取 1（剩 3）、取 2（剩 1）、取 3 需要 3 &gt; 1 ✗ → 共 2 只。</text>
  <text x="86" y="250" font-size="12.5" fill="#2f5223" filter="url(#rough2)">若 X = 6，则 1+2+3 = 6 ✓，三只全部留下。</text>
</svg>
