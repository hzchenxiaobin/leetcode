<svg xmlns="http://www.w3.org/2000/svg" width="780" height="380" viewBox="0 0 780 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="780" height="380" fill="#fafafa"/>
  <text x="390.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">196D：先找 s 的最长“好前缀” L，再从 p = L−1 往回试</text>
  <path d="M 142.67000000000013 46 Q 390.0 52 637.3299999999999 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60.0" y="70.0" width="660.0" height="60.0" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="96.0" text-anchor="start" font-size="11.0" fill="#33506e" filter="url(#rough2)">① 逐位检查 s，找到第一个出现坏回文的位置 ⇒ 最长好前缀长度 L。</text>
  <text x="74.0" y="118.0" text-anchor="start" font-size="11.0" fill="#33506e" filter="url(#rough2)">② 任何 t &gt; s 若在前 p 位与 s 相同，则 p &lt; L（否则前缀已经坏了）。</text>
  <rect x="60.0" y="146.0" width="660.0" height="60.0" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="172.0" text-anchor="start" font-size="10.9" fill="#8a6015" filter="url(#rough2)">③ p 从 min(L, n−1) 递减：把 s[p] 往上试（c &gt; s[p]），检查第 p 位不产生坏回文。</text>
  <text x="74.0" y="194.0" text-anchor="start" font-size="10.9" fill="#8a6015" filter="url(#rough2)">④ 之后从 p+1 开始贪心填最小可行字符；填不动就换下一个 c（或更小的 p）。</text>
  <rect x="60.0" y="224.0" width="630.0" height="30.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="68.0" y="247.0" text-anchor="start" font-size="10.8" font-weight="bold" fill="#26405c" filter="url(#rough2)">样例</text>
  <text x="138.0" y="247.0" text-anchor="start" font-size="10.8" font-weight="bold" fill="#26405c" filter="url(#rough2)">d</text>
  <text x="198.0" y="247.0" text-anchor="start" font-size="10.8" font-weight="bold" fill="#26405c" filter="url(#rough2)">s</text>
  <text x="458.0" y="247.0" text-anchor="start" font-size="10.8" font-weight="bold" fill="#26405c" filter="url(#rough2)">答案</text>
  <path d="M 60.0 224.0 L 690.0 224.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="68.0" y="277.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="138.0" y="277.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="198.0" y="277.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">aaaaaaa</text>
  <text x="458.0" y="277.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">aabbcaa</text>
  <path d="M 60.0 254.0 L 690.0 254.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="68.0" y="307.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="138.0" y="307.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="198.0" y="307.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">zzyzzzz</text>
  <text x="458.0" y="307.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">Impossible</text>
  <path d="M 60.0 284.0 L 690.0 284.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="68.0" y="337.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="138.0" y="337.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="198.0" y="337.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">abbabbbabbb</text>
  <text x="458.0" y="337.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">abbbcaaabab</text>
  <path d="M 60.0 314.0 L 690.0 314.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="60.0" y="360.0" text-anchor="start" font-size="10.6" fill="#6b6b6b" filter="url(#rough2)">“填不动就换”不需要回溯整串：某一位无字符可填 ⇒ 该 (p,c) 无解，换下一个。</text>
</svg>
