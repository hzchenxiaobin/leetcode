<svg xmlns="http://www.w3.org/2000/svg" width="700" height="400" viewBox="0 0 700 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="993"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="700" height="400" fill="#fafafa"/>
  <text x="350.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">等径盘子分组：P 与 F 两种搬运模式</text>
  <path d="M 112.0 42 Q 350.0 48 588.0 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="120.0" y="304" width="190" height="24" rx="5" fill="#dfe8f3" stroke="#5a5a5a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="123.0" y="278" width="184" height="24" rx="5" fill="#dfe8f3" stroke="#5a5a5a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="126.0" y="252" width="178" height="24" rx="5" fill="#dfe8f3" stroke="#5a5a5a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="129.0" y="226" width="172" height="24" rx="5" fill="#dfe8f3" stroke="#5a5a5a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="132.0" y="200" width="166" height="24" rx="5" fill="#dfe8f3" stroke="#5a5a5a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="336" y="240" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">组 1：5 个</text>
  <rect x="128.0" y="174" width="174" height="24" rx="5" fill="#fbeadb" stroke="#5a5a5a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="131.0" y="148" width="168" height="24" rx="5" fill="#fbeadb" stroke="#5a5a5a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="336" y="188" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">组 2：2 个</text>
  <rect x="136.0" y="122" width="158" height="24" rx="5" fill="#eef5ea" stroke="#5a5a5a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="139.0" y="96" width="152" height="24" rx="5" fill="#eef5ea" stroke="#5a5a5a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="142.0" y="70" width="146" height="24" rx="5" fill="#eef5ea" stroke="#5a5a5a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="336" y="110" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">组 3：3 个</text>
  <text x="60" y="356" text-anchor="middle" font-size="12" fill="#333333" filter="url(#rough2)">柱 1</text>
  <rect x="360" y="70" width="310" height="110" rx="10" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="515" y="94" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">P（保持顺序）</text>
  <text x="515" y="118" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">整组 m 个：先颠倒搬走 m−1 个</text>
  <text x="515" y="138" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">→ 搬最底下 1 个 → 再颠倒搬回</text>
  <text x="515" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">代价 2m − 1</text>
  <rect x="360" y="194" width="310" height="100" rx="10" fill="#ffffff" stroke="#d98c40" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="515" y="218" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">F（底组颠倒）</text>
  <text x="515" y="242" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">从顶到底逐个搬到目标</text>
  <text x="515" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">代价 m，顺序颠倒</text>
  <rect x="40" y="366" width="630" height="26" rx="6" fill="#f4f4f0" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="355" y="384" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">颠倒两次抵消 ⇒ 最优解让上面的塔来回搬两趟</text>
</svg>
