<svg xmlns="http://www.w3.org/2000/svg" width="740" height="380" viewBox="0 0 740 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="103"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="740" height="380" fill="#fafafa"/>
  <text x="370" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两种混色三元组：只要“单独那个点”与另外两点都无边</text>
  <path d="M 170 46 Q 370 52 570 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="120" y="78" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">① 1 个 0 侧 + 2 个 1 侧</text>
  <circle cx="120" cy="130" r="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="135" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">a1</text>
  <circle cx="60" cy="210" r="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">b1</text>
  <circle cx="200" cy="210" r="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">b2</text>
  <line x1="112" y1="152" x2="76" y2="192" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <line x1="128" y1="152" x2="184" y2="192" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="140" y="258" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#b85450" filter="url(#rough2)">虚线 = 不能有桥</text>
  <text x="130" y="288" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#4a7a3a" filter="url(#rough2)">b1—b2 同侧，天然无边</text>
  <text x="420" y="78" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">② 2 个 0 侧 + 1 个 1 侧</text>
  <circle cx="400" cy="130" r="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="400" y="135" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">a1</text>
  <circle cx="520" cy="130" r="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="520" y="135" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">a2</text>
  <circle cx="460" cy="210" r="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="460" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">b1</text>
  <line x1="422" y1="142" x2="444" y2="192" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <line x1="498" y1="142" x2="476" y2="192" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="460" y="258" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#446688" filter="url(#rough2)">a1—a2 同侧，天然无边</text>
  <text x="460" y="288" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#b85450" filter="url(#rough2)">虚线 = 不能有桥</text>
  <rect x="50" y="306" width="640" height="56" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="64" y="328" text-anchor="start" font-size="11" font-weight="bold" fill="#8a6015" filter="url(#rough2)">若某个 0 侧点在 1 侧有 ≥2 个非邻居 → 用 ①：一次去掉 1 个 0 侧、2 个 1 侧，</text>
  <text x="64" y="348" text-anchor="start" font-size="11" font-weight="normal" fill="#7a5a1b" filter="url(#rough2)">剩下 a−1、b−2 都被 3 整除。反之（每个 0 侧点至多漏 1 个）两个非邻居集必不相交，用 ②。</text>
</svg>
