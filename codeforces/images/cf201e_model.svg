<svg xmlns="http://www.w3.org/2000/svg" width="720" height="370" viewBox="0 0 720 370"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="370" fill="#fafafa"/>
  <text x="360.0" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">201E：请求 × 人的 0/1 矩阵</text>
  <path d="M 144.00 46 Q 360.0 52 576.00 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="70" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">把 k 次请求看成 k 行、n 个人看成 n 列；第 i 人第 r 行是 1 表示“第 r 次请求问了他”。</text>
  <text x="60" y="90" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">每行至多 m 个 1（一次最多问 m 个人）；每个人的列向量就是他的“签名”。</text>
  <rect x="140" y="116" width="46" height="46" fill="#8fbf86" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="163.0" y="143.0" text-anchor="middle" font-size="11" fill="#1f3a20" filter="url(#rough2)">1</text>
  <rect x="186" y="116" width="46" height="46" fill="#8fbf86" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="209.0" y="143.0" text-anchor="middle" font-size="11" fill="#1f3a20" filter="url(#rough2)">1</text>
  <rect x="232" y="116" width="46" height="46" fill="#ffffff" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="255.0" y="143.0" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <rect x="278" y="116" width="46" height="46" fill="#ffffff" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="301.0" y="143.0" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <rect x="324" y="116" width="46" height="46" fill="#ffffff" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="347.0" y="143.0" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <rect x="140" y="162" width="46" height="46" fill="#8fbf86" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="163.0" y="189.0" text-anchor="middle" font-size="11" fill="#1f3a20" filter="url(#rough2)">1</text>
  <rect x="186" y="162" width="46" height="46" fill="#ffffff" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="209.0" y="189.0" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <rect x="232" y="162" width="46" height="46" fill="#8fbf86" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="255.0" y="189.0" text-anchor="middle" font-size="11" fill="#1f3a20" filter="url(#rough2)">1</text>
  <rect x="278" y="162" width="46" height="46" fill="#ffffff" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="301.0" y="189.0" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <rect x="324" y="162" width="46" height="46" fill="#ffffff" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="347.0" y="189.0" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <rect x="140" y="208" width="46" height="46" fill="#ffffff" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="163.0" y="235.0" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <rect x="186" y="208" width="46" height="46" fill="#8fbf86" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="209.0" y="235.0" text-anchor="middle" font-size="11" fill="#1f3a20" filter="url(#rough2)">1</text>
  <rect x="232" y="208" width="46" height="46" fill="#8fbf86" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="255.0" y="235.0" text-anchor="middle" font-size="11" fill="#1f3a20" filter="url(#rough2)">1</text>
  <rect x="278" y="208" width="46" height="46" fill="#ffffff" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="301.0" y="235.0" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <rect x="324" y="208" width="46" height="46" fill="#8fbf86" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="347.0" y="235.0" text-anchor="middle" font-size="11" fill="#1f3a20" filter="url(#rough2)">1</text>
  <text x="163.0" y="270" text-anchor="middle" font-size="10" fill="#33506e" filter="url(#rough2)">p1</text>
  <text x="209.0" y="270" text-anchor="middle" font-size="10" fill="#33506e" filter="url(#rough2)">p2</text>
  <text x="255.0" y="270" text-anchor="middle" font-size="10" fill="#33506e" filter="url(#rough2)">p3</text>
  <text x="301.0" y="270" text-anchor="middle" font-size="10" fill="#33506e" filter="url(#rough2)">p4</text>
  <text x="347.0" y="270" text-anchor="middle" font-size="10" fill="#33506e" filter="url(#rough2)">p5</text>
  <text x="128" y="143.0" text-anchor="end" font-size="10" fill="#33506e" filter="url(#rough2)">R1</text>
  <text x="128" y="189.0" text-anchor="end" font-size="10" fill="#33506e" filter="url(#rough2)">R2</text>
  <text x="128" y="235.0" text-anchor="end" font-size="10" fill="#33506e" filter="url(#rough2)">R3</text>
  <text x="480" y="150" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">行和 ≤ m = 2</text>
  <text x="480" y="174" text-anchor="start" font-size="11" fill="#8a3a52" filter="url(#rough2)">列向量（签名）必须两两不同，</text>
  <text x="480" y="196" text-anchor="start" font-size="11" fill="#8a3a52" filter="url(#rough2)">否则这两个人永远无法区分。</text>
  <text x="480" y="228" text-anchor="start" font-size="10.5" fill="#8a6015" filter="url(#rough2)">p4、p5 的签名都是 (0,0,0)</text>
  <text x="480" y="250" text-anchor="start" font-size="10.5" fill="#8a6015" filter="url(#rough2)">⇒ 这组请求区分不出这两人</text>
  <rect x="60" y="286" width="600" height="56" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="304" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">于是问题变成：最少用多少个请求 k，才能凑出 n 个互不相同的列、且每行至多 m 个 1？</text>
  <text x="74" y="326" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">答案对 k 单调，二分 k 即可。</text>
</svg>
