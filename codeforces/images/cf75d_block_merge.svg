<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="720" height="330" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">一个块只保留四个量：T、P、S、M</text>

  <!-- 第 1 行：前缀 -->
  <g filter="url(#rough2)">
    <rect x="40" y="56" width="44" height="36" fill="#8fbf6f" stroke="#3f6b2f" stroke-width="1.4"/>
    <rect x="88" y="56" width="44" height="36" fill="#8fbf6f" stroke="#3f6b2f" stroke-width="1.4"/>
    <rect x="136" y="56" width="44" height="36" fill="#8fbf6f" stroke="#3f6b2f" stroke-width="1.4"/>
    <rect x="184" y="56" width="44" height="36" fill="#f4f4f0" stroke="#a8a8a2" stroke-width="1.2"/>
    <rect x="232" y="56" width="44" height="36" fill="#f4f4f0" stroke="#a8a8a2" stroke-width="1.2"/>
    <rect x="280" y="56" width="44" height="36" fill="#f4f4f0" stroke="#a8a8a2" stroke-width="1.2"/>
  </g>
  <g font-size="14" fill="#2b3a4a" text-anchor="middle" filter="url(#rough2)">
    <text x="62" y="80">1</text>
    <text x="110" y="80">6</text>
    <text x="158" y="80">-2</text>
    <text x="206" y="80">3</text>
    <text x="254" y="80">-5</text>
    <text x="302" y="80">2</text>
  </g>
  <text x="346" y="80" font-size="12.5" fill="#2f5223" filter="url(#rough2)">P：最大前缀和（非空）</text>

  <!-- 第 2 行：后缀 -->
  <g filter="url(#rough2)">
    <rect x="40" y="116" width="44" height="36" fill="#f4f4f0" stroke="#a8a8a2" stroke-width="1.2"/>
    <rect x="88" y="116" width="44" height="36" fill="#f4f4f0" stroke="#a8a8a2" stroke-width="1.2"/>
    <rect x="136" y="116" width="44" height="36" fill="#f4f4f0" stroke="#a8a8a2" stroke-width="1.2"/>
    <rect x="184" y="116" width="44" height="36" fill="#cfe0f0" stroke="#446688" stroke-width="1.4"/>
    <rect x="232" y="116" width="44" height="36" fill="#cfe0f0" stroke="#446688" stroke-width="1.4"/>
    <rect x="280" y="116" width="44" height="36" fill="#cfe0f0" stroke="#446688" stroke-width="1.4"/>
  </g>
  <g font-size="14" fill="#2b3a4a" text-anchor="middle" filter="url(#rough2)">
    <text x="62" y="140">1</text>
    <text x="110" y="140">6</text>
    <text x="158" y="140">-2</text>
    <text x="206" y="140">3</text>
    <text x="254" y="140">-5</text>
    <text x="302" y="140">2</text>
  </g>
  <text x="346" y="140" font-size="12.5" fill="#33475c" filter="url(#rough2)">S：最大后缀和（非空）</text>

  <!-- 第 3 行：最大子段 -->
  <g filter="url(#rough2)">
    <rect x="40" y="176" width="44" height="36" fill="#f4f4f0" stroke="#a8a8a2" stroke-width="1.2"/>
    <rect x="88" y="176" width="44" height="36" fill="#f5e6c8" stroke="#c9a227" stroke-width="1.4"/>
    <rect x="136" y="176" width="44" height="36" fill="#f5e6c8" stroke="#c9a227" stroke-width="1.4"/>
    <rect x="184" y="176" width="44" height="36" fill="#f5e6c8" stroke="#c9a227" stroke-width="1.4"/>
    <rect x="232" y="176" width="44" height="36" fill="#f4f4f0" stroke="#a8a8a2" stroke-width="1.2"/>
    <rect x="280" y="176" width="44" height="36" fill="#f4f4f0" stroke="#a8a8a2" stroke-width="1.2"/>
  </g>
  <g font-size="14" fill="#2b3a4a" text-anchor="middle" filter="url(#rough2)">
    <text x="62" y="200">1</text>
    <text x="110" y="200">6</text>
    <text x="158" y="200">-2</text>
    <text x="206" y="200">3</text>
    <text x="254" y="200">-5</text>
    <text x="302" y="200">2</text>
  </g>
  <text x="346" y="200" font-size="12.5" fill="#8a6015" filter="url(#rough2)">M：最大子段和（非空）</text>

  <!-- 公式块 -->
  <g filter="url(#rough2)">
    <rect x="40" y="232" width="640" height="76" rx="8" fill="#fcfcfa" stroke="#c8c2b6" stroke-width="1.3"/>
  </g>
  <g font-size="12.5" fill="#2b3a4a" filter="url(#rough2)">
    <text x="58" y="256">T(X·Y) = T(X) + T(Y)　　P(X·Y) = max(P(X), T(X) + P(Y))</text>
    <text x="58" y="278">S(X·Y) = max(S(Y), T(Y) + S(X))</text>
    <text x="58" y="300">M(X·Y) = max(M(X), M(Y), S(X) + P(Y))　← 跨界子段 = X 的后缀 + Y 的前缀</text>
  </g>
</svg>
