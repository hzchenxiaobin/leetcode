<svg xmlns="http://www.w3.org/2000/svg" width="840" height="320" viewBox="0 0 840 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="320" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">多数表决：三取二</text>
  <g filter="url(#rough2)"><circle cx="180" cy="130" r="30" fill="#d6e6f2" fill-opacity="0.9" stroke="#667788" stroke-width="1.6"/></g>
  <text x="180" y="136" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">P</text>
  <text x="180" y="180" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">Petya</text>
  <g filter="url(#rough2)"><circle cx="360" cy="130" r="30" fill="#d7ecd0" fill-opacity="0.9" stroke="#667788" stroke-width="1.6"/></g>
  <text x="360" y="136" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">V</text>
  <text x="360" y="180" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">Vasya</text>
  <g filter="url(#rough2)"><circle cx="540" cy="130" r="30" fill="#f6e3c4" fill-opacity="0.9" stroke="#667788" stroke-width="1.6"/></g>
  <text x="540" y="136" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">T</text>
  <text x="540" y="180" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">Tonya</text>
  <text x="420" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">至少两人为 1 ⇒ 做题</text>
  <text x="420" y="262" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">等价于三个输入之和 ≥ 2</text>
  <g filter="url(#rough2)"><rect x="240" y="282" width="360" height="34" rx="4" fill="#f7fbf4" fill-opacity="0.85" stroke="#a8c99a" stroke-width="1.3"/></g>
  <text x="420" y="304" text-anchor="middle" font-size="12" font-weight="bold" fill="#3d6b2f" filter="url(#rough2)">O(n)，n ≤ 1000</text>
</svg>
