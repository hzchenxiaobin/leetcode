<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="720" height="400" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按 M=2(k+1) 取模后的必败带</text>
  <path d="M 170 42 Q 360 48 550 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="40" y="84" font-size="11.5" fill="#555" filter="url(#rough2)">以 k=2（M=6）为例，r = a mod 6：</text>

  <g filter="url(#rough2)">
    <rect x="80" y="110" width="80" height="60" fill="#cfe8cf" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="160" y="110" width="80" height="60" fill="#cfe8cf" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="240" y="110" width="80" height="60" fill="#f5f5f5" stroke="#999" stroke-width="1.2"/>
    <rect x="320" y="110" width="80" height="60" fill="#fde8c8" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="400" y="110" width="80" height="60" fill="#fde8c8" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="480" y="110" width="80" height="60" fill="#f5f5f5" stroke="#999" stroke-width="1.2"/>
  </g>
  <g font-size="14" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">
    <text x="120" y="146">0</text><text x="200" y="146">1</text><text x="280" y="146">2</text>
    <text x="360" y="146">3</text><text x="440" y="146">4</text><text x="520" y="146">5</text>
  </g>
  <text x="160" y="192" text-anchor="middle" font-size="10.5" fill="#2f5223" filter="url(#rough2)">偶差 d 的必败带</text>
  <text x="440" y="192" text-anchor="middle" font-size="10.5" fill="#8a6015" filter="url(#rough2)">奇差 d 的必败带</text>
  <text x="280" y="192" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">过渡</text>
  <text x="520" y="192" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">过渡</text>

  <rect x="80" y="222" width="560" height="52" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <g font-size="11.5" fill="#2f4a66" filter="url(#rough2)">
    <text x="96" y="246">偶差：r &lt; k 为必败；奇差：k+1 ≤ r ≤ 2k 为必败。</text>
    <text x="96" y="266">r = k 与 r = 2k+1 是两种奇偶之间的过渡，不属于任何必败带。</text>
  </g>

  <rect x="40" y="300" width="640" height="72" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <g font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">
    <text x="56" y="326">公式：a≤b，d=b−a，M=2(k+1)，r=a mod M。</text>
    <text x="56" y="350">k=1 时公式退化，需单独用"a、b 均为偶数"判定；k≥2 时上述分区成立。</text>
  </g>
</svg>
