<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="440" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">A1 的三重循环：逐 k、逐 i、逐位移</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="150.0" y="78.0" width="400.0" height="46.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="166.0" y="104.5" text-anchor="start" font-size="12.5" fill="#3f3420" filter="url(#rough2)">for k = 1 .. n-1</text>
  <rect x="150.0" y="144.0" width="400.0" height="46.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="166.0" y="170.5" text-anchor="start" font-size="12.5" fill="#3f3420" filter="url(#rough2)">for i = 1 .. k</text>
  <line x1="350.0" y1="124.0" x2="350.0" y2="140.0" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150.0" y="210.0" width="400.0" height="46.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="166.0" y="236.5" text-anchor="start" font-size="12.5" fill="#3f3420" filter="url(#rough2)">for N = k+1-i .. n-i</text>
  <line x1="350.0" y1="190.0" x2="350.0" y2="206.0" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150.0" y="276.0" width="400.0" height="46.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="166.0" y="302.5" text-anchor="start" font-size="12.5" fill="#3f3420" filter="url(#rough2)">best = min(best, popcount(N))</text>
  <line x1="350.0" y1="256.0" x2="350.0" y2="272.0" stroke="#8a6015" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150.0" y="342.0" width="400.0" height="46.0" fill="#f3e8fd" stroke="#6b4c9a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="166.0" y="368.5" text-anchor="start" font-size="12.5" fill="#3f3420" filter="url(#rough2)">ans += a[i] * best</text>
  <line x1="350.0" y1="322.0" x2="350.0" y2="338.0" stroke="#6b4c9a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="566.0" y="104.0" text-anchor="start" font-size="11.5" fill="#555" filter="url(#rough2)">n-1 个答案</text>
  <text x="566.0" y="236.0" text-anchor="start" font-size="11.5" fill="#555" filter="url(#rough2)">最多 n 次</text>
  <text x="566.0" y="302.0" text-anchor="start" font-size="11.5" fill="#555" filter="url(#rough2)">最多 n 次 → O(n³)</text>
  <text x="40.0" y="414.0" text-anchor="start" font-size="12.5" fill="#444" filter="url(#rough2)">总运算量约 n³/6：n ≤ 300 时约 4.5×10⁶，足够。</text>
</svg>
