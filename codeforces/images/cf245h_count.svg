<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="720" height="290" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">容斥的几何含义：把 [i,j] 的回文子串按「是否用左端 i」拆开</text>
  <rect x="60" y="60" width="230" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="175" y="87" text-anchor="middle" font-size="11.5" fill="#2f5223">以 i 开头的回文子串：</text>
  <text x="175" y="101" text-anchor="middle" font-size="11.5" fill="#2f5223">由 pal[i][j] 逐个累加</text>
  <rect x="60" y="160" width="230" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="175" y="194" text-anchor="middle" font-size="11.5" fill="#2f4a66">不用 i 的：全在 [i+1, j] 里</text>
  <rect x="360" y="60" width="300" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="510" y="94" text-anchor="middle" font-size="11" fill="#2f4a66">cnt[i+1][j]：区间 [i+1, j] 的总数</text>
  <rect x="360" y="160" width="300" height="60" rx="8" fill="#fde9d9" stroke="#b4652a" stroke-width="1.5"/>
  <text x="510" y="187" text-anchor="middle" font-size="11" fill="#7a4b22">cnt[i][j−1] − cnt[i+1][j−1]：</text>
  <text x="510" y="201" text-anchor="middle" font-size="11" fill="#7a4b22">用 i 但不用 j 的部分</text>
  <text x="40" y="256" text-anchor="start" font-size="11.5" fill="#4a2a62" filter="url(#rough2)">两项合并即得 cnt[i][j] = cnt[i+1][j] + cnt[i][j−1] − cnt[i+1][j−1] + pal[i][j]</text>
  <text x="40" y="280" text-anchor="start" font-size="11.5" fill="#7a4b22" filter="url(#rough2)">边界：i+1 &gt; j 或 j−1 &lt; i 时对应项视为 0</text>
</svg>
