<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 346" width="640" height="346">
<defs>
<filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="13" result="noise"/>
<feDisplacementMap in="SourceGraphic" in2="noise" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect x="0" y="0" width="640" height="346" fill="#fafafa"/>
<g font-family="Comic Sans MS, Kaiti SC, cursive">
<text x="320.0" y="24.0" font-size="15" fill="#33475b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">补事件：先算「队友全来自别的系」，再用 1 减</text>
<rect x="70.0" y="70.0" width="500.0" height="90.0" rx="10" fill="#ffffff" stroke="#9ab" stroke-width="1.8" filter="url(#rough2)"/>
<text x="320.0" y="96.0" font-size="13" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">全部 C(S-1, n-1) 种组队方式</text>
<rect x="80.0" y="110.0" width="330.0" height="40.0" rx="8" fill="#f3c9c9" stroke="#b05a5a" stroke-width="1.8" filter="url(#rough2)"/>
<text x="245.0" y="136.0" font-size="12" fill="#a04a4a" text-anchor="middle" font-weight="normal" filter="url(#rough2)">队友全部来自别的系：C(O, n-1) 种</text>
<rect x="414.0" y="110.0" width="146.0" height="40.0" rx="8" fill="#cfe3d4" stroke="#4f7f60" stroke-width="1.8" filter="url(#rough2)"/>
<text x="487.0" y="136.0" font-size="12" fill="#3f6b4f" text-anchor="middle" font-weight="normal" filter="url(#rough2)">至少一个</text>
<text x="320.0" y="196.0" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">P(至少一名同系队友) = 1 − C(O, n-1) / C(S-1, n-1)</text>
<text x="320.0" y="230.0" font-size="12" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">其中 O = S − s_h 是「别的系」的总人数</text>
<rect x="150.0" y="252.0" width="340.0" height="60.0" rx="8" fill="#eef4fb" stroke="#7a93a8" stroke-width="1.6" filter="url(#rough2)"/>
<text x="320.0" y="278.0" font-size="12" fill="#4a6a8a" text-anchor="middle" font-weight="normal" filter="url(#rough2)">直接算大组合数会溢出/丢精度</text>
<text x="320.0" y="300.0" font-size="12" fill="#4a6a8a" text-anchor="middle" font-weight="normal" filter="url(#rough2)">→ 用连乘逐步算</text>
<text x="320.0" y="330.0" font-size="12" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">边界：S &lt; n 输出 -1；n = 1 输出 0；O &lt; n-1 时概率为 1</text>
</g>
</svg>
