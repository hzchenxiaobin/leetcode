<svg xmlns="http://www.w3.org/2000/svg" width="720" height="410" viewBox="0 0 720 410"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="720" height="410" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">三个样例的 1 位置与间隔</text>
  <path d="M 190 42 Q 360 48 530 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 样例 1 -->
  <text x="40" y="78" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">样例 1：00111000（位置 2,3,4）</text>
  <line x1="120" y1="120" x2="600" y2="120" stroke="#2b2b2b" stroke-width="1.3" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <circle cx="220" cy="120" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="280" cy="120" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="340" cy="120" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <g font-size="10" text-anchor="middle" fill="#a33a36" filter="url(#rough2)">
    <text x="250" y="144">1</text><text x="310" y="144">1</text>
  </g>
  <text x="620" y="124" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">YES</text>

  <!-- 样例 2 -->
  <text x="40" y="196" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">样例 2：1001011（位置 0,3,5,6）</text>
  <line x1="120" y1="238" x2="600" y2="238" stroke="#2b2b2b" stroke-width="1.3" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <circle cx="140" cy="238" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="300" cy="238" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="400" cy="238" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="440" cy="238" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <g font-size="10" text-anchor="middle" fill="#a33a36" filter="url(#rough2)">
    <text x="220" y="262">3</text><text x="350" y="262">2</text><text x="420" y="262">1</text>
  </g>
  <text x="620" y="242" font-size="12" font-weight="bold" fill="#a33a36" filter="url(#rough2)">NO</text>

  <!-- 样例 3 -->
  <text x="40" y="314" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">样例 3：1010100（位置 0,2,4）</text>
  <line x1="120" y1="356" x2="600" y2="356" stroke="#2b2b2b" stroke-width="1.3" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <circle cx="140" cy="356" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="260" cy="356" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="380" cy="356" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <g font-size="10" text-anchor="middle" fill="#a33a36" filter="url(#rough2)">
    <text x="200" y="380">2</text><text x="320" y="380">2</text>
  </g>
  <text x="620" y="360" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">YES</text>

  <text x="40" y="400" font-size="11" fill="#555" filter="url(#rough2)">位置按 0 起下标；标出的数字是相邻 1 的距离。</text>
</svg>
