<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="320" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">从最大的开始，每次让前缀和的绝对值不超过当前 a_i</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">因为 a_i ≤ a_{i+1} ≤ 2a_i，"往回走"总能落进 [-a_i, a_i]</text>
  <text x="150" y="110" text-anchor="start" font-size="13" fill="#2b2b2b" filter="url(#rough2)">不变量：处理完后缀 i..n 后，部分和 S ∈ [-a_i, a_i]</text>
  <text x="150" y="146" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">S &gt; 0 → 接下来取 -a_i；S ≤ 0 → 取 +a_i</text>
  <text x="150" y="178" text-anchor="start" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">|S| ≤ a_{i+1} ≤ 2a_i ⇒ |S - a_i| ≤ a_i（或 |S + a_i| ≤ a_i）</text>
  <text x="150" y="214" text-anchor="start" font-size="12.5" fill="#b05a5a" filter="url(#rough2)">最后 S ∈ [-a_1, a_1]，若为负则整串符号取反</text>
  <text x="440" y="280" text-anchor="middle" font-size="13" fill="#555555" filter="url(#rough2)">结果落在 [0, a_1]</text>
</svg>
