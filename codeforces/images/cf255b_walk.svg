<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="300" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2：yxyxy → y</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">y 比 x 多 1 个，最终只剩一个 y</text>
  <text x="140" y="110" text-anchor="start" font-size="20" fill="#2b2b2b" filter="url(#rough2)">yxyxy</text>
  <text x="330" y="110" text-anchor="start" font-size="13" fill="#555555" filter="url(#rough2)">#y = 3, #x = 2</text>
  <text x="330" y="146" text-anchor="start" font-size="13" fill="#3d6b2f" filter="url(#rough2)">|3 - 2| = 1 → 剩 1 个 y</text>
  <text x="330" y="182" text-anchor="start" font-size="14" fill="#b05a5a" filter="url(#rough2)">输出 "y"</text>
  <text x="140" y="250" text-anchor="start" font-size="13" fill="#555555" filter="url(#rough2)">样例 3：xxxxxy → xxxx（x 多 4 个）</text>
</svg>
