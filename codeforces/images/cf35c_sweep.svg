<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="241"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="320" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两遍扫描：源点 0 向外逐格 +1</text>
  <g filter="url(#rough2)">
    <rect x="60" y="56" width="260" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="190" y="82" text-anchor="middle" font-size="13" fill="#2f4a66">正向：上、左邻居 +1</text>
    <rect x="380" y="56" width="260" height="40" rx="8" fill="#eef4ec" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="510" y="82" text-anchor="middle" font-size="13" fill="#2f5223">反向：下、右邻居 +1</text>
  </g>
  <g font-size="12" fill="#555" filter="url(#rough2)">
    <text x="190" y="118" text-anchor="middle">从左上角开始传播</text>
    <text x="190" y="138" text-anchor="middle">（处理"从上/左来"的路径）</text>
    <text x="510" y="118" text-anchor="middle">从右下角开始传播</text>
    <text x="510" y="138" text-anchor="middle">（处理"从下/右来"的路径）</text>
  </g>
  <g stroke="#8a94a6" stroke-width="1.4" filter="url(#rough2)">
    <line x1="190" y1="150" x2="190" y2="186" marker-end="url(#ar)"/>
    <line x1="510" y1="150" x2="510" y2="186" marker-end="url(#ar)"/>
  </g>
  <rect x="200" y="192" width="320" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="220" text-anchor="middle" font-size="13" fill="#8a6015">两遍后 d[i][j] = 到最近源点的曼哈顿距离</text>
  <rect x="70" y="252" width="580" height="52" rx="9" fill="#f4f6f9" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="86" y="276" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">复杂度 O(NM)，与源点数 K 无关；N,M ≤ 2000 时共 4×10⁶ 个格子。</text>
  <text x="86" y="296" font-size="12" fill="#2f4a66" filter="url(#rough2)">答案就是距离最大的格子（并列时任意一个）。</text>
</svg>
