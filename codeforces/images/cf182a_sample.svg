<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="780" height="400" fill="#fafafa"/>
  <text x="390.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1：a=2, b=4，A=(0,5), B=(6,5)，答案 3·6+1 = 19</text>
  <path d="M 137.31500000000014 46 Q 390.0 52 642.6849999999998 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="70.0" y="80.0" width="300.0" height="180.0" rx="6" fill="#fafafa" stroke="#6b6b6b" stroke-width="1.0" filter="url(#rough2)"/>
  <path d="M 120.0 80.0 L 120.0 260.0" stroke="#dddddd" stroke-width="0.8" fill="none" filter="url(#rough2)"/>
  <path d="M 70.0 130.0 L 370.0 130.0" stroke="#dddddd" stroke-width="0.8" fill="none" filter="url(#rough2)"/>
  <circle cx="120.0" cy="250.0" r="5.0" fill="#d6a040" stroke="#d6a040" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="112.0" y="268.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6015" filter="url(#rough2)">A</text>
  <path d="M 300.0 130.0 L 300.0 200.0" stroke="#446688" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <text x="300.0" y="216.0" text-anchor="middle" font-size="10.4" fill="#446688" filter="url(#rough2)">T3 (x=6)</text>
  <path d="M 120.0 90.0 L 120.0 150.0" stroke="#446688" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <text x="132.0" y="100.0" text-anchor="start" font-size="10.4" fill="#446688" filter="url(#rough2)">T1</text>
  <path d="M 160.0 240.0 L 240.0 240.0" stroke="#446688" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <text x="200.0" y="256.0" text-anchor="middle" font-size="10.4" fill="#446688" filter="url(#rough2)">T2</text>
  <circle cx="330.0" cy="130.0" r="5.0" fill="#d6a040" stroke="#d6a040" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="342.0" y="128.0" text-anchor="start" font-size="11" font-weight="bold" fill="#8a6015" filter="url(#rough2)">B</text>
  <rect x="430.0" y="84.0" width="350.0" height="42.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="438.0" y="119.0" text-anchor="start" font-size="10.6" font-weight="bold" fill="#26405c" filter="url(#rough2)">阶段</text>
  <text x="548.0" y="119.0" text-anchor="start" font-size="10.6" font-weight="bold" fill="#26405c" filter="url(#rough2)">位置</text>
  <text x="698.0" y="119.0" text-anchor="start" font-size="10.6" font-weight="bold" fill="#26405c" filter="url(#rough2)">累计时间</text>
  <path d="M 430.0 84.0 L 780.0 84.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="438.0" y="161.0" text-anchor="start" font-size="10.6" fill="#2b2b2b" filter="url(#rough2)">第 1 次充能</text>
  <text x="548.0" y="161.0" text-anchor="start" font-size="10.6" fill="#2b2b2b" filter="url(#rough2)">A → T1（dist=1 ≤ 2）</text>
  <text x="698.0" y="161.0" text-anchor="start" font-size="10.6" fill="#2b2b2b" filter="url(#rough2)">躲过 1 次射击</text>
  <path d="M 430.0 126.0 L 780.0 126.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="438.0" y="203.0" text-anchor="start" font-size="10.6" fill="#2b2b2b" filter="url(#rough2)">第 2 次充能</text>
  <text x="548.0" y="203.0" text-anchor="start" font-size="10.6" fill="#2b2b2b" filter="url(#rough2)">T1 → T2（dist=1）</text>
  <text x="698.0" y="203.0" text-anchor="start" font-size="10.6" fill="#2b2b2b" filter="url(#rough2)">躲过 2 次射击</text>
  <path d="M 430.0 168.0 L 780.0 168.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="438.0" y="245.0" text-anchor="start" font-size="10.6" fill="#2b2b2b" filter="url(#rough2)">第 3 次充能</text>
  <text x="548.0" y="245.0" text-anchor="start" font-size="10.6" fill="#2b2b2b" filter="url(#rough2)">T2 → T3（dist=2）</text>
  <text x="698.0" y="245.0" text-anchor="start" font-size="10.6" fill="#2b2b2b" filter="url(#rough2)">躲过 3 次射击</text>
  <path d="M 430.0 210.0 L 780.0 210.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="438.0" y="287.0" text-anchor="start" font-size="10.6" fill="#2b2b2b" filter="url(#rough2)">最后</text>
  <text x="548.0" y="287.0" text-anchor="start" font-size="10.6" fill="#2b2b2b" filter="url(#rough2)">T3 → B（dist=1）</text>
  <text x="698.0" y="287.0" text-anchor="start" font-size="10.6" fill="#2b2b2b" filter="url(#rough2)">3×6+1 = 19</text>
  <path d="M 430.0 252.0 L 780.0 252.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="430.0" y="330.0" text-anchor="start" font-size="10.8" fill="#6b6b6b" filter="url(#rough2)">dist(A,B)=6 &gt; a=2，不能直接冲；每躲一次射击代价 a+b=6 秒。</text>
</svg>
