<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-6%" y="-6%" width="112%" height="112%"><feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="401" /><feDisplacementMap in="SourceGraphic" scale="1.5" /></filter></defs>
  <rect width="760" height="430" fill="#fafafa" />
  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">正方体顶点：至少有一个坐标相同 ⇔ 在同一个面上</text>
  <path d="M 110 44 Q 380 50 650 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)" />

  
  <g fill="none" stroke="#446688" stroke-width="1.6">
    <rect x="150" y="140" width="260" height="200" filter="url(#rough2)" />
    <rect x="270" y="90" width="260" height="200" filter="url(#rough2)" />
    <line x1="150" y1="140" x2="270" y2="90" filter="url(#rough2)" />
    <line x1="410" y1="140" x2="530" y2="90" filter="url(#rough2)" />
    <line x1="150" y1="340" x2="270" y2="290" filter="url(#rough2)" />
    <line x1="410" y1="340" x2="530" y2="290" filter="url(#rough2)" />
  </g>

  <circle cx="150" cy="140" r="6" fill="#b85450" filter="url(#rough2)" />
  <circle cx="270" cy="90" r="6" fill="#4a7a3a" filter="url(#rough2)" />
  <text x="110" y="128" font-size="10" fill="#8a3b36" filter="url(#rough2)">(0,0,0)</text>
  <text x="282" y="84" font-size="10" fill="#2f5223" filter="url(#rough2)">(0,1,0)</text>

  <text x="150" y="366" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">共享 x=0 面 ⇒ YES</text>

  <rect x="580" y="120" width="160" height="200" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)" />
  <text x="660" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">六个面</text>
  <text x="598" y="176" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">x=0 / x=1</text>
  <text x="598" y="200" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">y=0 / y=1</text>
  <text x="598" y="224" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">z=0 / z=1</text>
  <text x="598" y="258" font-size="10.5" fill="#555" filter="url(#rough2)">两个顶点同面</text>
  <text x="598" y="278" font-size="10.5" fill="#555" filter="url(#rough2)">⇔ 某个坐标相等</text>
  <text x="598" y="302" font-size="10.5" fill="#2f5223" filter="url(#rough2)">O(1) 判断</text>

  <rect x="40" y="380" width="500" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)" />
  <text x="58" y="402" font-size="11.5" fill="#2f5223" filter="url(#rough2)">只要 x1=x2 或 y1=y2 或 z1=z2，就输出 YES；否则 NO。</text>
</svg>