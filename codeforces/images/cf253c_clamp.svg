<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="400" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">竖直键只减不增：列号被夹到行末</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">所以会经过哪些行才是关键——它一定是含 r1、r2 的一段区间 [L, R]</text>
  <text x="96" y="132" text-anchor="end" font-size="13" fill="#555555" filter="url(#rough2)">第 1 行</text>
  <g filter="url(#rough2)"><rect x="110" y="106" width="400" height="40" rx="3" fill="#d7ecd0" fill-opacity="0.55" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="96" y="206" text-anchor="end" font-size="13" fill="#555555" filter="url(#rough2)">第 2 行</text>
  <g filter="url(#rough2)"><rect x="110" y="180" width="94" height="40" rx="3" fill="#f6e3c4" fill-opacity="0.55" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="96" y="280" text-anchor="end" font-size="13" fill="#555555" filter="url(#rough2)">第 3 行</text>
  <g filter="url(#rough2)"><rect x="110" y="254" width="400" height="40" rx="3" fill="#d7ecd0" fill-opacity="0.55" stroke="#8899aa" stroke-width="1.2"/></g>
  <g filter="url(#rough2)"><rect x="416" y="106" width="34" height="40" rx="4" fill="#cfe0f0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="433.0" y="130.68" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">10</text>
  <g filter="url(#rough2)"><rect x="144" y="180" width="34" height="40" rx="4" fill="#cfe0f0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="161.0" y="204.68" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="144" y="254" width="34" height="40" rx="4" fill="#cfe0f0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="161.0" y="278.68" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <line x1="433" y1="148" x2="161" y2="178" stroke="#b05a5a" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="560" y="150" text-anchor="start" font-size="12.5" fill="#b05a5a" filter="url(#rough2)">下移：第 2 行只有 1 个字符</text>
  <text x="560" y="172" text-anchor="start" font-size="12.5" fill="#b05a5a" filter="url(#rough2)">列 10 被夹成 2</text>
  <line x1="161" y1="222" x2="161" y2="254" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="150" y="246" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">再下移：列 2 不变</text>
  <text x="440" y="360" text-anchor="middle" font-size="13" fill="#3d6b2f" filter="url(#rough2)">对每个 [L, R]：竖直步数 + |c2 - min(c1, 各行 a_i+1)| 即该区间的代价</text>
  <text x="440" y="384" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">枚举 O(n^2) 个区间取最小；横向键全部推迟到第 r2 行再按</text>
</svg>
