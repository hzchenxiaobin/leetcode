  <path d="M 495.0 194 L 539.0 252" stroke="#9aa8b8" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="300" y="78" width="120" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
