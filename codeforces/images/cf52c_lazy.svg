      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="720" height="410" fill="#fafafa"/>
  <text x="360.0" y="33" font-size="20" font-weight="bold" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">线段树：整段加就打标记，部分覆盖先下传</text>
  <path d="M 261 44 Q 360.0 50 459 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 360.0 116 L 215.0 158" stroke="#9aa8b8" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
