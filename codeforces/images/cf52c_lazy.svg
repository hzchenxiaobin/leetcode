  <text x="360.0" y="108" font-size="10" font-weight="normal" fill="#555" text-anchor="middle" filter="url(#rough2)">min 1</text>
  <rect x="160" y="158" width="110" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="215.0" y="174" font-size="11" font-weight="bold" fill="#22303f" text-anchor="middle" filter="url(#rough2)">[0,1]</text>
  <text x="215.0" y="188" font-size="10" font-weight="normal" fill="#555" text-anchor="middle" filter="url(#rough2)">min 1</text>
  <rect x="440" y="158" width="110" height="36" rx="6" fill="#fff8e1" stroke="#b08a2e" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="495.0" y="174" font-size="11" font-weight="bold" fill="#22303f" text-anchor="middle" filter="url(#rough2)">[2,3]</text>
  <text x="495.0" y="188" font-size="10" font-weight="normal" fill="#555" text-anchor="middle" filter="url(#rough2)">min 5</text>
  <rect x="100" y="252" width="78" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="139.0" y="268" font-size="11" font-weight="bold" fill="#22303f" text-anchor="middle" filter="url(#rough2)">[0]</text>
  <text x="139.0" y="282" font-size="10" font-weight="normal" fill="#555" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="220" y="252" width="78" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="259.0" y="268" font-size="11" font-weight="bold" fill="#22303f" text-anchor="middle" filter="url(#rough2)">[1]</text>
  <text x="259.0" y="282" font-size="10" font-weight="normal" fill="#555" text-anchor="middle" filter="url(#rough2)">4</text>
  <rect x="380" y="252" width="78" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="419.0" y="268" font-size="11" font-weight="bold" fill="#22303f" text-anchor="middle" filter="url(#rough2)">[2]</text>
  <text x="419.0" y="282" font-size="10" font-weight="normal" fill="#555" text-anchor="middle" filter="url(#rough2)">3</text>
  <rect x="500" y="252" width="78" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="539.0" y="268" font-size="11" font-weight="bold" fill="#22303f" text-anchor="middle" filter="url(#rough2)">[3]</text>
  <text x="539.0" y="282" font-size="10" font-weight="normal" fill="#555" text-anchor="middle" filter="url(#rough2)">4</text>
  <text x="558" y="174" font-size="11" font-weight="bold" fill="#b08a2e" text-anchor="start" filter="url(#rough2)">tag +2</text>
  <text x="558" y="188" font-size="10" font-weight="normal" fill="#555" text-anchor="start" filter="url(#rough2)">mn: 3 → 5</text>
  <rect x="40" y="316" width="640" height="60" rx="8" fill="#f3f6fa" stroke="#9aa8b8" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="56" y="338" font-size="11.5" font-weight="bold" fill="#2b2b2b" text-anchor="start" filter="url(#rough2)">对 [1,3] 加 2：</text>
  <text x="56" y="360" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" filter="url(#rough2)">① [2,3] 完全覆盖：mn 与 tag 各 +2；② 叶子 [1] 同理；③ 回溯：mn[父] = min(子)</text>
  <text x="360" y="396" font-size="10.5" font-weight="normal" fill="#666" text-anchor="middle" filter="url(#rough2)">查询走到部分覆盖的子树前，必须把祖先的 tag 下传给两个孩子</text>
</svg>
