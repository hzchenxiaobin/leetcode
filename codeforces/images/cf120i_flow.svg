  <path d="M 124.8 42 Q 390.0 48 655.1999999999999 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="390.0" y="206" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">O(n log n)</text>
