  <line x1="163.8" y1="107.0" x2="173.8" y2="107.0" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <rect x="176.8" y="80" width="132.8" height="54" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="243.20000000000002" y="105.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#5a7fb0" filter="url(#rough2)">枚举 p, d</text>
