  <line x1="310.6" y1="107.0" x2="320.6" y2="107.0" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <rect x="323.6" y="80" width="132.8" height="54" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="390.0" y="105.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#d6a040" filter="url(#rough2)">上界 > D?</text>
  <text x="390.0" y="123.0" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">否 → 下一个</text>
  <line x1="457.4" y1="107.0" x2="467.4" y2="107.0" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <rect x="470.40000000000003" y="80" width="132.8" height="54" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="536.8000000000001" y="105.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">贪心填后缀</text>
  <text x="536.8000000000001" y="123.0" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">每位取最小可行</text>
  <line x1="604.2" y1="107.0" x2="614.2" y2="107.0" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <rect x="617.2" y="80" width="132.8" height="54" rx="7" fill="#fbeeee" stroke="#a05a5a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="683.6" y="112.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a05a5a" filter="url(#rough2)">输出 / -1</text>
