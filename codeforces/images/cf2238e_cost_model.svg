<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="780" height="470" fill="#fafafa"/>
  <text x="30" y="42" font-size="21" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">把失误数改写成 #F 减去区间内 (F − T) 的和</text>
  <text x="30" y="88" font-size="14" fill="#555" text-anchor="start" font-weight="normal" filter="url(#rough2)">样例 4：TFTFTF（GLaDOS 填好的结果）</text>
  <rect x="147" y="92" width="188" height="64" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="90" y="100" width="54" height="48" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="117" y="133" font-size="22" fill="#333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">T</text>
  <text x="117" y="172" font-size="12" fill="#888" text-anchor="middle" font-weight="normal" filter="url(#rough2)">1</text>
  <rect x="152" y="100" width="54" height="48" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="179" y="133" font-size="22" fill="#333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">F</text>
  <text x="179" y="172" font-size="12" fill="#888" text-anchor="middle" font-weight="normal" filter="url(#rough2)">2</text>
  <rect x="214" y="100" width="54" height="48" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="241" y="133" font-size="22" fill="#333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">T</text>
  <text x="241" y="172" font-size="12" fill="#888" text-anchor="middle" font-weight="normal" filter="url(#rough2)">3</text>
  <rect x="276" y="100" width="54" height="48" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="303" y="133" font-size="22" fill="#333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">F</text>
  <text x="303" y="172" font-size="12" fill="#888" text-anchor="middle" font-weight="normal" filter="url(#rough2)">4</text>
  <rect x="338" y="100" width="54" height="48" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="365" y="133" font-size="22" fill="#333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">T</text>
  <text x="365" y="172" font-size="12" fill="#888" text-anchor="middle" font-weight="normal" filter="url(#rough2)">5</text>
  <rect x="400" y="100" width="54" height="48" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="427" y="133" font-size="22" fill="#333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">F</text>
  <text x="427" y="172" font-size="12" fill="#888" text-anchor="middle" font-weight="normal" filter="url(#rough2)">6</text>
  <text x="470" y="116" font-size="14" fill="#b85450" text-anchor="start" font-weight="normal" filter="url(#rough2)">Chell 选 [2,4]：判 F T F 为假</text>
  <text x="470" y="140" font-size="12.5" fill="#555" text-anchor="start" font-weight="normal" filter="url(#rough2)">区间内判「假」，区间外判「真」</text>
  <text x="30" y="198" font-size="14" fill="#333" text-anchor="start" font-weight="normal" filter="url(#rough2)">失误 = 区间内 T 的个数 1 + 区间外 F 的个数 1 = 2</text>
  <text x="30" y="236" font-size="14" fill="#555" text-anchor="start" font-weight="normal" filter="url(#rough2)">样例 1：FTFF（全部已给定）</text>
  <rect x="209" y="240" width="126" height="64" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="90" y="248" width="54" height="48" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="117" y="281" font-size="22" fill="#333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">F</text>
  <text x="117" y="320" font-size="12" fill="#888" text-anchor="middle" font-weight="normal" filter="url(#rough2)">1</text>
  <rect x="152" y="248" width="54" height="48" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="179" y="281" font-size="22" fill="#333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">T</text>
  <text x="179" y="320" font-size="12" fill="#888" text-anchor="middle" font-weight="normal" filter="url(#rough2)">2</text>
  <rect x="214" y="248" width="54" height="48" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="241" y="281" font-size="22" fill="#333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">F</text>
  <text x="241" y="320" font-size="12" fill="#888" text-anchor="middle" font-weight="normal" filter="url(#rough2)">3</text>
  <rect x="276" y="248" width="54" height="48" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="303" y="281" font-size="22" fill="#333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">F</text>
  <text x="303" y="320" font-size="12" fill="#888" text-anchor="middle" font-weight="normal" filter="url(#rough2)">4</text>
  <text x="470" y="264" font-size="14" fill="#b85450" text-anchor="start" font-weight="normal" filter="url(#rough2)">Chell 选 [3,4]</text>
  <text x="470" y="288" font-size="12.5" fill="#555" text-anchor="start" font-weight="normal" filter="url(#rough2)">一个区间盖不住第 1 位的 F</text>
  <text x="30" y="346" font-size="14" fill="#333" text-anchor="start" font-weight="normal" filter="url(#rough2)">失误 = 0 + 1 = 1：两段 F 没法合成一个区间，必然留下错</text>
  <rect x="30" y="360" width="720" height="94" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="48" y="390" font-size="14.5" fill="#333" text-anchor="start" font-weight="normal" filter="url(#rough2)">失误(l,r) = #F − ( 区间内 F 数 − 区间内 T 数 ) = #F − sub(l,r)，令 F = +1、T = −1</text>
  <text x="48" y="416" font-size="14.5" fill="#333" text-anchor="start" font-weight="normal" filter="url(#rough2)">空区间（全部答真）的失误正好是 #F，相当于取 sub = 0</text>
  <text x="48" y="442" font-size="15" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">⇒ Chell 的最优失误 = #F − max(0, 区间最大子段和)</text>
</svg>
