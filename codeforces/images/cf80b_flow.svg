<svg xmlns="http://www.w3.org/2000/svg" width="720" height="310" viewBox="0 0 720 310"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="107"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="310" fill="#fafafa"/>
  <text x="360.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">半度整数化：全程没有浮点</text>
  <path d="M 129.6 42 Q 360.0 48 590.4 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="360.0" y="294" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">HH:MM → 两个整数 → 精确输出</text>
  <rect x="40" y="74" width="150" height="50" rx="7" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="115" y="104" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">读入 HH:MM</text>
  <rect x="220" y="66" width="230" height="66" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="335" y="90" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">hour2 = 60×(HH mod 12) + MM</text>
  <text x="335" y="114" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">minute2 = 12×MM</text>
  <rect x="480" y="66" width="200" height="66" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="580" y="90" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">角度 = hour2 / 2</text>
  <text x="580" y="114" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">（奇数补 .5）</text>
  <path d="M 190 99 L 216 99" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <path d="M 450 99 L 476 99" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <rect x="220" y="156" width="230" height="60" rx="7" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="335" y="180" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">minute2 / 2 直接是整数</text>
  <text x="335" y="202" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">因为 minute2 = 12×MM 必为偶数</text>
  <path d="M 335 132 L 335 152" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <text x="335" y="248" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">hour2 奇 ⇔ MM 奇，所以小数只可能是 .5</text>
  <rect x="60" y="264" width="600" height="32" rx="8" fill="#f4f4f0" stroke="#8a8a8a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="360" y="285" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">最大角度 359.5 &lt; 360，根本不需要取模</text>
</svg>
