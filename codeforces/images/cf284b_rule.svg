<svg xmlns="http://www.w3.org/2000/svg" width="700" height="380" viewBox="0 0 700 380"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="141"/>
    <feDisplacementMap in="SourceGraphic" scale="1.5"/></filter></defs>
  <rect width="700" height="380" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">能亮牌的人：自己不是 F，且「其他人」里没有 I</text>
  <path d="M 100 40 Q 350 46 600 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="60" y="58" width="580" height="104" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="13" fill="#22314a" filter="url(#rough2)">题面条件：亮牌者自己状态可以是 A 或 I，但他亮牌的那一刻，</text>
  <text x="76" y="106" font-size="13" fill="#22314a" filter="url(#rough2)">「所有其他玩家」的状态都必须是 A 或 F。</text>
  <text x="76" y="130" font-size="13" fill="#22314a" filter="url(#rough2)">换句话说：除了他自己，全场不许有第二个 I。</text>
  <text x="76" y="152" font-size="12" fill="#2f4a66" filter="url(#rough2)">（因为 I 的存在会影响下注决策，别人亮牌就等于泄露信息。）</text>
  <g filter="url(#rough2)">
    <rect x="60" y="176" width="580" height="120" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="200" font-size="13" fill="#2f5223" filter="url(#rough2)">记 cntI = 状态为 I 的人数：</text>
  <text x="76" y="224" font-size="13" fill="#2f5223" filter="url(#rough2)">cntI = 0 ⇒ 所有 A 和 I 都能亮牌（没有 I 时 I 也不存在，只能数 A）→ 答案 = cntA</text>
  <text x="76" y="248" font-size="13" fill="#2f5223" filter="url(#rough2)">cntI = 1 ⇒ 只有那个 I 能亮（其他人都是 A/F，满足条件）→ 答案 = 1</text>
  <text x="76" y="272" font-size="13" fill="#2f5223" filter="url(#rough2)">cntI ≥ 2 ⇒ 谁亮牌都仍有别的 I 在场 → 答案 = 0</text>
  <g filter="url(#rough2)">
    <rect x="60" y="306" width="580" height="58" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="76" y="330" font-size="12.5" fill="#8a6015" filter="url(#rough2)">样例 1：AFFAAA ⇒ cntI=0, cntA=4 ⇒ 4 ✓（四个 A 都能亮）</text>
  <text x="76" y="352" font-size="12.5" fill="#8a6015" filter="url(#rough2)">样例 2：AFI ⇒ cntI=1 ⇒ 1 ✓（只有那个 I 能亮）</text>
</svg>
