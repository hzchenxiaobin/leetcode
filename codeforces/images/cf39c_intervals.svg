<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-6%" y="-6%" width="112%" height="112%"><feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="398" /><feDisplacementMap in="SourceGraphic" scale="1.5" /></filter></defs>
  <rect width="760" height="430" fill="#fafafa" />
  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">圆环在路径上变成区间：只允许“包含”或“不交”</text>
  <path d="M 100 44 Q 380 50 660 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)" />

  
  <text x="60" y="80" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">✓ 嵌套</text>
  <line x1="60" y1="112" x2="240" y2="112" stroke="#999" stroke-width="1" filter="url(#rough2)" />
  <line x1="60" y1="100" x2="240" y2="100" stroke="#4a7a3a" stroke-width="4" filter="url(#rough2)" />
  <line x1="100" y1="124" x2="180" y2="124" stroke="#446688" stroke-width="4" filter="url(#rough2)" />
  <text x="60" y="148" font-size="10.5" fill="#555" filter="url(#rough2)">[60,240] 包含 [100,180]</text>

  
  <text x="300" y="80" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">✓ 不交 / 相切</text>
  <line x1="300" y1="112" x2="470" y2="112" stroke="#999" stroke-width="1" filter="url(#rough2)" />
  <line x1="300" y1="100" x2="370" y2="100" stroke="#4a7a3a" stroke-width="4" filter="url(#rough2)" />
  <line x1="370" y1="124" x2="460" y2="124" stroke="#446688" stroke-width="4" filter="url(#rough2)" />
  <text x="300" y="148" font-size="10.5" fill="#555" filter="url(#rough2)">右端点 = 左端点也算合法</text>

  
  <text x="550" y="80" font-size="12" font-weight="bold" fill="#8a3b36" filter="url(#rough2)">✗ 交叉（部分重叠）</text>
  <line x1="530" y1="112" x2="710" y2="112" stroke="#999" stroke-width="1" filter="url(#rough2)" />
  <line x1="530" y1="100" x2="640" y2="100" stroke="#b85450" stroke-width="4" filter="url(#rough2)" />
  <line x1="600" y1="124" x2="710" y2="124" stroke="#b85450" stroke-width="4" filter="url(#rough2)" />
  <text x="530" y="148" font-size="10.5" fill="#8a3b36" filter="url(#rough2)">左1&lt;左2&lt;右1&lt;右2</text>

  <rect x="50" y="182" width="660" height="94" rx="10" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.5" filter="url(#rough2)" />
  <text x="70" y="208" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">区间的两种合法关系（l 为左端点，r 为右端点）</text>
  <text x="70" y="234" font-size="12" fill="#2f5223" filter="url(#rough2)">不交：r1 ≤ l2 或 r2 ≤ l1；包含：l1 ≤ l2 且 r2 ≤ r1，或反过来。</text>
  <text x="70" y="258" font-size="12" fill="#8a3b36" filter="url(#rough2)">非法：l1 &lt; l2 &lt; r1 &lt; r2（或对称），即“交叉”。</text>

  <rect x="50" y="296" width="660" height="100" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)" />
  <text x="70" y="322" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">目标：选最多区间，使任意两两满足上述合法关系</text>
  <text x="70" y="346" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">等价于选一个“层叠森林”：外层区间互不交，内层递归嵌套。</text>
  <text x="70" y="370" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">相切（r1=l2）算不交；内切也算包含，所以判断用 ≤ 而不是 &lt;。</text>
</svg>