<svg xmlns="http://www.w3.org/2000/svg" width="700" height="310" viewBox="0 0 700 310"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1301"/>
    <feDisplacementMap in="SourceGraphic" scale="1.5"/></filter></defs>
  <rect width="700" height="310" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">立方幂次 x, x³, x⁹, … 的周期 = 48（不是 3！）</text>
  <path d="M 110 40 Q 350 46 590 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="86" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="12.5" fill="#22314a" filter="url(#rough2)">模数 M = 95542721，M−1 = 95542720 = 2⁶ · 5 · 7 · 13 · 17 · 193。</text>
  <text x="76" y="106" font-size="12.5" fill="#22314a" filter="url(#ruff2)">写 x = g^e，则一次立方把 e 变成 3e（mod M−1）⇒ 第 k 次是 3ᵏ·e。</text>
  <text x="76" y="130" font-size="12.5" fill="#22314a" filter="url(#rough2)">所以"值序列的周期"= 3ᵏ mod (M−1) 的周期。</text>
  <g filter="url(#rough2)"><rect x="60" y="152" width="580" height="76" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="76" y="176" font-size="13" fill="#8a6015" filter="url(#rough2)">实测：3ᵏ mod 95542720 的预周期 0、周期 48 ⇒ 3⁴⁸ ≡ 1 (mod M−1)。</text>
  <text x="76" y="200" font-size="13" fill="#8a6015" filter="url(#rough2)">⇒ 任意 x 都满足 x^(3^(k+48)) = x^(3^k) ⇒ 周期整除 48 ✓</text>
  <text x="76" y="222" font-size="12" fill="#8a6015" filter="url(#rough2)">（随机 200 个 x：199 个周期正是 48，1 个是 16 —— 都整除 48。）</text>
  <g filter="url(#rough2)"><rect x="60" y="238" width="580" height="56" rx="8" fill="#fbeeee" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="76" y="262" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">⚠ 若按"周期 3"做 lazy 会错：3 ∤ 48，第 3 次立方后并没有回到原值。</text>
  <text x="76" y="284" font-size="12px" fill="#8a3a36" filter="url(#rough2)">正确做法：lazy 按 mod 48，节点存 48 组相位和。</text>
</svg>
