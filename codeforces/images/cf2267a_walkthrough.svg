<svg xmlns="http://www.w3.org/2000/svg" width="780" height="470" viewBox="0 0 780 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="780" height="470" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：s = codeforces、c = c（官方样例 5）</text>
  <path d="M 150 40 Q 390 48 630 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 表头 -->
  <rect x="90" y="56" width="590" height="42" rx="6" fill="#eef2f7" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="155" y="83" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">镜像对 (i, j)</text>
  <text x="260" y="83" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">sᵢ</text>
  <text x="340" y="83" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">sⱼ</text>
  <text x="485" y="83" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">判断</text>
  <text x="635" y="83" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">代价</text>

  <!-- 表格外框与网格 -->
  <rect x="90" y="98" width="590" height="200" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 90 138 L 680 138" stroke="#c8d4e0" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 90 178 L 680 178" stroke="#c8d4e0" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 90 218 L 680 218" stroke="#c8d4e0" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 90 258 L 680 258" stroke="#c8d4e0" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 220 56 L 220 298" stroke="#c8d4e0" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 300 56 L 300 298" stroke="#c8d4e0" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 380 56 L 380 298" stroke="#c8d4e0" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 590 56 L 590 298" stroke="#c8d4e0" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 第 1 行 -->
  <text x="155" y="123" text-anchor="middle" font-size="12" fill="#3a3a3a" filter="url(#rough2)">(1, 10)</text>
  <text x="260" y="123" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">c</text>
  <text x="340" y="123" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">e</text>
  <text x="485" y="123" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">一侧就是 c</text>
  <text x="635" y="123" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <!-- 第 2 行 -->
  <text x="155" y="163" text-anchor="middle" font-size="12" fill="#3a3a3a" filter="url(#rough2)">(2, 9)</text>
  <text x="260" y="163" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">o</text>
  <text x="340" y="163" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">e</text>
  <text x="485" y="163" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">两侧都不是 c</text>
  <text x="635" y="163" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">2</text>
  <!-- 第 3 行 -->
  <text x="155" y="203" text-anchor="middle" font-size="12" fill="#3a3a3a" filter="url(#rough2)">(3, 8)</text>
  <text x="260" y="203" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">d</text>
  <text x="340" y="203" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">c</text>
  <text x="485" y="203" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">一侧就是 c</text>
  <text x="635" y="203" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <!-- 第 4 行 -->
  <text x="155" y="243" text-anchor="middle" font-size="12" fill="#3a3a3a" filter="url(#rough2)">(4, 7)</text>
  <text x="260" y="243" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">e</text>
  <text x="340" y="243" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">o</text>
  <text x="485" y="243" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">两侧都不是 c</text>
  <text x="635" y="243" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">2</text>
  <!-- 第 5 行 -->
  <text x="155" y="283" text-anchor="middle" font-size="12" fill="#3a3a3a" filter="url(#rough2)">(5, 6)</text>
  <text x="260" y="283" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">f</text>
  <text x="340" y="283" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">r</text>
  <text x="485" y="283" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">两侧都不是 c</text>
  <text x="635" y="283" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">2</text>

  <!-- 合计行 -->
  <rect x="90" y="298" width="590" height="42" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="155" y="325" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">合计</text>
  <text x="400" y="325" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">1 + 2 + 1 + 2 + 2 = 8</text>
  <text x="650" y="325" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6015" filter="url(#rough2)">8</text>

  <!-- 第二组样例 -->
  <rect x="90" y="360" width="590" height="82" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="106" y="384" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">对照样例 3：s = abcbb、c = e</text>
  <text x="106" y="406" font-size="12" fill="#3c5e2e" filter="url(#rough2)">(1, 5)：a 与 b —— 两侧都不是 e，只能都改成 e，代价 2</text>
  <text x="106" y="427" font-size="12" fill="#3c5e2e" filter="url(#rough2)">(2, 4)：b 与 b —— 已对称，代价 0；中间 s₃ = c 不用动 ⇒ ans = 2</text>
</svg>
