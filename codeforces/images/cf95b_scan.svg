<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="197"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="760" height="400" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1：n = 4500，答案 4747</text>
  <path d="M 152 39 Q 380 45 608 39" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="60" y="70" width="50" height="46" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="85.0" y="100" text-anchor="middle" font-size="17" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">4</text>
  <rect x="116" y="70" width="50" height="46" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="141.0" y="100" text-anchor="middle" font-size="17" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">5</text>
  <rect x="172" y="70" width="50" height="46" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="197.0" y="100" text-anchor="middle" font-size="17" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">0</text>
  <rect x="228" y="70" width="50" height="46" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="253.0" y="100" text-anchor="middle" font-size="17" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">0</text>
  <text x="60" y="60" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">n</text>
  <rect x="50" y="140" width="690" height="40" rx="8" fill="#ffffff" stroke="#9b9b9b" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="66" y="166" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">j = 3：前缀 "450" 里出现了 5，不可能是超级幸运数的前缀 → 跳过</text>
  <rect x="50" y="188" width="690" height="40" rx="8" fill="#ffffff" stroke="#9b9b9b" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="66" y="214" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">j = 2：前缀 "45" 同样含 5 → 跳过</text>
  <rect x="50" y="236" width="690" height="40" rx="8" fill="#e9f4ec" stroke="#3f6b4a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="66" y="262" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">j = 1：前缀 "4" 合法（已用 1 个 4）；n[1] = 5，可放 7 &gt; 5 → 候选 4 7 4 7</text>
  <rect x="50" y="284" width="690" height="40" rx="8" fill="#f4f4f4" stroke="#7a7a7a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="66" y="310" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">j = 0：也可行（把 4 换成 7），但候选 7447 &gt; 4747，不如 j 更大者</text>
  <rect x="50" y="344" width="690" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="66" y="372" text-anchor="start" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">答案 4747：它是 ≥ 4500 的最小超级幸运数（4744 &lt; 4500? 不，4744 ≥ 4500 但 4747 &lt; 4744）。</text>
</svg>
