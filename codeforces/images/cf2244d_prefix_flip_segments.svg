<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#57708c" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="880" height="430" fill="#fafafa"/>

  <text x="440" y="38" text-anchor="middle" font-size="19" fill="#22303c" filter="url(#rough2)">读一条 b 的帖子 = 把 a[1..b] 整体取反</text>
  <text x="440" y="64" text-anchor="middle" font-size="13" fill="#5b6773" filter="url(#rough2)">位置 i 被翻几次，只看 i 落在 b 切出的哪一段；同一段内所有位置翻转次数相同</text>

  <!-- 数组格子：a = [1, -4, 3, -4, -2]，边界 b = 2, 4 -->
  <text x="194" y="92" text-anchor="middle" font-size="11" fill="#7a8894" filter="url(#rough2)">1</text>
  <text x="268" y="92" text-anchor="middle" font-size="11" fill="#7a8894" filter="url(#rough2)">2</text>
  <text x="342" y="92" text-anchor="middle" font-size="11" fill="#7a8894" filter="url(#rough2)">3</text>
  <text x="416" y="92" text-anchor="middle" font-size="11" fill="#7a8894" filter="url(#rough2)">4</text>
  <text x="490" y="92" text-anchor="middle" font-size="11" fill="#7a8894" filter="url(#rough2)">5</text>

  <rect x="120" y="100" width="74" height="54" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="194" y="100" width="74" height="54" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="268" y="100" width="74" height="54" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="342" y="100" width="74" height="54" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="416" y="100" width="74" height="54" rx="4" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.4" filter="url(#rough2)"/>

  <text x="157" y="136" text-anchor="middle" font-size="18" fill="#22303c" filter="url(#rough2)">1</text>
  <text x="231" y="136" text-anchor="middle" font-size="18" fill="#b85450" filter="url(#rough2)">-4</text>
  <text x="305" y="136" text-anchor="middle" font-size="18" fill="#22303c" filter="url(#rough2)">3</text>
  <text x="379" y="136" text-anchor="middle" font-size="18" fill="#b85450" filter="url(#rough2)">-4</text>
  <text x="453" y="136" text-anchor="middle" font-size="18" fill="#b85450" filter="url(#rough2)">-2</text>

  <text x="700" y="112" font-size="12.5" fill="#446688" filter="url(#rough2)">示例：n = 5, b = {2, 4}</text>
  <text x="700" y="132" font-size="12.5" fill="#446688" filter="url(#rough2)">读 b = 2：翻转 a[1..2]</text>

  <!-- 分界线 -->
  <path d="M268 84 L268 262" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 5" filter="url(#rough2)"/>
  <path d="M416 84 L416 262" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 5" filter="url(#rough2)"/>
  <text x="268" y="278" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">b = 2</text>
  <text x="416" y="278" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">b = 4</text>

  <!-- 三段 -->
  <rect x="122" y="292" width="144" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="194" y="312" text-anchor="middle" font-size="12.5" fill="#22303c" filter="url(#rough2)">S1 = 1 + (-4) = -3</text>
  <text x="194" y="330" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">可整体取反</text>

  <rect x="270" y="292" width="144" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="342" y="312" text-anchor="middle" font-size="12.5" fill="#22303c" filter="url(#rough2)">S2 = 3 + (-4) = -1</text>
  <text x="342" y="330" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">可整体取反</text>

  <rect x="418" y="292" width="72" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="454" y="312" text-anchor="middle" font-size="12.5" fill="#22303c" filter="url(#rough2)">-2</text>
  <text x="454" y="330" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">尾部·原样</text>

  <path d="M194 344 L194 372" stroke="#57708c" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M342 344 L342 372" stroke="#57708c" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M454 344 L454 372" stroke="#57708c" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="376" width="620" height="42" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="430" y="403" text-anchor="middle" font-size="14" fill="#6b5320" filter="url(#rough2)">答案 = |S1| + |S2| + 尾部 = 3 + 1 + (-2) = 2</text>
</svg>
