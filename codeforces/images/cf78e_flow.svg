  <text x="360" y="396" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">(0,2) 走 (0,3) 的舱；(1,2) 与 (3,1) 走 (3,3)；(2,0) 卡在时间上</text>
