<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">一次线性扫描：候选起点只增不减</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">处理到 j 时，能配对的起点恰好是下标 ≤ j−k−1 的一个前缀</text>

  <rect x="60" y="64" width="430" height="46" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="275" y="92" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">对 j = 0, 1, …, n 依次扫描（共 n+1 个前缀下标）</text>

  <path d="M 275 112 L 275 134" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="136" width="430" height="58" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="275" y="158" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">步骤 A：i = j − k − 1（刚达到距离 k+1 的下标）</text>
  <text x="275" y="180" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">若 i ≥ 0：cnt[ P_i mod k ] += 1</text>

  <path d="M 275 194 L 275 216" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="218" width="430" height="58" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="275" y="240" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">步骤 B：ans += cnt[ P_j mod k ]</text>
  <text x="275" y="262" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">候选集里每个同余的 i 都贡献一对 (i, j)</text>

  <path d="M 275 276 L 275 298" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="300" width="200" height="42" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="250" y="326" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">j ← j + 1</text>

  <path d="M 350 321 H 512 V 87 H 494" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="60" y="372" font-size="10.5" fill="#555" filter="url(#rough2)">候选集 S_j = { i : 0 ≤ i ≤ j − k − 1 }，随 j 单调扩张 ⇒ 每个 i 最多入集一次</text>
  <text x="60" y="394" font-size="10.5" fill="#555" filter="url(#rough2)">被排除的 i ∈ [j−k, j−1] 恰好对应长度 ≤ k 的子段，天然不计入答案</text>
  <text x="280" y="420" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">时间 O(n)　空间 O(n + k)</text>
</svg>
