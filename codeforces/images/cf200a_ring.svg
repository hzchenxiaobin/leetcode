<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="350" fill="#fafafa"/>
  <text x="360.0" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">200A：按环扫描，圈内行优先</text>
  <path d="M 144.00 46 Q 360.0 52 576.00 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="70" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">对某人偏好的座位 (x, y)，按“距离 d = 0,1,2,...”一圈圈找；同一圈内按行升序、行内列升序。</text>
  <text x="60" y="90" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">这与题面的三关键字（距离最小 → 行最小 → 列最小）完全同序，所以第一个空位就是答案。</text>
  <rect x="200" y="120" width="40" height="40" fill="#fdeef1" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="220.0" y="144.0" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="240" y="120" width="40" height="40" fill="#fdeef1" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="260.0" y="144.0" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="280" y="120" width="40" height="40" fill="#fff8e1" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="300.0" y="144.0" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="320" y="120" width="40" height="40" fill="#fdeef1" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="340.0" y="144.0" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="360" y="120" width="40" height="40" fill="#fdeef1" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="380.0" y="144.0" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="200" y="160" width="40" height="40" fill="#fdeef1" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="220.0" y="184.0" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="240" y="160" width="40" height="40" fill="#fff8e1" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="260.0" y="184.0" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="280" y="160" width="40" height="40" fill="#eef8ef" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="300.0" y="184.0" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="320" y="160" width="40" height="40" fill="#fff8e1" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="340.0" y="184.0" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="360" y="160" width="40" height="40" fill="#fdeef1" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="380.0" y="184.0" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="200" y="200" width="40" height="40" fill="#fff8e1" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="220.0" y="224.0" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="240" y="200" width="40" height="40" fill="#eef8ef" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="260.0" y="224.0" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="280" y="200" width="40" height="40" fill="#eef3fb" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="300.0" y="224.0" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="320" y="200" width="40" height="40" fill="#eef8ef" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="340.0" y="224.0" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="360" y="200" width="40" height="40" fill="#fff8e1" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="380.0" y="224.0" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="200" y="240" width="40" height="40" fill="#fdeef1" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="220.0" y="264.0" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="240" y="240" width="40" height="40" fill="#fff8e1" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="260.0" y="264.0" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="280" y="240" width="40" height="40" fill="#eef8ef" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="300.0" y="264.0" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="320" y="240" width="40" height="40" fill="#fff8e1" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="340.0" y="264.0" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="360" y="240" width="40" height="40" fill="#fdeef1" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="380.0" y="264.0" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="200" y="280" width="40" height="40" fill="#fdeef1" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="220.0" y="304.0" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="240" y="280" width="40" height="40" fill="#fdeef1" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="260.0" y="304.0" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="280" y="280" width="40" height="40" fill="#fff8e1" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="300.0" y="304.0" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="320" y="280" width="40" height="40" fill="#fdeef1" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="340.0" y="304.0" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="360" y="280" width="40" height="40" fill="#fdeef1" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="380.0" y="304.0" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="300.0" y="338" text-anchor="middle" font-size="10" fill="#33506e" filter="url(#rough2)">(x, y)</text>
  <text x="440" y="140" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">d = 0：只查 (x,y)</text>
  <text x="440" y="164" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">d = 1：上行 → 下行（列小者先）</text>
  <text x="440" y="188" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">d = 2：3 行 × 至多 2 列</text>
  <text x="440" y="212" text-anchor="start" font-size="11" fill="#8a3a52" filter="url(#rough2)">第 d 圈只有 4d 个格子，不是 d² 个</text>
  <rect x="60" y="274" width="600" height="56" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="292" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">若整块矩形枚举（每个候选点 O(1) 也得扫 (2D+1)² 个格子），代价是环扫描的 D 倍；</text>
  <text x="74" y="314" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">环扫描的代价是 O(D²) —— 两者差一个量级，而正确答案的距离 D 通常很小。</text>
</svg>
