<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="720" height="430" fill="#fafafa"/>
  <text x="360.0" y="33" font-size="20" font-weight="bold" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">数位 DP：余数 mod 2520 与最小公倍数</text>
  <path d="M 235 44 Q 360.0 50 485 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="80" y="80" width="54" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="107" y="108" font-size="15" font-weight="bold" fill="#22303f" text-anchor="middle" filter="url(#rough2)">7</text>
  <rect x="170" y="80" width="54" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="197" y="108" font-size="15" font-weight="bold" fill="#22303f" text-anchor="middle" filter="url(#rough2)">…</text>
  <rect x="260" y="80" width="54" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="287" y="108" font-size="15" font-weight="bold" fill="#22303f" text-anchor="middle" filter="url(#rough2)">d</text>
  <rect x="350" y="80" width="54" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="377" y="108" font-size="15" font-weight="bold" fill="#22303f" text-anchor="middle" filter="url(#rough2)">…</text>
  <text x="450" y="108" font-size="11" font-weight="normal" fill="#555" text-anchor="start" filter="url(#rough2)">每一位 d ∈ 0..9</text>
  <rect x="70" y="200" width="128" height="58" rx="8" fill="#fff8e1" stroke="#b08a2e" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="134" y="224" font-size="13" font-weight="bold" fill="#22303f" text-anchor="middle" filter="url(#rough2)">(0, 1)</text>
  <text x="134" y="244" font-size="9.5" font-weight="normal" fill="#555" text-anchor="middle" filter="url(#rough2)">初始</text>
  <g filter="url(#rough2)">
    <path d="M 198 229 L 225 229" stroke="#7a8b9a" stroke-width="1.4" fill="none"/>
    <polygon points="225,229 216,224 216,234" fill="#7a8b9a"/>
  </g>
  <rect x="225" y="200" width="128" height="58" rx="8" fill="#fff8e1" stroke="#b08a2e" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="289" y="224" font-size="13" font-weight="bold" fill="#22303f" text-anchor="middle" filter="url(#rough2)">(r₁, L₁)</text>
  <text x="289" y="244" font-size="9.5" font-weight="normal" fill="#555" text-anchor="middle" filter="url(#rough2)">rem, lcm</text>
  <g filter="url(#rough2)">
    <path d="M 353 229 L 380 229" stroke="#7a8b9a" stroke-width="1.4" fill="none"/>
    <polygon points="380,229 371,224 371,234" fill="#7a8b9a"/>
  </g>
  <rect x="380" y="200" width="128" height="58" rx="8" fill="#fff8e1" stroke="#b08a2e" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="444" y="224" font-size="13" font-weight="bold" fill="#22303f" text-anchor="middle" filter="url(#rough2)">(r₂, L₂)</text>
  <text x="444" y="244" font-size="9.5" font-weight="normal" fill="#555" text-anchor="middle" filter="url(#rough2)">rem, lcm</text>
  <g filter="url(#rough2)">
    <path d="M 508 229 L 535 229" stroke="#7a8b9a" stroke-width="1.4" fill="none"/>
    <polygon points="535,229 526,224 526,234" fill="#7a8b9a"/>
  </g>
  <rect x="535" y="200" width="128" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="599" y="224" font-size="13" font-weight="bold" fill="#22303f" text-anchor="middle" filter="url(#rough2)">(r, L)</text>
  <text x="599" y="244" font-size="9.5" font-weight="normal" fill="#555" text-anchor="middle" filter="url(#rough2)">填完</text>
  <text x="360" y="288" font-size="12" font-weight="normal" fill="#333" text-anchor="middle" filter="url(#rough2)">r ← (10r + d) mod 2520</text>
  <text x="360" y="308" font-size="12" font-weight="normal" fill="#333" text-anchor="middle" filter="url(#rough2)">L ← lcm(L, d)，d = 0 时不变</text>
  <rect x="200" y="326" width="320" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="360" y="348" font-size="12.5" font-weight="bold" fill="#2f5223" text-anchor="middle" filter="url(#rough2)">填完判定：r mod L == 0 ？</text>
  <text x="360" y="366" font-size="10.5" font-weight="normal" fill="#2f5223" text-anchor="middle" filter="url(#rough2)">是 → 美丽数</text>
  <text x="360" y="406" font-size="10.5" font-weight="normal" fill="#666" text-anchor="middle" filter="url(#rough2)">记忆化键 = (剩余位数, r, L 的编号)，与上界无关，可在 10 组询问间共享</text>
</svg>
