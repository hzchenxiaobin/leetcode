<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="19"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>

  <rect width="720" height="420" fill="#fafafa"/>

  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">同样 9 件商品：q 越小，免费件越多</text>
  <path d="M 150 44 Q 360 50 570 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <g font-size="13" fill="#2b2b2b" filter="url(#rough2)">
    <text x="30" y="88">q = 1</text>
    <text x="30" y="176">q = 2</text>
    <text x="30" y="264">q = 3</text>
  </g>

  <!-- q = 1：块 3，付 1 -->
  <g filter="url(#rough2)">
    <rect x="90" y="64" width="46" height="46" rx="5" fill="#dfeafc" stroke="#446688" stroke-width="1.5"/>
    <rect x="140" y="64" width="46" height="46" rx="5" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="190" y="64" width="46" height="46" rx="5" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="240" y="64" width="46" height="46" rx="5" fill="#dfeafc" stroke="#446688" stroke-width="1.5"/>
    <rect x="290" y="64" width="46" height="46" rx="5" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="340" y="64" width="46" height="46" rx="5" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="390" y="64" width="46" height="46" rx="5" fill="#dfeafc" stroke="#446688" stroke-width="1.5"/>
    <rect x="440" y="64" width="46" height="46" rx="5" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="490" y="64" width="46" height="46" rx="5" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.5"/>
  </g>

  <!-- q = 2：块 4，付 2 -->
  <g filter="url(#rough2)">
    <rect x="90" y="152" width="46" height="46" rx="5" fill="#dfeafc" stroke="#446688" stroke-width="1.5"/>
    <rect x="140" y="152" width="46" height="46" rx="5" fill="#dfeafc" stroke="#446688" stroke-width="1.5"/>
    <rect x="190" y="152" width="46" height="46" rx="5" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="240" y="152" width="46" height="46" rx="5" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="290" y="152" width="46" height="46" rx="5" fill="#dfeafc" stroke="#446688" stroke-width="1.5"/>
    <rect x="340" y="152" width="46" height="46" rx="5" fill="#dfeafc" stroke="#446688" stroke-width="1.5"/>
    <rect x="390" y="152" width="46" height="46" rx="5" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="440" y="152" width="46" height="46" rx="5" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="490" y="152" width="46" height="46" rx="5" fill="#dfeafc" stroke="#446688" stroke-width="1.5"/>
  </g>

  <!-- q = 3：块 5，付 3 -->
  <g filter="url(#rough2)">
    <rect x="90" y="240" width="46" height="46" rx="5" fill="#dfeafc" stroke="#446688" stroke-width="1.5"/>
    <rect x="140" y="240" width="46" height="46" rx="5" fill="#dfeafc" stroke="#446688" stroke-width="1.5"/>
    <rect x="190" y="240" width="46" height="46" rx="5" fill="#dfeafc" stroke="#446688" stroke-width="1.5"/>
    <rect x="240" y="240" width="46" height="46" rx="5" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="290" y="240" width="46" height="46" rx="5" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="340" y="240" width="46" height="46" rx="5" fill="#dfeafc" stroke="#446688" stroke-width="1.5"/>
    <rect x="390" y="240" width="46" height="46" rx="5" fill="#dfeafc" stroke="#446688" stroke-width="1.5"/>
    <rect x="440" y="240" width="46" height="46" rx="5" fill="#dfeafc" stroke="#446688" stroke-width="1.5"/>
    <rect x="490" y="240" width="46" height="46" rx="5" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.5"/>
  </g>

  <g font-size="13.5" fill="#2f4a66" filter="url(#rough2)">
    <text x="542" y="94" font-size="12.5">付费 3 件，免费 6 件</text>
    <text x="542" y="182" font-size="12.5">付费 5 件，免费 4 件</text>
    <text x="542" y="270" font-size="12.5">付费 6 件，免费 3 件</text>
  </g>

  <g font-size="12.5" fill="#8a6015" filter="url(#rough2)">
    <text x="90" y="126">块 = 1+2 = 3</text>
    <text x="90" y="214">块 = 2+2 = 4</text>
    <text x="90" y="302">块 = 3+2 = 5</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="330" width="610" height="70" rx="8" fill="#ffffff" stroke="#888" stroke-width="1.2"/>
  </g>
  <g font-size="13.5" fill="#333" filter="url(#rough2)">
    <text x="76" y="356">每个篮子固定送 2 件：付费件数 / 免费件数 = q / 2，</text>
    <text x="76" y="380">q 越大比值越差，所以只需要保留所有 q_i 里最小的那个。</text>
  </g>
</svg>
