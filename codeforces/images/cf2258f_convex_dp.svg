<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#55606e"/>
    </marker>
  </defs>
  <rect width="760" height="430" fill="#fafafa"/>

  <text x="380" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">g_v(k) 是凸函数：只需记录「把 f(v) 再降 2」的边际代价</text>
  <path d="M 92 39 Q 380 46 668 39" stroke="#2b2b2b" stroke-width="1.1" fill="none" filter="url(#rough2)"/>

  <!-- ==================== 左面板：一条碗形凸函数 + 边际代价 ==================== -->
  <rect x="16" y="48" width="372" height="316" rx="10" fill="#f7fbff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="202" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">某顶点的代价表：k 与 s_v 同奇偶，两头只能取到端点</text>

  <g filter="url(#rough2)">
    <path d="M 56 286 L 360 286" stroke="#55606e" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>
    <path d="M 56 286 L 56 92" stroke="#55606e" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>
    <text x="352" y="302" font-size="12" fill="#55606e">k</text>
    <text x="40" y="98" font-size="12" fill="#55606e">g</text>
    <path d="M 86 131 Q 114 181 142 230 Q 170 241 198 247 Q 226 222 254 197 Q 282 156 310 114"
          stroke="#446688" stroke-width="2.2" fill="none"/>
    <circle cx="86" cy="131" r="4" fill="#446688"/>
    <circle cx="142" cy="230" r="4" fill="#446688"/>
    <circle cx="198" cy="247" r="4" fill="#446688"/>
    <circle cx="254" cy="197" r="4" fill="#446688"/>
    <circle cx="310" cy="114" r="4" fill="#446688"/>
    <text x="86" y="120" text-anchor="middle" font-size="11.5" fill="#2f4a66">18</text>
    <text x="142" y="219" text-anchor="middle" font-size="11.5" fill="#2f4a66">6</text>
    <text x="198" y="236" text-anchor="middle" font-size="11.5" fill="#2f4a66">4</text>
    <text x="254" y="186" text-anchor="middle" font-size="11.5" fill="#2f4a66">10</text>
    <text x="310" y="103" text-anchor="middle" font-size="11.5" fill="#2f4a66">20</text>
    <text x="86" y="303" text-anchor="middle" font-size="11.5" fill="#55606e">−3</text>
    <text x="142" y="303" text-anchor="middle" font-size="11.5" fill="#55606e">−1</text>
    <text x="198" y="303" text-anchor="middle" font-size="11.5" fill="#55606e">1</text>
    <text x="254" y="303" text-anchor="middle" font-size="11.5" fill="#55606e">3</text>
    <text x="310" y="303" text-anchor="middle" font-size="11.5" fill="#55606e">5</text>
    <text x="196" y="322" text-anchor="middle" font-size="11" fill="#2f4a66">k 每降 2 的边际代价（从左往右读，非降 ⇒ 凸）</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="34" y="330" width="76" height="24" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="72" y="347" text-anchor="middle" font-size="12" fill="#2f4a66">−10</text>
    <rect x="124" y="330" width="76" height="24" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="162" y="347" text-anchor="middle" font-size="12" fill="#2f4a66">−6</text>
    <rect x="214" y="330" width="76" height="24" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="252" y="347" text-anchor="middle" font-size="12" fill="#8a6520">+2</text>
    <rect x="304" y="330" width="66" height="24" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="337" y="347" text-anchor="middle" font-size="12" fill="#8f3a36">+12</text>
  </g>

  <!-- ==================== 右面板：三条更新规则 ==================== -->
  <rect x="404" y="48" width="340" height="316" rx="10" fill="#fffdf5" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="574" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6520" filter="url(#rough2)">自底向上的三条更新</text>

  <g filter="url(#rough2)">
    <rect x="416" y="82" width="316" height="60" rx="8" fill="#eef7f0" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="574" y="103" text-anchor="middle" font-size="12" font-weight="bold" fill="#3c5e2e">① 并：子结点增量多重集求并</text>
    <text x="574" y="122" text-anchor="middle" font-size="11" fill="#3c5e2e">t = Σ f(c) 每降 2，最便宜的那一步来自任一儿子</text>
    <text x="574" y="136" text-anchor="middle" font-size="11" fill="#3c5e2e">⇒ 边际代价池化，取并集即可</text>

    <rect x="416" y="150" width="316" height="60" rx="8" fill="#f7fbff" stroke="#446688" stroke-width="1.4"/>
    <text x="574" y="171" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66">② 顶点自己：a_v = 0 插入一个 0</text>
    <text x="574" y="190" text-anchor="middle" font-size="11" fill="#2f4a66">翻转 x_v 就能让 f(v) 降 2 而不花代价（只此一步）</text>
    <text x="574" y="204" text-anchor="middle" font-size="11" fill="#2f4a66">a_v = ±1 没有这一步：窗口整体平移，增量不变</text>

    <rect x="416" y="218" width="316" height="76" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <text x="574" y="239" text-anchor="middle" font-size="12" font-weight="bold" fill="#8f3a36">③ 加上 |f(v)| = |s_v − 2i|</text>
    <text x="574" y="258" text-anchor="middle" font-size="11" fill="#8f3a36">位置 i ≤ A 的增量 −2，位置 i ≥ B+1 的 +2</text>
    <text x="574" y="274" text-anchor="middle" font-size="11" fill="#8f3a36">A = ⌊(S+1)/2⌋，B = ⌈(S+1)/2⌉，S = s_v − 1</text>
    <text x="574" y="288" text-anchor="middle" font-size="11" fill="#8f3a36">等价于：正侧每降 2 便宜 2，负侧每降 2 贵 2</text>

    <rect x="416" y="302" width="316" height="50" rx="8" fill="#f3f3f3" stroke="#9aa0a6" stroke-width="1.3"/>
    <text x="574" y="322" text-anchor="middle" font-size="12" font-weight="bold" fill="#3a4045">④ 答案 = at_lo(1) + 所有负增量之和</text>
    <text x="574" y="341" text-anchor="middle" font-size="11" fill="#3a4045">at_lo 记窗口左端的代价（全取 +1 的那一端）</text>
  </g>

  <rect x="16" y="374" width="728" height="42" rx="9" fill="#eef7f0" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <text x="380" y="393" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e">「凸 + 只要前缀/后缀整段改常数」⇒ 用可合并有序多重集维护：O(n log n)</text>
    <text x="380" y="409" text-anchor="middle" font-size="11.5" fill="#3c5e2e">只需要的操作：按名次切三段（前缀 −2 / 中段不动 / 后缀 +2）、两个多重集求并</text>
  </g>
</svg>
