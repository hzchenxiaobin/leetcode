<svg xmlns="http://www.w3.org/2000/svg" width="840" height="380" viewBox="0 0 840 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="380" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">把每个环收缩成一个点，得到一棵树</text>
  <text x="420" y="56" text-anchor="middle" font-size="11.8" fill="#666666" filter="url(#rough2)">答案 = 2^(路径上的环节点数) mod 1e9+7</text>
  <g filter="url(#rough2)"><circle cx="200" cy="120" r="26" fill="#d7ecd0" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="200" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><circle cx="120" cy="210" r="26" fill="#d7ecd0" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="120" y="216" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><circle cx="200" cy="290" r="26" fill="#d7ecd0" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="200" y="296" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><circle cx="290" cy="210" r="26" fill="#d7ecd0" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="290" y="216" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><line x1="200" y1="146" x2="140" y2="190" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><line x1="140" y1="232" x2="190" y2="268" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><line x1="210" y1="290" x2="272" y2="232" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><line x1="222" y1="144" x2="272" y2="190" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="205" y="210" text-anchor="middle" font-size="10" fill="#3d6b2f" filter="url(#rough2)">环</text>
  <g filter="url(#rough2)"><line x1="340" y1="210" x2="420" y2="210" stroke="#888888" stroke-width="1.6" marker-end="url(#arrb)"/></g>
  <g filter="url(#rough2)"><circle cx="520" cy="210" r="34" fill="#f6e3c4" fill-opacity="0.9" stroke="#a0522d" stroke-width="1.8"/></g>
  <text x="520" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">C₁</text>
  <text x="520" y="262" text-anchor="middle" font-size="10.5" fill="#8a4b2a" filter="url(#rough2)">环收缩成一个节点</text>
  <text x="650" y="160" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">树上路径经过的</text>
  <text x="650" y="184" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">环节点数 = c</text>
  <text x="650" y="208" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3d6b2f" filter="url(#rough2)">答案 = 2^c</text>
  <text x="420" y="330" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">每个环贡献 2 种选择；桥不贡献</text>
  <text x="420" y="356" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">环内询问恒为 2；不同环的选择互相独立</text>
</svg>
