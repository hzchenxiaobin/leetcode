<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="51"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="450" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">n = 4, m = 3：两次操作，b 逐位加到 a 的一段上</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="92.0" y="106.0" width="60.0" height="60.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="122.0" y="142.0" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="156.0" y="106.0" width="60.0" height="60.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="186.0" y="142.0" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="220.0" y="106.0" width="60.0" height="60.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="250.0" y="142.0" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="284.0" y="106.0" width="60.0" height="60.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="314.0" y="142.0" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="90.0" y="90.0" text-anchor="start" font-size="12.5" fill="#555" filter="url(#rough2)">a（初始，模 2 下取值）</text>
  <text x="122.0" y="186.0" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">a0</text>
  <text x="186.0" y="186.0" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">a1</text>
  <text x="250.0" y="186.0" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">a2</text>
  <text x="314.0" y="186.0" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">a3</text>
  <rect x="92.0" y="232.0" width="60.0" height="60.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="122.0" y="268.0" text-anchor="middle" font-size="15" fill="#8a6015" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="156.0" y="232.0" width="60.0" height="60.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="186.0" y="268.0" text-anchor="middle" font-size="15" fill="#8a6015" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="220.0" y="232.0" width="60.0" height="60.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="250.0" y="268.0" text-anchor="middle" font-size="15" fill="#8a6015" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="298.0" y="222.0" text-anchor="start" font-size="12.5" fill="#8a6015" filter="url(#rough2)">第 1 次：b 覆盖 a₀…a₂</text>
  <text x="90.0" y="320.0" text-anchor="start" font-size="13.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">第 1 次后：a = (0, 0, 0, 1)</text>
  <rect x="156.0" y="350.0" width="60.0" height="60.0" fill="#fde8e8" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="186.0" y="386.0" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="220.0" y="350.0" width="60.0" height="60.0" fill="#fde8e8" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="250.0" y="386.0" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="284.0" y="350.0" width="60.0" height="60.0" fill="#fde8e8" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="314.0" y="386.0" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="362.0" y="340.0" text-anchor="start" font-size="12.5" fill="#b85450" filter="url(#rough2)">第 2 次：b 右移一格，覆盖 a₁…a₃</text>
  <text x="90.0" y="438.0" text-anchor="start" font-size="13.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">第 2 次后：a = (0, 1, 1, 0) ← 答案</text>
</svg>
