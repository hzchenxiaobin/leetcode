<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="151"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="440" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每个窗口：和、最小值、花费</text>
  <path d="M 180 44 Q 380 50 580 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 6x5 网格 -->
  <g filter="url(#rough2)">
    <rect x="60" y="90" width="264" height="220" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.3"/>
    <line x1="104" y1="90" x2="104" y2="310" stroke="#ded8cc"/>
    <line x1="148" y1="90" x2="148" y2="310" stroke="#ded8cc"/>
    <line x1="192" y1="90" x2="192" y2="310" stroke="#ded8cc"/>
    <line x1="236" y1="90" x2="236" y2="310" stroke="#ded8cc"/>
    <line x1="280" y1="90" x2="280" y2="310" stroke="#ded8cc"/>
    <line x1="60" y1="134" x2="324" y2="134" stroke="#ded8cc"/>
    <line x1="60" y1="178" x2="324" y2="178" stroke="#ded8cc"/>
    <line x1="60" y1="222" x2="324" y2="222" stroke="#ded8cc"/>
    <line x1="60" y1="266" x2="324" y2="266" stroke="#ded8cc"/>
  </g>
  <g font-size="13" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">
    <text x="82" y="121">4</text><text x="126" y="121">7</text><text x="170" y="121">2</text><text x="214" y="121">9</text><text x="258" y="121">3</text><text x="302" y="121">5</text>
    <text x="82" y="165">8</text><text x="126" y="165">2</text><text x="170" y="165">6</text><text x="214" y="165">1</text><text x="258" y="165">7</text><text x="302" y="165">4</text>
    <text x="82" y="209">3</text><text x="126" y="209">5</text><text x="170" y="209">9</text><text x="214" y="209">8</text><text x="258" y="209">2</text><text x="302" y="209">6</text>
    <text x="82" y="253">7</text><text x="126" y="253">1</text><text x="170" y="253">4</text><text x="214" y="253">2</text><text x="258" y="253">9</text><text x="302" y="253">3</text>
    <text x="82" y="297">2</text><text x="126" y="297">8</text><text x="170" y="297">5</text><text x="214" y="297">6</text><text x="258" y="297">1</text><text x="302" y="297">7</text>
  </g>

  <!-- 高亮窗口 -->
  <rect x="103" y="133" width="133" height="89" fill="#fff8e1" opacity="0.55" filter="url(#rough2)"/>
  <rect x="103" y="133" width="133" height="89" fill="none" stroke="#b85450" stroke-width="2.6" filter="url(#rough2)"/>
  <text x="169" y="84" text-anchor="middle" font-size="11" fill="#8a3b36" filter="url(#rough2)">a × b 窗口</text>

  <circle cx="214" cy="165" r="14" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  
  <!-- 右侧公式 -->
  <rect x="352" y="70" width="384" height="270" rx="12" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="372" y="96" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">窗口信息</text>

  <text x="372" y="126" font-size="11.5" fill="#446688" filter="url(#rough2)">和：二维前缀和，O(1)</text>
  <text x="372" y="150" font-size="11.5" fill="#446688" filter="url(#rough2)">S = P[i+a][j+b] - P[i][j+b] - P[i+a][j] + P[i][j]</text>

  <text x="372" y="184" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">最小值：先按行、再按列做两次滑动窗口</text>
  <text x="372" y="208" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">单调队列：队首就是当前窗口最小值</text>

  <rect x="366" y="228" width="356" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="380" y="255" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">cost = S - min × a × b</text>

  <text x="372" y="296" font-size="11.5" fill="#555" filter="url(#rough2)">本图窗口：S = 2+6+1 + 5+9+8 = 31</text>
  <text x="372" y="318" font-size="11.5" fill="#555" filter="url(#rough2)">min = 1，a×b = 6 ⇒ cost = 31 - 6 = 25</text>

  <!-- 底部说明 -->
  <rect x="60" y="366" width="676" height="54" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="78" y="390" font-size="11.5" fill="#2f5223" filter="url(#rough2)">所有窗口的和与最小值都可在 O(nm) 预处理后 O(1) 得到；</text>
  <text x="78" y="410" font-size="11.5" fill="#2f5223" filter="url(#rough2)">把最多 10⁶ 个窗口的 (cost, 行, 列) 排序，就得到全局的选择优先级。</text>
</svg>
