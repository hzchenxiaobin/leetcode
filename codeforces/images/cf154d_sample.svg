<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="515"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="230" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">三个样例</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">0 2 0 4 → d=2 ∈ [0,4] ⇒ FIRST；0 2 1 1 → d=2=a+b ⇒ SECOND；0 2 0 1 → DRAW</text>
  <text x="450" y="104" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">d = 2，[a,b] = [0,4] ⇒ FIRST，跳到 x₂ = 2</text>
  <text x="450" y="138" text-anchor="middle" font-size="12" fill="#8a2b28" filter="url(#rough2)">d = 2，a = b = 1 ⇒ d = a+b = 2 ⇒ SECOND</text>
  <text x="450" y="172" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">d = 2，[a,b] = [0,1] ⇒ 既非 I 也非 a+b ⇒ DRAW</text>
</svg>
