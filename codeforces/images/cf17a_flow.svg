<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="340" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">A：筛出素数，再用“相邻素数 + 相邻素数 + 1”打标记</text>
  <path d="M 120 42 Q 380 47 640 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <text x="52" y="82" font-size="11.5" fill="#777" filter="url(#rough2)">2..n 的素数（筛法一遍得到）</text>
  <rect x="52" y="92" width="42" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="100" y="92" width="42" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="148" y="92" width="42" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="196" y="92" width="42" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="244" y="92" width="42" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="73" y="115" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">2</text>
  <text x="121" y="115" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">3</text>
  <text x="169" y="115" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">5</text>
  <text x="217" y="115" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">7</text>
  <text x="265" y="115" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">11</text>

  <line x1="73" y1="126" x2="73" y2="150" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="121" y1="126" x2="121" y2="150" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="169" y1="126" x2="169" y2="150" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="217" y1="126" x2="217" y2="150" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <line x1="265" y1="126" x2="265" y2="150" stroke="#999" stroke-width="1" filter="url(#rough2)"/>

  <text x="52" y="170" font-size="11.5" fill="#777" filter="url(#rough2)">相邻两素数之和 + 1，再判是不是素数</text>
  <text x="60" y="202" font-size="11.5" fill="#8c3a36" filter="url(#rough2)">2+3+1 = 6</text>
  <text x="150" y="202" font-size="11.5" fill="#2f5223" filter="url(#rough2)">3+5+1 = 9</text>
  <text x="240" y="202" font-size="11.5" fill="#2f5223" filter="url(#rough2)">5+7+1 = 13 ✓</text>
  <text x="360" y="202" font-size="11.5" fill="#2f5223" filter="url(#rough2)">7+11+1 = 19 ✓</text>

  <line x1="40" y1="216" x2="600" y2="216" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <text x="52" y="242" font-size="11.5" fill="#777" filter="url(#rough2)">把 ✓ 的那些收集起来（本身是素数、且形如 p+q+1）</text>
  <rect x="52" y="252" width="120" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="112" y="278" text-anchor="middle" font-size="13" fill="#2f5223" filter="url(#rough2)">13, 19</text>
  <rect x="186" y="252" width="150" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="261" y="278" text-anchor="middle" font-size="13" fill="#2f5223" filter="url(#rough2)">31, 37, 43</text>
  <rect x="350" y="252" width="150" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="425" y="278" text-anchor="middle" font-size="13" fill="#2f5223" filter="url(#rough2)">53, 61, 79 …</text>

  <line x1="516" y1="272" x2="548" y2="272" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <rect x="556" y="244" width="168" height="56" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="640" y="266" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">数一数 ≤ n 的有几个</text>
  <text x="640" y="288" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">个数 ≥ k → YES，否则 NO</text>

  <text x="52" y="318" font-size="10.5" fill="#555" filter="url(#rough2)">注意：6 = 2+3+1 不是素数，所以 6 不算；同一个数即使有多种拆法，也只统计一次。</text>
</svg>
