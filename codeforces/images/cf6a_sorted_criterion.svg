<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrA" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="430" fill="#fafafa"/>

  <text x="380" y="38" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">三边排序成 a ≤ b ≤ c，只看 a + b 与 c 的关系</text>
  <path d="M 120 50 Q 380 57 640 50" stroke="#2b2b2b" stroke-width="1.3" fill="none"
        filter="url(#rough2)"/>

  <!-- 面板 1：a+b>c -->
  <rect x="30" y="72" width="220" height="230" rx="12" fill="#eef4ff" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 60 236 L 218 236 L 108 128 Z" stroke="#446688" stroke-width="2.6" fill="#dbe7fb"
        filter="url(#rough2)"/>
  <text x="139" y="256" text-anchor="middle" font-size="14" fill="#23405c" filter="url(#rough2)">c（最长边）</text>
  <text x="80" y="182" text-anchor="middle" font-size="14" fill="#23405c" filter="url(#rough2)">b</text>
  <text x="176" y="182" text-anchor="middle" font-size="14" fill="#23405c" filter="url(#rough2)">a</text>
  <text x="140" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5223"
        filter="url(#rough2)">a + b &gt; c</text>
  <text x="140" y="286" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">闭合，有正面积 → TRIANGLE</text>

  <!-- 面板 2：a+b=c -->
  <rect x="270" y="72" width="220" height="230" rx="12" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6015"
        filter="url(#rough2)">a + b = c</text>
  <line x1="300" y1="196" x2="380" y2="196" stroke="#b85450" stroke-width="5" filter="url(#rough2)"/>
  <line x1="380" y1="196" x2="440" y2="196" stroke="#4a7a3a" stroke-width="5" filter="url(#rough2)"/>
  <line x1="300" y1="228" x2="440" y2="228" stroke="#8a6015" stroke-width="5" stroke-dasharray="1 0"
        filter="url(#rough2)"/>
  <text x="340" y="184" text-anchor="middle" font-size="13" fill="#8c3b37" filter="url(#rough2)">b</text>
  <text x="410" y="184" text-anchor="middle" font-size="13" fill="#2f5223" filter="url(#rough2)">a</text>
  <text x="370" y="250" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">c 正好等于 a + b</text>
  <circle cx="440" cy="196" r="3.4" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="440" cy="228" r="3.4" fill="#8a6015" filter="url(#rough2)"/>
  <circle cx="300" cy="196" r="3.4" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="300" cy="228" r="3.4" fill="#8a6015" filter="url(#rough2)"/>
  <text x="380" y="286" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">三点共线 → SEGMENT</text>

  <!-- 面板 3：a+b<c -->
  <rect x="510" y="72" width="220" height="230" rx="12" fill="#fdeef0" stroke="#b85450"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="620" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#8c3b37"
        filter="url(#rough2)">a + b &lt; c</text>
  <line x1="540" y1="196" x2="595" y2="196" stroke="#b85450" stroke-width="5" filter="url(#rough2)"/>
  <line x1="595" y1="196" x2="640" y2="196" stroke="#4a7a3a" stroke-width="5" filter="url(#rough2)"/>
  <line x1="640" y1="196" x2="700" y2="196" stroke="#8c3b37" stroke-width="5" filter="url(#rough2)"/>
  <line x1="540" y1="228" x2="640" y2="228" stroke="#8a6015" stroke-width="5" filter="url(#rough2)"/>
  <text x="567" y="184" text-anchor="middle" font-size="13" fill="#8c3b37" filter="url(#rough2)">b</text>
  <text x="617" y="184" text-anchor="middle" font-size="13" fill="#2f5223" filter="url(#rough2)">a</text>
  <text x="670" y="184" text-anchor="middle" font-size="13" fill="#8c3b37" filter="url(#rough2)">c 的剩余</text>
  <text x="620" y="252" text-anchor="middle" font-size="12.5" fill="#8c3b37" filter="url(#rough2)">中间空一段，够不着</text>
  <text x="620" y="286" text-anchor="middle" font-size="12.5" fill="#8c3b37" filter="url(#rough2)">连退化都不行 → IMPOSSIBLE</text>

  <!-- 底部结论 -->
  <rect x="120" y="322" width="520" height="86" rx="10" fill="#eef1f7" stroke="#7a8ca6"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="140" y="350" font-size="13.5" font-weight="bold" fill="#33445c" filter="url(#rough2)">为什么另外两条不等式不用查？</text>
  <text x="140" y="374" font-size="12.5" fill="#44597a" filter="url(#rough2)">因为 c 最大：a + c ≥ a + b &gt; c ≥ b，所以 a + c &gt; b 自动成立；</text>
  <text x="140" y="396" font-size="12.5" fill="#44597a" filter="url(#rough2)">b + c &gt; a 更显然。三条不等式里只有「最长边那条」是活的。</text>
  <path d="M 130 316 L 118 300" stroke="#446688" stroke-width="1.6" fill="none"
        marker-end="url(#arrA)" filter="url(#rough2)"/>
</svg>
