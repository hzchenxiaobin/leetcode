<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="320" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">删掉最左边的一个 0</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">删 0 相当于把左边所有 1 整体左移一位，收益最大；没有 0 时随便删一个 1</text>
  <g filter="url(#rough2)"><rect x="150" y="110" width="72" height="46" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="186.0" y="139.12" text-anchor="middle" font-size="17" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="186" y="180" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="240" y="110" width="72" height="46" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="276.0" y="139.12" text-anchor="middle" font-size="17" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="276" y="180" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="330" y="110" width="72" height="46" rx="4" fill="#f6d9d7" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="366.0" y="139.12" text-anchor="middle" font-size="17" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="366" y="180" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="420" y="110" width="72" height="46" rx="4" fill="#f6d9d7" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="456.0" y="139.12" text-anchor="middle" font-size="17" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="456" y="180" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><rect x="510" y="110" width="72" height="46" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="546.0" y="139.12" text-anchor="middle" font-size="17" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="546" y="180" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">5</text>
  <g filter="url(#rough2)"><rect x="600" y="110" width="72" height="46" rx="4" fill="#f6d9d7" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="636.0" y="139.12" text-anchor="middle" font-size="17" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="636" y="180" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">6</text>
  <line x1="366" y1="196" x2="366" y2="230" stroke="#b05a5a" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="330" y="250" text-anchor="middle" font-size="12.5" fill="#b05a5a" filter="url(#rough2)">删掉第 3 位（最左的 0）</text>
  <text x="440" y="290" text-anchor="middle" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">得到 11010（长度 5）；若删别的位会更小</text>
</svg>
