<svg xmlns="http://www.w3.org/2000/svg" width="740" height="340" viewBox="0 0 740 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1167"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="740" height="340" fill="#fafafa"/>
  <text x="370.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每行朝向由行号决定</text>
  <path d="M 118.4 42 Q 370.0 48 621.6 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="370.0" y="326" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">奇数行朝右、偶数行朝左；出口列要合并下一行的极值</text>
  <rect x="60" y="70" width="620" height="60" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="370" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">行 1（→）</text>
  <text x="370" y="117" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">入口 0 → 出口 max(本行右端, 行 2 右端)</text>
  <rect x="60" y="150" width="620" height="60" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="370" y="175" text-anchor="middle" font-size="13" font-weight="bold" fill="#335478" filter="url(#rough2)">行 2（←）</text>
  <text x="370" y="197" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">入口 = 上行出口 → 出口 min(本行左端, 行 3 左端)</text>
  <rect x="60" y="230" width="620" height="60" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="370" y="255" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">行 3（→）</text>
  <text x="370" y="277" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">依此类推</text>
  <text x="370" y="310" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">下移一格同时翻转朝向 ⇒ 行内只能单向走，出口要提前满足下一行的最远需求</text>
</svg>
