<svg xmlns="http://www.w3.org/2000/svg" width="800" height="510" viewBox="0 0 800 510"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arro" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c98a2b"/>
    </marker>
  </defs>

  <rect width="800" height="510" fill="#fafafa"/>

  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">先按宽排序，把二维偏序压成一维 LIS</text>
  <path d="M 190 42 Q 400 48 610 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 左：排序前 -->
  <rect x="24" y="62" width="170" height="240" rx="12" fill="#eef4fb" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="36" y="86" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">排序前：输入顺序</text>

  <g filter="url(#rough2)">
    <rect x="36" y="98" width="146" height="32" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.3"/>
    <text x="48" y="119" font-size="11.5" fill="#2b2b2b">#1  (5, 4)</text>
    <rect x="36" y="138" width="146" height="32" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.3"/>
    <text x="48" y="159" font-size="11.5" fill="#2b2b2b">#2  (12, 11)</text>
    <rect x="36" y="178" width="146" height="32" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.3"/>
    <text x="48" y="199" font-size="11.5" fill="#2b2b2b">#3  (9, 8)</text>
    <rect x="36" y="218" width="146" height="32" rx="8" fill="#f4f7fb" stroke="#446688" stroke-width="1.3" stroke-dasharray="4 3"/>
    <text x="48" y="239" font-size="11.5" fill="#2b2b2b">#4  (9, 20)</text>
    <rect x="36" y="258" width="146" height="32" rx="8" fill="#f4f7fb" stroke="#446688" stroke-width="1.3" stroke-dasharray="4 3"/>
    <text x="48" y="279" font-size="11.5" fill="#2b2b2b">#5  (9, 2)</text>
  </g>

  <!-- 中间箭头 -->
  <path d="M 198 182 L 300 182" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="249" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">排序</text>
  <text x="249" y="206" text-anchor="middle" font-size="11" fill="#4a6b8a" filter="url(#rough2)">宽↑</text>
  <text x="249" y="224" text-anchor="middle" font-size="11" fill="#4a6b8a" filter="url(#rough2)">同宽高↓</text>

  <!-- 右：排序后 -->
  <text x="306" y="86" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">排序后：宽升序，同宽按高降序</text>

  <g filter="url(#rough2)">
    <rect x="306" y="98" width="84" height="34" rx="8" fill="#fdf3e0" stroke="#c98a2b" stroke-width="1.5"/>
    <text x="348" y="120" text-anchor="middle" font-size="11" fill="#8a6015">#1 5×4</text>
    <rect x="398" y="98" width="84" height="34" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.3"/>
    <text x="440" y="120" text-anchor="middle" font-size="11" fill="#2b2b2b">#4 9×20</text>
    <rect x="490" y="98" width="84" height="34" rx="8" fill="#fdf3e0" stroke="#c98a2b" stroke-width="1.5"/>
    <text x="532" y="120" text-anchor="middle" font-size="11" fill="#8a6015">#3 9×8</text>
    <rect x="582" y="98" width="84" height="34" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.3"/>
    <text x="624" y="120" text-anchor="middle" font-size="11" fill="#2b2b2b">#5 9×2</text>
    <rect x="674" y="98" width="84" height="34" rx="8" fill="#fdf3e0" stroke="#c98a2b" stroke-width="1.5"/>
    <text x="716" y="120" text-anchor="middle" font-size="11" fill="#8a6015">#2 12×11</text>

    <rect x="306" y="146" width="84" height="30" rx="7" fill="#ffffff" stroke="#c98a2b" stroke-width="1.4"/>
    <text x="348" y="167" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6015">h = 4</text>
    <rect x="398" y="146" width="84" height="30" rx="7" fill="#ffffff" stroke="#9aa8b6" stroke-width="1.3"/>
    <text x="440" y="167" text-anchor="middle" font-size="12" fill="#555555">h = 20</text>
    <rect x="490" y="146" width="84" height="30" rx="7" fill="#ffffff" stroke="#c98a2b" stroke-width="1.4"/>
    <text x="532" y="167" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6015">h = 8</text>
    <rect x="582" y="146" width="84" height="30" rx="7" fill="#ffffff" stroke="#9aa8b6" stroke-width="1.3"/>
    <text x="624" y="167" text-anchor="middle" font-size="12" fill="#555555">h = 2</text>
    <rect x="674" y="146" width="84" height="30" rx="7" fill="#ffffff" stroke="#c98a2b" stroke-width="1.4"/>
    <text x="716" y="167" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6015">h = 11</text>
  </g>

  <!-- 递增子序列弧线 -->
  <path d="M 348 178 C 348 236 532 236 532 178" stroke="#c98a2b" stroke-width="1.6" fill="none"
        marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="440" y="246" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">4 &lt; 8</text>
  <path d="M 532 178 C 532 258 716 258 716 178" stroke="#c98a2b" stroke-width="1.6" fill="none"
        marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="624" y="276" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">8 &lt; 11</text>

  <text x="306" y="302" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">同宽的 #4、#3、#5 只能选一个（高降序挡住并列宽）</text>

  <!-- 底部结论 -->
  <rect x="24" y="330" width="752" height="152" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="42" y="358" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">为什么同宽要按高“降序”排？</text>
  <text x="42" y="384" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">若按高升序排，#4(9,20) 与 #3(9,8) 的高就是递增的，LIS 会把它们串起来——但两者宽相等，链非法。</text>
  <text x="42" y="408" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">改成高降序后，同宽的高必然递减，严格递增的子序列在同一宽段里至多取一个，等价于“宽严格变大”。</text>
  <text x="42" y="434" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">上图的 h 序列是 4, 20, 8, 2, 11；严格递增子序列 4 → 8 → 11 长度为 3，就是最大链。</text>
  <text x="42" y="460" font-size="11.5" fill="#9a7020" filter="url(#rough2)">排序 O(n log n) + LIS O(n log n)；过滤条件 w &gt; w卡片 且 h &gt; h卡片 在排序前完成。</text>
</svg>
