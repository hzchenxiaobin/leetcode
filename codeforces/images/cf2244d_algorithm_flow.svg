<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#57708c" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="880" height="500" fill="#fafafa"/>
  <text x="440" y="36" text-anchor="middle" font-size="18" fill="#22303c" filter="url(#rough2)">算法流程：排序 b → 前缀和切段 → 逐段取绝对值 → 补尾部</text>

  <!-- 主流程 -->
  <rect x="56" y="62" width="330" height="58" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="221" y="86" text-anchor="middle" font-size="13" fill="#22303c" filter="url(#rough2)">读入 n, m, a[1..n], b[1..m]</text>
  <text x="221" y="106" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">求前缀和 pre[0..n]（long long）</text>

  <path d="M221 120 L221 146" stroke="#57708c" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="56" y="150" width="330" height="52" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="221" y="172" text-anchor="middle" font-size="13" fill="#22303c" filter="url(#rough2)">把 b 升序排序（b 互不相同）</text>
  <text x="221" y="191" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">prev = 0，ans = 0</text>

  <path d="M221 202 L221 228" stroke="#57708c" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="56" y="232" width="330" height="70" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="221" y="254" text-anchor="middle" font-size="13" fill="#22303c" filter="url(#rough2)">for x in b（升序）：</text>
  <text x="221" y="274" text-anchor="middle" font-size="12.5" fill="#2f5a2a" filter="url(#rough2)">s = pre[x] - pre[prev]</text>
  <text x="221" y="292" text-anchor="middle" font-size="12.5" fill="#2f5a2a" filter="url(#rough2)">ans += |s|；prev = x</text>

  <path d="M221 302 L221 328" stroke="#57708c" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="56" y="332" width="330" height="58" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="221" y="354" text-anchor="middle" font-size="13" fill="#22303c" filter="url(#rough2)">ans += pre[n] - pre[prev]</text>
  <text x="221" y="374" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">尾部 (b_m, n] 无人能翻，原样相加</text>

  <path d="M221 390 L221 416" stroke="#57708c" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="56" y="420" width="330" height="46" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="221" y="449" text-anchor="middle" font-size="14" fill="#6b5320" filter="url(#rough2)">输出 ans</text>

  <!-- 右侧注解 -->
  <rect x="426" y="150" width="420" height="240" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="448" y="180" font-size="14" fill="#6b5320" filter="url(#rough2)">为什么每一段可以自由决定？</text>
  <text x="448" y="210" font-size="12.5" fill="#6b5320" filter="url(#rough2)">· 读 b_k 等价于把第 1..k 段一起取反</text>
  <text x="448" y="236" font-size="12.5" fill="#6b5320" filter="url(#rough2)">· 记 p_k 为第 k 段被翻的奇偶，x_k 为</text>
  <text x="448" y="258" font-size="12.5" fill="#6b5320" filter="url(#rough2)">  是否读 b_k，则 p_k = p_(k+1) XOR x_k</text>
  <text x="448" y="284" font-size="12.5" fill="#6b5320" filter="url(#rough2)">· 从右往左：x_k 想要什么就取什么，</text>
  <text x="448" y="306" font-size="12.5" fill="#6b5320" filter="url(#rough2)">   于是 p_m, p_(m-1), ..., p_1 全部自由</text>
  <text x="448" y="332" font-size="12.5" fill="#b85450" filter="url(#rough2)">· 唯独尾部 p_(m+1) = 0，动不了</text>
  <text x="448" y="362" font-size="12.5" fill="#446688" filter="url(#rough2)">结论：ans = Σ |S_k| + 尾部</text>

  <text x="440" y="487" text-anchor="middle" font-size="12.5" fill="#5b6773" filter="url(#rough2)">复杂度 O(n + m log m)，迭代式实现，比枚举 2^m 个子集快得多</text>
</svg>
