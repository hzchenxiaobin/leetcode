  <text x="440" y="388" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">二分图：每个连通分量可以整体翻转颜色（两种选择），所以安排数 = 2^(连通分量数)</text>
  <text x="440" y="414" text-anchor="middle" font-size="12" fill="#3d6b2f" filter="url(#rough2)">D 增大 ⇒ 冲突边减少 ⇒ 更容易二分；对 D 二分，找到最小的可行 D 再数分量</text>
