<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 358"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="680" height="358" fill="#fafafa" filter="url(#rough2)"/>

  <text x="340" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    走查：a = [2, 5, 3, 4, 1, 6]（官方第 3 组，答案 4）
  </text>

  <text x="30" y="60" font-size="13" fill="#446688" filter="url(#rough2)">① 每条边界 M 是否「坏」</text>

  <rect x="30" y="72" width="420" height="34" rx="6" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="88" y="94" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">M</text>
  <text x="180" y="94" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">premax(M)</text>
  <text x="272" y="94" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">sufmin(M)</text>
  <text x="356" y="94" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">bad?</text>
  <text x="422" y="94" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">v₂(M)</text>

  <rect x="30" y="108" width="420" height="28" fill="#ffffff" filter="url(#rough2)"/>
  <rect x="30" y="136" width="420" height="28" fill="#f4f4f4" filter="url(#rough2)"/>
  <rect x="30" y="164" width="420" height="28" fill="#ffffff" filter="url(#rough2)"/>
  <rect x="30" y="192" width="420" height="28" rx="5" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="30" y="220" width="420" height="28" fill="#ffffff" filter="url(#rough2)"/>

  <text x="88" y="127" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="88" y="155" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="88" y="183" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="88" y="211" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">4</text>
  <text x="88" y="239" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>

  <text x="180" y="127" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="180" y="155" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="180" y="183" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="180" y="211" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="180" y="239" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>

  <text x="272" y="127" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="272" y="155" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="272" y="183" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="272" y="211" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="272" y="239" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">6</text>

  <text x="356" y="127" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">坏</text>
  <text x="356" y="155" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">坏</text>
  <text x="356" y="183" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">坏</text>
  <text x="356" y="211" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">坏</text>
  <text x="356" y="239" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">好</text>

  <text x="422" y="127" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">0</text>
  <text x="422" y="155" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">1</text>
  <text x="422" y="183" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">0</text>
  <text x="422" y="211" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">2</text>
  <text x="422" y="239" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">—</text>

  <path d="M30,252 L450,252" fill="none" stroke="#cfcfcf" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="30" y="274" font-size="12" fill="#333" filter="url(#rough2)">T = max v₂(M) = 2（坏边界 M = 4 给出）</text>
  <text x="30" y="296" font-size="13" fill="#b85450" filter="url(#rough2)">⇒ f(a) = 2^T = 4</text>

  <text x="470" y="60" font-size="13" fill="#4a7a3a" filter="url(#rough2)">② 每个块大小 2^t 是否可行</text>

  <rect x="470" y="72" width="196" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="500" y="92" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">t</text>
  <text x="570" y="92" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">要检查的 M</text>
  <text x="644" y="92" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">结果</text>

  <text x="500" y="124" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="570" y="124" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2, 4</text>
  <text x="644" y="124" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗</text>

  <text x="500" y="156" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="570" y="156" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="644" y="156" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗</text>

  <text x="500" y="188" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="570" y="188" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8 &gt; n−1</text>
  <text x="644" y="188" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <path d="M470,206 L666,206" fill="none" stroke="#cfcfcf" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="470" y="228" font-size="11" fill="#4a7a3a" filter="url(#rough2)">首个可行 t = 3</text>
  <text x="470" y="250" font-size="11" fill="#4a7a3a" filter="url(#rough2)">块大小 2^t = 8 ≥ n</text>
  <text x="470" y="276" font-size="11" fill="#b85450" filter="url(#rough2)">答案 = 2^(t−1) = 4</text>
  <path d="M436,190 C452,214 456,240 466,258" fill="none" stroke="#446688"
        stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="340" y="322" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    两条路等价：坏边界 M 会让所有整除 M 的块大小 2^t 失效，故 t 取到「最大 v₂ + 1」为止
  </text>
  <text x="340" y="344" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">
    实现只需 O(n)：扫一遍前缀最大值 + 后缀最小值，用 __builtin_ctz 取 v₂
  </text>
</svg>
