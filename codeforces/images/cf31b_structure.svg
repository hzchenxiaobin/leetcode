<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="223"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="320" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">B：每个邮箱恰好一个 '@'，所以邮箱个数 = '@' 的个数</text>
  <path d="M 110 42 Q 380 47 650 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <text x="60" y="80" font-size="11.5" fill="#777" filter="url(#rough2)">邮箱的形状：字母 字母 … 字母 @ 字母 … 字母</text>
  <rect x="60" y="92" width="150" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="135" y="118" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">A：≥1 个字母</text>
  <rect x="210" y="92" width="40" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="230" y="118" text-anchor="middle" font-size="14" fill="#8a6015" filter="url(#rough2)">@</text>
  <rect x="250" y="92" width="150" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="325" y="118" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">B：≥1 个字母</text>

  <text x="60" y="168" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">输入是没有逗号的拼接串，例如 a@aa@a：</text>
  <rect x="60" y="180" width="40" height="40" rx="5" fill="#ffffff" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="104" y="180" width="40" height="40" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="148" y="180" width="40" height="40" rx="5" fill="#ffffff" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="192" y="180" width="40" height="40" rx="5" fill="#ffffff" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="236" y="180" width="40" height="40" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="280" y="180" width="40" height="40" rx="5" fill="#ffffff" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="80" y="207" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">a</text>
  <text x="124" y="207" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">@</text>
  <text x="168" y="207" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">a</text>
  <text x="212" y="207" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">a</text>
  <text x="256" y="207" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">@</text>
  <text x="300" y="207" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">a</text>
  <text x="80" y="240" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">1</text>
  <text x="124" y="240" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">2</text>
  <text x="168" y="240" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">3</text>
  <text x="212" y="240" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">4</text>
  <text x="256" y="240" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">5</text>
  <text x="300" y="240" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">6</text>

  <text x="356" y="196" font-size="11" fill="#777" filter="url(#rough2)">切两刀 →</text>
  <line x1="352" y1="200" x2="392" y2="200" stroke="#777" stroke-width="1.2" filter="url(#rough2)"/>

  <rect x="400" y="172" width="130" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="465" y="194" text-anchor="middle" font-size="13" fill="#2f5223" font-family="'Courier New',monospace" filter="url(#rough2)">a@a</text>
  <text x="545" y="194" font-size="12" fill="#555" filter="url(#rough2)">,</text>
  <rect x="560" y="172" width="130" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="625" y="194" text-anchor="middle" font-size="13" fill="#2f5223" font-family="'Courier New',monospace" filter="url(#rough2)">a@a</text>

  <rect x="60" y="262" width="640" height="44" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="72" y="289" font-size="11" fill="#2f4a66" filter="url(#rough2)">关键：每个邮箱恰好含一个 '@' ⇒ 邮箱个数 = '@' 的总数，且第 t 个邮箱里放第 t 个 '@'。</text>
</svg>
