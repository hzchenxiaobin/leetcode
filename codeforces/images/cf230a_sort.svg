<svg xmlns="http://www.w3.org/2000/svg" width="840" height="360" viewBox="0 0 840 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="360" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按龙的强度升序贪心挑战</text>
  <text x="420" y="56" text-anchor="middle" font-size="11.8" fill="#666666" filter="url(#rough2)">先打弱的拿加成，再去打更强的</text>
  <g filter="url(#rough2)"><rect x="130" y="100" width="140" height="46" rx="4" fill="#f6d9d7" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="200" y="129" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">x=1</text>
  <g filter="url(#rough2)"><rect x="290" y="100" width="140" height="46" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="360" y="129" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">y=99</text>
  <text x="470" y="129" text-anchor="start" font-size="11.5" fill="#333333" filter="url(#rough2)">2 &gt; 1 ✓ → 力量 101</text>
  <g filter="url(#rough2)"><rect x="130" y="172" width="140" height="46" rx="4" fill="#f6d9d7" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="200" y="201" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">x=100</text>
  <g filter="url(#rough2)"><rect x="290" y="172" width="140" height="46" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="360" y="201" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">y=0</text>
  <text x="470" y="201" text-anchor="start" font-size="11.5" fill="#333333" filter="url(#rough2)">101 &gt; 100 ✓</text>
  <g filter="url(#rough2)"><line x1="200" y1="148" x2="200" y2="172" stroke="#888888" stroke-width="1.4" marker-end="url(#arrb)"/></g>
  <text x="420" y="270" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">排序后依次尝试：力量 ≤ x 就失败；否则 s += y</text>
  <g filter="url(#rough2)"><rect x="230" y="296" width="380" height="40" rx="4" fill="#f7fbf4" fill-opacity="0.85" stroke="#a8c99a" stroke-width="1.3"/></g>
  <text x="420" y="322" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3d6b2f" filter="url(#rough2)">交换引理：升序顺序合法 ⇔ 存在合法顺序</text>
</svg>
