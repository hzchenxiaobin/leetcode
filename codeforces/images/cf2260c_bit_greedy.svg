<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 0 780 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="780" height="440" fill="#fafafa"/>

  <text x="390" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">子问题：求 S 的不超过 x 的最大子集</text>
  <path d="M 150 42 Q 390 49 630 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="390" y="64" text-anchor="middle" font-size="12.5" fill="#66788c" filter="url(#rough2)">操作次数 k = x − a，于是「最小化 k」⇔「最大化 a」</text>

  <path d="M 496 80 L 184 80" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="340" y="72" text-anchor="middle" font-size="12" fill="#5b7a99" filter="url(#rough2)">扫描方向：高位 → 低位</text>

  <!-- S 行 -->
  <text x="166" y="124" text-anchor="end" font-size="13.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">S 的位</text>
  <rect x="180" y="100" width="70" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="215" y="129" text-anchor="middle" font-size="17" fill="#2f4a66" filter="url(#rough2)">1</text>
  <rect x="262" y="100" width="70" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="297" y="129" text-anchor="middle" font-size="17" fill="#2f4a66" filter="url(#rough2)">0</text>
  <rect x="344" y="100" width="70" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="379" y="129" text-anchor="middle" font-size="17" fill="#2f4a66" filter="url(#rough2)">1</text>
  <rect x="426" y="100" width="70" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="461" y="129" text-anchor="middle" font-size="17" fill="#2f4a66" filter="url(#rough2)">0</text>
  <text x="536" y="124" text-anchor="start" font-size="13" fill="#2f4a66" filter="url(#rough2)">S = 10 = 1010₂（例）</text>
  <text x="536" y="142" text-anchor="start" font-size="11" fill="#5b7a99" filter="url(#rough2)">只有 1 的位才允许放 1</text>

  <!-- x 行 -->
  <text x="166" y="180" text-anchor="end" font-size="13.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">上界 x 的位</text>
  <rect x="180" y="156" width="70" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="215" y="185" text-anchor="middle" font-size="17" fill="#8a6015" filter="url(#rough2)">0</text>
  <rect x="262" y="156" width="70" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="297" y="185" text-anchor="middle" font-size="17" fill="#8a6015" filter="url(#rough2)">1</text>
  <rect x="344" y="156" width="70" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="379" y="185" text-anchor="middle" font-size="17" fill="#8a6015" filter="url(#rough2)">1</text>
  <rect x="426" y="156" width="70" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="461" y="185" text-anchor="middle" font-size="17" fill="#8a6015" filter="url(#rough2)">0</text>
  <text x="536" y="180" text-anchor="start" font-size="13" fill="#8a6015" filter="url(#rough2)">x = 6 = 0110₂（例）</text>
  <text x="536" y="198" text-anchor="start" font-size="11" fill="#b08a3e" filter="url(#rough2)">候选值一旦超过它就要回退</text>

  <!-- a 行 -->
  <text x="166" y="236" text-anchor="end" font-size="13.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">结果 a 的位</text>
  <rect x="180" y="212" width="70" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.1" filter="url(#rough2)"/>
  <text x="215" y="241" text-anchor="middle" font-size="17" fill="#a14340" filter="url(#rough2)">0</text>
  <text x="215" y="270" text-anchor="middle" font-size="10.5" fill="#a14340" filter="url(#rough2)">8 &gt; 6 弃</text>
  <rect x="262" y="212" width="70" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="297" y="241" text-anchor="middle" font-size="17" fill="#3c5e2e" filter="url(#rough2)">0</text>
  <text x="297" y="270" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">S 位为 0</text>
  <rect x="344" y="212" width="70" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.1" filter="url(#rough2)"/>
  <text x="379" y="241" text-anchor="middle" font-size="17" fill="#3c5e2e" filter="url(#rough2)">1</text>
  <text x="379" y="270" text-anchor="middle" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">2 ≤ 6 放</text>
  <rect x="426" y="212" width="70" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="461" y="241" text-anchor="middle" font-size="17" fill="#3c5e2e" filter="url(#rough2)">0</text>
  <text x="461" y="270" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">S 位为 0</text>
  <text x="536" y="236" text-anchor="start" font-size="13" fill="#3c5e2e" filter="url(#rough2)">a = 2，k = x − a = 4</text>

  <rect x="96" y="292" width="588" height="58" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="390" y="316" text-anchor="middle" font-size="13.5" fill="#8a6015" filter="url(#rough2)">逐位决策：若 S 该位为 1 且 (a | 2^i) ≤ x，就放 1；否则该位只能放 0</text>
  <text x="390" y="339" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">关键：cand &gt; x 时，任何含此位 1 的子集都 ≥ cand &gt; x，只能弃；能放就放最划算</text>

  <text x="390" y="384" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">S 的 1 位全取 ⇒ a = S ⇒ 异或 S；但 a ≤ x 的限制逼我们放弃高位、改拿低位</text>
  <text x="390" y="410" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">共 31 位，每位 O(1) 比较 ⇒ 单组 O(30)</text>
</svg>
