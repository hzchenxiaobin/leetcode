<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 0 780 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="780" height="440" fill="#fafafa"/>

  <text x="390" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：一次操作 = 两令牌换位 + 各自取反，翻转次数 ≡ 位移奇偶</text>
  <path d="M 66 44 Q 390 50 714 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <text x="57" y="76" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">① 两种等价写法</text>

  <rect x="57" y="86" width="102" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="108" y="114" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">a_i = x</text>
  <rect x="169" y="86" width="102" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="220" y="114" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">a_(i+1) = y</text>

  <path d="M 282 108 L 344 108" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="313" y="100" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">同时赋值</text>

  <rect x="354" y="86" width="102" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="405" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#a14340" filter="url(#rough2)">−y</text>
  <rect x="468" y="86" width="102" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="519" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#a14340" filter="url(#rough2)">−x</text>

  <text x="592" y="100" font-size="11.5" fill="#a14340" filter="url(#rough2)">两值互换位置，</text>
  <text x="592" y="118" font-size="11.5" fill="#a14340" filter="url(#rough2)">再各自乘 −1</text>

  <text x="57" y="170" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">② 令牌 j 每被操作一次：位置改变 ±1、值乘 −1 ⟹ 翻转次数 ≡ p − j (mod 2)</text>

  <rect x="64" y="188" width="112" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="213" text-anchor="middle" font-size="12" fill="#2f5d22" filter="url(#rough2)">位置 2：值 x</text>
  <path d="M 182 208 L 234 208" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="208" y="200" text-anchor="middle" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">位移 +1</text>
  <rect x="240" y="188" width="112" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="296" y="213" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">位置 3：−x</text>
  <text x="64" y="252" font-size="11" fill="#3c5e2e" filter="url(#rough2)">奇位移 ⇒ 翻转奇数次 ⇒ 符号取反</text>

  <rect x="464" y="188" width="112" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="520" y="213" text-anchor="middle" font-size="12" fill="#2f5d22" filter="url(#rough2)">位置 2：值 x</text>
  <path d="M 582 208 L 634 208" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="608" y="200" text-anchor="middle" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">位移 +2</text>
  <rect x="640" y="188" width="112" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="696" y="213" text-anchor="middle" font-size="12" fill="#2f5d22" filter="url(#rough2)">位置 4：值 x</text>
  <text x="464" y="252" font-size="11" fill="#3c5e2e" filter="url(#rough2)">偶位移 ⇒ 翻转偶数次 ⇒ 符号不变</text>

  <text x="57" y="288" font-size="13" fill="#2b2b2b" filter="url(#rough2)">一般形式：a_p = ε_j · (−1)^(p−j) · x_j （x_j = |a_j|，ε_j 为初始符号）</text>

  <rect x="52" y="306" width="676" height="52" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="390" y="329" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">把奇数位（1-indexed）取反：b_i = (−1)^(i−1) · a_i，则任意排列 z 都给出一个可达数组</text>
  <text x="390" y="349" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">a_p = (−1)^(p−1) · b_z(p)，即「b 随便重排，再按 +1,−1,+1,−1,… 加权」</text>

  <rect x="52" y="370" width="676" height="52" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="390" y="393" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">于是 n! 个可达状态坍缩成一次排序：最小的 ⌊n/2⌋ 个 b 放 −1 位，其余 ⌈n/2⌉ 个放 +1 位</text>
  <text x="390" y="413" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">答案 = 最大的 ⌈n/2⌉ 个 b 之和 − 最小的 ⌊n/2⌋ 个 b 之和</text>
</svg>
