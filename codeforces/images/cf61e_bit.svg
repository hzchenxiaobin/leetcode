<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420">
<defs>
  <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs>
<rect x="0" y="0" width="760" height="420" fill="#fafafa"/>
<text x="380.0" y="34" font-size="22" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="bold" text-anchor="middle" filter="url(#rough2)">两遍树状数组：先正扫求 L，再倒扫求 R</text>
<text x="40" y="85" font-size="15" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#2e7d32" font-weight="normal" text-anchor="start" filter="url(#rough2)">正扫（左→右）：</text>
<rect x="200" y="62" width="200" height="44" rx="8" fill="#e6f4ea" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="300.0" y="88.9" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">BIT 存已出现的值</text>
<rect x="430" y="62" width="280" height="44" rx="8" fill="#e6f4ea" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="570.0" y="88.55" font-size="13" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">L[j] = j − count(≤ a[j])</text>
<text x="40" y="150" font-size="15" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#c0392b" font-weight="normal" text-anchor="start" filter="url(#rough2)">倒扫（右→左）：</text>
<rect x="200" y="127" width="200" height="44" rx="8" fill="#fde8e8" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="300.0" y="153.9" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">BIT 存右侧已出现的值</text>
<rect x="430" y="127" width="280" height="44" rx="8" fill="#fde8e8" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="570.0" y="153.55" font-size="13" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">R[j] = count(&lt; a[j])</text>
<text x="380" y="220" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="normal" text-anchor="middle" filter="url(#rough2)">值域 1e9 → 先离散化到 1..n，再上树状数组</text>
<text x="380" y="258" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#1a5fb4" font-weight="normal" text-anchor="middle" filter="url(#rough2)">答案用 long long：最大 C(10^6,3) ≈ 1.67×10^17</text>
<text x="380" y="296" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#2e7d32" font-weight="normal" text-anchor="middle" filter="url(#rough2)">O(n log n) 时间，O(n) 空间</text>
<text x="380" y="350" font-size="13" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#c0392b" font-weight="normal" text-anchor="middle" filter="url(#rough2)">单调递减数组是答案最大的情况：每个 j 都有 L=j−1、R=n−j</text>
</svg>
