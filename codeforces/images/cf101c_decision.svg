<svg xmlns="http://www.w3.org/2000/svg" width="880" height="412" viewBox="0 0 880 412"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="101"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="412" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">判定流程：B − R^a A 是否落在格里</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">解 2×2 整系数方程组，要求两个分量都能被 cx²+cy² 整除</text>
  <g filter="url(#rough2)"><rect x="80" y="84" width="720" height="56" rx="4" fill="#f6e3c4" fill-opacity="0.5" stroke="#c9a86a" stroke-width="1.4"/></g>
  <text x="440" y="108" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">对 a = 0,1,2,3：令 (dx,dy) = B − R^a·A</text>
  <text x="440" y="130" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">若 C = (0,0)：L = {0}，只需 dx = dy = 0</text>
  <g filter="url(#rough2)"><rect x="80" y="168" width="720" height="74" rx="4" fill="#d7ecd0" fill-opacity="0.4" stroke="#6a9a58" stroke-width="1.4"/></g>
  <text x="440" y="196" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">解 dx = a·cx + b·cy，dy = a·cy − b·cx</text>
  <text x="440" y="222" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">行列式 = −(cx²+cy²) → a = (cx·dx + cy·dy)/D，b = (cy·dx − cx·dy)/D，D = cx²+cy²</text>
  <g filter="url(#rough2)"><rect x="80" y="264" width="720" height="60" rx="4" fill="#cfe0f5" fill-opacity="0.45" stroke="#6688aa" stroke-width="1.4"/></g>
  <text x="440" y="290" text-anchor="middle" font-size="12.5" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">两个分子都能被 D 整除 ⟹ 这一 a 可行 ⟹ 输出 YES</text>
  <text x="440" y="312" text-anchor="middle" font-size="12" fill="#8a2b28" filter="url(#rough2)">4 个 a 都不行 → NO</text>
  <text x="440" y="360" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">坐标 ≤ 10⁸：D ≤ 2·10¹⁶、分子 ≤ 4·10¹⁶，均在 64 位内</text>
  <text x="440" y="386" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">注意 L 在旋转下不变（R(L) = L），所以 4 个旋转只需换 A</text>
</svg>
