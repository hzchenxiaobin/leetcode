<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="780" height="470" fill="#fafafa"/>

  <text x="390" y="28" text-anchor="middle" font-size="15.5" fill="#333" filter="url(#rough2)">样例 2 演算：n = 4，a = [1, 2, 3, 4]，b = [1, 9, 2, 3]</text>

  <!-- 左表：三组指示子 -->
  <rect x="28" y="46" width="364" height="198" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="92" y="76" text-anchor="middle" font-size="13" fill="#2f4a63" filter="url(#rough2)">i</text>
  <text x="150" y="76" text-anchor="middle" font-size="13" fill="#2f4a63" filter="url(#rough2)">1</text>
  <text x="214" y="76" text-anchor="middle" font-size="13" fill="#2f4a63" filter="url(#rough2)">2</text>
  <text x="278" y="76" text-anchor="middle" font-size="13" fill="#2f4a63" filter="url(#rough2)">3</text>
  <text x="342" y="76" text-anchor="middle" font-size="13" fill="#2f4a63" filter="url(#rough2)">4</text>

  <text x="92" y="106" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">a_i</text>
  <text x="150" y="106" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#rough2)">1</text>
  <text x="214" y="106" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#rough2)">2</text>
  <text x="278" y="106" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#rough2)">3</text>
  <text x="342" y="106" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#rough2)">4</text>

  <text x="92" y="134" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">b_i</text>
  <text x="150" y="134" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#rough2)">1</text>
  <text x="214" y="134" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#rough2)">9</text>
  <text x="278" y="134" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#rough2)">2</text>
  <text x="342" y="134" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#rough2)">3</text>

  <text x="92" y="166" text-anchor="middle" font-size="12.5" fill="#33612a" filter="url(#rough2)">V_i</text>
  <text x="150" y="166" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="214" y="166" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#rough2)">0</text>
  <text x="278" y="166" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#rough2)">0</text>
  <text x="342" y="166" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#rough2)">0</text>

  <text x="92" y="196" text-anchor="middle" font-size="12.5" fill="#33612a" filter="url(#rough2)">Y_i</text>
  <text x="150" y="196" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#rough2)">0</text>
  <text x="214" y="196" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="278" y="196" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="342" y="196" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#rough2)">–</text>

  <text x="92" y="226" text-anchor="middle" font-size="12.5" fill="#33612a" filter="url(#rough2)">Z_i</text>
  <text x="150" y="226" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#rough2)">0</text>
  <text x="214" y="226" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#rough2)">0</text>
  <text x="278" y="226" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#rough2)">0</text>
  <text x="342" y="226" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#rough2)">–</text>

  <!-- 右表：DP 值 -->
  <rect x="412" y="46" width="340" height="198" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="452" y="76" text-anchor="middle" font-size="13" fill="#33612a" filter="url(#rough2)">k</text>
  <text x="520" y="76" text-anchor="middle" font-size="13" fill="#33612a" filter="url(#rough2)">1</text>
  <text x="584" y="76" text-anchor="middle" font-size="13" fill="#33612a" filter="url(#rough2)">2</text>
  <text x="648" y="76" text-anchor="middle" font-size="13" fill="#33612a" filter="url(#rough2)">3</text>
  <text x="712" y="76" text-anchor="middle" font-size="13" fill="#33612a" filter="url(#rough2)">4</text>

  <text x="452" y="106" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">g[k]</text>
  <text x="520" y="106" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#rough2)">2</text>
  <text x="584" y="106" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#rough2)">2</text>
  <text x="648" y="106" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#rough2)">1</text>
  <text x="712" y="106" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#rough2)">0</text>

  <text x="452" y="134" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">p[k]</text>
  <text x="520" y="134" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#rough2)">0</text>
  <text x="584" y="134" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#rough2)">1</text>
  <text x="648" y="134" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#rough2)">1</text>
  <text x="712" y="134" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#rough2)">1</text>

  <text x="452" y="166" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">W[k]</text>
  <text x="520" y="166" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#rough2)">2</text>
  <text x="648" y="166" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#rough2)">2</text>
  <text x="712" y="166" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#rough2)">1</text>
  <rect x="566" y="146" width="36" height="26" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="584" y="166" text-anchor="middle" font-size="13.5" fill="#b85450" filter="url(#rough2)">3</text>

  <text x="432" y="200" font-size="12.5" fill="#33612a" filter="url(#rough2)">max W = 3，取 k = 2</text>
  <text x="432" y="226" font-size="12.5" fill="#b85450" filter="url(#rough2)">答案 = (2n−1) + 3 = 7 + 3 = 10</text>

  <!-- 最优路径 -->
  <text x="40" y="278" font-size="12.5" fill="#333" filter="url(#rough2)">最优路径 P_2 = a1 b1 a2 b3 a4 b4 a3 b2（k = 2：先锯齿到 a2，再把第 3、4 列折返）</text>

  <rect x="38" y="292" width="64" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="313" text-anchor="middle" font-size="12" fill="#2f4a63" filter="url(#rough2)">a1</text>
  <line x1="102" y1="308" x2="128" y2="308" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="128" y="292" width="64" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="313" text-anchor="middle" font-size="12" fill="#33612a" filter="url(#rough2)">b1</text>
  <line x1="192" y1="308" x2="218" y2="308" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <rect x="218" y="292" width="64" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="313" text-anchor="middle" font-size="12" fill="#2f4a63" filter="url(#rough2)">a2</text>
  <line x1="282" y1="308" x2="308" y2="308" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="308" y="292" width="64" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="340" y="313" text-anchor="middle" font-size="12" fill="#33612a" filter="url(#rough2)">b3</text>
  <line x1="372" y1="308" x2="398" y2="308" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <rect x="398" y="292" width="64" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="430" y="313" text-anchor="middle" font-size="12" fill="#2f4a63" filter="url(#rough2)">a4</text>
  <line x1="462" y1="308" x2="488" y2="308" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <rect x="488" y="292" width="64" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="520" y="313" text-anchor="middle" font-size="12" fill="#33612a" filter="url(#rough2)">b4</text>
  <line x1="552" y1="308" x2="578" y2="308" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="578" y="292" width="64" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="610" y="313" text-anchor="middle" font-size="12" fill="#2f4a63" filter="url(#rough2)">a3</text>
  <line x1="642" y1="308" x2="668" y2="308" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <rect x="668" y="292" width="64" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="700" y="313" text-anchor="middle" font-size="12" fill="#33612a" filter="url(#rough2)">b2</text>

  <text x="113" y="344" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">2</text>
  <text x="203" y="344" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">1</text>
  <text x="293" y="344" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">2</text>
  <text x="383" y="344" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">1</text>
  <text x="473" y="344" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">1</text>
  <text x="563" y="344" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">2</text>
  <text x="653" y="344" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">1</text>

  <text x="40" y="366" font-size="12" fill="#555" filter="url(#rough2)">边长合计 2+1+2+1+1+2+1 = 10，其中 3 条是同公司边（红色）</text>

  <rect x="28" y="380" width="724" height="80" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="48" y="406" font-size="12.5" fill="#8a6520" filter="url(#rough2)">对比：纯锯齿 P_4（k = 4）只有 W = 1、总长 8；蛇形 P_2 换来 3 条同公司边，总长 10。</text>
  <text x="48" y="434" font-size="12.5" fill="#8a6520" filter="url(#rough2)">所以「折返」有时更划算 —— 这正是要枚举 k、用 DP 求最大 W_k 的原因。</text>
</svg>
