<svg xmlns="http://www.w3.org/2000/svg" width="740" height="380" viewBox="0 0 740 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="61"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="740" height="380" fill="#fafafa"/>
  <text x="370" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">接触就会合并成一个块，于是两个图形都不再是正方形</text>

  <text x="155" y="68" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8f3b37" filter="url(#rough2)">✗ 菱形与 2×2 斜角相邻</text>
  <g filter="url(#rough2)">
    <rect x="50" y="80" width="210" height="210" fill="#ffffff" stroke="#c9ced6" stroke-width="1.2"/>
    <line x1="80" y1="80" x2="80" y2="290" stroke="#e4e6ea" stroke-width="1"/>
    <line x1="110" y1="80" x2="110" y2="290" stroke="#e4e6ea" stroke-width="1"/>
    <line x1="140" y1="80" x2="140" y2="290" stroke="#e4e6ea" stroke-width="1"/>
    <line x1="170" y1="80" x2="170" y2="290" stroke="#e4e6ea" stroke-width="1"/>
    <line x1="200" y1="80" x2="200" y2="290" stroke="#e4e6ea" stroke-width="1"/>
    <line x1="230" y1="80" x2="230" y2="290" stroke="#e4e6ea" stroke-width="1"/>
    <line x1="50" y1="110" x2="260" y2="110" stroke="#e4e6ea" stroke-width="1"/>
    <line x1="50" y1="140" x2="260" y2="140" stroke="#e4e6ea" stroke-width="1"/>
    <line x1="50" y1="170" x2="260" y2="170" stroke="#e4e6ea" stroke-width="1"/>
    <line x1="50" y1="200" x2="260" y2="200" stroke="#e4e6ea" stroke-width="1"/>
    <line x1="50" y1="230" x2="260" y2="230" stroke="#e4e6ea" stroke-width="1"/>
    <line x1="50" y1="260" x2="260" y2="260" stroke="#e4e6ea" stroke-width="1"/>
    <rect x="140" y="110" width="30" height="30" fill="#d6a040" stroke="#b8860b" stroke-width="1"/>
    <rect x="110" y="140" width="30" height="30" fill="#d6a040" stroke="#b8860b" stroke-width="1"/>
    <rect x="170" y="140" width="30" height="30" fill="#d6a040" stroke="#b8860b" stroke-width="1"/>
    <rect x="80" y="170" width="30" height="30" fill="#d6a040" stroke="#b8860b" stroke-width="1"/>
    <rect x="200" y="170" width="30" height="30" fill="#d6a040" stroke="#b8860b" stroke-width="1"/>
    <rect x="110" y="200" width="30" height="30" fill="#d6a040" stroke="#b8860b" stroke-width="1"/>
    <rect x="170" y="200" width="30" height="30" fill="#d6a040" stroke="#b8860b" stroke-width="1"/>
    <rect x="140" y="230" width="30" height="30" fill="#d6a040" stroke="#b8860b" stroke-width="1"/>
    <rect x="50" y="80" width="210" height="210" fill="#ffffff" stroke="#c9ced6" stroke-width="1.2"/>
    <line x1="80" y1="80" x2="80" y2="290" stroke="#e4e6ea" stroke-width="1"/>
    <line x1="110" y1="80" x2="110" y2="290" stroke="#e4e6ea" stroke-width="1"/>
    <line x1="140" y1="80" x2="140" y2="290" stroke="#e4e6ea" stroke-width="1"/>
    <line x1="170" y1="80" x2="170" y2="290" stroke="#e4e6ea" stroke-width="1"/>
    <line x1="200" y1="80" x2="200" y2="290" stroke="#e4e6ea" stroke-width="1"/>
    <line x1="230" y1="80" x2="230" y2="290" stroke="#e4e6ea" stroke-width="1"/>
    <line x1="50" y1="110" x2="260" y2="110" stroke="#e4e6ea" stroke-width="1"/>
    <line x1="50" y1="140" x2="260" y2="140" stroke="#e4e6ea" stroke-width="1"/>
    <line x1="50" y1="170" x2="260" y2="170" stroke="#e4e6ea" stroke-width="1"/>
    <line x1="50" y1="200" x2="260" y2="200" stroke="#e4e6ea" stroke-width="1"/>
    <line x1="50" y1="230" x2="260" y2="230" stroke="#e4e6ea" stroke-width="1"/>
    <line x1="50" y1="260" x2="260" y2="260" stroke="#e4e6ea" stroke-width="1"/>
    <rect x="170" y="230" width="30" height="30" fill="#446688" stroke="#2f4a66" stroke-width="1"/>
    <rect x="200" y="230" width="30" height="30" fill="#446688" stroke="#2f4a66" stroke-width="1"/>
    <rect x="170" y="260" width="30" height="30" fill="#446688" stroke="#2f4a66" stroke-width="1"/>
    <rect x="200" y="260" width="30" height="30" fill="#446688" stroke="#2f4a66" stroke-width="1"/>
    <rect x="170" y="230" width="30" height="30" fill="none" stroke="#b85450" stroke-width="2.4" stroke-dasharray="4 3"/>
  </g>
  <text x="155" y="318" text-anchor="middle" font-size="11.5" fill="#8f3b37" filter="url(#rough2)">（5,3）与（6,4）共角 ⇒ 同一个 8 连通块</text>
  <text x="155" y="338" text-anchor="middle" font-size="11.5" fill="#8f3b37" filter="url(#rough2)">块里有 12 + 4 = 16 格，两种判定都不成立</text>

  <text x="505" y="68" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">✓ 孤立的 2×2 方块</text>
  <g filter="url(#rough2)">
    <rect x="400" y="80" width="210" height="210" fill="#ffffff" stroke="#c9ced6" stroke-width="1.2"/>
    <line x1="430" y1="80" x2="430" y2="290" stroke="#e4e6ea" stroke-width="1"/>
    <line x1="460" y1="80" x2="460" y2="290" stroke="#e4e6ea" stroke-width="1"/>
    <line x1="490" y1="80" x2="490" y2="290" stroke="#e4e6ea" stroke-width="1"/>
    <line x1="520" y1="80" x2="520" y2="290" stroke="#e4e6ea" stroke-width="1"/>
    <line x1="550" y1="80" x2="550" y2="290" stroke="#e4e6ea" stroke-width="1"/>
    <line x1="580" y1="80" x2="580" y2="290" stroke="#e4e6ea" stroke-width="1"/>
    <line x1="400" y1="110" x2="610" y2="110" stroke="#e4e6ea" stroke-width="1"/>
    <line x1="400" y1="140" x2="610" y2="140" stroke="#e4e6ea" stroke-width="1"/>
    <line x1="400" y1="170" x2="610" y2="170" stroke="#e4e6ea" stroke-width="1"/>
    <line x1="400" y1="200" x2="610" y2="200" stroke="#e4e6ea" stroke-width="1"/>
    <line x1="400" y1="230" x2="610" y2="230" stroke="#e4e6ea" stroke-width="1"/>
    <line x1="400" y1="260" x2="610" y2="260" stroke="#e4e6ea" stroke-width="1"/>
    <rect x="460" y="140" width="30" height="30" fill="#4a7a3a" stroke="#2f5223" stroke-width="1"/>
    <rect x="490" y="140" width="30" height="30" fill="#4a7a3a" stroke="#2f5223" stroke-width="1"/>
    <rect x="460" y="170" width="30" height="30" fill="#4a7a3a" stroke="#2f5223" stroke-width="1"/>
    <rect x="490" y="170" width="30" height="30" fill="#4a7a3a" stroke="#2f5223" stroke-width="1"/>
    <rect x="452" y="132" width="76" height="76" fill="none" stroke="#4a7a3a" stroke-width="2.2" stroke-dasharray="5 4"/>
  </g>
  <text x="505" y="318" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">四周一圈全空 ⇒ 块恰好是 4 格边框</text>
  <text x="505" y="338" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">k = 2 的平行型正方形，答案 +1</text>

  <text x="370" y="366" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">这就是样例 1 的情形：左边那团整体不算，右边那个方块算 1 个。</text>
</svg>
