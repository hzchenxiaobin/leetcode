<svg xmlns="http://www.w3.org/2000/svg" width="720" height="370" viewBox="0 0 720 370"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="370" fill="#fafafa"/>
  <text x="360.0" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">204E：链接树上统计“出现在多少个串里”</text>
  <path d="M 144.00 46 Q 360.0 52 576.00 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="72" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">做法：把所有串建成广义后缀自动机，先算每个状态“出现在多少个不同的串里”。</text>
  <text x="60" y="92" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">每个串的每个前缀落在一个状态上；状态 v 出现在串 d 中 ⟺ d 的某个前缀状态在 v 的链接子树里。</text>
  <circle cx="200" cy="130" r="20" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="200" y="135" text-anchor="middle" font-size="9" fill="#33506e" filter="url(#rough2)">root</text>
  <circle cx="110" cy="200" r="19" fill="#cfe3c8" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="110" y="205" text-anchor="middle" font-size="10" fill="#2f5b34" filter="url(#rough2)">a:4</text>
  <circle cx="290" cy="200" r="19" fill="#cfe3c8" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="290" y="205" text-anchor="middle" font-size="10" fill="#2f5b34" filter="url(#rough2)">b:4</text>
  <circle cx="200" cy="270" r="19" fill="#f6e3a8" stroke="#c08a30" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="200" y="275" text-anchor="middle" font-size="10" fill="#8a6015" filter="url(#rough2)">ab:3</text>
  <line x1="186" y1="144" x2="124" y2="186" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="214" y1="144" x2="276" y2="186" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="122" y1="214" x2="186" y2="258" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="278" y1="214" x2="214" y2="258" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="330" y="150" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">沿链接向上：串变短、出现的串数不减</text>
  <text x="330" y="172" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">（ab 出现 3 个串 ⇒ a、b 至少 3 个）</text>
  <text x="330" y="200" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">“子树内不同文档数”用欧拉序 + BIT 离线：</text>
  <text x="330" y="222" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">区间 [tin, tout] 内不同颜色的个数 = O((N+Q)log)</text>
  <rect x="60" y="300" width="620" height="52" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="318" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">Q = 状态数（≤ 2N），共用一个 BIT；每个状态得到 cnt[v] 后即可开始逐串匹配。</text>
</svg>
