<svg xmlns="http://www.w3.org/2000/svg" width="740" height="360" viewBox="0 0 740 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="606"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="e1" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="740" height="360" fill="#fafafa"/>

  <text x="370" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例与连通块：共享一个数就能把两族三元组连起来</text>
  <path d="M 110 40 Q 370 46 610 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 左侧：三元组 -->
  <circle cx="120" cy="110" r="6" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="230" cy="110" r="6" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="175" cy="190" r="6" fill="#b85450" filter="url(#rough2)"/>
  <line x1="120" y1="116" x2="172" y2="184" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="230" y1="116" x2="178" y2="184" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="126" y1="110" x2="224" y2="110" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="112" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#8c3a37" filter="url(#rough2)">3</text>
  <text x="240" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#8c3a37" filter="url(#rough2)">5</text>
  <text x="175" y="212" text-anchor="middle" font-size="12" font-weight="bold" fill="#8c3a37" filter="url(#rough2)">4</text>
  <text x="175" y="240" text-anchor="middle" font-size="11.5" fill="#8c3a37" filter="url(#rough2)">三元组 (3,4,5)</text>

  <!-- 右侧：第二族 -->
  <circle cx="420" cy="110" r="6" fill="#446688" filter="url(#rough2)"/>
  <circle cx="530" cy="110" r="6" fill="#446688" filter="url(#rough2)"/>
  <circle cx="475" cy="190" r="6" fill="#446688" filter="url(#rough2)"/>
  <line x1="420" y1="116" x2="472" y2="184" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="530" y1="116" x2="478" y2="184" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="426" y1="110" x2="524" y2="110" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="412" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a68" filter="url(#rough2)">5</text>
  <text x="540" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a68" filter="url(#rough2)">13</text>
  <text x="475" y="212" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a68" filter="url(#rough2)">12</text>
  <text x="475" y="240" text-anchor="middle" font-size="11.5" fill="#2b4a68" filter="url(#rough2)">三元组 (5,12,13)</text>

  <!-- 共享 5 -->
  <path d="M 246 104 Q 330 80 406 104" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="6 4" fill="none" marker-end="url(#e1)" filter="url(#rough2)"/>
  <text x="326" y="82" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">共享 5 ⇒ 合并</text>

  <!-- 结论 -->
  <rect x="60" y="264" width="620" height="82" rx="8" fill="#f4f8ee" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="288" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">用这些样例对照：</text>
  <text x="76" y="310" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">输入 3 5 → 同处 (3,4,5)，一个连通块，答案 1</text>
  <text x="76" y="330" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">输入 3 4 5 12 → (3,4,5) 与 (5,12,13) 通过 5 相连，答案 1；输入 1 2 → 1、2 不在任何本原三元组里，答案 2</text>
</svg>
