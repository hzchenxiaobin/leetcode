<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="739"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="290" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">最小表面积 ⇒ 三条棱尽量都接近 ∛V</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">枚举 a ≤ ∛V、b ≤ √(V/a)，c = V/(ab)</text>
  <g filter="url(#rough2)"><rect x="80" y="100" width="300" height="150" rx="6" fill="#ffffff" fill-opacity="0.04" stroke="#446688" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><path d="M 120 220 L 300 220 L 300 140 L 120 140 Z" fill="#cfe0f5" stroke="#446688" stroke-width="1.6"/></g>
  <g filter="url(#rough2)"><path d="M 120 140 L 160 100 L 340 100 L 300 140" fill="#dcecd2" stroke="#446688" stroke-width="1.6"/></g>
  <g filter="url(#rough2)"><path d="M 300 140 L 340 100 L 340 180 L 300 220" fill="#f3d9d6" stroke="#446688" stroke-width="1.6"/></g>
  <text x="210" y="185" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="320" y="175" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="330" y="115" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="600" y="120" text-anchor="start" font-size="12" fill="#446688" filter="url(#rough2)">S = 2(ab + bc + ca)</text>
  <text x="600" y="154" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">排序后设 a ≤ b ≤ c</text>
  <text x="600" y="186" text-anchor="start" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">⇒ a³ ≤ V，b² ≤ V/a</text>
  <text x="600" y="218" text-anchor="start" font-size="11" fill="#666666" filter="url(#rough2)">用 __int128 防溢出</text>
</svg>
