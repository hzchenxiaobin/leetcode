<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">三组走查：谁先在时序上碰到 m</text>
  <text x="310" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每格写成「轮次 玩家 本轮得分 → 该玩家当前累计分」</text>

  <g filter="url(#rough2)">
    <rect x="30" y="58" width="560" height="102" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10"/>
    <text x="46" y="80" font-size="11.5" fill="#33445c" font-weight="bold">① 官方样例 1</text>
    <rect x="46" y="88" width="118" height="28" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4"/>
    <text x="105" y="107" text-anchor="middle" font-size="9.5" fill="#333">1 mike 3 → 3</text>
    <rect x="172" y="88" width="118" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="231" y="107" text-anchor="middle" font-size="9.5" fill="#8a3a36">2 andrew 5 → 5</text>
    <rect x="298" y="88" width="118" height="28" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4"/>
    <text x="357" y="107" text-anchor="middle" font-size="9.5" fill="#333">3 mike 2 → 5</text>
    <text x="432" y="100" font-size="10.5" fill="#b85450">m = 5</text>
    <text x="432" y="115" font-size="9.5" fill="#8a3a36">andrew 先到</text>
    <text x="46" y="140" font-size="10" fill="#3a4a66">终局 mike 5 / andrew 5 并列；andrew 第 2 轮已到 5，mike 第 3 轮才到 → andrew</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="170" width="560" height="102" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10"/>
    <text x="46" y="192" font-size="11.5" fill="#3a5a30" font-weight="bold">② 官方样例 2</text>
    <rect x="46" y="200" width="118" height="28" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="105" y="219" text-anchor="middle" font-size="9.5" fill="#333">1 andrew 3 → 3</text>
    <rect x="172" y="200" width="118" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="231" y="219" text-anchor="middle" font-size="9.5" fill="#8a3a36">2 andrew 2 → 5</text>
    <rect x="298" y="200" width="118" height="28" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="357" y="219" text-anchor="middle" font-size="9.5" fill="#333">3 mike 5 → 5</text>
    <text x="432" y="212" font-size="10.5" fill="#b85450">m = 5</text>
    <text x="432" y="227" font-size="9.5" fill="#8a3a36">andrew 先到</text>
    <text x="46" y="252" font-size="10" fill="#3a5a30">两人终局都是 5 分，andrew 第 2 轮先到，mike 第 3 轮才到 → andrew</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="282" width="560" height="106" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10"/>
    <text x="46" y="304" font-size="11.5" fill="#8a6a20" font-weight="bold">③ 自造用例：直接跳过 m</text>
    <rect x="46" y="312" width="100" height="28" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <text x="96" y="331" text-anchor="middle" font-size="9.5" fill="#333">1 b 3 → 3</text>
    <rect x="154" y="312" width="100" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="204" y="331" text-anchor="middle" font-size="9.5" fill="#8a3a36">2 b 4 → 7</text>
    <rect x="262" y="312" width="100" height="28" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <text x="312" y="331" text-anchor="middle" font-size="9.5" fill="#333">3 a 5 → 5</text>
    <rect x="370" y="312" width="100" height="28" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <text x="420" y="331" text-anchor="middle" font-size="9.5" fill="#333">4 b −2 → 5</text>
    <text x="486" y="324" font-size="10.5" fill="#b85450">m = 5</text>
    <text x="486" y="338" font-size="9" fill="#8a6a20">b 先到</text>
    <text x="46" y="362" font-size="10" fill="#8a6a20">b 第 2 轮从 3 跳到 7（越过 5），a 第 3 轮才到 5 → 输出 b</text>
    <text x="46" y="378" font-size="9.5" fill="#b85450">若把判定写成 cur = m，b 的「7」不算数，会错答 a；用 cur ≥ m 才对</text>
  </g>

  <text x="310" y="406" text-anchor="middle" font-size="11" fill="#444" font-weight="bold" filter="url(#rough2)">结论：m 由终局决定，胜负由「首次 cur ≥ m」的轮次决定</text>
</svg>
