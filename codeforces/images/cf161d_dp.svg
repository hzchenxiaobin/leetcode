<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="699"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="290" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">dp[u][d] = 子树中距 u 为 d 的点数</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">合并孩子时先计数、再平移并入</text>
  <g filter="url(#rough2)"><rect x="60" y="96" width="380" height="80" rx="6" fill="#dcecd2" fill-opacity="0.4" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="250" y="126" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">计数：Σ dp[v][d] · dp[u][K−1−d]</text>
  <text x="250" y="156" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">跨子树距离 = d + 1 + d′</text>
  <g filter="url(#rough2)"><rect x="480" y="96" width="380" height="80" rx="6" fill="#cfe0f5" fill-opacity="0.4" stroke="#446688" stroke-width="1.4"/></g>
  <text x="670" y="126" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">并入：dp[u][d+1] += dp[v][d]</text>
  <text x="670" y="156" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">路径必经边 u–v</text>
  <text x="450" y="214" text-anchor="middle" font-size="11" fill="#8a2b28" filter="url(#rough2)">顺序不能反：先计数后并入，否则同一子树内的点对会重复计入</text>
  <text x="450" y="248" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">复杂度 O(nK)</text>
</svg>
