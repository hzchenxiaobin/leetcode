<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340">
<defs>
<filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="13" result="noise"/>
<feDisplacementMap in="SourceGraphic" in2="noise" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect x="0" y="0" width="640" height="340" fill="#fafafa"/>
<g font-family="Comic Sans MS, Kaiti SC, cursive">
<text x="320.0" y="24.0" font-size="15" fill="#33475b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">按「名次」逐层放座位的子集 DP</text>
<rect x="80.0" y="60.0" width="110.0" height="58.0" rx="8" fill="#f6d9b0" stroke="#a08050" stroke-width="1.6" filter="url(#rough2)"/>
<text x="135.0" y="84.0" font-size="12" fill="#7a5c2e" text-anchor="middle" font-weight="normal" filter="url(#rough2)">名次 1</text>
<text x="135.0" y="104.0" font-size="11" fill="#7a5c2e" text-anchor="middle" font-weight="normal" filter="url(#rough2)">选一个座位 q</text>
<line x1="194.0" y1="89.0" x2="216.0" y2="89.0" stroke="#8a6d3b" stroke-width="1.8" filter="url(#rough2)"/>
<polygon points="216.0,89.0 207.0,84.5 207.0,93.5" fill="#8a6d3b" filter="url(#rough2)"/>
<rect x="220.0" y="60.0" width="110.0" height="58.0" rx="8" fill="#cfe3d4" stroke="#a08050" stroke-width="1.6" filter="url(#rough2)"/>
<text x="275.0" y="84.0" font-size="12" fill="#7a5c2e" text-anchor="middle" font-weight="normal" filter="url(#rough2)">名次 2</text>
<text x="275.0" y="104.0" font-size="11" fill="#7a5c2e" text-anchor="middle" font-weight="normal" filter="url(#rough2)">选一个座位 q</text>
<line x1="334.0" y1="89.0" x2="356.0" y2="89.0" stroke="#8a6d3b" stroke-width="1.8" filter="url(#rough2)"/>
<polygon points="356.0,89.0 347.0,84.5 347.0,93.5" fill="#8a6d3b" filter="url(#rough2)"/>
<rect x="360.0" y="60.0" width="110.0" height="58.0" rx="8" fill="#f6d9b0" stroke="#a08050" stroke-width="1.6" filter="url(#rough2)"/>
<text x="415.0" y="84.0" font-size="12" fill="#7a5c2e" text-anchor="middle" font-weight="normal" filter="url(#rough2)">名次 3</text>
<text x="415.0" y="104.0" font-size="11" fill="#7a5c2e" text-anchor="middle" font-weight="normal" filter="url(#rough2)">选一个座位 q</text>
<line x1="474.0" y1="89.0" x2="496.0" y2="89.0" stroke="#8a6d3b" stroke-width="1.8" filter="url(#rough2)"/>
<polygon points="496.0,89.0 487.0,84.5 487.0,93.5" fill="#8a6d3b" filter="url(#rough2)"/>
<rect x="500.0" y="60.0" width="110.0" height="58.0" rx="8" fill="#cfe3d4" stroke="#a08050" stroke-width="1.6" filter="url(#rough2)"/>
<text x="555.0" y="84.0" font-size="12" fill="#7a5c2e" text-anchor="middle" font-weight="normal" filter="url(#rough2)">名次 4</text>
<text x="555.0" y="104.0" font-size="11" fill="#7a5c2e" text-anchor="middle" font-weight="normal" filter="url(#rough2)">选一个座位 q</text>
<rect x="70.0" y="140.0" width="500.0" height="80.0" rx="10" fill="#ffffff" stroke="#9ab" stroke-width="1.6" filter="url(#rough2)"/>
<text x="320.0" y="166.0" font-size="13" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">f[S] = 把集合 S 放到名次 1..|S| 的方案数</text>
<text x="320.0" y="192.0" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">f[S] = Σ f[S−{q}]，q 需满足 pred[q] ⊆ S−{q} 且（若已定值）值 = |S|</text>
<text x="320.0" y="240.0" font-size="13" fill="#3f6b4f" text-anchor="middle" font-weight="normal" filter="url(#rough2)">后缀版 h[S]：把剩余座位放到名次 |S|+1..n 的方案数</text>
<rect x="70.0" y="262.0" width="500.0" height="62.0" rx="10" fill="#fdf3d8" stroke="#c9a25a" stroke-width="1.6" filter="url(#rough2)"/>
<text x="320.0" y="286.0" font-size="12" fill="#7a5c2e" text-anchor="middle" font-weight="normal" filter="url(#rough2)">cnt(p, v) = Σ f[S] · h[S ∪ {p}]，其中 |S| = v−1、pred[p] ⊆ S</text>
<text x="320.0" y="308.0" font-size="12" fill="#7a5c2e" text-anchor="middle" font-weight="normal" filter="url(#rough2)">逐个 v 试，k 减去前面的块，命中即固定 π_p</text>
</g>
</svg>
