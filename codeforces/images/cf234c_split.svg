<svg xmlns="http://www.w3.org/2000/svg" width="840" height="320" viewBox="0 0 840 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="320" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">固定分界 k：前缀改非负、后缀改非正</text>
  <text x="420" y="56" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">[-1, 1, -2, 1]，k=1</text>
  <g filter="url(#rough2)"><rect x="200" y="100" width="80" height="48" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="240" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">-1</text>
  <g filter="url(#rough2)"><rect x="310" y="100" width="80" height="48" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="350" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="420" y="100" width="80" height="48" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="460" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">-2</text>
  <g filter="url(#rough2)"><rect x="530" y="100" width="80" height="48" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="570" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><line x1="300" y1="160" x2="300" y2="180" stroke="#888888" stroke-width="1.4"/></g>
  <text x="300" y="196" text-anchor="middle" font-size="11" fill="#777777" filter="url(#rough2)">k = 1</text>
  <text x="260" y="226" text-anchor="middle" font-size="11" fill="#3d6b2f" filter="url(#rough2)">前缀 &lt; 0</text>
  <text x="520" y="226" text-anchor="middle" font-size="11" fill="#8a4b2a" filter="url(#rough2)">后缀 &gt; 0</text>
  <text x="420" y="262" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">1 出现在前缀 → 改；-2 出现在后缀 → 改 ⇒ 代价 1</text>
  <g filter="url(#rough2)"><rect x="230" y="282" width="380" height="30" rx="4" fill="#f7fbf4" fill-opacity="0.85" stroke="#a8c99a" stroke-width="1.3"/></g>
  <text x="420" y="302" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3d6b2f" filter="url(#rough2)">答案 = min_k (前缀非负 + 后缀非正)</text>
</svg>
