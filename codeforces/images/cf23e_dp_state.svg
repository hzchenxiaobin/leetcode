<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 0 780 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="601"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="780" height="440" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">树形 DP 的状态：v 的"开放块" + 子树里已闭合的块</text>

  <!-- 树 -->
  <line x1="280" y1="70" x2="170" y2="150" stroke="#7a8ca6" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="280" y1="70" x2="400" y2="150" stroke="#7a8ca6" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="170" y1="150" x2="100" y2="240" stroke="#7a8ca6" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="170" y1="150" x2="240" y2="240" stroke="#7a8ca6" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="400" y1="150" x2="340" y2="240" stroke="#7a8ca6" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="400" y1="150" x2="460" y2="240" stroke="#7a8ca6" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="340" y1="240" x2="340" y2="330" stroke="#c0392b" stroke-width="2.2" stroke-dasharray="6 4" filter="url(#rough2)"/>

  <circle cx="280" cy="70" r="17" fill="#dbe7fb" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="76" text-anchor="middle" font-size="13" fill="#23405c" filter="url(#rough2)">1</text>
  <circle cx="170" cy="150" r="17" fill="#a8d8a8" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="170" y="156" text-anchor="middle" font-size="13" fill="#204a1e" filter="url(#rough2)">2</text>
  <circle cx="400" cy="150" r="17" fill="#dbe7fb" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="400" y="156" text-anchor="middle" font-size="13" fill="#23405c" filter="url(#rough2)">3</text>
  <circle cx="100" cy="240" r="17" fill="#a8d8a8" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="100" y="246" text-anchor="middle" font-size="13" fill="#204a1e" filter="url(#rough2)">4</text>
  <circle cx="240" cy="240" r="17" fill="#a8d8a8" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="246" text-anchor="middle" font-size="13" fill="#204a1e" filter="url(#rough2)">5</text>
  <circle cx="340" cy="240" r="17" fill="#ffd9b3" stroke="#b06a2c" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="340" y="246" text-anchor="middle" font-size="13" fill="#8a4a14" filter="url(#rough2)">6</text>
  <circle cx="460" cy="240" r="17" fill="#dbe7fb" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="460" y="246" text-anchor="middle" font-size="13" fill="#23405c" filter="url(#rough2)">7</text>
  <circle cx="340" cy="330" r="17" fill="#ffd9b3" stroke="#b06a2c" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="340" y="336" text-anchor="middle" font-size="13" fill="#8a4a14" filter="url(#rough2)">8</text>

  <text x="186" y="140" font-size="10" fill="#2f5223" filter="url(#rough2)">v = 2，开放块 {2,4,5}</text>
  <text x="352" y="296" font-size="10" fill="#b85450" filter="url(#rough2)">切断 → {6,8} 闭合</text>

  <!-- 右侧公式卡 -->
  <rect x="545" y="52" width="220" height="150" rx="9" fill="#eef4ff" stroke="#446688"
        stroke-width="1.3" filter="url(#rough2)"/>
  <text x="559" y="76" font-size="11" font-weight="bold" fill="#23405c" filter="url(#rough2)">f[v][j] 的含义</text>
  <text x="559" y="98" font-size="9.5" fill="#446688" filter="url(#rough2)">子树 v 内、v 的开放块</text>
  <text x="559" y="114" font-size="9.5" fill="#446688" filter="url(#rough2)">大小为 j 时，其余已闭合</text>
  <text x="559" y="130" font-size="9.5" fill="#446688" filter="url(#rough2)">块大小乘积的最大值。</text>
  <text x="559" y="152" font-size="9.5" fill="#8c3b37" filter="url(#rough2)">j 先不乘，闭合时才乘。</text>
  <text x="559" y="172" font-size="9.5" fill="#2f5223" filter="url(#rough2)">初值 f[v][1] = 1（空乘积）</text>
  <text x="559" y="190" font-size="9.5" fill="#2f5223" filter="url(#rough2)">叶子只有这一个状态。</text>

  <!-- 图例 -->
  <circle cx="70" cy="290" r="9" fill="#a8d8a8" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="86" y="294" font-size="10" fill="#204a1e" filter="url(#rough2)">绿色：v 的开放块</text>
  <circle cx="70" cy="314" r="9" fill="#ffd9b3" stroke="#b06a2c" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="86" y="318" font-size="10" fill="#8a4a14" filter="url(#rough2)">橙色：已闭合的块</text>

  <text x="40" y="372" font-size="11" fill="#666" filter="url(#rough2)">"开放块"是还没有和父亲断开的那一块：它可能继续向上长，也可能在任意时刻被一条切边关掉。</text>
  <text x="40" y="392" font-size="11" fill="#666" filter="url(#rough2)">一个块一旦闭合，它的贡献就是"块大小 × 块内已闭合部分的乘积"，这正是 k·f[u][k] 的来源。</text>
  <text x="40" y="412" font-size="11" fill="#8c3b37" filter="url(#rough2)">树的性质保证不同孩子的选择互不影响，所以固定 j 时可以对每个孩子独立取最大值。</text>
</svg>
