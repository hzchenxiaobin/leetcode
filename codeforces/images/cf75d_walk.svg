<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr75d" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="350" fill="#fafafa"/>

  <text x="360" y="28" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">样例 1：下标序列 2, 3, 1, 3 逐块合并</text>

  <!-- 四个块的方框 -->
  <g filter="url(#rough2)" font-size="11.5" fill="#2b3a4a" text-anchor="middle">
    <rect x="40" y="52" width="146" height="62" rx="7" fill="#eef4fb" stroke="#446688" stroke-width="1.6"/>
    <text x="113" y="72" font-size="12" font-weight="bold">块 2：{3, 3}</text>
    <text x="113" y="90">T=6 P=6</text>
    <text x="113" y="106">S=6 M=6</text>

    <rect x="200" y="52" width="146" height="62" rx="7" fill="#fff8e1" stroke="#c9a227" stroke-width="1.6"/>
    <text x="273" y="72" font-size="12" font-weight="bold">块 3：{-5, 1}</text>
    <text x="273" y="90">T=-4 P=-4</text>
    <text x="273" y="106">S=1 M=1</text>

    <rect x="360" y="52" width="146" height="62" rx="7" fill="#e8f0e0" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="433" y="72" font-size="12" font-weight="bold">块 1：{1, 6, -2}</text>
    <text x="433" y="90">T=5 P=7</text>
    <text x="433" y="106">S=5 M=7</text>

    <rect x="520" y="52" width="146" height="62" rx="7" fill="#f7e6e6" stroke="#b85450" stroke-width="1.6"/>
    <text x="593" y="72" font-size="12" font-weight="bold">块 3：{-5, 1}</text>
    <text x="593" y="90">T=-4 P=-4</text>
    <text x="593" y="106">S=1 M=1</text>
  </g>
  <g filter="url(#rough2)" stroke="#446688" stroke-width="1.8" fill="none">
    <path d="M190 83 L196 83" marker-end="url(#arr75d)"/>
    <path d="M350 83 L356 83" marker-end="url(#arr75d)"/>
    <path d="M510 83 L516 83" marker-end="url(#arr75d)"/>
  </g>

  <!-- 演算表 -->
  <g filter="url(#rough2)">
    <rect x="40" y="136" width="626" height="34" fill="#eef2f6" stroke="#b9c8d8" stroke-width="1.2"/>
    <rect x="40" y="170" width="626" height="30" fill="#fcfcfa" stroke="#d8d2c6" stroke-width="1.1"/>
    <rect x="40" y="200" width="626" height="30" fill="#fcfcfa" stroke="#d8d2c6" stroke-width="1.1"/>
    <rect x="40" y="230" width="626" height="30" fill="#fcfcfa" stroke="#d8d2c6" stroke-width="1.1"/>
    <rect x="40" y="260" width="626" height="30" fill="#fcfcfa" stroke="#d8d2c6" stroke-width="1.1"/>
  </g>
  <g font-size="11.5" fill="#33475c" filter="url(#rough2)">
    <text x="56" y="158">步骤</text>
    <text x="140" y="158">处理的块</text>
    <text x="300" y="158">A = max(A, M, E+P)</text>
    <text x="480" y="158">E = max(S, E+T)</text>
    <text x="600" y="158">说明</text>
  </g>
  <g font-size="11.5" fill="#2b3a4a" filter="url(#rough2)">
    <text x="56" y="190">1</text>
    <text x="140" y="190">块 2 (6,6,6,6)</text>
    <text x="300" y="190">max(-∞, 6, -∞) = 6</text>
    <text x="480" y="190">max(6, -∞) = 6</text>
    <text x="600" y="190">初始</text>

    <text x="56" y="220">2</text>
    <text x="140" y="220">块 3 (-4,-4,1,1)</text>
    <text x="300" y="220">max(6, 1, 6-4) = 6</text>
    <text x="480" y="220">max(1, 6-4) = 2</text>
    <text x="600" y="220">后缀缩短</text>

    <text x="56" y="250">3</text>
    <text x="140" y="250">块 1 (5,7,5,7)</text>
    <text x="300" y="250">max(6, 7, 2+7) = 9</text>
    <text x="480" y="250">max(5, 2+5) = 7</text>
    <text x="600" y="250">跨界得 9</text>

    <text x="56" y="280">4</text>
    <text x="140" y="280">块 3 (-4,-4,1,1)</text>
    <text x="300" y="280">max(9, 1, 7-4) = 9</text>
    <text x="480" y="280">max(1, 7-4) = 3</text>
    <text x="600" y="280">答案 9</text>
  </g>

  <text x="360" y="322" text-anchor="middle" font-size="12.5" fill="#2f5223" filter="url(#rough2)">大数组 {3,3,-5,1,1,6,-2,-5,1} 的最大子段为 3+3-5+1+1+6 = 9，与逐块合并的结果一致</text>
</svg>
