<svg xmlns="http://www.w3.org/2000/svg" width="880" height="280" viewBox="0 0 880 280"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="280" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2：k=1 时只能翻一个负数</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">翻掉 -1 后剩下 -1，总和 1</text>
  <text x="150" y="120" text-anchor="start" font-size="14" fill="#2b2b2b" filter="url(#rough2)">序列 -1 -1 1</text>
  <text x="150" y="160" text-anchor="start" font-size="13" fill="#555555" filter="url(#rough2)">翻 1 次：只能让一个 -1 变 +1</text>
  <text x="150" y="200" text-anchor="start" font-size="14" fill="#3d6b2f" filter="url(#rough2)">结果 -1 1 1，和 = 1</text>
  <text x="440" y="255" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">若 k=2 则两个都翻，得 1 1 1，和 3</text>
</svg>
