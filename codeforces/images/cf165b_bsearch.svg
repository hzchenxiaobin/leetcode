<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="785"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="290" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">二分 v，判定 v + ⌊v/k⌋ + ⌊v/k²⌋ + … ≥ n</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">f(v) 单调 ⇒ 命中最小可行 v</text>
  <g filter="url(#rough2)"><rect x="80" y="100" width="740" height="56" rx="6" fill="#cfe0f5" fill-opacity="0.35" stroke="#446688" stroke-width="1.4"/></g>
  <text x="450" y="134" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">lo = 1, hi = n（v = n 一定可行）</text>
  <g filter="url(#rough2)"><rect x="80" y="180" width="340" height="56" rx="6" fill="#dcecd2" fill-opacity="0.4" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="250" y="214" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">sum ≥ n ⇒ hi = mid</text>
  <g filter="url(#rough2)"><rect x="480" y="180" width="340" height="56" rx="6" fill="#f3d9d6" fill-opacity="0.4" stroke="#8a2b28" stroke-width="1.4"/></g>
  <text x="650" y="214" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">sum &lt; n ⇒ lo = mid + 1</text>
  <text x="450" y="268" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">复杂度 O(log n · log_k n)</text>
</svg>
