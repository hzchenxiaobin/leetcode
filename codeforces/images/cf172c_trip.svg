<svg xmlns="http://www.w3.org/2000/svg" width="740" height="400" viewBox="0 0 740 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="740" height="400" fill="#fafafa"/>
  <text x="370" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">一趟车的时间线：发车 → 逐站下客 → 掉头返程</text>
  <path d="M 180 46 Q 370 52 560 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <line x1="50" y1="210" x2="576" y2="210" stroke="#2b2b2b" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="70" y="236" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <line x1="208" y1="194" x2="208" y2="226" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="208" cy="170" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="208" y="175" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="208" y="244" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#555" filter="url(#rough2)">x=3</text>
  <line x1="346" y1="194" x2="346" y2="226" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="346" cy="170" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="346" y="175" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="346" y="244" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#555" filter="url(#rough2)">x=6</text>
  <line x1="484" y1="194" x2="484" y2="226" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="484" cy="170" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="484" y="175" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="484" y="244" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#555" filter="url(#rough2)">x=9</text>
  <text x="208" y="140" text-anchor="middle" font-size="11" font-weight="normal" fill="#4a7a3a" filter="url(#rough2)">同站 k 人：耗时 1+⌊k/2⌋</text>
  <text x="484" y="140" text-anchor="middle" font-size="11" font-weight="normal" fill="#446688" filter="url(#rough2)">最后一站</text>
  <path d="M 70 110 L 484 110" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" fill="none" filter="url(#rough2)"/>
  <text x="277.0" y="102" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#446688" filter="url(#rough2)">去程：速度 1，遇目的地下客</text>
  <path d="M 484 280 L 72 280" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrr)" fill="none" filter="url(#rough2)"/>
  <text x="277.0" y="300" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#b85450" filter="url(#rough2)">回程：中途不停，耗时 x_max</text>
  <rect x="60" y="70" width="300" height="58" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="70" y="106" text-anchor="start" font-size="11.5" font-weight="normal" fill="#2b2b2b" filter="url(#rough2)">T0 = max(车可用时刻, 本批最后一人到达)</text>
  <rect x="390" y="70" width="290" height="58" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="400" y="106" text-anchor="start" font-size="11.5" font-weight="normal" fill="#2b2b2b" filter="url(#rough2)">T_back = T0 + 2·x_max + Σ(1+⌊k/2⌋)</text>
  <rect x="60" y="310" width="620" height="62" rx="9" fill="#f3e8fb" stroke="#7a4a9a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="74" y="334" text-anchor="start" font-size="11.5" font-weight="bold" fill="#5a3075" filter="url(#rough2)">关键：同一站的人答案相同，且“下车时刻”就是车停稳的那一瞬间（不含 1+⌊k/2⌋）。</text>
  <text x="74" y="354" text-anchor="start" font-size="11.5" font-weight="normal" fill="#5a3075" filter="url(#rough2)">每一站的下车耗时只影响后面各站，所以按 x 升序累加一个 delay 即可。</text>
</svg>
