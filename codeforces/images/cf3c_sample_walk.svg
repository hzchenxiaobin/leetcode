<svg xmlns="http://www.w3.org/2000/svg" width="860" height="648" viewBox="0 0 860 648"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr3" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="860" height="648" fill="#fafafa"/>

  <text x="430" y="34" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">样例走查：X0X / .0. / .X. 的输出是 second</text>

  <rect x="70" y="92" width="88" height="88" fill="#dbe7fb" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="158" y="92" width="88" height="88" fill="#fde8e8" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="246" y="92" width="88" height="88" fill="#dbe7fb" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="70" y="180" width="88" height="88" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="158" y="180" width="88" height="88" fill="#fde8e8" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="246" y="180" width="88" height="88" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="70" y="268" width="88" height="88" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="158" y="268" width="88" height="88" fill="#dbe7fb" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="246" y="268" width="88" height="88" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="114" y="147.2" text-anchor="middle" font-size="32" fill="#23405c" filter="url(#rough2)">X</text>
  <text x="202" y="147.2" text-anchor="middle" font-size="32" fill="#8c3b37" filter="url(#rough2)">0</text>
  <text x="290" y="147.2" text-anchor="middle" font-size="32" fill="#23405c" filter="url(#rough2)">X</text>
  <text x="114" y="235.2" text-anchor="middle" font-size="32" fill="#b0b0b0" filter="url(#rough2)">.</text>
  <text x="202" y="235.2" text-anchor="middle" font-size="32" fill="#8c3b37" filter="url(#rough2)">0</text>
  <text x="290" y="235.2" text-anchor="middle" font-size="32" fill="#b0b0b0" filter="url(#rough2)">.</text>
  <text x="114" y="323.2" text-anchor="middle" font-size="32" fill="#b0b0b0" filter="url(#rough2)">.</text>
  <text x="202" y="323.2" text-anchor="middle" font-size="32" fill="#23405c" filter="url(#rough2)">X</text>
  <text x="290" y="323.2" text-anchor="middle" font-size="32" fill="#b0b0b0" filter="url(#rough2)">.</text>
  <rect x="70" y="92" width="264" height="264" fill="none" stroke="#2b2b2b" stroke-width="1.8" filter="url(#rough2)"/>

  <text x="202" y="382" text-anchor="middle" font-size="11.5" fill="#7a8ca6"
        filter="url(#rough2)">X 3 个，0 2 个，空格 4 个</text>

  <!-- 右侧四步 -->
  <rect x="382" y="92" width="440" height="56" rx="7" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="398" y="115" font-size="12.5" fill="#23405c" filter="url(#rough2)">① 数个数：cx = 3，co = 2</text>
  <text x="398" y="135" font-size="11.5" fill="#44597a" filter="url(#rough2)">cx = co + 1：最后一手是 X 刚下的</text>

  <rect x="382" y="160" width="440" height="56" rx="7" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="398" y="183" font-size="12.5" fill="#23405c" filter="url(#rough2)">② 查 8 条线：3 横 + 3 竖 + 2 斜</text>
  <text x="398" y="203" font-size="11.5" fill="#44597a" filter="url(#rough2)">没有任何一条同号三连 → xw = ow = false</text>

  <rect x="382" y="228" width="440" height="56" rx="7" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="398" y="251" font-size="12.5" fill="#23405c" filter="url(#rough2)">③ 四条非法检查全部通过</text>
  <text x="398" y="271" font-size="11.5" fill="#44597a" filter="url(#rough2)">差值合法；无人成三；也没满 9 格</text>

  <rect x="382" y="296" width="440" height="56" rx="7" fill="#eef1f7" stroke="#7a8ca6"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="398" y="319" font-size="12.5" fill="#33445c" filter="url(#rough2)">④ cx = co + 1 → 轮到 0 落子</text>
  <text x="398" y="339" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">输出 second</text>

  <path d="M 338 224 L 374 224" stroke="#446688" stroke-width="1.6" fill="none"
        marker-end="url(#arr3)" filter="url(#rough2)"/>

  <!-- 反例 -->
  <text x="430" y="404" text-anchor="middle" font-size="13.5" fill="#8c3b37"
        filter="url(#rough2)">两个反例：看着「热闹」，其实都必须输出 illegal</text>

  <rect x="70" y="416" width="56" height="56" fill="#dbe7fb" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="126" y="416" width="56" height="56" fill="#dbe7fb" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="182" y="416" width="56" height="56" fill="#dbe7fb" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="70" y="472" width="56" height="56" fill="#fde8e8" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="126" y="472" width="56" height="56" fill="#fde8e8" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="182" y="472" width="56" height="56" fill="#fde8e8" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="70" y="528" width="56" height="56" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="126" y="528" width="56" height="56" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="182" y="528" width="56" height="56" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="98" y="452.4" text-anchor="middle" font-size="24" fill="#23405c" filter="url(#rough2)">X</text>
  <text x="154" y="452.4" text-anchor="middle" font-size="24" fill="#23405c" filter="url(#rough2)">X</text>
  <text x="210" y="452.4" text-anchor="middle" font-size="24" fill="#23405c" filter="url(#rough2)">X</text>
  <text x="98" y="508.4" text-anchor="middle" font-size="24" fill="#8c3b37" filter="url(#rough2)">0</text>
  <text x="154" y="508.4" text-anchor="middle" font-size="24" fill="#8c3b37" filter="url(#rough2)">0</text>
  <text x="210" y="508.4" text-anchor="middle" font-size="24" fill="#8c3b37" filter="url(#rough2)">0</text>
  <text x="98" y="564.4" text-anchor="middle" font-size="24" fill="#b0b0b0" filter="url(#rough2)">.</text>
  <text x="154" y="564.4" text-anchor="middle" font-size="24" fill="#b0b0b0" filter="url(#rough2)">.</text>
  <text x="210" y="564.4" text-anchor="middle" font-size="24" fill="#b0b0b0" filter="url(#rough2)">.</text>
  <rect x="70" y="416" width="168" height="168" fill="none" stroke="#2b2b2b" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="330" y="416" width="56" height="56" fill="#dbe7fb" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="386" y="416" width="56" height="56" fill="#fde8e8" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="442" y="416" width="56" height="56" fill="#dbe7fb" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="330" y="472" width="56" height="56" fill="#dbe7fb" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="386" y="472" width="56" height="56" fill="#fde8e8" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="442" y="472" width="56" height="56" fill="#dbe7fb" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="330" y="528" width="56" height="56" fill="#dbe7fb" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="386" y="528" width="56" height="56" fill="#fde8e8" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="442" y="528" width="56" height="56" fill="#dbe7fb" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="358" y="452.4" text-anchor="middle" font-size="24" fill="#23405c" filter="url(#rough2)">X</text>
  <text x="414" y="452.4" text-anchor="middle" font-size="24" fill="#8c3b37" filter="url(#rough2)">0</text>
  <text x="470" y="452.4" text-anchor="middle" font-size="24" fill="#23405c" filter="url(#rough2)">X</text>
  <text x="358" y="508.4" text-anchor="middle" font-size="24" fill="#23405c" filter="url(#rough2)">X</text>
  <text x="414" y="508.4" text-anchor="middle" font-size="24" fill="#8c3b37" filter="url(#rough2)">0</text>
  <text x="470" y="508.4" text-anchor="middle" font-size="24" fill="#23405c" filter="url(#rough2)">X</text>
  <text x="358" y="564.4" text-anchor="middle" font-size="24" fill="#23405c" filter="url(#rough2)">X</text>
  <text x="414" y="564.4" text-anchor="middle" font-size="24" fill="#8c3b37" filter="url(#rough2)">0</text>
  <text x="470" y="564.4" text-anchor="middle" font-size="24" fill="#23405c" filter="url(#rough2)">X</text>
  <rect x="330" y="416" width="168" height="168" fill="none" stroke="#2b2b2b" stroke-width="1.8" filter="url(#rough2)"/>

  <text x="154" y="608" text-anchor="middle" font-size="11.5" fill="#8c3b37"
        filter="url(#rough2)">cx = co = 3，两边都成三</text>
  <text x="154" y="626" text-anchor="middle" font-size="11.5" fill="#8c3b37"
        filter="url(#rough2)">→ illegal（② 拦下）</text>
  <text x="414" y="608" text-anchor="middle" font-size="11.5" fill="#8c3b37"
        filter="url(#rough2)">0 有 6 个、X 只有 3 个</text>
  <text x="414" y="626" text-anchor="middle" font-size="11.5" fill="#8c3b37"
        filter="url(#rough2)">→ illegal（① 拦下）</text>

  <text x="548" y="470" font-size="12.5" fill="#44597a" filter="url(#rough2)">判定顺序不能乱：</text>
  <text x="548" y="496" font-size="13" font-weight="bold" fill="#23405c" filter="url(#rough2)">非法 → 终局 → 轮次</text>
  <text x="548" y="528" font-size="11.5" fill="#666" filter="url(#rough2)">反过来先看「谁成三」，</text>
  <text x="548" y="548" font-size="11.5" fill="#666" filter="url(#rough2)">就会把上面两个反例判成赢家。</text>
</svg>
