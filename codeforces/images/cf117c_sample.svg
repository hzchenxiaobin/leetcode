<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="117"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="320" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1：三元环 3 → 2 → 1</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">(1,3,2) 同样合法</text>
  <g filter="url(#rough2)"><line x1="335" y1="220" x2="430" y2="100" stroke="#8a2b28" stroke-width="2.6" marker-end="url(#arrr)"/></g>
  <g filter="url(#rough2)"><line x1="430" y1="100" x2="240" y2="100" stroke="#8a2b28" stroke-width="2.6" marker-end="url(#arrr)"/></g>
  <g filter="url(#rough2)"><line x1="240" y1="100" x2="335" y2="220" stroke="#8a2b28" stroke-width="2.6" marker-end="url(#arrr)"/></g>
  <g filter="url(#rough2)"><circle cx="240" cy="100" r="22" fill="#f6e3c4" fill-opacity="0.9" stroke="#c9a86a" stroke-width="1.6"/></g>
  <text x="240" y="106" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><circle cx="430" cy="100" r="22" fill="#f6e3c4" fill-opacity="0.9" stroke="#c9a86a" stroke-width="1.6"/></g>
  <text x="430" y="106" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><circle cx="335" cy="220" r="22" fill="#f6e3c4" fill-opacity="0.9" stroke="#c9a86a" stroke-width="1.6"/></g>
  <text x="335" y="226" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="560" y="130" text-anchor="start" font-size="11" fill="#2f4a66" filter="url(#rough2)">A[3][2]=1</text>
  <text x="560" y="156" text-anchor="start" font-size="11" fill="#2f4a66" filter="url(#rough2)">A[2][1]=1</text>
  <text x="560" y="182" text-anchor="start" font-size="11" fill="#2f4a66" filter="url(#rough2)">A[1][3]=1</text>
  <text x="442" y="282" text-anchor="middle" font-size="11.5" fill="#3d6b2f" filter="url(#rough2)">输出三个两两不同的点 a→b→c→a；无解输出 −1</text>
</svg>
