<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 404" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="404" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">样例 1 走查：n = 2, m = 3, v = (10, 20)，两行分别是全 2 与全 5</text>

  <!-- 塔 -->
  <g filter="url(#rough2)" text-anchor="middle" font-size="11.5">
    <text x="88" y="74" fill="#666" text-anchor="end">第 1 行</text>
    <text x="88" y="108" fill="#666" text-anchor="end">第 2 行</text>
    <rect x="100" y="50" width="180" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="100" y="84" width="180" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="130" y="71" fill="#3a4a66">2</text>
    <text x="190" y="71" fill="#3a4a66">2</text>
    <text x="250" y="71" fill="#3a4a66">2</text>
    <text x="130" y="105" fill="#3a4a66">5</text>
    <text x="190" y="105" fill="#3a4a66">5</text>
    <text x="250" y="105" fill="#3a4a66">5</text>
  </g>
  <text x="300" y="72" font-size="10.5" fill="#7a8aa6" filter="url(#rough2)">v_1 = 10</text>
  <text x="300" y="106" font-size="10.5" fill="#7a8aa6" filter="url(#rough2)">v_2 = 20</text>

  <!-- 表头 -->
  <g filter="url(#rough2)" font-size="10.5" fill="#666" text-anchor="middle" font-weight="bold">
    <text x="92" y="150">层 k</text>
    <text x="250" y="150">可用格子（第 k..n 行，值降序）</text>
    <text x="430" y="150">前缀和</text>
    <text x="538" y="150">结论</text>
  </g>

  <!-- k = 2 -->
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="58" y="158" width="504" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="5"/>
    <text x="92" y="180" fill="#8a3a3a">k = 2</text>
    <text x="250" y="180" fill="#8a3a3a">5 5 5（只有第 2 行）</text>
    <text x="430" y="180" fill="#8a3a3a">5, 10, 15</text>
    <text x="538" y="180" fill="#8a3a3a" font-weight="bold">15 &lt; 20 无解</text>

    <rect x="58" y="196" width="504" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5"/>
    <text x="92" y="218" fill="#3a5a30">k = 1</text>
    <text x="250" y="218" fill="#3a5a30">5 5 5 2 2 2（两行合并）</text>
    <text x="430" y="218" fill="#3a5a30">5, 10 ← 第 2 个就够</text>
    <text x="538" y="218" fill="#3a5a30" font-weight="bold">10 ≥ 10 ⇒ g = 2</text>
  </g>

  <!-- 结论 -->
  <g filter="url(#rough2)">
    <rect x="58" y="246" width="504" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="9"/>
    <text x="310" y="267" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold">ans = min( 掏空一层的 m = 3 , g(1) = 2 , g(2) = ∞ ) = 2</text>
    <text x="310" y="287" text-anchor="middle" font-size="10.5" fill="#a08030">拆掉第 2 行两个 5：第 1 层 10 − 10 = 0，同时第 2 层也被削掉 10</text>

    <rect x="58" y="310" width="504" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="9"/>
    <text x="310" y="330" text-anchor="middle" font-size="11.5" fill="#3a4a66">样例 2：n = 3, m = 1 ⇒ m = 1 就是答案下界，拆掉任何一格都会掏空它那一层</text>
    <text x="310" y="348" text-anchor="middle" font-size="10.5" fill="#7a8aa6">所以 m = 1 时答案恒为 1，代码里的 ans = m 初值直接封顶</text>
  </g>

  <text x="310" y="378" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">注意 k 与「行号」的方向：k 越小（越靠上），能贡献伤害的行越多，后缀行集合越大</text>
  <text x="310" y="396" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">所以按 k = n, n−1, …, 1 的顺序扫，正好是往值域桶里不断加入新的行</text>
</svg>
