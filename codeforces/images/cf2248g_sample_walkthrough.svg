<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="680" height="400" fill="#fafafa"/>

  <text x="340" y="29" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例二走查：M = 8，g = 2</text>
  <text x="340" y="51" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">价格 4,8,12,16,20；返利档 (6,8)(7,9)(8,10) &#8658; 可达总价 4,8,12,…</text>
  <text x="340" y="70" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">&#948;(4) = &#8722;4，&#948;(8) = +2，&#948;(12) = &#8722;2，&#948;(16) = &#8722;6，&#948;(20) = &#8722;10</text>

  <!-- h = 1..14 的答案条 -->
  <g>
    <text x="67" y="96" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">1</text>
    <rect x="48" y="102" width="38" height="34" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="67" y="124" text-anchor="middle" font-size="11" fill="#8d3a36" filter="url(#rough2)">NO</text>
  </g>
  <g>
    <text x="111" y="96" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">2</text>
    <rect x="92" y="102" width="38" height="34" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="111" y="124" text-anchor="middle" font-size="11" fill="#8d3a36" filter="url(#rough2)">NO</text>
  </g>
  <g>
    <text x="155" y="96" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">3</text>
    <rect x="136" y="102" width="38" height="34" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="155" y="124" text-anchor="middle" font-size="11" fill="#8d3a36" filter="url(#rough2)">NO</text>
  </g>
  <g>
    <text x="199" y="96" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">4</text>
    <rect x="180" y="102" width="38" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="199" y="124" text-anchor="middle" font-size="11" fill="#3d6b30" filter="url(#rough2)">YES</text>
  </g>
  <g>
    <text x="243" y="96" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">5</text>
    <rect x="224" y="102" width="38" height="34" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="243" y="124" text-anchor="middle" font-size="11" fill="#8d3a36" filter="url(#rough2)">NO</text>
  </g>
  <g>
    <text x="287" y="96" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">6</text>
    <rect x="268" y="102" width="38" height="34" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="287" y="124" text-anchor="middle" font-size="11" fill="#8d3a36" filter="url(#rough2)">NO</text>
  </g>
  <g>
    <text x="331" y="96" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">7</text>
    <rect x="312" y="102" width="38" height="34" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="331" y="124" text-anchor="middle" font-size="11" fill="#8d3a36" filter="url(#rough2)">NO</text>
  </g>
  <g>
    <text x="375" y="96" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">8</text>
    <rect x="356" y="102" width="38" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="375" y="124" text-anchor="middle" font-size="11" fill="#3d6b30" filter="url(#rough2)">YES</text>
  </g>
  <g>
    <text x="419" y="96" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">9</text>
    <rect x="400" y="102" width="38" height="34" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="419" y="124" text-anchor="middle" font-size="11" fill="#8d3a36" filter="url(#rough2)">NO</text>
  </g>
  <g>
    <text x="463" y="96" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">10</text>
    <rect x="444" y="102" width="38" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="463" y="124" text-anchor="middle" font-size="11" fill="#3d6b30" filter="url(#rough2)">YES</text>
  </g>
  <g>
    <text x="507" y="96" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">11</text>
    <rect x="488" y="102" width="38" height="34" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="507" y="124" text-anchor="middle" font-size="11" fill="#8d3a36" filter="url(#rough2)">NO</text>
  </g>
  <g>
    <text x="551" y="96" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">12</text>
    <rect x="532" y="102" width="38" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="551" y="124" text-anchor="middle" font-size="11" fill="#3d6b30" filter="url(#rough2)">YES</text>
  </g>
  <g>
    <text x="595" y="96" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">13</text>
    <rect x="576" y="102" width="38" height="34" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="595" y="124" text-anchor="middle" font-size="11" fill="#8d3a36" filter="url(#rough2)">NO</text>
  </g>
  <g>
    <text x="639" y="96" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">14</text>
    <rect x="620" y="102" width="38" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="639" y="124" text-anchor="middle" font-size="11" fill="#3d6b30" filter="url(#rough2)">YES</text>
  </g>

  <path d="M353 88 L353 152" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="353" y="170" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">M = 8</text>
  <text x="190" y="170" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">低区：只有 h = 4 能归零</text>
  <text x="512" y="170" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">高区：偶数全 YES，奇数全 NO</text>

  <!-- 可行路径 -->
  <text x="66" y="212" font-size="11.5" fill="#666" filter="url(#rough2)">一条实现 10 的路径：</text>
  <rect x="68" y="226" width="44" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="90" y="248" text-anchor="middle" font-size="12" fill="#33517a" filter="url(#rough2)">10</text>
  <path d="M116 242 L166 242" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="141" y="272" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">买 8（+2）</text>

  <rect x="170" y="226" width="44" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="192" y="248" text-anchor="middle" font-size="12" fill="#33517a" filter="url(#rough2)">12</text>
  <path d="M218 242 L268 242" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="243" y="272" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">买 4（&#8722;4）</text>

  <rect x="272" y="226" width="44" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="294" y="248" text-anchor="middle" font-size="12" fill="#33517a" filter="url(#rough2)">8</text>
  <path d="M320 242 L370 242" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="345" y="272" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">买 4（&#8722;4）</text>

  <rect x="374" y="226" width="44" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="396" y="248" text-anchor="middle" font-size="12" fill="#8a6a1f" filter="url(#rough2)">4</text>
  <path d="M422 242 L472 242" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="447" y="272" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">买 4（无返利）</text>

  <rect x="476" y="226" width="44" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="498" y="248" text-anchor="middle" font-size="12" fill="#3d6b30" filter="url(#rough2)">0</text>
  <text x="536" y="248" font-size="10.5" fill="#888" filter="url(#rough2)">余额清零</text>

  <text x="66" y="298" font-size="11" fill="#3d3d3d" filter="url(#rough2)">低区递推：f[4] = 1（d = 4 且 need[4] = 4 &#8804; 4），其余 h &#8804; 7 都凑不出。</text>
  <text x="66" y="322" font-size="11" fill="#3d3d3d" filter="url(#rough2)">高区判据：g = gcd(4, 10, 4, 2, 2, 6, 10) = 2，故 h &#8805; 8 时 h 为偶数即 YES。</text>
  <text x="66" y="346" font-size="11" fill="#3d3d3d" filter="url(#rough2)">与官方输出逐行一致：4,8,10,12,14,… 为 YES，其余为 NO。</text>
</svg>
