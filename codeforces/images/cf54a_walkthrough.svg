<svg xmlns="http://www.w3.org/2000/svg" width="740" height="420" viewBox="0 0 740 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="740" height="420" fill="#fafafa"/>
  <text x="370.0" y="36" font-size="20" fill="#2b2b2b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">样例 1 的逐天扫描</text>
  <path d="M 133 46 Q 370 52 607 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="80" y="92" font-size="12.5" fill="#2b2b2b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">天 d</text>
  <text x="150" y="92" font-size="12.5" fill="#2b2b2b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">假日？</text>
  <text x="250" y="92" font-size="12.5" fill="#2b2b2b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">d − last</text>
  <text x="360" y="92" font-size="12.5" fill="#2b2b2b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">决策</text>
  <text x="500" y="92" font-size="12.5" fill="#2b2b2b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">last</text>
  <text x="620" y="92" font-size="12.5" fill="#2b2b2b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">计数</text>
  <line x1="60.0" y1="100.0" x2="690.0" y2="100.0" stroke="#b9c3cc" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="60" y="104" width="630" height="36" rx="5" fill="#e6f4ea" stroke="#d8dde2" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="80" y="128" font-size="12.5" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">1</text>
  <text x="150" y="128" font-size="12.5" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">否</text>
  <text x="250" y="128" font-size="12.5" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">1</text>
  <text x="360" y="128" font-size="12.5" fill="#2f5223" text-anchor="middle" filter="url(#rough2)">不给</text>
  <text x="500" y="128" font-size="12.5" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">0</text>
  <text x="620" y="128" font-size="12.5" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="60" y="148" width="630" height="36" rx="5" fill="#e6f4ea" stroke="#d8dde2" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="80" y="172" font-size="12.5" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">2</text>
  <text x="150" y="172" font-size="12.5" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">否</text>
  <text x="250" y="172" font-size="12.5" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">2</text>
  <text x="360" y="172" font-size="12.5" fill="#2f5223" text-anchor="middle" filter="url(#rough2)">给（满 K）</text>
  <text x="500" y="172" font-size="12.5" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">2</text>
  <text x="620" y="172" font-size="12.5" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="60" y="192" width="630" height="36" rx="5" fill="#e6f4ea" stroke="#d8dde2" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="80" y="216" font-size="12.5" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">3</text>
  <text x="150" y="216" font-size="12.5" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">是</text>
  <text x="250" y="216" font-size="12.5" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">1</text>
  <text x="360" y="216" font-size="12.5" fill="#2f5223" text-anchor="middle" filter="url(#rough2)">给（假日）</text>
  <text x="500" y="216" font-size="12.5" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">3</text>
  <text x="620" y="216" font-size="12.5" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="60" y="236" width="630" height="36" rx="5" fill="#e6f4ea" stroke="#d8dde2" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="80" y="260" font-size="12.5" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">4</text>
  <text x="150" y="260" font-size="12.5" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">否</text>
  <text x="250" y="260" font-size="12.5" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">1</text>
  <text x="360" y="260" font-size="12.5" fill="#2f5223" text-anchor="middle" filter="url(#rough2)">不给</text>
  <text x="500" y="260" font-size="12.5" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">3</text>
  <text x="620" y="260" font-size="12.5" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">2</text>
  <rect x="60" y="280" width="630" height="36" rx="5" fill="#e6f4ea" stroke="#d8dde2" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="80" y="304" font-size="12.5" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">5</text>
  <text x="150" y="304" font-size="12.5" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">否</text>
  <text x="250" y="304" font-size="12.5" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">2</text>
  <text x="360" y="304" font-size="12.5" fill="#2f5223" text-anchor="middle" filter="url(#rough2)">给（满 K）</text>
  <text x="500" y="304" font-size="12.5" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">5</text>
  <text x="620" y="304" font-size="12.5" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">3</text>
  <line x1="60.0" y1="348.0" x2="690.0" y2="348.0" stroke="#b9c3cc" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="80" y="374" font-size="12.5" fill="#2f5223" text-anchor="start" font-weight="bold" filter="url(#rough2)">三天给礼物：第 2 天（间隔满 2）、第 3 天（假日）、第 5 天（间隔又满 2）</text>
  <text x="80" y="398" font-size="12.5" fill="#44546a" text-anchor="start" filter="url(#rough2)">第 1、4 天不给任何礼物仍然合法，因此 3 是最小值。</text>
</svg>
