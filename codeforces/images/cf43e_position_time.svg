<svg xmlns="http://www.w3.org/2000/svg" width="760" height="480" viewBox="0 0 760 480"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2b2b2b"/>
    </marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arra" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="760" height="480" fill="#fafafa"/>
  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1：两车的位置-时间折线在 t = 3 相交</text>
  <path d="M 220 42 Q 380 48 540 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <line x1="90" y1="410" x2="710" y2="410" stroke="#2b2b2b" stroke-width="1.6" opacity="1.0" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="90" y1="410" x2="90" y2="60" stroke="#2b2b2b" stroke-width="1.6" opacity="1.0" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="700" y="452" text-anchor="end" font-size="12" fill="#8a8a8a" filter="url(#rough2)">t（小时）</text>
  <text x="44" y="72" text-anchor="start" font-size="12" fill="#8a8a8a" filter="url(#rough2)">x（公里）</text>
  <line x1="90" y1="410" x2="90" y2="416" stroke="#2b2b2b" stroke-width="1.3" opacity="1.0" filter="url(#rough2)"/>
  <text x="90" y="432" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#rough2)">0</text>
  <line x1="130" y1="410" x2="130" y2="416" stroke="#2b2b2b" stroke-width="1.3" opacity="1.0" filter="url(#rough2)"/>
  <text x="130" y="432" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#rough2)">1</text>
  <line x1="210" y1="410" x2="210" y2="416" stroke="#2b2b2b" stroke-width="1.3" opacity="1.0" filter="url(#rough2)"/>
  <text x="210" y="432" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#rough2)">3</text>
  <line x1="530" y1="410" x2="530" y2="416" stroke="#2b2b2b" stroke-width="1.3" opacity="1.0" filter="url(#rough2)"/>
  <text x="530" y="432" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#rough2)">11</text>
  <line x1="690" y1="410" x2="690" y2="416" stroke="#2b2b2b" stroke-width="1.3" opacity="1.0" filter="url(#rough2)"/>
  <text x="690" y="432" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#rough2)">15</text>
  <line x1="84" y1="410" x2="90" y2="410" stroke="#2b2b2b" stroke-width="1.3" opacity="1.0" filter="url(#rough2)"/>
  <text x="80" y="414" text-anchor="end" font-size="11" fill="#8a8a8a" filter="url(#rough2)">0</text>
  <line x1="84" y1="320" x2="90" y2="320" stroke="#2b2b2b" stroke-width="1.3" opacity="1.0" filter="url(#rough2)"/>
  <text x="80" y="324" text-anchor="end" font-size="11" fill="#8a8a8a" filter="url(#rough2)">9</text>
  <line x1="84" y1="80" x2="90" y2="80" stroke="#2b2b2b" stroke-width="1.3" opacity="1.0" filter="url(#rough2)"/>
  <text x="80" y="84" text-anchor="end" font-size="11" fill="#8a8a8a" filter="url(#rough2)">33</text>
  <line x1="90" y1="80" x2="690" y2="80" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5 4" opacity="1.0" filter="url(#rough2)"/>
  <text x="694" y="86" text-anchor="end" font-size="11" fill="#b85450" filter="url(#rough2)">终点线 x = s</text>
  <path d="M 90 410 L 130 360 L 690 80" stroke="#d6a040" stroke-width="2.6" fill="none" opacity="1.0" filter="url(#rough2)"/>
  <path d="M 90 410 L 530 80 L 690 80" stroke="#446688" stroke-width="2.6" fill="none" opacity="1.0" filter="url(#rough2)"/>
  <circle cx="210" cy="320" r="7" fill="#ffffff" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="224" y="312" text-anchor="start" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">t = 3, x = 9</text>
  <text x="224" y="332" text-anchor="start" font-size="11" fill="#b85450" filter="url(#rough2)">第 2 辆超过第 1 辆</text>
  <text x="600" y="155" text-anchor="start" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">车 1</text>
  <text x="600" y="120" text-anchor="start" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">车 2</text>
  <text x="98" y="454" text-anchor="start" font-size="11" fill="#8a8a8a" filter="url(#rough2)">起点同时出发，不计</text>
  <text x="430" y="92" text-anchor="start" font-size="10.5" fill="#8a8a8a" filter="url(#rough2)">车 1 在 t=15 到终点</text>
  <text x="380" y="456" text-anchor="middle" font-size="13" fill="#8a8a8a" filter="url(#rough2)">超过 = 位置差变号；起点、终点相遇都不计</text>
</svg>
