<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="880" height="500" fill="#fafafa"/>

  <text x="440" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：一次线性扫描 + 按 0 的个数分支</text>
  <path d="M 200 43 Q 440 50 680 43" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="440" y="66" text-anchor="middle" font-size="12.5" fill="#66788c" filter="url(#rough2)">读入时顺手数 0：c = 1 直接 NO，否则套用同一个模板串</text>

  <!-- 读入 -->
  <rect x="285" y="82" width="310" height="46" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="440" y="110" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">读入 n 与 a，统计 c = 0 的个数</text>

  <path d="M 440 128 L 440 156" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="440,156 590,198 440,240 290,198" fill="#fff8e1" stroke="#d6a040" stroke-width="2.0" filter="url(#rough2)"/>
  <text x="440" y="204" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">c = 1 ?</text>

  <!-- 是 -> NO -->
  <path d="M 290 198 L 208 198" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="250" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="40" y="174" width="164" height="48" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="2.0" filter="url(#rough2)"/>
  <text x="122" y="198" text-anchor="middle" font-size="14" font-weight="bold" fill="#a14340" filter="url(#rough2)">输出 NO</text>
  <text x="122" y="215" text-anchor="middle" font-size="11" fill="#a14340" filter="url(#rough2)">唯一含 0 的集合坏局</text>

  <!-- 否 -->
  <path d="M 440 240 L 440 266" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="455" y="258" text-anchor="start" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">否</text>

  <rect x="250" y="266" width="380" height="44" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="440" y="293" text-anchor="middle" font-size="13" fill="#3c5e2e" filter="url(#rough2)">答案串 s 先全部填成 'A'</text>

  <path d="M 440 310 L 440 336" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="200" y="336" width="480" height="46" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="440" y="364" text-anchor="middle" font-size="13" fill="#3c5e2e" filter="url(#rough2)">扫一遍：第 1 个 0 改成 B，其余 0 改成 C，非 0 保持 A</text>

  <path d="M 440 382 L 440 408" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="300" y="408" width="280" height="44" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="440" y="435" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">输出 YES 与 s</text>

  <text x="440" y="478" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">c = 0 时上面的循环什么都不改，输出全 'A' 串，三个 mex 依然都是 0</text>
</svg>
