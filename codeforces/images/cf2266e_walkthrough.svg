  <rect x="44" y="336" width="672" height="86" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="62" y="360" font-size="11.5" fill="#8a6420" filter="url(#rough2)">同一个 12：k = 1 时 c = 7，k = 3 时 c = 3 —— c 依赖 k，因此每个测试都要按自己的 k 重算 DP。</text>
  <text x="62" y="382" font-size="11.5" fill="#8a6420" filter="url(#rough2)">红格（c ≥ 3）就是「拆出来还得继续拆」的情形：c(8) = 1 + 2·c(4) = 1 + 2·(1 + 2·c(2)) = 7。</text>
  <text x="62" y="404" font-size="11.5" fill="#8a6420" filter="url(#rough2)">蓝格只需 1 次：存在素因子 p ≥ m/k，使拆出的 p 份 m/p 全部 ≤ k。</text>
