<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="720" height="470" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">块边界 ⇔ 两个前缀残量在同一点相等</text>
  <path d="M 152 43 Q 360 49 568 43" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="360" y="64" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">例：a = 5 1 4 7，b = 4 4 4 4 1 —— 前缀和对 10 取模，残量相等处才可能同时作块边界</text>

  <!-- a 的前缀残量 -->
  <text x="40" y="106" font-size="16" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">P_a</text>
  <rect x="60"  y="116" width="64" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="65"  y="129" font-size="9.5" fill="#5a7799" filter="url(#rough2)">i=0</text>
  <text x="92"  y="151" text-anchor="middle" font-size="17" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">0</text>
  <rect x="164" y="116" width="64" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="169" y="129" font-size="9.5" fill="#5a7799" filter="url(#rough2)">i=1</text>
  <text x="196" y="151" text-anchor="middle" font-size="17" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">5</text>
  <rect x="268" y="116" width="64" height="40" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="273" y="129" font-size="9.5" fill="#8a6015" filter="url(#rough2)">i=2</text>
  <text x="300" y="151" text-anchor="middle" font-size="17" font-weight="bold" fill="#8a6015" filter="url(#rough2)">6</text>
  <rect x="372" y="116" width="64" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="377" y="129" font-size="9.5" fill="#5a7799" filter="url(#rough2)">i=3</text>
  <text x="404" y="151" text-anchor="middle" font-size="17" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">0</text>
  <rect x="476" y="116" width="64" height="40" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="481" y="129" font-size="9.5" fill="#8a6015" filter="url(#rough2)">i=4</text>
  <text x="508" y="151" text-anchor="middle" font-size="17" font-weight="bold" fill="#8a6015" filter="url(#rough2)">7</text>

  <!-- b 的前缀残量 -->
  <text x="40" y="212" font-size="16" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">P_b</text>
  <rect x="60"  y="222" width="64" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="65"  y="235" font-size="9.5" fill="#5d8a4a" filter="url(#rough2)">j=0</text>
  <text x="92"  y="257" text-anchor="middle" font-size="17" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">0</text>
  <rect x="164" y="222" width="64" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="169" y="235" font-size="9.5" fill="#5d8a4a" filter="url(#rough2)">j=1</text>
  <text x="196" y="257" text-anchor="middle" font-size="17" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">4</text>
  <rect x="268" y="222" width="64" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="273" y="235" font-size="9.5" fill="#5d8a4a" filter="url(#rough2)">j=2</text>
  <text x="300" y="257" text-anchor="middle" font-size="17" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">8</text>
  <rect x="372" y="222" width="64" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="377" y="235" font-size="9.5" fill="#5d8a4a" filter="url(#rough2)">j=3</text>
  <text x="404" y="257" text-anchor="middle" font-size="17" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">2</text>
  <rect x="476" y="222" width="64" height="40" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="481" y="235" font-size="9.5" fill="#8a6015" filter="url(#rough2)">j=4</text>
  <text x="508" y="257" text-anchor="middle" font-size="17" font-weight="bold" fill="#8a6015" filter="url(#rough2)">6</text>
  <rect x="580" y="222" width="64" height="40" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="585" y="235" font-size="9.5" fill="#8a6015" filter="url(#rough2)">j=5</text>
  <text x="612" y="257" text-anchor="middle" font-size="17" font-weight="bold" fill="#8a6015" filter="url(#rough2)">7</text>

  <!-- 非法边（j 回退） -->
  <path d="M 404 158 L 96 218" stroke="#b85450" stroke-width="1.3" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <text x="236" y="170" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗ 不能 j 回退</text>

  <!-- 链上的三条边 -->
  <path d="M 92 158 L 92 218" stroke="#4a7a3a" stroke-width="3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="72" y="194" font-size="14" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">①</text>
  <path d="M 300 158 L 500 220" stroke="#4a7a3a" stroke-width="3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="326" y="196" font-size="14" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">②</text>
  <path d="M 508 158 L 604 220" stroke="#4a7a3a" stroke-width="3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="570" y="188" font-size="14" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">③</text>

  <!-- 公式与结论 -->
  <rect x="40" y="274" width="640" height="176" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="58" y="300" font-size="12.5" fill="#8a6015" filter="url(#rough2)">第 t 块的值相等：  Pa[i_t] − Pa[i_(t−1)]  ≡  Pb[j_t] − Pb[j_(t−1)]  (mod 10)</text>
  <text x="58" y="328" font-size="12.5" fill="#8a6015" filter="url(#rough2)">对 t = 1..k 全部累加（望远镜求和），并注意 Pa[0] = Pb[0] = 0：</text>
  <text x="58" y="356" font-size="13.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">⟹  Pa[i_t] ≡ Pb[j_t]  (mod 10)，对每个 t 都成立</text>
  <text x="58" y="384" font-size="12.5" fill="#8a6015" filter="url(#rough2)">反之，若每个 t 都满足该同余，相邻两式相减即得每块值相等。</text>
  <text x="58" y="412" font-size="12.5" fill="#8a6015" filter="url(#rough2)">所以答案 = 点集 S = {(i, j) | Pa[i] ≡ Pb[j] (mod 10)} 中，</text>
  <text x="58" y="438" font-size="12.5" fill="#8a6015" filter="url(#rough2)">以 (0,0) 起、(n, m) 止、两下标严格递增的点链，边数（点数 − 1）即答案。</text>
</svg>
