<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="305"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="440" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">191B：每天让行政方「烧」掉一个非最差方块，直到预算低于 a_s</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="60.0" y="96.0" text-anchor="start" font-size="12" fill="#444" filter="url(#rough2)">烧掉的方块花费 a_j，行政方预算 b 只会减少；最差方块 n 永远免费接受</text>
  <rect x="70.0" y="100.0" width="150.0" height="44.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="6" filter="url(#rough2)"/>
  <text x="145.0" y="130.0" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">第 1 天</text>
  <text x="240.0" y="130.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">申请方块 j</text>
  <text x="400.0" y="130.0" text-anchor="start" font-size="11.5" fill="#444" filter="url(#rough2)">行政方付 a_j，j 被封（opp 撤回）</text>
  <rect x="70.0" y="162.0" width="150.0" height="44.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="6" filter="url(#rough2)"/>
  <text x="145.0" y="192.0" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">第 2 天</text>
  <text x="240.0" y="192.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">申请方块 k</text>
  <text x="400.0" y="192.0" text-anchor="start" font-size="11.5" fill="#444" filter="url(#rough2)">再付 a_k</text>
  <rect x="70.0" y="224.0" width="150.0" height="44.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="6" filter="url(#rough2)"/>
  <text x="145.0" y="254.0" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">…</text>
  <text x="240.0" y="254.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">继续烧</text>
  <text x="400.0" y="254.0" text-anchor="start" font-size="11.5" fill="#444" filter="url(#rough2)">直到预算 &lt; a_s</text>
  <rect x="70.0" y="286.0" width="150.0" height="44.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="6" filter="url(#rough2)"/>
  <text x="145.0" y="316.0" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">最后一天</text>
  <text x="240.0" y="316.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">申请方块 s</text>
  <text x="400.0" y="316.0" text-anchor="start" font-size="11.5" fill="#444" filter="url(#rough2)">行政方付不起 → 接受 s</text>
  <rect x="60.0" y="388.0" width="600.0" height="40.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="74.0" y="411.0" text-anchor="start" font-size="11" fill="#3f3420" filter="url(#rough2)">关键：能赢 s 当且仅当「除 s、n 外最大的 k-1 个 a_j 之和 ≥ b - a_s + 1」</text>
</svg>
