<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="375"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="330" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">一轮 = 公主抽 → 龙抽 → 跳出一只 → 回到公主</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">状态 (w, b)：白鼠数、黑鼠数</text>
  <g filter="url(#rough2)"><rect x="70" y="96" width="200" height="60" rx="5" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="170" y="122" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">(w, b)</text>
  <text x="170" y="144" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">轮到公主</text>
  <g filter="url(#rough2)"><line x1="274" y1="126" x2="320" y2="126" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)"/></g>
  <g filter="url(#rough2)"><rect x="324" y="96" width="190" height="60" rx="5" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="419" y="122" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">公主抽到白</text>
  <text x="419" y="144" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">概率 w/(w+b) ⇒ 赢</text>
  <g filter="url(#rough2)"><rect x="324" y="186" width="190" height="60" rx="5" fill="#f3d9d6" fill-opacity="0.85" stroke="#8a2b28" stroke-width="1.4"/></g>
  <text x="419" y="212" text-anchor="middle" font-size="12" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">公主抽到黑</text>
  <text x="419" y="234" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">概率 b/(w+b)</text>
  <g filter="url(#rough2)"><rect x="540" y="186" width="300" height="60" rx="5" fill="#f6e3c4" fill-opacity="0.85" stroke="#b06a1e" stroke-width="1.4"/></g>
  <text x="690" y="212" text-anchor="middle" font-size="11" fill="#b06a1e" font-weight="bold" filter="url(#rough2)">龙抽黑（(b−1)/(w+b−1)）</text>
  <text x="690" y="234" text-anchor="middle" font-size="10" fill="#666666" filter="url(#rough2)">再跳出一只 ⇒ (w−1,b−2) 或 (w,b−3)</text>
  <g filter="url(#rough2)"><line x1="518" y1="216" x2="536" y2="216" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)"/></g>
  <text x="450" y="288" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">dp[w][b] = w/(w+b) + b/(w+b)·(b−1)/(w+b−1)·[ w/(w+b−2)·dp[w−1][b−2] + (b−2)/(w+b−2)·dp[w][b−3] ]</text>
</svg>
