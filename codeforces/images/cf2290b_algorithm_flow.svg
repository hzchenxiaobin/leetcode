<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="680" height="430" fill="#fafafa"/>

  <text x="340" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">算法流程：初始化首字符代价，然后一路扫过去累加</text>
  <text x="340" y="49" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">整个算法只有一个分支：相邻两位是否相同</text>

  <rect x="250" y="62" width="180" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="340" y="83" text-anchor="middle" font-size="12" fill="#2f4a63" filter="url(#rough2)">读入 n 与 s</text>
  <path d="M 340 94 L 340 112" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="240" y="112" width="200" height="32" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="340" y="133" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">ans ← [s[0] = B]</text>
  <path d="M 340 144 L 340 162" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="215" y="162" width="250" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="340" y="184" text-anchor="middle" font-size="12" fill="#2f4a63" filter="url(#rough2)">i 从 1 枚举到 n−1</text>
  <path d="M 340 196 L 340 212" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="340,212 470,258 340,304 210,258" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="340" y="263" text-anchor="middle" font-size="11.5" fill="#7a5a10" filter="url(#rough2)">s[i] == s[i-1] ?</text>

  <path d="M 210 258 L 152 258" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="248" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="54" y="236" width="98" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="103" y="257" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">ans++</text>
  <text x="103" y="273" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">这一位花 1 次</text>

  <path d="M 470 258 L 528 258" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="500" y="248" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="528" y="236" width="112" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="584" y="257" text-anchor="middle" font-size="11.5" fill="#3a5a30" filter="url(#rough2)">ans 不变</text>
  <text x="584" y="273" text-anchor="middle" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">这一位花 0 次</text>

  <path d="M 103 282 L 103 324 L 330 324" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 584 282 L 584 324 L 350 324" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 340 324 L 340 348" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 103 306 L 26 306 L 26 179 L 211 179" stroke="#8aa0b8" stroke-width="1.3" stroke-dasharray="5 4"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="40" y="240" font-size="9.5" fill="#7a90a8" transform="rotate(-90 40 240)" filter="url(#rough2)">重复 n−1 轮</text>

  <rect x="262" y="348" width="156" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="340" y="370" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3a5a30" filter="url(#rough2)">输出 ans</text>

  <text x="340" y="406" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">等价视角：ans = (n − 同色段数) + [s[0] = B]；同色段数可以在同一次扫描里数出来</text>
  <text x="340" y="422" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">两种写法等价，选一种即可，代码量都是 5 行左右</text>
</svg>
