<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2b2b2b"/>
    </marker>
  </defs>

  <rect width="720" height="360" fill="#fafafa"/>
  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">答案 = [a,b] 与 [0, m-1] 的交集长度</text>
  <path d="M 190 42 Q 360 48 530 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 轴 -->
  <line x1="50" y1="170" x2="690" y2="170" stroke="#2b2b2b" stroke-width="1.6" marker-end="url(#ar2)" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#555" text-anchor="middle">
    <text x="66" y="190">0</text>
    <text x="186" y="190">10</text>
    <text x="306" y="190">20</text>
    <text x="426" y="190">30</text>
    <text x="546" y="190">40</text>
    <text x="666" y="190">50</text>
  </g>
  <g filter="url(#rough2)" stroke="#999" stroke-width="1.2">
    <line x1="66" y1="166" x2="66" y2="174"/>
    <line x1="186" y1="166" x2="186" y2="174"/>
    <line x1="306" y1="166" x2="306" y2="174"/>
    <line x1="426" y1="166" x2="426" y2="174"/>
    <line x1="546" y1="166" x2="546" y2="174"/>
    <line x1="666" y1="166" x2="666" y2="174"/>
  </g>

  <!-- 合法区间 0..m-1=25，画在轴上方 -->
  <rect x="66" y="108" width="294" height="30" fill="#e6f4ea" stroke="#2f7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="213" y="128" text-anchor="middle" font-size="12" fill="#1f5226" filter="url(#rough2)">合法：x &lt; m = 26，即 x ≤ 25</text>

  <!-- 无效区间 25.. -->
  <rect x="360" y="60" width="306" height="30" fill="#fdecea" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="513" y="80" text-anchor="middle" font-size="12" fill="#8c2f2b" filter="url(#rough2)">x ≥ 26：0 种排列成功</text>

  <!-- 区间 [a,b]=[17,43] 画在轴下方 -->
  <rect x="264" y="206" width="312" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="420" y="228" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">题目区间 [a,b] = [17, 43]</text>

  <!-- 交集高亮 -->
  <rect x="264" y="108" width="96" height="132" fill="#fff3c4" fill-opacity="0.85" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="312" y="254" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">交集 17..25</text>

  <!-- 竖线标注 -->
  <g filter="url(#rough2)" stroke="#8a6015" stroke-width="1.3" stroke-dasharray="4 4">
    <line x1="264" y1="100" x2="264" y2="248"/>
    <line x1="360" y1="100" x2="360" y2="248"/>
  </g>
  <text x="264" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">a = 17</text>
  <text x="360" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">m-1 = 25</text>
  <text x="576" y="262" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">b = 43</text>

  <!-- 结论 -->
  <rect x="50" y="288" width="640" height="58" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="66" y="313" font-size="13.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">ans = max(0, min(b, m-1) - a + 1)，样例三：25 - 17 + 1 = 9</text>
  <text x="66" y="335" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">样例一 m = 1：合法范围只有 {0}，与 [2,8] 无交集，ans = 0（区间为空时不能输出负数）</text>
</svg>
