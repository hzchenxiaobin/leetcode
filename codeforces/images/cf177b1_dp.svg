<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="14"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">除数 DP：f(8) = 8 + max f(4), f(2), f(1)</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="80.0" y="100.0" width="90.0" height="64.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="125.0" y="128.0" text-anchor="middle" font-size="18" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="125.0" y="152.0" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">f = 1</text>
  <rect x="250.0" y="100.0" width="90.0" height="64.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="295.0" y="128.0" text-anchor="middle" font-size="18" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="295.0" y="152.0" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">f = 3</text>
  <rect x="420.0" y="100.0" width="90.0" height="64.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="465.0" y="128.0" text-anchor="middle" font-size="18" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="465.0" y="152.0" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">f = 7</text>
  <rect x="590.0" y="100.0" width="90.0" height="64.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="635.0" y="128.0" text-anchor="middle" font-size="18" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="635.0" y="152.0" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">f = 15</text>
  <line x1="172.0" y1="132.0" x2="246.0" y2="132.0" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="342.0" y1="132.0" x2="416.0" y2="132.0" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="512.0" y1="132.0" x2="586.0" y2="132.0" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="125.0" y1="166.0" x2="590.0" y2="168.0" stroke="#4a7a3a" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <line x1="295.0" y1="166.0" x2="590.0" y2="168.0" stroke="#4a7a3a" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="360.0" y="196.0" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1、2、4 都是 8 的真约数（虚线）</text>
  <text x="60.0" y="240.0" text-anchor="start" font-size="14" fill="#6b4c9a" font-weight="bold" filter="url(#rough2)">f(x) = x + max{ f(d) | d 是 x 的真约数 }</text>
  <rect x="40.0" y="262.0" width="640.0" height="130.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="54.0" y="287.0" text-anchor="start" font-size="13" fill="#3f3420" filter="url(#rough2)">f(1) = 1</text>
  <text x="54.0" y="314.0" text-anchor="start" font-size="13" fill="#3f3420" filter="url(#rough2)">f(2) = 2 + f(1) = 3</text>
  <text x="54.0" y="341.0" text-anchor="start" font-size="13" fill="#3f3420" filter="url(#rough2)">f(4) = 4 + f(2) = 7</text>
  <text x="54.0" y="368.0" text-anchor="start" font-size="13" fill="#3f3420" filter="url(#rough2)">f(8) = 8 + f(4) = 15</text>
</svg>
