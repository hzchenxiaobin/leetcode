<svg xmlns="http://www.w3.org/2000/svg" width="720" height="492" viewBox="0 0 720 492"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="720" height="492" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">演算：6 组官方样例逐个验证</text>
  <path d="M 202 42 Q 360 49 518 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 表头 -->
  <rect x="38" y="62" width="72" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="88" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">用例</text>
  <rect x="114" y="62" width="196" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="212" y="88" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">a b c</text>
  <rect x="314" y="62" width="90" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="359" y="88" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">b − a</text>
  <rect x="408" y="62" width="90" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="453" y="88" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">c − b</text>
  <rect x="502" y="62" width="180" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="592" y="88" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">判定</text>

  <!-- 行 1：1 2 3 -->
  <rect x="38" y="106" width="72" height="40" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="74" y="132" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="114" y="106" width="196" height="40" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="212" y="132" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">1　2　3</text>
  <rect x="314" y="106" width="90" height="40" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="359" y="132" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="408" y="106" width="90" height="40" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="453" y="132" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="502" y="106" width="180" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="592" y="132" text-anchor="middle" font-size="14" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">YES（2 2 2）</text>

  <!-- 行 2：2 2 2 -->
  <rect x="38" y="150" width="72" height="40" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="74" y="176" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="114" y="150" width="196" height="40" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="212" y="176" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">2　2　2</text>
  <rect x="314" y="150" width="90" height="40" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="359" y="176" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="408" y="150" width="90" height="40" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="453" y="176" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="502" y="150" width="180" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="592" y="176" text-anchor="middle" font-size="14" font-weight="bold" fill="#a14340" filter="url(#rough2)">NO（必须动一步）</text>

  <!-- 行 3：3 4 5 -->
  <rect x="38" y="194" width="72" height="40" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="74" y="220" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="114" y="194" width="196" height="40" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="212" y="220" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">3　4　5</text>
  <rect x="314" y="194" width="90" height="40" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="359" y="220" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="408" y="194" width="90" height="40" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="453" y="220" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="502" y="194" width="180" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="592" y="220" text-anchor="middle" font-size="14" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">YES（4 4 4）</text>

  <!-- 行 4：1 1 4 -->
  <rect x="38" y="238" width="72" height="40" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="74" y="264" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="114" y="238" width="196" height="40" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="212" y="264" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">1　1　4</text>
  <rect x="314" y="238" width="90" height="40" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="359" y="264" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="408" y="238" width="90" height="40" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="453" y="264" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="502" y="238" width="180" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="592" y="264" text-anchor="middle" font-size="14" font-weight="bold" fill="#a14340" filter="url(#rough2)">NO（两步才够）</text>

  <!-- 行 5：8 9 10 -->
  <rect x="38" y="282" width="72" height="40" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="74" y="308" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="114" y="282" width="196" height="40" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="212" y="308" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">8　9　10</text>
  <rect x="314" y="282" width="90" height="40" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="359" y="308" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="408" y="282" width="90" height="40" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="453" y="308" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="502" y="282" width="180" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="592" y="308" text-anchor="middle" font-size="14" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">YES（9 9 9）</text>

  <!-- 行 6：3 5 7 -->
  <rect x="38" y="326" width="72" height="40" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="74" y="352" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <rect x="114" y="326" width="196" height="40" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="212" y="352" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">3　5　7</text>
  <rect x="314" y="326" width="90" height="40" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="359" y="352" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="408" y="326" width="90" height="40" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="453" y="352" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="502" y="326" width="180" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="592" y="352" text-anchor="middle" font-size="14" font-weight="bold" fill="#a14340" filter="url(#rough2)">NO（和为 15 但差为 4）</text>

  <rect x="38" y="392" width="644" height="82" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="416" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">第 2 组是本题最大的陷阱：三堆已经相等，但规则要求必须动一步，所以仍是 NO</text>
  <text x="360" y="440" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">第 6 组说明「总和能被 3 整除」只是必要条件：3 5 7 的和是 15，一次移动却跨不过 2 的差距</text>
  <text x="360" y="462" text-anchor="middle" font-size="11.5" fill="#a3762a" filter="url(#rough2)">两组差都等于 1 ⇔ 三堆是三个连续整数 ⇔ 恰好一次「从最大堆取一颗给最小堆」</text>
</svg>
