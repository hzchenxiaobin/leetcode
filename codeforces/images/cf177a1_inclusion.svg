  <text x="56.0" y="340.0" text-anchor="start" font-size="13.5" fill="#5c4310" font-weight="bold" filter="url(#rough2)">答案 = 20 − 3 × a[mid][mid]（把 4 次改回 1 次）</text>
  <text x="56.0" y="366.0" text-anchor="start" font-size="12" fill="#5c4310" filter="url(#rough2)">其余好格都只落在四条线中的一条上，不需要额外扣减</text>
