<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="380" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">[x,y,x] 是唯一“怎么换都排好序”的形态</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">n=3 且两端相等、中间不同：两种可换的相邻交换都把数组变成单调序列</text>
  <g filter="url(#rough2)"><rect x="120" y="120" width="66" height="48" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="153.0" y="150.12" text-anchor="middle" font-size="17" fill="#2b2b2b" filter="url(#rough2)">x</text>
  <g filter="url(#rough2)"><rect x="194" y="120" width="66" height="48" rx="4" fill="#f6e3c4" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="227.0" y="150.12" text-anchor="middle" font-size="17" fill="#2b2b2b" filter="url(#rough2)">y</text>
  <g filter="url(#rough2)"><rect x="268" y="120" width="66" height="48" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="301.0" y="150.12" text-anchor="middle" font-size="17" fill="#2b2b2b" filter="url(#rough2)">x</text>
  <line x1="153" y1="190" x2="153" y2="232" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="120" y="262" text-anchor="start" font-size="12.5" fill="#555555" filter="url(#rough2)">交换 (1,2)</text>
  <text x="120" y="288" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">得到 y,x,x</text>
  <text x="120" y="312" text-anchor="start" font-size="12.5" fill="#b05a5a" filter="url(#rough2)">非增 → 有序</text>
  <line x1="227" y1="190" x2="227" y2="232" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="228" y="262" text-anchor="start" font-size="12.5" fill="#555555" filter="url(#rough2)">交换 (2,3)</text>
  <text x="228" y="288" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">得到 x,x,y</text>
  <text x="228" y="312" text-anchor="start" font-size="12.5" fill="#b05a5a" filter="url(#rough2)">非降 → 有序</text>
  <line x1="301" y1="190" x2="301" y2="232" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="302" y="262" text-anchor="start" font-size="12.5" fill="#555555" filter="url(#rough2)">交换 (1,3)</text>
  <text x="302" y="288" text-anchor="start" font-size="12.5" fill="#b05a5a" filter="url(#rough2)">值相等，不允许</text>
  <text x="660" y="150" text-anchor="middle" font-size="13" fill="#3d6b2f" filter="url(#rough2)">其它任何形态（n≥3 且不全等）</text>
  <text x="660" y="176" text-anchor="middle" font-size="13" fill="#3d6b2f" filter="url(#rough2)">都存在一个相邻交换能打乱它</text>
  <text x="660" y="210" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">→ 输出 -1 只有三种情况：</text>
  <text x="660" y="234" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">n≤2、全部相等、[x,y,x]</text>
</svg>
