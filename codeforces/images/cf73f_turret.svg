<svg xmlns="http://www.w3.org/2000/svg" width="720" height="392" viewBox="0 0 720 392"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr73f" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arr73g" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="720" height="392" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">炮塔要转过的角距 δ(s)：追得上就当头一炮</text>
  <path d="M 120 40 Q 360 46 600 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 路径 AB -->
  <line x1="80" y1="120" x2="640" y2="120" stroke="#2b2b2b" stroke-width="2" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <circle cx="80" cy="120" r="5.5" fill="#2b2b2b"/>
    <circle cx="640" cy="120" r="5.5" fill="#2b2b2b"/>
  </g>
  <text x="80" y="108" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">A</text>
  <text x="640" y="108" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">B</text>
  <text x="360" y="108" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">玩家以速度 v 匀速前进，位置 P(s)，s 为已走弧长</text>

  <!-- 敌坦克 -->
  <g filter="url(#rough2)">
    <rect x="268" y="252" width="46" height="30" rx="6" fill="#fde8e6" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="291" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">E</text>
  <text x="291" y="298" text-anchor="middle" font-size="11" fill="#8a2b28" filter="url(#rough2)">敌坦克（离 AB ≥ 0.1 m）</text>

  <!-- 垂足 -->
  <line x1="291" y1="120" x2="291" y2="252" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="300" y="190" font-size="10.5" fill="#777" filter="url(#rough2)">h</text>
  <text x="291" y="140" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">s₀</text>

  <!-- 玩家位置 P(s) 与方位角 -->
  <g filter="url(#rough2)">
    <circle cx="470" cy="120" r="6" fill="#4a7a3a"/>
  </g>
  <text x="470" y="108" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">P(s)</text>
  <line x1="291" y1="252" x2="470" y2="120" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="404" y="176" font-size="11.5" fill="#2f5223" filter="url(#rough2)">方位角 ψ(s)</text>

  <!-- 炮塔初始方向 -->
  <line x1="291" y1="252" x2="404" y2="252" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr73f)" filter="url(#rough2)"/>
  <text x="360" y="246" text-anchor="middle" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">炮塔初始角 a</text>

  <!-- δ 角弧 -->
  <path d="M 383 236 Q 372 200 410 178" stroke="#7a4a8a" stroke-width="1.6" fill="none" marker-end="url(#arr73g)" filter="url(#rough2)"/>
  <text x="424" y="212" font-size="12" font-weight="bold" fill="#5a3a6a" filter="url(#rough2)">δ = 圆角距(a, ψ)</text>

  <!-- 可达角锥 -->
  <path d="M 291 252 L 380 216" stroke="#7a4a8a" stroke-width="1.2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <path d="M 291 252 L 380 288" stroke="#7a4a8a" stroke-width="1.2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="396" y="300" font-size="11" fill="#5a3a6a" filter="url(#rough2)">t 秒内可达的角度区间（±w·t）</text>

  <rect x="60" y="316" width="600" height="62" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="76" y="338" font-size="12.5" fill="#7a5a1b" filter="url(#rough2)">开火 ⟺ ∃t：δ(vt) ≤ w·t ⟺ ∃s：v ≤ w·s / δ(s)</text>
  <text x="76" y="360" font-size="12" fill="#7a5a1b" filter="url(#rough2)">所以每台敌坦克只有一个临界速度 V = w · max{ s/δ(s) }，v ≤ V 时它开火，v &gt; V 时永远追不上</text>
</svg>
