<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="22"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例走查：8 → 15，10 → 16</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="40.0" y="92.0" text-anchor="start" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">n = 8：spf 依次为 2, 2, 2</text>
  <circle cx="60.0" cy="132.0" r="23.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="60.0" y="140.0" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold" filter="url(#rough2)">8</text>
  <circle cx="180.0" cy="132.0" r="23.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="180.0" y="140.0" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>
  <line x1="84.0" y1="132.0" x2="154.0" y2="132.0" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="119.0" y="120.0" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">÷2</text>
  <circle cx="300.0" cy="132.0" r="23.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="300.0" y="140.0" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <line x1="204.0" y1="132.0" x2="274.0" y2="132.0" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="239.0" y="120.0" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">÷2</text>
  <circle cx="420.0" cy="132.0" r="23.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="420.0" y="140.0" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <line x1="324.0" y1="132.0" x2="394.0" y2="132.0" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="359.0" y="120.0" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">÷2</text>
  <text x="530.0" y="140.0" text-anchor="start" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">和 = 15</text>
  <text x="40.0" y="212.0" text-anchor="start" font-size="13" fill="#8a6015" font-weight="bold" filter="url(#rough2)">n = 10：spf 依次为 2, 5</text>
  <circle cx="60.0" cy="252.0" r="23.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="60.0" y="260.0" text-anchor="middle" font-size="16" fill="#8a6015" font-weight="bold" filter="url(#rough2)">10</text>
  <circle cx="180.0" cy="252.0" r="23.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="180.0" y="260.0" text-anchor="middle" font-size="16" fill="#8a6015" font-weight="bold" filter="url(#rough2)">5</text>
  <line x1="84.0" y1="252.0" x2="154.0" y2="252.0" stroke="#8a6015" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="119.0" y="240.0" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">÷2</text>
  <circle cx="300.0" cy="252.0" r="23.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="300.0" y="260.0" text-anchor="middle" font-size="16" fill="#8a6015" font-weight="bold" filter="url(#rough2)">1</text>
  <line x1="204.0" y1="252.0" x2="274.0" y2="252.0" stroke="#8a6015" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="239.0" y="240.0" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">÷5</text>
  <text x="420.0" y="260.0" text-anchor="start" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">和 = 16</text>
  <rect x="40.0" y="306.0" width="640.0" height="76.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="54.0" y="330.5" text-anchor="start" font-size="12.5" fill="#3f3420" filter="url(#rough2)">n = 10⁹ = 2⁹ × 5⁹：链长 19，答案 1998535156（超过 2³¹ 的一半，用 long long 更稳）</text>
</svg>
