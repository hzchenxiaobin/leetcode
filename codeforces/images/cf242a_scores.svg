<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="5"/>
    <feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></defs>
  <rect width="720" height="360" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">可行比分 = 网格里同时满足三个条件的格子</text>
  <text x="120" y="66" font-size="12" fill="#555" filter="url(#rough2)">Vasya 的正面数 c →</text>
  <text x="60" y="130" font-size="12" fill="#555" filter="url(#rough2)">Petya 的 d</text>
  <text x="60" y="148" font-size="12" fill="#555" filter="url(#rough2)">↓</text>
  <g filter="url(#rough2)">
    <rect x="140" y="70" width="60" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="200" y="70" width="60" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="260" y="70" width="60" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="320" y="70" width="60" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="140" y="114" width="60" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7"/>
    <rect x="200" y="114" width="60" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="260" y="114" width="60" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="320" y="114" width="60" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="140" y="158" width="60" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7"/>
    <rect x="200" y="158" width="60" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7"/>
    <rect x="260" y="158" width="60" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="320" y="158" width="60" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="170" y="97" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">1,1</text>
  <text x="230" y="97" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">2,1</text>
  <text x="290" y="97" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">3,1</text>
  <text x="350" y="97" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">4,1</text>
  <text x="170" y="141" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5223" filter="url(#rough2)">1,2</text>
  <text x="230" y="141" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">2,2</text>
  <text x="290" y="141" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">3,2</text>
  <text x="350" y="141" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">4,2</text>
  <text x="170" y="185" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5223" filter="url(#rough2)">1,3</text>
  <text x="230" y="185" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5223" filter="url(#rough2)">2,3</text>
  <text x="290" y="185" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">3,3</text>
  <text x="350" y="185" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">4,3</text>
  <text x="410" y="97" font-size="11" fill="#8a6015" filter="url(#rough2)">c ≥ a？（列）</text>
  <text x="410" y="141" font-size="11" fill="#8a6015" filter="url(#rough2)">d ≥ b？（行）</text>
  <text x="410" y="185" font-size="11" fill="#2f5223" filter="url(#rough2)">c &gt; d 才是绿色（Vasya 胜）</text>

  <rect x="60" y="236" width="600" height="56" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="74" y="260" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">每个格子的 c 在 [a, x]、d 在 [b, y] 内，而且必须 c &gt; d：</text>
  <text x="74" y="282" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">固定 c 时，d 只能取 b .. min(y, c-1)，共 max(0, min(y, c-1) - b + 1) 个。</text>

  <rect x="60" y="304" width="600" height="42" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="74" y="330" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">枚举 c 递增、d 递增，输出顺序自然就是「严格递增」的字典序，不需要额外排序。</text>
</svg>
