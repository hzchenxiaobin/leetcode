<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="835"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="280" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">两种状态：在 D、在某个指定非 D 顶点</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">s_{n+1}=3t_n，t_{n+1}=s_n+2t_n</text>
  <g filter="url(#rough2)"><circle cx="220" cy="140" r="26" fill="#dcecd2" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="220" y="143.96" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">D</text>
  <g filter="url(#rough2)"><circle cx="620" cy="140" r="26" fill="#cfe0f5" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="620" y="143.96" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">A</text>
  <text x="220" y="190" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">s_n</text>
  <text x="620" y="190" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">t_n</text>
  <text x="420" y="96" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">3 条棱</text>
  <text x="420" y="200" text-anchor="middle" font-size="10" fill="#666666" filter="url(#rough2)">1 条到 D，2 条到 B/C</text>
  <text x="450" y="240" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">闭式 s_n = (3ⁿ + 3·(−1)ⁿ)/4</text>
</svg>
