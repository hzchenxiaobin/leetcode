<svg xmlns="http://www.w3.org/2000/svg" width="740" height="340" viewBox="0 0 740 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1169"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="740" height="340" fill="#fafafa"/>
  <text x="370.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">四种拐角与 (r,d) 编码</text>
  <path d="M 118.4 42 Q 370.0 48 621.6 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="370.0" y="326" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">r=有无右端，d=有无下端：沿行 r 交替、沿列 d 交替</text>
  <rect x="60" y="80" width="140" height="90" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="130" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1 上+左</text>
  <text x="130" y="145" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">r=0, d=0</text>
  <rect x="225" y="80" width="140" height="90" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="295" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2 下+左</text>
  <text x="295" y="145" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">r=0, d=1</text>
  <rect x="390" y="80" width="140" height="90" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="460" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3 下+右</text>
  <text x="460" y="145" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">r=1, d=1</text>
  <rect x="555" y="80" width="140" height="90" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="625" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">4 上+右</text>
  <text x="625" y="145" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">r=1, d=0</text>
  <rect x="60" y="200" width="620" height="50" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="370" y="230" text-anchor="middle" font-size="12" fill="#335478" filter="url(#rough2)">公共边：左格右端 = 右格左端 = 1 − 右格右端 ⇒ 沿行交替；竖向同理</text>
  <text x="370" y="285" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">⇒ 自由度只有 n 个行位 r(i,1) 与 m 个列位 d(1,j)，答案 = 2^(未约束数) mod 1000003</text>
  <text x="370" y="315" text-anchor="middle" font-size="11.5" fill="#8c2f2c" filter="url(#rough2)">任一已给格子给出两个方程；同行/同列冲突则为 0</text>
</svg>
