<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>
  <rect width="760" height="430" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两棵样例树的真实询问轨迹（d 只增不减）</text>
  <path d="M 120 41 Q 380 48 640 41" stroke="#2b2b2b" stroke-width="1.1" fill="none" filter="url(#rough2)"/>

  <!-- ================= 左表：路径 1-2-3-4 ================= -->
  <g filter="url(#rough2)">
    <rect x="20" y="54" width="360" height="326" rx="10" fill="#f7fbff" stroke="#446688" stroke-width="1.4"/>
    <text x="200" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66">样例 1：路径 1—2—3—4（9 次询问 / 3n = 12）</text>
    <rect x="34" y="90" width="332" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1"/>
    <text x="58" y="107" font-size="11.5" font-weight="bold" fill="#2f4a66">询问</text>
    <text x="196" y="107" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66">答</text>
    <text x="238" y="107" font-size="11.5" font-weight="bold" fill="#2f4a66">含义</text>

    <rect x="34" y="118" width="332" height="22" rx="4" fill="#ffffff" stroke="#dfe6ee" stroke-width="0.8"/>
    <text x="58" y="134" font-size="12" fill="#333">? 1 2 1</text>
    <text x="196" y="134" text-anchor="middle" font-size="12" fill="#446688">1</text>
    <text x="238" y="134" font-size="11.5" fill="#555">dist(1,2) ≥ 1，d: 0→1</text>

    <rect x="34" y="142" width="332" height="22" rx="4" fill="#ffffff" stroke="#dfe6ee" stroke-width="0.8"/>
    <text x="58" y="158" font-size="12" fill="#333">? 1 2 2</text>
    <text x="196" y="158" text-anchor="middle" font-size="12" fill="#b85450">0</text>
    <text x="238" y="158" font-size="11.5" fill="#555">到顶：dist(1,2) = 1</text>

    <rect x="34" y="166" width="332" height="22" rx="4" fill="#ffffff" stroke="#dfe6ee" stroke-width="0.8"/>
    <text x="58" y="182" font-size="12" fill="#333">? 1 3 2</text>
    <text x="196" y="182" text-anchor="middle" font-size="12" fill="#446688">1</text>
    <text x="238" y="182" font-size="11.5" fill="#555">d: 1→2</text>

    <rect x="34" y="190" width="332" height="22" rx="4" fill="#ffffff" stroke="#dfe6ee" stroke-width="0.8"/>
    <text x="58" y="206" font-size="12" fill="#333">? 1 3 3</text>
    <text x="196" y="206" text-anchor="middle" font-size="12" fill="#b85450">0</text>
    <text x="238" y="206" font-size="11.5" fill="#555">到顶：dist(1,3) = 2</text>

    <rect x="34" y="214" width="332" height="22" rx="4" fill="#ffffff" stroke="#dfe6ee" stroke-width="0.8"/>
    <text x="58" y="230" font-size="12" fill="#333">? 1 4 3</text>
    <text x="196" y="230" text-anchor="middle" font-size="12" fill="#446688">1</text>
    <text x="238" y="230" font-size="11.5" fill="#555">d: 2→3，last ← 4</text>

    <rect x="34" y="238" width="332" height="22" rx="4" fill="#ffffff" stroke="#dfe6ee" stroke-width="0.8"/>
    <text x="58" y="254" font-size="12" fill="#333">? 1 4 4</text>
    <text x="196" y="254" text-anchor="middle" font-size="12" fill="#b85450">0</text>
    <text x="238" y="254" font-size="11.5" fill="#555">到顶，A = 4，d = 3</text>

    <rect x="34" y="262" width="332" height="22" rx="4" fill="#fffdf7" stroke="#e8d9b0" stroke-width="0.8"/>
    <text x="58" y="278" font-size="12" fill="#333">? 4 1 4</text>
    <text x="196" y="278" text-anchor="middle" font-size="12" fill="#b85450">0</text>
    <text x="238" y="278" font-size="11.5" fill="#8a6520">第二轮，d 仍为 3</text>

    <rect x="34" y="286" width="332" height="22" rx="4" fill="#fffdf7" stroke="#e8d9b0" stroke-width="0.8"/>
    <text x="58" y="302" font-size="12" fill="#333">? 4 2 4</text>
    <text x="196" y="302" text-anchor="middle" font-size="12" fill="#b85450">0</text>
    <text x="238" y="302" font-size="11.5" fill="#8a6520">dist(4,2) = 2</text>

    <rect x="34" y="310" width="332" height="22" rx="4" fill="#fffdf7" stroke="#e8d9b0" stroke-width="0.8"/>
    <text x="58" y="326" font-size="12" fill="#333">? 4 3 4</text>
    <text x="196" y="326" text-anchor="middle" font-size="12" fill="#b85450">0</text>
    <text x="238" y="326" font-size="11.5" fill="#8a6520">dist(4,3) = 1</text>

    <rect x="34" y="334" width="332" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="58" y="351" font-size="12.5" font-weight="bold" fill="#3c5e2e">! 4 1 3</text>
    <text x="196" y="351" text-anchor="middle" font-size="11.5" fill="#3c5e2e">答案</text>
    <text x="238" y="351" font-size="11.5" fill="#3c5e2e">dist(4,1) = 3 = 直径</text>
  </g>

  <!-- ================= 右表：星 1-{2,3,4} ================= -->
  <g filter="url(#rough2)">
    <rect x="392" y="54" width="348" height="326" rx="10" fill="#fffdf7" stroke="#d6a040" stroke-width="1.4"/>
    <text x="566" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6520">样例 3：星 1—{2,3,4}（8 次询问 / 3n = 12）</text>
    <rect x="406" y="90" width="320" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1"/>
    <text x="428" y="107" font-size="11.5" font-weight="bold" fill="#8a6520">询问</text>
    <text x="556" y="107" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6520">答</text>
    <text x="594" y="107" font-size="11.5" font-weight="bold" fill="#8a6520">含义</text>

    <rect x="406" y="118" width="320" height="22" rx="4" fill="#ffffff" stroke="#efe6cd" stroke-width="0.8"/>
    <text x="428" y="134" font-size="12" fill="#333">? 1 2 1</text>
    <text x="556" y="134" text-anchor="middle" font-size="12" fill="#4a7a3a">1</text>
    <text x="594" y="134" font-size="11.5" fill="#555">d: 0→1</text>

    <rect x="406" y="142" width="320" height="22" rx="4" fill="#ffffff" stroke="#efe6cd" stroke-width="0.8"/>
    <text x="428" y="158" font-size="12" fill="#333">? 1 2 2</text>
    <text x="556" y="158" text-anchor="middle" font-size="12" fill="#b85450">0</text>
    <text x="594" y="158" font-size="11.5" fill="#555">到顶，A = 2</text>

    <rect x="406" y="166" width="320" height="22" rx="4" fill="#ffffff" stroke="#efe6cd" stroke-width="0.8"/>
    <text x="428" y="182" font-size="12" fill="#333">? 1 3 2</text>
    <text x="556" y="182" text-anchor="middle" font-size="12" fill="#b85450">0</text>
    <text x="594" y="182" font-size="11.5" fill="#555">叶子深度都是 1</text>

    <rect x="406" y="190" width="320" height="22" rx="4" fill="#ffffff" stroke="#efe6cd" stroke-width="0.8"/>
    <text x="428" y="206" font-size="12" fill="#333">? 1 4 2</text>
    <text x="556" y="206" text-anchor="middle" font-size="12" fill="#b85450">0</text>
    <text x="594" y="206" font-size="11.5" fill="#555">无需再试 d = 1</text>

    <rect x="406" y="214" width="320" height="22" rx="4" fill="#ffffff" stroke="#efe6cd" stroke-width="0.8"/>
    <text x="428" y="230" font-size="12" fill="#333">? 2 1 2</text>
    <text x="556" y="230" text-anchor="middle" font-size="12" fill="#b85450">0</text>
    <text x="594" y="230" font-size="11.5" fill="#555">第二轮，d 仍为 1</text>

    <rect x="406" y="238" width="320" height="22" rx="4" fill="#ffffff" stroke="#efe6cd" stroke-width="0.8"/>
    <text x="428" y="254" font-size="12" fill="#333">? 2 3 2</text>
    <text x="556" y="254" text-anchor="middle" font-size="12" fill="#4a7a3a">1</text>
    <text x="594" y="254" font-size="11.5" fill="#555">d: 1→2，B ← 3</text>

    <rect x="406" y="262" width="320" height="22" rx="4" fill="#ffffff" stroke="#efe6cd" stroke-width="0.8"/>
    <text x="428" y="278" font-size="12" fill="#333">? 2 3 3</text>
    <text x="556" y="278" text-anchor="middle" font-size="12" fill="#b85450">0</text>
    <text x="594" y="278" font-size="11.5" fill="#555">到顶：dist(2,3) = 2</text>

    <rect x="406" y="286" width="320" height="22" rx="4" fill="#ffffff" stroke="#efe6cd" stroke-width="0.8"/>
    <text x="428" y="302" font-size="12" fill="#333">? 2 4 3</text>
    <text x="556" y="302" text-anchor="middle" font-size="12" fill="#b85450">0</text>
    <text x="594" y="302" font-size="11.5" fill="#555">同样是 2，不再增加</text>

    <rect x="406" y="310" width="320" height="22" rx="4" fill="#ffffff" stroke="#efe6cd" stroke-width="0.8"/>
    <text x="428" y="326" font-size="12" fill="#333">跳过 v = 2</text>
    <text x="594" y="326" font-size="11.5" fill="#555">终点不必自问</text>

    <rect x="406" y="334" width="320" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <text x="428" y="351" font-size="12.5" font-weight="bold" fill="#3c5e2e">! 2 3 2</text>
    <text x="556" y="351" text-anchor="middle" font-size="11.5" fill="#3c5e2e">答案</text>
    <text x="594" y="351" font-size="11.5" fill="#3c5e2e">dist(2,3) = 2</text>
  </g>

  <text x="380" y="404" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">询问数 = 2(n−1) + D：路径 9 = 2·3 + 3，星 8 = 2·3 + 2（星形 D = 2 也用满两轮基础询问）</text>
  <text x="380" y="424" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">增量每次只 +1：d 已经到顶时，后续每个点就只花 1 次基础询问</text>
</svg>
