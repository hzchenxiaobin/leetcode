<svg xmlns="http://www.w3.org/2000/svg" width="740" height="340" viewBox="0 0 740 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="223"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="740" height="340" fill="#fafafa"/>
  <text x="370" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按单位利润降序，把货舱一格一格装满</text>
  <path d="M 170 46 Q 370 52 570 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="90" y="78" text-anchor="start" font-size="10.5" font-weight="normal" fill="#555" filter="url(#rough2)">单位利润</text>
  <text x="30" y="114" text-anchor="start" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">商品 1</text>
  <rect x="90" y="92" width="70" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="125" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">+3</text>
  <rect x="190" y="92" width="28" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="224" y="92" width="28" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="258" y="92" width="28" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="300" y="114" text-anchor="start" font-size="10.5" font-weight="normal" fill="#555" filter="url(#rough2)">×3</text>
  <text x="30" y="170" text-anchor="start" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">商品 3</text>
  <rect x="90" y="148" width="70" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="125" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">+1</text>
  <rect x="190" y="148" width="28" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="224" y="148" width="28" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="258" y="148" width="28" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="292" y="148" width="28" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="326" y="148" width="28" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="360" y="148" width="28" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="394" y="148" width="28" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="428" y="148" width="28" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="462" y="148" width="28" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="496" y="148" width="28" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="538" y="170" text-anchor="start" font-size="10.5" font-weight="normal" fill="#555" filter="url(#rough2)">×10</text>
  <text x="30" y="226" text-anchor="start" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">商品 2</text>
  <rect x="90" y="204" width="70" height="34" rx="6" fill="#fdecea" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="125" y="226" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">-1</text>
  <rect x="190" y="204" width="28" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="224" y="204" width="28" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="258" y="204" width="28" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="292" y="204" width="28" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="326" y="204" width="28" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="368" y="226" text-anchor="start" font-size="10.5" font-weight="normal" fill="#555" filter="url(#rough2)">×5</text>
  <text x="70" y="286" text-anchor="start" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">货舱 k = 10：先放 3 件商品 1（+3），再放 7 件商品 3（+1），商品 2 利润为负不放。</text>
  <rect x="60" y="296" width="620" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="74" y="318" text-anchor="start" font-size="11.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">利润 = 3×3 + 7×1 = 16（样例答案）</text>
</svg>
