<svg xmlns="http://www.w3.org/2000/svg" width="840" height="430" viewBox="0 0 840 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="430" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">状态：4 种 (F(x), F(¬x)) 有序对的集合</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">用 4 位掩码表示；叶子只有 3 种初始掩码，复合时做笛卡尔积 + 逐点运算</text>
  <g filter="url(#rough2)"><rect x="90" y="92" width="200" height="96" rx="4" fill="#e8eef4" fill-opacity="0.85" stroke="#8899aa" stroke-width="1.3"/></g>
  <text x="190" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">叶子 0</text>
  <text x="190" y="146" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">(0,0)</text>
  <text x="190" y="172" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">掩码 0001</text>
  <g filter="url(#rough2)"><rect x="320" y="92" width="200" height="96" rx="4" fill="#e8eef4" fill-opacity="0.85" stroke="#8899aa" stroke-width="1.3"/></g>
  <text x="420" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">叶子 1</text>
  <text x="420" y="146" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">(1,1)</text>
  <text x="420" y="172" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">掩码 1000</text>
  <g filter="url(#rough2)"><rect x="550" y="92" width="200" height="96" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="650" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">叶子 ?</text>
  <text x="650" y="146" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">(0,1) (1,0)</text>
  <text x="650" y="172" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">掩码 0110</text>
  <text x="420" y="226" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">复合 h = g1 op g2：S(h) = { (op(a,b), op(a′,b′)) : (a,a′) ∈ S(g1), (b,b′) ∈ S(g2) }</text>
  <text x="420" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">可能的 9 种掩码（(0,1) 与 (1,0) 总是同时出现）</text>
  <g filter="url(#rough2)"><rect x="90" y="286" width="72" height="34" rx="4" fill="#e8eef4" fill-opacity="0.85" stroke="#8899aa" stroke-width="1.3"/></g>
  <text x="126" y="309" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">0001</text>
  <g filter="url(#rough2)"><rect x="172" y="286" width="72" height="34" rx="4" fill="#e8eef4" fill-opacity="0.85" stroke="#8899aa" stroke-width="1.3"/></g>
  <text x="208" y="309" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">1000</text>
  <g filter="url(#rough2)"><rect x="254" y="286" width="72" height="34" rx="4" fill="#e8eef4" fill-opacity="0.85" stroke="#8899aa" stroke-width="1.3"/></g>
  <text x="290" y="309" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">1001</text>
  <g filter="url(#rough2)"><rect x="336" y="286" width="72" height="34" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="372" y="309" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1101</text>
  <g filter="url(#rough2)"><rect x="418" y="286" width="72" height="34" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="454" y="309" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1011</text>
  <g filter="url(#rough2)"><rect x="500" y="286" width="72" height="34" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="536" y="309" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">0110</text>
  <g filter="url(#rough2)"><rect x="582" y="286" width="72" height="34" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="618" y="309" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1110</text>
  <g filter="url(#rough2)"><rect x="664" y="286" width="72" height="34" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="700" y="309" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">0111</text>
  <g filter="url(#rough2)"><rect x="746" y="286" width="72" height="34" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="782" y="309" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1111</text>
  <text x="420" y="352" text-anchor="middle" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">绿色（含 (0,1) 或 (1,0) 位）⇒ 公式不自补 ⇒ YES；其余 ⇒ NO</text>
  <text x="420" y="380" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">常数公式的掩码是 0001 或 1000；异或类公式的掩码是 1001</text>
  <text x="420" y="406" text-anchor="middle" font-size="12.5" fill="#8a4b2a" filter="url(#rough2)">整棵公式算完后只看掩码的 0110 两位</text>
</svg>
