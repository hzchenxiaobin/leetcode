<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察 2：siz 降序就是拓扑序，按序逐点问出父亲</text>
  <text x="310" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">祖孙的 siz 严格递减 ⇒ 排好序后，a_i 的父亲一定在 a_1 … a_{i−1} 里</text>

  <rect x="18" y="70" width="502" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="28" y="86" font-size="10" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">已确定形态的 P（连通、含根）</text>

  <rect x="26" y="96" width="60" height="30" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="56" y="116" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">a₁</text>
  <rect x="94" y="96" width="60" height="30" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="124" y="116" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">a₂</text>
  <text x="166" y="117" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">⋯</text>
  <rect x="186" y="96" width="66" height="30" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="219" y="116" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">aᵢ₋₁</text>

  <rect x="266" y="88" width="74" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="303" y="108" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">aᵢ</text>
  <text x="303" y="126" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">当前点</text>

  <rect x="354" y="96" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="389" y="116" text-anchor="middle" font-size="11" fill="#33506e" filter="url(#rough2)">aᵢ₊₁</text>
  <text x="440" y="117" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">⋯</text>
  <rect x="458" y="96" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="486" y="116" text-anchor="middle" font-size="11" fill="#33506e" filter="url(#rough2)">aₙ</text>

  <text x="28" y="152" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">权值 n−i+1 … n−1，沿链递增</text>
  <text x="283" y="152" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">权值 n</text>
  <text x="366" y="152" font-size="9.5" fill="#33506e" filter="url(#rough2)">权值 1 … n−i，全比 P 小</text>

  <path d="M 310 176 L 310 196" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <rect x="30" y="202" width="560" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="44" y="222" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">记 W(v) = siz_v − Σ(已确定儿子 c 的 siz_c)：最深已确定祖先是 v 的点数，Known = Σ_{v∈P} p_v·W(v)</text>
  <text x="44" y="244" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">S = n·siz_{aᵢ} + Known − p_f·siz_{aᵢ}</text>
  <text x="44" y="266" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">⇒ p_f = n − (S − Known) / siz_{aᵢ}，再用 rank(f) = p_f − (n−i) 反查 a_rank 即得父亲</text>
  <text x="44" y="284" font-size="9.5" fill="#999" filter="url(#rough2)">p_f 只能取 n−i+1 … n−1，与 P 中顶点一一对应</text>

  <rect x="30" y="308" width="270" height="88" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="9" filter="url(#rough2)"/>
  <text x="44" y="328" font-size="10" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">为什么子树外必取 p_{h(j)}</text>
  <text x="44" y="347" font-size="9.5" fill="#555" filter="url(#rough2)">P 的权值全都大于待定点的权值，</text>
  <text x="44" y="363" font-size="9.5" fill="#555" filter="url(#rough2)">且沿已确定链严格递增，故路径最大值</text>
  <text x="44" y="379" font-size="9.5" fill="#555" filter="url(#rough2)">就是最深已确定祖先 h(j) 的权值。</text>
  <text x="44" y="392" font-size="9.5" fill="#555" filter="url(#rough2)">子树内的点则一律被 aᵢ 的 n 覆盖。</text>

  <rect x="320" y="308" width="270" height="88" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="9" filter="url(#rough2)"/>
  <text x="334" y="328" font-size="10" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">为什么能唯一反解</text>
  <text x="334" y="347" font-size="9.5" fill="#555" filter="url(#rough2)">S 里未知的只有 p_f 一个数；从 S 减去</text>
  <text x="334" y="363" font-size="9.5" fill="#555" filter="url(#rough2)">可算的 Known，除以 siz 得到 n − p_f，</text>
  <text x="334" y="379" font-size="9.5" fill="#555" filter="url(#rough2)">而 P 中每点的权值互不相同，</text>
  <text x="334" y="392" font-size="9.5" fill="#555" filter="url(#rough2)">所以父亲被唯一确定。</text>
</svg>
