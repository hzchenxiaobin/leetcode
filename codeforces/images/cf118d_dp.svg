<svg xmlns="http://www.w3.org/2000/svg" width="884" height="360" viewBox="0 0 884 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="117"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="884" height="360" fill="#fafafa"/>
  <text x="442" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按结尾类型做 DP</text>
  <text x="442" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">f 以步兵结尾，g 以骑兵结尾</text>
  <g filter="url(#rough2)"><rect x="88" y="92" width="708" height="58" rx="4" fill="#d7ecd0" fill-opacity="0.45" stroke="#6a9a58" stroke-width="1.3"/></g>
  <text x="442" y="116" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">f[i][j] = Σ_{t=1..k1} g[i−t][j]</text>
  <text x="442" y="138" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">g[i][j] = Σ_{t=1..k2} f[i][j−t]</text>
  <text x="442" y="190" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">边界 f[i][0]=1（1≤i≤k1）、g[0][j]=1（1≤j≤k2）</text>
  <text x="442" y="220" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">直接三重循环 O(n1·n2·k) 足够（100·100·10）</text>
  <g filter="url(#rough2)"><rect x="88" y="246" width="708" height="48" rx="4" fill="#f6e3c4" fill-opacity="0.45" stroke="#c9a86a" stroke-width="1.3"/></g>
  <text x="442" y="276" text-anchor="middle" font-size="12.5" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">答案 = f[n1][n2] + g[n1][n2]（模 10⁸）</text>
</svg>
