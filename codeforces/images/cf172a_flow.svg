<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/></marker>
  </defs>

  <rect width="720" height="340" fill="#fafafa"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：读入 → 逐位比 → 收缩 len</text>
  <path d="M 190 46 Q 360 52 530 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="40" y="90" width="150" height="56" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115.0" y="114" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">读入 n 与 s1</text>
  <text x="115.0" y="134" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555" filter="url(#rough2)">len ← |s1| = L，参照串 r ← s1</text>
  <rect x="230" y="90" width="150" height="56" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="305.0" y="114" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">读入 s_i</text>
  <text x="305.0" y="134" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555" filter="url(#rough2)">j ← 0</text>
  <rect x="420" y="90" width="150" height="56" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="495.0" y="114" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">比较 s_i[j] 与 r[j]</text>
  <text x="495.0" y="134" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555" filter="url(#rough2)">j &lt; len 且相等 ⇒ j++</text>
  <rect x="420" y="190" width="150" height="56" rx="10" fill="#fdecea" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="495.0" y="214" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">len ← j</text>
  <text x="495.0" y="234" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555" filter="url(#rough2)">第一次失配处截断</text>
  <rect x="230" y="190" width="150" height="56" rx="10" fill="#f3e8fb" stroke="#7a4a9a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="305.0" y="214" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">len = 0 ?</text>
  <text x="305.0" y="234" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555" filter="url(#rough2)">是 ⇒ 直接结束</text>
  <rect x="40" y="190" width="150" height="56" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115.0" y="214" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">输出 len</text>
  <text x="115.0" y="234" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555" filter="url(#rough2)">题目只要长度</text>
  <line x1="190" y1="118" x2="230" y2="118" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <line x1="380" y1="118" x2="420" y2="118" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <line x1="495" y1="146" x2="495" y2="190" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <line x1="420" y1="218" x2="380" y2="218" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <line x1="230" y1="218" x2="190" y2="218" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="360" y="250" text-anchor="middle" font-size="12" font-weight="normal" fill="#666" filter="url(#rough2)">循环：i = 2 … n</text>
  <path d="M 300 146 Q 300 168 360 176 Q 320 176 306 166" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="300" y="92" text-anchor="start" font-size="11" font-weight="normal" fill="#b85450" filter="url(#rough2)">无公共前缀时提前退出</text>
  <rect x="430" y="264" width="256" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="442" y="284" text-anchor="start" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">总比较次数 ≤ n·L = 6×10^5</text>
  <text x="442" y="302" text-anchor="start" font-size="10.5" font-weight="normal" fill="#7a5a1b" filter="url(#rough2)">与 L 的大小无关的部分只有 O(n) 次循环</text>
</svg>
