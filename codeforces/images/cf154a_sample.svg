<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="503"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="230" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">样例 2：codeforces，禁忌对 do 与 cs</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">只有 od 那一段需要删 1 个</text>
  <text x="450" y="104" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">段 {d,o}：o d（各 1）⇒ 删 1；另一段只有 o ⇒ 删 0</text>
  <text x="450" y="140" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">段 {c,s}：c、c、s 都被其它字母隔开 ⇒ 各段只 1 个 ⇒ 删 0</text>
  <text x="450" y="180" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">合计 1</text>
</svg>
