<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa" filter="url(#rough2)"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    算法流程：先算 g = gcd(x, y)，再逐位比较余数
  </text>

  <rect x="150" y="50" width="260" height="44" rx="8" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="78" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    读入 n, x, y 与排列 p[1..n]
  </text>

  <path d="M 280 94 L 280 118" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="118" width="260" height="44" rx="8" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="146" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    g = gcd(x, y)
  </text>

  <path d="M 280 162 L 280 192" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,192 470,252 280,312 90,252" fill="#e6f4ea" stroke="#4a7a3a"
           stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="246" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    i mod g == p[i] mod g
  </text>
  <text x="280" y="268" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    对每个 i = 1..n 都成立？
  </text>

  <path d="M 262 306 L 202 350" stroke="#4a7a3a" stroke-width="1.8" fill="none"
        marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="184" y="338" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <path d="M 298 306 L 358 350" stroke="#b85450" stroke-width="1.8" fill="none"
        marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="380" y="338" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="72" y="352" width="180" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="2" filter="url(#rough2)"/>
  <text x="162" y="382" text-anchor="middle" font-size="14" fill="#2f4f2f" filter="url(#rough2)">
    输出 YES
  </text>

  <rect x="308" y="352" width="180" height="48" rx="8" fill="#fce4ec" stroke="#b85450"
        stroke-width="2" filter="url(#rough2)"/>
  <text x="398" y="382" text-anchor="middle" font-size="14" fill="#7a2f2f" filter="url(#rough2)">
    输出 NO
  </text>

  <text x="280" y="430" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">
    等价写法：把 (i, i+x)、(i, i+y) 并查集合并，再检查 find(i) == find(p[i])
  </text>
  <text x="280" y="450" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">
    该写法不需要任何数论结论，代价 O(n·α(n))
  </text>
</svg>
