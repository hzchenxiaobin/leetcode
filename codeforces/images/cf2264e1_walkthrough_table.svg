<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 412" width="860" height="412"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="19"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="860" height="412" fill="#fafafa"/>

  <text x="430" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：a = [2, 4, 4, 4] 按 (min, max) 分组</text>
  <text x="430" y="55" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#rough2)">每个非空子序列只由它的最小值与最大值决定贡献，中间元素只贡献 2 的幂次</text>

  <!-- 表头 -->
  <rect x="46" y="76" width="500" height="34" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="128" y="98" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">(min, max)</text>
  <text x="288" y="98" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">子序列个数</text>
  <text x="430" y="98" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">f</text>
  <text x="512" y="98" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">贡献</text>

  <!-- 行 1 -->
  <rect x="46" y="118" width="500" height="34" rx="6" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="128" y="140" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">(4, 4)</text>
  <text x="288" y="140" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">2³ − 1 = 7</text>
  <text x="430" y="140" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="512" y="140" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">28</text>

  <!-- 行 2 -->
  <rect x="46" y="160" width="500" height="34" rx="6" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="128" y="182" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">(2, 2)</text>
  <text x="288" y="182" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="430" y="182" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="512" y="182" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">2</text>

  <!-- 行 3 -->
  <rect x="46" y="202" width="500" height="34" rx="6" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="128" y="224" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">(2, 4)</text>
  <text x="288" y="224" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">1 × (2³ − 1) = 7</text>
  <text x="430" y="224" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="512" y="224" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">7</text>

  <!-- 合计 -->
  <rect x="46" y="248" width="500" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="128" y="273" text-anchor="middle" font-size="12.8" font-weight="bold" fill="#8a6015" filter="url(#rough2)">合计</text>
  <text x="392" y="273" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">28 + 2 + 7</text>
  <text x="512" y="273" text-anchor="middle" font-size="14" font-weight="bold" fill="#8c3a37" filter="url(#rough2)">37</text>

  <!-- 右侧解读 -->
  <rect x="570" y="76" width="250" height="212" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="586" y="100" font-size="12.6" font-weight="bold" fill="#8c3a37" filter="url(#rough2)">为什么 f(2,4) = 1 ？</text>
  <text x="586" y="124" font-size="11.5" fill="#8c3a37" filter="url(#rough2)">· B(2) = 4，4 是一堵墙</text>
  <text x="586" y="146" font-size="11.5" fill="#8c3a37" filter="url(#rough2)">· 4 唯一的质因子 2 整除 2</text>
  <text x="586" y="168" font-size="11.5" fill="#8c3a37" filter="url(#rough2)">· 所以降 4 必同时把 2 降到 1</text>
  <text x="586" y="190" font-size="11.5" fill="#8c3a37" filter="url(#rough2)">· 想都停在 2 已无可能</text>
  <text x="586" y="216" font-size="11.5" font-weight="bold" fill="#8c3a37" filter="url(#rough2)">⇒ 只能一起降到 1</text>
  <text x="586" y="246" font-size="11.2" fill="#8c3a37" filter="url(#rough2)">而 (4,4) 组没有任何约束：</text>
  <text x="586" y="266" font-size="11.2" fill="#8c3a37" filter="url(#rough2)">所有 4 本来就相等，f = 4</text>

  <!-- 计数公式 -->
  <rect x="46" y="306" width="774" height="88" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="62" y="330" font-size="12.6" font-weight="bold" fill="#33582a" filter="url(#rough2)">计数公式（S 为出现次数的前缀和）</text>
  <text x="62" y="356" font-size="12.2" fill="#33582a" filter="url(#rough2)">ans = Σ_v (2^c(v) − 1)·v　+　Σ_{u&lt;v} (2^c(u) − 1)(2^c(v) − 1)·2^(S(v−1) − S(u))·F(u, v)</text>
  <text x="62" y="380" font-size="11.4" fill="#4a7a3a" filter="url(#rough2)">第一项是 min = max 的子序列；第二项固定 min = u 与 max = v，(u, v) 之间的元素任意选、不受限制。</text>
</svg>
