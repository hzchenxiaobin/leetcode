<svg xmlns="http://www.w3.org/2000/svg" width="740" height="340" viewBox="0 0 740 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="53"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ra" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="740" height="340" fill="#fafafa"/>
  <text x="370" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">松弛：dist[v] &gt; dist[u] + w 时更新，并记下 par[v] = u</text>

  <line x1="180" y1="150" x2="420" y2="120" stroke="#8a94a6" stroke-width="2" filter="url(#rough2)"/>
  <text x="295" y="126" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">w = 4</text>
  <line x1="420" y1="120" x2="600" y2="200" stroke="#c9ced6" stroke-width="1.6" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <circle cx="180" cy="150" r="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
    <text x="180" y="156" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5223">u</text>
    <text x="180" y="196" text-anchor="middle" font-size="11" fill="#2f5223">dist = 7（已确定）</text>
    <circle cx="420" cy="120" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <text x="420" y="126" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66">v</text>
    <text x="420" y="86" text-anchor="middle" font-size="11" fill="#2f4a66">dist = 15（旧的）</text>
    <circle cx="600" cy="200" r="18" fill="#f4f6f9" stroke="#8a94a6" stroke-width="1.4"/>
    <text x="600" y="205" text-anchor="middle" font-size="12" fill="#555">…</text>
  </g>

  <path d="M360,150 Q300,190 250,172" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#ra)" filter="url(#rough2)"/>
  <text x="330" y="200" text-anchor="middle" font-size="11.5" fill="#8f3b37" filter="url(#rough2)">7 + 4 = 11 &lt; 15</text>
  <text x="480" y="160" text-anchor="middle" font-size="11.5" fill="#8f3b37" filter="url(#rough2)">更新为 11</text>

  <rect x="60" y="246" width="620" height="76" rx="10" fill="#f4f6f9" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <g font-size="12.5" fill="#2f4a66" filter="url(#rough2)">
    <text x="76" y="270">· 每次弹出堆中 dist 最小的点 u，它的 dist 已经是最短路；用它的出边松弛邻居。</text>
    <text x="76" y="294">· par[v] 记录"最后一次让 dist[v] 变小的前驱"，沿 par 回溯即可还原路径。</text>
    <text x="76" y="316" fill="#8f3b37">· 边权为正 ⇒ dist 沿 par 严格递减，回溯一定能到达起点 1。</text>
  </g>
</svg>
