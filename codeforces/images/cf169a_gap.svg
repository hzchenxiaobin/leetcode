<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="841"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="280" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">x 必须落在第 b 小与第 b+1 小之间</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">可行的整数个数 = 两个相邻值的差</text>
  <text x="90" y="120" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">排序后：</text>
  <g filter="url(#rough2)"><rect x="200" y="96" width="90" height="48" rx="4" fill="#dcecd2" fill-opacity="0.45" stroke="#446688" stroke-width="1.4"/></g>
  <text x="245" y="126" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="320" y="96" width="90" height="48" rx="4" fill="#dcecd2" fill-opacity="0.45" stroke="#446688" stroke-width="1.4"/></g>
  <text x="365" y="126" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="440" y="96" width="90" height="48" rx="4" fill="#dcecd2" fill-opacity="0.45" stroke="#446688" stroke-width="1.4"/></g>
  <text x="485" y="126" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="560" y="96" width="90" height="48" rx="4" fill="#cfe0f5" fill-opacity="0.45" stroke="#446688" stroke-width="1.4"/></g>
  <text x="605" y="126" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">6</text>
  <g filter="url(#rough2)"><rect x="680" y="96" width="90" height="48" rx="4" fill="#cfe0f5" fill-opacity="0.45" stroke="#446688" stroke-width="1.4"/></g>
  <text x="725" y="126" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">100</text>
  <text x="450" y="190" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">b = 3 ⇒ x ∈ [h[2], h[3]) = [3, 6) ⇒ x = 3,4,5</text>
  <text x="450" y="224" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 = h[3] − h[2] = 3</text>
  <text x="450" y="258" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">若相邻值相等则区间为空 ⇒ 0</text>
</svg>
