<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="509"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="440" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">198C：行星绕恒星转，飞船绕开半径 r 的禁区去拦截</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <circle cx="360.0" cy="240.0" r="70.0" fill="#fde8e8" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="360.0" y="244.0" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">禁区 r</text>
  <circle cx="360.0" cy="240.0" r="150.0" fill="none" stroke="#999999" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="360.0" cy="240.0" r="3.0" fill="#2b2b2b" stroke="#2b2b2b" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="368.0" y="234.0" text-anchor="start" font-size="10" fill="#555" filter="url(#rough2)">恒星</text>
  <circle cx="510.0" cy="220.0" r="10.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="525.0" y="214.0" text-anchor="start" font-size="10.5" fill="#8a6015" font-weight="bold" filter="url(#rough2)">行星 P(t)</text>
  <circle cx="160.0" cy="300.0" r="9.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="160.0" y="330.0" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">飞船</text>
  <path d="M 160 300 L 320 184 A 70 70 0 0 1 390 177 L 510 220" fill="#4a7a3a" stroke="1.8" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="60.0" y="356.0" width="620.0" height="56.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="74.0" y="379.3" text-anchor="start" font-size="11.3" fill="#3f3420" filter="url(#rough2)">若直线段穿过禁区：路径 = 切线 + 圆弧 + 切线（两侧取小）</text>
  <text x="74.0" y="403.3" text-anchor="start" font-size="11.3" fill="#3f3420" filter="url(#rough2)">二分时间 t：避障距离 ≤ v·t 即可（v ≥ v_p 保证单调）</text>
</svg>
