<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="300" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例走查：0°,90°,135° → 最大空隙 225°</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">答案 360-225 = 135°</text>
  <g filter="url(#rough2)"><rect x="140" y="120" width="600" height="30" rx="3" fill="#eeeeee" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.2"/></g>
  <line x1="140" y1="110" x2="140" y2="160" stroke="#b05a5a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="140" y="178" text-anchor="middle" font-size="11.5" fill="#b05a5a" filter="url(#rough2)">0°</text>
  <line x1="290" y1="110" x2="290" y2="160" stroke="#b05a5a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="290" y="178" text-anchor="middle" font-size="11.5" fill="#b05a5a" filter="url(#rough2)">90°</text>
  <line x1="365" y1="110" x2="365" y2="160" stroke="#b05a5a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="365" y="178" text-anchor="middle" font-size="11.5" fill="#b05a5a" filter="url(#rough2)">135°</text>
  <text x="440" y="230" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">三个点之间的相邻差：90、45、225（135→360+0）</text>
  <text x="440" y="262" text-anchor="middle" font-size="13" fill="#3d6b2f" filter="url(#rough2)">最大 225 → 覆盖角 135</text>
</svg>
