<svg xmlns="http://www.w3.org/2000/svg" width="840" height="372" viewBox="0 0 840 372"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="83"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="840" height="372" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">魔法子数组 = 极值相同 = 一段全等的连续元素</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">样例 2：[-2, -2, -2, 0, 1]</text>
  <g filter="url(#rough2)"><rect x="150" y="96" width="74" height="56" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#778899" stroke-width="1.4"/></g>
  <text x="187.0" y="132" text-anchor="middle" font-size="17" fill="#2b2b2b" filter="url(#rough2)">-2</text>
  <text x="187.0" y="88" text-anchor="middle" font-size="11" fill="#777777" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="224" y="96" width="74" height="56" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#778899" stroke-width="1.4"/></g>
  <text x="261.0" y="132" text-anchor="middle" font-size="17" fill="#2b2b2b" filter="url(#rough2)">-2</text>
  <text x="261.0" y="88" text-anchor="middle" font-size="11" fill="#777777" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="298" y="96" width="74" height="56" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#778899" stroke-width="1.4"/></g>
  <text x="335.0" y="132" text-anchor="middle" font-size="17" fill="#2b2b2b" filter="url(#rough2)">-2</text>
  <text x="335.0" y="88" text-anchor="middle" font-size="11" fill="#777777" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="372" y="96" width="74" height="56" rx="4" fill="#cfe0f5" fill-opacity="0.85" stroke="#778899" stroke-width="1.4"/></g>
  <text x="409.0" y="132" text-anchor="middle" font-size="17" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="409.0" y="88" text-anchor="middle" font-size="11" fill="#777777" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><rect x="446" y="96" width="74" height="56" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#778899" stroke-width="1.4"/></g>
  <text x="483.0" y="132" text-anchor="middle" font-size="17" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="483.0" y="88" text-anchor="middle" font-size="11" fill="#777777" filter="url(#rough2)">5</text>
  <g filter="url(#rough2)"><line x1="152" y1="166" x2="370" y2="166" stroke="#3d6b2f" stroke-width="3"/></g>
  <text x="261.0" y="188" text-anchor="middle" font-size="11.5" fill="#3d6b2f" font-weight="bold" filter="url(#rough2)">长度 3 的段</text>
  <g filter="url(#rough2)"><line x1="374" y1="166" x2="444" y2="166" stroke="#2f4a66" stroke-width="3"/></g>
  <text x="409.0" y="188" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">长度 1</text>
  <g filter="url(#rough2)"><line x1="448" y1="166" x2="518" y2="166" stroke="#8a6a2f" stroke-width="3"/></g>
  <text x="483.0" y="188" text-anchor="middle" font-size="11.5" fill="#8a6a2f" filter="url(#rough2)">长度 1</text>
  <text x="420" y="206" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">每个长度 L 的全等段贡献 L(L+1)/2 个魔法子数组（任意起点终点都在段内且极值相同）</text>
  <text x="420" y="236" text-anchor="middle" font-size="15" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">3·4/2 = 6　+　1　+　1　=　8</text>
  <g filter="url(#rough2)"><rect x="160" y="262" width="520" height="54" rx="4" fill="#ffffff" fill-opacity="0.0" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="5 4"/></g>
  <text x="420" y="284" text-anchor="middle" font-size="12" fill="#3d6b2f" filter="url(#rough2)">极值相同 ⇔ 子数组所有元素相同 ⇔ 它完全落在某一个全等段里</text>
  <text x="420" y="304" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">因此答案只依赖每一段的长度，与元素具体数值无关</text>
</svg>
