<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="900" height="430" fill="#fafafa"/>

  <text x="450" y="30" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">样例组 1 走查：a = (1, -1, 1, -1)，位置 2 的历史随时间变成一条序列</text>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="40" y="54" width="756" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="40" y="94" width="756" height="34" rx="6" fill="#ffffff" stroke="#cccccc" stroke-width="1.2"/>
    <rect x="40" y="134" width="756" height="34" rx="6" fill="#ffffff" stroke="#cccccc" stroke-width="1.2"/>
    <rect x="40" y="174" width="756" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="40" y="214" width="756" height="34" rx="6" fill="#ffffff" stroke="#cccccc" stroke-width="1.2"/>
    <rect x="40" y="254" width="756" height="34" rx="6" fill="#ffffff" stroke="#cccccc" stroke-width="1.2"/>
    <rect x="40" y="294" width="756" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>

  <text x="86" y="76" text-anchor="middle" font-size="12.5" fill="#33506b" filter="url(#rough2)">操作 i</text>
  <text x="150" y="76" text-anchor="middle" font-size="12.5" fill="#33506b" filter="url(#rough2)">类型</text>
  <text x="262" y="76" text-anchor="middle" font-size="12.5" fill="#33506b" filter="url(#rough2)">解码后</text>
  <text x="404" y="76" text-anchor="middle" font-size="12.5" fill="#33506b" filter="url(#rough2)">版本 i 中 p=2 的值</text>
  <text x="608" y="76" text-anchor="middle" font-size="12.5" fill="#33506b" filter="url(#rough2)">位置 2 的历史</text>
  <text x="770" y="76" text-anchor="middle" font-size="12.5" fill="#33506b" filter="url(#rough2)">答案</text>

  <g font-size="12.5" fill="#444" filter="url(#rough2)">
    <text x="86" y="116" text-anchor="middle">1</text>
    <text x="150" y="116" text-anchor="middle">4</text>
    <text x="262" y="116" text-anchor="middle">p = 2</text>
    <text x="404" y="116" text-anchor="middle">-1</text>
    <text x="608" y="116" text-anchor="middle">[-1]</text>
    <text x="770" y="116" text-anchor="middle">-1</text>

    <text x="86" y="156" text-anchor="middle">2</text>
    <text x="150" y="156" text-anchor="middle">2</text>
    <text x="262" y="156" text-anchor="middle">区间 [1, 3] 取反</text>
    <text x="404" y="156" text-anchor="middle">1</text>
    <text x="608" y="156" text-anchor="middle">[-1, -1]</text>
    <text x="770" y="156" text-anchor="middle">—</text>

    <text x="86" y="196" text-anchor="middle">3</text>
    <text x="150" y="196" text-anchor="middle">4</text>
    <text x="262" y="196" text-anchor="middle">p = 2</text>
    <text x="404" y="196" text-anchor="middle">1</text>
    <text x="608" y="196" text-anchor="middle">[-1, -1, 1]</text>
    <text x="770" y="196" text-anchor="middle" fill="#8a6420">1</text>

    <text x="86" y="236" text-anchor="middle">4</text>
    <text x="150" y="236" text-anchor="middle">3</text>
    <text x="262" y="236" text-anchor="middle">区间 [2, 3] 与 0 取 max</text>
    <text x="404" y="236" text-anchor="middle">1</text>
    <text x="608" y="236" text-anchor="middle">[-1, -1, 1, 1]</text>
    <text x="770" y="236" text-anchor="middle">—</text>

    <text x="86" y="276" text-anchor="middle">5</text>
    <text x="150" y="276" text-anchor="middle">1</text>
    <text x="262" y="276" text-anchor="middle">区间 [2, 4] 赋值 -1</text>
    <text x="404" y="276" text-anchor="middle">-1</text>
    <text x="608" y="276" text-anchor="middle">[-1, -1, 1, 1, 1]</text>
    <text x="770" y="276" text-anchor="middle">—</text>

    <text x="86" y="316" text-anchor="middle">6</text>
    <text x="150" y="316" text-anchor="middle">4</text>
    <text x="262" y="316" text-anchor="middle">p = 2</text>
    <text x="404" y="316" text-anchor="middle">1</text>
    <text x="608" y="316" text-anchor="middle">[-1, -1, 1, 1, 1, -1]</text>
    <text x="770" y="316" text-anchor="middle" fill="#3f6633">3</text>
  </g>

  <!-- 强调连续三个 1 -->
  <path d="M572,330 L572,346 L668,346 L668,330" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="620" y="368" text-anchor="middle" font-size="12.5" fill="#3f6633" filter="url(#rough2)">三个 1 连成一段 ⇒ 3</text>

  <text x="40" y="392" font-size="12.5" fill="#666" filter="url(#rough2)">注意：类型 4 也会产生一个新版本（数组不变），所以它同样要让历史序列多一个元素</text>
  <text x="40" y="414" font-size="12.5" fill="#666" filter="url(#rough2)">lastans 更新为「答案 mod 2⁶⁴」（负答案按补码解释），下一次解码要用它异或坐标</text>
</svg>
