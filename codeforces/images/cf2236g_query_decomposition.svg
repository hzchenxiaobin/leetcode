<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 0 L 5 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG3" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 0 L 5 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="760" height="430" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">查询拆分：上升段 U、下降段 D 与过 l 的交叉段</text>

  <!-- 虚线框：U 与 D -->
  <rect x="135" y="110" width="205" height="180" rx="10" fill="#e8f0fe" fill-opacity="0.45"
        stroke="#446688" stroke-width="1.5" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <rect x="415" y="110" width="205" height="180" rx="10" fill="#e6f4ea" fill-opacity="0.45"
        stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="7 5" filter="url(#rough2)"/>

  <!-- 树边 -->
  <line x1="365" y1="98" x2="315" y2="128" stroke="#446688" stroke-width="2.4" filter="url(#rough2)"/>
  <line x1="295" y1="158" x2="245" y2="183" stroke="#446688" stroke-width="2.4" filter="url(#rough2)"/>
  <line x1="225" y1="213" x2="175" y2="238" stroke="#446688" stroke-width="2.4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <line x1="395" y1="98" x2="445" y2="128" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <line x1="465" y1="158" x2="515" y2="183" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <line x1="535" y1="213" x2="585" y2="238" stroke="#4a7a3a" stroke-width="2.4" marker-end="url(#arrG3)" filter="url(#rough2)"/>

  <circle cx="380" cy="80" r="22" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <circle cx="305" cy="140" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <circle cx="235" cy="195" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <circle cx="165" cy="250" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <circle cx="455" cy="140" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <circle cx="525" cy="195" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <circle cx="595" cy="250" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>

  <text x="380" y="86" text-anchor="middle" font-size="14" fill="#a14340" filter="url(#rough2)">l</text>
  <text x="305" y="146" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">z2</text>
  <text x="235" y="201" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">z1</text>
  <text x="165" y="256" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">x</text>
  <text x="455" y="146" text-anchor="middle" font-size="11" fill="#3c5e2e" filter="url(#rough2)">w2</text>
  <text x="525" y="201" text-anchor="middle" font-size="11" fill="#3c5e2e" filter="url(#rough2)">w1</text>
  <text x="595" y="256" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">y</text>

  <text x="237" y="312" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">上升段 U：x → … → l（反向即 l→x）</text>
  <text x="517" y="312" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">下降段 D：l → … → y</text>

  <text x="120" y="140" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">其余子树</text>
  <text x="120" y="156" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">省略</text>

  <!-- 公式框 -->
  <rect x="55" y="330" width="650" height="86" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="74" y="356" text-anchor="start" font-size="13" fill="#8a6015" filter="url(#rough2)">ans = A_U + A_D − 1 + cross</text>
  <text x="74" y="380" text-anchor="start" font-size="11.5" fill="#8a6015" filter="url(#rough2)">cross = #{(i,j)：i ≥ 1，j ≥ 1，OR_x(i) &amp; OR_y(j) = 0}，i、j 只需枚举到冲突为止（≤ 20）</text>
  <text x="74" y="402" text-anchor="start" font-size="11.5" fill="#8a6015" filter="url(#rough2)">A_U、A_D 由根链前缀和 S 差分得到，再对 l 下方前 ≤ 20 个非零点的区间做修正</text>
</svg>
