<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">官方 4 组样例走查：只数「前 k 位里的 L」和「后 k 位里的 R」</text>

  <!-- 表头 -->
  <rect x="20"  y="52" width="62"  height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="51"  y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">用例</text>
  <rect x="82"  y="52" width="96"  height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="130" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">n, k</text>
  <rect x="178" y="52" width="200" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="278" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">s</text>
  <rect x="378" y="52" width="104" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="430" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">前 k 位 L 数</text>
  <rect x="482" y="52" width="104" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="534" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">后 k 位 R 数</text>
  <rect x="586" y="52" width="114" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="643" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">答案</text>

  <!-- 行 1 -->
  <rect x="20"  y="96"  width="62"  height="46" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="51"  y="125" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="82"  y="96"  width="96"  height="46" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="130" y="125" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3, 1</text>
  <rect x="178" y="96"  width="200" height="46" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="278" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">LLL</text>
  <rect x="378" y="96"  width="104" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="430" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#a14340" filter="url(#rough2)">1</text>
  <rect x="482" y="96"  width="104" height="46" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="534" y="125" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="586" y="96"  width="114" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="643" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">1</text>

  <!-- 行 2 -->
  <rect x="20"  y="142" width="62"  height="46" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="51"  y="171" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="82"  y="142" width="96"  height="46" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="130" y="171" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4, 3</text>
  <rect x="178" y="142" width="200" height="46" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="278" y="171" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">LRLR</text>
  <rect x="378" y="142" width="104" height="46" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="430" y="171" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">—</text>
  <rect x="482" y="142" width="104" height="46" rx="4" fill="#f5f5f5" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="534" y="171" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">—</text>
  <rect x="586" y="142" width="114" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="643" y="171" text-anchor="middle" font-size="14" font-weight="bold" fill="#a14340" filter="url(#rough2)">−1</text>

  <!-- 行 3 -->
  <rect x="20"  y="188" width="62"  height="46" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="51"  y="217" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="82"  y="188" width="96"  height="46" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="130" y="217" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6, 2</text>
  <rect x="178" y="188" width="200" height="46" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="278" y="217" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">RLLRRL</text>
  <rect x="378" y="188" width="104" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="430" y="217" text-anchor="middle" font-size="14" font-weight="bold" fill="#a14340" filter="url(#rough2)">1</text>
  <rect x="482" y="188" width="104" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="534" y="217" text-anchor="middle" font-size="14" font-weight="bold" fill="#a14340" filter="url(#rough2)">1</text>
  <rect x="586" y="188" width="114" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="643" y="217" text-anchor="middle" font-size="14" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">2</text>

  <!-- 行 4 -->
  <rect x="20"  y="234" width="62"  height="46" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="51"  y="263" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="82"  y="234" width="96"  height="46" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="130" y="263" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">12, 4</text>
  <rect x="178" y="234" width="200" height="46" rx="4" fill="#fafafa" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="278" y="263" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">LRLLRRLRLRLR</text>
  <rect x="378" y="234" width="104" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="430" y="263" text-anchor="middle" font-size="14" font-weight="bold" fill="#a14340" filter="url(#rough2)">3</text>
  <rect x="482" y="234" width="104" height="46" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="534" y="263" text-anchor="middle" font-size="14" font-weight="bold" fill="#a14340" filter="url(#rough2)">2</text>
  <rect x="586" y="234" width="114" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="643" y="263" text-anchor="middle" font-size="14" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">5</text>

  <rect x="40" y="296" width="640" height="114" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="320" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">第 2 组无解：2k = 6 &gt; n = 4，位置 2 被前 3 位要求「是 R」、又被后 3 位要求「是 L」，矛盾</text>
  <text x="360" y="344" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">第 1 组：前 1 位 LLL 中的 L → 翻 1 次；后 1 位本就是 L → 0 次；合计 1，中间 1 位不动</text>
  <text x="360" y="368" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">第 3 组：前 2 位 R L → 1 次；后 2 位 R L → 1 次；合计 2（题解的翻转位置正是 2 与 5）</text>
  <text x="360" y="392" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">第 4 组：前 4 位 L R L L → 3 次；后 4 位 L R L R → 2 次；合计 5，中间 4 位零代价</text>
</svg>
