<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="251" />
      <feDisplacementMap in="SourceGraphic" scale="1.5" />
    </filter>
  </defs>

  <rect width="760" height="430" fill="#fafafa" />

  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按苹果升序排序，先试奇数位（1,3,5,…）</text>
  <path d="M 120 44 Q 380 50 640 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)" />

  <text x="40" y="80" font-size="11.5" fill="#555" filter="url(#rough2)">N = 3，2N−1 = 5 个箱子（括号内为苹果、橙子）：</text>

  
  <g>
    <rect x="40" y="96" width="112" height="104" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" />
    <rect x="180" y="96" width="112" height="104" rx="9" fill="#f0f0f0" stroke="#999" stroke-width="1.3" filter="url(#rough2)" />
    <rect x="320" y="96" width="112" height="104" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" />
    <rect x="460" y="96" width="112" height="104" rx="9" fill="#f0f0f0" stroke="#999" stroke-width="1.3" filter="url(#rough2)" />
    <rect x="600" y="96" width="112" height="104" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" />
  </g>
  <text x="96" y="122" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">位置 1</text>
  <text x="236" y="122" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">位置 2</text>
  <text x="376" y="122" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">位置 3</text>
  <text x="516" y="122" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">位置 4</text>
  <text x="656" y="122" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">位置 5</text>

  <text x="96" y="154" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">(1, 9)</text>
  <text x="236" y="154" text-anchor="middle" font-size="13" font-weight="bold" fill="#555" filter="url(#rough2)">(3, 2)</text>
  <text x="376" y="154" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">(4, 7)</text>
  <text x="516" y="154" text-anchor="middle" font-size="13" font-weight="bold" fill="#555" filter="url(#rough2)">(6, 1)</text>
  <text x="656" y="154" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">(9, 8)</text>

  <text x="96" y="180" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">苹果 1</text>
  <text x="236" y="180" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">苹果 3</text>
  <text x="376" y="180" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">苹果 4</text>
  <text x="516" y="180" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">苹果 6</text>
  <text x="656" y="180" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">苹果 9</text>

  
  <rect x="40" y="220" width="340" height="76" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)" />
  <text x="58" y="246" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">奇数位（蓝）：苹果 1+4+9 = 14，橙子 9+7+8 = 24</text>
  <text x="58" y="270" font-size="11" fill="#2f4a66" filter="url(#rough2)">总数：苹果 23，橙子 27；一半分别是 11.5 与 13.5</text>
  <text x="58" y="288" font-size="11" fill="#2f4a66" filter="url(#rough2)">苹果 14 ≥ 11.5，橙子 24 ≥ 13.5 → 直接选这组</text>

  <rect x="400" y="220" width="320" height="76" rx="9" fill="#f0f0f0" stroke="#999" stroke-width="1.3" filter="url(#rough2)" />
  <text x="418" y="246" font-size="11.5" font-weight="bold" fill="#555" filter="url(#rough2)">偶数位（灰）：只有 N−1 = 2 个</text>
  <text x="418" y="270" font-size="11" fill="#555" filter="url(#rough2)">苹果 3+6 = 9，橙子 2+1 = 3</text>
  <text x="418" y="288" font-size="11" fill="#555" filter="url(#rough2)">若奇数位橙子不够，再用它们加最后一个</text>

  
  <rect x="40" y="312" width="680" height="92" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)" />
  <text x="60" y="338" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">为什么奇数位的苹果一定不少于一半？</text>
  <text x="60" y="362" font-size="12" fill="#7a5a1b" filter="url(#rough2)">奇数苹果 − 偶数苹果 = a1 + (a3 − a2) + (a5 − a4) + … ≥ 0（排序后每个括号都 ≥ 0）。</text>
  <text x="60" y="386" font-size="12" fill="#7a5a1b" filter="url(#rough2)">所以奇数位苹果 ≥ 偶数位苹果，也就 ≥ 总苹果的一半；橙子够就直接赢。</text>
</svg>