<svg xmlns="http://www.w3.org/2000/svg" width="780" height="380" viewBox="0 0 780 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="780" height="380" fill="#fafafa"/>
  <text x="390.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">dp[i][k][L][R]：把 [L,R] 这些初始燕麦尽量多地送到 (i,k)</text>
  <path d="M 124.82000000000014 46 Q 390.0 52 655.1799999999998 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60.0" y="70.0" width="340.0" height="110.0" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="76.0" y="96.0" text-anchor="start" font-size="11.8" font-weight="bold" fill="#446688" filter="url(#rough2)">状态</text>
  <text x="76.0" y="122.0" text-anchor="start" font-size="11.2" fill="#2b2b2b" filter="url(#rough2)">i 行、k 号秤、来源区间 [L,R]</text>
  <text x="76.0" y="146.0" text-anchor="start" font-size="11.2" fill="#2b2b2b" filter="url(#rough2)">值 = 能送达的最大质量</text>
  <text x="76.0" y="168.0" text-anchor="start" font-size="10.8" fill="#6b6b6b" filter="url(#rough2)">（区间内没破的秤贡献 0）</text>
  <rect x="430.0" y="70.0" width="300.0" height="110.0" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="446.0" y="96.0" text-anchor="start" font-size="11.8" font-weight="bold" fill="#2f5b34" filter="url(#rough2)">转移</text>
  <text x="446.0" y="122.0" text-anchor="start" font-size="11.2" fill="#2b2b2b" filter="url(#rough2)">父 (i−1,k) 拿 [L,M]</text>
  <text x="446.0" y="144.0" text-anchor="start" font-size="11.2" fill="#2b2b2b" filter="url(#rough2)">父 (i−1,k+1) 拿 [M+1,R]</text>
  <text x="446.0" y="166.0" text-anchor="start" font-size="10.8" fill="#6b6b6b" filter="url(#rough2)">各自满足质量 ≥ w 才计入</text>
  <rect x="60.0" y="200.0" width="670.0" height="62.0" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="224.0" text-anchor="start" font-size="11.1" fill="#8a6015" filter="url(#rough2)">为什么可以只用区间：同一行里每个秤的来源集合按左右顺序排列，边界由上一行的分流点决定；</text>
  <text x="74.0" y="246.0" text-anchor="start" font-size="11.1" fill="#8a6015" filter="url(#rough2)">区间内部某个秤没破，就等于它那部分“消失”，用 0 质量表示即可。</text>
  <rect x="60.0" y="280.0" width="580.0" height="28.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="68.0" y="301.0" text-anchor="start" font-size="10.8" font-weight="bold" fill="#26405c" filter="url(#rough2)">样例 2</text>
  <text x="178.0" y="301.0" text-anchor="start" font-size="10.8" font-weight="bold" fill="#26405c" filter="url(#rough2)">row0 质量 [2,2]，w=[1,2]</text>
  <path d="M 60.0 280.0 L 640.0 280.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="68.0" y="329.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)"></text>
  <text x="178.0" y="329.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">两个秤都破 ⇒ 第 2 行唯一秤得 4 ≥ 4</text>
  <path d="M 60.0 308.0 L 640.0 308.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="68.0" y="357.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)"></text>
  <text x="178.0" y="357.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">输出 Cerealguy</text>
  <path d="M 60.0 336.0 L 640.0 336.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
</svg>
