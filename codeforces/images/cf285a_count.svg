<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="323"/>
    <feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></defs>
  <rect width="700" height="300" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">为什么一定能构造出来（0 ≤ k &lt; n）</text>
  <path d="M 170 40 Q 350 46 530 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="60" width="580" height="58" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="84" font-size="13" fill="#22314a" filter="url(#rough2)">下降数可从 0（递增）连续调到 n−1（递减）：每次把一个相邻的"升"翻成"降"。</text>
  <text x="76" y="106" font-size="12" fill="#2f4a66" filter="url(#rough2)">所以区间 [0, n−1] 内每个 k 都有解 —— 题面也保证"it is guaranteed that…"。</text>
  <g filter="url(#rough2)"><rect x="60" y="130" width="580" height="58" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="154" font-size="13" fill="#2f5223" filter="url(#rough2)">本构造只用"一段降序"就实现任意 k，不需要更复杂的交换。</text>
  <text x="76" y="176" font-size="12" fill="#3c5e2e" filter="url(#rough2)">输出格式：n 个空格分隔的整数，行末可有空格。</text>
  <g filter="url(#rough2)"><rect x="60" y="200" width="580" height="70" rx="8" fill="#fbeeee" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="76" y="224" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">易错：k=n−1 时 n−k−1 = 0，第一段为空；k=0 时第二段从 n 到 n+1 为空。</text>
  <text x="76" y="248" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">循环边界写成 1..n−k−1 与 n..(n−k) 即可，注意 k=0 时上界是 n+1（空）。</text>
</svg>
