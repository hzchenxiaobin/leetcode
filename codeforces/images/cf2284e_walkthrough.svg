<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough1">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
  </defs>

  <rect width="700" height="400" fill="#fafafa"/>

  <text x="350" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">
    官方样例 1 走查：n=4，G = {(1,2), (3,4)}，隐藏边 (1,3)、(1,4)
  </text>

  <!-- header -->
  <text x="58" y="78" font-size="14" fill="#2f4f6f" filter="url(#rough2)">步骤</text>
  <text x="180" y="78" font-size="14" fill="#2f4f6f" filter="url(#rough2)">询问</text>
  <text x="430" y="78" text-anchor="middle" font-size="14" fill="#2f4f6f" filter="url(#rough2)">回答</text>
  <text x="472" y="78" font-size="14" fill="#2f4f6f" filter="url(#rough2)">读数</text>
  <line x1="44" y1="90" x2="656" y2="90" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- row 1 -->
  <text x="58" y="118" font-size="13" fill="#555" filter="url(#rough2)">① j=2</text>
  <text x="180" y="118" font-size="13" fill="#333" filter="url(#rough2)">? 1 2 1 2</text>
  <text x="430" y="118" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="472" y="118" font-size="13" fill="#555" filter="url(#rough2)">前缀 {1,2} 里没有奇圈</text>

  <!-- row 2 -->
  <line x1="44" y1="130" x2="656" y2="130" stroke="#dddddd" stroke-width="1" stroke-dasharray="5 5" filter="url(#rough2)"/>
  <text x="58" y="158" font-size="13" fill="#555" filter="url(#rough2)">① j=3</text>
  <text x="180" y="158" font-size="13" fill="#333" filter="url(#rough2)">? 1 3 1 2 3</text>
  <text x="430" y="158" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="472" y="158" font-size="13" fill="#555" filter="url(#rough2)">还缺 4 ⇒ P = 4，x = B[3] = 4</text>

  <!-- row 3 -->
  <line x1="44" y1="170" x2="656" y2="170" stroke="#dddddd" stroke-width="1" stroke-dasharray="5 5" filter="url(#rough2)"/>
  <text x="58" y="198" font-size="13" fill="#555" filter="url(#rough2)">② 删 {3}</text>
  <text x="180" y="198" font-size="13" fill="#333" filter="url(#rough2)">? 1 3 1 2 4</text>
  <text x="430" y="198" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="472" y="198" font-size="13" fill="#555" filter="url(#rough2)">a₂ 被删掉 ⇒ a₂ = 3</text>

  <!-- row 4 -->
  <line x1="44" y1="210" x2="656" y2="210" stroke="#dddddd" stroke-width="1" stroke-dasharray="5 5" filter="url(#rough2)"/>
  <text x="58" y="238" font-size="13" fill="#555" filter="url(#rough2)">③ A∪{1}</text>
  <text x="180" y="238" font-size="13" fill="#333" filter="url(#rough2)">? 1 3 1 3 4</text>
  <text x="430" y="238" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="472" y="238" font-size="13" fill="#555" filter="url(#rough2)">首次非二分 ⇒ b = 1</text>

  <!-- row 5 -->
  <line x1="44" y1="250" x2="656" y2="250" stroke="#dddddd" stroke-width="1" stroke-dasharray="5 5" filter="url(#rough2)"/>
  <text x="58" y="278" font-size="13" fill="#555" filter="url(#rough2)">④ 点查</text>
  <text x="180" y="278" font-size="13" fill="#333" filter="url(#rough2)">? 2 4 1</text>
  <text x="430" y="278" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="472" y="278" font-size="13" fill="#555" filter="url(#rough2)">(4,1) 就是隐藏边 ⇒ 报 ! 4 1</text>
  <line x1="44" y1="290" x2="656" y2="290" stroke="#dddddd" stroke-width="1" stroke-dasharray="5 5" filter="url(#rough2)"/>

  <!-- note -->
  <rect x="44" y="312" width="612" height="66" rx="10" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.6" filter="url(#rough1)"/>
  <text x="350" y="338" text-anchor="middle" font-size="13" fill="#2f4f6f" filter="url(#rough2)">
    B = (1,2,3,4)；四个端点位置最大者是 4 ⇒ A = {3,4}，a₂ = 3，W = {1,2} 里只有 1 是端点
  </text>
  <text x="350" y="364" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    共 5 次询问；同样的流程在 n = 2000 时也只用到 32 次左右
  </text>
</svg>
