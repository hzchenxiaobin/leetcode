<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="720" height="280" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2 走查：三种颜色各有 2 个邻居颜色，并列时取最小</text>
  <rect x="60" y="54" width="120" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="120" y="75" text-anchor="middle" font-size="12" fill="#2f4a66">颜色 2</text>
  <rect x="210" y="54" width="220" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="320" y="75" text-anchor="middle" font-size="12" fill="#2f5223">{4,5}</text>
  <rect x="460" y="54" width="100" height="34" rx="8" fill="#fde9d9" stroke="#b4652a" stroke-width="1.5"/>
  <text x="510" y="75" text-anchor="middle" font-size="12" fill="#7a4b22">2</text>
  <rect x="60" y="98" width="120" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="120" y="119" text-anchor="middle" font-size="12" fill="#2f4a66">颜色 4</text>
  <rect x="210" y="98" width="220" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="320" y="119" text-anchor="middle" font-size="12" fill="#2f5223">{2,5}</text>
  <rect x="460" y="98" width="100" height="34" rx="8" fill="#fde9d9" stroke="#b4652a" stroke-width="1.5"/>
  <text x="510" y="119" text-anchor="middle" font-size="12" fill="#7a4b22">2</text>
  <rect x="60" y="142" width="120" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="120" y="163" text-anchor="middle" font-size="12" fill="#2f4a66">颜色 5</text>
  <rect x="210" y="142" width="220" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="320" y="163" text-anchor="middle" font-size="12" fill="#2f5223">{2,4}</text>
  <rect x="460" y="142" width="100" height="34" rx="8" fill="#fde9d9" stroke="#b4652a" stroke-width="1.5"/>
  <text x="510" y="163" text-anchor="middle" font-size="12" fill="#7a4b22">2</text>
  <text x="60" y="240" text-anchor="start" font-size="12" fill="#7a4b22" filter="url(#rough2)">全部并列 → 输出最小颜色 2</text>
