<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" viewBox="0 0 860 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="75"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="860" height="470" fill="#fafafa"/>

  <text x="430" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每次购买后的处理：入包 → 查配方 → 能合成就立刻合</text>

  <g filter="url(#rough2)">
    <rect x="330" y="52" width="200" height="46" rx="10" fill="#cfe0f5" stroke="#446688" stroke-width="1.6"/>
    <text x="430" y="80" text-anchor="middle" font-size="12" fill="#2f4a66">读入一次购买（成员 x，name）</text>

    <path d="M 430 98 L 430 118" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>

    <rect x="330" y="120" width="200" height="46" rx="10" fill="#eef2f6" stroke="#446688" stroke-width="1.6"/>
    <text x="430" y="141" text-anchor="middle" font-size="12" fill="#2f4a66">背包[name] += 1</text>
    <text x="430" y="158" text-anchor="middle" font-size="10.5" fill="#446688">材料只可能是基础神器</text>

    <path d="M 430 166 L 430 190" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>

    <path d="M 430 192 L 540 234 L 430 276 L 320 234 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="430" y="230" text-anchor="middle" font-size="11.5" fill="#8a6015">有齐备的配方？</text>
    <text x="430" y="248" text-anchor="middle" font-size="10" fill="#9a7020">逐条核对材料数量</text>
  </g>

  <!-- 是：合成 -->
  <g filter="url(#rough2)">
    <path d="M 540 234 L 596 234" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)"/>
    <text x="566" y="224" font-size="11" fill="#2f5223">是</text>
    <rect x="600" y="204" width="230" height="58" rx="10" fill="#eef6e8" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="715" y="226" text-anchor="middle" font-size="11.5" fill="#2f5223">扣除全部材料，背包[成品] += 1</text>
    <text x="715" y="246" text-anchor="middle" font-size="10" fill="#2f5223">材料只减不增 ⇒ 不触发新配方</text>
  </g>

  <!-- 合成后回到判定 -->
  <g filter="url(#rough2)">
    <path d="M 715 262 L 715 300 L 430 300 L 430 278" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)"/>
    <text x="500" y="318" font-size="10.5" fill="#2f5223">合成后重新扫描（只会再扫到一次）</text>
  </g>

  <!-- 否：结束 -->
  <g filter="url(#rough2)">
    <path d="M 320 234 L 264 234" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)"/>
    <text x="286" y="224" font-size="11" fill="#8a2b28">否</text>
    <rect x="50" y="208" width="210" height="52" rx="10" fill="#eeeeee" stroke="#888888" stroke-width="1.6"/>
    <text x="155" y="232" text-anchor="middle" font-size="12" fill="#555555">本次购买结束</text>
    <text x="155" y="250" text-anchor="middle" font-size="10" fill="#777777">继续处理下一条记录</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="50" y="340" width="760" height="116" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="66" y="364" font-size="11.5" fill="#8a6015">样例一第 3 步：1 号背包 {desolator:1, refresher:1}，vanguard 需要 desolator 1 + refresher 1，齐备 →</text>
    <text x="66" y="386" font-size="11.5" fill="#8a6015">扣掉两种材料、加入 vanguard:1，背包里只剩 vanguard。</text>
    <text x="66" y="410" font-size="11.5" fill="#8a6015">第 5 步：2 号背包 {perseverance:2, desolator:1}，maelstorm 需要 perseverance 2，齐备 → 产出 maelstorm:1。</text>
    <text x="66" y="434" font-size="11" fill="#9a7020">若把合成推迟到所有购买之后，材料会被后续购买「占用」，背包就不对了。</text>
  </g>
</svg>
