<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="600" height="300" fill="#fafafa"/>

  <text x="300" y="40" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">末尾零的个数 = min(路径上因子 2 个数, 因子 5 个数)</text>

  <rect x="22" y="96" width="168" height="80" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="106" y="128" text-anchor="middle" font-size="13" fill="#2f4a63" filter="url(#rough2)">路径乘积 P</text>
  <text x="106" y="156" text-anchor="middle" font-size="12" fill="#2f4a63" filter="url(#rough2)">P = a₁ · a₂ · … · a₂ₙ₋₁</text>

  <path d="M192,136 L222,136" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="226" y="96" width="162" height="80" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="307" y="128" text-anchor="middle" font-size="13" fill="#7a5a12" filter="url(#rough2)">P = 2^e₂ · 5^e₅ · r</text>
  <text x="307" y="156" text-anchor="middle" font-size="12" fill="#7a5a12" filter="url(#rough2)">r 不含因子 2 和 5</text>

  <path d="M390,136 L420,136" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="424" y="96" width="154" height="80" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="501" y="128" text-anchor="middle" font-size="13" fill="#33552a" filter="url(#rough2)">末尾零个数</text>
  <text x="501" y="156" text-anchor="middle" font-size="13" fill="#33552a" filter="url(#rough2)">= min(e₂, e₅)</text>

  <rect x="40" y="206" width="520" height="66" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="300" y="232" text-anchor="middle" font-size="12" fill="#7a2f2c" filter="url(#rough2)">e₂ = Σ v₂(aᵢⱼ)，e₅ = Σ v₅(aᵢⱼ)，沿着同一条路径求和</text>
  <text x="300" y="256" text-anchor="middle" font-size="12" fill="#7a2f2c" filter="url(#rough2)">两个因子各自独立 ⇒ 分别做一次“最小路径和”DP，再取较小值</text>
</svg>
