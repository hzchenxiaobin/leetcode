<svg xmlns="http://www.w3.org/2000/svg" width="800" height="404" viewBox="0 0 800 404"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="800" height="404" fill="#fafafa"/>

  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按 k 的最高位 h 分组：c 的取值区间两两不交</text>
  <path d="M 86 43 Q 400 50 714 43" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="400" y="66" text-anchor="middle" font-size="12.5" fill="#66788c" filter="url(#rough2)">每个合法 c 唯一写成 c = 3·2^h + (r + 2t)，其中 r &lt; 2^(h-1)、r &amp; 2r = 0、t 是 r 的子掩码</text>

  <!-- c 轴 -->
  <path d="M 60 300 L 770 300" stroke="#8c9bab" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="742" y="318" font-size="12.5" fill="#66788c" filter="url(#rough2)">c</text>

  <!-- h = 0 : [3,4) -->
  <rect x="85" y="258" width="16" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="93" y="248" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">h=0</text>
  <text x="93" y="318" text-anchor="middle" font-size="11" fill="#3c5e2e" filter="url(#rough2)">3</text>
  <text x="93" y="334" text-anchor="middle" font-size="11" fill="#3c5e2e" filter="url(#rough2)">A=1</text>

  <!-- h = 1 : [6,9) -->
  <rect x="114" y="258" width="27" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="127" y="248" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">h=1</text>
  <text x="127" y="318" text-anchor="middle" font-size="11" fill="#3c5e2e" filter="url(#rough2)">6~9</text>
  <text x="127" y="334" text-anchor="middle" font-size="11" fill="#3c5e2e" filter="url(#rough2)">A=1</text>

  <!-- h = 2 : [12,18) -->
  <rect x="168" y="258" width="54" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="195" y="248" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">h=2</text>
  <text x="195" y="318" text-anchor="middle" font-size="11" fill="#3c5e2e" filter="url(#rough2)">12~18</text>
  <text x="195" y="334" text-anchor="middle" font-size="11" fill="#3c5e2e" filter="url(#rough2)">A=3</text>

  <!-- h = 3 : [24,36) 部分计入 -->
  <rect x="276" y="258" width="108" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="330" y="248" text-anchor="middle" font-size="11.5" fill="#8a6a1f" filter="url(#rough2)">h = h_max = 3</text>
  <text x="330" y="318" text-anchor="middle" font-size="11" fill="#8a6a1f" filter="url(#rough2)">24~36</text>
  <text x="330" y="334" text-anchor="middle" font-size="11" fill="#8a6a1f" filter="url(#rough2)">A=5，截到 B</text>
  <path d="M 330 252 L 330 300" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="338" y="294" font-size="11.5" fill="#b85450" filter="url(#rough2)">n</text>

  <!-- h = 4 及以后不贡献 -->
  <rect x="492" y="258" width="216" height="42" rx="4" fill="#eeeeee" stroke="#999999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="600" y="248" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">h=4：48~72（最小 c 已 &gt; n，整组不计）</text>
  <text x="600" y="318" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">A=11</text>

  <!-- 图例 -->
  <rect x="60" y="352" width="16" height="14" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="84" y="364" font-size="12" fill="#3c5e2e" filter="url(#rough2)">h &lt; h_max：整组计入（共 A_h 个）</text>
  <rect x="330" y="352" width="16" height="14" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="354" y="364" font-size="12" fill="#8a6a1f" filter="url(#rough2)">h = h_max：数位 DP 截到 B = n - 3·2^h</text>

  <text x="400" y="392" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">组内最大 c = 3·2^h + 3(2^(h-1) - 1) &lt; 4.5·2^h，而下一组从 6·2^h 起，故区间不重叠、h 由 c 唯一确定</text>
</svg>
