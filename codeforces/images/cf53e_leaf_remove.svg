<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430">
<defs>
  <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs>
<rect x="0" y="0" width="760" height="430" fill="#fafafa"/>
<text x="380.0" y="34" font-size="22" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="bold" text-anchor="middle" filter="url(#rough2)">把叶子集合 S 摘掉，剩下的是 V∖S 上的一棵生成树</text>
<line x1="220" y1="90" x2="300" y2="150" stroke="#666" stroke-width="2" filter="url(#rough2)"/>
<line x1="300" y1="250" x2="300" y2="150" stroke="#666" stroke-width="2" filter="url(#rough2)"/>
<line x1="300" y1="150" x2="480" y2="150" stroke="#666" stroke-width="2" filter="url(#rough2)"/>
<line x1="560" y1="90" x2="480" y2="150" stroke="#666" stroke-width="2" filter="url(#rough2)"/>
<line x1="560" y1="250" x2="480" y2="150" stroke="#666" stroke-width="2" filter="url(#rough2)"/>
<rect x="278" y="128" width="44" height="44" rx="20" fill="#e6f4ea" stroke="#777" stroke-width="2" filter="url(#rough2)"/>
<text x="300" y="156" font-size="16" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">4</text>
<rect x="458" y="128" width="44" height="44" rx="20" fill="#e6f4ea" stroke="#777" stroke-width="2" filter="url(#rough2)"/>
<text x="480" y="156" font-size="16" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">5</text>
<rect x="198" y="68" width="44" height="44" rx="20" fill="#fde8e8" stroke="#777" stroke-width="2" filter="url(#rough2)"/>
<text x="220" y="96" font-size="16" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">1</text>
<rect x="278" y="228" width="44" height="44" rx="20" fill="#fde8e8" stroke="#777" stroke-width="2" filter="url(#rough2)"/>
<text x="300" y="256" font-size="16" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">2</text>
<rect x="538" y="68" width="44" height="44" rx="20" fill="#fde8e8" stroke="#777" stroke-width="2" filter="url(#rough2)"/>
<text x="560" y="96" font-size="16" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">3</text>
<rect x="538" y="228" width="44" height="44" rx="20" fill="#e6f4ea" stroke="#777" stroke-width="2" filter="url(#rough2)"/>
<text x="560" y="256" font-size="16" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">6</text>
<text x="80" y="300" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#c0392b" font-weight="normal" text-anchor="start" filter="url(#rough2)">S = {1,2,3}（红）都是叶子；</text>
<text x="80" y="326" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="normal" text-anchor="start" filter="url(#rough2)">V∖S = {4,5,6}：内部树含边 4-5、5-6，τ = 1</text>
<text x="80" y="352" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#1a5fb4" font-weight="normal" text-anchor="start" filter="url(#rough2)">每个叶子各自选一个 V∖S 里的邻居：deg 乘积</text>
<text x="80" y="378" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#2e7d32" font-weight="normal" text-anchor="start" filter="url(#rough2)">g(S) = τ(G[V∖S]) × Π_{v∈S} deg_{V∖S}(v)</text>
</svg>
