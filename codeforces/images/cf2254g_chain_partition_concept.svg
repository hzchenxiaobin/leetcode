<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6" stroke-linecap="round" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="680" height="400" fill="#fafafa"/>

  <text x="340" y="24" text-anchor="middle" font-size="15.5" fill="#333" filter="url(#rough2)">每条链必须落在同一条根—叶路径上，叶子数 L 就是最少链数</text>

  <!-- edges -->
  <g fill="none" stroke-linecap="round" filter="url(#rough2)">
    <line x1="150" y1="64" x2="92" y2="136" stroke="#446688" stroke-width="3"/>
    <line x1="92" y1="136" x2="56" y2="206" stroke="#446688" stroke-width="3"/>
    <line x1="56" y1="206" x2="36" y2="276" stroke="#446688" stroke-width="3"/>
    <line x1="214" y1="136" x2="214" y2="206" stroke="#4a7a3a" stroke-width="3"/>
    <line x1="150" y1="64" x2="214" y2="136" stroke="#b0b0b0" stroke-width="1.4" stroke-dasharray="5,4"/>
    <line x1="214" y1="136" x2="168" y2="206" stroke="#c8a86a" stroke-width="1.6"/>
    <line x1="214" y1="136" x2="258" y2="206" stroke="#c8a86a" stroke-width="1.6"/>
    <line x1="214" y1="136" x2="302" y2="206" stroke="#c8a86a" stroke-width="1.6"/>
  </g>

  <!-- nodes: 蓝 = 含叶 5 的链, 绿 = 含叶 7 的链, 橙 = 单点链 -->
  <g filter="url(#rough2)">
    <circle cx="150" cy="64" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="2.6"/>
    <circle cx="92" cy="136" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="2.6"/>
    <circle cx="56" cy="206" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="2.6"/>
    <circle cx="36" cy="276" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="2.6"/>
    <circle cx="214" cy="136" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.6"/>
    <circle cx="214" cy="206" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.6"/>
    <circle cx="168" cy="206" r="19" fill="#fff8e1" stroke="#d6a040" stroke-width="2.6"/>
    <circle cx="258" cy="206" r="19" fill="#fff8e1" stroke="#d6a040" stroke-width="2.6"/>
    <circle cx="302" cy="206" r="19" fill="#fff8e1" stroke="#d6a040" stroke-width="2.6"/>
  </g>

  <g text-anchor="middle" filter="url(#rough2)">
    <text x="150" y="63" font-size="11.5" font-weight="bold" fill="#2a4660">1</text>
    <text x="150" y="76" font-size="9" fill="#2a4660">a=1</text>
    <text x="92" y="135" font-size="11.5" font-weight="bold" fill="#2a4660">2</text>
    <text x="92" y="148" font-size="9" fill="#2a4660">a=100</text>
    <text x="56" y="205" font-size="11.5" font-weight="bold" fill="#2a4660">4</text>
    <text x="56" y="218" font-size="9" fill="#2a4660">a=90</text>
    <text x="36" y="275" font-size="11.5" font-weight="bold" fill="#2a4660">5</text>
    <text x="36" y="288" font-size="9" fill="#2a4660">a=80</text>
    <text x="214" y="135" font-size="11.5" font-weight="bold" fill="#2f5424">3</text>
    <text x="214" y="148" font-size="9" fill="#2f5424">a=1</text>
    <text x="214" y="205" font-size="11.5" font-weight="bold" fill="#2f5424">7</text>
    <text x="214" y="218" font-size="9" fill="#2f5424">a=2</text>
    <text x="168" y="205" font-size="11.5" font-weight="bold" fill="#a07420">6</text>
    <text x="168" y="218" font-size="9" fill="#a07420">a=1</text>
    <text x="258" y="205" font-size="11.5" font-weight="bold" fill="#a07420">8</text>
    <text x="258" y="218" font-size="9" fill="#a07420">a=3</text>
    <text x="302" y="205" font-size="11.5" font-weight="bold" fill="#a07420">9</text>
    <text x="302" y="218" font-size="9" fill="#a07420">a=4</text>
  </g>

  <!-- right annotations -->
  <g filter="url(#rough2)">
    <rect x="366" y="48" width="296" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="366" y="104" width="296" height="80" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="366" y="196" width="296" height="66" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="366" y="274" width="296" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <g font-size="11.5" fill="#333" filter="url(#rough2)">
    <text x="380" y="68">叶子 L = 5 ⇒ k &lt; 5 一律输出 -1（互不可比）</text>
    <text x="380" y="86" font-size="10.5" fill="#7a4a48">任意两片不同叶子互不为祖先</text>
    <text x="380" y="126">k = L 时每条链恰含 1 片叶子；</text>
    <text x="380" y="146">链的「最大值」必是该叶子的某个祖先。</text>
    <text x="380" y="166" fill="#2a4660">蓝链 max = 100（点 2），绿链 max = 2（点 7）</text>
    <text x="380" y="218">把任意一个「非最大值点」单独拆成一条链：</text>
    <text x="380" y="238">链数 +1、得分 +a_x —— 挖点不会破坏链。</text>
    <text x="380" y="256" font-size="10.5" fill="#3c6b30">这就是「增量」的全部来源</text>
    <text x="380" y="297" font-weight="bold">k = 5 得分 = 100+2+1+3+4 = 110</text>
    <text x="380" y="314" font-size="10.5" fill="#8a6a20">蓝 1 条 + 绿 1 条 + 橙 3 条 = 5 条 = L</text>
  </g>

  <text x="36" y="338" font-size="10.5" fill="#999" filter="url(#rough2)">粗线 = 链内部的父子边（同链相邻两点不一定是父子，可跳过中间点）</text>
  <text x="36" y="360" font-size="10.5" fill="#999" filter="url(#rough2)">灰虚线 = 分叉边：叶 5 与叶 6/7/8/9 互不可比，必须落在不同链里</text>
</svg>
