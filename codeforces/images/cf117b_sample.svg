<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="117"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="300" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例：a=4,b=0,mod=9 → 1 000000001</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">a=1,b=10,mod=7 → 2</text>
  <g filter="url(#rough2)"><rect x="110" y="104" width="300" height="56" rx="4" fill="#d7ecd0" fill-opacity="0.55" stroke="#6a9a58" stroke-width="1.3"/></g>
  <text x="260" y="128" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">s1 = 1</text>
  <text x="260" y="150" text-anchor="middle" font-size="10.5" fill="#3d6b2f" filter="url(#rough2)">r = (−1·10⁹) mod 9 = 8 &gt; 0</text>
  <g filter="url(#rough2)"><rect x="470" y="104" width="300" height="56" rx="4" fill="#f6d9d7" fill-opacity="0.5" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="620" y="128" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">a=1,b=10,mod=7</text>
  <text x="620" y="150" text-anchor="middle" font-size="10.5" fill="#8a2b28" filter="url(#rough2)">s1=0→0≤10；s1=1→1≤10 → 2</text>
  <text x="442" y="222" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">先手赢时输出 1 与 9 位补零串；否则只输出 2</text>
</svg>
