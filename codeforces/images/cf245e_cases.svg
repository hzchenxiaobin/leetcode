<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="720" height="280" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两个样例</text>
  <rect x="40" y="60" width="300" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="190" y="89" text-anchor="middle" font-size="12" fill="#2f5223">+-+-+  →  余额 1,0,1,0,1</text>
  <rect x="380" y="60" width="300" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="530" y="89" text-anchor="middle" font-size="12" fill="#2f5223">max=1, min=0 → 答案 1</text>
  <rect x="40" y="140" width="300" height="50" rx="8" fill="#fde9d9" stroke="#b4652a" stroke-width="1.5"/>
  <text x="190" y="169" text-anchor="middle" font-size="12" fill="#7a4b22">---  →  余额 −1,−2,−3</text>
  <rect x="380" y="140" width="300" height="50" rx="8" fill="#fde9d9" stroke="#b4652a" stroke-width="1.5"/>
  <text x="530" y="169" text-anchor="middle" font-size="12" fill="#7a4b22">max=0, min=−3 → 答案 3</text>
  <text x="40" y="236" text-anchor="start" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">开局可以有任意多人在馆内：把整条曲线抬高 max(0,−min) 就消除了负数部分；抬高后最高点随之变成 max−min。</text>
</svg>
