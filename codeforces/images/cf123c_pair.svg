<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="149"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="400" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">两条路径只差一步：同一条反对角线上相邻的两格必须相同</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">它们都从 (a,b) 出发、一步后都到达 (a+1,b+1)；两条路径长度相同、总平衡都是 0</text>
  <g filter="url(#rough2)"><rect x="80" y="96" width="96" height="62" rx="3" fill="#ffffff" fill-opacity="0.25" stroke="#dddddd" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><rect x="176" y="96" width="96" height="62" rx="3" fill="#ffffff" fill-opacity="0.25" stroke="#dddddd" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><rect x="272" y="96" width="96" height="62" rx="3" fill="#ffffff" fill-opacity="0.25" stroke="#dddddd" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><rect x="368" y="96" width="96" height="62" rx="3" fill="#ffffff" fill-opacity="0.25" stroke="#dddddd" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><rect x="464" y="96" width="96" height="62" rx="3" fill="#ffffff" fill-opacity="0.25" stroke="#dddddd" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><rect x="80" y="158" width="96" height="62" rx="3" fill="#ffffff" fill-opacity="0.25" stroke="#dddddd" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><rect x="176" y="158" width="96" height="62" rx="3" fill="#ffffff" fill-opacity="0.25" stroke="#dddddd" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><rect x="272" y="158" width="96" height="62" rx="3" fill="#ffffff" fill-opacity="0.25" stroke="#dddddd" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><rect x="368" y="158" width="96" height="62" rx="3" fill="#ffffff" fill-opacity="0.25" stroke="#dddddd" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><rect x="464" y="158" width="96" height="62" rx="3" fill="#ffffff" fill-opacity="0.25" stroke="#dddddd" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><rect x="80" y="220" width="96" height="62" rx="3" fill="#ffffff" fill-opacity="0.25" stroke="#dddddd" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><rect x="176" y="220" width="96" height="62" rx="3" fill="#ffffff" fill-opacity="0.25" stroke="#dddddd" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><rect x="272" y="220" width="96" height="62" rx="3" fill="#ffffff" fill-opacity="0.25" stroke="#dddddd" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><rect x="368" y="220" width="96" height="62" rx="3" fill="#ffffff" fill-opacity="0.25" stroke="#dddddd" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><rect x="464" y="220" width="96" height="62" rx="3" fill="#ffffff" fill-opacity="0.25" stroke="#dddddd" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><rect x="80" y="282" width="96" height="62" rx="3" fill="#ffffff" fill-opacity="0.25" stroke="#dddddd" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><rect x="176" y="282" width="96" height="62" rx="3" fill="#ffffff" fill-opacity="0.25" stroke="#dddddd" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><rect x="272" y="282" width="96" height="62" rx="3" fill="#ffffff" fill-opacity="0.25" stroke="#dddddd" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><rect x="368" y="282" width="96" height="62" rx="3" fill="#ffffff" fill-opacity="0.25" stroke="#dddddd" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><rect x="464" y="282" width="96" height="62" rx="3" fill="#ffffff" fill-opacity="0.25" stroke="#dddddd" stroke-width="1.4"/></g>
  <text x="320.0" y="86" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">同一反对角线 i+j = d</text>
  <g filter="url(#rough2)"><circle cx="224.0" cy="189.0" r="18" fill="#cfe0f5" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="224.0" y="192.6" text-anchor="middle" font-size="10" fill="#2b2b2b" filter="url(#rough2)">(a,b)</text>
  <g filter="url(#rough2)"><circle cx="320.0" cy="251.0" r="18" fill="#f6e3c4" fill-opacity="0.9" stroke="#b06a1e" stroke-width="1.5"/></g>
  <text x="320.0" y="254.42" text-anchor="middle" font-size="9.5" fill="#2b2b2b" filter="url(#rough2)">(a+1,b+1)</text>
  <g filter="url(#rough2)"><rect x="176" y="220" width="96" height="62" rx="3" fill="#f3d9d6" fill-opacity="0.85" stroke="#8a2b28" stroke-width="2"/></g>
  <text x="224.0" y="256.0" text-anchor="middle" font-size="16" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">B</text>
  <g filter="url(#rough2)"><rect x="272" y="158" width="96" height="62" rx="3" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="320.0" y="194.0" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">A</text>
  <g filter="url(#rough2)"><path d="M 224.0 189.0 L 320.0 189.0" fill="none" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arr)"/></g>
  <g filter="url(#rough2)"><path d="M 224.0 189.0 L 224.0 251.0" fill="none" stroke="#8a2b28" stroke-width="2.2" marker-end="url(#arr)"/></g>
  <g filter="url(#rough2)"><path d="M 320.0 189.0 L 320.0 251.0" fill="none" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arr)"/></g>
  <g filter="url(#rough2)"><path d="M 224.0 251.0 L 320.0 251.0" fill="none" stroke="#8a2b28" stroke-width="2.2" marker-end="url(#arr)"/></g>
  <text x="640" y="120" text-anchor="start" font-size="13" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">若 A ≠ B：</text>
  <text x="640" y="148" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">P₁ 在第 d 位放 A，</text>
  <text x="640" y="170" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">P₂ 在同一位放 B，</text>
  <text x="640" y="192" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">两串其余位置完全相同，</text>
  <text x="640" y="214" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">总平衡就会相差 ±2。</text>
  <text x="640" y="242" text-anchor="start" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">但它们都必须平衡（0），</text>
  <text x="640" y="264" text-anchor="start" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">矛盾 ⇒ A = B。</text>
  <text x="640" y="300" text-anchor="start" font-size="11" fill="#666666" filter="url(#rough2)">沿反对角线逐对相邻格</text>
  <text x="640" y="322" text-anchor="start" font-size="11" fill="#666666" filter="url(#rough2)">重复该论证 ⇒ 整条线同值。</text>
  <text x="450" y="372" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">若 n = 1 或 m = 1，每条反对角线只有一个格子，结论平凡成立</text>
</svg>
