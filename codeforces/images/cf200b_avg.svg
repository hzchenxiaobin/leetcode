<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="300" fill="#fafafa"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">200B：等体积混合，浓度取平均</text>
  <path d="M 237.56 46 Q 380.0 52 522.44 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60.0" y="70.0" width="640.0" height="56.0" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="96.0" text-anchor="start" font-size="11.0" fill="#33506e" filter="url(#rough2)">各取等体积（各 1 份）混合 ⇒ 总体积 n 份，纯果汁 (Σpᵢ/100) 份</text>
  <text x="74.0" y="118.0" text-anchor="start" font-size="11.0" fill="#33506e" filter="url(#rough2)">所以混合后浓度 = (Σpᵢ)/n 百分比。</text>
  <rect x="60.0" y="150.0" width="640.0" height="36.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="68.0" y="179.0" text-anchor="start" font-size="10.8" font-weight="bold" fill="#26405c" filter="url(#rough2)">样例</text>
  <text x="148.0" y="179.0" text-anchor="start" font-size="10.8" font-weight="bold" fill="#26405c" filter="url(#rough2)">p</text>
  <text x="388.0" y="179.0" text-anchor="start" font-size="10.8" font-weight="bold" fill="#26405c" filter="url(#rough2)">Σp</text>
  <text x="488.0" y="179.0" text-anchor="start" font-size="10.8" font-weight="bold" fill="#26405c" filter="url(#rough2)">答案</text>
  <path d="M 60.0 150.0 L 700.0 150.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="68.0" y="215.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="148.0" y="215.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">50 50 100</text>
  <text x="388.0" y="215.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">200</text>
  <text x="488.0" y="215.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">66.666666666667</text>
  <path d="M 60.0 186.0 L 700.0 186.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="68.0" y="251.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="148.0" y="251.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">0 25 50 75</text>
  <text x="388.0" y="251.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">150</text>
  <text x="488.0" y="251.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">37.500000000000</text>
  <path d="M 60.0 222.0 L 700.0 222.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <rect x="60.0" y="250.0" width="640.0" height="40.0" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="74.0" y="276.0" text-anchor="start" font-size="10.9" fill="#8a6015" filter="url(#rough2)">输出 12 位小数即可（误差 1e-4）。</text>
</svg>
