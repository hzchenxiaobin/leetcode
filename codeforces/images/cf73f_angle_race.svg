<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="107"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="fa" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="fb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2f7a3a"/>
    </marker>
  </defs>
  <rect width="720" height="420" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">炮塔每秒最多转 w，Pedalny 每秒最多前进 v：角度要“追得上”时间</text>
  <path d="M 130 40 Q 360 46 590 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 直线 AB -->
  <line x1="110" y1="320" x2="640" y2="320" stroke="#333" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="110" cy="320" r="6" fill="#2f4a66" filter="url(#rough2)"/>
  <circle cx="640" cy="320" r="6" fill="#8c2f2b" filter="url(#rough2)"/>
  <text x="110" y="348" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">A</text>
  <text x="640" y="348" text-anchor="middle" font-size="13" font-weight="bold" fill="#8c2f2b" filter="url(#rough2)">B</text>

  <!-- 坦克 -->
  <circle cx="360" cy="120" r="7" fill="#7b4fa8" filter="url(#rough2)"/>
  <text x="360" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#4b2a70" filter="url(#rough2)">坦克 P，转速 w</text>

  <!-- 当前瞄准方向 -->
  <line x1="360" y1="120" x2="470" y2="196" stroke="#7b4fa8" stroke-width="2" stroke-dasharray="7 4" filter="url(#rough2)" marker-end="url(#fa)"/>
  <text x="478" y="188" font-size="11.5" fill="#4b2a70" filter="url(#rough2)">初始角 a</text>

  <!-- 指向 Pedalny 的方向 -->
  <line x1="360" y1="120" x2="300" y2="318" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)" marker-end="url(#fa)"/>
  <circle cx="300" cy="320" r="7" fill="#c47a00" filter="url(#rough2)"/>
  <text x="284" y="300" text-anchor="end" font-size="11.5" fill="#8c2f2b" filter="url(#rough2)">Pedalny（已经走了 s）</text>

  <!-- 角度弧 -->
  <path d="M 400 178 Q 372 220 330 268" stroke="#1f5226" stroke-width="2" fill="none" filter="url(#rough2)" marker-end="url(#fb)"/>
  <text x="410" y="240" font-size="12.5" font-weight="bold" fill="#1f5226" filter="url(#rough2)">g(s)</text>

  <!-- 不等式 -->
  <rect x="60" y="52" width="470" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="75" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">能开火 ⟺ g(s) ≤ w·t = w·s/v ⟺ v ≤ w·s/g(s)</text>

  <rect x="60" y="360" width="620" height="50" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="382" font-size="12" fill="#2f4a66" filter="url(#rough2)">v 越大 ⇒ 同样的 s 花的时间越少 ⇒ 炮塔越转不过来；</text>
  <text x="76" y="402" font-size="12" fill="#2f4a66" filter="url(#rough2)">所以“几辆坦克能开火”随 v 单调不增，临界点就是各坦克的阈值速度 V_i。</text>
</svg>
