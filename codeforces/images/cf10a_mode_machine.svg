<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="19"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="760" height="430" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">三档状态机：计时器决定往哪走</text>
  <path d="M 190 40 Q 380 46 570 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 自环 -->
  <path d="M 92 126 C 92 78 188 78 188 126" stroke="#446688" stroke-width="1.6" fill="none"
        marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="140" y="72" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">持续活动：计时保持 0</text>

  <!-- 三个状态 -->
  <ellipse cx="140" cy="170" rx="85" ry="46" fill="#cfe0f5" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="164" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">① 正常模式</text>
  <text x="140" y="186" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">每分钟 P1</text>

  <ellipse cx="390" cy="170" rx="90" ry="46" fill="#d9ecd4" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="164" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">② 屏幕保护</text>
  <text x="390" y="186" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">每分钟 P2</text>

  <ellipse cx="630" cy="170" rx="80" ry="46" fill="#f6d9d7" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="630" y="164" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">③ 睡眠</text>
  <text x="630" y="186" text-anchor="middle" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">每分钟 P3</text>

  <!-- 正向迁移 -->
  <path d="M 226 170 L 296 170" stroke="#4a7a3a" stroke-width="1.7" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="261" y="160" text-anchor="middle" font-size="11" fill="#3c5e2e" filter="url(#rough2)">安静满 T1</text>

  <path d="M 481 170 L 546 170" stroke="#b85450" stroke-width="1.7" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="513" y="160" text-anchor="middle" font-size="11" fill="#8a2b28" filter="url(#rough2)">再安静 T2</text>

  <!-- 回到正常模式 -->
  <path d="M 390 217 C 390 288 160 288 150 219" stroke="#446688" stroke-width="1.5" fill="none"
        stroke-dasharray="6 4" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="272" y="304" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">任何活动 → 立即回到 ①</text>

  <path d="M 630 217 C 630 344 230 344 210 219" stroke="#446688" stroke-width="1.5" fill="none"
        stroke-dasharray="6 4" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="430" y="372" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">任何活动 → 立即回到 ①，计时清零</text>

  <!-- 说明 -->
  <text x="40" y="404" font-size="12" fill="#2b2b2b" filter="url(#rough2)">工作区间 = 停在 ① 并不断自环；空档 = 从 ① 出发沿箭头走，能走多远由空档长度 d 决定。</text>
</svg>
