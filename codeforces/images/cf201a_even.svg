<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="700" height="300" fill="#fafafa"/>
  <text x="350.0" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">201A：偶数边长时中行中列整条都不能用</text>
  <path d="M 140.00 46 Q 350.0 52 560.00 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="72" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">偶数 n=4：中行/中列上的格子 (2,0) 与自己的镜像 (3,0) 相邻 —— 选它就违反“清晰”。</text>
  <text x="60" y="92" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">于是只能使用左上角 (m-1)×(m-1) 的小方阵（图中深色），每个轨道 4 格。</text>
  <rect x="90" y="112" width="40" height="40" fill="#cfe3c8" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="110.0" y="136.0" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">11</text>
  <rect x="130" y="112" width="40" height="40" fill="#cfe3c8" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="150.0" y="136.0" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">12</text>
  <rect x="170" y="112" width="40" height="40" fill="#f3c9d3" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="190.0" y="136.0" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">13</text>
  <rect x="210" y="112" width="40" height="40" fill="#ffffff" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="230.0" y="136.0" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">14</text>
  <rect x="90" y="152" width="40" height="40" fill="#cfe3c8" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="110.0" y="176.0" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">21</text>
  <rect x="130" y="152" width="40" height="40" fill="#cfe3c8" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="150.0" y="176.0" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">22</text>
  <rect x="170" y="152" width="40" height="40" fill="#f3c9d3" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="190.0" y="176.0" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">23</text>
  <rect x="210" y="152" width="40" height="40" fill="#ffffff" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="230.0" y="176.0" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">24</text>
  <rect x="90" y="192" width="40" height="40" fill="#f3c9d3" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="110.0" y="216.0" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">31</text>
  <rect x="130" y="192" width="40" height="40" fill="#f3c9d3" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="150.0" y="216.0" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">32</text>
  <rect x="170" y="192" width="40" height="40" fill="#f3c9d3" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="190.0" y="216.0" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">33</text>
  <rect x="210" y="192" width="40" height="40" fill="#f3c9d3" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="230.0" y="216.0" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">34</text>
  <rect x="90" y="232" width="40" height="40" fill="#ffffff" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="110.0" y="256.0" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">41</text>
  <rect x="130" y="232" width="40" height="40" fill="#ffffff" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="150.0" y="256.0" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">42</text>
  <rect x="170" y="232" width="40" height="40" fill="#f3c9d3" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="190.0" y="256.0" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">43</text>
  <rect x="210" y="232" width="40" height="40" fill="#ffffff" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="230.0" y="256.0" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">44</text>
  <text x="330" y="150" text-anchor="start" font-size="11" fill="#8a3a52" filter="url(#rough2)">粉色：与自身镜像相邻 ⇒ 不能选</text>
  <text x="330" y="176" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">绿色：可用的 (m-1)×(m-1) 象限</text>
  <text x="330" y="202" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">n=4, m=2：可用 1×1，最大 4 格</text>
  <text x="330" y="228" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">⇒ 偶数 n 只能凑出 4 的倍数，</text>
  <text x="330" y="250" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">上限 4·ceil((m-1)²/2)</text>
</svg>
