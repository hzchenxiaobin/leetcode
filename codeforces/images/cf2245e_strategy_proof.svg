<svg xmlns="http://www.w3.org/2000/svg" width="740" height="400" viewBox="0 0 740 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="21"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="740" height="400" fill="#fafafa"/>
  <text x="370" y="30" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">两步互推：P 局面只能走成 N，N 局面总能走回 P</text>
  <text x="370" y="52" text-anchor="middle" font-size="11.5" fill="#888888"
        filter="url(#rough2)">于是「每个锚点的剩余度数都是偶数」就是必败局面的完整刻画</text>

  <rect x="36" y="76" width="326" height="306" rx="9" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="54" y="100" text-anchor="start" font-size="12.5" font-weight="bold" fill="#446688"
        filter="url(#rough2)">A. P 局面 → 只能走成 N 局面</text>

  <line x1="100" y1="150" x2="58" y2="108" stroke="#9aa0a6" stroke-width="1.6"
        stroke-dasharray="5 4" filter="url(#rough2)"/>
  <line x1="100" y1="150" x2="58" y2="192" stroke="#9aa0a6" stroke-width="1.6"
        stroke-dasharray="5 4" filter="url(#rough2)"/>
  <line x1="116" y1="150" x2="186" y2="150" stroke="#d6a040" stroke-width="3.4" filter="url(#rough2)"/>
  <circle cx="58" cy="108" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="58" cy="192" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="100" cy="150" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="100" y="156" text-anchor="middle" font-size="13" fill="#8a6d20" filter="url(#rough2)">x</text>
  <circle cx="203" cy="150" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="203" y="155" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">y</text>
  <text x="151" y="139" text-anchor="middle" font-size="9.5" fill="#8a6d20" filter="url(#rough2)">这一步</text>

  <text x="54" y="216" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">任何一步都从某个锚点 x 出发，</text>
  <text x="54" y="238" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">用掉 x 的一条剩余边 ⇒ deg_F(x)</text>
  <text x="54" y="260" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">由偶变奇；而 x 仍是新路径的端点，</text>
  <text x="54" y="282" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">所以对手面前又出现了奇度锚点。</text>
  <text x="54" y="312" text-anchor="start" font-size="11.5" fill="#b85450" filter="url(#rough2)">奇度锚点所在局面是 N（必胜），</text>
  <text x="54" y="334" text-anchor="start" font-size="11.5" fill="#b85450" filter="url(#rough2)">故 P 局面里没有一步能回到 P。</text>
  <text x="54" y="364" text-anchor="start" font-size="10.5" fill="#888888" filter="url(#rough2)">（奇偶只看剩余森林 F 中的度数）</text>

  <rect x="378" y="76" width="326" height="306" rx="9" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="396" y="100" text-anchor="start" font-size="12.5" font-weight="bold" fill="#4a7a3a"
        filter="url(#rough2)">B. N 局面 → 一定存在走回 P 的招</text>

  <rect x="470" y="128" width="102" height="44" rx="8" fill="none" stroke="#4a7a3a"
        stroke-width="1.6" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <line x1="424" y1="150" x2="482" y2="150" stroke="#3a3a3a" stroke-width="2" filter="url(#rough2)"/>
  <line x1="508" y1="150" x2="552" y2="150" stroke="#3a3a3a" stroke-width="2" filter="url(#rough2)"/>
  <line x1="578" y1="150" x2="636" y2="150" stroke="#3a3a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="410" cy="150" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="410" y="155" text-anchor="middle" font-size="12" fill="#8a6d20" filter="url(#rough2)">x</text>
  <circle cx="495" cy="150" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="495" y="155" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">偶</text>
  <circle cx="565" cy="150" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="565" y="155" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">偶</text>
  <circle cx="652" cy="150" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="652" y="155" text-anchor="middle" font-size="12" fill="#8a6d20" filter="url(#rough2)">y</text>
  <text x="521" y="124" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">偶块 C</text>

  <text x="396" y="198" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">x 度数为奇。若 x 有奇度邻居，</text>
  <text x="396" y="220" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">直接走那条边（路径没有内部点）。</text>
  <text x="396" y="242" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">否则 x 的邻居全是偶点：走进它所</text>
  <text x="396" y="264" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">在的偶块 C。对 C 数一遍度数：</text>
  <text x="396" y="286" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">Σdeg = 2|E(C)| + k_C 为偶 ⇒ k_C 偶；</text>
  <text x="396" y="308" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">而 x 已挂一个 ⇒ k_C ≥ 2，于是 C 上</text>
  <text x="396" y="330" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">还有另一个奇点 y。沿 C 内部走</text>
  <text x="396" y="352" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">到 y：内部点全偶 ⇒ 走完就是 P。</text>
</svg>
