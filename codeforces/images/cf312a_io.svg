<svg xmlns="http://www.w3.org/2000/svg" width="700" height="250" viewBox="0 0 700 250"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="1403"/>
    <feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></defs>
  <rect width="700" height="250" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">实现要点：按行读入 + 两处子串比较</text>
  <path d="M 180 40 Q 350 46 520 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="60" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="12.5" fill="#22314a" filter="url(#rough2)">句子含空格 ⇒ 必须整行读（getline），不能用 cin &gt;&gt;。</text>
  <text x="76" y="104" font-size="12.5" fill="#22314a" filter="url(#rough2)">读完 n 之后要先吞掉行尾换行。</text>
  <g filter="url(#rough2)"><rect x="60" y="130" width="580" height="60" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="154" font-size="12.5" fill="#2f5223" filter="url(#rough2)">前缀：s.size() ≥ 5 且 s.substr(0,5) == "miao."</text>
  <text x="76" y="176" font-size="12.5" fill="#2f5223" filter="url(#rough2)">后缀：s.size() ≥ 5 且 s.substr(s.size()-5) == "lala."（注意点是关键词的一部分）</text>
  <g filter="url(#rough2)"><rect x="60" y="202" width="580" height="36" rx="8" fill="#fbeeee" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="76" y="225" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">易错：n ≤ 10、行长 ≤ 100；输出三选一，字符串里的 &gt;.&lt; 和 I don't know! 要逐字照抄。</text>
</svg>
