<svg xmlns="http://www.w3.org/2000/svg" width="720" height="310" viewBox="0 0 720 310"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1416"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="720" height="310" fill="#fafafa"/>
  <text x="360.0" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2：走 14 s 再用 2 号跳板</text>
  <path d="M 115.2 42 Q 360.0 48 604.8 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="30" y="96" width="96" height="56" rx="5" fill="#e8eef7" stroke="#335478" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="78.0" y="121.0" text-anchor="middle" font-size="11.5" fill="#335478" filter="url(#rough2)">0</text>
  <text x="78.0" y="135.3" text-anchor="middle" font-size="11.5" fill="#335478" filter="url(#rough2)">起点</text>
  <path d="M 128.0 124.0 L 167.0 124.0" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 176.0 124.0 L 167.0 128.0 L 167.0 120.0 Z" fill="#4a7a3a" filter="url(#rough2)"/>
  <rect x="178" y="96" width="150" height="56" rx="5" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="253.0" y="121.0" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">走 14 m</text>
  <text x="253.0" y="135.3" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">14 s</text>
  <path d="M 330.0 124.0 L 369.0 124.0" stroke="#8c5a2c" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 378.0 124.0 L 369.0 128.0 L 369.0 120.0 Z" fill="#8c5a2c" filter="url(#rough2)"/>
  <rect x="380" y="96" width="170" height="56" rx="5" fill="#f7efe8" stroke="#8c5a2c" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="465.0" y="121.1" text-anchor="middle" font-size="11.0" fill="#8c5a2c" filter="url(#rough2)">2 号跳板</text>
  <text x="465.0" y="134.8" text-anchor="middle" font-size="11.0" fill="#8c5a2c" filter="url(#rough2)">助跑 1 + 飞行 1</text>
  <path d="M 552.0 124.0 L 591.0 124.0" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 600.0 124.0 L 591.0 128.0 L 591.0 120.0 Z" fill="#4a7a3a" filter="url(#rough2)"/>
  <rect x="602" y="96" width="88" height="56" rx="5" fill="#e8eef7" stroke="#335478" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="646.0" y="121.0" text-anchor="middle" font-size="11.5" fill="#335478" filter="url(#rough2)">20</text>
  <text x="646.0" y="135.3" text-anchor="middle" font-size="11.5" fill="#335478" filter="url(#rough2)">终点</text>
  <text x="360.0" y="196.0" text-anchor="middle" font-size="13.0" fill="#8c2f2c" font-weight="bold" filter="url(#rough2)">合计 14 + 2 = 16 s（最短）</text>
  <rect x="60" y="214" width="600" height="46" rx="5" fill="#f5e8e8" stroke="#8c2f2c" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360.0" y="241.0" text-anchor="middle" font-size="11.0" fill="#8c2f2c" filter="url(#rough2)">对比：1 号跳板 3 → 17 花 18 s，再走 3 s 共 21 s；</text>
  <text x="360.0" y="292.0" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">所以 t_i &gt; d_i 的跳板未必划算，交给最短路比较</text>
  <text x="360.0" y="296" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">样例 1 则是 0 → 15 用跳板 1，再走 5 s，共 15 s</text>
</svg>
