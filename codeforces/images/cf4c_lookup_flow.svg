<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="760" height="600" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每次请求的处理流程</text>
  <path d="M 200 42 Q 380 48 560 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 读入 -->
  <rect x="290" y="58" width="170" height="36" rx="16" fill="#eef4fb" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="375" y="81" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">读入请求 s</text>
  <path d="M 375 94 L 375 118" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 判定 1 -->
  <polygon points="375,120 470,158 375,196 280,158" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="375" y="163" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">s 在 db 里？</text>

  <!-- 左分支：否 -->
  <path d="M 280 158 L 232 158 L 232 214" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="240" y="150" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="112" y="216" width="240" height="34" rx="9" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="232" y="238" text-anchor="middle" font-size="12.5" fill="#2f5223" filter="url(#rough2)">db.insert(s)</text>
  <path d="M 232 250 L 232 276" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <rect x="112" y="278" width="240" height="34" rx="9" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="232" y="300" text-anchor="middle" font-size="12.5" fill="#2f5223" filter="url(#rough2)">输出 OK</text>

  <!-- 右分支：是 -->
  <path d="M 470 158 L 512 158 L 512 196" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="482" y="150" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="452" y="198" width="240" height="34" rx="9" fill="#fdeeee" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="572" y="220" text-anchor="middle" font-size="12.5" fill="#8a2b28" filter="url(#rough2)">k = nxt[s]（缺省 0）</text>
  <path d="M 572 232 L 572 254" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <rect x="452" y="256" width="240" height="34" rx="9" fill="#fdeeee" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="572" y="278" text-anchor="middle" font-size="12.5" fill="#8a2b28" filter="url(#rough2)">k += 1</text>
  <path d="M 572 290 L 572 312" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <rect x="452" y="314" width="240" height="34" rx="9" fill="#fdeeee" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="572" y="336" text-anchor="middle" font-size="12.5" fill="#8a2b28" filter="url(#rough2)">t = s + 十进制 k</text>
  <path d="M 572 348 L 572 372" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <!-- 判定 2 -->
  <polygon points="572,374 664,414 572,454 480,414" fill="#fdf3e0" stroke="#c98a2b" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="572" y="419" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">t 也在 db 里？</text>

  <!-- 回到 k+=1 的环 -->
  <path d="M 480 414 L 414 414 L 414 273 L 448 273" stroke="#c98a2b" stroke-width="1.5" fill="none"
        stroke-dasharray="6 4" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="420" y="440" font-size="11.5" fill="#8a6015" filter="url(#rough2)">是：编号继续加</text>

  <!-- 否：成功 -->
  <path d="M 572 454 L 572 480" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="582" y="472" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="452" y="482" width="240" height="36" rx="9" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="572" y="505" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">nxt[s] = k；db.insert(t)</text>
  <path d="M 572 518 L 572 538" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <rect x="452" y="540" width="240" height="34" rx="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="572" y="562" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">输出 t</text>

  <!-- 左侧注释 -->
  <rect x="26" y="330" width="326" height="112" rx="12" fill="#f4f4f4" stroke="#9a9a9a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="44" y="356" font-size="12.5" font-weight="bold" fill="#4a4a4a" filter="url(#rough2)">为什么不会漏掉更小的编号？</text>
  <text x="44" y="380" font-size="11.5" fill="#5a5a5a" filter="url(#rough2)">nxt[s] 之前的编号 s1 … s(nxt) 都已被占；</text>
  <text x="44" y="400" font-size="11.5" fill="#5a5a5a" filter="url(#rough2)">游标只增不减，所以从下一位开始试，</text>
  <text x="44" y="420" font-size="11.5" fill="#5a5a5a" filter="url(#rough2)">第一个空位就是全局最小编号。</text>

  <text x="26" y="480" font-size="12" fill="#2b2b2b" filter="url(#rough2)">输出要不要缓存？10^5 行输出建议</text>
  <text x="26" y="500" font-size="12" fill="#2b2b2b" filter="url(#rough2)">C++ 用 '\n' 关同步；Python 用列表</text>
  <text x="26" y="520" font-size="12" fill="#2b2b2b" filter="url(#rough2)">join 后一次写出，别在循环里 print。</text>
</svg>
