<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2b2b2b"/>
    </marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arra" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="760" height="450" fill="#fafafa"/>
  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">推倒 10：区间 [10,19] 覆盖 16，链式扩到 20</text>
  <path d="M 220 42 Q 380 48 540 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <line x1="70" y1="356" x2="730" y2="356" stroke="#2b2b2b" stroke-width="1.6" opacity="1.0" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="100" y1="356" x2="100" y2="364" stroke="#2b2b2b" stroke-width="1.2" opacity="1.0" filter="url(#rough2)"/>
  <text x="100" y="380" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#rough2)">8</text>
  <line x1="252" y1="356" x2="252" y2="364" stroke="#2b2b2b" stroke-width="1.2" opacity="1.0" filter="url(#rough2)"/>
  <text x="252" y="380" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#rough2)">12</text>
  <line x1="404" y1="356" x2="404" y2="364" stroke="#2b2b2b" stroke-width="1.2" opacity="1.0" filter="url(#rough2)"/>
  <text x="404" y="380" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#rough2)">16</text>
  <line x1="556" y1="356" x2="556" y2="364" stroke="#2b2b2b" stroke-width="1.2" opacity="1.0" filter="url(#rough2)"/>
  <text x="556" y="380" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#rough2)">20</text>
  <line x1="708" y1="356" x2="708" y2="364" stroke="#2b2b2b" stroke-width="1.2" opacity="1.0" filter="url(#rough2)"/>
  <text x="708" y="380" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#rough2)">24</text>
  <rect x="169" y="296" width="14" height="60" rx="0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="176" y="288" text-anchor="middle" font-size="10" fill="#8a6015" filter="url(#rough2)">h=10</text>
  <text x="176" y="400" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">10</text>
  <rect x="397" y="326" width="14" height="30" rx="0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="404" y="318" text-anchor="middle" font-size="10" fill="#8a6015" filter="url(#rough2)">h=5</text>
  <text x="404" y="400" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">16</text>
  <rect x="473" y="344" width="14" height="12" rx="0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="480" y="336" text-anchor="middle" font-size="10" fill="#8a6015" filter="url(#rough2)">h=2</text>
  <text x="480" y="400" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">18</text>
  <rect x="549" y="326" width="14" height="30" rx="0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="556" y="318" text-anchor="middle" font-size="10" fill="#8a6015" filter="url(#rough2)">h=5</text>
  <text x="556" y="400" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">20</text>
  <text x="70" y="400" text-anchor="start" font-size="11" fill="#8a8a8a" filter="url(#rough2)">坐标</text>
  <line x1="176" y1="250" x2="518" y2="250" stroke="#b85450" stroke-width="3" opacity="1.0" filter="url(#rough2)"/>
  <line x1="176" y1="244" x2="176" y2="256" stroke="#b85450" stroke-width="2" opacity="1.0" filter="url(#rough2)"/>
  <line x1="518" y1="244" x2="518" y2="256" stroke="#b85450" stroke-width="2" opacity="1.0" filter="url(#rough2)"/>
  <text x="170" y="236" text-anchor="start" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">10 的可达 [10,19]</text>
  <line x1="404" y1="200" x2="556" y2="200" stroke="#7a5a9a" stroke-width="3" opacity="1.0" filter="url(#rough2)"/>
  <line x1="404" y1="194" x2="404" y2="206" stroke="#7a5a9a" stroke-width="2" opacity="1.0" filter="url(#rough2)"/>
  <line x1="556" y1="194" x2="556" y2="206" stroke="#7a5a9a" stroke-width="2" opacity="1.0" filter="url(#rough2)"/>
  <text x="398" y="186" text-anchor="start" font-size="11.5" font-weight="bold" fill="#7a5a9a" filter="url(#rough2)">16 的可达 [16,20]</text>
  <line x1="176" y1="262" x2="404" y2="262" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" opacity="1.0" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="528" y="272" text-anchor="start" font-size="10.5" fill="#b85450" filter="url(#rough2)">覆盖 16</text>
  <line x1="404" y1="212" x2="556" y2="212" stroke="#7a5a9a" stroke-width="1.4" stroke-dasharray="5 4" opacity="1.0" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="564" y="222" text-anchor="start" font-size="10.5" fill="#7a5a9a" filter="url(#rough2)">覆盖 18、20</text>
  <text x="380" y="426" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">严格高于底座才算：可压到 x + h - 1，不含 x + h</text>
  <text x="380" y="448" text-anchor="middle" font-size="11.5" fill="#8a8a8a" filter="url(#rough2)">10 → 16 → 20 一条链，共倒下 4 块</text>
</svg>
