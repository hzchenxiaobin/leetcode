<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="330" fill="#fafafa"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">D2 的两条剪枝：行内余额与列的可行区间</text>
  <path d="M 198.97000000000003 46 Q 380.0 52 561.03 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="50.0" y="70.0" width="320.0" height="170.0" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="66.0" y="96.0" text-anchor="start" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">① 行内剩余</text>
  <text x="66.0" y="124.0" text-anchor="start" font-size="11.2" fill="#2b2b2b" filter="url(#rough2)">已填前缀 p，剩 k 格要凑 s−p。</text>
  <text x="66.0" y="146.0" text-anchor="start" font-size="11.2" fill="#2b2b2b" filter="url(#rough2)">可行 ⇔ s−p ∈ [minSum(k), maxSum(k)]</text>
  <text x="66.0" y="168.0" text-anchor="start" font-size="11.0" fill="#6b6b6b" filter="url(#rough2)">其中 minSum/maxSum 取剩余多重集</text>
  <text x="66.0" y="190.0" text-anchor="start" font-size="11.0" fill="#6b6b6b" filter="url(#rough2)">最小的 k 个 / 最大的 k 个之和。</text>
  <rect x="66.0" y="204.0" width="288.0" height="26.0" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="78.0" y="222.0" text-anchor="start" font-size="10.8" fill="#8a6015" filter="url(#rough2)">O(1) 判定，剪掉大量分支</text>
  <rect x="396.0" y="70.0" width="320.0" height="170.0" rx="9" fill="#fdf0ef" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="412.0" y="96.0" text-anchor="start" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">② 列的可行区间</text>
  <text x="412.0" y="124.0" text-anchor="start" font-size="11.2" fill="#2b2b2b" filter="url(#rough2)">列 j 已累计 col[j]，还要放 m 个。</text>
  <text x="412.0" y="146.0" text-anchor="start" font-size="11.2" fill="#2b2b2b" filter="url(#rough2)">可行 ⇔ s−col[j] ∈ [minSum(m), maxSum(m)]</text>
  <text x="412.0" y="168.0" text-anchor="start" font-size="11.0" fill="#6b6b6b" filter="url(#rough2)">不同的 j 剩余格数不同：</text>
  <text x="412.0" y="190.0" text-anchor="start" font-size="11.0" fill="#6b6b6b" filter="url(#rough2)">j ≤ c：n−1−r 格；j &gt; c：n−r 格。</text>
  <text x="412.0" y="214.0" text-anchor="start" font-size="10.8" fill="#6b6b6b" filter="url(#rough2)">（格子按行优先填，注意别写错剩余格数）</text>
  <rect x="50.0" y="254.0" width="666.0" height="50.0" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="64.0" y="278.0" text-anchor="start" font-size="11.3" fill="#8a6015" filter="url(#rough2)">这两条剪枝都只依赖「剩余多重集的 k 小/大和」，与具体数值无关，负数和 10⁸ 一样好使。</text>
  <text x="64.0" y="296.0" text-anchor="start" font-size="11.3" fill="#8a6015" filter="url(#rough2)">D3 还会再加：对角线上下界 + 最后一行整行由列和反解。</text>
</svg>
