<svg xmlns="http://www.w3.org/2000/svg" width="720" height="310" viewBox="0 0 720 310"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="893"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="310" fill="#fafafa"/>
  <text x="360.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每分钟的预算与总量上界</text>
  <path d="M 115.2 42 Q 360.0 48 604.8 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="360.0" y="296" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">ans = min( min_odd a , k·⌊m / ⌈n/2⌉⌋ )</text>
  <rect x="60" y="78" width="140" height="54" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="130" y="102" text-anchor="middle" font-size="12.5" fill="#2f5223" filter="url(#rough2)">第 1 分钟</text>
  <text x="130" y="122" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">≤ m 次操作</text>
  <rect x="218" y="78" width="140" height="54" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="288" y="102" text-anchor="middle" font-size="12.5" fill="#2f5223" filter="url(#rough2)">第 2 分钟</text>
  <text x="288" y="122" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">≤ m 次操作</text>
  <rect x="376" y="78" width="140" height="54" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="446" y="102" text-anchor="middle" font-size="12.5" fill="#2f5223" filter="url(#rough2)">第 3 分钟</text>
  <text x="446" y="122" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">≤ m 次操作</text>
  <rect x="534" y="78" width="140" height="54" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="604" y="102" text-anchor="middle" font-size="12.5" fill="#2f5223" filter="url(#rough2)">第 4 分钟</text>
  <text x="604" y="122" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">≤ m 次操作</text>
  <text x="600" y="110" text-anchor="middle" font-size="16" fill="#666666" filter="url(#rough2)">……</text>
  <rect x="60" y="154" width="600" height="44" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="173" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">把 t 降低 Δ 需要 ⌈n/2⌉·Δ 次操作，必须在一分钟内完成</text>
  <rect x="60" y="210" width="600" height="44" rx="9" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="229" text-anchor="middle" font-size="12.5" fill="#335478" filter="url(#rough2)">所以每分钟最多降 ⌊m / ⌈n/2⌉⌋，k 分钟合计 k·⌊m / ⌈n/2⌉⌋</text>
  <text x="360" y="278" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">再与 min(奇数格 aᵢ) 取较小值，就是答案</text>
</svg>
