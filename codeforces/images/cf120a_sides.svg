<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1201"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="320" fill="#fafafa"/>
  <text x="360.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两扇门与两个扶手</text>
  <path d="M 115.2 42 Q 360.0 48 604.8 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="360.0" y="306" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">1 号扶手固定在前门入口左侧</text>
  <rect x="80" y="80" width="240" height="170" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#335478" filter="url(#rough2)">front 门</text>
  <text x="140" y="160" text-anchor="middle" font-size="12" fill="#335478" filter="url(#rough2)">1 号（左）</text>
  <text x="260" y="160" text-anchor="middle" font-size="12" fill="#335478" filter="url(#rough2)">2 号（右）</text>
  <rect x="400" y="80" width="240" height="170" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="520" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5223" filter="url(#rough2)">back 门</text>
  <text x="460" y="160" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">2 号（左）</text>
  <text x="580" y="160" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">1 号（右）</text>
  <text x="360" y="285" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">进门后面向电梯内部；两门朝向相反 ⇒ 左右镜像</text>
</svg>
