<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="157"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="800" height="420" fill="#fafafa"/>
  <text x="400" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 3：沿环走一圈，把费用分成两组</text>
  <path d="M 160 40 Q 400 46 640 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <text x="60" y="86" font-size="12" fill="#2b2b2b" filter="url(#rough2)">行进方向：1 → 5 → 3 → 2 → 4 → 6 → 1</text>

  <rect x="60" y="104" width="320" height="150" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="130" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">同向边（along = 69）</text>
  <text x="76" y="156" font-size="11.5" fill="#2f5223" filter="url(#rough2)">1→5 费用 4</text>
  <text x="76" y="180" font-size="11.5" fill="#2f5223" filter="url(#rough2)">5→3 费用 8</text>
  <text x="76" y="204" font-size="11.5" fill="#2f5223" filter="url(#rough2)">2→4 费用 15</text>
  <text x="76" y="228" font-size="11.5" fill="#2f5223" filter="url(#rough2)">4→6 费用 42</text>

  <rect x="420" y="104" width="320" height="150" rx="10" fill="#fdeeee" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="436" y="130" font-size="12" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">逆向边（against = 39）</text>
  <text x="436" y="156" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">2→3 费用 23（与 3→2 相反）</text>
  <text x="436" y="180" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">1→6 费用 16（与 6→1 相反）</text>
  <text x="436" y="208" font-size="11" fill="#9a4a47" filter="url(#rough2)">把这两条翻过来即可全同向</text>

  <text x="60" y="300" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">变成“全同向”要翻逆向边：花费 39；变成“全逆向”要翻同向边：花费 69。</text>
  <text x="60" y="330" font-size="13" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">答案 = min(69, 39) = 39（与样例 3 一致）</text>
  <text x="60" y="372" font-size="11.5" fill="#555555" filter="url(#rough2)">注意：每条边的费用只会落进两组中的一组——先绕一圈确定方向，再分别求和。</text>
</svg>
