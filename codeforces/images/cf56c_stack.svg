<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2b2b2b"/>
    </marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arra" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="720" height="450" fill="#fafafa"/>
  <text x="360" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">解析 A:B.,C.. 时的祖先栈</text>
  <path d="M 200 42 Q 360 48 520 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60" y="66" width="52" height="46" rx="0" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="86" y="96" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">A</text>
  <rect x="134" y="66" width="52" height="46" rx="0" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="160" y="96" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">:</text>
  <rect x="208" y="66" width="52" height="46" rx="0" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="234" y="96" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">B</text>
  <rect x="282" y="66" width="52" height="46" rx="0" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="308" y="96" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">.</text>
  <rect x="356" y="66" width="52" height="46" rx="0" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="382" y="96" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">,</text>
  <rect x="430" y="66" width="52" height="46" rx="0" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="456" y="96" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">C</text>
  <rect x="504" y="66" width="52" height="46" rx="0" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="530" y="96" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">.</text>
  <rect x="578" y="66" width="52" height="46" rx="0" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="604" y="96" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">.</text>
  <text x="60" y="50" text-anchor="start" font-size="11" fill="#8a8a8a" filter="url(#rough2)">输入串：</text>
  <text x="110" y="178" text-anchor="middle" font-size="11.5" fill="#8a8a8a" filter="url(#rough2)">读到 B 时</text>
  <rect x="64" y="190" width="92" height="38" rx="0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="110" y="215" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5223" filter="url(#rough2)">A</text>
  <text x="300" y="178" text-anchor="middle" font-size="11.5" fill="#8a8a8a" filter="url(#rough2)">读到 C 时</text>
  <rect x="254" y="190" width="92" height="38" rx="0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="215" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5223" filter="url(#rough2)">A</text>
  <text x="490" y="178" text-anchor="middle" font-size="11.5" fill="#8a8a8a" filter="url(#rough2)">读完 C 后</text>
  <rect x="444" y="190" width="92" height="38" rx="0" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.6" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="490" y="215" text-anchor="middle" font-size="12" fill="#8a8a8a" filter="url(#rough2)">空</text>
  <text x="650" y="178" text-anchor="middle" font-size="11.5" fill="#8a8a8a" filter="url(#rough2)">全部结束</text>
  <rect x="604" y="190" width="92" height="38" rx="0" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.6" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="650" y="215" text-anchor="middle" font-size="12" fill="#8a8a8a" filter="url(#rough2)">空</text>
  <line x1="140" y1="170" x2="150" y2="186" stroke="#446688" stroke-width="1.6" opacity="1.0" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <line x1="330" y1="170" x2="340" y2="186" stroke="#446688" stroke-width="1.6" opacity="1.0" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <line x1="520" y1="170" x2="520" y2="186" stroke="#446688" stroke-width="1.6" opacity="1.0" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="110" y="268" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">遇 : 压栈</text>
  <text x="300" y="268" text-anchor="middle" font-size="10.5" fill="#8a8a8a" filter="url(#rough2)">B 结束遇 ,</text>
  <text x="300" y="286" text-anchor="middle" font-size="10.5" fill="#8a8a8a" filter="url(#rough2)">栈不变</text>
  <text x="490" y="268" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">C 结束遇 .</text>
  <text x="490" y="286" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">弹一层</text>
  <text x="650" y="268" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">再遇 .</text>
  <text x="380" y="360" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">栈里的名字 = 当前员工的所有祖先（不限直接上级）</text>
  <text x="380" y="390" text-anchor="middle" font-size="12.5" fill="#8a8a8a" filter="url(#rough2)">读到一个名字时，数一数栈中同名者的个数即可</text>
  <text x="380" y="422" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">兄弟共享父节点：遇到逗号不弹栈</text>
</svg>
