<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="720" height="290" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">先把时间统一成「2012 年内的秒数」，跨天/跨月都自然连续</text>
  <rect x="40" y="56" width="300" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="190" y="88" text-anchor="middle" font-size="12" fill="#2f4a66">2012-03-16 23:59:59</text>
  <rect x="380" y="56" width="300" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="530" y="88" text-anchor="middle" font-size="12" fill="#2f5223">秒 = 月初偏移 + 日 + 时 + 分 + 秒</text>
  <rect x="40" y="136" width="300" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="190" y="168" text-anchor="middle" font-size="12" fill="#2f4a66">2012-03-17 00:00:00</text>
  <rect x="380" y="136" width="300" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="530" y="168" text-anchor="middle" font-size="12" fill="#2f5223">= 前一天 24:00:00（连续 +1 秒）</text>
  <text x="40" y="228" text-anchor="start" font-size="11.5" fill="#7a4b22" filter="url(#rough2)">闰年 2012：2 月有 29 天，月初天数前缀和要按 {31,29,31,30,…} 算</text>
  <text x="40" y="256" text-anchor="start" font-size="11.5" fill="#7a4b22" filter="url(#rough2)">消息部分可能含空格与标点，只解析前 19 个字符即可</text>
</svg>
