<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="300" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">把 i 的球依次放进 i+1, i+2, ...（循环）</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">每个盒子拿到 floor 或 floor+1 个球；最后一个球落在 x</text>
  <g filter="url(#rough2)"><rect x="120" y="100" width="560" height="40" rx="3" fill="#eeeeee" fill-opacity="0.5" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="400" y="90" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">i 被清空，之后按顺序发球</text>
  <text x="160" y="170" text-anchor="start" font-size="13" fill="#2f4a66" filter="url(#rough2)">c 个球：完整轮数 R = c/n，余数 s = c%n</text>
  <text x="160" y="208" text-anchor="start" font-size="13" fill="#2f4a66" filter="url(#rough2)">位置 i+1..i+s 各多拿 1 个</text>
  <text x="160" y="248" text-anchor="start" font-size="13" fill="#3d6b2f" filter="url(#rough2)">最后一个球在 i+c ≡ x (mod n)</text>
</svg>
