<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="405"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="440" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">194B：周长 4n，每走 n+1 米画一个十字</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="180.0" y="110.0" width="200.0" height="200.0" fill="#ffffff" stroke="#999999" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="180.0" cy="310.0" r="7.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="230.0" cy="110.0" r="7.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="380.0" cy="210.0" r="7.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="230.0" cy="310.0" r="7.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="150.0" y="340.0" text-anchor="start" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">起点</text>
  <rect x="420.0" y="90.0" width="260.0" height="100.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="434.0" y="112.8" text-anchor="start" font-size="10.8" fill="#3f3420" filter="url(#rough2)">n=4：每 5 米一个十字</text>
  <text x="434.0" y="136.8" text-anchor="start" font-size="10.8" fill="#3f3420" filter="url(#rough2)">周长 16；5k ≡ 0 (mod 16) 的最小 k=16</text>
  <text x="434.0" y="160.8" text-anchor="start" font-size="10.8" fill="#3f3420" filter="url(#rough2)">共 16+1 = 17 个十字</text>
  <rect x="60.0" y="360.0" width="620.0" height="56.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="74.0" y="383.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">答案 = 4n / gcd(n+1, 4) + 1（gcd(n+1,4n)=gcd(n+1,4)）</text>
</svg>
