<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320" viewBox="0 0 700 320"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="701"/>
    <feDisplacementMap in="SourceGraphic" scale="1.5"/></filter></defs>
  <rect width="700" height="320" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">足迹串只有三种形态：全 R、全 L、R…R L…L</text>
  <path d="M 110 40 Q 350 46 590 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="76" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="12.5" fill="#22314a" filter="url(#rough2)">每个格子的足迹 = 它「最后一次离开」的方向（没离开过就是 "."）。</text>
  <text x="76" y="106" font-size="12.5" fill="#22314a" filter="url(#rough2)">因为走法是一条路径，所以不可能出现 "L 在前、R 在后"：走到左边就得先往左，</text>
  <text x="76" y="130" font-size="12.5" fill="#22314a" filter="url(#rough2)">之后若再往右，会把左边的 L 全改成 R ⇒ 只可能是 R…R L…L（两段之一可空）。</text>
  <g filter="url(#rough2)"><rect x="60" y="146" width="580" height="86" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="76" y="170" font-size="12.5" fill="#8a6015" filter="url(#rough2)">设足迹范围 [A..C]（A 第一个、C 最后一个）、最后一个 R 在 B（没有 R 则全 L）：</text>
  <text x="76" y="194" font-size="12.5" fill="#8a6015" filter="url(#rough2)">全 L：从 C 一路向左到 A−1 ⇒ (C, A−1)</text>
  <text x="76" y="218" font-size="12.5" fill="#8a6015" filter="url(#rough2)">全 R：从 A 一路向右到 C+1 ⇒ (A, C+1)</text>
  <text x="76" y="228" font-size="12" fill="#8a6015" filter="url(#rough2)">R…L：A → … → C → … → B+1（先右到头再左回到 B+1）⇒ (A, B+1)</text>
  <g filter="url(#rough2)"><rect x="60" y="242" width="580" height="66" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="266" font-size="12.5" fill="#2f5223" filter="url(#rough2)">样例 1 "..RRLL..."：A=3,B=4,C=6 ⇒ (3,5)，走 3→4→5→6→5 ⇒ 足迹 R,R,L,L ✓</text>
  <text x="76" y="290" font-size="12.5" fill="#2f5223" filter="url(#rough2)">本题多解：官方样例给的是 (3,4)，同样合法（走 3→4→5→6→…→4 也成立）。</text>
  <text x="76" y="308" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">只要 (s,t) 能复现足迹即可，checker 用"长度受限搜索"验证。</text>
</svg>
