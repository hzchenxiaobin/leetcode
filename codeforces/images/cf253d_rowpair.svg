<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="420" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">固定两行之后，列方向只剩一维问题</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">在每个列对上只关心两件事：这段里 a 的个数，以及两行同列的字母是否相同</text>
  <text x="120" y="124" text-anchor="end" font-size="12.5" fill="#555555" filter="url(#rough2)">第 2 行</text>
  <g filter="url(#rough2)"><rect x="140" y="96" width="50" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="165.0" y="123.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">b</text>
  <g filter="url(#rough2)"><rect x="196" y="96" width="50" height="44" rx="4" fill="#f6d9d7" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="221.0" y="123.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">a</text>
  <g filter="url(#rough2)"><rect x="252" y="96" width="50" height="44" rx="4" fill="#f6d9d7" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="277.0" y="123.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">a</text>
  <g filter="url(#rough2)"><rect x="308" y="96" width="50" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="333.0" y="123.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">b</text>
  <text x="120" y="176" text-anchor="end" font-size="12.5" fill="#555555" filter="url(#rough2)">第 3 行</text>
  <g filter="url(#rough2)"><rect x="140" y="148" width="50" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="165.0" y="175.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">b</text>
  <g filter="url(#rough2)"><rect x="196" y="148" width="50" height="44" rx="4" fill="#f6d9d7" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="221.0" y="175.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">a</text>
  <g filter="url(#rough2)"><rect x="252" y="148" width="50" height="44" rx="4" fill="#f6d9d7" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="277.0" y="175.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">a</text>
  <g filter="url(#rough2)"><rect x="308" y="148" width="50" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="333.0" y="175.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">b</text>
  <text x="120" y="236" text-anchor="end" font-size="12.5" fill="#555555" filter="url(#rough2)">列号</text>
  <text x="165" y="236" text-anchor="middle" font-size="12.5" fill="#666666" filter="url(#rough2)">1</text>
  <text x="221" y="236" text-anchor="middle" font-size="12.5" fill="#666666" filter="url(#rough2)">2</text>
  <text x="277" y="236" text-anchor="middle" font-size="12.5" fill="#666666" filter="url(#rough2)">3</text>
  <text x="333" y="236" text-anchor="middle" font-size="12.5" fill="#666666" filter="url(#rough2)">4</text>
  <path d="M140,262 L140,282 L364,282 L364,262" fill="none" stroke="#b05a5a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="252" y="306" text-anchor="middle" font-size="12.5" fill="#b05a5a" filter="url(#rough2)">窗口 [y1, y2]：列里 a 的个数之和 ≤ k</text>
  <text x="470" y="120" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">判据：两行在这一列字母相同</text>
  <text x="470" y="146" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">四个角 → 只数"两行同字母"的列</text>
  <text x="470" y="172" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">同字母列数用 26 个计数桶维护</text>
  <text x="470" y="210" text-anchor="start" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">双指针：右端逐列右移，</text>
  <text x="470" y="234" text-anchor="start" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">"a 太多"时左端跟着右移</text>
  <text x="440" y="352" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">行对 O(n^2) 个，每个行对 O(m) → 总复杂度 O(n^2 m)</text>
  <text x="440" y="382" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">n = m = 400 时约 3.2×10^7 次操作</text>
</svg>
