<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" width="720" height="450"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="450" fill="#fafafa"/>

  <text x="360" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">集中原则：从短段搬一天给长段，总额只增不减</text>
  <path d="M 158 46 Q 360 53 562 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="360" y="68" text-anchor="middle" font-size="12.5" fill="#66788c" filter="url(#rough2)">设两段长 a ≥ b ≥ 2，把 b 的 1 天移给 a，段长变成 a+1 与 b−1</text>

  <!-- 搬之前 -->
  <text x="86" y="118" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">搬之前</text>
  <rect x="210" y="94" width="40" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="250" y="94" width="40" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="290" y="94" width="40" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="152" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">a = 3</text>
  <rect x="400" y="94" width="40" height="38" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="440" y="94" width="40" height="38" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="440" y="152" text-anchor="middle" font-size="13" fill="#8a3a36" filter="url(#rough2)">b = 2</text>
  <text x="512" y="120" font-size="13" fill="#b85450" filter="url(#rough2)">2^3 + 2^2 = 12</text>

  <!-- 箭头 -->
  <path d="M 300 166 L 300 204" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="316" y="192" font-size="12" fill="#b85450" filter="url(#rough2)">粉色段里的一天挪给蓝色段</text>

  <!-- 搬之后 -->
  <text x="86" y="232" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">搬之后</text>
  <rect x="210" y="208" width="40" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="250" y="208" width="40" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="290" y="208" width="40" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="330" y="208" width="40" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="266" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">a+1 = 4</text>
  <rect x="400" y="208" width="40" height="38" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="420" y="266" text-anchor="middle" font-size="13" fill="#8a3a36" filter="url(#rough2)">b−1 = 1</text>
  <text x="512" y="234" font-size="13" fill="#4a7a3a" filter="url(#rough2)">2^4 + 2^1 = 18</text>

  <!-- 差值 -->
  <rect x="120" y="286" width="480" height="42" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="136" y="312" font-size="12.5" fill="#3a5a30" filter="url(#rough2)">差额 = 2^(a+1) + 2^(b−1) − 2^a − 2^b = 2^a − 2^(b−1) ≥ 2^(b−1) &gt; 0</text>

  <!-- 结论 -->
  <rect x="90" y="342" width="540" height="52" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="106" y="366" font-size="12.5" fill="#8a6a20" filter="url(#rough2)">故最优时不存在「两段都 ≥ 2」：至多一段长 ≥ 2，其余 k−1 段都只能是 1。</text>
  <text x="106" y="384" font-size="12.5" fill="#8a6a20" filter="url(#rough2)">形状唯一：k−1 段取 1，剩下那段取 n − (k−1) = n−k+1。</text>

  <text x="360" y="420" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">总额 = 2^(n−k+1) + (k−1) × 2^1 = 2^(n−k+1) + 2(k−1)</text>
  <text x="360" y="440" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">凸性直觉：2^L 增长太快，把天数堆在一起远比摊平分到的多</text>
</svg>
