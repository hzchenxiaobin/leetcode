<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="369"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="320" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">先造 b 个 Wow（和翻倍），再造 a 个 Oh（最大值 +1）</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">Wow：t &gt; 前缀和；Oh：t &gt; 前缀最大值且 t ≤ 前缀和</text>
  <g filter="url(#rough2)"><rect x="65" y="104" width="104" height="62" rx="5" fill="#cfe0f5" fill-opacity="0.75" stroke="#446688" stroke-width="1.4"/></g>
  <text x="117" y="128" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="117" y="152" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">初始</text>
  <g filter="url(#rough2)"><rect x="183" y="104" width="104" height="62" rx="5" fill="#f6e3c4" fill-opacity="0.75" stroke="#b06a1e" stroke-width="1.4"/></g>
  <text x="235" y="128" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="235" y="152" text-anchor="middle" font-size="10.5" fill="#b06a1e" filter="url(#rough2)">Wow</text>
  <g filter="url(#rough2)"><rect x="301" y="104" width="104" height="62" rx="5" fill="#dcecd2" fill-opacity="0.75" stroke="#b06a1e" stroke-width="1.4"/></g>
  <text x="353" y="128" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="353" y="152" text-anchor="middle" font-size="10.5" fill="#b06a1e" filter="url(#rough2)">Wow</text>
  <g filter="url(#rough2)"><rect x="419" y="104" width="104" height="62" rx="5" fill="#f3d9d6" fill-opacity="0.75" stroke="#b06a1e" stroke-width="1.4"/></g>
  <text x="471" y="128" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="471" y="152" text-anchor="middle" font-size="10.5" fill="#b06a1e" filter="url(#rough2)">Wow</text>
  <g filter="url(#rough2)"><rect x="537" y="104" width="104" height="62" rx="5" fill="#cfe0f5" fill-opacity="0.75" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="589" y="128" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="589" y="152" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">Oh</text>
  <g filter="url(#rough2)"><rect x="655" y="104" width="104" height="62" rx="5" fill="#f6e3c4" fill-opacity="0.75" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="707" y="128" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">10</text>
  <text x="707" y="152" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">Oh</text>
  <g filter="url(#rough2)"><rect x="773" y="104" width="104" height="62" rx="5" fill="#ffffff" fill-opacity="0.25" stroke="#666666" stroke-width="1.4"/></g>
  <text x="825" y="128" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="825" y="152" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">中性</text>
  <text x="450" y="206" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">n = 10, a = 2, b = 3 ⇒  1 2 4 8 9 10 1 1 1 1</text>
  <g filter="url(#rough2)"><rect x="60" y="232" width="780" height="66" rx="6" fill="#f3d9d6" fill-opacity="0.4" stroke="#8a2b28" stroke-width="1.4"/></g>
  <text x="450" y="258" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">b ≤ 15 ⇒ 最大约 2^15 = 32768 &lt; 50000；Oh 每次只 +1，安全</text>
  <text x="450" y="282" text-anchor="middle" font-size="11" fill="#8a2b28" filter="url(#rough2)">若 b = 0 但 a &gt; 0，要先垫一个中性元素，否则第一个感叹必然是 Wow</text>
</svg>
