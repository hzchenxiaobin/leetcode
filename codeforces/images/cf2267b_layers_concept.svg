<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="800" height="480" fill="#fafafa"/>

  <text x="400" y="30" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心构造：把每个值当成一列，第 ℓ 层就是每个值各取第 ℓ 个副本</text>
  <path d="M 88 40 Q 400 48 712 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 左：计数柱状格 -->
  <text x="64" y="66" font-size="12.5" fill="#6a6a6a" filter="url(#rough2)">样例 [1,1,4,2,3,3,3,2] 的计数</text>

  <text x="120" y="94" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">值 4</text>
  <text x="230" y="94" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">值 3</text>
  <text x="340" y="94" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">值 2</text>
  <text x="450" y="94" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">值 1</text>

  <text x="52" y="130" text-anchor="end" font-size="12" fill="#4a7a3a" filter="url(#rough2)">第 1 层</text>
  <text x="52" y="184" text-anchor="end" font-size="12" fill="#8a6015" filter="url(#rough2)">第 2 层</text>
  <text x="52" y="238" text-anchor="end" font-size="12" fill="#8c3b38" filter="url(#rough2)">第 3 层</text>

  <!-- 第 1 层 -->
  <rect x="78" y="108" width="84" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="134" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">4</text>
  <rect x="188" y="108" width="84" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="230" y="134" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">3</text>
  <rect x="298" y="108" width="84" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="340" y="134" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">2</text>
  <rect x="408" y="108" width="84" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="450" y="134" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">1</text>

  <!-- 第 2 层 -->
  <rect x="188" y="162" width="84" height="42" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="230" y="188" text-anchor="middle" font-size="14" fill="#3c5e2e" filter="url(#rough2)">3</text>
  <rect x="298" y="162" width="84" height="42" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="340" y="188" text-anchor="middle" font-size="14" fill="#3c5e2e" filter="url(#rough2)">2</text>
  <rect x="408" y="162" width="84" height="42" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="450" y="188" text-anchor="middle" font-size="14" fill="#3c5e2e" filter="url(#rough2)">1</text>

  <!-- 第 3 层 -->
  <rect x="188" y="216" width="84" height="42" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="230" y="242" text-anchor="middle" font-size="14" fill="#8a6015" filter="url(#rough2)">3</text>

  <!-- 右侧说明 -->
  <rect x="524" y="106" width="248" height="152" rx="10" fill="none" stroke="#a9a9a9" stroke-width="1.3"
        stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="538" y="130" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">第 ℓ 层 = 所有 cnt[v] ≥ ℓ 的值</text>
  <text x="538" y="151" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">各取一个副本，层内按值降序</text>
  <text x="538" y="180" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">层 ℓ 结束时的前缀众数</text>
  <text x="538" y="201" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">= V_ℓ = max{ v : cnt[v] ≥ ℓ }</text>
  <text x="538" y="230" font-size="12.5" fill="#8c3b38" filter="url(#rough2)">层内众数始终是 V_ℓ，不会掉</text>
  <text x="538" y="250" font-size="12.5" fill="#8c3b38" filter="url(#rough2)">（并列时取最大值，正是 V_ℓ）</text>

  <!-- 输出序列 -->
  <text x="60" y="292" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">输出序列</text>
  <path d="M 130 288 L 232 288" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="64" y="304" width="72" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="100" y="333" text-anchor="middle" font-size="15" fill="#2f4a66" filter="url(#rough2)">4</text>
  <rect x="142" y="304" width="72" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="178" y="333" text-anchor="middle" font-size="15" fill="#2f4a66" filter="url(#rough2)">3</text>
  <rect x="220" y="304" width="72" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="256" y="333" text-anchor="middle" font-size="15" fill="#2f4a66" filter="url(#rough2)">2</text>
  <rect x="298" y="304" width="72" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="334" y="333" text-anchor="middle" font-size="15" fill="#2f4a66" filter="url(#rough2)">1</text>

  <rect x="376" y="304" width="72" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="412" y="333" text-anchor="middle" font-size="15" fill="#3c5e2e" filter="url(#rough2)">3</text>
  <rect x="454" y="304" width="72" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="490" y="333" text-anchor="middle" font-size="15" fill="#3c5e2e" filter="url(#rough2)">2</text>
  <rect x="532" y="304" width="72" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="568" y="333" text-anchor="middle" font-size="15" fill="#3c5e2e" filter="url(#rough2)">1</text>

  <rect x="610" y="304" width="72" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="646" y="333" text-anchor="middle" font-size="15" fill="#8a6015" filter="url(#rough2)">3</text>

  <!-- 前缀众数 -->
  <text x="100" y="372" text-anchor="middle" font-size="12.5" fill="#8c3b38" filter="url(#rough2)">4</text>
  <text x="178" y="372" text-anchor="middle" font-size="12.5" fill="#8c3b38" filter="url(#rough2)">4</text>
  <text x="256" y="372" text-anchor="middle" font-size="12.5" fill="#8c3b38" filter="url(#rough2)">4</text>
  <text x="334" y="372" text-anchor="middle" font-size="12.5" fill="#8c3b38" filter="url(#rough2)">4</text>
  <text x="412" y="372" text-anchor="middle" font-size="12.5" fill="#8c3b38" filter="url(#rough2)">3</text>
  <text x="490" y="372" text-anchor="middle" font-size="12.5" fill="#8c3b38" filter="url(#rough2)">3</text>
  <text x="568" y="372" text-anchor="middle" font-size="12.5" fill="#8c3b38" filter="url(#rough2)">3</text>
  <text x="646" y="372" text-anchor="middle" font-size="12.5" fill="#8c3b38" filter="url(#rough2)">3</text>
  <text x="712" y="372" font-size="11.5" fill="#8c3b38" filter="url(#rough2)">← 前缀众数</text>

  <!-- 层括号 -->
  <path d="M 64 388 L 64 398 L 370 398 L 370 388" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="217" y="416" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">第 1 层（4 个）</text>
  <path d="M 376 388 L 376 398 L 604 398 L 604 388" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="490" y="416" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">第 2 层（3 个）</text>
  <path d="M 610 388 L 610 398 L 682 398 L 682 388" stroke="#d6a040" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="646" y="416" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">第 3 层</text>

  <text x="400" y="446" text-anchor="middle" font-size="12.5" fill="#5a5a5a" filter="url(#rough2)">前缀众数序列 4,4,4,4,3,3,3,3，总和 4·4 + 3·4 = 28（与该样例最优解相同）</text>
  <text x="400" y="468" text-anchor="middle" font-size="12.5" fill="#5a5a5a" filter="url(#rough2)">每个值 v 恰好被输出 cnt[v] 次，所以输出一定是原数组的一个排列</text>
</svg>
