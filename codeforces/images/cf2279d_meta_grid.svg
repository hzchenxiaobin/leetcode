<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>

  <text x="320" y="27" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">f(G) 是 n×n 个状态：横向「走路」，斜向「交换」</text>
  <text x="320" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">例：G = 1—2—3；状态 p_q 读作（第一坐标 p，第二坐标 q）</text>
  <text x="320" y="66" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">列 = 第二坐标 q　　行 = 第一坐标 p</text>

  <!-- column headers -->
  <text x="215" y="96" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">q = 1</text>
  <text x="335" y="96" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">q = 2</text>
  <text x="455" y="96" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">q = 3</text>

  <!-- row headers -->
  <text x="158" y="134" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">p = 1</text>
  <text x="158" y="219" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">p = 2</text>
  <text x="158" y="304" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">p = 3</text>

  <!-- walk edges (blue solid) -->
  <line x1="255" y1="130" x2="295" y2="130" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="375" y1="130" x2="415" y2="130" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="255" y1="215" x2="295" y2="215" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="375" y1="215" x2="415" y2="215" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="255" y1="300" x2="295" y2="300" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="375" y1="300" x2="415" y2="300" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- swap edges (orange dashed) -->
  <line x1="306" y1="151" x2="244" y2="194" stroke="#d6a040" stroke-width="2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <line x1="426" y1="236" x2="364" y2="279" stroke="#d6a040" stroke-width="2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="252" y="176" text-anchor="middle" font-size="9.5" fill="#b8873a" filter="url(#rough2)">交换</text>
  <text x="418" y="261" text-anchor="middle" font-size="9.5" fill="#b8873a" filter="url(#rough2)">交换</text>

  <!-- 3x3 state boxes -->
  <rect x="175" y="110" width="80" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2.4" rx="6" filter="url(#rough2)"/>
  <text x="215" y="135" text-anchor="middle" font-size="13" fill="#2c4a66" filter="url(#rough2)">1_1</text>
  <rect x="295" y="110" width="80" height="40" fill="#f2f2f2" stroke="#999" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="335" y="135" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1_2</text>
  <rect x="415" y="110" width="80" height="40" fill="#f2f2f2" stroke="#999" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="455" y="135" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1_3</text>

  <rect x="175" y="195" width="80" height="40" fill="#f2f2f2" stroke="#999" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="215" y="220" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2_1</text>
  <rect x="295" y="195" width="80" height="40" fill="#f2f2f2" stroke="#999" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="335" y="220" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2_2</text>
  <rect x="415" y="195" width="80" height="40" fill="#f2f2f2" stroke="#999" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="455" y="220" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2_3</text>

  <rect x="175" y="280" width="80" height="40" fill="#f2f2f2" stroke="#999" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="215" y="305" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3_1</text>
  <rect x="295" y="280" width="80" height="40" fill="#f2f2f2" stroke="#999" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="335" y="305" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3_2</text>
  <rect x="415" y="280" width="80" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="6" filter="url(#rough2)"/>
  <text x="455" y="305" text-anchor="middle" font-size="13" fill="#33591f" filter="url(#rough2)">3_3</text>

  <!-- separator -->
  <line x1="50" y1="338" x2="590" y2="338" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- legend -->
  <rect x="52" y="352" width="26" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="88" y="365" font-size="10.5" fill="#555" filter="url(#rough2)">蓝框 = 起点 w_x</text>
  <rect x="330" y="352" width="26" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="366" y="365" font-size="10.5" fill="#555" filter="url(#rough2)">绿框 = 终点 y_z</text>

  <line x1="52" y1="388" x2="78" y2="388" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="88" y="393" font-size="10.5" fill="#555" filter="url(#rough2)">走路：(p,q)→(p,q′)，代价 d_G(q,q′)</text>
  <line x1="330" y1="388" x2="356" y2="388" stroke="#d6a040" stroke-width="2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="366" y="393" font-size="10.5" fill="#555" filter="url(#rough2)">交换：(p,q)→(q,p)，需 p~q，代价 1</text>
</svg>
