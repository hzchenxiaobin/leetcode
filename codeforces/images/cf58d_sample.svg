<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="589"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="330" fill="#fafafa"/>
  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1 走查：b a a h g c，分隔符 '.'，每行长度 4</text>
  <path d="M 60 40 Q 380 48 700 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <text x="36" y="72" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">名字按长度分组并排序</text>
  <rect x="36" y="82" width="200" height="44" rx="7" fill="#cfe0f5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="50" y="102" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">长度 1：b, c</text>
  <text x="50" y="118" font-size="9.5" fill="#555" filter="url(#rough2)">（b &lt; c）</text>
  <rect x="36" y="134" width="200" height="44" rx="7" fill="#d9ecd4" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="50" y="154" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">长度 2：aa, hg</text>
  <text x="50" y="170" font-size="9.5" fill="#555" filter="url(#rough2)">（aa &lt; hg）</text>

  <text x="256" y="104" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">总长 6，n/2 = 2 → L = 4，T = 3</text>
  <text x="256" y="124" font-size="10.8" fill="#8a2b28" filter="url(#rough2)">长度 1 与长度 2 互补，按顺序配对</text>
  <text x="256" y="156" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">第 1 小 b ↔ 第 1 小 aa</text>
  <text x="256" y="176" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">第 2 小 c ↔ 第 2 小 hg</text>

  <rect x="470" y="82" width="250" height="44" rx="7" fill="#fbe3c8" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="484" y="102" font-size="10.6" fill="#2b2b2b" filter="url(#rough2)">{b, aa} → min("b.aa", "aa.b")</text>
  <text x="484" y="118" font-size="10.6" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">= "aa.b"（a &lt; b）</text>
  <rect x="470" y="134" width="250" height="44" rx="7" fill="#e8e0f5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="484" y="154" font-size="10.6" fill="#2b2b2b" filter="url(#rough2)">{c, hg} → min("c.hg", "hg.c")</text>
  <text x="484" y="170" font-size="10.6" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">= "c.hg"（c &lt; h）</text>

  <path d="M 240 104 L 466 104" stroke="#446688" stroke-width="1.4" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 240 156 L 466 156" stroke="#446688" stroke-width="1.4" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <rect x="36" y="196" width="330" height="56" rx="8" fill="#d9ecd4" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="50" y="218" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">两行按字典序排序：</text>
  <text x="50" y="238" font-size="11" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">"aa.b" &lt; "c.hg" → 直接依次输出</text>

  <rect x="36" y="262" width="684" height="52" rx="9" fill="#cfe0f5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="50" y="282" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">三个官方样例输出：b aa hg c / '.' → "aa.b"、"c.hg"；aa a / '!' → "a!aa"；aa a / '|' → "aa|a"。</text>
  <text x="50" y="302" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">每个名字恰好用一次，行内恰好一个分隔符，所有行等长——输出就是这 n/2 行，按字典序升序排列。</text>
</svg>
