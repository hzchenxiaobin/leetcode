<svg xmlns="http://www.w3.org/2000/svg" width="740" height="400" viewBox="0 0 740 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="97"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="740" height="400" fill="#fafafa"/>

  <text x="370" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按位数分段：每段只需试 l、r 与“夹住中点的那个数”</text>
  <path d="M 148 39 Q 370 45 592 39" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="30" y="62" width="200" height="46" rx="8" fill="#f3e9f7" stroke="#7a4a86" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="130" y="91" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a4a86" filter="url(#rough2)">1 位数 [1, 9]</text>
  <text x="246" y="91" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">中点 4.5 → 4 或 5</text>
  <text x="500" y="91" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">w = 4·5 = 20</text>
  <rect x="30" y="116" width="200" height="46" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="130" y="145" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">2 位数 [10, 99]</text>
  <text x="246" y="145" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">中点 49.5 → 49 或 50</text>
  <text x="500" y="145" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">w = 49·50 = 2450</text>
  <rect x="30" y="170" width="200" height="46" rx="8" fill="#e9f4ec" stroke="#3f6b4a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="130" y="199" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">3 位数 [100, 999]</text>
  <text x="246" y="199" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">中点 499.5 → 499 或 500</text>
  <text x="500" y="199" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">w = 499·500 = 249500</text>
  <rect x="30" y="224" width="200" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="130" y="253" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#d6a040" filter="url(#rough2)">10 位数 [10⁹, 10⁹]</text>
  <text x="246" y="253" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">区间只有一个点 10⁹</text>
  <text x="500" y="253" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">w = 10⁹·(10¹⁰−1−10⁹)</text>
  <rect x="30" y="288" width="680" height="46" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="46" y="316" text-anchor="start" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">给定 [l, r] 后，对每个位数 d 把区间夹成 [max(l, 10^{d−1}), min(r, 10^d − 1)]，</text>
  <text x="46" y="342" text-anchor="start" font-size="12" fill="#2f4a66" filter="url(#rough2)">再取端点与中点附近的几个候选，取最大重量即可（共 O(10) 次计算）。</text>
  <text x="30" y="370" text-anchor="start" font-size="11.5" fill="#5b5b5b" filter="url(#rough2)">注意：位数越多 ψ 越大，但区间可能只覆盖高位数段的一部分，所以要逐段算。</text>
</svg>
