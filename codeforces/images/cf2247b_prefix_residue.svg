<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="330" fill="#fafafa" filter="url(#rough2)"/>

  <text x="320" y="32" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    前缀余数：子段和 ≡ 0 (mod m) 当且仅当两个前缀余数相等
  </text>

  <text x="58" y="92" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">a =</text>

  <rect x="90" y="68" width="54" height="40" rx="4" fill="#fff8e1" stroke="#d6a040"
        stroke-width="2" filter="url(#rough2)"/>
  <rect x="152" y="68" width="54" height="40" rx="4" fill="#fff8e1" stroke="#d6a040"
        stroke-width="2" filter="url(#rough2)"/>
  <rect x="214" y="68" width="54" height="40" rx="4" fill="#fff8e1" stroke="#d6a040"
        stroke-width="2" filter="url(#rough2)"/>
  <rect x="276" y="68" width="54" height="40" rx="4" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="338" y="68" width="54" height="40" rx="4" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>

  <text x="117" y="94" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="179" y="94" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="241" y="94" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <text x="303" y="94" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="365" y="94" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>

  <path d="M117,110 L117,132" stroke="#b85450" stroke-width="1.6"
        marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M179,110 L179,132" stroke="#b85450" stroke-width="1.6"
        marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M241,110 L241,132" stroke="#b85450" stroke-width="1.6"
        marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M303,110 L303,132" stroke="#b85450" stroke-width="1.6"
        marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M365,110 L365,132" stroke="#b85450" stroke-width="1.6"
        marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="40" y="140" width="46" height="36" rx="4" fill="#fce4ec" stroke="#b85450"
        stroke-width="2" filter="url(#rough2)"/>
  <rect x="102" y="140" width="46" height="36" rx="4" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="164" y="140" width="46" height="36" rx="4" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="226" y="140" width="46" height="36" rx="4" fill="#fce4ec" stroke="#b85450"
        stroke-width="2" filter="url(#rough2)"/>
  <rect x="288" y="140" width="46" height="36" rx="4" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="350" y="140" width="46" height="36" rx="4" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>

  <text x="63" y="164" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <text x="125" y="164" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="187" y="164" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <text x="249" y="164" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <text x="311" y="164" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="373" y="164" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>

  <text x="63" y="196" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">p0</text>
  <text x="125" y="196" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">p1</text>
  <text x="187" y="196" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">p2</text>
  <text x="249" y="196" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">p3</text>
  <text x="311" y="196" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">p4</text>
  <text x="373" y="196" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">p5</text>

  <path d="M63,202 L63,216 L249,216 L249,202" stroke="#b85450" stroke-width="1.8"
        fill="none" filter="url(#rough2)"/>
  <text x="156" y="236" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">
    距离 3 - 0 = 3，即子段长度 3
  </text>

  <text x="320" y="272" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    p0 = p3 = 0 ⇒ a1 + a2 + a3 = 5 ≡ 0 (mod 5)
  </text>
  <text x="320" y="302" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">
    最短整除子段长度 = 最小的 j - i，满足 pi = pj
  </text>

  <rect x="452" y="60" width="162" height="112" rx="8" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="533" y="86" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">下标差 = 长度</text>
  <text x="533" y="114" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">l-1 与 r 处</text>
  <text x="533" y="140" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">余数相同</text>
  <text x="533" y="164" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">⇒ 变成“距离”问题</text>
</svg>
