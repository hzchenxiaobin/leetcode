<svg xmlns="http://www.w3.org/2000/svg" width="700" height="280" viewBox="0 0 700 280"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="1603"/>
    <feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></defs>
  <rect width="700" height="280" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">答案 = 匹配后各对"和 mod m"的降序排列</text>
  <path d="M 140 40 Q 350 46 560 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="76" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="12.5" fill="#22314a">两侧都能任意重排 ⇒ 结果只取决于"如何把 A 与 B 配对"。</text>
  <text x="76" y="106" font-size="12.5" fill="#22314a">要字典序最大 ⇒ 让结果数字从大到小尽量多 ⇒ 从目标 d = m−1 往下贪心。</text>
  <text x="76" y="130" font-size="12.5" fill="#22314a">对固定 d，a 只能配 b = (d − a) mod m（这是值集上的对合）⇒ 可配对数 = Σ_a min(cntA[a], cntB[(d−a) mod m])</text>
  <g filter="url(#rough2)"><rect x="60" y="152" width="580" height="66" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="176" font-size="12.5" fill="#2f5223">实现：维护两侧"还有货"的值列表，每轮扫较小的一侧（否则会退化成 O(m²)）。</text>
  <text x="76" y="200" font-size="12.5" fill="#2f5223">样例 1：A=5 4 3 2、B=5 6 5 4（m=7）⇒ 6 4 2 1 ✓</text>
  <g filter="url(#rough2)"><rect x="60" y="228" width="580" height="40" rx="8" fill="#fbeeee" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="76" y="251" font-size="12.5" fill="#8a3a36">易错：贪心必须"整层取完再往下"，且输出按降序（可任意重排结果位）。</text>
</svg>
