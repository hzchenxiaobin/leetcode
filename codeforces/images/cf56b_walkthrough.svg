  <text x="250.0" y="340" text-anchor="middle" font-size="17" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">3</text>
  <rect x="298" y="300" width="76" height="64" rx="0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="336.0" y="340" text-anchor="middle" font-size="17" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">4</text>
