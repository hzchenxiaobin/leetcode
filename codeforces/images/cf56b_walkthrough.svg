  <line x1="250.0" y1="300" x2="422.0" y2="160" stroke="#b85450" stroke-width="1.5" opacity="0.75" filter="url(#rough2)"/>
  <line x1="164.0" y1="300" x2="508.0" y2="160" stroke="#b85450" stroke-width="1.5" opacity="0.75" filter="url(#rough2)"/>
  <text x="380" y="208" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">位置 k 的值来自原序列的 l + r - k</text>
  <text x="380" y="404" text-anchor="middle" font-size="13" fill="#8a8a8a" filter="url(#rough2)">1、7、8 三位不动；中心位置 4 翻转后仍是 4</text>
  <text x="380" y="432" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">检查全部通过 → 输出 2 6</text>
