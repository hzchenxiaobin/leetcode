  <rect width="760" height="450" fill="#fafafa"/>
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1：翻转 [2,6] 的对称配对</text>
