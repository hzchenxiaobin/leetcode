<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="4"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa" filter="url(#rough2)"/>
  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">判定流程：比较 n+1 个元素的多重集</text>

  <!-- 1 -->
  <rect x="100" y="52" width="360" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">读入 n、数组 a、数组 b（多测逐组处理）</text>
  <path d="M280,98 L280,118" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2 -->
  <rect x="100" y="118" width="360" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="146" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">求 σ_a = a₁⊕a₂⊕…⊕a_n，σ_b 同理</text>
  <path d="M280,164 L280,184" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3 -->
  <rect x="100" y="184" width="360" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="212" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">M_a = {σ_a} ∪ {σ_a⊕a₁, …, σ_a⊕a_n}，排序</text>
  <path d="M280,230 L280,250" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 4 -->
  <rect x="100" y="250" width="360" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="278" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">M_b = {σ_b} ∪ {σ_b⊕b₁, …, σ_b⊕b_n}，排序</text>
  <path d="M280,296 L280,314" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="280,314 400,352 280,390 160,352" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="357" text-anchor="middle" font-size="14" fill="#2f5228" filter="url(#rough2)">M_a == M_b ?</text>

  <!-- 分支 -->
  <path d="M162,352 Q120,352 118,404" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="66" y="376" font-size="12" fill="#4a7a3a" filter="url(#rough2)">相等</text>
  <path d="M398,352 Q440,352 442,404" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="466" y="376" font-size="12" fill="#b85450" filter="url(#rough2)">不等</text>

  <rect x="48" y="408" width="140" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="118" y="436" text-anchor="middle" font-size="14" fill="#2f5228" filter="url(#rough2)">输出 YES</text>
  <rect x="372" y="408" width="140" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="442" y="436" text-anchor="middle" font-size="14" fill="#8c2f2a" filter="url(#rough2)">输出 NO</text>
  <text x="280" y="474" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">每组只做两次排序与一次比较，O(n log n)</text>
</svg>
