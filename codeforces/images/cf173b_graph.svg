<svg xmlns="http://www.w3.org/2000/svg" width="740" height="400" viewBox="0 0 740 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="79"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="740" height="400" fill="#fafafa"/>
  <text x="370" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">行、列各看成一点：每根石柱是一条代价 1 的边</text>
  <path d="M 170 46 Q 370 52 570 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <circle cx="120" cy="100" r="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="105" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">R0</text>
  <circle cx="120" cy="176" r="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="181" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">R1</text>
  <circle cx="120" cy="252" r="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="257" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">R2</text>
  <circle cx="380" cy="100" r="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="105" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">C0</text>
  <circle cx="380" cy="176" r="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="181" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">C1</text>
  <circle cx="380" cy="252" r="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="257" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">C2</text>
  <line x1="146" y1="100" x2="354" y2="176" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <line x1="146" y1="252" x2="354" y2="176" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="250" y="118" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#b85450" filter="url(#rough2)">石柱 (0,1)</text>
  <text x="250" y="246" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#b85450" filter="url(#rough2)">石柱 (2,1)</text>
  <text x="70" y="74" text-anchor="start" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">行点（蛇怪在第 2 行）</text>
  <text x="340" y="74" text-anchor="start" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">列点</text>
  <text x="120" y="300" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">起点 R(n-1)</text>
  <text x="120" y="322" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#b85450" filter="url(#rough2)">dist = 0</text>
  <rect x="440" y="96" width="270" height="150" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="454" y="120" text-anchor="start" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">BFS 求最短路：</text>
  <text x="454" y="142" text-anchor="start" font-size="11.5" font-weight="normal" fill="#7a5a1b" filter="url(#rough2)">R2 --(1)--&gt; C1 --(1)--&gt; R0</text>
  <text x="454" y="164" text-anchor="start" font-size="11.5" font-weight="normal" fill="#7a5a1b" filter="url(#rough2)">答案 = 2（两条边 = 两根魔法柱）</text>
  <text x="454" y="190" text-anchor="start" font-size="11" font-weight="normal" fill="#555" filter="url(#rough2)">同一行/列内移动不花钱，</text>
  <text x="454" y="208" text-anchor="start" font-size="11" font-weight="normal" fill="#555" filter="url(#rough2)">只有“换行换列”才消耗一根柱子。</text>
  <text x="454" y="232" text-anchor="start" font-size="11" font-weight="normal" fill="#b85450" filter="url(#rough2)">终点是 R0：光到第 0 行向左出界。</text>
  <rect x="440" y="266" width="270" height="96" rx="9" fill="#f3e8fb" stroke="#7a4a9a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="454" y="290" text-anchor="start" font-size="11.5" font-weight="bold" fill="#5a3075" filter="url(#rough2)">规模：点 n+m ≤ 2000</text>
  <text x="454" y="310" text-anchor="start" font-size="11.5" font-weight="normal" fill="#5a3075" filter="url(#rough2)">边 ≤ #石柱 ≤ 10⁶</text>
  <text x="454" y="330" text-anchor="start" font-size="11" font-weight="normal" fill="#5a3075" filter="url(#rough2)">每个行点/列点只出队一次 ⇒ O(nm)</text>
  <text x="454" y="350" text-anchor="start" font-size="11" font-weight="normal" fill="#b85450" filter="url(#rough2)">无解时 dist[R0] = -1</text>
</svg>
