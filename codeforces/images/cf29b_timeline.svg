<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">信号灯时间轴：到达落在红灯区间就等到下次绿灯</text>
  <path d="M 100 42 Q 360 48 620 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <text x="40" y="76" font-size="11.5" fill="#555" filter="url(#rough2)">示例：g = 3，r = 2，周期 c = 5</text>
  <line x1="60" y1="230" x2="690" y2="230" stroke="#2b2b2b" stroke-width="1.5" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="60" y="190" width="180" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="240" y="190" width="120" height="32" fill="#fde8e8" stroke="#b85450" stroke-width="1.2"/>
    <rect x="360" y="190" width="180" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="540" y="190" width="120" height="32" fill="#fde8e8" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <g font-size="11" text-anchor="middle" fill="#555" filter="url(#rough2)">
    <text x="150" y="211">绿 0…3</text><text x="300" y="211">红 3…5</text>
    <text x="450" y="211">绿 5…8</text><text x="600" y="211">红 8…10</text>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#666" filter="url(#rough2)">
    <text x="60" y="248">0</text><text x="240" y="248">3</text><text x="360" y="248">5</text>
    <text x="540" y="248">8</text><text x="660" y="248">10</text>
  </g>

  <!-- 红灯到达 -->
  <line x1="276" y1="160" x2="276" y2="268" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="276" y="152" text-anchor="middle" font-size="11" font-weight="bold" fill="#a33a36" filter="url(#rough2)">到达 t=d/v</text>
  <text x="282" y="286" font-size="10.5" fill="#a33a36" filter="url(#rough2)">在红灯区间 → 等到 5</text>
  <path d="M 280 300 L 354 300" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="318" y="318" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">等待 c − (t mod c)</text>

  <!-- 绿灯到达 -->
  <line x1="150" y1="160" x2="150" y2="268" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="152" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5223" filter="url(#rough2)">绿灯到达</text>
  <text x="150" y="286" font-size="10.5" fill="#2f5223" filter="url(#rough2)">直接通过，不等待</text>

  <rect x="40" y="336" width="640" height="52" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="360" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">判定用整数：d mod (v·c) &lt; v·g ⇔ 绿灯；否则等待 c − rem/v。总时间 = l/v + 等待。</text>
  <text x="56" y="380" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">到达恰好等于红灯开始（rem = v·g）算红灯；恰好绿灯开始（rem = 0）可以走。</text>
</svg>
