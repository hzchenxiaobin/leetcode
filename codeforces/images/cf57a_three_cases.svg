<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="223"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="b57" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="g57" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">三种典型位置：同边 / 对边 / 对角，都是「两段弧取小」</text>
  <path d="M 90 40 Q 360 46 630 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 三个小正方形 -->
  <!-- 1. 同边 -->
  <g filter="url(#rough2)">
    <rect x="40" y="70" width="180" height="180" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
    <circle cx="40" cy="250" r="4.5" fill="#2b2b2b"/>
    <circle cx="80" cy="250" r="5.5" fill="#4a7a3a" stroke="#2f5223" stroke-width="1.6"/>
    <circle cx="140" cy="250" r="5.5" fill="#4a7a3a" stroke="#2f5223" stroke-width="1.6"/>
    <path d="M 88 258 L 132 258" stroke="#4a7a3a" stroke-width="2.4" marker-end="url(#g57)"/>
    <text x="130" y="284" text-anchor="middle" font-size="11.5" fill="#2f5223">d = 1，另一段 4n−1</text>
    <text x="130" y="302" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f5223">答案 = 1</text>
    <text x="130" y="330" text-anchor="middle" font-size="11.5" fill="#2f4a66">样例 1：同在下边</text>
  </g>

  <!-- 2. 对边 -->
  <g filter="url(#rough2)">
    <rect x="270" y="70" width="180" height="180" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
    <circle cx="270" cy="160" r="5.5" fill="#8a6015" stroke="#5a3f0b" stroke-width="1.6"/>
    <circle cx="450" cy="160" r="5.5" fill="#8a6015" stroke="#5a3f0b" stroke-width="1.6"/>
    <!-- 上弧（经上边） -->
    <path d="M 276 152 L 290 96 L 434 96 L 446 152" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="5 4"/>
    <!-- 下弧（经下边） -->
    <path d="M 276 168 L 290 224 L 434 224 L 446 168" stroke="#4a7a3a" stroke-width="2" fill="none"/>
    <text x="360" y="286" text-anchor="middle" font-size="11.5" fill="#8f3a34">上弧 = 4，下弧 = 4</text>
    <text x="360" y="304" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b">答案 = 4</text>
    <text x="360" y="330" text-anchor="middle" font-size="11.5" fill="#2f4a66">样例 2：左右两边中点</text>
  </g>

  <!-- 3. 对角 -->
  <g filter="url(#rough2)">
    <rect x="500" y="70" width="180" height="180" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
    <circle cx="500" cy="250" r="5.5" fill="#b85450" stroke="#7a3a34" stroke-width="1.6"/>
    <circle cx="680" cy="70" r="5.5" fill="#b85450" stroke="#7a3a34" stroke-width="1.6"/>
    <path d="M 500 242 L 500 78 L 672 70" stroke="#b85450" stroke-width="2" fill="none"/>
    <path d="M 508 250 L 672 250 L 680 78" stroke="#4a7a3a" stroke-width="2" fill="none" stroke-dasharray="5 4"/>
    <text x="590" y="286" text-anchor="middle" font-size="11.5" fill="#8f3a34">两条路都是 n + n = 2n</text>
    <text x="590" y="304" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b">答案 = 200</text>
    <text x="590" y="330" text-anchor="middle" font-size="11.5" fill="#2f4a66">样例 3：对角顶点，n = 100</text>
  </g>

  <!-- 公式 -->
  <rect x="60" y="352" width="600" height="58" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="76" y="376" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">t₁、t₂ 为两点在环上的位置 → 答案 = min( |t₁ − t₂| , 4n − |t₁ − t₂| )</text>
  <text x="76" y="398" font-size="11.5" fill="#555" filter="url(#rough2)">同边的两点只需沿那条边；对边的两点两条路等长；对角的两条路都是两条边长之和。</text>
</svg>
