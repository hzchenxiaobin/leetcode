<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa" filter="url(#rough2)"/>

  <text x="280" y="26" text-anchor="middle" font-size="15.5" fill="#333" filter="url(#rough2)">建模：作品 ↔ 前缀封闭的单词集合 S</text>

  <!-- edges -->
  <line x1="139" y1="95" x2="104" y2="146" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="161" y1="95" x2="202" y2="146" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="85" y1="174" x2="61" y2="226" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="101" y1="174" x2="127" y2="226" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="222" y1="174" x2="249" y2="226" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- edge colour labels -->
  <text x="106" y="118" font-size="11" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="192" y="118" font-size="11" fill="#d6a040" filter="url(#rough2)">2</text>
  <text x="58" y="198" font-size="11" fill="#d6a040" filter="url(#rough2)">2</text>
  <text x="122" y="198" font-size="11" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <text x="247" y="198" font-size="11" fill="#b85450" filter="url(#rough2)">1</text>

  <!-- nodes -->
  <circle cx="150" cy="82" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="87" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">ε</text>

  <circle cx="93" cy="160" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="93" y="165" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">1</text>

  <circle cx="213" cy="160" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="213" y="165" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">2</text>

  <circle cx="52" cy="240" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="52" y="245" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">12</text>

  <circle cx="134" cy="240" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="134" y="245" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">13</text>

  <circle cx="256" cy="240" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="256" y="245" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">21</text>

  <text x="150" y="292" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">沿边追加字母；同一节点的边异色 ⇒ 无相邻相同字母</text>

  <!-- right panel -->
  <rect x="316" y="44" width="232" height="258" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="332" y="68" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">S 里的单词（根到节点）</text>

  <rect x="330" y="82" width="48" height="22" rx="4" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="354" y="97" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">ε</text>
  <rect x="412" y="82" width="48" height="22" rx="4" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="436" y="97" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="330" y="112" width="48" height="22" rx="4" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="354" y="127" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="412" y="112" width="48" height="22" rx="4" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="436" y="127" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">12</text>
  <rect x="330" y="142" width="48" height="22" rx="4" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="354" y="157" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">13</text>
  <rect x="412" y="142" width="48" height="22" rx="4" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="436" y="157" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">21</text>

  <text x="330" y="192" font-size="11.5" fill="#333" filter="url(#rough2)">前缀封闭：</text>
  <text x="330" y="212" font-size="11.5" fill="#333" filter="url(#rough2)">w·c ∈ S ⇒ w ∈ S</text>
  <text x="330" y="240" font-size="11.5" fill="#b85450" filter="url(#rough2)">同构 ⟺ S 完全相同</text>
  <text x="330" y="264" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">（颜色即标号，根固定）</text>

  <line x1="300" y1="172" x2="312" y2="172" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- bottom -->
  <rect x="20" y="312" width="520" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="34" y="335" font-size="11.5" fill="#333" filter="url(#rough2)">预算 b：所有 w∈S 满足 cnt_i(w) ≤ b_i；记这样的 S 的个数为 F(b)</text>
</svg>
