<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="300" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每次在右边补一位，使结果被 b 整除</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">只要第一步成功，后面全补 0 就一定继续整除</text>
  <text x="140" y="110" text-anchor="start" font-size="13" fill="#2b2b2b" filter="url(#rough2)">x → (10x + d) ≡ 0 (mod b)，枚举 d = 0..9</text>
  <text x="140" y="152" text-anchor="start" font-size="13" fill="#2f4a66" filter="url(#rough2)">第一步找到 d 后，x*10 已经是 b 的倍数</text>
  <text x="140" y="192" text-anchor="start" font-size="13" fill="#3d6b2f" filter="url(#rough2)">之后每位补 0：值 ×10 仍然整除 ✓</text>
  <text x="140" y="238" text-anchor="start" font-size="12.5" fill="#b05a5a" filter="url(#rough2)">第一步无解（10 个 d 都不行）→ -1</text>
</svg>
