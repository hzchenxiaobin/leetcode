<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="563"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="210" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">样例 2：1 2 / 3 4</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">row = [3,7]，col = [4,6] ⇒ 两格获胜</text>
  <text x="450" y="100" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">row = [3, 7]　col = [4, 6]</text>
  <text x="450" y="134" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">(1,1): 4&gt;3 ✓　(1,2): 6&gt;3 ✓　(2,1): 4&gt;7 ✗　(2,2): 6&gt;7 ✗</text>
  <text x="450" y="174" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 2</text>
</svg>
