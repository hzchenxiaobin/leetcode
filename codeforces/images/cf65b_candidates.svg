<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="420" fill="#fafafa"/>

  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每个日期的候选值：不动，或者只改一位</text>
  <path d="M 106 44 Q 360 51 614 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 原日期 1721 -->
  <text x="86" y="82" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">原始日期</text>
  <rect x="26" y="94" width="44" height="46" fill="#eaf3ff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="70" y="94" width="44" height="46" fill="#eaf3ff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="114" y="94" width="44" height="46" fill="#eaf3ff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="158" y="94" width="44" height="46" fill="#eaf3ff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="48" y="126" text-anchor="middle" font-size="21" font-weight="bold" fill="#2f4a63" filter="url(#rough2)">1</text>
  <text x="92" y="126" text-anchor="middle" font-size="21" font-weight="bold" fill="#2f4a63" filter="url(#rough2)">7</text>
  <text x="136" y="126" text-anchor="middle" font-size="21" font-weight="bold" fill="#2f4a63" filter="url(#rough2)">2</text>
  <text x="180" y="126" text-anchor="middle" font-size="21" font-weight="bold" fill="#2f4a63" filter="url(#rough2)">1</text>
  <text x="48" y="160" text-anchor="middle" font-size="10.5" fill="#5a7285" filter="url(#rough2)">千</text>
  <text x="92" y="160" text-anchor="middle" font-size="10.5" fill="#5a7285" filter="url(#rough2)">百</text>
  <text x="136" y="160" text-anchor="middle" font-size="10.5" fill="#5a7285" filter="url(#rough2)">十</text>
  <text x="180" y="160" text-anchor="middle" font-size="10.5" fill="#5a7285" filter="url(#rough2)">个</text>

  <!-- 四行候选 -->
  <rect x="26" y="188" width="316" height="40" rx="7" fill="#f3eefb" stroke="#6b5b95" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="36" y="213" font-size="12" fill="#4a3d6b" filter="url(#rough2)">改千位：0721 废、2721…9721（都超 2011）</text>
  <rect x="26" y="236" width="316" height="40" rx="7" fill="#eef6ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="36" y="261" font-size="12" fill="#2f5223" filter="url(#rough2)">改百位：1021 1121 1221 … 1921</text>
  <rect x="26" y="284" width="316" height="40" rx="7" fill="#eef6ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="36" y="309" font-size="12" fill="#2f5223" filter="url(#rough2)">改十位：1701 1711 1731 … 1791</text>
  <rect x="26" y="332" width="316" height="40" rx="7" fill="#eef6ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="36" y="357" font-size="12" fill="#2f5223" filter="url(#rough2)">改个位：1720 1722 … 1729</text>

  <!-- 右侧：合法窗口 -->
  <text x="556" y="82" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">合法窗口</text>
  <line x1="556" y1="104" x2="556" y2="360" stroke="#2b2b2b" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="540" y1="360" x2="572" y2="360" stroke="#2b2b2b" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="540" y1="104" x2="572" y2="104" stroke="#2b2b2b" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="588" y="368" font-size="12" fill="#2b2b2b" filter="url(#rough2)">1000</text>
  <text x="588" y="110" font-size="12" fill="#2b2b2b" filter="url(#rough2)">2011</text>
  <rect x="470" y="196" width="172" height="26" rx="6" fill="#fff0d6" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="556" y="214" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">还要 ≥ 上一个日期</text>
  <text x="470" y="248" font-size="11.5" fill="#8a3b37" filter="url(#rough2)">取其中最小的那个</text>
  <text x="470" y="270" font-size="11.5" fill="#8a3b37" filter="url(#rough2)">（离上限最远，最宽松）</text>

  <path d="M 350 208 Q 420 200 464 200" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <text x="360" y="400" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">候选最多 1 + 4×9 = 37 个，逐个筛掉越界与小于前值的，取最小</text>
</svg>
