<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="163"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="340" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">后缀自动机的状态 = 一族出现次数相同的子串</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">长度落在 (len(link), len] 的每个整数恰好对应一个子串，共 len − len(link) 个</text>
  <g filter="url(#rough2)"><circle cx="180" cy="170" r="34" fill="#f6e3c4" fill-opacity="0.9" stroke="#b06a1e" stroke-width="1.5"/></g>
  <text x="180" y="175.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">v</text>
  <g filter="url(#rough2)"><circle cx="560" cy="170" r="30" fill="#cfe0f5" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="560" y="173.96" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">link</text>
  <g filter="url(#rough2)"><line x1="214" y1="170" x2="526" y2="170" stroke="#b06a1e" stroke-width="2" marker-end="url(#arr)"/></g>
  <text x="370" y="158" text-anchor="middle" font-size="11" fill="#b06a1e" filter="url(#rough2)">后缀链接（删掉首字母）</text>
  <g filter="url(#rough2)"><line x1="180" y1="204" x2="180" y2="262" stroke="#446688" stroke-width="1.4" stroke-dasharray="5 4"/></g>
  <text x="180" y="285" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">根</text>
  <text x="700" y="120" text-anchor="start" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">状态 v 的三件信息</text>
  <text x="700" y="148" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">len(v)：最长子串长度</text>
  <text x="700" y="172" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">line：len(link(v))</text>
  <text x="700" y="196" text-anchor="start" font-size="11" fill="#4a7a3a" filter="url(#rough2)">c_v = |endpos(v)|：出现次数</text>
  <g filter="url(#rough2)"><rect x="440" y="230" width="430" height="78" rx="6" fill="#f3d9d6" fill-opacity="0.5" stroke="#8a2b28" stroke-width="1.4"/></g>
  <text x="655" y="256" text-anchor="middle" font-size="12.5" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">贡献 = c(c+1)/2 × (len − len(link))</text>
  <text x="655" y="282" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">每个子串都恰好被一个状态统计一次</text>
  <text x="450" y="330" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">c_v 的求法：新建状态置 1、克隆状态置 0，再按 len 降序把 c 推给 link</text>
</svg>
