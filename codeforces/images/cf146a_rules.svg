<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="331"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="300" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">两个条件缺一不可</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">① 每一位都是 4/7　② 前半数字和 = 后半数字和</text>
  <g filter="url(#rough2)"><rect x="60" y="100" width="360" height="90" rx="6" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="240" y="130" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">条件 ①：全由 4 / 7 组成</text>
  <text x="240" y="160" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">47 ✓　4738 ✗（3、8）</text>
  <g filter="url(#rough2)"><rect x="480" y="100" width="360" height="90" rx="6" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="660" y="130" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">条件 ②：前后半和相等</text>
  <text x="660" y="160" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">4774: 4+7 = 7+4 ✓</text>
  <g filter="url(#rough2)"><rect x="60" y="216" width="780" height="60" rx="6" fill="#f3d9d6" fill-opacity="0.45" stroke="#8a2b28" stroke-width="1.4"/></g>
  <text x="450" y="240" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">4774 ⇒ YES　　47 ⇒ NO（4 ≠ 7）　　4738 ⇒ NO（含非幸运位）</text>
  <text x="450" y="264" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">O(n) 扫描：逐位查字符 + 累加两半</text>
</svg>
