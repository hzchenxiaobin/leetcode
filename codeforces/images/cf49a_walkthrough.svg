<svg xmlns="http://www.w3.org/2000/svg" width="760" height="336" viewBox="0 0 760 336"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c9801f"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a8524a"/>
    </marker>
  </defs>
  <rect width="760" height="336" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">四个官方样例的走查</text>
  <rect x="24.0" y="70.0" width="714.0" height="34.0" rx="6" fill="#eef1f7" stroke="#2b2b2b" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="134.0" y="92.0" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">官方样例（末尾片段）</text>
  <text x="324.0" y="92.0" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">问号前的样子</text>
  <text x="452.0" y="92.0" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">最后一个字母</text>
  <text x="550.0" y="92.0" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">元音？</text>
  <text x="669.0" y="92.0" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">输出</text>
  <rect x="24.0" y="104.0" width="714.0" height="42.0" rx="5" fill="#f7f9fc" stroke="#9aa3b2" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="36.0" y="131.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">Is it a melon?</text>
  <text x="324.0" y="131.0" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">n ?</text>
  <text x="452.0" y="131.0" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">n</text>
  <text x="550.0" y="131.0" text-anchor="middle" font-size="13" fill="#a8524a" filter="url(#rough2)">否</text>
  <text x="669.0" y="131.0" text-anchor="middle" font-size="13.5" fill="#a8524a" font-weight="bold" filter="url(#rough2)">NO</text>
  <rect x="24.0" y="150.0" width="714.0" height="42.0" rx="5" fill="#fbfbfb" stroke="#9aa3b2" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="36.0" y="177.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">Is it an apple?</text>
  <text x="324.0" y="177.0" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">e ?</text>
  <text x="452.0" y="177.0" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">e</text>
  <text x="550.0" y="177.0" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <text x="669.0" y="177.0" text-anchor="middle" font-size="13.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">YES</text>
  <rect x="24.0" y="196.0" width="714.0" height="42.0" rx="5" fill="#f7f9fc" stroke="#9aa3b2" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="36.0" y="223.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">…  it a banana ?</text>
  <text x="324.0" y="223.0" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">a · ?</text>
  <text x="452.0" y="223.0" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="550.0" y="223.0" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <text x="669.0" y="223.0" text-anchor="middle" font-size="13.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">YES</text>
  <rect x="24.0" y="242.0" width="714.0" height="42.0" rx="5" fill="#fbfbfb" stroke="#9aa3b2" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="36.0" y="269.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">…simultaneouSLY?</text>
  <text x="324.0" y="269.0" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">Y ?</text>
  <text x="452.0" y="269.0" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">Y（大写）</text>
  <text x="550.0" y="269.0" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <text x="669.0" y="269.0" text-anchor="middle" font-size="13.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">YES</text>
  <rect x="34.0" y="296.0" width="692.0" height="32.0" rx="8" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="48.0" y="318.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">第 3 组问号前有 1 个空格；第 4 组最后一个字母是大写 Y —— 仍是元音</text>
</svg>
