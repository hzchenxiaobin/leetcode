<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="47"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>

  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例二走查：下界一路抬高，每个日期都取到最小可行值</text>
  <path d="M 76 44 Q 360 51 644 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <text x="96" y="76" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">原日期</text>
  <text x="300" y="76" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">可行的最小改动</text>
  <text x="560" y="76" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">新的下界</text>

  <!-- 行 1: 9999 -> 1999 -->
  <rect x="26" y="90" width="140" height="48" rx="8" fill="#eaf3ff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="96" y="121" text-anchor="middle" font-size="18" font-weight="bold" fill="#2f4a63" filter="url(#rough2)">9999</text>
  <line x1="170" y1="114" x2="240" y2="114" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="205" y="104" text-anchor="middle" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">千位 9→1</text>
  <rect x="244" y="90" width="140" height="48" rx="8" fill="#eef6ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="314" y="121" text-anchor="middle" font-size="18" font-weight="bold" fill="#2f5223" filter="url(#rough2)">1999</text>
  <text x="500" y="121" font-size="12.5" fill="#666666" filter="url(#rough2)">prev = 1999</text>

  <!-- 行 2: 2000 -> 2000 -->
  <rect x="26" y="152" width="140" height="48" rx="8" fill="#eaf3ff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="96" y="183" text-anchor="middle" font-size="18" font-weight="bold" fill="#2f4a63" filter="url(#rough2)">2000</text>
  <line x1="170" y1="176" x2="240" y2="176" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="205" y="166" text-anchor="middle" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">一位都不改</text>
  <rect x="244" y="152" width="140" height="48" rx="8" fill="#eef6ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="314" y="183" text-anchor="middle" font-size="18" font-weight="bold" fill="#2f5223" filter="url(#rough2)">2000</text>
  <text x="500" y="183" font-size="12.5" fill="#666666" filter="url(#rough2)">prev = 2000</text>

  <!-- 行 3: 3000 -> 2000 -->
  <rect x="26" y="214" width="140" height="48" rx="8" fill="#eaf3ff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="96" y="245" text-anchor="middle" font-size="18" font-weight="bold" fill="#2f4a63" filter="url(#rough2)">3000</text>
  <line x1="170" y1="238" x2="240" y2="238" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="205" y="228" text-anchor="middle" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">千位 3→2</text>
  <rect x="244" y="214" width="140" height="48" rx="8" fill="#eef6ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="314" y="245" text-anchor="middle" font-size="18" font-weight="bold" fill="#2f5223" filter="url(#rough2)">2000</text>
  <text x="500" y="245" font-size="12.5" fill="#666666" filter="url(#rough2)">prev = 2000</text>

  <!-- 行 4: 3011 -> 2011 -->
  <rect x="26" y="276" width="140" height="48" rx="8" fill="#eaf3ff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="96" y="307" text-anchor="middle" font-size="18" font-weight="bold" fill="#2f4a63" filter="url(#rough2)">3011</text>
  <line x1="170" y1="300" x2="240" y2="300" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="205" y="290" text-anchor="middle" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">千位 3→2</text>
  <rect x="244" y="276" width="140" height="48" rx="8" fill="#fff7e2" stroke="#c99a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="314" y="307" text-anchor="middle" font-size="18" font-weight="bold" fill="#8a6015" filter="url(#rough2)">2011</text>
  <text x="500" y="307" font-size="12.5" fill="#8a3b37" filter="url(#rough2)">正好等于上限 2011</text>

  <text x="360" y="368" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">每一步都是"≥ prev 且 ≤ 2011 的最小候选"，最终序列 1999 2000 2000 2011</text>
  <text x="360" y="388" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">若第 4 个日期只能取到 2012 以上，就说明无解</text>
</svg>
