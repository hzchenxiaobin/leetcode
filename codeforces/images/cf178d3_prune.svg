<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="340" fill="#fafafa"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">D3 比 D2 多出来的两层剪枝</text>
  <path d="M 247.93 46 Q 380.0 52 512.0699999999999 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="50.0" y="64.0" width="660.0" height="52.0" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="66.0" y="86.0" text-anchor="start" font-size="11.8" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">剩余 k 个数之和的上下界</text>
  <text x="66.0" y="104.0" text-anchor="start" font-size="10.8" fill="#6b6b6b" filter="url(#rough2)">s−p 必须落在 [k 小之和, k 大之和]</text>
  <rect x="50.0" y="126.0" width="660.0" height="52.0" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="66.0" y="148.0" text-anchor="start" font-size="11.8" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">列的上下界（含未填的 j &gt; c 列）</text>
  <text x="66.0" y="166.0" text-anchor="start" font-size="10.8" fill="#6b6b6b" filter="url(#rough2)">j&gt;c 的列剩 n−r 格，j≤c 的列剩 n−1−r 格</text>
  <rect x="50.0" y="188.0" width="660.0" height="52.0" rx="8" fill="#fff3d6" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="66.0" y="210.0" text-anchor="start" font-size="11.8" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两条对角线的上下界</text>
  <text x="66.0" y="228.0" text-anchor="start" font-size="10.8" fill="#6b6b6b" filter="url(#rough2)">(r,r) 与 (r,n−1−r) 可能还没放，剩余格数要算对</text>
  <rect x="50.0" y="250.0" width="660.0" height="52.0" rx="8" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="66.0" y="272.0" text-anchor="start" font-size="11.8" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">最后一行整行由列和反解</text>
  <text x="66.0" y="290.0" text-anchor="start" font-size="10.8" fill="#6b6b6b" filter="url(#rough2)">分支因子从 9 降到 1</text>
  <rect x="50.0" y="312.0" width="660.0" height="22.0" rx="6" fill="#fdf0ef" stroke="#b85450" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="62.0" y="328.0" text-anchor="start" font-size="10.8" fill="#8a3a36" filter="url(#rough2)">值可以两两不同 ⇒ 没有重复可借力，必须靠这些上下界把 16 格搜索压下来。</text>
</svg>
