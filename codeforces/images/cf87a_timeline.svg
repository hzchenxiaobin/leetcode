<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="720" height="400" fill="#fafafa"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 3：a = 2, b = 3，一个周期怎么分</text>
  <path d="M 200 43 Q 360 49 520 43" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 70 150 L 650 150" stroke="#2b2b2b" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 70.0 144 L 70.0 156" stroke="#777777" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="70.0" y="172" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">0</text>
  <circle cx="70.0" cy="134" r="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="65.0" y="116" width="10" height="10" rx="2" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 166.66666666666669 144 L 166.66666666666669 156" stroke="#777777" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="166.66666666666669" y="172" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">1</text>
  <path d="M 263.33333333333337 144 L 263.33333333333337 156" stroke="#777777" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="263.33333333333337" y="172" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">2</text>
  <circle cx="263.33333333333337" cy="134" r="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 360.0 144 L 360.0 156" stroke="#777777" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="360.0" y="172" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">3</text>
  <rect x="355.0" y="116" width="10" height="10" rx="2" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 456.6666666666667 144 L 456.6666666666667 156" stroke="#777777" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="456.6666666666667" y="172" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">4</text>
  <circle cx="456.6666666666667" cy="134" r="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 553.3333333333333 144 L 553.3333333333333 156" stroke="#777777" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="553.3333333333333" y="172" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">5</text>
  <path d="M 650.0 144 L 650.0 156" stroke="#777777" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="650.0" y="172" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">6</text>
  <circle cx="650.0" cy="134" r="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="645.0" y="116" width="10" height="10" rx="2" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="66" y="106" text-anchor="start" font-size="10.5" fill="#777777" filter="url(#rough2)">○ Dasha 的车    □ Masha 的车</text>
  <rect x="71.0" y="186" width="191.33333333333337" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="166.66666666666669" y="206" text-anchor="middle" font-size="9.5" fill="#2b2b2b" filter="url(#rough2)">Dasha</text>
  <rect x="264.33333333333337" y="186" width="94.66666666666663" height="30" rx="4" fill="#e9f4e2" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="311.6666666666667" y="206" text-anchor="middle" font-size="9.5" fill="#2b2b2b" filter="url(#rough2)">Masha</text>
  <rect x="361.0" y="186" width="94.66666666666669" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="408.33333333333337" y="206" text-anchor="middle" font-size="9.5" fill="#2b2b2b" filter="url(#rough2)">Dasha</text>
  <rect x="457.6666666666667" y="186" width="191.33333333333331" height="30" rx="4" fill="#fdecea" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="553.3333333333334" y="206" text-anchor="middle" font-size="9.5" fill="#2b2b2b" filter="url(#rough2)">Masha（同时到达，选班次少的）</text>
  <rect x="60" y="230" width="600" height="70" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="76" y="256" text-anchor="start" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">Dasha 时长 = 2 + 1 = 3，Masha 时长 = 1 + 2 = 3 → Equal</text>
  <text x="76" y="282" text-anchor="start" font-size="10.5" fill="#8a6015" filter="url(#rough2)">注意最后一段 (4,6]：两车都在 6 到，Vasya 去「发车更少」的 Masha（b=3 &gt; a=2）</text>
  <text x="60" y="330" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">一般做法：在一个 lcm(a,b) 周期里枚举 a 的每个区间 (ka,(k+1)a]，</text>
  <text x="60" y="354" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">该区间内「最后一班 b 车之后」的部分全归 Dasha；反之算 Masha；</text>
  <text x="60" y="378" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">剩下的就是平局段，按「周期大 = 班次少」判给谁。</text>
</svg>
