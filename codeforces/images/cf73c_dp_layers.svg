<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="79"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="dp" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#7b4fa8"/>
    </marker>
  </defs>
  <rect width="720" height="420" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">状态 = (位置 i, 已改次数 j, 末位字母 c)，转移枚举上一位字母</text>
  <path d="M 120 40 Q 360 46 600 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 两层 -->
  <g filter="url(#rough2)">
    <rect x="60" y="110" width="150" height="150" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="135" y="98" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66">位置 i−1</text>
    <text x="135" y="136" text-anchor="middle" font-size="11.5" fill="#2f4a66">dp[j][c′]</text>
    <text x="135" y="166" text-anchor="middle" font-size="11" fill="#2f4a66">c′ ∈ 26 个字母</text>
    <text x="135" y="196" text-anchor="middle" font-size="11" fill="#2f4a66">j ≤ k 次修改</text>
    <text x="135" y="226" text-anchor="middle" font-size="11" fill="#2f4a66">只保留最大值</text>

    <rect x="500" y="110" width="160" height="150" rx="10" fill="#e6f4ea" stroke="#2f7a3a" stroke-width="1.6"/>
    <text x="580" y="98" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f5226">位置 i</text>
    <text x="580" y="136" text-anchor="middle" font-size="11.5" fill="#1f5226">dp[j + (c≠s_i)][c]</text>
    <text x="580" y="166" text-anchor="middle" font-size="11" fill="#1f5226">每个 (j,c) 取最大</text>
    <text x="580" y="196" text-anchor="middle" font-size="11" fill="#1f5226">+ c(c′, c)</text>
    <text x="580" y="226" text-anchor="middle" font-size="11" fill="#1f5226">26 × 26 转移</text>
  </g>

  <g filter="url(#rough2)" stroke="#7b4fa8" stroke-width="2.4" fill="none">
    <line x1="214" y1="170" x2="492" y2="170" marker-end="url(#dp)"/>
    <line x1="214" y1="200" x2="492" y2="200" marker-end="url(#dp)"/>
    <line x1="214" y1="230" x2="492" y2="230" marker-end="url(#dp)"/>
  </g>
  <text x="352" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#4b2a70" filter="url(#rough2)">枚举 26 种 c′</text>
  <text x="352" y="252" text-anchor="middle" font-size="11.5" fill="#4b2a70" filter="url(#rough2)">取 dp[j−cost][c′] + bonus[c′][c] 的最大值</text>

  <!-- 表格示意 -->
  <g filter="url(#rough2)">
    <rect x="60" y="292" width="600" height="100" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="76" y="316" font-size="12.5" font-weight="bold" fill="#8a6015">答案 = max{ dp[L−1][j][c] : 0 ≤ j ≤ k, c ∈ [a,z] }</text>
    <text x="76" y="342" font-size="11.5" fill="#7a5a1b">“最多 k 次” 是 ≤，所以要遍历整段 j；不能只取 dp[L−1][k][·]。</text>
    <text x="76" y="368" font-size="11.5" fill="#7a5a1b">初值 dp[0][[c≠s₀]][c] = 0，其余 −∞（奖励可以为负，初值不能取 0）。</text>
  </g>
</svg>
