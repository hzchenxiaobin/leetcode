<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="463"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="380" fill="#fafafa"/>
  <text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">字典序贪心：按名字升序，逐个挑"仍能完成最优解"的最小附名</text>
  <path d="M 60 38 Q 380 46 700 38" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <text x="40" y="66" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">名字（升序）</text>
  <g font-size="10.5">
    <rect x="36" y="76" width="80" height="34" rx="7" fill="#cfe0f5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="76" y="98" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">Aa</text>
    <rect x="36" y="120" width="80" height="34" rx="7" fill="#cfe0f5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="76" y="142" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">Ab</text>
    <rect x="36" y="164" width="80" height="34" rx="7" fill="#cfe0f5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="76" y="186" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">Ac</text>
    <rect x="36" y="208" width="80" height="34" rx="7" fill="#e8e0f5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="76" y="230" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">Ba</text>
  </g>

  <text x="160" y="66" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">组合法的附名（升序）</text>
  <g font-size="10.5">
    <rect x="150" y="76" width="90" height="34" rx="7" fill="#d9ecd4" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="195" y="98" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">Ad</text>
    <rect x="150" y="120" width="90" height="34" rx="7" fill="#d9ecd4" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="195" y="142" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">Ae</text>
    <rect x="150" y="164" width="90" height="34" rx="7" fill="#fbe3c8" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="195" y="186" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">Bb</text>
    <rect x="150" y="208" width="90" height="34" rx="7" fill="#e8e0f5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="195" y="230" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">Bc</text>
  </g>

  <path d="M 120 93 L 146 93" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 120 137 L 146 137" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 120 181 L 146 181" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 120 225 L 146 225" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <text x="258" y="66" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">可行性判定</text>
  <rect x="250" y="76" width="230" height="166" rx="10" fill="#fbe3c8" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="264" y="100" font-size="10.6" fill="#2b2b2b" filter="url(#rough2)">试配 (名字 i, 附名 j) 后，令</text>
  <text x="264" y="122" font-size="10.6" fill="#2b2b2b" filter="url(#rough2)">remMax = Σ_c min(剩名字_c, 剩附名_c)，</text>
  <text x="264" y="144" font-size="10.6" fill="#2b2b2b" filter="url(#rough2)">gain = 首字母相同 ? 1 : 0。</text>
  <text x="264" y="168" font-size="10.6" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">接受当且仅当</text>
  <text x="264" y="190" font-size="10.6" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">fixed + gain + remMax == M。</text>
  <text x="264" y="214" font-size="9.5" fill="#555555" filter="url(#rough2)">（M 是全局最大同首字母对数）</text>
  <text x="264" y="232" font-size="9.5" fill="#555555" filter="url(#rough2)">不满足就换下一个附名。</text>

  <rect x="500" y="76" width="230" height="166" rx="10" fill="#d9ecd4" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="514" y="100" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2 的接受过程</text>
  <text x="514" y="122" font-size="10.4" fill="#2b2b2b" filter="url(#rough2)">M = min(3,2)+min(1,2) = 3</text>
  <text x="514" y="143" font-size="10.4" fill="#2b2b2b" filter="url(#rough2)">Aa：Ad 使 0+1+2=3 ✓</text>
  <text x="514" y="164" font-size="10.4" fill="#2b2b2b" filter="url(#rough2)">Ab：Ae 使 1+1+1=3 ✓</text>
  <text x="514" y="185" font-size="10.4" fill="#2b2b2b" filter="url(#rough2)">Ac：Bb 使 2+0+1=3 ✓</text>
  <text x="514" y="206" font-size="10.4" fill="#2b2b2b" filter="url(#rough2)">Ba：剩下 Bc ✓</text>
  <text x="514" y="228" font-size="9.5" fill="#8a2b28" filter="url(#rough2)">得到 "Aa Ad, Ab Ae, Ac Bb, Ba Bc"</text>

  <rect x="36" y="262" width="694" height="52" rx="10" fill="#cfe0f5" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="52" y="284" font-size="11" fill="#2b2b2b" filter="url(#rough2)">为什么贪心不会把最优解做坏：只要"当前固定 + 剩余能达到的最大值 = M"，就说明存在一个把当前选择包含进去的最优解。</text>
  <text x="52" y="304" font-size="11" fill="#2b2b2b" filter="url(#rough2)">于是每一步都能保住"最终达到 M"这个目标，同时挑到当前字典序最小的附名。</text>

  <rect x="36" y="326" width="694" height="40" rx="8" fill="#e8e0f5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="52" y="351" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">输出时按名字升序拼接成 "名字 附名, 名字 附名, …"，行末不加空格和逗号。</text>
</svg>
