<svg xmlns="http://www.w3.org/2000/svg" width="740" height="450" viewBox="0 0 740 450"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="740" height="450" fill="#fafafa"/>
  <text x="370.0" y="36" font-size="20" fill="#2b2b2b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">洞 = 两条墙上的线段 + 朝向墙角的那段边界</text>
  <path d="M 118 46 Q 370 52 622 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <line x1="150.0" y1="380.0" x2="700.0" y2="380.0" stroke="#2b2b2b" stroke-width="2.0" marker-end="url(#arrb2)" filter="url(#rough2)"/>
  <line x1="150.0" y1="380.0" x2="150.0" y2="80.0" stroke="#2b2b2b" stroke-width="2.0" marker-end="url(#arrb2)" filter="url(#rough2)"/>
  <text x="706" y="384" font-size="13" fill="#2b2b2b" text-anchor="start" font-weight="bold" filter="url(#rough2)">x</text>
  <text x="136" y="76" font-size="13" fill="#2b2b2b" text-anchor="start" font-weight="bold" filter="url(#rough2)">y</text>
  <text x="120" y="398" font-size="12" fill="#2b2b2b" text-anchor="start" font-weight="bold" filter="url(#rough2)">O</text>
  <polygon points="213.0,380.0 332.0,355.5 374.0,268.0 304.0,170.0 150.0,212.0" fill="#e8f0fe" fill-opacity="0.75" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <circle cx="213.0" cy="380.0" r="3.4" fill="#446688" filter="url(#rough2)"/>
  <circle cx="332.0" cy="355.5" r="3.4" fill="#446688" filter="url(#rough2)"/>
  <circle cx="374.0" cy="268.0" r="3.4" fill="#446688" filter="url(#rough2)"/>
  <circle cx="304.0" cy="170.0" r="3.4" fill="#446688" filter="url(#rough2)"/>
  <circle cx="150.0" cy="212.0" r="3.4" fill="#446688" filter="url(#rough2)"/>
  <text x="189.0" y="402.0" font-size="14" fill="#8a3030" text-anchor="start" font-weight="bold" filter="url(#rough2)">A</text>
  <text x="124.0" y="206.0" font-size="14" fill="#8a3030" text-anchor="start" font-weight="bold" filter="url(#rough2)">B</text>
  <circle cx="213.0" cy="380.0" r="5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="150.0" cy="212.0" r="5" fill="#b85450" filter="url(#rough2)"/>
  <polygon points="150.0,380.0 213.0,380.0 332.0,355.5 374.0,268.0 304.0,170.0 150.0,212.0" fill="#fff3e0" fill-opacity="0.85" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="181.5" y="341.5" font-size="14" fill="#8a6015" text-anchor="middle" font-weight="bold" filter="url(#rough2)">洞</text>
  <text x="470" y="423.4" font-size="11.5" fill="#8a6015" text-anchor="middle" filter="url(#rough2)">∠ AOB 就是墙角</text>
  <rect x="400" y="52" width="300" height="96" rx="9" fill="#f2f6fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="416" y="76" font-size="11.5" fill="#2f4a66" text-anchor="start" filter="url(#rough2)">A：最下方的顶点（贴 x 轴）</text>
  <text x="416" y="98" font-size="11.5" fill="#2f4a66" text-anchor="start" filter="url(#rough2)">B：最左方的顶点（贴 y 轴）</text>
  <text x="416" y="120" font-size="11.5" fill="#2f4a66" text-anchor="start" filter="url(#rough2)">链 = 逆时针从 B 走到 A 的那段</text>
  <text x="416" y="140" font-size="10.5" fill="#7a5a1b" text-anchor="start" filter="url(#rough2)">（最左点之后往下、最下点之后往右）</text>
  <rect x="60" y="394" width="650" height="50" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="76" y="416" font-size="11.5" fill="#8a6015" text-anchor="start" filter="url(#rough2)">洞的边界：O → A → 逆时针链 → B → O</text>
  <text x="76" y="436" font-size="11.5" fill="#8a6015" text-anchor="start" filter="url(#rough2)">洞面积 2U = S0 + cross(R(A−B), t)，展开得 U(θ) = (T + M·cos2θ + N·sin2θ)/4，系数全为整数。</text>
</svg>
