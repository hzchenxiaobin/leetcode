<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar3" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">背包数子集：dp[人数][身高和]，再按 1/C(n-1,k) 加权</text>
  <path d="M 70 42 Q 360 48 650 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- dp 表 -->
  <text x="180" y="72" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">
    对固定的 i，只用「除 i 以外」的人做背包
  </text>
  <g filter="url(#rough2)">
    <rect x="60" y="84" width="240" height="150" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <line x1="60" y1="114" x2="300" y2="114" stroke="#446688" stroke-width="1.4"/>
    <line x1="60" y1="144" x2="300" y2="144" stroke="#c8d4e6" stroke-width="1"/>
    <line x1="60" y1="174" x2="300" y2="174" stroke="#c8d4e6" stroke-width="1"/>
    <line x1="60" y1="204" x2="300" y2="204" stroke="#c8d4e6" stroke-width="1"/>
    <line x1="108" y1="84" x2="108" y2="234" stroke="#446688" stroke-width="1.4"/>
    <line x1="156" y1="84" x2="156" y2="234" stroke="#c8d4e6" stroke-width="1"/>
    <line x1="204" y1="84" x2="204" y2="234" stroke="#c8d4e6" stroke-width="1"/>
    <line x1="252" y1="84" x2="252" y2="234" stroke="#c8d4e6" stroke-width="1"/>
  </g>
  <g font-size="12" fill="#22314a" text-anchor="middle" filter="url(#rough2)">
    <text x="84" y="104">k \ s</text>
    <text x="132" y="104">0</text>
    <text x="180" y="104">a₁</text>
    <text x="228" y="104">…</text>
    <text x="276" y="104">p</text>
    <text x="84" y="134">0</text>
    <text x="180" y="134">0</text>
    <text x="84" y="164">1</text>
    <text x="84" y="194">2</text>
    <text x="60" y="226"></text>
  </g>
  <g font-size="11.5" fill="#888" text-anchor="middle" filter="url(#rough2)">
    <text x="132" y="134">1</text>
    <text x="276" y="134">0</text>
  </g>

  <!-- 转移 -->
  <g font-size="12" fill="#a04a46" filter="url(#rough2)">
    <path d="M 186 150 L 246 176" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#ar3)"/>
    <text x="196" y="200">dp[k][s] += dp[k-1][s-aⱼ]</text>
  </g>
  <text x="180" y="250" text-anchor="middle" font-size="11" fill="#556" filter="url(#rough2)">
    加入第 j 人：人数 +1、和 +aⱼ
  </text>
  <text x="180" y="268" text-anchor="middle" font-size="11" fill="#556" filter="url(#rough2)">
    k 必须倒序枚举，避免同一人被重复使用
  </text>

  <!-- 累加 -->
  <text x="470" y="72" text-anchor="middle" font-size="13" fill="#2f5223" filter="url(#rough2)">
    客人 i 入座概率
  </text>
  <g filter="url(#rough2)">
    <rect x="340" y="84" width="300" height="150" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <text x="490" y="112" text-anchor="middle" font-size="13" fill="#2f5223" filter="url(#rough2)">
    Pᵢ = (1/n) · Σₖ ( Σ_{s ≤ p-aᵢ} dp[k][s] ) / C(n-1,k)
  </text>
  <g font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">
    <text x="356" y="140">分母 C(n-1,k)：从 n-1 人里挑 k 人的方案数</text>
    <text x="356" y="162">分子 dp[k][s]：其中身高和恰为 s 的挑法数</text>
    <text x="356" y="184">求和 s ≤ p - aᵢ：进来后还坐得下（题目要求）</text>
    <text x="356" y="206">最外层 1/n：i 在队列中的位置均匀分布</text>
  </g>

  <!-- 汇总 -->
  <g filter="url(#rough2)">
    <rect x="60" y="266" width="600" height="60" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="360" y="290" text-anchor="middle" font-size="14.5" fill="#22314a" filter="url(#rough2)">
    ans = Σᵢ Pᵢ = Σᵢ (1/n) Σₖ (Σ_{s ≤ p-aᵢ} dp_i[k][s]) / C(n-1,k)
  </text>
  <text x="360" y="314" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">
    期望的线性性：把「平均入座人数」拆成 n 个「第 i 人入座的概率」之和
  </text>

  <!-- 数值 -->
  <g font-size="12.5" fill="#333" filter="url(#rough2)">
    <text x="60" y="356">数值实现用 double（或 long double）：C(n-1,k) 最大 C(49,24) ≈ 6.3×10¹³，</text>
    <text x="60" y="378">在 double 的精确表示范围内足够用；答案只需 1e-4 误差。</text>
    <text x="60" y="400">注意每个 i 都要重做一次背包，O(n²p) 次加法，n ≤ 50 时只有 1.25×10⁵。</text>
  </g>
</svg>
