<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="73"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="820" height="440" fill="#fafafa"/>

  <text x="410" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">分块后每个位置存三个值：nxt / cnt / lst</text>
  <path d="M 150 40 Q 410 46 660 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <path d="M 60 92 L 60 80 L 298 80 L 298 92" stroke="#666666" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="179" y="72" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">块 1</text>
  <path d="M 312 92 L 312 80 L 550 80 L 550 92" stroke="#666666" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="431" y="72" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">块 2</text>
  <path d="M 564 92 L 564 80 L 718 80 L 718 92" stroke="#666666" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="641" y="72" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">块 3</text>
  <rect x="60" y="96" width="70" height="50" rx="8" fill="#cfe0f5" stroke="#777777" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="95" y="127" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="95" y="166" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">a=1</text>
  <rect x="144" y="96" width="70" height="50" rx="8" fill="#cfe0f5" stroke="#777777" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="179" y="127" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="179" y="166" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">a=1</text>
  <rect x="228" y="96" width="70" height="50" rx="8" fill="#cfe0f5" stroke="#777777" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="263" y="127" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="263" y="166" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">a=1</text>
  <rect x="312" y="96" width="70" height="50" rx="8" fill="#d9ecd4" stroke="#777777" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="347" y="127" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="347" y="166" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">a=1</text>
  <rect x="396" y="96" width="70" height="50" rx="8" fill="#d9ecd4" stroke="#777777" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="431" y="127" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <text x="431" y="166" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">a=1</text>
  <rect x="480" y="96" width="70" height="50" rx="8" fill="#d9ecd4" stroke="#777777" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="515" y="127" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">6</text>
  <text x="515" y="166" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">a=2</text>
  <rect x="564" y="96" width="70" height="50" rx="8" fill="#f6d9d7" stroke="#777777" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="599" y="127" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">7</text>
  <text x="599" y="166" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">a=8</text>
  <rect x="648" y="96" width="70" height="50" rx="8" fill="#f6d9d7" stroke="#777777" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="683" y="127" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">8</text>
  <text x="683" y="166" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">a=2</text>
  <text x="189" y="196" text-anchor="middle" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">cnt[1]=3  lst[1]=3</text>
  <text x="189" y="214" text-anchor="middle" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">nxt[1]=4（进块 2）</text>
  <text x="441" y="196" text-anchor="middle" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">cnt[4]=3  lst[4]=6</text>
  <text x="441" y="214" text-anchor="middle" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">nxt[4]=8（进块 3）</text>
  <text x="651" y="196" text-anchor="middle" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">cnt[8]=1  lst[8]=8</text>
  <text x="651" y="214" text-anchor="middle" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">nxt[8]=9（出界）</text>
  <rect x="80" y="262" width="52" height="36" rx="8" fill="#cfe0f5" stroke="#555555" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="106" y="286" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <path d="M 134 280 L 146 280" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="150" y="262" width="52" height="36" rx="8" fill="#cfe0f5" stroke="#555555" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="176" y="286" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <path d="M 204 280 L 216 280" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="220" y="262" width="52" height="36" rx="8" fill="#cfe0f5" stroke="#555555" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="246" y="286" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <path d="M 274 280 L 286 280" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="290" y="262" width="52" height="36" rx="8" fill="#d9ecd4" stroke="#555555" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="316" y="286" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <path d="M 344 280 L 356 280" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="360" y="262" width="52" height="36" rx="8" fill="#d9ecd4" stroke="#555555" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="386" y="286" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <path d="M 414 280 L 426 280" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="430" y="262" width="52" height="36" rx="8" fill="#d9ecd4" stroke="#555555" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="456" y="286" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">6</text>
  <path d="M 484 280 L 496 280" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="500" y="262" width="52" height="36" rx="8" fill="#f6d9d7" stroke="#555555" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="526" y="286" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">8</text>
  <path d="M 505 280 L 566 280" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="572" y="262" width="76" height="36" rx="8" fill="#ffffff" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="610" y="286" text-anchor="middle" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">出界</text>
  <text x="106" y="322" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">3 跳</text>
  <text x="316" y="322" text-anchor="middle" font-size="10.5" fill="#2f5223" filter="url(#rough2)">3 跳</text>
  <text x="456" y="322" text-anchor="middle" font-size="10.5" fill="#8a2b28" filter="url(#rough2)">1 跳</text>
  <text x="80" y="360" font-size="12" fill="#2b2b2b" filter="url(#rough2)">查询 1 号洞：按块累加 3 + 3 + 1 = 7 跳；最后一个 lst 是 8，所以输出 8 7。</text>
  <text x="80" y="388" font-size="12" fill="#2b2b2b" filter="url(#rough2)">每次查询只经过 ⌈N/B⌉ 个块；修改时只重算同一块里 x 左侧的那一段，O(B)。</text>
  <text x="80" y="416" font-size="11.5" fill="#8a6015" filter="url(#rough2)">关键：lst 记的是“块内最后停留的洞”，不是落点；cnt 把“跳出块的那一跳”也算进去。</text>
</svg>
