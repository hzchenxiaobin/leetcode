<svg xmlns="http://www.w3.org/2000/svg" width="820" height="560" viewBox="0 0 820 560"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="820" height="560" fill="#fafafa"/>

  <text x="410" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">样例走查与我造的反例</text>
  <path d="M 260 44 Q 410 50 560 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 左：官方样例 -->
  <rect x="18" y="60" width="470" height="466" rx="10" fill="#ffffff" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="38" y="88" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">官方样例：n = 3，v = 2</text>

  <text x="38" y="120" font-size="12.5" fill="#333" filter="url(#rough2)">货物  1:(1, 2)   2:(2, 7)   3:(1, 3)</text>
  <text x="38" y="150" font-size="12.5" fill="#333" filter="url(#rough2)">单格降序  3(#3), 2(#1)   →   P1 = [0, 3, 5]</text>
  <text x="38" y="180" font-size="12.5" fill="#333" filter="url(#rough2)">双格降序  7(#2)         →   P2 = [0, 7]</text>

  <path d="M 38 200 L 468 200" stroke="#c9d6e4" stroke-width="1.2" stroke-dasharray="6 5" fill="none" filter="url(#rough2)"/>

  <text x="38" y="230" font-size="12.5" fill="#333" filter="url(#rough2)">k = 0：t = min(2, 2) = 2，f = 0 + 5 = 5</text>
  <text x="38" y="260" font-size="12.5" fill="#b85450" filter="url(#rough2)">k = 1：t = min(2, 0) = 0，f = 7 + 0 = 7（最优）</text>
  <text x="38" y="290" font-size="12.5" fill="#333" filter="url(#rough2)">k 的上界 = min(c2, v/2) = min(1, 1) = 1</text>
  <text x="38" y="320" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">答案 7，输出编号 2</text>

  <path d="M 38 344 L 468 344" stroke="#c9d6e4" stroke-width="1.2" stroke-dasharray="6 5" fill="none" filter="url(#rough2)"/>

  <text x="38" y="374" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">为什么「先卡满双格」会错</text>
  <text x="38" y="402" font-size="12" fill="#555" filter="url(#rough2)">k → k+1：多拿一个双格，容量 +p2[k+1]，</text>
  <text x="38" y="426" font-size="12" fill="#555" filter="url(#rough2)">但要让出两个单格，容量 −p1[t] − p1[t−1]。</text>
  <text x="38" y="450" font-size="12" fill="#555" filter="url(#rough2)">两个方向的量没有固定大小关系，</text>
  <text x="38" y="474" font-size="12" fill="#555" filter="url(#rough2)">所以 f(k) 既非单调也非凹。</text>
  <text x="38" y="500" font-size="12" fill="#8a6015" filter="url(#rough2)">枚举 k 的代价只有 O(c2)，完全可以接受。</text>

  <!-- 右：反例柱状图 -->
  <rect x="502" y="60" width="300" height="466" rx="10" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="520" y="88" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">反例：f(k) 先升后降</text>
  <text x="520" y="118" font-size="12" fill="#333" filter="url(#rough2)">双格  100(#1), 1(#2)</text>
  <text x="520" y="142" font-size="12" fill="#333" filter="url(#rough2)">单格  60(#3), 60(#4), 60(#5)</text>
  <text x="520" y="166" font-size="12" fill="#333" filter="url(#rough2)">v = 4，故 k ≤ 2</text>

  <line x1="524" y1="380" x2="786" y2="380" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- 柱：f(0)=180, f(1)=220, f(2)=101，高 = 0.6*f -->
  <rect x="540" y="272" width="56" height="108" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="620" y="248" width="56" height="132" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="700" y="319" width="56" height="61" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="568" y="264" text-anchor="middle" font-size="13" fill="#23405c" filter="url(#rough2)">180</text>
  <text x="648" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#8c3b37" filter="url(#rough2)">220</text>
  <text x="728" y="311" text-anchor="middle" font-size="13" fill="#23405c" filter="url(#rough2)">101</text>

  <text x="568" y="400" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">k = 0</text>
  <text x="648" y="400" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">k = 1</text>
  <text x="728" y="400" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">k = 2</text>

  <text x="520" y="432" font-size="12" fill="#555" filter="url(#rough2)">k = 2（取满双格）只有 101，</text>
  <text x="520" y="456" font-size="12" fill="#555" filter="url(#rough2)">远差于 k = 1 的 220。</text>
  <text x="520" y="484" font-size="12" fill="#b85450" filter="url(#rough2)">⇒ 必须对每个 k 都算一遍。</text>
  <text x="520" y="508" font-size="11.5" fill="#777" filter="url(#rough2)">（此处 c2 = 2，枚举仅 3 次）</text>
</svg>
