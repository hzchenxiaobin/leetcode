<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1509"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="780" height="400" fill="#fafafa"/>
  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">样例走查：2 × 2，第一行 [-1, 2]，第二行 [1, 3]</text>

  <!-- 网格 -->
  <rect x="70" y="70" width="120" height="50" fill="#eef4ff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="130" y="100" text-anchor="middle" font-size="14" fill="#23405c" filter="url(#rough2)">-1</text>
  <rect x="190" y="70" width="120" height="50" fill="#eef4ff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="250" y="100" text-anchor="middle" font-size="14" fill="#23405c" filter="url(#rough2)">2</text>
  <rect x="70" y="120" width="120" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="130" y="150" text-anchor="middle" font-size="14" fill="#8a6015" filter="url(#rough2)">1</text>
  <rect x="190" y="120" width="120" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="250" y="150" text-anchor="middle" font-size="14" fill="#8a6015" filter="url(#rough2)">3</text>

  <text x="40" y="100" font-size="10.5" fill="#446688" filter="url(#rough2)">第一行</text>
  <text x="40" y="150" font-size="10.5" fill="#8a6015" filter="url(#rough2)">第二行</text>

  <!-- 表 -->
  <rect x="360" y="70" width="380" height="30" fill="#eef1f4" stroke="#7a8ca6" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="376" y="90" font-size="10.5" font-weight="bold" fill="#33445c" filter="url(#rough2)">k（选几个）</text>
  <text x="500" y="90" font-size="10.5" font-weight="bold" fill="#33445c" filter="url(#rough2)">dp[1][k]</text>
  <text x="620" y="90" font-size="10.5" font-weight="bold" fill="#33445c" filter="url(#rough2)">dp[2][k]</text>

  <rect x="360" y="100" width="380" height="28" fill="#ffffff" stroke="#d6d6d6" stroke-width="1" filter="url(#rough2)"/>
  <text x="376" y="119" font-size="10.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="500" y="119" font-size="10.5" fill="#555" filter="url(#rough2)">-1</text>
  <text x="620" y="119" font-size="10.5" fill="#2f5223" filter="url(#rough2)">2（=1+1）</text>

  <rect x="360" y="128" width="380" height="28" fill="#f7fbff" stroke="#d6d6d6" stroke-width="1" filter="url(#rough2)"/>
  <text x="376" y="147" font-size="10.5" fill="#555" filter="url(#rough2)">2</text>
  <text x="500" y="147" font-size="10.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="620" y="147" font-size="10.5" fill="#c0392b" filter="url(#rough2)">不可达（j&gt;2 不存在）</text>

  <rect x="360" y="170" width="380" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="376" y="190" font-size="11.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">答案 = max(dp[2][1], dp[2][2]) = 2</text>
  <text x="376" y="208" font-size="10" fill="#3c5e2e" filter="url(#rough2)">对应 c₁=2、c₂=1：2 &gt; 1 ✓，总收益 1+1=2</text>

  <text x="60" y="260" font-size="11" fill="#555" filter="url(#rough2)">为什么 c₁=1 不行：c₁&gt;c₂ 且 c₂≥1，所以 c₁ 至少为 2。DP 里 dp[2][2] 不可达正好体现了这一点。</text>
  <text x="60" y="284" font-size="11" fill="#555" filter="url(#rough2)">若把"谷"的转移写成 max_{j&lt;k}，会错误地允许 c₂&gt;c₁，样例会得 3（取 c₁=1,c₂=2 的非法方案）。</text>
  <text x="60" y="308" font-size="11" fill="#8c3b37" filter="url(#rough2)">峰/谷方向由行的奇偶决定：第 1 行峰（c₁&gt;c₂），第 2 行谷（c₂&lt;c₃），交替。</text>
</svg>
