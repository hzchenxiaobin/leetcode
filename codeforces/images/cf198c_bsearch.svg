<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="511"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="380" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">198C：g(t)=避障距离(P(t)) − v·t 单调不增 → 二分</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <line x1="90.0" y1="270.0" x2="630.0" y2="270.0" stroke="#888888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="90.0" y1="270.0" x2="90.0" y2="100.0" stroke="#888888" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 90 120 C 240 130, 390 210, 630 260" fill="#4a7a3a" stroke="2.0" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="624.0" y="254.0" text-anchor="end" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">g(t)</text>
  <line x1="420.0" y1="250.0" x2="420.0" y2="270.0" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="424.0" y="296.0" text-anchor="start" font-size="10.5" fill="#b85450" filter="url(#rough2)">首次 ≤0 的 t 即答案</text>
  <rect x="60.0" y="306.0" width="600.0" height="56.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="74.0" y="329.3" text-anchor="start" font-size="11.3" fill="#3f3420" filter="url(#rough2)">避障距离关于终点是 1-Lipschitz，行星速度 v_p ≤ v</text>
  <text x="74.0" y="353.3" text-anchor="start" font-size="11.3" fill="#3f3420" filter="url(#rough2)">⇒ g 单调不增，二分 200 次可达 1e-9 精度</text>
</svg>
