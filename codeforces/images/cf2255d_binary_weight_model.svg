<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M 0 0 L 8 3 L 0 6 z" fill="#7a8fa6"/>
    </marker>
  </defs>

  <rect width="720" height="470" fill="#fafafa"/>

  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">把每个数看成二进制权值：未选中 = 1，选中 = 0</text>
  <text x="360" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每秒全体都折半 ⟹ 决定归零时刻的只有「哪些秒选中了它」</text>

  <g filter="url(#rough2)">
    <rect x="60" y="64" width="600" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="9"/>
    <text x="76" y="86" font-size="11.5" font-weight="bold" fill="#333">① 单步改写成统一形式</text>
    <text x="76" y="105" font-size="9.6" fill="#555">被选中：floor(x/2) = ⌊x/2⌋；没被选中：ceil(x/2) = ⌊(x+1)/2⌋ ⟹ 统统写成 v ← ⌊(v + b)/2⌋，b = 1 表示没被选中</text>
  </g>
  <path d="M 360 116 L 360 136" stroke="#7a8fa6" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="60" y="138" width="600" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="9"/>
    <text x="76" y="160" font-size="11.5" font-weight="bold" fill="#333">② 连乘展开（归纳）</text>
    <text x="76" y="179" font-size="9.6" fill="#555">t 秒后 v_t = ⌊(a + B_t) / 2^t⌋，B_t 是把 b₁b₂…b_t 按「高位在前」读出的二进制数</text>
  </g>
  <path d="M 360 190 L 360 210" stroke="#7a8fa6" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="60" y="212" width="600" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="9"/>
    <text x="76" y="234" font-size="11.5" font-weight="bold" fill="#333">③ 归零条件：只看「选中」的权值和 S_t</text>
    <text x="76" y="253" font-size="9.6" fill="#555">v_t = 0 ⟺ a + B_t &lt; 2^t ⟺ S_t ≥ a，其中 S_t = Σ (第 j 秒被选中) 2^(t−j)，注意 Σ_{j≤t} 2^(t−j) = 2^t − 1</text>
  </g>
  <path d="M 360 264 L 360 284" stroke="#7a8fa6" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="70" y="304" font-size="10.5" fill="#666" filter="url(#rough2)">例：a = 10，T = 4，第 1、2 秒选中</text>

  <g filter="url(#rough2)">
    <rect x="90" y="312" width="120" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6"/>
    <text x="150" y="335" text-anchor="middle" font-size="13" fill="#333">选</text>
    <rect x="230" y="312" width="120" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6"/>
    <text x="290" y="335" text-anchor="middle" font-size="13" fill="#333">选</text>
    <rect x="370" y="312" width="120" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6"/>
    <text x="430" y="335" text-anchor="middle" font-size="13" fill="#333">未选</text>
    <rect x="510" y="312" width="120" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6"/>
    <text x="570" y="335" text-anchor="middle" font-size="13" fill="#333">未选</text>

    <text x="150" y="364" text-anchor="middle" font-size="10" fill="#4a7a3a">b = 0，权 8</text>
    <text x="290" y="364" text-anchor="middle" font-size="10" fill="#4a7a3a">b = 0，权 4</text>
    <text x="430" y="364" text-anchor="middle" font-size="10" fill="#d6a040">b = 1，权 2</text>
    <text x="570" y="364" text-anchor="middle" font-size="10" fill="#d6a040">b = 1，权 1</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="378" width="600" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="9"/>
    <text x="360" y="403" text-anchor="middle" font-size="11.5" fill="#b85450">S₄ = 8 + 4 = 12 ≥ a = 10 ⟹ v₄ = ⌊(10 + 3)/16⌋ = 0；且 S 单调不减，一旦归零就永远是 0</text>
  </g>

  <text x="360" y="444" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">于是「第几秒归零」等价于「这个元素攒够权值 a_i 的时刻」</text>
</svg>
