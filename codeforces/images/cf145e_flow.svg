<svg xmlns="http://www.w3.org/2000/svg" width="700" height="200" viewBox="0 0 700 200"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1452"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="700" height="200" fill="#fafafa"/>
  <text x="350.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">流 程</text>
  <path d="M 112.0 42 Q 350.0 48 588.0 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="350.0" y="186" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">O((n+m) log n)</text>
  <text x="350" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#335478" filter="url(#rough2)">建树 → switch 打 lazy 翻转 → count 输出根 inc</text>
  <text x="350" y="125" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">下推时对两个子段做同样的 applyFlip</text>
  <text x="350" y="160" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">lazy 标记为 0/1 位，异或即可</text>
</svg>
