<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">固定 S 后：每段高度有唯一的下界</text>
  <text x="310" y="48" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">任意可行解 y 必须满足 y_j ≥ h_i − S·dist(i,j)：沿最短弧把相邻差逐段累加即可得到</text>
  <text x="310" y="66" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">把所有这些下界取 max，得到的方案自身合法且逐点最小，缺口之和就是最少用土量</text>

  <line x1="70" y1="290" x2="590" y2="290" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>

  <rect x="87" y="274" width="46" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="167" y="210" width="46" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="247" y="258" width="46" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="327" y="162" width="46" height="128" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="407" y="242" width="46" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="487" y="274" width="46" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>

  <rect x="247" y="226" width="46" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="407" y="226" width="46" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>

  <line x1="247" y1="226" x2="293" y2="226" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <line x1="407" y1="226" x2="453" y2="226" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" filter="url(#rough2)"/>

  <line x1="350" y1="162" x2="270" y2="226" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <line x1="270" y1="226" x2="190" y2="290" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <line x1="350" y1="162" x2="430" y2="226" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <line x1="430" y1="226" x2="510" y2="290" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <text x="110" y="285" text-anchor="middle" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">1</text>
  <text x="190" y="285" text-anchor="middle" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">5</text>
  <text x="270" y="283" text-anchor="middle" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">2</text>
  <text x="350" y="285" text-anchor="middle" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">8</text>
  <text x="430" y="285" text-anchor="middle" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">3</text>
  <text x="510" y="285" text-anchor="middle" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">1</text>

  <text x="270" y="220" text-anchor="middle" font-size="10" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="430" y="220" text-anchor="middle" font-size="10" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">4</text>

  <text x="302" y="246" text-anchor="middle" font-size="9" fill="#a06030" filter="url(#rough2)">+2</text>
  <text x="466" y="238" text-anchor="middle" font-size="9" fill="#a06030" filter="url(#rough2)">+1</text>

  <text x="110" y="308" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">1</text>
  <text x="190" y="308" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">2</text>
  <text x="270" y="308" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">3</text>
  <text x="350" y="308" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">4</text>
  <text x="430" y="308" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">5</text>
  <text x="510" y="308" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">6</text>

  <rect x="70" y="330" width="18" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="94" y="340" font-size="10" fill="#555" filter="url(#rough2)">原始高度 h</text>
  <rect x="190" y="330" width="18" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="214" y="340" font-size="10" fill="#555" filter="url(#rough2)">需要填的土</text>
  <line x1="306" y1="336" x2="336" y2="336" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="344" y="340" font-size="10" fill="#555" filter="url(#rough2)">下界包络 x（锥形，斜率 ±S）</text>

  <text x="310" y="372" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">自造示意：n = 6，S = 4，h = (1,5,2,8,3,1) → x = (1,5,4,8,4,1)，第 3 段 +2、第 5 段 +1，共 3 单位土</text>
  <text x="310" y="390" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">环上两段的距离取两条弧中较短者，因此左右两侧的锥要各算一次</text>
</svg>
