<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="53"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="320" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">D：样例走查——四个二进制三位数怎么分页</text>
  <path d="M 150 42 Q 380 47 610 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="380" y="60" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">二进制下长度为 3 且无前导零的数：100、101、110、111，共 4 个</text>

  <text x="60" y="100" font-size="11.5" fill="#777" filter="url(#rough2)">c = 3：每页 3 个</text>
  <rect x="60" y="110" width="212" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="166" y="142" text-anchor="middle" font-size="13" fill="#2f4a66" font-family="'Courier New',monospace" filter="url(#rough2)">100  101  110</text>
  <rect x="284" y="110" width="90" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="329" y="142" text-anchor="middle" font-size="13" fill="#2f5223" font-family="'Courier New',monospace" filter="url(#rough2)">111</text>
  <text x="60" y="182" font-size="10.5" fill="#555" filter="url(#rough2)">第 1 页</text>
  <text x="300" y="182" font-size="10.5" fill="#2f5223" filter="url(#rough2)">第 2 页 → 答案 1</text>

  <text x="60" y="220" font-size="11.5" fill="#777" filter="url(#rough2)">c = 4：每页 4 个</text>
  <rect x="60" y="230" width="304" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="212" y="262" text-anchor="middle" font-size="13" fill="#2f4a66" font-family="'Courier New',monospace" filter="url(#rough2)">100  101  110  111</text>
  <text x="60" y="300" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">只有一页，最后一页上有 4 个 → 答案 4</text>

  <rect x="424" y="96" width="296" height="90" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="436" y="120" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">公式对照</text>
  <text x="436" y="146" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">N = (b−1)·b^(n−1) = 1·2² = 4</text>
  <text x="436" y="168" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">答案 = (N−1) mod c + 1</text>

  <rect x="424" y="200" width="296" height="82" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="436" y="224" font-size="10.5" fill="#2f5223" filter="url(#rough2)">c = 3：(4−1) mod 3 + 1 = 1 ✓</text>
  <text x="436" y="246" font-size="10.5" fill="#2f5223" filter="url(#rough2)">c = 4：(4−1) mod 4 + 1 = 4 ✓</text>
  <text x="436" y="268" font-size="10" fill="#3c5e2e" filter="url(#rough2)">N mod c = 0 时答案正好是 c（满页）</text>
</svg>
