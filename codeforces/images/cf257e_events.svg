<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="360" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">电梯每秒重算 p_up / p_down，方向只在这些时刻改变</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">两次"事件"之间方向不变，可以整段跳跃，而不是逐秒模拟</text>
  <line x1="100" y1="240" x2="800" y2="240" stroke="#8899aa" stroke-width="1.3" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="118" y="150" width="44" height="50" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="140.0" y="179.68" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="218" y="150" width="44" height="50" rx="4" fill="#cfe0f0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="240.0" y="179.68" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="318" y="150" width="44" height="50" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="340.0" y="179.68" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="418" y="150" width="44" height="50" rx="4" fill="#cfe0f0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="440.0" y="179.68" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><rect x="518" y="150" width="44" height="50" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="540.0" y="179.68" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <g filter="url(#rough2)"><rect x="618" y="150" width="44" height="50" rx="4" fill="#cfe0f0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="640.0" y="179.68" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">6</text>
  <g filter="url(#rough2)"><rect x="718" y="150" width="44" height="50" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="740.0" y="179.68" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">7</text>
  <text x="440" y="120" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">楼层 1..m</text>
  <line x1="180" y1="270" x2="400" y2="270" stroke="#b05a5a" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="290" y="296" text-anchor="middle" font-size="12" fill="#b05a5a" filter="url(#rough2)">整段跳跃（途中无事件）</text>
  <text x="440" y="330" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">事件 = 有人到达 / 到站上下客 / 某层被清空</text>
</svg>
