<svg xmlns="http://www.w3.org/2000/svg" width="740" height="350" viewBox="0 0 740 350"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="53"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="m1" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="740" height="350" fill="#fafafa"/>

  <text x="370" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">合并 = 把点分成若干组，再收缩成商图</text>
  <path d="M 150 40 Q 370 46 590 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 原图 -->
  <text x="110" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a68" filter="url(#rough2)">原图（样例 1）</text>
  <polygon points="150,110 205,160 110,190" fill="#fdf0ef" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="150" y1="110" x2="150" y2="240" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="150" cy="110" r="6" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="205" cy="160" r="6" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="110" cy="190" r="6" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="150" cy="240" r="6" fill="#446688" filter="url(#rough2)"/>
  <text x="160" y="102" font-size="12" fill="#8c3a37" filter="url(#rough2)">2</text>
  <text x="214" y="158" font-size="12" fill="#8c3a37" filter="url(#rough2)">3</text>
  <text x="94" y="196" font-size="12" fill="#8c3a37" filter="url(#rough2)">4</text>
  <text x="160" y="252" font-size="12" fill="#2b4a68" filter="url(#rough2)">1</text>
  <text x="150" y="278" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">4 个点，1 号是挂在三角形上的叶子</text>

  <!-- 箭头 -->
  <path d="M 250 160 L 320 160" stroke="#446688" stroke-width="2" marker-end="url(#m1)" filter="url(#rough2)"/>
  <text x="285" y="146" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b4a68" filter="url(#rough2)">合并 2,3,4</text>
  <text x="285" y="180" text-anchor="middle" font-size="10.5" fill="#2b4a68" filter="url(#rough2)">2 次操作</text>

  <!-- 商图 -->
  <text x="470" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">商图（收缩掉 {2,3,4}）</text>
  <circle cx="420" cy="240" r="8" fill="#446688" filter="url(#rough2)"/>
  <text x="420" y="266" text-anchor="middle" font-size="12" fill="#2b4a68" filter="url(#rough2)">{1}</text>
  <line x1="420" y1="232" x2="420" y2="180" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="420" cy="168" r="12" fill="#b85450" filter="url(#rough2)"/>
  <text x="420" y="173" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff" filter="url(#rough2)">A</text>
  <text x="470" y="150" font-size="12" fill="#8c3a37" filter="url(#rough2)">{2,3,4} → 一个点 A</text>
  <!-- 自环 -->
  <path d="M 432 168 Q 470 150 456 178" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 408 162 Q 372 140 392 176" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 414 180 Q 396 222 428 198" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="510" y="196" font-size="11" fill="#8c3a37" filter="url(#rough2)">三角形 3 条边 → A 上的 3 个自环</text>
  <text x="510" y="216" font-size="11" fill="#8c3a37" filter="url(#rough2)">（题面允许自环，不许重边）</text>

  <!-- 结论 -->
  <rect x="60" y="292" width="620" height="44" rx="8" fill="#f4f8ee" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="370" y="319" text-anchor="middle" font-size="12.5" fill="#2f5223" filter="url(#rough2)">商图必须连通、无重边、去掉自环后是树，且是毛毛虫（存在一条路径，所有点距它 ≤ 1）</text>
</svg>
