<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="159"/>
    <feDisplacementMap in="SourceGraphic" scale="1.4"/></filter></defs>
  <rect width="760" height="300" fill="#fafafa"/>
  <text x="380" y="34" text-anchor="middle" font-size="17.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">22D：交换论证</text>
  <path d="M 120 46 Q 380 52 640 46" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <rect x="70" y="78" width="620" height="66" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="92" y="106" font-size="13" fill="#23405c" filter="url(#rough2)">任何最优解的第一个钉子可换成本算法的</text>
  <text x="92" y="130" font-size="12" fill="#44597a" filter="url(#rough2)">（图中只画关键一步，细节见正文）</text>
  <rect x="70" y="164" width="620" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="92" y="196" font-size="12.5" fill="#8a6015" filter="url(#rough2)">不影响后面，故贪心最优</text>
  <rect x="70" y="236" width="620" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="92" y="263" font-size="12" fill="#2f5223" filter="url(#rough2)">结论：正确性见正文引理与定理，复杂度见第 5 节。</text>
</svg>
