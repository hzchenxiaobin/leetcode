<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="720" height="320" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">移动 x 取走 x、2x、2x+1 各一枚 ⇒ 宝箱 i 只受「自己」和「父亲 i/2」影响</text>
  <rect x="326" y="38" width="68" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="360" y="65" text-anchor="middle" font-size="13" fill="#2f4a66">1</text>
  <rect x="186" y="118" width="68" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="220" y="145" text-anchor="middle" font-size="13" fill="#2f4a66">2</text>
  <rect x="466" y="118" width="68" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="500" y="145" text-anchor="middle" font-size="13" fill="#2f4a66">3</text>
  <rect x="116" y="198" width="68" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="150" y="225" text-anchor="middle" font-size="13" fill="#2f4a66">4</text>
  <rect x="256" y="198" width="68" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="290" y="225" text-anchor="middle" font-size="13" fill="#2f4a66">5</text>
  <rect x="396" y="198" width="68" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="430" y="225" text-anchor="middle" font-size="13" fill="#2f4a66">6</text>
  <rect x="536" y="198" width="68" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="570" y="225" text-anchor="middle" font-size="13" fill="#2f4a66">7</text>
  <line x1="360" y1="82" x2="220" y2="116" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="360" y1="82" x2="500" y2="116" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="220" y1="162" x2="150" y2="196" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="220" y1="162" x2="290" y2="196" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="500" y1="162" x2="430" y2="196" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="500" y1="162" x2="570" y2="196" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="360" y="282" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">令 m_x = 用参数 x 移动的次数：宝箱 i 需要 m_i + m_{i/2} ≥ a_i（不可用的 m 记 0）</text>
  <text x="360" y="306" text-anchor="middle" font-size="11.5" fill="#4a2a62" filter="url(#rough2)">在树上自底向上做 DP：f_i(t) = min_{m ≥ max(0,a_i−t)} [ m + f_2i(m) + f_2i+1(m) ]</text>
</svg>
