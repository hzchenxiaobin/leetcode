<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="19"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="440" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：三组样例的位移一律取 (0, R)</text>
  <path d="M 150 42 Q 380 49 610 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 表头 -->
  <rect x="30" y="74" width="700" height="44" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="63" y="102" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">组</text>
  <text x="186" y="102" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">输入 (x₀, y₀, R)</text>
  <text x="336" y="102" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">位移 (Δx, Δy)</text>
  <text x="466" y="102" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">输出 (x, y)</text>
  <text x="633" y="102" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">校验 Δx² + Δy² = R²</text>

  <!-- 第 1 行 -->
  <rect x="30" y="118" width="700" height="52" fill="#ffffff" stroke="#dfe4e8" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="63" y="149" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="186" y="149" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">(0, 0, 1)</text>
  <text x="336" y="149" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">(0, 1)</text>
  <text x="466" y="149" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">(0, 1)</text>
  <text x="633" y="149" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">0² + 1² = 1 ✓</text>

  <!-- 第 2 行 -->
  <rect x="30" y="170" width="700" height="52" fill="#fafafa" stroke="#dfe4e8" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="63" y="201" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="186" y="201" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">(5, 5, 5)</text>
  <text x="336" y="201" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">(0, 5)</text>
  <text x="466" y="201" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">(5, 10)</text>
  <text x="633" y="201" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">0² + 5² = 25 ✓</text>

  <!-- 第 3 行 -->
  <rect x="30" y="222" width="700" height="52" fill="#ffffff" stroke="#dfe4e8" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="63" y="253" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="186" y="253" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">(10, 10, 13)</text>
  <text x="336" y="253" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">(0, 13)</text>
  <text x="466" y="253" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">(10, 23)</text>
  <text x="633" y="253" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">0² + 13² = 169 ✓</text>

  <!-- 官方输出对照 -->
  <text x="380" y="296" text-anchor="middle" font-size="12" fill="#8a8a8a" filter="url(#rough2)">官方样例输出为 0 1 / 2 1 / −2 5：第 2、3 组用的是 (−3, −4)、(−12, −5) 这两组勾股位移</text>
  <text x="380" y="314" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">本题是 special judge（多解题），只校验 (x−x₀)² + (y−y₀)² = R²，所以上面的输出同样正确</text>

  <!-- 底部两条观察 -->
  <rect x="30" y="332" width="336" height="88" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="198" y="356" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">轴点永远存在</text>
  <text x="46" y="380" font-size="11" fill="#3c5e2e" filter="url(#rough2)">R = 1, 2, 3, 4, 6, 7, 8, 9, 11 … 时 R</text>
  <text x="46" y="400" font-size="11" fill="#3c5e2e" filter="url(#rough2)">不是任何勾股三元组的斜边，圆上只剩</text>
  <text x="46" y="414" font-size="11" fill="#3c5e2e" filter="url(#rough2)">4 个轴点；本题的输出恰好只用到它们。</text>

  <rect x="382" y="332" width="348" height="88" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="556" y="356" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">勾股点只影响「解多不多」</text>
  <text x="398" y="380" font-size="11" fill="#8a6015" filter="url(#rough2)">R = 5, 10, 13, 15, 17, 20 时圆上共 12 个整点，</text>
  <text x="398" y="400" font-size="11" fill="#8a6015" filter="url(#rough2)">R = 25 时达 20 个；但解的个数再多，也只需</text>
  <text x="398" y="414" font-size="11" fill="#8a6015" filter="url(#rough2)">随手取一个 —— 轴点就是构造性存在性证明。</text>
</svg>
