<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="37"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="360" fill="#fafafa"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">状态压缩：只按状态值记位置，不存整条序列</text>
  <path d="M 180 46 Q 360 52 540 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="40" y="70" width="300" height="196" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">f(x) = (a·x + b) mod m</text>
  <text x="70" y="118" text-anchor="start" font-size="12" font-weight="normal" fill="#555" filter="url(#rough2)">x = 0</text>
  <text x="160" y="118" text-anchor="middle" font-size="12" font-weight="normal" fill="#888" filter="url(#rough2)">→</text>
  <text x="190" y="118" text-anchor="start" font-size="11.5" font-weight="normal" fill="#2f4a66" filter="url(#rough2)">(a·0+b) mod m</text>
  <text x="70" y="146" text-anchor="start" font-size="12" font-weight="normal" fill="#555" filter="url(#rough2)">x = 1</text>
  <text x="160" y="146" text-anchor="middle" font-size="12" font-weight="normal" fill="#888" filter="url(#rough2)">→</text>
  <text x="190" y="146" text-anchor="start" font-size="11.5" font-weight="normal" fill="#2f4a66" filter="url(#rough2)">(a·1+b) mod m</text>
  <text x="70" y="174" text-anchor="start" font-size="12" font-weight="normal" fill="#555" filter="url(#rough2)">x = 2</text>
  <text x="160" y="174" text-anchor="middle" font-size="12" font-weight="normal" fill="#888" filter="url(#rough2)">→</text>
  <text x="190" y="174" text-anchor="start" font-size="11.5" font-weight="normal" fill="#2f4a66" filter="url(#rough2)">(a·2+b) mod m</text>
  <text x="70" y="202" text-anchor="start" font-size="12" font-weight="normal" fill="#555" filter="url(#rough2)">x = 3</text>
  <text x="160" y="202" text-anchor="middle" font-size="12" font-weight="normal" fill="#888" filter="url(#rough2)">→</text>
  <text x="190" y="202" text-anchor="start" font-size="11.5" font-weight="normal" fill="#2f4a66" filter="url(#rough2)">(a·3+b) mod m</text>
  <text x="70" y="230" text-anchor="start" font-size="12" font-weight="normal" fill="#555" filter="url(#rough2)">x = 4</text>
  <text x="160" y="230" text-anchor="middle" font-size="12" font-weight="normal" fill="#888" filter="url(#rough2)">→</text>
  <text x="190" y="230" text-anchor="start" font-size="11.5" font-weight="normal" fill="#2f4a66" filter="url(#rough2)">(a·4+b) mod m</text>
  <text x="60" y="254" text-anchor="start" font-size="11" font-weight="normal" fill="#4a7a3a" filter="url(#rough2)">值域只有 m 个，轨道必然绕回来</text>
  <rect x="380" y="70" width="300" height="196" rx="10" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="530" y="94" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">first[x]：状态 x 首次出现的位置</text>
  <rect x="404" y="112" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="426" y="132" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#2f5223" filter="url(#rough2)">0</text>
  <text x="426" y="162" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#8a6015" filter="url(#rough2)">7</text>
  <rect x="458" y="112" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="480" y="132" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#2f5223" filter="url(#rough2)">1</text>
  <text x="480" y="162" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#8a6015" filter="url(#rough2)">-1</text>
  <rect x="512" y="112" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="534" y="132" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#2f5223" filter="url(#rough2)">2</text>
  <text x="534" y="162" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#8a6015" filter="url(#rough2)">3</text>
  <rect x="566" y="112" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="588" y="132" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#2f5223" filter="url(#rough2)">3</text>
  <text x="588" y="162" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#8a6015" filter="url(#rough2)">0</text>
  <rect x="620" y="112" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="642" y="132" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#2f5223" filter="url(#rough2)">...</text>
  <text x="642" y="162" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#8a6015" filter="url(#rough2)">...</text>
  <text x="404" y="186" text-anchor="start" font-size="11" font-weight="normal" fill="#4a7a3a" filter="url(#rough2)">撞到 first[cur] ≠ -1 ⇒ cur 就是环入口</text>
  <text x="404" y="208" text-anchor="start" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">答案 = 当前下标 - first[cur]</text>
  <text x="404" y="232" text-anchor="start" font-size="10.5" font-weight="normal" fill="#666" filter="url(#rough2)">空间 O(m)：10^5 个 int，约 400 KB</text>
  <rect x="40" y="286" width="640" height="52" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="56" y="308" text-anchor="start" font-size="11.5" font-weight="normal" fill="#2f4a66" filter="url(#rough2)">为什么可以不存序列：f 是确定函数，当前位置一旦重复，之后的行为完全相同。</text>
  <text x="56" y="328" text-anchor="start" font-size="11.5" font-weight="normal" fill="#2f4a66" filter="url(#rough2)">所以只需要问“这个状态来过吗”，不需要问“它出现在第几步之后”。</text>
</svg>
