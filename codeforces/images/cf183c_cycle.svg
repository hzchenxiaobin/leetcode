<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="111"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="420" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">183C：环绕一圈的净增量 L，强制 k | L；答案是所有环长的 gcd</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="60.0" y="100.0" width="600.0" height="76.0" fill="#ffffff" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="76.0" y="126.0" text-anchor="start" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">样例 1</text>
  <text x="76.0" y="154.0" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">1→2→1，3→4→3</text>
  <text x="390.0" y="126.0" text-anchor="start" font-size="11.5" fill="#8a6015" font-weight="bold" filter="url(#rough2)">gcd(2,2)=2</text>
  <text x="560.0" y="140.0" text-anchor="start" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ 2</text>
  <rect x="60.0" y="196.0" width="600.0" height="76.0" fill="#ffffff" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="76.0" y="222.0" text-anchor="start" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">样例 3</text>
  <text x="76.0" y="250.0" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">三个环各长 3</text>
  <text x="390.0" y="222.0" text-anchor="start" font-size="11.5" fill="#8a6015" font-weight="bold" filter="url(#rough2)">gcd(3,3)=3</text>
  <text x="560.0" y="236.0" text-anchor="start" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ 3</text>
  <rect x="60.0" y="292.0" width="600.0" height="76.0" fill="#ffffff" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="76.0" y="318.0" text-anchor="start" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">样例 4</text>
  <text x="76.0" y="346.0" text-anchor="start" font-size="11" fill="#444" filter="url(#rough2)">自环 1→1</text>
  <text x="390.0" y="318.0" text-anchor="start" font-size="11.5" fill="#8a6015" font-weight="bold" filter="url(#rough2)">gcd(1,2)=1</text>
  <text x="560.0" y="332.0" text-anchor="start" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ 1</text>
  <rect x="40.0" y="366.0" width="640.0" height="40.0" fill="#f3e8fd" stroke="#6b4c9a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="54.0" y="389.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">无环（无冲突）时任何 k 都行，取 k = n</text>
</svg>
