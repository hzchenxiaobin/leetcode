<svg xmlns="http://www.w3.org/2000/svg" width="760" height="392" viewBox="0 0 760 392"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c9801f"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a8524a"/>
    </marker>
  </defs>
  <rect width="760" height="392" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">样例 2：1234 (2,2) 与 1256 (0,2)</text>
  <text x="380.0" y="60.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">候选 2134 全部满足；1243 在第二条回复上失败</text>
  <rect x="40.0" y="84.0" width="680.0" height="74.0" rx="10" fill="#f4f9f2" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60.0" y="116.0" text-anchor="start" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2134</text>
  <text x="150.0" y="114.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">对 1234：B=2, K=4 → cows=2 ✓</text>
  <text x="150.0" y="138.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">对 1256：B=0, K=2 → cows=2 ✓</text>
  <text x="650.0" y="126.0" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">通过</text>
  <rect x="40.0" y="168.0" width="680.0" height="74.0" rx="10" fill="#fbeeee" stroke="#a8524a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60.0" y="200.0" text-anchor="start" font-size="16" fill="#a8524a" font-weight="bold" filter="url(#rough2)">1243</text>
  <text x="150.0" y="198.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">对 1234：B=2, K=4 → cows=2 ✓</text>
  <text x="150.0" y="222.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">对 1256：B=1 ≠ 0 ✗</text>
  <text x="650.0" y="210.0" text-anchor="middle" font-size="13" fill="#a8524a" font-weight="bold" filter="url(#rough2)">淘汰</text>
  <rect x="40.0" y="252.0" width="680.0" height="74.0" rx="10" fill="#fbeeee" stroke="#a8524a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60.0" y="284.0" text-anchor="start" font-size="16" fill="#a8524a" font-weight="bold" filter="url(#rough2)">1324</text>
  <text x="150.0" y="282.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">对 1234：B=1 ≠ 2 ✗</text>
  <text x="150.0" y="306.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">—</text>
  <text x="650.0" y="294.0" text-anchor="middle" font-size="13" fill="#a8524a" font-weight="bold" filter="url(#rough2)">淘汰</text>
  <rect x="40.0" y="348.0" width="680.0" height="34.0" rx="8" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.3" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="54.0" y="370.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">只剩 2134 一个候选 → 输出 2134。注意 1243 与 1256 第 1 位相同，B=1 而非 0。</text>
</svg>
