<svg xmlns="http://www.w3.org/2000/svg" width="740" height="400" viewBox="0 0 740 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="109"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="740" height="400" fill="#fafafa"/>
  <text x="370" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两遍离线扫描：先求每个组长的 f，再按 R 回答询问</text>
  <path d="M 170 46 Q 370 52 570 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="40" y="66" width="320" height="140" rx="10" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="90" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">第一遍：按 r 升序扫描</text>
  <text x="56" y="112" text-anchor="start" font-size="10.5" font-weight="normal" fill="#4a7a3a" filter="url(#rough2)">① 把 r ≤ 当前的成员按年龄插入 BIT</text>
  <text x="56" y="132" text-anchor="start" font-size="10.5" font-weight="normal" fill="#4a7a3a" filter="url(#rough2)">② 对每个候选组长 c 查询</text>
  <text x="66" y="152" text-anchor="start" font-size="10.5" font-weight="normal" fill="#4a7a3a" filter="url(#rough2)">年龄 ∈ [a_c−k, a_c+k] 的人数</text>
  <text x="56" y="174" text-anchor="start" font-size="11" font-weight="bold" fill="#8a6015" filter="url(#rough2)">⇒ 得到 f(c)</text>
  <text x="56" y="196" text-anchor="start" font-size="10" font-weight="normal" fill="#666" filter="url(#rough2)">O(n log n)：每个成员插一次、问一次</text>
  <rect x="390" y="66" width="310" height="140" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="406" y="90" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">第二遍：询问按 R 降序</text>
  <text x="406" y="112" text-anchor="start" font-size="10.5" font-weight="normal" fill="#446688" filter="url(#rough2)">① 把 r_c ≥ R 的组长插入线段树</text>
  <text x="416" y="132" text-anchor="start" font-size="10.5" font-weight="normal" fill="#446688" filter="url(#rough2)">（年龄为下标，存该年龄最大的 f）</text>
  <text x="406" y="152" text-anchor="start" font-size="10.5" font-weight="normal" fill="#446688" filter="url(#rough2)">② 对 [L, U] 做区间最大值</text>
  <text x="406" y="174" text-anchor="start" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">⇒ 就是这条询问的答案</text>
  <text x="406" y="196" text-anchor="start" font-size="10" font-weight="normal" fill="#666" filter="url(#rough2)">O((n+q) log n)</text>
  <path d="M 362 136 L 388 136" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="40" y="244" text-anchor="start" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1 的第一遍（按 r 升序 1,1,2,4,5）后，各人的 f：</text>
  <text x="56" y="274" text-anchor="start" font-size="10.5" font-weight="normal" fill="#2f5223" filter="url(#rough2)">成员 1 (r=1,a=4)</text>
  <text x="250" y="274" text-anchor="start" font-size="10.5" font-weight="normal" fill="#555" filter="url(#rough2)">f = 3（a∈[3,5] 且 r≤1：成员 1）… 逐步插入后为 1</text>
  <text x="56" y="300" text-anchor="start" font-size="10.5" font-weight="normal" fill="#2f5223" filter="url(#rough2)">成员 3 (r=4,a=3)</text>
  <text x="250" y="300" text-anchor="start" font-size="10.5" font-weight="normal" fill="#555" filter="url(#rough2)">f = 4（成员 1,3,4,5）</text>
  <text x="56" y="326" text-anchor="start" font-size="10.5" font-weight="normal" fill="#2f5223" filter="url(#rough2)">成员 2 (r=5,a=4)</text>
  <text x="250" y="326" text-anchor="start" font-size="10.5" font-weight="normal" fill="#555" filter="url(#rough2)">f = 3（成员 1,2,3）</text>
  <rect x="40" y="352" width="660" height="40" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="56" y="377" text-anchor="start" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">两遍都是“排序 + 树状结构”：第一遍解决计数，第二遍解决带阈值和年龄窗口的最大值。</text>
</svg>
