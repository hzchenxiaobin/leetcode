<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="33"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="450" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">迭代版 Tarjan：用显式栈模拟递归</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="40.0" y="84.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">栈里存 (v, parentEdge, 下一个要看的邻接下标)</text>
  <rect x="56.0" y="116.0" width="250.0" height="46.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="66.0" y="144.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">进入 v</text>
  <text x="320.0" y="144.0" text-anchor="start" font-size="10.8" fill="#444" filter="url(#rough2)">tin[v] = low[v] = timer++，压栈</text>
  <rect x="56.0" y="182.0" width="250.0" height="46.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="66.0" y="210.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">看边 (v,to)</text>
  <text x="320.0" y="210.0" text-anchor="start" font-size="10.8" fill="#444" filter="url(#rough2)">to 未访问 → 记 pe[to]，压 to；否则 low[v]=min(low[v],tin[to])</text>
  <rect x="56.0" y="248.0" width="250.0" height="46.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="66.0" y="276.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">退出 v</text>
  <text x="320.0" y="276.0" text-anchor="start" font-size="10.8" fill="#444" filter="url(#rough2)">弹栈；父 p：low[p]=min(low[p],low[v])</text>
  <rect x="56.0" y="314.0" width="250.0" height="46.0" fill="#fde8e8" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="66.0" y="342.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">判桥</text>
  <text x="320.0" y="342.0" text-anchor="start" font-size="10.8" fill="#444" filter="url(#rough2)">若 low[v] &gt; tin[p] 则 pe[v] 是桥</text>
  <rect x="40.0" y="392.0" width="640.0" height="44.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="54.0" y="416.0" text-anchor="start" font-size="12" fill="#3f3420" filter="url(#rough2)">函数帧换成显式栈后，n=10⁵ 也不会爆栈</text>
</svg>
