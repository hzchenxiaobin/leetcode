<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420">
<defs>
  <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs>
<rect x="0" y="0" width="760" height="420" fill="#fafafa"/>
<text x="380.0" y="34" font-size="22" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="bold" text-anchor="middle" filter="url(#rough2)">算法流程</text>
<rect x="140" y="80" width="480" height="54" rx="8" fill="#e8f0fe" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="380.0" y="112.6" font-size="16" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">读入 s、n 与 n 个地址</text>
<line x1="380" y1="134" x2="380" y2="154" stroke="#1a5fb4" stroke-width="2" filter="url(#rough2)"/>
<polygon points="380.0,154.0 385.0,143.0 375.0,143.0" fill="#1a5fb4" filter="url(#rough2)"/>
<rect x="140" y="156" width="480" height="54" rx="8" fill="#fff4d6" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="380.0" y="188.6" font-size="16" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">对每个地址判断 startswith(s)</text>
<line x1="380" y1="210" x2="380" y2="230" stroke="#1a5fb4" stroke-width="2" filter="url(#rough2)"/>
<polygon points="380.0,230.0 385.0,219.0 375.0,219.0" fill="#1a5fb4" filter="url(#rough2)"/>
<rect x="140" y="232" width="480" height="54" rx="8" fill="#e6f4ea" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="380.0" y="264.6" font-size="16" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">记录其中字典序最小者 best</text>
<line x1="380" y1="286" x2="380" y2="306" stroke="#1a5fb4" stroke-width="2" filter="url(#rough2)"/>
<polygon points="380.0,306.0 385.0,295.0 375.0,295.0" fill="#1a5fb4" filter="url(#rough2)"/>
<rect x="140" y="308" width="480" height="54" rx="8" fill="#f0e6fa" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="380.0" y="340.6" font-size="16" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">best 存在？输出 best : 输出 s</text>
<text x="380" y="392" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="normal" text-anchor="middle" filter="url(#rough2)">O(总字符数)，n ≤ 100 时瞬间完成</text>
</svg>
