<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="820" height="400" fill="#fafafa"/>

  <text x="410" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">把比赛切成若干「块」：块数 − 1 就是 forfeit 次数</text>
  <text x="410" y="54" text-anchor="middle" font-size="12" fill="#6b6b6b" filter="url(#rough2)">块 = 同一位冠军一路吞下来的连续一段；每块的第一个元素都是靠一次 forfeit 夺魁的（首块除外）</text>

  <!-- forfeit 徽标 -->
  <rect x="186" y="66" width="164" height="26" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="268" y="84" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8c3a37" filter="url(#rough2)">✗ forfeit：战力 4 &lt; 7</text>
  <path d="M 268 92 L 268 99" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- 数组格子 -->
  <rect x="64" y="100" width="76" height="54" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="146" y="100" width="76" height="54" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="228" y="100" width="76" height="54" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="310" y="100" width="76" height="54" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="392" y="100" width="76" height="54" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="102" y="134" text-anchor="middle" font-size="18" fill="#2f4a66" filter="url(#rough2)">3</text>
  <text x="184" y="134" text-anchor="middle" font-size="18" fill="#2f4a66" filter="url(#rough2)">1</text>
  <text x="266" y="134" text-anchor="middle" font-size="18" fill="#8a6015" filter="url(#rough2)">7</text>
  <text x="348" y="134" text-anchor="middle" font-size="18" fill="#33582a" filter="url(#rough2)">2</text>
  <text x="430" y="134" text-anchor="middle" font-size="18" fill="#33582a" filter="url(#rough2)">6</text>
  <text x="102" y="170" text-anchor="middle" font-size="10.5" fill="#8a8a8a" filter="url(#rough2)">1</text>
  <text x="184" y="170" text-anchor="middle" font-size="10.5" fill="#8a8a8a" filter="url(#rough2)">2</text>
  <text x="266" y="170" text-anchor="middle" font-size="10.5" fill="#8a8a8a" filter="url(#rough2)">3</text>
  <text x="348" y="170" text-anchor="middle" font-size="10.5" fill="#8a8a8a" filter="url(#rough2)">4</text>
  <text x="430" y="170" text-anchor="middle" font-size="10.5" fill="#8a8a8a" filter="url(#rough2)">5</text>

  <!-- 块括号 -->
  <rect x="58" y="184" width="170" height="62" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="143" y="204" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">块 1</text>
  <text x="143" y="222" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">首元素 3 吞掉 1</text>
  <text x="143" y="238" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">战力 3 + 1 = 4</text>

  <rect x="228" y="184" width="246" height="62" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="351" y="204" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33582a" filter="url(#rough2)">块 2</text>
  <text x="351" y="222" text-anchor="middle" font-size="11.5" fill="#33582a" filter="url(#rough2)">首元素 7 吞掉 2、6</text>
  <text x="351" y="238" text-anchor="middle" font-size="11.5" fill="#33582a" filter="url(#rough2)">战力 7 + 2 + 6 = 15</text>

  <!-- 结论 -->
  <rect x="40" y="266" width="358" height="48" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="58" y="286" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">① 答案只和块数有关</text>
  <text x="58" y="304" font-size="11.8" fill="#8a6015" filter="url(#rough2)">每次 forfeit 恰好开一个新块 ⇒ ans = 块数 − 1</text>

  <rect x="420" y="266" width="360" height="48" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="438" y="286" font-size="12" font-weight="bold" fill="#8c3a37" filter="url(#rough2)">② 战力够就打穿整块</text>
  <text x="438" y="304" font-size="11.8" fill="#8c3a37" filter="url(#rough2)">战力 ≥ 块首 ⇒ 块内前缀和更小 ⇒ 整块被吞</text>

  <path d="M 410 316 L 410 330" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="410" y="350" text-anchor="middle" font-size="12.2" fill="#33582a" filter="url(#rough2)">③ 于是「逐个删元素」转成「逆序加元素」：加一个元素只会引起整块合并，合并总次数 O(n)</text>
  <text x="410" y="374" text-anchor="middle" font-size="11.5" fill="#6b6b6b" filter="url(#rough2)">例：a = [3, 1, 7, 2, 6] 的初始局面 —— 2 块，答案 1（与官方样例一致）</text>
</svg>
