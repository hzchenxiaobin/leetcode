<svg xmlns="http://www.w3.org/2000/svg" width="740" height="320" viewBox="0 0 740 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="51"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ca" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8a6015"/>
    </marker>
  </defs>
  <rect width="740" height="320" fill="#fafafa"/>
  <text x="370" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">加入边 (a,b,c)：只更新"经过这条新边"的最短路</text>

  <g filter="url(#rough2)">
    <circle cx="70" cy="130" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="70" y="136" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66">i</text>
    <circle cx="270" cy="130" r="18" fill="#fdf3e3" stroke="#d6a040" stroke-width="2"/>
    <text x="270" y="136" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015">a</text>
    <circle cx="470" cy="130" r="18" fill="#fdf3e3" stroke="#d6a040" stroke-width="2"/>
    <text x="470" y="136" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015">b</text>
    <circle cx="670" cy="130" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="670" y="136" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66">j</text>
  </g>
  <line x1="88" y1="130" x2="250" y2="130" stroke="#8a94a6" stroke-width="1.8" marker-end="url(#ca)" filter="url(#rough2)"/>
  <text x="169" y="118" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">d[i][a]</text>
  <line x1="288" y1="130" x2="450" y2="130" stroke="#b85450" stroke-width="3.4" filter="url(#rough2)"/>
  <text x="369" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#8f3b37" filter="url(#rough2)">新边 c</text>
  <line x1="488" y1="130" x2="650" y2="130" stroke="#8a94a6" stroke-width="1.8" marker-end="url(#ca)" filter="url(#rough2)"/>
  <text x="569" y="118" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">d[b][j]</text>

  <rect x="120" y="176" width="500" height="56" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="136" y="200" font-size="12.5" fill="#8a6015" filter="url(#rough2)">d[i][j] = min( d[i][j], d[i][a] + c + d[b][j], d[i][b] + c + d[a][j] )</text>
  <text x="136" y="222" font-size="11.5" fill="#8a6015" filter="url(#rough2)">第三个候选对应反方向走新边（b → a）。</text>

  <rect x="60" y="252" width="620" height="48" rx="9" fill="#f4f6f9" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="76" y="274" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">每次加边 O(n²)，k 次共 O(k n²)；n = k = 300 时约 5.4×10⁷ 次运算。</text>
  <text x="76" y="292" font-size="12" fill="#2f4a66" filter="url(#rough2)">若 c ≥ d[a][b]，新边不可能更短，直接跳过更新。</text>
</svg>
