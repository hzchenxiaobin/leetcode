<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="8"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="380" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1 走查：3×3 的自然数，9 格全好</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="50.0" y="102.0" width="54.0" height="54.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="77.0" y="127.0" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="77.0" y="145.0" text-anchor="middle" font-size="10.5" fill="#7a7a7a" filter="url(#rough2)">主</text>
  <rect x="108.0" y="102.0" width="54.0" height="54.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="135.0" y="127.0" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="135.0" y="145.0" text-anchor="middle" font-size="10.5" fill="#7a7a7a" filter="url(#rough2)">列</text>
  <rect x="166.0" y="102.0" width="54.0" height="54.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="193.0" y="127.0" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="193.0" y="145.0" text-anchor="middle" font-size="10.5" fill="#7a7a7a" filter="url(#rough2)">副</text>
  <rect x="50.0" y="160.0" width="54.0" height="54.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="77.0" y="185.0" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="77.0" y="203.0" text-anchor="middle" font-size="10.5" fill="#7a7a7a" filter="url(#rough2)">行</text>
  <rect x="108.0" y="160.0" width="54.0" height="54.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="135.0" y="185.0" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="135.0" y="203.0" text-anchor="middle" font-size="10.5" fill="#7a7a7a" filter="url(#rough2)">四</text>
  <rect x="166.0" y="160.0" width="54.0" height="54.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="193.0" y="185.0" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="193.0" y="203.0" text-anchor="middle" font-size="10.5" fill="#7a7a7a" filter="url(#rough2)">行</text>
  <rect x="50.0" y="218.0" width="54.0" height="54.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="77.0" y="243.0" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="77.0" y="261.0" text-anchor="middle" font-size="10.5" fill="#7a7a7a" filter="url(#rough2)">副</text>
  <rect x="108.0" y="218.0" width="54.0" height="54.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="135.0" y="243.0" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="135.0" y="261.0" text-anchor="middle" font-size="10.5" fill="#7a7a7a" filter="url(#rough2)">列</text>
  <rect x="166.0" y="218.0" width="54.0" height="54.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="193.0" y="243.0" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="193.0" y="261.0" text-anchor="middle" font-size="10.5" fill="#7a7a7a" filter="url(#rough2)">主</text>
  <text x="300.0" y="120.0" text-anchor="start" font-size="13" fill="#446688" filter="url(#rough2)">主对角线 1+5+9 = 15</text>
  <text x="300.0" y="150.0" text-anchor="start" font-size="13" fill="#4a7a3a" filter="url(#rough2)">副对角线 3+5+7 = 15</text>
  <text x="300.0" y="180.0" text-anchor="start" font-size="13" fill="#8a6015" filter="url(#rough2)">中间行 4+5+6 = 15</text>
  <text x="300.0" y="210.0" text-anchor="start" font-size="13" fill="#b85450" filter="url(#rough2)">中间列 2+5+8 = 15</text>
  <text x="300.0" y="244.0" text-anchor="start" font-size="13" fill="#6b4c9a" filter="url(#rough2)">四线相加 60，减去 3×5 = 45</text>
  <rect x="292.0" y="262.0" width="396.0" height="72.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="306.0" y="290.0" text-anchor="start" font-size="15" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">逐格判定合计 = 1+2+⋯+9 = 45</text>
  <text x="306.0" y="318.0" text-anchor="start" font-size="12" fill="#2f4a66" filter="url(#rough2)">与官方输出 45 一致</text>
  <text x="50.0" y="330.0" text-anchor="start" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">九格全中</text>
</svg>
