<svg xmlns="http://www.w3.org/2000/svg" width="730" height="400" viewBox="0 0 730 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="730" height="400" fill="#fafafa"/>

  <text x="365" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：降序把每个 2^(aᵢ) 丢进较轻的那一堆</text>
  <path d="M 96 44 Q 365 50 634 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 第一行 -->
  <rect x="18" y="66" width="212" height="72" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="124" y="93" text-anchor="middle" font-size="13" font-weight="bold" fill="#37516e" filter="url(#rough2)">① 读入 a[1..n]</text>
  <text x="124" y="116" text-anchor="middle" font-size="12" fill="#33506e" filter="url(#rough2)">多测：每组数据独立处理</text>

  <rect x="259" y="66" width="212" height="72" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="365" y="93" text-anchor="middle" font-size="13" font-weight="bold" fill="#37516e" filter="url(#rough2)">② vᵢ = 2^(aᵢ)，T = Σ vᵢ</text>
  <text x="365" y="116" text-anchor="middle" font-size="12" fill="#33506e" filter="url(#rough2)">T ≤ 100 · 2²⁴ ≈ 1.7 × 10⁹</text>

  <rect x="500" y="66" width="212" height="72" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="606" y="93" text-anchor="middle" font-size="13" font-weight="bold" fill="#37516e" filter="url(#rough2)">③ 把 v 降序排序</text>
  <text x="606" y="116" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">必须是降序，不能升序！</text>

  <path d="M 230 102 L 255 102" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 471 102 L 496 102" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 换行连接 -->
  <path d="M 606 138 L 606 168 L 124 168 L 124 200" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 第二行 -->
  <rect x="18" y="204" width="212" height="86" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="124" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">④ 维护差值 d（可正可负）</text>
  <text x="124" y="253" text-anchor="middle" font-size="12" fill="#6b4c12" filter="url(#rough2)">d ≤ 0：d += v（轻的那堆）</text>
  <text x="124" y="275" text-anchor="middle" font-size="12" fill="#6b4c12" filter="url(#rough2)">d &gt; 0：d -= v</text>

  <rect x="259" y="204" width="212" height="86" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="365" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">⑤ d ← |d|，X = (T − d)/2</text>
  <text x="365" y="253" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">X 是较小的那堆之和</text>
  <text x="365" y="275" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">T 与 d 同奇偶 ⇒ 整除</text>

  <rect x="500" y="204" width="212" height="86" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="606" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#a33b36" filter="url(#rough2)">⑥ 输出 X · (T − X)</text>
  <text x="606" y="253" text-anchor="middle" font-size="12" fill="#7a2f2b" filter="url(#rough2)">= 二倍面积的最大值</text>
  <text x="606" y="275" text-anchor="middle" font-size="12" fill="#7a2f2b" filter="url(#rough2)">答案 ≤ 7.04 × 10¹⁷</text>

  <path d="M 230 247 L 255 247" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 471 247 L 496 247" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 结论带 -->
  <rect x="18" y="312" width="694" height="70" rx="10" fill="#fafafa" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="365" y="338" text-anchor="middle" font-size="13" font-weight="bold" fill="#37516e" filter="url(#rough2)">为什么"降到较轻那堆"是对的：当 v 不超过已有元素时，把 v 顶在差值上是严格最优</text>
  <text x="365" y="362" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">因为所有量都是 v 的整数倍，差值只能是 v 的倍数且奇偶性固定，中间那档差额根本取不到</text>
</svg>
