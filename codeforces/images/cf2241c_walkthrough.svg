<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="470" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">走查表：4 组官方样例 + 2 组自造样例</text>
  <path d="M 196 42 Q 380 49 566 42" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- 表头 -->
  <rect x="40" y="56" width="680" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 250 56 L 250 336" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 470 56 L 470 336" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 580 56 L 580 336" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="145" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">字符串 s</text>
  <text x="360" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">段划分（相同字符成段）</text>
  <text x="525" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">段数 m</text>
  <text x="650" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">答案</text>

  <!-- 行 1：0000 -->
  <rect x="40" y="96" width="680" height="40" fill="#ffffff" stroke="#c9c9c9" stroke-width="1" filter="url(#rough2)"/>
  <text x="145" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">0000</text>
  <text x="360" y="122" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0000</text>
  <text x="525" y="122" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="604" y="102" width="92" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="650" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5223" filter="url(#rough2)">1</text>

  <!-- 行 2：110 -->
  <rect x="40" y="136" width="680" height="40" fill="#fafafa" stroke="#c9c9c9" stroke-width="1" filter="url(#rough2)"/>
  <text x="145" y="162" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">110</text>
  <text x="360" y="162" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">11 | 0</text>
  <text x="525" y="162" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <rect x="604" y="142" width="92" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="650" y="162" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a2a26" filter="url(#rough2)">2</text>

  <!-- 行 3：110011 -->
  <rect x="40" y="176" width="680" height="40" fill="#ffffff" stroke="#c9c9c9" stroke-width="1" filter="url(#rough2)"/>
  <text x="145" y="202" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">110011</text>
  <text x="360" y="202" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">11 | 00 | 11</text>
  <text x="525" y="202" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <rect x="604" y="182" width="92" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="650" y="202" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5223" filter="url(#rough2)">1</text>

  <!-- 行 4：101100 -->
  <rect x="40" y="216" width="680" height="40" fill="#fafafa" stroke="#c9c9c9" stroke-width="1" filter="url(#rough2)"/>
  <text x="145" y="242" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">101100</text>
  <text x="360" y="242" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1 | 0 | 11 | 00</text>
  <text x="525" y="242" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">4</text>
  <rect x="604" y="222" width="92" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="650" y="242" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5223" filter="url(#rough2)">1</text>

  <!-- 行 5：0101 自造 -->
  <rect x="40" y="256" width="680" height="40" fill="#ffffff" stroke="#c9c9c9" stroke-width="1" filter="url(#rough2)"/>
  <text x="145" y="282" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">0101（自造）</text>
  <text x="360" y="282" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0 | 1 | 0 | 1</text>
  <text x="525" y="282" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">4</text>
  <rect x="604" y="262" width="92" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="650" y="282" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5223" filter="url(#rough2)">1</text>

  <!-- 行 6：0011 自造 -->
  <rect x="40" y="296" width="680" height="40" fill="#fafafa" stroke="#c9c9c9" stroke-width="1" filter="url(#rough2)"/>
  <text x="145" y="322" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">0011（自造）</text>
  <text x="360" y="322" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">00 | 11</text>
  <text x="525" y="322" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <rect x="604" y="302" width="92" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="650" y="322" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a2a26" filter="url(#rough2)">2</text>

  <!-- 路径 -->
  <rect x="40" y="352" width="680" height="96" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="58" y="376" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">两条删到 1 的实际路径（箭头上的括号是本次所用的回文）：</text>
  <text x="58" y="402" font-size="12.5" fill="#7a5a1c" filter="url(#rough2)">101100 →（「101」删 1）01100 →（「0110」删 1）0100 →（「010」删 1）000 → 00 → 0</text>
  <text x="58" y="428" font-size="12.5" fill="#7a5a1c" filter="url(#rough2)">0101 →（「010」删 0）101 →（「101」删中间 0）11 → 1　　对照：0011 只能 → 011 → 01，停在 2</text>
</svg>
