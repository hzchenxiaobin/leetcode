<svg xmlns="http://www.w3.org/2000/svg" width="820" height="480" viewBox="0 0 820 480"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="820" height="480" fill="#fafafa"/>

  <text x="410" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">交换 a_i 与 a_(i+2)：奇偶两类下标各自独立</text>
  <path d="M 150 44 Q 410 52 670 44" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- 下标 1..7 -->
  <text x="164" y="60" text-anchor="middle" font-size="11.5" fill="#6a6a6a" filter="url(#rough2)">1</text>
  <text x="246" y="60" text-anchor="middle" font-size="11.5" fill="#6a6a6a" filter="url(#rough2)">2</text>
  <text x="328" y="60" text-anchor="middle" font-size="11.5" fill="#6a6a6a" filter="url(#rough2)">3</text>
  <text x="410" y="60" text-anchor="middle" font-size="11.5" fill="#6a6a6a" filter="url(#rough2)">4</text>
  <text x="492" y="60" text-anchor="middle" font-size="11.5" fill="#6a6a6a" filter="url(#rough2)">5</text>
  <text x="574" y="60" text-anchor="middle" font-size="11.5" fill="#6a6a6a" filter="url(#rough2)">6</text>
  <text x="656" y="60" text-anchor="middle" font-size="11.5" fill="#6a6a6a" filter="url(#rough2)">7</text>

  <rect x="127" y="66" width="74" height="50" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="164" y="97" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">a1</text>
  <rect x="209" y="66" width="74" height="50" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="246" y="97" text-anchor="middle" font-size="14" fill="#3c5e2e" filter="url(#rough2)">a2</text>
  <rect x="291" y="66" width="74" height="50" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="328" y="97" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">a3</text>
  <rect x="373" y="66" width="74" height="50" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="410" y="97" text-anchor="middle" font-size="14" fill="#3c5e2e" filter="url(#rough2)">a4</text>
  <rect x="455" y="66" width="74" height="50" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="492" y="97" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">a5</text>
  <rect x="537" y="66" width="74" height="50" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="574" y="97" text-anchor="middle" font-size="14" fill="#3c5e2e" filter="url(#rough2)">a6</text>
  <rect x="619" y="66" width="74" height="50" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="656" y="97" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">a7</text>

  <!-- 同类互换箭头 -->
  <path d="M 164 122 Q 246 158 328 122" stroke="#b85450" stroke-width="1.8" fill="none"
        marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="246" y="176" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">swap(1,3)：只在奇数类内部换</text>

  <!-- 图例 -->
  <rect x="150" y="184" width="22" height="18" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="182" y="198" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">奇数下标集合 O（⌈n/2⌉ 个值）</text>
  <rect x="470" y="184" width="22" height="18" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="502" y="198" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">偶数下标集合 E（⌊n/2⌋ 个值）</text>

  <!-- 结论框 -->
  <rect x="60" y="216" width="700" height="98" rx="10" fill="none" stroke="#a9a9a9"
        stroke-width="1.3" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="80" y="243" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">① 每次只交换同奇偶的两个位置 ⇒ O、E 两个集合是不变量</text>
  <text x="80" y="270" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">② swap(i,i+2) 就是类内相邻交换 ⇒ 两个类内部都能做出任意排列</text>
  <text x="80" y="297" font-size="12.5" fill="#8c3b38" filter="url(#rough2)">③ 于是只问：把 O 摆到奇数位、E 摆到偶数位，能否得到山丘</text>

  <!-- 山丘示意 -->
  <text x="410" y="340" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">山丘：最大的 j 个值占据含峰的一段连续区间 [l, r]</text>
  <rect x="194" y="348" width="432" height="56" rx="8" fill="none" stroke="#d6a040"
        stroke-width="1.8" stroke-dasharray="6 4" filter="url(#rough2)"/>

  <rect x="110" y="356" width="60" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="140" y="383" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">1</text>
  <rect x="200" y="356" width="60" height="42" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="230" y="383" text-anchor="middle" font-size="14" fill="#3c5e2e" filter="url(#rough2)">3</text>
  <rect x="290" y="356" width="60" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="383" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">5</text>
  <rect x="380" y="356" width="60" height="42" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="410" y="383" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">7</text>
  <rect x="470" y="356" width="60" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="500" y="383" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">6</text>
  <rect x="560" y="356" width="60" height="42" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="590" y="383" text-anchor="middle" font-size="14" fill="#3c5e2e" filter="url(#rough2)">4</text>
  <rect x="650" y="356" width="60" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="680" y="383" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">2</text>

  <path d="M 410 418 L 410 402" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="410" y="432" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">峰 k</text>
  <text x="560" y="432" font-size="11.5" fill="#b85450" filter="url(#rough2)">峰 = 全局最大值，位置 k</text>

  <text x="410" y="448" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">下一步只能放在 l-1 或 r+1：两者同类 ⟺ 当前区间长度为奇数</text>
  <text x="410" y="470" text-anchor="middle" font-size="12" fill="#5a5a5a" filter="url(#rough2)">所以「某个值能落在哪一类位置」，只由它原下标的奇偶决定</text>
</svg>
