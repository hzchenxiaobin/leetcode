<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1373"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="320" fill="#fafafa"/>
  <text x="360.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">前缀和转化</text>
  <path d="M 115.2 42 Q 360.0 48 604.8 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="360.0" y="306" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">P_i = #元音 − 2·#辅音；子串好 ⇔ P_r ≤ P_{l−1}</text>
  <text x="360" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#335478" filter="url(#rough2)">Abo → P = (0, 1, −1, 0)</text>
  <circle cx="170" cy="170" r="12" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="170" y="174" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f5223" filter="url(#rough2)">0</text>
  <text x="170" y="222" text-anchor="middle" font-size="10" fill="#555555" filter="url(#rough2)">P0</text>
  <circle cx="280" cy="140" r="12" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="280" y="144" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f5223" filter="url(#rough2)">1</text>
  <text x="280" y="222" text-anchor="middle" font-size="10" fill="#555555" filter="url(#rough2)">P1</text>
  <circle cx="390" cy="200" r="12" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="390" y="204" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f5223" filter="url(#rough2)">-1</text>
  <text x="390" y="222" text-anchor="middle" font-size="10" fill="#555555" filter="url(#rough2)">P2</text>
  <circle cx="500" cy="170" r="12" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="500" y="174" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f5223" filter="url(#rough2)">0</text>
  <text x="500" y="222" text-anchor="middle" font-size="10" fill="#555555" filter="url(#rough2)">P3</text>
  <line x1="182.0" y1="170.0" x2="268.0" y2="140.0" stroke="#5a7fb0" stroke-width="1.3" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <line x1="292.0" y1="140.0" x2="378.0" y2="200.0" stroke="#5a7fb0" stroke-width="1.3" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <line x1="402.0" y1="200.0" x2="488.0" y2="170.0" stroke="#5a7fb0" stroke-width="1.3" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <text x="360" y="245" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">r=3：最小 j 使 P_j ≥ P_3=0 是 j=0 → 长度 3 ✓</text>
  <text x="360" y="285" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">后缀最小值预处理 → 每个 r 查 O(1)</text>
</svg>
