<svg xmlns="http://www.w3.org/2000/svg" width="880" height="220" viewBox="0 0 880 220"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="220" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">再求 next 的 r 次复合：二进制倍增</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">O(n log r) 时间、O(n) 内存，不需要 r 层数组</text>
  <text x="150" y="100" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">ans = 恒等；cur = next；对 r 的每个二进制位：ans = cur∘ans，cur = cur∘cur</text>
  <text x="150" y="140" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">答案 = max(ans[i] - i)，回溯 next 即可输出每行</text>
</svg>
