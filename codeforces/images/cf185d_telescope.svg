<svg xmlns="http://www.w3.org/2000/svg" width="780" height="380" viewBox="0 0 780 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="780" height="380" fill="#fafafa"/>
  <text x="390.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">连乘写成望远镜：(k^{2^{i+1}}−1)/(k^{2^i}−1)</text>
  <path d="M 178.20000000000007 46 Q 390.0 52 601.8 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60.0" y="70.0" width="660.0" height="66.0" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="96.0" text-anchor="start" font-size="11.6" font-weight="bold" fill="#33506e" filter="url(#rough2)">A_i = k^{2^i} + 1 = (k^{2^{i+1}} − 1) / (k^{2^i} − 1)</text>
  <text x="74.0" y="120.0" text-anchor="start" font-size="11.2" fill="#2b2b2b" filter="url(#rough2)">因为 (k^{2^i}−1)(k^{2^i}+1) = k^{2^{i+1}} − 1。</text>
  <rect x="60.0" y="154.0" width="660.0" height="66.0" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="180.0" text-anchor="start" font-size="11.8" font-weight="bold" fill="#2f5b34" filter="url(#rough2)">∏_{i=l}^{r} A_i = (k^{2^{r+1}} − 1) / (k^{2^l} − 1)</text>
  <text x="74.0" y="204.0" text-anchor="start" font-size="11.2" fill="#2b2b2b" filter="url(#rough2)">记 x = k^{2^l}、m = 2^{r+1−l}，它就是等比和 1 + x + … + x^{m−1}。</text>
  <rect x="60.0" y="238.0" width="660.0" height="62.0" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="262.0" text-anchor="start" font-size="11.1" fill="#8a6015" filter="url(#rough2)">模 p 时不能硬除：(x−1) 可能被 p 整除。但等比和是整数，直接算它的模即可 ——</text>
  <text x="74.0" y="284.0" text-anchor="start" font-size="11.1" fill="#8a6015" filter="url(#rough2)">x ≡ 1 (mod p) 时它 ≡ m；否则用逆元 (x^m−1)/(x−1) 即可。</text>
  <text x="60.0" y="330.0" text-anchor="start" font-size="10.9" fill="#6b6b6b" filter="url(#rough2)">样例 1 里 k=3,l=1,r=10,p=2：全是偶数，答案 0；k=5,l=0,r=4,p=3 时 6 是 3 的倍数，也 0。</text>
</svg>
