<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430">
<defs>
  <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs>
<rect x="0" y="0" width="760" height="430" fill="#fafafa"/>
<text x="380.0" y="34" font-size="22" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="bold" text-anchor="middle" filter="url(#rough2)">递归构造：fan 内移动最大玩具，fan 间移动 Q 的差异玩具</text>
<text x="28" y="74" font-size="15" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="normal" text-anchor="start" filter="url(#rough2)">Q = {1,2},{3}，新玩具 m = 4；它的 3 种放法正好构成一个 fan：</text>
<rect x="40" y="100" width="210" height="46" rx="8" fill="#e6f4ea" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="145.0" y="128.25" font-size="15" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">{1,2,4},{3}</text>
<rect x="40" y="162" width="210" height="46" rx="8" fill="#e6f4ea" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="145.0" y="190.25" font-size="15" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">{1,2},{3,4}</text>
<rect x="40" y="224" width="210" height="46" rx="8" fill="#e6f4ea" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="145.0" y="252.25" font-size="15" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">{1,2},{3},{4}</text>
<line x1="145" y1="148" x2="145" y2="160" stroke="#1a5fb4" stroke-width="2" filter="url(#rough2)"/>
<polygon points="145.0,160.0 150.0,149.0 140.0,149.0" fill="#1a5fb4" filter="url(#rough2)"/>
<line x1="145" y1="210" x2="145" y2="222" stroke="#1a5fb4" stroke-width="2" filter="url(#rough2)"/>
<polygon points="145.0,222.0 150.0,211.0 140.0,211.0" fill="#1a5fb4" filter="url(#rough2)"/>
<text x="260" y="130" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#1a5fb4" font-weight="normal" text-anchor="start" filter="url(#rough2)">奇数 fan：块1 → 块2 → 新块</text>
<text x="260" y="300" font-size="15" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="normal" text-anchor="start" filter="url(#rough2)">Q' = {1},{2,3}，同样 3 种放法：</text>
<rect x="40" y="330" width="210" height="42" rx="8" fill="#fff4d6" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="145.0" y="356.25" font-size="15" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">{1},{2,3},{4}</text>
<rect x="300" y="330" width="210" height="42" rx="8" fill="#fff4d6" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="405.0" y="356.25" font-size="15" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">{1},{2,3,4}</text>
<rect x="560" y="330" width="185" height="42" rx="8" fill="#fff4d6" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="652.5" y="356.25" font-size="15" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">{1,4},{2,3}</text>
<line x1="252" y1="351" x2="296" y2="351" stroke="#c0392b" stroke-width="2" filter="url(#rough2)"/>
<polygon points="296.0,351.0 285.0,346.0 285.0,356.0" fill="#c0392b" filter="url(#rough2)"/>
<line x1="512" y1="351" x2="556" y2="351" stroke="#c0392b" stroke-width="2" filter="url(#rough2)"/>
<polygon points="556.0,351.0 545.0,346.0 545.0,356.0" fill="#c0392b" filter="url(#rough2)"/>
<text x="275" y="390" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#c0392b" font-weight="normal" text-anchor="start" filter="url(#rough2)">偶数 fan：新块 → 块2 → 块1</text>
<line x1="145" y1="272" x2="145" y2="326" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4" filter="url(#rough2)"/>
<polygon points="145.0,326.0 150.0,315.0 140.0,315.0" fill="#c0392b" filter="url(#rough2)"/>
<text x="155" y="305" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#c0392b" font-weight="normal" text-anchor="start" filter="url(#rough2)">移动 2（Q 与 Q' 的唯一差异）</text>
<text x="600" y="130" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#2e7d32" font-weight="normal" text-anchor="start" filter="url(#rough2)">末尾接下一个 fan</text>
<text x="600" y="154" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#2e7d32" font-weight="normal" text-anchor="start" filter="url(#rough2)">的开头：新块 ↔ 新块</text>
<text x="600" y="200" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#2e7d32" font-weight="normal" text-anchor="start" filter="url(#rough2)">或 块1 ↔ 块1，</text>
<text x="600" y="224" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#2e7d32" font-weight="normal" text-anchor="start" filter="url(#rough2)">都只差一次移动</text>
</svg>
