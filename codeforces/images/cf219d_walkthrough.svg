<svg xmlns="http://www.w3.org/2000/svg" width="840" height="450" viewBox="0 0 840 450"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="450" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2 走查：三条边全部指向 4</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">以 1 为根：1→4 背向 1（不改），4→2、4→3 需要把 2→4、3→4 反转 ⇒ 代价 2</text>
  <g filter="url(#rough2)"><circle cx="420" cy="165" r="17" fill="#f6e3c4" fill-opacity="0.9" stroke="#a0522d" stroke-width="1.8"/></g>
  <text x="420" y="170" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><circle cx="270" cy="105" r="15" fill="#d7ecd0" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="270" y="110" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><line x1="270" y1="105" x2="420" y2="165" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)"/></g>
  <g filter="url(#rough2)"><circle cx="420" cy="79" r="15" fill="#d7ecd0" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="420" y="84" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><line x1="420" y1="79" x2="420" y2="165" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)"/></g>
  <g filter="url(#rough2)"><circle cx="570" cy="105" r="15" fill="#d7ecd0" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="570" y="110" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><line x1="570" y1="105" x2="420" y2="165" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)"/></g>
  <text x="420" y="262" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">原图方向：1→4，2→4，3→4</text>
  <text x="190" y="300" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">根</text>
  <text x="310" y="300" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">代价</text>
  <text x="430" y="300" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">需要反转的边</text>
  <text x="190" y="326" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">1</text>
  <text x="310" y="326" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">2</text>
  <text x="430" y="326" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">2→4, 3→4</text>
  <text x="190" y="352" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">2</text>
  <text x="310" y="352" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">2</text>
  <text x="430" y="352" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">1→4, 3→4</text>
  <text x="190" y="378" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">3</text>
  <text x="310" y="378" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">2</text>
  <text x="430" y="378" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">1→4, 2→4</text>
  <text x="190" y="404" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">4</text>
  <text x="310" y="404" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">3</text>
  <text x="430" y="404" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">1→4, 2→4, 3→4</text>
  <g filter="url(#rough2)"><line x1="160" y1="308" x2="630" y2="308" stroke="#c8a48a" stroke-width="1.1"/></g>
  <text x="420" y="436" text-anchor="middle" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">最小代价 2，最优城市 {1, 2, 3} —— 与官方输出一致</text>
</svg>
