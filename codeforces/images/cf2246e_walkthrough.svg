<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>

  <rect width="720" height="480" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">解码走查（4 位示例，真实值域 30 位，逻辑相同）</text>
  <path d="M 218 42 Q 360 49 502 42" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <rect x="24" y="56" width="672" height="34" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="62" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">响应 o</text>
  <text x="186" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">隐藏 (v, ty, b)</text>
  <text x="332" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">m0, m1</text>
  <text x="433" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">r</text>
  <text x="584" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">解码 → 结论</text>

  <!-- 行 1 -->
  <rect x="24" y="96" width="672" height="46" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="62" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a5a30" filter="url(#rough2)">0</text>
  <text x="186" y="125" text-anchor="middle" font-size="12.5" fill="#3a5a30" filter="url(#rough2)">v = 6 (0110)　ty = &amp;　b = 1</text>
  <text x="332" y="125" text-anchor="middle" font-size="12.5" fill="#3a5a30" filter="url(#rough2)">0, 1</text>
  <text x="433" y="125" text-anchor="middle" font-size="13" fill="#3a5a30" filter="url(#rough2)">7</text>
  <text x="584" y="125" text-anchor="middle" font-size="12.5" fill="#3a5a30" filter="url(#rough2)">r &amp; 1 = 1 → b = 1 ✓</text>

  <!-- 行 2 -->
  <rect x="24" y="148" width="672" height="46" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="62" y="177" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a5a30" filter="url(#rough2)">5</text>
  <text x="186" y="177" text-anchor="middle" font-size="12.5" fill="#3a5a30" filter="url(#rough2)">v = 5 (0101)　ty = |　b = 1</text>
  <text x="332" y="177" text-anchor="middle" font-size="12.5" fill="#3a5a30" filter="url(#rough2)">0, 4　(q = 2)</text>
  <text x="433" y="177" text-anchor="middle" font-size="13" fill="#3a5a30" filter="url(#rough2)">1</text>
  <text x="584" y="177" text-anchor="middle" font-size="12.5" fill="#3a5a30" filter="url(#rough2)">bit2(r) = 0 → b = 1 ✓</text>

  <!-- 行 3 -->
  <rect x="24" y="200" width="672" height="46" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="62" y="229" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">1</text>
  <text x="186" y="229" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">v = 3 (0011)　ty = &amp;　b = 0</text>
  <text x="332" y="229" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">12, 13</text>
  <text x="433" y="229" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">15</text>
  <text x="584" y="229" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">r ≠ 13 且 r 为奇 → b = 0 ✓</text>

  <!-- 行 4 -->
  <rect x="24" y="252" width="672" height="46" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="62" y="281" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">1</text>
  <text x="186" y="281" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">v = 0　　　　ty = |　b = 1</text>
  <text x="332" y="281" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">12, 13</text>
  <text x="433" y="281" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">13</text>
  <text x="584" y="281" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">r = m1 → b = 1 ✓</text>

  <!-- 行 5：反例 -->
  <rect x="24" y="304" width="672" height="46" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="62" y="333" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">1</text>
  <text x="186" y="333" text-anchor="middle" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">v = 3 (0011)　ty = &amp;　b = 0</text>
  <text x="332" y="333" text-anchor="middle" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">12, 15　d = 3 = v</text>
  <text x="433" y="333" text-anchor="middle" font-size="13" fill="#8a3a36" filter="url(#rough2)">15</text>
  <text x="584" y="333" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">r = m1 → 误判 b = 1 ✗</text>

  <rect x="30" y="360" width="660" height="72" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="48" y="382" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">前四行都正确：o=0 与 o&gt;1 两支不依赖随机数；o=1 且 v=0 时 r 精确落在 m0 / m1 上，直接命中。</text>
  <text x="48" y="401" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">只有 v 为奇数、且 d = m0⊕m1 恰好等于 v 时才碰撞（第五行）。</text>
  <text x="48" y="420" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">m0 偶 / m1 奇 ⇒ d 在 2²⁹ 个奇数上均匀分布，单次失败概率 2⁻²⁹。</text>

  <text x="360" y="458" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">第五行之所以会发生，是因为交互器在本轮隐藏值固定后、看到 m 之前无法预知 d；它只能「碰巧」命中</text>
</svg>
