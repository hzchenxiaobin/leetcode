<svg xmlns="http://www.w3.org/2000/svg" width="640" height="180" viewBox="0 0 640 180"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1448"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="640" height="180" fill="#fafafa"/>
  <text x="320.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">流 程</text>
  <path d="M 102.4 42 Q 320.0 48 537.6 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="320.0" y="166" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">O(n)</text>
  <text x="320" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#335478" filter="url(#rough2)">逐位统计 x（4→7）与 y（7→4） → 输出 max(x,y)</text>
  <text x="320" y="122" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">交换只对反向错位有效</text>
</svg>
