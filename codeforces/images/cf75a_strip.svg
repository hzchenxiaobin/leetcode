<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr75a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="330" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">把十进制里的 0 全部删掉，再比较等式</text>

  <!-- 上排 -->
  <g filter="url(#rough2)">
    <rect x="120" y="62" width="92" height="46" rx="6" fill="#eef4fb" stroke="#446688" stroke-width="1.7"/>
    <rect x="240" y="62" width="92" height="46" rx="6" fill="#eef4fb" stroke="#446688" stroke-width="1.7"/>
    <rect x="380" y="62" width="92" height="46" rx="6" fill="#e8f0e0" stroke="#4a7a3a" stroke-width="1.7"/>
  </g>
  <g font-size="22" fill="#2b3a4a" text-anchor="middle" filter="url(#rough2)">
    <text x="166" y="94">101</text>
    <text x="286" y="94">102</text>
    <text x="426" y="94">203</text>
  </g>
  <g font-size="20" fill="#446688" text-anchor="middle" filter="url(#rough2)">
    <text x="222" y="94">+</text>
    <text x="358" y="94">=</text>
    <text x="500" y="94">c = a + b</text>
  </g>
  <g font-size="11" fill="#8a8a80" text-anchor="middle" filter="url(#rough2)">
    <text x="166" y="124">a</text>
    <text x="286" y="124">b</text>
    <text x="426" y="124">c</text>
  </g>

  <!-- 删零箭头 -->
  <path d="M360 132 L360 166" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr75a)"
        filter="url(#rough2)"/>
  <text x="378" y="156" font-size="12.5" fill="#446688" filter="url(#rough2)">每个数各自删掉所有 0</text>

  <!-- 下排 -->
  <g filter="url(#rough2)">
    <rect x="120" y="186" width="92" height="46" rx="6" fill="#fff8e1" stroke="#c9a227" stroke-width="1.8"/>
    <rect x="240" y="186" width="92" height="46" rx="6" fill="#fff8e1" stroke="#c9a227" stroke-width="1.8"/>
    <rect x="380" y="186" width="92" height="46" rx="6" fill="#f7e6e6" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <g font-size="22" fill="#2b3a4a" text-anchor="middle" filter="url(#rough2)">
    <text x="166" y="218">11</text>
    <text x="286" y="218">12</text>
    <text x="426" y="218">23</text>
  </g>
  <g font-size="20" fill="#b85450" text-anchor="middle" filter="url(#rough2)">
    <text x="222" y="218">+</text>
    <text x="358" y="218">=</text>
    <text x="508" y="218" font-size="15" fill="#2f5223">11 + 12 = 23 ✓</text>
  </g>

  <text x="360" y="272" text-anchor="middle" font-size="12.5" fill="#4a4a4a" filter="url(#rough2)">删零只改变写法，不保证等式仍然成立——所以要真的把三个数都算出来</text>
  <text x="360" y="302" text-anchor="middle" font-size="12" fill="#7a2f2c" filter="url(#rough2)">反例：105 + 106 = 211，删零后 15 + 16 = 31 ≠ 211</text>
</svg>
