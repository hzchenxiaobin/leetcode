<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="671"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="210" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">样例 3：三元环，权值都是 1</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">每条边都在某个 MST 中，但都不在所有 MST 中</text>
  <text x="450" y="100" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">任选两条成树 ⇒ 三条边均为 at least one</text>
  <text x="450" y="142" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">样例 2：1–2、2–3 必选（权 1 最小且无环）⇒ any；1–3 权 2 ⇒ none</text>
</svg>
