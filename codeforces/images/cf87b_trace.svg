<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="720" height="420" fill="#fafafa"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2 的演变（b、c 两个类型）</text>
  <path d="M 200 43 Q 360 49 520 43" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <rect x="50" y="70" width="620" height="34" rx="4" fill="#e8f0fe" stroke="#777777" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="66" y="92" text-anchor="start" font-size="10.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">初始</text>
  <text x="300" y="92" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">b = ?，c = ?</text>
  <rect x="50" y="108" width="620" height="34" rx="4" fill="#ffffff" stroke="#777777" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="66" y="130" text-anchor="start" font-size="10.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">typedef void* b</text>
  <text x="300" y="130" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">b = void*</text>
  <rect x="50" y="146" width="620" height="34" rx="4" fill="#e8f0fe" stroke="#777777" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="66" y="168" text-anchor="start" font-size="10.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">typedef b* c</text>
  <text x="300" y="168" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">c = void**</text>
  <rect x="50" y="184" width="620" height="34" rx="4" fill="#ffffff" stroke="#777777" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="66" y="206" text-anchor="start" font-size="10.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">typedef &amp;b b</text>
  <text x="300" y="206" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">b = void  （&amp;void* = void）</text>
  <rect x="50" y="222" width="620" height="34" rx="4" fill="#fdecea" stroke="#777777" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="66" y="244" text-anchor="start" font-size="10.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">typedef &amp;&amp;b* c</text>
  <text x="300" y="244" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">c = errtype  （&amp;void = errtype，再 &amp;）</text>
  <rect x="50" y="260" width="620" height="34" rx="4" fill="#ffffff" stroke="#777777" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="66" y="282" text-anchor="start" font-size="10.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">typedef &amp;b* c</text>
  <text x="300" y="282" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">c = void  （&amp;void* = void）</text>
  <rect x="50" y="298" width="620" height="34" rx="4" fill="#fdecea" stroke="#777777" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="66" y="320" text-anchor="start" font-size="10.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">typedef &amp;void b</text>
  <text x="300" y="320" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">b = errtype</text>
  <rect x="50" y="336" width="620" height="34" rx="4" fill="#fdecea" stroke="#777777" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="66" y="358" text-anchor="start" font-size="10.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">typedef b******* c</text>
  <text x="300" y="358" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">c = errtype（errtype 的星号还是它）</text>
  <rect x="50" y="374" width="620" height="34" rx="4" fill="#fdecea" stroke="#777777" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="66" y="396" text-anchor="start" font-size="10.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">typedef &amp;&amp;b* c</text>
  <text x="300" y="396" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">c = errtype</text>
  <text x="50" y="408" text-anchor="start" font-size="10.5" fill="#777777" filter="url(#rough2)">注意第 4 步之后 c 仍是 void**（旧定义不变），第 5 步才被重定义。</text>
</svg>
