<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420">
<defs>
  <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs>
<rect x="0" y="0" width="760" height="420" fill="#fafafa"/>
<text x="380.0" y="34" font-size="22" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="bold" text-anchor="middle" filter="url(#rough2)">不变式：前 i 个位置已经固定</text>
<rect x="60" y="90" width="180" height="54" rx="8" fill="#e6f4ea" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="150.0" y="121.55" font-size="13" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">b[0..i-1] = a[0..i-1]</text>
<rect x="300" y="90" width="160" height="54" rx="8" fill="#fff4d6" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="380.0" y="121.55" font-size="13" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">b[i..n-1] 待处理</text>
<text x="90" y="190" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="normal" text-anchor="start" filter="url(#rough2)">在待处理段里找到 a[i]（可能重复，任取一个）</text>
<rect x="120" y="220" width="220" height="50" rx="8" fill="#e8f0fe" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="230.0" y="249.9" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">下标 j 向前交换</text>
<text x="360" y="250" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#1a5fb4" font-weight="normal" text-anchor="start" filter="url(#rough2)">j-1 ←→ j，记录 (j, j+1)</text>
<text x="90" y="310" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#c0392b" font-weight="normal" text-anchor="start" filter="url(#rough2)">每次交换只影响相邻两格，前缀不受影响；共 ≤ n(n-1)/2 次</text>
<text x="90" y="350" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#2e7d32" font-weight="normal" text-anchor="start" filter="url(#rough2)">n = 300 时最多 44850 ≤ 10^6</text>
</svg>
