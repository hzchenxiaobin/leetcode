  <text x="54.0" y="354.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">岛格 = 左矩形（蓝）∪ 右矩形（绿）；灰点格是海，输出 '.'。</text>
  <text x="54.0" y="376.0" text-anchor="start" font-size="12" fill="#c9801f" font-weight="bold" filter="url(#rough2)">每行的岛格都是一个连续区间，这是构造的出发点。</text>
