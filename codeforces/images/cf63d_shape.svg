  <text x="283.0" y="68.0" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">a×b = 3×4</text>
  <text x="438.0" y="68.0" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">c×d = 2×2</text>
  <text x="44.0" y="160.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">H = max(b,d) = 4 行</text>
  <text x="44.0" y="186.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">W = a+c = 5 列</text>
