<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">把「前缀 / 后缀恰好是 1..i」画成矩阵角上的实心方块</text>
  <text x="280" y="45" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">位置为行、数值为列；左上实心 = 前缀割，左下实心 = 后缀割</text>

  <text x="104" y="76" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 前缀割 c = 3</text>
  <text x="280" y="76" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">② 后缀割 m' = 3</text>

  <g filter="url(#rough2)">
    <rect x="56" y="86" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="80" y="86" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="104" y="86" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="128" y="86" width="24" height="24" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.1"/>
    <rect x="56" y="110" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="80" y="110" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="104" y="110" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="128" y="110" width="24" height="24" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.1"/>
    <rect x="56" y="134" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="80" y="134" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="104" y="134" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="128" y="134" width="24" height="24" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.1"/>
    <rect x="56" y="158" width="24" height="24" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.1"/>
    <rect x="80" y="158" width="24" height="24" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.1"/>
    <rect x="104" y="158" width="24" height="24" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.1"/>
    <rect x="128" y="158" width="24" height="24" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.1"/>
  </g>
  <text x="104" y="200" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">填满 1..3 ⇒ 前缀割 i=3</text>

  <g filter="url(#rough2)">
    <rect x="232" y="86" width="24" height="24" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.1"/>
    <rect x="256" y="86" width="24" height="24" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.1"/>
    <rect x="280" y="86" width="24" height="24" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.1"/>
    <rect x="304" y="86" width="24" height="24" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.1"/>
    <rect x="232" y="110" width="24" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="256" y="110" width="24" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="280" y="110" width="24" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="304" y="110" width="24" height="24" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.1"/>
    <rect x="232" y="134" width="24" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="256" y="134" width="24" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="280" y="134" width="24" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="304" y="134" width="24" height="24" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.1"/>
    <rect x="232" y="158" width="24" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="256" y="158" width="24" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="280" y="158" width="24" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="304" y="158" width="24" height="24" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.1"/>
  </g>
  <text x="280" y="200" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">填满 1..3 ⇒ 后缀割 m′=3</text>

  <rect x="370" y="72" width="178" height="130" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="382" y="92" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">③ 两类割互斥</text>
  <text x="382" y="112" font-size="10" fill="#555" filter="url(#rough2)">若 c∈X、d∈Y 同时成立：</text>
  <text x="382" y="130" font-size="10" fill="#555" filter="url(#rough2)">· c+d&gt;r：所有位置都被覆盖，</text>
  <text x="390" y="145" font-size="10" fill="#555" filter="url(#rough2)">数值只落在 1..max(c,d) 内</text>
  <text x="382" y="163" font-size="10" fill="#555" filter="url(#rough2)">· c+d≤r：值 1 被用两次</text>
  <text x="382" y="188" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">⟹ 每个排列至多一类割非空</text>

  <rect x="40" y="214" width="480" height="104" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="54" y="236" font-size="11.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">④ 用「最大值」判定，不必真的比较集合</text>
  <text x="54" y="258" font-size="10" fill="#444" filter="url(#rough2)">max(p₁..pᵢ) = i ⟺ {p₁..pᵢ} = {1..i}：i 个互不相同的数都 ≤ i，只能恰好填满。</text>
  <text x="54" y="278" font-size="10" fill="#444" filter="url(#rough2)">同理 max(后缀) = m′ ⟺ 后缀恰为 {1..m′}：两条条件都变成「最值 vs 下标」。</text>
  <text x="54" y="300" font-size="10" fill="#666" filter="url(#rough2)">于是只需知道哪些 c 是「禁止割」——这正是下面 O(n) 预处理的全部产物。</text>

  <text x="280" y="342" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">蓝：前缀割禁止　黄：后缀割禁止　（颜色只用于区分方向，与数值无关）</text>
  <text x="280" y="366" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">注意「割」只可能在给定的已知数不跨越时才有意义，这类割称为干净割</text>
</svg>
