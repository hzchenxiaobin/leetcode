<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="720" height="380" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">连续段异或为 0 ⟺ 两个前缀异或相等</text>
  <path d="M 150 42 Q 360 48 580 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <text x="60" y="78" font-size="12" fill="#666" filter="url(#rough2)">序列 a（长度 n）</text>
  <g filter="url(#rough2)">
    <rect x="200" y="62" width="48" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="250" y="62" width="48" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="300" y="62" width="48" height="42" fill="#fde8e8" stroke="#b85450" stroke-width="1.7"/>
    <rect x="350" y="62" width="48" height="42" fill="#fde8e8" stroke="#b85450" stroke-width="1.7"/>
    <rect x="400" y="62" width="48" height="42" fill="#fde8e8" stroke="#b85450" stroke-width="1.7"/>
    <rect x="450" y="62" width="48" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="500" y="62" width="48" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="224" y="90" text-anchor="middle" font-size="15" fill="#2f4a66" filter="url(#rough2)">a1</text>
  <text x="274" y="90" text-anchor="middle" font-size="15" fill="#2f4a66" filter="url(#rough2)">a2</text>
  <text x="324" y="90" text-anchor="middle" font-size="15" fill="#8c2f2b" filter="url(#rough2)">a3</text>
  <text x="374" y="90" text-anchor="middle" font-size="15" fill="#8c2f2b" filter="url(#rough2)">a4</text>
  <text x="424" y="90" text-anchor="middle" font-size="15" fill="#8c2f2b" filter="url(#rough2)">a5</text>
  <text x="474" y="90" text-anchor="middle" font-size="15" fill="#2f4a66" filter="url(#rough2)">a6</text>
  <text x="524" y="90" text-anchor="middle" font-size="15" fill="#2f4a66" filter="url(#rough2)">a7</text>
  <text x="150" y="120" font-size="11.5" fill="#8c2f2b" filter="url(#rough2)">红色区段 [3,5] 的异或 = 0</text>

  <text x="60" y="168" font-size="12" fill="#666" filter="url(#rough2)">前缀异或 p（p0 = 0，p_i = a1^…^a_i）</text>
  <g filter="url(#rough2)">
    <rect x="150" y="152" width="48" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="200" y="152" width="48" height="42" fill="#ffffff" stroke="#888" stroke-width="1.4"/>
    <rect x="250" y="152" width="48" height="42" fill="#fde8e8" stroke="#b85450" stroke-width="1.8"/>
    <rect x="300" y="152" width="48" height="42" fill="#ffffff" stroke="#888" stroke-width="1.4"/>
    <rect x="350" y="152" width="48" height="42" fill="#ffffff" stroke="#888" stroke-width="1.4"/>
    <rect x="400" y="152" width="48" height="42" fill="#fde8e8" stroke="#b85450" stroke-width="1.8"/>
    <rect x="450" y="152" width="48" height="42" fill="#ffffff" stroke="#888" stroke-width="1.4"/>
    <rect x="500" y="152" width="48" height="42" fill="#ffffff" stroke="#888" stroke-width="1.4"/>
  </g>
  <text x="174" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">0</text>
  <text x="224" y="180" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">p1</text>
  <text x="274" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#8c2f2b" filter="url(#rough2)">p2</text>
  <text x="324" y="180" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">p3</text>
  <text x="374" y="180" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">p4</text>
  <text x="424" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#8c2f2b" filter="url(#rough2)">p5</text>
  <text x="474" y="180" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">p6</text>
  <text x="524" y="180" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">p7</text>

  <path d="M 274 198 C 274 216 424 216 424 198" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="228" text-anchor="middle" font-size="11.5" fill="#8c2f2b" filter="url(#rough2)">p2 = p5（a3^a4^a5 = 0）</text>

  <rect x="60" y="250" width="600" height="48" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="74" y="272" font-size="12" fill="#2f4a66" filter="url(#rough2)">「不含异或为 0 的连续段」⟺ p0, p1, …, pn 两两不同（p0 = 0 固定，所以 p1..pn 必须非零且互不相同）</text>
  <text x="74" y="292" font-size="12" fill="#2f4a66" filter="url(#rough2)">序列与「前缀异或序列」一一对应：给定 p 就能还原 a_i = p_{i-1} ^ p_i，且 a_i 仍在 [0, 2^m) 内</text>

  <text x="360" y="332" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">于是计数变成「为 p1..pn 从 2^m-1 个可选值里依次挑不同的值」</text>
  <text x="360" y="356" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">答案 = (2^m − 1)(2^m − 2)⋯(2^m − n) mod 1e9+9</text>
</svg>
