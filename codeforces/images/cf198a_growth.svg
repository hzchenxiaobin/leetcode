<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="501"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="420" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">198A：每秒 x → kx+b；两次实验用同一规则</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="50.0" y="78.0" width="620.0" height="80.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="64.0" y="101.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">实验一：1 → f(1) → … → f^n(1) = z（n 秒后）</text>
  <text x="64.0" y="127.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">实验二：t → f(t) → … → 至少 z 需要几秒？</text>
  <rect x="50.0" y="180.0" width="620.0" height="80.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="64.0" y="203.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">k&gt;1：f^s(t) = [k^s(t(k−1)+b) − b]/(k−1)</text>
  <text x="64.0" y="229.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">与 z 比较 ⇒ k^s(t(k−1)+b) ≥ k^n((k−1)+b)</text>
  <rect x="50.0" y="282.0" width="620.0" height="60.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="64.0" y="305.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">⇒ 令 C=t(k−1)+b，D=(k−1)+b，求最大的 r 使 D·k^r ≤ C</text>
  <text x="64.0" y="329.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">答案 = max(0, n−r)</text>
  <text x="60.0" y="376.0" text-anchor="start" font-size="11" fill="#555" filter="url(#rough2)">k=1 时 f^s(t)=t+bs，z=1+bn，答案 = max(0, ceil((z−t)/b))。</text>
</svg>
