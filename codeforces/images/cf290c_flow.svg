<svg xmlns="http://www.w3.org/2000/svg" width="700" height="250" viewBox="0 0 700 250"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="473"/>
    <feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></defs>
  <rect width="700" height="250" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">290C 的实现要点</text>
  <path d="M 190 40 Q 350 46 510 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="60" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="12.5" fill="#22314a" filter="url(#rough2)">读入全部整数：第一个是 TUX（个数），后面是各值。</text>
  <text x="76" y="104" font-size="12.5" fill="#22314a" filter="url(#rough2)">维护 sum 与 i，best = max(best, sum/i)。</text>
  <g filter="url(#rough2)"><rect x="60" y="130" width="580" height="60" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="154" font-size="12.5" fill="#2f5223" filter="url(#rough2)">输出保留 6 位小数即可（误差 1e-4）。</text>
  <text x="76" y="176" font-size="12.5" fill="#2f5223" filter="url(#rough2)">复杂度 O(输入规模)，规模 ≤ 10 行。</text>
  <g filter="url(#rough2)"><rect x="60" y="202" width="580" height="36" rx="8" fill="#fbeeee" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="76" y="225" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">易错：把第一行当成数据（它其实是个数）；空段/单元素时 best 不许为 0。</text>
</svg>
