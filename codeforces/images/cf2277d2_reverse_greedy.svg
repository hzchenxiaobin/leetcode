<svg xmlns="http://www.w3.org/2000/svg" width="780" height="480" viewBox="0 0 780 480"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="780" height="480" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">pos[k] 怎么来：把预算 2^k + 1 从大块往小整块花掉</text>
  <path d="M 112 42 Q 390 48 672 42" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <rect x="60" y="60" width="660" height="76" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="76" y="84" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">h(m) = f(m) + m 的等价解释：给每一步「值的变化」也计一次价</text>
  <text x="76" y="108" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">指数为 i 的 Op1 花 2^i + 1（值 +2^i、次数 +1），Op2 花 0（值 −1、次数 +1）</text>
  <text x="76" y="128" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">于是一个长度 i 的整块花 2^i + i − 1，净得 2^i − 2；预算 B = 2^k + 1 下最大化 m</text>

  <rect x="60" y="152" width="660" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="150" y="175" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">块长 i</text>
  <text x="282" y="175" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">花费 2^i + i − 1</text>
  <text x="410" y="175" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">净得 2^i − 2</text>
  <text x="528" y="175" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">剩余预算</text>
  <text x="648" y="175" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">当前 m</text>

  <rect x="60" y="192" width="660" height="30" rx="5" fill="#fafafa" stroke="#c9c9c9" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="150" y="213" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">8</text>
  <text x="282" y="213" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">263</text>
  <text x="410" y="213" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">254</text>
  <text x="528" y="213" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">513 − 263 = 250</text>
  <text x="648" y="213" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">255</text>

  <rect x="60" y="226" width="660" height="30" rx="5" fill="#fafafa" stroke="#c9c9c9" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="150" y="247" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">7</text>
  <text x="282" y="247" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">134</text>
  <text x="410" y="247" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">126</text>
  <text x="528" y="247" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">116</text>
  <text x="648" y="247" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">381</text>

  <rect x="60" y="260" width="660" height="30" rx="5" fill="#fafafa" stroke="#c9c9c9" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="150" y="281" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">6</text>
  <text x="282" y="281" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">69</text>
  <text x="410" y="281" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">62</text>
  <text x="528" y="281" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">47</text>
  <text x="648" y="281" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">443</text>

  <rect x="60" y="294" width="660" height="30" rx="5" fill="#fafafa" stroke="#c9c9c9" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="150" y="315" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <text x="282" y="315" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">36</text>
  <text x="410" y="315" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">30</text>
  <text x="528" y="315" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">11</text>
  <text x="648" y="315" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">473</text>

  <rect x="60" y="328" width="660" height="30" rx="5" fill="#fafafa" stroke="#c9c9c9" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="150" y="349" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">4：19 &gt; 11 跳过</text>
  <text x="282" y="349" text-anchor="middle" font-size="13" fill="#6b6b6b" filter="url(#rough2)">—</text>
  <text x="410" y="349" text-anchor="middle" font-size="13" fill="#6b6b6b" filter="url(#rough2)">—</text>
  <text x="528" y="349" text-anchor="middle" font-size="13" fill="#6b6b6b" filter="url(#rough2)">11</text>
  <text x="648" y="349" text-anchor="middle" font-size="13" fill="#6b6b6b" filter="url(#rough2)">473</text>

  <rect x="60" y="362" width="660" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="383" text-anchor="middle" font-size="13" fill="#3c5e2e" filter="url(#rough2)">3</text>
  <text x="282" y="383" text-anchor="middle" font-size="13" fill="#3c5e2e" filter="url(#rough2)">10</text>
  <text x="410" y="383" text-anchor="middle" font-size="13" fill="#3c5e2e" filter="url(#rough2)">6</text>
  <text x="528" y="383" text-anchor="middle" font-size="13" fill="#3c5e2e" filter="url(#rough2)">1</text>
  <text x="648" y="383" text-anchor="middle" font-size="14" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">479</text>

  <text x="390" y="414" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">k = 9 时依次取 8, 7, 6, 5, 3 号块（长度 4、2 放不下）⇒ pos[9] = 479</text>

  <rect x="60" y="426" width="660" height="44" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="390" y="446" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">交换论证：两块较短的并成一块更长的，净得 2^i − 2 不少于原来的和，花费 2^i + i − 1 也不多于原来的和</text>
  <text x="390" y="464" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">故最优解一定是「整块、从大到小」；实测校验：h(479) = 512 ≤ 513 &lt; h(480) = 517</text>
</svg>
