<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>

  <rect width="720" height="420" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两个样例的到达时刻</text>
  <path d="M 250 42 Q 360 48 470 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 样例 1 -->
  <text x="40" y="76" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">样例 1：l=2, d=1, v=3, g=4, r=5（周期 c=9）</text>
  <line x1="60" y1="132" x2="660" y2="132" stroke="#2b2b2b" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="60" y="110" width="240" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="180" y="123" text-anchor="middle" font-size="9.5" fill="#2f5223" filter="url(#rough2)">绿 0…4</text>
  <line x1="100" y1="96" x2="100" y2="150" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="100" y="168" text-anchor="middle" font-size="10.5" fill="#2f5223" filter="url(#rough2)">t = 1/3</text>
  <text x="270" y="168" font-size="10.5" fill="#2f5223" filter="url(#rough2)">绿灯到达 → 停车时间为 0，总时间 l/v = 2/3 ≈ 0.6666667</text>

  <!-- 样例 2 -->
  <text x="40" y="212" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">样例 2：l=5, d=4, v=3, g=1, r=1（周期 c=2）</text>
  <line x1="60" y1="268" x2="660" y2="268" stroke="#2b2b2b" stroke-width="1.4" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="60" y="246" width="120" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/>
    <rect x="180" y="246" width="120" height="16" fill="#fde8e8" stroke="#b85450" stroke-width="1"/>
    <rect x="300" y="246" width="120" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/>
  </g>
  <g font-size="9.5" text-anchor="middle" fill="#555" filter="url(#rough2)">
    <text x="120" y="259">绿 0…1</text><text x="240" y="259">红 1…2</text><text x="360" y="259">绿 2…3</text>
  </g>
  <line x1="220" y1="232" x2="220" y2="286" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="220" y="304" text-anchor="middle" font-size="10.5" fill="#a33a36" filter="url(#rough2)">t = 4/3</text>
  <line x1="300" y1="232" x2="300" y2="286" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="304" text-anchor="middle" font-size="10.5" fill="#2f5223" filter="url(#rough2)">2（下次绿灯）</text>
  <text x="455" y="259" font-size="10.5" fill="#a33a36" filter="url(#rough2)">等 2 − 4/3 = 2/3</text>

  <rect x="40" y="322" width="640" height="86" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <g font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">
    <text x="56" y="348">车辆在灯前灯后都以速度 v 行驶，停车等待不改变"距离 / 速度"的部分。</text>
    <text x="56" y="374">总时间 = l/v + 灯前等待；等待只取决于到达时刻 t = d/v 在周期内的位置。</text>
    <text x="56" y="398">样例 2：5/3 + 2/3 = 7/3 ≈ 2.3333333。</text>
  </g>
</svg>
