<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="251"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="350" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 3 的距离场：源 (1,1) 与 (3,3)</text>
  <g filter="url(#rough2)">
    <rect x="180" y="70" width="100" height="64" rx="8" fill="#fce8e6" stroke="#b85450" stroke-width="1.6"/>
    <text x="230" y="110" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">0</text>
    <rect x="300" y="70" width="100" height="64" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="350" y="110" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">1</text>
    <rect x="420" y="70" width="100" height="64" rx="8" fill="#fdf3e3" stroke="#d6a040" stroke-width="1.6"/>
    <text x="470" y="110" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">2</text>
    <rect x="180" y="150" width="100" height="64" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="230" y="190" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">1</text>
    <rect x="300" y="150" width="100" height="64" rx="8" fill="#fdf3e3" stroke="#d6a040" stroke-width="1.6"/>
    <text x="350" y="190" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">2</text>
    <rect x="420" y="150" width="100" height="64" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="470" y="190" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">1</text>
    <rect x="180" y="230" width="100" height="64" rx="8" fill="#fdf3e3" stroke="#d6a040" stroke-width="1.6"/>
    <text x="230" y="270" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">2</text>
    <rect x="300" y="230" width="100" height="64" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="350" y="270" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">1</text>
    <rect x="420" y="230" width="100" height="64" rx="8" fill="#fce8e6" stroke="#b85450" stroke-width="1.6"/>
    <text x="470" y="270" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">0</text>
  </g>
  <text x="360" y="330" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">红=源（0），蓝=1 分钟，黄=2 分钟；最大值为 2</text>
  <text x="560" y="100" font-size="12" fill="#8f3b37" filter="url(#rough2)">三个格子并列，输出任意一个</text>
</svg>
