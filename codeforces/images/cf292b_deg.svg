<svg xmlns="http://www.w3.org/2000/svg" width="880" height="270" viewBox="0 0 880 270"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="270" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按度数分布判定三种拓扑</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">题目保证图连通</text>
  <text x="150" y="105" text-anchor="start" font-size="13" fill="#2b2b2b" filter="url(#rough2)">bus：两条度 1、其余度 2 且边数 n-1</text>
  <text x="150" y="145" text-anchor="start" font-size="13" fill="#2f4a66" filter="url(#rough2)">ring：所有点度 2 且边数 n</text>
  <text x="150" y="185" text-anchor="start" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">star：一个点度 n-1、其余度 1 且边数 n-1；否则 unknown</text>
</svg>
