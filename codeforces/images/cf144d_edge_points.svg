<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1441"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="720" height="340" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">一条边上的候选点</text>
  <path d="M 150 42 Q 360 48 570 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <line x1="90" y1="140" x2="620" y2="140" stroke="#335478" stroke-width="2.2" filter="url(#rough2)"/>
  <circle cx="90" cy="140" r="8" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="620" cy="140" r="8" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="90" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#335478" filter="url(#rough2)">u</text>
  <text x="620" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#335478" filter="url(#rough2)">v</text>
  <text x="90" y="172" text-anchor="middle" font-size="11.5" fill="#335478" filter="url(#rough2)">d[u]=2</text>
  <text x="620" y="172" text-anchor="middle" font-size="11.5" fill="#335478" filter="url(#rough2)">d[v]=3</text>
  <text x="355" y="128" text-anchor="middle" font-size="11" fill="#777777" filter="url(#rough2)">边长 w = 10</text>

  <line x1="295" y1="140" x2="295" y2="196" stroke="#a05a5a" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <circle cx="295" cy="140" r="6.5" fill="#a05a5a" filter="url(#rough2)"/>
  <text x="295" y="214" text-anchor="middle" font-size="10.5" fill="#a05a5a" filter="url(#rough2)">P₁：距 u 为 l−d[u] = 4</text>

  <line x1="459" y1="140" x2="459" y2="234" stroke="#2f5223" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <circle cx="459" cy="140" r="6.5" fill="#2f5223" filter="url(#rough2)"/>
  <text x="459" y="252" text-anchor="middle" font-size="10.5" fill="#2f5223" filter="url(#rough2)">P₂：距 v 为 l−d[v] = 3（距 u 为 7）</text>

  <text x="360" y="284" text-anchor="middle" font-size="11.5" fill="#335478" filter="url(#rough2)">d[u]+d[v]+w = 15 ≥ 2l = 12 ⇒ P₁、P₂ 都真的距 s 恰为 l，且不重合</text>
  <text x="360" y="308" text-anchor="middle" font-size="11.5" fill="#a05a5a" filter="url(#rough2)">若和恰好等于 2l，两点合成一点（只算 1）；若和小于 2l，这条边一个点也没有</text>
  <text x="360" y="330" text-anchor="middle" font-size="11" fill="#777777" filter="url(#rough2)">两端点若 d = l 已按「城市」记过账，所以只看边的内部</text>
</svg>
