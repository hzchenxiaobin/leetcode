<svg xmlns="http://www.w3.org/2000/svg" width="700" height="330" viewBox="0 0 700 330"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="381"/>
    <feDisplacementMap in="SourceGraphic" scale="1.5"/></filter></defs>
  <rect width="700" height="330" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">括号序列：每个值要么开 +v，要么闭 −v，同类型的就近配对</text>
  <path d="M 110 40 Q 350 46 590 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="70" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="12.5" fill="#22314a" filter="url(#rough2)">正确性等价于：从左扫、每个 −v 必须配到"栈顶最近未匹配的 +v"；结束时栈空。</text>
  <text x="76" y="106" font-size="12.5" fill="#22314a" filter="url(#rough2)">长度 n 必须是偶数（开闭各一半），否则 NO。</text>
  <text x="76" y="122" font-size="12" fill="#2f4a66" filter="url(#rough2)">被强制为负号的位置（题面第三行给出）只能当"闭"。</text>
  <g filter="url(#rough2)"><rect x="60" y="140" width="580" height="86" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="76" y="164" font-size="12.5" fill="#8a6015" filter="url(#rough2)">贪心：处理到 i 时，若"开"会让栈深超过剩余位置数（即 s+1 &gt; n−i），就必须闭；</text>
  <text x="76" y="188" font-size="12.5" fill="#8a6015" filter="url(#rough2)">否则优先"开"（因为晚闭能保留更多匹配可能）。</text>
  <text x="76" y="212" font-size="12" fill="#8a6015" filter="url(#rough2)">强制闭的位置：直接闭，要求栈顶 == p_i，否则 NO。</text>
  <g filter="url(#rough2)"><rect x="60" y="238" width="580" height="76" rx="8" fill="#e8f4e0" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="262" font-size="12.5" fill="#2f5223" filter="url(#rough2)">样例 2（n=4，p=1 1 1 1，强制第 3 位为负）：1 开、2 开、3 闭 ✓、4 闭 ✓ ⇒ "1 1 −1 −1"</text>
  <text x="76" y="286" font-size="12.5" fill="#2f5223" filter="url(#rough2)">样例 4（p=1 2 2 1，强制 3、4）：1 开、2 开、3 闭 2 ✓、4 闭 1 ✓ ⇒ "1 2 −2 −1"</text>
  <text x="76" y="308" font-size="12" fill="#3c5e2e" filter="url(#rough2)">复杂度 O(n)，n ≤ 10⁶。</text>
</svg>
