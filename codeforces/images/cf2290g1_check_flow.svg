<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">判定 check(S)：两次扫描求包络 + 外层二分</text>

  <rect x="24" y="46" width="222" height="330" fill="#ffffff" stroke="#dddddd" stroke-width="1.2" rx="10" filter="url(#rough2)"/>
  <text x="135" y="68" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">环上距离 = 两条弧取短</text>

  <circle cx="135" cy="188" r="54" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 135 134 A 54 54 0 0 0 135 242" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 135 134 A 54 54 0 0 1 135 242" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="135" cy="134" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="135" cy="242" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="135" y="138" text-anchor="middle" font-size="9.5" fill="#3a4a66" filter="url(#rough2)">i</text>
  <text x="135" y="246" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">j</text>

  <text x="56" y="182" text-anchor="middle" font-size="9.5" fill="#8a3a36" filter="url(#rough2)">|i−j|</text>
  <text x="220" y="182" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">n−|i−j|</text>

  <text x="135" y="278" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">dist(i,j) = min(|i−j|, n−|i−j|)</text>
  <text x="135" y="300" text-anchor="middle" font-size="9" fill="#8a3a36" filter="url(#rough2)">弧 1 → A[j] = max(h_i − S·|i−j|)</text>
  <text x="135" y="318" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">弧 2 → B[j] = C[j] − S·n</text>
  <text x="135" y="344" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">两路取 max 即得下界 x[j]</text>
  <text x="135" y="362" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">两条弧都要算，缺一不可</text>

  <rect x="262" y="46" width="336" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="276" y="66" font-size="9.5" fill="#2f3f5c" font-weight="bold" filter="url(#rough2)">① 弧 1：A[j] = max_i (h_i − S·|i−j|)</text>
  <text x="276" y="84" font-size="8.6" fill="#555" filter="url(#rough2)">正向 L[i]=max(h_i, L[i−1]−S)；反向 R[i]=max(h_i, R[i+1]−S)</text>
  <text x="276" y="100" font-size="9" fill="#555" filter="url(#rough2)">A[j] = max(L[j], R[j])，两遍扫描覆盖直线两侧</text>

  <path d="M 430 110 L 430 124" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="262" y="124" width="336" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="276" y="144" font-size="9.5" fill="#2f5a28" font-weight="bold" filter="url(#rough2)">② 弧 2：B[j] = C[j] − S·n，C[j] = max_i (h_i + S·|i−j|)</text>
  <text x="276" y="162" font-size="9" fill="#555" filter="url(#rough2)">同一次扫描，把步长 −S 换成 +S 即可；因为绕另一侧时</text>
  <text x="276" y="178" font-size="9" fill="#555" filter="url(#rough2)">h_i − S·(n−|i−j|) = (h_i − S·n) + S·|i−j|</text>

  <path d="M 430 188 L 430 202" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="262" y="202" width="336" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="276" y="222" font-size="9.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">③ x[j] = max(A[j], B[j])</text>
  <text x="276" y="240" font-size="9" fill="#555" filter="url(#rough2)">cost = Σ_j (x[j] − h[j])，累加一旦超过 k 立即判不可行</text>

  <path d="M 430 256 L 430 270" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="262" y="270" width="336" height="30" fill="#f7f7f7" stroke="#aaaaaa" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="430" y="290" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">④ check(S) 返回 cost ≤ k</text>

  <path d="M 350 300 L 350 314" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 510 300 L 510 314" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="264" y="314" width="172" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="350" y="331" text-anchor="middle" font-size="9" fill="#2f5a28" filter="url(#rough2)">可行 → hi = mid</text>
  <rect x="448" y="314" width="150" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="523" y="331" text-anchor="middle" font-size="9" fill="#8a3a36" filter="url(#rough2)">不可行 → lo = mid+1</text>

  <text x="430" y="360" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">二分区间 [0, max |h_i − h_{i+1}|]，约 30 轮，每轮 O(n)</text>
  <text x="430" y="376" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">总复杂度 O(n log 1e9)，n = 2000 时约 2.4×10^5 次运算</text>
</svg>
