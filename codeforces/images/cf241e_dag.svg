<svg xmlns="http://www.w3.org/2000/svg" width="720" height="310" viewBox="0 0 720 310"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="g" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="gr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#999999"/>
    </marker>
  </defs>
  <rect width="720" height="310" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">只保留「1 能到达」且「能到达 n」的城市与航线</text>

  <g filter="url(#rough2)">
    <circle cx="90"  cy="150" r="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="240" cy="86"  r="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="380" cy="86"  r="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="600" cy="150" r="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="240" cy="222" r="26" fill="#f2f2f2" stroke="#999999" stroke-width="1.6" stroke-dasharray="4 3"/>
    <circle cx="380" cy="222" r="26" fill="#f2f2f2" stroke="#999999" stroke-width="1.6" stroke-dasharray="4 3"/>
  </g>
  <g font-size="13" text-anchor="middle" filter="url(#rough2)">
    <text x="90"  y="155" fill="#2f5223">1</text>
    <text x="240" y="91"  fill="#2f5223">2</text>
    <text x="380" y="91"  fill="#2f5223">3</text>
    <text x="600" y="155" fill="#2f5223">n</text>
    <text x="240" y="227" fill="#777777">4</text>
    <text x="380" y="227" fill="#777777">5</text>
  </g>
  <g stroke-width="1.7" filter="url(#rough2)">
    <line x1="112" y1="136" x2="220" y2="99" stroke="#4a7a3a" marker-end="url(#g)"/>
    <line x1="266" y1="93" x2="352" y2="93" stroke="#4a7a3a" marker-end="url(#g)"/>
    <line x1="406" y1="93" x2="576" y2="143" stroke="#4a7a3a" marker-end="url(#g)"/>
    <line x1="112" y1="164" x2="216" y2="208" stroke="#999999" stroke-dasharray="5 4" marker-end="url(#gr)"/>
    <line x1="404" y1="212" x2="576" y2="163" stroke="#999999" stroke-dasharray="5 4" marker-end="url(#gr)"/>
  </g>
  <text x="163" y="252" text-anchor="middle" font-size="11" fill="#777777" filter="url(#rough2)">4 到不了 n，删</text>
  <text x="470" y="252" text-anchor="middle" font-size="11" fill="#777777" filter="url(#rough2)">5 从 1 到不了，删</text>

  <g filter="url(#rough2)">
    <rect x="40" y="266" width="640" height="34" rx="8" fill="#eef6ec" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <text x="360" y="288" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">被删掉的点/边对任何 1 → n 的旅行都没有影响，随便给 1 小时即可</text>
</svg>
