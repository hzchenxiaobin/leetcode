<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="47"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="440" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">把「格子」映射成「键」：key = r·L + idx</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="60.0" y="96.0" width="150.0" height="54.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="135.0" y="128.0" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">格子 c</text>
  <rect x="230.0" y="96.0" width="150.0" height="54.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="305.0" y="128.0" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">r = c mod g</text>
  <rect x="400.0" y="96.0" width="150.0" height="54.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="475.0" y="128.0" text-anchor="middle" font-size="11.5" fill="#8a6015" font-weight="bold" filter="url(#rough2)">p = c / g</text>
  <rect x="520.0" y="96.0" width="150.0" height="54.0" fill="#f3e8fd" stroke="#6b4c9a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="595.0" y="128.0" text-anchor="middle" font-size="11.5" fill="#6b4c9a" font-weight="bold" filter="url(#rough2)">key = r·L + p·inv mod L</text>
  <line x1="212.0" y1="123.0" x2="226.0" y2="123.0" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <line x1="382.0" y1="123.0" x2="396.0" y2="123.0" stroke="#8a6015" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="552.0" y1="123.0" x2="516.0" y2="123.0" stroke="#6b4c9a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="40.0" y="190.0" width="640.0" height="116.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="54.0" y="214.0" text-anchor="start" font-size="12" fill="#3f3420" filter="url(#rough2)">inv 是 (m/g) 在模 L 下的逆元，保证「探查一格」= 键 +1</text>
  <text x="54.0" y="240.0" text-anchor="start" font-size="12" fill="#3f3420" filter="url(#rough2)">链 r 的键占区间 [r·L, (r+1)·L)，不同链互不干扰</text>
  <text x="54.0" y="266.0" text-anchor="start" font-size="12" fill="#3f3420" filter="url(#rough2)">插入：在链内找第一个 ≥ key0 的空闲键；没有就绕回 r·L</text>
  <text x="54.0" y="292.0" text-anchor="start" font-size="12" fill="#3f3420" filter="url(#rough2)">虚访问次数 = (idxf − idx0) mod L</text>
  <text x="40.0" y="396.0" text-anchor="start" font-size="12.5" fill="#444" filter="url(#rough2)">这一步把「环上找下一个空位」变成「有序集合里求后继」。</text>
  <text x="40.0" y="424.0" text-anchor="start" font-size="12.5" fill="#444" filter="url(#rough2)">h ≤ 5×10⁴ 用 std::set；h ≤ 2×10⁵ 用线段树（C3）。</text>
</svg>
