<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="470" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">桥树上的距离：depth[u] + depth[v] − 2·depth[lca]</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <line x1="360.0" y1="90.0" x2="220.0" y2="180.0" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="360.0" y1="90.0" x2="500.0" y2="180.0" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="220.0" y1="180.0" x2="140.0" y2="290.0" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="220.0" y1="180.0" x2="300.0" y2="290.0" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="500.0" y1="180.0" x2="430.0" y2="290.0" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="500.0" y1="180.0" x2="580.0" y2="290.0" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="360.0" cy="90.0" r="20.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="360.0" y="94.7" text-anchor="middle" font-size="13" fill="#8a6015" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="386.0" y="72.0" text-anchor="start" font-size="10.5" fill="#777" filter="url(#rough2)">d=0</text>
  <circle cx="220.0" cy="180.0" r="20.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="220.0" y="184.7" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="246.0" y="162.0" text-anchor="start" font-size="10.5" fill="#777" filter="url(#rough2)">d=1</text>
  <circle cx="500.0" cy="180.0" r="20.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="500.0" y="184.7" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="526.0" y="162.0" text-anchor="start" font-size="10.5" fill="#777" filter="url(#rough2)">d=1</text>
  <circle cx="140.0" cy="290.0" r="20.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="140.0" y="294.7" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="166.0" y="272.0" text-anchor="start" font-size="10.5" fill="#777" filter="url(#rough2)">d=2</text>
  <circle cx="300.0" cy="290.0" r="20.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="300.0" y="294.7" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="326.0" y="272.0" text-anchor="start" font-size="10.5" fill="#777" filter="url(#rough2)">d=2</text>
  <circle cx="430.0" cy="290.0" r="20.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="430.0" y="294.7" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="456.0" y="272.0" text-anchor="start" font-size="10.5" fill="#777" filter="url(#rough2)">d=2</text>
  <circle cx="580.0" cy="290.0" r="20.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="580.0" y="294.7" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="606.0" y="272.0" text-anchor="start" font-size="10.5" fill="#777" filter="url(#rough2)">d=2</text>
  <path d="M 300 270 Q 360 190 430 270" fill="none" stroke="#4a7a3a" stroke-width="2.6" filter="url(#rough2)"/>
  <text x="365.0" y="214.0" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">LCA(4,5) = 0</text>
  <rect x="40.0" y="348.0" width="640.0" height="100.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="54.0" y="372.0" text-anchor="start" font-size="12" fill="#3f3420" filter="url(#rough2)">dist(4,5) = depth[4] + depth[5] − 2·depth[0] = 2 + 2 − 0 = 4</text>
  <text x="54.0" y="399.0" text-anchor="start" font-size="12" fill="#3f3420" filter="url(#rough2)">倍增：先把深的点提到同一层，再一起往上跳 2^j</text>
  <text x="54.0" y="426.0" text-anchor="start" font-size="12" fill="#3f3420" filter="url(#rough2)">每次询问 O(log n)，总 O((n+k) log n)</text>
</svg>
