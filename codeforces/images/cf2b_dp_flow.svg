<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="620" height="430" fill="#fafafa"/>

  <rect x="50" y="46" width="520" height="44" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="73" text-anchor="middle" font-size="13" fill="#2f4a63" filter="url(#rough2)">① 读入矩阵，记下第一个 0 的位置 (zr, zc)</text>
  <path d="M310,90 L310,110" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="50" y="112" width="520" height="66" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="139" text-anchor="middle" font-size="13" fill="#7a5a12" filter="url(#rough2)">② 对 p = 2 做 DP：dp[i][j] = cnt_p(a_ij) + min(dp 上, dp 左)</text>
  <text x="310" y="163" text-anchor="middle" font-size="12" fill="#7a5a12" filter="url(#rough2)">cnt_p 是因子 p 的个数，0 格代价记 INF（单独处理）</text>
  <path d="M310,178 L310,198" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="50" y="200" width="520" height="44" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="227" text-anchor="middle" font-size="13" fill="#2f4a63" filter="url(#rough2)">③ 对 p = 5 完全一样地再跑一遍，得到 dp₅ 与自己的 from</text>
  <path d="M310,244 L310,264" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="50" y="266" width="520" height="66" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="293" text-anchor="middle" font-size="13" fill="#7a2f2c" filter="url(#rough2)">④ ans = min(dp₂, dp₅)；若矩阵含 0 且 ans &gt; 1</text>
  <text x="310" y="317" text-anchor="middle" font-size="12" fill="#7a2f2c" filter="url(#rough2)">则 ans = 1，走经过 0 的那条路径（乘积为 0，恰 1 个零）</text>
  <path d="M310,332 L310,352" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="50" y="354" width="520" height="44" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="381" text-anchor="middle" font-size="13" fill="#33552a" filter="url(#rough2)">⑤ 从 (n−1, n−1) 按 from 回溯到 (0,0)，方向串反转后输出</text>
</svg>
