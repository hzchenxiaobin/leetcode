<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="720" height="400" fill="#fafafa"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每轮发 1,2,…,n 个筹码，发不够就停</text>
  <path d="M 200 43 Q 360 49 520 43" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <rect x="70" y="90" width="90" height="46" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="115" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1 个</text>
  <rect x="180" y="90" width="90" height="46" rx="7" fill="#e9f4e2" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="225" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2 个</text>
  <rect x="290" y="90" width="90" height="46" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="335" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3 个</text>
  <rect x="400" y="90" width="90" height="46" rx="7" fill="#e9f4e2" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="445" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">4 个</text>
  <rect x="510" y="90" width="90" height="46" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="555" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">5 个</text>
  <text x="70" y="166" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">同一轮结束后从 1 号重新开始，直到剩下的筹码不够发给当前的人。</text>
  <rect x="60" y="186" width="600" height="76" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="76" y="212" text-anchor="start" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">样例 1：n=4, m=11</text>
  <text x="76" y="238" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">发 1、2、3、4 后剩 1；下一轮该发 1 个，但只剩 1 个 → 发给 1 号后剩 0；</text>
  <text x="76" y="258" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">再下一轮要发 1 个，剩 0 → 停止，输出 0</text>
  <text x="60" y="300" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">直接按轮模拟：m ≤ 10^4，每轮至少消耗 n(n+1)/2 ≥ 3 个筹码，</text>
  <text x="60" y="324" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">轮数是 O(m/n^2)，总操作 O(m) 级别，2 s 绰绰有余。</text>
  <text x="60" y="356" text-anchor="start" font-size="11" fill="#777777" filter="url(#rough2)">边界：m 恰好等于某个前缀和时，下一个人要的数目大于剩余，直接结束。</text>
</svg>
