  <text x="452" y="350" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">c × c 的传感器方块</text>
  <text x="452" y="482" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">max 方块上的 cost = max_u Hx(u) + max_v Hy(v)，在角 (a 或 A, b 或 B) 取到</text>
  <text x="452" y="506" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">所以只需盯住两个极值列 a、A 与两个极值行 b、B 的组合</text>
