  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">只有四个角上的传感器会起作用</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">cost(u,v) = Hx(u) + Hy(v) 在方块上可分离，最大值在角上取到</text>
