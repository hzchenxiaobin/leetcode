<svg xmlns="http://www.w3.org/2000/svg" width="720" height="410" viewBox="0 0 720 410"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="720" height="410" fill="#fafafa"/>
  <text x="360.0" y="33" font-size="20" font-weight="bold" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">样例 1：正方形 (1,3)，答案 4 − 2 = 2</text>
  <path d="M 220 44 Q 360.0 50 500 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="110" y="90" width="60" height="60" rx="0" fill="#ffffff" stroke="#7a8b9a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="170" y="90" width="60" height="60" rx="0" fill="#ffffff" stroke="#7a8b9a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="110" y="150" width="60" height="60" rx="0" fill="#ffffff" stroke="#7a8b9a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="170" y="150" width="60" height="60" rx="0" fill="#ffffff" stroke="#7a8b9a" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="230" cy="210" r="6" fill="#22303f" filter="url(#rough2)"/>
  <text x="222" y="226" font-size="9.5" font-weight="normal" fill="#555" text-anchor="end" filter="url(#rough2)">(5,0)</text>
  <circle cx="110" cy="210" r="6" fill="#22303f" filter="url(#rough2)"/>
  <text x="118" y="226" font-size="9.5" font-weight="normal" fill="#555" text-anchor="start" filter="url(#rough2)">(0,0)</text>
  <circle cx="110" cy="90" r="6" fill="#22303f" filter="url(#rough2)"/>
  <text x="118" y="82" font-size="9.5" font-weight="normal" fill="#555" text-anchor="start" filter="url(#rough2)">(0,5)</text>
  <circle cx="230" cy="90" r="6" fill="#22303f" filter="url(#rough2)"/>
  <text x="222" y="82" font-size="9.5" font-weight="normal" fill="#555" text-anchor="end" filter="url(#rough2)">(5,5)</text>
  <circle cx="134.0" cy="138.0" r="6" fill="#b85450" filter="url(#rough2)"/>
  <text x="100.0" y="130.0" font-size="11" font-weight="bold" fill="#7a3b36" text-anchor="end" filter="url(#rough2)">P(1,3)</text>
  <path d="M 230.0 210.0 L 110.0 210.0 L 230.0 90.0 Z" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <path d="M 230.0 210.0 L 110.0 90.0 L 230.0 90.0 Z" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="256" y="120" font-size="10.5" font-weight="normal" fill="#b85450" text-anchor="start" filter="url(#rough2)">两个不包含 P 的三角形</text>
  <text x="256" y="140" font-size="10" font-weight="normal" fill="#666" text-anchor="start" filter="url(#rough2)">(虚线)</text>
  <rect x="400" y="280" width="300" height="80" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="550" y="306" font-size="11.5" font-weight="normal" fill="#2f5223" text-anchor="middle" filter="url(#rough2)">c = (1,1,2,2)</text>
  <text x="550" y="326" font-size="11.5" font-weight="normal" fill="#2f5223" text-anchor="middle" filter="url(#rough2)">不含 = 0+0+1+1 = 2</text>
  <text x="550" y="348" font-size="12.5" font-weight="bold" fill="#2f5223" text-anchor="middle" filter="url(#rough2)">C(4,3) − 2 = 2</text>
  <text x="360" y="392" font-size="10.5" font-weight="normal" fill="#666" text-anchor="middle" filter="url(#rough2)">每次询问先用 O(n) 判断内外；在外直接输出 0</text>
</svg>
