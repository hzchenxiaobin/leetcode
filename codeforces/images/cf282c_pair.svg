<svg xmlns="http://www.w3.org/2000/svg" width="700" height="360" viewBox="0 0 700 360"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="171"/>
    <feDisplacementMap in="SourceGraphic" scale="1.5"/></filter></defs>
  <rect width="700" height="360" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">一次操作只作用在相邻两位：取 xor 与 or</text>
  <path d="M 120 40 Q 350 46 580 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="270" height="74" rx="8" fill="#f4f4f4" stroke="#888" stroke-width="1.3"/></g>
  <text x="195" y="84" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">00 → xor=0, or=0</text>
  <text x="195" y="108" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">⇒ 00（什么都不变）</text>
  <text x="195" y="126" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">这是唯一的"死"组合</text>
  <g filter="url(#rough2)"><rect x="370" y="58" width="270" height="74" rx="8" fill="#e8f4e0" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="505" y="84" text-anchor="middle" font-size="15" fill="#2f5223" filter="url(#rough2)">01 / 10 → xor=1, or=1</text>
  <text x="505" y="108" text-anchor="middle" font-size="14" fill="#2f5223" filter="url(#rough2)">⇒ 11（1 变两个）</text>
  <text x="505" y="126" text-anchor="middle" font-size="11" fill="#3c5e2e" filter="url(#rough2)">1 可以"增殖"</text>
  <g filter="url(#rough2)"><rect x="60" y="146" width="580" height="60" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="76" y="170" font-size="14" fill="#8a6015" filter="url(#rough2)">11 → xor=0, or=1 ⇒ 10 或 01（两个 1 可以"缩"成一个）</text>
  <text x="76" y="194" font-size="12" fill="#8a6015" filter="url(#rough2)">把 01、10、11 三种合起来看：1 的个数不是不变量，但"有没有 1"是不变量。</text>
  <g filter="url(#rough2)"><rect x="60" y="220" width="580" height="126" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="244" font-size="13" fill="#22314a" filter="url(#rough2)">两个基本动作（长度 ≥ 2 时）：</text>
  <text x="76" y="268" font-size="12.5" fill="#22314a" filter="url(#rough2)">① 移动一个 1：10 → 11 → 01（把 1 右移一位，两刀）</text>
  <text x="76" y="292" font-size="12.5" fill="#22314a" filter="url(#rough2)">② 增减 1 的个数：10 → 11（加），11 → 10（减）</text>
  <text x="76" y="316" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">于是"有 1 的串"之间全部互通；全 0 串只能从全 0 串得到。</text>
  <text x="76" y="338" font-size="11.5" fill="#556" filter="url(#rough2)">长度 1 时没有相邻对，任何串都动不了。</text>
</svg>
