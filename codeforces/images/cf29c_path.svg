<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">n 枚邮戳就是一条路径的 n 条边</text>
  <path d="M 180 42 Q 360 48 540 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 路径 -->
  <g stroke="#446688" stroke-width="2.4" filter="url(#rough2)">
    <line x1="110" y1="150" x2="230" y2="150"/>
    <line x1="270" y1="150" x2="390" y2="150"/>
    <line x1="430" y1="150" x2="550" y2="150"/>
    <line x1="590" y1="150" x2="680" y2="150"/>
  </g>
  <g filter="url(#rough2)">
    <circle cx="90" cy="150" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <circle cx="250" cy="150" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="410" cy="150" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="570" cy="150" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="700" cy="150" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <g font-size="11" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">
    <text x="90" y="155">A</text><text x="250" y="155">B</text><text x="410" y="155">C</text>
    <text x="570" y="155">D</text><text x="700" y="155">E</text>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#555" filter="url(#rough2)">
    <text x="170" y="136">邮戳 1</text><text x="330" y="136">邮戳 2</text>
    <text x="490" y="136">邮戳 3</text><text x="635" y="136">邮戳 4</text>
  </g>
  <text x="90" y="196" text-anchor="middle" font-size="10.5" fill="#2f5223" filter="url(#rough2)">度 1（端点）</text>
  <text x="700" y="196" text-anchor="middle" font-size="10.5" fill="#2f5223" filter="url(#rough2)">度 1</text>
  <text x="410" y="196" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">内部点度 2</text>

  <path d="M 90 220 Q 360 300 700 220" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="395" y="300" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">从任一端点出发，沿着没走过的邻边一路走到底，恰好得到 n+1 个城市</text>

  <rect x="40" y="320" width="640" height="64" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <g font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">
    <text x="56" y="346">路径只有两个方向；从不同端点出发得到互为逆序的两条路线，题目允许任意一条。</text>
    <text x="56" y="372">n = 1 时路径只有一条边，输出两个城市的任意顺序即可。</text>
  </g>
</svg>
