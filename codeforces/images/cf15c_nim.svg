<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="109"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>

  <rect width="760" height="380" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">Nim：全部堆大小的异或和决定胜负</text>
  <path d="M 170 40 Q 380 46 590 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <circle cx="120" cy="268" r="14" fill="#cfe0f5" stroke="#666666" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="120" cy="236" r="14" fill="#cfe0f5" stroke="#666666" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="86" y1="286" x2="154" y2="286" stroke="#666666" stroke-width="2" filter="url(#rough2)"/>
  <text x="120" y="308" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">采石场 1</text>
  <text x="120" y="210" text-anchor="middle" font-size="11" font-weight="bold" fill="#333333" filter="url(#rough2)">2</text>
  <circle cx="260" cy="268" r="14" fill="#d9ecd4" stroke="#666666" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="260" cy="236" r="14" fill="#d9ecd4" stroke="#666666" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="260" cy="204" r="14" fill="#d9ecd4" stroke="#666666" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="226" y1="286" x2="294" y2="286" stroke="#666666" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="308" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">采石场 2 第 1 车</text>
  <text x="260" y="178" text-anchor="middle" font-size="11" font-weight="bold" fill="#333333" filter="url(#rough2)">3</text>
  <circle cx="400" cy="268" r="14" fill="#fbe3c8" stroke="#666666" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="400" cy="236" r="14" fill="#fbe3c8" stroke="#666666" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="400" cy="204" r="14" fill="#fbe3c8" stroke="#666666" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="400" cy="172" r="14" fill="#fbe3c8" stroke="#666666" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="366" y1="286" x2="434" y2="286" stroke="#666666" stroke-width="2" filter="url(#rough2)"/>
  <text x="400" y="308" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">采石场 2 第 2 车</text>
  <text x="400" y="146" text-anchor="middle" font-size="11" font-weight="bold" fill="#333333" filter="url(#rough2)">4</text>
  <text x="470" y="110" font-size="13" fill="#2b2b2b" filter="url(#rough2)">2 ⊕ 3 ⊕ 4 = 5</text>
  <text x="470" y="140" font-size="13" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">5 ≠ 0 ⇒ 先手必胜</text>
  <text x="470" y="170" font-size="12" fill="#2b2b2b" filter="url(#rough2)">输出 tolik</text>
  <rect x="450" y="196" width="280" height="140" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="464" y="222" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">Nim 定理</text>
  <text x="464" y="248" font-size="11" fill="#7a5a1b" filter="url(#rough2)">异或和为 0 → 必败（bolik）</text>
  <text x="464" y="272" font-size="11" fill="#7a5a1b" filter="url(#rough2)">异或和非 0 → 必胜（tolik）</text>
  <text x="464" y="300" font-size="10.5" fill="#9a7020" filter="url(#rough2)">证明：非 0 时总能取一次</text>
  <text x="464" y="320" font-size="10.5" fill="#9a7020" filter="url(#rough2)">把异或和变成 0。</text>
  <text x="50" y="352" font-size="11.5" fill="#555555" filter="url(#rough2)">本题的堆太多（最多 10^21 辆），不能逐堆异或，必须用区间异或公式把每段一次性算掉。</text>
</svg>
