<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1442"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="720" height="380" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按 d[u]+d[v]+w 与 2l 分三种</text>
  <path d="M 190 42 Q 360 48 530 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <rect x="40" y="66" width="640" height="92" rx="8" fill="#f4f4f1" stroke="#b8b8b0" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="58" y="94" font-size="12" font-weight="bold" fill="#8a8a80" filter="url(#rough2)">① 和 &lt; 2l</text>
  <line x1="230" y1="112" x2="600" y2="112" stroke="#b8b8b0" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="230" cy="112" r="6" fill="#e6e6e2" stroke="#b8b8b0" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="600" cy="112" r="6" fill="#e6e6e2" stroke="#b8b8b0" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="58" y="140" font-size="11" fill="#777777" filter="url(#rough2)">两个方向都够不到 l，边上最近也只有 (d[u]+d[v]+w)/2 的距离</text>
  <text x="636" y="106" text-anchor="end" font-size="12.5" font-weight="bold" fill="#8a8a80" filter="url(#rough2)">贡献 0</text>

  <rect x="40" y="170" width="640" height="92" rx="8" fill="#f6eef4" stroke="#a05a9a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="58" y="198" font-size="12" font-weight="bold" fill="#8a5a86" filter="url(#rough2)">② 和 = 2l</text>
  <line x1="230" y1="216" x2="600" y2="216" stroke="#8a5a86" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="230" cy="216" r="6" fill="#f6eef4" stroke="#8a5a86" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="600" cy="216" r="6" fill="#f6eef4" stroke="#8a5a86" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="415" cy="216" r="7" fill="#a05a9a" filter="url(#rough2)"/>
  <text x="415" y="204" text-anchor="middle" font-size="10.5" fill="#8a5a86" filter="url(#rough2)">两侧算出的是同一个点</text>
  <text x="58" y="244" font-size="11" fill="#777777" filter="url(#rough2)">要求和 d[u] &lt; l 且 d[v] &lt; l（严格在边内部），否则该点就是被数过的城市</text>
  <text x="636" y="210" text-anchor="end" font-size="12.5" font-weight="bold" fill="#8a5a86" filter="url(#rough2)">贡献 1</text>

  <rect x="40" y="274" width="640" height="92" rx="8" fill="#eef5ea" stroke="#5a8a4a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="58" y="302" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">③ 和 &gt; 2l</text>
  <line x1="230" y1="320" x2="600" y2="320" stroke="#2f5223" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="230" cy="320" r="6" fill="#eef5ea" stroke="#2f5223" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="600" cy="320" r="6" fill="#eef5ea" stroke="#2f5223" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="352" cy="320" r="7" fill="#2f5223" filter="url(#rough2)"/>
  <circle cx="478" cy="320" r="7" fill="#2f5223" filter="url(#rough2)"/>
  <text x="58" y="348" font-size="11" fill="#777777" filter="url(#rough2)">每个满足 d[x] &lt; l 的端点各贡献一个候选点，与另一个端点无关</text>
  <text x="636" y="314" text-anchor="end" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">贡献 0/1/2</text>
</svg>
