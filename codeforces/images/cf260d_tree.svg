<svg xmlns="http://www.w3.org/2000/svg" width="880" height="290" viewBox="0 0 880 290"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="290" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">s_v = 所有相邻边权之和；树按颜色二分</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">按颜色分组，每次让剩余值较小的那一端"被用完"</text>
  <g filter="url(#rough2)"><rect x="200" y="110" width="70" height="50" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="235.0" y="140.04" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">w</text>
  <g filter="url(#rough2)"><rect x="360" y="110" width="70" height="50" rx="4" fill="#cfe0f0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="395.0" y="140.04" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">b</text>
  <line x1="270" y1="135" x2="360" y2="135" stroke="#3d6b2f" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="315" y="100" text-anchor="middle" font-size="11" fill="#3d6b2f" filter="url(#rough2)">min(rw, rb)</text>
  <text x="440" y="190" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">取双方"剩余值和"最小的点连边</text>
  <text x="440" y="228" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">耗尽的一端可以继续挂 0 权边</text>
  <text x="440" y="266" text-anchor="start" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">循环到只剩 1 个点，恰有 n-1 条边</text>
</svg>
