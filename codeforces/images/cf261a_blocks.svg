<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>

  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">价格降序，每 q+2 件一组：前 q 件付费，后 2 件免费</text>
  <path d="M 96 44 Q 360 50 624 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 12 件商品：q=2，块大小 4 -->
  <g filter="url(#rough2)">
    <!-- 块 1：付费 2 件 -->
    <rect x="60" y="90" width="64" height="70" rx="6" fill="#dfeafc" stroke="#446688" stroke-width="1.6"/>
    <rect x="128" y="90" width="64" height="70" rx="6" fill="#dfeafc" stroke="#446688" stroke-width="1.6"/>
    <rect x="196" y="90" width="64" height="70" rx="6" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="264" y="90" width="64" height="70" rx="6" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.6"/>
    <!-- 块 2 -->
    <rect x="360" y="90" width="64" height="70" rx="6" fill="#dfeafc" stroke="#446688" stroke-width="1.6"/>
    <rect x="428" y="90" width="64" height="70" rx="6" fill="#dfeafc" stroke="#446688" stroke-width="1.6"/>
    <rect x="496" y="90" width="64" height="70" rx="6" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="564" y="90" width="64" height="70" rx="6" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.6"/>
  </g>

  <g font-size="15" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">
    <text x="92" y="132">100</text>
    <text x="160" y="132">100</text>
    <text x="228" y="132">50</text>
    <text x="296" y="132">50</text>
    <text x="392" y="132">40</text>
    <text x="460" y="132">30</text>
    <text x="528" y="132">20</text>
    <text x="596" y="132">10</text>
  </g>

  <!-- 块括号 -->
  <g stroke="#3c5e2e" stroke-width="1.6" fill="none" filter="url(#rough2)">
    <path d="M 62 176 L 62 186 L 326 186 L 326 176"/>
    <path d="M 362 176 L 362 186 L 626 186 L 626 176"/>
  </g>
  <g font-size="12.5" fill="#3c5e2e" text-anchor="middle" filter="url(#rough2)">
    <text x="194" y="205">第 1 个篮子（q = 2 件付费 + 2 件免费）</text>
    <text x="494" y="205">第 2 个篮子</text>
  </g>

  <!-- 说明 -->
  <text x="60" y="246" font-size="13" fill="#2f4a66" filter="url(#rough2)">蓝 = 付钱；黄 = 免费（必须比同组最便宜的付费商品便宜，降序保证成立）</text>

  <g filter="url(#rough2)">
    <rect x="60" y="264" width="600" height="102" rx="8" fill="#ffffff" stroke="#888" stroke-width="1.2"/>
  </g>
  <g font-size="13" fill="#333" filter="url(#rough2)">
    <text x="76" y="288">为什么降序分块：把最贵的放进篮子，最便宜的留作免费件，</text>
    <text x="76" y="310">免费件的“上限”是同组最低付费价，降序排好后就自动满足。</text>
    <text x="76" y="332">免费件数 = 2 × 完整组数，与具体价格无关，所以只要组数最多。</text>
    <text x="76" y="354">组数最多 ⟺ 每组付费件数最少 ⟺ q 取所有折扣里最小的 q_min。</text>
  </g>

  <path d="M 40 150 L 52 150" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="20" y="80" font-size="12" fill="#666" filter="url(#rough2)">价格从大到小</text>
</svg>
