  <text x="156.0" y="315.0" text-anchor="middle" font-size="20" fill="#8a6015" filter="url(#rough2)">★</text>
  <rect x="200.0" y="270.0" width="72.0" height="72.0" fill="#ffffff" stroke="#cccccc" stroke-width="1.1" rx="6" filter="url(#rough2)"/>
  <rect x="280.0" y="270.0" width="72.0" height="72.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" stroke-dasharray="6 4" filter="url(#rough2)"/>
