  <text x="316.0" y="155.0" text-anchor="middle" font-size="20" fill="#8a6015" filter="url(#rough2)">★</text>
  <rect x="120.0" y="190.0" width="72.0" height="72.0" fill="#ffffff" stroke="#cccccc" stroke-width="1.1" rx="6" filter="url(#rough2)"/>
  <rect x="200.0" y="190.0" width="72.0" height="72.0" fill="#ffffff" stroke="#cccccc" stroke-width="1.1" rx="6" filter="url(#rough2)"/>
