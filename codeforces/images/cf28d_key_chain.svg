<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="430" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="38" text-anchor="middle" font-size="18.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">28D：被选中的车必须满足 l + c + r = 总人数</text>
  <path d="M 137 50 Q 380 56 623 50" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="86" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">设选中的车队总人数为 C。选中的车 i 前面恰有 l_i 人、后面恰有 r_i 人，</text>
  <text x="60" y="112" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">而 i 自己贡献 c_i 人 ⇒ C = l_i + c_i + r_i 对每辆选中的车都相同。</text>
  <text x="60" y="138" text-anchor="start" font-size="12.5" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">于是按 K = l + c + r 把车分组，不同组不可能同时出现在答案里。</text>
  <rect x="90" y="190" width="100" height="70" rx="9" fill="#fff3e0" stroke="#c9801f" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="140" y="216" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">车1</text>
  <text x="140" y="242" text-anchor="middle" font-size="10.5" fill="#555" font-weight="normal" filter="url(#rough2)">l=0,c=1</text>
  <rect x="210" y="190" width="100" height="70" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="216" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">车2</text>
  <text x="260" y="242" text-anchor="middle" font-size="10.5" fill="#555" font-weight="normal" filter="url(#rough2)">l=1,c=1</text>
  <rect x="330" y="190" width="100" height="70" rx="9" fill="#fff3e0" stroke="#c9801f" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="216" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">车3</text>
  <text x="380" y="242" text-anchor="middle" font-size="10.5" fill="#555" font-weight="normal" filter="url(#rough2)">l=2,c=1</text>
  <rect x="450" y="190" width="100" height="70" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="500" y="216" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">车4/5</text>
  <text x="500" y="242" text-anchor="middle" font-size="10.5" fill="#555" font-weight="normal" filter="url(#rough2)">l=3,c=1</text>
  <path d="M 192 225 L 206 225" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 312 225 L 326 225" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 432 225 L 446 225" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="60" y="292" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">链的前缀人数必须等于 l_i：p=0 → p=l+c → …，最后一辆的 p 必须正好等于 K。</text>
  <rect x="60" y="310" width="640" height="96" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="76" y="338" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">dp：按原始顺序扫，state (K, p) → 当前最大总价值（以及链尾车号）。</text>
  <text x="76" y="364" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">车 i 能接上 ⇔ 存在状态 (K, l_i)；接上后转移到 (K, l_i + c_i)。</text>
  <text x="76" y="390" text-anchor="start" font-size="12.5" fill="#2f5223" font-weight="bold" filter="url(#rough2)">答案 = max over K of value(K, K)，回溯用每辆车记录的前驱。O(n log n)。</text>
</svg>
