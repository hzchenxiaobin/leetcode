<svg xmlns="http://www.w3.org/2000/svg" width="880" height="290" viewBox="0 0 880 290"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="290" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">旋转坐标：u = i+j，v = i-j</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">菱形 |i-x|+|j-y| &lt;= k-1 在 (u,v) 上变成正方形</text>
  <path d="M300,80 L430,150 L300,220 L170,150 Z" fill="none" stroke="#3d6b2f" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="64" text-anchor="middle" font-size="12" fill="#3d6b2f" filter="url(#rough2)">菱形（原坐标）</text>
  <g filter="url(#rough2)"><rect x="500" y="90" width="220" height="120" rx="4" fill="#d7ecd0" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="610" y="76" text-anchor="middle" font-size="12" fill="#3d6b2f" filter="url(#rough2)">正方形（旋转后）</text>
  <text x="440" y="262" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">对 (u,v) 建二维前缀和，每个候选中心 O(1) 求菱形和</text>
</svg>
