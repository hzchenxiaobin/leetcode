<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c9801f"/>
    </marker>
  </defs>

  <rect width="760" height="420" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="38" text-anchor="middle" font-size="18.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">数字根把 1..N 分成 9 类：d(x) = (x-1) mod 9 + 1</text>
  <path d="M 152 50 Q 380 56 608 50" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="70" y="66" width="470" height="28" rx="6" fill="#f7f9fc" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="84" y="86" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">1, 10, 19, 28, ...</text>
  <text x="556" y="86" text-anchor="start" font-size="14" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">d = 1</text>
  <rect x="70" y="99" width="470" height="28" rx="6" fill="#f4f9f2" stroke="#4a7a3a" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="84" y="119" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">2, 11, 20, 29, ...</text>
  <text x="556" y="119" text-anchor="start" font-size="14" fill="#2f5223" font-weight="bold" filter="url(#rough2)">d = 2</text>
  <rect x="70" y="132" width="470" height="28" rx="6" fill="#f7f9fc" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="84" y="152" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">3, 12, 21, 30, ...</text>
  <text x="556" y="152" text-anchor="start" font-size="14" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">d = 3</text>
  <rect x="70" y="165" width="470" height="28" rx="6" fill="#f4f9f2" stroke="#4a7a3a" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="84" y="185" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">4, 13, 22, 31, ...</text>
  <text x="556" y="185" text-anchor="start" font-size="14" fill="#2f5223" font-weight="bold" filter="url(#rough2)">d = 4</text>
  <rect x="70" y="198" width="470" height="28" rx="6" fill="#f7f9fc" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="84" y="218" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">5, 14, 23, 32, ...</text>
  <text x="556" y="218" text-anchor="start" font-size="14" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">d = 5</text>
  <rect x="70" y="231" width="470" height="28" rx="6" fill="#f4f9f2" stroke="#4a7a3a" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="84" y="251" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">6, 15, 24, 33, ...</text>
  <text x="556" y="251" text-anchor="start" font-size="14" fill="#2f5223" font-weight="bold" filter="url(#rough2)">d = 6</text>
  <rect x="70" y="264" width="470" height="28" rx="6" fill="#f7f9fc" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="84" y="284" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">7, 16, 25, 34, ...</text>
  <text x="556" y="284" text-anchor="start" font-size="14" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">d = 7</text>
  <rect x="70" y="297" width="470" height="28" rx="6" fill="#f4f9f2" stroke="#4a7a3a" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="84" y="317" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">8, 17, 26, 35, ...</text>
  <text x="556" y="317" text-anchor="start" font-size="14" fill="#2f5223" font-weight="bold" filter="url(#rough2)">d = 8</text>
  <rect x="70" y="330" width="470" height="28" rx="6" fill="#f7f9fc" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="84" y="350" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">9, 18, 27, 36, ...</text>
  <text x="556" y="350" text-anchor="start" font-size="14" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">d = 9</text>
  <text x="70" y="388" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">每类恰好有 (N - r) / 9 + 1 个数（r &gt; N 时为 0）；样例 N = 4 时只有 d = 1..4 四类非空。</text>
</svg>
