<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1393"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>

  <rect width="720" height="320" fill="#fafafa"/>
  <text x="360.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">一卷能切几条竖带</text>
  <path d="M 115.2 42 Q 360.0 48 604.8 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="360.0" y="306" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">条数 = ⌊L/h⌋，需要 ⌈P/W⌉ 条</text>
  <rect x="90" y="70" width="180" height="150" rx="7" fill="#f4f4f1" stroke="#b8b8b0" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="90" y="70" width="180" height="48" rx="2" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="180" y="100" text-anchor="middle" font-size="10.5" fill="#335478" filter="url(#rough2)">高 h（第 1 条）</text>
  <rect x="90" y="120" width="180" height="48" rx="2" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="180" y="150" text-anchor="middle" font-size="10.5" fill="#335478" filter="url(#rough2)">高 h（第 2 条）</text>
  <rect x="90" y="170" width="180" height="48" rx="2" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="180" y="200" text-anchor="middle" font-size="10.5" fill="#335478" filter="url(#rough2)">高 h（第 3 条）</text>
  <text x="180" y="245" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">一卷：长 L，宽 W</text>
  <text x="430" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">墙面周长 P = 2(ℓ+w)</text>
  <text x="430" y="135" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">需要竖带 ⌈P / W⌉ 条</text>
  <text x="430" y="170" text-anchor="middle" font-size="12" fill="#335478" filter="url(#rough2)">每卷出 ⌊L / h⌋ 条</text>
  <text x="430" y="205" text-anchor="middle" font-size="12" font-weight="bold" fill="#8c2f2c" filter="url(#rough2)">卷数 = ⌈带数 / 每卷条数⌉</text>
  <text x="360" y="290" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">样例：20 周长、h=3；15/2/320 这种每卷 5 条、需 10 条 → 2 卷 = 640</text>
</svg>
