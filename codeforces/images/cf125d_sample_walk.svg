<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="37"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="760" height="430" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 4 1 2 7 3 10 的成功扫描</text>
  <path d="M 230 42 Q 380 50 530 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <g filter="url(#rough2)" font-size="12.5">
    <rect x="40" y="60" width="60" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.1"/>
    <text x="70" y="80" text-anchor="middle" font-weight="bold" fill="#2f4a66">元素</text>
    <rect x="104" y="60" width="120" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.1"/>
    <text x="164" y="80" text-anchor="middle" font-weight="bold" fill="#2f4a66">第一组</text>
    <rect x="228" y="60" width="130" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.1"/>
    <text x="293" y="80" text-anchor="middle" font-weight="bold" fill="#2f4a66">第二组</text>
    <rect x="362" y="60" width="358" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.1"/>
    <text x="541" y="80" text-anchor="middle" font-weight="bold" fill="#2f4a66">判定</text>
  </g>

  <g filter="url(#rough2)" font-size="12.5" font-family="'Courier New',monospace">
    <rect x="40" y="96" width="60" height="28" fill="#ffffff" stroke="#ddd"/><text x="70" y="115" text-anchor="middle">4</text>
    <rect x="104" y="96" width="120" height="28" fill="#ffffff" stroke="#ddd"/><text x="114" y="115">4</text>
    <rect x="228" y="96" width="130" height="28" fill="#ffffff" stroke="#ddd"/><text x="238" y="115">—</text>
    <rect x="362" y="96" width="358" height="28" fill="#ffffff" stroke="#ddd"/><text x="372" y="115" fill="#555">a1 固定进第一组</text>

    <rect x="40" y="128" width="60" height="28" fill="#f7fbff" stroke="#ddd"/><text x="70" y="147" text-anchor="middle">1</text>
    <rect x="104" y="128" width="120" height="28" fill="#f7fbff" stroke="#ddd"/><text x="114" y="147">4</text>
    <rect x="228" y="128" width="130" height="28" fill="#f7fbff" stroke="#ddd"/><text x="238" y="147">1</text>
    <rect x="362" y="128" width="358" height="28" fill="#f7fbff" stroke="#ddd"/><text x="372" y="147" fill="#555">1 ≠ 第一组期待值（还不知道），进第二组</text>

    <rect x="40" y="160" width="60" height="28" fill="#ffffff" stroke="#ddd"/><text x="70" y="179" text-anchor="middle">2</text>
    <rect x="104" y="160" width="120" height="28" fill="#ffffff" stroke="#ddd"/><text x="114" y="179">4</text>
    <rect x="228" y="160" width="130" height="28" fill="#ffffff" stroke="#ddd"/><text x="238" y="179">1, 2</text>
    <rect x="362" y="160" width="358" height="28" fill="#ffffff" stroke="#ddd"/><text x="372" y="179" fill="#2f5223">第二组拿到第 2 项 → 公差 1，锁定</text>

    <rect x="40" y="192" width="60" height="28" fill="#f7fbff" stroke="#ddd"/><text x="70" y="211" text-anchor="middle">7</text>
    <rect x="104" y="192" width="120" height="28" fill="#f7fbff" stroke="#ddd"/><text x="114" y="211">4, 7</text>
    <rect x="228" y="192" width="130" height="28" fill="#f7fbff" stroke="#ddd"/><text x="238" y="211">1, 2</text>
    <rect x="362" y="192" width="358" height="28" fill="#f7fbff" stroke="#ddd"/><text x="372" y="211" fill="#8b3a37">7 ≠ 3，只能进第一组 → 公差 3，锁定</text>

    <rect x="40" y="224" width="60" height="28" fill="#ffffff" stroke="#ddd"/><text x="70" y="243" text-anchor="middle">3</text>
    <rect x="104" y="224" width="120" height="28" fill="#ffffff" stroke="#ddd"/><text x="114" y="243">4, 7</text>
    <rect x="228" y="224" width="130" height="28" fill="#ffffff" stroke="#ddd"/><text x="238" y="243">1, 2, 3</text>
    <rect x="362" y="224" width="358" height="28" fill="#ffffff" stroke="#ddd"/><text x="372" y="243" fill="#2f5223">3 只匹配第二组期待的 3 → 给第二组</text>

    <rect x="40" y="256" width="60" height="28" fill="#f7fbff" stroke="#ddd"/><text x="70" y="275" text-anchor="middle">10</text>
    <rect x="104" y="256" width="120" height="28" fill="#f7fbff" stroke="#ddd"/><text x="114" y="275">4, 7, 10</text>
    <rect x="228" y="256" width="130" height="28" fill="#f7fbff" stroke="#ddd"/><text x="238" y="275">1, 2, 3</text>
    <rect x="362" y="256" width="358" height="28" fill="#f7fbff" stroke="#ddd"/><text x="372" y="275" fill="#2f5223">10 == 第一组期待的 10 → 收尾成功</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="296" width="680" height="118" rx="9" fill="#ffffff" stroke="#888" stroke-width="1.2"/>
    <text x="56" y="320" font-size="13" font-weight="bold" fill="#2b2b2b">其它 3 种初始归属都走不通（这正是要枚举的原因）</text>
    <text x="56" y="344" font-size="12.5" fill="#2b2b2b">4,1,2 全进第一组：4,1 公差 −3、1,2 公差 +1，自相矛盾；4,1 进第一组而 2 进第二组：第一组期待 −2，</text>
    <text x="56" y="366" font-size="12.5" fill="#2b2b2b">7 只能进第二组（公差 5，期待 12），到 3 就两边都不匹配；4,2 进第一组（期待 0）同理在 3 处卡死。</text>
    <text x="56" y="390" font-size="12.5" fill="#2f5223">成功分支输出「1 2 3」与「4 7 10」；两条的先后顺序任意，题面说明多解，所以用 checker 只验合法性。</text>
  </g>

  <text x="380" y="424" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">官方样例输出正是 1 2 3 与 4 7 10（本程序可能把两条的顺序写反，同样合法）。</text>
</svg>
