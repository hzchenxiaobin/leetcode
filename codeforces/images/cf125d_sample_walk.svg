<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="37"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="760" height="430" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 6 个元素：4 1 2 7 3 10 的扫描过程</text>
  <path d="M 190 42 Q 380 50 570 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 表头 -->
  <g filter="url(#rough2)" font-size="12.5">
    <rect x="40" y="60" width="56" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.1"/>
    <text x="68" y="80" text-anchor="middle" font-weight="bold" fill="#2f4a66">元素</text>
    <rect x="100" y="60" width="210" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.1"/>
    <text x="205" y="80" text-anchor="middle" font-weight="bold" fill="#2f4a66">锁定条（末项 L, 公差 d）</text>
    <rect x="314" y="60" width="150" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.1"/>
    <text x="389" y="80" text-anchor="middle" font-weight="bold" fill="#2f4a66">弹性条</text>
    <rect x="468" y="60" width="252" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.1"/>
    <text x="594" y="80" text-anchor="middle" font-weight="bold" fill="#2f4a66">动作</text>
  </g>

  <g filter="url(#rough2)" font-size="12.5" font-family="'Courier New',monospace">
    <rect x="40" y="96" width="56" height="28" fill="#ffffff" stroke="#ddd"/><text x="68" y="115" text-anchor="middle">4</text>
    <rect x="100" y="96" width="210" height="28" fill="#ffffff" stroke="#ddd"/><text x="110" y="115">— 尚未锁定</text>
    <rect x="314" y="96" width="150" height="28" fill="#ffffff" stroke="#ddd"/><text x="324" y="115">[]</text>
    <rect x="468" y="96" width="252" height="28" fill="#ffffff" stroke="#ddd"/><text x="478" y="115" fill="#555">4 进第一条（名义第 1 项）</text>

    <rect x="40" y="128" width="56" height="28" fill="#f7fbff" stroke="#ddd"/><text x="68" y="147" text-anchor="middle">1</text>
    <rect x="100" y="128" width="210" height="28" fill="#f7fbff" stroke="#ddd"/><text x="110" y="147">— 尚未锁定</text>
    <rect x="314" y="128" width="150" height="28" fill="#f7fbff" stroke="#ddd"/><text x="324" y="147">[1]</text>
    <rect x="468" y="128" width="252" height="28" fill="#f7fbff" stroke="#ddd"/><text x="478" y="147" fill="#555">1 进第二条</text>

    <rect x="40" y="160" width="56" height="28" fill="#ffffff" stroke="#ddd"/><text x="68" y="179" text-anchor="middle">2</text>
    <rect x="100" y="160" width="210" height="28" fill="#ffffff" stroke="#ddd"/><text x="110" y="179">(4, d = −2)</text>
    <rect x="314" y="160" width="150" height="28" fill="#ffffff" stroke="#ddd"/><text x="324" y="179">[1]</text>
    <rect x="468" y="160" width="252" height="28" fill="#ffffff" stroke="#ddd"/><text x="478" y="179" fill="#2f5223">2 给第一条 → 公差 −2 锁定</text>

    <rect x="40" y="192" width="56" height="28" fill="#f7fbff" stroke="#ddd"/><text x="68" y="211" text-anchor="middle">7</text>
    <rect x="100" y="192" width="210" height="28" fill="#f7fbff" stroke="#ddd"/><text x="110" y="211">(2, −2) 期待 0</text>
    <rect x="314" y="192" width="150" height="28" fill="#f7fbff" stroke="#ddd"/><text x="324" y="211">[1]</text>
    <rect x="468" y="192" width="252" height="28" fill="#f7fbff" stroke="#ddd"/><text x="478" y="211" fill="#b85450">7 ≠ 0，只能给第二条</text>

    <rect x="40" y="224" width="56" height="28" fill="#ffffff" stroke="#ddd"/><text x="68" y="243" text-anchor="middle">3</text>
    <rect x="100" y="224" width="210" height="28" fill="#ffffff" stroke="#ddd"/><text x="110" y="243">(2, −2) 期待 0</text>
    <rect x="314" y="224" width="150" height="28" fill="#ffffff" stroke="#ddd"/><text x="324" y="243">[1, 7] → d = 6</text>
    <rect x="468" y="224" width="252" height="28" fill="#ffffff" stroke="#ddd"/><text x="478" y="243" fill="#2f5223">3 给第二条，第二条也锁定</text>

    <rect x="40" y="256" width="56" height="28" fill="#f7fbff" stroke="#ddd"/><text x="68" y="275" text-anchor="middle">10</text>
    <rect x="100" y="256" width="210" height="28" fill="#f7fbff" stroke="#ddd"/><text x="110" y="275">(2, −2) 期待 0</text>
    <rect x="314" y="256" width="150" height="28" fill="#f7fbff" stroke="#ddd"/><text x="324" y="275">(3, d = 6) 期待 9</text>
    <rect x="468" y="256" width="252" height="28" fill="#f7fbff" stroke="#ddd"/><text x="478" y="275" fill="#8b3a37">10 ≠ 0、≠ 9 → 此分支失败</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="296" width="680" height="118" rx="9" fill="#ffffff" stroke="#888" stroke-width="1.2"/>
    <text x="56" y="320" font-size="13" font-weight="bold" fill="#2b2b2b">回溯到第 3 个元素的另一种选择，就得到官方答案</text>
    <text x="56" y="344" font-size="12.5" fill="#2b2b2b">让 2 也进「另一条」而不是第一条：另一条变成 [1, 2]、公差 1；第一条停在 (4, 期待 6)。</text>
    <text x="56" y="366" font-size="12.5" fill="#2b2b2b">接着 7 → 第一条（4, 7）；3 → 第二条（1, 2, 3）；10 → 第一条（4, 7, 10）。两条都成等差。</text>
    <text x="56" y="390" font-size="12.5" fill="#2f5223">输出：1 2 3 与 4 7 10（两条的先后顺序任意，题面允许多解，用 checker 校验）。</text>
  </g>

  <text x="380" y="424" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">注意：这里「4 是第一条的第 1 项、1 是第二条的第 1 项」，前 3 个元素里第二条拿到了 2 个 → 公差被它先锁定。</text>
</svg>
