<svg xmlns="http://www.w3.org/2000/svg" width="880" height="404" viewBox="0 0 880 404"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="101"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="404" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按出现次数从小到大删掉整个字母类</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">删得越便宜越好：先把次数最少的字母整体删掉</text>
  <text x="110" y="130" text-anchor="end" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">c</text>
  <g filter="url(#rough2)"><rect x="140" y="108" width="34" height="30" rx="3" fill="#d7ecd0" fill-opacity="0.7" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="196" y="130" text-anchor="start" font-size="12" fill="#555555" filter="url(#rough2)">=1 个</text>
  <text x="110" y="182" text-anchor="end" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">b</text>
  <g filter="url(#rough2)"><rect x="140" y="160" width="34" height="30" rx="3" fill="#f6e3c4" fill-opacity="0.7" stroke="#8899aa" stroke-width="1.2"/></g>
  <g filter="url(#rough2)"><rect x="184" y="160" width="34" height="30" rx="3" fill="#f6e3c4" fill-opacity="0.7" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="240" y="182" text-anchor="start" font-size="12" fill="#555555" filter="url(#rough2)">=2 个</text>
  <text x="110" y="234" text-anchor="end" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">a</text>
  <g filter="url(#rough2)"><rect x="140" y="212" width="34" height="30" rx="3" fill="#f6d9d7" fill-opacity="0.7" stroke="#8899aa" stroke-width="1.2"/></g>
  <g filter="url(#rough2)"><rect x="184" y="212" width="34" height="30" rx="3" fill="#f6d9d7" fill-opacity="0.7" stroke="#8899aa" stroke-width="1.2"/></g>
  <g filter="url(#rough2)"><rect x="228" y="212" width="34" height="30" rx="3" fill="#f6d9d7" fill-opacity="0.7" stroke="#8899aa" stroke-width="1.2"/></g>
  <g filter="url(#rough2)"><rect x="272" y="212" width="34" height="30" rx="3" fill="#f6d9d7" fill-opacity="0.7" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="328" y="234" text-anchor="start" font-size="12" fill="#555555" filter="url(#rough2)">=4 个</text>
  <text x="440" y="300" text-anchor="middle" font-size="12" fill="#3d6b2f" filter="url(#rough2)">k = 4：先删 c（花 1，剩 3），再删 b（花 2，剩 1），a 有 4 个删不起 → 答案 m = 1</text>
  <text x="440" y="330" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">结论：把各字母出现次数升序排序，能整体删就整体删，预算用尽即停</text>
  <text x="440" y="360" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">剩下的字符串 = 原串把被删字母全部滤掉（保持相对顺序，天然是子序列）</text>
</svg>
