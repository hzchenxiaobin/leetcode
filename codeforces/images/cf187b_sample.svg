<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="215"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">187B 样例 1：f 的逐层结果</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="80.0" y="100.0" text-anchor="start" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">f[0]=g</text>
  <text x="230.0" y="100.0" text-anchor="start" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">f[1]</text>
  <text x="330.0" y="100.0" text-anchor="start" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">f[2]</text>
  <text x="470.0" y="100.0" text-anchor="start" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">查询</text>
  <text x="600.0" y="100.0" text-anchor="start" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">答案</text>
  <text x="80.0" y="140.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">1→4: 5</text>
  <text x="230.0" y="140.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="330.0" y="140.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="470.0" y="140.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">1 4 2</text>
  <text x="600.0" y="140.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="80.0" y="190.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">2→4: 3</text>
  <text x="230.0" y="190.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">—</text>
  <text x="330.0" y="190.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">—</text>
  <text x="470.0" y="190.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">1 4 1</text>
  <text x="600.0" y="190.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="80.0" y="240.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">1→3: 3</text>
  <text x="230.0" y="240.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">—</text>
  <text x="330.0" y="240.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">—</text>
  <text x="470.0" y="240.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">1 4 3</text>
  <text x="600.0" y="240.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="70.0" y="290.0" text-anchor="start" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">两次换车可走 1→2（车1）、2→3（车2）、3→4（车1）= 1+1+1 = 3</text>
  <rect x="60.0" y="320.0" width="600.0" height="50.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="74.0" y="343.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">一次换车：min(1→2 车1 + 2→4 车2, …) = 4</text>
</svg>
