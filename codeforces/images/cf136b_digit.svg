<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1363"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="700" height="300" fill="#fafafa"/>
  <text x="350.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">三进制逐位取模</text>
  <path d="M 112.0 42 Q 350.0 48 588.0 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="350.0" y="286" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">b_i = (c_i − a_i) mod 3</text>
  <text x="350" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#335478" filter="url(#rough2)">a = 0112₃   c = 1021₃</text>
  <rect x="120" y="110" width="460" height="60" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="350" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">b = 1212₃ = 50₁₀</text>
  <text x="350" y="210" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">高位补 0 不改变数值 ⇒ 最小解不做多余高位</text>
  <text x="350" y="245" text-anchor="middle" font-size="11.5" fill="#8c2f2c" filter="url(#rough2)">取模要写成 (cc − ca + 3) % 3</text>
</svg>
