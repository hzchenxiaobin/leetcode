<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="109"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="400" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">换到 (u, v) = (x+y, x−y)：坏格变成两组平行线</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">每一步让 u、v 各变 ±1（对角步）；u≡0 (mod 2a) 或 v≡0 (mod 2b) 即坏格</text>
  <g filter="url(#rough2)"><rect x="40" y="84" width="380" height="280" rx="6" fill="#ffffff" fill-opacity="0.35" stroke="#cccccc" stroke-width="1.4" stroke-dasharray="5 4"/></g>
  <g filter="url(#rough2)"><line x1="90" y1="100" x2="90" y2="350" stroke="#446688" stroke-width="1.3" stroke-dasharray="6 4"/></g>
  <text x="90" y="366" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">u=0a</text>
  <g filter="url(#rough2)"><line x1="180" y1="100" x2="180" y2="350" stroke="#446688" stroke-width="1.3" stroke-dasharray="6 4"/></g>
  <text x="180" y="366" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">u=2a</text>
  <g filter="url(#rough2)"><line x1="270" y1="100" x2="270" y2="350" stroke="#446688" stroke-width="1.3" stroke-dasharray="6 4"/></g>
  <text x="270" y="366" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">u=4a</text>
  <g filter="url(#rough2)"><line x1="360" y1="100" x2="360" y2="350" stroke="#446688" stroke-width="1.3" stroke-dasharray="6 4"/></g>
  <text x="360" y="366" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">u=6a</text>
  <g filter="url(#rough2)"><line x1="60" y1="120" x2="400" y2="120" stroke="#b06a1e" stroke-width="1.3" stroke-dasharray="6 4"/></g>
  <text x="46" y="124" text-anchor="end" font-size="9.5" fill="#b06a1e" filter="url(#rough2)">v=0b</text>
  <g filter="url(#rough2)"><line x1="60" y1="190" x2="400" y2="190" stroke="#b06a1e" stroke-width="1.3" stroke-dasharray="6 4"/></g>
  <text x="46" y="194" text-anchor="end" font-size="9.5" fill="#b06a1e" filter="url(#rough2)">v=2b</text>
  <g filter="url(#rough2)"><line x1="60" y1="260" x2="400" y2="260" stroke="#b06a1e" stroke-width="1.3" stroke-dasharray="6 4"/></g>
  <text x="46" y="264" text-anchor="end" font-size="9.5" fill="#b06a1e" filter="url(#rough2)">v=4b</text>
  <g filter="url(#rough2)"><line x1="60" y1="330" x2="400" y2="330" stroke="#b06a1e" stroke-width="1.3" stroke-dasharray="6 4"/></g>
  <text x="46" y="334" text-anchor="end" font-size="9.5" fill="#b06a1e" filter="url(#rough2)">v=6b</text>
  <g filter="url(#rough2)"><circle cx="240" cy="260" r="9" fill="#f3d9d6" fill-opacity="0.9" stroke="#8a2b28" stroke-width="1.5"/></g>
  <text x="240" y="292" text-anchor="middle" font-size="10.5" fill="#8a2b28" filter="url(#rough2)">起点</text>
  <g filter="url(#rough2)"><circle cx="330" cy="150" r="9" fill="#f3d9d6" fill-opacity="0.9" stroke="#8a2b28" stroke-width="1.5"/></g>
  <text x="330" y="132" text-anchor="middle" font-size="10.5" fill="#8a2b28" filter="url(#rough2)">终点</text>
  <text x="230" y="80" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">u、v 平面（虚线 = 坏线）</text>
  <g filter="url(#rough2)"><rect x="450" y="84" width="410" height="280" rx="6" fill="#ffffff" fill-opacity="0.35" stroke="#cccccc" stroke-width="1.4" stroke-dasharray="5 4"/></g>
  <text x="655" y="110" text-anchor="middle" font-size="15" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">答案 = max(c₁, c₂)</text>
  <text x="470" y="140" text-anchor="start" font-size="11.5" fill="#446688" filter="url(#rough2)">c₁ = (u₁, u₂) 之间 2a 的倍数个数</text>
  <text x="470" y="164" text-anchor="start" font-size="11.5" fill="#b06a1e" filter="url(#rough2)">c₂ = (v₁, v₂) 之间 2b 的倍数个数</text>
  <text x="470" y="196" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">下界：u 每步 ±1，必然依次经过</text>
  <text x="470" y="218" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">中间的每个整数值 ⇒ 每条 u 线都要踩一次</text>
  <text x="470" y="240" text-anchor="start" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">⇒ 坏格数 ≥ c₁，同理 ≥ c₂</text>
  <text x="470" y="268" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">上界：交点 (2ai, 2bj) 是合法格子，</text>
  <text x="470" y="290" text-anchor="start" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">两条线可以在同一个格子上一起跨过</text>
  <text x="470" y="320" text-anchor="start" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">⇒ 多出来的只是 max，不是 c₁+c₂</text>
  <text x="450" y="388" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">计数时必须向下取整（坐标可负），C++ 的 / 是向零截断</text>
</svg>
