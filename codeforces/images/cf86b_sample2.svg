  <text x="416" y="104" text-anchor="start" font-size="12" fill="#2f4a66" filter="url(#rough2)">“1”块：(0,0),(1,0),(1,1) → 3 格</text>
  <text x="416" y="128" text-anchor="start" font-size="12" fill="#2f4a66" filter="url(#rough2)">“0”块 A：(0,2),(1,2) → 2 格</text>
  <text x="416" y="152" text-anchor="start" font-size="12" fill="#2f4a66" filter="url(#rough2)">“0”块 B：(2,0),(2,1) → 2 格</text>
  <text x="416" y="176" text-anchor="start" font-size="12" fill="#2f4a66" filter="url(#rough2)">三块都是连通的，且互不相邻</text>
  <rect x="400" y="212" width="320" height="88" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="416" y="236" text-anchor="start" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">同数字但不相邻的两块是允许的：</text>
  <text x="416" y="258" text-anchor="start" font-size="12" fill="#8a6015" filter="url(#rough2)">判分只看“同数字的极大连通块”，所以</text>
  <text x="416" y="280" text-anchor="start" font-size="12" fill="#8a6015" filter="url(#rough2)">不相邻的块可以复用同一个数字。</text>
  <text x="60" y="320" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">骨架块的配对过程：① (1,0)-(1,1) 横配；② (0,2)-(1,2) 竖配、(2,0)-(2,1) 横配（在①里已配）；</text>
  <text x="60" y="344" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">③ 剩下的 (0,0) 四邻里 (1,0) 已在骨牌上 → 挂到该块，于是它变成 3 格。</text>
