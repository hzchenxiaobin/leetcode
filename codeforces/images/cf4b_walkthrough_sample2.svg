<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="53"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="a4warr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2 走查：两天，总和凑到 5</text>
  <path d="M 150 44 Q 360 50 570 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="360" y="64" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">d = 2，sumTime = 5；第 1 天 [0,1]，第 2 天 [3,5]</text>

  <!-- 卡片 1 -->
  <rect x="24" y="80" width="200" height="196" rx="10" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="40" y="108" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">① 全部取下界</text>
  <text x="124" y="160" text-anchor="middle" font-size="23" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">0 , 3</text>
  <text x="124" y="190" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">sum = 0 + 3 = 3</text>
  <rect x="40" y="206" width="168" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="124" y="226" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">rest = 5 - 3 = 2</text>
  <text x="124" y="258" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">与 sumTime 还差 2</text>

  <line x1="228" y1="178" x2="254" y2="178" stroke="#446688" stroke-width="1.8" marker-end="url(#a4warr)" filter="url(#rough2)"/>

  <!-- 卡片 2 -->
  <rect x="260" y="80" width="200" height="196" rx="10" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="276" y="108" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">② 第 1 天最多加 1</text>
  <text x="360" y="160" text-anchor="middle" font-size="23" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">1 , 3</text>
  <text x="360" y="190" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">sum = 1 + 3 = 4</text>
  <rect x="276" y="206" width="168" height="30" rx="6" fill="#fff4d6" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="360" y="226" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">rest = 2 - 1 = 1</text>
  <text x="360" y="258" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">加满第 1 天，还差 1</text>

  <line x1="464" y1="178" x2="490" y2="178" stroke="#446688" stroke-width="1.8" marker-end="url(#a4warr)" filter="url(#rough2)"/>

  <!-- 卡片 3 -->
  <rect x="496" y="80" width="200" height="196" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="512" y="108" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">③ 第 2 天只加 1</text>
  <text x="596" y="160" text-anchor="middle" font-size="23" font-weight="bold" fill="#2f5223" filter="url(#rough2)">1 , 4</text>
  <text x="596" y="190" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">sum = 1 + 4 = 5</text>
  <rect x="512" y="206" width="168" height="30" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="596" y="226" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">rest = 1 - 1 = 0</text>
  <text x="596" y="258" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">正好凑满 sumTime</text>

  <!-- 结论 -->
  <rect x="24" y="300" width="672" height="104" rx="10" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="44" y="330" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">输出：</text>
  <text x="112" y="331" font-size="14" font-weight="bold" fill="#2f5223" filter="url(#rough2)">YES</text>
  <text x="44" y="368" font-size="21" font-weight="bold" fill="#2f5223" filter="url(#rough2)">1 4</text>
  <text x="120" y="366" font-size="12" fill="#555" filter="url(#rough2)">第 1 天 1 小时、第 2 天 4 小时，合计 5</text>
  <text x="44" y="392" font-size="11.5" fill="#777" filter="url(#rough2)">特殊评测：0 5 也合法（第 1 天 0、第 2 天 5），本题输出任意一组即可。</text>
</svg>
