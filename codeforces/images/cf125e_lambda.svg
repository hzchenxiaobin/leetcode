<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="61"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr125e" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="760" height="460" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">给首都边加 λ：最优首都边条数随 λ 单调左移，f 是凸的</text>
  <path d="M 120 42 Q 380 50 640 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 坐标轴 -->
  <g filter="url(#rough2)">
    <line x1="100" y1="360" x2="620" y2="360" stroke="#555" stroke-width="1.5" marker-end="url(#arr125e)"/>
    <line x1="100" y1="360" x2="100" y2="90" stroke="#555" stroke-width="1.5" marker-end="url(#arr125e)"/>
    <text x="628" y="366" font-size="13" fill="#555">首都边条数 c</text>
    <text x="70" y="96" font-size="13" fill="#555">总长</text>
  </g>

  <!-- 凸折线：点 (1,300) (2,240) (3,200) (4,180) -->
  <polyline points="190,300 300,240 410,200 520,180" fill="none" stroke="#446688" stroke-width="2.4" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <circle cx="190" cy="300" r="5" fill="#446688"/>
    <circle cx="300" cy="240" r="5" fill="#446688"/>
    <circle cx="410" cy="200" r="5" fill="#b85450"/>
    <circle cx="520" cy="180" r="5" fill="#446688"/>
    <text x="190" y="326" text-anchor="middle" font-size="12.5" fill="#2b2b2b">c = 1</text>
    <text x="300" y="326" text-anchor="middle" font-size="12.5" fill="#2b2b2b">c = 2 (k)</text>
    <text x="410" y="326" text-anchor="middle" font-size="12.5" fill="#2b2b2b">c = 3</text>
    <text x="520" y="326" text-anchor="middle" font-size="12.5" fill="#2b2b2b">c = 4</text>
  </g>
  <text x="188" y="286" font-size="12" fill="#2f4a66" filter="url(#rough2)">f(1)</text>
  <text x="300" y="226" font-size="12" fill="#8b3a37" filter="url(#rough2)">f(2)</text>
  <text x="412" y="186" font-size="12" fill="#2f4a66" filter="url(#rough2)">f(3)</text>
  <text x="524" y="166" font-size="12" fill="#2f4a66" filter="url(#rough2)">f(4)</text>

  <!-- 切线 -->
  <line x1="150" y1="290" x2="470" y2="147" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="150" y="280" font-size="12.5" fill="#8a6015" filter="url(#rough2)">斜率 −λ</text>
  <text x="380" y="140" font-size="12.5" fill="#8a6015" filter="url(#rough2)">切点 c = k 就是答案</text>

  <!-- 说明 -->
  <g filter="url(#rough2)">
    <rect x="430" y="72" width="300" height="100" rx="9" fill="#ffffff" stroke="#888" stroke-width="1.2"/>
    <text x="446" y="96" font-size="12.5" font-weight="bold" fill="#2b2b2b">拉格朗日松弛</text>
    <text x="446" y="118" font-size="12" fill="#2b2b2b">W(e) = w(e) + λ·[e 是首都边]</text>
    <text x="446" y="140" font-size="12" fill="#2b2b2b">Kruskal 求的是 min (f(c) + λc)，</text>
    <text x="446" y="160" font-size="12" fill="#2b2b2b">即切线上最高的那个顶点。</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="386" width="660" height="60" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <text x="76" y="410" font-size="12.5" fill="#8a6015">λ 变大 → 首都边变贵 → 最优点左移（条数变少）；λ 变小甚至为负 → 奖励首都边 → 最优点右移。</text>
    <text x="76" y="432" font-size="12.5" fill="#8a6015">所以「最优条数 ≥ k」对 λ 单调，可以二分出分界点 λ0，此时 k 必落在同权方案的可达区间里。</text>
  </g>
</svg>
