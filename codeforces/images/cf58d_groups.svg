<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="587"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="340" fill="#fafafa"/>
  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每行长度 L 固定 → 配对的两个名字长度之和固定为 T = L − 1</text>
  <path d="M 60 40 Q 380 48 700 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <text x="40" y="74" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按名字长度分组（样例 1：b a a h g c）</text>
  <g font-size="11">
    <rect x="40" y="86" width="110" height="86" rx="8" fill="#cfe0f5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="95" y="106" text-anchor="middle" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">长度 1</text>
    <text x="95" y="128" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">b</text>
    <text x="95" y="146" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">c</text>
    <text x="95" y="164" text-anchor="middle" font-size="9.5" fill="#555555" filter="url(#rough2)">已排序</text>

    <rect x="40" y="188" width="110" height="86" rx="8" fill="#d9ecd4" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="95" y="208" text-anchor="middle" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">长度 2</text>
    <text x="95" y="230" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">aa</text>
    <text x="95" y="248" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">hg</text>
    <text x="95" y="266" text-anchor="middle" font-size="9.5" fill="#555555" filter="url(#rough2)">aa &lt; hg</text>
  </g>

  <text x="180" y="120" font-size="11" fill="#2b2b2b" filter="url(#rough2)">L = (6 + 2) / 2 = 4</text>
  <text x="180" y="140" font-size="11" fill="#8a2b28" filter="url(#rough2)">T = L − 1 = 3</text>
  <text x="180" y="160" font-size="10.5" fill="#555555" filter="url(#rough2)">每个 1 长度的名字 → 必须配 2 长度的名字</text>
  <text x="180" y="240" font-size="10.5" fill="#555555" filter="url(#rough2)">排序后一一对应：</text>
  <text x="180" y="258" font-size="10.5" fill="#555555" filter="url(#rough2)">第 i 小配第 i 小</text>

  <path d="M 152 108 L 340 108" stroke="#446688" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 152 126 L 340 126" stroke="#446688" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 152 228 L 340 228" stroke="#446688" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 152 246 L 340 246" stroke="#446688" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <rect x="350" y="86" width="370" height="188" rx="10" fill="#fbe3c8" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="366" y="110" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">配对规则</text>
  <text x="366" y="134" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">① 长度 l 与 T − l 互补：两组排序后按顺序配对</text>
  <text x="366" y="154" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">（最小配最小、次小配次小……）；</text>
  <text x="366" y="178" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">② 长度相同（l = T − l）时，在同一组内</text>
  <text x="366" y="198" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">相邻两两配对（最小两个、次小两个……）；</text>
  <text x="366" y="222" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">③ 每组内部的配对互不影响，最后把所有行</text>
  <text x="366" y="242" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">按字典序排序输出即可。</text>
  <text x="366" y="264" font-size="10" fill="#8a2b28" filter="url(#rough2)">这样每一行都提前用到最"小"的名字，整行序列最小。</text>

  <text x="40" y="304" font-size="10.8" fill="#555555" filter="url(#rough2)">保证可构造 ⇒ 对每个 l，长度 T−l 组的大小必须与长度 l 组相同（l = T−l 时组大小为偶数）。</text>
  <text x="40" y="324" font-size="10.8" fill="#555555" filter="url(#rough2)">长度不同的名字不可能是前缀关系；长度相同的名字也不会互为前缀——这会让后面的取向与交换论证变简单。</text>
</svg>
