<svg xmlns="http://www.w3.org/2000/svg" width="730" height="300" viewBox="0 0 730 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="730" height="300" fill="#fafafa"/>
  <text x="365.0" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">212E：样例二的 6 个答案对</text>
  <path d="M 146.00 46 Q 365.0 52 584.00 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60" y="78" width="290" height="132" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="95" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">u=4：三块大小 3,3,3 → 子集和 3,6,9</text>
  <text x="74" y="116" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">⇒ (3,6),(6,3)</text>
  <text x="74" y="137" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">u=3：三块 1,1,7 → 子集和 1,2,7,8,9</text>
  <text x="74" y="158" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">⇒ (1,8),(2,7),(7,2),(8,1)</text>
  <rect x="380" y="78" width="290" height="110" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="394" y="95" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">合计 6 对，与样例输出一致</text>
  <text x="394" y="116" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">（按第一分量升序）</text>
  <text x="394" y="137" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">注意 (0,9)、(9,0) 非法：两边都要非空。</text>
  <text x="60" y="200" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">对称性：若 (a,b) 可行则 (b,a) 也可行（交换两家公司）。</text>
</svg>
