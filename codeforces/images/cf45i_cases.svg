<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="281"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="320" fill="#fafafa"/>
  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">三类数字：正数全选、负数成对、0 只作退路</text>
  <path d="M 140 40 Q 380 46 620 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="70" y="90" width="200" height="110" rx="12" fill="#d9ecd4" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="170" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">正数</text>
  <text x="170" y="165" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">全选</text>
  <rect x="300" y="90" width="200" height="110" rx="12" fill="#cfe0f5" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="400" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">负数</text>
  <text x="400" y="165" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">成对选，奇数个踢最接近 0 的</text>
  <rect x="530" y="90" width="200" height="110" rx="12" fill="#fbe3c8" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="630" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="630" y="165" text-anchor="middle" font-size="11" fill="#333333" filter="url(#rough2)">只有退路才用</text>
  <text x="60" y="250" font-size="12" fill="#2b2b2b" filter="url(#rough2)">选择集合为空时（没有正数、负数不足两个）只能选一个元素：整个数组的最大值。</text>
  <text x="60" y="282" font-size="11.5" fill="#8a6015" filter="url(#rough2)">例：[-5] → -5；[-1,0] → 0；[1,1,-3] → 1 1。</text>

</svg>
