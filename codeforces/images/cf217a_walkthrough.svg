<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="760" height="450" fill="#fafafa"/>
  <text x="380" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例走查：(1,1) (2,2) (3,3) 需要补 2 个</text>
  <text x="380" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">原图 3 个连通块 → 答案 3 − 1 = 2；构造上只需把三块串成一条链</text>
  <g filter="url(#rough2)"><line x1="104" y1="390" x2="442" y2="390" stroke="#999999" stroke-width="1.2" marker-end="url(#arrb)"/></g>
  <g filter="url(#rough2)"><line x1="130" y1="416" x2="130" y2="78" stroke="#999999" stroke-width="1.2" marker-end="url(#arrb)"/></g>
  <text x="446" y="395" text-anchor="start" font-size="13" fill="#777777" filter="url(#rough2)">x</text>
  <text x="114" y="72" text-anchor="start" font-size="13" fill="#777777" filter="url(#rough2)">y</text>
  <text x="208" y="410" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">1</text>
  <text x="114" y="317" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><line x1="208" y1="386" x2="208" y2="394" stroke="#bbbbbb" stroke-width="1"/></g>
  <g filter="url(#rough2)"><line x1="126" y1="312" x2="134" y2="312" stroke="#bbbbbb" stroke-width="1"/></g>
  <text x="286" y="410" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">2</text>
  <text x="114" y="239" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><line x1="286" y1="386" x2="286" y2="394" stroke="#bbbbbb" stroke-width="1"/></g>
  <g filter="url(#rough2)"><line x1="126" y1="234" x2="134" y2="234" stroke="#bbbbbb" stroke-width="1"/></g>
  <text x="364" y="410" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">3</text>
  <text x="114" y="161" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><line x1="364" y1="386" x2="364" y2="394" stroke="#bbbbbb" stroke-width="1"/></g>
  <g filter="url(#rough2)"><line x1="126" y1="156" x2="134" y2="156" stroke="#bbbbbb" stroke-width="1"/></g>
  <g filter="url(#rough2)"><circle cx="208" cy="312" r="13" fill="#d7ecd0" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="226" y="302" text-anchor="start" font-size="12" fill="#3d6b2f" filter="url(#rough2)">(1,1)</text>
  <g filter="url(#rough2)"><circle cx="286" cy="234" r="13" fill="#d7ecd0" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="304" y="224" text-anchor="start" font-size="12" fill="#3d6b2f" filter="url(#rough2)">(2,2)</text>
  <g filter="url(#rough2)"><circle cx="364" cy="156" r="13" fill="#d7ecd0" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="382" y="146" text-anchor="start" font-size="12" fill="#3d6b2f" filter="url(#rough2)">(3,3)</text>
  <g filter="url(#rough2)"><circle cx="208" cy="234" r="13" fill="#f6d9d7" fill-opacity="0.9" stroke="#a0522d" stroke-width="1.8"/></g>
  <text x="226" y="252" text-anchor="start" font-size="12" fill="#a0522d" filter="url(#rough2)">(1,2) 新增①</text>
  <g filter="url(#rough2)"><circle cx="208" cy="156" r="13" fill="#f6d9d7" fill-opacity="0.9" stroke="#a0522d" stroke-width="1.8"/></g>
  <text x="226" y="174" text-anchor="start" font-size="12" fill="#a0522d" filter="url(#rough2)">(1,3) 新增②</text>
  <g filter="url(#rough2)"><line x1="208" y1="312" x2="208" y2="234" stroke="#a0522d" stroke-width="1.2" stroke-dasharray="4 4"/></g>
  <g filter="url(#rough2)"><line x1="208" y1="234" x2="208" y2="156" stroke="#a0522d" stroke-width="1.2" stroke-dasharray="4 4"/></g>
  <text x="450" y="130" text-anchor="start" font-size="12.5" fill="#555555" filter="url(#rough2)">新增① 与 (1,1) 同 x、与 (2,2) 同 y</text>
  <text x="450" y="156" text-anchor="start" font-size="12.5" fill="#555555" filter="url(#rough2)">新增② 与新增① 同 x、与 (3,3) 同 y</text>
  <text x="450" y="190" text-anchor="start" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">两块新点串起三个块 ⇒ 2 个足够</text>
  <text x="450" y="216" text-anchor="start" font-size="12.5" fill="#8a4b2a" filter="url(#rough2)">下界：每点至多合并两块 ⇒ 至少 2 个</text>
  <g filter="url(#rough2)"><rect x="300" y="250" width="420" height="96" rx="4" fill="#faf3ec" fill-opacity="0.85" stroke="#c8a48a" stroke-width="1.3"/></g>
  <text x="510" y="276" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a4b2a" filter="url(#rough2)">为什么不能只用 1 个新点？</text>
  <text x="510" y="300" text-anchor="middle" font-size="11.8" fill="#555555" filter="url(#rough2)">一个点 p 的行列只能各命中一个块，最多覆盖 2 个块；</text>
  <text x="510" y="322" text-anchor="middle" font-size="11.8" fill="#555555" filter="url(#rough2)">而这里 3 个块两两既不同行也不同列，p 无法同时碰到 3 块。</text>
</svg>
