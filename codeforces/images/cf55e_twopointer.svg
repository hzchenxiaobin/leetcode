  <text x="436" y="146" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" filter="url(#rough2)">c₀ = 3</text>
  <text x="502" y="146" font-size="10.5" font-weight="bold" fill="#4a7a3a" text-anchor="start" filter="url(#rough2)">3</text>
  <text x="564" y="146" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" filter="url(#rough2)">c₁ = 4</text>
  <text x="630" y="146" font-size="10.5" font-weight="bold" fill="#4a7a3a" text-anchor="start" filter="url(#rough2)">6</text>
  <text x="436" y="180" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" filter="url(#rough2)">c₂ = 4</text>
  <text x="502" y="180" font-size="10.5" font-weight="bold" fill="#4a7a3a" text-anchor="start" filter="url(#rough2)">6</text>
  <text x="564" y="180" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" filter="url(#rough2)">c₃ = 3</text>
  <text x="630" y="180" font-size="10.5" font-weight="bold" fill="#4a7a3a" text-anchor="start" filter="url(#rough2)">3</text>
  <text x="436" y="214" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" filter="url(#rough2)">c₄ = 4</text>
  <text x="502" y="214" font-size="10.5" font-weight="bold" fill="#4a7a3a" text-anchor="start" filter="url(#rough2)">6</text>
  <text x="564" y="214" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" filter="url(#rough2)">c₅ = 3</text>
  <text x="630" y="214" font-size="10.5" font-weight="bold" fill="#4a7a3a" text-anchor="start" filter="url(#rough2)">3</text>
  <text x="436" y="248" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" filter="url(#rough2)">c₆ = 4</text>
  <text x="502" y="248" font-size="10.5" font-weight="bold" fill="#4a7a3a" text-anchor="start" filter="url(#rough2)">6</text>
  <text x="564" y="248" font-size="10.5" font-weight="normal" fill="#333" text-anchor="start" filter="url(#rough2)">c₇ = 3</text>
  <text x="630" y="248" font-size="10.5" font-weight="bold" fill="#4a7a3a" text-anchor="start" filter="url(#rough2)">3</text>
  <text x="560" y="296" font-size="10" font-weight="normal" fill="#555" text-anchor="middle" filter="url(#rough2)">求和 = 36 = 不含 P 的三角形数</text>
  <text x="560" y="316" font-size="10.5" font-weight="bold" fill="#2f5223" text-anchor="middle" filter="url(#rough2)">C(8,3)=56，答案 = 20</text>
  <text x="360" y="396" font-size="10.5" font-weight="normal" fill="#666" text-anchor="middle" filter="url(#rough2)">j 只增不减：角度窗口随 i 顺时针平移，总移动 O(n)</text>
</svg>
