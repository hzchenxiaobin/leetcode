<svg xmlns="http://www.w3.org/2000/svg" width="660" height="404" viewBox="0 0 660 404" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="660" height="404" fill="#fafafa"/>

  <text x="330" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">核心模型：极长块（run）与「坏值」</text>

  <text x="40" y="100" font-size="14" fill="#666" filter="url(#rough2)">a =</text>

  <rect x="72" y="76" width="42" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="93" y="102" text-anchor="middle" font-size="17" fill="#33506b" filter="url(#rough2)">1</text>
  <rect x="118" y="76" width="42" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="139" y="102" text-anchor="middle" font-size="17" fill="#3c6130" filter="url(#rough2)">2</text>
  <rect x="164" y="76" width="42" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="185" y="102" text-anchor="middle" font-size="17" fill="#33506b" filter="url(#rough2)">1</text>
  <rect x="210" y="76" width="42" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="231" y="102" text-anchor="middle" font-size="17" fill="#8a6420" filter="url(#rough2)">3</text>
  <rect x="256" y="76" width="42" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="277" y="102" text-anchor="middle" font-size="17" fill="#33506b" filter="url(#rough2)">1</text>
  <rect x="302" y="76" width="42" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="323" y="102" text-anchor="middle" font-size="17" fill="#8f3b38" filter="url(#rough2)">4</text>

  <text x="93" y="132" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">1</text>
  <text x="139" y="132" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">2</text>
  <text x="185" y="132" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">3</text>
  <text x="231" y="132" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">4</text>
  <text x="277" y="132" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">5</text>
  <text x="323" y="132" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">6</text>

  <text x="93" y="156" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">R1</text>
  <text x="139" y="156" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">R2</text>
  <text x="185" y="156" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">R3</text>
  <text x="231" y="156" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">R4</text>
  <text x="277" y="156" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">R5</text>
  <text x="323" y="156" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">R6</text>

  <text x="384" y="92" font-size="13" fill="#333" filter="url(#rough2)">runs(1) = 3 → 坏值</text>
  <text x="384" y="116" font-size="13" fill="#333" filter="url(#rough2)">runs(2) = runs(3) = 1</text>
  <text x="384" y="140" font-size="13" fill="#333" filter="url(#rough2)">runs(4) = 1</text>
  <text x="384" y="164" font-size="12" fill="#888" filter="url(#rough2)">6 个块，只有 4 个不同值</text>

  <rect x="40" y="180" width="272" height="92" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="176" y="208" text-anchor="middle" font-size="14" fill="#33506b" filter="url(#rough2)">排好 ⟺ 每个值恰有一个块</text>
  <text x="176" y="232" text-anchor="middle" font-size="14" fill="#33506b" filter="url(#rough2)">⟺ 块数 = 不同值数</text>
  <text x="176" y="258" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">这里 6 ≠ 4，所以没排好</text>

  <rect x="336" y="180" width="284" height="92" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="478" y="208" text-anchor="middle" font-size="14" fill="#8f3b38" filter="url(#rough2)">一次交换只改 a[x]、a[y]</text>
  <text x="478" y="232" text-anchor="middle" font-size="14" fill="#8f3b38" filter="url(#rough2)">⇒ 只影响两个值的 runs</text>
  <text x="478" y="258" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">⇒ 坏值 ≥ 3 个时必为 NO</text>

  <rect x="40" y="288" width="580" height="60" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="314" text-anchor="middle" font-size="14" fill="#8a6420" filter="url(#rough2)">坏值 = runs(v) ≥ 2 的值（同一个值被拆成好几段）</text>
  <text x="330" y="336" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">把数组切成极长块后，只需盯住这最多两个值</text>
</svg>
