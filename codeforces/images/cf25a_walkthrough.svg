<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="720" height="300" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1：2 4 7 8 10，唯一不同的是下标 3</text>

  <g filter="url(#rough2)">
    <rect x="70" y="80" width="80" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="110" y="118" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">2</text>
    <text x="110" y="162" text-anchor="middle" font-size="12" fill="#666">下标 1</text>
    <rect x="180" y="80" width="80" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="220" y="118" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">4</text>
    <text x="220" y="162" text-anchor="middle" font-size="12" fill="#666">下标 2</text>
    <rect x="290" y="80" width="80" height="60" rx="8" fill="#fce8e6" stroke="#b85450" stroke-width="1.8"/>
    <text x="330" y="118" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">7</text>
    <text x="330" y="162" text-anchor="middle" font-size="12" fill="#666">下标 3</text>
    <rect x="400" y="80" width="80" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="440" y="118" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">8</text>
    <text x="440" y="162" text-anchor="middle" font-size="12" fill="#666">下标 4</text>
    <rect x="510" y="80" width="80" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="550" y="118" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">10</text>
    <text x="550" y="162" text-anchor="middle" font-size="12" fill="#666">下标 5</text>
  </g>
  <text x="360" y="206" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">偶数 4 个、奇数 1 个 ⇒ 少数派是奇数，即 7</text>
  <rect x="180" y="228" width="360" height="44" rx="9" fill="#fbeeee" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="256" text-anchor="middle" font-size="14" font-weight="bold" fill="#8f3b37" filter="url(#rough2)">输出 3</text>
</svg>
