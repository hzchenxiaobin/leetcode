<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="21"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="450" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1 逐步走查：4 次请求</text>
  <path d="M 210 42 Q 380 48 550 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 表头 -->
  <rect x="26" y="60" width="708" height="38" fill="#e8eef6" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="88" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">请求</text>
  <text x="248" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">处理前 db 里已有</text>
  <text x="470" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">动作</text>
  <text x="664" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">输出</text>

  <!-- 第 1 行 -->
  <rect x="26" y="98" width="708" height="64" fill="#ffffff" stroke="#9aa8b6" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="88" y="126" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">abacaba</text>
  <text x="248" y="126" text-anchor="middle" font-size="12" fill="#7a7a7a" filter="url(#rough2)">（空）</text>
  <text x="470" y="126" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">不在库 → 原样插入</text>
  <text x="664" y="126" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">OK</text>
  <text x="88" y="150" text-anchor="middle" font-size="10.5" fill="#8a6015" filter="url(#rough2)">第 1 步</text>
  <text x="470" y="150" text-anchor="middle" font-size="10.5" fill="#8a6015" filter="url(#rough2)">nxt[abacaba] 仍是 0</text>

  <!-- 第 2 行 -->
  <rect x="26" y="162" width="708" height="64" fill="#fbfbf7" stroke="#9aa8b6" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="88" y="190" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">acaba</text>
  <text x="248" y="190" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">abacaba</text>
  <text x="470" y="190" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">不在库 → 原样插入</text>
  <text x="664" y="190" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">OK</text>
  <text x="88" y="214" text-anchor="middle" font-size="10.5" fill="#8a6015" filter="url(#rough2)">第 2 步</text>
  <text x="470" y="214" text-anchor="middle" font-size="10.5" fill="#8a6015" filter="url(#rough2)">不同名字，互不影响</text>

  <!-- 第 3 行 -->
  <rect x="26" y="226" width="708" height="64" fill="#fdf3e0" stroke="#c98a2b" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="88" y="254" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">abacaba</text>
  <text x="248" y="254" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">abacaba, acaba</text>
  <text x="470" y="254" text-anchor="middle" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">在库 → 试 abacaba1，空闲</text>
  <text x="664" y="254" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">abacaba1</text>
  <text x="88" y="278" text-anchor="middle" font-size="10.5" fill="#8a6015" filter="url(#rough2)">第 3 步</text>
  <text x="470" y="278" text-anchor="middle" font-size="10.5" fill="#8a6015" filter="url(#rough2)">nxt[abacaba]: 0 → 1</text>

  <!-- 第 4 行 -->
  <rect x="26" y="290" width="708" height="64" fill="#ffffff" stroke="#9aa8b6" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="88" y="318" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">acab</text>
  <text x="248" y="318" text-anchor="middle" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">abacaba, acaba, abacaba1</text>
  <text x="470" y="318" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">不在库 → 原样插入</text>
  <text x="664" y="318" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">OK</text>
  <text x="88" y="342" text-anchor="middle" font-size="10.5" fill="#8a6015" filter="url(#rough2)">第 4 步</text>
  <text x="470" y="342" text-anchor="middle" font-size="10.5" fill="#8a6015" filter="url(#rough2)">最后一字符不同，是另一个名字</text>

  <!-- 竖线 -->
  <g filter="url(#rough2)" stroke="#9aa8b6" stroke-width="1.1">
    <line x1="150" y1="60" x2="150" y2="354"/>
    <line x1="346" y1="60" x2="346" y2="354"/>
    <line x1="594" y1="60" x2="594" y2="354"/>
  </g>

  <!-- 旁注 -->
  <text x="40" y="382" font-size="12" fill="#2b2b2b" filter="url(#rough2)">重名时编号从 1 开始逐个试，遇到第一个空位就停；本样例第 3 步才第一次真正用到编号。</text>
  <text x="40" y="408" font-size="12" fill="#8a2b28" filter="url(#rough2)">若第 5 次又请求 abacaba，游标已到 1，直接从 2 起试，回答 abacaba2（不会重发 abacaba1）。</text>
  <text x="40" y="434" font-size="11.5" fill="#7a7a7a" filter="url(#rough2)">输出 4 行：OK / OK / abacaba1 / OK，与官方样例完全一致。</text>
</svg>
