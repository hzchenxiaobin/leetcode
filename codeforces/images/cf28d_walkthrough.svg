<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="400" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="38" text-anchor="middle" font-size="18.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">28D：样例 1 的 dp 状态（K=4）</text>
  <path d="M 137 50 Q 380 56 623 50" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60" y="90" width="640" height="40" rx="7" fill="#fbfbfb" stroke="#c9c9c9" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="76" y="116" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">车1 (v=1,c=1,l=0,r=3)</text>
  <text x="360" y="116" text-anchor="middle" font-size="11.5" fill="#2f4a66" font-weight="normal" filter="url(#rough2)">p=0 → 1</text>
  <text x="480" y="116" text-anchor="start" font-size="11.5" fill="#555" font-weight="normal" filter="url(#rough2)">新增状态 (4,1) 值 1</text>
  <rect x="60" y="142" width="640" height="40" rx="7" fill="#fbfbfb" stroke="#c9c9c9" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="76" y="168" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">车2 (v=1,c=1,l=1,r=2)</text>
  <text x="360" y="168" text-anchor="middle" font-size="11.5" fill="#2f4a66" font-weight="normal" filter="url(#rough2)">p=1 → 2</text>
  <text x="480" y="168" text-anchor="start" font-size="11.5" fill="#555" font-weight="normal" filter="url(#rough2)">(4,2) 值 2</text>
  <rect x="60" y="194" width="640" height="40" rx="7" fill="#fbfbfb" stroke="#c9c9c9" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="76" y="220" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">车3 (v=1,c=1,l=2,r=1)</text>
  <text x="360" y="220" text-anchor="middle" font-size="11.5" fill="#2f4a66" font-weight="normal" filter="url(#rough2)">p=2 → 3</text>
  <text x="480" y="220" text-anchor="start" font-size="11.5" fill="#555" font-weight="normal" filter="url(#rough2)">(4,3) 值 3</text>
  <rect x="60" y="246" width="640" height="40" rx="7" fill="#fbfbfb" stroke="#c9c9c9" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="76" y="272" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">车4 (v=1,c=1,l=3,r=0)</text>
  <text x="360" y="272" text-anchor="middle" font-size="11.5" fill="#2f4a66" font-weight="normal" filter="url(#rough2)">p=3 → 4</text>
  <text x="480" y="272" text-anchor="start" font-size="11.5" fill="#555" font-weight="normal" filter="url(#rough2)">(4,4) 值 4 ✓完整</text>
  <rect x="60" y="298" width="640" height="40" rx="7" fill="#fff3e0" stroke="#c9801f" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="76" y="324" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">车5 (v=2,c=1,l=3,r=0)</text>
  <text x="360" y="324" text-anchor="middle" font-size="11.5" fill="#2f4a66" font-weight="normal" filter="url(#rough2)">p=3 → 4</text>
  <text x="480" y="324" text-anchor="start" font-size="11.5" fill="#2f5223" font-weight="normal" filter="url(#rough2)">(4,4) 值 5 ✓更优</text>
  <text x="60" y="372" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">最终答案 = 5，链 1→2→3→5（编号递增），与样例输出一致。</text>
</svg>
