<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 404" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="700" height="404" fill="#fafafa"/>

  <text x="350" y="27" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：每个节点只是一台「计数器」</text>
  <text x="350" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">收到 A 个脉冲 ⟹ 末态 = x ⊕ (A mod 2)，并向每个儿子发出 (A + x) >> 1 个</text>

  <!-- left: table for x = 1 -->
  <g>
    <rect filter="url(#rough2)" x="18" y="62" width="306" height="322" fill="#ffffff" stroke="#8899aa" stroke-width="1.3" rx="10"/>
    <text filter="url(#rough2)" x="171" y="84" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">初始状态 x = 1 的节点：逐个脉冲看</text>

    <rect filter="url(#rough2)" x="34" y="94" width="274" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <text filter="url(#rough2)" x="62" y="110" text-anchor="middle" font-size="10.5" fill="#2f4f6f">到达数 A</text>
    <text filter="url(#rough2)" x="150" y="110" text-anchor="middle" font-size="10.5" fill="#2f4f6f">末态</text>
    <text filter="url(#rough2)" x="256" y="110" text-anchor="middle" font-size="10.5" fill="#2f4f6f">累计发出</text>

    <rect filter="url(#rough2)" x="34" y="118" width="274" height="144" fill="none" stroke="#c9d4e0" stroke-width="1" rx="4"/>
    <line filter="url(#rough2)" x1="96" y1="118" x2="96" y2="262" stroke="#c9d4e0" stroke-width="1"/>
    <line filter="url(#rough2)" x1="205" y1="118" x2="205" y2="262" stroke="#c9d4e0" stroke-width="1"/>
    <line filter="url(#rough2)" x1="34" y1="142" x2="308" y2="142" stroke="#e2e8f0" stroke-width="1"/>
    <line filter="url(#rough2)" x1="34" y1="166" x2="308" y2="166" stroke="#e2e8f0" stroke-width="1"/>
    <line filter="url(#rough2)" x1="34" y1="190" x2="308" y2="190" stroke="#e2e8f0" stroke-width="1"/>
    <line filter="url(#rough2)" x1="34" y1="214" x2="308" y2="214" stroke="#e2e8f0" stroke-width="1"/>
    <line filter="url(#rough2)" x1="34" y1="238" x2="308" y2="238" stroke="#e2e8f0" stroke-width="1"/>

    <text filter="url(#rough2)" x="62" y="134" text-anchor="middle" font-size="11" fill="#333">1</text>
    <text filter="url(#rough2)" x="62" y="158" text-anchor="middle" font-size="11" fill="#333">2</text>
    <text filter="url(#rough2)" x="62" y="182" text-anchor="middle" font-size="11" fill="#333">3</text>
    <text filter="url(#rough2)" x="62" y="206" text-anchor="middle" font-size="11" fill="#333">4</text>
    <text filter="url(#rough2)" x="62" y="230" text-anchor="middle" font-size="11" fill="#333">5</text>
    <text filter="url(#rough2)" x="62" y="254" text-anchor="middle" font-size="11" fill="#333">6</text>

    <text filter="url(#rough2)" x="150" y="134" text-anchor="middle" font-size="11" fill="#b85450">0</text>
    <text filter="url(#rough2)" x="150" y="158" text-anchor="middle" font-size="11" fill="#4a7a3a">1</text>
    <text filter="url(#rough2)" x="150" y="182" text-anchor="middle" font-size="11" fill="#b85450">0</text>
    <text filter="url(#rough2)" x="150" y="206" text-anchor="middle" font-size="11" fill="#4a7a3a">1</text>
    <text filter="url(#rough2)" x="150" y="230" text-anchor="middle" font-size="11" fill="#b85450">0</text>
    <text filter="url(#rough2)" x="150" y="254" text-anchor="middle" font-size="11" fill="#4a7a3a">1</text>

    <text filter="url(#rough2)" x="256" y="134" text-anchor="middle" font-size="11" fill="#8a6a20">1</text>
    <text filter="url(#rough2)" x="256" y="158" text-anchor="middle" font-size="11" fill="#8a6a20">1</text>
    <text filter="url(#rough2)" x="256" y="182" text-anchor="middle" font-size="11" fill="#8a6a20">2</text>
    <text filter="url(#rough2)" x="256" y="206" text-anchor="middle" font-size="11" fill="#8a6a20">2</text>
    <text filter="url(#rough2)" x="256" y="230" text-anchor="middle" font-size="11" fill="#8a6a20">3</text>
    <text filter="url(#rough2)" x="256" y="254" text-anchor="middle" font-size="11" fill="#8a6a20">3</text>

    <text filter="url(#rough2)" x="171" y="286" text-anchor="middle" font-size="10.5" fill="#b85450">初始为 1：奇数次到达发送，偶数次不发送</text>
    <text filter="url(#rough2)" x="171" y="308" text-anchor="middle" font-size="10.5" fill="#4a7a3a">x = 0 时：末态 1,0,1,0，发出 0,1,1,2</text>
    <text filter="url(#rough2)" x="171" y="334" text-anchor="middle" font-size="10.5" fill="#2f4f6f">末态 = x ⊕ (A mod 2)</text>
    <text filter="url(#rough2)" x="171" y="358" text-anchor="middle" font-size="10.5" fill="#2f4f6f">发出 = (A + x) >> 1（每个儿子各一份）</text>
  </g>

  <!-- right: path recursion -->
  <g>
    <rect filter="url(#rough2)" x="334" y="62" width="348" height="322" fill="#ffffff" stroke="#8899aa" stroke-width="1.3" rx="10"/>
    <text filter="url(#rough2)" x="508" y="84" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">沿路径一路右移：每下一层除以 2</text>

    <circle filter="url(#rough2)" cx="392" cy="132" r="25" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text filter="url(#rough2)" x="392" y="137" text-anchor="middle" font-size="12" fill="#2f4f6f">v₁</text>
    <circle filter="url(#rough2)" cx="392" cy="198" r="25" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text filter="url(#rough2)" x="392" y="203" text-anchor="middle" font-size="12" fill="#2f4f6f">v₂</text>
    <circle filter="url(#rough2)" cx="392" cy="264" r="25" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text filter="url(#rough2)" x="392" y="269" text-anchor="middle" font-size="12" fill="#8a6a20">v₃</text>

    <line filter="url(#rough2)" x1="392" y1="157" x2="392" y2="171" stroke="#666" stroke-width="1.4" marker-end="url(#arr)"/>
    <line filter="url(#rough2)" x1="392" y1="223" x2="392" y2="237" stroke="#666" stroke-width="1.4" marker-end="url(#arr)"/>

    <text filter="url(#rough2)" x="432" y="130" font-size="10.5" fill="#2f4f6f">a₁ = P（注入总数）</text>
    <text filter="url(#rough2)" x="432" y="196" font-size="10.5" fill="#2f4f6f">a₂ = (P + x₁) >> 1</text>
    <text filter="url(#rough2)" x="432" y="262" font-size="10.5" fill="#2f4f6f">a₃ = (P + x₁ + 2x₂) >> 2</text>

    <text filter="url(#rough2)" x="508" y="300" text-anchor="middle" font-size="10.5" fill="#4a7a3a">统一写成 a_v = (P + C_v) >> depth(v)</text>
    <text filter="url(#rough2)" x="508" y="322" text-anchor="middle" font-size="10.5" fill="#4a7a3a">C_v = 祖先的 x 按深度拼成的二进制数（根在最低位）</text>
    <text filter="url(#rough2)" x="508" y="348" text-anchor="middle" font-size="10.5" fill="#b85450">⇒ 深度 d 的节点只看 (P + C_v) 的第 d 位</text>
    <text filter="url(#rough2)" x="508" y="370" text-anchor="middle" font-size="10.5" fill="#b85450">⇒ 整个目标化成一个整数 P 的逐位约束</text>
  </g>
</svg>
