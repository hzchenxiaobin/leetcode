<svg xmlns="http://www.w3.org/2000/svg" width="840" height="320" viewBox="0 0 840 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="320" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">倍数筛求 d(n)：对每个 i 给 i 的倍数 +1</text>
  <text x="420" y="56" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">N = a·b·c ≤ 10⁶</text>
  <g filter="url(#rough2)"><rect x="150" y="100" width="70" height="40" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="185" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="240" y="100" width="70" height="40" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="275" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="330" y="100" width="70" height="40" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="365" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="420" y="100" width="70" height="40" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="455" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><rect x="510" y="100" width="70" height="40" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="545" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <g filter="url(#rough2)"><rect x="600" y="100" width="70" height="40" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="635" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">6</text>
  <text x="420" y="170" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">i=2：d[2],d[4],d[6]… 各 +1；i=3：d[3],d[6]… 各 +1</text>
  <text x="420" y="206" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">筛后 d[n] = n 的约数个数</text>
  <g filter="url(#rough2)"><rect x="230" y="232" width="380" height="40" rx="4" fill="#f7fbf4" fill-opacity="0.85" stroke="#a8c99a" stroke-width="1.3"/></g>
  <text x="420" y="258" text-anchor="middle" font-size="12" font-weight="bold" fill="#3d6b2f" filter="url(#rough2)">三重循环累加 d[ijk]，模 2³⁰</text>
  <text x="420" y="300" text-anchor="middle" font-size="11" fill="#777777" filter="url(#rough2)">O(N log N + abc) ≈ 1.4×10⁷</text>
</svg>
