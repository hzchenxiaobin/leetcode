<svg xmlns="http://www.w3.org/2000/svg" width="720" height="410" viewBox="0 0 720 410"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="37"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="410" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">约数个数筛：i 整除 n，就给 d[n] 加 1</text>
  <path d="M 130 42 Q 360 48 590 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 表头 -->
  <text x="96" y="86" text-anchor="end" font-size="11.5" fill="#555" filter="url(#rough2)">n =</text>
  <text x="130" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="182" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="234" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="286" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="338" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <text x="390" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">6</text>
  <text x="442" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">7</text>
  <text x="494" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">8</text>

  <!-- 行 i=1..4 -->
  <text x="96" y="126" text-anchor="end" font-size="11.5" fill="#555" filter="url(#rough2)">i = 1</text>
  <text x="96" y="166" text-anchor="end" font-size="11.5" fill="#555" filter="url(#rough2)">i = 2</text>
  <text x="96" y="206" text-anchor="end" font-size="11.5" fill="#555" filter="url(#rough2)">i = 3</text>
  <text x="96" y="246" text-anchor="end" font-size="11.5" fill="#555" filter="url(#rough2)">i = 4</text>

  <g filter="url(#rough2)">
    <rect x="110" y="104" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="162" y="104" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="214" y="104" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="266" y="104" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="318" y="104" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="370" y="104" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="422" y="104" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="474" y="104" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>

    <rect x="162" y="144" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="266" y="144" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="370" y="144" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="474" y="144" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>

    <rect x="214" y="184" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="370" y="184" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>

    <rect x="266" y="224" width="44" height="28" fill="#fde8e8" stroke="#b85450" stroke-width="1.2"/>
    <rect x="474" y="224" width="44" height="28" fill="#fde8e8" stroke="#b85450" stroke-width="1.2"/>
  </g>
  <text x="132" y="124" text-anchor="middle" font-size="10" fill="#2f5223" filter="url(#rough2)">+1</text>
  <text x="184" y="124" text-anchor="middle" font-size="10" fill="#2f5223" filter="url(#rough2)">+1</text>
  <text x="236" y="124" text-anchor="middle" font-size="10" fill="#2f5223" filter="url(#rough2)">+1</text>
  <text x="288" y="124" text-anchor="middle" font-size="10" fill="#2f5223" filter="url(#rough2)">+1</text>
  <text x="340" y="124" text-anchor="middle" font-size="10" fill="#2f5223" filter="url(#rough2)">+1</text>
  <text x="392" y="124" text-anchor="middle" font-size="10" fill="#2f5223" filter="url(#rough2)">+1</text>
  <text x="444" y="124" text-anchor="middle" font-size="10" fill="#2f5223" filter="url(#rough2)">+1</text>
  <text x="496" y="124" text-anchor="middle" font-size="10" fill="#2f5223" filter="url(#rough2)">+1</text>
  <text x="184" y="164" text-anchor="middle" font-size="10" fill="#2f4a66" filter="url(#rough2)">+1</text>
  <text x="288" y="164" text-anchor="middle" font-size="10" fill="#2f4a66" filter="url(#rough2)">+1</text>
  <text x="392" y="164" text-anchor="middle" font-size="10" fill="#2f4a66" filter="url(#rough2)">+1</text>
  <text x="496" y="164" text-anchor="middle" font-size="10" fill="#2f4a66" filter="url(#rough2)">+1</text>
  <text x="236" y="204" text-anchor="middle" font-size="10" fill="#8a6015" filter="url(#rough2)">+1</text>
  <text x="392" y="204" text-anchor="middle" font-size="10" fill="#8a6015" filter="url(#rough2)">+1</text>
  <text x="288" y="244" text-anchor="middle" font-size="10" fill="#8c2f2b" filter="url(#rough2)">+1</text>
  <text x="496" y="244" text-anchor="middle" font-size="10" fill="#8c2f2b" filter="url(#rough2)">+1</text>

  <!-- 结果行 -->
  <text x="96" y="292" text-anchor="end" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">d[n] =</text>
  <text x="130" y="292" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">1</text>
  <text x="182" y="292" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">2</text>
  <text x="234" y="292" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">2</text>
  <text x="286" y="292" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">3</text>
  <text x="338" y="292" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">2</text>
  <text x="390" y="292" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">4</text>
  <text x="442" y="292" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">2</text>
  <text x="494" y="292" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">4</text>

  <text x="560" y="130" font-size="11.5" fill="#666" filter="url(#rough2)">每一行只花</text>
  <text x="560" y="150" font-size="11.5" fill="#666" filter="url(#rough2)">N/i 次加法</text>
  <text x="560" y="170" font-size="11.5" fill="#666" filter="url(#rough2)">总计 N·H(N)</text>
  <text x="560" y="190" font-size="11.5" fill="#666" filter="url(#rough2)">≈ 1.4e7 次</text>

  <rect x="60" y="318" width="600" height="76" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="74" y="342" font-size="12" fill="#7a5a1b" filter="url(#rough2)">d[n] = 满足 i | n 的 i 的个数。代码：for i in 1..N: for j = i; j &lt;= N; j += i: d[j] += 1</text>
  <text x="74" y="364" font-size="12" fill="#7a5a1b" filter="url(#rough2)">只需预处理到 N = a·b·c ≤ 1e6；d 的最大值只有 240（720720 取到），byte 就装得下。</text>
  <text x="74" y="384" font-size="11" fill="#7a5a1b" filter="url(#rough2)">注意：1 只有 1 个约数，d[1] = 1，它不是素数也不特殊。</text>
</svg>
