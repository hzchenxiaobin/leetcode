<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="760" height="400" fill="#fafafa"/>

  <rect x="40" y="78" width="680" height="82" rx="8" fill="#ffffff" stroke="#c9d6e4" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="112" font-size="13" text-anchor="start" fill="#35507a" font-weight="bold" filter="url(#rough2)">输入 10 1 14</text>
  <text x="60" y="140" font-size="10.5" text-anchor="start" fill="#8a8a8a" filter="url(#rough2)">n、x、y</text>
  <text x="250" y="112" font-size="12" text-anchor="start" fill="#2f5223" filter="url(#rough2)">10 × 14% = 1.4 → 2</text>
  <text x="250" y="140" font-size="10.5" text-anchor="start" fill="#8a8a8a" filter="url(#rough2)">向上取整，至少这么多人</text>
  <line x1="500" y1="118" x2="546" y2="118" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="558" y="124" font-size="12.5" text-anchor="start" fill="#7a2f2f" font-weight="bold" filter="url(#rough2)">2 − 1 = 1</text>
  <rect x="40" y="176" width="680" height="82" rx="8" fill="#ffffff" stroke="#c9d6e4" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="210" font-size="13" text-anchor="start" fill="#35507a" font-weight="bold" filter="url(#rough2)">输入 20 10 50</text>
  <text x="60" y="238" font-size="10.5" text-anchor="start" fill="#8a8a8a" filter="url(#rough2)">n、x、y</text>
  <text x="250" y="210" font-size="12" text-anchor="start" fill="#2f5223" filter="url(#rough2)">20 × 50% = 10 → 10</text>
  <text x="250" y="238" font-size="10.5" text-anchor="start" fill="#8a8a8a" filter="url(#rough2)">向上取整，至少这么多人</text>
  <line x1="500" y1="216" x2="546" y2="216" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="558" y="222" font-size="12.5" text-anchor="start" fill="#7a2f2f" font-weight="bold" filter="url(#rough2)">10 − 10 = 0</text>
  <rect x="40" y="274" width="680" height="82" rx="8" fill="#ffffff" stroke="#c9d6e4" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="308" font-size="13" text-anchor="start" fill="#35507a" font-weight="bold" filter="url(#rough2)">输入 1000 352 146</text>
  <text x="60" y="336" font-size="10.5" text-anchor="start" fill="#8a8a8a" filter="url(#rough2)">n、x、y</text>
  <text x="250" y="308" font-size="12" text-anchor="start" fill="#2f5223" filter="url(#rough2)">1000 × 146% = 1460 → 1460</text>
  <text x="250" y="336" font-size="10.5" text-anchor="start" fill="#8a8a8a" filter="url(#rough2)">向上取整，至少这么多人</text>
  <line x1="500" y1="314" x2="546" y2="314" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="558" y="320" font-size="12.5" text-anchor="start" fill="#7a2f2f" font-weight="bold" filter="url(#rough2)">1460 − 352 = 1108</text>
  <text x="40" y="392" font-size="12" text-anchor="start" fill="#2b2b2b" filter="url(#rough2)">注意第 3 组：y = 146 &gt; 100，need 比 n = 1000 还大</text>
  <text x="380.0" y="36" font-size="20" text-anchor="middle" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">样例走查：need = ⌈n·y/100⌉，答案 = max(0, need − x)</text>
  <path d="M 120 46 Q 380.0 52 640 46" fill="none" stroke="#2b2b2b" stroke-width="1.3" filter="url(#rough2)"/>
</svg>
