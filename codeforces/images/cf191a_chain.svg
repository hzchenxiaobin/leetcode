<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="301"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">191A：把每个名字看成「首字母 → 末字母」的有向边</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="90.0" y="130.0" width="90.0" height="50.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="135.0" y="160.8" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="300.0" y="130.0" width="90.0" height="50.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="345.0" y="160.8" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="520.0" y="130.0" width="90.0" height="50.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="565.0" y="160.8" text-anchor="middle" font-size="16" fill="#8a6015" font-weight="bold" filter="url(#rough2)">b</text>
  <line x1="182.0" y1="148.0" x2="296.0" y2="148.0" stroke="#6b4c9a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="239.0" y="134.0" text-anchor="middle" font-size="10.5" fill="#6b4c9a" filter="url(#rough2)">abc (3)</text>
  <line x1="392.0" y1="168.0" x2="518.0" y2="168.0" stroke="#6b4c9a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="455.0" y="186.0" text-anchor="middle" font-size="10.5" fill="#6b4c9a" filter="url(#rough2)">cab (3)</text>
  <line x1="516.0" y1="158.0" x2="396.0" y2="158.0" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="455.0" y="142.0" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">cba (3)</text>
  <rect x="60.0" y="240.0" width="600.0" height="70.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="74.0" y="263.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">链要求相邻名字首尾相接；首字母必须等于末字母</text>
  <text x="74.0" y="289.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">dp[i][j] = 从 i 到 j 的最大总长；答案 max_c dp[c][c]</text>
  <rect x="60.0" y="326.0" width="600.0" height="56.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="74.0" y="349.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">按清单顺序处理名字：只能接在「已经处理过的名字组成的链」后面</text>
</svg>
