<svg xmlns="http://www.w3.org/2000/svg" width="760" height="510" viewBox="0 0 760 510"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="760" height="510" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：只看「错位」的位置</text>
  <path d="M 150 42 Q 380 49 610 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="380" y="66" text-anchor="middle" font-size="12.5" fill="#66788c" filter="url(#rough2)">位置 i 就位 ⇔ p[i] = i；把没就位的位置收进集合 S = { i | p[i] ≠ i }</text>

  <!-- 数组 p -->
  <text x="112" y="112" text-anchor="end" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">p =</text>
  <rect x="120" y="90" width="70" height="48" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="155" y="121" text-anchor="middle" font-size="16" fill="#3c5e2e" filter="url(#rough2)">1</text>
  <rect x="200" y="90" width="70" height="48" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="235" y="121" text-anchor="middle" font-size="16" fill="#a14340" filter="url(#rough2)">6</text>
  <rect x="280" y="90" width="70" height="48" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="315" y="121" text-anchor="middle" font-size="16" fill="#3c5e2e" filter="url(#rough2)">3</text>
  <rect x="360" y="90" width="70" height="48" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="395" y="121" text-anchor="middle" font-size="16" fill="#3c5e2e" filter="url(#rough2)">4</text>
  <rect x="440" y="90" width="70" height="48" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="475" y="121" text-anchor="middle" font-size="16" fill="#3c5e2e" filter="url(#rough2)">5</text>
  <rect x="520" y="90" width="70" height="48" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="555" y="121" text-anchor="middle" font-size="16" fill="#a14340" filter="url(#rough2)">2</text>

  <text x="112" y="158" text-anchor="end" font-size="10.5" fill="#66788c" filter="url(#rough2)">下标</text>
  <text x="155" y="158" text-anchor="middle" font-size="10.5" fill="#66788c" filter="url(#rough2)">1</text>
  <text x="235" y="158" text-anchor="middle" font-size="10.5" fill="#66788c" filter="url(#rough2)">2</text>
  <text x="315" y="158" text-anchor="middle" font-size="10.5" fill="#66788c" filter="url(#rough2)">3</text>
  <text x="395" y="158" text-anchor="middle" font-size="10.5" fill="#66788c" filter="url(#rough2)">4</text>
  <text x="475" y="158" text-anchor="middle" font-size="10.5" fill="#66788c" filter="url(#rough2)">5</text>
  <text x="555" y="158" text-anchor="middle" font-size="10.5" fill="#66788c" filter="url(#rough2)">6</text>

  <path d="M 235 166 V 178" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 555 166 V 178" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="235" y="196" text-anchor="middle" font-size="10.5" fill="#a14340" filter="url(#rough2)">p[2]=6 ≠ 2</text>
  <text x="555" y="196" text-anchor="middle" font-size="10.5" fill="#a14340" filter="url(#rough2)">p[6]=2 ≠ 6</text>
  <text x="380" y="216" text-anchor="middle" font-size="12" font-weight="bold" fill="#a14340" filter="url(#rough2)">S = {2, 6}：这两个位置必须被选中；1、3、4、5 已就位</text>

  <!-- 结论 ① -->
  <rect x="40" y="236" width="700" height="80" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="258" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">① 错位集合 S 天然对 p 封闭：p(S) = S</text>
  <text x="56" y="280" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">若 i 错位、而 p[i] = v 已经就位（即 p[v] = v），那么值 v 会同时出现在位置 i 和位置 v，与「排列」矛盾。</text>
  <text x="56" y="302" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">所以 i ∈ S ⇒ p[i] ∈ S；又 p 是单射故 |p(S)| = |S|，于是 p(S) = S：选中的位置 = 选中的值。</text>

  <!-- 结论 ② -->
  <rect x="40" y="328" width="700" height="80" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="350" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">② 把已就位的位置也选上，救不了场</text>
  <text x="56" y="372" font-size="11.5" fill="#8a6015" filter="url(#rough2)">选中它就得让镜像值仍是它自己，于是它只能落在选中序列的正中间，而且至多选一个；</text>
  <text x="56" y="394" font-size="11.5" fill="#8a6015" filter="url(#rough2)">把它插在正中之后，两侧错位元素的镜像配对与不插时完全相同 —— 判据只需看 S。</text>

  <!-- 判据 -->
  <rect x="40" y="424" width="700" height="70" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="448" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">判据：把 S 中位置排成 i₁ &lt; i₂ &lt; ⋯ &lt; i_k，则可一次排序 ⇔ p[i₁] &gt; p[i₂] &gt; ⋯ &gt; p[i_k]</text>
  <text x="56" y="472" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">等价写法：p[i_j] = i_{k+1−j}，即最大的值送到最左、最小的值送到最右 —— 首尾镜像配对。</text>
</svg>
