<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="880" height="470" fill="#fafafa"/>

  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">出边唯一：整条访问路线被 f 唯一确定</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#6b6b6b" filter="url(#rough2)">f(i) = 值 M_i − b_i 所在的位置（M_i 为后缀最大值）；出边 ≤ 1，故只能从入度为 0 的点沿 f 一路走</text>

  <!-- 行标签 -->
  <text x="152" y="150" text-anchor="end" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">b =</text>
  <text x="152" y="186" text-anchor="end" font-size="11" fill="#8a8a8a" filter="url(#rough2)">i =</text>
  <text x="152" y="206" text-anchor="end" font-size="11" fill="#446688" filter="url(#rough2)">M_i =</text>
  <text x="152" y="228" text-anchor="end" font-size="11" fill="#4a7a3a" filter="url(#rough2)">f(i) =</text>

  <!-- 值格子：2 1 0 5 3 4 -->
  <rect x="170" y="118" width="74" height="52" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="258" y="118" width="74" height="52" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="346" y="118" width="74" height="52" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="434" y="118" width="74" height="52" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="522" y="118" width="74" height="52" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="610" y="118" width="74" height="52" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="207" y="152" text-anchor="middle" font-size="20" fill="#2f4a66" filter="url(#rough2)">2</text>
  <text x="295" y="152" text-anchor="middle" font-size="20" fill="#2f4a66" filter="url(#rough2)">1</text>
  <text x="383" y="152" text-anchor="middle" font-size="20" fill="#8c3a37" filter="url(#rough2)">0</text>
  <text x="471" y="152" text-anchor="middle" font-size="20" fill="#8a6015" filter="url(#rough2)">5</text>
  <text x="559" y="152" text-anchor="middle" font-size="20" fill="#2f4a66" filter="url(#rough2)">3</text>
  <text x="647" y="152" text-anchor="middle" font-size="20" fill="#33582a" filter="url(#rough2)">4</text>

  <text x="207" y="186" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#rough2)">1</text>
  <text x="295" y="186" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#rough2)">2</text>
  <text x="383" y="186" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#rough2)">3</text>
  <text x="471" y="186" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#rough2)">4</text>
  <text x="559" y="186" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#rough2)">5</text>
  <text x="647" y="186" text-anchor="middle" font-size="11" fill="#8a8a8a" filter="url(#rough2)">6</text>

  <text x="207" y="206" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">5</text>
  <text x="295" y="206" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">5</text>
  <text x="383" y="206" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">5</text>
  <text x="471" y="206" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">5</text>
  <text x="559" y="206" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">4</text>
  <text x="647" y="206" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">4</text>

  <text x="207" y="228" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">5</text>
  <text x="295" y="228" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">6</text>
  <text x="383" y="228" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">4</text>
  <text x="471" y="228" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <text x="559" y="228" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="647" y="228" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">3</text>

  <text x="170" y="272" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">沿 f 走出的唯一路线（位置）：1 → 5 → 2 → 6 → 3 → 4</text>

  <!-- 路线格子 -->
  <rect x="214" y="288" width="52" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="294" y="288" width="52" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="374" y="288" width="52" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="454" y="288" width="52" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="534" y="288" width="52" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="614" y="288" width="52" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="240" y="317" text-anchor="middle" font-size="17" fill="#2f4a66" filter="url(#rough2)">2</text>
  <text x="320" y="317" text-anchor="middle" font-size="17" fill="#2f4a66" filter="url(#rough2)">3</text>
  <text x="400" y="317" text-anchor="middle" font-size="17" fill="#2f4a66" filter="url(#rough2)">1</text>
  <text x="480" y="317" text-anchor="middle" font-size="17" fill="#33582a" filter="url(#rough2)">4</text>
  <text x="560" y="317" text-anchor="middle" font-size="17" fill="#8c3a37" filter="url(#rough2)">0</text>
  <text x="640" y="317" text-anchor="middle" font-size="17" fill="#8a6015" filter="url(#rough2)">5</text>

  <path d="M 270 311 L 290 311" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 350 311 L 370 311" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 430 311 L 450 311" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 510 311 L 530 311" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 590 311 L 610 311" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <text x="440" y="360" text-anchor="middle" font-size="11.5" fill="#6b6b6b" filter="url(#rough2)">值序列 2, 3, 1, 4, 0, 5：只要「哪些值在前缀、哪些在尾部」定下来，f 就完全确定，与内部顺序无关</text>

  <!-- 结论框 -->
  <rect x="90" y="376" width="700" height="72" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="440" y="402" text-anchor="middle" font-size="12.5" fill="#7a5a12" filter="url(#rough2)">后缀最大值只有两个：位置 4（值 5，全局最大）与位置 6（值 4，末尾元素）</text>
  <text x="440" y="430" text-anchor="middle" font-size="12.5" fill="#7a5a12" filter="url(#rough2)">后缀最大值 i 的唯一出边必然指向 0（位置 3），而 0 只能被进入一次 ⇒ 后缀最大值个数 ≤ 2</text>
</svg>
