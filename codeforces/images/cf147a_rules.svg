<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="345"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="320" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">三条规则 ⇒ 直接按 token 重新拼</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">单词之间一个空格；标点前无空格；标点后一个空格</text>
  <g filter="url(#rough2)"><rect x="80" y="96" width="300" height="42" rx="5" fill="#ffffff" fill-opacity="0.4" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="230" y="124" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">单词 单词</text>
  <text x="400" y="124" text-anchor="middle" font-size="15" fill="#666666" filter="url(#rough2)">→</text>
  <text x="440" y="124" text-anchor="start" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">一个空格</text>
  <g filter="url(#rough2)"><rect x="80" y="152" width="300" height="42" rx="5" fill="#ffffff" fill-opacity="0.4" stroke="#8a2b28" stroke-width="1.4"/></g>
  <text x="230" y="180" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">单词 标点</text>
  <text x="400" y="180" text-anchor="middle" font-size="15" fill="#666666" filter="url(#rough2)">→</text>
  <text x="440" y="180" text-anchor="start" font-size="13" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">不留空格</text>
  <g filter="url(#rough2)"><rect x="80" y="208" width="300" height="42" rx="5" fill="#ffffff" fill-opacity="0.4" stroke="#b06a1e" stroke-width="1.4"/></g>
  <text x="230" y="236" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">标点 单词</text>
  <text x="400" y="236" text-anchor="middle" font-size="15" fill="#666666" filter="url(#rough2)">→</text>
  <text x="440" y="236" text-anchor="start" font-size="13" fill="#b06a1e" font-weight="bold" filter="url(#rough2)">一个空格</text>
  <g filter="url(#rough2)"><rect x="60" y="264" width="780" height="44" rx="6" fill="#cfe0f5" fill-opacity="0.45" stroke="#446688" stroke-width="1.4"/></g>
  <text x="450" y="292" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">原文本的空格全部丢弃，只保留 token 序列</text>
</svg>
