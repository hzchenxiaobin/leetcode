<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="71"/>
    <feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></defs>
  <rect width="720" height="340" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按位维护：异或 x 就是把 x 为 1 的那些位「翻转」</text>
  <text x="60" y="66" font-size="12" fill="#555" filter="url(#rough2)">区间 [l,r] 内每个数异或 x，第 b 位为 1 的个数变成：</text>
  <rect x="220" y="82" width="280" height="46" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="111" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5223" filter="url(#rough2)">cnt[b] ← len − cnt[b]　（当 x 的第 b 位为 1）</text>
  <text x="60" y="164" font-size="12" fill="#555" filter="url(#rough2)">其中 len = r − l + 1；x 第 b 位为 0 时该位不变。</text>
  <rect x="60" y="186" width="600" height="52" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="74" y="208" font-size="12" fill="#2f4a66" filter="url(#rough2)">区间和 = Σ_b cnt[b] × 2^b，所以查询时把 20 个位的计数按权重相加即可。</text>
  <text x="74" y="228" font-size="12" fill="#2f4a66" filter="url(#rough2)">a_i ≤ 1e6 &lt; 2^20，只需要 20 位；答案最大 1e5 × 1e6 ≈ 1e11，用 64 位。</text>
  <text x="60" y="276" font-size="12" fill="#2b2b2b" filter="url(#rough2)">懒标记：每个结点存一个「待下传的异或掩码」，整段被异或时只改计数并更新掩码；</text>
  <text x="60" y="300" font-size="12" fill="#2b2b2b" filter="url(#rough2)">下传时对两个孩子的计数做同样的翻转、掩码异或上同一值，再清空当前掩码。</text>
</svg>
