<svg xmlns="http://www.w3.org/2000/svg" width="880" height="404" viewBox="0 0 880 404"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="103"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/></marker>
  </defs>
  <rect width="880" height="404" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">第 i 题每错一次要重做前面 i−1 题</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">所以第 i 题的一次错答代价是 i 次点击</text>
  <text x="90" y="166" text-anchor="end" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">第 1 题</text>
  <g filter="url(#rough2)"><rect x="110" y="146" width="44" height="30" rx="3" fill="#f6d9d7" fill-opacity="0.6" stroke="#b85450" stroke-width="1.1"/></g>
  <text x="132" y="166" text-anchor="middle" font-size="9.5" fill="#8a2b28" filter="url(#rough2)">错答</text>
  <text x="174" y="166" text-anchor="start" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">= 1 次点击</text>
  <text x="90" y="216" text-anchor="end" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">第 2 题</text>
  <g filter="url(#rough2)"><rect x="110" y="196" width="44" height="30" rx="3" fill="#cfe0f5" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="132" y="216" text-anchor="middle" font-size="9.5" fill="#2f4a66" filter="url(#rough2)">重做</text>
  <g filter="url(#rough2)"><rect x="164" y="196" width="44" height="30" rx="3" fill="#f6d9d7" fill-opacity="0.6" stroke="#b85450" stroke-width="1.1"/></g>
  <text x="186" y="216" text-anchor="middle" font-size="9.5" fill="#8a2b28" filter="url(#rough2)">错答</text>
  <text x="228" y="216" text-anchor="start" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">= 2 次点击</text>
  <text x="90" y="266" text-anchor="end" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">第 3 题</text>
  <g filter="url(#rough2)"><rect x="110" y="246" width="44" height="30" rx="3" fill="#cfe0f5" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="132" y="266" text-anchor="middle" font-size="9.5" fill="#2f4a66" filter="url(#rough2)">重做</text>
  <g filter="url(#rough2)"><rect x="164" y="246" width="44" height="30" rx="3" fill="#cfe0f5" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="186" y="266" text-anchor="middle" font-size="9.5" fill="#2f4a66" filter="url(#rough2)">重做</text>
  <g filter="url(#rough2)"><rect x="218" y="246" width="44" height="30" rx="3" fill="#f6d9d7" fill-opacity="0.6" stroke="#b85450" stroke-width="1.1"/></g>
  <text x="240" y="266" text-anchor="middle" font-size="9.5" fill="#8a2b28" filter="url(#rough2)">错答</text>
  <text x="282" y="266" text-anchor="start" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">= 3 次点击</text>
  <text x="90" y="316" text-anchor="end" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">第 4 题</text>
  <g filter="url(#rough2)"><rect x="110" y="296" width="44" height="30" rx="3" fill="#cfe0f5" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="132" y="316" text-anchor="middle" font-size="9.5" fill="#2f4a66" filter="url(#rough2)">重做</text>
  <g filter="url(#rough2)"><rect x="164" y="296" width="44" height="30" rx="3" fill="#cfe0f5" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="186" y="316" text-anchor="middle" font-size="9.5" fill="#2f4a66" filter="url(#rough2)">重做</text>
  <g filter="url(#rough2)"><rect x="218" y="296" width="44" height="30" rx="3" fill="#cfe0f5" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="240" y="316" text-anchor="middle" font-size="9.5" fill="#2f4a66" filter="url(#rough2)">重做</text>
  <g filter="url(#rough2)"><rect x="272" y="296" width="44" height="30" rx="3" fill="#f6d9d7" fill-opacity="0.6" stroke="#b85450" stroke-width="1.1"/></g>
  <text x="294" y="316" text-anchor="middle" font-size="9.5" fill="#8a2b28" filter="url(#rough2)">错答</text>
  <text x="336" y="316" text-anchor="start" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">= 4 次点击</text>
  <text x="440" y="330" text-anchor="middle" font-size="13" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">第 i 题最坏要错 (a_i − 1) 次，再对 1 次 → 代价 (a_i − 1)·i + 1</text>
  <text x="440" y="360" text-anchor="middle" font-size="13" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">总点击 = Σ ((a_i − 1)·i + 1)  =  Σ (a_i − 1)·i + n</text>
</svg>
