<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1213"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="760" height="340" fill="#fafafa"/>
  <text x="380.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">回合顺序与单回合流程</text>
  <path d="M 121.60000000000001 42 Q 380.0 48 638.4 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="380.0" y="326" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">(1,1),(2,1),…,(n,1),(1,2),…,(n,2), 循环</text>
  <rect x="60" y="70" width="150" height="56" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="135" y="95" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">队 1 的 1 号</text>
  <text x="135" y="115" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">一回合 t 秒</text>
  <rect x="225" y="70" width="150" height="56" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="95" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">队 2 的 1 号</text>
  <text x="300" y="115" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">一回合 t 秒</text>
  <rect x="390" y="70" width="150" height="56" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="465" y="95" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">队 1 的 2 号</text>
  <text x="465" y="115" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">一回合 t 秒</text>
  <rect x="555" y="70" width="150" height="56" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="630" y="95" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">队 2 的 2 号</text>
  <text x="630" y="115" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">一回合 t 秒</text>
  <rect x="60" y="160" width="640" height="110" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="188" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">回合内：取牌 → need = max(1, c − a − b − d)</text>
  <text x="380" y="214" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">need ≤ 剩余时间？猜出（扣时间、得分、删牌）</text>
  <text x="380" y="240" text-anchor="middle" font-size="11.5" fill="#8c2f2c" filter="url(#rough2)">否则：牌放回堆底、d += 剩余时间、回合结束</text>
  <text x="380" y="295" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">每次失败让 d 严格增大 ⇒ 模拟必然终止</text>
</svg>
