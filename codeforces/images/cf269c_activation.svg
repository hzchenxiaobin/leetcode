<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="53"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="a9" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="420" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">内部点：入流 + 出流 = 全部边权之和，守恒就是各占一半</text>
  <path d="M 66 42 Q 360 48 654 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 左：一个点 -->
  <g filter="url(#rough2)">
    <circle cx="150" cy="150" r="34" fill="#dfeafc" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="150" y="156" text-anchor="middle" font-size="15" fill="#22314a" filter="url(#rough2)">v</text>
  <g font-size="13" fill="#2f4a66" filter="url(#rough2)">
    <text x="60" y="216">三条边权 4, 6, 10</text>
    <text x="60" y="240">W_v = 4 + 6 + 10 = 20</text>
    <text x="60" y="264">守恒 ⇒ 入 = 出 = 10</text>
  </g>
  <g stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)">
    <path d="M 118 122 L 74 96" marker-end="url(#a9)"/>
    <path d="M 118 178 L 74 204" marker-end="url(#a9)"/>
    <path d="M 184 150 L 228 150" marker-end="url(#a9)"/>
  </g>

  <!-- 右：判定规则 -->
  <g filter="url(#rough2)">
    <rect x="300" y="80" width="380" height="120" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <g font-size="12.5" fill="#8a6015" filter="url(#rough2)">
    <text x="314" y="106">已经确定指向 v 的边，权重和记为 in[v]。</text>
    <text x="314" y="130">in[v] 只会增加，最多到 W_v/2。</text>
    <text x="314" y="154">一旦 in[v] = W_v/2，剩下的边</text>
    <text x="314" y="178">就只能全部朝外——这是唯一的选择。</text>
  </g>

  <!-- 流程 -->
  <text x="60" y="238" font-size="13.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法（队列 + 激活）</text>
  <g filter="url(#rough2)">
    <rect x="60" y="250" width="620" height="96" rx="8" fill="#ffffff" stroke="#888" stroke-width="1.2"/>
  </g>
  <g font-size="12.5" fill="#333" filter="url(#rough2)">
    <text x="74" y="274">① 1 号点没有入边 ⇒ 它的所有边直接朝外，压入队列。</text>
    <text x="74" y="298">② 处理队首 v：把 v 所有未定向的边朝外（v → u），并令 in[u] += c。</text>
    <text x="74" y="322">③ 若 u 是内部点且 2·in[u] = W_u，把 u 压入队列。</text>
    <text x="74" y="344">④ 队列空则结束。每条边恰好被定向一次，n 号点永远不进队列。</text>
  </g>

  <!-- 关键：无环 -->
  <g filter="url(#rough2)">
    <rect x="60" y="362" width="620" height="46" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="74" y="390" font-size="12.5" fill="#22314a" filter="url(#rough2)">
    无环：每条边都由「先被处理的那个端点」朝外定向，按处理顺序即为拓扑序。
  </text>
</svg>
