<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="23"/>
    <feDisplacementMap in="SourceGraphic" scale="1.6"/></filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker></defs>
  <rect width="720" height="380" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">允许格子 = 若干行上的水平段，国王在格子间 BFS</text>

  <!-- 网格示意 -->
  <g filter="url(#rough2)">
    <rect x="80" y="70" width="420" height="180" fill="#ffffff" stroke="#888" stroke-width="1.2"/>
  </g>
  <text x="96" y="64" font-size="10.5" fill="#666" filter="url(#rough2)">行 5</text>
  <text x="96" y="130" font-size="10.5" fill="#666" filter="url(#rough2)">行 6</text>
  <text x="96" y="196" font-size="10.5" fill="#666" filter="url(#rough2)">行 7</text>
  <text x="96" y="262" font-size="10.5" fill="#666" filter="url(#rough2)">行 8</text>
  <text x="80" y="282" font-size="10.5" fill="#666" filter="url(#rough2)">列 1</text>
  <text x="480" y="282" text-anchor="end" font-size="10.5" fill="#666" filter="url(#rough2)">列 20</text>

  <!-- 允许格子：行 5 [3,8]、行 6 [7,11]、行 7 [2,5] -->
  <rect x="80" y="98" width="168" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="164" y="119" text-anchor="middle" font-size="10.5" fill="#2f5223" filter="url(#rough2)">行 5：[3, 8]</text>
  <rect x="164" y="164" width="126" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="227" y="185" text-anchor="middle" font-size="10.5" fill="#2f5223" filter="url(#rough2)">行 6：[7, 11]</text>
  <rect x="80" y="230" width="105" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="120" y="245" text-anchor="middle" font-size="10.5" fill="#2f5223" filter="url(#rough2)">行 7：[2, 5]</text>

  <!-- 起点与终点 -->
  <circle cx="101" cy="114" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="101" y="119" text-anchor="middle" font-size="9" fill="#8a6015" filter="url(#rough2)">起</text>
  <circle cx="290" cy="180" r="12" fill="#fde8e8" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="290" y="185" text-anchor="middle" font-size="9" fill="#8c2f2b" filter="url(#rough2)">终</text>
  <path d="M 113 120 L 170 168" stroke="#446688" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 右侧：8 邻域 -->
  <text x="540" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">国王的 8 邻域</text>
  <g filter="url(#rough2)">
    <rect x="524" y="100" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="556" y="100" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="588" y="100" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="524" y="132" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="556" y="132" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="588" y="132" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="524" y="164" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="556" y="164" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="588" y="164" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="572" y="153" text-anchor="middle" font-size="9" fill="#8a6015" filter="url(#rough2)">当前</text>

  <rect x="60" y="300" width="600" height="62" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="74" y="322" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">从起点做 BFS：每次尝试 8 个邻居，落在允许格子里且未访问过就入队，第一次到达终点即最短路。</text>
  <text x="74" y="344" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">允许格子总数不超过 1e5（题面保证各段长度之和 ≤ 1e5），所以 BFS 的规模与坐标 1e9 无关。</text>
</svg>
