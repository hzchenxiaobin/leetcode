<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="720" height="360" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">一对元素的贡献：同组 a_i+a_j，跨组再加 h</text>
  <path d="M 120 42 Q 360 48 600 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 同组 -->
  <rect x="50" y="70" width="290" height="150" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="66" y="96" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">在同一个序列里</text>
  <circle cx="120" cy="140" r="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <circle cx="260" cy="140" r="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="120" y="146" text-anchor="middle" font-size="13" fill="#2f5223" filter="url(#rough2)">a_i</text>
  <text x="260" y="146" text-anchor="middle" font-size="13" fill="#2f5223" filter="url(#rough2)">a_j</text>
  <line x1="146" y1="140" x2="232" y2="140" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="196" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">f = a_i + a_j</text>

  <!-- 跨组 -->
  <rect x="380" y="70" width="290" height="150" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="396" y="96" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">被分到两个不同的序列</text>
  <circle cx="450" cy="140" r="26" fill="#ffffff" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <circle cx="590" cy="140" r="26" fill="#ffffff" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="450" y="146" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">a_i</text>
  <text x="590" y="146" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">a_j</text>
  <line x1="476" y1="140" x2="562" y2="140" stroke="#446688" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="520" y="196" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">f = a_i + a_j + h</text>

  <rect x="50" y="244" width="620" height="52" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="64" y="266" font-size="12" fill="#7a5a1b" filter="url(#rough2)">优美度 = 所有对里 f 的最大值 − 最小值；同组的对没有 +h，所以 h 越大越不想跨组。</text>
  <text x="64" y="286" font-size="12" fill="#7a5a1b" filter="url(#rough2)">每个对只由「两个数」和「是否同组」决定，与它们在原序列中的位置无关 → 可以先排序再考虑分组。</text>

  <text x="360" y="330" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">极值只可能出现在「最大的两个数」与「最小的两个数」附近</text>
</svg>
