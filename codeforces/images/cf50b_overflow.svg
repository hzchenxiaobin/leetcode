<svg xmlns="http://www.w3.org/2000/svg" width="740" height="400" viewBox="0 0 740 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="740" height="400" fill="#fafafa"/>
  <text x="370" y="36" font-size="20" fill="#2b2b2b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">答案上界 10¹⁰ 超出 32 位整数：必须用 long long</text>
  <path d="M 120 46 Q 370 52 620 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="100" font-size="14" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">32 位 int 的范围</text>
  <rect x="60" y="112" width="260" height="54" rx="8" fill="#fdeaea" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="146" font-size="12.5" fill="#8a3030" text-anchor="middle" filter="url(#rough2)">0 ~ 2 147 483 647（≈2.1×10⁹）</text>
  <text x="60" y="216" font-size="14" fill="#2f5223" text-anchor="start" font-weight="bold" filter="url(#rough2)">本题最大答案（n = 10⁵ 全同字符）</text>
  <rect x="60" y="228" width="380" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="250" y="262" font-size="13" fill="#2f5223" text-anchor="middle" filter="url(#rough2)">100 000² = 10 000 000 000（10¹⁰）</text>
  <text x="470" y="100" font-size="14" fill="#2f4a66" text-anchor="start" font-weight="bold" filter="url(#rough2)">64 位 long long</text>
  <rect x="470" y="112" width="220" height="54" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="580" y="146" font-size="12.5" fill="#2f4a66" text-anchor="middle" filter="url(#rough2)">上限 ≈ 9.2×10¹⁸</text>
  <text x="470" y="196" font-size="11.5" fill="#44546a" text-anchor="start" filter="url(#rough2)">10¹⁰ 只占约 1/10⁹ 的空间</text>
  <text x="470" y="220" font-size="11.5" fill="#44546a" text-anchor="start" filter="url(#rough2)">完全安全</text>
  <text x="60" y="306" font-size="13" fill="#2b2b2b" text-anchor="start" font-weight="bold" filter="url(#rough2)">直观对比（同一条数轴）</text>
  <rect x="60" y="318" width="600" height="22" rx="4" fill="#f0f0f0" stroke="#9aa7b4" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="60" y="318" width="12.6" height="22" fill="#b85450" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <rect x="60" y="318" width="60.0" height="22" fill="#4a7a3a" fill-opacity="0.55" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="60" y="360" font-size="10.5" fill="#8a3030" text-anchor="start" filter="url(#rough2)">红色细条：32 位 int 上限 2.1×10⁹</text>
  <text x="300" y="360" font-size="10.5" fill="#2f5223" text-anchor="start" filter="url(#rough2)">绿色宽条：本题答案 10¹⁰</text>
  <text x="60" y="384" font-size="11.5" fill="#444" text-anchor="start" filter="url(#rough2)">若用 int 累加：k = 46341 时 k² 已越过 2³¹−1，结果变成负数或错的数 —— 这是本题最经典的 WA 点。</text>
</svg>
