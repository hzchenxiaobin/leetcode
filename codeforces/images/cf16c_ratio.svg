<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="420" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">先约分成最简比 x′:y′，再找最大整数倍 k</text>
  <path d="M 150 44 Q 360 50 570 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <text x="60" y="84" font-size="12" fill="#2b2b2b" filter="url(#rough2)">例：16 : 9 → gcd = 1 → 16 : 9</text>
  <text x="60" y="110" font-size="12" fill="#2b2b2b" filter="url(#rough2)">例：4 : 6 → gcd = 2 → 2 : 3</text>

  <!-- 基础块 × k -->
  <rect x="60" y="150" width="96" height="54" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="108" y="182" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">x′ × y′</text>

  <path d="M 162 177 L 196 177" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="179" y="168" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">× k</text>

  <!-- k 个块拼成目标 -->
  <g filter="url(#rough2)">
    <rect x="205" y="150" width="96" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="301" y="150" width="96" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="205" y="204" width="96" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="301" y="204" width="96" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="301" y="236" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">k = 2 时的样子</text>

  <!-- 外框 a×b -->
  <rect x="440" y="132" width="230" height="150" rx="8" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="7 4" filter="url(#rough2)"/>
  <text x="555" y="124" text-anchor="middle" font-size="11.5" fill="#a33a36" filter="url(#rough2)">可用屏幕 a × b</text>
  <g filter="url(#rough2)">
    <rect x="452" y="144" width="96" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="548" y="144" width="96" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="452" y="198" width="96" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="548" y="198" width="96" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <text x="555" y="272" text-anchor="middle" font-size="10.5" fill="#2f5223" filter="url(#rough2)">k 受宽和高同时限制</text>

  <rect x="40" y="304" width="640" height="94" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <g font-size="12.5" fill="#7a5a1b" filter="url(#rough2)">
    <text x="56" y="334">k = min(⌊a / x′⌋, ⌊b / y′⌋)；x′ = x/gcd(x,y)，y′ = y/gcd(x,y)</text>
    <text x="56" y="362">面积 = (k·x′)(k·y′) = k²·x′y′，所以 k 越大越好，直接取最大整数倍。</text>
    <text x="56" y="388">k = 0 表示放不下 → 输出 0 0；否则输出 k·x′ 与 k·y′。</text>
  </g>
</svg>
