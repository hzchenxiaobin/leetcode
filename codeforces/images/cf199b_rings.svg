<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="517"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="440" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">199B：两个圆环，四条边界圆；完整轮廓 = 不被另一环涂黑</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <circle cx="250.0" cy="230.0" r="120.0" fill="none" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="250.0" cy="230.0" r="80.0" fill="none" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="430.0" cy="250.0" r="90.0" fill="none" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="430.0" cy="250.0" r="50.0" fill="none" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="250.0" cy="230.0" r="3.0" fill="#2b2b2b" stroke="#2b2b2b" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="430.0" cy="250.0" r="3.0" fill="#2b2b2b" stroke="#2b2b2b" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="250.0" y="100.0" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">环 1（r1, R1）</text>
  <text x="470.0" y="356.0" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">环 2（r2, R2）</text>
  <rect x="60.0" y="380.0" width="620.0" height="44.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="74.0" y="403.3" text-anchor="start" font-size="11.3" fill="#3f3420" filter="url(#rough2)">某边界圆是完整轮廓 ⇔ 它与另一环的「开圆环」不相交</text>
</svg>
