<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="901"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="300" fill="#fafafa"/>
  <text x="360.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">一次移动：沿着路径摘除，再逆序接回</text>
  <path d="M 115.2 42 Q 360.0 48 604.8 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="360.0" y="286" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">链表的邻居指针在摘除时不动，恢复时只改邻居</text>
  <rect x="70" y="84" width="110" height="46" rx="7" fill="#fbeeee" stroke="#a05a5a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="125" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#6b3030" filter="url(#rough2)">p₀</text>
  <rect x="200" y="84" width="110" height="46" rx="7" fill="#fbeadb" stroke="#d98c3f" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="255" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">p₁</text>
  <line x1="182.0" y1="107.0" x2="198.0" y2="107.0" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <rect x="330" y="84" width="110" height="46" rx="7" fill="#fbeeee" stroke="#a05a5a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="385" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#6b3030" filter="url(#rough2)">p₂</text>
  <line x1="312.0" y1="107.0" x2="328.0" y2="107.0" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <rect x="460" y="84" width="110" height="46" rx="7" fill="#fbeadb" stroke="#d98c3f" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="515" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">p₃</text>
  <line x1="442.0" y1="107.0" x2="458.0" y2="107.0" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="360" y="70" text-anchor="middle" font-size="12" fill="#8c2f2c" filter="url(#rough2)">摘除顺序（答案计分 = 路径长度）</text>
  <rect x="460" y="160" width="110" height="44" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="515" y="187" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">p₀</text>
  <line x1="458.0" y1="182.0" x2="440.0" y2="182.0" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <rect x="330" y="160" width="110" height="44" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="385" y="187" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">p₁</text>
  <line x1="328.0" y1="182.0" x2="310.0" y2="182.0" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <rect x="200" y="160" width="110" height="44" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="255" y="187" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">p₂</text>
  <line x1="198.0" y1="182.0" x2="180.0" y2="182.0" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <rect x="70" y="160" width="110" height="44" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="125" y="187" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">p₃</text>
  <text x="360" y="146" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">逆序接回（p₃ 先恢复）</text>
  <rect x="60" y="228" width="600" height="46" rx="9" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="248" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">恢复 p 时：rowNext[旧左邻] = p，rowPrev[旧右邻] = p（列同理）</text>
  <text x="360" y="266" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">p 自己的四个指针在摘除时从未被改动，直接可用</text>
</svg>
