<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="760" height="430" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">把「走法」翻译成每条边走几次：总数必然是偶数</text>
  <path d="M 152 41 Q 380 47 608 41" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <line x1="190" y1="300" x2="80" y2="180" stroke="#7a8fa6" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="190" y1="300" x2="400" y2="180" stroke="#7a8fa6" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="400" y1="180" x2="300" y2="80" stroke="#7a8fa6" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="400" y1="180" x2="520" y2="80" stroke="#7a8fa6" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="190" cy="300" r="21" fill="#eef3fb" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="305" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">4</text>
  <circle cx="80" cy="180" r="21" fill="#eef3fb" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="80" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">3</text>
  <circle cx="400" cy="180" r="21" fill="#eef3fb" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="400" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">5</text>
  <circle cx="300" cy="80" r="21" fill="#eef3fb" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">2</text>
  <circle cx="520" cy="80" r="21" fill="#eef3fb" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="520" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">1</text>
  <text x="80" y="150" text-anchor="middle" font-size="11" fill="#7a4a86" filter="url(#rough2)">k=1</text>
  <text x="190" y="270" text-anchor="middle" font-size="11" fill="#7a4a86" filter="url(#rough2)">k=3</text>
  <text x="300" y="50" text-anchor="middle" font-size="11" fill="#7a4a86" filter="url(#rough2)">k=3</text>
  <text x="400" y="150" text-anchor="middle" font-size="11" fill="#7a4a86" filter="url(#rough2)">k=2</text>
  <text x="520" y="50" text-anchor="middle" font-size="11" fill="#7a4a86" filter="url(#rough2)">k=1</text>
  <text x="300" y="335" text-anchor="middle" font-size="12" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">s 从 4 出发</text>
  <text x="149.0" y="236.0" text-anchor="start" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">×1</text>
  <text x="309.0" y="236.0" text-anchor="start" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">×1</text>
  <text x="364.0" y="126.0" text-anchor="start" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">×1</text>
  <text x="472.0" y="126.0" text-anchor="start" font-size="12" font-weight="bold" fill="#9b9b9b" filter="url(#rough2)">×0</text>
  <rect x="30" y="352" width="700" height="62" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="46" y="374" text-anchor="start" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">边 (p,u) 向下走了 x 次 ⇒ 也必须向上走 x 次；每次「到达」吃掉目标点 1 只</text>
  <text x="46" y="398" text-anchor="start" font-size="12" fill="#7a5a1b" filter="url(#rough2)">到达 v 的总次数 = x_v + Σ x_子 ≤ k_v，而全场吃掉的只数 = 所有到达次数 = 2·Σ x_u（必为偶数）</text>
</svg>
