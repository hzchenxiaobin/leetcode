<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="61"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="440" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">180A：空簇当缓冲，把片段一个个换到位</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="40.0" y="74.0" text-anchor="start" font-size="11.5" fill="#555" filter="url(#rough2)">初始：文件 A 占 1,3；文件 B 占 2,4,5</text>
  <rect x="60.0" y="90.0" width="74.0" height="56.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="97.0" y="122.3" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">A1</text>
  <text x="97.0" y="162.0" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">1</text>
  <rect x="144.0" y="90.0" width="74.0" height="56.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="181.0" y="122.3" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">B1</text>
  <text x="181.0" y="162.0" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">2</text>
  <rect x="228.0" y="90.0" width="74.0" height="56.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="265.0" y="122.3" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">A2</text>
  <text x="265.0" y="162.0" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">3</text>
  <rect x="312.0" y="90.0" width="74.0" height="56.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="349.0" y="122.3" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">B2</text>
  <text x="349.0" y="162.0" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">4</text>
  <rect x="396.0" y="90.0" width="74.0" height="56.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="433.0" y="122.3" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">B3</text>
  <text x="433.0" y="162.0" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">5</text>
  <rect x="480.0" y="90.0" width="74.0" height="56.0" fill="#ffffff" stroke="#999999" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="517.0" y="122.3" text-anchor="middle" font-size="12" fill="#999999" font-weight="bold" filter="url(#rough2)">空</text>
  <text x="517.0" y="162.0" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">6</text>
  <rect x="564.0" y="90.0" width="74.0" height="56.0" fill="#ffffff" stroke="#999999" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="601.0" y="122.3" text-anchor="middle" font-size="12" fill="#999999" font-weight="bold" filter="url(#rough2)">空</text>
  <text x="601.0" y="162.0" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">7</text>
  <text x="40.0" y="186.0" text-anchor="start" font-size="11.5" fill="#555" filter="url(#rough2)">目标：A1 A2 B1 B2 B3 依次占 1..5，空簇在末尾</text>
  <rect x="60.0" y="200.0" width="74.0" height="50.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="97.0" y="229.3" text-anchor="middle" font-size="12" fill="#8a6015" font-weight="bold" filter="url(#rough2)">A1</text>
  <rect x="144.0" y="200.0" width="74.0" height="50.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="181.0" y="229.3" text-anchor="middle" font-size="12" fill="#8a6015" font-weight="bold" filter="url(#rough2)">A2</text>
  <rect x="228.0" y="200.0" width="74.0" height="50.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="265.0" y="229.3" text-anchor="middle" font-size="12" fill="#8a6015" font-weight="bold" filter="url(#rough2)">B1</text>
  <rect x="312.0" y="200.0" width="74.0" height="50.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="349.0" y="229.3" text-anchor="middle" font-size="12" fill="#8a6015" font-weight="bold" filter="url(#rough2)">B2</text>
  <rect x="396.0" y="200.0" width="74.0" height="50.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="433.0" y="229.3" text-anchor="middle" font-size="12" fill="#8a6015" font-weight="bold" filter="url(#rough2)">B3</text>
  <rect x="480.0" y="200.0" width="74.0" height="50.0" fill="#ffffff" stroke="#999999" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="517.0" y="229.3" text-anchor="middle" font-size="12" fill="#999999" font-weight="bold" filter="url(#rough2)">空</text>
  <rect x="564.0" y="200.0" width="74.0" height="50.0" fill="#ffffff" stroke="#999999" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="601.0" y="229.3" text-anchor="middle" font-size="12" fill="#999999" font-weight="bold" filter="url(#rough2)">空</text>
  <text x="60.0" y="282.0" text-anchor="start" font-size="13" fill="#8a6015" font-weight="bold" filter="url(#rough2)">① 2 → 6</text>
  <text x="170.0" y="282.0" text-anchor="start" font-size="12" fill="#444" filter="url(#rough2)">把 B1 挪到空簇 6，腾出位置 2</text>
  <text x="60.0" y="322.0" text-anchor="start" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">② 3 → 2</text>
  <text x="170.0" y="322.0" text-anchor="start" font-size="12" fill="#444" filter="url(#rough2)">把 A2 放进位置 2</text>
  <text x="60.0" y="362.0" text-anchor="start" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">③ 6 → 3</text>
  <text x="170.0" y="362.0" text-anchor="start" font-size="12" fill="#444" filter="url(#rough2)">把 B1 从 6 放进位置 3</text>
  <rect x="40.0" y="396.0" width="640.0" height="36.0" fill="#f3e8fd" stroke="#6b4c9a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="54.0" y="419.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">每个目标位置最多 2 次复制，总操作数 ≤ 2n</text>
</svg>
