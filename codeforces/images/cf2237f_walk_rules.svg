<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>

  <text x="360" y="36" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">合法数组 = 在 1..m 上的「爬坡 / 重置」行走</text>
  <text x="360" y="60" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">起点 b₁ = 1，终点 bₙ = m，每一步只有下列走法</text>

  <circle cx="80" cy="160" r="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="205" cy="160" r="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="330" cy="160" r="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="455" cy="160" r="30" fill="#fafafa" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <circle cx="595" cy="160" r="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>

  <text x="80" y="167" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">1</text>
  <text x="205" y="167" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">2</text>
  <text x="330" y="167" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">3</text>
  <text x="455" y="167" text-anchor="middle" font-size="17" fill="#777" filter="url(#rough2)">…</text>
  <text x="595" y="167" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">m</text>

  <path d="M 110 160 L 172 160" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 235 160 L 297 160" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 360 160 L 422 160" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 485 160 L 562 160" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="141" y="147" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">+1</text>
  <text x="266" y="147" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">+1</text>
  <text x="391" y="147" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">+1</text>
  <text x="523" y="147" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">+1</text>

  <path d="M 200 189 Q 145 240 88 191" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 324 189 Q 215 280 86 193" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 588 189 Q 340 330 82 195" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="250" y="96" width="120" height="26" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="310" y="114" text-anchor="middle" font-size="12" fill="#8a3b38" filter="url(#rough2)">m 之后任意值</text>

  <rect x="54" y="300" width="612" height="78" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="76" y="326" font-size="13.5" fill="#6b5320" filter="url(#rough2)">实线：值 +1（仅当当前值 &lt; m）；虚线：把下一步重置为 1</text>
  <text x="76" y="348" font-size="13.5" fill="#6b5320" filter="url(#rough2)">从 m 出发没有限制：下一步可以是 1..m 中任意值</text>
  <text x="76" y="369" font-size="13" fill="#8a6d2f" filter="url(#rough2)">等价写法：b₁ = 1，bₙ = m，bₚ₊₁ ≤ bₚ + 1，且“下降只能用 1 或从 m 出发”</text>
</svg>
