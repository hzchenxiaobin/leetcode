<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="83"/>
    <feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></defs>
  <rect width="720" height="320" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">线段树结点：20 个位的计数 + 一个异或懒标记</text>
  <g filter="url(#rough2)">
    <rect x="290" y="52" width="140" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="130" y="130" width="140" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="450" y="130" width="140" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="60" y="208" width="120" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="210" y="208" width="120" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="380" y="208" width="120" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="530" y="208" width="120" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <line x1="330" y1="100" x2="220" y2="128" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="390" y1="100" x2="500" y2="128" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="180" y1="178" x2="130" y2="206" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="220" y1="178" x2="262" y2="206" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="500" y1="178" x2="440" y2="206" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="540" y1="178" x2="580" y2="206" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="360" y="80" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">cnt[20]，lazy = 0</text>
  <text x="200" y="158" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">左孩子</text>
  <text x="520" y="158" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">右孩子</text>
  <text x="120" y="234" text-anchor="middle" font-size="10.5" fill="#8a6015" filter="url(#rough2)">叶子：位 = a[i]</text>
  <text x="270" y="234" text-anchor="middle" font-size="10.5" fill="#8a6015" filter="url(#rough2)">叶子</text>
  <text x="440" y="234" text-anchor="middle" font-size="10.5" fill="#8a6015" filter="url(#rough2)">叶子</text>
  <text x="590" y="234" text-anchor="middle" font-size="10.5" fill="#8a6015" filter="url(#rough2)">叶子</text>
  <text x="60" y="284" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">区间异或：若结点被完全覆盖，直接翻转 20 个位的计数并 lazy ^= x；否则下传后递归，再合并计数。</text>
  <text x="60" y="306" font-size="11.5" fill="#666" filter="url(#rough2)">每次操作 O(20 log n)，n = 1e5、m = 5e4 时约 2e7 次基本操作，4 s 内轻松通过。</text>
</svg>
