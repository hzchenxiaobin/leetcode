<svg xmlns="http://www.w3.org/2000/svg" width="880" height="486" viewBox="0 0 880 486" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough" x="-6%%" y="-6%%" width="112%%" height="112%%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="880" height="486" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="17.5" font-weight="bold" fill="#22303f" filter="url(#rough)">关键一步：三条路径交于唯一顶点 m，只有 m 被算了 3 次</text>
  <rect x="26" y="52" width="432" height="272" rx="10" fill="#eef4e8" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough)"/>
  <rect x="474" y="52" width="380" height="272" rx="10" fill="#e8eef7" stroke="#446688" stroke-width="1.6" filter="url(#rough)"/>
  <rect x="26" y="340" width="828" height="126" rx="10" fill="#fdf6dd" stroke="#b08d2e" stroke-width="1.6" filter="url(#rough)"/>
  <line x1="240" y1="202" x2="84" y2="98" stroke="#7d8a72" stroke-width="2"/>
  <line x1="240" y1="202" x2="240" y2="76" stroke="#7d8a72" stroke-width="2"/>
  <line x1="240" y1="202" x2="400" y2="98" stroke="#7d8a72" stroke-width="2"/>
  <circle cx="186.96" cy="166.64" r="5.2" fill="#dfe7d5" stroke="#7d8a72" stroke-width="1.3"/>
  <circle cx="135.48" cy="132.32" r="5.2" fill="#dfe7d5" stroke="#7d8a72" stroke-width="1.3"/>
  <circle cx="240" cy="159.16" r="5.2" fill="#dfe7d5" stroke="#7d8a72" stroke-width="1.3"/>
  <circle cx="240" cy="117.58" r="5.2" fill="#dfe7d5" stroke="#7d8a72" stroke-width="1.3"/>
  <circle cx="294.4" cy="166.64" r="5.2" fill="#dfe7d5" stroke="#7d8a72" stroke-width="1.3"/>
  <circle cx="347.2" cy="132.32" r="5.2" fill="#dfe7d5" stroke="#7d8a72" stroke-width="1.3"/>
  <circle cx="84" cy="98" r="15" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough)"/>
  <text x="84" y="102.86" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f5223" filter="url(#rough)">u</text>
  <circle cx="240" cy="76" r="15" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough)"/>
  <text x="240" y="80.86" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f5223" filter="url(#rough)">v</text>
  <circle cx="400" cy="98" r="15" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough)"/>
  <text x="400" y="102.86" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f5223" filter="url(#rough)">w</text>
  <circle cx="240" cy="202" r="17" fill="#fff3cd" stroke="#b08d2e" stroke-width="1.6" filter="url(#rough)"/>
  <text x="240" y="207.4" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5a12" filter="url(#rough)">m</text>
  <text x="150" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough)">×2</text>
  <text x="264" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough)">×2</text>
  <text x="332" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough)">×2</text>
  <text x="240" y="246" text-anchor="middle" font-size="14" font-weight="bold" fill="#a1372b" filter="url(#rough)">×3</text>
  <text x="242" y="276" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough)">三条路径 u-v、v-w、w-u 两两交于 m</text>
  <text x="242" y="300" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough)">m 之外每个顶点恰在两条路径上</text>
  <text x="492" y="84" text-anchor="start" font-size="12.5" fill="#22303f" filter="url(#rough)">按「在三条路径上出现几次」归类：</text>
  <text x="492" y="118" text-anchor="start" font-size="13" font-weight="bold" fill="#7a5a12" filter="url(#rough)">m：出现 3 次  ⟹  贡献 aₘ³</text>
  <text x="492" y="146" text-anchor="start" font-size="12.5" fill="#22303f" filter="url(#rough)">并集内其他顶点：2 次</text>
  <text x="492" y="172" text-anchor="start" font-size="12.5" fill="#22303f" filter="url(#rough)">并集外的顶点：0 次（乘 1）</text>
  <text x="492" y="210" text-anchor="start" font-size="13.5" font-weight="bold" fill="#173a5e" filter="url(#rough)">P = aₘ³ · (∏ aₓ)²，x ≠ m</text>
  <text x="492" y="240" text-anchor="start" font-size="13.5" font-weight="bold" fill="#173a5e" filter="url(#rough)">= aₘ · (aₘ · Q)²</text>
  <text x="492" y="266" text-anchor="start" font-size="12" fill="#4a5c70" filter="url(#rough)">Q = 其余顶点之积</text>
  <text x="492" y="298" text-anchor="start" font-size="13.5" font-weight="bold" fill="#a1372b" filter="url(#rough)">⟹ P 是平方 ⟺ aₘ 是平方</text>
  <text x="40" y="372" text-anchor="start" font-size="12.5" fill="#5a4410" filter="url(#rough)">为什么只看 aₘ：平方性就是所有质因子指数的奇偶性；aₘ³ 的指数是 3e，3e 为偶数 ⟺ e 为偶数。</text>
  <text x="40" y="400" text-anchor="start" font-size="12.5" fill="#5a4410" filter="url(#rough)">其余顶点每个都出现两次，成对抵消，整体是「某乘积的平方」，永远不影响奇偶。</text>
  <text x="40" y="428" text-anchor="start" font-size="12.5" font-weight="bold" fill="#7a3b12" filter="url(#rough)">所以好三元组 ⟺ 三路交点 m 的 aₘ 是完全平方数，与路径上其他值无关。</text>
  <text x="40" y="452" text-anchor="start" font-size="12" fill="#5a4410" filter="url(#rough)">特例：所有 aᵢ 都是平方数时答案就是 C(n,3)（样例 1，n = 5 → 10）。</text>
</svg>
