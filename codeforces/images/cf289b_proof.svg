<svg xmlns="http://www.w3.org/2000/svg" width="700" height="280" viewBox="0 0 700 280"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="413"/>
    <feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></defs>
  <rect width="700" height="280" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">为什么中位数最优</text>
  <path d="M 190 40 Q 350 46 510 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="70" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="12.5" fill="#22314a" filter="url(#rough2)">设 f(t)=Σ|aᵢ−t|。把 t 右移一点：若左边元素比右边多，f 下降；反之上升。</text>
  <text x="76" y="106" font-size="12.5" fill="#22314a" filter="url(#rough2)">所以 f 在"左右数量相等"的位置（中位数）取到最小 ✓</text>
  <g filter="url(#rough2)"><rect x="60" y="142" width="580" height="60" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="166" font-size="12.5" fill="#2f5223" filter="url(#rough2)">实现：把 n·m 个数排序，取 a[N/2] 当目标（偶数个时取中间偏右也最优）。</text>
  <text x="76" y="188" font-size="12.5" fill="#2f5223" filter="url(#rough2)">复杂度 O(N log N)，N ≤ 10⁴，实测 &lt;5 ms。</text>
  <g filter="url(#rough2)"><rect x="60" y="216" width="580" height="46" rx="8" fill="#fbeeee" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="76" y="244" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">易错：代价里要除以 d（|a−t|/d 才是操作次数），漏除会放大 d 倍。</text>
</svg>
