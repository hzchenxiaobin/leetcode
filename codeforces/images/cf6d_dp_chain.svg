<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="420" fill="#fafafa"/>

  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">DP 状态：只记住相邻两个发数</text>
  <path d="M 200 46 Q 360 52 520 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <rect x="40" y="92" width="210" height="126" rx="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="56" y="122" font-size="14.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">状态 (x, y)</text>
  <text x="56" y="148" font-size="11.5" fill="#3c5a73" filter="url(#rough2)">x = k[i−1]，y = k[i]</text>
  <text x="56" y="172" font-size="11.5" fill="#3c5a73" filter="url(#rough2)">代价 = k[1] + … + k[i]</text>
  <text x="56" y="196" font-size="11.5" fill="#3c5a73" filter="url(#rough2)">候选发数 0 ≤ k ≤ 16</text>

  <rect x="250" y="58" width="230" height="72" rx="10" fill="#fde8e8" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="365" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#a33a36" filter="url(#rough2)">a·y + b·(x + z) ≥ h[i] + 1</text>
  <text x="365" y="108" text-anchor="middle" font-size="10.5" fill="#8a3b38" filter="url(#rough2)">第 i 个弓箭手必须死</text>

  <path d="M 255 155 L 443 155" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="350" y="142" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">枚举 z = k[i+1]</text>

  <rect x="470" y="92" width="210" height="126" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="486" y="122" font-size="14.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">状态 (y, z)</text>
  <text x="486" y="148" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">y = k[i]，z = k[i+1]</text>
  <text x="486" y="172" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">新代价 = 旧代价 + z</text>
  <text x="486" y="196" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">合法才更新，并记下前驱 x</text>

  <rect x="40" y="256" width="290" height="86" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="286" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">起点：dp[1][0][0] = 0</text>
  <text x="56" y="310" font-size="11" fill="#7a5a1b" filter="url(#rough2)">k[0] = k[1] = 0，两端打不到</text>

  <rect x="380" y="256" width="300" height="86" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="396" y="286" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">终点：min dp[n][x][0]</text>
  <text x="396" y="310" font-size="11" fill="#7a5a1b" filter="url(#rough2)">并要求 b·x ≥ h[n] + 1（第 n 人也要死）</text>

  <text x="40" y="372" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">答案 = 最少发数；沿 par 数组从终点倒推每个 k[i]，再输出 k[i] 个 i。</text>
  <text x="40" y="398" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">K = 16 的由来见引理 1：k[i] ≥ 17 时删掉一发，三名相关弓箭手仍全死。</text>
</svg>
