<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：偶数个顶点的路径上换边，二分割不变</text>
  <text x="310" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">PUB 的操作：取简单路径 v1…v(2k)，删一条路径边，再补上 v1–v(2k)</text>

  <!-- path edges -->
  <line x1="92" y1="180" x2="138" y2="180" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="182" y1="180" x2="228" y2="180" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="272" y1="180" x2="318" y2="180" stroke="#b85450" stroke-width="2.6" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <line x1="362" y1="180" x2="408" y2="180" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="452" y1="180" x2="498" y2="180" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- removed edge mark -->
  <text x="295" y="163" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">删这条</text>

  <!-- added edge arc -->
  <path d="M 75 158 Q 295 86 515 158" fill="none" stroke="#4a7a3a" stroke-width="2.2"
        stroke-dasharray="8 5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="295" y="100" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">补上 v1–v(2k)</text>

  <!-- vertices -->
  <circle cx="70" cy="180" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="70" y="184" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">v1</text>
  <circle cx="160" cy="180" r="21" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="184" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">v2</text>
  <circle cx="250" cy="180" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="184" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">v3</text>
  <circle cx="340" cy="180" r="21" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="340" y="184" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">v4</text>
  <circle cx="430" cy="180" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="430" y="184" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">v5</text>
  <circle cx="520" cy="180" r="21" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="520" y="184" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">v6</text>

  <text x="70" y="220" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">A</text>
  <text x="160" y="220" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">B</text>
  <text x="250" y="220" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">A</text>
  <text x="340" y="220" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">B</text>
  <text x="430" y="220" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">A</text>
  <text x="520" y="220" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">B</text>

  <!-- explanation boxes -->
  <rect x="34" y="248" width="256" height="88" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="162" y="272" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">2k 个顶点 ⟹ 2k−1 条边（奇数）</text>
  <text x="162" y="294" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">⟹ v1 与 v(2k) 必然异色</text>
  <text x="162" y="316" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">⟹ 新边两端异色，合法</text>

  <rect x="330" y="248" width="256" height="88" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="458" y="272" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">删掉的边也跨同一条割</text>
  <text x="458" y="294" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">⟹ 同一套 2-染色仍成立</text>
  <text x="458" y="316" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">⟹ 划分 (A,B) 完全不变</text>

  <text x="310" y="366" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">连通图的 2-染色只差整体互换 ⟹ 用顶点 1 定方向，划分正好携带 n−1 比特</text>
  <text x="310" y="386" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">反过来：若操作后是二分图，则操作前也是（同样的奇偶论证）⟹ 非二分性同样保持不变</text>
</svg>
