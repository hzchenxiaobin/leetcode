<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="430" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：mex ≥ x 等价于 0, 1, …, x−1 都当过组最大值</text>
  <path d="M 108 42 Q 380 49 652 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <rect x="45" y="58" width="670" height="40" rx="8" fill="#fafafa" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="380" y="84" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">记 c 为各组最大值组成的集合：mex(c) ≥ x  ⇔  {0, 1, …, x−1} ⊆ c</text>

  <rect x="45" y="116" width="200" height="152" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="145" y="142" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">要求 max = 0 的组</text>
  <text x="145" y="170" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">组内每个元素都 ≤ 0</text>
  <text x="145" y="194" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">⇒ 只能是 k 个 0</text>
  <text x="145" y="226" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">需要 cnt[0] ≥ k</text>
  <text x="145" y="252" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">（最苛刻的一种组）</text>

  <rect x="280" y="116" width="200" height="152" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="142" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">要求 max = 1 的组</text>
  <text x="380" y="170" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">1 个 1 当组长</text>
  <text x="380" y="194" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">其余只能是 0</text>
  <text x="380" y="226" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">需要 cnt[1] ≥ 1</text>
  <text x="380" y="252" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">再加 k−1 个 ≤ 1 的填充</text>

  <rect x="515" y="116" width="200" height="152" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="2.1" filter="url(#rough2)"/>
  <text x="615" y="142" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6015" filter="url(#rough2)">要求 max = v 的组</text>
  <text x="615" y="170" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">1 个 v 当组长</text>
  <text x="615" y="194" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">k−1 个 ≤ v 的填充</text>
  <text x="615" y="226" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">共需 k 个 ≤ v 的数</text>
  <text x="615" y="252" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">组与组不能共用元素</text>

  <path d="M 249 192 L 276 192" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 484 192 L 511 192" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="45" y="288" width="330" height="120" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="312" text-anchor="middle" font-size="14" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">同一数值只需一组</text>
  <text x="60" y="338" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">要多凑一个最大值 v，多开一组没有意义</text>
  <text x="60" y="362" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">重复的 v 只能当 ≤ v 组的填充料</text>
  <text x="60" y="386" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">未使用的元素直接留着，不影响 mex</text>

  <rect x="385" y="288" width="330" height="120" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="550" y="312" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">比 x 大的最大值是“无害”的</text>
  <text x="400" y="338" font-size="12.5" fill="#8a6015" filter="url(#rough2)">c 里多出 x+1、x+2 不会让 mex 变小</text>
  <text x="400" y="362" font-size="12.5" fill="#8a6015" filter="url(#rough2)">故只关心 0…x−1 能否各自凑出一组</text>
  <text x="400" y="386" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">答案 = 最大的可行 x</text>
</svg>
