<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="351" />
      <feDisplacementMap in="SourceGraphic" scale="1.5" />
    </filter>
  </defs>
  <rect width="760" height="430" fill="#fafafa" />
  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">十字只要求 5 个“端点”是星星，不要求中间连续</text>
  <path d="M 110 44 Q 380 50 650 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)" />

  
  <g>
    <rect x="80" y="70" width="350" height="350" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.4" filter="url(#rough2)" />
  </g>
  <g stroke="#e2ddd2" stroke-width="0.8">
    <line x1="130" y1="70" x2="130" y2="420" filter="url(#rough2)" /><line x1="180" y1="70" x2="180" y2="420" filter="url(#rough2)" />
    <line x1="230" y1="70" x2="230" y2="420" filter="url(#rough2)" /><line x1="280" y1="70" x2="280" y2="420" filter="url(#rough2)" />
    <line x1="330" y1="70" x2="330" y2="420" filter="url(#rough2)" /><line x1="380" y1="70" x2="380" y2="420" filter="url(#rough2)" />
    <line x1="80" y1="120" x2="430" y2="120" filter="url(#rough2)" /><line x1="80" y1="170" x2="430" y2="170" filter="url(#rough2)" />
    <line x1="80" y1="220" x2="430" y2="220" filter="url(#rough2)" /><line x1="80" y1="270" x2="430" y2="270" filter="url(#rough2)" />
    <line x1="80" y1="320" x2="430" y2="320" filter="url(#rough2)" /><line x1="80" y1="370" x2="430" y2="370" filter="url(#rough2)" />
  </g>

  
  <circle cx="255" cy="245" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)" />
  <circle cx="255" cy="95" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)" />
  <circle cx="255" cy="395" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)" />
  <circle cx="105" cy="245" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)" />
  <circle cx="405" cy="245" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)" />

  <line x1="255" y1="232" x2="255" y2="108" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)" />
  <line x1="255" y1="258" x2="255" y2="382" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)" />
  <line x1="242" y1="245" x2="118" y2="245" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)" />
  <line x1="268" y1="245" x2="392" y2="245" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)" />

  <text x="255" y="250" text-anchor="middle" font-size="10" fill="#2f4a66" filter="url(#rough2)">C</text>
  <text x="255" y="82" text-anchor="middle" font-size="10" fill="#2f5223" filter="url(#rough2)">U</text>
  <text x="255" y="415" text-anchor="middle" font-size="10" fill="#2f5223" filter="url(#rough2)">D</text>
  <text x="88" y="249" text-anchor="middle" font-size="10" fill="#2f5223" filter="url(#rough2)">L</text>
  <text x="420" y="249" text-anchor="middle" font-size="10" fill="#2f5223" filter="url(#rough2)">R</text>

  <text x="255" y="135" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">中间可以是空的</text>

  
  <rect x="450" y="70" width="276" height="250" rx="10" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.5" filter="url(#rough2)" />
  <text x="468" y="98" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">半径 x = 3 的十字</text>
  <text x="468" y="124" font-size="11.5" fill="#555" filter="url(#rough2)">中心 (4,4)，上 (1,4)，下 (7,4)，</text>
  <text x="468" y="146" font-size="11.5" fill="#555" filter="url(#rough2)">左 (4,1)，右 (4,7)。</text>
  <text x="468" y="176" font-size="11.5" fill="#8a3b36" filter="url(#rough2)">第 2 行第 4 列是空的，但半径 3 仍合法：</text>
  <text x="468" y="198" font-size="11.5" fill="#8a3b36" filter="url(#rough2)">只检查距离恰好为 x 的四个端点。</text>
  <text x="468" y="228" font-size="11.5" fill="#2f5223" filter="url(#rough2)">因此合法半径不单调：x=1 合法、x=2 不合法、</text>
  <text x="468" y="250" font-size="11.5" fill="#2f5223" filter="url(#rough2)">x=3 又合法，不能“遇到空就 break”。</text>
  <text x="468" y="280" font-size="11.5" fill="#555" filter="url(#rough2)">枚举每个中心的所有 x，逐个检查四个端点。</text>

  
  <rect x="60" y="320" width="350" height="78" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)" />
  <text x="78" y="346" font-size="11.5" fill="#8a6015" filter="url(#rough2)">N,M ≤ 300，中心 O(NM) 个，</text>
  <text x="78" y="368" font-size="11.5" fill="#8a6015" filter="url(#rough2)">每个中心最多 min(N,M)/2 个半径，</text>
  <text x="78" y="390" font-size="11.5" fill="#8a6015" filter="url(#rough2)">总检查量约 1.35×10⁷，可接受。</text>
</svg>