<svg xmlns="http://www.w3.org/2000/svg" width="780" height="392" viewBox="0 0 780 392"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="780" height="392" fill="#fafafa" filter="url(#rough2)"/>
  <text x="390" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每个后缀是一个函数 A_p(x)：带 x 元进场，最后剩多少</text>
  <path d="M 120 44 Q 390 49 660 44" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <text x="26" y="118" text-anchor="start" font-size="15" font-weight="bold" fill="#b85450" filter="url(#rough2)">x</text>
  <path d="M 44 113 L 78 113" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="84" y="88" width="86" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="127" y="119" text-anchor="middle" font-size="14" fill="#2b3a4a" filter="url(#rough2)">第 p 天</text>
  <path d="M 174 113 L 206 113" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="212" y="88" width="86" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="255" y="119" text-anchor="middle" font-size="14" fill="#2b3a4a" filter="url(#rough2)">第 p+1 天</text>
  <path d="M 302 113 L 330 113" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="346" y="120" text-anchor="middle" font-size="17" fill="#888" filter="url(#rough2)">· · ·</text>
  <path d="M 380 113 L 410 113" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="416" y="88" width="86" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="459" y="119" text-anchor="middle" font-size="14" fill="#2b3a4a" filter="url(#rough2)">第 n 天</text>
  <path d="M 506 113 L 540 113" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="550" y="119" text-anchor="start" font-size="15" font-weight="bold" fill="#b85450" filter="url(#rough2)">A_p(x)</text>

  <rect x="84" y="158" width="426" height="74" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="184" text-anchor="start" font-size="14" fill="#2f4d24" filter="url(#rough2)">单日规则：x ≥ a 时休息，花掉 a，余额 x−a</text>
  <text x="100" y="212" text-anchor="start" font-size="14" fill="#2f4d24" filter="url(#rough2)">　　　　　x &lt; a 时工作，赚到 a，余额 x+a</text>

  <path d="M 127 140 L 127 156" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <rect x="84" y="250" width="152" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="272" text-anchor="middle" font-size="12" fill="#6b4e12" filter="url(#rough2)">空后缀（第 n+1 天起）</text>
  <text x="160" y="292" text-anchor="middle" font-size="14" font-weight="bold" fill="#6b4e12" filter="url(#rough2)">A_{n+1}(x) = x</text>
  <text x="252" y="280" text-anchor="start" font-size="14" fill="#446688" filter="url(#rough2)">A_p = f_n ∘ f_{n−1} ∘ ··· ∘ f_p</text>

  <path d="M 160 302 L 160 320" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <rect x="84" y="324" width="620" height="56" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="100" y="347" text-anchor="start" font-size="14" fill="#7a2f2c" filter="url(#rough2)">答案 F(p) = A_p(0) = A_{p+1}(a_p)，因为 0 &lt; a_p 第一天必然工作</text>
  <text x="100" y="369" text-anchor="start" font-size="12" fill="#7a2f2c" filter="url(#rough2)">余额始终在 [0,2n] 内 ⇒ A_p 就是长度 2n+1 的数组，问题变成“维护数组的版本”</text>
</svg>
