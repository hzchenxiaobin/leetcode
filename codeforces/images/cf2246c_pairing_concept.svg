<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="690" height="440" fill="#fafafa"/>

  <text x="345" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">零交替和 = 配对之后的「间隙和」为 0</text>

  <rect x="18" y="52" width="322" height="352" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="179" y="80" text-anchor="middle" font-size="14.5" fill="#223" filter="url(#rough2)">偶数长度 2k：全部拆成相等对</text>

  <rect x="79" y="98" width="44" height="36" rx="5" fill="#fafafa" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="131" y="98" width="44" height="36" rx="5" fill="#fafafa" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="183" y="98" width="44" height="36" rx="5" fill="#fafafa" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="235" y="98" width="44" height="36" rx="5" fill="#fafafa" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="101" y="121" text-anchor="middle" font-size="13" fill="#223" filter="url(#rough2)">b1</text>
  <text x="153" y="121" text-anchor="middle" font-size="13" fill="#223" filter="url(#rough2)">b2</text>
  <text x="205" y="121" text-anchor="middle" font-size="13" fill="#223" filter="url(#rough2)">b3</text>
  <text x="257" y="121" text-anchor="middle" font-size="13" fill="#223" filter="url(#rough2)">b4</text>
  <rect x="74" y="93" width="102" height="46" rx="7" fill="none" stroke="#b85450" stroke-width="1.5"
        stroke-dasharray="6 3" filter="url(#rough2)"/>
  <rect x="180" y="93" width="102" height="46" rx="7" fill="none" stroke="#b85450" stroke-width="1.5"
        stroke-dasharray="6 3" filter="url(#rough2)"/>

  <text x="179" y="175" text-anchor="middle" font-size="13" fill="#223" filter="url(#rough2)">S = −(b2 − b1) − (b4 − b3) ≤ 0</text>
  <text x="179" y="202" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">非降序 ⇒ 每个间隙 b(2j) − b(2j−1) ≥ 0</text>
  <text x="179" y="228" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">⇒ S = 0 当且仅当每对下标取值相等</text>

  <rect x="36" y="248" width="286" height="138" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="179" y="276" text-anchor="middle" font-size="13" fill="#223" filter="url(#rough2)">只有同值元素才能配对</text>
  <text x="179" y="304" text-anchor="middle" font-size="13" fill="#223" filter="url(#rough2)">同一值块内选偶数个 2r 个</text>
  <text x="179" y="332" text-anchor="middle" font-size="13" fill="#223" filter="url(#rough2)">配对顺序由下标唯一确定</text>
  <text x="179" y="362" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">贡献 Σ C(s, 2r) = 2^(s−1)</text>

  <rect x="350" y="52" width="322" height="352" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="511" y="80" text-anchor="middle" font-size="14.5" fill="#223" filter="url(#rough2)">奇数长度 2k+1：首项必须是 −1</text>

  <rect x="412" y="98" width="34" height="36" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="453" y="98" width="34" height="36" rx="5" fill="#fafafa" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="494" y="98" width="34" height="36" rx="5" fill="#fafafa" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="535" y="98" width="34" height="36" rx="5" fill="#fafafa" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="576" y="98" width="34" height="36" rx="5" fill="#fafafa" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="429" y="121" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">−1</text>
  <text x="470" y="121" text-anchor="middle" font-size="13" fill="#223" filter="url(#rough2)">b2</text>
  <text x="511" y="121" text-anchor="middle" font-size="13" fill="#223" filter="url(#rough2)">b3</text>
  <text x="552" y="121" text-anchor="middle" font-size="13" fill="#223" filter="url(#rough2)">b4</text>
  <text x="593" y="121" text-anchor="middle" font-size="13" fill="#223" filter="url(#rough2)">b5</text>
  <rect x="449" y="93" width="82" height="46" rx="7" fill="none" stroke="#b85450" stroke-width="1.5"
        stroke-dasharray="6 3" filter="url(#rough2)"/>
  <rect x="532" y="93" width="82" height="46" rx="7" fill="none" stroke="#b85450" stroke-width="1.5"
        stroke-dasharray="6 3" filter="url(#rough2)"/>

  <text x="511" y="175" text-anchor="middle" font-size="13" fill="#223" filter="url(#rough2)">S = −1 + (b3 − b2) + (b5 − b4)</text>
  <text x="511" y="202" text-anchor="middle" font-size="12.5" fill="#b06a10" filter="url(#rough2)">首项 &gt; 0 时 S &gt; 0，故首项只能取 −1</text>
  <text x="511" y="228" text-anchor="middle" font-size="12.5" fill="#b06a10" filter="url(#rough2)">⇒ S = 0 当且仅当各间隙之和恰为 1</text>

  <rect x="368" y="248" width="286" height="138" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="511" y="276" text-anchor="middle" font-size="13" fill="#223" filter="url(#rough2)">恰有一对跨到相邻值 x 与 x+1</text>
  <text x="511" y="304" text-anchor="middle" font-size="13" fill="#223" filter="url(#rough2)">该对来自相邻两个值块</text>
  <text x="511" y="332" text-anchor="middle" font-size="13" fill="#223" filter="url(#rough2)">其余各对仍然是相等对</text>
  <text x="511" y="362" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">数量 = 2^(c−1+P−B') · G</text>

  <text x="345" y="427" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">c 是 −1 的个数，P 是正数个数，B' 是正数块数，G 是相邻块值差恰为 1 的对数</text>
</svg>
