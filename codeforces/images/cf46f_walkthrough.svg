<svg xmlns="http://www.w3.org/2000/svg" width="780" height="430" viewBox="0 0 780 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1609"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="780" height="430" fill="#fafafa"/>
  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">样例 2 走查：闭包只合并出 {1,2}，钥匙 4 跨不过去</text>

  <rect x="40" y="56" width="700" height="28" fill="#eef1f4" stroke="#7a8ca6" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="56" y="75" font-size="10.5" font-weight="bold" fill="#33445c" filter="url(#rough2)">门</text>
  <text x="180" y="75" font-size="10.5" font-weight="bold" fill="#33445c" filter="url(#rough2)">连接</text>
  <text x="300" y="75" font-size="10.5" font-weight="bold" fill="#33445c" filter="url(#rough2)">钥匙周四持有人</text>
  <text x="520" y="75" font-size="10.5" font-weight="bold" fill="#33445c" filter="url(#rough2)">判断</text>

  <rect x="40" y="84" width="700" height="26" fill="#ffffff" stroke="#d6d6d6" stroke-width="1" filter="url(#rough2)"/>
  <text x="56" y="102" font-size="10.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="180" y="102" font-size="10.5" fill="#555" filter="url(#rough2)">1–3</text>
  <text x="300" y="102" font-size="10.5" fill="#555" filter="url(#rough2)">Edvard（房间 4）</text>
  <text x="520" y="102" font-size="10" fill="#c0392b" filter="url(#rough2)">区域 {4} 不含 1 或 3 → 不能</text>

  <rect x="40" y="110" width="700" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="56" y="128" font-size="10.5" fill="#2f5223" filter="url(#rough2)">2</text>
  <text x="180" y="128" font-size="10.5" fill="#2f5223" filter="url(#rough2)">1–2</text>
  <text x="300" y="128" font-size="10.5" fill="#2f5223" filter="url(#rough2)">Dmitry（房间 1）</text>
  <text x="520" y="128" font-size="10" fill="#2f5223" filter="url(#rough2)">区域 {1} 含 1 ✓ → 合并 1、2</text>

  <rect x="40" y="136" width="700" height="26" fill="#ffffff" stroke="#d6d6d6" stroke-width="1" filter="url(#rough2)"/>
  <text x="56" y="154" font-size="10.5" fill="#555" filter="url(#rough2)">3</text>
  <text x="180" y="154" font-size="10.5" fill="#555" filter="url(#rough2)">2–3</text>
  <text x="300" y="154" font-size="10.5" fill="#555" filter="url(#rough2)">Edvard（房间 4）</text>
  <text x="520" y="154" font-size="10" fill="#c0392b" filter="url(#rough2)">区域 {4} 不含 2 或 3 → 不能</text>

  <rect x="40" y="162" width="700" height="26" fill="#ffffff" stroke="#d6d6d6" stroke-width="1" filter="url(#rough2)"/>
  <text x="56" y="180" font-size="10.5" fill="#555" filter="url(#rough2)">4</text>
  <text x="180" y="180" font-size="10.5" fill="#555" filter="url(#rough2)">3–4</text>
  <text x="300" y="180" font-size="10.5" fill="#555" filter="url(#rough2)">Artem（房间 1）</text>
  <text x="520" y="180" font-size="10" fill="#c0392b" filter="url(#rough2)">区域 {1,2} 不含 3 或 4 → 不能</text>

  <rect x="40" y="196" width="700" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="56" y="216" font-size="11" font-weight="bold" fill="#8a6015" filter="url(#rough2)">第二轮扫描无变化 → 最终划分：{1,2}、{3}、{4}</text>

  <!-- 判定 -->
  <rect x="40" y="240" width="700" height="94" rx="9" fill="#fdeef0" stroke="#b85450"
        stroke-width="1.3" filter="url(#rough2)"/>
  <text x="56" y="264" font-size="11" fill="#8c3b37" filter="url(#rough2)">人：Artem 房间 1 → 房间 2（都在 {1,2}）✓；Dmitry 1 → 1 ✓；Edvard 4 → 4 ✓</text>
  <text x="56" y="288" font-size="11" fill="#8c3b37" filter="url(#rough2)">钥匙 4：周四在 Artem（区域 {1,2}），周五在 Edvard（区域 {4}）→ 跨区域 ✗</text>
  <text x="56" y="312" font-size="11" font-weight="bold" fill="#8c3b37" filter="url(#rough2)">结论：NO（钥匙 4 不可能从 {1,2} 传到 {4}）</text>

  <text x="40" y="360" font-size="10.5" fill="#666" filter="url(#rough2)">区域 {1,2} 里的钥匙是 2 和 4：2 号已在第 1 轮用来合并；4 号对应门 3–4，但 3 号房间不在区域内，够不到。</text>
  <text x="40" y="382" font-size="10.5" fill="#666" filter="url(#rough2)">Edvard 在房间 4，手里是 1、3 号钥匙；它们对应的门（1–3、2–3）也都不挨着房间 4。</text>
  <text x="40" y="404" font-size="10.5" fill="#8c3b37" filter="url(#rough2)">所以三个区域互相封闭，任何人和钥匙都跨不过去——与周五的描述矛盾。</text>
</svg>
