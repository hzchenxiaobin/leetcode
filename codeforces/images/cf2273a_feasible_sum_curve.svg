<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="680" height="440" fill="#fafafa"/>

  <text x="340" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">容量函数 f(K) 单调递增 → 二分最小可行 K</text>
  <text x="340" y="50" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">固定代价上限 K，反推「最多能装多少橘子」：f = 1, 4, 8, 15, 21, 33, 41</text>

  <g filter="url(#rough2)">
    <rect x="100" y="325" width="36" height="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="170" y="310" width="36" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="270" y="290" width="36" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.6"/>
    <rect x="340" y="255" width="36" height="75" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="410" y="225" width="36" height="105" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="480" y="165" width="36" height="165" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="550" y="125" width="36" height="205" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>

  <g font-size="12.5" text-anchor="middle" fill="#33517a">
    <text x="118" y="317" filter="url(#rough2)">1</text>
    <text x="188" y="302" filter="url(#rough2)">4</text>
    <text x="288" y="282" fill="#8e3b36" font-weight="bold" filter="url(#rough2)">8</text>
    <text x="358" y="247" filter="url(#rough2)">15</text>
    <text x="428" y="217" filter="url(#rough2)">21</text>
    <text x="498" y="157" filter="url(#rough2)">33</text>
    <text x="568" y="117" filter="url(#rough2)">41</text>
  </g>

  <g filter="url(#rough2)" stroke="#3a3a3a" stroke-width="1.8" fill="none">
    <path d="M 90 330 L 620 330"/>
    <path d="M 90 330 L 90 88"/>
  </g>
  <text x="626" y="335" font-size="12" fill="#333" filter="url(#rough2)">K</text>
  <text x="70" y="86" font-size="12" fill="#333" filter="url(#rough2)">f(K)</text>

  <g font-size="12" text-anchor="middle" fill="#666">
    <text x="118" y="348" filter="url(#rough2)">1</text>
    <text x="188" y="348" filter="url(#rough2)">2</text>
    <text x="288" y="348" filter="url(#rough2)">3</text>
    <text x="358" y="348" filter="url(#rough2)">4</text>
    <text x="428" y="348" filter="url(#rough2)">5</text>
    <text x="498" y="348" filter="url(#rough2)">6</text>
    <text x="568" y="348" filter="url(#rough2)">7</text>
  </g>

  <path d="M 100 290 L 612 290" stroke="#b85450" stroke-width="1.4" stroke-dasharray="7 5" fill="none" filter="url(#rough2)"/>
  <text x="101" y="286" text-anchor="start" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">n = 8</text>

  <g font-size="11.5" fill="#555">
    <text x="118" y="104" filter="url(#rough2)">f(K)：代价 ≤ K 时最多能装的橘子数</text>
    <text x="118" y="126" filter="url(#rough2)">f(2) = 4 &lt; 8 ≤ f(3) = 8</text>
    <text x="118" y="148" filter="url(#rough2)">⇒ 最小可行 K* = 3（n = 8）</text>
    <text x="118" y="174" filter="url(#rough2)">f(3) = 8 恰好等于 n，柱子顶端触线</text>
  </g>
  <path d="M 265 182 Q 282 240 292 286" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="56" y="362" width="568" height="62" rx="10" fill="#ffffff" stroke="#b8b8a8" stroke-width="1.3"/>
  </g>
  <text x="340" y="386" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">f(K) = Σ i·⌊K/i⌋（i = 1…K）；f(K) − f(K−1) = σ(K) &gt; 0 ⇒ 严格递增</text>
  <text x="340" y="408" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">K* ≈ 1.1·√n，n = 2·10⁵ 时 K* = 494：每组 O(K log K)</text>
</svg>
