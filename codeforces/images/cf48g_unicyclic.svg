<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="420" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="38" text-anchor="middle" font-size="18.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">48G：n 点 n 边连通图 = 单环图（环 + 若干挂树）</text>
  <path d="M 137 50 Q 380 56 623 50" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <line x1="200" y1="220" x2="340" y2="160" stroke="#446688" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="270" y="182" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="normal" filter="url(#rough2)">w</text>
  <line x1="340" y1="160" x2="500" y2="190" stroke="#446688" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="420" y="167" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="normal" filter="url(#rough2)">w</text>
  <line x1="500" y1="190" x2="600" y2="290" stroke="#446688" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="550" y="232" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="normal" filter="url(#rough2)">w</text>
  <line x1="600" y1="290" x2="420" y2="320" stroke="#446688" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="510" y="297" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="normal" filter="url(#rough2)">w</text>
  <line x1="420" y1="320" x2="200" y2="220" stroke="#446688" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="310" y="262" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="normal" filter="url(#rough2)">w</text>
  <circle cx="200" cy="220" r="8" fill="#446688" stroke="none" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="340" cy="160" r="8" fill="#446688" stroke="none" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="500" cy="190" r="8" fill="#446688" stroke="none" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="600" cy="290" r="8" fill="#446688" stroke="none" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="420" cy="320" r="8" fill="#446688" stroke="none" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="200" y1="220" x2="140" y2="280" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="140" cy="280" r="6" fill="#4a7a3a" stroke="none" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="140" y1="280" x2="120" y2="340" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="120" cy="340" r="6" fill="#4a7a3a" stroke="none" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="500" y1="190" x2="530" y2="110" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="530" cy="110" r="6" fill="#4a7a3a" stroke="none" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="530" y1="110" x2="600" y2="90" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="600" cy="90" r="6" fill="#4a7a3a" stroke="none" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="420" y1="320" x2="430" y2="380" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="430" cy="380" r="6" fill="#4a7a3a" stroke="none" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="84" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">先把所有度为 1 的点剥掉（拓扑剥叶），剩下的就是唯一的环。</text>
  <text x="60" y="110" text-anchor="start" font-size="11.5" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">每个环点挂着一棵树；把树内的距离用换根 DP 算好，环上的距离用“环形前缀 + 双指针”。</text>
  <rect x="60" y="330" width="640" height="76" rx="10" fill="#fff3e0" stroke="#c9801f" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="76" y="358" text-anchor="start" font-size="11.5" fill="#7a4a10" font-weight="bold" filter="url(#rough2)">答案(树 i 中的点 u) = 树内距离和(u) + dist(u,环点) · (n − |树 i|) + out[i]</text>
  <text x="76" y="384" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">out[i] = Σ_{j≠i} ( |树 j| · d(i,j) ) + Σ_{j≠i} 树内距离和(环点 j)</text>
</svg>
