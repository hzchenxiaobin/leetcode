<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 428" width="780" height="428"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.3"/>
    </filter>
    <marker id="ar3" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="780" height="428" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 5 走查：b = [1,3,2,5,4,3,1,2]（n = 5, m = 8）</text>
  <text x="390" y="52" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">合法位置 = 「所有更小（更大）的值在它后面还有出现」，用 last 的前缀/后缀最小值一次算出</text>

  <!-- 表头 -->
  <rect x="24" y="66" width="732" height="34" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="58" y="88" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">v</text>
  <text x="136" y="88" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">出现位置</text>
  <text x="230" y="88" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">M(v)</text>
  <text x="290" y="88" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">prefM</text>
  <text x="348" y="88" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">sufM</text>
  <text x="430" y="88" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33582a" filter="url(#rough2)">A 合法位置</text>
  <text x="524" y="88" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8c3b38" filter="url(#rough2)">B 合法位置</text>
  <text x="616" y="88" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">f[v]</text>
  <text x="676" y="88" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">g[v]</text>

  <!-- 行 1 -->
  <rect x="24" y="102" width="732" height="32" rx="6" fill="#ffffff" stroke="#dcdcdc" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="58" y="123" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="136" y="123" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1, 7</text>
  <text x="230" y="123" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">7</text>
  <text x="290" y="123" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">∞</text>
  <text x="348" y="123" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="430" y="123" text-anchor="middle" font-size="11.5" fill="#33582a" filter="url(#rough2)">1, 7</text>
  <text x="524" y="123" text-anchor="middle" font-size="11.5" fill="#8c3b38" filter="url(#rough2)">1</text>
  <text x="616" y="123" text-anchor="middle" font-size="11.5" fill="#33582a" filter="url(#rough2)">1</text>
  <text x="676" y="123" text-anchor="middle" font-size="11.5" fill="#8c3b38" filter="url(#rough2)">3</text>

  <!-- 行 2 -->
  <rect x="24" y="136" width="732" height="32" rx="6" fill="#ffffff" stroke="#dcdcdc" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="58" y="157" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="136" y="157" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3, 8</text>
  <text x="230" y="157" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">8</text>
  <text x="290" y="157" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">7</text>
  <text x="348" y="157" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="430" y="157" text-anchor="middle" font-size="11.5" fill="#33582a" filter="url(#rough2)">3</text>
  <text x="524" y="157" text-anchor="middle" font-size="11.5" fill="#8c3b38" filter="url(#rough2)">3</text>
  <text x="616" y="157" text-anchor="middle" font-size="11.5" fill="#33582a" filter="url(#rough2)">2</text>
  <text x="676" y="157" text-anchor="middle" font-size="11.5" fill="#8c3b38" filter="url(#rough2)">2</text>

  <!-- 行 3 -->
  <rect x="24" y="170" width="732" height="32" rx="6" fill="#fcfcfc" stroke="#dcdcdc" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="58" y="191" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="136" y="191" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2, 6</text>
  <text x="230" y="191" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">6</text>
  <text x="290" y="191" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">7</text>
  <text x="348" y="191" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="430" y="191" text-anchor="middle" font-size="11.5" fill="#33582a" filter="url(#rough2)">2, 6</text>
  <text x="524" y="191" text-anchor="middle" font-size="11.5" fill="#8c3b38" filter="url(#rough2)">2</text>
  <text x="616" y="191" text-anchor="middle" font-size="11.5" fill="#33582a" filter="url(#rough2)">3</text>
  <text x="676" y="191" text-anchor="middle" font-size="11.5" fill="#8c3b38" filter="url(#rough2)">2</text>

  <!-- 行 4 -->
  <rect x="24" y="204" width="732" height="32" rx="6" fill="#ffffff" stroke="#dcdcdc" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="58" y="225" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="136" y="225" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="230" y="225" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="290" y="225" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="348" y="225" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="430" y="225" text-anchor="middle" font-size="11.5" fill="#33582a" filter="url(#rough2)">5</text>
  <text x="524" y="225" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">无</text>
  <text x="616" y="225" text-anchor="middle" font-size="11.5" fill="#33582a" filter="url(#rough2)">3</text>
  <text x="676" y="225" text-anchor="middle" font-size="11.5" fill="#999" filter="url(#rough2)">0</text>

  <!-- 行 5 -->
  <rect x="24" y="238" width="732" height="32" rx="6" fill="#fcfcfc" stroke="#dcdcdc" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="58" y="259" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="136" y="259" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="230" y="259" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="290" y="259" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">6</text>
  <text x="348" y="259" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">∞</text>
  <text x="430" y="259" text-anchor="middle" font-size="11.5" fill="#33582a" filter="url(#rough2)">4</text>
  <text x="524" y="259" text-anchor="middle" font-size="11.5" fill="#8c3b38" filter="url(#rough2)">4</text>
  <text x="616" y="259" text-anchor="middle" font-size="11.5" fill="#33582a" filter="url(#rough2)">4</text>
  <text x="676" y="259" text-anchor="middle" font-size="11.5" fill="#8c3b38" filter="url(#rough2)">1</text>

  <text x="24" y="288" font-size="10.5" fill="#888" filter="url(#rough2)">注：表格中的位置按 1-indexed 写，判断一律用严格小于；A 链必须以值 1 收尾、B 链必须以值 n 收尾，接不上记 0。</text>

  <!-- 合并结果 -->
  <rect x="24" y="300" width="732" height="46" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="320" text-anchor="middle" font-size="12.5" fill="#8a6410" filter="url(#rough2)">max{ f[i] + g[j] : i &lt; j } = f[3] + g[5] = 3 + 1 = 4</text>
  <text x="390" y="338" text-anchor="middle" font-size="11.5" fill="#8a6410" filter="url(#rough2)">左链 3@2 → 2@3 → 1@7（下降）　右链 5@4（上升）　i = 3 &lt; j = 5</text>

  <path d="M 390 348 L 390 366" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#ar3)" filter="url(#rough2)"/>

  <rect x="150" y="370" width="480" height="44" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="389" text-anchor="middle" font-size="13" font-weight="bold" fill="#33582a" filter="url(#rough2)">答案 = n − 4 = 5 − 4 = 1</text>
  <text x="390" y="407" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">免费的是 {1, 2, 3} ∪ {5}；只有值 4 被夹在中间，故障插入一次</text>
</svg>
