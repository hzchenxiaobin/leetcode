<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：n = 5，m = 3，a = (2, 1, 2, 3, 2)</text>
  <text x="360" y="54" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">dpₚ(b) = 前缀 1..p 的最大匹配数且 bₚ = b；−∞ = 不可达</text>

  <rect x="30" y="72" width="660" height="36" fill="#f1f1f1" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="87" y="95" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#rough2)">p</text>
  <text x="192" y="95" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#rough2)">aₚ</text>
  <text x="300" y="95" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#rough2)">bₚ = 1</text>
  <text x="420" y="95" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#rough2)">bₚ = 2</text>
  <text x="540" y="95" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#rough2)">bₚ = 3</text>
  <text x="645" y="95" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#rough2)">M</text>

  <rect x="30" y="108" width="115" height="36" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="145" y="108" width="95" height="36" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="240" y="108" width="120" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="360" y="108" width="120" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="480" y="108" width="120" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="600" y="108" width="90" height="36" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="87" y="131" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="192" y="131" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="300" y="131" text-anchor="middle" font-size="13.5" fill="#2f5a24" filter="url(#rough2)">0</text>
  <text x="420" y="131" text-anchor="middle" font-size="13.5" fill="#8a3b38" filter="url(#rough2)">−∞</text>
  <text x="540" y="131" text-anchor="middle" font-size="13.5" fill="#8a3b38" filter="url(#rough2)">−∞</text>
  <text x="645" y="131" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">0</text>

  <rect x="30" y="144" width="115" height="36" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="145" y="144" width="95" height="36" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="240" y="144" width="120" height="36" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="360" y="144" width="120" height="36" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="480" y="144" width="120" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="600" y="144" width="90" height="36" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="87" y="167" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="192" y="167" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="300" y="167" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="420" y="167" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="540" y="167" text-anchor="middle" font-size="13.5" fill="#8a3b38" filter="url(#rough2)">−∞</text>
  <text x="645" y="167" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">1</text>

  <rect x="30" y="180" width="115" height="36" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="145" y="180" width="95" height="36" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="240" y="180" width="120" height="36" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="360" y="180" width="120" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="480" y="180" width="120" height="36" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="600" y="180" width="90" height="36" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="87" y="203" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="192" y="203" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="300" y="203" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="420" y="203" text-anchor="middle" font-size="13.5" fill="#8a6d2f" filter="url(#rough2)">2</text>
  <text x="540" y="203" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="645" y="203" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">2</text>

  <rect x="30" y="216" width="115" height="36" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="145" y="216" width="95" height="36" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="240" y="216" width="120" height="36" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="360" y="216" width="120" height="36" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="480" y="216" width="120" height="36" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="600" y="216" width="90" height="36" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="87" y="239" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="192" y="239" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="300" y="239" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="420" y="239" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="540" y="239" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="645" y="239" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">3</text>

  <rect x="30" y="252" width="115" height="36" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="145" y="252" width="95" height="36" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="240" y="252" width="120" height="36" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="360" y="252" width="120" height="36" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="480" y="252" width="120" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <rect x="600" y="252" width="90" height="36" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="87" y="275" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="192" y="275" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="300" y="275" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="420" y="275" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="540" y="275" text-anchor="middle" font-size="13.5" fill="#7a5a1e" filter="url(#rough2)">3</text>
  <text x="645" y="275" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">4</text>

  <path d="M 540 318 L 540 292" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="360" y="340" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">答案 = n − dpₙ(m) = 5 − 3 = 2</text>
  <text x="360" y="364" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">橙色格 (p=3, b=2) 由对角线 c = a₃ − 3 = −1 的值 1 加一得到；绿色格是唯一初值</text>
</svg>
