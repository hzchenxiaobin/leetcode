<svg xmlns="http://www.w3.org/2000/svg" width="840" height="466" viewBox="0 0 840 466"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="840" height="466" fill="#fafafa" filter="url(#rough2)"/>
  <text x="420" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">三条分支：同块 / 跨块且 l 小 / 跨块且 l 大</text>
  <path d="M 200 42 Q 420 47 640 42" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 145 62 L 275 88 L 145 114 L 15 88 Z" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="145" y="93" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">len(l) = len(r) ?</text>
  <path d="M 675 62 L 800 88 L 675 114 L 550 88 Z" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="675" y="93" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">l ≤ 2^(k−1) ?</text>
  <path d="M 278 88 Q 400 78 546 88" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="412" y="74" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">否：跨块，P = 2^k, k = ⌊log2 r⌋</text>
  <text x="190" y="140" text-anchor="start" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">是</text>
  <path d="M 145 118 L 145 196" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="688" y="140" text-anchor="start" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">是</text>
  <path d="M 690 118 L 700 196" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="566" y="158" text-anchor="start" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">否</text>
  <path d="M 636 116 Q 566 168 476 196" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="25" y="200" width="240" height="152" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="145" y="224" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#446688" filter="url(#rough2)">① 同块：p = q = m</text>
  <path d="M 45 232 Q 145 236 245 232" stroke="#446688" stroke-width="1.0" fill="none" filter="url(#rough2)"/>
  <text x="39" y="254" text-anchor="start" font-size="11.2" fill="#3b3b3b" filter="url(#rough2)">取 x = l（低 m 位最小）</text>
  <text x="39" y="276" text-anchor="start" font-size="11.2" fill="#3b3b3b" filter="url(#rough2)">找最小零位 j，满足</text>
  <text x="39" y="298" text-anchor="start" font-size="11.2" fill="#3b3b3b" filter="url(#rough2)">b_j = 高位接 1 再补 0</text>
  <text x="39" y="320" text-anchor="start" font-size="11.2" fill="#3b3b3b" filter="url(#rough2)">且 b_j ≤ r</text>
  <text x="39" y="342" text-anchor="start" font-size="11.2" fill="#3b3b3b" filter="url(#rough2)">输出 l 低 m−j 位清零</text>
  <rect x="300" y="200" width="240" height="152" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="420" y="224" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">② l ≤ 2^(k−1)</text>
  <path d="M 320 232 Q 420 236 520 232" stroke="#4a7a3a" stroke-width="1.0" fill="none" filter="url(#rough2)"/>
  <text x="314" y="254" text-anchor="start" font-size="11.2" fill="#3b3b3b" filter="url(#rough2)">取 x = 2^(k−1), y = 2^k</text>
  <text x="314" y="276" text-anchor="start" font-size="11.2" fill="#3b3b3b" filter="url(#rough2)">两者都只有一个 1</text>
  <text x="314" y="298" text-anchor="start" font-size="11.2" fill="#3b3b3b" filter="url(#rough2)">唯一 1 间距 = k(k+1)</text>
  <text x="314" y="320" text-anchor="start" font-size="11.2" fill="#3b3b3b" filter="url(#rough2)">输出 1，再跟</text>
  <text x="314" y="342" text-anchor="start" font-size="11.2" fill="#3b3b3b" filter="url(#rough2)">k(k+1)−1 个 0 循环</text>
  <rect x="575" y="200" width="240" height="152" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="695" y="224" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">③ l > 2^(k−1)</text>
  <path d="M 595 232 Q 695 236 795 232" stroke="#b85450" stroke-width="1.0" fill="none" filter="url(#rough2)"/>
  <text x="589" y="254" text-anchor="start" font-size="11.2" fill="#3b3b3b" filter="url(#rough2)">取 x = l, y = 2^k</text>
  <text x="589" y="276" text-anchor="start" font-size="11.2" fill="#3b3b3b" filter="url(#rough2)">只看位置 1+t(k+1)</text>
  <text x="589" y="298" text-anchor="start" font-size="11.2" fill="#3b3b3b" filter="url(#rough2)">该位 = l 的第 t mod k 位</text>
  <text x="589" y="320" text-anchor="start" font-size="11.2" fill="#3b3b3b" filter="url(#rough2)">（l 恰有 k 位, y 有 k+1 位）</text>
  <text x="589" y="342" text-anchor="start" font-size="11.2" fill="#3b3b3b" filter="url(#rough2)">其余位置全 0</text>
  <rect x="34" y="376" width="772" height="66" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="50" y="400" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">三种情形的答案都是一段长度 ≤ k(k+1) ≤ 870 的周期，按 n 取前 n 位即可。</text>
  <text x="50" y="426" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">关键上界：任何一对 (x,y) 的第二个 1 都在位置 ≤ 1 + lcm(|x|,|y|) ≤ 1 + k(k+1)。</text>
</svg>
