<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="231" />
      <feDisplacementMap in="SourceGraphic" scale="1.5" />
    </filter>
  </defs>

  <rect width="760" height="420" fill="#fafafa" />

  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">答案 = 所有后缀对的最长公共前缀的最大值</text>
  <path d="M 120 44 Q 380 50 640 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)" />

  
  <text x="100" y="82" font-size="11.5" fill="#555" filter="url(#rough2)">s = ababa</text>
  <g>
    <rect x="100" y="92" width="56" height="52" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)" />
    <rect x="164" y="92" width="56" height="52" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)" />
    <rect x="228" y="92" width="56" height="52" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)" />
    <rect x="292" y="92" width="56" height="52" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)" />
    <rect x="356" y="92" width="56" height="52" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)" />
  </g>
  <text x="128" y="128" text-anchor="middle" font-size="18" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">a</text>
  <text x="192" y="128" text-anchor="middle" font-size="18" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">b</text>
  <text x="256" y="128" text-anchor="middle" font-size="18" font-weight="bold" fill="#2f5223" filter="url(#rough2)">a</text>
  <text x="320" y="128" text-anchor="middle" font-size="18" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">b</text>
  <text x="384" y="128" text-anchor="middle" font-size="18" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">a</text>

  <text x="128" y="162" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">0</text>
  <text x="192" y="162" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">1</text>
  <text x="256" y="162" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">2</text>
  <text x="320" y="162" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">3</text>
  <text x="384" y="162" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">4</text>

  
  <text x="100" y="200" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">后缀 i = 0：ababa</text>
  <g>
    <rect x="100" y="210" width="56" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)" />
    <rect x="164" y="210" width="56" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)" />
    <rect x="228" y="210" width="56" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)" />
    <rect x="292" y="210" width="56" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)" />
    <rect x="356" y="210" width="56" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)" />
  </g>
  <text x="128" y="241" text-anchor="middle" font-size="16" fill="#2f4a66" filter="url(#rough2)">a</text>
  <text x="192" y="241" text-anchor="middle" font-size="16" fill="#2f4a66" filter="url(#rough2)">b</text>
  <text x="256" y="241" text-anchor="middle" font-size="16" fill="#2f5223" filter="url(#rough2)">a</text>
  <text x="320" y="241" text-anchor="middle" font-size="16" fill="#2f4a66" filter="url(#rough2)">b</text>
  <text x="384" y="241" text-anchor="middle" font-size="16" fill="#2f4a66" filter="url(#rough2)">a</text>

  
  <text x="240" y="286" font-size="11.5" fill="#2f5223" filter="url(#rough2)">后缀 j = 2：aba</text>
  <g>
    <rect x="228" y="296" width="56" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)" />
    <rect x="292" y="296" width="56" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)" />
    <rect x="356" y="296" width="56" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)" />
  </g>
  <text x="256" y="327" text-anchor="middle" font-size="16" fill="#2f5223" filter="url(#rough2)">a</text>
  <text x="320" y="327" text-anchor="middle" font-size="16" fill="#2f5223" filter="url(#rough2)">b</text>
  <text x="384" y="327" text-anchor="middle" font-size="16" fill="#2f5223" filter="url(#rough2)">a</text>

  
  <line x1="228" y1="380" x2="412" y2="380" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)" />
  <text x="320" y="398" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">公共前缀 “aba”，长度 3</text>

  
  <rect x="470" y="180" width="266" height="160" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)" />
  <text x="490" y="208" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">为什么只查后缀对？</text>
  <text x="490" y="236" font-size="11" fill="#7a5a1b" filter="url(#rough2)">子串 s[i..i+L-1] 在 j 处再次出现</text>
  <text x="490" y="256" font-size="11" fill="#7a5a1b" filter="url(#rough2)">⇔ LCP(后缀 i, 后缀 j) ≥ L。</text>
  <text x="490" y="284" font-size="11" fill="#7a5a1b" filter="url(#rough2)">所以最长重复子串长度就是</text>
  <text x="490" y="308" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">max_{i&lt;j} LCP(i, j)。</text>
  <text x="490" y="330" font-size="10.5" fill="#777" filter="url(#rough2)">允许重叠：i 与 j 的距离没有限制。</text>
</svg>