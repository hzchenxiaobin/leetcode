<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="720" height="460" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">线段树存区间最大 y，找第一个 y &gt; qy 的叶子</text>
  <path d="M 115 42 Q 360 48 605 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 连线 -->
  <g stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)">
    <path d="M 362 130 L 198 160"/><path d="M 362 130 L 526 160"/>
    <path d="M 198 200 L 116 230"/><path d="M 198 200 L 280 230"/>
    <path d="M 526 200 L 444 230"/><path d="M 526 200 L 608 230"/>
    <path d="M 116 270 L 75 300"/><path d="M 116 270 L 157 300"/>
    <path d="M 280 270 L 239 300"/><path d="M 280 270 L 321 300"/>
    <path d="M 444 270 L 403 300"/><path d="M 444 270 L 485 300"/>
    <path d="M 608 270 L 567 300"/><path d="M 608 270 L 649 300"/>
  </g>

  <!-- 节点 -->
  <rect x="327" y="90" width="70" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="362" y="116" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">9</text>

  <rect x="163" y="160" width="70" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="198" y="186" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">5</text>
  <rect x="491" y="160" width="70" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="526" y="186" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">9</text>

  <rect x="81" y="230" width="70" height="40" rx="8" fill="#ffffff" stroke="#aaa" stroke-width="1.2" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="116" y="256" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">2</text>
  <rect x="245" y="230" width="70" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="280" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">5</text>
  <rect x="409" y="230" width="70" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="444" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">9</text>
  <rect x="573" y="230" width="70" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="608" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">4</text>

  <!-- 叶子 -->
  <g filter="url(#rough2)">
    <rect x="45" y="300" width="60" height="40" rx="6" fill="#ffffff" stroke="#aaa" stroke-width="1.2" stroke-dasharray="5 3"/>
    <rect x="127" y="300" width="60" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="209" y="300" width="60" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="291" y="300" width="60" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="373" y="300" width="60" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="455" y="300" width="60" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="537" y="300" width="60" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="619" y="300" width="60" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <g font-size="11" text-anchor="middle" fill="#555" filter="url(#rough2)">
    <text x="75" y="356">0</text><text x="157" y="356">1</text><text x="239" y="356">2</text>
    <text x="321" y="356">3</text><text x="403" y="356">4</text><text x="485" y="356">5</text>
    <text x="567" y="356">6</text><text x="649" y="356">7</text>
  </g>
  <g font-size="12" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">
    <text x="75" y="326">1</text><text x="157" y="326">2</text><text x="239" y="326">5</text>
    <text x="321" y="326">3</text><text x="403" y="326">7</text><text x="485" y="326">9</text>
    <text x="567" y="326">4</text><text x="649" y="326">-1</text>
  </g>

  <!-- S 标记 -->
  <line x1="123" y1="285" x2="123" y2="350" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="123" y="279" text-anchor="middle" font-size="11" font-weight="bold" fill="#a33a36" filter="url(#rough2)">S=1</text>

  <text x="245" y="382" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">查询 qy = 3，从下标 S=1 开始。</text>
  <text x="245" y="404" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">① 叶 1 的值 2 ≤ 3 → 跳过；② 段 [2,3] 的 max=5&gt;3 → 下降；</text>
  <text x="245" y="426" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">③ 左孩子叶 2 的值 5 &gt; 3 → 返回下标 2，输出 P₂=(3,5)。</text>
  <text x="40" y="450" font-size="10.5" fill="#555" filter="url(#rough2)">若某子树的 max ≤ qy，整棵子树都不可能有答案，直接剪掉——这正是 O(log n) 的原因。</text>
</svg>
