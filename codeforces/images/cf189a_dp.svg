<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="340" fill="#fafafa"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">189A：把长度为 n 的丝带切成 a/b/c 段，最大化段数</text>
  <path d="M 146.6100000000001 46 Q 380.0 52 613.3899999999999 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="70.0" y="76.0" width="52.0" height="40.0" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="96.0" y="101.0" text-anchor="middle" font-size="11.0" font-weight="bold" fill="#26405c" filter="url(#rough2)">0</text>
  <rect x="126.0" y="76.0" width="52.0" height="40.0" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="152.0" y="101.0" text-anchor="middle" font-size="11.0" font-weight="bold" fill="#26405c" filter="url(#rough2)">1</text>
  <rect x="182.0" y="76.0" width="52.0" height="40.0" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="208.0" y="101.0" text-anchor="middle" font-size="11.0" font-weight="bold" fill="#26405c" filter="url(#rough2)">2</text>
  <rect x="238.0" y="76.0" width="52.0" height="40.0" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="264.0" y="101.0" text-anchor="middle" font-size="11.0" font-weight="bold" fill="#26405c" filter="url(#rough2)">3</text>
  <rect x="294.0" y="76.0" width="52.0" height="40.0" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="320.0" y="101.0" text-anchor="middle" font-size="11.0" font-weight="bold" fill="#26405c" filter="url(#rough2)">4</text>
  <text x="360.0" y="101.0" text-anchor="start" font-size="11.0" fill="#6b6b6b" filter="url(#rough2)">… n</text>
  <text x="70.0" y="140.0" text-anchor="start" font-size="11.2" fill="#2b2b2b" filter="url(#rough2)">dp[i] = 用长度 a/b/c 的段恰好拼出 i 的最多段数（-∞ 表示拼不出）</text>
  <rect x="70.0" y="160.0" width="438.0" height="32.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="78.0" y="185.0" text-anchor="start" font-size="11.0" font-weight="bold" fill="#26405c" filter="url(#rough2)">i</text>
  <text x="148.0" y="185.0" text-anchor="start" font-size="11.0" font-weight="bold" fill="#26405c" filter="url(#rough2)">0</text>
  <text x="194.0" y="185.0" text-anchor="start" font-size="11.0" font-weight="bold" fill="#26405c" filter="url(#rough2)">1</text>
  <text x="240.0" y="185.0" text-anchor="start" font-size="11.0" font-weight="bold" fill="#26405c" filter="url(#rough2)">2</text>
  <text x="286.0" y="185.0" text-anchor="start" font-size="11.0" font-weight="bold" fill="#26405c" filter="url(#rough2)">3</text>
  <text x="332.0" y="185.0" text-anchor="start" font-size="11.0" font-weight="bold" fill="#26405c" filter="url(#rough2)">4</text>
  <text x="378.0" y="185.0" text-anchor="start" font-size="11.0" font-weight="bold" fill="#26405c" filter="url(#rough2)">5</text>
  <text x="424.0" y="185.0" text-anchor="start" font-size="11.0" font-weight="bold" fill="#26405c" filter="url(#rough2)">6</text>
  <text x="470.0" y="185.0" text-anchor="start" font-size="11.0" font-weight="bold" fill="#26405c" filter="url(#rough2)">7</text>
  <path d="M 70.0 160.0 L 508.0 160.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="78.0" y="217.0" text-anchor="start" font-size="11.0" fill="#2b2b2b" filter="url(#rough2)">dp</text>
  <text x="148.0" y="217.0" text-anchor="start" font-size="11.0" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="194.0" y="217.0" text-anchor="start" font-size="11.0" fill="#2b2b2b" filter="url(#rough2)">-∞</text>
  <text x="240.0" y="217.0" text-anchor="start" font-size="11.0" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="286.0" y="217.0" text-anchor="start" font-size="11.0" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="332.0" y="217.0" text-anchor="start" font-size="11.0" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="378.0" y="217.0" text-anchor="start" font-size="11.0" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="424.0" y="217.0" text-anchor="start" font-size="11.0" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="470.0" y="217.0" text-anchor="start" font-size="11.0" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <path d="M 70.0 192.0 L 508.0 192.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <rect x="60.0" y="240.0" width="660.0" height="60.0" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="264.0" text-anchor="start" font-size="11.2" fill="#2f5b34" filter="url(#rough2)">样例 1：n=5, (a,b,c)=(5,3,2)。dp[3]=1（用 3）、dp[2]=1（用 2），</text>
  <text x="74.0" y="286.0" text-anchor="start" font-size="11.2" fill="#2f5b34" filter="url(#rough2)">dp[5]=dp[3]+1=2 或 dp[2]+1=2，最大 2 ✓（5 本身也能一刀，但只有 1 段）。</text>
  <text x="60.0" y="322.0" text-anchor="start" font-size="11.0" fill="#6b6b6b" filter="url(#rough2)">n ≤ 4000，三重循环 O(n)：对每个长度试 a、b、c 三种切法。</text>
</svg>
