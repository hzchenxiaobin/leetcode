<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="880" height="440" fill="#fafafa"/>

  <text x="440" y="34" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察一：把「取反 clean 子串」翻译到差分数组 d 上</text>
  <path d="M 96 44 Q 440 52 784 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="440" y="64" text-anchor="middle" font-size="12.5" fill="#5a5a5a" filter="url(#rough2)">示例 t = 011001：d = 1 0 1 0 1（c = 3），beauty = ⌈3/2⌉ = 2</text>

  <text x="262" y="126" text-anchor="end" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">t =</text>
  <rect x="272" y="96" width="50" height="46" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="297" y="126" text-anchor="middle" font-size="18" fill="#2f4a66" filter="url(#rough2)">0</text>
  <rect x="330" y="96" width="50" height="46" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="355" y="126" text-anchor="middle" font-size="18" fill="#8a6015" filter="url(#rough2)">1</text>
  <rect x="388" y="96" width="50" height="46" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="413" y="126" text-anchor="middle" font-size="18" fill="#8a6015" filter="url(#rough2)">1</text>
  <rect x="446" y="96" width="50" height="46" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="471" y="126" text-anchor="middle" font-size="18" fill="#2f4a66" filter="url(#rough2)">0</text>
  <rect x="504" y="96" width="50" height="46" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="529" y="126" text-anchor="middle" font-size="18" fill="#2f4a66" filter="url(#rough2)">0</text>
  <rect x="562" y="96" width="50" height="46" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="587" y="126" text-anchor="middle" font-size="18" fill="#2f4a66" filter="url(#rough2)">1</text>

  <text x="297" y="158" text-anchor="middle" font-size="9.5" fill="#8a8a8a" filter="url(#rough2)">1</text>
  <text x="355" y="158" text-anchor="middle" font-size="9.5" fill="#8a8a8a" filter="url(#rough2)">2</text>
  <text x="413" y="158" text-anchor="middle" font-size="9.5" fill="#8a8a8a" filter="url(#rough2)">3</text>
  <text x="471" y="158" text-anchor="middle" font-size="9.5" fill="#8a8a8a" filter="url(#rough2)">4</text>
  <text x="529" y="158" text-anchor="middle" font-size="9.5" fill="#8a8a8a" filter="url(#rough2)">5</text>
  <text x="587" y="158" text-anchor="middle" font-size="9.5" fill="#8a8a8a" filter="url(#rough2)">6</text>

  <rect x="322" y="88" width="124" height="62" rx="9" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="440" y="82" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">虚线框内字符全同 ⇒ 可整体取反，这就是一次「取 clean 子串」操作</text>

  <text x="262" y="220" text-anchor="end" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">d =</text>
  <text x="326" y="188" text-anchor="middle" font-size="10" fill="#8a8a8a" filter="url(#rough2)">d₁</text>
  <text x="384" y="188" text-anchor="middle" font-size="10" fill="#8a8a8a" filter="url(#rough2)">d₂</text>
  <text x="442" y="188" text-anchor="middle" font-size="10" fill="#8a8a8a" filter="url(#rough2)">d₃</text>
  <text x="500" y="188" text-anchor="middle" font-size="10" fill="#8a8a8a" filter="url(#rough2)">d₄</text>
  <text x="558" y="188" text-anchor="middle" font-size="10" fill="#8a8a8a" filter="url(#rough2)">d₅</text>

  <rect x="307" y="196" width="38" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="326" y="220" text-anchor="middle" font-size="16" fill="#8c3b38" filter="url(#rough2)">1</text>
  <rect x="365" y="196" width="38" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="384" y="220" text-anchor="middle" font-size="16" fill="#3c5e2e" filter="url(#rough2)">0</text>
  <rect x="423" y="196" width="38" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="442" y="220" text-anchor="middle" font-size="16" fill="#8c3b38" filter="url(#rough2)">1</text>
  <rect x="481" y="196" width="38" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="500" y="220" text-anchor="middle" font-size="16" fill="#3c5e2e" filter="url(#rough2)">0</text>
  <rect x="539" y="196" width="38" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="558" y="220" text-anchor="middle" font-size="16" fill="#3c5e2e" filter="url(#rough2)">1</text>

  <path d="M 330 152 Q 320 176 326 190" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 438 152 Q 448 176 442 190" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="176" text-anchor="end" font-size="10.5" fill="#b85450" filter="url(#rough2)">翻转</text>
  <text x="474" y="176" text-anchor="start" font-size="10.5" fill="#b85450" filter="url(#rough2)">翻转</text>

  <rect x="36" y="252" width="258" height="118" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="165" y="278" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">① 选 clean 子串 [l, r]</text>
  <text x="165" y="304" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">等价于 d[l] … d[r−1] 全是 0</text>
  <text x="165" y="326" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">（这段内部没有字符跳变）</text>
  <text x="165" y="350" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">代价 1 枚硬币</text>

  <rect x="311" y="252" width="258" height="118" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="440" y="278" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">② 取反之后</text>
  <text x="440" y="304" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">只有 d[l−1] 与 d[r] 各翻一次</text>
  <text x="440" y="326" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">l = 1 或 r = n 时少翻一侧</text>
  <text x="440" y="350" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">子串内部全翻 ⇒ 差分不变</text>

  <rect x="586" y="252" width="258" height="118" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="715" y="278" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">③ 单次操作的能力</text>
  <text x="715" y="304" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">最多把 2 个 1 变成 0</text>
  <text x="715" y="326" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">也可能把 0 翻成 1（纯浪费）</text>
  <text x="715" y="350" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">所以下界是 ⌈c/2⌉</text>

  <text x="440" y="400" text-anchor="middle" font-size="12.5" fill="#5a5a5a" filter="url(#rough2)">本例翻掉 d₁ 与 d₃ 后 t = 000001，d 只剩 d₅ = 1，再翻一次收尾 ⇒ beauty = 2</text>
  <text x="440" y="424" text-anchor="middle" font-size="12.5" fill="#5a5a5a" filter="url(#rough2)">t 是 clean 串 ⟺ d 全为 0（相邻全相等 ⇒ 整串同字符）</text>
</svg>
