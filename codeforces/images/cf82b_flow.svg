<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="720" height="400" fill="#fafafa"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">重建流程：读纸条 → 记签名 → 按签名分组</text>
  <path d="M 200 43 Q 360 49 520 43" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <rect x="60" y="70" width="380" height="58" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="76" y="94" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">① 读入 n(n-1)/2 张纸条</text>
  <text x="76" y="114" text-anchor="start" font-size="10.5" fill="#777777" filter="url(#rough2)">每张是某两个集合的并</text>
  <path d="M 250 128 L 250 146" stroke="#2b2b2b" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="60" y="146" width="380" height="58" rx="7" fill="#e9f4e2" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="76" y="170" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">② 对每个数字 x 记录它出现的纸条编号</text>
  <text x="76" y="190" text-anchor="start" font-size="10.5" fill="#777777" filter="url(#rough2)">签名长度恒为 n-1</text>
  <path d="M 250 204 L 250 222" stroke="#2b2b2b" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="60" y="222" width="380" height="58" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="76" y="246" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">③ 签名相同的数字并成一组</text>
  <text x="76" y="266" text-anchor="start" font-size="10.5" fill="#777777" filter="url(#rough2)">每组就是一个集合</text>
  <path d="M 250 280 L 250 298" stroke="#2b2b2b" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="60" y="298" width="380" height="58" rx="7" fill="#e9f4e2" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="76" y="322" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">④ 输出 n 行：个数 + 元素</text>
  <text x="76" y="342" text-anchor="start" font-size="10.5" fill="#777777" filter="url(#rough2)">顺序任意，多解均可</text>
  <rect x="470" y="96" width="210" height="150" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="486" y="122" text-anchor="start" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">n = 2 的特殊情况</text>
  <text x="486" y="148" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">只有 1 张纸条，</text>
  <text x="486" y="170" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">两个集合无法区分，</text>
  <text x="486" y="192" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">任意非空二分都合法：</text>
  <text x="486" y="216" text-anchor="start" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">如 1 个 + 其余</text>
  <text x="470" y="276" text-anchor="start" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">复杂度 O(输入规模 + 200·n)</text>
  <text x="470" y="300" text-anchor="start" font-size="11" fill="#777777" filter="url(#rough2)">数字只有 1..200 种，</text>
  <text x="470" y="322" text-anchor="start" font-size="11" fill="#777777" filter="url(#rough2)">签名可以直接当 map 的 key。</text>
  <text x="60" y="372" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">输入可能多达 ~4×10^6 个整数，C++ 需要快读；Python 用逐行 split 更省内存。</text>
</svg>
