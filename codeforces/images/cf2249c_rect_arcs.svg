<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold"
        filter="url(#rough2)">v 是块首 ⟺ s ∈ B_v 且 p ∈ A_v：一个矩形</text>

  <circle cx="150" cy="210" r="105" fill="#ffffff" stroke="#bbb" stroke-width="1.2"
          filter="url(#rough2)"/>

  <path d="M 202.5 119.1 A 105 105 0 1 1 59.1 262.5" fill="none" stroke="#446688"
        stroke-width="2.6" filter="url(#rough2)"/>
  <path d="M 59.1 262.5 A 105 105 0 0 1 202.5 119.1" fill="none" stroke="#d6a040"
        stroke-width="2.6" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <circle cx="202.5" cy="119.1" r="4.5" fill="#446688"/>
    <circle cx="59.1" cy="262.5" r="4.5" fill="#d6a040"/>
    <text x="212" y="104" font-size="11.5" fill="#3a4a66">pos[v]</text>
    <text x="10" y="310" font-size="11.5" fill="#8a6a20">pos[v−1]</text>
    <text x="52" y="112" font-size="11.5" fill="#8a6a20" text-anchor="middle">s ∈ B_v</text>
    <text x="258" y="312" font-size="11.5" fill="#3a4a66" text-anchor="middle">p ∈ A_v</text>
  </g>

  <text x="150" y="338" text-anchor="middle" font-size="10.5" fill="#666"
        filter="url(#rough2)">A_v 与 B_v 是同一对端点之间的两段弧</text>
  <text x="150" y="356" text-anchor="middle" font-size="10.5" fill="#666"
        filter="url(#rough2)">都在 pos[v] 处相接、在 pos[v−1] 处断开</text>

  <g filter="url(#rough2)">
    <path d="M 350 330 L 600 330" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
    <path d="M 350 330 L 350 76" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
    <text x="590" y="350" font-size="12" fill="#555">s</text>
    <text x="332" y="84" font-size="12" fill="#555">p</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 392 330 L 538 330" stroke="#d6a040" stroke-width="4" fill="none"/>
    <path d="M 392 324 L 392 336" stroke="#8a6a20" stroke-width="2"/>
    <path d="M 538 324 L 538 336" stroke="#8a6a20" stroke-width="2"/>
    <text x="465" y="322" font-size="11.5" fill="#8a6a20" text-anchor="middle">B_v</text>
    <path d="M 350 152 L 350 268" stroke="#446688" stroke-width="4" fill="none"/>
    <path d="M 344 152 L 356 152" stroke="#3a4a66" stroke-width="2"/>
    <path d="M 344 268 L 356 268" stroke="#3a4a66" stroke-width="2"/>
    <text x="344" y="218" font-size="11.5" fill="#3a4a66" text-anchor="end">A_v</text>
  </g>

  <rect x="392" y="152" width="146" height="116" fill="#e8f0fe" fill-opacity="0.65"
        stroke="#446688" stroke-width="1.6" stroke-dasharray="6 4" rx="4" filter="url(#rough2)"/>
  <text x="465" y="200" text-anchor="middle" font-size="11.5" fill="#3a4a66"
        filter="url(#rough2)">(s, p) 落在这里</text>
  <text x="465" y="222" text-anchor="middle" font-size="11.5" fill="#3a4a66"
        filter="url(#rough2)">v 就是块首</text>

  <text x="465" y="352" text-anchor="middle" font-size="10.5" fill="#555"
        filter="url(#rough2)">s ∈ B_v 且 p ∈ A_v 时 v 是块首</text>

  <rect x="40" y="368" width="540" height="24" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="310" y="384" text-anchor="middle" font-size="11" fill="#3a5a30"
        filter="url(#rough2)">于是「块数 ≤ 2」变成「每个 s 的竖线上，矩形覆盖数 ≤ 2」</text>
</svg>
