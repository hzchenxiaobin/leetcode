<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="241"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="300" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">两个样例的走查</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">低位在左：1111（15）→ 16 − 1；1010011（83）→ 64 + 16 + 4 − 1</text>
  <text x="140" y="104" text-anchor="start" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">1111</text>
  <text x="140" y="134" text-anchor="start" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">低位起：1 1 1 1 → +2^4 − 2^0 = 15，2 项</text>
  <text x="140" y="190" text-anchor="start" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">1010011</text>
  <text x="140" y="220" text-anchor="start" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">低位起：1 1 0 0 1 0 1 → 2^6 + 2^4 + 2^2 − 2^0 = 83，4 项</text>
  <g filter="url(#rough2)"><rect x="80" y="244" width="740" height="40" rx="6" fill="#f6e3c4" fill-opacity="0.55" stroke="#b06a1e" stroke-width="1.4"/></g>
  <text x="450" y="270" text-anchor="middle" font-size="11.5" fill="#b06a1e" filter="url(#rough2)">样例 2 给的是 2^6+2^4+2^1+2^0（也是 4 项），两种都最优</text>
</svg>
