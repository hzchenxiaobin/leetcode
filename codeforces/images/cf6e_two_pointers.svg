<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">双指针：右端尽量伸，非法就抬左端</text>
  <path d="M 175 44 Q 360 50 545 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 非法窗口 [3..5] -->
  <rect x="228" y="92" width="212" height="64" rx="6" fill="#fde8e8" stroke="#b85450"
        stroke-width="1.5" stroke-dasharray="6 4" opacity="0.8" filter="url(#rough2)"/>

  <g>
    <rect x="80" y="96" width="56" height="56" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <rect x="156" y="96" width="56" height="56" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <rect x="232" y="96" width="56" height="56" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
    <rect x="308" y="96" width="56" height="56" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
    <rect x="384" y="96" width="56" height="56" rx="6" fill="#fde8e8" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  </g>
  <g font-size="17" font-weight="bold" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">
    <text x="108" y="130">6</text><text x="184" y="130">9</text><text x="260" y="130">4</text>
    <text x="336" y="130">7</text><text x="412" y="130">10</text>
  </g>

  <path d="M 260 188 L 260 160" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="260" y="208" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5223" filter="url(#rough2)">l</text>
  <path d="M 412 188 L 412 160" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="412" y="208" text-anchor="middle" font-size="15" font-weight="bold" fill="#a33a36" filter="url(#rough2)">r</text>

  <text x="80" y="238" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">窗口 [3..5]：max 10 − min 4 = 6 &gt; k = 4 → 非法，所以 R[3] = 4，l 右移</text>

  <rect x="40" y="254" width="640" height="132" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <g font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">
    <text x="56" y="282">① r 右移一格，把 h[r] 压入维护最大值 / 最小值的两个单调队列。</text>
    <text x="56" y="306">② 若 max − min &gt; k：以 l 开头的最远窗口止于 r−1，记 R[l] = r−1，然后 l++。</text>
    <text x="56" y="330">③ 弹出两个队列中下标 &lt; l 的队首，回到 ② 继续判断。</text>
    <text x="56" y="354">④ 扫描结束后，剩下每个 l 的 R[l] = n−1。</text>
  </g>

  <text x="40" y="410" font-size="12" fill="#2b2b2b" filter="url(#rough2)">h = [6,9,4,7,10]，k = 4 → R = [1,1,3,4,4]；最长 2，窗口 1-2、3-4、4-5。</text>
</svg>
