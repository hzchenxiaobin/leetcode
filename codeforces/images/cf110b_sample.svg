<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="109"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="320" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例：n=5 → abcda；n=3 → abc</text>
  <text x="150" y="142" text-anchor="end" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">n=5</text>
  <g filter="url(#rough2)"><rect x="180" y="110" width="52" height="46" rx="3" fill="#cfe0f5" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="206" y="141" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">a</text>
  <g filter="url(#rough2)"><rect x="238" y="110" width="52" height="46" rx="3" fill="#d7ecd0" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="264" y="141" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">b</text>
  <g filter="url(#rough2)"><rect x="296" y="110" width="52" height="46" rx="3" fill="#f6e3c4" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="322" y="141" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">c</text>
  <g filter="url(#rough2)"><rect x="354" y="110" width="52" height="46" rx="3" fill="#f6d9d7" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="380" y="141" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">d</text>
  <g filter="url(#rough2)"><rect x="412" y="110" width="52" height="46" rx="3" fill="#cfe0f5" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="438" y="141" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="150" y="222" text-anchor="end" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">n=3</text>
  <g filter="url(#rough2)"><rect x="180" y="190" width="52" height="46" rx="3" fill="#cfe0f5" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="206" y="221" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">a</text>
  <g filter="url(#rough2)"><rect x="238" y="190" width="52" height="46" rx="3" fill="#d7ecd0" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="264" y="221" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">b</text>
  <g filter="url(#rough2)"><rect x="296" y="190" width="52" height="46" rx="3" fill="#f6e3c4" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="322" y="221" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="440" y="290" text-anchor="middle" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">若周期取 3（abcabc）：a 的位置 1,4 差 3，不是幸运数 → 不合法</text>
</svg>
