<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="421"/>
    <feDisplacementMap in="SourceGraphic" scale="1.5"/></filter></defs>
  <rect width="700" height="300" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">字典序最小：先"abab…"，最后才引入新字母</text>
  <path d="M 120 40 Q 350 46 580 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="330" height="46" rx="6" fill="#e8f4e0" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="225" y="86" text-anchor="middle" font-size="13" fill="#2f5223" filter="url(#rough2)">a b a b a …（前 n−k+2 个，a/b 交替）</text>
  <g filter="url(#rough2)"><rect x="400" y="58" width="240" height="46" rx="6" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="520" y="86" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">c d e …（共 k−2 个）</text>
  <g filter="url(#rough2)"><rect x="60" y="118" width="580" height="70" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="142" font-size="12.5" fill="#22314a" filter="url(#rough2)">为什么把新字母放最后？字典序按位比较 ⇒ 越靠前越小越好，所以前面只敢用 a、b（最小两个）。</text>
  <text x="76" y="166" font-size="12.5" fill="#22314a" filter="url(#rough2)">而"相邻不同"要求 a、b 至少两个字母；剩下的 k−2 个字母只能在末尾各出现一次。</text>
  <g filter="url(#rough2)"><rect x="60" y="200" width="580" height="70" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="224" font-size="12.5" fill="#2f5223" filter="url(#rough2)">样例 n=7,k=4：n−k+2 = 5 ⇒ "ababa"，再补 c、d ⇒ "ababacd" ✓</text>
  <text x="76" y="248" font-size="12.5" fill="#2f5223" filter="url(#rough2)">k=1 时只有 n=1 可行（"a"）；n&gt;1 必然相邻相同 ⇒ −1。</text>
  <text x="76" y="268" font-size="11.5" fill="#2f5223" filter="url(#rough2)">k&gt;n 时字母数不够 ⇒ −1。</text>
</svg>
