<svg xmlns="http://www.w3.org/2000/svg" width="840" height="372" viewBox="0 0 840 372"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="79"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="840" height="372" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">220 日元只有三种取法</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">h 枚 100 元 + t 枚 10 元：100h + 10t = 220 → (h,t) = (2,2), (1,12), (0,22)</text>
  <g filter="url(#rough2)"><rect x="250" y="92" width="340" height="64" rx="4" fill="#d7ecd0" fill-opacity="0.75" stroke="#444444" stroke-width="1.6"/></g>
  <text x="420" y="118" text-anchor="middle" font-size="14.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">2 枚 100 元 + 2 枚 10 元</text>
  <text x="420" y="139" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">h = 2, t = 2 → 需要 x ≥ 2 且 y ≥ 2</text>
  <g filter="url(#rough2)"><rect x="250" y="180" width="340" height="64" rx="4" fill="#cfe0f5" fill-opacity="0.75" stroke="#444444" stroke-width="1.6"/></g>
  <text x="420" y="206" text-anchor="middle" font-size="14.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">1 枚 100 元 + 12 枚 10 元</text>
  <text x="420" y="227" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">h = 1, t = 12 → 需要 x ≥ 1 且 y ≥ 12</text>
  <g filter="url(#rough2)"><rect x="250" y="268" width="340" height="64" rx="4" fill="#f6e3c4" fill-opacity="0.75" stroke="#444444" stroke-width="1.6"/></g>
  <text x="420" y="294" text-anchor="middle" font-size="14.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">0 枚 100 元 + 22 枚 10 元</text>
  <text x="420" y="315" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">h = 0, t = 22 → 需要 y ≥ 22</text>
  <g filter="url(#rough2)"><line x1="206" y1="112" x2="206" y2="292" stroke="#4a7a3a" stroke-width="2.4" marker-end="url(#arrg)"/></g>
  <text x="196" y="150" text-anchor="end" font-size="13" fill="#3d6b2f" font-weight="bold" filter="url(#rough2)">Ciel：</text>
  <text x="196" y="170" text-anchor="end" font-size="11.5" fill="#3d6b2f" filter="url(#rough2)">优先多拿 100 元</text>
  <text x="196" y="190" text-anchor="end" font-size="11.5" fill="#3d6b2f" filter="url(#rough2)">（从上往下试）</text>
  <g filter="url(#rough2)"><line x1="660" y1="300" x2="660" y2="120" stroke="#446688" stroke-width="2.4" marker-end="url(#arrb)"/></g>
  <text x="672" y="200" text-anchor="start" font-size="13" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">Hanako：</text>
  <text x="672" y="220" text-anchor="start" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">优先多拿 10 元</text>
  <text x="672" y="240" text-anchor="start" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">（从下往上试）</text>
  <text x="420" y="350" text-anchor="middle" font-size="12" fill="#8a2b28" filter="url(#rough2)">三种取法互斥：谁先凑不出 220 日元，谁就输</text>
</svg>
