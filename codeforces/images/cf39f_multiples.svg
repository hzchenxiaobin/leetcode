<svg xmlns="http://www.w3.org/2000/svg" width="720" height="310" viewBox="0 0 720 310"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="301"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="310" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">青蛙落点 = d 的正整数倍；蚊子山丘 h 被踩 ⟺ h % d == 0</text>
  <line x1="70" y1="150" x2="650" y2="150" stroke="#c9ced6" stroke-width="1.6" filter="url(#rough2)"/>
  <g font-size="11" fill="#666" filter="url(#rough2)">    <text x="80" y="176" text-anchor="middle">1</text>
    <text x="160" y="176" text-anchor="middle">2</text>
    <text x="240" y="176" text-anchor="middle">3</text>
    <text x="320" y="176" text-anchor="middle">4</text>
    <text x="400" y="176" text-anchor="middle">5</text>
    <text x="480" y="176" text-anchor="middle">6</text>
    <text x="560" y="176" text-anchor="middle">7</text>
  </g>
  <g filter="url(#rough2)">
    <circle cx="160" cy="150" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="320" cy="150" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="480" cy="150" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="160" y="126" text-anchor="middle" font-size="11.5" fill="#2f4a66">2</text>
    <text x="320" y="130" text-anchor="middle" font-size="11.5" fill="#2f4a66">4</text>
    <text x="480" y="126" text-anchor="middle" font-size="11.5" fill="#2f4a66">6</text>
    <circle cx="240" cy="150" r="9" fill="#fce8e6" stroke="#b85450" stroke-width="1.8"/>
    <text x="240" y="196" text-anchor="middle" font-size="11.5" fill="#8f3b37">蚊子</text>
  </g>
  <text x="360" y="104" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">跳长 d = 2 的青蛙：落在 2, 4, 6, …（蓝点）</text>
  <rect x="70" y="216" width="580" height="72" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="86" y="240" font-size="12.5" fill="#8a6015" filter="url(#rough2)">对每只青蛙统计"蚊子中能被 d 整除的个数"，取最小值。</text>
  <text x="86" y="264" font-size="12.5" fill="#8a6015" filter="url(#rough2)">n 只用来界定落点范围；蚊子都在 1..n 内，所以判断只需整除。</text>
  <text x="86" y="282" font-size="12" fill="#8a6015" filter="url(#rough2)">m, k ≤ 100 ⇒ O(mk) 足够。</text>
</svg>
