<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="631"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="290" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">答案 = Σ_i end[i] · (Σ_{j&gt;i} start[j])</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">end/start 用中心扩展 O(n²) 求出</text>
  <g filter="url(#rough2)"><rect x="60" y="96" width="380" height="84" rx="6" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="250" y="126" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">end[i]：以 i 结尾的回文数</text>
  <text x="250" y="156" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">扩展时对右端点 r 累加</text>
  <g filter="url(#rough2)"><rect x="480" y="96" width="380" height="84" rx="6" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="670" y="126" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">start[j]：以 j 开头的回文数</text>
  <text x="670" y="156" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">扩展时对左端点 l 累加</text>
  <text x="450" y="214" text-anchor="middle" font-size="11.5" fill="#b06a1e" filter="url(#rough2)">左段止于 i、右段起于 j &gt; i ⇒ 自动不重叠</text>
  <text x="450" y="248" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">总共 2n−1 个中心，每个扩展 O(n)</text>
</svg>
