<svg xmlns="http://www.w3.org/2000/svg" width="740" height="430" viewBox="0 0 740 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="740" height="430" fill="#fafafa"/>
  <text x="370.0" y="36" font-size="20" fill="#2b2b2b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">碎片比较允许旋转，禁止翻转</text>
  <path d="M 133 46 Q 370 52 607 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="115.0" y="98" font-size="12.5" fill="#2b2b2b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">原碎片 2×3</text>
  <rect x="70" y="110" width="30" height="30" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="85.0" y="130.0" font-size="13" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">A</text>
  <rect x="100" y="110" width="30" height="30" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="115.0" y="130.0" font-size="13" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">B</text>
  <rect x="130" y="110" width="30" height="30" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="145.0" y="130.0" font-size="13" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">C</text>
  <rect x="70" y="140" width="30" height="30" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="85.0" y="160.0" font-size="13" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">D</text>
  <rect x="100" y="140" width="30" height="30" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="115.0" y="160.0" font-size="13" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">E</text>
  <rect x="130" y="140" width="30" height="30" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="145.0" y="160.0" font-size="13" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">F</text>
  <text x="115.0" y="190" font-size="11" fill="#446688" text-anchor="middle" filter="url(#rough2)">2×3</text>
  <line x1="190.0" y1="155.0" x2="250.0" y2="155.0" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb2)" filter="url(#rough2)"/>
  <text x="220" y="143" font-size="11.5" fill="#2f4a66" text-anchor="middle" filter="url(#rough2)">旋转 180°</text>
  <text x="305.0" y="98" font-size="12.5" fill="#2b2b2b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">旋转 180° 后仍是 2×3</text>
  <rect x="260" y="110" width="30" height="30" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="275.0" y="130.0" font-size="13" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">F</text>
  <rect x="290" y="110" width="30" height="30" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="305.0" y="130.0" font-size="13" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">E</text>
  <rect x="320" y="110" width="30" height="30" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="335.0" y="130.0" font-size="13" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">D</text>
  <rect x="260" y="140" width="30" height="30" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="275.0" y="160.0" font-size="13" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">C</text>
  <rect x="290" y="140" width="30" height="30" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="305.0" y="160.0" font-size="13" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">B</text>
  <rect x="320" y="140" width="30" height="30" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="335.0" y="160.0" font-size="13" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">A</text>
  <text x="305.0" y="190" font-size="11" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">2×3（可以比）</text>
  <line x1="400.0" y1="155.0" x2="460.0" y2="155.0" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr2)" filter="url(#rough2)"/>
  <text x="430" y="143" font-size="11.5" fill="#8a3030" text-anchor="middle" filter="url(#rough2)">旋转 90°</text>
  <text x="500.0" y="88" font-size="12.5" fill="#2b2b2b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">旋转 90° 变成 3×2</text>
  <rect x="470" y="100" width="30" height="30" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="485.0" y="120.0" font-size="13" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">D</text>
  <rect x="500" y="100" width="30" height="30" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="515.0" y="120.0" font-size="13" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">A</text>
  <rect x="470" y="130" width="30" height="30" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="485.0" y="150.0" font-size="13" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">E</text>
  <rect x="500" y="130" width="30" height="30" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="515.0" y="150.0" font-size="13" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">B</text>
  <rect x="470" y="160" width="30" height="30" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="485.0" y="180.0" font-size="13" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">F</text>
  <rect x="500" y="160" width="30" height="30" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="515.0" y="180.0" font-size="13" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">C</text>
  <text x="500.0" y="210" font-size="11" fill="#b85450" text-anchor="middle" filter="url(#rough2)">3×2（形状不同，无法与 2×3 碎片重合）</text>
  <rect x="60" y="290" width="620" height="56" rx="10" fill="#f2f6fb" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="78" y="316" font-size="12.5" fill="#2f4a66" text-anchor="start" filter="url(#rough2)">X ≠ Y：只有 0° 与 180° 保持 X×Y 尺寸 → 只需比较这两种</text>
  <text x="78" y="336" font-size="12.5" fill="#2f4a66" text-anchor="start" filter="url(#rough2)">X = Y：四种旋转都是 X×X → 四种都要比较</text>
  <rect x="60" y="358" width="620" height="52" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="78" y="382" font-size="12" fill="#2b2b2b" text-anchor="start" filter="url(#rough2)">规范形 = 所有「尺寸仍是 X×Y」的旋转中，按行拼接后字典序最小的串。</text>
  <text x="78" y="400" font-size="12" fill="#2b2b2b" text-anchor="start" filter="url(#rough2)">两块碎片旋转等价 ⇔ 规范形相同（再用集合判重即可）。</text>
</svg>
