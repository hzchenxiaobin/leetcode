<svg xmlns="http://www.w3.org/2000/svg" width="880" height="270" viewBox="0 0 880 270"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="125"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/></marker>
  </defs>
  <rect width="880" height="270" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例：42 → 1 2；5 → 0 2</text>
  <text x="140" y="120" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">42 cm ÷ 3 = 14 英寸 = 12 + 2 → 1 英尺 2 英寸</text>
  <text x="140" y="160" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">5 cm → 5/3 ≈ 1.67 → 2 英寸 → 0 英尺 2 英寸</text>
  <text x="140" y="204" text-anchor="start" font-size="13" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">输出：1 2   /   0 2</text>
</svg>
