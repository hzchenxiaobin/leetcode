<svg xmlns="http://www.w3.org/2000/svg" width="740" height="340" viewBox="0 0 740 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1193"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="740" height="340" fill="#fafafa"/>
  <text x="370.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">已知考签与未出现的定理</text>
  <path d="M 118.4 42 Q 370.0 48 621.6 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="370.0" y="326" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">s = ⌊n/k⌋ = 2；样例 1</text>
  <rect x="60" y="70" width="170" height="60" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="145" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#5a7fb0" filter="url(#rough2)">{1,6}</text>
  <text x="145" y="117" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">平均 6</text>
  <rect x="260" y="70" width="170" height="60" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="345" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#5a7fb0" filter="url(#rough2)">{7,4}</text>
  <text x="345" y="117" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">平均 15.5</text>
  <rect x="460" y="70" width="220" height="60" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="570" y="95" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">未出现：{2,3,5}</text>
  <text x="570" y="117" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">掌握度 15, 0, 10</text>
  <rect x="60" y="160" width="620" height="54" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="370" y="182" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">还能组 k−|K| = 1 张新签：从 {2,3,5} 里任选 2 个</text>
  <text x="370" y="202" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">最小平均 = (0+10)/2 = 5，最大 = (15+10)/2 = 12.5</text>
  <rect x="60" y="232" width="620" height="54" rx="7" fill="#fbeeee" stroke="#a05a5a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="370" y="254" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8c2f2c" filter="url(#rough2)">答案：min(6, 5) = 5，max(15.5, 12.5) = 15.5</text>
  <text x="370" y="310" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">注意 |K| = k 时没有新签，只能用已知签（对拍抓出过的坑）</text>
</svg>
