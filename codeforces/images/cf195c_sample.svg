<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="419"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="380" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">195C 三个样例的判定</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="80.0" y="110.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">样例</text>
  <text x="180.0" y="110.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">throw</text>
  <text x="300.0" y="110.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">匹配块</text>
  <text x="520.0" y="110.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">答案</text>
  <text x="80.0" y="156.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="180.0" y="156.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">AE@3</text>
  <text x="300.0" y="156.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">外层 AE（catch 行 8）</text>
  <text x="520.0" y="156.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">AE somewhere</text>
  <text x="80.0" y="202.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="180.0" y="202.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">AE@3</text>
  <text x="300.0" y="202.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">内层 AE（catch 行 4）</text>
  <text x="520.0" y="202.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">AE in line 3</text>
  <text x="80.0" y="248.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="180.0" y="248.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">CE@3</text>
  <text x="300.0" y="248.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">无</text>
  <text x="520.0" y="248.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">Unhandled Exception</text>
  <rect x="60.0" y="320.0" width="600.0" height="40.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="74.0" y="343.0" text-anchor="start" font-size="11" fill="#3f3420" filter="url(#rough2)">「catch 最早」决定选哪个块</text>
</svg>
