<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="33"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="820" height="420" fill="#fafafa"/>

  <text x="410" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">构造流程：n = 2 无解，n ≥ 3 用「核三元组 + 30 的倍数」</text>

  <!-- 读入 -->
  <g filter="url(#rough2)">
    <rect x="330" y="52" width="160" height="40" rx="8" fill="#eef2f6" stroke="#446688" stroke-width="1.6"/>
    <text x="410" y="78" text-anchor="middle" font-size="13" fill="#2f4a66">读入 n</text>
  </g>

  <!-- 判断菱形 -->
  <g filter="url(#rough2)">
    <path d="M 410 108 L 492 142 L 410 176 L 328 142 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="410" y="147" text-anchor="middle" font-size="12.5" fill="#8a6015">n = 2 ?</text>
    <path d="M 410 92 L 410 106" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)"/>
  </g>

  <!-- 是：无解 -->
  <g filter="url(#rough2)">
    <path d="M 328 142 L 240 142" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="286" y="132" text-anchor="middle" font-size="11" fill="#8a2b28">是</text>
    <rect x="60" y="120" width="176" height="44" rx="8" fill="#f6d9d7" stroke="#b85450" stroke-width="1.6"/>
    <text x="148" y="140" text-anchor="middle" font-size="12.5" fill="#8a2b28">输出 −1</text>
    <text x="148" y="157" text-anchor="middle" font-size="10.5" fill="#8a2b28">（两数时整体 gcd 必 &gt; 1）</text>
  </g>

  <!-- 否：构造 -->
  <g filter="url(#rough2)">
    <path d="M 410 176 L 410 200" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)"/>
    <text x="424" y="194" font-size="11" fill="#2f4a66">否</text>

    <rect x="300" y="200" width="220" height="46" rx="8" fill="#d9ecd4" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="410" y="222" text-anchor="middle" font-size="12.5" fill="#2f5223">输出 15，10，6</text>
    <text x="410" y="239" text-anchor="middle" font-size="10.5" fill="#2f5223">两两 gcd 5、3、2；整体 gcd 1</text>

    <path d="M 410 246 L 410 268" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)"/>

    <rect x="280" y="268" width="260" height="46" rx="8" fill="#cfe0f5" stroke="#446688" stroke-width="1.6"/>
    <text x="410" y="290" text-anchor="middle" font-size="12.5" fill="#2f4a66">k = 1 … n−3：输出 30k</text>
    <text x="410" y="307" text-anchor="middle" font-size="10.5" fill="#2f4a66">与三个核数、与彼此都共享 2、3、5</text>

    <path d="M 410 314 L 410 336" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)"/>
    <rect x="350" y="336" width="120" height="36" rx="8" fill="#eeeeee" stroke="#888888" stroke-width="1.6"/>
    <text x="410" y="359" text-anchor="middle" font-size="12.5" fill="#555555">每行一个数</text>
  </g>

  <!-- 示例序列 -->
  <g filter="url(#rough2)">
    <rect x="60" y="382" width="700" height="26" rx="6" fill="#ffffff" stroke="#cccccc" stroke-width="1.2"/>
    <text x="74" y="400" font-size="11" fill="#444444">n = 4 的序列：15，10，6，30      n = 50 的最后一项：30 × 47 = 1410（4 位，远小于 100 位上限）</text>
  </g>
</svg>
