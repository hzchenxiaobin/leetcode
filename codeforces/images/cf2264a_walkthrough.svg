<svg xmlns="http://www.w3.org/2000/svg" width="760" height="486" viewBox="0 0 760 486"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>

  <rect width="760" height="486" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例走查：五组数据的判定过程</text>
  <path d="M 175 42 Q 380 48 585 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 表头 -->
  <rect x="44" y="62" width="672" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="76" y="84" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">#</text>
  <text x="200" y="84" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">排列 p</text>
  <text x="432" y="84" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">错位位置 S → 其上的值</text>
  <text x="620" y="84" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">判定</text>
  <text x="706" y="84" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">答案</text>

  <!-- 第 1 行 -->
  <rect x="44" y="98" width="672" height="34" rx="5" fill="#ffffff" stroke="#c9d4e0" stroke-width="1" filter="url(#rough2)"/>
  <text x="76" y="120" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="200" y="120" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">[1]</text>
  <text x="432" y="120" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">S = ∅</text>
  <text x="620" y="120" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">空集，选 m=1 空操作</text>
  <text x="706" y="120" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">YES</text>

  <!-- 第 2 行 -->
  <rect x="44" y="132" width="672" height="34" rx="5" fill="#f7f9fc" stroke="#c9d4e0" stroke-width="1" filter="url(#rough2)"/>
  <text x="76" y="154" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="200" y="154" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">[4, 2, 3, 1]</text>
  <text x="432" y="154" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">{1, 4} → 4, 1</text>
  <text x="620" y="154" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">4 &gt; 1 严格递减 ✓</text>
  <text x="706" y="154" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">YES</text>

  <!-- 第 3 行 -->
  <rect x="44" y="166" width="672" height="34" rx="5" fill="#ffffff" stroke="#c9d4e0" stroke-width="1" filter="url(#rough2)"/>
  <text x="76" y="188" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="200" y="188" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">[3, 4, 1, 2]</text>
  <text x="432" y="188" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">{1,2,3,4} → 3, 4, 1, 2</text>
  <text x="620" y="188" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">3 &lt; 4 出现上升 ✗</text>
  <text x="706" y="188" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">NO</text>

  <!-- 第 4 行 -->
  <rect x="44" y="200" width="672" height="34" rx="5" fill="#f7f9fc" stroke="#c9d4e0" stroke-width="1" filter="url(#rough2)"/>
  <text x="76" y="222" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="200" y="222" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">[2, 1, 3, 5, 4]</text>
  <text x="432" y="222" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">{1,2,4,5} → 2, 1, 5, 4</text>
  <text x="620" y="222" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">1 &lt; 5 出现上升 ✗</text>
  <text x="706" y="222" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">NO</text>

  <!-- 第 5 行 -->
  <rect x="44" y="234" width="672" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="76" y="256" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">5</text>
  <text x="200" y="256" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">[1, 6, 3, 4, 5, 2]</text>
  <text x="432" y="256" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">{2, 6} → 6, 2</text>
  <text x="620" y="256" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">6 &gt; 2 严格递减 ✓</text>
  <text x="706" y="256" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">YES</text>

  <!-- 反例解读 -->
  <rect x="44" y="286" width="672" height="102" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="60" y="308" font-size="12" font-weight="bold" fill="#a14340" filter="url(#rough2)">看不清的两组，正好是两种典型失败</text>
  <text x="60" y="330" font-size="11.5" fill="#a14340" filter="url(#rough2)">第 4 组：错位的是两段互不相干的交换 (1,2) 与 (4,5)，中间隔着已就位的 3。一次首尾镜像只能</text>
  <text x="60" y="350" font-size="11.5" fill="#a14340" filter="url(#rough2)">有一个中心，照顾不了两段，所以判 NO。</text>
  <text x="60" y="372" font-size="11.5" fill="#a14340" filter="url(#rough2)">第 3 组：整体错位，但错位值 3, 4, 1, 2 不是递减（3 &lt; 4），同样判 NO。</text>

  <!-- 第 5 组操作示范 -->
  <rect x="44" y="404" width="672" height="66" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="60" y="426" font-size="12" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">第 5 组的实际操作：选下标 2 与 6</text>
  <text x="60" y="450" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">值 6, 2 反转成 2, 6 ⇒ [1, 6, 3, 4, 5, 2] 变成 [1, 2, 3, 4, 5, 6]；注意下标不必相邻，也不必把 3、4、5 选进来。</text>
</svg>
