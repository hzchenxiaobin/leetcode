  <text x="470" y="412" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">σ=2 为偶数且 Q₁={A,B} 与 Q₃={A} 共类 ⇒ δ=1，⌈σ/2⌉=1；最大类 3 个点 ⇒ B=2，故 K=max(2,2)=2。</text>
  <text x="470" y="434" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">取法：第 j 个 = [T≥j 的首格, T≤K+j−1 的末格]；(类, 新签名) 两两不同，故 2 个就够。</text>
