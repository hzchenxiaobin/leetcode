<svg xmlns="http://www.w3.org/2000/svg" width="680" height="424" viewBox="0 0 680 424"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="680" height="424" fill="#fafafa"/>
  <text x="340" y="30" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">n − 1 只能落在其中一侧 → 切点只剩 2 个候选</text>
  <text x="340" y="51" text-anchor="middle" font-size="11.5" fill="#888888"
        filter="url(#rough2)">n = 6，a = [2, 5, 5, 4, 4]：最大值 5 的连续段为 [l, r] = [2, 3]</text>
  <rect x="180.0" y="82.0" width="56.0" height="42.0" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="208.0" y="109.0" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="208.0" y="76.0" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">a[1]</text>
  <rect x="246.0" y="82.0" width="56.0" height="42.0" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="274.0" y="109.0" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="274.0" y="76.0" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">a[2]</text>
  <rect x="312.0" y="82.0" width="56.0" height="42.0" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="340.0" y="109.0" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="340.0" y="76.0" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">a[3]</text>
  <rect x="378.0" y="82.0" width="56.0" height="42.0" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="406.0" y="109.0" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="406.0" y="76.0" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">a[4]</text>
  <rect x="444.0" y="82.0" width="56.0" height="42.0" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="472.0" y="109.0" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="472.0" y="76.0" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">a[5]</text>
  <path d="M 241.0 86.0 L 241.0 122.0" stroke="#3a3a3a" stroke-width="1.8" fill="none" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="241.0" y="144.0" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">切点 l = 2</text>
  <path d="M 373.0 86.0 L 373.0 122.0" stroke="#3a3a3a" stroke-width="1.8" fill="none" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="373.0" y="144.0" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">切点 r + 1 = 4</text>
  <text x="340.0" y="166.0" text-anchor="middle" font-size="12" fill="#888888" filter="url(#rough2)">中间位置（如 pos = 3）会让两侧都要求 5，而 5 只有一个，全部排除</text>
  <rect x="36.0" y="182.0" width="608.0" height="76.0" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52.0" y="206.0" text-anchor="start" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">pos = 2（n 在第 2 位，n − 1 = 5 落在右块）</text>
  <text x="52.0" y="229.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">左块 {1}：前缀 max = a[1] = 2；右块 {3,4,5,6}：后缀 max = 5, 5, 4, 4</text>
  <text x="52.0" y="250.0" text-anchor="start" font-size="12" fill="#4a7a3a" filter="url(#rough2)">右块最大值 = a[2] = 5 = n − 1 ✓</text>
  <rect x="36.0" y="270.0" width="608.0" height="76.0" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52.0" y="294.0" text-anchor="start" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">pos = 4（n 在第 4 位，n − 1 = 5 落在左块）</text>
  <text x="52.0" y="317.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">左块 {1,2,3}：前缀 max = 2, 5, 5；右块 {5,6}：后缀 max = a[4], a[5] = 4, 4</text>
  <text x="52.0" y="338.0" text-anchor="start" font-size="12" fill="#4a7a3a" filter="url(#rough2)">左块最大值 = a[3] = 5 = n − 1 ✓</text>
  <text x="340.0" y="376.0" text-anchor="middle" font-size="13" fill="#8a6d20" font-weight="bold" filter="url(#rough2)">结论：只枚举 pos = l 与 pos = r + 1，两个切点分别计数再相加</text>
  <text x="340.0" y="399.0" text-anchor="middle" font-size="11" fill="#888888" filter="url(#rough2)">（排列里 n 的位置唯一，两个候选不会重复统计）</text>
</svg>
