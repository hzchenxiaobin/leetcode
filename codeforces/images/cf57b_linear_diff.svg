<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="233"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="c57" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="470" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">一条路 (a=2, b=4, c=1)：贡献是 p + (c−a) = p − 1，拆成两个差分</text>
  <path d="M 70 40 Q 360 46 650 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 列坐标：6 个格子，x 从 150 起，宽 64 -->
  <g filter="url(#rough2)" font-size="11" fill="#666">
    <text x="182" y="66" text-anchor="middle">p=1</text>
    <text x="246" y="66" text-anchor="middle">p=2</text>
    <text x="310" y="66" text-anchor="middle">p=3</text>
    <text x="374" y="66" text-anchor="middle">p=4</text>
    <text x="438" y="66" text-anchor="middle">p=5</text>
    <text x="502" y="66" text-anchor="middle">p=6</text>
  </g>

  <!-- 行 1：实际贡献 -->
  <text x="30" y="96" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">贡献 v</text>
  <g filter="url(#rough2)" font-size="14">
    <rect x="150" y="74" width="64" height="34" fill="#ffffff" stroke="#9bb0c4" stroke-width="1.2"/>
    <text x="182" y="96" text-anchor="middle" fill="#999">0</text>
    <rect x="214" y="74" width="64" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="246" y="96" text-anchor="middle" font-weight="bold" fill="#2f5223">1</text>
    <rect x="278" y="74" width="64" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="310" y="96" text-anchor="middle" font-weight="bold" fill="#2f5223">2</text>
    <rect x="342" y="74" width="64" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="374" y="96" text-anchor="middle" font-weight="bold" fill="#2f5223">3</text>
    <rect x="406" y="74" width="64" height="34" fill="#ffffff" stroke="#9bb0c4" stroke-width="1.2"/>
    <text x="438" y="96" text-anchor="middle" fill="#999">0</text>
    <rect x="470" y="74" width="64" height="34" fill="#ffffff" stroke="#9bb0c4" stroke-width="1.2"/>
    <text x="502" y="96" text-anchor="middle" fill="#999">0</text>
  </g>

  <!-- 行 2：系数差分 -->
  <text x="30" y="146" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">dCoef</text>
  <g filter="url(#rough2)" font-size="13">
    <rect x="150" y="124" width="64" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <text x="182" y="145" text-anchor="middle" fill="#999">0</text>
    <rect x="214" y="124" width="64" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="246" y="145" text-anchor="middle" font-weight="bold" fill="#2f4a66">+1</text>
    <rect x="278" y="124" width="64" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <text x="310" y="145" text-anchor="middle" fill="#999">0</text>
    <rect x="342" y="124" width="64" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <text x="374" y="145" text-anchor="middle" fill="#999">0</text>
    <rect x="406" y="124" width="64" height="30" fill="#fdecea" stroke="#b85450" stroke-width="1.6"/>
    <text x="438" y="145" text-anchor="middle" font-weight="bold" fill="#8f3a34">−1</text>
    <rect x="470" y="124" width="64" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <text x="502" y="145" text-anchor="middle" fill="#999">0</text>
  </g>
  <text x="546" y="144" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">a 处 +1，b+1 处 −1</text>

  <!-- 行 3：常数差分 -->
  <text x="30" y="192" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">dConst</text>
  <g filter="url(#rough2)" font-size="13">
    <rect x="150" y="170" width="64" height="30" fill="#ffffff" stroke="#d6a040" stroke-width="1.2"/>
    <text x="182" y="191" text-anchor="middle" fill="#999">0</text>
    <rect x="214" y="170" width="64" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="246" y="191" text-anchor="middle" font-weight="bold" fill="#8a6015">−1</text>
    <rect x="278" y="170" width="64" height="30" fill="#ffffff" stroke="#d6a040" stroke-width="1.2"/>
    <text x="310" y="191" text-anchor="middle" fill="#999">0</text>
    <rect x="342" y="170" width="64" height="30" fill="#ffffff" stroke="#d6a040" stroke-width="1.2"/>
    <text x="374" y="191" text-anchor="middle" fill="#999">0</text>
    <rect x="406" y="170" width="64" height="30" fill="#fff8e1" stroke="#b85450" stroke-width="1.6"/>
    <text x="438" y="191" text-anchor="middle" font-weight="bold" fill="#8f3a34">+1</text>
    <rect x="470" y="170" width="64" height="30" fill="#ffffff" stroke="#d6a040" stroke-width="1.2"/>
    <text x="502" y="191" text-anchor="middle" fill="#999">0</text>
  </g>
  <text x="546" y="190" font-size="10.5" fill="#8a6015" filter="url(#rough2)">a 处 +(c−a)，b+1 处 −(c−a)</text>

  <!-- 箭头到结论 -->
  <g filter="url(#rough2)">
    <path d="M 342 206 L 342 224 L 300 240" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#c57)"/>
    <path d="M 374 206 L 374 240" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#c57)"/>
  </g>

  <!-- 结论框：前缀和 -->
  <g filter="url(#rough2)">
    <rect x="60" y="246" width="600" height="150" rx="12" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
    <text x="76" y="272" font-size="12.5" font-weight="bold" fill="#2f4a66">前缀和（扫一遍 p = 1..n）</text>
    <text x="76" y="298" font-size="12" fill="#2b2b2b">K = (0, 1, 1, 1, 0, 0)　→　覆盖格子 p 的路数</text>
    <text x="76" y="322" font-size="12" fill="#2b2b2b">C = (0, −1, −1, −1, 0, 0)　→　覆盖格子 p 的 c−a 之和</text>
    <line x1="76" y1="336" x2="644" y2="336" stroke="#9bb0c4" stroke-width="1"/>
    <text x="76" y="360" font-size="12.5" font-weight="bold" fill="#2f5223">v_p = K_p · p + C_p　⇒　(0, 1, 2, 3, 0, 0)，与第一行完全一致</text>
    <text x="76" y="382" font-size="11" fill="#666">每条路只改 4 个位置，m 条路共 4m 次修改，前缀和 O(n)。</text>
  </g>

  <text x="360" y="426" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">关键：c + (p − a) = 1·p + (c − a)，系数恒为 1，所以「一条路 = 一次区间加 +1 与一次区间加常数」</text>
  <text x="360" y="448" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">若公差不是 1，就要再开一个数组记录「位置的系数」，推广为二次差分。</text>
</svg>
