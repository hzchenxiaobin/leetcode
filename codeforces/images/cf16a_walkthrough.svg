<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">三个样例的判定过程</text>
  <path d="M 220 44 Q 360 50 500 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 样例 1 -->
  <g filter="url(#rough2)">
    <rect x="60" y="80" width="138" height="46" fill="#fde8e8" stroke="#446688" stroke-width="1.2"/>
    <rect x="60" y="126" width="138" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="60" y="172" width="138" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <g font-size="15" text-anchor="middle" fill="#444" filter="url(#rough2)">
    <text x="129" y="109">0 0 0</text><text x="129" y="155">1 1 1</text><text x="129" y="201">2 2 2</text>
  </g>
  <text x="129" y="254" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">每行同色、相邻异色</text>
  <text x="129" y="278" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5223" filter="url(#rough2)">YES</text>

  <!-- 样例 2 -->
  <g filter="url(#rough2)">
    <rect x="290" y="80" width="138" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="290" y="126" width="138" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="290" y="172" width="138" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <g font-size="15" text-anchor="middle" fill="#444" filter="url(#rough2)">
    <text x="359" y="109">0 0 0</text><text x="359" y="155">0 0 0</text><text x="359" y="201">1 1 1</text>
  </g>
  <path d="M 280 126 L 280 172" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="359" y="254" text-anchor="middle" font-size="12" font-weight="bold" fill="#a33a36" filter="url(#rough2)">第 1、2 行同色</text>
  <text x="359" y="278" text-anchor="middle" font-size="14" font-weight="bold" fill="#a33a36" filter="url(#rough2)">NO</text>

  <!-- 样例 3 -->
  <g filter="url(#rough2)">
    <rect x="520" y="80" width="138" height="46" fill="#fde8e8" stroke="#446688" stroke-width="1.2"/>
    <rect x="520" y="126" width="138" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="520" y="172" width="138" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <g font-size="15" text-anchor="middle" fill="#444" filter="url(#rough2)">
    <text x="589" y="109">0 0 0</text><text x="589" y="155">1 1 1</text><text x="589" y="201">0 0 2</text>
  </g>
  <circle cx="626" cy="195" r="15" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="589" y="254" text-anchor="middle" font-size="12" font-weight="bold" fill="#a33a36" filter="url(#rough2)">第 3 行混了 0 和 2</text>
  <text x="589" y="278" text-anchor="middle" font-size="14" font-weight="bold" fill="#a33a36" filter="url(#rough2)">NO</text>

  <rect x="40" y="300" width="640" height="72" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="330" font-size="12" fill="#7a5a1b" filter="url(#rough2)">判定 = 「每一行所有字符相同」且「相邻两行首字符不同」；两条都满足才是 YES。</text>
  <text x="56" y="356" font-size="12" fill="#7a5a1b" filter="url(#rough2)">n = 1 时没有“相邻行”要求，只要唯一一行同色即可。</text>
</svg>
