<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="720" height="470" fill="#fafafa"/>

  <text x="360" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心模型：把圆桌剪成 n 个盒子，每盒一个红位一个蓝位</text>
  <path d="M 152 38 Q 360 45 568 38" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="360" y="58" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">红队得分 = 终局时「蓝位」（编号为偶数的格子）上的土豆数</text>

  <!-- 盒子标签 -->
  <text x="157" y="84" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">盒 1</text>
  <text x="291" y="84" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">盒 2</text>
  <text x="425" y="84" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">盒 3</text>
  <text x="559" y="84" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">盒 4</text>

  <!-- 4 个盒子（虚线框） -->
  <rect x="88" y="92" width="139" height="72" rx="10" fill="none" stroke="#888" stroke-width="1.4" stroke-dasharray="7 6" filter="url(#rough2)"/>
  <rect x="222" y="92" width="139" height="72" rx="10" fill="none" stroke="#888" stroke-width="1.4" stroke-dasharray="7 6" filter="url(#rough2)"/>
  <rect x="356" y="92" width="139" height="72" rx="10" fill="none" stroke="#888" stroke-width="1.4" stroke-dasharray="7 6" filter="url(#rough2)"/>
  <rect x="490" y="92" width="139" height="72" rx="10" fill="none" stroke="#888" stroke-width="1.4" stroke-dasharray="7 6" filter="url(#rough2)"/>

  <!-- 8 个座位：编号 1..8 -->
  <rect x="94" y="96" width="64" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="126" y="112" text-anchor="middle" font-size="11" fill="#a14340" filter="url(#rough2)">1</text>
  <circle cx="126" cy="134" r="13" fill="#fff3cd" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="126" y="139" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">1</text>

  <rect x="161" y="96" width="64" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="193" y="112" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">2</text>
  <text x="193" y="142" text-anchor="middle" font-size="14" fill="#9aa7b4" filter="url(#rough2)">空</text>

  <rect x="228" y="96" width="64" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="112" text-anchor="middle" font-size="11" fill="#a14340" filter="url(#rough2)">3</text>
  <circle cx="260" cy="134" r="13" fill="#fff3cd" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="139" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">1</text>

  <rect x="295" y="96" width="64" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="327" y="112" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">4</text>
  <circle cx="327" cy="134" r="13" fill="#fff3cd" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="327" y="139" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">1</text>

  <rect x="362" y="96" width="64" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="394" y="112" text-anchor="middle" font-size="11" fill="#a14340" filter="url(#rough2)">5</text>
  <circle cx="394" cy="134" r="13" fill="#fff3cd" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="394" y="139" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">1</text>

  <rect x="429" y="96" width="64" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="461" y="112" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">6</text>
  <text x="461" y="142" text-anchor="middle" font-size="14" fill="#9aa7b4" filter="url(#rough2)">空</text>

  <rect x="496" y="96" width="64" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="528" y="112" text-anchor="middle" font-size="11" fill="#a14340" filter="url(#rough2)">7</text>
  <text x="528" y="142" text-anchor="middle" font-size="14" fill="#c9a3a1" filter="url(#rough2)">空</text>

  <rect x="563" y="96" width="64" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="595" y="112" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">8</text>
  <text x="595" y="142" text-anchor="middle" font-size="14" fill="#9aa7b4" filter="url(#rough2)">空</text>

  <!-- 可传箭头（格子下方） -->
  <path d="M 126 154 Q 158 180 188 154" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="157" y="198" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">可传</text>
  <path d="M 394 154 Q 426 180 456 154" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="425" y="198" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">可传</text>

  <!-- 说明面板 -->
  <rect x="40" y="212" width="640" height="128" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="238" font-size="13" fill="#8a6015" filter="url(#rough2)">① 奇数编号格由红队控：红队想把土豆推进「同盒的蓝位」——1 号的土豆能推给 2 号。</text>
  <text x="60" y="264" font-size="13" fill="#8a6015" filter="url(#rough2)">② 偶数编号格由蓝队控：蓝队想把土豆推进「下一盒的红位」——4 号想推给 5 号，但被堵。</text>
  <text x="60" y="290" font-size="13" fill="#8a6015" filter="url(#rough2)">③ 两队目标其实一样：让自己的土豆顺时针挪一格。被堵就动不了，只有「队尾」能动。</text>
  <text x="60" y="316" font-size="13" fill="#8a6015" filter="url(#rough2)">④ 于是最后一轮一定是「能挪就挪」：挪一步 = 送进对方格子 = 稳赚 1 分。</text>

  <!-- 结论 -->
  <rect x="104" y="352" width="512" height="46" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="372" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">答案 = 全员挪一次之后，编号为偶数的格子里的土豆数</text>
  <text x="360" y="390" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">与 k 无关（k ≥ 1）：谁都能「先不动，最后一轮再动」</text>

  <text x="360" y="424" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">浅红格 = 红队座位（奇数编号）　浅蓝格 = 蓝队座位（偶数编号）　琥珀圆 = 有土豆　绿圈 = 本轮可传</text>
  <text x="360" y="448" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">上例（n = 4）：队尾是 1 与 5，挪完得 {2,3,4,6}，偶数编号 2/4/6 共 3 个 → 红 3、蓝 1</text>
</svg>
