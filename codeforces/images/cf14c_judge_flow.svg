<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="163"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="470" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">四条判据，缺一不可</text>
  <path d="M 220 44 Q 380 50 540 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="380" y="64" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">前一条失败就不必再看后面；全部通过才输出 YES</text>

  <!-- 判据 1 -->
  <rect x="30" y="76" width="700" height="70" rx="10" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="62" cy="111" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="62" y="117" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">1</text>
  <text x="90" y="105" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">轴对齐且非退化</text>
  <text x="90" y="128" font-size="11.5" fill="#555" filter="url(#rough2)">每条线段必须水平或竖直，且两个端点不能重合（长度为 0 的边不算边）。</text>

  <!-- 判据 2 -->
  <rect x="30" y="154" width="700" height="70" rx="10" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="62" cy="189" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="62" y="195" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">2</text>
  <text x="90" y="183" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">数量正确</text>
  <text x="90" y="206" font-size="11.5" fill="#555" filter="url(#rough2)">恰好 2 条水平边 + 2 条竖直边；斜边、点、数量不对都直接 NO。</text>

  <!-- 判据 3 -->
  <rect x="30" y="232" width="700" height="82" rx="10" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="62" cy="273" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="62" y="279" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">3</text>
  <text x="90" y="261" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">成对等长平行</text>
  <text x="90" y="283" font-size="11.5" fill="#555" filter="url(#rough2)">两条水平边：x 区间都等于 [xL, xR]，且 y 不同（上下两条）。</text>
  <text x="90" y="302" font-size="11.5" fill="#555" filter="url(#rough2)">两条竖直边：y 区间都等于 [yB, yT]，且 x 不同（左右两条）。</text>

  <!-- 判据 4 -->
  <rect x="30" y="322" width="700" height="84" rx="10" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="62" cy="364" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="62" y="370" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">4</text>
  <text x="90" y="351" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">覆盖且不重叠</text>
  <text x="90" y="373" font-size="11.5" fill="#555" filter="url(#rough2)">水平跨度 [xL, xR] 必须等于两条竖线的 x 坐标；竖直跨度同理。</text>
  <text x="90" y="392" font-size="11.5" fill="#555" filter="url(#rough2)">四个角点恰好由端点相接，每条线段只用一次，不能多出一段。</text>

  <!-- 结果 -->
  <rect x="30" y="418" width="700" height="40" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="444" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">四条判据全过 → YES；任意一条失败 → NO</text>
</svg>
