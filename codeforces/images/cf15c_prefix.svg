<svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 0 780 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="107"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>

  <rect width="780" height="420" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">g(k) = 1⊕2⊕…⊕k 只由 k mod 4 决定</text>
  <path d="M 170 40 Q 390 46 620 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <rect x="110" y="90" width="66" height="34" rx="6" fill="#ffffff" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="143" y="113" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">k=0</text>
  <rect x="110" y="140" width="66" height="40" rx="6" fill="#cfe0f5" stroke="#666666" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="143" y="167" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <rect x="190" y="90" width="66" height="34" rx="6" fill="#ffffff" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="223" y="113" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">k=1</text>
  <rect x="190" y="140" width="66" height="40" rx="6" fill="#d9ecd4" stroke="#666666" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="223" y="167" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <rect x="270" y="90" width="66" height="34" rx="6" fill="#ffffff" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="303" y="113" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">k=2</text>
  <rect x="270" y="140" width="66" height="40" rx="6" fill="#fbe3c8" stroke="#666666" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="303" y="167" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <rect x="350" y="90" width="66" height="34" rx="6" fill="#ffffff" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="383" y="113" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">k=3</text>
  <rect x="350" y="140" width="66" height="40" rx="6" fill="#f6d9d7" stroke="#666666" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="383" y="167" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <rect x="430" y="90" width="66" height="34" rx="6" fill="#ffffff" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="463" y="113" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">k=4</text>
  <rect x="430" y="140" width="66" height="40" rx="6" fill="#cfe0f5" stroke="#666666" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="463" y="167" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <rect x="510" y="90" width="66" height="34" rx="6" fill="#ffffff" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="543" y="113" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">k=5</text>
  <rect x="510" y="140" width="66" height="40" rx="6" fill="#d9ecd4" stroke="#666666" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="543" y="167" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <rect x="590" y="90" width="66" height="34" rx="6" fill="#ffffff" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="623" y="113" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">k=6</text>
  <rect x="590" y="140" width="66" height="40" rx="6" fill="#fbe3c8" stroke="#666666" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="623" y="167" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">7</text>
  <rect x="670" y="90" width="66" height="34" rx="6" fill="#ffffff" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="703" y="113" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">k=7</text>
  <rect x="670" y="140" width="66" height="40" rx="6" fill="#f6d9d7" stroke="#666666" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="703" y="167" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="66" y="167" text-anchor="end" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">g(k)</text>
  <text x="66" y="113" text-anchor="end" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">k</text>
  <rect x="110" y="208" width="600" height="88" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="126" y="232" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">k mod 4 = 0 → g = k　　　= 1 → g = 1　　　= 2 → g = k+1　　　= 3 → g = 0</text>
  <text x="126" y="258" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">每 4 个一组：连续四个整数配对异或都得到 1 ⊕ 1 = 0，所以 g 以 4 为周期。</text>
  <text x="126" y="282" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">区间异或： xor(l..r) = g(r) ⊕ g(l−1)</text>
  <text x="50" y="352" font-size="12" fill="#2b2b2b" filter="url(#rough2)">注意 k=3、k=7 时 g=0：前 3 个、前 7 个数的异或正好抵消，这是本题最常见的边界。</text>
  <text x="50" y="380" font-size="12" fill="#8a6015" filter="url(#rough2)">k 最大到 2×10^16，所以 g(k) 的返回值也要用 64 位整数。</text>
</svg>
