<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="300" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按颜色做 DP，每球更新自己那一格</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">维护前两名颜色即可 O(1) 取"其它颜色的最大值"</text>
  <g filter="url(#rough2)"><rect x="160" y="110" width="100" height="50" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="210.0" y="139.68" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">同色接龙</text>
  <g filter="url(#rough2)"><rect x="300" y="110" width="100" height="50" rx="4" fill="#cfe0f0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="350.0" y="139.68" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">换色重开</text>
  <text x="470" y="140" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">同色：加分 v_i·a；换色/开头：加分 v_i·b</text>
  <text x="470" y="182" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">best[c] = 以颜色 c 结尾的最优值</text>
  <text x="470" y="222" text-anchor="start" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">需要"非 c 的最大值" → 维护前两大</text>
</svg>
