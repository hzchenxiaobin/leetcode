<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="400" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">换根：从 u 移到相邻的 v，只有边 (u,v) 的贡献翻转</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">其余边两侧的"根所在部分"不变，是否需要反转也不变</text>
  <text x="210" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#3d6b2f" filter="url(#rough2)">以 u 为根</text>
  <g filter="url(#rough2)"><circle cx="210" cy="210" r="15" fill="#f6e3c4" fill-opacity="0.9" stroke="#a0522d" stroke-width="1.8"/></g>
  <text x="210" y="215" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">u</text>
  <g filter="url(#rough2)"><circle cx="120" cy="270" r="15" fill="#d7ecd0" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="120" y="275" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">a</text>
  <g filter="url(#rough2)"><circle cx="120" cy="150" r="15" fill="#d7ecd0" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="120" y="155" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">b</text>
  <g filter="url(#rough2)"><circle cx="300" cy="210" r="15" fill="#d6e6f2" fill-opacity="0.9" stroke="#446688" stroke-width="1.8"/></g>
  <text x="300" y="215" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">v</text>
  <g filter="url(#rough2)"><circle cx="360" cy="280" r="15" fill="#d7ecd0" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="360" y="285" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">c</text>
  <g filter="url(#rough2)"><line x1="210" y1="210" x2="120" y2="270" stroke="#888888" stroke-width="1.5" marker-end="url(#arrg)"/></g>
  <g filter="url(#rough2)"><line x1="210" y1="210" x2="120" y2="150" stroke="#888888" stroke-width="1.5" marker-end="url(#arrg)"/></g>
  <g filter="url(#rough2)"><line x1="210" y1="210" x2="300" y2="210" stroke="#888888" stroke-width="1.5" marker-end="url(#arrg)"/></g>
  <g filter="url(#rough2)"><line x1="300" y1="210" x2="360" y2="280" stroke="#888888" stroke-width="1.5" marker-end="url(#arrg)"/></g>
  <text x="210" y="180" text-anchor="middle" font-size="11" fill="#a0522d" filter="url(#rough2)">根</text>
  <text x="610" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">以 v 为根</text>
  <g filter="url(#rough2)"><circle cx="610" cy="210" r="15" fill="#d6e6f2" fill-opacity="0.9" stroke="#446688" stroke-width="1.8"/></g>
  <text x="610" y="215" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">v</text>
  <g filter="url(#rough2)"><circle cx="700" cy="270" r="15" fill="#f6e3c4" fill-opacity="0.9" stroke="#a0522d" stroke-width="1.8"/></g>
  <text x="700" y="275" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">a</text>
  <g filter="url(#rough2)"><circle cx="700" cy="150" r="15" fill="#f6e3c4" fill-opacity="0.9" stroke="#a0522d" stroke-width="1.8"/></g>
  <text x="700" y="155" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">b</text>
  <g filter="url(#rough2)"><circle cx="520" cy="210" r="15" fill="#f6e3c4" fill-opacity="0.9" stroke="#a0522d" stroke-width="1.8"/></g>
  <text x="520" y="215" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">u</text>
  <g filter="url(#rough2)"><circle cx="460" cy="280" r="15" fill="#f6e3c4" fill-opacity="0.9" stroke="#a0522d" stroke-width="1.8"/></g>
  <text x="460" y="285" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">c</text>
  <g filter="url(#rough2)"><line x1="610" y1="210" x2="700" y2="270" stroke="#888888" stroke-width="1.5" marker-end="url(#arrb)"/></g>
  <g filter="url(#rough2)"><line x1="610" y1="210" x2="700" y2="150" stroke="#888888" stroke-width="1.5" marker-end="url(#arrb)"/></g>
  <g filter="url(#rough2)"><line x1="610" y1="210" x2="520" y2="210" stroke="#888888" stroke-width="1.5" marker-end="url(#arrb)"/></g>
  <g filter="url(#rough2)"><line x1="520" y1="210" x2="460" y2="280" stroke="#888888" stroke-width="1.5" marker-end="url(#arrb)"/></g>
  <text x="420" y="336" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">公式：cost(v) = cost(u) + 1（若道路方向 u→v）；cost(v) = cost(u) − 1（若道路方向 v→u）</text>
  <text x="420" y="362" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">所以从任意一个根的答案出发，沿 DFS 序 O(1) 推出所有点的答案</text>
</svg>
