<svg xmlns="http://www.w3.org/2000/svg" width="770" height="360" viewBox="0 0 770 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="770" height="360" fill="#fafafa"/>
  <text x="385.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按总幸福值分桶：从 0 号桶扫到最大可能值，弹出即升序</text>
  <path d="M 144.6400000000001 46 Q 385.0 52 625.3599999999999 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="46.0" y="130.0" width="74.0" height="78.0" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="83.0" y="122.0" text-anchor="middle" font-size="10.6" fill="#6b6b6b" filter="url(#rough2)">桶 0</text>
  <text x="83.0" y="162.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">0</text>
  <text x="83.0" y="188.0" text-anchor="middle" font-size="9.4" fill="#4a6a8a" filter="url(#rough2)">空集</text>
  <rect x="126.0" y="130.0" width="74.0" height="78.0" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="163.0" y="122.0" text-anchor="middle" font-size="10.6" fill="#6b6b6b" filter="url(#rough2)">桶 1</text>
  <text x="163.0" y="162.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <text x="163.0" y="188.0" text-anchor="middle" font-size="9.4" fill="#4a6a8a" filter="url(#rough2)">{1-1}</text>
  <rect x="206.0" y="130.0" width="74.0" height="78.0" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="243.0" y="122.0" text-anchor="middle" font-size="10.6" fill="#6b6b6b" filter="url(#rough2)">桶 2</text>
  <text x="243.0" y="162.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">2</text>
  <text x="243.0" y="188.0" text-anchor="middle" font-size="9.4" fill="#4a6a8a" filter="url(#rough2)">{1-2}</text>
  <rect x="286.0" y="130.0" width="74.0" height="78.0" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="323.0" y="122.0" text-anchor="middle" font-size="10.6" fill="#6b6b6b" filter="url(#rough2)">桶 3</text>
  <text x="323.0" y="162.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">3</text>
  <text x="323.0" y="188.0" text-anchor="middle" font-size="9.4" fill="#4a6a8a" filter="url(#rough2)">{2-1}</text>
  <rect x="366.0" y="130.0" width="74.0" height="78.0" rx="8" fill="#f4f4f4" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="403.0" y="122.0" text-anchor="middle" font-size="10.6" fill="#6b6b6b" filter="url(#rough2)">桶 4</text>
  <text x="403.0" y="162.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#bbbbbb" filter="url(#rough2)">—</text>
  <rect x="446.0" y="130.0" width="74.0" height="78.0" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="483.0" y="122.0" text-anchor="middle" font-size="10.6" fill="#6b6b6b" filter="url(#rough2)">桶 5</text>
  <text x="483.0" y="162.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">5</text>
  <text x="483.0" y="188.0" text-anchor="middle" font-size="9.4" fill="#4a6a8a" filter="url(#rough2)">{1-2,2-1}</text>
  <rect x="526.0" y="130.0" width="74.0" height="78.0" rx="8" fill="#f4f4f4" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="563.0" y="122.0" text-anchor="middle" font-size="10.6" fill="#6b6b6b" filter="url(#rough2)">桶 6</text>
  <text x="563.0" y="162.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#bbbbbb" filter="url(#rough2)">—</text>
  <rect x="606.0" y="130.0" width="74.0" height="78.0" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="643.0" y="122.0" text-anchor="middle" font-size="10.6" fill="#6b6b6b" filter="url(#rough2)">桶 7</text>
  <text x="643.0" y="162.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">7</text>
  <text x="643.0" y="188.0" text-anchor="middle" font-size="9.4" fill="#4a6a8a" filter="url(#rough2)">{2-2}</text>
  <rect x="686.0" y="130.0" width="74.0" height="78.0" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="723.0" y="122.0" text-anchor="middle" font-size="10.6" fill="#6b6b6b" filter="url(#rough2)">桶 8</text>
  <text x="723.0" y="162.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">8</text>
  <text x="723.0" y="188.0" text-anchor="middle" font-size="9.4" fill="#4a6a8a" filter="url(#rough2)">{1-1,2-2}</text>
  <path d="M 36.0 230.0 L 750.0 230.0" stroke="#5b8c5a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="166.0" y="252.0" text-anchor="start" font-size="11.2" fill="#2f5b34" filter="url(#rough2)">按 weight 递增扫描：桶内权重相同，谁先谁后不影响答案</text>
  <rect x="46.0" y="250.0" width="678.0" height="88.0" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="60.0" y="276.0" text-anchor="start" font-size="11.2" fill="#8a6015" filter="url(#rough2)">为什么不用堆：总权重 = 匹配里各边 r 之和，最多 min(n,k) ≤ 20 条边、每条 r ≤ 1000，</text>
  <text x="60.0" y="298.0" text-anchor="start" font-size="11.2" fill="#8a6015" filter="url(#rough2)">故总和 ≤ 20000 —— 开 20001 个 vector 当桶即可，插入 O(1)、弹出 O(1)，</text>
  <text x="60.0" y="320.0" text-anchor="start" font-size="11.2" fill="#8a6015" filter="url(#rough2)">比 priority_queue 少一个 log 因子，200k 次弹出也只需几百万次操作。</text>
</svg>
