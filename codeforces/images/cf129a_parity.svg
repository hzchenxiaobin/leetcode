<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320" viewBox="0 0 700 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1291"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="700" height="320" fill="#fafafa"/>
  <text x="350.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">只看奇偶</text>
  <path d="M 112.0 42 Q 350.0 48 588.0 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="350.0" y="306" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">拿走一袋后总和奇偶 = 原总和奇偶 ⊕ 该袋奇偶</text>
  <rect x="60" y="70" width="280" height="90" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">总和 S 为偶数</text>
  <text x="200" y="130" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">偷偶数袋 → 剩余仍偶</text>
  <rect x="380" y="70" width="280" height="90" rx="7" fill="#fbeeee" stroke="#a05a5a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="520" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#8c2f2c" filter="url(#rough2)">总和 S 为奇数</text>
  <text x="520" y="130" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">偷奇数袋 → 剩余变偶</text>
  <rect x="60" y="190" width="600" height="50" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="220" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#335478" filter="url(#rough2)">答案 = 与 S 同奇偶的袋数</text>
  <text x="360" y="275" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">样例 2：S=26 偶，偶数袋 8 个 → 8；样例 3：S=119 奇，奇数袋 1 个 → 1</text>
</svg>
