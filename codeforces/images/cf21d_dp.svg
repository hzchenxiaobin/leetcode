<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>

  <rect width="720" height="420" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">状压 DP：给奇度点集合做最小权完美匹配</text>
  <path d="M 110 42 Q 360 48 610 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 奇度点 -->
  <g filter="url(#rough2)">
    <circle cx="150" cy="90" r="16" fill="#fde8e8" stroke="#b85450" stroke-width="1.8"/>
    <circle cx="270" cy="90" r="16" fill="#fde8e8" stroke="#b85450" stroke-width="1.8"/>
    <circle cx="390" cy="90" r="16" fill="#fde8e8" stroke="#b85450" stroke-width="1.8"/>
    <circle cx="510" cy="90" r="16" fill="#fde8e8" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle" fill="#a33a36" filter="url(#rough2)">
    <text x="150" y="95">a</text><text x="270" y="95">b</text>
    <text x="390" y="95">c</text><text x="510" y="95">d</text>
  </g>
  <text x="590" y="95" font-size="11" fill="#555" filter="url(#rough2)">奇度点（偶数个）</text>

  <!-- 距离 -->
  <rect x="40" y="130" width="300" height="120" rx="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="156" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">最短路距离（Floyd）</text>
  <g font-size="11" fill="#3c5a73" filter="url(#rough2)">
    <text x="56" y="182">dist(a,b)=2   dist(a,c)=5</text>
    <text x="56" y="204">dist(a,d)=4   dist(b,c)=3</text>
    <text x="56" y="226">dist(b,d)=6   dist(c,d)=1</text>
  </g>

  <!-- 配对表 -->
  <rect x="360" y="130" width="320" height="120" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="376" y="156" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">三种完美匹配</text>
  <g font-size="11" fill="#2f5223" filter="url(#rough2)">
    <text x="376" y="182">ab + cd = 2 + 1 = 3   ← 最小</text>
    <text x="376" y="204">ac + bd = 5 + 6 = 11</text>
    <text x="376" y="226">ad + bc = 4 + 3 = 7</text>
  </g>

  <rect x="40" y="266" width="640" height="90" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <g font-size="12" fill="#7a5a1b" filter="url(#rough2)">
    <text x="56" y="294">dp[mask] = 把 mask 中的奇度点两两配对的代价最小值；dp[0] = 0。</text>
    <text x="56" y="320">取 mask 的最低位 i，枚举 j ∈ mask\{i}：dp[mask] = min( dist(i,j) + dp[mask ^ {i,j}] )。</text>
    <text x="56" y="346">每个状态只保留"剩余集合"，共有 2^k 个状态（k ≤ 14），复杂度和 k·2^k 成正比。</text>
  </g>

  <text x="40" y="392" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">最后答案 = 原图所有边权和 + dp[全集]；若 dp[全集] 不可达，说明图不连通，输出 -1。</text>
</svg>
