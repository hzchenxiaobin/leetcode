<svg xmlns="http://www.w3.org/2000/svg" width="840" height="340" viewBox="0 0 840 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="340" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">DP：逐类合并，指数是列数 cnt_j</text>
  <text x="420" y="56" text-anchor="middle" font-size="11.8" fill="#666666" filter="url(#rough2)">dp[s] = 已放 s 个点的方案数</text>
  <g filter="url(#rough2)"><rect x="110" y="96" width="220" height="80" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="220" y="124" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">第 j 类取 c 个点</text>
  <text x="220" y="152" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">贡献 C(n,c)^{cnt_j}</text>
  <g filter="url(#rough2)"><rect x="400" y="96" width="300" height="80" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="550" y="124" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">ndp[s+c] += dp[s]·贡献</text>
  <text x="550" y="152" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">对 c=0..n 与 s=0..k</text>
  <g filter="url(#rough2)"><line x1="330" y1="136" x2="400" y2="136" stroke="#8899aa" stroke-width="1.4" marker-end="url(#arrb)"/></g>
  <text x="420" y="220" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">答案 = dp[k]（所有类共放 k 个点的方案数）</text>
  <g filter="url(#rough2)"><rect x="200" y="246" width="440" height="40" rx="4" fill="#f7fbf4" fill-opacity="0.85" stroke="#a8c99a" stroke-width="1.3"/></g>
  <text x="420" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#3d6b2f" filter="url(#rough2)">O(n²k + n² log m)，n=100、k=10⁴ 约 40 ms</text>
  <text x="420" y="316" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">模 10⁹+7；m 可达 10¹⁸ 用快速幂</text>
</svg>
