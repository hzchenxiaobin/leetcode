<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="77"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">180D 样例 4：s=&quot;czaaab&quot;，t=&quot;abcdef&quot;</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="40.0" y="92.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">匹配 t 的前缀：a ✓、b ✓、c ✓、d ✗ → 最长可行前缀 k = 3</text>
  <text x="40.0" y="126.0" text-anchor="start" font-size="12.5" fill="#444" filter="url(#rough2)">剩余字母（去掉 a,b,c 后）：a a z</text>
  <text x="40.0" y="160.0" text-anchor="start" font-size="12.5" fill="#8a6015" font-weight="bold" filter="url(#rough2)">选大于 t[3]=&quot;d&quot; 的最小字母：z</text>
  <text x="40.0" y="194.0" text-anchor="start" font-size="13.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">拼起来：abc + z + aa = &quot;abczaa&quot;</text>
  <text x="40.0" y="250.0" text-anchor="start" font-size="12" fill="#444" filter="url(#rough2)">对比其他候选：k=0 选 b → &quot;baaacz&quot;（更大），所以 k=3 最优。</text>
  <rect x="40.0" y="290.0" width="640.0" height="72.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="54.0" y="313.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">答案里的字母必须与 s 的多重集合完全一致</text>
  <text x="54.0" y="339.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">k = |t| 且 |s| &gt; |t| 时，直接把 t 当前缀，剩余字母排序接在后面</text>
</svg>
