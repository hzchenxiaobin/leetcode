<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="303"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">191A 样例 1：abc + cba = 6</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="90.0" y="110.0" text-anchor="start" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">处理</text>
  <text x="330.0" y="110.0" text-anchor="start" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">状态变化</text>
  <rect x="70.0" y="122.0" width="580.0" height="44.0" fill="#ffffff" stroke="#dddddd" stroke-width="1.1" rx="6" filter="url(#rough2)"/>
  <text x="90.0" y="150.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">abc (a→c,3)</text>
  <text x="330.0" y="150.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">dp[a][c] = 3</text>
  <rect x="70.0" y="178.0" width="580.0" height="44.0" fill="#ffffff" stroke="#dddddd" stroke-width="1.1" rx="6" filter="url(#rough2)"/>
  <text x="90.0" y="206.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">ca (c→a,2)</text>
  <text x="330.0" y="206.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">dp[a][a] = 3+2 = 5；dp[c][a] = 2</text>
  <rect x="70.0" y="234.0" width="580.0" height="44.0" fill="#ffffff" stroke="#dddddd" stroke-width="1.1" rx="6" filter="url(#rough2)"/>
  <text x="90.0" y="262.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">cba (c→a,3)</text>
  <text x="330.0" y="262.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">dp[a][a] = max(5, 3+3=6) = 6</text>
  <rect x="60.0" y="320.0" width="600.0" height="50.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="74.0" y="344.0" text-anchor="start" font-size="12" fill="#3f3420" filter="url(#rough2)">答案 max_c dp[c][c] = 6，与官方输出一致</text>
</svg>
