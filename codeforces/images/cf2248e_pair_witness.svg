<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect x="-8" y="-8" width="736" height="436" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">只需一条 0：让 a = 1…1 0 1…1，与同长度全 1 串对打</text>
  <path d="M 96 42 Q 360 50 624 42" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- 第一行：a = 1^x 0 1^y -->
  <text x="38" y="88" font-size="14" fill="#2b2b2b" filter="url(#rough2)">a =</text>
  <rect x="96" y="62" width="34" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="130" y="62" width="34" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="164" y="62" width="34" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="198" y="62" width="34" height="38" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.9" filter="url(#rough2)"/>
  <rect x="232" y="62" width="34" height="38" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="266" y="62" width="34" height="38" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="300" y="62" width="34" height="38" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="334" y="62" width="34" height="38" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="147" y="87" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">1</text>
  <text x="181" y="87" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">1</text>
  <text x="215" y="87" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">1</text>
  <text x="249" y="87" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="283" y="87" text-anchor="middle" font-size="15" fill="#d6a040" filter="url(#rough2)">1</text>
  <text x="317" y="87" text-anchor="middle" font-size="15" fill="#d6a040" filter="url(#rough2)">1</text>
  <text x="351" y="87" text-anchor="middle" font-size="15" fill="#d6a040" filter="url(#rough2)">1</text>
  <text x="385" y="87" text-anchor="middle" font-size="15" fill="#d6a040" filter="url(#rough2)">1</text>

  <path d="M 96 108 L 198 108" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 232 108 L 368 108" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="147" y="124" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">x 个 1</text>
  <text x="300" y="124" text-anchor="middle" font-size="12" fill="#8a6420" filter="url(#rough2)">y 个 1</text>

  <text x="420" y="80" font-size="13" fill="#2b4a66" filter="url(#rough2)">f(a) = g(x) + g(y)</text>
  <text x="420" y="100" font-size="12" fill="#7a7a7a" filter="url(#rough2)">（0 把两段完全隔开）</text>
  <text x="420" y="120" font-size="12" fill="#7a7a7a" filter="url(#rough2)">长度 = x + y + 1</text>

  <!-- 第二行：全 1 串 -->
  <text x="38" y="162" font-size="14" fill="#2b2b2b" filter="url(#rough2)">I(a) =</text>
  <rect x="96" y="140" width="34" height="38" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="130" y="140" width="34" height="38" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="164" y="140" width="34" height="38" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="198" y="140" width="34" height="38" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="232" y="140" width="34" height="38" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="266" y="140" width="34" height="38" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="300" y="140" width="34" height="38" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="334" y="140" width="34" height="38" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="147" y="165" text-anchor="middle" font-size="15" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="181" y="165" text-anchor="middle" font-size="15" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="215" y="165" text-anchor="middle" font-size="15" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="249" y="165" text-anchor="middle" font-size="15" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="283" y="165" text-anchor="middle" font-size="15" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="317" y="165" text-anchor="middle" font-size="15" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="351" y="165" text-anchor="middle" font-size="15" fill="#d6a040" filter="url(#rough2)">1</text>
  <text x="385" y="165" text-anchor="middle" font-size="15" fill="#d6a040" filter="url(#rough2)">1</text>

  <rect x="92" y="136" width="212" height="46" rx="8" fill="none" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="296" y="136" width="76" height="46" rx="8" fill="none" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="198" y="202" text-anchor="middle" font-size="12" fill="#3a5f2c" filter="url(#rough2)">整块 n → G</text>
  <text x="334" y="202" text-anchor="middle" font-size="12" fill="#8a6420" filter="url(#rough2)">余数 → g(rem)</text>

  <text x="420" y="158" font-size="13" fill="#2b4a66" filter="url(#rough2)">f(I(a)) = B(x+y+1)</text>
  <text x="420" y="178" font-size="12" fill="#7a7a7a" filter="url(#rough2)">= q·G + g(rem)，q = ⌊·/n⌋</text>
  <text x="420" y="198" font-size="12" fill="#7a7a7a" filter="url(#rough2)">rem = (x+y+1) mod n</text>

  <!-- 公式面板 -->
  <rect x="40" y="228" width="640" height="82" rx="12" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="60" y="256" font-size="14" fill="#b85450" filter="url(#rough2)">F(x, y) = R(x) + R(y) − R(rem) − d − q·T　（d·(x+y) 与整块部分全部抵消）</text>
  <text x="60" y="284" font-size="13" fill="#2b2b2b" filter="url(#rough2)">a 能赢 ⇔ 存在 x, y ≥ 1 使 F(x, y) &gt; 0；只需尝试 x, y ∈ {p_j} 与互补对</text>
  <text x="60" y="304" font-size="13" fill="#2b2b2b" filter="url(#rough2)">q = ⌊(x+y+1)/n⌋ 只会是 0 或 1（x, y ≤ n−1）</text>

  <!-- 两种情形 -->
  <rect x="60" y="326" width="284" height="52" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="202" y="348" text-anchor="middle" font-size="12" fill="#2b4a66" filter="url(#rough2)">q = 0：x+y+1 ≤ n</text>
  <text x="202" y="366" text-anchor="middle" font-size="12" fill="#2b4a66" filter="url(#rough2)">基准里没有整块，只赔掉一个 1 的 d</text>
  <rect x="372" y="326" width="284" height="52" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="514" y="348" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">q = 1：x+y+1 &gt; n</text>
  <text x="514" y="366" text-anchor="middle" font-size="12" fill="#8a3a36" filter="url(#rough2)">基准多拿一个整块，还要再赔 T</text>
</svg>
