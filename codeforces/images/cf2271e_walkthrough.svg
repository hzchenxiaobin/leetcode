<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="780" height="430" fill="#fafafa"/>

  <text x="390" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">样例 8 演算：n = 8，k = 0，a = [8, 8, 2, 8, 8, 1, 8, 8]，桶 = {8:6, 2:1, 1:1}</text>

  <rect x="30" y="46" width="342" height="360" rx="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="201" y="72" text-anchor="middle" font-size="14" fill="#8f3a36" filter="url(#rough2)">S = 1：top = 0 + 8 + 2 − 1 = 9</text>

  <text x="50" y="104" font-size="12.5" fill="#444" filter="url(#rough2)">8 ≤ 9 → 删除，top = 8</text>
  <text x="50" y="130" font-size="12.5" fill="#444" filter="url(#rough2)">8 ≤ 8 → 删除，top = 7</text>
  <text x="50" y="156" font-size="12.5" fill="#8f3a36" filter="url(#rough2)">8 &gt; 7 → 分裂 8 → 4×2，splits = 1</text>
  <text x="50" y="182" font-size="12.5" fill="#8f3a36" filter="url(#rough2)">8 &gt; 7 → 需要第 2 次分裂 &gt; S</text>

  <rect x="50" y="202" width="302" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="201" y="229" text-anchor="middle" font-size="14" fill="#8a6520" filter="url(#rough2)">✗ check(1) = false</text>

  <text x="50" y="276" font-size="12.5" fill="#666" filter="url(#rough2)">原因：前两步删掉两个 8 后 top 掉到 7，</text>
  <text x="50" y="300" font-size="12.5" fill="#666" filter="url(#rough2)">剩下四个 8 已无处可删，只能继续分裂，</text>
  <text x="50" y="324" font-size="12.5" fill="#666" filter="url(#rough2)">可分裂额度只有 1 次，不够。</text>
  <text x="50" y="356" font-size="12.5" fill="#b85450" filter="url(#rough2)">需要更多分裂 ⇒ 二分向右走。</text>

  <rect x="408" y="46" width="342" height="360" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="579" y="72" text-anchor="middle" font-size="14" fill="#33612a" filter="url(#rough2)">S = 2：top = 0 + 8 + 4 − 1 = 11</text>

  <text x="428" y="102" font-size="12.5" fill="#444" filter="url(#rough2)">8 ≤ 11 → 删除，top = 10</text>
  <text x="428" y="126" font-size="12.5" fill="#444" filter="url(#rough2)">8 ≤ 10 → 删除，top = 9</text>
  <text x="428" y="150" font-size="12.5" fill="#444" filter="url(#rough2)">8 ≤ 9 → 删除，top = 8</text>
  <text x="428" y="174" font-size="12.5" fill="#444" filter="url(#rough2)">8 ≤ 8 → 删除，top = 7</text>
  <text x="428" y="198" font-size="12.5" fill="#33612a" filter="url(#rough2)">8 &gt; 7 → 分裂，splits = 1</text>
  <text x="428" y="222" font-size="12.5" fill="#33612a" filter="url(#rough2)">8 &gt; 7 → 分裂，splits = 2</text>
  <text x="428" y="246" font-size="12.5" fill="#444" filter="url(#rough2)">4 ≤ 7 → 连删四个 4，top = 3</text>
  <text x="428" y="270" font-size="12.5" fill="#444" filter="url(#rough2)">2 ≤ 3 → 删除，top = 2</text>
  <text x="428" y="294" font-size="12.5" fill="#444" filter="url(#rough2)">1 ≤ 2 → 删除，top = 1，桶空</text>

  <rect x="428" y="318" width="302" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="579" y="340" text-anchor="middle" font-size="13.5" fill="#8a6520" filter="url(#rough2)">✓ check(2) = true</text>
  <text x="579" y="360" text-anchor="middle" font-size="13.5" fill="#8a6520" filter="url(#rough2)">答案 = n + 2S = 8 + 4 = 12</text>
</svg>
