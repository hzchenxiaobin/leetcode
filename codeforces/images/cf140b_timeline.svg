  <rect x="255" y="144" width="135" height="36" rx="5" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="322.5" y="166.1" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">{1,2}</text>
