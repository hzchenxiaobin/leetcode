  <text x="612.5" y="166.1" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">{1,2,3,4}</text>
  <rect x="110" y="192" width="135" height="36" rx="5" fill="#e8eef7" stroke="#335478" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="177.5" y="214.1" text-anchor="middle" font-size="11.5" fill="#335478" filter="url(#rough2)">1</text>
  <rect x="255" y="192" width="135" height="36" rx="5" fill="#e8eef7" stroke="#335478" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="322.5" y="214.1" text-anchor="middle" font-size="11.5" fill="#335478" filter="url(#rough2)">1</text>
  <rect x="400" y="192" width="135" height="36" rx="5" fill="#e8eef7" stroke="#335478" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="467.5" y="214.1" text-anchor="middle" font-size="11.5" fill="#335478" filter="url(#rough2)">3</text>
  <rect x="545" y="192" width="135" height="36" rx="5" fill="#e8eef7" stroke="#335478" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="612.5" y="214.1" text-anchor="middle" font-size="11.5" fill="#335478" filter="url(#rough2)">3</text>
  <rect x="110" y="240" width="135" height="36" rx="5" fill="#f7efe8" stroke="#8c5a2c" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="177.5" y="262.1" text-anchor="middle" font-size="11.5" fill="#8c5a2c" filter="url(#rough2)">—</text>
  <rect x="255" y="240" width="135" height="36" rx="5" fill="#f7efe8" stroke="#8c5a2c" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="322.5" y="262.1" text-anchor="middle" font-size="11.5" fill="#8c5a2c" filter="url(#rough2)">2</text>
  <rect x="400" y="240" width="135" height="36" rx="5" fill="#f7efe8" stroke="#8c5a2c" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="467.5" y="262.1" text-anchor="middle" font-size="11.5" fill="#8c5a2c" filter="url(#rough2)">1</text>
  <rect x="545" y="240" width="135" height="36" rx="5" fill="#f7efe8" stroke="#8c5a2c" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="612.5" y="262.1" text-anchor="middle" font-size="11.5" fill="#8c5a2c" filter="url(#rough2)">1</text>
  <rect x="110" y="278" width="570" height="32" rx="5" fill="#f5e8e8" stroke="#8c2f2c" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="395.0" y="297.8" text-anchor="middle" font-size="10.5" fill="#8c2f2c" filter="url(#rough2)">寄给朋友 i 时：若 best[t] = i 就退而取 second[t]，绝不给对方寄他自己的卡片</text>
  <text x="360.0" y="306" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">样例：n=4，Alexander 的偏好 3 1 2 4</text>
</svg>
