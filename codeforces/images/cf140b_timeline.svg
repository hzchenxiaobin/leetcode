  <text x="30.0" y="214.0" text-anchor="start" font-size="10.5" fill="#555555" filter="url(#rough2)">最喜欢 best</text>
  <text x="30.0" y="262.0" text-anchor="start" font-size="10.5" fill="#555555" filter="url(#rough2)">次喜欢 second</text>
