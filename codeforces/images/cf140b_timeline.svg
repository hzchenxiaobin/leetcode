  <rect x="400" y="96" width="135" height="36" rx="5" fill="#f0f0f0" stroke="#555555" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="467.5" y="118.1" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">t = 3</text>
  <rect x="545" y="96" width="135" height="36" rx="5" fill="#f0f0f0" stroke="#555555" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="612.5" y="118.1" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">t = 4</text>
  <rect x="110" y="144" width="135" height="36" rx="5" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
