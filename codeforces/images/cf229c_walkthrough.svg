<svg xmlns="http://www.w3.org/2000/svg" width="840" height="360" viewBox="0 0 840 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="360" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1：度数 → 楔形 → 答案</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">n=5，A 的边：1-2,1-3,2-3,2-4,3-4</text>
  <text x="200" y="100" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">A 的度数</text>
  <g filter="url(#rough2)"><rect x="120" y="112" width="90" height="44" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="165" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="165" y="172" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">v=1</text>
  <g filter="url(#rough2)"><rect x="230" y="112" width="90" height="44" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="275" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="275" y="172" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">v=2</text>
  <g filter="url(#rough2)"><rect x="340" y="112" width="90" height="44" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="385" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="385" y="172" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">v=3</text>
  <g filter="url(#rough2)"><rect x="450" y="112" width="90" height="44" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="495" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="495" y="172" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">v=4</text>
  <g filter="url(#rough2)"><rect x="560" y="112" width="90" height="44" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="605" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="605" y="172" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">v=5</text>
  <text x="420" y="210" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">S_A = C(2,2)+C(3,2)+C(3,2)+C(2,2)+0 = 8</text>
  <text x="420" y="238" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">S_B = C(2,2)+C(1,2)+C(1,2)+C(2,2)+C(4,2) = 8</text>
  <text x="420" y="266" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">C(5,3) = 10</text>
  <g filter="url(#rough2)"><rect x="230" y="288" width="380" height="40" rx="4" fill="#faf3ec" fill-opacity="0.85" stroke="#c8a48a" stroke-width="1.3"/></g>
  <text x="420" y="314" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3d6b2f" filter="url(#rough2)">答案 = (8 + 8 − 10)/2 = 3</text>
</svg>
