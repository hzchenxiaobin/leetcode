<svg xmlns="http://www.w3.org/2000/svg" width="700" height="280" viewBox="0 0 700 280"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="721"/>
    <feDisplacementMap in="SourceGraphic" scale="1.5"/></filter></defs>
  <rect width="700" height="280" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">候选只有最小值：它若不能整除全部，就无解</text>
  <path d="M 130 40 Q 350 46 570 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="76" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="12.5" fill="#22314a" filter="url(#rough2)">设答案是数组里的某个 x：x 必须整除**所有**元素，特别要整除最小值 m。</text>
  <text x="76" y="106" font-size="12.5" fill="#22314a" filter="url(#rough2)">但 x ≥ m（m 是最小元素）且 x | m ⇒ x = m。</text>
  <text x="76" y="130" font-size="12.5" fill="#22314a" filter="url(#rough2)">⇒ 只需检查 m 是否整除所有元素：是则输出 m，否则 −1。</text>
  <g filter="url(#rough2)"><rect x="60" y="146" width="580" height="66" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="170" font-size="12.5" fill="#2f5223" filter="url(#rough2)">样例 1：[2,2,4] ⇒ m=2，全部被 2 整除 ⇒ 2 ✓</text>
  <text x="76" y="194" font-size="12.5" fill="#2f5223" filter="url(#rough2)">样例 2：[2,1,3,1,6] ⇒ m=1，1 整除一切 ⇒ 1 ✓（1 永远是最小候选）</text>
  <text x="76" y="214" font-size="12" fill="#2f5223" filter="url(#rough2)">样例 3：[2,3,5] ⇒ m=2 不能整除 3 ⇒ −1 ✓</text>
  <g filter="url(#rough2)"><rect x="60" y="236" width="580" height="34" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="76" y="258" font-size="12.5" fill="#8a6015" filter="url(#rough2)">O(n) 时间；n ≤ 10⁵、aᵢ ≤ 10⁹。</text>
</svg>
