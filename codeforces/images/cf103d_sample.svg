<svg xmlns="http://www.w3.org/2000/svg" width="880" height="392" viewBox="0 0 880 392"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="103"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/></marker>
  </defs>
  <rect width="880" height="392" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1：w = 1 2 3</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">(1,1) → 6；(1,2) → 1+3 = 4</text>
  <g filter="url(#rough2)"><rect x="184" y="120" width="72" height="52" rx="4" fill="#f6e3c4" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.3"/></g>
  <text x="220" y="138" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">w=1</text>
  <text x="220" y="160" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">#1</text>
  <g filter="url(#rough2)"><rect x="304" y="120" width="72" height="52" rx="4" fill="#d7ecd0" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.3"/></g>
  <text x="340" y="138" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">w=2</text>
  <text x="340" y="160" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">#2</text>
  <g filter="url(#rough2)"><rect x="424" y="120" width="72" height="52" rx="4" fill="#cfe0f5" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.3"/></g>
  <text x="460" y="138" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">w=3</text>
  <text x="460" y="160" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">#3</text>
  <g filter="url(#rough2)"><line x1="220" y1="196" x2="460" y2="196" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrg)"/></g>
  <text x="340" y="222" text-anchor="middle" font-size="11.5" fill="#3d6b2f" filter="url(#rough2)">b=1：1+2+3 = 6</text>
  <g filter="url(#rough2)"><line x1="220" y1="250" x2="460" y2="250" stroke="#8a2b28" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrr)"/></g>
  <text x="340" y="276" text-anchor="middle" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">b=2：1+3 = 4</text>
  <text x="440" y="320" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">(a,b) 依次取 a, a+b, a+2b, … 直到超过 n</text>
</svg>
