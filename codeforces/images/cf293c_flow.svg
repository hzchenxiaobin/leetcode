<svg xmlns="http://www.w3.org/2000/svg" width="700" height="260" viewBox="0 0 700 260"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="523"/>
    <feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></defs>
  <rect width="700" height="260" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程</text>
  <path d="M 200 40 Q 350 46 500 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="48" rx="8" fill="#fbeeee" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="76" y="88" font-size="13" fill="#8a3a36" filter="url(#rough2)">① n % 3 ≠ 0 或 N = n/3 &lt; 8 ⇒ 答案 0（最小是 a=b=c=1 时的 N=8）</text>
  <g filter="url(#rough2)"><rect x="60" y="116" width="580" height="48" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="146" font-size="13" fill="#22314a" filter="url(#rough2)">② 试除分解 N，生成全部因子</text>
  <g filter="url(#rough2)"><rect x="60" y="174" width="580" height="48" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="204" font-size="13" fill="#2f5223" filter="url(#rough2)">③ 枚举 x | N、y | N/x，令 z=N/(xy)，检查 x,y,z≥2、三角不等式、和为偶</text>
  <g filter="url(#rough2)"><rect x="60" y="232" width="580" height="24" rx="6" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.2"/></g>
  <text x="76" y="249" font-size="12" fill="#8a6015" filter="url(#rough2)">满足的个数即答案（顺序不同算不同）。复杂度约 O(d(N)²)。</text>
</svg>
