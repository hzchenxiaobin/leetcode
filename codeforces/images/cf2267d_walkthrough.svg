<svg xmlns="http://www.w3.org/2000/svg" width="820" height="540" viewBox="0 0 820 540"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="820" height="540" fill="#fafafa"/>

  <text x="410" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">7 组官方样例：降序两两配对，逐对检查下标奇偶</text>
  <path d="M 170 44 Q 410 52 650 44" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <text x="56" y="74" text-anchor="middle" font-size="12" fill="#6a6a6a" filter="url(#rough2)">组</text>
  <text x="88" y="74" font-size="12" fill="#6a6a6a" filter="url(#rough2)">数组 a</text>
  <text x="204" y="74" font-size="12" fill="#6a6a6a" filter="url(#rough2)">降序配对（值@原下标）</text>
  <text x="520" y="74" font-size="12" fill="#6a6a6a" filter="url(#rough2)">问题出在哪</text>
  <text x="708" y="74" text-anchor="middle" font-size="12" fill="#6a6a6a" filter="url(#rough2)">判定</text>
  <path d="M 40 84 L 760 84" stroke="#c8c8c8" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- 行 1 -->
  <text x="56" y="112" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="88" y="112" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">2 1 3</text>
  <text x="204" y="112" font-size="12" fill="#2b2b2b" filter="url(#rough2)">(3@3, 2@1)✗  (1@2)</text>
  <text x="520" y="112" font-size="11.5" fill="#8c3b38" filter="url(#rough2)">第 1 对同为奇数位</text>
  <rect x="676" y="88" width="64" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="708" y="107" text-anchor="middle" font-size="12.5" fill="#8c3b38" filter="url(#rough2)">NO</text>

  <!-- 行 2 -->
  <text x="56" y="168" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="88" y="168" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">1 2 3 4</text>
  <text x="204" y="168" font-size="12" fill="#2b2b2b" filter="url(#rough2)">(4@4, 3@3)✓  (2@2, 1@1)✓</text>
  <text x="520" y="168" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">所有对都异类</text>
  <rect x="676" y="144" width="64" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="708" y="163" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">YES</text>

  <!-- 行 3 -->
  <text x="56" y="224" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="88" y="224" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">5 3 4 6 2 1</text>
  <text x="204" y="224" font-size="12" fill="#2b2b2b" filter="url(#rough2)">(6@4, 5@1)✓ (4@3, 3@2)✓ (2@5, 1@6)✓</text>
  <text x="520" y="224" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">所有对都异类</text>
  <rect x="676" y="200" width="64" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="708" y="219" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">YES</text>

  <!-- 行 4 -->
  <text x="56" y="280" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="88" y="280" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">1 5 2 3 6 4</text>
  <text x="204" y="280" font-size="12" fill="#2b2b2b" filter="url(#rough2)">(6@5, 5@2)✓ (4@6, 3@4)✗ (2@3, 1@1)✗</text>
  <text x="520" y="280" font-size="11.5" fill="#8c3b38" filter="url(#rough2)">第 2、3 对同类</text>
  <rect x="676" y="256" width="64" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="708" y="275" text-anchor="middle" font-size="12.5" fill="#8c3b38" filter="url(#rough2)">NO</text>

  <!-- 行 5 -->
  <text x="56" y="336" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <text x="88" y="336" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">1 2 3 4 7 5 6</text>
  <text x="204" y="336" font-size="12" fill="#2b2b2b" filter="url(#rough2)">(7@5, 6@7)✗ (5@6, 4@4)✗ (3@3, 2@2)✓ (1@1)</text>
  <text x="520" y="336" font-size="11.5" fill="#8c3b38" filter="url(#rough2)">第 1、2 对同类</text>
  <rect x="676" y="312" width="64" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="708" y="331" text-anchor="middle" font-size="12.5" fill="#8c3b38" filter="url(#rough2)">NO</text>

  <!-- 行 6 -->
  <text x="56" y="392" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">6</text>
  <text x="88" y="392" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">5 4 1 3 2</text>
  <text x="204" y="392" font-size="12" fill="#2b2b2b" filter="url(#rough2)">(5@1, 4@2)✓ (3@4, 2@5)✓ (1@3)</text>
  <text x="520" y="392" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">n 为奇数，1 不配对</text>
  <rect x="676" y="368" width="64" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="708" y="387" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">YES</text>

  <!-- 行 7 -->
  <text x="56" y="448" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">7</text>
  <text x="88" y="448" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">4 1 3 2 6 5</text>
  <text x="204" y="448" font-size="12" fill="#2b2b2b" filter="url(#rough2)">(6@5, 5@6)✓ (4@1, 3@3)✗ (2@4, 1@2)✗</text>
  <text x="520" y="448" font-size="11.5" fill="#8c3b38" filter="url(#rough2)">第 2 对同为奇数位</text>
  <rect x="676" y="424" width="64" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="708" y="443" text-anchor="middle" font-size="12.5" fill="#8c3b38" filter="url(#rough2)">NO</text>

  <path d="M 40 472 L 760 472" stroke="#c8c8c8" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="410" y="496" text-anchor="middle" font-size="12" fill="#5a5a5a"
        filter="url(#rough2)">读法：每对 (第 2t−1 大, 第 2t 大) 看两个值的原下标奇偶，只要有一对同类就 NO</text>
  <text x="410" y="518" text-anchor="middle" font-size="12" fill="#5a5a5a"
        filter="url(#rough2)">样例 4 与 5 前几位很像，配对结果却不同，所以必须逐对检查，不能只看整体</text>
</svg>
