<svg xmlns="http://www.w3.org/2000/svg" width="884" height="440" viewBox="0 0 884 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="83"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="884" height="440" fill="#fafafa"/>
  <text x="442" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">83D 的判定分支：先看 k 是不是素数</text>
  <text x="442" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">m = x/k，只需统计 [lo, hi] 中“没有小于 k 的素因子”的 m</text>
  <g filter="url(#rough2)"><rect x="150" y="92" width="584" height="56" rx="4" fill="#f6d9d7" fill-opacity="0.55" stroke="#778899" stroke-width="1.4"/></g>
  <text x="164" y="116" text-anchor="start" font-size="13.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">k 不是素数</text>
  <text x="164" y="136" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">答案 0（k 的某个素因子 &lt; k 也会整除 x）</text>
  <g filter="url(#rough2)"><rect x="150" y="176" width="584" height="56" rx="4" fill="#f6e3c4" fill-opacity="0.55" stroke="#778899" stroke-width="1.4"/></g>
  <text x="164" y="200" text-anchor="start" font-size="13.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">m ≤ hi &lt; k</text>
  <text x="164" y="220" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">只有 m = 1 合格 → 答案 1 或 0</text>
  <g filter="url(#rough2)"><rect x="150" y="260" width="584" height="56" rx="4" fill="#cfe0f5" fill-opacity="0.55" stroke="#778899" stroke-width="1.4"/></g>
  <text x="164" y="284" text-anchor="start" font-size="13.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">k² &gt; hi</text>
  <text x="164" y="304" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">m 只能是 1 或 ≥ k 的素数 → 筛到 hi 数素数</text>
  <g filter="url(#rough2)"><rect x="150" y="344" width="584" height="56" rx="4" fill="#d7ecd0" fill-opacity="0.55" stroke="#778899" stroke-width="1.4"/></g>
  <text x="164" y="368" text-anchor="start" font-size="13.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">k² ≤ hi</text>
  <text x="164" y="388" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">此时 k ≤ 1259，用 &lt; k 的素数做容斥 dfs</text>
  <g filter="url(#rough2)"><line x1="440" y1="148" x2="440" y2="176" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)"/></g>
  <g filter="url(#rough2)"><line x1="440" y1="232" x2="440" y2="260" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)"/></g>
  <g filter="url(#rough2)"><line x1="440" y1="316" x2="440" y2="344" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)"/></g>
  <text x="762" y="120" text-anchor="start" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">依次判断</text>
  <text x="762" y="136" text-anchor="start" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">（从上到下）</text>
  <text x="440" y="424" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">关键：k 非素数直接 0；k 素数时 x = k·m 且 m 的最小素因子 ≥ k；k³ &gt; 2·10⁹ 保证最后的容斥分支里 k ≤ 1259</text>
</svg>
