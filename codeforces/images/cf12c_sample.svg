<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="97"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="360" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2 走查：先数清每种水果买几次</text>
  <path d="M 160 42 Q 380 47 600 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="380" y="60" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">价格 3 5 1 6 8 1；清单 peach / grapefruit / banana / orange / orange</text>

  <!-- 左侧：计数柱 -->
  <text x="46" y="92" font-size="11.5" fill="#777" filter="url(#rough2)">清单里各水果的出现次数</text>
  <text x="60" y="126" font-size="11" fill="#2b2b2b" filter="url(#rough2)">orange</text>
  <rect x="130" y="114" width="120" height="16" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="258" y="127" font-size="11" fill="#2f4a66" filter="url(#rough2)">2</text>
  <text x="60" y="154" font-size="11" fill="#2b2b2b" filter="url(#rough2)">peach</text>
  <rect x="130" y="142" width="60" height="16" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="198" y="155" font-size="11" fill="#2f5223" filter="url(#rough2)">1</text>
  <text x="60" y="182" font-size="11" fill="#2b2b2b" filter="url(#rough2)">grapefruit</text>
  <rect x="130" y="170" width="60" height="16" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="198" y="183" font-size="11" fill="#2f5223" filter="url(#rough2)">1</text>
  <text x="60" y="210" font-size="11" fill="#2b2b2b" filter="url(#rough2)">banana</text>
  <rect x="130" y="198" width="60" height="16" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="198" y="211" font-size="11" fill="#2f5223" filter="url(#rough2)">1</text>
  <text x="60" y="240" font-size="10.5" fill="#8a6015" filter="url(#rough2)">→ 次数降序 2, 1, 1, 1</text>

  <!-- 右侧：价格带 -->
  <text x="400" y="92" font-size="11.5" fill="#777" filter="url(#rough2)">6 个价签升序排列（前 4 个给最小，后 4 个给最大）</text>
  <rect x="396" y="102" width="44" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="446" y="102" width="44" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="496" y="102" width="44" height="40" rx="5" fill="#fff3cd" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="546" y="102" width="44" height="40" rx="5" fill="#fff3cd" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="596" y="102" width="44" height="40" rx="5" fill="#fdeceb" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="646" y="102" width="44" height="40" rx="5" fill="#fdeceb" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="418" y="129" text-anchor="middle" font-size="15" fill="#2f5223" filter="url(#rough2)">1</text>
  <text x="468" y="129" text-anchor="middle" font-size="15" fill="#2f5223" filter="url(#rough2)">1</text>
  <text x="518" y="129" text-anchor="middle" font-size="15" fill="#8a6015" filter="url(#rough2)">3</text>
  <text x="568" y="129" text-anchor="middle" font-size="15" fill="#8a6015" filter="url(#rough2)">5</text>
  <text x="618" y="129" text-anchor="middle" font-size="15" fill="#8c3a36" filter="url(#rough2)">6</text>
  <text x="668" y="129" text-anchor="middle" font-size="15" fill="#8c3a36" filter="url(#rough2)">8</text>

  <line x1="380" y1="86" x2="380" y2="300" stroke="#ddd" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <rect x="46" y="262" width="320" height="76" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="58" y="286" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">最小总价</text>
  <text x="58" y="310" font-size="12" fill="#3c5e2e" filter="url(#rough2)">2×1 + 1×1 + 1×3 + 1×5 = 11</text>

  <rect x="396" y="262" width="318" height="76" rx="10" fill="#fdeceb" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="408" y="286" font-size="12" font-weight="bold" fill="#8c3a36" filter="url(#rough2)">最大总价</text>
  <text x="408" y="310" font-size="12" fill="#8c3a36" filter="url(#rough2)">2×8 + 1×6 + 1×5 + 1×3 = 30</text>

  <text x="380" y="352" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">没被买的水果照样要分到价签，只是它们不影响总价</text>
</svg>
