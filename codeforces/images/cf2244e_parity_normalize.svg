<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="660" height="330" fill="#fafafa"/>

  <text x="330" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">
    奇偶归一化 y_i = s_i ⊕ (i mod 2)：答案只与 y 的两类 run 有关
  </text>

  <!-- 列号 -->
  <text x="132" y="74" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">1</text>
  <text x="180" y="74" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">2</text>
  <text x="228" y="74" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">3</text>
  <text x="276" y="74" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">4</text>
  <text x="324" y="74" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">5</text>

  <!-- 行标签 -->
  <text x="100" y="106" text-anchor="end" font-size="14" fill="#b85450" filter="url(#rough2)">s</text>
  <text x="100" y="154" text-anchor="end" font-size="13" fill="#888" filter="url(#rough2)">i mod 2</text>
  <text x="100" y="202" text-anchor="end" font-size="14" fill="#446688" filter="url(#rough2)">y</text>

  <!-- s 行：0 0 1 1 0 -->
  <rect x="110" y="84" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="132" y="107" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">0</text>
  <rect x="158" y="84" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="107" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">0</text>
  <rect x="206" y="84" width="44" height="34" rx="4" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="228" y="107" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">1</text>
  <rect x="254" y="84" width="44" height="34" rx="4" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="276" y="107" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">1</text>
  <rect x="302" y="84" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="324" y="107" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">0</text>

  <!-- 奇偶行 -->
  <rect x="110" y="132" width="44" height="34" rx="4" fill="#ffffff" stroke="#888"
        stroke-width="1.2" filter="url(#rough2)"/>
  <text x="132" y="155" text-anchor="middle" font-size="15" fill="#666" filter="url(#rough2)">1</text>
  <rect x="158" y="132" width="44" height="34" rx="4" fill="#ffffff" stroke="#888"
        stroke-width="1.2" filter="url(#rough2)"/>
  <text x="180" y="155" text-anchor="middle" font-size="15" fill="#666" filter="url(#rough2)">0</text>
  <rect x="206" y="132" width="44" height="34" rx="4" fill="#ffffff" stroke="#888"
        stroke-width="1.2" filter="url(#rough2)"/>
  <text x="228" y="155" text-anchor="middle" font-size="15" fill="#666" filter="url(#rough2)">1</text>
  <rect x="254" y="132" width="44" height="34" rx="4" fill="#ffffff" stroke="#888"
        stroke-width="1.2" filter="url(#rough2)"/>
  <text x="276" y="155" text-anchor="middle" font-size="15" fill="#666" filter="url(#rough2)">0</text>
  <rect x="302" y="132" width="44" height="34" rx="4" fill="#ffffff" stroke="#888"
        stroke-width="1.2" filter="url(#rough2)"/>
  <text x="324" y="155" text-anchor="middle" font-size="15" fill="#666" filter="url(#rough2)">1</text>

  <!-- y 行：1 0 0 1 1 -->
  <rect x="110" y="180" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688"
        stroke-width="2" filter="url(#rough2)"/>
  <text x="132" y="203" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">1</text>
  <rect x="158" y="180" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040"
        stroke-width="2" filter="url(#rough2)"/>
  <text x="180" y="203" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">0</text>
  <rect x="206" y="180" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040"
        stroke-width="2" filter="url(#rough2)"/>
  <text x="228" y="203" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">0</text>
  <rect x="254" y="180" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688"
        stroke-width="2" filter="url(#rough2)"/>
  <text x="276" y="203" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">1</text>
  <rect x="302" y="180" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688"
        stroke-width="2" filter="url(#rough2)"/>
  <text x="324" y="203" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">1</text>

  <!-- run 括号 -->
  <path d="M 112 236 L 112 226 L 152 226 L 152 236" fill="none" stroke="#446688"
        stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 160 236 L 160 226 L 248 226 L 248 236" fill="none" stroke="#d6a040"
        stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 256 236 L 256 226 L 344 226 L 344 236" fill="none" stroke="#446688"
        stroke-width="1.8" filter="url(#rough2)"/>
  <text x="132" y="254" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">1-run</text>
  <text x="204" y="254" text-anchor="middle" font-size="12" fill="#b8860b" filter="url(#rough2)">0-run</text>
  <text x="300" y="254" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">1-run</text>

  <!-- 右侧说明框 -->
  <rect x="366" y="62" width="272" height="172" rx="8" fill="#ffffff" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="382" y="86" font-size="13" fill="#b85450" filter="url(#rough2)">查询目标 A = 0101…（从 l 起）</text>
  <text x="382" y="112" font-size="12.5" fill="#333" filter="url(#rough2)">x_i = s_i ⊕ ((i−l) 的奇偶)</text>
  <text x="382" y="136" font-size="12.5" fill="#333" filter="url(#rough2)">　　 = y_i ⊕ (l 的奇偶)</text>
  <text x="382" y="162" font-size="12.5" fill="#333" filter="url(#rough2)">l 为奇数 ⇒ x 是 y 整体取反</text>
  <text x="382" y="186" font-size="12.5" fill="#333" filter="url(#rough2)">⇒ 0-run 与 1-run 数目互换</text>
  <text x="382" y="212" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">⇒ min(r0, r1) 与 l 无关！</text>

  <text x="330" y="286" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    本例 s = 00110：y = 10011，1-run 两个、0-run 一个
  </text>
  <text x="330" y="312" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">
    min(r0, r1) = 1 ⇒ 只需一次操作（翻转 y 的那条 0-run 对应的 s 区间）
  </text>
</svg>
