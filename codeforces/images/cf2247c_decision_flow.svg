<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#777"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>
  <text x="320" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">判定流程：答案只可能是 0 / 1 / 2 / −1</text>
  <text x="320" y="52" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">p = 差异集合 D 中「当前为 1」的位置个数（即 1→0 型差异的个数）</text>
  <rect x="96" y="64" width="292" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="242" y="92" text-anchor="middle" font-size="13" fill="#3a4a66" filter="url(#rough2)">① 统计 D = {i : a_i ≠ b_i} 与 p</text>
  <rect x="96" y="128" width="292" height="44" fill="#ffffff" stroke="#888" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="242" y="156" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">② D 为空？</text>
  <rect x="96" y="192" width="292" height="44" fill="#ffffff" stroke="#888" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="242" y="220" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">③ p 为奇数？</text>
  <rect x="96" y="256" width="292" height="44" fill="#ffffff" stroke="#888" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="242" y="284" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">④ p ≥ 2（此时 p 必为偶数）？</text>
  <rect x="96" y="320" width="292" height="64" fill="#ffffff" stroke="#888" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="242" y="346" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">⑤ 既存在「相等的 1」</text>
  <text x="242" y="366" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">又存在「相等的 0」？</text>
  <rect x="470" y="127" width="104" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="522" y="156" text-anchor="middle" font-size="17" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">0</text>
  <path d="M 390 150 L 460 150" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="424" y="143" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="470" y="191" width="104" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="522" y="220" text-anchor="middle" font-size="17" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">1</text>
  <path d="M 390 214 L 460 214" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="424" y="207" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="470" y="255" width="104" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="522" y="284" text-anchor="middle" font-size="17" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">2</text>
  <path d="M 390 278 L 460 278" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="424" y="271" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="470" y="329" width="104" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="522" y="358" text-anchor="middle" font-size="17" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">2</text>
  <path d="M 390 352 L 460 352" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="424" y="345" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 242 108 L 242 126" stroke="#999" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="253" y="121" font-size="10" fill="#999" filter="url(#rough2)">否</text>
  <path d="M 242 172 L 242 190" stroke="#999" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="253" y="185" font-size="10" fill="#999" filter="url(#rough2)">否</text>
  <path d="M 242 236 L 242 254" stroke="#999" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="253" y="249" font-size="10" fill="#999" filter="url(#rough2)">否</text>
  <path d="M 242 300 L 242 318" stroke="#999" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="253" y="313" font-size="10" fill="#999" filter="url(#rough2)">否</text>
  <path d="M 242 384 L 242 408" stroke="#999" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="253" y="400" font-size="10" fill="#999" filter="url(#rough2)">否</text>
  <rect x="150" y="410" width="184" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="242" y="433" text-anchor="middle" font-size="14" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">−1（无解）</text>
  <text x="470" y="452" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">p = 0 意味着差异全是 0→1 型</text>
</svg>
