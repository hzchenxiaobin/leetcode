<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="24" y="34" font-size="17" fill="#333" filter="url(#rough2)">一次询问到底告诉我们什么？</text>

  <!-- hidden tree -->
  <g filter="url(#rough2)">
    <line x1="90" y1="120" x2="140" y2="165" stroke="#8899aa" stroke-width="2"/>
    <line x1="140" y1="165" x2="150" y2="225" stroke="#8899aa" stroke-width="2"/>
    <line x1="140" y1="165" x2="200" y2="120" stroke="#8899aa" stroke-width="2"/>
    <line x1="150" y1="225" x2="95" y2="255" stroke="#8899aa" stroke-width="2"/>
    <circle cx="90" cy="120" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="140" cy="165" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <circle cx="200" cy="120" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="150" cy="225" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <circle cx="95" cy="255" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="90" y="126" font-size="14" text-anchor="middle" fill="#333">5</text>
    <text x="140" y="171" font-size="14" text-anchor="middle" fill="#333">3</text>
    <text x="200" y="126" font-size="14" text-anchor="middle" fill="#333">4</text>
    <text x="150" y="231" font-size="14" text-anchor="middle" fill="#333">2</text>
    <text x="95" y="261" font-size="14" text-anchor="middle" fill="#333">1</text>
  </g>
  <text x="86" y="292" font-size="12" fill="#666" filter="url(#rough2)">隐藏的树（边未知）</text>

  <!-- query sequence -->
  <g filter="url(#rough2)">
    <rect x="250" y="76" width="286" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="262" y="98" font-size="13" fill="#333">询问序列 a = 5 3 4 1 2（互不相同）</text>
    <text x="262" y="115" font-size="12" fill="#8a6d2f">交互库按顺序贪心建独立集 S</text>
  </g>

  <path d="M300,126 L300,150" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- greedy table -->
  <g filter="url(#rough2)">
    <rect x="250" y="156" width="286" height="86" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="264" y="178" font-size="13" fill="#333">5 → 加；3 与 5 相邻 → 弃；4 → 加；</text>
    <text x="264" y="199" font-size="13" fill="#333">1 → 加；2 与 1 相邻 → 弃</text>
    <text x="264" y="223" font-size="13" fill="#446688">返回位串 1 0 1 1 0  ⇒ S = {5,4,1}</text>
    <text x="264" y="238" font-size="12" fill="#666">未被选中的 C = {3,2} 全部与 S 相邻</text>
  </g>

  <!-- two punchlines -->
  <g filter="url(#rough2)">
    <rect x="24" y="300" width="248" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="34" y="319" font-size="12" fill="#2f5b23">全 1 ⟺ 所问集合是独立集</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="288" y="300" width="248" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="298" y="319" font-size="12" fill="#8c2f2b">A、B 独立时，每个 b 各得 1 比特</text>
  </g>
</svg>
