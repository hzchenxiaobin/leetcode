<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320" viewBox="0 0 700 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1317"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="700" height="320" fill="#fafafa"/>
  <text x="350.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">剥掉叶子，剩下的是环</text>
  <path d="M 112.0 42 Q 350.0 48 588.0 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="350.0" y="306" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">再多源 BFS 求到环距离</text>
  <line x1="200" y1="90" x2="320" y2="90" stroke="#5a7fb0" stroke-width="2" filter="url(#rough2)"/>
  <line x1="320" y1="90" x2="320" y2="210" stroke="#5a7fb0" stroke-width="2" filter="url(#rough2)"/>
  <line x1="320" y1="210" x2="200" y2="210" stroke="#5a7fb0" stroke-width="2" filter="url(#rough2)"/>
  <line x1="200" y1="210" x2="200" y2="90" stroke="#5a7fb0" stroke-width="2" filter="url(#rough2)"/>
  <line x1="320" y1="210" x2="450" y2="210" stroke="#5a7fb0" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="200" cy="90" r="22" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">1</text>
  <circle cx="320" cy="90" r="22" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">2</text>
  <circle cx="320" cy="210" r="22" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">3</text>
  <circle cx="450" cy="210" r="22" fill="#fbeeee" stroke="#a05a5a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="450" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#8c2f2c" filter="url(#rough2)">4</text>
  <circle cx="200" cy="210" r="22" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">5</text>
  <text x="350" y="275" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">环上（绿）距离 0；挂着的那格（红）距离 1</text>
  <text x="350" y="300" text-anchor="middle" font-size="11.5" fill="#335478" filter="url(#rough2)">反复剥度 1 的点，剩下的点集就是唯一的环</text>
</svg>
