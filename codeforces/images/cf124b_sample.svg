<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="139"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="300" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">样例 2：取 π = (1,0,2) 交换前两位</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">重排后仍是 k 位定长串：099 就是 99，不是 990</text>
  <g filter="url(#rough2)"><rect x="90" y="100" width="100" height="38" rx="4" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="140" y="125" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">010</text>
  <g filter="url(#rough2)"><line x1="196" y1="119" x2="250" y2="119" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)"/></g>
  <text x="223" y="110" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">π</text>
  <g filter="url(#rough2)"><rect x="254" y="100" width="110" height="38" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#b06a1e" stroke-width="1.4"/></g>
  <text x="309" y="125" text-anchor="middle" font-size="14" fill="#b06a1e" filter="url(#rough2)">100</text>
  <text x="384" y="125" text-anchor="middle" font-size="13" fill="#666666" filter="url(#rough2)">=</text>
  <g filter="url(#rough2)"><rect x="410" y="100" width="110" height="38" rx="4" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="465" y="125" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">100</text>
  <g filter="url(#rough2)"><rect x="90" y="156" width="100" height="38" rx="4" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="140" y="181" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">909</text>
  <g filter="url(#rough2)"><line x1="196" y1="175" x2="250" y2="175" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)"/></g>
  <text x="223" y="166" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">π</text>
  <g filter="url(#rough2)"><rect x="254" y="156" width="110" height="38" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#b06a1e" stroke-width="1.4"/></g>
  <text x="309" y="181" text-anchor="middle" font-size="14" fill="#b06a1e" filter="url(#rough2)">099</text>
  <text x="384" y="181" text-anchor="middle" font-size="13" fill="#666666" filter="url(#rough2)">=</text>
  <g filter="url(#rough2)"><rect x="410" y="156" width="110" height="38" rx="4" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="465" y="181" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">99</text>
  <g filter="url(#rough2)"><rect x="90" y="212" width="100" height="38" rx="4" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="140" y="237" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">012</text>
  <g filter="url(#rough2)"><line x1="196" y1="231" x2="250" y2="231" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)"/></g>
  <text x="223" y="222" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">π</text>
  <g filter="url(#rough2)"><rect x="254" y="212" width="110" height="38" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#b06a1e" stroke-width="1.4"/></g>
  <text x="309" y="237" text-anchor="middle" font-size="14" fill="#b06a1e" filter="url(#rough2)">102</text>
  <text x="384" y="237" text-anchor="middle" font-size="13" fill="#666666" filter="url(#rough2)">=</text>
  <g filter="url(#rough2)"><rect x="410" y="212" width="110" height="38" rx="4" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="465" y="237" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">102</text>
  <text x="620" y="124" text-anchor="start" font-size="12" fill="#8a2b28" filter="url(#rough2)">最大 102</text>
  <text x="620" y="180" text-anchor="start" font-size="12" fill="#446688" filter="url(#rough2)">最小 99</text>
  <text x="620" y="236" text-anchor="start" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">差 = 3</text>
  <text x="450" y="282" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">换用别的置换（如 (0,1,2)）会得到 909−10 = 899，更大</text>
</svg>
