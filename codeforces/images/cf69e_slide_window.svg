<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="91"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="880" height="430" fill="#fafafa"/>

  <text x="440" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">窗口右移一格：删掉左端、加入右端，计数增量更新</text>
  <text x="440" y="56" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">样例二的数组 3 3 3 4 4 2，k = 4</text>

  <!-- 上方窗口括号 -->
  <g filter="url(#rough2)">
    <path d="M 100 96 L 100 84 L 420 84 L 420 96" stroke="#446688" stroke-width="1.8" fill="none"/>
    <text x="260" y="76" text-anchor="middle" font-size="11.5" fill="#2f4a66">窗口 i：3 3 3 4</text>
  </g>

  <!-- 数组格子 -->
  <g filter="url(#rough2)">
    <rect x="100" y="120" width="80" height="50" fill="#f6d9d7" stroke="#b85450" stroke-width="2" stroke-dasharray="6 3"/>
    <rect x="180" y="120" width="80" height="50" fill="#ffffff" stroke="#888888" stroke-width="1.4"/>
    <rect x="260" y="120" width="80" height="50" fill="#ffffff" stroke="#888888" stroke-width="1.4"/>
    <rect x="340" y="120" width="80" height="50" fill="#ffffff" stroke="#888888" stroke-width="1.4"/>
    <rect x="420" y="120" width="80" height="50" fill="#d9ecd4" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="500" y="120" width="80" height="50" fill="#ffffff" stroke="#888888" stroke-width="1.4"/>

    <text x="140" y="153" text-anchor="middle" font-size="16" fill="#8a2b28">3</text>
    <text x="220" y="153" text-anchor="middle" font-size="16" fill="#444444">3</text>
    <text x="300" y="153" text-anchor="middle" font-size="16" fill="#444444">3</text>
    <text x="380" y="153" text-anchor="middle" font-size="16" fill="#444444">4</text>
    <text x="460" y="153" text-anchor="middle" font-size="16" fill="#2f5223">4</text>
    <text x="540" y="153" text-anchor="middle" font-size="16" fill="#444444">2</text>

    <text x="140" y="188" text-anchor="middle" font-size="10.5" fill="#888888">a₁</text>
    <text x="220" y="188" text-anchor="middle" font-size="10.5" fill="#888888">a₂</text>
    <text x="300" y="188" text-anchor="middle" font-size="10.5" fill="#888888">a₃</text>
    <text x="380" y="188" text-anchor="middle" font-size="10.5" fill="#888888">a₄</text>
    <text x="460" y="188" text-anchor="middle" font-size="10.5" fill="#888888">a₅</text>
    <text x="540" y="188" text-anchor="middle" font-size="10.5" fill="#888888">a₆</text>
  </g>

  <!-- 下方窗口括号 -->
  <g filter="url(#rough2)">
    <path d="M 180 226 L 180 214 L 500 214 L 500 226" stroke="#4a7a3a" stroke-width="1.8" fill="none"/>
    <text x="340" y="246" text-anchor="middle" font-size="11.5" fill="#2f5223">窗口 i+1：3 3 4 4</text>
  </g>

  <!-- 删/加标注 -->
  <g filter="url(#rough2)">
    <path d="M 140 200 L 140 212" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)"/>
    <text x="150" y="210" font-size="10" fill="#8a2b28">删除 3</text>
    <path d="M 460 200 L 460 212" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)"/>
    <text x="470" y="210" font-size="10" fill="#2f5223">加入 4</text>
  </g>

  <!-- 右侧统计 -->
  <g filter="url(#rough2)">
    <rect x="610" y="80" width="240" height="170" rx="12" fill="#eef2f6" stroke="#446688" stroke-width="1.4"/>
    <text x="626" y="106" font-size="12" font-weight="bold" fill="#2f4a66">窗口 i</text>
    <text x="626" y="128" font-size="11" fill="#444444">cnt：3×3，4×1</text>
    <text x="626" y="150" font-size="11" fill="#444444">once：{4}</text>
    <text x="626" y="172" font-size="11" fill="#2f4a66">答案：4</text>
    <line x1="626" y1="184" x2="834" y2="184" stroke="#cccccc" stroke-width="1"/>
    <text x="626" y="204" font-size="12" font-weight="bold" fill="#2f5223">窗口 i+1</text>
    <text x="626" y="226" font-size="11" fill="#444444">cnt：3×2，4×2</text>
    <text x="626" y="242" font-size="11" fill="#444444">once：∅ → Nothing</text>
  </g>

  <text x="440" y="296" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">删除 a₁ 使 3 的计数 3→2（仍在 once 外），加入 a₅ 使 4 的计数 1→2（离开 once），once 变空。</text>
</svg>
