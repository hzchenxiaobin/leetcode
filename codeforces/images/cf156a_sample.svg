<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="535"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="210" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">两个样例的走法</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">aaaaa→aaa 取 "aaa" 直接相等；abcdef→klmnopq 全改 7 次</text>
  <text x="450" y="104" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">样例 1：t = aaa ⇒ 0 次操作</text>
  <text x="450" y="136" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">样例 2：t = bca，改 1 个字母 ⇒ 1</text>
  <text x="450" y="176" text-anchor="middle" font-size="12" fill="#8a2b28" filter="url(#rough2)">样例 3：任意等长段都要改 7 个 ⇒ 7</text>
</svg>
