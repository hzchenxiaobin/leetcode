     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="103"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/></marker>
  </defs>
  <rect width="884" height="412" fill="#fafafa"/>
  <text x="442" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">圆形弹槽：只看向下/向上取整的“间距”</text>
  <text x="442" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">Sasha 在偏移 0,2,4,… 开枪 → 首个子弹在偶数偏移时他输</text>
  <g filter="url(#rough2)"><circle cx="440.0" cy="90.0" r="16" fill="#f6d9d7" fill-opacity="0.85" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="440.0" y="95.0" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">X</text>
  <g filter="url(#rough2)"><circle cx="517.1345131623847" cy="118.07466682572264" r="16" fill="#ffffff" fill-opacity="0.85" stroke="#999999" stroke-width="1.5"/></g>
  <text x="517.1345131623847" y="123.07466682572264" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">.</text>
  <g filter="url(#rough2)"><circle cx="558.176930361465" cy="189.16221867996836" r="16" fill="#ffffff" fill-opacity="0.85" stroke="#999999" stroke-width="1.5"/></g>
  <text x="558.176930361465" y="194.16221867996836" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">.</text>
  <g filter="url(#rough2)"><circle cx="543.9230484541326" cy="270.0" r="16" fill="#f6d9d7" fill-opacity="0.85" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="543.9230484541326" y="275.0" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">X</text>
  <g filter="url(#rough2)"><circle cx="481.04241719908026" cy="322.763114494309" r="16" fill="#f6d9d7" fill-opacity="0.85" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="481.04241719908026" y="327.763114494309" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">X</text>
  <g filter="url(#rough2)"><circle cx="398.95758280091974" cy="322.763114494309" r="16" fill="#ffffff" fill-opacity="0.85" stroke="#999999" stroke-width="1.5"/></g>
  <text x="398.95758280091974" y="327.763114494309" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">.</text>
  <g filter="url(#rough2)"><circle cx="336.07695154586736" cy="270.00000000000006" r="16" fill="#ffffff" fill-opacity="0.85" stroke="#999999" stroke-width="1.5"/></g>
  <text x="336.07695154586736" y="275.00000000000006" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">.</text>
  <g filter="url(#rough2)"><circle cx="321.823069638535" cy="189.1622186799684" r="16" fill="#f6d9d7" fill-opacity="0.85" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="321.823069638535" y="194.1622186799684" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">X</text>
  <g filter="url(#rough2)"><circle cx="362.86548683761526" cy="118.07466682572266" r="16" fill="#ffffff" fill-opacity="0.85" stroke="#999999" stroke-width="1.5"/></g>
  <text x="362.86548683761526" y="123.07466682572266" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">.</text>
  <text x="440" y="352" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">间距 g = 两个子弹之间的空槽数；起点落在间距里时，距离 d = 1..g</text>
  <text x="440" y="380" text-anchor="middle" font-size="12.5" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">Sasha 输的起点数 = k（起点就是子弹） + Σ ⌊g_i / 2⌋</text>
  <text x="440" y="404" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">所以要最大化“奇数间距”的个数 R = #odd(g)，且 R ≤ min(k, n−k)、R ≡ n−k (mod 2)</text>
</svg>
