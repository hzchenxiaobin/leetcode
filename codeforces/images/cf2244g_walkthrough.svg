<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 372"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="372" fill="#fafafa" filter="url(#rough2)"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    官方样例 1 的走查：a = 3 1 1 1 3
  </text>

  <!-- 表头 -->
  <rect x="70" y="48" width="420" height="36" rx="6" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.6" filter="url(#rough2)"/>
  <g font-size="12" fill="#446688">
    <text x="105" y="71" text-anchor="middle" filter="url(#rough2)">i</text>
    <text x="175" y="71" text-anchor="middle" filter="url(#rough2)">a_i</text>
    <text x="245" y="71" text-anchor="middle" filter="url(#rough2)">新激活</text>
    <text x="315" y="71" text-anchor="middle" filter="url(#rough2)">lim</text>
    <text x="385" y="71" text-anchor="middle" filter="url(#rough2)">best</text>
    <text x="455" y="71" text-anchor="middle" filter="url(#rough2)">dp</text>
  </g>

  <!-- 第 1 行 -->
  <rect x="70" y="84" width="420" height="38" rx="6" fill="#ffffff" stroke="#ccc"
        stroke-width="1.2" filter="url(#rough2)"/>
  <g font-size="12" fill="#333">
    <text x="105" y="108" text-anchor="middle" filter="url(#rough2)">1</text>
    <text x="175" y="108" text-anchor="middle" filter="url(#rough2)">3</text>
    <text x="245" y="108" text-anchor="middle" fill="#999" filter="url(#rough2)">-</text>
    <text x="315" y="108" text-anchor="middle" filter="url(#rough2)">-3</text>
    <text x="385" y="108" text-anchor="middle" filter="url(#rough2)">0</text>
    <text x="455" y="108" text-anchor="middle" filter="url(#rough2)">3</text>
  </g>

  <!-- 第 2 行 -->
  <rect x="70" y="122" width="420" height="38" rx="6" fill="#ffffff" stroke="#ccc"
        stroke-width="1.2" filter="url(#rough2)"/>
  <g font-size="12" fill="#333">
    <text x="105" y="146" text-anchor="middle" filter="url(#rough2)">2</text>
    <text x="175" y="146" text-anchor="middle" filter="url(#rough2)">1</text>
    <text x="245" y="146" text-anchor="middle" fill="#999" filter="url(#rough2)">-</text>
    <text x="315" y="146" text-anchor="middle" filter="url(#rough2)">0</text>
    <text x="385" y="146" text-anchor="middle" filter="url(#rough2)">0</text>
    <text x="455" y="146" text-anchor="middle" filter="url(#rough2)">1</text>
  </g>

  <!-- 第 3 行 -->
  <rect x="70" y="160" width="420" height="38" rx="6" fill="#ffffff" stroke="#ccc"
        stroke-width="1.2" filter="url(#rough2)"/>
  <g font-size="12" fill="#333">
    <text x="105" y="184" text-anchor="middle" filter="url(#rough2)">3</text>
    <text x="175" y="184" text-anchor="middle" filter="url(#rough2)">1</text>
    <text x="245" y="184" text-anchor="middle" fill="#999" filter="url(#rough2)">-</text>
    <text x="315" y="184" text-anchor="middle" filter="url(#rough2)">1</text>
    <text x="385" y="184" text-anchor="middle" filter="url(#rough2)">0</text>
    <text x="455" y="184" text-anchor="middle" filter="url(#rough2)">1</text>
  </g>

  <!-- 第 4 行 -->
  <rect x="70" y="198" width="420" height="38" rx="6" fill="#ffffff" stroke="#ccc"
        stroke-width="1.2" filter="url(#rough2)"/>
  <g font-size="12" fill="#333">
    <text x="105" y="222" text-anchor="middle" filter="url(#rough2)">4</text>
    <text x="175" y="222" text-anchor="middle" filter="url(#rough2)">1</text>
    <text x="245" y="222" text-anchor="middle" fill="#d6a040" filter="url(#rough2)">j=2</text>
    <text x="315" y="222" text-anchor="middle" filter="url(#rough2)">2</text>
    <text x="385" y="222" text-anchor="middle" filter="url(#rough2)">1</text>
    <text x="455" y="222" text-anchor="middle" filter="url(#rough2)">2</text>
  </g>

  <!-- 第 5 行（答案所在行） -->
  <rect x="70" y="236" width="420" height="40" rx="6" fill="#fff8e1" stroke="#d6a040"
        stroke-width="2" filter="url(#rough2)"/>
  <g font-size="12" fill="#333">
    <text x="105" y="261" text-anchor="middle" filter="url(#rough2)">5</text>
    <text x="175" y="261" text-anchor="middle" filter="url(#rough2)">3</text>
    <text x="245" y="261" text-anchor="middle" fill="#4a7a3a" filter="url(#rough2)">j=1, 3</text>
    <text x="315" y="261" text-anchor="middle" filter="url(#rough2)">1</text>
    <text x="385" y="261" text-anchor="middle" filter="url(#rough2)">3</text>
    <text x="455" y="261" text-anchor="middle" font-size="14" fill="#b85450"
          filter="url(#rough2)">6</text>
  </g>

  <rect x="60" y="292" width="440" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="311" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    答案 = max dp = 6：选下标 1 与 5，距离 4 &gt; max(3, 3) = 3，合法
  </text>
  <text x="280" y="327" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">
    dp[5] = a_5 + dp[1] = 3 + 3，且 dp[1] 恰好在 i=5 才被激活
  </text>

  <text x="280" y="358" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">
    注意 i=3 与 i=4 时查不到下标 1（t = 1+3+1 = 5），这正是「距离必须严格大于 a_i」
  </text>
</svg>
