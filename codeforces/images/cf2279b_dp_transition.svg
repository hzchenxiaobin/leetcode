<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 452" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="700" height="452" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">DP 状态与转移：窗口右移 + 结算最老的一位</text>
  <text x="350" y="52" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">状态 = (mask, k)，mask 是最近三个值的成员位，k 是已确定的不稳定元素个数</text>
  <rect x="60" y="82" width="64" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="92" y="108" text-anchor="middle" font-size="12" fill="#2c3e50" filter="url(#rough2)">v−3</text>
  <text x="92" y="78" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">b0</text>
  <rect x="140" y="82" width="64" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="172" y="108" text-anchor="middle" font-size="12" fill="#2c3e50" filter="url(#rough2)">v−2</text>
  <text x="172" y="78" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">b1</text>
  <rect x="220" y="82" width="64" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="252" y="108" text-anchor="middle" font-size="12" fill="#2c3e50" filter="url(#rough2)">v−1</text>
  <text x="252" y="78" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">b2</text>
  <path d="M 152 128 L 152 158" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="146" text-anchor="start" font-size="10" fill="#666" filter="url(#rough2)">放入 v：m = 0，或 v∈A 时 m = 1</text>
  <rect x="60" y="162" width="64" height="42" fill="#ffffff" stroke="#888" stroke-width="1.4" rx="6" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <text x="92" y="188" text-anchor="middle" font-size="12" fill="#b0b0b0" filter="url(#rough2)">v−2</text>
  <text x="92" y="212" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">b1</text>
  <rect x="140" y="162" width="64" height="42" fill="#ffffff" stroke="#888" stroke-width="1.4" rx="6" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <text x="172" y="188" text-anchor="middle" font-size="12" fill="#b0b0b0" filter="url(#rough2)">v−1</text>
  <text x="172" y="212" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">b2</text>
  <rect x="220" y="162" width="64" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="252" y="188" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">v</text>
  <text x="252" y="212" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">m</text>
  <text x="60" y="232" text-anchor="start" font-size="10" fill="#777" filter="url(#rough2)">新 mask = (mask &gt;&gt; 1) | (m &lt;&lt; 2)：最老的 b0 被挤出窗口</text>
  <rect x="40" y="246" width="366" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="56" y="270" text-anchor="start" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">结算 x = v−3（就是被挤出的 b0）：</text>
  <text x="56" y="292" text-anchor="start" font-size="10" fill="#8a3a36" filter="url(#rough2)">b0 = 1 时 bad = [ popcount(新 mask) ≠ 2 ]，k ← k + bad</text>
  <text x="56" y="312" text-anchor="start" font-size="10" fill="#a06a66" filter="url(#rough2)">b0 = 0 时 x∉S，什么也不结算</text>
  <rect x="430" y="80" width="250" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="555" y="109" text-anchor="middle" font-size="9.8" fill="#3a3a3a" filter="url(#rough2)">枚举 m：v∉S 只能 0；v∈A 还可 1</text>
  <rect x="430" y="150" width="250" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="555" y="179" text-anchor="middle" font-size="9.8" fill="#3a3a3a" filter="url(#rough2)">结算 x=v−3：只看新 mask 的 popcount</text>
  <rect x="430" y="220" width="250" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="555" y="249" text-anchor="middle" font-size="9.8" fill="#3a3a3a" filter="url(#rough2)">k ← k + bad，若 k ≥ 3 立即丢弃</text>
  <rect x="430" y="292" width="250" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="555" y="321" text-anchor="middle" font-size="9.8" fill="#3a3a3a" filter="url(#rough2)">dp[新 mask][k] += dp[mask][k]</text>
  <path d="M 555 128 L 555 146" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 555 198 L 555 216" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 555 268 L 555 286" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="40" y="348" width="640" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="350" y="372" text-anchor="middle" font-size="11.5" fill="#2f4f28" font-weight="bold" filter="url(#rough2)">初值 dp[000][0] = 1（空窗口、0 个不稳定）；状态数 8 × 3 = 24</text>
  <text x="350" y="394" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">答案 = Σ_{mask} Σ_{k≤2} dp[mask][k] − 1，减掉的是空子集</text>
  <text x="350" y="432" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">因为 v 只会从 (v−3, v−2, v−1) 的窗口里滑出去，所以一次扫描就能把每个元素判完</text>
</svg>
