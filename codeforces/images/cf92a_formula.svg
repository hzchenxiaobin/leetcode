<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="720" height="360" fill="#fafafa"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">把一轮看成总和 S = n(n+1)/2</text>
  <path d="M 200 43 Q 360 49 520 43" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <rect x="60" y="76" width="600" height="60" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="76" y="102" text-anchor="start" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">整轮数 k = m // S，剩余 r = m % S</text>
  <text x="76" y="124" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">再在余数 r 里找最大的 i 使 1+2+…+i ≤ r，答案就是 r − i(i+1)/2</text>
  <rect x="60" y="160" width="600" height="70" rx="7" fill="#e9f4e2" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="76" y="186" text-anchor="start" font-size="11.5" fill="#2f5223" filter="url(#rough2)">但 n ≤ 50、m ≤ 10^4 时直接模拟更简单，不易写错；</text>
  <text x="76" y="210" text-anchor="start" font-size="11.5" fill="#2f5223" filter="url(#rough2)">上面的公式可用于 m 很大（如 10^18）的加强版。</text>
  <text x="60" y="262" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">两种写法都要注意：当前筹码不足以发 i 个时，输出的是剩余筹码数，</text>
  <text x="60" y="286" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">而不是跳过这个人继续试下一个。</text>
  <text x="60" y="322" text-anchor="start" font-size="11" fill="#777777" filter="url(#rough2)">复杂度：模拟 O(总发放人数) ≤ O(m)，公式 O(sqrt(m))。</text>
</svg>
