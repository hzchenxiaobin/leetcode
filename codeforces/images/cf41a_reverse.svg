<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="401"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="290" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">把 s 反转，再逐位与 t 比较</text>
  <g font-family="monospace" font-size="26" filter="url(#rough2)">
    <text x="110" y="100" fill="#2f4a66">c</text><text x="150" y="100" fill="#2f4a66">o</text><text x="190" y="100" fill="#2f4a66">d</text><text x="230" y="100" fill="#2f4a66">e</text>
  </g>
  <text x="300" y="100" font-size="13" fill="#666" filter="url(#rough2)">s</text>
  <path d="M140,120 L300,120" stroke="#8a6015" stroke-width="1.8" marker-end="url(#ar)" filter="url(#rough2)"/>
  <text x="220" y="146" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">reverse</text>
  <g font-family="monospace" font-size="26" filter="url(#rough2)">
    <text x="140" y="200" fill="#2f5223">e</text><text x="180" y="200" fill="#2f5223">d</text><text x="220" y="200" fill="#2f5223">o</text><text x="260" y="200" fill="#2f5223">c</text>
  </g>
  <text x="330" y="200" font-size="13" fill="#666" filter="url(#rough2)">reverse(s)</text>
  <g font-family="monospace" font-size="26" filter="url(#rough2)">
    <text x="450" y="200" fill="#2f4a66">e</text><text x="490" y="200" fill="#2f4a66">d</text><text x="530" y="200" fill="#2f4a66">o</text><text x="570" y="200" fill="#2f4a66">c</text>
  </g>
  <text x="640" y="200" font-size="13" fill="#666" filter="url(#rough2)">t</text>
  <text x="500" y="160" text-anchor="middle" font-size="14" fill="#2f5223" filter="url(#rough2)">相等 ⇒ YES</text>
  <rect x="90" y="230" width="540" height="44" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="106" y="257" font-size="12.5" fill="#8a6015" filter="url(#rough2)">长度不同必然 NO；回文串则要求 t 与 s 完全相同。</text>
</svg>
