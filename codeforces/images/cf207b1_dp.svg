<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="350" fill="#fafafa"/>
  <text x="360.0" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">207B1：单条消息的 O(n) DP</text>
  <path d="M 144.00 46 Q 360.0 52 576.00 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="72" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">第 m 条消息：队首是坦克 x，队列按 x, x+1, …, n, 1, …, x−1 排列（循环移位）。</text>
  <text x="60" y="92" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">从位置 1 传到位置 n，位置 p 上的坦克编号为 t(p) = ((x+p−2) mod n)+1。</text>
  <rect x="60" y="116" width="300" height="96" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="134" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">位置 p 能收到位置 i 的消息 ⟺</text>
  <text x="74" y="156" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">i ≥ p − a_{t(p)}。</text>
  <text x="74" y="178" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">令 dp[p] = 从位置 1 到 p 的最少跳数：</text>
  <text x="74" y="200" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">dp[p] = 1 + dp[max(1, p − a_{t(p)})]</text>
  <rect x="380" y="116" width="290" height="96" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="394" y="134" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">dp 单调不减：i 越小能到的位置越多，</text>
  <text x="394" y="156" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">所以区间 [L, p−1] 里取最左的 L 即可。</text>
  <text x="394" y="178" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">单条消息 O(n)，n 条消息 O(n²)。</text>
  <text x="60" y="240" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">pd 的转移只依赖更小的位置 ⇒ 一次线性扫描即可算出 dp[n]。</text>
  <rect x="60" y="262" width="620" height="62" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="279" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">本</text>
  <text x="74" y="300" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">版</text>
  <text x="74" y="321" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">：</text>
  <text x="74" y="342" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">2</text>
  <text x="74" y="363" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)"> </text>
  <text x="74" y="384" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">≤</text>
  <text x="74" y="405" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)"> </text>
  <text x="74" y="426" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">n</text>
  <text x="74" y="447" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)"> </text>
  <text x="74" y="468" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">≤</text>
  <text x="74" y="489" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)"> </text>
  <text x="74" y="510" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">3</text>
  <text x="74" y="531" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">0</text>
  <text x="74" y="552" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">0</text>
  <text x="74" y="573" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">，</text>
  <text x="74" y="594" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">O</text>
  <text x="74" y="615" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">(</text>
  <text x="74" y="636" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">n</text>
  <text x="74" y="657" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">²</text>
  <text x="74" y="678" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">)</text>
  <text x="74" y="699" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)"> </text>
  <text x="74" y="720" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">=</text>
  <text x="74" y="741" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)"> </text>
  <text x="74" y="762" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">9</text>
  <text x="74" y="783" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">×</text>
  <text x="74" y="804" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">1</text>
  <text x="74" y="825" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">0</text>
  <text x="74" y="846" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">⁴</text>
  <text x="74" y="867" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">，</text>
  <text x="74" y="888" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">逐</text>
  <text x="74" y="909" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">条</text>
  <text x="74" y="930" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">模</text>
  <text x="74" y="951" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">拟</text>
  <text x="74" y="972" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">即</text>
  <text x="74" y="993" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">可</text>
  <text x="74" y="1014" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">。</text>
</svg>
