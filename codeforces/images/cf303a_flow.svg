<svg xmlns="http://www.w3.org/2000/svg" width="700" height="230" viewBox="0 0 700 230"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="803"/>
    <feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></defs>
  <rect width="700" height="230" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法：一行判定 + 三行输出</text>
  <path d="M 200 40 Q 350 46 500 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="48" rx="8" fill="#fbeeee" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="76" y="88" font-size="13" fill="#8a3a36" filter="url(#rough2)">若 n 为偶数 ⇒ 输出 −1</text>
  <g filter="url(#rough2)"><rect x="60" y="116" width="580" height="48" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="146" font-size="13" fill="#2f5223" filter="url(#rough2)">否则输出 i、i、(2i mod n) 三行，各 n 个整数</text>
  <g filter="url(#rough2)"><rect x="60" y="174" width="580" height="36" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="76" y="197" font-size="12.5" fill="#8a6015" filter="url(#rough2)">O(n) 输出；n ≤ 10⁵。</text>
</svg>
