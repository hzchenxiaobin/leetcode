<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="241" />
      <feDisplacementMap in="SourceGraphic" scale="1.5" />
    </filter>
  </defs>

  <rect width="760" height="440" fill="#fafafa" />

  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">构造：K_{n-2} 加两个“全连接”的人</text>
  <path d="M 150 44 Q 380 50 610 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)" />

  
  <line x1="380" y1="140" x2="290" y2="290" stroke="#446688" stroke-width="2.2" filter="url(#rough2)" />
  <line x1="290" y1="290" x2="470" y2="290" stroke="#446688" stroke-width="2.2" filter="url(#rough2)" />
  <line x1="470" y1="290" x2="380" y2="140" stroke="#446688" stroke-width="2.2" filter="url(#rough2)" />

  
  <line x1="170" y1="130" x2="380" y2="140" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)" />
  <line x1="170" y1="130" x2="290" y2="290" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)" />
  <line x1="170" y1="130" x2="470" y2="290" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)" />
  <line x1="590" y1="130" x2="380" y2="140" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)" />
  <line x1="590" y1="130" x2="290" y2="290" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)" />
  <line x1="590" y1="130" x2="470" y2="290" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)" />

  
  <circle cx="380" cy="140" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)" />
  <circle cx="290" cy="290" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)" />
  <circle cx="470" cy="290" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)" />
  <circle cx="170" cy="130" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)" />
  <circle cx="590" cy="130" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)" />

  <text x="380" y="145" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">1</text>
  <text x="290" y="295" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">2</text>
  <text x="470" y="295" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">3</text>
  <text x="170" y="135" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">a</text>
  <text x="590" y="135" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">b</text>

  <text x="380" y="180" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">K_{n-2}：每人有 n-3 个团内朋友</text>

  
  <rect x="60" y="330" width="640" height="90" rx="10" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.5" filter="url(#rough2)" />
  <text x="80" y="356" font-size="12" fill="#2b2b2b" filter="url(#rough2)">团内顶点：团内 n-3 + a + b = n-1 个朋友；a、b：只连团内 n-2 人，彼此不相连，度数为 n-2。</text>
  <text x="80" y="380" font-size="12" fill="#2f5223" filter="url(#rough2)">前 n-3 个阶段：所有人的度数分别是 n-1 或 n-2，都大于当前阶段号，没人离开。</text>
  <text x="80" y="404" font-size="12" fill="#2f5223" filter="url(#rough2)">第 n-2 阶段：a、b 度数恰为 n-2，同时离开；团内顶点降为 n-3，之后不再离开。</text>

  <text x="380" y="315" text-anchor="middle" font-size="11.5" fill="#8a3b36" filter="url(#rough2)">a、b 不相连（否则它们度数为 n-1，不会在第 n-2 步离开）</text>
</svg>