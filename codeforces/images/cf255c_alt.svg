<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="340" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">几乎等差 = 两个值交替出现</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">a_1=p, a_i = a_{i-1} + (-1)^{i+1} q → p, p+q, p, p+q, …</text>
  <g filter="url(#rough2)"><rect x="140" y="110" width="96" height="48" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="188.0" y="139.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">p</text>
  <text x="188" y="180" text-anchor="middle" font-size="12" fill="#b05a5a" filter="url(#rough2)">+q</text>
  <g filter="url(#rough2)"><rect x="260" y="110" width="96" height="48" rx="4" fill="#cfe0f0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="308.0" y="139.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">p+q</text>
  <text x="308" y="180" text-anchor="middle" font-size="12" fill="#b05a5a" filter="url(#rough2)">-q</text>
  <g filter="url(#rough2)"><rect x="380" y="110" width="96" height="48" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="428.0" y="139.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">p</text>
  <text x="428" y="180" text-anchor="middle" font-size="12" fill="#b05a5a" filter="url(#rough2)">+q</text>
  <g filter="url(#rough2)"><rect x="500" y="110" width="96" height="48" rx="4" fill="#cfe0f0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="548.0" y="139.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">p+q</text>
  <text x="548" y="180" text-anchor="middle" font-size="12" fill="#b05a5a" filter="url(#rough2)">-q</text>
  <g filter="url(#rough2)"><rect x="620" y="110" width="96" height="48" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="668.0" y="139.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">p</text>
  <text x="668" y="180" text-anchor="middle" font-size="12" fill="#b05a5a" filter="url(#rough2)"></text>
  <text x="440" y="226" text-anchor="middle" font-size="13" fill="#3d6b2f" filter="url(#rough2)">所以答案 = 最长的"在两个值之间交替"的子序列</text>
  <text x="440" y="258" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">q=0 时退化成"同一个值重复出现"，也被覆盖</text>
  <text x="440" y="296" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">dp[i][j]：以 i、j 结尾（值 b[i]、b[j]）的最长交替子序列长度</text>
</svg>
