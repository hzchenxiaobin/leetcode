<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="462"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8a2b28"/>
    </marker>
  </defs>
  <rect width="760" height="340" fill="#fafafa"/>
  <text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">首字母相同的配对数上限 = 每个字母取 min(名字数, 附名数) 之和</text>
  <path d="M 60 38 Q 380 46 700 38" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <text x="60" y="70" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">名字</text>
  <g font-size="10.5">
    <rect x="60" y="80" width="66" height="66" rx="8" fill="#cfe0f5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="93" y="100" text-anchor="middle" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">A</text>
    <text x="93" y="118" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">2 个</text>
    <text x="93" y="134" text-anchor="middle" font-size="8.5" fill="#555555" filter="url(#rough2)">Ann Anna</text>
    <rect x="150" y="80" width="66" height="66" rx="8" fill="#e8e0f5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="183" y="100" text-anchor="middle" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">J</text>
    <text x="183" y="118" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">1 个</text>
    <text x="183" y="134" text-anchor="middle" font-size="8.5" fill="#555555" filter="url(#rough2)">John</text>
    <rect x="240" y="80" width="66" height="66" rx="8" fill="#fbe3c8" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="273" y="100" text-anchor="middle" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">S</text>
    <text x="273" y="118" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">1 个</text>
    <text x="273" y="134" text-anchor="middle" font-size="8.5" fill="#555555" filter="url(#rough2)">Sabrina</text>
  </g>

  <text x="60" y="188" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">附名</text>
  <g font-size="10.5">
    <rect x="60" y="198" width="66" height="66" rx="8" fill="#cfe0f5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="93" y="218" text-anchor="middle" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">A</text>
    <text x="93" y="236" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">1 个</text>
    <text x="93" y="252" text-anchor="middle" font-size="8.5" fill="#555555" filter="url(#rough2)">Abacaba</text>
    <rect x="150" y="198" width="66" height="66" rx="8" fill="#e8e0f5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="183" y="218" text-anchor="middle" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">I</text>
    <text x="183" y="236" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">1 个</text>
    <text x="183" y="252" text-anchor="middle" font-size="8.5" fill="#555555" filter="url(#rough2)">Ivanova</text>
    <rect x="240" y="198" width="66" height="66" rx="8" fill="#fbe3c8" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="273" y="218" text-anchor="middle" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">S</text>
    <text x="273" y="236" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">1 个</text>
    <text x="273" y="252" text-anchor="middle" font-size="8.5" fill="#555555" filter="url(#rough2)">Stoltz</text>
  </g>

  <path d="M 93 146 L 93 194" stroke="#446688" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 183 146 L 183 194" stroke="#446688" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 273 146 L 273 194" stroke="#446688" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <rect x="360" y="80" width="370" height="106" rx="10" fill="#d9ecd4" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="376" y="104" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">同首字母配对数</text>
  <text x="376" y="126" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">A：min(2, 1) = 1　　J：min(1, 0) = 0</text>
  <text x="376" y="146" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">S：min(1, 1) = 1　　I：min(0, 1) = 0</text>
  <text x="376" y="168" font-size="11" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">M = 1 + 0 + 1 + 0 = 2（最优）</text>

  <rect x="360" y="200" width="370" height="70" rx="10" fill="#fbe3c8" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="376" y="224" font-size="11" fill="#2b2b2b" filter="url(#rough2)">剩余字母的"名字 / 附名"只能跨字母配对，</text>
  <text x="376" y="244" font-size="11" fill="#2b2b2b" filter="url(#rough2)">跨字母配对不贡献同首字母数。</text>
  <text x="376" y="262" font-size="10" fill="#8a2b28" filter="url(#rough2)">所以 M 是上界，且按字母分别配对就能达到。</text>

  <text x="60" y="300" font-size="11" fill="#555555" filter="url(#rough2)">样例 1 的最优同首字母对是 2：Ann-Abacaba（A）与 Sabrina-Stoltz（S）。</text>
  <text x="60" y="320" font-size="11" fill="#555555" filter="url(#rough2)">John 与 Anna 只能跨字母配（John-Petrov、Anna-Ivanova），不影响 M。</text>
</svg>
