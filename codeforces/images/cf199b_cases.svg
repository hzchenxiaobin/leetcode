<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="519"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">199B：判定用「距离区间 vs 开区间」</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="60.0" y="96.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">圆心距 d，半径 rc 的圆上的点到另一圆心的距离 ∈ [|d−rc|, d+rc]</text>
  <text x="80.0" y="140.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">情况</text>
  <text x="260.0" y="140.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">区间关系</text>
  <text x="560.0" y="140.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">是否完整轮廓</text>
  <text x="80.0" y="190.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">完全在外</text>
  <text x="260.0" y="190.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">[p,q] ∩ (lo,hi) = ∅</text>
  <text x="560.0" y="190.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">是</text>
  <text x="80.0" y="240.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">穿过圆环</text>
  <text x="260.0" y="240.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">区间与 (lo,hi) 内部相交</text>
  <text x="560.0" y="240.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">否</text>
  <text x="80.0" y="290.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">相切</text>
  <text x="260.0" y="290.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">只碰到端点</text>
  <text x="560.0" y="290.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">是（样例 2）</text>
  <text x="80.0" y="340.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">完全在环内</text>
  <text x="260.0" y="340.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">区间 ⊂ (lo,hi)</text>
  <text x="560.0" y="340.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">否</text>
  <rect x="60.0" y="350.0" width="600.0" height="40.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="74.0" y="373.0" text-anchor="start" font-size="11" fill="#3f3420" filter="url(#rough2)">4 个圆分别判定，计数即答案</text>
</svg>
