<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="123"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>

  <rect width="720" height="380" fill="#fafafa"/>
  <text x="360.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">相邻词素之间放几个空格</text>
  <path d="M 115.2 42 Q 360.0 48 604.8 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="360.0" y="366" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">四条规则合成一条判定</text>
  <rect x="36" y="70" width="312" height="104" rx="10" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="192" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">① 逗号后面</text>
  <text x="192" y="120" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">必须恰好 1 个</text>
  <text x="192" y="150" text-anchor="middle" font-size="12.5" fill="#333333" filter="url(#rough2)">1,2  →  1, 2</text>
  <rect x="372" y="70" width="312" height="104" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="528" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">② 省略号前面</text>
  <text x="528" y="120" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">必须恰好 1 个</text>
  <text x="528" y="150" text-anchor="middle" font-size="12.5" fill="#333333" filter="url(#rough2)">4...5  →  4 ...5</text>
  <rect x="36" y="198" width="312" height="104" rx="10" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="192" y="224" text-anchor="middle" font-size="13" font-weight="bold" fill="#335478" filter="url(#rough2)">③ 两个数字之间</text>
  <text x="192" y="248" text-anchor="middle" font-size="12" fill="#335478" filter="url(#rough2)">恰好 1 个</text>
  <text x="192" y="278" text-anchor="middle" font-size="12.5" fill="#333333" filter="url(#rough2)">3  10  →  3 10</text>
  <rect x="372" y="198" width="312" height="104" rx="10" fill="#fbeeee" stroke="#a05a5a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="528" y="224" text-anchor="middle" font-size="13" font-weight="bold" fill="#6b3030" filter="url(#rough2)">④ 其他位置</text>
  <text x="528" y="248" text-anchor="middle" font-size="12" fill="#6b3030" filter="url(#rough2)">必须是 0 个</text>
  <text x="528" y="278" text-anchor="middle" font-size="12.5" fill="#333333" filter="url(#rough2)">...5  →  ...5</text>
  <rect x="36" y="336" width="648" height="34" rx="8" fill="#f4f4f0" stroke="#8a8a8a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="360" y="358" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">两条规则同时命中（逗号后面紧跟省略号）时，仍然只放 1 个空格</text>
</svg>
