<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="660" height="400" fill="#fafafa"/>

  <text x="330" y="32" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">状态压缩：局面只剩 (j, r) 两维</text>
  <text x="44" y="58" font-size="13" fill="#446688" filter="url(#rough2)">① 值轴（排序去重后的 v 与个数 c）</text>
  <text x="263" y="76" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">当前值 x = v3 = 3</text>

  <rect x="42" y="80" width="152" height="64" rx="8" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <rect x="234" y="80" width="186" height="64" rx="8" fill="none" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="6 4" filter="url(#rough2)"/>

  <rect x="56" y="88" width="54" height="44" rx="5" fill="#eeeeee" stroke="#999999" stroke-width="1.3" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="83" y="116" text-anchor="middle" font-size="17" fill="#777777" filter="url(#rough2)">1</text>
  <rect x="128" y="88" width="54" height="44" rx="5" fill="#eeeeee" stroke="#999999" stroke-width="1.3" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="155" y="116" text-anchor="middle" font-size="17" fill="#777777" filter="url(#rough2)">2</text>
  <rect x="248" y="88" width="54" height="44" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="275" y="116" text-anchor="middle" font-size="17" fill="#8a6420" filter="url(#rough2)">3</text>
  <rect x="352" y="88" width="54" height="44" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="379" y="116" text-anchor="middle" font-size="17" fill="#3c6130" filter="url(#rough2)">5</text>
  <rect x="452" y="88" width="54" height="44" rx="5" fill="#eeeeee" stroke="#999999" stroke-width="1.3" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="479" y="116" text-anchor="middle" font-size="17" fill="#777777" filter="url(#rough2)">7</text>

  <path d="M302,122 L348,122" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="325" y="109" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">跳</text>

  <text x="118" y="164" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">永久作废（都 &lt; x）</text>
  <text x="327" y="164" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">可跳窗口 x .. x + k（k = 2）</text>
  <text x="479" y="164" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">出界，跳不到</text>

  <rect x="44" y="184" width="572" height="58" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="208" font-size="13" fill="#33506b" filter="url(#rough2)">局面 = (j, r)：j 是当前值下标，r 是 v_j 的剩余个数</text>
  <text x="60" y="230" font-size="13" fill="#33506b" filter="url(#rough2)">l &gt; j 的值从未被取过，个数仍是 c_l；其余全部作废</text>

  <rect x="44" y="256" width="572" height="58" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="60" y="280" font-size="13" fill="#2f5228" filter="url(#rough2)">关键：每步 y ≥ x，当前值单调不减且增幅 ≤ k</text>
  <text x="60" y="302" font-size="13" fill="#2f5228" filter="url(#rough2)">⇒ 下标顺序无关，只看「当前值 + 本层剩余个数」</text>

  <rect x="44" y="332" width="572" height="44" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="359" text-anchor="middle" font-size="13" fill="#8a6420" filter="url(#rough2)">跳跃的代价：v_j 与 v_l 之间的值全部死亡，再也不会被取走</text>
</svg>
