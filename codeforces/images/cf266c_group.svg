<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="300" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">把问题化成"行/列分组 → 目标位置"</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">每组选一个够大的目标行，最后把置换写成交换序列</text>
  <g filter="url(#rough2)"><rect x="160" y="110" width="90" height="50" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="205.0" y="139.68" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">行分组</text>
  <g filter="url(#rough2)"><rect x="300" y="110" width="90" height="50" rx="4" fill="#cfe0f0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="345.0" y="139.68" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">列分组</text>
  <g filter="url(#rough2)"><rect x="440" y="110" width="110" height="50" rx="4" fill="#f6e3c4" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="495.0" y="139.68" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">目标行/列</text>
  <text x="440" y="200" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">同一行的 1 必须映射到同一目标行</text>
  <text x="440" y="238" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">同一列的 1 必须映射到同一目标列</text>
  <text x="440" y="276" text-anchor="middle" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">再要求 目标行 &gt; 目标列（行列式的贪心匹配）</text>
</svg>
