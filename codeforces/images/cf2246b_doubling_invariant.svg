<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>

  <text x="320" y="34" text-anchor="middle" font-size="18" fill="#333"
        filter="url(#rough2)">核心观察：新元素 = 当前总和 ⇒ 总和翻倍</text>
  <text x="320" y="58" text-anchor="middle" font-size="12.5" fill="#666"
        filter="url(#rough2)">若每个 a 都整除 S，追加一个新元素 a = S 后总和变成 2S，整除性原样保持</text>

  <!-- 行 A：n = 3 -->
  <text x="30" y="105" font-size="13" fill="#446688" filter="url(#rough2)">n = 3</text>
  <rect x="64" y="84" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="106" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="104" y="84" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="106" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="144" y="84" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="106" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="300" y="84" width="126" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="363" y="106" text-anchor="middle" font-size="12.5" fill="#33502a"
        filter="url(#rough2)">S = 1+2+3 = 6</text>
  <text x="443" y="105" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1, 2, 3 都整除 6</text>

  <!-- 箭头 A→B -->
  <path d="M 100 120 L 100 158" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="116" y="144" font-size="11.5" fill="#446688" filter="url(#rough2)">追加 a = S（新元素取当前总和）</text>

  <!-- 行 B：n = 4 -->
  <text x="30" y="185" font-size="13" fill="#446688" filter="url(#rough2)">n = 4</text>
  <rect x="64" y="164" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="186" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="104" y="164" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="186" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="144" y="164" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="186" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="184" y="164" width="32" height="32" rx="4" fill="#fff8e1" stroke="#d6a040"
        stroke-width="2.2" filter="url(#rough2)"/>
  <text x="200" y="186" text-anchor="middle" font-size="13" fill="#8a5a10" filter="url(#rough2)">6</text>
  <rect x="300" y="164" width="126" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="363" y="186" text-anchor="middle" font-size="12.5" fill="#33502a"
        filter="url(#rough2)">S = 2·6 = 12</text>
  <text x="443" y="185" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1, 2, 3, 6 都整除 12</text>

  <!-- 箭头 B→C -->
  <path d="M 100 200 L 100 238" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="116" y="224" font-size="11.5" fill="#446688" filter="url(#rough2)">新元素 = 12 = 旧总和，总和再翻倍</text>

  <!-- 行 C：n = 5 -->
  <text x="30" y="265" font-size="13" fill="#446688" filter="url(#rough2)">n = 5</text>
  <rect x="64" y="244" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="266" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="104" y="244" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="266" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="144" y="244" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="266" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="184" y="244" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="266" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <rect x="224" y="244" width="32" height="32" rx="4" fill="#fff8e1" stroke="#d6a040"
        stroke-width="2.2" filter="url(#rough2)"/>
  <text x="240" y="266" text-anchor="middle" font-size="13" fill="#8a5a10" filter="url(#rough2)">12</text>
  <rect x="300" y="244" width="126" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="363" y="266" text-anchor="middle" font-size="12.5" fill="#33502a"
        filter="url(#rough2)">S = 2·12 = 24</text>
  <text x="443" y="265" font-size="12" fill="#4a7a3a" filter="url(#rough2)">全部整除 24</text>

  <text x="64" y="300" font-size="12" fill="#666" filter="url(#rough2)">继续追加 24, 48, … 直到凑满 n 个数</text>

  <!-- 结论框 -->
  <rect x="46" y="316" width="548" height="88" rx="10" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.6" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="62" y="340" font-size="12.5" fill="#5a4208" filter="url(#rough2)">通项：1, 2, 3, 6, 12, …, 3·2^(n-3)，共 n 个且两两不同（每步新元素严格大于旧总和）</text>
  <text x="62" y="362" font-size="12.5" fill="#5a4208" filter="url(#rough2)">总和 S = 3·2^(n-2)；n = 50 时最大元素 3·2^47 ≈ 4.2·10^14，远小于 10^17</text>
  <text x="62" y="384" font-size="12.5" fill="#5a4208" filter="url(#rough2)">n = 1 取 [1]；n = 2 无解（互异性与 a | S 冲突）；n ≥ 3 一律可构造</text>
</svg>
