<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="584"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="320" fill="#fafafa"/>
  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法：从 2 开始试除，每除一次就输出一次当前商，最后补上 1</text>
  <path d="M 60 40 Q 380 48 700 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <rect x="36" y="62" width="300" height="150" rx="10" fill="#cfe0f5" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="52" y="86" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">流程</text>
  <text x="52" y="110" font-size="10.6" fill="#2b2b2b" filter="url(#rough2)">① ans = [n]，x = n，p = 2；</text>
  <text x="52" y="131" font-size="10.6" fill="#2b2b2b" filter="url(#rough2)">② while p·p ≤ x：</text>
  <text x="52" y="151" font-size="10.6" fill="#2b2b2b" filter="url(#rough2)">　　while x % p == 0：x /= p，ans 追加 x；</text>
  <text x="52" y="171" font-size="10.6" fill="#2b2b2b" filter="url(#rough2)">　　p += 1；</text>
  <text x="52" y="191" font-size="10.6" fill="#2b2b2b" filter="url(#rough2)">③ 若剩余 x &gt; 1，再追加 1；输出 ans。</text>
  <text x="52" y="206" font-size="9.5" fill="#555555" filter="url(#rough2)">（x 一直在缩小，循环次数是 O(√n)）</text>

  <text x="360" y="80" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">三个官方样例</text>
  <rect x="360" y="92" width="360" height="46" rx="8" fill="#d9ecd4" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="374" y="112" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">n = 10 = 2 × 5：10 → 5 → 1</text>
  <text x="374" y="130" font-size="10.5" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">输出 10 5 1</text>

  <rect x="360" y="146" width="360" height="46" rx="8" fill="#fbe3c8" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="374" y="166" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">n = 4 = 2 × 2：4 → 2 → 1</text>
  <text x="374" y="184" font-size="10.5" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">输出 4 2 1</text>

  <rect x="360" y="200" width="360" height="46" rx="8" fill="#e8e0f5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="374" y="220" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">n = 3（质数）：3 → 1</text>
  <text x="374" y="238" font-size="10.5" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">输出 3 1</text>

  <rect x="36" y="228" width="300" height="70" rx="9" fill="#f6d5d5" stroke="#8a2b28" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="52" y="250" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">边界：n = 1 时链只有 [1]（输出一行 "1"）；</text>
  <text x="52" y="270" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">n = 2^k 时商全是 2，链长 k + 1。</text>
  <text x="52" y="290" font-size="10.5" fill="#555555" filter="url(#rough2)">任何合法的最大链都可以，本题不要求唯一。</text>
</svg>
