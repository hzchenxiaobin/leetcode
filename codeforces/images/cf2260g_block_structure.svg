<svg xmlns="http://www.w3.org/2000/svg" width="660" height="416" viewBox="0 0 660 416" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
  </defs>
  <rect width="660" height="416" fill="#fafafa"/>

  <text x="330" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#r)">A_d 的块结构（d = 6, n = 9）：隔离点自由浮动，其余切成小块</text>
  <text x="330" y="50" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#r)">位置 i 与 j 无序关系 ⇔ d | i·j；只有相邻两条边可能「断」，每断一处只贡献 2 或 3 种局部顺序</text>

  <!-- position numbers -->
  <g font-size="11" fill="#777" text-anchor="middle">
    <text x="85" y="74" filter="url(#r)">1</text><text x="141" y="74" filter="url(#r)">2</text>
    <text x="197" y="74" filter="url(#r)">3</text><text x="253" y="74" filter="url(#r)">4</text>
    <text x="309" y="74" filter="url(#r)">5</text><text x="365" y="74" filter="url(#r)">6</text>
    <text x="421" y="74" filter="url(#r)">7</text><text x="477" y="74" filter="url(#r)">8</text>
    <text x="533" y="74" filter="url(#r)">9</text>
  </g>
  <!-- cells -->
  <g filter="url(#r)" stroke-width="1.6">
    <rect x="62" y="82" width="46" height="42" rx="5" fill="#e8f0fe" stroke="#446688"/>
    <rect x="118" y="82" width="46" height="42" rx="5" fill="#e6f4ea" stroke="#4a7a3a"/>
    <rect x="174" y="82" width="46" height="42" rx="5" fill="#e6f4ea" stroke="#4a7a3a"/>
    <rect x="230" y="82" width="46" height="42" rx="5" fill="#e6f4ea" stroke="#4a7a3a"/>
    <rect x="286" y="82" width="46" height="42" rx="5" fill="#e8f0fe" stroke="#446688"/>
    <rect x="342" y="82" width="46" height="42" rx="5" fill="#eeeeee" stroke="#888888" stroke-dasharray="4 3"/>
    <rect x="398" y="82" width="46" height="42" rx="5" fill="#e8f0fe" stroke="#446688"/>
    <rect x="454" y="82" width="46" height="42" rx="5" fill="#fff8e1" stroke="#d6a040"/>
    <rect x="510" y="82" width="46" height="42" rx="5" fill="#fff8e1" stroke="#d6a040"/>
  </g>
  <!-- type tags -->
  <g font-size="10.5" fill="#666" text-anchor="middle">
    <text x="85" y="140" filter="url(#r)">∅</text><text x="141" y="140" filter="url(#r)">{2}</text>
    <text x="197" y="140" filter="url(#r)">{3}</text><text x="253" y="140" filter="url(#r)">{2}</text>
    <text x="309" y="140" filter="url(#r)">∅</text><text x="365" y="140" filter="url(#r)">{2,3}</text>
    <text x="421" y="140" filter="url(#r)">∅</text><text x="477" y="140" filter="url(#r)">{2}</text>
    <text x="533" y="140" filter="url(#r)">{3}</text>
  </g>
  <!-- brackets -->
  <g stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#r)">
    <path d="M 118 158 L 118 166 L 276 166 L 276 158"/>
    <path d="M 454 158 L 454 166 L 556 166 L 556 158" stroke="#d6a040"/>
  </g>
  <text x="197" y="186" text-anchor="middle" font-size="12.5" fill="#2e6e2e" filter="url(#r)">中心块：3 种顺序</text>
  <text x="505" y="186" text-anchor="middle" font-size="12.5" fill="#a87f2a" filter="url(#r)">末尾被截断：2 种</text>
  <text x="85" y="186" text-anchor="middle" font-size="12" fill="#446688" filter="url(#r)">分隔点</text>
  <text x="365" y="186" text-anchor="middle" font-size="12" fill="#777" filter="url(#r)">隔离位</text>
  <text x="421" y="186" text-anchor="middle" font-size="12" fill="#446688" filter="url(#r)">分隔点</text>

  <!-- legend -->
  <g filter="url(#r)">
    <rect x="62" y="206" width="14" height="12" rx="3" fill="#e8f0fe" stroke="#446688"/>
    <rect x="186" y="206" width="14" height="12" rx="3" fill="#e6f4ea" stroke="#4a7a3a"/>
    <rect x="322" y="206" width="14" height="12" rx="3" fill="#eeeeee" stroke="#888888"/>
    <rect x="452" y="206" width="14" height="12" rx="3" fill="#fff8e1" stroke="#d6a040"/>
  </g>
  <g font-size="12" fill="#444">
    <text x="82" y="217" filter="url(#r)">分隔点 gcd(i,d)=1</text>
    <text x="206" y="217" filter="url(#r)">局部交换块</text>
    <text x="342" y="217" filter="url(#r)">隔离点 d | i</text>
    <text x="472" y="217" filter="url(#r)">截断块</text>
  </g>

  <!-- formula -->
  <g filter="url(#r)">
    <rect x="62" y="240" width="494" height="96" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="309" y="266" text-anchor="middle" font-size="13" fill="#33517a" filter="url(#r)">|A₆| = n!/(n−⌊n/d⌋)! × 3^(中心块数) × 2^(单断点数)</text>
  <text x="309" y="292" text-anchor="middle" font-size="13" fill="#33517a" filter="url(#r)">= 9!/(9−1)! × 3¹ × 2¹ = 9 × 3 × 2 = 54</text>
  <text x="309" y="318" text-anchor="middle" font-size="12" fill="#777" filter="url(#r)">9!/(9−1)! = 9 种方式把「自由浮动」的第 6 位插进序列</text>

  <text x="330" y="364" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#r)">断点位置就是 q | i(i+1) 的解：q 的质因子被分给 i 与 i+1（gcd(i,i+1)=1）</text>
  <text x="330" y="388" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#r)">解只有 2^ω(q) 个（每个质因子二选一），用 CRT 逐个枚举即可</text>
</svg>
