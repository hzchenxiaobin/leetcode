<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420">
<defs>
  <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs>
<rect x="0" y="0" width="760" height="420" fill="#fafafa"/>
<text x="380.0" y="34" font-size="22" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="bold" text-anchor="middle" filter="url(#rough2)">子弹沿 z 轴前进，先撞到 z 最小的靶</text>
<line x1="60" y1="300" x2="700" y2="300" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
<text x="690" y="330" font-size="18" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="normal" text-anchor="end" filter="url(#rough2)">z</text>
<line x1="60" y1="300" x2="60" y2="90" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
<text x="58" y="82" font-size="18" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="normal" text-anchor="end" filter="url(#rough2)">y</text>
<rect x="180" y="140" width="70" height="110" rx="8" fill="#e8f0fe" stroke="#777" stroke-width="2" filter="url(#rough2)"/>
<text x="215" y="276" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="normal" text-anchor="middle" filter="url(#rough2)">靶 1  z=3</text>
<rect x="340" y="110" width="70" height="90" rx="8" fill="#e6f4ea" stroke="#777" stroke-width="2" filter="url(#rough2)"/>
<text x="375" y="226" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="normal" text-anchor="middle" filter="url(#rough2)">靶 2  z=6</text>
<rect x="520" y="170" width="70" height="110" rx="8" fill="#fff4d6" stroke="#777" stroke-width="2" filter="url(#rough2)"/>
<text x="555" y="306" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="normal" text-anchor="middle" filter="url(#rough2)">靶 3  z=9</text>
<line x1="70" y1="200" x2="690" y2="200" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 5" filter="url(#rough2)"/>
<line x1="70" y1="200" x2="250" y2="200" stroke="#c0392b" stroke-width="3" filter="url(#rough2)"/>
<polygon points="250.0,200.0 239.0,195.0 239.0,205.0" fill="#c0392b" filter="url(#rough2)"/>
<text x="75" y="190" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#c0392b" font-weight="normal" text-anchor="start" filter="url(#rough2)">子弹 (x,y)</text>
<text x="300" y="188" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#c0392b" font-weight="normal" text-anchor="start" filter="url(#rough2)">命中靶 1 后停下</text>
</svg>
