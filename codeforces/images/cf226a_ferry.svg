<svg xmlns="http://www.w3.org/2000/svg" width="840" height="430" viewBox="0 0 840 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="430" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">最大军衔者在小外星人两次移动之间"摆渡"到另一端</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">n = 2 的最优解：大外星人 2 三次换端（每次 2 步），小外星人移动 2 次</text>
  <g filter="url(#rough2)"><rect x="80" y="92" width="110" height="38" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="135" y="117" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">大 2</text>
  <text x="220" y="117" text-anchor="start" font-size="13" fill="#2b2b2b" filter="url(#rough2)">3→2→1</text>
  <text x="360" y="117" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">把 1 号舱腾出来</text>
  <g filter="url(#rough2)"><rect x="80" y="142" width="110" height="38" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="135" y="167" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">小 1</text>
  <text x="220" y="167" text-anchor="start" font-size="13" fill="#2b2b2b" filter="url(#rough2)">3→2</text>
  <text x="360" y="167" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">触碰 3 号舱，此时大 2 在 1 号舱</text>
  <g filter="url(#rough2)"><rect x="80" y="192" width="110" height="38" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="135" y="217" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">大 2</text>
  <text x="220" y="217" text-anchor="start" font-size="13" fill="#2b2b2b" filter="url(#rough2)">1→2→3</text>
  <text x="360" y="217" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">换到 3 号舱</text>
  <g filter="url(#rough2)"><rect x="80" y="242" width="110" height="38" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="135" y="267" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">小 1</text>
  <text x="220" y="267" text-anchor="start" font-size="13" fill="#2b2b2b" filter="url(#rough2)">2→1</text>
  <text x="360" y="267" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">触碰 1 号舱，此时大 2 在 3 号舱</text>
  <g filter="url(#rough2)"><rect x="80" y="292" width="110" height="38" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="135" y="317" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">大 2</text>
  <text x="220" y="317" text-anchor="start" font-size="13" fill="#2b2b2b" filter="url(#rough2)">3→2→1</text>
  <text x="360" y="317" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">收尾</text>
  <text x="420" y="370" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">总步数：大 2 走 6 步 + 小 1 走 2 步 = 8 = 3×2 + 2</text>
  <g filter="url(#rough2)"><rect x="250" y="388" width="340" height="32" rx="4" fill="#faf3ec" fill-opacity="0.85" stroke="#c8a48a" stroke-width="1.3"/></g>
  <text x="420" y="410" text-anchor="middle" font-size="11.5" fill="#8a4b2a" filter="url(#rough2)">小外星人的相邻两次移动必触碰不同的端</text>
</svg>
