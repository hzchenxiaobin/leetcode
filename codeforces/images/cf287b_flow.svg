<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="313"/>
    <feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></defs>
  <rect width="700" height="300" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法：可行性判断 + 二分</text>
  <path d="M 170 40 Q 350 46 530 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="60" width="580" height="50" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="90" font-size="13" fill="#22314a" filter="url(#rough2)">1. n=1 ⇒ 0（已经有 1 条管道，不用分流器）</text>
  <g filter="url(#rough2)"><rect x="60" y="122" width="580" height="50" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="76" y="152" font-size="13" fill="#8a6015" filter="url(#rough2)">2. (k−1)·k/2 &lt; n−1 ⇒ −1（所有分流器全用也不够）</text>
  <g filter="url(#rough2)"><rect x="60" y="184" width="580" height="50" rx="8" fill="#e8f4e0" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="214" font-size="13" fill="#2f5223" filter="url(#rough2)">3. 二分最小 m ∈ [1,k−1] 使 m(k−1) − m(m−1)/2 ≥ n−1，输出 m</text>
  <g filter="url(#rough2)"><rect x="60" y="246" width="580" height="44" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="274" font-size="12.5" fill="#2f5223" filter="url(#rough2)">复杂度 O(log k)，k ≤ 10⁹、n ≤ 10¹⁸ 都用 long long / __int128 安全。</text>
</svg>
