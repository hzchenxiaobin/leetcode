<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="620" height="430" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="14.5" fill="#333" filter="url(#rough2)">① 差分替换：a_i = c + (d_i + … + d(n-1))，a_i mod a(i+1) = d_i mod a(i+1)</text>

  <!-- 数组 a 的一行 -->
  <text x="100" y="52" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">a1</text>
  <text x="204" y="52" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">a2</text>
  <text x="308" y="52" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">a3</text>
  <text x="412" y="52" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">a4 = c</text>

  <rect x="64" y="58" width="72" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="168" y="58" width="72" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="272" y="58" width="72" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="376" y="58" width="72" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="100" y="86" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">6</text>
  <text x="204" y="86" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">5</text>
  <text x="308" y="86" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <text x="412" y="86" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>

  <!-- 差分标注 -->
  <path d="M 152 104 L 152 126" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 256 104 L 256 126" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 360 104 L 360 126" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="152" y="146" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">d1=1</text>
  <text x="256" y="146" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">d2=2</text>
  <text x="360" y="146" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">d3=1</text>
  <text x="412" y="146" text-anchor="middle" font-size="12.5" fill="#d6a040" filter="url(#rough2)">c=2</text>

  <!-- 右侧注释 -->
  <rect x="474" y="58" width="132" height="100" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="540" y="80" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">a4 = c = 2</text>
  <text x="540" y="100" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">a3 = c + d3 = 3</text>
  <text x="540" y="120" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">a1 = c + D = 6</text>
  <text x="540" y="144" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">D = Σ d_i = 4</text>

  <!-- 关键恒等式 -->
  <rect x="40" y="176" width="540" height="88" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="200" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">m = Σ (d_i mod a(i+1)) = D − E</text>
  <text x="310" y="226" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">E = Σ floor(d_i / a(i+1)) · a(i+1)  ≥  0   是「被整除掉」的总量</text>
  <text x="310" y="252" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">a1 = c + D ≤ m + 2   ⟹   E = D − m ≤ 2 − c ≤ 1</text>

  <!-- 两种情形 -->
  <rect x="40" y="284" width="262" height="120" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="171" y="308" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">情形 ①  E = 0（没有任何整除）</text>
  <text x="171" y="332" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">每个 d_i &lt; a(i+1)，D = m</text>
  <text x="171" y="354" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">c ≤ 2；若 c = 1 则全 1，m = 0</text>
  <text x="171" y="380" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">所以只能 a_n = c = 2</text>

  <rect x="320" y="284" width="262" height="120" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="451" y="308" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">情形 ②  E = 1（恰好整除一次）</text>
  <text x="451" y="332" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">唯一 k：a(k+1) = 1，d_k = 1</text>
  <text x="451" y="354" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a_n = 1，k 右侧的 d 全为 0</text>
  <text x="451" y="380" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">左侧同型，基底变成 2</text>
</svg>
