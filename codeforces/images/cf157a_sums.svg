<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="561"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="300" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">先算行和 / 列和，再逐格比较 col &gt; row</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">O(n²) 判定</text>
  <g filter="url(#rough2)"><rect x="120" y="96" width="90" height="50" rx="4" fill="#cfe0f5" fill-opacity="0.55" stroke="#446688" stroke-width="1.4"/></g>
  <text x="165" y="128" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="220" y="96" width="90" height="50" rx="4" fill="#f6e3c4" fill-opacity="0.55" stroke="#446688" stroke-width="1.4"/></g>
  <text x="265" y="128" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="320" y="96" width="90" height="50" rx="4" fill="#dcecd2" fill-opacity="0.55" stroke="#446688" stroke-width="1.4"/></g>
  <text x="365" y="128" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="120" y="152" width="90" height="50" rx="4" fill="#f6e3c4" fill-opacity="0.55" stroke="#446688" stroke-width="1.4"/></g>
  <text x="165" y="184" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="220" y="152" width="90" height="50" rx="4" fill="#dcecd2" fill-opacity="0.55" stroke="#446688" stroke-width="1.4"/></g>
  <text x="265" y="184" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="320" y="152" width="90" height="50" rx="4" fill="#f3d9d6" fill-opacity="0.55" stroke="#446688" stroke-width="1.4"/></g>
  <text x="365" y="184" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><rect x="120" y="208" width="90" height="50" rx="4" fill="#dcecd2" fill-opacity="0.55" stroke="#446688" stroke-width="1.4"/></g>
  <text x="165" y="240" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="220" y="208" width="90" height="50" rx="4" fill="#f3d9d6" fill-opacity="0.55" stroke="#446688" stroke-width="1.4"/></g>
  <text x="265" y="240" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><rect x="320" y="208" width="90" height="50" rx="4" fill="#cfe0f5" fill-opacity="0.55" stroke="#446688" stroke-width="1.4"/></g>
  <text x="365" y="240" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <text x="600" y="120" text-anchor="start" font-size="11.5" fill="#446688" filter="url(#rough2)">行和：row[i] = Σ 该行</text>
  <text x="600" y="150" text-anchor="start" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">列和：col[j] = Σ 该列</text>
  <text x="600" y="186" text-anchor="start" font-size="12" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">获胜 ⟺ col[j] &gt; row[i]</text>
  <text x="450" y="268" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">每格独立判断，行和列和可预先算好</text>
</svg>
