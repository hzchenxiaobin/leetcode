<svg xmlns="http://www.w3.org/2000/svg" width="880" height="392" viewBox="0 0 880 392"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="91"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="392" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">答案总落在“后缀严格最小值”链上</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">链上下标递增、数值递增；查询 = 最后一个数值小于 a[i] 的链元素</text>
  <g filter="url(#rough2)"><rect x="150" y="110" width="56" height="42" rx="3" fill="#ffffff" fill-opacity="0.9" stroke="#99aabb" stroke-width="1.4"/></g>
  <text x="178.0" y="137" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">10</text>
  <text x="178.0" y="102" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="214" y="110" width="56" height="42" rx="3" fill="#ffffff" fill-opacity="0.9" stroke="#99aabb" stroke-width="1.4"/></g>
  <text x="242.0" y="137" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">8</text>
  <text x="242.0" y="102" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="278" y="110" width="56" height="42" rx="3" fill="#ffffff" fill-opacity="0.9" stroke="#99aabb" stroke-width="1.4"/></g>
  <text x="306.0" y="137" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <text x="306.0" y="102" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="342" y="110" width="56" height="42" rx="3" fill="#d7ecd0" fill-opacity="0.75" stroke="#6a9a58" stroke-width="1.4"/></g>
  <text x="370.0" y="137" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="370.0" y="102" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><rect x="406" y="110" width="56" height="42" rx="3" fill="#ffffff" fill-opacity="0.9" stroke="#99aabb" stroke-width="1.4"/></g>
  <text x="434.0" y="137" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">50</text>
  <text x="434.0" y="102" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">5</text>
  <g filter="url(#rough2)"><rect x="470" y="110" width="56" height="42" rx="3" fill="#d7ecd0" fill-opacity="0.75" stroke="#6a9a58" stroke-width="1.4"/></g>
  <text x="498.0" y="137" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">45</text>
  <text x="498.0" y="102" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">6</text>
  <text x="440" y="186" text-anchor="middle" font-size="12" fill="#3d6b2f" filter="url(#rough2)">样例 1：绿色两格（值 3、45）构成后缀最小值链</text>
  <text x="440" y="214" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">查询 a[1]=10：链上数值 &lt;10 的最后一个是 3（位置 4）→ 不满 = 4−1−1 = 2</text>
  <text x="440" y="242" text-anchor="middle" font-size="12" fill="#8a2b28" filter="url(#rough2)">若链上那个位置在 i 左边（例如 i=6、a=45）→ 输出 −1</text>
  <g filter="url(#rough2)"><rect x="120" y="268" width="640" height="64" rx="4" fill="#ffffff" fill-opacity="0.0" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="5 4"/></g>
  <text x="440" y="292" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">为什么只可能是链上的点：若 j 不是后缀最小值，则它右边有更小或相等的 a[j']，</text>
  <text x="440" y="314" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">j' 更靠前且同样更年轻 → j 永远不是“最远的年轻者”</text>
</svg>
