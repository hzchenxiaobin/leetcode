<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="147"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="430" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 3：断边 2-4，两侧直径各为 2</text>
  <path d="M 140 44 Q 380 50 620 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 普通边 -->
  <line x1="150" y1="130" x2="250" y2="215" stroke="#999" stroke-width="2.4" filter="url(#rough2)"/>
  <line x1="150" y1="300" x2="250" y2="215" stroke="#999" stroke-width="2.4" filter="url(#rough2)"/>
  <line x1="430" y1="215" x2="540" y2="130" stroke="#999" stroke-width="2.4" filter="url(#rough2)"/>
  <line x1="430" y1="215" x2="540" y2="300" stroke="#999" stroke-width="2.4" filter="url(#rough2)"/>

  <!-- 被删的边 -->
  <line x1="250" y1="215" x2="430" y2="215" stroke="#b85450" stroke-width="3" stroke-dasharray="8 5" filter="url(#rough2)"/>
  <text x="340" y="202" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a3b36" filter="url(#rough2)">删去 2-4</text>

  <!-- 左直径 -->
  <line x1="150" y1="130" x2="250" y2="215" stroke="#446688" stroke-width="5" filter="url(#rough2)"/>
  <line x1="250" y1="215" x2="150" y2="300" stroke="#446688" stroke-width="5" filter="url(#rough2)"/>
  <!-- 右直径 -->
  <line x1="540" y1="130" x2="430" y2="215" stroke="#4a7a3a" stroke-width="5" filter="url(#rough2)"/>
  <line x1="430" y1="215" x2="540" y2="300" stroke="#4a7a3a" stroke-width="5" filter="url(#rough2)"/>

  <!-- 顶点 -->
  <circle cx="250" cy="215" r="9" fill="#fff" stroke="#2b2b2b" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="430" cy="215" r="9" fill="#fff" stroke="#2b2b2b" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="150" cy="130" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="150" cy="300" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="540" cy="130" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="540" cy="300" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>

  <text x="250" y="205" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="430" y="205" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="136" y="118" font-size="11" fill="#2f4a66" filter="url(#rough2)">1</text>
  <text x="136" y="326" font-size="11" fill="#2f4a66" filter="url(#rough2)">3</text>
  <text x="552" y="118" font-size="11" fill="#2f5223" filter="url(#rough2)">5</text>
  <text x="552" y="326" font-size="11" fill="#2f5223" filter="url(#rough2)">6</text>

  <text x="170" y="350" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">左侧直径 1-2-3 = 2</text>
  <text x="440" y="350" font-size="11.5" fill="#2f5223" filter="url(#rough2)">右侧直径 5-4-6 = 2</text>

  <!-- 结论 -->
  <rect x="160" y="370" width="440" height="44" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="398" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">答案 = 2 × 2 = 4</text>
</svg>
