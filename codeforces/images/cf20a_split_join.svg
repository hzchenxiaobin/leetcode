<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="da" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8a6015"/>
    </marker>
  </defs>

  <rect width="760" height="360" fill="#fafafa"/>
  <text x="380" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按 '/' 切分，丢掉空段，再用单个 '/' 拼回去</text>

  <!-- 输入 -->
  <rect x="60" y="56" width="640" height="46" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="86" font-size="16" fill="#2f4a66" filter="url(#rough2)">//usr///local//nginx/sbin</text>
  <text x="660" y="86" text-anchor="end" font-size="11" fill="#8a8a8a" filter="url(#rough2)">输入</text>

  <!-- 切分箭头 -->
  <g stroke="#8a6015" stroke-width="1.4" filter="url(#rough2)">
    <line x1="120" y1="106" x2="120" y2="136" marker-end="url(#da)"/>
    <line x1="250" y1="106" x2="250" y2="136" marker-end="url(#da)"/>
    <line x1="380" y1="106" x2="380" y2="136" marker-end="url(#da)"/>
    <line x1="510" y1="106" x2="510" y2="136" marker-end="url(#da)"/>
  </g>
  <text x="380" y="126" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">split('/') 后丢弃空串</text>

  <!-- 分量 -->
  <g filter="url(#rough2)">
    <rect x="80" y="144" width="80" height="42" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="120" y="171" text-anchor="middle" font-size="14" fill="#2f4a66">usr</text>
    <rect x="210" y="144" width="80" height="42" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="250" y="171" text-anchor="middle" font-size="14" fill="#2f4a66">local</text>
    <rect x="340" y="144" width="80" height="42" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="380" y="171" text-anchor="middle" font-size="14" fill="#2f4a66">nginx</text>
    <rect x="470" y="144" width="80" height="42" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="510" y="171" text-anchor="middle" font-size="14" fill="#2f4a66">sbin</text>
  </g>
  <text x="620" y="171" font-size="11.5" fill="#8a8a8a" filter="url(#rough2)">4 个非空分量</text>

  <!-- 拼接箭头 -->
  <g stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)">
    <line x1="120" y1="196" x2="120" y2="224" marker-end="url(#da)"/>
    <line x1="250" y1="196" x2="250" y2="224" marker-end="url(#da)"/>
    <line x1="380" y1="196" x2="380" y2="224" marker-end="url(#da)"/>
    <line x1="510" y1="196" x2="510" y2="224" marker-end="url(#da)"/>
  </g>

  <!-- 输出 -->
  <rect x="60" y="232" width="640" height="46" rx="8" fill="#eef4ec" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="76" y="262" font-size="16" fill="#2f5223" filter="url(#rough2)">/usr/local/nginx/sbin</text>
  <text x="660" y="262" text-anchor="end" font-size="11" fill="#2f5223" filter="url(#rough2)">输出（4 个斜杠）</text>

  <text x="380" y="312" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">没有分量时输出单个 '/'（根目录）；分量之间恰好一个 '/'，末尾不加。</text>
  <text x="380" y="336" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">斜杠数 = 分量数，已经是最少（任何等价写法都要有 1 + (k−1) 个）。</text>
</svg>
