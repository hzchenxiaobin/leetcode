<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="460" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">一次操作把 1 颗石子从 i 搬到 i+2^t</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <line x1="110.0" y1="160.0" x2="500.0" y2="160.0" stroke="#999999" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="110.0" y1="152.0" x2="110.0" y2="168.0" stroke="#999999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="110.0" y="190.0" text-anchor="middle" font-size="13" fill="#666" font-weight="bold" filter="url(#rough2)">1</text>
  <line x1="240.0" y1="152.0" x2="240.0" y2="168.0" stroke="#999999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="240.0" y="190.0" text-anchor="middle" font-size="13" fill="#666" font-weight="bold" filter="url(#rough2)">2</text>
  <line x1="370.0" y1="152.0" x2="370.0" y2="168.0" stroke="#999999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="370.0" y="190.0" text-anchor="middle" font-size="13" fill="#666" font-weight="bold" filter="url(#rough2)">3</text>
  <line x1="500.0" y1="152.0" x2="500.0" y2="168.0" stroke="#999999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="500.0" y="190.0" text-anchor="middle" font-size="13" fill="#666" font-weight="bold" filter="url(#rough2)">4</text>
  <circle cx="110.0" cy="138.0" r="13.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="110.0" y="143.0" text-anchor="middle" font-size="11" fill="#8a6015" font-weight="bold" filter="url(#rough2)">1</text>
  <line x1="116.0" y1="134.0" x2="232.0" y2="134.0" stroke="#8a6015" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="175.0" y="124.0" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">2⁰</text>
  <circle cx="240.0" cy="138.0" r="13.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="240.0" y="143.0" text-anchor="middle" font-size="11" fill="#8a6015" font-weight="bold" filter="url(#rough2)">2</text>
  <line x1="246.0" y1="134.0" x2="362.0" y2="134.0" stroke="#8a6015" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="305.0" y="124.0" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">2¹</text>
  <circle cx="370.0" cy="138.0" r="13.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="370.0" y="143.0" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <circle cx="500.0" cy="138.0" r="13.0" fill="#fde8e8" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="500.0" y="143.0" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>
  <path d="M 120 114 Q 240 70 490 120" fill="none" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="318.0" y="82.0" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">跨过 k=2：N=2，一跳 1→3</text>
  <text x="60.0" y="232.0" text-anchor="start" font-size="13" fill="#2b2b2b" filter="url(#rough2)">n = 4：要跨过 k = 3，位移至少 3；3 = 1 + 2 必须两跳 1→2→4</text>
  <text x="60.0" y="260.0" text-anchor="start" font-size="13" fill="#6b4c9a" font-weight="bold" filter="url(#rough2)">位移 N 能用 m 个 2 的幂相加 ⇔ popcount(N) ≤ m</text>
  <rect x="40.0" y="288.0" width="640.0" height="108.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="54.0" y="312.0" text-anchor="start" font-size="12" fill="#3f3420" filter="url(#rough2)">c(i, k) = min{ popcount(N) : k+1-i ≤ N ≤ n-i }</text>
  <text x="54.0" y="338.0" text-anchor="start" font-size="12" fill="#3f3420" filter="url(#rough2)">下界 k+1-i：必须真的跨过 k；上界 n-i：不能越过表尾</text>
  <text x="54.0" y="364.0" text-anchor="start" font-size="12" fill="#3f3420" filter="url(#rough2)">n=4, i=1: c(1,2)=popcount(2)=1, c(1,3)=popcount(3)=2</text>
  <text x="60.0" y="432.0" text-anchor="start" font-size="11.5" fill="#555" filter="url(#rough2)">注意：n=8 时同一对 (i,k) 可能因右端更远而少跳一次，说明上界 n-i 不能省。</text>
</svg>
