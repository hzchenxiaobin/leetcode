<svg xmlns="http://www.w3.org/2000/svg" width="780" height="470" viewBox="0 0 780 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="37"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="780" height="470" fill="#fafafa"/>

  <text x="390" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">空闲段上的最优起点：把 y* 夹进可行区间</text>
  <path d="M 150 42 Q 390 48 630 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 座位条 -->
  <g filter="url(#rough2)">
    <rect x="70" y="100" width="44" height="44" fill="#ededed" stroke="#999999" stroke-width="1.3"/>
    <rect x="118" y="100" width="44" height="44" fill="#ededed" stroke="#999999" stroke-width="1.3"/>
    <rect x="166" y="100" width="44" height="44" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="214" y="100" width="44" height="44" fill="#fbe3c8" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="262" y="100" width="44" height="44" fill="#fbe3c8" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="310" y="100" width="44" height="44" fill="#fbe3c8" stroke="#c98a2b" stroke-width="1.6"/>
    <rect x="358" y="100" width="44" height="44" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="406" y="100" width="44" height="44" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="454" y="100" width="44" height="44" fill="#ededed" stroke="#999999" stroke-width="1.3"/>
  </g>
  <g filter="url(#rough2)" font-size="10" fill="#555555" text-anchor="middle">
    <text x="92" y="127">1</text>
    <text x="140" y="127">2</text>
    <text x="188" y="127">3</text>
    <text x="236" y="127">4</text>
    <text x="284" y="127">5</text>
    <text x="332" y="127">6</text>
    <text x="380" y="127">7</text>
    <text x="428" y="127">8</text>
    <text x="476" y="127">9</text>
  </g>
  <text x="64" y="90" font-size="10.5" fill="#777777" filter="url(#rough2)">座位</text>

  <!-- 空闲段括号 -->
  <path d="M 166 96 L 166 82 L 498 82 L 498 96" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="332" y="74" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">空闲段 [a, b] = [3, 8]（灰色已售）</text>

  <!-- 可行起点括号 -->
  <path d="M 166 148 L 166 162 L 498 162 L 498 148" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="380" y="182" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">可行起点 y ∈ [a, b−M+1] = [3, 6]</text>
  <text x="236" y="196" text-anchor="middle" font-size="10.5" fill="#8a6015" filter="url(#rough2)">橙色是 y = 4 的窗口</text>

  <!-- f(y) 图 -->
  <text x="70" y="222" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">f(y)（M = 3，c = 5）：先降后升的凸函数</text>
  <line x1="70" y1="400" x2="440" y2="400" stroke="#888888" stroke-width="1.3" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="80" y="283" width="40" height="117" fill="#e6e6e6" stroke="#999999" stroke-width="1.2"/>
    <rect x="130" y="322" width="40" height="78" fill="#e6e6e6" stroke="#999999" stroke-width="1.2"/>
    <rect x="180" y="361" width="40" height="39" fill="#d9ecd4" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="230" y="374" width="40" height="26" fill="#fbe3c8" stroke="#c98a2b" stroke-width="1.5"/>
    <rect x="280" y="361" width="40" height="39" fill="#d9ecd4" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="330" y="322" width="40" height="78" fill="#d9ecd4" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="380" y="283" width="40" height="117" fill="#e6e6e6" stroke="#999999" stroke-width="1.2"/>
  </g>
  <g filter="url(#rough2)" font-size="10" fill="#555555" text-anchor="middle">
    <text x="100" y="277">9</text>
    <text x="150" y="316">6</text>
    <text x="200" y="355">3</text>
    <text x="250" y="368">2</text>
    <text x="300" y="355">3</text>
    <text x="350" y="316">6</text>
    <text x="400" y="277">9</text>
  </g>
  <g filter="url(#rough2)" font-size="10" fill="#777777" text-anchor="middle">
    <text x="100" y="416">1</text>
    <text x="150" y="416">2</text>
    <text x="200" y="416">3</text>
    <text x="250" y="416">4</text>
    <text x="300" y="416">5</text>
    <text x="350" y="416">6</text>
    <text x="400" y="416">7</text>
  </g>
  <text x="466" y="404" text-anchor="end" font-size="10.5" fill="#777777" filter="url(#rough2)">起点 y</text>

  <path d="M 250 246 L 250 396" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 3" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="250" y="240" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">y* = 4</text>

  <!-- 右侧结论 -->
  <rect x="470" y="230" width="284" height="180" rx="12" fill="#fdeeee" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="484" y="256" font-size="11.5" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">为什么只需要看一个点？</text>
  <text x="484" y="282" font-size="11" fill="#8a2b28" filter="url(#rough2)">f 只与 M、y 有关，与行无关；</text>
  <text x="484" y="304" font-size="11" fill="#8a2b28" filter="url(#rough2)">它是凸函数，先降后升。</text>
  <text x="484" y="330" font-size="11" fill="#8a2b28" filter="url(#rough2)">段内可行起点 [a, b−M+1]，</text>
  <text x="484" y="352" font-size="11" fill="#8a2b28" filter="url(#rough2)">最优起点就是 clamp(y*, …)。</text>
  <text x="484" y="382" font-size="11.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">本例 clamp(4, 3, 6) = 4</text>

  <text x="40" y="450" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">绿柱是段内可行的起点；橙色柱是其中 f 最小、且起点最小的那个，就是本题要输出的 y_l。</text>
</svg>
