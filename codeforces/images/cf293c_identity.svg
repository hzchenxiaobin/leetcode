<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="521"/>
    <feDisplacementMap in="SourceGraphic" scale="1.5"/></filter></defs>
  <rect width="700" height="300" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">恒等式：把三个小立方体拼成大立方体缺的块数</text>
  <path d="M 110 40 Q 350 46 590 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="66" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="13" fill="#22314a" filter="url(#rough2)">缺的块数 n = (a+b+c)³ − a³ − b³ − c³ = 3(a+b)(b+c)(c+a)</text>
  <text x="76" y="106" font-size="12.5" fill="#22314a" filter="url(#rough2)">（这是经典恒等式，直接展开即可验证。）</text>
  <g filter="url(#rough2)"><rect x="60" y="132" width="580" height="76" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="76" y="156" font-size="12.5" fill="#8a6015" filter="url(#rough2)">于是必须 3 | n，令 N = n/3，问题变成数三元组 (x,y,z)=(a+b,b+c,c+a) 满足 xyz = N。</text>
  <text x="76" y="180" font-size="12.5" fill="#8a6015" filter="url(#rough2)">反解：a=(x+z−y)/2、b=(x+y−z)/2、c=(y+z−x)/2</text>
  <text x="76" y="200" font-size="12.5" fill="#8a6015" filter="url(#rough2)">要求：三角不等式（a,b,c&gt;0）且 x+y+z 为偶数（整数性）✓</text>
  <g filter="url(#rough2)"><rect x="60" y="216" width="580" height="66" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="240" font-size="12.5" fill="#2f5223" filter="url(#rough2)">做法：分解 N（试除到 √N ≤ 6·10⁶ 足够，因为 N ≤ 10¹⁴/3），枚举因子 x、再枚举 y | N/x。</text>
  <text x="76" y="262" font-size="12.5" fill="#2f5223" filter="url(#rough2)">样例：n=24 ⇒ N=8 ⇒ (2,2,2) 满足 ⇒ a=b=c=1，答案 1 ✓</text>
  <text x="76" y="280" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">n=648 ⇒ N=216 ⇒ 答案 7 ✓；n=5 不被 3 整除 ⇒ 0 ✓</text>
</svg>
