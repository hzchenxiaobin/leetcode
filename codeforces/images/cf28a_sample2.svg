<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="420" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="38" text-anchor="middle" font-size="18.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">28A：样例 2 的折返点与所需杆长</text>
  <path d="M 137 50 Q 380 56 623 50" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <line x1="130" y1="330" x2="240" y2="330" stroke="#7a7a7a" stroke-width="2.6" filter="url(#rough2)"/>
  <line x1="240" y1="330" x2="240" y2="220" stroke="#7a7a7a" stroke-width="2.6" filter="url(#rough2)"/>
  <line x1="240" y1="220" x2="350" y2="220" stroke="#7a7a7a" stroke-width="2.6" filter="url(#rough2)"/>
  <line x1="350" y1="220" x2="350" y2="110" stroke="#7a7a7a" stroke-width="2.6" filter="url(#rough2)"/>
  <line x1="350" y1="110" x2="130" y2="110" stroke="#7a7a7a" stroke-width="2.6" filter="url(#rough2)"/>
  <line x1="130" y1="110" x2="130" y2="330" stroke="#7a7a7a" stroke-width="2.6" filter="url(#rough2)"/>
  <circle cx="130" cy="330" r="7" fill="#3d3d3d" stroke="none" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="130" y="316" text-anchor="middle" font-size="12" fill="#c9801f" font-weight="bold" filter="url(#rough2)">P1</text>
  <circle cx="240" cy="330" r="7" fill="#3d3d3d" stroke="none" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="240" y="316" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">P2</text>
  <circle cx="240" cy="220" r="7" fill="#3d3d3d" stroke="none" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="240" y="206" text-anchor="middle" font-size="12" fill="#c9801f" font-weight="bold" filter="url(#rough2)">P3</text>
  <circle cx="350" cy="220" r="7" fill="#3d3d3d" stroke="none" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="350" y="206" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">P4</text>
  <circle cx="350" cy="110" r="7" fill="#3d3d3d" stroke="none" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="350" y="96" text-anchor="middle" font-size="12" fill="#c9801f" font-weight="bold" filter="url(#rough2)">P5</text>
  <circle cx="130" cy="110" r="7" fill="#3d3d3d" stroke="none" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="130" y="96" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">P6</text>
  <text x="120" y="372" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">钉子（按给定顺序连成闭合折线）</text>
  <rect x="430" y="84" width="300" height="300" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="446" y="112" text-anchor="start" font-size="12.5" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">所需杆长（折返点 → 长度）</text>
  <text x="446" y="144" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">P1  (0,0)</text>
  <text x="560" y="144" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">|P6P1|+|P1P2| = 2+1 = 3</text>
  <text x="446" y="174" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">P2  (1,0)</text>
  <text x="560" y="174" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">1+1 = 2</text>
  <text x="446" y="204" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">P3  (1,1)</text>
  <text x="560" y="204" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">1+1 = 2</text>
  <text x="446" y="234" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">P4  (2,1)</text>
  <text x="560" y="234" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">1+1 = 2</text>
  <text x="446" y="264" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">P5  (2,2)</text>
  <text x="560" y="264" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">1+2 = 3</text>
  <text x="446" y="294" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">P6  (0,2)</text>
  <text x="560" y="294" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">2+2 = 4</text>
  <text x="446" y="330" text-anchor="start" font-size="12" fill="#2f5223" font-weight="bold" filter="url(#rough2)">杆：3 2 3 → 奇数方案 {3,2,3} 匹配 ✓</text>
  <text x="446" y="356" text-anchor="start" font-size="12" fill="#b6483f" font-weight="normal" filter="url(#rough2)">偶数方案 {2,2,4} 缺 4 ✗</text>
  <text x="60" y="402" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">所以输出 YES：P1 用杆 1（长 3）、P3 用杆 2（长 2）、P5 用杆 3（长 3），其余 -1。</text>
</svg>
