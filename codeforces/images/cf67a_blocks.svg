<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr67a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="380" fill="#fafafa"/>

  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">等号把相邻学生粘成块，块间只剩严格比较</text>
  <path d="M 120 44 Q 360 50 600 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 学生格 -->
  <g filter="url(#rough2)">
    <rect x="40" y="70" width="90" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="140" y="70" width="90" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="240" y="70" width="90" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="340" y="70" width="90" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="440" y="70" width="90" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="540" y="70" width="90" height="46" rx="6" fill="#fde8e6" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <g font-size="13" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">
    <text x="85" y="99">学生 1</text>
    <text x="185" y="99">学生 2</text>
    <text x="285" y="99">学生 3</text>
    <text x="385" y="99">学生 4</text>
    <text x="485" y="99">学生 5</text>
    <text x="585" y="99">学生 6</text>
  </g>

  <!-- 关系 -->
  <g font-size="15" font-weight="bold" fill="#8a6015" text-anchor="middle" filter="url(#rough2)">
    <text x="135" y="152">=</text>
    <text x="235" y="152">R</text>
    <text x="335" y="152">L</text>
    <text x="435" y="152">=</text>
    <text x="535" y="152">L</text>
  </g>
  <text x="40" y="178" font-size="11.5" fill="#555" filter="url(#rough2)">相邻关系 s = =RL=L，等号处两人必须同值</text>

  <!-- 缩块箭头 -->
  <path d="M 130 190 L 130 222" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr67a)" filter="url(#rough2)"/>
  <text x="145" y="212" font-size="11" fill="#2f4a66" filter="url(#rough2)">缩块</text>

  <!-- 块 -->
  <g filter="url(#rough2)">
    <rect x="60" y="232" width="120" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="250" y="232" width="100" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="420" y="232" width="120" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="600" y="232" width="80" height="52" rx="8" fill="#fde8e6" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">
    <text x="120" y="254">块 1：学生 1,2</text>
    <text x="300" y="254">块 2：学生 3</text>
    <text x="480" y="254">块 3：学生 4,5</text>
    <text x="640" y="254">块 4：学生 6</text>
  </g>
  <g font-size="15" font-weight="bold" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">
    <text x="120" y="275">v₁</text>
    <text x="300" y="275">v₂</text>
    <text x="480" y="275">v₃</text>
    <text x="640" y="275">v₄</text>
  </g>

  <!-- 块间关系 -->
  <g font-size="14" font-weight="bold" fill="#7a4a8a" text-anchor="middle" filter="url(#rough2)">
    <text x="215" y="265">R</text>
    <text x="385" y="265">L</text>
    <text x="565" y="265">L</text>
  </g>
  <text x="215" y="282" font-size="10" fill="#7a4a8a" text-anchor="middle" filter="url(#rough2)">v₁&lt;v₂</text>
  <text x="385" y="282" font-size="10" fill="#7a4a8a" text-anchor="middle" filter="url(#rough2)">v₂&gt;v₃</text>
  <text x="565" y="282" font-size="10" fill="#7a4a8a" text-anchor="middle" filter="url(#rough2)">v₃&gt;v₄</text>

  <rect x="60" y="308" width="620" height="54" rx="10" fill="#f4f0fa" stroke="#7a4a8a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="76" y="330" font-size="13" font-weight="bold" fill="#5a3a6a" filter="url(#rough2)">缩块不改变问题：块内同值，块间只有 &lt; 或 &gt;</text>
  <text x="76" y="352" font-size="12" fill="#5a3a6a" filter="url(#rough2)">于是只需在一条 m 个点的链上求"逐点最小"的正整数赋值</text>
</svg>
