<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="400" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="38" text-anchor="middle" font-size="18.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">48F：每天独立 —— 按“每立方米单价”从低到高买满 W</text>
  <path d="M 137 50 Q 380 56 623 50" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="84" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">第 d 天公司 i 的整批总价 = c_i − (d−1)·a_i，因此每立方米单价 = (c_i − (d−1)a_i)/w_i，容量 w_i。</text>
  <text x="60" y="110" text-anchor="start" font-size="11.5" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">雪隔天融化，不能囤货 ⇒ 每天各自独立地取最便宜的 W 立方米。</text>
  <rect x="60" y="140" width="220" height="42" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="76" y="167" text-anchor="start" font-size="12" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">公司 1</text>
  <text x="300" y="167" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">整批 5 / 4 m³ ⇒ 单价 1.25</text>
  <rect x="60" y="192" width="220" height="42" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="76" y="219" text-anchor="start" font-size="12" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">公司 2</text>
  <text x="300" y="219" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">整批 5 / 4 m³ ⇒ 单价 1.25</text>
  <rect x="60" y="244" width="220" height="42" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="76" y="271" text-anchor="start" font-size="12" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">公司 3</text>
  <text x="300" y="271" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">整批 8 / 4 m³ ⇒ 单价 2</text>
  <text x="60" y="318" text-anchor="start" font-size="11.5" fill="#2f5223" font-weight="normal" filter="url(#rough2)">样例 1（第 1 天）：先拿公司 1、2 各 4 m³（1.25），再拿公司 3 的 2 m³（2）⇒ 14</text>
  <text x="60" y="344" text-anchor="start" font-size="11.5" fill="#2f5223" font-weight="normal" filter="url(#rough2)">第 2 天单价变成 1、0.75、0.75 ⇒ 8；两天合计 22.000000...</text>
  <text x="60" y="378" text-anchor="start" font-size="11" fill="#8a8a8a" font-weight="normal" filter="url(#rough2)">答案要求相对/绝对误差 ≤ 1e-9，必须用 long double 并输出定点小数。</text>
</svg>
