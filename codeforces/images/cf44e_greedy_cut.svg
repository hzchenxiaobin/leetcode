<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="127"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="acut" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="420" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">贪心切分：每行取 min(b, 剩余长度 − 后面各行至少需要的长度)</text>
  <path d="M 60 40 Q 360 46 660 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 字符串格子：11 个字符，每格 48px，从 x=90 起 -->
  <g filter="url(#rough2)" font-size="13">
    <rect x="90" y="70" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="138" y="70" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="186" y="70" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="234" y="70" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="282" y="70" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="330" y="70" width="48" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="378" y="70" width="48" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="426" y="70" width="48" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="474" y="70" width="48" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <rect x="522" y="70" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="570" y="70" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="114" y="93" text-anchor="middle" fill="#2f5223">a</text>
    <text x="162" y="93" text-anchor="middle" fill="#2f5223">b</text>
    <text x="210" y="93" text-anchor="middle" fill="#2f5223">r</text>
    <text x="258" y="93" text-anchor="middle" fill="#2f5223">a</text>
    <text x="306" y="93" text-anchor="middle" fill="#2f5223">k</text>
    <text x="354" y="93" text-anchor="middle" fill="#8a6015">a</text>
    <text x="402" y="93" text-anchor="middle" fill="#8a6015">d</text>
    <text x="450" y="93" text-anchor="middle" fill="#8a6015">a</text>
    <text x="498" y="93" text-anchor="middle" fill="#8a6015">b</text>
    <text x="546" y="93" text-anchor="middle" fill="#2f4a66">r</text>
    <text x="594" y="93" text-anchor="middle" fill="#2f4a66">a</text>
  </g>
  <text x="90" y="124" font-size="11" fill="#666" filter="url(#rough2)">abrakadabra（L = 11），k = 3，a = 2，b = 5</text>

  <!-- 切分括号 -->
  <g filter="url(#rough2)">
    <path d="M 90 138 L 90 152 L 330 152 L 330 138" stroke="#4a7a3a" stroke-width="1.8" fill="none"/>
    <path d="M 330 138 L 330 152 L 522 152 L 522 138" stroke="#d6a040" stroke-width="1.8" fill="none"/>
    <path d="M 522 138 L 522 152 L 618 152 L 618 138" stroke="#446688" stroke-width="1.8" fill="none"/>
    <text x="210" y="174" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223">第 1 行 abrak（长 5）</text>
    <text x="426" y="174" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6015">第 2 行 adab（长 4）</text>
    <text x="570" y="174" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66">第 3 行 ra（长 2）</text>
  </g>

  <!-- 三轮规则 -->
  <g filter="url(#rough2)">
    <rect x="40" y="196" width="640" height="150" rx="12" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
    <text x="56" y="222" font-size="12.5" font-weight="bold" fill="#2f4a66">每一轮的计算</text>

    <text x="56" y="248" font-size="11.5" fill="#2b2b2b">第 1 轮：r=2，上限 = 11 − 2·2 = 7，take = min(5, 7) = 5 → abrak</text>
    <text x="56" y="272" font-size="11.5" fill="#2b2b2b">第 2 轮：r=1，上限 = (11−5) − 1·2 = 4，take = min(5, 4) = 4 → adab</text>
    <text x="56" y="296" font-size="11.5" fill="#2b2b2b">第 3 轮：r=0，上限 = (11−9) − 0 = 2，take = min(5, 2) = 2 → ra</text>

    <line x1="56" y1="310" x2="664" y2="310" stroke="#9bb0c4" stroke-width="1"/>
    <text x="56" y="332" font-size="11" fill="#2f5223">take ≥ a 恒成立（留给后面的尾巴不会让本行不足 a），take ≤ b 由 min 保证。</text>
  </g>

  <text x="360" y="378" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">关键不等式：take = min(b, R − r·a) ∈ [a, b]，且切完 k 轮后恰好用完整个串</text>
  <text x="360" y="400" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">这与官方样例的 ab / rakad / abra 不同，但同样合法——本题是多解题</text>
</svg>
