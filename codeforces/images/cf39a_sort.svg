<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-6%" y="-6%" width="112%" height="112%"><feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="393" /><feDisplacementMap in="SourceGraphic" scale="1.5" /></filter></defs>
  <rect width="760" height="430" fill="#fafafa" />
  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1：a₀=1，按带符号系数升序</text>
  <path d="M 140 44 Q 380 50 620 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)" />

  <g>
    <rect x="40" y="70" width="210" height="110" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)" />
    <rect x="275" y="70" width="210" height="110" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)" />
    <rect x="510" y="70" width="210" height="110" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)" />
  </g>
  <text x="145" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">-3 * ++a</text>
  <text x="380" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">+1 * a++</text>
  <text x="615" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">+5 * a++</text>

  <text x="145" y="126" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">c = -3，pre</text>
  <text x="380" y="126" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">c = +1，post</text>
  <text x="615" y="126" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">c = +5，post</text>

  <text x="145" y="156" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5223" filter="url(#rough2)">a: 1→2，-6</text>
  <text x="380" y="156" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">a: 2→3，+2</text>
  <text x="615" y="156" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6015" filter="url(#rough2)">a: 3→4，+15</text>

  <text x="145" y="208" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">先 ++ 再乘：-3×2</text>
  <text x="380" y="208" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">先乘再加：1×2</text>
  <text x="615" y="208" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">先乘再加：5×3</text>

  <path d="M 250 125 L 270 125" stroke="#555" stroke-width="1.4" filter="url(#rough2)" />
  <path d="M 485 125 L 505 125" stroke="#555" stroke-width="1.4" filter="url(#rough2)" />

  <rect x="160" y="248" width="440" height="74" rx="10" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.5" filter="url(#rough2)" />
  <text x="380" y="278" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">总和 = -6 + 2 + 15 = 11</text>
  <text x="380" y="302" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">与样例输出 11 一致</text>

  <rect x="60" y="344" width="640" height="64" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)" />
  <text x="80" y="368" font-size="11.5" fill="#8a6015" filter="url(#rough2)">如果先算 +5，它只乘到 1；先算 -3，它只乘到 1 但 pre 额外 -3。</text>
  <text x="80" y="390" font-size="11.5" fill="#8a6015" filter="url(#rough2)">把负系数放前面、正系数放后面，可以让“大正数乘大 a”，总和最大。</text>
</svg>