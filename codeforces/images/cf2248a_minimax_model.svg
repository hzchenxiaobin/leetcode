<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="680" height="400" fill="#fafafa"/>

  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：双方都删「自己的第一个」</text>
  <text x="340" y="51" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#rough2)">Alice 删最左的 0，Bob 删最左的 1，两次删除互不改变对方的目标位置</text>

  <!-- 原串 -->
  <text x="52" y="100" font-size="13.5" fill="#33517a" filter="url(#rough2)">原串 s</text>
  <g>
    <rect x="190" y="76" width="38" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <rect x="236" y="76" width="38" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <rect x="282" y="76" width="38" height="38" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
    <rect x="328" y="76" width="38" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <rect x="374" y="76" width="38" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  </g>
  <g font-size="17" font-weight="bold" text-anchor="middle" fill="#2b2b2b">
    <text x="209" y="101" filter="url(#rough2)">1</text>
    <text x="255" y="101" filter="url(#rough2)">1</text>
    <text x="301" y="101" filter="url(#rough2)">0</text>
    <text x="347" y="101" filter="url(#rough2)">0</text>
    <text x="393" y="101" filter="url(#rough2)">1</text>
  </g>
  <path d="M284 120 L318 120" stroke="#b85450" stroke-width="2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="430" y="90" font-size="12" fill="#b85450" filter="url(#rough2)">Alice 删这个 0</text>
  <text x="430" y="107" font-size="11" fill="#b85450" filter="url(#rough2)">（它是整串最靠左的 0）</text>

  <path d="M301 132 L301 158" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 删 0 之后 -->
  <text x="52" y="184" font-size="13.5" fill="#33517a" filter="url(#rough2)">删 0 后</text>
  <g>
    <rect x="190" y="160" width="38" height="38" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
    <rect x="236" y="160" width="38" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <rect x="282" y="160" width="38" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <rect x="328" y="160" width="38" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  </g>
  <g font-size="17" font-weight="bold" text-anchor="middle" fill="#2b2b2b">
    <text x="209" y="185" filter="url(#rough2)">1</text>
    <text x="255" y="185" filter="url(#rough2)">1</text>
    <text x="301" y="185" filter="url(#rough2)">0</text>
    <text x="347" y="185" filter="url(#rough2)">1</text>
  </g>
  <text x="430" y="174" font-size="12" fill="#a0761e" filter="url(#rough2)">Bob 删这个 1</text>
  <text x="430" y="191" font-size="11" fill="#a0761e" filter="url(#rough2)">（它仍是最靠左的 1）</text>

  <path d="M301 216 L301 242" stroke="#3a3a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 终串 -->
  <text x="52" y="268" font-size="13.5" fill="#2e6e2e" filter="url(#rough2)">终串</text>
  <g>
    <rect x="190" y="244" width="38" height="38" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <rect x="236" y="244" width="38" height="38" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <rect x="282" y="244" width="38" height="38" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  </g>
  <g font-size="17" font-weight="bold" text-anchor="middle" fill="#2b2b2b">
    <text x="209" y="269" filter="url(#rough2)">1</text>
    <text x="255" y="269" filter="url(#rough2)">0</text>
    <text x="301" y="269" filter="url(#rough2)">1</text>
  </g>
  <text x="430" y="262" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">长度 n − 2 = 3，答案 101</text>

  <!-- 结论框 -->
  <rect x="52" y="308" width="576" height="66" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="70" y="334" font-size="13.5" fill="#7a5410" filter="url(#rough2)">等价写法：答案 = 原串划掉「第一个 0」与「第一个 1」，其余字符顺序不变</text>
  <text x="70" y="358" font-size="12" fill="#7a5410" filter="url(#rough2)">删 0 不会改变 1 的相对顺序（反之亦然），所以两次删除可以合并成一次线性扫描</text>
</svg>
