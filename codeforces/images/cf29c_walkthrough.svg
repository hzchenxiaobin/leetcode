<svg xmlns="http://www.w3.org/2000/svg" width="720" height="410" viewBox="0 0 720 410"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>

  <rect width="720" height="410" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两个样例拼出的路径</text>
  <path d="M 270 42 Q 360 48 450 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 样例 1 -->
  <text x="40" y="76" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">样例 1：邮戳 (1,100)、(100,2)</text>
  <g stroke="#446688" stroke-width="2.2" filter="url(#rough2)">
    <line x1="180" y1="126" x2="360" y2="126"/>
    <line x1="400" y1="126" x2="580" y2="126"/>
  </g>
  <g filter="url(#rough2)">
    <circle cx="160" cy="126" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="380" cy="126" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="600" cy="126" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g font-size="11.5" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">
    <text x="160" y="131">1</text><text x="380" y="131">100</text><text x="600" y="131">2</text>
  </g>
  <text x="270" y="114" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">邮戳</text>
  <text x="490" y="114" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">邮戳</text>
  <text x="380" y="168" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">路线：2 100 1（或反过来 1 100 2）</text>

  <!-- 样例 2 -->
  <text x="40" y="222" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">样例 2：邮戳 (3,1)、(100,2)、(3,2)</text>
  <g stroke="#446688" stroke-width="2.2" filter="url(#rough2)">
    <line x1="150" y1="276" x2="300" y2="276"/>
    <line x1="340" y1="276" x2="490" y2="276"/>
    <line x1="530" y1="276" x2="640" y2="276"/>
  </g>
  <g filter="url(#rough2)">
    <circle cx="130" cy="276" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="320" cy="276" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="510" cy="276" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="660" cy="276" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g font-size="11.5" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">
    <text x="130" y="281">1</text><text x="320" y="281">3</text>
    <text x="510" y="281">2</text><text x="660" y="281">100</text>
  </g>
  <text x="235" y="264" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">(3,1)</text>
  <text x="425" y="264" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">(3,2)</text>
  <text x="585" y="264" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">(100,2)</text>
  <text x="380" y="318" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">路线：100 2 3 1（或反过来 1 3 2 100）</text>

  <rect x="40" y="340" width="640" height="56" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <g font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">
    <text x="56" y="364">把邮戳看成无向边：每个城市度数 1 或 2，且图是一条链；度 1 的两个城市就是路线两端。</text>
    <text x="56" y="388">本实现从编号最大的端点出发，恰好与官方样例的方向一致。</text>
  </g>
</svg>
