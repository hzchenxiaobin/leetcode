<svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 0 780 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="21"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="a3" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="780" height="420" fill="#fafafa"/>
  <text x="390" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2 走查：5 · 70 / 200 170 40 → 8.965874696353</text>

  <!-- 公路 -->
  <rect x="90" y="112" width="620" height="16" fill="#eceff4" stroke="#8a94a6" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="90" y1="120" x2="716" y2="120" stroke="#8a94a6" stroke-width="1" filter="url(#rough2)"/>

  <!-- 0 / 165 / 170 / 200 刻度 -->
  <line x1="90" y1="100" x2="90" y2="140" stroke="#2b2b2b" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="90" y="94" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <line x1="601" y1="100" x2="601" y2="140" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="601" y="94" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">165</text>
  <line x1="617" y1="98" x2="617" y2="142" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="625" y="94" font-size="11" fill="#8f3b37" filter="url(#rough2)">170 = d</text>
  <line x1="710" y1="100" x2="710" y2="140" stroke="#2b2b2b" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="710" y="94" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">200 = l</text>

  <!-- 相位说明 -->
  <text x="330" y="72" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">全力加速到 40.62</text>
  <text x="601" y="72" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">刹车</text>
  <text x="666" y="72" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">再加速到 43.59</text>

  <!-- 时间括号 -->
  <path d="M92,168 L92,182 L615,182 L615,168" fill="none" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="353" y="200" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">第一段 t₁ = 8.2480768 s（0 → 170）</text>
  <path d="M619,168 L619,182 L708,182 L708,168" fill="none" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="663" y="222" text-anchor="middle" font-size="12" fill="#8f3b37" filter="url(#rough2)">t₂ = 0.7177979 s</text>
  <text x="663" y="240" text-anchor="middle" font-size="11" fill="#8f3b37" filter="url(#rough2)">（170 → 200）</text>

  <!-- 推导卡片 -->
  <rect x="55" y="262" width="670" height="142" rx="12" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <g font-size="13" fill="#2b2b2b" filter="url(#rough2)">
    <text x="72" y="290">1. V_d = min(70, √(2·5·170)) = min(70, 41.2311) = 41.2311 &gt; w = 40 ⇒ 限速生效</text>
    <text x="72" y="316">2. u = √(5·170 + 40²/2) = √1650 = 40.6202 &lt; v = 70 ⇒ 情形 ②，不碰最高速</text>
    <text x="72" y="342">3. t₁ = (2u − w)/a = (81.2404 − 40)/5 = 8.2480768</text>
    <text x="72" y="368">4. t₂ = (√(40² + 2·5·30) − 40)/5 = (43.5890 − 40)/5 = 0.7177979</text>
  </g>
  <text x="72" y="394" font-size="14" font-weight="bold" fill="#6d4a10" filter="url(#rough2)">答案 = 8.2480768 + 0.7177979 = 8.965874696353</text>
</svg>
