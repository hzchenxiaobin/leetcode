<svg xmlns="http://www.w3.org/2000/svg" width="740" height="400" viewBox="0 0 740 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="61"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="740" height="400" fill="#fafafa"/>
  <text x="370" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">k 阶螺旋 = 整个方块 − 格子 (1,0) − 内层 (k−2) 阶螺旋</text>
  <path d="M 170 46 Q 370 52 570 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="80" y="90" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="126" y="90" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="172" y="90" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="218" y="90" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="264" y="90" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="80" y="136" width="46" height="46" fill="#fdecea" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="103.0" y="164.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">挖</text>
  <rect x="126" y="136" width="46" height="46" fill="#fde9d9" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="172" y="136" width="46" height="46" fill="#fde9d9" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="218" y="136" width="46" height="46" fill="#fde9d9" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="264" y="136" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="80" y="182" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="126" y="182" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="172" y="182" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="218" y="182" width="46" height="46" fill="#fde9d9" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="264" y="182" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="80" y="228" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="126" y="228" width="46" height="46" fill="#fde9d9" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="172" y="228" width="46" height="46" fill="#fde9d9" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="218" y="228" width="46" height="46" fill="#fde9d9" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="264" y="228" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="80" y="274" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="126" y="274" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="172" y="274" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="218" y="274" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="264" y="274" width="46" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="218" y="228" width="138" height="138" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="103.0" y="78" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#555" filter="url(#rough2)">5 × 5 方块</text>
  <rect x="400" y="110" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="432" y="127" text-anchor="start" font-size="11.5" font-weight="normal" fill="#333" filter="url(#rough2)">k=5 螺旋覆盖的格子（17 格）</text>
  <rect x="400" y="150" width="22" height="22" fill="#fde9d9" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="432" y="167" text-anchor="start" font-size="11.5" font-weight="normal" fill="#333" filter="url(#rough2)">内层 k=3 螺旋（7 格，要减掉）</text>
  <rect x="400" y="190" width="22" height="22" fill="#fdecea" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="432" y="207" text-anchor="start" font-size="11.5" font-weight="normal" fill="#333" filter="url(#rough2)">局部格 (1,0)（边框唯一漏掉的一格）</text>
  <rect x="400" y="240" width="300" height="78" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="412" y="264" text-anchor="start" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">S(i,j,k) = Q(i,j,k) − a[i+1][j] − S(i+1,j+1,k−2)</text>
  <text x="412" y="286" text-anchor="start" font-size="11" font-weight="normal" fill="#7a5a1b" filter="url(#rough2)">Q 用二维前缀和 O(1) 求，S 由上一层滚动得到</text>
  <text x="412" y="306" text-anchor="start" font-size="11" font-weight="normal" fill="#7a5a1b" filter="url(#rough2)">基底 S(i,j,1) = a[i][j]（只用于递推）</text>
  <text x="70" y="350" text-anchor="start" font-size="12" font-weight="normal" fill="#555" filter="url(#rough2)">5×5 方块共 25 格 = 17（螺旋）+ 7（内层螺旋）+ 1（(1,0)）</text>
</svg>
