<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="300" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">批量减 = 取商</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">相等时 a/b = 1，正好是一次操作</text>
  <text x="150" y="110" text-anchor="start" font-size="13" fill="#2b2b2b" filter="url(#rough2)">一次操作把大数减到小于等于它：可批量减 a/b 次</text>
  <text x="150" y="152" text-anchor="start" font-size="13" fill="#2f4a66" filter="url(#rough2)">即辗转相除的计数版：ops += a/b; a %= b</text>
  <text x="150" y="194" text-anchor="start" font-size="13" fill="#3d6b2f" filter="url(#rough2)">a,b &lt;= 1e9 时 O(log) 次</text>
</svg>
