<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="780" height="372" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">把 k 当成等级时钟：第 j 次操作时 k = K + j − 1</text>

  <rect x="70" y="56" width="196" height="66" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="168" y="82" text-anchor="middle" font-size="14" fill="#2f4f6f" filter="url(#rough2)">前 S 次：全是分裂</text>
  <text x="168" y="106" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">要求 x &gt; 当前 k</text>

  <rect x="286" y="56" width="424" height="66" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="498" y="82" text-anchor="middle" font-size="14" fill="#33612a" filter="url(#rough2)">后 n + S 次：全部是删除</text>
  <text x="498" y="106" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">要求 x ≤ 当前 k</text>

  <line x1="70" y1="176" x2="742" y2="176" stroke="#667788" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="756" y="181" text-anchor="end" font-size="12" fill="#777" filter="url(#rough2)">等级 →</text>

  <line x1="168" y1="132" x2="168" y2="168" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="498" y1="132" x2="498" y2="168" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>

  <line x1="70" y1="170" x2="70" y2="184" stroke="#667788" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="286" y1="170" x2="286" y2="184" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="710" y1="170" x2="710" y2="184" stroke="#667788" stroke-width="1.6" filter="url(#rough2)"/>

  <text x="70" y="204" text-anchor="start" font-size="13" fill="#b85450" filter="url(#rough2)">k = K</text>
  <text x="286" y="204" text-anchor="start" font-size="13" fill="#b85450" filter="url(#rough2)">k = K + S</text>
  <text x="710" y="204" text-anchor="end" font-size="13" fill="#b85450" filter="url(#rough2)">k = K + T − 1</text>

  <rect x="70" y="224" width="640" height="52" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="246" text-anchor="middle" font-size="14" fill="#8a6520" filter="url(#rough2)">总操作数 T = n + 2S：分裂 S 次（个数 +1），删除 n + S 次（个数 −1）</text>
  <text x="390" y="267" text-anchor="middle" font-size="13" fill="#8a6520" filter="url(#rough2)">删除用的等级是连续一段 [K + S, K + T − 1]，共 n + S 个</text>

  <text x="70" y="304" font-size="13" fill="#444" filter="url(#rough2)">交换性：把「先删后分」换成「先分后删」，删除的等级 +1、分裂的等级 −1，两边都更宽松</text>
  <text x="70" y="328" font-size="13" fill="#444" filter="url(#rough2)">⇒ 一定存在最优方案：前缀 S 次分裂 + 后缀 n + S 次删除</text>
  <text x="70" y="354" font-size="13" fill="#b85450" filter="url(#rough2)">判定：S 次分裂可行 ⟺ 叶子的升序第 p 个满足 L(p) ≤ K + S + p − 1</text>
</svg>
