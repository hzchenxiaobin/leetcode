<svg xmlns="http://www.w3.org/2000/svg" width="880" height="486" viewBox="0 0 880 486" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough" x="-6%%" y="-6%%" width="112%%" height="112%%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="880" height="486" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="17.5" font-weight="bold" fill="#22303f" filter="url(#rough)">按中位数统计：删掉 m 后各分支大小为 s₁ … sₖ</text>
  <rect x="26" y="52" width="420" height="262" rx="10" fill="#eef4e8" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough)"/>
  <rect x="462" y="52" width="392" height="262" rx="10" fill="#e8eef7" stroke="#446688" stroke-width="1.6" filter="url(#rough)"/>
  <rect x="26" y="332" width="828" height="134" rx="10" fill="#fdf6dd" stroke="#b08d2e" stroke-width="1.6" filter="url(#rough)"/>
  <line x1="232" y1="176" x2="160" y2="128" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="160" y1="128" x2="128" y2="100" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="128" y1="100" x2="100" y2="74" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="232" y1="176" x2="300" y2="132" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="300" y1="132" x2="342" y2="108" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="232" y1="176" x2="150" y2="232" stroke="#8a8a8a" stroke-width="2"/>
  <line x1="232" y1="176" x2="318" y2="228" stroke="#8a8a8a" stroke-width="2"/>
  <circle cx="160" cy="128" r="5.4" fill="#dfe7d5" stroke="#7d8a72" stroke-width="1.3"/>
  <circle cx="128" cy="100" r="5.4" fill="#dfe7d5" stroke="#7d8a72" stroke-width="1.3"/>
  <circle cx="100" cy="74" r="5.4" fill="#dfe7d5" stroke="#7d8a72" stroke-width="1.3"/>
  <circle cx="300" cy="132" r="5.4" fill="#dfe7d5" stroke="#7d8a72" stroke-width="1.3"/>
  <circle cx="342" cy="108" r="5.4" fill="#dfe7d5" stroke="#7d8a72" stroke-width="1.3"/>
  <circle cx="150" cy="232" r="5.4" fill="#dfe7d5" stroke="#7d8a72" stroke-width="1.3"/>
  <circle cx="318" cy="228" r="5.4" fill="#dfe7d5" stroke="#7d8a72" stroke-width="1.3"/>
  <circle cx="232" cy="176" r="16.5" fill="#fff3cd" stroke="#b08d2e" stroke-width="1.6" filter="url(#rough)"/>
  <text x="232" y="181.4" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a5a12" filter="url(#rough)">m</text>
  <text x="96" y="148" text-anchor="start" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough)">s₁ = 3</text>
  <text x="330" y="156" text-anchor="start" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough)">s₂ = 2</text>
  <text x="118" y="258" text-anchor="start" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough)">s₃ = 1</text>
  <text x="320" y="258" text-anchor="start" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough)">s₄ = 1</text>
  <text x="232" y="292" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough)">删掉 m 后树分成 k 个连通分支（k = deg(m)）</text>
  <text x="480" y="86" text-anchor="start" font-size="13" font-weight="bold" fill="#173a5e" filter="url(#rough)">S = n − 1 = s₁ + … + s_k</text>
  <text x="480" y="120" text-anchor="start" font-size="13" fill="#173a5e" filter="url(#rough)">e₂ = Σ_{i&lt;j} sᵢsⱼ = (S² − Σsᵢ²) / 2</text>
  <text x="480" y="152" text-anchor="start" font-size="13" fill="#173a5e" filter="url(#rough)">e₃ = Σ_{i&lt;j&lt;l} sᵢsⱼsₗ</text>
  <text x="502" y="176" text-anchor="start" font-size="13" fill="#173a5e" filter="url(#rough)">= (S³ − 3S·Σsᵢ² + 2Σsᵢ³) / 6</text>
  <text x="480" y="214" text-anchor="start" font-size="13.5" font-weight="bold" fill="#a1372b" filter="url(#rough)">贡献(m) = e₂ + e₃</text>
  <text x="480" y="242" text-anchor="start" font-size="12.5" fill="#4a5c70" filter="url(#rough)">= 以 m 为三路交点的三元组数</text>
  <text x="480" y="270" text-anchor="start" font-size="12.5" fill="#4a5c70" filter="url(#rough)">若 aₘ 不是完全平方数，贡献记 0</text>
  <text x="480" y="298" text-anchor="start" font-size="12" fill="#4a5c70" filter="url(#rough)">（平方判定用整数 sqrt，O(1)）</text>
  <text x="40" y="362" text-anchor="start" font-size="12.5" fill="#5a4410" filter="url(#rough)">e₂ 覆盖「三元组里有一个就是 m」：另两点必须来自不同分支 → Σ_{i&lt;j} sᵢsⱼ</text>
  <text x="40" y="390" text-anchor="start" font-size="12.5" fill="#5a4410" filter="url(#rough)">e₃ 覆盖「三点都不是 m」：三点必须落在三个不同分支 → Σ_{i&lt;j&lt;l} sᵢsⱼsₗ</text>
  <text x="40" y="418" text-anchor="start" font-size="12.5" fill="#5a4410" filter="url(#rough)">两点同在一个分支时路径不经过 m，m 就不是中位数，因此必须跨分支取点。</text>
  <text x="40" y="446" text-anchor="start" font-size="12.5" font-weight="bold" fill="#7a3b12" filter="url(#rough)">每个三元组只有一个中位数，所以 Σ_m 贡献 = 好三元组总数，不重不漏。</text>
</svg>
