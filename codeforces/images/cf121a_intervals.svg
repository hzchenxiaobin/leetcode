<svg xmlns="http://www.w3.org/2000/svg" width="884" height="360" viewBox="0 0 884 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="121"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="884" height="360" fill="#fafafa"/>
  <text x="442" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">next(x) 在相邻幸运数之间是常数</text>
  <text x="442" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">next(x) = 最小的 ≥ x 的幸运数</text>
  <g filter="url(#rough2)"><rect x="90" y="162" width="110" height="56" rx="3" fill="#e8e8e8" fill-opacity="0.55" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="145" y="186" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">1..3</text>
  <text x="145" y="206" text-anchor="middle" font-size="10" fill="#3d6b2f" filter="url(#rough2)">next=4</text>
  <g filter="url(#rough2)"><rect x="208" y="162" width="110" height="56" rx="3" fill="#f6e3c4" fill-opacity="0.55" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="263" y="186" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="263" y="206" text-anchor="middle" font-size="10" fill="#3d6b2f" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><rect x="326" y="162" width="110" height="56" rx="3" fill="#e8e8e8" fill-opacity="0.55" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="381" y="186" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">5..7</text>
  <text x="381" y="206" text-anchor="middle" font-size="10" fill="#3d6b2f" filter="url(#rough2)">next=7</text>
  <g filter="url(#rough2)"><rect x="444" y="162" width="110" height="56" rx="3" fill="#f6e3c4" fill-opacity="0.55" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="499" y="186" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">8..43</text>
  <text x="499" y="206" text-anchor="middle" font-size="10" fill="#3d6b2f" filter="url(#rough2)">next=7</text>
  <g filter="url(#rough2)"><rect x="562" y="162" width="110" height="56" rx="3" fill="#e8e8e8" fill-opacity="0.55" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="617" y="186" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">44..46</text>
  <text x="617" y="206" text-anchor="middle" font-size="10" fill="#3d6b2f" filter="url(#rough2)">44</text>
  <g filter="url(#rough2)"><rect x="680" y="162" width="110" height="56" rx="3" fill="#f6e3c4" fill-opacity="0.55" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="735" y="186" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">47</text>
  <text x="735" y="206" text-anchor="middle" font-size="10" fill="#3d6b2f" filter="url(#rough2)">47</text>
  <text x="442" y="262" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">对每个幸运数 v，令 x ∈ (prev, v]：这些 x 的 next 都是 v</text>
  <text x="442" y="294" text-anchor="middle" font-size="12.5" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">答案 = Σ (区间与 (prev,v] 的交长) × v</text>
  <text x="442" y="330" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">幸运数只有 2+4+…+2¹⁰ = 2046 个，直接枚举</text>
</svg>
