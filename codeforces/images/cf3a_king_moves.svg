<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L6.5,3 L0,6 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L6.5,3 L0,6 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L6.5,3 L0,6 Z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="580" height="400" fill="#fafafa"/>
  <text x="290" y="34" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">一步之内王的 8 个落点与记号</text>
  <rect x="60" y="88" width="52" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="86" y="119" text-anchor="middle" font-size="15" fill="#4a7a3a" filter="url(#rough2)">LU</text>
  <rect x="112" y="88" width="52" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="138" y="119" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">U</text>
  <rect x="164" y="88" width="52" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="119" text-anchor="middle" font-size="15" fill="#4a7a3a" filter="url(#rough2)">RU</text>
  <rect x="60" y="140" width="52" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="86" y="171" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">L</text>
  <rect x="164" y="140" width="52" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="171" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">R</text>
  <rect x="60" y="192" width="52" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="86" y="223" text-anchor="middle" font-size="15" fill="#4a7a3a" filter="url(#rough2)">LD</text>
  <rect x="112" y="192" width="52" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="138" y="223" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">D</text>
  <rect x="164" y="192" width="52" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="223" text-anchor="middle" font-size="15" fill="#4a7a3a" filter="url(#rough2)">RD</text>
  <rect x="112" y="140" width="52" height="52" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="138" y="174" text-anchor="middle" font-size="18" fill="#b85450" filter="url(#rough2)">王</text>
  <text x="118" y="154" text-anchor="start" font-size="10" fill="#8a6d3b" filter="url(#rough2)">s</text>
  <path d="M60,266 L212,266" fill="none" stroke="#446688" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="60" y="286" text-anchor="start" font-size="11.5" fill="#666" filter="url(#rough2)">列增大（a → h）</text>
  <path d="M44,244 L44,92" fill="none" stroke="#446688" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="30" y="166" text-anchor="middle" font-size="11.5" fill="#666" transform="rotate(-90 30 166)" filter="url(#rough2)">行增大（1 → 8）</text>
  <rect x="248" y="88" width="300" height="170" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="264" y="112" text-anchor="start" font-size="13.5" fill="#4a7a3a" font-weight="600" filter="url(#rough2)">方向 = 坐标增量</text>
  <text x="264" y="140" text-anchor="start" font-size="12" fill="#333" filter="url(#rough2)">R：列 +1（向右）　L：列 −1</text>
  <text x="264" y="163" text-anchor="start" font-size="12" fill="#333" filter="url(#rough2)">U：行 +1（向上）　D：行 −1</text>
  <text x="264" y="186" text-anchor="start" font-size="12" fill="#333" filter="url(#rough2)">斜走 = 两个方向同时走一步</text>
  <text x="264" y="209" text-anchor="start" font-size="12" fill="#333" filter="url(#rough2)">先写横向字母，再写纵向字母</text>
  <text x="264" y="232" text-anchor="start" font-size="12" fill="#333" filter="url(#rough2)">例：右下 = RD，左上 = LU</text>
  <rect x="248" y="272" width="300" height="76" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="264" y="298" text-anchor="start" font-size="12.5" fill="#8a6d3b" filter="url(#rough2)">官方样例 a8 → h1</text>
  <text x="264" y="324" text-anchor="start" font-size="12.5" fill="#333" filter="url(#rough2)">dx = +7，dy = −7 ⇒ 7 × RD</text>
</svg>
