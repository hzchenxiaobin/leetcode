<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="91"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="340" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例：4 条边逐条加入</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">输出 0,0,1,3</text>
  <g filter="url(#rough2)"><circle cx="130" cy="110" r="13" fill="#f6e3c4" fill-opacity="0.9" stroke="#c9a86a" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><circle cx="220" cy="110" r="13" fill="#f6e3c4" fill-opacity="0.9" stroke="#c9a86a" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><circle cx="175" cy="200" r="13" fill="#f6e3c4" fill-opacity="0.9" stroke="#c9a86a" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><line x1="130" y1="110" x2="175" y2="200" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="175" y="238" text-anchor="middle" font-size="12.5" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">答案 0</text>
  <g filter="url(#rough2)"><circle cx="325" cy="110" r="13" fill="#f6e3c4" fill-opacity="0.9" stroke="#c9a86a" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><circle cx="415" cy="110" r="13" fill="#f6e3c4" fill-opacity="0.9" stroke="#c9a86a" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><circle cx="370" cy="200" r="13" fill="#f6e3c4" fill-opacity="0.9" stroke="#c9a86a" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><line x1="325" y1="110" x2="370" y2="200" stroke="#4a7a3a" stroke-width="2"/></g>
  <g filter="url(#rough2)"><line x1="415" y1="110" x2="370" y2="200" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="370" y="238" text-anchor="middle" font-size="12.5" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">答案 0</text>
  <g filter="url(#rough2)"><circle cx="520" cy="110" r="13" fill="#f6e3c4" fill-opacity="0.9" stroke="#c9a86a" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><circle cx="610" cy="110" r="13" fill="#f6e3c4" fill-opacity="0.9" stroke="#c9a86a" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><circle cx="565" cy="200" r="13" fill="#f6e3c4" fill-opacity="0.9" stroke="#c9a86a" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><line x1="520" y1="110" x2="565" y2="200" stroke="#4a7a3a" stroke-width="2"/></g>
  <g filter="url(#rough2)"><line x1="610" y1="110" x2="565" y2="200" stroke="#4a7a3a" stroke-width="2"/></g>
  <g filter="url(#rough2)"><line x1="520" y1="106" x2="610" y2="106" stroke="#4a7a3a" stroke-width="2"/></g>
  <g filter="url(#rough2)"><line x1="520" y1="114" x2="610" y2="114" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="565" y="238" text-anchor="middle" font-size="12.5" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">答案 1</text>
  <g filter="url(#rough2)"><circle cx="715" cy="110" r="13" fill="#f6e3c4" fill-opacity="0.9" stroke="#c9a86a" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><circle cx="805" cy="110" r="13" fill="#f6e3c4" fill-opacity="0.9" stroke="#c9a86a" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><circle cx="760" cy="200" r="13" fill="#f6e3c4" fill-opacity="0.9" stroke="#c9a86a" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><line x1="715" y1="110" x2="760" y2="200" stroke="#4a7a3a" stroke-width="2"/></g>
  <g filter="url(#rough2)"><line x1="805" y1="110" x2="760" y2="200" stroke="#4a7a3a" stroke-width="2"/></g>
  <g filter="url(#rough2)"><line x1="715" y1="106" x2="805" y2="106" stroke="#4a7a3a" stroke-width="2"/></g>
  <g filter="url(#rough2)"><line x1="715" y1="114" x2="805" y2="114" stroke="#4a7a3a" stroke-width="2"/></g>
  <g filter="url(#rough2)"><line x1="715" y1="106" x2="805" y2="106" stroke="#4a7a3a" stroke-width="2"/></g>
  <g filter="url(#rough2)"><line x1="715" y1="114" x2="805" y2="114" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="760" y="238" text-anchor="middle" font-size="12.5" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">答案 3</text>
  <text x="440" y="300" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">第 3 条边连起已在同一连通块的 1、2 → 出现一个三角形圈 → 2¹−1 = 1</text>
  <text x="440" y="324" text-anchor="middle" font-size="12" fill="#3d6b2f" filter="url(#rough2)">第 4 条边与第 3 条平行，又多一个圈维 → 2²−1 = 3</text>
</svg>
