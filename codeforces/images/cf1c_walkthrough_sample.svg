<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="800" height="500" fill="#fafafa"/>

  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例走查：弧 90°,90°,180° → step 90° → n = 4</text>
  <circle cx="168.5" cy="321.5" r="145.0" fill="#ffffff" stroke="#9aa7b4" stroke-width="1.6" stroke-dasharray="7 6" filter="url(#rough2)"/>
  <path d="M 66.0 424.0 L 271.0 219.0 L 66.0 219.0 L 66.0 424.0" stroke="#446688" stroke-width="2.6" fill="none" filter="url(#rough2)"/>
  <circle cx="168.5" cy="321.5" r="3" fill="#2b2b2b" filter="url(#rough2)"/>
  <text x="182.5" y="339.5" text-anchor="start" font-size="11" fill="#55606b" filter="url(#rough2)">O(0.5,0.5)</text>
  <path d="M 168.5 321.5 L 66.0 219.0" stroke="#d6a040" stroke-width="1.6" fill="none" stroke-dasharray="5 5" filter="url(#rough2)"/>
  <text x="114.5" y="287.5" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">R = √2/2</text>
  <circle cx="66.0" cy="424.0" r="5.5" fill="#fff" stroke="#2b2b2b" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="271.0" cy="219.0" r="5.5" fill="#fff" stroke="#2b2b2b" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="66.0" cy="219.0" r="5.5" fill="#fff" stroke="#2b2b2b" stroke-width="2" filter="url(#rough2)"/>
  <text x="64.0" y="444.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">A(0,0)</text>
  <text x="307.0" y="223.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">B(1,1)</text>
  <text x="56.0" y="207.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">C(0,1)</text>
  <rect x="452.0" y="92.0" width="60.0" height="38.0" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="482.0" y="115.2" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">n</text>
  <rect x="512.0" y="92.0" width="86.0" height="38.0" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="555.0" y="115.2" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">步长</text>
  <rect x="598.0" y="92.0" width="190.0" height="38.0" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="693.0" y="115.2" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">判定</text>
  <rect x="452.0" y="136.0" width="60.0" height="38.0" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="482.0" y="159.2" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">n = 3</text>
  <rect x="512.0" y="136.0" width="86.0" height="38.0" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="555.0" y="159.2" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">120°</text>
  <rect x="598.0" y="136.0" width="190.0" height="38.0" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="693.0" y="159.2" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗ 90° 不是倍数</text>
  <rect x="452.0" y="180.0" width="60.0" height="38.0" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="482.0" y="203.2" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">n = 4</text>
  <rect x="512.0" y="180.0" width="86.0" height="38.0" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="555.0" y="203.2" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">90°</text>
  <rect x="598.0" y="180.0" width="190.0" height="38.0" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="693.0" y="203.2" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓ 三条弧全吻合</text>
  <rect x="452.0" y="224.0" width="60.0" height="38.0" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="482.0" y="247.2" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">n = 5</text>
  <rect x="512.0" y="224.0" width="86.0" height="38.0" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="555.0" y="247.2" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">72°</text>
  <rect x="598.0" y="224.0" width="190.0" height="38.0" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="693.0" y="247.2" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗ 90° 不是倍数</text>
  <text x="620.0" y="76.0" text-anchor="middle" font-size="12" fill="#55606b" filter="url(#rough2)">升序枚举，第一个可行即最优</text>
  <rect x="482.8" y="342.3" width="214.5" height="59.4" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="590.0" y="363.2" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">n = 4 时 R² = 1/2</text>
  <text x="590.0" y="389.2" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">面积 = 4/2 · 1/2 · sin 90° = 1</text>
  <text x="590.0" y="424.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">与官方样例 1.00000000 一致</text>
</svg>
