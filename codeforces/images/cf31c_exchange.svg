<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="239"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="330" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">C：两个“为什么”——相邻检查足够、候选只有两个</text>
  <path d="M 120 42 Q 380 47 640 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <rect x="36" y="66" width="344" height="200" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="48" y="90" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">① 排序后只查相邻，为什么够？</text>
  <text x="48" y="116" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">按左端点排序得 l1 ≤ l2 ≤ … ≤ ln。</text>
  <text x="48" y="140" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">若每对相邻都满足 r(i) ≤ l(i+1)，</text>
  <text x="48" y="164" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">则对任意 i &lt; j：</text>
  <text x="48" y="190" font-size="11" fill="#2f5223" filter="url(#rough2)">r(i) ≤ l(i+1) ≤ l(j)</text>
  <text x="48" y="214" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">于是第 i 个完全在第 j 个左边，两两不重叠。</text>
  <text x="48" y="238" font-size="10" fill="#8c3a36" filter="url(#rough2)">反之，若某对不相邻区间重叠，</text>
  <text x="48" y="254" font-size="10" fill="#8c3a36" filter="url(#rough2)">中间必有一对相邻区间也重叠。</text>

  <rect x="396" y="66" width="328" height="200" rx="10" fill="#fdeceb" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="408" y="90" font-size="12" font-weight="bold" fill="#8c3a36" filter="url(#rough2)">② 为什么候选最多两个？</text>
  <text x="408" y="116" font-size="10.5" fill="#8c3a36" filter="url(#rough2)">设原始集合中存在一对冲突 (a,b)。</text>
  <text x="408" y="140" font-size="10.5" fill="#8c3a36" filter="url(#rough2)">只删一个区间后，a、b 必须至少有一个不在</text>
  <text x="408" y="164" font-size="10.5" fill="#8c3a36" filter="url(#rough2)">（否则它们仍然重叠）。</text>
  <text x="408" y="190" font-size="11" fill="#8c3a36" filter="url(#rough2)">⇒ 被删的只能是 a 或 b。</text>
  <text x="408" y="216" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">所以验证两个候选就够，总复杂度 O(n log n)。</text>
  <text x="408" y="242" font-size="10" fill="#777" filter="url(#rough2)">若原始集合本来无冲突，则所有 n 个编号都是答案。</text>

  <rect x="36" y="280" width="688" height="40" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="48" y="306" font-size="11" fill="#2f4a66" filter="url(#rough2)">两个候选分别验证：删掉后重新“按左端点扫描 + 相邻检查”，通过的就收进答案，最后把编号排升序输出。</text>
</svg>
