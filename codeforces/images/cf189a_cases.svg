<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="320" fill="#fafafa"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">189A 的两组样例与直觉</text>
  <path d="M 267.48 46 Q 380.0 52 492.52 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60.0" y="76.0" width="500.0" height="40.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="68.0" y="109.0" text-anchor="start" font-size="11.4" font-weight="bold" fill="#26405c" filter="url(#rough2)">n</text>
  <text x="158.0" y="109.0" text-anchor="start" font-size="11.4" font-weight="bold" fill="#26405c" filter="url(#rough2)">a b c</text>
  <text x="288.0" y="109.0" text-anchor="start" font-size="11.4" font-weight="bold" fill="#26405c" filter="url(#rough2)">最优切法</text>
  <text x="468.0" y="109.0" text-anchor="start" font-size="11.4" font-weight="bold" fill="#26405c" filter="url(#rough2)">答案</text>
  <path d="M 60.0 76.0 L 560.0 76.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="68.0" y="149.0" text-anchor="start" font-size="11.4" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <text x="158.0" y="149.0" text-anchor="start" font-size="11.4" fill="#2b2b2b" filter="url(#rough2)">5 3 2</text>
  <text x="288.0" y="149.0" text-anchor="start" font-size="11.4" fill="#2b2b2b" filter="url(#rough2)">3 + 2</text>
  <text x="468.0" y="149.0" text-anchor="start" font-size="11.4" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <path d="M 60.0 116.0 L 560.0 116.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="68.0" y="189.0" text-anchor="start" font-size="11.4" fill="#2b2b2b" filter="url(#rough2)">7</text>
  <text x="158.0" y="189.0" text-anchor="start" font-size="11.4" fill="#2b2b2b" filter="url(#rough2)">5 5 2</text>
  <text x="288.0" y="189.0" text-anchor="start" font-size="11.4" fill="#2b2b2b" filter="url(#rough2)">5 + 2</text>
  <text x="468.0" y="189.0" text-anchor="start" font-size="11.4" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <path d="M 60.0 156.0 L 560.0 156.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <rect x="60.0" y="230.0" width="660.0" height="64.0" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="254.0" text-anchor="start" font-size="11.1" fill="#8a6015" filter="url(#rough2)">为什么不能贪心“先尽量用最短的”？样例 2：n=7、可选 {5,2}，先用 2 会剩 5 ⇒ 2 段（2+5）也正好 2；</text>
  <text x="74.0" y="276.0" text-anchor="start" font-size="11.1" fill="#8a6015" filter="url(#rough2)">但如果顺序/组合不当（例如剩余长度拼不出）就必须回退 —— 所以用 DP 而不是贪心。</text>
  <text x="60.0" y="318.0" text-anchor="start" font-size="10.9" fill="#6b6b6b" filter="url(#rough2)">dp 的状态只有“前缀长度”，三种段长是常数，转移 O(1)。</text>
</svg>
