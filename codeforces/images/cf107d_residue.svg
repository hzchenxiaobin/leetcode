<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 336" width="640" height="336">
<defs>
<filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="13" result="noise"/>
<feDisplacementMap in="SourceGraphic" in2="noise" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect x="0" y="0" width="640" height="336" fill="#fafafa"/>
<g font-family="Comic Sans MS, Kaiti SC, cursive">
<text x="320.0" y="24.0" font-size="15" fill="#33475b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">状态 = 各罪名次数对「重数 lcm」的余数，总数 ≤ 123</text>
<circle cx="140.0" cy="110.0" r="26.0" fill="#f6d9b0" stroke="#a08050" stroke-width="1.8" filter="url(#rough2)"/>
<text x="140.0" y="116.0" font-size="14" fill="#7a5c2e" text-anchor="middle" font-weight="normal" filter="url(#rough2)">0</text>
<circle cx="250.0" cy="110.0" r="26.0" fill="#cfe3d4" stroke="#4f7f60" stroke-width="1.8" filter="url(#rough2)"/>
<text x="250.0" y="116.0" font-size="14" fill="#3f6b4f" text-anchor="middle" font-weight="normal" filter="url(#rough2)">1</text>
<line x1="168.0" y1="100.0" x2="222.0" y2="100.0" stroke="#7a93a8" stroke-width="2.0" filter="url(#rough2)"/>
<polygon points="222.0,100.0 213.0,95.5 213.0,104.5" fill="#7a93a8" filter="url(#rough2)"/>
<line x1="222.0" y1="122.0" x2="168.0" y2="122.0" stroke="#7a93a8" stroke-width="2.0" filter="url(#rough2)"/>
<polygon points="168.0,122.0 177.0,126.5 177.0,117.5" fill="#7a93a8" filter="url(#rough2)"/>
<text x="195.0" y="72.0" font-size="12" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">B 的次数 mod 2</text>
<circle cx="480.0" cy="50.0" r="22.0" fill="#d8d3ec" stroke="#6a5f9a" stroke-width="1.6" filter="url(#rough2)"/>
<text x="480.0" y="55.0" font-size="13" fill="#4a3f7a" text-anchor="middle" font-weight="normal" filter="url(#rough2)">0</text>
<circle cx="533.7" cy="143.0" r="22.0" fill="#d8d3ec" stroke="#6a5f9a" stroke-width="1.6" filter="url(#rough2)"/>
<text x="533.7" y="148.0" font-size="13" fill="#4a3f7a" text-anchor="middle" font-weight="normal" filter="url(#rough2)">1</text>
<circle cx="426.3" cy="143.0" r="22.0" fill="#d8d3ec" stroke="#6a5f9a" stroke-width="1.6" filter="url(#rough2)"/>
<text x="426.3" y="148.0" font-size="13" fill="#4a3f7a" text-anchor="middle" font-weight="normal" filter="url(#rough2)">2</text>
<text x="480.0" y="208.0" font-size="12" fill="#4a3f7a" text-anchor="middle" font-weight="normal" filter="url(#rough2)">C 的次数 mod 3</text>
<text x="320.0" y="236.0" font-size="13" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">每个条件的「次数 mod m == 0」只依赖余数 → 余数向量就是状态</text>
<rect x="120.0" y="258.0" width="400.0" height="62.0" rx="10" fill="#fdf3d8" stroke="#c9a25a" stroke-width="1.6" filter="url(#rough2)"/>
<text x="320.0" y="282.0" font-size="14" fill="#7a5c2e" text-anchor="middle" font-weight="normal" filter="url(#rough2)">状态数 = Π lcm_t ≤ Π 重数 ≤ 123</text>
<text x="320.0" y="304.0" font-size="11" fill="#7a5c2e" text-anchor="middle" font-weight="normal" filter="url(#rough2)">（样例 3：A 的重数 2,3 → lcm 6；B 的重数 2；共 12 个状态）</text>
</g>
</svg>
