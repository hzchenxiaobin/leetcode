<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>

  <rect width="720" height="470" fill="#fafafa"/>

  <text x="360" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按孩子块的顺序做 DFS，输出 2n−1 个顶点</text>
  <path d="M 120 40 Q 360 46 600 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 小树 -->
  <g stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)">
    <line x1="150" y1="78" x2="80" y2="140"/><line x1="150" y1="78" x2="220" y2="140"/>
    <line x1="80" y1="155" x2="40" y2="210"/><line x1="80" y1="155" x2="120" y2="210"/>
  </g>
  <g filter="url(#rough2)">
    <circle cx="150" cy="70" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="80" cy="148" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="220" cy="148" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="40" cy="218" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="120" cy="218" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <g font-size="11" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">
    <text x="150" y="74">1</text><text x="80" y="152">2</text><text x="220" y="152">3</text>
    <text x="40" y="222">4</text><text x="120" y="222">5</text>
  </g>

  <!-- 输出序列 -->
  <text x="300" y="72" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">叶子顺序 4 5 3 时的路线：</text>
  <text x="300" y="104" font-size="13" fill="#2b2b2b" filter="url(#rough2)">1  2  4  2  5  2  1  3  1</text>
  <text x="300" y="130" font-size="10.5" fill="#555" filter="url(#rough2)">进入孩子时输出孩子，回溯时输出父节点</text>
  <text x="300" y="152" font-size="10.5" fill="#2f5223" filter="url(#rough2)">长度 2n−1 = 9，每条边恰好上下各一次</text>

  <rect x="40" y="250" width="640" height="96" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <g font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">
    <text x="56" y="276">对每个节点，把它的孩子按“子树内最左叶子位置”升序排列；然后依次：输出孩子 → 递归 → 输出自己。</text>
    <text x="56" y="302">每条边恰好下降一次、上升一次，所以总步数 2(n−1)，顶点数 2n−1；叶子被访问的顺序正是排序后的顺序。</text>
    <text x="56" y="328">若任一子树的叶子位置不连续，排序也无济于事，直接输出 -1。</text>
  </g>

  <rect x="40" y="360" width="640" height="94" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <g font-size="11.5" fill="#2f5223" filter="url(#rough2)">
    <text x="56" y="386">叶子定义：除根以外度数为 1 的点。根即使度数为 1 也不算叶子，不进入给定序列。</text>
    <text x="56" y="412">只有一个叶子的树（一条从根到叶的链）是合法特例：序列只有一个数，路线就是去和回。</text>
    <text x="56" y="438">若根连着多个叶子，这些叶子的顺序可以任意交换，路线随之改变。</text>
  </g>
</svg>
