<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="720" height="430" fill="#fafafa"/>
  <text x="360.0" y="33" font-size="20" font-weight="bold" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">n = 6：三角数只覆盖 4 个位置</text>
  <path d="M 266 44 Q 360.0 50 454 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <circle cx="210" cy="235" r="118" fill="none" stroke="#c9d4e0" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="210.0" cy="117.0" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="210.0" y="122.0" font-size="14" font-weight="bold" fill="#22303f" text-anchor="middle" filter="url(#rough2)">0</text>
  <circle cx="312.19099764656374" cy="176.0" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="312.19099764656374" y="181.0" font-size="14" font-weight="bold" fill="#22303f" text-anchor="middle" filter="url(#rough2)">1</text>
  <circle cx="312.1909976465638" cy="294.0" r="20" fill="#fde8e8" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="312.1909976465638" y="299.0" font-size="14" font-weight="bold" fill="#22303f" text-anchor="middle" filter="url(#rough2)">2</text>
  <circle cx="210.0" cy="353.0" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="210.0" y="358.0" font-size="14" font-weight="bold" fill="#22303f" text-anchor="middle" filter="url(#rough2)">3</text>
  <circle cx="107.80900235343626" cy="294.00000000000006" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="107.80900235343626" y="299.00000000000006" font-size="14" font-weight="bold" fill="#22303f" text-anchor="middle" filter="url(#rough2)">4</text>
  <circle cx="107.80900235343624" cy="176.0" r="20" fill="#fde8e8" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="107.80900235343624" y="181.0" font-size="14" font-weight="bold" fill="#22303f" text-anchor="middle" filter="url(#rough2)">5</text>
  <text x="210" y="227" font-size="11.5" font-weight="bold" fill="#2f5223" text-anchor="middle" filter="url(#rough2)">实际到过：0, 1, 3, 4</text>
  <text x="210" y="245" font-size="11.5" font-weight="bold" fill="#b85450" text-anchor="middle" filter="url(#rough2)">缺 2 和 5</text>
  <text x="400" y="100" font-size="12.5" font-weight="bold" fill="#2b2b2b" text-anchor="start" filter="url(#rough2)">T_k = k(k+1)/2 mod 6</text>
  <rect x="400" y="122" width="74" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="437" y="140" font-size="10" font-weight="normal" fill="#666" text-anchor="middle" filter="url(#rough2)">k=0</text>
  <text x="437" y="158" font-size="15" font-weight="bold" fill="#22303f" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="490" y="122" width="74" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="527" y="140" font-size="10" font-weight="normal" fill="#666" text-anchor="middle" filter="url(#rough2)">k=1</text>
  <text x="527" y="158" font-size="15" font-weight="bold" fill="#22303f" text-anchor="middle" filter="url(#rough2)">1</text>
  <rect x="580" y="122" width="74" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="617" y="140" font-size="10" font-weight="normal" fill="#666" text-anchor="middle" filter="url(#rough2)">k=2</text>
  <text x="617" y="158" font-size="15" font-weight="bold" fill="#22303f" text-anchor="middle" filter="url(#rough2)">3</text>
  <rect x="400" y="188" width="74" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="437" y="206" font-size="10" font-weight="normal" fill="#666" text-anchor="middle" filter="url(#rough2)">k=3</text>
  <text x="437" y="224" font-size="15" font-weight="bold" fill="#22303f" text-anchor="middle" filter="url(#rough2)">0</text>
  <rect x="490" y="188" width="74" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="527" y="206" font-size="10" font-weight="normal" fill="#666" text-anchor="middle" filter="url(#rough2)">k=4</text>
  <text x="527" y="224" font-size="15" font-weight="bold" fill="#22303f" text-anchor="middle" filter="url(#rough2)">4</text>
  <rect x="580" y="188" width="74" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="617" y="206" font-size="10" font-weight="normal" fill="#666" text-anchor="middle" filter="url(#rough2)">k=5</text>
  <text x="617" y="224" font-size="15" font-weight="bold" fill="#22303f" text-anchor="middle" filter="url(#rough2)">3</text>
  <text x="400" y="300" font-size="11" font-weight="normal" fill="#555" text-anchor="start" filter="url(#rough2)">周期只有 6，之后只是重复</text>
  <text x="400" y="322" font-size="11" font-weight="normal" fill="#555" text-anchor="start" filter="url(#rough2)">0,1,3,0,4,3,3,4,0,3,1,0,…</text>
  <rect x="390" y="340" width="310" height="46" rx="8" fill="#fde8e8" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="545" y="368" font-size="13" font-weight="bold" fill="#7a3b36" text-anchor="middle" filter="url(#rough2)">永远到不了 2 和 5 → NO</text>
  <text x="360" y="412" font-size="10.5" font-weight="normal" fill="#666" text-anchor="middle" filter="url(#rough2)">只有 n 是 2 的幂时，T_0 … T_{n-1} 才恰好是全部剩余类</text>
</svg>
