<svg xmlns="http://www.w3.org/2000/svg" width="880" height="280" viewBox="0 0 880 280"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="280" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2：n=5, x=2, 终态 3 2 0 2 7</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">被清空的是 3 号盒（有 4 个球），反推得 2 1 4 1 6</text>
  <text x="150" y="110" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">终态：3 2 0 2 7（x=2 表示最后落在 2 号盒）</text>
  <text x="150" y="152" text-anchor="start" font-size="13" fill="#2f4a66" filter="url(#rough2)">取最少值 0 的盒子 i=3，c = R*n + s = 0*5 + 4 = 4</text>
  <text x="150" y="196" text-anchor="start" font-size="13" fill="#2f4a66" filter="url(#rough2)">B[3] = 4，其余减去各自拿到的球数</text>
  <text x="150" y="238" text-anchor="start" font-size="14" fill="#3d6b2f" filter="url(#rough2)">得到 2 1 4 1 6 ✓</text>
</svg>
