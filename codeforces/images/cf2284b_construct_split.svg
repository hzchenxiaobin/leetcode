<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">构造：最大的 k 个升序在前，其余降序在后</text>
  <text x="320" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">n = 6，k = 3 为例：a = [−30, −2, −1, 4, 9, 12]（已升序）</text>

  <g filter="url(#rough2)">
    <rect x="60" y="58" width="520" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
    <text x="320" y="76" text-anchor="middle" font-size="10.5" fill="#8a6a20">① 升序排序得 b[1..n]　② 取末尾 k 个记为 P（P 是最大的 k 个）</text>
    <text x="320" y="93" text-anchor="middle" font-size="10" fill="#9a8a60">③ 输出：P 内部升序，剩下 n−k 个降序　（绿=必愉快，蓝=按构造不愉快）</text>
  </g>

  <text x="444" y="118" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">P：最大的 k = 3 个，升序输出</text>

  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="80" y="124" width="72" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="116" y="152" fill="#3a4a66">−30</text>
    <rect x="162" y="124" width="72" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="198" y="152" fill="#3a4a66">−2</text>
    <rect x="244" y="124" width="72" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="280" y="152" fill="#3a4a66">−1</text>
    <rect x="326" y="124" width="72" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <text x="362" y="152" fill="#2f4f28" font-weight="bold">4</text>
    <rect x="408" y="124" width="72" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <text x="444" y="152" fill="#2f4f28" font-weight="bold">9</text>
    <rect x="490" y="124" width="72" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <text x="526" y="152" fill="#2f4f28" font-weight="bold">12</text>
  </g>

  <text x="198" y="184" text-anchor="middle" font-size="10" fill="#3a4a66" filter="url(#rough2)">剩余 n−k = 3 个，降序输出</text>

  <path d="M 200 192 L 200 214" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="214" y="207" font-size="9.5" fill="#666" filter="url(#rough2)">输出 = P 升序 + 剩余降序</text>

  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="80" y="218" width="72" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <text x="116" y="246" fill="#2f4f28" font-weight="bold">4</text>
    <rect x="162" y="218" width="72" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <text x="198" y="246" fill="#2f4f28" font-weight="bold">9</text>
    <rect x="244" y="218" width="72" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <text x="280" y="246" fill="#2f4f28" font-weight="bold">12</text>
    <rect x="326" y="218" width="72" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6"/>
    <text x="362" y="246" fill="#8a3a36">−1</text>
    <rect x="408" y="218" width="72" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6"/>
    <text x="444" y="246" fill="#8a3a36">−2</text>
    <rect x="490" y="218" width="72" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6"/>
    <text x="526" y="246" fill="#8a3a36">−30</text>
  </g>

  <g filter="url(#rough2)" font-size="14" font-weight="bold" text-anchor="middle">
    <text x="116" y="282" fill="#4a7a3a">✓</text>
    <text x="198" y="282" fill="#4a7a3a">✓</text>
    <text x="280" y="282" fill="#4a7a3a">✓</text>
    <text x="362" y="282" fill="#b85450">✗</text>
    <text x="444" y="282" fill="#b85450">✗</text>
    <text x="526" y="282" fill="#b85450">✗</text>
  </g>

  <text x="320" y="302" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">前 3 个的平均 = 25/3 ≈ 8.33 ＞ 剩余最大值 −1；此后平均值只会变小、但永远严格大于下一个数</text>

  <g filter="url(#rough2)">
    <rect x="60" y="312" width="520" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
    <text x="320" y="331" text-anchor="middle" font-size="11" fill="#2f4f28">恰好 k 个愉快：P 是升序，前缀和 ≤ (个数)·当前值 ⇒ 全 ✓</text>
    <text x="320" y="349" text-anchor="middle" font-size="10" fill="#3a5a30">剩余逐个加入时当前平均值始终 ＞ 下一个元素 ⇒ 全 ✗，且平均值单调下降不回头</text>
  </g>

  <text x="320" y="382" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">前提 k ≥ L：若 k &lt; L，剩余里仍留着 M，它们必然愉快，怎么排都凑不出 k → 只能 NO</text>
</svg>
