<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="400" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">跳变只有两类：分钟不进位 / 分钟回绕</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">时钟串 = H 的 LH 位定宽 + M 的 LM 位定宽，只数「同一位置上前后的字符不同」</text>
  <text x="40" y="108" text-anchor="start" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">① 不进位：M → M+1</text>
  <g filter="url(#rough2)"><rect x="250" y="88" width="32" height="34" rx="4" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.2"/></g>
  <text x="266.0" y="112" text-anchor="middle" font-size="17" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="286" y="88" width="32" height="34" rx="4" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.2"/></g>
  <text x="302.0" y="112" text-anchor="middle" font-size="17" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="330.96" y="113" text-anchor="middle" font-size="17" fill="#2b2b2b" filter="url(#rough2)">:</text>
  <g filter="url(#rough2)"><rect x="339.92" y="88" width="32" height="34" rx="4" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.2"/></g>
  <text x="355.92" y="112" text-anchor="middle" font-size="17" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="375.92" y="88" width="32" height="34" rx="4" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.2"/></g>
  <text x="391.92" y="112" text-anchor="middle" font-size="17" fill="#2b2b2b" filter="url(#rough2)">9</text>
  <g filter="url(#rough2)"><line x1="419.92" y1="105" x2="473.92" y2="105" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)"/></g>
  <text x="446.92" y="96" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">→</text>
  <g filter="url(#rough2)"><rect x="485.92" y="88" width="32" height="34" rx="4" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.2"/></g>
  <text x="501.92" y="112" text-anchor="middle" font-size="17" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="521.9200000000001" y="88" width="32" height="34" rx="4" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.2"/></g>
  <text x="537.9200000000001" y="112" text-anchor="middle" font-size="17" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="566.8800000000001" y="113" text-anchor="middle" font-size="17" fill="#2b2b2b" filter="url(#rough2)">:</text>
  <g filter="url(#rough2)"><rect x="575.84" y="88" width="32" height="34" rx="4" fill="#f3d9d6" fill-opacity="0.85" stroke="#8a2b28" stroke-width="1.6"/></g>
  <text x="591.84" y="112" text-anchor="middle" font-size="17" fill="#8a2b28" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><rect x="611.84" y="88" width="32" height="34" rx="4" fill="#f3d9d6" fill-opacity="0.85" stroke="#8a2b28" stroke-width="1.6"/></g>
  <text x="627.84" y="112" text-anchor="middle" font-size="17" fill="#8a2b28" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)"><rect x="700" y="86" width="150" height="34" rx="6" fill="#f3d9d6" fill-opacity="0.85" stroke="#8a2b28" stroke-width="1.4"/></g>
  <text x="775" y="108" text-anchor="middle" font-size="12" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">2 位同时变</text>
  <text x="40" y="148" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">规律：M 末尾有 j 个 9 时，正是「9→0」连退 j 位再进一位，变化位数 = 1 + j</text>
  <text x="40" y="170" text-anchor="start" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">所以这类跳变只与 M 有关：t9(M) ≥ k−1 即命中（与小时 H 无关）</text>
  <text x="40" y="240" text-anchor="start" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">② 回绕：M = m−1 → 0</text>
  <g filter="url(#rough2)"><rect x="250" y="220" width="32" height="34" rx="4" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.2"/></g>
  <text x="266.0" y="244" text-anchor="middle" font-size="17" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)"><rect x="286" y="220" width="32" height="34" rx="4" fill="#f3d9d6" fill-opacity="0.85" stroke="#8a2b28" stroke-width="1.6"/></g>
  <text x="302.0" y="244" text-anchor="middle" font-size="17" fill="#8a2b28" filter="url(#rough2)">4</text>
  <text x="330.96" y="245" text-anchor="middle" font-size="17" fill="#2b2b2b" filter="url(#rough2)">:</text>
  <g filter="url(#rough2)"><rect x="339.92" y="220" width="32" height="34" rx="4" fill="#f3d9d6" fill-opacity="0.85" stroke="#8a2b28" stroke-width="1.6"/></g>
  <text x="355.92" y="244" text-anchor="middle" font-size="17" fill="#8a2b28" filter="url(#rough2)">5</text>
  <g filter="url(#rough2)"><rect x="375.92" y="220" width="32" height="34" rx="4" fill="#f3d9d6" fill-opacity="0.85" stroke="#8a2b28" stroke-width="1.6"/></g>
  <text x="391.92" y="244" text-anchor="middle" font-size="17" fill="#8a2b28" filter="url(#rough2)">9</text>
  <g filter="url(#rough2)"><line x1="419.92" y1="237" x2="473.92" y2="237" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)"/></g>
  <text x="446.92" y="228" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">→</text>
  <g filter="url(#rough2)"><rect x="485.92" y="220" width="32" height="34" rx="4" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.2"/></g>
  <text x="501.92" y="244" text-anchor="middle" font-size="17" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)"><rect x="521.9200000000001" y="220" width="32" height="34" rx="4" fill="#f3d9d6" fill-opacity="0.85" stroke="#8a2b28" stroke-width="1.6"/></g>
  <text x="537.9200000000001" y="244" text-anchor="middle" font-size="17" fill="#8a2b28" filter="url(#rough2)">5</text>
  <text x="566.8800000000001" y="245" text-anchor="middle" font-size="17" fill="#2b2b2b" filter="url(#rough2)">:</text>
  <g filter="url(#rough2)"><rect x="575.84" y="220" width="32" height="34" rx="4" fill="#f3d9d6" fill-opacity="0.85" stroke="#8a2b28" stroke-width="1.6"/></g>
  <text x="591.84" y="244" text-anchor="middle" font-size="17" fill="#8a2b28" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)"><rect x="611.84" y="220" width="32" height="34" rx="4" fill="#f3d9d6" fill-opacity="0.85" stroke="#8a2b28" stroke-width="1.6"/></g>
  <text x="627.84" y="244" text-anchor="middle" font-size="17" fill="#8a2b28" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)"><rect x="700" y="218" width="150" height="34" rx="6" fill="#f3d9d6" fill-opacity="0.85" stroke="#8a2b28" stroke-width="1.4"/></g>
  <text x="775" y="240" text-anchor="middle" font-size="12" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">3 位同时变</text>
  <text x="40" y="280" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">分钟位全清零：变化 nz(m−1) 位；小时位 H → H+1：变化 1 + t9(H) 位</text>
  <text x="40" y="302" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">若 H 也是 h−1（跨天 23:59 → 00:00），小时位变化 nz(h−1) 位</text>
  <text x="450" y="344" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">nz(x) = 定宽表示里非零数字的个数（59 → 2，09 → 1，99 → 2）</text>
  <text x="450" y="370" text-anchor="middle" font-size="12" fill="#b06a1e" filter="url(#rough2)">每个整小时贡献 = within(0, m−1) + [ nz(m−1) + hourChange(H) ≥ k ]</text>
</svg>
