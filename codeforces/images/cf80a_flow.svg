<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="103"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="320" fill="#fafafa"/>
  <text x="360.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">判定流程</text>
  <path d="M 129.6 42 Q 360.0 48 590.4 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="360.0" y="304" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">循环最多检查 50 个数，常数时间</text>
  <rect x="40" y="70" width="160" height="52" rx="7" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="101" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">读入 n, m</text>
  <rect x="250" y="70" width="170" height="52" rx="7" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="335" y="101" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">x = n + 1</text>
  <rect x="470" y="70" width="200" height="52" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="570" y="94" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">x 是质数？</text>
  <text x="570" y="112" text-anchor="middle" font-size="10.5" fill="#8a6015" filter="url(#rough2)">（试除到 √x）</text>
  <path d="M 200 96 L 246 96" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <path d="M 420 96 L 466 96" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <path d="M 570 122 L 570 160 L 335 160 L 335 176" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="470" y="150" text-anchor="middle" font-size="12" fill="#8c2f2c" filter="url(#rough2)">否：x = x + 1</text>
  <rect x="230" y="180" width="210" height="50" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="335" y="210" text-anchor="middle" font-size="13" fill="#2f5223" filter="url(#rough2)">x 与 m 相等？</text>
  <path d="M 545 96 L 600 96 L 600 176" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="628" y="100" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">是</text>
  <path d="M 440 205 L 500 205" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <rect x="504" y="182" width="120" height="46" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="564" y="210" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5223" filter="url(#rough2)">YES</text>
  <path d="M 230 205 L 170 205" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <rect x="40" y="182" width="120" height="46" rx="7" fill="#fbeeee" stroke="#a05a5a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="100" y="210" text-anchor="middle" font-size="14" font-weight="bold" fill="#6b3030" filter="url(#rough2)">NO</text>
  <text x="220" y="250" text-anchor="middle" font-size="11.5" fill="#8c2f2c" filter="url(#rough2)">不等 → NO</text>
  <text x="130" y="250" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">相等 → YES</text>
  <rect x="60" y="268" width="600" height="34" rx="8" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="360" y="290" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">1 不是质数、m 不必是质数：只比较"下一个质数"即可</text>
</svg>
