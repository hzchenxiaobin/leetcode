<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="455"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8a2b28"/>
    </marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="400" fill="#fafafa"/>
  <text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">环上维护"未学过位置"的有序集合：查循环序的下一个未学过的点</text>
  <path d="M 60 38 Q 380 46 700 38" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <circle cx="240" cy="205" r="118" fill="none" stroke="#b9c9da" stroke-width="1.2" stroke-dasharray="5 5" filter="url(#rough2)"/>
  <path d="M 240 82 A 118 118 0 0 1 358 205" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 358 205 A 118 118 0 0 1 240 323" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 240 323 A 118 118 0 0 1 122 205" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 122 205 A 118 118 0 0 1 240 82" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <circle cx="240" cy="87" r="19" fill="#f6d5d5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="240" y="92" text-anchor="middle" font-size="10" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <circle cx="323" cy="122" r="19" fill="#f6d5d5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="323" y="127" text-anchor="middle" font-size="10" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <circle cx="358" cy="205" r="19" fill="#d9ecd4" stroke="#8a2b28" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="358" y="210" text-anchor="middle" font-size="10" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <circle cx="323" cy="288" r="19" fill="#f6d5d5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="323" y="293" text-anchor="middle" font-size="10" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <circle cx="240" cy="323" r="19" fill="#f6d5d5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="240" y="328" text-anchor="middle" font-size="10" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <circle cx="157" cy="288" r="19" fill="#d9ecd4" stroke="#8a2b28" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="157" y="293" text-anchor="middle" font-size="10" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <circle cx="122" cy="205" r="19" fill="#f6d5d5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="122" y="210" text-anchor="middle" font-size="10" fill="#2b2b2b" filter="url(#rough2)">6</text>
  <circle cx="157" cy="122" r="19" fill="#f6d5d5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="157" y="127" text-anchor="middle" font-size="10" fill="#2b2b2b" filter="url(#rough2)">7</text>

  <path d="M 323 137 Q 350 170 356 186" fill="none" stroke="#8a2b28" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="330" y="163" font-size="10" fill="#8a2b28" filter="url(#rough2)">从 1 出发，d = 1</text>
  <path d="M 140 200 Q 100 250 152 282" fill="none" stroke="#8a2b28" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="34" y="252" font-size="10" fill="#8a2b28" filter="url(#rough2)">从 6 出发：lower_bound</text>
  <text x="34" y="266" font-size="10" fill="#8a2b28" filter="url(#rough2)">找不到，绕回 2，d = 4</text>

  <rect x="420" y="60" width="310" height="104" rx="10" fill="#d9ecd4" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="434" y="82" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">数据结构</text>
  <text x="434" y="103" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">每个环一个 set，存尚未学过的位置编号；</text>
  <text x="434" y="122" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">查询 p 的循环后继：lower_bound(p)，</text>
  <text x="434" y="141" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">越界则取 begin()（绕回一圈）。</text>

  <rect x="420" y="180" width="310" height="104" rx="10" fill="#fbe3c8" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="434" y="202" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">环内距离</text>
  <text x="434" y="223" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">d = (q − p + len) mod len；</text>
  <text x="434" y="242" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">d ≥ rem 说明窗口内没有新点，结束；</text>
  <text x="434" y="261" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">否则计数、从 set 删除、rem −= d + 1。</text>

  <rect x="420" y="300" width="310" height="82" rx="10" fill="#cfe0f5" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="434" y="322" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">复杂度</text>
  <text x="434" y="343" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">每个环上点只被删除一次，全天 O((n + m) log n)；</text>
  <text x="434" y="362" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">set 为空即整圈都学过，直接结束。</text>

  <text x="34" y="382" font-size="10.5" fill="#555555" filter="url(#rough2)">灰色 = 已学过；绿色 = 未学过。环上的点不会走回树里，所以只需在环内循环查询。</text>
</svg>
