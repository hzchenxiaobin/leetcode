<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="513"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">198E：每个抓取器是 (质量, 距离) 平面上的一个矩形覆盖</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <line x1="110.0" y1="330.0" x2="590.0" y2="330.0" stroke="#888888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="110.0" y1="330.0" x2="110.0" y2="110.0" stroke="#888888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="580.0" y="354.0" text-anchor="end" font-size="10.5" fill="#666" filter="url(#rough2)">距离 →</text>
  <text x="100.0" y="104.0" text-anchor="start" font-size="10.5" fill="#666" filter="url(#rough2)">质量</text>
  <rect x="110.0" y="240.0" width="200.0" height="90.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="210.0" y="285.0" text-anchor="middle" font-size="11" fill="#8a6015" font-weight="bold" filter="url(#rough2)">初始 (p,r)</text>
  <rect x="230.0" y="170.0" width="220.0" height="160.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="342.0" y="250.0" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">拾到的新抓取器</text>
  <circle cx="170.0" cy="290.0" r="6.0" fill="#fde8e8" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="270.0" cy="210.0" r="6.0" fill="#fde8e8" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="410.0" cy="290.0" r="6.0" fill="#eeeeee" stroke="#999999" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="60.0" y="356.0" width="600.0" height="50.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="74.0" y="379.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">点在任一矩形内 → 可收集；收集后并集扩大（BFS）</text>
</svg>
