<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="380" fill="#fafafa"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">E1（无噪声、轴对齐）：用外接矩形的填充率区分圆与正方形</text>
  <path d="M 125.70000000000013 46 Q 380.0 52 634.2999999999998 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="90.0" y="80.0" width="140.0" height="140.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="160.0" y="156.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">正方形</text>
  <text x="160.0" y="240.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#26405c" filter="url(#rough2)">填充率 ≈ 1.00</text>
  <path d="M 76 80 L 76 220 M 70 80 L 82 80 M 70 220 L 82 220" stroke="#6b6b6b" stroke-width="1.0" fill="none" filter="url(#rough2)"/>
  <circle cx="340.0" cy="150.0" r="70.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="270.0" y="80.0" width="140.0" height="140.0" fill="none" stroke="#6b6b6b" stroke-width="1.0" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="340.0" y="156.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">圆</text>
  <text x="340.0" y="240.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#26405c" filter="url(#rough2)">填充率 ≈ π/4 ≈ 0.785</text>
  <rect x="470.0" y="80.0" width="250.0" height="140.0" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="486.0" y="108.0" text-anchor="start" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">判据：fill = A / (w·h)</text>
  <text x="486.0" y="134.0" text-anchor="start" font-size="11.4" fill="#2b2b2b" filter="url(#rough2)">fill &gt; 0.89 → 正方形</text>
  <text x="486.0" y="156.0" text-anchor="start" font-size="11.4" fill="#2b2b2b" filter="url(#rough2)">否则 → 圆</text>
  <text x="486.0" y="182.0" text-anchor="start" font-size="10.8" fill="#6b6b6b" filter="url(#rough2)">（只对轴对齐成立：</text>
  <text x="486.0" y="200.0" text-anchor="start" font-size="10.8" fill="#6b6b6b" filter="url(#rough2)">  旋转后外接矩形会变大）</text>
  <rect x="70.0" y="288.0" width="640.0" height="60.0" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="84.0" y="312.0" text-anchor="start" font-size="11.4" fill="#2f5b34" filter="url(#rough2)">8 连通找黑块 → 面积 A 与外接矩形 w×h → 比值分类；</text>
  <text x="84.0" y="332.0" text-anchor="start" font-size="11.4" fill="#2f5b34" filter="url(#rough2)">图形边长 ≥ 15 像素、彼此相距 ≥ 10 像素，保证连通块不会粘连。</text>
</svg>
