<svg xmlns="http://www.w3.org/2000/svg" width="700" height="440" viewBox="0 0 700 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4"/>
    </filter>
  </defs>

  <rect width="700" height="440" fill="#fafafa"/>

  <text x="350" y="30" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例走查：a = 1 3 8 12 18 25 30，b = 2 15 28</text>
  <text x="350" y="52" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#rough2)">n = 7 ≥ 2m = 6 通过长度关，再逐 k 检查上下两条不等式（k 从 0 开始）</text>

  <!-- 表头 -->
  <rect x="37" y="80" width="625" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="67" y="104" text-anchor="middle" font-size="11" fill="#33517a" filter="url(#rough2)">k</text>
  <text x="142" y="104" text-anchor="middle" font-size="11" fill="#33517a" filter="url(#rough2)">b[k]</text>
  <text x="232" y="104" text-anchor="middle" font-size="11" fill="#33517a" filter="url(#rough2)">a[k]</text>
  <text x="327" y="104" text-anchor="middle" font-size="11" fill="#33517a" filter="url(#rough2)">a[n−m+k]</text>
  <text x="424" y="104" text-anchor="middle" font-size="11" fill="#33517a" filter="url(#rough2)">a[k] &lt; b[k]</text>
  <text x="527" y="104" text-anchor="middle" font-size="11" fill="#33517a" filter="url(#rough2)">b[k] &lt; a[n−m+k]</text>
  <text x="622" y="104" text-anchor="middle" font-size="11" fill="#33517a" filter="url(#rough2)">结论</text>

  <!-- 第 0 行 -->
  <rect x="37" y="118" width="625" height="46" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="67" y="147" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="142" y="147" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5410" filter="url(#rough2)">2</text>
  <text x="232" y="147" text-anchor="middle" font-size="13" fill="#2e6e2e" filter="url(#rough2)">1</text>
  <text x="327" y="147" text-anchor="middle" font-size="13" fill="#33517a" filter="url(#rough2)">18</text>
  <text x="424" y="147" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">1 &lt; 2 ✓</text>
  <text x="527" y="147" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">2 &lt; 18 ✓</text>
  <text x="622" y="147" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">通过</text>

  <!-- 第 1 行 -->
  <rect x="37" y="164" width="625" height="46" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="67" y="193" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="142" y="193" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5410" filter="url(#rough2)">15</text>
  <text x="232" y="193" text-anchor="middle" font-size="13" fill="#2e6e2e" filter="url(#rough2)">3</text>
  <text x="327" y="193" text-anchor="middle" font-size="13" fill="#33517a" filter="url(#rough2)">25</text>
  <text x="424" y="193" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">3 &lt; 15 ✓</text>
  <text x="527" y="193" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">15 &lt; 25 ✓</text>
  <text x="622" y="193" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">通过</text>

  <!-- 第 2 行 -->
  <rect x="37" y="210" width="625" height="46" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="67" y="239" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="142" y="239" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5410" filter="url(#rough2)">28</text>
  <text x="232" y="239" text-anchor="middle" font-size="13" fill="#2e6e2e" filter="url(#rough2)">8</text>
  <text x="327" y="239" text-anchor="middle" font-size="13" fill="#33517a" filter="url(#rough2)">30</text>
  <text x="424" y="239" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">8 &lt; 28 ✓</text>
  <text x="527" y="239" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">28 &lt; 30 ✓</text>
  <text x="622" y="239" text-anchor="middle" font-size="11.5" fill="#2e6e2e" filter="url(#rough2)">通过</text>

  <!-- 竖线 -->
  <path d="M97 80 L97 256" stroke="#cfd8e3" stroke-width="1.1" filter="url(#rough2)"/>
  <path d="M187 80 L187 256" stroke="#cfd8e3" stroke-width="1.1" filter="url(#rough2)"/>
  <path d="M277 80 L277 256" stroke="#cfd8e3" stroke-width="1.1" filter="url(#rough2)"/>
  <path d="M377 80 L377 256" stroke="#cfd8e3" stroke-width="1.1" filter="url(#rough2)"/>
  <path d="M472 80 L472 256" stroke="#cfd8e3" stroke-width="1.1" filter="url(#rough2)"/>
  <path d="M582 80 L582 256" stroke="#cfd8e3" stroke-width="1.1" filter="url(#rough2)"/>

  <!-- 反例 -->
  <rect x="37" y="276" width="625" height="140" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="56" y="302" font-size="12.5" font-weight="bold" fill="#8e3b38" filter="url(#rough2)">反例（样例 8）：a = 1 2 3 100，b = 4 5 — 长度够，但上界不够</text>
  <text x="56" y="328" font-size="12" fill="#8e3b38" filter="url(#rough2)">n = 4 ≥ 2m = 4 ✓；k = 0：a[0] = 1 &lt; 4 ✓，但 a[n−m+0] = a[2] = 3 &gt; 4 ✗</text>
  <text x="56" y="352" font-size="12" fill="#8e3b38" filter="url(#rough2)">意思是「比 4 大的 a」只有 100 一个，可它得留给 5，4 拿不到上界 → 输出 NO，与官方一致。</text>
  <text x="56" y="376" font-size="12" fill="#8e3b38" filter="url(#rough2)">另一类失败更直接（样例 2）：n = 3 &lt; 2m = 4，每组连 2 个元素都凑不出，第一步就 NO。</text>
  <text x="56" y="400" font-size="11.5" fill="#a0524f" filter="url(#rough2)">注意两条不等式必须同时成立：某一侧缺元素，对应的 b 就永远造不出来。</text>
</svg>
