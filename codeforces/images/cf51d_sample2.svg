<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr4" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="340" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2 走查：−8  −16  24  −32，删掉 24 后公比为 2</text>
  <path d="M 130 40 Q 360 46 590 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 原始序列 -->
  <text x="30" y="76" font-size="12" font-weight="bold" fill="#2b4a68" filter="url(#rough2)">原序列</text>
  <g filter="url(#rough2)">
    <rect x="100" y="58" width="90" height="34" rx="5" fill="#eef3f8" stroke="#446688" stroke-width="1.5"/>
    <rect x="200" y="58" width="90" height="34" rx="5" fill="#eef3f8" stroke="#446688" stroke-width="1.5"/>
    <rect x="300" y="58" width="90" height="34" rx="5" fill="#fdf0ef" stroke="#b85450" stroke-width="2"/>
    <rect x="400" y="58" width="90" height="34" rx="5" fill="#eef3f8" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="145" y="81" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">−8</text>
  <text x="245" y="81" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">−16</text>
  <text x="345" y="81" text-anchor="middle" font-size="14" font-weight="bold" fill="#8c3a37" filter="url(#rough2)">24</text>
  <text x="445" y="81" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">−32</text>
  <text x="520" y="81" font-size="11.5" fill="#8c3a37" filter="url(#rough2)">×2 后应得 −32，却是 24 → 不是等比</text>

  <!-- 三条候选 -->
  <text x="30" y="132" font-size="12" font-weight="bold" fill="#2b4a68" filter="url(#rough2)">删 1 号</text>
  <text x="128" y="132" font-size="13" fill="#2b2b2b" filter="url(#rough2)">−16  24  −32</text>
  <text x="300" y="132" font-size="12" fill="#8c3a37" filter="url(#rough2)">公比 −3/2，第二项应为 −36 ≠ −32 ✗</text>

  <text x="30" y="170" font-size="12" font-weight="bold" fill="#2b4a68" filter="url(#rough2)">删 2 号</text>
  <text x="128" y="170" font-size="13" fill="#2b2b2b" filter="url(#rough2)">−8  24  −32</text>
  <text x="300" y="170" font-size="12" fill="#8c3a37" filter="url(#rough2)">公比 −3，第三项应为 −72 ≠ −32 ✗</text>

  <text x="30" y="208" font-size="12" font-weight="bold" fill="#2b4a68" filter="url(#rough2)">删 3 号</text>
  <text x="128" y="208" font-size="13" fill="#2b2b2b" filter="url(#rough2)">−8  −16  −32</text>
  <text x="300" y="208" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">公比 2，−8 → −16 → −32 全部吻合 ✓</text>

  <path d="M 345 96 L 345 118" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr4)" filter="url(#rough2)"/>

  <!-- 底部结论 -->
  <rect x="40" y="236" width="640" height="80" rx="8" fill="#f4f8ee" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="260" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">再看样例 3：0  1  2  3</text>
  <text x="56" y="282" font-size="12" fill="#3c5e2e" filter="url(#rough2)">首项为 0 ⇒ 等比数列只能是全零；删掉任意一个元素仍剩两个非零项，</text>
  <text x="56" y="303" font-size="12" fill="#3c5e2e" filter="url(#rough2)">无论删谁都救不回来，所以输出 2。</text>
</svg>
