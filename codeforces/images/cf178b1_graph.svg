<svg xmlns="http://www.w3.org/2000/svg" width="720" height="490" viewBox="0 0 720 490"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="21"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="490" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例图：粗红边是桥，商人 1→5 要经过两座桥</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <line x1="320.0" y1="290.0" x2="470.0" y2="250.0" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="470.0" y1="250.0" x2="610.0" y2="170.0" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="610.0" y1="170.0" x2="480.0" y2="110.0" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="320.0" y1="290.0" x2="610.0" y2="170.0" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="470.0" y1="250.0" x2="480.0" y2="110.0" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="70.0" y1="150.0" x2="170.0" y2="240.0" stroke="#b85450" stroke-width="3.4" filter="url(#rough2)"/>
  <line x1="170.0" y1="240.0" x2="320.0" y2="290.0" stroke="#b85450" stroke-width="3.4" filter="url(#rough2)"/>
  <line x1="610.0" y1="170.0" x2="680.0" y2="70.0" stroke="#b85450" stroke-width="3.4" filter="url(#rough2)"/>
  <circle cx="70.0" cy="150.0" r="19.0" fill="#eeeeee" stroke="#777777" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="70.0" y="154.7" text-anchor="middle" font-size="13" fill="#777777" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="170.0" cy="240.0" r="19.0" fill="#eeeeee" stroke="#777777" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="170.0" y="244.7" text-anchor="middle" font-size="13" fill="#777777" font-weight="bold" filter="url(#rough2)">2</text>
  <circle cx="320.0" cy="290.0" r="19.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="320.0" y="294.7" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <circle cx="470.0" cy="250.0" r="19.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="470.0" y="254.7" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>
  <circle cx="610.0" cy="170.0" r="19.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="610.0" y="174.7" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">5</text>
  <circle cx="680.0" cy="70.0" r="19.0" fill="#eeeeee" stroke="#777777" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="680.0" y="74.7" text-anchor="middle" font-size="13" fill="#777777" font-weight="bold" filter="url(#rough2)">6</text>
  <circle cx="480.0" cy="110.0" r="19.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="480.0" y="114.7" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="70.0" y="116.0" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">仓库</text>
  <text x="610.0" y="136.0" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">商店</text>
  <path d="M 70 174 Q 200 330 470 274" fill="none" stroke="#8a6015" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="250.0" y="350.0" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">路径 1→2→3→…→5</text>
  <line x1="60.0" y1="384.0" x2="100.0" y2="384.0" stroke="#b85450" stroke-width="3.4" filter="url(#rough2)"/>
  <text x="110.0" y="389.0" text-anchor="start" font-size="12" fill="#b85450" filter="url(#rough2)">桥：删掉它，图就不连通</text>
  <line x1="330.0" y1="384.0" x2="370.0" y2="384.0" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="380.0" y="389.0" text-anchor="start" font-size="12" fill="#446688" filter="url(#rough2)">非桥：在环上，删掉不影响连通</text>
  <rect x="40.0" y="408.0" width="640.0" height="66.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="54.0" y="432.5" text-anchor="start" font-size="12.5" fill="#3f3420" filter="url(#rough2)">商人 1→5：只有桥 (1,2)、(2,3) 删掉会断开，所以 d = 2</text>
</svg>
