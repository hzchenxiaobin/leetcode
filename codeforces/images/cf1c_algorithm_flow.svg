<svg xmlns="http://www.w3.org/2000/svg" width="760" height="650" viewBox="0 0 760 650"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="760" height="650" fill="#fafafa"/>

  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：精确整数几何 + 枚举最小边数</text>
  <polygon points="320,413.0 425.0,448 320,483.0 215.0,448" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320.0" y="444.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">每条弧 ≈ k · step</text>
  <text x="320.0" y="462.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">且 Σk = n ?</text>
  <rect x="193.8" y="58.2" width="252.4" height="55.5" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320.0" y="80.0" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">读入三行坐标 x y</text>
  <text x="320.0" y="101.0" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">放大成整数 X = x·10⁶ , Y = y·10⁶</text>
  <rect x="213.0" y="142.2" width="213.9" height="55.5" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320.0" y="164.1" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">三边平方 a² b² c² 与叉积 2S</text>
  <text x="320.0" y="185.1" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">全部用 __int128 精确算出</text>
  <rect x="204.6" y="230.2" width="230.8" height="55.5" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320.0" y="252.1" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">内角 = atan2(4S , b²+c²−a²)</text>
  <text x="320.0" y="273.1" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">弧 = 2 × 内角，三条弧和恰为 2π</text>
  <rect x="227.3" y="314.2" width="185.3" height="55.5" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320.0" y="336.1" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">n = 3, 4, …, 100（升序）</text>
  <text x="320.0" y="357.1" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">step = 2π / n</text>
  <rect x="532.0" y="315.3" width="160.0" height="53.4" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="612.0" y="336.2" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是：记下这个 n</text>
  <text x="612.0" y="356.2" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">即最少边数（最小面积）</text>
  <rect x="45.5" y="529.3" width="209.0" height="53.4" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150.0" y="550.2" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">R² = a²b²c² / (4·(2S)²)</text>
  <text x="150.0" y="570.2" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">面积 = n/2 · R² · sin(2π/n)</text>
  <rect x="537.0" y="529.3" width="149.9" height="53.4" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="612.0" y="550.2" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">输出 10 位小数</text>
  <text x="612.0" y="570.2" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">（满足 6 位精度要求）</text>
  <path d="M 320.0 113.8 L 320.0 142.2" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 320.0 197.8 L 320.0 230.2" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 320.0 285.8 L 320.0 314.2" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 320.0 369.8 L 320.0 413.0" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 425.0 448.0 L 532.0 448.0" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="452.0" y="436.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 215.0 448.0 C 96 448.0 96 342 225.3 342" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="150.0" y="436.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">否：n ← n + 1</text>
  <path d="M 612.0 368.7 L 612.0 529.3" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="700.0" y="452.0" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">已知 n 算面积</text>
  <path d="M 537.0 556.0 L 254.5 556.0" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 45.5 556.0 L 150.0 430.0" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="150.0" y="604.0" text-anchor="middle" font-size="11" fill="#7a8794" filter="url(#rough2)">3..100 全不可行 → 兜底取残差最小的 n</text>
</svg>
