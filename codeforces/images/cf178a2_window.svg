<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="440" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">固定 i：右端 R=n-i 不动，只有左端 L=k+1-i 在走</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="60.0" y="140.0" width="62.0" height="46.0" fill="#ffffff" stroke="#cccccc" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="91.0" y="162.0" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">N=1</text>
  <text x="91.0" y="180.0" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">pc=1</text>
  <rect x="134.0" y="140.0" width="62.0" height="46.0" fill="#ffffff" stroke="#cccccc" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="165.0" y="162.0" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">N=2</text>
  <text x="165.0" y="180.0" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">pc=1</text>
  <rect x="208.0" y="140.0" width="62.0" height="46.0" fill="#ffffff" stroke="#cccccc" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="239.0" y="162.0" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">N=3</text>
  <text x="239.0" y="180.0" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">pc=2</text>
  <rect x="282.0" y="140.0" width="62.0" height="46.0" fill="#ffffff" stroke="#cccccc" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="313.0" y="162.0" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">N=4</text>
  <text x="313.0" y="180.0" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">pc=1</text>
  <rect x="356.0" y="140.0" width="62.0" height="46.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="387.0" y="162.0" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">N=5</text>
  <text x="387.0" y="180.0" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">pc=2</text>
  <rect x="430.0" y="140.0" width="62.0" height="46.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="461.0" y="162.0" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">N=6</text>
  <text x="461.0" y="180.0" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">pc=2</text>
  <rect x="504.0" y="140.0" width="62.0" height="46.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="535.0" y="162.0" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">N=7</text>
  <text x="535.0" y="180.0" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">pc=3</text>
  <rect x="578.0" y="140.0" width="62.0" height="46.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="609.0" y="162.0" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">N=8</text>
  <text x="609.0" y="180.0" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">pc=1</text>
  <text x="60.0" y="126.0" text-anchor="start" font-size="12.5" fill="#555" filter="url(#rough2)">N = 1 .. 8 的 popcount（样例 2, n=8, i=1, R=7）</text>
  <line x1="356.0" y1="196.0" x2="566.0" y2="196.0" stroke="#8a6015" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="461.0" y="218.0" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">k=5 时 L=5：后缀最小 = 2</text>
  <line x1="430.0" y1="236.0" x2="566.0" y2="236.0" stroke="#6b4c9a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="498.0" y="258.0" text-anchor="middle" font-size="12" fill="#6b4c9a" filter="url(#rough2)">k=6 时 L=6：后缀最小 = 2</text>
  <rect x="40.0" y="300.0" width="640.0" height="108.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="54.0" y="324.5" text-anchor="start" font-size="12.5" fill="#3f3420" filter="url(#rough2)">suf[N] = min(popcount(N), suf[N+1])，从 R 往 1 递推</text>
  <text x="54.0" y="351.5" text-anchor="start" font-size="12.5" fill="#3f3420" filter="url(#rough2)">c(i, k) = suf[k+1-i]，每个 (i, k) 只要 O(1)</text>
  <text x="54.0" y="378.5" text-anchor="start" font-size="12.5" fill="#3f3420" filter="url(#rough2)">对每个 i 做一遍 O(n) 的后缀，总时间 O(n²)</text>
</svg>
