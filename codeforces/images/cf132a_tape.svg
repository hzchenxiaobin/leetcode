<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="223"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="360" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">三步：反转上一个字符 → 减去数组元素 → 再反转</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">反转在 8 位内做；减法模 256</text>
  <g filter="url(#rough2)"><rect x="60" y="96" width="200" height="64" rx="6" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="160" y="122" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">① R(c_{i−1})</text>
  <text x="160" y="145" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">上一个字符的 8 位反转</text>
  <text x="60" y="86" text-anchor="start" font-size="10" fill="#666666" filter="url(#rough2)">（i = 1 时取 0）</text>
  <g filter="url(#rough2)"><line x1="264" y1="128" x2="320" y2="128" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)"/></g>
  <g filter="url(#rough2)"><rect x="324" y="96" width="220" height="64" rx="6" fill="#f3d9d6" fill-opacity="0.85" stroke="#8a2b28" stroke-width="1.4"/></g>
  <text x="434" y="122" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">② − a_i  (mod 256)</text>
  <text x="434" y="145" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">得到中间结果 v</text>
  <g filter="url(#rough2)"><line x1="548" y1="128" x2="604" y2="128" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)"/></g>
  <g filter="url(#rough2)"><rect x="608" y="96" width="240" height="64" rx="6" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="728" y="122" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">③ R(v) = c_i</text>
  <text x="728" y="145" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">第 i 个要打印的字符</text>
  <text x="450" y="212" text-anchor="middle" font-size="14" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">反推（本题）：a_i = ( R(c_{i−1}) − R(c_i) ) mod 256</text>
  <text x="450" y="248" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">因为 R 是对合（反转两次回原数），把第 ③ 步反过来即可</text>
  <text x="450" y="286" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">注意：反转必须在 8 位内，72 = 01001000 → 00010010 = 18</text>
  <text x="450" y="312" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">而不是「去掉前导零再反转」（那会得到 9）</text>
</svg>
