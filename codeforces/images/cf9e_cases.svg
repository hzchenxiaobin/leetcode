<svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 0 780 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="21"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="780" height="420" fill="#fafafa"/>
  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">判定：度数 ≤ 2、无自环、无多余重边、已有的环必须覆盖全部点</text>

  <!-- 面板 1：度数 3 -->
  <rect x="18" y="52" width="178" height="170" rx="9" fill="#ffffff" stroke="#c9ced6" stroke-width="1.2" filter="url(#rough2)"/>
  <g stroke="#b85450" stroke-width="1.8" filter="url(#rough2)">
    <line x1="107" y1="125" x2="107" y2="88"/><line x1="107" y1="125" x2="72" y2="160"/><line x1="107" y1="125" x2="142" y2="160"/>
  </g>
  <g filter="url(#rough2)">
    <circle cx="107" cy="125" r="9" fill="#fce8e6" stroke="#b85450" stroke-width="1.8"/>
    <circle cx="107" cy="88" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="72" cy="160" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="142" cy="160" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="107" y="72" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8f3b37" filter="url(#rough2)">度数 3</text>
  <text x="107" y="196" text-anchor="middle" font-size="11.5" fill="#8f3b37" filter="url(#rough2)">→ NO</text>
  <text x="107" y="212" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">终图每点度数都是 2</text>

  <!-- 面板 2：自环 -->
  <rect x="208" y="52" width="178" height="170" rx="9" fill="#ffffff" stroke="#c9ced6" stroke-width="1.2" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <circle cx="297" cy="125" r="9" fill="#fce8e6" stroke="#b85450" stroke-width="1.8"/>
    <circle cx="297" cy="108" r="14" fill="none" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="297" y="72" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8f3b37" filter="url(#rough2)">自环</text>
  <text x="297" y="196" text-anchor="middle" font-size="11.5" fill="#8f3b37" filter="url(#rough2)">→ NO（n ≥ 2）</text>
  <text x="297" y="212" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">n = 1 时自环才是答案</text>

  <!-- 面板 3：环 + 孤立点 -->
  <rect x="398" y="52" width="178" height="170" rx="9" fill="#ffffff" stroke="#c9ced6" stroke-width="1.2" filter="url(#rough2)"/>
  <g stroke="#8a94a6" stroke-width="1.8" filter="url(#rough2)">
    <line x1="462" y1="112" x2="516" y2="112"/><line x1="516" y1="112" x2="489" y2="160"/><line x1="489" y1="160" x2="462" y2="112"/>
  </g>
  <g filter="url(#rough2)">
    <circle cx="462" cy="112" r="8" fill="#fdf3e3" stroke="#d6a040" stroke-width="1.6"/>
    <circle cx="516" cy="112" r="8" fill="#fdf3e3" stroke="#d6a040" stroke-width="1.6"/>
    <circle cx="489" cy="160" r="8" fill="#fdf3e3" stroke="#d6a040" stroke-width="1.6"/>
    <circle cx="545" cy="176" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="487" y="72" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8f3b37" filter="url(#rough2)">环没盖住全部点</text>
  <text x="487" y="196" text-anchor="middle" font-size="11.5" fill="#8f3b37" filter="url(#rough2)">→ NO</text>
  <text x="487" y="212" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">环上度数已满，接不了外面</text>

  <!-- 面板 4：路径森林 -->
  <rect x="588" y="52" width="178" height="170" rx="9" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <g stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)">
    <line x1="618" y1="100" x2="658" y2="100"/>
    <line x1="618" y1="140" x2="638" y2="140"/>
    <line x1="700" y1="140" x2="740" y2="140"/>
    <line x1="628" y1="176" x2="648" y2="176"/>
  </g>
  <g filter="url(#rough2)">
    <circle cx="618" cy="100" r="7" fill="#e6f4ea" stroke="#2f5223" stroke-width="1.6"/>
    <circle cx="658" cy="100" r="7" fill="#e6f4ea" stroke="#2f5223" stroke-width="1.6"/>
    <circle cx="618" cy="140" r="7" fill="#e6f4ea" stroke="#2f5223" stroke-width="1.6"/>
    <circle cx="638" cy="140" r="7" fill="#e6f4ea" stroke="#2f5223" stroke-width="1.6"/>
    <circle cx="700" cy="140" r="7" fill="#e6f4ea" stroke="#2f5223" stroke-width="1.6"/>
    <circle cx="740" cy="140" r="7" fill="#e6f4ea" stroke="#2f5223" stroke-width="1.6"/>
    <circle cx="628" cy="176" r="7" fill="#e6f4ea" stroke="#2f5223" stroke-width="1.6"/>
    <circle cx="648" cy="176" r="7" fill="#e6f4ea" stroke="#2f5223" stroke-width="1.6"/>
  </g>
  <text x="677" y="72" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">若干条路径</text>
  <text x="677" y="196" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">→ 可以补成环</text>
  <text x="677" y="212" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">最少加 c 条边（c = 路径数）</text>

  <rect x="60" y="252" width="660" height="146" rx="10" fill="#f4f6f9" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <g font-size="12.5" fill="#2f4a66" filter="url(#rough2)">
    <text x="78" y="278">· 终图恰是一个哈密顿回路：每个点度数 2，恰好 n 条边。</text>
    <text x="78" y="304">· 初始边必须是回路的子集 ⇒ 度数 &gt; 2、自环（n≥2）、多余重边、非哈密顿的环，全部 NO。</text>
    <text x="78" y="330">· 排除之后，初始图只能是互不相交的路径；c 条路径要补 c 条边（c−1 条串联 + 1 条闭合）。</text>
    <text x="78" y="356" font-weight="bold" fill="#8f3b37">· n = 1 → 自环；n = 2 → 两条平行的 (1,2)；n ≥ 3 → 普通简单环。</text>
    <text x="78" y="382">· 已有哈密顿回路时加 0 条边即可（k 允许为 0）。</text>
  </g>
</svg>
