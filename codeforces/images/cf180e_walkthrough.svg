<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="83"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="380" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">180E 样例 2：颜色 1 可以连成 5 个</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="40.0" y="92.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">颜色 1 出现在位置 1,3,5,6,8,9</text>
  <text x="40.0" y="126.0" text-anchor="start" font-size="12" fill="#555" filter="url(#rough2)">q = 1, 2, 3, 3, 4, 4</text>
  <text x="40.0" y="160.0" text-anchor="start" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">取 i=1（q=2），k=2：q_j ≤ 4 的最远 j=5，长度 5</text>
  <text x="40.0" y="194.0" text-anchor="start" font-size="12" fill="#444" filter="url(#rough2)">对应保留位置 3,5,6,8,9：跨度 7，删掉 4,7 两颗 → 连成 5 个</text>
  <rect x="40.0" y="240.0" width="640.0" height="56.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="54.0" y="264.5" text-anchor="start" font-size="12.5" fill="#3f3420" filter="url(#rough2)">与官方输出 5 一致（删除第 4、7 颗）</text>
</svg>
