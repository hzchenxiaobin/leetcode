<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="480" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold">算法流程：自下而上扫行 + 值域桶上的「从大到小」二分</text>

  <g filter="url(#rough2)">
    <rect x="80" y="40" width="460" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="9"/>
    <text x="310" y="65" text-anchor="middle" font-size="12" fill="#3a4a66">读入 n, m、v[1..n]，以及 n×m 的 destabilization factor a</text>

    <rect x="80" y="94" width="460" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="9"/>
    <text x="310" y="114" text-anchor="middle" font-size="12" fill="#3a5a30">把全部 a 值排序去重做离散化，每个不同值一个「桶」</text>
    <text x="310" y="131" text-anchor="middle" font-size="10.5" fill="#5a7a4a">桶里维护 cnt（几个格子）与 sum（这些格子的 a 之和）</text>

    <rect x="80" y="152" width="460" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="9"/>
    <text x="310" y="173" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold">k 从 n 递减到 1：先把第 k 行的 m 个值插入对应的桶</text>
    <text x="310" y="193" text-anchor="middle" font-size="10.5" fill="#a08030">插入之后，桶里恰好是第 k..n 行的全部格子（后缀行）</text>

    <rect x="80" y="222" width="460" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="9"/>
    <text x="310" y="242" text-anchor="middle" font-size="12" fill="#3a4a66" font-weight="bold">查询 g(k)：从最大值的桶开始往小累加 sum</text>
    <text x="310" y="261" text-anchor="middle" font-size="11" fill="#3a4a66">累加和 ≥ v_k 时，在跨过阈值的那个桶里再取 ceil((v_k − 前缀和) / x) 个</text>
    <text x="310" y="281" text-anchor="middle" font-size="10.5" fill="#7a8aa6">所有桶加完仍 &lt; v_k ⇒ 这一层凑不出来，直接跳过</text>

    <rect x="80" y="312" width="460" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="9"/>
    <text x="310" y="332" text-anchor="middle" font-size="12" fill="#3a5a30">ans = min(ans, g(k))，初值 ans = m（掏空某一整层的代价）</text>
    <text x="310" y="349" text-anchor="middle" font-size="10.5" fill="#5a7a4a">n 个后缀都要问一遍，取最小者</text>

    <rect x="80" y="370" width="460" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="9"/>
    <text x="310" y="394" text-anchor="middle" font-size="12" fill="#8a6a20">输出 ans</text>

    <rect x="80" y="422" width="460" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="9"/>
    <text x="310" y="441" text-anchor="middle" font-size="11" fill="#8a3a3a">剪枝：ans 已是 1 就停；总 sum &lt; v_k 跳过；v_k &gt; (ans−1)·max 也跳过</text>
    <text x="310" y="459" text-anchor="middle" font-size="10.5" fill="#b07a7a">最后一条的含义：连最大的 ans−1 个格子都凑不够，这次查询不可能更优</text>
  </g>

  <path d="M 310 80 L 310 92" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 310 138 L 310 150" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 310 208 L 310 220" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 310 298 L 310 310" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 310 356 L 310 368" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 310 408 L 310 420" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
