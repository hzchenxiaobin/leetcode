<svg xmlns="http://www.w3.org/2000/svg" width="884" height="360" viewBox="0 0 884 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="125"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/></marker>
  </defs>
  <rect width="884" height="360" fill="#fafafa"/>
  <text x="442" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每位客人 = 两天的一个二元组</text>
  <text x="442" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">两两相交 + 无三元共同 → 客人可对应到“天对”</text>
  <g filter="url(#rough2)"><circle cx="250" cy="130" r="26" fill="#f6e3c4" fill-opacity="0.9" stroke="#c9a86a" stroke-width="1.5"/></g>
  <text x="250" y="136" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">D1</text>
  <g filter="url(#rough2)"><circle cx="500" cy="110" r="26" fill="#f6e3c4" fill-opacity="0.9" stroke="#c9a86a" stroke-width="1.5"/></g>
  <text x="500" y="116" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">D2</text>
  <g filter="url(#rough2)"><circle cx="640" cy="210" r="26" fill="#f6e3c4" fill-opacity="0.9" stroke="#c9a86a" stroke-width="1.5"/></g>
  <text x="640" y="216" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">D3</text>
  <g filter="url(#rough2)"><circle cx="380" cy="250" r="26" fill="#f6e3c4" fill-opacity="0.9" stroke="#c9a86a" stroke-width="1.5"/></g>
  <text x="380" y="256" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">D4</text>
  <g filter="url(#rough2)"><line x1="250" y1="130" x2="500" y2="110" stroke="#7a9a6a" stroke-width="2"/></g>
  <text x="375.0" y="112.0" text-anchor="middle" font-size="10" fill="#3d6b2f" filter="url(#rough2)">h1</text>
  <g filter="url(#rough2)"><line x1="250" y1="130" x2="640" y2="210" stroke="#7a9a6a" stroke-width="2"/></g>
  <text x="445.0" y="162.0" text-anchor="middle" font-size="10" fill="#3d6b2f" filter="url(#rough2)">h2</text>
  <g filter="url(#rough2)"><line x1="250" y1="130" x2="380" y2="250" stroke="#7a9a6a" stroke-width="2"/></g>
  <text x="315.0" y="182.0" text-anchor="middle" font-size="10" fill="#3d6b2f" filter="url(#rough2)">h3</text>
  <g filter="url(#rough2)"><line x1="500" y1="110" x2="640" y2="210" stroke="#7a9a6a" stroke-width="2"/></g>
  <text x="570.0" y="152.0" text-anchor="middle" font-size="10" fill="#3d6b2f" filter="url(#rough2)">h4</text>
  <g filter="url(#rough2)"><line x1="500" y1="110" x2="380" y2="250" stroke="#7a9a6a" stroke-width="2"/></g>
  <text x="440.0" y="172.0" text-anchor="middle" font-size="10" fill="#3d6b2f" filter="url(#rough2)">h5</text>
  <g filter="url(#rough2)"><line x1="640" y1="210" x2="380" y2="250" stroke="#7a9a6a" stroke-width="2"/></g>
  <text x="510.0" y="222.0" text-anchor="middle" font-size="10" fill="#3d6b2f" filter="url(#rough2)">h6</text>
  <text x="442" y="300" text-anchor="middle" font-size="12" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">C(k,2) ≤ n ⇒ k 最大；每对天安排一个专属客人</text>
  <text x="442" y="332" text-anchor="middle" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">n=4 或 5 时 k=3（C(4,2)=6&gt;5）</text>
</svg>
