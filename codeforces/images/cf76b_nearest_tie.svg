<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="720" height="400" fill="#fafafa"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每只老鼠只认最近的奶酪，平局只在中点</text>
  <path d="M 200 43 Q 360 49 520 43" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 70 150 L 670 150" stroke="#777777" stroke-width="1.4" fill="none" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="676" y="154" text-anchor="start" font-size="11" fill="#777777" filter="url(#rough2)">y = Y₁</text>
  <path d="M 70 268 L 670 268" stroke="#777777" stroke-width="1.4" fill="none" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="676" y="272" text-anchor="start" font-size="11" fill="#777777" filter="url(#rough2)">y = Y₀</text>
  <rect x="197" y="136" width="26" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="210" y="124" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">c₀</text>
  <rect x="457" y="136" width="26" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="470" y="124" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">c₁</text>
  <circle cx="130" cy="268" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="130" y="300" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">m₀</text>
  <circle cx="340" cy="268" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="340" y="300" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">m₁</text>
  <circle cx="560" cy="268" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="560" y="300" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">m₂</text>
  <path d="M 210 250 L 210 170" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 340 250 L 215 170" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 470 250 L 470 170" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="360" y="226" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">竖向差 |Y₀-Y₁| 对所有老鼠相同</text>
  <text x="360" y="246" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">所以「谁更近」只看 |x_老鼠 - x_奶酪|</text>
  <path d="M 340 140 L 340 280" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <text x="346" y="132" text-anchor="start" font-size="10.5" fill="#b85450" filter="url(#rough2)">中点 (c₀+c₁)/2</text>
  <text x="72" y="344" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">奶酪坐标严格递增 → 一只老鼠的最近奶酪只可能是它左右相邻的两个之一；</text>
  <text x="72" y="368" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">要到「并列最近」必须恰好站在两块相邻奶酪的中点，而中点是一个确定的值，</text>
  <text x="72" y="390" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">老鼠坐标又严格递增，所以每个缝隙里至多一只平局老鼠。</text>
</svg>
