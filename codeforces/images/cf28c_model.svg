<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="430" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="38" text-anchor="middle" font-size="18.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">28C：随机进房间 + 房间内均分到水盆</text>
  <path d="M 137 50 Q 380 56 623 50" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="84" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">每个学生独立、等概率（1/m）进入某个洗漱间，于是 (k1..km) 是多项分布。</text>
  <rect x="70" y="110" width="190" height="150" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="165" y="138" text-anchor="middle" font-size="12.5" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">房间 1: a=1 个水盆</text>
  <rect x="88" y="170" width="154" height="22" rx="6" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="165" y="186" text-anchor="middle" font-size="10" fill="#666" font-weight="normal" filter="url(#rough2)">水盆 1</text>
  <rect x="290" y="110" width="190" height="150" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="385" y="138" text-anchor="middle" font-size="12.5" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">房间 2: a=2 个水盆</text>
  <rect x="308" y="170" width="154" height="22" rx="6" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="385" y="186" text-anchor="middle" font-size="10" fill="#666" font-weight="normal" filter="url(#rough2)">水盆 1</text>
  <rect x="308" y="200" width="154" height="22" rx="6" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="385" y="216" text-anchor="middle" font-size="10" fill="#666" font-weight="normal" filter="url(#rough2)">水盆 2</text>
  <rect x="510" y="110" width="190" height="150" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="605" y="138" text-anchor="middle" font-size="12.5" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">房间 3: a=3 个水盆</text>
  <rect x="528" y="170" width="154" height="22" rx="6" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="605" y="186" text-anchor="middle" font-size="10" fill="#666" font-weight="normal" filter="url(#rough2)">水盆 1</text>
  <rect x="528" y="200" width="154" height="22" rx="6" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="605" y="216" text-anchor="middle" font-size="10" fill="#666" font-weight="normal" filter="url(#rough2)">水盆 2</text>
  <rect x="528" y="230" width="154" height="22" rx="6" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="605" y="246" text-anchor="middle" font-size="10" fill="#666" font-weight="normal" filter="url(#rough2)">水盆 3</text>
  <text x="60" y="292" text-anchor="start" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">房间内 k 个学生尽量平均地排到 a 个水盆 ⇒ 最长队列 = ceil(k / a)。</text>
  <rect x="60" y="310" width="640" height="96" rx="10" fill="#fff3e0" stroke="#c9801f" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="76" y="338" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">要求的随机变量：M = max over i of ceil(k_i / a_i)，求 E[M]。</text>
  <text x="76" y="364" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">n, m &lt;= 50 ⇒ 可以对每个阈值 t 算 P(M &lt;= t)，再求和：E[M] = Σ_{t&gt;=0} P(M &gt; t)。</text>
  <text x="76" y="390" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">P(M &lt;= t) = P(所有房间 k_i &lt;= t·a_i)，这是一次“带容量上限”的多项分布求和。</text>
</svg>
