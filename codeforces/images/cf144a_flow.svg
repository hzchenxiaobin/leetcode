<svg xmlns="http://www.w3.org/2000/svg" width="660" height="190" viewBox="0 0 660 190"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1442"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="660" height="190" fill="#fafafa"/>
  <text x="330.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">流 程</text>
  <path d="M 105.60000000000001 42 Q 330.0 48 554.4 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="330.0" y="176" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">O(n)</text>
  <text x="330" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#335478" filter="url(#rough2)">找最左最大值 / 最右最小值 → posMax + (n−1−posMin) − 交叉修正</text>
  <text x="330" y="128" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">交叉条件：posMax > posMin</text>
</svg>
