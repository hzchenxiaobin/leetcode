<svg xmlns="http://www.w3.org/2000/svg" width="880" height="230" viewBox="0 0 880 230"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="230" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">差分求并集 + 区间覆盖贪心</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">剩下的指令数最少 =&gt; 删除数最多</text>
  <text x="150" y="90" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">先差分求出每个字节被覆盖的次数 → 得到"必须被覆盖"的集合</text>
  <text x="150" y="130" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">再做经典区间覆盖贪心：每个待覆盖位置选右端最远的区间</text>
  <text x="150" y="170" text-anchor="start" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">没被贪心选中的指令即"可删除"，数量最大</text>
</svg>
