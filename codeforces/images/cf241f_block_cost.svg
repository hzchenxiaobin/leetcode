<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="300" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">走一步的代价 = 出发街区上的数字（路口固定 1 分钟）</text>

  <g filter="url(#rough2)">
    <rect x="30"  y="70" width="86" height="62" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="146" y="70" width="86" height="62" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="262" y="70" width="86" height="62" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="378" y="70" width="86" height="62" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="494" y="70" width="86" height="62" rx="8" fill="#fde9d9" stroke="#b4652a" stroke-width="2.4"/>
    <rect x="610" y="70" width="86" height="62" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <g font-size="12" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">
    <text x="73"  y="95">起点 (2,3)</text><text x="73"  y="118" font-size="15" font-weight="bold">1</text>
    <text x="189" y="95">路口 a</text><text x="189" y="118" font-size="15" font-weight="bold">1</text>
    <text x="305" y="95">(2,5)</text><text x="305" y="118" font-size="15" font-weight="bold">1</text>
    <text x="421" y="95">(2,6)</text><text x="421" y="118" font-size="15" font-weight="bold">3</text>
    <text x="537" y="95">(2,7)</text><text x="537" y="118" font-size="15" font-weight="bold">1</text>
    <text x="653" y="95">终点 (2,8)</text><text x="653" y="118" font-size="15" font-weight="bold">1</text>
  </g>
  <g stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)">
    <line x1="117" y1="101" x2="143" y2="101"/>
    <line x1="233" y1="101" x2="259" y2="101"/>
    <line x1="349" y1="101" x2="375" y2="101"/>
    <line x1="465" y1="101" x2="491" y2="101"/>
    <line x1="581" y1="101" x2="607" y2="101"/>
  </g>
  <g font-size="11" fill="#446688" text-anchor="middle" filter="url(#rough2)">
    <text x="130" y="62">1′</text><text x="246" y="62">1′</text><text x="362" y="62">1′</text>
    <text x="478" y="62">3′</text><text x="594" y="62">1′</text>
  </g>
  <g font-size="11" fill="#7a4b22" text-anchor="middle" filter="url(#rough2)">
    <text x="73" y="152">t=0</text><text x="189" y="152">t=1</text><text x="305" y="152">t=2</text>
    <text x="421" y="152">t=3</text><text x="537" y="152" font-weight="bold">t=6</text><text x="653" y="152">t=7</text>
  </g>
  <text x="360" y="184" text-anchor="middle" font-size="13" fill="#b4652a" filter="url(#rough2)">k = 6 恰好是「到达 (2,7) 的那一分钟」，所以答案取 (2,7)</text>

  <g filter="url(#rough2)">
    <rect x="40" y="204" width="640" height="72" rx="9" fill="#eef6ec" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <g font-size="12" fill="#2f5223" filter="url(#rough2)">
    <text x="56" y="228">· 街区上的数字 d：从它走到相邻方块要 d 分钟（d 属于「出发方块」）</text>
    <text x="56" y="250">· 路口：走到相邻街区固定 1 分钟；路口名唯一，最多 26 个</text>
    <text x="56" y="270">· 因此 到达时间 沿路径严格递增，相邻两次到达之差 = 出发街区的数字</text>
  </g>
</svg>
