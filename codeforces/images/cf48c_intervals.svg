<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="400" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="38" text-anchor="middle" font-size="18.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">48C：把 n 条约束交成区间，再看下一步是否唯一</text>
  <path d="M 137 50 Q 380 56 623 50" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <line x1="80" y1="300" x2="700" y2="300" stroke="#2b2b2b" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="80" y1="294" x2="80" y2="306" stroke="#8a8a8a" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="183" y1="294" x2="183" y2="306" stroke="#8a8a8a" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="286" y1="294" x2="286" y2="306" stroke="#8a8a8a" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="389" y1="294" x2="389" y2="306" stroke="#8a8a8a" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="492" y1="294" x2="492" y2="306" stroke="#8a8a8a" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="595" y1="294" x2="595" y2="306" stroke="#8a8a8a" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="698" y1="294" x2="698" y2="306" stroke="#8a8a8a" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="80" y="322" text-anchor="middle" font-size="10.5" fill="#8a8a8a" font-weight="normal" filter="url(#rough2)">10</text>
  <text x="700" y="322" text-anchor="middle" font-size="10.5" fill="#8a8a8a" font-weight="normal" filter="url(#rough2)">20</text>
  <text x="90" y="84" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">样例 1：停车站 1 2 4</text>
  <line x1="110" y1="110" x2="340" y2="110" stroke="#4a7a3a" stroke-width="7" filter="url(#rough2)"/>
  <text x="104" y="114" text-anchor="end" font-size="10.5" fill="#4a7a3a" font-weight="normal" filter="url(#rough2)">i=1: [10,20)</text>
  <line x1="110" y1="154" x2="262" y2="154" stroke="#446688" stroke-width="7" filter="url(#rough2)"/>
  <text x="104" y="158" text-anchor="end" font-size="10.5" fill="#446688" font-weight="normal" filter="url(#rough2)">i=2: [10,15)</text>
  <line x1="262" y1="198" x2="282" y2="198" stroke="#c9801f" stroke-width="7" filter="url(#rough2)"/>
  <text x="256" y="202" text-anchor="end" font-size="10.5" fill="#c9801f" font-weight="normal" filter="url(#rough2)">i=3: [13.3,16.7)</text>
  <line x1="258" y1="262" x2="340" y2="262" stroke="#b6483f" stroke-width="5" filter="url(#rough2)"/>
  <text x="300" y="248" text-anchor="middle" font-size="11" fill="#b6483f" font-weight="bold" filter="url(#rough2)">交集 ≈ [13.33, 15)</text>
  <text x="80" y="352" text-anchor="start" font-size="11.5" fill="#2f5223" font-weight="bold" filter="url(#rough2)">下一步 = floor((n+1)·α / 10)：在交集上取到 5（端点处也还是 5）⇒ unique 5</text>
  <text x="80" y="378" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">样例 2（1 2）：交集 [10,15)，floor(3α/10) 可取 3、4 ⇒ not unique</text>
</svg>
