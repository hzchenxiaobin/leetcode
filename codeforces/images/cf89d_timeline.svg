<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="905"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="300" fill="#fafafa"/>
  <text x="360.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">把每个几何体的接触时刻解成区间</text>
  <path d="M 115.2 42 Q 360.0 48 604.8 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <line x1="60.0" y1="120.0" x2="660.0" y2="120.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <text x="654" y="142" text-anchor="middle" font-size="13" fill="#333333" filter="url(#rough2)">t</text>
  <rect x="90" y="154" width="80" height="22" rx="7" fill="#f7f7f4" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="130.0" y="170" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">本体</text>
  <rect x="150" y="188" width="150" height="22" rx="7" fill="#f7f7f4" stroke="#d98c3f" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="225.0" y="204" text-anchor="middle" font-size="10.5" fill="#d98c3f" filter="url(#rough2)">尖刺端点</text>
  <rect x="260" y="222" width="170" height="22" rx="7" fill="#f7f7f4" stroke="#5a7fb0" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="345.0" y="238" text-anchor="middle" font-size="10.5" fill="#5a7fb0" filter="url(#rough2)">尖刺圆柱</text>
  <line x1="90.0" y1="112.0" x2="90.0" y2="242.0" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="90" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#8c2f2c" filter="url(#rough2)">最早 = 90</text>
  <text x="360" y="262" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">每个几何体：判别式决定区间是否存在；a=0（v 平行于尖刺）时退化为一次不等式</text>
  <text x="360" y="284" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">所有区间与 t ≥ 0 取交，左端点最小的就是答案</text>
</svg>
