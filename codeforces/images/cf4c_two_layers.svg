<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="760" height="460" fill="#fafafa"/>

  <text x="380" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两层结构：集合判存在 + 游标记编号</text>
  <path d="M 150 44 Q 380 50 610 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 左：集合层 -->
  <rect x="26" y="66" width="326" height="238" rx="12" fill="#eef4fb" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="46" y="94" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">① 集合 db：只回答“在不在”</text>
  <text x="46" y="116" font-size="11.5" fill="#3c5a78" filter="url(#rough2)">原样注册的 + 生成出来的，全都要存</text>

  <g filter="url(#rough2)">
    <rect x="46" y="130" width="118" height="30" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.3"/>
    <text x="105" y="150" text-anchor="middle" font-size="12" fill="#2f4a66">abacaba</text>
    <rect x="176" y="130" width="96" height="30" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.3"/>
    <text x="224" y="150" text-anchor="middle" font-size="12" fill="#2f4a66">acaba</text>
    <rect x="46" y="170" width="140" height="30" rx="8" fill="#fdf3e0" stroke="#c98a2b" stroke-width="1.4" stroke-dasharray="5 3"/>
    <text x="116" y="190" text-anchor="middle" font-size="12" fill="#8a6015">abacaba1</text>
    <rect x="196" y="170" width="130" height="30" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.3"/>
    <text x="261" y="190" text-anchor="middle" font-size="12" fill="#2f4a66">first</text>
    <rect x="46" y="210" width="96" height="30" rx="8" fill="#fdf3e0" stroke="#c98a2b" stroke-width="1.4" stroke-dasharray="5 3"/>
    <text x="94" y="230" text-anchor="middle" font-size="12" fill="#8a6015">first1</text>
    <rect x="152" y="210" width="174" height="30" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.3" stroke-dasharray="4 3"/>
    <text x="239" y="230" text-anchor="middle" font-size="11.5" fill="#7a7a7a">…（最多 10^5 个）</text>
  </g>
  <text x="46" y="266" font-size="11" fill="#4a6b8a" filter="url(#rough2)">橙色虚线框 = 由重名自动生成的名字</text>
  <text x="46" y="288" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">单次判存在：期望 O(32)，与 n 无关</text>

  <!-- 右：游标层 -->
  <rect x="408" y="66" width="326" height="238" rx="12" fill="#eef7ee" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="428" y="94" font-size="14" font-weight="bold" fill="#2f5223" filter="url(#rough2)">② 游标 nxt：该基名发到第几号</text>
  <text x="428" y="116" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">只增不减，下次从这里继续往后找</text>

  <g filter="url(#rough2)">
    <rect x="428" y="130" width="286" height="32" rx="8" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="442" y="151" font-size="12" fill="#2f5223">abacaba</text>
    <text x="580" y="151" font-size="12" fill="#2f5223">→ nxt = 1</text>
    <rect x="428" y="170" width="286" height="32" rx="8" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="442" y="191" font-size="12" fill="#2f5223">first</text>
    <text x="580" y="191" font-size="12" fill="#2f5223">→ nxt = 1</text>
    <rect x="428" y="210" width="286" height="32" rx="8" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="442" y="231" font-size="12" fill="#2f5223">second</text>
    <text x="580" y="231" font-size="12" fill="#2f5223">→ nxt = 0</text>
  </g>
  <text x="428" y="266" font-size="11" fill="#3c5e2e" filter="url(#rough2)">nxt = 0 表示还没发出过编号（也叫新基名）</text>
  <text x="428" y="288" font-size="11.5" fill="#2f5223" filter="url(#rough2)">只多存了一个 int，却把重复扫描省掉了</text>

  <!-- 中间箭头 -->
  <path d="M 352 186 L 404 186" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="378" y="176" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">判重</text>

  <!-- 底部结论 -->
  <rect x="26" y="322" width="708" height="112" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="46" y="350" font-size="13.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">重名时的回答 = s + 最小编号，编号从游标的下一位开始试</text>
  <text x="46" y="376" font-size="12" fill="#7a5a1b" filter="url(#rough2)">k = nxt[s];  do { k += 1; t = s + str(k); } while (t ∈ db);  然后 nxt[s] = k 并 db.insert(t)</text>
  <text x="46" y="402" font-size="12" fill="#7a5a1b" filter="url(#rough2)">所有请求累计只测试 2n 个候选：每个候选要么被插入，要么早已因直接请求而在库里</text>
  <text x="46" y="424" font-size="11.5" fill="#9a7020" filter="url(#rough2)">于是判重 O(1) 期望 + 编号均摊 O(1) ⇒ 整题线性</text>
</svg>
