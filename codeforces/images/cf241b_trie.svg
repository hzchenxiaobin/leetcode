<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="t" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="330" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">01-trie 上数「异或 &gt; v 的对数」：v 的某位是 0 时整棵子树都算</text>

  <g filter="url(#rough2)">
    <circle cx="360" cy="66"  r="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="250" cy="132" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="470" cy="132" r="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <circle cx="190" cy="200" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="310" cy="200" r="21" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <circle cx="410" cy="200" r="21" fill="#fde9d9" stroke="#b4652a" stroke-width="2.4"/>
    <circle cx="530" cy="200" r="21" fill="#f2f2f2" stroke="#888888" stroke-width="1.4" stroke-dasharray="4 3"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">
    <text x="360" y="71">root</text>
    <text x="250" y="137">0</text><text x="470" y="137">1</text>
    <text x="190" y="205">0</text><text x="310" y="205">1</text>
    <text x="410" y="205">0</text><text x="530" y="205">1</text>
  </g>
  <g stroke="#446688" stroke-width="1.5" filter="url(#rough2)">
    <line x1="345" y1="84" x2="264" y2="117" marker-end="url(#t)"/>
    <line x1="375" y1="84" x2="456" y2="117" marker-end="url(#t)"/>
    <line x1="238" y1="148" x2="202" y2="183" marker-end="url(#t)"/>
    <line x1="262" y1="148" x2="298" y2="183" marker-end="url(#t)"/>
    <line x1="458" y1="148" x2="422" y2="183" marker-end="url(#t)"/>
    <line x1="482" y1="148" x2="518" y2="183" marker-end="url(#t)"/>
  </g>
  <g font-size="10.5" fill="#446688" filter="url(#rough2)">
    <text x="286" y="100">b = 1</text><text x="420" y="100">b = 0</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="238" width="640" height="78" rx="9" fill="#eef6ec" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <g font-size="11.5" fill="#2f5223" filter="url(#rough2)">
    <text x="56" y="260">沿 a 的位从高到低走：</text>
    <text x="56" y="280">· v 的这一位是 0：走 a 的同位分支，另一分支（异或位 = 1）整棵子树都满足 &gt; v，整块计入</text>
    <text x="56" y="300">· v 的这一位是 1：只能走「异或位 = 1」的分支，另一分支（= 0）比 v 小，直接丢弃</text>
  </g>
</svg>
