<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320" viewBox="0 0 700 320"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="401"/>
    <feDisplacementMap in="SourceGraphic" scale="1.5"/></filter></defs>
  <rect width="700" height="320" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每 widen 一次，覆盖的整数个数就 +1</text>
  <path d="M 140 40 Q 350 46 560 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="66" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="13" fill="#22314a" filter="url(#rough2)">区间互不相交 ⇒ 集合的 value = Σ (rᵢ − lᵢ + 1)（直接相加，不会重复计数）。</text>
  <text x="76" y="106" font-size="12.5" fill="#22314a" filter="url(#rough2)">把某个区间向左或右扩 1，value 恰好 +1（不会破坏"互不相交"以外的约束）。</text>
  <g filter="url(#rough2)"><rect x="60" y="134" width="580" height="66" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="76" y="158" font-size="13" fill="#8a6015" filter="url(#rough2)">要 value 被 k 整除、且移动数最少 ⇒ 只需补到"下一个 k 的倍数"：</text>
  <text x="76" y="182" font-size="13" fill="#8a6015" filter="url(#rough2)">答案 = (k − S mod k) mod k，其中 S = Σ(rᵢ − lᵢ + 1)。</text>
  <g filter="url(#rough2)"><rect x="60" y="210" width="580" height="66" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="234" font-size="12.5" fill="#2f5223" filter="url(#rough2)">样例 1：S = 2+2 = 4，k=3 ⇒ (3−1) mod 3 = 2 ✓</text>
  <text x="76" y="258" font-size="12.5" fill="#2f5223" filter="url(#rough2)">样例 2：S = 2+1+4 = 7，k=7 ⇒ 0 ✓</text>
  <text x="76" y="278" font-size="11.5" fill="#2f5223" filter="url(#rough2)">O(n) 求和即可；Σ 最大约 2·10⁵·2·10⁵ = 4·10¹⁰ ⇒ 用 64 位。</text>
</svg>
