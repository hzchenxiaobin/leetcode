<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="897"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="330" fill="#fafafa"/>
  <text x="360.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">HBox / VBox 的尺寸公式</text>
  <path d="M 115.2 42 Q 360.0 48 604.8 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="360.0" y="316" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">k 为子控件个数（重复 pack 计多份），b = border，s = spacing</text>
  <rect x="40" y="70" width="310" height="190" rx="10" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="195" y="96" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">HBox（水平排）</text>
  <rect x="70" y="120" width="70" height="50" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="105.0" y="150" text-anchor="middle" font-size="12.5" fill="#2f5223" filter="url(#rough2)">c₁</text>
  <rect x="162" y="120" width="90" height="50" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="207.0" y="150" text-anchor="middle" font-size="12.5" fill="#2f5223" filter="url(#rough2)">c₂</text>
  <rect x="254" y="120" width="60" height="50" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="284.0" y="150" text-anchor="middle" font-size="12.5" fill="#2f5223" filter="url(#rough2)">c₃</text>
  <text x="195" y="200" text-anchor="middle" font-size="12.5" fill="#2f5223" filter="url(#rough2)">宽 = 2b + Σwᵢ + s·(k−1)</text>
  <text x="195" y="226" text-anchor="middle" font-size="12.5" fill="#2f5223" filter="url(#rough2)">高 = 2b + max hᵢ</text>
  <text x="195" y="250" text-anchor="middle" font-size="11" fill="#666655" filter="url(#rough2)">子控件按 pack 顺序排列</text>
  <rect x="380" y="70" width="300" height="190" rx="10" fill="#ffffff" stroke="#a05a5a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="530" y="96" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#6b3030" filter="url(#rough2)">VBox（垂直排）</text>
  <rect x="400" y="118" width="90" height="26" rx="7" fill="#fbeeee" stroke="#a05a5a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="400" y="150" width="90" height="26" rx="7" fill="#fbeeee" stroke="#a05a5a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="400" y="182" width="90" height="26" rx="7" fill="#fbeeee" stroke="#a05a5a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="530" y="232" text-anchor="middle" font-size="12.5" fill="#6b3030" filter="url(#rough2)">宽 = 2b + max wᵢ</text>
  <text x="530" y="256" text-anchor="middle" font-size="12.5" fill="#6b3030" filter="url(#rough2)">高 = 2b + Σhᵢ + s·(k−1)</text>
  <rect x="40" y="276" width="640" height="38" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="300" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">没有子控件时宽高都是 0，与 border / spacing 无关</text>
</svg>
