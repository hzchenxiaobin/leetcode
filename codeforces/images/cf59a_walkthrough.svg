<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c9801f"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a8524a"/>
    </marker>
  </defs>
  <rect width="760" height="320" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">三个官方样例 + 两组自造数据</text>
  <rect x="24.0" y="58.0" width="714.0" height="32.0" rx="6" fill="#eef1f7" stroke="#2b2b2b" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="117.0" y="79.0" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">单词</text>
  <text x="303.0" y="79.0" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">大写 / 小写</text>
  <text x="471.0" y="79.0" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">判定</text>
  <text x="642.0" y="79.0" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">输出</text>
  <rect x="24.0" y="90.0" width="714.0" height="40.0" rx="5" fill="#f7f9fc" stroke="#9aa3b2" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="36.0" y="116.0" text-anchor="start" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">HoUse</text>
  <text x="303.0" y="116.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">2 / 3</text>
  <text x="408.0" y="116.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">小写更多，转小写</text>
  <text x="642.0" y="116.0" text-anchor="middle" font-size="13" fill="#c9801f" font-weight="bold" filter="url(#rough2)">house</text>
  <rect x="24.0" y="132.0" width="714.0" height="40.0" rx="5" fill="#fbfbfb" stroke="#9aa3b2" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="36.0" y="158.0" text-anchor="start" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">ViP</text>
  <text x="303.0" y="158.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">2 / 1</text>
  <text x="408.0" y="158.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">大写更多，转大写</text>
  <text x="642.0" y="158.0" text-anchor="middle" font-size="13" fill="#c9801f" font-weight="bold" filter="url(#rough2)">VIP</text>
  <rect x="24.0" y="174.0" width="714.0" height="40.0" rx="5" fill="#f7f9fc" stroke="#9aa3b2" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="36.0" y="200.0" text-anchor="start" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">maTRIx</text>
  <text x="303.0" y="200.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">3 / 3</text>
  <text x="408.0" y="200.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">平局 → 小写</text>
  <text x="642.0" y="200.0" text-anchor="middle" font-size="13" fill="#c9801f" font-weight="bold" filter="url(#rough2)">matrix</text>
  <rect x="24.0" y="216.0" width="714.0" height="40.0" rx="5" fill="#fbfbfb" stroke="#9aa3b2" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="36.0" y="242.0" text-anchor="start" font-size="13" fill="#2b2b2b" filter="url(#rough2)">aBc</text>
  <text x="303.0" y="242.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">1 / 2</text>
  <text x="408.0" y="242.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">自造：小写更多</text>
  <text x="642.0" y="242.0" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">abc</text>
  <rect x="24.0" y="258.0" width="714.0" height="40.0" rx="5" fill="#f7f9fc" stroke="#9aa3b2" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="36.0" y="284.0" text-anchor="start" font-size="13" fill="#2b2b2b" filter="url(#rough2)">A</text>
  <text x="303.0" y="284.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">1 / 0</text>
  <text x="408.0" y="284.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">自造：单字符</text>
  <text x="642.0" y="284.0" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">A</text>
  <text x="380.0" y="310.0" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">前 3 行是官方样例；后 2 行标注「自造」，覆盖小写更多与单字符。</text>
</svg>
