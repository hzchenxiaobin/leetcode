<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="320" fill="#fafafa"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">196C：递归切分（区间 = 连续的一段极角）</text>
  <path d="M 188.60000000000005 46 Q 380.0 52 571.4 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60.0" y="70.0" width="200.0" height="60.0" rx="8" fill="#fff3d6" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="160.0" y="106.0" text-anchor="middle" font-size="11.2" font-weight="bold" fill="#8a6015" filter="url(#rough2)">solve(v, 点集)</text>
  <rect x="330.0" y="70.0" width="180.0" height="60.0" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="420.0" y="96.0" text-anchor="middle" font-size="10.8" fill="#26405c" filter="url(#rough2)">取最左点 p</text>
  <text x="420.0" y="114.0" text-anchor="middle" font-size="10.8" fill="#26405c" filter="url(#rough2)">分配 v 给 p</text>
  <rect x="570.0" y="70.0" width="150.0" height="60.0" rx="8" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="645.0" y="96.0" text-anchor="middle" font-size="10.6" fill="#2f5b34" filter="url(#rough2)">其余按极角</text>
  <text x="645.0" y="114.0" text-anchor="middle" font-size="10.6" fill="#2f5b34" filter="url(#rough2)">排序成 rest</text>
  <path d="M 262.0 100.0 L 326.0 100.0" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 512.0 100.0 L 566.0 100.0" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="60.0" y="170.0" width="660.0" height="56.0" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="194.0" text-anchor="start" font-size="11.1" fill="#33506e" filter="url(#rough2)">按子节点大小 s₁,s₂,… 依次切分 rest：第 1 个孩子拿前 s₁ 个点，第 2 个拿接下来 s₂ 个……</text>
  <text x="74.0" y="216.0" text-anchor="start" font-size="11.1" fill="#33506e" filter="url(#rough2)">每个孩子递归（点集是极角上连续的一段，保证扇区不交叠）。</text>
  <rect x="60.0" y="240.0" width="660.0" height="56.0" rx="9" fill="#fdf0ef" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="264.0" text-anchor="start" font-size="11.0" fill="#8a3a36" filter="url(#rough2)">复杂度：每层排序 O(n log n)，最坏（链）O(n² log n)；n ≤ 1500 时约 2.5×10⁷，够用。</text>
</svg>
