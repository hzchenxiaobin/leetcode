<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="720" height="420" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">4 个奇度点：加一条假边，再删掉它</text>
  <path d="M 170 40 Q 360 46 550 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <rect x="40" y="70" width="640" height="70" rx="10" fill="#fde8e8" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <g font-size="11.5" fill="#8a3b38" filter="url(#rough2)">
    <text x="56" y="96">原图有 4 个奇度点 o0、o1、o2、o3；一个欧拉迹最多容忍 2 个奇度点。</text>
    <text x="56" y="120">加假边 o0—o1 后，o0、o1 变偶，只剩 o2、o3 为奇，整图有欧拉迹。</text>
  </g>

  <!-- 路径示意 -->
  <rect x="50" y="170" width="230" height="70" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="165" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">前半段</text>
  <text x="165" y="222" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">o2 → … → o0</text>

  <rect x="300" y="170" width="120" height="70" rx="10" fill="#fff" stroke="#b85450" stroke-width="1.6" stroke-dasharray="7 4" filter="url(#rough2)"/>
  <text x="360" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="#a33a36" filter="url(#rough2)">假边</text>
  <text x="360" y="222" text-anchor="middle" font-size="11" fill="#a33a36" filter="url(#rough2)">o0 — o1</text>

  <rect x="440" y="170" width="230" height="70" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="555" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">后半段</text>
  <text x="555" y="222" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">o1 → … → o3</text>

  <path d="M 282 205 L 298 205" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 422 205 L 438 205" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <text x="360" y="278" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">欧拉迹：从 o2 出发，经过假边，最后到 o3；删掉假边 → 两条非空路径</text>

  <rect x="40" y="306" width="640" height="92" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <g font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">
    <text x="56" y="332">为什么假边不会在两端？欧拉迹的起点 o2、终点 o3 都不是假边的端点，所以假边只能出现在中间。</text>
    <text x="56" y="358">删掉假边后，前半段从 o2 到 o0，后半段从 o1 到 o3，两段都非空，且各是一段连续步行。</text>
    <text x="56" y="384">若 4 个奇度点分在两个连通块（每块 2 个），则每块各求一条欧拉迹，不需要假边。</text>
  </g>
</svg>
