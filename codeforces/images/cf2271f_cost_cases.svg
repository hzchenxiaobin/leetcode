<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" width="780" height="440" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6" />
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a" />
    </marker>
  </defs>
  <rect width="780" height="440" fill="#fafafa" filter="url(#rough2)" />

  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">一段的代价只能是 0 / 1 / 2：五种典型情形</text>
  <text x="390" y="52" text-anchor="middle" font-size="11.5" fill="#7a7a7a" filter="url(#rough2)">代价 = 两端改成 v 的次数 + 段内比 v 大的元素个数（取 v 使三者之和最小），红色格子是被改的位置</text>

  
  <text x="26" y="96" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">① 本来就好（0 次）</text>
  <text x="26" y="116" font-size="10.5" fill="#777" filter="url(#rough2)">a_l = a_r，内部没有更大的数</text>
  <g>
    <rect x="244" y="82" width="36" height="32" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)" />
    <rect x="288" y="82" width="36" height="32" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)" />
    <rect x="332" y="82" width="36" height="32" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)" />
    <rect x="376" y="82" width="36" height="32" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)" />
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle" fill="#3a3a3a">
    <text x="262" y="104" filter="url(#rough2)">5</text><text x="306" y="104" filter="url(#rough2)">3</text><text x="350" y="104" filter="url(#rough2)">2</text><text x="394" y="104" filter="url(#rough2)">5</text>
  </g>
  <path d="M424,98 L458,98" fill="none" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)" />
  <g>
    <rect x="468" y="82" width="36" height="32" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)" />
    <rect x="512" y="82" width="36" height="32" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)" />
    <rect x="556" y="82" width="36" height="32" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)" />
    <rect x="600" y="82" width="36" height="32" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)" />
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle" fill="#3a3a3a">
    <text x="486" y="104" filter="url(#rough2)">5</text><text x="530" y="104" filter="url(#rough2)">3</text><text x="574" y="104" filter="url(#rough2)">2</text><text x="618" y="104" filter="url(#rough2)">5</text>
  </g>
  <rect x="660" y="80" width="96" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)" />
  <text x="708" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">0 次</text>

  
  <text x="26" y="168" font-size="13" font-weight="bold" fill="#33517a" filter="url(#rough2)">② 左端就是最大值（1 次）</text>
  <text x="26" y="188" font-size="10.5" fill="#777" filter="url(#rough2)">a_l &gt; a_r，且内部都小于 a_l</text>
  <g>
    <rect x="244" y="154" width="36" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" />
    <rect x="288" y="154" width="36" height="32" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)" />
    <rect x="332" y="154" width="36" height="32" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)" />
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle" fill="#3a3a3a">
    <text x="262" y="176" filter="url(#rough2)">5</text><text x="306" y="176" filter="url(#rough2)">3</text><text x="350" y="176" filter="url(#rough2)">2</text>
  </g>
  <path d="M424,170 L458,170" fill="none" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)" />
  <g>
    <rect x="468" y="154" width="36" height="32" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)" />
    <rect x="512" y="154" width="36" height="32" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)" />
    <rect x="556" y="154" width="36" height="32" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)" />
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle" fill="#3a3a3a">
    <text x="486" y="176" filter="url(#rough2)">5</text><text x="530" y="176" filter="url(#rough2)">3</text><text x="574" y="176" fill="#a03a36" filter="url(#rough2)">5</text>
  </g>
  <rect x="660" y="152" width="96" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)" />
  <text x="708" y="176" text-anchor="middle" font-size="14" font-weight="bold" fill="#33517a" filter="url(#rough2)">1 次</text>

  
  <text x="26" y="240" font-size="13" font-weight="bold" fill="#33517a" filter="url(#rough2)">③ 右端就是最大值（1 次）</text>
  <text x="26" y="260" font-size="10.5" fill="#777" filter="url(#rough2)">a_r &gt; a_l，且内部都小于 a_r</text>
  <g>
    <rect x="244" y="226" width="36" height="32" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)" />
    <rect x="288" y="226" width="36" height="32" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)" />
    <rect x="332" y="226" width="36" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" />
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle" fill="#3a3a3a">
    <text x="262" y="248" filter="url(#rough2)">2</text><text x="306" y="248" filter="url(#rough2)">3</text><text x="350" y="248" filter="url(#rough2)">5</text>
  </g>
  <path d="M424,242 L458,242" fill="none" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)" />
  <g>
    <rect x="468" y="226" width="36" height="32" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)" />
    <rect x="512" y="226" width="36" height="32" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)" />
    <rect x="556" y="226" width="36" height="32" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)" />
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle" fill="#3a3a3a">
    <text x="486" y="248" fill="#a03a36" filter="url(#rough2)">5</text><text x="530" y="248" filter="url(#rough2)">3</text><text x="574" y="248" filter="url(#rough2)">5</text>
  </g>
  <rect x="660" y="224" width="96" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)" />
  <text x="708" y="248" text-anchor="middle" font-size="14" font-weight="bold" fill="#33517a" filter="url(#rough2)">1 次</text>

  
  <text x="26" y="312" font-size="13" font-weight="bold" fill="#33517a" filter="url(#rough2)">④ 只差内部一个（1 次）</text>
  <text x="26" y="332" font-size="10.5" fill="#777" filter="url(#rough2)">a_l = a_r，内部恰有一个更大的数</text>
  <g>
    <rect x="244" y="298" width="36" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" />
    <rect x="288" y="298" width="36" height="32" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)" />
    <rect x="332" y="298" width="36" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" />
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle" fill="#3a3a3a">
    <text x="262" y="320" filter="url(#rough2)">2</text><text x="306" y="320" filter="url(#rough2)">5</text><text x="350" y="320" filter="url(#rough2)">2</text>
  </g>
  <path d="M424,314 L458,314" fill="none" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)" />
  <g>
    <rect x="468" y="298" width="36" height="32" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)" />
    <rect x="512" y="298" width="36" height="32" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)" />
    <rect x="556" y="298" width="36" height="32" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)" />
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle" fill="#3a3a3a">
    <text x="486" y="320" filter="url(#rough2)">2</text><text x="530" y="320" fill="#a03a36" filter="url(#rough2)">1</text><text x="574" y="320" filter="url(#rough2)">2</text>
  </g>
  <rect x="660" y="296" width="96" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)" />
  <text x="708" y="320" text-anchor="middle" font-size="14" font-weight="bold" fill="#33517a" filter="url(#rough2)">1 次</text>

  
  <text x="26" y="384" font-size="13" font-weight="bold" fill="#a0761e" filter="url(#rough2)">⑤ 其余情况（2 次）</text>
  <text x="26" y="404" font-size="10.5" fill="#777" filter="url(#rough2)">两端都改成段内最大值，一步到位</text>
  <g>
    <rect x="244" y="370" width="36" height="32" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)" />
    <rect x="288" y="370" width="36" height="32" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)" />
    <rect x="332" y="370" width="36" height="32" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)" />
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle" fill="#3a3a3a">
    <text x="262" y="392" filter="url(#rough2)">2</text><text x="306" y="392" filter="url(#rough2)">7</text><text x="350" y="392" filter="url(#rough2)">3</text>
  </g>
  <path d="M424,386 L458,386" fill="none" stroke="#3a3a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)" />
  <g>
    <rect x="468" y="370" width="36" height="32" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)" />
    <rect x="512" y="370" width="36" height="32" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)" />
    <rect x="556" y="370" width="36" height="32" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)" />
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle" fill="#3a3a3a">
    <text x="486" y="392" fill="#a03a36" filter="url(#rough2)">7</text><text x="530" y="392" filter="url(#rough2)">7</text><text x="574" y="392" fill="#a03a36" filter="url(#rough2)">7</text>
  </g>
  <rect x="660" y="368" width="96" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)" />
  <text x="708" y="392" text-anchor="middle" font-size="14" font-weight="bold" fill="#a0761e" filter="url(#rough2)">2 次</text>

  <text x="390" y="430" text-anchor="middle" font-size="11" fill="#7a7a7a" filter="url(#rough2)">因为 2 次总够用，所以 dp[i] 只可能取 0、1、2；判代价 1 时只需看是否存在 dp[l-1] = 0 的转移</text>
</svg>