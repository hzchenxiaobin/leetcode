<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="320" fill="#fafafa"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">190B 的三种位置关系与“半空隙”</text>
  <path d="M 231.95 46 Q 380.0 52 528.05 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60.0" y="76.0" width="640.0" height="40.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="68.0" y="109.0" text-anchor="start" font-size="11.4" font-weight="bold" fill="#26405c" filter="url(#rough2)">关系</text>
  <text x="158.0" y="109.0" text-anchor="start" font-size="11.4" font-weight="bold" fill="#26405c" filter="url(#rough2)">判据</text>
  <text x="418.0" y="109.0" text-anchor="start" font-size="11.4" font-weight="bold" fill="#26405c" filter="url(#rough2)">gap</text>
  <text x="608.0" y="109.0" text-anchor="start" font-size="11.4" font-weight="bold" fill="#26405c" filter="url(#rough2)">答案</text>
  <path d="M 60.0 76.0 L 700.0 76.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="68.0" y="149.0" text-anchor="start" font-size="11.4" fill="#2b2b2b" filter="url(#rough2)">相离</text>
  <text x="158.0" y="149.0" text-anchor="start" font-size="11.4" fill="#2b2b2b" filter="url(#rough2)">d &gt; r₁ + r₂</text>
  <text x="418.0" y="149.0" text-anchor="start" font-size="11.4" fill="#2b2b2b" filter="url(#rough2)">d − r₁ − r₂</text>
  <text x="608.0" y="149.0" text-anchor="start" font-size="11.4" fill="#2b2b2b" filter="url(#rough2)">gap/2</text>
  <path d="M 60.0 116.0 L 700.0 116.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="68.0" y="189.0" text-anchor="start" font-size="11.4" fill="#2b2b2b" filter="url(#rough2)">相交</text>
  <text x="158.0" y="189.0" text-anchor="start" font-size="11.4" fill="#2b2b2b" filter="url(#rough2)">|r₁ − r₂| ≤ d ≤ r₁ + r₂</text>
  <text x="418.0" y="189.0" text-anchor="start" font-size="11.4" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="608.0" y="189.0" text-anchor="start" font-size="11.4" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <path d="M 60.0 156.0 L 700.0 156.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="68.0" y="229.0" text-anchor="start" font-size="11.4" fill="#2b2b2b" filter="url(#rough2)">内含</text>
  <text x="158.0" y="229.0" text-anchor="start" font-size="11.4" fill="#2b2b2b" filter="url(#rough2)">d &lt; |r₁ − r₂|</text>
  <text x="418.0" y="229.0" text-anchor="start" font-size="11.4" fill="#2b2b2b" filter="url(#rough2)">|r₁ − r₂| − d</text>
  <text x="608.0" y="229.0" text-anchor="start" font-size="11.4" fill="#2b2b2b" filter="url(#rough2)">gap/2</text>
  <path d="M 60.0 196.0 L 700.0 196.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <rect x="60.0" y="250.0" width="660.0" height="56.0" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="274.0" text-anchor="start" font-size="11.2" fill="#33506e" filter="url(#rough2)">只要 gap 为 0 就说明两圆有公共点，雷达半径 0 就够（把雷达放在交点上）。</text>
  <text x="74.0" y="296.0" text-anchor="start" font-size="11.2" fill="#33506e" filter="url(#rough2)">浮点：用 hypot 算 d，输出 15 位小数；误差 1e-6 即可。</text>
</svg>
