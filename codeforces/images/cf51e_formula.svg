<svg xmlns="http://www.w3.org/2000/svg" width="740" height="330" viewBox="0 0 740 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="fa" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="740" height="330" fill="#fafafa"/>

  <text x="370" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：两次矩阵乘法 + 一次减法</text>
  <path d="M 190 42 Q 370 48 550 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 盒子 1：邻接矩阵 -->
  <rect x="24" y="78" width="130" height="76" rx="8" fill="#eef3f8" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="89" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a68" filter="url(#rough2)">A</text>
  <text x="89" y="128" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">邻接矩阵</text>
  <text x="89" y="144" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">n ≤ 700</text>

  <!-- 盒子 2：A² -->
  <rect x="186" y="78" width="130" height="76" rx="8" fill="#eef3f8" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="251" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a68" filter="url(#rough2)">A²</text>
  <text x="251" y="128" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">(A²)_ij = i、j 的公共邻居数</text>
  <text x="251" y="144" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">O(n³)</text>

  <!-- 盒子 3：A³ -->
  <rect x="348" y="78" width="130" height="76" rx="8" fill="#eef3f8" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="413" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b4a68" filter="url(#rough2)">A³</text>
  <text x="413" y="128" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">(A³)_aa / 2 = T_a</text>
  <text x="413" y="144" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">过 a 的三角形数</text>

  <!-- 盒子 4：trace -->
  <rect x="510" y="78" width="200" height="76" rx="8" fill="#fdf6e6" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="610" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">tr(A⁵) = Σ_ij (A²)_ij·(A³)_ij</text>
  <text x="610" y="126" text-anchor="middle" font-size="10.5" fill="#8a6015" filter="url(#rough2)">= 长度 5 的闭合游走总数</text>
  <text x="610" y="144" text-anchor="middle" font-size="10.5" fill="#8a6015" filter="url(#rough2)">O(n²) 求和</text>

  <!-- 箭头 -->
  <path d="M 156 116 L 182 116" stroke="#446688" stroke-width="1.6" marker-end="url(#fa)" filter="url(#rough2)"/>
  <path d="M 318 116 L 344 116" stroke="#446688" stroke-width="1.6" marker-end="url(#fa)" filter="url(#rough2)"/>
  <path d="M 480 116 L 506 116" stroke="#446688" stroke-width="1.6" marker-end="url(#fa)" filter="url(#rough2)"/>

  <!-- 第二行：减法 -->
  <rect x="120" y="196" width="500" height="52" rx="8" fill="#fdf0ef" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="370" y="218" text-anchor="middle" font-size="13" font-weight="bold" fill="#8c3a37" filter="url(#rough2)">扣除 10 · Σ_a T_a · (deg_a − 1)</text>
  <text x="370" y="238" text-anchor="middle" font-size="10.5" fill="#8c3a37" filter="url(#rough2)">这一项正好等于「4 顶点型 10·ΣT_a(deg_a−2)」+「3 顶点型 30·三角形数」</text>

  <path d="M 610 158 L 610 176 L 386 176 L 386 192" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#fa)" filter="url(#rough2)"/>

  <!-- 第三行：答案 -->
  <rect x="240" y="268" width="260" height="44" rx="8" fill="#f4f8ee" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="370" y="296" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5223" filter="url(#rough2)">答案 = ( tr(A⁵) − 10ΣT_a(deg_a−1) ) / 10</text>
  <path d="M 370 250 L 370 264" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#fa)" filter="url(#rough2)"/>
</svg>
