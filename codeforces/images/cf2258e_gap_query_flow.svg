<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#55606e"/>
    </marker>
  </defs>
  <rect width="760" height="500" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：切空洞 + 离线「最后出现位置」线段树</text>
  <path d="M 78 41 Q 380 48 682 41" stroke="#2b2b2b" stroke-width="1.1" fill="none" filter="url(#rough2)"/>

  <!-- ============ 步骤 1 ============ -->
  <rect x="22" y="54" width="446" height="60" rx="9" fill="#f7fbff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <circle cx="46" cy="84" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="46" y="89" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66">1</text>
    <text x="70" y="80" font-size="12.5" fill="#2f4a66">筛出所有素数幂 pp（≤ 2n，约 3.4×10⁴ 个），并对每个 a_i</text>
    <text x="70" y="101" font-size="12.5" fill="#2f4a66">分解出它的素数幂因子（≤ 18 个）</text>
  </g>

  <path d="M 245 114 L 245 130" stroke="#55606e" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>

  <!-- ============ 步骤 2 ============ -->
  <rect x="22" y="134" width="446" height="60" rx="9" fill="#eef7f0" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <circle cx="46" cy="164" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="46" y="169" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e">2</text>
    <text x="70" y="160" font-size="12.5" fill="#3c5e2e">求 f(1,n) 当上界：所有元素能覆盖的素数幂打标记，</text>
    <text x="70" y="181" font-size="12.5" fill="#3c5e2e">pp 中第一个没被标记的素数幂就是 f(1,n)，答案 ≤ 它</text>
  </g>

  <path d="M 245 194 L 245 210" stroke="#55606e" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>

  <!-- ============ 步骤 3 ============ -->
  <rect x="22" y="214" width="446" height="60" rx="9" fill="#fffdf5" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <circle cx="46" cy="244" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="46" y="249" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6520">3</text>
    <text x="70" y="240" font-size="12.5" fill="#5a4420">对每个候选素数幂 q ≤ f(1,n)：把「a_i 是 q 的倍数」的位置</text>
    <text x="70" y="261" font-size="12.5" fill="#5a4420">记为墙，墙把 [1,n] 切成若干极大空洞</text>
  </g>

  <path d="M 245 274 L 245 290" stroke="#55606e" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>

  <!-- ============ 步骤 4/5 ============ -->
  <rect x="22" y="294" width="446" height="82" rx="9" fill="#fdf3f5" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <circle cx="46" cy="324" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="46" y="329" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8f3a36">4</text>
    <text x="70" y="320" font-size="12.5" fill="#8f3a36">按右端点 R 扫一遍：把 a_R 的素数幂因子的 last 更新成 R；</text>
    <text x="70" y="341" font-size="12.5" fill="#8f3a36">再回答右端点为 R 的空洞 [L,R]：查询「最左的 last_s &lt; L」得 f</text>
    <text x="70" y="362" font-size="12.5" font-weight="bold" fill="#8f3a36">f ≥ q 就说明 q 可达，记入答案</text>
  </g>

  <!-- ============ 右侧：线段树示意 ============ -->
  <rect x="484" y="54" width="258" height="258" rx="10" fill="#fbfbff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="613" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">线段树：下标 = 素数幂，值 = last</text>

  <g filter="url(#rough2)">
    <rect x="496" y="90" width="34" height="30" rx="4" fill="#f1f1f6" stroke="#446688" stroke-width="1.2"/>
    <text x="513" y="110" text-anchor="middle" font-size="11.5" fill="#2f4a66">2</text>
    <text x="513" y="136" text-anchor="middle" font-size="11" fill="#55606e">9</text>
    <rect x="536" y="90" width="34" height="30" rx="4" fill="#f1f1f6" stroke="#446688" stroke-width="1.2"/>
    <text x="553" y="110" text-anchor="middle" font-size="11.5" fill="#2f4a66">3</text>
    <text x="553" y="136" text-anchor="middle" font-size="11" fill="#55606e">7</text>
    <rect x="576" y="90" width="34" height="30" rx="4" fill="#f1f1f6" stroke="#446688" stroke-width="1.2"/>
    <text x="593" y="110" text-anchor="middle" font-size="11.5" fill="#2f4a66">4</text>
    <text x="593" y="136" text-anchor="middle" font-size="11" fill="#55606e">4</text>
    <rect x="616" y="90" width="34" height="30" rx="4" fill="#f1f1f6" stroke="#446688" stroke-width="1.2"/>
    <text x="633" y="110" text-anchor="middle" font-size="11.5" fill="#2f4a66">5</text>
    <text x="633" y="136" text-anchor="middle" font-size="11" fill="#55606e">6</text>
    <rect x="656" y="90" width="34" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="673" y="110" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8f3a36">7</text>
    <text x="673" y="136" text-anchor="middle" font-size="11" font-weight="bold" fill="#8f3a36">0</text>
    <rect x="696" y="90" width="34" height="30" rx="4" fill="#f1f1f6" stroke="#446688" stroke-width="1.2"/>
    <text x="713" y="110" text-anchor="middle" font-size="11.5" fill="#2f4a66">8</text>
    <text x="713" y="136" text-anchor="middle" font-size="11" fill="#55606e">2</text>
  </g>

  <g filter="url(#rough2)">
    <text x="613" y="170" text-anchor="middle" font-size="12" fill="#2f4a66">查询 L = 5：要找 last_s &lt; 5 的最左下标</text>
    <text x="613" y="192" text-anchor="middle" font-size="12" fill="#55606e">2,3,4,5 的 last 都 ≥ 5（空洞里都有倍数）</text>
    <text x="613" y="214" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">7 的 last = 0 &lt; 5 ⇒ f(空洞) = 7</text>
    <text x="613" y="240" text-anchor="middle" font-size="11.5" fill="#55606e">树上二分：每层看左儿子的 min 是否 &lt; L，</text>
    <text x="613" y="259" text-anchor="middle" font-size="11.5" fill="#55606e">成立就向左走，否则向右 —— O(log)</text>
    <text x="613" y="283" text-anchor="middle" font-size="11.5" fill="#55606e">last_s(R) = 最后一个 ≤ R 的 s 的倍数位置</text>
    <text x="613" y="302" text-anchor="middle" font-size="11.5" fill="#55606e">s 在 [L,R] 有倍数 ⟺ last_s(R) ≥ L</text>
  </g>

  <!-- ============ 底部：复杂度 ============ -->
  <rect x="22" y="390" width="720" height="94" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <text x="382" y="416" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66">复杂度账本</text>
    <text x="382" y="440" text-anchor="middle" font-size="12.5" fill="#2f4a66">墙的总数 = Σ_i #{q 是素数幂且 q | a_i} ≤ 18n（每个 a_i 的素数幂因子 ≤ 18 个）</text>
    <text x="382" y="462" text-anchor="middle" font-size="12.5" fill="#2f4a66">空洞总数 = O(n log n)；每个空洞一次 O(log P) 查询，P ≈ 3.4×10⁴</text>
    <text x="382" y="482" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e">总时间 O((n + ΣΩ(a_i)) log P)，空间 O(n + P)</text>
  </g>
</svg>
