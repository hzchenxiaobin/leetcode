<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="515"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="420" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">198E：按距离排序 + 线段树按质量弹出</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="60.0" y="96.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">按距离升序排成一列；查询 (p,r) 取距离前缀 [0,idx)</text>
  <rect x="90.0" y="130.0" width="60.0" height="44.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
  <text x="120.0" y="158.0" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <rect x="160.0" y="130.0" width="60.0" height="44.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
  <text x="190.0" y="158.0" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <rect x="230.0" y="130.0" width="60.0" height="44.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
  <text x="260.0" y="158.0" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <rect x="300.0" y="130.0" width="60.0" height="44.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
  <text x="330.0" y="158.0" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <rect x="370.0" y="130.0" width="60.0" height="44.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
  <text x="400.0" y="158.0" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <rect x="440.0" y="130.0" width="60.0" height="44.0" fill="#ffffff" stroke="#cccccc" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
  <text x="470.0" y="158.0" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <rect x="510.0" y="130.0" width="60.0" height="44.0" fill="#ffffff" stroke="#cccccc" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
  <text x="540.0" y="158.0" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">6</text>
  <rect x="580.0" y="130.0" width="60.0" height="44.0" fill="#ffffff" stroke="#cccccc" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
  <text x="610.0" y="158.0" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">7</text>
  <line x1="90.0" y1="196.0" x2="430.0" y2="196.0" stroke="#8a6015" stroke-width="2.0" filter="url(#rough2)"/>
  <text x="265.0" y="216.0" text-anchor="middle" font-size="10.5" fill="#8a6015" filter="url(#rough2)">距离 ≤ r 的前缀</text>
  <rect x="60.0" y="250.0" width="600.0" height="80.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="74.0" y="273.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">线段树节点存「按质量升序的 (质量, id)」与指针</text>
  <text x="74.0" y="299.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">把前缀分解为 O(log n) 个节点，逐节点弹出质量 ≤ p 的点</text>
</svg>
