<svg xmlns="http://www.w3.org/2000/svg" width="700" height="360" viewBox="0 0 700 360"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="201"/>
    <feDisplacementMap in="SourceGraphic" scale="1.5"/></filter></defs>
  <rect width="700" height="360" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">三种操作，只需要维护「总和」与「每个位置的值」</text>
  <path d="M 130 40 Q 350 46 570 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="60" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="13" fill="#22314a" filter="url(#rough2)">① 前 a 个各加 x：sum += x·a；并对 [1,a] 做一次「区间加 x」</text>
  <text x="76" y="104" font-size="12" fill="#2f4a66" filter="url(#rough2)">（用树状数组做区间加 + 单点查，O(log n)）</text>
  <g filter="url(#rough2)"><rect x="60" y="126" width="580" height="52" rx="8" fill="#e8f4e0" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="150" font-size="13" fill="#2f5223" filter="url(#rough2)">② 末尾追加 k：sum += k；新位置的基础值 base[sz] = k − 该位置的累计区间加</text>
  <text x="76" y="170" font-size="12" fill="#3c5e2e" filter="url(#rough2)">（必须减去，否则会继承"上一世"的残留区间加）</text>
  <g filter="url(#rough2)"><rect x="60" y="186" width="580" height="52" rx="8" fill="#fbeeee" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="76" y="210" font-size="13" fill="#8a3a36" filter="url(#rough2)">③ 删末尾：sum −= (base[sz] + 该位置累计加)，sz−−</text>
  <text x="76" y="230" font-size="12" fill="#8a3a36" filter="url(#rough2)">（只减不加回，因为被删的元素永远不会再被查）</text>
  <g filter="url(#rough2)"><rect x="60" y="246" width="580" height="98" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="76" y="270" font-size="13" fill="#8a6015" filter="url(#rough2)">每次操作后输出 sum / sz（保留 6 位小数）。</text>
  <text x="76" y="294" font-size="12.5" fill="#8a6015" filter="url(#rough2)">样例 1：2 1 → [0,1] avg 0.5；3 → [0] avg 0；2 3 → [0,3] avg 1.5；</text>
  <text x="76" y="316" font-size="12.5" fill="#8a6015" filter="url(#rough2)">2 1 → [0,3,1] avg 1.333333；3 → [0,3] avg 1.5 ✓</text>
  <text x="76" y="338" font-size="11.5" fill="#8a6015" filter="url(#rough2)">复杂度 O(n log n)，n ≤ 2·10⁵。</text>
</svg>
