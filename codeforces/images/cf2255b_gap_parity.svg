<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="900" height="440" fill="#fafafa"/>

  <text x="450" y="34" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">空隙按下标奇偶分成两组：组内零可任意搬运，组间互不影响</text>

  <!-- d 示意 -->
  <text x="72" y="86" font-size="18" fill="#333" filter="url(#rough2)">d =</text>
  <rect x="118" y="60" width="42" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="139" y="89" text-anchor="middle" font-size="18" fill="#33506b" filter="url(#rough2)">0</text>
  <rect x="166" y="60" width="42" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="187" y="89" text-anchor="middle" font-size="18" fill="#33506b" filter="url(#rough2)">0</text>
  <rect x="214" y="60" width="42" height="42" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="235" y="89" text-anchor="middle" font-size="18" fill="#8a6420" filter="url(#rough2)">1</text>
  <rect x="262" y="60" width="42" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="283" y="89" text-anchor="middle" font-size="18" fill="#33506b" filter="url(#rough2)">0</text>
  <rect x="310" y="60" width="42" height="42" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="331" y="89" text-anchor="middle" font-size="18" fill="#8a6420" filter="url(#rough2)">1</text>
  <rect x="358" y="60" width="42" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="379" y="89" text-anchor="middle" font-size="18" fill="#33506b" filter="url(#rough2)">0</text>

  <text x="424" y="80" font-size="15" fill="#555" filter="url(#rough2)">k = 2 个「1」把 d 切成 3 段空隙</text>
  <text x="424" y="104" font-size="15" fill="#555" filter="url(#rough2)">a₀ = 2　a₁ = 1　a₂ = 1</text>

  <!-- 偶数组 -->
  <rect x="56" y="140" width="408" height="152" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="260" y="168" text-anchor="middle" font-size="16" fill="#33506b" filter="url(#rough2)">偶数组：E = a₀ + a₂ = 3，共 c_e = 2 个空隙</text>
  <rect x="92" y="184" width="132" height="46" rx="7" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="158" y="213" text-anchor="middle" font-size="17" fill="#33506b" filter="url(#rough2)">a₀ = 2</text>
  <rect x="292" y="184" width="132" height="46" rx="7" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="358" y="213" text-anchor="middle" font-size="17" fill="#33506b" filter="url(#rough2)">a₂ = 1</text>
  <path d="M230,207 L286,207" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="260" y="262" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">a₀ += 1、a₂ −= 1 一步可完成（取 j = i + 2）</text>
  <text x="260" y="282" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">沿 i, i+2, i+4 … 这条链来回搬，即可任意分配</text>

  <!-- 奇数组 -->
  <rect x="492" y="140" width="352" height="152" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="668" y="168" text-anchor="middle" font-size="16" fill="#3f6633" filter="url(#rough2)">奇数组：O = a₁ = 1，共 c_o = 1 个空隙</text>
  <rect x="602" y="184" width="132" height="46" rx="7" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="668" y="213" text-anchor="middle" font-size="17" fill="#3f6633" filter="url(#rough2)">a₁ = 1</text>
  <text x="668" y="266" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">只有一个空隙，没有可搬运的对象</text>
  <text x="668" y="288" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">所以这一组只有 1 种方案</text>

  <!-- 结果 -->
  <rect x="56" y="312" width="270" height="72" rx="9" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="191" y="340" text-anchor="middle" font-size="15" fill="#33506b" filter="url(#rough2)">偶数组：C(E + c_e − 1, c_e − 1)</text>
  <text x="191" y="366" text-anchor="middle" font-size="16" fill="#b85450" filter="url(#rough2)">= C(3 + 1, 1) = 4</text>
  <rect x="342" y="312" width="270" height="72" rx="9" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="477" y="340" text-anchor="middle" font-size="15" fill="#3f6633" filter="url(#rough2)">奇数组：C(O + c_o − 1, c_o − 1)</text>
  <text x="477" y="366" text-anchor="middle" font-size="16" fill="#b85450" filter="url(#rough2)">= C(1 + 0, 0) = 1</text>
  <rect x="628" y="312" width="216" height="72" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="736" y="344" text-anchor="middle" font-size="16" fill="#8f3a36" filter="url(#rough2)">答案 = 4 × 1 = 4</text>
  <text x="736" y="368" text-anchor="middle" font-size="13" fill="#8f3a36" filter="url(#rough2)">与 d = 001010 的枚举一致</text>

  <text x="450" y="416" text-anchor="middle" font-size="14" fill="#666" filter="url(#rough2)">两个组的和 E、O 都是操作的不变量 —— 它们是唯一的两个不变量，答案就由它们决定</text>
</svg>
