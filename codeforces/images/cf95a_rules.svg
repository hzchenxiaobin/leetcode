<svg xmlns="http://www.w3.org/2000/svg" width="740" height="360" viewBox="0 0 740 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="740" height="360" fill="#fafafa"/>

  <text x="370" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两个细节：大小写保持 &amp; 只替换一遍</text>
  <path d="M 148 39 Q 370 45 592 39" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="40" y="56" width="320" height="110" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="56" y="80" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">① 只改字母，不改大小写</text>
  <text x="56" y="104" text-anchor="start" font-size="12" fill="#2f4a66" filter="url(#rough2)">目标字母 t → 大写位置写 T</text>
  <text x="56" y="126" text-anchor="start" font-size="12" fill="#2f4a66" filter="url(#rough2)">原文 "Lucky" 的 u 变成 T 之后，</text>
  <text x="56" y="148" text-anchor="start" font-size="12" fill="#2f4a66" filter="url(#rough2)">是 "Ltcky" 而不是 "Lucky" 的小写形式</text>
  <rect x="390" y="56" width="320" height="110" rx="8" fill="#e9f4ec" stroke="#3f6b4a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="406" y="80" text-anchor="start" font-size="12.5" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">② 查找是大小写无关的</text>
  <text x="406" y="104" text-anchor="start" font-size="12" fill="#3f6b4a" filter="url(#rough2)">"aBC" 与 "ABc" 视为相同</text>
  <text x="406" y="126" text-anchor="start" font-size="12" fill="#3f6b4a" filter="url(#rough2)">所以先把 w 和所有模式都转小写</text>
  <text x="406" y="148" text-anchor="start" font-size="12" fill="#3f6b4a" filter="url(#rough2)">再找出现位置（|w| ≤ 100，暴力即可）</text>
  <rect x="40" y="186" width="670" height="70" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="210" text-anchor="start" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">“只做一遍”很关键：替换之后可能又拼出新的禁用串，但题面说不再处理。</text>
  <text x="56" y="232" text-anchor="start" font-size="12" fill="#7a5a1b" filter="url(#rough2)">如果实现成“反复替换直到没有禁用串”，样例 1 的答案就会变（甚至死循环）。</text>
  <rect x="40" y="268" width="670" height="56" rx="8" fill="#f7ecec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="56" y="292" text-anchor="start" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">样例 3：w = "abAcaba"，模式 = aCa / cba，目标字母 = c → 输出 abCacba</text>
  <text x="56" y="314" text-anchor="start" font-size="12" fill="#8a3b37" filter="url(#rough2)">（"aCa" 大小写无关地匹配位置 5–7，其中 a 变成 C 时保留大写形式）</text>
</svg>
