<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="400" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="38" text-anchor="middle" font-size="18.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">28B：样例 2 的连通块（n=7, d=4 6 6 1 6 6 1）</text>
  <path d="M 137 50 Q 380 56 623 50" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="88" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">每个位置的 d_i 决定它连向哪些位置；把边画出来分成连通块：</text>
  <line x1="110" y1="300" x2="110" y2="300" stroke="#2b2b2b" stroke-width="1" filter="url(#rough2)"/>
  <rect x="80" y="286" width="60" height="44" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="110" y="314" text-anchor="middle" font-size="13" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="110" y="268" text-anchor="middle" font-size="10.5" fill="#8a8a8a" font-weight="normal" filter="url(#rough2)">d=4</text>
  <line x1="200" y1="300" x2="200" y2="300" stroke="#2b2b2b" stroke-width="1" filter="url(#rough2)"/>
  <rect x="170" y="286" width="60" height="44" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="314" text-anchor="middle" font-size="13" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="200" y="268" text-anchor="middle" font-size="10.5" fill="#8a8a8a" font-weight="normal" filter="url(#rough2)">d=6</text>
  <line x1="290" y1="300" x2="290" y2="300" stroke="#2b2b2b" stroke-width="1" filter="url(#rough2)"/>
  <rect x="260" y="286" width="60" height="44" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="314" text-anchor="middle" font-size="13" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="290" y="268" text-anchor="middle" font-size="10.5" fill="#8a8a8a" font-weight="normal" filter="url(#rough2)">d=6</text>
  <line x1="380" y1="300" x2="380" y2="300" stroke="#2b2b2b" stroke-width="1" filter="url(#rough2)"/>
  <rect x="350" y="286" width="60" height="44" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="314" text-anchor="middle" font-size="13" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="380" y="268" text-anchor="middle" font-size="10.5" fill="#8a8a8a" font-weight="normal" filter="url(#rough2)">d=1</text>
  <line x1="470" y1="300" x2="470" y2="300" stroke="#2b2b2b" stroke-width="1" filter="url(#rough2)"/>
  <rect x="440" y="286" width="60" height="44" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="470" y="314" text-anchor="middle" font-size="13" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="470" y="268" text-anchor="middle" font-size="10.5" fill="#8a8a8a" font-weight="normal" filter="url(#rough2)">d=6</text>
  <line x1="560" y1="300" x2="560" y2="300" stroke="#2b2b2b" stroke-width="1" filter="url(#rough2)"/>
  <rect x="530" y="286" width="60" height="44" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="560" y="314" text-anchor="middle" font-size="13" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="560" y="268" text-anchor="middle" font-size="10.5" fill="#8a8a8a" font-weight="normal" filter="url(#rough2)">d=6</text>
  <line x1="650" y1="300" x2="650" y2="300" stroke="#2b2b2b" stroke-width="1" filter="url(#rough2)"/>
  <rect x="620" y="286" width="60" height="44" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="650" y="314" text-anchor="middle" font-size="13" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="650" y="268" text-anchor="middle" font-size="10.5" fill="#8a8a8a" font-weight="normal" filter="url(#rough2)">d=1</text>
  <path d="M 110 330 Q 290 362 470 330" stroke="#8a5a44" stroke-width="1.4" fill="none" marker-end="url(#arr)" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <path d="M 290 330 Q 335 380 380 330" stroke="#8a5a44" stroke-width="1.4" fill="none" marker-end="url(#arr)" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <path d="M 380 330 Q 425 380 470 330" stroke="#8a5a44" stroke-width="1.4" fill="none" marker-end="url(#arr)" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <path d="M 560 330 Q 605 380 650 330" stroke="#8a5a44" stroke-width="1.4" fill="none" marker-end="url(#arr)" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="60" y="148" text-anchor="start" font-size="13" fill="#2f5223" font-weight="bold" filter="url(#rough2)">连通块：{1,4,7}、{2,5}、{3}、{6}</text>
  <text x="60" y="178" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">目标排列 4 3 5 1 2 7 6：</text>
  <text x="60" y="204" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">位置 1 要放 4：4 在块 {1,4,7} 里，1 也在 → ✓</text>
  <text x="60" y="228" text-anchor="start" font-size="12" fill="#b6483f" font-weight="bold" filter="url(#rough2)">位置 2 要放 3：3 在块 {3} 里，而 2 在 {2,5} → ✗ 不连通</text>
  <text x="60" y="372" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">所以样例 2 输出 NO；样例 3 把位置 2 的目标改成 2 后所有值都在自己的块里 → YES。</text>
</svg>
