<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1：a = [3, 2, −1, 2, 11]，v = [−1, 2, 3, 11]</text>
  <path d="M 115 44 Q 360 50 605 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 列头 -->
  <g font-size="13" font-weight="bold" fill="#2f4a66" text-anchor="middle" filter="url(#rough2)">
    <text x="222" y="78">−1</text><text x="326" y="78">2</text>
    <text x="430" y="78">3</text><text x="534" y="78">11</text>
  </g>
  <!-- 行标签 -->
  <g font-size="12" fill="#555" text-anchor="end" filter="url(#rough2)">
    <text x="160" y="110">a = 3</text>
    <text x="160" y="150">a = 2</text>
    <text x="160" y="190">a = −1</text>
    <text x="160" y="230">a = 2</text>
    <text x="160" y="270">a = 11</text>
  </g>

  <!-- 表格 -->
  <g fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)">
    <rect x="170" y="86" width="104" height="40"/><rect x="274" y="86" width="104" height="40"/>
    <rect x="378" y="86" width="104" height="40"/><rect x="482" y="86" width="104" height="40"/>
    <rect x="170" y="126" width="104" height="40"/><rect x="274" y="126" width="104" height="40"/>
    <rect x="378" y="126" width="104" height="40"/><rect x="482" y="126" width="104" height="40"/>
    <rect x="170" y="166" width="104" height="40"/><rect x="274" y="166" width="104" height="40"/>
    <rect x="378" y="166" width="104" height="40"/><rect x="482" y="166" width="104" height="40"/>
    <rect x="170" y="206" width="104" height="40"/><rect x="274" y="206" width="104" height="40"/>
    <rect x="378" y="206" width="104" height="40"/><rect x="482" y="206" width="104" height="40"/>
    <rect x="170" y="246" width="104" height="40"/><rect x="274" y="246" width="104" height="40"/>
    <rect x="378" y="246" width="104" height="40"/><rect x="482" y="246" width="104" height="40"/>
  </g>
  <rect x="482" y="246" width="104" height="40" fill="#fde8e8" opacity="0.9" filter="url(#rough2)"/>

  <g font-size="14" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">
    <text x="222" y="112">4</text><text x="326" y="112">1</text><text x="430" y="112">0</text><text x="534" y="112">8</text>
    <text x="222" y="152">7</text><text x="326" y="152">1</text><text x="430" y="152">1</text><text x="534" y="152">9</text>
    <text x="222" y="192">7</text><text x="326" y="192">4</text><text x="430" y="192">5</text><text x="534" y="192">13</text>
    <text x="222" y="232">10</text><text x="326" y="232">4</text><text x="430" y="232">5</text><text x="534" y="232">13</text>
    <text x="222" y="272">22</text><text x="326" y="272">13</text><text x="430" y="272">12</text>
  </g>
  <text x="534" y="272" text-anchor="middle" font-size="15" font-weight="bold" fill="#a33a36" filter="url(#rough2)">4</text>

  <text x="598" y="150" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">← 每行先</text>
  <text x="598" y="168" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">做前缀最小</text>

  <text x="30" y="320" font-size="12" fill="#2b2b2b" filter="url(#rough2)">最后一行最小值 = 4，出现在第 4 列（v = 11）。</text>
  <text x="30" y="350" font-size="12" fill="#2b2b2b" filter="url(#rough2)">一组最优解 b = [2, 2, 2, 2, 11]，代价 1 + 0 + 3 + 0 + 0 = 4。</text>
  <text x="30" y="380" font-size="12" fill="#2b2b2b" filter="url(#rough2)">对照 b = [1, 1, 1, 1, 11] 代价 2+1+2+1+0 = 6，DP 自动避开。</text>
</svg>
