<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="479"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="300" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">B：两个样例的验证过程</text>
  <path d="M 200 40 Q 380 45 560 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <rect x="36" y="64" width="688" height="98" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="48" y="88" font-size="11.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">样例 1：A&gt;B，C&lt;B，A&gt;C</text>
  <text x="48" y="112" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">C&lt;B 即 B&gt;C；加上 A&gt;B、A&gt;C ⇒ 从轻到重：C，B，A</text>
  <text x="48" y="134" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">检验排列 CBA：C 最轻 ✓，B 中间 ✓，A 最重 ✓</text>
  <text x="48" y="154" font-size="10.5" fill="#2f5223" font-family="'Courier New',monospace" filter="url(#rough2)">输出 CBA</text>

  <rect x="36" y="176" width="688" height="98" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="48" y="200" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">样例 2：A&lt;B，B&gt;C，C&gt;A</text>
  <text x="48" y="224" font-size="10.5" fill="#3c5e88" filter="url(#rough2)">A&lt;B ⇒ A 比 B 轻；B&gt;C ⇒ C 比 B 轻；C&gt;A ⇒ A 比 C 轻</text>
  <text x="48" y="246" font-size="10.5" fill="#3c5e88" filter="url(#rough2)">于是 A &lt; C &lt; B（A 最轻）</text>
  <text x="48" y="266" font-size="10.5" fill="#2f4a66" font-family="'Courier New',monospace" filter="url(#rough2)">输出 ACB</text>

  <text x="380" y="292" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">若三条比较构成环（如 A&gt;B、B&gt;C、C&gt;A），6 种排列都通不过 ⇒ Impossible。</text>
</svg>
