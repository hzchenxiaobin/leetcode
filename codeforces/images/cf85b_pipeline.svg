  <text x="440" y="324" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">每个人按到达顺序依次经过三段；同一段有 k 个窗口并行</text>
  <text x="440" y="350" text-anchor="middle" font-size="12" fill="#8a2b28" filter="url(#rough2)">完成时刻 = max(上一段结束, 最早空出的窗口) + t；答案 = max(完成 − 到达) = 13（第 5 人）</text>
  <text x="440" y="376" text-anchor="middle" font-size="11.5" fill="#3d6b2f" filter="url(#rough2)">同段窗口完全相同、服务时间相同 ⇒ 按到达顺序（FIFO）服务对每个人都是最优</text>
