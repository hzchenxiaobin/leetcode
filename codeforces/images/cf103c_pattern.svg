<svg xmlns="http://www.w3.org/2000/svg" width="880" height="404" viewBox="0 0 880 404"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="103"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/></marker>
  </defs>
  <rect width="880" height="404" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">最优串的形状：最长的一串点 + 交替段</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">点更小，所以答案要让开头的点尽量多</text>
  <text x="150" y="128" text-anchor="end" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">n=5, k=2</text>
  <g filter="url(#rough2)"><rect x="180" y="100" width="50" height="42" rx="3" fill="#d7ecd0" fill-opacity="0.65" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="205" y="128" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">.</text>
  <g filter="url(#rough2)"><rect x="236" y="100" width="50" height="42" rx="3" fill="#d7ecd0" fill-opacity="0.65" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="261" y="128" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">.</text>
  <g filter="url(#rough2)"><rect x="292" y="100" width="50" height="42" rx="3" fill="#d7ecd0" fill-opacity="0.65" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="317" y="128" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">.</text>
  <g filter="url(#rough2)"><rect x="348" y="100" width="50" height="42" rx="3" fill="#f6d9d7" fill-opacity="0.65" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="373" y="128" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">X</text>
  <g filter="url(#rough2)"><rect x="404" y="100" width="50" height="42" rx="3" fill="#f6d9d7" fill-opacity="0.65" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="429" y="128" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">X</text>
  <text x="476" y="128" text-anchor="start" font-size="11" fill="#777777" filter="url(#rough2)">len=5</text>
  <text x="150" y="192" text-anchor="end" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">n=6, k=3</text>
  <g filter="url(#rough2)"><rect x="180" y="164" width="50" height="42" rx="3" fill="#d7ecd0" fill-opacity="0.65" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="205" y="192" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">.</text>
  <g filter="url(#rough2)"><rect x="236" y="164" width="50" height="42" rx="3" fill="#f6d9d7" fill-opacity="0.65" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="261" y="192" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">X</text>
  <g filter="url(#rough2)"><rect x="292" y="164" width="50" height="42" rx="3" fill="#d7ecd0" fill-opacity="0.65" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="317" y="192" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">.</text>
  <g filter="url(#rough2)"><rect x="348" y="164" width="50" height="42" rx="3" fill="#f6d9d7" fill-opacity="0.65" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="373" y="192" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">X</text>
  <g filter="url(#rough2)"><rect x="404" y="164" width="50" height="42" rx="3" fill="#d7ecd0" fill-opacity="0.65" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="429" y="192" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">.</text>
  <g filter="url(#rough2)"><rect x="460" y="164" width="50" height="42" rx="3" fill="#f6d9d7" fill-opacity="0.65" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="485" y="192" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">X</text>
  <text x="532" y="192" text-anchor="start" font-size="11" fill="#777777" filter="url(#rough2)">len=6</text>
  <text x="150" y="256" text-anchor="end" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">n=3, k=1</text>
  <g filter="url(#rough2)"><rect x="180" y="228" width="50" height="42" rx="3" fill="#d7ecd0" fill-opacity="0.65" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="205" y="256" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">.</text>
  <g filter="url(#rough2)"><rect x="236" y="228" width="50" height="42" rx="3" fill="#d7ecd0" fill-opacity="0.65" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="261" y="256" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">.</text>
  <g filter="url(#rough2)"><rect x="292" y="228" width="50" height="42" rx="3" fill="#f6d9d7" fill-opacity="0.65" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="317" y="256" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">X</text>
  <text x="364" y="256" text-anchor="start" font-size="11" fill="#777777" filter="url(#rough2)">len=3</text>
  <g filter="url(#rough2)"><rect x="80" y="300" width="724" height="44" rx="4" fill="#ffffff" fill-opacity="0.0" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="5 4"/></g>
  <text x="442" y="328" text-anchor="middle" font-size="12.5" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">结构：'.'×lead  + 'X' + ('.X')×oddRem + 'X'×zeros</text>
  <text x="442" y="372" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">G &lt; k：lead=1, oddRem=G−1, zeros=k−G（所有点都隔离）</text>
  <text x="442" y="396" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">G ≥ k：G−k 偶 → lead=G−k+1, oddRem=k−1, zeros=0；奇 → lead=G−k+2, oddRem=k−2, zeros=1</text>
</svg>
