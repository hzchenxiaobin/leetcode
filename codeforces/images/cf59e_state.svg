<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c9801f"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a8524a"/>
    </marker>
  </defs>
  <rect width="760" height="470" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">为什么状态必须记住「上一步」</text>
  <path d="M 80 214 L 250 96" stroke="#9aa3b2" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 80 214 L 250 330" stroke="#9aa3b2" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 250 96 L 450 214" stroke="#9aa3b2" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 250 330 L 450 214" stroke="#9aa3b2" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 450 214 L 650 214" stroke="#9aa3b2" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <rect x="52.0" y="190.0" width="56.0" height="48.0" rx="24" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80.0" y="221.0" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="222.0" y="72.0" width="56.0" height="48.0" rx="24" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250.0" y="103.0" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="222.0" y="306.0" width="56.0" height="48.0" rx="24" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250.0" y="337.0" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="422.0" y="190.0" width="56.0" height="48.0" rx="24" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="450.0" y="221.0" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="622.0" y="190.0" width="56.0" height="48.0" rx="24" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="650.0" y="221.0" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="498.0" y="64.0" width="252.0" height="94.0" rx="8" fill="#fbeeee" stroke="#a8524a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="624.0" y="88.0" text-anchor="middle" font-size="12.5" fill="#a8524a" font-weight="bold" filter="url(#rough2)">禁咒 (2, 5, 7)</text>
  <text x="624.0" y="112.0" text-anchor="middle" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">前缀 1→2→5 不能再去 7</text>
  <text x="624.0" y="136.0" text-anchor="middle" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">但 1→3→5→7 完全合法</text>
  <text x="380.0" y="392.0" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">「来自 2」与「来自 3」都停在 5 号城市，可继续往前走的路却不同。</text>
  <rect x="40.0" y="408.0" width="680.0" height="50.0" rx="8" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.5" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="56.0" y="430.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">只按城市建状态的 BFS 会把这两条前缀混为一谈，从而误判可达性；</text>
  <text x="56.0" y="450.0" text-anchor="start" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">正确状态是有向边 (prev, cur)，一共 2m 个 —— 后续是否合法只取决于最后两座城市。</text>
</svg>
