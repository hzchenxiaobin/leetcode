<svg xmlns="http://www.w3.org/2000/svg" width="780" height="510" viewBox="0 0 780 510"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr125d2" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arr125d3" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="780" height="510" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">扫描时的状态：一条「已锁定」，另一条只有 0 或 1 项</text>
  <path d="M 130 40 Q 390 48 650 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 初始 -->
  <g filter="url(#rough2)">
    <rect x="300" y="58" width="180" height="44" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="390" y="86" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f4a66">枚举前 3 个元素的归属</text>
  </g>
  <text x="492" y="84" font-size="12" fill="#555" filter="url(#rough2)">4 种（固定 a1 进第一条）</text>
  <path d="M 390 102 L 390 126" stroke="#446688" stroke-width="1.6" marker-end="url(#arr125d2)" filter="url(#rough2)"/>

  <!-- 主状态 -->
  <g filter="url(#rough2)">
    <rect x="230" y="130" width="320" height="80" rx="10" fill="#e9f5e6" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="390" y="156" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5223">锁定条：(末项 L, 公差 d)</text>
    <text x="390" y="180" text-anchor="middle" font-size="13" fill="#2f5223">弹性条：cnt = 0 或 1</text>
    <text x="390" y="200" text-anchor="middle" font-size="12" fill="#555">（3 个元素分给 2 条，必有一条拿到 ≥2 个 → 必锁定）</text>
  </g>

  <!-- 分支 -->
  <path d="M 330 210 Q 250 236 210 268" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr125d2)" filter="url(#rough2)"/>
  <text x="120" y="238" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">x == L + d，把 x 给锁定条</text>

  <path d="M 450 210 Q 530 236 570 268" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr125d3)" filter="url(#rough2)"/>
  <text x="470" y="238" font-size="12.5" fill="#8b3a37" filter="url(#rough2)">x == L + d，却把 x 给弹性条</text>

  <g filter="url(#rough2)">
    <rect x="60" y="272" width="290" height="86" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="76" y="296" font-size="12.5" font-weight="bold" fill="#2f4a66">继续扫描</text>
    <text x="76" y="318" font-size="12" fill="#2b2b2b">锁定条前进：L ← x</text>
    <text x="76" y="338" font-size="12" fill="#2b2b2b">弹性条原样不动（0 或 1 项）</text>
    <text x="76" y="354" font-size="12" fill="#555">到末尾时弹性条非空即可</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="430" y="272" width="290" height="86" rx="9" fill="#fdecea" stroke="#b85450" stroke-width="1.4"/>
    <text x="446" y="296" font-size="12.5" font-weight="bold" fill="#8b3a37">锁定条永久作废</text>
    <text x="446" y="318" font-size="12" fill="#2b2b2b">它永远等不到这个 x 了，</text>
    <text x="446" y="338" font-size="12" fill="#2b2b2b">整个后缀必须自己成等差 →</text>
    <text x="446" y="354" font-size="12" fill="#8b3a37">用后缀等差表 O(1) 判定</text>
  </g>

  <!-- 双方锁定 -->
  <path d="M 205 358 L 205 392" stroke="#446688" stroke-width="1.6" marker-end="url(#arr125d2)" filter="url(#rough2)"/>
  <path d="M 575 358 L 575 392" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr125d3)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="230" y="396" width="320" height="56" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="390" y="418" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015">两条都锁定后：只能进「期待值等于 x」的那条</text>
    <text x="390" y="438" text-anchor="middle" font-size="12" fill="#8a6015">若两条都期待 x，谁拿到另一条就死 → 后缀判一次 O(1)</text>
  </g>

  <text x="60" y="450" font-size="12" fill="#555" filter="url(#rough2)">弹性条拿到第 2 项时也立刻锁定（公差 = 新值 − 旧值），于是又回到“两条都锁定”。</text>
  <text x="60" y="472" font-size="12" fill="#555" filter="url(#rough2)">x ≠ L + d 时 x 只能给弹性条：0 项 → 1 项继续扫；1 项 → 也锁定，两边一起锁定。</text>
  <text x="60" y="494" font-size="12" fill="#8a6015" filter="url(#rough2)">每个决策点只有这两类去向，所以一个初始配置只需一趟 O(n) 扫描，总计 O(n)。</text>
</svg>
