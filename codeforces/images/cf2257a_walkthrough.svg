<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="37"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>

  <rect width="760" height="500" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例走查：只比对一次初始集合</text>
  <path d="M 214 42 Q 380 49 546 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 表头 -->
  <rect x="24" y="54" width="130" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="154" y="54" width="230" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="384" y="54" width="210" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="594" y="54" width="142" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="89" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">缩写</text>
  <text x="269" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">需要的字母</text>
  <text x="489" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">对照 L0 = {A,B,C,G}</text>
  <text x="665" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">结论</text>

  <!-- 样例 1 的四行 -->
  <rect x="24" y="88" width="130" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="154" y="88" width="230" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="384" y="88" width="210" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="594" y="88" width="142" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="89" y="111" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">AG</text>
  <text x="269" y="111" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">A, G</text>
  <text x="489" y="111" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">两个都在</text>
  <text x="665" y="111" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">可造 ✓</text>

  <rect x="24" y="122" width="130" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="154" y="122" width="230" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="384" y="122" width="210" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="594" y="122" width="142" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="89" y="145" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">BG</text>
  <text x="269" y="145" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">B, G</text>
  <text x="489" y="145" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">两个都在</text>
  <text x="665" y="145" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">可造 ✓</text>

  <rect x="24" y="156" width="130" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="154" y="156" width="230" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="384" y="156" width="210" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="594" y="156" width="142" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="89" y="179" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">CG</text>
  <text x="269" y="179" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">C, G</text>
  <text x="489" y="179" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">两个都在</text>
  <text x="665" y="179" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">可造 ✓</text>

  <rect x="24" y="190" width="130" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="154" y="190" width="230" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="384" y="190" width="210" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="594" y="190" width="142" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="89" y="213" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">ABC</text>
  <text x="269" y="213" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">A, B, C（本来就有）</text>
  <text x="489" y="213" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">不依赖别的缩写</text>
  <text x="665" y="213" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">可造 ✓</text>

  <rect x="24" y="232" width="712" height="34" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="254" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">四个缩写全部通过 ⇒ 输出 YES（L 一步都没变，与顺序无关）</text>

  <!-- 样例 4 -->
  <text x="380" y="296" text-anchor="middle" font-size="13" font-weight="bold" fill="#a14340" filter="url(#rough2)">反例（样例 4）：words = {apple, avocado} ⇒ L0 = {A}</text>

  <rect x="24" y="306" width="130" height="34" fill="#ffffff" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="154" y="306" width="230" height="34" fill="#ffffff" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="384" y="306" width="210" height="34" fill="#ffffff" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="594" y="306" width="142" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="89" y="329" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">B</text>
  <text x="269" y="329" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">B</text>
  <text x="489" y="329" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">B ∉ L0</text>
  <text x="665" y="329" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">永远造不出 ✗</text>

  <rect x="24" y="340" width="130" height="34" fill="#ffffff" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="154" y="340" width="230" height="34" fill="#ffffff" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="384" y="340" width="210" height="34" fill="#ffffff" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="594" y="340" width="142" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="89" y="363" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">BA</text>
  <text x="269" y="363" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">B, A</text>
  <text x="489" y="363" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">A 在，B 不在</text>
  <text x="665" y="363" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">永远造不出 ✗</text>

  <rect x="24" y="382" width="712" height="34" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="404" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">存在字母不在 L0 中 ⇒ 输出 NO</text>

  <rect x="24" y="430" width="712" height="58" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="380" y="452" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">官方 note 描述了「AG、BG、CG 拼出 ABC」的顺序，容易让人误以为必须按依赖顺序创建；</text>
  <text x="380" y="474" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">其实 A、B、C 本来就在 L0 里，ABC 第一步就能造 —— 顺序不影响答案。</text>
</svg>
