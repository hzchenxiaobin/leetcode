<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>

  <rect width="640" height="480" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">n = 8 的圆环：每个四连都互不相同</text>
  <path d="M 90 42 Q 320 48 550 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <circle cx="320" cy="250" r="150" fill="none" stroke="#8a8a8a" stroke-width="1.4"
          stroke-dasharray="7 6" filter="url(#rough2)"/>

  <!-- 8 个彩蛋：位置 1..8 顺时针，从正上方开始 -->
  <!-- 1: R -->
  <circle cx="320" cy="100" r="25" fill="#f3dede" stroke="#c0504d" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="320" y="107" text-anchor="middle" font-size="17" font-weight="bold" fill="#8c2f2c" filter="url(#rough2)">R</text>
  <text x="320" y="62" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">1</text>
  <!-- 2: O -->
  <circle cx="426" cy="144" r="25" fill="#fbeadb" stroke="#d98c3f" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="426" y="151" text-anchor="middle" font-size="17" font-weight="bold" fill="#9a5d1c" filter="url(#rough2)">O</text>
  <text x="455" y="118" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">2</text>
  <!-- 3: Y -->
  <circle cx="470" cy="250" r="25" fill="#fbf5d8" stroke="#d6b840" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="470" y="257" text-anchor="middle" font-size="17" font-weight="bold" fill="#8a7520" filter="url(#rough2)">Y</text>
  <text x="509" y="254" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">3</text>
  <!-- 4: G -->
  <circle cx="426" cy="356" r="25" fill="#e6f0dd" stroke="#6a9a4a" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="426" y="363" text-anchor="middle" font-size="17" font-weight="bold" fill="#44662c" filter="url(#rough2)">G</text>
  <text x="455" y="384" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">4</text>
  <!-- 5: R -->
  <circle cx="320" cy="400" r="25" fill="#f3dede" stroke="#c0504d" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="320" y="407" text-anchor="middle" font-size="17" font-weight="bold" fill="#8c2f2c" filter="url(#rough2)">R</text>
  <text x="320" y="442" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">5</text>
  <!-- 6: B -->
  <circle cx="214" cy="356" r="25" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="214" y="363" text-anchor="middle" font-size="17" font-weight="bold" fill="#335478" filter="url(#rough2)">B</text>
  <text x="186" y="384" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">6</text>
  <!-- 7: I -->
  <circle cx="170" cy="250" r="25" fill="#e2e3f1" stroke="#5b5f9e" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="170" y="257" text-anchor="middle" font-size="17" font-weight="bold" fill="#383b6c" filter="url(#rough2)">I</text>
  <text x="131" y="254" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">7</text>
  <!-- 8: V -->
  <circle cx="214" cy="144" r="25" fill="#efe0f2" stroke="#9a5fa8" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="214" y="151" text-anchor="middle" font-size="17" font-weight="bold" fill="#683a73" filter="url(#rough2)">V</text>
  <text x="186" y="118" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">8</text>

  <!-- 圆内的三个窗口说明 -->
  <text x="320" y="226" text-anchor="middle" font-size="13" fill="#33543a" filter="url(#rough2)">窗口 1–4：R O Y G ✓</text>
  <text x="320" y="252" text-anchor="middle" font-size="13" fill="#33543a" filter="url(#rough2)">窗口 5–8：R B I V ✓</text>
  <text x="320" y="278" text-anchor="middle" font-size="13" fill="#33543a" filter="url(#rough2)">窗口 8,1,2,3：V R O Y ✓</text>
  <text x="320" y="312" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">跨末尾的窗口也要查</text>

  <text x="320" y="468" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">七种颜色各出现一次；同色之间最少隔 4 个位置</text>
</svg>
