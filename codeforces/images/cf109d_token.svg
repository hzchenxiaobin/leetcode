<svg xmlns="http://www.w3.org/2000/svg" width="884" height="404" viewBox="0 0 884 404"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="109"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="884" height="404" fill="#fafafa"/>
  <text x="442" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">把幸运数当“搬运工具”：每个位置最多 2 次交换</text>
  <text x="442" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">swap(q,i) 把幸运数搬到 i，再 swap(i,j) 放好 i</text>
  <g filter="url(#rough2)"><rect x="140" y="120" width="120" height="56" rx="4" fill="#f6e3c4" fill-opacity="0.7" stroke="#8899aa" stroke-width="1.3"/></g>
  <text x="200" y="154" text-anchor="middle" font-size="10.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">q：幸运数 L</text>
  <g filter="url(#rough2)"><rect x="300" y="120" width="120" height="56" rx="4" fill="#cfe0f5" fill-opacity="0.7" stroke="#8899aa" stroke-width="1.3"/></g>
  <text x="360" y="154" text-anchor="middle" font-size="10.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">i：待放置</text>
  <g filter="url(#rough2)"><rect x="460" y="120" width="120" height="56" rx="4" fill="#d7ecd0" fill-opacity="0.7" stroke="#8899aa" stroke-width="1.3"/></g>
  <text x="520" y="154" text-anchor="middle" font-size="10.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">j：持有 T[i]</text>
  <g filter="url(#rough2)"><path d="M 260 134 C 300 100, 320 100, 340 130" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)" stroke-dasharray="6 4"/></g>
  <text x="300" y="96" text-anchor="middle" font-size="10.5" fill="#3d6b2f" filter="url(#rough2)">① swap(q,i)：L 到 i</text>
  <g filter="url(#rough2)"><path d="M 420 148 C 460 118, 480 118, 500 144" fill="none" stroke="#8a2b28" stroke-width="2" marker-end="url(#arrr)" stroke-dasharray="6 4"/></g>
  <text x="460" y="110" text-anchor="middle" font-size="10.5" fill="#8a2b28" filter="url(#rough2)">② swap(i,j)：i 就位，L 到 j</text>
  <text x="440" y="250" text-anchor="middle" font-size="12" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">不变量：幸运数 L 始终停在“尚未就位”的位置上</text>
  <g filter="url(#rough2)"><rect x="100" y="282" width="684" height="58" rx="4" fill="#ffffff" fill-opacity="0.0" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="5 4"/></g>
  <text x="442" y="306" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">目标值恰好等于 L 的位置（排序后是 L 的那些位置）最后自然就位，直接跳过</text>
  <text x="442" y="330" text-anchor="middle" font-size="11.5" fill="#3d6b2f" filter="url(#rough2)">于是每个位置至多 2 次交换，总数 ≤ 2n，符合题面限制</text>
  <text x="442" y="368" text-anchor="middle" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">若数组里没有幸运数：只有本身已有序才行，否则 −1</text>
</svg>
