<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>

  <rect width="720" height="360" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">围栏整点参数化成 k，每条边收成一个 k 区间</text>
  <path d="M 120 40 Q 360 46 600 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 轴 -->
  <line x1="60" y1="130" x2="660" y2="130" stroke="#555" stroke-width="1.6" filter="url(#rough2)"/>
  <g font-size="12" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">
    <text x="60" y="152">k=0</text>
    <text x="130" y="152">1</text>
    <text x="200" y="152">2</text>
    <text x="270" y="152">3</text>
    <text x="340" y="152">4</text>
    <text x="410" y="152">5</text>
    <text x="480" y="152">6</text>
    <text x="550" y="152">7</text>
    <text x="620" y="152">8</text>
  </g>
  <g filter="url(#rough2)">
    <circle cx="60" cy="130" r="4.5" fill="#446688"/>
    <circle cx="130" cy="130" r="4.5" fill="#446688"/>
    <circle cx="200" cy="130" r="4.5" fill="#446688"/>
    <circle cx="270" cy="130" r="4.5" fill="#446688"/>
    <circle cx="340" cy="130" r="4.5" fill="#446688"/>
    <circle cx="410" cy="130" r="4.5" fill="#446688"/>
    <circle cx="480" cy="130" r="4.5" fill="#446688"/>
    <circle cx="550" cy="130" r="4.5" fill="#446688"/>
    <circle cx="620" cy="130" r="4.5" fill="#446688"/>
  </g>
  <text x="60" y="112" font-size="11" fill="#2f4a66" filter="url(#rough2)">P(k) = A + (k/g)(B−A)，g = 8</text>

  <!-- 约束条 -->
  <g filter="url(#rough2)">
    <rect x="200" y="168" width="420" height="24" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="60" y="200" width="360" height="24" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="130" y="232" width="490" height="24" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <text x="212" y="185" font-size="11" fill="#2f4a66" filter="url(#rough2)">边 2：k ≥ 2</text>
  <text x="72" y="217" font-size="11" fill="#7a5a1b" filter="url(#rough2)">边 4：k ≤ 5</text>
  <text x="142" y="249" font-size="11" fill="#2f5223" filter="url(#rough2)">边 6：k ≥ 1（不收紧）</text>

  <!-- 求交结果 -->
  <g filter="url(#rough2)">
    <rect x="200" y="272" width="210" height="30" rx="8" fill="#fde8e6" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="305" y="293" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">交集：k = 2..5，答案 4</text>
  <path d="M 210 264 L 210 272" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 400 264 L 400 272" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- 公式 -->
  <g filter="url(#rough2)">
    <rect x="440" y="272" width="240" height="62" rx="10" fill="#f4f0fa" stroke="#7a4a8a" stroke-width="1.4"/>
  </g>
  <text x="454" y="292" font-size="11.5" font-weight="bold" fill="#5a3a6a" filter="url(#rough2)">每条边 → P·k ≥ Q</text>
  <text x="454" y="310" font-size="11" fill="#5a3a6a" filter="url(#rough2)">P&gt;0：k ≥ ⌈Q/P⌉</text>
  <text x="454" y="326" font-size="11" fill="#5a3a6a" filter="url(#rough2)">P&lt;0：k ≤ ⌊Q/P⌋，P=0 判 Q≤0</text>
</svg>
