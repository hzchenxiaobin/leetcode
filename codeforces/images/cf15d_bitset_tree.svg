<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="163"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="440" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按行建线段树，每个结点存“列号 bitset”</text>
  <path d="M 120 44 Q 380 50 640 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 连线 -->
  <line x1="300" y1="104" x2="185" y2="146" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="300" y1="104" x2="415" y2="146" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="170" y1="196" x2="110" y2="238" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="170" y1="196" x2="235" y2="238" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="430" y1="196" x2="365" y2="238" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="430" y1="196" x2="495" y2="238" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- 结点 -->
  <g filter="url(#rough2)">
    <rect x="220" y="60" width="160" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="100" y="146" width="140" height="50" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <rect x="360" y="146" width="140" height="50" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <rect x="50" y="238" width="120" height="50" rx="8" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.3"/>
    <rect x="180" y="238" width="120" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="310" y="238" width="120" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="440" y="238" width="120" height="50" rx="8" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.3"/>
  </g>

  <text x="300" y="80" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">行 [0,7]</text>
  <text x="300" y="97" text-anchor="middle" font-size="10" font-family="'Courier New',monospace" fill="#2b2b2b" filter="url(#rough2)">01010010</text>

  <text x="170" y="166" text-anchor="middle" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">行 [0,3]</text>
  <text x="170" y="185" text-anchor="middle" font-size="10" font-family="'Courier New',monospace" fill="#2b2b2b" filter="url(#rough2)">01010000</text>
  <text x="430" y="166" text-anchor="middle" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">行 [4,7]</text>
  <text x="430" y="185" text-anchor="middle" font-size="10" font-family="'Courier New',monospace" fill="#2b2b2b" filter="url(#rough2)">00000010</text>

  <text x="110" y="258" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">[0,1]</text>
  <text x="110" y="276" text-anchor="middle" font-size="9.5" font-family="'Courier New',monospace" fill="#555" filter="url(#rough2)">01000000</text>
  <text x="240" y="258" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f5223" filter="url(#rough2)">[2,3]</text>
  <text x="240" y="276" text-anchor="middle" font-size="9.5" font-family="'Courier New',monospace" fill="#2f5223" filter="url(#rough2)">00010000</text>
  <text x="370" y="258" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f5223" filter="url(#rough2)">[4,5]</text>
  <text x="370" y="276" text-anchor="middle" font-size="9.5" font-family="'Courier New',monospace" fill="#2f5223" filter="url(#rough2)">00000010</text>
  <text x="500" y="258" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">[6,7]</text>
  <text x="500" y="276" text-anchor="middle" font-size="9.5" font-family="'Courier New',monospace" fill="#555" filter="url(#rough2)">00000000</text>

  <text x="300" y="318" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">查询行 [2,5]：拆成结点 [2,3] 与 [4,5]（绿色）</text>

  <!-- 右侧说明 -->
  <rect x="576" y="60" width="164" height="330" rx="11" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="590" y="86" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">查询 = 行拆 + 列掩码</text>
  <text x="590" y="112" font-size="10.5" fill="#555" filter="url(#rough2)">列区间 [1,4]：</text>
  <rect x="590" y="120" width="136" height="28" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="658" y="139" text-anchor="middle" font-size="10" font-family="'Courier New',monospace" fill="#8a6015" filter="url(#rough2)">00011110</text>

  <text x="590" y="174" font-size="10.5" fill="#555" filter="url(#rough2)">[2,3] 的 bitset：</text>
  <text x="590" y="192" font-size="10" font-family="'Courier New',monospace" fill="#2b2b2b" filter="url(#rough2)">00010000</text>
  <text x="590" y="212" font-size="10.5" fill="#555" filter="url(#rough2)">AND 结果非零 ⇒ 相交</text>

  <text x="590" y="246" font-size="10.5" fill="#555" filter="url(#rough2)">插入 (r,c)：</text>
  <text x="590" y="264" font-size="10.5" fill="#555" filter="url(#rough2)">从叶子 r 到根，</text>
  <text x="590" y="282" font-size="10.5" fill="#555" filter="url(#rough2)">把第 c 位置 1，</text>
  <text x="590" y="300" font-size="10.5" fill="#555" filter="url(#rough2)">共 O(log n) 次。</text>

  <text x="590" y="334" font-size="10" fill="#777" filter="url(#rough2)">m ≤ 1000，一个</text>
  <text x="590" y="350" font-size="10" fill="#777" filter="url(#rough2)">bitset 只有 16 个</text>
  <text x="590" y="366" font-size="10" fill="#777" filter="url(#rough2)">64 位字，常数很小。</text>

  <!-- 底部 -->
  <rect x="50" y="342" width="500" height="62" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="68" y="366" font-size="11" fill="#8a6015" filter="url(#rough2)">候选 (r,c) 与已选点 (r',c') 重叠 ⇔ |r-r'| ≤ a-1 且 |c-c'| ≤ b-1。</text>
  <text x="68" y="388" font-size="11" fill="#8a6015" filter="url(#rough2)">所以只需查询行区间 [r-a+1,r+a-1]、列区间 [c-b+1,c+b-1] 内有没有点。</text>
</svg>
