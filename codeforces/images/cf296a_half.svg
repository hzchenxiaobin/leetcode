<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="601"/>
    <feDisplacementMap in="SourceGraphic" scale="1.5"/></filter></defs>
  <rect width="700" height="300" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">相邻交换 ⇒ 可得到任意排列；问题变成"能否排成相邻互异"</text>
  <path d="M 90 40 Q 350 46 610 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="66" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="13" fill="#22314a" filter="url(#rough2)">"交换相邻两个元素"生成整个对称群 ⇒ 任何排列都可达。</text>
  <text x="76" y="106" font-size="13" fill="#22314a" filter="url(#rough2)">于是问题 = 是否存在一个排列使相邻元素都不同。</text>
  <g filter="url(#rough2)"><rect x="60" y="134" width="580" height="86" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="76" y="158" font-size="13" fill="#8a6015" filter="url(#rough2)">经典结论：把出现次数最多的值（出现 c 次）当成"隔板"，</text>
  <text x="76" y="182" font-size="13" fill="#8a6015" filter="url(#rough2)">它最多被其余 n−c 个元素隔开成 n−c+1 段 ⇒ 必须 c ≤ n−c+1</text>
  <text x="76" y="206" font-size="13" fill="#8a6015" filter="url(#rough2)">即 c ≤ (n+1)/2。这既是必要的，也恰好是充分的。</text>
  <g filter="url(#rough2)"><rect x="60" y="234" width="580" height="52" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="258" font-size="12.5" fill="#2f5223" filter="url(#rough2)">样例 3：n=4、四个 7 ⇒ c=4 &gt; (4+1)/2=2 ⇒ NO ✓</text>
  <text x="76" y="278" font-size="12.5" fill="#2f5223" filter="url(#rough2)">样例 2：n=3、[1,1,2] ⇒ c=2 ≤ 2 ⇒ YES（排成 1 2 1）✓</text>
</svg>
