<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2b2b2b"/>
    </marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arra" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="720" height="440" fill="#fafafa"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按模 3 余数分桶：只能配 (0,0) 或 (1,2)</text>
  <path d="M 200 44 Q 360 50 520 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="30" y="78" width="170" height="186" rx="0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="115" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">余数 0</text>
  <rect x="42" y="126" width="46" height="40" rx="0" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="65" y="152" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <rect x="94" y="126" width="46" height="40" rx="0" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="117" y="152" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">6</text>
  <rect x="146" y="126" width="46" height="40" rx="0" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="169" y="152" text-anchor="middle" font-size="15" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">9</text>
  <rect x="250" y="78" width="170" height="186" rx="0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="335" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">余数 1</text>
  <rect x="262" y="126" width="46" height="40" rx="0" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="285" y="152" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="314" y="126" width="46" height="40" rx="0" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="337" y="152" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">4</text>
  <rect x="366" y="126" width="46" height="40" rx="0" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="389" y="152" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">7</text>
  <rect x="470" y="78" width="170" height="186" rx="0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="555" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#d6a040" filter="url(#rough2)">余数 2</text>
  <rect x="482" y="126" width="46" height="40" rx="0" fill="#ffffff" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="505" y="152" text-anchor="middle" font-size="15" font-weight="bold" fill="#d6a040" filter="url(#rough2)">2</text>
  <rect x="534" y="126" width="46" height="40" rx="0" fill="#ffffff" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="557" y="152" text-anchor="middle" font-size="15" font-weight="bold" fill="#d6a040" filter="url(#rough2)">5</text>
  <rect x="586" y="126" width="46" height="40" rx="0" fill="#ffffff" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="609" y="152" text-anchor="middle" font-size="15" font-weight="bold" fill="#d6a040" filter="url(#rough2)">8</text>
  <path d="M 65 176 Q 90 202 115 176" stroke="#4a7a3a" stroke-width="2" fill="none" opacity="1.0" filter="url(#rough2)"/>
  <text x="90" y="212" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0+0</text>
  <text x="115" y="246" text-anchor="middle" font-size="10" fill="#8a8a8a" filter="url(#rough2)">奇数个时剩 1 片</text>
  <line x1="424" y1="146" x2="466" y2="146" stroke="#b85450" stroke-width="2" opacity="1.0" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="445" y="132" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">1+2</text>
  <text x="360" y="300" text-anchor="middle" font-size="12.5" fill="#8a8a8a" filter="url(#rough2)">两类票消耗的碎片互不重叠，各自取最大即可</text>
  <rect x="120" y="326" width="480" height="62" rx="0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="366" text-anchor="middle" font-size="19" font-weight="bold" fill="#8a6015" filter="url(#rough2)">答案 = ⌊ c0 / 2 ⌋ + min(c1, c2)</text>
  <text x="360" y="420" text-anchor="middle" font-size="12.5" fill="#8a8a8a" filter="url(#rough2)">拼接顺序无关：拼接值 ≡ a + b (mod 3)</text>
</svg>
