<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="380" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">没有 "01" ⟺ 整串恰好形如 1^a 0^b</text>
  <text x="320" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">01 是唯一「0 在前、1 在后」的相邻模式；只要它缺席，串就被逼成「先全 1、后全 0」</text>

  <!-- 行 1：出现 01 -->
  <g filter="url(#rough2)">
    <text x="34" y="82" font-size="10.5" fill="#b85450">例 1　s = 1 0 1 1 0 0　→ 存在 01</text>
    <rect x="36" y="90" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="76" y="90" width="36" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="116" y="90" width="36" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="156" y="90" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="196" y="90" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="236" y="90" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="54" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c3e50">1</text>
    <text x="94" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a3a36">0</text>
    <text x="134" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a3a36">1</text>
    <text x="174" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c3e50">1</text>
    <text x="214" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c3e50">0</text>
    <text x="254" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c3e50">0</text>
  </g>
  <path d="M 96 130 L 128 140" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="140" y="150" font-size="10" fill="#8a3a36" filter="url(#rough2)">s_2=0, s_3=1 ⇒ 答案 YES</text>

  <!-- 行 2：没有 01 -->
  <g filter="url(#rough2)">
    <text x="34" y="190" font-size="10.5" fill="#3a5a30">例 2　s = 1 1 1 0 0 0　→ 不存在 01</text>
    <rect x="36" y="198" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="76" y="198" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="116" y="198" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="156" y="198" width="36" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="196" y="198" width="36" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="236" y="198" width="36" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="54" y="220" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c3e50">1</text>
    <text x="94" y="220" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c3e50">1</text>
    <text x="134" y="220" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c3e50">1</text>
    <text x="174" y="220" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6a20">0</text>
    <text x="214" y="220" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6a20">0</text>
    <text x="254" y="220" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6a20">0</text>
  </g>
  <text x="140" y="252" font-size="10" fill="#3a5a30" filter="url(#rough2)">交界只有一个 1→0 台阶，永远不出现 0→1</text>

  <!-- 右侧：四种相邻对速查表 -->
  <g filter="url(#rough2)">
    <text x="470" y="76" font-size="10.5" font-weight="bold" fill="#555">相邻对速查</text>
    <rect x="424" y="84" width="60" height="26" fill="#eef2f7" stroke="#8a9bb0" stroke-width="1.2" rx="4"/>
    <rect x="488" y="84" width="130" height="26" fill="#eef2f7" stroke="#8a9bb0" stroke-width="1.2" rx="4"/>
    <text x="454" y="102" text-anchor="middle" font-size="11" fill="#445">11 / 00</text>
    <text x="553" y="102" text-anchor="middle" font-size="9.5" fill="#555">全是同字符，无交界</text>
    <rect x="424" y="114" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <rect x="488" y="114" width="130" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="454" y="132" text-anchor="middle" font-size="11" fill="#3a5a30">10</text>
    <text x="553" y="132" text-anchor="middle" font-size="9.5" fill="#3a5a30">下降，允许出现</text>
    <rect x="424" y="144" width="60" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="488" y="144" width="130" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="454" y="162" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a3a36">01</text>
    <text x="553" y="162" text-anchor="middle" font-size="9.5" fill="#8a3a36">上升 ⇒ 答案 YES</text>
    <text x="470" y="188" font-size="9" fill="#888">（问的就是 "01" 在不在）</text>
  </g>

  <!-- 底部结论 -->
  <rect x="40" y="276" width="560" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="320" y="303" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">无 "01" ⟺ s = 1^a 0^b（a+b=n，a 或 b 可以为 0）</text>
  <text x="320" y="340" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">于是只需回答两件事：一共有几个 1（记为 k），以及这 k 个 1 是否全部挤在最开头</text>
  <text x="320" y="360" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">串 = 1^k 0^(n−k) 时答案为 NO，其余情况必有一条 0→1 的上升台阶</text>
</svg>
