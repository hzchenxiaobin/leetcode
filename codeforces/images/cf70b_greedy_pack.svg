<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2b2b2b"/>
    </marker>
  </defs>

  <rect width="760" height="400" fill="#fafafa"/>
  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">贪心合并：能塞进当前短信就塞，塞不下就另起一条（1 字符 = 10 像素）</text>
  <path d="M 90 40 Q 380 46 670 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 容量条 n=25，宽 250，从 x=80 -->
  <g filter="url(#rough2)">
    <rect x="80" y="96" width="250" height="26" fill="#eef2f7" stroke="#446688" stroke-width="1.5"/>
    <text x="80" y="88" font-size="12" fill="#2f4a66">一条短信的容量：n = 25 个字符</text>
  </g>

  <!-- 尝试把两句放进同一条：Hello.(6) + 空格(1) + I am a little walrus.(21) -->
  <g filter="url(#rough2)">
    <rect x="80" y="58" width="60" height="26" fill="#d7ecd9" stroke="#2f7a3a" stroke-width="1.4"/>
    <text x="110" y="76" text-anchor="middle" font-size="11" fill="#1f5226">Hello.</text>
    <rect x="150" y="58" width="10" height="26" fill="#f0f0f0" stroke="#aaa" stroke-width="1"/>
    <rect x="160" y="58" width="210" height="26" fill="#d7ecd9" stroke="#2f7a3a" stroke-width="1.4"/>
    <text x="265" y="76" text-anchor="middle" font-size="11" fill="#1f5226">I am a little walrus.</text>
  </g>

  <!-- 溢出部分：330..370 -->
  <rect x="330" y="58" width="40" height="26" fill="#fdecea" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="378" y="76" font-size="12" fill="#8c2f2b" filter="url(#rough2)">超出 3 格：28 &gt; 25</text>

  <g filter="url(#rough2)" stroke="#8a6015" stroke-width="1.3" stroke-dasharray="4 4">
    <line x1="80" y1="52" x2="80" y2="132"/>
    <line x1="330" y1="52" x2="330" y2="132"/>
  </g>
  <text x="205" y="126" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">6 + 1 + 21 = 28 &gt; 25，两句不能同条</text>

  <!-- 正确的两条消息 -->
  <text x="80" y="178" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">于是切成两条短信：</text>
  <g filter="url(#rough2)">
    <rect x="80" y="196" width="60" height="30" fill="#cfe3f7" stroke="#446688" stroke-width="1.5"/>
    <text x="110" y="216" text-anchor="middle" font-size="11" fill="#2f4a66">Hello.</text>
    <rect x="170" y="196" width="210" height="30" fill="#cfe3f7" stroke="#446688" stroke-width="1.5"/>
    <text x="275" y="216" text-anchor="middle" font-size="11" fill="#2f4a66">I am a little walrus.</text>
  </g>
  <text x="110" y="246" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">短信 1（6 字符）</text>
  <text x="275" y="246" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">短信 2（21 字符）</text>

  <!-- 规则框 -->
  <rect x="430" y="160" width="300" height="120" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="446" y="184" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">合并判据</text>
  <text x="446" y="208" font-size="12" fill="#7a5a1b" filter="url(#rough2)">短信之间不写空格；同一条内相邻两句</text>
  <text x="446" y="228" font-size="12" fill="#7a5a1b" filter="url(#rough2)">之间保留 1 个空格。若当前已用 used，</text>
  <text x="446" y="248" font-size="12" fill="#7a5a1b" filter="url(#rough2)">加入长度 L 的句子后长度是 used+1+L。</text>
  <text x="446" y="268" font-size="12" fill="#7a5a1b" filter="url(#rough2)">≤ n 就合并，否则另起一条（used = L）。</text>

  <rect x="60" y="300" width="640" height="76" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="325" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">为什么贪心最优：每条短信装的是一段连续的句子，句子不能重排。</text>
  <text x="76" y="348" font-size="12" fill="#2f4a66" filter="url(#rough2)">若"能放下却提前断开"，把这句挪回上一条只会让上一条更长、后续条数不变或更少，</text>
  <text x="76" y="368" font-size="12" fill="#2f4a66" filter="url(#rough2)">所以"尽量往后塞"不会比任何其它切法差 —— 这就是最少的条数。</text>
</svg>
