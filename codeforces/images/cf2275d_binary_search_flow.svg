<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="19"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="470" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">二分答案 + 逐台代价：样例 5 的判定过程</text>

  <rect x="20" y="52" width="150" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="95" y="76" text-anchor="middle" font-size="12.5" fill="#2f4f6f" filter="url(#rough2)">二分候选答案 X</text>
  <text x="95" y="98" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">[ min S , min(S+k) ]</text>
  <path d="M 174 82 L 196 82" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="200" y="52" width="170" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="285" y="76" text-anchor="middle" font-size="12.5" fill="#8a6a20" filter="url(#rough2)">逐台算代价 f_i(X)</text>
  <text x="285" y="98" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">只有 S_i &lt; X 的台要花钱</text>
  <path d="M 374 82 L 396 82" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="400" y="52" width="170" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="485" y="86" text-anchor="middle" font-size="13" fill="#8a3030" filter="url(#rough2)">Σ f_i(X) ≤ k ?</text>
  <path d="M 574 82 L 596 82" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="600" y="52" width="140" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="670" y="76" text-anchor="middle" font-size="11.5" fill="#33502a" filter="url(#rough2)">可行 → lo = X</text>
  <text x="670" y="98" text-anchor="middle" font-size="11.5" fill="#8a3030" filter="url(#rough2)">否则 → hi = X</text>

  <rect x="40" y="136" width="170" height="32" fill="#c9dbf5" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="125" y="157" text-anchor="middle" font-size="12" fill="#2f4f6f" filter="url(#rough2)">实验室 (a, b, c)</text>
  <rect x="210" y="136" width="90" height="32" fill="#c9dbf5" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="255" y="157" text-anchor="middle" font-size="12" fill="#2f4f6f" filter="url(#rough2)">总和 S</text>
  <rect x="300" y="136" width="130" height="32" fill="#c9dbf5" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="365" y="157" text-anchor="middle" font-size="12" fill="#2f4f6f" filter="url(#rough2)">逃生代价 e</text>
  <rect x="430" y="136" width="110" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="485" y="157" text-anchor="middle" font-size="12" fill="#33502a" filter="url(#rough2)">f(6)</text>
  <rect x="540" y="136" width="110" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="595" y="157" text-anchor="middle" font-size="12" fill="#8a3030" filter="url(#rough2)">f(7)</text>

  <rect x="40" y="168" width="170" height="32" fill="#fafafa" stroke="#888" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="125" y="189" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(2, 1, 0)</text>
  <rect x="210" y="168" width="90" height="32" fill="#fafafa" stroke="#888" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="255" y="189" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="300" y="168" width="130" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="365" y="189" text-anchor="middle" font-size="12" fill="#33502a" filter="url(#rough2)">0（自由）</text>
  <rect x="430" y="168" width="110" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="485" y="189" text-anchor="middle" font-size="12" fill="#33502a" filter="url(#rough2)">6 − 3 = 3</text>
  <rect x="540" y="168" width="110" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="595" y="189" text-anchor="middle" font-size="12" fill="#8a3030" filter="url(#rough2)">7 − 3 = 4</text>

  <rect x="40" y="200" width="170" height="32" fill="#fafafa" stroke="#888" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="125" y="221" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(4, 4, 5)</text>
  <rect x="210" y="200" width="90" height="32" fill="#fafafa" stroke="#888" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="255" y="221" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">13</text>
  <rect x="300" y="200" width="130" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="365" y="221" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">1</text>
  <rect x="430" y="200" width="110" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="485" y="221" text-anchor="middle" font-size="12" fill="#33502a" filter="url(#rough2)">0</text>
  <rect x="540" y="200" width="110" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="595" y="221" text-anchor="middle" font-size="12" fill="#8a3030" filter="url(#rough2)">0</text>

  <rect x="40" y="232" width="170" height="32" fill="#fafafa" stroke="#888" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="125" y="253" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(1, 5, 9)</text>
  <rect x="210" y="232" width="90" height="32" fill="#fafafa" stroke="#888" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="255" y="253" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">15</text>
  <rect x="300" y="232" width="130" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="365" y="253" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">5</text>
  <rect x="430" y="232" width="110" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="485" y="253" text-anchor="middle" font-size="12" fill="#33502a" filter="url(#rough2)">0</text>
  <rect x="540" y="232" width="110" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="595" y="253" text-anchor="middle" font-size="12" fill="#8a3030" filter="url(#rough2)">0</text>

  <rect x="40" y="264" width="170" height="32" fill="#fafafa" stroke="#888" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="125" y="285" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(7, −2, 1)</text>
  <rect x="210" y="264" width="90" height="32" fill="#fafafa" stroke="#888" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="255" y="285" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <rect x="300" y="264" width="130" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="365" y="285" text-anchor="middle" font-size="12" fill="#33502a" filter="url(#rough2)">0（自由）</text>
  <rect x="430" y="264" width="110" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="485" y="285" text-anchor="middle" font-size="12" fill="#33502a" filter="url(#rough2)">0</text>
  <rect x="540" y="264" width="110" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="595" y="285" text-anchor="middle" font-size="12" fill="#8a3030" filter="url(#rough2)">7 − 6 = 1</text>

  <rect x="40" y="296" width="170" height="34" fill="#c9dbf5" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="125" y="318" text-anchor="middle" font-size="12" fill="#2f4f6f" filter="url(#rough2)">合计（k = 3）</text>
  <rect x="210" y="296" width="90" height="34" fill="#c9dbf5" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="318" text-anchor="middle" font-size="12" fill="#2f4f6f" filter="url(#rough2)">—</text>
  <rect x="300" y="296" width="130" height="34" fill="#c9dbf5" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="365" y="318" text-anchor="middle" font-size="12" fill="#2f4f6f" filter="url(#rough2)">—</text>
  <rect x="430" y="296" width="110" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="485" y="318" text-anchor="middle" font-size="12.5" fill="#33502a" filter="url(#rough2)">3 ≤ 3 ✓</text>
  <rect x="540" y="296" width="110" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="595" y="318" text-anchor="middle" font-size="12.5" fill="#8a3030" filter="url(#rough2)">5 &gt; 3 ✗</text>

  <rect x="40" y="350" width="610" height="100" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="54" y="376" font-size="12" fill="#2f4f6f" filter="url(#rough2)">X = 6 可行，且正好用光 k = 3 ⇒ lo = 6</text>
  <text x="54" y="402" font-size="12" fill="#8a3030" filter="url(#rough2)">X = 7 需要 4 + 0 + 0 + 1 = 5 &gt; 3 ⇒ 不可行，hi = 7</text>
  <text x="54" y="428" font-size="12" fill="#33502a" filter="url(#rough2)">不变量只剩 lo = 6 可行、hi = 7 不可行 ⇒ 答案 = 6（本例无全等三元组）</text>
</svg>
