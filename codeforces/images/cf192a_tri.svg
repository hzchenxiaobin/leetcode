<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="340" fill="#fafafa"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">192A：三角数 k(k+1)/2，问 n 能否写成两个三角数之和</text>
  <path d="M 137.0900000000001 46 Q 380.0 52 622.9099999999999 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60.0" y="70.0" width="640.0" height="70.0" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="96.0" text-anchor="start" font-size="11.6" font-weight="bold" fill="#33506e" filter="url(#rough2)">T(k) = k(k+1)/2：1, 3, 6, 10, 15, 21, 28, 36, …</text>
  <text x="74.0" y="118.0" text-anchor="start" font-size="11.2" fill="#2b2b2b" filter="url(#rough2)">n ≤ 10⁹ ⇒ k ≤ √(2n) ≈ 44721，枚举 k 并把 T(k) 丢进集合即可。</text>
  <rect x="60.0" y="160.0" width="630.0" height="36.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="68.0" y="189.0" text-anchor="start" font-size="10.6" font-weight="bold" fill="#26405c" filter="url(#rough2)">n</text>
  <text x="158.0" y="189.0" text-anchor="start" font-size="10.6" font-weight="bold" fill="#26405c" filter="url(#rough2)">拆法</text>
  <text x="608.0" y="189.0" text-anchor="start" font-size="10.6" font-weight="bold" fill="#26405c" filter="url(#rough2)">结论</text>
  <path d="M 60.0 160.0 L 690.0 160.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="68.0" y="225.0" text-anchor="start" font-size="10.6" fill="#2b2b2b" filter="url(#rough2)">256</text>
  <text x="158.0" y="225.0" text-anchor="start" font-size="10.6" fill="#2b2b2b" filter="url(#rough2)">10 + 246？不行；256 = 55 + 201？不行 → 256 = 120 + 136 = T(15)+T(16)</text>
  <text x="608.0" y="225.0" text-anchor="start" font-size="10.6" fill="#2b2b2b" filter="url(#rough2)">YES</text>
  <path d="M 60.0 196.0 L 690.0 196.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="68.0" y="261.0" text-anchor="start" font-size="10.6" fill="#2b2b2b" filter="url(#rough2)">512</text>
  <text x="158.0" y="261.0" text-anchor="start" font-size="10.6" fill="#2b2b2b" filter="url(#rough2)">所有 T(k) + T(j) 都不等于 512</text>
  <text x="608.0" y="261.0" text-anchor="start" font-size="10.6" fill="#2b2b2b" filter="url(#rough2)">NO</text>
  <path d="M 60.0 232.0 L 690.0 232.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <rect x="60.0" y="262.0" width="640.0" height="50.0" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="286.0" text-anchor="start" font-size="11.1" fill="#8a6015" filter="url(#rough2)">先枚举出所有 ≤ n 的三角数塞进 hash 集合，再对每个 t 查 n−t 是否在集合里：O(√n)。</text>
</svg>
