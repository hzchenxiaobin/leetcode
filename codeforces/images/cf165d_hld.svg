<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="797"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="290" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">树链剖分：路径拆成 O(log n) 段区间</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">线段树维护白边个数；为 0 才可达</text>
  <g filter="url(#rough2)"><circle cx="150" cy="120" r="16" fill="#cfe0f5" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="150" y="123.24" text-anchor="middle" font-size="9" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><circle cx="280" cy="120" r="16" fill="#cfe0f5" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="280" y="123.24" text-anchor="middle" font-size="9" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><circle cx="410" cy="120" r="16" fill="#cfe0f5" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="410" y="123.24" text-anchor="middle" font-size="9" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><circle cx="540" cy="90" r="16" fill="#dcecd2" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="540" y="93.24" text-anchor="middle" font-size="9" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><circle cx="540" cy="160" r="16" fill="#dcecd2" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="540" y="163.24" text-anchor="middle" font-size="9" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <g filter="url(#rough2)"><line x1="166" y1="120" x2="264" y2="120" stroke="#446688" stroke-width="1.6"/></g>
  <g filter="url(#rough2)"><line x1="296" y1="120" x2="394" y2="120" stroke="#446688" stroke-width="1.6"/></g>
  <g filter="url(#rough2)"><line x1="424" y1="114" x2="524" y2="96" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <g filter="url(#rough2)"><line x1="424" y1="128" x2="524" y2="156" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="700" y="110" text-anchor="start" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">白边挂在较深端点</text>
  <text x="700" y="140" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">查询 = 路径上白边数</text>
  <text x="700" y="172" text-anchor="start" font-size="10.5" fill="#446688" filter="url(#rough2)">为 0 ⇒ 输出深度差</text>
  <text x="450" y="240" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">涂色 = 单点更新；距离 = dep[a]+dep[b]−2·dep[lca]</text>
</svg>
