  <text x="665" y="410" text-anchor="middle" font-size="18" font-weight="bold" fill="#2f5223" filter="url(#rough2)">✓</text>
  <rect x="40" y="428" width="250" height="52" fill="#ffffff" stroke="#999999" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="54" y="460" font-size="12" fill="#2b2b2b" filter="url(#rough2)">`/` 的右侧</text>
  <rect x="290" y="428" width="150" height="52" fill="#fdeeee" stroke="#999999" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="365" y="462" text-anchor="middle" font-size="18" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">✗</text>
  <rect x="440" y="428" width="150" height="52" fill="#fdeeee" stroke="#999999" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="515" y="462" text-anchor="middle" font-size="18" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">✗</text>
  <rect x="590" y="428" width="150" height="52" fill="#e6f4ea" stroke="#999999" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="665" y="462" text-anchor="middle" font-size="18" font-weight="bold" fill="#2f5223" filter="url(#rough2)">✓</text>
  <text x="40" y="504" font-size="11.5" fill="#555555" filter="url(#rough2)">类别：加类 = 展开文本顶层有 + 或 −；乘类 = 顶层只有 * 或 /；原子 = 没有运算符或整体带括号。</text>
  <text x="40" y="526" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">唯一两个"同级但不可去"的格子：减号右侧的加类、除号右侧的乘类——这正是本题的全部难点。</text>
