  <text x="665" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">原子</text>
  <rect x="40" y="116" width="250" height="52" fill="#ffffff" stroke="#999999" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="54" y="148" font-size="12" fill="#2b2b2b" filter="url(#rough2)">整体表达式 / 被括号包住</text>
  <rect x="290" y="116" width="150" height="52" fill="#e6f4ea" stroke="#999999" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="365" y="150" text-anchor="middle" font-size="18" font-weight="bold" fill="#2f5223" filter="url(#rough2)">✓</text>
