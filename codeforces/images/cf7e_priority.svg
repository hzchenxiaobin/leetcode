  <rect width="820" height="530" fill="#fafafa"/>

  <text x="410" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">宏展开片段出现在什么位置时，外层括号可以去？</text>
  <path d="M 120 40 Q 410 46 700 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <rect x="40" y="70" width="250" height="46" fill="#e8eef6" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
