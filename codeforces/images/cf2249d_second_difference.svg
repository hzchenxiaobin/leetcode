<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="640" height="480" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">二阶差分恒为 x ⇒ A[i][j] = P_i ⊕ Q_j ⊕ x·[i odd][j odd]</text>
  <text x="320" y="48" text-anchor="middle" font-size="11" fill="#888888"
        filter="url(#rough2)">先扣掉「奇数行 ∩ 奇数列」上的 x，剩下的矩阵二阶差分全为 0</text>

  <rect x="70" y="86" width="52" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="96" y="110" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="124" y="86" width="52" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="110" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="70" y="126" width="52" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="96" y="150" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="124" y="126" width="52" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="150" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">d</text>
  <text x="188" y="106" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">a⊕b⊕c⊕d = x</text>
  <text x="188" y="126" font-size="10.5" fill="#777777" filter="url(#rough2)">对每个相邻 2×2 块都成立</text>
  <text x="188" y="146" font-size="10.5" fill="#777777" filter="url(#rough2)">这是「二阶差分」= 常数</text>

  <path d="M 122 172 L 122 196" stroke="#3a3a3a" stroke-width="1.6" fill="none"
        marker-end="url(#ar2)" filter="url(#rough2)"/>
  <text x="136" y="190" font-size="10.5" fill="#555555" filter="url(#rough2)">B = A ⊕ x·[i odd][j odd] ⇒ B 的二阶差分为 0</text>

  <text x="182" y="222" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">j=0</text>
  <text x="250" y="222" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">j=1</text>
  <text x="318" y="222" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">j=2</text>
  <text x="386" y="222" text-anchor="middle" font-size="10" fill="#888888" filter="url(#rough2)">j=3</text>
  <text x="140" y="252" text-anchor="end" font-size="10" fill="#888888" filter="url(#rough2)">i=0</text>
  <text x="140" y="294" text-anchor="end" font-size="10" fill="#b85450" filter="url(#rough2)">i=1</text>
  <text x="140" y="336" text-anchor="end" font-size="10" fill="#888888" filter="url(#rough2)">i=2</text>
  <text x="140" y="378" text-anchor="end" font-size="10" fill="#b85450" filter="url(#rough2)">i=3</text>

  <rect x="150" y="230" width="64" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="182" y="253" text-anchor="middle" font-size="8.6" fill="#446688" filter="url(#rough2)">P_0⊕Q_0</text>
  <rect x="218" y="230" width="64" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="250" y="253" text-anchor="middle" font-size="8.6" fill="#446688" filter="url(#rough2)">P_0⊕Q_1</text>
  <rect x="286" y="230" width="64" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="318" y="253" text-anchor="middle" font-size="8.6" fill="#446688" filter="url(#rough2)">P_0⊕Q_2</text>
  <rect x="354" y="230" width="64" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="386" y="253" text-anchor="middle" font-size="8.6" fill="#446688" filter="url(#rough2)">P_0⊕Q_3</text>

  <rect x="150" y="272" width="64" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="182" y="295" text-anchor="middle" font-size="8.6" fill="#446688" filter="url(#rough2)">P_1⊕Q_0</text>
  <rect x="218" y="272" width="64" height="38" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="250" y="295" text-anchor="middle" font-size="8.6" fill="#8a3a36" filter="url(#rough2)">P_1⊕Q_1⊕x</text>
  <rect x="286" y="272" width="64" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="318" y="295" text-anchor="middle" font-size="8.6" fill="#446688" filter="url(#rough2)">P_1⊕Q_2</text>
  <rect x="354" y="272" width="64" height="38" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="386" y="295" text-anchor="middle" font-size="8.6" fill="#8a3a36" filter="url(#rough2)">P_1⊕Q_3⊕x</text>

  <rect x="150" y="314" width="64" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="182" y="337" text-anchor="middle" font-size="8.6" fill="#446688" filter="url(#rough2)">P_2⊕Q_0</text>
  <rect x="218" y="314" width="64" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="250" y="337" text-anchor="middle" font-size="8.6" fill="#446688" filter="url(#rough2)">P_2⊕Q_1</text>
  <rect x="286" y="314" width="64" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="318" y="337" text-anchor="middle" font-size="8.6" fill="#446688" filter="url(#rough2)">P_2⊕Q_2</text>
  <rect x="354" y="314" width="64" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="386" y="337" text-anchor="middle" font-size="8.6" fill="#446688" filter="url(#rough2)">P_2⊕Q_3</text>

  <rect x="150" y="356" width="64" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="182" y="379" text-anchor="middle" font-size="8.6" fill="#446688" filter="url(#rough2)">P_3⊕Q_0</text>
  <rect x="218" y="356" width="64" height="38" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="250" y="379" text-anchor="middle" font-size="8.6" fill="#8a3a36" filter="url(#rough2)">P_3⊕Q_1⊕x</text>
  <rect x="286" y="356" width="64" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="318" y="379" text-anchor="middle" font-size="8.6" fill="#446688" filter="url(#rough2)">P_3⊕Q_2</text>
  <rect x="354" y="356" width="64" height="38" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="386" y="379" text-anchor="middle" font-size="8.6" fill="#8a3a36" filter="url(#rough2)">P_3⊕Q_3⊕x</text>

  <rect x="60" y="412" width="520" height="52" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="432" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">蓝色 = 普通格 P_i⊕Q_j；红色 = 奇数行 × 奇数列，多一个 ⊕x（共 (n/2)² 个）</text>
  <text x="76" y="452" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">也就是说：任何合法矩阵都只由两条长度 n 的序列 P、Q 决定（且二者都必须是置换）</text>
</svg>
