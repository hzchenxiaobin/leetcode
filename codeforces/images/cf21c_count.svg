<svg xmlns="http://www.w3.org/2000/svg" width="720" height="412" viewBox="0 0 720 412"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="412" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">一遍扫描：j 右移，维护可用的 i 的个数</text>
  <path d="M 120 42 Q 360 48 600 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 时间轴 -->
  <line x1="60" y1="110" x2="660" y2="110" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <circle cx="120" cy="110" r="5" fill="#446688"/><circle cx="240" cy="110" r="5" fill="#446688"/>
    <circle cx="360" cy="110" r="5" fill="#b85450"/><circle cx="480" cy="110" r="5" fill="#446688"/>
    <circle cx="600" cy="110" r="5" fill="#446688"/>
  </g>
  <g font-size="11" text-anchor="middle" fill="#555" filter="url(#rough2)">
    <text x="120" y="96">j=1</text><text x="240" y="96">j=2</text><text x="360" y="96">j=3</text>
    <text x="480" y="96">j=4</text><text x="600" y="96">j=5</text>
  </g>
  <text x="360" y="134" text-anchor="middle" font-size="10.5" fill="#a33a36" filter="url(#rough2)">每一步先加入 i=j−1，再用 pref[j] 查询</text>

  <rect x="40" y="160" width="330" height="176" rx="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="186" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">伪代码</text>
  <g font-size="10.5" fill="#3c5a73" filter="url(#rough2)">
    <text x="56" y="210">cnt = 0; ans = 0</text>
    <text x="56" y="230">for j = 1 .. n-1:</text>
    <text x="68" y="250">i = j - 1</text>
    <text x="68" y="270">if i ≥ 1 and pref[i] == T:</text>
    <text x="82" y="290">cnt += 1</text>
    <text x="68" y="310">if pref[j] == 2T:</text>
    <text x="82" y="328">ans += cnt</text>
  </g>

  <rect x="385" y="160" width="295" height="176" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <g font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">
    <text x="399" y="188" font-weight="bold">不变量</text>
    <text x="399" y="212">进入第 j 轮时，cnt = 满足 1 ≤ i &lt; j</text>
    <text x="399" y="232">且 pref[i] = T 的 i 的个数。</text>
    <text x="399" y="258">先加入 i = j−1（它现在满足 i &lt; j），</text>
    <text x="399" y="278">再检查 pref[j] = 2T：若成立，</text>
    <text x="399" y="298">每个这样的 i 都给出一种合法切法。</text>
  </g>

  <rect x="45" y="350" width="635" height="52" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <g font-size="11.5" fill="#2f5223" filter="url(#rough2)">
    <text x="61" y="374">i ≥ 1 保证第一段非空；j ≤ n−1 保证第三段非空；i &lt; j 保证第二段非空。</text>
    <text x="61" y="394">T = 0 时这条流程同样正确：只要前缀等于 0 就会被计数，不需要特判。</text>
  </g>
</svg>
