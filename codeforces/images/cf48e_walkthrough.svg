<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="360" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="38" text-anchor="middle" font-size="18.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">48E：样例 3 的走法（2 2 5，砍 1 头长 (1,1)，砍 1 尾长 (3,0)）</text>
  <path d="M 137 50 Q 380 56 623 50" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="90" y="120" width="150" height="66" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="165" y="158" text-anchor="middle" font-size="15" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">(2,2)</text>
  <text x="165" y="208" text-anchor="middle" font-size="10.5" fill="#555" font-weight="normal" filter="url(#rough2)">起点</text>
  <path d="M 242 153 L 282 153" stroke="#2b2b2b" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="290" y="120" width="150" height="66" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="365" y="158" text-anchor="middle" font-size="15" fill="#2f5223" font-weight="bold" filter="url(#rough2)">(2,3)</text>
  <text x="365" y="208" text-anchor="middle" font-size="10.5" fill="#555" font-weight="normal" filter="url(#rough2)">砍 1 头：1+1 头、2+1 尾</text>
  <path d="M 442 153 L 482 153" stroke="#2b2b2b" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="490" y="120" width="150" height="66" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="565" y="158" text-anchor="middle" font-size="15" fill="#2f5223" font-weight="bold" filter="url(#rough2)">(2,4)</text>
  <text x="565" y="208" text-anchor="middle" font-size="10.5" fill="#555" font-weight="normal" filter="url(#rough2)">再砍 1 头</text>
  <text x="90" y="250" text-anchor="start" font-size="11.5" fill="#b6483f" font-weight="bold" filter="url(#rough2)">此时 (2,4) 总数为 6 &gt; R=5：任何一步都会让恶龙发动致命一击。</text>
  <text x="90" y="278" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">所以伊万共出击 2 次（第 2 次是最后一次有效攻击，末了还有一次必死的攻击）⇒ Zmey 2。</text>
  <rect x="90" y="296" width="580" height="44" rx="9" fill="#fff3e0" stroke="#c9801f" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="104" y="324" text-anchor="start" font-size="11.5" fill="#7a4a10" font-weight="normal" filter="url(#rough2)">注意“砍 1 尾”从 (2,2) 会变成 (5,1)，总数 6 &gt; 5 —— 直接判负，所以不能走。</text>
</svg>
