<svg xmlns="http://www.w3.org/2000/svg" width="770" height="404" viewBox="0 0 770 404"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="770" height="404" fill="#fafafa"/>
  <text x="385.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">状态 = (已用女人集合, 最后选的男人)，只允许接男人编号更大的边</text>
  <path d="M 101.63000000000017 46 Q 385.0 52 668.3699999999999 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="50.0" y="74.0" width="660.0" height="40.0" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="66.0" y="100.0" text-anchor="start" font-size="12" font-weight="bold" fill="#33506e" filter="url(#rough2)">uint32：低 20 位存「女人使用 mask」，高位存 last man 编号</text>
  <rect x="110.0" y="156.0" width="210.0" height="34.0" rx="8" fill="#fff3d6" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="215.0" y="179.0" text-anchor="middle" font-size="11.6" font-weight="bold" fill="#8a6015" filter="url(#rough2)">mask = ∅, last = 0</text>
  <rect x="430.0" y="116.0" width="308.0" height="44.0" rx="8" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="440.0" y="134.0" text-anchor="start" font-size="10.8" font-weight="bold" fill="#2f5b34" filter="url(#rough2)">选 (男 2, 女 1), r = 3</text>
  <text x="440.0" y="151.0" text-anchor="start" font-size="10.4" fill="#2f5b34" filter="url(#rough2)">→ mask={女1}, last=2, 桶 3</text>
  <path d="M 322.0 173.0 L 424.0 138.0" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="430.0" y="176.0" width="308.0" height="44.0" rx="8" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="440.0" y="194.0" text-anchor="start" font-size="10.8" font-weight="bold" fill="#2f5b34" filter="url(#rough2)">选 (男 2, 女 3), r = 7</text>
  <text x="440.0" y="211.0" text-anchor="start" font-size="10.4" fill="#2f5b34" filter="url(#rough2)">→ mask={女3}, last=2, 桶 7</text>
  <path d="M 322.0 173.0 L 424.0 198.0" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="430.0" y="236.0" width="308.0" height="44.0" rx="8" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="440.0" y="254.0" text-anchor="start" font-size="10.8" font-weight="bold" fill="#2f5b34" filter="url(#rough2)">选 (男 4, 女 2), r = 1</text>
  <text x="440.0" y="271.0" text-anchor="start" font-size="10.4" fill="#2f5b34" filter="url(#rough2)">→ mask={女2}, last=4, 桶 1</text>
  <path d="M 322.0 173.0 L 424.0 258.0" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="50.0" y="302.0" width="660.0" height="40.0" rx="8" fill="#fdf0ef" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="64.0" y="327.0" text-anchor="start" font-size="11" fill="#8a3a36" filter="url(#rough2)">不会有重复：一条路径就是「按男人递增的选边序列」，一个匹配只对应一条路径</text>
  <text x="50.0" y="372.0" text-anchor="start" font-size="11.2" fill="#6b6b6b" filter="url(#rough2)">可行后继 = 男人编号 &gt; last 且对应女人未被占用的边，于是每个匹配恰好被数一次。</text>
</svg>
