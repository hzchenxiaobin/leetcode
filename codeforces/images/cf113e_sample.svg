<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="19"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="470" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">样例 1 走查：h = m = 5、k = 2，从 4:4 看到 2:1</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">共 12 次跳变，其中恰好 3 次让 ≥2 位数字同时变化</text>
  <g filter="url(#rough2)"><rect x="40" y="110" width="92" height="42" rx="5" fill="#f6e3c4" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="86" y="138" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">4:4</text>
  <g filter="url(#rough2)"><line x1="134" y1="131" x2="160" y2="131" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)"/></g>
  <g filter="url(#rough2)"><rect x="124" y="84" width="48" height="20" rx="3" fill="#f3d9d6" fill-opacity="0.85" stroke="#8a2b28" stroke-width="1.2"/></g>
  <text x="148" y="98" text-anchor="middle" font-size="10" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">2 位</text>
  <g filter="url(#rough2)"><rect x="162" y="110" width="92" height="42" rx="5" fill="#ffffff" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="208" y="138" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">0:0</text>
  <g filter="url(#rough2)"><line x1="256" y1="131" x2="282" y2="131" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)"/></g>
  <g filter="url(#rough2)"><rect x="284" y="110" width="92" height="42" rx="5" fill="#ffffff" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="330" y="138" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">0:1</text>
  <g filter="url(#rough2)"><line x1="378" y1="131" x2="404" y2="131" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)"/></g>
  <g filter="url(#rough2)"><rect x="406" y="110" width="92" height="42" rx="5" fill="#ffffff" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="452" y="138" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">0:2</text>
  <g filter="url(#rough2)"><line x1="500" y1="131" x2="526" y2="131" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)"/></g>
  <g filter="url(#rough2)"><rect x="528" y="110" width="92" height="42" rx="5" fill="#ffffff" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="574" y="138" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">0:3</text>
  <g filter="url(#rough2)"><line x1="622" y1="131" x2="648" y2="131" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)"/></g>
  <g filter="url(#rough2)"><rect x="650" y="110" width="92" height="42" rx="5" fill="#ffffff" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="696" y="138" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">0:4</text>
  <g filter="url(#rough2)"><line x1="744" y1="131" x2="770" y2="131" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)"/></g>
  <g filter="url(#rough2)"><rect x="734" y="84" width="48" height="20" rx="3" fill="#f3d9d6" fill-opacity="0.85" stroke="#8a2b28" stroke-width="1.2"/></g>
  <text x="758" y="98" text-anchor="middle" font-size="10" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">2 位</text>
  <g filter="url(#rough2)"><rect x="772" y="110" width="92" height="42" rx="5" fill="#ffffff" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="818" y="138" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">1:0</text>
  <g filter="url(#rough2)"><rect x="40" y="250" width="92" height="42" rx="5" fill="#ffffff" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="86" y="278" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">1:1</text>
  <g filter="url(#rough2)"><line x1="134" y1="271" x2="160" y2="271" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)"/></g>
  <g filter="url(#rough2)"><rect x="162" y="250" width="92" height="42" rx="5" fill="#ffffff" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="208" y="278" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">1:2</text>
  <g filter="url(#rough2)"><line x1="256" y1="271" x2="282" y2="271" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)"/></g>
  <g filter="url(#rough2)"><rect x="284" y="250" width="92" height="42" rx="5" fill="#ffffff" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="330" y="278" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">1:3</text>
  <g filter="url(#rough2)"><line x1="378" y1="271" x2="404" y2="271" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)"/></g>
  <g filter="url(#rough2)"><rect x="406" y="250" width="92" height="42" rx="5" fill="#ffffff" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="452" y="278" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">1:4</text>
  <g filter="url(#rough2)"><line x1="500" y1="271" x2="526" y2="271" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)"/></g>
  <g filter="url(#rough2)"><rect x="490" y="224" width="48" height="20" rx="3" fill="#f3d9d6" fill-opacity="0.85" stroke="#8a2b28" stroke-width="1.2"/></g>
  <text x="514" y="238" text-anchor="middle" font-size="10" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">2 位</text>
  <g filter="url(#rough2)"><rect x="528" y="250" width="92" height="42" rx="5" fill="#ffffff" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="574" y="278" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">2:0</text>
  <g filter="url(#rough2)"><line x1="622" y1="271" x2="648" y2="271" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)"/></g>
  <g filter="url(#rough2)"><rect x="650" y="250" width="92" height="42" rx="5" fill="#ffffff" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="696" y="278" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">2:1</text>
  <text x="40" y="208" text-anchor="start" font-size="11" fill="#b06a1e" filter="url(#rough2)">↑ 从 4:4 直接跨天到 0:0（h = 5）</text>
  <g filter="url(#rough2)"><path d="M 818 154 C 818 190, 60 200, 60 248" fill="none" stroke="#b06a1e" stroke-width="1.3" stroke-dasharray="6 5" marker-end="url(#arr)"/></g>
  <text x="450" y="340" text-anchor="middle" font-size="12.5" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">命中的三次跳变（都是分钟回绕）：</text>
  <text x="450" y="368" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">4:4 → 0:0：nz(4) + nz(4) = 1 + 1 = 2（跨天，小时也清零）</text>
  <text x="450" y="394" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">0:4 → 1:0：nz(4) + (1 + t9(0)) = 1 + 1 = 2</text>
  <text x="450" y="420" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">1:4 → 2:0：nz(4) + (1 + t9(1)) = 1 + 1 = 2</text>
  <text x="450" y="452" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">其余 9 次都不进位，变化 1 + t9(M) = 1 位 &lt; k，不计 → 答案 3 ✓</text>
</svg>
