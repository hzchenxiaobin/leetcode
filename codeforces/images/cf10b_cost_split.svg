<svg xmlns="http://www.w3.org/2000/svg" width="780" height="500" viewBox="0 0 780 500"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="29"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="780" height="500" fill="#fafafa"/>

  <text x="390" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">距离和 = 行贡献 × M + 座位贡献</text>
  <path d="M 190 42 Q 390 48 590 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 选中行底色 -->
  <rect x="70" y="296" width="270" height="54" fill="#e4eefa" stroke="none" filter="url(#rough2)"/>
  <!-- 网格 -->
  <rect x="70" y="80" width="270" height="270" fill="none" stroke="#666666" stroke-width="1.6" filter="url(#rough2)"/>
  <g filter="url(#rough2)" stroke="#aaaaaa" stroke-width="1.1">
    <line x1="124" y1="80" x2="124" y2="350"/>
    <line x1="178" y1="80" x2="178" y2="350"/>
    <line x1="232" y1="80" x2="232" y2="350"/>
    <line x1="286" y1="80" x2="286" y2="350"/>
    <line x1="70" y1="134" x2="340" y2="134"/>
    <line x1="70" y1="188" x2="340" y2="188"/>
    <line x1="70" y1="242" x2="340" y2="242"/>
    <line x1="70" y1="296" x2="340" y2="296"/>
  </g>

  <!-- 中心格 -->
  <rect x="178" y="188" width="54" height="54" fill="#d9ecd4" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="205" y="219" text-anchor="middle" font-size="10" fill="#2f5223" filter="url(#rough2)">中心</text>

  <!-- 选中的 3 个座位 -->
  <rect x="124" y="296" width="162" height="54" fill="#fbe3c8" stroke="#c98a2b" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="205" y="328" text-anchor="middle" font-size="10.5" fill="#8a6015" filter="url(#rough2)">#2  #3  #4</text>

  <!-- 行列编号 -->
  <g filter="url(#rough2)" font-size="10" fill="#777777" text-anchor="middle">
    <text x="97" y="74">1</text>
    <text x="151" y="74">2</text>
    <text x="205" y="74">3</text>
    <text x="259" y="74">4</text>
    <text x="313" y="74">5</text>
    <text x="58" y="111">1</text>
    <text x="58" y="165">2</text>
    <text x="58" y="219">3</text>
    <text x="58" y="273">4</text>
    <text x="58" y="327">5</text>
  </g>
  <text x="352" y="74" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">座位 y</text>
  <text x="42" y="74" font-size="10.5" fill="#777777" filter="url(#rough2)">行 x</text>

  <!-- 右侧说明 -->
  <rect x="380" y="66" width="372" height="268" rx="12" fill="#fdeeee" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="396" y="94" font-size="12.5" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">把求和按座位拆开</text>
  <text x="396" y="126" font-size="14" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">S = M·|x−c| + f(y_l)</text>
  <text x="396" y="158" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">行贡献：这一行有 M 个座位，</text>
  <text x="396" y="178" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">每个都要付一次 |x−c|，所以要乘 M</text>
  <text x="396" y="206" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">座位贡献：f 只由 M 和起点决定，</text>
  <text x="396" y="226" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">与行无关，可以算一次给所有行用</text>
  <text x="396" y="256" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">c = (K + 1) / 2 = 3（K = 5）</text>
  <text x="396" y="282" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">y* = c − ⌊M/2⌋ = 3 − 1 = 2</text>
  <text x="396" y="306" font-size="11" fill="#777777" filter="url(#rough2)">（M = 3 时窗口是 [y, y+2]）</text>

  <!-- 连接箭头 -->
  <path d="M 348 323 Q 366 323 374 300" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 实例 -->
  <rect x="40" y="356" width="700" height="120" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="58" y="384" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">本例：x = 5，y_l = 2，M = 3（橙色三个座位）</text>
  <text x="58" y="414" font-size="13" fill="#7a5a1b" filter="url(#rough2)">S = 3·|5−3| + (|2−3| + |3−3| + |4−3|) = 6 + 2 = 8</text>
  <text x="58" y="444" font-size="11.5" fill="#9a7020" filter="url(#rough2)">行越远，第一项越大；座位越偏，第二项越大。两者相加才是题面定义的距离和。</text>
  <text x="58" y="466" font-size="11.5" fill="#9a7020" filter="url(#rough2)">并列举比较时用键 (总距离, 行号, 起点)，不能先把行和座位分开各挑最优。</text>
</svg>
