<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="253"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="320" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">样例 1：10 步的 BP 轨迹 1 → 2 → 3 → 4 → 1</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">两次碰壁 = CP 翻两次 + DP 顺时针转 90°</text>
  <g filter="url(#rough2)"><rect x="80" y="110" width="140" height="60" rx="6" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="150" y="136" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">块 1</text>
  <text x="150" y="158" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">第 0 步</text>
  <text x="150" y="196" text-anchor="middle" font-size="9.5" fill="#666666" filter="url(#rough2)">起点：DP 右、CP 左</text>
  <g filter="url(#rough2)"><rect x="245" y="110" width="140" height="60" rx="6" fill="#f6e3c4" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="315" y="136" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">块 2</text>
  <text x="315" y="158" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">第 1 步</text>
  <g filter="url(#rough2)"><line x1="221" y1="140" x2="241" y2="140" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)"/></g>
  <text x="315" y="196" text-anchor="middle" font-size="9.5" fill="#666666" filter="url(#rough2)">向右进入块 2</text>
  <g filter="url(#rough2)"><rect x="410" y="110" width="140" height="60" rx="6" fill="#dcecd2" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="480" y="136" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">块 3</text>
  <text x="480" y="158" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">第 4 步</text>
  <g filter="url(#rough2)"><line x1="386" y1="140" x2="406" y2="140" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)"/></g>
  <text x="480" y="196" text-anchor="middle" font-size="9.5" fill="#666666" filter="url(#rough2)">碰壁两次后 DP 向下，进入块 3</text>
  <g filter="url(#rough2)"><rect x="575" y="110" width="140" height="60" rx="6" fill="#f3d9d6" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="645" y="136" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">块 4</text>
  <text x="645" y="158" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">第 7 步</text>
  <g filter="url(#rough2)"><line x1="551" y1="140" x2="571" y2="140" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)"/></g>
  <text x="645" y="196" text-anchor="middle" font-size="9.5" fill="#666666" filter="url(#rough2)">再碰壁两次，DP 向左，进入块 4</text>
  <g filter="url(#rough2)"><rect x="740" y="110" width="140" height="60" rx="6" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="810" y="136" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">块 1</text>
  <text x="810" y="158" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">第 10 步</text>
  <g filter="url(#rough2)"><line x1="716" y1="140" x2="736" y2="140" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)"/></g>
  <text x="810" y="196" text-anchor="middle" font-size="9.5" fill="#666666" filter="url(#rough2)">最后 DP 向上，回到块 1</text>
  <text x="450" y="250" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">10 步后落在块 1，颜色 1 ✓</text>
  <text x="450" y="284" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">周期检测：状态 (块, DP, CP) 至多 20000 种，n = 5×10⁷ 也能瞬间跳完</text>
</svg>
