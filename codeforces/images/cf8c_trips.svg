<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="a8c" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="880" height="520" fill="#fafafa"/>

  <text x="440" y="34" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">一趟最多两件：路程只由"这一趟取哪些"决定</text>
  <path d="M 120 46 Q 440 52 760 46" stroke="#2b2b2b" stroke-width="1.2" fill="none"
        filter="url(#rough2)"/>

  <!-- 左：单独一件 -->
  <text x="220" y="84" text-anchor="middle" font-size="14" fill="#23405c" filter="url(#rough2)">只取一件 i</text>
  <circle cx="220" cy="240" r="26" fill="#eef1f7" stroke="#7a8ca6" stroke-width="1.8"
          filter="url(#rough2)"/>
  <text x="220" y="247" text-anchor="middle" font-size="15" fill="#33445c" filter="url(#rough2)">0</text>
  <circle cx="330" cy="140" r="24" fill="#dbe7fb" stroke="#446688" stroke-width="1.8"
          filter="url(#rough2)"/>
  <text x="330" y="147" text-anchor="middle" font-size="15" fill="#23405c" filter="url(#rough2)">i</text>
  <path d="M 238 224 L 312 158" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#a8c)" filter="url(#rough2)"/>
  <path d="M 320 164 L 246 228" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#a8c)" filter="url(#rough2)"/>
  <text x="220" y="330" text-anchor="middle" font-size="12.5" fill="#23405c"
        filter="url(#rough2)">代价 2·d(0, i)</text>
  <text x="220" y="352" text-anchor="middle" font-size="11.5" fill="#666"
        filter="url(#rough2)">出去一次、回来一次</text>

  <!-- 右：一趟两件 -->
  <text x="640" y="84" text-anchor="middle" font-size="14" fill="#23405c" filter="url(#rough2)">一趟取 i 和 j</text>
  <circle cx="520" cy="250" r="26" fill="#eef1f7" stroke="#7a8ca6" stroke-width="1.8"
          filter="url(#rough2)"/>
  <text x="520" y="257" text-anchor="middle" font-size="15" fill="#33445c" filter="url(#rough2)">0</text>
  <circle cx="640" cy="170" r="24" fill="#dbe7fb" stroke="#446688" stroke-width="1.8"
          filter="url(#rough2)"/>
  <text x="640" y="177" text-anchor="middle" font-size="15" fill="#23405c" filter="url(#rough2)">i</text>
  <circle cx="760" cy="230" r="24" fill="#fff3d6" stroke="#d6a040" stroke-width="1.8"
          filter="url(#rough2)"/>
  <text x="760" y="237" text-anchor="middle" font-size="15" fill="#8a6015" filter="url(#rough2)">j</text>
  <path d="M 538 236 L 618 186" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#a8c)" filter="url(#rough2)"/>
  <path d="M 662 184 L 740 218" stroke="#d6a040" stroke-width="1.8" fill="none"
        marker-end="url(#a8c)" filter="url(#rough2)"/>
  <path d="M 742 244 L 546 262" stroke="#446688" stroke-width="1.8" fill="none"
        marker-end="url(#a8c)" filter="url(#rough2)"/>
  <text x="640" y="330" text-anchor="middle" font-size="12.5" fill="#23405c"
        filter="url(#rough2)">d(0, i) + d(i, j) + d(j, 0)</text>
  <text x="640" y="352" text-anchor="middle" font-size="11.5" fill="#666"
        filter="url(#rough2)">第二件顺路，省掉一次往返</text>

  <text x="440" y="404" text-anchor="middle" font-size="12" fill="#444"
        filter="url(#rough2)">把 n 件物品分成若干趟（每趟 1 或 2 件）后，总时间就是各趟代价之和。</text>
  <text x="440" y="430" text-anchor="middle" font-size="12" fill="#444"
        filter="url(#rough2)">顺序、路线都无关紧要——只要确定"哪两件配成一对"，代价就定死了。</text>
  <text x="440" y="462" text-anchor="middle" font-size="11.5" fill="#8a8a8a"
        filter="url(#rough2)">所以问题变成：在 n 件物品上做"单点或配对"的划分，使总代价最小。</text>
</svg>
