<svg xmlns="http://www.w3.org/2000/svg" width="700" height="306" viewBox="0 0 700 306"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1414"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="700" height="306" fill="#fafafa"/>
  <text x="350.0" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">高度取 n − a，计数自然成立</text>
  <path d="M 112.0 42 Q 350.0 48 588.0 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="40.0" y="76.0" text-anchor="start" font-size="12.5" fill="#335478" font-weight="bold" filter="url(#rough2)">最终队列与高度（n = 4）</text>
  <rect x="40" y="90" width="150" height="112" rx="5" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115.0" y="135.9" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">c</text>
  <text x="115.0" y="150.1" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">a=0  h=4</text>
  <text x="115.0" y="164.4" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">前面更高的人 0</text>
  <text x="115.0" y="218.0" text-anchor="middle" font-size="11.0" fill="#555555" filter="url(#rough2)">第 1 位</text>
  <rect x="206" y="90" width="150" height="112" rx="5" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="281.0" y="135.9" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">b</text>
  <text x="281.0" y="150.1" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">a=0  h=4</text>
  <text x="281.0" y="164.4" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">前面更高的人 0</text>
  <text x="281.0" y="218.0" text-anchor="middle" font-size="11.0" fill="#555555" filter="url(#rough2)">第 2 位</text>
  <rect x="372" y="90" width="150" height="112" rx="5" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="447.0" y="135.9" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">d</text>
  <text x="447.0" y="150.1" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">a=2  h=2</text>
  <text x="447.0" y="164.4" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">前面更高的人 2</text>
  <text x="447.0" y="218.0" text-anchor="middle" font-size="11.0" fill="#555555" filter="url(#rough2)">第 3 位</text>
  <rect x="538" y="90" width="150" height="112" rx="5" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="613.0" y="135.9" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">a</text>
  <text x="613.0" y="150.1" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">a=0  h=4</text>
  <text x="613.0" y="164.4" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">前面更高的人 0</text>
  <text x="613.0" y="218.0" text-anchor="middle" font-size="11.0" fill="#555555" filter="url(#rough2)">第 4 位</text>
  <rect x="40" y="232" width="632" height="56" rx="5" fill="#e8eef7" stroke="#335478" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="356.0" y="257.3" text-anchor="middle" font-size="10.5" fill="#335478" filter="url(#rough2)">h = n − a 时 #{j &lt; i : h_j &gt; h_i} = #{j &lt; i : a_j &lt; a_i} = a_i</text>
  <text x="356.0" y="270.3" text-anchor="middle" font-size="10.5" fill="#335478" filter="url(#rough2)">（插入构造保证位置 i 之前恰有 a_i 个 a 更小的人）</text>
  <text x="350.0" y="292" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">身高只需落在 1..10^9，不要求互不相同</text>
</svg>
