<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>

  <rect width="720" height="340" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">顶点数 p 必须是 n 的约数（n = 6）</text>

  <text x="40" y="70" font-size="13.5" fill="#33475c" filter="url(#rough2)">p = 3, d = 2：两类同余类</text>

  <text x="52" y="112" font-size="12" fill="#3a5a7a" filter="url(#rough2)">r = 1</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <circle cx="120" cy="108" r="15" fill="#cfe0f0" stroke="#446688" stroke-width="1.8"/>
    <circle cx="164" cy="108" r="15" fill="#f0f0ee" stroke="#a8a8a2" stroke-width="1.2"/>
    <circle cx="208" cy="108" r="15" fill="#cfe0f0" stroke="#446688" stroke-width="1.8"/>
    <circle cx="252" cy="108" r="15" fill="#f0f0ee" stroke="#a8a8a2" stroke-width="1.2"/>
    <circle cx="296" cy="108" r="15" fill="#cfe0f0" stroke="#446688" stroke-width="1.8"/>
    <circle cx="340" cy="108" r="15" fill="#f0f0ee" stroke="#a8a8a2" stroke-width="1.2"/>
    <text x="120" y="113" fill="#2b3a4a">1</text>
    <text x="164" y="113" fill="#6b6b66">2</text>
    <text x="208" y="113" fill="#2b3a4a">3</text>
    <text x="252" y="113" fill="#6b6b66">4</text>
    <text x="296" y="113" fill="#2b3a4a">5</text>
    <text x="340" y="113" fill="#6b6b66">6</text>
  </g>
  <text x="380" y="112" font-size="12" fill="#3a5a7a" filter="url(#rough2)">座位 1、3、5</text>

  <text x="52" y="162" font-size="12" fill="#8a6015" filter="url(#rough2)">r = 2</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <circle cx="120" cy="158" r="15" fill="#f0f0ee" stroke="#a8a8a2" stroke-width="1.2"/>
    <circle cx="164" cy="158" r="15" fill="#f5e6c8" stroke="#c9a227" stroke-width="1.8"/>
    <circle cx="208" cy="158" r="15" fill="#f0f0ee" stroke="#a8a8a2" stroke-width="1.2"/>
    <circle cx="252" cy="158" r="15" fill="#f5e6c8" stroke="#c9a227" stroke-width="1.8"/>
    <circle cx="296" cy="158" r="15" fill="#f0f0ee" stroke="#a8a8a2" stroke-width="1.2"/>
    <circle cx="340" cy="158" r="15" fill="#f5e6c8" stroke="#c9a227" stroke-width="1.8"/>
    <text x="120" y="163" fill="#6b6b66">1</text>
    <text x="164" y="163" fill="#6b4e12">2</text>
    <text x="208" y="163" fill="#6b6b66">3</text>
    <text x="252" y="163" fill="#6b4e12">4</text>
    <text x="296" y="163" fill="#6b6b66">5</text>
    <text x="340" y="163" fill="#6b4e12">6</text>
  </g>
  <text x="380" y="162" font-size="12" fill="#8a6015" filter="url(#rough2)">座位 2、4、6</text>

  <line x1="40" y1="190" x2="680" y2="190" stroke="#d8d2c6" stroke-width="1.2" filter="url(#rough2)"/>

  <text x="40" y="222" font-size="13.5" fill="#33475c" filter="url(#rough2)">p = 6, d = 1：只有一类（六个座位全要）</text>
  <text x="52" y="264" font-size="12" fill="#3f6b2f" filter="url(#rough2)">r = 1</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <circle cx="120" cy="260" r="15" fill="#dcead0" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="164" cy="260" r="15" fill="#dcead0" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="208" cy="260" r="15" fill="#dcead0" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="252" cy="260" r="15" fill="#dcead0" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="296" cy="260" r="15" fill="#dcead0" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="340" cy="260" r="15" fill="#dcead0" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="120" y="265" fill="#2f5223">1</text>
    <text x="164" y="265" fill="#2f5223">2</text>
    <text x="208" y="265" fill="#2f5223">3</text>
    <text x="252" y="265" fill="#2f5223">4</text>
    <text x="296" y="265" fill="#2f5223">5</text>
    <text x="340" y="265" fill="#2f5223">6</text>
  </g>
  <text x="380" y="264" font-size="12" fill="#3f6b2f" filter="url(#rough2)">全部 6 个座位</text>

  <text x="360" y="316" text-anchor="middle" font-size="12.5" fill="#4a4a4a" filter="url(#rough2)">每个 p | n 只需检查 d = n/p 个同余类，每类 p 个座位</text>
</svg>
