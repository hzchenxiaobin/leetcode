<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="37"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="a8d" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="a8dr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="880" height="520" fill="#fafafa"/>

  <text x="440" y="34" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">公共前缀结束在哪：还没到 C，还是已经路过 C</text>
  <path d="M 110 46 Q 440 52 770 46" stroke="#2b2b2b" stroke-width="1.2" fill="none"
        filter="url(#rough2)"/>

  <!-- 情形 1 -->
  <text x="220" y="82" text-anchor="middle" font-size="14" fill="#23405c" filter="url(#rough2)">情形 1：在 C 之前分开</text>
  <circle cx="120" cy="300" r="14" fill="#eef1f7" stroke="#7a8ca6" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="305" text-anchor="middle" font-size="11" fill="#33445c" filter="url(#rough2)">A</text>
  <circle cx="330" cy="180" r="14" fill="#dbe7fb" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="185" text-anchor="middle" font-size="11" fill="#23405c" filter="url(#rough2)">B</text>
  <circle cx="200" cy="430" r="14" fill="#fff3d6" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="435" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">C</text>
  <circle cx="212" cy="196" r="7" fill="#ffffff" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="224" y="196" font-size="11" fill="#8c3b37" filter="url(#rough2)">P（分开点）</text>
  <path d="M 130 292 L 204 208" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#a8d)" filter="url(#rough2)"/>
  <path d="M 216 190 L 320 182" stroke="#b85450" stroke-width="1.7" fill="none" stroke-dasharray="5 3" marker-end="url(#a8dr)" filter="url(#rough2)"/>
  <path d="M 208 204 L 198 416" stroke="#d6a040" stroke-width="1.7" fill="none" stroke-dasharray="5 3" marker-end="url(#a8d)" filter="url(#rough2)"/>
  <path d="M 212 424 L 316 194" stroke="#d6a040" stroke-width="1.7" fill="none" stroke-dasharray="5 3" marker-end="url(#a8d)" filter="url(#rough2)"/>
  <text x="220" y="470" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">共同走 A→P（长 d）；之后 Alan 还要绕 C</text>

  <!-- 情形 2 -->
  <text x="640" y="82" text-anchor="middle" font-size="14" fill="#8c3b37" filter="url(#rough2)">情形 2：公共部分已路过 C</text>
  <circle cx="520" cy="330" r="14" fill="#eef1f7" stroke="#7a8ca6" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="520" y="335" text-anchor="middle" font-size="11" fill="#33445c" filter="url(#rough2)">A</text>
  <circle cx="770" cy="230" r="14" fill="#dbe7fb" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="770" y="235" text-anchor="middle" font-size="11" fill="#23405c" filter="url(#rough2)">B</text>
  <circle cx="620" cy="170" r="14" fill="#fff3d6" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="620" y="175" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">C</text>
  <circle cx="700" cy="260" r="7" fill="#ffffff" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="712" y="264" font-size="11" fill="#8c3b37" filter="url(#rough2)">P</text>
  <path d="M 530 322 L 608 184" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#a8d)" filter="url(#rough2)"/>
  <path d="M 632 180 L 692 248" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#a8d)" filter="url(#rough2)"/>
  <path d="M 708 256 L 758 234" stroke="#b85450" stroke-width="1.7" fill="none" stroke-dasharray="5 3" marker-end="url(#a8dr)" filter="url(#rough2)"/>
  <text x="640" y="470" text-anchor="middle" font-size="11.5" fill="#444" filter="url(#rough2)">共同走 A→C→P（长 d）；之后 Alan 直接去 B</text>

  <text x="440" y="504" text-anchor="middle" font-size="11.5" fill="#8a8a8a"
        filter="url(#rough2)">两种情形都要满足各自的预算：Bob 的 d+|PB| ≤ |AB|+t2；Alan 的余下路程不能超过他的富余量。</text>
</svg>
