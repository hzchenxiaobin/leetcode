<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="330" fill="#fafafa"/>
  <text x="360.0" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">208A：WUB 当分隔符</text>
  <path d="M 144.00 46 Q 360.0 52 576.00 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="72" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">“WUB”只是分隔符：把字符串按 WUB 切开，丢掉空段即可。</text>
  <text x="60" y="92" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">原歌词里没有词含 WUB，所以每个 WUB 一定是分隔符，不会误伤单词。</text>
  <rect x="60" y="116" width="620" height="60" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="133" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">WUBWUBABCWUB  →  "" , "" , "ABC" , ""  →  只保留非空  →  ABC</text>
  <rect x="60" y="196" width="620" height="60" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="213" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">WUBWEWUBAREWUBWUBTHEWUBCHAMPIONSWUBMYWUBFRIENDWUB</text>
  <text x="74" y="234" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">→ WE ARE THE CHAMPIONS MY FRIEND</text>
  <text x="60" y="288" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">逐字符扫描或直接 split 都可以，长度 ≤ 200。</text>
</svg>
