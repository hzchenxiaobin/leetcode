<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="12"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="450" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">n = 10 的所有可能的取石子链</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <circle cx="600.0" cy="200.0" r="26.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="600.0" y="208.0" text-anchor="middle" font-size="20" fill="#8a6015" font-weight="bold" filter="url(#rough2)">10</text>
  <circle cx="430.0" cy="108.0" r="23.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="430.0" y="116.0" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold" filter="url(#rough2)">5</text>
  <circle cx="430.0" cy="292.0" r="23.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="430.0" y="300.0" text-anchor="middle" font-size="18" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <circle cx="225.0" cy="200.0" r="23.0" fill="#eeeeee" stroke="#777777" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="225.0" y="208.0" text-anchor="middle" font-size="18" fill="#555555" font-weight="bold" filter="url(#rough2)">1</text>
  <line x1="574.0" y1="188.0" x2="455.0" y2="120.0" stroke="#8a6015" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="528.0" y="140.0" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">a = 2 → 5</text>
  <line x1="407.0" y1="120.0" x2="250.0" y2="188.0" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330.0" y="140.0" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">a = 5 → 1</text>
  <line x1="574.0" y1="212.0" x2="455.0" y2="280.0" stroke="#8a6015" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="528.0" y="268.0" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">a = 5 → 2</text>
  <line x1="407.0" y1="280.0" x2="250.0" y2="212.0" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330.0" y="268.0" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">a = 2 → 1</text>
  <rect x="40.0" y="340.0" width="640.0" height="92.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="54.0" y="365.0" text-anchor="start" font-size="13" fill="#3f3420" filter="url(#rough2)">链 10 → 5 → 1：10 + 5 + 1 = 16（最大）</text>
  <text x="54.0" y="391.0" text-anchor="start" font-size="13" fill="#3f3420" filter="url(#rough2)">链 10 → 2 → 1：10 + 2 + 1 = 13</text>
  <text x="54.0" y="417.0" text-anchor="start" font-size="13" fill="#3f3420" filter="url(#rough2)">直接 10 → 1：10 + 1 = 11</text>
</svg>
