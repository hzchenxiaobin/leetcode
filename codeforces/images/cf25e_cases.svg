<svg xmlns="http://www.w3.org/2000/svg" width="740" height="340" viewBox="0 0 740 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="101"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="740" height="340" fill="#fafafa"/>
  <text x="370" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">先剔除被包含的串，再按剩余个数分三种情形</text>

  <g filter="url(#rough2)">
    <rect x="40" y="60" width="200" height="92" rx="9" fill="#f4f6f9" stroke="#8a94a6" stroke-width="1.4"/>
    <text x="140" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66">1 个串</text>
    <text x="140" y="112" text-anchor="middle" font-size="12" fill="#555">三串相同或互相包含</text>
    <text x="140" y="136" text-anchor="middle" font-size="12" fill="#2f5223">答案 = 这个串的长度</text>

    <rect x="260" y="60" width="210" height="92" rx="9" fill="#f4f6f9" stroke="#8a94a6" stroke-width="1.4"/>
    <text x="365" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66">2 个串</text>
    <text x="365" y="112" text-anchor="middle" font-size="12" fill="#555">两个方向各算一次</text>
    <text x="365" y="136" text-anchor="middle" font-size="12" fill="#2f5223">取 |a|+|b|−ov 的较小值</text>

    <rect x="490" y="60" width="210" height="92" rx="9" fill="#f4f6f9" stroke="#8a94a6" stroke-width="1.4"/>
    <text x="595" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66">3 个串</text>
    <text x="595" y="112" text-anchor="middle" font-size="12" fill="#555">枚举 3! = 6 种顺序</text>
    <text x="595" y="136" text-anchor="middle" font-size="12" fill="#2f5223">取公式最小值</text>
  </g>

  <text x="370" y="186" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">重叠 ov(x,y) 用 KMP 求：y + '#' + x 的最后前缀函数值</text>

  <rect x="60" y="204" width="620" height="52" rx="9" fill="#eef4ec" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="76" y="228" font-size="12.5" fill="#2f5223" filter="url(#rough2)">样例 1：ab, bc, cd 两两不包含 ⇒ 顺序 (ab,bc,cd)：2+2+2−1−1 = 4。</text>
  <text x="76" y="248" font-size="12.5" fill="#2f5223" filter="url(#rough2)">样例 2：abacaba, abaaba, x ⇒ 7+6+1−3−0 = 11。</text>

  <text x="370" y="286" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">总长度最多 3×10⁵，每次重叠 O(|x|+|y|)，常数次 ⇒ O(L)。</text>
  <text x="370" y="312" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">注意：这里求的是"超串（子串）"，不是"超序列（子序列）"。</text>
</svg>
