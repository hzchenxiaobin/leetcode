<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="45"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="470" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">h=10, m=2：两条链，各自把格子按探查顺序编号</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="40.0" y="84.0" text-anchor="start" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">链 r = 0（偶数格），链内序号 p = c / g</text>
  <rect x="60.0" y="104.0" width="74.0" height="52.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="97.0" y="128.0" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">格子 0</text>
  <text x="97.0" y="147.0" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">p=0</text>
  <line x1="136.0" y1="130.0" x2="166.0" y2="130.0" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="170.0" y="104.0" width="74.0" height="52.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="207.0" y="128.0" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">格子 2</text>
  <text x="207.0" y="147.0" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">p=1</text>
  <line x1="246.0" y1="130.0" x2="276.0" y2="130.0" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="280.0" y="104.0" width="74.0" height="52.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="317.0" y="128.0" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">格子 4</text>
  <text x="317.0" y="147.0" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">p=2</text>
  <line x1="356.0" y1="130.0" x2="386.0" y2="130.0" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="390.0" y="104.0" width="74.0" height="52.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="427.0" y="128.0" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">格子 6</text>
  <text x="427.0" y="147.0" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">p=3</text>
  <line x1="466.0" y1="130.0" x2="496.0" y2="130.0" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="500.0" y="104.0" width="74.0" height="52.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="537.0" y="128.0" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">格子 8</text>
  <text x="537.0" y="147.0" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">p=4</text>
  <text x="40.0" y="196.0" text-anchor="start" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">链 r = 1（奇数格）</text>
  <rect x="60.0" y="216.0" width="74.0" height="52.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="97.0" y="240.0" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">格子 1</text>
  <text x="97.0" y="259.0" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">p=0</text>
  <line x1="136.0" y1="242.0" x2="166.0" y2="242.0" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="170.0" y="216.0" width="74.0" height="52.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="207.0" y="240.0" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">格子 3</text>
  <text x="207.0" y="259.0" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">p=1</text>
  <line x1="246.0" y1="242.0" x2="276.0" y2="242.0" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="280.0" y="216.0" width="74.0" height="52.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="317.0" y="240.0" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">格子 5</text>
  <text x="317.0" y="259.0" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">p=2</text>
  <line x1="356.0" y1="242.0" x2="386.0" y2="242.0" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="390.0" y="216.0" width="74.0" height="52.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="427.0" y="240.0" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">格子 7</text>
  <text x="427.0" y="259.0" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">p=3</text>
  <line x1="466.0" y1="242.0" x2="496.0" y2="242.0" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="500.0" y="216.0" width="74.0" height="52.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="537.0" y="240.0" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">格子 9</text>
  <text x="537.0" y="259.0" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">p=4</text>
  <rect x="40.0" y="300.0" width="640.0" height="90.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="54.0" y="324.5" text-anchor="start" font-size="12.5" fill="#3f3420" filter="url(#rough2)">哈希 t=6 属于链 r = 6 mod 2 = 0，p = 6/g = 3</text>
  <text x="54.0" y="352.5" text-anchor="start" font-size="12.5" fill="#3f3420" filter="url(#rough2)">在链内从 p0 出发，探查顺序是 p0, p0+1, p0+2, …（模 L）</text>
  <text x="40.0" y="428.0" text-anchor="start" font-size="12.5" fill="#444" filter="url(#rough2)">L = h/g = 5：链内是一个长度为 5 的环，探查必然绕回起点。</text>
</svg>
