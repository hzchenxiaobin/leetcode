<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="83"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="ared" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="460" fill="#fafafa"/>

  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">i→j 与 j→i 两艘飞船相向而行，在三角形半周长处相遇</text>
  <path d="M 120 44 Q 360 50 600 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 三角形 1-i-j -->
  <g filter="url(#rough2)">
    <line x1="80" y1="380" x2="430" y2="380" stroke="#446688" stroke-width="2"/>
    <line x1="80" y1="380" x2="285" y2="115" stroke="#446688" stroke-width="2"/>
    <line x1="430" y1="380" x2="285" y2="115" stroke="#446688" stroke-width="2.2"/>

    <!-- 行星点 -->
    <circle cx="80" cy="380" r="8" fill="#e8f0fe" stroke="#2f4a66" stroke-width="2"/>
    <circle cx="430" cy="380" r="8" fill="#e6f4ea" stroke="#2f5223" stroke-width="2"/>
    <circle cx="285" cy="115" r="8" fill="#fff8e1" stroke="#8a6015" stroke-width="2"/>
    <text x="62" y="392" font-size="12.5" font-weight="bold" fill="#2f4a66">1</text>
    <text x="440" y="392" font-size="12.5" font-weight="bold" fill="#2f5223">i</text>
    <text x="272" y="104" font-size="12.5" font-weight="bold" fill="#8a6015">j</text>

    <!-- 相遇点 M -->
    <circle cx="357" cy="247" r="6.5" fill="#ffffff" stroke="#2b2b2b" stroke-width="2"/>
    <text x="368" y="243" font-size="12" font-weight="bold" fill="#2b2b2b">M 相遇点</text>

    <!-- 两艘船的运动方向 -->
    <path d="M 392 309 L 370 272" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#ag)"/>
    <path d="M 322 186 L 344 223" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#ared)"/>
    <text x="404" y="318" font-size="11" fill="#2f5223">i→j 出发于 d(1,i)</text>
    <text x="232" y="180" font-size="11" fill="#8f3a34">j→i 出发于 d(1,j)</text>

    <!-- 边长标注 -->
    <text x="248" y="396" text-anchor="middle" font-size="12" fill="#2f4a66">d(1,i)</text>
    <text x="150" y="238" font-size="12" fill="#2f4a66">d(1,j)</text>
    <text x="368" y="270" font-size="12" fill="#2f5223">d(i,j)</text>
  </g>

  <!-- 右侧方程 -->
  <g filter="url(#rough2)">
    <rect x="470" y="80" width="232" height="250" rx="12" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
    <text x="486" y="108" font-size="13" font-weight="bold" fill="#2f4a66">时间方程</text>
    <text x="486" y="134" font-size="11.5" fill="#2b2b2b">i→j 已飞：t − d(1,i)</text>
    <text x="486" y="156" font-size="11.5" fill="#2b2b2b">j→i 已飞：t − d(1,j)</text>
    <text x="486" y="180" font-size="11.5" fill="#2b2b2b">两段之和 = d(i,j)：</text>
    <text x="486" y="206" font-size="11.5" fill="#2f5223">(t−d(1,i)) + (t−d(1,j))</text>
    <text x="500" y="224" font-size="11.5" fill="#2f5223">= d(i,j)</text>
    <line x1="486" y1="238" x2="686" y2="238" stroke="#9bb0c4" stroke-width="1"/>
    <text x="486" y="264" font-size="12.5" font-weight="bold" fill="#b85450">t = [d(1,i)+d(1,j)</text>
    <text x="500" y="286" font-size="12.5" font-weight="bold" fill="#b85450">　　　+ d(i,j)] / 2</text>
    <text x="486" y="312" font-size="10.5" fill="#777">三角形半周长</text>
  </g>

  <rect x="40" y="404" width="640" height="46" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="56" y="424" font-size="11.5" fill="#2f5223" filter="url(#rough2)">因 1、i、j 不共线，三角形不等式严格成立，相遇时刻严格落在两艘船的飞行区间内部 → 这是一次真实相撞。</text>
  <text x="56" y="442" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">于是 T ≤ min 半周长；下界见下一张图。</text>
</svg>
