<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="37"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="300" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">两个官方样例：一个除得尽，一个除不尽</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">样例 1：k = 5, l = 25    |    样例 2：k = 3, l = 8</text>
  <g filter="url(#rough2)"><rect x="40" y="90" width="400" height="170" rx="6" fill="#ffffff" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="240" y="116" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">k = 5，l = 25</text>
  <g filter="url(#rough2)"><rect x="70" y="140" width="80" height="44" rx="4" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="110" y="169" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">25</text>
  <g filter="url(#rough2)"><line x1="154" y1="162" x2="200" y2="162" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)"/></g>
  <text x="177" y="152" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">÷5</text>
  <g filter="url(#rough2)"><rect x="204" y="140" width="80" height="44" rx="4" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="244" y="169" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <g filter="url(#rough2)"><line x1="288" y1="162" x2="334" y2="162" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)"/></g>
  <text x="311" y="152" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">÷5</text>
  <g filter="url(#rough2)"><rect x="338" y="140" width="80" height="44" rx="4" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="378" y="169" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="240" y="214" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">除尽到 1，t = 2 ⇒ YES，importance = 1</text>
  <text x="240" y="240" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">输出「YES / 1」</text>
  <g filter="url(#rough2)"><rect x="460" y="90" width="400" height="170" rx="6" fill="#ffffff" fill-opacity="0.85" stroke="#8a2b28" stroke-width="1.4"/></g>
  <text x="660" y="116" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">k = 3，l = 8</text>
  <g filter="url(#rough2)"><rect x="490" y="140" width="80" height="44" rx="4" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="530" y="169" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">8</text>
  <g filter="url(#rough2)"><line x1="574" y1="162" x2="620" y2="162" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)"/></g>
  <text x="597" y="152" text-anchor="middle" font-size="11" fill="#8a2b28" filter="url(#rough2)">÷3</text>
  <g filter="url(#rough2)"><rect x="624" y="140" width="96" height="44" rx="4" fill="#f3d9d6" fill-opacity="0.85" stroke="#8a2b28" stroke-width="1.4"/></g>
  <text x="672" y="169" text-anchor="middle" font-size="12" fill="#8a2b28" filter="url(#rough2)">8%3 = 2</text>
  <text x="660" y="214" text-anchor="middle" font-size="12" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">除不尽 ⇒ 8 不是 3 的幂 ⇒ NO</text>
  <text x="660" y="240" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">输出「NO」，第二行不输出</text>
  <text x="450" y="284" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">l = k 时 t = 1、importance = 0；k &gt; l 时直接 NO</text>
</svg>
