<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="720" height="440" fill="#fafafa"/>

  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">T = a_1 + (n − 1)：每座山都要交一次「翻越费」</text>
  <text x="360" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">以 a = [5, 3, 1] 为例：蓝 = 落差，橙 = 翻越费，红 = 最后一击，灰 = 跳走后弃用</text>

  <!-- 基线 -->
  <path d="M 34 308 L 390 308" stroke="#999" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <!-- 1 号山：高度 5 -->
  <g filter="url(#rough2)">
    <rect x="52" y="178" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <rect x="52" y="204" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <rect x="52" y="230" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3"/>
    <rect x="52" y="256" width="60" height="26" fill="#efefef" stroke="#c0c0c0" stroke-width="1.2" rx="3"/>
    <rect x="52" y="282" width="60" height="26" fill="#efefef" stroke="#c0c0c0" stroke-width="1.2" rx="3"/>
    <text x="82" y="196" text-anchor="middle" font-size="10" fill="#446688">5</text>
    <text x="82" y="222" text-anchor="middle" font-size="10" fill="#446688">4</text>
    <text x="82" y="248" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a6a20">3</text>
    <text x="82" y="274" text-anchor="middle" font-size="9" fill="#aaa">2</text>
    <text x="82" y="300" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  </g>
  <text x="82" y="170" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">3 次</text>
  <text x="82" y="326" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">a_1 = 5</text>
  <text x="82" y="342" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">1 号山</text>

  <!-- 2 号山：高度 3 -->
  <g filter="url(#rough2)">
    <rect x="152" y="230" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <rect x="152" y="256" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <rect x="152" y="282" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3"/>
    <text x="182" y="248" text-anchor="middle" font-size="10" fill="#446688">3</text>
    <text x="182" y="274" text-anchor="middle" font-size="10" fill="#446688">2</text>
    <text x="182" y="300" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a6a20">1</text>
  </g>
  <text x="182" y="222" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">3 次</text>
  <text x="182" y="326" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">a_2 = 3</text>
  <text x="182" y="342" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">2 号山</text>

  <!-- 3 号山：高度 1（最后一座） -->
  <g filter="url(#rough2)">
    <rect x="252" y="282" width="60" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3"/>
    <text x="282" y="300" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a3a36">1</text>
  </g>
  <text x="282" y="274" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">1 次</text>
  <text x="282" y="326" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">a_3 = 1</text>
  <text x="282" y="342" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">3 号山（末座）</text>

  <!-- 跳跃箭头 -->
  <path d="M 114 264 Q 132 246 148 241" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="4 3" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="130" y="236" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">跳过去</text>

  <!-- 右侧图例 -->
  <text x="400" y="84" font-size="10.5" font-weight="bold" fill="#555" filter="url(#rough2)">图例</text>

  <rect x="400" y="92" width="18" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="426" y="103" font-size="10" fill="#2c3e50" filter="url(#rough2)">落差 a_i − a_{i+1}</text>
  <text x="426" y="117" font-size="9" fill="#888" filter="url(#rough2)">把脚下削到与下一座齐平，共 2 + 2 = 4 次</text>

  <rect x="400" y="128" width="18" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="426" y="139" font-size="10" fill="#8a6a20" filter="url(#rough2)">翻越费 +1</text>
  <text x="426" y="153" font-size="9" fill="#888" filter="url(#rough2)">脚下必须比下一座更低才跳得过去，共 n − 1 = 2 次</text>

  <rect x="400" y="164" width="18" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="426" y="175" font-size="10" fill="#8a3a36" filter="url(#rough2)">最后一击</text>
  <text x="426" y="189" font-size="9" fill="#888" filter="url(#rough2)">末座归零即判负，共 a_n = 1 次</text>

  <rect x="400" y="200" width="18" height="14" fill="#efefef" stroke="#c0c0c0" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="426" y="211" font-size="10" fill="#777" filter="url(#rough2)">弃用高度</text>
  <text x="426" y="225" font-size="9" fill="#888" filter="url(#rough2)">跳走之后，脚下剩下的部分再也没人砸</text>

  <text x="400" y="254" font-size="9.5" fill="#666" filter="url(#rough2)">于是总次数 = 4 + 2 + 1 = 7 = a_1 + n − 1</text>
  <text x="400" y="272" font-size="9.5" fill="#666" filter="url(#rough2)">与中间的 a_2, a_3 具体多大无关（只影响配色分配）</text>

  <!-- 公式框 -->
  <rect x="40" y="356" width="640" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="360" y="376" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">T = (a_1−a_2+1) + (a_2−a_3+1) + … + (a_{n−1}−a_n+1) + a_n = a_1 + (n − 1)</text>
  <text x="360" y="394" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">对 Ver 完全对称：T_V = b_1 + (m − 1)；谁先被砸空谁输</text>

  <text x="360" y="428" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">中间的落差会一路抵消（望远镜求和），最后只剩开头那座的高度和山的座数</text>
</svg>
