<svg xmlns="http://www.w3.org/2000/svg" width="700" height="290" viewBox="0 0 700 290"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="383"/>
    <feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></defs>
  <rect width="700" height="290" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">为什么"能开就开"是对的</text>
  <path d="M 160 40 Q 350 46 540 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="66" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="12.5" fill="#22314a" filter="url(#rough2)">不变式：处理完位置 i 后，栈深 s(i) 必须满足 s(i) ≤ n−i（剩下的位置最多只能闭 s 个）。</text>
  <text x="76" y="106" font-size="12.5" fill="#22314a" filter="url(#rough2)">这个界是必要且充分的：只要一直满足，最后就能全部闭掉。</text>
  <text x="76" y="122" font-size="12" fill="#2f4a66">（必要性：闭一次只减 1。充分性：后面全闭需要栈顶逐个匹配，靠 p 的类型。）</text>
  <g filter="url(#rough2)"><rect x="60" y="136" width="580" height="66" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="76" y="160" font-size="12.5" fill="#8a6015" filter="url(#rough2)">交换论证：若在位置 i 贪心选择"开"，而某个合法方案在 i 处"闭"，</text>
  <text x="76" y="184" font-size="12.5" fill="#8a6015" filter="url(#rough2)">把两者的 i 与"该方案中第一次闭 p_i 的位置 j"对调，仍然合法且不破坏约束。</text>
  <g filter="url(#rough2)"><rect x="60" y="214" width="580" height="66" rx="8" fill="#e8f4e0" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="238" font-size="12.5" fill="#2f5223" filter="url(#rough2)">于是贪心得到的方案与某个合法方案"逐步一致"；若贪心在中途失败（栈顶不匹配/末尾栈非空），</text>
  <text x="76" y="262" font-size="12.5" fill="#2f5222" filter="url(#rough2)">则任何方案都会在同一处失败 ⇒ 输出 NO 正确。</text>
</svg>
