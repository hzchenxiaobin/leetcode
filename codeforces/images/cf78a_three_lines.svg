<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>

  <rect width="720" height="420" fill="#fafafa"/>

  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">三行各数一次元音，再和 5 / 7 / 5 比</text>
  <path d="M 120 48 Q 360 54 600 48" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 第一行 -->
  <text x="30" y="112" font-size="13" fill="#7a5a2a" filter="url(#rough2)">第 1 行</text>
  <rect x="86" y="92" width="96" height="40" rx="7" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="134" y="118" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">on : 1</text>
  <rect x="194" y="92" width="146" height="40" rx="7" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="267" y="118" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">codeforces : 4</text>
  <rect x="560" y="92" width="130" height="40" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="625" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5223" filter="url(#rough2)">Σ = 5 ✓</text>

  <!-- 第二行 -->
  <text x="30" y="196" font-size="13" fill="#7a5a2a" filter="url(#rough2)">第 2 行</text>
  <rect x="86" y="176" width="92" height="40" rx="7" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="132" y="202" text-anchor="middle" font-size="14" fill="#2f5223" filter="url(#rough2)">beta : 2</text>
  <rect x="186" y="176" width="102" height="40" rx="7" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="237" y="202" text-anchor="middle" font-size="14" fill="#2f5223" filter="url(#rough2)">round : 2</text>
  <rect x="296" y="176" width="80" height="40" rx="7" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="336" y="202" text-anchor="middle" font-size="14" fill="#2f5223" filter="url(#rough2)">is : 1</text>
  <rect x="384" y="176" width="126" height="40" rx="7" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="447" y="202" text-anchor="middle" font-size="14" fill="#2f5223" filter="url(#rough2)">running : 2</text>
  <rect x="560" y="176" width="130" height="40" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="625" y="202" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5223" filter="url(#rough2)">Σ = 7 ✓</text>

  <!-- 第三行 -->
  <text x="30" y="280" font-size="13" fill="#7a5a2a" filter="url(#rough2)">第 3 行</text>
  <rect x="86" y="260" width="72" height="40" rx="7" fill="#ffffff" stroke="#a05a5a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="122" y="286" text-anchor="middle" font-size="14" fill="#6b3030" filter="url(#rough2)">a : 1</text>
  <rect x="166" y="260" width="116" height="40" rx="7" fill="#ffffff" stroke="#a05a5a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="224" y="286" text-anchor="middle" font-size="14" fill="#6b3030" filter="url(#rough2)">rustling : 2</text>
  <rect x="290" y="260" width="80" height="40" rx="7" fill="#ffffff" stroke="#a05a5a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="286" text-anchor="middle" font-size="14" fill="#6b3030" filter="url(#rough2)">of : 1</text>
  <rect x="378" y="260" width="94" height="40" rx="7" fill="#ffffff" stroke="#a05a5a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="425" y="286" text-anchor="middle" font-size="14" fill="#6b3030" filter="url(#rough2)">keys : 1</text>
  <rect x="560" y="260" width="130" height="40" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="625" y="286" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5223" filter="url(#rough2)">Σ = 5 ✓</text>

  <rect x="86" y="330" width="604" height="58" rx="10" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="388" y="352" text-anchor="middle" font-size="14" fill="#2f5223" filter="url(#rough2)">多空格、行首行尾空格都只是分隔符：切不切词都不改变元音总数</text>
  <text x="388" y="374" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5223" filter="url(#rough2)">c = (5, 7, 5) → YES</text>
</svg>
