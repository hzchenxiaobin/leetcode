<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1053"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="760" height="320" fill="#fafafa"/>
  <text x="380.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">通过概率 = 多数票 + 上诉兜底</text>
  <path d="M 121.60000000000001 42 Q 380.0 48 638.4 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="380.0" y="306" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">枚举分糖 → 枚举投票面 → 加权求和</text>
  <rect x="30" y="70" width="700" height="60" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="96" text-anchor="middle" font-size="12.5" fill="#2f5223" filter="url(#rough2)">每颗糖 +10% 忠诚（上限 100%）→ pᵢ = min(1, (lᵢ+10cᵢ)/100)</text>
  <rect x="30" y="142" width="700" height="56" rx="7" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="166" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">赞成票 &gt; n/2 → 直接通过（概率 1）</text>
  <text x="380" y="188" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">否则上诉：成功概率 A / (A + 反对者等级和)</text>
  <rect x="30" y="210" width="700" height="50" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="233" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">总通过概率 = Σ 投票面概率 × 该分支通过率</text>
  <text x="380" y="268" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">方案数 C(k+n−1, n−1) ≤ 6435，投票面 ≤ 256</text>
  <text x="380" y="292" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">样例 3：p=0.5 → 0.5 + 0.5·(20/40) = 0.75</text>
</svg>
