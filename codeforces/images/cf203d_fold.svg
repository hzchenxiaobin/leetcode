<svg xmlns="http://www.w3.org/2000/svg" width="720" height="370" viewBox="0 0 720 370"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="370" fill="#fafafa"/>
  <text x="360.0" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">203D：把反射展开成直线再折叠</text>
  <path d="M 144.00 46 Q 360.0 52 576.00 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="72" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">一维反射的“展开”：把 [0,a] 的来回反弹看成直线运动对 2a 取模，再折回来。</text>
  <text x="60" y="92" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">位置 p 在 [0,a] 内不动，[a,2a] 内镜像成 2a-p；x 的周期是 2a，z 的周期是 2b。</text>
  <line x1="60" y1="180" x2="680" y2="180" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="80" y1="172" x2="80" y2="188" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="80" y="204" text-anchor="middle" font-size="10" fill="#33506e" filter="url(#rough2)">0</text>
  <line x1="220" y1="172" x2="220" y2="188" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="220" y="204" text-anchor="middle" font-size="10" fill="#33506e" filter="url(#rough2)">a</text>
  <line x1="360" y1="172" x2="360" y2="188" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="360" y="204" text-anchor="middle" font-size="10" fill="#33506e" filter="url(#rough2)">2a</text>
  <line x1="500" y1="172" x2="500" y2="188" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="500" y="204" text-anchor="middle" font-size="10" fill="#33506e" filter="url(#rough2)">3a</text>
  <line x1="640" y1="172" x2="640" y2="188" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="640" y="204" text-anchor="middle" font-size="10" fill="#33506e" filter="url(#rough2)">4a</text>
  <text x="80" y="150" text-anchor="middle" font-size="10" fill="#2f5b34" filter="url(#rough2)">真实走廊 (0..a)</text>
  <text x="220" y="150" text-anchor="middle" font-size="10" fill="#8a3a52" filter="url(#rough2)">镜像</text>
  <text x="360" y="150" text-anchor="middle" font-size="10" fill="#2f5b34" filter="url(#rough2)">真实</text>
  <text x="500" y="150" text-anchor="middle" font-size="10" fill="#8a3a52" filter="url(#rough2)">镜像</text>
  <text x="640" y="150" text-anchor="middle" font-size="10" fill="#2f5b34" filter="url(#rough2)">真实</text>
  <path d="M 80 180 L 500 180" stroke="#5b8c5a" stroke-width="2.4" fill="none" filter="url(#rough2)"/>
  <circle cx="500" cy="180" r="5" fill="#c0708a" stroke="#8a3a52" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="470" y="232" text-anchor="start" font-size="10" fill="#8a3a52" filter="url(#rough2)">展开后的位置</text>
  <path d="M 500 196 L 500 210 L 360 210" stroke="#c0708a" stroke-width="1.5" fill="none" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="300" y="232" text-anchor="start" font-size="10" fill="#8a3a52" filter="url(#rough2)">折回 → 2a-(p mod 2a)</text>
  <rect x="60" y="256" width="620" height="64" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="274" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">用整数通分算：x 的通分分母 2|vy|、模数 4a|vy|；z 的分母 |vy|、模数 2b|vy|。</text>
  <text x="74" y="296" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">只在最后做一次除法 ⇒ 避免浮点累积误差，输出 10 位小数。</text>
</svg>
