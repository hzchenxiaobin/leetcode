<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="330" fill="#fafafa"/>
  <text x="360.0" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">204B：选定一种颜色，算最少的翻转数</text>
  <path d="M 144.00 46 Q 360.0 52 576.00 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="72" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">枚举“要凑成哪种颜色 c”，其他颜色都无所谓。</text>
  <text x="60" y="92" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">设已是 c 的牌数为 f、正面非 c 而背面是 c 的牌数为 g，则需要 flip 的张数 = max(0, half − f)。</text>
  <rect x="60" y="112" width="290" height="104" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="130" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">f = 正面就是 c 的牌数</text>
  <text x="74" y="152" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">g = 正面非 c、背面是 c 的牌数</text>
  <text x="74" y="174" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">half = ceil(n/2)</text>
  <text x="74" y="196" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">需翻转 max(0, half − f) 张</text>
  <text x="74" y="218" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">可行 ⟺ 需要数 ≤ g</text>
  <rect x="380" y="112" width="290" height="104" rx="9" fill="#fdeef1" stroke="#c0708a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="394" y="130" text-anchor="start" font-size="11" fill="#8a3a52" filter="url(#rough2)">候选颜色：所有出现过的颜色</text>
  <text x="394" y="152" text-anchor="start" font-size="11" fill="#8a3a52" filter="url(#rough2)">（只在背面出现的颜色也合法，</text>
  <text x="394" y="174" text-anchor="start" font-size="11" fill="#8a3a52" filter="url(#rough2)">  此时 f = 0）</text>
  <text x="394" y="196" text-anchor="start" font-size="11" fill="#8a3a52" filter="url(#rough2)">取所有可行颜色里翻转数最小者</text>
  <text x="394" y="218" text-anchor="start" font-size="11" fill="#8a3a52" filter="url(#rough2)">都不行 ⇒ −1</text>
  <text x="60" y="248" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">样例二：颜色 7 的 f = 1（第二张正面）、g = 2（第一、四张），half = 3 ⇒ 翻 2 张。</text>
  <text x="60" y="272" text-anchor="start" font-size="11" fill="#8a3a52" filter="url(#rough2)">注意 a = b 的牌只会贡献 f，不会贡献 g（它翻过来还是 c，没有意义）。</text>
</svg>
