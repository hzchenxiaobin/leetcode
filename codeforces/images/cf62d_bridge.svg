<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430">
<defs>
  <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs>
<rect x="0" y="0" width="760" height="430" fill="#fafafa"/>
<text x="380.0" y="34" font-size="22" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="bold" text-anchor="middle" filter="url(#rough2)">补完时的选边规则：能不走过桥就先不走</text>
<line x1="200" y1="150" x2="360" y2="100" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
<line x1="200" y1="150" x2="360" y2="220" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
<line x1="360" y1="100" x2="540" y2="80" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
<line x1="360" y1="220" x2="540" y2="200" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
<line x1="540" y1="80" x2="540" y2="200" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
<circle cx="200" cy="150" r="26" fill="#fff4d6" stroke="#666" stroke-width="2" filter="url(#rough2)"/>
<text x="200" y="156" font-size="13" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">cur</text>
<circle cx="360" cy="100" r="26" fill="#e8f0fe" stroke="#666" stroke-width="2" filter="url(#rough2)"/>
<text x="360" y="106" font-size="13" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">a</text>
<circle cx="360" cy="220" r="26" fill="#e8f0fe" stroke="#666" stroke-width="2" filter="url(#rough2)"/>
<text x="360" y="226" font-size="13" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">b</text>
<circle cx="540" cy="80" r="26" fill="#e8f0fe" stroke="#666" stroke-width="2" filter="url(#rough2)"/>
<text x="540" y="86" font-size="13" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">c</text>
<circle cx="540" cy="200" r="26" fill="#e8f0fe" stroke="#666" stroke-width="2" filter="url(#rough2)"/>
<text x="540" y="206" font-size="13" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">d</text>
<text x="120" y="300" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#2e7d32" font-weight="normal" text-anchor="start" filter="url(#rough2)">cur 处有两条出边：cur-a 是桥，cur-b 不是</text>
<text x="120" y="332" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#1a5fb4" font-weight="normal" text-anchor="start" filter="url(#rough2)">先走非桥边 cur→b，最后再走桥 cur→a</text>
<text x="120" y="364" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#c0392b" font-weight="normal" text-anchor="start" filter="url(#rough2)">若先过桥，cur 这一侧的剩余边就再也回不来了</text>
</svg>
