<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="173"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="400" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">以入口 s 为根：路径上的边走一次，侧子树走两次</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">每条侧子树有一半概率排在「通往出口的儿子」之前，被完整探索（下去 + 回来）</text>
  <g filter="url(#rough2)"><line x1="150" y1="120" x2="150" y2="170" stroke="#8a2b28" stroke-width="2.6"/></g>
  <g filter="url(#rough2)"><line x1="150" y1="230" x2="60" y2="290" stroke="#999999" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><line x1="150" y1="230" x2="240" y2="290" stroke="#8a2b28" stroke-width="2.6"/></g>
  <g filter="url(#rough2)"><line x1="150" y1="120" x2="330" y2="170" stroke="#999999" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><line x1="330" y1="230" x2="400" y2="300" stroke="#999999" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><line x1="330" y1="230" x2="540" y2="300" stroke="#999999" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><line x1="540" y1="360" x2="700" y2="300" stroke="#999999" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><circle cx="150" cy="90" r="30" fill="#f6e3c4" fill-opacity="0.9" stroke="#b06a1e" stroke-width="1.5"/></g>
  <text x="150" y="94.68" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">s</text>
  <g filter="url(#rough2)"><circle cx="150" cy="200" r="28" fill="#f6e3c4" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="150" y="203.96" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">v₁</text>
  <g filter="url(#rough2)"><circle cx="330" cy="200" r="28" fill="#cfe0f5" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="330" y="203.96" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">v₂</text>
  <g filter="url(#rough2)"><circle cx="60" cy="320" r="26" fill="#dcecd2" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="60" y="323.96" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">侧</text>
  <g filter="url(#rough2)"><circle cx="240" cy="320" r="26" fill="#f3d9d6" fill-opacity="0.9" stroke="#8a2b28" stroke-width="1.5"/></g>
  <text x="240" y="324.32" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">t</text>
  <g filter="url(#rough2)"><circle cx="400" cy="330" r="26" fill="#dcecd2" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="400" y="333.96" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">侧</text>
  <g filter="url(#rough2)"><circle cx="540" cy="330" r="26" fill="#dcecd2" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="540" y="333.96" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">侧</text>
  <g filter="url(#rough2)"><circle cx="700" cy="330" r="26" fill="#dcecd2" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="700" y="333.96" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">侧</text>
  <text x="240" y="366" text-anchor="middle" font-size="10.5" fill="#8a2b28" filter="url(#rough2)">出口</text>
  <text x="150" y="246" text-anchor="start" font-size="11" fill="#8a2b28" filter="url(#rough2)">路径 s → v₁ → t：每条边只走一次</text>
  <text x="330" y="250" text-anchor="start" font-size="11" fill="#4a7a3a" filter="url(#rough2)">侧子树：完整探索 = 2×（内部边数）</text>
  <g filter="url(#rough2)"><rect x="60" y="60" width="800" height="20" rx="6" fill="#ffffff" fill-opacity="0" stroke="#ffffff" stroke-width="1.4"/></g>
  <text x="450" y="42" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">count = d + 2·Σ（排在特殊儿子之前的侧子树边数）</text>
</svg>
