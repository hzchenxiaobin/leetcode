<svg xmlns="http://www.w3.org/2000/svg" width="880" height="290" viewBox="0 0 880 290"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="290" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">逐家计算快乐值</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">取最大</text>
  <text x="150" y="110" text-anchor="start" font-size="13" fill="#2b2b2b" filter="url(#rough2)">若 t_i &gt; k：快乐 = f_i - (t_i - k)</text>
  <text x="150" y="150" text-anchor="start" font-size="13" fill="#2f4a66" filter="url(#rough2)">否则：快乐 = f_i</text>
  <text x="150" y="192" text-anchor="start" font-size="13" fill="#3d6b2f" filter="url(#rough2)">取所有餐厅的最大值（可能为负）</text>
</svg>
