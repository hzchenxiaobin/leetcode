<svg xmlns="http://www.w3.org/2000/svg" width="884" height="384" viewBox="0 0 884 384"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="121"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="884" height="384" fill="#fafafa"/>
  <text x="442" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">分块：每块维护 lazy 与“块内幸运数个数”</text>
  <text x="442" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">实际值 = 存储值 + lazy</text>
  <g filter="url(#rough2)"><rect x="90" y="120" width="132" height="70" rx="4" fill="#cfe0f5" fill-opacity="0.5" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="156" y="146" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">块 0</text>
  <text x="156" y="166" text-anchor="middle" font-size="10" fill="#2f4a66" filter="url(#rough2)">lazy=0</text>
  <text x="156" y="182" text-anchor="middle" font-size="10" fill="#3d6b2f" filter="url(#rough2)">lucky=…</text>
  <g filter="url(#rough2)"><rect x="240" y="120" width="132" height="70" rx="4" fill="#d7ecd0" fill-opacity="0.5" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="306" y="146" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">块 1</text>
  <text x="306" y="166" text-anchor="middle" font-size="10" fill="#2f4a66" filter="url(#rough2)">lazy=2</text>
  <text x="306" y="182" text-anchor="middle" font-size="10" fill="#3d6b2f" filter="url(#rough2)">lucky=…</text>
  <g filter="url(#rough2)"><rect x="390" y="120" width="132" height="70" rx="4" fill="#f6e3c4" fill-opacity="0.5" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="456" y="146" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">块 2</text>
  <text x="456" y="166" text-anchor="middle" font-size="10" fill="#2f4a66" filter="url(#rough2)">lazy=4</text>
  <text x="456" y="182" text-anchor="middle" font-size="10" fill="#3d6b2f" filter="url(#rough2)">lucky=…</text>
  <g filter="url(#rough2)"><rect x="540" y="120" width="132" height="70" rx="4" fill="#f6d9d7" fill-opacity="0.5" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="606" y="146" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">块 3</text>
  <text x="606" y="166" text-anchor="middle" font-size="10" fill="#2f4a66" filter="url(#rough2)">lazy=6</text>
  <text x="606" y="182" text-anchor="middle" font-size="10" fill="#3d6b2f" filter="url(#rough2)">lucky=…</text>
  <g filter="url(#rough2)"><rect x="690" y="120" width="132" height="70" rx="4" fill="#cfe0f5" fill-opacity="0.5" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="756" y="146" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">块 4</text>
  <text x="756" y="166" text-anchor="middle" font-size="10" fill="#2f4a66" filter="url(#rough2)">lazy=8</text>
  <text x="756" y="182" text-anchor="middle" font-size="10" fill="#3d6b2f" filter="url(#rough2)">lucky=…</text>
  <text x="442" y="246" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">整块加：lazy += d，再用 30 个幸运值重算块内幸运数个数</text>
  <text x="442" y="278" text-anchor="middle" font-size="11.5" fill="#3d6b2f" filter="url(#rough2)">整块查询：直接取 lucky（O(1)）；零散部分逐元素算</text>
  <text x="442" y="310" text-anchor="middle" font-size="11" fill="#8a2b28" filter="url(#rough2)">关键界：每个元素最终 ≤ 10⁴ 且只增 ⇒ 每块 lazy ≤ 10⁴ ⇒ 整块更新次数有限</text>
  <text x="442" y="346" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">块大小 B≈400：查询 O(n/B+B)，实测 C++ 266 ms</text>
</svg>
