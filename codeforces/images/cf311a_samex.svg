<svg xmlns="http://www.w3.org/2000/svg" width="700" height="290" viewBox="0 0 700 290"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1101"/>
    <feDisplacementMap in="SourceGraphic" scale="1.5"/></filter></defs>
  <rect width="700" height="290" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">把 x 全设成一样 ⇒ 内层永远不会 break</text>
  <path d="M 120 40 Q 350 46 580 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="86" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="12.5" fill="#22314a" filter="url(#rough2)">break 条件是 p[j].x − p[i].x ≥ d。若所有点 x 相同，则差恒为 0；</text>
  <text x="76" y="106" font-size="12.5" fill="#22314a" filter="url(#rough2)">而 d 是"最小点对距离"，点互不相同 ⇒ d ≥ 1 &gt; 0 ⇒ 条件永不成立。</text>
  <text x="76" y="130" font-size="12.5" fill="#22314a" filter="url(#rough2)">⇒ 两层循环完整跑满：tot = n(n−1)/2。</text>
  <g filter="url(#rough2)"><rect x="60" y="152" width="580" height="66" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="76" y="176" font-size="13" fill="#8a6015" filter="url(#rough2)">所以 k &lt; n(n−1)/2 时输出 (0,0),(0,1),…,(0,n−1) 即可让 tot &gt; k。</text>
  <text x="76" y="200" font-size="13" fill="#8a6015" filter="url(#rough2)">k ≥ n(n−1)/2 时无解（tot 上界就是 n(n−1)/2）⇒ 输出 no solution。</text>
  <g filter="url(#rough2)"><rect x="60" y="228" width="580" height="52" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="252" font-size="12.5" fill="#2f5223" filter="url(#rough2)">样例 1（n=4,k=3）：6 &gt; 3 ⇒ 输出 4 个点 ✓（官方给正方形，同样成立）</text>
  <text x="76" y="272" font-size="12.5" fill="#2f5223" filter="url(#rough2)">样例 2（n=2,k=100）：上界 1 &lt; 100 ⇒ no solution ✓</text>
</svg>
