<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
    <feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></defs>
  <rect width="720" height="340" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">能盖住所有的线段，必须同时取到 min l 与 max r</text>
  <path d="M 150 40 Q 360 46 570 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <line x1="60" y1="250" x2="670" y2="250" stroke="#2b2b2b" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="272" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="670" y="272" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">10</text>

  <!-- 各线段 -->
  <rect x="80" y="80" width="120" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="140" y="98" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">[1, 5]</text>
  <rect x="130" y="116" width="60" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="160" y="134" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">[2, 3]</text>
  <rect x="80" y="152" width="360" height="26" rx="6" fill="#fde8e8" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="170" text-anchor="middle" font-size="11" font-weight="bold" fill="#8c2f2b" filter="url(#rough2)">[1, 10]  ← 同时取到 min l = 1 与 max r = 10</text>
  <rect x="400" y="188" width="120" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="460" y="206" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">[7, 10]</text>
  <rect x="400" y="224" width="60" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="430" y="242" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">[7, 7]</text>

  <text x="60" y="300" font-size="12" fill="#2b2b2b" filter="url(#rough2)">若线段 i 覆盖全部，则 l_i ≤ 所有 l（故 l_i = min l），r_i ≥ 所有 r（故 r_i = max r）；</text>
  <text x="60" y="322" font-size="12" fill="#2b2b2b" filter="url(#rough2)">反过来，取到 (min l, max r) 的那条线段一定覆盖所有线段。因此只要找这一条。</text>
</svg>
