<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="780" height="430" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">建图：两排建筑 a、b，只有三类旧路（n = 4 示意）</text>

  <!-- 竖边 v_i -->
  <line x1="120" y1="136" x2="120" y2="244" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <line x1="290" y1="136" x2="290" y2="244" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <line x1="460" y1="136" x2="460" y2="244" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <line x1="630" y1="136" x2="630" y2="244" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>

  <!-- 上斜边 y_i = a_i - b_{i+1} -->
  <line x1="120" y1="136" x2="290" y2="244" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <line x1="290" y1="136" x2="460" y2="244" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <line x1="460" y1="136" x2="630" y2="244" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>

  <!-- 下斜边 z_i = a_{i+1} - b_i -->
  <line x1="290" y1="136" x2="120" y2="244" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <line x1="460" y1="136" x2="290" y2="244" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <line x1="630" y1="136" x2="460" y2="244" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>

  <!-- a 行节点 -->
  <circle cx="120" cy="115" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="290" cy="115" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="460" cy="115" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="630" cy="115" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="121" text-anchor="middle" font-size="13" fill="#2f4a63" filter="url(#rough2)">a1</text>
  <text x="290" y="121" text-anchor="middle" font-size="13" fill="#2f4a63" filter="url(#rough2)">a2</text>
  <text x="460" y="121" text-anchor="middle" font-size="13" fill="#2f4a63" filter="url(#rough2)">a3</text>
  <text x="630" y="121" text-anchor="middle" font-size="13" fill="#2f4a63" filter="url(#rough2)">a4</text>

  <!-- b 行节点 -->
  <circle cx="120" cy="265" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="290" cy="265" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="460" cy="265" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="630" cy="265" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="271" text-anchor="middle" font-size="13" fill="#33612a" filter="url(#rough2)">b1</text>
  <text x="290" y="271" text-anchor="middle" font-size="13" fill="#33612a" filter="url(#rough2)">b2</text>
  <text x="460" y="271" text-anchor="middle" font-size="13" fill="#33612a" filter="url(#rough2)">b3</text>
  <text x="630" y="271" text-anchor="middle" font-size="13" fill="#33612a" filter="url(#rough2)">b4</text>

  <!-- 起点标记 -->
  <text x="120" y="78" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">起点 a1</text>

  <!-- 图例 -->
  <line x1="46" y1="330" x2="92" y2="330" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="102" y="335" font-size="12.5" fill="#444" filter="url(#rough2)">竖边 v_i = a_i–b_i（每列一条）</text>
  <line x1="46" y1="362" x2="92" y2="362" stroke="#446688" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="102" y="367" font-size="12.5" fill="#444" filter="url(#rough2)">上斜边 y_i = a_i–b_{i+1}</text>
  <line x1="46" y1="394" x2="92" y2="394" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="102" y="399" font-size="12.5" fill="#444" filter="url(#rough2)">下斜边 z_i = a_{i+1}–b_i</text>

  <rect x="430" y="306" width="322" height="104" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="591" y="332" text-anchor="middle" font-size="12.5" fill="#8a6520" filter="url(#rough2)">切 i（前 i 列 vs 后 n−i 列）</text>
  <text x="591" y="356" text-anchor="middle" font-size="12.5" fill="#8a6520" filter="url(#rough2)">跨边恰好只有 y_i 与 z_i 两条</text>
  <text x="591" y="380" text-anchor="middle" font-size="12.5" fill="#8a6520" filter="url(#rough2)">同公司 ⇒ 2 km，不同公司 ⇒ 1 km</text>
  <text x="591" y="402" text-anchor="middle" font-size="12.5" fill="#8a6520" filter="url(#rough2)">图是二分图：A = a 排，B = b 排</text>
</svg>
