<svg xmlns="http://www.w3.org/2000/svg" width="720" height="372" viewBox="0 0 720 372"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>

  <rect width="720" height="372" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按字母是否相等分三类（第四类被支配）</text>
  <path d="M 120 40 Q 360 46 600 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 情况 1 -->
  <g filter="url(#rough2)">
    <rect x="30" y="56" width="212" height="222" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="44" y="80" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">① 两侧精确匹配</text>
  <text x="44" y="104" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">A_k = B_j，B_l = A_i</text>
  <text x="44" y="126" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">额外代价 0</text>
  <text x="44" y="152" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">k：最近的 A_k = B_j</text>
  <text x="44" y="172" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">l：最近的 B_l = A_i</text>
  <text x="44" y="198" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">代价 = dp + 空隙 + t_e</text>
  <text x="44" y="224" font-size="11" fill="#2f4a66" filter="url(#rough2)">纯交换，最常用的一支</text>
  <text x="44" y="248" font-size="11" fill="#2f4a66" filter="url(#rough2)">维护 26 个 lastA / lastB</text>
  <text x="44" y="268" font-size="11" fill="#2f4a66" filter="url(#rough2)">即可 O(1) 命中</text>

  <!-- 情况 2 -->
  <g filter="url(#rough2)">
    <rect x="254" y="56" width="212" height="222" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="268" y="80" font-size="12.5" font-weight="bold" fill="#7a5a1b" filter="url(#rough2)">② k 侧匹配、i 侧替换</text>
  <text x="268" y="104" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">A_k = B_j（免 t_r）</text>
  <text x="268" y="126" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">B_l ≠ A_i（收 t_r）</text>
  <text x="268" y="152" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">k：同情况①</text>
  <text x="268" y="172" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">l：最近的 B_l ≠ A_i</text>
  <text x="268" y="198" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">代价 = ① + t_r</text>
  <text x="268" y="224" font-size="11" fill="#7a5a1b" filter="url(#rough2)">用"最后两个不同字母"命中</text>
  <text x="268" y="248" font-size="11" fill="#7a5a1b" filter="url(#rough2)">例：ab → ca 需要这一支</text>
  <text x="268" y="268" font-size="11" fill="#7a5a1b" filter="url(#rough2)">（t_r 小于 t_e 时更优）</text>

  <!-- 情况 3 -->
  <g filter="url(#rough2)">
    <rect x="478" y="56" width="212" height="222" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="492" y="80" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">③ k 侧替换、i 侧匹配</text>
  <text x="492" y="104" font-size="11.5" fill="#2f5223" filter="url(#rough2)">A_k ≠ B_j（收 t_r）</text>
  <text x="492" y="126" font-size="11.5" fill="#2f5223" filter="url(#rough2)">B_l = A_i（免 t_r）</text>
  <text x="492" y="152" font-size="11.5" fill="#2f5223" filter="url(#rough2)">k：最近的 A_k ≠ B_j</text>
  <text x="492" y="172" font-size="11.5" fill="#2f5223" filter="url(#rough2)">l：同情况①</text>
  <text x="492" y="198" font-size="11.5" fill="#2f5223" filter="url(#rough2)">代价 = ① + t_r</text>
  <text x="492" y="224" font-size="11" fill="#2f5223" filter="url(#rough2)">与情况②完全对称</text>
  <text x="492" y="248" font-size="11" fill="#2f5223" filter="url(#rough2)">代码里三支并列取最小值</text>
  <text x="492" y="268" font-size="11" fill="#2f5223" filter="url(#rough2)">每格 O(1)</text>

  <!-- 第四类 -->
  <g filter="url(#rough2)">
    <rect x="30" y="292" width="660" height="66" rx="10" fill="#f2f2f2" stroke="#999" stroke-width="1.4"/>
  </g>
  <text x="44" y="316" font-size="12.5" font-weight="bold" fill="#666" filter="url(#rough2)">④ 两侧都要替换：被支配，不必枚举</text>
  <text x="44" y="338" font-size="11.5" fill="#666" filter="url(#rough2)">同一块改成"不交换、A_k 对 B_l、A_i 对 B_j"，替换项合计 ≤ 2t_r；交换版要 2t_r + t_e，严格更大</text>
</svg>
