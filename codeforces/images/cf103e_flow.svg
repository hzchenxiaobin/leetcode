<svg xmlns="http://www.w3.org/2000/svg" width="884" height="404" viewBox="0 0 884 404"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="103"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/></marker>
  </defs>
  <rect width="884" height="404" fill="#fafafa"/>
  <text x="442" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">最小权闭合集 → 最小割</text>
  <text x="442" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">w' = −price；答案 = mincut − Σ(w' > 0)</text>
  <g filter="url(#rough2)"><circle cx="120" cy="200" r="24" fill="#f6e3c4" fill-opacity="0.9" stroke="#c9a86a" stroke-width="1.6"/></g>
  <text x="120" y="206" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">S</text>
  <g filter="url(#rough2)"><circle cx="800" cy="200" r="24" fill="#f6e3c4" fill-opacity="0.9" stroke="#c9a86a" stroke-width="1.6"/></g>
  <text x="800" y="206" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">T</text>
  <g filter="url(#rough2)"><circle cx="230" cy="110" r="26" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.5"/></g>
  <text x="230" y="115" text-anchor="middle" font-size="10.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">w'&gt;0</text>
  <g filter="url(#rough2)"><circle cx="230" cy="200" r="26" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.5"/></g>
  <text x="230" y="205" text-anchor="middle" font-size="10.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">w'&gt;0</text>
  <g filter="url(#rough2)"><circle cx="230" cy="290" r="26" fill="#f6d9d7" fill-opacity="0.85" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="230" y="295" text-anchor="middle" font-size="10.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">w'&lt;0</text>
  <g filter="url(#rough2)"><line x1="146" y1="190" x2="202" y2="120" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)"/></g>
  <g filter="url(#rough2)"><line x1="146" y1="200" x2="202" y2="200" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)"/></g>
  <g filter="url(#rough2)"><line x1="258" y1="290" x2="776" y2="210" stroke="#b85450" stroke-width="2" marker-end="url(#arrr)"/></g>
  <text x="500" y="120" text-anchor="middle" font-size="10.5" fill="#3d6b2f" filter="url(#rough2)">S → i 容量 w'（选它要“付”正权）</text>
  <text x="560" y="320" text-anchor="middle" font-size="10.5" fill="#8a2b28" filter="url(#rough2)">i → T 容量 −w'（负权点被选才付费）</text>
  <g filter="url(#rough2)"><line x1="258" y1="118" x2="202" y2="192" stroke="#8a8a8a" stroke-width="1.8" stroke-dasharray="5 4"/></g>
  <text x="300" y="150" text-anchor="start" font-size="10" fill="#777777" filter="url(#rough2)">闭合边 ∞</text>
  <text x="442" y="352" text-anchor="middle" font-size="11.5" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">最小割 = P − 最大闭合权  ⟹  最小闭合权 = mincut − P，P = Σ_{w'&gt;0} w'</text>
  <text x="442" y="382" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">空集恒可行（权 0），所以答案 ≤ 0；n ≤ 300，边数 ≤ n²，Dinic 足够</text>
</svg>
