<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="803"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="290" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">与为 0 ⟺ y ⊆ complement(a)</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">子集 SOS 求 g[mask] = 某个 ⊆ mask 的元素</text>
  <g filter="url(#rough2)"><rect x="80" y="96" width="340" height="70" rx="6" fill="#cfe0f5" fill-opacity="0.35" stroke="#446688" stroke-width="1.4"/></g>
  <text x="250" y="126" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">a &amp; y = 0</text>
  <text x="250" y="152" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">⟺ y ⊆ ~a</text>
  <g filter="url(#rough2)"><rect x="480" y="96" width="340" height="70" rx="6" fill="#dcecd2" fill-opacity="0.35" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="650" y="126" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">SOS: 22 位 × 2²²</text>
  <text x="650" y="152" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">O(22·2²²) ≈ 9.2e7</text>
  <text x="450" y="208" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">答案 = g[full ^ a_i]，full = 2²²−1</text>
  <text x="450" y="240" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">a_i ≥ 1 ⇒ 不会与自身配对</text>
</svg>
