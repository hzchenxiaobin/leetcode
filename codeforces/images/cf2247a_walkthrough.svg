<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="400" fill="#fafafa" filter="url(#rough2)"/>

  <text x="320" y="40" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">
    5 组官方样例的判定走查
  </text>

  <rect x="50" y="62" width="540" height="276" rx="6" fill="#ffffff" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>

  <rect x="50" y="62" width="540" height="44" rx="6" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="90" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">用例</text>
  <text x="275" y="90" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">数组 a</text>
  <text x="432" y="90" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">s</text>
  <text x="505" y="90" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">s mod 4</text>
  <text x="567" y="90" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">输出</text>

  <rect x="50" y="106" width="540" height="44" fill="#fce4ec" stroke="#b85450"
        stroke-width="1" opacity="0.5" filter="url(#rough2)"/>
  <rect x="50" y="150" width="540" height="44" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1" opacity="0.5" filter="url(#rough2)"/>
  <rect x="50" y="194" width="540" height="44" fill="#fce4ec" stroke="#b85450"
        stroke-width="1" opacity="0.5" filter="url(#rough2)"/>
  <rect x="50" y="238" width="540" height="44" fill="#fce4ec" stroke="#b85450"
        stroke-width="1" opacity="0.5" filter="url(#rough2)"/>
  <rect x="50" y="282" width="540" height="56" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1" opacity="0.5" filter="url(#rough2)"/>

  <text x="100" y="134" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">n = 1</text>
  <text x="275" y="134" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">-1</text>
  <text x="432" y="134" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">-1</text>
  <text x="505" y="134" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">3</text>
  <text x="567" y="134" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">NO</text>

  <text x="100" y="178" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">n = 2</text>
  <text x="275" y="178" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1  -1</text>
  <text x="432" y="178" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="505" y="178" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <text x="567" y="178" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">YES</text>

  <text x="100" y="222" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">n = 2</text>
  <text x="275" y="222" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1  1</text>
  <text x="432" y="222" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="505" y="222" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">2</text>
  <text x="567" y="222" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">NO</text>

  <text x="100" y="266" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">n = 5</text>
  <text x="275" y="266" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1 -1 1 -1 1</text>
  <text x="432" y="266" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="505" y="266" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="567" y="266" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">NO</text>

  <text x="100" y="310" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">n = 6</text>
  <text x="275" y="310" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    -1 1 -1 -1 -1 -1
  </text>
  <text x="432" y="310" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">-4</text>
  <text x="505" y="310" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <text x="567" y="310" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">YES</text>

  <text x="320" y="366" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    余数取非负代表元：-1 mod 4 = 3，-4 mod 4 = 0；只有余数恰为 0 才输出 YES
  </text>
  <text x="320" y="388" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">
    第 5 组：翻转 i = 3 后和由 -4 变为 0，正是题面给出的那条操作
  </text>
</svg>
