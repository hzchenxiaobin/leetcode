<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1452"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="720" height="320" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">固定块结构后：逐位贪心取字典序最小</text>
  <path d="M 140 42 Q 360 48 580 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <rect x="100" y="76" width="150" height="44" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="175" y="104" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#335478" filter="url(#rough2)">4 × (a1−R+1)</text>
  <rect x="260" y="76" width="40" height="44" rx="7" fill="#f6efd8" stroke="#b09040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="104" text-anchor="middle" font-size="12.5" fill="#8a6a20" filter="url(#rough2)">7</text>
  <rect x="310" y="76" width="40" height="44" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="104" text-anchor="middle" font-size="12.5" fill="#335478" filter="url(#rough2)">4</text>
  <rect x="360" y="76" width="40" height="44" rx="7" fill="#f6efd8" stroke="#b09040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="104" text-anchor="middle" font-size="12.5" fill="#8a6a20" filter="url(#rough2)">7</text>
  <rect x="410" y="76" width="40" height="44" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="430" y="104" text-anchor="middle" font-size="12.5" fill="#335478" filter="url(#rough2)">4</text>
  <rect x="460" y="76" width="150" height="44" rx="7" fill="#f6efd8" stroke="#b09040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="535" y="104" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">7 × (a2−S+1)</text>

  <path d="M 175 122 L 175 150" stroke="#5a7fb0" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="100" y="170" font-size="11" fill="#335478" filter="url(#rough2)">富余的 4 全给第一块：前缀 4 越多，数字越小</text>

  <path d="M 280 122 L 280 190" stroke="#b09040" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 380 122 L 380 190" stroke="#b09040" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="280" y="208" font-size="11" fill="#8a6a20" filter="url(#rough2)">中间的 7 块一律只取 1：4 越早出现越好</text>

  <path d="M 535 122 L 535 150" stroke="#b09040" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="430" y="170" font-size="11" fill="#8a6a20" filter="url(#rough2)">剩下的 7 全压到最后一个 7 块</text>

  <text x="360" y="248" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">反过来把富余的 4 放到后面、把 7 放到前面（如 4774 → 7474）只会让更靠前的位变大，严格更差</text>
  <text x="360" y="272" text-anchor="middle" font-size="11.5" fill="#8a5a86" filter="url(#rough2)">a3 = a4 时两种块结构都可行，首字符 4 的那个一定更小，直接取它</text>
  <text x="360" y="300" text-anchor="middle" font-size="11" fill="#777777" filter="url(#rough2)">前提只有两条：a1 ≥ 4 块数、a2 ≥ 7 块数；任一不满足就换结构或输出 -1</text>
</svg>
