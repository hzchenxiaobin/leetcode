<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="383"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="320" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">每层先算 best[k]，再做分组背包</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">best[k] = 左取 i 个 + 右取 k−i 个的最大值</text>
  <text x="160" y="104" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">架子 [4, 3, 1, 2]</text>
  <g filter="url(#rough2)"><rect x="60" y="116" width="56" height="48" rx="4" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="88" y="146" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><rect x="120" y="116" width="56" height="48" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="148" y="146" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="180" y="116" width="56" height="48" rx="4" fill="#dcecd2" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="208" y="146" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="240" y="116" width="56" height="48" rx="4" fill="#f3d9d6" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="268" y="146" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="160" y="190" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">只能从两端取 ⇒ 取 3 件：</text>
  <text x="160" y="216" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">左 2 + 右 1 = 4+3+2 = 9 ✓</text>
  <g filter="url(#rough2)"><rect x="420" y="96" width="420" height="150" rx="6" fill="#ffffff" fill-opacity="0.3" stroke="#cccccc" stroke-width="1.4" stroke-dasharray="5 4"/></g>
  <text x="630" y="122" text-anchor="middle" font-size="13" fill="#b06a1e" font-weight="bold" filter="url(#rough2)">分组背包</text>
  <text x="440" y="150" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">dp[j] = 前几层共取 j 件的最大价值</text>
  <text x="440" y="176" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">对每层：ndp[j+k] = max(dp[j] + best[k])</text>
  <text x="440" y="202" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">限制 k ≤ 层长，且 j+k ≤ m</text>
  <text x="440" y="228" text-anchor="start" font-size="11" fill="#4a7a3a" filter="url(#rough2)">答案 dp[m]</text>
  <text x="450" y="286" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">复杂度 O(Σ len² + n·m·maxlen)；C++ 约 0.05 s（最坏数据）</text>
</svg>
