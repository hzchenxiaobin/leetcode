<svg xmlns="http://www.w3.org/2000/svg" width="840" height="360" viewBox="0 0 840 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="360" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每条道路给出一个异或约束</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">x_v = 城市 v 是否被选奇数次</text>
  <text x="420" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">c(u,v) ⊕ x_u ⊕ x_v = 1   ⇔   x_u ⊕ x_v = 1 ⊕ c(u,v)</text>
  <g filter="url(#rough2)"><rect x="120" y="130" width="200" height="48" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="220" y="160" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">已铺 c=1</text>
  <text x="360" y="160" text-anchor="start" font-size="13" fill="#2b2b2b" filter="url(#rough2)">x_u ⊕ x_v = 0</text>
  <text x="560" y="160" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">两端同选或同不选</text>
  <g filter="url(#rough2)"><rect x="120" y="200" width="200" height="48" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="220" y="230" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">未铺 c=0</text>
  <text x="360" y="230" text-anchor="start" font-size="13" fill="#2b2b2b" filter="url(#rough2)">x_u ⊕ x_v = 1</text>
  <text x="560" y="230" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">两端恰有一个被选</text>
  <text x="420" y="300" text-anchor="middle" font-size="12" fill="#3d6b2f" filter="url(#rough2)">选两次 = 没选 ⇒ 每个城市只需决定"选/不选"，天数 ≤ n</text>
  <text x="420" y="330" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">用带权并查集维护 x_u ⊕ x_v 的约束闭包；冲突则 Impossible</text>
</svg>
