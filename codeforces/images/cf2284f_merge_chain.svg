<svg xmlns="http://www.w3.org/2000/svg" width="880" height="478" viewBox="0 0 880 478"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="880" height="478" fill="#fafafa"/>
  <text x="440" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">O(n) 增量维护：起点回退两块 + 局部合并</text>
  <path d="M 190 44 Q 440 52 690 44" stroke="#2b2b2b" stroke-width="1.1" fill="none" filter="url(#rough2)"/>
  <rect x="28" y="54" width="824" height="86" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="52" y="76" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">① 每步先把起点 p 往回退两块（沿环逆时针）</text>
  <rect x="52" y="86" width="78" height="42" rx="6" fill="#fff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="91.0" y="103" text-anchor="middle" font-size="11.5" fill="#5b7690" filter="url(#rough2)">p₈</text>
  <text x="91.0" y="121" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">0</text>
  <path d="M 132 107 L 143 107" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="147" y="86" width="78" height="42" rx="6" fill="#fff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="186.0" y="103" text-anchor="middle" font-size="11.5" fill="#5b7690" filter="url(#rough2)">p₇</text>
  <text x="186.0" y="121" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">6</text>
  <path d="M 227 107 L 238 107" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="242" y="86" width="78" height="42" rx="6" fill="#fff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="281.0" y="103" text-anchor="middle" font-size="11.5" fill="#5b7690" filter="url(#rough2)">p₆</text>
  <text x="281.0" y="121" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">4</text>
  <path d="M 322 107 L 333 107" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="337" y="86" width="78" height="42" rx="6" fill="#fff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="376.0" y="103" text-anchor="middle" font-size="11.5" fill="#5b7690" filter="url(#rough2)">p₅</text>
  <text x="376.0" y="121" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">2</text>
  <path d="M 417 107 L 428 107" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="432" y="86" width="78" height="42" rx="6" fill="#fff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="471.0" y="103" text-anchor="middle" font-size="11.5" fill="#5b7690" filter="url(#rough2)">p₄</text>
  <text x="471.0" y="121" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">7</text>
  <path d="M 512 107 L 523 107" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="527" y="86" width="78" height="42" rx="6" fill="#fff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="566.0" y="103" text-anchor="middle" font-size="11.5" fill="#5b7690" filter="url(#rough2)">p₃</text>
  <text x="566.0" y="121" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">3</text>
  <path d="M 607 107 L 618 107" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="622" y="86" width="78" height="42" rx="6" fill="#fff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="661.0" y="103" text-anchor="middle" font-size="11.5" fill="#5b7690" filter="url(#rough2)">p₂</text>
  <text x="661.0" y="121" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">5</text>
  <path d="M 702 107 L 713 107" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="717" y="86" width="78" height="42" rx="6" fill="#f2f2f2" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="756.0" y="103" text-anchor="middle" font-size="11.5" fill="#5b7690" filter="url(#rough2)">p₁</text>
  <text x="756.0" y="121" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">5</text>
  <text x="856" y="152" text-anchor="end" font-size="10.5" fill="#5b7690" filter="url(#rough2)">（n=8 的取值；退两块恰好落在下一个起点上）</text>
  <rect x="28" y="156" width="398" height="150" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="52" y="178" text-anchor="start" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">② 新起点后的三块：B₀ B₁ B₂</text>
  <rect x="52" y="190" width="70" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="87" y="208" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">B₀</text>
  <text x="87" y="222" text-anchor="middle" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">f₀</text>
  <rect x="158" y="190" width="70" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="193" y="208" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">B₁</text>
  <text x="193" y="222" text-anchor="middle" font-size="10.5" fill="#a14340" filter="url(#rough2)">f₁</text>
  <rect x="264" y="190" width="70" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="299" y="208" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">B₂</text>
  <text x="299" y="222" text-anchor="middle" font-size="10.5" fill="#a14340" filter="url(#rough2)">f₂</text>
  <path d="M 128 210 L 152 210" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 234 210 L 258 210" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="252" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">B₁ ∪ B₂ → M,  f_M = 1 − 2^{−(c₁+c₂)}</text>
  <text x="200" y="272" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">r = f_M / (f₁f₂)  （因子 1−2^{−c} 不可乘）</text>
  <text x="200" y="294" text-anchor="middle" font-size="11.5" fill="#44546a" filter="url(#rough2)">W(prv) = 1 + f(prv)·(W − T)   ← 换起点</text>
  <rect x="444" y="156" width="408" height="150" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="648" y="178" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">③ 合并后的前缀和一 jump 公式</text>
  <text x="648" y="204" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">W_new = 1 + f₀ + r·(W_old − 1 − f₀ − f₀f₁)</text>
  <text x="648" y="228" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">m = 2 时只剩一块：W = 1 + f_M</text>
  <text x="648" y="252" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">T ← T · r   （T = 全体因子之积）</text>
  <text x="648" y="276" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">答案 += W_new − 1</text>
  <text x="648" y="296" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">最后再整体乘 2^{#0}</text>
  <rect x="28" y="322" width="824" height="132" rx="10" fill="#fff" stroke="#c8cdd3" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="440" y="344" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#44546a" filter="url(#rough2)">n = 8 的合并顺序（k=8 一路并到 k=1）</text>
  <rect x="44" y="350" width="152" height="26" rx="5" fill="#e8f0fe" stroke="#7a8a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="120.0" y="368" text-anchor="middle" font-size="11" fill="#33475c" filter="url(#rough2)">{7}+{0}</text>
  <rect x="220" y="350" width="152" height="26" rx="5" fill="#e8f0fe" stroke="#7a8a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="296.0" y="368" text-anchor="middle" font-size="11" fill="#33475c" filter="url(#rough2)">{5}+{6}</text>
  <rect x="396" y="350" width="152" height="26" rx="5" fill="#e8f0fe" stroke="#7a8a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="472.0" y="368" text-anchor="middle" font-size="11" fill="#33475c" filter="url(#rough2)">{3}+{4}</text>
  <rect x="572" y="350" width="152" height="26" rx="5" fill="#e8f0fe" stroke="#7a8a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="648.0" y="368" text-anchor="middle" font-size="11" fill="#33475c" filter="url(#rough2)">{1}+{2}</text>
  <rect x="132" y="380" width="296" height="26" rx="5" fill="#e6f4ea" stroke="#7a8a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="280.0" y="398" text-anchor="middle" font-size="11" fill="#33475c" filter="url(#rough2)">{0,7}+{5,6}</text>
  <rect x="452" y="380" width="296" height="26" rx="5" fill="#e6f4ea" stroke="#7a8a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="600.0" y="398" text-anchor="middle" font-size="11" fill="#33475c" filter="url(#rough2)">{1,2}+{3,4}</text>
  <rect x="262" y="410" width="336" height="26" rx="5" fill="#fff8e1" stroke="#7a8a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="430.0" y="428" text-anchor="middle" font-size="11" fill="#33475c" filter="url(#rough2)">{0,5,6,7}+{1,2,3,4}</text>
</svg>
