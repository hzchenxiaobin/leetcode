<svg xmlns="http://www.w3.org/2000/svg" width="760" height="372" viewBox="0 0 760 372"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c9801f"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a8524a"/>
    </marker>
  </defs>
  <rect width="760" height="372" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">一次训练：每个非空且低于 k 的组各出一人</text>
  <text x="380.0" y="60.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">以 k = 4、计数 (3, 2, 1, 0) 为例（第 r 列表示 r 级有多少人）</text>
  <text x="156.0" y="316.0" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">1 级</text>
  <rect x="110.0" y="260.0" width="92.0" height="26.0" rx="4" fill="#f7f9fc" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="110.0" y="230.0" width="92.0" height="26.0" rx="4" fill="#f7f9fc" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="110.0" y="200.0" width="92.0" height="26.0" rx="4" fill="#f7f9fc" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="156.0" y="190.0" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="274.0" y="316.0" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">2 级</text>
  <rect x="228.0" y="260.0" width="92.0" height="26.0" rx="4" fill="#f7f9fc" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="228.0" y="230.0" width="92.0" height="26.0" rx="4" fill="#f7f9fc" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="274.0" y="220.0" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="392.0" y="316.0" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">3 级</text>
  <rect x="346.0" y="260.0" width="92.0" height="26.0" rx="4" fill="#f7f9fc" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="392.0" y="250.0" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="510.0" y="316.0" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">4 级</text>
  <text x="510.0" y="280.0" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <path d="M 204.0 250.0 L 224.0 250.0" stroke="#c9801f" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 322.0 250.0 L 342.0 250.0" stroke="#c9801f" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 440.0 250.0 L 460.0 250.0" stroke="#c9801f" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="380.0" y="108.0" text-anchor="middle" font-size="12" fill="#c9801f" font-weight="bold" filter="url(#rough2)">每个有人的 1、2、3 级组各递补 1 人到上一级</text>
  <rect x="110.0" y="134.0" width="92.0" height="12.0" rx="3" fill="#f4f9f2" stroke="#4a7a3a" stroke-width="1.0" filter="url(#rough2)"/>
  <rect x="110.0" y="118.0" width="92.0" height="12.0" rx="3" fill="#f4f9f2" stroke="#4a7a3a" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="156.0" y="110.0" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="228.0" y="134.0" width="92.0" height="12.0" rx="3" fill="#f4f9f2" stroke="#4a7a3a" stroke-width="1.0" filter="url(#rough2)"/>
  <rect x="228.0" y="118.0" width="92.0" height="12.0" rx="3" fill="#f4f9f2" stroke="#4a7a3a" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="274.0" y="110.0" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="346.0" y="134.0" width="92.0" height="12.0" rx="3" fill="#f4f9f2" stroke="#4a7a3a" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="392.0" y="110.0" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="464.0" y="134.0" width="92.0" height="12.0" rx="3" fill="#f4f9f2" stroke="#4a7a3a" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="510.0" y="110.0" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="70.0" y="150.0" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">之后</text>
  <text x="70.0" y="290.0" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">之前</text>
  <rect x="40.0" y="330.0" width="680.0" height="34.0" rx="8" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.4" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="54.0" y="352.0" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">新计数 (2,2,1,1)：注意同时结算，刚升级的人这一轮不会再升一次。</text>
</svg>
