<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="880" height="520" fill="#fafafa"/>

  <text x="440" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：0 进 B、C，非 0 全进 A</text>
  <path d="M 210 41 Q 440 48 670 41" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="440" y="62" text-anchor="middle" font-size="12.5" fill="#66788c" filter="url(#rough2)">逐位写出分配，再把三个集合的 mex 加起来验算（官方样例 1 与样例 5）</text>

  <!-- ===== 样例 1 ===== -->
  <text x="70" y="90" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1：a = [1, 0, 0, 1, 2, 1]</text>
  <text x="48" y="133" text-anchor="middle" font-size="12" fill="#66788c" filter="url(#rough2)">a</text>

  <rect x="70" y="100" width="66" height="54" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="103" y="136" text-anchor="middle" font-size="18" fill="#2f4a66" filter="url(#rough2)">1</text>
  <rect x="144" y="100" width="66" height="54" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="177" y="136" text-anchor="middle" font-size="18" font-weight="bold" fill="#8a6015" filter="url(#rough2)">0</text>
  <rect x="218" y="100" width="66" height="54" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="251" y="136" text-anchor="middle" font-size="18" font-weight="bold" fill="#8a6015" filter="url(#rough2)">0</text>
  <rect x="292" y="100" width="66" height="54" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="325" y="136" text-anchor="middle" font-size="18" fill="#2f4a66" filter="url(#rough2)">1</text>
  <rect x="366" y="100" width="66" height="54" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="399" y="136" text-anchor="middle" font-size="18" fill="#2f4a66" filter="url(#rough2)">2</text>
  <rect x="440" y="100" width="66" height="54" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="473" y="136" text-anchor="middle" font-size="18" fill="#2f4a66" filter="url(#rough2)">1</text>

  <text x="48" y="186" text-anchor="middle" font-size="12" fill="#66788c" filter="url(#rough2)">s</text>

  <rect x="70" y="162" width="66" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="103" y="187" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">A</text>
  <rect x="144" y="162" width="66" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.0" filter="url(#rough2)"/>
  <text x="177" y="187" text-anchor="middle" font-size="16" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">B</text>
  <rect x="218" y="162" width="66" height="38" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.0" filter="url(#rough2)"/>
  <text x="251" y="187" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a6015" filter="url(#rough2)">C</text>
  <rect x="292" y="162" width="66" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="325" y="187" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">A</text>
  <rect x="366" y="162" width="66" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="399" y="187" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">A</text>
  <rect x="440" y="162" width="66" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="473" y="187" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">A</text>

  <text x="560" y="187" font-size="12" fill="#a14340" filter="url(#rough2)">第 1 个 0 给 B</text>
  <text x="560" y="205" font-size="12" fill="#8a6015" filter="url(#rough2)">后的 0 全给 C</text>

  <text x="70" y="226" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">A = {1,1,2,1} : mex 0   B = {0} : mex 1   C = {0} : mex 1</text>
  <text x="812" y="226" text-anchor="end" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">⇒ 2 = 2·1 ✓</text>

  <!-- ===== 样例 5 ===== -->
  <text x="70" y="262" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 5：a = [0, 0, 0, 1, 2]</text>
  <text x="48" y="301" text-anchor="middle" font-size="12" fill="#66788c" filter="url(#rough2)">a</text>

  <rect x="70" y="268" width="66" height="54" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="103" y="304" text-anchor="middle" font-size="18" font-weight="bold" fill="#8a6015" filter="url(#rough2)">0</text>
  <rect x="144" y="268" width="66" height="54" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="177" y="304" text-anchor="middle" font-size="18" font-weight="bold" fill="#8a6015" filter="url(#rough2)">0</text>
  <rect x="218" y="268" width="66" height="54" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="251" y="304" text-anchor="middle" font-size="18" font-weight="bold" fill="#8a6015" filter="url(#rough2)">0</text>
  <rect x="292" y="268" width="66" height="54" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="325" y="304" text-anchor="middle" font-size="18" fill="#2f4a66" filter="url(#rough2)">1</text>
  <rect x="366" y="268" width="66" height="54" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="399" y="304" text-anchor="middle" font-size="18" fill="#2f4a66" filter="url(#rough2)">2</text>

  <text x="48" y="354" text-anchor="middle" font-size="12" fill="#66788c" filter="url(#rough2)">s</text>

  <rect x="70" y="330" width="66" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.0" filter="url(#rough2)"/>
  <text x="103" y="355" text-anchor="middle" font-size="16" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">B</text>
  <rect x="144" y="330" width="66" height="38" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.0" filter="url(#rough2)"/>
  <text x="177" y="355" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a6015" filter="url(#rough2)">C</text>
  <rect x="218" y="330" width="66" height="38" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.0" filter="url(#rough2)"/>
  <text x="251" y="355" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a6015" filter="url(#rough2)">C</text>
  <rect x="292" y="330" width="66" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="325" y="355" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">A</text>
  <rect x="366" y="330" width="66" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="399" y="355" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">A</text>

  <text x="480" y="355" font-size="12" fill="#66788c" filter="url(#rough2)">A 里一个 0 都没有 ⇒ mex(A) = 0</text>

  <text x="70" y="392" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">A = {1,2} : mex 0    B = {0} : mex 1    C = {0,0} : mex 1</text>
  <text x="812" y="392" text-anchor="end" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">⇒ 2 = 2·1 ✓</text>

  <!-- 说明 -->
  <rect x="26" y="410" width="828" height="86" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="440" y="436" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">为什么合法：A 里没有任何 0，所以 mex(A) = 0；B、C 里只有 0、没有 1，所以 mex(B) = mex(C) = 1</text>
  <text x="440" y="460" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">于是左边 = 0 + 1 + 1 = 2，右边 = 2·max(0,1,1) = 2，恰好取到等号</text>
  <text x="440" y="483" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">官方输出（ABABCA / ABCAB）与本文程序输出不同，但都合法且取到等号 —— 本题答案不唯一</text>
</svg>
