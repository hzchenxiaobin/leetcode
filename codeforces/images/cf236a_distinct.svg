<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="380" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1：数一数出现了几种字母</text>
  <path d="M 170 42 Q 360 48 550 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="60" y="70" font-size="12" fill="#666" filter="url(#rough2)">用户名 "wjmzbmr"</text>

  <!-- 字母格 -->
  <g filter="url(#rough2)">
    <rect x="60" y="84" width="52" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="116" y="84" width="52" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="172" y="84" width="52" height="50" fill="#fde8e8" stroke="#b85450" stroke-width="1.8"/>
    <rect x="228" y="84" width="52" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="284" y="84" width="52" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="340" y="84" width="52" height="50" fill="#fde8e8" stroke="#b85450" stroke-width="1.8"/>
    <rect x="396" y="84" width="52" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="86" y="118" text-anchor="middle" font-size="20" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">w</text>
  <text x="142" y="118" text-anchor="middle" font-size="20" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">j</text>
  <text x="198" y="118" text-anchor="middle" font-size="20" font-weight="bold" fill="#8c2f2b" filter="url(#rough2)">m</text>
  <text x="254" y="118" text-anchor="middle" font-size="20" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">z</text>
  <text x="310" y="118" text-anchor="middle" font-size="20" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">b</text>
  <text x="366" y="118" text-anchor="middle" font-size="20" font-weight="bold" fill="#8c2f2b" filter="url(#rough2)">m</text>
  <text x="422" y="118" text-anchor="middle" font-size="20" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">r</text>
  <text x="198" y="152" text-anchor="middle" font-size="10" fill="#8c2f2b" filter="url(#rough2)">重复</text>
  <text x="366" y="152" text-anchor="middle" font-size="10" fill="#8c2f2b" filter="url(#rough2)">重复</text>

  <!-- 去重后集合 -->
  <path d="M 470 110 L 500 110" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="506" y="76" width="170" height="70" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="520" y="100" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">去重后的集合</text>
  <text x="520" y="126" font-size="14" fill="#2f5223" filter="url(#rough2)">{w, j, m, z, b, r}</text>
  <text x="520" y="146" font-size="11" fill="#3c5e2e" filter="url(#rough2)">共 6 种</text>
  <text x="586" y="138" font-size="11" fill="#3c5e2e" filter="url(#rough2)">个不同字母</text>

  <!-- 奇偶判断 -->
  <rect x="60" y="186" width="600" height="76" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="74" y="210" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">规则：不同字母个数为奇数 → 男；偶数 → 女</text>
  <text x="74" y="234" font-size="12" fill="#7a5a1b" filter="url(#rough2)">这里 6 是偶数，按题面应输出 "CHAT WITH HER!"（她）</text>
  <text x="74" y="254" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">注意：判断的是「不同字母的个数」，不是字符串长度 7</text>

  <rect x="60" y="286" width="290" height="62" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="74" y="310" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">实现方式一：集合</text>
  <text x="74" y="332" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">len(set(s))，Python 一行</text>

  <rect x="370" y="286" width="290" height="62" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="384" y="310" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">实现方式二：26 位掩码</text>
  <text x="384" y="332" font-size="11.5" fill="#2f5223" filter="url(#rough2)">mask |= 1 &lt;&lt; (c - 'a')，再数 1 的个数</text>
</svg>
