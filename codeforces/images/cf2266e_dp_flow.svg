<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>

  <text x="250" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：一次筛法 + 一次升序 DP</text>
  <path d="M 78 44 Q 250 52 424 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <path d="M 470 60 L 470 380" stroke="#c9d3dd" stroke-width="1.2" stroke-dasharray="6 6" fill="none" filter="url(#rough2)"/>

  <!-- 步骤 1 -->
  <rect x="50" y="72" width="400" height="56" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="70" y="98" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">① 读入 n, k 与数组 a，取 M = max aᵢ</text>
  <text x="70" y="117" font-size="11" fill="#66788c" filter="url(#rough2)">（spf 表全局只筛一次，上限 2·10^5）</text>
  <text x="486" y="94" font-size="11" fill="#4a7a3a" filter="url(#rough2)">Σn ≤ 2·10^5，所以多测</text>
  <text x="486" y="112" font-size="11" fill="#4a7a3a" filter="url(#rough2)">总工作量与单测同阶</text>

  <path d="M250,130 L250,152" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 2 -->
  <rect x="50" y="154" width="400" height="56" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="70" y="180" font-size="12.5" fill="#3a5a30" filter="url(#rough2)">② c[m] = 0 对所有 m ≤ k（已经合法，不必拆）</text>
  <text x="70" y="199" font-size="11" fill="#66788c" filter="url(#rough2)">数组按 M 分配，只算用得到的下标</text>
  <text x="486" y="176" font-size="11" fill="#b85450" filter="url(#rough2)">k ≥ M 时循环不执行，</text>
  <text x="486" y="194" font-size="11" fill="#b85450" filter="url(#rough2)">直接输出 0</text>

  <path d="M250,212 L250,234" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 3 -->
  <rect x="50" y="236" width="400" height="60" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="70" y="262" font-size="12.5" fill="#8a6420" filter="url(#rough2)">③ m 从 k+1 升到 M：</text>
  <text x="70" y="282" font-size="13" fill="#2b2b2b" filter="url(#rough2)">c[m] = min over p|m  ( 1 + p · c[m/p] )</text>
  <text x="486" y="258" font-size="11" fill="#446688" filter="url(#rough2)">m/p &lt; m，子问题在升序中</text>
  <text x="486" y="276" font-size="11" fill="#446688" filter="url(#rough2)">已算完 → 无后效性</text>
  <text x="486" y="294" font-size="11" fill="#446688" filter="url(#rough2)">p 用 spf 枚举，注意去重</text>

  <path d="M250,298 L250,320" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤 4 -->
  <rect x="50" y="322" width="400" height="54" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="70" y="347" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">④ ans = Σᵢ c[aᵢ]，输出后清空本测试的 DP</text>
  <text x="70" y="366" font-size="11" fill="#66788c" filter="url(#rough2)">每个元素独立贡献，直接相加</text>
  <text x="486" y="346" font-size="11" fill="#b85450" filter="url(#rough2)">最大约 2.6·10^10</text>
  <text x="486" y="364" font-size="11" fill="#b85450" filter="url(#rough2)">→ 必须 long long</text>
</svg>
