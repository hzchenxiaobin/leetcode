<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="360" fill="#fafafa"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">193B：搜索树（禁止连续两个 1）</text>
  <path d="M 228.04 46 Q 380.0 52 531.96 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <circle cx="380.0" cy="60.0" r="24.0" fill="#fff3d6" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="380.0" y="65.0" text-anchor="middle" font-size="11.0" font-weight="bold" fill="#8a6015" filter="url(#rough2)">∅</text>
  <circle cx="250.0" cy="130.0" r="22.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="250.0" y="135.0" text-anchor="middle" font-size="11.0" font-weight="bold" fill="#26405c" filter="url(#rough2)">1</text>
  <path d="M 370.0 80.0 L 260.0 112.0" stroke="#6b6b6b" stroke-width="1.1" fill="none" filter="url(#rough2)"/>
  <circle cx="510.0" cy="130.0" r="22.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="510.0" y="135.0" text-anchor="middle" font-size="11.0" font-weight="bold" fill="#26405c" filter="url(#rough2)">2</text>
  <path d="M 370.0 80.0 L 520.0 112.0" stroke="#6b6b6b" stroke-width="1.1" fill="none" filter="url(#rough2)"/>
  <circle cx="160.0" cy="210.0" r="26.0" fill="#fdf0ef" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="160.0" y="214.0" text-anchor="middle" font-size="10.2" font-weight="bold" fill="#b85450" filter="url(#rough2)">11 ✗</text>
  <circle cx="330.0" cy="210.0" r="26.0" fill="#eef8ef" stroke="#2f5b34" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="330.0" y="214.0" text-anchor="middle" font-size="10.2" font-weight="bold" fill="#2f5b34" filter="url(#rough2)">12</text>
  <circle cx="420.0" cy="210.0" r="26.0" fill="#eef8ef" stroke="#2f5b34" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="420.0" y="214.0" text-anchor="middle" font-size="10.2" font-weight="bold" fill="#2f5b34" filter="url(#rough2)">21</text>
  <circle cx="590.0" cy="210.0" r="26.0" fill="#eef8ef" stroke="#2f5b34" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="590.0" y="214.0" text-anchor="middle" font-size="10.2" font-weight="bold" fill="#2f5b34" filter="url(#rough2)">22</text>
  <path d="M 250.0 152.0 L 170.0 186.0" stroke="#6b6b6b" stroke-width="1.0" fill="none" filter="url(#rough2)"/>
  <path d="M 250.0 152.0 L 320.0 186.0" stroke="#6b6b6b" stroke-width="1.0" fill="none" filter="url(#rough2)"/>
  <path d="M 510.0 152.0 L 430.0 186.0" stroke="#6b6b6b" stroke-width="1.0" fill="none" filter="url(#rough2)"/>
  <path d="M 510.0 152.0 L 580.0 186.0" stroke="#6b6b6b" stroke-width="1.0" fill="none" filter="url(#rough2)"/>
  <text x="160.0" y="250.0" text-anchor="middle" font-size="10.2" fill="#b85450" filter="url(#rough2)">被剪掉</text>
  <rect x="60.0" y="280.0" width="660.0" height="62.0" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="304.0" text-anchor="start" font-size="11.1" fill="#8a6015" filter="url(#rough2)">每个节点在它所在深度与 u 同奇偶时都贡献一次答案（可以再补若干个「11」凑满 u 步）。</text>
  <text x="74.0" y="326.0" text-anchor="start" font-size="11.1" fill="#8a6015" filter="url(#rough2)">所以答案要在所有同奇偶的节点上取 max，而不只是叶子。</text>
</svg>
