<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="109"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="340" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1：n=4，非幸运边只有 3—1</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">块：{1,3}、{2}、{4} → 16</text>
  <g filter="url(#rough2)"><line x1="250" y1="110" x2="420" y2="110" stroke="#7a9a6a" stroke-width="2.6"/></g>
  <text x="335" y="102" text-anchor="middle" font-size="11" fill="#3d6b2f" font-weight="bold" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><line x1="230" y1="92" x2="230" y2="238" stroke="#b85450" stroke-width="2.6" stroke-dasharray="6 4"/></g>
  <text x="210" y="170" text-anchor="middle" font-size="11" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><line x1="272" y1="94" x2="398" y2="204" stroke="#b85450" stroke-width="2.6" stroke-dasharray="6 4"/></g>
  <text x="335" y="80" text-anchor="middle" font-size="11" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">7</text>
  <g filter="url(#rough2)"><circle cx="250" cy="110" r="20" fill="#f6e3c4" fill-opacity="0.9" stroke="#c9a86a" stroke-width="1.6"/></g>
  <text x="250" y="115" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><circle cx="420" cy="110" r="20" fill="#f6e3c4" fill-opacity="0.9" stroke="#c9a86a" stroke-width="1.6"/></g>
  <text x="420" y="115" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><circle cx="250" cy="220" r="20" fill="#f6e3c4" fill-opacity="0.9" stroke="#c9a86a" stroke-width="1.6"/></g>
  <text x="250" y="225" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><circle cx="420" cy="220" r="20" fill="#f6e3c4" fill-opacity="0.9" stroke="#c9a86a" stroke-width="1.6"/></g>
  <text x="420" y="225" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="620" y="140" text-anchor="start" font-size="12" fill="#2f4a66" filter="url(#rough2)">块大小 2,1,1</text>
  <text x="620" y="168" text-anchor="start" font-size="12" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">Σ s(n−s)(n−s−1)</text>
  <text x="620" y="192" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">= 2·2·1 + 1·3·2·2 = 16</text>
</svg>
