<svg xmlns="http://www.w3.org/2000/svg" width="720" height="390" viewBox="0 0 720 390"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr67h" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="390" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两个走查：纯交换（样例 2）与跨删除的交换（自造）</text>
  <path d="M 80 40 Q 360 46 640 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 左：样例 2 -->
  <text x="40" y="74" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">样例 2：ab → ba，t_i=2, t_d=4, t_r=10, t_e=3</text>
  <g filter="url(#rough2)">
    <rect x="40" y="86" width="60" height="40" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="110" y="86" width="60" height="40" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="70" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">a</text>
  <text x="140" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">b</text>
  <path d="M 55 130 Q 110 152 165 130" stroke="#b85450" stroke-width="1.7" fill="none" marker-end="url(#arr67h)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="40" y="166" width="60" height="40" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="110" y="166" width="60" height="40" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="70" y="192" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5223" filter="url(#rough2)">b</text>
  <text x="140" y="192" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5223" filter="url(#rough2)">a</text>

  <text x="196" y="100" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">k=1：A_1=a=B_2</text>
  <text x="196" y="120" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">l=1：B_1=b=A_2</text>
  <text x="196" y="146" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">块代价 = 0+0+0+3 = 3</text>
  <text x="196" y="168" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">其他路径：删+插 6，替换 20</text>
  <text x="196" y="192" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">答案 3 ✓</text>

  <!-- 右：自造 -->
  <text x="420" y="74" font-size="13" font-weight="bold" fill="#7a4a8a" filter="url(#rough2)">xmy → yx（t=1, t_r=100）</text>
  <g filter="url(#rough2)">
    <rect x="420" y="86" width="48" height="40" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="476" y="86" width="48" height="40" rx="7" fill="#f2f2f2" stroke="#999" stroke-width="1.4" stroke-dasharray="4 3"/>
    <rect x="532" y="86" width="48" height="40" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="444" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">x</text>
  <text x="500" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#888" filter="url(#rough2)">m</text>
  <text x="556" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">y</text>
  <text x="500" y="142" text-anchor="middle" font-size="10.5" fill="#8a2b28" filter="url(#rough2)">删掉</text>
  <path d="M 444 152 Q 500 176 556 152" stroke="#b85450" stroke-width="1.7" fill="none" marker-end="url(#arr67h)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="476" y="186" width="48" height="40" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="532" y="186" width="48" height="40" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="500" y="212" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5223" filter="url(#rough2)">y</text>
  <text x="556" y="212" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5223" filter="url(#rough2)">x</text>

  <text x="592" y="100" font-size="11" fill="#5a3a6a" filter="url(#rough2)">k=1, i=3</text>
  <text x="592" y="120" font-size="11" fill="#5a3a6a" filter="url(#rough2)">l=1, j=2</text>
  <text x="592" y="146" font-size="11" fill="#8a2b28" filter="url(#rough2)">空隙 t_d·1</text>
  <text x="592" y="166" font-size="11" fill="#8a2b28" filter="url(#rough2)">= 1 + 0 + 1 = 2</text>

  <rect x="40" y="252" width="640" height="60" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="276" font-size="12.5" font-weight="bold" fill="#7a5a1b" filter="url(#rough2)">只用"原本相邻的两字符交换"的 DP 会怎么算？</text>
  <text x="56" y="298" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">它看不到"x 与 y 之间夹着被删掉的 m"，最便宜只能做到 3（删 m、删 x、再插入 x），比真值大 1</text>

  <rect x="40" y="324" width="640" height="52" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="346" font-size="12" fill="#2f5223" filter="url(#rough2)">本题的块转移把 A 侧空隙计成 (i−k−1)·t_d、B 侧空隙计成 (j−l−1)·t_i，</text>
  <text x="56" y="366" font-size="12" fill="#2f5223" filter="url(#rough2)">再用"最近出现位置" O(1) 取到最优的 (k, l)，于是两个空隙都自然被覆盖</text>
</svg>
