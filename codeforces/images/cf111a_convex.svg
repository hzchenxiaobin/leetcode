<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1115"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="320" fill="#fafafa"/>
  <text x="360.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">凸性：把额度集中到一个数上</text>
  <path d="M 115.2 42 Q 360.0 48 604.8 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="180" y="80" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">平摊：2,2,2,2</text>
  <rect x="110" y="222" width="38" height="28" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="156" y="222" width="38" height="28" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="202" y="222" width="38" height="28" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="248" y="222" width="38" height="28" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="540" y="80" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">集中：8,1,1,1</text>
  <rect x="470" y="138" width="38" height="112" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="516" y="236" width="38" height="14" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="562" y="236" width="38" height="14" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="608" y="236" width="38" height="14" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="90" y1="250" x2="650" y2="250" stroke="#5a5a5a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="275" text-anchor="middle" font-size="11.5" fill="#335478" filter="url(#rough2)">和都是 8：平方和 16</text>
  <text x="560" y="275" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">平方和 64+3 = 67</text>
  <text x="360" y="302" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">和固定时平方和最大 ⇔ 尽可能不均匀：上界 (y−n+1)² + (n−1)</text>
</svg>
