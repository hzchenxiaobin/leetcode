<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430">
<defs>
  <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs>
<rect x="0" y="0" width="760" height="430" fill="#fafafa"/>
<text x="380.0" y="34" font-size="22" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="bold" text-anchor="middle" filter="url(#rough2)">一条边被其它三角形覆盖的部分：区间裁剪</text>
<polygon points="150,330 520,120 680,330" fill="#dcecff" stroke="#5a7fa8" stroke-width="2" filter="url(#rough2)"/>
<text x="430" y="300" font-size="15" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#1a5fb4" font-weight="normal" text-anchor="middle" filter="url(#rough2)">三角形 U</text>
<line x1="60" y1="200" x2="720" y2="250" stroke="#c0392b" stroke-width="3" filter="url(#rough2)"/>
<text x="70" y="190" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#c0392b" font-weight="normal" text-anchor="start" filter="url(#rough2)">A</text>
<text x="710" y="270" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#c0392b" font-weight="normal" text-anchor="end" filter="url(#rough2)">B</text>
<line x1="380" y1="225" x2="380" y2="150" stroke="#c0392b" stroke-width="2" filter="url(#rough2)"/>
<polygon points="380.0,150.0 375.0,161.0 385.0,161.0" fill="#c0392b" filter="url(#rough2)"/>
<text x="390" y="150" font-size="13" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#c0392b" font-weight="normal" text-anchor="start" filter="url(#rough2)">整条边 AB（参数 t∈[0,1]）</text>
<text x="60" y="380" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="normal" text-anchor="start" filter="url(#rough2)">对 U 的三条边做半平面裁剪 → 得到 [t1,t2]；所有三角形的区间取并，未覆盖长度才计入周长</text>
</svg>
