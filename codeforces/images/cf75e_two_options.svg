<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="760" height="420" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">样例 1：穿越（6）比绕行（15）便宜</text>

  <!-- 岛 -->
  <rect x="270" y="114" width="70" height="230" fill="#dfe9f2" fill-opacity="0.8" stroke="#446688"
        stroke-width="1.8" filter="url(#rough2)"/>
  <text x="305" y="100" text-anchor="middle" font-size="12" fill="#33475c" filter="url(#rough2)">岛：宽 1，高 10</text>

  <!-- 绕行（下侧） -->
  <g filter="url(#rough2)" stroke="#9aa4ac" stroke-width="1.8" fill="none" stroke-dasharray="6 4">
    <path d="M130 229 L270 344"/>
    <path d="M270 344 L340 344"/>
    <path d="M340 344 L480 229"/>
  </g>
  <text x="520" y="352" font-size="12.5" fill="#5a6a7a" filter="url(#rough2)">绕行：2 + 11 + 2 = 15</text>

  <!-- 穿越 -->
  <g filter="url(#rough2)">
    <path d="M130 229 L270 229" stroke="#4a7a3a" stroke-width="2.4" fill="none"/>
    <path d="M270 229 L340 229" stroke="#b85450" stroke-width="4" fill="none"/>
    <path d="M340 229 L480 229" stroke="#4a7a3a" stroke-width="2.4" fill="none"/>
  </g>
  <text x="520" y="200" font-size="12.5" fill="#2f5223" filter="url(#rough2)">穿越：2 + 2×1 + 2 = 6</text>
  <text x="305" y="222" text-anchor="middle" font-size="11" fill="#7a2f2c" filter="url(#rough2)">岛内 1 单位</text>

  <!-- S 与 E -->
  <g filter="url(#rough2)">
    <circle cx="130" cy="229" r="6" fill="#2b3a4a"/>
    <circle cx="480" cy="229" r="6" fill="#2b3a4a"/>
    <circle cx="270" cy="229" r="5" fill="#b85450"/>
    <circle cx="340" cy="229" r="5" fill="#b85450"/>
  </g>
  <g font-size="13" fill="#2b3a4a" text-anchor="middle" filter="url(#rough2)">
    <text x="130" y="212">S</text>
    <text x="480" y="212">E</text>
    <text x="262" y="252">(3,7)</text>
    <text x="352" y="252">(4,7)</text>
  </g>

  <!-- 图例 -->
  <g filter="url(#rough2)">
    <line x1="520" y1="72" x2="556" y2="72" stroke="#4a7a3a" stroke-width="2.4"/>
    <text x="566" y="77" font-size="12" fill="#2f5223">海面：1 埃镑/单位</text>
    <line x1="520" y1="104" x2="556" y2="104" stroke="#b85450" stroke-width="4"/>
    <text x="566" y="109" font-size="12" fill="#7a2f2c">岛内：2 埃镑/单位</text>
    <line x1="520" y1="136" x2="556" y2="136" stroke="#9aa4ac" stroke-width="1.8" stroke-dasharray="6 4"/>
    <text x="566" y="141" font-size="12" fill="#5a6a7a">沿边界（算海面）</text>
  </g>

  <text x="380" y="396" text-anchor="middle" font-size="12" fill="#4a4a4a" filter="url(#rough2)">直线 SE 长 5，但中段 1 个单位在岛内，必须按 2 计价，所以下界是 6 而不是 5</text>
</svg>
