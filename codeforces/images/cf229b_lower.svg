<svg xmlns="http://www.w3.org/2000/svg" width="840" height="360" viewBox="0 0 840 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="360" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">等待函数的二分实现</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">T_u 已排序；先找第一个 ≥ t 的时刻，再找连续段末尾</text>
  <g filter="url(#rough2)"><rect x="110" y="96" width="380" height="44" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="300" y="124" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">① idx = lower_bound(T_u, t)</text>
  <text x="560" y="124" text-anchor="start" font-size="11" fill="#555555" filter="url(#rough2)">若 T_u[idx] ≠ t（或越界）⇒ 直接出发</text>
  <g filter="url(#rough2)"><rect x="110" y="158" width="380" height="44" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="300" y="186" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">② 在 [idx, k−1] 二分最大 j</text>
  <text x="560" y="186" text-anchor="start" font-size="11" fill="#555555" filter="url(#rough2)">满足 T_u[j] − T_u[idx] = j − idx</text>
  <g filter="url(#rough2)"><rect x="110" y="220" width="380" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="300" y="248" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">③ 出发时刻 = T_u[idx] + (j − idx + 1)</text>
  <text x="560" y="248" text-anchor="start" font-size="11" fill="#555555" filter="url(#rough2)">跳过整段连续到达时刻</text>
  <text x="420" y="300" text-anchor="middle" font-size="12" fill="#3d6b2f" filter="url(#rough2)">单调性：T 严格递增 ⇒ T_u[j] − j 非降，可二分</text>
  <text x="420" y="330" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">每次松弛 O(log k)，总复杂度 O((n+m) log n log k)</text>
</svg>
