<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="800" height="470" fill="#fafafa"/>

  <text x="400" y="30" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：三个划分层层加粗，而颜色 3 只能有一个连通块</text>
  <text x="400" y="53" text-anchor="middle" font-size="12.5" fill="#66788c" filter="url(#rough2)">记 P₁、P₂、P₃ 为三种颜色的边各自连出的连通块划分，题目条件就是 P₁ 比 P₂ 细、P₂ 比 P₃ 细</text>

  <!-- ============ 左：三个划分 ============ -->
  <text x="52" y="86" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">颜色 1 的块（最细，最多个）</text>
  <rect x="52" y="94" width="92" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="154" y="94" width="92" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="256" y="94" width="92" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="358" y="94" width="92" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="98" y="114" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">块 A</text>
  <text x="200" y="114" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">块 B</text>
  <text x="302" y="114" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">块 C</text>
  <text x="404" y="114" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">块 D</text>

  <path d="M 98 126 L 98 146" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 302 126 L 302 146" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="210" y="143" text-anchor="middle" font-size="11.5" fill="#7a6a4a" filter="url(#rough2)">只能合并，不能拆开</text>

  <text x="52" y="164" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">颜色 2 的块：每块由颜色 2 的边自己连通</text>
  <rect x="52" y="172" width="196" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="254" y="172" width="196" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="192" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">块 A ∪ B</text>
  <text x="352" y="192" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">块 C ∪ D</text>

  <path d="M 150 204 L 150 224" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 352 204 L 352 224" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="256" y="221" text-anchor="middle" font-size="11.5" fill="#7a6a4a" filter="url(#rough2)">再合并</text>

  <text x="52" y="242" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">颜色 3 的块：只能有 1 个（覆盖全部 n 个点）</text>
  <rect x="52" y="250" width="398" height="30" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="251" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">块 A ∪ B ∪ C ∪ D = 全部顶点</text>

  <!-- ============ 右：为什么不能有两块 ============ -->
  <rect x="474" y="72" width="290" height="216" rx="9" fill="#ffffff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="619" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">假设有两个 P₃ 块 A、B</text>

  <rect x="490" y="106" width="96" height="62" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="538" y="142" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">P₃ 块 A</text>
  <rect x="656" y="106" width="96" height="62" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="704" y="142" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">P₃ 块 B</text>

  <path d="M 586 137 L 656 137" stroke="#b85450" stroke-width="2.4" fill="none" filter="url(#rough2)"/>
  <path d="M 606 121 L 636 153" stroke="#b85450" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <path d="M 636 121 L 606 153" stroke="#b85450" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <text x="621" y="186" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">一条跨块的边？</text>

  <text x="490" y="212" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">染成颜色 1 ⇒ 两端在颜色 1 连通 ⇒ 也该在颜色 3 连通</text>
  <text x="490" y="232" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">染成颜色 2 ⇒ 同理（2 &lt; 3），也在颜色 3 连通</text>
  <text x="490" y="252" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">染成颜色 3 ⇒ 这条边自己就让两端同块</text>
  <text x="490" y="276" font-size="12" font-weight="bold" fill="#a14340" filter="url(#rough2)">三种颜色全部矛盾 ⇒ 不存在跨块边</text>

  <!-- ============ 底部结论 ============ -->
  <rect x="52" y="300" width="712" height="152" rx="9" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="68" y="324" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">由 G 连通立即得到：P₃ 只有一个块，即颜色 3 的边必须构成连通生成子图 E₃</text>
  <text x="68" y="350" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">· 于是颜色 1、2 的边都不跨 P₃ 块，G − E₃ 的连通块恰好就是 P₂ 的块；</text>
  <text x="68" y="374" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">· 每个块内，E₂ 必须是最少 size−1 条边的连通生成子图，多出来的边才能留给 E₁；</text>
  <text x="68" y="398" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">· E₁ 至少要有一条边，所以 G − E₃ 必须“比森林多一个环”。</text>
  <text x="68" y="428" font-size="12.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">⟺ 存在简单环 C，把 C 整条删掉后 G 仍然连通（连通性对删边单调，故只需试基本回路即可）。</text>
</svg>
