<svg xmlns="http://www.w3.org/2000/svg" width="840" height="360" viewBox="0 0 840 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="360" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两遍扫描求"每个位置到最近 1 的距离"</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">把行复制成两倍长度，左右各扫一遍</text>
  <g filter="url(#rough2)"><rect x="120" y="100" width="600" height="40" rx="4" fill="#ffffff" fill-opacity="0.85" stroke="#cccccc" stroke-width="1.3"/></g>
  <g filter="url(#rough2)"><rect x="130" y="100" width="66" height="40" rx="4" fill="#f7f7f7" fill-opacity="0.85" stroke="#667788" stroke-width="1.3"/></g>
  <text x="163" y="127" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)"><rect x="204" y="100" width="66" height="40" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#667788" stroke-width="1.3"/></g>
  <text x="237" y="127" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="278" y="100" width="66" height="40" rx="4" fill="#f7f7f7" fill-opacity="0.85" stroke="#667788" stroke-width="1.3"/></g>
  <text x="311" y="127" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)"><rect x="352" y="100" width="66" height="40" rx="4" fill="#f7f7f7" fill-opacity="0.85" stroke="#667788" stroke-width="1.3"/></g>
  <text x="385" y="127" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)"><rect x="426" y="100" width="66" height="40" rx="4" fill="#f7f7f7" fill-opacity="0.85" stroke="#667788" stroke-width="1.3"/></g>
  <text x="459" y="127" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)"><rect x="500" y="100" width="66" height="40" rx="4" fill="#f7f7f7" fill-opacity="0.85" stroke="#667788" stroke-width="1.3"/></g>
  <text x="533" y="127" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)"><rect x="574" y="100" width="66" height="40" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#667788" stroke-width="1.3"/></g>
  <text x="607" y="127" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="648" y="100" width="66" height="40" rx="4" fill="#f7f7f7" fill-opacity="0.85" stroke="#667788" stroke-width="1.3"/></g>
  <text x="681" y="127" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)"><line x1="130" y1="160" x2="720" y2="160" stroke="#a0522d" stroke-width="1.4" marker-end="url(#arrr)"/></g>
  <text x="420" y="180" text-anchor="middle" font-size="11.5" fill="#a0522d" filter="url(#rough2)">从左往右：记录最近一个 1 ⇒ 向左找的距离</text>
  <g filter="url(#rough2)"><line x1="720" y1="210" x2="130" y2="210" stroke="#446688" stroke-width="1.4" marker-end="url(#arrb)"/></g>
  <text x="420" y="230" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">从右往左：记录最近一个 1 ⇒ 向右找的距离</text>
  <text x="420" y="270" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">两者取小 = 循环距离；每行 O(m)，总计 O(nm)</text>
  <g filter="url(#rough2)"><rect x="250" y="296" width="340" height="40" rx="4" fill="#f7fbf4" fill-opacity="0.85" stroke="#a8c99a" stroke-width="1.3"/></g>
  <text x="420" y="322" text-anchor="middle" font-size="12" font-weight="bold" fill="#3d6b2f" filter="url(#rough2)">某行没有 1 ⇒ 直接输出 −1</text>
</svg>
