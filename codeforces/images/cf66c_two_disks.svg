<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="25"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="880" height="460" fill="#fafafa"/>

  <text x="440" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例二：两块盘各自成树，盘符不参与计数</text>

  <!-- 边 -->
  <g filter="url(#rough2)" stroke="#446688" stroke-width="1.6" fill="none">
    <path d="M 390 92 L 290 118"/>
    <path d="M 490 92 L 590 118"/>
    <path d="M 240 158 L 240 188"/>
    <path d="M 240 233 L 240 262"/>
    <path d="M 240 307 L 170 338"/>
    <path d="M 240 307 L 310 338"/>
    <path d="M 560 158 L 560 188"/>
  </g>

  <!-- 盘符与根 -->
  <g filter="url(#rough2)">
    <rect x="340" y="52" width="100" height="40" rx="8" fill="#eeeeee" stroke="#888888" stroke-width="1.6"/>
    <text x="390" y="78" text-anchor="middle" font-size="12" fill="#555555">虚拟根</text>

    <rect x="185" y="118" width="110" height="40" rx="8" fill="#f4f4f4" stroke="#888888" stroke-width="1.6" stroke-dasharray="6 3"/>
    <text x="240" y="144" text-anchor="middle" font-size="13" fill="#555555">C:</text>

    <rect x="505" y="118" width="110" height="40" rx="8" fill="#f4f4f4" stroke="#888888" stroke-width="1.6" stroke-dasharray="6 3"/>
    <text x="560" y="144" text-anchor="middle" font-size="13" fill="#555555">D:</text>

    <!-- C 侧 -->
    <rect x="175" y="188" width="130" height="45" rx="8" fill="#d9ecd4" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="240" y="208" text-anchor="middle" font-size="12.5" fill="#2f5223">folder1</text>
    <text x="240" y="225" text-anchor="middle" font-size="10.5" fill="#2f5223">(3, 2) ← 答案</text>

    <rect x="178" y="262" width="124" height="45" rx="8" fill="#cfe0f5" stroke="#446688" stroke-width="1.6"/>
    <text x="240" y="282" text-anchor="middle" font-size="12.5" fill="#2f4a66">folder2</text>
    <text x="240" y="299" text-anchor="middle" font-size="10.5" fill="#2f4a66">(2, 2)</text>

    <rect x="120" y="338" width="100" height="42" rx="8" fill="#f6e3c4" stroke="#b58a3a" stroke-width="1.6"/>
    <text x="170" y="357" text-anchor="middle" font-size="12" fill="#7a5a1b">folder3</text>
    <text x="170" y="372" text-anchor="middle" font-size="10" fill="#7a5a1b">(0, 1)</text>

    <rect x="310" y="338" width="100" height="42" rx="8" fill="#f6e3c4" stroke="#b58a3a" stroke-width="1.6"/>
    <text x="360" y="357" text-anchor="middle" font-size="12" fill="#7a5a1b">folder4</text>
    <text x="360" y="372" text-anchor="middle" font-size="10" fill="#7a5a1b">(0, 1)</text>

    <!-- D 侧 -->
    <rect x="495" y="188" width="130" height="45" rx="8" fill="#cfe0f5" stroke="#446688" stroke-width="1.6"/>
    <text x="560" y="208" text-anchor="middle" font-size="12.5" fill="#2f4a66">folder1</text>
    <text x="560" y="225" text-anchor="middle" font-size="10.5" fill="#2f4a66">(0, 1)</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5" fill="#7a5a1b">
    <text x="120" y="400" text-anchor="middle">file1.txt</text>
    <text x="360" y="400" text-anchor="middle">file1.txt</text>
    <text x="560" y="252" text-anchor="middle">file1.txt</text>
  </g>

  <g filter="url(#rough2)">
    <text x="700" y="150" font-size="11.5" fill="#666666">每个结点下方是</text>
    <text x="700" y="172" font-size="11.5" fill="#666666">(子文件夹数, 文件数)</text>
    <text x="700" y="204" font-size="11" fill="#999999">盘符结点用虚线表示</text>
    <text x="700" y="226" font-size="11" fill="#999999">不计入答案</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="418" width="760" height="32" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="74" y="440" font-size="11.5" fill="#8a6015">C: 与 D: 下的 folder1 是两个不同结点；若合并，文件数会错算成 3（正确 2）。</text>
  </g>
</svg>
