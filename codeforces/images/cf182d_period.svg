    </marker>
  </defs>
  <rect width="780" height="380" fill="#fafafa"/>
  <text x="390.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">字符串的「周期」：t 重复 x 次得到 s，等价于 |t| 是 s 的周期且整除 |s|</text>
