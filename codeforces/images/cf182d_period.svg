  <text x="302.0" y="110.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#26405c" filter="url(#rough2)">a</text>
  <rect x="330.0" y="80.0" width="48.0" height="46.0" rx="5" fill="#eef8ef" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="354.0" y="110.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#26405c" filter="url(#rough2)">b</text>
  <rect x="382.0" y="80.0" width="48.0" height="46.0" rx="5" fill="#eef8ef" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="406.0" y="110.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#26405c" filter="url(#rough2)">c</text>
  <rect x="434.0" y="80.0" width="48.0" height="46.0" rx="5" fill="#eef8ef" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="458.0" y="110.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#26405c" filter="url(#rough2)">d</text>
  <rect x="486.0" y="80.0" width="48.0" height="46.0" rx="5" fill="#fff3d6" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="510.0" y="110.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#26405c" filter="url(#rough2)">a</text>
  <rect x="538.0" y="80.0" width="48.0" height="46.0" rx="5" fill="#fff3d6" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="562.0" y="110.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#26405c" filter="url(#rough2)">b</text>
  <rect x="590.0" y="80.0" width="48.0" height="46.0" rx="5" fill="#fff3d6" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="614.0" y="110.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#26405c" filter="url(#rough2)">c</text>
  <rect x="642.0" y="80.0" width="48.0" height="46.0" rx="5" fill="#fff3d6" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="666.0" y="110.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#26405c" filter="url(#rough2)">d</text>
  <path d="M 70 138 L 118 138 M 70 132 L 70 144 M 118 132 L 118 144" stroke="#b85450" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="94.0" y="158.0" text-anchor="middle" font-size="10.4" font-weight="bold" fill="#b85450" filter="url(#rough2)">基本周期 p = 4</text>
  <text x="70.0" y="190.0" text-anchor="start" font-size="11.2" fill="#2b2b2b" filter="url(#rough2)">所有 divisor 的长度 d：d 必须是 p 的倍数，且 d 同时整除两个串的长度。</text>
  <rect x="60.0" y="210.0" width="630.0" height="30.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="68.0" y="233.0" text-anchor="start" font-size="10.8" font-weight="bold" fill="#26405c" filter="url(#rough2)">量</text>
  <text x="138.0" y="233.0" text-anchor="start" font-size="10.8" font-weight="bold" fill="#26405c" filter="url(#rough2)">含义</text>
  <text x="368.0" y="233.0" text-anchor="start" font-size="10.8" font-weight="bold" fill="#26405c" filter="url(#rough2)">怎么算</text>
  <path d="M 60.0 210.0 L 690.0 210.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="68.0" y="263.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">p₁, p₂</text>
  <text x="138.0" y="263.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">s₁、s₂ 的最小正周期</text>
  <text x="368.0" y="263.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">KMP 前缀函数：n − π[n−1]，须整除 n</text>
  <path d="M 60.0 240.0 L 690.0 240.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="68.0" y="293.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">g</text>
  <text x="138.0" y="293.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">gcd(|s₁|, |s₂|)</text>
  <text x="368.0" y="293.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">长度 gcd</text>
  <path d="M 60.0 270.0 L 690.0 270.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="68.0" y="323.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">L</text>
  <text x="138.0" y="323.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">lcm(p₁, p₂)</text>
  <text x="368.0" y="323.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">p₁/gcd(p₁,p₂)·p₂</text>
  <path d="M 60.0 300.0 L 690.0 300.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="68.0" y="353.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">答案</text>
  <text x="138.0" y="353.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">g/L 的约数个数</text>
  <text x="368.0" y="353.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">试除到 √(g/L)</text>
  <path d="M 60.0 330.0 L 690.0 330.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
</svg>
