<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="585"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="280" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">用栈维护当前路径</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">普通名字压栈，.. 弹栈，绝对路径先清空</text>
  <g filter="url(#rough2)"><rect x="60" y="96" width="780" height="60" rx="6" fill="#cfe0f5" fill-opacity="0.4" stroke="#446688" stroke-width="1.4"/></g>
  <text x="450" y="130" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">cd /home/vasya　⇒　栈 = [home, vasya]</text>
  <text x="200" y="176" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">cd ..</text>
  <text x="430" y="176" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">⇒</text>
  <text x="470" y="176" text-anchor="start" font-size="11.5" fill="#b06a1e" filter="url(#rough2)">[home]</text>
  <text x="200" y="218" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">cd vasya/../petya</text>
  <text x="430" y="218" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">⇒</text>
  <text x="470" y="218" text-anchor="start" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">[home, petya]</text>
  <text x="450" y="262" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">pwd 输出 / + 栈内每项 + /</text>
</svg>
