  <rect x="306.0" y="92.0" width="38.0" height="34.0" fill="#f7f9fc" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="325.0" y="113.7" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">6</text>
  <rect x="306.0" y="150.0" width="38.0" height="34.0" fill="#f4f9f2" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="325.0" y="171.7" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5</text>
  <path d="M 325.0 128.0 L 325.0 146.0" stroke="#c9801f" stroke-width="1.2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="200.0" y="216.0" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">每一对是 (2k-1, 2k)</text>
  <text x="200.0" y="240.0" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">gcd(2k-1, 2k) = 1</text>
  <text x="200.0" y="268.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">⇒ 所有位置 gcd(j, p(j)) = 1</text>
  <rect x="390.0" y="56.0" width="340.0" height="250.0" rx="10" fill="#fdf3e3" stroke="#c9801f" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="560.0" y="84.0" text-anchor="middle" font-size="12" fill="#c9801f" font-weight="bold" filter="url(#rough2)">n 为奇数：固定 1，再交换 (2,3) (4,5) …</text>
  <text x="400.0" y="116.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">位置 j</text>
  <text x="400.0" y="174.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">p(j)</text>
  <rect x="452.0" y="92.0" width="38.0" height="34.0" fill="#ffffff" stroke="#2b2b2b" stroke-width="2.0" filter="url(#rough2)"/>
  <text x="471.0" y="113.7" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">1</text>
