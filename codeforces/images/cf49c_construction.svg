  <rect x="222.0" y="150.0" width="38.0" height="34.0" fill="#f4f9f2" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="241.0" y="171.7" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <path d="M 241.0 128.0 L 241.0 146.0" stroke="#c9801f" stroke-width="1.2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="264.0" y="92.0" width="38.0" height="34.0" fill="#f7f9fc" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="283.0" y="113.7" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">5</text>
