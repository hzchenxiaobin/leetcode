  <rect width="760" height="400" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">构造：把相邻的两卷互换</text>
  <rect x="30.0" y="56.0" width="340.0" height="250.0" rx="10" fill="#f7f9fc" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200.0" y="84.0" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">n 为偶数：交换 (1,2) (3,4) (5,6) …</text>
  <text x="44.0" y="116.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">位置 j</text>
  <text x="44.0" y="174.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">p(j)</text>
  <rect x="96.0" y="92.0" width="38.0" height="34.0" fill="#f7f9fc" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="115.0" y="113.7" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <rect x="96.0" y="150.0" width="38.0" height="34.0" fill="#f4f9f2" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
