  <path d="M 639.0 128.0 L 639.0 146.0" stroke="#c9801f" stroke-width="1.2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="560.0" y="216.0" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">p(1)=1（gcd=1），其余是 (2k, 2k+1)</text>
  <text x="560.0" y="240.0" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">gcd(2k, 2k+1) = 1</text>
  <text x="560.0" y="268.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">⇒ 同样所有位置 gcd(j, p(j)) = 1</text>
  <rect x="34.0" y="322.0" width="692.0" height="58.0" rx="8" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.4" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="48.0" y="346.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">关键：每对被换的都是两个连续整数，连续整数一定互素；</text>
  <text x="48.0" y="368.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">而每个位置只会被换到它自己的邻居上，所以全局 gcd(j, p(j)) 全是 1。</text>
</svg>
