  <text x="513.0" y="171.7" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <path d="M 513.0 128.0 L 513.0 146.0" stroke="#c9801f" stroke-width="1.2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="536.0" y="92.0" width="38.0" height="34.0" fill="#f7f9fc" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="555.0" y="113.7" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <rect x="536.0" y="150.0" width="38.0" height="34.0" fill="#f4f9f2" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="555.0" y="171.7" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <path d="M 555.0 128.0 L 555.0 146.0" stroke="#c9801f" stroke-width="1.2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="578.0" y="92.0" width="38.0" height="34.0" fill="#f7f9fc" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="597.0" y="113.7" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <rect x="578.0" y="150.0" width="38.0" height="34.0" fill="#f4f9f2" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
