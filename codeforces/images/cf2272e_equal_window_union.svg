<svg xmlns="http://www.w3.org/2000/svg" width="780" height="436" viewBox="0 0 780 436"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="780" height="436" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">K = −1（READ 前面全是 R）：每个 W 给一个等长窗口，间隙 ≤ w 就合并</text>
  <path d="M 92 42 Q 390 50 688 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 格子 0..10 -->
  <text x="107" y="124" text-anchor="middle" font-size="10.5" fill="#7a7a7a" filter="url(#rough2)">0</text>
  <text x="167" y="124" text-anchor="middle" font-size="10.5" fill="#7a7a7a" filter="url(#rough2)">1</text>
  <text x="227" y="124" text-anchor="middle" font-size="10.5" fill="#7a7a7a" filter="url(#rough2)">2</text>
  <text x="287" y="124" text-anchor="middle" font-size="10.5" fill="#7a7a7a" filter="url(#rough2)">3</text>
  <text x="347" y="124" text-anchor="middle" font-size="10.5" fill="#7a7a7a" filter="url(#rough2)">4</text>
  <text x="407" y="124" text-anchor="middle" font-size="10.5" fill="#7a7a7a" filter="url(#rough2)">5</text>
  <text x="467" y="124" text-anchor="middle" font-size="10.5" fill="#7a7a7a" filter="url(#rough2)">6</text>
  <text x="527" y="124" text-anchor="middle" font-size="10.5" fill="#7a7a7a" filter="url(#rough2)">7</text>
  <text x="587" y="124" text-anchor="middle" font-size="10.5" fill="#7a7a7a" filter="url(#rough2)">8</text>
  <text x="647" y="124" text-anchor="middle" font-size="10.5" fill="#7a7a7a" filter="url(#rough2)">9</text>
  <text x="707" y="124" text-anchor="middle" font-size="10.5" fill="#7a7a7a" filter="url(#rough2)">10</text>

  <rect x="80" y="132" width="54" height="38" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="107" y="157" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5d22" filter="url(#rough2)">W</text>
  <rect x="140" y="132" width="54" height="38" rx="5" fill="#fafafa" stroke="#b9c6d6" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="200" y="132" width="54" height="38" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="227" y="157" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5d22" filter="url(#rough2)">W</text>
  <rect x="260" y="132" width="54" height="38" rx="5" fill="#fafafa" stroke="#b9c6d6" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="320" y="132" width="54" height="38" rx="5" fill="#fafafa" stroke="#b9c6d6" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="380" y="132" width="54" height="38" rx="5" fill="#fafafa" stroke="#b9c6d6" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="440" y="132" width="54" height="38" rx="5" fill="#fafafa" stroke="#b9c6d6" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="500" y="132" width="54" height="38" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="527" y="157" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5d22" filter="url(#rough2)">W</text>
  <rect x="560" y="132" width="54" height="38" rx="5" fill="#fafafa" stroke="#b9c6d6" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="620" y="132" width="54" height="38" rx="5" fill="#fafafa" stroke="#b9c6d6" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="680" y="132" width="54" height="38" rx="5" fill="#fafafa" stroke="#b9c6d6" stroke-width="1.3" filter="url(#rough2)"/>

  <text x="163" y="182" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">间隙 2 ≤ w</text>
  <text x="377" y="182" text-anchor="middle" font-size="10" fill="#a14340" filter="url(#rough2)">间隙 5 &gt; w</text>

  <!-- 窗口 w = 3 -->
  <rect x="140" y="192" width="174" height="18" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="134" y="206" text-anchor="end" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">L=0：[1,3]</text>

  <rect x="260" y="220" width="174" height="18" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="254" y="234" text-anchor="end" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">L=2：[3,5]</text>

  <rect x="560" y="248" width="174" height="18" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="554" y="262" text-anchor="end" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">L=7：[8,10]</text>

  <text x="742" y="284" text-anchor="end" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">每段长度都是 w = i+1 = 3</text>

  <!-- 合并后的簇 -->
  <rect x="140" y="292" width="294" height="20" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="287" y="307" text-anchor="middle" font-size="11" fill="#a14340" filter="url(#rough2)">簇① [1,5]：跨度 2 + w 3 = 5</text>

  <rect x="560" y="292" width="174" height="20" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="647" y="307" text-anchor="middle" font-size="11" fill="#a14340" filter="url(#rough2)">簇② [8,10]：0 + 3 = 3</text>

  <!-- 公式框 -->
  <rect x="58" y="326" width="664" height="96" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="72" y="350" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">并集大小 = Σ(间隙 ≤ w 的间隔) + 簇数 · w，其中 簇数 = q − #(间隙 ≤ w)，q = 另一条串中 W 的个数</text>
  <text x="72" y="372" font-size="12" fill="#8a6015" filter="url(#rough2)">本例：间隙 {2,5}，w = 3 → 只有 2 合格，簇数 = 3−1 = 2，跨度之和 2，并集 = 2 + 2·3 = 8</text>
  <text x="72" y="394" font-size="12" fill="#8a6015" filter="url(#rough2)">再补上「前面全不是 W」时能读到的 0 → 答案 = 8 + 1 = 9</text>
  <text x="72" y="414" font-size="11.5" fill="#8a6015" filter="url(#rough2)">实现：间隙排序 + 前缀和，二分出「≤ w 的个数 c 与总和 S」，答案 = 1 + S + (q−c)·w。</text>
</svg>
