<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="340" fill="#fafafa"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">F3 的合并：小并大 + 按 k 截断，总代价 O(n·k)</text>
  <path d="M 158.42500000000007 46 Q 380.0 52 601.5749999999999 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60.0" y="70.0" width="640.0" height="60.0" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="76.0" y="108.0" text-anchor="start" font-size="11.2" fill="#33506e" filter="url(#rough2)">每次把「当前已合并的大小 a」与「下一个儿子的大小 b」卷积，只保留 ≤ k 的部分。</text>
  <rect x="60.0" y="146.0" width="640.0" height="60.0" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="76.0" y="172.0" text-anchor="start" font-size="11.2" fill="#8a6015" filter="url(#rough2)">代价 a·b 可以摊到「点对」上：每个点对的 LCA 处被算一次 ⇒ 总和 ≤ n·k。</text>
  <text x="76.0" y="192.0" text-anchor="start" font-size="11.0" fill="#8a6015" filter="url(#rough2)">（等价说法：树形背包 + 截断 = O(nk)，而不是 O(nk²)。）</text>
  <rect x="60.0" y="222.0" width="640.0" height="90.0" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="76.0" y="246.0" text-anchor="start" font-size="11.2" fill="#2f5b34" filter="url(#rough2)">k = n 时上界约 4×10⁶ 次加法，n = 2000 实测 C++ 约 0.15 s（含读入 10⁶ 字符）。</text>
  <text x="76.0" y="268.0" text-anchor="start" font-size="11.0" fill="#2f5b34" filter="url(#rough2)">注意 maxWeight 之类“截断”要写对：dp 大小取 min(k, 子树串数)+1。</text>
  <text x="76.0" y="290.0" text-anchor="start" font-size="11.0" fill="#2f5b34" filter="url(#rough2)">答案用 long long：C(2000,2)·500 ≈ 10⁹，贴着 int 上界。</text>
</svg>
