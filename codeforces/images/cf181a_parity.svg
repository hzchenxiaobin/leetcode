<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="91"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="360" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">181A：用奇偶性直接找缺失的行与列</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="60.0" y="96.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">三颗星分布在两行两列上：一行出现 2 次、一行 1 次；列同理。</text>
  <rect x="80.0" y="140.0" width="260.0" height="90.0" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="210.0" y="172.0" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">行计数</text>
  <text x="150.0" y="202.0" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">r₁: 2</text>
  <text x="270.0" y="202.0" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">r₃: 1</text>
  <rect x="400.0" y="140.0" width="260.0" height="90.0" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="530.0" y="172.0" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">列计数</text>
  <text x="470.0" y="202.0" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">c₁: 2</text>
  <text x="590.0" y="202.0" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">c₃: 1</text>
  <text x="60.0" y="270.0" text-anchor="start" font-size="12.5" fill="#6b4c9a" font-weight="bold" filter="url(#rough2)">取奇数的那一行和那一列即可——不需要判断矩形朝向，也无需枚举。</text>
  <text x="60.0" y="304.0" text-anchor="start" font-size="12" fill="#555" filter="url(#rough2)">复杂度 O(nm)，n,m ≤ 100。</text>
</svg>
