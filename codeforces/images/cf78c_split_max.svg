<svg xmlns="http://www.w3.org/2000/svg" width="720" height="410" viewBox="0 0 720 410"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>

  <rect width="720" height="410" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">最大切分把局面直接送到异或 0</text>
  <path d="M 150 44 Q 360 50 570 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <text x="60" y="86" font-size="12.5" fill="#7a5a2a" filter="url(#rough2)">一根 15 米的木头</text>
  <rect x="80" y="96" width="480" height="42" rx="6" fill="#f7f0dd" stroke="#8a6015" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="240" y1="96" x2="240" y2="138" stroke="#8a6015" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <line x1="400" y1="96" x2="400" y2="138" stroke="#8a6015" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="320" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#6b4a10" filter="url(#rough2)">L = 15，k = 4</text>

  <path d="M 320 144 L 320 178" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <text x="470" y="170" text-anchor="middle" font-size="12.5" fill="#5a5a5a" filter="url(#rough2)">切成 d = 3 段（m 的合法切分数里最大的）</text>

  <rect x="80" y="186" width="152" height="40" rx="6" fill="#e6f0dd" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="156" y="212" text-anchor="middle" font-size="14" fill="#2f5223" filter="url(#rough2)">5 米</text>
  <rect x="244" y="186" width="152" height="40" rx="6" fill="#e6f0dd" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="320" y="212" text-anchor="middle" font-size="14" fill="#2f5223" filter="url(#rough2)">5 米</text>
  <rect x="408" y="186" width="152" height="40" rx="6" fill="#e6f0dd" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="484" y="212" text-anchor="middle" font-size="14" fill="#2f5223" filter="url(#rough2)">5 米</text>

  <rect x="80" y="250" width="480" height="34" rx="8" fill="#fbeeee" stroke="#a05a5a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="273" text-anchor="middle" font-size="12.5" fill="#6b3030" filter="url(#rough2)">每一段 5 米都切不动：若还能切成 d' 段，d×d' 就是更大的合法切分数，矛盾</text>

  <rect x="70" y="300" width="600" height="92" rx="10" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="90" y="324" font-size="12.5" fill="#2f5223" filter="url(#rough2)">所以每一段的 SG 都是 g(5) = 0（无路可走）</text>
  <text x="90" y="348" font-size="12.5" fill="#2f5223" filter="url(#rough2)">切成 3 段后的局面异或 = 0 ⊕ 0 ⊕ 0 = 0，是必败局面</text>
  <text x="90" y="372" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">于是 0 属于选项集合 ⇒ g(15) ≠ 0 ⇒ 先手（Timur）胜</text>
</svg>
