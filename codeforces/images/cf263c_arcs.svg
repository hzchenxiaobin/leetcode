<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="300" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每个数的 4 个邻居 = 环上距离 1 与距离 2 的点</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">所以输入图必须 4-正则，且由它唯一确定这个圆</text>
  <g filter="url(#rough2)"><rect x="200" y="110" width="60" height="60" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="230.0" y="145.04" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">v</text>
  <g filter="url(#rough2)"><rect x="120" y="110" width="60" height="60" rx="4" fill="#cfe0f0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="150.0" y="144.68" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">v-2</text>
  <g filter="url(#rough2)"><rect x="280" y="110" width="60" height="60" rx="4" fill="#cfe0f0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="310.0" y="144.68" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">v-1</text>
  <g filter="url(#rough2)"><rect x="360" y="110" width="60" height="60" rx="4" fill="#f6e3c4" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="390.0" y="144.68" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">v+1</text>
  <g filter="url(#rough2)"><rect x="440" y="110" width="60" height="60" rx="4" fill="#f6e3c4" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="470.0" y="144.68" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">v+2</text>
  <text x="440" y="210" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">连续三点必然两两相邻 → 用"公共邻居"逐步延展</text>
  <text x="440" y="248" text-anchor="middle" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">最后把推出的 2n 条弧与输入集合比对，完全一致才输出</text>
</svg>
