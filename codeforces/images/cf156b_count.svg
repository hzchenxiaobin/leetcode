<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="539"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="290" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">对每个候选罪犯统计真话数 T(c)</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">T(c) = plusCnt[c] + (minusTotal − minusCnt[c])</text>
  <g filter="url(#rough2)"><rect x="60" y="96" width="380" height="80" rx="6" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="250" y="126" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">+a 为真 ⟺ c = a</text>
  <text x="250" y="154" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">贡献 plusCnt[c]</text>
  <g filter="url(#rough2)"><rect x="480" y="96" width="380" height="80" rx="6" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="670" y="126" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">−a 为真 ⟺ c ≠ a</text>
  <text x="670" y="154" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">贡献 minusTotal − minusCnt[c]</text>
  <text x="450" y="212" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">合法罪犯集合 V = {c : T(c) = m}</text>
  <text x="450" y="248" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">每句话：所有 V 上都真 ⇒ Truth；都假 ⇒ Lie；否则 Not defined</text>
</svg>
