<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 392" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="392" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">查询 g(k)：值域桶上从大到小的「二分」，整桶整桶地跳过</text>

  <path d="M 104 62 L 508 62" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="306" y="52" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">从最大的桶开始往小累加 sum（等价于在「值」上二分）</text>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle" fill="#446688">
    <text x="108" y="132">20</text>
    <text x="208" y="152">28</text>
    <text x="308" y="167">43</text>
    <text x="408" y="182">46</text>
    <text x="508" y="192">50</text>
    <text x="560" y="176" text-anchor="start">桶前缀和</text>
  </g>

  <g filter="url(#rough2)" text-anchor="middle">
    <rect x="70" y="140" width="76" height="90" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="108" y="190" font-size="12.5" fill="#3a5a30">×2</text>
    <text x="108" y="252" font-size="11.5" fill="#3a5a30">x = 10</text>

    <rect x="170" y="160" width="76" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="208" y="200" font-size="12.5" fill="#3a5a30">×1</text>
    <text x="208" y="252" font-size="11.5" fill="#3a5a30">x = 8</text>

    <rect x="270" y="175" width="76" height="55" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4"/>
    <text x="308" y="207" font-size="12.5" fill="#8a6a20" font-weight="bold">×3</text>
    <text x="308" y="252" font-size="11.5" fill="#8a6a20" font-weight="bold">x = 5</text>

    <rect x="370" y="190" width="76" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <text x="408" y="215" font-size="12" fill="#8a3a3a">×1</text>
    <text x="408" y="252" font-size="11.5" fill="#8a3a3a">x = 3</text>

    <rect x="470" y="200" width="76" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <text x="508" y="220" font-size="12" fill="#8a3a3a">×4</text>
    <text x="508" y="252" font-size="11.5" fill="#8a3a3a">x = 1</text>
  </g>

  <path d="M 70 272 L 346 272" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 70 272 L 70 266" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 346 272 L 346 266" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="208" y="290" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">整桶拿走：2 + 1 个，和 = 28 &lt; v_k = 40</text>

  <text x="310" y="312" text-anchor="middle" font-size="11" fill="#8a3a3a" filter="url(#rough2)">跨过 v_k = 40 的是 x = 5 这一桶：还差 40 − 28 = 12 ⇒ 再取 ⌈12 / 5⌉ = 3 个</text>
  <text x="310" y="332" text-anchor="middle" font-size="11.5" fill="#3a4a66" filter="url(#rough2)">t = accC + ⌈(v_k − accS) / x⌉ = (2 + 1) + 3 = 6，取 10,10,8,5,5,5 = 43 ≥ 40</text>
  <text x="310" y="354" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">所有桶加完仍 &lt; v_k ⇒ 这一层永远凑不够，g(k) = ∞；桶的 cnt / sum 用线段树维护，插入 O(log K)</text>
  <text x="310" y="374" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">在线段树上「整桶跳过」就是一次向下走：左子树是更大的值，右边满了就往右、不够就往左</text>
</svg>
