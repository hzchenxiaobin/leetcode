<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="91"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="820" height="420" fill="#fafafa"/>

  <text x="410" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">候选中心只有 2n 个：贴哪座房子的哪一侧</text>
  <path d="M 150 40 Q 410 46 670 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <path d="M 50 300 L 800 300" stroke="#666666" stroke-width="1.5" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <line x1="70" y1="300" x2="70" y2="310" stroke="#888888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="328" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">-8</text>
  <line x1="150" y1="300" x2="150" y2="310" stroke="#888888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="150" y="328" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">-6</text>
  <line x1="230" y1="300" x2="230" y2="310" stroke="#888888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="230" y="328" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">-4</text>
  <line x1="310" y1="300" x2="310" y2="310" stroke="#888888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="310" y="328" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">-2</text>
  <line x1="390" y1="300" x2="390" y2="310" stroke="#888888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="390" y="328" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">0</text>
  <line x1="470" y1="300" x2="470" y2="310" stroke="#888888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="470" y="328" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">2</text>
  <line x1="550" y1="300" x2="550" y2="310" stroke="#888888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="550" y="328" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">4</text>
  <line x1="630" y1="300" x2="630" y2="310" stroke="#888888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="630" y="328" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">6</text>
  <line x1="710" y1="300" x2="710" y2="310" stroke="#888888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="710" y="328" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">8</text>
  <line x1="790" y1="300" x2="790" y2="310" stroke="#888888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="790" y="328" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">10</text>
  <rect x="310" y="210" width="160" height="90" fill="#cfe0f5" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="262" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">房子 1</text>
  <text x="390" y="282" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">中心 0，边长 4</text>
  <rect x="590" y="230" width="80" height="70" fill="#d9ecd4" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="630" y="270" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">房子 2</text>
  <path d="M 270 150 L 270 295" stroke="#c98a2b" stroke-width="1.4" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <circle cx="270" cy="300" r="5" fill="#c98a2b" filter="url(#rough2)"/>
  <path d="M 510 150 L 510 295" stroke="#c98a2b" stroke-width="1.4" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <circle cx="510" cy="300" r="5" fill="#c98a2b" filter="url(#rough2)"/>
  <path d="M 550 150 L 550 295" stroke="#c98a2b" stroke-width="1.4" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <circle cx="550" cy="300" r="5" fill="#c98a2b" filter="url(#rough2)"/>
  <path d="M 710 150 L 710 295" stroke="#c98a2b" stroke-width="1.4" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <circle cx="710" cy="300" r="5" fill="#c98a2b" filter="url(#rough2)"/>
  <text x="270" y="140" text-anchor="middle" font-size="10.5" fill="#8a6015" filter="url(#rough2)">−3</text>
  <text x="510" y="120" text-anchor="middle" font-size="10.5" fill="#8a6015" filter="url(#rough2)">3</text>
  <text x="550" y="140" text-anchor="middle" font-size="10.5" fill="#8a6015" filter="url(#rough2)">4</text>
  <text x="710" y="120" text-anchor="middle" font-size="10.5" fill="#8a6015" filter="url(#rough2)">8</text>
  <rect x="470" y="215" width="80" height="85" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.5" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="510" y="204" text-anchor="middle" font-size="10.5" fill="#8a6015" filter="url(#rough2)">新房子 t=2</text>
  <text x="60" y="368" font-size="12" fill="#2b2b2b" filter="url(#rough2)">接触时必须有一条竖边重合 ⇒ 中心只能是 x(i) ± (a(i)+t)/2，整个坐标轴只需要看这 2n 个点。</text>
  <text x="60" y="394" font-size="12" fill="#8a6015" filter="url(#rough2)">把坐标乘以 2：候选变成整数 C = 2·x(i) ± (a(i)+t)，重叠判断也全是整数比较。</text>
</svg>
