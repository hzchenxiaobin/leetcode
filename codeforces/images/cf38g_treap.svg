<svg xmlns="http://www.w3.org/2000/svg" width="780" height="430" viewBox="0 0 780 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="809"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="780" height="430" fill="#fafafa"/>
  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">隐式 treap：中序就是队列，每个节点记 size 与子树 max</text>

  <!-- 根 6 -->
  <circle cx="390" cy="90" r="24" fill="#a8d8a8" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="390" y="88" text-anchor="middle" font-size="12" fill="#204a1e" filter="url(#rough2)">6</text>
  <text x="390" y="103" text-anchor="middle" font-size="8" fill="#3c5e2e" filter="url(#rough2)">sz9 mx9</text>

  <!-- 左 3 -->
  <circle cx="240" cy="180" r="22" fill="#dbe7fb" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240" y="178" text-anchor="middle" font-size="12" fill="#23405c" filter="url(#rough2)">3</text>
  <text x="240" y="192" text-anchor="middle" font-size="8" fill="#446688" filter="url(#rough2)">sz4 mx4</text>

  <!-- 右 7 -->
  <circle cx="540" cy="180" r="22" fill="#dbe7fb" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="540" y="178" text-anchor="middle" font-size="12" fill="#23405c" filter="url(#rough2)">7</text>
  <text x="540" y="192" text-anchor="middle" font-size="8" fill="#446688" filter="url(#rough2)">sz4 mx9</text>

  <!-- 1 -->
  <circle cx="180" cy="270" r="20" fill="#f6f6f6" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="180" y="268" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="180" y="281" text-anchor="middle" font-size="8" fill="#777" filter="url(#rough2)">sz2 mx2</text>

  <!-- 4 -->
  <circle cx="300" cy="270" r="20" fill="#f6f6f6" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="300" y="268" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4</text>
  <text x="300" y="281" text-anchor="middle" font-size="8" fill="#777" filter="url(#rough2)">sz1 mx4</text>

  <!-- 5 -->
  <circle cx="480" cy="270" r="20" fill="#f6f6f6" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="480" y="268" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">5</text>
  <text x="480" y="281" text-anchor="middle" font-size="8" fill="#777" filter="url(#rough2)">sz1 mx5</text>

  <!-- 9 -->
  <circle cx="600" cy="270" r="20" fill="#ffd9b3" stroke="#b06a2c" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="600" y="268" text-anchor="middle" font-size="11" fill="#8a4a14" filter="url(#rough2)">9</text>
  <text x="600" y="281" text-anchor="middle" font-size="8" fill="#8a4a14" filter="url(#rough2)">sz2 mx9</text>

  <!-- 2 (1 的左孩子) -->
  <circle cx="120" cy="350" r="18" fill="#f6f6f6" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="120" y="348" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">2</text>
  <text x="120" y="360" text-anchor="middle" font-size="7.5" fill="#777" filter="url(#rough2)">sz1 mx2</text>

  <!-- 8 (9 的左孩子) -->
  <circle cx="600" cy="350" r="18" fill="#f6f6f6" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="600" y="348" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">8</text>
  <text x="600" y="360" text-anchor="middle" font-size="7.5" fill="#777" filter="url(#rough2)">sz1 mx8</text>

  <!-- 边 -->
  <line x1="370" y1="106" x2="258" y2="162" stroke="#7a8ca6" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="410" y1="106" x2="522" y2="162" stroke="#7a8ca6" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="222" y1="196" x2="192" y2="252" stroke="#7a8ca6" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="258" y1="196" x2="288" y2="252" stroke="#7a8ca6" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="522" y1="196" x2="492" y2="252" stroke="#7a8ca6" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="558" y1="196" x2="588" y2="252" stroke="#7a8ca6" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="600" y1="290" x2="600" y2="332" stroke="#7a8ca6" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="162" y1="280" x2="132" y2="332" stroke="#7a8ca6" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="60" y="88" font-size="10.5" fill="#446688" filter="url(#rough2)">节点上的数字是 a 的值，</text>
  <text x="60" y="106" font-size="10.5" fill="#446688" filter="url(#rough2)">小字是 size 与子树 max。</text>
  <text x="60" y="128" font-size="10.5" fill="#8c3b37" filter="url(#rough2)">中序遍历 = 队列顺序：2,1,3,4,6,5,7,8,9</text>

  <rect x="40" y="392" width="340" height="28" rx="8" fill="#eef4ff" stroke="#446688"
        stroke-width="1.3" filter="url(#rough2)"/>
  <text x="54" y="411" font-size="10.5" fill="#23405c" filter="url(#rough2)">split(t,k) 按中序前 k 个切开；merge 按优先级拼接</text>

  <rect x="400" y="392" width="340" height="28" rx="8" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.3" filter="url(#rough2)"/>
  <text x="414" y="411" font-size="10.5" fill="#8a6015" filter="url(#rough2)">queryLastGreater(x)：右子树 mx &gt; x 就向右</text>

  <text x="40" y="226" font-size="10.5" fill="#555" filter="url(#rough2)">插入：split(root, pos) → merge(merge(A, 新节点), B)，期望 O(log n)</text>
</svg>
