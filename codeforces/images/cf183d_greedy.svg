<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="115"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="420" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">183D 样例 1：两件 T 恤，先各取 0.75，再取 0.25</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="60.0" y="96.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">两名工程师都以 0.5/0.5 落在尺码 1、2 上</text>
  <text x="60.0" y="130.0" text-anchor="start" font-size="11.5" fill="#444" filter="url(#rough2)">X₁ ~ Bin(2, 0.5)：P = 0.25, 0.5, 0.25；X₂ 同分布</text>
  <text x="60.0" y="176.0" text-anchor="start" font-size="11.5" fill="#444" filter="url(#rough2)">边际：尺码 1 的 P(X≥1)=0.75、P(X≥2)=0.25；尺码 2 相同</text>
  <text x="70.0" y="216.0" text-anchor="start" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">第 1 件</text>
  <text x="170.0" y="216.0" text-anchor="start" font-size="11.5" fill="#444" filter="url(#rough2)">尺码 1，+0.75</text>
  <text x="450.0" y="216.0" text-anchor="start" font-size="11.5" fill="#8a6015" font-weight="bold" filter="url(#rough2)">总计 0.75</text>
  <text x="70.0" y="262.0" text-anchor="start" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">第 2 件</text>
  <text x="170.0" y="262.0" text-anchor="start" font-size="11.5" fill="#444" filter="url(#rough2)">尺码 2，+0.75</text>
  <text x="450.0" y="262.0" text-anchor="start" font-size="11.5" fill="#8a6015" font-weight="bold" filter="url(#rough2)">总计 1.50</text>
  <text x="70.0" y="308.0" text-anchor="start" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">若第 3 件</text>
  <text x="170.0" y="308.0" text-anchor="start" font-size="11.5" fill="#444" filter="url(#rough2)">任何尺码，+0.25</text>
  <text x="450.0" y="308.0" text-anchor="start" font-size="11.5" fill="#8a6015" font-weight="bold" filter="url(#rough2)">但只有 2 件</text>
  <rect x="40.0" y="364.0" width="640.0" height="40.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="54.0" y="387.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">答案 1.5，与官方输出 1.500000000000 一致</text>
</svg>
