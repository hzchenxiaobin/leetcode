<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="452"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="320" fill="#fafafa"/>
  <text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例走查：k 个月 = 沿月份表前进 k 格（第 12 格后回到第 1 格）</text>
  <path d="M 60 38 Q 380 46 700 38" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <text x="30" y="72" font-size="12.5" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">样例 1：November, k = 3</text>

  <g font-size="11">
    <rect x="30" y="88" width="130" height="44" rx="8" fill="#fbe3c8" stroke="#8a2b28" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="95" y="108" text-anchor="middle" fill="#8a2b28" filter="url(#rough2)">November</text>
    <text x="95" y="123" text-anchor="middle" font-size="9.5" fill="#8a2b28" filter="url(#rough2)">idx 10</text>

    <rect x="196" y="88" width="130" height="44" rx="8" fill="#cfe0f5" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="261" y="108" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">December</text>
    <text x="261" y="123" text-anchor="middle" font-size="9.5" fill="#555555" filter="url(#rough2)">+1 → idx 11</text>

    <rect x="362" y="88" width="130" height="44" rx="8" fill="#cfe0f5" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="427" y="108" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">January</text>
    <text x="427" y="123" text-anchor="middle" font-size="9.5" fill="#555555" filter="url(#rough2)">+2 → idx 0（绕回）</text>

    <rect x="528" y="88" width="130" height="44" rx="8" fill="#d9ecd4" stroke="#8a2b28" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="593" y="108" text-anchor="middle" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">February</text>
    <text x="593" y="123" text-anchor="middle" font-size="9.5" fill="#2b2b2b" filter="url(#rough2)">+3 → idx 1 = 答案</text>
  </g>
  <path d="M 162 110 L 192 110" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 328 110 L 358 110" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 494 110 L 524 110" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <text x="30" y="176" font-size="12.5" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">样例 2：May, k = 24</text>

  <g font-size="11">
    <rect x="30" y="192" width="150" height="44" rx="8" fill="#d9ecd4" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="105" y="212" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">May（idx 4）</text>
    <text x="105" y="227" text-anchor="middle" font-size="9.5" fill="#555555" filter="url(#rough2)">起点</text>

    <rect x="230" y="192" width="230" height="44" rx="8" fill="#f6d5d5" stroke="#8a2b28" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="345" y="212" text-anchor="middle" fill="#8a2b28" filter="url(#rough2)">24 = 2 × 12，正好绕两整圈</text>
    <text x="345" y="227" text-anchor="middle" font-size="9.5" fill="#8a2b28" filter="url(#rough2)">(4 + 24) mod 12 = 4</text>

    <rect x="510" y="192" width="150" height="44" rx="8" fill="#d9ecd4" stroke="#8a2b28" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="585" y="212" text-anchor="middle" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">May</text>
    <text x="585" y="227" text-anchor="middle" font-size="9.5" fill="#2b2b2b" filter="url(#rough2)">答案</text>
  </g>
  <path d="M 184 214 L 226 214" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 464 214 L 506 214" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <text x="30" y="278" font-size="11.5" fill="#555555" filter="url(#rough2)">两个样例分别覆盖「跨年绕回」与「k 超过 12 的整圈」两种情形：取模公式一次处理。</text>
</svg>
