<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="711"/>
    <feDisplacementMap in="SourceGraphic" scale="1.5"/></filter></defs>
  <rect width="700" height="300" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每秒钟只有两种选择：顺风走一步，或抛锚不动</text>
  <path d="M 130 40 Q 350 46 570 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="76" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="12.5" fill="#22314a" filter="url(#rough2)">把需求拆成两个数：nx = ex − sx（东为正）、ny = ey − sy（北为正）。</text>
  <text x="76" y="106" font-size="12.5" fill="#22314a" filter="url(#rough2)">需要 |nx| 次东（或西）风、|ny| 次北（或南）风，先后顺序完全不影响结果。</text>
  <text x="76" y="130" font-size="12.5" fill="#22314a" filter="url(#rough2)">所以贪心：风"正好是还需要的方向"就用，否则抛锚（绝不往反方向走）。</text>
  <g filter="url(#rough2)"><rect x="60" y="146" width="580" height="66" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="76" y="170" font-size="13" fill="#8a6015">为什么可以贪心：往反方向走只会让某个需求变大，而抛锚是免费的、不消耗时间以外的东西。</text>
  <text x="76" y="194" font-size="12.5" fill="#8a6015">⇒ 任何最优解都能改成"只用需要的风向"而不变差。</text>
  <g filter="url(#rough2)"><rect x="60" y="224" width="580" height="58" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="248" font-size="12.5" fill="#2f5223">样例 1：need E×1, N×1；风 "S E S N W" ⇒ 第 2 秒用 E、第 4 秒用 N ⇒ 4 ✓</text>
  <text x="76" y="270" font-size="12.5" fill="#2f5223">样例 2：need W×2, N×3，但 10 秒里 W 只出现 1 次 ⇒ −1 ✓</text>
</svg>
