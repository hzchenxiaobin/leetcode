<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="400" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">飞碟三舱排成一条链，所有外星人从 3 号舱搬到 1 号舱</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">规则：只有"参与移动的两个舱里军衔最高"的外星人才能在这两个舱之间移动</text>
  <g filter="url(#rough2)"><rect x="160" y="110" width="140" height="90" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#667788" stroke-width="1.3"/></g>
  <text x="230" y="162" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1 号舱</text>
  <g filter="url(#rough2)"><line x1="304" y1="155" x2="396" y2="155" stroke="#888888" stroke-width="2"/></g>
  <g filter="url(#rough2)"><rect x="350" y="110" width="140" height="90" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#667788" stroke-width="1.3"/></g>
  <text x="420" y="162" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2 号舱</text>
  <g filter="url(#rough2)"><line x1="494" y1="155" x2="586" y2="155" stroke="#888888" stroke-width="2"/></g>
  <text x="320" y="150" text-anchor="middle" font-size="10.5" fill="#3d6b2f" filter="url(#rough2)">可移动</text>
  <g filter="url(#rough2)"><rect x="540" y="110" width="140" height="90" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#667788" stroke-width="1.3"/></g>
  <text x="610" y="162" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3 号舱</text>
  <text x="510" y="150" text-anchor="middle" font-size="10.5" fill="#3d6b2f" filter="url(#rough2)">可移动</text>
  <g filter="url(#rough2)"><line x1="300" y1="155" x2="350" y2="155" stroke="#3d6b2f" stroke-width="2.2" marker-end="url(#arrg)"/></g>
  <g filter="url(#rough2)"><line x1="490" y1="155" x2="540" y2="155" stroke="#3d6b2f" stroke-width="2.2" marker-end="url(#arrg)"/></g>
  <text x="420" y="250" text-anchor="middle" font-size="12.5" fill="#8a4b2a" filter="url(#rough2)">军衔 n 的外星人最资深：它在哪个舱，别人就不能进出那个舱</text>
  <text x="420" y="280" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">所以它必须先离开 3 号舱（2 步：3→2→1），小外星人才能行动</text>
  <g filter="url(#rough2)"><rect x="120" y="306" width="600" height="60" rx="4" fill="#faf3ec" fill-opacity="0.85" stroke="#c8a48a" stroke-width="1.3"/></g>
  <text x="420" y="332" text-anchor="middle" font-size="13" font-weight="bold" fill="#3d6b2f" filter="url(#rough2)">终点：所有外星人都在 1 号舱</text>
  <text x="420" y="354" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">记 T(n) = 最少移动次数，T(0) = 0</text>
</svg>
