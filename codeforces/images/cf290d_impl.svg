<svg xmlns="http://www.w3.org/2000/svg" width="700" height="240" viewBox="0 0 700 240"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="475"/>
    <feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></defs>
  <rect width="700" height="240" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">290D 实现要点</text>
  <path d="M 210 40 Q 350 46 490 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="60" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="12.5" fill="#22314a" filter="url(#rough2)">先读字符串，再读 n（注意顺序，n 在第二行）。</text>
  <text x="76" y="104" font-size="12.5" fill="#22314a" filter="url(#rough2)">逐字符：idx = 字母序号（大小写同值）；idx ≤ n ? 大写 : 小写。</text>
  <g filter="url(#rough2)"><rect x="60" y="130" width="580" height="60" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="154" font-size="12.5" fill="#2f5223" filter="url(#rough2)">样例：n=14 ⇒ i/l/l/F/A 变大写，p/r/o 变小写 ⇒ "AprILFooL"</text>
  <text x="76" y="176" font-size="12.5" fill="#2f5223" filter="url(#rough2)">复杂度 O(|s|)，|s| ≤ 50。</text>
  <g filter="url(#rough2)"><rect x="60" y="202" width="580" height="30" rx="6" fill="#fbeeee" stroke="#b85450" stroke-width="1.2"/></g>
  <text x="76" y="222" font-size="12" fill="#8a3a36" filter="url(#rough2)">易错：只改大写或只改小写都不对；两方向都要归一。</text>
</svg>
