<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="603"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="c2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="720" height="380" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每个连通块：枚举根的一个候选值，然后整块推导、校验</text>
  <path d="M 110 40 Q 360 46 610 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 图：3 个点两条边 -->
  <circle cx="130" cy="110" r="22" fill="#fdf0ef" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="130" y="115" text-anchor="middle" font-size="12" font-weight="bold" fill="#8c3a37" filter="url(#rough2)">1</text>
  <circle cx="290" cy="110" r="22" fill="#eef3f8" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="115" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a68" filter="url(#rough2)">2</text>
  <circle cx="290" cy="230" r="22" fill="#eef3f8" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="235" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a68" filter="url(#rough2)">3</text>
  <line x1="152" y1="110" x2="268" y2="110" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="290" y1="132" x2="290" y2="208" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="210" y="100" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">(1,10)</text>
  <text x="316" y="176" font-size="10.5" fill="#446688" filter="url(#rough2)">(1,2)</text>
  <text x="130" y="150" text-anchor="middle" font-size="10.5" fill="#8c3a37" filter="url(#rough2)">根，候选 1,2,5,10</text>

  <!-- 候选枚举 -->
  <rect x="380" y="70" width="310" height="150" rx="8" fill="#eef3f8" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="396" y="94" font-size="12" font-weight="bold" fill="#2b4a68" filter="url(#rough2)">候选值 = lcm 的因子 ∩ gcd 的倍数</text>
  <text x="396" y="116" font-size="11.5" fill="#33506b" filter="url(#rough2)">根 (1) 的第一条边是 (g,l) = (1,10)，</text>
  <text x="396" y="134" font-size="11.5" fill="#33506b" filter="url(#rough2)">候选 = 10 的因子 = {1, 2, 5, 10}；</text>
  <text x="396" y="152" font-size="11.5" fill="#33506b" filter="url(#rough2)">必须是 g=1 的倍数，四个都行。</text>
  <text x="396" y="174" font-size="11.5" fill="#8c3a37" filter="url(#rough2)">为什么只需试一条边：a_root 必整除</text>
  <text x="396" y="192" font-size="11.5" fill="#8c3a37" filter="url(#rough2)">任一相邻边的 lcm，也必是 gcd 的倍数。</text>
  <text x="396" y="212" font-size="11" fill="#666" filter="url(#rough2)">（a = g·x，x | l/g ⇒ a | g·(l/g) = l）</text>

  <!-- 试值表 -->
  <rect x="60" y="268" width="630" height="96" rx="8" fill="#fdf6e6" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="292" font-size="12" font-weight="bold" fill="#6b4a10" filter="url(#rough2)">本例（对应样例 3 的组件）：</text>
  <text x="76" y="313" font-size="11.5" fill="#8a6015" filter="url(#rough2)">a₁ = 1 → a₂ = 1·10/1 = 10 → 边 (2,3) 要从 10 推出 2，10 ∤ 2 ✗</text>
  <text x="76" y="332" font-size="11.5" fill="#8a6015" filter="url(#rough2)">a₁ = 2 → a₂ = 5 → 5 ∤ 2 ✗　　a₁ = 5 → a₂ = 2 → a₃ = 2·2/2 = 1 ✓（gcd/lcm 全部吻合）</text>
  <text x="76" y="352" font-size="11.5" fill="#2f5223" filter="url(#rough2)">a₁ = 10 也能成（a₂=1,a₃=2）——答案不唯一，任选一个合法赋值即可，所以本题是特殊评测</text>
</svg>
