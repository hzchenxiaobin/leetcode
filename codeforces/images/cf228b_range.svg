<svg xmlns="http://www.w3.org/2000/svg" width="840" height="380" viewBox="0 0 840 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="380" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">有效平移范围：两表必须有交集</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">1 − n_a ≤ x ≤ n_b − 1，1 − m_a ≤ y ≤ m_b − 1</text>
  <g filter="url(#rough2)"><rect x="150" y="100" width="240" height="120" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="270" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">表 a</text>
  <text x="270" y="166" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">n_a × m_a</text>
  <g filter="url(#rough2)"><rect x="430" y="140" width="240" height="120" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="550" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">表 b</text>
  <text x="550" y="206" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">n_b × m_b</text>
  <g filter="url(#rough2)"><rect x="360" y="160" width="150" height="80" rx="4" fill="#c9e0c0" fill-opacity="0.7" stroke="#3d6b2f" stroke-width="1.3"/></g>
  <text x="435" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a20" filter="url(#rough2)">重叠</text>
  <text x="435" y="220" text-anchor="middle" font-size="10.5" fill="#2b4a20" filter="url(#rough2)">x, y 平移</text>
  <text x="420" y="300" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">平移超出范围时没有任何格子对齐，重叠度为 0</text>
  <text x="420" y="328" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">共 (n_a+n_b−1)(m_a+m_b−1) ≤ 99² 种平移，每种 O(n_am_a) 暴力即可</text>
</svg>
