<svg xmlns="http://www.w3.org/2000/svg" width="720" height="428" viewBox="0 0 720 428"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="428" fill="#fafafa"/>

  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两类局面：能走就赢，不能走就输</text>
  <path d="M 200 45 Q 360 52 520 45" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 左：P 局面 -->
  <rect x="30" y="58" width="320" height="290" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">P 局面：至多 1 个正数</text>

  <text x="92" y="127" text-anchor="end" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">a =</text>
  <rect x="100" y="104" width="46" height="34" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="123" y="127" text-anchor="middle" font-size="13" fill="#3c5e2e" filter="url(#rough2)">0</text>
  <rect x="156" y="104" width="46" height="34" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="179" y="127" text-anchor="middle" font-size="13" fill="#3c5e2e" filter="url(#rough2)">0</text>
  <rect x="212" y="104" width="46" height="34" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="235" y="127" text-anchor="middle" font-size="13" fill="#3c5e2e" filter="url(#rough2)">6</text>
  <rect x="268" y="104" width="46" height="34" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="291" y="127" text-anchor="middle" font-size="13" fill="#3c5e2e" filter="url(#rough2)">0</text>

  <text x="190" y="172" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">只剩一个非零位置，凑不出异或 0</text>
  <text x="190" y="196" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">⟹ 不存在任何合法 b</text>

  <rect x="62" y="220" width="256" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="190" y="251" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">轮到谁走，谁就输</text>
  <text x="190" y="306" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">例 [0,0,6,0] 与 [0,0,0,0] 都无解</text>
  <text x="190" y="330" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">因此它们是必败局面（P）</text>

  <!-- 右：N 局面 -->
  <rect x="370" y="58" width="320" height="290" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="530" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#a14340" filter="url(#rough2)">N 局面：至少 2 个正数</text>

  <text x="432" y="124" text-anchor="end" font-size="12" fill="#a14340" filter="url(#rough2)">a</text>
  <rect x="440" y="100" width="46" height="32" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="463" y="122" text-anchor="middle" font-size="13" fill="#a14340" filter="url(#rough2)">3</text>
  <rect x="496" y="100" width="46" height="32" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="519" y="122" text-anchor="middle" font-size="13" fill="#a14340" filter="url(#rough2)">5</text>
  <rect x="552" y="100" width="46" height="32" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="575" y="122" text-anchor="middle" font-size="13" fill="#a14340" filter="url(#rough2)">6</text>
  <rect x="608" y="100" width="46" height="32" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="631" y="122" text-anchor="middle" font-size="13" fill="#a14340" filter="url(#rough2)">1</text>

  <text x="432" y="162" text-anchor="end" font-size="12" fill="#a14340" filter="url(#rough2)">b</text>
  <rect x="440" y="138" width="46" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="463" y="160" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">2</text>
  <rect x="496" y="138" width="46" height="32" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="519" y="160" text-anchor="middle" font-size="13" fill="#a14340" filter="url(#rough2)">5</text>
  <rect x="552" y="138" width="46" height="32" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="575" y="160" text-anchor="middle" font-size="13" fill="#a14340" filter="url(#rough2)">6</text>
  <rect x="608" y="138" width="46" height="32" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="631" y="160" text-anchor="middle" font-size="13" fill="#a14340" filter="url(#rough2)">1</text>

  <path d="M 466 180 L 466 196" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="432" y="226" text-anchor="end" font-size="12" fill="#a14340" filter="url(#rough2)">a−b</text>
  <rect x="440" y="202" width="46" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="463" y="224" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">1</text>
  <rect x="496" y="202" width="46" height="32" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="519" y="224" text-anchor="middle" font-size="13" fill="#a14340" filter="url(#rough2)">0</text>
  <rect x="552" y="202" width="46" height="32" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="575" y="224" text-anchor="middle" font-size="13" fill="#a14340" filter="url(#rough2)">0</text>
  <rect x="608" y="202" width="46" height="32" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="631" y="224" text-anchor="middle" font-size="13" fill="#a14340" filter="url(#rough2)">0</text>

  <text x="530" y="258" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">取 S 的最高位 p，选该位为 1 的 k</text>
  <text x="530" y="280" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">令 b_k = S⊕a_k ＜ a_k，其余取满</text>
  <text x="530" y="306" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">一步就送到 P 局面 ⟹ 必胜</text>
  <text x="530" y="330" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">例：S = 3⊕5⊕6⊕1 = 1，取 k = 1</text>

  <text x="360" y="384" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#rough2)">先手只要还能动，就一步收官；棋局只走一回合</text>
  <text x="360" y="408" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">所以本题不需要 SG 函数，也不需要记忆化搜索</text>
</svg>
