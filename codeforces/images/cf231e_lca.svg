<svg xmlns="http://www.w3.org/2000/svg" width="840" height="340" viewBox="0 0 840 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="340" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">LCA + 前缀和求路径上的环节点数</text>
  <text x="420" y="56" text-anchor="middle" font-size="11.8" fill="#666666" filter="url(#rough2)">c = pre[a] + pre[b] − 2·pre[l] + w[l]</text>
  <g filter="url(#rough2)"><line x1="120" y1="250" x2="700" y2="250" stroke="#cccccc" stroke-width="1.2"/></g>
  <g filter="url(#rough2)"><circle cx="420" cy="96" r="26" fill="#f6e3c4" fill-opacity="0.9" stroke="#a0522d" stroke-width="1.6"/></g>
  <text x="420" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">l</text>
  <g filter="url(#rough2)"><circle cx="240" cy="190" r="24" fill="#d6e6f2" fill-opacity="0.9" stroke="#446688" stroke-width="1.6"/></g>
  <text x="240" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">a</text>
  <g filter="url(#rough2)"><line x1="400" y1="116" x2="240" y2="168" stroke="#888888" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><circle cx="600" cy="190" r="24" fill="#d6e6f2" fill-opacity="0.9" stroke="#446688" stroke-width="1.6"/></g>
  <text x="600" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">b</text>
  <g filter="url(#rough2)"><line x1="440" y1="116" x2="600" y2="168" stroke="#888888" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><path d="M 240 214 Q 420 280 600 214" fill="none" stroke="#a0522d" stroke-width="1.5" stroke-dasharray="5 3" stroke-linejoin="round"/></g>
  <text x="420" y="300" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">w[l]=1 当 l 是环节点，pre 为根到该点的环节点数前缀和</text>
  <g filter="url(#rough2)"><rect x="180" y="314" width="480" height="20" rx="4" fill="#f7fbf4" fill-opacity="0.85" stroke="#a8c99a" stroke-width="1.3"/></g>
  <text x="420" y="330" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3d6b2f" filter="url(#rough2)">查询 O(log n)，k=10⁵ 个询问总耗时约 50 ms</text>
</svg>
