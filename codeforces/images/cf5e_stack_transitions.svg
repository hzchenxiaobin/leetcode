<svg xmlns="http://www.w3.org/2000/svg" width="780" height="380" viewBox="0 0 780 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="43"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="imp" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="780" height="380" fill="#fafafa"/>
  <text x="390" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">单调栈的三种转移：弹、并、压</text>
  <text x="390" y="56" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">栈里存 (高度, 个数)，高度从底到顶严格递减；方框里写 “高度 × 个数”</text>

  <!-- ========== 面板 1 ========== -->
  <text x="135" y="92" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8f3b37" filter="url(#rough2)">① 新来的更高：弹</text>
  <g filter="url(#rough2)">
    <rect x="60" y="250" width="86" height="34" fill="#f4f6f9" stroke="#446688" stroke-width="1.4"/>
    <text x="103" y="272" text-anchor="middle" font-size="12" fill="#2f4a66">7 × 2</text>
    <rect x="60" y="216" width="86" height="34" fill="#f4f6f9" stroke="#446688" stroke-width="1.4"/>
    <text x="103" y="238" text-anchor="middle" font-size="12" fill="#2f4a66">5 × 1</text>
    <rect x="60" y="182" width="86" height="34" fill="#f4f6f9" stroke="#446688" stroke-width="1.4"/>
    <text x="103" y="204" text-anchor="middle" font-size="12" fill="#2f4a66">3 × 1</text>
  </g>
  <text x="30" y="272" font-size="10.5" fill="#666" filter="url(#rough2)">底</text>
  <text x="30" y="204" font-size="10.5" fill="#666" filter="url(#rough2)">顶</text>
  <line x1="216" y1="199" x2="152" y2="199" stroke="#b85450" stroke-width="1.6" marker-end="url(#imp)" filter="url(#rough2)"/>
  <text x="222" y="204" font-size="12.5" font-weight="bold" fill="#8f3b37" filter="url(#rough2)">x = 6</text>
  <text x="30" y="316" font-size="11" fill="#2b2b2b" filter="url(#rough2)">3、5 都比 6 矮 ⇒ 弹出，</text>
  <text x="30" y="336" font-size="11" fill="#2b2b2b" filter="url(#rough2)">ans += 1 + 1 = 2</text>
  <text x="30" y="356" font-size="11" fill="#2b2b2b" filter="url(#rough2)">顶部 7 &gt; 6 ⇒ ans += 1，压入 6</text>

  <!-- ========== 面板 2 ========== -->
  <text x="392" y="92" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">② 与栈顶相等：并</text>
  <g filter="url(#rough2)">
    <rect x="320" y="250" width="86" height="34" fill="#f4f6f9" stroke="#446688" stroke-width="1.4"/>
    <text x="363" y="272" text-anchor="middle" font-size="12" fill="#2f4a66">8 × 1</text>
    <rect x="320" y="216" width="86" height="34" fill="#fdf3e3" stroke="#d6a040" stroke-width="1.5"/>
    <text x="363" y="238" text-anchor="middle" font-size="12" fill="#8a6015">4 × 2</text>
  </g>
  <line x1="476" y1="216" x2="412" y2="216" stroke="#b85450" stroke-width="1.6" marker-end="url(#imp)" filter="url(#rough2)"/>
  <text x="482" y="221" font-size="12.5" font-weight="bold" fill="#8f3b37" filter="url(#rough2)">x = 4</text>
  <text x="290" y="316" font-size="11" fill="#2b2b2b" filter="url(#rough2)">两座 4 都能看见新来的 4：</text>
  <text x="290" y="336" font-size="11" fill="#2b2b2b" filter="url(#rough2)">ans += 2，栈顶变成 4 × 3</text>
  <text x="290" y="356" font-size="11" fill="#2b2b2b" filter="url(#rough2)">若下面还有更大的，再 ans += 1</text>

  <!-- ========== 面板 3 ========== -->
  <text x="648" y="92" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">③ 比栈顶矮：压</text>
  <g filter="url(#rough2)">
    <rect x="580" y="250" width="86" height="34" fill="#f4f6f9" stroke="#446688" stroke-width="1.4"/>
    <text x="623" y="272" text-anchor="middle" font-size="12" fill="#2f4a66">9 × 1</text>
  </g>
  <line x1="736" y1="224" x2="676" y2="224" stroke="#b85450" stroke-width="1.6" marker-end="url(#imp)" filter="url(#rough2)"/>
  <text x="700" y="208" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8f3b37" filter="url(#rough2)">x = 5</text>
  <text x="548" y="316" font-size="11" fill="#2b2b2b" filter="url(#rough2)">只能看见最近的更高者 9：</text>
  <text x="548" y="336" font-size="11" fill="#2b2b2b" filter="url(#rough2)">ans += 1，把 5 压栈</text>

  <line x1="262" y1="78" x2="262" y2="360" stroke="#d0d0d0" stroke-width="1" stroke-dasharray="4 6" filter="url(#rough2)"/>
  <line x1="520" y1="78" x2="520" y2="360" stroke="#d0d0d0" stroke-width="1" stroke-dasharray="4 6" filter="url(#rough2)"/>
</svg>
