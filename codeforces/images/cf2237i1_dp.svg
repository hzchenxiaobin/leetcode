<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="19"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#fafafa" filter="url(#rough2)"/>

  <text x="360" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">
    DP：按深度 d 合并（max 卷积）+ 按最大层容斥
  </text>

  <circle cx="360" cy="78" r="21" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="84" text-anchor="middle" font-size="14" fill="#2b3f55" filter="url(#rough2)">v</text>
  <line x1="342" y1="96" x2="248" y2="146" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="378" y1="96" x2="472" y2="146" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>

  <circle cx="230" cy="162" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="168" text-anchor="middle" font-size="13" fill="#2f4a26" filter="url(#rough2)">u₁</text>
  <circle cx="490" cy="162" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="490" y="168" text-anchor="middle" font-size="13" fill="#2f4a26" filter="url(#rough2)">u₂</text>

  <rect x="140" y="196" width="180" height="38" rx="6" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="230" y="221" text-anchor="middle" font-size="12" fill="#2f4a26" filter="url(#rough2)">
    f[u₁][d],  d = 0 … h₁
  </text>
  <rect x="400" y="196" width="180" height="38" rx="6" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="490" y="221" text-anchor="middle" font-size="12" fill="#2f4a26" filter="url(#rough2)">
    f[u₂][d],  d = 0 … h₂
  </text>

  <rect x="124" y="258" width="472" height="118" rx="10" fill="#fff8e1"
        stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="282" text-anchor="middle" font-size="13" fill="#7a5a1e" filter="url(#rough2)">
    把 u 并入已处理的兄弟（t = 部分合并结果）：
  </text>
  <text x="360" y="308" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    f_t[max(i,j)] += f_t[i] · f_u[j]
  </text>
  <text x="360" y="334" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    c_t[j] += f_t[i] · c_u[j]    (i ≤ j)
  </text>
  <text x="360" y="360" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    c_t[i] += c_t[i] · f_u[j]    (i &gt; j)
  </text>

  <text x="360" y="390" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">
    注：c_t 的同一格会由多组 (i,j) 累加（右侧均为累加前的值）
  </text>
  <text x="360" y="410" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    f₀ = 全部染色按 d 计数 · f₁ = 强制 v=1 · f₂/f₃ = 收尾辅助态 · c* = 需容斥的染色
  </text>
  <text x="360" y="426" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">
    答案 = Σ_d ( f₀[root][d] − c₀[root][d] )
  </text>
</svg>
