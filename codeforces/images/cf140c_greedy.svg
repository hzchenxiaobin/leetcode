<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1415"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="700" height="300" fill="#fafafa"/>
  <text x="350.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每轮取剩余次数最多的三种</text>
  <path d="M 112.0 42 Q 350.0 48 588.0 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="350.0" y="286" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">直到不同半径不足三种</text>
  <rect x="90" y="100" width="90" height="100" rx="4" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="135" y="92" text-anchor="middle" font-size="11" fill="#8c2f2c" filter="url(#rough2)">x5</text>
  <text x="135" y="220" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">半径 1</text>
  <rect x="240" y="120" width="90" height="80" rx="4" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="285" y="112" text-anchor="middle" font-size="11" fill="#8c2f2c" filter="url(#rough2)">x4</text>
  <text x="285" y="220" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">半径 2</text>
  <rect x="390" y="140" width="90" height="60" rx="4" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="435" y="132" text-anchor="middle" font-size="11" fill="#8c2f2c" filter="url(#rough2)">x3</text>
  <text x="435" y="220" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">半径 3</text>
  <rect x="540" y="160" width="90" height="40" rx="4" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="585" y="152" text-anchor="middle" font-size="11" fill="#8c2f2c" filter="url(#rough2)">x2</text>
  <text x="585" y="220" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">半径 4</text>
  <text x="350" y="262" text-anchor="middle" font-size="11.5" fill="#335478" filter="url(#rough2)">每轮 1、2、3 各用一个 → 3 个雪人；剩余 1×2、2×1 不足三种</text>
</svg>
