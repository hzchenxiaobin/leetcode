<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="320" fill="#fafafa"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">E2 的判别只需要一个数：m4 与阈值</text>
  <path d="M 218.01 46 Q 380.0 52 541.99 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="80.0" y="84.0" width="600.0" height="120.0" rx="8" fill="#fafafa" stroke="#6b6b6b" stroke-width="1.0" filter="url(#rough2)"/>
  <path d="M 140.0 184.0 L 700.0 184.0" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 200.0 180.0 L 200.0 190.0" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="200.0" y="208.0" text-anchor="middle" font-size="10.5" fill="#6b6b6b" filter="url(#rough2)">0</text>
  <path d="M 400.0 180.0 L 400.0 190.0" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="400.0" y="208.0" text-anchor="middle" font-size="10.5" fill="#6b6b6b" filter="url(#rough2)">0.0095</text>
  <path d="M 560.0 180.0 L 560.0 190.0" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="560.0" y="208.0" text-anchor="middle" font-size="10.5" fill="#6b6b6b" filter="url(#rough2)">0.0167</text>
  <rect x="150.0" y="150.0" width="90.0" height="34.0" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="195.0" y="172.0" text-anchor="middle" font-size="10.6" font-weight="bold" fill="#446688" filter="url(#rough2)">圆 0.001</text>
  <rect x="500.0" y="134.0" width="130.0" height="50.0" rx="5" fill="#fff3d6" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="565.0" y="164.0" text-anchor="middle" font-size="10.6" font-weight="bold" fill="#8a6015" filter="url(#rough2)">正方形 0.0167</text>
  <path d="M 400 120 L 400 180" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="406.0" y="116.0" text-anchor="start" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">阈值 0.0095</text>
  <rect x="80.0" y="240.0" width="600.0" height="56.0" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="94.0" y="264.0" text-anchor="start" font-size="11.4" fill="#2f5b34" filter="url(#rough2)">m4 = |Σ(dx+i·dy)⁴| / A³；大于阈值判正方形，否则判圆。</text>
  <text x="94.0" y="284.0" text-anchor="start" font-size="11.4" fill="#2f5b34" filter="url(#rough2)">实测 500 个无噪图形（边长 15–120、任意旋转）全部判对。</text>
</svg>
