<svg xmlns="http://www.w3.org/2000/svg" width="660" height="500" viewBox="0 0 660 500"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="660" height="500" fill="#fafafa"/>

  <text x="330" y="28" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">算法流程（每组 O(n)）</text>
  <text x="330" y="49" text-anchor="middle" font-size="11.5" fill="#888888"
        filter="url(#rough2)">先算 B 与 s = n ⊕ k，再用 s 的二进制位决定哪些值排到 0 后面</text>

  <rect x="180" y="66" width="300" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="89" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">读入 n 与 k</text>
  <path d="M 330 102 L 330 122" stroke="#3a3a3a" stroke-width="1.7" fill="none"
        marker-end="url(#ar2)" filter="url(#rough2)"/>

  <rect x="180" y="122" width="300" height="36" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="145" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">B ← 1 ;  while (B &lt; n)  B &lt;&lt;= 1</text>
  <text x="494" y="145" text-anchor="start" font-size="9.5" fill="#888888" filter="url(#rough2)">最小的 ≥ n 的 2 的幂</text>
  <path d="M 330 158 L 330 178" stroke="#3a3a3a" stroke-width="1.7" fill="none"
        marker-end="url(#ar2)" filter="url(#rough2)"/>

  <rect x="180" y="178" width="300" height="36" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="201" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">s ← n ⊕ k   （可能需要被抵消的部分）</text>
  <path d="M 330 214 L 330 232" stroke="#3a3a3a" stroke-width="1.7" fill="none"
        marker-end="url(#ar2)" filter="url(#rough2)"/>

  <polygon points="330,232 470,262 330,292 190,262" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="330" y="268" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d20"
        filter="url(#rough2)">s &lt; B ?</text>

  <path d="M 470 262 L 506 262" stroke="#b85450" stroke-width="1.7" fill="none"
        marker-end="url(#ar2)" filter="url(#rough2)"/>
  <text x="482" y="254" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="508" y="244" width="104" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="560" y="267" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450"
        filter="url(#rough2)">输出 NO</text>

  <path d="M 330 292 L 330 316" stroke="#4a7a3a" stroke-width="1.7" fill="none"
        marker-end="url(#ar2)" filter="url(#rough2)"/>
  <text x="342" y="308" text-anchor="start" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="180" y="318" width="300" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="341" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">S ← s 的每个 1 位（取值 v = 2^j）</text>
  <text x="494" y="341" text-anchor="start" font-size="9.5" fill="#888888" filter="url(#rough2)">必有 v ≤ n − 1</text>
  <path d="M 330 354 L 330 374" stroke="#3a3a3a" stroke-width="1.7" fill="none"
        marker-end="url(#ar2)" filter="url(#rough2)"/>

  <rect x="180" y="374" width="300" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="397" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">输出「非 S 升序 , 0 , S 升序」</text>
  <path d="M 330 410 L 330 428" stroke="#3a3a3a" stroke-width="1.7" fill="none"
        marker-end="url(#ar2)" filter="url(#rough2)"/>

  <rect x="140" y="430" width="380" height="44" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="458" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688"
        filter="url(#rough2)">XOR = n ⊕ xor(S) = n ⊕ s = k ✓</text>

  <text x="330" y="492" text-anchor="middle" font-size="10.5" fill="#888888"
        filter="url(#rough2)">时间 O(Σn)、空间 O(n)：每组只开一个长度 n 的标记数组，没有任何排序</text>
</svg>
