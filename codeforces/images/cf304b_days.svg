<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="240" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">日期转天数</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">逐月累加 + 闰年补偿</text>
  <text x="150" y="95" text-anchor="start" font-size="13" fill="#2b2b2b" filter="url(#rough2)">把日期换算成"从 1900-01-01 起的天数"再相减</text>
  <text x="150" y="135" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">闰年规则：能被 4 整除且不被 100 整除，或能被 400 整除</text>
  <text x="150" y="175" text-anchor="start" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">1900 不是闰年，2000 是闰年</text>
</svg>
