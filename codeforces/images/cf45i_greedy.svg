<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="283"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="320" fill="#fafafa"/>
  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">乘积的符号由负数个数的奇偶决定</text>
  <path d="M 140 40 Q 380 46 620 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="90" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">负数个数为偶数：全部乘进去，乘积为正且绝对值最大。</text>
  <text x="60" y="122" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">负数个数为奇数：踢掉一个，乘积变正；踢掉绝对值最小的（最接近 0）损失最小。</text>
  <text x="60" y="154" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">正数乘进去只会让乘积不变或变大，所以一个不留。</text>
  <rect x="60" y="190" width="640" height="90" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="80" y="222" font-size="12" fill="#7a5a1b" filter="url(#rough2)">样例 1：正数 {1,2,3,3}、负数 {-3}；负数奇数 → 去掉 -3，输出 1 2 3 3，乘积 18。</text>
  <text x="80" y="252" font-size="12" fill="#7a5a1b" filter="url(#rough2)">样例 3：四个 -2，偶数 → 全选，乘积 16。</text>

</svg>
