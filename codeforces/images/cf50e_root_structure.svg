<svg xmlns="http://www.w3.org/2000/svg" width="740" height="440" viewBox="0 0 740 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="740" height="440" fill="#fafafa"/>
  <text x="370" y="34" font-size="20" fill="#2b2b2b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">c 与 b² 的关系决定根的数量</text>
  <line x1="90" y1="372" x2="660" y2="372" stroke="#2b2b2b" stroke-width="1.8" marker-end="url(#arrb2)" filter="url(#rough2)"/>
  <line x1="90" y1="372" x2="90" y2="86" stroke="#2b2b2b" stroke-width="1.8" marker-end="url(#arrb2)" filter="url(#rough2)"/>
  <text x="668" y="377" font-size="15" fill="#2b2b2b" text-anchor="start" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="74" y="80" font-size="15" fill="#2b2b2b" text-anchor="start" font-weight="bold" filter="url(#rough2)">c</text>
  <line x1="100" y1="372" x2="100" y2="378" stroke="#2b2b2b" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="100" y="394" font-size="11.5" fill="#44546a" text-anchor="middle" filter="url(#rough2)">1</text>
  <line x1="205" y1="372" x2="205" y2="378" stroke="#2b2b2b" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="205" y="394" font-size="11.5" fill="#44546a" text-anchor="middle" filter="url(#rough2)">2</text>
  <line x1="310" y1="372" x2="310" y2="378" stroke="#2b2b2b" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="310" y="394" font-size="11.5" fill="#44546a" text-anchor="middle" filter="url(#rough2)">3</text>
  <line x1="415" y1="372" x2="415" y2="378" stroke="#2b2b2b" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="415" y="394" font-size="11.5" fill="#44546a" text-anchor="middle" filter="url(#rough2)">4</text>
  <line x1="520" y1="372" x2="520" y2="378" stroke="#2b2b2b" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="520" y="394" font-size="11.5" fill="#44546a" text-anchor="middle" filter="url(#rough2)">5</text>
  <line x1="84" y1="324" x2="90" y2="324" stroke="#2b2b2b" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="78" y="328.0" font-size="11" fill="#44546a" text-anchor="end" filter="url(#rough2)">5</text>
  <line x1="84" y1="276" x2="90" y2="276" stroke="#2b2b2b" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="78" y="280.0" font-size="11" fill="#44546a" text-anchor="end" filter="url(#rough2)">10</text>
  <line x1="84" y1="228" x2="90" y2="228" stroke="#2b2b2b" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="78" y="232.0" font-size="11" fill="#44546a" text-anchor="end" filter="url(#rough2)">15</text>
  <line x1="84" y1="180" x2="90" y2="180" stroke="#2b2b2b" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="78" y="184.0" font-size="11" fill="#44546a" text-anchor="end" filter="url(#rough2)">20</text>
  <line x1="84" y1="132" x2="90" y2="132" stroke="#2b2b2b" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="78" y="136.0" font-size="11" fill="#44546a" text-anchor="end" filter="url(#rough2)">25</text>
  <polyline points="100,362 205,334 310,286 415,218 520,218" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <polygon points="100,372 100,362 113,360 126,357 139,354 152,350 166,347 179,343 192,338 218,329 231,323 244,318 258,312 271,306 284,299 297,293 323,278 336,271 349,263 362,254 376,246 389,237 402,228 428,209 441,199 454,188 468,178 481,167 494,155 507,144 520,132 520,372" fill="#e6f4ea" fill-opacity="0.6" stroke="none" filter="url(#rough2)"/>
  <polyline points="100,362 113,360 126,357 139,354 152,350 166,347 179,343 192,338 205,334 218,329 231,323 244,318 258,312 271,306 284,299 297,293 310,286 323,278 336,271 349,263 362,254 376,246 389,237 402,228 415,218 428,209 441,199 454,188 468,178 481,167 494,155 507,144 520,132" fill="none" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <circle cx="100" cy="362" r="4" fill="#2f5223" filter="url(#rough2)"/>
  <circle cx="205" cy="334" r="4" fill="#2f5223" filter="url(#rough2)"/>
  <circle cx="310" cy="286" r="4" fill="#2f5223" filter="url(#rough2)"/>
  <circle cx="415" cy="218" r="4" fill="#2f5223" filter="url(#rough2)"/>
  <circle cx="520" cy="132" r="4" fill="#2f5223" filter="url(#rough2)"/>
  <text x="500" y="120.0" font-size="12.5" fill="#2f5223" text-anchor="end" font-weight="bold" filter="url(#rough2)">c = b²</text>
  <line x1="90" y1="218" x2="640" y2="218" stroke="#446688" stroke-width="1.8" stroke-dasharray="7 4" filter="url(#rough2)"/>
  <text x="646" y="222.4" font-size="12" fill="#2f4a66" text-anchor="start" font-weight="bold" filter="url(#rough2)">c = m</text>
  <text x="268.0" y="266.4" font-size="12" fill="#2f5223" text-anchor="start" filter="url(#rough2)">c &lt; b² 且 c ≤ m：两个实根</text>
  <text x="226.0" y="139.68" font-size="12" fill="#8a3030" text-anchor="start" filter="url(#rough2)">c > b²：无实根</text>
  <text x="467.5" y="238.4" font-size="11.5" fill="#8a6015" text-anchor="start" filter="url(#rough2)">c = b²：重根 −b（只算 1 个）</text>
  <rect x="60" y="398" width="640" height="32" rx="8" fill="#f2f6fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="74" y="419" font-size="11.5" fill="#2f4a66" text-anchor="start" filter="url(#rough2)">对每个 b 把 c 从 1 数到 min(m, b²−1)：每格贡献 2 个根；若 m ≥ b² 再多 1 个重根 −b。</text>
</svg>
