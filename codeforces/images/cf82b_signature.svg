<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="720" height="430" fill="#fafafa"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每个数字的「签名」就是它出现的纸条编号集合</text>
  <path d="M 200 43 Q 360 49 520 43" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <rect x="40" y="66" width="300" height="150" rx="7" fill="#ffffff" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="52" y="88" text-anchor="start" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">输入纸条（n = 4，共 6 张）</text>
  <text x="56" y="110" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">#1: 2 7 4</text>
  <text x="56" y="127" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">#2: 1 7 3</text>
  <text x="56" y="144" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">#3: 5 4 2</text>
  <text x="56" y="161" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">#4: 1 3 5</text>
  <text x="56" y="178" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">#5: 3 1 2 4</text>
  <text x="56" y="195" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">#6: 5 7</text>
  <rect x="370" y="66" width="300" height="150" rx="7" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="382" y="88" text-anchor="start" font-size="11.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">数字 → 出现的纸条集合</text>
  <text x="384" y="110" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">1: {#2,#4,#5}</text>
  <text x="384" y="127" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">2: {#1,#3,#5}</text>
  <text x="384" y="144" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">3: {#2,#4,#5}</text>
  <text x="384" y="161" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">4: {#1,#3,#5}</text>
  <text x="384" y="178" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">5: {#3,#4,#6}</text>
  <text x="384" y="195" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">7: {#1,#2,#6}</text>
  <path d="M 200 220 L 200 250" stroke="#2b2b2b" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 520 220 L 520 250" stroke="#2b2b2b" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="360" y="244" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">签名相同 ⇔ 属于同一个集合</text>
  <rect x="60" y="264" width="145" height="62" rx="7" fill="#e9f4e2" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="132" y="286" text-anchor="middle" font-size="9.5" fill="#2f5223" filter="url(#rough2)">{#2,#4,#5}</text>
  <text x="132" y="310" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">集合 {1 3}</text>
  <rect x="220" y="264" width="145" height="62" rx="7" fill="#e9f4e2" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="292" y="286" text-anchor="middle" font-size="9.5" fill="#2f5223" filter="url(#rough2)">{#1,#3,#5}</text>
  <text x="292" y="310" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">集合 {2 4}</text>
  <rect x="380" y="264" width="145" height="62" rx="7" fill="#e9f4e2" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="452" y="286" text-anchor="middle" font-size="9.5" fill="#2f5223" filter="url(#rough2)">{#3,#4,#6}</text>
  <text x="452" y="310" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">集合 {5}</text>
  <rect x="540" y="264" width="145" height="62" rx="7" fill="#e9f4e2" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="612" y="286" text-anchor="middle" font-size="9.5" fill="#2f5223" filter="url(#rough2)">{#1,#2,#6}</text>
  <text x="612" y="310" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">集合 {7}</text>
  <text x="48" y="356" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">为什么签名相同就一定是同一个集合：数字 x 属于唯一集合 S，它出现在且只出现在「S 与其它集合」的</text>
  <text x="48" y="378" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">n-1 张纸条里，所以签名完全由所属集合决定；反过来签名相同必然同集合。</text>
  <text x="48" y="404" text-anchor="start" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">n = 2 时只有一张纸条，无法区分两个集合，任意非空二分都是合法答案。</text>
</svg>
