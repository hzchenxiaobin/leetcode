<svg xmlns="http://www.w3.org/2000/svg" width="700" height="400" viewBox="0 0 700 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="981"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="700" height="400" fill="#fafafa"/>
  <text x="350.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">立方体 6 个面与 24 个旋转</text>
  <path d="M 112.0 42 Q 350.0 48 588.0 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="350.0" y="386" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">答案 = (1/24) · Σ 每个旋转下不变的着色数</text>
  <path d="M 150.0 150.0 L 280.0 150.0 L 280.0 280.0 L 150.0 280.0 Z" fill="#eef5ea" fill-opacity="0.85" stroke="#5a5a5a" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 150.0 150.0 L 210.0 90.0 L 340.0 90.0 L 280.0 150.0 Z" fill="#dfe8f3" fill-opacity="0.85" stroke="#5a5a5a" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 280.0 150.0 L 340.0 90.0 L 340.0 220.0 L 280.0 280.0 Z" fill="#fbeadb" fill-opacity="0.85" stroke="#5a5a5a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="215.0" y="221.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#2f5223" filter="url(#rough2)">F</text>
  <text x="245.0" y="118.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#335478" filter="url(#rough2)">U</text>
  <text x="318.0" y="185.0" text-anchor="middle" font-size="18" font-weight="bold" fill="#8a6015" filter="url(#rough2)">R</text>
  <text x="126" y="215.0" text-anchor="middle" font-size="14" fill="#666666" filter="url(#rough2)">D</text>
  <text x="235.0" y="306.0" text-anchor="middle" font-size="14" fill="#666666" filter="url(#rough2)">L</text>
  <text x="366" y="185.0" text-anchor="middle" font-size="14" fill="#666666" filter="url(#rough2)">B</text>
  <text x="560" y="110" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">24 = 6 · 4</text>
  <text x="560" y="138" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">选一个面朝上（6）</text>
  <text x="560" y="158" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">× 绕竖轴转（4）</text>
  <rect x="430" y="190" width="240" height="96" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="550" y="214" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">不动点计数</text>
  <text x="550" y="238" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">把轮换整体涂同一种颜色</text>
  <text x="550" y="258" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">使各色用量 = 多重集</text>
  <text x="550" y="277" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">用背包 DP 求方案数</text>
  <text x="350" y="360" text-anchor="middle" font-size="12.5" fill="#2f5223" filter="url(#rough2)">BOOOOB：1·15 + 3·3 + 6·1 + 6·3 + 8·0 = 48 → 48/24 = 2</text>
</svg>
