<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="400" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="38" text-anchor="middle" font-size="18.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">48C：油箱、加油站与“下一次停车”</text>
  <path d="M 137 50 Q 380 56 623 50" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <line x1="60" y1="180" x2="720" y2="180" stroke="#2b2b2b" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="112" y1="172" x2="112" y2="188" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="112" y="206" text-anchor="middle" font-size="9.5" fill="#8a8a8a" font-weight="normal" filter="url(#rough2)">1</text>
  <line x1="164" y1="172" x2="164" y2="188" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="164" y="206" text-anchor="middle" font-size="9.5" fill="#8a8a8a" font-weight="normal" filter="url(#rough2)">2</text>
  <line x1="216" y1="172" x2="216" y2="188" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="216" y="206" text-anchor="middle" font-size="9.5" fill="#8a8a8a" font-weight="normal" filter="url(#rough2)">3</text>
  <line x1="268" y1="172" x2="268" y2="188" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="268" y="206" text-anchor="middle" font-size="9.5" fill="#8a8a8a" font-weight="normal" filter="url(#rough2)">4</text>
  <line x1="320" y1="172" x2="320" y2="188" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="320" y="206" text-anchor="middle" font-size="9.5" fill="#8a8a8a" font-weight="normal" filter="url(#rough2)">5</text>
  <line x1="372" y1="172" x2="372" y2="188" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="372" y="206" text-anchor="middle" font-size="9.5" fill="#8a8a8a" font-weight="normal" filter="url(#rough2)">6</text>
  <line x1="424" y1="172" x2="424" y2="188" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="424" y="206" text-anchor="middle" font-size="9.5" fill="#8a8a8a" font-weight="normal" filter="url(#rough2)">7</text>
  <line x1="476" y1="172" x2="476" y2="188" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="476" y="206" text-anchor="middle" font-size="9.5" fill="#8a8a8a" font-weight="normal" filter="url(#rough2)">8</text>
  <line x1="528" y1="172" x2="528" y2="188" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="528" y="206" text-anchor="middle" font-size="9.5" fill="#8a8a8a" font-weight="normal" filter="url(#rough2)">9</text>
  <line x1="580" y1="172" x2="580" y2="188" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="580" y="206" text-anchor="middle" font-size="9.5" fill="#8a8a8a" font-weight="normal" filter="url(#rough2)">10</text>
  <line x1="632" y1="172" x2="632" y2="188" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="632" y="206" text-anchor="middle" font-size="9.5" fill="#8a8a8a" font-weight="normal" filter="url(#rough2)">11</text>
  <line x1="684" y1="172" x2="684" y2="188" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="684" y="206" text-anchor="middle" font-size="9.5" fill="#8a8a8a" font-weight="normal" filter="url(#rough2)">12</text>
  <text x="60" y="228" text-anchor="start" font-size="10.5" fill="#8a8a8a" font-weight="normal" filter="url(#rough2)">第 1..12 个加油站（每 100 km 一个）</text>
  <circle cx="268" cy="180" r="6" fill="#c9801f" stroke="none" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="268" y="160" text-anchor="middle" font-size="11" fill="#c9801f" font-weight="bold" filter="url(#rough2)">停 4</text>
  <circle cx="476" cy="180" r="6" fill="#c9801f" stroke="none" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="476" y="160" text-anchor="middle" font-size="11" fill="#c9801f" font-weight="bold" filter="url(#rough2)">停 8</text>
  <circle cx="684" cy="180" r="6" fill="#c9801f" stroke="none" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="684" y="160" text-anchor="middle" font-size="11" fill="#c9801f" font-weight="bold" filter="url(#rough2)">停 12</text>
  <rect x="60" y="250" width="640" height="120" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="76" y="278" text-anchor="start" font-size="11.5" fill="#2f4a66" font-weight="normal" filter="url(#rough2)">α = 43.21：第 4 站剩 3.21 &lt; 10 ⇒ 加 α；第 8 站剩 6.42 ⇒ 加 α；……</text>
  <text x="76" y="304" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">关键“总量”写法：到第 s 站前一共加了 kα 升（初始 α + (k-1) 次加油），</text>
  <text x="76" y="330" text-anchor="start" font-size="11.5" fill="#2f5223" font-weight="bold" filter="url(#rough2)">油量 = kα − 10s；停车的充要条件是 10s ≤ kα &lt; 10(s+1)。</text>
  <text x="76" y="356" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">于是每次停车给出的约束是 α ∈ [10 s_i / i, 10 (s_i+1) / i)——一个区间！</text>
</svg>
