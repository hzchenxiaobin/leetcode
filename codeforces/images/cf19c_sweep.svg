<svg xmlns="http://www.w3.org/2000/svg" width="780" height="430" viewBox="0 0 780 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="419"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr19c" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="780" height="430" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">候选按 (x, l) 排序，指针只向右：死元素不会复活</text>

  <text x="60" y="58" font-size="11.5" fill="#555" filter="url(#rough2)">把全部重复段排好序，一次扫描即可完成"每轮重新找最短最左"的全部工作</text>

  <!-- 候选卡片 -->
  <rect x="60" y="86" width="90" height="52" rx="8" fill="#cfeacf" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="170" y="86" width="90" height="52" rx="8" fill="#f4f4f4" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <rect x="280" y="86" width="90" height="52" rx="8" fill="#f4f4f4" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <rect x="390" y="86" width="90" height="52" rx="8" fill="#f4f4f4" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <rect x="500" y="86" width="90" height="52" rx="8" fill="#cfeacf" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>

  <text x="105" y="118" text-anchor="middle" font-size="13" fill="#204a1e" filter="url(#rough2)">(x=1, l=5)</text>
  <text x="215" y="118" text-anchor="middle" font-size="13" fill="#8c3b37" filter="url(#rough2)">(x=2, l=1)</text>
  <text x="325" y="118" text-anchor="middle" font-size="13" fill="#8c3b37" filter="url(#rough2)">(x=2, l=4)</text>
  <text x="435" y="118" text-anchor="middle" font-size="13" fill="#8c3b37" filter="url(#rough2)">(x=3, l=0)</text>
  <text x="545" y="118" text-anchor="middle" font-size="13" fill="#204a1e" filter="url(#rough2)">(x=3, l=7)</text>

  <!-- 状态 -->
  <text x="105" y="160" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5223" filter="url(#rough2)">选它 ✓</text>
  <text x="105" y="176" text-anchor="middle" font-size="10" fill="#2f5223" filter="url(#rough2)">start → 6</text>

  <text x="215" y="160" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">l=1 &lt; 6 ✗</text>
  <text x="215" y="176" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">已死</text>

  <text x="325" y="160" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">l=4 &lt; 6 ✗</text>
  <text x="325" y="176" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">已死</text>

  <text x="435" y="160" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">l=0 &lt; 6 ✗</text>
  <text x="435" y="176" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">已死</text>

  <text x="545" y="160" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5223" filter="url(#rough2)">选它 ✓</text>
  <text x="545" y="176" text-anchor="middle" font-size="10" fill="#2f5223" filter="url(#rough2)">start → 10</text>

  <!-- 扫描箭头 -->
  <path d="M 60 206 L 586 206" stroke="#446688" stroke-width="1.6" fill="none"
        marker-end="url(#arr19c)" filter="url(#rough2)"/>
  <text x="320" y="224" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">指针只前进，从不回头</text>

  <!-- 分组标注 -->
  <path d="M 60 270 L 60 280 L 460 280 L 460 270" stroke="#7a8ca6" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="260" y="298" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">按 x 分桶，桶内按 l 升序</text>

  <!-- 右侧说明 -->
  <rect x="600" y="250" width="150" height="120" rx="9" fill="#eef4ff" stroke="#446688"
        stroke-width="1.3" filter="url(#rough2)"/>
  <text x="614" y="274" font-size="10.5" font-weight="bold" fill="#23405c" filter="url(#rough2)">为什么可以不回头</text>
  <text x="614" y="296" font-size="10" fill="#446688" filter="url(#rough2)">start 只增不减</text>
  <text x="614" y="314" font-size="10" fill="#446688" filter="url(#rough2)">⇒ 跳过的候选</text>
  <text x="614" y="332" font-size="10" fill="#446688" filter="url(#rough2)">永远不可能再活</text>
  <text x="614" y="352" font-size="10" fill="#8c3b37" filter="url(#rough2)">递归集合只减不增</text>

  <!-- 底部结论 -->
  <rect x="40" y="318" width="540" height="52" rx="9" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.3" filter="url(#rough2)"/>
  <text x="56" y="342" font-size="11" fill="#8a6015" filter="url(#rough2)">同一个 x 里可以连续取多个 l：取走 (1,5) 后 start=6，若还有 (1,9) 就继续取，直到桶内没有 ≥start 的 l。</text>
  <text x="56" y="360" font-size="11" fill="#8a6015" filter="url(#rough2)">x 只会越来越大（存活集合缩小），所以桶从小到大扫一遍就够，不会漏掉更短的重复段。</text>

  <text x="40" y="392" font-size="11" fill="#666" filter="url(#rough2)">交换论证的核心：把"每轮重扫"换成"指针一路向右"，差别只是不再重复检查已经死亡的候选，而死亡是永久的。</text>
  <text x="40" y="412" font-size="11" fill="#666" filter="url(#rough2)">因此两种执行方式选出的元素序列完全相同 —— 这正是第 4 节引理 5。</text>
</svg>
