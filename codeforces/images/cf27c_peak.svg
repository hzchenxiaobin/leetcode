<svg xmlns="http://www.w3.org/2000/svg" width="780" height="340" viewBox="0 0 780 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="211"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="780" height="340" fill="#fafafa"/>
  <text x="390" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">长度 3 非有序 = 尖峰 a[i] &lt; a[j] &gt; a[k] 或谷底 a[i] &gt; a[j] &lt; a[k]</text>
  <path d="M 80 40 Q 390 46 700 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <polyline points="110,230 220,130 330,230" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <polyline points="450,230 560,130 670,230" fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="110" cy="230" r="7" fill="#ffffff" stroke="#555555" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="220" cy="130" r="7" fill="#ffffff" stroke="#555555" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="330" cy="230" r="7" fill="#ffffff" stroke="#555555" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="450" cy="230" r="7" fill="#ffffff" stroke="#555555" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="560" cy="130" r="7" fill="#ffffff" stroke="#555555" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="670" cy="230" r="7" fill="#ffffff" stroke="#555555" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="110" y="262" text-anchor="middle" font-size="11" fill="#8a2b28" filter="url(#rough2)">i</text>
  <text x="220" y="110" text-anchor="middle" font-size="11" fill="#8a2b28" filter="url(#rough2)">j（尖峰）</text>
  <text x="330" y="262" text-anchor="middle" font-size="11" fill="#8a2b28" filter="url(#rough2)">k</text>
  <text x="450" y="262" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">i</text>
  <text x="560" y="110" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">j（谷底）</text>
  <text x="670" y="262" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">k</text>
  <text x="80" y="310" font-size="11.5" fill="#555555" filter="url(#rough2)">只要中间的 a[j] 与两侧的符号相反（都小于它或都大于它），这 3 个下标就构成非有序子序列。</text>

</svg>
