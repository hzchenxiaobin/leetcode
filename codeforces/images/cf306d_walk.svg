<svg xmlns="http://www.w3.org/2000/svg" width="880" height="220" viewBox="0 0 880 220"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="220" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按解出的边长依次走，就得到顶点坐标</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">方向 θ_k = 2πk/n 固定，先走再记点</text>
  <text x="150" y="100" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">x_{k+1} = x_k + l_k·cos θ_k，y_{k+1} = y_k + l_k·sin θ_k</text>
  <text x="150" y="140" text-anchor="start" font-size="12" fill="#2f4a66" filter="url(#rough2)">边长 ≤ 1000、n ≤ 100 ⇒ 坐标绝对值 ≤ 1e5，远小于 1e6</text>
</svg>
