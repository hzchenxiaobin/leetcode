<svg xmlns="http://www.w3.org/2000/svg" width="880" height="436" viewBox="0 0 880 436"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="85"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="436" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">一次错误之后，方向就固定了</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">样例 1：查询 1，正确路径 8→4→2；在 8 或 4 犯错</text>
  <g filter="url(#rough2)"><circle cx="440" cy="110" r="20" fill="#f6e3c4" fill-opacity="0.85" stroke="#778899" stroke-width="1.4"/></g>
  <text x="440" y="115" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">8</text>
  <g filter="url(#rough2)"><circle cx="300" cy="200" r="20" fill="#cfe0f5" fill-opacity="0.85" stroke="#778899" stroke-width="1.4"/></g>
  <text x="300" y="205" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><circle cx="580" cy="200" r="20" fill="#cfe0f5" fill-opacity="0.85" stroke="#778899" stroke-width="1.4"/></g>
  <text x="580" y="205" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">12</text>
  <g filter="url(#rough2)"><circle cx="210" cy="290" r="20" fill="#d7ecd0" fill-opacity="0.85" stroke="#778899" stroke-width="1.4"/></g>
  <text x="210" y="295" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><circle cx="380" cy="290" r="20" fill="#d7ecd0" fill-opacity="0.85" stroke="#778899" stroke-width="1.4"/></g>
  <text x="380" y="295" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">6</text>
  <g filter="url(#rough2)"><circle cx="520" cy="290" r="20" fill="#d7ecd0" fill-opacity="0.85" stroke="#778899" stroke-width="1.4"/></g>
  <text x="520" y="295" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">10</text>
  <g filter="url(#rough2)"><circle cx="660" cy="290" r="20" fill="#d7ecd0" fill-opacity="0.85" stroke="#778899" stroke-width="1.4"/></g>
  <text x="660" y="295" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">14</text>
  <g filter="url(#rough2)"><line x1="440" y1="110" x2="300" y2="200" stroke="#888888" stroke-width="1.3"/></g>
  <g filter="url(#rough2)"><line x1="440" y1="110" x2="580" y2="200" stroke="#888888" stroke-width="1.3"/></g>
  <g filter="url(#rough2)"><line x1="300" y1="200" x2="210" y2="290" stroke="#888888" stroke-width="1.3"/></g>
  <g filter="url(#rough2)"><line x1="300" y1="200" x2="380" y2="290" stroke="#888888" stroke-width="1.3"/></g>
  <g filter="url(#rough2)"><line x1="580" y1="200" x2="520" y2="290" stroke="#888888" stroke-width="1.3"/></g>
  <g filter="url(#rough2)"><line x1="580" y1="200" x2="660" y2="290" stroke="#888888" stroke-width="1.3"/></g>
  <g filter="url(#rough2)"><path d="M 430 126 L 312 190" fill="none" stroke="#4a7a3a" stroke-width="2.6" marker-end="url(#arrg)"/></g>
  <g filter="url(#rough2)"><path d="M 292 216 L 222 276" fill="none" stroke="#4a7a3a" stroke-width="2.6" marker-end="url(#arrg)"/></g>
  <g filter="url(#rough2)"><path d="M 456 124 L 572 192" fill="none" stroke="#b85450" stroke-width="2.4" marker-end="url(#arrg)" stroke-dasharray="6 4"/></g>
  <g filter="url(#rough2)"><path d="M 306 216 L 372 278" fill="none" stroke="#446688" stroke-width="2.4" marker-end="url(#arrb)" stroke-dasharray="6 4"/></g>
  <text x="600" y="150" text-anchor="start" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">在 8 犯错 → 去 12</text>
  <text x="596" y="168" text-anchor="start" font-size="11" fill="#8a2b28" filter="url(#rough2)">1 &lt; 12 ⇒ 一路向左 → 叶子 10</text>
  <text x="352" y="254" text-anchor="end" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">在 4 犯错 → 去 6</text>
  <text x="352" y="236" text-anchor="end" font-size="11" fill="#2f4a66" filter="url(#rough2)">6 是叶子 → 结果 6</text>
  <text x="440" y="388" text-anchor="middle" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">两个可能的搜索结果：6 与 10（各一次），期望 = (6+10)/2 = 8</text>
  <text x="440" y="412" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">关键：错走到右子树时，查询键比该子树所有键都小 → 之后永远向左 → 结果就是该子树的最小键</text>
</svg>
