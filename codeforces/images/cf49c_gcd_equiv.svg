<svg xmlns="http://www.w3.org/2000/svg" width="760" height="362" viewBox="0 0 760 362"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c9801f"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a8524a"/>
    </marker>
  </defs>
  <rect width="760" height="362" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">「i 被计入」等价于什么？</text>
  <rect x="60.0" y="62.0" width="180.0" height="56.0" rx="8" fill="#f7f9fc" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150.0" y="96.0" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">位置 j</text>
  <rect x="60.0" y="152.0" width="180.0" height="56.0" rx="8" fill="#f4f9f2" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150.0" y="186.0" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">卷号 p(j)</text>
  <rect x="420.0" y="106.0" width="220.0" height="62.0" rx="8" fill="#fdf3e3" stroke="#c9801f" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="530.0" y="130.0" text-anchor="middle" font-size="15" fill="#c9801f" font-weight="bold" filter="url(#rough2)">因子 i（i ≥ 2）</text>
  <text x="530.0" y="152.0" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">同时整除 j 与 p(j)</text>
  <path d="M 244.0 94.0 L 414.0 122.0" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330.0" y="96.0" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">i | j</text>
  <path d="M 244.0 180.0 L 414.0 152.0" stroke="#4a7a3a" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330.0" y="200.0" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">i | p(j)</text>
  <rect x="40.0" y="236.0" width="680.0" height="44.0" rx="8" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.5" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="56.0" y="264.0" text-anchor="start" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">i ≥ 2 被计入 ⟺ 存在 j 使 i | gcd(j, p(j)) ⟺ 存在 j 使 gcd(j, p(j)) &gt; 1</text>
  <text x="56.0" y="306.0" text-anchor="start" font-size="13" fill="#2b2b2b" filter="url(#rough2)">而 i = 1 永远被计入（1 整除一切），所以任何排列的因数个数都 ≥ 1。</text>
  <text x="56.0" y="334.0" text-anchor="start" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">想取到最小值 1，只需让每个位置都满足 gcd(j, p(j)) = 1。</text>
</svg>
