<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="505"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="300" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">每个质因子记录「当前占用者」</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">打开 i 时查它的不同质因子；关闭时清除</text>
  <text x="90" y="126" text-anchor="start" font-size="11.5" fill="#666666" filter="url(#rough2)">质因子</text>
  <g filter="url(#rough2)"><rect x="220" y="100" width="120" height="40" rx="4" fill="#cfe0f5" fill-opacity="0.6" stroke="#446688" stroke-width="1.4"/></g>
  <text x="280" y="127" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="370" y="100" width="120" height="40" rx="4" fill="#cfe0f5" fill-opacity="0.6" stroke="#446688" stroke-width="1.4"/></g>
  <text x="430" y="127" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="520" y="100" width="120" height="40" rx="4" fill="#cfe0f5" fill-opacity="0.6" stroke="#446688" stroke-width="1.4"/></g>
  <text x="580" y="127" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">5</text>
  <g filter="url(#rough2)"><rect x="670" y="100" width="120" height="40" rx="4" fill="#cfe0f5" fill-opacity="0.6" stroke="#446688" stroke-width="1.4"/></g>
  <text x="730" y="127" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="90" y="182" text-anchor="start" font-size="11.5" fill="#666666" filter="url(#rough2)">占用者</text>
  <g filter="url(#rough2)"><rect x="220" y="156" width="120" height="40" rx="4" fill="#cfe0f5" fill-opacity="0.6" stroke="#446688" stroke-width="1.4"/></g>
  <text x="280" y="183" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">6</text>
  <g filter="url(#rough2)"><rect x="370" y="156" width="120" height="40" rx="4" fill="#ffffff" fill-opacity="0.6" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="430" y="183" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">-1</text>
  <g filter="url(#rough2)"><rect x="520" y="156" width="120" height="40" rx="4" fill="#cfe0f5" fill-opacity="0.6" stroke="#446688" stroke-width="1.4"/></g>
  <text x="580" y="183" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">5</text>
  <g filter="url(#rough2)"><rect x="670" y="156" width="120" height="40" rx="4" fill="#ffffff" fill-opacity="0.6" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="730" y="183" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">-1</text>
  <text x="450" y="232" text-anchor="middle" font-size="12" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">要打开 10 = 2·5：2 被 6 占用 ⇒ Conflict with 6</text>
  <text x="450" y="264" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">只用质因子（不含幂），故 4 只登记 2 一次</text>
</svg>
