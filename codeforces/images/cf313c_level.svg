<svg xmlns="http://www.w3.org/2000/svg" width="700" height="270" viewBox="0 0 700 270"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="1513"/>
    <feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></defs>
  <rect width="700" height="270" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">美 = 每层"块最大值"之和 ⇒ 每层都要放最大的那批</text>
  <path d="M 120 40 Q 350 46 580 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="86" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="12.5" fill="#22314a" filter="url(#rough2)">递归树第 k 层有 4^k 个块（k = 0..n），美 = 所有块最大值的总和。</text>
  <text x="76" y="106" font-size="12.5" fill="#22314a" filter="url(#rough2)">块是嵌套的 ⇒ 同一个元素可以同时当多层（外层）的最大值，会被重复计入。</text>
  <text x="76" y="130" font-size="12.5" fill="#22314a" filter="url(#rough2)">要最大化：第 k 层放"最大的 4^k 个元素"到各块的最大值位置 ✓</text>
  <g filter="url(#rough2)"><rect x="60" y="152" width="580" height="66" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="176" font-size="12.5" fill="#2f5223" filter="url(#rough2)">⇒ 答案 = Σ_{k=0}^{n} (前缀和[4^k])，即排序后取前 1、前 4、前 16 … 的和。</text>
  <text x="76" y="200" font-size="12.5" fill="#2f5223" filter="url(#rough2)">样例 2×2、元素 1..4：4 + (4+3+2+1) = 14 ✓</text>
  <g filter="url(#rough2)"><rect x="60" y="226" width="580" height="36" rx="8" fill="#fbeeee" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="76" y="248" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">易错：不是"依次切分相邻段"，而是"每层都从最大的开始取前 4^k 个"。</text>
</svg>
