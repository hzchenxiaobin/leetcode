<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="340" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">B：框宽 = 最宽行 + 2，再用余量的奇偶分配空格</text>
  <path d="M 120 42 Q 380 48 640 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="380" y="60" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">diff = W - len(行) ≥ 0，W 是所有行长度的最大值</text>

  <rect x="44" y="80" width="214" height="62" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="104" font-size="12" fill="#2f4a66" filter="url(#rough2)">W = max(len(每行))</text>
  <text x="56" y="128" font-size="12" fill="#2f4a66" filter="url(#rough2)">diff = W - len(行)</text>

  <line x1="264" y1="111" x2="294" y2="111" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <rect x="300" y="80" width="146" height="62" rx="8" fill="#fff3cd" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="373" y="118" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">diff 是偶数？</text>

  <line x1="452" y1="106" x2="494" y2="106" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="473" y="98" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">是</text>

  <rect x="500" y="80" width="212" height="62" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="512" y="106" font-size="12.5" fill="#2f5223" filter="url(#rough2)">左 = 右 = diff / 2</text>
  <text x="512" y="128" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">唯一选择，不碰开关</text>

  <path d="M 373 144 L 373 184 L 492 184" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="380" y="172" font-size="11" fill="#446688" filter="url(#rough2)">否</text>

  <rect x="500" y="158" width="212" height="62" rx="8" fill="#fdeceb" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="512" y="184" font-size="12.5" fill="#8c3a36" filter="url(#rough2)">两候选：⌊diff/2⌋ / ⌈diff/2⌉</text>
  <text x="512" y="206" font-size="11.5" fill="#8c3a36" filter="url(#rough2)">由开关 flag 决定用哪个</text>

  <text x="44" y="188" font-size="12" fill="#2b2b2b" filter="url(#rough2)">开关初值是「靠左」：</text>
  <text x="44" y="212" font-size="12" fill="#2b2b2b" filter="url(#rough2)">左取 ⌊diff/2⌋，多的一格放右边；</text>
  <text x="44" y="236" font-size="12" fill="#2b2b2b" filter="url(#rough2)">每处理一个奇数行就翻转一次。</text>

  <rect x="44" y="262" width="132" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="110" y="289" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">#1 靠左</text>
  <line x1="180" y1="284" x2="202" y2="284" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="206" y="262" width="132" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="272" y="289" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">#2 靠右</text>
  <line x1="342" y1="284" x2="364" y2="284" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="368" y="262" width="132" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="434" y="289" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">#3 靠左</text>
  <text x="514" y="289" font-size="11.5" fill="#555" filter="url(#rough2)">…… 如此交替</text>
</svg>
