<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="460" fill="#fafafa" filter="url(#rough2)"/>
  <text x="330" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">两个官方样例的分组演算：一组合法、一组非法</text>

  <!-- ===== 样例 2：合法 ===== -->
  <text x="34" y="54" font-size="13" fill="#446688" filter="url(#rough2)">样例 2（n = 5）：b = 0 4 0 4 14 → 合法，答案 2 5 2 5 6</text>
  <rect x="30" y="62" width="600" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="72" y="83" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">组</text>
  <text x="165" y="83" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">b = s_i</text>
  <text x="248" y="83" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">人数 c_i</text>
  <text x="340" y="83" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">diff = s_{i+1} − s_i</text>
  <text x="438" y="83" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">v_i</text>
  <text x="556" y="83" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">说明 / 判定</text>

  <rect x="30" y="94" width="600" height="34" rx="4" fill="#ffffff" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="72" y="116" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="165" y="116" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <text x="248" y="116" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="340" y="116" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4 − 0 = 4</text>
  <text x="438" y="116" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">4 / 2 = 2</text>
  <text x="556" y="116" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">整除，v₀ = 2 ✓</text>

  <rect x="30" y="128" width="600" height="34" rx="4" fill="#f8f8f8" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="72" y="150" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="165" y="150" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">4</text>
  <text x="248" y="150" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="340" y="150" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">14 − 4 = 10</text>
  <text x="438" y="150" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">10 / 2 = 5</text>
  <text x="556" y="150" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">5 &gt; 2 ✓</text>

  <rect x="30" y="162" width="600" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="72" y="184" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="165" y="184" text-anchor="middle" font-size="12" fill="#c08820" filter="url(#rough2)">14</text>
  <text x="248" y="184" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="340" y="184" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">—（没有下一组）</text>
  <text x="438" y="184" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">5 + 1 = 6</text>
  <text x="556" y="184" text-anchor="middle" font-size="12" fill="#c08820" filter="url(#rough2)">最后一组，取下界</text>

  <rect x="30" y="204" width="600" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="228" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">按原下标写回：2 5 2 5 6 　（校验 shadow：0 4 0 4 14 ✔）</text>

  <!-- ===== 样例 7：非法 ===== -->
  <text x="34" y="272" font-size="13" fill="#b85450" filter="url(#rough2)">样例 7（n = 7）：b = 0 4 4 4 4 4 9 → 非法，输出 −1</text>
  <rect x="30" y="282" width="600" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="72" y="303" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">组</text>
  <text x="165" y="303" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">b = s_i</text>
  <text x="248" y="303" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">人数 c_i</text>
  <text x="340" y="303" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">diff = s_{i+1} − s_i</text>
  <text x="438" y="303" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">v_i</text>
  <text x="556" y="303" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">说明 / 判定</text>

  <rect x="30" y="314" width="600" height="34" rx="4" fill="#ffffff" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="72" y="336" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="165" y="336" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <text x="248" y="336" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="340" y="336" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4 − 0 = 4</text>
  <text x="438" y="336" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">4 / 1 = 4</text>
  <text x="556" y="336" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">整除，v₀ = 4 ✓</text>

  <rect x="30" y="348" width="600" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="72" y="370" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="165" y="370" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">4</text>
  <text x="248" y="370" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="340" y="370" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">9 − 4 = 5</text>
  <text x="438" y="370" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">5 / 5 = 1</text>
  <text x="556" y="370" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1 ≤ v₀ = 4 ✗</text>

  <rect x="30" y="390" width="600" height="38" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="414" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">组 1 的值必须严格大于组 0，与约束冲突 → 输出 −1</text>

  <text x="330" y="448" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">判定只需两件事：整除、以及组内取值严格递增</text>
</svg>
