  <rect x="430" y="156" width="36" height="36" fill="#3d3d3d" stroke="#9a9a9a" stroke-width="0.9" filter="url(#rough2)"/>
  <rect x="466" y="156" width="36" height="36" fill="#3d3d3d" stroke="#9a9a9a" stroke-width="0.9" filter="url(#rough2)"/>
  <rect x="502" y="156" width="36" height="36" fill="#3d3d3d" stroke="#9a9a9a" stroke-width="0.9" filter="url(#rough2)"/>
