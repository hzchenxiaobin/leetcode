  <rect x="431" y="121" width="34" height="142" rx="0" fill="none" stroke="#446688" stroke-width="2.4" filter="url(#rough2)"/>
  <rect x="467" y="121" width="34" height="142" rx="0" fill="none" stroke="#446688" stroke-width="2.4" filter="url(#rough2)"/>
  <rect x="503" y="121" width="34" height="142" rx="0" fill="none" stroke="#446688" stroke-width="2.4" filter="url(#rough2)"/>
  <rect x="539" y="121" width="34" height="142" rx="0" fill="none" stroke="#446688" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="502" y="110" text-anchor="middle" font-size="13" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">于是 4 列全涂 → 整块全黑</text>
  <text x="502" y="300" text-anchor="middle" font-size="12.5" fill="#b6483f" font-weight="normal" filter="url(#rough2)">和「棋盘还有白格」矛盾</text>
  <path d="M 236 190 L 396 190" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="316" y="180" text-anchor="middle" font-size="12" fill="#2f4a66" font-weight="normal" filter="url(#rough2)">列全被涂</text>

  <text x="60" y="348" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">某行全黑却没涂 → 该行 8 个黑格只能由所在列刷出 → 8 列全涂 → 棋盘全黑。</text>
  <text x="60" y="376" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">这与「不是全黑棋盘」矛盾，所以非全黑时每个全黑行都必须涂；列同理。</text>
  <text x="60" y="406" text-anchor="start" font-size="12.5" fill="#2f5223" font-weight="bold" filter="url(#rough2)">下界 = r + c，而按 r 行 + c 列去涂恰好能得到目标棋盘，故最优。</text>
</svg>
