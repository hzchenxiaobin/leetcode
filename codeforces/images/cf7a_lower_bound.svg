  <rect x="71" y="157" width="142" height="34" rx="0" fill="none" stroke="#c9801f" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="142" y="110" text-anchor="middle" font-size="13" fill="#a8641a" font-weight="bold" filter="url(#rough2)">假设第 1 行全黑却没有涂它</text>
  <text x="142" y="300" text-anchor="middle" font-size="12.5" fill="#555" font-weight="normal" filter="url(#rough2)">第 1 行的 4 个黑格，只能靠列刷出来</text>
  <rect x="430" y="120" width="36" height="36" fill="#3d3d3d" stroke="#9a9a9a" stroke-width="0.9" filter="url(#rough2)"/>
  <rect x="466" y="120" width="36" height="36" fill="#3d3d3d" stroke="#9a9a9a" stroke-width="0.9" filter="url(#rough2)"/>
  <rect x="502" y="120" width="36" height="36" fill="#3d3d3d" stroke="#9a9a9a" stroke-width="0.9" filter="url(#rough2)"/>
