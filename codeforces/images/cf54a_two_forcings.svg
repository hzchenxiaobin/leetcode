<svg xmlns="http://www.w3.org/2000/svg" width="740" height="400" viewBox="0 0 740 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="740" height="400" fill="#fafafa"/>
  <text x="370.0" y="36" font-size="20" fill="#2b2b2b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">只会被两种事件强制：假日 / 间隔已满 K 天</text>
  <path d="M 133 46 Q 370 52 607 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="84" font-size="13" fill="#44546a" text-anchor="start" filter="url(#rough2)">样例 1：N = 5，K = 2，假日 = {3}，上一次礼物在第 0 天</text>
  <text x="138.0" y="108" font-size="13" fill="#2b2b2b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="90" y="120" width="96" height="46" rx="6" fill="#ffffff" stroke="#9aa7b4" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="234.0" y="108" font-size="13" fill="#2b2b2b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="186" y="120" width="96" height="46" rx="6" fill="#ffffff" stroke="#9aa7b4" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="330.0" y="108" font-size="13" fill="#2b2b2b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="282" y="120" width="96" height="46" rx="6" fill="#ffffff" stroke="#9aa7b4" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="426.0" y="108" font-size="13" fill="#2b2b2b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="378" y="120" width="96" height="46" rx="6" fill="#ffffff" stroke="#9aa7b4" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="522.0" y="108" font-size="13" fill="#2b2b2b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="474" y="120" width="96" height="46" rx="6" fill="#ffffff" stroke="#9aa7b4" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="60" y="148" font-size="12" fill="#2b2b2b" text-anchor="end" filter="url(#rough2)">第 d 天</text>
  <rect x="282" y="120" width="96" height="46" rx="6" fill="#fff3e0" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330.0" y="148.0" font-size="13" fill="#8a6015" text-anchor="middle" font-weight="bold" filter="url(#rough2)">假日</text>
  <rect x="186" y="120" width="96" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="234.0" y="148.0" font-size="12.5" fill="#2f5223" text-anchor="middle" font-weight="bold" filter="url(#rough2)">给礼物</text>
  <rect x="474" y="120" width="96" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="522.0" y="148.0" font-size="12.5" fill="#2f5223" text-anchor="middle" font-weight="bold" filter="url(#rough2)">给礼物</text>
  <text x="138.0" y="148.0" font-size="12.5" fill="#7a7a7a" text-anchor="middle" filter="url(#rough2)">不给</text>
  <text x="426.0" y="148.0" font-size="12.5" fill="#7a7a7a" text-anchor="middle" filter="url(#rough2)">不给</text>
  <text x="330.0" y="194" font-size="13" fill="#2f5223" text-anchor="middle" font-weight="bold" filter="url(#rough2)">答案 = 3 份（第 2、3、5 天）</text>
  <rect x="60" y="246" width="620" height="60" rx="10" fill="#f2f6fb" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="78" y="272" font-size="12.5" fill="#2f4a66" text-anchor="start" filter="url(#rough2)">规则 1：假日一定给  →  第 3 天给</text>
  <text x="78" y="294" font-size="12.5" fill="#2f4a66" text-anchor="start" filter="url(#rough2)">规则 2：两次礼物最多隔 K 天  →  第 2 天、第 5 天是被「期限」逼出来的</text>
  <rect x="60" y="320" width="620" height="56" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="78" y="346" font-size="12.5" fill="#8a6015" text-anchor="start" filter="url(#rough2)">贪心：能拖就拖，拖到「期限」或「假日」才给 —— 推迟只会让后面的约束更松。</text>
  <text x="78" y="366" font-size="12.5" fill="#8a6015" text-anchor="start" font-weight="bold" filter="url(#rough2)">于是每天只需一次判断：holiday[d] || d - last &gt;= K</text>
</svg>
