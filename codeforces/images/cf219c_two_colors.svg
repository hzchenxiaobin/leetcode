<svg xmlns="http://www.w3.org/2000/svg" width="840" height="390" viewBox="0 0 840 390"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="390" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">k = 2：合法串只能是两种交替模式</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">s = BBB；分别数出与两种模式的差异，取较小者</text>
  <text x="150" y="126" text-anchor="end" font-size="14" font-weight="bold" fill="#555555" filter="url(#rough2)">s</text>
  <g filter="url(#rough2)"><rect x="180" y="96" width="48" height="42" rx="4" fill="#eeeeee" fill-opacity="0.95" stroke="#999999" stroke-width="1.3"/></g>
  <text x="204" y="124" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">B</text>
  <g filter="url(#rough2)"><rect x="234" y="96" width="48" height="42" rx="4" fill="#eeeeee" fill-opacity="0.95" stroke="#999999" stroke-width="1.3"/></g>
  <text x="258" y="124" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">B</text>
  <g filter="url(#rough2)"><rect x="288" y="96" width="48" height="42" rx="4" fill="#eeeeee" fill-opacity="0.95" stroke="#999999" stroke-width="1.3"/></g>
  <text x="312" y="124" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">B</text>
  <text x="150" y="204" text-anchor="end" font-size="14" font-weight="bold" fill="#a0522d" filter="url(#rough2)">ABAB…</text>
  <g filter="url(#rough2)"><rect x="180" y="174" width="48" height="42" rx="4" fill="#f6d9d7" fill-opacity="0.95" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="204" y="202" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">A</text>
  <g filter="url(#rough2)"><rect x="234" y="174" width="48" height="42" rx="4" fill="#f6d9d7" fill-opacity="0.95" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="258" y="202" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">B</text>
  <g filter="url(#rough2)"><rect x="288" y="174" width="48" height="42" rx="4" fill="#f6d9d7" fill-opacity="0.95" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="312" y="202" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">A</text>
  <text x="360" y="202" text-anchor="start" font-size="13.5" font-weight="bold" fill="#a0522d" filter="url(#rough2)">改动 2 处</text>
  <text x="150" y="282" text-anchor="end" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">BABA…</text>
  <g filter="url(#rough2)"><rect x="180" y="252" width="48" height="42" rx="4" fill="#d7ecd0" fill-opacity="0.95" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="204" y="280" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">B</text>
  <g filter="url(#rough2)"><rect x="234" y="252" width="48" height="42" rx="4" fill="#d7ecd0" fill-opacity="0.95" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="258" y="280" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">A</text>
  <g filter="url(#rough2)"><rect x="288" y="252" width="48" height="42" rx="4" fill="#d7ecd0" fill-opacity="0.95" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="312" y="280" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">B</text>
  <text x="360" y="280" text-anchor="start" font-size="13.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">改动 1 处</text>
  <text x="420" y="320" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">两种模式的差异数分别为 2 与 1 ⇒ 选 BABA… 即 BAB，答案 1</text>
  <text x="420" y="350" text-anchor="middle" font-size="12" fill="#8a4b2a" filter="url(#rough2)">k = 2 时不能"就地改成第三种颜色"，必须整体比较两种模式</text>
</svg>
