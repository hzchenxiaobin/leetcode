  <text x="46" y="314" text-anchor="start" font-size="13" fill="#7a2f2c" filter="url(#rough2)">每个 A_p 由 A_{p+1} 滚动而来：A_p = A_{p+1}[a_p … 2a_p−1] 拼接 A_{p+1}[0 … 2n−a_p]，长度仍是 2n+1</text>
