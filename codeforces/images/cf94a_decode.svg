<svg xmlns="http://www.w3.org/2000/svg" width="740" height="380" viewBox="0 0 740 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="167"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="740" height="380" fill="#fafafa"/>

  <text x="370" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1：第 1 组是 0100110010，对应数字 1</text>
  <path d="M 148 39 Q 370 45 592 39" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="40" y="62" text-anchor="start" font-size="12.5" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">数字表</text>
  <rect x="40" y="74" width="52" height="22" rx="3" fill="#ffffff" stroke="#d6d6d6" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="66" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">0</text>
  <text x="100" y="90" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">0100110000</text>
  <rect x="40" y="100" width="52" height="22" rx="3" fill="#e9f4ec" stroke="#3f6b4a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="66" y="116" text-anchor="middle" font-size="12" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">1</text>
  <text x="100" y="116" text-anchor="start" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">0100110010</text>
  <rect x="40" y="126" width="52" height="22" rx="3" fill="#ffffff" stroke="#d6d6d6" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="66" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">2</text>
  <text x="100" y="142" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">0101100000</text>
  <rect x="40" y="152" width="52" height="22" rx="3" fill="#ffffff" stroke="#d6d6d6" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="66" y="168" text-anchor="middle" font-size="12" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">3</text>
  <text x="100" y="168" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">0101100010</text>
  <rect x="40" y="178" width="52" height="22" rx="3" fill="#ffffff" stroke="#d6d6d6" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="66" y="194" text-anchor="middle" font-size="12" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">4</text>
  <text x="100" y="194" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">0101100100</text>
  <rect x="40" y="204" width="52" height="22" rx="3" fill="#ffffff" stroke="#d6d6d6" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="66" y="220" text-anchor="middle" font-size="12" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">5</text>
  <text x="100" y="220" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">0101100110</text>
  <rect x="40" y="230" width="52" height="22" rx="3" fill="#ffffff" stroke="#d6d6d6" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="66" y="246" text-anchor="middle" font-size="12" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">6</text>
  <text x="100" y="246" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">0101101000</text>
  <rect x="40" y="256" width="52" height="22" rx="3" fill="#ffffff" stroke="#d6d6d6" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="66" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">7</text>
  <text x="100" y="272" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">0101101010</text>
  <rect x="40" y="282" width="52" height="22" rx="3" fill="#ffffff" stroke="#d6d6d6" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="66" y="298" text-anchor="middle" font-size="12" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">8</text>
  <text x="100" y="298" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">0101101100</text>
  <rect x="40" y="308" width="52" height="22" rx="3" fill="#ffffff" stroke="#d6d6d6" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="66" y="324" text-anchor="middle" font-size="12" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">9</text>
  <text x="100" y="324" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">0101101110</text>
  <text x="250" y="62" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">密文的前 10 位（第 1 组）</text>
  <rect x="250" y="74" width="190" height="30" rx="8" fill="#dcebfb" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="345" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">0100110010</text>
  <line x1="444" y1="89" x2="500" y2="89" stroke="#446688" stroke-width="1.4" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="510" y="94" text-anchor="start" font-size="12.5" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">= 第 1 组 → 数字 1</text>
  <rect x="250" y="120" width="460" height="52" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="266" y="144" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">同理可解出 8 组：1 2 3 4 5 6 7 8 → 密码 12345678</text>
  <text x="266" y="164" text-anchor="start" font-size="11.5" fill="#5b5b5b" filter="url(#rough2)">（第 1 个样例的密文恰好就是按 1..8 的编码顺序拼起来的）</text>
  <rect x="40" y="196" width="670" height="70" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="220" text-anchor="start" font-size="12" fill="#8a6015" filter="url(#rough2)">第二个样例：密文第 1 组是 1001000010，它对应数字表里的第 0 行 → 密码以 0 开头（密码可以有前导 0）。</text>
  <text x="56" y="242" text-anchor="start" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">所以“8 位数字”是字符串，不要当整数读，否则前导 0 会丢。</text>
  <text x="40" y="296" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">实现要点：读入 1 行密文 + 10 行编码（都是长度固定的字符串，用 cin &gt;&gt; 或 split() 即可，</text>
  <text x="40" y="318" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">不要用 getline 之外的按行读取去和空格较劲）。O(80) 的字符串比较，秒过。</text>
</svg>
