<svg xmlns="http://www.w3.org/2000/svg" width="780" height="430" viewBox="0 0 780 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="347"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrZ" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="780" height="430" fill="#fafafa"/>

  <text x="390" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">三条鱼的走查：a₁₂ = 1，a₁₃ = a₂₃ = 0.5</text>

  <!-- 顶层 -->
  <rect x="318" y="42" width="144" height="40" rx="9" fill="#dbe7fb" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="390" y="68" text-anchor="middle" font-size="14" fill="#23405c" filter="url(#rough2)">{1,2,3}　f = 1</text>

  <!-- 三条边 -->
  <path d="M 360 82 L 190 126" stroke="#446688" stroke-width="1.6" fill="none"
        marker-end="url(#arrZ)" filter="url(#rough2)"/>
  <path d="M 390 82 L 390 126" stroke="#446688" stroke-width="1.6" fill="none"
        marker-end="url(#arrZ)" filter="url(#rough2)"/>
  <path d="M 420 82 L 592 126" stroke="#446688" stroke-width="1.6" fill="none"
        marker-end="url(#arrZ)" filter="url(#rough2)"/>

  <text x="196" y="104" font-size="10.5" fill="#446688" filter="url(#rough2)">(1,2) 1 吃 2：1/3 · 1</text>
  <text x="398" y="112" font-size="10.5" fill="#446688" filter="url(#rough2)">(1,3)(2,3) 各 1/6</text>
  <text x="500" y="104" font-size="10.5" fill="#446688" filter="url(#rough2)">(1,3) 3 吃 1：1/6</text>

  <!-- 中层 -->
  <rect x="70" y="132" width="200" height="64" rx="9" fill="#fff1e6" stroke="#b06a2c" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="154" text-anchor="middle" font-size="13" fill="#8a4a14" filter="url(#rough2)">{1,3}　f = 1/2</text>
  <text x="170" y="178" text-anchor="middle" font-size="10.5" fill="#8a4a14" filter="url(#rough2)">→ {1}: 1/4　→ {3}: 1/4</text>

  <rect x="300" y="132" width="180" height="64" rx="9" fill="#fff1e6" stroke="#b06a2c" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="390" y="154" text-anchor="middle" font-size="13" fill="#8a4a14" filter="url(#rough2)">{1,2}　f = 1/3</text>
  <text x="390" y="178" text-anchor="middle" font-size="10.5" fill="#8a4a14" filter="url(#rough2)">→ {1}: 1/3</text>

  <rect x="510" y="132" width="200" height="64" rx="9" fill="#fff1e6" stroke="#b06a2c" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="610" y="154" text-anchor="middle" font-size="13" fill="#8a4a14" filter="url(#rough2)">{2,3}　f = 1/6</text>
  <text x="610" y="178" text-anchor="middle" font-size="10.5" fill="#8a4a14" filter="url(#rough2)">→ {2}: 1/12　→ {3}: 1/12</text>

  <!-- 汇总 -->
  <path d="M 390 200 L 390 226" stroke="#446688" stroke-width="1.5" fill="none"
        marker-end="url(#arrZ)" filter="url(#rough2)"/>
  <text x="400" y="220" font-size="10.5" fill="#446688" filter="url(#rough2)">把同一终点的贡献加起来</text>

  <rect x="60" y="232" width="220" height="70" rx="9" fill="#cfeacf" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="170" y="256" text-anchor="middle" font-size="12.5" fill="#204a1e" filter="url(#rough2)">{1}：1/4 + 1/3 = 7/12</text>
  <text x="170" y="280" text-anchor="middle" font-size="12" font-weight="bold" fill="#204a1e" filter="url(#rough2)">P₁ ≈ 0.583333</text>

  <rect x="300" y="232" width="180" height="70" rx="9" fill="#cfeacf" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="390" y="256" text-anchor="middle" font-size="12.5" fill="#204a1e" filter="url(#rough2)">{2}：只有 1/12</text>
  <text x="390" y="280" text-anchor="middle" font-size="12" font-weight="bold" fill="#204a1e" filter="url(#rough2)">P₂ ≈ 0.083333</text>

  <rect x="500" y="232" width="220" height="70" rx="9" fill="#cfeacf" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="610" y="256" text-anchor="middle" font-size="12.5" fill="#204a1e" filter="url(#rough2)">{3}：1/4 + 1/12 = 1/3</text>
  <text x="610" y="280" text-anchor="middle" font-size="12" font-weight="bold" fill="#204a1e" filter="url(#rough2)">P₃ ≈ 0.333333</text>

  <!-- 校验 -->
  <rect x="60" y="322" width="660" height="44" rx="9" fill="#eef4ff" stroke="#446688"
        stroke-width="1.3" filter="url(#rough2)"/>
  <text x="76" y="348" font-size="12" fill="#23405c" filter="url(#rough2)">校验：7/12 + 1/12 + 1/3 = 1 ✓　　中间层 1/2 + 1/3 + 1/6 = 1 ✓</text>

  <text x="60" y="392" font-size="10.5" fill="#666" filter="url(#rough2)">k=3 时每对概率 1/3；k=2 时只剩一对，概率为 1。所有乘法都是"选对的概率 × 谁吃谁的概率"。</text>
  <text x="60" y="412" font-size="10.5" fill="#8c3b37" filter="url(#rough2)">注意 {1,2} 这一格的 f 是两条不同路径的和（1 吃 3、2 吃 3），这正是 DP 合并历史的地方。</text>
</svg>
