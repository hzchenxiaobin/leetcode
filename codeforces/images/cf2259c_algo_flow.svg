<svg xmlns="http://www.w3.org/2000/svg" width="780" height="480" viewBox="0 0 780 480"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="780" height="480" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：扫一遍切段，再扫一遍取最优</text>
  <path d="M 168 41 Q 390 48 612 41" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="390" y="62" text-anchor="middle" font-size="12.5" fill="#66788c" filter="url(#rough2)">整体 O(n)：不枚举端点、也不搜索替换方案</text>

  <rect x="110" y="72" width="560" height="64" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="390" y="99" text-anchor="middle" font-size="13.5" fill="#2f4a66" filter="url(#rough2)">① 收集所有固定 1 的下标 P（升序）</text>
  <text x="390" y="122" text-anchor="middle" font-size="11.5" fill="#5b7a99" filter="url(#rough2)">a_i = 1 是唯一动不了的障碍，其余位置都能填 0</text>

  <path d="M 390 138 L 390 152" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="152" width="560" height="64" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="390" y="179" text-anchor="middle" font-size="13.5" fill="#8a6015" filter="url(#rough2)">② 用 P 切段：[1,P₁]、[P₁,P₂]、…、[P_k,n]；P 为空时就是 [1,n]</text>
  <text x="390" y="202" text-anchor="middle" font-size="11.5" fill="#b08a3e" filter="url(#rough2)">相邻两个固定 1 之间不会再有固定 1 ⇒ 段内一定能填成全 0</text>

  <path d="M 390 218 L 390 232" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="232" width="560" height="64" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="390" y="259" text-anchor="middle" font-size="13.5" fill="#3c5e2e" filter="url(#rough2)">③ 每段取最左非 0 位置 l 与最右非 0 位置 r，用 r−l+1 更新最优</text>
  <text x="390" y="282" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">非 0 就是「−1 或 1」，两者都可以当端点；段内没有非 0 就跳过</text>

  <path d="M 390 298 L 390 312" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="312" width="560" height="64" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="390" y="339" text-anchor="middle" font-size="13.5" fill="#a14340" filter="url(#rough2)">④ 所有 −1 先填成 0，再把最优段的 l、r 两处置成 1</text>
  <text x="390" y="362" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">顺序不能反：先置 1 再填 0 会把刚放好的端点冲掉</text>

  <path d="M 390 378 L 390 392" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="392" width="560" height="56" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="390" y="417" text-anchor="middle" font-size="13.5" fill="#2f4a66" filter="url(#rough2)">⑤ 输出这一行的 n 个整数</text>
  <text x="390" y="438" text-anchor="middle" font-size="11.5" fill="#5b7a99" filter="url(#rough2)">多测逐组处理，Σn ≤ 2·10^5 ⇒ 总复杂度 O(Σn)</text>
</svg>
