<svg xmlns="http://www.w3.org/2000/svg" width="780" height="380" viewBox="0 0 780 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="780" height="380" fill="#fafafa"/>
  <text x="390.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">190A：每个成人最多带一个孩子免费，按“孩子怎么分”分三种情况</text>
  <path d="M 116.66000000000017 46 Q 390.0 52 663.3399999999998 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60.0" y="70.0" width="650.0" height="40.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="68.0" y="103.0" text-anchor="start" font-size="10.8" font-weight="bold" fill="#26405c" filter="url(#rough2)">情况</text>
  <text x="188.0" y="103.0" text-anchor="start" font-size="10.8" font-weight="bold" fill="#26405c" filter="url(#rough2)">最小</text>
  <text x="278.0" y="103.0" text-anchor="start" font-size="10.8" font-weight="bold" fill="#26405c" filter="url(#rough2)">最大</text>
  <text x="388.0" y="103.0" text-anchor="start" font-size="10.8" font-weight="bold" fill="#26405c" filter="url(#rough2)">说明</text>
  <path d="M 60.0 70.0 L 710.0 70.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="68.0" y="143.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">m = 0</text>
  <text x="188.0" y="143.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">n</text>
  <text x="278.0" y="143.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">n</text>
  <text x="388.0" y="143.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">每个成人各自付 1</text>
  <path d="M 60.0 110.0 L 710.0 110.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="68.0" y="183.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">0 &lt; m ≤ n</text>
  <text x="188.0" y="183.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">n</text>
  <text x="278.0" y="183.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">n+m−1</text>
  <text x="388.0" y="183.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">每人带 1 个孩子最省；全塞给一个人最贵</text>
  <path d="M 60.0 150.0 L 710.0 150.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="68.0" y="223.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">m &gt; n</text>
  <text x="188.0" y="223.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">m</text>
  <text x="278.0" y="223.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">n+m−1</text>
  <text x="388.0" y="223.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">每个成人都至少带 1 个孩子，票数=m</text>
  <path d="M 60.0 190.0 L 710.0 190.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <rect x="60.0" y="250.0" width="670.0" height="60.0" rx="9" fill="#fdf0ef" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="274.0" text-anchor="start" font-size="11.2" fill="#8a3a36" filter="url(#rough2)">n=0 且 m&gt;0 ⇒ Impossible（孩子不能单独乘车）；n=0 且 m=0 ⇒ “0 0”。</text>
  <text x="74.0" y="296.0" text-anchor="start" font-size="11.1" fill="#8a3a36" filter="url(#rough2)">样例：1 2 ⇒ 2 2；2 2 ⇒ 2 3；0 5 ⇒ Impossible。</text>
  <rect x="60.0" y="320.0" width="670.0" height="46.0" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="348.0" text-anchor="start" font-size="11.1" fill="#8a6015" filter="url(#rough2)">关键：一个成人的花费 = max(1, 他带的孩子数)，所以“集中孩子”最贵、“分散孩子”最便宜。</text>
</svg>
