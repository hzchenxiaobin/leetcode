<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="261"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="280" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">第 i 天的动物：吃 c_i × (n−i+1) 吨</text>
  <g filter="url(#rough2)">
    <rect x="60" y="58" width="600" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="76" y="87" font-size="13" fill="#2f4a66">总消耗 w_i = c_i · (n − i + 1)，与其它动物无关，可以直接相加</text>
  </g>
  <g font-size="12.5" filter="url(#rough2)">
    <text x="70" y="146" fill="#2f4a66">① 计算所有 w_i</text>
    <text x="70" y="176" fill="#2f4a66">② 升序排序</text>
    <text x="70" y="206" fill="#2f4a66">③ 依次累加，超过 X 就停</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="330" y="126" width="330" height="98" rx="9" fill="#eef4ec" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="346" y="150" font-size="12.5" fill="#2f5223">样例 1：X = 4，w = [3, 2, 1]</text>
    <text x="346" y="174" font-size="12.5" fill="#2f5223">排序后 1, 2, 3</text>
    <text x="346" y="198" font-size="12.5" fill="#2f5223">1 ≤ 4 ✓，1+2 = 3 ≤ 4 ✓</text>
    <text x="346" y="218" font-size="12.5" fill="#2f5223">3+3 = 6 &gt; 4 ✗ → 答案 2</text>
  </g>
  <text x="360" y="252" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">为什么贪心对？把大的换成小的不会让总消耗变大，所以最优解可以取最小的若干个。</text>
</svg>
