<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="780" height="400" fill="#fafafa"/>
  <text x="390.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每块木板有两种朝向（正方形只有一种）；相邻两块要求 长度 = 前一块宽度 且 类型不同</text>
  <path d="M 60 46 Q 390.0 52 740 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60.0" y="70.0" width="200.0" height="90.0" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70.0" y="94.0" text-anchor="start" font-size="11.2" font-weight="bold" fill="#446688" filter="url(#rough2)">类型 1：a×b</text>
  <rect x="80.0" y="106.0" width="70.0" height="40.0" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="115.0" y="131.0" text-anchor="middle" font-size="10.6" fill="#26405c" filter="url(#rough2)">len a</text>
  <rect x="160.0" y="106.0" width="40.0" height="40.0" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="180.0" y="131.0" text-anchor="middle" font-size="10.6" fill="#26405c" filter="url(#rough2)">b</text>
  <text x="80.0" y="168.0" text-anchor="start" font-size="10.4" fill="#6b6b6b" filter="url(#rough2)">→ 两个状态 (a,b) 与 (b,a)</text>
  <rect x="320.0" y="70.0" width="200.0" height="90.0" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="330.0" y="94.0" text-anchor="start" font-size="11.2" font-weight="bold" fill="#446688" filter="url(#rough2)">类型 2：a×a（正方形）</text>
  <rect x="340.0" y="108.0" width="44.0" height="44.0" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="362.0" y="134.0" text-anchor="middle" font-size="10.6" fill="#26405c" filter="url(#rough2)">a</text>
  <text x="340.0" y="168.0" text-anchor="start" font-size="10.4" fill="#6b6b6b" filter="url(#rough2)">→ 只有一个状态（不能转）</text>
  <rect x="60.0" y="196.0" width="660.0" height="60.0" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="220.0" text-anchor="start" font-size="11.2" fill="#8a6015" filter="url(#rough2)">状态 s =（长度 len[s], 宽度 wid[s], 类型 ty[s]）。下一块 s′ 合法 ⇔ len[s′] = wid[s] 且 ty[s′] ≠ ty[s]。</text>
  <text x="74.0" y="242.0" text-anchor="start" font-size="11.2" fill="#8a6015" filter="url(#rough2)">于是「能接上」只与上一块的宽度和类型有关，可以按长度做 DP。</text>
  <rect x="60.0" y="272.0" width="660.0" height="60.0" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="296.0" text-anchor="start" font-size="11.2" fill="#2f5b34" filter="url(#rough2)">样例 1：类型 (1,2) 的朝向 (1,2) 后面接类型 2 的 (2,3)，总长 3；再加上单块 (3,2)，共 2 种。</text>
  <text x="74.0" y="318.0" text-anchor="start" font-size="11.0" fill="#6b6b6b" filter="url(#rough2)">两个朝向算不同方案（题目按 (类型, 朝向) 序列区分）。</text>
</svg>
