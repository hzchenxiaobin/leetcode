<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="720" height="380" fill="#fafafa"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">前缀异或让「一段连续堆」的异或 O(1)</text>
  <path d="M 200 43 Q 360 49 520 43" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <rect x="60" y="70" width="600" height="60" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="76" y="96" text-anchor="start" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">拆出的堆是 a, a−1, …, a−k+1（连续一段下标）</text>
  <text x="76" y="118" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">它们的 SG 异或 = px[a] xor px[a−k]，px 是 g 的前缀异或</text>
  <rect x="90" y="170" width="42" height="40" rx="4" fill="#ffffff" stroke="#777777" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="111" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="111" y="228" text-anchor="middle" font-size="9" fill="#777777" filter="url(#rough2)">g[0]</text>
  <rect x="136" y="170" width="42" height="40" rx="4" fill="#ffffff" stroke="#777777" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="157" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="157" y="228" text-anchor="middle" font-size="9" fill="#777777" filter="url(#rough2)">g[1]</text>
  <rect x="182" y="170" width="42" height="40" rx="4" fill="#ffffff" stroke="#777777" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="203" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="203" y="228" text-anchor="middle" font-size="9" fill="#777777" filter="url(#rough2)">g[2]</text>
  <rect x="228" y="170" width="42" height="40" rx="4" fill="#ffffff" stroke="#777777" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="249" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="249" y="228" text-anchor="middle" font-size="9" fill="#777777" filter="url(#rough2)">g[3]</text>
  <rect x="274" y="170" width="42" height="40" rx="4" fill="#ffffff" stroke="#777777" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="295" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="295" y="228" text-anchor="middle" font-size="9" fill="#777777" filter="url(#rough2)">g[4]</text>
  <rect x="320" y="170" width="42" height="40" rx="4" fill="#ffffff" stroke="#777777" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="341" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="341" y="228" text-anchor="middle" font-size="9" fill="#777777" filter="url(#rough2)">g[5]</text>
  <rect x="366" y="170" width="42" height="40" rx="4" fill="#ffffff" stroke="#777777" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="387" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="387" y="228" text-anchor="middle" font-size="9" fill="#777777" filter="url(#rough2)">g[6]</text>
  <rect x="412" y="170" width="42" height="40" rx="4" fill="#ffffff" stroke="#777777" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="433" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="433" y="228" text-anchor="middle" font-size="9" fill="#777777" filter="url(#rough2)">g[7]</text>
  <rect x="458" y="170" width="42" height="40" rx="4" fill="#ffffff" stroke="#777777" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="479" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="479" y="228" text-anchor="middle" font-size="9" fill="#777777" filter="url(#rough2)">g[8]</text>
  <rect x="504" y="170" width="42" height="40" rx="4" fill="#ffffff" stroke="#777777" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="525" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="525" y="228" text-anchor="middle" font-size="9" fill="#777777" filter="url(#rough2)">g[9]</text>
  <text x="90" y="160" text-anchor="start" font-size="10" fill="#777777" filter="url(#rough2)">下标</text>
  <text x="70" y="195" text-anchor="end" font-size="11" fill="#777777" filter="url(#rough2)">g:</text>
  <rect x="60" y="300" width="600" height="60" rx="7" fill="#e9f4e2" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="76" y="326" text-anchor="start" font-size="11.5" fill="#2f5223" filter="url(#rough2)">枚举 x=1..n，对每个 x 用所有合法 k 得到可达异或集合，mex 就是 g[x]。</text>
  <text x="76" y="348" text-anchor="start" font-size="11" fill="#3c5e2e" filter="url(#rough2)">总复杂度 O(n√n)，n=10^5 时约 3×10^7；实测 0.04 s。</text>
</svg>
