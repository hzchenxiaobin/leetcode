<svg xmlns="http://www.w3.org/2000/svg" width="884" height="372" viewBox="0 0 884 372"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="117"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="884" height="372" fill="#fafafa"/>
  <text x="442" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">强连通定向存在 ⟺ 无桥</text>
  <text x="442" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">树边向下、非树边向上</text>
  <g filter="url(#rough2)"><line x1="200" y1="100" x2="360" y2="100" stroke="#7a9a6a" stroke-width="2.0"/></g>
  <g filter="url(#rough2)"><line x1="200" y1="100" x2="280" y2="200" stroke="#7a9a6a" stroke-width="2.0"/></g>
  <g filter="url(#rough2)"><line x1="360" y1="100" x2="280" y2="200" stroke="#7a9a6a" stroke-width="2.0"/></g>
  <g filter="url(#rough2)"><line x1="280" y1="200" x2="480" y2="200" stroke="#7a9a6a" stroke-width="2.0"/></g>
  <g filter="url(#rough2)"><line x1="360" y1="100" x2="480" y2="200" stroke="#7a9a6a" stroke-width="2.0"/></g>
  <g filter="url(#rough2)"><line x1="480" y1="200" x2="600" y2="110" stroke="#b85450" stroke-width="2.6" stroke-dasharray="6 4"/></g>
  <g filter="url(#rough2)"><circle cx="200" cy="100" r="18" fill="#f6e3c4" fill-opacity="0.9" stroke="#c9a86a" stroke-width="1.4"/></g>
  <text x="200" y="105" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><circle cx="360" cy="100" r="18" fill="#f6e3c4" fill-opacity="0.9" stroke="#c9a86a" stroke-width="1.4"/></g>
  <text x="360" y="105" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><circle cx="280" cy="200" r="18" fill="#f6e3c4" fill-opacity="0.9" stroke="#c9a86a" stroke-width="1.4"/></g>
  <text x="280" y="205" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><circle cx="480" cy="200" r="18" fill="#f6e3c4" fill-opacity="0.9" stroke="#c9a86a" stroke-width="1.4"/></g>
  <text x="480" y="205" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><circle cx="600" cy="110" r="18" fill="#f6e3c4" fill-opacity="0.9" stroke="#c9a86a" stroke-width="1.4"/></g>
  <text x="600" y="115" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="660" y="160" text-anchor="start" font-size="11" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">红虚线 = 桥</text>
  <text x="660" y="186" text-anchor="start" font-size="11" fill="#555555" filter="url(#rough2)">去掉后图断开 → 输出 0</text>
  <text x="442" y="262" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">DFS 树边父→子；非树边由深的点指向浅的点</text>
  <text x="442" y="294" text-anchor="middle" font-size="11.5" fill="#3d6b2f" filter="url(#rough2)">于是任意点能沿树边下到后代、再沿非树边爬回祖先 → 强连通</text>
</svg>
