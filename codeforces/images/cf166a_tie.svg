<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="811"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="280" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">按 (解题数降, 罚时升) 排序后的并列块</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">第 k 名由它所在的块共享</text>
  <g filter="url(#rough2)"><rect x="80" y="96" width="120" height="34" rx="4" fill="#dcecd2" fill-opacity="0.4" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="140" y="118" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">4 10</text>
  <text x="250" y="118" text-anchor="start" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">× 3</text>
  <g filter="url(#rough2)"><rect x="80" y="138" width="120" height="34" rx="4" fill="#ffffff" fill-opacity="0.4" stroke="#666666" stroke-width="1.4"/></g>
  <text x="140" y="160" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">3 20</text>
  <text x="250" y="160" text-anchor="start" font-size="11.5" fill="#666666" filter="url(#rough2)">× 1</text>
  <g filter="url(#rough2)"><rect x="80" y="180" width="120" height="34" rx="4" fill="#ffffff" fill-opacity="0.4" stroke="#666666" stroke-width="1.4"/></g>
  <text x="140" y="202" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">2 1</text>
  <text x="250" y="202" text-anchor="start" font-size="11.5" fill="#666666" filter="url(#rough2)">× 2</text>
  <g filter="url(#rough2)"><rect x="80" y="222" width="120" height="34" rx="4" fill="#ffffff" fill-opacity="0.4" stroke="#666666" stroke-width="1.4"/></g>
  <text x="140" y="244" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">1 10</text>
  <text x="250" y="244" text-anchor="start" font-size="11.5" fill="#666666" filter="url(#rough2)">× 1</text>
  <text x="500" y="120" text-anchor="start" font-size="12" fill="#4a7a3a" filter="url(#rough2)">k = 2 ⇒ 落在第一个块（大小 3）</text>
  <text x="500" y="154" text-anchor="start" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 = 3</text>
  <text x="450" y="258" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">名次相同的队伍在排序后连续</text>
</svg>
