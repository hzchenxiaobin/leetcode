<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="380" fill="#fafafa"/>
  <text x="360.0" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">207C2：同样的样例（n 到 7000）</text>
  <path d="M 144.00 46 Q 360.0 52 576.00 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="72" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">样例：5 次操作后答案依次为 1, 3, 3, 4, 7。</text>
  <text x="60" y="110" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">树 1：1 →(a) 2 →(b) 3</text>
  <text x="380" y="110" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">树 2：1 →(a) 2；1 →(b) 3 →(a) 4</text>
  <circle cx="120" cy="150" r="16" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="120" y="154" text-anchor="middle" font-size="10" fill="#33506e" filter="url(#rough2)">1</text>
  <circle cx="200" cy="190" r="16" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="200" y="194" text-anchor="middle" font-size="10" fill="#33506e" filter="url(#rough2)">2</text>
  <circle cx="280" cy="230" r="16" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="280" y="234" text-anchor="middle" font-size="10" fill="#33506e" filter="url(#rough2)">3</text>
  <text x="160" y="180" text-anchor="start" font-size="9.5" fill="#8a6015" filter="url(#rough2)">a</text>
  <text x="240" y="220" text-anchor="start" font-size="9.5" fill="#8a6015" filter="url(#rough2)">b</text>
  <circle cx="440" cy="150" r="16" fill="#fdeef1" stroke="#c0708a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="440" y="154" text-anchor="middle" font-size="10" fill="#8a3a52" filter="url(#rough2)">1</text>
  <circle cx="520" cy="190" r="16" fill="#fdeef1" stroke="#c0708a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="520" y="194" text-anchor="middle" font-size="10" fill="#8a3a52" filter="url(#rough2)">2</text>
  <circle cx="400" cy="190" r="16" fill="#fdeef1" stroke="#c0708a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="400" y="194" text-anchor="middle" font-size="10" fill="#8a3a52" filter="url(#rough2)">3</text>
  <circle cx="400" cy="230" r="16" fill="#fdeef1" stroke="#c0708a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="400" y="234" text-anchor="middle" font-size="10" fill="#8a3a52" filter="url(#rough2)">4</text>
  <text x="478" y="180" text-anchor="start" font-size="9.5" fill="#8a6015" filter="url(#rough2)">a</text>
  <text x="362" y="180" text-anchor="start" font-size="9.5" fill="#8a6015" filter="url(#rough2)">b</text>
  <text x="366" y="238" text-anchor="start" font-size="9.5" fill="#8a6015" filter="url(#rough2)">a</text>
  <text x="60" y="280" text-anchor="start" font-size="10.5" fill="#33506e" filter="url(#rough2)">向上串：树1 是 ""、"a"、"ba"；树2 的向下串：""、"a"、"b"、"ba"、"a"、""…</text>
  <rect x="60" y="302" width="620" height="56" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="319" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">匹配计数得到 4 + 2 + 1 = 7 个组合。</text>
  <text x="74" y="340" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">哈希表 + 沿祖先链走，累计 O(n²)。</text>
</svg>
