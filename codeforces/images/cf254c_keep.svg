<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="380" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">最少改动 = 必须替换的位置数</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">keep[c] = min(cnt_s[c], cnt_t[c])；多出来的那些位置的字母必须换掉</text>
  <text x="140" y="100" text-anchor="start" font-size="12.5" fill="#555555" filter="url(#rough2)">字符串 s</text>
  <g filter="url(#rough2)"><rect x="140" y="112" width="58" height="44" rx="4" fill="#f6d9d7" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="169.0" y="139.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">C</text>
  <g filter="url(#rough2)"><rect x="210" y="112" width="58" height="44" rx="4" fill="#f6d9d7" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="239.0" y="139.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">D</text>
  <g filter="url(#rough2)"><rect x="280" y="112" width="58" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="309.0" y="139.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">B</text>
  <g filter="url(#rough2)"><rect x="350" y="112" width="58" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="379.0" y="139.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">A</text>
  <g filter="url(#rough2)"><rect x="420" y="112" width="58" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="449.0" y="139.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">B</text>
  <g filter="url(#rough2)"><rect x="490" y="112" width="58" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="519.0" y="139.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">C</text>
  <text x="140" y="196" text-anchor="start" font-size="12.5" fill="#555555" filter="url(#rough2)">目标多重集 t = ADCABD</text>
  <g filter="url(#rough2)"><rect x="140" y="208" width="58" height="44" rx="4" fill="#cfe0f0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="169.0" y="235.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">A</text>
  <g filter="url(#rough2)"><rect x="210" y="208" width="58" height="44" rx="4" fill="#cfe0f0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="239.0" y="235.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">D</text>
  <g filter="url(#rough2)"><rect x="280" y="208" width="58" height="44" rx="4" fill="#cfe0f0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="309.0" y="235.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">C</text>
  <g filter="url(#rough2)"><rect x="350" y="208" width="58" height="44" rx="4" fill="#cfe0f0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="379.0" y="235.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">A</text>
  <g filter="url(#rough2)"><rect x="420" y="208" width="58" height="44" rx="4" fill="#cfe0f0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="449.0" y="235.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">B</text>
  <g filter="url(#rough2)"><rect x="490" y="208" width="58" height="44" rx="4" fill="#cfe0f0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="519.0" y="235.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">D</text>
  <text x="140" y="292" text-anchor="start" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">s 中 C、D 各多一个 → z = 2；把这两个位置改成还缺的字母</text>
  <text x="140" y="324" text-anchor="start" font-size="12.5" fill="#b05a5a" filter="url(#rough2)">从左到右贪心：能保留原字母且仍合法就保留，否则换成最小的"还缺"字母</text>
  <text x="440" y="360" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">贪心时只需两个量：remKeep[c]（还能保留几个 c）与 need[c]（还缺几个 c）</text>
</svg>
