<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="219"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">187C 样例 1：q=2 不够、q=3 可以</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="60.0" y="96.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">志愿者在 1、3、6；s=1，t=6；边长都是 1</text>
  <rect x="60.0" y="130.0" width="600.0" height="80.0" fill="#fde8e8" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="74.0" y="153.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">q=2：从 1 出发 2 步内只能到 2、3、4；能重置的志愿者只有 3</text>
  <text x="74.0" y="179.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">从 3 出发 2 步内到不了 6（3-4-5-6 要 3 步）→ 失败</text>
  <rect x="60.0" y="226.0" width="600.0" height="80.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="74.0" y="249.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">q=3：从 1 出发 3 步内到 4，且能到志愿者 3；从 3 出发 3 步内到 6</text>
  <text x="74.0" y="275.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">6 本身是志愿者 → 成功</text>
  <rect x="60.0" y="322.0" width="600.0" height="50.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="74.0" y="345.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">二分 [0,n-1]，判定 O(n+m)，总 O((n+m) log n)；不连通输出 -1</text>
</svg>
