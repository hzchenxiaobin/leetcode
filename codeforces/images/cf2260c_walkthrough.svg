<svg xmlns="http://www.w3.org/2000/svg" width="780" height="470" viewBox="0 0 780 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="780" height="470" fill="#fafafa"/>

  <text x="390" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">演算：x = 6, y = 4 ⇒ S = 10 = 1010₂</text>
  <path d="M 168 42 Q 390 49 612 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="390" y="64" text-anchor="middle" font-size="12" fill="#66788c" filter="url(#rough2)">从高位到低位逐位判定，维护已确定的 a</text>

  <!-- 表头 -->
  <rect x="96" y="80" width="588" height="34" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="146" y="102" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">位 i</text>
  <text x="256" y="102" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">S 的位</text>
  <text x="380" y="102" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">cand = a | 2^i</text>
  <text x="500" y="102" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">cand ≤ 6 ?</text>
  <text x="612" y="102" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">决策 ⇒ a</text>

  <!-- 第 1 行：i = 3 -->
  <rect x="96" y="116" width="588" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="146" y="140" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="256" y="140" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="380" y="140" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">0 | 8 = 8</text>
  <text x="500" y="140" text-anchor="middle" font-size="13" fill="#a14340" filter="url(#rough2)">否（8 &gt; 6）</text>
  <text x="612" y="140" text-anchor="middle" font-size="13" fill="#a14340" filter="url(#rough2)">弃，a = 0</text>

  <!-- 第 2 行：i = 2 -->
  <rect x="96" y="152" width="588" height="36" fill="#fafafa" stroke="#8fa4b8" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="146" y="176" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="256" y="176" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="380" y="176" text-anchor="middle" font-size="13" fill="#8fa4b8" filter="url(#rough2)">—（S 位为 0）</text>
  <text x="500" y="176" text-anchor="middle" font-size="13" fill="#8fa4b8" filter="url(#rough2)">跳过</text>
  <text x="612" y="176" text-anchor="middle" font-size="13" fill="#66788c" filter="url(#rough2)">只能 0，a = 0</text>

  <!-- 第 3 行：i = 1 -->
  <rect x="96" y="188" width="588" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="146" y="212" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="256" y="212" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="380" y="212" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">0 | 2 = 2</text>
  <text x="500" y="212" text-anchor="middle" font-size="13" fill="#3c5e2e" filter="url(#rough2)">是（2 ≤ 6）</text>
  <text x="612" y="212" text-anchor="middle" font-size="13" fill="#3c5e2e" filter="url(#rough2)">放，a = 2</text>

  <!-- 第 4 行：i = 0 -->
  <rect x="96" y="224" width="588" height="36" fill="#fafafa" stroke="#8fa4b8" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="146" y="248" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="256" y="248" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="380" y="248" text-anchor="middle" font-size="13" fill="#8fa4b8" filter="url(#rough2)">—（S 位为 0）</text>
  <text x="500" y="248" text-anchor="middle" font-size="13" fill="#8fa4b8" filter="url(#rough2)">跳过</text>
  <text x="612" y="248" text-anchor="middle" font-size="13" fill="#66788c" filter="url(#rough2)">a 保持 2</text>

  <path d="M 390 266 L 390 288" stroke="#d6a040" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="126" y="294" width="528" height="46" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="390" y="323" text-anchor="middle" font-size="14" fill="#8a6015" filter="url(#rough2)">a = 2 ⇒ k = x − a = 4，XOR = 2 ^ 8 = 10 = S ⇒ 输出「10 4」</text>

  <!-- 三组样例 -->
  <rect x="86" y="356" width="608" height="98" rx="9" fill="#f3f6fa" stroke="#8fa4b8" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="390" y="380" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">三组官方样例对照</text>
  <text x="120" y="404" text-anchor="start" font-size="12" fill="#3c5e2e" filter="url(#rough2)">(3, 1)：S = 100₂，4 &gt; 3 弃 ⇒ a = 0，k = 3 ⇒ 4 3</text>
  <text x="120" y="426" text-anchor="start" font-size="12" fill="#3c5e2e" filter="url(#rough2)">(0, 5)：S = 101₂，x = 0 ⇒ a = 0，k = 0 ⇒ 5 0</text>
  <text x="120" y="448" text-anchor="start" font-size="12" fill="#3c5e2e" filter="url(#rough2)">(6, 4)：S = 1010₂，a = 2，k = 4 ⇒ 10 4</text>
</svg>
