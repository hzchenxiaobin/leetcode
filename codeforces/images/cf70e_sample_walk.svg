<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="53"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2b2b2b"/>
    </marker>
  </defs>

  <rect width="760" height="440" fill="#fafafa"/>
  <text x="380" y="28" text-anchor="middle" font-size="17.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例走查：k = 10，选 1、2 两个中心，总代价 20 + 18 = 38</text>
  <path d="M 80 38 Q 380 44 680 38" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 树 -->
  <g filter="url(#rough2)" stroke="#9a9a9a" stroke-width="1.7" fill="none">
    <line x1="250" y1="160" x2="160" y2="96"/>
    <line x1="160" y1="96" x2="92" y2="60"/>
    <line x1="250" y1="160" x2="250" y2="92"/>
    <line x1="250" y1="160" x2="360" y2="142"/>
    <line x1="360" y1="142" x2="440" y2="96"/>
    <line x1="360" y1="142" x2="470" y2="208"/>
    <line x1="470" y1="208" x2="570" y2="242"/>
  </g>
  <g filter="url(#rough2)">
    <circle cx="250" cy="160" r="16" fill="#fdecea" stroke="#b85450" stroke-width="2.2"/>
    <circle cx="470" cy="208" r="16" fill="#fdecea" stroke="#b85450" stroke-width="2.2"/>
    <circle cx="160" cy="96" r="14" fill="#eef2f7" stroke="#446688" stroke-width="1.6"/>
    <circle cx="92" cy="60" r="13" fill="#eef2f7" stroke="#446688" stroke-width="1.6"/>
    <circle cx="250" cy="92" r="13" fill="#eef2f7" stroke="#446688" stroke-width="1.6"/>
    <circle cx="360" cy="142" r="14" fill="#eef2f7" stroke="#446688" stroke-width="1.6"/>
    <circle cx="440" cy="96" r="13" fill="#eef2f7" stroke="#446688" stroke-width="1.6"/>
    <circle cx="570" cy="242" r="13" fill="#eef2f7" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)" text-anchor="middle">
    <text x="250" y="165" fill="#8c2f2b">1</text>
    <text x="470" y="213" fill="#8c2f2b">2</text>
    <text x="160" y="101">4</text>
    <text x="92" y="65">6</text>
    <text x="250" y="97">7</text>
    <text x="360" y="147">3</text>
    <text x="440" y="101">5</text>
    <text x="570" y="247">8</text>
  </g>
  <text x="174" y="186" font-size="10.5" fill="#8c2f2b" filter="url(#rough2)">中心</text>
  <text x="486" y="236" font-size="10.5" fill="#8c2f2b" filter="url(#rough2)">中心</text>

  <!-- 代价表 -->
  <g filter="url(#rough2)">
    <rect x="300" y="272" width="430" height="28" fill="#f2f2f2" stroke="#888" stroke-width="1.2"/>
    <text x="314" y="291" font-size="11.5" fill="#333">项目</text>
    <text x="430" y="291" font-size="11.5" fill="#333">距离 / 数量</text>
    <text x="580" y="291" font-size="11.5" fill="#333">年费</text>
    <text x="668" y="291" font-size="11.5" fill="#333">小计</text>
  </g>
  <g font-size="11.3" fill="#333" filter="url(#rough2)">
    <text x="314" y="318">中心 1、2</text><text x="430" y="318">2 个</text><text x="580" y="318">k = 10</text><text x="668" y="318">20</text>
    <text x="314" y="338">城市 3、4、7</text><text x="430" y="338">距离 1</text><text x="580" y="338">d₁ = 2</text><text x="668" y="338">6</text>
    <text x="314" y="358">城市 5、6</text><text x="430" y="358">距离 2</text><text x="580" y="358">d₂ = 5</text><text x="668" y="358">10</text>
    <text x="314" y="378">城市 8</text><text x="430" y="378">距离 1</text><text x="580" y="378">d₁ = 2</text><text x="668" y="378">2</text>
    <text x="314" y="400" font-weight="bold" fill="#8a6015">合计</text><text x="430" y="400" font-weight="bold" fill="#8a6015">20 + 18</text><text x="580" y="400" font-weight="bold" fill="#8a6015">—</text><text x="668" y="400" font-weight="bold" fill="#8a6015">38</text>
  </g>

  <!-- 左侧说明 -->
  <rect x="30" y="272" width="250" height="128" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="46" y="296" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">指派（本解输出）</text>
  <text x="46" y="318" font-size="11.3" fill="#2f4a66" filter="url(#rough2)">1 2 1 1 1 1 1 2</text>
  <text x="46" y="340" font-size="11" fill="#2f4a66" filter="url(#rough2)">3,4,5,6,7 由 1 负责，8 由 2 负责；</text>
  <text x="46" y="358" font-size="11" fill="#2f4a66" filter="url(#rough2)">1、2 自己是中心，各付 k。</text>
  <text x="46" y="378" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">官方给的中心是 3、4，代价同为 38。</text>
  <text x="46" y="394" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">两者都最优 → 本题多解。</text>

  <rect x="30" y="408" width="700" height="26" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="46" y="426" font-size="11" fill="#7a5a1b" filter="url(#rough2)">多解：官方输出 38 与 3 3 3 4 3 4 3 3；本解输出 38 与 1 2 1 1 1 1 1 2，两者都最优，用 checker 校验。</text>
</svg>
