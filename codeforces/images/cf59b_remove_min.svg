<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c9801f"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a8524a"/>
    </marker>
  </defs>
  <rect width="760" height="350" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">样例 5 6 7：S = 18 是偶数，必须去掉奇数朵</text>
  <text x="380.0" y="60.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">去掉不同的花，剩余和与奇偶性如下</text>
  <rect x="60.0" y="88.0" width="640.0" height="54.0" rx="8" fill="#f4f9f2" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80.0" y="122.0" text-anchor="start" font-size="13.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">去掉 5</text>
  <text x="220.0" y="122.0" text-anchor="start" font-size="13" fill="#2b2b2b" filter="url(#rough2)">18 − 5 = 13</text>
  <text x="400.0" y="122.0" text-anchor="start" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">奇数 ✓</text>
  <text x="520.0" y="122.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">可行，且最大</text>
  <rect x="60.0" y="150.0" width="640.0" height="54.0" rx="8" fill="#fbeeee" stroke="#a8524a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80.0" y="184.0" text-anchor="start" font-size="13.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">去掉 6</text>
  <text x="220.0" y="184.0" text-anchor="start" font-size="13" fill="#2b2b2b" filter="url(#rough2)">18 − 6 = 12</text>
  <text x="400.0" y="184.0" text-anchor="start" font-size="13" fill="#a8524a" font-weight="bold" filter="url(#rough2)">偶数 ✗</text>
  <text x="520.0" y="184.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">结果不是 Loves</text>
  <rect x="60.0" y="212.0" width="640.0" height="54.0" rx="8" fill="#fdf3e3" stroke="#c9801f" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80.0" y="246.0" text-anchor="start" font-size="13.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">去掉 7</text>
  <text x="220.0" y="246.0" text-anchor="start" font-size="13" fill="#2b2b2b" filter="url(#rough2)">18 − 7 = 11</text>
  <text x="400.0" y="246.0" text-anchor="start" font-size="13" fill="#c9801f" font-weight="bold" filter="url(#rough2)">奇数 ✓</text>
  <text x="520.0" y="246.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">可行但更小</text>
  <rect x="60.0" y="286.0" width="640.0" height="40.0" rx="8" fill="#ffffff" stroke="#c9801f" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="76.0" y="312.0" text-anchor="start" font-size="13" fill="#c9801f" font-weight="bold" filter="url(#rough2)">结论：能去掉的奇数里最小的那朵（5）给出最大的奇数剩余和 13。</text>
</svg>
