<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1066"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="760" height="340" fill="#fafafa"/>
  <text x="380.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按面团做的有界背包</text>
  <path d="M 121.60000000000001 42 Q 380.0 48 638.4 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="30" y="70" width="700" height="44" rx="7" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="98" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">f[0] = 0，其余 −∞；先对无馅面包做完全背包</text>
  <rect x="30" y="126" width="700" height="44" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="154" text-anchor="middle" font-size="12.5" fill="#2f5223" filter="url(#rough2)">对每种馅料：g[j] = max over t≤t_max of ( f[j − t·cᵢ] + t·dᵢ )</text>
  <rect x="30" y="182" width="700" height="44" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="210" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">t_max = min(⌊aᵢ/bᵢ⌋, ⌊n/cᵢ⌋)，枚举 t 即可</text>
  <rect x="30" y="238" width="700" height="44" rx="7" fill="#fbeeee" stroke="#a05a5a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="266" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#6b3030" filter="url(#rough2)">答案 = max_j f[j]（剩余面团扔掉）</text>
  <text x="380" y="310" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">复杂度 O(m·n·t_max) ≤ 10⁷</text>
</svg>
