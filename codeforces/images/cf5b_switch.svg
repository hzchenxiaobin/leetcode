<svg xmlns="http://www.w3.org/2000/svg" width="760" height="370" viewBox="0 0 760 370"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="53"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>

  <rect width="760" height="370" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2：开关只在奇数余量的行上翻转</text>
  <path d="M 190 42 Q 380 47 570 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="380" y="60" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">W = 14，边框 16 个 '*'</text>

  <line x1="60" y1="76" x2="700" y2="76" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="64" y="70" font-size="10.5" fill="#777" filter="url(#rough2)">行内容</text>
  <text x="250" y="70" text-anchor="end" font-size="10.5" fill="#777" filter="url(#rough2)">长度</text>
  <text x="312" y="70" text-anchor="end" font-size="10.5" fill="#777" filter="url(#rough2)">diff</text>
  <text x="326" y="70" font-size="10.5" fill="#777" filter="url(#rough2)">奇偶</text>
  <text x="404" y="70" font-size="10.5" fill="#777" filter="url(#rough2)">左 / 右</text>
  <text x="530" y="70" font-size="10.5" fill="#777" filter="url(#rough2)">处理完这行后的开关</text>

  <text x="64" y="104" font-size="12" fill="#2b2b2b" font-family="'Courier New',monospace" filter="url(#rough2)">welcome to the</text>
  <text x="250" y="104" text-anchor="end" font-size="12" fill="#2b2b2b" filter="url(#rough2)">14</text>
  <text x="312" y="104" text-anchor="end" font-size="12" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="326" y="104" font-size="11.5" fill="#777" filter="url(#rough2)">偶</text>
  <text x="404" y="104" font-size="12" fill="#2b2b2b" filter="url(#rough2)">0 / 0</text>
  <text x="530" y="104" font-size="12" fill="#2f4a66" filter="url(#rough2)">靠左</text>
  <text x="64" y="135" font-size="12" fill="#2b2b2b" font-family="'Courier New',monospace" filter="url(#rough2)">Codeforces</text>
  <text x="250" y="135" text-anchor="end" font-size="12" fill="#2b2b2b" filter="url(#rough2)">10</text>
  <text x="312" y="135" text-anchor="end" font-size="12" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="326" y="135" font-size="11.5" fill="#777" filter="url(#rough2)">偶</text>
  <text x="404" y="135" font-size="12" fill="#2b2b2b" filter="url(#rough2)">2 / 2</text>
  <text x="530" y="135" font-size="12" fill="#2f4a66" filter="url(#rough2)">靠左</text>
  <text x="64" y="166" font-size="12" fill="#2b2b2b" font-family="'Courier New',monospace" filter="url(#rough2)">Beta</text>
  <text x="250" y="166" text-anchor="end" font-size="12" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="312" y="166" text-anchor="end" font-size="12" fill="#2b2b2b" filter="url(#rough2)">10</text>
  <text x="326" y="166" font-size="11.5" fill="#777" filter="url(#rough2)">偶</text>
  <text x="404" y="166" font-size="12" fill="#2b2b2b" filter="url(#rough2)">5 / 5</text>
  <text x="530" y="166" font-size="12" fill="#2f4a66" filter="url(#rough2)">靠左</text>
  <text x="64" y="197" font-size="12" fill="#b85450" font-family="'Courier New',monospace" filter="url(#rough2)">Round 5</text>
  <text x="250" y="197" text-anchor="end" font-size="12" fill="#b85450" filter="url(#rough2)">7</text>
  <text x="312" y="197" text-anchor="end" font-size="12" fill="#b85450" filter="url(#rough2)">7</text>
  <text x="326" y="197" font-size="11.5" fill="#b85450" filter="url(#rough2)">奇 #1</text>
  <text x="404" y="197" font-size="12" fill="#b85450" filter="url(#rough2)">3 / 4</text>
  <text x="530" y="197" font-size="12" fill="#2f4a66" filter="url(#rough2)">靠右</text>
  <text x="64" y="228" font-size="12" fill="#8a8a8a" filter="url(#rough2)">（空行）</text>
  <text x="250" y="228" text-anchor="end" font-size="12" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="312" y="228" text-anchor="end" font-size="12" fill="#2b2b2b" filter="url(#rough2)">14</text>
  <text x="326" y="228" font-size="11.5" fill="#777" filter="url(#rough2)">偶</text>
  <text x="404" y="228" font-size="12" fill="#2b2b2b" filter="url(#rough2)">7 / 7</text>
  <text x="530" y="228" font-size="12" fill="#2f4a66" filter="url(#rough2)">靠右</text>
  <text x="64" y="259" font-size="12" fill="#b85450" font-family="'Courier New',monospace" filter="url(#rough2)">and</text>
  <text x="250" y="259" text-anchor="end" font-size="12" fill="#b85450" filter="url(#rough2)">3</text>
  <text x="312" y="259" text-anchor="end" font-size="12" fill="#b85450" filter="url(#rough2)">11</text>
  <text x="326" y="259" font-size="11.5" fill="#b85450" filter="url(#rough2)">奇 #2</text>
  <text x="404" y="259" font-size="12" fill="#b85450" filter="url(#rough2)">6 / 5</text>
  <text x="530" y="259" font-size="12" fill="#2f4a66" filter="url(#rough2)">靠左</text>
  <text x="64" y="290" font-size="12" fill="#b85450" font-family="'Courier New',monospace" filter="url(#rough2)">good luck</text>
  <text x="250" y="290" text-anchor="end" font-size="12" fill="#b85450" filter="url(#rough2)">9</text>
  <text x="312" y="290" text-anchor="end" font-size="12" fill="#b85450" filter="url(#rough2)">5</text>
  <text x="326" y="290" font-size="11.5" fill="#b85450" filter="url(#rough2)">奇 #3</text>
  <text x="404" y="290" font-size="12" fill="#b85450" filter="url(#rough2)">2 / 3</text>
  <text x="530" y="290" font-size="12" fill="#2f4a66" filter="url(#rough2)">靠右</text>

  <line x1="60" y1="322" x2="700" y2="322" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="64" y="344" font-size="11" fill="#2b2b2b" filter="url(#rough2)">空行 diff = 14 是偶数，不占交替名额；若 W 为奇数，空行的 diff 也会是奇数，它同样要翻转开关。</text>
  <text x="64" y="364" font-size="11" fill="#8a6015" filter="url(#rough2)">边框恰好 W + 2 个 '*'：题面要求 minimum size，多一个都会错。</text>
</svg>
