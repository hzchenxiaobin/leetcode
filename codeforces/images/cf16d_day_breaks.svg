<svg xmlns="http://www.w3.org/2000/svg" width="780" height="430" viewBox="0 0 780 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="311"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrT" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="780" height="430" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">只有两种"被迫换天"：时间后退、同一分钟第 11 条</text>

  <!-- 场景 A -->
  <rect x="36" y="46" width="708" height="170" rx="10" fill="#eef4ff" stroke="#446688"
        stroke-width="1.3" filter="url(#rough2)"/>
  <text x="52" y="72" font-size="12.5" font-weight="bold" fill="#23405c" filter="url(#rough2)">A. 时间后退（样例 1 的 5 条记录）</text>

  <rect x="60" y="92" width="72" height="40" rx="6" fill="#dbe7fb" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="140" y="92" width="72" height="40" rx="6" fill="#dbe7fb" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="220" y="92" width="72" height="40" rx="6" fill="#dbe7fb" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="300" y="92" width="72" height="40" rx="6" fill="#fff1e6" stroke="#b06a2c" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="380" y="92" width="72" height="40" rx="6" fill="#fff1e6" stroke="#b06a2c" stroke-width="1.3" filter="url(#rough2)"/>

  <text x="96" y="117" text-anchor="middle" font-size="13" fill="#23405c" filter="url(#rough2)">300</text>
  <text x="176" y="117" text-anchor="middle" font-size="13" fill="#23405c" filter="url(#rough2)">300</text>
  <text x="256" y="117" text-anchor="middle" font-size="13" fill="#23405c" filter="url(#rough2)">793</text>
  <text x="336" y="117" text-anchor="middle" font-size="13" fill="#8a4a14" filter="url(#rough2)">790</text>
  <text x="416" y="117" text-anchor="middle" font-size="13" fill="#8a4a14" filter="url(#rough2)">1420</text>

  <line x1="292" y1="84" x2="292" y2="146" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <path d="M 296 166 L 296 156" stroke="#c0392b" stroke-width="1.6" fill="none"
        marker-end="url(#arrT)" filter="url(#rough2)"/>
  <text x="304" y="172" font-size="10.5" fill="#c0392b" filter="url(#rough2)">790 &lt; 793，时间倒退，任何方案都必须在这里换天</text>

  <rect x="60" y="182" width="224" height="18" rx="5" fill="#cfeacf" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="172" y="196" text-anchor="middle" font-size="10.5" fill="#204a1e" filter="url(#rough2)">第 1 天</text>
  <rect x="300" y="182" width="152" height="18" rx="5" fill="#ffd9b3" stroke="#b06a2c" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="376" y="196" text-anchor="middle" font-size="10.5" fill="#8a4a14" filter="url(#rough2)">第 2 天</text>

  <!-- 场景 B -->
  <rect x="36" y="228" width="708" height="130" rx="10" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.3" filter="url(#rough2)"/>
  <text x="52" y="254" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">B. 同一分钟第 11 条（11 条记录的分钟数都是 720，即 12:00 p.m.）</text>

  <rect x="60" y="272" width="40" height="34" rx="5" fill="#ffd9b3" stroke="#b06a2c" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="106" y="272" width="40" height="34" rx="5" fill="#ffd9b3" stroke="#b06a2c" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="152" y="272" width="40" height="34" rx="5" fill="#ffd9b3" stroke="#b06a2c" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="198" y="272" width="40" height="34" rx="5" fill="#ffd9b3" stroke="#b06a2c" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="244" y="272" width="40" height="34" rx="5" fill="#ffd9b3" stroke="#b06a2c" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="290" y="272" width="40" height="34" rx="5" fill="#ffd9b3" stroke="#b06a2c" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="336" y="272" width="40" height="34" rx="5" fill="#ffd9b3" stroke="#b06a2c" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="382" y="272" width="40" height="34" rx="5" fill="#ffd9b3" stroke="#b06a2c" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="428" y="272" width="40" height="34" rx="5" fill="#ffd9b3" stroke="#b06a2c" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="474" y="272" width="40" height="34" rx="5" fill="#ffd9b3" stroke="#b06a2c" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="534" y="272" width="40" height="34" rx="5" fill="#fdeef0" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>

  <text x="80" y="294" text-anchor="middle" font-size="10" fill="#8a4a14" filter="url(#rough2)">1</text>
  <text x="126" y="294" text-anchor="middle" font-size="10" fill="#8a4a14" filter="url(#rough2)">2</text>
  <text x="172" y="294" text-anchor="middle" font-size="10" fill="#8a4a14" filter="url(#rough2)">3</text>
  <text x="218" y="294" text-anchor="middle" font-size="10" fill="#8a4a14" filter="url(#rough2)">4</text>
  <text x="264" y="294" text-anchor="middle" font-size="10" fill="#8a4a14" filter="url(#rough2)">5</text>
  <text x="310" y="294" text-anchor="middle" font-size="10" fill="#8a4a14" filter="url(#rough2)">6</text>
  <text x="356" y="294" text-anchor="middle" font-size="10" fill="#8a4a14" filter="url(#rough2)">7</text>
  <text x="402" y="294" text-anchor="middle" font-size="10" fill="#8a4a14" filter="url(#rough2)">8</text>
  <text x="448" y="294" text-anchor="middle" font-size="10" fill="#8a4a14" filter="url(#rough2)">9</text>
  <text x="494" y="294" text-anchor="middle" font-size="10" fill="#8a4a14" filter="url(#rough2)">10</text>
  <text x="554" y="294" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">11</text>

  <line x1="522" y1="264" x2="522" y2="312" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="590" y="284" font-size="10.5" fill="#8c3b37" filter="url(#rough2)">第 11 条超出一分钟的</text>
  <text x="590" y="302" font-size="10.5" fill="#8c3b37" filter="url(#rough2)">10 条上限 → 换天</text>

  <text x="60" y="332" font-size="10.5" fill="#8a4a14" filter="url(#rough2)">前 10 条挤在同一天同一分钟；第 11 条只能排到下一天的同一分钟。</text>

  <!-- 结论 -->
  <rect x="36" y="370" width="708" height="46" rx="9" fill="#eef1f7" stroke="#7a8ca6"
        stroke-width="1.3" filter="url(#rough2)"/>
  <text x="52" y="392" font-size="12" fill="#33445c" filter="url(#rough2)">天数 = 1 + 强制切分数。每个切分点都是"任何合法方案都逃不掉"的：要么时间倒退，要么超过每分钟 10 条。</text>
  <text x="52" y="410" font-size="11" fill="#555" filter="url(#rough2)">其余相邻记录只要时间不倒退，就一定能塞进同一天，所以不必也不应该多切。</text>
</svg>
