<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-12%" y="-12%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：a = 17, b = 3, x = 3，答案 3</text>
  <text x="280" y="52" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">格子值 = i + j + |m[i] − n[j]|</text>

  <text x="276" y="84" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">j = 0 (n = 3)</text>
  <text x="360" y="84" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">j = 1 (n = 1)</text>
  <text x="444" y="84" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">j = 2 (n = 0)</text>

  <text x="134" y="114" text-anchor="end" font-size="11" fill="#446688" filter="url(#rough2)">i = 0 (m = 17)</text>
  <text x="134" y="158" text-anchor="end" font-size="11" fill="#446688" filter="url(#rough2)">i = 1 (m = 5)</text>
  <text x="134" y="202" text-anchor="end" font-size="11" fill="#446688" filter="url(#rough2)">i = 2 (m = 1)</text>
  <text x="134" y="246" text-anchor="end" font-size="11" fill="#446688" filter="url(#rough2)">i = 3 (m = 0)</text>

  <rect x="150" y="94" width="84" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="234" y="94" width="84" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="318" y="94" width="84" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="150" y="138" width="84" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="234" y="138" width="84" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="318" y="138" width="84" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="150" y="182" width="84" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="234" y="182" width="84" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <rect x="318" y="182" width="84" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="150" y="226" width="84" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="234" y="226" width="84" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="318" y="226" width="84" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>

  <text x="192" y="122" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">14</text>
  <text x="276" y="122" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">17</text>
  <text x="360" y="122" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">19</text>
  <text x="192" y="166" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <text x="276" y="166" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">6</text>
  <text x="360" y="166" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">8</text>
  <text x="192" y="210" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">4</text>
  <text x="276" y="210" text-anchor="middle" font-size="15" fill="#d6a040" filter="url(#rough2)">3</text>
  <text x="360" y="210" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">5</text>
  <text x="192" y="254" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">6</text>
  <text x="276" y="254" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">5</text>
  <text x="360" y="254" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">5</text>

  <text x="280" y="304" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">最优 (i = 2, j = 1)：17 → 5 → 1，3 → 1，共 3 步</text>
  <text x="280" y="324" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">(i = 1, j = 0) 的 3 步是另一条同样短的路：17 → 5，3 补加到 5</text>
</svg>
