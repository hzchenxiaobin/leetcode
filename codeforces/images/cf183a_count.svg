<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="103"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">183A 样例 1：freeU=2、freeV=2，共 9 个可能的总部位置</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="40.0" y="90.0" text-anchor="start" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">记录：UR、UL、ULDR</text>
  <text x="40.0" y="122.0" text-anchor="start" font-size="11.5" fill="#444" filter="url(#rough2)">UR 让 v 自由、UL 让 u 自由、ULDR 两个都自由 → freeU = 2，freeV = 2</text>
  <circle cx="158.0" cy="188.0" r="9.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="158.0" cy="250.0" r="9.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="158.0" cy="312.0" r="9.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="220.0" cy="188.0" r="9.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="220.0" cy="250.0" r="9.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="220.0" cy="312.0" r="9.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="282.0" cy="188.0" r="9.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="282.0" cy="250.0" r="9.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="282.0" cy="312.0" r="9.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="220.0" y="50.0" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">U 取 3 个值（−1, 1, 3）</text>
  <text x="34.0" y="250.0" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">V</text>
  <text x="356.4" y="254.0" text-anchor="start" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">9 个不同点</text>
  <rect x="430.0" y="110.0" width="250.0" height="96.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="444.0" y="133.0" text-anchor="start" font-size="11" fill="#3f3420" filter="url(#rough2)">每个自由步贡献 ±1</text>
  <text x="444.0" y="159.0" text-anchor="start" font-size="11" fill="#3f3420" filter="url(#rough2)">freeU 步 → freeU+1 个 U</text>
  <text x="444.0" y="185.0" text-anchor="start" font-size="11" fill="#3f3420" filter="url(#rough2)">freeV 步 → freeV+1 个 V</text>
  <rect x="430.0" y="224.0" width="250.0" height="96.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="444.0" y="247.0" text-anchor="start" font-size="11" fill="#3f3420" filter="url(#rough2)">(U,V) 与 (x,y) 一一对应</text>
  <text x="444.0" y="273.0" text-anchor="start" font-size="11" fill="#3f3420" filter="url(#rough2)">答案 = (freeU+1)(freeV+1)</text>
  <text x="444.0" y="299.0" text-anchor="start" font-size="11" fill="#3f3420" filter="url(#rough2)">= 3 × 3 = 9</text>
</svg>
