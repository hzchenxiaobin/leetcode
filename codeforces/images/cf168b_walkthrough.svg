<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="760" height="470" fill="#fafafa"/>

  <rect x="30" y="62" width="700" height="34" rx="4" fill="#eef4fd" stroke="#c9d6e4" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="44" y="84" font-size="10.5" text-anchor="start" fill="#777" filter="url(#rough2)">第1行</text>
  <text x="112" y="84" font-size="11.5" text-anchor="start" fill="#2b2b2b" filter="url(#rough2)">   #   include &lt;cstdio&gt;</text>
  <text x="520" y="84" font-size="11" text-anchor="start" fill="#35507a" filter="url(#rough2)">增强</text>
  <text x="600" y="84" font-size="11" text-anchor="start" fill="#7a2f2f" filter="url(#rough2)">原样</text>
  <rect x="30" y="100" width="700" height="34" rx="4" fill="#f2f8ee" stroke="#c9d6e4" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="44" y="122" font-size="10.5" text-anchor="start" fill="#777" filter="url(#rough2)">第2行</text>
  <text x="112" y="122" font-size="11.5" text-anchor="start" fill="#2b2b2b" filter="url(#rough2)">(空行)</text>
  <text x="520" y="122" font-size="11" text-anchor="start" fill="#2f5223" filter="url(#rough2)">普通</text>
  <text x="600" y="122" font-size="11" text-anchor="start" fill="#2f5223" filter="url(#rough2)">并入段 S</text>
  <rect x="30" y="138" width="700" height="34" rx="4" fill="#f2f8ee" stroke="#c9d6e4" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="44" y="160" font-size="10.5" text-anchor="start" fill="#777" filter="url(#rough2)">第3行</text>
  <text x="112" y="160" font-size="11.5" text-anchor="start" fill="#2b2b2b" filter="url(#rough2)">using namespace std;</text>
  <text x="520" y="160" font-size="11" text-anchor="start" fill="#2f5223" filter="url(#rough2)">普通</text>
  <text x="600" y="160" font-size="11" text-anchor="start" fill="#2f5223" filter="url(#rough2)">并入段 S</text>
  <rect x="30" y="176" width="700" height="34" rx="4" fill="#f2f8ee" stroke="#c9d6e4" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="44" y="198" font-size="10.5" text-anchor="start" fill="#777" filter="url(#rough2)">第4行</text>
  <text x="112" y="198" font-size="11.5" text-anchor="start" fill="#2b2b2b" filter="url(#rough2)">(空行)</text>
  <text x="520" y="198" font-size="11" text-anchor="start" fill="#2f5223" filter="url(#rough2)">普通</text>
  <text x="600" y="198" font-size="11" text-anchor="start" fill="#2f5223" filter="url(#rough2)">并入段 S</text>
  <rect x="30" y="214" width="700" height="34" rx="4" fill="#f2f8ee" stroke="#c9d6e4" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="44" y="236" font-size="10.5" text-anchor="start" fill="#777" filter="url(#rough2)">第5行</text>
  <text x="112" y="236" font-size="11.5" text-anchor="start" fill="#2b2b2b" filter="url(#rough2)">int main     (   ){</text>
  <text x="520" y="236" font-size="11" text-anchor="start" fill="#2f5223" filter="url(#rough2)">普通</text>
  <text x="600" y="236" font-size="11" text-anchor="start" fill="#2f5223" filter="url(#rough2)">并入段 S</text>
  <rect x="30" y="252" width="700" height="34" rx="4" fill="#f2f8ee" stroke="#c9d6e4" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="44" y="274" font-size="10.5" text-anchor="start" fill="#777" filter="url(#rough2)">第6行</text>
  <text x="112" y="274" font-size="11.5" text-anchor="start" fill="#2b2b2b" filter="url(#rough2)">puts("Hello # World"); #</text>
  <text x="520" y="274" font-size="11" text-anchor="start" fill="#2f5223" filter="url(#rough2)">普通</text>
  <text x="600" y="274" font-size="11" text-anchor="start" fill="#2f5223" filter="url(#rough2)">并入段 S</text>
  <rect x="30" y="290" width="700" height="34" rx="4" fill="#eef4fd" stroke="#c9d6e4" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="44" y="312" font-size="10.5" text-anchor="start" fill="#777" filter="url(#rough2)">第7行</text>
  <text x="112" y="312" font-size="11.5" text-anchor="start" fill="#2b2b2b" filter="url(#rough2)">#</text>
  <text x="520" y="312" font-size="11" text-anchor="start" fill="#35507a" filter="url(#rough2)">增强</text>
  <text x="600" y="312" font-size="11" text-anchor="start" fill="#7a2f2f" filter="url(#rough2)">原样</text>
  <rect x="30" y="328" width="700" height="34" rx="4" fill="#f2f8ee" stroke="#c9d6e4" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="44" y="350" font-size="10.5" text-anchor="start" fill="#777" filter="url(#rough2)">第8行</text>
  <text x="112" y="350" font-size="11.5" text-anchor="start" fill="#2b2b2b" filter="url(#rough2)">}</text>
  <text x="520" y="350" font-size="11" text-anchor="start" fill="#2f5223" filter="url(#rough2)">普通</text>
  <text x="600" y="350" font-size="11" text-anchor="start" fill="#2f5223" filter="url(#rough2)">并入段 T</text>
  <text x="30" y="384" font-size="12" text-anchor="start" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">段 S = 第 2–6 行拼成一行（所有空格被删掉）：</text>
  <rect x="30" y="394" width="700" height="34" rx="4" fill="#ffffff" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="42" y="416" font-size="11" text-anchor="start" fill="#7a2f2f" filter="url(#rough2)">usingnamespacestd;intmain(){puts("Hello#World");#</text>
  <text x="30" y="452" font-size="11.5" text-anchor="start" fill="#555" filter="url(#rough2)">输出 4 行：第1行原样 / 段S / 第7行# / 段T(即第8行)</text>
  <text x="380.0" y="36" font-size="20" text-anchor="middle" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">样例 1 走查：8 行输入 → 4 行输出</text>
  <path d="M 120 46 Q 380.0 52 640 46" fill="none" stroke="#2b2b2b" stroke-width="1.3" filter="url(#rough2)"/>
</svg>
