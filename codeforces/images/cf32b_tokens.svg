<svg xmlns="http://www.w3.org/2000/svg" width="760" height="410" viewBox="0 0 760 410" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="331" />
      <feDisplacementMap in="SourceGraphic" scale="1.5" />
    </filter>
  </defs>
  <rect width="760" height="410" fill="#fafafa" />
  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">三种 token：`.`、`-.`、`--`</text>
  <path d="M 150 44 Q 380 50 610 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)" />

  <g>
    <rect x="50" y="72" width="200" height="100" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)" />
    <rect x="280" y="72" width="200" height="100" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)" />
    <rect x="510" y="72" width="200" height="100" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)" />
  </g>
  <text x="150" y="112" text-anchor="middle" font-size="26" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">.</text>
  <text x="380" y="112" text-anchor="middle" font-size="26" font-weight="bold" fill="#2f5223" filter="url(#rough2)">-.</text>
  <text x="610" y="112" text-anchor="middle" font-size="26" font-weight="bold" fill="#8a6015" filter="url(#rough2)">--</text>
  <text x="150" y="148" text-anchor="middle" font-size="15" fill="#2f4a66" filter="url(#rough2)">数字 0</text>
  <text x="380" y="148" text-anchor="middle" font-size="15" fill="#2f5223" filter="url(#rough2)">数字 1</text>
  <text x="610" y="148" text-anchor="middle" font-size="15" fill="#8a6015" filter="url(#rough2)">数字 2</text>

  <rect x="50" y="202" width="660" height="58" rx="9" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.4" filter="url(#rough2)" />
  <text x="68" y="226" font-size="12" fill="#2b2b2b" filter="url(#rough2)">解码规则：从左到右扫描；看到 `.` 输出 0 并前进 1 格；</text>
  <text x="68" y="248" font-size="12" fill="#2b2b2b" filter="url(#rough2)">看到 `-` 则再读一个字符：`-.` 输出 1，`--` 输出 2，并前进 2 格。</text>

  <text x="60" y="294" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">为什么不会歧义？</text>
  <text x="60" y="318" font-size="11.5" fill="#555" filter="url(#rough2)">三种 token 的首字符只有 `.` 和 `-`；`-` 后面必跟 `.` 或 `-`，所以每个位置都能唯一确定 token 长度。</text>
  <text x="60" y="340" font-size="11.5" fill="#555" filter="url(#rough2)">输入保证是合法编码；不需要回溯，也不会有“多个数字共用字符”的情况。</text>
</svg>