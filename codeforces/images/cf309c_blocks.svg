<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="240" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">把每个簇按二进制拆成 2^k 的块</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">数组大小也是 2 的幂，于是可以用"块"精确配对</text>
  <text x="150" y="95" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">例：簇 9 = 8+1，簇 2 = 2 → 块 {8,1,2}</text>
  <text x="150" y="133" text-anchor="start" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">数组按体积从小到大处理：找"最小的能装下它的块"，用掉后把剩余部分再拆成块</text>
  <text x="150" y="171" text-anchor="start" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">这样小数组不会浪费大块，答案最大</text>
</svg>
