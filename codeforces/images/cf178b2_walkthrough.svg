<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="29"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例走查：桥树上的距离</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="60.0" y="96.0" text-anchor="start" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">商人</text>
  <text x="170.0" y="96.0" text-anchor="start" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">仓库 s</text>
  <text x="280.0" y="96.0" text-anchor="start" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">商店 l</text>
  <text x="400.0" y="96.0" text-anchor="start" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">所在块</text>
  <text x="560.0" y="96.0" text-anchor="start" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">距离 = 经过的桥数</text>
  <rect x="48.0" y="112.0" width="630.0" height="42.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="60.0" y="140.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="170.0" y="140.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="280.0" y="140.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <text x="400.0" y="140.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">{1} → {3,4,5,7}</text>
  <text x="560.0" y="140.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <rect x="48.0" y="166.0" width="630.0" height="42.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="60.0" y="194.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="170.0" y="194.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="280.0" y="194.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="400.0" y="194.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">{2} → {3,4,5,7}</text>
  <text x="560.0" y="194.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <rect x="48.0" y="220.0" width="630.0" height="42.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="60.0" y="248.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="170.0" y="248.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="280.0" y="248.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">6</text>
  <text x="400.0" y="248.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">{2} → {3,4,5,7} → {6}</text>
  <text x="560.0" y="248.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <rect x="48.0" y="274.0" width="630.0" height="42.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="60.0" y="302.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="170.0" y="302.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="280.0" y="302.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">7</text>
  <text x="400.0" y="302.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">同一块 {3,4,5,7}</text>
  <text x="560.0" y="302.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <rect x="48.0" y="356.0" width="630.0" height="40.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="62.0" y="380.5" text-anchor="start" font-size="12.5" fill="#3f3420" filter="url(#rough2)">输出 2 1 2 0，与官方样例一致</text>
</svg>
