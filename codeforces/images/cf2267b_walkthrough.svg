<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="29"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="800" height="470" fill="#fafafa"/>

  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：a = [1,1,4,2,3,3,3,2]，计数 4→1、3→3、2→2、1→2</text>
  <path d="M 92 40 Q 400 48 708 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 左表：分层 -->
  <rect x="38" y="56" width="352" height="188" rx="10" fill="none" stroke="#a9a9a9" stroke-width="1.3"
        stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="214" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">按层构造（maxc = 3）</text>

  <text x="62" y="106" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">ℓ</text>
  <text x="186" y="106" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">本层元素（降序）</text>
  <text x="300" y="106" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">层内众数</text>
  <text x="364" y="106" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">累计</text>
  <path d="M 48 114 L 380 114" stroke="#b0b0b0" stroke-width="1.1" fill="none" filter="url(#rough2)"/>

  <text x="62" y="138" text-anchor="middle" font-size="12" fill="#8c3b38" filter="url(#rough2)">1</text>
  <text x="186" y="138" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">4 3 2 1</text>
  <text x="300" y="138" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">4 4 4 4</text>
  <text x="364" y="138" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">16</text>

  <text x="62" y="168" text-anchor="middle" font-size="12" fill="#8c3b38" filter="url(#rough2)">2</text>
  <text x="186" y="168" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">3 2 1</text>
  <text x="300" y="168" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">3 3 3</text>
  <text x="364" y="168" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">25</text>

  <text x="62" y="198" text-anchor="middle" font-size="12" fill="#8c3b38" filter="url(#rough2)">3</text>
  <text x="186" y="198" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">3</text>
  <text x="300" y="198" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">3</text>
  <text x="364" y="198" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">28</text>

  <path d="M 48 210 L 380 210" stroke="#b0b0b0" stroke-width="1.1" fill="none" filter="url(#rough2)"/>
  <text x="186" y="232" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">输出：4 3 2 1 3 2 1 3</text>

  <!-- 右表：逐前缀 -->
  <rect x="410" y="56" width="360" height="300" rx="10" fill="none" stroke="#a9a9a9" stroke-width="1.3"
        stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="590" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">逐个前缀核对（众数之和）</text>

  <text x="440" y="106" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">p</text>
  <text x="524" y="106" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">前缀（新增粗体）</text>
  <text x="642" y="106" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">众数</text>
  <text x="722" y="106" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">累计</text>
  <path d="M 420 114 L 760 114" stroke="#b0b0b0" stroke-width="1.1" fill="none" filter="url(#rough2)"/>

  <text x="440" y="134" text-anchor="middle" font-size="11.5" fill="#8c3b38" filter="url(#rough2)">1</text>
  <text x="524" y="134" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">4</text>
  <text x="642" y="134" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">4</text>
  <text x="722" y="134" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">4</text>

  <text x="440" y="156" text-anchor="middle" font-size="11.5" fill="#8c3b38" filter="url(#rough2)">2</text>
  <text x="524" y="156" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">4 3</text>
  <text x="642" y="156" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">4</text>
  <text x="722" y="156" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">8</text>

  <text x="440" y="178" text-anchor="middle" font-size="11.5" fill="#8c3b38" filter="url(#rough2)">3</text>
  <text x="524" y="178" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">4 3 2</text>
  <text x="642" y="178" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">4</text>
  <text x="722" y="178" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">12</text>

  <text x="440" y="200" text-anchor="middle" font-size="11.5" fill="#8c3b38" filter="url(#rough2)">4</text>
  <text x="524" y="200" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">4 3 2 1</text>
  <text x="642" y="200" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">4</text>
  <text x="722" y="200" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">16</text>

  <text x="440" y="222" text-anchor="middle" font-size="11.5" fill="#8c3b38" filter="url(#rough2)">5</text>
  <text x="524" y="222" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">… 3</text>
  <text x="642" y="222" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">3</text>
  <text x="722" y="222" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">19</text>

  <text x="440" y="244" text-anchor="middle" font-size="11.5" fill="#8c3b38" filter="url(#rough2)">6</text>
  <text x="524" y="244" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">… 2</text>
  <text x="642" y="244" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">3</text>
  <text x="722" y="244" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">22</text>

  <text x="440" y="266" text-anchor="middle" font-size="11.5" fill="#8c3b38" filter="url(#rough2)">7</text>
  <text x="524" y="266" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">… 1</text>
  <text x="642" y="266" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">3</text>
  <text x="722" y="266" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">25</text>

  <text x="440" y="288" text-anchor="middle" font-size="11.5" fill="#8c3b38" filter="url(#rough2)">8</text>
  <text x="524" y="288" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">… 3</text>
  <text x="642" y="288" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">3</text>
  <text x="722" y="288" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">28</text>

  <path d="M 420 300 L 760 300" stroke="#b0b0b0" stroke-width="1.1" fill="none" filter="url(#rough2)"/>
  <text x="590" y="322" text-anchor="middle" font-size="11.5" fill="#8c3b38" filter="url(#rough2)">众数之和 = 4·4 + 3·4 = 28（最优）</text>
  <text x="590" y="342" text-anchor="middle" font-size="11.5" fill="#5a5a5a" filter="url(#rough2)">第 5 步众数从 4 掉到 3，之后不再变化</text>

  <!-- 结论条 -->
  <rect x="60" y="372" width="680" height="76" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="400" y="394" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">官方输出 4 3 2 1 3 3 1 2 的总和同样是 28：题目允许输出任意最优排列</text>
  <text x="400" y="416" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">所以自测时要比较「众数之和」，不要逐字比对官方输出</text>
  <text x="400" y="438" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">陷阱：直接降序输出 4 3 3 3 2 2 1 1 只有 26 分，第 3 个前缀就丢了众数 4</text>
</svg>
