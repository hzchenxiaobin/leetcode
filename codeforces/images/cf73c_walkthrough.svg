<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="83"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="wk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="720" height="400" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例一：winner → looser（改 4 个字母），悦耳度 36</text>
  <path d="M 130 38 Q 360 44 590 38" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 两行字母 -->
  <g filter="url(#rough2)" font-size="20" font-weight="bold" text-anchor="middle">
    <text x="120" y="94" fill="#555">w</text><text x="200" y="94" fill="#555">i</text><text x="280" y="94" fill="#555">n</text>
    <text x="360" y="94" fill="#555">n</text><text x="440" y="94" fill="#555">e</text><text x="520" y="94" fill="#555">r</text>
  </g>
  <text x="60" y="94" font-size="12" fill="#555" filter="url(#rough2)">原串</text>

  <g filter="url(#rough2)" font-size="20" font-weight="bold" text-anchor="middle">
    <text x="120" y="170" fill="#8c2f2b">l</text><text x="200" y="170" fill="#8c2f2b">o</text><text x="280" y="170" fill="#8c2f2b">o</text>
    <text x="360" y="170" fill="#2f7a3a">s</text><text x="440" y="170" fill="#1f5226">e</text><text x="520" y="170" fill="#1f5226">r</text>
  </g>
  <text x="60" y="170" font-size="12" fill="#2f4a66" filter="url(#rough2)">新串</text>

  <!-- 修改箭头 -->
  <g filter="url(#rough2)" stroke="#b85450" stroke-width="1.6" fill="none">
    <line x1="120" y1="106" x2="120" y2="150" marker-end="url(#wk)"/>
    <line x1="200" y1="106" x2="200" y2="150" marker-end="url(#wk)"/>
    <line x1="280" y1="106" x2="280" y2="150" marker-end="url(#wk)"/>
  </g>

  <!-- 相邻奖励 -->
  <g filter="url(#rough2)" font-size="12" font-weight="bold" fill="#4b2a70">
    <rect x="140" y="196" width="60" height="30" rx="7" fill="#f3e8fd" stroke="#7b4fa8" stroke-width="1.3"/>
    <text x="170" y="216" text-anchor="middle">13</text>
    <rect x="212" y="196" width="60" height="30" rx="7" fill="#f3e8fd" stroke="#7b4fa8" stroke-width="1.3"/>
    <text x="242" y="216" text-anchor="middle">8</text>
    <rect x="284" y="196" width="60" height="30" rx="7" fill="#f3e8fd" stroke="#7b4fa8" stroke-width="1.3"/>
    <text x="314" y="216" text-anchor="middle">8</text>
    <rect x="356" y="196" width="60" height="30" rx="7" fill="#f3e8fd" stroke="#7b4fa8" stroke-width="1.3"/>
    <text x="386" y="216" text-anchor="middle">7</text>
    <rect x="428" y="196" width="60" height="30" rx="7" fill="#f3e8fd" stroke="#7b4fa8" stroke-width="1.3"/>
    <text x="458" y="216" text-anchor="middle">0</text>
  </g>
  <text x="170" y="244" text-anchor="middle" font-size="10.5" fill="#4b2a70" filter="url(#rough2)">l→o</text>
  <text x="242" y="244" text-anchor="middle" font-size="10.5" fill="#4b2a70" filter="url(#rough2)">o→o</text>
  <text x="314" y="244" text-anchor="middle" font-size="10.5" fill="#4b2a70" filter="url(#rough2)">o→s</text>
  <text x="386" y="244" text-anchor="middle" font-size="10.5" fill="#4b2a70" filter="url(#rough2)">s→e</text>
  <text x="458" y="244" text-anchor="middle" font-size="10.5" fill="#4b2a70" filter="url(#rough2)">e→r</text>

  <rect x="60" y="272" width="600" height="106" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="298" font-size="13" font-weight="bold" fill="#8a6015">13 + 8 + 8 + 7 + 0 = 36，恰好用完 k = 4 次修改</text>
  <text x="76" y="324" font-size="11.5" fill="#7a5a1b">原串 winner 的 5 对相邻字母全都没有奖励，得分 0；改动 4 位后拿到 36。</text>
  <text x="76" y="350" font-size="11.5" fill="#7a5a1b">第 2、3 位都变成 o、s：DP 只需记住“上一位字母”就能正确累加每一对奖励。</text>
  <text x="76" y="374" font-size="11.5" fill="#7a5a1b">e、r 未改动，所以只花了 4 次修改（w→l、i→o、n→o、n→s）。</text>
</svg>
