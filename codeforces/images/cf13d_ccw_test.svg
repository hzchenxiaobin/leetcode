<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="61"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="760" height="450" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">内部 = 三条有向边正侧的交</text>
  <path d="M 200 40 Q 380 46 560 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 三角形 -->
  <polygon points="160,140 600,190 360,400" fill="#fdf3e0" stroke="#c98a2b" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- 有向边 -->
  <path d="M 160 140 L 600 190" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 600 190 L 360 400" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 360 400 L 160 140" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 顶点 -->
  <circle cx="160" cy="140" r="4" fill="#8a6015" filter="url(#rough2)"/>
  <text x="146" y="130" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">A</text>
  <circle cx="600" cy="190" r="4" fill="#8a6015" filter="url(#rough2)"/>
  <text x="610" y="186" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">B</text>
  <circle cx="360" cy="400" r="4" fill="#8a6015" filter="url(#rough2)"/>
  <text x="348" y="424" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">C</text>

  <!-- 内部蓝点 -->
  <circle cx="370" cy="250" r="6" fill="#446688" filter="url(#rough2)"/>
  <text x="384" y="248" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">P（蓝点）</text>
  <text x="384" y="266" font-size="11" fill="#2f4a66" filter="url(#rough2)">三条边都为正 → 内部</text>

  <!-- 外部蓝点 -->
  <circle cx="660" cy="110" r="6" fill="#b85450" filter="url(#rough2)"/>
  <text x="612" y="98" font-size="12" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">Q</text>
  <text x="560" y="78" font-size="11" fill="#8a2b28" filter="url(#rough2)">Q 对 A→B 的叉积为负 → 外部</text>

  <!-- 说明 -->
  <text x="40" y="70" font-size="12" fill="#2b2b2b" filter="url(#rough2)">判定式：cross(u, v, p) = (v−u) × (p−u) &gt; 0</text>
  <text x="40" y="92" font-size="12" fill="#2b2b2b" filter="url(#rough2)">三条边各给一个半平面，交集就是三角形内部</text>

  <text x="40" y="446" font-size="12" fill="#8a6015" filter="url(#rough2)">顶点顺序必须让 cross(A,B,C) &gt; 0——顺序反了，“正侧”就变成三角形外面。</text>
</svg>
