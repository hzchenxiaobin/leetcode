<svg xmlns="http://www.w3.org/2000/svg" width="760" height="452" viewBox="0 0 760 452"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="760" height="452" fill="#fafafa"/>

  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：危险只由「最大的两个」决定</text>
  <path d="M 150 46 Q 380 52 610 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 高亮框：只看最后两列 -->
  <rect x="392" y="84" width="192" height="180" rx="10" fill="none" stroke="#b85450"
        stroke-width="1.8" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="488" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">只有这两列互相牵制</text>

  <text x="104" y="128" text-anchor="end" font-size="12" fill="#446688" filter="url(#rough2)">上限 a（已排序）</text>
  <text x="104" y="228" text-anchor="end" font-size="12" fill="#4a7a3a" filter="url(#rough2)">最终 b</text>

  <rect x="120" y="98" width="74" height="54" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="157" y="132" text-anchor="middle" font-size="18" fill="#2f4a66" filter="url(#rough2)">1</text>
  <rect x="216" y="98" width="74" height="54" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="253" y="132" text-anchor="middle" font-size="18" fill="#2f4a66" filter="url(#rough2)">2</text>
  <rect x="312" y="98" width="74" height="54" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="349" y="132" text-anchor="middle" font-size="18" fill="#2f4a66" filter="url(#rough2)">3</text>
  <rect x="408" y="98" width="74" height="54" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="445" y="132" text-anchor="middle" font-size="18" fill="#2f4a66" filter="url(#rough2)">6</text>
  <rect x="504" y="98" width="74" height="54" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="541" y="132" text-anchor="middle" font-size="18" fill="#8a6015" filter="url(#rough2)">10</text>

  <path d="M 157 156 L 157 192" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 253 156 L 253 192" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 349 156 L 349 192" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 445 156 L 445 192" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 541 156 L 541 192" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <rect x="120" y="198" width="74" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="157" y="232" text-anchor="middle" font-size="18" fill="#2f5223" filter="url(#rough2)">1</text>
  <rect x="216" y="198" width="74" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="253" y="232" text-anchor="middle" font-size="18" fill="#2f5223" filter="url(#rough2)">1</text>
  <rect x="312" y="198" width="74" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="349" y="232" text-anchor="middle" font-size="18" fill="#2f5223" filter="url(#rough2)">1</text>
  <rect x="408" y="198" width="74" height="54" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="445" y="232" text-anchor="middle" font-size="18" fill="#a33b36" filter="url(#rough2)">1</text>
  <rect x="504" y="198" width="74" height="54" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="541" y="232" text-anchor="middle" font-size="18" fill="#8a6015" filter="url(#rough2)">10</text>

  <text x="445" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#a33b36" filter="url(#rough2)">x</text>
  <text x="541" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">y</text>

  <!-- 说明框 -->
  <rect x="44" y="290" width="326" height="66" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="207" y="314" text-anchor="middle" font-size="12.5" fill="#2f5223" filter="url(#rough2)">前 n-2 个：b_i = min(a_i, x)</text>
  <text x="207" y="336" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">它们两两乘积 ≤ x·x ≤ x·y &lt; ℓ</text>

  <rect x="392" y="290" width="326" height="66" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="555" y="314" text-anchor="middle" font-size="12.5" fill="#a33b36" filter="url(#rough2)">后两个：b_{n-1} = x，b_n = y，x ≤ y</text>
  <text x="555" y="336" text-anchor="middle" font-size="11.5" fill="#7a2f2b" filter="url(#rough2)">唯一约束：x·y ≤ ℓ - 1</text>

  <rect x="104" y="370" width="552" height="62" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="394" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">S(x) = Σ_{i ≤ n-2} min(a_i, x)，y = min(a_n, ⌊(ℓ-1)/x⌋)</text>
  <text x="380" y="418" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">答案 = Σa_i - max_x [ S(x) + x + y ]</text>
</svg>
