<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="880" height="560" fill="#fafafa"/>

  <text x="440.0" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">反例：两个阿波罗尼斯圆内含，候选点为空</text>
  <path d="M 190 42 Q 440.0 49 720 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <circle cx="324.0" cy="356.0" r="24.0" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="324.0" cy="356.0" r="3.5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="564.0" cy="356.0" r="48.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="564.0" cy="356.0" r="3.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="444.0" cy="164.0" r="72.0" fill="#f3e8fb" stroke="#7a4a8a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="444.0" cy="164.0" r="3.5" fill="#7a4a8a" filter="url(#rough2)"/>
  <text x="318.0" y="386.0" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">C₁ r=10</text>
  <text x="594.0" y="396.0" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">C₂ r=20</text>
  <text x="444.0" y="84.0" text-anchor="middle" font-size="11.5" fill="#6a3a7a" filter="url(#rough2)">C₃ r=30</text>
  <circle cx="244.0" cy="356.0" r="160.0" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="8 6" filter="url(#rough2)"/>
  <circle cx="309.0" cy="380.0" r="84.9" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="8 6" filter="url(#rough2)"/>
  <text x="244.0" y="188.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">Γ₁₂</text>
  <text x="309.0" y="286.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#a14340" filter="url(#rough2)">Γ₁₃</text>
  <circle cx="244.0" cy="356.0" r="3" fill="#d6a040" filter="url(#rough2)"/>
  <circle cx="309.0" cy="380.0" r="3" fill="#b85450" filter="url(#rough2)"/>
  <rect x="642.0" y="96.0" width="214.0" height="130.0" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="749.0" y="124.0" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">Γ₁₃ 完全落在</text>
  <text x="749.0" y="146.0" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">Γ₁₂ 的内部</text>
  <text x="749.0" y="172.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#a14340" filter="url(#rough2)">两圆无交点</text>
  <text x="749.0" y="200.0" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">⇒ 不存在等角点</text>
  <rect x="642.0" y="244.0" width="214.0" height="112.0" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="749.0" y="270.0" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">程序行为</text>
  <text x="749.0" y="296.0" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">不输出任何内容</text>
  <text x="749.0" y="320.0" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">（输出文件留空）</text>
  <text x="749.0" y="342.0" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">判题器接受空输出</text>
  <text x="300.0" y="520.0" text-anchor="middle" font-size="12.5" fill="#66788c" filter="url(#rough2)">橙色虚线 Γ₁₂、红色虚线 Γ₁₃ 分别是与圆 1、2 和圆 1、3 等张角的点集</text>
  <text x="300.0" y="542.0" text-anchor="middle" font-size="12.5" fill="#66788c" filter="url(#rough2)">Γ₁₂ 半径 66.7、Γ₁₃ 半径 35.4，圆心距 28.9 &lt; 31.3，故 Γ₁₃ 内含于 Γ₁₂</text>
</svg>
