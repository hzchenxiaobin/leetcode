<svg xmlns="http://www.w3.org/2000/svg" width="860" height="560" viewBox="0 0 860 560"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="15"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="860" height="560" fill="#fafafa"/>

  <text x="430" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">X 先手：两手一交替，数量差只能是 0 或 1</text>
  <path d="M 130 48 Q 430 54 730 48" stroke="#2b2b2b" stroke-width="1.2" fill="none"
        filter="url(#rough2)"/>

  <!-- 棋盘：按手数编号 -->
  <g filter="url(#rough2)">
    <rect x="70" y="110" width="86" height="86" fill="#dbe7fb" stroke="#446688" stroke-width="1.4"/>
    <rect x="156" y="110" width="86" height="86" fill="#fde8e8" stroke="#b85450" stroke-width="1.4"/>
    <rect x="242" y="110" width="86" height="86" fill="#dbe7fb" stroke="#446688" stroke-width="1.4"/>
    <rect x="70" y="196" width="86" height="86" fill="#fde8e8" stroke="#b85450" stroke-width="1.4"/>
    <rect x="156" y="196" width="86" height="86" fill="#dbe7fb" stroke="#446688" stroke-width="1.4"/>
    <rect x="242" y="196" width="86" height="86" fill="#fde8e8" stroke="#b85450" stroke-width="1.4"/>
    <rect x="70" y="282" width="86" height="86" fill="#dbe7fb" stroke="#446688" stroke-width="1.4"/>
    <rect x="156" y="282" width="86" height="86" fill="#fde8e8" stroke="#b85450" stroke-width="1.4"/>
    <rect x="242" y="282" width="86" height="86" fill="#dbe7fb" stroke="#446688" stroke-width="1.4"/>
    <rect x="70" y="110" width="258" height="258" fill="none" stroke="#2b2b2b" stroke-width="1.8"/>
  </g>
  <text x="113" y="166" text-anchor="middle" font-size="26" fill="#23405c" filter="url(#rough2)">1</text>
  <text x="199" y="166" text-anchor="middle" font-size="26" fill="#8c3b37" filter="url(#rough2)">2</text>
  <text x="285" y="166" text-anchor="middle" font-size="26" fill="#23405c" filter="url(#rough2)">3</text>
  <text x="113" y="252" text-anchor="middle" font-size="26" fill="#8c3b37" filter="url(#rough2)">4</text>
  <text x="199" y="252" text-anchor="middle" font-size="26" fill="#23405c" filter="url(#rough2)">5</text>
  <text x="285" y="252" text-anchor="middle" font-size="26" fill="#8c3b37" filter="url(#rough2)">6</text>
  <text x="113" y="338" text-anchor="middle" font-size="26" fill="#23405c" filter="url(#rough2)">7</text>
  <text x="199" y="338" text-anchor="middle" font-size="26" fill="#8c3b37" filter="url(#rough2)">8</text>
  <text x="285" y="338" text-anchor="middle" font-size="26" fill="#23405c" filter="url(#rough2)">9</text>

  <text x="199" y="392" text-anchor="middle" font-size="12.5" fill="#44597a"
        filter="url(#rough2)">蓝格 = X 的第 1、3、5… 手；粉格 = 0 的第 2、4、6… 手</text>
  <text x="199" y="414" text-anchor="middle" font-size="12" fill="#7a8ca6"
        filter="url(#rough2)">任意时刻已落子的手数决定下一位是谁</text>

  <!-- 右侧三种数量关系 -->
  <rect x="392" y="110" width="430" height="104" rx="8" fill="#eef1f7" stroke="#7a8ca6"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="412" y="136" font-size="15" font-weight="bold" fill="#33445c"
        filter="url(#rough2)">cx = co（偶数手刚下完）</text>
  <text x="412" y="162" font-size="12.5" fill="#44597a" filter="url(#rough2)">X 与 0 一样多 → 轮到先手 X 落子</text>
  <text x="412" y="192" font-size="13" fill="#2f5223" filter="url(#rough2)">输出 first</text>

  <rect x="392" y="236" width="430" height="104" rx="8" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="412" y="262" font-size="15" font-weight="bold" fill="#8a6015"
        filter="url(#rough2)">cx = co + 1（奇数手刚下完）</text>
  <text x="412" y="288" font-size="12.5" fill="#8a6015" filter="url(#rough2)">X 比 0 多一个 → 轮到后手 0 落子</text>
  <text x="412" y="318" font-size="13" fill="#8a6015" filter="url(#rough2)">输出 second</text>

  <rect x="392" y="362" width="430" height="104" rx="8" fill="#fde8e8" stroke="#b85450"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="412" y="388" font-size="15" font-weight="bold" fill="#8c3b37"
        filter="url(#rough2)">其他任何情况</text>
  <text x="412" y="414" font-size="12.5" fill="#8c3b37" filter="url(#rough2)">|cx − co| ≥ 2，或 0 比 X 多</text>
  <text x="412" y="444" font-size="13" fill="#8c3b37" filter="url(#rough2)">输出 illegal</text>

  <text x="430" y="512" text-anchor="middle" font-size="12" fill="#666"
        filter="url(#rough2)">注意：满盘时 cx = 5、co = 4，差值为 1 看似「轮到 0」，但棋局已平——终局判词要先判。</text>
</svg>
