<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>

  <g filter="url(#rough2)">
  <text x="320" y="28" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">样例 8 走查：a = [2,1,4,3,6,5]，b = [−1,3,−1,−1,−1,−1]</text>
  <text x="320" y="50" text-anchor="middle" font-size="10.5" fill="#888">a 的三个环都是对换：(1 2)、(3 4)、(5 6)；长度相同才允许配对</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="68" width="560" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <text x="125" y="87" text-anchor="middle" font-size="10.5" fill="#2f4d6b" font-weight="bold">决策点</text>
    <text x="300" y="87" text-anchor="middle" font-size="10.5" fill="#2f4d6b" font-weight="bold">源环 → 目标环</text>
    <text x="420" y="87" text-anchor="middle" font-size="10.5" fill="#2f4d6b" font-weight="bold">shift</text>
    <text x="530" y="87" text-anchor="middle" font-size="10.5" fill="#2f4d6b" font-weight="bold">写入的 b</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="96" width="560" height="40" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="4"/>
    <text x="62" y="121" font-size="10" fill="#444">已知 b₂ = 3</text>
    <text x="232" y="121" font-size="10" fill="#444">(1 2) → (3 4)</text>
    <text x="412" y="121" font-size="10" fill="#444">1</text>
    <text x="470" y="121" font-size="10" fill="#444">b₁=4，b₂=3</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="136" width="560" height="40" fill="#fafafa" stroke="#bbbbbb" stroke-width="1" rx="4"/>
    <text x="62" y="161" font-size="10" fill="#444">i = 3（(3 4) 的最小元）</text>
    <text x="232" y="161" font-size="10" fill="#444">(3 4) → (1 2)</text>
    <text x="412" y="161" font-size="10" fill="#444">0</text>
    <text x="470" y="161" font-size="10" fill="#444">b₃=1，b₄=2</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="176" width="560" height="40" fill="#ffffff" stroke="#bbbbbb" stroke-width="1" rx="4"/>
    <text x="62" y="201" font-size="10" fill="#444">i = 5（(5 6) 的最小元）</text>
    <text x="232" y="201" font-size="10" fill="#444">(5 6) → (5 6)</text>
    <text x="412" y="201" font-size="10" fill="#444">0</text>
    <text x="470" y="201" font-size="10" fill="#444">b₅=5，b₆=6</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="224" width="560" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6"/>
    <text x="62" y="248" font-size="11" fill="#8a6a20" font-weight="bold">结果 b = [4, 3, 1, 2, 5, 6]</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="276" width="560" height="118" fill="#f7f9fb" stroke="#9db4c8" stroke-width="1.2" rx="8"/>
    <text x="58" y="297" font-size="10.5" fill="#446688" font-weight="bold">为什么 shift 被算成 1？</text>
    <text x="58" y="315" font-size="10.5" fill="#555">pos 从环的最小元素起数：环 (1 2) 中 pos(2)=1，环 (3 4) 中 pos(3)=0</text>
    <text x="58" y="333" font-size="10.5" fill="#555">shift = (0 − 1) mod 2 = 1，于是 b₁ = (3 4)[(0 + 1)] = 4，b₂ = (3 4)[(1 + 1)] = 3</text>
    <text x="58" y="353" font-size="10.5" fill="#446688" font-weight="bold">为什么 i = 3 不选 (5 6)？</text>
    <text x="58" y="371" font-size="10.5" fill="#555">可用目标环为 (1 2) 与 (5 6)，最小元素 1 &lt; 5，取小者才让 b₃ 最小</text>
    <text x="58" y="389" font-size="10.5" fill="#555">到 i = 5 只剩 (5 6)，shift=0 给出 b₅=5、b₆=6，与官方输出一致</text>
  </g>
</svg>
