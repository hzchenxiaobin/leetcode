<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="97"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ab2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8a6015"/>
    </marker>
  </defs>

  <rect width="720" height="460" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">下界的两块拼图：出发时刻 ≥ 直线距离；两段飞行 ≥ 出发星球距离</text>
  <path d="M 50 42 Q 360 48 670 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 左：折线 1 -> e -> u -->
  <rect x="30" y="58" width="330" height="224" rx="12" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="46" y="82" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">消息传到 u 的路程 ≥ d(1,u)</text>

  <g filter="url(#rough2)">
    <circle cx="78" cy="236" r="7" fill="#e8f0fe" stroke="#2f4a66" stroke-width="1.8"/>
    <circle cx="196" cy="126" r="7" fill="#fff8e1" stroke="#8a6015" stroke-width="1.8"/>
    <circle cx="316" cy="200" r="7" fill="#e6f4ea" stroke="#2f5223" stroke-width="1.8"/>
    <text x="64" y="250" font-size="12" font-weight="bold" fill="#2f4a66">1</text>
    <text x="200" y="116" font-size="12" font-weight="bold" fill="#8a6015">e</text>
    <text x="324" y="216" font-size="12" font-weight="bold" fill="#2f5223">u</text>

    <path d="M 84 231 L 190 133" stroke="#d6a040" stroke-width="2.2" fill="none" marker-end="url(#ab2)"/>
    <path d="M 202 133 L 310 194" stroke="#d6a040" stroke-width="2.2" fill="none" marker-end="url(#ab2)"/>
    <line x1="84" y1="231" x2="310" y2="205" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="6 4"/>

    <text x="106" y="182" font-size="11" fill="#8a6015">d(1,e)</text>
    <text x="248" y="166" font-size="11" fill="#8a6015">d(e,u)</text>
    <text x="150" y="228" font-size="11" fill="#2f5223">d(1,u)</text>
  </g>

  <text x="46" y="262" font-size="10.8" fill="#555" filter="url(#rough2)">折线更长 → 抵达 u 的时刻 p ≥ d(1,e)+d(e,u)。</text>

  <!-- 右：三角形 a-X-c -->
  <rect x="376" y="58" width="314" height="224" rx="12" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="392" y="82" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">两船在 X 相遇：d(a,c) ≤ |aX| + |Xc|</text>

  <g filter="url(#rough2)">
    <line x1="408" y1="216" x2="650" y2="216" stroke="#446688" stroke-width="1.8"/>
    <line x1="408" y1="216" x2="524" y2="114" stroke="#b85450" stroke-width="1.8"/>
    <line x1="650" y1="216" x2="524" y2="114" stroke="#b85450" stroke-width="1.8"/>
    <circle cx="408" cy="216" r="7" fill="#e8f0fe" stroke="#2f4a66" stroke-width="1.8"/>
    <circle cx="650" cy="216" r="7" fill="#e6f4ea" stroke="#2f5223" stroke-width="1.8"/>
    <circle cx="524" cy="114" r="7" fill="#fdecea" stroke="#b85450" stroke-width="1.8"/>
    <text x="392" y="230" font-size="12" font-weight="bold" fill="#2f4a66">a</text>
    <text x="658" y="230" font-size="12" font-weight="bold" fill="#2f5223">c</text>
    <text x="516" y="104" font-size="12" font-weight="bold" fill="#8f3a34">X</text>
    <text x="440" y="164" font-size="10.5" fill="#8f3a34">t − p₁</text>
    <text x="596" y="164" font-size="10.5" fill="#8f3a34">t − p₂</text>
    <text x="530" y="234" font-size="10.5" fill="#2f4a66">d(a,c)</text>
  </g>
  <rect x="392" y="244" width="282" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="404" y="262" font-size="10.8" fill="#2f5223" filter="url(#rough2)">p₁ ≥ d(1,a)，p₂ ≥ d(1,c) ⇒ t ≥ T(a,c)</text>

  <!-- 结论 -->
  <rect x="30" y="300" width="660" height="140" rx="12" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="46" y="324" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">把两块拼起来</text>
  <text x="46" y="348" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">2t ≥ p₁ + p₂ + d(a,c) ≥ d(1,a) + d(1,c) + d(a,c) = 2·T(a,c)</text>
  <text x="46" y="370" font-size="11.5" fill="#2f5223" filter="url(#rough2)">只要 a、c 都不是 1 号行星且 a ≠ c，就得到 t ≥ T(a,c) ≥ min 半周长。</text>
  <text x="46" y="394" font-size="11.5" fill="#8f3a34" filter="url(#rough2)">a = c 会迫使 b、a、d 共线；其中一艘来自 1 号且另一艘是「直飞抵达」时会迫使 1、c、b 共线。</text>
  <text x="46" y="416" font-size="11.5" fill="#8f3a34" filter="url(#rough2)">两种情况都被「无三点共线」排除，因此下界处处成立。</text>
</svg>
