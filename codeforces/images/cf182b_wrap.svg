<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="340" fill="#fafafa"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">时钟只有 1..d：自然进位与手动加一都在 d 之后回到 1</text>
  <path d="M 145.08000000000013 46 Q 380.0 52 614.9199999999998 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <circle cx="180.0" cy="160.0" r="92.0" fill="#eef3fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="245.1" y="98.9" text-anchor="middle" font-size="12" font-weight="bold" fill="#33506e" filter="url(#rough2)">1</text>
  <text x="272.0" y="164.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#33506e" filter="url(#rough2)">2</text>
  <text x="245.1" y="229.1" text-anchor="middle" font-size="12" font-weight="bold" fill="#33506e" filter="url(#rough2)">3</text>
  <text x="180.0" y="256.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#33506e" filter="url(#rough2)">4</text>
  <text x="114.9" y="229.1" text-anchor="middle" font-size="12" font-weight="bold" fill="#33506e" filter="url(#rough2)">5</text>
  <text x="88.0" y="164.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#33506e" filter="url(#rough2)">6</text>
  <text x="114.9" y="98.9" text-anchor="middle" font-size="12" font-weight="bold" fill="#33506e" filter="url(#rough2)">7</text>
  <text x="180.0" y="72.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#33506e" filter="url(#rough2)">8</text>
  <text x="180.0" y="164.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">d 之后</text>
  <text x="180.0" y="180.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">回到 1</text>
  <rect x="340.0" y="70.0" width="370.0" height="120.0" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="356.0" y="96.0" text-anchor="start" font-size="11.6" font-weight="bold" fill="#8a6015" filter="url(#rough2)">每个月的第 1 天：</text>
  <text x="356.0" y="122.0" text-anchor="start" font-size="11.2" fill="#2b2b2b" filter="url(#rough2)">时钟从 c 拨到 1，需要 (1−c+d) mod d 次。</text>
  <text x="356.0" y="148.0" text-anchor="start" font-size="11.2" fill="#2b2b2b" filter="url(#rough2)">之后每天自然 +1，本月第 j 天 = j ≤ a_i ≤ d。</text>
  <text x="356.0" y="174.0" text-anchor="start" font-size="11.2" fill="#2b2b2b" filter="url(#rough2)">月末停在第 a_i 天，下月第 1 天自然到 a_i+1。</text>
  <rect x="340.0" y="214.0" width="370.0" height="60.0" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="356.0" y="238.0" text-anchor="start" font-size="11.6" font-weight="bold" fill="#2f5b34" filter="url(#rough2)">所以下个月的起点：c ← a_i mod d + 1</text>
  <text x="356.0" y="260.0" text-anchor="start" font-size="10.8" fill="#6b6b6b" filter="url(#rough2)">（a_i = d 时回到 1，否则直接 +1）</text>
  <rect x="60.0" y="292.0" width="650.0" height="40.0" rx="8" fill="#fdf0ef" stroke="#b85450" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="74.0" y="316.0" text-anchor="start" font-size="11.2" fill="#8a3a36" filter="url(#rough2)">答案就是每个月开头拨钟次数之和：与天内细节无关，O(n)。</text>
</svg>
