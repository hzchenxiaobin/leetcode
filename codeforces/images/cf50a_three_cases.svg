  <line x1="60" y1="96" x2="60" y2="186" stroke="#9aa7b4" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="90" y1="96" x2="90" y2="186" stroke="#9aa7b4" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="120" y1="96" x2="120" y2="186" stroke="#9aa7b4" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="150" y1="96" x2="150" y2="186" stroke="#9aa7b4" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="180" y1="96" x2="180" y2="186" stroke="#9aa7b4" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="63" y="99" width="54" height="24" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.9" filter="url(#rough2)"/>
  <rect x="123" y="99" width="54" height="24" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.9" filter="url(#rough2)"/>
  <rect x="63" y="129" width="54" height="24" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.9" filter="url(#rough2)"/>
  <rect x="123" y="129" width="54" height="24" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.9" filter="url(#rough2)"/>
  <rect x="63" y="159" width="54" height="24" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.9" filter="url(#rough2)"/>
  <rect x="123" y="159" width="54" height="24" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="120" y="208" font-size="11.5" fill="#44546a" text-anchor="middle" filter="url(#rough2)">3 行 × 2 张 = 6 张 = ⌊12/2⌋</text>
  <text x="345.0" y="82" font-size="13" fill="#2f5223" text-anchor="middle" font-weight="bold" filter="url(#rough2)">n 奇、m 偶：每列竖铺</text>
  <line x1="300" y1="96" x2="390" y2="96" stroke="#9aa7b4" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="300" y1="126" x2="390" y2="126" stroke="#9aa7b4" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="300" y1="156" x2="390" y2="156" stroke="#9aa7b4" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="300" y1="186" x2="390" y2="186" stroke="#9aa7b4" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="300" y1="216" x2="390" y2="216" stroke="#9aa7b4" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="300" y1="96" x2="300" y2="216" stroke="#9aa7b4" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="330" y1="96" x2="330" y2="216" stroke="#9aa7b4" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="360" y1="96" x2="360" y2="216" stroke="#9aa7b4" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="390" y1="96" x2="390" y2="216" stroke="#9aa7b4" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="303" y="99" width="24" height="54" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.9" filter="url(#rough2)"/>
  <rect x="303" y="159" width="24" height="54" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.9" filter="url(#rough2)"/>
  <rect x="333" y="99" width="24" height="54" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.9" filter="url(#rough2)"/>
  <rect x="333" y="159" width="24" height="54" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.9" filter="url(#rough2)"/>
  <rect x="363" y="99" width="24" height="54" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.9" filter="url(#rough2)"/>
  <rect x="363" y="159" width="24" height="54" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="345.0" y="238" font-size="11.5" fill="#3c5e2e" text-anchor="middle" filter="url(#rough2)">3 列 × 2 张 = 6 张 = ⌊12/2⌋</text>
  <text x="585.0" y="82" font-size="13" fill="#7a5a1b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">m、n 皆奇：末行留 1 格</text>
  <line x1="540" y1="96" x2="630" y2="96" stroke="#9aa7b4" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="540" y1="126" x2="630" y2="126" stroke="#9aa7b4" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="540" y1="156" x2="630" y2="156" stroke="#9aa7b4" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="540" y1="186" x2="630" y2="186" stroke="#9aa7b4" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="540" y1="96" x2="540" y2="186" stroke="#9aa7b4" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="570" y1="96" x2="570" y2="186" stroke="#9aa7b4" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="600" y1="96" x2="600" y2="186" stroke="#9aa7b4" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="630" y1="96" x2="630" y2="186" stroke="#9aa7b4" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="543" y="99" width="24" height="54" rx="7" fill="#fff3e0" stroke="#d6a040" stroke-width="1.9" filter="url(#rough2)"/>
  <rect x="573" y="99" width="24" height="54" rx="7" fill="#fff3e0" stroke="#d6a040" stroke-width="1.9" filter="url(#rough2)"/>
  <rect x="603" y="99" width="24" height="54" rx="7" fill="#fff3e0" stroke="#d6a040" stroke-width="1.9" filter="url(#rough2)"/>
  <rect x="543" y="159" width="54" height="24" rx="7" fill="#fff3e0" stroke="#d6a040" stroke-width="1.9" filter="url(#rough2)"/>
  <rect x="603" y="159" width="24" height="24" rx="5" fill="#e4e4e4" stroke="#9a9a9a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="615.0" y="175.0" font-size="10" fill="#666" text-anchor="middle" filter="url(#rough2)">空</text>
  <text x="585.0" y="208" font-size="11.5" fill="#7a5a1b" text-anchor="middle" filter="url(#rough2)">4 张 = ⌊9/2⌋，剩 1 格</text>
  <rect x="60" y="330" width="640" height="72" rx="10" fill="#f2f6fb" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="358" font-size="12.5" fill="#2b2b2b" text-anchor="start" filter="url(#rough2)">三种情况穷尽所有奇偶组合：只要 m·n 为偶数就能铺满，为奇数就恰好剩一格。</text>
  <text x="80" y="384" font-size="12.5" fill="#2b2b2b" text-anchor="start" filter="url(#rough2)">每张骨牌占 2 格、不许切割 —— 所以「剩一格」不是近似，而是面积论证的下界被构造精确达到。</text>
</svg>
