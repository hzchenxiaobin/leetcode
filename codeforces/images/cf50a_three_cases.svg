<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="760" height="430" fill="#fafafa"/>
  <text x="380" y="36" font-size="20" fill="#2b2b2b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">按 m、n 的奇偶分三种构造</text>
  <path d="M 190 46 Q 380 52 570 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="120" y="82" font-size="13" fill="#2f4a66" text-anchor="middle" font-weight="bold" filter="url(#rough2)">n 为偶数：每行横铺</text>
  <line x1="60" y1="96" x2="180" y2="96" stroke="#9aa7b4" stroke-width="1.3" filter="url(#rough2)"/>
