<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="700" height="430" fill="#fafafa"/>

  <text x="350" y="28" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#444" filter="url(#rough2)">样例 4 走查：n = 6，p = 1 2 2 1 1，坝 = {1, 3, 5}</text>
  <text x="350" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">depth 最小的是 1 号（根），保留它；3 号、5 号的父边装摄像头</text>

  <!-- 左：树 -->
  <path d="M 150 80 L 70 180" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 150 80 L 150 180" stroke="#d6a040" stroke-width="3" fill="none" filter="url(#rough2)"/>
  <path d="M 150 80 L 235 180" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 70 180 L 40 275" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 70 180 L 115 275" stroke="#d6a040" stroke-width="3" fill="none" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="137" y="121" width="28" height="18" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <circle cx="151" cy="130" r="4" fill="none" stroke="#d6a040" stroke-width="1.4"/>
    <text x="168" y="116" font-size="10.5" fill="#b8860b">c1</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="79" y="218" width="28" height="18" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <circle cx="93" cy="227" r="4" fill="none" stroke="#d6a040" stroke-width="1.4"/>
    <text x="110" y="213" font-size="10.5" fill="#b8860b">c2</text>
  </g>

  <g filter="url(#rough2)">
    <circle cx="150" cy="80" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4"/>
    <text x="150" y="85" text-anchor="middle" font-size="12.5" fill="#2f5a24">1</text>
    <circle cx="70" cy="180" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.7"/>
    <text x="70" y="185" text-anchor="middle" font-size="12" fill="#333">2</text>
    <circle cx="150" cy="180" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="150" y="185" text-anchor="middle" font-size="12" fill="#2f5a24">3</text>
    <circle cx="235" cy="180" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.7"/>
    <text x="235" y="185" text-anchor="middle" font-size="12" fill="#333">6</text>
    <circle cx="40" cy="275" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.7"/>
    <text x="40" y="280" text-anchor="middle" font-size="12" fill="#333">4</text>
    <circle cx="115" cy="275" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="115" y="280" text-anchor="middle" font-size="12" fill="#2f5a24">5</text>
  </g>

  <text x="18" y="312" font-size="10.5" fill="#666" filter="url(#rough2)">绿 = 坝，橙粗边 = 摄像头</text>

  <!-- 右：表格 -->
  <g filter="url(#rough2)">
    <rect x="345" y="70" width="330" height="140" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <path d="M 345 105 L 675 105" stroke="#446688" stroke-width="1.2" fill="none"/>
    <path d="M 345 140 L 675 140" stroke="#ccc" stroke-width="1.1" fill="none"/>
    <path d="M 345 175 L 675 175" stroke="#ccc" stroke-width="1.1" fill="none"/>
    <path d="M 410 70 L 410 210" stroke="#ccc" stroke-width="1.1" fill="none"/>
    <path d="M 475 70 L 475 210" stroke="#ccc" stroke-width="1.1" fill="none"/>
    <path d="M 575 70 L 575 210" stroke="#ccc" stroke-width="1.1" fill="none"/>
  </g>

  <g filter="url(#rough2)" font-size="11.5">
    <text x="377" y="93" text-anchor="middle" fill="#446688">坝</text>
    <text x="442" y="93" text-anchor="middle" fill="#446688">深度</text>
    <text x="525" y="93" text-anchor="middle" fill="#446688">父边</text>
    <text x="625" y="93" text-anchor="middle" fill="#446688">摄像头</text>

    <text x="377" y="128" text-anchor="middle" fill="#2f5a24">1</text>
    <text x="442" y="128" text-anchor="middle" fill="#333">0</text>
    <text x="525" y="128" text-anchor="middle" fill="#999">—</text>
    <text x="625" y="128" text-anchor="middle" fill="#4a7a3a">否（保留）</text>

    <text x="377" y="163" text-anchor="middle" fill="#2f5a24">3</text>
    <text x="442" y="163" text-anchor="middle" fill="#333">1</text>
    <text x="525" y="163" text-anchor="middle" fill="#333">(1, 3)</text>
    <text x="625" y="163" text-anchor="middle" fill="#8a6a1f">是 → c1</text>

    <text x="377" y="198" text-anchor="middle" fill="#2f5a24">5</text>
    <text x="442" y="198" text-anchor="middle" fill="#333">2</text>
    <text x="525" y="198" text-anchor="middle" fill="#333">(2, 5)</text>
    <text x="625" y="198" text-anchor="middle" fill="#8a6a1f">是 → c2</text>
  </g>

  <text x="350" y="252" text-anchor="middle" font-size="13.5" fill="#8d3b37" filter="url(#rough2)">输出：2 5 3　（k = m − 1 = 2）</text>
  <text x="350" y="282" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">分块：{1,2,4,6} | {3} | {5}，每块恰有 1 个坝 ⇒ 序列两两不同</text>
  <text x="350" y="308" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">官方样例输出为 2 2 5（砍 (1,2) 与 (2,5)），同样合法：答案不唯一</text>

  <g filter="url(#rough2)">
    <rect x="60" y="338" width="580" height="66" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="76" y="364" font-size="12.5" fill="#2c4257">观测序列：坝 1 → [ ]，坝 3 → [c1]，坝 5 → [c2]，三条互不相同。</text>
    <text x="76" y="388" font-size="12.5" fill="#2c4257">k = m − 1 = 2；任何少于 2 条摄像头的方案都分不出这 3 个坝。</text>
  </g>
</svg>
