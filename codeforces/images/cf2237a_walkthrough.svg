<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.3"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="520" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">走查：a = [4,1,3,5,2]，按塔高从小到大处理</text>
  <path d="M 140 42 Q 380 49 620 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="380" y="66" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">处理序：2 号塔(高 1) → 5 号(高 2) → 3 号(高 3) → 1 号(高 4) → 4 号(高 5)；已被压过的塔直接跳过</text>

  <rect x="50" y="98" width="640" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="90" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">步骤</text>
  <text x="190" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">执行操作</text>
  <text x="345" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">触发（被压低的塔）</text>
  <text x="565" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">当前塔高</text>

  <rect x="50" y="132" width="640" height="270" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>

  <path d="M 50 186 L 690 186" stroke="#999" stroke-width="1.1" fill="none" filter="url(#rough2)"/>
  <path d="M 50 240 L 690 240" stroke="#999" stroke-width="1.1" fill="none" filter="url(#rough2)"/>
  <path d="M 50 294 L 690 294" stroke="#999" stroke-width="1.1" fill="none" filter="url(#rough2)"/>
  <path d="M 50 348 L 690 348" stroke="#999" stroke-width="1.1" fill="none" filter="url(#rough2)"/>

  <path d="M 130 98 L 130 402" stroke="#999" stroke-width="1.1" fill="none" filter="url(#rough2)"/>
  <path d="M 250 98 L 250 402" stroke="#999" stroke-width="1.1" fill="none" filter="url(#rough2)"/>
  <path d="M 440 98 L 440 402" stroke="#999" stroke-width="1.1" fill="none" filter="url(#rough2)"/>

  <text x="90" y="166" text-anchor="middle" font-size="13" font-weight="bold" fill="#a14340" filter="url(#rough2)">①</text>
  <text x="190" y="166" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">op(2)</text>
  <text x="345" y="166" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">3 号塔 3 → 1</text>
  <text x="565" y="166" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">[4,1,1,5,2]</text>

  <text x="90" y="218" text-anchor="middle" font-size="13" font-weight="bold" fill="#a14340" filter="url(#rough2)">②</text>
  <text x="190" y="218" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">op(3)</text>
  <text x="345" y="218" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">4 号塔 5 → 1</text>
  <text x="565" y="218" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">[4,1,1,1,2]</text>

  <text x="90" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#a14340" filter="url(#rough2)">③</text>
  <text x="190" y="272" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">op(4)</text>
  <text x="345" y="272" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">5 号塔 2 → 1</text>
  <text x="565" y="272" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">[4,1,1,1,1]</text>

  <text x="90" y="326" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">④</text>
  <text x="190" y="326" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">op(5)</text>
  <text x="345" y="326" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">右边没有塔</text>
  <text x="565" y="326" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">[4,1,1,1,1]</text>

  <text x="90" y="380" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">⑤</text>
  <text x="190" y="380" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">op(1)</text>
  <text x="345" y="380" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">右边都 ≤ 4</text>
  <text x="565" y="380" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">[4,1,1,1,1]</text>

  <path d="M 50 402 Q 370 408 690 402" stroke="#999" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <text x="380" y="432" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">②③④ 是 ① 引发的连锁：被压低的塔当下就开火，于是一次开火压平整段上升阶梯</text>

  <rect x="90" y="440" width="580" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="380" y="466" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a2a" filter="url(#rough2)">最终 [4,1,1,1,1]，和 = 4+1+1+1+1 = 8（正是样例 5 的答案）</text>

  <text x="380" y="504" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">前缀最小值 4,1,1,1,1 与最终塔高逐位相同 —— 这就是代码里只累加 best 的依据</text>
</svg>
