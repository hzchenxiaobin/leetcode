<svg xmlns="http://www.w3.org/2000/svg" width="840" height="340" viewBox="0 0 840 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="340" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">最终值 = 交错和 a₁ − a₂ + a₃ − … ± aₙ</text>
  <text x="420" y="56" text-anchor="middle" font-size="11.8" fill="#666666" filter="url(#rough2)">每次把最右两张 x,y 换成 x−y</text>
  <g filter="url(#rough2)"><rect x="170" y="96" width="80" height="50" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="210" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="210" y="166" text-anchor="middle" font-size="11" fill="#3d6b2f" filter="url(#rough2)">+a1</text>
  <g filter="url(#rough2)"><rect x="270" y="96" width="80" height="50" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="310" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="310" y="166" text-anchor="middle" font-size="11" fill="#8a4b2a" filter="url(#rough2)">−a2</text>
  <g filter="url(#rough2)"><rect x="370" y="96" width="80" height="50" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="410" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="410" y="166" text-anchor="middle" font-size="11" fill="#3d6b2f" filter="url(#rough2)">+a3</text>
  <g filter="url(#rough2)"><rect x="470" y="96" width="80" height="50" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="510" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="510" y="166" text-anchor="middle" font-size="11" fill="#8a4b2a" filter="url(#rough2)">−a4</text>
  <text x="420" y="216" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">4 − 1 + 1 − 3 = 1，与逐步合并结果一致</text>
  <text x="420" y="248" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">奇位共 k = ⌈n/2⌉ 个，偶位共 m = ⌊n/2⌋ 个</text>
  <g filter="url(#rough2)"><rect x="200" y="274" width="440" height="44" rx="4" fill="#f7fbf4" fill-opacity="0.85" stroke="#a8c99a" stroke-width="1.3"/></g>
  <text x="420" y="302" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3d6b2f" filter="url(#rough2)">奇位和 − 偶位和 = d，范围 [k − ml, kl − m]</text>
</svg>
