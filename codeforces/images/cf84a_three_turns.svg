<svg xmlns="http://www.w3.org/2000/svg" width="740" height="420" viewBox="0 0 740 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="740" height="420" fill="#fafafa"/>

  <text x="370" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">三回合：每人最多杀一个，总击杀 3n/2</text>
  <path d="M 148 41 Q 370 47 592 41" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="30" y="62" text-anchor="start" font-size="12.5" fill="#5b5b5b" filter="url(#rough2)">以 n = 4 为例（每方 4 人）</text>
  <circle cx="60" cy="110" r="9" fill="#dcebfb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="86" cy="110" r="9" fill="#dcebfb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="112" cy="110" r="9" fill="#dcebfb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="138" cy="110" r="9" fill="#dcebfb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="54" y="136" text-anchor="start" font-size="11.5" fill="#446688" filter="url(#rough2)">Valera</text>
  <circle cx="60" cy="190" r="9" fill="#f7ecec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="86" cy="190" r="9" fill="#f7ecec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="112" cy="190" r="9" fill="#f7ecec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="138" cy="190" r="9" fill="#f7ecec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="54" y="216" text-anchor="start" font-size="11.5" fill="#b85450" filter="url(#rough2)">Arcady</text>
  <text x="60" y="250" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">回合 1：Valera 4 人 → 杀 Arcady 2 人</text>
  <circle cx="60" cy="290" r="9" fill="#f7ecec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="86" cy="290" r="9" fill="#f7ecec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="112" cy="290" r="9" fill="none" stroke="#c0c0c0" stroke-width="1.2" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <circle cx="138" cy="290" r="9" fill="none" stroke="#c0c0c0" stroke-width="1.2" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <text x="54" y="316" text-anchor="start" font-size="11.5" fill="#b85450" filter="url(#rough2)">Arcady 剩 2</text>
  <text x="60" y="350" text-anchor="start" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">回合 2：Arcady 的 2 人 → 杀 Valera 2 人</text>
  <rect x="360" y="70" width="350" height="60" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="376" y="94" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">回合 1 击杀 k₁ ≤ n</text>
  <text x="376" y="116" text-anchor="start" font-size="11.5" fill="#5b5b5b" filter="url(#rough2)">被杀的不能再开枪</text>
  <rect x="360" y="144" width="350" height="60" rx="8" fill="#f7ecec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="376" y="168" text-anchor="start" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">回合 2：Arcady 只剩 n − k₁ 人</text>
  <text x="376" y="190" text-anchor="start" font-size="11.5" fill="#8a3b37" filter="url(#rough2)">所以 k₂ ≤ n − k₁</text>
  <rect x="360" y="218" width="350" height="60" rx="8" fill="#e9f4ec" stroke="#3f6b4a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="376" y="242" text-anchor="start" font-size="12.5" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">回合 3：Valera 剩 n − k₂ 人</text>
  <text x="376" y="264" text-anchor="start" font-size="11.5" fill="#2f5223" filter="url(#rough2)">所以 k₃ ≤ min(n − k₁, n − k₂)</text>
  <rect x="360" y="292" width="350" height="66" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="376" y="318" text-anchor="start" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">取 k₁ = k₂ = n/2 时总数 = 3n/2</text>
  <text x="376" y="342" text-anchor="start" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">（回合 3 仍有 n/2 人可开枪）</text>
  <text x="30" y="396" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">关键：死掉的士兵不会开枪，所以“多杀”与“保留火力”必须折中，最优是各回合各杀一半</text>
</svg>
