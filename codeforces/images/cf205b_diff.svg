<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="340" fill="#fafafa"/>
  <text x="360.0" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">205B：把数组看成分段抬升</text>
  <path d="M 144.00 46 Q 360.0 52 576.00 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="72" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">把数组看成高度曲线：一次区间 +1 只把某一段抬高 1。</text>
  <text x="60" y="92" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">答案 = Σ max(0, a[i] − a[i+1])：每个“下降”都必须被后面的抬升填平。</text>
  <line x1="80" y1="234.6" x2="190" y2="241.2" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <line x1="190" y1="241.2" x2="300" y2="247.8" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <line x1="300" y1="247.8" x2="410" y2="146.6" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="80" cy="234.6" r="5" fill="#cfe3c8" stroke="#2f5b34" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="80" y="222.6" text-anchor="middle" font-size="11" fill="#2f5b34" filter="url(#rough2)">7</text>
  <circle cx="190" cy="241.2" r="5" fill="#cfe3c8" stroke="#2f5b34" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="190" y="229.2" text-anchor="middle" font-size="11" fill="#2f5b34" filter="url(#rough2)">4</text>
  <circle cx="300" cy="247.8" r="5" fill="#cfe3c8" stroke="#2f5b34" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="300" y="235.8" text-anchor="middle" font-size="11" fill="#2f5b34" filter="url(#rough2)">1</text>
  <circle cx="410" cy="146.6" r="5" fill="#cfe3c8" stroke="#2f5b34" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="410" y="134.6" text-anchor="middle" font-size="11" fill="#2f5b34" filter="url(#rough2)">47</text>
  <text x="130" y="222" text-anchor="start" font-size="10.5" fill="#8a3a52" filter="url(#rough2)">下降 3</text>
  <text x="240" y="222" text-anchor="start" font-size="10.5" fill="#8a3a52" filter="url(#rough2)">下降 3</text>
  <text x="350" y="222" text-anchor="start" font-size="10.5" fill="#8a6015" filter="url(#rough2)">上升 0</text>
  <rect x="60" y="272" width="620" height="52" rx="9" fill="#fdeef1" stroke="#c0708a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="290" text-anchor="start" font-size="11" fill="#8a3a52" filter="url(#rough2)">每次下降无论多深，都只能用“把下降点右边的整段抬高”的方式解决，一次 +1 填 1 单位。</text>
</svg>
