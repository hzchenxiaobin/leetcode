<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1293"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="340" fill="#fafafa"/>
  <text x="360.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">反复剥掉 1 度点（同步）</text>
  <path d="M 115.2 42 Q 360.0 48 604.8 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="360.0" y="326" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">剥到没有 1 度点为止，轮数即答案</text>
  <circle cx="110" cy="110" r="22" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="110" y="116" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">1</text>
  <circle cx="230" cy="110" r="22" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="116" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">2</text>
  <circle cx="350" cy="110" r="22" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="116" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">3</text>
  <circle cx="470" cy="110" r="22" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="470" y="116" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">4</text>
  <line x1="132.0" y1="110.0" x2="206.0" y2="110.0" stroke="#5a7fb0" stroke-width="1.6" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <line x1="252.0" y1="110.0" x2="326.0" y2="110.0" stroke="#5a7fb0" stroke-width="1.6" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <line x1="372.0" y1="110.0" x2="446.0" y2="110.0" stroke="#5a7fb0" stroke-width="1.6" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <text x="290" y="70" text-anchor="middle" font-size="11.5" fill="#8c2f2c" filter="url(#rough2)">第 1 轮踢 1、4（度=1）</text>
  <circle cx="110" cy="215" r="22" fill="#fbeeee" stroke="#a05a5a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="110" y="221" text-anchor="middle" font-size="12" font-weight="bold" fill="#8c2f2c" filter="url(#rough2)">1</text>
  <circle cx="230" cy="215" r="22" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="221" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">2</text>
  <circle cx="350" cy="215" r="22" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="221" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">3</text>
  <circle cx="470" cy="215" r="22" fill="#fbeeee" stroke="#a05a5a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="470" y="221" text-anchor="middle" font-size="12" font-weight="bold" fill="#8c2f2c" filter="url(#rough2)">4</text>
  <line x1="252.0" y1="215.0" x2="326.0" y2="215.0" stroke="#5a7fb0" stroke-width="1.6" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <text x="290" y="265" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">第 2 轮踢 2、3 → 结束，答案 2</text>
  <text x="360" y="305" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">同轮被踢的两人可能互为唯一邻居：先记邻居再统一删</text>
</svg>
