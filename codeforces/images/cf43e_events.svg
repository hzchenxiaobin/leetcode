<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2b2b2b"/>
    </marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arra" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="760" height="440" fill="#fafafa"/>
  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">合并断点：位置差 d(t) 的符号变化</text>
  <path d="M 220 42 Q 380 48 540 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <line x1="90" y1="90" x2="90" y2="110" stroke="#2b2b2b" stroke-width="1.4" opacity="1.0" filter="url(#rough2)"/>
  <circle cx="90" cy="100" r="3" fill="#2b2b2b" stroke="#2b2b2b" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="90" y="82" text-anchor="middle" font-size="11.5" fill="#8a8a8a" filter="url(#rough2)">t=0</text>
  <line x1="130" y1="90" x2="130" y2="110" stroke="#2b2b2b" stroke-width="1.4" opacity="1.0" filter="url(#rough2)"/>
  <circle cx="130" cy="100" r="3" fill="#2b2b2b" stroke="#2b2b2b" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="130" y="82" text-anchor="middle" font-size="11.5" fill="#8a8a8a" filter="url(#rough2)">t=1</text>
  <line x1="530" y1="90" x2="530" y2="110" stroke="#2b2b2b" stroke-width="1.4" opacity="1.0" filter="url(#rough2)"/>
  <circle cx="530" cy="100" r="3" fill="#2b2b2b" stroke="#2b2b2b" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="530" y="82" text-anchor="middle" font-size="11.5" fill="#8a8a8a" filter="url(#rough2)">t=11</text>
  <line x1="690" y1="90" x2="690" y2="110" stroke="#2b2b2b" stroke-width="1.4" opacity="1.0" filter="url(#rough2)"/>
  <circle cx="690" cy="100" r="3" fill="#2b2b2b" stroke="#2b2b2b" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="690" y="82" text-anchor="middle" font-size="11.5" fill="#8a8a8a" filter="url(#rough2)">t=15</text>
  <line x1="90" y1="100" x2="700" y2="100" stroke="#8a8a8a" stroke-width="1.2" opacity="1.0" filter="url(#rough2)"/>
  <text x="706" y="60" text-anchor="end" font-size="11" fill="#8a8a8a" filter="url(#rough2)">合并后的断点</text>
  <line x1="90" y1="120" x2="90" y2="430" stroke="#2b2b2b" stroke-width="1.4" opacity="1.0" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="78" y="120" text-anchor="end" font-size="13" fill="#2b2b2b" filter="url(#rough2)">d</text>
  <line x1="90" y1="270" x2="700" y2="270" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="6 4" opacity="1.0" filter="url(#rough2)"/>
  <text x="96" y="286" text-anchor="start" font-size="11" fill="#8a8a8a" filter="url(#rough2)">0</text>
  <path d="M 90 270 L 130 240 L 530 390 L 690 270" stroke="#7a5a9a" stroke-width="2.6" fill="none" opacity="1.0" filter="url(#rough2)"/>
  <circle cx="90" cy="270" r="4.5" fill="#ffffff" stroke="#7a5a9a" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="130" cy="240" r="4.5" fill="#ffffff" stroke="#7a5a9a" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="530" cy="390" r="4.5" fill="#ffffff" stroke="#7a5a9a" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="690" cy="270" r="4.5" fill="#ffffff" stroke="#7a5a9a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="138" y="226" text-anchor="start" font-size="11" font-weight="bold" fill="#7a5a9a" filter="url(#rough2)">d = 2</text>
  <text x="542" y="402" text-anchor="start" font-size="11" font-weight="bold" fill="#7a5a9a" filter="url(#rough2)">d = -8</text>
  <text x="96" y="310" text-anchor="start" font-size="11" fill="#8a8a8a" filter="url(#rough2)">起点 d = 0，不计</text>
  <text x="688" y="310" text-anchor="end" font-size="11" fill="#8a8a8a" filter="url(#rough2)">终点 d = 0，不计</text>
  <circle cx="210.0" cy="270" r="6" fill="#ffffff" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <line x1="214.0" y1="264" x2="240" y2="214" stroke="#b85450" stroke-width="1.2" opacity="1.0" filter="url(#rough2)"/>
  <text x="246" y="210" text-anchor="start" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">区间内变号：记 1 次</text>
  <text x="380" y="390" text-anchor="middle" font-size="12.5" fill="#8a8a8a" filter="url(#rough2)">所有断点都是整数，d 值也是整数：没有浮点误差</text>
  <text x="380" y="416" text-anchor="middle" font-size="12.5" fill="#8a8a8a" filter="url(#rough2)">两端都非零且异号 ⇒ 该区间恰有一次超越</text>
</svg>
