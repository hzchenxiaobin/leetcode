<svg xmlns="http://www.w3.org/2000/svg" width="640" height="404" viewBox="0 0 640 404"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="21"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="404" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2 的完整轨迹：[6, 7, 8, 9, 15]，第 6 步后全为 0</text>
  <path d="M 120 38 Q 320 45 520 38" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- 表头 -->
  <rect x="44" y="54" width="96" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="92" y="74" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">x</text>
  <rect x="150" y="54" width="320" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="74" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">cur（排序后的 n 个数）</text>
  <rect x="480" y="54" width="120" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="540" y="74" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">max − min</text>

  <!-- 第 0 行 -->
  <rect x="44" y="90" width="96" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="92" y="110" text-anchor="middle" font-size="12.5" fill="#2b4a66" filter="url(#rough2)">0</text>
  <rect x="150" y="90" width="320" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="310" y="110" text-anchor="middle" font-size="12.5" fill="#2b4a66" filter="url(#rough2)">6  7  8  9  15</text>
  <rect x="480" y="90" width="120" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="540" y="110" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b4a66" filter="url(#rough2)">9</text>

  <!-- 第 1 行 -->
  <rect x="44" y="124" width="96" height="30" rx="6" fill="#fff" stroke="#a9a9a9" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="92" y="144" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#rough2)">1</text>
  <rect x="150" y="124" width="320" height="30" rx="6" fill="#fff" stroke="#a9a9a9" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="310" y="144" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#rough2)">1  1  6  7  8</text>
  <rect x="480" y="124" width="120" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="540" y="144" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">7</text>

  <!-- 第 2 行 -->
  <rect x="44" y="158" width="96" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="92" y="178" text-anchor="middle" font-size="12.5" fill="#2b4a66" filter="url(#rough2)">2</text>
  <rect x="150" y="158" width="320" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="310" y="178" text-anchor="middle" font-size="12.5" fill="#2b4a66" filter="url(#rough2)">0  1  6  6  7</text>
  <rect x="480" y="158" width="120" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="540" y="178" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">7</text>

  <!-- 第 3 行 -->
  <rect x="44" y="192" width="96" height="30" rx="6" fill="#fff" stroke="#a9a9a9" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="92" y="212" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#rough2)">3</text>
  <rect x="150" y="192" width="320" height="30" rx="6" fill="#fff" stroke="#a9a9a9" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="310" y="212" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#rough2)">0  1  1  1  6</text>
  <rect x="480" y="192" width="120" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="540" y="212" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">6</text>

  <!-- 第 4 行 -->
  <rect x="44" y="226" width="96" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="92" y="246" text-anchor="middle" font-size="12.5" fill="#2b4a66" filter="url(#rough2)">4</text>
  <rect x="150" y="226" width="320" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="310" y="246" text-anchor="middle" font-size="12.5" fill="#2b4a66" filter="url(#rough2)">0  0  0  1  1</text>
  <rect x="480" y="226" width="120" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="540" y="246" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">1</text>

  <!-- 第 5 行 -->
  <rect x="44" y="260" width="96" height="30" rx="6" fill="#fff" stroke="#a9a9a9" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="92" y="280" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#rough2)">5</text>
  <rect x="150" y="260" width="320" height="30" rx="6" fill="#fff" stroke="#a9a9a9" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="310" y="280" text-anchor="middle" font-size="12.5" fill="#444" filter="url(#rough2)">0  0  0  0  1</text>
  <rect x="480" y="260" width="120" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="540" y="280" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">1</text>

  <!-- 第 6 行 -->
  <rect x="44" y="294" width="96" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="92" y="314" text-anchor="middle" font-size="12.5" fill="#8c3a37" filter="url(#rough2)">6</text>
  <rect x="150" y="294" width="320" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="314" text-anchor="middle" font-size="12.5" fill="#8c3a37" filter="url(#rough2)">0  0  0  0  0</text>
  <rect x="480" y="294" width="120" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="540" y="314" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8c3a37" filter="url(#rough2)">0</text>

  <!-- 说明 -->
  <rect x="42" y="336" width="556" height="52" rx="10" fill="#fff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="356" text-anchor="middle" font-size="12" fill="#2b4a66" filter="url(#rough2)">极差单调不增：9, 7, 7, 6, 1, 1, 0；第 6 步全 0 后再变换仍是全 0（0 ⊕ 0 = 0）</text>
  <text x="320" y="376" text-anchor="middle" font-size="12" fill="#2b4a66" filter="url(#rough2)">样例 3（n = 8）：87 → 31 → 12 → 4 → 0；故 x=1 得 31，x=2 得 12，x ≥ 4 得 0</text>
</svg>
