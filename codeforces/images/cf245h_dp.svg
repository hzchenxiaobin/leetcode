<svg xmlns="http://www.w3.org/2000/svg" width="720" height="310" viewBox="0 0 720 310"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="720" height="310" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两个 O(n²) DP：先判回文，再用容斥统计区间内的回文子串数</text>
  <rect x="40" y="56" width="300" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="190" y="85" text-anchor="middle" font-size="11.5" fill="#2f5223">pal[i][j] = (s[i]==s[j]) &amp;&amp;</text>
  <text x="190" y="99" text-anchor="middle" font-size="11.5" fill="#2f5223">(j−i&lt;2 || pal[i+1][j−1])</text>
  <rect x="380" y="56" width="300" height="64" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="530" y="85" text-anchor="middle" font-size="11" fill="#2f4a66">按 i 从大到小、j 从小到大递推</text>
  <text x="530" y="99" text-anchor="middle" font-size="11" fill="#2f4a66">（子区间先算好）</text>
  <rect x="40" y="150" width="640" height="64" rx="8" fill="#fde9d9" stroke="#b4652a" stroke-width="1.5"/>
  <text x="360" y="186" text-anchor="middle" font-size="11.5" fill="#7a4b22">cnt[i][j] = cnt[i+1][j] + cnt[i][j−1] − cnt[i+1][j−1] + pal[i][j]</text>
  <rect x="40" y="238" width="640" height="50" rx="8" fill="#f3edf8" stroke="#7a4a9a" stroke-width="1.5"/>
  <text x="360" y="267" text-anchor="middle" font-size="11.5" fill="#4a2a62">查询 (l, r) 直接读 cnt[l−1][r−1]：O(1)，q ≤ 10^6 也没问题</text>
</svg>
