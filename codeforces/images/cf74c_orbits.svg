<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="55"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="820" height="420" fill="#fafafa"/>

  <text x="410" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">模 2g 的剩余类按"取反"配对，恰好 g+1 个轨道</text>
  <text x="410" y="56" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">以 g = 3（2g = 6）为例：轨道 {0}、{3}、{1,5}、{2,4}，共 4 个</text>

  <!-- 圆：圆心 (250,230)，半径 130 -->
  <g filter="url(#rough2)">
    <circle cx="250" cy="230" r="130" fill="none" stroke="#cccccc" stroke-width="1.4" stroke-dasharray="6 4"/>

    <circle cx="250" cy="100" r="17" fill="#e8e0f2" stroke="#6b5b9a" stroke-width="1.6"/>
    <text x="250" y="106" text-anchor="middle" font-size="13" fill="#4b3f66">0</text>

    <circle cx="362.6" cy="165" r="17" fill="#cfe0f5" stroke="#446688" stroke-width="1.6"/>
    <text x="362.6" y="171" text-anchor="middle" font-size="13" fill="#2f4a66">1</text>

    <circle cx="362.6" cy="295" r="17" fill="#d9ecd4" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="362.6" y="301" text-anchor="middle" font-size="13" fill="#2f5223">2</text>

    <circle cx="250" cy="360" r="17" fill="#e8e0f2" stroke="#6b5b9a" stroke-width="1.6"/>
    <text x="250" y="366" text-anchor="middle" font-size="13" fill="#4b3f66">3</text>

    <circle cx="137.4" cy="295" r="17" fill="#d9ecd4" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="137.4" y="301" text-anchor="middle" font-size="13" fill="#2f5223">4</text>

    <circle cx="137.4" cy="165" r="17" fill="#cfe0f5" stroke="#446688" stroke-width="1.6"/>
    <text x="137.4" y="171" text-anchor="middle" font-size="13" fill="#2f4a66">5</text>

    <!-- 取反配对弧 -->
    <path d="M 388 152 Q 430 230 388 308" fill="none" stroke="#446688" stroke-width="1.8" stroke-dasharray="5 3"/>
    <path d="M 112 152 Q 70 230 112 308" fill="none" stroke="#446688" stroke-width="1.8" stroke-dasharray="5 3"/>
    <path d="M 215 372 Q 250 404 285 372" fill="none" stroke="#6b5b9a" stroke-width="1.8" stroke-dasharray="5 3"/>
    <path d="M 215 88 Q 250 56 285 88" fill="none" stroke="#6b5b9a" stroke-width="1.8" stroke-dasharray="5 3"/>

    <text x="398" y="238" font-size="10.5" fill="#2f4a66">1 ↔ 5</text>
    <text x="60" y="238" font-size="10.5" fill="#2f4a66">2 ↔ 4</text>
  </g>

  <text x="60" y="404" font-size="11" fill="#4b3f66" filter="url(#rough2)">虚线：取反配对轨道　实心：单独轨道 {0} 与 {3}</text>

  <!-- 右侧表格 -->
  <g filter="url(#rough2)">
    <rect x="450" y="96" width="340" height="250" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="466" y="122" font-size="12" font-weight="bold" fill="#8a6015">为什么上界是 g+1</text>
    <text x="466" y="150" font-size="11.5" fill="#444444">每个格子的签名都对取反封闭，</text>
    <text x="466" y="172" font-size="11.5" fill="#444444">所以它是若干个"轨道"的并。</text>
    <text x="466" y="200" font-size="11.5" fill="#444444">两枚棋子互不打败 ⇒ 签名不相交</text>
    <text x="466" y="222" font-size="11.5" fill="#444444">⇒ 占用的轨道两两不同。</text>
    <text x="466" y="250" font-size="11.5" fill="#444444">只有 g+1 个轨道，故最多 g+1 枚。</text>
    <line x1="466" y1="266" x2="774" y2="266" stroke="#d6a040" stroke-width="1"/>
    <text x="466" y="290" font-size="11.5" fill="#2f5223">构造：第一行 (0,t)，t = 0..g</text>
    <text x="466" y="312" font-size="11.5" fill="#2f5223">签名 {±t} 恰好占满所有轨道。</text>
    <text x="466" y="334" font-size="11" fill="#777777">所以答案 = g + 1。</text>
  </g>
</svg>
