<svg xmlns="http://www.w3.org/2000/svg" width="740" height="360" viewBox="0 0 740 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="229"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="740" height="360" fill="#fafafa"/>
  <text x="370" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">对称性：n 个“总位移”只剩 0 与非 0 两类</text>
  <path d="M 170 46 Q 370 52 570 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <circle cx="210" cy="80" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="210.0" y="85.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <circle cx="281" cy="109" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280.71067811865476" y="114.28932188134526" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <circle cx="310" cy="180" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="310.0" y="185.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <circle cx="281" cy="251" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280.71067811865476" y="255.71067811865476" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <circle cx="210" cy="280" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="210.0" y="285.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <circle cx="139" cy="251" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="139.28932188134524" y="255.71067811865476" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <circle cx="110" cy="180" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="110.0" y="185.0" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">6</text>
  <circle cx="139" cy="109" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="139.28932188134524" y="114.28932188134526" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">7</text>
  <text x="210" y="186" text-anchor="middle" font-size="12" font-weight="normal" fill="#555" filter="url(#rough2)">总位移</text>
  <text x="210" y="345" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">f_t[0] = a_t,  f_t[r≠0] = b_t</text>
  <rect x="420" y="70" width="290" height="120" rx="10" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="436" y="96" text-anchor="start" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">两状态递推：</text>
  <text x="436" y="122" text-anchor="start" font-size="11.5" font-weight="normal" fill="#2f5223" filter="url(#rough2)">a(t+1) = (n−1)·b(t)</text>
  <text x="436" y="146" text-anchor="start" font-size="11.5" font-weight="normal" fill="#2f5223" filter="url(#rough2)">b(t+1) = a(t) + (n−2)·b(t)</text>
  <text x="436" y="172" text-anchor="start" font-size="10.5" font-weight="normal" fill="#666" filter="url(#rough2)">O(k) 递推即可（k ≤ 10⁵）</text>
  <rect x="420" y="206" width="290" height="96" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="436" y="230" text-anchor="start" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">答案 = cnt₀·a(k) + cnt≠₀·b(k)</text>
  <text x="436" y="254" text-anchor="start" font-size="10.5" font-weight="normal" fill="#7a5a1b" filter="url(#rough2)">cnt 由“哪些位移能把 start 变成 end”</text>
  <text x="436" y="274" text-anchor="start" font-size="10.5" font-weight="normal" fill="#7a5a1b" filter="url(#rough2)">统计得到（O(n²) 逐次旋转比较）</text>
</svg>
