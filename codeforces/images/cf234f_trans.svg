<svg xmlns="http://www.w3.org/2000/svg" width="840" height="300" viewBox="0 0 840 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="300" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">转移示意：第 i 块二选一</text>
  <g filter="url(#rough2)"><circle cx="200" cy="150" r="34" fill="#d6e6f2" fill-opacity="0.9" stroke="#446688" stroke-width="1.6"/></g>
  <text x="200" y="156" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">i−1</text>
  <g filter="url(#rough2)"><circle cx="640" cy="90" r="34" fill="#f6d9d7" fill-opacity="0.9" stroke="#a0522d" stroke-width="1.6"/></g>
  <text x="640" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">i 红</text>
  <g filter="url(#rough2)"><circle cx="640" cy="210" r="34" fill="#d7ecd0" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="640" y="216" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">i 绿</text>
  <g filter="url(#rough2)"><line x1="234" y1="138" x2="606" y2="96" stroke="#888888" stroke-width="1.4" marker-end="url(#arrb)"/></g>
  <g filter="url(#rough2)"><line x1="234" y1="162" x2="606" y2="204" stroke="#888888" stroke-width="1.4" marker-end="url(#arrb)"/></g>
  <text x="420" y="76" text-anchor="middle" font-size="11" fill="#8a4b2a" filter="url(#rough2)">异色时 +min(h_{i−1}, h_i)</text>
  <text x="420" y="246" text-anchor="middle" font-size="11" fill="#3d6b2f" filter="url(#rough2)">同色时 +0</text>
  <text x="420" y="288" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">每步同时检查红/绿面积不超过 a / b</text>
</svg>
