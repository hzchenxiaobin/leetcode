<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="760" height="430" fill="#fafafa"/>

  <text x="180" y="74" font-size="12" text-anchor="middle" fill="#2f5223" font-weight="bold" filter="url(#rough2)">系统 A（符号 +）</text>
  <text x="50" y="120" font-size="11" text-anchor="start" fill="#35507a" filter="url(#rough2)">s₁</text>
  <text x="50" y="300" font-size="11" text-anchor="start" fill="#35507a" filter="url(#rough2)">s₂</text>
  <text x="292" y="120" font-size="11" text-anchor="start" fill="#7a2f2f" filter="url(#rough2)">t₁</text>
  <text x="292" y="300" font-size="11" text-anchor="start" fill="#7a2f2f" filter="url(#rough2)">t₂</text>
  <circle cx="64" cy="124" r="4.5" fill="#446688" stroke="none" filter="url(#rough2)"/>
  <circle cx="64" cy="304" r="4.5" fill="#446688" stroke="none" filter="url(#rough2)"/>
  <circle cx="282" cy="124" r="4.5" fill="#b85450" stroke="none" filter="url(#rough2)"/>
  <circle cx="282" cy="304" r="4.5" fill="#b85450" stroke="none" filter="url(#rough2)"/>
  <path d="M 68 124 L 173 210 L 278 124" fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 68 304 L 173 210 L 278 304" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="173" cy="210" r="6" fill="#b85450" stroke="none" filter="url(#rough2)"/>
  <text x="173" y="236" font-size="10.5" text-anchor="middle" fill="#7a2f2f" filter="url(#rough2)">公共顶点 v</text>
  <line x1="350" y1="210" x2="404" y2="210" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="377" y="196" font-size="11" text-anchor="middle" fill="#7a2f2f" filter="url(#rough2)">交换</text>
  <text x="570" y="74" font-size="12" text-anchor="middle" fill="#7a2f2f" font-weight="bold" filter="url(#rough2)">系统 B（符号 −）</text>
  <text x="440" y="120" font-size="11" text-anchor="start" fill="#35507a" filter="url(#rough2)">s₁</text>
  <text x="440" y="300" font-size="11" text-anchor="start" fill="#35507a" filter="url(#rough2)">s₂</text>
  <text x="682" y="120" font-size="11" text-anchor="start" fill="#7a2f2f" filter="url(#rough2)">t₁</text>
  <text x="682" y="300" font-size="11" text-anchor="start" fill="#7a2f2f" filter="url(#rough2)">t₂</text>
  <circle cx="454" cy="124" r="4.5" fill="#446688" stroke="none" filter="url(#rough2)"/>
  <circle cx="454" cy="304" r="4.5" fill="#446688" stroke="none" filter="url(#rough2)"/>
  <circle cx="672" cy="124" r="4.5" fill="#b85450" stroke="none" filter="url(#rough2)"/>
  <circle cx="672" cy="304" r="4.5" fill="#b85450" stroke="none" filter="url(#rough2)"/>
  <path d="M 458 124 L 563 210 L 668 124" fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 458 304 L 563 210 L 668 304" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 458 124 L 563 210 L 668 304" fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 458 304 L 563 210 L 668 124" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="563" cy="210" r="6" fill="#b85450" stroke="none" filter="url(#rough2)"/>
  <text x="563" y="236" font-size="10.5" text-anchor="middle" fill="#7a2f2f" filter="url(#rough2)">公共顶点 v</text>
  <text x="40" y="354" font-size="11.5" text-anchor="start" fill="#2b2b2b" filter="url(#rough2)">取“拓扑序最小的公共顶点 v”，把两条路径在 v 之后的部分互换：得到另一个合法路径系统，</text>
  <text x="40" y="378" font-size="11.5" text-anchor="start" fill="#35507a" filter="url(#rough2)">配对不变、符号翻转，且这个操作是对合（再做一次回到 A）。所以所有相交系统两两抵消。</text>
  <text x="40" y="406" font-size="11.5" text-anchor="start" fill="#2f5223" filter="url(#rough2)">剩下未被抵消的，恰好是顶点不相交的那些系统——正是题目要计数的对象。</text>
  <text x="380.0" y="36" font-size="20" text-anchor="middle" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">相交的系统会成对抵消：交换尾巴，符号翻转</text>
  <path d="M 120 46 Q 380.0 52 640 46" fill="none" stroke="#2b2b2b" stroke-width="1.3" filter="url(#rough2)"/>
</svg>
