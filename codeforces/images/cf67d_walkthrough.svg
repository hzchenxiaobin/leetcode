<svg xmlns="http://www.w3.org/2000/svg" width="720" height="368" viewBox="0 0 720 368"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>

  <rect width="720" height="368" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">耐心排序：逐格用 lower_bound 维护 tails</text>
  <path d="M 130 40 Q 360 46 590 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <text x="36" y="72" font-size="12" fill="#555" filter="url(#rough2)">行 = 处理到第几个值；列 = tails 的第 k 个位置（越往右越深）</text>

  <!-- 表头 -->
  <text x="60" y="104" font-size="11.5" fill="#555" filter="url(#rough2)">i</text>
  <text x="110" y="104" font-size="11.5" fill="#555" filter="url(#rough2)">v = −s_i</text>
  <text x="210" y="104" font-size="11.5" fill="#555" filter="url(#rough2)">tails[1]</text>
  <text x="320" y="104" font-size="11.5" fill="#555" filter="url(#rough2)">tails[2]</text>
  <text x="430" y="104" font-size="11.5" fill="#555" filter="url(#rough2)">tails[3]</text>
  <text x="560" y="104" font-size="11.5" fill="#555" filter="url(#rough2)">长度</text>

  <!-- 第 0 行 -->
  <g filter="url(#rough2)">
    <rect x="52" y="112" width="42" height="34" fill="#f4f0fa" stroke="#7a4a8a" stroke-width="1.1"/>
    <rect x="100" y="112" width="90" height="34" fill="#ffffff" stroke="#999" stroke-width="1.1"/>
    <rect x="196" y="112" width="96" height="34" fill="#ffffff" stroke="#999" stroke-width="1.1"/>
    <rect x="306" y="112" width="96" height="34" fill="#ffffff" stroke="#999" stroke-width="1.1"/>
    <rect x="416" y="112" width="96" height="34" fill="#ffffff" stroke="#999" stroke-width="1.1"/>
    <rect x="540" y="112" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <g font-size="12.5" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">
    <text x="73" y="134">0</text>
    <text x="145" y="134">—</text>
    <text x="244" y="134">空</text>
    <text x="354" y="134">空</text>
    <text x="464" y="134">空</text>
    <text x="570" y="134">0</text>
  </g>

  <!-- 1..5 行 -->
  <g font-size="12.5" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">
    <text x="73" y="170">1</text>
    <text x="145" y="170">−4</text>
    <text x="244" y="170">−4</text>
    <text x="354" y="170">—</text>
    <text x="464" y="170">—</text>
    <text x="570" y="170">1</text>

    <text x="73" y="207">2</text>
    <text x="145" y="207">−2</text>
    <text x="244" y="207">−4</text>
    <text x="354" y="207">−2</text>
    <text x="464" y="207">—</text>
    <text x="570" y="207">2</text>

    <text x="73" y="244">3</text>
    <text x="145" y="244">−5</text>
    <text x="244" y="244">−5</text>
    <text x="354" y="244">−2</text>
    <text x="464" y="244">—</text>
    <text x="570" y="244">2</text>

    <text x="73" y="281">4</text>
    <text x="145" y="281">−3</text>
    <text x="244" y="281">−5</text>
    <text x="354" y="281">−3</text>
    <text x="464" y="281">—</text>
    <text x="570" y="281">2</text>

    <text x="73" y="318">5</text>
    <text x="145" y="318">−1</text>
    <text x="244" y="318">−5</text>
    <text x="354" y="318">−3</text>
    <text x="464" y="318">−1</text>
    <text x="570" y="318" font-weight="bold" fill="#2f5223">3</text>
  </g>

  <!-- 说明 -->
  <text x="36" y="348" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">第 3 步 −5 比 −4 小，替换 tails[1]；第 4、5 步同理。最终长度 3 = LDS(4,2,5,3,1)。</text>
</svg>
