<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="780" height="470" fill="#fafafa"/>

  <text x="390" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">check(S)：倒序贪心（值从大到小，逐个决定「删除」还是「分裂」）</text>

  <rect x="228" y="42" width="330" height="48" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="393" y="62" text-anchor="middle" font-size="14" fill="#8a6520" filter="url(#rough2)">天花板 top ← K + n + 2S − 1</text>
  <text x="393" y="81" text-anchor="middle" font-size="13" fill="#8a6520" filter="url(#rough2)">扫描指针 v ← n</text>

  <rect x="40" y="102" width="700" height="296" rx="14" fill="none" stroke="#99aabb" stroke-width="1.6" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="60" y="126" font-size="13" fill="#667788" filter="url(#rough2)">循环：v 从 n 递减到 0（v 只降不升）</text>

  <rect x="64" y="136" width="190" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="159" y="163" text-anchor="middle" font-size="14" fill="#2f4f6f" filter="url(#rough2)">cnt[v] = 0 ?</text>
  <line x1="256" y1="158" x2="296" y2="158" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="300" y="136" width="240" height="44" rx="8" fill="#fafafa" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="420" y="163" text-anchor="middle" font-size="14" fill="#2f4f6f" filter="url(#rough2)">是：v ← v − 1，跳过</text>

  <rect x="64" y="192" width="190" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="159" y="216" text-anchor="middle" font-size="14" fill="#2f4f6f" filter="url(#rough2)">v &gt; top ?</text>
  <text x="159" y="236" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">（最高位也装不下）</text>
  <line x1="256" y1="220" x2="296" y2="220" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="212" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="300" y="188" width="420" height="64" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="510" y="212" text-anchor="middle" font-size="13" fill="#8f3a36" filter="url(#rough2)">分裂 v：cnt[v] − 1，cnt[(v + 1) / 2] += 2</text>
  <text x="510" y="234" text-anchor="middle" font-size="13" fill="#8f3a36" filter="url(#rough2)">splits++；若 splits &gt; S 立刻 return false</text>

  <rect x="64" y="280" width="190" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="159" y="302" text-anchor="middle" font-size="14" fill="#33612a" filter="url(#rough2)">否则 v ≤ top</text>
  <text x="159" y="320" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">（还装得下）</text>
  <line x1="256" y1="304" x2="296" y2="304" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="296" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="300" y="280" width="420" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="510" y="309" text-anchor="middle" font-size="13" fill="#33612a" filter="url(#rough2)">删除 v：cnt[v] − 1，top ← top − 1</text>

  <line x1="730" y1="352" x2="730" y2="120" stroke="#b85450" stroke-width="1.7" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="762" y="240" text-anchor="middle" font-size="12" fill="#b85450" transform="rotate(90 762 240)" filter="url(#rough2)">处理完继续扫桶</text>

  <rect x="266" y="412" width="248" height="42" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="439" text-anchor="middle" font-size="14" fill="#8f3a36" filter="url(#rough2)">v 扫到 0 ⇒ return true</text>
</svg>
