<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="400" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">完成时刻关于优先级单调不增</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">把优先级当作自变量，未知任务的完成时刻是一条阶梯下降曲线，平台就是所有可行解</text>
  <line x1="100" y1="320" x2="780" y2="320" stroke="#8899aa" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="100" y1="320" x2="100" y2="110" stroke="#8899aa" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="440" y="352" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">优先级 p</text>
  <text x="78" y="120" text-anchor="end" font-size="12.5" fill="#555555" filter="url(#rough2)">完成</text>
  <text x="78" y="140" text-anchor="end" font-size="12.5" fill="#555555" filter="url(#rough2)">时刻</text>
  <path d="M130,160 L210,160 L210,200 L300,200 L300,240 L430,240 L430,270 L600,270 L600,296 L740,296" fill="none" stroke="#b05a5a" stroke-width="2.0" filter="url(#rough2)"/>
  <line x1="100" y1="220" x2="760" y2="220" stroke="#3d6b2f" stroke-width="1.2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="770" y="216" text-anchor="start" font-size="13" fill="#3d6b2f" filter="url(#rough2)">T</text>
  <path d="M300,200 L430,200 L430,240 L300,240" fill="none" stroke="#2f4a66" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="365" y="190" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">平台：finish(p) = T</text>
  <text x="440" y="378" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">二分出"第一个 finish ≤ T 的 p"，再取该处起最小的未占用优先级即可</text>
</svg>
