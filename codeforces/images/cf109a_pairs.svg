<svg xmlns="http://www.w3.org/2000/svg" width="880" height="392" viewBox="0 0 880 392"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="109"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="392" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">只含 4 和 7 的数：a 个 4、b 个 7，数位和 4a+7b</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">位数越少数越小；同位数时 4 全放前面</text>
  <text x="120" y="112" text-anchor="end" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">a=0, b=1</text>
  <g filter="url(#rough2)"><rect x="150" y="90" width="34" height="32" rx="3" fill="#f6d9d7" fill-opacity="0.7" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="167" y="112" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="202" y="112" text-anchor="start" font-size="11" fill="#555555" filter="url(#rough2)">数位和 7，len 1</text>
  <text x="120" y="158" text-anchor="end" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">a=1, b=1</text>
  <g filter="url(#rough2)"><rect x="150" y="136" width="34" height="32" rx="3" fill="#d7ecd0" fill-opacity="0.7" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="167" y="158" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><rect x="188" y="136" width="34" height="32" rx="3" fill="#f6d9d7" fill-opacity="0.7" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="205" y="158" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="240" y="158" text-anchor="start" font-size="11" fill="#555555" filter="url(#rough2)">数位和 11，len 2</text>
  <text x="120" y="204" text-anchor="end" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">a=0, b=2</text>
  <g filter="url(#rough2)"><rect x="150" y="182" width="34" height="32" rx="3" fill="#f6d9d7" fill-opacity="0.7" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="167" y="204" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">7</text>
  <g filter="url(#rough2)"><rect x="188" y="182" width="34" height="32" rx="3" fill="#f6d9d7" fill-opacity="0.7" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="205" y="204" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="240" y="204" text-anchor="start" font-size="11" fill="#555555" filter="url(#rough2)">数位和 14，len 2</text>
  <text x="120" y="250" text-anchor="end" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">a=3, b=0</text>
  <g filter="url(#rough2)"><rect x="150" y="228" width="34" height="32" rx="3" fill="#d7ecd0" fill-opacity="0.7" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="167" y="250" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><rect x="188" y="228" width="34" height="32" rx="3" fill="#d7ecd0" fill-opacity="0.7" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="205" y="250" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><rect x="226" y="228" width="34" height="32" rx="3" fill="#d7ecd0" fill-opacity="0.7" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="243" y="250" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="278" y="250" text-anchor="start" font-size="11" fill="#555555" filter="url(#rough2)">数位和 12，len 3</text>
  <text x="440" y="300" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">枚举 b = 0..n/7：若 n−7b 能被 4 整除就得到一个解（a=(n−7b)/4）</text>
  <text x="440" y="330" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">取位数 a+b 最小的；位数相同则 a、b 唯一确定（4a+7b=n 且 a+b 固定）</text>
  <text x="440" y="360" text-anchor="middle" font-size="12" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">答案 = 前 a 个 4 + 后 b 个 7（这样字典序最小）</text>
</svg>
