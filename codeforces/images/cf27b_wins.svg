<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="197"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="760" height="300" fill="#fafafa"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">强弱全序：第 k 名赢 n−k 场；缺一场后两人各少/不少一场</text>
  <path d="M 140 40 Q 400 46 660 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="70" y="80" width="110" height="54" rx="8" fill="#cfe0f5" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="125" y="103" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">1(最强)</text>
  <text x="125" y="124" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">赢 n−1</text>
  <path d="M 184 107 L 196 107" stroke="#446688" stroke-width="1.4" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <rect x="200" y="80" width="110" height="54" rx="8" fill="#eef4fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="255" y="103" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">2</text>
  <text x="255" y="124" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">赢 n−2</text>
  <path d="M 314 107 L 326 107" stroke="#446688" stroke-width="1.4" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <rect x="330" y="80" width="110" height="54" rx="8" fill="#eef4fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="385" y="103" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">3</text>
  <text x="385" y="124" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">赢 n−3</text>
  <path d="M 444 107 L 456 107" stroke="#446688" stroke-width="1.4" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <rect x="460" y="80" width="110" height="54" rx="8" fill="#eef4fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="515" y="103" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">…</text>
  <text x="515" y="124" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">赢 …</text>
  <path d="M 574 107 L 586 107" stroke="#446688" stroke-width="1.4" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <rect x="590" y="80" width="110" height="54" rx="8" fill="#fbe3c8" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="645" y="103" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">n(最弱)</text>
  <text x="645" y="124" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">赢 0</text>
  <text x="70" y="180" font-size="12" fill="#2b2b2b" filter="url(#rough2)">缺失比赛在 u、v 之间，u 更强：u 的胜场 = #{x: x 比 u 弱} − 1，v 的胜场 = #{x: x 比 v 弱}。</text>
  <text x="70" y="208" font-size="12" fill="#2b2b2b" filter="url(#rough2)">因为集合 {比 v 弱} ⊆ {比 u 弱}，所以 w(u) ≥ w(v)；严格大于时赢家唯一。</text>
  <text x="70" y="250" font-size="12.5" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">结论：胜场多的那位赢；相等时两种补法都合法。</text>

</svg>
