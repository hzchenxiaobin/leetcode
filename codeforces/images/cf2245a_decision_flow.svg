<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="53"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="720" height="470" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">判定流程：先看有没有解，再逐位数「必须翻转」的位置</text>

  <rect x="250" y="50" width="220" height="44" rx="8" fill="#ffffff" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="77" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">读入 n, k 与长度 n 的串 s</text>

  <path d="M 360 94 L 360 116" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <polygon points="360,118 472,158 360,198 248,158" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="164" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">2k &gt; n ?</text>

  <path d="M 248 158 L 224 158" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="236" y="149" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>

  <rect x="30" y="134" width="192" height="50" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="126" y="156" text-anchor="middle" font-size="13" font-weight="bold" fill="#a14340" filter="url(#rough2)">输出 −1</text>
  <text x="126" y="174" text-anchor="middle" font-size="11" fill="#a14340" filter="url(#rough2)">前 k 与后 k 必然重叠</text>

  <path d="M 360 198 L 360 222" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="374" y="215" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <rect x="150" y="226" width="420" height="92" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="252" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">ans = (前 k 位中 L 的个数) + (后 k 位中 R 的个数)</text>
  <text x="360" y="278" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">前 k 位必须翻成 R，后 k 位必须翻成 L，其余位置一律不动</text>
  <text x="360" y="302" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">中间 n − 2k 个位置没有任何约束，保留原样即零代价</text>

  <path d="M 360 318 L 360 340" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <rect x="270" y="342" width="180" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="368" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">输出 ans</text>

  <rect x="40" y="398" width="640" height="58" rx="10" fill="#ffffff" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="360" y="422" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">唯一的不可能来源是 2k &gt; n：此时某个位置同时被要求「必是 R」与「必是 L」</text>
  <text x="360" y="444" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">2k ≤ n 时两个强制区不相交，各位置独立计数，贪心即最优</text>
</svg>
