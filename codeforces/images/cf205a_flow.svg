<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="330" fill="#fafafa"/>
  <text x="360.0" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">205A：单遍扫描的三种分支</text>
  <path d="M 144.00 46 Q 360.0 52 576.00 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60" y="80" width="160" height="52" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="98" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">读入 a_i</text>
  <rect x="260" y="66" width="180" height="52" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="274" y="84" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">a_i &lt; best ?</text>
  <rect x="260" y="140" width="180" height="52" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="274" y="158" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">a_i == best ?</text>
  <rect x="490" y="80" width="190" height="120" rx="9" fill="#fdeef1" stroke="#c0708a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="504" y="98" text-anchor="start" font-size="11" fill="#8a3a52" filter="url(#rough2)">&lt;  ：best=a_i, cnt=1, idx=i</text>
  <text x="504" y="120" text-anchor="start" font-size="11" fill="#8a3a52" filter="url(#rough2)"></text>
  <text x="504" y="142" text-anchor="start" font-size="11" fill="#8a3a52" filter="url(#rough2)">== ：cnt++</text>
  <text x="504" y="164" text-anchor="start" font-size="11" fill="#8a3a52" filter="url(#rough2)"></text>
  <text x="504" y="186" text-anchor="start" font-size="11" fill="#8a3a52" filter="url(#rough2)">&gt;  ：什么都不做</text>
  <path d="M 224 106 L 256 96" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 224 110 L 256 160" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 444 92 L 486 120" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 444 166 L 486 150" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="60" y="236" width="620" height="60" rx="9" fill="#f2f2f2" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="254" text-anchor="start" font-size="11" fill="#3d3d3d" filter="url(#rough2)">扫描结束后：cnt == 1 ⇒ 输出 idx；否则输出 Still Rozdil。</text>
  <text x="74" y="276" text-anchor="start" font-size="11" fill="#3d3d3d" filter="url(#rough2)">整个过程只保留 3 个变量，空间 O(1)，时间 O(n)。</text>
</svg>
