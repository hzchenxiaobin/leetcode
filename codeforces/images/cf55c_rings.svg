  <text x="555" y="380" font-size="13" font-weight="bold" fill="#2f5223" text-anchor="middle" filter="url(#rough2)">d ≤ 4 → YES</text>
  <text x="555" y="400" font-size="13" font-weight="bold" fill="#7a3b36" text-anchor="middle" filter="url(#rough2)">d ≥ 5 → NO</text>
  <text x="360" y="430" font-size="10.5" font-weight="normal" fill="#666" text-anchor="middle" filter="url(#rough2)">红色圆点是四个角：每个角有两条外侧边，是唯一的“双重出口”</text>
</svg>
