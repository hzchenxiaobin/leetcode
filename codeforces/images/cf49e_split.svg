<svg xmlns="http://www.w3.org/2000/svg" width="760" height="410" viewBox="0 0 760 410"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c9801f"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a8524a"/>
    </marker>
  </defs>
  <rect width="760" height="410" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">拼接引理：祖先的每个符号各管一段</text>
  <rect x="28.0" y="56.0" width="344.0" height="288.0" rx="10" fill="#f7f9fc" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200.0" y="84.0" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">w = c1 c2 c3  ⇒*  s1</text>
  <rect x="52.0" y="100.0" width="92.0" height="36.0" fill="#f7f9fc" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="98.0" y="122.7" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">c1</text>
  <rect x="156.0" y="100.0" width="96.0" height="36.0" fill="#f7f9fc" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="204.0" y="122.7" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">c2</text>
  <rect x="256.0" y="100.0" width="100.0" height="36.0" fill="#f7f9fc" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="306.0" y="122.7" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">c3</text>
  <text x="46.0" y="168.0" text-anchor="start" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">s1</text>
  <rect x="52.0" y="182.0" width="92.0" height="40.0" fill="#eef4ff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="98.0" y="207.0" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">u1</text>
  <path d="M 98.0 138.0 L 98.0 178.0" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="156.0" y="182.0" width="96.0" height="40.0" fill="#eef4ff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="204.0" y="207.0" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">u2</text>
  <path d="M 204.0 138.0 L 204.0 178.0" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="256.0" y="182.0" width="100.0" height="40.0" fill="#eef4ff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="306.0" y="207.0" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">u3</text>
  <path d="M 306.0 138.0 L 306.0 178.0" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="98.0" y="246.0" text-anchor="middle" font-size="10.5" fill="#8a8a8a" filter="url(#rough2)">非空</text>
  <text x="204.0" y="246.0" text-anchor="middle" font-size="10.5" fill="#8a8a8a" filter="url(#rough2)">非空</text>
  <text x="306.0" y="246.0" text-anchor="middle" font-size="10.5" fill="#8a8a8a" filter="url(#rough2)">非空</text>
  <text x="200.0" y="276.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">s1 = u1 u2 u3，且 c_m ⇒* u_m</text>
  <text x="200.0" y="302.0" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">每个 u_m 至少 1 个字符</text>
  <text x="200.0" y="328.0" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">分段顺序与 w 中符号顺序一致</text>
  <rect x="388.0" y="56.0" width="344.0" height="288.0" rx="10" fill="#f4f9f2" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="560.0" y="84.0" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">w = c1 c2 c3  ⇒*  s2</text>
  <rect x="402.0" y="100.0" width="92.0" height="36.0" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="448.0" y="122.7" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">c1</text>
  <rect x="506.0" y="100.0" width="96.0" height="36.0" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="554.0" y="122.7" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">c2</text>
  <rect x="606.0" y="100.0" width="100.0" height="36.0" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="656.0" y="122.7" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">c3</text>
  <text x="406.0" y="168.0" text-anchor="start" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">s2</text>
  <rect x="402.0" y="182.0" width="92.0" height="40.0" fill="#f2f8ee" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="448.0" y="207.0" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">v1</text>
  <path d="M 448.0 138.0 L 448.0 178.0" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="506.0" y="182.0" width="96.0" height="40.0" fill="#f2f8ee" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="554.0" y="207.0" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">v2</text>
  <path d="M 554.0 138.0 L 554.0 178.0" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="606.0" y="182.0" width="100.0" height="40.0" fill="#f2f8ee" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="656.0" y="207.0" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">v3</text>
  <path d="M 656.0 138.0 L 656.0 178.0" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="448.0" y="246.0" text-anchor="middle" font-size="10.5" fill="#8a8a8a" filter="url(#rough2)">非空</text>
  <text x="554.0" y="246.0" text-anchor="middle" font-size="10.5" fill="#8a8a8a" filter="url(#rough2)">非空</text>
  <text x="656.0" y="246.0" text-anchor="middle" font-size="10.5" fill="#8a8a8a" filter="url(#rough2)">非空</text>
  <text x="560.0" y="276.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">s2 = v1 v2 v3，且 c_m ⇒* v_m</text>
  <text x="560.0" y="302.0" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">每个 v_m 至少 1 个字符</text>
  <text x="560.0" y="328.0" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">两条切分的符号数相同（都是 |w|）</text>
  <rect x="28.0" y="356.0" width="704.0" height="44.0" rx="8" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.5" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="44.0" y="383.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">两个串的切分点可以不同（u_m 与 v_m 长度无关），但它们按同一组符号 c1..ck 对齐。</text>
</svg>
