<svg xmlns="http://www.w3.org/2000/svg" width="740" height="460" viewBox="0 0 740 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="740" height="460" fill="#fafafa"/>
  <text x="370" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">同一高度上，窗户把光斑整体放大</text>
  <path d="M 210 43 Q 370 49 530 43" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <rect x="60" y="150" width="620" height="180" rx="2" fill="#fffdf5" stroke="#777777" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 60 150 L 680 150" stroke="#d6a040" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <path d="M 60 330 L 680 330" stroke="#d6a040" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <text x="686" y="152" text-anchor="start" font-size="10.5" fill="#8a6015" filter="url(#rough2)">y = h</text>
  <text x="686" y="334" text-anchor="start" font-size="10.5" fill="#8a6015" filter="url(#rough2)">y = -h</text>
  <path d="M 280 150 L 340 150" stroke="#7a5aa0" stroke-width="5" fill="none" filter="url(#rough2)"/>
  <path d="M 280 330 L 340 330" stroke="#7a5aa0" stroke-width="5" fill="none" filter="url(#rough2)"/>
  <path d="M 430 150 L 470 150" stroke="#7a5aa0" stroke-width="5" fill="none" filter="url(#rough2)"/>
  <path d="M 430 330 L 470 330" stroke="#7a5aa0" stroke-width="5" fill="none" filter="url(#rough2)"/>
  <text x="310" y="138" text-anchor="middle" font-size="10" fill="#7a5aa0" filter="url(#rough2)">窗户</text>
  <circle cx="370" cy="74" r="7" fill="#fdecea" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="384" y="78" text-anchor="start" font-size="10.5" fill="#b85450" filter="url(#rough2)">上光源 (0, f)</text>
  <path d="M 370 80 L 250 330" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <path d="M 370 80 L 500 330" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <text x="240" y="352" text-anchor="start" font-size="10" fill="#b85450" filter="url(#rough2)">上光源的光锥（向下放大）</text>
  <circle cx="370" cy="404" r="7" fill="#e9f4e2" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="384" y="408" text-anchor="start" font-size="10.5" fill="#2f5223" filter="url(#rough2)">下光源 (0, -f)</text>
  <path d="M 370 398 L 250 150" stroke="#4a7a3a" stroke-width="1.2" fill="none" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <path d="M 370 398 L 500 150" stroke="#4a7a3a" stroke-width="1.2" fill="none" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <text x="500" y="118" text-anchor="start" font-size="10" fill="#2f5223" filter="url(#rough2)">下光源的光锥（向上放大）</text>
  <path d="M 60 240 L 680 240" stroke="#446688" stroke-width="1.0" fill="none" stroke-dasharray="3 5" filter="url(#rough2)"/>
  <text x="66" y="234" text-anchor="start" font-size="10" fill="#446688" filter="url(#rough2)">在高度 y 处：光斑 = [l·u, r·u]，u = (f-y)/(f-h)</text>
  <text x="60" y="438" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">被照亮的面积 = 上光斑面积 + 下光斑面积 − 两族光斑的交集；交集按窗户对 (i,j) 拆开，</text>
  <text x="60" y="458" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">每对只是「两个随 y 线性的区间求交」，在端点交叉处切成若干段后逐段积分即可。</text>
</svg>
