<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#b85450"/>
    </marker>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="660" height="420" fill="#fafafa" filter="url(#rough2)"/>
  <text x="330" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">一次操作 = 手牌 σ 与第 i 个格子 c_i 交换</text>

  <!-- 原数组 -->
  <text x="34" y="80" font-size="14" fill="#444" filter="url(#rough2)">a =</text>
  <rect x="80" y="58" width="60" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="80" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="150" y="58" width="60" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="80" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <rect x="220" y="58" width="60" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="80" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <rect x="290" y="58" width="60" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="80" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">4</text>
  <text x="372" y="80" font-size="13" fill="#446688" filter="url(#rough2)">σ = 1⊕2⊕3⊕4 = 4</text>

  <!-- 拆分箭头 -->
  <path d="M120,94 L120,132" stroke="#446688" stroke-width="1.8" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="128" y="114" font-size="12" fill="#446688" filter="url(#rough2)">拆解</text>

  <!-- 手牌 + 格子 -->
  <rect x="52" y="160" width="86" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="95" y="177" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">手牌</text>
  <text x="95" y="197" text-anchor="middle" font-size="15" fill="#8a6d3b" filter="url(#rough2)">σ = 4</text>

  <rect x="178" y="160" width="66" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="211" y="177" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">c₁</text>
  <text x="211" y="196" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">5</text>

  <rect x="254" y="160" width="66" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="287" y="177" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">c₂</text>
  <text x="287" y="196" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">6</text>

  <rect x="330" y="160" width="66" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="363" y="177" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">c₃</text>
  <text x="363" y="196" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">7</text>

  <rect x="406" y="160" width="66" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="439" y="177" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">c₄</text>
  <text x="439" y="196" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>

  <text x="490" y="182" font-size="12" fill="#666" filter="url(#rough2)">c_i = σ ⊕ a_i</text>
  <text x="490" y="200" font-size="12" fill="#666" filter="url(#rough2)">= 除 i 外全部异或</text>

  <!-- 交换弧线 -->
  <path d="M95,154 Q230,126 363,154" fill="none" stroke="#b85450" stroke-width="1.8"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="228" y="124" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">选中 i = 3，交换</text>

  <!-- 交换后 -->
  <text x="34" y="250" font-size="13" fill="#4a7a3a" filter="url(#rough2)">交换后</text>
  <rect x="52" y="262" width="86" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="95" y="279" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">手牌</text>
  <text x="95" y="299" text-anchor="middle" font-size="15" fill="#4a7a3a" filter="url(#rough2)">σ′ = 7</text>
  <rect x="178" y="262" width="66" height="44" rx="6" fill="#f7f7f7" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="211" y="290" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">5</text>
  <rect x="254" y="262" width="66" height="44" rx="6" fill="#f7f7f7" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="287" y="290" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">6</text>
  <rect x="330" y="262" width="66" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="363" y="290" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">4</text>
  <rect x="406" y="262" width="66" height="44" rx="6" fill="#f7f7f7" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="439" y="290" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0</text>
  <text x="490" y="290" font-size="12" fill="#666" filter="url(#rough2)">只有 c₃ 与手牌对调</text>

  <!-- 还原数组 -->
  <text x="34" y="352" font-size="14" fill="#444" filter="url(#rough2)">a′ =</text>
  <rect x="80" y="330" width="60" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="352" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <rect x="150" y="330" width="60" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="352" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="220" y="330" width="60" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="352" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <rect x="290" y="330" width="60" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="352" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">7</text>
  <text x="372" y="352" font-size="12" fill="#666" filter="url(#rough2)">a_i = 手牌 ⊕ c_i</text>

  <text x="330" y="392" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">直接验证：选 i = 3 后 [1⊕3, 2⊕3, 3, 4⊕3] = [2, 1, 3, 7] ✔</text>
  <text x="330" y="410" text-anchor="middle" font-size="12" fill="#a0522d" filter="url(#rough2)">n 为偶数 ⇒ c_j 在这一次操作里只被异或一次，才恰好是「对调」</text>
</svg>
