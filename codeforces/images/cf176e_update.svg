<svg xmlns="http://www.w3.org/2000/svg" width="740" height="330" viewBox="0 0 740 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="239"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="740" height="330" fill="#fafafa"/>
  <text x="370" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">插入 / 删除只需改三条邻接边</text>
  <path d="M 170 46 Q 370 52 570 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <circle cx="110" cy="130" r="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="110" y="136" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">p</text>
  <circle cx="310" cy="130" r="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="136" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">x</text>
  <circle cx="510" cy="130" r="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="510" y="136" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">n</text>
  <path d="M 142 120 Q 210 96 278 120" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 342 120 Q 410 96 478 120" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="210" y="84" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#b85450" filter="url(#rough2)">dist(p,x)</text>
  <text x="410" y="84" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#b85450" filter="url(#rough2)">dist(x,n)</text>
  <path d="M 142 152 Q 310 216 478 152" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="310" y="216" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#666" filter="url(#rough2)">原来相邻的 dist(p,n) 被拆掉</text>
  <rect x="60" y="240" width="620" height="70" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="74" y="264" text-anchor="start" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">插入：total += d(p,x) + d(x,n) − d(p,n)；删除：total −= 同样的式子。</text>
  <text x="74" y="286" text-anchor="start" font-size="11" font-weight="normal" fill="#7a5a1b" filter="url(#rough2)">每个事件 O(log n)：有序集合找前驱/后继 + 三次 LCA 距离。</text>
</svg>
