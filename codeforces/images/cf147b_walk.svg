<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="351"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="320" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">把「长度 ≤ L 的最大闭环收益」写成 max-plus 矩阵</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">(X⊗Y)[i][j] = max_k X[i][k] + Y[k][j]</text>
  <g filter="url(#rough2)"><rect x="60" y="96" width="380" height="100" rx="6" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="250" y="124" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">T₁ = 邻接矩阵</text>
  <text x="250" y="150" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">对角线取 0（原地不动）</text>
  <text x="250" y="174" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">其余边权 c_ij，无边为 −∞</text>
  <text x="500" y="150" text-anchor="middle" font-size="26" fill="#666666" filter="url(#rough2)">⊗</text>
  <g filter="url(#rough2)"><rect x="540" y="96" width="300" height="100" rx="6" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="690" y="124" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">T_{2L} = T_L ⊗ T_L</text>
  <text x="690" y="152" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">长度上限可以直接相加</text>
  <g filter="url(#rough2)"><rect x="60" y="216" width="780" height="84" rx="6" fill="#f3d9d6" fill-opacity="0.45" stroke="#8a2b28" stroke-width="1.4"/></g>
  <text x="450" y="242" text-anchor="middle" font-size="13.5" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">存在长度 ≤ L 的正环　⟺　max_i T_L[i][i] &gt; 0</text>
  <text x="450" y="272" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">这个谓词关于 L 单调 ⇒ 可以倍增定位答案（首次为真的 L 就是最短正环长度）</text>
</svg>
