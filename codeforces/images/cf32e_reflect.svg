<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="363" />
      <feDisplacementMap in="SourceGraphic" scale="1.5" />
    </filter>
  </defs>
  <rect width="760" height="450" fill="#fafafa" />
  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">反射：把 P 对称到 P'，Q = VP' ∩ 镜子</text>
  <path d="M 100 44 Q 380 50 660 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)" />

  
  <line x1="380" y1="80" x2="380" y2="380" stroke="#8a6015" stroke-width="5" filter="url(#rough2)" />
  <text x="392" y="100" font-size="11" fill="#8a6015" filter="url(#rough2)">镜子（双面）</text>

  
  <circle cx="220" cy="320" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" />
  <circle cx="260" cy="150" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)" />
  <text x="204" y="342" font-size="11" fill="#2f4a66" filter="url(#rough2)">V</text>
  <text x="244" y="140" font-size="11" fill="#2f5223" filter="url(#rough2)">P</text>

  
  <circle cx="500" cy="150" r="8" fill="#fde8e8" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)" />
  <text x="510" y="142" font-size="11" fill="#8a3b36" filter="url(#rough2)">P'</text>

  
  <line x1="220" y1="320" x2="500" y2="150" stroke="#b85450" stroke-width="1.3" stroke-dasharray="5 4" filter="url(#rough2)" />
  <line x1="220" y1="320" x2="380" y2="230" stroke="#446688" stroke-width="2.2" filter="url(#rough2)" />
  <line x1="380" y1="230" x2="260" y2="150" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)" />

  <circle cx="380" cy="230" r="6" fill="#fff8e1" stroke="#8a6015" stroke-width="1.8" filter="url(#rough2)" />
  <text x="392" y="226" font-size="11" fill="#8a6015" filter="url(#rough2)">Q</text>

  
  <line x1="280" y1="260" x2="350" y2="240" stroke="#2b2b2b" stroke-width="4" filter="url(#rough2)" />
  <text x="300" y="282" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">墙（挡住 VP，但不挡 VQ、QP）</text>

  
  <text x="290" y="210" font-size="10.5" fill="#446688" filter="url(#rough2)">VQ</text>
  <text x="315" y="170" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">QP</text>
  <text x="350" y="330" font-size="10.5" fill="#8a3b36" filter="url(#rough2)">V、P 在镜子同侧</text>

  
  <rect x="60" y="382" width="640" height="54" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)" />
  <text x="78" y="404" font-size="11.5" fill="#8a6015" filter="url(#rough2)">1. 反射 P 得 P'；2. 若 VP' 与镜子线段交于 Q，则入射角 = 反射角；</text>
  <text x="78" y="424" font-size="11.5" fill="#8a6015" filter="url(#rough2)">3. 再检查墙是否与 VQ 或 QP 相交；都不相交才 YES。</text>
</svg>