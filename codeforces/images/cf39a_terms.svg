<svg xmlns="http://www.w3.org/2000/svg" width="760" height="410" viewBox="0 0 760 410" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-6%" y="-6%" width="112%" height="112%"><feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="391" /><feDisplacementMap in="SourceGraphic" scale="1.5" /></filter></defs>
  <rect width="760" height="410" fill="#fafafa" />
  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每个 term 的贡献与副作用</text>
  <path d="M 160 44 Q 380 50 600 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)" />

  <rect x="40" y="70" width="330" height="150" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)" />
  <text x="205" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">c * a++（后缀）</text>
  <text x="60" y="128" font-size="12" fill="#2f4a66" filter="url(#rough2)">先取当前 a，乘 c；</text>
  <text x="60" y="152" font-size="12" fill="#2f4a66" filter="url(#rough2)">贡献 = c · a；</text>
  <text x="60" y="176" font-size="12" fill="#2f4a66" filter="url(#rough2)">然后 a ← a + 1。</text>
  <text x="205" y="204" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">a 的增量发生在取值之后</text>

  <rect x="390" y="70" width="330" height="150" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)" />
  <text x="555" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">c * ++a（前缀）</text>
  <text x="410" y="128" font-size="12" fill="#7a5a1b" filter="url(#rough2)">先 a ← a + 1；</text>
  <text x="410" y="152" font-size="12" fill="#7a5a1b" filter="url(#rough2)">贡献 = c · (a + 1)；</text>
  <text x="410" y="176" font-size="12" fill="#7a5a1b" filter="url(#rough2)">等价于 c · a + c。</text>
  <text x="555" y="204" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">a 的增量发生在取值之前</text>

  <rect x="40" y="244" width="680" height="140" rx="10" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.5" filter="url(#rough2)" />
  <text x="60" y="270" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">不管 pre 还是 post，每个 term 都让 a 增加 1</text>
  <text x="60" y="296" font-size="12" fill="#555" filter="url(#rough2)">若一个 term 是第 p 个被计算（前面已有 p 个 term），它的“基础贡献”是 c · (a₀ + p)。</text>
  <text x="60" y="320" font-size="12" fill="#555" filter="url(#rough2)">前缀 term 额外加 c，后缀 term 额外加 0；这个额外项与顺序无关。</text>
  <text x="60" y="348" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">所以只需最大化 Σ c · p：把带符号系数 c 升序排列即可（重排不等式）。</text>
  <text x="60" y="370" font-size="11.5" fill="#777" filter="url(#rough2)">系数为负的 term 越早越好；系数越大的 term 越晚越好，让它的 c 乘上更大的 a。</text>
</svg>