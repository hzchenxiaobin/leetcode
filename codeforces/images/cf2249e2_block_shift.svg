<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="760" height="400" fill="#fafafa"/>
  <text x="380" y="32" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">把 s 切成 k^L 的块：每块都是基础块的「加常数」副本</text>
  <text x="380" y="54" text-anchor="middle" font-size="11.5" fill="#888888" filter="url(#rough2)">s[a·M + b] ≡ s_a + s_b (mod k)，b &lt; M = k^L</text>
  <rect x="60" y="84" width="190" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="155" y="80" text-anchor="middle" font-size="10.5" fill="#888888" filter="url(#rough2)">块 a−1</text>
  <rect x="285" y="84" width="190" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="80" text-anchor="middle" font-size="10.5" fill="#888888" filter="url(#rough2)">块 a</text>
  <rect x="510" y="84" width="190" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="605" y="80" text-anchor="middle" font-size="10.5" fill="#888888" filter="url(#rough2)">块 a+1</text>
  <text x="155" y="112" text-anchor="middle" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)">B ⊕ s[a−1]</text>
  <text x="380" y="112" text-anchor="middle" font-size="13.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">B ⊕ s[a]</text>
  <text x="605" y="112" text-anchor="middle" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)">B ⊕ s[a+1]</text>
  <text x="380" y="146" text-anchor="middle" font-size="11.5" fill="#888888" filter="url(#rough2)">块内每个数字 = B 的对应数字 + s[a]（模 k），M = k^L</text>
  <rect x="40" y="160" width="330" height="152" rx="6" fill="#fdfdfd" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="205" y="182" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 整段在块内：b ≤ M − n</text>
  <rect x="60" y="194" width="290" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="120" y="194" width="130" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="185" y="212" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">t</text>
  <text x="205" y="244" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">命中 ⇔ B[b..b+n) 与 t 只差一个常数</text>
  <text x="205" y="264" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">且常数必须等于 s[a] → 只需 cnt[v]</text>
  <text x="205" y="288" text-anchor="middle" font-size="10.5" fill="#888888" filter="url(#rough2)">（这样的偏移共 M−n+1 个，KMP 一遍找出）</text>
  <rect x="390" y="160" width="330" height="152" rx="6" fill="#fdfdfd" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="555" y="182" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">② 跨过块边界：b &gt; M − n</text>
  <rect x="410" y="194" width="130" height="26" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="545" y="194" width="130" height="26" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="470" y="194" width="120" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="530" y="212" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">t</text>
  <text x="555" y="244" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">左半段要常数 s[a]、右半段要 s[a+1]</text>
  <text x="555" y="264" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">整条序列里这样的起点只有 n−1 个</text>
  <text x="555" y="288" text-anchor="middle" font-size="10.5" fill="#888888" filter="url(#rough2)">（对 B 的前缀/后缀各做一次 Z 即可）</text>
  <rect x="50" y="322" width="660" height="56" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="344" text-anchor="middle" font-size="12" fill="#8a6d20" font-weight="bold" filter="url(#rough2)">s[a+1] ≡ s_a + 1 + r(a) (mod k)，r(a) = a 末尾连续 k−1 的个数</text>
  <text x="380" y="364" text-anchor="middle" font-size="11" fill="#888888" filter="url(#rough2)">跨界项只需 (s_a, r(a) mod k) 的联合分布 → 一个 O(k·log_k X) 的数论统计</text>
</svg>
