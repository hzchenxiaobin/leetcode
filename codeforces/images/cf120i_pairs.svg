<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="760" height="340" fill="#fafafa"/>
  <text x="380.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">幸运度 = Σ 数对的共同段数</text>
  <path d="M 121.60000000000001 42 Q 380.0 48 638.4 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="380.0" y="326" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">数字 i 与数字 n+i 配对，各对独立</text>
  <rect x="70" y="70" width="80" height="46" rx="7" fill="#f4f4f1" stroke="#c8c8c0" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="110" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <rect x="160" y="70" width="80" height="46" rx="7" fill="#f4f4f1" stroke="#c8c8c0" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="200" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <rect x="250" y="70" width="80" height="46" rx="7" fill="#f4f4f1" stroke="#c8c8c0" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="290" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <rect x="340" y="70" width="80" height="46" rx="7" fill="#f4f4f1" stroke="#c8c8c0" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="380" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <text x="430" y="100" text-anchor="middle" font-size="16" fill="#555555" filter="url(#rough2)">→</text>
  <rect x="70" y="130" width="80" height="46" rx="7" fill="#f4f4f1" stroke="#c8c8c0" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="110" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <rect x="160" y="130" width="80" height="46" rx="7" fill="#f4f4f1" stroke="#c8c8c0" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="200" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <rect x="250" y="130" width="80" height="46" rx="7" fill="#f4f4f1" stroke="#c8c8c0" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="290" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <rect x="340" y="130" width="80" height="46" rx="7" fill="#f4f4f1" stroke="#c8c8c0" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="380" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">8</text>
  <text x="430" y="160" text-anchor="middle" font-size="16" fill="#555555" filter="url(#rough2)">→</text>
  <text x="80" y="60" text-anchor="start" font-size="11" fill="#335478" filter="url(#rough2)">左半</text>
  <text x="80" y="130" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">右半（示例 2）</text>
  <rect x="500" y="70" width="220" height="106" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="610" y="100" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">|2∩4| = 2</text>
  <text x="610" y="125" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">|3∩5| = 4 → 6</text>
  <text x="610" y="150" text-anchor="middle" font-size="11" fill="#8c2f2c" filter="url(#rough2)">换成 8 后 |3∩8| = 5</text>
  <rect x="70" y="200" width="650" height="50" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="395" y="230" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">枚举第一个变大的位置 p（从右往左）+ 数字 d（从小到大），后缀贪心填最小</text>
  <text x="395" y="285" text-anchor="middle" font-size="11.5" fill="#335478" filter="url(#rough2)">上界 = 固定对贡献 + 单固定对的 M1 + 双自由对的 7；≥ D+1 才可行</text>
</svg>
