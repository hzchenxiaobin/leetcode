<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="163"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="760" height="420" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">80 位密码切成 8 组，每组 10 位查一张“数字表”</text>
  <path d="M 152 39 Q 380 45 608 39" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="40" y="62" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">密文（80 位）</text>
  <rect x="40" y="74" width="76" height="40" rx="4" fill="#dcebfb" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="78.0" y="100" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">第 1 组</text>
  <rect x="124" y="74" width="76" height="40" rx="4" fill="#eef3fb" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="162.0" y="100" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">第 2 组</text>
  <rect x="208" y="74" width="76" height="40" rx="4" fill="#dcebfb" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="246.0" y="100" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">第 3 组</text>
  <rect x="292" y="74" width="76" height="40" rx="4" fill="#eef3fb" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="330.0" y="100" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">第 4 组</text>
  <rect x="376" y="74" width="76" height="40" rx="4" fill="#dcebfb" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="414.0" y="100" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">第 5 组</text>
  <rect x="460" y="74" width="76" height="40" rx="4" fill="#eef3fb" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="498.0" y="100" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">第 6 组</text>
  <rect x="544" y="74" width="76" height="40" rx="4" fill="#dcebfb" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
