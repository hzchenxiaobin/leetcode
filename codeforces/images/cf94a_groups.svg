  <rect x="628" y="74" width="76" height="40" rx="4" fill="#eef3fb" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="666.0" y="100" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">第 8 组</text>
  <line x1="78.0" y1="118" x2="78.0" y2="150" stroke="#9bb3cc" stroke-width="1.2" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <line x1="162.0" y1="118" x2="162.0" y2="150" stroke="#9bb3cc" stroke-width="1.2" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <line x1="246.0" y1="118" x2="246.0" y2="150" stroke="#9bb3cc" stroke-width="1.2" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <line x1="330.0" y1="118" x2="330.0" y2="150" stroke="#9bb3cc" stroke-width="1.2" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <line x1="414.0" y1="118" x2="414.0" y2="150" stroke="#9bb3cc" stroke-width="1.2" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <line x1="498.0" y1="118" x2="498.0" y2="150" stroke="#9bb3cc" stroke-width="1.2" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <line x1="582.0" y1="118" x2="582.0" y2="150" stroke="#9bb3cc" stroke-width="1.2" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <line x1="666.0" y1="118" x2="666.0" y2="150" stroke="#9bb3cc" stroke-width="1.2" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="40" y="176" text-anchor="start" font-size="12.5" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">每种取值对应的数字（10 行，两两不同）</text>
  <rect x="40" y="190" width="140" height="44" rx="5" fill="#e9f4ec" stroke="#3f6b4a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="60" y="218" text-anchor="middle" font-size="15" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">0</text>
  <text x="76" y="218" text-anchor="start" font-size="10.5" fill="#2f5223" filter="url(#rough2)">→ 10 位编码</text>
  <rect x="188" y="190" width="140" height="44" rx="5" fill="#e9f4ec" stroke="#3f6b4a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="208" y="218" text-anchor="middle" font-size="15" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">1</text>
  <text x="224" y="218" text-anchor="start" font-size="10.5" fill="#2f5223" filter="url(#rough2)">→ 10 位编码</text>
  <rect x="336" y="190" width="140" height="44" rx="5" fill="#e9f4ec" stroke="#3f6b4a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="356" y="218" text-anchor="middle" font-size="15" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">2</text>
  <text x="372" y="218" text-anchor="start" font-size="10.5" fill="#2f5223" filter="url(#rough2)">→ 10 位编码</text>
  <rect x="484" y="190" width="140" height="44" rx="5" fill="#e9f4ec" stroke="#3f6b4a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="504" y="218" text-anchor="middle" font-size="15" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">3</text>
  <text x="520" y="218" text-anchor="start" font-size="10.5" fill="#2f5223" filter="url(#rough2)">→ 10 位编码</text>
  <rect x="632" y="190" width="140" height="44" rx="5" fill="#e9f4ec" stroke="#3f6b4a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="652" y="218" text-anchor="middle" font-size="15" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">4</text>
  <text x="668" y="218" text-anchor="start" font-size="10.5" fill="#2f5223" filter="url(#rough2)">→ 10 位编码</text>
  <rect x="40" y="246" width="140" height="44" rx="5" fill="#e9f4ec" stroke="#3f6b4a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="60" y="274" text-anchor="middle" font-size="15" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">5</text>
  <text x="76" y="274" text-anchor="start" font-size="10.5" fill="#2f5223" filter="url(#rough2)">→ 10 位编码</text>
  <rect x="188" y="246" width="140" height="44" rx="5" fill="#e9f4ec" stroke="#3f6b4a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="208" y="274" text-anchor="middle" font-size="15" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">6</text>
  <text x="224" y="274" text-anchor="start" font-size="10.5" fill="#2f5223" filter="url(#rough2)">→ 10 位编码</text>
  <rect x="336" y="246" width="140" height="44" rx="5" fill="#e9f4ec" stroke="#3f6b4a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="356" y="274" text-anchor="middle" font-size="15" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">7</text>
  <text x="372" y="274" text-anchor="start" font-size="10.5" fill="#2f5223" filter="url(#rough2)">→ 10 位编码</text>
  <rect x="484" y="246" width="140" height="44" rx="5" fill="#e9f4ec" stroke="#3f6b4a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="504" y="274" text-anchor="middle" font-size="15" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">8</text>
  <text x="520" y="274" text-anchor="start" font-size="10.5" fill="#2f5223" filter="url(#rough2)">→ 10 位编码</text>
  <rect x="632" y="246" width="140" height="44" rx="5" fill="#e9f4ec" stroke="#3f6b4a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="652" y="274" text-anchor="middle" font-size="15" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">9</text>
  <text x="668" y="274" text-anchor="start" font-size="10.5" fill="#2f5223" filter="url(#rough2)">→ 10 位编码</text>
  <rect x="40" y="316" width="690" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="340" text-anchor="start" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">把 8 组分别换成数字就是 8 位密码。密码的数字可以重复，但“数字 → 编码”是单射，</text>
  <text x="56" y="360" text-anchor="start" font-size="12" fill="#7a5a1b" filter="url(#rough2)">所以每组至多对应一个数字，逐组查表即可（O(8×10) 次 10 字符串比较）。</text>
</svg>
