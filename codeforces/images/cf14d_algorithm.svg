<svg xmlns="http://www.w3.org/2000/svg" width="740" height="440" viewBox="0 0 740 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="143"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="a14darr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="740" height="440" fill="#fafafa"/>

  <text x="370" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">枚举断边 + 两侧各求一次直径</text>
  <path d="M 150 44 Q 370 50 590 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <rect x="40" y="64" width="300" height="48" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="94" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">读入树，存下 n-1 条边</text>
  <line x1="190" y1="112" x2="190" y2="130" stroke="#446688" stroke-width="1.7" marker-end="url(#a14darr)" filter="url(#rough2)"/>

  <rect x="40" y="132" width="300" height="56" rx="9" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="156" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">对每条边 e = (u, v)：</text>
  <text x="190" y="176" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">临时禁止这条边</text>
  <line x1="190" y1="188" x2="190" y2="206" stroke="#446688" stroke-width="1.7" marker-end="url(#a14darr)" filter="url(#rough2)"/>

  <rect x="40" y="208" width="300" height="62" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="232" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">从 u、v 分别 BFS，求两个直径</text>
  <text x="190" y="253" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">d1 = diam(u 侧)，d2 = diam(v 侧)</text>
  <line x1="190" y1="270" x2="190" y2="288" stroke="#446688" stroke-width="1.7" marker-end="url(#a14darr)" filter="url(#rough2)"/>

  <rect x="40" y="290" width="300" height="48" rx="9" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="320" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">ans = max(ans, d1 * d2)</text>
  <line x1="190" y1="338" x2="190" y2="356" stroke="#446688" stroke-width="1.7" marker-end="url(#a14darr)" filter="url(#rough2)"/>

  <rect x="40" y="358" width="300" height="46" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="386" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">输出 ans</text>

  <!-- 右侧说明 -->
  <rect x="380" y="64" width="330" height="340" rx="12" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="400" y="90" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">树的直径怎么求</text>
  <text x="400" y="118" font-size="11.5" fill="#555" filter="url(#rough2)">从任意点 s 出发 BFS，找到最远点 a；</text>
  <text x="400" y="140" font-size="11.5" fill="#555" filter="url(#rough2)">再从 a 出发 BFS，最远距离就是直径。</text>
  <text x="400" y="166" font-size="11.5" fill="#555" filter="url(#rough2)">树是无权图，两次 BFS 即可，O(n)。</text>

  <text x="400" y="204" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">复杂度</text>
  <text x="400" y="230" font-size="11.5" fill="#555" filter="url(#rough2)">每条边做两次 BFS（两侧各一次），</text>
  <text x="400" y="252" font-size="11.5" fill="#555" filter="url(#rough2)">每次 O(n)，共 O(n²)。</text>
  <text x="400" y="276" font-size="11.5" fill="#555" filter="url(#rough2)">n ≤ 200，约 4×10⁴ 次访问。</text>

  <text x="400" y="314" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">为什么可以只枚举断边</text>
  <text x="400" y="340" font-size="11.5" fill="#555" filter="url(#rough2)">任意两条不相交路径之间都有一条</text>
  <text x="400" y="362" font-size="11.5" fill="#555" filter="url(#rough2)">“桥边”能把它们分到两侧；枚举这条</text>
  <text x="400" y="384" font-size="11.5" fill="#555" filter="url(#rough2)">边，再各取直径，就覆盖了最优解。</text>
</svg>
