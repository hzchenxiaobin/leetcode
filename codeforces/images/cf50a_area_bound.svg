<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="720" height="380" fill="#fafafa"/>
  <text x="360" y="36" font-size="20" fill="#2b2b2b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">每张骨牌恰好覆盖 2 格，面积给出上界</text>
  <path d="M 120 46 Q 360 52 600 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <line x1="74" y1="110" x2="258" y2="110" stroke="#9aa7b4" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="74" y1="156" x2="258" y2="156" stroke="#9aa7b4" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="74" y1="202" x2="258" y2="202" stroke="#9aa7b4" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="74" y1="110" x2="74" y2="202" stroke="#9aa7b4" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="120" y1="110" x2="120" y2="202" stroke="#9aa7b4" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="166" y1="110" x2="166" y2="202" stroke="#9aa7b4" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="212" y1="110" x2="212" y2="202" stroke="#9aa7b4" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="258" y1="110" x2="258" y2="202" stroke="#9aa7b4" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="77" y="113" width="40" height="86" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="97.0" y="160.32" font-size="12" fill="#3a3a2a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="123" y="113" width="40" height="86" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="143.0" y="160.32" font-size="12" fill="#3a3a2a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="169" y="113" width="40" height="86" rx="7" fill="#fff3e0" stroke="#d6a040" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="189.0" y="160.32" font-size="12" fill="#3a3a2a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="215" y="113" width="40" height="86" rx="7" fill="#fdeaea" stroke="#b85450" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="235.0" y="160.32" font-size="12" fill="#3a3a2a" text-anchor="middle" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="166" y="226" font-size="12.5" fill="#44546a" text-anchor="middle" filter="url(#rough2)">m = 2 行，n = 4 列，共 8 格</text>
  <text x="300" y="118" font-size="13" fill="#2f4a66" text-anchor="start" font-weight="bold" filter="url(#rough2)">4 张竖直骨牌（每列一张）</text>
  <text x="300" y="144" font-size="13" fill="#2b2b2b" text-anchor="start" filter="url(#rough2)">恰好盖住全部 8 格，互不重叠</text>
  <text x="300" y="170" font-size="13" fill="#2b2b2b" text-anchor="start" filter="url(#rough2)">也不必伸出棋盘</text>
  <text x="300" y="208" font-size="13" fill="#8a6015" text-anchor="start" font-weight="bold" filter="url(#rough2)">上界推理：</text>
  <text x="300" y="232" font-size="13" fill="#2b2b2b" text-anchor="start" filter="url(#rough2)">k 张骨牌占 2k 个不同格子</text>
  <text x="300" y="256" font-size="13" fill="#2b2b2b" text-anchor="start" filter="url(#rough2)">2k ≤ m·n  ⇒  k ≤ ⌊m·n / 2⌋</text>
  <rect x="60" y="288" width="600" height="62" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="316" font-size="17" fill="#8a6015" text-anchor="start" font-weight="bold" filter="url(#rough2)">答案 = ⌊m·n / 2⌋</text>
  <text x="80" y="340" font-size="12" fill="#2b2b2b" text-anchor="start" filter="url(#rough2)">偶数面积可由构造铺满；奇数面积必剩 1 格（骨牌不许切割）</text>
</svg>
