<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="880" height="420" fill="#fafafa"/>

  <text x="440" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：只有「0 的个数」决定答案</text>
  <path d="M 190 43 Q 440 50 690 43" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="440" y="66" text-anchor="middle" font-size="12.5" fill="#66788c" filter="url(#rough2)">数值大小无关紧要：非 0 元素只需要「不是 0」这一个性质</text>

  <!-- 面板 1 -->
  <rect x="26" y="86" width="260" height="210" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="156" y="114" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">0 的个数 = 0</text>
  <text x="156" y="146" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">数组里一个 0 都没有</text>
  <text x="156" y="170" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">三个集合 mex 都是 0</text>
  <text x="156" y="194" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">0 + 0 + 0 ≥ 2·0</text>
  <text x="156" y="218" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">恒成立</text>
  <rect x="58" y="236" width="196" height="42" rx="7" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="156" y="255" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">⇒ 一定 YES</text>
  <text x="156" y="273" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">全部塞给 A 即可</text>

  <!-- 面板 2 -->
  <rect x="310" y="86" width="260" height="210" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="440" y="114" text-anchor="middle" font-size="15" font-weight="bold" fill="#a14340" filter="url(#rough2)">0 的个数 = 1</text>
  <text x="440" y="146" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">只有一个集合拿到 0</text>
  <text x="440" y="170" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">设它的 mex = m ≥ 1</text>
  <text x="440" y="194" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">另两个集合 mex = 0</text>
  <text x="440" y="218" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">左边 = m ，右边 = 2m</text>
  <rect x="342" y="236" width="196" height="42" rx="7" fill="#ffffff" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="440" y="255" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">⇒ 一定 NO</text>
  <text x="440" y="273" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">m ≥ 2m 与 m ≥ 1 矛盾</text>

  <!-- 面板 3 -->
  <rect x="594" y="86" width="260" height="210" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="724" y="114" text-anchor="middle" font-size="15" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">0 的个数 ≥ 2</text>
  <text x="724" y="146" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">第 1 个 0 → B，其余 0 → C</text>
  <text x="724" y="170" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">所有非 0 元素 → A</text>
  <text x="724" y="194" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">mex = (0, 1, 1)</text>
  <text x="724" y="218" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">0 + 1 + 1 = 2 = 2·1</text>
  <rect x="626" y="236" width="196" height="42" rx="7" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="724" y="255" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">⇒ 一定 YES</text>
  <text x="724" y="273" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">构造恰好取到等号</text>

  <!-- 结论 -->
  <rect x="26" y="316" width="828" height="60" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="440" y="342" text-anchor="middle" font-size="13.5" fill="#8a6015" filter="url(#rough2)">答案与 n、与数值大小都无关：只看 0 的个数是不是恰好 1</text>
  <text x="440" y="365" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">关键手法是「牺牲一个集合」：A 里一个 0 都不放，mex(A) 直接等于 0</text>

  <text x="440" y="400" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">mex 只关心「0..k−1 是否齐全」和「k 是否缺席」，所以把非 0 元素堆进 A 不会抬高 B、C 的 mex</text>
</svg>
