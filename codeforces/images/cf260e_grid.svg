<svg xmlns="http://www.w3.org/2000/svg" width="880" height="310" viewBox="0 0 880 310"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="310" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">四条线切成 9 块，块内城市数 = 给定的 9 个数</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">先由"9 个数分组之和"定出线的大致位置，再逐块核对</text>
  <g filter="url(#rough2)"><rect x="140" y="90" width="100" height="60" rx="3" fill="#d7ecd0" fill-opacity="0.7" stroke="#8899aa" stroke-width="1.2"/></g>
  <g filter="url(#rough2)"><rect x="140" y="160" width="100" height="60" rx="3" fill="#cfe0f0" fill-opacity="0.7" stroke="#8899aa" stroke-width="1.2"/></g>
  <g filter="url(#rough2)"><rect x="140" y="230" width="100" height="60" rx="3" fill="#f6e3c4" fill-opacity="0.7" stroke="#8899aa" stroke-width="1.2"/></g>
  <g filter="url(#rough2)"><rect x="240" y="90" width="100" height="60" rx="3" fill="#cfe0f0" fill-opacity="0.7" stroke="#8899aa" stroke-width="1.2"/></g>
  <g filter="url(#rough2)"><rect x="240" y="160" width="100" height="60" rx="3" fill="#f6e3c4" fill-opacity="0.7" stroke="#8899aa" stroke-width="1.2"/></g>
  <g filter="url(#rough2)"><rect x="240" y="230" width="100" height="60" rx="3" fill="#d7ecd0" fill-opacity="0.7" stroke="#8899aa" stroke-width="1.2"/></g>
  <g filter="url(#rough2)"><rect x="340" y="90" width="100" height="60" rx="3" fill="#f6e3c4" fill-opacity="0.7" stroke="#8899aa" stroke-width="1.2"/></g>
  <g filter="url(#rough2)"><rect x="340" y="160" width="100" height="60" rx="3" fill="#d7ecd0" fill-opacity="0.7" stroke="#8899aa" stroke-width="1.2"/></g>
  <g filter="url(#rough2)"><rect x="340" y="230" width="100" height="60" rx="3" fill="#cfe0f0" fill-opacity="0.7" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="560" y="120" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">列和 = 某 3 个数之和</text>
  <text x="560" y="152" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">行和同理</text>
  <text x="560" y="192" text-anchor="start" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">枚举这些切分组合，核对 9 块计数</text>
</svg>
