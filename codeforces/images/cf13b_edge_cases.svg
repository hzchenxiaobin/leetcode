<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">四类边界：比例、角度、共线、端点</text>
  <path d="M 185 42 Q 360 48 535 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 面板 A：比例 -->
  <rect x="25" y="48" width="330" height="155" rx="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="42" y="72" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">比例：t = OQ/OA ∈ [1/5, 4/5]</text>
  <line x1="55" y1="140" x2="330" y2="140" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="110" y="128" width="165" height="24" fill="#e6f4ea" stroke="none" opacity="0.9" filter="url(#rough2)"/>
  <g stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)">
    <line x1="110" y1="130" x2="110" y2="150"/>
    <line x1="275" y1="130" x2="275" y2="150"/>
  </g>
  <g stroke="#b85450" stroke-width="2" filter="url(#rough2)">
    <line x1="76" y1="134" x2="88" y2="146"/><line x1="76" y1="146" x2="88" y2="134"/>
    <line x1="296" y1="134" x2="308" y2="146"/><line x1="296" y1="146" x2="308" y2="134"/>
  </g>
  <text x="110" y="167" text-anchor="middle" font-size="10.5" fill="#2f5223" filter="url(#rough2)">1/5 ✓</text>
  <text x="275" y="167" text-anchor="middle" font-size="10.5" fill="#2f5223" filter="url(#rough2)">4/5 ✓</text>
  <text x="42" y="192" font-size="10.5" fill="#8a3b38" filter="url(#rough2)">t=0.1 或 0.9 时短/长 &lt; 1/4 → NO</text>

  <!-- 面板 B：角度 -->
  <rect x="370" y="48" width="330" height="155" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="387" y="72" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">角度：0° &lt; θ ≤ 90°</text>
  <line x1="400" y1="180" x2="400" y2="100" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <line x1="400" y1="180" x2="480" y2="180" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <path d="M 400 152 A 28 28 0 0 1 428 180" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="438" y="128" font-size="11" font-weight="bold" fill="#2f5223" filter="url(#rough2)">90° ✓</text>
  <path d="M 400 180 L 462 196" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 3" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="468" y="194" font-size="10.5" fill="#a33a36" filter="url(#rough2)">&gt;90° ✗</text>

  <!-- 面板 C：共线 -->
  <rect x="25" y="212" width="330" height="155" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="42" y="236" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">共线：cross = 0 → NO</text>
  <line x1="70" y1="300" x2="320" y2="300" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <circle cx="195" cy="300" r="4" fill="#2b2b2b" filter="url(#rough2)"/>
  <text x="195" y="290" text-anchor="middle" font-size="10.5" fill="#a33a36" filter="url(#rough2)">θ = 0° 或 180°</text>
  <text x="42" y="350" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">两条腿共线时不能构成字母 A。</text>

  <!-- 面板 D：端点 -->
  <rect x="370" y="212" width="330" height="155" rx="12" fill="#fde8e8" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="387" y="236" font-size="12" font-weight="bold" fill="#a33a36" filter="url(#rough2)">端点：t = 0 或 1 → NO</text>
  <line x1="400" y1="300" x2="690" y2="300" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <circle cx="400" cy="300" r="4.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="690" cy="300" r="4.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="545" cy="300" r="4.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="400" y="320" font-size="10.5" fill="#a33a36" filter="url(#rough2)">t=0 ✗</text>
  <text x="690" y="320" text-anchor="end" font-size="10.5" fill="#a33a36" filter="url(#rough2)">t=1 ✗</text>
  <text x="545" y="288" text-anchor="middle" font-size="10.5" fill="#2f5223" filter="url(#rough2)">中间才 ✓</text>
  <text x="387" y="352" font-size="10.5" fill="#8a3b38" filter="url(#rough2)">横杠端点落在腿的端点上时比例为 0。</text>
</svg>
