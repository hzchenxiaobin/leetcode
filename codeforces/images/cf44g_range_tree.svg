<text x="380" y="362" font-size="15" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#1a5fb4" font-weight="normal" text-anchor="middle" filter="url(#rough2)">查询矩形 = O(log m) 个节点 × (二分 y + 区间最小值) = O(log²m)</text>
