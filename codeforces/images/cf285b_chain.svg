<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320" viewBox="0 0 700 320"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="331"/>
    <feDisplacementMap in="SourceGraphic" scale="1.5"/></filter></defs>
  <rect width="700" height="320" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">玻璃按 p 移动 ⇒ 弹珠沿着 i → p[i] 一直走</text>
  <path d="M 140 40 Q 350 46 560 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <circle cx="90" cy="110" r="22" fill="#dfeafc" stroke="#446688" stroke-width="1.8"/>
    <circle cx="230" cy="110" r="22" fill="#dfeafc" stroke="#446688" stroke-width="1.8"/>
    <circle cx="370" cy="110" r="22" fill="#dfeafc" stroke="#446688" stroke-width="1.8"/>
    <circle cx="510" cy="110" r="22" fill="#e8f4e0" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#22314a" filter="url(#rough2)">
    <text x="90" y="115">s</text><text x="230" y="115">p[s]</text><text x="370" y="115">p²[s]</text><text x="510" y="115">t</text>
  </g>
  <g stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)">
    <path d="M 112 110 L 206 110"/><path d="M 252 110 L 346 110"/><path d="M 392 110 L 486 110"/>
  </g>
  <g filter="url(#rough2)"><rect x="60" y="160" width="580" height="66" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="76" y="184" font-size="13" fill="#8a6015" filter="url(#rough2)">p 是排列 ⇒ 每个点出度 1、入度 1 ⇒ 整张图是若干个环的并。</text>
  <text x="76" y="208" font-size="12.5" fill="#8a6015" filter="url(#rough2)">从 s 出发沿 p 走，一定会进入某个环：若 t 在 s 到环的这段路上，就能到达 ✓</text>
  <g filter="url(#rough2)"><rect x="60" y="240" width="580" height="64" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="264" font-size="12.5" fill="#2f5223" filter="url(#rough2)">最多走 n 步（如果第 n 步还没到 t，就说明 s 在环上且 t 不在环上）⇒ O(n)。</text>
  <text x="76" y="286" font-size="12" fill="#2f5223" filter="url(#rough2)">样例 1：2→3→4→1，3 步到 1 ✓；s=t 时答案 0（样例 2）。</text>
</svg>
