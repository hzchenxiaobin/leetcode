<svg xmlns="http://www.w3.org/2000/svg" width="700" height="330" viewBox="0 0 700 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="700" height="330" fill="#fafafa"/>
  <text x="350.0" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">201A：棋盘色类给出全部可达锐度</text>
  <path d="M 140.00 46 Q 350.0 52 560.00 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="72" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">奇数 n 的构造：取左上象限（(m+1)×(m+1)）里 i+j 为偶数的格子，任取一部分。</text>
  <text x="60" y="92" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">它们两两不相邻 ⇒ 补齐镜像后依然清晰；轨道大小为 1 / 2 / 4，可凑出 0…(n²+1)/2 的每个数。</text>
  <rect x="90" y="118" width="34" height="34" fill="#8fbf86" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="124" y="118" width="34" height="34" fill="#eef3fb" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="158" y="118" width="34" height="34" fill="#8fbf86" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="192" y="118" width="34" height="34" fill="#ffffff" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="226" y="118" width="34" height="34" fill="#ffffff" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="90" y="152" width="34" height="34" fill="#eef3fb" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="124" y="152" width="34" height="34" fill="#8fbf86" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="158" y="152" width="34" height="34" fill="#eef3fb" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="192" y="152" width="34" height="34" fill="#ffffff" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="226" y="152" width="34" height="34" fill="#ffffff" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="90" y="186" width="34" height="34" fill="#8fbf86" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="124" y="186" width="34" height="34" fill="#eef3fb" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="158" y="186" width="34" height="34" fill="#8fbf86" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="192" y="186" width="34" height="34" fill="#ffffff" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="226" y="186" width="34" height="34" fill="#ffffff" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="90" y="220" width="34" height="34" fill="#ffffff" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="124" y="220" width="34" height="34" fill="#ffffff" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="158" y="220" width="34" height="34" fill="#ffffff" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="192" y="220" width="34" height="34" fill="#ffffff" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="226" y="220" width="34" height="34" fill="#ffffff" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="90" y="254" width="34" height="34" fill="#ffffff" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="124" y="254" width="34" height="34" fill="#ffffff" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="158" y="254" width="34" height="34" fill="#ffffff" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="192" y="254" width="34" height="34" fill="#ffffff" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="226" y="254" width="34" height="34" fill="#ffffff" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="192" y1="118" x2="192" y2="288" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <line x1="90" y1="220" x2="260" y2="220" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="150" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">绿格 = 象限内棋盘色类</text>
  <text x="300" y="172" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">数量 = ceil((m+1)²/2)</text>
  <text x="300" y="198" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">每格权重 = 它所在轨道大小</text>
  <text x="300" y="220" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">权重 1 一个、权重 2 若干、权重 4 若干</text>
  <text x="300" y="246" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">⇒ 用“删掉若干轨道”的办法可从</text>
  <text x="300" y="268" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">(n²+1)/2 逐格减到任意 x（n ≥ 5）</text>
</svg>
