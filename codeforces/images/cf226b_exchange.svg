<svg xmlns="http://www.w3.org/2000/svg" width="840" height="380" viewBox="0 0 840 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="380" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两条关键论证</text>
  <g filter="url(#rough2)"><rect x="80" y="90" width="320" height="120" rx="4" fill="#f7fbf4" fill-opacity="0.85" stroke="#a8c99a" stroke-width="1.3"/></g>
  <text x="240" y="116" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3d6b2f" filter="url(#rough2)">重排：大的放浅层</text>
  <text x="240" y="146" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">若 aᵢ &gt; aⱼ 但 depthᵢ &gt; depthⱼ</text>
  <text x="240" y="170" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">交换后代价减少</text>
  <text x="240" y="194" text-anchor="middle" font-size="11.5" fill="#3d6b2f" filter="url(#rough2)">(aᵢ − aⱼ)(depthᵢ − depthⱼ) &gt; 0</text>
  <g filter="url(#rough2)"><rect x="440" y="90" width="320" height="120" rx="4" fill="#fdf6f4" fill-opacity="0.85" stroke="#d8a89a" stroke-width="1.3"/></g>
  <text x="600" y="116" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a4b2a" filter="url(#rough2)">逐层填满</text>
  <text x="600" y="146" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">浅层还有空位、更深的层却有结点？</text>
  <text x="600" y="170" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">移上去后深度严格变小</text>
  <text x="600" y="194" text-anchor="middle" font-size="11.5" fill="#8a4b2a" filter="url(#rough2)">⇒ 最优解必是每层填满</text>
  <text x="420" y="262" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">实现：a 降序 + 前缀和，逐层累加 d · (pre[end] − pre[start])</text>
  <text x="420" y="292" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">k = 1 时每层 1 个：答案 = Σ aᵢ · i（第 i 个的深度就是 i）</text>
  <g filter="url(#rough2)"><rect x="250" y="316" width="340" height="44" rx="4" fill="#faf3ec" fill-opacity="0.85" stroke="#c8a48a" stroke-width="1.3"/></g>
  <text x="420" y="344" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3d6b2f" filter="url(#rough2)">复杂度 O(n log n + q log n)</text>
</svg>
