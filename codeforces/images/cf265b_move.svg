<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="300" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按树依次前进：跳 → （必要时下降）→ 爬到顶 → 吃</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">只能往东跳，所以顺序固定，花费可直接累加</text>
  <g filter="url(#rough2)"><rect x="160" y="150" width="80" height="46" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="200.0" y="177.68" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">树 i</text>
  <g filter="url(#rough2)"><rect x="330" y="150" width="80" height="46" rx="4" fill="#cfe0f0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="370.0" y="177.68" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">树 i+1</text>
  <line x1="245" y1="173" x2="325" y2="173" stroke="#3d6b2f" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="285" y="146" text-anchor="middle" font-size="11" fill="#3d6b2f" filter="url(#rough2)">跳 1s</text>
  <text x="470" y="110" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">h_i &gt; h_{i+1} 时先下降 h_i-h_{i+1}</text>
  <text x="470" y="146" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">再爬到 h_{i+1} 的顶端</text>
  <text x="470" y="186" text-anchor="start" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">每棵树的坚果固定 1s</text>
  <text x="440" y="262" text-anchor="middle" font-size="13" fill="#b05a5a" filter="url(#rough2)">总时间 = Σ(跳 + 竖直移动 + 吃)</text>
</svg>
