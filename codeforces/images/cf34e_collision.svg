<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="373"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="320" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">E：两球弹性碰撞的公式与精度</text>
  <path d="M 180 40 Q 380 45 580 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <rect x="40" y="64" width="330" height="120" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="88" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">动量与能量都守恒</text>
  <text x="52" y="112" font-size="10.5" fill="#3c5e88" filter="url(#rough2)">m1·u1 + m2·u2 = m1·v1 + m2·v2</text>
  <text x="52" y="134" font-size="10.5" fill="#3c5e88" filter="url(#rough2)">m1·u1² + m2·u2² = m1·v1² + m2·v2²</text>
  <text x="52" y="158" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">联立解得（u 为碰前速度）：</text>
  <text x="52" y="176" font-size="10" fill="#8c3a36" filter="url(#rough2)">v1 = ((m1−m2)u1 + 2m2u2)/(m1+m2)</text>

  <rect x="392" y="64" width="328" height="120" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="404" y="88" font-size="11.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">等质量时退化为“交换速度”</text>
  <text x="404" y="112" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">m1 = m2 ⇒ v1 = u2，v2 = u1</text>
  <text x="404" y="134" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">这正是“两球直接穿过彼此”的效果</text>
  <text x="404" y="158" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">但质量不等时速度并不会互换，</text>
  <text x="404" y="176" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">所以不能简单套用“穿透”技巧。</text>

  <rect x="40" y="200" width="680" height="60" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="52" y="224" font-size="10.5" fill="#8a6015" filter="url(#rough2)">碰撞后两球必须在同一位置：代码里把“推进到碰撞时刻”与“更新速度”放在一步里完成，位置不会错开。</text>
  <text x="52" y="246" font-size="10.5" fill="#8a6015" filter="url(#rough2)">同一时刻可能有多对（互不相邻的）相撞，逐对更新速度即可；相邻两对同时相撞属于三球同时相撞，题面保证不出现。</text>

  <rect x="40" y="268" width="680" height="44" rx="10" fill="#fdeceb" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="52" y="290" font-size="10.5" fill="#8c3a36" filter="url(#rough2)">精度：C++ 用 long double（约 18 位有效数字），事件数只有几十次，累积误差 ≪ 10⁻⁹；题目只要求 4 位小数。</text>
  <text x="52" y="306" font-size="10" fill="#8c3a36" filter="url(#rough2)">Python 版用 fractions.Fraction 做精确有理数运算，可与浮点版逐位对拍。</text>
</svg>
