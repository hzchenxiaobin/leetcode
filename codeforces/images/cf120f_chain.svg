<svg xmlns="http://www.w3.org/2000/svg" width="740" height="320" viewBox="0 0 740 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1211"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="740" height="320" fill="#fafafa"/>
  <text x="370.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">把直径端点粘成链</text>
  <path d="M 118.4 42 Q 370.0 48 621.6 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="370.0" y="306" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">答案 = Σ 每棵树的直径</text>
  <rect x="110" y="90" width="200" height="90" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">T1 直径 3</text>
  <text x="210" y="150" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">取一个直径端点</text>
  <rect x="380" y="90" width="200" height="90" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="480" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#5a7fb0" filter="url(#rough2)">T2 直径 4</text>
  <text x="480" y="150" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">取一个直径端点</text>
  <line x1="315.0" y1="135.0" x2="375.0" y2="135.0" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="345" y="120" text-anchor="middle" font-size="11" fill="#8c2f2c" filter="url(#rough2)">粘合</text>
  <rect x="110" y="220" width="520" height="46" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="370" y="248" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">结果直径 = 3 + 4 = 7（上界也是 7）</text>
  <text x="370" y="295" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">任意粘合：路径在每棵树内不超过该树直径，且每棵至多穿过一次</text>
</svg>
