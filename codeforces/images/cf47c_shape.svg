<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="481"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="400" fill="#fafafa"/>

  <text x="380" y="28" text-anchor="middle" font-size="17.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">C：六个词分别放在哪——形状固定，只有 6 个角色</text>
  <path d="M 120 38 Q 380 43 640 38" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

    <rect x="90" y="66" width="154" height="176" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="90" y="66" width="88" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="90" y="66" width="22" height="110" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <rect x="90" y="154" width="154" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <rect x="156" y="66" width="22" height="176" fill="#f3e8fd" stroke="#8a6d9a" stroke-width="1" filter="url(#rough2)"/>
  <rect x="156" y="220" width="88" height="22" fill="#fdeceb" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <rect x="222" y="154" width="22" height="88" fill="#e8f4f8" stroke="#3a7a8a" stroke-width="1" filter="url(#rough2)"/>

  <text x="134" y="82" text-anchor="middle" font-size="10" fill="#2f4a66" filter="url(#rough2)">H1</text>
  <text x="101" y="130" text-anchor="middle" font-size="9.5" fill="#2f5223" filter="url(#rough2)">V1</text>
  <text x="232" y="170" text-anchor="middle" font-size="9.5" fill="#8a6015" filter="url(#rough2)">M</text>
  <text x="167" y="110" text-anchor="middle" font-size="9" fill="#5b3a6e" filter="url(#rough2)">V2</text>
  <text x="200" y="236" text-anchor="middle" font-size="9.5" fill="#8c3a36" filter="url(#rough2)">H3</text>
  <text x="233" y="200" text-anchor="middle" font-size="9" fill="#2c5f6b" filter="url(#rough2)">V3</text>

  <text x="274" y="82" font-size="10" fill="#2f4a66" filter="url(#rough2)">长 a</text>
  <text x="60" y="130" font-size="10" fill="#2f5223" filter="url(#rough2)">长 b</text>
  <text x="274" y="170" font-size="10" fill="#8a6015" filter="url(#rough2)">长 L</text>
  <text x="160" y="60" font-size="10" fill="#5b3a6e" filter="url(#rough2)">长 H</text>
  <text x="196" y="256" font-size="10" fill="#8c3a36" filter="url(#rough2)">长 c = L−a+1</text>
  <text x="250" y="200" font-size="10" fill="#2c5f6b" filter="url(#rough2)">长 d = H−b+1</text>

  <rect x="360" y="60" width="368" height="128" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="372" y="84" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">长度关系（由形状强制）</text>
  <text x="372" y="108" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">网格高 H、宽 L；H1 占第 0 行的前 a 格</text>
  <text x="372" y="130" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">M 占第 b−1 行整行（长 L）</text>
  <text x="372" y="152" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">H3 占第 H−1 行后 c = L−a+1 格</text>
  <text x="372" y="174" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">V3 占第 L−1 列后 d = H−b+1 格</text>

  <rect x="360" y="200" width="368" height="184" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="372" y="226" font-size="11.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">7 个交叉点必须同字符</text>
  <text x="372" y="248" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">(0,0)：H1[0] = V1[0]</text>
  <text x="372" y="269" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">(0,a−1)：H1[a−1] = V2[0]</text>
  <text x="372" y="290" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">(b−1,0)：V1[b−1] = M[0]</text>
  <text x="372" y="311" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">(b−1,a−1)：M[a−1] = V2[b−1]</text>
  <text x="372" y="332" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">(b−1,L−1)：M[L−1] = V3[0]</text>
  <text x="372" y="353" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">(H−1,a−1)：V2[H−1] = H3[0]</text>
  <text x="372" y="374" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">(H−1,L−1)：V3[d−1] = H3[c−1]</text>

  <text x="700" y="392" text-anchor="end" font-size="9.5" fill="#777" filter="url(#rough2)">（'.' 表示空格）</text>
</svg>
