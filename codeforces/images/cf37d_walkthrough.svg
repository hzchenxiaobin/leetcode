<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="380" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="38" text-anchor="middle" font-size="18.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">37D：样例 1 的 DP 表（x=[1,1,1], y=[1,2,3]）</text>
  <path d="M 137 50 Q 380 56 623 50" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60" y="96" width="640" height="46" rx="8" fill="#fbfbfb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="76" y="125" text-anchor="start" font-size="12.5" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">j=1</text>
  <text x="230" y="125" text-anchor="middle" font-size="12.5" fill="#8a8a8a" font-weight="normal" filter="url(#rough2)">1</text>
  <text x="320" y="125" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">dp[0]=1, dp[1]=1</text>
  <rect x="60" y="154" width="640" height="46" rx="8" fill="#fbfbfb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="76" y="183" text-anchor="start" font-size="12.5" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">j=2</text>
  <text x="230" y="183" text-anchor="middle" font-size="12.5" fill="#8a8a8a" font-weight="normal" filter="url(#rough2)">2</text>
  <text x="320" y="183" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">dp[0]=1, dp[1]=3, dp[2]=2</text>
  <rect x="60" y="212" width="640" height="46" rx="8" fill="#fbfbfb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="76" y="241" text-anchor="start" font-size="12.5" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">j=3</text>
  <text x="230" y="241" text-anchor="middle" font-size="12.5" fill="#8a8a8a" font-weight="normal" filter="url(#rough2)">3</text>
  <text x="320" y="241" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">dp[3]=6 （全部安排完）</text>
  <text x="60" y="296" text-anchor="start" font-size="12.5" fill="#2f5223" font-weight="bold" filter="url(#rough2)">最后 dp[3]=6 是“第二节课”的方案数；第一节课有 3! = 6 种 ⇒ 6 × 6 = 36 ✓</text>
  <text x="60" y="330" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">样例 2（y=[1,1,1]）：第二节课变成“每个教室至多 1 组”，只剩恒等分配 1 种 ⇒ 6 × 1 = 6 ✓</text>
</svg>
