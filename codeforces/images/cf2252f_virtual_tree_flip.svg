<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <filter id="rough3" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="2.2"/>
    </filter>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0 0 L7 3 L0 6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="420" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">每个颜色建虚树，跨边翻转 L 份割权</text>

  <!-- 左：虚树 -->
  <rect x="24" y="52" width="318" height="228" rx="12" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="40" y="76" font-size="13" fill="#446688" filter="url(#rough2)">虚树：终端 ∪ LCA，边标 (长度 L, 下方端点数 a)</text>

  <path d="M150 130 L92 196" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M150 130 L242 196" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M242 196 L268 252" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="104" y="176" font-size="12" fill="#b85450" filter="url(#rough2)">L=2,a=2</text>
  <text x="196" y="176" font-size="12" fill="#b85450" filter="url(#rough2)">L=1,a=2</text>
  <text x="252" y="238" font-size="12" fill="#b85450" filter="url(#rough2)">L=3,a=1</text>

  <circle cx="150" cy="130" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="150" y="135" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">r</text>
  <circle cx="92" cy="196" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="92" y="201" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <circle cx="242" cy="196" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="242" y="201" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <circle cx="268" cy="252" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="268" y="257" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <text x="40" y="268" font-size="12" fill="#4a7a3a" filter="url(#rough2)">s = 2+1+3 = 6（虚树总边长）</text>

  <!-- 右：压缩边示意 -->
  <rect x="362" y="52" width="334" height="228" rx="12" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="378" y="76" font-size="13" fill="#446688" filter="url(#rough2)">一条压缩边 (p→u) 的内部：L 条实边、割权都等于 a</text>

  <!-- 顶点链 -->
  <circle cx="400" cy="140" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="400" y="145" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">p</text>
  <circle cx="470" cy="140" r="11" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="540" cy="140" r="11" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="610" cy="140" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="610" y="145" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">u</text>
  <path d="M414 140 L456 140" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M481 140 L526 140" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M551 140 L594 140" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="433" y="130" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">a</text>
  <text x="503" y="130" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">a</text>
  <text x="572" y="130" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">a</text>

  <rect x="378" y="176" width="146" height="86" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="392" y="200" font-size="12" fill="#333" filter="url(#rough2)">t 在 p 一侧：</text>
  <text x="392" y="222" font-size="13" fill="#333" filter="url(#rough2)">该边出现 L 份 a</text>
  <text x="392" y="248" font-size="12" fill="#4a7a3a" filter="url(#rough2)">（t = 根时全部如此）</text>

  <path d="M528 218 L566 218" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="547" y="210" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">翻</text>

  <rect x="572" y="176" width="110" height="86" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="584" y="200" font-size="12" fill="#333" filter="url(#rough2)">t 在 u 一侧：</text>
  <text x="584" y="224" font-size="13" fill="#333" filter="url(#rough2)">L 份 m−a</text>
  <text x="584" y="248" font-size="11" fill="#b85450" filter="url(#rough2)">沿根到 t 的路径</text>

  <!-- 底部流程条 -->
  <rect x="24" y="300" width="672" height="46" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="40" y="328" font-size="13" fill="#333" filter="url(#rough2)">Fenwick 维护「值 → 出现次数 / 总和」，查最小的 R = s − k + 1 个值之和；DFS 回溯时把翻转撤销</text>

  <rect x="24" y="358" width="672" height="42" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="40" y="385" font-size="13" fill="#333" filter="url(#rough2)">对每个虚树节点 t 得到候选值，取最小值；由单调性只需在虚树节点处取最优（见引理 4）</text>
</svg>
