<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430">
<defs>
  <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs>
<rect x="0" y="0" width="760" height="430" fill="#fafafa"/>
<text x="380.0" y="34" font-size="22" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="bold" text-anchor="middle" filter="url(#rough2)">对每个 j 统计左右两侧的“更大/更小”个数</text>
<rect x="95" y="100" width="70" height="60" rx="8" fill="#e8f0fe" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="130.0" y="137.0" font-size="20" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">9</text>
<rect x="225" y="100" width="70" height="60" rx="8" fill="#fff4d6" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="260.0" y="137.0" font-size="20" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">7</text>
<rect x="355" y="100" width="70" height="60" rx="8" fill="#e8f0fe" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="390.0" y="137.0" font-size="20" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">4</text>
<rect x="485" y="100" width="70" height="60" rx="8" fill="#e8f0fe" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="520.0" y="137.0" font-size="20" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">2</text>
<text x="130" y="192" font-size="13" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="normal" text-anchor="middle" filter="url(#rough2)">a[1]</text>
<text x="260" y="192" font-size="13" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="normal" text-anchor="middle" filter="url(#rough2)">a[2]</text>
<text x="390" y="192" font-size="13" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="normal" text-anchor="middle" filter="url(#rough2)">a[3]</text>
<text x="520" y="192" font-size="13" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="normal" text-anchor="middle" filter="url(#rough2)">a[4]</text>
<rect x="215" y="88" width="90" height="84" rx="12" fill="#ffffff" stroke="#1a5fb4" stroke-width="2" filter="url(#rough2)"/>
<line x1="150" y1="60" x2="240" y2="60" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
<polygon points="240.0,60.0 229.0,55.0 229.0,65.0" fill="#888" filter="url(#rough2)"/>
<line x1="410" y1="60" x2="280" y2="60" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
<polygon points="280.0,60.0 291.0,65.0 291.0,55.0" fill="#888" filter="url(#rough2)"/>
<text x="260" y="78" font-size="15" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#1a5fb4" font-weight="normal" text-anchor="middle" filter="url(#rough2)">j</text>
<text x="60" y="260" font-size="15" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#2e7d32" font-weight="normal" text-anchor="start" filter="url(#rough2)">L[j] = 左边比 a[j] 大的个数</text>
<text x="60" y="290" font-size="15" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#c0392b" font-weight="normal" text-anchor="start" filter="url(#rough2)">R[j] = 右边比 a[j] 小的个数</text>
<text x="60" y="330" font-size="15" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#1a5fb4" font-weight="normal" text-anchor="start" filter="url(#rough2)">以 j 为中间元素的三元逆序对 = L[j] × R[j]</text>
<text x="60" y="370" font-size="15" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="normal" text-anchor="start" filter="url(#rough2)">答案 = Σ_j L[j] × R[j]</text>
</svg>
