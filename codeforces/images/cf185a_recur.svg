<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="340" fill="#fafafa"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每年：正三角变 3 正 1 倒，倒三角变 3 倒 1 正</text>
  <path d="M 166.16000000000008 46 Q 380.0 52 593.8399999999999 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 90 200 L 170 200 L 130 130 Z" stroke="#e8f0fe" stroke-width="#446688" fill="1.5" filter="url(#rough2)"/>
  <text x="130.0" y="225.0" text-anchor="middle" font-size="11.4" font-weight="bold" fill="#446688" filter="url(#rough2)">朝上 × U</text>
  <path d="M 240 130 L 320 130 L 280 200 Z" stroke="#fdf0ef" stroke-width="#b85450" fill="1.5" filter="url(#rough2)"/>
  <text x="280.0" y="225.0" text-anchor="middle" font-size="11.4" font-weight="bold" fill="#b85450" filter="url(#rough2)">朝下 × D</text>
  <path d="M 150.0 170.0 L 200.0 170.0" stroke="#6b6b6b" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="390.0" y="96.0" width="330.0" height="60.0" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="406.0" y="120.0" text-anchor="start" font-size="12.4" font-weight="bold" fill="#2f5b34" filter="url(#rough2)">U' = 3U + D</text>
  <text x="406.0" y="142.0" text-anchor="start" font-size="12.4" font-weight="bold" fill="#2f5b34" filter="url(#rough2)">D' = U + 3D</text>
  <rect x="390.0" y="170.0" width="330.0" height="60.0" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="406.0" y="194.0" text-anchor="start" font-size="11.6" fill="#8a6015" filter="url(#rough2)">总数 U+D 每年 ×4 ⇒ 4ⁿ</text>
  <text x="406.0" y="216.0" text-anchor="start" font-size="11.6" fill="#8a6015" filter="url(#rough2)">差值 U−D 每年 ×2 ⇒ 2ⁿ</text>
  <rect x="60.0" y="258.0" width="660.0" height="56.0" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="282.0" text-anchor="start" font-size="11.4" fill="#33506e" filter="url(#rough2)">解方程：U = (4ⁿ + 2ⁿ)/2 = 2ⁿ⁻¹(2ⁿ+1)；n=1 得 3，n=2 得 10，与样例一致。</text>
  <text x="74.0" y="302.0" text-anchor="start" font-size="11.4" fill="#33506e" filter="url(#rough2)">n 可达 10¹⁸，所以答案必须用快速幂 + 模 10⁹+7 计算。</text>
</svg>
