<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="320" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1 走查：1 2 3 4，d=3</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">每个锚点左侧可用的点数 k 依次是 0,1,2,3；C(k,2) 分别是 0,0,1,3，合计 4</text>
  <g filter="url(#rough2)"><rect x="130" y="120" width="50" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="155.0" y="147.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="155" y="190" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">i=1</text>
  <text x="155" y="214" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">k=0</text>
  <text x="155" y="238" text-anchor="middle" font-size="12" fill="#3d6b2f" filter="url(#rough2)">C=0</text>
  <g filter="url(#rough2)"><rect x="226" y="120" width="50" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="251.0" y="147.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="251" y="190" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">i=2</text>
  <text x="251" y="214" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">k=1</text>
  <text x="251" y="238" text-anchor="middle" font-size="12" fill="#3d6b2f" filter="url(#rough2)">C=0</text>
  <g filter="url(#rough2)"><rect x="322" y="120" width="50" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="347.0" y="147.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="347" y="190" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">i=3</text>
  <text x="347" y="214" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">k=2</text>
  <text x="347" y="238" text-anchor="middle" font-size="12" fill="#3d6b2f" filter="url(#rough2)">C=1</text>
  <g filter="url(#rough2)"><rect x="418" y="120" width="50" height="44" rx="4" fill="#f6d9d7" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="443.0" y="147.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="443" y="190" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">i=4</text>
  <text x="443" y="214" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">k=3</text>
  <text x="443" y="238" text-anchor="middle" font-size="12" fill="#3d6b2f" filter="url(#rough2)">C=3</text>
  <text x="440" y="290" text-anchor="middle" font-size="13" fill="#b05a5a" filter="url(#rough2)">0+0+1+3 = 4 组，与官方输出一致</text>
</svg>
