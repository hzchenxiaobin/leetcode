<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="380" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1 走查：只有两个子表合法</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">aabb / baab / baab，k=4；两个合法子表都在第 2、3 行之间</text>
  <text x="120" y="110" text-anchor="start" font-size="13" fill="#2b2b2b" filter="url(#rough2)">固定行对 (2,3)</text>
  <g filter="url(#rough2)"><rect x="150" y="126" width="54" height="44" rx="4" fill="#f6e3c4" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="177.0" y="153.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">b</text>
  <g filter="url(#rough2)"><rect x="210" y="126" width="54" height="44" rx="4" fill="#f6e3c4" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="237.0" y="153.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">a</text>
  <g filter="url(#rough2)"><rect x="270" y="126" width="54" height="44" rx="4" fill="#f6e3c4" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="297.0" y="153.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">a</text>
  <g filter="url(#rough2)"><rect x="330" y="126" width="54" height="44" rx="4" fill="#f6e3c4" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="357.0" y="153.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">b</text>
  <g filter="url(#rough2)"><rect x="150" y="178" width="54" height="44" rx="4" fill="#f6e3c4" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="177.0" y="205.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">b</text>
  <g filter="url(#rough2)"><rect x="210" y="178" width="54" height="44" rx="4" fill="#f6e3c4" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="237.0" y="205.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">a</text>
  <g filter="url(#rough2)"><rect x="270" y="178" width="54" height="44" rx="4" fill="#f6e3c4" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="297.0" y="205.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">a</text>
  <g filter="url(#rough2)"><rect x="330" y="178" width="54" height="44" rx="4" fill="#f6e3c4" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="357.0" y="205.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">b</text>
  <text x="120" y="262" text-anchor="start" font-size="12.5" fill="#555555" filter="url(#rough2)">行对固定后：列 1..4 里 a 的个数 = 1,2,2,0</text>
  <text x="120" y="288" text-anchor="start" font-size="12.5" fill="#555555" filter="url(#rough2)">两行同字母的列：1→b, 2→a, 3→a, 4→b</text>
  <text x="120" y="314" text-anchor="start" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">窗口 [1,4]：a 共 4 个 ≤ k → 角 b 的一对合法</text>
  <text x="120" y="340" text-anchor="start" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">窗口 [2,3]：a 共 4 个 ≤ k → 角 a 的一对合法</text>
  <path d="M150,232 L150,244 L414,244 L414,232" fill="none" stroke="#b05a5a" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M210,224 L210,250 L330,250 L330,224" fill="none" stroke="#2f4a66" stroke-width="1.5" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="600" y="150" text-anchor="start" font-size="16" font-weight="bold" fill="#b05a5a" filter="url(#rough2)">答案 2</text>
  <text x="600" y="180" text-anchor="start" font-size="12.5" fill="#555555" filter="url(#rough2)">与官方输出一致</text>
</svg>
