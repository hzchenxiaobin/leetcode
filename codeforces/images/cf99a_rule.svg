<svg xmlns="http://www.w3.org/2000/svg" width="880" height="412" viewBox="0 0 880 412"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="99"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="412" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">三条规则与一个数位判断</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">整数部分末位是不是 9，决定要不要去找 Vasilisa</text>
  <g filter="url(#rough2)"><rect x="80" y="86" width="720" height="60" rx="4" fill="#f6e3c4" fill-opacity="0.55" stroke="#c9a86a" stroke-width="1.4"/></g>
  <text x="440" y="112" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">读入形如  整数部分 . 小数部分  的字符串（长度 ≤ 1000）</text>
  <text x="440" y="134" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">例：1 2 3 . 5 0</text>
  <g filter="url(#rough2)"><rect x="80" y="176" width="340" height="84" rx="4" fill="#f6d9d7" fill-opacity="0.45" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="250" y="202" text-anchor="middle" font-size="13" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">整数部分末位 = 9</text>
  <text x="250" y="226" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">输出 GOTO Vasilisa.</text>
  <text x="250" y="246" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">（进位要请 Vasilisa，程序不管）</text>
  <g filter="url(#rough2)"><rect x="460" y="176" width="340" height="84" rx="4" fill="#d7ecd0" fill-opacity="0.45" stroke="#6a9a58" stroke-width="1.4"/></g>
  <text x="630" y="202" text-anchor="middle" font-size="13" fill="#3d6b2f" font-weight="bold" filter="url(#rough2)">末位 ≠ 9</text>
  <text x="630" y="226" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">看小数部分与 0.5 的大小</text>
  <text x="630" y="246" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">（等价：首位小数 ≥ 5 ⟺ ≥ 0.5）</text>
  <g filter="url(#rough2)"><rect x="460" y="282" width="340" height="52" rx="4" fill="#cfe0f5" fill-opacity="0.45" stroke="#6688aa" stroke-width="1.3"/></g>
  <text x="630" y="304" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">首位小数 &lt; 5 → 直接输出整数部分</text>
  <text x="630" y="324" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">首位小数 ≥ 5 → 末位 +1 后输出</text>
  <g filter="url(#rough2)"><path d="M 440 146 L 250 176" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)"/></g>
  <g filter="url(#rough2)"><path d="M 440 146 L 630 176" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)"/></g>
  <text x="300" y="160" text-anchor="middle" font-size="11" fill="#8a2b28" filter="url(#rough2)">末位是 9</text>
  <text x="600" y="160" text-anchor="middle" font-size="11" fill="#3d6b2f" filter="url(#rough2)">末位不是 9</text>
  <text x="440" y="368" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">末位 +1 不会进位（末位 ≤ 8），所以输出就是整数部分原样或最后一位加一</text>
  <text x="440" y="392" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">整数部分没有前导零（题面保证），因此不需要额外去零</text>
</svg>
