<svg xmlns="http://www.w3.org/2000/svg" width="840" height="420" viewBox="0 0 840 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="420" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每架飞机 = 一条递减的边际价格序列</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">坐空一架 a 座飞机，收入是 a + (a−1) + … + 1；每卖一张，下一张更便宜</text>
  <text x="196" y="132" text-anchor="end" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">a = 5</text>
  <g filter="url(#rough2)"><rect x="210" y="110" width="40" height="34" rx="4" fill="#d7ecd0" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="230.0" y="132" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <g filter="url(#rough2)"><rect x="256" y="110" width="40" height="34" rx="4" fill="#d7ecd0" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="276.0" y="132" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><rect x="302" y="110" width="40" height="34" rx="4" fill="#d7ecd0" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="322.0" y="132" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="348" y="110" width="40" height="34" rx="4" fill="#d7ecd0" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="368.0" y="132" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="394" y="110" width="40" height="34" rx="4" fill="#d7ecd0" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="414.0" y="132" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="196" y="222" text-anchor="end" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">a = 3</text>
  <g filter="url(#rough2)"><rect x="210" y="200" width="40" height="34" rx="4" fill="#d6e6f2" fill-opacity="0.9" stroke="#446688" stroke-width="1.3"/></g>
  <text x="230.0" y="222" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="256" y="200" width="40" height="34" rx="4" fill="#d6e6f2" fill-opacity="0.9" stroke="#446688" stroke-width="1.3"/></g>
  <text x="276.0" y="222" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="302" y="200" width="40" height="34" rx="4" fill="#d6e6f2" fill-opacity="0.9" stroke="#446688" stroke-width="1.3"/></g>
  <text x="322.0" y="222" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="196" y="312" text-anchor="end" font-size="13" font-weight="bold" fill="#a0522d" filter="url(#rough2)">a = 2</text>
  <g filter="url(#rough2)"><rect x="210" y="290" width="40" height="34" rx="4" fill="#f6e3c4" fill-opacity="0.9" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="230.0" y="312" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="256" y="290" width="40" height="34" rx="4" fill="#f6e3c4" fill-opacity="0.9" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="276.0" y="312" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="420" y="350" text-anchor="middle" font-size="13" fill="#3d6b2f" filter="url(#rough2)">最大：在所有序列里取最大的 n 项（每行只能从左往右取）</text>
  <text x="420" y="378" text-anchor="middle" font-size="13" fill="#8a4b2a" filter="url(#rough2)">最小：先把最短的序列取空（它整条都最便宜），再顺延到更长的序列</text>
  <text x="420" y="404" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">两种极值都只依赖"取了几项"，与乘客的先后顺序无关</text>
</svg>
