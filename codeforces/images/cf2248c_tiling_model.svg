<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="470" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：把删除操作看成“切砖块”</text>
  <text x="380" y="50" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">砖块只有两种 —— 单格（1 分），或者首尾同值的整段（长度平方分）</text>
  <text x="171" y="345" text-anchor="end" font-size="12.5" font-weight="normal" fill="#8a6d3b" filter="url(#rough2)">例 ③</text>  <text x="400" y="418" text-anchor="middle" font-size="12" font-weight="normal" fill="#666" filter="url(#rough2)">整段取 [第 1 次出现, 第 2 次出现]：25 + 1 + 1 + 1 = 28</text>  <rect x="187" y="318" width="48" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="211" y="345" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <rect x="241" y="318" width="48" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="265" y="345" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <rect x="295" y="318" width="48" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="319" y="345" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <rect x="349" y="318" width="48" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="373" y="345" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <rect x="403" y="318" width="48" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="427" y="345" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <rect x="457" y="318" width="48" height="42" rx="6" fill="#f2f2f2" stroke="#8c8c8c" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="481" y="345" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <rect x="511" y="318" width="48" height="42" rx="6" fill="#f2f2f2" stroke="#8c8c8c" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="535" y="345" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <rect x="565" y="318" width="48" height="42" rx="6" fill="#f2f2f2" stroke="#8c8c8c" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="589" y="345" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <path d="M187,371 L187,378 L451,378 L451,371" fill="none" stroke="#446688" stroke-width="2" stroke-linecap="round" fill-opacity="1" filter="url(#rough2)"/>
  <text x="319" y="397" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">5² = 25</text>
  <path d="M457,371 L457,378 L505,378 L505,371" fill="none" stroke="#8c8c8c" stroke-width="2" stroke-linecap="round" fill-opacity="1" filter="url(#rough2)"/>
  <text x="481" y="397" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8c8c8c" filter="url(#rough2)">1</text>
  <path d="M511,371 L511,378 L559,378 L559,371" fill="none" stroke="#8c8c8c" stroke-width="2" stroke-linecap="round" fill-opacity="1" filter="url(#rough2)"/>
  <text x="535" y="397" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8c8c8c" filter="url(#rough2)">1</text>
  <path d="M565,371 L565,378 L613,378 L613,371" fill="none" stroke="#8c8c8c" stroke-width="2" stroke-linecap="round" fill-opacity="1" filter="url(#rough2)"/>
  <text x="589" y="397" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8c8c8c" filter="url(#rough2)">1</text>
  <text x="234" y="223" text-anchor="end" font-size="12.5" font-weight="normal" fill="#8a6d3b" filter="url(#rough2)">例 ②</text>  <text x="355" y="296" text-anchor="middle" font-size="12" font-weight="normal" fill="#666" filter="url(#rough2)">首尾 1、2 不同值 → 只能切出长度 3 的段，再补 1 个单格 = 9 + 1</text>  <rect x="250" y="196" width="48" height="42" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="274" y="223" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <rect x="304" y="196" width="48" height="42" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="328" y="223" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <rect x="358" y="196" width="48" height="42" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="382" y="223" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <rect x="412" y="196" width="48" height="42" rx="6" fill="#f2f2f2" stroke="#8c8c8c" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="436" y="223" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <path d="M250,249 L250,256 L406,256 L406,249" fill="none" stroke="#b85450" stroke-width="2" stroke-linecap="round" fill-opacity="1" filter="url(#rough2)"/>
  <text x="328" y="275" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">3² = 9</text>
  <path d="M412,249 L412,256 L460,256 L460,249" fill="none" stroke="#8c8c8c" stroke-width="2" stroke-linecap="round" fill-opacity="1" filter="url(#rough2)"/>
  <text x="436" y="275" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8c8c8c" filter="url(#rough2)">1</text>
  <text x="234" y="101" text-anchor="end" font-size="12.5" font-weight="normal" fill="#8a6d3b" filter="url(#rough2)">例 ①</text>  <text x="355" y="174" text-anchor="middle" font-size="12" font-weight="normal" fill="#666" filter="url(#rough2)">首尾都是 1 → 整段 4 格一次删光，得分 16</text>  <rect x="250" y="74" width="48" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="274" y="101" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <rect x="304" y="74" width="48" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="328" y="101" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <rect x="358" y="74" width="48" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="382" y="101" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <rect x="412" y="74" width="48" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="436" y="101" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <path d="M250,127 L250,134 L460,134 L460,127" fill="none" stroke="#4a7a3a" stroke-width="2" stroke-linecap="round" fill-opacity="1" filter="url(#rough2)"/>
  <text x="355" y="153" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">4² = 16</text>
  <text x="380" y="444" text-anchor="middle" font-size="12" font-weight="normal" fill="#446688" filter="url(#rough2)">块与块按原顺序紧邻、互不重叠；每种“铺法”都对应一种真实可行的操作顺序</text></svg>
