<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="745"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="300" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">fail 树的祖先链 = 所有以当前位置结尾的后缀模式</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">区间加（子树）+ 单点查（状态）</text>
  <g filter="url(#rough2)"><circle cx="450" cy="90" r="18" fill="#cfe0f5" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="450" y="93.24" text-anchor="middle" font-size="9" fill="#2b2b2b" filter="url(#rough2)">root</text>
  <g filter="url(#rough2)"><circle cx="300" cy="150" r="16" fill="#ffffff" fill-opacity="0.9" stroke="#cccccc" stroke-width="1.5"/></g>
  <text x="300" y="153.24" text-anchor="middle" font-size="9" fill="#2b2b2b" filter="url(#rough2)">a</text>
  <g filter="url(#rough2)"><circle cx="600" cy="150" r="16" fill="#ffffff" fill-opacity="0.9" stroke="#cccccc" stroke-width="1.5"/></g>
  <text x="600" y="153.24" text-anchor="middle" font-size="9" fill="#2b2b2b" filter="url(#rough2)">ab</text>
  <g filter="url(#rough2)"><circle cx="210" cy="210" r="16" fill="#dcecd2" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="210" y="213.24" text-anchor="middle" font-size="9" fill="#2b2b2b" filter="url(#rough2)">aa</text>
  <g filter="url(#rough2)"><line x1="432" y1="96" x2="316" y2="144" stroke="#446688" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><line x1="468" y1="96" x2="584" y2="144" stroke="#446688" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><line x1="290" y1="158" x2="224" y2="202" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="360" y="230" text-anchor="start" font-size="11" fill="#4a7a3a" filter="url(#rough2)">读 aaab：状态沿 fail 链累计</text>
  <text x="450" y="268" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">在职模式 = 对它子树整体 +1；查询 = 点值</text>
</svg>
