<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 490" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="490" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">先判形、再换记法：一条正则决定走哪一支</text>
  <text x="320" y="47" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">两套语法没有交集：Excel 是「字母+数字」，RXCY 是「R+数字+C+数字」，所以判形不会二义</text>

  <rect x="230" y="60" width="180" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="320" y="84" text-anchor="middle" font-size="11" fill="#2b3a55" filter="url(#rough2)">输入坐标串 s</text>

  <path d="M 320 98 L 320 106" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <polygon points="320,110 470,158 320,206 170,158" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="320" y="152" text-anchor="middle" font-size="10" fill="#6a5218" font-weight="bold">s 是否匹配</text>
    <text x="320" y="170" text-anchor="middle" font-size="10.5" fill="#6a5218" font-weight="bold">^R[0-9]+C[0-9]+$ ？</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 170 158 L 110 158 L 110 218" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)"/>
    <path d="M 470 158 L 530 158 L 530 218" stroke="#4a7a3a" stroke-width="1.7" fill="none" marker-end="url(#arrG)"/>
    <text x="132" y="151" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">是</text>
    <text x="508" y="151" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="22" y="222" width="176" height="50" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="110" y="242" text-anchor="middle" font-size="9.5" fill="#2b3a55" font-weight="bold">RXCY → Excel</text>
    <text x="110" y="259" text-anchor="middle" font-size="9" fill="#3a4a66">读出 row、col 两个数字</text>
  </g>
  <path d="M 110 272 L 110 294" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="22" y="296" width="176" height="50" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="110" y="316" text-anchor="middle" font-size="9.5" fill="#2b3a55" font-weight="bold">列号 col → 字母串</text>
    <text x="110" y="333" text-anchor="middle" font-size="9" fill="#3a4a66">循环 col−− 后取 col % 26</text>
  </g>
  <path d="M 110 346 L 110 368" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="22" y="370" width="176" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="110" y="396" text-anchor="middle" font-size="10.5" fill="#8a3a38" font-weight="bold">输出 字母 + row</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="442" y="222" width="176" height="50" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="530" y="242" text-anchor="middle" font-size="9.5" fill="#2c4a24" font-weight="bold">Excel → RXCY</text>
    <text x="530" y="259" text-anchor="middle" font-size="9" fill="#3a5a30">拆字母前缀 + 数字后缀</text>
  </g>
  <path d="M 530 272 L 530 294" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="442" y="296" width="176" height="50" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="530" y="316" text-anchor="middle" font-size="9.5" fill="#2c4a24" font-weight="bold">字母 → 列号</text>
    <text x="530" y="333" text-anchor="middle" font-size="9" fill="#3a5a30">col = col×26 + (c−'A'+1)</text>
  </g>
  <path d="M 530 346 L 530 368" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="442" y="370" width="176" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="530" y="396" text-anchor="middle" font-size="10.5" fill="#8a3a38" font-weight="bold">输出 R + row + C + col</text>
  </g>

  <rect x="22" y="424" width="596" height="52" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="8.8" fill="#5a4a20">
    <text x="34" y="443">反例：RC23 中 R 与 C 之间没有数字 ⇒ 不匹配正则，按 Excel 处理：列 "RC" = 18×26+3 = 471、行 23 → 输出 R23C471</text>
    <text x="34" y="462">对照：R1C1 的列号 1 ⇒ 输出 A1；"A1" 的列 A = 1 ⇒ 输出 R1C1。只看「首字符是否为 R、是否含 C」会把 RC23 判错</text>
  </g>
</svg>
