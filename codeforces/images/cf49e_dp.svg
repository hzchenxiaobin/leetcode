  <rect x="194.0" y="172.0" width="88.0" height="88.0" rx="6" fill="#fdf3e3" stroke="#c9801f" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="238.0" y="248.0" text-anchor="middle" font-size="14" fill="#c9801f" font-weight="bold" filter="url(#rough2)">c</text>
  <path d="M 285.0 263.0 L 300.0 278.0" stroke="#c9801f" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="260.0" y="94.0" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">j：s2 已生成到的位置</text>
  <text x="140.0" y="154.0" text-anchor="end" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="140.0" y="198.0" text-anchor="end" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="140.0" y="242.0" text-anchor="end" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="140.0" y="286.0" text-anchor="end" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="140.0" y="330.0" text-anchor="end" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="140.0" y="374.0" text-anchor="end" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <text x="172.0" y="118.0" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="216.0" y="118.0" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="260.0" y="118.0" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="304.0" y="118.0" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="348.0" y="118.0" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="392.0" y="118.0" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <text x="120.0" y="94.0" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="116.0" y="110.0" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">s1</text>
  <text x="468.0" y="128.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">dp[i][j]：把 s1[i..] 与 s2[j..]</text>
  <text x="468.0" y="150.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">同时生成所需的最少祖先符号数。</text>
  <text x="468.0" y="186.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">转移：挑一个字母 c 与终点 (i', j')，</text>
  <text x="468.0" y="208.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">要求 c ⇒* s1[i..i'] 且 c ⇒* s2[j..j']，</text>
  <text x="468.0" y="230.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">则 dp[i][j] = 1 + dp[i'+1][j'+1]。</text>
  <text x="468.0" y="266.0" text-anchor="start" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">dp[|s1|][|s2|] = 0，越界为 +∞。</text>
  <text x="468.0" y="302.0" text-anchor="start" font-size="11.5" fill="#c9801f" font-weight="bold" filter="url(#rough2)">答案 = dp[0][0]；为 +∞ 时输出 -1。</text>
  <text x="468.0" y="338.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">橙色方块就是「字母 c 负责的两段」：</text>
  <text x="468.0" y="360.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">在 s1 里是一段、在 s2 里是另一段，</text>
  <text x="468.0" y="382.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">两段都非空，长度可以不同。</text>
  <rect x="40.0" y="396.0" width="680.0" height="28.0" rx="8" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="54.0" y="415.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">i、j 都从大到小枚举：转移只会走向下标更大的状态，天然拓扑有序。</text>
</svg>
