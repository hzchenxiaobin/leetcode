<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="53"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="380" fill="#fafafa"/>

  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例三：5055 的所有候选都掉在窗口外面</text>
  <path d="M 110 44 Q 360 51 610 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 第一个日期 -->
  <rect x="26" y="80" width="132" height="46" rx="8" fill="#eef6ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="92" y="110" text-anchor="middle" font-size="17" font-weight="bold" fill="#2f5223" filter="url(#rough2)">1999</text>
  <text x="92" y="146" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">落点在 1999</text>

  <!-- 第二个日期 -->
  <rect x="26" y="180" width="132" height="46" rx="8" fill="#eaf3ff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="92" y="210" text-anchor="middle" font-size="17" font-weight="bold" fill="#2f4a63" filter="url(#rough2)">5055</text>
  <text x="92" y="246" text-anchor="middle" font-size="11.5" fill="#5a7285" filter="url(#rough2)">候选全被否决</text>

  <line x1="92" y1="132" x2="92" y2="174" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <!-- 候选清单 -->
  <rect x="196" y="66" width="286" height="252" rx="10" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="339" y="90" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">5055 的候选（一位改动）</text>
  <text x="210" y="118" font-size="11.5" fill="#8a3b37" filter="url(#rough2)">改千位：1055 &lt; 1999 ✗；2055…9055 &gt; 2011 ✗</text>
  <text x="210" y="144" font-size="11.5" fill="#8a3b37" filter="url(#rough2)">改百位：5x55 = 5155…5955 &gt; 2011 ✗</text>
  <text x="210" y="170" font-size="11.5" fill="#8a3b37" filter="url(#rough2)">改十位：50x5 = 5005…5095 &gt; 2011 ✗</text>
  <text x="210" y="196" font-size="11.5" fill="#8a3b37" filter="url(#rough2)">改个位：505x = 5050…5059 &gt; 2011 ✗</text>
  <line x1="210" y1="214" x2="468" y2="214" stroke="#8a8a8a" stroke-width="1.1" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <text x="339" y="240" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">可用集合 = ∅</text>
  <text x="339" y="268" text-anchor="middle" font-size="12.5" fill="#8a3b37" filter="url(#rough2)">只能输出 No solution</text>
  <text x="339" y="296" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">（第 3 个日期 2000 根本轮不到处理）</text>

  <!-- 数轴 -->
  <line x1="512" y1="300" x2="700" y2="120" stroke="#2b2b2b" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="536" y="200" width="60" height="56" rx="6" fill="#fff0d6" stroke="#d6a040" stroke-width="1.4" transform="rotate(-45 566 228)" filter="url(#rough2)"/>
  <text x="700" y="268" text-anchor="end" font-size="11" fill="#8a6015" filter="url(#rough2)">合法区间 [1999, 2011]</text>
  <circle cx="536" cy="276" r="5" fill="#8a3b37" filter="url(#rough2)"/>
  <text x="500" y="296" font-size="11" fill="#8a3b37" filter="url(#rough2)">1055</text>
  <circle cx="676" cy="204" r="5" fill="#8a3b37" filter="url(#rough2)"/>
  <text x="668" y="188" font-size="11" fill="#8a3b37" filter="url(#rough2)">5005+</text>

  <text x="360" y="352" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">贪心一旦在某一步找不到可行值，整题就无解（后面的日期再怎么选都救不回来）</text>
</svg>
