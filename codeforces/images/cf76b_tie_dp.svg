<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="720" height="440" fill="#fafafa"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">平局是一条链：缝隙 j 的走向只影响奶酪 j 与 j+1</text>
  <path d="M 200 43 Q 360 49 520 43" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <rect x="86" y="128" width="48" height="44" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="110" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">c0</text>
  <rect x="246" y="128" width="48" height="44" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">c1</text>
  <rect x="406" y="128" width="48" height="44" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="430" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">c2</text>
  <rect x="566" y="128" width="48" height="44" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="590" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">c3</text>
  <path d="M 190 135 L 205 150 L 190 165 L 175 150 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="154" text-anchor="middle" font-size="10.5" fill="#8a6015" filter="url(#rough2)">g0</text>
  <path d="M 174 140 L 136 140" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 206 140 L 244 140" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="182" y="116" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">左</text>
  <text x="210" y="116" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">右</text>
  <path d="M 350 135 L 365 150 L 350 165 L 335 150 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="350" y="154" text-anchor="middle" font-size="10.5" fill="#8a6015" filter="url(#rough2)">g1</text>
  <path d="M 334 140 L 296 140" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 366 140 L 404 140" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="342" y="116" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">左</text>
  <text x="370" y="116" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">右</text>
  <path d="M 510 135 L 525 150 L 510 165 L 495 150 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="510" y="154" text-anchor="middle" font-size="10.5" fill="#8a6015" filter="url(#rough2)">g2</text>
  <path d="M 494 140 L 456 140" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 526 140 L 564 140" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="502" y="116" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">左</text>
  <text x="530" y="116" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">右</text>
  <rect x="68" y="208" width="584" height="92" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="84" y="234" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">奶酪 j 的「最早到达距离」 = min(被迫指派的老鼠, 从 g(j-1) 右拐来的, 从 g(j) 左拐来的)</text>
  <text x="84" y="258" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">吃饱数 = 恰好等于这个最小距离的老鼠只数（同时到达可以一起吃）</text>
  <text x="84" y="282" text-anchor="start" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">于是 fed(j) 只取决于 prev 走向与当前走向两个 0/1 变量</text>
  <rect x="68" y="318" width="584" height="76" rx="7" fill="#e9f4e2" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="84" y="344" text-anchor="start" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">dp[j+1][dir] = max over prev of  dp[j][prev] + fed(j, prev, dir)</text>
  <text x="84" y="370" text-anchor="start" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">状态数 2 × M，转移 4 种 → O(M)；最后取 max(吃得饱的老鼠数)，答案为 N 减它。</text>
  <text x="68" y="422" text-anchor="start" font-size="11" fill="#777777" filter="url(#rough2)">注：每只老鼠的选择只会改变它自己那块奶酪的到达时间，不会影响别的奶酪。</text>
</svg>
