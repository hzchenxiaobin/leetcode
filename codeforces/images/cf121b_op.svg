<svg xmlns="http://www.w3.org/2000/svg" width="884" height="376" viewBox="0 0 884 376"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="121"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="884" height="376" fill="#fafafa"/>
  <text x="442" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每次改最左的 “47”：按起点位置的奇偶决定改成什么</text>
  <text x="442" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">奇数位 → 44，偶数位 → 77</text>
  <g filter="url(#rough2)"><rect x="90" y="96" width="340" height="50" rx="4" fill="#d7ecd0" fill-opacity="0.5" stroke="#6a9a58" stroke-width="1.3"/></g>
  <text x="260" y="127" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">x 为奇数：47 → 44</text>
  <g filter="url(#rough2)"><rect x="460" y="96" width="340" height="50" rx="4" fill="#f6d9d7" fill-opacity="0.5" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="630" y="127" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">x 为偶数：47 → 77</text>
  <text x="442" y="186" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">关键：偶数位改完后，若左边是 4，会在 x−1（奇数位）形成新的 47</text>
  <g filter="url(#rough2)"><rect x="90" y="208" width="700" height="58" rx="4" fill="#f6e3c4" fill-opacity="0.5" stroke="#c9a86a" stroke-width="1.3"/></g>
  <text x="442" y="232" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">477 →(偶数位) 777 →(奇数位) 447 … 两步回到原样</text>
  <text x="442" y="252" text-anchor="middle" font-size="11" fill="#8a2b28" filter="url(#rough2)">于是出现 2-周期：剩余次数为偶数 → 不变；为奇数 → 再做一次</text>
  <text x="442" y="306" text-anchor="middle" font-size="11.5" fill="#3d6b2f" filter="url(#rough2)">其他情况每次操作后最左的 47 只会右移，扫描指针单调向右</text>
  <text x="442" y="338" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">总步数 O(n)（撞上 2-周期就停）</text>
</svg>
