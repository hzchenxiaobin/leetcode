<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="301"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="280" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">两个样例的解</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">样例 1：1 2 / 3 4　；　样例 2：4 7 / 9 1</text>
  <g filter="url(#rough2)"><rect x="90" y="96" width="300" height="140" rx="6" fill="#ffffff" fill-opacity="0.5" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="240" y="122" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">样例 1</text>
  <text x="240" y="158" text-anchor="middle" font-size="17" fill="#2b2b2b" filter="url(#rough2)">1  2</text>
  <text x="240" y="196" text-anchor="middle" font-size="17" fill="#2b2b2b" filter="url(#rough2)">3  4</text>
  <text x="240" y="222" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">行 3,7 列 4,6 对角 5,5</text>
  <g filter="url(#rough2)"><rect x="510" y="96" width="300" height="140" rx="6" fill="#ffffff" fill-opacity="0.5" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="660" y="122" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">样例 2</text>
  <text x="660" y="158" text-anchor="middle" font-size="17" fill="#2b2b2b" filter="url(#rough2)">4  7</text>
  <text x="660" y="196" text-anchor="middle" font-size="17" fill="#2b2b2b" filter="url(#rough2)">9  1</text>
  <text x="660" y="222" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">行 11,10 列 13,8 对角 5,16</text>
  <text x="450" y="262" text-anchor="middle" font-size="11" fill="#8a2b28" filter="url(#rough2)">样例 3、4 无解（样例 4 要求四个格子全是 5，但宝石只有一个 5）</text>
</svg>
