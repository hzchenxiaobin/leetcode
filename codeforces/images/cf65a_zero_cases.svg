<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="21"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="720" height="360" fill="#fafafa"/>

  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">三条咒语里任何一条"零进料"，都能凭空造物</text>
  <path d="M 96 44 Q 360 51 624 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 面板 1 -->
  <rect x="22" y="66" width="214" height="212" rx="10" fill="#eef6ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="129" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5223" filter="url(#rough2)">a = 0，b &gt; 0</text>
  <text x="129" y="120" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">0 克沙换 b 克铅</text>
  <line x1="60" y1="136" x2="198" y2="136" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <text x="129" y="162" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">铅可以无限多</text>
  <text x="129" y="188" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">再用 c 铅换 d 金</text>
  <text x="129" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3b37" filter="url(#rough2)">结论：Ron</text>
  <text x="129" y="252" text-anchor="middle" font-size="11" fill="#5a7285" filter="url(#rough2)">无需 e、f 参与</text>

  <!-- 面板 2 -->
  <rect x="252" y="66" width="214" height="212" rx="10" fill="#fff7e2" stroke="#c99a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="359" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">c = 0，d &gt; 0</text>
  <text x="359" y="120" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">0 克铅换 d 克金</text>
  <line x1="290" y1="136" x2="428" y2="136" stroke="#c99a3a" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <text x="359" y="162" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">金子直接白送</text>
  <text x="359" y="188" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">沙和铅都不需要</text>
  <text x="359" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3b37" filter="url(#rough2)">结论：Ron</text>
  <text x="359" y="252" text-anchor="middle" font-size="11" fill="#5a7285" filter="url(#rough2)">第一、三咒语无关</text>

  <!-- 面板 3 -->
  <rect x="482" y="66" width="214" height="212" rx="10" fill="#eaf3ff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="589" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a63" filter="url(#rough2)">e = 0，f &gt; 0</text>
  <text x="589" y="120" text-anchor="middle" font-size="12" fill="#2f4a63" filter="url(#rough2)">0 克金换 f 克沙</text>
  <line x1="520" y1="136" x2="658" y2="136" stroke="#446688" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <text x="589" y="162" text-anchor="middle" font-size="12" fill="#2f4a63" filter="url(#rough2)">沙可以无限多</text>
  <text x="589" y="188" text-anchor="middle" font-size="12" fill="#2f4a63" filter="url(#rough2)">再走 沙→铅→金</text>
  <text x="589" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a3b37" filter="url(#rough2)">结论：Ron</text>
  <text x="589" y="252" text-anchor="middle" font-size="11" fill="#5a7285" filter="url(#rough2)">但 b、c、d 都必须为正</text>

  <line x1="129" y1="296" x2="129" y2="316" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="360" y="330" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">没有零进料时，只能靠 b·d·f &gt; a·c·e 把沙子越滚越多</text>
</svg>
