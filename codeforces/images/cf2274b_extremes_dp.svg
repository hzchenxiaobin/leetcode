<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="430" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法：只维护可达前缀和的最高点与最低点</text>
  <path d="M 150 42 Q 380 49 610 42" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="40" y="58" width="300" height="62" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="56" y="83" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">初始化：hi = lo = a_1</text>
  <text x="56" y="105" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">ans = a_1（第 1 位永远不会被改写）</text>

  <!-- 规模说明 -->
  <rect x="372" y="58" width="348" height="62" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="388" y="83" font-size="12" fill="#8a6015" filter="url(#rough2)">|P_i| ≤ 2·|P_{i−1}| + 50 ⇒ |P_i| ≤ 50·(2^i − 1)</text>
  <text x="388" y="105" font-size="11.5" fill="#8a6015" filter="url(#rough2)">i ≤ 49 时约 2.8×10^16，必须用 64 位整数</text>

  <path d="M 190 120 L 190 148" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- 递推主体 -->
  <rect x="40" y="152" width="680" height="150" rx="9" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="56" y="178" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">对 i = 2, 3, …, n 依次做两件事：</text>
  <text x="56" y="206" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">① 记下候选答案：ans = max(ans, a_i + max(hi, −lo))</text>
  <text x="56" y="234" font-size="12.5" fill="#333" filter="url(#rough2)">② 推进端点：hi ← max(a_i, a_i + hi, a_i + 2·hi)</text>
  <text x="196" y="258" font-size="12.5" fill="#333" filter="url(#rough2)">lo ← min(a_i, a_i + lo, a_i + 2·lo)</text>
  <text x="56" y="286" font-size="11.5" fill="#66788c" filter="url(#rough2)">顺序不能反：必须先用旧的 hi / lo 算 ans，再去更新 hi / lo</text>

  <path d="M 380 304 L 380 330" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- 输出 -->
  <rect x="250" y="334" width="260" height="52" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="366" text-anchor="middle" font-size="14" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">输出 ans</text>

  <text x="56" y="412" font-size="11.5" fill="#446688" filter="url(#rough2)">每组 O(n)，只看两个端点；t 组总和 O(Σn) ≤ 5×10^5，常数只有几次加减乘</text>

</svg>
