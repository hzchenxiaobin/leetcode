<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="67"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">所有解都是同一组势的倍数，取「最先顶到容量」的倍数</text>
  <path d="M 84 42 Q 360 48 636 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 单位势 -->
  <g filter="url(#rough2)">
    <rect x="60" y="70" width="280" height="120" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/>
  </g>
  <g font-size="12.5" fill="#22314a" filter="url(#rough2)">
    <text x="74" y="94">① 解单位势 ψ：ψ(1)=1，ψ(n)=0，</text>
    <text x="74" y="116">内部点满足拉普拉斯方程。</text>
    <text x="74" y="144">这一步是 (n−2) 元线性方程组，</text>
    <text x="74" y="166">高斯消元 O(n³)，n ≤ 100 只有 10⁶。</text>
  </g>

  <!-- 缩放 -->
  <g filter="url(#rough2)">
    <rect x="380" y="70" width="280" height="120" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <g font-size="12.5" fill="#2f5223" filter="url(#rough2)">
    <text x="394" y="94">② 任何合法解都是 φ = Q + (P−Q)·ψ：</text>
    <text x="394" y="116">守恒式齐次，只有两个自由度 P、Q。</text>
    <text x="394" y="144">于是每条边的流量 = λ·(ψ(a)−ψ(b))，</text>
    <text x="394" y="166">所有流量与 λ 成正比。</text>
  </g>

  <!-- λ -->
  <g filter="url(#rough2)">
    <rect x="60" y="206" width="600" height="70" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="360" y="232" text-anchor="middle" font-size="14" fill="#8a6015" filter="url(#rough2)">
    ③ 容量约束变成 |λ·(ψ(a)−ψ(b))| ≤ c  ⇒  λ = min over edges of c / |ψ(a)−ψ(b)|
  </text>
  <text x="360" y="258" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">
    先顶到容量的那条边把 λ 卡住；其余边按比例缩小，全都不会超限
  </text>

  <!-- 答案 -->
  <g filter="url(#rough2)">
    <rect x="60" y="292" width="600" height="46" rx="8" fill="#fbeeee" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="360" y="320" text-anchor="middle" font-size="14" fill="#8a3a36" filter="url(#rough2)">
    答案 = λ · Σ_{u~1}(ψ(1) − ψ(u))，各边流量 = λ·(ψ(a) − ψ(b))
  </text>

  <text x="60" y="368" font-size="12" fill="#556" filter="url(#rough2)">
    若某条边 ψ(a)=ψ(b)（两侧等势），它永远不承载流量，系数为 0，不参与取 min。
  </text>
  <text x="60" y="388" font-size="12" fill="#556" filter="url(#rough2)">
    与 1、n 都不连通的分量上，调和势只能是常数 ⇒ 该分量所有边流量为 0。
  </text>
</svg>
