<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">一次扫描：维护链值 c，边读边吞</text>
  <text x="290" y="44" text-anchor="middle" font-size="10.5" fill="#888">时间 O(n)，每组测试只扫一遍，完全不必真正去模拟交换操作</text>

  <rect x="180" y="58" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="78" text-anchor="middle" font-size="12" fill="#3a4a66">c ← a₁，i ← 2</text>

  <path d="M 290 88 L 290 108" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="110" width="280" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="130" text-anchor="middle" font-size="11" fill="#3a4a66">i 从 2 扫到 n，逐个处理 a_i</text>

  <path d="M 290 140 L 290 162" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="290,166 410,205 290,244 170,205" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="210" text-anchor="middle" font-size="12" fill="#7a5c10">a_i ≥ c ?</text>

  <path d="M 170 205 L 110 205 L 110 234" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="139" y="197" text-anchor="middle" font-size="9.5" fill="#8a3a36">否（逆序）</text>

  <path d="M 410 205 L 470 205 L 470 234" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="441" y="197" text-anchor="middle" font-size="9.5" fill="#3a5a30">是（有序）</text>

  <rect x="20" y="238" width="180" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="110" y="259" text-anchor="middle" font-size="11.5" fill="#8a3a36" font-weight="bold">c ← c + a_i</text>
  <text x="110" y="278" text-anchor="middle" font-size="9.5" fill="#555">链吞并：大值继续长大</text>

  <rect x="380" y="238" width="180" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="470" y="259" text-anchor="middle" font-size="11.5" fill="#3a5a30" font-weight="bold">c ← a_i</text>
  <text x="470" y="278" text-anchor="middle" font-size="9.5" fill="#555">链断开：从 a_i 重新起链</text>

  <path d="M 110 292 L 110 318" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 470 292 L 470 318" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 110 318 L 470 318" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 290 318 L 290 334" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="311" text-anchor="middle" font-size="9.5" fill="#666">两个分支都进入下一轮 i + 1</text>

  <rect x="160" y="338" width="260" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="359" text-anchor="middle" font-size="11.5" fill="#7a5c10">输出 c：最小可能的最大堆</text>

  <rect x="40" y="380" width="500" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="290" y="400" text-anchor="middle" font-size="10" fill="#3a5a30">c 单调不减 ⇒ 也可二分答案 X 用同一扫描做 check，O(n log Σa) 同样能过</text>
</svg>
