<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr75b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="330" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">优先级累加后按（优先级降序，名字升序）排序</text>

  <!-- 动态列表 -->
  <g font-size="11.5" fill="#2b3a4a" filter="url(#rough2)">
    <text x="36" y="62">ahmed posted on fatma&apos;s wall　→ fatma +15</text>
    <text x="36" y="86">fatma commented on ahmed&apos;s post　→ fatma +10</text>
    <text x="36" y="110">mona likes ahmed&apos;s post　→ mona +5</text>
    <text x="36" y="134">c likes d&apos;s post　→ 与「我」无关，只登记名字</text>
  </g>

  <path d="M356 150 L356 176" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr75b)"
        filter="url(#rough2)"/>
  <text x="372" y="166" font-size="12" fill="#446688" filter="url(#rough2)">按名字聚合</text>

  <!-- 结果表 -->
  <g filter="url(#rough2)">
    <rect x="120" y="186" width="180" height="34" rx="5" fill="#eef4fb" stroke="#446688" stroke-width="1.5"/>
    <rect x="316" y="186" width="120" height="34" rx="5" fill="#e8f0e0" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="452" y="186" width="150" height="34" rx="5" fill="#fff8e1" stroke="#c9a227" stroke-width="1.5"/>
  </g>
  <g font-size="12" fill="#2b3a4a" text-anchor="middle" filter="url(#rough2)">
    <text x="210" y="208">名字</text>
    <text x="376" y="208">priority</text>
    <text x="527" y="208">排序键</text>
  </g>
  <g font-size="12" fill="#2b3a4a" text-anchor="middle" filter="url(#rough2)">
    <rect x="120" y="224" width="180" height="30" fill="#fcfcfa" stroke="#c8c2b6" stroke-width="1.2"/>
    <rect x="316" y="224" width="120" height="30" fill="#fcfcfa" stroke="#c8c2b6" stroke-width="1.2"/>
    <rect x="452" y="224" width="150" height="30" fill="#fcfcfa" stroke="#c8c2b6" stroke-width="1.2"/>
    <text x="210" y="244">fatma</text>
    <text x="376" y="244">25</text>
    <text x="527" y="244">(-25, fatma)</text>
  </g>
  <g font-size="12" fill="#2b3a4a" text-anchor="middle" filter="url(#rough2)">
    <rect x="120" y="254" width="180" height="30" fill="#fcfcfa" stroke="#c8c2b6" stroke-width="1.2"/>
    <rect x="316" y="254" width="120" height="30" fill="#fcfcfa" stroke="#c8c2b6" stroke-width="1.2"/>
    <rect x="452" y="254" width="150" height="30" fill="#fcfcfa" stroke="#c8c2b6" stroke-width="1.2"/>
    <text x="210" y="274">mona</text>
    <text x="376" y="274">5</text>
    <text x="527" y="274">(-5, mona)</text>
  </g>

  <text x="360" y="312" text-anchor="middle" font-size="12" fill="#6b6b66" filter="url(#rough2)">输出时不含自己；优先级为 0 的人也要输出（按字典序排在后面）</text>
</svg>
