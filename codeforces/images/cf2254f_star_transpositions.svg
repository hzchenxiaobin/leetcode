<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="both" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa" filter="url(#rough2)"/>
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">每个格子都只与手牌相连：星形换位生成整个对称群</text>

  <!-- 中心：手牌 -->
  <ellipse cx="280" cy="140" rx="66" ry="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="139" text-anchor="middle" font-size="14" fill="#8a6d3b" filter="url(#rough2)">手牌 σ</text>
  <text x="280" y="157" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">（全部元素的异或）</text>

  <!-- 四个格子 -->
  <rect x="66" y="46" width="96" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="114" y="69" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">格子 c₁</text>
  <rect x="398" y="46" width="96" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="446" y="69" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">格子 c₂</text>
  <rect x="66" y="200" width="96" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="114" y="223" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">格子 c₃</text>
  <rect x="398" y="200" width="96" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="446" y="223" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">格子 c₄</text>

  <!-- 连线（双向箭头） -->
  <path d="M236,120 L156,80" stroke="#446688" stroke-width="1.6" marker-end="url(#both)" filter="url(#rough2)"/>
  <path d="M324,120 L404,80" stroke="#446688" stroke-width="1.6" marker-end="url(#both)" filter="url(#rough2)"/>
  <path d="M236,162 L156,202" stroke="#446688" stroke-width="1.6" marker-end="url(#both)" filter="url(#rough2)"/>
  <path d="M324,162 L404,202" stroke="#446688" stroke-width="1.6" marker-end="url(#both)" filter="url(#rough2)"/>

  <text x="280" y="256" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">每条线 = 一次操作（手牌与该格子对调），可以来回走</text>
  <text x="280" y="288" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">这些换位能生成 n+1 个位置上的任意排列（≤ 3n 次操作）</text>
  <text x="280" y="318" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">所以「多重集相同」⇒ 任意配置都可达 ⇒ 充分性成立</text>
  <text x="280" y="350" text-anchor="middle" font-size="12" fill="#a0522d" filter="url(#rough2)">位置 = {手牌, 格子 1..n}；值 = M 里的 n+1 个数</text>
</svg>
