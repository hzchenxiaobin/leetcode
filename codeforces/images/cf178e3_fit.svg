<svg xmlns="http://www.w3.org/2000/svg" width="780" height="380" viewBox="0 0 780 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="780" height="380" fill="#fafafa"/>
  <text x="390.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">E3：对每个黑块同时拟合“圆盘”和“正方形”，取失配更小者</text>
  <path d="M 142.67000000000013 46 Q 390.0 52 637.3299999999999 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="50.0" y="70.0" width="330.0" height="130.0" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="66.0" y="94.0" text-anchor="start" font-size="11.2" font-weight="bold" fill="#446688" filter="url(#rough2)">圆盘模型：中心 ±2、半径 R₀+{0..2.5}</text>
  <circle cx="150.0" cy="150.0" r="38.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="66.0" y="184.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">失配 = 黑格在模型外 + 白格在模型内</text>
  <rect x="400.0" y="70.0" width="330.0" height="130.0" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="416.0" y="94.0" text-anchor="start" font-size="10.8" font-weight="bold" fill="#8a6015" filter="url(#rough2)">正方形模型：中心 ±2、边长 S₀+{0..3}、角度 θ₀±9°</text>
  <rect x="500.0" y="116.0" width="76.0" height="76.0" rx="4" fill="#fdf0ef" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="416.0" y="184.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">θ₀ 由四阶矩的相位给出（旋转 45° 内唯一）</text>
  <rect x="50.0" y="220.0" width="680.0" height="50.0" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="64.0" y="244.0" text-anchor="start" font-size="11.4" fill="#2f5b34" filter="url(#rough2)">两个模型各自取最优参数，比较「与原始噪声图的失配像素数」，小者胜。</text>
  <text x="64.0" y="262.0" text-anchor="start" font-size="11.2" fill="#2f5b34" filter="url(#rough2)">噪声让每个像素以 0.2 的概率翻转，失配的期望里含 0.2×窗口面积 这个常数；</text>
  <rect x="50.0" y="282.0" width="680.0" height="74.0" rx="9" fill="#fdf0ef" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="64.0" y="306.0" text-anchor="start" font-size="11.2" fill="#8a3a36" filter="url(#rough2)">两个模型用同一个窗口计分，常数项抵消，剩下的差异正比于两个形状的对称差，</text>
  <text x="64.0" y="326.0" text-anchor="start" font-size="11.2" fill="#8a3a36" filter="url(#rough2)">所以即使 15 像素的小图形，也能在 20% 噪声下分出圆和方块。</text>
  <text x="64.0" y="346.0" text-anchor="start" font-size="11.0" fill="#8a3a36" filter="url(#rough2)">只有两类得分接近时才做细搜（步长 0.5），大图形直接用矩判据，省时间。</text>
</svg>
