<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="317"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="330" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">B：只买负价的，越负越先买，最多买 m 台</text>
  <path d="M 160 42 Q 380 47 600 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <text x="60" y="74" font-size="11.5" fill="#777" filter="url(#rough2)">原价：　-6　　0　　35　　-2　　4</text>

  <line x1="70" y1="92" x2="700" y2="92" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="118" font-size="11.5" fill="#2f5223" filter="url(#rough2)">挑出负价并按升序排：</text>

  <rect x="130" y="128" width="90" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="175" y="154" text-anchor="middle" font-size="14" fill="#2f5223" filter="url(#rough2)">-6</text>
  <rect x="232" y="128" width="90" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="277" y="154" text-anchor="middle" font-size="14" fill="#2f5223" filter="url(#rough2)">-2</text>

  <text x="345" y="154" font-size="11" fill="#777" filter="url(#rough2)">其余（0、35、4）永远不买</text>

  <rect x="60" y="190" width="320" height="118" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="72" y="214" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">为什么这样最优</text>
  <text x="72" y="238" font-size="10.5" fill="#3c5e88" filter="url(#rough2)">· 买一台花 a 元，收益是 −a；只有 a&lt;0 才赚钱</text>
  <text x="72" y="260" font-size="10.5" fill="#3c5e88" filter="url(#rough2)">· 最多 m 台 ⇒ 在负价里取前 m 小的</text>
  <text x="72" y="282" font-size="10.5" fill="#3c5e88" filter="url(#rough2)">· 负价不足 m 台就全买</text>
  <text x="72" y="302" font-size="10" fill="#8c3a36" filter="url(#rough2)">答案 = −（选中的价格之和），恒 ≥ 0</text>

  <rect x="404" y="190" width="316" height="118" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="416" y="214" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">样例 1：n=5, m=3</text>
  <text x="416" y="238" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">负价 {-6, -2}，只有 2 台，全买</text>
  <text x="416" y="260" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">收益 = 6 + 2 = 8</text>
  <text x="416" y="284" font-size="10" fill="#777" filter="url(#rough2)">m 还没用完也没关系："最多"不是"恰好"</text>
</svg>
