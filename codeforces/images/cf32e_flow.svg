<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="365" />
      <feDisplacementMap in="SourceGraphic" scale="1.5" />
    </filter>
  </defs>
  <rect width="760" height="450" fill="#fafafa" />
  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">32E 的判定流程</text>
  <path d="M 260 44 Q 380 50 500 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)" />

  <rect x="270" y="66" width="220" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)" />
  <text x="380" y="94" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">线段 VP 与镜子相交？</text>

  <line x1="380" y1="112" x2="380" y2="140" stroke="#555" stroke-width="1.3" filter="url(#rough2)" />
  <line x1="380" y1="140" x2="180" y2="140" stroke="#555" stroke-width="1.3" filter="url(#rough2)" />
  <line x1="380" y1="140" x2="580" y2="140" stroke="#555" stroke-width="1.3" filter="url(#rough2)" />
  <line x1="180" y1="140" x2="180" y2="166" stroke="#555" stroke-width="1.3" filter="url(#rough2)" />
  <line x1="580" y1="140" x2="580" y2="166" stroke="#555" stroke-width="1.3" filter="url(#rough2)" />
  <text x="280" y="134" font-size="10" fill="#555" filter="url(#rough2)">是</text>
  <text x="470" y="134" font-size="10" fill="#555" filter="url(#rough2)">否</text>

  
  <rect x="60" y="166" width="240" height="78" rx="8" fill="#fde8e8" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)" />
  <text x="180" y="190" text-anchor="middle" font-size="10.5" fill="#8a3b36" filter="url(#rough2)">与墙也相交，或 VP 不平行于镜子</text>
  <text x="180" y="212" text-anchor="middle" font-size="11" fill="#8a3b36" filter="url(#rough2)">→ NO</text>
  <text x="180" y="232" text-anchor="middle" font-size="10" fill="#8a3b36" filter="url(#rough2)">（分居两侧，反射不可能）</text>

  <rect x="60" y="258" width="240" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)" />
  <text x="180" y="282" text-anchor="middle" font-size="10.5" fill="#2f5223" filter="url(#rough2)">与墙不相交，且 VP 平行于镜子</text>
  <text x="180" y="303" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">→ YES（镜子不挡）</text>

  
  <rect x="460" y="166" width="240" height="78" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)" />
  <text x="580" y="190" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">VP 与墙相交？</text>
  <text x="580" y="214" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">否 → YES（直射）</text>
  <text x="580" y="234" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">是 → 进入反射判定</text>

  
  <rect x="360" y="270" width="360" height="128" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)" />
  <text x="378" y="294" font-size="11" font-weight="bold" fill="#8a6015" filter="url(#rough2)">反射判定（V、P 必须严格同侧）</text>
  <text x="378" y="316" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">P' = P 关于镜子直线的对称点；</text>
  <text x="378" y="336" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">Q = VP' 与镜子线段的交点；</text>
  <text x="378" y="356" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">要求：Q 在线段上，且墙不与 VQ、QP 相交。</text>
  <text x="378" y="378" font-size="10.5" fill="#2f5223" filter="url(#rough2)">全部满足 → YES，否则 NO。</text>

  <line x1="580" y1="244" x2="580" y2="270" stroke="#555" stroke-width="1.3" filter="url(#rough2)" />
</svg>