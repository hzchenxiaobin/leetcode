<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-12%" y="-12%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="32" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：枚举两侧的除法次数</text>

  <rect x="40" y="58" width="300" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="85" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">读入 a, b, x（多测 t 组）</text>

  <path d="M 190 102 L 190 126" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="128" width="300" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="155" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">m[i] = a 连续除 i 次 x，直到 0（≤ 31 项）</text>

  <path d="M 190 172 L 190 196" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="198" width="300" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="215" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">枚举 i ≤ ka、j ≤ kb</text>
  <text x="190" y="232" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">cand = i + j + |m[i] − n[j]|</text>

  <path d="M 190 242 L 190 266" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="268" width="300" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="295" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">best = min(best, cand)</text>

  <path d="M 190 312 L 190 336" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="338" width="300" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="365" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">输出 best</text>

  <rect x="356" y="140" width="182" height="210" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="447" y="166" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">剪枝与上界</text>
  <text x="374" y="196" font-size="11.5" fill="#555" filter="url(#rough2)">best 初值</text>
  <text x="374" y="214" font-size="11.5" fill="#555" filter="url(#rough2)">= min(|a−b|, ka+kb)</text>
  <text x="374" y="240" font-size="11.5" fill="#555" filter="url(#rough2)">代价至少为 i，</text>
  <text x="374" y="258" font-size="11.5" fill="#555" filter="url(#rough2)">故 i ≥ best 时整枝无望</text>
  <text x="374" y="284" font-size="11.5" fill="#555" filter="url(#rough2)">两边都除到 0，</text>
  <text x="374" y="302" font-size="11.5" fill="#555" filter="url(#rough2)">答案 ≤ ka + kb ≤ 62</text>
  <text x="374" y="328" font-size="11.5" fill="#b85450" filter="url(#rough2)">循环规模 ≤ 31 × 31</text>
</svg>
