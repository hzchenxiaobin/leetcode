<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>

  <rect width="720" height="450" fill="#fafafa"/>

  <text x="360" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">子树的叶子必须在目标顺序里连续</text>
  <path d="M 160 40 Q 360 46 560 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 树 -->
  <g stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)">
    <line x1="240" y1="78" x2="150" y2="138"/><line x1="240" y1="78" x2="420" y2="138"/>
    <line x1="150" y1="153" x2="100" y2="208"/><line x1="100" y1="223" x2="52" y2="272"/>
    <line x1="100" y1="223" x2="175" y2="272"/><line x1="420" y1="153" x2="420" y2="208"/>
  </g>
  <g filter="url(#rough2)">
    <circle cx="240" cy="70" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="150" cy="146" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="420" cy="146" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="100" cy="215" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="48" cy="280" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="178" cy="280" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="420" cy="215" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <g font-size="11" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">
    <text x="240" y="74">1</text><text x="150" y="150">2</text><text x="420" y="150">3</text>
    <text x="100" y="219">4</text><text x="48" y="284">5</text>
    <text x="178" y="284">6</text><text x="420" y="219">7</text>
  </g>

  <!-- 合法顺序 -->
  <text x="505" y="66" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">目标叶子顺序（合法）</text>
  <g filter="url(#rough2)">
    <rect x="500" y="76" width="52" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="556" y="76" width="52" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="612" y="76" width="52" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">
    <text x="526" y="99">5</text><text x="582" y="99">6</text><text x="638" y="99">7</text>
  </g>
  <text x="500" y="132" font-size="10.5" fill="#2f5223" filter="url(#rough2)">子树 2 的叶子 {5,6}：位置 0…1（连续）</text>
  <text x="500" y="150" font-size="10.5" fill="#2f5223" filter="url(#rough2)">子树 3 的叶子 {7}：位置 2</text>

  <!-- 非法顺序 -->
  <text x="505" y="192" font-size="11.5" font-weight="bold" fill="#a33a36" filter="url(#rough2)">反例顺序 5 7 6（非法）</text>
  <g filter="url(#rough2)">
    <rect x="500" y="202" width="52" height="36" rx="6" fill="#fff" stroke="#b85450" stroke-width="1.4"/>
    <rect x="556" y="202" width="52" height="36" rx="6" fill="#fff" stroke="#b85450" stroke-width="1.4"/>
    <rect x="612" y="202" width="52" height="36" rx="6" fill="#fff" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">
    <text x="526" y="225">5</text><text x="582" y="225">7</text><text x="638" y="225">6</text>
  </g>
  <text x="500" y="258" font-size="10.5" fill="#8a3b38" filter="url(#rough2)">{5,6} 在位置 0 和 2，不连续 → -1</text>

  <rect x="40" y="300" width="640" height="130" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <g font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">
    <text x="56" y="326">每条边都要走两次，所以进入一个子树后必须把它走完再原路返回——子树的叶子在访问序列里是一段。</text>
    <text x="56" y="352">对每个节点：它子树内叶子的位置集合必须是连续区间，否则无论怎么排列孩子都无法满足给定顺序。</text>
    <text x="56" y="378">每个节点再按“子树叶子的最左位置”给孩子排序，就得到唯一合法的 DFS 顺序。</text>
    <text x="56" y="404">图中子树 2 的叶子 {5,6} 占 0…1、子树 3 的叶子 {7} 占 2；根按这个顺序访问两个孩子即可。</text>
  </g>
</svg>
