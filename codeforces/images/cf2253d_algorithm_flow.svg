<svg xmlns="http://www.w3.org/2000/svg" width="660" height="436" viewBox="0 0 660 436" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="660" height="436" fill="#fafafa"/>

  <text x="330" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：先定步数，再定落点，最后拆权重</text>
  <text x="330" y="50" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">所有量都是整数；T(n) = n(n+1)/2 用整数开方 + 微调求得</text>

  <g filter="url(#rough2)">
    <rect x="96" y="64" width="468" height="50" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="96" y="134" width="468" height="50" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="96" y="204" width="468" height="50" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="96" y="274" width="468" height="50" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <rect x="96" y="344" width="468" height="50" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g font-size="13.5" font-weight="bold" text-anchor="middle">
    <text x="330" y="86" fill="#33517a" filter="url(#rough2)">1. N = max{ n : T(n) ≤ x + y }   （T(20000) &gt; 2e8，故 N ≤ 19999）</text>
    <text x="330" y="108" fill="#4b6b8a" font-size="11.5" filter="url(#rough2)">终点 p+q = T(n) ≤ x+y，所以步数绝不能超过 N</text>
    <text x="330" y="156" fill="#2e6e2e" filter="url(#rough2)">2. e = T(N) − y，p* = clamp(floor((x+e)/2), max(0,e), min(x,T(N)))</text>
    <text x="330" y="178" fill="#3d6b3d" font-size="11.5" filter="url(#rough2)">目标 (p−x)² + (p−e)² 是凸二次函数，取区间内最靠近 (x+e)/2 的整数</text>
    <text x="330" y="226" fill="#8a6d3b" filter="url(#rough2)">3. k = max{ k : T(k) ≤ p* }，extra = p* − T(k) ∈ [0, k(N−k)]</text>
    <text x="330" y="248" fill="#8a6d3b" font-size="11.5" filter="url(#rough2)">k 就是答案串里 X 的个数，k ≤ N 自动成立</text>
    <text x="330" y="296" fill="#8e4b48" filter="url(#rough2)">4. 从大到小装权重：i = k … 1，w_i = i + min(extra, 上界 − i)</text>
    <text x="330" y="318" fill="#8e4b48" font-size="11.5" filter="url(#rough2)">上界 = N（i = k 时）或 w_{i+1} − 1，保证 k 个权重互不相同</text>
    <text x="330" y="366" fill="#33517a" filter="url(#rough2)">5. 权重 w ↔ 位置 N − w + 1 写 X，其余写 Y，输出长度 N 的串</text>
    <text x="330" y="388" fill="#4b6b8a" font-size="11.5" filter="url(#rough2)">长度 ≤ 19999，恰好落在题面承诺的 20000 步以内</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 330 114 L 330 134" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr2)"/>
    <path d="M 330 184 L 330 204" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr2)"/>
    <path d="M 330 254 L 330 274" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr2)"/>
    <path d="M 330 324 L 330 344" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#arr2)"/>
  </g>

  <text x="330" y="418" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">每组 O(N) 时间 / O(N) 空间；t 组总计 O(t·√(x+y)) ≈ 2×10⁶</text>
</svg>
