<svg xmlns="http://www.w3.org/2000/svg" width="740" height="320" viewBox="0 0 740 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1120"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="740" height="320" fill="#fafafa"/>
  <text x="370.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按列轮廓 DP</text>
  <path d="M 118.4 42 Q 370.0 48 621.6 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="370.0" y="306" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">状态 = 最近两列的选中掩码 (a, b)</text>
  <rect x="40" y="70" width="200" height="120" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="96" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#335478" filter="url(#rough2)">列 j−2：a</text>
  <text x="140" y="122" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">只看它是否被</text>
  <text x="140" y="142" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">shifted(b) | a | s</text>
  <text x="140" y="162" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">覆盖满</text>
  <rect x="270" y="70" width="200" height="120" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="370" y="96" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">列 j−1：b</text>
  <text x="370" y="122" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">上一状态的一部分</text>
  <rect x="500" y="70" width="200" height="120" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="600" y="96" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">列 j：s</text>
  <text x="600" y="122" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">枚举 s ⊇ need</text>
  <line x1="242.0" y1="130.0" x2="268.0" y2="130.0" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <line x1="472.0" y1="130.0" x2="498.0" y2="130.0" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="370" y="230" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">转移：结算列 j−2，加入 popcount(s)，状态变为 (b, s)</text>
  <text x="370" y="258" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">宽度 w = min(n,m) ≤ 6 ⇒ 状态 4^w ≤ 4096，列数 ≤ 40</text>
  <text x="370" y="286" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">答案 = n·m − min 代价</text>
</svg>
