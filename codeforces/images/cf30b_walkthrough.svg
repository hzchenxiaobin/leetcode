<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="141"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="720" height="290" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1：(01,01,80) 正好 18 岁生日当天</text>
  <g font-size="13" filter="url(#rough2)">
    <text x="60" y="76" fill="#666">重排 (日,月,年)</text>
    <text x="280" y="76" fill="#666">合法？</text>
    <text x="430" y="76" fill="#666">年龄</text>
    <text x="560" y="76" fill="#666">结论</text>
  </g>
  <g stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)">
    <line x1="55" y1="88" x2="680" y2="88"/>
    <line x1="55" y1="126" x2="680" y2="126"/>
    <line x1="55" y1="164" x2="680" y2="164"/>
    <line x1="55" y1="202" x2="680" y2="202"/>
  </g>
  <g font-size="13" filter="url(#rough2)">
    <text x="60" y="114" fill="#2f5223">(01, 01, 80)</text>
    <text x="280" y="114" fill="#2f5223">✓</text>
    <text x="430" y="114" fill="#2f5223">18</text>
    <text x="560" y="114" fill="#2f5223">(01,01) ≥ (01,01) ✓ YES</text>

    <text x="60" y="152" fill="#8f3b37">(01, 80, 01)</text>
    <text x="280" y="152" fill="#8f3b37">✗ 月份 80</text>
    <text x="430" y="152" fill="#999">—</text>
    <text x="560" y="152" fill="#999">—</text>

    <text x="60" y="190" fill="#8f3b37">(80, 01, 01)</text>
    <text x="280" y="190" fill="#8f3b37">✗ 日期 80</text>
    <text x="430" y="190" fill="#999">—</text>
    <text x="560" y="190" fill="#999">—</text>
  </g>
  <rect x="55" y="216" width="620" height="56" rx="9" fill="#eef4ec" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="71" y="240" font-size="12.5" fill="#2f5223" filter="url(#rough2)">其余排列都会把 80 当成月份或日期，非法。</text>
  <text x="71" y="262" font-size="12.5" fill="#2f5223" filter="url(#rough2)">第一个通过的就是答案：YES。</text>
</svg>
