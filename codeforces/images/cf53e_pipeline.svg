<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430">
<defs>
  <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs>
<rect x="0" y="0" width="760" height="430" fill="#fafafa"/>
<text x="380.0" y="34" font-size="22" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="bold" text-anchor="middle" filter="url(#rough2)">枚举 2^n 个叶子集合 S，逐个计算 g(S)</text>
<rect x="60" y="90" width="160" height="58" rx="8" fill="#e8f0fe" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="140.0" y="123.9" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">枚举 S ⊆ V</text>
<line x1="220" y1="119" x2="233" y2="119" stroke="#1a5fb4" stroke-width="2" filter="url(#rough2)"/>
<polygon points="233.0,119.0 222.0,114.0 222.0,124.0" fill="#1a5fb4" filter="url(#rough2)"/>
<rect x="235" y="90" width="160" height="58" rx="8" fill="#fff4d6" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="315.0" y="123.9" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">T = V ∖ S</text>
<line x1="395" y1="119" x2="408" y2="119" stroke="#1a5fb4" stroke-width="2" filter="url(#rough2)"/>
<polygon points="408.0,119.0 397.0,114.0 397.0,124.0" fill="#1a5fb4" filter="url(#rough2)"/>
<rect x="410" y="90" width="160" height="58" rx="8" fill="#e6f4ea" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="490.0" y="123.9" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">τ(G[T])：Matrix-Tree</text>
<line x1="570" y1="119" x2="583" y2="119" stroke="#1a5fb4" stroke-width="2" filter="url(#rough2)"/>
<polygon points="583.0,119.0 572.0,114.0 572.0,124.0" fill="#1a5fb4" filter="url(#rough2)"/>
<rect x="585" y="90" width="160" height="58" rx="8" fill="#f0e6fa" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="665.0" y="123.9" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">乘上每个叶子的可选邻居数</text>
<text x="380" y="200" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="normal" text-anchor="middle" filter="url(#rough2)">按 |S| 与 k 的奇偶加权：(-1)^{|S|-k} C(|S|,k)</text>
<text x="380" y="240" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#c0392b" font-weight="normal" text-anchor="middle" filter="url(#rough2)">T 为空 → g=0；|T|=1 → τ=1，检查每个叶子是否与它相邻</text>
<text x="380" y="280" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#2e7d32" font-weight="normal" text-anchor="middle" filter="url(#rough2)">O(2^n · n^3)，n ≤ 10 时约 10^6 次运算</text>
</svg>
