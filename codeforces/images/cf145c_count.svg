<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1454"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="720" height="300" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">幸运数一共只有 1022 种</text>
  <path d="M 190 42 Q 360 48 530 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <text x="360" y="74" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">按位数分类：长度为 L 的幸运数有 2^L 个（aᵢ ≤ 10⁹，长度最多 9）</text>

  <rect x="40" y="90" width="64" height="56" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="72" y="114" text-anchor="middle" font-size="11" fill="#335478" filter="url(#rough2)">L=1</text>
  <text x="72" y="134" text-anchor="middle" font-size="13" font-weight="bold" fill="#335478" filter="url(#rough2)">2</text>
  <rect x="114" y="90" width="64" height="56" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="146" y="114" text-anchor="middle" font-size="11" fill="#335478" filter="url(#rough2)">L=2</text>
  <text x="146" y="134" text-anchor="middle" font-size="13" font-weight="bold" fill="#335478" filter="url(#rough2)">4</text>
  <rect x="188" y="90" width="64" height="56" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="220" y="114" text-anchor="middle" font-size="11" fill="#335478" filter="url(#rough2)">L=3</text>
  <text x="220" y="134" text-anchor="middle" font-size="13" font-weight="bold" fill="#335478" filter="url(#rough2)">8</text>
  <rect x="262" y="90" width="64" height="56" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="294" y="114" text-anchor="middle" font-size="11" fill="#335478" filter="url(#rough2)">L=4</text>
  <text x="294" y="134" text-anchor="middle" font-size="13" font-weight="bold" fill="#335478" filter="url(#rough2)">16</text>
  <rect x="336" y="90" width="64" height="56" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="368" y="114" text-anchor="middle" font-size="11" fill="#335478" filter="url(#rough2)">L=5</text>
  <text x="368" y="134" text-anchor="middle" font-size="13" font-weight="bold" fill="#335478" filter="url(#rough2)">32</text>
  <rect x="410" y="90" width="64" height="56" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="442" y="114" text-anchor="middle" font-size="11" fill="#335478" filter="url(#rough2)">L=6</text>
  <text x="442" y="134" text-anchor="middle" font-size="13" font-weight="bold" fill="#335478" filter="url(#rough2)">64</text>
  <rect x="484" y="90" width="64" height="56" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="516" y="114" text-anchor="middle" font-size="11" fill="#335478" filter="url(#rough2)">L=7</text>
  <text x="516" y="134" text-anchor="middle" font-size="13" font-weight="bold" fill="#335478" filter="url(#rough2)">128</text>
  <rect x="558" y="90" width="64" height="56" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="590" y="114" text-anchor="middle" font-size="11" fill="#335478" filter="url(#rough2)">L=8</text>
  <text x="590" y="134" text-anchor="middle" font-size="13" font-weight="bold" fill="#335478" filter="url(#rough2)">256</text>
  <rect x="632" y="90" width="64" height="56" rx="7" fill="#f6efd8" stroke="#b09040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="664" y="114" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">L=9</text>
  <text x="664" y="134" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">512</text>

  <text x="360" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">2 + 4 + 8 + … + 512 = 1022 ≈ 2¹⁰</text>
  <text x="360" y="200" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">10 位幸运数最小是 4444444444 &gt; 10⁹，所以不会出现</text>

  <rect x="90" y="220" width="540" height="62" rx="8" fill="#eef5ea" stroke="#5a8a4a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="360" y="244" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">关键：同一个幸运值最多取 1 个下标 ⇒ 每件"幸运物品"只有 0/1 两个状态</text>
  <text x="360" y="266" text-anchor="middle" font-size="11.5" fill="#335478" filter="url(#rough2)">状态数只有 1022，DP 的维度可以压到 min(k, 1022)</text>
</svg>
