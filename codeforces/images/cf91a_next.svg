<svg xmlns="http://www.w3.org/2000/svg" width="880" height="336" viewBox="0 0 880 336"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="91"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="336" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">next 表让每个字符只花 O(1)</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">s1 = abcabc；查 d 时 nxt[·][d] = −1 → 必须换下一份</text>
  <g filter="url(#rough2)"><rect x="110" y="104" width="54" height="40" rx="3" fill="#cfe0f5" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="137.0" y="131" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">a</text>
  <text x="137.0" y="96" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)"><rect x="170" y="104" width="54" height="40" rx="3" fill="#cfe0f5" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="197.0" y="131" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">b</text>
  <text x="197.0" y="96" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="230" y="104" width="54" height="40" rx="3" fill="#cfe0f5" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="257.0" y="131" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">c</text>
  <text x="257.0" y="96" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="290" y="104" width="54" height="40" rx="3" fill="#cfe0f5" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="317.0" y="131" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">a</text>
  <text x="317.0" y="96" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="350" y="104" width="54" height="40" rx="3" fill="#cfe0f5" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="377.0" y="131" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">b</text>
  <text x="377.0" y="96" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><rect x="410" y="104" width="54" height="40" rx="3" fill="#cfe0f5" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="437.0" y="131" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">c</text>
  <text x="437.0" y="96" text-anchor="middle" font-size="10" fill="#999999" filter="url(#rough2)">5</text>
  <text x="100" y="176" text-anchor="start" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">nxt[i][a]=0（i≤3），nxt[4][a]=4 …；nxt[6][d]=−1</text>
  <text x="100" y="204" text-anchor="start" font-size="12" fill="#3d6b2f" filter="url(#rough2)">总时间 O(26·|s1| + |s2|)，(|s1|,|s2|) ≤ (10⁴,10⁶)</text>
  <text x="100" y="232" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">用 26 个「下一次出现位置」做转移，避免每个字符重扫 s1</text>
</svg>
