<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="227"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="340" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">B：三个必要条件，正好也是充分条件</text>
  <path d="M 150 42 Q 380 47 610 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="380" y="60" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">设 '@' 的位置为 p1 &lt; p2 &lt; … &lt; pm（0 起），字符串长 n</text>

  <rect x="40" y="76" width="216" height="110" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="100" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">① 头：p1 ≥ 1</text>
  <text x="52" y="124" font-size="10.5" fill="#3c5e88" filter="url(#rough2)">第一个邮箱的 A 部分</text>
  <text x="52" y="144" font-size="10.5" fill="#3c5e88" filter="url(#rough2)">至少要有 1 个字母</text>
  <text x="52" y="166" font-size="10" fill="#8c3a36" filter="url(#rough2)">否则串以 '@' 开头 → 无解</text>

  <rect x="272" y="76" width="216" height="110" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="284" y="100" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">② 间距：p(i+1) − p(i) ≥ 3</text>
  <text x="284" y="124" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">前一个邮箱的尾字母 +</text>
  <text x="284" y="144" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">后一个邮箱的首字母 +</text>
  <text x="284" y="166" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">中间那个 '@'，至少要占 3 格</text>

  <rect x="504" y="76" width="216" height="110" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="516" y="100" font-size="11.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">③ 尾：pm ≤ n−2</text>
  <text x="516" y="124" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">最后一个邮箱的 B 部分</text>
  <text x="516" y="144" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">至少要有 1 个字母</text>
  <text x="516" y="166" font-size="10" fill="#8c3a36" filter="url(#rough2)">否则串以 '@' 结尾 → 无解</text>

  <text x="52" y="216" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">贪心构造：第 1..m−1 个邮箱都在自己的 '@' 后只取 1 个字母（把剩下的字母留给后面的邮箱），最后一个邮箱吃掉剩余全部。</text>

  <rect x="40" y="230" width="680" height="60" rx="8" fill="#f3e8fd" stroke="#8a6d9a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="54" y="254" font-size="11" fill="#5b3a6e" filter="url(#rough2)">为什么"必要"：第 t 个邮箱的尾字母在第 t 个 '@' 之后、第 t+1 个 '@' 之前；第 t+1 个邮箱的首字母在第 t+1 个 '@' 之前。</text>
  <text x="54" y="276" font-size="11" fill="#5b3a6e" filter="url(#rough2)">两者不能重合，中间还隔着 '@' ⇒ p(t+1) − p(t) ≥ 3。头尾同理。所以三个条件不满足必然无解。</text>

  <text x="40" y="314" font-size="11" fill="#2f5223" filter="url(#rough2)">反过来，只要三条都满足，上面的贪心一定构造成功（每个邮箱都非空、且恰好一个 '@'）。</text>
  <text x="40" y="332" font-size="10" fill="#777" filter="url(#rough2)">还有一个隐含条件：字符串里至少有一个 '@'，否则邮箱数为 0，也是一种 No solution。</text>
</svg>
