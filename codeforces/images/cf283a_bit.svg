<svg xmlns="http://www.w3.org/2000/svg" width="700" height="340" viewBox="0 0 700 340"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="203"/>
    <feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></defs>
  <rect width="700" height="340" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">「区间加 + 单点查」的树状数组写法</text>
  <path d="M 130 40 Q 350 46 570 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="60" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="13" fill="#22314a" filter="url(#rough2)">区间加 [1,a] 等价于在差分上做两次单点加：upd(1, +x) 与 upd(a+1, −x)。</text>
  <text x="76" y="104" font-size="12" fill="#2f4a66" filter="url(#rough2)">单点查 p 就是查差分数组的前缀和：qry(p)。</text>
  <g filter="url(#rough2)"><rect x="60" y="126" width="580" height="70" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="150" font-size="13" fill="#2f5223" filter="url(#rough2)">值的表示：value(i) = base[i] + qry(i)</text>
  <text x="76" y="174" font-size="12.5" fill="#2f5223" filter="url(#rough2)">追加时要求 value(sz) = k ⇒ base[sz] = k − qry(sz)（关键的一步）</text>
  <text x="76" y="192" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">忘了减 qry 会继承旧位置上的区间加，这是本题最容易 WA 的地方。</text>
  <g filter="url(#rough2)"><rect x="60" y="206" width="580" height="60" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="76" y="230" font-size="12.5" fill="#8a6015" filter="url(#rough2)">删除：sum -= value(sz)；sz -= 1。不用清理 BIT（位置只会在末尾复用）。</text>
  <text x="76" y="252" font-size="12.5" fill="#8a6015" filter="url(#rough2)">复杂度：每次 O(log n)，总 O(n log n)，n=2·10⁵ 实测 0.09 s。</text>
  <g filter="url(#rough2)"><rect x="60" y="278" width="580" height="50" rx="8" fill="#fbeeee" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="76" y="308" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">另一种解法：把「前 a 个各加 x」记成 lazy 差分，直接维护数组 + 后缀偏移，也是 O(n)。</text>
</svg>
