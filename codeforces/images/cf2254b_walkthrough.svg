<svg xmlns="http://www.w3.org/2000/svg" width="780" height="470" viewBox="0 0 780 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="19"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>

  <rect width="780" height="470" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">几组官方样例的走查：候选只会是 k、k−1、k−2</text>
  <path d="M 150 40 Q 390 48 630 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="390" y="56" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">k 是压缩后的段数；「可删的单元素段」指长度为 1 且不在字符串两端的段</text>

  <rect x="36" y="68" width="708" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="141" y="87" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">样例 s</text>
  <text x="366" y="87" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">压缩成段 ⇒ k</text>
  <text x="576" y="87" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">可删的单元素段 → 候选</text>
  <text x="705" y="87" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">答案</text>

  <rect x="36" y="96" width="708" height="44" fill="#fafafa" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="46" y="123" font-size="12" fill="#333" filter="url(#rough2)">abb</text>
  <text x="256" y="123" font-size="11.5" fill="#333" filter="url(#rough2)">a | bb　⇒　k = 2</text>
  <text x="496" y="123" font-size="11" fill="#333" filter="url(#rough2)">无：唯一的单元素段在首位</text>
  <text x="705" y="123" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">2</text>

  <rect x="36" y="140" width="708" height="44" fill="#f2f6fb" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="46" y="167" font-size="12" fill="#333" filter="url(#rough2)">abc</text>
  <text x="256" y="167" font-size="11.5" fill="#333" filter="url(#rough2)">a | b | c　⇒　k = 3</text>
  <text x="496" y="167" font-size="11" fill="#333" filter="url(#rough2)">j=2：邻色 a、c 不同 → 3−1 = 2</text>
  <text x="705" y="167" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">2</text>

  <rect x="36" y="184" width="708" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="46" y="211" font-size="12" fill="#333" filter="url(#rough2)">abaa</text>
  <text x="256" y="211" font-size="11.5" fill="#333" filter="url(#rough2)">a | b | aa　⇒　k = 3</text>
  <text x="496" y="211" font-size="11" fill="#333" filter="url(#rough2)">j=2：邻色 a、a 相同 → 3−2 = 1</text>
  <text x="705" y="211" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>

  <rect x="36" y="228" width="708" height="44" fill="#f2f6fb" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="46" y="255" font-size="12" fill="#333" filter="url(#rough2)">abba</text>
  <text x="256" y="255" font-size="11.5" fill="#333" filter="url(#rough2)">a | bb | a　⇒　k = 3</text>
  <text x="496" y="255" font-size="11" fill="#333" filter="url(#rough2)">无：bb 长 2，两侧段落在两端</text>
  <text x="705" y="255" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">3</text>

  <rect x="36" y="272" width="708" height="44" fill="#fafafa" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="46" y="299" font-size="12" fill="#333" filter="url(#rough2)">abacaba</text>
  <text x="256" y="299" font-size="11.5" fill="#333" filter="url(#rough2)">a|b|a|c|a|b|a　⇒　k = 7</text>
  <text x="496" y="299" font-size="11" fill="#333" filter="url(#rough2)">j=2,4,6：邻色 a、a → 7−2 = 5</text>
  <text x="705" y="299" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">5</text>

  <rect x="36" y="316" width="708" height="44" fill="#f2f6fb" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="46" y="343" font-size="12" fill="#333" filter="url(#rough2)">goodluck…fun</text>
  <text x="256" y="343" font-size="11.5" fill="#333" filter="url(#rough2)">17 段　⇒　k = 17（仅 oo 长 2）</text>
  <text x="496" y="343" font-size="11" fill="#333" filter="url(#rough2)">内部单元素段邻色全异 → 16</text>
  <text x="705" y="343" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">16</text>

  <text x="40" y="386" font-size="11.5" fill="#333" filter="url(#rough2)">① abb：单元素段就是段 1（字符 s_1），不可删；bb 段长 2，删一个还剩一个 ⇒ 仍是 k = 2。</text>
  <text x="40" y="410" font-size="11.5" fill="#333" filter="url(#rough2)">② abaa：删掉 b 后左右两个 a 段直接相邻、同色合并 ⇒ 3 − 2 = 1，这就是 k−2 的唯一来源。</text>
  <text x="40" y="434" font-size="11.5" font-weight="bold" fill="#8a3a37" filter="url(#rough2)">③ goodluckandhavefun：除 oo 外全是单元素段，却没有一处左右同色 ⇒ 只能拿到 k−1 = 16。</text>
</svg>
