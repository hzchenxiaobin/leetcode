<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="400" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">叉积的符号 = 转向：v × w &gt; 0 左转，&lt; 0 右转，= 0 直行</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">v = B − A 是面朝方向，w = C − B 是去 C 的方向</text>
  <g filter="url(#rough2)"><line x1="300" y1="300" x2="300" y2="170" stroke="#446688" stroke-width="2.4" marker-end="url(#arrb)"/></g>
  <text x="310" y="164" text-anchor="start" font-size="16" font-weight="bold" fill="#446688" filter="url(#rough2)">v</text>
  <g filter="url(#rough2)"><line x1="300" y1="170" x2="190" y2="100" stroke="#4a7a3a" stroke-width="2.0" marker-end="url(#arrg)"/></g>
  <text x="170" y="95" text-anchor="end" font-size="12" fill="#3d6b2f" filter="url(#rough2)">w（左）</text>
  <g filter="url(#rough2)"><line x1="300" y1="170" x2="410" y2="100" stroke="#a0522d" stroke-width="2.0" marker-end="url(#arrr)"/></g>
  <text x="430" y="95" text-anchor="start" font-size="12" fill="#a0522d" filter="url(#rough2)">w（右）</text>
  <g filter="url(#rough2)"><circle cx="300" cy="170" r="6" fill="#2b2b2b" fill-opacity="0.9" stroke="#2b2b2b" stroke-width="1.4"/></g>
  <text x="308" y="182" text-anchor="start" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">B</text>
  <text x="306" y="316" text-anchor="start" font-size="10.5" fill="#777777" filter="url(#rough2)">A（脚下方向）</text>
  <text x="420" y="352" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">逆时针侧（左手边）⇒ 左转 LEFT；顺时针侧 ⇒ 右转 RIGHT</text>
  <text x="420" y="378" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">共线且 B 在线段 AC 上 ⇒ 直行 TOWARDS</text>
</svg>
