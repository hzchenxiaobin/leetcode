<svg xmlns="http://www.w3.org/2000/svg" width="840" height="410" viewBox="0 0 840 410"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="95"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="840" height="410" fill="#fafafa"/>

  <text x="420" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">计数状态与 once 集合的增删：只有 1 次才在集合里</text>

  <!-- 四个计数档 -->
  <g filter="url(#rough2)">
    <rect x="105" y="176" width="90" height="58" rx="10" fill="#eeeeee" stroke="#888888" stroke-width="1.6"/>
    <rect x="295" y="176" width="90" height="58" rx="10" fill="#d9ecd4" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="485" y="176" width="90" height="58" rx="10" fill="#cfe0f5" stroke="#446688" stroke-width="1.6"/>
    <rect x="675" y="176" width="90" height="58" rx="10" fill="#f4f4f4" stroke="#999999" stroke-width="1.6"/>

    <text x="150" y="204" text-anchor="middle" font-size="13" fill="#555555">0 次</text>
    <text x="150" y="222" text-anchor="middle" font-size="10" fill="#888888">不在窗口</text>
    <text x="340" y="204" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223">1 次</text>
    <text x="340" y="222" text-anchor="middle" font-size="10" fill="#2f5223">在 once 中</text>
    <text x="530" y="204" text-anchor="middle" font-size="13" fill="#2f4a66">2 次</text>
    <text x="530" y="222" text-anchor="middle" font-size="10" fill="#2f4a66">不在 once 中</text>
    <text x="720" y="204" text-anchor="middle" font-size="13" fill="#777777">≥ 3 次</text>
    <text x="720" y="222" text-anchor="middle" font-size="10" fill="#999999">不在 once 中</text>
  </g>

  <!-- 加入：向上的箭头 -->
  <g filter="url(#rough2)">
    <path d="M 160 172 L 160 122 L 316 122 L 316 172" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)"/>
    <text x="238" y="114" text-anchor="middle" font-size="10" fill="#2f5223">加入 v：0→1，插入 once</text>

    <path d="M 350 172 L 350 122 L 506 122 L 506 172" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)"/>
    <text x="428" y="114" text-anchor="middle" font-size="10" fill="#2f5223">加入 v：1→2，删除 once</text>

    <path d="M 540 172 L 540 122 L 696 122 L 696 172" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)"/>
    <text x="618" y="114" text-anchor="middle" font-size="10" fill="#2f5223">加入 v：2→3，不动作</text>
  </g>

  <!-- 删除：向下的箭头 -->
  <g filter="url(#rough2)">
    <path d="M 316 238 L 316 288 L 160 288 L 160 238" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)"/>
    <text x="238" y="306" text-anchor="middle" font-size="10" fill="#8a2b28">删除 v：1→0，删除 once</text>

    <path d="M 506 238 L 506 288 L 350 288 L 350 238" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)"/>
    <text x="428" y="306" text-anchor="middle" font-size="10" fill="#8a2b28">删除 v：2→1，插入 once</text>

    <path d="M 696 238 L 696 288 L 540 288 L 540 238" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)"/>
    <text x="618" y="306" text-anchor="middle" font-size="10" fill="#8a2b28">删除 v：3→2，不动作</text>
  </g>

  <text x="420" y="350" text-anchor="middle" font-size="11.5" fill="#444444" filter="url(#rough2)">绿线：加入一个值 v 时的计数迁移；红线：删除一个值 v 时的计数迁移。</text>
  <text x="420" y="374" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">"不动作"是易错点：计数 ≥2 与 ≥3 之间来回时，once 完全不需要改动。</text>
</svg>
