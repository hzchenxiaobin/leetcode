<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="720" height="280" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">左门统一、右门统一：两类门互不干扰</text>
  <rect x="60" y="56" width="290" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="205" y="78" text-anchor="middle" font-size="11.5" fill="#2f5223">左门：开 L 个、关 n−L 个</text>
  <text x="205" y="92" text-anchor="middle" font-size="11.5" fill="#2f5223">最小改动 min(L, n−L)</text>
  <rect x="370" y="56" width="290" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="515" y="78" text-anchor="middle" font-size="11.5" fill="#2f4a66">右门：开 R 个、关 n−R 个</text>
  <text x="515" y="92" text-anchor="middle" font-size="11.5" fill="#2f4a66">最小改动 min(R, n−R)</text>
  <rect x="60" y="140" width="600" height="50" rx="8" fill="#fde9d9" stroke="#b4652a" stroke-width="1.5"/>
  <text x="360" y="170" text-anchor="middle" font-size="13" fill="#7a4b22">答案 = min(L, n−L) + min(R, n−R)</text>
  <text x="60" y="228" text-anchor="start" font-size="11.5" fill="#7a4b22" filter="url(#rough2)">样例 n=5：左门开 2 个 → min(2,3)=2；右门开 4 个 → min(4,1)=1</text>
  <text x="60" y="254" text-anchor="start" font-size="11.5" fill="#446688" filter="url(#rough2)">答案 2 + 1 = 3 ✓（从左到右的「开/关」两种目标各算一次，取小）</text>
</svg>
