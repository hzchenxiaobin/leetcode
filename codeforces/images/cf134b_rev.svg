<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320" viewBox="0 0 700 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1343"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="700" height="320" fill="#fafafa"/>
  <text x="350.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">逆向：大的减小的</text>
  <path d="M 112.0 42 Q 350.0 48 588.0 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="350.0" y="306" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">前驱唯一，步数 = 减法次数</text>
  <circle cx="150" cy="240" r="6" fill="#b85450" filter="url(#rough2)"/>
  <text x="158" y="232" text-anchor="start" font-size="11" fill="#8c2f2c" filter="url(#rough2)">(1,1)</text>
  <circle cx="280" cy="200" r="6" fill="#b85450" filter="url(#rough2)"/>
  <text x="288" y="192" text-anchor="start" font-size="11" fill="#8c2f2c" filter="url(#rough2)">(1,2)</text>
  <circle cx="410" cy="130" r="6" fill="#b85450" filter="url(#rough2)"/>
  <text x="418" y="122" text-anchor="start" font-size="11" fill="#8c2f2c" filter="url(#rough2)">(3,2)</text>
  <circle cx="540" cy="70" r="6" fill="#b85450" filter="url(#rough2)"/>
  <text x="548" y="62" text-anchor="start" font-size="11" fill="#8c2f2c" filter="url(#rough2)">(5,2)</text>
  <line x1="158.0" y1="234.0" x2="272.0" y2="206.0" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <line x1="288.0" y1="194.0" x2="402.0" y2="136.0" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <line x1="418.0" y1="124.0" x2="532.0" y2="76.0" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="350" y="300" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">目标含 n=5：枚举另一坐标 b，逆推回 (1,1)，取最少步数</text>
</svg>
