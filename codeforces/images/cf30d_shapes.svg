<svg xmlns="http://www.w3.org/2000/svg" width="760" height="290" viewBox="0 0 760 290"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="171"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="dr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="760" height="290" fill="#fafafa"/>
  <text x="380" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">三种基本形状：P 在终点 / P 在起点方向 / 跨过 P</text>
  <!-- 形状 1 -->
  <line x1="40" y1="110" x2="230" y2="110" stroke="#c9ced6" stroke-width="1.6" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <circle cx="70" cy="110" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="200" cy="110" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="135" cy="60" r="9" fill="#fdf3e3" stroke="#d6a040" stroke-width="1.8"/>
    <text x="135" y="45" text-anchor="middle" font-size="12" fill="#8a6015">P</text>
  </g>
  <path d="M79,110 L191,110" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <line x1="200" y1="101" x2="145" y2="66" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="135" y="150" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">① 扫完再去 P</text>

  <!-- 形状 2 -->
  <line x1="280" y1="110" x2="470" y2="110" stroke="#c9ced6" stroke-width="1.6" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <circle cx="310" cy="110" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="440" cy="110" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="375" cy="60" r="9" fill="#fdf3e3" stroke="#d6a040" stroke-width="1.8"/>
    <text x="375" y="45" text-anchor="middle" font-size="12" fill="#8a6015">P</text>
  </g>
  <line x1="310" y1="110" x2="366" y2="66" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <line x1="384" y1="66" x2="431" y2="110" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <path d="M440,110 L320,110" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="375" y="150" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">② 先去 P 再扫</text>

  <!-- 形状 3 -->
  <line x1="520" y1="110" x2="710" y2="110" stroke="#c9ced6" stroke-width="1.6" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <circle cx="550" cy="110" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="615" cy="110" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="680" cy="110" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="615" cy="58" r="9" fill="#fdf3e3" stroke="#d6a040" stroke-width="1.8"/>
    <text x="615" y="43" text-anchor="middle" font-size="12" fill="#8a6015">P</text>
  </g>
  <line x1="550" y1="110" x2="606" y2="66" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <line x1="624" y1="66" x2="671" y2="110" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="615" y="150" text-anchor="middle" font-size="12" fill="#8f3b37" filter="url(#rough2)">③ 覆盖一段后跨过 P</text>

  <rect x="60" y="180" width="640" height="86" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="76" y="204" font-size="12.5" fill="#8a6015" filter="url(#rough2)">轴上城市必须全部访问 ⇒ 路线一定到达 L 与 R；P 只访问一次，把路线切成"轴上一段 + 跨过 P + 轴上一段"。</text>
  <text x="76" y="228" font-size="12.5" fill="#8a6015" filter="url(#rough2)">对每个 b（跨出点所在的城市）取"停在 b"或"停在 L"两种走法，落点取 b 的下一个城市 c。</text>
  <text x="76" y="252" font-size="12.5" fill="#8a6015" filter="url(#rough2)">再把 x 坐标取反做同样一遍，覆盖"先走右边再跨到左边"的镜像情形。</text>
</svg>
