<svg xmlns="http://www.w3.org/2000/svg" width="780" height="452" viewBox="0 0 780 452"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8d3a36"/>
    </marker>
  </defs>
  <rect width="780" height="452" fill="#fafafa"/>
  <text x="390" y="30" text-anchor="middle" font-size="16.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">按「最右最大值位置 p」给区间分类：两个窗口 + 前缀下标（割点）</text>
  <text x="390" y="52" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">a = [5, 2, 9, 4, 1, 6]，取 p = 2（a_p = 9 是最大值）：L_p = 0，R_p = 5</text>
  <rect x="54" y="74" width="84" height="46" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="96.0" y="95.0" text-anchor="middle" font-size="17" fill="#2f4a66" filter="url(#rough2)">5</text>
  <text x="96.0" y="110.0" text-anchor="middle" font-size="9.5" fill="#2f4a66" filter="url(#rough2)">a[0]</text>
  <rect x="154" y="74" width="84" height="46" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="196.0" y="95.0" text-anchor="middle" font-size="17" fill="#2f4a66" filter="url(#rough2)">2</text>
  <text x="196.0" y="110.0" text-anchor="middle" font-size="9.5" fill="#2f4a66" filter="url(#rough2)">a[1]</text>
  <rect x="254" y="74" width="84" height="46" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="296.0" y="95.0" text-anchor="middle" font-size="17" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="296.0" y="110.0" text-anchor="middle" font-size="9.5" fill="#8a6a1f" filter="url(#rough2)">a[2]</text>
  <rect x="354" y="74" width="84" height="46" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="396.0" y="95.0" text-anchor="middle" font-size="17" fill="#2f4a66" filter="url(#rough2)">4</text>
  <text x="396.0" y="110.0" text-anchor="middle" font-size="9.5" fill="#2f4a66" filter="url(#rough2)">a[3]</text>
  <rect x="454" y="74" width="84" height="46" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="496.0" y="95.0" text-anchor="middle" font-size="17" fill="#2f4a66" filter="url(#rough2)">1</text>
  <text x="496.0" y="110.0" text-anchor="middle" font-size="9.5" fill="#2f4a66" filter="url(#rough2)">a[4]</text>
  <rect x="554" y="74" width="84" height="46" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="596.0" y="95.0" text-anchor="middle" font-size="17" fill="#2f4a66" filter="url(#rough2)">6</text>
  <text x="596.0" y="110.0" text-anchor="middle" font-size="9.5" fill="#2f4a66" filter="url(#rough2)">a[5]</text>
  <text x="96" y="66" text-anchor="middle" font-size="11" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">L_p</text>
  <text x="656" y="66" text-anchor="middle" font-size="11" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">R_p</text>
  <text x="390" y="146" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">割点：前缀异或 P_x = a_0 ⊕ … ⊕ a_{x−1}</text>
  <rect x="30" y="156" width="48" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="54.0" y="175.0" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">0</text>
  <text x="54.0" y="190.0" text-anchor="middle" font-size="9.5" fill="#2f4a66" filter="url(#rough2)">P0</text>
  <rect x="130" y="156" width="48" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="154.0" y="175.0" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">5</text>
  <text x="154.0" y="190.0" text-anchor="middle" font-size="9.5" fill="#2f4a66" filter="url(#rough2)">P1</text>
  <rect x="230" y="156" width="48" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="254.0" y="175.0" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">7</text>
  <text x="254.0" y="190.0" text-anchor="middle" font-size="9.5" fill="#2f4a66" filter="url(#rough2)">P2</text>
  <rect x="330" y="156" width="48" height="42" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="354.0" y="175.0" text-anchor="middle" font-size="14" fill="#3c5e2e" filter="url(#rough2)">14</text>
  <text x="354.0" y="190.0" text-anchor="middle" font-size="9.5" fill="#3c5e2e" filter="url(#rough2)">P3</text>
  <rect x="430" y="156" width="48" height="42" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="454.0" y="175.0" text-anchor="middle" font-size="14" fill="#3c5e2e" filter="url(#rough2)">10</text>
  <text x="454.0" y="190.0" text-anchor="middle" font-size="9.5" fill="#3c5e2e" filter="url(#rough2)">P4</text>
  <rect x="530" y="156" width="48" height="42" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="554.0" y="175.0" text-anchor="middle" font-size="14" fill="#3c5e2e" filter="url(#rough2)">11</text>
  <text x="554.0" y="190.0" text-anchor="middle" font-size="9.5" fill="#3c5e2e" filter="url(#rough2)">P5</text>
  <rect x="630" y="156" width="48" height="42" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="654.0" y="175.0" text-anchor="middle" font-size="14" fill="#3c5e2e" filter="url(#rough2)">13</text>
  <text x="654.0" y="190.0" text-anchor="middle" font-size="9.5" fill="#3c5e2e" filter="url(#rough2)">P6</text>
  <rect x="22" y="150" width="264" height="54" rx="8" fill="none" stroke="#446688" stroke-width="2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <rect x="320" y="150" width="366" height="54" rx="8" fill="none" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="154" y="224" text-anchor="middle" font-size="11.5" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">左窗口 i ∈ [L_p, p]</text>
  <text x="503" y="224" text-anchor="middle" font-size="11.5" fill="#3c5e2e" font-weight="bold" filter="url(#rough2)">右窗口 j ∈ [p+1, R_p+1]</text>
  <path d="M 284 177 L 322 177" stroke="#b85450" stroke-width="2.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="390" y="250" text-anchor="middle" font-size="12" fill="#8d3a36" font-weight="bold" filter="url(#rough2)">✗ 唯一要剔的对：(i, j) = (p, p+1)，它对应的区间是 [p, p]，长度只有 1</text>
  <rect x="30" y="266" width="720" height="80" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="48" y="290" text-anchor="start" font-size="12.5" fill="#8a6a1f" filter="url(#rough2)">颜色 c(x) = P_x &amp; S。条件 (P_i ⊕ P_j) ⊇ S  ⇔  c(j) = c(i) ⊕ S（在 S 内互为补色）。</text>
  <text x="48" y="312" text-anchor="start" font-size="12" fill="#8a6a1f" filter="url(#rough2)">于是「判可行」变成「左窗口里的某个颜色 c，在右窗口里有没有颜色 c ⊕ S」——两堆颜色对一对。</text>
  <text x="48" y="332" text-anchor="start" font-size="12" fill="#8d3a36" filter="url(#rough2)">剔除那一对的办法：该颜色在另一侧的重数减 1 后仍 &gt; 0，就说明还有别的见证。</text>
  <rect x="30" y="362" width="720" height="80" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="48" y="386" text-anchor="start" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">块 [L, R] 的割点集 = {P_L, …, P_{R+1}}；而左窗口 ∪ 右窗口 正好就是合并后的割点集。</text>
  <text x="48" y="408" text-anchor="start" font-size="12" fill="#3c5e2e" filter="url(#rough2)">按 (a_p, p) 升序激活 + 并查集：每激活一个 p 就同时得到它的两个窗口，块内用哈希表存颜色重数。</text>
  <text x="48" y="428" text-anchor="start" font-size="12" fill="#3c5e2e" filter="url(#rough2)">合并时「小的灌进大的」（小并大），每个元素一辈子只被搬 O(log n) 次。</text>
</svg>
