<svg xmlns="http://www.w3.org/2000/svg" width="884" height="372" viewBox="0 0 884 372"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="125"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/></marker>
  </defs>
  <rect width="884" height="372" fill="#fafafa"/>
  <text x="442" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">Z 数组：z[i] = s 与 s[i:] 的最长公共前缀长度</text>
  <text x="442" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">候选 t 必须同时是前缀、后缀、且严格出现在中间</text>
  <text x="442" y="96" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">条件：k 是 border（前缀=后缀），且存在 i≥1 使 z[i] ≥ k 且 i+k ≤ n−1</text>
  <g filter="url(#rough2)"><rect x="120" y="130" width="64" height="44" rx="4" fill="#cfe0f5" fill-opacity="0.5" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="152" y="158" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">f</text>
  <g filter="url(#rough2)"><rect x="200" y="130" width="64" height="44" rx="4" fill="#cfe0f5" fill-opacity="0.5" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="232" y="158" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">i</text>
  <g filter="url(#rough2)"><rect x="280" y="130" width="64" height="44" rx="4" fill="#cfe0f5" fill-opacity="0.5" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="312" y="158" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">x</text>
  <g filter="url(#rough2)"><rect x="360" y="130" width="64" height="44" rx="4" fill="#e8e8e8" fill-opacity="0.5" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="392" y="158" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">p</text>
  <g filter="url(#rough2)"><rect x="440" y="130" width="64" height="44" rx="4" fill="#e8e8e8" fill-opacity="0.5" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="472" y="158" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">r</text>
  <g filter="url(#rough2)"><rect x="520" y="130" width="64" height="44" rx="4" fill="#e8e8e8" fill-opacity="0.5" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="552" y="158" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">e</text>
  <g filter="url(#rough2)"><rect x="600" y="130" width="64" height="44" rx="4" fill="#e8e8e8" fill-opacity="0.5" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="632" y="158" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">f</text>
  <g filter="url(#rough2)"><rect x="680" y="130" width="64" height="44" rx="4" fill="#e8e8e8" fill-opacity="0.5" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="712" y="158" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">i</text>
  <g filter="url(#rough2)"><rect x="760" y="130" width="64" height="44" rx="4" fill="#e8e8e8" fill-opacity="0.5" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="792" y="158" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">x</text>
  <g filter="url(#rough2)"><rect x="840" y="130" width="64" height="44" rx="4" fill="#e8e8e8" fill-opacity="0.5" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="872" y="158" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">s</text>
  <g filter="url(#rough2)"><rect x="120" y="130" width="192" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.25" stroke="#6a9a58" stroke-width="1.6"/></g>
  <text x="216" y="120" text-anchor="middle" font-size="10.5" fill="#3d6b2f" filter="url(#rough2)">候选前缀</text>
  <text x="442" y="224" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">maxMid = max over i∈[1,n−2] min(z[i], n−1−i)</text>
  <text x="442" y="254" text-anchor="middle" font-size="12" fill="#3d6b2f" filter="url(#rough2)">答案 = 不超过 maxMid 的最长 border（沿 π 链回溯）</text>
  <text x="442" y="290" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">n ≤ 10⁶，Z 与 π 都是 O(n)</text>
  <text x="442" y="330" text-anchor="middle" font-size="11" fill="#8a2b28" filter="url(#rough2)">例：fixprefixsuffix → “fix” 位于 0、6、12 → 答案 fix</text>
</svg>
