<svg xmlns="http://www.w3.org/2000/svg" width="900" height="310" viewBox="0 0 900 310" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="597"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="310" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">dp[j] = 处理完前 i 个电话、忽略 j 个后的最早空闲时刻</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">越小越优（支配）</text>
  <g filter="url(#rough2)"><rect x="60" y="96" width="380" height="80" rx="6" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="250" y="126" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">接第 i 个</text>
  <text x="250" y="154" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">start = max(dp[j], tᵢ)，finish = start + dᵢ</text>
  <g filter="url(#rough2)"><rect x="480" y="96" width="380" height="80" rx="6" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="670" y="126" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">忽略第 i 个</text>
  <text x="670" y="154" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">ndp[j+1] = min(ndp[j+1], dp[j])</text>
  <g filter="url(#rough2)"><rect x="60" y="200" width="800" height="44" rx="6" fill="#f3d9d6" fill-opacity="0.4" stroke="#8a2b28" stroke-width="1.4"/></g>
  <text x="460" y="228" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">睡眠段长度 = 下一个来电时刻 − dp[j]（无来电则用 86401）</text>
  <text x="450" y="278" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">答案 = 所有 (i, j) 上的最大值；复杂度 O(nk)</text>
</svg>
