<svg xmlns="http://www.w3.org/2000/svg" width="700" height="270" viewBox="0 0 700 270"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="1203"/>
    <feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></defs>
  <rect width="700" height="270" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">规模与实现要点</text>
  <path d="M 180 40 Q 350 46 520 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="60" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="12.5" fill="#22314a" filter="url(#rough2)">点数 = 1 + n + m + 1 ≤ 1.2·10⁴；边数 ≈ n + Σ(kᵢ+1) ≤ 2.2·10⁴（kᵢ ≤ 10）。</text>
  <text x="76" y="104" font-size="12.5" fill="#22314a" filter="url(#rough2)">Dinic 足够：实测最坏（n=10⁴, m=2000, k=10）0.045 s / 1.5 s。</text>
  <g filter="url(#rough2)"><rect x="60" y="130" width="580" height="60" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="154" font-size="12.5" fill="#2f5223" filter="url(#rough2)">容量用 long long：∞ 取 1e18（不能取 1e9，因为 w+g 最多 2·10⁴，但求和会大）。</text>
  <text x="76" y="176" font-size="12.5" fill="#2f5223" filter="url(#rough2)">答案可能为负（改性别花费 &gt; 奖金）⇒ 直接输出 base − flow。</text>
  <g filter="url(#rough2)"><rect x="60" y="202" width="580" height="52" rx="8" fill="#fbeeee" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="76" y="226" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">易错：朋友的额外罚金 g 要加到"放弃该朋友"的那条边上，不是单独的边。</text>
  <text x="76" y="248" font-size="12px" fill="#8a3a36" filter="url(#rough2)">m=0 时没有任何悬赏 ⇒ 答案 0（不改变任何狗）。</text>
</svg>
