<svg xmlns="http://www.w3.org/2000/svg" width="780" height="470" viewBox="0 0 780 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="780" height="470" fill="#fafafa"/>

  <text x="390" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">时间轴：每个空档被 T1 与 T1+T2 切成三段</text>
  <path d="M 170 42 Q 390 48 610 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 分档色条 -->
  <g filter="url(#rough2)">
    <rect x="60" y="140" width="112" height="46" fill="#cfe0f5" stroke="#446688" stroke-width="1.5"/>
    <rect x="172" y="140" width="112" height="46" fill="#e4eefa" stroke="#446688" stroke-width="1.5" stroke-dasharray="5 3"/>
    <rect x="284" y="140" width="168" height="46" fill="#d9ecd4" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="452" y="140" width="84" height="46" fill="#f6d9d7" stroke="#b85450" stroke-width="1.5"/>
    <rect x="536" y="140" width="112" height="46" fill="#cfe0f5" stroke="#446688" stroke-width="1.5"/>
  </g>

  <text x="116" y="168" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">活动 P1</text>
  <text x="228" y="162" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">仍 P1</text>
  <text x="228" y="178" text-anchor="middle" font-size="10" fill="#4a6b8a" filter="url(#rough2)">（T1 未满）</text>
  <text x="368" y="168" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">屏幕保护 P2</text>
  <text x="494" y="168" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">睡眠 P3</text>
  <text x="592" y="168" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">活动 P1</text>

  <!-- 段长标注 -->
  <text x="116" y="210" text-anchor="middle" font-size="10.5" fill="#3c5a78" filter="url(#rough2)">r − l 分钟 × P1</text>
  <text x="228" y="210" text-anchor="middle" font-size="10.5" fill="#4a6b8a" filter="url(#rough2)">min(d,T1) × P1</text>
  <text x="368" y="210" text-anchor="middle" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">min(d−a, T2) × P2</text>
  <text x="494" y="210" text-anchor="middle" font-size="10.5" fill="#9a4a47" filter="url(#rough2)">余下 × P3</text>
  <text x="592" y="210" text-anchor="middle" font-size="10.5" fill="#3c5a78" filter="url(#rough2)">r − l 分钟 × P1</text>

  <!-- 分界虚线 -->
  <g filter="url(#rough2)" stroke="#888888" stroke-width="1.1" stroke-dasharray="4 3">
    <line x1="172" y1="104" x2="172" y2="140"/>
    <line x1="284" y1="104" x2="284" y2="140"/>
    <line x1="452" y1="104" x2="452" y2="140"/>
    <line x1="536" y1="104" x2="536" y2="140"/>
  </g>
  <text x="172" y="98" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">活动结束 r</text>
  <text x="300" y="86" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">+T1</text>
  <text x="452" y="98" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">+T2（进入睡眠）</text>
  <text x="560" y="86" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">下次活动 l</text>

  <path d="M 60 240 L 660 240" stroke="#999999" stroke-width="1.2" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="666" y="244" font-size="10.5" fill="#777777" filter="url(#rough2)">时间</text>

  <!-- 结论框 -->
  <rect x="40" y="272" width="700" height="170" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="58" y="298" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">空档 d = l(i+1) − r(i)，依次扣减三段</text>
  <text x="58" y="326" font-size="12" fill="#7a5a1b" filter="url(#rough2)">a = min(d, T1) → 答案 += a · P1, d −= a</text>
  <text x="58" y="352" font-size="12" fill="#7a5a1b" filter="url(#rough2)">b = min(d, T2) → 答案 += b · P2, d −= b</text>
  <text x="58" y="378" font-size="12" fill="#7a5a1b" filter="url(#rough2)">答案 += d · P3（剩下的时间才是睡眠）</text>
  <text x="58" y="406" font-size="11.5" fill="#9a7020" filter="url(#rough2)">工作区间整段按 P1：答案 += (r − l) · P1；最后一个区间之后的时间不计。</text>
  <text x="58" y="428" font-size="11.5" fill="#9a7020" filter="url(#rough2)">三个颜色段互不重叠，并起来恰好是整个空档——不会多算也不会漏算。</text>
</svg>
