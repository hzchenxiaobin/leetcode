<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="400" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">已占车位把整条线切成：前缀 / 内部空隙 / 后缀</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">n = 10，已占 {2, 6, 9}；每段的"最佳空位"都在段内的端点或中点</text>
  <g filter="url(#rough2)"><rect x="70" y="120" width="62" height="46" rx="4" fill="#d7ecd0" fill-opacity="0.95" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="101.0" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="138" y="120" width="62" height="46" rx="4" fill="#f6d9d7" fill-opacity="0.95" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="169.0" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="206" y="120" width="62" height="46" rx="4" fill="#d7ecd0" fill-opacity="0.95" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="237.0" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="274" y="120" width="62" height="46" rx="4" fill="#d7ecd0" fill-opacity="0.95" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="305.0" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><rect x="342" y="120" width="62" height="46" rx="4" fill="#d7ecd0" fill-opacity="0.95" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="373.0" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <g filter="url(#rough2)"><rect x="410" y="120" width="62" height="46" rx="4" fill="#f6d9d7" fill-opacity="0.95" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="441.0" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">6</text>
  <g filter="url(#rough2)"><rect x="478" y="120" width="62" height="46" rx="4" fill="#d7ecd0" fill-opacity="0.95" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="509.0" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">7</text>
  <g filter="url(#rough2)"><rect x="546" y="120" width="62" height="46" rx="4" fill="#d7ecd0" fill-opacity="0.95" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="577.0" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">8</text>
  <g filter="url(#rough2)"><rect x="614" y="120" width="62" height="46" rx="4" fill="#f6d9d7" fill-opacity="0.95" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="645.0" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">9</text>
  <g filter="url(#rough2)"><rect x="682" y="120" width="62" height="46" rx="4" fill="#d7ecd0" fill-opacity="0.95" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="713.0" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">10</text>
  <g filter="url(#rough2)"><circle cx="101.0" cy="143.0" r="20" fill="none" fill-opacity="0.9" stroke="#3d6b2f" stroke-width="2.0"/></g>
  <g filter="url(#rough2)"><circle cx="305.0" cy="143.0" r="20" fill="none" fill-opacity="0.9" stroke="#2f4a66" stroke-width="2.0"/></g>
  <g filter="url(#rough2)"><circle cx="509.0" cy="143.0" r="20" fill="none" fill-opacity="0.9" stroke="#2f4a66" stroke-width="2.0"/></g>
  <g filter="url(#rough2)"><circle cx="713.0" cy="143.0" r="20" fill="none" fill-opacity="0.9" stroke="#3d6b2f" stroke-width="2.0"/></g>
  <text x="145" y="222" text-anchor="middle" font-size="11.5" fill="#3d6b2f" filter="url(#rough2)">前缀最佳 1，距离 1</text>
  <text x="348" y="222" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">空隙 (2,6) 中点 4，距离 2</text>
  <text x="560" y="222" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">空隙 (6,9) 中点 ⌊(6+9)/2⌋ = 7，距离 1</text>
  <text x="735" y="250" text-anchor="middle" font-size="11" fill="#3d6b2f" filter="url(#rough2)">后缀 10，距离 1</text>
  <g filter="url(#rough2)"><rect x="80" y="286" width="680" height="92" rx="4" fill="#faf3ec" fill-opacity="0.85" stroke="#c8a48a" stroke-width="1.3"/></g>
  <text x="420" y="312" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">前缀 [1, f−1]：距离 f−i 递减 ⇒ 最佳 1，距离 f−1</text>
  <text x="420" y="336" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">内部 (a,b)：距离 min(i−a, b−i) 是山峰 ⇒ 最佳 ⌊(a+b)/2⌋，距离 ⌊(b−a)/2⌋</text>
  <text x="420" y="360" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">后缀 [l+1, n]：距离 i−l 递增 ⇒ 最佳 n，距离 n−l</text>
</svg>
