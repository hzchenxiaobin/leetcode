<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 450" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="450" fill="#fafafa"/>

  <text x="330" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">判定流程：两次查询，最坏 2 次</text>
  <text x="330" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">先用全局 1 的个数 k 定出「分界点候选」，再把前缀 [1,k] 剪下来看有没有 0</text>

  <!-- 查询 1 -->
  <g filter="url(#rough2)">
    <rect x="40" y="66" width="320" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="200" y="87" text-anchor="middle" font-size="11.5" fill="#2c3e50">查询 ①　? 1 n　→　k = 全串 1 的个数</text>
    <text x="200" y="105" text-anchor="middle" font-size="9.5" fill="#667">区间长度 n，答案能是 0…n 之间的任何值</text>
  </g>
  <path d="M 200 118 L 200 140" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定 1 -->
  <g filter="url(#rough2)">
    <rect x="40" y="144" width="320" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
    <text x="200" y="164" text-anchor="middle" font-size="11.5" fill="#8a6a20">k = 0 或 k = n ？</text>
    <text x="200" y="181" text-anchor="middle" font-size="9.5" fill="#9a8a60">全 0 或全 1：没有交界</text>
  </g>
  <path d="M 362 166 L 412 166" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="387" y="158" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="416" y="144" width="196" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8"/>
    <text x="514" y="164" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36">输出 ! NO</text>
    <text x="514" y="181" text-anchor="middle" font-size="9.5" fill="#8a3a36">只用 1 次查询</text>
  </g>

  <path d="M 200 190 L 200 212" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="214" y="206" font-size="10" fill="#3a5a30" filter="url(#rough2)">否（1 ≤ k ≤ n−1）</text>

  <!-- 查询 2 -->
  <g filter="url(#rough2)">
    <rect x="40" y="216" width="320" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="200" y="237" text-anchor="middle" font-size="11.5" fill="#2c3e50">查询 ②　? 1 k　→　c = 前缀 [1,k] 的 1 个数</text>
    <text x="200" y="255" text-anchor="middle" font-size="9.5" fill="#667">把前 k 位单独剪下来数一数，0 ≤ c ≤ k</text>
  </g>
  <path d="M 200 268 L 200 290" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定 2 -->
  <g filter="url(#rough2)">
    <rect x="40" y="294" width="320" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
    <text x="200" y="314" text-anchor="middle" font-size="11.5" fill="#8a6a20">c = k ？</text>
    <text x="200" y="331" text-anchor="middle" font-size="9.5" fill="#9a8a60">等价于「前 k 位里有没有 0」</text>
  </g>
  <path d="M 362 316 L 412 316" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="387" y="308" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="416" y="294" width="196" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8"/>
    <text x="514" y="314" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a3a36">输出 ! NO</text>
    <text x="514" y="331" text-anchor="middle" font-size="9.5" fill="#8a3a36">此时 s = 1^k 0^(n−k)</text>
  </g>

  <path d="M 200 340 L 200 362" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="214" y="356" font-size="10" fill="#3a5a30" filter="url(#rough2)">否（c &lt; k：前 k 位里有 0，后面必有 1）</text>

  <rect x="60" y="366" width="250" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="185" y="385" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4f28" filter="url(#rough2)">输出 ! YES</text>
  <text x="185" y="401" text-anchor="middle" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">0 在前、1 在后 ⇒ 中间必有 0→1</text>

  <text x="330" y="434" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">每组之间没有任何共享状态：读完 n 就独立判定，最多 2 次询问，上限 5 次绰绰有余</text>
</svg>
