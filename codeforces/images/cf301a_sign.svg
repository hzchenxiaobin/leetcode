<svg xmlns="http://www.w3.org/2000/svg" width="880" height="250" viewBox="0 0 880 250"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="250" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">奇偶不变量决定能否全正</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">答案 = sum|a|（或减去 2*min|a|）</text>
  <text x="150" y="100" text-anchor="start" font-size="13" fill="#2b2b2b" filter="url(#rough2)">长度 2n-1；每次翻转恰好 n 个元素的符号</text>
  <text x="150" y="140" text-anchor="start" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">翻转 n 个元素会让"负数个数"的奇偶性改变 n mod 2：n 奇 → 可全正</text>
  <text x="150" y="180" text-anchor="start" font-size="11.5" fill="#3d6b2f" filter="url(#rough2)">n 偶 → 负数个数奇偶不变；若初态负数奇数个，必然留一个负，取绝对值最小者</text>
</svg>
