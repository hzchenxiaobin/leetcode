<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="231"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="300" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1：4 个箱子依次填满 2×2 货架</text>
  <g filter="url(#rough2)">
    <rect x="150" y="60" width="90" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="195" y="84" text-anchor="middle" font-size="11" fill="#2f4a66">(1,1)</text>
    <text x="195" y="106" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f4a66">cola</text>
    <rect x="260" y="60" width="90" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="305" y="84" text-anchor="middle" font-size="11" fill="#2f4a66">(1,2)</text>
    <text x="305" y="106" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f4a66">fanta</text>
    <rect x="150" y="140" width="90" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="195" y="164" text-anchor="middle" font-size="11" fill="#2f4a66">(2,1)</text>
    <text x="195" y="186" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f4a66">sevenup</text>
    <rect x="260" y="140" width="90" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="305" y="164" text-anchor="middle" font-size="11" fill="#2f4a66">(2,2)</text>
    <text x="305" y="186" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f4a66">whitekey</text>
  </g>
  <text x="470" y="98" font-size="12" fill="#2f4a66" filter="url(#rough2)">↑ 第 1 层：新箱子都请求 (1,1)</text>
  <text x="470" y="178" font-size="12" fill="#2f4a66" filter="url(#rough2)">↑ 第 2 层：从最左开始找空位</text>
  <rect x="80" y="222" width="560" height="60" rx="9" fill="#eef4ec" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="96" y="246" font-size="12.5" fill="#2f5223" filter="url(#rough2)">随后 -1 依次输出 1 1、1 2、2 1、2 2，并清空格子；</text>
  <text x="96" y="268" font-size="12.5" fill="#2f5223" filter="url(#rough2)">再查 cola 时已不存在，输出 -1 -1。</text>
</svg>
