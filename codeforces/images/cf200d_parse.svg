<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="340" fill="#fafafa"/>
  <text x="380.0" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">200D：三段式读入 —— 空白全部丢掉再按符号切</text>
  <path d="M 152.00 46 Q 380.0 52 608.00 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60" y="70" width="200" height="112" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="86" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">① 读入 n 条过程</text>
  <text x="74" y="106" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">   void f ( int , T )</text>
  <text x="74" y="126" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">   ↓ 去掉所有空白</text>
  <text x="74" y="146" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">   voidf(int,T)</text>
  <text x="74" y="166" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">   ↓ 去关键字 void</text>
  <text x="74" y="186" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">   f | {int, T}</text>
  <rect x="280" y="70" width="200" height="112" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="294" y="86" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">② 读入 m 个变量</text>
  <text x="294" y="106" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">   int a / string s</text>
  <text x="294" y="126" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">   ↓ 首 token 是类型</text>
  <text x="294" y="146" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">   表 a→int, s→string</text>
  <text x="294" y="166" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">   （名字互不相同）</text>
  <rect x="500" y="70" width="200" height="112" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="514" y="86" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">③ 读入 k 条调用</text>
  <text x="514" y="106" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">   f ( a , s )</text>
  <text x="514" y="126" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">   ↓ 同样去空白</text>
  <text x="514" y="146" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">   f | [a, s]</text>
  <text x="514" y="166" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">   ↓ 逐个过程比对</text>
  <path d="M 262 118 L 278 118" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 482 118 L 498 118" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="60" y="190" width="640" height="60" rx="9" fill="#fdeef1" stroke="#c0708a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="208" text-anchor="start" font-size="11" fill="#8a3a52" filter="url(#rough2)">比对三个条件：名字相同 ∧ 参数个数相同 ∧ 每一位都满足（形参是 T 或 形参类型 = 实参变量的类型）</text>
  <text x="74" y="230" text-anchor="start" font-size="11" fill="#8a3a52" filter="url(#rough2)">三条全满足就把该过程的计数 +1，最后输出这个数。</text>
  <rect x="60" y="268" width="640" height="56" rx="9" fill="#f2f2f2" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="286" text-anchor="start" font-size="11" fill="#3d3d3d" filter="url(#rough2)">规模：n, m, k ≤ 1000，t ≤ 5 ⇒ 至多 1000×1000×5 = 5×10⁶ 次字符串比较，2 s 内很宽裕。</text>
</svg>
