<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="87"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="720" height="420" fill="#fafafa"/>

  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例一的四个终局：绿格 = 该局里人数最少的学院</text>
  <path d="M 96 44 Q 360 51 624 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 表头 -->
  <text x="200" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">终局状态 (G, H, R, S)</text>
  <text x="404" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">G 格兰芬多</text>
  <text x="482" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">H 赫奇帕奇</text>
  <text x="560" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">R 拉文克劳</text>
  <text x="638" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#6b5b95" filter="url(#rough2)">S 斯莱特林</text>

  <!-- 行 1 -->
  <text x="200" y="122" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">(2, 3, 2, 4)</text>
  <rect x="380" y="102" width="46" height="28" rx="5" fill="#dff0d8" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="403" y="122" text-anchor="middle" font-size="13" fill="#2f5223" filter="url(#rough2)">2</text>
  <text x="482" y="122" text-anchor="middle" font-size="13" fill="#666666" filter="url(#rough2)">3</text>
  <rect x="539" y="102" width="46" height="28" rx="5" fill="#dff0d8" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="562" y="122" text-anchor="middle" font-size="13" fill="#2f5223" filter="url(#rough2)">2</text>
  <text x="638" y="122" text-anchor="middle" font-size="13" fill="#666666" filter="url(#rough2)">4</text>

  <!-- 行 2 -->
  <text x="200" y="164" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">(2, 3, 3, 3)</text>
  <rect x="380" y="144" width="46" height="28" rx="5" fill="#dff0d8" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="403" y="164" text-anchor="middle" font-size="13" fill="#2f5223" filter="url(#rough2)">2</text>
  <text x="482" y="164" text-anchor="middle" font-size="13" fill="#666666" filter="url(#rough2)">3</text>
  <text x="562" y="164" text-anchor="middle" font-size="13" fill="#666666" filter="url(#rough2)">3</text>
  <text x="638" y="164" text-anchor="middle" font-size="13" fill="#666666" filter="url(#rough2)">3</text>

  <!-- 行 3 -->
  <text x="200" y="206" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">(2, 4, 2, 3)</text>
  <rect x="380" y="186" width="46" height="28" rx="5" fill="#dff0d8" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="403" y="206" text-anchor="middle" font-size="13" fill="#2f5223" filter="url(#rough2)">2</text>
  <text x="482" y="206" text-anchor="middle" font-size="13" fill="#666666" filter="url(#rough2)">4</text>
  <rect x="539" y="186" width="46" height="28" rx="5" fill="#dff0d8" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="562" y="206" text-anchor="middle" font-size="13" fill="#2f5223" filter="url(#rough2)">2</text>
  <text x="638" y="206" text-anchor="middle" font-size="13" fill="#666666" filter="url(#rough2)">3</text>

  <!-- 行 4 -->
  <text x="200" y="248" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">(3, 3, 2, 3)</text>
  <text x="403" y="248" text-anchor="middle" font-size="13" fill="#666666" filter="url(#rough2)">3</text>
  <text x="482" y="248" text-anchor="middle" font-size="13" fill="#666666" filter="url(#rough2)">3</text>
  <rect x="539" y="228" width="46" height="28" rx="5" fill="#dff0d8" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="562" y="248" text-anchor="middle" font-size="13" fill="#2f5223" filter="url(#rough2)">2</text>
  <text x="638" y="248" text-anchor="middle" font-size="13" fill="#666666" filter="url(#rough2)">3</text>

  <!-- 分隔 -->
  <line x1="60" y1="272" x2="660" y2="272" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <!-- 并集 -->
  <text x="360" y="300" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">四种终局里，取到最小值的学院取并集</text>
  <rect x="230" y="316" width="120" height="42" rx="8" fill="#dff0d8" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="343" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5223" filter="url(#rough2)">Gryffindor</text>
  <rect x="370" y="316" width="120" height="42" rx="8" fill="#dff0d8" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="430" y="343" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5223" filter="url(#rough2)">Ravenclaw</text>
  <line x1="290" y1="290" x2="290" y2="312" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <line x1="430" y1="290" x2="430" y2="312" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <text x="360" y="392" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">赫奇帕奇与斯莱特林在每种终局里都不是最少，所以不会出现在答案里</text>
</svg>
