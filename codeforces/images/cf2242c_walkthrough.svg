<svg xmlns="http://www.w3.org/2000/svg" width="820" height="406" viewBox="0 0 820 406"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>

  <rect width="820" height="406" fill="#fafafa"/>

  <text x="410" y="32" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例 7 走查：计数 (1,2,3,4)，k = 7</text>
  <path d="M 232 42 Q 410 49 588 42" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="410" y="62" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">a = [1,1,1,2,2,3,3,3,3,4]　阈值 θ ⇒ 存活集合 = { c_v ≥ θ }</text>

  <!-- 表头 -->
  <rect x="46" y="76" width="728" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="98" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">θ</text>
  <text x="212" y="98" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">存活的计数</text>
  <text x="352" y="98" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">m′</text>
  <text x="412" y="98" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">P</text>
  <text x="488" y="98" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">S =(7−P)/m′</text>
  <text x="596" y="98" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">S ≥ 1−θ ？</text>
  <text x="712" y="98" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">得到的数组</text>

  <!-- 行 1 -->
  <rect x="46" y="114" width="728" height="40" rx="4" fill="#ffffff" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="76" y="140" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="212" y="140" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1, 2, 3, 4</text>
  <text x="352" y="140" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="412" y="140" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">10</text>
  <text x="488" y="140" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">−3/4</text>
  <text x="596" y="140" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">不整除</text>
  <text x="712" y="140" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">—</text>

  <!-- 行 2 -->
  <rect x="46" y="158" width="728" height="40" rx="4" fill="#ffffff" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="76" y="184" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="212" y="184" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2, 3, 4</text>
  <text x="352" y="184" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="412" y="184" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">9</text>
  <text x="488" y="184" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">−2/3</text>
  <text x="596" y="184" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">不整除</text>
  <text x="712" y="184" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">—</text>

  <!-- 行 3 -->
  <rect x="46" y="202" width="728" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="228" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">3</text>
  <text x="212" y="228" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">3, 4</text>
  <text x="352" y="228" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">2</text>
  <text x="412" y="228" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">7</text>
  <text x="488" y="228" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">0</text>
  <text x="596" y="228" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">√ 0 ≥ −2</text>
  <text x="712" y="228" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">[1,1,1,3,3,3,3]</text>

  <!-- 行 4 -->
  <rect x="46" y="246" width="728" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">4</text>
  <text x="212" y="272" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">4</text>
  <text x="352" y="272" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">1</text>
  <text x="412" y="272" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">4</text>
  <text x="488" y="272" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">3</text>
  <text x="596" y="272" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">√ 3 ≥ −3</text>
  <text x="712" y="272" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">[3,3,3,3,3,3,3]</text>

  <!-- 结论 -->
  <rect x="46" y="298" width="728" height="80" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="66" y="322" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">答案 = 2，与官方输出一致</text>
  <text x="66" y="346" font-size="12" fill="#7a5712" filter="url(#rough2)">θ = 1、2 时 S 不是整数 —— 这两个存活集合无论怎么操作都凑不出长度 7；</text>
  <text x="66" y="366" font-size="12" fill="#7a5712" filter="url(#rough2)">θ = 3、4 各解出一个合法的 S，对应两个不同数组（长度都是 7）。</text>

  <text x="410" y="398" text-anchor="middle" font-size="11.5" fill="#777" filter="url(#rough2)">计数相同的一段 θ 给出同一个存活集合，只需在每段最左端统计一次</text>
</svg>
