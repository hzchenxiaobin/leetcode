<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="411"/>
    <feDisplacementMap in="SourceGraphic" scale="1.5"/></filter></defs>
  <rect width="700" height="300" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">可行性看同余类，最优目标取中位数</text>
  <path d="M 140 40 Q 350 46 560 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="66" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="13" fill="#22314a" filter="url(#rough2)">每次操作 ±d ⇒ 所有元素模 d 的余数永远不变。</text>
  <text x="76" y="106" font-size="12.5" fill="#22314a" filter="url(#rough2)">所以"能全部相等" ⟺ 所有 aᵢⱼ 模 d 同余；否则输出 −1。</text>
  <g filter="url(#rough2)"><rect x="60" y="134" width="580" height="66" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="76" y="158" font-size="13" fill="#8a6015" filter="url(#rough2)">同余后若目标为 t，代价 = Σ|aᵢⱼ − t| / d。除以 d 是常数，等价于最小化 Σ|aᵢⱼ − t|。</text>
  <text x="76" y="182" font-size="13" fill="#8a6015" filter="url(#rough2)">绝对值距离之和在 t = 中位数 时最小（奇数个元素）或取中间两值之间任一（偶数个）。</text>
  <g filter="url(#rough2)"><rect x="60" y="210" width="580" height="66" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="234" font-size="12.5" fill="#2f5223" filter="url(#rough2)">样例 1：[2,4,6,8]，d=2，全同余（都是偶）✓；中位数取 4：|2−4|+|4−4|+|6−4|+|8−4| = 8，/2 = 4 ✓</text>
  <text x="76" y="258" font-size="12.5" fill="#2f5223" filter="url(#rough2)">样例 2：[6,7]，d=7：6 mod 7 = 6，7 mod 7 = 0 ✗ ⇒ −1 ✓</text>
</svg>
