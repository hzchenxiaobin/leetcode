  <rect x="80.0" y="166.0" width="560.0" height="38.0" fill="#ffffff" stroke="#dddddd" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="90.0" y="192.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="240.0" y="192.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">0</text>
