  <text x="540.0" y="100.0" text-anchor="start" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">cost</text>
  <rect x="80.0" y="116.0" width="560.0" height="38.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="90.0" y="142.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">2</text>
