<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="29"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="360" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">一条链：从字符串到两个固定输出</text>
  <path d="M 180 42 Q 360 48 540 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <rect x="40" y="80" width="150" height="54" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="115" y="104" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">读入用户名 s</text>
  <text x="115" y="122" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">只含小写字母</text>

  <line x1="192" y1="107" x2="234" y2="107" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="238" y="80" width="170" height="54" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="323" y="104" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">统计不同字母数 c</text>
  <text x="323" y="122" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">set 或 26 位掩码</text>

  <line x1="410" y1="107" x2="452" y2="107" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="456" y="80" width="150" height="54" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="531" y="104" text-anchor="middle" font-size="12" fill="#7a5a1b" filter="url(#rough2)">c 是奇数吗？</text>
  <text x="531" y="122" text-anchor="middle" font-size="11" fill="#7a5a1b" filter="url(#rough2)">只看奇偶</text>

  <path d="M 500 138 L 400 186" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="468" y="170" font-size="11" fill="#8c2f2b" filter="url(#rough2)">奇数</text>
  <path d="M 560 138 L 600 186" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="588" y="170" font-size="11" fill="#2f5223" filter="url(#rough2)">偶数</text>

  <rect x="290" y="190" width="200" height="58" rx="9" fill="#fde8e8" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="390" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#8c2f2b" filter="url(#rough2)">IGNORE HIM!</text>
  <text x="390" y="236" text-anchor="middle" font-size="11" fill="#8c2f2b" filter="url(#rough2)">奇数 → 男</text>

  <rect x="506" y="190" width="190" height="58" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="601" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">CHAT WITH HER!</text>
  <text x="601" y="236" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">偶数 → 女</text>

  <rect x="40" y="266" width="640" height="70" rx="9" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="54" y="288" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">三条官方样例</text>
  <text x="54" y="310" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">wjmzbmr → 6 种（偶）→ CHAT WITH HER!　　xiaodao → 5 种（奇）→ IGNORE HIM!</text>
  <text x="54" y="330" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">sevenkplus → 8 种（偶）→ CHAT WITH HER!</text>
</svg>
