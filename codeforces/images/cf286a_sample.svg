<svg xmlns="http://www.w3.org/2000/svg" width="700" height="290" viewBox="0 0 700 290"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="363"/>
    <feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></defs>
  <rect width="700" height="290" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">走查：n = 4 与 n = 5</text>
  <path d="M 180 40 Q 350 46 520 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="86" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="12.5" fill="#22314a" filter="url(#rough2)">n=4：rev = (1,4)(2,3)。配对：a=1,b=4,c=2,d=3 ⇒ p = (1,2,4,3)，即 p₁=2,p₂=4,p₃=1,p₄=3。</text>
  <text x="76" y="106" font-size="12.5" fill="#22314a" filter="url(#rough2)">验证：p(p(1))=p(2)=4=rev(1) ✓；p(p(2))=p(4)=3=rev(2) ✓；p(p(3))=p(1)=2=rev(3) ✓</text>
  <text x="76" y="130" font-size="12" fill="#2f4a66" filter="url(#rough2)">输出 "2 4 1 3" ✓（与官方样例一致）</text>
  <g filter="url(#rough2)"><rect x="60" y="152" width="580" height="86" rx="8" fill="#e8f4e0" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="176" font-size="12.5" fill="#2f5223" filter="url(#rough2)">n=5：rev = (1,5)(2,4) + 不动点 3。配对 (1,5),(2,4) ⇒ p=(1,2,5,4)，即 p₁=2,p₂=5,p₃=4,p₄=1；</text>
  <text x="76" y="200" font-size="12.5" fill="#2f5223" filter="url(#rough2)">再令 p₃=3 ✓</text>
  <text x="76" y="224" font-size="12" fill="#3c5e2e" filter="url(#rough2)">输出 "2 5 3 1 4" ✓（与官方样例一致）</text>
  <g filter="url(#rough2)"><rect x="60" y="248" width="580" height="34" rx="8" fill="#fbeeee" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="76" y="270" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">n≡2,3 (mod 4) ⇒ 输出 −1。样例 n=2 → −1 ✓</text>
</svg>
