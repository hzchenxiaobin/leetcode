<svg xmlns="http://www.w3.org/2000/svg" width="760" height="418" viewBox="0 0 760 418"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="418" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">隔板模型：r 张异值牌把众数 v 切成 r+1 段</text>
  <path d="M 128 42 Q 380 49 632 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <text x="380" y="68" text-anchor="middle" font-size="12.5" fill="#66788c" filter="url(#rough2)">示例：众数 v = 6 张，其余 r = 4 张异值牌 x，共 n = 10 张；此时 r + 2 = 6 恰好装下全部 v</text>

  <!-- 空位（每段最多放几张 v） -->
  <rect x="43" y="96" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="63" y="117" text-anchor="middle" font-size="14" fill="#33506b" filter="url(#rough2)">v</text>
  <rect x="177" y="96" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="197" y="117" text-anchor="middle" font-size="14" fill="#33506b" filter="url(#rough2)">v</text>
  <rect x="313" y="96" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="333" y="117" text-anchor="middle" font-size="14" fill="#33506b" filter="url(#rough2)">v</text>
  <rect x="449" y="96" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="469" y="117" text-anchor="middle" font-size="14" fill="#33506b" filter="url(#rough2)">v</text>
  <rect x="610" y="96" width="40" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="630" y="117" text-anchor="middle" font-size="14" fill="#8a6320" filter="url(#rough2)">v</text>
  <rect x="656" y="96" width="40" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="676" y="117" text-anchor="middle" font-size="14" fill="#a14340" filter="url(#rough2)">v</text>

  <text x="63" y="147" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">≤1</text>
  <text x="197" y="147" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">≤1</text>
  <text x="333" y="147" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">≤1</text>
  <text x="469" y="147" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">≤1</text>
  <text x="653" y="147" text-anchor="middle" font-size="10.5" fill="#a14340" filter="url(#rough2)">末段特殊：≤2</text>
  <text x="616" y="278" text-anchor="middle" font-size="10.5" fill="#a14340" filter="url(#rough2)">（序列尾部）</text>

  <path d="M 63 128 L 63 190" stroke="#9bb0c4" stroke-width="1.1" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <path d="M 197 128 L 197 190" stroke="#9bb0c4" stroke-width="1.1" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <path d="M 333 128 L 333 190" stroke="#9bb0c4" stroke-width="1.1" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <path d="M 469 128 L 469 190" stroke="#9bb0c4" stroke-width="1.1" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <path d="M 638 130 Q 620 166 582 198" stroke="#c9a0a0" stroke-width="1.4" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 一排异值牌（隔板） -->
  <rect x="96" y="190" width="66" height="52" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="129" y="222" text-anchor="middle" font-size="16" fill="#3c5e2e" filter="url(#rough2)">x₁</text>
  <rect x="232" y="190" width="66" height="52" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="265" y="222" text-anchor="middle" font-size="16" fill="#3c5e2e" filter="url(#rough2)">x₂</text>
  <rect x="368" y="190" width="66" height="52" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="401" y="222" text-anchor="middle" font-size="16" fill="#3c5e2e" filter="url(#rough2)">x₃</text>
  <rect x="504" y="190" width="66" height="52" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="537" y="222" text-anchor="middle" font-size="16" fill="#3c5e2e" filter="url(#rough2)">x₄</text>

  <text x="129" y="262" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">异值牌</text>
  <text x="265" y="262" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">异值牌</text>
  <text x="401" y="262" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">异值牌</text>
  <text x="537" y="262" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">异值牌</text>

  <text x="653" y="205" text-anchor="middle" font-size="10.5" fill="#a14340" filter="url(#rough2)">这两张 v 相邻</text>
  <text x="653" y="220" text-anchor="middle" font-size="10.5" fill="#a14340" filter="url(#rough2)">触发的正是最后</text>
  <text x="653" y="235" text-anchor="middle" font-size="10.5" fill="#a14340" filter="url(#rough2)">一张 → 不吃亏</text>

  <!-- 容量合计 -->
  <rect x="76" y="288" width="608" height="106" rx="10" fill="#ffffff" stroke="#8c9bab" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="380" y="312" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">容量合计 = r 个「≤1」 + 末段 1 个「≤2」 = r + 2</text>
  <text x="380" y="336" text-anchor="middle" font-size="13" fill="#3c5e2e" filter="url(#rough2)">2f ≤ n + 2　⟺　f ≤ r + 2　⟹　全部 n 张牌都能打出伤害，答案 = Σa</text>
  <text x="380" y="360" text-anchor="middle" font-size="13" fill="#a14340" filter="url(#rough2)">2f &gt; n + 2　⟹　多出的 K = f − (r + 2) 张 v 必然落在激活点之后，伤害为 0</text>
  <text x="380" y="382" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">（注意：末段那一对是唯一免费的相邻相等，这就是 +2 而不是 +1 的来源）</text>
</svg>
