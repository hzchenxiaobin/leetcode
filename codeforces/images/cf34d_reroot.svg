<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="353"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrd" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="760" height="340" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">D：换根 = 把每条边的方向“翻转过来”</text>
  <path d="M 150 40 Q 380 45 610 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <text x="60" y="66" font-size="11" fill="#2f4a66" filter="url(#rough2)">以旧首都 2 为根（箭头 = 父亲指向儿子）</text>
  <text x="470" y="66" font-size="11" fill="#2f5223" filter="url(#rough2)">以新首都 4 为根</text>

  <!-- 左树：根 2 -->
  <line x1="190" y1="92" x2="124" y2="146" stroke="#446688" stroke-width="1.5" marker-end="url(#arrd)" filter="url(#rough2)"/>
  <line x1="190" y1="92" x2="256" y2="146" stroke="#446688" stroke-width="1.5" marker-end="url(#arrd)" filter="url(#rough2)"/>
  <line x1="120" y1="170" x2="86" y2="224" stroke="#446688" stroke-width="1.5" marker-end="url(#arrd)" filter="url(#rough2)"/>
  <line x1="260" y1="170" x2="232" y2="224" stroke="#446688" stroke-width="1.5" marker-end="url(#arrd)" filter="url(#rough2)"/>
  <line x1="230" y1="248" x2="188" y2="294" stroke="#446688" stroke-width="1.5" marker-end="url(#arrd)" filter="url(#rough2)"/>

  <circle cx="190" cy="80" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="85" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">2</text>
  <circle cx="120" cy="158" r="17" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="163" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <circle cx="260" cy="158" r="17" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="163" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">6</text>
  <circle cx="80" cy="236" r="17" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="80" y="241" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <circle cx="230" cy="236" r="17" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="230" y="241" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <circle cx="180" cy="306" r="17" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="311" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">3</text>

  <text x="46" y="330" font-size="10" fill="#2f4a66" filter="url(#rough2)">p = (6, 1, 2, 4, 2)：城市 1、3、4、5、6 的父亲</text>

  <line x1="380" y1="60" x2="380" y2="320" stroke="#ddd" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- 右树：根 4 -->
  <line x1="560" y1="92" x2="494" y2="146" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <line x1="560" y1="92" x2="626" y2="146" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <line x1="630" y1="170" x2="666" y2="224" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <line x1="630" y1="170" x2="596" y2="224" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <line x1="596" y1="248" x2="560" y2="294" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <circle cx="560" cy="80" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="560" y="85" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">4</text>
  <circle cx="490" cy="158" r="17" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="490" y="163" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <circle cx="630" cy="158" r="17" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="630" y="163" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <circle cx="670" cy="236" r="17" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="670" y="241" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">6</text>
  <circle cx="596" cy="236" r="17" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="596" y="241" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <circle cx="552" cy="306" r="17" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="552" y="311" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">3</text>

  <text x="420" y="330" font-size="10" fill="#2f5223" filter="url(#rough2)">新 p = (6, 4, 1, 4, 2)：4 号没有父亲</text>
</svg>
