<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="420" fill="#fafafa"/>

  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例一：飞贼沿着正方形飞一圈，哈利斜着俯冲拦截</text>
  <path d="M 76 44 Q 360 51 644 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 正方形轨迹（俯视 x-y 平面） -->
  <path d="M 140 320 L 140 80 L 380 80 L 380 320 L 140 320"
        stroke="#446688" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <!-- 方向箭头 -->
  <line x1="140" y1="280" x2="140" y2="212" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <line x1="240" y1="80" x2="320" y2="80" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <line x1="380" y1="140" x2="380" y2="200" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <line x1="320" y1="320" x2="220" y2="320" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 顶点标注 -->
  <circle cx="140" cy="320" r="4.5" fill="#2b2b2b" filter="url(#rough2)"/>
  <text x="126" y="344" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">(0,0,0) t=0</text>
  <circle cx="140" cy="80" r="4.5" fill="#2b2b2b" filter="url(#rough2)"/>
  <text x="126" y="70" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">(0,10,0) t=10</text>
  <circle cx="380" cy="80" r="4.5" fill="#2b2b2b" filter="url(#rough2)"/>
  <text x="418" y="70" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">(10,10,0) t=20</text>

  <!-- 拦截点 -->
  <circle cx="380" cy="212" r="6.5" fill="#b85450" filter="url(#rough2)"/>
  <text x="414" y="208" font-size="12.5" font-weight="bold" fill="#8a3b37" filter="url(#rough2)">拦截点 (10, 4.5, 0)</text>
  <text x="414" y="228" font-size="12.5" fill="#8a3b37" filter="url(#rough2)">t = 25.5，此时飞贼走了 25.5 米</text>

  <!-- 哈利 -->
  <circle cx="252" cy="176" r="6" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="252" y="162" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">哈利 (5, 5, 25)</text>
  <line x1="258" y1="181" x2="372" y2="207" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="268" y="252" font-size="12" fill="#2f5223" filter="url(#rough2)">直线距离 √(5² + 0.5² + 25²) = 25.5</text>
  <text x="268" y="274" font-size="12" fill="#2f5223" filter="url(#rough2)">恰好等于 vp·t = 1 × 25.5</text>

  <!-- 下方说明 -->
  <rect x="452" y="286" width="248" height="102" rx="9" fill="#fff7e2" stroke="#c99a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="576" y="310" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">为什么不是更早？</text>
  <text x="576" y="334" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">t &lt; 25.5 时飞贼离哈利更远</text>
  <text x="576" y="356" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">g(t) = |P−S(t)| − t &gt; 0</text>
  <text x="576" y="378" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">到 25.5 才刚好够得着</text>
</svg>
