<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="79"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="880" height="340" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">为什么右端点是 p + |b| − 1</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">「包含完整模式」的充要条件：起点 p ≥ i 且终点 p+|b| ≤ j</text>
  <g filter="url(#rough2)"><rect x="80" y="100" width="66" height="48" rx="3" fill="#ffffff" fill-opacity="0.9" stroke="#999999" stroke-width="1.2"/></g>
  <text x="113.0" y="132" text-anchor="middle" font-size="18" fill="#2b2b2b" filter="url(#rough2)">u</text>
  <text x="113.0" y="92" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)"><rect x="146" y="100" width="66" height="48" rx="3" fill="#ffffff" fill-opacity="0.9" stroke="#999999" stroke-width="1.2"/></g>
  <text x="179.0" y="132" text-anchor="middle" font-size="18" fill="#2b2b2b" filter="url(#rough2)">n</text>
  <text x="179.0" y="92" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="212" y="100" width="66" height="48" rx="3" fill="#ffffff" fill-opacity="0.9" stroke="#999999" stroke-width="1.2"/></g>
  <text x="245.0" y="132" text-anchor="middle" font-size="18" fill="#2b2b2b" filter="url(#rough2)">a</text>
  <text x="245.0" y="92" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="278" y="100" width="66" height="48" rx="3" fill="#ffffff" fill-opacity="0.9" stroke="#999999" stroke-width="1.2"/></g>
  <text x="311.0" y="132" text-anchor="middle" font-size="18" fill="#2b2b2b" filter="url(#rough2)">g</text>
  <text x="311.0" y="92" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="344" y="100" width="66" height="48" rx="3" fill="#ffffff" fill-opacity="0.9" stroke="#999999" stroke-width="1.2"/></g>
  <text x="377.0" y="132" text-anchor="middle" font-size="18" fill="#2b2b2b" filter="url(#rough2)">i</text>
  <text x="377.0" y="92" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><rect x="410" y="100" width="66" height="48" rx="3" fill="#ffffff" fill-opacity="0.9" stroke="#999999" stroke-width="1.2"/></g>
  <text x="443.0" y="132" text-anchor="middle" font-size="18" fill="#2b2b2b" filter="url(#rough2)">o</text>
  <text x="443.0" y="92" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">5</text>
  <g filter="url(#rough2)"><rect x="476" y="100" width="66" height="48" rx="3" fill="#ffffff" fill-opacity="0.9" stroke="#999999" stroke-width="1.2"/></g>
  <text x="509.0" y="132" text-anchor="middle" font-size="18" fill="#2b2b2b" filter="url(#rough2)">i</text>
  <text x="509.0" y="92" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">6</text>
  <g filter="url(#rough2)"><rect x="542" y="100" width="66" height="48" rx="3" fill="#ffffff" fill-opacity="0.9" stroke="#999999" stroke-width="1.2"/></g>
  <text x="575.0" y="132" text-anchor="middle" font-size="18" fill="#2b2b2b" filter="url(#rough2)">s</text>
  <text x="575.0" y="92" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">7</text>
  <g filter="url(#rough2)"><rect x="608" y="100" width="66" height="48" rx="3" fill="#ffffff" fill-opacity="0.9" stroke="#999999" stroke-width="1.2"/></g>
  <text x="641.0" y="132" text-anchor="middle" font-size="18" fill="#2b2b2b" filter="url(#rough2)">i</text>
  <text x="641.0" y="92" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">8</text>
  <g filter="url(#rough2)"><rect x="674" y="100" width="66" height="48" rx="3" fill="#ffffff" fill-opacity="0.9" stroke="#999999" stroke-width="1.2"/></g>
  <text x="707.0" y="132" text-anchor="middle" font-size="18" fill="#2b2b2b" filter="url(#rough2)">i</text>
  <text x="707.0" y="92" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">9</text>
  <g filter="url(#rough2)"><rect x="149" y="94" width="324" height="60" rx="4" fill="#d7ecd0" fill-opacity="0.35" stroke="#3d6b2f" stroke-width="1.8" stroke-dasharray="6 4"/></g>
  <text x="311.0" y="178" text-anchor="middle" font-size="12.5" fill="#3d6b2f" font-weight="bold" filter="url(#rough2)">窗口 [1, 6) = nagio：长度 5，合法</text>
  <g filter="url(#rough2)"><rect x="149" y="188" width="390" height="30" rx="4" fill="#f6d9d7" fill-opacity="0.45" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4"/></g>
  <text x="344" y="212" text-anchor="middle" font-size="12" fill="#8a2b28" filter="url(#rough2)">窗口 [1, 7) = nagioi：含完整 ioi（4,5,6）→ 非法</text>
  <text x="450" y="260" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">出现 (p, L) = (4, 3) 时，右端点 j 允许取到 p + L − 1 = 6，不能再往后</text>
  <text x="450" y="284" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">于是 j 的上界是 min(p + L − 1)，对起点 p ≥ i 取最小 —— 即后缀最小值</text>
</svg>
