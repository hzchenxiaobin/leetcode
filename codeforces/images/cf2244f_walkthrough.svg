<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="700" height="400" fill="#fafafa" filter="url(#rough2)"/>

  <text x="350" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">自底向上合并：区间 + 下降次数</text>

  <text x="20" y="52" font-size="11" fill="#4a7a3a" filter="url(#rough2)">样例 3：答案 YES</text>
  <rect x="20" y="60" width="328" height="228" rx="6" fill="#ffffff" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="20" y="60" width="328" height="38" rx="6" fill="#e8f0fe" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 20 60 L 348 60" stroke="#aaa" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 20 98 L 348 98" stroke="#aaa" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 20 136 L 348 136" stroke="#aaa" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 20 174 L 348 174" stroke="#aaa" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 20 212 L 348 212" stroke="#aaa" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 20 250 L 348 250" stroke="#aaa" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <text x="42.0" y="84" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">顶点</text>
  <text x="100.0" y="84" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">孩子</text>
  <text x="172.0" y="84" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">区间</text>
  <text x="234.0" y="84" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">下降</text>
  <text x="304.0" y="84" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">判定</text>
  <text x="42.0" y="122" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="100.0" y="122" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">—</text>
  <text x="172.0" y="122" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[2,2]</text>
  <text x="234.0" y="122" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">—</text>
  <text x="304.0" y="122" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">叶</text>
  <text x="42.0" y="160" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="100.0" y="160" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">—</text>
  <text x="172.0" y="160" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[1,1]</text>
  <text x="234.0" y="160" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">—</text>
  <text x="304.0" y="160" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">叶</text>
  <text x="42.0" y="198" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="100.0" y="198" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="172.0" y="198" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[2,2]</text>
  <text x="234.0" y="198" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="304.0" y="198" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">ok</text>
  <text x="42.0" y="236" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="100.0" y="236" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2,3</text>
  <text x="172.0" y="236" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[1,2]</text>
  <text x="234.0" y="236" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="304.0" y="236" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">ok 旋转</text>
  <text x="42.0" y="274" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="100.0" y="274" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="172.0" y="274" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[1,2]</text>
  <text x="234.0" y="274" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="304.0" y="274" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">YES</text>

  <text x="368" y="52" font-size="11" fill="#b85450" filter="url(#rough2)">样例 4：答案 NO</text>
  <rect x="368" y="60" width="324" height="190" rx="6" fill="#ffffff" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="368" y="60" width="324" height="38" rx="6" fill="#e8f0fe" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 368 60 L 692 60" stroke="#aaa" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 368 98 L 692 98" stroke="#aaa" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 368 136 L 692 136" stroke="#aaa" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 368 174 L 692 174" stroke="#aaa" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 368 212 L 692 212" stroke="#aaa" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <text x="390.0" y="84" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">顶点</text>
  <text x="454.0" y="84" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">孩子</text>
  <text x="530.0" y="84" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">区间</text>
  <text x="590.0" y="84" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">下降</text>
  <text x="654.0" y="84" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">判定</text>
  <text x="390.0" y="122" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="454.0" y="122" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">—</text>
  <text x="530.0" y="122" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[1,1]</text>
  <text x="590.0" y="122" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">—</text>
  <text x="654.0" y="122" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">叶</text>
  <text x="390.0" y="160" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="454.0" y="160" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">—</text>
  <text x="530.0" y="160" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[2,2]</text>
  <text x="590.0" y="160" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">—</text>
  <text x="654.0" y="160" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">叶</text>
  <text x="390.0" y="198" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="454.0" y="198" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">—</text>
  <text x="530.0" y="198" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[3,3]</text>
  <text x="590.0" y="198" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">—</text>
  <text x="654.0" y="198" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">叶</text>
  <text x="390.0" y="236" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="454.0" y="236" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2,3,4</text>
  <text x="530.0" y="236" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[1,3]</text>
  <text x="590.0" y="236" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="654.0" y="236" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">NO</text>

  <text x="368" y="272" font-size="10.5" fill="#b85450" filter="url(#rough2)">区间连成 [1,3]，但左端点</text>
  <text x="368" y="290" font-size="10.5" fill="#b85450" filter="url(#rough2)">(2,1,3) 有 2 次下降 ⇒ NO</text>

  <text x="20" y="318" font-size="10.5" fill="#333" filter="url(#rough2)">叶节点：区间 = [a_v, a_v]；内部节点：合并孩子区间</text>
  <text x="20" y="338" font-size="10.5" fill="#333" filter="url(#rough2)">① 区间长度必须等于子树叶子数（值域不能有洞）</text>
  <text x="20" y="358" font-size="10.5" fill="#333" filter="url(#rough2)">② 孩子左端点的循环序列：m ≥ 2 时下降次数必须恰为 1</text>
</svg>
