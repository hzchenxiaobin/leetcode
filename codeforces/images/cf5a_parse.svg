<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="330" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">解析一条 Send：在第一个冒号处切开</text>
  <path d="M 180 42 Q 380 48 580 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="380" y="66" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">样例 2 里的 Mike:Hi   I am here（正文中间有 3 个连续空格）</text>

  <rect x="120" y="96" width="88" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="208" y="96" width="22" height="44" rx="3" fill="#fff3cd" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="230" y="96" width="308" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>

  <text x="131" y="132" text-anchor="middle" font-size="19" fill="#2b2b2b" font-family="'Courier New',monospace" filter="url(#rough2)">M</text>
  <text x="153" y="132" text-anchor="middle" font-size="19" fill="#2b2b2b" font-family="'Courier New',monospace" filter="url(#rough2)">i</text>
  <text x="175" y="132" text-anchor="middle" font-size="19" fill="#2b2b2b" font-family="'Courier New',monospace" filter="url(#rough2)">k</text>
  <text x="197" y="132" text-anchor="middle" font-size="19" fill="#2b2b2b" font-family="'Courier New',monospace" filter="url(#rough2)">e</text>
  <text x="219" y="132" text-anchor="middle" font-size="19" fill="#2b2b2b" font-family="'Courier New',monospace" filter="url(#rough2)">:</text>
  <text x="241" y="132" text-anchor="middle" font-size="19" fill="#2b2b2b" font-family="'Courier New',monospace" filter="url(#rough2)">H</text>
  <text x="263" y="132" text-anchor="middle" font-size="19" fill="#2b2b2b" font-family="'Courier New',monospace" filter="url(#rough2)">i</text>
  <text x="285" y="126" text-anchor="middle" font-size="16" fill="#b0855a" filter="url(#rough2)">·</text>
  <text x="307" y="126" text-anchor="middle" font-size="16" fill="#b0855a" filter="url(#rough2)">·</text>
  <text x="329" y="126" text-anchor="middle" font-size="16" fill="#b0855a" filter="url(#rough2)">·</text>
  <text x="351" y="132" text-anchor="middle" font-size="19" fill="#2b2b2b" font-family="'Courier New',monospace" filter="url(#rough2)">I</text>
  <text x="373" y="126" text-anchor="middle" font-size="16" fill="#b0855a" filter="url(#rough2)">·</text>
  <text x="395" y="132" text-anchor="middle" font-size="19" fill="#2b2b2b" font-family="'Courier New',monospace" filter="url(#rough2)">a</text>
  <text x="417" y="132" text-anchor="middle" font-size="19" fill="#2b2b2b" font-family="'Courier New',monospace" filter="url(#rough2)">m</text>
  <text x="439" y="126" text-anchor="middle" font-size="16" fill="#b0855a" filter="url(#rough2)">·</text>
  <text x="461" y="132" text-anchor="middle" font-size="19" fill="#2b2b2b" font-family="'Courier New',monospace" filter="url(#rough2)">h</text>
  <text x="483" y="132" text-anchor="middle" font-size="19" fill="#2b2b2b" font-family="'Courier New',monospace" filter="url(#rough2)">e</text>
  <text x="505" y="132" text-anchor="middle" font-size="19" fill="#2b2b2b" font-family="'Courier New',monospace" filter="url(#rough2)">r</text>
  <text x="527" y="132" text-anchor="middle" font-size="19" fill="#2b2b2b" font-family="'Courier New',monospace" filter="url(#rough2)">e</text>

  <line x1="230" y1="156" x2="538" y2="156" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="230" y1="156" x2="230" y2="148" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="538" y1="156" x2="538" y2="148" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="384" y="176" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">message_text：长度 14（每个空格各算 1 字节）</text>

  <rect x="566" y="96" width="176" height="72" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="578" y="120" font-size="11.5" fill="#8a6015" filter="url(#rough2)">名字只含字母和数字</text>
  <text x="578" y="140" font-size="11.5" fill="#8a6015" filter="url(#rough2)">所以第一个冒号</text>
  <text x="578" y="160" font-size="11.5" fill="#8a6015" filter="url(#rough2)">一定是分隔符</text>

  <text x="100" y="212" font-size="12" fill="#2b2b2b" filter="url(#rough2)">① 名字是字母和数字的非空串，冒号只会出现一次，切分无歧义；</text>
  <text x="100" y="236" font-size="12" fill="#2b2b2b" filter="url(#rough2)">② 正文可以包含空格，连续空格每个都算 1 字节，长度就是字符个数；</text>
  <text x="100" y="260" font-size="12" fill="#2b2b2b" filter="url(#rough2)">③ 正文可以为空：Mike: 是合法命令，长度 0，本条贡献 0 字节。</text>

  <rect x="100" y="278" width="400" height="38" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="112" y="302" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">流量增量 = 正文长度 × 当前在线人数</text>
</svg>
