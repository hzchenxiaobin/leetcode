<svg xmlns="http://www.w3.org/2000/svg" width="880" height="600" viewBox="0 0 880 600"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="63"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr8b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arr8r" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="880" height="600" fill="#fafafa"/>

  <text x="440" y="34" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">判定流程：走一步，查两次，两次都干净才继续</text>
  <path d="M 110 46 Q 440 52 770 46" stroke="#2b2b2b" stroke-width="1.2" fill="none"
        filter="url(#rough2)"/>

  <rect x="60" y="64" width="470" height="58" rx="8" fill="#eef1f7" stroke="#7a8ca6"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="88" font-size="12.5" fill="#33445c" filter="url(#rough2)">读入路径；已访问集合 = { 起点 (0,0) }</text>
  <text x="80" y="108" font-size="12" fill="#44597a" filter="url(#rough2)">当前位置 = 起点，按记录一条条往下走</text>

  <rect x="60" y="150" width="470" height="48" rx="8" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="180" font-size="13" fill="#23405c" filter="url(#rough2)">取当前指令，算出相邻格 v</text>

  <rect x="60" y="212" width="470" height="48" rx="8" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="242" font-size="13" fill="#23405c" filter="url(#rough2)">① v 已经在已访问集合里？</text>
  <path d="M 532 236 L 554 236" stroke="#b85450" stroke-width="1.7" fill="none"
        marker-end="url(#arr8r)" filter="url(#rough2)"/>
  <text x="543" y="228" text-anchor="middle" font-size="11" fill="#8c3b37" filter="url(#rough2)">是</text>
  <rect x="560" y="212" width="280" height="48" rx="8" fill="#fde8e8" stroke="#b85450"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="700" y="242" text-anchor="middle" font-size="13" fill="#8c3b37"
        filter="url(#rough2)">BUG（重复经过）</text>

  <rect x="60" y="274" width="470" height="48" rx="8" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="304" font-size="13" fill="#23405c" filter="url(#rough2)">② v 的四邻里，除上一步外还有旧格？</text>
  <path d="M 532 298 L 554 298" stroke="#b85450" stroke-width="1.7" fill="none"
        marker-end="url(#arr8r)" filter="url(#rough2)"/>
  <text x="543" y="290" text-anchor="middle" font-size="11" fill="#8c3b37" filter="url(#rough2)">是</text>
  <rect x="560" y="274" width="280" height="48" rx="8" fill="#fde8e8" stroke="#b85450"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="700" y="304" text-anchor="middle" font-size="13" fill="#8c3b37"
        filter="url(#rough2)">BUG（存在捷径）</text>

  <rect x="60" y="336" width="470" height="48" rx="8" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="366" font-size="13" fill="#23405c" filter="url(#rough2)">把 v 标记为已访问，当前位置 ← v</text>

  <rect x="60" y="398" width="470" height="48" rx="8" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="428" font-size="13" fill="#23405c" filter="url(#rough2)">③ 还有下一条指令？</text>
  <path d="M 532 422 L 554 422" stroke="#4a7a3a" stroke-width="1.7" fill="none"
        marker-end="url(#arr8b)" filter="url(#rough2)"/>
  <text x="543" y="414" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">否</text>
  <rect x="560" y="398" width="280" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="700" y="428" text-anchor="middle" font-size="13" fill="#2f5223"
        filter="url(#rough2)">OK（地图存在）</text>

  <!-- 主干向下箭头 -->
  <path d="M 295 122 L 295 146" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr8b)" filter="url(#rough2)"/>
  <path d="M 295 198 L 295 208" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr8b)" filter="url(#rough2)"/>
  <path d="M 295 260 L 295 270" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr8b)" filter="url(#rough2)"/>
  <path d="M 295 322 L 295 332" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr8b)" filter="url(#rough2)"/>
  <path d="M 295 384 L 295 394" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr8b)" filter="url(#rough2)"/>

  <text x="306" y="270" font-size="11" fill="#7a8ca6" filter="url(#rough2)">否</text>
  <text x="306" y="332" font-size="11" fill="#7a8ca6" filter="url(#rough2)">否</text>

  <!-- 回到取指令的回边 -->
  <path d="M 60 422 L 34 422 L 34 174 L 54 174" stroke="#446688" stroke-width="1.6" fill="none"
        marker-end="url(#arr8b)" filter="url(#rough2)"/>
  <text x="24" y="416" text-anchor="end" font-size="11" fill="#2f5223" filter="url(#rough2)">是</text>

  <text x="440" y="486" text-anchor="middle" font-size="12" fill="#444"
        filter="url(#rough2)">为什么这样就够：把所有没走过的格子都设成障碍，记录路径就成了地图上从起点到终点的唯一通路，长度自然最短。</text>
  <text x="440" y="510" text-anchor="middle" font-size="12" fill="#444"
        filter="url(#rough2)">反过来，重复经过或与旧格相邻，都会在任何地图里给出更短的走法（走过的格子必须是空地），只能是 BUG。</text>
  <text x="440" y="548" text-anchor="middle" font-size="11.5" fill="#8a8a8a"
        filter="url(#rough2)">注意：② 里的「旧格」要排除上一步——上一步与本格相邻是必然的，不能因此判 BUG。</text>
  <text x="440" y="572" text-anchor="middle" font-size="11.5" fill="#8a8a8a"
        filter="url(#rough2)">路径长度不超过 100，坐标范围只有 [-100,100]，用集合或 201×201 的数组都够。</text>
</svg>
