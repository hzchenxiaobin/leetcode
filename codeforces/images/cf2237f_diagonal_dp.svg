<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="420" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">对角线 c = bₚ − p：窗口每步整体左移一格</text>
  <text x="360" y="54" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">位置 p 的合法对角线恰好是 c ∈ [1−p, m−p]，共 m 条</text>

  <rect x="52" y="72" width="80" height="76" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="140" y="72" width="80" height="76" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="228" y="72" width="80" height="76" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="316" y="72" width="80" height="76" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="404" y="72" width="80" height="76" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="556" y="72" width="80" height="76" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" filter="url(#rough2)"/>

  <text x="92" y="94" text-anchor="middle" font-size="13" fill="#2f5a24" filter="url(#rough2)">1−p</text>
  <text x="92" y="116" text-anchor="middle" font-size="16" fill="#2f5a24" filter="url(#rough2)">V</text>
  <text x="92" y="138" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">新：bₚ=1</text>

  <text x="180" y="94" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">2−p</text>
  <text x="180" y="120" text-anchor="middle" font-size="15" fill="#33506b" filter="url(#rough2)">9</text>

  <text x="268" y="94" text-anchor="middle" font-size="12.5" fill="#8a6d2f" filter="url(#rough2)">c* = aₚ−p</text>
  <text x="268" y="120" text-anchor="middle" font-size="15" fill="#8a6d2f" filter="url(#rough2)">9 + 1</text>
  <text x="268" y="140" text-anchor="middle" font-size="11.5" fill="#d6a040" filter="url(#rough2)">命中 aₚ</text>

  <text x="356" y="94" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">…</text>
  <text x="356" y="120" text-anchor="middle" font-size="15" fill="#33506b" filter="url(#rough2)">7</text>

  <text x="444" y="94" text-anchor="middle" font-size="12.5" fill="#33506b" filter="url(#rough2)">m−p</text>
  <text x="444" y="120" text-anchor="middle" font-size="15" fill="#33506b" filter="url(#rough2)">6</text>

  <text x="596" y="94" text-anchor="middle" font-size="12" fill="#8a3b38" filter="url(#rough2)">m−p+1</text>
  <text x="596" y="118" text-anchor="middle" font-size="14" fill="#8a3b38" filter="url(#rough2)">= K</text>
  <text x="596" y="140" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">删：bₚ₋₁=m</text>

  <path d="M 52 162 L 484 162" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="268" y="178" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">位置 p 的窗口（m 条对角线）</text>
  <path d="M 596 152 Q 540 168 500 164" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="46" y="196" width="628" height="38" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="62" y="221" font-size="13.5" fill="#8a3b38" filter="url(#rough2)">① 删除最右：上一位置 bₚ₋₁ = m 的那条对角线离开窗口，它的值就是 K</text>

  <rect x="46" y="242" width="628" height="38" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="62" y="267" font-size="13.5" fill="#33506b" filter="url(#rough2)">② 全局 chmax(K)：存活的对角线 V ← max(V, K)，用懒标记 floor 做到摊还 O(1)</text>

  <rect x="46" y="288" width="628" height="38" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="62" y="313" font-size="13.5" fill="#2f5a24" filter="url(#rough2)">③ 插入最左：新对角线对应 bₚ = 1，值取上一位置的全局最大值 M</text>

  <rect x="46" y="334" width="628" height="38" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="62" y="359" font-size="13.5" fill="#8a6d2f" filter="url(#rough2)">④ 单点 +1：c* = aₚ − p 那一条对角线加一（它代表“bₚ 恰好等于 aₚ”）</text>

  <text x="360" y="400" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">答案 = n − 位置 n 处对角线 c = m−n 的值</text>
</svg>
