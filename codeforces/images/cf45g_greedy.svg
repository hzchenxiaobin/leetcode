<svg xmlns="http://www.w3.org/2000/svg" width="760" height="290" viewBox="0 0 760 290"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="293"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="290" fill="#fafafa"/>
  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">贪心凑和：从大到小取不超过剩余的数</text>
  <path d="M 140 40 Q 380 46 620 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60" y="80" width="90" height="42" rx="8" fill="#eef4fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="105" y="107" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">8</text>
  <rect x="170" y="80" width="90" height="42" rx="8" fill="#eef4fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="215" y="107" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">7</text>
  <rect x="280" y="80" width="90" height="42" rx="8" fill="#eef4fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="325" y="107" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">6</text>
  <rect x="390" y="80" width="90" height="42" rx="8" fill="#d9ecd4" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="435" y="107" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">5</text>
  <text x="500" y="107" font-size="12" fill="#2b2b2b" filter="url(#rough2)">← 取 5，剩余 0</text>
  <text x="60" y="170" font-size="12" fill="#2b2b2b" filter="url(#rough2)">n=8，S=36，选 p=5（5 与 31 都是质数）：8、7、6 都大于剩余 5，跳过；5 恰好取走。</text>
  <text x="60" y="200" font-size="12" fill="#2b2b2b" filter="url(#rough2)">颜色 1 = {5}（和 5），颜色 2 = 其余（和 31），两种颜色都是质数和。</text>
  <text x="60" y="244" font-size="11.5" fill="#8a6015" filter="url(#rough2)">连续整数集 1..n 的子集和可以取遍 0..S，所以任意 p 都能凑出。</text>

</svg>
