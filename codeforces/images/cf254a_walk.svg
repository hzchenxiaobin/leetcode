<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="320" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1：n=3 的配对结果</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">按值的出现顺序配对，输出任意顺序都可以（本题是 special judge）</text>
  <text x="150" y="130" text-anchor="end" font-size="13" fill="#555555" filter="url(#rough2)">值 10</text>
  <g filter="url(#rough2)"><rect x="180" y="100" width="70" height="44" rx="4" fill="#cfe0f0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="215.0" y="126.68" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">牌 3</text>
  <g filter="url(#rough2)"><rect x="270" y="100" width="70" height="44" rx="4" fill="#cfe0f0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="305.0" y="126.68" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">牌 6</text>
  <text x="360" y="130" text-anchor="start" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">→ 一对</text>
  <text x="150" y="192" text-anchor="end" font-size="13" fill="#555555" filter="url(#rough2)">值 30</text>
  <g filter="url(#rough2)"><rect x="180" y="162" width="70" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="215.0" y="188.68" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">牌 2</text>
  <g filter="url(#rough2)"><rect x="270" y="162" width="70" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="305.0" y="188.68" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">牌 4</text>
  <text x="360" y="192" text-anchor="start" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">→ 一对</text>
  <text x="150" y="254" text-anchor="end" font-size="13" fill="#555555" filter="url(#rough2)">值 20</text>
  <g filter="url(#rough2)"><rect x="180" y="224" width="70" height="44" rx="4" fill="#f6d9d7" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="215.0" y="250.68" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">牌 1</text>
  <g filter="url(#rough2)"><rect x="270" y="224" width="70" height="44" rx="4" fill="#f6d9d7" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="305.0" y="250.68" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">牌 5</text>
  <text x="360" y="254" text-anchor="start" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">→ 一对</text>
  <text x="440" y="300" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">每个值出现 2 次，共 n=3 对；总操作数 0（只分组不改牌）</text>
</svg>
