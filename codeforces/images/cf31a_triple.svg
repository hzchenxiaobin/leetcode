<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="211"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="330" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">A：找三条不同形态的蠕虫，让“最长的一条 = 另外两条之和”</text>
  <path d="M 110 42 Q 380 47 650 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <text x="60" y="82" font-size="11.5" fill="#777" filter="url(#rough2)">三条蠕虫按长度排成一条线段：</text>

  <rect x="60" y="96" width="330" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="225" y="116" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">a[j] = 2</text>
  <rect x="60" y="132" width="165" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="142" y="152" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">a[k] = 1</text>
  <rect x="231" y="132" width="159" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="152" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">a[i] = 3</text>

  <line x1="60" y1="178" x2="390" y2="178" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="225" y="196" text-anchor="middle" font-size="11" fill="#8c3a36" filter="url(#rough2)">红框那一段的总长 = 下面两段之和</text>

  <rect x="430" y="76" width="300" height="120" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="442" y="100" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">规模与做法</text>
  <text x="442" y="124" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">n ≤ 100，长度 ≤ 1000：</text>
  <text x="442" y="146" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">直接三重循环枚举 (i,j,k) 也就 10^6 次</text>
  <text x="442" y="168" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">找到就输出，找不到输出 -1</text>
  <text x="442" y="188" font-size="10" fill="#8c3a36" filter="url(#rough2)">注意 i、j、k 必须是三个不同的下标</text>

  <text x="60" y="232" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">枚举顺序（k &gt; j，避免重复）：</text>
  <rect x="60" y="246" width="640" height="64" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="74" y="270" font-size="11" fill="#2f4a66" font-family="'Courier New',monospace" filter="url(#rough2)">for i in 1..n: for j in 1..n: for k in j+1..n:</text>
  <text x="74" y="294" font-size="11" fill="#2f4a66" font-family="'Courier New',monospace" filter="url(#rough2)">    if i!=j and i!=k and a[i]==a[j]+a[k]: print(i,j,k); exit</text>

  <text x="60" y="322" font-size="10.5" fill="#777" filter="url(#rough2)">题面允许 a[j] = a[k]（两条蠕虫等长），但它们的下标必须不同。</text>
</svg>
