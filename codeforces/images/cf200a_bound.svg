<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="350" fill="#fafafa"/>
  <text x="360.0" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">200A：用下界跳过必然为空的圈</text>
  <path d="M 144.00 46 Q 360.0 52 576.00 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="72" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">关键加速：dist 只增不减（座位只会被占），所以“上次在该格得到的答案距离”是这次的有效下界。</text>
  <text x="60" y="92" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">又由 |dist(u) − dist(v)| ≤ 曼哈顿距离(u,v)，四邻居还能再给一个下界。</text>
  <rect x="60" y="116" width="330" height="64" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="134" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">D0 = max( lb[x][y],</text>
  <text x="74" y="156" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">        lb[x-1][y]-1, lb[x+1][y]-1,</text>
  <text x="74" y="178" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">        lb[x][y-1]-1, lb[x][y+1]-1 )</text>
  <text x="60" y="208" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">从 d = D0 开始扫描，省掉了大量必然为空的圈。</text>
  <rect x="420" y="120" width="34" height="34" fill="#ffffff" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="437.0" y="141.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <rect x="454" y="120" width="34" height="34" fill="#ffffff" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="471.0" y="141.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <rect x="488" y="120" width="34" height="34" fill="#ffffff" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="505.0" y="141.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <rect x="420" y="154" width="34" height="34" fill="#ffffff" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="437.0" y="175.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <rect x="454" y="154" width="34" height="34" fill="#f6e3a8" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="471.0" y="175.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <rect x="488" y="154" width="34" height="34" fill="#ffffff" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="505.0" y="175.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <rect x="420" y="188" width="34" height="34" fill="#ffffff" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="437.0" y="209.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <rect x="454" y="188" width="34" height="34" fill="#ffffff" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="471.0" y="209.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <rect x="488" y="188" width="34" height="34" fill="#ffffff" stroke="#555" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="505.0" y="209.0" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <text x="532" y="171.0" text-anchor="start" font-size="10" fill="#8a6015" filter="url(#rough2)">lb 的局部形状</text>
  <text x="471.0" y="240" text-anchor="middle" font-size="10" fill="#33506e" filter="url(#rough2)">中心 lb=3 ⇒ 四邻居给 2 ⇒ D0 = 3</text>
  <rect x="60" y="236" width="600" height="86" rx="9" fill="#fdeef1" stroke="#c0708a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="254" text-anchor="start" font-size="11" fill="#8a3a52" filter="url(#rough2)">正确性：dist(u) ≥ lb(u) 恒成立（lb 只会被真实答案抬高），</text>
  <text x="74" y="276" text-anchor="start" font-size="11" fill="#8a3a52" filter="url(#rough2)">而 dist(x,y) ≥ dist(u) − 曼哈顿(x,u) ⇒ D0 不会超过真实答案；</text>
  <text x="74" y="298" text-anchor="start" font-size="11" fill="#8a3a52" filter="url(#rough2)">所以从 D0 起步不会漏掉答案，也不会把更大的解当成更优。</text>
</svg>
