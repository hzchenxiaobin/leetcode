<svg xmlns="http://www.w3.org/2000/svg" width="880" height="290" viewBox="0 0 880 290"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="290" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">DFS 路径上遇到"已在栈中的祖先"就得到一个环</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">环长 = 当前路径长度 − 祖先在路径中的位置</text>
  <g filter="url(#rough2)"><rect x="160" y="120" width="70" height="46" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="195.0" y="147.68" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">v1</text>
  <g filter="url(#rough2)"><rect x="250" y="120" width="70" height="46" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="285.0" y="147.68" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">v2</text>
  <g filter="url(#rough2)"><rect x="340" y="120" width="70" height="46" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="375.0" y="147.68" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">v3</text>
  <g filter="url(#rough2)"><rect x="430" y="120" width="70" height="46" rx="4" fill="#f6e3c4" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="465.0" y="147.68" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">v</text>
  <line x1="195" y1="170" x2="195" y2="215" stroke="#b05a5a" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M160,120 C160,60 430,60 465,120" fill="none" stroke="#b05a5a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="50" text-anchor="middle" font-size="12" fill="#b05a5a" filter="url(#rough2)">回边（v 连到 v1）</text>
  <text x="300" y="262" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">环 = 栈中 v1..v；环长 = 深度差 + 1</text>
</svg>
