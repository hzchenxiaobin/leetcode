<svg xmlns="http://www.w3.org/2000/svg" width="840" height="470" viewBox="0 0 840 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="840" height="470" fill="#fafafa"/>
  <text x="420.0" y="32" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">闭式状态 + 双指针：O(n) 求出 n + 1 个答案</text>
  <path d="M 109 43 Q 420.0 50 731 43" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="420.0" y="64" text-anchor="middle" font-size="12" fill="#66788c" filter="url(#rough2)">已做 L 次冒泡、R 次逆冒泡后，谁是「封顶的 m」有闭式，只需维护两个指针</text>
  <rect x="40" y="78" width="760" height="84" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="420" y="108" text-anchor="middle" font-size="13.5" fill="#2f4a66" filter="url(#rough2)">S(L, R) = i·m + Σ min(rj + R, m)　（j = i+1 … k，i = min(L, k)）</text>
  <text x="420" y="140" text-anchor="middle" font-size="12" fill="#66788c" filter="url(#rough2)">答案 = k·m − S(L, R)：前 i 个位置是弹到末尾的 1（值 m），其余每个 1 被抬高 R、封顶 m</text>
  <text x="420" y="182" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">r 非降 ⇒「已封顶」永远是一段后缀，起点 J 只随 R 增大而左移</text>
  <text x="156" y="220" text-anchor="middle" font-size="10.5" fill="#66788c" filter="url(#rough2)">r1</text>
  <rect x="128" y="226" width="56" height="40" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" />
  <text x="156.0" y="252.48" text-anchor="middle" font-size="18" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="230" y="220" text-anchor="middle" font-size="10.5" fill="#66788c" filter="url(#rough2)">r2</text>
  <rect x="202" y="226" width="56" height="40" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" />
  <text x="230.0" y="252.48" text-anchor="middle" font-size="18" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="304" y="220" text-anchor="middle" font-size="10.5" fill="#66788c" filter="url(#rough2)">r3</text>
  <rect x="276" y="226" width="56" height="40" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" />
  <text x="304.0" y="252.48" text-anchor="middle" font-size="18" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="378" y="220" text-anchor="middle" font-size="10.5" fill="#66788c" filter="url(#rough2)">r4</text>
  <rect x="350" y="226" width="56" height="40" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)" />
  <text x="378.0" y="252.48" text-anchor="middle" font-size="18" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="452" y="220" text-anchor="middle" font-size="10.5" fill="#66788c" filter="url(#rough2)">r5</text>
  <rect x="424" y="226" width="56" height="40" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)" />
  <text x="452.0" y="252.48" text-anchor="middle" font-size="18" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="526" y="220" text-anchor="middle" font-size="10.5" fill="#66788c" filter="url(#rough2)">r6</text>
  <rect x="498" y="226" width="56" height="40" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)" />
  <text x="526.0" y="252.48" text-anchor="middle" font-size="18" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <path d="M 350 208 L 350 300" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" fill="none" filter="url(#rough2)"/>
  <text x="358" y="204" text-anchor="start" font-size="13" fill="#a14340" font-weight="bold" filter="url(#rough2)">J</text>
  <text x="156" y="288" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">→ 1</text>
  <text x="230" y="288" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">→ 2</text>
  <text x="304" y="288" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">→ 2</text>
  <text x="378" y="288" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">→ 3</text>
  <text x="452" y="288" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">→ 3</text>
  <text x="526" y="288" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">→ 3</text>
  <text x="250" y="318" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">j &lt; J：贡献 rj + R（尚未封顶）</text>
  <text x="600" y="318" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">j ≥ J：贡献 m（已封顶）</text>
  <text x="420" y="342" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">m = 3, R = 1 ⇒ 阈值 m − R = 2 ⇒ J = 第 4 个</text>
  <rect x="36" y="362" width="200" height="60" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="136" y="388" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">读入 a 与 s：构造 r</text>
  <text x="136" y="408" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">前缀和 pre，total = k·m</text>
  <rect x="286" y="362" width="210" height="60" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="391" y="388" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">输出 total − S</text>
  <text x="391" y="408" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">推进 L / R，J 与 i 同步挪</text>
  <rect x="546" y="362" width="258" height="60" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="675" y="388" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">s_i = 1 就 L++，否则 R++</text>
  <text x="675" y="408" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">每步 O(1)：指针只单向移动</text>
  <path d="M 240 392 L 282 392" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 500 392 L 542 392" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 675 424 Q 675 448 500 448 Q 400 448 391 426" stroke="#d6a040" stroke-width="1.7" fill="none" marker-end="url(#arr2)" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="534" y="442" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">重复 n 次（每一步都要输出一次）</text>
</svg>
