<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="463"/>
    <feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></defs>
  <rect width="700" height="300" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">290C：照着 LOLCODE 程序翻译，其实是"最大前缀平均"</text>
  <path d="M 100 40 Q 350 46 600 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="96" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="12.5" fill="#22314a" filter="url(#rough2)">程序：FOO = 前缀和，BAR = 个数；若 FOO*QUZ ≥ BAR*BAZ（即 FOO/BAR ≥ 当前最佳比）</text>
  <text x="76" y="106" font-size="12.5" fill="#22314a" filter="url(#rough2)">就令 BAZ = FOO、QUZ = BAR。最后输出 BAZ/QUZ。</text>
  <text x="76" y="130" font-size="12.5" fill="#22314a" filter="url(#rough2)">⇒ 输出 = max over 前缀 的平均值 ✓</text>
  <text x="76" y="150" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">（BIGGR OF x AN y 取较大者；BOTH SAEM 判相等。）</text>
  <g filter="url(#rough2)"><rect x="60" y="168" width="580" height="66" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="192" font-size="12.5" fill="#2f5223" filter="url(#rough2)">输入：第一行是 TUX（数字个数），随后 TUX 个值。</text>
  <text x="76" y="216" font-size="12.5" fill="#2f5223" filter="url(#rough2)">样例：3 / 0 / 1 / 1 ⇒ 前缀平均 0、0.5、0.6667 ⇒ 输出 0.666667 ✓</text>
  <g filter="url(#rough2)"><rect x="60" y="248" width="580" height="36" rx="8" fill="#fbeeee" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="76" y="271" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">注意：比较必须在"整数"上做（FOO*QUZ 与 BAR*BAZ），用浮点比会掉精度。</text>
</svg>
