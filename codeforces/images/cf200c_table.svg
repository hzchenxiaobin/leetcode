<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="330" fill="#fafafa"/>
  <text x="360.0" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">200C：样例一的最终积分榜（按 积分→净胜球→进球→名字 排序）</text>
  <path d="M 144.00 46 Q 360.0 52 576.00 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="72" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">样例一：最后一场是 BERLAND vs CERLAND，取 6:0 后积分榜如下</text>
  <text x="70" y="100" text-anchor="start" font-size="11" fill="#33506e" font-weight="bold" filter="url(#rough2)">名次</text>
  <text x="120" y="100" text-anchor="start" font-size="11" fill="#33506e" font-weight="bold" filter="url(#rough2)">球队</text>
  <text x="330" y="100" text-anchor="start" font-size="11" fill="#33506e" font-weight="bold" filter="url(#rough2)">积分</text>
  <text x="420" y="100" text-anchor="start" font-size="11" fill="#33506e" font-weight="bold" filter="url(#rough2)">净胜球</text>
  <text x="540" y="100" text-anchor="start" font-size="11" fill="#33506e" font-weight="bold" filter="url(#rough2)">进球</text>
  <rect x="60" y="112" width="600" height="34" rx="5" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="134" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="120" y="134" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">AERLAND</text>
  <text x="330" y="134" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">9</text>
  <text x="420" y="134" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">+4</text>
  <text x="540" y="134" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <rect x="60" y="152" width="600" height="34" rx="5" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="174" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="120" y="174" text-anchor="start" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">BERLAND</text>
  <text x="330" y="174" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="420" y="174" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="540" y="174" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <rect x="60" y="192" width="600" height="34" rx="5" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="214" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="120" y="214" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">DERLAND</text>
  <text x="330" y="214" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="420" y="214" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="540" y="214" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <rect x="60" y="232" width="600" height="34" rx="5" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="254" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="120" y="254" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">CERLAND</text>
  <text x="330" y="254" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="420" y="254" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">-4</text>
  <text x="540" y="254" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="60" y="290" text-anchor="start" font-size="10.5" fill="#8a3a52" filter="url(#rough2)">BERLAND 与 DERLAND 同为 3 分、净胜球 0，靠“进球数 6 > 5”压过对手 ⇒ 第 2 名。</text>
</svg>
