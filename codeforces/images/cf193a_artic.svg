  <rect x="144.0" y="140.0" width="30.0" height="28.0" rx="4" fill="#fdf0ef" stroke="#b85450" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="144.0" y="170.0" width="30.0" height="28.0" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="176.0" y="140.0" width="30.0" height="28.0" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="160.0" y="240.0" text-anchor="middle" font-size="10.8" font-weight="bold" fill="#2f5b34" filter="url(#rough2)">删 (2,2) 就断 ⇒ 1</text>
  <rect x="330.0" y="70.0" width="130.0" height="120.0" rx="6" fill="#fafafa" stroke="#6b6b6b" stroke-width="1.0" filter="url(#rough2)"/>
  <rect x="350.0" y="90.0" width="38.0" height="38.0" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="390.0" y="90.0" width="38.0" height="38.0" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="350.0" y="130.0" width="38.0" height="38.0" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="390.0" y="130.0" width="38.0" height="38.0" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="395.0" y="240.0" text-anchor="middle" font-size="10.8" font-weight="bold" fill="#8a6015" filter="url(#rough2)">没有割点，但删两个对角 ⇒ 2</text>
  <rect x="560.0" y="70.0" width="140.0" height="60.0" rx="6" fill="#fafafa" stroke="#6b6b6b" stroke-width="1.0" filter="url(#rough2)"/>
  <rect x="590.0" y="90.0" width="38.0" height="38.0" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="630.0" y="90.0" width="38.0" height="38.0" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="630.0" y="160.0" text-anchor="middle" font-size="10.8" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">≤2 格：怎么删都不会断开 ⇒ -1</text>
  <rect x="60.0" y="260.0" width="660.0" height="100.0" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="284.0" text-anchor="start" font-size="11.2" fill="#8a6015" filter="url(#rough2)">判定：|A| ≤ 2 ⇒ -1；否则尝试删每个格子做连通性检查，能断开 ⇒ 1；都不行 ⇒ 2。</text>
  <text x="74.0" y="308.0" text-anchor="start" font-size="11.2" fill="#8a6015" filter="url(#rough2)">为什么 2 一定够：取 x+y 最小（或最大）的格子，它只有 ≤2 个邻居，删掉这些邻居就把它孤立出来。</text>
  <text x="74.0" y="330.0" text-anchor="start" font-size="11.2" fill="#8a6015" filter="url(#rough2)">n,m ≤ 50 ⇒ 最多 2500 个格子，每次 BFS 2500 ⇒ 6×10⁶，完全够。</text>
