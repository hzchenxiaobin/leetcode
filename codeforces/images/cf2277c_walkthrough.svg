<svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 0 780 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="19"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="780" height="420" fill="#fafafa"/>

  <text x="390" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">走查：样例 3（n = 7）与样例 4（n = 10）的逐次判定</text>
  <path d="M 40 40 Q 390 47 740 40" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <rect x="36" y="58" width="708" height="286" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 46 100 Q 390 104 734 100" stroke="#446688" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <text x="80" y="86" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">样例</text>
  <text x="190" y="86" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">v_i</text>
  <text x="285" y="86" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">g[v_i]</text>
  <text x="385" y="86" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">dist</text>
  <text x="475" y="86" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">1+dist</text>
  <text x="565" y="86" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">dep[n]</text>
  <text x="680" y="86" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">取舍</text>

  <text x="80" y="128" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">样例3 (n=7)</text>
  <text x="190" y="128" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">6</text>
  <text x="285" y="128" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">1</text>
  <text x="385" y="128" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">—</text>
  <text x="475" y="128" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">—</text>
  <text x="565" y="128" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">3</text>
  <text x="680" y="128" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">lca=1 跳过</text>

  <rect x="44" y="146" width="692" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="80" y="166" text-anchor="middle" font-size="11.5" fill="#39592b" filter="url(#rough2)">样例3 (n=7)</text>
  <text x="190" y="166" text-anchor="middle" font-size="11.5" fill="#39592b" filter="url(#rough2)">5</text>
  <text x="285" y="166" text-anchor="middle" font-size="11.5" fill="#39592b" filter="url(#rough2)">2</text>
  <text x="385" y="166" text-anchor="middle" font-size="11.5" fill="#39592b" filter="url(#rough2)">4</text>
  <text x="475" y="166" text-anchor="middle" font-size="12" font-weight="bold" fill="#39592b" filter="url(#rough2)">5</text>
  <text x="565" y="166" text-anchor="middle" font-size="11.5" fill="#39592b" filter="url(#rough2)">3</text>
  <text x="680" y="166" text-anchor="middle" font-size="11.5" fill="#39592b" filter="url(#rough2)">取 5 √</text>

  <text x="80" y="204" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">样例4 (n=10)</text>
  <text x="190" y="204" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">9</text>
  <text x="285" y="204" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">1</text>
  <text x="385" y="204" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">—</text>
  <text x="475" y="204" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">—</text>
  <text x="565" y="204" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">3</text>
  <text x="680" y="204" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">lca=1 跳过</text>

  <text x="80" y="242" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">样例4 (n=10)</text>
  <text x="190" y="242" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">8</text>
  <text x="285" y="242" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">1</text>
  <text x="385" y="242" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">—</text>
  <text x="475" y="242" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">—</text>
  <text x="565" y="242" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">3</text>
  <text x="680" y="242" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">lca=1 跳过</text>

  <rect x="44" y="260" width="692" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="80" y="280" text-anchor="middle" font-size="11.5" fill="#39592b" filter="url(#rough2)">样例4 (n=10)</text>
  <text x="190" y="280" text-anchor="middle" font-size="11.5" fill="#39592b" filter="url(#rough2)">6</text>
  <text x="285" y="280" text-anchor="middle" font-size="11.5" fill="#39592b" filter="url(#rough2)">2</text>
  <text x="385" y="280" text-anchor="middle" font-size="11.5" fill="#39592b" filter="url(#rough2)">5</text>
  <text x="475" y="280" text-anchor="middle" font-size="12" font-weight="bold" fill="#39592b" filter="url(#rough2)">6</text>
  <text x="565" y="280" text-anchor="middle" font-size="11.5" fill="#39592b" filter="url(#rough2)">3</text>
  <text x="680" y="280" text-anchor="middle" font-size="11.5" fill="#39592b" filter="url(#rough2)">取 6 √</text>

  <text x="80" y="318" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">样例4 (n=10)</text>
  <text x="190" y="318" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">10</text>
  <text x="285" y="318" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">10</text>
  <text x="385" y="318" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">0</text>
  <text x="475" y="318" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">1</text>
  <text x="565" y="318" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">3</text>
  <text x="680" y="318" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">太小，不取</text>

  <path d="M 46 334 Q 390 338 734 334" stroke="#446688" stroke-width="1.1" fill="none" filter="url(#rough2)"/>

  <text x="390" y="366" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">样例 3：max(dep[7]=3, 5) = 5　　样例 4：max(dep[10]=3, 6, 1) = 6　　（与官方输出一致）</text>
  <text x="390" y="392" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">注意 v_i = n 时 g = n、dist = 0，候选 1 永远赢不过 dep[n]；只有“夹在中间”的 v 才有用</text>
</svg>
