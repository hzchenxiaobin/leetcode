<svg xmlns="http://www.w3.org/2000/svg" width="884" height="404" viewBox="0 0 884 404"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="109"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="884" height="404" fill="#fafafa"/>
  <text x="442" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">把数轴按幸运数切成块：P(x) = ≤x 的幸运数个数</text>
  <text x="442" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">区间 [min,max] 内的幸运数个数 = P(max) − P(min−1)</text>
  <g filter="url(#rough2)"><rect x="90" y="210" width="68" height="40" rx="2" fill="#cfe0f5" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="124.0" y="236" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">P=0</text>
  <text x="124.0" y="268" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)"><rect x="164" y="210" width="68" height="40" rx="2" fill="#cfe0f5" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="198.0" y="236" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">P=0</text>
  <text x="198.0" y="268" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="238" y="210" width="68" height="40" rx="2" fill="#cfe0f5" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="272.0" y="236" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">P=0</text>
  <text x="272.0" y="268" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="312" y="210" width="68" height="40" rx="2" fill="#cfe0f5" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="346.0" y="236" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">P=0</text>
  <text x="346.0" y="268" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="386" y="210" width="68" height="40" rx="2" fill="#cfe0f5" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="420.0" y="236" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">P=1</text>
  <text x="420.0" y="268" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><rect x="460" y="210" width="68" height="40" rx="2" fill="#cfe0f5" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="494.0" y="236" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">P=2</text>
  <text x="494.0" y="268" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">5</text>
  <g filter="url(#rough2)"><rect x="534" y="210" width="68" height="40" rx="2" fill="#cfe0f5" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="568.0" y="236" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">P=3</text>
  <text x="568.0" y="268" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">6</text>
  <g filter="url(#rough2)"><rect x="608" y="210" width="68" height="40" rx="2" fill="#cfe0f5" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="642.0" y="236" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">P=4</text>
  <text x="642.0" y="268" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">7</text>
  <g filter="url(#rough2)"><rect x="682" y="210" width="68" height="40" rx="2" fill="#cfe0f5" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="716.0" y="236" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">P=5</text>
  <text x="716.0" y="268" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">8</text>
  <text x="440" y="300" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">P(x) 在每个区间 [lucky_i, lucky_{i+1}−1] 上是常数</text>
  <text x="440" y="330" text-anchor="middle" font-size="11.5" fill="#3d6b2f" filter="url(#rough2)">要 P(max)−P(min−1)=k：枚举 p≤v 与 v&lt;p 两类，块对 (a, b=a+k) 计数</text>
  <text x="440" y="362" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">两个区间交出的矩形里统计 p≤v 的格点数，用等差数列 O(1) 求和</text>
</svg>
