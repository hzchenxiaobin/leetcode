<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320" viewBox="0 0 700 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1162"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="700" height="320" fill="#fafafa"/>
  <text x="350.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1 的人数曲线</text>
  <path d="M 112.0 42 Q 350.0 48 588.0 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="80" y="175" width="90" height="75" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="125" y="270" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">站1: 3</text>
  <rect x="230" y="100" width="90" height="150" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="275" y="270" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">站2: 6</text>
  <rect x="380" y="150" width="90" height="100" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="425" y="270" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">站3: 4</text>
  <rect x="530" y="250" width="90" height="0" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="575" y="270" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">站4: 0</text>
  <path d="M 170 175 L 320 100" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="330" y="90" text-anchor="start" font-size="12" font-weight="bold" fill="#8c2f2c" filter="url(#rough2)">峰值 6</text>
  <text x="350" y="305" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">人数 = 前面各站 (b−a) 的前缀和，取最大值；峰值 6 在第 2 站上客后</text>
</svg>
