<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" width="840" height="440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="840" height="440" fill="#fafafa"/>

  <text x="420" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：高位锁死，低位可以全点亮</text>
  <path d="M 210 46 Q 420 53 630 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 位序号 -->
  <text x="198" y="74" text-anchor="middle" font-size="12" fill="#66788c" filter="url(#rough2)">b3</text>
  <text x="264" y="74" text-anchor="middle" font-size="12" fill="#66788c" filter="url(#rough2)">b2</text>
  <text x="330" y="74" text-anchor="middle" font-size="12" fill="#66788c" filter="url(#rough2)">b1</text>
  <text x="396" y="74" text-anchor="middle" font-size="12" fill="#66788c" filter="url(#rough2)">b0</text>

  <!-- 行标签 -->
  <text x="72" y="110" font-size="14" fill="#2b2b2b" filter="url(#rough2)">max M = 12</text>
  <text x="72" y="166" font-size="14" fill="#2b2b2b" filter="url(#rough2)">min m = 9</text>

  <!-- M = 12 = 1 1 0 0 -->
  <rect x="170" y="84" width="56" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="198" y="111" text-anchor="middle" font-size="19" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">1</text>
  <rect x="236" y="84" width="56" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="264" y="111" text-anchor="middle" font-size="19" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">1</text>
  <rect x="302" y="84" width="56" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="111" text-anchor="middle" font-size="19" fill="#2f4a66" filter="url(#rough2)">0</text>
  <rect x="368" y="84" width="56" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="396" y="111" text-anchor="middle" font-size="19" fill="#2f4a66" filter="url(#rough2)">0</text>

  <!-- m = 9 = 1 0 0 1 -->
  <rect x="170" y="140" width="56" height="42" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="198" y="167" text-anchor="middle" font-size="19" font-weight="bold" fill="#8a6015" filter="url(#rough2)">1</text>
  <rect x="236" y="140" width="56" height="42" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="264" y="167" text-anchor="middle" font-size="19" fill="#8a6015" filter="url(#rough2)">0</text>
  <rect x="302" y="140" width="56" height="42" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="167" text-anchor="middle" font-size="19" fill="#8a6015" filter="url(#rough2)">0</text>
  <rect x="368" y="140" width="56" height="42" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="396" y="167" text-anchor="middle" font-size="19" fill="#8a6015" filter="url(#rough2)">1</text>

  <!-- b3 锁死框 -->
  <rect x="160" y="78" width="68" height="112" rx="9" fill="#e6f4ea" fill-opacity="0.45"
        stroke="#4a7a3a" stroke-width="1.9" filter="url(#rough2)"/>
  <!-- b2 最高不同位框 -->
  <rect x="232" y="78" width="68" height="112" rx="9" fill="#fce4ec" fill-opacity="0.55"
        stroke="#b85450" stroke-width="2.2" stroke-dasharray="6 4" filter="url(#rough2)"/>

  <text x="197" y="208" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">两边相同 → 锁死</text>
  <text x="265" y="226" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">最高不同位 k = 2</text>

  <text x="60" y="256" font-size="12.8" fill="#2b2b2b" filter="url(#rough2)">b3：M 与 m 相同，任何可达值这一位都被钉死</text>
  <text x="60" y="280" font-size="12.8" fill="#2b2b2b" filter="url(#rough2)">b2：k = 2，从这一位往下才有“补 1”的余地</text>

  <!-- 左下：小例子 -->
  <rect x="56" y="300" width="352" height="76" rx="10" fill="#f2f6ff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="326" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">a = [12, 9]：S = 1101 = 13</text>
  <text x="76" y="352" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">M^m = 0101 → h = 3 → ans = 13 | 7 = 15</text>

  <!-- 右上：公式 -->
  <rect x="474" y="72" width="332" height="94" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="494" y="100" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">ans = S | ((1 &lt;&lt; h) - 1)</text>
  <text x="494" y="126" font-size="12.2" fill="#2f4a66" filter="url(#rough2)">h = bit_length(M xor m)，k = h - 1</text>
  <text x="494" y="148" font-size="12.2" fill="#2f4a66" filter="url(#rough2)">第 k 位本就属于 S，两种写法等价</text>

  <!-- 右中：三条结论 -->
  <text x="474" y="196" font-size="12.6" fill="#2b2b2b" filter="url(#rough2)">① 所有终值都落在 [m, M] 内</text>
  <text x="474" y="220" font-size="12.6" fill="#2b2b2b" filter="url(#rough2)">② 位 &gt; k：终值 = M 的位，只可能来自 S</text>
  <text x="474" y="244" font-size="12.6" fill="#2b2b2b" filter="url(#rough2)">③ 位 0..k-1：最多全 1，可以全 1</text>

  <!-- 右下：构造 c -->
  <rect x="474" y="262" width="332" height="86" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="494" y="288" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">构造 c = 1011 = 11</text>
  <text x="494" y="310" font-size="12" fill="#8a6015" filter="url(#rough2)">高位照抄 M，第 k 位写 0，低位全写 1</text>
  <text x="494" y="332" font-size="12" fill="#8a6015" filter="url(#rough2)">c ⊇ m 且 c ≤ M ⇒ 把 min 抬到 c</text>

  <path d="M 414 318 C 436 318 452 312 470 306" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
