  <text x="74" y="454" font-size="11.5" fill="#2f4a66" text-anchor="start" filter="url(#rough2)">四条边分别对应 u=1、v=5、u=9、v=−3</text>
  <text x="74" y="476" font-size="11.5" fill="#2f4a66" text-anchor="start" filter="url(#rough2)">菱形就是旋转坐标里的矩形盒子边界</text>
