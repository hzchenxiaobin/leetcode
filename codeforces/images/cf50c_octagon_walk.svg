  <text x="444" y="454" font-size="11.5" fill="#8a6015" text-anchor="start" filter="url(#rough2)">A = 8−2 = 6，B = 4−(−2) = 6</text>
  <text x="444" y="476" font-size="12.5" fill="#8a6015" text-anchor="start" font-weight="bold" filter="url(#rough2)">答案 = 6 + 6 + 4 = 16</text>
