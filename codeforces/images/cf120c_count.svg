<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1205"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="320" fill="#fafafa"/>
  <text x="360.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每罐最多吃 3 次、每次整 k</text>
  <path d="M 115.2 42 Q 360.0 48 604.8 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="360.0" y="306" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">答案 = Σa − k·Σmin(3,⌊a/k⌋)</text>
  <rect x="90" y="80" width="150" height="90" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="165" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">a=15</text>
  <text x="165" y="140" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">可吃 3 次</text>
  <text x="165" y="200" text-anchor="middle" font-size="11.5" fill="#8c2f2c" filter="url(#rough2)">吃掉 9</text>
  <rect x="280" y="80" width="150" height="90" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="355" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">a=8</text>
  <text x="355" y="140" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">可吃 2 次</text>
  <text x="355" y="200" text-anchor="middle" font-size="11.5" fill="#8c2f2c" filter="url(#rough2)">吃掉 6</text>
  <rect x="470" y="80" width="150" height="90" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="545" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">a=10</text>
  <text x="545" y="140" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">可吃 3 次</text>
  <text x="545" y="200" text-anchor="middle" font-size="11.5" fill="#8c2f2c" filter="url(#rough2)">吃掉 9</text>
  <rect x="90" y="230" width="530" height="50" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="355" y="260" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#335478" filter="url(#rough2)">总剩余 = (15+8+10) − 3·(3+2+3) = 33 − 24 = 9</text>
</svg>
