<svg xmlns="http://www.w3.org/2000/svg" width="760" height="464" viewBox="0 0 760 464"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="760" height="464" fill="#fafafa"/>

  <text x="380" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：x 每次只 +1，(a,b) 只有两个候选时刻</text>
  <path d="M 92 44 Q 380 51 668 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 操作时间轴 -->
  <text x="44" y="76" font-size="12.5" fill="#66788c" filter="url(#rough2)">操作序列（第 k 次操作结束后 x = k）</text>

  <rect x="44" y="92" width="96" height="56" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="92" y="126" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">操作 1</text>

  <rect x="152" y="92" width="96" height="56" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="126" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">操作 2</text>

  <rect x="260" y="92" width="96" height="56" rx="6" fill="#fafafa" stroke="#8a94a0" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="308" y="126" text-anchor="middle" font-size="15" fill="#66788c" filter="url(#rough2)">⋯</text>

  <rect x="368" y="92" width="96" height="56" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="416" y="126" text-anchor="middle" font-size="13" fill="#3c5e2e" filter="url(#rough2)">操作 a</text>

  <rect x="476" y="92" width="96" height="56" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="524" y="126" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">操作 a+1</text>

  <path d="M 142 120 L 149 120" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 250 120 L 257 120" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 358 120 L 365 120" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 466 120 L 473 120" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="92" y="170" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">x = 1</text>
  <text x="200" y="170" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">x = 2</text>
  <text x="416" y="170" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">x = a</text>
  <text x="524" y="170" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">x = a+1</text>

  <text x="592" y="112" font-size="11.5" fill="#a14340" filter="url(#rough2)">再往后 x 只增不减，</text>
  <text x="592" y="132" font-size="11.5" fill="#a14340" filter="url(#rough2)">永远回不到 x = a</text>
  <path d="M 588 120 Q 578 120 576 122" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- 候选一 -->
  <rect x="40" y="196" width="680" height="84" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="222" font-size="14" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">候选一 · 第 a 次操作结束时：(a, y_a)</text>
  <text x="60" y="248" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">y_a 取遍 {−a, −a+2, …, a} ⇒ b ≤ a 且 b ≡ a (mod 2) ⇒ 答案 a</text>
  <text x="60" y="271" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">右移刚走完，x 从 a−1 跳到 a；这是恰好 a 次操作的唯一落点</text>

  <!-- 候选二 -->
  <rect x="40" y="292" width="680" height="84" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="318" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">候选二 · 第 a+1 次操作的竖移之后：(a, y_{a+1})</text>
  <text x="60" y="344" font-size="12.5" fill="#8a6015" filter="url(#rough2)">y_{a+1} 取遍 {−(a+1), −(a+1)+2, …, a+1} ⇒ b ≤ a+1 且 b ≡ a+1 (mod 2) ⇒ 答案 a+1</text>
  <text x="60" y="367" font-size="11.5" fill="#d6a040" filter="url(#rough2)">先竖移、后右移，所以竖移终点还没跨过 a，此时 x 恰好是 a</text>

  <!-- 结论 -->
  <rect x="40" y="388" width="680" height="58" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="410" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">两个候选都不成立 ⇒ 机器人永远踩不到 (a, b) ⇒ 输出 −1</text>
  <text x="380" y="432" text-anchor="middle" font-size="11.5" fill="#8d4a48" filter="url(#rough2)">第 a+1 次操作之后 x ≥ a+1，而 x 单调，故不存在第三种可能</text>
</svg>
