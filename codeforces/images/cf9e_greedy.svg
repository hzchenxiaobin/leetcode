<svg xmlns="http://www.w3.org/2000/svg" width="780" height="380" viewBox="0 0 780 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="33"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="780" height="380" fill="#fafafa"/>
  <text x="390" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">n = 4 且没有初始边：按字典序贪心接边，4 步成环</text>
  <rect x="10" y="40" width="180" height="176" rx="9" fill="#ffffff" stroke="#c9ced6" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="50" y1="52" x2="150" y2="52" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <circle cx="50" cy="52" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="50" y="56.5" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">1</text>
  <circle cx="150" cy="52" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="150" y="56.5" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">2</text>
  <circle cx="50" cy="152" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="50" y="156.5" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">3</text>
  <circle cx="150" cy="152" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="150" y="156.5" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">4</text>
  <text x="100" y="234" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">加入 (1,2)</text>
  <rect x="200" y="40" width="180" height="176" rx="9" fill="#ffffff" stroke="#c9ced6" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="240" y1="52" x2="340" y2="52" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <line x1="240" y1="52" x2="240" y2="152" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <circle cx="240" cy="52" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="240" y="56.5" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">1</text>
  <circle cx="340" cy="52" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="340" y="56.5" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">2</text>
  <circle cx="240" cy="152" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="240" y="156.5" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">3</text>
  <circle cx="340" cy="152" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="340" y="156.5" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">4</text>
  <text x="290" y="234" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">加入 (1,3)</text>
  <rect x="390" y="40" width="180" height="176" rx="9" fill="#ffffff" stroke="#c9ced6" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="430" y1="52" x2="530" y2="52" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <line x1="430" y1="52" x2="430" y2="152" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <line x1="530" y1="52" x2="530" y2="152" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <circle cx="430" cy="52" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="430" y="56.5" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">1</text>
  <circle cx="530" cy="52" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="530" y="56.5" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">2</text>
  <circle cx="430" cy="152" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="430" y="156.5" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">3</text>
  <circle cx="530" cy="152" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="530" y="156.5" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">4</text>
  <text x="480" y="234" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">加入 (2,4)</text>
  <rect x="580" y="40" width="180" height="176" rx="9" fill="#ffffff" stroke="#c9ced6" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="620" y1="52" x2="720" y2="52" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <line x1="620" y1="52" x2="620" y2="152" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <line x1="720" y1="52" x2="720" y2="152" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <line x1="620" y1="152" x2="720" y2="152" stroke="#b85450" stroke-width="2.2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <circle cx="620" cy="52" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="620" y="56.5" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">1</text>
  <circle cx="720" cy="52" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="720" y="56.5" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">2</text>
  <circle cx="620" cy="152" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="620" y="156.5" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">3</text>
  <circle cx="720" cy="152" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="720" y="156.5" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">4</text>
  <text x="670" y="234" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">闭合 (3,4)</text>
  <rect x="40" y="262" width="700" height="96" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <g font-size="12.5" fill="#8a6015" filter="url(#rough2)">
    <text x="58" y="288">每一步都取"两端点、不同连通块"的字典序最小边：1,2 → 1,3 → 2,4。</text>
    <text x="58" y="314">只剩一条路径 4−2−1−3 后，唯一的选择是把它的两个端点 3、4 连起来（红色虚线）。</text>
    <text x="58" y="340" font-weight="bold" fill="#8f3b37">总边数 = 路径数 c = 4，恰好最少；且任何其他补法的边集都字典序更大。</text>
  </g>
</svg>
