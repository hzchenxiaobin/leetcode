<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="720" height="290" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">为什么 OR 一定还原出合法解（设原解为 A）</text>
  <rect x="40" y="60" width="300" height="80" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="190" y="89" text-anchor="middle" font-size="12" fill="#2f5223">b_ik = A_i AND A_k</text>
  <text x="190" y="104" text-anchor="middle" font-size="12" fill="#2f5223">⇒ OR_{j≠i} b_ij ⊆ A_i</text>
  <text x="190" y="119" text-anchor="middle" font-size="12" fill="#2f5223">所以 a_i ⊆ A_i</text>
  <rect x="380" y="60" width="300" height="80" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="530" y="97" text-anchor="middle" font-size="12" fill="#2f4a66">b_ik 是 OR 的一项</text>
  <text x="530" y="112" text-anchor="middle" font-size="12" fill="#2f4a66">⇒ b_ik ⊆ a_i，同理 ⊆ a_k</text>
  <rect x="40" y="168" width="640" height="86" rx="8" fill="#f3edf8" stroke="#7a4a9a" stroke-width="1.5"/>
  <text x="360" y="208" text-anchor="middle" font-size="12" fill="#4a2a62">两个方向合起来：b_ik ⊆ (a_i AND a_k) ⊆ (A_i AND A_k) = b_ik</text>
  <text x="360" y="223" text-anchor="middle" font-size="12" fill="#4a2a62">于是 a_i AND a_k 恰好等于 b_ik —— 与矩阵完全一致</text>
</svg>
