<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="780" height="430" fill="#fafafa"/>

  <text x="390" y="28" text-anchor="middle" font-size="15.5" fill="#333" filter="url(#rough2)">路径为什么只有 n 条：跨边数决定一切</text>

  <!-- ① -->
  <rect x="28" y="46" width="356" height="168" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="206" y="72" text-anchor="middle" font-size="13.5" fill="#8a6520" filter="url(#rough2)">① 切 i 只用 1 条跨边 ⇒ 必然走 z_i</text>
  <rect x="44" y="88" width="142" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115" y="111" text-anchor="middle" font-size="12" fill="#2f4a63" filter="url(#rough2)">前 i 列整块走完</text>
  <path d="M 190 106 L 244 106" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="217" y="100" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">z_i</text>
  <rect x="250" y="88" width="118" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="309" y="111" text-anchor="middle" font-size="12" fill="#33612a" filter="url(#rough2)">不再回头</text>
  <text x="46" y="150" font-size="12" fill="#555" filter="url(#rough2)">这一块是 G_i 的哈密顿路径，起点 a1；</text>
  <text x="46" y="172" font-size="12" fill="#555" filter="url(#rough2)">两边点集一样大（各 i 个）⇒ 终点必在 b 侧，</text>
  <text x="46" y="194" font-size="12" fill="#b85450" filter="url(#rough2)">只能是 b_i，跨边只能是 z_i = a_{i+1}–b_i。</text>

  <!-- ② -->
  <rect x="396" y="46" width="356" height="168" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="574" y="72" text-anchor="middle" font-size="13.5" fill="#33612a" filter="url(#rough2)">② 切 i 两条都用 ⇒ 右侧夹在中间</text>
  <rect x="408" y="88" width="80" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="448" y="111" text-anchor="middle" font-size="11.5" fill="#2f4a63" filter="url(#rough2)">前段到 a_i</text>
  <path d="M 490 106 L 512 106" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="501" y="100" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">y_i</text>
  <rect x="516" y="88" width="120" height="36" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="576" y="111" text-anchor="middle" font-size="11.5" fill="#8a6520" filter="url(#rough2)">第 i+1..n 列整段</text>
  <path d="M 638 106 L 660 106" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="649" y="100" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">z_i</text>
  <rect x="664" y="88" width="76" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="702" y="111" text-anchor="middle" font-size="11.5" fill="#2f4a63" filter="url(#rough2)">收回 b_i</text>
  <text x="414" y="150" font-size="12" fill="#555" filter="url(#rough2)">右侧整段是一条「蛇」：从 b_{i+1} 进、</text>
  <text x="414" y="172" font-size="12" fill="#555" filter="url(#rough2)">从 a_{i+1} 出，回接 b_i 后收尾；</text>
  <text x="414" y="194" font-size="12" fill="#b85450" filter="url(#rough2)">终点在左侧 ⇒ 终点列号 k = 单边切数 + 1。</text>

  <!-- ③ -->
  <rect x="28" y="232" width="724" height="182" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="390" y="258" text-anchor="middle" font-size="13.5" fill="#2f4a63" filter="url(#rough2)">③ 蛇 S_k（列 k..n，从 a_k 到 b_k）唯一，且可递推</text>
  <text x="48" y="288" font-size="12.5" fill="#444" filter="url(#rough2)">S_n = a_n → b_n，只含竖边 v_n；</text>
  <text x="48" y="314" font-size="12.5" fill="#444" filter="url(#rough2)">S_k = a_k → b_{k+1} →（把 S_{k+1} 反向走一遍）→ b_k</text>
  <text x="48" y="340" font-size="12.5" fill="#444" filter="url(#rough2)">边集 E(S_k) = {y_k, z_k} ∪ E(S_{k+1}) ⇒ g[k] = g[k+1] + Y_k + Z_k</text>
  <text x="48" y="370" font-size="12.5" fill="#b85450" filter="url(#rough2)">P_k = 锯齿 a1 b1 a2 b2 … a_k，再接上 S_k，终点恰为 b_k</text>
  <text x="48" y="398" font-size="12.5" fill="#33612a" filter="url(#rough2)">E(P_k) = {v_i, z_i : i &lt; k} ∪ {y_i, z_i : k ≤ i ≤ n−1} ∪ {v_n}</text>
</svg>
