<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="117"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="300" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">删元音、辅音前加点、统一小写</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">元音 a,o,y,e,u,i</text>
  <g filter="url(#rough2)"><rect x="120" y="96" width="300" height="50" rx="4" fill="#f6e3c4" fill-opacity="0.6" stroke="#c9a86a" stroke-width="1.3"/></g>
  <text x="270" y="127" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">tour</text>
  <g filter="url(#rough2)"><rect x="470" y="96" width="300" height="50" rx="4" fill="#d7ecd0" fill-opacity="0.6" stroke="#6a9a58" stroke-width="1.3"/></g>
  <text x="620" y="127" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">.t.r</text>
  <text x="442" y="182" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">t、r 辅音 → 加点；o、u 元音 → 删除</text>
  <text x="442" y="216" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">先转小写再判断元音</text>
  <text x="442" y="252" text-anchor="middle" font-size="11.5" fill="#3d6b2f" filter="url(#rough2)">顺序不变，只做删 / 加点 / 小写</text>
</svg>
