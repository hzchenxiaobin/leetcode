<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320" viewBox="0 0 700 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1273"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="700" height="320" fill="#fafafa"/>
  <text x="350.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">对数 → 画框</text>
  <path d="M 112.0 42 Q 350.0 48 588.0 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="350.0" y="306" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">答案 = ⌊(Σ⌊cnt/2⌋)/2⌋</text>
  <rect x="60" y="80" width="140" height="90" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="130" y="110" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">长度 2</text>
  <text x="130" y="135" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">cnt=2</text>
  <text x="130" y="158" text-anchor="middle" font-size="11.5" fill="#8c2f2c" filter="url(#rough2)">1 对</text>
  <rect x="220" y="80" width="140" height="90" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="110" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">长度 3</text>
  <text x="290" y="135" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">cnt=2</text>
  <text x="290" y="158" text-anchor="middle" font-size="11.5" fill="#8c2f2c" filter="url(#rough2)">1 对</text>
  <rect x="380" y="80" width="140" height="90" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="450" y="110" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">长度 6</text>
  <text x="450" y="135" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">cnt=3</text>
  <text x="450" y="158" text-anchor="middle" font-size="11.5" fill="#8c2f2c" filter="url(#rough2)">1 对</text>
  <rect x="540" y="80" width="140" height="90" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="610" y="110" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">长度 7</text>
  <text x="610" y="135" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">cnt=2</text>
  <text x="610" y="158" text-anchor="middle" font-size="11.5" fill="#8c2f2c" filter="url(#rough2)">1 对</text>
  <rect x="60" y="210" width="580" height="50" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="350" y="240" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">总对数 4 → 2 个画框（每框 2 对）</text>
  <text x="350" y="290" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">两对可以不同长 ⇒ 矩形不一定是正方形</text>
</svg>
