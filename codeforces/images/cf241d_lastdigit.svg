<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="ld" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b4652a"/>
    </marker>
  </defs>
  <rect width="720" height="320" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">p = 2 或 5：整除性只看「最后一个元素的末位」</text>

  <g filter="url(#rough2)">
    <rect x="60" y="60" width="84" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="156" y="60" width="84" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="252" y="60" width="84" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="348" y="60" width="84" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="444" y="60" width="84" height="52" rx="8" fill="#fde9d9" stroke="#b4652a" stroke-width="2.4"/>
    <rect x="540" y="60" width="84" height="52" rx="8" fill="#f2f2f2" stroke="#999999" stroke-width="1.4" stroke-dasharray="4 3"/>
  </g>
  <g font-size="12" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">
    <text x="102" y="92">…</text><text x="198" y="92">…</text><text x="294" y="92">…</text>
    <text x="390" y="92">…</text><text x="486" y="92" font-weight="bold">a_j</text><text x="582" y="92">不选</text>
  </g>
  <text x="486" y="132" text-anchor="middle" font-size="11.5" fill="#b4652a" filter="url(#rough2)">必须 a_j ≡ 0 (mod p)</text>
  <text x="480" y="152" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">（10^k ≡ 0，所以后面的位数不再影响余数）</text>

  <g filter="url(#rough2)">
    <rect x="60" y="176" width="370" height="118" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="452" y="176" width="238" height="118" rx="9" fill="#f3edf8" stroke="#7a4a9a" stroke-width="1.3"/>
  </g>
  <g font-size="11.5" fill="#2f4a66" filter="url(#rough2)">
    <text x="74" y="198" font-weight="bold">剩下的前缀要异或出 a_j</text>
    <text x="74" y="220">· 维护前 j 个数的 GF(2) 线性基</text>
    <text x="74" y="240">· 基向量只存 ≤ 16 个，每个带一个</text>
    <text x="74" y="258">  「由哪些原始下标组合而成」的掩码</text>
    <text x="74" y="280">· a_j 能被基表示 ⇒ 取对应下标即可</text>
  </g>
  <g font-size="11.5" fill="#4a2a62" filter="url(#rough2)">
    <text x="466" y="198" font-weight="bold">总异或</text>
    <text x="466" y="220">xor(前缀子集) ⊕ a_j</text>
    <text x="466" y="240">= a_j ⊕ a_j = 0 ✓</text>
    <text x="466" y="266">总拼接余数</text>
    <text x="466" y="286">= (…)×10^len + a_j ≡ 0 ✓</text>
  </g>
</svg>
