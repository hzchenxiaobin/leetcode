<svg xmlns="http://www.w3.org/2000/svg" width="820" height="380" viewBox="0 0 820 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="820" height="380" fill="#fafafa"/>

  <text x="410" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">单人总分 = 攻击项 + 五个问题分</text>

  <g filter="url(#rough2)">
    <rect x="50" y="70" width="300" height="150" rx="12" fill="#cfe0f5" stroke="#446688" stroke-width="1.6"/>
    <text x="200" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66">攻击</text>
    <text x="200" y="128" text-anchor="middle" font-size="12.5" fill="#444444">成功：每 1 次 +100</text>
    <text x="200" y="154" text-anchor="middle" font-size="12.5" fill="#444444">失败：每 1 次 −50</text>
    <text x="200" y="186" text-anchor="middle" font-size="12.5" fill="#2f4a66">100 × plus − 50 × minus</text>

    <rect x="470" y="70" width="300" height="150" rx="12" fill="#d9ecd4" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="620" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223">五个问题</text>
    <text x="620" y="128" text-anchor="middle" font-size="12.5" fill="#444444">A + B + C + D + E</text>
    <text x="620" y="154" text-anchor="middle" font-size="12.5" fill="#444444">未解出记 0</text>
    <text x="620" y="186" text-anchor="middle" font-size="12.5" fill="#2f5223">a + b + c + d + e</text>

    <path d="M 200 220 L 350 278" stroke="#446688" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M 620 220 L 470 278" stroke="#446688" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="280" y="280" width="260" height="52" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="410" y="312" text-anchor="middle" font-size="13" fill="#8a6015">score = 两项之和</text>
  </g>

  <text x="410" y="360" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">每名参赛者的分数互相独立，逐行计算再取最大值即可。</text>
</svg>
