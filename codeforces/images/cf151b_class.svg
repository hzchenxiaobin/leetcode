<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="457"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="300" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">三类号码：全同 / 严格递减 / 其余</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">同一号码出现多次要重复计数</text>
  <g filter="url(#rough2)"><rect x="60" y="96" width="190" height="40" rx="4" fill="#ffffff" fill-opacity="0.35" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="155" y="123" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">22-22-22</text>
  <text x="270" y="123" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">六个数字全相同</text>
  <text x="700" y="123" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">出租车</text>
  <g filter="url(#rough2)"><rect x="60" y="146" width="190" height="40" rx="4" fill="#ffffff" fill-opacity="0.35" stroke="#b06a1e" stroke-width="1.4"/></g>
  <text x="155" y="173" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">98-76-54</text>
  <text x="270" y="173" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">六个数字严格递减</text>
  <text x="700" y="173" text-anchor="middle" font-size="12" fill="#b06a1e" font-weight="bold" filter="url(#rough2)">披萨</text>
  <g filter="url(#rough2)"><rect x="60" y="196" width="190" height="40" rx="4" fill="#ffffff" fill-opacity="0.35" stroke="#8a2b28" stroke-width="1.4"/></g>
  <text x="155" y="223" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">99-99-98</text>
  <text x="270" y="223" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">非严格（有相等）</text>
  <text x="700" y="223" text-anchor="middle" font-size="12" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">女孩</text>
  <g filter="url(#rough2)"><rect x="60" y="246" width="190" height="40" rx="4" fill="#ffffff" fill-opacity="0.35" stroke="#8a2b28" stroke-width="1.4"/></g>
  <text x="155" y="273" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">12-34-56</text>
  <text x="270" y="273" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">既不相等也不递减</text>
  <text x="700" y="273" text-anchor="middle" font-size="12" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">女孩</text>
  <text x="450" y="296" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">每类取最大计数，并列者按输入顺序全部列出</text>
</svg>
