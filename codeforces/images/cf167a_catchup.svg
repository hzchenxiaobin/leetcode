<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="760" height="440" fill="#fafafa"/>

  <line x1="90" y1="382" x2="700" y2="382" stroke="#555" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="90" y1="382" x2="90" y2="92" stroke="#555" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="706" y="386" font-size="13" text-anchor="start" fill="#2b2b2b" filter="url(#rough2)">t</text>
  <text x="80" y="96" font-size="12" text-anchor="end" fill="#2b2b2b" filter="url(#rough2)">距离</text>
  <line x1="90" y1="110" x2="690" y2="110" stroke="#b85450" stroke-width="1.2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="694" y="114" font-size="12" text-anchor="start" fill="#7a2f2f" filter="url(#rough2)">d</text>
  <path d="M 90 382 Q 120 340 150 300 L 330 170" fill="none" stroke="#446688" stroke-width="2.4" filter="url(#rough2)"/>
  <path d="M 330 170 L 470 110" fill="none" stroke="#446688" stroke-width="2.4" filter="url(#rough2)"/>
  <path d="M 150 382 Q 176 348 200 316 L 300 230" fill="none" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <path d="M 300 230 L 470 110" fill="none" stroke="#4a7a3a" stroke-width="2.4" stroke-dasharray="7 4" filter="url(#rough2)"/>
  <circle cx="300" cy="230" r="4.5" fill="#b85450" stroke="none" filter="url(#rough2)"/>
  <text x="306" y="218" font-size="11.5" text-anchor="start" fill="#7a2f2f" filter="url(#rough2)">追上，此后并排同速</text>
  <text x="88" y="398" font-size="11" text-anchor="start" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="150" y="398" font-size="11" text-anchor="middle" fill="#35507a" filter="url(#rough2)">t₁</text>
  <text x="200" y="398" font-size="11" text-anchor="middle" fill="#2f5223" filter="url(#rough2)">t₂</text>
  <text x="470" y="398" font-size="11" text-anchor="middle" fill="#7a2f2f" filter="url(#rough2)">T</text>
  <line x1="470" y1="110" x2="470" y2="382" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="384" y="148" font-size="11.5" text-anchor="start" fill="#2f5223" filter="url(#rough2)">后车更快</text>
  <text x="210" y="200" font-size="11.5" text-anchor="start" fill="#35507a" filter="url(#rough2)">前车</text>
  <text x="470" y="430" font-size="12" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">两车同刻到站：T = max(t₂ + 自由时间, T₁)</text>
  <text x="380.0" y="36" font-size="20" text-anchor="middle" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">追上了就只能并排：到站时间取 max(自由到站, 前车到站)</text>
  <path d="M 120 46 Q 380.0 52 640 46" fill="none" stroke="#2b2b2b" stroke-width="1.3" filter="url(#rough2)"/>
</svg>
