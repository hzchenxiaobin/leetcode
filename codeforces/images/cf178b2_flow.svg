<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="27"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="440" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">B2 的流程：Tarjan 求桥 → 缩点 → 树上 BFS</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="120.0" y="76.0" width="480.0" height="42.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="134.0" y="100.0" text-anchor="start" font-size="12" fill="#3f3420" filter="url(#rough2)">Tarjan：求 tin / low，标出所有桥</text>
  <rect x="120.0" y="136.0" width="480.0" height="42.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="134.0" y="160.0" text-anchor="start" font-size="12" fill="#3f3420" filter="url(#rough2)">遍历非桥边，给每个点染上连通块编号</text>
  <line x1="360.0" y1="118.0" x2="360.0" y2="132.0" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120.0" y="196.0" width="480.0" height="42.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="134.0" y="220.0" text-anchor="start" font-size="12" fill="#3f3420" filter="url(#rough2)">用桥连接这些块，得到一棵树</text>
  <line x1="360.0" y1="178.0" x2="360.0" y2="192.0" stroke="#8a6015" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120.0" y="256.0" width="480.0" height="42.0" fill="#fde8e8" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="134.0" y="280.0" text-anchor="start" font-size="12" fill="#3f3420" filter="url(#rough2)">每个询问：在树上从 comp(s) BFS 到 comp(l)</text>
  <line x1="360.0" y1="238.0" x2="360.0" y2="252.0" stroke="#b85450" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120.0" y="316.0" width="480.0" height="42.0" fill="#f3e8fd" stroke="#6b4c9a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="134.0" y="340.0" text-anchor="start" font-size="12" fill="#3f3420" filter="url(#rough2)">输出距离（经过的桥数）</text>
  <line x1="360.0" y1="298.0" x2="360.0" y2="312.0" stroke="#6b4c9a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="40.0" y="416.0" text-anchor="start" font-size="12" fill="#444" filter="url(#rough2)">桥树大小 ≤ n，单次 BFS O(n)；总 O(n+m+k·n)，n,k ≤ 2000 时 4×10⁶。</text>
</svg>
