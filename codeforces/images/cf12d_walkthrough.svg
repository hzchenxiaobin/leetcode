<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="109"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrs" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="330" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例走查：三位女士，只有一位被压过</text>
  <path d="M 160 42 Q 380 47 600 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="380" y="60" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">B = 1 4 2，I = 4 3 2，R = 2 5 3；按 B 降序处理：第 2 位、第 3 位、第 1 位</text>

  <text x="145" y="86" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">① (B=4, I=3, R=5)  pos=2</text>
  <rect x="52" y="96" width="56" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="80" y="123" text-anchor="middle" font-size="15" fill="#8a8a8a" filter="url(#rough2)">-</text>
  <text x="80" y="152" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">pos1</text>
  <rect x="116" y="96" width="56" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="144" y="123" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <text x="144" y="152" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">pos2</text>
  <rect x="180" y="96" width="56" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="208" y="123" text-anchor="middle" font-size="15" fill="#8a8a8a" filter="url(#rough2)">-</text>
  <text x="208" y="152" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">pos3</text>
  <text x="145" y="180" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">查 [1,1]：空</text>
  <text x="145" y="200" text-anchor="middle" font-size="10.5" fill="#8c3a36" filter="url(#rough2)">5 无人能压 → 安全</text>
  <text x="145" y="220" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">插入 5 到 pos2</text>
  <line x1="252" y1="120" x2="272" y2="120" stroke="#446688" stroke-width="1.6" marker-end="url(#arrs)" filter="url(#rough2)"/>
  <text x="385" y="86" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">② (B=2, I=2, R=3)  pos=3</text>
  <rect x="292" y="96" width="56" height="42" rx="6" fill="#fdeceb" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="320" y="123" text-anchor="middle" font-size="15" fill="#8a8a8a" filter="url(#rough2)">-</text>
  <text x="320" y="152" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">pos1</text>
  <rect x="356" y="96" width="56" height="42" rx="6" fill="#fdeceb" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="384" y="123" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <text x="384" y="152" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">pos2</text>
  <rect x="420" y="96" width="56" height="42" rx="6" fill="#fdeceb" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="448" y="123" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="448" y="152" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">pos3</text>
  <text x="385" y="180" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">查 [1,2]：max = 5</text>
  <text x="385" y="200" text-anchor="middle" font-size="10.5" fill="#8c3a36" filter="url(#rough2)">5 > 3 → 被压过，+1</text>
  <text x="385" y="220" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">插入 3 到 pos3</text>
  <line x1="492" y1="120" x2="512" y2="120" stroke="#446688" stroke-width="1.6" marker-end="url(#arrs)" filter="url(#rough2)"/>
  <text x="625" y="86" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">③ (B=1, I=4, R=2)  pos=1</text>
  <rect x="532" y="96" width="56" height="42" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="560" y="123" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="560" y="152" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">pos1</text>
  <rect x="596" y="96" width="56" height="42" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="624" y="123" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <text x="624" y="152" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">pos2</text>
  <rect x="660" y="96" width="56" height="42" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="688" y="123" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="688" y="152" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">pos3</text>
  <text x="625" y="180" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">查 [1,0]：空</text>
  <text x="625" y="200" text-anchor="middle" font-size="10.5" fill="#8c3a36" filter="url(#rough2)">2 无人能压 → 安全</text>
  <text x="625" y="220" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">插入 2 到 pos1</text>

  <text x="380" y="258" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">每个格子是 BIT 里该 pos 位置记录的最大财富（初始全为 -1）；三个格子自上而下表示扫描推进</text>

  <rect x="60" y="274" width="640" height="44" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="72" y="301" font-size="12" fill="#2f4a66" filter="url(#rough2)">答案 = 1：只有 (B=2, I=2, R=3) 这位，被 (B=4, I=3, R=5) 三维严格压过</text>
</svg>
