<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="720" height="400" fill="#fafafa"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">合法拆分：k 个连续递减的正整数</text>
  <path d="M 200 43 Q 360 49 520 43" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <rect x="90" y="110" width="46" height="74" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="113" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">7</text>
  <rect x="146" y="110" width="46" height="70" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="169" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">6</text>
  <rect x="202" y="110" width="46" height="66" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="225" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">5</text>
  <text x="268" y="150" text-anchor="start" font-size="11" fill="#777777" filter="url(#rough2)">k = 3，差恒为 1</text>
  <rect x="60" y="72" width="600" height="30" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="76" y="92" text-anchor="start" font-size="11.5" fill="#8a6015" filter="url(#rough2)">总和 n = k·a − k(k−1)/2（a 是最大的一堆）→ 对每个 k 反解 a</text>
  <rect x="60" y="260" width="600" height="60" rx="7" fill="#e9f4e2" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="76" y="286" text-anchor="start" font-size="11.5" fill="#2f5223" filter="url(#rough2)">k 只要枚举到 k(k+1)/2 ≤ n（因为 a ≥ k），最多 O(√n) 个</text>
  <text x="76" y="308" text-anchor="start" font-size="11" fill="#3c5e2e" filter="url(#rough2)">反解出的 a 必须是整数且 a ≥ k；n ≤ 10^5 时总枚举量 ≈ 3×10^7</text>
  <text x="60" y="350" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">每个拆分是一个子游戏：几堆互不影响 → SG 值 = 各堆 SG 的异或。</text>
  <text x="60" y="374" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">先手必胜 ⇔ g(n) ≠ 0，且首步要让异或变成 0，取最小的 k。</text>
</svg>
