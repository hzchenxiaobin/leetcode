<svg xmlns="http://www.w3.org/2000/svg" width="880" height="404" viewBox="0 0 880 404"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="83"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="404" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">把 k 次检查拆成 R 个整轮 + 一次不完整的轮</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">F(R) = Σ min(a_i, R)：做满 R 轮时总共做了多少次检查</text>
  <g filter="url(#rough2)"><rect x="120" y="127" width="52" height="77" rx="4" fill="#cfe0f5" fill-opacity="0.55" stroke="#6688aa" stroke-width="1.2"/></g>
  <text x="146.0" y="222" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">7</text>
  <g filter="url(#rough2)"><rect x="120" y="127" width="52" height="44" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#c9a86a" stroke-width="1.2"/></g>
  <text x="146.0" y="165" text-anchor="middle" font-size="11.5" fill="#8a6a2f" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="182" y="160" width="52" height="44" rx="4" fill="#cfe0f5" fill-opacity="0.55" stroke="#6688aa" stroke-width="1.2"/></g>
  <text x="208.0" y="222" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><rect x="182" y="160" width="52" height="11" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#c9a86a" stroke-width="1.2"/></g>
  <text x="208.0" y="165" text-anchor="middle" font-size="11.5" fill="#8a6a2f" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="244" y="149" width="52" height="55" rx="4" fill="#cfe0f5" fill-opacity="0.55" stroke="#6688aa" stroke-width="1.2"/></g>
  <text x="270.0" y="222" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">5</text>
  <g filter="url(#rough2)"><rect x="244" y="149" width="52" height="22" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#c9a86a" stroke-width="1.2"/></g>
  <text x="270.0" y="165" text-anchor="middle" font-size="11.5" fill="#8a6a2f" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="306" y="182" width="52" height="22" rx="4" fill="#cfe0f5" fill-opacity="0.55" stroke="#6688aa" stroke-width="1.2"/></g>
  <text x="332.0" y="222" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">2</text>
  <text x="332.0" y="165" text-anchor="middle" font-size="11.5" fill="#8a6a2f" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="368" y="138" width="52" height="66" rx="4" fill="#cfe0f5" fill-opacity="0.55" stroke="#6688aa" stroke-width="1.2"/></g>
  <text x="394.0" y="222" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">6</text>
  <g filter="url(#rough2)"><rect x="368" y="138" width="52" height="33" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#c9a86a" stroke-width="1.2"/></g>
  <text x="394.0" y="165" text-anchor="middle" font-size="11.5" fill="#8a6a2f" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="430" y="171" width="52" height="33" rx="4" fill="#cfe0f5" fill-opacity="0.55" stroke="#6688aa" stroke-width="1.2"/></g>
  <text x="456.0" y="222" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">3</text>
  <text x="456.0" y="165" text-anchor="middle" font-size="11.5" fill="#8a6a2f" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><line x1="110" y1="171" x2="486" y2="171" stroke="#b85450" stroke-width="2.2" stroke-dasharray="7 5"/></g>
  <text x="106" y="175" text-anchor="end" font-size="12" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">R = 3</text>
  <text x="420" y="300" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">F(3) = 3+3+3+2+3+3 = 17；若 k = 18，则 R = 3、余下 rem = 1 次检查</text>
  <text x="420" y="326" text-anchor="middle" font-size="12" fill="#3d6b2f" filter="url(#rough2)">做完 R 轮后：a_i &gt; R 的动物还留在队里（顺序不变），a_i ≤ R 的已经回家</text>
  <text x="420" y="352" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">余下 rem 次按队列顺序做：检查完还有剩余的排到队尾，其余离开；队列 = 未轮到的 + 留在队尾的</text>
  <text x="420" y="378" text-anchor="middle" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">因为 rem &lt; 存活数，这一轮不会绕回队首，所以只需要一次扫描</text>
</svg>
