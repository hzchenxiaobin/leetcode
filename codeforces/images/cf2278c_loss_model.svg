<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
    <marker id="arrGreen" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：质量只在「端点核」被拆时损失，且每次至少丢 1</text>
  <path d="M 96 41 Q 360 47 624 41" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- 左：内部核 -->
  <rect x="28" y="54" width="336" height="250" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="196" y="76" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">内部核：左右邻居都在</text>

  <rect x="160" y="90" width="66" height="42" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.3" filter="url(#rough2)"/>
  <text x="193" y="118" text-anchor="middle" font-size="17" font-weight="bold" fill="#8a6015" filter="url(#rough2)">7</text>
  <text x="234" y="116" font-size="11.5" fill="#8a6015" filter="url(#rough2)">拆成 x + y = 7</text>

  <rect x="52" y="192" width="66" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="85" y="220" text-anchor="middle" font-size="17" fill="#2f5d22" filter="url(#rough2)">5</text>
  <text x="85" y="252" text-anchor="middle" font-size="11" fill="#3c5e2e" filter="url(#rough2)">左邻 → 5 + x</text>

  <rect x="266" y="192" width="66" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="299" y="220" text-anchor="middle" font-size="17" fill="#2f5d22" filter="url(#rough2)">3</text>
  <text x="299" y="252" text-anchor="middle" font-size="11" fill="#3c5e2e" filter="url(#rough2)">右邻 → 3 + y</text>

  <path d="M 168 132 L 106 188" stroke="#4a7a3a" stroke-width="1.7" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <path d="M 218 132 L 280 188" stroke="#4a7a3a" stroke-width="1.7" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="116" y="170" text-anchor="end" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">x ≥ 1</text>
  <text x="264" y="158" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">y ≥ 1</text>

  <text x="196" y="284" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">两份都交出去 → 损失 0</text>

  <!-- 右：端点核 -->
  <rect x="356" y="54" width="336" height="250" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="524" y="76" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">端点核：只有一侧有邻居</text>

  <rect x="398" y="152" width="66" height="42" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.3" filter="url(#rough2)"/>
  <text x="431" y="180" text-anchor="middle" font-size="17" font-weight="bold" fill="#a14340" filter="url(#rough2)">m</text>
  <rect x="530" y="152" width="66" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="563" y="180" text-anchor="middle" font-size="15" fill="#2f5d22" filter="url(#rough2)">…</text>

  <rect x="382" y="96" width="76" height="28" rx="8" fill="#ffffff" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="420" y="115" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">环境</text>
  <path d="M 424 148 L 440 128" stroke="#b85450" stroke-width="1.7" stroke-dasharray="5 3" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="462" y="138" font-size="11" fill="#a14340" filter="url(#rough2)">x 丢失</text>

  <path d="M 468 173 L 524 173" stroke="#4a7a3a" stroke-width="1.7" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="470" y="166" font-size="11" fill="#3c5e2e" filter="url(#rough2)">y = m − x</text>

  <text x="524" y="238" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">没有邻居的那一份必然丢失，丢的量 ≥ 1</text>
  <text x="524" y="262" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">取 x = 1（或 y = 1）即可只丢 1</text>
  <text x="524" y="286" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">前提：被拆的核质量 ≥ 2</text>

  <!-- 底部结论 -->
  <rect x="28" y="318" width="664" height="98" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="344" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">答案 = 总质量 Σa − 最少的「端点删除」次数</text>
  <text x="360" y="368" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">端点删除：被拆的核在拆除那一刻正处于队首或队尾</text>
  <text x="360" y="392" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">最后一步只剩 2 个核，两个都是端点 ⟹ 损失至少 1，故答案 ≤ Σa − 1</text>
</svg>
