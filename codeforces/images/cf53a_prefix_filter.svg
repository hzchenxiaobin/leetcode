<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420">
<defs>
  <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs>
<rect x="0" y="0" width="760" height="420" fill="#fafafa"/>
<text x="380.0" y="34" font-size="22" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="bold" text-anchor="middle" filter="url(#rough2)">前缀过滤，再取字典序最小</text>
<rect x="40" y="90" width="180" height="50" rx="8" fill="#fff4d6" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="130.0" y="120.6" font-size="16" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">输入前缀 s = "next"</text>
<rect x="70" y="170" width="260" height="46" rx="8" fill="#e6f4ea" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
<text x="200" y="200" font-size="16" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">nextpermutation</text>
<text x="350" y="200" font-size="15" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#2e7d32" font-weight="normal" text-anchor="start" filter="url(#rough2)">以 s 开头 ✓</text>
<rect x="70" y="232" width="260" height="46" rx="8" fill="#e6f4ea" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
<text x="200" y="262" font-size="16" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">nextelement</text>
<text x="350" y="262" font-size="15" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#2e7d32" font-weight="normal" text-anchor="start" filter="url(#rough2)">以 s 开头 ✓</text>
<rect x="70" y="294" width="260" height="46" rx="8" fill="#fde8e8" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
<text x="200" y="324" font-size="16" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">never</text>
<text x="350" y="324" font-size="15" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#c0392b" font-weight="normal" text-anchor="start" filter="url(#rough2)">不以 s 开头 ✗</text>
<rect x="470" y="170" width="240" height="46" rx="8" fill="#e8f0fe" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="590.0" y="198.6" font-size="16" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">候选：2 个</text>
<text x="470" y="250" font-size="15" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="normal" text-anchor="start" filter="url(#rough2)">逐字符比较：</text>
<text x="430" y="278" font-size="13" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="normal" text-anchor="start" filter="url(#rough2)">"nextelement" 与 "nextpermutation"</text>
<text x="470" y="304" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#c0392b" font-weight="normal" text-anchor="start" filter="url(#rough2)">第 5 个字符 e &lt; p</text>
<rect x="470" y="320" width="240" height="54" rx="8" fill="#f0e6fa" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="590.0" y="352.6" font-size="16" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">答案 "nextelement"</text>
</svg>
