  <rect x="86" y="80" width="26" height="26" rx="2" fill="#eef3fb" stroke="#9bb3cc" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="99.0" y="98" text-anchor="middle" font-size="10" fill="#5b5b5b" filter="url(#rough2)">2</text>
  <rect x="112" y="80" width="26" height="26" rx="2" fill="#eef3fb" stroke="#9bb3cc" stroke-width="1.0" filter="url(#rough2)"/>
