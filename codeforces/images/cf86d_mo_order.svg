  <text x="281.0" y="98" text-anchor="middle" font-size="10" fill="#5b5b5b" filter="url(#rough2)">9</text>
  <rect x="294" y="80" width="26" height="26" rx="2" fill="#e9f4ec" stroke="#9bb3cc" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="307.0" y="98" text-anchor="middle" font-size="10" fill="#5b5b5b" filter="url(#rough2)">10</text>
  <rect x="320" y="80" width="26" height="26" rx="2" fill="#e9f4ec" stroke="#9bb3cc" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="333.0" y="98" text-anchor="middle" font-size="10" fill="#5b5b5b" filter="url(#rough2)">11</text>
  <rect x="346" y="80" width="26" height="26" rx="2" fill="#e9f4ec" stroke="#9bb3cc" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="359.0" y="98" text-anchor="middle" font-size="10" fill="#5b5b5b" filter="url(#rough2)">12</text>
  <rect x="372" y="80" width="26" height="26" rx="2" fill="#eef3fb" stroke="#9bb3cc" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="385.0" y="98" text-anchor="middle" font-size="10" fill="#5b5b5b" filter="url(#rough2)">13</text>
  <rect x="398" y="80" width="26" height="26" rx="2" fill="#eef3fb" stroke="#9bb3cc" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="411.0" y="98" text-anchor="middle" font-size="10" fill="#5b5b5b" filter="url(#rough2)">14</text>
  <rect x="424" y="80" width="26" height="26" rx="2" fill="#eef3fb" stroke="#9bb3cc" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="437.0" y="98" text-anchor="middle" font-size="10" fill="#5b5b5b" filter="url(#rough2)">15</text>
  <rect x="450" y="80" width="26" height="26" rx="2" fill="#eef3fb" stroke="#9bb3cc" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="463.0" y="98" text-anchor="middle" font-size="10" fill="#5b5b5b" filter="url(#rough2)">16</text>
  <rect x="476" y="80" width="26" height="26" rx="2" fill="#eef3fb" stroke="#9bb3cc" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="489.0" y="98" text-anchor="middle" font-size="10" fill="#5b5b5b" filter="url(#rough2)">17</text>
  <rect x="502" y="80" width="26" height="26" rx="2" fill="#eef3fb" stroke="#9bb3cc" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="515.0" y="98" text-anchor="middle" font-size="10" fill="#5b5b5b" filter="url(#rough2)">18</text>
  <rect x="528" y="80" width="26" height="26" rx="2" fill="#e9f4ec" stroke="#9bb3cc" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="541.0" y="98" text-anchor="middle" font-size="10" fill="#5b5b5b" filter="url(#rough2)">19</text>
  <rect x="554" y="80" width="26" height="26" rx="2" fill="#e9f4ec" stroke="#9bb3cc" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="567.0" y="98" text-anchor="middle" font-size="10" fill="#5b5b5b" filter="url(#rough2)">20</text>
  <rect x="580" y="80" width="26" height="26" rx="2" fill="#e9f4ec" stroke="#9bb3cc" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="593.0" y="98" text-anchor="middle" font-size="10" fill="#5b5b5b" filter="url(#rough2)">21</text>
  <rect x="606" y="80" width="26" height="26" rx="2" fill="#e9f4ec" stroke="#9bb3cc" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="619.0" y="98" text-anchor="middle" font-size="10" fill="#5b5b5b" filter="url(#rough2)">22</text>
  <rect x="632" y="80" width="26" height="26" rx="2" fill="#e9f4ec" stroke="#9bb3cc" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="645.0" y="98" text-anchor="middle" font-size="10" fill="#5b5b5b" filter="url(#rough2)">23</text>
  <rect x="658" y="80" width="26" height="26" rx="2" fill="#e9f4ec" stroke="#9bb3cc" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="671.0" y="98" text-anchor="middle" font-size="10" fill="#5b5b5b" filter="url(#rough2)">24</text>
  <text x="138" y="124" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">块 1</text>
  <line x1="60" y1="132" x2="216" y2="132" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="294" y="124" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">块 2</text>
  <line x1="216" y1="132" x2="372" y2="132" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="450" y="124" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">块 3</text>
  <line x1="372" y1="132" x2="528" y2="132" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="606" y="124" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">块 4</text>
  <line x1="528" y1="132" x2="684" y2="132" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="160" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">排序规则：(l 所在块编号, r) —— 块编号为奇数时 r 降序，偶数时 r 升序</text>
  <rect x="60" y="190" width="90" height="30" rx="5" fill="#ffffff" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="105" y="210" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">[1, 1]</text>
  <text x="160" y="210" text-anchor="start" font-size="14" fill="#b85450" filter="url(#rough2)">→</text>
  <rect x="60" y="226" width="90" height="30" rx="5" fill="#ffffff" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="105" y="246" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">[1, 2]</text>
  <text x="160" y="246" text-anchor="start" font-size="14" fill="#b85450" filter="url(#rough2)">→</text>
  <rect x="60" y="262" width="90" height="30" rx="5" fill="#ffffff" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="105" y="282" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">[2, 2]</text>
  <text x="160" y="282" text-anchor="start" font-size="14" fill="#b85450" filter="url(#rough2)">→</text>
  <rect x="60" y="298" width="90" height="30" rx="5" fill="#ffffff" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="105" y="318" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">[2, 3]</text>
  <text x="160" y="318" text-anchor="start" font-size="14" fill="#b85450" filter="url(#rough2)">←</text>
  <rect x="60" y="334" width="90" height="30" rx="5" fill="#ffffff" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="105" y="354" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">[2, 4]</text>
  <text x="160" y="354" text-anchor="start" font-size="14" fill="#b85450" filter="url(#rough2)">←</text>
  <rect x="60" y="370" width="90" height="30" rx="5" fill="#ffffff" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="105" y="390" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">[3, 4]</text>
  <text x="160" y="390" text-anchor="start" font-size="14" fill="#b85450" filter="url(#rough2)">←</text>
  <rect x="260" y="190" width="460" height="120" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="276" y="216" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">指针移动总次数：</text>
  <text x="276" y="240" text-anchor="start" font-size="12" fill="#2f4a66" filter="url(#rough2)">左端点：每个询问至多跨一个块，总计 O(n·√t)</text>
  <text x="276" y="264" text-anchor="start" font-size="12" fill="#2f4a66" filter="url(#rough2)">右端点：同块内单调，每块至多 n，总计 O(n·√t)</text>
  <text x="276" y="288" text-anchor="start" font-size="12" fill="#2f4a66" filter="url(#rough2)">合起来 O((n + t)·√n)，取块长 B ≈ n/√t</text>
  <text x="60" y="350" text-anchor="start" font-size="12" fill="#5b5b5b" filter="url(#rough2)">奇数块反向排序（“蛇形”）是为了让右指针在块之间不用大跨度回摆，常数更小。</text>
  <rect x="60" y="366" width="660" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="76" y="392" text-anchor="start" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">本题 n, t ≤ 2·10⁵，块长约 450，总移动次数约 10⁸，5 s 时限足够。</text>
</svg>
