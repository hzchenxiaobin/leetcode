<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="313"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="440" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">191E：每天取最大子段和 → 第 k 天拿到第 k 大子段和</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="90.0" y="90.0" width="70.0" height="50.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="125.0" y="122.0" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="180.0" y="90.0" width="70.0" height="50.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="215.0" y="122.0" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="270.0" y="90.0" width="70.0" height="50.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="305.0" y="122.0" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="120.0" y="180.0" text-anchor="start" font-size="11.5" fill="#444" filter="url(#rough2)">全部子段和降序：7, 6, 5, 4, 2, 1</text>
  <text x="120.0" y="210.0" text-anchor="start" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">k=4 → 第 4 大 = 4</text>
  <rect x="60.0" y="250.0" width="600.0" height="70.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="74.0" y="273.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">二分答案 X：统计「和 ≥ X」的子段个数 count(X)</text>
  <text x="74.0" y="299.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">count(X) ≥ k 的最大的 X 就是答案</text>
  <rect x="60.0" y="336.0" width="600.0" height="70.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="74.0" y="359.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">统计用前缀和：对每个 j 数 i&lt;j 且 P[i] ≤ P[j]-X</text>
  <text x="74.0" y="385.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">树状数组维护已插入的前缀和，O(n log n) 每次判定</text>
</svg>
