<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="640" height="430" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">宽 ≥ 2 的块怎么填：“块行”方案</text>

  <!-- piece a x b -->
  <g filter="url(#rough2)">
    <rect x="70" y="60" width="210" height="200" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <path d="M70,110 H280 M70,160 H280 M70,210 H280" stroke="#446688" stroke-width="1.2" fill="none"/>
    <path d="M150,60 V260 M220,60 V260" stroke="#446688" stroke-width="1.2" fill="none"/>
  </g>
  <g font-size="12" fill="#22384f" filter="url(#rough2)">
    <text x="84" y="85">x=0：1 … b</text>
    <text x="84" y="135">x=1：b+1 … 2b</text>
    <text x="84" y="185">x=2：2b+1 … 3b</text>
    <text x="84" y="235">…</text>
    <text x="162" y="285">列 y</text>
  </g>
  <text x="70" y="52" font-size="13" fill="#446688" filter="url(#rough2)">块 a × b</text>
  <text x="70" y="302" font-size="12" fill="#446688" filter="url(#rough2)">第 x 行 = 值块 [x·b+1, x·b+b] 的某个排列</text>

  <!-- left neighbour -->
  <rect x="24" y="110" width="34" height="50" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="41" y="140" text-anchor="middle" font-size="11" fill="#33602a" filter="url(#rough2)">左</text>
  <path d="M60,120 L74,120" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="70" y="112" font-size="11" fill="#446688" filter="url(#rough2)">右端 ≠ 它的右端</text>

  <!-- right 1-wide column -->
  <rect x="284" y="60" width="34" height="200" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="301" y="52" text-anchor="middle" font-size="11" fill="#8a6a10" filter="url(#rough2)">b=1</text>
  <path d="M280,100 L292,100" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="98" font-size="11" fill="#446688" filter="url(#rough2)">右端避开</text>
  <text x="330" y="114" font-size="11" fill="#446688" filter="url(#rough2)">已填好的 1 宽列</text>

  <!-- vertical safety -->
  <rect x="70" y="270" width="210" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="86" y="299" font-size="12" fill="#33602a" filter="url(#rough2)">下方块顶行 = 块 0（值 ≤ b）</text>
  <path d="M175,262 V266" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="292" y="285" font-size="12" fill="#33602a" filter="url(#rough2)">本块底行 = 块 a-1（值 ≥ b+1）⇒ 值域不相交，自动合法</text>

  <!-- notes -->
  <rect x="330" y="126" width="290" height="120" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <g font-size="12" fill="#7a2a26" filter="url(#rough2)">
    <text x="344" y="150">每行最多两个约束：</text>
    <text x="344" y="172">· 左端 ≠ 左邻居右端（1 个值）</text>
    <text x="344" y="194">· 右端 ≠ 已填 1 宽列（1 个值）</text>
    <text x="344" y="216">b ≥ 3 随便挑；b = 2 全都撞上时，</text>
    <text x="344" y="236">把该块的行置换一下（换值块）即可。</text>
  </g>

  <text x="330" y="330" font-size="12" fill="#446688" filter="url(#rough2)">整块只需 O(a·b) 时间：每行一次线性构造 + 少量交换修补</text>
</svg>
