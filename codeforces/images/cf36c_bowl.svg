<svg xmlns="http://www.w3.org/2000/svg" width="720" height="410" viewBox="0 0 720 410"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="410" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">碗的截面：半径随高度线性增长</text>
  <path d="M 190 42 Q 360 48 530 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <line x1="300" y1="80" x2="300" y2="360" stroke="#888" stroke-width="1.2" stroke-dasharray="6 5" filter="url(#rough2)"/>
  <text x="312" y="70" font-size="10.5" fill="#888" filter="url(#rough2)">中轴</text>

  <!-- 碗截面 -->
  <path d="M 140 130 L 240 330 L 360 330 L 460 130" fill="#e8f0fe" fill-opacity="0.5" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <line x1="240" y1="330" x2="360" y2="330" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>

  <!-- r -->
  <line x1="240" y1="354" x2="360" y2="354" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="300" y="372" text-anchor="middle" font-size="11" fill="#a33a36" filter="url(#rough2)">底半径 r</text>

  <!-- R -->
  <line x1="140" y1="112" x2="460" y2="112" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="300" y="104" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">顶半径 R</text>

  <!-- h -->
  <line x1="490" y1="130" x2="490" y2="330" stroke="#446688" stroke-width="1.4" marker-start="url(#arrb)" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="500" y="236" font-size="11" fill="#2f4a66" filter="url(#rough2)">高 h</text>

  <text x="510" y="150" font-size="11" fill="#2b2b2b" filter="url(#rough2)">f(z) = r + (R−r)·z/h</text>
  <text x="510" y="172" font-size="10.5" fill="#555" filter="url(#rough2)">z 从碗底算起</text>

  <rect x="40" y="388" width="640" height="0" fill="none"/>
  <g font-size="11.5" fill="#555" filter="url(#rough2)">
    <text x="40" y="398">碗壁厚度忽略：内表面与外表面就是同一条线段，两碗不穿透 ⇔ 重叠高度上半径不超过下方碗。</text>
  </g>
</svg>
