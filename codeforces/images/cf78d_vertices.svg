<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="51"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>
  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">一个格子的 6 个顶点：只需检查这 6 个点</text>
  <path d="M 150 44 Q 360 50 570 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <polygon points="466.0,148.3 420.0,68.7 328.0,68.7 282.0,148.3 328.0,228.0 420.0,228.0" fill="#f2f2ee" stroke="#b9b9b0" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <polygon points="328.0,68.7 282.0,-11.0 190.0,-11.0 144.0,68.7 190.0,148.3 282.0,148.3" fill="#f2f2ee" stroke="#b9b9b0" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <polygon points="190.0,307.7 144.0,228.0 52.0,228.0 6.0,307.7 52.0,387.3 144.0,387.3" fill="#f2f2ee" stroke="#b9b9b0" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <polygon points="328.0,387.3 282.0,307.7 190.0,307.7 144.0,387.3 190.0,467.0 282.0,467.0" fill="#f2f2ee" stroke="#b9b9b0" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <polygon points="466.0,307.7 420.0,228.0 328.0,228.0 282.0,307.7 328.0,387.3 420.0,387.3" fill="#f2f2ee" stroke="#b9b9b0" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <polygon points="190.0,148.3 144.0,68.7 52.0,68.7 6.0,148.3 52.0,228.0 144.0,228.0" fill="#f2f2ee" stroke="#b9b9b0" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <polygon points="328.0,228.0 282.0,148.3 190.0,148.3 144.0,228.0 190.0,307.7 282.0,307.7" fill="#e6f0dd" stroke="#4a7a3a" stroke-width="2.0" filter="url(#rough2)"/>
  <circle cx="328.0" cy="228.0" r="4.2" fill="#c0504d" stroke="#8c2f2c" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="282.0" cy="148.3" r="4.2" fill="#c0504d" stroke="#8c2f2c" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="190.0" cy="148.3" r="4.2" fill="#c0504d" stroke="#8c2f2c" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="144.0" cy="228.0" r="4.2" fill="#c0504d" stroke="#8c2f2c" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="190.0" cy="307.7" r="4.2" fill="#c0504d" stroke="#8c2f2c" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="282.0" cy="307.7" r="4.2" fill="#c0504d" stroke="#8c2f2c" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="236" y="234" text-anchor="middle" font-size="12.5" fill="#2f5223" filter="url(#rough2)">C = (3a/2, √3 q/2)</text>
  <circle cx="236" cy="228" r="3.4" fill="#2f5223" filter="url(#rough2)"/>
  <line x1="236" y1="228" x2="328" y2="228" stroke="#c0504d" stroke-width="1.5" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="282.0" y="220" text-anchor="middle" font-size="11.5" fill="#8c2f2c" filter="url(#rough2)">外接半径 1</text>
  <line x1="236" y1="228" x2="374.0" y2="148.3" stroke="#5a7fb0" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="315.12" y="140.60000000000002" text-anchor="middle" font-size="11.5" fill="#335478" filter="url(#rough2)">相邻格心 √3</text>
  <rect x="392" y="86" width="300" height="216" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="542" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">把 6 条顶点不等式乘 4 去分母</text>
  <text x="542" y="142" text-anchor="middle" font-size="12.5" fill="#335478" filter="url(#rough2)">(3a+2)² + 3q² ≤ 4k²</text>
  <text x="542" y="166" text-anchor="middle" font-size="12.5" fill="#335478" filter="url(#rough2)">(3a−2)² + 3q² ≤ 4k²</text>
  <text x="542" y="190" text-anchor="middle" font-size="12.5" fill="#335478" filter="url(#rough2)">(3a+1)² + 3(q+1)² ≤ 4k²</text>
  <text x="542" y="214" text-anchor="middle" font-size="12.5" fill="#335478" filter="url(#rough2)">(3a+1)² + 3(q−1)² ≤ 4k²</text>
  <text x="542" y="238" text-anchor="middle" font-size="12.5" fill="#335478" filter="url(#rough2)">(3a−1)² + 3(q+1)² ≤ 4k²</text>
  <text x="542" y="262" text-anchor="middle" font-size="12.5" fill="#335478" filter="url(#rough2)">(3a−1)² + 3(q−1)² ≤ 4k²</text>
  <text x="542" y="288" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">q = a + 2b，与 a 同奇偶</text>
  <text x="360" y="336" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">格心 C(a,b) = (3a/2, √3(a/2+b))，顶点集 V = {(±1,0), (±½, ±√3/2)}</text>
  <text x="360" y="362" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">相邻格心距离 √3；顶点到格心距离 1；边心距 √3/2 ≈ 0.866</text>
  <text x="360" y="396" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">正六边形与圆盘都凸 ⇒ 六边形全在圆内 ⟺ 6 个顶点全在圆内</text>
</svg>
