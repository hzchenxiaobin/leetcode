<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="61"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <pattern id="hatch2" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#c9a0a0" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="860" height="420" fill="#fafafa"/>

  <text x="430" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">到达时：最长空闲段、并列取最右、再取中间靠右</text>
  <text x="430" y="56" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">12 个钩子，3 号与 8 号已被占用</text>

  <g filter="url(#rough2)">
    <rect x="60" y="140" width="60" height="50" fill="#ffffff" stroke="#888888" stroke-width="1.4"/>
    <rect x="120" y="140" width="60" height="50" fill="#ffffff" stroke="#888888" stroke-width="1.4"/>
    <rect x="180" y="140" width="60" height="50" fill="url(#hatch2)" stroke="#b85450" stroke-width="1.8"/>
    <rect x="240" y="140" width="60" height="50" fill="#ffffff" stroke="#888888" stroke-width="1.4"/>
    <rect x="300" y="140" width="60" height="50" fill="#ffffff" stroke="#888888" stroke-width="1.4"/>
    <rect x="360" y="140" width="60" height="50" fill="#ffffff" stroke="#888888" stroke-width="1.4"/>
    <rect x="420" y="140" width="60" height="50" fill="#ffffff" stroke="#888888" stroke-width="1.4"/>
    <rect x="480" y="140" width="60" height="50" fill="url(#hatch2)" stroke="#b85450" stroke-width="1.8"/>
    <rect x="540" y="140" width="60" height="50" fill="#ffffff" stroke="#888888" stroke-width="1.4"/>
    <rect x="600" y="140" width="60" height="50" fill="#ffffff" stroke="#888888" stroke-width="1.4"/>
    <rect x="660" y="140" width="60" height="50" fill="#ffffff" stroke="#888888" stroke-width="1.4"/>
    <rect x="720" y="140" width="60" height="50" fill="#ffffff" stroke="#888888" stroke-width="1.4"/>

    <g text-anchor="middle" font-size="11" fill="#777777">
      <text x="90" y="208">1</text><text x="150" y="208">2</text><text x="210" y="208">3</text>
      <text x="270" y="208">4</text><text x="330" y="208">5</text><text x="390" y="208">6</text>
      <text x="450" y="208">7</text><text x="510" y="208">8</text><text x="570" y="208">9</text>
      <text x="630" y="208">10</text><text x="690" y="208">11</text><text x="750" y="208">12</text>
    </g>

    <!-- 空闲段括号 -->
    <path d="M 62 128 L 62 116 L 178 116 L 178 128" stroke="#4a7a3a" stroke-width="1.6" fill="none"/>
    <text x="120" y="108" text-anchor="middle" font-size="10.5" fill="#2f5223">长 2</text>

    <path d="M 242 128 L 242 116 L 478 116 L 478 128" stroke="#4a7a3a" stroke-width="1.6" fill="none"/>
    <text x="360" y="108" text-anchor="middle" font-size="10.5" fill="#2f5223">长 4</text>

    <path d="M 542 128 L 542 116 L 778 116 L 778 128" stroke="#b85450" stroke-width="2.2" fill="none"/>
    <text x="660" y="108" text-anchor="middle" font-size="10.5" fill="#8a2b28">长 4（最靠右，被选中）</text>

    <!-- 中点 -->
    <path d="M 690 196 L 690 236" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="700" y="240" font-size="12" fill="#2f4a66">pos = 9 + ⌊4/2⌋ = 11</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="270" width="740" height="118" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="76" y="296" font-size="11.5" fill="#8a6015">规则回顾：在所有"连续空闲钩子段"中，① 取最长；② 长度并列取最靠右；③ 挂在段中间，偶数长度取靠右的中点。</text>
    <text x="76" y="322" font-size="11.5" fill="#8a6015">用 set&lt;(长度, 起点)&gt; 维护这些段，取最大元素即同时满足 ① ②；长度为 len 的段起点为 s 时，挂点就是 s + ⌊len/2⌋。</text>
    <text x="76" y="348" font-size="11.5" fill="#8a6015">离开时把该钩子标为空闲，并把它左右相邻的空闲段合并；询问时只需要"区间内被占用钩子数"。</text>
    <text x="76" y="374" font-size="11" fill="#9a7020">例：段 [1,4] 长度 4，两个中点是 2、3，应选 3；写成 s + (len−1)/2 会错选 2。</text>
  </g>
</svg>
