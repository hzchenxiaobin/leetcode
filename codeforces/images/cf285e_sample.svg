<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="373"/>
    <feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></defs>
  <rect width="700" height="300" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">n = 3 的 g[j] 与反演</text>
  <path d="M 180 40 Q 350 46 520 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="86" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="12.5" fill="#22314a" filter="url(#rough2)">好格子（行 i，列 i±1）：(1,2)、(2,1)、(2,3)、(3,2)。</text>
  <text x="76" y="106" font-size="12.5" fill="#22314a" filter="url(#rough2)">g[0]=1；g[1]=4（4 个格子任选）；g[2]=? 互不冲突的两格：{(1,2),(2,3)}、{(1,2),(3,2)} 冲突（同列 2）…</text>
  <text x="76" y="130" font-size="12" fill="#2f4a66" filter="url(#rough2)">逐一枚举得 g[2]=2、g[3]=0（三行三列必冲突）。</text>
  <g filter="url(#rough2)"><rect x="60" y="152" width="580" height="86" rx="8" fill="#e8f4e0" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="176" font-size="12.5" fill="#2f5223" filter="url(#rough2)">恰好 2 个好：Σ_{j≥2} (−1)^{j−2} C(j,2) g[j] (3−j)! = C(2,2)·2·1! = 2？</text>
  <text x="76" y="200" font-size="12.5" fill="#2f5223" filter="url(#rough2)">但样例说 n=3,k=2 答案是 4 —— 说明 g 要按"带上所有格子"精确统计（含 (1,2)&amp;(2,3) 这种同列？</text>
  <text x="76" y="224" font-size="12" fill="#3c5e2e" filter="url(#rough2)">实测程序给出 4 ✓：g[2] 实际为 4（同列冲突只在列相同，而 (1,2),(2,3) 列不同 ✓）。</text>
  <g filter="url(#rough2)"><rect x="60" y="248" width="580" height="34" rx="8" fill="#fbeeee" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="76" y="270" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">所以 DP 里"同列不能同时选 up/down"是关键约束，别漏。</text>
</svg>
