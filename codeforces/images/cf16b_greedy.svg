<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="420" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按每个盒子的火柴数从大到小取</text>
  <path d="M 155 44 Q 360 50 565 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 左：原始容器 -->
  <text x="46" y="78" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">仓库（3 个容器）</text>
  <text x="46" y="112" font-size="12" fill="#2b2b2b" filter="url(#rough2)">容器 1：5 盒 × 10 根</text>
  <g fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)">
    <rect x="46" y="120" width="24" height="24"/><rect x="74" y="120" width="24" height="24"/>
    <rect x="102" y="120" width="24" height="24"/><rect x="130" y="120" width="24" height="24"/>
    <rect x="158" y="120" width="24" height="24"/>
  </g>
  <text x="46" y="186" font-size="12" fill="#2b2b2b" filter="url(#rough2)">容器 2：2 盒 × 5 根</text>
  <g fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" filter="url(#rough2)">
    <rect x="46" y="194" width="24" height="24"/><rect x="74" y="194" width="24" height="24"/>
  </g>
  <text x="46" y="260" font-size="12" fill="#2b2b2b" filter="url(#rough2)">容器 3：3 盒 × 6 根</text>
  <g fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" filter="url(#rough2)">
    <rect x="46" y="268" width="24" height="24"/><rect x="74" y="268" width="24" height="24"/>
    <rect x="102" y="268" width="24" height="24"/>
  </g>

  <!-- 排序箭头 -->
  <path d="M 235 200 L 330 200" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="282" y="190" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">按每盒根数</text>
  <text x="282" y="220" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">降序排列</text>

  <!-- 右：排序后 -->
  <text x="360" y="78" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">排好序：越靠前越值得拿</text>
  <text x="360" y="112" font-size="12" fill="#2b2b2b" filter="url(#rough2)">① 10 根（5 盒）→ 取 5 盒</text>
  <g fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" filter="url(#rough2)">
    <rect x="360" y="120" width="24" height="24"/><rect x="388" y="120" width="24" height="24"/>
    <rect x="416" y="120" width="24" height="24"/><rect x="444" y="120" width="24" height="24"/>
    <rect x="472" y="120" width="24" height="24"/>
  </g>
  <text x="360" y="186" font-size="12" fill="#2b2b2b" filter="url(#rough2)">② 6 根（3 盒）→ 只剩 2 盒可取</text>
  <g fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" filter="url(#rough2)">
    <rect x="360" y="194" width="24" height="24"/><rect x="388" y="194" width="24" height="24"/>
    <rect x="416" y="194" width="24" height="24" opacity="0.35"/>
  </g>
  <text x="360" y="260" font-size="12" fill="#2b2b2b" filter="url(#rough2)">③ 5 根（2 盒）→ 背包已满，不取</text>
  <g fill="#fde8e8" stroke="#b85450" stroke-width="1.1" filter="url(#rough2)">
    <rect x="360" y="268" width="24" height="24" opacity="0.5"/><rect x="388" y="268" width="24" height="24" opacity="0.5"/>
  </g>

  <rect x="40" y="318" width="640" height="72" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="348" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">背包 n = 7：5 × 10 + 2 × 6 = 62 根</text>
  <text x="56" y="374" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">若先取 5 根的盒子，会浪费容量——高 b 的盒子永远优先。</text>
</svg>
