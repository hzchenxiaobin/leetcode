<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr5" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="760" height="460" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 5 演算（n = 9，D = 5，h = 2，中心边 1–2）</text>
  <path d="M 100 40 Q 380 47 660 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <rect x="18" y="54" width="386" height="330" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- 样例 5 的树 -->
  <path d="M 186 120 L 264 120" stroke="#b85450" stroke-width="3.4" fill="none" filter="url(#rough2)"/>
  <path d="M 170 130 L 118 185" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 180 134 L 205 183" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 110 203 L 82 258" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 215 203 L 238 258" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 280 130 L 342 185" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 346 203 L 318 258" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 358 199 L 384 258" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <ellipse cx="170" cy="120" rx="16" ry="16" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <ellipse cx="280" cy="120" rx="16" ry="16" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="170" y="125" text-anchor="middle" font-size="12.5" fill="#7d2b26" filter="url(#rough2)">1</text>
  <text x="280" y="125" text-anchor="middle" font-size="12.5" fill="#7d2b26" filter="url(#rough2)">2</text>

  <ellipse cx="110" cy="195" rx="15" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.9" filter="url(#rough2)"/>
  <ellipse cx="215" cy="195" rx="15" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.9" filter="url(#rough2)"/>
  <ellipse cx="350" cy="195" rx="15" ry="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="110" y="200" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">3</text>
  <text x="215" y="200" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">4</text>
  <text x="350" y="200" text-anchor="middle" font-size="12" fill="#31602c" filter="url(#rough2)">7</text>

  <ellipse cx="75" cy="270" rx="15" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.9" filter="url(#rough2)"/>
  <ellipse cx="245" cy="270" rx="15" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.9" filter="url(#rough2)"/>
  <ellipse cx="310" cy="270" rx="15" ry="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.9" filter="url(#rough2)"/>
  <ellipse cx="390" cy="270" rx="15" ry="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="75" y="275" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">5</text>
  <text x="245" y="275" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">6</text>
  <text x="310" y="275" text-anchor="middle" font-size="12" fill="#31602c" filter="url(#rough2)">8</text>
  <text x="390" y="275" text-anchor="middle" font-size="12" fill="#31602c" filter="url(#rough2)">9</text>

  <path d="M 225 96 L 225 78" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr5)" filter="url(#rough2)"/>
  <text x="225" y="72" text-anchor="middle" font-size="11.5" fill="#7d2b26" filter="url(#rough2)">中心边</text>

  <text x="30" y="316" text-anchor="start" font-size="11" fill="#2f4a66" filter="url(#rough2)">A 侧：最深点 5、6（深度 2），节点 1 有两个孩子 ⇒ 0 ∈ Q_A</text>
  <text x="30" y="338" text-anchor="start" font-size="11" fill="#31602c" filter="url(#rough2)">B 侧：最深点 8、9（深度 2），节点 7 才是分支 ⇒ 1 ∈ Q_B</text>
  <text x="30" y="362" text-anchor="start" font-size="11" fill="#7d2b26" filter="url(#rough2)">节点 2 只有一个孩子 7 含最深点 ⇒ 0 ∉ Q_B</text>

  <!-- 右侧：组合表 -->
  <text x="576" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">Q_A = {0, 2}，Q_B = {1, 2}</text>

  <rect x="416" y="88" width="322" height="36" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="470" y="112" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">a</text>
  <text x="540" y="112" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">b</text>
  <text x="616" y="112" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">k = a + 1 + b</text>
  <text x="694" y="112" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">可达</text>

  <rect x="416" y="130" width="322" height="32" rx="7" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="470" y="151" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">0</text>
  <text x="540" y="151" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">1</text>
  <text x="616" y="151" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">2</text>
  <text x="694" y="151" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <rect x="416" y="168" width="322" height="32" rx="7" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="470" y="189" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">0</text>
  <text x="540" y="189" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">2</text>
  <text x="616" y="189" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">3</text>
  <text x="694" y="189" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <rect x="416" y="206" width="322" height="32" rx="7" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="470" y="227" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">2</text>
  <text x="540" y="227" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">1</text>
  <text x="616" y="227" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">4</text>
  <text x="694" y="227" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <rect x="416" y="244" width="322" height="32" rx="7" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="470" y="265" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">2</text>
  <text x="540" y="265" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">2</text>
  <text x="616" y="265" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">5</text>
  <text x="694" y="265" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <rect x="416" y="288" width="322" height="34" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="470" y="310" text-anchor="middle" font-size="12" fill="#7d2b26" filter="url(#rough2)">0</text>
  <text x="540" y="310" text-anchor="middle" font-size="12" fill="#7d2b26" filter="url(#rough2)">0</text>
  <text x="616" y="310" text-anchor="middle" font-size="12" fill="#7d2b26" filter="url(#rough2)">1</text>
  <text x="694" y="310" text-anchor="middle" font-size="12" fill="#7d2b26" filter="url(#rough2)">✗</text>

  <rect x="416" y="336" width="322" height="46" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="576" y="357" text-anchor="middle" font-size="13" fill="#31602c" filter="url(#rough2)">4 个可达值 ⇒ 输出</text>
  <text x="576" y="375" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#31602c" filter="url(#rough2)">4  2 3 4 5</text>

  <rect x="18" y="398" width="720" height="50" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="378" y="420" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">注意答案不是区间：k 可能跳号，所以要取 Minkowski 和而不是「1 到某个上界」</text>
  <text x="378" y="439" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">反例见样例 4：Q_A = Q_B = {0, 2} ⇒ 只能得到 k = 1, 3, 5</text>
</svg>
