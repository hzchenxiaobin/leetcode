<svg xmlns="http://www.w3.org/2000/svg" width="880" height="280" viewBox="0 0 880 280"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="280" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1：放成 蓝红红红</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">Petya 先放蓝，之后全是红 → 同色对 2、异色对 1</text>
  <g filter="url(#rough2)"><rect x="200" y="110" width="72" height="46" rx="4" fill="#cfe0f0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="236.0" y="139.12" text-anchor="middle" font-size="17" fill="#2b2b2b" filter="url(#rough2)">B</text>
  <g filter="url(#rough2)"><rect x="290" y="110" width="72" height="46" rx="4" fill="#f6d9d7" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="326.0" y="139.12" text-anchor="middle" font-size="17" fill="#2b2b2b" filter="url(#rough2)">R</text>
  <g filter="url(#rough2)"><rect x="380" y="110" width="72" height="46" rx="4" fill="#f6d9d7" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="416.0" y="139.12" text-anchor="middle" font-size="17" fill="#2b2b2b" filter="url(#rough2)">R</text>
  <g filter="url(#rough2)"><rect x="470" y="110" width="72" height="46" rx="4" fill="#f6d9d7" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="506.0" y="139.12" text-anchor="middle" font-size="17" fill="#2b2b2b" filter="url(#rough2)">R</text>
  <text x="440" y="210" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">边界：B-R（异色）, R-R（同色）, R-R（同色）</text>
  <text x="440" y="250" text-anchor="middle" font-size="14" fill="#3d6b2f" filter="url(#rough2)">Petya 2 分，Vasya 1 分</text>
</svg>
