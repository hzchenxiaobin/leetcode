<svg xmlns="http://www.w3.org/2000/svg" width="770" height="380" viewBox="0 0 770 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="770" height="380" fill="#fafafa"/>
  <text x="385.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两步一组的矩阵：把 k 从 10^18 降到一次 3×3 快速幂</text>
  <path d="M 144.8950000000001 46 Q 385.0 52 625.1049999999999 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="120.0" y="96.0" width="74.0" height="46.0" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="157.0" y="125.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#33506e" filter="url(#rough2)">2</text>
  <rect x="194.0" y="96.0" width="74.0" height="46.0" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="231.0" y="125.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#33506e" filter="url(#rough2)">1</text>
  <rect x="268.0" y="96.0" width="74.0" height="46.0" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="305.0" y="125.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#33506e" filter="url(#rough2)">c₁+c₂</text>
  <rect x="120.0" y="142.0" width="74.0" height="46.0" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="157.0" y="171.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#33506e" filter="url(#rough2)">1</text>
  <rect x="194.0" y="142.0" width="74.0" height="46.0" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="231.0" y="171.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#33506e" filter="url(#rough2)">1</text>
  <rect x="268.0" y="142.0" width="74.0" height="46.0" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="305.0" y="171.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#33506e" filter="url(#rough2)">c₁</text>
  <rect x="120.0" y="188.0" width="74.0" height="46.0" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="157.0" y="217.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#33506e" filter="url(#rough2)">0</text>
  <rect x="194.0" y="188.0" width="74.0" height="46.0" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="231.0" y="217.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#33506e" filter="url(#rough2)">0</text>
  <rect x="268.0" y="188.0" width="74.0" height="46.0" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="305.0" y="217.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#33506e" filter="url(#rough2)">1</text>
  <path d="M 116 100 L 116 232" stroke="#2b2b2b" stroke-width="2.0" fill="none" filter="url(#rough2)"/>
  <path d="M 342 100 L 342 232" stroke="#2b2b2b" stroke-width="2.0" fill="none" filter="url(#rough2)"/>
  <text x="231.0" y="82.0" text-anchor="middle" font-size="11.4" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">B（同一个 3×3 矩阵，幂次 q = (k−M)/2）</text>
  <text x="40.0" y="172.0" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">v_j =</text>
  <text x="40.0" y="196.0" text-anchor="start" font-size="11.4" fill="#2b2b2b" filter="url(#rough2)">(ans_j,</text>
  <text x="40.0" y="216.0" text-anchor="start" font-size="11.4" fill="#2b2b2b" filter="url(#rough2)"> ans_{j−1},</text>
  <text x="40.0" y="236.0" text-anchor="start" font-size="11.4" fill="#2b2b2b" filter="url(#rough2)"> 1)ᵀ</text>
  <path d="M 348.0 164.0 L 470.0 164.0" stroke="#5b8c5a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="478.0" y="160.0" text-anchor="start" font-size="12" font-weight="bold" fill="#2f5b34" filter="url(#rough2)">得 v_{j+2}</text>
  <text x="478.0" y="180.0" text-anchor="start" font-size="10.8" fill="#2f5b34" filter="url(#rough2)">j 与 M 同奇偶，</text>
  <text x="478.0" y="198.0" text-anchor="start" font-size="10.8" fill="#2f5b34" filter="url(#rough2)">c₁、c₂ 固定</text>
  <rect x="40.0" y="282.0" width="690.0" height="66.0" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="54.0" y="306.0" text-anchor="start" font-size="11.2" fill="#8a6015" filter="url(#rough2)">B 的第二行给出 ans_{j+1} = ans_j + ans_{j−1} + c_{j+1}，第一行再走一步得 ans_{j+2}。</text>
  <text x="54.0" y="330.0" text-anchor="start" font-size="11.2" fill="#8a6015" filter="url(#rough2)">若 (k−M) 是奇数，最后再单步补一次 cpar[k&amp;1]；两步矩阵从指数 0..q 一路幂上去。</text>
</svg>
