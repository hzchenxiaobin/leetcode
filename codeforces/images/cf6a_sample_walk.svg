<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="440" fill="#fafafa"/>

  <text x="380" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">样例走查：四根棍 4 2 1 3（每 1 单位 = 26 像素）</text>

  <!-- 四根棍 -->
  <rect x="56" y="58" width="104" height="20" rx="5" fill="#dbe7fb" stroke="#446688"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="108" y="73" text-anchor="middle" font-size="12" fill="#23405c" filter="url(#rough2)">4</text>
  <rect x="56" y="92" width="52" height="20" rx="5" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="82" y="107" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">2</text>
  <rect x="56" y="126" width="26" height="20" rx="5" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="69" y="141" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">1</text>
  <rect x="56" y="160" width="78" height="20" rx="5" fill="#fdeef0" stroke="#b85450"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="95" y="175" text-anchor="middle" font-size="12" fill="#8c3b37" filter="url(#rough2)">3</text>

  <text x="56" y="200" font-size="11" fill="#777" filter="url(#rough2)">长度按比例画：4 最长，1 最短</text>

  <!-- 四组候选 -->
  <path d="M 210 178 L 300 108" stroke="#446688" stroke-width="1.4" fill="none"
        marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="216" y="200" font-size="11" fill="#446688" filter="url(#rough2)">每次留下一根</text>

  <rect x="306" y="58" width="424" height="42" rx="8" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.3" filter="url(#rough2)"/>
  <text x="320" y="84" font-size="12" fill="#8a6015" filter="url(#rough2)">留 4 → (1,2,3)：1+2=3，取等 → 退化三角形</text>

  <rect x="306" y="106" width="424" height="42" rx="8" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.3" filter="url(#rough2)"/>
  <text x="320" y="132" font-size="12" fill="#8a6015" filter="url(#rough2)">留 2 → (1,3,4)：1+3=4，取等 → 退化三角形</text>

  <rect x="306" y="154" width="424" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="180" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">留 1 → (2,3,4)：2+3=5 &gt; 4 → 真三角形！</text>

  <rect x="306" y="202" width="424" height="42" rx="8" fill="#f4f4f4" stroke="#999999"
        stroke-width="1.3" filter="url(#rough2)"/>
  <text x="320" y="228" font-size="12" fill="#555" filter="url(#rough2)">留 3 → (1,2,4)：1+2=3 &lt; 4 → 拼不成</text>

  <!-- 结论 -->
  <path d="M 518 250 L 518 274" stroke="#4a7a3a" stroke-width="1.6" fill="none"
        marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="306" y="280" width="424" height="58" rx="9" fill="#eef4ff" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="322" y="304" font-size="12.5" fill="#23405c" filter="url(#rough2)">四组跑完：hasTriangle = true，hasSegment = true</text>
  <text x="322" y="326" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">按优先级取 hasTriangle → 输出 TRIANGLE</text>

  <!-- 右下对比：若提前返回 -->
  <rect x="306" y="350" width="424" height="72" rx="9" fill="#fdeef0" stroke="#b85450"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="322" y="374" font-size="12" fill="#8c3b37" filter="url(#rough2)">错误示范：在第二组「发现退化就 return」</text>
  <text x="322" y="396" font-size="12" fill="#8c3b37" filter="url(#rough2)">→ 输出 SEGMENT，可第三组明明能拼出面积</text>
  <text x="322" y="414" font-size="11" fill="#666" filter="url(#rough2)">所以循环里只置位、不返回，输出放到循环之外</text>

  <!-- 左侧小结 -->
  <rect x="40" y="222" width="238" height="200" rx="10" fill="#eef1f7" stroke="#7a8ca6"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="54" y="248" font-size="12.5" font-weight="bold" fill="#33445c" filter="url(#rough2)">四个三元组怎么来</text>
  <text x="54" y="272" font-size="11.5" fill="#44597a" filter="url(#rough2)">C(4,3) = 4：等价于「留下一根」</text>
  <text x="54" y="294" font-size="11.5" fill="#44597a" filter="url(#rough2)">留 4 → 取第 2,3,4 根</text>
  <text x="54" y="314" font-size="11.5" fill="#44597a" filter="url(#rough2)">留 2 → 取第 1,3,4 根</text>
  <text x="54" y="334" font-size="11.5" fill="#44597a" filter="url(#rough2)">留 1 → 取第 1,2,4 根</text>
  <text x="54" y="354" font-size="11.5" fill="#44597a" filter="url(#rough2)">留 3 → 取第 1,2,3 根</text>
  <text x="54" y="382" font-size="11.5" fill="#8c3b37" filter="url(#rough2)">同一根棍不能在一组里用两次，</text>
  <text x="54" y="400" font-size="11.5" fill="#8c3b37" filter="url(#rough2)">也不能把两根接起来充数。</text>
</svg>
