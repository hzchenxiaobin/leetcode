<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="337"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="300" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">面具 = 把数字里所有的 4 和 7 按原顺序抽出来</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">其余数字一律忽略；结果一定是幸运数字（或空）</text>
  <g filter="url(#rough2)"><rect x="90" y="110" width="80" height="64" rx="5" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="130" y="152" text-anchor="middle" font-size="18" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">7</text>
  <g filter="url(#rough2)"><rect x="178" y="110" width="80" height="64" rx="5" fill="#ffffff" fill-opacity="0.85" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="218" y="152" text-anchor="middle" font-size="18" fill="#666666" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="266" y="110" width="80" height="64" rx="5" fill="#ffffff" fill-opacity="0.85" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="306" y="152" text-anchor="middle" font-size="18" fill="#666666" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="354" y="110" width="80" height="64" rx="5" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="394" y="152" text-anchor="middle" font-size="18" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">7</text>
  <g filter="url(#rough2)"><rect x="442" y="110" width="80" height="64" rx="5" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="482" y="152" text-anchor="middle" font-size="18" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><rect x="530" y="110" width="80" height="64" rx="5" fill="#ffffff" fill-opacity="0.85" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="570" y="152" text-anchor="middle" font-size="18" fill="#666666" filter="url(#rough2)">9</text>
  <g filter="url(#rough2)"><rect x="618" y="110" width="80" height="64" rx="5" fill="#ffffff" fill-opacity="0.85" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="658" y="152" text-anchor="middle" font-size="18" fill="#666666" filter="url(#rough2)">9</text>
  <g filter="url(#rough2)"><rect x="706" y="110" width="80" height="64" rx="5" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="746" y="152" text-anchor="middle" font-size="18" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="450" y="204" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">抽出 7、7、4、4 ⇒ 7744</text>
  <g filter="url(#rough2)"><rect x="60" y="232" width="780" height="50" rx="6" fill="#f6e3c4" fill-opacity="0.5" stroke="#b06a1e" stroke-width="1.4"/></g>
  <text x="450" y="262" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">求最小 c &gt; a 使 mask(c) = b：从 a+1 逐个试，逐个算面具</text>
</svg>
