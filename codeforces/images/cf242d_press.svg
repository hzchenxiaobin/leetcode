<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="53"/>
    <feDisplacementMap in="SourceGraphic" scale="1.6"/></filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/></marker></defs>
  <rect width="720" height="360" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按下 v：v 自己与所有邻居的值都 +1</text>
  <g filter="url(#rough2)">
    <line x1="200" y1="150" x2="120" y2="90" stroke="#888" stroke-width="1.8"/>
    <line x1="200" y1="150" x2="120" y2="210" stroke="#888" stroke-width="1.8"/>
    <line x1="200" y1="150" x2="280" y2="90" stroke="#888" stroke-width="1.8"/>
    <line x1="200" y1="150" x2="280" y2="210" stroke="#888" stroke-width="1.8"/>
  </g>
  <circle cx="200" cy="150" r="26" fill="#fde8e8" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="200" y="157" text-anchor="middle" font-size="15" font-weight="bold" fill="#8c2f2b" filter="url(#rough2)">v</text>
  <circle cx="120" cy="90" r="20" fill="#ffffff" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="120" cy="210" r="20" fill="#ffffff" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="280" cy="90" r="20" fill="#ffffff" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="280" cy="210" r="20" fill="#ffffff" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="96" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">u1</text>
  <text x="120" y="216" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">u2</text>
  <text x="280" y="96" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">u3</text>
  <text x="280" y="216" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">u4</text>
  <path d="M 168 124 L 148 108" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 168 176 L 148 192" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 232 124 L 252 108" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 232 176 L 252 192" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="360" y="76" width="320" height="120" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="374" y="100" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">每个计数器的最终值</text>
  <text x="374" y="126" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">value(v) = x_v + Σ_{u ∈ N(v)} x_u</text>
  <text x="374" y="152" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">= 被按下的「闭邻域」里的按钮个数</text>
  <text x="374" y="176" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">x_v ∈ {0,1} 表示是否按下</text>

  <rect x="60" y="228" width="620" height="96" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="74" y="252" font-size="12" font-weight="bold" fill="#7a5a1b" filter="url(#rough2)">关键性质：值只会增加。</text>
  <text x="74" y="274" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">若某点未按下且当前值恰等于 a_v，就按下它：它的值立刻变成 a_v + 1，之后只会更大，永远安全。</text>
  <text x="74" y="296" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">按下它会抬高邻居的值，可能让某个未按下的邻居「恰好等于」它的 a_u —— 那就继续按下那个邻居。</text>
  <text x="74" y="318" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">每个点最多被按下一次，所以这个过程必然在 O(n + m) 步内结束，且结束时所有点都安全。</text>
</svg>
