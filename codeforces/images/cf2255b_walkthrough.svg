<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="900" height="470" fill="#fafafa"/>

  <text x="450" y="34" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">样例演算：s = 001010 的 5 段 run，按奇偶下标分成两组</text>

  <!-- s 与 run -->
  <rect x="118" y="56" width="42" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="139" y="85" text-anchor="middle" font-size="18" fill="#33506b" filter="url(#rough2)">0</text>
  <rect x="166" y="56" width="42" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="187" y="85" text-anchor="middle" font-size="18" fill="#33506b" filter="url(#rough2)">0</text>
  <rect x="214" y="56" width="42" height="42" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="235" y="85" text-anchor="middle" font-size="18" fill="#8a6420" filter="url(#rough2)">1</text>
  <rect x="262" y="56" width="42" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="283" y="85" text-anchor="middle" font-size="18" fill="#33506b" filter="url(#rough2)">0</text>
  <rect x="310" y="56" width="42" height="42" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="331" y="85" text-anchor="middle" font-size="18" fill="#8a6420" filter="url(#rough2)">1</text>
  <rect x="358" y="56" width="42" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="379" y="85" text-anchor="middle" font-size="18" fill="#33506b" filter="url(#rough2)">0</text>

  <path d="M120,106 L120,118 L206,118 L206,106" fill="none" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <path d="M216,106 L216,118 L254,118 L254,106" fill="none" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <path d="M264,106 L264,118 L302,118 L302,106" fill="none" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <path d="M312,106 L312,118 L350,118 L350,106" fill="none" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <path d="M360,106 L360,118 L398,118 L398,106" fill="none" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>

  <text x="163" y="136" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">b₀ = 2</text>
  <text x="235" y="136" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">b₁ = 1</text>
  <text x="283" y="136" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">b₂ = 1</text>
  <text x="331" y="136" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">b₃ = 1</text>
  <text x="379" y="136" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">b₄ = 1</text>

  <text x="163" y="158" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">偶</text>
  <text x="235" y="158" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">奇</text>
  <text x="283" y="158" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">偶</text>
  <text x="331" y="158" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">奇</text>
  <text x="379" y="158" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">偶</text>

  <!-- 表格 -->
  <rect x="56" y="182" width="424" height="168" rx="9" fill="#ffffff" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="76" y="208" font-size="14" fill="#555" filter="url(#rough2)">组</text>
  <text x="148" y="208" font-size="14" fill="#555" filter="url(#rough2)">run 长度</text>
  <text x="282" y="208" font-size="14" fill="#555" filter="url(#rough2)">S</text>
  <text x="318" y="208" font-size="14" fill="#555" filter="url(#rough2)">c</text>
  <text x="352" y="208" font-size="14" fill="#555" filter="url(#rough2)">组合因子</text>
  <path d="M66,218 L470,218" fill="none" stroke="#ccc" stroke-width="1.3" filter="url(#rough2)"/>

  <text x="76" y="246" font-size="14" fill="#446688" filter="url(#rough2)">偶数</text>
  <text x="148" y="246" font-size="14" fill="#33506b" filter="url(#rough2)">2, 1, 1</text>
  <text x="282" y="246" font-size="14" fill="#33506b" filter="url(#rough2)">4</text>
  <text x="318" y="246" font-size="14" fill="#33506b" filter="url(#rough2)">3</text>
  <text x="352" y="246" font-size="14" fill="#b85450" filter="url(#rough2)">C(3,2) = 3</text>

  <text x="76" y="288" font-size="14" fill="#4a7a3a" filter="url(#rough2)">奇数</text>
  <text x="148" y="288" font-size="14" fill="#3f6633" filter="url(#rough2)">1, 1</text>
  <text x="282" y="288" font-size="14" fill="#3f6633" filter="url(#rough2)">2</text>
  <text x="318" y="288" font-size="14" fill="#3f6633" filter="url(#rough2)">2</text>
  <text x="352" y="288" font-size="14" fill="#b85450" filter="url(#rough2)">C(1,1) = 1</text>

  <path d="M66,302 L470,302" fill="none" stroke="#ccc" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="76" y="332" font-size="15" fill="#8f3a36" filter="url(#rough2)">答案 = 3 × 1 = 3</text>

  <!-- 可达串 -->
  <rect x="506" y="182" width="358" height="168" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="685" y="208" text-anchor="middle" font-size="15" fill="#8f3a36" filter="url(#rough2)">枚举验证：恰好这 3 个串</text>
  <ellipse cx="548" cy="238" rx="6" ry="6" fill="#446688" filter="url(#rough2)"/>
  <text x="572" y="244" font-size="17" fill="#333" filter="url(#rough2)">001010（自身）</text>
  <ellipse cx="548" cy="280" rx="6" ry="6" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="572" y="286" font-size="17" fill="#333" filter="url(#rough2)">010010</text>
  <ellipse cx="548" cy="322" rx="6" ry="6" fill="#b85450" filter="url(#rough2)"/>
  <text x="572" y="328" font-size="17" fill="#333" filter="url(#rough2)">010100</text>

  <text x="450" y="390" text-anchor="middle" font-size="15" fill="#444" filter="url(#rough2)">S_e = 偶下标 run 的总长 = 2 + 1 + 1 = 4，c_e = 偶下标 run 的段数 = 3</text>
  <text x="450" y="416" text-anchor="middle" font-size="15" fill="#444" filter="url(#rough2)">S_o = 1 + 1 = 2，c_o = 2；隔板法：把 S 个字符切成 c 段，每段至少 1 个 ⇒ C(S−1, c−1)</text>
  <text x="450" y="442" text-anchor="middle" font-size="14" fill="#777" filter="url(#rough2)">自造对照：s = 011000（b = 1, 2, 3）⇒ C(3,1) × C(1,0) = 3，可达 000110 / 001100 / 011000</text>
</svg>
