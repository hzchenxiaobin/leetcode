<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="420" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="38" text-anchor="middle" font-size="18.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">28B：能互相交换的位置构成连通块</text>
  <path d="M 137 50 Q 380 56 623 50" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="86" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">把位置看成点：i 与 i±d_i（在 1..n 内）连边，得到一个无向图。</text>
  <text x="60" y="112" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">沿边交换 = 在同一个连通块内任意重排元素 ⇒ 值 v 只能待在 v 所在的连通块里。</text>
  <line x1="146" y1="220" x2="214" y2="220" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="266" y1="220" x2="334" y2="220" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="386" y1="220" x2="454" y2="220" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="506" y1="220" x2="574" y2="220" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="94" y="196" width="52" height="48" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="226" text-anchor="middle" font-size="12.5" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">i=1</text>
  <rect x="214" y="196" width="52" height="48" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240" y="226" text-anchor="middle" font-size="12.5" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">i=2</text>
  <rect x="334" y="196" width="52" height="48" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="226" text-anchor="middle" font-size="12.5" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">i=3</text>
  <rect x="454" y="196" width="52" height="48" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="480" y="226" text-anchor="middle" font-size="12.5" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">i=4</text>
  <rect x="574" y="196" width="52" height="48" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="600" y="226" text-anchor="middle" font-size="12.5" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">i=5</text>
  <rect x="60" y="280" width="640" height="100" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="76" y="306" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">判定：对每个位置 i，目标值 a[i] 与 i 必须在同一连通块（find(i) == find(a[i])）。</text>
  <text x="76" y="332" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">因为初始时值 v 就在位置 v 上，它要走到位置 i 当且仅当 v 与 i 连通。</text>
  <text x="76" y="358" text-anchor="start" font-size="12.5" fill="#2f5223" font-weight="bold" filter="url(#rough2)">全部满足输出 YES，否则 NO；用并查集 O(n α(n))。</text>
  <text x="60" y="404" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">例：n=5、d 全为 1 → 5 个位置连成一条链、只有一个连通块 → 任意排列都能达到。</text>
</svg>
