<svg xmlns="http://www.w3.org/2000/svg" width="880" height="660" viewBox="0 0 880 660"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="880" height="660" fill="#fafafa"/>

  <text x="440.0" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例走查：两个候选点，取张角更大（t 更小）的那个</text>
  <path d="M 150 42 Q 440.0 49 730 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <circle cx="250.0" cy="470.0" r="24.0" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="250.0" cy="470.0" r="3.5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="490.0" cy="470.0" r="48.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="490.0" cy="470.0" r="3.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="370.0" cy="230.0" r="72.0" fill="#f3e8fb" stroke="#7a4a8a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="370.0" cy="230.0" r="3.5" fill="#7a4a8a" filter="url(#rough2)"/>
  <text x="220.0" y="475.0" text-anchor="end" font-size="12" fill="#2f4a66" filter="url(#rough2)">C₁ (r=1)</text>
  <text x="548.0" y="475.0" font-size="12" fill="#3c5e2e" filter="url(#rough2)">C₂ (r=2)</text>
  <text x="364.0" y="146.0" text-anchor="middle" font-size="12" fill="#6a3a7a" filter="url(#rough2)">C₃ (r=3)</text>
  <line x1="330.0" y1="466.7" x2="250.0" y2="470.0" stroke="#b85450" stroke-width="1.1" stroke-dasharray="4 5" filter="url(#rough2)"/>
  <line x1="330.0" y1="466.7" x2="490.0" y2="470.0" stroke="#b85450" stroke-width="1.1" stroke-dasharray="4 5" filter="url(#rough2)"/>
  <line x1="330.0" y1="466.7" x2="370.0" y2="230.0" stroke="#b85450" stroke-width="1.1" stroke-dasharray="4 5" filter="url(#rough2)"/>
  <circle cx="330.0" cy="466.7" r="6" fill="#b85450" filter="url(#rough2)"/>
  <text x="346.0" y="460.7" font-size="13.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">P₁</text>
  <line x1="271.3" y1="593.8" x2="250.0" y2="470.0" stroke="#446688" stroke-width="1.1" stroke-dasharray="4 5" filter="url(#rough2)"/>
  <line x1="271.3" y1="593.8" x2="490.0" y2="470.0" stroke="#446688" stroke-width="1.1" stroke-dasharray="4 5" filter="url(#rough2)"/>
  <line x1="271.3" y1="593.8" x2="370.0" y2="230.0" stroke="#446688" stroke-width="1.1" stroke-dasharray="4 5" filter="url(#rough2)"/>
  <circle cx="271.3" cy="593.8" r="6" fill="#446688" filter="url(#rough2)"/>
  <text x="285.3" y="615.8" font-size="13.5" font-weight="bold" fill="#446688" filter="url(#rough2)">P₂</text>
  <text x="290.8" y="455.6" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">d₁</text>
  <text x="415.6" y="452.0" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">d₂</text>
  <text x="355.6" y="345.2" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">d₃</text>
  <rect x="596.0" y="96.0" width="262.0" height="46.0" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="727.0" y="116.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">同一个比例 t = d/r</text>
  <text x="727.0" y="134.0" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">三个圆张角才相同</text>
  <rect x="596.0" y="176.0" width="262.0" height="84.0" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="608.0" y="200.0" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">P₁：t = 3.3347，α ≈ 34.9°</text>
  <text x="608.0" y="222.0" font-size="12" fill="#3c5e2e" filter="url(#rough2)">d₁:d₂:d₃ = 1:2:3</text>
  <text x="608.0" y="246.0" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">张角最大 → 输出它</text>
  <rect x="596.0" y="282.0" width="262.0" height="76.0" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="608.0" y="306.0" font-size="12.5" fill="#a14340" filter="url(#rough2)">P₂：t = 5.2361，α ≈ 22.0°</text>
  <text x="608.0" y="328.0" font-size="12" fill="#a14340" filter="url(#rough2)">d₁:d₂:d₃ = 1:2:3</text>
  <text x="608.0" y="350.0" font-size="12" fill="#a14340" filter="url(#rough2)">比例也对，但张角更小</text>
  <rect x="596.0" y="384.0" width="262.0" height="96.0" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="727.0" y="408.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">α = 2·arcsin(1/t)</text>
  <text x="727.0" y="432.0" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">t 越小，张角越大</text>
  <text x="727.0" y="456.0" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">故取 s = t² 最小的根</text>
  <text x="300.0" y="636.0" text-anchor="middle" font-size="12.5" fill="#66788c" filter="url(#rough2)">淡红色虚线：P₁ 到三个圆心的距离，恰好都是 t = 3.3347 倍的半径</text>
</svg>
