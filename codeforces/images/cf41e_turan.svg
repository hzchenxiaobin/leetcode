<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="481"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="720" height="350" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">完全二分图：同侧不连，跨侧全连</text>
  <g filter="url(#rough2)">
    <rect x="180" y="60" width="140" height="150" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="420" y="60" width="140" height="150" rx="10" fill="#eef4ec" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="250" y="86" text-anchor="middle" font-size="13" fill="#2f4a66">A（⌊n/2⌋ 个）</text>
    <text x="490" y="86" text-anchor="middle" font-size="13" fill="#2f5223">B（⌈n/2⌉ 个）</text>
  </g>
  <g filter="url(#rough2)">
    <circle cx="250" cy="120" r="14" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
    <circle cx="250" cy="170" r="14" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
    <circle cx="490" cy="120" r="14" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="490" cy="170" r="14" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <g stroke="#8a94a6" stroke-width="1.6" filter="url(#rough2)">
    <line x1="264" y1="120" x2="476" y2="120"/>
    <line x1="264" y1="120" x2="476" y2="170"/>
    <line x1="264" y1="170" x2="476" y2="120"/>
    <line x1="264" y1="170" x2="476" y2="170"/>
  </g>
  <text x="360" y="250" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">边数 = ⌊n/2⌋·⌈n/2⌉ = ⌊n²/4⌋</text>
  <rect x="90" y="272" width="540" height="56" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="106" y="296" font-size="12.5" fill="#8a6015" filter="url(#rough2)">三角形需要三点两两相邻；三只点里必有两个同侧，所以没有三角形。</text>
  <text x="106" y="318" font-size="12.5" fill="#8a6015" filter="url(#rough2)">Mantel 定理：任意无三角形图至多 ⌊n²/4⌋ 条边，故这是最优。</text>
</svg>
