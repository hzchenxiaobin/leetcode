<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="454"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8a2b28"/>
    </marker>
  </defs>
  <rect width="760" height="400" fill="#fafafa"/>
  <text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">函数图 = 一个环 + 若干棵指向环的树；树上用带权并查集跳过已学过的点</text>
  <path d="M 60 38 Q 380 46 700 38" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <circle cx="120" cy="80" r="20" fill="#f6d5d5" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="120" y="85" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">A</text>
  <circle cx="215" cy="62" r="20" fill="#d9ecd4" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="215" y="67" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">B</text>
  <circle cx="282" cy="120" r="20" fill="#f6d5d5" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="282" y="125" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">C</text>
  <circle cx="185" cy="140" r="20" fill="#f6d5d5" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="185" y="145" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">D</text>

  <path d="M 138 72 L 194 65" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 230 76 L 266 105" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 266 134 L 207 140" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 167 134 L 133 98" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <circle cx="120" cy="180" r="18" fill="#f6d5d5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="120" y="185" text-anchor="middle" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">E</text>
  <circle cx="120" cy="245" r="18" fill="#f6d5d5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="120" y="250" text-anchor="middle" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">F</text>
  <circle cx="120" cy="310" r="18" fill="#f6d5d5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="120" y="315" text-anchor="middle" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">G</text>
  <path d="M 120 160 L 120 106" stroke="#446688" stroke-width="1.4" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 120 227 L 120 202" stroke="#446688" stroke-width="1.4" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 120 292 L 120 267" stroke="#446688" stroke-width="1.4" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <circle cx="300" cy="185" r="18" fill="#f6d5d5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="300" y="190" text-anchor="middle" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">H</text>
  <circle cx="300" cy="255" r="18" fill="#d9ecd4" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="300" y="260" text-anchor="middle" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">I</text>
  <path d="M 292 170 L 240 78" stroke="#446688" stroke-width="1.4" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 300 237 L 300 207" stroke="#446688" stroke-width="1.4" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <path d="M 104 322 Q 60 200 102 100" stroke="#8a2b28" stroke-width="1.7" fill="none"
        stroke-dasharray="6 4" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="52" y="205" font-size="10.5" fill="#8a2b28" filter="url(#rough2)">find(G)：跳过 3 步</text>
  <path d="M 284 262 L 258 196" stroke="#8a2b28" stroke-width="1.7" fill="none"
        stroke-dasharray="6 4" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="318" y="232" font-size="10.5" fill="#8a2b28" filter="url(#rough2)">find(I)→H，d=1，计数</text>

  <rect x="356" y="60" width="374" height="90" rx="10" fill="#d9ecd4" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="372" y="82" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">带权并查集（只有树上点）</text>
  <text x="372" y="103" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">up[x]：沿 g 的下一个候选；w[x]：跳过去要几步。</text>
  <text x="372" y="122" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">find(x) 返回最近的"未学过"祖先，并给出步数 d。</text>
  <text x="372" y="141" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">标记 x 后令 up[x] = g(x)、w[x] = 1，路径压缩摊还 O(α)。</text>

  <rect x="356" y="166" width="374" height="86" rx="10" fill="#fbe3c8" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="372" y="188" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">当天的窗口还剩 rem 步</text>
  <text x="372" y="209" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">d ≥ rem：窗口内没有未学过的点，结束。</text>
  <text x="372" y="228" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">d &lt; rem：u 是新的，计数并令 rem −= d + 1。</text>
  <text x="372" y="246" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">找不到未学过祖先：走到环入口，转入环的处理。</text>

  <rect x="356" y="268" width="374" height="70" rx="10" fill="#cfe0f5" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="372" y="290" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">为什么不会超时</text>
  <text x="372" y="311" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">每个点最多被标记一次，总计 O(n) 次标记；</text>
  <text x="372" y="330" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">每天额外只多做一次失败的 find，总计 O(m) 次。</text>

  <text x="34" y="380" font-size="11" fill="#555555" filter="url(#rough2)">灰色 = 已经学过新闻（标记过），绿色 = 还没学过；深色环上的点由下一张图的"有序集合"负责。</text>
</svg>
