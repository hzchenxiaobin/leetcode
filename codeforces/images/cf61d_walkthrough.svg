<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400">
<defs>
  <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs>
<rect x="0" y="0" width="760" height="400" fill="#fafafa"/>
<text x="380.0" y="34" font-size="22" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="bold" text-anchor="middle" filter="url(#rough2)">两个样例：2W − 最深距离</text>
<text x="70" y="80" font-size="15" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="normal" text-anchor="start" filter="url(#rough2)">链 1-2(3)-3(4)</text>
<rect x="78" y="110" width="44" height="44" rx="22" fill="#e8f0fe" stroke="#777" stroke-width="2" filter="url(#rough2)"/>
<text x="100" y="141" font-size="15" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">1</text>
<rect x="198" y="110" width="44" height="44" rx="22" fill="#e8f0fe" stroke="#777" stroke-width="2" filter="url(#rough2)"/>
<text x="220" y="141" font-size="15" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">2</text>
<rect x="318" y="110" width="44" height="44" rx="22" fill="#e8f0fe" stroke="#777" stroke-width="2" filter="url(#rough2)"/>
<text x="340" y="141" font-size="15" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">3</text>
<line x1="122" y1="132" x2="198" y2="132" stroke="#666" stroke-width="2" filter="url(#rough2)"/>
<text x="160" y="122" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#c0392b" font-weight="normal" text-anchor="middle" filter="url(#rough2)">3</text>
<line x1="242" y1="132" x2="318" y2="132" stroke="#666" stroke-width="2" filter="url(#rough2)"/>
<text x="280" y="122" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#c0392b" font-weight="normal" text-anchor="middle" filter="url(#rough2)">4</text>
<text x="70" y="200" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#2e7d32" font-weight="normal" text-anchor="start" filter="url(#rough2)">W=7，最深 3+4=7 → 14−7=7</text>
<text x="430" y="80" font-size="15" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="normal" text-anchor="start" filter="url(#rough2)">星 1-2(3)、1-3(3)</text>
<rect x="498" y="88" width="44" height="44" rx="22" fill="#e8f0fe" stroke="#777" stroke-width="2" filter="url(#rough2)"/>
<text x="520" y="117" font-size="15" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">1</text>
<rect x="428" y="168" width="44" height="44" rx="22" fill="#e8f0fe" stroke="#777" stroke-width="2" filter="url(#rough2)"/>
<text x="450" y="197" font-size="15" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">2</text>
<rect x="568" y="168" width="44" height="44" rx="22" fill="#e8f0fe" stroke="#777" stroke-width="2" filter="url(#rough2)"/>
<text x="590" y="197" font-size="15" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">3</text>
<line x1="520" y1="132" x2="470" y2="168" stroke="#666" stroke-width="2" filter="url(#rough2)"/>
<text x="488" y="146" font-size="13" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#c0392b" font-weight="normal" text-anchor="middle" filter="url(#rough2)">3</text>
<line x1="520" y1="132" x2="570" y2="168" stroke="#666" stroke-width="2" filter="url(#rough2)"/>
<text x="552" y="146" font-size="13" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#c0392b" font-weight="normal" text-anchor="middle" filter="url(#rough2)">3</text>
<text x="430" y="240" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#2e7d32" font-weight="normal" text-anchor="start" filter="url(#rough2)">W=6，最深 3 → 12−3=9</text>
<text x="380" y="330" font-size="15" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#1a5fb4" font-weight="normal" text-anchor="middle" filter="url(#rough2)">终点选在距根最远的城市，省掉的回程最长</text>
<text x="380" y="368" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="normal" text-anchor="middle" filter="url(#rough2)">n=1 时没有边，答案为 0</text>
</svg>
