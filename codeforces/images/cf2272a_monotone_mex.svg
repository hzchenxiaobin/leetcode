<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="420" fill="#fafafa"/>

  <text x="380" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：f 单调不减，第 k 大就是 f 的第 m 项</text>
  <path d="M 168 44 Q 380 51 592 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 六个 f 值格子 -->
  <rect x="53" y="80" width="84" height="56" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="95" y="104" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">f₁</text>
  <text x="95" y="124" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">前 1 个</text>

  <rect x="167" y="80" width="84" height="56" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="209" y="104" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">f₂</text>
  <text x="209" y="124" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">前 2 个</text>

  <rect x="281" y="80" width="84" height="56" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="323" y="104" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">f₃</text>
  <text x="323" y="124" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">前 3 个</text>

  <rect x="395" y="80" width="84" height="56" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="437" y="104" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">f₄</text>
  <text x="437" y="124" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">前 4 个</text>

  <rect x="509" y="80" width="84" height="56" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="551" y="104" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a6015" filter="url(#rough2)">f_m</text>
  <text x="551" y="124" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">前 m 个</text>

  <rect x="623" y="80" width="84" height="56" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="665" y="104" text-anchor="middle" font-size="16" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">f_n</text>
  <text x="665" y="124" text-anchor="middle" font-size="11" fill="#3c5e2e" filter="url(#rough2)">恒等于 n</text>

  <!-- 单调不减箭头 -->
  <path d="M 139 108 L 163 108" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 253 108 L 277 108" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 367 108 L 391 108" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 481 108 L 505 108" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 595 108 L 619 108" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 从右数 k 个的括号 -->
  <path d="M 551 158 L 551 152 M 551 158 L 665 158 M 665 158 L 665 152" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="608" y="180" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">从右数恰好 k 个</text>
  <text x="380" y="206" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">第 k 大 = f_m ，其中 m = n − k + 1</text>

  <!-- 左：单调性 -->
  <rect x="40" y="222" width="330" height="124" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="205" y="246" text-anchor="middle" font-size="14" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">为什么可以直接换算下标</text>
  <text x="56" y="272" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">前缀加元素只会让 mex 变大或不变</text>
  <text x="56" y="296" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">故 f₁ ≤ f₂ ≤ … ≤ f_n，排序后顺序不变</text>
  <text x="56" y="320" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">降序数第 k 个 = 原序列下标 n − k + 1</text>
  <text x="56" y="340" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">f_n = mex(全集 0…n−1) = n，永远是最大值</text>

  <!-- 右：问题化简 -->
  <rect x="390" y="222" width="330" height="124" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="555" y="246" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">于是题目化简成</text>
  <text x="406" y="272" font-size="12.5" fill="#8a6015" filter="url(#rough2)">最多一次交换，最大化 mex(a₁ … a_m)</text>
  <text x="406" y="296" font-size="12.5" fill="#8a6015" filter="url(#rough2)">只看前 m 个元素，后面的元素只当「仓库」</text>
  <text x="406" y="320" font-size="12.5" fill="#8a6015" filter="url(#rough2)">上界：前缀含 0…m−1 时 mex = m</text>
  <text x="406" y="340" font-size="11.5" fill="#d6a040" filter="url(#rough2)">mex ≤ m 恒成立，不可能更大</text>

  <!-- 结论条 -->
  <rect x="40" y="360" width="680" height="46" rx="9" fill="#fafafa" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="380" y="380" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">前 m 个已经包含 0…m−1 ⇒ mex = m 已是理论上界 ⇒ 不需要操作，输出 −1</text>
  <text x="380" y="398" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">否则必有「缺失值」藏在第 m 个之后，把它换进来就能严格变大</text>
</svg>
