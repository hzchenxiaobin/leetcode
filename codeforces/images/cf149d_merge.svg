<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="413"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="300" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">三种转移：()、包住的、拼接的</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">状态 f[l][r][cl][cr]</text>
  <g filter="url(#rough2)"><rect x="60" y="96" width="250" height="90" rx="6" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="185" y="122" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">① r = l+1</text>
  <text x="185" y="150" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">恰好一个染色</text>
  <text x="185" y="172" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">4 种</text>
  <g filter="url(#rough2)"><rect x="330" y="96" width="250" height="90" rx="6" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="455" y="122" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">② match[l] = r</text>
  <text x="455" y="150" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">两端颜色 vs 内部两端</text>
  <text x="455" y="172" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">相邻不同色</text>
  <g filter="url(#rough2)"><rect x="600" y="96" width="250" height="90" rx="6" fill="#f3d9d6" fill-opacity="0.85" stroke="#8a2b28" stroke-width="1.4"/></g>
  <text x="725" y="122" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">③ match[l] = m &lt; r</text>
  <text x="725" y="150" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">拆成 [l..m] + [m+1..r]</text>
  <text x="725" y="172" text-anchor="middle" font-size="11" fill="#8a2b28" filter="url(#rough2)">交界处不同色</text>
  <text x="450" y="226" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">答案 = Σ f[0][n−1][cl][cr]（对 3×3 种端点颜色）</text>
  <text x="450" y="260" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">约束：每对匹配括号恰好一个染色；相邻染色不得同色</text>
</svg>
