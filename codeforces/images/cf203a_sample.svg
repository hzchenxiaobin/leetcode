<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="300" fill="#fafafa"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">203A：样例 1 的一个可行解</text>
  <path d="M 249.28999999999996 46 Q 380.0 52 510.71000000000004 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60.0" y="70.0" width="660.0" height="56.0" rx="9" fill="#fafafa" stroke="#6b6b6b" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="74.0" y="96.0" text-anchor="start" font-size="11.0" fill="#2b2b2b" filter="url(#rough2)">x=30, t=5, a=20, b=20, d_a=3, d_b=5</text>
  <rect x="60.0" y="140.0" width="660.0" height="56.0" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="166.0" text-anchor="start" font-size="10.9" fill="#2f5b34" filter="url(#rough2)">第 0 分钟交第 1 题得 20；第 2 分钟交第 2 题得 20−10=10 ⇒ 合计 30 ✓</text>
  <rect x="60.0" y="210.0" width="660.0" height="56.0" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="234.0" text-anchor="start" font-size="10.9" fill="#8a6015" filter="url(#rough2)">样例 2：x=10, a=100 递减很快，b 只有 5 分且递减，任何组合都凑不出 10 ⇒ NO。</text>
</svg>
