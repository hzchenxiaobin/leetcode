<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="127"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="280" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">n = 5、a = 2、b = 3：合法位置是一段后缀</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">前面至少 a 人 ⇒ p ≥ a+1；后面至多 b 人 ⇒ p ≥ n−b；两者取更紧的</text>
  <g filter="url(#rough2)"><rect x="210" y="100" width="72" height="56" rx="6" fill="#ffffff" fill-opacity="0.85" stroke="#bbbbbb" stroke-width="1.1"/></g>
  <text x="246" y="136" text-anchor="middle" font-size="17" fill="#666666" filter="url(#rough2)">1</text>
  <text x="246" y="176" text-anchor="middle" font-size="13" fill="#8a2b28" filter="url(#rough2)">✗</text>
  <g filter="url(#rough2)"><rect x="310" y="100" width="72" height="56" rx="6" fill="#ffffff" fill-opacity="0.85" stroke="#bbbbbb" stroke-width="1.1"/></g>
  <text x="346" y="136" text-anchor="middle" font-size="17" fill="#666666" filter="url(#rough2)">2</text>
  <text x="346" y="176" text-anchor="middle" font-size="13" fill="#8a2b28" filter="url(#rough2)">✗</text>
  <g filter="url(#rough2)"><rect x="410" y="100" width="72" height="56" rx="6" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="446" y="136" text-anchor="middle" font-size="17" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="446" y="176" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <g filter="url(#rough2)"><rect x="510" y="100" width="72" height="56" rx="6" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="546" y="136" text-anchor="middle" font-size="17" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="546" y="176" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <g filter="url(#rough2)"><rect x="610" y="100" width="72" height="56" rx="6" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="646" y="136" text-anchor="middle" font-size="17" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="646" y="176" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="450" y="210" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">p ≥ max(a+1, n−b) = max(3, 2) = 3 ⇒ {3,4,5}，共 3 个</text>
  <text x="450" y="240" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">答案 = min(n−a, b+1) = min(3, 4) = 3</text>
</svg>
