<svg xmlns="http://www.w3.org/2000/svg" width="880" height="280" viewBox="0 0 880 280"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="280" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例走查：101 → 11，110010 → 11010</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">全是 1 时（如 111）删最后一位，结果为 11</text>
  <text x="150" y="110" text-anchor="start" font-size="18" fill="#2b2b2b" filter="url(#rough2)">101</text>
  <text x="300" y="110" text-anchor="start" font-size="12.5" fill="#555555" filter="url(#rough2)">删第 2 位（0）→</text>
  <text x="470" y="110" text-anchor="start" font-size="18" fill="#3d6b2f" filter="url(#rough2)">11</text>
  <text x="150" y="180" text-anchor="start" font-size="18" fill="#2b2b2b" filter="url(#rough2)">110010</text>
  <text x="300" y="180" text-anchor="start" font-size="12.5" fill="#555555" filter="url(#rough2)">删第 3 位（最左 0）→</text>
  <text x="520" y="180" text-anchor="start" font-size="18" fill="#3d6b2f" filter="url(#rough2)">11010</text>
  <text x="440" y="250" text-anchor="middle" font-size="12.5" fill="#b05a5a" filter="url(#rough2)">二进制下"高位优先"，所以删最左的 0 一定最优</text>
</svg>
