<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="431"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="290" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 3：b = 10，价格 4 2 3 1</text>
  <g font-size="12.5" filter="url(#rough2)">
    <text x="80" y="80" fill="#666">买入日</text><text x="220" y="80" fill="#666">买入数</text><text x="360" y="80" fill="#666">剩余</text><text x="480" y="80" fill="#666">最好卖出</text><text x="600" y="80" fill="#666">金额</text>
  </g>
  <g stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)">
    <line x1="75" y1="92" x2="660" y2="92"/><line x1="75" y1="130" x2="660" y2="130"/><line x1="75" y1="168" x2="660" y2="168"/>
  </g>
  <g font-size="13" filter="url(#rough2)">
    <text x="80" y="118" fill="#2b2b2b">1（价 4）</text><text x="220" y="118" fill="#2b2b2b">2</text><text x="360" y="118" fill="#2b2b2b">2</text><text x="480" y="118" fill="#2b2b2b">3</text><text x="600" y="118" fill="#2b2b2b">8</text>
    <text x="80" y="156" fill="#2f5223" font-weight="bold">2（价 2）</text><text x="220" y="156" fill="#2f5223">5</text><text x="360" y="156" fill="#2f5223">0</text><text x="480" y="156" fill="#2f5223">3</text><text x="600" y="156" font-weight="bold" fill="#2f5223">15</text>
    <text x="80" y="194" fill="#2b2b2b">3（价 3）</text><text x="220" y="194" fill="#2b2b2b">3</text><text x="360" y="194" fill="#2b2b2b">1</text><text x="480" y="194" fill="#2b2b2b">3</text><text x="600" y="194" fill="#2b2b2b">10</text>
  </g>
  <rect x="80" y="216" width="580" height="48" rx="9" fill="#eef4ec" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="96" y="244" font-size="13" fill="#2f5223" filter="url(#rough2)">最大 15：第 2 天全买（5 美元），第 3 天卖出。</text>
