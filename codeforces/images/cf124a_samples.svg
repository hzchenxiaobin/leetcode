<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="131"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="260" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">两个官方样例的合法位置</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">样例 1：n=3, a=1, b=1　|　样例 2：n=5, a=2, b=3</text>
  <g filter="url(#rough2)"><rect x="40" y="90" width="380" height="120" rx="6" fill="#ffffff" fill-opacity="0.5" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="230" y="116" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">n = 3，a = 1，b = 1</text>
  <g filter="url(#rough2)"><rect x="90" y="132" width="64" height="46" rx="5" fill="#ffffff" fill-opacity="0.85" stroke="#bbbbbb" stroke-width="1.4"/></g>
  <text x="122" y="162" text-anchor="middle" font-size="14" fill="#666666" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="180" y="132" width="64" height="46" rx="5" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="212" y="162" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="270" y="132" width="64" height="46" rx="5" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="302" y="162" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <text x="230" y="232" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">合法：2、3 ⇒ 2 个</text>
  <g filter="url(#rough2)"><rect x="470" y="90" width="390" height="120" rx="6" fill="#ffffff" fill-opacity="0.5" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="665" y="116" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">n = 5，a = 2，b = 3</text>
  <g filter="url(#rough2)"><rect x="490" y="132" width="60" height="46" rx="5" fill="#ffffff" fill-opacity="0.85" stroke="#bbbbbb" stroke-width="1.4"/></g>
  <text x="520" y="162" text-anchor="middle" font-size="14" fill="#666666" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="564" y="132" width="60" height="46" rx="5" fill="#ffffff" fill-opacity="0.85" stroke="#bbbbbb" stroke-width="1.4"/></g>
  <text x="594" y="162" text-anchor="middle" font-size="14" fill="#666666" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="638" y="132" width="60" height="46" rx="5" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="668" y="162" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="712" y="132" width="60" height="46" rx="5" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="742" y="162" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><rect x="786" y="132" width="60" height="46" rx="5" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="816" y="162" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">5</text>
  <text x="665" y="232" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">合法：3、4、5 ⇒ 3 个</text>
</svg>
