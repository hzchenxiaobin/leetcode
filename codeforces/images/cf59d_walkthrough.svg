<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c9801f"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a8524a"/>
    </marker>
  </defs>
  <rect width="760" height="400" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">样例 1：k = 4 是队伍 2 的队长</text>
  <text x="380.0" y="60.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">队伍 1 {5,6,2}　队伍 2 {9,3,4}（k=4）　队伍 3 {1,7,8}</text>
  <rect x="50.0" y="96.0" width="290.0" height="50.0" rx="8" fill="#f7f9fc" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="64.0" y="128.0" text-anchor="start" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">A：更早队伍 {2,5,6}</text>
  <rect x="198.0" y="104.0" width="38.0" height="34.0" fill="#ffffff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="217.0" y="126.0" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="242.0" y="104.0" width="38.0" height="34.0" fill="#ffffff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="261.0" y="126.0" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="286.0" y="104.0" width="38.0" height="34.0" fill="#ffffff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="305.0" y="126.0" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="50.0" y="168.0" width="290.0" height="50.0" rx="8" fill="#fdf3e3" stroke="#c9801f" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="64.0" y="200.0" text-anchor="start" font-size="11" fill="#c9801f" font-weight="bold" filter="url(#rough2)">T：队友 {3,9}</text>
  <rect x="198.0" y="176.0" width="38.0" height="34.0" fill="#ffffff" stroke="#c9801f" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="217.0" y="198.0" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="242.0" y="176.0" width="38.0" height="34.0" fill="#ffffff" stroke="#c9801f" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="261.0" y="198.0" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">9</text>
  <rect x="50.0" y="240.0" width="290.0" height="50.0" rx="8" fill="#f4f9f2" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="64.0" y="272.0" text-anchor="start" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">B：更晚队伍 {1,7,8}</text>
  <rect x="198.0" y="248.0" width="38.0" height="34.0" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="217.0" y="270.0" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="242.0" y="248.0" width="38.0" height="34.0" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="261.0" y="270.0" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="286.0" y="248.0" width="38.0" height="34.0" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="305.0" y="270.0" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="356.0" y="118.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">归并阶段：每次取</text>
  <text x="356.0" y="140.0" text-anchor="start" font-size="11.5" fill="#c9801f" font-weight="bold" filter="url(#rough2)">A 头与 T 头中较小的</text>
  <text x="356.0" y="196.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">T 全部输出后，把剩下的</text>
  <text x="356.0" y="218.0" text-anchor="start" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">所有人升序接到末尾</text>
  <rect x="50.0" y="286.0" width="660.0" height="54.0" rx="8" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="64.0" y="310.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">输出：</text>
  <rect x="130.0" y="296.0" width="50.0" height="34.0" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="155.0" y="318.0" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="188.0" y="296.0" width="50.0" height="34.0" fill="#ffffff" stroke="#c9801f" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="213.0" y="318.0" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="246.0" y="296.0" width="50.0" height="34.0" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="271.0" y="318.0" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="304.0" y="296.0" width="50.0" height="34.0" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="329.0" y="318.0" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="362.0" y="296.0" width="50.0" height="34.0" fill="#ffffff" stroke="#c9801f" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="387.0" y="318.0" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">9</text>
  <rect x="420.0" y="296.0" width="50.0" height="34.0" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="445.0" y="318.0" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="478.0" y="296.0" width="50.0" height="34.0" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="503.0" y="318.0" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="536.0" y="296.0" width="50.0" height="34.0" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="561.0" y="318.0" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="70.0" y="372.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">前 5 个数是归并阶段（2、3、5、6、9），后 3 个是第二阶段升序的 1、7、8。</text>
  <text x="70.0" y="392.0" text-anchor="start" font-size="11.5" fill="#8a8a8a" filter="url(#rough2)">A 色=更早队伍，橙=队友，绿=更晚队伍。</text>
</svg>
