<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="340" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">A：中心对称 = 四对位置必须“同生同死”</text>
  <path d="M 150 42 Q 380 47 610 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="380" y="62" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">终端是 1..9 的 3×3 键盘，(i,j) 的对称位置是 (2-i, 2-j)</text>

  <!-- 键盘格子 -->
  <rect x="120" y="90" width="76" height="76" fill="#ffffff" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="196" y="90" width="76" height="76" fill="#ffffff" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="272" y="90" width="76" height="76" fill="#ffffff" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="120" y="166" width="76" height="76" fill="#ffffff" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="196" y="166" width="76" height="76" fill="#fff3cd" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="272" y="166" width="76" height="76" fill="#ffffff" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="120" y="242" width="76" height="76" fill="#ffffff" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="196" y="242" width="76" height="76" fill="#ffffff" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="272" y="242" width="76" height="76" fill="#ffffff" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>

  <text x="158" y="136" text-anchor="middle" font-size="20" fill="#2f4a66" filter="url(#rough2)">1</text>
  <text x="234" y="136" text-anchor="middle" font-size="20" fill="#2f4a66" filter="url(#rough2)">2</text>
  <text x="310" y="136" text-anchor="middle" font-size="20" fill="#2f4a66" filter="url(#rough2)">3</text>
  <text x="158" y="212" text-anchor="middle" font-size="20" fill="#2f4a66" filter="url(#rough2)">4</text>
  <text x="234" y="212" text-anchor="middle" font-size="20" fill="#8a6015" filter="url(#rough2)">5</text>
  <text x="310" y="212" text-anchor="middle" font-size="20" fill="#2f4a66" filter="url(#rough2)">6</text>
  <text x="158" y="288" text-anchor="middle" font-size="20" fill="#2f4a66" filter="url(#rough2)">7</text>
  <text x="234" y="288" text-anchor="middle" font-size="20" fill="#2f4a66" filter="url(#rough2)">8</text>
  <text x="310" y="288" text-anchor="middle" font-size="20" fill="#2f4a66" filter="url(#rough2)">9</text>

  <!-- 对称连线 -->
  <line x1="158" y1="128" x2="310" y2="280" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <line x1="234" y1="128" x2="234" y2="280" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <line x1="310" y1="128" x2="158" y2="280" stroke="#446688" stroke-width="1.6" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <line x1="158" y1="204" x2="310" y2="204" stroke="#8a6015" stroke-width="1.6" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <circle cx="234" cy="204" r="10" fill="none" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>

  <text x="380" y="116" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">中心的 5 与自身比较，永远相等</text>
  <text x="380" y="146" font-size="12" fill="#8c3a36" filter="url(#rough2)">1 ↔ 9　　（(0,0) ↔ (2,2)）</text>
  <text x="380" y="170" font-size="12" fill="#2f5223" filter="url(#rough2)">2 ↔ 8　　（(0,1) ↔ (2,1)）</text>
  <text x="380" y="194" font-size="12" fill="#2f4a66" filter="url(#rough2)">3 ↔ 7　　（(0,2) ↔ (2,0)）</text>
  <text x="380" y="218" font-size="12" fill="#8a6015" filter="url(#rough2)">4 ↔ 6　　（(1,0) ↔ (1,2)）</text>

  <rect x="376" y="238" width="330" height="64" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="388" y="262" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">四对里只要有一对“一个 X、一个 .”</text>
  <text x="388" y="284" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">就输出 NO；四对全部相同才输出 YES</text>

</svg>
