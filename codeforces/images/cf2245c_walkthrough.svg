<svg xmlns="http://www.w3.org/2000/svg" width="720" height="424" viewBox="0 0 720 424"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="53"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="720" height="424" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">三组走查：两组构造 + 一组无解</text>

  <rect x="36" y="50" width="648" height="168" rx="10" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="56" y="76" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">① n = 9, k = 12 ：B = 16，s = 9 ⊕ 12 = 5 = 101₂ ⇒ S = {1, 4}</text>

  <text x="130" y="112" text-anchor="end" font-size="12" fill="#446688" filter="url(#rough2)">p =</text>
  <text x="130" y="150" text-anchor="end" font-size="12" fill="#4a7a3a" filter="url(#rough2)">f =</text>

  <rect x="142" y="88" width="44" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="164" y="110" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="191" y="88" width="44" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="213" y="110" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">3</text>
  <rect x="240" y="88" width="44" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="262" y="110" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">5</text>
  <rect x="289" y="88" width="44" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="311" y="110" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">6</text>
  <rect x="338" y="88" width="44" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="110" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">7</text>
  <rect x="387" y="88" width="44" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="409" y="110" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">8</text>
  <rect x="436" y="88" width="44" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="458" y="110" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d20" filter="url(#rough2)">0</text>
  <rect x="485" y="88" width="44" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="507" y="110" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <rect x="534" y="88" width="44" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="556" y="110" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">4</text>

  <rect x="142" y="126" width="44" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="164" y="148" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">0</text>
  <rect x="191" y="126" width="44" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="213" y="148" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">0</text>
  <rect x="240" y="126" width="44" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="262" y="148" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">0</text>
  <rect x="289" y="126" width="44" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="311" y="148" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">0</text>
  <rect x="338" y="126" width="44" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="360" y="148" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">0</text>
  <rect x="387" y="126" width="44" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="409" y="148" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">0</text>
  <rect x="436" y="126" width="44" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="458" y="148" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <rect x="485" y="126" width="44" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="507" y="148" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">4</text>
  <rect x="534" y="126" width="44" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="556" y="148" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6d20" filter="url(#rough2)">9</text>

  <text x="360" y="186" text-anchor="middle" font-size="12" fill="#4a7a3a"
        filter="url(#rough2)">X = f(0)⊕…⊕f(8) = 1 ⊕ 4 ⊕ 9 = 9 ⊕ 5 = 12 = k ✓（0 块贡献 0）</text>
  <text x="360" y="206" text-anchor="middle" font-size="10.5" fill="#888888"
        filter="url(#rough2)">这里 0 前面的 6 个值都升序、0 后面的 1 与 4 也升序，所以 mex 一路 0 → 1 → 4 → 9</text>

  <rect x="36" y="232" width="312" height="120" rx="10" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="258" text-anchor="start" font-size="11.5" font-weight="bold" fill="#4a7a3a"
        filter="url(#rough2)">② n = 6, k = 0：B = 8，s = 6 &lt; 8 ⇒ S = {2, 4}</text>
  <text x="56" y="284" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">p = [1, 3, 5, 0, 2, 4]</text>
  <text x="56" y="304" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">f = [0, 0, 0, 2, 4, 6]</text>
  <text x="56" y="326" text-anchor="start" font-size="11.5" font-weight="bold" fill="#4a7a3a"
        filter="url(#rough2)">X = 2 ⊕ 4 ⊕ 6 = 0 = k ✓</text>
  <text x="56" y="344" text-anchor="start" font-size="10" fill="#888888" filter="url(#rough2)">n 不是 2 的幂时，k = 0 也可能是 YES</text>

  <rect x="372" y="232" width="312" height="120" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="392" y="258" text-anchor="start" font-size="11.5" font-weight="bold" fill="#b85450"
        filter="url(#rough2)">③ n = 4, k = 8：B = 4，s = 12 ≥ 4 ⇒ NO</text>
  <text x="392" y="284" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">f 的每个取值都 ≤ n = 4，只能提供 bit 0..2</text>
  <text x="392" y="304" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">12 = 1100₂ 需要 bit 3（值 8），永远抵消不掉</text>
  <text x="392" y="326" text-anchor="start" font-size="11" font-weight="bold" fill="#b85450"
        filter="url(#rough2)">⇒ 输出 NO（对应官方样例第 4 组）</text>

  <text x="360" y="384" text-anchor="middle" font-size="11.5" fill="#2b2b2b"
        filter="url(#rough2)">判定只做一次比较 s = n ⊕ k &lt; B：这个条件同时是必要条件与充分条件</text>
  <text x="360" y="406" text-anchor="middle" font-size="10.5" fill="#888888"
        filter="url(#rough2)">n 是 2 的幂时 B = n，可达 k ∈ [n, 2n−1]；否则可达 k ∈ [0, B−1]</text>
</svg>
