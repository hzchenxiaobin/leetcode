<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="141"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="a14arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="460" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">最小矩形 = 所有 * 的最小行 / 最大行 / 最小列 / 最大列</text>
  <path d="M 90 44 Q 380 50 670 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 列号 -->
  <text x="82" y="76" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">0</text>
  <text x="126" y="76" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">1</text>
  <text x="170" y="76" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">2</text>
  <text x="214" y="76" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">3</text>
  <text x="258" y="76" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">4</text>
  <text x="302" y="76" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">5</text>
  <text x="346" y="76" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">6</text>

  <!-- 行号 -->
  <text x="50" y="118" text-anchor="end" font-size="10" fill="#777" filter="url(#rough2)">0</text>
  <text x="50" y="162" text-anchor="end" font-size="10" fill="#777" filter="url(#rough2)">1</text>
  <text x="50" y="206" text-anchor="end" font-size="10" fill="#777" filter="url(#rough2)">2</text>
  <text x="50" y="250" text-anchor="end" font-size="10" fill="#777" filter="url(#rough2)">3</text>
  <text x="50" y="294" text-anchor="end" font-size="10" fill="#777" filter="url(#rough2)">4</text>
  <text x="50" y="338" text-anchor="end" font-size="10" fill="#777" filter="url(#rough2)">5</text>

  <!-- 被排除的边缘（行 0、列 0/1、列 5/6） -->
  <rect x="60" y="90" width="308" height="44" fill="#ececec" opacity="0.75" filter="url(#rough2)"/>
  <rect x="60" y="134" width="88" height="220" fill="#ececec" opacity="0.75" filter="url(#rough2)"/>
  <rect x="280" y="134" width="88" height="220" fill="#ececec" opacity="0.75" filter="url(#rough2)"/>

  <!-- 网格 -->
  <g filter="url(#rough2)">
    <rect x="60" y="90" width="308" height="264" fill="none" stroke="#c9c2b4" stroke-width="1.2"/>
    <line x1="104" y1="90" x2="104" y2="354" stroke="#ded8cc" stroke-width="1"/>
    <line x1="148" y1="90" x2="148" y2="354" stroke="#ded8cc" stroke-width="1"/>
    <line x1="192" y1="90" x2="192" y2="354" stroke="#ded8cc" stroke-width="1"/>
    <line x1="236" y1="90" x2="236" y2="354" stroke="#ded8cc" stroke-width="1"/>
    <line x1="280" y1="90" x2="280" y2="354" stroke="#ded8cc" stroke-width="1"/>
    <line x1="324" y1="90" x2="324" y2="354" stroke="#ded8cc" stroke-width="1"/>
    <line x1="60" y1="134" x2="368" y2="134" stroke="#ded8cc" stroke-width="1"/>
    <line x1="60" y1="178" x2="368" y2="178" stroke="#ded8cc" stroke-width="1"/>
    <line x1="60" y1="222" x2="368" y2="222" stroke="#ded8cc" stroke-width="1"/>
    <line x1="60" y1="266" x2="368" y2="266" stroke="#ded8cc" stroke-width="1"/>
    <line x1="60" y1="310" x2="368" y2="310" stroke="#ded8cc" stroke-width="1"/>
  </g>

  <!-- 星号：行 1/2/3/4/5，列 2/3/4（按样例） -->
  <text x="170" y="168" text-anchor="middle" font-size="24" fill="#2b2b2b" filter="url(#rough2)">*</text>
  <text x="214" y="168" text-anchor="middle" font-size="24" fill="#2b2b2b" filter="url(#rough2)">*</text>
  <text x="258" y="168" text-anchor="middle" font-size="24" fill="#2b2b2b" filter="url(#rough2)">*</text>
  <text x="170" y="212" text-anchor="middle" font-size="24" fill="#2b2b2b" filter="url(#rough2)">*</text>
  <text x="170" y="256" text-anchor="middle" font-size="24" fill="#2b2b2b" filter="url(#rough2)">*</text>
  <text x="214" y="256" text-anchor="middle" font-size="24" fill="#2b2b2b" filter="url(#rough2)">*</text>
  <text x="258" y="256" text-anchor="middle" font-size="24" fill="#2b2b2b" filter="url(#rough2)">*</text>
  <text x="170" y="300" text-anchor="middle" font-size="24" fill="#2b2b2b" filter="url(#rough2)">*</text>
  <text x="170" y="344" text-anchor="middle" font-size="24" fill="#2b2b2b" filter="url(#rough2)">*</text>
  <text x="214" y="344" text-anchor="middle" font-size="24" fill="#2b2b2b" filter="url(#rough2)">*</text>
  <text x="258" y="344" text-anchor="middle" font-size="24" fill="#2b2b2b" filter="url(#rough2)">*</text>

  <!-- 最小包围矩形 -->
  <rect x="145" y="131" width="138" height="226" fill="none" stroke="#4a7a3a" stroke-width="3"
        stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="214" y="376" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">行 1..5 × 列 2..4</text>

  <!-- 右侧说明 -->
  <rect x="430" y="78" width="300" height="314" rx="12" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="450" y="104" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例一的四边界</text>
  <text x="450" y="132" font-size="12" fill="#555" filter="url(#rough2)">top = 1，bottom = 5</text>
  <text x="450" y="156" font-size="12" fill="#555" filter="url(#rough2)">left = 2，right = 4</text>
  <text x="450" y="184" font-size="12" fill="#2f5223" filter="url(#rough2)">输出 5 行 × 3 列：</text>
  <text x="450" y="212" font-size="14" fill="#2b2b2b" font-family="'Courier New',monospace" filter="url(#rough2)">***</text>
  <text x="450" y="236" font-size="14" fill="#2b2b2b" font-family="'Courier New',monospace" filter="url(#rough2)">*..</text>
  <text x="450" y="260" font-size="14" fill="#2b2b2b" font-family="'Courier New',monospace" filter="url(#rough2)">***</text>
  <text x="450" y="284" font-size="14" fill="#2b2b2b" font-family="'Courier New',monospace" filter="url(#rough2)">*..</text>
  <text x="450" y="308" font-size="14" fill="#2b2b2b" font-family="'Courier New',monospace" filter="url(#rough2)">***</text>
  <text x="450" y="340" font-size="11" fill="#777" filter="url(#rough2)">灰色区域整行/整列不含 *，可以裁掉。</text>
  <text x="450" y="360" font-size="11" fill="#777" filter="url(#rough2)">注意：内部的行 2、4 只有左侧有 *，</text>
  <text x="450" y="378" font-size="11" fill="#777" filter="url(#rough2)">但仍要保留列 3、4，因为它们在其他行有 *。</text>
</svg>
