<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="229"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="340" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">B：三个样例，两种结局</text>
  <path d="M 200 42 Q 380 47 560 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <rect x="40" y="66" width="680" height="74" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="90" font-size="11.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">样例 1：a@aa@a</text>
  <text x="52" y="114" font-size="11" fill="#3c5e2e" filter="url(#rough2)">'@' 在位置 2、5（1 起）；间距 3 ≥ 3 ✓；头尾都够 → 切成 a@a | a@a</text>
  <text x="52" y="132" font-size="11" fill="#2f5223" font-family="'Courier New',monospace" filter="url(#rough2)">输出：a@a,a@a</text>

  <rect x="40" y="152" width="680" height="74" rx="10" fill="#fdeceb" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="176" font-size="11.5" font-weight="bold" fill="#8c3a36" filter="url(#rough2)">样例 2：a@a@a</text>
  <text x="52" y="200" font-size="11" fill="#8c3a36" filter="url(#rough2)">'@' 在位置 2、4，间距只有 2 &lt; 3：中间那个字母既要当前一个邮箱的尾巴、又要当后一个邮箱的脑袋</text>
  <text x="52" y="218" font-size="11" fill="#8c3a36" filter="url(#rough2)">→ 无论怎么切都有一边为空 → No solution</text>

  <rect x="40" y="238" width="680" height="74" rx="10" fill="#fdeceb" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="262" font-size="11.5" font-weight="bold" fill="#8c3a36" filter="url(#rough2)">样例 3：@aa@a</text>
  <text x="52" y="286" font-size="11" fill="#8c3a36" filter="url(#rough2)">第一个 '@' 就在位置 1（串首），第一个邮箱的 A 部分是空的</text>
  <text x="52" y="304" font-size="11" fill="#8c3a36" filter="url(#rough2)">→ 违反条件 ① → No solution</text>

  <text x="380" y="332" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">注意输出用的是英文逗号、不带空格；"No solution" 首字母大写。</text>
</svg>
