<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1122"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="300" fill="#fafafa"/>
  <text x="360.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">统一大小写后再比较</text>
  <path d="M 115.2 42 Q 360.0 48 604.8 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="360.0" y="286" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">样例 1：aaaa 与 aaaA → 相等 → 0</text>
  <rect x="140" y="80" width="80" height="60" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="180" y="118" text-anchor="middle" font-size="20" font-weight="bold" fill="#2f5223" filter="url(#rough2)">a</text>
  <rect x="140" y="150" width="80" height="60" rx="7" fill="#fbeadb" stroke="#d98c40" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="180" y="188" text-anchor="middle" font-size="20" font-weight="bold" fill="#8a6015" filter="url(#rough2)">a</text>
  <line x1="180.0" y1="142.0" x2="180.0" y2="148.0" stroke="#999999" stroke-width="1.2" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <rect x="250" y="80" width="80" height="60" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="290" y="118" text-anchor="middle" font-size="20" font-weight="bold" fill="#2f5223" filter="url(#rough2)">a</text>
  <rect x="250" y="150" width="80" height="60" rx="7" fill="#fbeadb" stroke="#d98c40" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="290" y="188" text-anchor="middle" font-size="20" font-weight="bold" fill="#8a6015" filter="url(#rough2)">a</text>
  <line x1="290.0" y1="142.0" x2="290.0" y2="148.0" stroke="#999999" stroke-width="1.2" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <rect x="360" y="80" width="80" height="60" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="400" y="118" text-anchor="middle" font-size="20" font-weight="bold" fill="#2f5223" filter="url(#rough2)">a</text>
  <rect x="360" y="150" width="80" height="60" rx="7" fill="#fbeadb" stroke="#d98c40" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="400" y="188" text-anchor="middle" font-size="20" font-weight="bold" fill="#8a6015" filter="url(#rough2)">a</text>
  <line x1="400.0" y1="142.0" x2="400.0" y2="148.0" stroke="#999999" stroke-width="1.2" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <rect x="470" y="80" width="80" height="60" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="510" y="118" text-anchor="middle" font-size="20" font-weight="bold" fill="#2f5223" filter="url(#rough2)">a</text>
  <rect x="470" y="150" width="80" height="60" rx="7" fill="#fbeadb" stroke="#d98c40" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="510" y="188" text-anchor="middle" font-size="20" font-weight="bold" fill="#8a6015" filter="url(#rough2)">A</text>
  <line x1="510.0" y1="142.0" x2="510.0" y2="148.0" stroke="#999999" stroke-width="1.2" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <text x="360" y="240" text-anchor="middle" font-size="12.5" fill="#2f5223" filter="url(#rough2)">第一行：原串；第二行：转小写后 → 完全相同 → 输出 0</text>
  <text x="360" y="268" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">若某位不同，则比较该位；前缀全同且等长则相等</text>
</svg>
