<svg xmlns="http://www.w3.org/2000/svg" width="840" height="470" viewBox="0 0 840 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="470" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1 走查：n = 7 的 8 次到达</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">输出 1 7 4 2 7 4 1 3（距离按格数，乘 4 即米数）</text>
  <text x="120" y="92" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">1 15</text>
  <text x="280" y="92" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">∅</text>
  <text x="490" y="92" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">全空</text>
  <text x="730" y="92" text-anchor="start" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="120" y="122" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">1 123123</text>
  <text x="280" y="122" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">{1}</text>
  <text x="490" y="122" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">后缀 (6,7)</text>
  <text x="730" y="122" text-anchor="start" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">7</text>
  <text x="120" y="152" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">1 3</text>
  <text x="280" y="152" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">{1,7}</text>
  <text x="490" y="152" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">内部 (3,4)</text>
  <text x="730" y="152" text-anchor="start" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="120" y="182" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">1 5</text>
  <text x="280" y="182" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">{1,4,7}</text>
  <text x="490" y="182" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">内部 d=1：2 与 5 并列 → 2</text>
  <text x="730" y="182" text-anchor="start" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="120" y="212" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">2 123123</text>
  <text x="280" y="212" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">—</text>
  <text x="490" y="212" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">车 123123 释放 7 号位</text>
  <text x="730" y="212" text-anchor="start" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">—</text>
  <text x="120" y="242" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">2 15</text>
  <text x="280" y="242" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">—</text>
  <text x="490" y="242" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">车 15 释放 1 号位</text>
  <text x="730" y="242" text-anchor="start" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">—</text>
  <text x="120" y="272" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">1 21</text>
  <text x="280" y="272" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">{2,4}</text>
  <text x="490" y="272" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">后缀 (3,7)</text>
  <text x="730" y="272" text-anchor="start" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">7</text>
  <text x="120" y="302" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">2 3</text>
  <text x="280" y="302" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">—</text>
  <text x="490" y="302" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">车 3 释放 4 号位</text>
  <text x="730" y="302" text-anchor="start" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">—</text>
  <text x="120" y="332" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">1 6</text>
  <text x="280" y="332" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">{2,7}</text>
  <text x="490" y="332" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">内部 (2,4)</text>
  <text x="730" y="332" text-anchor="start" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="120" y="362" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">1 7</text>
  <text x="280" y="362" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">{2,4,7}</text>
  <text x="490" y="362" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">d=1：1、3、5 并列 → 1</text>
  <text x="730" y="362" text-anchor="start" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="120" y="392" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">1 8</text>
  <text x="280" y="392" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">{1,2,4,7}</text>
  <text x="490" y="392" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">d=1：3、5 并列，前缀 0 → 3</text>
  <text x="730" y="392" text-anchor="start" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><line x1="70" y1="102" x2="810" y2="102" stroke="#c8a48a" stroke-width="1.1"/></g>
  <text x="420" y="452" text-anchor="middle" font-size="11.5" fill="#8a4b2a" filter="url(#rough2)">两个易错点：车号 ≠ 车位号（见两次 2 释放）；并列时取最小编号（第 4、10 行）</text>
</svg>
