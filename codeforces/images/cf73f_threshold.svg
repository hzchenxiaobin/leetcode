<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="109"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ta" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2b2b2b"/>
    </marker>
  </defs>
  <rect width="720" height="400" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每辆坦克一个阈值 V_i；答案 = 第 k+1 大的 V_i</text>
  <path d="M 140 40 Q 360 46 580 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 数轴 -->
  <line x1="70" y1="200" x2="650" y2="200" stroke="#2b2b2b" stroke-width="1.8" marker-end="url(#ta)" filter="url(#rough2)"/>
  <text x="656" y="204" font-size="12" fill="#333" filter="url(#rough2)">v</text>

  <!-- 阈值点 -->
  <g filter="url(#rough2)">
    <g font-size="12" font-weight="bold" text-anchor="middle">
      <circle cx="150" cy="200" r="6" fill="#b85450"/><text x="150" y="180" fill="#8c2f2b">V₁</text>
      <circle cx="260" cy="200" r="6" fill="#b85450"/><text x="260" y="180" fill="#8c2f2b">V₂</text>
      <circle cx="380" cy="200" r="6" fill="#c47a00"/><text x="380" y="180" fill="#8a6015">V₃</text>
      <circle cx="500" cy="200" r="6" fill="#2f7a3a"/><text x="500" y="180" fill="#1f5226">V₄</text>
      <circle cx="590" cy="200" r="6" fill="#2f7a3a"/><text x="590" y="180" fill="#1f5226">V₅</text>
    </g>
  </g>

  <!-- 计数阶梯 -->
  <path d="M 70 320 L 150 320 L 150 292 L 260 292 L 260 264 L 380 264 L 380 236 L 500 236 L 500 208 L 590 208 L 590 180 L 650 180"
        stroke="#7b4fa8" stroke-width="2.4" fill="none" filter="url(#rough2)"/>
  <text x="96" y="312" font-size="11.5" fill="#4b2a70" filter="url(#rough2)">开火数</text>
  <text x="86" y="338" font-size="11" fill="#4b2a70" filter="url(#rough2)">0</text>
  <text x="196" y="286" font-size="11" fill="#4b2a70" filter="url(#rough2)">1</text>
  <text x="312" y="258" font-size="11" fill="#4b2a70" filter="url(#rough2)">2</text>
  <text x="430" y="230" font-size="11" fill="#4b2a70" filter="url(#rough2)">3</text>
  <text x="540" y="202" font-size="11" fill="#4b2a70" filter="url(#rough2)">4</text>

  <!-- k+1 位置 -->
  <line x1="380" y1="196" x2="380" y2="356" stroke="#8a6015" stroke-width="1.4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="380" y="376" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">若 k = 2，则需要 v &gt; V₃</text>

  <rect x="60" y="60" width="600" height="86" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="86" font-size="12.5" font-weight="bold" fill="#8a6015">V_i = max_{0 &lt; s ≤ d} w_i·s / g_i(s)</text>
  <text x="76" y="112" font-size="11.5" fill="#7a5a1b">用 s = d·j/400 粗采样找谷底，再做黄金分割细化（200 轮）；</text>
  <text x="76" y="134" font-size="11.5" fill="#7a5a1b">k ≥ n 时直接输出 0；w_i = 0 时 V_i = 0。</text>
</svg>
