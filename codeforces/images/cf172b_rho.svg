<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="380" fill="#fafafa"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">ρ 形：一段尾巴，接一个环，环长就是答案 t</text>
  <path d="M 180 46 Q 360 52 540 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <circle cx="80" cy="90" r="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="80" y="95" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">r0</text>
  <circle cx="190" cy="90" r="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="95" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">r1</text>
  <circle cx="300" cy="90" r="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="95" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">ri</text>
  <line x1="106" y1="90" x2="164" y2="90" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <line x1="216" y1="90" x2="274" y2="90" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="135" y="76" text-anchor="middle" font-size="11" font-weight="normal" fill="#446688" filter="url(#rough2)">f</text>
  <text x="245" y="76" text-anchor="middle" font-size="11" font-weight="normal" fill="#446688" filter="url(#rough2)">f</text>
  <text x="190" y="48" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#446688" filter="url(#rough2)">尾巴：每步都踩到新状态</text>
  <line x1="300" y1="116" x2="300" y2="196" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="312" y="162" text-anchor="start" font-size="11" font-weight="normal" fill="#446688" filter="url(#rough2)">f</text>
  <circle cx="300" cy="250" r="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="255" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">ri</text>
  <circle cx="430" cy="250" r="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="430" y="255" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">ri+1</text>
  <circle cx="520" cy="250" r="30" fill="#ffffff" stroke="#cfcfcf" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="520" y="255" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">...</text>
  <circle cx="590" cy="250" r="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="590" y="255" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">rj-1</text>
  <line x1="330" y1="250" x2="396" y2="250" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <line x1="460" y1="250" x2="494" y2="250" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <line x1="548" y1="250" x2="556" y2="250" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="363" y="236" text-anchor="middle" font-size="11" font-weight="normal" fill="#446688" filter="url(#rough2)">f</text>
  <path d="M 600 220 Q 600 120 470 168 Q 380 190 320 220" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="455" y="172" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">f(rj-1) = ri  环长 = j - i</text>
  <rect x="60" y="300" width="300" height="56" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="72" y="322" text-anchor="start" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">尾巴长度 k = i（可以等于 0）</text>
  <text x="72" y="342" text-anchor="start" font-size="11.5" font-weight="normal" fill="#7a5a1b" filter="url(#rough2)">第一次撞到旧状态时：t = j - i</text>
  <rect x="396" y="300" width="264" height="56" rx="9" fill="#fdecea" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="408" y="322" text-anchor="start" font-size="11" font-weight="bold" fill="#8c3a36" filter="url(#rough2)">数组法：记下每个状态首次出现的位置</text>
  <text x="408" y="342" text-anchor="start" font-size="11" font-weight="normal" fill="#8c3a36" filter="url(#rough2)">一次 O(m) 扫描即可，不用存整条序列</text>
</svg>
