<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="387"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="250" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">样例 1：2 个架子，取 3 件 → 15</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">架子 1 取左边 2 件（3+7），架子 2 取右边 1 件（5）</text>
  <g filter="url(#rough2)"><rect x="60" y="96" width="380" height="120" rx="6" fill="#ffffff" fill-opacity="0.35" stroke="#446688" stroke-width="1.4"/></g>
  <text x="250" y="122" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">架子 1：[3, 7, 2]</text>
  <text x="250" y="152" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">取左 2 件 ⇒ 3 + 7 = 10</text>
  <text x="250" y="178" text-anchor="middle" font-size="10.5" fill="#8a2b28" filter="url(#rough2)">（不能只取中间的 7）</text>
  <g filter="url(#rough2)"><rect x="480" y="96" width="360" height="120" rx="6" fill="#ffffff" fill-opacity="0.35" stroke="#446688" stroke-width="1.4"/></g>
  <text x="660" y="122" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">架子 2：[4, 1, 5]</text>
  <text x="660" y="152" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">取右 1 件 ⇒ 5</text>
  <text x="660" y="178" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">取右 2 件 ⇒ 5 + 1 = 6</text>
  <text x="450" y="232" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">合计 10 + 5 = 15 ✓</text>
</svg>
