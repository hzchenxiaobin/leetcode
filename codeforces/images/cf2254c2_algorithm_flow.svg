<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
    <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333"
        filter="url(#rough2)">算法流程：分链统计 + 位置配对</text>

  <rect x="150" y="44" width="260" height="42" rx="8" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="70" text-anchor="middle" font-size="13" fill="#333"
        filter="url(#rough2)">读入 n, a, b（多测 t 组）</text>

  <rect x="110" y="108" width="340" height="52" rx="8" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="130" text-anchor="middle" font-size="12" fill="#333"
        filter="url(#rough2)">对 r = 0, 1 分别取子序列 a[r], a[r+2], ...</text>
  <text x="280" y="150" text-anchor="middle" font-size="12" fill="#333"
        filter="url(#rough2)">记下两条链中所有 1 的升序位置</text>

  <path d="M 280 86 L 280 106" stroke="#666" stroke-width="1.6" fill="none"
        marker-end="url(#a1)" filter="url(#rough2)"/>

  <polygon points="280,182 400,226 280,270 160,226" fill="#fff8e1" stroke="#d6a040"
           stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="222" text-anchor="middle" font-size="12" fill="#333"
        filter="url(#rough2)">两条链的 1 个数</text>
  <text x="280" y="240" text-anchor="middle" font-size="12" fill="#333"
        filter="url(#rough2)">分别都相同？</text>

  <path d="M 280 160 L 280 180" stroke="#666" stroke-width="1.6" fill="none"
        marker-end="url(#a1)" filter="url(#rough2)"/>

  <rect x="30" y="300" width="150" height="46" rx="8" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.8" filter="url(#rough2)"/>
  <text x="105" y="320" text-anchor="middle" font-size="12" fill="#333"
        filter="url(#rough2)">个数不同</text>
  <text x="105" y="338" text-anchor="middle" font-size="12" fill="#b85450"
        filter="url(#rough2)">输出 -1</text>

  <path d="M 205 258 L 120 298" stroke="#b85450" stroke-width="1.6" fill="none"
        marker-end="url(#a2)" filter="url(#rough2)"/>
  <text x="140" y="288" text-anchor="middle" font-size="11" fill="#b85450"
        filter="url(#rough2)">否</text>

  <rect x="320" y="292" width="215" height="62" rx="8" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.8" filter="url(#rough2)"/>
  <text x="427" y="314" text-anchor="middle" font-size="12" fill="#333"
        filter="url(#rough2)">按出现顺序配对第 k 个 1</text>
  <text x="427" y="334" text-anchor="middle" font-size="12" fill="#333"
        filter="url(#rough2)">ans += Σ |p_k − q_k|</text>

  <path d="M 372 262 L 420 290" stroke="#4a7a3a" stroke-width="1.6" fill="none"
        marker-end="url(#a1)" filter="url(#rough2)"/>
  <text x="410" y="272" text-anchor="middle" font-size="11" fill="#4a7a3a"
        filter="url(#rough2)">是</text>

  <rect x="170" y="378" width="240" height="42" rx="8" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="396" text-anchor="middle" font-size="12" fill="#333"
        filter="url(#rough2)">两条链都处理完，输出 ans / 2</text>
  <text x="290" y="413" text-anchor="middle" font-size="10" fill="#666"
        filter="url(#rough2)">链上走一步 = 全局下标挪 2 格，故要除 2</text>

  <path d="M 427 356 L 350 376" stroke="#666" stroke-width="1.6" fill="none"
        marker-end="url(#a1)" filter="url(#rough2)"/>
</svg>
