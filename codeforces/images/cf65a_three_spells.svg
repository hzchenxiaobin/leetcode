<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="440" fill="#fafafa"/>

  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">三个咒语首尾相接，围成一个循环</text>
  <path d="M 168 46 Q 360 53 552 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 沙 -->
  <circle cx="150" cy="150" r="46" fill="#eaf3ff" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="147" text-anchor="middle" font-size="19" font-weight="bold" fill="#2f4a63" filter="url(#rough2)">沙</text>
  <text x="150" y="170" text-anchor="middle" font-size="11" fill="#5a7285" filter="url(#rough2)">克数 S</text>

  <!-- 铅 -->
  <circle cx="570" cy="150" r="46" fill="#f3eefb" stroke="#6b5b95" stroke-width="2" filter="url(#rough2)"/>
  <text x="570" y="147" text-anchor="middle" font-size="19" font-weight="bold" fill="#4a3d6b" filter="url(#rough2)">铅</text>
  <text x="570" y="170" text-anchor="middle" font-size="11" fill="#6a5c8a" filter="url(#rough2)">克数 L</text>

  <!-- 金 -->
  <circle cx="360" cy="356" r="46" fill="#fff7e2" stroke="#c99a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="360" y="353" text-anchor="middle" font-size="19" font-weight="bold" fill="#8a6015" filter="url(#rough2)">金</text>
  <text x="360" y="376" text-anchor="middle" font-size="11" fill="#9c7a36" filter="url(#rough2)">克数 G</text>

  <!-- 沙 -> 铅 -->
  <line x1="198" y1="150" x2="512" y2="150" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="356" y="122" text-anchor="middle" font-size="12.5" fill="#2f4a63" filter="url(#rough2)">咒语一：a 克沙 → b 克铅</text>
  <text x="356" y="142" text-anchor="middle" font-size="11.5" fill="#5a7285" filter="url(#rough2)">每克沙变出 b/a 克铅</text>

  <!-- 铅 -> 金 -->
  <path d="M 541 188 Q 480 280 398 322" stroke="#6b5b95" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="545" y="248" text-anchor="middle" font-size="12.5" fill="#4a3d6b" filter="url(#rough2)">咒语二：c 铅 → d 金</text>
  <text x="548" y="267" text-anchor="middle" font-size="11.5" fill="#6a5c8a" filter="url(#rough2)">每克铅变出 d/c 克金</text>

  <!-- 金 -> 沙 -->
  <path d="M 322 322 Q 240 280 179 188" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="182" y="248" text-anchor="middle" font-size="12.5" fill="#8a3b37" filter="url(#rough2)">咒语三：e 金 → f 沙</text>
  <text x="180" y="267" text-anchor="middle" font-size="11.5" fill="#a05a56" filter="url(#rough2)">每克金变出 f/e 克沙</text>

  <!-- 中心：一圈放大率 -->
  <text x="360" y="232" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">绕一圈之后</text>
  <text x="360" y="256" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">r = (b/a)·(d/c)·(f/e)</text>
  <text x="360" y="278" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">沙 → 铅 → 金 → 沙</text>

  <text x="360" y="422" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">r &gt; 1 等价于 b·d·f &gt; a·c·e：每绕一圈沙子变多，金子无上限</text>
</svg>
