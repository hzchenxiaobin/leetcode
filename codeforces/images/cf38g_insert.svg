<svg xmlns="http://www.w3.org/2000/svg" width="780" height="430" viewBox="0 0 780 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="801"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr38g" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b06a2c"/>
    </marker>
  </defs>

  <rect width="780" height="430" fill="#fafafa"/>
  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">新人插入：最多前进 c 步，或被第一个 a 更大的人挡住</text>

  <!-- 队列 -->
  <circle cx="110" cy="150" r="22" fill="#dbe7fb" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="110" y="156" text-anchor="middle" font-size="13" fill="#23405c" filter="url(#rough2)">4</text>
  <circle cx="190" cy="150" r="22" fill="#dbe7fb" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="156" text-anchor="middle" font-size="13" fill="#23405c" filter="url(#rough2)">2</text>
  <circle cx="270" cy="150" r="22" fill="#dbe7fb" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="156" text-anchor="middle" font-size="13" fill="#23405c" filter="url(#rough2)">3</text>
  <circle cx="350" cy="150" r="22" fill="#dbe7fb" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="156" text-anchor="middle" font-size="13" fill="#23405c" filter="url(#rough2)">6</text>
  <circle cx="430" cy="150" r="22" fill="#dbe7fb" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="430" y="156" text-anchor="middle" font-size="13" fill="#23405c" filter="url(#rough2)">1</text>
  <circle cx="510" cy="150" r="22" fill="#dbe7fb" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="510" y="156" text-anchor="middle" font-size="13" fill="#23405c" filter="url(#rough2)">5</text>

  <circle cx="620" cy="150" r="24" fill="#ffd9b3" stroke="#b06a2c" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="620" y="157" text-anchor="middle" font-size="14" fill="#8a4a14" filter="url(#rough2)">7</text>
  <text x="620" y="192" text-anchor="middle" font-size="10" fill="#8a4a14" filter="url(#rough2)">新人 a=7, c=2</text>

  <text x="60" y="118" font-size="10" fill="#446688" filter="url(#rough2)">队头</text>
  <text x="540" y="118" font-size="10" fill="#446688" filter="url(#rough2)">队尾</text>

  <!-- 前进箭头 -->
  <path d="M 596 150 L 540 150" stroke="#b06a2c" stroke-width="2" fill="none" marker-end="url(#arr38g)" filter="url(#rough2)"/>
  <path d="M 506 190 L 452 190" stroke="#b06a2c" stroke-width="2" fill="none" marker-end="url(#arr38g)" filter="url(#rough2)"/>

  <!-- 阻挡 -->
  <line x1="350" y1="108" x2="350" y2="192" stroke="#c0392b" stroke-width="2.2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="356" y="104" font-size="10" fill="#c0392b" filter="url(#rough2)">a=6 更大 → 挡住</text>

  <text x="450" y="186" font-size="10" fill="#b06a2c" filter="url(#rough2)">越过 5、1…</text>

  <!-- 公式 -->
  <rect x="40" y="232" width="700" height="86" rx="10" fill="#eef4ff" stroke="#446688"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="56" y="258" font-size="12" fill="#23405c" filter="url(#rough2)">设当前队伍长度 L，最靠右的 a &gt; a_i 的位置为 p（0 基，没有则 p = −1），则插入位置</text>
  <text x="56" y="288" font-size="15" font-weight="bold" fill="#8c3b37" filter="url(#rough2)">pos = max( L − c_i ,  p + 1 )</text>
  <text x="56" y="310" font-size="10.5" fill="#446688" filter="url(#rough2)">两个上界：交换次数不超过 c_i；不能越过第一个更大的人。</text>

  <rect x="40" y="330" width="700" height="82" rx="9" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.3" filter="url(#rough2)"/>
  <text x="56" y="352" font-size="11" fill="#8a6015" filter="url(#rough2)">为什么 p 之后的人都能被越过？因为 p 是最靠右的更大者，p 右边所有人的 a 都小于 a_i。</text>
  <text x="56" y="374" font-size="11" fill="#8a6015" filter="url(#rough2)">为什么不能越过 p？交换规则规定"遇到 a 更大的人立即停止"。</text>
  <text x="56" y="396" font-size="11" fill="#8c3b37" filter="url(#rough2)">所以每次插入只需要知道 L、p、c_i 三个量——这正好可由"带子树 max 的隐式 treap"在 O(log n) 内给出。</text>
</svg>
