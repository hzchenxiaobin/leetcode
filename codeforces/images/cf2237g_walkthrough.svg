<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="720" height="420" fill="#fafafa"/>

  <text x="360" y="26" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">样例演算：参考数怎么造、查询怎么还原</text>

  <!-- ===== 左表：a = [1,1,4,5,1,4] ===== -->
  <text x="40" y="56" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">样例 1：a = [1,1,4,5,1,4] → b = [20,1,1,4,5,1,4]</text>

  <g filter="url(#rough2)">
    <rect x="40" y="70" width="390" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="62" y="88" text-anchor="middle" font-size="10.5" fill="#2c4a63">i</text>
    <text x="130" y="88" text-anchor="middle" font-size="10.5" fill="#2c4a63">aᵢ</text>
    <text x="215" y="88" text-anchor="middle" font-size="10.5" fill="#2c4a63">它的素数幂</text>
    <text x="305" y="88" text-anchor="middle" font-size="10.5" fill="#2c4a63">gcd(20, aᵢ)</text>
    <text x="385" y="88" text-anchor="middle" font-size="10.5" fill="#2c4a63">→ aᵢ</text>

    <rect x="40" y="96" width="390" height="30" fill="#ffffff" stroke="#cfd8e3" stroke-width="1"/>
    <rect x="40" y="126" width="390" height="30" fill="#f7fbff" stroke="#cfd8e3" stroke-width="1"/>
    <rect x="40" y="156" width="390" height="30" fill="#ffffff" stroke="#cfd8e3" stroke-width="1"/>
    <rect x="40" y="186" width="390" height="30" fill="#f7fbff" stroke="#cfd8e3" stroke-width="1"/>
    <rect x="40" y="216" width="390" height="30" fill="#ffffff" stroke="#cfd8e3" stroke-width="1"/>
    <rect x="40" y="246" width="390" height="30" fill="#f7fbff" stroke="#cfd8e3" stroke-width="1"/>

    <text x="62" y="116" text-anchor="middle" font-size="11" fill="#444">1</text>
    <text x="62" y="146" text-anchor="middle" font-size="11" fill="#444">2</text>
    <text x="62" y="176" text-anchor="middle" font-size="11" fill="#444">3</text>
    <text x="62" y="206" text-anchor="middle" font-size="11" fill="#444">4</text>
    <text x="62" y="236" text-anchor="middle" font-size="11" fill="#444">5</text>
    <text x="62" y="266" text-anchor="middle" font-size="11" fill="#444">6</text>

    <text x="130" y="116" text-anchor="middle" font-size="11" fill="#2c4a63">1</text>
    <text x="130" y="146" text-anchor="middle" font-size="11" fill="#2c4a63">1</text>
    <text x="130" y="176" text-anchor="middle" font-size="11" fill="#2c4a63">4</text>
    <text x="130" y="206" text-anchor="middle" font-size="11" fill="#2c4a63">5</text>
    <text x="130" y="236" text-anchor="middle" font-size="11" fill="#2c4a63">1</text>
    <text x="130" y="266" text-anchor="middle" font-size="11" fill="#2c4a63">4</text>

    <text x="215" y="116" text-anchor="middle" font-size="10.5" fill="#8a6a20">无</text>
    <text x="215" y="146" text-anchor="middle" font-size="10.5" fill="#8a6a20">无</text>
    <text x="215" y="176" text-anchor="middle" font-size="10.5" fill="#8a6a20">2²</text>
    <text x="215" y="206" text-anchor="middle" font-size="10.5" fill="#8a6a20">5</text>
    <text x="215" y="236" text-anchor="middle" font-size="10.5" fill="#8a6a20">无</text>
    <text x="215" y="266" text-anchor="middle" font-size="10.5" fill="#8a6a20">2²</text>

    <text x="305" y="116" text-anchor="middle" font-size="11" fill="#33602a">1</text>
    <text x="305" y="146" text-anchor="middle" font-size="11" fill="#33602a">1</text>
    <text x="305" y="176" text-anchor="middle" font-size="11" fill="#33602a">4</text>
    <text x="305" y="206" text-anchor="middle" font-size="11" fill="#33602a">5</text>
    <text x="305" y="236" text-anchor="middle" font-size="11" fill="#33602a">1</text>
    <text x="305" y="266" text-anchor="middle" font-size="11" fill="#33602a">4</text>

    <text x="385" y="116" text-anchor="middle" font-size="11" fill="#8c3b37">1</text>
    <text x="385" y="146" text-anchor="middle" font-size="11" fill="#8c3b37">1</text>
    <text x="385" y="176" text-anchor="middle" font-size="11" fill="#8c3b37">4</text>
    <text x="385" y="206" text-anchor="middle" font-size="11" fill="#8c3b37">5</text>
    <text x="385" y="236" text-anchor="middle" font-size="11" fill="#8c3b37">1</text>
    <text x="385" y="266" text-anchor="middle" font-size="11" fill="#8c3b37">4</text>
  </g>

  <!-- 参考数推导 -->
  <g filter="url(#rough2)">
    <rect x="40" y="290" width="390" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8"/>
    <text x="56" y="310" font-size="10.5" fill="#8a6a20">出现过的素数：2（最高次幂 2² = 4）、5（最高次幂 5）</text>
    <text x="56" y="328" font-size="10.5" fill="#8a6a20">装箱：4 × 5 = 20 ≤ 10⁶ ⇒ 只有一个参考数 r = 1</text>
    <text x="56" y="344" font-size="10.5" fill="#997a34">b = [20] + [1,1,4,5,1,4]，k = 1 + 6 = 7</text>
  </g>

  <!-- ===== 右表：a = [2,6,10] ===== -->
  <text x="450" y="56" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">样例 2：a = [2, 6, 10]</text>

  <g filter="url(#rough2)">
    <rect x="450" y="70" width="240" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="470" y="88" text-anchor="middle" font-size="10.5" fill="#2c4a63">aᵢ</text>
    <text x="545" y="88" text-anchor="middle" font-size="10.5" fill="#2c4a63">素数幂</text>
    <text x="625" y="88" text-anchor="middle" font-size="10.5" fill="#2c4a63">gcd(30, aᵢ)</text>

    <rect x="450" y="96" width="240" height="30" fill="#ffffff" stroke="#cfd8e3" stroke-width="1"/>
    <rect x="450" y="126" width="240" height="30" fill="#f7fbff" stroke="#cfd8e3" stroke-width="1"/>
    <rect x="450" y="156" width="240" height="30" fill="#ffffff" stroke="#cfd8e3" stroke-width="1"/>

    <text x="470" y="116" text-anchor="middle" font-size="11" fill="#2c4a63">2</text>
    <text x="470" y="146" text-anchor="middle" font-size="11" fill="#2c4a63">6</text>
    <text x="470" y="176" text-anchor="middle" font-size="11" fill="#2c4a63">10</text>

    <text x="545" y="116" text-anchor="middle" font-size="10.5" fill="#8a6a20">2</text>
    <text x="545" y="146" text-anchor="middle" font-size="10.5" fill="#8a6a20">2 · 3</text>
    <text x="545" y="176" text-anchor="middle" font-size="10.5" fill="#8a6a20">2 · 5</text>

    <text x="625" y="116" text-anchor="middle" font-size="11" fill="#33602a">2</text>
    <text x="625" y="146" text-anchor="middle" font-size="11" fill="#33602a">6</text>
    <text x="625" y="176" text-anchor="middle" font-size="11" fill="#33602a">10</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="450" y="200" width="240" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8"/>
    <text x="466" y="220" font-size="10.5" fill="#8a6a20">素数 2, 3, 5 的最高次幂都是 1 次</text>
    <text x="466" y="238" font-size="10.5" fill="#8a6a20">装箱：2 × 3 × 5 = 30 ≤ 10⁶，r = 1</text>
    <text x="466" y="254" font-size="10.5" fill="#997a34">b = [30, 2, 6, 10]，k = 4</text>
  </g>

  <!-- 底部说明 -->
  <g filter="url(#rough2)">
    <rect x="40" y="366" width="650" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="56" y="384" font-size="10.5" fill="#33602a">注意第二轮的测试点顺序会被打乱：Quack 只靠 (n, k) 与查询回答工作，所以每组都能独立还原。</text>
    <text x="56" y="399" font-size="10.5" fill="#33602a">样例 1 在第二轮恰好问 6 次、样例 2 问 3 次，正好是 n·r。</text>
  </g>
</svg>
