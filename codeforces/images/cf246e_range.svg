<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="720" height="320" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">DFS 序：同一层的人在 tin 上递增，v 的第 k 层后代是一段连续区间</text>
  <rect x="60" y="60" width="600" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="360" y="84" text-anchor="middle" font-size="11.5" fill="#2f5223">对每个深度 d，把该深度的点按 tin 排成一个数组 L_d</text>
  <rect x="60" y="120" width="600" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="360" y="144" text-anchor="middle" font-size="11.5" fill="#2f4a66">v 的 k-后代 = L_{dep[v]+k} 中 tin ∈ [tin[v], tout[v]) 的那一段</text>
  <text x="60" y="200" text-anchor="start" font-size="12" fill="#446688" filter="url(#rough2)">问「这段里有多少个不同的名字」= 区间不同值计数</text>
  <rect x="60" y="220" width="600" height="60" rx="8" fill="#fde9d9" stroke="#b4652a" stroke-width="1.5"/>
  <text x="360" y="254" text-anchor="middle" font-size="11.5" fill="#7a4b22">离线：按右端点排序，BIT 维护「每个名字最后出现的位置」，答案 = 右侧-左侧前缀和</text>
</svg>
