<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>

  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1：A = 5，把 5 在三种进制下拆位</text>
  <path d="M 135 46 Q 360 52 585 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <rect x="50" y="88" width="180" height="132" rx="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="140" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">b = 2</text>
  <text x="140" y="156" text-anchor="middle" font-size="20" fill="#2b2b2b" filter="url(#rough2)">5 = 101₂</text>
  <text x="140" y="192" text-anchor="middle" font-size="13.5" fill="#2f5223" filter="url(#rough2)">1 + 0 + 1 = 2</text>

  <rect x="270" y="88" width="180" height="132" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5223" filter="url(#rough2)">b = 3</text>
  <text x="360" y="156" text-anchor="middle" font-size="20" fill="#2b2b2b" filter="url(#rough2)">5 = 12₃</text>
  <text x="360" y="192" text-anchor="middle" font-size="13.5" fill="#2f5223" filter="url(#rough2)">1 + 2 = 3</text>

  <rect x="490" y="88" width="180" height="132" rx="12" fill="#fde8e8" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="580" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#a33a36" filter="url(#rough2)">b = 4</text>
  <text x="580" y="156" text-anchor="middle" font-size="20" fill="#2b2b2b" filter="url(#rough2)">5 = 11₄</text>
  <text x="580" y="192" text-anchor="middle" font-size="13.5" fill="#2f5223" filter="url(#rough2)">1 + 1 = 2</text>

  <rect x="40" y="246" width="640" height="112" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <g font-size="12.5" fill="#7a5a1b" filter="url(#rough2)">
    <text x="56" y="276">数字和：2 + 3 + 2 = 7；进制个数：5 − 2 = 3（b 从 2 到 A−1 = 4）。</text>
    <text x="56" y="304">平均 = 7/3；gcd(7, 3) = 1，已经最简，直接输出 7/3。</text>
    <text x="56" y="332">边界对照：A = 3 时只有 b = 2，3 = 11₂ 数字和 2 → 2/1（分母为 1）。</text>
  </g>
</svg>
