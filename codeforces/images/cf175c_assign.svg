  <rect x="278" y="120" width="58" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="307.0" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">8</text>
  <rect x="278" y="190" width="58" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="307.0" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">×2</text>
  <line x1="307.0" y1="162" x2="307.0" y2="188" stroke="#888" stroke-width="1.2" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="344" y="120" width="58" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="373.0" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">10</text>
  <rect x="344" y="190" width="58" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="373.0" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">×2</text>
  <line x1="373.0" y1="162" x2="373.0" y2="188" stroke="#888" stroke-width="1.2" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="410" y="120" width="58" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="439.0" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">10</text>
  <rect x="410" y="190" width="58" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="439.0" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">×2</text>
  <line x1="439.0" y1="162" x2="439.0" y2="188" stroke="#888" stroke-width="1.2" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="476" y="120" width="58" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="505.0" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">10</text>
  <rect x="476" y="190" width="58" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="505.0" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">×3</text>
  <line x1="505.0" y1="162" x2="505.0" y2="188" stroke="#888" stroke-width="1.2" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="542" y="120" width="58" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="571.0" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">10</text>
  <rect x="542" y="190" width="58" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="571.0" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">×3</text>
  <line x1="571.0" y1="162" x2="571.0" y2="188" stroke="#888" stroke-width="1.2" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="80" y="110" text-anchor="start" font-size="11" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">单价升序（便宜的先杀）</text>
  <text x="80" y="180" text-anchor="start" font-size="11" font-weight="bold" fill="#8a6015" filter="url(#rough2)">位置 1 → 8 的倍率（非降）</text>
  <rect x="60" y="250" width="620" height="60" rx="9" fill="#f3e8fb" stroke="#7a4a9a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="74" y="274" text-anchor="start" font-size="11" font-weight="bold" fill="#5a3075" filter="url(#rough2)">交换论证：若 q1&lt;q2 却把贵的放在 q1，则交换后得分变化 (c1−c2)(f2−f1) ≥ 0。</text>
  <text x="74" y="296" text-anchor="start" font-size="11" font-weight="normal" fill="#5a3075" filter="url(#rough2)">所以“单价越高越靠后”是最优分配的必要条件，按序填即可。</text>
  <rect x="60" y="322" width="620" height="46" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="74" y="344" text-anchor="start" font-size="11" font-weight="bold" fill="#2f5223" filter="url(#rough2)">乘法注意：take（可到 10¹¹）× c（≤1000）× f（≤101）≈ 10¹⁶，必须 64 位。</text>
  <text x="74" y="362" text-anchor="start" font-size="11" font-weight="normal" fill="#4a7a3a" filter="url(#rough2)">k_i、p_i、答案数组也都要 64 位；int 在第一步就会溢出。</text>
</svg>
