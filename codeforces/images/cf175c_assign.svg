  <text x="175.0" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">×1</text>
  <line x1="175.0" y1="162" x2="175.0" y2="188" stroke="#888" stroke-width="1.2" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="212" y="120" width="58" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
