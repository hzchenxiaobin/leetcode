<svg xmlns="http://www.w3.org/2000/svg" width="840" height="320" viewBox="0 0 840 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="320" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">逐行统计：和 ≥ 2 就计入答案</text>
  <text x="420" y="56" text-anchor="middle" font-size="11.8" fill="#666666" filter="url(#rough2)">三个人中至少两人有把握</text>
  <g filter="url(#rough2)"><rect x="160" y="96" width="60" height="42" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="190" y="123" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="230" y="96" width="60" height="42" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="260" y="123" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="300" y="96" width="60" height="42" rx="4" fill="#f2f2f2" fill-opacity="0.85" stroke="#cccccc" stroke-width="1.3"/></g>
  <text x="330" y="123" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">0</text>
