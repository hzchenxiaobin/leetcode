  <text x="540" y="123" text-anchor="start" font-size="12" fill="#3d6b2f" filter="url(#rough2)">计入</text>
  <g filter="url(#rough2)"><rect x="160" y="152" width="60" height="42" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="190" y="179" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="230" y="152" width="60" height="42" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="260" y="179" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="300" y="152" width="60" height="42" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="330" y="179" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="420" y="179" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">和 = 3</text>
  <text x="540" y="179" text-anchor="start" font-size="12" fill="#3d6b2f" filter="url(#rough2)">计入</text>
  <g filter="url(#rough2)"><rect x="160" y="208" width="60" height="42" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="190" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="230" y="208" width="60" height="42" rx="4" fill="#f2f2f2" fill-opacity="0.85" stroke="#cccccc" stroke-width="1.3"/></g>
  <text x="260" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)"><rect x="300" y="208" width="60" height="42" rx="4" fill="#f2f2f2" fill-opacity="0.85" stroke="#cccccc" stroke-width="1.3"/></g>
  <text x="330" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="420" y="235" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">和 = 1</text>
  <text x="540" y="235" text-anchor="start" font-size="12" fill="#999999" filter="url(#rough2)">不计入</text>
  <text x="420" y="280" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">答案 = 满足"和 ≥ 2"的行数</text>
</svg>
