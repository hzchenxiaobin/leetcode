<svg xmlns="http://www.w3.org/2000/svg" width="840" height="420" viewBox="0 0 840 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="420" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">错误数 = 各连续段 (长度 − 1) 之和，再加开头合并项</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">n=6, r=10, 终态 (7,10)：逆推段为 B¹ T² B²，正向串 = T + 反转 = TBBTTB</text>
  <text x="90" y="110" text-anchor="start" font-size="12" fill="#555555" filter="url(#rough2)">逆序操作串（op6 … op2）</text>
  <g filter="url(#rough2)"><rect x="110" y="122" width="46" height="40" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="133" y="149" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">B</text>
  <text x="135" y="178" text-anchor="middle" font-size="11" fill="#a0522d" filter="url(#rough2)">段长 1</text>
  <g filter="url(#rough2)"><rect x="160" y="122" width="46" height="40" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="183" y="149" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">T</text>
  <g filter="url(#rough2)"><rect x="210" y="122" width="46" height="40" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="233" y="149" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">T</text>
  <text x="235" y="178" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">段长 2</text>
  <g filter="url(#rough2)"><rect x="260" y="122" width="46" height="40" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="283" y="149" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">B</text>
  <g filter="url(#rough2)"><rect x="310" y="122" width="46" height="40" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="333" y="149" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">B</text>
  <text x="335" y="178" text-anchor="middle" font-size="11" fill="#a0522d" filter="url(#rough2)">段长 2</text>
  <text x="90" y="226" text-anchor="start" font-size="12" fill="#555555" filter="url(#rough2)">正向操作串（op1 … op6）</text>
  <g filter="url(#rough2)"><rect x="110" y="238" width="46" height="40" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="133" y="265" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">T</text>
  <text x="135" y="294" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">段长 1</text>
  <g filter="url(#rough2)"><rect x="160" y="238" width="46" height="40" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="183" y="265" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">B</text>
  <g filter="url(#rough2)"><rect x="210" y="238" width="46" height="40" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="233" y="265" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">B</text>
  <text x="235" y="294" text-anchor="middle" font-size="11" fill="#a0522d" filter="url(#rough2)">段长 2</text>
  <g filter="url(#rough2)"><rect x="260" y="238" width="46" height="40" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="283" y="265" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">T</text>
  <g filter="url(#rough2)"><rect x="310" y="238" width="46" height="40" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="333" y="265" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">T</text>
  <text x="335" y="294" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">段长 2</text>
  <g filter="url(#rough2)"><rect x="360" y="238" width="46" height="40" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="383" y="265" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">B</text>
  <text x="385" y="294" text-anchor="middle" font-size="11" fill="#a0522d" filter="url(#rough2)">段长 1</text>
  <g filter="url(#rough2)"><line x1="50" y1="200" x2="50" y2="232" stroke="#999999" stroke-width="1.2" marker-end="url(#arrr)"/></g>
  <text x="58" y="222" text-anchor="start" font-size="11" fill="#777777" filter="url(#rough2)">反转</text>
  <text x="420" y="340" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">Σ(段长 − 1) = 0 + 1 + 1 = 2，且 op2 = B ≠ T，不再加 1 ⇒ 错误数 2</text>
  <text x="420" y="368" text-anchor="middle" font-size="12" fill="#8a4b2a" filter="url(#rough2)">若 op2 也是 T，固定的开头 T 会与它合并，错误数要额外 +1</text>
  <text x="420" y="396" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">（例：终态 (10,7) 会给出 TTTBBT，错误数 3，不如 (7,10) 的方案）</text>
</svg>
