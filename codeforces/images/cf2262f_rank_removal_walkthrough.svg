<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="4"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="310" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">样例走查：n = 3, m = 5，答案 k = ⌈5/3⌉ = 2</text>
  <text x="320" y="45" text-anchor="middle" font-size="11" fill="#888">第一步删 3 个让秩掉到 2，第二步正好删掉剩下的 2 个</text>

  <!-- grid 1 -->
  <text x="106" y="74" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">初始：秩 3，1 的个数 5</text>
  <g filter="url(#rough2)" text-anchor="middle" font-size="13" font-weight="bold">
    <rect x="46" y="86" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="86" y="86" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.0" rx="4"/>
    <rect x="126" y="86" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="46" y="118" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="86" y="118" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="126" y="118" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.0" rx="4"/>
    <rect x="46" y="150" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="86" y="150" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="126" y="150" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.0" rx="4"/>
    <text x="66" y="108" fill="#3a4a66">1</text>
    <text x="106" y="108" fill="#8a3a38">1</text>
    <text x="146" y="108" fill="#3a4a66">0</text>
    <text x="66" y="140" fill="#3a4a66">0</text>
    <text x="106" y="140" fill="#3a4a66">1</text>
    <text x="146" y="140" fill="#8a3a38">1</text>
    <text x="66" y="172" fill="#3a4a66">0</text>
    <text x="106" y="172" fill="#3a4a66">0</text>
    <text x="146" y="172" fill="#8a3a38">1</text>
  </g>
  <text x="106" y="202" text-anchor="middle" font-size="10" fill="#b85450">红格 = 这一步要删的 3 个</text>

  <!-- arrow 1 -->
  <path d="M 186 136 L 226 136" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="206" y="126" text-anchor="middle" font-size="10" fill="#446688">删 3 个</text>

  <!-- grid 2 -->
  <text x="306" y="74" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">删后：秩 2，1 的个数 2</text>
  <g filter="url(#rough2)" text-anchor="middle" font-size="13" font-weight="bold">
    <rect x="246" y="86" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="286" y="86" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <rect x="326" y="86" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <rect x="246" y="118" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <rect x="286" y="118" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="326" y="118" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <rect x="246" y="150" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <rect x="286" y="150" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <rect x="326" y="150" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <text x="266" y="108" fill="#3a5a30">1</text>
    <text x="306" y="108" fill="#8a6a20">0</text>
    <text x="346" y="108" fill="#8a6a20">0</text>
    <text x="266" y="140" fill="#8a6a20">0</text>
    <text x="306" y="140" fill="#3a5a30">1</text>
    <text x="346" y="140" fill="#8a6a20">0</text>
    <text x="266" y="172" fill="#8a6a20">0</text>
    <text x="306" y="172" fill="#8a6a20">0</text>
    <text x="346" y="172" fill="#8a6a20">0</text>
  </g>
  <text x="306" y="202" text-anchor="middle" font-size="10" fill="#4a7a3a">两个 1 行列互不相同 ⇒ 秩 = 2</text>

  <!-- arrow 2 -->
  <path d="M 386 136 L 426 136" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="406" y="126" text-anchor="middle" font-size="10" fill="#446688">删 2 个</text>

  <!-- grid 3 -->
  <text x="506" y="74" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">全零：结束</text>
  <g filter="url(#rough2)" text-anchor="middle" font-size="13" font-weight="bold">
    <rect x="446" y="86" width="40" height="32" fill="#f4f4f4" stroke="#bbb" stroke-width="1.3" rx="4"/>
    <rect x="486" y="86" width="40" height="32" fill="#f4f4f4" stroke="#bbb" stroke-width="1.3" rx="4"/>
    <rect x="526" y="86" width="40" height="32" fill="#f4f4f4" stroke="#bbb" stroke-width="1.3" rx="4"/>
    <rect x="446" y="118" width="40" height="32" fill="#f4f4f4" stroke="#bbb" stroke-width="1.3" rx="4"/>
    <rect x="486" y="118" width="40" height="32" fill="#f4f4f4" stroke="#bbb" stroke-width="1.3" rx="4"/>
    <rect x="526" y="118" width="40" height="32" fill="#f4f4f4" stroke="#bbb" stroke-width="1.3" rx="4"/>
    <rect x="446" y="150" width="40" height="32" fill="#f4f4f4" stroke="#bbb" stroke-width="1.3" rx="4"/>
    <rect x="486" y="150" width="40" height="32" fill="#f4f4f4" stroke="#bbb" stroke-width="1.3" rx="4"/>
    <rect x="526" y="150" width="40" height="32" fill="#f4f4f4" stroke="#bbb" stroke-width="1.3" rx="4"/>
    <text x="466" y="108" fill="#999">0</text>
    <text x="506" y="108" fill="#999">0</text>
    <text x="546" y="108" fill="#999">0</text>
    <text x="466" y="140" fill="#999">0</text>
    <text x="506" y="140" fill="#999">0</text>
    <text x="546" y="140" fill="#999">0</text>
    <text x="466" y="172" fill="#999">0</text>
    <text x="506" y="172" fill="#999">0</text>
    <text x="546" y="172" fill="#999">0</text>
  </g>
  <text x="506" y="202" text-anchor="middle" font-size="10" fill="#888">秩 0，共 2 步</text>

  <!-- bottom note -->
  <rect x="46" y="222" width="548" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="62" y="244" font-size="11" fill="#8a6a20" font-weight="bold">为什么不能 1 步？</text>
  <text x="62" y="266" font-size="11" fill="#555">初始秩 r = 3，一步最多只能删 r = 3 个 1，而 m = 5 &gt; 3，所以至少 2 步；</text>
  <text x="62" y="282" font-size="11" fill="#555">每步删除数 r ≤ n 给出下界 k ≥ ⌈m/n⌉，构造做到等号即为最优。</text>
</svg>
