<svg xmlns="http://www.w3.org/2000/svg" width="780" height="360" viewBox="0 0 780 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="780" height="360" fill="#fafafa"/>
  <text x="390.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">滑窗 + 值域线段树：每个窗口两次「取最小的 m 个 / 最大的 m 个」</text>
  <path d="M 95.41000000000008 46 Q 390.0 52 684.5899999999999 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60.0" y="70.0" width="56.0" height="46.0" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="88.0" y="99.0" text-anchor="middle" font-size="10.4" fill="#26405c" filter="url(#rough2)">a1</text>
  <rect x="122.0" y="70.0" width="56.0" height="46.0" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="150.0" y="99.0" text-anchor="middle" font-size="10.4" fill="#26405c" filter="url(#rough2)">a2</text>
  <rect x="184.0" y="70.0" width="56.0" height="46.0" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="212.0" y="99.0" text-anchor="middle" font-size="10.4" fill="#26405c" filter="url(#rough2)">a3</text>
  <rect x="246.0" y="70.0" width="56.0" height="46.0" rx="6" fill="#fff3d6" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="274.0" y="99.0" text-anchor="middle" font-size="10.4" fill="#26405c" filter="url(#rough2)">a4</text>
  <rect x="308.0" y="70.0" width="56.0" height="46.0" rx="6" fill="#fff3d6" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="336.0" y="99.0" text-anchor="middle" font-size="10.4" fill="#26405c" filter="url(#rough2)">a5</text>
  <rect x="370.0" y="70.0" width="56.0" height="46.0" rx="6" fill="#fff3d6" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="398.0" y="99.0" text-anchor="middle" font-size="10.4" fill="#26405c" filter="url(#rough2)">a6</text>
  <rect x="432.0" y="70.0" width="56.0" height="46.0" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="460.0" y="99.0" text-anchor="middle" font-size="10.4" fill="#26405c" filter="url(#rough2)">a7</text>
  <rect x="494.0" y="70.0" width="56.0" height="46.0" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="522.0" y="99.0" text-anchor="middle" font-size="10.4" fill="#26405c" filter="url(#rough2)">a8</text>
  <rect x="556.0" y="70.0" width="56.0" height="46.0" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="584.0" y="99.0" text-anchor="middle" font-size="10.4" fill="#26405c" filter="url(#rough2)">a9</text>
  <rect x="618.0" y="70.0" width="56.0" height="46.0" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="646.0" y="99.0" text-anchor="middle" font-size="10.4" fill="#26405c" filter="url(#rough2)">a10</text>
  <rect x="242.0" y="62.0" width="194.0" height="62.0" rx="8" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="339.0" y="140.0" text-anchor="middle" font-size="10.8" font-weight="bold" fill="#b85450" filter="url(#rough2)">长度 len 的窗口向右滑</text>
  <rect x="60.0" y="170.0" width="320.0" height="150.0" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="76.0" y="196.0" text-anchor="start" font-size="11.6" font-weight="bold" fill="#446688" filter="url(#rough2)">线段树（按值压缩）</text>
  <text x="76.0" y="222.0" text-anchor="start" font-size="11.0" fill="#2b2b2b" filter="url(#rough2)">cnt[v]、sum[v]：值的个数与和</text>
  <text x="76.0" y="246.0" text-anchor="start" font-size="11.0" fill="#2b2b2b" filter="url(#rough2)">查询 1：最小的 m₁ 个之和 A</text>
  <text x="76.0" y="268.0" text-anchor="start" font-size="11.0" fill="#2b2b2b" filter="url(#rough2)">查询 2：最大的 m₂ 个之和 B</text>
  <text x="76.0" y="292.0" text-anchor="start" font-size="10.4" fill="#6b6b6b" filter="url(#rough2)">m₁ = min(k, 负数个数)，m₂ = min(k, 正数个数)</text>
  <rect x="400.0" y="170.0" width="320.0" height="150.0" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="416.0" y="196.0" text-anchor="start" font-size="11.6" font-weight="bold" fill="#2f5b34" filter="url(#rough2)">每个窗口</text>
  <text x="416.0" y="222.0" text-anchor="start" font-size="11.0" fill="#2b2b2b" filter="url(#rough2)">S = 窗口和（前缀和 O(1)）</text>
  <text x="416.0" y="246.0" text-anchor="start" font-size="11.0" fill="#2b2b2b" filter="url(#rough2)">候选 1 = S − 2A</text>
  <text x="416.0" y="268.0" text-anchor="start" font-size="11.0" fill="#2b2b2b" filter="url(#rough2)">候选 2 = 2B − S</text>
  <text x="416.0" y="292.0" text-anchor="start" font-size="10.6" fill="#6b6b6b" filter="url(#rough2)">答案取所有窗口、两个候选的最大值</text>
</svg>
