<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="47"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="340" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">D：指数是 10^6 位的十进制串，怎么算 b^E mod c</text>
  <path d="M 120 42 Q 380 47 640 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <rect x="40" y="70" width="330" height="104" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="94" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">把 c 分解成素数幂 c = ∏ p^e</text>
  <text x="52" y="120" font-size="10.5" fill="#3c5e88" filter="url(#rough2)">p ∤ b：b^E ≡ b^(E mod φ(p^e))　（欧拉定理）</text>
  <text x="52" y="144" font-size="10.5" fill="#3c5e88" filter="url(#rough2)">p | b：E ≥ e 时 b^E ≡ 0　（因子已经被吃掉）</text>
  <text x="52" y="164" font-size="10.5" fill="#3c5e88" filter="url(#rough2)">最后用 CRT 合并（模数两两互素）</text>

  <rect x="40" y="188" width="330" height="86" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="212" font-size="11.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">统一的写法（实现只用这一条）</text>
  <text x="52" y="238" font-size="11" fill="#2f5223" filter="url(#rough2)">E ≥ 64 时：b^E ≡ b^(E mod φ(c) + φ(c))　(mod c)</text>
  <text x="52" y="262" font-size="10" fill="#3c5e2e" filter="url(#rough2)">E 很小时（&lt; 64）直接快速幂，不能降幂</text>

  <rect x="400" y="70" width="320" height="204" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="412" y="94" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">为什么“+φ(c)”不会算错</text>
  <text x="412" y="120" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">· p ∤ b 时：φ(p^e) 整除 φ(c)，</text>
  <text x="412" y="140" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">　所以两指数对 φ(p^e) 同余；</text>
  <text x="412" y="162" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">· p | b 时：需要指数 ≥ e。</text>
  <text x="412" y="182" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">　E mod φ(c) + φ(c) ≥ φ(c) ≥ e（c ≤ 1e9 时 e ≤ 30）</text>
  <text x="412" y="206" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">· E ≥ 64 则真指数也 ≥ e，两边都是 0；</text>
  <text x="412" y="226" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">· CRT 合并时每个素数幂都对，全局就对。</text>
  <text x="412" y="252" font-size="10.5" fill="#8c3a36" filter="url(#rough2)">E &lt; 64 时若也降幂，会把 b^E ≠ 0 算成 0，所以必须分段。</text>

  <line x1="200" y1="286" x2="200" y2="300" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="40" y="322" font-size="10.5" fill="#555" filter="url(#rough2)">E = n − 1 与 b 都按十进制字符串读入：E mod φ(c) 只需要一次 O(|E|) 扫描，φ(c) 由试除得到。</text>
</svg>
