  <text x="76" y="297" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">L = 8</text>
  <text x="160" y="297" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">i ∈ {0,2,4,6} 中满足 j=i+L−1 为奇数的位置</text>
  <text x="500" y="297" text-anchor="start" font-size="11" fill="#8a2b28" filter="url(#rough2)">内容都是 abababab</text>
  <text x="700" y="297" text-anchor="start" font-size="11" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">→ 1 个</text>
  <text x="450" y="332" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1 + 1 + 1 + 1 = 4 ✓</text>
</svg>
