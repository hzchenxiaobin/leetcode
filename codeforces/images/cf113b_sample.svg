  <rect width="900" height="350" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">样例 3：t = abababab，s_begin = a，s_end = b</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">长度 2、4、6、8 各自恰好一个等价类，合计 4</text>
  <g filter="url(#rough2)"><rect x="60" y="90" width="52" height="40" rx="4" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
