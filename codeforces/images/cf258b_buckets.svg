<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="340" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">先按"幸运数字个数"给 1..m 的数字分桶</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">再把 6 个政党看成"从桶里选人"的组合计数：C(剩余政党数, t) × P(同桶可选数, t)</text>
  <g filter="url(#rough2)"><rect x="120" y="110" width="100" height="46" rx="4" fill="#eeeeee" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="170.0" y="137.68" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">k=0</text>
  <text x="170" y="180" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">cnt[k]</text>
  <g filter="url(#rough2)"><rect x="250" y="110" width="100" height="46" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="300.0" y="137.68" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">k=1</text>
  <text x="300" y="180" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">cnt[k]</text>
  <g filter="url(#rough2)"><rect x="380" y="110" width="100" height="46" rx="4" fill="#cfe0f0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="430.0" y="137.68" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">k=2</text>
  <text x="430" y="180" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">cnt[k]</text>
  <g filter="url(#rough2)"><rect x="510" y="110" width="100" height="46" rx="4" fill="#f6e3c4" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="560.0" y="137.68" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">k=3</text>
  <text x="560" y="180" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">cnt[k]</text>
  <g filter="url(#rough2)"><rect x="640" y="110" width="100" height="46" rx="4" fill="#f6d9d7" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="690.0" y="137.68" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">k=4</text>
  <text x="690" y="180" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">cnt[k]</text>
  <g filter="url(#rough2)"><rect x="770" y="110" width="100" height="46" rx="4" fill="#e2e2e2" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="820.0" y="137.68" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">k=5</text>
  <text x="820" y="180" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">cnt[k]</text>
  <text x="440" y="235" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">dp[j][s]：已给 j 个政党分号、共含 s 个幸运数字</text>
  <text x="440" y="268" text-anchor="middle" font-size="13" fill="#3d6b2f" filter="url(#rough2)">答案 = Σ_k cnt[k] · (6 个政党总幸运数 &lt; k 的方案数)</text>
  <text x="440" y="305" text-anchor="middle" font-size="12.5" fill="#b05a5a" filter="url(#rough2)">每个政党拿到号码后不能重复 → 用下降幂 P(n,t) 而不是幂</text>
</svg>
