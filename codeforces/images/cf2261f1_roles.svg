<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>
  <text x="22" y="30" font-size="15" fill="#333" filter="url(#rough2)">每个目标只需 2~3 个 0：刹车、刻度、指纹</text>

  <!-- band 1: row phase -->
  <rect x="22" y="48" width="536" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="40" y="72" font-size="13" fill="#446688" filter="url(#rough2)">① 行阶段（宽恒为 n）：目标行上方留一个“刹车”0</text>
  <g filter="url(#rough2)">
    <rect x="40" y="84" width="120" height="48" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="3"/>
    <line x1="70" y1="84" x2="70" y2="132" stroke="#dddddd"/>
    <line x1="100" y1="84" x2="100" y2="132" stroke="#dddddd"/>
    <line x1="130" y1="84" x2="130" y2="132" stroke="#dddddd"/>
    <line x1="40" y1="100" x2="160" y2="100" stroke="#dddddd"/>
    <line x1="40" y1="116" x2="160" y2="116" stroke="#dddddd"/>
    <circle cx="55" cy="92" r="4" fill="#b85450"/>
    <text x="66" y="96" font-size="10" fill="#b85450">刹车 (r−2,1)</text>
    <rect x="40" y="116" width="120" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <text x="46" y="128" font-size="9" fill="#d6a040">目标行 r：放 (r,c) 与 (r,c−1)</text>
  </g>
  <text x="178" y="106" font-size="12" fill="#333" filter="url(#rough2)">扫过刹车时 z 由 3 掉到 2：</text>
  <text x="178" y="124" font-size="12" fill="#333" filter="url(#rough2)">Hn−3 → U 变成 Hn−2 → D，</text>
  <text x="178" y="140" font-size="12" fill="#b85450" filter="url(#rough2)">于是恰好停在目标行附近的三行。</text>

  <!-- band 2: column phase -->
  <rect x="22" y="156" width="536" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="40" y="180" font-size="13" fill="#4a7a3a" filter="url(#rough2)">② 列阶段（只剩 3 行）：目标行里的 0 当“刻度”</text>
  <g filter="url(#rough2)">
    <rect x="40" y="192" width="120" height="48" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <line x1="70" y1="192" x2="70" y2="240" stroke="#dddddd"/>
    <line x1="100" y1="192" x2="100" y2="240" stroke="#dddddd"/>
    <line x1="130" y1="192" x2="130" y2="240" stroke="#dddddd"/>
    <line x1="40" y1="208" x2="160" y2="208" stroke="#dddddd"/>
    <line x1="40" y1="224" x2="160" y2="224" stroke="#dddddd"/>
    <circle cx="85" cy="216" r="4" fill="#b85450"/>
    <circle cx="115" cy="216" r="4" fill="#b85450"/>
    <text x="60" y="236" font-size="9" fill="#b85450">刻度 (r,c−1),(r,c)</text>
  </g>
  <text x="178" y="212" font-size="12" fill="#333" filter="url(#rough2)">S = 3W − z：z=2 时删左，z=1 时删右</text>
  <text x="178" y="232" font-size="12" fill="#333" filter="url(#rough2)">3W−2 → L、3W−3/3W−1 → R，</text>
  <text x="178" y="252" font-size="12" fill="#b85450" filter="url(#rough2)">刻度用完的瞬间正好停在目标列。</text>

  <!-- band 3: ending -->
  <rect x="22" y="264" width="536" height="116" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="40" y="288" font-size="13" fill="#d6a040" filter="url(#rough2)">③ 收尾（3×1）：0 的摆放就是“指纹”</text>
  <g filter="url(#rough2)">
    <rect x="40" y="300" width="34" height="62" fill="#ffffff" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <text x="57" y="322" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="57" y="340" text-anchor="middle" font-size="12" fill="#333">0</text>
    <text x="57" y="358" text-anchor="middle" font-size="12" fill="#333">1</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="96" y="300" width="34" height="62" fill="#ffffff" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <text x="113" y="322" text-anchor="middle" font-size="12" fill="#333">0</text>
    <text x="113" y="340" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="113" y="358" text-anchor="middle" font-size="12" fill="#333">1</text>
  </g>
  <text x="150" y="318" font-size="12" fill="#333" filter="url(#rough2)">S=2 → D 删下边，S=1 → U 删上边：</text>
  <text x="150" y="338" font-size="12" fill="#333" filter="url(#rough2)">两种指纹分别留下中间行 / 第 1 行 / 第 3 行，</text>
  <text x="150" y="358" font-size="12" fill="#b85450" filter="url(#rough2)">于是目标行被唯一钉死（r=1、r=n 另有专门摆法）。</text>

  <path d="M290 144 L290 156" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M290 252 L290 264" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
