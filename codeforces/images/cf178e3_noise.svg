  <rect x="50.0" y="288.0" width="684.0" height="56.0" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="64.0" y="312.0" text-anchor="start" font-size="11.2" fill="#33506e" filter="url(#rough2)">为什么要两遍：单遍后小图形（直径 15）的边角仍毛糙，二值面积/矩会被拉偏；</text>
  <text x="64.0" y="332.0" text-anchor="start" font-size="11.2" fill="#33506e" filter="url(#rough2)">两遍 5×5 多数滤波后，小方块的角被磨圆，所以才需要后面的“模板拟合”。</text>
</svg>
