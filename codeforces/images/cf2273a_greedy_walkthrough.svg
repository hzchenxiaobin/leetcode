<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="680" height="440" fill="#fafafa"/>

  <text x="340" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">贪心装填走查：n = 8，K* = 3</text>
  <text x="340" y="50" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">从大桶到小桶，每步取 t_i = min(⌊K/i⌋, ⌊rem/i⌋) 个大小为 i 的桶</text>

  <g font-size="11.5" text-anchor="middle" fill="#333" font-weight="bold">
    <text x="140" y="90" filter="url(#rough2)">桶大小 i</text>
    <text x="255" y="90" filter="url(#rough2)">容量 ⌊K/i⌋</text>
    <text x="370" y="90" filter="url(#rough2)">装前 rem</text>
    <text x="468" y="90" filter="url(#rough2)">取用 t_i</text>
    <text x="565" y="90" filter="url(#rough2)">装后 rem</text>
  </g>
  <g filter="url(#rough2)" stroke="#c9c9c0" stroke-width="1.1" fill="none">
    <path d="M 88 100 L 612 100"/>
    <path d="M 88 140 L 612 140"/>
    <path d="M 88 178 L 612 178"/>
    <path d="M 88 216 L 612 216"/>
  </g>
  <g filter="url(#rough2)">
    <rect x="89" y="179" width="523" height="36" fill="#fff8e1" stroke="none"/>
  </g>

  <g font-size="14" text-anchor="middle" fill="#333">
    <text x="140" y="126" filter="url(#rough2)">3</text>
    <text x="255" y="126" filter="url(#rough2)">1</text>
    <text x="370" y="126" filter="url(#rough2)">8</text>
    <text x="468" y="126" filter="url(#rough2)">1</text>
    <text x="565" y="126" fill="#b85450" filter="url(#rough2)">5</text>

    <text x="140" y="164" filter="url(#rough2)">2</text>
    <text x="255" y="164" filter="url(#rough2)">1</text>
    <text x="370" y="164" filter="url(#rough2)">5</text>
    <text x="468" y="164" filter="url(#rough2)">1</text>
    <text x="565" y="164" fill="#b85450" filter="url(#rough2)">3</text>

    <text x="140" y="202" filter="url(#rough2)">1</text>
    <text x="255" y="202" filter="url(#rough2)">3</text>
    <text x="370" y="202" filter="url(#rough2)">3</text>
    <text x="468" y="202" filter="url(#rough2)">3</text>
    <text x="565" y="202" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">0 ✓</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="88" y="232" width="504" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="340" y="259" text-anchor="middle" font-size="13" fill="#33517a" filter="url(#rough2)">装出 3 + 2 + 1 + 1 + 1 = 8 个 → a = 1 1 1 2 2 3 4 5</text>

  <g filter="url(#rough2)">
    <rect x="88" y="286" width="504" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="340" y="310" text-anchor="middle" font-size="13" fill="#2e6e2e" filter="url(#rough2)">c_1 = 3，c_2 = 1，c_3 = 1（5 个非空桶，编号 1..5）</text>
  <text x="340" y="332" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8e3b36" filter="url(#rough2)">cost = max(1·3, 2·1, 3·1) = 3 = K* ✓</text>

  <text x="340" y="374" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">每个 i 都满足 i·c_i ≤ K* ⇒ 代价不超过 K*；又 n &gt; f(K*−1) ⇒ 不可能更小</text>
  <text x="340" y="396" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">i = 3、2 受容量限制（t_i = ⌊K/i⌋）；i = 1 时 rem = 3 恰为容量，把 rem 清零</text>
  <text x="340" y="418" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">i = 1 的容量恒为 ⌊K/1⌋ = K，是收尾的「兜底桶」</text>
</svg>
