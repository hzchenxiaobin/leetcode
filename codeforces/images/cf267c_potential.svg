<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="61"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="a11" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="420" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">路径无关 ⟺ 流量是某个「势」的差</text>
  <path d="M 104 42 Q 360 48 616 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 图：1-2-3-4 加一条 1-3 -->
  <g filter="url(#rough2)">
    <circle cx="90" cy="120" r="26" fill="#dfeafc" stroke="#446688" stroke-width="1.8"/>
    <circle cx="260" cy="80" r="26" fill="#e8f4e0" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="260" cy="180" r="26" fill="#e8f4e0" stroke="#4a7a3a" stroke-width="1.8"/>
    <circle cx="470" cy="130" r="26" fill="#fbeeee" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <g font-size="14" text-anchor="middle" fill="#22314a" filter="url(#rough2)">
    <text x="90" y="126">1</text>
    <text x="260" y="86">2</text>
    <text x="260" y="186">3</text>
    <text x="470" y="136">n</text>
  </g>
  <g font-size="15" text-anchor="middle" fill="#8a6015" filter="url(#rough2)">
    <text x="90" y="166">φ=1</text>
    <text x="260" y="124">0.6</text>
    <text x="260" y="222">0.3</text>
    <text x="470" y="172">φ=0</text>
  </g>
  <g stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)">
    <path d="M 114 110 L 236 88" marker-end="url(#a11)"/>
    <path d="M 114 132 L 236 172" marker-end="url(#a11)"/>
    <path d="M 286 96 L 448 120" marker-end="url(#a11)"/>
    <path d="M 286 172 L 448 140" marker-end="url(#a11)"/>
  </g>
  <g font-size="12" fill="#2f4a66" filter="url(#rough2)">
    <text x="160" y="88">0.4</text>
    <text x="160" y="176">0.7</text>
    <text x="350" y="94">0.6</text>
    <text x="350" y="176">0.3</text>
  </g>

  <!-- 路径无关 -->
  <g filter="url(#rough2)">
    <rect x="520" y="66" width="170" height="120" rx="8" fill="#ffffff" stroke="#888" stroke-width="1.2"/>
  </g>
  <g font-size="12" fill="#333" filter="url(#rough2)">
    <text x="534" y="90">1→2→n：0.4 + 0.6 = 1</text>
    <text x="534" y="114">1→3→n：0.7 + 0.3 = 1</text>
    <text x="534" y="142">两条路径和相同，</text>
    <text x="534" y="164">正是「路径无关」。</text>
  </g>

  <!-- 公式 -->
  <g filter="url(#rough2)">
    <rect x="60" y="246" width="620" height="66" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="360" y="272" text-anchor="middle" font-size="14" fill="#22314a" filter="url(#rough2)">
    对每条边 (a,b)：traffic = φ(a) − φ(b)，且 |traffic| ≤ c
  </text>
  <text x="360" y="298" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">
    平行边会被迫同向同量：任意两点间的路径和必须一致
  </text>

  <!-- 守恒 -->
  <g filter="url(#rough2)">
    <rect x="60" y="324" width="620" height="80" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <g font-size="12.5" fill="#2f5223" filter="url(#rough2)">
    <text x="74" y="348">守恒（内部点）：Σ_{u~v} (φ(v) − φ(u)) = 0</text>
    <text x="74" y="370">即 deg(v)·φ(v) − Σ_{u~v} φ(u) = 0 —— 图拉普拉斯方程。</text>
    <text x="74" y="392">再固定 φ(1)=1、φ(n)=0，就得到唯一的一组「单位势」。</text>
  </g>
</svg>
