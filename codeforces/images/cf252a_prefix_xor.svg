<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="420" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">前缀异或：区间异或 = 两个前缀值的异或</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">xor(a[l..r]) = p[r] ^ p[l-1]，于是 n^2 个区间只是 n+1 个前缀值的两两组合</text>
  <text x="90" y="105" text-anchor="middle" font-size="13" fill="#555555" filter="url(#rough2)">数组 a</text>
  <g filter="url(#rough2)"><rect x="150" y="118" width="62" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="181.0" y="145.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="181" y="180" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">a1</text>
  <g filter="url(#rough2)"><rect x="224" y="118" width="62" height="44" rx="4" fill="#f6d9d7" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="255.0" y="145.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="255" y="180" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">a2</text>
  <g filter="url(#rough2)"><rect x="298" y="118" width="62" height="44" rx="4" fill="#f6d9d7" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="329.0" y="145.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="329" y="180" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">a3</text>
  <g filter="url(#rough2)"><rect x="372" y="118" width="62" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="403.0" y="145.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="403" y="180" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">a4</text>
  <g filter="url(#rough2)"><rect x="446" y="118" width="62" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="477.0" y="145.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="477" y="180" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">a5</text>
  <text x="90" y="268" text-anchor="middle" font-size="13" fill="#555555" filter="url(#rough2)">前缀 p</text>
  <g filter="url(#rough2)"><rect x="76" y="282" width="62" height="44" rx="4" fill="#f6e3c4" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="107.0" y="309.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="107" y="344" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">p0</text>
  <g filter="url(#rough2)"><rect x="150" y="282" width="62" height="44" rx="4" fill="#f6d9d7" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="181.0" y="309.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="181" y="344" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">p1</text>
  <g filter="url(#rough2)"><rect x="224" y="282" width="62" height="44" rx="4" fill="#f6e3c4" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="255.0" y="309.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="255" y="344" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">p2</text>
  <g filter="url(#rough2)"><rect x="298" y="282" width="62" height="44" rx="4" fill="#f6d9d7" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="329.0" y="309.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="329" y="344" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">p3</text>
  <g filter="url(#rough2)"><rect x="372" y="282" width="62" height="44" rx="4" fill="#f6e3c4" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="403.0" y="309.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="403" y="344" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">p4</text>
  <g filter="url(#rough2)"><rect x="446" y="282" width="62" height="44" rx="4" fill="#f6e3c4" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="477.0" y="309.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="477" y="344" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">p5</text>
  <path d="M150,200 L150,240 L298,240 L298,200" fill="none" stroke="#b05a5a" stroke-width="1.5" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="224" y="258" text-anchor="middle" font-size="12" fill="#b05a5a" filter="url(#rough2)">区间 [2,3]</text>
  <text x="440" y="380" text-anchor="middle" font-size="13" fill="#3d6b2f" filter="url(#rough2)">xor(a[2..3]) = p3 ^ p1 = 2 ^ 1 = 3，正是全部 15 个区间里的最大值</text>
</svg>
