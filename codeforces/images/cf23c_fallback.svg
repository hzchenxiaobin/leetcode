<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="253" />
      <feDisplacementMap in="SourceGraphic" scale="1.5" />
    </filter>
  </defs>

  <rect width="760" height="430" fill="#fafafa" />

  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">奇数位橙子不够：换成“偶数位 + 最后一个”</text>
  <path d="M 100 44 Q 380 50 660 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)" />

  <text x="40" y="78" font-size="11.5" fill="#555" filter="url(#rough2)">同一组排序后的箱子（括号内为苹果、橙子）：</text>

  <g>
    <rect x="40" y="94" width="112" height="100" rx="9" fill="#f0f0f0" stroke="#999" stroke-width="1.3" filter="url(#rough2)" />
    <rect x="180" y="94" width="112" height="100" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)" />
    <rect x="320" y="94" width="112" height="100" rx="9" fill="#f0f0f0" stroke="#999" stroke-width="1.3" filter="url(#rough2)" />
    <rect x="460" y="94" width="112" height="100" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)" />
    <rect x="600" y="94" width="112" height="100" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)" />
  </g>
  <text x="96" y="118" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">位置 1</text>
  <text x="236" y="118" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">位置 2</text>
  <text x="376" y="118" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">位置 3</text>
  <text x="516" y="118" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">位置 4</text>
  <text x="656" y="118" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">位置 5（最后）</text>

  <text x="96" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#555" filter="url(#rough2)">(1, 0)</text>
  <text x="236" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">(3, 8)</text>
  <text x="376" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#555" filter="url(#rough2)">(4, 1)</text>
  <text x="516" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">(6, 8)</text>
  <text x="656" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">(9, 2)</text>

  <text x="96" y="176" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">奇数位·未选</text>
  <text x="236" y="176" text-anchor="middle" font-size="10" fill="#2f5223" filter="url(#rough2)">偶数位·选</text>
  <text x="376" y="176" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">奇数位·未选</text>
  <text x="516" y="176" text-anchor="middle" font-size="10" fill="#2f5223" filter="url(#rough2)">偶数位·选</text>
  <text x="656" y="176" text-anchor="middle" font-size="10" fill="#8a6015" filter="url(#rough2)">补上·选</text>

  
  <rect x="40" y="214" width="330" height="82" rx="9" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.4" filter="url(#rough2)" />
  <text x="58" y="238" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">总数：苹果 23，橙子 19；一半是 11.5 与 9.5</text>
  <text x="58" y="260" font-size="11.5" fill="#8a3b36" filter="url(#rough2)">奇数位橙子 = 0+1+2 = 3 &lt; 9.5（不够）</text>
  <text x="58" y="282" font-size="11.5" fill="#2f5223" filter="url(#rough2)">偶数位橙子 = 8+8 = 16 &gt; 9.5（已过半）</text>

  <rect x="390" y="214" width="330" height="82" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)" />
  <text x="408" y="238" font-size="11.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">选位置 2、4、5：</text>
  <text x="408" y="260" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">苹果 3+6+9 = 18 ≥ 11.5</text>
  <text x="408" y="282" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">橙子 8+8+2 = 18 ≥ 9.5</text>

  
  <rect x="40" y="312" width="680" height="92" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)" />
  <text x="60" y="338" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">为什么补上最后一个，苹果仍然够一半？</text>
  <text x="60" y="362" font-size="12" fill="#7a5a1b" filter="url(#rough2)">“偶数位 + 最后一个”的苹果 = a2+a4+…+a_{2N-2}+a_{2N-1}，逐项配 a1≤a2、a3≤a4、…，</text>
  <text x="60" y="386" font-size="12" fill="#7a5a1b" filter="url(#rough2)">它不小于 a1+a3+…+a_{2N-3}，即不小于总数的一半；橙子则因为偶数位已过半而更够。</text>
</svg>