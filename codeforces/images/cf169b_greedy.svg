<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="847"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="280" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">从左到右：能换更大的就换当前最大的可用数字</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">高位优先 ⇒ 贪心最优</text>
  <text x="90" y="110" text-anchor="start" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">a = 1 0 2 4</text>
  <text x="90" y="150" text-anchor="start" font-size="12" fill="#4a7a3a" filter="url(#rough2)">s = 1 1 0（降序）</text>
  <text x="90" y="196" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">第 1 位 1：最大可用 1 不大于 1 ⇒ 保留</text>
  <text x="90" y="224" text-anchor="start" font-size="11" fill="#4a7a3a" filter="url(#rough2)">第 2 位 0：最大可用 1 &gt; 0 ⇒ 换成 1</text>
  <text x="450" y="262" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">结果 1 1 2 4</text>
</svg>
