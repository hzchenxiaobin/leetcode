<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="257"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="e57" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="450" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">非递减数组 ↔ 各值的出现次数 ↔ n 个星与 n−1 个竖线</text>
  <path d="M 70 40 Q 360 46 650 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 非递减数组 n=5 -->
  <text x="30" y="80" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">数组 a（n=5）</text>
  <g filter="url(#rough2)" font-size="15">
    <rect x="170" y="60" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="198" y="83" text-anchor="middle" font-weight="bold" fill="#2f5223">1</text>
    <rect x="226" y="60" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="254" y="83" text-anchor="middle" font-weight="bold" fill="#2f5223">1</text>
    <rect x="282" y="60" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="310" y="83" text-anchor="middle" font-weight="bold" fill="#2f4a66">2</text>
    <rect x="338" y="60" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="366" y="83" text-anchor="middle" font-weight="bold" fill="#8a6015">3</text>
    <rect x="394" y="60" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="422" y="83" text-anchor="middle" font-weight="bold" fill="#8a6015">3</text>
  </g>
  <text x="470" y="83" font-size="11.5" fill="#555" filter="url(#rough2)">长度 5，值都在 [1,5]，非递减</text>

  <!-- 出现次数 -->
  <g filter="url(#rough2)">
    <path d="M 310 102 L 310 126" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#e57)"/>
  </g>
  <text x="30" y="150" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">出现次数 c</text>
  <g filter="url(#rough2)" font-size="12">
    <rect x="170" y="130" width="70" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.3"/>
    <text x="205" y="152" text-anchor="middle">c₁=2</text>
    <rect x="240" y="130" width="70" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.3"/>
    <text x="275" y="152" text-anchor="middle">c₂=1</text>
    <rect x="310" y="130" width="70" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.3"/>
    <text x="345" y="152" text-anchor="middle">c₃=0</text>
    <rect x="380" y="130" width="70" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.3"/>
    <text x="415" y="152" text-anchor="middle">c₄=2</text>
    <rect x="450" y="130" width="70" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.3"/>
    <text x="485" y="152" text-anchor="middle">c₅=0</text>
  </g>
  <text x="170" y="180" font-size="11.5" fill="#2f5223" filter="url(#rough2)">c₁ + … + c₅ = 5（每个 c ≥ 0，c 与数组一一对应）</text>

  <!-- 星与竖线 -->
  <g filter="url(#rough2)">
    <path d="M 345 192 L 345 214" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#e57)"/>
  </g>
  <text x="30" y="240" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">星与竖线</text>
  <g filter="url(#rough2)" font-size="16">
    <rect x="170" y="218" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="190" y="242" text-anchor="middle" fill="#8a6015">★</text>
    <rect x="210" y="218" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="230" y="242" text-anchor="middle" fill="#8a6015">★</text>
    <rect x="250" y="218" width="40" height="34" fill="#eeeeee" stroke="#999" stroke-width="1.4"/>
    <text x="270" y="243" text-anchor="middle" fill="#666">|</text>
    <rect x="290" y="218" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="310" y="242" text-anchor="middle" fill="#8a6015">★</text>
    <rect x="330" y="218" width="40" height="34" fill="#eeeeee" stroke="#999" stroke-width="1.4"/>
    <text x="350" y="243" text-anchor="middle" fill="#666">|</text>
    <rect x="370" y="218" width="40" height="34" fill="#eeeeee" stroke="#999" stroke-width="1.4"/>
    <text x="390" y="243" text-anchor="middle" fill="#666">|</text>
    <rect x="410" y="218" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="430" y="242" text-anchor="middle" fill="#8a6015">★</text>
    <rect x="450" y="218" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="470" y="242" text-anchor="middle" fill="#8a6015">★</text>
    <rect x="490" y="218" width="40" height="34" fill="#eeeeee" stroke="#999" stroke-width="1.4"/>
    <text x="510" y="243" text-anchor="middle" fill="#666">|</text>
  </g>
  <text x="170" y="272" font-size="11.5" fill="#555" filter="url(#rough2)">c₁=2 个星 → 竖线 → c₂=1 个星 → 竖线 → c₃=0 个星 → 竖线 → …</text>

  <!-- 结论 -->
  <g filter="url(#rough2)">
    <rect x="60" y="292" width="600" height="128" rx="12" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="76" y="318" font-size="12.5" font-weight="bold" fill="#2f5223">一共有 n 个星、n−1 个竖线，排成一列共 2n−1 个位置</text>
    <text x="76" y="344" font-size="12" fill="#2b2b2b">选定哪 n 个位置放星，就唯一确定一个非递减数组；反之亦然。</text>
    <text x="76" y="372" font-size="13" font-weight="bold" fill="#b85450">非递减数组个数 = C(2n−1, n)</text>
    <text x="76" y="398" font-size="11.5" fill="#666">把每个值 v 换成 n+1−v，非递增数组与之双射，个数同样多。</text>
  </g>

  <text x="360" y="440" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">注意是 2n−1（n 个星 + n−1 个竖线），不是 2n。</text>
</svg>
