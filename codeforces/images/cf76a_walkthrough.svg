<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="720" height="440" fill="#fafafa"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例走查：G = 2, S = 1，三条边按 g 排序</text>
  <path d="M 200 43 Q 360 49 520 43" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <rect x="46" y="76" width="628" height="86" rx="7" fill="#fdecea" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="66" y="102" text-anchor="start" font-size="13.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">前缀 ①</text>
  <text x="66" y="126" text-anchor="start" font-size="11" fill="#777777" filter="url(#rough2)">1-2 (g=4, s=20)</text>
  <text x="226" y="102" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">只有 1 条边，2、3 不连通</text>
  <text x="600" y="138" text-anchor="end" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">—</text>
  <rect x="46" y="176" width="628" height="86" rx="7" fill="#e9f4e2" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="66" y="202" text-anchor="start" font-size="13.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">前缀 ②</text>
  <text x="66" y="226" text-anchor="start" font-size="11" fill="#777777" filter="url(#rough2)">+ 1-3 (g=5, s=1)</text>
  <text x="226" y="202" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">MST = {(4,20),(5,1)}，s_max = 20</text>
  <text x="600" y="238" text-anchor="end" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">5·2+20·1 = 30</text>
  <rect x="46" y="276" width="628" height="86" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="66" y="302" text-anchor="start" font-size="13.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">前缀 ③</text>
  <text x="66" y="326" text-anchor="start" font-size="11" fill="#777777" filter="url(#rough2)">+ 1-2 (g=10, s=15)</text>
  <text x="226" y="302" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">MST = {(5,1),(10,15)}，s_max = 15</text>
  <text x="600" y="338" text-anchor="end" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">10·2+15·1 = 35</text>
  <text x="56" y="392" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">a 只能取到某条边的 g：前缀 ② 里真正用到的最大 g 是 5，所以 a = 5。</text>
  <text x="56" y="416" text-anchor="start" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">三个候选里 30 最小 → 答案 30（样例输出一致）。</text>
</svg>
