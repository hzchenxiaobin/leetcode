<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="95"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="380" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">181B 样例 1 走查</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="40.0" y="92.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">点：(1,1)、(2,2)、(3,3)</text>
  <text x="70.0" y="130.0" text-anchor="start" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">无序点对 (A,C)</text>
  <text x="330.0" y="130.0" text-anchor="start" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">中点</text>
  <text x="520.0" y="130.0" text-anchor="start" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">在点集里？</text>
  <rect x="60.0" y="144.0" width="600.0" height="38.0" fill="#ffffff" stroke="#dddddd" stroke-width="1.1" rx="6" filter="url(#rough2)"/>
  <text x="70.0" y="170.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">(1,1) + (2,2)</text>
  <text x="330.0" y="170.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">(1.5,1.5)</text>
  <text x="520.0" y="170.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">不是整点，跳过</text>
  <rect x="60.0" y="192.0" width="600.0" height="38.0" fill="#ffffff" stroke="#dddddd" stroke-width="1.1" rx="6" filter="url(#rough2)"/>
  <text x="70.0" y="218.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">(2,2) + (3,3)</text>
  <text x="330.0" y="218.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">(2.5,2.5)</text>
  <text x="520.0" y="218.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">不是整点，跳过</text>
  <rect x="60.0" y="240.0" width="600.0" height="38.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.1" rx="6" filter="url(#rough2)"/>
  <text x="70.0" y="266.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">(1,1) + (3,3)</text>
  <text x="330.0" y="266.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">(2,2)</text>
  <text x="520.0" y="266.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">是 → 计数 +1</text>
  <rect x="40.0" y="330.0" width="640.0" height="40.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="54.0" y="353.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">答案 1，与官方输出一致</text>
</svg>
