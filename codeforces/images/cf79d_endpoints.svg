<svg xmlns="http://www.w3.org/2000/svg" width="880" height="372" viewBox="0 0 880 372"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="79"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="880" height="372" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">翻转一个区间 = 在差分数组里翻两个端点</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">b[0] = s₁，b[i] = s_{i+1} ⊕ s_i，b[n] = s_n（s 为面板状态）</text>
  <g filter="url(#rough2)"><rect x="74" y="110" width="74" height="44" rx="3" fill="#ffffff" fill-opacity="0.75" stroke="#888888" stroke-width="1.2"/></g>
  <text x="111.0" y="138" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">s1</text>
  <text x="111.0" y="102" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="148" y="110" width="74" height="44" rx="3" fill="#f6d9d7" fill-opacity="0.75" stroke="#888888" stroke-width="1.2"/></g>
  <text x="185.0" y="138" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">s2</text>
  <text x="185.0" y="102" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="222" y="110" width="74" height="44" rx="3" fill="#f6d9d7" fill-opacity="0.75" stroke="#888888" stroke-width="1.2"/></g>
  <text x="259.0" y="138" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">s3</text>
  <text x="259.0" y="102" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="296" y="110" width="74" height="44" rx="3" fill="#f6d9d7" fill-opacity="0.75" stroke="#888888" stroke-width="1.2"/></g>
  <text x="333.0" y="138" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">s4</text>
  <text x="333.0" y="102" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><rect x="370" y="110" width="74" height="44" rx="3" fill="#f6d9d7" fill-opacity="0.75" stroke="#888888" stroke-width="1.2"/></g>
  <text x="407.0" y="138" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">s5</text>
  <text x="407.0" y="102" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">5</text>
  <g filter="url(#rough2)"><rect x="444" y="110" width="74" height="44" rx="3" fill="#ffffff" fill-opacity="0.75" stroke="#888888" stroke-width="1.2"/></g>
  <text x="481.0" y="138" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">s6</text>
  <text x="481.0" y="102" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">6</text>
  <g filter="url(#rough2)"><rect x="518" y="110" width="74" height="44" rx="3" fill="#ffffff" fill-opacity="0.75" stroke="#888888" stroke-width="1.2"/></g>
  <text x="555.0" y="138" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">s7</text>
  <text x="555.0" y="102" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">7</text>
  <g filter="url(#rough2)"><rect x="592" y="110" width="74" height="44" rx="3" fill="#ffffff" fill-opacity="0.75" stroke="#888888" stroke-width="1.2"/></g>
  <text x="629.0" y="138" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">s8</text>
  <text x="629.0" y="102" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">8</text>
  <g filter="url(#rough2)"><path d="M 148 84 L 444 84" fill="none" stroke="#b85450" stroke-width="2.4" marker-end="url(#arrb)"/></g>
  <text x="296" y="76" text-anchor="middle" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">翻转长度 A = 4 的一段</text>
  <g filter="url(#rough2)"><rect x="54" y="240" width="46" height="40" rx="3" fill="#ffffff" fill-opacity="0.9" stroke="#999999" stroke-width="1.2"/></g>
  <text x="77" y="266" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">b0</text>
  <g filter="url(#rough2)"><rect x="128" y="240" width="46" height="40" rx="3" fill="#d7ecd0" fill-opacity="0.8" stroke="#3d6b2f" stroke-width="1.2"/></g>
  <text x="151" y="266" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">b1</text>
  <g filter="url(#rough2)"><rect x="202" y="240" width="46" height="40" rx="3" fill="#ffffff" fill-opacity="0.9" stroke="#999999" stroke-width="1.2"/></g>
  <text x="225" y="266" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">b2</text>
  <g filter="url(#rough2)"><rect x="276" y="240" width="46" height="40" rx="3" fill="#ffffff" fill-opacity="0.9" stroke="#999999" stroke-width="1.2"/></g>
  <text x="299" y="266" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">b3</text>
  <g filter="url(#rough2)"><rect x="350" y="240" width="46" height="40" rx="3" fill="#ffffff" fill-opacity="0.9" stroke="#999999" stroke-width="1.2"/></g>
  <text x="373" y="266" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">b4</text>
  <g filter="url(#rough2)"><rect x="424" y="240" width="46" height="40" rx="3" fill="#d7ecd0" fill-opacity="0.8" stroke="#3d6b2f" stroke-width="1.2"/></g>
  <text x="447" y="266" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">b5</text>
  <g filter="url(#rough2)"><rect x="498" y="240" width="46" height="40" rx="3" fill="#ffffff" fill-opacity="0.9" stroke="#999999" stroke-width="1.2"/></g>
  <text x="521" y="266" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">b6</text>
  <g filter="url(#rough2)"><rect x="572" y="240" width="46" height="40" rx="3" fill="#ffffff" fill-opacity="0.9" stroke="#999999" stroke-width="1.2"/></g>
  <text x="595" y="266" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">b7</text>
  <g filter="url(#rough2)"><rect x="646" y="240" width="46" height="40" rx="3" fill="#ffffff" fill-opacity="0.9" stroke="#999999" stroke-width="1.2"/></g>
  <text x="669" y="266" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">b8</text>
  <text x="66" y="266" text-anchor="end" font-size="12" fill="#3d6b2f" font-weight="bold" filter="url(#rough2)">差分</text>
  <text x="450" y="310" text-anchor="middle" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">区间 [2,5] 被翻转 ⇔ b₁ 与 b₅ 各翻一次，其余 b 不变</text>
  <text x="450" y="336" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">一般地：长度 A、起点 l 的一次操作 ⇔ 同时翻 b[l−1] 和 b[l−1+A]</text>
  <text x="450" y="360" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">于是问题变成：用给定长度的「配对」把所有 1 消掉，操作数最少</text>
</svg>
