<svg xmlns="http://www.w3.org/2000/svg" width="840" height="320" viewBox="0 0 840 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="320" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">配对 i 与 i+n/2，编号差恒为 n/2 ≥ 2</text>
  <text x="420" y="56" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">n=6：配对 (1,4),(2,5),(3,6)</text>
  <g filter="url(#rough2)"><rect x="200" y="100" width="56" height="44" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="228" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="270" y="100" width="56" height="44" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="298" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="340" y="100" width="56" height="44" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="368" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="410" y="100" width="56" height="44" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="438" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><rect x="480" y="100" width="56" height="44" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="508" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <g filter="url(#rough2)"><rect x="550" y="100" width="56" height="44" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="578" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">6</text>
  <g filter="url(#rough2)"><line x1="228" y1="160" x2="298" y2="160" stroke="#a0522d" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><line x1="368" y1="160" x2="438" y2="160" stroke="#a0522d" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><line x1="508" y1="160" x2="578" y2="160" stroke="#a0522d" stroke-width="1.4"/></g>
  <text x="263" y="182" text-anchor="middle" font-size="10" fill="#a0522d" filter="url(#rough2)">差 3</text>
  <text x="403" y="182" text-anchor="middle" font-size="10" fill="#a0522d" filter="url(#rough2)">差 3</text>
  <text x="543" y="182" text-anchor="middle" font-size="10" fill="#a0522d" filter="url(#rough2)">差 3</text>
  <text x="420" y="230" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">差 ≥ 2 ⇒ 不违反"编号相差 1 不能同桌"</text>
  <g filter="url(#rough2)"><rect x="220" y="254" width="400" height="34" rx="4" fill="#f7fbf4" fill-opacity="0.85" stroke="#a8c99a" stroke-width="1.3"/></g>
  <text x="420" y="276" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3d6b2f" filter="url(#rough2)">每对中把 L 放左边即可避开"R 左 + L 右"</text>
</svg>
