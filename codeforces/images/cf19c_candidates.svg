<svg xmlns="http://www.w3.org/2000/svg" width="780" height="430" viewBox="0 0 780 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="409"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr19b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="780" height="430" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">每个重复段都躺在一对相同字母上：候选只需枚举这些"对"</text>

  <!-- 左：串与一对 -->
  <text x="60" y="64" font-size="11.5" fill="#555" filter="url(#rough2)">串 4 5 6 5 6 7 7，取一对相同的 5：位置 1 与 3</text>

  <rect x="60" y="78" width="50" height="42" rx="6" fill="#ffffff" stroke="#7a8ca6" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="116" y="78" width="50" height="42" rx="6" fill="#cfeacf" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="172" y="78" width="50" height="42" rx="6" fill="#ffffff" stroke="#7a8ca6" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="228" y="78" width="50" height="42" rx="6" fill="#cfeacf" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="284" y="78" width="50" height="42" rx="6" fill="#ffffff" stroke="#7a8ca6" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="340" y="78" width="50" height="42" rx="6" fill="#ffffff" stroke="#7a8ca6" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="396" y="78" width="50" height="42" rx="6" fill="#ffffff" stroke="#7a8ca6" stroke-width="1.2" filter="url(#rough2)"/>

  <text x="85" y="106" text-anchor="middle" font-size="17" fill="#33445c" filter="url(#rough2)">4</text>
  <text x="141" y="106" text-anchor="middle" font-size="17" fill="#204a1e" filter="url(#rough2)">5</text>
  <text x="197" y="106" text-anchor="middle" font-size="17" fill="#33445c" filter="url(#rough2)">6</text>
  <text x="253" y="106" text-anchor="middle" font-size="17" fill="#204a1e" filter="url(#rough2)">5</text>
  <text x="309" y="106" text-anchor="middle" font-size="17" fill="#33445c" filter="url(#rough2)">6</text>
  <text x="365" y="106" text-anchor="middle" font-size="17" fill="#33445c" filter="url(#rough2)">7</text>
  <text x="421" y="106" text-anchor="middle" font-size="17" fill="#33445c" filter="url(#rough2)">7</text>

  <!-- 连线：位置 1 与 3 -->
  <path d="M 141 126 L 141 146 L 253 146 L 253 126" stroke="#4a7a3a" stroke-width="1.6" fill="none"
        marker-end="url(#arr19b)" filter="url(#rough2)"/>
  <text x="197" y="164" text-anchor="middle" font-size="10.5" fill="#2f5223" filter="url(#rough2)">x = 3 - 1 = 2（配对给出候选长度）</text>

  <!-- 验证 -->
  <rect x="60" y="182" width="386" height="66" rx="9" fill="#eef4ff" stroke="#446688"
        stroke-width="1.3" filter="url(#rough2)"/>
  <text x="76" y="206" font-size="11.5" fill="#23405c" filter="url(#rough2)">候选 (l=1, x=2) 是否真的是平方？</text>
  <text x="76" y="228" font-size="11.5" fill="#23405c" filter="url(#rough2)">比较 a[1..3) 与 a[3..5)：哈希 O(1) 判定 "5 6" == "5 6" ✓</text>

  <!-- 右：计数上界 -->
  <text x="500" y="64" font-size="11.5" font-weight="bold" fill="#33445c" filter="url(#rough2)">候选总数 = Σ C(cᵥ, 2)</text>
  <rect x="500" y="78" width="238" height="26" fill="#eef1f4" stroke="#7a8ca6" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="560" y="96" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#33445c" filter="url(#rough2)">出现次数 cᵥ</text>
  <text x="660" y="96" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#33445c" filter="url(#rough2)">C(cᵥ,2)</text>

  <rect x="500" y="104" width="238" height="22" fill="#ffffff" stroke="#d6d6d6" stroke-width="1" filter="url(#rough2)"/>
  <text x="560" y="120" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="660" y="120" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">0</text>
  <rect x="500" y="126" width="238" height="22" fill="#f7fbff" stroke="#d6d6d6" stroke-width="1" filter="url(#rough2)"/>
  <text x="560" y="142" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">2</text>
  <text x="660" y="142" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">1</text>
  <rect x="500" y="148" width="238" height="22" fill="#ffffff" stroke="#d6d6d6" stroke-width="1" filter="url(#rough2)"/>
  <text x="560" y="164" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">5</text>
  <text x="660" y="164" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">10</text>
  <rect x="500" y="170" width="238" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="560" y="186" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">10（上限）</text>
  <text x="660" y="186" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">45</text>

  <text x="500" y="216" font-size="10.5" fill="#2f5223" filter="url(#rough2)">C(c,2) ≤ 4.5·c　⇒　总数 ≤ 4.5n</text>
  <text x="500" y="236" font-size="10.5" fill="#8c3b37" filter="url(#rough2)">n=10⁵ 时不超过 4.5×10⁵ 个候选</text>

  <!-- 单射说明 -->
  <rect x="60" y="264" width="678" height="62" rx="9" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.3" filter="url(#rough2)"/>
  <text x="76" y="288" font-size="11.5" fill="#8a6015" filter="url(#rough2)">映射 (l, x) ↦ 位置对 (l, l+x) 是单射：由位置对能唯一还原起点与长度，且 aₗ = aₗ₊ₓ。</text>
  <text x="76" y="310" font-size="11.5" fill="#8a6015" filter="url(#rough2)">所以"重复段个数 ≤ 相同字母对个数"——这就是每字母最多 10 次这条限制的全部价值。</text>

  <!-- 底部 -->
  <text x="60" y="354" font-size="11" fill="#666" filter="url(#rough2)">枚举方式：按取值把位置分组（每组 ≤ 10 个），组内两两配对 O(c²)；总代价 O(Σ c²) = O(n)。</text>
  <text x="60" y="374" font-size="11" fill="#666" filter="url(#rough2)">若不加"≤ 10 次"的限制，全相同字母时相同字母对是 O(n²)，本做法直接爆炸。</text>
  <text x="60" y="396" font-size="11" fill="#8c3b37" filter="url(#rough2)">每个候选都要再验一次"两半是否真相等"：配对只是必要条件，不是充分条件。</text>
</svg>
