<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2b2b2b"/>
    </marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arra" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="760" height="470" fill="#fafafa"/>
  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">从右往左合并：栈里每组的 fall 与 far</text>
  <path d="M 220 42 Q 380 48 540 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="70" y="72" text-anchor="start" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">处理 20</text>
  <rect x="18" y="92" width="128" height="54" rx="0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="82" y="114" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">x=20</text>
  <text x="82" y="134" text-anchor="middle" font-size="10" fill="#8a8a8a" filter="url(#rough2)">fall=1  far=24</text>
  <text x="70" y="340" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">fall = 1</text>
  <line x1="130" y1="160" x2="178" y2="160" stroke="#d6a040" stroke-width="2" opacity="1.0" marker-end="url(#arra)" filter="url(#rough2)"/>
  <text x="242" y="72" text-anchor="start" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">处理 18</text>
  <rect x="190" y="92" width="128" height="54" rx="0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="254" y="114" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">x=18</text>
  <text x="254" y="134" text-anchor="middle" font-size="10" fill="#8a8a8a" filter="url(#rough2)">fall=1  far=19</text>
  <rect x="190" y="154" width="128" height="54" rx="0" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="254" y="176" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">x=20</text>
  <text x="254" y="196" text-anchor="middle" font-size="10" fill="#8a8a8a" filter="url(#rough2)">fall=1  far=24</text>
  <text x="242" y="340" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">fall = 1</text>
  <line x1="302" y1="160" x2="350" y2="160" stroke="#d6a040" stroke-width="2" opacity="1.0" marker-end="url(#arra)" filter="url(#rough2)"/>
  <text x="414" y="72" text-anchor="start" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">处理 16</text>
  <rect x="362" y="92" width="128" height="54" rx="0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="426" y="114" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">x=16</text>
  <text x="426" y="134" text-anchor="middle" font-size="10" fill="#8a8a8a" filter="url(#rough2)">fall=3  far=24</text>
  <text x="414" y="340" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">fall = 1 + 1 + 1 = 3</text>
  <line x1="474" y1="160" x2="522" y2="160" stroke="#d6a040" stroke-width="2" opacity="1.0" marker-end="url(#arra)" filter="url(#rough2)"/>
  <text x="586" y="72" text-anchor="start" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">处理 10</text>
  <rect x="534" y="92" width="128" height="54" rx="0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="598" y="114" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">x=10</text>
  <text x="598" y="134" text-anchor="middle" font-size="10" fill="#8a8a8a" filter="url(#rough2)">fall=4  far=24</text>
  <text x="586" y="340" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">fall = 1 + 3 = 4</text>
  <text x="380" y="392" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">弹栈条件：x_top ≤ 当前可达 R；弹出一组就累加 fall、用 far 扩展 R</text>
  <text x="380" y="420" text-anchor="middle" font-size="12" fill="#8a8a8a" filter="url(#rough2)">最后把当前块压栈，far 记录整组能压到的最右位置</text>
  <text x="380" y="448" text-anchor="middle" font-size="12" fill="#8a8a8a" filter="url(#rough2)">每个下标入栈、出栈各一次 → 排序之外 O(n)</text>
</svg>
