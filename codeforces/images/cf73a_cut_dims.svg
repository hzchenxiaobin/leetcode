<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="61"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ad" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="420" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">三个方向的切面互相垂直，块数 = 三个方向段数之积</text>
  <path d="M 120 40 Q 360 46 600 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 长方体（斜二测） -->
  <g filter="url(#rough2)">
    <polygon points="120,270 400,270 480,190 200,190" fill="#eef4ff" stroke="#446688" stroke-width="1.8"/>
    <polygon points="120,270 400,270 400,300 120,300" fill="#dfe9f7" stroke="#446688" stroke-width="1.6"/>
    <polygon points="400,270 480,190 480,220 400,300" fill="#d6e2f2" stroke="#446688" stroke-width="1.6"/>
  </g>
  <!-- x 方向切面 -->
  <g filter="url(#rough2)" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 4">
    <line x1="220" y1="287" x2="500" y2="207"/>
    <line x1="320" y1="287" x2="440" y2="234"/>
  </g>
  <text x="238" y="176" font-size="12" font-weight="bold" fill="#8c2f2b" filter="url(#rough2)">p 刀（沿 x）</text>
  <line x1="240" y1="182" x2="262" y2="208" stroke="#b85450" stroke-width="1.2" marker-end="url(#ad)" filter="url(#rough2)"/>

  <!-- y 方向切面 -->
  <g filter="url(#rough2)" stroke="#2f7a3a" stroke-width="1.6" stroke-dasharray="6 4">
    <line x1="180" y1="212" x2="460" y2="212"/>
    <line x1="240" y1="234" x2="520" y2="234"/>
  </g>
  <text x="516" y="128" font-size="12" font-weight="bold" fill="#1f5226" filter="url(#rough2)">q 刀（沿 y）</text>
  <line x1="512" y1="134" x2="470" y2="196" stroke="#2f7a3a" stroke-width="1.2" marker-end="url(#ad)" filter="url(#rough2)"/>

  <!-- z 方向切面 -->
  <g filter="url(#rough2)" stroke="#7b4fa8" stroke-width="1.6" stroke-dasharray="6 4">
    <polygon points="230,240 430,240 470,200 270,200" fill="none"/>
  </g>
  <text x="60" y="120" font-size="12" font-weight="bold" fill="#4b2a70" filter="url(#rough2)">r 刀（沿 z）</text>
  <line x1="104" y1="126" x2="252" y2="204" stroke="#7b4fa8" stroke-width="1.2" marker-end="url(#ad)" filter="url(#rough2)"/>

  <text x="120" y="322" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">x × y × z = 3 × 4 × 5 的怪物</text>

  <!-- 结论 -->
  <rect x="40" y="340" width="640" height="66" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="366" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">块数 = (p+1)(q+1)(r+1)，约束 p ≤ x-1、q ≤ y-1、r ≤ z-1、p+q+r ≤ k</text>
  <text x="56" y="392" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">多切一刀只会让段数加 1，所以能切就切；总和固定时，乘积在"三个因子尽量接近"时最大</text>
</svg>
