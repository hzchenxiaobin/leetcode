<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="464"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="330" fill="#fafafa"/>
  <text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两个官方样例的贪心走查：先保同首字母数 M，再让每一对尽量小</text>
  <path d="M 60 38 Q 380 46 700 38" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <text x="30" y="66" font-size="12" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">样例 1：M = 2</text>
  <g font-size="10">
    <rect x="30" y="76" width="76" height="30" rx="6" fill="#cfe0f5" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="68" y="96" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">Ann</text>
    <rect x="118" y="76" width="86" height="30" rx="6" fill="#d9ecd4" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="161" y="96" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">Abacaba</text>
    <text x="214" y="96" font-size="9.5" fill="#8a2b28" filter="url(#rough2)">同 A，1+1=2 ✓</text>

    <rect x="30" y="114" width="76" height="30" rx="6" fill="#cfe0f5" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="68" y="134" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">Anna</text>
    <rect x="118" y="114" width="86" height="30" rx="6" fill="#d9ecd4" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="161" y="134" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">Ivanova</text>
    <text x="214" y="134" font-size="9.5" fill="#555555" filter="url(#rough2)">跨字母，1+1=2 ✓</text>

    <rect x="30" y="152" width="76" height="30" rx="6" fill="#cfe0f5" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="68" y="172" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">John</text>
    <rect x="118" y="152" width="86" height="30" rx="6" fill="#fbe3c8" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="161" y="172" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">Petrov</text>
    <text x="214" y="172" font-size="9.5" fill="#555555" filter="url(#rough2)">跨字母，1+0+1=2 ✓</text>

    <rect x="30" y="190" width="76" height="30" rx="6" fill="#cfe0f5" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="68" y="210" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">Sabrina</text>
    <rect x="118" y="190" width="86" height="30" rx="6" fill="#d9ecd4" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="161" y="210" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">Stoltz</text>
    <text x="214" y="210" font-size="9.5" fill="#8a2b28" filter="url(#rough2)">同 S，剩下唯一</text>
  </g>
  <text x="30" y="240" font-size="10" fill="#555555" filter="url(#rough2)">输出：Ann Abacaba, Anna Ivanova, John Petrov, Sabrina Stoltz</text>

  <text x="430" y="66" font-size="12" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">样例 2：M = 3</text>
  <g font-size="10">
    <rect x="430" y="76" width="66" height="30" rx="6" fill="#cfe0f5" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="463" y="96" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">Aa</text>
    <rect x="506" y="76" width="70" height="30" rx="6" fill="#d9ecd4" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="541" y="96" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">Ad</text>
    <text x="584" y="96" font-size="9.5" fill="#8a2b28" filter="url(#rough2)">同 A，0+1+2=3 ✓</text>

    <rect x="430" y="114" width="66" height="30" rx="6" fill="#cfe0f5" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="463" y="134" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">Ab</text>
    <rect x="506" y="114" width="70" height="30" rx="6" fill="#d9ecd4" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="541" y="134" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">Ae</text>
    <text x="584" y="134" font-size="9.5" fill="#8a2b28" filter="url(#rough2)">同 A，1+1+1=3 ✓</text>

    <rect x="430" y="152" width="66" height="30" rx="6" fill="#cfe0f5" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="463" y="172" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">Ac</text>
    <rect x="506" y="152" width="70" height="30" rx="6" fill="#fbe3c8" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="541" y="172" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">Bb</text>
    <text x="584" y="172" font-size="9.5" fill="#555555" filter="url(#rough2)">跨字母，2+0+1=3 ✓</text>

    <rect x="430" y="190" width="66" height="30" rx="6" fill="#e8e0f5" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="463" y="210" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">Ba</text>
    <rect x="506" y="190" width="70" height="30" rx="6" fill="#e8e0f5" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="541" y="210" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">Bc</text>
    <text x="584" y="210" font-size="9.5" fill="#555555" filter="url(#rough2)">同 B，2+1+0=3 ✓</text>
  </g>
  <text x="430" y="240" font-size="10" fill="#555555" filter="url(#rough2)">输出：Aa Ad, Ab Ae, Ac Bb, Ba Bc</text>

  <rect x="30" y="262" width="700" height="52" rx="9" fill="#fbe3c8" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="46" y="284" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">两个样例都先把同首字母对数顶到最大值（2 与 3），再在"不影响这个最大值"的前提下把每一对压到最小。</text>
  <text x="46" y="304" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">这也是 checker 的校验点：格式、是否恰好用完 2n 个串、同首字母数是否等于 M、以及整行是否字典序最小。</text>
</svg>
