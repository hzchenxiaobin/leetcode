<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="780" height="400" fill="#fafafa"/>
  <text x="30" y="40" font-size="21" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">演算：s = TNNFTF，fmax = 4，m0 = 1</text>
  <rect x="60" y="70" width="680" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="115.0" y="96" font-size="15" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">M</text>
  <text x="235.0" y="96" font-size="15" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">B(M)</text>
  <text x="380.0" y="96" font-size="15" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">B(M) − M</text>
  <text x="474" y="96" font-size="15" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">说明</text>
  <rect x="60" y="110" width="680" height="52" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="115.0" y="143" font-size="16" fill="#333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">1</text>
  <text x="235.0" y="143" font-size="16" fill="#333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">3</text>
  <text x="380.0" y="143" font-size="16" fill="#b85450" text-anchor="middle" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="474" y="143" font-size="14" fill="#333" text-anchor="start" font-weight="normal" filter="url(#rough2)">最优填法 TFTFTF</text>
  <rect x="60" y="162" width="680" height="52" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="115.0" y="195" font-size="16" fill="#333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">2</text>
  <text x="235.0" y="195" font-size="16" fill="#333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">3</text>
  <text x="380.0" y="195" font-size="16" fill="#333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">1</text>
  <text x="474" y="195" font-size="14" fill="#333" text-anchor="start" font-weight="normal" filter="url(#rough2)">B 不再增长</text>
  <rect x="60" y="214" width="680" height="52" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="115.0" y="247" font-size="16" fill="#333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">3</text>
  <text x="235.0" y="247" font-size="16" fill="#333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">4</text>
  <text x="380.0" y="247" font-size="16" fill="#333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">1</text>
  <text x="474" y="247" font-size="14" fill="#333" text-anchor="start" font-weight="normal" filter="url(#rough2)">多 1 个 F，M 涨 2</text>
  <rect x="60" y="266" width="680" height="52" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="115.0" y="299" font-size="16" fill="#333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">4</text>
  <text x="235.0" y="299" font-size="16" fill="#333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">4</text>
  <text x="380.0" y="299" font-size="16" fill="#333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">0</text>
  <text x="474" y="299" font-size="14" fill="#333" text-anchor="start" font-weight="normal" filter="url(#rough2)">M 白涨，不值</text>
  <text x="30" y="352" font-size="13" fill="#555" text-anchor="start" font-weight="normal" filter="url(#rough2)">M = 0 不可行：串里已有 F，任何 F 都让子段和 ≥ 1，此时 B(0) = −1</text>
  <text x="30" y="378" font-size="13" fill="#555" text-anchor="start" font-weight="normal" filter="url(#rough2)">实际实现：ans = 2 之后发现 fmax − M = 2 ≤ ans，M ≥ 2 直接停，只算了 M = 1</text>
</svg>
