<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="35"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例走查：候选集合的筛选表</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="50.0" y="92.0" text-anchor="start" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">候选集合</text>
  <text x="250.0" y="92.0" text-anchor="start" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">条件 A</text>
  <text x="390.0" y="92.0" text-anchor="start" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">条件 B</text>
  <text x="520.0" y="92.0" text-anchor="start" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">条件 C</text>
  <text x="640.0" y="92.0" text-anchor="start" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">|S|</text>
  <rect x="42.0" y="108.0" width="630.0" height="40.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="50.0" y="134.0" text-anchor="start" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">{1,2,3}</text>
  <text x="250.0" y="134.0" text-anchor="start" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="390.0" y="134.0" text-anchor="start" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="520.0" y="134.0" text-anchor="start" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="650.0" y="134.0" text-anchor="start" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="42.0" y="158.0" width="630.0" height="40.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="50.0" y="184.0" text-anchor="start" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">{4,5}</text>
  <text x="250.0" y="184.0" text-anchor="start" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="390.0" y="184.0" text-anchor="start" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="520.0" y="184.0" text-anchor="start" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="650.0" y="184.0" text-anchor="start" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="42.0" y="208.0" width="630.0" height="40.0" fill="#ffffff" stroke="#dddddd" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="50.0" y="234.0" text-anchor="start" font-size="12.5" fill="#555" filter="url(#rough2)">{6,7,8,9}</text>
  <text x="250.0" y="234.0" text-anchor="start" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="390.0" y="234.0" text-anchor="start" font-size="11.5" fill="#b85450" filter="url(#rough2)">✗ 含 7–9</text>
  <text x="520.0" y="234.0" text-anchor="start" font-size="11.5" fill="#888" filter="url(#rough2)">—</text>
  <text x="650.0" y="234.0" text-anchor="start" font-size="12" fill="#888" font-weight="bold" filter="url(#rough2)">否决</text>
  <rect x="42.0" y="258.0" width="630.0" height="40.0" fill="#ffffff" stroke="#dddddd" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="50.0" y="284.0" text-anchor="start" font-size="12.5" fill="#555" filter="url(#rough2)">{1,2,3,4,5}</text>
  <text x="250.0" y="284.0" text-anchor="start" font-size="11.5" fill="#b85450" filter="url(#rough2)">✗ 1–4 无朋友边</text>
  <text x="390.0" y="284.0" text-anchor="start" font-size="11.5" fill="#b85450" filter="url(#rough2)">—</text>
  <text x="520.0" y="284.0" text-anchor="start" font-size="11.5" fill="#888" filter="url(#rough2)">—</text>
  <text x="650.0" y="284.0" text-anchor="start" font-size="12" fill="#888" font-weight="bold" filter="url(#rough2)">否决</text>
  <rect x="42.0" y="308.0" width="630.0" height="40.0" fill="#ffffff" stroke="#dddddd" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="50.0" y="334.0" text-anchor="start" font-size="12.5" fill="#555" filter="url(#rough2)">{1,2,3,6,7,8,9}</text>
  <text x="250.0" y="334.0" text-anchor="start" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="390.0" y="334.0" text-anchor="start" font-size="11.5" fill="#b85450" filter="url(#rough2)">✗ 含 7–9</text>
  <text x="520.0" y="334.0" text-anchor="start" font-size="11.5" fill="#888" filter="url(#rough2)">—</text>
  <text x="650.0" y="334.0" text-anchor="start" font-size="12" fill="#888" font-weight="bold" filter="url(#rough2)">否决</text>
  <text x="42.0" y="372.0" text-anchor="start" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 = max(3, 2) = 3</text>
</svg>
