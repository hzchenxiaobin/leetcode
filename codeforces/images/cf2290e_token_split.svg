<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 430" width="660" height="430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect x="-4" y="-4" width="668" height="438" fill="#fafafa" filter="url(#rough2)"/>
  <text x="330" y="32" text-anchor="middle" font-size="17" fill="#333">核心建模：每颗石子 = 一个独立的游戏</text>

  <text x="34" y="66" font-size="14" fill="#446688">① 题面的一次操作（k = 2，选第 5 堆）</text>

  <rect x="199" y="96" width="46" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="222" y="122" text-anchor="middle" font-size="15" fill="#333">2</text>
  <rect x="253" y="96" width="46" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="276" y="122" text-anchor="middle" font-size="15" fill="#333">1</text>
  <rect x="307" y="96" width="46" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="122" text-anchor="middle" font-size="14" fill="#4a7a3a">3+1</text>
  <rect x="361" y="96" width="46" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="384" y="122" text-anchor="middle" font-size="14" fill="#4a7a3a">4+1</text>
  <rect x="415" y="96" width="46" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="438" y="122" text-anchor="middle" font-size="14" fill="#b85450">2−1</text>

  <text x="222" y="156" text-anchor="middle" font-size="13" fill="#666">堆 1</text>
  <text x="276" y="156" text-anchor="middle" font-size="13" fill="#666">堆 2</text>
  <text x="330" y="156" text-anchor="middle" font-size="13" fill="#666">堆 3</text>
  <text x="384" y="156" text-anchor="middle" font-size="13" fill="#666">堆 4</text>
  <text x="438" y="156" text-anchor="middle" font-size="13" fill="#666">堆 5</text>

  <text x="330" y="184" text-anchor="middle" font-size="13" fill="#333">取走 1 颗后，左边 min(k, i−1) 堆各 +1；i = 1 时无新增</text>

  <path d="M 40 202 L 620 202" stroke="#bbb" stroke-width="1" stroke-dasharray="6 6" filter="url(#rough2)"/>

  <text x="34" y="230" font-size="14" fill="#446688">② 等价说法：这颗石子被「替换」成左边 k 颗新石子</text>

  <ellipse cx="128" cy="286" rx="52" ry="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="128" y="291" text-anchor="middle" font-size="14" fill="#b85450">石子 @ i</text>

  <ellipse cx="392" cy="262" rx="50" ry="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="392" y="267" text-anchor="middle" font-size="13" fill="#4a7a3a">新石子 @ i−k</text>
  <ellipse cx="392" cy="306" rx="46" ry="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="392" y="311" text-anchor="middle" font-size="13" fill="#4a7a3a">……</text>
  <ellipse cx="392" cy="350" rx="50" ry="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="392" y="355" text-anchor="middle" font-size="13" fill="#4a7a3a">新石子 @ i−1</text>

  <path d="M 180 278 C 250 268 300 264 340 262" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 180 286 C 250 290 300 302 344 306" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 180 294 C 250 318 300 342 340 350" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="222" y="250" font-size="12" fill="#666">−1 颗</text>
  <text x="238" y="334" font-size="12" fill="#666">+1 颗</text>

  <text x="560" y="300" text-anchor="middle" font-size="12" fill="#666">每颗石子</text>
  <text x="560" y="320" text-anchor="middle" font-size="12" fill="#666">各自独立</text>

  <text x="330" y="396" text-anchor="middle" font-size="13" fill="#333">整局 = 这些独立游戏的「和」 ⇒ 总 SG 值 = 所有石子 g(位置) 的异或和</text>
  <text x="330" y="418" text-anchor="middle" font-size="13" fill="#b85450">先手必胜 ⟺ 异或和 ≠ 0</text>
</svg>
