<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="240" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">等角多边形 ⟺ 相邻边方向差恒为 2π/n</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">闭合条件：sum l_k·ζ^k = 0，ζ = e^{2πi/n}</text>
  <text x="150" y="100" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">固定前 n-2 条边（在 450~550 随机取、彼此远离），解最后两条边使上式成立</text>
  <text x="150" y="140" text-anchor="start" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">2 个实方程解 2 个未知数；随机重试直到所有边长互不相同且落在 [1,1000]</text>
  <text x="150" y="178" text-anchor="start" font-size="12" fill="#3d6b2f" filter="url(#rough2)">n=3、4 无解：等角必等边（三角形）/ 必为矩形（对角边相等）</text>
</svg>
