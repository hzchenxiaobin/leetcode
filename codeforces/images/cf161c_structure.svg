<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="693"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="300" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">S_k = S_{k−1} + c_k + S_{k−1}</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">中心位置 2^{k−1} 的字符在本层唯一</text>
  <g filter="url(#rough2)"><rect x="60" y="100" width="240" height="60" rx="4" fill="#cfe0f5" fill-opacity="0.45" stroke="#446688" stroke-width="1.4"/></g>
  <text x="180" y="136" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">S_{k−1}</text>
  <g filter="url(#rough2)"><rect x="320" y="100" width="80" height="60" rx="4" fill="#f3d9d6" fill-opacity="0.5" stroke="#8a2b28" stroke-width="1.4"/></g>
  <text x="360" y="136" text-anchor="middle" font-size="13" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">c_k</text>
  <g filter="url(#rough2)"><rect x="420" y="100" width="240" height="60" rx="4" fill="#cfe0f5" fill-opacity="0.45" stroke="#446688" stroke-width="1.4"/></g>
  <text x="540" y="136" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">S_{k−1}</text>
  <text x="360" y="182" text-anchor="middle" font-size="10.5" fill="#8a2b28" filter="url(#rough2)">↑ 位置 2^{k−1}</text>
  <text x="450" y="220" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">字符 = c_{v2(i)+1}；位移 d 的匹配长度 ≤ 2^{v2(d)} − 1</text>
  <text x="450" y="254" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">⇒ 匹配段跨过中心 ⇒ 只能 d = 0（对齐）</text>
</svg>
