<svg xmlns="http://www.w3.org/2000/svg" width="880" height="270" viewBox="0 0 880 270"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="270" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按空段分解 + 交错计数</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">答案 = 交错数 x 各内部段 2^{L-1}</text>
  <text x="150" y="105" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">初始已亮的灯把序列切成若干空段：左端段、右端段、内部段</text>
  <text x="150" y="150" text-anchor="start" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">内部段长 L 的填法有 2^{L-1} 种；两端段只有 1 种（只能从一侧推进）</text>
  <text x="150" y="192" text-anchor="start" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">再乘上段与段之间的交错： (n-m)! / prod L_i!</text>
</svg>
