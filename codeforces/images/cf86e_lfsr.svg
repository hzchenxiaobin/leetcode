<svg xmlns="http://www.w3.org/2000/svg" width="770" height="400" viewBox="0 0 770 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="149"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="770" height="400" fill="#fafafa"/>

  <text x="385" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">把递推看成状态机：每一步左移一位，新的最高位由 c_i 决定</text>
  <path d="M 154 39 Q 385 45 616 39" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="70" y="110" width="56" height="50" rx="8" fill="#dcebfb" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="98.0" y="142" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">a(n-1)</text>
  <rect x="144" y="110" width="56" height="50" rx="8" fill="#dcebfb" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="172.0" y="142" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">a(n-2)</text>
  <rect x="218" y="110" width="56" height="50" rx="8" fill="#dcebfb" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="246.0" y="142" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">a(n-3)</text>
  <rect x="292" y="110" width="56" height="50" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320.0" y="142" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">…</text>
  <rect x="366" y="110" width="56" height="50" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="394.0" y="142" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">a(n-k+1)</text>
  <rect x="440" y="110" width="56" height="50" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="468.0" y="142" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">a(n-k)</text>
  <text x="520" y="142" text-anchor="start" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">→ a(n)</text>
  <line x1="320.0" y1="102" x2="320.0" y2="78" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="232.8" y="52" width="150" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="307.8" y="74" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">按 c_i 线性组合 (mod 2)</text>
  <rect x="40" y="190" width="690" height="62" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="56" y="214" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">状态 = 连续 k 个 a 组成的 k 元组；状态只有 2^k 个，非零状态在转移下成环，</text>
  <text x="56" y="236" text-anchor="start" font-size="12" fill="#2f4a66" filter="url(#rough2)">所以序列一定周期，且周期 ≤ 2^k − 1（排除全零）。</text>
  <rect x="40" y="264" width="690" height="96" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="288" text-anchor="start" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">特征多项式 f(x) = x^k + c₁x^(k−1) + … + c_(k−1)x + c_k（GF(2) 上）</text>
  <text x="56" y="312" text-anchor="start" font-size="12" fill="#7a5a1b" filter="url(#rough2)">状态转移矩阵就是“乘 x 再模 f”，所以状态环的长度 = x 在 Z₂[x]/f 中的乘法阶</text>
  <text x="56" y="336" text-anchor="start" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">周期恰为 2^k − 1 ⟺ f 是**本原多项式**（primitive）</text>
  <text x="40" y="386" text-anchor="start" font-size="12" fill="#5b5b5b" filter="url(#rough2)">k ≤ 50 时 2^k − 1 最大约 1.1×10¹⁵，不能枚举状态，只能靠多项式运算判定。</text>
</svg>
