<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="567"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="300" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">从最外层向内交替上色（最外层为蓝）</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">红区面积 = Σ π(r_i² − r_{i−1}²)（仅红层）</text>
  <g filter="url(#rough2)"><rect x="60" y="96" width="380" height="150" rx="6" fill="#ffffff" fill-opacity="0.3" stroke="#cccccc" stroke-width="1.4" stroke-dasharray="5 4"/></g>
  <g filter="url(#rough2)"><path d="M 140 170 A 110 110 0 1 0 360 170 A 110 110 0 1 0 140 170 Z" fill="#cfe0f5" stroke="#446688" stroke-width="1.2"/></g>
  <g filter="url(#rough2)"><path d="M 172 170 A 78 78 0 1 0 328 170 A 78 78 0 1 0 172 170 Z" fill="#ffffff" stroke="#446688" stroke-width="1.2"/></g>
  <g filter="url(#rough2)"><path d="M 204 170 A 46 46 0 1 0 296 170 A 46 46 0 1 0 204 170 Z" fill="#cfe0f5" stroke="#446688" stroke-width="1.2"/></g>
  <g filter="url(#rough2)"><path d="M 232 170 A 18 18 0 1 0 268 170 A 18 18 0 1 0 232 170 Z" fill="#ffffff" stroke="#446688" stroke-width="1.2"/></g>
  <text x="250" y="262" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">半径由外向内：蓝、红、蓝、红</text>
  <text x="600" y="120" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">排序半径 r₁&lt;…&lt;rₙ</text>
  <text x="600" y="150" text-anchor="start" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">最外层圆环 (rₙ₋₁,rₙ] 红</text>
  <text x="600" y="180" text-anchor="start" font-size="11.5" fill="#666666" filter="url(#rough2)">向内每层颜色取反</text>
  <text x="600" y="214" text-anchor="start" font-size="11" fill="#446688" filter="url(#rough2)">答案用整数平方差累加再乘 π</text>
</svg>
