<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="79"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="450" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">180E：保留同色的连续一段，代价 = 跨度 − 个数</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <line x1="60.0" y1="150.0" x2="654.0" y2="150.0" stroke="#aaa" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="60.0" y="174.0" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">1</text>
  <text x="126.0" y="174.0" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">2</text>
  <text x="192.0" y="174.0" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">3</text>
  <text x="258.0" y="174.0" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">4</text>
  <text x="324.0" y="174.0" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">5</text>
  <text x="390.0" y="174.0" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">6</text>
  <text x="456.0" y="174.0" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">7</text>
  <text x="522.0" y="174.0" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">8</text>
  <text x="588.0" y="174.0" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">9</text>
  <text x="654.0" y="174.0" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">10</text>
  <circle cx="60.0" cy="150.0" r="13.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="60.0" y="155.0" text-anchor="middle" font-size="11" fill="#8a6015" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="60.0" y="126.0" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">q=1</text>
  <circle cx="192.0" cy="150.0" r="13.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="192.0" y="155.0" text-anchor="middle" font-size="11" fill="#8a6015" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="192.0" y="126.0" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">q=2</text>
  <circle cx="258.0" cy="150.0" r="13.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="258.0" y="155.0" text-anchor="middle" font-size="11" fill="#8a6015" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="258.0" y="126.0" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">q=2</text>
  <circle cx="456.0" cy="150.0" r="13.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="456.0" y="155.0" text-anchor="middle" font-size="11" fill="#8a6015" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="456.0" y="126.0" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">q=4</text>
  <circle cx="522.0" cy="150.0" r="13.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="522.0" y="155.0" text-anchor="middle" font-size="11" fill="#8a6015" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="522.0" y="126.0" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">q=4</text>
  <line x1="192.0" y1="194.0" x2="522.0" y2="194.0" stroke="#4a7a3a" stroke-width="2.0" filter="url(#rough2)"/>
  <text x="291.0" y="220.0" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">保留 3,4,7,8 四颗：跨度 6，删掉 2 颗（≤ k=2）</text>
  <rect x="40.0" y="250.0" width="640.0" height="100.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="54.0" y="273.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">同色位置 p₀ &lt; p₁ &lt; …，保留 p_i..p_j 需要删掉 (p_j − p_i + 1) − (j − i + 1) 颗</text>
  <text x="54.0" y="299.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">令 q_j = p_j − j，条件化简为 q_j − q_i ≤ k</text>
  <text x="54.0" y="325.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">q 单调不减 → 对每个 i 二分最大的 j</text>
</svg>
