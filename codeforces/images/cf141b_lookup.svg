<svg xmlns="http://www.w3.org/2000/svg" width="720" height="352" viewBox="0 0 720 352"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1412"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="720" height="352" fill="#fafafa"/>
  <text x="360.0" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">三种行的判定与编号</text>
  <path d="M 115.2 42 Q 360.0 48 604.8 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="40" y="88" width="150" height="50" rx="5" fill="#f0f0f0" stroke="#555555" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115.0" y="117.3" text-anchor="middle" font-size="12.0" fill="#555555" filter="url(#rough2)">输入 a、x、y</text>
  <path d="M 192.0 113.0 L 219.0 113.0" stroke="#8c2f2c" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 228.0 113.0 L 219.0 117.0 L 219.0 109.0 Z" fill="#8c2f2c" filter="url(#rough2)"/>
  <rect x="230" y="85" width="224" height="58" rx="5" fill="#f5e8e8" stroke="#8c2f2c" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="342.0" y="118.1" text-anchor="middle" font-size="11.5" fill="#8c2f2c" filter="url(#rough2)">y ≤ 0 或 y mod a = 0 ?</text>
  <path d="M 456.0 113.0 L 503.0 113.0" stroke="#8c2f2c" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 512.0 113.0 L 503.0 117.0 L 503.0 109.0 Z" fill="#8c2f2c" filter="url(#rough2)"/>
  <rect x="514" y="92" width="150" height="44" rx="5" fill="#f0f0f0" stroke="#555555" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="589.0" y="118.3" text-anchor="middle" font-size="12.0" fill="#555555" filter="url(#rough2)">输出 -1</text>
  <path d="M 340.0 145.0 L 340.0 163.0" stroke="#335478" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 340.0 172.0 L 336.0 163.0 L 344.0 163.0 Z" fill="#335478" filter="url(#rough2)"/>
  <rect x="250" y="174" width="190" height="46" rx="5" fill="#e8eef7" stroke="#335478" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="345.0" y="201.3" text-anchor="middle" font-size="12.0" fill="#335478" filter="url(#rough2)">r = y / a</text>
  <path d="M 340.0 222.0 L 138.8 260.3" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 130.0 262.0 L 138.1 256.4 L 139.6 264.2 Z" fill="#4a7a3a" filter="url(#rough2)"/>
  <path d="M 340.0 222.0 L 351.8 253.6" stroke="#8c5a2c" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 355.0 262.0 L 348.1 255.0 L 355.6 252.2 Z" fill="#8c5a2c" filter="url(#rough2)"/>
  <path d="M 340.0 222.0 L 579.1 260.6" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 588.0 262.0 L 578.5 264.5 L 579.8 256.6 Z" fill="#4a7a3a" filter="url(#rough2)"/>
  <rect x="24" y="264" width="214" height="74" rx="5" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="131.0" y="277.7" text-anchor="middle" font-size="11.0" fill="#4a7a3a" filter="url(#rough2)">r ≤ 1</text>
  <text x="131.0" y="291.3" text-anchor="middle" font-size="11.0" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="131.0" y="305.0" text-anchor="middle" font-size="11.0" fill="#4a7a3a" filter="url(#rough2)">x</text>
  <text x="131.0" y="318.6" text-anchor="middle" font-size="11.0" fill="#4a7a3a" filter="url(#rough2)"> &lt; a ? r+1</text>
  <text x="131.0" y="332.2" text-anchor="middle" font-size="11.0" fill="#4a7a3a" filter="url(#rough2)">否则 -1</text>
  <rect x="250" y="264" width="214" height="74" rx="5" fill="#f7efe8" stroke="#8c5a2c" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="357.0" y="278.7" text-anchor="middle" font-size="10.5" fill="#8c5a2c" filter="url(#rough2)">r 偶：x ≠ 0 且 </text>
  <text x="357.0" y="291.8" text-anchor="middle" font-size="10.5" fill="#8c5a2c" filter="url(#rough2)">x</text>
  <text x="357.0" y="304.8" text-anchor="middle" font-size="10.5" fill="#8c5a2c" filter="url(#rough2)"> &lt; a</text>
  <text x="357.0" y="317.8" text-anchor="middle" font-size="10.5" fill="#8c5a2c" filter="url(#rough2)">左底座+1 / 右底座+2</text>
  <text x="357.0" y="330.8" text-anchor="middle" font-size="10.5" fill="#8c5a2c" filter="url(#rough2)">否则 -1</text>
  <rect x="476" y="264" width="214" height="74" rx="5" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="583.0" y="278.7" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">r 奇：2</text>
  <text x="583.0" y="291.8" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">x</text>
  <text x="583.0" y="304.8" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)"> &lt; a ?</text>
  <text x="583.0" y="317.8" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">4+3(r−3)/2 + 1</text>
  <text x="583.0" y="330.8" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">否则 -1</text>
  <text x="360.0" y="338" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">底座 = 该行之前所有格子的总数，可由行号直接算出</text>
</svg>
