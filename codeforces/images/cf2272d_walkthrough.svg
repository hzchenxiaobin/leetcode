<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="430" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：答案 = S，除非「全是单点树」</text>
  <path d="M 150 42 Q 380 49 610 42" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- 表头 -->
  <rect x="26" y="58" width="708" height="34" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="40" y="80" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">输入（k 棵树的形状）</text>
  <text x="296" y="80" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">每块 M</text>
  <text x="382" y="80" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">S</text>
  <text x="424" y="80" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">最优 MIS</text>
  <text x="538" y="80" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">输出（k − 1 条边，任选一种）</text>

  <path d="M 292 62 L 292 370" stroke="#c9d4e0" stroke-width="1.1" stroke-dasharray="5 6" fill="none" filter="url(#rough2)"/>
  <path d="M 378 62 L 378 370" stroke="#c9d4e0" stroke-width="1.1" stroke-dasharray="5 6" fill="none" filter="url(#rough2)"/>
  <path d="M 418 62 L 418 370" stroke="#c9d4e0" stroke-width="1.1" stroke-dasharray="5 6" fill="none" filter="url(#rough2)"/>
  <path d="M 532 62 L 532 370" stroke="#c9d4e0" stroke-width="1.1" stroke-dasharray="5 6" fill="none" filter="url(#rough2)"/>

  <!-- 行 1 -->
  <rect x="26" y="98" width="708" height="56" rx="7" fill="#ffffff" stroke="#d9e2ec" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="40" y="122" font-size="11.5" fill="#333" filter="url(#rough2)">样例1：两棵单点树</text>
  <text x="40" y="142" font-size="10.5" fill="#66788c" filter="url(#rough2)">k = 2，两块都是 {1}（没有边的树）</text>
  <text x="296" y="131" font-size="11.5" fill="#333" filter="url(#rough2)">1, 1</text>
  <text x="384" y="131" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="424" y="131" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">1 = S − 1</text>
  <text x="538" y="131" font-size="11" fill="#333" filter="url(#rough2)">(1,1)–(2,1)：唯一一条边</text>

  <!-- 行 2 -->
  <rect x="26" y="160" width="708" height="56" rx="7" fill="#f6fbf7" stroke="#d9e2ec" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="40" y="184" font-size="11.5" fill="#333" filter="url(#rough2)">样例2：星形 1–2、1–3 加一个单点</text>
  <text x="40" y="204" font-size="10.5" fill="#66788c" filter="url(#rough2)">X = {2,3}，r = 1 不在 X 中</text>
  <text x="296" y="193" font-size="11.5" fill="#333" filter="url(#rough2)">2, 1</text>
  <text x="384" y="193" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="424" y="193" font-size="11.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">3 = S</text>
  <text x="538" y="193" font-size="11" fill="#333" filter="url(#rough2)">(1,1)–(2,1)，即挂到 r = 1</text>

  <!-- 行 3 -->
  <rect x="26" y="222" width="708" height="56" rx="7" fill="#ffffff" stroke="#d9e2ec" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="40" y="246" font-size="11.5" fill="#333" filter="url(#rough2)">两条两点边树（自造）</text>
  <text x="40" y="266" font-size="10.5" fill="#66788c" filter="url(#rough2)">每块 M = 1，且都能绕开某个点</text>
  <text x="296" y="255" font-size="11.5" fill="#333" filter="url(#rough2)">1, 1</text>
  <text x="384" y="255" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="424" y="255" font-size="11.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">2 = S</text>
  <text x="538" y="255" font-size="11" fill="#333" filter="url(#rough2)">挂到任一顶点都可以</text>

  <!-- 行 4 -->
  <rect x="26" y="284" width="708" height="56" rx="7" fill="#fffdf5" stroke="#d9e2ec" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="40" y="308" font-size="11.5" fill="#333" filter="url(#rough2)">三棵单点树（自造）</text>
  <text x="40" y="328" font-size="10.5" fill="#66788c" filter="url(#rough2)">没有游离点，只能做成 3 点星</text>
  <text x="296" y="317" font-size="11.5" fill="#333" filter="url(#rough2)">1, 1, 1</text>
  <text x="384" y="317" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="424" y="317" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">2 = S − 1</text>
  <text x="538" y="317" font-size="11" fill="#333" filter="url(#rough2)">(1,1)–(2,1)、(1,1)–(3,1)</text>

  <path d="M 30 344 Q 380 350 730 344" stroke="#c9d4e0" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- 底部陷阱说明 -->
  <rect x="26" y="356" width="708" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="378" text-anchor="middle" font-size="12" font-weight="bold" fill="#a14340" filter="url(#rough2)">对照实验：样例2 如果把单点挂到 2 或 3 上，最大独立集只有 2</text>
  <text x="380" y="400" text-anchor="middle" font-size="11" fill="#a14340" filter="url(#rough2)">所以 r 必须取在「某个最大独立集之外」——这正是先还原 X、再取 X 外顶点的原因。</text>
</svg>
