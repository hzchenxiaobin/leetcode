<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c9801f"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a8524a"/>
    </marker>
  </defs>
  <rect width="760" height="360" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">进制 p 的合法下界与枚举上界</text>
  <rect x="60.0" y="108.0" width="110.0" height="58.0" rx="8" fill="#f0e6e4" stroke="#c0a9a5" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="115.0" y="134.0" text-anchor="middle" font-size="12" fill="#c0a9a5" font-weight="bold" filter="url(#rough2)">p ≤ 最大数字</text>
  <text x="115.0" y="154.0" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">非法：有位数字 ≥ p</text>
  <rect x="230.0" y="108.0" width="210.0" height="58.0" rx="8" fill="#fdf3e3" stroke="#c9801f" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="335.0" y="134.0" text-anchor="middle" font-size="12" fill="#c9801f" font-weight="bold" filter="url(#rough2)">最大数字+1 … 18</text>
  <text x="335.0" y="154.0" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">可能进位 → 位数是 m 或 m+1</text>
  <rect x="440.0" y="108.0" width="260.0" height="58.0" rx="8" fill="#f4f9f2" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="570.0" y="134.0" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">19 … 1000</text>
  <text x="570.0" y="154.0" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">必定不进位 → 位数恰为 m</text>
  <text x="170.0" y="188.0" text-anchor="middle" font-size="11.5" fill="#c9801f" filter="url(#rough2)">↑ p = 最大数字+1</text>
  <text x="440.0" y="188.0" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">↑ p = 19</text>
  <text x="700.0" y="188.0" text-anchor="end" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">↑ 枚举右端 1000</text>
  <text x="50.0" y="216.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">① 合法性：a、b 的每一位都必须严格小于 p，所以 p ≥ 最大数字 + 1。</text>
  <text x="50.0" y="243.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">② 位数上界：记 m = max(|a|, |b|) ≤ 4，则 a+b &lt; 2·p^m，位数只可能是 m 或 m+1。</text>
  <text x="50.0" y="270.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">③ 进位：p ≥ 19 时 a+b &lt; p^m 恒成立，最高位永不进位，位数最多为 m；</text>
  <text x="50.0" y="297.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">   而 p = 10 一定合法且位数恰为 m，所以最大值只需在 p ≤ 18 里找。</text>
  <rect x="34.0" y="320.0" width="692.0" height="30.0" rx="8" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.3" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="48.0" y="341.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">实现上枚举 p ∈ [最大数字+1, 1000]：范围远超 18，绝无漏解。</text>
</svg>
