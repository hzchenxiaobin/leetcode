<svg xmlns="http://www.w3.org/2000/svg" width="780" height="380" viewBox="0 0 780 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="780" height="380" fill="#fafafa"/>
  <text x="390.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">190D：双指针 —— 维护“恰好达到 k 次的值的个数”</text>
  <path d="M 163.4100000000001 46 Q 390.0 52 616.5899999999999 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60.0" y="70.0" width="74.0" height="44.0" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="97.0" y="97.0" text-anchor="middle" font-size="11.4" fill="#26405c" filter="url(#rough2)">1</text>
  <rect x="142.0" y="70.0" width="74.0" height="44.0" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="179.0" y="97.0" text-anchor="middle" font-size="11.4" fill="#26405c" filter="url(#rough2)">2</text>
  <rect x="224.0" y="70.0" width="74.0" height="44.0" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="261.0" y="97.0" text-anchor="middle" font-size="11.4" fill="#26405c" filter="url(#rough2)">1</text>
  <rect x="306.0" y="70.0" width="74.0" height="44.0" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="343.0" y="97.0" text-anchor="middle" font-size="11.4" fill="#26405c" filter="url(#rough2)">2</text>
  <rect x="388.0" y="70.0" width="74.0" height="44.0" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="425.0" y="97.0" text-anchor="middle" font-size="11.4" fill="#26405c" filter="url(#rough2)">1</text>
  <rect x="470.0" y="70.0" width="74.0" height="44.0" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="507.0" y="97.0" text-anchor="middle" font-size="11.4" fill="#26405c" filter="url(#rough2)">3</text>
  <rect x="552.0" y="70.0" width="74.0" height="44.0" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="589.0" y="97.0" text-anchor="middle" font-size="11.4" fill="#26405c" filter="url(#rough2)">1</text>
  <rect x="634.0" y="70.0" width="74.0" height="44.0" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="671.0" y="97.0" text-anchor="middle" font-size="11.4" fill="#26405c" filter="url(#rough2)">2</text>
  <rect x="60.0" y="62.0" width="320.0" height="60.0" rx="8" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="224.0" y="140.0" text-anchor="middle" font-size="10.8" font-weight="bold" fill="#b85450" filter="url(#rough2)">窗口 [l..r]</text>
  <rect x="60.0" y="170.0" width="330.0" height="150.0" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="76.0" y="196.0" text-anchor="start" font-size="11.6" font-weight="bold" fill="#446688" filter="url(#rough2)">计数</text>
  <text x="76.0" y="222.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">cnt[v]：窗口内 v 的出现次数</text>
  <text x="76.0" y="246.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">numGood：cnt[v] == k 的值的个数</text>
  <text x="76.0" y="272.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">窗口“好” ⇔ numGood &gt; 0</text>
  <text x="76.0" y="296.0" text-anchor="start" font-size="10.8" fill="#6b6b6b" filter="url(#rough2)">右端每扩一格，ans += l</text>
  <rect x="410.0" y="170.0" width="320.0" height="150.0" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="426.0" y="196.0" text-anchor="start" font-size="11.6" font-weight="bold" fill="#2f5b34" filter="url(#rough2)">为什么线性</text>
  <text x="426.0" y="222.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">l 只向右移动，总移动 ≤ n</text>
  <text x="426.0" y="246.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">每个 r 摊还 O(1)</text>
  <text x="426.0" y="272.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">答案最大 C(n,2) ≈ 8·10¹⁰</text>
  <text x="426.0" y="296.0" text-anchor="start" font-size="10.8" font-weight="bold" fill="#8a3a36" filter="url(#rough2)">⇒ 必须 long long</text>
</svg>
