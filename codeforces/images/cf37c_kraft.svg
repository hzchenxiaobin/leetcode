<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="380" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="38" text-anchor="middle" font-size="18.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">37C：可行性判据（Kraft 不等式）</text>
  <path d="M 137 50 Q 380 56 623 50" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="88" text-anchor="start" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">无前缀的 01 码存在 ⟺ Σ 2^{-l_i} &lt;= 1（Kraft–McMillan）。</text>
  <rect x="60" y="118" width="640" height="44" rx="8" fill="#fbfbfb" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="76" y="146" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">1,2,3</text>
  <text x="300" y="146" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">1/2 + 1/4 + 1/8 = 7/8 &lt;= 1</text>
  <text x="660" y="146" text-anchor="end" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">YES</text>
  <rect x="60" y="174" width="640" height="44" rx="8" fill="#fbfbfb" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="76" y="202" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">1,1</text>
  <text x="300" y="202" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">1/2 + 1/2 = 1 &lt;= 1</text>
  <text x="660" y="202" text-anchor="end" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">YES</text>
  <rect x="60" y="230" width="640" height="44" rx="8" fill="#fbfbfb" stroke="#b6483f" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="76" y="258" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">1,1,1</text>
  <text x="300" y="258" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">1/2+1/2+1/2 = 3/2 &gt; 1</text>
  <text x="660" y="258" text-anchor="end" font-size="12.5" fill="#b6483f" font-weight="bold" filter="url(#rough2)">NO</text>
  <rect x="60" y="286" width="640" height="44" rx="8" fill="#fbfbfb" stroke="#b6483f" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="76" y="314" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">2,2,2,2,2</text>
  <text x="300" y="314" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">5/4 &gt; 1</text>
  <text x="660" y="314" text-anchor="end" font-size="12.5" fill="#b6483f" font-weight="bold" filter="url(#rough2)">NO</text>
  <text x="60" y="366" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">构造算法（第 3 节）与这个判据一致：它总是给出“数值最小的可用词”，等价于把区间从 [0,1) 里依次切走。</text>
</svg>
