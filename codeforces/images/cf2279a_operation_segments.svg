<svg xmlns="http://www.w3.org/2000/svg" width="760" height="480" viewBox="0 0 760 480"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#8a6015"/>
    </marker>
  </defs>

  <rect width="760" height="480" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">一次操作 [l, r]：段内 gap 翻倍，两端 gap 被重算，其余不动</text>
  <path d="M 96 42 Q 380 50 664 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="380" y="62" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">例：a = [5, 9, 2, 6, 3, 8]，l = 3，r = 5；记 d[j] = |a[j] − a[j+1]|</text>

  <!-- ===== 操作前 ===== -->
  <text x="156" y="126" text-anchor="end" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">操作前</text>

  <rect x="306" y="92" width="296" height="62" rx="8" fill="#fff8e1" fill-opacity="0.55"
        stroke="#d6a040" stroke-width="1.4" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="343" y="86" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">l = 3</text>
  <text x="491" y="86" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">r = 5</text>

  <rect x="166" y="100" width="58" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="195" y="128" text-anchor="middle" font-size="17" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">5</text>
  <rect x="240" y="100" width="58" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="269" y="128" text-anchor="middle" font-size="17" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">9</text>
  <rect x="314" y="100" width="58" height="44" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="343" y="128" text-anchor="middle" font-size="17" font-weight="bold" fill="#8a6015" filter="url(#rough2)">2</text>
  <rect x="388" y="100" width="58" height="44" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="417" y="128" text-anchor="middle" font-size="17" font-weight="bold" fill="#8a6015" filter="url(#rough2)">6</text>
  <rect x="462" y="100" width="58" height="44" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="491" y="128" text-anchor="middle" font-size="17" font-weight="bold" fill="#8a6015" filter="url(#rough2)">3</text>
  <rect x="536" y="100" width="58" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="565" y="128" text-anchor="middle" font-size="17" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">8</text>

  <text x="232" y="166" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">4</text>
  <text x="306" y="166" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">7</text>
  <text x="380" y="166" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">4</text>
  <text x="454" y="166" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">3</text>
  <text x="528" y="166" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">5</text>

  <rect x="210" y="174" width="44" height="19" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="232" y="188" text-anchor="middle" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">不变</text>
  <rect x="284" y="174" width="44" height="19" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="306" y="188" text-anchor="middle" font-size="10.5" fill="#8f3b38" filter="url(#rough2)">重算</text>
  <rect x="358" y="174" width="44" height="19" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="380" y="188" text-anchor="middle" font-size="10.5" fill="#8a6015" filter="url(#rough2)">×2</text>
  <rect x="432" y="174" width="44" height="19" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="454" y="188" text-anchor="middle" font-size="10.5" fill="#8a6015" filter="url(#rough2)">×2</text>
  <rect x="506" y="174" width="44" height="19" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="528" y="188" text-anchor="middle" font-size="10.5" fill="#8f3b38" filter="url(#rough2)">重算</text>

  <text x="232" y="208" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">d[1]</text>
  <text x="306" y="208" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">d[2]</text>
  <text x="380" y="208" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">d[3]</text>
  <text x="454" y="208" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">d[4]</text>
  <text x="528" y="208" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">d[5]</text>

  <path d="M 380 214 L 380 240" stroke="#8a6015" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="394" y="232" font-size="11.5" fill="#8a6015" filter="url(#rough2)">翻转 + 全部 ×2</text>

  <!-- ===== 操作后 ===== -->
  <text x="156" y="278" text-anchor="end" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">操作后</text>

  <rect x="166" y="252" width="58" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="195" y="280" text-anchor="middle" font-size="17" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">5</text>
  <rect x="240" y="252" width="58" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="269" y="280" text-anchor="middle" font-size="17" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">9</text>
  <rect x="314" y="252" width="58" height="44" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="343" y="280" text-anchor="middle" font-size="17" font-weight="bold" fill="#8a6015" filter="url(#rough2)">6</text>
  <rect x="388" y="252" width="58" height="44" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="417" y="280" text-anchor="middle" font-size="17" font-weight="bold" fill="#8a6015" filter="url(#rough2)">12</text>
  <rect x="462" y="252" width="58" height="44" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="491" y="280" text-anchor="middle" font-size="17" font-weight="bold" fill="#8a6015" filter="url(#rough2)">4</text>
  <rect x="536" y="252" width="58" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="565" y="280" text-anchor="middle" font-size="17" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">8</text>

  <text x="232" y="318" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">4</text>
  <text x="306" y="318" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">3</text>
  <text x="380" y="318" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">6</text>
  <text x="454" y="318" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">8</text>
  <text x="528" y="318" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">4</text>

  <text x="232" y="338" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">= d[1]</text>
  <text x="306" y="338" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">|a[2]−2a[5]|</text>
  <text x="380" y="338" text-anchor="middle" font-size="10.5" fill="#8a6015" filter="url(#rough2)">2·d[4]</text>
  <text x="454" y="338" text-anchor="middle" font-size="10.5" fill="#8a6015" filter="url(#rough2)">2·d[3]</text>
  <text x="528" y="338" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">|2a[3]−a[6]|</text>

  <rect x="20" y="360" width="720" height="106" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="36" y="384" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">① 段内 i ∈ [l, r−1]：新 gap = 2·d[i]，只是翻倍（相邻的还是原来那一对，顺序被翻转）</text>
  <text x="36" y="406" font-size="12.5" fill="#8f3b38" filter="url(#rough2)">② 左端 i = l−1：|a[l−1] − 2·a[r]|          ③ 右端 i = r：|2·a[l] − a[r+1]|</text>
  <text x="36" y="428" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">④ 其余 i（i &lt; l−1 或 i &gt; r）：d[i] 原样保留</text>
  <text x="36" y="452" font-size="12" fill="#8a6015" filter="url(#rough2)">关键：段内 gap 只会变大，能被改小的只有 l−1 与 r 这两个位置</text>
</svg>
