<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="470" fill="#fafafa"/>

  <text x="360" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例走查：6 × 6 的广场铺 4 × 4 石板</text>
  <path d="M 130 46 Q 360 52 590 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 四块石板（每块 128 px = 4 m） -->
  <rect x="90" y="110" width="128" height="128" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"
        stroke-dasharray="6 4" filter="url(#rough2)"/>
  <rect x="218" y="110" width="128" height="128" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"
        stroke-dasharray="6 4" filter="url(#rough2)"/>
  <rect x="90" y="238" width="128" height="128" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"
        stroke-dasharray="6 4" filter="url(#rough2)"/>
  <rect x="218" y="238" width="128" height="128" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"
        stroke-dasharray="6 4" filter="url(#rough2)"/>

  <!-- 广场轮廓（粗线，压在石板之上） -->
  <rect x="90" y="110" width="192" height="192" fill="none" stroke="#2b2b2b" stroke-width="2.6" filter="url(#rough2)"/>

  <!-- 越界区域 -->
  <rect x="282" y="110" width="64" height="256" fill="#fff8e1" fill-opacity="0.55" stroke="#d6a040"
        stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <rect x="90" y="302" width="192" height="64" fill="#fff8e1" fill-opacity="0.55" stroke="#d6a040"
        stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- 石板编号 -->
  <text x="154" y="196" text-anchor="middle" font-size="18" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">1</text>
  <text x="282" y="196" text-anchor="middle" font-size="18" font-weight="bold" fill="#2f5223" filter="url(#rough2)">2</text>
  <text x="154" y="324" text-anchor="middle" font-size="18" font-weight="bold" fill="#2f5223" filter="url(#rough2)">3</text>
  <text x="282" y="324" text-anchor="middle" font-size="18" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">4</text>

  <!-- a = 4 标注（1 号石板内部上沿） -->
  <path d="M 94 140 L 214 140" stroke="#446688" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="154" y="132" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">a = 4</text>

  <!-- n = 6 尺寸线 -->
  <path d="M 90 84 L 282 84" stroke="#555" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="90" y1="78" x2="90" y2="90" stroke="#555" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="282" y1="78" x2="282" y2="90" stroke="#555" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="186" y="102" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">n = 6</text>

  <!-- m = 6 尺寸线 -->
  <path d="M 70 110 L 70 302" stroke="#555" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="64" y1="110" x2="76" y2="110" stroke="#555" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="64" y1="302" x2="76" y2="302" stroke="#555" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="56" y="206" text-anchor="middle" font-size="11" fill="#444" transform="rotate(-90 56 206)" filter="url(#rough2)">m = 6</text>

  <!-- 越界说明 -->
  <text x="314" y="250" text-anchor="middle" font-size="11" fill="#8a6015" transform="rotate(-90 314 250)" filter="url(#rough2)">越界允许</text>
  <text x="186" y="342" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">越界允许</text>

  <!-- 右侧结论 -->
  <text x="400" y="128" font-size="13" fill="#2b2b2b" filter="url(#rough2)">横向：⌈6/4⌉ = 2 列</text>
  <text x="400" y="158" font-size="13" fill="#2b2b2b" filter="url(#rough2)">纵向：⌈6/4⌉ = 2 行</text>
  <text x="400" y="196" font-size="16" font-weight="bold" fill="#2f5223" filter="url(#rough2)">2 × 2 = 4 块</text>

  <rect x="392" y="222" width="302" height="118" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="404" y="250" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">每块 4 × 4 石板，一列只能放 2 块</text>
  <text x="404" y="274" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">一行也只能放 2 块；行列都放满，</text>
  <text x="404" y="298" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">至少需要 2 × 2 = 4 块。</text>
  <text x="404" y="322" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">4 个角两两相距 6 &gt; 4，一块最多盖 1 个角。</text>

  <rect x="90" y="404" width="150" height="42" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="165" y="431" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5223" filter="url(#rough2)">答案 = 4</text>

  <text x="392" y="424" font-size="11" fill="#666" filter="url(#rough2)">与官方输出 4 一致</text>
</svg>
