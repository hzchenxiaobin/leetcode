<svg xmlns="http://www.w3.org/2000/svg" width="740" height="420" viewBox="0 0 740 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="143"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="a14farr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="740" height="420" fill="#fafafa"/>

  <text x="370" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">扫描一遍，只保留四个边界</text>
  <path d="M 160 44 Q 370 50 580 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 流程 -->
  <rect x="40" y="64" width="310" height="50" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="195" y="95" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">读入 n, m 与 n 行字符串</text>
  <line x1="195" y1="114" x2="195" y2="132" stroke="#446688" stroke-width="1.7" marker-end="url(#a14farr)" filter="url(#rough2)"/>

  <rect x="40" y="134" width="310" height="50" rx="9" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="195" y="165" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">top=n, bottom=-1, left=m, right=-1</text>
  <line x1="195" y1="184" x2="195" y2="202" stroke="#446688" stroke-width="1.7" marker-end="url(#a14farr)" filter="url(#rough2)"/>

  <rect x="40" y="204" width="310" height="76" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="195" y="232" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">对每个 (i, j)：若 grid[i][j] == '*'</text>
  <text x="195" y="256" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">更新 top/bottom/left/right</text>
  <line x1="195" y1="280" x2="195" y2="298" stroke="#446688" stroke-width="1.7" marker-end="url(#a14farr)" filter="url(#rough2)"/>

  <rect x="40" y="300" width="310" height="76" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="195" y="328" text-anchor="middle" font-size="12.5" fill="#2f5223" filter="url(#rough2)">输出第 top..bottom 行</text>
  <text x="195" y="352" text-anchor="middle" font-size="12.5" fill="#2f5223" filter="url(#rough2)">每行取第 left..right 列</text>

  <!-- 右侧示意 -->
  <rect x="382" y="64" width="330" height="330" rx="12" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="402" y="90" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">输出尺寸</text>
  <text x="402" y="118" font-size="12" fill="#555" filter="url(#rough2)">高度 = bottom - top + 1</text>
  <text x="402" y="142" font-size="12" fill="#555" filter="url(#rough2)">宽度 = right - left + 1</text>

  <!-- 迷你网格 -->
  <g filter="url(#rough2)">
    <rect x="430" y="168" width="234" height="156" fill="none" stroke="#c9c2b4" stroke-width="1.2"/>
    <line x1="508" y1="168" x2="508" y2="324" stroke="#ded8cc"/>
    <line x1="586" y1="168" x2="586" y2="324" stroke="#ded8cc"/>
    <line x1="430" y1="220" x2="664" y2="220" stroke="#ded8cc"/>
    <line x1="430" y1="272" x2="664" y2="272" stroke="#ded8cc"/>
    <rect x="430" y="168" width="78" height="156" fill="#ececec" opacity="0.75"/>
    <rect x="664" y="168" width="0" height="0" fill="none"/>
  </g>
  <rect x="507" y="219" width="80" height="54" fill="none" stroke="#4a7a3a" stroke-width="2.6" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="460" y="196" font-size="10.5" fill="#777" filter="url(#rough2)">裁掉</text>
  <text x="547" y="310" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">保留</text>
  <text x="402" y="356" font-size="11.5" fill="#777" filter="url(#rough2)">灰色列整列不含 *，直接裁掉；</text>
  <text x="402" y="376" font-size="11.5" fill="#777" filter="url(#rough2)">含 * 的行/列即使中间有 '.' 也要保留。</text>

  <text x="560" y="118" font-size="11.5" fill="#8a6015" filter="url(#rough2)">时间 O(nm)</text>
</svg>
