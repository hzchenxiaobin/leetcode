  <text x="534.0" y="164.0" text-anchor="middle" font-size="10.5" fill="#8c5a2c" font-weight="bold" filter="url(#rough2)">M</text>
  <path d="M 440.0 106.0 L 440.0 177.0" stroke="#8c5a2c" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
