  <path d="M 520.0 186.0 L 440.0 186.0" stroke="#8c2f2c" stroke-width="1.4" fill="none" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="510.0" y="260.0" text-anchor="middle" font-size="10.5" fill="#8c2f2c" filter="url(#rough2)">③–④ 的 S 边被删</text>
  <path d="M 356.0 60.0 L 356.0 276.0" stroke="#555555" stroke-width="1.4" fill="none" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="360.0" y="286" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">砍掉 e 后 f 的两端分居两侧，加 f 不会成环</text>
</svg>
