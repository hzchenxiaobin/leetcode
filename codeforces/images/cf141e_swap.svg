      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1418"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="720" height="300" fill="#fafafa"/>
  <text x="360.0" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">f 的树上回路里取一条 S 边换出</text>
