  <rect x="424" y="186" width="32" height="28" rx="5" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="440.0" y="204.0" text-anchor="middle" font-size="11.0" fill="#4a7a3a" filter="url(#rough2)">4</text>
  <path d="M 456.0 120.0 L 495.0 120.0" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 504.0 120.0 L 495.0 124.0 L 495.0 116.0 Z" fill="#4a7a3a" filter="url(#rough2)"/>
  <path d="M 520.0 134.0 L 520.0 177.0" stroke="#8c5a2c" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 520.0 186.0 L 516.0 177.0 L 524.0 177.0 Z" fill="#8c5a2c" filter="url(#rough2)"/>
