<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="29"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每组只需一次取模：判断 y 是否整除 x</text>
  <path d="M 200 40 Q 360 47 520 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <rect x="270" y="58" width="180" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="84" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">读入 t（多测组数）</text>

  <path d="M 360 100 L 360 122" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="250" y="126" width="220" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="153" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">每组读入 x, y</text>

  <path d="M 360 170 L 360 190" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="360,194 526,240 360,286 194,240" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">x mod y = 0 ?</text>
  <text x="360" y="255" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">（即 y 是 x 的因子）</text>

  <path d="M 194 240 L 140 240 L 140 300" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 526 240 L 580 240 L 580 300" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="166" y="232" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">是</text>
  <text x="554" y="232" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">否</text>

  <rect x="40" y="306" width="200" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="140" y="335" text-anchor="middle" font-size="14" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">输出 YES</text>

  <rect x="480" y="306" width="200" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="580" y="335" text-anchor="middle" font-size="14" font-weight="bold" fill="#a14340" filter="url(#rough2)">输出 NO</text>

  <text x="360" y="378" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">x = y 时允许 0 次操作，x mod x = 0 自然给出 YES，不需要特判</text>
  <text x="360" y="398" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">y = 1 时取 z = x 即可一步到 1，x mod 1 = 0 同样自然给出 YES</text>
  <text x="360" y="418" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">y &gt; x 时 x mod y = x ≠ 0（y ≠ x），自动判 NO，也不用手写大小比较</text>
</svg>
