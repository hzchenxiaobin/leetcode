<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="573"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="280" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">阈值 = 第 k 名分数，且必须 &gt; 0</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">非递增序列 ⇒ 从前往后数 a[i] ≥ a[k]</text>
  <g filter="url(#rough2)"><rect x="70" y="96" width="84" height="54" rx="4" fill="#dcecd2" fill-opacity="0.6" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="112" y="130" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">10</text>
  <g filter="url(#rough2)"><rect x="166" y="96" width="84" height="54" rx="4" fill="#dcecd2" fill-opacity="0.6" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="208" y="130" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">9</text>
  <g filter="url(#rough2)"><rect x="262" y="96" width="84" height="54" rx="4" fill="#dcecd2" fill-opacity="0.6" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="304" y="130" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">8</text>
  <g filter="url(#rough2)"><rect x="358" y="96" width="84" height="54" rx="4" fill="#dcecd2" fill-opacity="0.6" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="400" y="130" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">7</text>
  <g filter="url(#rough2)"><rect x="454" y="96" width="84" height="54" rx="4" fill="#dcecd2" fill-opacity="0.6" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="496" y="130" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">7</text>
  <g filter="url(#rough2)"><rect x="550" y="96" width="84" height="54" rx="4" fill="#dcecd2" fill-opacity="0.6" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="592" y="130" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">7</text>
  <g filter="url(#rough2)"><rect x="646" y="96" width="84" height="54" rx="4" fill="#ffffff" fill-opacity="0.6" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="688" y="130" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <g filter="url(#rough2)"><rect x="742" y="96" width="84" height="54" rx="4" fill="#ffffff" fill-opacity="0.6" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="784" y="130" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <text x="450" y="190" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">k = 5 ⇒ 阈值 7；分数 ≥ 7 的前 6 人晋级（第 6 个也是 7）</text>
  <text x="450" y="226" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 6</text>
</svg>
