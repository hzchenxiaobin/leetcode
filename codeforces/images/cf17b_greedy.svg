<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="330" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">B：每个下属只挑“最便宜的那个申请”</text>
  <path d="M 170 42 Q 380 47 590 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="380" y="62" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">样例 1：q = 7 2 3 1；申请 1→2 花 5、2→4 花 1、3→4 花 1、1→3 花 5</text>

  <text x="60" y="102" font-size="11.5" fill="#777" filter="url(#rough2)">谁当谁的上司（箭头指向下属）</text>

  <text x="90" y="134" font-size="12" fill="#2b2b2b" filter="url(#rough2)">下属 2：</text>
  <rect x="160" y="116" width="120" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="220" y="134" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">1 → 2  花 5</text>
  <text x="292" y="134" font-size="11" fill="#2f5223" filter="url(#rough2)">唯一选择 → 5</text>

  <text x="90" y="172" font-size="12" fill="#2b2b2b" filter="url(#rough2)">下属 3：</text>
  <rect x="160" y="154" width="120" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="220" y="172" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">1 → 3  花 5</text>
  <text x="292" y="172" font-size="11" fill="#2f5223" filter="url(#rough2)">唯一选择 → 5</text>

  <text x="90" y="210" font-size="12" fill="#2b2b2b" filter="url(#rough2)">下属 4：</text>
  <rect x="160" y="192" width="120" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="220" y="210" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">2 → 4  花 1</text>
  <rect x="160" y="222" width="120" height="26" rx="5" fill="#fdeceb" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="220" y="240" text-anchor="middle" font-size="11" fill="#8c3a36" filter="url(#rough2)">3 → 4  花 1</text>
  <text x="292" y="228" font-size="11" fill="#2f5223" filter="url(#rough2)">两条都 1 → 取 1</text>

  <line x1="400" y1="90" x2="400" y2="260" stroke="#ddd" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <rect x="424" y="88" width="300" height="76" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="436" y="112" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">总花费 = 5 + 5 + 1 = 11</text>
  <text x="436" y="136" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">每人（除根）恰好一条入边，互不干扰，</text>
  <text x="436" y="156" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">所以逐人取最小就是全局最小。</text>

  <rect x="424" y="176" width="300" height="86" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="436" y="200" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">根：没有任何申请指向的人</text>
  <text x="436" y="224" font-size="10.5" fill="#3c5e88" filter="url(#rough2)">必须恰好 1 个（树只能有一个根）；</text>
  <text x="436" y="246" font-size="10.5" fill="#3c5e88" filter="url(#rough2)">在这里，没人指向 1 号 → 1 号是根。</text>

  <text x="60" y="292" font-size="11" fill="#555" filter="url(#rough2)">样例 1 的这张“最便宜入边”集合恰好构成一棵树：1 是根，2 和 3 挂在 1 下，4 挂在 2 下。</text>
  <text x="60" y="314" font-size="11" fill="#8c3a36" filter="url(#rough2)">样例 2 里 2 号和 3 号都没有入边 → 两个根 → 输出 -1。</text>
</svg>
