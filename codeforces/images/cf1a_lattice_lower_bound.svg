<svg xmlns="http://www.w3.org/2000/svg" width="720" height="410" viewBox="0 0 720 410"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="410" fill="#fafafa"/>

  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">下界：PQ 个格点，每块石板最多盖住一个</text>
  <path d="M 120 44 Q 360 50 600 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 广场 n × m -->
  <rect x="100" y="90" width="320" height="240" fill="#ffffff" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="112" y="110" font-size="11" fill="#7a8a70" filter="url(#rough2)">广场 n × m</text>

  <!-- 两块示例石板 -->
  <rect x="110" y="120" width="100" height="100" fill="#e8f0fe" fill-opacity="0.85" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="160" y="230" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">边长 a</text>
  <path d="M 110 216 L 210 216" stroke="#446688" stroke-width="1.3" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <rect x="250" y="230" width="95" height="95" fill="#e6f4ea" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>

  <rect x="355" y="110" width="100" height="100" fill="#fff8e1" fill-opacity="0.85" stroke="#d6a040" stroke-width="1.6"
        stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="372" y="106" font-size="10" fill="#8a6015" filter="url(#rough2)">越界石板</text>

  <!-- 格点 -->
  <g fill="#b85450" filter="url(#rough2)">
    <circle cx="130" cy="150" r="5.5"/>
    <circle cx="260" cy="150" r="5.5"/>
    <circle cx="390" cy="150" r="5.5"/>
    <circle cx="130" cy="290" r="5.5"/>
    <circle cx="260" cy="290" r="5.5"/>
    <circle cx="390" cy="290" r="5.5"/>
  </g>

  <!-- 间距标注 -->
  <path d="M 130 352 L 260 352" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrr2)" filter="url(#rough2)"/>
  <path d="M 260 352 L 130 352" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrr2)" filter="url(#rough2)"/>
  <line x1="130" y1="330" x2="130" y2="358" stroke="#b85450" stroke-width="1" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <line x1="260" y1="330" x2="260" y2="358" stroke="#b85450" stroke-width="1" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <text x="195" y="372" text-anchor="middle" font-size="12" font-weight="bold" fill="#a33b36" filter="url(#rough2)">s &gt; a</text>

  <text x="100" y="396" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">P = 3 列，Q = 2 行 ⇒ 至少 P·Q = 6 块</text>

  <!-- 右侧推理框 -->
  <rect x="470" y="70" width="232" height="160" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="482" y="96" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">石板 x 投影长恰为 a</text>
  <text x="482" y="120" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">相邻格点间距 s &gt; a</text>
  <text x="482" y="148" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">⇒ 一块石板最多盖 1 点</text>
  <text x="482" y="176" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">⇒ 至少要 P·Q 块石板</text>
  <text x="482" y="204" font-size="11" fill="#7a5a1b" filter="url(#rough2)">这是与铺法无关的下界</text>

  <text x="470" y="344" font-size="10.5" fill="#777" filter="url(#rough2)">图中只画了 3 块石板作示意</text>
  <rect x="470" y="252" width="232" height="72" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="482" y="276" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">上界由 P×Q 的网格给出</text>
  <text x="482" y="302" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">两边夹住 ⇒ 答案 = P·Q</text>
</svg>
