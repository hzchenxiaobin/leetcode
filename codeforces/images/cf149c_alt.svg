<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="405"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="280" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">排序后交替分配：人数差 ≤1、技能差 ≤ max</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">配对区间不重叠 ⇒ 总差 ≤ b_n − b_1</text>
  <g filter="url(#rough2)"><rect x="120" y="100" width="110" height="70" rx="5" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="175" y="144" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="175" y="190" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">队1</text>
  <g filter="url(#rough2)"><rect x="250" y="100" width="110" height="70" rx="5" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="305" y="144" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="305" y="190" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">队2</text>
  <g filter="url(#rough2)"><rect x="380" y="100" width="110" height="70" rx="5" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="435" y="144" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="435" y="190" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">队1</text>
  <g filter="url(#rough2)"><rect x="510" y="100" width="110" height="70" rx="5" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="565" y="144" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="565" y="190" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">队2</text>
  <g filter="url(#rough2)"><rect x="640" y="100" width="110" height="70" rx="5" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="695" y="144" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="695" y="190" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">队1</text>
  <text x="450" y="226" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">队1 = 1+2+3 = 6，队2 = 1+3 = 4，差 2 ≤ max = 3 ✓</text>
</svg>
