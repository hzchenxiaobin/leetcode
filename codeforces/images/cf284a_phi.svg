<svg xmlns="http://www.w3.org/2000/svg" width="700" height="380" viewBox="0 0 700 380"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="133"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="700" height="380" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法：分解 p−1，一边除一边累乘 φ</text>
  <path d="M 110 40 Q 350 46 590 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="60" y="58" width="580" height="46" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="76" y="86" font-size="13" fill="#22314a" filter="url(#rough2)">phi ← m ← p−1；对 q = 2..√m：若 q | m，则 m /= q 直到除尽，并 phi ← phi/q·(q−1)</text>
  <g filter="url(#rough2)">
    <rect x="60" y="114" width="580" height="46" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="76" y="142" font-size="13" fill="#22314a" filter="url(#rough2)">循环结束后若 m &gt; 1，说明 m 本身是素数：phi ← phi/m·(m−1)</text>
  <g filter="url(#rough2)">
    <rect x="60" y="176" width="580" height="86" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="76" y="200" font-size="13" fill="#8a6015" filter="url(#rough2)">走查 p = 13：m=12, phi=12</text>
  <text x="76" y="222" font-size="12.5" fill="#8a6015" filter="url(#rough2)">q=2: 12/2=6, phi=12/2·1=6；再 6/2=3（已除尽一次，m 里 2 只剩一个）</text>
  <text x="76" y="244" font-size="12.5" fill="#8a6015" filter="url(#rough2)">q=3: m=3 → m=1, phi=6/3·2=4 ⇒ 答案是 4 ✓</text>
  <g filter="url(#rough2)">
    <rect x="60" y="276" width="580" height="70" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/>
  </g>
  <text x="76" y="300" font-size="12.5" fill="#2f5223" filter="url(#rough2)">复杂度：O(√p) 时间、O(1) 空间；p &lt; 2000 时最坏几十次迭代。</text>
  <text x="76" y="324" font-size="12.5" fill="#2f5223" filter="url(#rough2)">最大坑：p = 2 时 p−1 = 1，φ(1) = 1（原根只有 x=1）——循环一次也不进。</text>
</svg>
