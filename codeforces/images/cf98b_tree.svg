<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="985"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>
  <text x="360.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">n = 3 的决策树</text>
  <path d="M 115.2 42 Q 360.0 48 604.8 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <circle cx="360" cy="80" r="7" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="220" cy="160" r="7" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="500" cy="160" r="7" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="150" cy="240" r="7" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="290" cy="240" r="7" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="430" cy="240" r="7" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="570" cy="240" r="7" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="360.0" y1="87.0" x2="220.0" y2="152.0" stroke="#8a8a8a" stroke-width="1.2" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <line x1="360.0" y1="87.0" x2="500.0" y2="152.0" stroke="#8a8a8a" stroke-width="1.2" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <line x1="220.0" y1="167.0" x2="150.0" y2="232.0" stroke="#8a8a8a" stroke-width="1.2" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <line x1="220.0" y1="167.0" x2="290.0" y2="232.0" stroke="#8a8a8a" stroke-width="1.2" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <line x1="500.0" y1="167.0" x2="430.0" y2="232.0" stroke="#8a8a8a" stroke-width="1.2" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <line x1="500.0" y1="167.0" x2="570.0" y2="232.0" stroke="#8a8a8a" stroke-width="1.2" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <circle cx="150" cy="316" r="13" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="321" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5223" filter="url(#rough2)">A</text>
  <circle cx="290" cy="316" r="13" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="321" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5223" filter="url(#rough2)">B</text>
  <circle cx="430" cy="316" r="13" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="430" y="321" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5223" filter="url(#rough2)">C</text>
  <circle cx="570" cy="316" r="13" fill="#fbeadb" stroke="#d98c40" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="570" y="321" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6015" filter="url(#rough2)">作废</text>
  <line x1="150.0" y1="247.0" x2="150.0" y2="302.0" stroke="#8a8a8a" stroke-width="1.2" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <line x1="290.0" y1="247.0" x2="290.0" y2="302.0" stroke="#8a8a8a" stroke-width="1.2" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <line x1="430.0" y1="247.0" x2="430.0" y2="302.0" stroke="#8a8a8a" stroke-width="1.2" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <line x1="570.0" y1="247.0" x2="570.0" y2="302.0" stroke="#8a8a8a" stroke-width="1.2" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <text x="570" y="350" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">1/4 质量留给下一轮</text>
  <text x="200" y="140" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">2 mod 3 = 2</text>
  <text x="500" y="220" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">4 mod 3 = 1</text>
  <text x="360" y="60" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">第 0 层：1 个未定分支 = 1 mod 3</text>
  <rect x="40" y="366" width="640" height="26" rx="6" fill="#f4f4f0" stroke="#8a8a8a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="360" y="384" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">E[T] = Σ P(T>k) = Σ (2^k mod n)/2^k</text>
</svg>
