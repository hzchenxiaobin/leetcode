<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="161"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="290" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2：(0,0,t=0,p=0.6) 与 (5,0,t=5,p=0.7)</text>
  <line x1="80" y1="110" x2="620" y2="110" stroke="#c9ced6" stroke-width="1.6" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <circle cx="140" cy="110" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="140" y="145" text-anchor="middle" font-size="12" fill="#2f4a66">t=0</text>
    <circle cx="500" cy="110" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="500" y="145" text-anchor="middle" font-size="12" fill="#2f4a66">t=5</text>
  </g>
  <line x1="151" y1="110" x2="489" y2="110" stroke="#4a7a3a" stroke-width="3" filter="url(#rough2)"/>
  <text x="320" y="100" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">距离 5 ≤ Δt 5 ✓</text>

  <g font-size="12.5" filter="url(#rough2)">
    <text x="70" y="196" fill="#2f4a66">dp[0] = 0.6</text>
    <text x="260" y="196" fill="#2f4a66">dp[1] = 0.6 + 0.7 = 1.3</text>
    <text x="520" y="196" fill="#2f5223">答案 = 1.3</text>
  </g>
  <rect x="70" y="216" width="580" height="54" rx="9" fill="#eef4ec" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="86" y="240" font-size="12.5" fill="#2f5223" filter="url(#rough2)">若 t=4 而不是 5：距离 5 &gt; 4，接不上，答案只能是 max(0.6, 0.7) = 0.7。</text>
  <text x="86" y="260" font-size="12.5" fill="#2f5223" filter="url(#rough2)">输出 1.3000000000。</text>
</svg>
