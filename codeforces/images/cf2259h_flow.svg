<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">算法流程：一次线性扫描 + 并查集，O(n)</text>

  <g filter="url(#rough2)">
    <rect x="34" y="52" width="258" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10"/>
    <text x="50" y="74" font-size="11" fill="#3a4a66" font-weight="bold">1. 差分标记禁止集合 F</text>
    <text x="50" y="94" font-size="10" fill="#555">b_i = v &gt; 0：区间 [i−v+1, i+v−1] 全部 +1</text>
    <text x="50" y="110" font-size="10" fill="#555">一次前缀和得到每个位置是否被禁</text>

    <rect x="330" y="52" width="256" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10"/>
    <text x="346" y="74" font-size="11" fill="#8a3a36" font-weight="bold">2. 处理 b_i = 0</text>
    <text x="346" y="94" font-size="10" fill="#555">该位置强制藏宝；若同时被禁 → 无解</text>
    <text x="346" y="110" font-size="10" fill="#555">答案直接输出 0</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="330" y="152" width="256" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10"/>
    <text x="346" y="174" font-size="11" fill="#2f5a24" font-weight="bold">3. 每条子句取端点 L=i−v, R=i+v</text>
    <text x="346" y="194" font-size="10" fill="#555">可用端点 = 在 [1,n] 内且未被禁的端点</text>
    <text x="346" y="210" font-size="10" fill="#555">0 个 → 0；1 个 → 强制选；2 个 → 建边</text>

    <rect x="34" y="152" width="258" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10"/>
    <text x="50" y="174" font-size="11" fill="#8a6a20" font-weight="bold">4. 剔除被强制点满足的边</text>
    <text x="50" y="194" font-size="10" fill="#555">剩下的活跃边两两不共端点</text>
    <text x="50" y="210" font-size="10" fill="#555">⟹ 最大度 2 且无环 ⟹ 互不相交的路径</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="34" y="252" width="258" height="70" fill="#f2e8fe" stroke="#6a4a9a" stroke-width="1.6" rx="10"/>
    <text x="50" y="274" font-size="11" fill="#4a2f70" font-weight="bold">5. 并查集统计每个连通块大小 k</text>
    <text x="50" y="294" font-size="10" fill="#555">自由点：未被禁、未被强制</text>
    <text x="50" y="310" font-size="10" fill="#555">块大小 = 该路径的点数</text>

    <rect x="330" y="252" width="256" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10"/>
    <text x="346" y="274" font-size="11" fill="#2f5a24" font-weight="bold">6. 相乘：F(k+2) 逐块累乘</text>
    <text x="346" y="294" font-size="10" fill="#555">F(1)=F(2)=1，F(k)=F(k−1)+F(k−2)</text>
    <text x="346" y="310" font-size="10" fill="#555">若所有 b_i 都是 −1，再减掉空集</text>
  </g>

  <path d="M 296 87 L 322 87" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 458 126 L 458 144" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 326 187 L 300 187" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 163 226 L 163 244" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 296 287 L 322 287" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="310" y="352" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">所有数组按「当前 n」开，多测总 n ≤ 2×10^5 ⟹ 总复杂度仍是 O(Σn)</text>
  <text x="310" y="374" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">易错：忘记给 b_i = 0 打「强制」标记（会把必须选的格子当成自由格，多算 2 倍）</text>
</svg>
