<svg xmlns="http://www.w3.org/2000/svg" width="880" height="290" viewBox="0 0 880 290"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="117"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="290" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例：aBAcAba → .b.c.b</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">Codeforces → .c.d.f.r.c.s</text>
  <g filter="url(#rough2)"><rect x="140" y="100" width="260" height="50" rx="4" fill="#f6e3c4" fill-opacity="0.6" stroke="#c9a86a" stroke-width="1.3"/></g>
  <text x="270" y="131" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">aBAcAba</text>
  <g filter="url(#rough2)"><rect x="460" y="100" width="280" height="50" rx="4" fill="#d7ecd0" fill-opacity="0.6" stroke="#6a9a58" stroke-width="1.3"/></g>
  <text x="600" y="131" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">.b.c.b</text>
  <text x="442" y="196" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">A→a（元音删去）、B→b（辅音加点）…</text>
</svg>
