<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="303"/>
    <feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></defs>
  <rect width="700" height="300" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">9 个 2×2 块，一次扫描</text>
  <path d="M 170 40 Q 350 46 530 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="62" width="580" height="52" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="86" font-size="13" fill="#22314a" filter="url(#rough2)">for i in 0..2, j in 0..2: cnt = 该 2×2 块中 '#' 的个数</text>
  <text x="76" y="106" font-size="12" fill="#2f4a66" filter="url(#rough2)">若 cnt != 2 → 打印 YES 并结束</text>
  <g filter="url(#rough2)"><rect x="60" y="126" width="580" height="52" rx="8" fill="#fbeeee" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="76" y="150" font-size="13" fill="#8a3a36" filter="url(#rough2)">九个块都不满足（全是 2 黑）→ 打印 NO。</text>
  <text x="76" y="170" font-size="12" fill="#8a3a36" filter="url(#rough2)">复杂度 O(1)，4×4 输入直接读字符串。</text>
  <g filter="url(#rough2)"><rect x="60" y="196" width="580" height="84" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="220" font-size="12.5" fill="#2f5223" filter="url(#rough2)">为什么"2 黑"不行？该块要么改白→黑（变成 3 黑），要么改黑→白（变成 1 黑），</text>
  <text x="76" y="244" font-size="12.5" fill="#2f5223" filter="url(#rough2)">都还不是同色；而题目只允许改一格，无法再改第二格 ⇒ 该块永远无法变成同色。</text>
  <text x="76" y="268" font-size="12" fill="#2f5223" filter="url(#rough2)">（注意：改的那一格也可能同时让"别的块"变好，但至少要有一个块自己变好。）</text>
</svg>
