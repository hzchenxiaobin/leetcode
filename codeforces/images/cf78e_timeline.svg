<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="91"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="720" height="480" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2：先做一次 BFS 求出每格的污染时刻 d</text>
  <path d="M 130 42 Q 360 48 590 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="64" y="84" width="76" height="76" rx="6" fill="#e4e4df" stroke="#9a9a90" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="102" y="130" text-anchor="middle" font-size="17" font-weight="bold" fill="#6a6a60" filter="url(#rough2)">Y</text>
  <rect x="148" y="84" width="76" height="76" rx="6" fill="#f7efd2" stroke="#8a8010" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="186" y="120" text-anchor="middle" font-size="14.5" fill="#5a5208" filter="url(#rough2)">d = 3</text>
  <text x="186" y="142" text-anchor="middle" font-size="10.5" fill="#666655" filter="url(#rough2)">s1 c0</text>
  <rect x="232" y="84" width="76" height="76" rx="6" fill="#f9e3cf" stroke="#8a8010" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="120" text-anchor="middle" font-size="14.5" fill="#5a5208" filter="url(#rough2)">d = 2</text>
  <text x="270" y="142" text-anchor="middle" font-size="10.5" fill="#666655" filter="url(#rough2)">s1 c0</text>
  <rect x="316" y="84" width="76" height="76" rx="6" fill="#f6d5d0" stroke="#8a8010" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="354" y="120" text-anchor="middle" font-size="14.5" fill="#5a5208" filter="url(#rough2)">d = 1</text>
  <text x="354" y="142" text-anchor="middle" font-size="10.5" fill="#666655" filter="url(#rough2)">s0 c1</text>
  <rect x="64" y="168" width="76" height="76" rx="6" fill="#e6e1f0" stroke="#8a8010" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="102" y="204" text-anchor="middle" font-size="14.5" fill="#5a5208" filter="url(#rough2)">d = 7</text>
  <text x="102" y="226" text-anchor="middle" font-size="10.5" fill="#666655" filter="url(#rough2)">s1 c0</text>
  <rect x="148" y="168" width="76" height="76" rx="6" fill="#e4e4df" stroke="#9a9a90" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="186" y="214" text-anchor="middle" font-size="17" font-weight="bold" fill="#6a6a60" filter="url(#rough2)">Y</text>
  <rect x="232" y="168" width="76" height="76" rx="6" fill="#f6d5d0" stroke="#8a8010" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="204" text-anchor="middle" font-size="14.5" fill="#5a5208" filter="url(#rough2)">d = 1</text>
  <text x="270" y="226" text-anchor="middle" font-size="10.5" fill="#666655" filter="url(#rough2)">s1 c0</text>
  <rect x="316" y="168" width="76" height="76" rx="6" fill="#eebcbc" stroke="#b03a36" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="354" y="202" text-anchor="middle" font-size="17" font-weight="bold" fill="#8c2f2c" filter="url(#rough2)">Z</text>
  <text x="354" y="226" text-anchor="middle" font-size="11" fill="#8c2f2c" filter="url(#rough2)">d = 0</text>
  <rect x="64" y="252" width="76" height="76" rx="6" fill="#dde8f3" stroke="#8a8010" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="102" y="288" text-anchor="middle" font-size="14.5" fill="#5a5208" filter="url(#rough2)">d = 6</text>
  <text x="102" y="310" text-anchor="middle" font-size="10.5" fill="#666655" filter="url(#rough2)">s1 c0</text>
  <rect x="148" y="252" width="76" height="76" rx="6" fill="#e4e4df" stroke="#9a9a90" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="186" y="298" text-anchor="middle" font-size="17" font-weight="bold" fill="#6a6a60" filter="url(#rough2)">Y</text>
  <rect x="232" y="252" width="76" height="76" rx="6" fill="#f9e3cf" stroke="#8a8010" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="288" text-anchor="middle" font-size="14.5" fill="#5a5208" filter="url(#rough2)">d = 2</text>
  <text x="270" y="310" text-anchor="middle" font-size="10.5" fill="#666655" filter="url(#rough2)">s0 c0</text>
  <rect x="316" y="252" width="76" height="76" rx="6" fill="#e4e4df" stroke="#9a9a90" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="354" y="298" text-anchor="middle" font-size="17" font-weight="bold" fill="#6a6a60" filter="url(#rough2)">Y</text>
  <rect x="64" y="336" width="76" height="76" rx="6" fill="#dcebe8" stroke="#8a8010" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="102" y="372" text-anchor="middle" font-size="14.5" fill="#5a5208" filter="url(#rough2)">d = 5</text>
  <text x="102" y="394" text-anchor="middle" font-size="10.5" fill="#666655" filter="url(#rough2)">s0 c0</text>
  <rect x="148" y="336" width="76" height="76" rx="6" fill="#e7f0da" stroke="#8a8010" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="186" y="372" text-anchor="middle" font-size="14.5" fill="#5a5208" filter="url(#rough2)">d = 4</text>
  <text x="186" y="394" text-anchor="middle" font-size="10.5" fill="#666655" filter="url(#rough2)">s1 c0</text>
  <rect x="232" y="336" width="76" height="76" rx="6" fill="#f7efd2" stroke="#8a8010" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="372" text-anchor="middle" font-size="14.5" fill="#5a5208" filter="url(#rough2)">d = 3</text>
  <text x="270" y="394" text-anchor="middle" font-size="10.5" fill="#666655" filter="url(#rough2)">s0 c0</text>
  <rect x="316" y="336" width="76" height="76" rx="6" fill="#e7f0da" stroke="#8a8010" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="354" y="372" text-anchor="middle" font-size="14.5" fill="#5a5208" filter="url(#rough2)">d = 4</text>
  <text x="354" y="394" text-anchor="middle" font-size="10.5" fill="#666655" filter="url(#rough2)">s0 c5</text>
  <path d="M 324 190 L 330 154" stroke="#b85450" stroke-width="1.7" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 320 208 L 296 206" stroke="#b85450" stroke-width="1.7" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="330.0" y="166.0" text-anchor="middle" font-size="10.5" fill="#8c2f2c" filter="url(#rough2)">1 分钟</text>
  <rect x="432" y="86" width="254" height="300" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="559" y="112" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">怎么读这张表</text>
  <text x="559" y="140" text-anchor="middle" font-size="12" fill="#335478" filter="url(#rough2)">d = 该格被污染的时刻</text>
  <text x="559" y="164" text-anchor="middle" font-size="12" fill="#335478" filter="url(#rough2)">Y = 正常反应堆（不可走）</text>
  <text x="559" y="188" text-anchor="middle" font-size="12" fill="#8c2f2c" filter="url(#rough2)">Z = 即将爆炸的反应堆</text>
  <text x="559" y="212" text-anchor="middle" font-size="12" fill="#335478" filter="url(#rough2)">s = 科学家数，c = 救援舱数</text>
  <text x="559" y="244" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">救援舱只在 (0,3) 与 (3,3)</text>
  <text x="559" y="268" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">(0,3) 只有 1 个舱，且 d = 1，</text>
  <text x="559" y="290" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">只有第 1 分钟能钻进去</text>
  <text x="559" y="322" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">(3,3) 有 5 个舱，d = 4：</text>
  <text x="559" y="344" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">最晚第 4 分钟必须到达</text>
  <text x="559" y="372" text-anchor="middle" font-size="12" fill="#8c2f2c" filter="url(#rough2)">t = 4，正好卡住 (2,0)</text>
  <text x="360" y="440" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">污染只沿实验室扩散：Z 的两个邻居是 (0,3) 与 (1,2)，其余被 Y 挡住</text>
  <text x="360" y="462" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">于是 (3,3) 的 d = 4、(2,0) 的 d = 6——这些值完全由布局决定，与科学家无关</text>
</svg>
