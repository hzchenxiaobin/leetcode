<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">核心观察：一次操作 = 翻转区间内所有「非 x」位置</text>
  <text x="320" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">翻转集合 D 的最小与最大位置，必须正好是区间端点 lo 与 hi</text>

  <text x="112" y="88" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">s =</text>

  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="148" y="68" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <text x="170" y="89" fill="#2c3e50">1</text>
    <rect x="198" y="68" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <text x="220" y="89" fill="#2c3e50">1</text>
    <rect x="248" y="68" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="5"/>
    <text x="270" y="89" fill="#8a6a20">0</text>
    <rect x="298" y="68" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <text x="320" y="89" fill="#2c3e50">1</text>
    <rect x="348" y="68" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="5"/>
    <text x="370" y="89" fill="#8a6a20">0</text>
    <rect x="398" y="68" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="5"/>
    <text x="420" y="89" fill="#8a6a20">0</text>
    <rect x="448" y="68" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="5"/>
    <text x="470" y="89" fill="#2c3e50">1</text>
  </g>

  <g filter="url(#rough2)" font-size="9" fill="#999" text-anchor="middle">
    <text x="170" y="114">1</text>
    <text x="220" y="114">2</text>
    <text x="270" y="114">3</text>
    <text x="320" y="114">4</text>
    <text x="370" y="114">5</text>
    <text x="420" y="114">6</text>
    <text x="470" y="114">7</text>
  </g>

  <text x="52" y="146" font-size="11" fill="#3a5a30" filter="url(#rough2)">x = 0，取 [2, 7]：</text>
  <rect x="196" y="126" width="228" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="7" filter="url(#rough2)"/>
  <text x="310" y="147" text-anchor="middle" font-size="14" fill="#2c3e50" letter-spacing="6" filter="url(#rough2)">1<tspan fill="#b85450">0</tspan>0<tspan fill="#b85450">0</tspan>00<tspan fill="#b85450">0</tspan></text>
  <text x="436" y="147" font-size="10" fill="#b85450" filter="url(#rough2)">D = {2, 4, 7}</text>

  <text x="52" y="188" font-size="11" fill="#8a3a36" filter="url(#rough2)">x = 1，取 [1, 3]：</text>
  <rect x="196" y="168" width="228" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="7" filter="url(#rough2)"/>
  <text x="310" y="189" text-anchor="middle" font-size="14" fill="#2c3e50" letter-spacing="6" filter="url(#rough2)">11<tspan fill="#b85450">1</tspan>1001</text>
  <text x="436" y="189" font-size="10" fill="#b85450" filter="url(#rough2)">D = {3}</text>

  <text x="320" y="228" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">两端都是 1 的区间共 c1(c1+1)/2 = 10 个，它们给出的 10 个 D 两两不同：</text>

  <g filter="url(#rough2)" font-size="11" fill="#3a4a66" text-anchor="middle">
    <rect x="40" y="242" width="110" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6"/>
    <text x="95" y="262">{1}</text>
    <rect x="154" y="242" width="110" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6"/>
    <text x="209" y="262">{1, 2}</text>
    <rect x="268" y="242" width="110" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6"/>
    <text x="323" y="262">{1, 2, 4}</text>
    <rect x="382" y="242" width="110" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6"/>
    <text x="437" y="262">{1, 2, 4, 7}</text>
    <rect x="496" y="242" width="110" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6"/>
    <text x="551" y="262">{2}</text>
  </g>

  <g filter="url(#rough2)" font-size="11" fill="#3a4a66" text-anchor="middle">
    <rect x="40" y="284" width="110" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6"/>
    <text x="95" y="304">{2, 4}</text>
    <rect x="154" y="284" width="110" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6"/>
    <text x="209" y="304">{2, 4, 7}</text>
    <rect x="268" y="284" width="110" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6"/>
    <text x="323" y="304">{4}</text>
    <rect x="382" y="284" width="110" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6"/>
    <text x="437" y="304">{4, 7}</text>
    <rect x="496" y="284" width="110" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6"/>
    <text x="551" y="304">{7}</text>
  </g>

  <rect x="46" y="330" width="548" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="66" y="352" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">x = 1 翻的是 0，共 C(c0,2) + c0 = c0(c0+1)/2 种；x = 0 翻的是 1，共 c1(c1+1)/2 种</text>
  <text x="66" y="374" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">两类 D 不重叠（被翻位置的原值不同），再加 D = ∅ 的原串 1 种 → 1 + c1(c1+1)/2 + c0(c0+1)/2</text>

  <text x="320" y="414" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">c1 = 4，c0 = 3 → 1 + 10 + 6 = 17，与样例 4 未翻转时一致</text>
</svg>
