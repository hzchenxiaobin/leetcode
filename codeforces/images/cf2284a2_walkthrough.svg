<svg xmlns="http://www.w3.org/2000/svg" width="730" height="420" viewBox="0 0 730 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="730" height="420" fill="#fafafa"/>

  <text x="365" y="33" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：a = [0,1,2,2,4,0] → 降序 16, 4, 4, 2, 1, 1</text>
  <path d="M 110 43 Q 365 49 620 43" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 表头 -->
  <rect x="20" y="60" width="690" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="62" y="83" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#37516e" filter="url(#rough2)">步骤</text>
  <text x="178" y="83" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#37516e" filter="url(#rough2)">vᵢ = 2^(aᵢ)</text>
  <text x="306" y="83" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#37516e" filter="url(#rough2)">放进哪一堆</text>
  <text x="432" y="83" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#37516e" filter="url(#rough2)">堆 P 合计</text>
  <text x="546" y="83" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#37516e" filter="url(#rough2)">堆 Q 合计</text>
  <text x="656" y="83" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#37516e" filter="url(#rough2)">差值 |d|</text>

  <!-- 第 1 行 -->
  <rect x="20" y="96" width="690" height="36" rx="4" fill="#ffffff" stroke="#c9d6e6" stroke-width="1" filter="url(#rough2)"/>
  <text x="62" y="119" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="178" y="119" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">16</text>
  <text x="306" y="119" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">P（初始为空）</text>
  <text x="432" y="119" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">16</text>
  <text x="546" y="119" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="656" y="119" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">16</text>

  <!-- 第 2 行 -->
  <rect x="20" y="134" width="690" height="36" rx="4" fill="#f7f9fc" stroke="#c9d6e6" stroke-width="1" filter="url(#rough2)"/>
  <text x="62" y="157" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="178" y="157" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="306" y="157" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">Q（较轻）</text>
  <text x="432" y="157" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">16</text>
  <text x="546" y="157" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="656" y="157" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">12</text>

  <!-- 第 3 行 -->
  <rect x="20" y="172" width="690" height="36" rx="4" fill="#ffffff" stroke="#c9d6e6" stroke-width="1" filter="url(#rough2)"/>
  <text x="62" y="195" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="178" y="195" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="306" y="195" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">Q（较轻）</text>
  <text x="432" y="195" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">16</text>
  <text x="546" y="195" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">8</text>
  <text x="656" y="195" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">8</text>

  <!-- 第 4 行 -->
  <rect x="20" y="210" width="690" height="36" rx="4" fill="#f7f9fc" stroke="#c9d6e6" stroke-width="1" filter="url(#rough2)"/>
  <text x="62" y="233" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="178" y="233" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="306" y="233" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">Q（较轻）</text>
  <text x="432" y="233" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">16</text>
  <text x="546" y="233" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">10</text>
  <text x="656" y="233" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">6</text>

  <!-- 第 5 行 -->
  <rect x="20" y="248" width="690" height="36" rx="4" fill="#ffffff" stroke="#c9d6e6" stroke-width="1" filter="url(#rough2)"/>
  <text x="62" y="271" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="178" y="271" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="306" y="271" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">Q（较轻）</text>
  <text x="432" y="271" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">16</text>
  <text x="546" y="271" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">11</text>
  <text x="656" y="271" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">5</text>

  <!-- 第 6 行 -->
  <rect x="20" y="286" width="690" height="36" rx="4" fill="#f7f9fc" stroke="#c9d6e6" stroke-width="1" filter="url(#rough2)"/>
  <text x="62" y="309" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">6</text>
  <text x="178" y="309" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="306" y="309" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">Q（较轻）</text>
  <text x="432" y="309" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">16</text>
  <text x="546" y="309" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">12</text>
  <text x="656" y="309" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">4</text>

  <!-- 结果 -->
  <path d="M 656 322 L 656 340" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="20" y="344" width="690" height="62" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="365" y="368" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#a33b36" filter="url(#rough2)">T = 28，d = 4 ⇒ X = (28 − 4)/2 = 12，Y = 16</text>
  <text x="365" y="392" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a2f2b" filter="url(#rough2)">答案 = X · Y = 12 × 16 = 192 ✔ 与官方样例第 3 组一致</text>
</svg>
