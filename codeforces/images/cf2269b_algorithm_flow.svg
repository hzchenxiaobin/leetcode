<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#d6a040"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="640" height="420" fill="#fafafa"/>
  <text x="320.0" y="30" text-anchor="middle" font-size="17" fill="#222" filter="url(#rough2)">算法流程：迭代 20 夜后数同一取值</text>
  <rect x="170.0" y="52" width="300" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320.0" y="79" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">读入 n 与 a_1 … a_n（多测）</text>
  <path d="M320.0,98 L320.0,118" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="150.0" y="120" width="340" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320.0" y="147" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">对每个 a_i 重复 20 次：a_i ← f(a_i)</text>
  <path d="M320.0,166 L320.0,186" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="160.0" y="188" width="320" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320.0" y="215" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">cnt[a_i]++   （值域桶 [1, 729]）</text>
  <path d="M320.0,234 L320.0,254" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="160.0" y="256" width="320" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320.0" y="283" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">ans ← Σ_v cnt[v]·(cnt[v]−1)/2</text>
  <path d="M320.0,302 L320.0,322" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="170.0" y="324" width="300" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320.0" y="351" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">输出 ans，处理下一组数据</text>
  <text x="20" y="400" text-anchor="start" font-size="12" fill="#666" font-weight="normal" filter="url(#rough2)">注：f(x)=各位数字平方和；a_i ≤ 1e9 时一步后 ≤ 729，12 夜内必进 {1} 或 8-循环。</text>
</svg>
