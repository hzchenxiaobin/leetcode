<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="380" fill="#fafafa"/>

  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">一个不含素数的窗口，会把 l 撑大</text>
  <path d="M 160 44 Q 360 50 560 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="60" y="70" font-size="11.5" fill="#666" filter="url(#rough2)">区间 a=6, b=13（数轴下方标出素数 7, 11, 13）</text>

  <!-- 数字格 -->
  <g filter="url(#rough2)">
    <rect x="60" y="82" width="56" height="52" fill="#f0f0f0" stroke="#999" stroke-width="1.5"/>
    <rect x="116" y="82" width="56" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="172" y="82" width="56" height="52" fill="#f0f0f0" stroke="#999" stroke-width="1.5"/>
    <rect x="228" y="82" width="56" height="52" fill="#f0f0f0" stroke="#999" stroke-width="1.5"/>
    <rect x="284" y="82" width="56" height="52" fill="#f0f0f0" stroke="#999" stroke-width="1.5"/>
    <rect x="340" y="82" width="56" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <rect x="396" y="82" width="56" height="52" fill="#f0f0f0" stroke="#999" stroke-width="1.5"/>
    <rect x="452" y="82" width="56" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <text x="88" y="116" text-anchor="middle" font-size="19" font-weight="bold" fill="#666" filter="url(#rough2)">6</text>
  <text x="144" y="116" text-anchor="middle" font-size="19" font-weight="bold" fill="#2f5223" filter="url(#rough2)">7</text>
  <text x="200" y="116" text-anchor="middle" font-size="19" font-weight="bold" fill="#666" filter="url(#rough2)">8</text>
  <text x="256" y="116" text-anchor="middle" font-size="19" font-weight="bold" fill="#666" filter="url(#rough2)">9</text>
  <text x="312" y="116" text-anchor="middle" font-size="19" font-weight="bold" fill="#666" filter="url(#rough2)">10</text>
  <text x="368" y="116" text-anchor="middle" font-size="19" font-weight="bold" fill="#2f5223" filter="url(#rough2)">11</text>
  <text x="424" y="116" text-anchor="middle" font-size="19" font-weight="bold" fill="#666" filter="url(#rough2)">12</text>
  <text x="480" y="116" text-anchor="middle" font-size="19" font-weight="bold" fill="#2f5223" filter="url(#rough2)">13</text>
  <text x="144" y="150" text-anchor="middle" font-size="10" fill="#2f5223" filter="url(#rough2)">素数</text>
  <text x="368" y="150" text-anchor="middle" font-size="10" fill="#2f5223" filter="url(#rough2)">素数</text>
  <text x="480" y="150" text-anchor="middle" font-size="10" fill="#2f5223" filter="url(#rough2)">素数</text>

  <!-- 失败窗口 8..10 -->
  <rect x="172" y="82" width="168" height="52" fill="none" stroke="#b85450" stroke-width="2.4" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <path d="M 176 176 L 336 176" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 176 176 L 176 164" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 336 176 L 336 164" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="172" font-size="12" fill="#8c2f2b" filter="url(#rough2)">l=3：[8,10] 全是合数，0 个素数 ✗</text>

  <!-- 通过窗口 8..11 -->
  <rect x="172" y="82" width="224" height="52" fill="none" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <path d="M 176 216 L 392 216" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 176 216 L 176 204" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 392 216 L 392 204" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="416" y="212" font-size="12" fill="#2f5223" filter="url(#rough2)">l=4：[8,11] 含 11 ✓</text>

  <!-- 说明 -->
  <rect x="60" y="244" width="600" height="58" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="72" y="266" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">要让每个长度 l 的窗口都含 k 个素数，l 至少要能跨过「素数的最大空档」；</text>
  <text x="72" y="288" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">k 越大，需要跨过的素数越多，所需 l 只增不减 → 可行性随 l 单调。</text>

  <text x="60" y="330" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">本样例 k=1：l=1 失败、l=2 失败（[9,10] 无素数）、l=3 失败、</text>
  <text x="60" y="354" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">l=4 起全部窗口都含素数 → 答案 4（与官方样例一致）</text>
</svg>
