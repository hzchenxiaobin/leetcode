<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="103"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="440" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">比较规则：时间 → 距离 → 下标</text>
  <path d="M 180 44 Q 380 50 580 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 卡片 1 -->
  <rect x="24" y="64" width="224" height="220" rx="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="58" cy="98" r="17" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="58" y="104" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">1</text>
  <text x="88" y="104" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">时间更短</text>
  <text x="42" y="150" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">tᵢ &lt; bestT − ε</text>
  <text x="42" y="186" font-size="12" fill="#2f4a66" filter="url(#rough2)">直接替换当前最优</text>
  <text x="42" y="210" font-size="11" fill="#4a6a88" filter="url(#rough2)">这是最主要的分支</text>
  <text x="42" y="246" font-size="11" fill="#4a6a88" filter="url(#rough2)">ε 用来吸收浮点误差</text>

  <!-- 卡片 2 -->
  <rect x="268" y="64" width="224" height="220" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="302" cy="98" r="17" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="302" y="104" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a6015" filter="url(#rough2)">2</text>
  <text x="332" y="104" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">时间相同</text>
  <text x="286" y="150" font-size="11.5" fill="#8a6015" filter="url(#rough2)">|tᵢ − bestT| ≤ ε</text>
  <text x="286" y="186" font-size="12" fill="#8a6015" filter="url(#rough2)">改比 dᵢ，更近者胜</text>
  <text x="286" y="210" font-size="11" fill="#7a5a1b" filter="url(#rough2)">题目明确：并列取离考场近的</text>
  <text x="286" y="246" font-size="11" fill="#7a5a1b" filter="url(#rough2)">dᵢ 用欧氏距离</text>

  <!-- 卡片 3 -->
  <rect x="512" y="64" width="224" height="220" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="546" cy="98" r="17" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="546" y="104" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f5223" filter="url(#rough2)">3</text>
  <text x="576" y="104" font-size="14" font-weight="bold" fill="#2f5223" filter="url(#rough2)">距离也相同</text>
  <text x="530" y="150" font-size="11.5" fill="#2f5223" filter="url(#rough2)">|dᵢ − bestD| ≤ ε</text>
  <text x="530" y="186" font-size="12" fill="#2f5223" filter="url(#rough2)">保留下标更小的</text>
  <text x="530" y="210" font-size="11" fill="#3c5e2e" filter="url(#rough2)">循环从小到大，天然保留</text>
  <text x="530" y="246" font-size="11" fill="#3c5e2e" filter="url(#rough2)">只有完全并列才走到这里</text>

  <!-- 底部例子 -->
  <rect x="24" y="302" width="712" height="116" rx="10" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="44" y="330" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">并列实例：两站时间都是 3.700，但距离不同</text>
  <text x="44" y="358" font-size="12" fill="#555" filter="url(#rough2)">站 x = 7：d = 15，t = 7/10 + 15/5 = 3.700</text>
  <text x="44" y="382" font-size="12" fill="#555" filter="url(#rough2)">站 x = 11：d = 13，t = 11/10 + 13/5 = 3.700</text>
  <text x="44" y="406" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">时间并列 → 选 d 更小的 x = 11 那一站</text>
  <text x="430" y="358" font-size="11.5" fill="#777" filter="url(#rough2)">考场在 (16, 12)，vb = 10，vs = 5</text>
  <text x="430" y="382" font-size="11.5" fill="#777" filter="url(#rough2)">若只按时间严格比较，可能因舍入</text>
  <text x="430" y="406" font-size="11.5" fill="#777" filter="url(#rough2)">把相等判成不等 → 加 ε 更稳</text>
</svg>
