<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="37"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="460" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">并查集：三个连通块，只有根记录「块大小」和「坏标记」</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <line x1="120.0" y1="128.0" x2="75.0" y2="208.0" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="120.0" y1="128.0" x2="165.0" y2="208.0" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="75.0" y1="208.0" x2="165.0" y2="208.0" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="320.0" y1="118.0" x2="410.0" y2="118.0" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="410.0" y1="118.0" x2="410.0" y2="208.0" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="410.0" y1="208.0" x2="320.0" y2="208.0" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="320.0" y1="208.0" x2="320.0" y2="118.0" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="580.0" y1="128.0" x2="580.0" y2="208.0" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="120.0" cy="128.0" r="18.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="120.0" y="132.7" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="75.0" cy="208.0" r="18.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="75.0" y="212.7" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <circle cx="165.0" cy="208.0" r="18.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="165.0" y="212.7" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <circle cx="580.0" cy="128.0" r="18.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="580.0" y="132.7" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
  <circle cx="580.0" cy="208.0" r="18.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="580.0" y="212.7" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5</text>
  <circle cx="320.0" cy="118.0" r="18.0" fill="#fde8e8" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="320.0" y="122.7" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">6</text>
  <circle cx="410.0" cy="118.0" r="18.0" fill="#fde8e8" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="410.0" y="122.7" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">7</text>
  <circle cx="410.0" cy="208.0" r="18.0" fill="#fde8e8" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="410.0" y="212.7" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">8</text>
  <circle cx="320.0" cy="208.0" r="18.0" fill="#fde8e8" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="320.0" y="212.7" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">9</text>
  <line x1="138.0" y1="120.0" x2="302.0" y2="114.0" stroke="#b85450" stroke-width="1.5" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="218.0" y="100.0" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">跨块，忽略</text>
  <line x1="400.0" y1="132.0" x2="332.0" y2="196.0" stroke="#b85450" stroke-width="1.5" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="418.0" y="164.0" text-anchor="start" font-size="11.5" fill="#b85450" filter="url(#rough2)">块内！</text>
  <text x="120.0" y="282.0" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">根 = 1，size = 3</text>
  <text x="365.0" y="282.0" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">根 = 6，size = 4，坏块</text>
  <text x="580.0" y="282.0" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">根 = 4，size = 2</text>
  <rect x="40.0" y="322.0" width="640.0" height="104.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="54.0" y="346.5" text-anchor="start" font-size="12.5" fill="#3f3420" filter="url(#rough2)">合并完朋友边后，每条讨厌边只需看两个端点是否同根</text>
  <text x="54.0" y="372.5" text-anchor="start" font-size="12.5" fill="#3f3420" filter="url(#rough2)">同根 → 把该根标记为坏块</text>
  <text x="54.0" y="398.5" text-anchor="start" font-size="12.5" fill="#3f3420" filter="url(#rough2)">最后扫描所有点，答案取未标记根的最大 size</text>
</svg>
