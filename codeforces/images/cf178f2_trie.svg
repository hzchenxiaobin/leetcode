<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="780" height="400" fill="#fafafa"/>
  <text x="390.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">前缀树：节点 p 的贡献是 C(选中数, 2)</text>
  <path d="M 212.37000000000003 46 Q 390.0 52 567.63 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="350.0" y="56.0" width="70.0" height="34.0" rx="6" fill="#fff3d6" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="385.0" y="78.0" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">root</text>
  <rect x="300.0" y="130.0" width="60.0" height="34.0" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="330.0" y="152.0" text-anchor="middle" font-size="10.2" fill="#26405c" filter="url(#rough2)">a (1)</text>
  <rect x="430.0" y="130.0" width="60.0" height="34.0" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="460.0" y="152.0" text-anchor="middle" font-size="10.2" fill="#26405c" filter="url(#rough2)">b (1)</text>
  <path d="M 370.0 90.0 L 340.0 128.0" stroke="#446688" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 400.0 90.0 L 452.0 128.0" stroke="#446688" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="240.0" y="210.0" width="76.0" height="34.0" rx="6" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="278.0" y="232.0" text-anchor="middle" font-size="10.2" fill="#2f5b34" filter="url(#rough2)">ab (3)</text>
  <path d="M 330.0 164.0 L 278.0 208.0" stroke="#446688" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="420.0" y="210.0" width="76.0" height="34.0" rx="6" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="458.0" y="232.0" text-anchor="middle" font-size="10.2" fill="#2f5b34" filter="url(#rough2)">ac (1)</text>
  <path d="M 330.0 164.0 L 458.0 208.0" stroke="#446688" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="560.0" y="210.0" width="76.0" height="34.0" rx="6" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="598.0" y="232.0" text-anchor="middle" font-size="10.2" fill="#2f5b34" filter="url(#rough2)">ba (2)</text>
  <path d="M 460.0 164.0 L 598.0 208.0" stroke="#446688" stroke-width="1.1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="240.0" y="268.0" text-anchor="start" font-size="10.6" fill="#6b6b6b" filter="url(#rough2)">括号里是子树里的串数</text>
  <rect x="60.0" y="292.0" width="660.0" height="90.0" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="316.0" text-anchor="start" font-size="11.2" fill="#8a6015" filter="url(#rough2)">选 k 个串 = 在树上给每个节点分配“落在它子树里的选中数” c_v，Σ over 叶子 = k。</text>
  <text x="74.0" y="338.0" text-anchor="start" font-size="11.2" fill="#8a6015" filter="url(#rough2)">总分 = Σ_{节点 v} C(c_v, 2)：每一对串在它们的 LCP 链上被数恰好 LCP 次。</text>
  <text x="74.0" y="360.0" text-anchor="start" font-size="11.2" fill="#8a6015" filter="url(#rough2)">DP：G[v][j] = 在 v 的子树里选 j 个的最大总分，对儿子做背包合并。</text>
</svg>
