<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="400" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按商分块：q = ⌊r/g⌋ 相同的 g 是一段连续区间</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">块内 cnt(g) 单调不减 ⇒ 只查块内最大的 g = ⌊r/q⌋</text>
  <text x="160" y="96" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">q</text>
  <text x="350" y="96" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">g 的区间</text>
  <text x="570" y="96" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">块内最大 g</text>
  <g filter="url(#rough2)"><line x1="120" y1="106" x2="680" y2="106" stroke="#c8a48a" stroke-width="1.1"/></g>
  <text x="160" y="132" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="350" y="132" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">[r/2+1, r]</text>
  <text x="570" y="132" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">r</text>
  <text x="160" y="164" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="350" y="164" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">[r/3+1, r/2]</text>
  <text x="570" y="164" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">r/2</text>
  <text x="160" y="196" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="350" y="196" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">[r/4+1, r/3]</text>
  <text x="570" y="196" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">r/3</text>
  <text x="160" y="228" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">…</text>
  <text x="350" y="228" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">…</text>
  <text x="570" y="228" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">…</text>
  <text x="160" y="260" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">q</text>
  <text x="350" y="260" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">[r/(q+1)+1, r/q]</text>
  <text x="570" y="260" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">r/q</text>
  <text x="420" y="300" text-anchor="middle" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">q 从 1 递增（g 递减），第一个 cnt(g) ≥ k 的块，其最大 g 就是 g*</text>
  <text x="420" y="328" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">块数 O(√r)：q ≤ √r 时逐块，之后每块只有一个 g</text>
  <g filter="url(#rough2)"><rect x="230" y="346" width="380" height="40" rx="4" fill="#faf3ec" fill-opacity="0.85" stroke="#c8a48a" stroke-width="1.3"/></g>
  <text x="420" y="372" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">复杂度 O(√r + log g)</text>
</svg>
