<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>

  <text x="360" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2：叶子顺序 5 6 3 的构造</text>
  <path d="M 180 40 Q 360 46 540 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <g stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)">
    <line x1="300" y1="80" x2="160" y2="150"/><line x1="300" y1="80" x2="490" y2="150"/>
    <line x1="160" y1="165" x2="160" y2="225"/>
    <line x1="160" y1="240" x2="80" y2="305"/><line x1="160" y1="240" x2="240" y2="305"/>
  </g>
  <g filter="url(#rough2)">
    <circle cx="300" cy="72" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="160" cy="158" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="490" cy="158" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="160" cy="232" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="75" cy="315" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <circle cx="245" cy="315" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
  </g>
  <g font-size="11" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">
    <text x="300" y="76">1</text><text x="160" y="162">2</text><text x="490" y="162">3</text>
    <text x="160" y="236">4</text><text x="75" y="319">5</text><text x="245" y="319">6</text>
  </g>

  <text x="360" y="200" text-anchor="middle" font-size="10.5" fill="#2f5223" filter="url(#rough2)">子树 2 的叶子 {5,6} 连续</text>
  <text x="540" y="130" font-size="10.5" fill="#2f5223" filter="url(#rough2)">叶子 3</text>

  <rect x="330" y="220" width="350" height="80" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="346" y="246" font-size="11.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">孩子顺序（按最左叶子位置）</text>
  <text x="346" y="270" font-size="11" fill="#2f5223" filter="url(#rough2)">根：先 2（叶子 5,6）后 3（叶子 3）</text>
  <text x="346" y="290" font-size="11" fill="#2f5223" filter="url(#rough2)">节点 2：先 4（叶子 5,6）</text>

  <rect x="40" y="318" width="640" height="94" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <g font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">
    <text x="56" y="344">输出路线：1 2 4 5 4 6 4 2 1 3 1（共 2n−1 = 11 个顶点）。</text>
    <text x="56" y="370">验证：每条边恰好走两次；叶子首次出现的顺序是 5、6、3，与输入一致。</text>
    <text x="56" y="396">若输入顺序是 5 3 6，则子树 2 的叶子位置不连续，直接输出 -1（样例 3）。</text>
  </g>
</svg>
