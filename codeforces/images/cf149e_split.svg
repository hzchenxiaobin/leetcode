<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="421"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="280" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">拆分点 k：前缀最早结束 &lt; 后缀最晚开始</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">两个极值都来自 KMP，第二个靠反转串求</text>
  <g filter="url(#rough2)"><rect x="60" y="96" width="780" height="60" rx="6" fill="#cfe0f5" fill-opacity="0.4" stroke="#446688" stroke-width="1.4"/></g>
  <text x="450" y="128" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">p = p[0..k−1]　+　p[k..|p|−1]</text>
  <g filter="url(#rough2)"><rect x="80" y="180" width="360" height="66" rx="6" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="260" y="208" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">pre[k]：前缀的最小结束下标</text>
  <text x="260" y="232" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">（KMP 扫描 s）</text>
  <g filter="url(#rough2)"><rect x="480" y="180" width="360" height="66" rx="6" fill="#f3d9d6" fill-opacity="0.85" stroke="#8a2b28" stroke-width="1.4"/></g>
  <text x="660" y="208" text-anchor="middle" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">suf[j]：后缀的最大开始下标</text>
  <text x="660" y="232" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">（反转串上做同样的 KMP）</text>
  <text x="450" y="268" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">可见 ⟺ 存在 k 使 pre[k] &lt; suf[|p|−k]</text>
</svg>
