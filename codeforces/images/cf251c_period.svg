<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="400" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">平移一整个周期 L，代价是常数 C</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">L = lcm(2..k) ≤ 360360；f(v+L) = f(v) + C 对 v ≥ b+2L 成立</text>
  <line x1="90" y1="300" x2="820" y2="300" stroke="#8899aa" stroke-width="1.3" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="120" y="120" width="80" height="50" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="160.0" y="150.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">L</text>
  <text x="160" y="196" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">起点 b</text>
  <g filter="url(#rough2)"><rect x="280" y="120" width="80" height="50" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="320.0" y="150.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">L</text>
  <text x="320" y="196" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">平移 1 个周期</text>
  <g filter="url(#rough2)"><rect x="440" y="120" width="80" height="50" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="480.0" y="150.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">L</text>
  <text x="480" y="196" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">平移 2 个周期</text>
  <g filter="url(#rough2)"><rect x="600" y="120" width="80" height="50" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="640.0" y="150.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">L</text>
  <text x="640" y="196" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">平移 3 个周期</text>
  <g filter="url(#rough2)"><rect x="760" y="120" width="80" height="50" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="800.0" y="150.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">L</text>
  <text x="800" y="196" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">平移 4 个周期</text>
  <line x1="200" y1="145" x2="278" y2="145" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="240" y="112" text-anchor="middle" font-size="11.5" fill="#b05a5a" filter="url(#rough2)">+C</text>
  <line x1="360" y1="145" x2="438" y2="145" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="400" y="112" text-anchor="middle" font-size="11.5" fill="#b05a5a" filter="url(#rough2)">+C</text>
  <line x1="520" y1="145" x2="598" y2="145" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="560" y="112" text-anchor="middle" font-size="11.5" fill="#b05a5a" filter="url(#rough2)">+C</text>
  <line x1="680" y1="145" x2="758" y2="145" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="720" y="112" text-anchor="middle" font-size="11.5" fill="#b05a5a" filter="url(#rough2)">+C</text>
  <text x="440" y="246" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">所以只需把 [b, b+3L] 的 dp 全部算出来，把 a 写成 b + 2L + qL + r</text>
  <text x="440" y="276" text-anchor="middle" font-size="13.5" fill="#3d6b2f" filter="url(#rough2)">答案就是 dp[2L+r] + q·C，其中 C = dp[2L] - dp[L]</text>
  <text x="440" y="352" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">计算量：3L·k ≈ 360360×3×14 ≈ 1.5×10^7，之后每个询问 O(1)</text>
  <text x="440" y="380" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">a 高达 10^18 也只需一次除法取余，不会逐秒模拟</text>
</svg>
