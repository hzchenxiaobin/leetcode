<svg xmlns="http://www.w3.org/2000/svg" width="740" height="400" viewBox="0 0 740 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="113"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="740" height="400" fill="#fafafa"/>
  <text x="370" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">总量守恒定出唯一水位 x，再逐杯补到 x</text>
  <path d="M 180 46 Q 370 52 560 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="70" y="306" width="44" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="70" y="138" width="44" height="168" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="92" y="340" text-anchor="middle" font-size="10" font-weight="normal" fill="#555" filter="url(#rough2)">a1=1</text>
  <text x="92" y="130" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">+12</text>
  <rect x="132" y="292" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="132" y="138" width="44" height="154" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="154" y="340" text-anchor="middle" font-size="10" font-weight="normal" fill="#555" filter="url(#rough2)">a2=2</text>
  <text x="154" y="130" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">+11</text>
  <rect x="194" y="278" width="44" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="194" y="138" width="44" height="140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="216" y="340" text-anchor="middle" font-size="10" font-weight="normal" fill="#555" filter="url(#rough2)">a3=3</text>
  <text x="216" y="130" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">+10</text>
  <rect x="256" y="264" width="44" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="256" y="138" width="44" height="126" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="278" y="340" text-anchor="middle" font-size="10" font-weight="normal" fill="#555" filter="url(#rough2)">a4=4</text>
  <text x="278" y="130" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">+9</text>
  <rect x="318" y="250" width="44" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="318" y="138" width="44" height="112" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="340" y="340" text-anchor="middle" font-size="10" font-weight="normal" fill="#555" filter="url(#rough2)">a5=5</text>
  <text x="340" y="130" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">+8</text>
  <line x1="50" y1="138" x2="420" y2="138" stroke="#b85450" stroke-width="1.5" stroke-dasharray="7 4" filter="url(#rough2)"/>
  <text x="430" y="142" text-anchor="start" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">x = 13</text>
  <line x1="50" y1="320" x2="420" y2="320" stroke="#2b2b2b" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="60" y="66" width="360" height="76" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="92" text-anchor="start" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">x = (Σa_i + b) / n</text>
  <text x="76" y="114" text-anchor="start" font-size="11.5" font-weight="normal" fill="#446688" filter="url(#rough2)">样例 1：(15 + 50) / 5 = 13</text>
  <text x="76" y="132" text-anchor="start" font-size="11.5" font-weight="normal" fill="#446688" filter="url(#rough2)">各杯补 x − a_i，总量正好是 b</text>
  <rect x="450" y="66" width="240" height="76" rx="10" fill="#fdecea" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="466" y="92" text-anchor="start" font-size="12.5" font-weight="bold" fill="#8c3a36" filter="url(#rough2)">无解条件：x &lt; max a_i</text>
  <text x="466" y="114" text-anchor="start" font-size="11.5" font-weight="normal" fill="#8c3a36" filter="url(#rough2)">样例 2：x = 51.5 &lt; 100</text>
  <text x="466" y="132" text-anchor="start" font-size="11.5" font-weight="normal" fill="#8c3a36" filter="url(#rough2)">杯子只能加不能减 → -1</text>
  <text x="60" y="366" text-anchor="start" font-size="11.5" font-weight="normal" fill="#555" filter="url(#rough2)">蓝色 = 杯里原有的；黄色虚线 = 这次要倒进去的。</text>
</svg>
