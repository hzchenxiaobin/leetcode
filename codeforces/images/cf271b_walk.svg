<svg xmlns="http://www.w3.org/2000/svg" width="880" height="260" viewBox="0 0 880 260"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="260" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例：1 / 3 / 0</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">行与列各算一遍取最小</text>
  <text x="150" y="110" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">样例 1：把 (1,1) 的 1 加 1 次变 2 → 第一行全质数</text>
  <text x="150" y="150" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">样例 2：把 8 加 3 次变 11 → 第二列全质数</text>
  <text x="150" y="190" text-anchor="start" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">样例 3：第二列已是 3,2 → 0</text>
</svg>
