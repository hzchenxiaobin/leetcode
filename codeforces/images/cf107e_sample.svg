<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 338" width="640" height="338">
<defs>
<filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="13" result="noise"/>
<feDisplacementMap in="SourceGraphic" in2="noise" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect x="0" y="0" width="640" height="338" fill="#fafafa"/>
<g font-family="Comic Sans MS, Kaiti SC, cursive">
<text x="320.0" y="24.0" font-size="15" fill="#33475b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">样例 4：两个菱形，总面积 4，并集面积 3.5</text>
<polygon points="240.0,60.0 330.0,150.0 240.0,240.0 150.0,150.0" fill="#cfe3d4" stroke="#4f7f60" stroke-width="1.8" filter="url(#rough2)"/>
<polygon points="330.0,60.0 420.0,150.0 330.0,240.0 240.0,150.0" fill="#f6d9b0" stroke="#a08050" stroke-width="1.8" filter="url(#rough2)"/>
<text x="240.0" y="60.0" font-size="12" fill="#3f6b4f" text-anchor="middle" font-weight="normal" filter="url(#rough2)">R1：面积 2</text>
<text x="340.0" y="60.0" font-size="12" fill="#7a5c2e" text-anchor="middle" font-weight="normal" filter="url(#rough2)">R2：面积 2</text>
<line x1="240.0" y1="240.0" x2="240.0" y2="270.0" stroke="#c0392b" stroke-width="1.3" filter="url(#rough2)"/>
<line x1="330.0" y1="240.0" x2="330.0" y2="270.0" stroke="#c0392b" stroke-width="1.3" filter="url(#rough2)"/>
<text x="320.0" y="268.0" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">重叠部分（菱形交叉）面积 0.5</text>
<text x="320.0" y="296.0" font-size="13" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">并集 = 2 + 2 − 0.5 = 3.5</text>
<text x="320.0" y="322.0" font-size="14" fill="#7a5c2e" text-anchor="middle" font-weight="bold" filter="url(#rough2)">E = 4 / 3.5 = 8/7 = 1.1428571429</text>
</g>
</svg>
