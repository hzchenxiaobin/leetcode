<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="861"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="270" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">把 a₂ 的数字反转后与 a₁ 相加</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">反转时前导零被丢弃</text>
  <g filter="url(#rough2)"><rect x="70" y="100" width="160" height="34" rx="4" fill="#ffffff" fill-opacity="0.35" stroke="#446688" stroke-width="1.4"/></g>
  <text x="150" y="122" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">3 14</text>
  <text x="300" y="122" text-anchor="start" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">rev = 41</text>
  <text x="470" y="122" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">3 + 41 = 44</text>
  <g filter="url(#rough2)"><rect x="70" y="148" width="160" height="34" rx="4" fill="#ffffff" fill-opacity="0.35" stroke="#446688" stroke-width="1.4"/></g>
  <text x="150" y="170" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">27 12</text>
  <text x="300" y="170" text-anchor="start" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">rev = 21</text>
  <text x="470" y="170" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">27 + 21 = 48</text>
  <g filter="url(#rough2)"><rect x="70" y="196" width="160" height="34" rx="4" fill="#ffffff" fill-opacity="0.35" stroke="#446688" stroke-width="1.4"/></g>
  <text x="150" y="218" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">100 200</text>
  <text x="300" y="218" text-anchor="start" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">rev = 2</text>
  <text x="470" y="218" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">100 + 2 = 102</text>
  <text x="450" y="252" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">三组样例唯一吻合的简单法则</text>
</svg>
