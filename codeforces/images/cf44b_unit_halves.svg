<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="ad" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>

  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">把容量乘以 2：0.5 / 1 / 2 升 → 1 / 2 / 4 个单位</text>
  <path d="M 130 44 Q 360 50 590 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 三种瓶子 -->
  <g filter="url(#rough2)">
    <!-- 0.5 L -->
    <rect x="86" y="96" width="68" height="88" rx="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="112" y="74" width="16" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="120" y="146" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66">0.5 L</text>
    <text x="120" y="166" text-anchor="middle" font-size="11" fill="#2f4a66">共 a 瓶</text>
    <path d="M 120 196 L 120 224" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#ad)"/>
    <text x="120" y="248" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5223">1 个单位</text>
    <text x="120" y="270" text-anchor="middle" font-size="11.5" fill="#3c5e2e">数量记作 i</text>

    <!-- 1 L -->
    <rect x="306" y="96" width="68" height="88" rx="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="332" y="74" width="16" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="340" y="146" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5223">1 L</text>
    <text x="340" y="166" text-anchor="middle" font-size="11" fill="#2f5223">共 b 瓶</text>
    <path d="M 340 196 L 340 224" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#ad)"/>
    <text x="340" y="248" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5223">2 个单位</text>
    <text x="340" y="270" text-anchor="middle" font-size="11.5" fill="#3c5e2e">数量记作 j</text>

    <!-- 2 L -->
    <rect x="526" y="96" width="68" height="88" rx="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="552" y="74" width="16" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="560" y="146" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6015">2 L</text>
    <text x="560" y="166" text-anchor="middle" font-size="11" fill="#8a6015">共 c 瓶</text>
    <path d="M 560 196 L 560 224" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#ad)"/>
    <text x="560" y="248" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5223">4 个单位</text>
    <text x="560" y="270" text-anchor="middle" font-size="11.5" fill="#3c5e2e">数量记作 k</text>
  </g>

  <rect x="60" y="296" width="600" height="72" rx="12" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="326" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">目标：i + 2j + 4k = 2n　（0 ≤ i ≤ a，0 ≤ j ≤ b，0 ≤ k ≤ c）</text>
  <text x="360" y="352" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">系数 1、2、4 全部是整数，再没有 0.5，也没有浮点比较</text>
</svg>
