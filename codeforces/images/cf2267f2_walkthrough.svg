<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15.5" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：a = [6, 7, 8, 9, 15]，n = 5</text>
  <text x="310" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每行是「再做一次变换」后的数组；最右列即查询 x 的答案</text>

  <rect x="60" y="66" width="500" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="92" y="85" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">x</text>
  <text x="270" y="85" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">变换后的数组 b（已排序）</text>
  <text x="480" y="85" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">max − min</text>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <rect x="60" y="98" width="500" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="92" y="118" fill="#555">0</text>
    <text x="160" y="118" fill="#333">6</text>
    <text x="220" y="118" fill="#333">7</text>
    <text x="280" y="118" fill="#333">8</text>
    <text x="340" y="118" fill="#333">9</text>
    <text x="400" y="118" fill="#333">15</text>
    <rect x="440" y="102" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="5"/>
    <text x="480" y="118" fill="#3a5a30" font-weight="bold">9</text>

    <rect x="60" y="130" width="500" height="30" fill="#f7f7f7" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="92" y="150" fill="#555">1</text>
    <text x="160" y="150" fill="#333">1</text>
    <text x="220" y="150" fill="#333">1</text>
    <text x="280" y="150" fill="#333">6</text>
    <text x="340" y="150" fill="#333">7</text>
    <text x="400" y="150" fill="#333">8</text>
    <rect x="440" y="134" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="5"/>
    <text x="480" y="150" fill="#3a5a30" font-weight="bold">7</text>

    <rect x="60" y="162" width="500" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="92" y="182" fill="#555">2</text>
    <text x="160" y="182" fill="#333">0</text>
    <text x="220" y="182" fill="#333">1</text>
    <text x="280" y="182" fill="#333">6</text>
    <text x="340" y="182" fill="#333">6</text>
    <text x="400" y="182" fill="#333">7</text>
    <rect x="440" y="166" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="5"/>
    <text x="480" y="182" fill="#3a5a30" font-weight="bold">7</text>

    <rect x="60" y="194" width="500" height="30" fill="#f7f7f7" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="92" y="214" fill="#555">3</text>
    <text x="160" y="214" fill="#333">0</text>
    <text x="220" y="214" fill="#333">1</text>
    <text x="280" y="214" fill="#333">1</text>
    <text x="340" y="214" fill="#333">1</text>
    <text x="400" y="214" fill="#333">6</text>
    <rect x="440" y="198" width="80" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="5"/>
    <text x="480" y="214" fill="#8a6a20" font-weight="bold">6</text>

    <rect x="60" y="226" width="500" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="92" y="246" fill="#555">4</text>
    <text x="160" y="246" fill="#333">0</text>
    <text x="220" y="246" fill="#333">0</text>
    <text x="280" y="246" fill="#333">0</text>
    <text x="340" y="246" fill="#333">1</text>
    <text x="400" y="246" fill="#333">1</text>
    <rect x="440" y="230" width="80" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="5"/>
    <text x="480" y="246" fill="#8a6a20" font-weight="bold">1</text>

    <rect x="60" y="258" width="500" height="30" fill="#f7f7f7" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="92" y="278" fill="#555">5</text>
    <text x="160" y="278" fill="#333">0</text>
    <text x="220" y="278" fill="#333">0</text>
    <text x="280" y="278" fill="#333">0</text>
    <text x="340" y="278" fill="#333">1</text>
    <text x="400" y="278" fill="#333">1</text>
    <rect x="440" y="262" width="80" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="5"/>
    <text x="480" y="278" fill="#8a6a20" font-weight="bold">1</text>

    <rect x="60" y="290" width="500" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="92" y="310" fill="#555">6</text>
    <text x="160" y="310" fill="#333">0</text>
    <text x="220" y="310" fill="#333">0</text>
    <text x="280" y="310" fill="#333">0</text>
    <text x="340" y="310" fill="#333">0</text>
    <text x="400" y="310" fill="#333">1</text>
    <rect x="440" y="294" width="80" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="5"/>
    <text x="480" y="310" fill="#8a6a20" font-weight="bold">1</text>

    <rect x="60" y="322" width="500" height="30" fill="#f7f7f7" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="92" y="342" fill="#555">7</text>
    <text x="160" y="342" fill="#333">0</text>
    <text x="220" y="342" fill="#333">0</text>
    <text x="280" y="342" fill="#333">0</text>
    <text x="340" y="342" fill="#333">0</text>
    <text x="400" y="342" fill="#333">0</text>
    <rect x="440" y="326" width="80" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="5"/>
    <text x="480" y="342" fill="#8a3a36" font-weight="bold">0</text>
  </g>

  <rect x="60" y="366" width="500" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="76" y="386" font-size="10" fill="#3a5a30" filter="url(#rough2)">x = 4 与 x = 5 的数组完全相同（[0,0,0,1,1] 是变换的不动点），</text>
  <text x="76" y="404" font-size="10" fill="#555" filter="url(#rough2)">所以答案在若干步后会「稳定」，一旦全相等就永远为 0；x ≥ 7 一律输出 0。</text>
</svg>
