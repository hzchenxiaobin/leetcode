<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320" viewBox="0 0 700 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1271"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="700" height="320" fill="#fafafa"/>
  <text x="350.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">签名折线与总路程</text>
  <path d="M 112.0 42 Q 350.0 48 588.0 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="350.0" y="306" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">时间 = 路程 / 50 × k</text>
  <path d="M 100 250 L 220 120 L 330 200 L 450 80 L 560 170" stroke="#4a7a3a" stroke-width="2.4" fill="none" filter="url(#rough2)"/>
  <circle cx="100" cy="250" r="5" fill="#b85450" filter="url(#rough2)"/>
  <text x="100" y="238" text-anchor="middle" font-size="10.5" fill="#8c2f2c" filter="url(#rough2)">A1</text>
  <circle cx="220" cy="120" r="5" fill="#b85450" filter="url(#rough2)"/>
  <text x="220" y="108" text-anchor="middle" font-size="10.5" fill="#8c2f2c" filter="url(#rough2)">A2</text>
  <circle cx="330" cy="200" r="5" fill="#b85450" filter="url(#rough2)"/>
  <text x="330" y="188" text-anchor="middle" font-size="10.5" fill="#8c2f2c" filter="url(#rough2)">A3</text>
  <circle cx="450" cy="80" r="5" fill="#b85450" filter="url(#rough2)"/>
  <text x="450" y="68" text-anchor="middle" font-size="10.5" fill="#8c2f2c" filter="url(#rough2)">A4</text>
  <circle cx="560" cy="170" r="5" fill="#b85450" filter="url(#rough2)"/>
  <text x="560" y="158" text-anchor="middle" font-size="10.5" fill="#8c2f2c" filter="url(#rough2)">A5</text>
  <text x="350" y="300" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">相邻点距离求和；自交、重叠都不影响"走过的路程"</text>
</svg>
