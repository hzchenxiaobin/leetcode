<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="127"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="320" fill="#fafafa"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法只有三步：求和、定水位、判可行</text>
  <path d="M 170 46 Q 360 52 550 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="40" y="100" width="170" height="62" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="125.0" y="126" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">读入 n, b, a[]</text>
  <text x="125.0" y="147" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555" filter="url(#rough2)">S ← Σa_i，mx ← max a_i</text>
  <rect x="250" y="100" width="170" height="62" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="335.0" y="126" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">定水位</text>
  <text x="335.0" y="147" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555" filter="url(#rough2)">x ← (S + b) / n</text>
  <rect x="460" y="100" width="200" height="62" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="560.0" y="126" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">x ≥ mx ?</text>
  <text x="560.0" y="147" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555" filter="url(#rough2)">否 → 输出 -1；是 → 输出 x−a_i</text>
  <line x1="212" y1="131" x2="248" y2="131" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <line x1="422" y1="131" x2="458" y2="131" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="60" y="210" width="600" height="76" rx="10" fill="#f3e8fb" stroke="#7a4a9a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="76" y="236" text-anchor="start" font-size="11.5" font-weight="bold" fill="#5a3075" filter="url(#rough2)">为什么可行？Σ(x − a_i) = n·x − S = (S + b) − S = b，瓶子正好倒空；</text>
  <text x="76" y="258" text-anchor="start" font-size="11.5" font-weight="normal" fill="#5a3075" filter="url(#rough2)">又因为 x ≥ mx 保证每杯的添加量非负，所以方案一定合法。</text>
  <text x="76" y="278" text-anchor="start" font-size="11.5" font-weight="normal" fill="#5a3075" filter="url(#rough2)">而“最终体积为 x”是被总量守恒唯一确定的，故方案唯一。</text>
</svg>
