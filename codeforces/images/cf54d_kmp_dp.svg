<svg xmlns="http://www.w3.org/2000/svg" width="740" height="430" viewBox="0 0 740 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="740" height="430" fill="#fafafa"/>
  <text x="370.0" y="36" font-size="20" fill="#2b2b2b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">把「出现约束」变成自动机上的可行路径</text>
  <path d="M 118 46 Q 370 52 622 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="84" font-size="13" fill="#2f4a66" text-anchor="start" font-weight="bold" filter="url(#rough2)">P = aba 的自动机（状态 = 已匹配的最长前缀长度）</text>
  <rect x="45" y="100" width="90" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="90" y="129" font-size="14" fill="#2f4a66" text-anchor="middle" font-weight="bold" filter="url(#rough2)">s=0</text>
  <rect x="205" y="100" width="90" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="250" y="129" font-size="14" fill="#2f4a66" text-anchor="middle" font-weight="bold" filter="url(#rough2)">s=1</text>
  <rect x="365" y="100" width="90" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="410" y="129" font-size="14" fill="#2f4a66" text-anchor="middle" font-weight="bold" filter="url(#rough2)">s=2</text>
  <rect x="525" y="100" width="90" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="570" y="129" font-size="14" fill="#2f4a66" text-anchor="middle" font-weight="bold" filter="url(#rough2)">s=3</text>
  <text x="570" y="170" font-size="10.5" fill="#2f5223" text-anchor="middle" filter="url(#rough2)">等于 |P| ⇒ 出现一次</text>
  <line x1="135.0" y1="123.0" x2="205.0" y2="123.0" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb2)" filter="url(#rough2)"/>
  <text x="170.0" y="114" font-size="12" fill="#2f4a66" text-anchor="middle" font-weight="bold" filter="url(#rough2)">a</text>
  <line x1="295.0" y1="123.0" x2="365.0" y2="123.0" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb2)" filter="url(#rough2)"/>
  <text x="330.0" y="114" font-size="12" fill="#2f4a66" text-anchor="middle" font-weight="bold" filter="url(#rough2)">b</text>
  <line x1="455.0" y1="123.0" x2="525.0" y2="123.0" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb2)" filter="url(#rough2)"/>
  <text x="490.0" y="114" font-size="12" fill="#2f4a66" text-anchor="middle" font-weight="bold" filter="url(#rough2)">a</text>
  <path d="M 570 132 C 560 190 260 200 250 152" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="6 4" marker-end="url(#arrr2)" filter="url(#rough2)"/>
  <text x="410" y="196" font-size="10.5" fill="#8a3030" text-anchor="middle" filter="url(#rough2)">出现后回退到 pi[|P|-1]（继续找重叠出现）</text>
  <rect x="60" y="214" width="620" height="86" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="78" y="240" font-size="12.5" fill="#8a6015" text-anchor="start" font-weight="bold" filter="url(#rough2)">当某次出现结束时，它的起点是 i − |P| + 1：</text>
  <text x="78" y="266" font-size="12" fill="#7a5a1b" text-anchor="start" filter="url(#rough2)">b[start] = 1 → 允许，状态回退后继续</text>
  <text x="78" y="288" font-size="12" fill="#7a5a1b" text-anchor="start" filter="url(#rough2)">b[start] = 0 → 这条转移非法（不能在这里出现）</text>
  <rect x="60" y="312" width="620" height="96" rx="10" fill="#f2f6fb" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="78" y="338" font-size="12.5" fill="#2f4a66" text-anchor="start" font-weight="bold" filter="url(#rough2)">dp[i][s] = 前 i 个字符已填、当前匹配长度为 s 是否可达</text>
  <text x="78" y="362" font-size="12" fill="#44546a" text-anchor="start" filter="url(#rough2)">转移：按位置 i 允许的字母（固定则只有 1 种，否则 K 种）走自动机</text>
  <text x="78" y="386" font-size="12" fill="#44546a" text-anchor="start" filter="url(#rough2)">终态：第 N 层任一可达状态即可回溯；全都不可达 ⇒ No solution</text>
</svg>
