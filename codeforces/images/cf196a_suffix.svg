<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="320" fill="#fafafa"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">196A：取“后缀最大值”出现的那些字符</text>
  <path d="M 210.70000000000002 46 Q 380.0 52 549.3 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="70.0" y="80.0" width="70.0" height="50.0" rx="6" fill="#fafafa" stroke="#6b6b6b" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="105.0" y="112.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#6b6b6b" filter="url(#rough2)">a</text>
  <text x="105.0" y="150.0" text-anchor="middle" font-size="9.6" fill="#6b6b6b" filter="url(#rough2)">后缀最大 b</text>
  <rect x="150.0" y="80.0" width="70.0" height="50.0" rx="6" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="185.0" y="112.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5b34" filter="url(#rough2)">b</text>
  <text x="185.0" y="150.0" text-anchor="middle" font-size="9.6" fill="#6b6b6b" filter="url(#rough2)">后缀最大 b</text>
  <text x="185.0" y="172.0" text-anchor="middle" font-size="10.2" font-weight="bold" fill="#5b8c5a" filter="url(#rough2)">保留</text>
  <rect x="230.0" y="80.0" width="70.0" height="50.0" rx="6" fill="#fafafa" stroke="#6b6b6b" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="265.0" y="112.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#6b6b6b" filter="url(#rough2)">a</text>
  <text x="265.0" y="150.0" text-anchor="middle" font-size="9.6" fill="#6b6b6b" filter="url(#rough2)">后缀最大 b</text>
  <rect x="310.0" y="80.0" width="70.0" height="50.0" rx="6" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="345.0" y="112.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5b34" filter="url(#rough2)">b</text>
  <text x="345.0" y="150.0" text-anchor="middle" font-size="9.6" fill="#6b6b6b" filter="url(#rough2)">后缀最大 b</text>
  <text x="345.0" y="172.0" text-anchor="middle" font-size="10.2" font-weight="bold" fill="#5b8c5a" filter="url(#rough2)">保留</text>
  <rect x="390.0" y="80.0" width="70.0" height="50.0" rx="6" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="425.0" y="112.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5b34" filter="url(#rough2)">b</text>
  <text x="425.0" y="150.0" text-anchor="middle" font-size="9.6" fill="#6b6b6b" filter="url(#rough2)">后缀最大 b</text>
  <text x="425.0" y="172.0" text-anchor="middle" font-size="10.2" font-weight="bold" fill="#5b8c5a" filter="url(#rough2)">保留</text>
  <rect x="470.0" y="80.0" width="70.0" height="50.0" rx="6" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="505.0" y="112.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5b34" filter="url(#rough2)">a</text>
  <text x="505.0" y="150.0" text-anchor="middle" font-size="9.6" fill="#6b6b6b" filter="url(#rough2)">后缀最大 a</text>
  <text x="505.0" y="172.0" text-anchor="middle" font-size="10.2" font-weight="bold" fill="#5b8c5a" filter="url(#rough2)">保留</text>
  <rect x="60.0" y="200.0" width="640.0" height="50.0" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="224.0" text-anchor="start" font-size="10.9" fill="#8a6015" filter="url(#rough2)">贪心：第一个字符取整个串的最大字符 b，之后同样处理剩余后缀 ⇒ 保留第 2、4、5 个 b 与最后的 a。</text>
  <text x="74.0" y="244.0" text-anchor="start" font-size="10.9" fill="#8a6015" filter="url(#rough2)">结果是 bbba —— 恰好等于样例输出。</text>
  <rect x="60.0" y="262.0" width="640.0" height="44.0" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="74.0" y="288.0" text-anchor="start" font-size="10.9" fill="#33506e" filter="url(#rough2)">实现：从右往左算后缀最大值 suf[i]，再从左往右把 s[i] == suf[i] 的字符接起来，O(n)。</text>
</svg>
