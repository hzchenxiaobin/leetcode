<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="440" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="17" fill="#333"
        filter="url(#rough2)">样例 1 走查：n = 4，k = 3，h = (1, 5, 2, 8)</text>
  <text x="380" y="52" text-anchor="middle" font-size="11.5" fill="#666"
        filter="url(#rough2)">a_i 取两侧所有锥的最大值；土 = a_i − h_i，合计 ≤ k 则 X 可行</text>

  <!-- 左：X = 5 可行 -->
  <rect x="24" y="72" width="346" height="212" rx="10" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="197" y="96" text-anchor="middle" font-size="13" fill="#2f5a24"
        filter="url(#rough2)">X = 5 ⇒ 可行</text>
  <text x="91" y="116" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">段 1</text>
  <text x="161" y="116" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">段 2</text>
  <text x="231" y="116" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">段 3</text>
  <text x="301" y="116" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">段 4</text>

  <text x="40" y="146" font-size="10.5" fill="#2c4a6b" filter="url(#rough2)">h</text>
  <rect x="60" y="126" width="62" height="26" rx="4" fill="#ffffff" stroke="#446688"
        stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="130" y="126" width="62" height="26" rx="4" fill="#ffffff" stroke="#446688"
        stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="200" y="126" width="62" height="26" rx="4" fill="#ffffff" stroke="#446688"
        stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="270" y="126" width="62" height="26" rx="4" fill="#ffffff" stroke="#446688"
        stroke-width="1.2" filter="url(#rough2)"/>
  <text x="91" y="145" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="161" y="145" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="231" y="145" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="301" y="145" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">8</text>

  <text x="40" y="178" font-size="10.5" fill="#2f5a24" filter="url(#rough2)">a</text>
  <rect x="60" y="158" width="62" height="26" rx="4" fill="#d8efd9" stroke="#4a7a3a"
        stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="130" y="158" width="62" height="26" rx="4" fill="#ffffff" stroke="#4a7a3a"
        stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="200" y="158" width="62" height="26" rx="4" fill="#d8efd9" stroke="#4a7a3a"
        stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="270" y="158" width="62" height="26" rx="4" fill="#ffffff" stroke="#4a7a3a"
        stroke-width="1.2" filter="url(#rough2)"/>
  <text x="91" y="177" text-anchor="middle" font-size="11.5" fill="#2f5a24" filter="url(#rough2)">3</text>
  <text x="161" y="177" text-anchor="middle" font-size="11.5" fill="#2f5a24" filter="url(#rough2)">5</text>
  <text x="231" y="177" text-anchor="middle" font-size="11.5" fill="#2f5a24" filter="url(#rough2)">3</text>
  <text x="301" y="177" text-anchor="middle" font-size="11.5" fill="#2f5a24" filter="url(#rough2)">8</text>

  <text x="40" y="210" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">土</text>
  <text x="91" y="210" text-anchor="middle" font-size="11.5" fill="#8a5a00" filter="url(#rough2)">2</text>
  <text x="161" y="210" text-anchor="middle" font-size="11.5" fill="#8a5a00" filter="url(#rough2)">0</text>
  <text x="231" y="210" text-anchor="middle" font-size="11.5" fill="#8a5a00" filter="url(#rough2)">1</text>
  <text x="301" y="210" text-anchor="middle" font-size="11.5" fill="#8a5a00" filter="url(#rough2)">0</text>

  <text x="197" y="240" text-anchor="middle" font-size="11.5" fill="#2f5a24"
        filter="url(#rough2)">合计 2 + 0 + 1 + 0 = 3 ≤ k ✓</text>
  <text x="197" y="264" text-anchor="middle" font-size="10.5" fill="#555"
        filter="url(#rough2)">段 1、3 的 3 都来自 h₄ = 8 绕 1 步的锥</text>

  <!-- 右：X = 4 不可行 -->
  <rect x="390" y="72" width="346" height="212" rx="10" fill="#fce4ec"
        stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="563" y="96" text-anchor="middle" font-size="13" fill="#8a3a36"
        filter="url(#rough2)">X = 4 ⇒ 不可行</text>
  <text x="457" y="116" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">段 1</text>
  <text x="527" y="116" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">段 2</text>
  <text x="597" y="116" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">段 3</text>
  <text x="667" y="116" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">段 4</text>

  <text x="406" y="146" font-size="10.5" fill="#2c4a6b" filter="url(#rough2)">h</text>
  <rect x="426" y="126" width="62" height="26" rx="4" fill="#ffffff" stroke="#446688"
        stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="496" y="126" width="62" height="26" rx="4" fill="#ffffff" stroke="#446688"
        stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="566" y="126" width="62" height="26" rx="4" fill="#ffffff" stroke="#446688"
        stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="636" y="126" width="62" height="26" rx="4" fill="#ffffff" stroke="#446688"
        stroke-width="1.2" filter="url(#rough2)"/>
  <text x="457" y="145" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="527" y="145" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="597" y="145" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="667" y="145" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">8</text>

  <text x="406" y="178" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">a</text>
  <rect x="426" y="158" width="62" height="26" rx="4" fill="#f7cdd6" stroke="#b85450"
        stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="496" y="158" width="62" height="26" rx="4" fill="#ffffff" stroke="#b85450"
        stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="566" y="158" width="62" height="26" rx="4" fill="#f7cdd6" stroke="#b85450"
        stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="636" y="158" width="62" height="26" rx="4" fill="#ffffff" stroke="#b85450"
        stroke-width="1.2" filter="url(#rough2)"/>
  <text x="457" y="177" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">4</text>
  <text x="527" y="177" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">5</text>
  <text x="597" y="177" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">4</text>
  <text x="667" y="177" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">8</text>

  <text x="406" y="210" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">土</text>
  <text x="457" y="210" text-anchor="middle" font-size="11.5" fill="#8a5a00" filter="url(#rough2)">3</text>
  <text x="527" y="210" text-anchor="middle" font-size="11.5" fill="#8a5a00" filter="url(#rough2)">0</text>
  <text x="597" y="210" text-anchor="middle" font-size="11.5" fill="#8a5a00" filter="url(#rough2)">2</text>
  <text x="667" y="210" text-anchor="middle" font-size="11.5" fill="#8a5a00" filter="url(#rough2)">0</text>

  <text x="563" y="240" text-anchor="middle" font-size="11.5" fill="#8a3a36"
        filter="url(#rough2)">合计 3 + 0 + 2 + 0 = 5 &gt; k ✗</text>
  <text x="563" y="264" text-anchor="middle" font-size="10.5" fill="#555"
        filter="url(#rough2)">段 1 被 h₄ 顶到 4，段 3 被 h₂ = 5 顶到 4</text>

  <!-- 底部：单向贪心反例 -->
  <rect x="24" y="300" width="712" height="124" rx="10" fill="#fff8e1"
        stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="380" y="324" text-anchor="middle" font-size="11.5" fill="#8a5a00"
        filter="url(#rough2)">⚠ 只沿一个方向贪心（从最高点 h₄ 出发向右）会漏掉收口边</text>

  <rect x="104" y="336" width="62" height="26" rx="4" fill="#ffffff" stroke="#b85450"
        stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="174" y="336" width="62" height="26" rx="4" fill="#ffffff" stroke="#b85450"
        stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="244" y="336" width="62" height="26" rx="4" fill="#ffffff" stroke="#b85450"
        stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="314" y="336" width="62" height="26" rx="4" fill="#ffffff" stroke="#b85450"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="135" y="355" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">4</text>
  <text x="205" y="355" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">5</text>
  <text x="275" y="355" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">2</text>
  <text x="345" y="355" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">8</text>
  <text x="91" y="355" text-anchor="end" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">假解</text>

  <text x="396" y="346" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">土 = 3 ≤ k，</text>
  <text x="396" y="362" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">但 |2 − 8| = 6 &gt; 4</text>
  <text x="500" y="346" font-size="10.5" fill="#555" filter="url(#rough2)">收口边 4–1 违规，</text>
  <text x="500" y="362" font-size="10.5" fill="#555" filter="url(#rough2)">它必须算进锥里</text>

  <text x="380" y="390" text-anchor="middle" font-size="11" fill="#555"
        filter="url(#rough2)">故 a_i = max（左侧所有锥，右侧所有锥），不能只算一个方向</text>
  <text x="380" y="410" text-anchor="middle" font-size="10.5" fill="#888"
        filter="url(#rough2)">二分收敛：X = 5 可行，X = 4 不可行 ⇒ 答案 5</text>
</svg>
