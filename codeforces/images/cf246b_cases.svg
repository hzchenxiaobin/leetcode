<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="720" height="260" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两个样例</text>
  <rect x="50" y="60" width="300" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="200" y="89" text-anchor="middle" font-size="11.5" fill="#2f4a66">2 1 → Σ=3，3 mod 2 = 1 ≠ 0</text>
  <rect x="380" y="60" width="290" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="525" y="89" text-anchor="middle" font-size="12" fill="#2f5223">答案 1</text>
  <rect x="50" y="140" width="300" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="200" y="169" text-anchor="middle" font-size="11.5" fill="#2f4a66">1 4 1 → Σ=6，6 mod 3 = 0</text>
  <rect x="380" y="140" width="290" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="525" y="169" text-anchor="middle" font-size="12" fill="#2f5223">答案 3</text>
  <text x="50" y="232" text-anchor="start" font-size="11.5" fill="#7a4b22" filter="url(#rough2)">n=1 时永远输出 1（Σ mod 1 = 0）</text>
</svg>
