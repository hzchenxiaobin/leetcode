<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="720" height="260" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">小 n 的答案</text>
  <rect x="50" y="70" width="100" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="100" y="91" text-anchor="middle" font-size="11.5" fill="#2f4a66">n=1</text>
  <rect x="50" y="120" width="100" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="100" y="144" text-anchor="middle" font-size="12" fill="#2f5223">-1</text>
  <rect x="162" y="70" width="100" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="212" y="91" text-anchor="middle" font-size="11.5" fill="#2f4a66">n=2</text>
  <rect x="162" y="120" width="100" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="212" y="144" text-anchor="middle" font-size="12" fill="#2f5223">-1</text>
  <rect x="274" y="70" width="100" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="324" y="91" text-anchor="middle" font-size="11.5" fill="#2f4a66">n=3</text>
  <rect x="274" y="120" width="100" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="324" y="144" text-anchor="middle" font-size="12" fill="#2f5223">210</text>
  <rect x="386" y="70" width="100" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="436" y="91" text-anchor="middle" font-size="11.5" fill="#2f4a66">n=4</text>
  <rect x="386" y="120" width="100" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="436" y="144" text-anchor="middle" font-size="12" fill="#2f5223">1050</text>
  <rect x="498" y="70" width="100" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="548" y="91" text-anchor="middle" font-size="11.5" fill="#2f4a66">n=5</text>
  <rect x="498" y="120" width="100" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="548" y="144" text-anchor="middle" font-size="12" fill="#2f5223">10080</text>
  <rect x="610" y="70" width="100" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="660" y="91" text-anchor="middle" font-size="11.5" fill="#2f4a66">n=6</text>
  <rect x="610" y="120" width="100" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="660" y="144" text-anchor="middle" font-size="12" fill="#2f5223">100170</text>
  <text x="50" y="220" text-anchor="start" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">n ≥ 3 时一定存在（210·10^(n-3) 是 n 位数）；n ≤ 2 不存在</text>
</svg>
