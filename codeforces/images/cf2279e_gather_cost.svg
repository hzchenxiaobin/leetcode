<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="680" height="400" fill="#fafafa"/>

  <text x="24" y="32" font-size="17" fill="#333" filter="url(#rough2)">核心观察：把子集 S 并到一起的代价</text>
  <text x="24" y="55" font-size="13" fill="#666" filter="url(#rough2)">向左/右「拷贝」一格 = 2 次操作；把两个相等的相邻值合并 = 1 次操作</text>

  <!-- index labels -->
  <g font-size="12" fill="#888">
    <text x="62" y="80" text-anchor="middle" filter="url(#rough2)">0</text>
    <text x="134" y="80" text-anchor="middle" filter="url(#rough2)">1</text>
    <text x="206" y="80" text-anchor="middle" filter="url(#rough2)">2</text>
    <text x="278" y="80" text-anchor="middle" filter="url(#rough2)">3</text>
    <text x="350" y="80" text-anchor="middle" filter="url(#rough2)">4</text>
    <text x="422" y="80" text-anchor="middle" filter="url(#rough2)">5</text>
    <text x="494" y="80" text-anchor="middle" filter="url(#rough2)">6</text>
  </g>

  <!-- cells -->
  <g>
    <rect x="32" y="86" width="60" height="44" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="62" y="115" text-anchor="middle" font-size="14" fill="#2f4f2a" filter="url(#rough2)">a₀ ∈ S</text>
    <rect x="104" y="86" width="60" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="134" y="115" text-anchor="middle" font-size="14" fill="#33506e" filter="url(#rough2)">a₁</text>
    <rect x="176" y="86" width="60" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="206" y="115" text-anchor="middle" font-size="14" fill="#33506e" filter="url(#rough2)">a₂</text>
    <rect x="248" y="86" width="60" height="44" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="278" y="115" text-anchor="middle" font-size="14" fill="#2f4f2a" filter="url(#rough2)">a₃ ∈ S</text>
    <rect x="320" y="86" width="60" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="350" y="115" text-anchor="middle" font-size="14" fill="#33506e" filter="url(#rough2)">a₄</text>
    <rect x="392" y="86" width="60" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="422" y="115" text-anchor="middle" font-size="14" fill="#33506e" filter="url(#rough2)">a₅</text>
    <rect x="464" y="86" width="60" height="44" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="494" y="115" text-anchor="middle" font-size="14" fill="#2f4f2a" filter="url(#rough2)">a₆ ∈ S</text>
  </g>

  <!-- gap brackets -->
  <path d="M62,140 C62,168 278,168 278,140" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="170" y="182" text-anchor="middle" font-size="13" fill="#8a6a20" filter="url(#rough2)">gap g₁ = 3 ⇒ 2g₁−1 = 5 次</text>

  <path d="M278,196 C278,224 494,224 494,196" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="386" y="240" text-anchor="middle" font-size="13" fill="#94403c" filter="url(#rough2)">gap g₂ = 3 ⇒ 2g₂−1 = 5 次</text>

  <!-- formula box -->
  <rect x="32" y="262" width="492" height="92" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="48" y="290" font-size="14" fill="#6b5316" filter="url(#rough2)">cost(S) = Σ_j (2g_j − 1) = 2·span(S) − (|S| − 1)</text>
  <text x="48" y="316" font-size="13" fill="#6b5316" filter="url(#rough2)">S = {0,3,6}：span = 6，|S| = 3 ⇒ cost = 5 + 5 = 10</text>
  <text x="48" y="340" font-size="13" fill="#94403c" filter="url(#rough2)">答案 = min{ cost(S) : S ≠ ∅，⊕_{j∈S} a_j = 0 }</text>

  <!-- copy illustration -->
  <rect x="546" y="86" width="104" height="44" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="598" y="114" text-anchor="middle" font-size="13" fill="#7d2b27" filter="url(#rough2)">x ｜ y</text>
  <path d="M598,134 L598,166" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="598" y="184" text-anchor="middle" font-size="12" fill="#33506e" filter="url(#rough2)">2 次</text>
  <rect x="546" y="192" width="104" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="598" y="220" text-anchor="middle" font-size="13" fill="#33506e" filter="url(#rough2)">x⊕y ｜ x</text>
  <text x="598" y="254" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">x 被整段搬走</text>
  <text x="598" y="274" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">源格留下 x⊕y</text>
</svg>
