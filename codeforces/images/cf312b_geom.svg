<svg xmlns="http://www.w3.org/2000/svg" width="700" height="270" viewBox="0 0 700 270"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1501"/>
    <feDisplacementMap in="SourceGraphic" scale="1.5"/></filter></defs>
  <rect width="700" height="270" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">把"谁先命中"拆成互斥的回合块</text>
  <path d="M 140 40 Q 350 46 560 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="76" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="12.5" fill="#22314a" filter="url(#rough2)">先手以 p 命中 ⇒ 立即赢；概率 p。</text>
  <text x="76" y="106" font-size="12.5" fill="#22314a" filter="url(#rough2)">两人这一轮都没中（概率 (1−p)(1−q)）⇒ 局面回到起点、轮到先手。</text>
  <text x="76" y="130" font-size="12.5" fill="#22314a" filter="url(#rough2)">所以 P = p + r·P，其中 r = (1−p)(1−q) ⇒ P = p/(1−r) ✓</text>
  <g filter="url(#rough2)"><rect x="60" y="146" width="580" height="66" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="170" font-size="12.5" fill="#2f5223" filter="url(#rough2)">等比级数形式：P = Σ_{k≥0} p·r^k = p/(1−r)（0 ≤ r &lt; 1 保证收敛）。</text>
  <text x="76" y="194" font-size="12.5" fill="#2f5223" filter="url(#rough2)">样例 a/b=1/2、c/d=1/2 ⇒ P = 0.5/(1−0.25) = 2/3 ≈ 0.666666666667 ✓</text>
  <g filter="url(#rough2)"><rect x="60" y="224" width="580" height="36" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="76" y="247" font-size="12.5" fill="#8a6015" filter="url(#rough2)">用 double 即可（误差要求 1e−6），不需要分数运算。</text>
</svg>
