<svg xmlns="http://www.w3.org/2000/svg" width="720" height="436" viewBox="0 0 720 436"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.2"/>
    </filter>
  </defs>
  <rect width="720" height="436" fill="#fafafa"/>

  <text x="360" y="28" text-anchor="middle" font-size="17.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">h = 3 的完整演算：消息 101，维瑞蒂在 u = 2 动手</text>
  <text x="360" y="48" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">键表 1→0，2→4，3→5，4→8，5→10，6→9，7→11；自由位 {1,6,7}，校验位 {2,3,4,5}</text>

  <g filter="url(#rough2)">
    <rect x="22" y="58" width="676" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <g font-size="11" font-weight="bold" fill="#33517a" text-anchor="middle">
    <text x="84" y="76" filter="url(#rough2)">阶段</text>
    <text x="290" y="76" filter="url(#rough2)">节点 1..7</text>
    <text x="516" y="76" filter="url(#rough2)">计算</text>
    <text x="646" y="76" filter="url(#rough2)">结论</text>
  </g>

  <g stroke="#e2e8f0" stroke-width="1" filter="url(#rough2)">
    <line x1="22" y1="108" x2="698" y2="108"/>
    <line x1="22" y1="144" x2="698" y2="144"/>
    <line x1="22" y1="180" x2="698" y2="180"/>
    <line x1="22" y1="216" x2="698" y2="216"/>
    <line x1="22" y1="252" x2="698" y2="252"/>
    <line x1="22" y1="288" x2="698" y2="288"/>
    <line x1="22" y1="324" x2="698" y2="324"/>
    <line x1="22" y1="360" x2="698" y2="360"/>
  </g>

  <g font-size="11" text-anchor="middle">
    <text x="84" y="90" fill="#555" filter="url(#rough2)">键表</text>
    <text x="290" y="90" fill="#233" filter="url(#rough2)">0  4  5  8  10  9  11</text>
    <text x="516" y="90" fill="#666" filter="url(#rough2)">(d &lt;&lt; 2) | p</text>
    <text x="646" y="90" fill="#666" filter="url(#rough2)">14 位以内</text>

    <text x="84" y="126" fill="#555" filter="url(#rough2)">码字 a</text>
    <text x="290" y="126" fill="#233" filter="url(#rough2)">1  1  1  0  1  0  1</text>
    <text x="516" y="126" fill="#666" filter="url(#rough2)">1 位节点键异或</text>
    <text x="646" y="126" fill="#4a7a3a" filter="url(#rough2)">= 0 ✓</text>

    <text x="84" y="162" fill="#555" filter="url(#rough2)">u = 2 破坏</text>
    <text x="290" y="162" fill="#b85450" filter="url(#rough2)">1  0  1  1  0  0  1</text>
    <text x="516" y="162" fill="#666" filter="url(#rough2)">翻 a[2]，交换 4↔5</text>
    <text x="646" y="162" fill="#b85450" filter="url(#rough2)">得到 l</text>

    <text x="84" y="198" fill="#555" filter="url(#rough2)">算 S</text>
    <text x="290" y="198" fill="#233" filter="url(#rough2)">0⊕5⊕8⊕11 = 6</text>
    <text x="516" y="198" fill="#666" filter="url(#rough2)">6 = 0110₂</text>
    <text x="646" y="198" fill="#446688" filter="url(#rough2)">S = 6</text>

    <text x="84" y="234" fill="#555" filter="url(#rough2)">拆 S</text>
    <text x="290" y="234" fill="#233" filter="url(#rough2)">d = 6 &gt;&gt; 2 = 1</text>
    <text x="516" y="234" fill="#233" filter="url(#rough2)">p = 2 &amp; (2¹−1) = 0</text>
    <text x="646" y="234" fill="#446688" filter="url(#rough2)">d=1, p=0</text>

    <text x="84" y="270" fill="#555" filter="url(#rough2)">定位 u</text>
    <text x="290" y="270" fill="#233" filter="url(#rough2)">根走 1 步：第 0 位=0 向左</text>
    <text x="516" y="270" fill="#666" filter="url(#rough2)">u = 2</text>
    <text x="646" y="270" fill="#4a7a3a" filter="url(#rough2)">u 正确 ✓</text>

    <text x="84" y="306" fill="#555" filter="url(#rough2)">还原 a</text>
    <text x="290" y="306" fill="#233" filter="url(#rough2)">1  1  1  0  1  0  1</text>
    <text x="516" y="306" fill="#666" filter="url(#rough2)">再对 2 做一次 T_2</text>
    <text x="646" y="306" fill="#4a7a3a" filter="url(#rough2)">= a ✓</text>

    <text x="84" y="342" fill="#555" filter="url(#rough2)">读消息</text>
    <text x="290" y="342" fill="#233" filter="url(#rough2)">a[1], a[6], a[7] = 1,0,1</text>
    <text x="516" y="342" fill="#666" filter="url(#rough2)">自由位前 3 个</text>
    <text x="646" y="342" fill="#4a7a3a" filter="url(#rough2)">101 ✓</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="22" y="372" width="676" height="52" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <text x="360" y="392" text-anchor="middle" font-size="11.5" fill="#7a5a12" filter="url(#rough2)">这里 s = (a[2]⊕a[4]⊕a[5]) ⊕ a[2] = (1⊕0⊕1) ⊕ 1 = 1，所以 S = key(2) ⊕ 2¹ = 4 ⊕ 2 = 6</text>
  <text x="360" y="412" text-anchor="middle" font-size="11.5" fill="#7a5a12" filter="url(#rough2)">取低 d = 1 位把这一项擦掉，d 与 p 才有唯一解</text>
</svg>
