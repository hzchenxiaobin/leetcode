<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="347"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="320" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">C：三个样例</text>
  <path d="M 240 42 Q 380 47 520 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <rect x="36" y="66" width="688" height="72" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="48" y="90" font-size="11.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">样例 1：1,2,3,1,1,2,6,6,2</text>
  <text x="48" y="112" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">去重排序得 1 2 3 6：前三个连续 → 1-3，6 单独 → 6</text>
  <text x="48" y="132" font-size="10.5" fill="#2f5223" font-family="'Courier New',monospace" filter="url(#rough2)">输出：1-3,6</text>

  <rect x="36" y="152" width="688" height="72" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="48" y="176" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">样例 2：3,2,1</text>
  <text x="48" y="198" font-size="10.5" fill="#3c5e88" filter="url(#rough2)">顺序无所谓，排序后 1 2 3 是一整段</text>
  <text x="48" y="218" font-size="10.5" fill="#2f4a66" font-family="'Courier New',monospace" filter="url(#rough2)">输出：1-3</text>

  <rect x="36" y="238" width="688" height="70" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="48" y="262" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">样例 3：30,20,10</text>
  <text x="48" y="284" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">三个数互不相邻（10、20、30 之间各差 10），都是单页</text>
  <text x="48" y="302" font-size="10.5" fill="#8a6015" font-family="'Courier New',monospace" filter="url(#rough2)">输出：10,20,30</text>
</svg>
