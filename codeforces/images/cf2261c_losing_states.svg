<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">三个必败态，以及"一步进坑"的走法</text>

  <!-- 第 1 列：通向 (0,0) -->
  <text x="125" y="58" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">① 删到空数组</text>
  <rect x="18" y="70" width="214" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="125" y="92" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(0, o) o 偶 ≥ 2：全删（和偶）</text>
  <text x="125" y="112" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(0, 1)：删掉唯一奇数</text>
  <text x="125" y="132" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(1, 0)：删掉唯一偶数</text>
  <text x="125" y="150" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(1, o) o 偶、(e≥2, o 偶)：全删</text>

  <path d="M125,162 C125,182 125,196 125,214" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="136" y="196" font-size="11" fill="#b85450" filter="url(#rough2)">清空即胜</text>

  <rect x="55" y="220" width="140" height="66" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="125" y="244" text-anchor="middle" font-size="15" fill="#8a3030" filter="url(#rough2)">(0, 0)</text>
  <text x="125" y="264" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">空数组：无路可走</text>
  <text x="125" y="280" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">必败</text>

  <!-- 第 2 列：通向 (0,3) -->
  <text x="360" y="58" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">② 只留 3 个奇数</text>
  <rect x="253" y="70" width="214" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="360" y="92" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">o 为奇 ≥ 3：先删掉全部 e 个偶数</text>
  <text x="360" y="112" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">再删 o − 3 个奇数（偶数个）</text>
  <text x="360" y="132" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">o = 3 时只删偶数即可</text>
  <text x="360" y="150" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">和仍为偶数，走法合法</text>

  <path d="M360,162 C360,182 360,196 360,214" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="371" y="196" font-size="11" fill="#b85450" filter="url(#rough2)">去偶留奇</text>

  <rect x="290" y="220" width="140" height="66" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="360" y="244" text-anchor="middle" font-size="15" fill="#8a3030" filter="url(#rough2)">(0, 3)</text>
  <text x="360" y="264" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">3 个奇数，删不完</text>
  <text x="360" y="280" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">必败</text>

  <!-- 第 3 列：通向 (1,1) -->
  <text x="595" y="58" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">③ 只留 1 偶 1 奇</text>
  <rect x="488" y="70" width="214" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="595" y="92" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">删 e − 1 个偶数和 o − 1 个奇数</text>
  <text x="595" y="112" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">要求 o 为奇 ≥ 3（否则见左两列）</text>
  <text x="595" y="132" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">(1, o) o 奇：删 o − 1 个奇数</text>
  <text x="595" y="150" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">(2, 1)：只删 1 个偶数</text>

  <path d="M595,162 C595,182 595,196 595,214" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="606" y="196" font-size="11" fill="#b85450" filter="url(#rough2)">留一偶一奇</text>

  <rect x="525" y="220" width="140" height="66" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="595" y="244" text-anchor="middle" font-size="15" fill="#8a3030" filter="url(#rough2)">(1, 1)</text>
  <text x="595" y="264" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">一偶一奇，和为奇</text>
  <text x="595" y="280" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">必败</text>

  <!-- 底部说明 -->
  <rect x="30" y="312" width="660" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="360" y="334" text-anchor="middle" font-size="12" fill="#2f4f6f" filter="url(#rough2)">三个必败态彼此都不相连（引理 3）：站在其中任何一个，无论怎么走，都只能把局面交还给对手</text>
  <text x="360" y="356" text-anchor="middle" font-size="12" fill="#2f4f6f" filter="url(#rough2)">而其余每个局面都至少有一条红箭头指向它们（引理 4）⇒ 面对它们的人必输</text>

  <text x="360" y="404" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">按 n = e + o 归纳：无路可走者输 ⇒ 三步走完整个证明</text>
</svg>
