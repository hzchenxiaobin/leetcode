<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="811"/>
    <feDisplacementMap in="SourceGraphic" scale="1.5"/></filter></defs>
  <rect width="700" height="300" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">三步：约分 → 取最大倍数 → 贴边居中</text>
  <path d="M 110 40 Q 350 46 590 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="66" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="12.5" fill="#22314a" filter="url(#rough2)">① 把 a:b 约分成 a′:b′（gcd）；任何合法矩形都是 a′t × b′t。</text>
  <text x="76" y="106" font-size="12.5" fill="#22314a" filter="url(#rough2)">② 最大的 t = min(n/a′, m/b′)（一边顶满），得到 w=a′t、h=b′t。</text>
  <g filter="url(#rough2)"><rect x="60" y="134" width="580" height="86" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="76" y="158" font-size="12.5" fill="#8a6015" filter="url(#rough2)">③ 只差位置：x₁ 与 y₁ 独立，各要让 |中心 − 给定点| 最小。</text>
  <text x="76" y="182" font-size="12.5" fill="#8a6015" filter="url(#rough2)">用二倍坐标避免半整数：最小化 |2x₁ + w − 2x|，且 0 ≤ x₁ ≤ n − w。</text>
  <text x="76" y="206" font-size="12.5" fill="#8a6015" filter="url(#rough2)">取 X = (2x − w)/2 后夹到 [0, n−w]，再看左右各 3 个点，按 (距离, x₁) 取最小。</text>
  <g filter="url(#rough2)"><rect x="60" y="230" width="580" height="60" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="254" font-size="12.5" fill="#2f5223" filter="url(#rough2)">样例 1：9×9、(5,5)、2:1 ⇒ t=4、w=8,h=4 ⇒ x₁=1（中心 5）、y₁=3 ⇒ (1,3,9,7) ✓</text>
  <text x="76" y="276" font-size="12.5" fill="#2f5223" filter="url(#rough2)">样例 2：100×100、(52,50)、46:56 ⇒ 约分 23:28、t=3 ⇒ 69×84，x₁=17 或 18 并列取 17 ✓</text>
</svg>
