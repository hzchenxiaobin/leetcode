<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="57"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="460" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">C2 的流程：分链 + 有序集合</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="90.0" y="76.0" width="540.0" height="44.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="104.0" y="99.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">g = gcd(h, m)，L = h/g，inv = (m/g)⁻¹ mod L</text>
  <rect x="90.0" y="138.0" width="540.0" height="44.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="104.0" y="161.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">所有键 0..h-1 都空闲（按链分块）</text>
  <line x1="360.0" y1="120.0" x2="360.0" y2="134.0" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="90.0" y="200.0" width="540.0" height="44.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="104.0" y="223.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">+ id hash：算 key0，在链块内 lower_bound</text>
  <line x1="360.0" y1="182.0" x2="360.0" y2="196.0" stroke="#8a6015" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="90.0" y="262.0" width="540.0" height="44.0" fill="#fde8e8" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="104.0" y="285.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">越出链块就绕回 base；dummy = (kf-key0) mod L</text>
  <line x1="360.0" y1="244.0" x2="360.0" y2="258.0" stroke="#b85450" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="90.0" y="324.0" width="540.0" height="44.0" fill="#f3e8fd" stroke="#6b4c9a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="104.0" y="347.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">删除键 kf；- id 时把键插回集合</text>
  <line x1="360.0" y1="306.0" x2="360.0" y2="320.0" stroke="#6b4c9a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="40.0" y="396.0" width="640.0" height="52.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="54.0" y="420.0" text-anchor="start" font-size="12" fill="#3f3420" filter="url(#rough2)">每次操作 O(log h)；h,n ≤ 5×10⁴ 时约 10⁶ 次树操作</text>
</svg>
