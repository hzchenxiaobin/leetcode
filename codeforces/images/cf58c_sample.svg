<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="586"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="760" height="330" fill="#fafafa"/>
  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两个官方样例：把 a_i 减去 d_i 得到候选 h，数一数哪个 h 出现最多</text>
  <path d="M 60 40 Q 380 48 700 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <text x="30" y="78" font-size="12" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">样例 1：n = 3，a = 2 2 2</text>
  <g font-size="11">
    <rect x="40" y="92" width="60" height="46" rx="7" fill="#cfe0f5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="70" y="111" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">a=2</text>
    <text x="70" y="128" text-anchor="middle" fill="#555555" filter="url(#rough2)">d=0</text>
    <rect x="110" y="92" width="60" height="46" rx="7" fill="#cfe0f5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="140" y="111" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">a=2</text>
    <text x="140" y="128" text-anchor="middle" fill="#555555" filter="url(#rough2)">d=1</text>
    <rect x="180" y="92" width="60" height="46" rx="7" fill="#cfe0f5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="210" y="111" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">a=2</text>
    <text x="210" y="128" text-anchor="middle" fill="#555555" filter="url(#rough2)">d=0</text>
  </g>
  <text x="260" y="106" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">候选 h：2、1、2</text>
  <text x="260" y="124" font-size="10.5" fill="#8a2b28" filter="url(#rough2)">h=2 出现 2 次 → 改 1 棵</text>

  <g font-size="11">
    <rect x="430" y="92" width="60" height="46" rx="7" fill="#d9ecd4" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="460" y="111" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">b=2</text>
    <text x="460" y="128" text-anchor="middle" fill="#555555" filter="url(#rough2)">保留</text>
    <rect x="500" y="92" width="60" height="46" rx="7" fill="#f6d5d5" stroke="#8a2b28" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="530" y="111" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">b=3</text>
    <text x="530" y="128" text-anchor="middle" fill="#8a2b28" filter="url(#rough2)">2→3</text>
    <rect x="570" y="92" width="60" height="46" rx="7" fill="#d9ecd4" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="600" y="111" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">b=2</text>
    <text x="600" y="128" text-anchor="middle" fill="#555555" filter="url(#rough2)">保留</text>
  </g>
  <text x="640" y="120" font-size="10.5" fill="#555555" filter="url(#rough2)">答案 1</text>

  <text x="30" y="186" font-size="12" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">样例 2：n = 4，a = 1 2 2 1</text>
  <g font-size="11">
    <rect x="40" y="200" width="60" height="46" rx="7" fill="#cfe0f5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="70" y="219" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">a=1</text>
    <text x="70" y="236" text-anchor="middle" fill="#555555" filter="url(#rough2)">d=0</text>
    <rect x="110" y="200" width="60" height="46" rx="7" fill="#cfe0f5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="140" y="219" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">a=2</text>
    <text x="140" y="236" text-anchor="middle" fill="#555555" filter="url(#rough2)">d=1</text>
    <rect x="180" y="200" width="60" height="46" rx="7" fill="#cfe0f5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="210" y="219" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">a=2</text>
    <text x="210" y="236" text-anchor="middle" fill="#555555" filter="url(#rough2)">d=1</text>
    <rect x="250" y="200" width="60" height="46" rx="7" fill="#cfe0f5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="280" y="219" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">a=1</text>
    <text x="280" y="236" text-anchor="middle" fill="#555555" filter="url(#rough2)">d=0</text>
  </g>
  <text x="330" y="216" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">候选 h：1、1、1、1</text>
  <text x="330" y="234" font-size="10.5" fill="#8a2b28" filter="url(#rough2)">h=1 出现 4 次 → 改 0 棵</text>
  <text x="520" y="216" font-size="10.5" fill="#555555" filter="url(#rough2)">序列 1 2 2 1 本来就是美丽的，</text>
  <text x="520" y="234" font-size="10.5" fill="#555555" filter="url(#rough2)">输出 0。</text>

  <rect x="30" y="266" width="700" height="44" rx="9" fill="#fbe3c8" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="44" y="286" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">复杂度 O(n)：每个位置算出唯一候选 h，用哈希表计数，最后取最大频次；答案 = n − 最大频次。</text>
  <text x="44" y="303" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">h 的取值范围只需覆盖 a_i − d_i ≥ 1 的那些，用数组或哈希都能做。</text>
</svg>
