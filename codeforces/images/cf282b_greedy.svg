<svg xmlns="http://www.w3.org/2000/svg" width="700" height="400" viewBox="0 0 700 400"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="161"/>
    <feDisplacementMap in="SourceGraphic" scale="1.5"/></filter></defs>
  <rect width="700" height="400" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">维护差值 d = Sa − Sg，每次只做「不让 |d| 超 500」的选择</text>
  <path d="M 90 40 Q 350 46 610 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="70" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="13" fill="#22314a" filter="url(#rough2)">关键恒等式：a_i + g_i = 1000 ⇒ 给 G 的代价是 g_i = 1000 − a_i。</text>
  <text x="76" y="106" font-size="13" fill="#22314a" filter="url(#rough2)">所以两种选择对 d 的影响分别是 +a_i 和 +a_i − 1000，二者恰好相差 1000。</text>
  <g filter="url(#rough2)"><rect x="60" y="140" width="580" height="86" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="164" font-size="13" fill="#2f5223" filter="url(#rough2)">若 |d + a_i| ≤ 500 ⇒ 给 A，d ← d + a_i</text>
  <text x="76" y="188" font-size="13" fill="#2f5223" filter="url(#rough2)">否则（d + a_i &gt; 500）⇒ 给 G，d ← d + a_i − 1000</text>
  <text x="76" y="212" font-size="12" fill="#2f5223" filter="url(#rough2)">（d + a_i &lt; −500 不可能：d ≥ −500 且 a_i ≥ 0。）</text>
  <g filter="url(#rough2)"><rect x="60" y="238" width="580" height="90" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="76" y="262" font-size="13" fill="#8a6015" filter="url(#rough2)">不变式：每步之后 d ∈ [−500, 500]。</text>
  <text x="76" y="286" font-size="12.5" fill="#8a6015" filter="url(#rough2)">给 A 时 d_new = d + a_i ∈ [−500, 500]（上界由判断保证）；</text>
  <text x="76" y="310" font-size="12.5" fill="#8a6015" filter="url(#rough2)">给 G 时 d_new = d + a_i − 1000 ∈ (500−1000, 1500−1000] = (−500, 500]。</text>
  <g filter="url(#rough2)"><rect x="60" y="340" width="580" height="50" rx="8" fill="#fbeeee" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="76" y="370" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">由于不变式从 d=0 起就成立，答案永远存在 ⇒ 实际永远不会输出 −1（保留判据仅作防御）。</text>
</svg>
