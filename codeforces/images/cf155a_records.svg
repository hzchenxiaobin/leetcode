<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="521"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="280" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">维护当前最高 / 最低，严格超出才计数</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">等于边界不算</text>
  <g filter="url(#rough2)"><rect x="110" y="96" width="100" height="56" rx="4" fill="#ffffff" fill-opacity="0.6" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="160" y="130" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">100</text>
  <g filter="url(#rough2)"><rect x="240" y="96" width="100" height="56" rx="4" fill="#f6e3c4" fill-opacity="0.6" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="290" y="130" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">50</text>
  <text x="290" y="176" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">破纪录</text>
  <g filter="url(#rough2)"><rect x="370" y="96" width="100" height="56" rx="4" fill="#dcecd2" fill-opacity="0.6" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="420" y="130" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">200</text>
  <text x="420" y="176" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">破纪录</text>
  <g filter="url(#rough2)"><rect x="500" y="96" width="100" height="56" rx="4" fill="#ffffff" fill-opacity="0.6" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="550" y="130" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">150</text>
  <g filter="url(#rough2)"><rect x="630" y="96" width="100" height="56" rx="4" fill="#ffffff" fill-opacity="0.6" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="680" y="130" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">200</text>
  <text x="450" y="214" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">50 &lt; 100（最低）　　200 &gt; 100（最高）　　150 介于之间　　200 等于最高 ⇒ 不算</text>
  <text x="450" y="246" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 2</text>
</svg>
