<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="19"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：n = 4 的树，6 = 2n−2 次询问全部还原</text>
  <text x="310" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">隐藏树：1−2、1−3、2−4　siz = (4, 2, 1, 1)　拓扑序 a = (1, 2, 3, 4)</text>

  <circle cx="120" cy="92" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="97" text-anchor="middle" font-size="11" fill="#33506e" filter="url(#rough2)">1</text>
  <text x="142" y="88" font-size="9.5" fill="#33506e" filter="url(#rough2)">siz 4</text>
  <circle cx="68" cy="164" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="68" y="169" text-anchor="middle" font-size="11" fill="#3a5a30" filter="url(#rough2)">2</text>
  <text x="12" y="192" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">siz 2</text>
  <circle cx="172" cy="164" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="172" y="169" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">3</text>
  <text x="192" y="160" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">siz 1</text>
  <circle cx="58" cy="232" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="58" y="237" text-anchor="middle" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">4</text>
  <text x="78" y="228" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">siz 1</text>

  <path d="M 110 104 L 78 151" stroke="#8a9bb0" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 133 102 L 164 152" stroke="#8a9bb0" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 62 180 L 59 217" stroke="#8a9bb0" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <rect x="18" y="262" width="192" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="30" y="282" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">第一阶段 3 次询问 ⇒ siz</text>
  <text x="30" y="300" font-size="9.5" fill="#555" filter="url(#rough2)">第二阶段 3 次询问 ⇒ 父亲</text>

  <rect x="18" y="326" width="192" height="80" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="30" y="346" font-size="9.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">答案边集</text>
  <text x="30" y="364" font-size="9.5" fill="#555" filter="url(#rough2)">1−2　1−3　2−4</text>
  <text x="30" y="382" font-size="9.5" fill="#555" filter="url(#rough2)">与隐藏树完全一致</text>
  <text x="30" y="399" font-size="9" fill="#999" filter="url(#rough2)">多一个查询都会超限</text>

  <rect x="222" y="62" width="380" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="232" y="82" font-size="9.5" fill="#33506e" font-weight="bold" filter="url(#rough2)">询问（根 x, 排列 p）</text>
  <text x="352" y="82" font-size="9.5" fill="#33506e" font-weight="bold" filter="url(#rough2)">S</text>
  <text x="398" y="82" font-size="9.5" fill="#33506e" font-weight="bold" filter="url(#rough2)">Known</text>
  <text x="470" y="82" font-size="9.5" fill="#33506e" font-weight="bold" filter="url(#rough2)">推出的信息</text>

  <rect x="222" y="94" width="380" height="34" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
  <text x="232" y="115" font-size="9" fill="#555" filter="url(#rough2)">x=2, p=[3,4,1,2]</text>
  <text x="352" y="115" font-size="9.5" fill="#333" filter="url(#rough2)">14</text>
  <text x="398" y="115" font-size="9.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="470" y="115" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">siz₂ = 14 − 12 = 2</text>

  <rect x="222" y="130" width="380" height="34" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
  <text x="232" y="151" font-size="9" fill="#555" filter="url(#rough2)">x=3, p=[3,1,4,2]</text>
  <text x="352" y="151" font-size="9.5" fill="#333" filter="url(#rough2)">13</text>
  <text x="398" y="151" font-size="9.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="470" y="151" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">siz₃ = 13 − 12 = 1</text>

  <rect x="222" y="166" width="380" height="34" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
  <text x="232" y="187" font-size="9" fill="#555" filter="url(#rough2)">x=4, p=[3,1,2,4]</text>
  <text x="352" y="187" font-size="9.5" fill="#333" filter="url(#rough2)">13</text>
  <text x="398" y="187" font-size="9.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="470" y="187" font-size="9.5" fill="#3a5a30" filter="url(#rough2)">siz₄ = 13 − 12 = 1</text>

  <rect x="222" y="202" width="380" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="232" y="223" font-size="9" fill="#555" filter="url(#rough2)">i=2, aᵢ=2, p=[3,4,1,2]</text>
  <text x="352" y="223" font-size="9.5" fill="#333" filter="url(#rough2)">14</text>
  <text x="398" y="223" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">12</text>
  <text x="470" y="223" font-size="9" fill="#8a6a20" filter="url(#rough2)">p_f=3 → rank1 → 父 1</text>

  <rect x="222" y="238" width="380" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="232" y="259" font-size="9" fill="#555" filter="url(#rough2)">i=3, aᵢ=3, p=[2,3,4,1]</text>
  <text x="352" y="259" font-size="9.5" fill="#333" filter="url(#rough2)">12</text>
  <text x="398" y="259" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">10</text>
  <text x="470" y="259" font-size="9" fill="#8a6a20" filter="url(#rough2)">p_f=2 → rank1 → 父 1</text>

  <rect x="222" y="274" width="380" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="232" y="295" font-size="9" fill="#555" filter="url(#rough2)">i=4, aᵢ=4, p=[1,2,3,4]</text>
  <text x="352" y="295" font-size="9.5" fill="#333" filter="url(#rough2)">10</text>
  <text x="398" y="295" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">8</text>
  <text x="470" y="295" font-size="9" fill="#8a6a20" filter="url(#rough2)">p_f=2 → rank2 → 父 2</text>

  <rect x="222" y="318" width="380" height="88" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="232" y="338" font-size="9.5" fill="#3a5a30" font-weight="bold" filter="url(#rough2)">逐步核对</text>
  <text x="232" y="357" font-size="9" fill="#555" filter="url(#rough2)">i=2：W(1)=4，Known=3·4=12，S−Known=2=siz₂·(4−p_f) ⇒ p_f=3</text>
  <text x="232" y="375" font-size="9" fill="#555" filter="url(#rough2)">i=3：W(1)=4−2=2, W(2)=2，Known=2·2+3·2=10 ⇒ p_f=2</text>
  <text x="232" y="393" font-size="9" fill="#555" filter="url(#rough2)">i=4：W(1)=1, W(2)=2, W(3)=1，Known=1+4+3=8 ⇒ p_f=2</text>
</svg>
