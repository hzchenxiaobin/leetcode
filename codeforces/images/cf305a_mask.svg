<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="240" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按非零位集合分类</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">位只有个/十/百三位</text>
  <text x="150" y="95" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">两数可相加 ⇔ 每个十进制位上至少一个为 0</text>
  <text x="150" y="135" text-anchor="start" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">"单位数字"（只有一个非零位）彼此相容；最多只能再放一个"多位数字"</text>
  <text x="150" y="175" text-anchor="start" font-size="11" fill="#3d6b2f" filter="url(#rough2)">最优 = 0（若存在）+ 每个位置一个单位数字（或换成"一个多位数字 + 位置不冲突的单位数字"）</text>
</svg>
