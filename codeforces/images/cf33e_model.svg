<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="400"/>
    <feDisplacementMap in="SourceGraphic" scale="1.4"/></filter></defs>
  <rect width="760" height="300" fill="#fafafa"/>
  <text x="380" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">33E：把一天切成"可工作分钟"</text>
  <path d="M 110 46 Q 380 52 650 46" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <rect x="70" y="78" width="620" height="64" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="92" y="112" font-size="13" fill="#23405c" filter="url(#rough2)">每题的工时按可工作分钟累计，跨越睡眠/三餐</text>
  <rect x="70" y="160" width="620" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="92" y="192" font-size="12.5" fill="#8a6015" filter="url(#rough2)">完成时刻 = 第 t 个可工作分钟所在的时刻</text>
  <rect x="70" y="230" width="620" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="92" y="257" font-size="12" fill="#2f5223" filter="url(#rough2)">正确性见正文第 4 节，复杂度见第 5 节。</text>
</svg>
