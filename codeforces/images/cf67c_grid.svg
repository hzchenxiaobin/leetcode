<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr67g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a4a8a"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">一次交换 = 二维平面上的一块矩形（对角交叉匹配）</text>
  <path d="M 70 40 Q 360 46 650 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- A 轴 -->
  <text x="60" y="72" font-size="12" fill="#2f4a66" filter="url(#rough2)">A 的下标</text>
  <g font-size="12.5" text-anchor="middle" filter="url(#rough2)">
    <text x="120" y="72" fill="#555">k−1</text>
    <text x="190" y="72" fill="#555">k</text>
    <text x="260" y="72" fill="#b85450">…</text>
    <text x="330" y="72" fill="#555">i−1</text>
    <text x="400" y="72" fill="#555">i</text>
  </g>
  <!-- B 轴 -->
  <text x="60" y="96" font-size="12" fill="#2f4a66" filter="url(#rough2)">B 的下标</text>
  <g font-size="12.5" text-anchor="middle" filter="url(#rough2)">
    <text x="120" y="96" fill="#555">l−1</text>
    <text x="190" y="96" fill="#555">l</text>
    <text x="260" y="96" fill="#4a7a3a">…</text>
    <text x="330" y="96" fill="#555">j−1</text>
    <text x="400" y="96" fill="#555">j</text>
  </g>

  <!-- 矩形 -->
  <g filter="url(#rough2)">
    <rect x="160" y="112" width="270" height="240" fill="#f4f0fa" stroke="#7a4a8a" stroke-width="1.8" stroke-dasharray="7 5"/>
  </g>
  <!-- 两个对角 -->
  <g filter="url(#rough2)">
    <circle cx="400" cy="120" r="15" fill="#fde8e6" stroke="#b85450" stroke-width="2"/>
    <circle cx="190" cy="344" r="15" fill="#fde8e6" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="400" y="125" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">A_k</text>
  <text x="190" y="349" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">A_i</text>

  <!-- 交叉箭头 -->
  <line x1="398" y1="134" x2="200" y2="332" stroke="#7a4a8a" stroke-width="2" marker-end="url(#arr67g)" filter="url(#rough2)"/>
  <line x1="198" y1="332" x2="396" y2="134" stroke="#7a4a8a" stroke-width="2" marker-end="url(#arr67g)" filter="url(#rough2)"/>
  <text x="292" y="216" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#5a3a6a" filter="url(#rough2)">交换</text>
  <text x="292" y="236" text-anchor="middle" font-size="11.5" fill="#5a3a6a" filter="url(#rough2)">A_k ↦ B_j</text>
  <text x="292" y="254" text-anchor="middle" font-size="11.5" fill="#5a3a6a" filter="url(#rough2)">A_i ↦ B_l</text>

  <!-- 上下边：删除 -->
  <path d="M 210 120 L 380 120" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 4" fill="none" filter="url(#rough2)"/>
  <path d="M 210 344 L 380 344" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4 4" fill="none" filter="url(#rough2)"/>
  <text x="292" y="112" text-anchor="middle" font-size="10.5" fill="#8a2b28" filter="url(#rough2)">A_{k+1..i−1} 全删（(i−k−1)·t_d）</text>
  <text x="292" y="366" text-anchor="middle" font-size="10.5" fill="#8a2b28" filter="url(#rough2)">这些行都被删除</text>

  <!-- 左右边：插入 -->
  <text x="120" y="238" text-anchor="middle" font-size="10.5" fill="#2f5223" filter="url(#rough2)">B_{l+1..j−1}</text>
  <text x="120" y="254" text-anchor="middle" font-size="10.5" fill="#2f5223" filter="url(#rough2)">全是插入</text>
  <text x="120" y="270" text-anchor="middle" font-size="10.5" fill="#2f5223" filter="url(#rough2)">(j−l−1)·t_i</text>

  <!-- 角落状态 -->
  <g filter="url(#rough2)">
    <rect x="420" y="150" width="270" height="98" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="436" y="174" font-size="12.5" font-weight="bold" fill="#7a5a1b" filter="url(#rough2)">块代价（含空隙）</text>
  <text x="436" y="198" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">dp[k−1][l−1]</text>
  <text x="436" y="218" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">+ (i−k−1)·t_d + (j−l−1)·t_i</text>
  <text x="436" y="238" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">+ t_e + 两个替换项</text>

  <g filter="url(#rough2)">
    <rect x="420" y="266" width="270" height="80" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="436" y="290" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">单调性 ⇒ 同条件类取最大下标</text>
  <text x="436" y="312" font-size="11.5" fill="#2f5223" filter="url(#rough2)">更大的 k 只需多删几个字符就能达到</text>
  <text x="436" y="332" font-size="11.5" fill="#2f5223" filter="url(#rough2)">所以"最近出现位置"就是最优候选</text>
</svg>
