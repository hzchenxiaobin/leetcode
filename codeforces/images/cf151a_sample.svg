<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="453"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="250" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">样例 1：n=3, k=4, l=5, c=10, d=8, p=100, nl=3, np=1</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">取最小 ⇒ 2</text>
  <text x="450" y="104" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">饮料 20/9 = 2　　柠檬 80/3 = 26　　盐 100/3 = 33</text>
  <text x="450" y="146" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">min = 2</text>
  <text x="450" y="186" text-anchor="middle" font-size="11" fill="#8a2b28" filter="url(#rough2)">样例 3：盐只有 1 克而一次要 10 克 ⇒ 0</text>
</svg>
