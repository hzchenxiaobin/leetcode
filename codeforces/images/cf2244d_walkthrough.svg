<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="960" height="400" fill="#fafafa"/>
  <text x="480" y="34" text-anchor="middle" font-size="17" fill="#22303c" filter="url(#rough2)">四组官方样例走查：可翻段取绝对值，尾部原样相加</text>

  <!-- 表头 -->
  <rect x="32" y="58" width="64" height="36" rx="4" fill="#eef2f7" stroke="#8fa3b8" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="96" y="58" width="224" height="36" rx="4" fill="#eef2f7" stroke="#8fa3b8" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="320" y="58" width="150" height="36" rx="4" fill="#eef2f7" stroke="#8fa3b8" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="470" y="58" width="180" height="36" rx="4" fill="#eef2f7" stroke="#8fa3b8" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="650" y="58" width="150" height="36" rx="4" fill="#eef2f7" stroke="#8fa3b8" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="800" y="58" width="112" height="36" rx="4" fill="#eef2f7" stroke="#8fa3b8" stroke-width="1.3" filter="url(#rough2)"/>

  <text x="64" y="81" text-anchor="middle" font-size="13" fill="#22303c" filter="url(#rough2)">用例</text>
  <text x="208" y="81" text-anchor="middle" font-size="13" fill="#22303c" filter="url(#rough2)">a</text>
  <text x="395" y="81" text-anchor="middle" font-size="13" fill="#22303c" filter="url(#rough2)">b 升序</text>
  <text x="560" y="81" text-anchor="middle" font-size="13" fill="#22303c" filter="url(#rough2)">各段和 S_k</text>
  <text x="725" y="81" text-anchor="middle" font-size="13" fill="#22303c" filter="url(#rough2)">贡献</text>
  <text x="856" y="81" text-anchor="middle" font-size="13" fill="#22303c" filter="url(#rough2)">答案</text>

  <!-- 第 1 行 -->
  <rect x="32" y="94" width="64" height="58" rx="4" fill="#f7fafc" stroke="#c3ced9" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="96" y="94" width="224" height="58" rx="4" fill="#f7fafc" stroke="#c3ced9" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="320" y="94" width="150" height="58" rx="4" fill="#f7fafc" stroke="#c3ced9" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="470" y="94" width="180" height="58" rx="4" fill="#f7fafc" stroke="#c3ced9" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="650" y="94" width="150" height="58" rx="4" fill="#f7fafc" stroke="#c3ced9" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="800" y="94" width="112" height="58" rx="4" fill="#f7fafc" stroke="#c3ced9" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="64" y="128" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">#1</text>
  <text x="208" y="128" text-anchor="middle" font-size="13" fill="#22303c" filter="url(#rough2)">-1, 2, -3, 4, -5</text>
  <text x="395" y="128" text-anchor="middle" font-size="13" fill="#22303c" filter="url(#rough2)">1, 3, 5</text>
  <text x="560" y="128" text-anchor="middle" font-size="13" fill="#22303c" filter="url(#rough2)">-1 | -1 | -1</text>
  <text x="725" y="128" text-anchor="middle" font-size="13" fill="#2f5a2a" filter="url(#rough2)">1 + 1 + 1</text>
  <text x="856" y="128" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">3</text>

  <!-- 第 2 行 -->
  <rect x="32" y="152" width="64" height="58" rx="4" fill="#ffffff" stroke="#c3ced9" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="96" y="152" width="224" height="58" rx="4" fill="#ffffff" stroke="#c3ced9" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="320" y="152" width="150" height="58" rx="4" fill="#ffffff" stroke="#c3ced9" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="470" y="152" width="180" height="58" rx="4" fill="#ffffff" stroke="#c3ced9" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="650" y="152" width="150" height="58" rx="4" fill="#ffffff" stroke="#c3ced9" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="800" y="152" width="112" height="58" rx="4" fill="#ffffff" stroke="#c3ced9" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="64" y="186" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">#2</text>
  <text x="208" y="186" text-anchor="middle" font-size="13" fill="#22303c" filter="url(#rough2)">3, -1, 3, -1</text>
  <text x="395" y="186" text-anchor="middle" font-size="13" fill="#22303c" filter="url(#rough2)">2, 4</text>
  <text x="560" y="186" text-anchor="middle" font-size="13" fill="#22303c" filter="url(#rough2)">2 | 2</text>
  <text x="725" y="186" text-anchor="middle" font-size="13" fill="#2f5a2a" filter="url(#rough2)">2 + 2</text>
  <text x="856" y="186" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">4</text>

  <!-- 第 3 行 -->
  <rect x="32" y="210" width="64" height="58" rx="4" fill="#f7fafc" stroke="#c3ced9" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="96" y="210" width="224" height="58" rx="4" fill="#f7fafc" stroke="#c3ced9" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="320" y="210" width="150" height="58" rx="4" fill="#f7fafc" stroke="#c3ced9" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="470" y="210" width="180" height="58" rx="4" fill="#f7fafc" stroke="#c3ced9" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="650" y="210" width="150" height="58" rx="4" fill="#f7fafc" stroke="#c3ced9" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="800" y="210" width="112" height="58" rx="4" fill="#f7fafc" stroke="#c3ced9" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="64" y="244" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">#3</text>
  <text x="208" y="244" text-anchor="middle" font-size="13" fill="#22303c" filter="url(#rough2)">-5, -5, -5</text>
  <text x="395" y="244" text-anchor="middle" font-size="13" fill="#22303c" filter="url(#rough2)">2</text>
  <text x="560" y="244" text-anchor="middle" font-size="13" fill="#22303c" filter="url(#rough2)">-10</text>
  <text x="725" y="244" text-anchor="middle" font-size="13" fill="#2f5a2a" filter="url(#rough2)">10 - 5(尾)</text>
  <text x="856" y="244" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">5</text>

  <!-- 第 4 行 -->
  <rect x="32" y="268" width="64" height="58" rx="4" fill="#ffffff" stroke="#c3ced9" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="96" y="268" width="224" height="58" rx="4" fill="#ffffff" stroke="#c3ced9" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="320" y="268" width="150" height="58" rx="4" fill="#ffffff" stroke="#c3ced9" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="470" y="268" width="180" height="58" rx="4" fill="#ffffff" stroke="#c3ced9" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="650" y="268" width="150" height="58" rx="4" fill="#ffffff" stroke="#c3ced9" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="800" y="268" width="112" height="58" rx="4" fill="#ffffff" stroke="#c3ced9" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="64" y="302" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">#4</text>
  <text x="208" y="302" text-anchor="middle" font-size="13" fill="#22303c" filter="url(#rough2)">3, -1, 1, -3</text>
  <text x="395" y="302" text-anchor="middle" font-size="13" fill="#22303c" filter="url(#rough2)">2, 3, 4</text>
  <text x="560" y="302" text-anchor="middle" font-size="13" fill="#22303c" filter="url(#rough2)">2 | 1 | -3</text>
  <text x="725" y="302" text-anchor="middle" font-size="13" fill="#2f5a2a" filter="url(#rough2)">2 + 1 + 3</text>
  <text x="856" y="302" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">6</text>

  <text x="480" y="360" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">尾部 = (b_m, n] 的和：第 1、2、4 组 b_m = n 故尾部为空（0），第 3 组尾部是 a[3] = -5</text>
  <text x="480" y="384" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">第 3 组最能说明不对称性：前面的 -10 能翻成 +10，但尾巴上的 -5 只能认了</text>
</svg>
