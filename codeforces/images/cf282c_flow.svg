<svg xmlns="http://www.w3.org/2000/svg" width="700" height="330" viewBox="0 0 700 330"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="173"/>
    <feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></defs>
  <rect width="700" height="330" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">判定树：先看长度，再看"谁有 1"</text>
  <path d="M 170 40 Q 350 46 530 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="46" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="86" font-size="13" fill="#22314a" filter="url(#rough2)">|a| ≠ |b| ⇒ NO（操作不改变长度）</text>
  <g filter="url(#rough2)"><rect x="60" y="114" width="580" height="46" rx="8" fill="#f4f4f4" stroke="#888" stroke-width="1.3"/></g>
  <text x="76" y="142" font-size="13" fill="#333" filter="url(#rough2)">a 全是 0 ⇒ 一步也动不了 ⇒ YES ⟺ b 与 a 全等</text>
  <g filter="url(#rough2)"><rect x="60" y="170" width="580" height="46" rx="8" fill="#e8f4e0" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="198" font-size="13" fill="#2f5223" filter="url(#rough2)">a 里有 1 ⇒ YES ⟺ b 里也有 1</text>
  <g filter="url(#rough2)"><rect x="60" y="232" width="580" height="84" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="76" y="256" font-size="12.5" fill="#8a6015" filter="url(#rough2)">三个样例：11 → 10 为 YES（有 1 → 有 1）；</text>
  <text x="76" y="280" font-size="12.5" fill="#8a6015" filter="url(#rough2)">"1" → "01" 长度不同为 NO；000 → 101 源串全 0 且不等为 NO。</text>
  <text x="76" y="304" font-size="12" fill="#8a6015" filter="url(#rough2)">复杂度 O(|a|+|b|)，长度 ≤ 10⁶。</text>
</svg>
