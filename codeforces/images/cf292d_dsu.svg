<svg xmlns="http://www.w3.org/2000/svg" width="880" height="270" viewBox="0 0 880 270"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="270" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">前缀/后缀 DSU 快照</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">m*n 的内存：1e4 x 500</text>
  <text x="150" y="105" text-anchor="start" font-size="13" fill="#2b2b2b" filter="url(#rough2)">查询 (l,r)：只保留编号 &lt;l 与 &gt;r 的边</text>
  <text x="150" y="145" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">预处理前缀 DSU 快照 pre[i] 与后缀快照 suf[i]（n&lt;=500）</text>
  <text x="150" y="185" text-anchor="start" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">每次查询把两份父数组合并一次，O(n alpha(n))</text>
</svg>
