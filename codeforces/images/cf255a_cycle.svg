<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="300" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">训练按 chest / biceps / back 循环</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">第 i 个动作归到 (i-1) mod 3 对应的部位，把次数分别累加</text>
  <g filter="url(#rough2)"><rect x="120" y="110" width="74" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="157.0" y="137.04" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">a1</text>
  <text x="157" y="178" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">chest</text>
  <g filter="url(#rough2)"><rect x="210" y="110" width="74" height="44" rx="4" fill="#cfe0f0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="247.0" y="137.04" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">a2</text>
  <text x="247" y="178" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">biceps</text>
  <g filter="url(#rough2)"><rect x="300" y="110" width="74" height="44" rx="4" fill="#f6e3c4" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="337.0" y="137.04" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">a3</text>
  <text x="337" y="178" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">back</text>
  <g filter="url(#rough2)"><rect x="390" y="110" width="74" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="427.0" y="137.04" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">a4</text>
  <text x="427" y="178" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">chest</text>
  <g filter="url(#rough2)"><rect x="480" y="110" width="74" height="44" rx="4" fill="#cfe0f0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="517.0" y="137.04" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">a5</text>
  <text x="517" y="178" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">biceps</text>
  <g filter="url(#rough2)"><rect x="570" y="110" width="74" height="44" rx="4" fill="#f6e3c4" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="607.0" y="137.04" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">a6</text>
  <text x="607" y="178" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">back</text>
  <g filter="url(#rough2)"><rect x="660" y="110" width="74" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="697.0" y="137.04" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">a7</text>
  <text x="697" y="178" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">chest</text>
  <text x="440" y="232" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">第 1、4、7… 个动作练 chest；第 2、5、8… 练 biceps；第 3、6、9… 练 back</text>
  <text x="440" y="264" text-anchor="middle" font-size="13" fill="#3d6b2f" filter="url(#rough2)">答案 = 三组和里最大的那个部位名</text>
</svg>
