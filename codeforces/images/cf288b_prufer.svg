<svg xmlns="http://www.w3.org/2000/svg" width="700" height="280" viewBox="0 0 700 280"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="433"/>
    <feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></defs>
  <rect width="700" height="280" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">k^(k−1) 是怎么来的</text>
  <path d="M 190 40 Q 350 46 510 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="70" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="12.5" fill="#22314a" filter="url(#rough2)">条件"每个点都能走到 1 且 1 在环上" ⟺ 用 p₁..p_k 连出的无向图是一棵生成树且 1 是根。</text>
  <text x="76" y="106" font-size="12.5" fill="#22314a" filter="url(#rough2)">Cayley 公式：k 个点的标号树有 k^(k−2) 棵；指定"根指向自己所在的环"…</text>
  <g filter="url(#rough2)"><rect x="60" y="142" width="580" height="70" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="166" font-size="12.5" fill="#2f5223" filter="url(#rough2)">更直接的算法：k=1 时 p₁=1（1 种）；对 k≥2，经典结论是"每个点最终到 1、1 在环上"的</text>
  <text x="76" y="190" font-size="12.5" fill="#2f5223" filter="url(#rough2)">函数个数 = k^(k−1)。可用 k=2 手验：p₁=1,p₂=1 与 p₁=2,p₂=1 共 2 = 2¹ ✓。</text>
  <g filter="url(#rough2)"><rect x="60" y="222" width="580" height="46" rx="8" fill="#fbeeee" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="76" y="250" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">两段独立相乘；k=n 时 (n−k)^(n−k) = 0⁰ 记为 1。</text>
</svg>
