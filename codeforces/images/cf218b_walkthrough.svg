<svg xmlns="http://www.w3.org/2000/svg" width="840" height="460" viewBox="0 0 840 460"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="460" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2 走查：2 2 2，n = 4 → 7 6</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">最大每次都挑"还剩最多空座"的飞机；最小每次都挑"还剩最少空座"的飞机</text>
  <text x="150" y="86" text-anchor="start" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">最大策略</text>
  <text x="150" y="106" text-anchor="start" font-size="11.5" fill="#666666" filter="url(#rough2)">每次挑空座最多 → 2 2 2 1</text>
  <g filter="url(#rough2)"><rect x="150" y="120" width="60" height="36" rx="4" fill="#d7ecd0" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="180" y="143" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="180" y="172" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">第1人</text>
  <g filter="url(#rough2)"><rect x="216" y="120" width="60" height="36" rx="4" fill="#d7ecd0" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="246" y="143" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="246" y="172" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">第2人</text>
  <g filter="url(#rough2)"><rect x="282" y="120" width="60" height="36" rx="4" fill="#d7ecd0" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="312" y="143" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="312" y="172" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">第3人</text>
  <g filter="url(#rough2)"><rect x="348" y="120" width="60" height="36" rx="4" fill="#d7ecd0" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="378" y="143" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="378" y="172" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">第4人</text>
  <text x="150" y="205" text-anchor="start" font-size="13" font-weight="bold" fill="#3d6b2f" filter="url(#rough2)">总和 = 2+2+2+1 = 7</text>
  <text x="150" y="246" text-anchor="start" font-size="13" font-weight="bold" fill="#a0522d" filter="url(#rough2)">最小策略</text>
  <text x="150" y="266" text-anchor="start" font-size="11.5" fill="#666666" filter="url(#rough2)">每次挑空座最少 → 2 1 2 1</text>
  <g filter="url(#rough2)"><rect x="150" y="280" width="60" height="36" rx="4" fill="#f6e3c4" fill-opacity="0.9" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="180" y="303" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="180" y="332" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">第1人</text>
  <g filter="url(#rough2)"><rect x="216" y="280" width="60" height="36" rx="4" fill="#f6e3c4" fill-opacity="0.9" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="246" y="303" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="246" y="332" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">第2人</text>
  <g filter="url(#rough2)"><rect x="282" y="280" width="60" height="36" rx="4" fill="#f6e3c4" fill-opacity="0.9" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="312" y="303" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="312" y="332" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">第3人</text>
  <g filter="url(#rough2)"><rect x="348" y="280" width="60" height="36" rx="4" fill="#f6e3c4" fill-opacity="0.9" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="378" y="303" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="378" y="332" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">第4人</text>
  <text x="150" y="365" text-anchor="start" font-size="13" font-weight="bold" fill="#8a4b2a" filter="url(#rough2)">总和 = 2+1+2+1 = 6</text>
  <g filter="url(#rough2)"><rect x="520" y="120" width="290" height="120" rx="4" fill="#faf3ec" fill-opacity="0.85" stroke="#c8a48a" stroke-width="1.3"/></g>
  <text x="665" y="146" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a4b2a" filter="url(#rough2)">为什么最小不是 2+2+1+1？</text>
  <text x="665" y="172" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">那需要两位乘客都去同两架…</text>
  <text x="665" y="194" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">实际按最小的贪心：先坐空一架</text>
  <text x="665" y="216" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">（2,1），再坐空第二架（2,1）</text>
</svg>
