<svg xmlns="http://www.w3.org/2000/svg" width="880" height="478" viewBox="0 0 880 478"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="101"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="478" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">路径上的每个格子都记一次分 f(a,b) = (x_a + y_b) mod p</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">从 (0,0) 走到 (n−1,m−1)，共 n+m−1 个格子被计分</text>
  <g filter="url(#rough2)"><rect x="110" y="96" width="52" height="52" rx="3" fill="#d7ecd0" fill-opacity="0.55" stroke="#6a9a58" stroke-width="1.4"/></g>
  <text x="136.0" y="124.0" text-anchor="middle" font-size="9.5" fill="#666666" filter="url(#rough2)">(0,0)</text>
  <g filter="url(#rough2)"><rect x="170" y="96" width="52" height="52" rx="3" fill="#d7ecd0" fill-opacity="0.55" stroke="#6a9a58" stroke-width="1.4"/></g>
  <text x="196.0" y="124.0" text-anchor="middle" font-size="9.5" fill="#666666" filter="url(#rough2)">(0,1)</text>
  <g filter="url(#rough2)"><rect x="230" y="96" width="52" height="52" rx="3" fill="#d7ecd0" fill-opacity="0.55" stroke="#6a9a58" stroke-width="1.4"/></g>
  <text x="256.0" y="124.0" text-anchor="middle" font-size="9.5" fill="#666666" filter="url(#rough2)">(0,2)</text>
  <g filter="url(#rough2)"><rect x="290" y="96" width="52" height="52" rx="3" fill="#d7ecd0" fill-opacity="0.55" stroke="#6a9a58" stroke-width="1.4"/></g>
  <text x="316.0" y="124.0" text-anchor="middle" font-size="9.5" fill="#666666" filter="url(#rough2)">(0,3)</text>
  <text x="96" y="118" text-anchor="end" font-size="11" fill="#777777" filter="url(#rough2)">a=0</text>
  <g filter="url(#rough2)"><rect x="110" y="156" width="52" height="52" rx="3" fill="#d7ecd0" fill-opacity="0.55" stroke="#6a9a58" stroke-width="1.4"/></g>
  <text x="136.0" y="184.0" text-anchor="middle" font-size="9.5" fill="#666666" filter="url(#rough2)">(1,0)</text>
  <g filter="url(#rough2)"><rect x="170" y="156" width="52" height="52" rx="3" fill="#d7ecd0" fill-opacity="0.55" stroke="#6a9a58" stroke-width="1.4"/></g>
  <text x="196.0" y="184.0" text-anchor="middle" font-size="9.5" fill="#666666" filter="url(#rough2)">(1,1)</text>
  <g filter="url(#rough2)"><rect x="230" y="156" width="52" height="52" rx="3" fill="#d7ecd0" fill-opacity="0.55" stroke="#6a9a58" stroke-width="1.4"/></g>
  <text x="256.0" y="184.0" text-anchor="middle" font-size="9.5" fill="#666666" filter="url(#rough2)">(1,2)</text>
  <g filter="url(#rough2)"><rect x="290" y="156" width="52" height="52" rx="3" fill="#ffffff" fill-opacity="0.85" stroke="#c8c8c8" stroke-width="1.0"/></g>
  <text x="316.0" y="184.0" text-anchor="middle" font-size="9.5" fill="#666666" filter="url(#rough2)">(1,3)</text>
  <text x="96" y="178" text-anchor="end" font-size="11" fill="#777777" filter="url(#rough2)">a=1</text>
  <g filter="url(#rough2)"><rect x="110" y="216" width="52" height="52" rx="3" fill="#d7ecd0" fill-opacity="0.55" stroke="#6a9a58" stroke-width="1.4"/></g>
  <text x="136.0" y="244.0" text-anchor="middle" font-size="9.5" fill="#666666" filter="url(#rough2)">(2,0)</text>
  <g filter="url(#rough2)"><rect x="170" y="216" width="52" height="52" rx="3" fill="#ffffff" fill-opacity="0.85" stroke="#c8c8c8" stroke-width="1.0"/></g>
  <text x="196.0" y="244.0" text-anchor="middle" font-size="9.5" fill="#666666" filter="url(#rough2)">(2,1)</text>
  <g filter="url(#rough2)"><rect x="230" y="216" width="52" height="52" rx="3" fill="#d7ecd0" fill-opacity="0.55" stroke="#6a9a58" stroke-width="1.4"/></g>
  <text x="256.0" y="244.0" text-anchor="middle" font-size="9.5" fill="#666666" filter="url(#rough2)">(2,2)</text>
  <g filter="url(#rough2)"><rect x="290" y="216" width="52" height="52" rx="3" fill="#d7ecd0" fill-opacity="0.55" stroke="#6a9a58" stroke-width="1.4"/></g>
  <text x="316.0" y="244.0" text-anchor="middle" font-size="9.5" fill="#666666" filter="url(#rough2)">(2,3)</text>
  <text x="96" y="238" text-anchor="end" font-size="11" fill="#777777" filter="url(#rough2)">a=2</text>
  <g filter="url(#rough2)"><rect x="110" y="276" width="52" height="52" rx="3" fill="#d7ecd0" fill-opacity="0.55" stroke="#6a9a58" stroke-width="1.4"/></g>
  <text x="136.0" y="304.0" text-anchor="middle" font-size="9.5" fill="#666666" filter="url(#rough2)">(3,0)</text>
  <g filter="url(#rough2)"><rect x="170" y="276" width="52" height="52" rx="3" fill="#ffffff" fill-opacity="0.85" stroke="#c8c8c8" stroke-width="1.0"/></g>
  <text x="196.0" y="304.0" text-anchor="middle" font-size="9.5" fill="#666666" filter="url(#rough2)">(3,1)</text>
  <g filter="url(#rough2)"><rect x="230" y="276" width="52" height="52" rx="3" fill="#ffffff" fill-opacity="0.85" stroke="#c8c8c8" stroke-width="1.0"/></g>
  <text x="256.0" y="304.0" text-anchor="middle" font-size="9.5" fill="#666666" filter="url(#rough2)">(3,2)</text>
  <g filter="url(#rough2)"><rect x="290" y="276" width="52" height="52" rx="3" fill="#d7ecd0" fill-opacity="0.55" stroke="#6a9a58" stroke-width="1.4"/></g>
  <text x="316.0" y="304.0" text-anchor="middle" font-size="9.5" fill="#666666" filter="url(#rough2)">(3,3)</text>
  <text x="96" y="298" text-anchor="end" font-size="11" fill="#777777" filter="url(#rough2)">a=3</text>
  <text x="136.0" y="86" text-anchor="middle" font-size="11" fill="#777777" filter="url(#rough2)">b=0</text>
  <text x="196.0" y="86" text-anchor="middle" font-size="11" fill="#777777" filter="url(#rough2)">b=1</text>
  <text x="256.0" y="86" text-anchor="middle" font-size="11" fill="#777777" filter="url(#rough2)">b=2</text>
  <text x="316.0" y="86" text-anchor="middle" font-size="11" fill="#777777" filter="url(#rough2)">b=3</text>
  <text x="440" y="384" text-anchor="middle" font-size="13.5" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">dp[a][b] = f(a,b) + max(dp[a−1][b], dp[a][b−1])</text>
  <text x="440" y="408" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">答案 dp[n−1][m−1]；O(nm) 个状态（n,m ≤ 20000 → 4×10⁸）</text>
  <text x="440" y="432" text-anchor="middle" font-size="11.5" fill="#3d6b2f" filter="url(#rough2)">绿色格子是一条合法的单调路径（每步只能向右或向下）</text>
  <text x="440" y="456" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">f 用预计算表 mt[x_a + y_b] 取模（和 ≤ 40000），每个格子只做一次查表</text>
</svg>
