<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="720" height="420" fill="#fafafa"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">三种答案对应的形状</text>
  <path d="M 200 43 Q 360 49 520 43" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="80" y="80" text-anchor="start" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">① 一个矩形（1 次）</text>
  <rect x="90" y="96" width="150" height="40" rx="4" fill="#e9f4e2" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="165" y="121" text-anchor="middle" font-size="9.5" fill="#2f5223" filter="url(#rough2)">a 在行首、b 在行尾</text>
  <rect x="90" y="146" width="150" height="40" rx="4" fill="#e9f4e2" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="165" y="171" text-anchor="middle" font-size="9.5" fill="#2f5223" filter="url(#rough2)">或 a、b 同一行</text>
  <text x="300" y="80" text-anchor="start" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">② 两个矩形（2 次）</text>
  <rect x="300" y="96" width="190" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="395" y="119" text-anchor="middle" font-size="9.5" fill="#8a6015" filter="url(#rough2)">a 在行首（上缺一块）</text>
  <rect x="300" y="142" width="190" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="395" y="165" text-anchor="middle" font-size="9.5" fill="#8a6015" filter="url(#rough2)">b 在行尾（下缺一块）</text>
  <rect x="300" y="188" width="190" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="395" y="211" text-anchor="middle" font-size="9.5" fill="#8a6015" filter="url(#rough2)">只有两行（各一行）</text>
  <rect x="300" y="234" width="190" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="395" y="257" text-anchor="middle" font-size="9.5" fill="#8a6015" filter="url(#rough2)">b 的列 = a 的列 − 1</text>
  <text x="530" y="80" text-anchor="start" font-size="12" font-weight="bold" fill="#7a5aa0" filter="url(#rough2)">③ 三个矩形（3 次）</text>
  <rect x="530" y="96" width="150" height="36" rx="4" fill="#f0eafa" stroke="#7a5aa0" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="605" y="119" text-anchor="middle" font-size="9.5" fill="#4b3a6b" filter="url(#rough2)">首行一段</text>
  <rect x="530" y="142" width="150" height="36" rx="4" fill="#f0eafa" stroke="#7a5aa0" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="605" y="165" text-anchor="middle" font-size="9.5" fill="#4b3a6b" filter="url(#rough2)">中间整行</text>
  <rect x="530" y="188" width="150" height="36" rx="4" fill="#f0eafa" stroke="#7a5aa0" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="605" y="211" text-anchor="middle" font-size="9.5" fill="#4b3a6b" filter="url(#rough2)">末行一段</text>
  <text x="60" y="270" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">判定用的量：ra、rb（行号）、ca、cb（列号）、eb（b 所在行实际长度）。</text>
  <rect x="60" y="292" width="620" height="56" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="76" y="316" text-anchor="start" font-size="11.5" fill="#446688" filter="url(#rough2)">if ra==rb → 1；if ca==0 且 cb==eb-1 → 1；</text>
  <text x="76" y="338" text-anchor="start" font-size="11.5" fill="#446688" filter="url(#rough2)">if ca==0 或 cb==eb-1 或 rb==ra+1 或 ca==cb+1 → 2；否则 3。</text>
  <text x="60" y="386" text-anchor="start" font-size="10.5" fill="#777777" filter="url(#rough2)">该分类在 n≤16、m≤6 的全部 4896 组数据上与穷举（枚举 1/2 个矩形）完全一致。</text>
</svg>
