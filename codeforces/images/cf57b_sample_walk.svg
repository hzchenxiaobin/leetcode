<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="241"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="d57" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1 走查：两条路叠加成 1, 3, 5, 7, 5，查询第 3 格得 5</text>
  <path d="M 80 40 Q 360 46 640 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 列：5 个格子，x 从 150 起，宽 84 -->
  <g filter="url(#rough2)" font-size="11" fill="#666">
    <text x="192" y="66" text-anchor="middle">格子 1</text>
    <text x="276" y="66" text-anchor="middle">格子 2</text>
    <text x="360" y="66" text-anchor="middle">格子 3</text>
    <text x="444" y="66" text-anchor="middle">格子 4</text>
    <text x="528" y="66" text-anchor="middle">格子 5</text>
  </g>

  <!-- 路 1 -->
  <text x="20" y="106" font-size="11.5" fill="#2f5223" filter="url(#rough2)">(1,5,1)</text>
  <g filter="url(#rough2)" font-size="13">
    <rect x="150" y="86" width="84" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="192" y="107" text-anchor="middle" fill="#2f5223">1</text>
    <rect x="234" y="86" width="84" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="276" y="107" text-anchor="middle" fill="#2f5223">2</text>
    <rect x="318" y="86" width="84" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="360" y="107" text-anchor="middle" fill="#2f5223">3</text>
    <rect x="402" y="86" width="84" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="444" y="107" text-anchor="middle" fill="#2f5223">4</text>
    <rect x="486" y="86" width="84" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="528" y="107" text-anchor="middle" fill="#2f5223">5</text>
  </g>

  <!-- 路 2 -->
  <text x="20" y="150" font-size="11.5" fill="#8a6015" filter="url(#rough2)">(2,4,1)</text>
  <g filter="url(#rough2)" font-size="13">
    <rect x="150" y="130" width="84" height="30" fill="#ffffff" stroke="#d9d9d9" stroke-width="1.2"/>
    <text x="192" y="151" text-anchor="middle" fill="#bbb">–</text>
    <rect x="234" y="130" width="84" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <text x="276" y="151" text-anchor="middle" fill="#8a6015">1</text>
    <rect x="318" y="130" width="84" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <text x="360" y="151" text-anchor="middle" fill="#8a6015">2</text>
    <rect x="402" y="130" width="84" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <text x="444" y="151" text-anchor="middle" fill="#8a6015">3</text>
    <rect x="486" y="130" width="84" height="30" fill="#ffffff" stroke="#d9d9d9" stroke-width="1.2"/>
    <text x="528" y="151" text-anchor="middle" fill="#bbb">–</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 60 170 L 620 170" stroke="#9bb0c4" stroke-width="1.2" stroke-dasharray="6 4"/>
  </g>

  <!-- 合计 -->
  <text x="20" y="200" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">合计</text>
  <g filter="url(#rough2)" font-size="15">
    <rect x="150" y="180" width="84" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <text x="192" y="204" text-anchor="middle" font-weight="bold" fill="#2b2b2b">1</text>
    <rect x="234" y="180" width="84" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <text x="276" y="204" text-anchor="middle" font-weight="bold" fill="#2b2b2b">3</text>
    <rect x="318" y="180" width="84" height="34" fill="#fdecea" stroke="#b85450" stroke-width="2.2"/>
    <text x="360" y="204" text-anchor="middle" font-weight="bold" fill="#b85450">5</text>
    <rect x="402" y="180" width="84" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <text x="444" y="204" text-anchor="middle" font-weight="bold" fill="#2b2b2b">7</text>
    <rect x="486" y="180" width="84" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <text x="528" y="204" text-anchor="middle" font-weight="bold" fill="#2b2b2b">5</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 360 216 L 360 240" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#d57)"/>
  </g>
  <text x="360" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">查询格子 3 → 输出 5</text>

  <!-- 差分视角 -->
  <g filter="url(#rough2)">
    <rect x="50" y="284" width="620" height="112" rx="12" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
    <text x="66" y="308" font-size="12.5" font-weight="bold" fill="#2f4a66">用两个差分算同样的结果</text>
    <text x="66" y="332" font-size="11.5" fill="#2b2b2b">dCoef：+1@1，−1@6，+1@2，−1@5　⇒　K = (1, 2, 2, 2, 1)</text>
    <text x="66" y="352" font-size="11.5" fill="#2b2b2b">dConst：0@1，0@6，−1@2，+1@5　⇒　C = (0, −1, −1, −1, 0)</text>
    <line x1="66" y1="362" x2="654" y2="362" stroke="#9bb0c4" stroke-width="1"/>
    <text x="66" y="384" font-size="11.5" font-weight="bold" fill="#2f5223">v_p = K_p·p + C_p：1·1+0=1，2·2−1=3，2·3−1=5，2·4−1=7，1·5+0=5 ✓</text>
  </g>

  <text x="360" y="420" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">每个格子只被 O(1) 次差分修改影响，最后一遍前缀和即可得到全部 v_p。</text>
</svg>
