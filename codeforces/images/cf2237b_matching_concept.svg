<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="430" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">加法阶段 = 给每个位置认领一个 b_j，且 b_j ≥ a_i</text>
  <text x="300" y="46" text-anchor="middle" font-size="10.5" fill="#888">b 严格递增 ⇒ 位置 i 能认领的槽位是后缀 [L_i, n]，每列恰好被认领一次</text>

  <text x="165" y="88" text-anchor="end" font-size="11" fill="#446688">目标槽位 b_j</text>

  <text x="214" y="88" text-anchor="middle" font-size="11" fill="#446688">b₁=3</text>
  <text x="292" y="88" text-anchor="middle" font-size="11" fill="#446688">b₂=6</text>
  <text x="370" y="88" text-anchor="middle" font-size="11" fill="#446688">b₃=8</text>
  <text x="448" y="88" text-anchor="middle" font-size="11" fill="#446688">b₄=9</text>
  <text x="526" y="88" text-anchor="middle" font-size="11" fill="#446688">b₅=10</text>

  <text x="165" y="122" text-anchor="end" font-size="10.5" fill="#555">位置 1，a=10</text>
  <text x="165" y="158" text-anchor="end" font-size="10.5" fill="#555">位置 2，a=3</text>
  <text x="165" y="194" text-anchor="end" font-size="10.5" fill="#555">位置 3，a=8</text>
  <text x="165" y="230" text-anchor="end" font-size="10.5" fill="#555">位置 4，a=6</text>
  <text x="165" y="266" text-anchor="end" font-size="10.5" fill="#555">位置 5，a=9</text>

  <g filter="url(#rough2)">
    <rect x="175" y="100" width="78" height="36" fill="#f4f4f4" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="253" y="100" width="78" height="36" fill="#f4f4f4" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="331" y="100" width="78" height="36" fill="#f4f4f4" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="409" y="100" width="78" height="36" fill="#f4f4f4" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="487" y="100" width="78" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3"/>
    <text x="526" y="124" text-anchor="middle" font-size="13" fill="#8a6a20" font-weight="bold">1</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="175" y="136" width="78" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3"/>
    <text x="214" y="160" text-anchor="middle" font-size="13" fill="#8a6a20" font-weight="bold">2</text>
    <rect x="253" y="136" width="78" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="331" y="136" width="78" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="409" y="136" width="78" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="487" y="136" width="78" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>

  <g filter="url(#rough2)">
    <rect x="175" y="172" width="78" height="36" fill="#f4f4f4" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="253" y="172" width="78" height="36" fill="#f4f4f4" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="331" y="172" width="78" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3"/>
    <text x="370" y="196" text-anchor="middle" font-size="13" fill="#8a6a20" font-weight="bold">3</text>
    <rect x="409" y="172" width="78" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="487" y="172" width="78" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>

  <g filter="url(#rough2)">
    <rect x="175" y="208" width="78" height="36" fill="#f4f4f4" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="253" y="208" width="78" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3"/>
    <text x="292" y="232" text-anchor="middle" font-size="13" fill="#8a6a20" font-weight="bold">4</text>
    <rect x="331" y="208" width="78" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="409" y="208" width="78" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="487" y="208" width="78" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>

  <g filter="url(#rough2)">
    <rect x="175" y="244" width="78" height="36" fill="#f4f4f4" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="253" y="244" width="78" height="36" fill="#f4f4f4" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="331" y="244" width="78" height="36" fill="#f4f4f4" stroke="#bbbbbb" stroke-width="1"/>
    <rect x="409" y="244" width="78" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3"/>
    <text x="448" y="268" text-anchor="middle" font-size="13" fill="#8a6a20" font-weight="bold">5</text>
    <rect x="487" y="244" width="78" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>

  <g filter="url(#rough2)">
    <rect x="118" y="296" width="18" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2"/>
    <text x="142" y="307" font-size="10" fill="#555">允许（b_j ≥ a_i）</text>
    <rect x="292" y="296" width="18" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="2"/>
    <text x="316" y="307" font-size="10" fill="#555">第 i 步认领</text>
    <rect x="438" y="296" width="18" height="14" fill="#f4f4f4" stroke="#bbbbbb" stroke-width="1" rx="2"/>
    <text x="462" y="307" font-size="10" fill="#555">禁止（b_j &lt; a_i）</text>
  </g>

  <text x="300" y="344" text-anchor="middle" font-size="11" fill="#3a5a30">每列恰好被认领一次 ⇒ 认领序列 p = (5, 1, 3, 2, 4) 是 n 元排列</text>
  <text x="300" y="368" text-anchor="middle" font-size="11" fill="#3a5a30">交换阶段的最少次数 = p 的逆序对数 inv(p) = 5</text>
  <text x="300" y="392" text-anchor="middle" font-size="10.5" fill="#8a6a20">贪心规则：每行认领「最靠左的未占用允许列」</text>
  <text x="300" y="414" text-anchor="middle" font-size="10" fill="#888">不允许的槽位（灰色）永远不能选；被认领过的列也不能再选</text>
</svg>
