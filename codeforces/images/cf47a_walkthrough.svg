<svg xmlns="http://www.w3.org/2000/svg" width="760" height="310" viewBox="0 0 760 310"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="473"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="310" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">A：三个样例与三角数表</text>
  <path d="M 220 40 Q 380 45 540 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <text x="60" y="72" font-size="11.5" fill="#555" filter="url(#rough2)">前若干个三角数：</text>
  <rect x="60" y="84" width="640" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="72" y="107" font-size="11" fill="#2f4a66" font-family="'Courier New',monospace" filter="url(#rough2)">1  3  6  10  15  21  28  36  45  55  66  78  91  105  120  136  153  171  190  210</text>

  <rect x="60" y="136" width="200" height="70" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="72" y="160" font-size="11.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">样例 1：n = 1</text>
  <text x="72" y="182" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">1 = T(1) ✓</text>
  <text x="72" y="200" font-size="10.5" fill="#2f5223" filter="url(#rough2)">输出 YES</text>

  <rect x="276" y="136" width="200" height="70" rx="10" fill="#fdeceb" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="288" y="160" font-size="11.5" font-weight="bold" fill="#8c3a36" filter="url(#rough2)">样例 2：n = 2</text>
  <text x="288" y="182" font-size="10.5" fill="#8c3a36" filter="url(#rough2)">T(1)=1 &lt; 2 &lt; 3=T(2)</text>
  <text x="288" y="200" font-size="10.5" fill="#8c3a36" filter="url(#rough2)">输出 NO</text>

  <rect x="492" y="136" width="208" height="70" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="504" y="160" font-size="11.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">样例 3：n = 3</text>
  <text x="504" y="182" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">3 = T(2) = 1+2 ✓</text>
  <text x="504" y="200" font-size="10.5" fill="#2f5223" filter="url(#rough2)">输出 YES</text>

  <rect x="60" y="224" width="640" height="66" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="72" y="248" font-size="11" fill="#8a6015" filter="url(#rough2)">枚举时用 k(k+1)/2 与 n 比较：只要当前三角数 ≤ n 就继续；相等输出 YES，超过 n 就输出 NO。</text>
  <text x="72" y="270" font-size="11" fill="#8a6015" filter="url(#rough2)">n ≤ 500，最多 31 轮；用 long long 计算乘积，避免 (k+1) 溢出（虽然本题不会）。</text>
</svg>
