<svg xmlns="http://www.w3.org/2000/svg" width="880" height="404" viewBox="0 0 880 404"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="101"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="404" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">dp[t] = Σ dp[u]，u 取遍 [s, t−1]</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">一条 s→t 的公交可以从区间内任一停靠点上车</text>
  <text x="90" y="100" text-anchor="start" font-size="11.5" fill="#555555" font-weight="bold" filter="url(#rough2)">停靠点</text>
  <g filter="url(#rough2)"><circle cx="140" cy="150" r="16" fill="#f6e3c4" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="140" y="155" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)"><circle cx="240" cy="150" r="16" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="240" y="155" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><circle cx="340" cy="150" r="16" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="340" y="155" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><circle cx="440" cy="150" r="16" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="440" y="155" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><circle cx="540" cy="150" r="16" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="540" y="155" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><circle cx="640" cy="150" r="16" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="640" y="155" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <g filter="url(#rough2)"><line x1="258" y1="126" x2="522" y2="126" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrg)"/></g>
  <text x="390.0" y="118" text-anchor="middle" font-size="11.5" fill="#3d6b2f" filter="url(#rough2)">公交 (1 → 4)</text>
  <text x="564" y="132" text-anchor="start" font-size="11" fill="#8a2b28" filter="url(#rough2)">终点 t=4</text>
  <text x="440" y="214" text-anchor="middle" font-size="13" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">dp[4] += dp[1] + dp[2] + dp[3]</text>
  <g filter="url(#rough2)"><rect x="90" y="244" width="700" height="66" rx="4" fill="#ffffff" fill-opacity="0.0" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="5 4"/></g>
  <text x="440" y="268" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">按 t 升序处理公交；[s,t−1] 的区间和用树状数组 + 坐标压缩（n 可达 10⁹）</text>
  <text x="440" y="292" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">同一 t 的多条公交互不影响（查询区间不含 t），累加后再计入树状数组即可</text>
  <text x="440" y="344" text-anchor="middle" font-size="12" fill="#8a2b28" filter="url(#rough2)">答案 = dp[n]，起点 dp[0] = 1</text>
</svg>
