<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 w = 8：七种拆法里挑出偶数 + 偶数</text>
  <path d="M 150 44 Q 360 50 570 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 左：两种成功拆法 -->
  <text x="40" y="78" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">8 = 2 + 6  ✓</text>
  <g filter="url(#rough2)">
    <rect x="40" y="84" width="80" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="120" y="84" width="240" height="36" fill="#eef7f0" stroke="#4a7a3a" stroke-width="1.3"/>
    <line x1="120" y1="80" x2="120" y2="124" stroke="#b85450" stroke-width="2.2" stroke-dasharray="5 3"/>
  </g>
  <text x="80" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5223" filter="url(#rough2)">2</text>
  <text x="240" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5223" filter="url(#rough2)">6</text>

  <text x="40" y="144" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">8 = 4 + 4  ✓</text>
  <g filter="url(#rough2)">
    <rect x="40" y="150" width="160" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="200" y="150" width="160" height="36" fill="#eef7f0" stroke="#4a7a3a" stroke-width="1.3"/>
    <line x1="200" y1="146" x2="200" y2="190" stroke="#b85450" stroke-width="2.2" stroke-dasharray="5 3"/>
  </g>
  <text x="120" y="174" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5223" filter="url(#rough2)">4</text>
  <text x="280" y="174" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5223" filter="url(#rough2)">4</text>

  <!-- 左：结论 -->
  <rect x="40" y="216" width="330" height="92" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="58" y="242" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">w = 8 是偶数，且 8 ≥ 4</text>
  <text x="58" y="266" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">取 2 + 6（或 4 + 4）两块都是正偶数</text>
  <text x="58" y="292" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">⇒ 输出 YES</text>

  <rect x="40" y="326" width="330" height="66" rx="10" fill="#fff8f7" stroke="#d99a96" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="58" y="352" font-size="12" fill="#7a3a35" filter="url(#rough2)">对照 w = 2：唯一拆法是 1 + 1</text>
  <text x="58" y="376" font-size="12" fill="#7a3a35" filter="url(#rough2)">两块都是奇数 ⇒ 输出 NO</text>

  <!-- 右：全部拆法表 -->
  <rect x="400" y="56" width="290" height="300" rx="10" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="420" y="80" font-size="11.5" fill="#777" filter="url(#rough2)">拆法</text>
  <text x="500" y="80" font-size="11.5" fill="#777" filter="url(#rough2)">两块都偶？</text>
  <text x="640" y="80" font-size="11.5" fill="#777" filter="url(#rough2)">可行</text>

  <g filter="url(#rough2)">
    <rect x="408" y="90" width="274" height="26" fill="#ffffff" stroke="#e3ded4" stroke-width="1"/>
    <rect x="408" y="122" width="274" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/>
    <rect x="408" y="154" width="274" height="26" fill="#ffffff" stroke="#e3ded4" stroke-width="1"/>
    <rect x="408" y="186" width="274" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/>
    <rect x="408" y="218" width="274" height="26" fill="#ffffff" stroke="#e3ded4" stroke-width="1"/>
    <rect x="408" y="250" width="274" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/>
    <rect x="408" y="282" width="274" height="26" fill="#ffffff" stroke="#e3ded4" stroke-width="1"/>
  </g>
  <text x="422" y="108" font-size="13" fill="#2b2b2b" filter="url(#rough2)">1 + 7</text>
  <text x="422" y="140" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">2 + 6</text>
  <text x="422" y="172" font-size="13" fill="#2b2b2b" filter="url(#rough2)">3 + 5</text>
  <text x="422" y="204" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">4 + 4</text>
  <text x="422" y="236" font-size="13" fill="#2b2b2b" filter="url(#rough2)">5 + 3</text>
  <text x="422" y="268" font-size="13" fill="#2b2b2b" filter="url(#rough2)">6 + 2</text>
  <text x="422" y="300" font-size="13" fill="#2b2b2b" filter="url(#rough2)">7 + 1</text>

  <text x="508" y="108" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <text x="508" y="140" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <text x="508" y="172" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <text x="508" y="204" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <text x="508" y="236" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <text x="508" y="268" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <text x="508" y="300" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>

  <text x="644" y="108" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="644" y="140" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="644" y="172" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="644" y="204" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="644" y="236" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="644" y="268" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="644" y="300" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>

  <text x="420" y="336" font-size="11" fill="#777" filter="url(#rough2)">只要出现一对“偶 + 偶”就够</text>
</svg>
