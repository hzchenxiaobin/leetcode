<svg xmlns="http://www.w3.org/2000/svg" width="884" height="384" viewBox="0 0 884 384"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="121"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="884" height="384" fill="#fafafa"/>
  <text x="442" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">选一段连续的幸运数窗口 [A,B] 全变“满”</text>
  <text x="442" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">代价 = Σ dist([A,B], [l_i,r_i])，且 B−A ≤ 最短段长</text>
  <g filter="url(#rough2)"><rect x="110" y="170" width="600" height="44" rx="4" fill="#e8e8e8" fill-opacity="0.4" stroke="#8899aa" stroke-width="1.2"/></g>
  <g filter="url(#rough2)"><rect x="330" y="164" width="180" height="56" rx="4" fill="#d7ecd0" fill-opacity="0.6" stroke="#6a9a58" stroke-width="1.4"/></g>
  <text x="420" y="198" text-anchor="middle" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">[A, B]（含 c 个幸运数）</text>
  <text x="140" y="196" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">所有段都要覆盖这段</text>
  <text x="442" y="246" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">cost(A,B) = Σ_{l_i&gt;A}(l_i−A) + Σ_{r_i&lt;B}(B−r_i)</text>
  <text x="442" y="280" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">排序 + 前缀和 ⇒ O(log n) 求一次；对每个左端做双指针找最长可行右端</text>
  <text x="442" y="312" text-anchor="middle" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">可行性：B−A ≤ min_i(r_i−l_i)（最短段装不下就无解）</text>
  <text x="442" y="348" text-anchor="middle" font-size="12" fill="#3d6b2f" font-weight="bold" filter="url(#rough2)">答案 = 最大的窗口内幸运数个数</text>
</svg>
