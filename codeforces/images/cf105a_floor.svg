<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1052"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="280" fill="#fafafa"/>
  <text x="360.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">为什么必须整数化</text>
  <path d="M 115.2 42 Q 360.0 48 604.8 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="360.0" y="266" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">floor(x·k) 用浮点会在整点附近翻车</text>
  <rect x="40" y="70" width="640" height="54" rx="7" fill="#fbeeee" stroke="#a05a5a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="92" text-anchor="middle" font-size="12" fill="#6b3030" filter="url(#rough2)">k = 0.29、x = 100：double 乘法得 28.999999999999996</text>
  <text x="360" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b3030" filter="url(#rough2)">floor 之后变成 28，而正确答案是 29</text>
  <rect x="40" y="140" width="640" height="54" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="162" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">K = 29，v = (100·29) div 100 = 29 ✓</text>
  <text x="360" y="182" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">整数乘法 + 整数除法，没有任何浮点误差</text>
  <text x="360" y="230" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">同理 k = 0.75：K = 75，v = (x·75) div 100</text>
  <text x="360" y="256" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">样例 axe 350 → 26250 div 100 = 262 ✓</text>
</svg>
