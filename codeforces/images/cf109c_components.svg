<svg xmlns="http://www.w3.org/2000/svg" width="884" height="404" viewBox="0 0 884 404"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="109"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="884" height="404" fill="#fafafa"/>
  <text x="442" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">只保留非幸运边：得到若干连通块</text>
  <text x="442" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">i→j 路径上有幸运边 ⟺ i 与 j 不在同一个块里</text>
  <g filter="url(#rough2)"><circle cx="160" cy="140" r="18" fill="#cfe0f5" fill-opacity="0.9" stroke="#446688" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><circle cx="260" cy="120" r="18" fill="#cfe0f5" fill-opacity="0.9" stroke="#446688" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><circle cx="220" cy="220" r="18" fill="#cfe0f5" fill-opacity="0.9" stroke="#446688" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><circle cx="340" cy="200" r="18" fill="#cfe0f5" fill-opacity="0.9" stroke="#446688" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><circle cx="520" cy="140" r="18" fill="#d7ecd0" fill-opacity="0.9" stroke="#6a9a58" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><circle cx="620" cy="130" r="18" fill="#d7ecd0" fill-opacity="0.9" stroke="#6a9a58" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><circle cx="560" cy="230" r="18" fill="#d7ecd0" fill-opacity="0.9" stroke="#6a9a58" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><circle cx="680" cy="210" r="18" fill="#d7ecd0" fill-opacity="0.9" stroke="#6a9a58" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><line x1="160" y1="140" x2="260" y2="120" stroke="#7a9a6a" stroke-width="2.2"/></g>
  <g filter="url(#rough2)"><line x1="260" y1="120" x2="220" y2="220" stroke="#7a9a6a" stroke-width="2.2"/></g>
  <g filter="url(#rough2)"><line x1="220" y1="220" x2="340" y2="200" stroke="#7a9a6a" stroke-width="2.2"/></g>
  <g filter="url(#rough2)"><line x1="520" y1="140" x2="620" y2="130" stroke="#7a9a6a" stroke-width="2.2"/></g>
  <g filter="url(#rough2)"><line x1="620" y1="130" x2="560" y2="230" stroke="#7a9a6a" stroke-width="2.2"/></g>
  <g filter="url(#rough2)"><line x1="560" y1="230" x2="680" y2="210" stroke="#7a9a6a" stroke-width="2.2"/></g>
  <g filter="url(#rough2)"><line x1="340" y1="200" x2="520" y2="140" stroke="#b85450" stroke-width="2.6" stroke-dasharray="7 5"/></g>
  <text x="430.0" y="162.0" text-anchor="middle" font-size="11" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">幸运边</text>
  <text x="440" y="300" text-anchor="middle" font-size="12.5" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">对每个连通块 C（大小 s）：triple 数 = s·(n−s)·(n−s−1)</text>
  <text x="440" y="330" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">含义：i 在 C 内（s 种），j、k 都必须落在块外，且互不相同</text>
  <text x="440" y="362" text-anchor="middle" font-size="11" fill="#8a2b28" filter="url(#rough2)">答案 = Σ s(s−1)(n−s)(n−s−1)？不——见下：固定 i 后 T=n−s，j 有 T 种、k 有 T−1 种</text>
</svg>
