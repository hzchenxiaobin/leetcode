<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="300" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2：10 20 10 30</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">最长的是 10, 20, 10（p=10, q=10），长度 3</text>
  <g filter="url(#rough2)"><rect x="160" y="110" width="84" height="48" rx="4" fill="#f6d9d7" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="202.0" y="139.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">10</text>
  <text x="202" y="182" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="270" y="110" width="84" height="48" rx="4" fill="#f6d9d7" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="312.0" y="139.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">20</text>
  <text x="312" y="182" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="380" y="110" width="84" height="48" rx="4" fill="#f6d9d7" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="422.0" y="139.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">10</text>
  <text x="422" y="182" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="490" y="110" width="84" height="48" rx="4" fill="#eeeeee" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="532.0" y="139.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">30</text>
  <text x="532" y="182" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">4</text>
  <path d="M202,100 C202,70 312,70 312,100" fill="none" stroke="#3d6b2f" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M312,100 C312,70 422,70 422,100" fill="none" stroke="#3d6b2f" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="440" y="226" text-anchor="middle" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">取第 1、2、3 个元素 → 10, 20, 10</text>
  <text x="440" y="258" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">再加上 30 就不交替了（会出现 10,30 的下降）</text>
</svg>
