<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="440" fill="#fafafa"/>

  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">一次操作 = 把相邻两块并成一块，块值 = 块内数字和 mod 10</text>
  <path d="M 96 46 Q 360 53 624 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- ===== a 行 ===== -->
  <text x="34" y="98" font-size="17" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">a</text>
  <rect x="70" y="64" width="46" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="93" y="96" text-anchor="middle" font-size="22" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">5</text>
  <rect x="124" y="64" width="46" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="147" y="96" text-anchor="middle" font-size="22" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">1</text>
  <rect x="178" y="64" width="46" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="201" y="96" text-anchor="middle" font-size="22" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">4</text>
  <rect x="232" y="64" width="46" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="255" y="96" text-anchor="middle" font-size="22" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">7</text>
  <path d="M 70 116 L 70 126 L 170 126 L 170 116" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 178 116 L 178 126 L 278 126 L 278 116" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="120" y="150" text-anchor="middle" font-size="14" fill="#8a6015" filter="url(#rough2)">5+1 = 6</text>
  <text x="228" y="150" text-anchor="middle" font-size="14" fill="#8a6015" filter="url(#rough2)">11 mod 10 = 1</text>

  <path d="M 300 87 L 412 87" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="424" y="64" width="46" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="447" y="96" text-anchor="middle" font-size="22" font-weight="bold" fill="#8a6015" filter="url(#rough2)">6</text>
  <rect x="478" y="64" width="46" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="501" y="96" text-anchor="middle" font-size="22" font-weight="bold" fill="#8a6015" filter="url(#rough2)">1</text>
  <text x="540" y="93" font-size="13" fill="#666" filter="url(#rough2)">a 的结果</text>

  <!-- ===== b 行 ===== -->
  <text x="34" y="210" font-size="17" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">b</text>
  <rect x="70" y="176" width="46" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="93" y="208" text-anchor="middle" font-size="22" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">4</text>
  <rect x="124" y="176" width="46" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="147" y="208" text-anchor="middle" font-size="22" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">4</text>
  <rect x="178" y="176" width="46" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="201" y="208" text-anchor="middle" font-size="22" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">4</text>
  <rect x="232" y="176" width="46" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="255" y="208" text-anchor="middle" font-size="22" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">4</text>
  <rect x="286" y="176" width="46" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="309" y="208" text-anchor="middle" font-size="22" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">1</text>
  <path d="M 70 228 L 70 238 L 278 238 L 278 228" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 286 228 L 286 238 L 332 238 L 332 228" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="174" y="262" text-anchor="middle" font-size="14" fill="#8a6015" filter="url(#rough2)">16 mod 10 = 6</text>
  <text x="309" y="262" text-anchor="middle" font-size="14" fill="#8a6015" filter="url(#rough2)">1</text>

  <path d="M 348 199 L 412 199" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="424" y="176" width="46" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="447" y="208" text-anchor="middle" font-size="22" font-weight="bold" fill="#8a6015" filter="url(#rough2)">6</text>
  <rect x="478" y="176" width="46" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="501" y="208" text-anchor="middle" font-size="22" font-weight="bold" fill="#8a6015" filter="url(#rough2)">1</text>
  <text x="540" y="205" font-size="13" fill="#666" filter="url(#rough2)">b 的结果</text>

  <rect x="418" y="286" width="272" height="42" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="554" y="313" text-anchor="middle" font-size="14" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">两串都变成 61 ⇒ 长度 2</text>

  <!-- ===== 结论 ===== -->
  <rect x="36" y="286" width="360" height="128" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="54" y="312" font-size="13" fill="#8a6015" filter="url(#rough2)">f(x, y) = (x + y) mod 10 满足结合律与交换律</text>
  <text x="54" y="340" font-size="13" fill="#8a6015" filter="url(#rough2)">⇒ 一段连续数字无论怎么合并，结果唯一：</text>
  <text x="54" y="364" font-size="13" fill="#8a6015" filter="url(#rough2)">   该段数字和 mod 10</text>
  <text x="54" y="392" font-size="13" fill="#8a6015" filter="url(#rough2)">⇒ 操作任意多次 ⟺ 把原串划分成连续块</text>
</svg>
