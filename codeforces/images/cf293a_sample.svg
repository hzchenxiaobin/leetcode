<svg xmlns="http://www.w3.org/2000/svg" width="700" height="260" viewBox="0 0 700 260"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="503"/>
    <feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></defs>
  <rect width="700" height="260" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1：s=0111, t=0001（n=2，共 4 步）</text>
  <path d="M 160 40 Q 350 46 540 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="60" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="12.5" fill="#22314a" filter="url(#rough2)">逐位配对：(0,0)→00、(1,0)→10、(1,0)→10、(1,1)→11</text>
  <text x="76" y="104" font-size="12.5" fill="#22314a" filter="url(#rough2)">所以 c11=1、c10=2、c01=0、c00=1。</text>
  <g filter="url(#rough2)"><rect x="60" y="130" width="580" height="70" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="154" font-size="12.5" fill="#2f5223" filter="url(#rough2)">第 1 步（先手）：拿 11 ⇒ First=1</text>
  <text x="76" y="176" font-size="12.5" fill="#2f5223" filter="url(#rough2)">第 2 步（后手）：没 11 也没 01 ⇒ 拿 10 废掉 ⇒ 双方都拿不到这 2 分</text>
  <text x="76" y="192" font-size="12" fill="#3c5e2e" filter="url(#rough2)">第 3 步（先手）：拿剩下的 10 ⇒ First=2；第 4 步：00</text>
  <g filter="url(#rough2)"><rect x="60" y="212" width="580" height="34" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="76" y="234" font-size="12.5" fill="#8a6015" filter="url(#rough2)">2 : 0 ⇒ First ✓（与样例一致）</text>
</svg>
