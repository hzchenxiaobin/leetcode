<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr67j" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="380" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">可行域 = 所有边"内侧"半平面之交（多边形的核）</text>
  <path d="M 90 40 Q 360 46 630 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 多边形 -->
  <g filter="url(#rough2)">
    <polygon points="80,80 320,80 320,300 240,300 240,160 80,160" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <polygon points="80,80 240,80 240,160 80,160" fill="#ffe9a8" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="6 4"/>
  </g>
  <text x="150" y="128" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5a1b" filter="url(#rough2)">核 = 黄色区域</text>
  <text x="150" y="148" text-anchor="middle" font-size="11" fill="#7a5a1b" filter="url(#rough2)">（与围栏的公共部分才计数）</text>

  <!-- 围栏标注 -->
  <text x="80" y="70" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">A(围栏左端)</text>
  <text x="290" y="70" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">B</text>
  <path d="M 80 74 L 318 74" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="200" y="62" text-anchor="middle" font-size="11" fill="#8a2b28" filter="url(#rough2)">围栏 AB（塔只能建在这条边的整点上）</text>

  <!-- 内侧箭头 -->
  <path d="M 200 100 L 200 118" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr67j)" filter="url(#rough2)"/>
  <text x="210" y="112" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">内部在下侧</text>

  <path d="M 300 200 L 272 200" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr67j)" filter="url(#rough2)"/>
  <text x="306" y="196" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">内部在左侧</text>

  <path d="M 140 172 L 140 196" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr67j)" filter="url(#rough2)"/>
  <text x="150" y="188" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">内部在下侧</text>

  <!-- 说明 -->
  <g filter="url(#rough2)">
    <rect x="368" y="86" width="320" height="96" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="384" y="110" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">判据（顺时针多边形）</text>
  <text x="384" y="134" font-size="11.5" fill="#2f5223" filter="url(#rough2)">cross(d_i, X − V_i) ≤ 0</text>
  <text x="384" y="156" font-size="11.5" fill="#2f5223" filter="url(#rough2)">= 点 X 在有向边 V_i→V_i+1 的右侧</text>
  <text x="384" y="176" font-size="11.5" fill="#2f5223" filter="url(#rough2)">（逆时针则把 ≤ 换成 ≥）</text>

  <g filter="url(#rough2)">
    <rect x="368" y="200" width="320" height="112" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="384" y="224" font-size="12.5" font-weight="bold" fill="#7a5a1b" filter="url(#rough2)">为什么这就是"看得见全城"</text>
  <text x="384" y="248" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">在核里：到任意点的连线都不穿出边界 ✓</text>
  <text x="384" y="270" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">在核外：必被某条边挡住（贴边那块看不见）</text>
  <text x="384" y="292" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">核是凸的 ⇒ 与围栏的交是一段区间</text>

  <text x="60" y="342" font-size="12" fill="#2b2b2b" filter="url(#rough2)">于是"数多少个整点可行"变成"求 n 个 k-区间的交，再数其中的整数"：O(n) 且全是整数运算</text>
</svg>
