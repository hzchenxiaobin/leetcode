<svg xmlns="http://www.w3.org/2000/svg" width="780" height="470" viewBox="0 0 780 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>

  <rect width="780" height="470" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两个官方样例的逐 p 走查</text>
  <path d="M 210 40 Q 390 48 572 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <text x="56" y="64" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">A：a = [1,2,2,3,3,1]　⇒　c = 4，s = [1,2,2,1]，col = [1,2,3,1]</text>

  <rect x="56" y="72" width="668" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="87" y="91" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">p</text>
  <text x="233" y="91" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">左端条件</text>
  <text x="468" y="91" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">右端条件</text>
  <text x="656" y="91" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">候选答案</text>

  <rect x="56" y="100" width="668" height="28" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="87" y="119" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="128" y="119" font-size="11" fill="#333" filter="url(#rough2)">p=1，无左邻 ✓</text>
  <text x="366" y="119" font-size="11" fill="#333" filter="url(#rough2)">s[2]=2≥2 ✓</text>
  <text x="600" y="119" font-size="11" fill="#333" filter="url(#rough2)">c+0+1 = 5</text>

  <rect x="56" y="128" width="668" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="87" y="147" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6a1f" filter="url(#rough2)">2</text>
  <text x="128" y="147" font-size="11" fill="#333" filter="url(#rough2)">s[2]=2≥2 ✓</text>
  <text x="366" y="147" font-size="11" fill="#333" filter="url(#rough2)">s[3]=2≥2 ✓</text>
  <text x="600" y="147" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">c+1+1 = 6 ← 最优</text>

  <rect x="56" y="156" width="668" height="28" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="87" y="175" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="128" y="175" font-size="11" fill="#333" filter="url(#rough2)">s[3]=2≥2 ✓</text>
  <text x="366" y="175" font-size="11" fill="#333" filter="url(#rough2)">p+1=c，无右邻 ✓</text>
  <text x="600" y="175" font-size="11" fill="#333" filter="url(#rough2)">c+1+0 = 5</text>

  <text x="56" y="214" font-size="12.5" fill="#8a3a37" filter="url(#rough2)">B：a = [1,1,2,1,1,3]　⇒　c = 4，s = [2,1,2,1]，col = [1,2,1,3]</text>

  <rect x="56" y="222" width="668" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="87" y="241" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">p</text>
  <text x="233" y="241" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">左端条件</text>
  <text x="468" y="241" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">右端条件</text>
  <text x="656" y="241" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">候选答案</text>

  <rect x="56" y="250" width="668" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="87" y="269" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="128" y="269" font-size="11" fill="#333" filter="url(#rough2)">p=1，无左邻 ✓</text>
  <text x="366" y="269" font-size="11" fill="#333" filter="url(#rough2)">s[2]=1，需 col[1]≠col[3]，而 1=1 ✗</text>
  <text x="600" y="269" font-size="11" fill="#8a3a37" filter="url(#rough2)">不可行</text>

  <rect x="56" y="278" width="668" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="87" y="297" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="128" y="297" font-size="11" fill="#333" filter="url(#rough2)">s[2]=1，需 col[1]≠col[3]，而 1=1 ✗</text>
  <text x="366" y="297" font-size="11" fill="#333" filter="url(#rough2)">s[3]=2≥2 ✓</text>
  <text x="600" y="297" font-size="11" fill="#8a3a37" filter="url(#rough2)">不可行</text>

  <rect x="56" y="306" width="668" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="87" y="325" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6a1f" filter="url(#rough2)">3</text>
  <text x="128" y="325" font-size="11" fill="#333" filter="url(#rough2)">s[3]=2≥2 ✓</text>
  <text x="366" y="325" font-size="11" fill="#333" filter="url(#rough2)">p+1=c，无右邻 ✓</text>
  <text x="600" y="325" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">c+1+0 = 5 ← 最优</text>

  <text x="56" y="362" font-size="12" fill="#333" filter="url(#rough2)">A：p=2 的左右两端同时成立 ⇒ 4 + 2 = 6，与官方输出一致。</text>
  <text x="56" y="388" font-size="12" fill="#333" filter="url(#rough2)">B：col[1] = col[3] = 1（ABA 型），p=1 与 p=2 都被「隔壁就是同色段」卡死。</text>
  <text x="56" y="414" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">只能靠 p=3 拿到 4 + 1 = 5 —— 这就是「加 1」与「加 2」的分水岭。</text>
  <text x="56" y="442" font-size="11.5" fill="#66788c" filter="url(#rough2)">注：表中 col、s 均为 1-indexed，代码里统一减 1 即可</text>
</svg>
