<svg xmlns="http://www.w3.org/2000/svg" width="740" height="380" viewBox="0 0 740 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="607"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="740" height="380" fill="#fafafa"/>

  <text x="370" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 5 走查：14 个空格里只有 13 个能进到水</text>
  <path d="M 130 40 Q 370 46 610 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 第 1 层 -->
  <text x="112" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a68" filter="url(#rough2)">第 1 层（进水层）</text>
  <g filter="url(#rough2)">
    <rect x="60" y="86" width="34" height="34" fill="#dbe9f5" stroke="#446688" stroke-width="1.5"/>
    <rect x="98" y="86" width="34" height="34" fill="#e6e6e6" stroke="#888" stroke-width="1.3"/>
    <rect x="136" y="86" width="34" height="34" fill="#fdf0ef" stroke="#b85450" stroke-width="1.8"/>
    <rect x="60" y="124" width="34" height="34" fill="#e6e6e6" stroke="#888" stroke-width="1.3"/>
    <rect x="98" y="124" width="34" height="34" fill="#e6e6e6" stroke="#888" stroke-width="1.3"/>
    <rect x="136" y="124" width="34" height="34" fill="#e6e6e6" stroke="#888" stroke-width="1.3"/>
    <rect x="60" y="162" width="34" height="34" fill="#e6e6e6" stroke="#888" stroke-width="1.3"/>
    <rect x="98" y="162" width="34" height="34" fill="#e6e6e6" stroke="#888" stroke-width="1.3"/>
    <rect x="136" y="162" width="34" height="34" fill="#dbe9f5" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="77" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a68" filter="url(#rough2)">●</text>
  <text x="153" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#8c3a37" filter="url(#rough2)">✗</text>
  <text x="153" y="184" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a68" filter="url(#rough2)">●</text>
  <text x="77" y="220" font-size="11" fill="#2b4a68" filter="url(#rough2)">● 进水　✗ 孤立空腔</text>

  <!-- 第 2 层 -->
  <text x="292" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a68" filter="url(#rough2)">第 2 层</text>
  <g filter="url(#rough2)">
    <rect x="240" y="86" width="34" height="34" fill="#dbe9f5" stroke="#446688" stroke-width="1.5"/>
    <rect x="278" y="86" width="34" height="34" fill="#e6e6e6" stroke="#888" stroke-width="1.3"/>
    <rect x="316" y="86" width="34" height="34" fill="#e6e6e6" stroke="#888" stroke-width="1.3"/>
    <rect x="240" y="124" width="34" height="34" fill="#e6e6e6" stroke="#888" stroke-width="1.3"/>
    <rect x="278" y="124" width="34" height="34" fill="#e6e6e6" stroke="#888" stroke-width="1.3"/>
    <rect x="316" y="124" width="34" height="34" fill="#e6e6e6" stroke="#888" stroke-width="1.3"/>
    <rect x="240" y="162" width="34" height="34" fill="#e6e6e6" stroke="#888" stroke-width="1.3"/>
    <rect x="278" y="162" width="34" height="34" fill="#e6e6e6" stroke="#888" stroke-width="1.3"/>
    <rect x="316" y="162" width="34" height="34" fill="#dbe9f5" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="257" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a68" filter="url(#rough2)">●</text>
  <text x="333" y="184" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a68" filter="url(#rough2)">●</text>

  <!-- 第 3 层 -->
  <text x="472" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">第 3 层（全部连通）</text>
  <g filter="url(#rough2)">
    <rect x="420" y="86" width="34" height="34" fill="#dff0d8" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="458" y="86" width="34" height="34" fill="#dff0d8" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="496" y="86" width="34" height="34" fill="#dff0d8" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="420" y="124" width="34" height="34" fill="#dff0d8" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="458" y="124" width="34" height="34" fill="#dff0d8" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="496" y="124" width="34" height="34" fill="#dff0d8" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="420" y="162" width="34" height="34" fill="#dff0d8" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="458" y="162" width="34" height="34" fill="#dff0d8" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="496" y="162" width="34" height="34" fill="#dff0d8" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>

  <!-- 计数 -->
  <rect x="60" y="246" width="620" height="112" rx="8" fill="#f4f8ee" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="270" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">逐层数可到达的空格：</text>
  <text x="76" y="292" font-size="12" fill="#3c5e2e" filter="url(#rough2)">第 1 层：(1,1) 与 (3,3) 可达，(1,3) 被 '#' 围死 → 2 个</text>
  <text x="76" y="312" font-size="12" fill="#3c5e2e" filter="url(#rough2)">第 2 层：(1,1) 与 (3,3) 可达 → 2 个</text>
  <text x="76" y="332" font-size="12" fill="#3c5e2e" filter="url(#rough2)">第 3 层：9 个全通 → 9 个</text>
  <text x="76" y="352" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">合计 2 + 2 + 9 = 13，与样例输出一致（空格总数 14，孤立空腔 1 个）</text>
</svg>
