<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="720" height="380" fill="#fafafa"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例：n = 4500，向上找第一个超幸运数</text>
  <path d="M 200 43 Q 360 49 520 43" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <rect x="70" y="110" width="90" height="46" rx="4" fill="#ffffff" stroke="#777777" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115" y="140" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">4477</text>
  <rect x="170" y="110" width="90" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="215" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">4747</text>
  <text x="215" y="98" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">答案</text>
  <rect x="270" y="110" width="90" height="46" rx="4" fill="#ffffff" stroke="#777777" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="315" y="140" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">4774</text>
  <rect x="370" y="110" width="90" height="46" rx="4" fill="#ffffff" stroke="#777777" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="415" y="140" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">7447</text>
  <rect x="470" y="110" width="90" height="46" rx="4" fill="#ffffff" stroke="#777777" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="515" y="140" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">7474</text>
  <rect x="570" y="110" width="90" height="46" rx="4" fill="#ffffff" stroke="#777777" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="615" y="140" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">7744</text>
  <text x="70" y="200" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">4500 落在 4477 与 4747 之间 → 最小的 ≥ 4500 的超幸运数是 4747。</text>
  <rect x="60" y="220" width="600" height="56" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="76" y="244" text-anchor="start" font-size="11" fill="#446688" filter="url(#rough2)">按长度从小到大找：同一长度内 4 位数共有 6 个，按数值排序即可。</text>
  <text x="76" y="264" text-anchor="start" font-size="11" fill="#446688" filter="url(#rough2)">一旦某个长度找到了答案，更长的长度不可能更小，可以直接停。</text>
  <text x="60" y="310" text-anchor="start" font-size="11" fill="#777777" filter="url(#rough2)">边界：n = 1 → 47；n = 444444444 → 4444777777；n = 10^9 → 4444477777。</text>
  <text x="60" y="336" text-anchor="start" font-size="11" fill="#777777" filter="url(#rough2)">用 long long 存答案（最大 7777777777 &gt; 2^31）。</text>
</svg>
