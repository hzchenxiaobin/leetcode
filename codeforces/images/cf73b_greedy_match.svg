<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="73"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="gm" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2f7a3a"/>
    </marker>
  </defs>
  <rect width="720" height="400" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">双指针：最小奖分配给“最小的够用阈值”</text>
  <path d="M 130 40 Q 360 46 590 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 奖分列（升序） -->
  <text x="150" y="78" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">奖分（升序）</text>
  <g filter="url(#rough2)">
    <rect x="96" y="92" width="108" height="34" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="150" y="115" text-anchor="middle" font-size="13" fill="#8a6015">0</text>
    <rect x="96" y="136" width="108" height="34" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="150" y="159" text-anchor="middle" font-size="13" fill="#8a6015">10</text>
    <rect x="96" y="180" width="108" height="34" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="150" y="203" text-anchor="middle" font-size="13" fill="#8a6015">20</text>
  </g>

  <!-- 阈值列（升序） -->
  <text x="500" y="78" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">cap（升序）</text>
  <g filter="url(#rough2)">
    <rect x="446" y="92" width="108" height="34" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="500" y="115" text-anchor="middle" font-size="13" fill="#2f4a66">−10</text>
    <rect x="446" y="136" width="108" height="34" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="500" y="159" text-anchor="middle" font-size="13" fill="#2f4a66">10</text>
  </g>

  <!-- 匹配箭头 -->
  <g filter="url(#rough2)" stroke="#2f7a3a" stroke-width="2.2" fill="none">
    <path d="M 210 109 C 320 109 360 153 440 153" marker-end="url(#gm)"/>
  </g>
  <text x="330" y="124" text-anchor="middle" font-size="11.5" fill="#1f5226" filter="url(#rough2)">0 ≤ 10 ✓ 配对</text>

  <g filter="url(#rough2)" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" fill="none">
    <path d="M 210 197 C 320 197 360 120 440 120"/>
  </g>
  <text x="330" y="216" text-anchor="middle" font-size="11.5" fill="#8c2f2b" filter="url(#rough2)">20 &gt; −10 ✗ 配不上（这个人必然反超）</text>

  <!-- 结论 -->
  <rect x="60" y="250" width="600" height="126" rx="10" fill="#e6f4ea" stroke="#2f7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="276" font-size="12.5" font-weight="bold" fill="#1f5226" filter="url(#rough2)">最高名次 = 1 + (n−1 − 配对数)</text>
  <text x="76" y="302" font-size="11.5" fill="#2f5223" filter="url(#rough2)">未配对的人拿到的奖分必然 > cap，因此一定排在 Vasya 前面；配对数取最大即可。</text>
  <text x="76" y="328" font-size="12.5" font-weight="bold" fill="#8c2f2b" filter="url(#rough2)">最低名次 = 1 + 配对数（这次按 need 升序、找“够用的最小奖分”）</text>
  <text x="76" y="354" font-size="11.5" fill="#8c2f2b" filter="url(#rough2)">两种匹配的方向不同：一个“奖分 ≤ 阈值”，一个“奖分 ≥ 阈值”，别抄错。</text>
</svg>
