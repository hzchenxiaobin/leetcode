<svg xmlns="http://www.w3.org/2000/svg" width="700" height="260" viewBox="0 0 700 260"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="423"/>
    <feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></defs>
  <rect width="700" height="260" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">判定顺序</text>
  <path d="M 190 40 Q 350 46 510 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="48" rx="8" fill="#fbeeee" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="76" y="88" font-size="13" fill="#8a3a36" filter="url(#rough2)">k &gt; n ⇒ −1（不同字母数不能超过长度）</text>
  <g filter="url(#rough2)"><rect x="60" y="118" width="580" height="48" rx="8" fill="#fbeeee" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="76" y="148" font-size="13" fill="#8a3a36" filter="url(#rough2)">k = 1 ⇒ 只有 n = 1 可行（"a"），否则 −1</text>
  <g filter="url(#rough2)"><rect x="60" y="178" width="580" height="48" rx="8" fill="#e8f4e0" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="208" font-size="13" fill="#2f5223" filter="url(#rough2)">否则输出 a,b 交替的前 n−k+2 个 + 字母 c,d,…</text>
  <g filter="url(#rough2)"><rect x="60" y="228" width="580" height="26" rx="6" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <text x="76" y="247" font-size="12" fill="#2f5223" filter="url(#rough2)">O(n) 输出，n ≤ 10⁶。</text>
</svg>
