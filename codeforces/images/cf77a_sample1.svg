<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="760" height="440" fill="#fafafa"/>

  <text x="380" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1：三队 3 / 2 / 2，极差 30，同队喜欢 3 条</text>
  <path d="M 152 43 Q 380 49 608 43" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="40" y="78" width="220" height="200" rx="8" fill="#f3e9f7" stroke="#7a4a86" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a4a86" filter="url(#rough2)">Mephisto  a = 210</text>
  <text x="150" y="122" text-anchor="middle" font-size="11.5" fill="#5b5b5b" filter="url(#rough2)">队伍人数 = 3</text>
  <text x="150" y="152" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">Dracul</text>
  <text x="150" y="176" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">Troll</text>
  <text x="150" y="200" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">Anka</text>
  <text x="150" y="262" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a4a86" filter="url(#rough2)">210 / 3 = 70</text>
  <rect x="270" y="78" width="220" height="200" rx="8" fill="#e9f4ec" stroke="#3f6b4a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">Diablo  b = 200</text>
  <text x="380" y="122" text-anchor="middle" font-size="11.5" fill="#5b5b5b" filter="url(#rough2)">队伍人数 = 2</text>
  <text x="380" y="152" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">Hexadecimal</text>
  <text x="380" y="176" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">Snowy</text>
  <text x="380" y="262" text-anchor="middle" font-size="14" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">200 / 2 = 100</text>
  <rect x="500" y="78" width="220" height="200" rx="8" fill="#fdf3e3" stroke="#8a6015" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="610" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">Baal  c = 180</text>
  <text x="610" y="122" text-anchor="middle" font-size="11.5" fill="#5b5b5b" filter="url(#rough2)">队伍人数 = 2</text>
  <text x="610" y="152" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">Cleo</text>
  <text x="610" y="176" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">Chapay</text>
  <text x="610" y="262" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">180 / 2 = 90</text>
  <text x="380" y="306" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">极差 = 100 − 70 = 30</text>
  <line x1="150" y1="320" x2="640" y2="320" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="40" y="348" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">同队“喜欢”对：Troll→Dracul、Dracul→Anka（第一队），Snowy→Hexadecimal（第二队），共 3 条</text>
  <text x="40" y="372" text-anchor="start" font-size="12" fill="#5b5b5b" filter="url(#rough2)">若把 Anka 与 Chapay 换队：经验变成 ⌊210/2⌋=105、⌊180/3⌋=60，极差 45，反而更差</text>
  <rect x="40" y="390" width="680" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="56" y="415" text-anchor="start" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">先比极差、再比喜欢条数：样例 1 的最优解极差 30、喜欢 3 → 输出 “30 3”</text>
</svg>
