<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="15"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="420" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">解释器的两种分支：数字 与 箭头</text>
  <path d="M 160 42 Q 360 48 560 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 数字分支 -->
  <rect x="40" y="70" width="300" height="150" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="56" y="96" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">CP 指向数字 d</text>
  <text x="56" y="122" font-size="11.5" fill="#2f5223" filter="url(#rough2)">1. 打印这个数字 d（计入答案）</text>
  <text x="56" y="144" font-size="11.5" fill="#2f5223" filter="url(#rough2)">2. CP 按当前 DP 方向移动一步</text>
  <text x="56" y="166" font-size="11.5" fill="#2f5223" filter="url(#rough2)">3. 格子里的 d 减 1</text>
  <text x="56" y="188" font-size="11.5" fill="#2f5223" filter="url(#rough2)">4. 若 d = 0，删除该格（后面的整体左移）</text>
  <text x="56" y="210" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">注意：先移动、后减 1 / 删除</text>

  <!-- 箭头分支 -->
  <rect x="380" y="70" width="300" height="150" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="396" y="96" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">CP 指向 &lt; 或 &gt;</text>
  <text x="396" y="122" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">1. DP 改成箭头指向的方向</text>
  <text x="396" y="144" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">2. CP 按 DP 移动一步</text>
  <text x="396" y="166" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">3. 若新位置也是箭头，删除刚离开的那个箭头</text>
  <text x="396" y="188" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">4. 若新位置是数字或越界，则什么都不删</text>
  <text x="396" y="210" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">「上一个字符」指刚才站着的那个箭头</text>

  <path d="M 360 145 L 376 145" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="246" width="440" height="46" rx="9" fill="#fde8e8" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="274" text-anchor="middle" font-size="13" font-weight="bold" fill="#8c2f2b" filter="url(#rough2)">CP 一旦越出序列，程序立即结束</text>

  <text x="60" y="326" font-size="12" fill="#555" filter="url(#rough2)">终止性：每次站在箭头上，要么删掉一个箭头，要么下一步就去打印一个数字；</text>
  <text x="60" y="348" font-size="12" fill="#555" filter="url(#rough2)">数字 d 最多被打印 d+1 次，因此总步数不超过 21n 左右（n 为序列长度）。</text>

  <text x="60" y="384" font-size="12" filter="url(#rough2)" fill="#2b2b2b">本题 n, q ≤ 100：直接对每个查询从头模拟一遍即可，无需任何高级数据结构。</text>
</svg>
