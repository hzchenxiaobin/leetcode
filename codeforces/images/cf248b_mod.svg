<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="720" height="290" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">同时被 2,3,5,7 整除 ⇒ 被 210 整除</text>
  <rect x="60" y="60" width="600" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="360" y="87" text-anchor="middle" font-size="12" fill="#2f5223">n=1 或 2：不存在 → -1；n≥3：找最小的 n 位数 ≡ 0 (mod 210)</text>
  <rect x="60" y="130" width="600" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="360" y="157" text-anchor="middle" font-size="11.5" fill="#2f4a66">r = 10^(n−1) mod 210（快速幂），k = (210 − r) mod 210，答案 = 10^(n−1) + k</text>
  <text x="60" y="214" text-anchor="start" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">10^(n−1) 是「1 后跟 n−1 个 0」，加 k（&lt;210）只动最后三位</text>
  <text x="60" y="240" text-anchor="start" font-size="11.5" fill="#7a4b22" filter="url(#rough2)">n = 3 → 210，n = 4 → 1050，n = 5 → 10080 ✓</text>
  <text x="60" y="266" text-anchor="start" font-size="11.5" fill="#4a2a62" filter="url(#rough2)">输出用字符串拼接：中间补 0，最后三位补成 3 位</text>
</svg>
