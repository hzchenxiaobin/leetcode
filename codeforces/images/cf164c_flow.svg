<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="773"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="300" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">时间轴上的 k 单位流：任务边是带费用的捷径</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">最小费用 = −最大收益</text>
  <g filter="url(#rough2)"><circle cx="120" cy="130" r="20" fill="#cfe0f5" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="120" y="133.24" text-anchor="middle" font-size="9" fill="#2b2b2b" filter="url(#rough2)">t1</text>
  <g filter="url(#rough2)"><line x1="142" y1="130" x2="288" y2="130" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/></g>
  <g filter="url(#rough2)"><circle cx="310" cy="130" r="20" fill="#cfe0f5" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="310" y="133.24" text-anchor="middle" font-size="9" fill="#2b2b2b" filter="url(#rough2)">t2</text>
  <g filter="url(#rough2)"><line x1="332" y1="130" x2="478" y2="130" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/></g>
  <g filter="url(#rough2)"><circle cx="500" cy="130" r="20" fill="#cfe0f5" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="500" y="133.24" text-anchor="middle" font-size="9" fill="#2b2b2b" filter="url(#rough2)">t3</text>
  <g filter="url(#rough2)"><line x1="522" y1="130" x2="668" y2="130" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/></g>
  <g filter="url(#rough2)"><circle cx="690" cy="130" r="20" fill="#cfe0f5" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="690" y="133.24" text-anchor="middle" font-size="9" fill="#2b2b2b" filter="url(#rough2)">t4</text>
  <text x="450" y="96" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">相邻时间边：容量 k、费用 0</text>
  <g filter="url(#rough2)"><path d="M 140 150 C 250 210, 400 210, 500 150" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)"/></g>
  <text x="310" y="222" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">任务边：容量 1、费用 −c_i</text>
  <text x="450" y="258" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">送满 k 单位 ⇒ 每单位是一条机器的时间线</text>
</svg>
