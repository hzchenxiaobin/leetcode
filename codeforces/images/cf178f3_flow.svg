<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="300" fill="#fafafa"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">F3 的流程</text>
  <path d="M 320.35 46 Q 380.0 52 439.65 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="40.0" y="70.0" width="208.0" height="62.0" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="144.0" y="105.0" text-anchor="middle" font-size="11.2" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">读入 n, k 与 n 个串</text>
  <path d="M 250.0 101.0 L 270.0 101.0" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="276.0" y="70.0" width="208.0" height="62.0" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="380.0" y="105.0" text-anchor="middle" font-size="11.2" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按字典序排序</text>
  <path d="M 486.0 101.0 L 506.0 101.0" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="512.0" y="70.0" width="208.0" height="62.0" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="616.0" y="105.0" text-anchor="middle" font-size="11.2" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按 LCP 建压缩树</text>
  <rect x="40.0" y="162.0" width="208.0" height="62.0" rx="9" fill="#fff3d6" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="144.0" y="197.0" text-anchor="middle" font-size="11.2" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">树形背包</text>
  <path d="M 250.0 193.0 L 270.0 193.0" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="276.0" y="162.0" width="208.0" height="62.0" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="380.0" y="197.0" text-anchor="middle" font-size="11.2" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">输出 G[root][k]</text>
  <path d="M 486.0 193.0 L 506.0 193.0" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="40.0" y="236.0" text-anchor="start" font-size="11.3" fill="#6b6b6b" filter="url(#rough2)">总复杂度 O(总长 + n·k)，n = 2000、k = 2000 时约 4×10⁶。</text>
</svg>
