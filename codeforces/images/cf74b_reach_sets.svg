<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="45"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="860" height="400" fill="#fafafa"/>

  <text x="430" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">逐分钟维护"逃票者可能所在的车厢"集合</text>
  <text x="430" y="56" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">样例二：n = 3，m = 2，k = 1，状态串 0001</text>

  <!-- 列：t=0..4 -->
  <g filter="url(#rough2)">
    <text x="60" y="104" font-size="11.5" fill="#666666">分钟 t</text>
    <text x="60" y="170" font-size="11.5" fill="#666666">火车状态</text>
    <text x="60" y="236" font-size="11.5" fill="#666666">查票员 c_t</text>
    <text x="60" y="308" font-size="11.5" fill="#666666">可达集合 S_t</text>

    <g text-anchor="middle" font-size="11.5">
      <text x="200" y="104" fill="#444444">0</text>
      <text x="330" y="104" fill="#444444">1</text>
      <text x="460" y="104" fill="#444444">2</text>
      <text x="590" y="104" fill="#444444">3</text>
      <text x="720" y="104" fill="#444444">4</text>
    </g>

    <g text-anchor="middle" font-size="11.5">
      <text x="200" y="170" fill="#888888">—</text>
      <text x="330" y="170" fill="#2f4a66">行驶</text>
      <text x="460" y="170" fill="#2f4a66">行驶</text>
      <text x="590" y="170" fill="#2f4a66">行驶</text>
      <text x="720" y="170" fill="#8a6015">停靠（终点）</text>
    </g>

    <g text-anchor="middle" font-size="12">
      <text x="200" y="236" fill="#444444">c₀ = 1</text>
      <text x="330" y="236" fill="#444444">2</text>
      <text x="460" y="236" fill="#444444">3</text>
      <text x="590" y="236" fill="#444444">2</text>
      <text x="720" y="236" fill="#444444">1</text>
    </g>

    <rect x="160" y="270" width="80" height="48" rx="8" fill="#d9ecd4" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="200" y="300" text-anchor="middle" font-size="12" fill="#2f5223">{2}</text>

    <rect x="290" y="270" width="80" height="48" rx="8" fill="#d9ecd4" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="330" y="300" text-anchor="middle" font-size="12" fill="#2f5223">{3}</text>

    <rect x="420" y="270" width="80" height="48" rx="8" fill="#f6d9d7" stroke="#b85450" stroke-width="1.8"/>
    <text x="460" y="300" text-anchor="middle" font-size="12" fill="#8a2b28">∅</text>

    <rect x="550" y="270" width="80" height="48" rx="8" fill="#eeeeee" stroke="#999999" stroke-width="1.4"/>
    <text x="590" y="300" text-anchor="middle" font-size="12" fill="#777777">—</text>

    <rect x="680" y="270" width="80" height="48" rx="8" fill="#eeeeee" stroke="#999999" stroke-width="1.4"/>
    <text x="720" y="300" text-anchor="middle" font-size="12" fill="#777777">—</text>

    <path d="M 240 294 L 286 294" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)"/>
    <path d="M 370 294 L 416 294" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)"/>
  </g>

  <text x="430" y="352" text-anchor="middle" font-size="11" fill="#8a2b28" filter="url(#rough2)">第 2 分钟：从 3 号只能去 2、3 号；2 号撞上 c₁，3 号撞上 c₂ ⇒ 集合为空，第 2 分钟被抓。</text>
  <text x="430" y="376" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">停靠分钟若 t = L（终点站）：逃票者下车离开，直接获胜，不需要再上车。</text>
</svg>
