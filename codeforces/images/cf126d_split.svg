<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr126d" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="420" fill="#fafafa"/>

  <text x="380" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">拆分 F(i) = F(i-1) + F(i-2)，从 Zeckendorf 生成全部表示</text>
  <path d="M 118 46 Q 380 54 642 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 第一层 -->
  <g filter="url(#rough2)">
    <rect x="330" y="70" width="100" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="380" y="97" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f4a66">13 = F6</text>
  </g>

  <!-- 第二层 -->
  <path d="M 350 112 Q 262 140 232 166" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr126d)" filter="url(#rough2)"/>
  <path d="M 410 112 Q 498 140 528 166" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr126d)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="182" y="170" width="100" height="40" rx="8" fill="#e9f5e6" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="232" y="196" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5223">8 + 5</text>
    <rect x="478" y="170" width="100" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5 4"/>
    <text x="528" y="196" text-anchor="middle" font-size="15" fill="#8a6015">拆 F5 会重号</text>
  </g>
  <text x="332" y="150" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">F6 拆一次</text>
  <text x="470" y="150" font-size="12.5" fill="#8a6015" filter="url(#rough2)">8+5 里再拆 5</text>

  <!-- 第三层 -->
  <path d="M 232 210 Q 232 244 232 268" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr126d)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="150" y="272" width="164" height="40" rx="8" fill="#e9f5e6" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="232" y="298" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5223">8 + 3 + 2</text>
  </g>
  <text x="248" y="252" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">把 5 拆成 3+2</text>

  <text x="356" y="292" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">三条链到此为止：2 不能再拆</text>

  <!-- 右侧说明 -->
  <g filter="url(#rough2)">
    <rect x="430" y="240" width="300" height="150" rx="10" fill="#ffffff" stroke="#888888" stroke-width="1.2"/>
    <text x="446" y="266" font-size="13" font-weight="bold" fill="#2b2b2b">13 的三种表示</text>
    <text x="446" y="292" font-size="13" fill="#2b2b2b">13 = F6</text>
    <text x="446" y="316" font-size="13" fill="#2b2b2b">13 = F5 + F4 = 8 + 5</text>
    <text x="446" y="340" font-size="13" fill="#2b2b2b">13 = F5 + F3 + F2 = 8 + 3 + 2</text>
    <text x="446" y="368" font-size="12" fill="#555555">每拆一次和不变、项数 +1</text>
  </g>

  <text x="60" y="392" font-size="12.5" fill="#555" filter="url(#rough2)">注意 F1 = 1、F2 = 2，所以下标到 2 就到底；F3 = 3 = F1 + F2 是最后一次可拆。</text>
</svg>
