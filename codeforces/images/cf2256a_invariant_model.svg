<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="470" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：只要动过手，三元组必是 (p, q, p+q)</text>
  <path d="M 176 42 Q 380 50 584 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="22" y="60" width="716" height="182" rx="12" fill="#f4f7fd" stroke="#c3d3e8" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="40" y="84" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">① 先把三个数排好序：A ≤ B ≤ C，然后试着把「最大的 C」换成 A+B</text>
  <rect x="52" y="96" width="58" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>  <text x="81" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">A</text>  <text x="81" y="156" text-anchor="middle" font-size="11.5" fill="#5b7ba0" filter="url(#rough2)">最小</text>  <rect x="118" y="96" width="58" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>  <text x="147" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">B</text>  <text x="147" y="156" text-anchor="middle" font-size="11.5" fill="#5b7ba0" filter="url(#rough2)">中间</text>  <rect x="184" y="96" width="58" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>  <text x="213" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">C</text>  <text x="213" y="156" text-anchor="middle" font-size="11.5" fill="#5b7ba0" filter="url(#rough2)">最大</text>  <path d="M 256 117 L 318 117" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>  <text x="287" y="104" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">C ← A+B</text>  <text x="287" y="136" text-anchor="middle" font-size="11" fill="#5b7ba0" filter="url(#rough2)">只换最大</text>  <rect x="336" y="96" width="58" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>  <text x="365" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">A</text>  <rect x="402" y="96" width="58" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>  <text x="431" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">B</text>  <rect x="468" y="96" width="58" height="42" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.0" filter="url(#rough2)"/>  <text x="497" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">A+B</text>  <text x="365" y="156" text-anchor="middle" font-size="11.5" fill="#5b7ba0" filter="url(#rough2)">不动</text>  <text x="431" y="156" text-anchor="middle" font-size="11.5" fill="#5b7ba0" filter="url(#rough2)">不动</text>  <text x="497" y="156" text-anchor="middle" font-size="11.5" fill="#5b7ba0" filter="url(#rough2)">新的最大</text>  <path d="M 336 168 Q 431 180 526 168" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>  <text x="431" y="198" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">极差 = (A+B) − A = B（正好是中间那个数）</text>  <text x="620" y="198" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">← 一步就到位</text>  <text x="40" y="228" font-size="12" fill="#555" filter="url(#rough2)">注意：A+B ≥ B 恒成立，所以换完之后最小值仍是 A，最大值变成 A+B，不会「换出」更小的极差。</text>  <rect x="22" y="254" width="716" height="106" rx="12" fill="#fff8e1" stroke="#e2c483" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="40" y="276" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">② 第一步只有四种选择，逐个算极差（后面的步数只会更差）</text>
  <rect x="34" y="286" width="166" height="58" rx="6" fill="#fafafa" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>  <text x="117" y="308" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">不动（0 次操作）</text>  <text x="117" y="332" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#555" filter="url(#rough2)">极差 = C − A</text>  <rect x="212" y="286" width="166" height="58" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>  <text x="295" y="308" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">换 A ← B+C</text>  <text x="295" y="332" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">极差 = C</text>  <rect x="390" y="286" width="166" height="58" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>  <text x="473" y="308" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">换 B ← A+C</text>  <text x="473" y="332" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">极差 = C</text>  <rect x="568" y="286" width="166" height="58" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.0" filter="url(#rough2)"/>  <text x="651" y="308" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">换 C ← A+B</text>  <text x="651" y="332" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">极差 = B</text>  <rect x="22" y="372" width="716" height="86" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="400" text-anchor="middle" font-size="16" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">答案 = min(C − A , B)</text>
  <text x="380" y="424" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">不变量：从 (p, q, p+q) 再操作一次，得到 (p, p+q, 2p+q) 或 (q, p+q, p+2q)，极差 max(p,q) 只增不减</text>
  <text x="380" y="446" text-anchor="middle" font-size="11.5" fill="#557a45" filter="url(#rough2)">所以「第一次就把最大数换成另外两数之和」之后再怎么折腾都不会更好，一次足够</text>
</svg>
