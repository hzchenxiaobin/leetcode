<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2b2b2b"/>
    </marker>
  </defs>

  <rect width="760" height="400" fill="#fafafa"/>
  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">一块 k 曲奇 = k×k 方格里的上三角（含对角线），共 k(k+1)/2 格</text>
  <path d="M 120 40 Q 380 46 640 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 8x8 网格：cell = 26，原点 (54, 66) -->
  <g filter="url(#rough2)">
    <rect x="54" y="66" width="208" height="208" fill="#fdf3d0" stroke="#2b2b2b" stroke-width="1.6"/>
  </g>
  <g filter="url(#rough2)">
    <rect x="54" y="66" width="26" height="26" fill="#d7ecd9" stroke="#9fbfa4" stroke-width="0.6"/>
    <rect x="80" y="66" width="26" height="26" fill="#d7ecd9" stroke="#9fbfa4" stroke-width="0.6"/>
    <rect x="106" y="66" width="26" height="26" fill="#d7ecd9" stroke="#9fbfa4" stroke-width="0.6"/>
    <rect x="132" y="66" width="26" height="26" fill="#d7ecd9" stroke="#9fbfa4" stroke-width="0.6"/>
    <rect x="158" y="66" width="26" height="26" fill="#d7ecd9" stroke="#9fbfa4" stroke-width="0.6"/>
    <rect x="184" y="66" width="26" height="26" fill="#d7ecd9" stroke="#9fbfa4" stroke-width="0.6"/>
    <rect x="210" y="66" width="26" height="26" fill="#d7ecd9" stroke="#9fbfa4" stroke-width="0.6"/>
    <rect x="236" y="66" width="26" height="26" fill="#d7ecd9" stroke="#9fbfa4" stroke-width="0.6"/>
    <rect x="80" y="92" width="26" height="26" fill="#d7ecd9" stroke="#9fbfa4" stroke-width="0.6"/>
    <rect x="106" y="92" width="26" height="26" fill="#d7ecd9" stroke="#9fbfa4" stroke-width="0.6"/>
    <rect x="132" y="92" width="26" height="26" fill="#d7ecd9" stroke="#9fbfa4" stroke-width="0.6"/>
    <rect x="158" y="92" width="26" height="26" fill="#d7ecd9" stroke="#9fbfa4" stroke-width="0.6"/>
    <rect x="184" y="92" width="26" height="26" fill="#d7ecd9" stroke="#9fbfa4" stroke-width="0.6"/>
    <rect x="210" y="92" width="26" height="26" fill="#d7ecd9" stroke="#9fbfa4" stroke-width="0.6"/>
    <rect x="236" y="92" width="26" height="26" fill="#d7ecd9" stroke="#9fbfa4" stroke-width="0.6"/>
    <rect x="106" y="118" width="26" height="26" fill="#d7ecd9" stroke="#9fbfa4" stroke-width="0.6"/>
    <rect x="132" y="118" width="26" height="26" fill="#d7ecd9" stroke="#9fbfa4" stroke-width="0.6"/>
    <rect x="158" y="118" width="26" height="26" fill="#d7ecd9" stroke="#9fbfa4" stroke-width="0.6"/>
    <rect x="184" y="118" width="26" height="26" fill="#d7ecd9" stroke="#9fbfa4" stroke-width="0.6"/>
    <rect x="210" y="118" width="26" height="26" fill="#d7ecd9" stroke="#9fbfa4" stroke-width="0.6"/>
    <rect x="236" y="118" width="26" height="26" fill="#d7ecd9" stroke="#9fbfa4" stroke-width="0.6"/>
    <rect x="132" y="144" width="26" height="26" fill="#d7ecd9" stroke="#9fbfa4" stroke-width="0.6"/>
    <rect x="158" y="144" width="26" height="26" fill="#d7ecd9" stroke="#9fbfa4" stroke-width="0.6"/>
    <rect x="184" y="144" width="26" height="26" fill="#d7ecd9" stroke="#9fbfa4" stroke-width="0.6"/>
    <rect x="210" y="144" width="26" height="26" fill="#d7ecd9" stroke="#9fbfa4" stroke-width="0.6"/>
    <rect x="236" y="144" width="26" height="26" fill="#d7ecd9" stroke="#9fbfa4" stroke-width="0.6"/>
    <rect x="158" y="170" width="26" height="26" fill="#d7ecd9" stroke="#9fbfa4" stroke-width="0.6"/>
    <rect x="184" y="170" width="26" height="26" fill="#d7ecd9" stroke="#9fbfa4" stroke-width="0.6"/>
    <rect x="210" y="170" width="26" height="26" fill="#d7ecd9" stroke="#9fbfa4" stroke-width="0.6"/>
    <rect x="236" y="170" width="26" height="26" fill="#d7ecd9" stroke="#9fbfa4" stroke-width="0.6"/>
    <rect x="184" y="196" width="26" height="26" fill="#d7ecd9" stroke="#9fbfa4" stroke-width="0.6"/>
    <rect x="210" y="196" width="26" height="26" fill="#d7ecd9" stroke="#9fbfa4" stroke-width="0.6"/>
    <rect x="236" y="196" width="26" height="26" fill="#d7ecd9" stroke="#9fbfa4" stroke-width="0.6"/>
    <rect x="210" y="222" width="26" height="26" fill="#d7ecd9" stroke="#9fbfa4" stroke-width="0.6"/>
    <rect x="236" y="222" width="26" height="26" fill="#d7ecd9" stroke="#9fbfa4" stroke-width="0.6"/>
    <rect x="236" y="248" width="26" height="26" fill="#d7ecd9" stroke="#9fbfa4" stroke-width="0.6"/>
  </g>

  <!-- 外框重描 -->
  <rect x="54" y="66" width="208" height="208" fill="none" stroke="#2b2b2b" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="158" y="292" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">盒子 2^n × 2^n（图中 n = 3）</text>

  <!-- 右侧说明 -->
  <g font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">
    <rect x="300" y="72" width="430" height="60" rx="8" fill="#d7ecd9" stroke="#2f7a3a" stroke-width="1.5"/>
    <text x="316" y="95" font-size="13" font-weight="bold" fill="#1f5226">绿色：一块 8 曲奇（8×8 的上三角，36 格）</text>
    <text x="316" y="118" font-size="12" fill="#1f5226">公式：k(k+1)/2，这里 8×9/2 = 36</text>

    <rect x="300" y="146" width="430" height="60" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.5"/>
    <text x="316" y="169" font-size="13" font-weight="bold" fill="#8a6015">黄色：放完最大块后剩下的下三角（28 格）</text>
    <text x="316" y="192" font-size="12" fill="#8a6015">它由 c &lt; r 的格子组成，与上三角全等但方向相反</text>

    <rect x="300" y="220" width="430" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="316" y="243" font-size="13" font-weight="bold" fill="#2f4a66">第一块只能边长 2^n：它占满整个盒子</text>
    <text x="316" y="265" font-size="12" fill="#2f4a66">因此位置唯一（左上角），盒子被切成"曲奇 + 下三角"</text>

    <rect x="300" y="290" width="430" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="316" y="313" font-size="12.5" fill="#7a5a1b">饼干没有 1×1 的，所以最后每个"孤格"都会留下来</text>
    <text x="316" y="332" font-size="12.5" fill="#7a5a1b">求的就是这些残留孤格的总数</text>
  </g>
</svg>
