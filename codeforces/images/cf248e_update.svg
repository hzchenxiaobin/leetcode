<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="360" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每次操作只改一个货架的分布</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">v 货架只是多了几个"已尝"的罐子，未尝试数不变；期望只随 dp[u][0] 变化</text>
  <text x="120" y="108" text-anchor="start" font-size="13" fill="#2b2b2b" filter="url(#rough2)">操作 (u, v, k)</text>
  <text x="130" y="170" text-anchor="end" font-size="13" fill="#555555" filter="url(#rough2)">货架 u</text>
  <g filter="url(#rough2)"><rect x="150" y="140" width="120" height="56" rx="4" fill="#f6e3c4" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="210" y="174" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">分布 dp[3][·]</text>
  <text x="130" y="266" text-anchor="end" font-size="13" fill="#555555" filter="url(#rough2)">货架 v</text>
  <g filter="url(#rough2)"><rect x="150" y="236" width="120" height="56" rx="4" fill="#f6e3c4" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="210" y="270" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">分布 dp[0][·]</text>
  <line x1="280" y1="168" x2="360" y2="168" stroke="#446688" stroke-width="1.7" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="320" y="152" text-anchor="middle" font-size="11" fill="#b05a5a" filter="url(#rough2)">重新按超几何分布更新</text>
  <text x="430" y="196" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">u 的总罐数 -= k</text>
  <text x="430" y="220" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">v 的总罐数 += k（未尝试数不变）</text>
  <text x="430" y="262" text-anchor="start" font-size="13" fill="#3d6b2f" filter="url(#rough2)">E += dp_new[u][0] - dp_old[u][0]</text>
  <text x="440" y="330" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">复杂度 O(q · 100 · k)，q = 10^5 时约 5×10^7 次浮点运算</text>
</svg>
