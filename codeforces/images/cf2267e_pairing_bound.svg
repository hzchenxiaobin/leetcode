<svg xmlns="http://www.w3.org/2000/svg" width="840" height="412" viewBox="0 0 840 412"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="840" height="412" fill="#fafafa"/>

  <text x="420" y="32" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察二：c 个 1 两两配对 ⇒ beauty = ⌈c/2⌉</text>
  <path d="M 92 42 Q 420 50 748 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="420" y="60" text-anchor="middle" font-size="12.5" fill="#5a5a5a" filter="url(#rough2)">相邻两个 1 之间必然全是 0 —— 这正好满足「取 clean 子串」的条件，一次消掉两个 1</text>

  <text x="124" y="114" text-anchor="end" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">d =</text>

  <rect x="132" y="88" width="46" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="155" y="114" text-anchor="middle" font-size="16" fill="#8c3b38" filter="url(#rough2)">1</text>
  <rect x="184" y="88" width="46" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="207" y="114" text-anchor="middle" font-size="16" fill="#3c5e2e" filter="url(#rough2)">0</text>
  <rect x="236" y="88" width="46" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="259" y="114" text-anchor="middle" font-size="16" fill="#3c5e2e" filter="url(#rough2)">0</text>
  <rect x="288" y="88" width="46" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="311" y="114" text-anchor="middle" font-size="16" fill="#8c3b38" filter="url(#rough2)">1</text>
  <rect x="340" y="88" width="46" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="363" y="114" text-anchor="middle" font-size="16" fill="#3c5e2e" filter="url(#rough2)">0</text>
  <rect x="392" y="88" width="46" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="415" y="114" text-anchor="middle" font-size="16" fill="#3c5e2e" filter="url(#rough2)">0</text>
  <rect x="444" y="88" width="46" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="467" y="114" text-anchor="middle" font-size="16" fill="#8c3b38" filter="url(#rough2)">1</text>
  <rect x="496" y="88" width="46" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="519" y="114" text-anchor="middle" font-size="16" fill="#3c5e2e" filter="url(#rough2)">0</text>
  <rect x="548" y="88" width="46" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="571" y="114" text-anchor="middle" font-size="16" fill="#8c3b38" filter="url(#rough2)">1</text>

  <text x="155" y="144" text-anchor="middle" font-size="10" fill="#8a8a8a" filter="url(#rough2)">1</text>
  <text x="207" y="144" text-anchor="middle" font-size="10" fill="#8a8a8a" filter="url(#rough2)">2</text>
  <text x="259" y="144" text-anchor="middle" font-size="10" fill="#8a8a8a" filter="url(#rough2)">3</text>
  <text x="311" y="144" text-anchor="middle" font-size="10" fill="#8a8a8a" filter="url(#rough2)">4</text>
  <text x="363" y="144" text-anchor="middle" font-size="10" fill="#8a8a8a" filter="url(#rough2)">5</text>
  <text x="415" y="144" text-anchor="middle" font-size="10" fill="#8a8a8a" filter="url(#rough2)">6</text>
  <text x="467" y="144" text-anchor="middle" font-size="10" fill="#8a8a8a" filter="url(#rough2)">7</text>
  <text x="519" y="144" text-anchor="middle" font-size="10" fill="#8a8a8a" filter="url(#rough2)">8</text>
  <text x="571" y="144" text-anchor="middle" font-size="10" fill="#8a8a8a" filter="url(#rough2)">9</text>

  <path d="M 155 152 Q 233 200 311 152" stroke="#b85450" stroke-width="1.9" fill="none" filter="url(#rough2)"/>
  <path d="M 467 152 Q 519 200 571 152" stroke="#b85450" stroke-width="1.9" fill="none" filter="url(#rough2)"/>
  <text x="233" y="216" text-anchor="middle" font-size="11" fill="#8c3b38" filter="url(#rough2)">第 1 次：取 l = 2, r = 4，两侧的 1 同时变 0</text>
  <text x="519" y="216" text-anchor="middle" font-size="11" fill="#8c3b38" filter="url(#rough2)">第 2 次：取 l = 8, r = 9</text>

  <rect x="614" y="76" width="196" height="80" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="712" y="100" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">本例 c = 4（偶数）</text>
  <text x="712" y="122" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">配成 2 对</text>
  <text x="712" y="144" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">⇒ beauty = 2</text>

  <rect x="48" y="238" width="352" height="104" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="224" y="264" text-anchor="middle" font-size="13" font-weight="bold" fill="#8c3b38" filter="url(#rough2)">下界：一次只动 d 的 1~2 位</text>
  <text x="224" y="290" text-anchor="middle" font-size="11.5" fill="#8c3b38" filter="url(#rough2)">1 的个数单步最多减 2</text>
  <text x="224" y="312" text-anchor="middle" font-size="11.5" fill="#8c3b38" filter="url(#rough2)">⇒ 次数 ≥ ⌈c/2⌉</text>

  <rect x="440" y="238" width="352" height="104" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="616" y="264" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">上界：按位置顺序两两配对</text>
  <text x="616" y="290" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">取 l = p+1、r = q（中间全是 0）</text>
  <text x="616" y="312" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">落单的最后一个用 r = n 的后缀单翻</text>

  <text x="420" y="374" text-anchor="middle" font-size="12.5" fill="#5a5a5a" filter="url(#rough2)">c 为奇数时：⌊c/2⌋ 次配对 + 1 次收尾 = ⌈c/2⌉；与下界相撞，故 beauty 恰为 ⌈c/2⌉</text>
  <text x="420" y="398" text-anchor="middle" font-size="12.5" fill="#5a5a5a" filter="url(#rough2)">c = 0 时 t 本来就 clean，beauty = 0，公式同样成立</text>
</svg>
