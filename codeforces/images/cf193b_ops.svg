<svg xmlns="http://www.w3.org/2000/svg" width="780" height="380" viewBox="0 0 780 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="780" height="380" fill="#fafafa"/>
  <text x="390.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">193B：两种操作，连续两次操作 1 等价于没做</text>
  <path d="M 189.93000000000006 46 Q 390.0 52 590.0699999999999 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60.0" y="70.0" width="320.0" height="110.0" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="76.0" y="96.0" text-anchor="start" font-size="12.0" font-weight="bold" fill="#446688" filter="url(#rough2)">操作 1</text>
  <text x="76.0" y="122.0" text-anchor="start" font-size="11.2" fill="#2b2b2b" filter="url(#rough2)">对每个 i：a_i ← a_i xor b_i</text>
  <text x="76.0" y="146.0" text-anchor="start" font-size="10.8" fill="#6b6b6b" filter="url(#rough2)">是一个对合：做两次回到原样</text>
  <rect x="420.0" y="70.0" width="320.0" height="110.0" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="436.0" y="96.0" text-anchor="start" font-size="12.0" font-weight="bold" fill="#2f5b34" filter="url(#rough2)">操作 2</text>
  <text x="436.0" y="122.0" text-anchor="start" font-size="11.2" fill="#2b2b2b" filter="url(#rough2)">对每个 i：a_i ← a_{p_i} + r</text>
  <text x="436.0" y="146.0" text-anchor="start" font-size="10.8" fill="#6b6b6b" filter="url(#rough2)">同时置换再整体加 r</text>
  <rect x="60.0" y="200.0" width="680.0" height="62.0" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="224.0" text-anchor="start" font-size="11.1" fill="#8a6015" filter="url(#rough2)">关键：任何含「11」的操作序列都等价于把这两个 1 删掉后更短的序列（因为操作 1 是对合）。</text>
  <text x="74.0" y="246.0" text-anchor="start" font-size="11.1" fill="#8a6015" filter="url(#rough2)">反之，任意短序列都能通过插入若干「11」补到恰好 u 步，且结果不变 ⇒ 只需枚举不含「11」的序列。</text>
  <rect x="60.0" y="280.0" width="680.0" height="76.0" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="304.0" text-anchor="start" font-size="11.1" fill="#33506e" filter="url(#rough2)">长度 ≤ u 且与 u 同奇偶的无「11」序列数 = Fibonacci 量级：u=30 时约 3.5×10⁶ 个节点。</text>
  <text x="74.0" y="326.0" text-anchor="start" font-size="11.1" fill="#33506e" filter="url(#rough2)">沿 DFS 增量维护数组，走到同奇偶的节点就算一次得分，总复杂度 O(Fib(u)·n)，本题 71 ms。</text>
</svg>
