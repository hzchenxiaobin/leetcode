  <text x="330" y="264" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">A_m = e_m · e_(3−m) ，S_m = Σ j&lt;m 时 (3−2j)A_j ，μ_m = (2m+1)A_m − 2S_m</text>
