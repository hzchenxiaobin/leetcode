<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="400" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="38" text-anchor="middle" font-size="18.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">48B：两种摆法 + 二维前缀和</text>
  <path d="M 137 50 Q 380 56 623 50" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60" y="100" width="44" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1.0" filter="url(#rough2)"/>
  <rect x="104" y="100" width="44" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1.0" filter="url(#rough2)"/>
  <rect x="148" y="100" width="44" height="44" fill="#3d3d3d" stroke="#bbb" stroke-width="1.0" filter="url(#rough2)"/>
  <rect x="192" y="100" width="44" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1.0" filter="url(#rough2)"/>
  <rect x="236" y="100" width="44" height="44" fill="#3d3d3d" stroke="#bbb" stroke-width="1.0" filter="url(#rough2)"/>
  <rect x="60" y="144" width="44" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1.0" filter="url(#rough2)"/>
  <rect x="104" y="144" width="44" height="44" fill="#3d3d3d" stroke="#bbb" stroke-width="1.0" filter="url(#rough2)"/>
  <rect x="148" y="144" width="44" height="44" fill="#3d3d3d" stroke="#bbb" stroke-width="1.0" filter="url(#rough2)"/>
  <rect x="192" y="144" width="44" height="44" fill="#3d3d3d" stroke="#bbb" stroke-width="1.0" filter="url(#rough2)"/>
  <rect x="236" y="144" width="44" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1.0" filter="url(#rough2)"/>
  <rect x="60" y="188" width="44" height="44" fill="#3d3d3d" stroke="#bbb" stroke-width="1.0" filter="url(#rough2)"/>
  <rect x="104" y="188" width="44" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1.0" filter="url(#rough2)"/>
  <rect x="148" y="188" width="44" height="44" fill="#3d3d3d" stroke="#bbb" stroke-width="1.0" filter="url(#rough2)"/>
  <rect x="192" y="188" width="44" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1.0" filter="url(#rough2)"/>
  <rect x="236" y="188" width="44" height="44" fill="#3d3d3d" stroke="#bbb" stroke-width="1.0" filter="url(#rough2)"/>
  <rect x="60" y="232" width="44" height="44" fill="#3d3d3d" stroke="#bbb" stroke-width="1.0" filter="url(#rough2)"/>
  <rect x="104" y="232" width="44" height="44" fill="#3d3d3d" stroke="#bbb" stroke-width="1.0" filter="url(#rough2)"/>
  <rect x="148" y="232" width="44" height="44" fill="#3d3d3d" stroke="#bbb" stroke-width="1.0" filter="url(#rough2)"/>
  <rect x="192" y="232" width="44" height="44" fill="#3d3d3d" stroke="#bbb" stroke-width="1.0" filter="url(#rough2)"/>
  <rect x="236" y="232" width="44" height="44" fill="#3d3d3d" stroke="#bbb" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="170.0" y="88" text-anchor="middle" font-size="11.5" fill="#2f4a66" font-weight="normal" filter="url(#rough2)">花园（样例 2，4×5）</text>
  <rect x="360" y="110" width="340" height="120" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="376" y="138" text-anchor="start" font-size="12" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">a×b 与 b×a 两种摆法都要试：</text>
  <text x="376" y="164" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">· 长 a 的边可以平行 n，也可以平行 m</text>
  <text x="376" y="188" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">· 某一种放不下（a&gt;n 或 b&gt;m）就跳过</text>
  <text x="376" y="212" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">· 用二维前缀和 O(1) 求每块内的树数</text>
  <rect x="360" y="250" width="340" height="110" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="376" y="278" text-anchor="start" font-size="11.5" fill="#2f5223" font-weight="bold" filter="url(#rough2)">前缀和：sum(x1..x2, y1..y2) =</text>
  <text x="376" y="304" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">P[x2][y2]-P[x1][y2]-P[x2][y1]+P[x1][y1]</text>
  <text x="376" y="332" text-anchor="start" font-size="11.5" fill="#2f5223" font-weight="normal" filter="url(#rough2)">全部摆法取最小 ⇒ 答案</text>
  <text x="60" y="380" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">样例 2 答案 2：选 2×3 的块最少能只砍 2 棵树。</text>
</svg>
