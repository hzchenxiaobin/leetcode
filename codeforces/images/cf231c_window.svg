<svg xmlns="http://www.w3.org/2000/svg" width="840" height="340" viewBox="0 0 840 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="340" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">把左边连续一段元素抬到 a_i</text>
  <text x="420" y="56" text-anchor="middle" font-size="11.8" fill="#666666" filter="url(#rough2)">目标 a_i，窗口 [j,i]，代价 = a_i·(i−j+1) − 段和</text>
  <g filter="url(#rough2)"><rect x="200" y="100" width="66" height="46" rx="4" fill="#f2f2f2" fill-opacity="0.85" stroke="#cccccc" stroke-width="1.3"/></g>
  <text x="233" y="129" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)"><rect x="280" y="100" width="66" height="46" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="313" y="129" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="360" y="100" width="66" height="46" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="393" y="129" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="440" y="100" width="66" height="46" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="473" y="129" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><rect x="520" y="100" width="66" height="46" rx="4" fill="#f2f2f2" fill-opacity="0.85" stroke="#cccccc" stroke-width="1.3"/></g>
  <text x="553" y="129" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">6</text>
  <g filter="url(#rough2)"><path d="M 280 166 L 480 166" fill="none" stroke="#a0522d" stroke-width="1.6" stroke-linejoin="round"/></g>
  <text x="380" y="188" text-anchor="middle" font-size="11.5" fill="#8a4b2a" filter="url(#rough2)">窗口 [1,3]，代价 = 4·3 − 9 = 3</text>
  <text x="420" y="226" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">k=3 时得到 4,4,4 三个 4，答案 3 4</text>
  <g filter="url(#rough2)"><rect x="200" y="252" width="440" height="44" rx="4" fill="#f7fbf4" fill-opacity="0.85" stroke="#a8c99a" stroke-width="1.3"/></g>
  <text x="420" y="280" text-anchor="middle" font-size="11.5" fill="#3d6b2f" filter="url(#rough2)">目标值一定可取数组里已有的值（降目标的代价更小）</text>
</svg>
