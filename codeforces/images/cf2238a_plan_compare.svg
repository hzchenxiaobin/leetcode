<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="430" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">只有两种方案：付 0 次换序，或付 1 次换序</text>
  <path d="M 176 40 Q 380 47 584 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <rect x="110" y="56" width="540" height="56" rx="10" fill="#eef1f5" stroke="#8899aa" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="79" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33475c" filter="url(#rough2)">不变量：终态 a = b ⇒ 减法总次数恒为 S = Σ(aᵢ − bᵢ)</text>
  <text x="380" y="101" text-anchor="middle" font-size="12" fill="#33475c" filter="url(#rough2)">所以总耗时 = S + c × (换序次数)，只需在 0 次与 1 次之间选</text>

  <path d="M 330 112 L 220 146" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 430 112 L 540 146" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="48" y="150" width="318" height="152" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="207" y="176" text-anchor="middle" font-size="14" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">方案 A：一次都不换序</text>
  <text x="207" y="204" text-anchor="middle" font-size="12" fill="#2f4a2a" filter="url(#rough2)">条件：对每个 i 都有 aᵢ ≥ bᵢ</text>
  <text x="207" y="230" text-anchor="middle" font-size="12" fill="#2f4a2a" filter="url(#rough2)">耗时：S</text>
  <text x="207" y="258" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">省下 c 秒，但要求最苛刻</text>
  <text x="207" y="280" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">（对应 π = 恒等排列）</text>

  <rect x="394" y="150" width="318" height="152" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="553" y="176" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">方案 B：至少换序一次</text>
  <text x="553" y="204" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">条件：升序后 saₖ ≥ sbₖ 对每个 k</text>
  <text x="553" y="230" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">耗时：c + S</text>
  <text x="553" y="258" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">升序配对是最宽松的配对</text>
  <text x="553" y="280" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">所以换序一次就够，不必反复换</text>

  <path d="M 207 302 L 290 328" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 553 302 L 470 328" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="330" width="420" height="44" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="380" y="358" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">ans = min（A 可行 ? S，B 可行 ? c + S）</text>

  <text x="380" y="398" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">两个条件都不成立 ⇒ 输出 −1（任何排列都无解）</text>
  <text x="380" y="418" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">例：a = [5,2,3]、b = [2,3,4]、c = 5 → 逐位 2 &lt; 3 失败，但升序 2,3,5 ≥ 2,3,4 成立 ⇒ 5 + 1 = 6</text>
</svg>
