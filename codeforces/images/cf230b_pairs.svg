<svg xmlns="http://www.w3.org/2000/svg" width="840" height="340" viewBox="0 0 840 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="340" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">约数成对出现，只有平方数落单</text>
  <text x="420" y="56" text-anchor="middle" font-size="11.8" fill="#666666" filter="url(#rough2)">4 的约数 1,2,4：3 个；5 的约数 1,5：2 个</text>
  <text x="150" y="126" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><rect x="240" y="100" width="70" height="46" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="275" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="330" y="100" width="70" height="46" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="365" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="420" y="100" width="70" height="46" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="455" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="150" y="226" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <g filter="url(#rough2)"><rect x="240" y="200" width="70" height="46" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="275" y="230" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="330" y="200" width="70" height="46" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="365" y="230" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <text x="620" y="130" text-anchor="start" font-size="11" fill="#777777" filter="url(#rough2)">1 × 4 = 4</text>
  <text x="620" y="154" text-anchor="start" font-size="11" fill="#3d6b2f" filter="url(#rough2)">2 与自己配对</text>
  <text x="620" y="230" text-anchor="start" font-size="11" fill="#777777" filter="url(#rough2)">1 × 5 = 5</text>
  <text x="420" y="296" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">约数个数为奇数 ⇔ 完全平方数；恰 3 个 ⇔ p²（p 素数）</text>
</svg>
