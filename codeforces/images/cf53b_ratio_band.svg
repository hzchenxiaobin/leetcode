<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420">
<defs>
  <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs>
<rect x="0" y="0" width="760" height="420" fill="#fafafa"/>
<text x="380.0" y="34" font-size="22" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="bold" text-anchor="middle" filter="url(#rough2)">允许的宽高比：0.8 ≤ h/w ≤ 1.25</text>
<line x1="90" y1="340" x2="700" y2="340" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
<line x1="90" y1="340" x2="90" y2="80" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
<text x="690" y="368" font-size="18" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="normal" text-anchor="end" filter="url(#rough2)">w</text>
<text x="70" y="90" font-size="18" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="normal" text-anchor="end" filter="url(#rough2)">h</text>
<polygon points="90,340 690,172 690,80" fill="#eef5ff" opacity="0.8" filter="url(#rough2)"/>
<line x1="90" y1="340" x2="690" y2="172" stroke="#2e7d32" stroke-width="3" filter="url(#rough2)"/>
<line x1="90" y1="340" x2="690" y2="80" stroke="#1a5fb4" stroke-width="3" filter="url(#rough2)"/>
<text x="560" y="160" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#1a5fb4" font-weight="normal" text-anchor="start" filter="url(#rough2)">h = 1.25 w</text>
<text x="470" y="300" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#2e7d32" font-weight="normal" text-anchor="start" filter="url(#rough2)">h = 0.8 w</text>
<text x="100" y="120" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="normal" text-anchor="start" filter="url(#rough2)">可行区域（夹在两条线之间）</text>
<rect x="360" y="180" width="300" height="46" rx="8" fill="#fff4d6" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="510.0" y="207.9" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">裁剪矩形必须落在这条带内</text>
</svg>
