<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="313"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="320" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">A：两个样例的逐对差值</text>
  <path d="M 200 42 Q 380 47 560 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <rect x="36" y="66" width="688" height="104" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="48" y="90" font-size="11.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">样例 1：10 12 13 15 10</text>
  <text x="48" y="114" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">|10−12| = 2　　|12−13| = 1　　|13−15| = 2</text>
  <text x="48" y="136" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">|15−10| = 5　　|10−10| = 0 ← 首尾相邻，最小</text>
  <text x="48" y="158" font-size="10.5" fill="#2f5223" filter="url(#rough2)">输出 5 1（士兵 5 与士兵 1）</text>

  <rect x="36" y="180" width="688" height="104" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="48" y="204" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">样例 2：10 20 30 40</text>
  <text x="48" y="228" font-size="10.5" fill="#3c5e88" filter="url(#rough2)">|10−20| = 10　|20−30| = 10　|30−40| = 10　|40−10| = 30</text>
  <text x="48" y="250" font-size="10.5" fill="#3c5e88" filter="url(#rough2)">最小值 10 出现三次，输出最先遇到的一对 (1,2)</text>
  <text x="48" y="272" font-size="10" fill="#8c3a36" filter="url(#rough2)">题面说“多解输出任意一组”，所以 (2,3)、(3,4) 也对——判分是特殊评测。</text>
</svg>
