<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1313"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="700" height="300" fill="#fafafa"/>
  <text x="350.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按值桶计数</text>
  <path d="M 112.0 42 Q 350.0 48 588.0 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="350.0" y="286" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">对 x>0 加 cnt[x]·cnt[−x]；0 用 C(cnt,2)</text>
  <rect x="90" y="70" width="90" height="60" rx="7" fill="#f4f4f1" stroke="#b8b8b0" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="135" y="97" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">-2</text>
  <text x="135" y="118" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">cnt=2</text>
  <rect x="200" y="70" width="90" height="60" rx="7" fill="#f4f4f1" stroke="#b8b8b0" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="245" y="97" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">-1</text>
  <text x="245" y="118" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">cnt=1</text>
  <rect x="310" y="70" width="90" height="60" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="355" y="97" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="355" y="118" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">cnt=3</text>
  <rect x="420" y="70" width="90" height="60" rx="7" fill="#f4f4f1" stroke="#b8b8b0" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="465" y="97" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="465" y="118" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">cnt=1</text>
  <rect x="530" y="70" width="90" height="60" rx="7" fill="#f4f4f1" stroke="#b8b8b0" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="575" y="97" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="575" y="118" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">cnt=2</text>
  <text x="350" y="165" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">答案 = C(3,2) + 2·2 + 1·1 = 3 + 4 + 1 = 8</text>
  <text x="350" y="200" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">只遍历正数，避免同一对算两次</text>
  <text x="350" y="240" text-anchor="middle" font-size="11.5" fill="#8c2f2c" filter="url(#rough2)">答案可能到 5×10⁹，需 64 位</text>
</svg>
