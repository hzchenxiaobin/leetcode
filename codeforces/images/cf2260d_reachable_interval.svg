<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="680" height="430" fill="#fafafa"/>

  <text x="340" y="34" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">C ≥ 2：可达幅值集合始终是一个整区间，只记最小值 lo</text>

  <!-- 左：上一段结束时的幅值集合 -->
  <rect x="34" y="56" width="288" height="152" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="178" y="82" text-anchor="middle" font-size="13" fill="#2b4a6b" filter="url(#rough2)">上一段（符号为 +）的末项幅值</text>
  <rect x="60" y="96" width="236" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="60" y="96" width="36" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="78" y="146" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">1..lo</text>
  <text x="292" y="146" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">最大 M</text>
  <text x="178" y="174" text-anchor="middle" font-size="13" fill="#2b4a6b" filter="url(#rough2)">集合 = [lo, M]，连续无洞</text>
  <text x="178" y="196" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">lo 越小，下一段越宽</text>

  <path d="M326 132 L368 132" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="347" y="122" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">翻转</text>

  <!-- 右：翻转后新一段首项的允许幅值 -->
  <rect x="378" y="56" width="268" height="152" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="512" y="82" text-anchor="middle" font-size="13" fill="#33562a" filter="url(#rough2)">翻转后新一段的首项幅值</text>
  <rect x="402" y="96" width="220" height="30" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="402" y="96" width="150" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="476" y="116" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">1 .. C − lo</text>
  <text x="512" y="174" text-anchor="middle" font-size="13" fill="#33562a" filter="url(#rough2)">集合 = [1, C − lo]</text>
  <text x="512" y="196" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">M 多大完全不影响后续</text>

  <!-- 中间公式 -->
  <rect x="118" y="234" width="444" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="340" y="258" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">翻转一步：|x| + |y| ≤ C　⇒　|y| ≤ C − |x|</text>
  <text x="340" y="279" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">x 是上一段末项，y 是新一段首项，两者异号</text>

  <!-- 底部：段内递推 -->
  <rect x="46" y="308" width="588" height="100" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="340" y="332" text-anchor="middle" font-size="13" fill="#8a3b38" filter="url(#rough2)">同号段内：从 x 一步可达 [max(1, x−C), x+C] ∖ {x}</text>
  <text x="340" y="356" text-anchor="middle" font-size="13" fill="#8a3b38" filter="url(#rough2)">两个相邻的 x 会互相补上对方挖掉的「凹点」</text>
  <text x="340" y="380" text-anchor="middle" font-size="13" fill="#8a3b38" filter="url(#rough2)">⇒ 并集仍是整区间；状态只需记录最小可达幅值 lo</text>
  <text x="340" y="402" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">入口额度 E = 本段首项幅值上限，第一段 E = C</text>
</svg>
