<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1347"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="700" height="300" fill="#fafafa"/>
  <text x="350.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">排序后左移一位</text>
  <path d="M 112.0 42 Q 350.0 48 588.0 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="350.0" y="286" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">把某个数换成 1 ⇒ 新数组 = 1 + 去掉被换元素</text>
  <rect x="80" y="80" width="80" height="60" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="120" y="117" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5223" filter="url(#rough2)">2</text>
  <rect x="180" y="80" width="80" height="60" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="220" y="117" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5223" filter="url(#rough2)">3</text>
  <rect x="280" y="80" width="80" height="60" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="320" y="117" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5223" filter="url(#rough2)">4</text>
  <rect x="380" y="80" width="80" height="60" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="420" y="117" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5223" filter="url(#rough2)">5</text>
  <rect x="480" y="80" width="80" height="60" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="520" y="117" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5223" filter="url(#rough2)">6</text>
  <text x="350" y="65" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">原数组（2..6）</text>
  <rect x="80" y="180" width="80" height="60" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="120" y="217" text-anchor="middle" font-size="14" font-weight="bold" fill="#335478" filter="url(#rough2)">1</text>
  <rect x="180" y="180" width="80" height="60" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="220" y="217" text-anchor="middle" font-size="14" font-weight="bold" fill="#335478" filter="url(#rough2)">2</text>
  <rect x="280" y="180" width="80" height="60" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="320" y="217" text-anchor="middle" font-size="14" font-weight="bold" fill="#335478" filter="url(#rough2)">3</text>
  <rect x="380" y="180" width="80" height="60" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="420" y="217" text-anchor="middle" font-size="14" font-weight="bold" fill="#335478" filter="url(#rough2)">4</text>
  <rect x="480" y="180" width="80" height="60" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="520" y="217" text-anchor="middle" font-size="14" font-weight="bold" fill="#335478" filter="url(#rough2)">5</text>
  <text x="350" y="165" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">把 6 换成 1 后</text>
  <text x="350" y="275" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">位置 0 → 1；位置 i≥1 → 原 a[i−1]；末位例外：全 1 时是 2</text>
</svg>
