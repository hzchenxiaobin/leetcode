<svg xmlns="http://www.w3.org/2000/svg" width="840" height="380" viewBox="0 0 840 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="380" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">最贵 n 件的"阈值"结构</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">n=3：40, 40, 30；θ=30 是第 3 大价格</text>
  <g filter="url(#rough2)"><rect x="170" y="100" width="84" height="56" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="212" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">40</text>
  <text x="212" y="146" text-anchor="middle" font-size="9.5" fill="#666666" filter="url(#rough2)">name1</text>
  <text x="212" y="178" text-anchor="middle" font-size="10" fill="#3d6b2f" filter="url(#rough2)">必选</text>
  <g filter="url(#rough2)"><rect x="270" y="100" width="84" height="56" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="312" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">40</text>
  <text x="312" y="146" text-anchor="middle" font-size="9.5" fill="#666666" filter="url(#rough2)">name2</text>
  <text x="312" y="178" text-anchor="middle" font-size="10" fill="#3d6b2f" filter="url(#rough2)">必选</text>
  <g filter="url(#rough2)"><rect x="370" y="100" width="84" height="56" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="412" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">30</text>
  <text x="412" y="146" text-anchor="middle" font-size="9.5" fill="#666666" filter="url(#rough2)">name2</text>
  <text x="412" y="178" text-anchor="middle" font-size="10" fill="#3d6b2f" filter="url(#rough2)">阈值</text>
  <g filter="url(#rough2)"><rect x="470" y="100" width="84" height="56" rx="4" fill="#f2f2f2" fill-opacity="0.85" stroke="#cccccc" stroke-width="1.3"/></g>
  <text x="512" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">20</text>
  <text x="512" y="146" text-anchor="middle" font-size="9.5" fill="#666666" filter="url(#rough2)">name2</text>
  <g filter="url(#rough2)"><rect x="570" y="100" width="84" height="56" rx="4" fill="#f2f2f2" fill-opacity="0.85" stroke="#cccccc" stroke-width="1.3"/></g>
  <text x="612" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">10</text>
  <text x="612" y="146" text-anchor="middle" font-size="9.5" fill="#666666" filter="url(#rough2)">name2</text>
  <text x="420" y="220" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">价格 &gt; θ 的礼物全部必须拿到；价格 = θ 的礼物中挑 r 件</text>
  <g filter="url(#rough2)"><rect x="180" y="244" width="480" height="56" rx="4" fill="#f7fbf4" fill-opacity="0.85" stroke="#a8c99a" stroke-width="1.3"/></g>
  <text x="420" y="268" text-anchor="middle" font-size="13" font-weight="bold" fill="#3d6b2f" filter="url(#rough2)">s_i = a_i + b_i，Σ b_i = r</text>
  <text x="420" y="290" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">a_i：名字 i 中价格 &gt;θ 的件数；b_i∈{0,1} 表示是否取阈值件</text>
  <text x="420" y="340" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">同一个最优 s 的方案有多个时，老人等概率选一个</text>
</svg>
