<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="760" height="400" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：g 是第一个「凑不齐 2k 张」的值</text>
  <path d="M 176 42 Q 380 49 584 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 阈值线 2k -->
  <path d="M 56 186 L 706 186" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="9 6" fill="none" filter="url(#rough2)"/>
  <text x="712" y="182" font-size="12.5" fill="#8a6015" filter="url(#rough2)">2k</text>

  <!-- 坐标轴 -->
  <path d="M 60 310 L 650 310" stroke="#2b2b2b" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <!-- 柱子 v = 0..5，单位 20px / 张 -->
  <rect x="84" y="150" width="58" height="160" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="180" y="170" width="58" height="140" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="276" y="210" width="58" height="100" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.6" filter="url(#rough2)"/>
  <rect x="372" y="230" width="58" height="80" rx="4" fill="#f2f5f7" stroke="#8c9aa8" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="468" y="290" width="58" height="20" rx="4" fill="#f2f5f7" stroke="#8c9aa8" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="564" y="304" width="58" height="6" rx="3" fill="#e2e6ea" stroke="#8c9aa8" stroke-width="1.4" filter="url(#rough2)"/>

  <text x="113" y="142" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">8</text>
  <text x="209" y="162" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">7</text>
  <text x="305" y="202" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">5</text>
  <text x="401" y="222" text-anchor="middle" font-size="12.5" fill="#55636f" filter="url(#rough2)">4</text>
  <text x="497" y="282" text-anchor="middle" font-size="12.5" fill="#55636f" filter="url(#rough2)">1</text>
  <text x="593" y="296" text-anchor="middle" font-size="12.5" fill="#55636f" filter="url(#rough2)">0</text>

  <text x="113" y="330" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">v=0</text>
  <text x="209" y="330" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">v=1</text>
  <text x="305" y="330" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">v=2 = g</text>
  <text x="401" y="330" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">v=3</text>
  <text x="497" y="330" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">v=4</text>
  <text x="593" y="330" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">v=5</text>

  <!-- 绿色区间标注：v < g -->
  <path d="M 78 118 L 336 118" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="207" y="112" text-anchor="middle" font-size="11.8" fill="#33582a" filter="url(#rough2)">c_v ≥ 2k：双方都有机会凑够 k 张</text>
  <path d="M 336 118 L 344 128" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 指向 g 的箭头 -->
  <path d="M 386 152 C 366 168 350 190 338 206" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="392" y="148" font-size="11.8" fill="#8c3a37" filter="url(#rough2)">g：c_g = 5 = 2k−1，Bob 拿不到第 6 张 → 只能停在 g</text>

  <!-- 底部两条注解 -->
  <rect x="44" y="344" width="330" height="46" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="364" font-size="11.6" fill="#33582a" filter="url(#rough2)">v &lt; g 时 c_v ≥ 2k：若一方 &lt; k 张，</text>
  <text x="60" y="382" font-size="11.6" fill="#33582a" filter="url(#rough2)">另一方必然 ≥ k+1 张 ⇒ 双方 mex 必不同</text>

  <rect x="392" y="344" width="330" height="46" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="408" y="364" font-size="11.6" fill="#8c3a37" filter="url(#rough2)">v = g 时 c_g ≤ 2k−1：双方不可能同时 ≥ k，</text>
  <text x="408" y="382" font-size="11.6" fill="#8c3a37" filter="url(#rough2)">于是胜负只取决于 c_g 是否恰为 2k−1</text>
</svg>
