<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="900" height="430" fill="#fafafa"/>

  <text x="450" y="30" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">Hard 版的关键：绝对值只会在「赋值」和「被 0 截断」时改变</text>

  <!-- 三个操作框 -->
  <rect x="46" y="60" width="248" height="112" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="170" y="86" text-anchor="middle" font-size="14.5" fill="#33506b" filter="url(#rough2)">2 l r ：取反</text>
  <text x="170" y="114" text-anchor="middle" font-size="16" fill="#33506b" filter="url(#rough2)">v → -v</text>
  <text x="170" y="142" text-anchor="middle" font-size="12.5" fill="#33506b" filter="url(#rough2)">|v| 完全不变</text>
  <text x="170" y="161" text-anchor="middle" font-size="12.5" fill="#33506b" filter="url(#rough2)">只有符号翻转</text>

  <rect x="326" y="60" width="248" height="112" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="450" y="86" text-anchor="middle" font-size="14.5" fill="#3f6633" filter="url(#rough2)">3 l r ：与 0 取 max</text>
  <text x="450" y="114" text-anchor="middle" font-size="16" fill="#3f6633" filter="url(#rough2)">v → max(v, 0)</text>
  <text x="450" y="142" text-anchor="middle" font-size="12.5" fill="#3f6633" filter="url(#rough2)">|v| 不变，或直接被压成 0</text>
  <text x="450" y="161" text-anchor="middle" font-size="12.5" fill="#3f6633" filter="url(#rough2)">负数才会被清零</text>

  <rect x="606" y="60" width="248" height="112" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="730" y="86" text-anchor="middle" font-size="14.5" fill="#8f3a36" filter="url(#rough2)">1 l r x ：赋值</text>
  <text x="730" y="114" text-anchor="middle" font-size="16" fill="#8f3a36" filter="url(#rough2)">v → x</text>
  <text x="730" y="142" text-anchor="middle" font-size="12.5" fill="#8f3a36" filter="url(#rough2)">绝对值被重置为 |x|</text>
  <text x="730" y="161" text-anchor="middle" font-size="12.5" fill="#8f3a36" filter="url(#rough2)">此后只会是 ±|x| 或 0</text>

  <!-- 结论 -->
  <rect x="46" y="196" width="808" height="66" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="450" y="222" text-anchor="middle" font-size="14.5" fill="#8a6420" filter="url(#rough2)">于是：一段不含赋值的操作里，追加的每个值都是 εⱼ · |x|，其中 εⱼ ∈ {+1, -1, 0}</text>
  <text x="450" y="248" text-anchor="middle" font-size="13" fill="#8a6420" filter="url(#rough2)">而 ε 序列只取决于 x 的正负，不取决于 x 的大小</text>

  <!-- 缩放关系 -->
  <rect x="46" y="284" width="380" height="120" rx="9" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="236" y="310" text-anchor="middle" font-size="14" fill="#33506b" filter="url(#rough2)">正数只用一份「基」</text>
  <text x="236" y="342" text-anchor="middle" font-size="15" fill="#33506b" filter="url(#rough2)">info(x) = |x| · info(+1)</text>
  <text x="236" y="370" text-anchor="middle" font-size="12.5" fill="#33506b" filter="url(#rough2)">x &gt; 0：把 x = 1 时的 (s,p,q,m)</text>
  <text x="236" y="390" text-anchor="middle" font-size="12.5" fill="#33506b" filter="url(#rough2)">整体乘以 |x| 即可</text>

  <rect x="474" y="284" width="380" height="120" rx="9" fill="#ffffff" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="664" y="310" text-anchor="middle" font-size="14" fill="#8f3a36" filter="url(#rough2)">负数同理，换一份「基」</text>
  <text x="664" y="342" text-anchor="middle" font-size="15" fill="#8f3a36" filter="url(#rough2)">info(x) = |x| · info(-1)</text>
  <text x="664" y="370" text-anchor="middle" font-size="12.5" fill="#8f3a36" filter="url(#rough2)">x &lt; 0：负号被吸收进基里，</text>
  <text x="664" y="390" text-anchor="middle" font-size="12.5" fill="#8f3a36" filter="url(#rough2)">剩下 |x| 是正倍数，可以自由缩放</text>

  <path d="M426,344 L470,344" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
