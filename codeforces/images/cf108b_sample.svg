<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 342" width="640" height="342">
<defs>
<filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="13" result="noise"/>
<feDisplacementMap in="SourceGraphic" in2="noise" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect x="0" y="0" width="640" height="342" fill="#fafafa"/>
<g font-family="Comic Sans MS, Kaiti SC, cursive">
<text x="320.0" y="24.0" font-size="15" fill="#33475b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">样例 2：位数 {1,2,3,4}，检查相邻对</text>
<rect x="100.0" y="66.0" width="100.0" height="44.0" rx="8" fill="#eef4fb" stroke="#7a93a8" stroke-width="1.6" filter="url(#rough2)"/>
<text x="150.0" y="94.0" font-size="13" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">(1,2)</text>
<rect x="212.0" y="66.0" width="340.0" height="44.0" rx="8" fill="#ffffff" stroke="#b9c6d6" stroke-width="1.4" filter="url(#rough2)"/>
<text x="382.0" y="94.0" font-size="12" fill="#888" text-anchor="middle" font-weight="normal" filter="url(#rough2)">u=1 &lt; 2，跳过</text>
<rect x="100.0" y="128.0" width="100.0" height="44.0" rx="8" fill="#eef4fb" stroke="#7a93a8" stroke-width="1.6" filter="url(#rough2)"/>
<text x="150.0" y="156.0" font-size="13" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">(2,3)</text>
<rect x="212.0" y="128.0" width="340.0" height="44.0" rx="8" fill="#ffffff" stroke="#b9c6d6" stroke-width="1.4" filter="url(#rough2)"/>
<text x="382.0" y="156.0" font-size="12" fill="#1f6f43" text-anchor="middle" font-weight="normal" filter="url(#rough2)">3 ≤ 2·2−1 = 3 ✓</text>
<rect x="100.0" y="190.0" width="100.0" height="44.0" rx="8" fill="#eef4fb" stroke="#7a93a8" stroke-width="1.6" filter="url(#rough2)"/>
<text x="150.0" y="218.0" font-size="13" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">(3,4)</text>
<rect x="212.0" y="190.0" width="340.0" height="44.0" rx="8" fill="#ffffff" stroke="#b9c6d6" stroke-width="1.4" filter="url(#rough2)"/>
<text x="382.0" y="218.0" font-size="12" fill="#1f6f43" text-anchor="middle" font-weight="normal" filter="url(#rough2)">4 ≤ 5 ✓（已命中）</text>
<text x="320.0" y="272.0" font-size="13" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">第一个满足的相邻对就输出 YES</text>
<text x="320.0" y="300.0" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">样例 1：{16,32,64} 两对都不满足 → NO</text>
<text x="320.0" y="326.0" font-size="12" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">临界值：b = 2a 不行，b = 2a − 1 才行</text>
</g>
</svg>
