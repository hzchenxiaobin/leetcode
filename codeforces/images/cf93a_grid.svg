<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="720" height="440" fill="#fafafa"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">文件夹按行排布，选出 [a, b] 就是一块「阶梯」</text>
  <path d="M 200 43 Q 360 49 520 43" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <rect x="90" y="90" width="84" height="50" rx="5" fill="#ffffff" stroke="#777777" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="132" y="122" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <rect x="180" y="90" width="84" height="50" rx="5" fill="#ffffff" stroke="#777777" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="222" y="122" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <rect x="270" y="90" width="84" height="50" rx="5" fill="#e9f4e2" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="312" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <rect x="360" y="90" width="84" height="50" rx="5" fill="#e9f4e2" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="402" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <rect x="90" y="146" width="84" height="50" rx="5" fill="#e9f4e2" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="132" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <rect x="180" y="146" width="84" height="50" rx="5" fill="#e9f4e2" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="222" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">6</text>
  <rect x="270" y="146" width="84" height="50" rx="5" fill="#e9f4e2" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="312" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">7</text>
  <rect x="360" y="146" width="84" height="50" rx="5" fill="#e9f4e2" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="402" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">8</text>
  <rect x="90" y="202" width="84" height="50" rx="5" fill="#e9f4e2" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="132" y="234" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">9</text>
  <rect x="180" y="202" width="84" height="50" rx="5" fill="#ffffff" stroke="#777777" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="222" y="234" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">10</text>
  <rect x="270" y="202" width="84" height="50" rx="5" fill="#ffffff" stroke="#777777" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="312" y="234" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">11</text>
  <text x="90" y="76" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">样例 1：n=11, m=4, a=3, b=9（绿色为要选中的）</text>
  <rect x="470" y="90" width="210" height="120" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="486" y="116" text-anchor="start" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">为什么至少要 3 次？</text>
  <text x="486" y="142" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">第 1 行要 3、4；最后一行</text>
  <text x="486" y="162" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">只有 9，而中间整行都要。</text>
  <text x="486" y="186" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">两次矩形做不到这个形状。</text>
  <text x="486" y="206" text-anchor="start" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">→ 答案 3</text>
  <rect x="60" y="300" width="620" height="60" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="76" y="326" text-anchor="start" font-size="11.5" fill="#446688" filter="url(#rough2)">注意「重复选中会取消」，所以重叠的矩形会把重叠部分反选掉——</text>
  <text x="76" y="348" text-anchor="start" font-size="11.5" fill="#446688" filter="url(#rough2)">两个矩形要恰好拼出目标形状，通常要求它们在列方向上无缝且不重叠。</text>
  <text x="60" y="394" text-anchor="start" font-size="11" fill="#777777" filter="url(#rough2)">所有可能的情况只有 1、2、3 次：按「同一行 / 只有单个缺口 / 两行 / 列相邻」分类讨论即可。</text>
</svg>
