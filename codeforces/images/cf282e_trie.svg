<svg xmlns="http://www.w3.org/2000/svg" width="700" height="380" viewBox="0 0 700 380"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="193"/>
    <feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></defs>
  <rect width="700" height="380" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">01-trie：贪心地「尽量走相反位」求最大异或</text>
  <path d="M 130 40 Q 350 46 570 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <circle cx="350" cy="70" r="18" fill="#dfeafc" stroke="#446688" stroke-width="1.6"/>
    <circle cx="250" cy="130" r="16" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <circle cx="450" cy="130" r="16" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <circle cx="190" cy="190" r="14" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <circle cx="310" cy="190" r="14" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <circle cx="390" cy="190" r="14" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <circle cx="510" cy="190" r="14" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
  </g>
  <g stroke="#446688" stroke-width="1.3" fill="none" filter="url(#rough2)">
    <line x1="336" y1="82" x2="262" y2="118"/>
    <line x1="364" y1="82" x2="438" y2="118"/>
    <line x1="242" y1="142" x2="200" y2="178"/>
    <line x1="258" y1="142" x2="300" y2="178"/>
    <line x1="442" y1="142" x2="400" y2="178"/>
    <line x1="458" y1="142" x2="500" y2="178"/>
  </g>
  <g font-size="11" fill="#8a3a36" filter="url(#rough2)">
    <text x="286" y="104">0</text>
    <text x="410" y="104">1</text>
    <text x="212" y="166">0</text>
    <text x="286" y="166">1</text>
    <text x="410" y="166">0</text>
    <text x="486" y="166">1</text>
  </g>
  <g filter="url(#rough2)"><rect x="60" y="216" width="580" height="70" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="240" font-size="13" fill="#22314a" filter="url(#rough2)">插入：从高位到低位走，缺节点就新建。</text>
  <text x="76" y="264" font-size="13" fill="#22314a" filter="url(#rough2)">查询：若「相反位」的子节点存在就走它（异或得 1），否则只能走同位（得 0）。</text>
  <text x="76" y="284" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">a_i ≤ 10¹² &lt; 2⁴⁰ ⇒ 44 位足够（代码里从第 44 位开始）。</text>
  <g filter="url(#rough2)"><rect x="60" y="296" width="580" height="70" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="320" font-size="12.5" fill="#2f5223" filter="url(#rough2)">复杂度：每次插入/查询 O(44)，总 O(44n)，n=10⁵ 时约 4.4·10⁶ 次操作。</text>
  <text x="76" y="344" font-size="12.5" fill="#2f5223" filter="url(#rough2)">空间：节点数 ≤ 44·(n+1) ≈ 4.4·10⁶，用两个 int 数组即可。</text>
  <text x="76" y="362" font-size="12" fill="#2f5223" filter="url(#rough2)">实测 n=10⁵：0.08 s（2 s 时限）。</text>
</svg>
