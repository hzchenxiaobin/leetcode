<svg xmlns="http://www.w3.org/2000/svg" width="840" height="300" viewBox="0 0 840 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="300" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">朝向：L 放左，R 放右；R–R 或 L–L 随意</text>
  <g filter="url(#rough2)"><rect x="130" y="100" width="130" height="60" rx="4" fill="#f7fbf4" fill-opacity="0.85" stroke="#a8c99a" stroke-width="1.3"/></g>
  <text x="195" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">(L, R)</text>
  <text x="195" y="148" text-anchor="middle" font-size="11" fill="#3d6b2f" filter="url(#rough2)">允许</text>
  <g filter="url(#rough2)"><rect x="310" y="100" width="130" height="60" rx="4" fill="#f6d9d7" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="375" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">(R, L)</text>
  <text x="375" y="148" text-anchor="middle" font-size="11" fill="#8a4b2a" filter="url(#rough2)">禁止</text>
  <g filter="url(#rough2)"><rect x="490" y="100" width="130" height="60" rx="4" fill="#f7fbf4" fill-opacity="0.85" stroke="#a8c99a" stroke-width="1.3"/></g>
  <text x="555" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">(R, R)</text>
  <text x="555" y="148" text-anchor="middle" font-size="11" fill="#3d6b2f" filter="url(#rough2)">允许</text>
  <g filter="url(#rough2)"><rect x="670" y="100" width="130" height="60" rx="4" fill="#f7fbf4" fill-opacity="0.85" stroke="#a8c99a" stroke-width="1.3"/></g>
  <text x="735" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">(L, L)</text>
  <text x="735" y="148" text-anchor="middle" font-size="11" fill="#3d6b2f" filter="url(#rough2)">允许</text>
  <text x="420" y="210" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">禁止的只有"右手坐左 + 左手坐右"</text>
  <text x="420" y="248" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">构造：若该对含 L 且 L 在右，则交换左右</text>
</svg>
