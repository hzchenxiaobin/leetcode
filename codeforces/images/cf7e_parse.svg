<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="131"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="800" height="420" fill="#fafafa"/>

  <text x="400" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">类别是“展开后文本”的顶层运算符，不是定义文本的</text>
  <path d="M 120 40 Q 400 46 690 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <rect x="40" y="66" width="230" height="150" rx="12" fill="#eef4fb" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="92" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">宏 m 的定义</text>
  <text x="56" y="116" font-size="12" fill="#2b2b2b" filter="url(#rough2)">m = a + b</text>
  <circle cx="155" cy="150" r="17" fill="#ffffff" stroke="#8a6015" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="155" y="156" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">+</text>
  <circle cx="115" cy="192" r="15" fill="#ffffff" stroke="#777777" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="115" y="197" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">a</text>
  <circle cx="195" cy="192" r="15" fill="#ffffff" stroke="#777777" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="195" y="197" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">b</text>
  <path d="M 145 164 L 122 178" stroke="#777777" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 165 164 L 188 178" stroke="#777777" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="56" y="230" font-size="11" fill="#2f4a66" filter="url(#rough2)">类别 = 加（顶层是 +）</text>

  <path d="M 285 140 L 345 140" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="315" y="128" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">替换进 m * c</text>

  <rect x="360" y="66" width="400" height="236" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="376" y="92" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">展开后的文本：a + b * c</text>
  <circle cx="560" cy="126" r="17" fill="#ffffff" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="560" y="132" text-anchor="middle" font-size="13" fill="#8a2b28" filter="url(#rough2)">+</text>
  <circle cx="500" cy="180" r="15" fill="#ffffff" stroke="#777777" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="500" y="185" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">a</text>
  <circle cx="620" cy="180" r="15" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="620" y="185" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">*</text>
  <circle cx="590" cy="222" r="13" fill="#ffffff" stroke="#777777" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="590" y="227" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">b</text>
  <circle cx="650" cy="222" r="13" fill="#ffffff" stroke="#777777" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="650" y="227" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">c</text>
  <path d="M 552 142 L 512 168" stroke="#777777" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 568 142 L 610 168" stroke="#777777" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 613 194 L 598 210" stroke="#777777" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 627 194 L 642 210" stroke="#777777" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="376" y="262" font-size="12" fill="#8a2b28" filter="url(#rough2)">顶层运算符是 +（不是 *）⇒ 类别 = 加</text>
  <text x="376" y="286" font-size="11.5" fill="#9a7020" filter="url(#rough2)">所以 m 出现在乘号右侧时，去掉括号会改变结合方式。</text>

  <text x="40" y="344" font-size="12" fill="#2b2b2b" filter="url(#rough2)">合成规则：A + B、A − B 一律是加类；A * B、A / B 只要有一边是加类，整体也是加类，否则是乘类。</text>
  <text x="40" y="370" font-size="12" fill="#2b2b2b" filter="url(#rough2)">数字、变量、以及整体被一对括号包住的片段是原子类；宏引用直接继承该宏展开后的类别。</text>
  <text x="40" y="398" font-size="11.5" fill="#8a6015" filter="url(#rough2)">因为普通替换是纯文本拼接，拼接不会改变各片段内部运算符的括号深度。</text>
</svg>
