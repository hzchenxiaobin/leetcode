<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="73"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="720" height="400" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">为什么不能按字母顺序贪心</text>
  <path d="M 200 42 Q 360 48 520 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="60" y="66" font-size="11.5" fill="#666" filter="url(#rough2)">目标 t = "ab"；s1 = "ab"（a1 = 1，费用 1），s2 = "a"（a2 = 1，费用 2）</text>

  <!-- 左：贪心 -->
  <rect x="60" y="88" width="280" height="196" rx="10" fill="#fde8e8" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="74" y="114" font-size="13" font-weight="bold" fill="#8c2f2b" filter="url(#rough2)">贪心：先满足字母 a</text>
  <text x="74" y="142" font-size="11.5" fill="#8c2f2b" filter="url(#rough2)">s1 只有 1 个名额，拿 a</text>
  <text x="74" y="166" font-size="11.5" fill="#8c2f2b" filter="url(#rough2)">→ 还要 b，只能用 s2</text>
  <text x="74" y="190" font-size="11.5" fill="#8c2f2b" filter="url(#rough2)">→ 但 s2 = "a"，没有 b</text>
  <text x="74" y="222" font-size="13" font-weight="bold" fill="#8c2f2b" filter="url(#rough2)">结论：误判为无解 ✗</text>
  <text x="74" y="252" font-size="11" fill="#8c2f2b" filter="url(#rough2)">（其实有解，见右侧）</text>
  <text x="74" y="272" font-size="11" fill="#8c2f2b" filter="url(#rough2)">贪心的错误：名额被谁占用要全局权衡</text>

  <!-- 右：最优 -->
  <rect x="380" y="88" width="280" height="196" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="394" y="114" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">最优：先占用稀缺来源</text>
  <text x="394" y="142" font-size="11.5" fill="#2f5223" filter="url(#rough2)">s1 的名额给 b（b 只有这里有）</text>
  <text x="394" y="166" font-size="11.5" fill="#2f5223" filter="url(#rough2)">a 从 s2 取，费用 2</text>
  <text x="394" y="190" font-size="11.5" fill="#2f5223" filter="url(#rough2)">总费用 = 1 + 2 = 3</text>
  <text x="394" y="222" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">这才是正确答案 ✓</text>
  <text x="394" y="252" font-size="11" fill="#2f5223" filter="url(#rough2)">费用 3：b 花 1 元，a 花 2 元</text>
  <text x="394" y="272" font-size="11" fill="#2f5223" filter="url(#rough2)">用最小费用流自动做出这种权衡</text>

  <!-- 分配示意 -->
  <rect x="60" y="300" width="600" height="82" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="74" y="324" font-size="12" font-weight="bold" fill="#7a5a1b" filter="url(#rough2)">本质：这是一个「带容量的运输问题」——每个字符要么从 s1 拿（1 元，但只有 1 个名额），</text>
  <text x="74" y="346" font-size="12" fill="#7a5a1b" filter="url(#rough2)">要么从 s2 拿（2 元）。名额是跨字母共享的，所以必须先决定「谁占 s1 的名额」，</text>
  <text x="74" y="368" font-size="12" fill="#7a5a1b" filter="url(#rough2)">这正是流模型里「S → s_i 的容量」所刻画的耦合。</text>
</svg>
