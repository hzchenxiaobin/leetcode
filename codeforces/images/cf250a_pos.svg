<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="720" height="250" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">亏损天在序列中的位置决定切点</text>
  <rect x="60" y="60" width="600" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="360" y="84" text-anchor="middle" font-size="11.5" fill="#2f4a66">把「亏损天」按出现顺序编号 1,2,3,…；每两个一组 → 组数就是答案</text>
  <rect x="60" y="120" width="600" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="360" y="144" text-anchor="middle" font-size="11.5" fill="#2f5223">文件夹大小 = 相邻两个「第 3 个亏损」之间的天数</text>
  <text x="60" y="200" text-anchor="start" font-size="11.5" fill="#446688" filter="url(#rough2)">没有亏损时答案为 1（全部放一个文件夹）</text>
</svg>
