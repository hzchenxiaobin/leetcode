<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="350" fill="#fafafa"/>
  <text x="360.0" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">207A2：同一结论，规模变大</text>
  <path d="M 144.00 46 Q 360.0 52 576.00 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="72" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">每个科学家的题目内部顺序固定；合并后“坏对”只可能出现在“某人的下降点”上。</text>
  <text x="60" y="92" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">把每个人自己的序列切成“极大非降段”，段数 = 下降数 + 1；总段数 R = max_i (下降数_i + 1)。</text>
  <rect x="60" y="116" width="300" height="96" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="134" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">第 r 轮：把每个人第 r 段的所有题目</text>
  <text x="74" y="156" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">收集起来，按资源数升序输出。</text>
  <text x="74" y="178" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">同一段内部本来非降，排序不会破坏</text>
  <text x="74" y="200" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">他内部的顺序（相同值按位置稳定）。</text>
  <rect x="380" y="116" width="290" height="96" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="394" y="134" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">轮与轮之间至多产生 1 个坏对 ⇒</text>
  <text x="394" y="156" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">总坏对 ≤ R − 1 = max_i 下降数_i。</text>
  <text x="394" y="178" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">另一方面每个人自己的每个下降点</text>
  <text x="394" y="200" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">都必须由至少 1 个坏对“填平” ⇒ 下界。</text>
  <text x="60" y="240" text-anchor="start" font-size="11.5" fill="#33506e" filter="url(#rough2)">所以答案 = max_i (#{j : a_{i,j} &gt; a_{i,j+1}})，与具体数值分布无关。</text>
  <rect x="60" y="262" width="620" height="62" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="279" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">本版：n=2，1 ≤ k_i ≤ 200000，总题数 ≤ 400000。</text>
  <text x="74" y="300" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">总数可能超过 200000，此时按题意只输出第一行（坏对数）。</text>
</svg>
