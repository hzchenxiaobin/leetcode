<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="780" height="400" fill="#fafafa"/>
  <text x="390.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">190E：地图上的边 = 实际没有路；实际道路 = 补图</text>
  <path d="M 166.9800000000001 46 Q 390.0 52 613.0199999999999 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <circle cx="120.0" cy="100.0" r="22.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="120.0" y="105.0" text-anchor="middle" font-size="11.6" font-weight="bold" fill="#26405c" filter="url(#rough2)">1</text>
  <circle cx="260.0" cy="100.0" r="22.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="260.0" y="105.0" text-anchor="middle" font-size="11.6" font-weight="bold" fill="#26405c" filter="url(#rough2)">2</text>
  <circle cx="120.0" cy="230.0" r="22.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="120.0" y="235.0" text-anchor="middle" font-size="11.6" font-weight="bold" fill="#26405c" filter="url(#rough2)">3</text>
  <circle cx="260.0" cy="230.0" r="22.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="260.0" y="235.0" text-anchor="middle" font-size="11.6" font-weight="bold" fill="#26405c" filter="url(#rough2)">4</text>
  <path d="M 120.0 100.0 L 260.0 100.0" stroke="#6b6b6b" stroke-width="1.2" fill="none" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <path d="M 120.0 100.0 L 120.0 230.0" stroke="#6b6b6b" stroke-width="1.2" fill="none" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <path d="M 260.0 230.0 L 260.0 100.0" stroke="#6b6b6b" stroke-width="1.2" fill="none" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <path d="M 260.0 230.0 L 120.0 230.0" stroke="#6b6b6b" stroke-width="1.2" fill="none" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <path d="M 120.0 100.0 L 260.0 230.0" stroke="#b85450" stroke-width="2.4" fill="none" filter="url(#rough2)"/>
  <path d="M 260.0 100.0 L 120.0 230.0" stroke="#b85450" stroke-width="2.4" fill="none" filter="url(#rough2)"/>
  <text x="190.0" y="62.0" text-anchor="middle" font-size="10.8" fill="#6b6b6b" filter="url(#rough2)">灰色虚线 = 地图（实际无路）</text>
  <text x="190.0" y="270.0" text-anchor="middle" font-size="10.8" fill="#b85450" filter="url(#rough2)">红色粗线 = 实际道路</text>
  <rect x="400.0" y="70.0" width="350.0" height="96.0" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="416.0" y="96.0" text-anchor="start" font-size="11.2" font-weight="bold" fill="#2f5b34" filter="url(#rough2)">样例 1：n=4，地图 4 条边</text>
  <text x="416.0" y="122.0" text-anchor="start" font-size="11.0" fill="#2b2b2b" filter="url(#rough2)">实际道路：1–4、2–3</text>
  <text x="416.0" y="146.0" text-anchor="start" font-size="11.0" fill="#2b2b2b" filter="url(#rough2)">⇒ 两个分量 {1,4} 与 {2,3}</text>
  <rect x="400.0" y="186.0" width="350.0" height="96.0" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="416.0" y="212.0" text-anchor="start" font-size="11.2" font-weight="bold" fill="#33506e" filter="url(#rough2)">样例 2：n=3，地图 1 条边 1–2</text>
  <text x="416.0" y="238.0" text-anchor="start" font-size="11.0" fill="#2b2b2b" filter="url(#rough2)">实际道路：1–3、2–3</text>
  <text x="416.0" y="262.0" text-anchor="start" font-size="11.0" fill="#2b2b2b" filter="url(#rough2)">⇒ 一个分量 {1,2,3}</text>
  <rect x="60.0" y="300.0" width="690.0" height="60.0" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="324.0" text-anchor="start" font-size="11.0" fill="#8a6015" filter="url(#rough2)">补图可能有 10¹¹ 条边（n=5·10⁵），不能显式建：用“未访问集合 + 对每个点扫一遍、跳过它的地图邻居”来做 BFS，</text>
  <text x="74.0" y="346.0" text-anchor="start" font-size="11.0" fill="#8a6015" filter="url(#rough2)">每个点最多被“跳过”deg(v) 次 ⇒ 总代价 O(n+m)。</text>
</svg>
