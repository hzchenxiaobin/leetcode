<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 352" width="640" height="352">
<defs>
<filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="9" result="noise"/>
<feDisplacementMap in="SourceGraphic" in2="noise" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect x="0" y="0" width="640" height="352" fill="#fafafa"/>
<g font-family="Comic Sans MS, Kaiti SC, cursive">
<text x="320.0" y="24.0" font-size="15" fill="#33475b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">非二分块（奇环）让入口到出口的奇偶性自由翻转</text>
<line x1="190.0" y1="75.0" x2="276.6" y2="225.0" stroke="#b05a5a" stroke-width="2.6" filter="url(#rough2)"/>
<line x1="276.6" y1="225.0" x2="103.4" y2="225.0" stroke="#b05a5a" stroke-width="2.6" filter="url(#rough2)"/>
<line x1="103.4" y1="225.0" x2="190.0" y2="75.0" stroke="#b05a5a" stroke-width="2.6" filter="url(#rough2)"/>
<circle cx="190.0" cy="75.0" r="13.0" fill="#f6d9b0" stroke="#a08050" stroke-width="1.5" filter="url(#rough2)"/>
<circle cx="276.6" cy="225.0" r="13.0" fill="#f6d9b0" stroke="#a08050" stroke-width="1.5" filter="url(#rough2)"/>
<circle cx="103.4" cy="225.0" r="13.0" fill="#f6d9b0" stroke="#a08050" stroke-width="1.5" filter="url(#rough2)"/>
<text x="190.0" y="55.0" font-size="14" fill="#7a5c2e" text-anchor="middle" font-weight="bold" filter="url(#rough2)">a</text>
<text x="258.6" y="231.0" font-size="14" fill="#7a5c2e" text-anchor="middle" font-weight="bold" filter="url(#rough2)">b</text>
<text x="121.4" y="231.0" font-size="14" fill="#7a5c2e" text-anchor="middle" font-weight="bold" filter="url(#rough2)">c</text>
<text x="190.0" y="180.0" font-size="14" fill="#a04a4a" text-anchor="middle" font-weight="normal" filter="url(#rough2)">奇环</text>
<text x="340.0" y="90.0" font-size="13" fill="#c0392b" text-anchor="start" font-weight="normal" filter="url(#rough2)">a→b 的两条弧：一奇一偶</text>
<text x="340.0" y="120.0" font-size="13" fill="#c0392b" text-anchor="start" font-weight="normal" filter="url(#rough2)">⇒ 两种奇偶的 a-b 简单路</text>
<text x="340.0" y="160.0" font-size="12" fill="#33475b" text-anchor="start" font-weight="normal" filter="url(#rough2)">拼上 x→a、b→y 的扇形路径</text>
<text x="340.0" y="186.0" font-size="13" fill="#1f6f43" text-anchor="start" font-weight="normal" filter="url(#rough2)">⇒ x-y 有奇、偶各一条</text>
<rect x="420.0" y="200.0" width="120.0" height="90.0" rx="8" fill="#eef4fb" stroke="#4f7f60" stroke-width="1.8" stroke-dasharray="6 4" filter="url(#rough2)"/>
<text x="480.0" y="306.0" font-size="12" fill="#3f6b4f" text-anchor="middle" font-weight="normal" filter="url(#rough2)">二分块：唯一奇偶</text>
<text x="480.0" y="324.0" font-size="11" fill="#3f6b4f" text-anchor="middle" font-weight="normal" filter="url(#rough2)">（由二染色决定）</text>
<text x="320.0" y="336.0" font-size="13" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">引理：点双连通 + 非二分 ⇒ 任意两不同顶点之间存在奇、偶简单路各一条</text>
</g>
</svg>
