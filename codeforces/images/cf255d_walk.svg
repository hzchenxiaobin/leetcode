<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="320" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2：n=9，(3,8)，c=10</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">t=1 时只点亮 5 格，t=2 时到 10 格以上 → 答案 2</text>
  <text x="150" y="100" text-anchor="start" font-size="13" fill="#555555" filter="url(#rough2)">t = 1：5 格</text>
  <g filter="url(#rough2)"><rect x="264" y="172" width="44" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="286.0" y="198.32" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">●</text>
  <g filter="url(#rough2)"><rect x="264" y="120" width="44" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="286.0" y="146.32" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">●</text>
  <g filter="url(#rough2)"><rect x="264" y="224" width="44" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="286.0" y="250.32" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">●</text>
  <g filter="url(#rough2)"><rect x="212" y="172" width="44" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="234.0" y="198.32" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">●</text>
  <g filter="url(#rough2)"><rect x="316" y="172" width="44" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="338.0" y="198.32" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">●</text>
  <text x="500" y="140" text-anchor="start" font-size="13" fill="#555555" filter="url(#rough2)">t = 2 时再加 5 格：</text>
  <text x="500" y="168" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">(1,8) (5,8) (2,7) (2,9)</text>
  <text x="500" y="192" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">(4,7) (4,9) (3,6) (3,10 越界)</text>
  <text x="500" y="224" text-anchor="start" font-size="13" fill="#b05a5a" filter="url(#rough2)">累计 ≥ 10 → 输出 2</text>
  <text x="440" y="292" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">注意靠近边界时一部分菱形被裁掉，不能直接用 2t(t+1)+1</text>
</svg>
