<svg xmlns="http://www.w3.org/2000/svg" width="880" height="376" viewBox="0 0 880 376"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="103"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/></marker>
  </defs>
  <rect width="880" height="376" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2：n=2, a=(2,2) → 5 次点击</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">1:错  2:对  3:第 2 题错  4:重做第 1 题  5:第 2 题对</text>
  <g filter="url(#rough2)"><circle cx="110" cy="150" r="22" fill="#f6d9d7" fill-opacity="0.85" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="110" y="156" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="110" y="196" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">第1题 错</text>
  <g filter="url(#rough2)"><circle cx="250" cy="150" r="22" fill="#d7ecd0" fill-opacity="0.85" stroke="#6a9a58" stroke-width="1.6"/></g>
  <text x="250" y="156" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="250" y="196" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">第1题 对</text>
  <g filter="url(#rough2)"><circle cx="390" cy="150" r="22" fill="#f6d9d7" fill-opacity="0.85" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="390" y="156" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="390" y="196" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">第2题 错</text>
  <g filter="url(#rough2)"><circle cx="530" cy="150" r="22" fill="#d7ecd0" fill-opacity="0.85" stroke="#6a9a58" stroke-width="1.6"/></g>
  <text x="530" y="156" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="530" y="196" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">第1题 对</text>
  <g filter="url(#rough2)"><circle cx="670" cy="150" r="22" fill="#d7ecd0" fill-opacity="0.85" stroke="#6a9a58" stroke-width="1.6"/></g>
  <text x="670" y="156" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="670" y="196" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">第2题 对</text>
  <text x="440" y="244" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">第 1 题错 1 次（1 次点击），对 1 次；第 2 题错 1 次要重做第 1 题（2 次点击）再对（1 次）</text>
  <text x="440" y="276" text-anchor="middle" font-size="12.5" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">合计 = (2−1)·1 + 1 + (2−1)·2 + 1 = 5</text>
</svg>
