<svg xmlns="http://www.w3.org/2000/svg" width="720" height="352" viewBox="0 0 720 352"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>

  <rect width="720" height="352" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">相交 ⟺ 入口顺序与出口顺序相反</text>
  <path d="M 140 40 Q 360 46 580 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 左：相交 -->
  <g filter="url(#rough2)">
    <rect x="50" y="70" width="260" height="200" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.8"/>
  </g>
  <!-- 上边洞 -->
  <g filter="url(#rough2)">
    <circle cx="110" cy="70" r="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="250" cy="70" r="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="180" cy="270" r="6" fill="#fde8e6" stroke="#b85450" stroke-width="1.5"/>
    <circle cx="290" cy="270" r="6" fill="#fde8e6" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <line x1="110" y1="70" x2="290" y2="270" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="250" y1="70" x2="180" y2="270" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <g font-size="10.5" text-anchor="middle" filter="url(#rough2)">
    <text x="110" y="60" fill="#2f4a66">洞 1</text>
    <text x="250" y="60" fill="#2f4a66">洞 2</text>
    <text x="180" y="288" fill="#8a2b28">洞 1</text>
    <text x="290" y="288" fill="#8a2b28">洞 2</text>
  </g>
  <text x="180" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">交叉</text>
  <text x="180" y="304" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">入口 1&lt;2 而出口 2&gt;1 → 必相交</text>
  <text x="180" y="324" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">(p₁−p₂)(q₁−q₂) &lt; 0</text>

  <!-- 右：不相交 -->
  <g filter="url(#rough2)">
    <rect x="410" y="70" width="260" height="200" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.8"/>
  </g>
  <g filter="url(#rough2)">
    <circle cx="470" cy="70" r="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="610" cy="70" r="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="490" cy="270" r="6" fill="#fde8e6" stroke="#b85450" stroke-width="1.5"/>
    <circle cx="580" cy="270" r="6" fill="#fde8e6" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <line x1="470" y1="70" x2="490" y2="270" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="610" y1="70" x2="580" y2="270" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <g font-size="10.5" text-anchor="middle" filter="url(#rough2)">
    <text x="470" y="60" fill="#2f4a66">洞 1</text>
    <text x="610" y="60" fill="#2f4a66">洞 2</text>
    <text x="490" y="288" fill="#8a2b28">洞 1</text>
    <text x="580" y="288" fill="#8a2b28">洞 2</text>
  </g>
  <text x="540" y="304" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">入口 1&lt;2 且出口 1&lt;2 → 不相交</text>
  <text x="540" y="324" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">(p₁−p₂)(q₁−q₂) &gt; 0</text>
</svg>
