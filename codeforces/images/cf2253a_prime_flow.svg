<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="430" fill="#fafafa"/>

  <text x="380" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：读入 → 建一次素数表 → 每组 O(1) 判定</text>
  <path d="M 110 44 Q 380 51 650 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- B1 -->
  <rect x="100" y="64" width="300" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="93" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">读入 t 与全部 n_1 … n_t</text>

  <path d="M 250 110 L 250 126" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- B2 -->
  <rect x="100" y="128" width="300" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="150" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">M = max(n_i) + 1</text>
  <text x="250" y="167" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">埃氏筛标记 [0, M] 是否质数</text>

  <path d="M 250 174 L 250 190" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- B3 -->
  <rect x="100" y="192" width="300" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="221" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">对每组：只看表项 isPrime[n+1]</text>

  <path d="M 250 238 L 250 256" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="250,258 355,300 250,342 145,300" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="305" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">n+1 是质数？</text>

  <!-- 分支 -->
  <path d="M 200 336 L 175 362" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <path d="M 300 336 L 335 362" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="166" y="352" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">是</text>
  <text x="330" y="352" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">否</text>

  <rect x="110" y="366" width="130" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="175" y="393" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">输出 YES</text>

  <rect x="270" y="366" width="130" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="335" y="393" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">输出 NO</text>

  <!-- 右侧说明卡片 -->
  <rect x="430" y="64" width="300" height="80" rx="8" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="446" y="88" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">为什么必须读完再筛</text>
  <text x="446" y="110" font-size="11.5" fill="#4a5a6a" filter="url(#rough2)">筛表大小只取决于 max(n_i)+1，</text>
  <text x="446" y="128" font-size="11.5" fill="#4a5a6a" filter="url(#rough2)">不知道最大值就无法定表长。</text>

  <rect x="430" y="158" width="300" height="80" rx="8" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="446" y="182" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">总代价</text>
  <text x="446" y="204" font-size="11.5" fill="#4a5a6a" filter="url(#rough2)">筛：O(M log log M)，M ≤ 200001</text>
  <text x="446" y="222" font-size="11.5" fill="#4a5a6a" filter="url(#rough2)">查询：O(t)，与 sum n 无关</text>

  <rect x="430" y="252" width="300" height="80" rx="8" fill="#f3f6f9" stroke="#c9d3dc" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="446" y="276" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">等价写法：逐个试除</text>
  <text x="446" y="298" font-size="11.5" fill="#4a5a6a" filter="url(#rough2)">对 n+1 试除到 √(n+1)，单组</text>
  <text x="446" y="316" font-size="11.5" fill="#4a5a6a" filter="url(#rough2)">约 447 次，t 组也远低于时限。</text>

  <text x="250" y="424" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">注意：sum n 很大并不影响复杂度——本题每组只问「n+1 是不是质数」</text>
</svg>
