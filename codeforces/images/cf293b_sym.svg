<svg xmlns="http://www.w3.org/2000/svg" width="700" height="280" viewBox="0 0 700 280"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="513"/>
    <feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></defs>
  <rect width="700" height="280" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">DFS 的对称性压缩（本题最容易写错的地方）</text>
  <path d="M 130 40 Q 350 46 570 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="96" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="12.5" fill="#22314a" filter="url(#rough2)">① 已在盘面上出现过的颜色（"特殊色"）：每种都要单独枚举，不能合并。</text>
  <text x="76" y="106" font-size="12.5" fill="#22314a" filter="url(#rough2)">② 从没出现过的颜色（"自由色"）F 个：彼此完全对称 ⇒ 只试一个代表，</text>
  <text x="76" y="130" font-size="12.5" fill="#22314a" filter="url(#rough2)">   把这一支的答案乘上"还可用的自由色个数"。</text>
  <text x="76" y="150" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">✗ 反例：把"特殊色"也当自由色合并会少算（预涂色会强制某个具体颜色）。</text>
  <g filter="url(#rough2)"><rect x="60" y="166" width="580" height="60" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="190" font-size="12.5" fill="#2f5223" filter="url(#rough2)">反例数据：1×3、k=4、中间格预涂 1 ⇒ 正确答案 6（两端从剩下 3 色里选 2 色排列）。</text>
  <text x="76" y="212" font-size="12" fill="#3c5e2e" filter="url(#rough2)">若合并特殊/自由色，会先让首格取"代表色 1"，与中间格撞色 ⇒ 错算成 0。</text>
  <g filter="url(#rough2)"><rect x="60" y="236" width="580" height="34" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="76" y="258" font-size="12.5" fill="#8a6015" filter="url(#rough2)">样例 2×2、k=4 全空 ⇒ 48；5×6、k=10 全空 ⇒ 3628800 = 10!。</text>
</svg>
