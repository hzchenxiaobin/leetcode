<svg xmlns="http://www.w3.org/2000/svg" width="880" height="404" viewBox="0 0 880 404"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="91"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="404" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">区间最大高度 = 一堆一次函数的最大包</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">第 i 只海象：h(t) = a_i + b_i·t</text>
  <g filter="url(#rough2)"><line x1="120" y1="300" x2="740" y2="300" stroke="#888888" stroke-width="1.3" marker-end="url(#arrg)"/></g>
  <g filter="url(#rough2)"><line x1="120" y1="300" x2="120" y2="100" stroke="#888888" stroke-width="1.3" marker-end="url(#arrg)"/></g>
  <text x="740" y="320" text-anchor="end" font-size="12" fill="#777777" filter="url(#rough2)">t</text>
  <text x="110" y="92" text-anchor="end" font-size="11" fill="#777777" filter="url(#rough2)">高度</text>
  <g filter="url(#rough2)"><line x1="120" y1="249.0" x2="740" y2="229.67666666666668" stroke="#b85450" stroke-width="2"/></g>
  <g filter="url(#rough2)"><line x1="120" y1="274.5" x2="740" y2="246.39333333333332" stroke="#3d6b2f" stroke-width="2"/></g>
  <g filter="url(#rough2)"><line x1="120" y1="206.5" x2="740" y2="197.71666666666667" stroke="#446688" stroke-width="2"/></g>
  <g filter="url(#rough2)"><line x1="120" y1="295.75" x2="740" y2="258.86" stroke="#8a6a2f" stroke-width="2"/></g>
  <g filter="url(#rough2)"><path d="M 120 206 L 318 203 L 461 259 L 740 258" fill="none" stroke="#2b2b2b" stroke-width="2.6" stroke-dasharray="7 5"/></g>
  <text x="430" y="142" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">上包（虚线）：任意时刻 t 的最大值只可能来自包上的直线</text>
  <text x="430" y="168" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">包按斜率递增存，值关于 t 单峰 → 二分 O(log n) 求某 t 的最大值</text>
  <text x="430" y="196" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">交点比较用交叉相乘（整数），避免浮点误差</text>
</svg>
