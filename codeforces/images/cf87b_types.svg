<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="720" height="400" fill="#fafafa"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">类型 = void 后面挂几个星号，errtype 吸收一切</text>
  <path d="M 200 43 Q 360 49 520 43" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <rect x="50" y="70" width="300" height="110" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="66" y="96" text-anchor="start" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">两种基本类型</text>
  <text x="66" y="122" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">void，void*，void**，…</text>
  <text x="66" y="146" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">errtype（再多的 * 或 &amp; 还是它）</text>
  <rect x="370" y="70" width="300" height="110" rx="7" fill="#e9f4e2" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="386" y="96" text-anchor="start" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">两个操作</text>
  <text x="386" y="122" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">X* ：星号 +1</text>
  <text x="386" y="146" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">&amp;X ：星号 −1；void 再减 → errtype</text>
  <rect x="50" y="200" width="620" height="74" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="66" y="226" text-anchor="start" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">优先级：&amp; 低于 *，所以 &amp;T* 总是等于 T（先加星、再去星）</text>
  <text x="66" y="252" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">表达式形如 &amp;&amp;&amp;name***：左边数 &amp; 的个数 p，右边数 * 的个数 q</text>
  <rect x="50" y="292" width="620" height="74" rx="7" fill="#fdecea" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="66" y="318" text-anchor="start" font-size="11.5" font-weight="bold" fill="#7b2f2c" filter="url(#rough2)">求值：value = 该名字当前的值；先加 q 颗星；再解引用 p 次（星不够就 errtype）</text>
  <text x="66" y="344" text-anchor="start" font-size="11" fill="#7b2f2c" filter="url(#rough2)">typedef 立即求值并覆盖旧定义；之前用旧值算出来的类型不受影响。</text>
</svg>
