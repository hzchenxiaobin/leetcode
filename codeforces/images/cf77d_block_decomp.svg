<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="43"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="760" height="440" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按列切开：最后一列整列竖放，或最后两列拼成一个 2 列块</text>
  <path d="M 152 41 Q 380 47 608 41" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="40" y="78" width="34" height="34" rx="3" fill="#f7f9fc" stroke="#d6d6d6" stroke-width="1.0" filter="url(#rough2)"/>
  <rect x="40" y="112" width="34" height="34" rx="3" fill="#f7f9fc" stroke="#d6d6d6" stroke-width="1.0" filter="url(#rough2)"/>
  <rect x="40" y="146" width="34" height="34" rx="3" fill="#f7f9fc" stroke="#d6d6d6" stroke-width="1.0" filter="url(#rough2)"/>
  <rect x="74" y="78" width="34" height="34" rx="3" fill="#f7f9fc" stroke="#d6d6d6" stroke-width="1.0" filter="url(#rough2)"/>
  <rect x="74" y="112" width="34" height="34" rx="3" fill="#f7f9fc" stroke="#d6d6d6" stroke-width="1.0" filter="url(#rough2)"/>
  <rect x="74" y="146" width="34" height="34" rx="3" fill="#f7f9fc" stroke="#d6d6d6" stroke-width="1.0" filter="url(#rough2)"/>
  <rect x="108" y="78" width="34" height="34" rx="3" fill="#f7f9fc" stroke="#d6d6d6" stroke-width="1.0" filter="url(#rough2)"/>
  <rect x="108" y="112" width="34" height="34" rx="3" fill="#f7f9fc" stroke="#d6d6d6" stroke-width="1.0" filter="url(#rough2)"/>
  <rect x="108" y="146" width="34" height="34" rx="3" fill="#f7f9fc" stroke="#d6d6d6" stroke-width="1.0" filter="url(#rough2)"/>
  <rect x="142" y="78" width="34" height="34" rx="3" fill="#f7f9fc" stroke="#d6d6d6" stroke-width="1.0" filter="url(#rough2)"/>
  <rect x="142" y="112" width="34" height="34" rx="3" fill="#f7f9fc" stroke="#d6d6d6" stroke-width="1.0" filter="url(#rough2)"/>
  <rect x="142" y="146" width="34" height="34" rx="3" fill="#f7f9fc" stroke="#d6d6d6" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="57.0" y="198" text-anchor="middle" font-size="11" fill="#6a6a6a" filter="url(#rough2)">第 1 列</text>
  <text x="91.0" y="198" text-anchor="middle" font-size="11" fill="#6a6a6a" filter="url(#rough2)">第 2 列</text>
  <text x="125.0" y="198" text-anchor="middle" font-size="11" fill="#6a6a6a" filter="url(#rough2)">第 3 列</text>
  <text x="159.0" y="198" text-anchor="middle" font-size="11" fill="#6a6a6a" filter="url(#rough2)">第 4 列</text>
  <rect x="102" y="72" width="80" height="114" rx="6" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 5" filter="url(#rough2)"/>
  <text x="142" y="224" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">2 列块（可以整块独立铺）</text>
  <rect x="320" y="70" width="410" height="74" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="336" y="96" text-anchor="start" font-size="12" fill="#2f4a66" filter="url(#rough2)">p[j]：第 j 列能否整列竖放（n 为偶数</text>
  <text x="336" y="122" text-anchor="start" font-size="12" fill="#2f4a66" filter="url(#rough2)">且该列每格都允许竖放时 p[j] = 1，否则 0）</text>
  <rect x="320" y="156" width="410" height="74" rx="8" fill="#e9f4ec" stroke="#3f6b4a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="336" y="182" text-anchor="start" font-size="12" fill="#3f6b4a" filter="url(#rough2)">q[j]：第 j、j+1 两列拼成 2 列块的方案数</text>
  <text x="336" y="208" text-anchor="start" font-size="12" fill="#3f6b4a" filter="url(#rough2)">（对每一行：一块横放，或上下两格各一块竖放）</text>
  <rect x="320" y="250" width="410" height="90" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="336" y="276" text-anchor="start" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">d[j] = d[j−2]·q[j−2] + d[j−1]·p[j−1]</text>
  <text x="336" y="300" text-anchor="start" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">        − d[j−2]·p[j−2]·p[j−1]</text>
  <text x="336" y="326" text-anchor="start" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">第三项减去“两列都整列竖放”被数两次的那部分</text>
  <text x="40" y="372" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">为什么这样切是完备的：横放骨牌的左半必在同一列，且左右相邻的两列不能同时有左半，</text>
  <text x="40" y="394" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">所以把地毯按“列”从左到右扫描时，最右边只可能是「一整列竖放」或「最后两列成块」，</text>
  <text x="40" y="416" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">两者恰好覆盖所有铺法；交集只有“这两列全都竖放”一种，故减掉 d[j−2]·p[j−2]·p[j−1]。</text>
</svg>
