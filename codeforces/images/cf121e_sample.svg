<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="121"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="300" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1：2 3 4，操作后 count 依次为 1 0 1 1</text>
  <text x="120" y="120" text-anchor="start" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">初始 2 3 4：4 是幸运数 → count(1,3)=1</text>
  <text x="120" y="152" text-anchor="start" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">add 1 3 2 → 4 5 6 → count(1,3)=1</text>
  <text x="120" y="184" text-anchor="start" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">add 2 3 3 → 4 8 9 → count(1,3)=1</text>
  <text x="120" y="222" text-anchor="start" font-size="13" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">输出：1 0 1 1</text>
</svg>
