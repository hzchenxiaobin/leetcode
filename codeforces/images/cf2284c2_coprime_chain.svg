<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="760" height="440" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="17" fill="#333"
        filter="url(#rough2)">操作改写成「互素链」：答案就是最短链长 k</text>
  <text x="380" y="56" text-anchor="middle" font-size="12" fill="#666"
        filter="url(#rough2)">a = c₀ &lt; c₁ &lt; ⋯ &lt; c_k = b，链上相邻两项必须互素</text>

  <rect x="36" y="84" width="132" height="54" rx="8" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.8" filter="url(#rough2)"/>
  <text x="102" y="106" text-anchor="middle" font-size="12" fill="#2c4a6b"
        filter="url(#rough2)">c₀ = a</text>
  <text x="102" y="127" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c4a6b"
        filter="url(#rough2)">2184</text>

  <rect x="216" y="84" width="132" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="282" y="106" text-anchor="middle" font-size="12" fill="#2f5a24"
        filter="url(#rough2)">c₁</text>
  <text x="282" y="127" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5a24"
        filter="url(#rough2)">2185</text>

  <rect x="396" y="84" width="132" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="462" y="106" text-anchor="middle" font-size="12" fill="#2f5a24"
        filter="url(#rough2)">c₂</text>
  <text x="462" y="127" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5a24"
        filter="url(#rough2)">2187</text>

  <rect x="576" y="84" width="132" height="54" rx="8" fill="#fff8e1" stroke="#d6a040"
        stroke-width="2" filter="url(#rough2)"/>
  <text x="642" y="106" text-anchor="middle" font-size="12" fill="#8a5a00"
        filter="url(#rough2)">c_k = b</text>
  <text x="642" y="127" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a5a00"
        filter="url(#rough2)">2200</text>

  <path d="M170,111 L210,111" stroke="#446688" stroke-width="1.8" stroke-linecap="round"
        fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M350,111 L390,111" stroke="#446688" stroke-width="1.8" stroke-linecap="round"
        fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M530,111 L570,111" stroke="#446688" stroke-width="1.8" stroke-linecap="round"
        fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="181" y="136" text-anchor="middle" font-size="10.5" fill="#446688"
        filter="url(#rough2)">x₁=1</text>
  <text x="370" y="136" text-anchor="middle" font-size="10.5" fill="#446688"
        filter="url(#rough2)">x₂=2</text>
  <text x="550" y="136" text-anchor="middle" font-size="10.5" fill="#446688"
        filter="url(#rough2)">x_k=13</text>

  <rect x="120" y="164" width="520" height="88" rx="10" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="196" text-anchor="middle" font-size="20" font-weight="bold" fill="#2c4a6b"
        filter="url(#rough2)">gcd(c, c + x) = gcd(c, x)</text>
  <text x="380" y="221" text-anchor="middle" font-size="12.5" fill="#446688"
        filter="url(#rough2)">所以「这一步合法」完全等价于「链上相邻两项互素」</text>
  <text x="380" y="241" text-anchor="middle" font-size="11" fill="#8a5a00"
        filter="url(#rough2)">（欧几里得算法的一次减法步：gcd(c, v) = gcd(c, v − c)）</text>

  <rect x="60" y="270" width="300" height="66" rx="9" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="296" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5a24"
        filter="url(#rough2)">k = 1 ⇔ gcd(a, b) = 1</text>
  <text x="210" y="318" text-anchor="middle" font-size="11.5" fill="#4a7a3a"
        filter="url(#rough2)">一步跳到 b，x = b − a</text>

  <rect x="400" y="270" width="300" height="66" rx="9" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="550" y="296" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a5a00"
        filter="url(#rough2)">k = 2 ⇔ 存在 m ∈ (a, b)</text>
  <text x="550" y="318" text-anchor="middle" font-size="11.5" fill="#a06a10"
        filter="url(#rough2)">使 gcd(a, m) = gcd(m, b) = 1</text>

  <rect x="60" y="354" width="640" height="62" rx="9" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="380" y="378" text-anchor="middle" font-size="12.5" fill="#8a3a36"
        filter="url(#rough2)">gcd(a, 1) = 1 恒成立 ⇒ x = 1 永远合法 ⇒ 任何 a 都能走到 b（最差 b − a 步）</text>
  <text x="380" y="400" text-anchor="middle" font-size="12.5" fill="#8a3a36"
        filter="url(#rough2)">于是任务只剩一件事：在 (a, b) 里找一个与 a、b 都互素的 m</text>
</svg>
