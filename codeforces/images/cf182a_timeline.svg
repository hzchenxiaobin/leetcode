<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="330" fill="#fafafa"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">激光的节奏：充能 a 秒、射击 b 秒，无限循环</text>
  <path d="M 177.38000000000005 46 Q 380.0 52 582.6199999999999 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="70.0" y="110.0" width="90.0" height="54.0" rx="6" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="115.0" y="141.0" text-anchor="middle" font-size="11.0" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">充能 a</text>
  <rect x="160.0" y="110.0" width="120.0" height="54.0" rx="6" fill="#fdf0ef" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="220.0" y="141.0" text-anchor="middle" font-size="11.0" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">射击 b</text>
  <rect x="280.0" y="110.0" width="90.0" height="54.0" rx="6" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="325.0" y="141.0" text-anchor="middle" font-size="11.0" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">充能 a</text>
  <rect x="370.0" y="110.0" width="120.0" height="54.0" rx="6" fill="#fdf0ef" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="430.0" y="141.0" text-anchor="middle" font-size="11.0" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">射击 b</text>
  <rect x="490.0" y="110.0" width="90.0" height="54.0" rx="6" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="535.0" y="141.0" text-anchor="middle" font-size="11.0" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">充能 a</text>
  <text x="70.0" y="98.0" text-anchor="middle" font-size="10" fill="#6b6b6b" filter="url(#rough2)">0</text>
  <text x="160.0" y="98.0" text-anchor="middle" font-size="10" fill="#6b6b6b" filter="url(#rough2)">a</text>
  <text x="280.0" y="98.0" text-anchor="middle" font-size="10" fill="#6b6b6b" filter="url(#rough2)">a+b</text>
  <text x="370.0" y="98.0" text-anchor="middle" font-size="10" fill="#6b6b6b" filter="url(#rough2)">2a+b</text>
  <text x="490.0" y="98.0" text-anchor="middle" font-size="10" fill="#6b6b6b" filter="url(#rough2)">2(a+b)</text>
  <path d="M 70.0 194.0 L 370.0 194.0" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="220.0" y="216.0" text-anchor="middle" font-size="11.2" font-weight="bold" fill="#446688" filter="url(#rough2)">一个完整周期 a + b：每躲过一次射击，时间至少 +（a+b）</text>
  <rect x="60.0" y="234.0" width="640.0" height="64.0" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="258.0" text-anchor="start" font-size="11.3" fill="#8a6015" filter="url(#rough2)">充能时可以自由移动（速度 1），射击时必须待在某个 trench 里。</text>
  <text x="74.0" y="280.0" text-anchor="start" font-size="11.3" fill="#8a6015" filter="url(#rough2)">trench 长度 ≤ b ⇒ 射击 b 秒足够从任意入点走到 trench 上任意一点。</text>
</svg>
