<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="700" height="470" fill="#fafafa"/>

  <text x="350" y="32" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">从「成对记账」到「每人一票」：线性化的三步</text>

  <rect x="30" y="52" width="640" height="80" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="50" y="84" font-size="13" fill="#333" filter="url(#rough2)">① 对每一对「互为视野」的人 {i, j} 单独记账（x_i = 1 表示收礼）</text>
  <text x="50" y="114" font-size="13" fill="#446688" filter="url(#rough2)">总幸福 = Σ (x_i − x_j)·(a_i − a_j)　　（每对只算一次）</text>

  <path d="M350,134 L350,156" fill="none" stroke="#446688" stroke-width="2"
        marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="30" y="158" width="640" height="80" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="50" y="190" font-size="13" fill="#333" filter="url(#rough2)">② 换求和顺序：把 x_i 提出来，邻居的 a 之和与怎么选无关</text>
  <text x="50" y="220" font-size="13" fill="#4a7a3a" filter="url(#rough2)">总幸福 = Σ_i x_i·(2d·a_i − S_i)，S_i = Σ_{与 i 互为视野的 j} a_j</text>

  <path d="M350,240 L350,262" fill="none" stroke="#446688" stroke-width="2"
        marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="30" y="264" width="640" height="80" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="50" y="296" font-size="13" fill="#333" filter="url(#rough2)">③ 每个 x_i 只出现在自己那一项里 ⇒ 决策彻底独立</text>
  <text x="50" y="326" font-size="13" fill="#8a6d3b" filter="url(#rough2)">令 c_i = 2d·a_i − S_i，则取 x_i = 1 当且仅当 c_i &gt; 0</text>

  <path d="M350,346 L350,368" fill="none" stroke="#446688" stroke-width="2"
        marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="30" y="370" width="640" height="66" rx="10" fill="#fafafa" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="350" y="400" text-anchor="middle" font-size="16" fill="#b85450" filter="url(#rough2)">答案 = Σ_i max(c_i, 0)</text>
  <text x="350" y="422" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">只剩「求 2d 邻域和」一件事，滑动窗口 O(n)</text>
</svg>
