<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="400" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：反复扫描，翻转所有负的行和负的列</text>
  <g filter="url(#rough2)"><rect x="80" y="100" width="180" height="70" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="170" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">读入表格</text>
  <text x="170" y="152" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">维护行和/列和</text>
  <g filter="url(#rough2)"><rect x="310" y="100" width="220" height="70" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="420" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">有负的行和？</text>
  <text x="420" y="152" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">翻转它（奇偶取反）</text>
  <g filter="url(#rough2)"><rect x="580" y="100" width="200" height="70" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="680" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">有负的列和？</text>
  <text x="680" y="152" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">翻转它</text>
  <g filter="url(#rough2)"><rect x="310" y="220" width="300" height="70" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="460" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#3d6b2f" filter="url(#rough2)">一整轮没有任何翻转？</text>
  <text x="460" y="272" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">是 ⇒ 输出奇偶为 1 的行列</text>
  <g filter="url(#rough2)"><line x1="260" y1="135" x2="310" y2="135" stroke="#8899aa" stroke-width="1.4" marker-end="url(#arrb)"/></g>
  <g filter="url(#rough2)"><line x1="530" y1="135" x2="580" y2="135" stroke="#8899aa" stroke-width="1.4" marker-end="url(#arrb)"/></g>
  <g filter="url(#rough2)"><line x1="680" y1="170" x2="680" y2="205" stroke="#888888" stroke-width="1.2" marker-end="url(#arrb)"/></g>
  <g filter="url(#rough2)"><line x1="610" y1="240" x2="530" y2="240" stroke="#888888" stroke-width="1.2"/></g>
  <text x="640" y="232" text-anchor="start" font-size="11" fill="#777777" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)"><line x1="310" y1="240" x2="100" y2="240" stroke="#a0522d" stroke-width="1.2"/></g>
  <g filter="url(#rough2)"><line x1="100" y1="240" x2="100" y2="175" stroke="#a0522d" stroke-width="1.2" marker-end="url(#arrr)"/></g>
  <text x="200" y="232" text-anchor="start" font-size="11" fill="#a0522d" filter="url(#rough2)">继续下一轮</text>
  <text x="420" y="330" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">理论上最多 Σ/2 次翻转（Σ = Σ|aᵢⱼ| ≤ 10⁶）</text>
  <text x="420" y="358" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">实现要点：每步同步更新矩阵元素，保证行和/列和与矩阵一致</text>
</svg>
