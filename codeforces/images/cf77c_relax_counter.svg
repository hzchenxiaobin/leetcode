<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="37"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="760" height="420" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">反例：只数「到达次数」而不要求连通，会把 4 只算成 8 只</text>
  <path d="M 152 41 Q 380 47 608 41" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <circle cx="90" cy="150" r="22" fill="#eef3fb" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="90" y="156" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">3</text>
  <text x="90" y="196" text-anchor="middle" font-size="11.5" fill="#7a4a86" filter="url(#rough2)">k=2</text>
  <circle cx="260" cy="150" r="22" fill="#eef3fb" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="156" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">2</text>
  <text x="260" y="196" text-anchor="middle" font-size="11.5" fill="#7a4a86" filter="url(#rough2)">k=2</text>
  <circle cx="430" cy="150" r="22" fill="#eef3fb" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="430" y="156" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">1</text>
  <text x="430" y="196" text-anchor="middle" font-size="11.5" fill="#7a4a86" filter="url(#rough2)">k=1</text>
  <circle cx="600" cy="150" r="22" fill="#eef3fb" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="600" y="156" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">4</text>
  <text x="600" y="196" text-anchor="middle" font-size="11.5" fill="#7a4a86" filter="url(#rough2)">k=3</text>
  <circle cx="700" cy="150" r="22" fill="#eef3fb" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="700" y="156" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">5</text>
  <text x="700" y="196" text-anchor="middle" font-size="11.5" fill="#7a4a86" filter="url(#rough2)">k=1</text>
  <line x1="112" y1="150" x2="238" y2="150" stroke="#7a8fa6" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="282" y1="150" x2="408" y2="150" stroke="#7a8fa6" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="452" y1="150" x2="578" y2="150" stroke="#7a8fa6" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="622" y1="150" x2="678" y2="150" stroke="#7a8fa6" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="90" y="122" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">起点 s</text>
  <rect x="30" y="226" width="340" height="76" rx="8" fill="#f7ecec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="44" y="250" text-anchor="start" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">松弛模型（不要求连通）：</text>
  <text x="44" y="272" text-anchor="start" font-size="11.5" fill="#8a3b37" filter="url(#rough2)">边 (3,2) 走 2 次、(1,4)、(4,5) 各 1 次</text>
  <text x="44" y="292" text-anchor="start" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">⇒ 2×(2+1+1) = 8 只</text>
  <rect x="390" y="226" width="340" height="76" rx="8" fill="#e9f4ec" stroke="#3f6b4a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="404" y="250" text-anchor="start" font-size="12.5" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">真实走法（必须连通）：</text>
  <text x="404" y="272" text-anchor="start" font-size="11.5" fill="#2f5223" filter="url(#rough2)">1 上只有 1 只，进去就回不到 4 那边</text>
  <text x="404" y="292" text-anchor="start" font-size="12.5" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">⇒ 走 3→2→1→2→3，共 4 只</text>
  <text x="30" y="330" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">原因：松弛模型允许「3-2 段」和「1-4-5 段」各自独立地吃，但机器只有一台，</text>
  <text x="30" y="352" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">活跃的边必须连成包含 s 的一棵子树，所以「先走到哪儿」的顺序是有代价的。</text>
  <rect x="30" y="368" width="700" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="44" y="394" text-anchor="start" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">正确做法是自底向上算 (eat, rest) 对，而不是把问题当成「每个点的到达次数 ≤ k_v」的匹配。</text>
</svg>
