<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 0 780 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="53"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="780" height="440" fill="#fafafa"/>
  <text x="390" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1 2 4 5 3：10 对里恰好有 7 对能互相看见</text>

  <!-- 圆 -->
  <circle cx="225" cy="240" r="145" fill="none" stroke="#c9ced6" stroke-width="1.4"
          stroke-dasharray="6 6" filter="url(#rough2)"/>

  <!-- 相邻 5 对 -->
  <g stroke="#446688" stroke-width="2.2" filter="url(#rough2)">
    <line x1="225" y1="95" x2="362.9" y2="195.2"/>
    <line x1="362.9" y1="195.2" x2="310.2" y2="357.3"/>
    <line x1="310.2" y1="357.3" x2="139.8" y2="357.3"/>
    <line x1="139.8" y1="357.3" x2="87.1" y2="195.2"/>
    <line x1="87.1" y1="195.2" x2="225" y2="95"/>
  </g>
  <!-- 两条对角可见对 -->
  <g stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)">
    <line x1="362.9" y1="195.2" x2="87.1" y2="195.2"/>
    <line x1="310.2" y1="357.3" x2="87.1" y2="195.2"/>
  </g>
  <!-- 三条被挡住的连线（淡灰虚线，仅示意） -->
  <g stroke="#c08080" stroke-width="1.2" stroke-dasharray="5 5" filter="url(#rough2)">
    <line x1="225" y1="95" x2="310.2" y2="357.3"/>
    <line x1="225" y1="95" x2="139.8" y2="357.3"/>
    <line x1="362.9" y1="195.2" x2="139.8" y2="357.3"/>
  </g>

  <!-- 顶点 -->
  <g filter="url(#rough2)">
    <circle cx="225" cy="95" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="225" y="99.5" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f4a66">1</text>
    <circle cx="362.9" cy="195.2" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="362.9" y="199.7" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f4a66">2</text>
    <circle cx="310.2" cy="357.3" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="310.2" y="361.8" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f4a66">3</text>
    <circle cx="139.8" cy="357.3" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="139.8" y="361.8" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f4a66">4</text>
    <circle cx="87.1" cy="195.2" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="87.1" y="199.7" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f4a66">5</text>
  </g>

  <!-- 高度标注 -->
  <g font-size="10.5" filter="url(#rough2)">
    <text x="225" y="77" text-anchor="middle" fill="#2f4a66">h=1</text>
    <text x="378" y="188" fill="#2f4a66">h=2</text>
    <text x="326" y="376" fill="#2f4a66">h=4</text>
    <text x="122" y="376" text-anchor="end" fill="#2f4a66">h=5</text>
    <text x="72" y="188" text-anchor="end" fill="#2f4a66">h=3</text>
  </g>

  <!-- 右侧说明 -->
  <rect x="418" y="96" width="330" height="150" rx="10" fill="#eef4ec" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="432" y="122" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">可见 7 对（实线）</text>
  <g font-size="11.5" fill="#2f5223" filter="url(#rough2)">
    <text x="432" y="148">蓝：相邻 5 对，永远可见</text>
    <text x="432" y="172">绿：对角 (2,5)、(3,5)</text>
    <text x="432" y="196">(2,5)：min=2，径 1 号弧只有 h=1</text>
    <text x="432" y="220">(3,5)：min=3，绕 2、1 号弧都 ≤ 3</text>
  </g>

  <rect x="418" y="262" width="330" height="150" rx="10" fill="#fbeeee" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="432" y="288" font-size="13" font-weight="bold" fill="#8f3b37" filter="url(#rough2)">不可见 3 对（灰虚线）</text>
  <g font-size="11.5" fill="#8f3b37" filter="url(#rough2)">
    <text x="432" y="314">(1,3)：min=1，两侧各有 2 和 3、5</text>
    <text x="432" y="338">(1,4)：min=1，两侧各有 2、4 和 3</text>
    <text x="432" y="362">(2,4)：min=2，两侧各有 4 和 3</text>
  </g>
  <text x="432" y="394" font-size="11.5" fill="#666" filter="url(#rough2)">（只看“严格高于较小者”的山）</text>
</svg>
