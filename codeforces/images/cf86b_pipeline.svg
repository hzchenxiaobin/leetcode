<svg xmlns="http://www.w3.org/2000/svg" width="780" height="430" viewBox="0 0 780 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="131"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="780" height="430" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">三步铺满：横向配对 → 纵向配对 → 剩余单格挂靠</text>
  <path d="M 156 39 Q 390 45 624 39" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="40" y="66" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">① 横向配对</text>
  <rect x="40" y="78" width="22" height="22" rx="3" fill="#dcebfb" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="62" y="78" width="22" height="22" rx="3" fill="#dcebfb" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="84" y="78" width="22" height="22" rx="3" fill="#dcebfb" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="106" y="78" width="22" height="22" rx="3" fill="#dcebfb" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="40" y="100" width="22" height="22" rx="3" fill="#dcebfb" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="62" y="100" width="22" height="22" rx="3" fill="#dcebfb" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="84" y="100" width="22" height="22" rx="3" fill="#dcebfb" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="106" y="100" width="22" height="22" rx="3" fill="#dcebfb" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="40" y="122" width="22" height="22" rx="3" fill="#dcebfb" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="62" y="122" width="22" height="22" rx="3" fill="#dcebfb" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="84" y="122" width="22" height="22" rx="3" fill="#dcebfb" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="106" y="122" width="22" height="22" rx="3" fill="#dcebfb" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="40" y="178" text-anchor="start" font-size="11.5" fill="#5b5b5b" filter="url(#rough2)">按行扫：能凑成 1×2 就先凑</text>
  <text x="300" y="66" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">② 纵向配对</text>
  <rect x="300" y="78" width="22" height="22" rx="3" fill="#dcebfb" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="322" y="78" width="22" height="22" rx="3" fill="#f2f2f2" stroke="#c0c0c0" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="344" y="78" width="22" height="22" rx="3" fill="#dcebfb" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="366" y="78" width="22" height="22" rx="3" fill="#dcebfb" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="300" y="100" width="22" height="22" rx="3" fill="#dcebfb" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="322" y="100" width="22" height="22" rx="3" fill="#f2f2f2" stroke="#c0c0c0" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="344" y="100" width="22" height="22" rx="3" fill="#dcebfb" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="366" y="100" width="22" height="22" rx="3" fill="#dcebfb" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="300" y="122" width="22" height="22" rx="3" fill="#dcebfb" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="322" y="122" width="22" height="22" rx="3" fill="#fdf3e3" stroke="#8a6015" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="344" y="122" width="22" height="22" rx="3" fill="#dcebfb" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="366" y="122" width="22" height="22" rx="3" fill="#dcebfb" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="300" y="178" text-anchor="start" font-size="11.5" fill="#5b5b5b" filter="url(#rough2)">再按行扫竖着的 1×2</text>
  <text x="556" y="66" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">③ 剩余单格挂靠</text>
  <rect x="556" y="78" width="22" height="22" rx="3" fill="#dcebfb" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="578" y="78" width="22" height="22" rx="3" fill="#f2f2f2" stroke="#c0c0c0" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="600" y="78" width="22" height="22" rx="3" fill="#dcebfb" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="622" y="78" width="22" height="22" rx="3" fill="#dcebfb" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="556" y="100" width="22" height="22" rx="3" fill="#dcebfb" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="578" y="100" width="22" height="22" rx="3" fill="#f2f2f2" stroke="#c0c0c0" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="600" y="100" width="22" height="22" rx="3" fill="#dcebfb" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="622" y="100" width="22" height="22" rx="3" fill="#dcebfb" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="556" y="122" width="22" height="22" rx="3" fill="#dcebfb" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="578" y="122" width="22" height="22" rx="3" fill="#dcebfb" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="600" y="122" width="22" height="22" rx="3" fill="#dcebfb" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <rect x="622" y="122" width="22" height="22" rx="3" fill="#dcebfb" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="556" y="178" text-anchor="start" font-size="11.5" fill="#5b5b5b" filter="url(#rough2)">剩下的格子四邻都是骨牌格，挂上去</text>
  <rect x="40" y="210" width="700" height="54" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="234" text-anchor="start" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">无解的判据：存在一个空格子，上下左右全是 #（或越界）——它连 2 格的图形都凑不出来。</text>
  <text x="56" y="256" text-anchor="start" font-size="12" fill="#7a5a1b" filter="url(#rough2)">反过来，只要没有孤立空格，上面三步一定能铺满，而且每块不超过 5 格。</text>
  <rect x="40" y="276" width="700" height="60" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="56" y="300" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">为什么第②步之后剩下的单格互不相邻：</text>
  <text x="56" y="322" text-anchor="start" font-size="12" fill="#2f4a66" filter="url(#rough2)">左右相邻的两个空格若都没被配上，说明它们在①里就该成对；上下相邻的同理（②里就该成对）。</text>
  <text x="40" y="360" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">第③步只把单格挂到**已有骨牌**上，不合并两个单格，所以块 = 骨牌 + 若干单格。</text>
  <rect x="40" y="380" width="700" height="40" rx="8" fill="#e9f4ec" stroke="#3f6b4a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="56" y="406" text-anchor="start" font-size="12" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">着色：把“图形相邻图”正常染色即可（它是网格图的收缩，平面图 ⇒ 5-退化 ⇒ 6 种颜色足够）。</text>
</svg>
