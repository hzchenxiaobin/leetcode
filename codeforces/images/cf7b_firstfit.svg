<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c9801f"/>
    </marker>
  </defs>

  <rect width="760" height="460" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="38" text-anchor="middle" font-size="18.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">分配规则：从字节 1 往后找第一段够长的空闲区</text>
  <path d="M 152 50 Q 380 56 608 50" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60" y="110" width="60" height="46" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="90.0" y="102" text-anchor="middle" font-size="9.5" fill="#9a9a9a" font-weight="normal" filter="url(#rough2)">1</text>
  <rect x="120" y="110" width="60" height="46" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="150.0" y="102" text-anchor="middle" font-size="9.5" fill="#9a9a9a" font-weight="normal" filter="url(#rough2)">2</text>
  <rect x="180" y="110" width="60" height="46" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="210.0" y="102" text-anchor="middle" font-size="9.5" fill="#9a9a9a" font-weight="normal" filter="url(#rough2)">3</text>
  <rect x="240" y="110" width="60" height="46" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="270.0" y="102" text-anchor="middle" font-size="9.5" fill="#9a9a9a" font-weight="normal" filter="url(#rough2)">4</text>
  <rect x="300" y="110" width="60" height="46" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="330.0" y="102" text-anchor="middle" font-size="9.5" fill="#9a9a9a" font-weight="normal" filter="url(#rough2)">5</text>
  <rect x="360" y="110" width="60" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="390.0" y="102" text-anchor="middle" font-size="9.5" fill="#9a9a9a" font-weight="normal" filter="url(#rough2)">6</text>
  <rect x="420" y="110" width="60" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="450.0" y="102" text-anchor="middle" font-size="9.5" fill="#9a9a9a" font-weight="normal" filter="url(#rough2)">7</text>
  <rect x="480" y="110" width="60" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="510.0" y="102" text-anchor="middle" font-size="9.5" fill="#9a9a9a" font-weight="normal" filter="url(#rough2)">8</text>
  <rect x="540" y="110" width="60" height="46" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="570.0" y="102" text-anchor="middle" font-size="9.5" fill="#9a9a9a" font-weight="normal" filter="url(#rough2)">9</text>
  <rect x="600" y="110" width="60" height="46" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="630.0" y="102" text-anchor="middle" font-size="9.5" fill="#9a9a9a" font-weight="normal" filter="url(#rough2)">10</text>
  <rect x="60" y="110" width="600" height="46" fill="none" stroke="#2b2b2b" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="450" y="140" text-anchor="middle" font-size="13" fill="#2f5223" font-weight="bold" filter="url(#rough2)">块 2</text>
  <line x1="62" y1="168" x2="358" y2="168" stroke="#b6483f" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="62" y1="162" x2="62" y2="174" stroke="#b6483f" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="358" y1="162" x2="358" y2="174" stroke="#b6483f" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="210" y="186" text-anchor="middle" font-size="12" fill="#b6483f" font-weight="bold" filter="url(#rough2)">[1,5] 空闲 5 字节 &lt; 6</text>
  <line x1="482" y1="168" x2="658" y2="168" stroke="#b6483f" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="482" y1="162" x2="482" y2="174" stroke="#b6483f" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="658" y1="162" x2="658" y2="174" stroke="#b6483f" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="570" y="186" text-anchor="middle" font-size="12" fill="#b6483f" font-weight="bold" filter="url(#rough2)">[9,10] 只有 2 字节</text>
  <text x="60" y="216" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">alloc 6：从字节 1 往后扫，最靠前的空闲段 [1,5] 只有 5 字节，再往后 [9,10] 只有 2 字节。</text>
  <text x="60" y="240" text-anchor="start" font-size="12.5" fill="#b6483f" font-weight="bold" filter="url(#rough2)">没有一个连续 6 字节的空闲段 → 分配失败，输出 NULL，且不占用编号。</text>
  <rect x="60" y="288" width="60" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="90.0" y="280" text-anchor="middle" font-size="9.5" fill="#9a9a9a" font-weight="normal" filter="url(#rough2)">1</text>
  <rect x="120" y="288" width="60" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="150.0" y="280" text-anchor="middle" font-size="9.5" fill="#9a9a9a" font-weight="normal" filter="url(#rough2)">2</text>
  <rect x="180" y="288" width="60" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="210.0" y="280" text-anchor="middle" font-size="9.5" fill="#9a9a9a" font-weight="normal" filter="url(#rough2)">3</text>
  <rect x="240" y="288" width="60" height="46" fill="#fff3e0" stroke="#c9801f" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="270.0" y="280" text-anchor="middle" font-size="9.5" fill="#9a9a9a" font-weight="normal" filter="url(#rough2)">4</text>
  <rect x="300" y="288" width="60" height="46" fill="#fff3e0" stroke="#c9801f" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="330.0" y="280" text-anchor="middle" font-size="9.5" fill="#9a9a9a" font-weight="normal" filter="url(#rough2)">5</text>
  <rect x="360" y="288" width="60" height="46" fill="#fff3e0" stroke="#c9801f" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="390.0" y="280" text-anchor="middle" font-size="9.5" fill="#9a9a9a" font-weight="normal" filter="url(#rough2)">6</text>
  <rect x="420" y="288" width="60" height="46" fill="#fff3e0" stroke="#c9801f" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="450.0" y="280" text-anchor="middle" font-size="9.5" fill="#9a9a9a" font-weight="normal" filter="url(#rough2)">7</text>
  <rect x="480" y="288" width="60" height="46" fill="#fff3e0" stroke="#c9801f" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="510.0" y="280" text-anchor="middle" font-size="9.5" fill="#9a9a9a" font-weight="normal" filter="url(#rough2)">8</text>
  <rect x="540" y="288" width="60" height="46" fill="#fff3e0" stroke="#c9801f" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="570.0" y="280" text-anchor="middle" font-size="9.5" fill="#9a9a9a" font-weight="normal" filter="url(#rough2)">9</text>
  <rect x="600" y="288" width="60" height="46" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="630.0" y="280" text-anchor="middle" font-size="9.5" fill="#9a9a9a" font-weight="normal" filter="url(#rough2)">10</text>
  <rect x="60" y="288" width="600" height="46" fill="none" stroke="#2b2b2b" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="318" text-anchor="middle" font-size="13" fill="#2f5223" font-weight="bold" filter="url(#rough2)">块 2</text>
  <text x="450" y="318" text-anchor="middle" font-size="13" fill="#a8641a" font-weight="bold" filter="url(#rough2)">块 3</text>
  <line x1="242" y1="346" x2="658" y2="346" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="242" y1="340" x2="242" y2="352" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="658" y1="340" x2="658" y2="352" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="450" y="364" text-anchor="middle" font-size="12" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">[4,10] 空闲 7 字节 &gt;= 6</text>
  <text x="60" y="394" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">defragment：块 2 从 [6,8] 前移到 [1,3]，中间的洞被填平，块间不再有空隙。</text>
  <text x="60" y="418" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">再 alloc 6：[4,10] 是最靠前的 7 字节空闲段 → 分配 [4,9]，输出编号 3。</text>
  <text x="60" y="442" text-anchor="start" font-size="12" fill="#2f5223" font-weight="bold" filter="url(#rough2)">注意编号只在分配成功时 +1：上一次 NULL 没有占号。</text>
</svg>
