<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="760" height="440" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">奇偶不变量：总行变化 ≡ 单蛙列个数 (mod 2)</text>
  <path d="M 120 42 Q 380 49 640 42" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- 左：逐列模 2 记账 -->
  <rect x="26" y="58" width="404" height="240" rx="9" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="228" y="82" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">逐列记账，只关心模 2</text>

  <text x="44" y="108" font-size="12" fill="#333" filter="url(#rough2)">第 j 列：顶部 T_j 只、底部 B_j 只，c_j = T_j + B_j</text>
  <text x="44" y="130" font-size="12" fill="#333" filter="url(#rough2)">横跳 p_j + q_j = h_j；其余竖跳</text>
  <text x="44" y="152" font-size="12" fill="#333" filter="url(#rough2)">竖跳里：T_j − p_j 只向下，B_j − q_j 只向上</text>
  <text x="44" y="174" font-size="12" fill="#333" filter="url(#rough2)">行 1 净变化 δ_j = (B_j − q_j) − (T_j − p_j)</text>

  <path d="M 44 188 L 412 188" stroke="#c9d4e0" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <text x="44" y="210" font-size="12" fill="#b85450" filter="url(#rough2)">模 2：−q_j ≡ q_j，−T_j ≡ T_j，所以 δ_j ≡ c_j + h_j</text>
  <text x="44" y="234" font-size="12.5" fill="#333" filter="url(#rough2)">求和：Σ δ_j ≡ Σ c_j + 2 Σ a_j ≡ c</text>
  <text x="44" y="256" font-size="11.5" fill="#66788c" filter="url(#rough2)">这里 c 就是「恰好一只青蛙」的列数</text>
  <text x="44" y="284" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">行数不变 ⟹ Σ δ_j = 0 ⟹ c 必须为偶数！</text>

  <!-- 右：判定流程 -->
  <rect x="446" y="58" width="292" height="240" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="592" y="82" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">于是整题只剩一个判定</text>

  <rect x="500" y="96" width="184" height="38" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="592" y="121" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">数出 c（单蛙列数）</text>

  <path d="M 592 134 L 592 152" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <polygon points="592,156 674,190 592,224 510,190" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="592" y="195" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">c 是偶数？</text>

  <path d="M 510 190 L 478 190 L 478 238" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="474" y="182" text-anchor="end" font-size="12" fill="#3c5e2e" filter="url(#rough2)">是</text>
  <rect x="452" y="242" width="152" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="528" y="267" text-anchor="middle" font-size="13" fill="#3c5e2e" filter="url(#rough2)">k = 0</text>

  <path d="M 674 190 L 700 190 L 700 238" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="706" y="182" text-anchor="start" font-size="12" fill="#a14340" filter="url(#rough2)">否</text>
  <rect x="606" y="242" width="128" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="670" y="267" text-anchor="middle" font-size="13" fill="#a14340" filter="url(#rough2)">k = 1</text>

  <!-- 底部：奇数为何一只就够 -->
  <rect x="26" y="312" width="712" height="112" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="382" y="336" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">c 为奇数时，为什么删 1 只一定可行</text>
  <text x="46" y="362" font-size="12" fill="#8a6015" filter="url(#rough2)">情形 A：有双蛙列 B。拆掉其中一只 → 它变成单蛙列，c 加 1 变偶数，且没有列变空。</text>
  <text x="46" y="386" font-size="12" fill="#8a6015" filter="url(#rough2)">情形 B：全是单蛙列（n = c 为奇数）。删掉第 1 列那只蛙，剩下 n − 1 列两两相邻互换。</text>
  <text x="46" y="410" font-size="11.5" fill="#b85450" filter="url(#rough2)">两种情形都只删 1 只；而 c 为奇数时 0 只绝无可能，故答案恰为 1。</text>
</svg>
