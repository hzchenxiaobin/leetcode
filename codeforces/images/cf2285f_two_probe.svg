<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 424" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#777"/>
    </marker>
  </defs>

  <rect width="640" height="424" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">两种「跨分子反应边」探测方式：取便宜的</text>
  <text x="320" y="45" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">分子内部永远没有反应对（否则早已炸掉）⇒ 只需判断 A、B 之间有没有反应边</text>

  <!-- left panel -->
  <rect x="22" y="60" width="292" height="242" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="168" y="84" text-anchor="middle" font-size="12.5" fill="#2f4a6b" font-weight="bold" filter="url(#rough2)">方式 1：枚举点对 + 查哈希表</text>

  <text x="96" y="112" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">分子 A</text>
  <text x="240" y="112" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">分子 B</text>

  <!-- all 9 pair lines -->
  <g stroke="#b85450" stroke-width="0.9" opacity="0.55" stroke-dasharray="3 3" filter="url(#rough2)">
    <path d="M 86 134 L 216 134"/>
    <path d="M 86 134 L 250 160"/>
    <path d="M 86 134 L 212 182"/>
    <path d="M 118 162 L 216 134"/>
    <path d="M 118 162 L 250 160"/>
    <path d="M 118 162 L 212 182"/>
    <path d="M 80 184 L 216 134"/>
    <path d="M 80 184 L 250 160"/>
    <path d="M 80 184 L 212 182"/>
  </g>

  <g fill="#446688" filter="url(#rough2)">
    <circle cx="86" cy="134" r="7"/>
    <circle cx="118" cy="162" r="7"/>
    <circle cx="80" cy="184" r="7"/>
  </g>
  <g fill="#4a7a3a" filter="url(#rough2)">
    <circle cx="216" cy="134" r="7"/>
    <circle cx="250" cy="160" r="7"/>
    <circle cx="212" cy="182" r="7"/>
  </g>

  <text x="168" y="218" text-anchor="middle" font-size="10.5" fill="#3a4a66" filter="url(#rough2)">每对 (x, y) 查一次全局哈希表，O(1)</text>
  <rect x="60" y="230" width="216" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="168" y="247" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">代价 c1 = |A| · |B|</text>
  <text x="168" y="278" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">适合「分子小但点度数很大」的情形</text>

  <!-- right panel -->
  <rect x="326" y="60" width="292" height="242" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="472" y="84" text-anchor="middle" font-size="12.5" fill="#33562b" font-weight="bold" filter="url(#rough2)">方式 2：扫度数和较小侧的邻接表</text>

  <text x="392" y="112" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">分子 A（ds 小）</text>

  <g stroke="#7a9a5a" stroke-width="1" opacity="0.85" filter="url(#rough2)">
    <path d="M 374 138 L 468 124"/>
    <path d="M 374 138 L 498 160"/>
    <path d="M 404 166 L 468 124"/>
    <path d="M 404 166 L 530 140"/>
    <path d="M 366 188 L 498 160"/>
    <path d="M 366 188 L 470 206"/>
  </g>
  <g fill="#4a7a3a" filter="url(#rough2)">
    <circle cx="374" cy="138" r="7"/>
    <circle cx="404" cy="166" r="7"/>
    <circle cx="366" cy="188" r="7"/>
  </g>
  <g fill="#d6a040" stroke="#a97b28" stroke-width="1" filter="url(#rough2)">
    <circle cx="468" cy="124" r="5.5"/>
    <circle cx="530" cy="140" r="5.5"/>
    <circle cx="498" cy="160" r="5.5"/>
    <circle cx="470" cy="206" r="5.5"/>
  </g>
  <text x="556" y="190" text-anchor="middle" font-size="9.5" fill="#8a6a20" filter="url(#rough2)">分子外邻居</text>

  <text x="472" y="228" text-anchor="middle" font-size="10.5" fill="#33562b" filter="url(#rough2)">对每个邻居 y 判 find(y) 是否等于 B 的根</text>
  <rect x="364" y="238" width="216" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="472" y="255" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">代价 c2 = ds(A) = Σ deg(x) ≤ 2m</text>
  <text x="472" y="284" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">适合「分子大但一侧度数和小」的情形</text>

  <!-- bottom -->
  <path d="M 320 306 L 320 328" stroke="#777" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="22" y="334" width="596" height="74" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="42" y="356" font-size="11.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">每次实验先估两个代价，选小的那个执行：c = min(|A|·|B|, ds(A), ds(B))</text>
  <text x="42" y="376" font-size="10.5" fill="#6b4a48" filter="url(#rough2)">两者都 ≤ 2m ⇒ 单次探测不超 O(m)；再配合启发式合并与势能论证，总量可控（见第 6 节）</text>
  <text x="42" y="396" font-size="10.5" fill="#6b4a48" filter="url(#rough2)">爆炸时分子被整体摧毁：省下的探测预算正好抵消重建代价</text>
</svg>
