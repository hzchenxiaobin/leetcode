<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="780" height="430" fill="#fafafa"/>
  <text x="390" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">样例第 1 问演算：d = [4,2,5]，s = [4,2,7]，x = 3</text>
  <text x="390" y="52" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">最优路线 1 → 4 → 6 → 8 → 11：平台内跳付 4 与 7，跨边界的两次跳跃免费，总计 11</text>
  <rect x="100" y="150" width="34" height="34" fill="#fff1b8" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="117" y="172" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">1</text>
  <rect x="134" y="150" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="151" y="172" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">2</text>
  <rect x="168" y="150" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="185" y="172" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">3</text>
  <rect x="202" y="150" width="34" height="34" fill="#fff1b8" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="219" y="172" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">4</text>
  <rect x="244" y="150" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="261" y="172" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">5</text>
  <rect x="278" y="150" width="34" height="34" fill="#fff1b8" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="295" y="172" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">6</text>
  <rect x="320" y="150" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="337" y="172" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">7</text>
  <rect x="354" y="150" width="34" height="34" fill="#fff1b8" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="371" y="172" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">8</text>
  <rect x="388" y="150" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="405" y="172" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">9</text>
  <rect x="422" y="150" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="439" y="172" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">10</text>
  <rect x="456" y="150" width="34" height="34" fill="#fff1b8" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="473" y="172" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">11</text>
  <rect x="96" y="144" width="144" height="46" fill="none" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <rect x="240" y="144" width="76" height="46" fill="none" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <rect x="316" y="144" width="176" height="46" fill="none" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="168" y="212" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">平台 1（s=4）</text>
  <text x="278" y="212" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">平台 2（s=2）</text>
  <text x="404" y="212" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">平台 3（s=7）</text>
  <path d="M 117 142 Q 168 76 219 142" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="168" y="70" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">付 s₁=4</text>
  <path d="M 219 142 Q 257 92 295 142" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="257" y="86" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">免费</text>
  <path d="M 295 142 Q 333 92 371 142" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="333" y="86" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">免费</text>
  <path d="M 371 142 Q 422 76 473 142" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="422" y="70" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">付 s₃=7</text>
  <path d="M 236 140 L 236 194" stroke="#b85450" stroke-width="1.0" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <path d="M 312 140 L 312 194" stroke="#b85450" stroke-width="1.0" stroke-dasharray="3 3" filter="url(#rough2)"/>
  <rect x="36" y="228" width="204" height="104" fill="none" stroke="#c8d6e5" stroke-width="1.4" rx="9" filter="url(#rough2)"/>
  <text x="138" y="250" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">初始向量 u₁（i₁ = 0）</text>
  <rect x="288" y="228" width="204" height="104" fill="none" stroke="#c8d6e5" stroke-width="1.4" rx="9" filter="url(#rough2)"/>
  <text x="390" y="250" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">⊗ T₂ 之后</text>
  <rect x="540" y="228" width="204" height="104" fill="none" stroke="#c8d6e5" stroke-width="1.4" rx="9" filter="url(#rough2)"/>
  <text x="642" y="250" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">⊗ T₃ 后取下标 0</text>
  <text x="120" y="264" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">o = 0,1,2</text>
  <rect x="78" y="272" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="93" y="290" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="112" y="272" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="127" y="290" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="146" y="272" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="161" y="290" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="372" y="264" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">o' = 0,1,2</text>
  <rect x="330" y="272" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="345" y="290" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="364" y="272" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="379" y="290" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="398" y="272" width="30" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="413" y="290" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">∞</text>
  <text x="624" y="264" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">T₃[o][0]</text>
  <rect x="582" y="272" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="597" y="290" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7</text>
  <rect x="616" y="272" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="631" y="290" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7</text>
  <rect x="650" y="272" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="665" y="290" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">14</text>
  <text x="138" y="320" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">4·⌈(3−o)/3⌉ 全为 4</text>
  <text x="390" y="320" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">o' ≤ d₂−1 = 1，故 o'=2 为 ∞</text>
  <text x="642" y="320" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">min(4+7, 4+7) = 11</text>
  <path d="M 246 280 L 282 280" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 498 280 L 534 280" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <ellipse cx="642" cy="378" rx="42" ry="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="642" y="385" text-anchor="middle" font-size="16" font-weight="bold" fill="#b85450" filter="url(#rough2)">11</text>
  <text x="390" y="382" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">向量 ⊗ 矩阵 = 逐列取 min：v'[o'] = min_o ( v[o] + T[o][o'] )</text>
  <text x="390" y="404" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">第一步的 4 来自「平台 1 内 1→4 一跳」，最后的 7 来自「平台 3 内 8→11 一跳」</text>
</svg>
