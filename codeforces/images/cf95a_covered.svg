<svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 0 780 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="181"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="780" height="420" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">先标出所有“被某个禁用串覆盖”的位置（大小写无关）</text>
  <path d="M 156 39 Q 390 45 624 39" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="40" y="62" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">w = "PetrLoveLuckyNumbers"，禁止串 = bers / ucky / elu，目标字母 = t</text>
  <rect x="40" y="76" width="31" height="34" rx="3" fill="#f7ecec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="55.5" y="98" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3b37" filter="url(#rough2)">P</text>
  <rect x="74" y="76" width="31" height="34" rx="3" fill="#f7ecec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="89.5" y="98" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3b37" filter="url(#rough2)">e</text>
  <rect x="108" y="76" width="31" height="34" rx="3" fill="#f7ecec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="123.5" y="98" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3b37" filter="url(#rough2)">t</text>
  <rect x="142" y="76" width="31" height="34" rx="3" fill="#f7ecec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="157.5" y="98" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3b37" filter="url(#rough2)">r</text>
  <rect x="176" y="76" width="31" height="34" rx="3" fill="#f7ecec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="191.5" y="98" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3b37" filter="url(#rough2)">L</text>
  <rect x="210" y="76" width="31" height="34" rx="3" fill="#f7ecec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="225.5" y="98" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3b37" filter="url(#rough2)">o</text>
  <rect x="244" y="76" width="31" height="34" rx="3" fill="#f7ecec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="259.5" y="98" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3b37" filter="url(#rough2)">v</text>
  <rect x="278" y="76" width="31" height="34" rx="3" fill="#f7ecec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="293.5" y="98" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3b37" filter="url(#rough2)">e</text>
  <rect x="312" y="76" width="31" height="34" rx="3" fill="#f7ecec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="327.5" y="98" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3b37" filter="url(#rough2)">L</text>
  <rect x="346" y="76" width="31" height="34" rx="3" fill="#f7ecec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="361.5" y="98" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3b37" filter="url(#rough2)">u</text>
  <rect x="380" y="76" width="31" height="34" rx="3" fill="#f7ecec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="395.5" y="98" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3b37" filter="url(#rough2)">c</text>
  <rect x="414" y="76" width="31" height="34" rx="3" fill="#f7ecec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="429.5" y="98" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3b37" filter="url(#rough2)">k</text>
  <rect x="448" y="76" width="31" height="34" rx="3" fill="#f7ecec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="463.5" y="98" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3b37" filter="url(#rough2)">y</text>
  <rect x="482" y="76" width="31" height="34" rx="3" fill="#f7ecec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="497.5" y="98" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3b37" filter="url(#rough2)">N</text>
  <rect x="516" y="76" width="31" height="34" rx="3" fill="#f7ecec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="531.5" y="98" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3b37" filter="url(#rough2)">u</text>
  <rect x="550" y="76" width="31" height="34" rx="3" fill="#f7ecec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="565.5" y="98" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3b37" filter="url(#rough2)">m</text>
  <rect x="584" y="76" width="31" height="34" rx="3" fill="#f7ecec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="599.5" y="98" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3b37" filter="url(#rough2)">b</text>
  <rect x="618" y="76" width="31" height="34" rx="3" fill="#f7ecec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="633.5" y="98" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3b37" filter="url(#rough2)">e</text>
  <rect x="652" y="76" width="31" height="34" rx="3" fill="#f7ecec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="667.5" y="98" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3b37" filter="url(#rough2)">r</text>
  <rect x="686" y="76" width="31" height="34" rx="3" fill="#f7ecec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="701.5" y="98" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3b37" filter="url(#rough2)">s</text>
  <text x="40" y="130" text-anchor="start" font-size="11.5" fill="#8a3b37" filter="url(#rough2)">红色 = 被覆盖的位置（bers 命中 “Numbers” 的 bers，ucky 命中 “Lucky”，elu 命中 “eLu”）：</text>
  <text x="40" y="152" text-anchor="start" font-size="11.5" fill="#5b5b5b" filter="url(#rough2)">这些位置必须换字母，其余位置一个字符都不能动。</text>
  <rect x="40" y="176" width="700" height="60" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="56" y="200" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">替换规则（同一大小写内）：能换成目标字母就换成目标字母（这样最省“幸运字母”）；</text>
  <text x="56" y="222" text-anchor="start" font-size="12" fill="#2f4a66" filter="url(#rough2)">如果原字母恰好就是目标字母（换了就丢了），则换成同大小写里最小的、且不同于原字母的字母。</text>
  <rect x="40" y="250" width="700" height="44" rx="8" fill="#e9f4ec" stroke="#3f6b4a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="56" y="278" text-anchor="start" font-size="12.5" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">结果："PetrLov" + "tTtttt" + "Num" + "tttt" = PetrLovtTttttNumtttt（样例 1）</text>
  <rect x="40" y="306" width="700" height="66" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="330" text-anchor="start" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">为什么这是最优：每个被覆盖位置独立，最多贡献 1 个目标字母；能贡献就必须贡献，</text>
  <text x="56" y="352" text-anchor="start" font-size="12" fill="#7a5a1b" filter="url(#rough2)">贡献之后为了让整串字典序最小，其他位置都取“能取的最小字母”即可。</text>
  <text x="40" y="396" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">注意：替换只做一遍，替换后新出现的禁用串不用再处理（题面明确说明）。</text>
</svg>
