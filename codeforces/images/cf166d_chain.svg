<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="829"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="290" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">顾客 = 连接相邻尺码鞋的边，鞋 = 链上带价格的点</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">链上匹配 DP：状态只差「左边组是否已占用」</text>
  <g filter="url(#rough2)"><circle cx="150" cy="130" r="20" fill="#cfe0f5" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="150" y="133.24" text-anchor="middle" font-size="9" fill="#2b2b2b" filter="url(#rough2)">s=1</text>
  <g filter="url(#rough2)"><circle cx="320" cy="130" r="20" fill="#dcecd2" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="320" y="133.24" text-anchor="middle" font-size="9" fill="#2b2b2b" filter="url(#rough2)">s=2</text>
  <g filter="url(#rough2)"><circle cx="490" cy="130" r="20" fill="#cfe0f5" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="490" y="133.24" text-anchor="middle" font-size="9" fill="#2b2b2b" filter="url(#rough2)">s=3</text>
  <g filter="url(#rough2)"><circle cx="660" cy="130" r="20" fill="#dcecd2" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="660" y="133.24" text-anchor="middle" font-size="9" fill="#2b2b2b" filter="url(#rough2)">s=4</text>
  <g filter="url(#rough2)"><line x1="172" y1="130" x2="298" y2="130" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="235" y="112" text-anchor="middle" font-size="9" fill="#666666" filter="url(#rough2)">顾客</text>
  <g filter="url(#rough2)"><line x1="342" y1="130" x2="468" y2="130" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="405" y="112" text-anchor="middle" font-size="9" fill="#666666" filter="url(#rough2)">顾客</text>
  <g filter="url(#rough2)"><line x1="512" y1="130" x2="638" y2="130" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="575" y="112" text-anchor="middle" font-size="9" fill="#666666" filter="url(#rough2)">顾客</text>
  <text x="450" y="200" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">每条边（顾客）只能服务两个端点之一</text>
  <text x="450" y="232" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">同一组内至多两只鞋可用，判定 cnt(≥min)≥2 且 cnt(≥max)≥1</text>
</svg>
