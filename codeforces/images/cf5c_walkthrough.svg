  <rect width="760" height="300" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1 走查：)((())))(()()) 里有两段长度 6</text>
  <path d="M 120 42 Q 380 47 640 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="380" y="58" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">每个配对成功的 ')' 下方写着「以它结尾的最长合法长度」</text>

