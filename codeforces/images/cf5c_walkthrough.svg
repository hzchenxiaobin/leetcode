  <text x="349" y="110" text-anchor="middle" font-size="16" fill="#2b2b2b" font-family="'Courier New',monospace" filter="url(#rough2)">(</text>
  <rect x="366" y="84" width="34" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="383" y="78" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">9</text>
