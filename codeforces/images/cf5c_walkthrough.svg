  <text x="519" y="144" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">6</text>

  <line x1="94" y1="158" x2="298" y2="158" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <line x1="94" y1="158" x2="94" y2="152" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="298" y1="158" x2="298" y2="152" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="196" y="176" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">((()))  长度 6</text>

  <line x1="332" y1="158" x2="536" y2="158" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <line x1="332" y1="158" x2="332" y2="152" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="536" y1="158" x2="536" y2="152" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="434" y="176" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">(()())  长度 6</text>

  <rect x="556" y="80" width="190" height="122" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="568" y="104" font-size="11.5" fill="#8a6015" filter="url(#rough2)">长度 6 一共出现 2 次</text>
  <text x="568" y="126" font-size="11.5" fill="#8a6015" filter="url(#rough2)">→ 答案就是 6 2</text>
  <text x="568" y="152" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">两段互不重叠：</text>
  <text x="568" y="172" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">下标 1..6 与 8..13，</text>
  <text x="568" y="192" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">各由自己的 ')' 结算。</text>

  <rect x="60" y="212" width="320" height="40" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="72" y="238" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">最长长度 6，出现次数 2</text>

  <text x="404" y="228" font-size="11" fill="#b85450" filter="url(#rough2)">标 × 的 ')'（下标 0、7）谁也配不上，</text>
  <text x="404" y="248" font-size="11" fill="#b85450" filter="url(#rough2)">只把分界往后挪，不产生长度值。</text>
