  <text x="213" y="144" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">2</text>
  <rect x="230" y="84" width="34" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
