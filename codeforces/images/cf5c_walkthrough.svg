  <text x="247" y="144" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">4</text>
  <rect x="264" y="84" width="34" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="281" y="78" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">6</text>
