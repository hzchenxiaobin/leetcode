<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>

  <text x="360" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">同一时刻不能在同一路口，但可以在路段中间擦肩</text>
  <path d="M 100 40 Q 360 46 620 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 面板 A -->
  <rect x="20" y="62" width="220" height="230" rx="12" fill="#fde8e8" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="130" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#a33a36" filter="url(#rough2)">同时到达同一点 ✗</text>
  <g filter="url(#rough2)">
    <circle cx="70" cy="190" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="180" cy="190" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="125" cy="140" r="12" fill="#fde8e8" stroke="#b85450" stroke-width="2"/>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">
    <text x="70" y="194">1</text><text x="125" y="144">2</text><text x="180" y="194">3</text>
  </g>
  <path d="M 82 184 L 113 150" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 168 184 L 137 150" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="130" y="222" text-anchor="middle" font-size="10.5" fill="#8a3b38" filter="url(#rough2)">Bob 1→2，Alex 3→2</text>
  <text x="130" y="242" text-anchor="middle" font-size="10.5" fill="#8a3b38" filter="url(#rough2)">下一步两人都在 2 → 非法</text>

  <!-- 面板 B -->
  <rect x="250" y="62" width="220" height="230" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">沿同一条路对穿 ✓</text>
  <g filter="url(#rough2)">
    <circle cx="300" cy="180" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="420" cy="180" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">
    <text x="300" y="184">1</text><text x="420" y="184">2</text>
  </g>
  <path d="M 312 174 L 408 174" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 408 190 L 312 190" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="360" y="216" text-anchor="middle" font-size="10.5" fill="#2f5223" filter="url(#rough2)">Bob 1→2，Alex 2→1</text>
  <text x="360" y="236" text-anchor="middle" font-size="10.5" fill="#2f5223" filter="url(#rough2)">在路段中间相遇，允许</text>

  <!-- 面板 C -->
  <rect x="480" y="62" width="220" height="230" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="590" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">一个到达、一个离开 ✓</text>
  <g filter="url(#rough2)">
    <circle cx="530" cy="180" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="590" cy="140" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="650" cy="180" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">
    <text x="530" y="184">1</text><text x="590" y="144">2</text><text x="650" y="184">3</text>
  </g>
  <path d="M 542 174 L 578 148" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 602 148 L 638 174" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="590" y="216" text-anchor="middle" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">Bob 1→2，Alex 2→3</text>
  <text x="590" y="236" text-anchor="middle" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">时刻 t 不同路口，t+1 也不同</text>

  <rect x="40" y="308" width="640" height="72" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <g font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">
    <text x="56" y="334">因此状态转移只需检查"移动后"的位置不同：u' ≠ v'，其中 u'、v' 分别是两人的新位置。</text>
    <text x="56" y="360">同一条边反向对穿（u'=v、v'=u）满足 u' ≠ v'，是允许的；这正是本题与"点不相交路径"的区别。</text>
  </g>
</svg>
