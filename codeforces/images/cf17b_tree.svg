<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="29"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="760" height="320" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">B：为什么“全取最便宜入边”一定是一棵树？</text>
  <path d="M 150 42 Q 380 47 610 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <text x="60" y="86" font-size="11.5" fill="#777" filter="url(#rough2)">沿“我的上司是谁”一路往上走，资历必须严格递增：</text>
  <rect x="70" y="100" width="90" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="115" y="126" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">q = 1</text>
  <rect x="215" y="100" width="90" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="260" y="126" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">q = 3</text>
  <rect x="360" y="100" width="90" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="405" y="126" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">q = 7</text>
  <line x1="162" y1="120" x2="212" y2="120" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <line x1="307" y1="120" x2="357" y2="120" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="187" y="112" text-anchor="middle" font-size="9.5" fill="#2f5223" filter="url(#rough2)">上司</text>
  <text x="332" y="112" text-anchor="middle" font-size="9.5" fill="#2f5223" filter="url(#rough2)">上司</text>
  <text x="480" y="126" font-size="11" fill="#2f5223" filter="url(#rough2)">q 只能越走越大，绝不可能回到起点</text>
  <text x="480" y="146" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">⟹ 不存在有向环</text>

  <rect x="60" y="168" width="330" height="112" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="72" y="192" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">选边规则</text>
  <text x="72" y="216" font-size="10.5" fill="#3c5e88" filter="url(#rough2)">· 每个下属恰好一条入边（除根之外）</text>
  <text x="72" y="238" font-size="10.5" fill="#3c5e88" filter="url(#rough2)">· 取最便宜的那条（各人独立）</text>
  <text x="72" y="260" font-size="10.5" fill="#3c5e88" filter="url(#rough2)">· 得到 n-1 条边、无环 ⟹ 是一棵生成树</text>

  <rect x="410" y="168" width="310" height="112" rx="10" fill="#fdeceb" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="422" y="192" font-size="12" font-weight="bold" fill="#8c3a36" filter="url(#rough2)">可行 ⇔ 无入边的人恰好 1 个</text>
  <text x="422" y="216" font-size="10.5" fill="#8c3a36" filter="url(#rough2)">≥2 个：多个根，不是一棵树 → -1</text>
  <text x="422" y="238" font-size="10.5" fill="#8c3a36" filter="url(#rough2)">0 个：不可能，最高分者不会有上司</text>
  <text x="422" y="260" font-size="10.5" fill="#8c3a36" filter="url(#rough2)">（每条申请都要求 q_a &gt; q_b）</text>

  <text x="380" y="306" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">n = 1 时没有申请也合法：唯一的员工就是根，代价为 0。</text>
</svg>
