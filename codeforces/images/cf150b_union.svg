<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="437"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="280" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">每个「长度 k 回文」= 若干对位置相等</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">用并查集合并，答案 = m^连通块数</text>
  <text x="90" y="104" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">s:</text>
  <g filter="url(#rough2)"><rect x="150" y="88" width="80" height="56" rx="4" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="190" y="124" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)"><rect x="240" y="88" width="80" height="56" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="280" y="124" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="330" y="88" width="80" height="56" rx="4" fill="#dcecd2" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="370" y="124" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="420" y="88" width="80" height="56" rx="4" fill="#f3d9d6" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="460" y="124" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="510" y="88" width="80" height="56" rx="4" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="550" y="124" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><path d="M 190 148 C 190 190, 240 190, 240 148" fill="none" stroke="#8a2b28" stroke-width="1.6" marker-end="url(#arr)"/></g>
  <g filter="url(#rough2)"><path d="M 330 148 C 330 198, 390 198, 390 148" fill="none" stroke="#8a2b28" stroke-width="1.6" marker-end="url(#arr)"/></g>
  <g filter="url(#rough2)"><path d="M 240 148 C 300 210, 330 210, 390 148" fill="none" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="5 3"/></g>
  <text x="450" y="200" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">k = 4 的两条回文约束把它们连成一块</text>
  <text x="450" y="232" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 = m^1 = 2</text>
</svg>
