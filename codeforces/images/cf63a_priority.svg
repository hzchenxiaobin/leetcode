<svg xmlns="http://www.w3.org/2000/svg" width="760" height="372" viewBox="0 0 760 372"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c9801f"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a8524a"/>
    </marker>
  </defs>
  <rect width="760" height="372" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">四个优先级：老鼠 → 妇女/儿童 → 男性 → 船长</text>
  <text x="380.0" y="60.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">组内按排队位置（从左到右），样例 1 的六名船员</text>
  <rect x="40.0" y="80.0" width="160.0" height="180.0" rx="10" fill="#f7f9fc" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120.0" y="106.0" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 老鼠</text>
  <text x="120.0" y="140.0" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">Teddy</text>
  <path d="M 204.0 170.0 L 226.0 170.0" stroke="#2b2b2b" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="226.0" y="80.0" width="160.0" height="180.0" rx="10" fill="#f4f9f2" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="306.0" y="106.0" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 妇女 / 儿童</text>
  <text x="306.0" y="140.0" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">Alice</text>
  <text x="306.0" y="170.0" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">Bob</text>
  <text x="306.0" y="200.0" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">Julia</text>
  <path d="M 390.0 170.0 L 412.0 170.0" stroke="#2b2b2b" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="412.0" y="80.0" width="160.0" height="180.0" rx="10" fill="#fbfbfb" stroke="#8a8a8a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="492.0" y="106.0" text-anchor="middle" font-size="12.5" fill="#8a8a8a" font-weight="bold" filter="url(#rough2)">③ 男性</text>
  <text x="492.0" y="140.0" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">Charlie</text>
  <path d="M 576.0 170.0 L 598.0 170.0" stroke="#2b2b2b" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="598.0" y="80.0" width="160.0" height="180.0" rx="10" fill="#fdf3e3" stroke="#c9801f" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="678.0" y="106.0" text-anchor="middle" font-size="12.5" fill="#c9801f" font-weight="bold" filter="url(#rough2)">④ 船长</text>
  <text x="678.0" y="140.0" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">Jack</text>
  <rect x="34.0" y="286.0" width="692.0" height="70.0" rx="8" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.4" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="48.0" y="310.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">身份 → 优先级：rat=1，woman=child=2，man=3，captain=4；</text>
  <text x="48.0" y="334.0" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">同优先级按输入顺序。分桶（每个优先级一个列表）是最稳的实现。</text>
</svg>
