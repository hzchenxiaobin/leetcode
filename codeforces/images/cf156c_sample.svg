<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="547"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="210" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">样例 1：ab</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">和为 3 的两位词只有 ab 与 ba</text>
  <text x="450" y="104" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">cnt[2][3] = 2 ⇒ 答案 2 − 1 = 1</text>
  <text x="450" y="146" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">样例 2：aaaaaaaaaaa 的和最小 ⇒ cnt=1 ⇒ 0</text>
  <text x="450" y="180" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">样例 3：ya 的 cnt[2][26] = 25 ⇒ 24</text>
</svg>
