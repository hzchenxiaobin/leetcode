<svg xmlns="http://www.w3.org/2000/svg" width="780" height="470" viewBox="0 0 780 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="780" height="470" fill="#fafafa"/>

  <text x="390" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：一次查表即可，不必模拟</text>
  <path d="M 218 42 Q 390 49 562 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <rect x="240" y="56" width="300" height="52" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="390" y="78" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">读入 n 个词 → has[首字母] = true</text>
  <text x="390" y="98" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">读入 m 个缩写（顺序随意，存下来或边读边查）</text>

  <path d="M 390 108 L 390 172" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 样例 4 提示 -->
  <rect x="24" y="60" width="188" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="118" y="82" text-anchor="middle" font-size="11" fill="#a14340" filter="url(#rough2)">样例 4：L0 = {A}</text>
  <text x="118" y="102" text-anchor="middle" font-size="11" fill="#a14340" filter="url(#rough2)">B ∉ L0 ⇒ 立即判 NO</text>

  <!-- 判定菱形 -->
  <path d="M 390 178 L 566 234 L 390 290 L 214 234 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="390" y="226" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">某个缩写含「L0 里没有」的字母？</text>
  <text x="390" y="248" text-anchor="middle" font-size="11" fill="#a07a2a" filter="url(#rough2)">逐个缩写、逐个字符查 has[]</text>

  <!-- 否 → YES -->
  <path d="M 214 234 L 168 234" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="190" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="24" y="198" width="142" height="72" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="95" y="222" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">所有字母齐备</text>
  <text x="95" y="244" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">输出 YES</text>
  <text x="95" y="262" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">按任意顺序造都行</text>

  <!-- 是 → NO -->
  <path d="M 566 234 L 612 234" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="590" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="616" y="198" width="146" height="72" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="689" y="222" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">缺的字母永远造不出</text>
  <text x="689" y="244" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">输出 NO</text>
  <text x="689" y="262" text-anchor="middle" font-size="10.5" fill="#8a5a58" filter="url(#rough2)">（缩写不会生产新字母）</text>

  <!-- 底部说明 -->
  <rect x="24" y="310" width="738" height="140" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="390" y="336" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">为什么这已经是最优：可用字母集合是不变量</text>
  <text x="390" y="362" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">造缩写 a 的前提是 a 的「每一个」字符都已在 L 中，其中当然包括 a[0]；</text>
  <text x="390" y="386" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">所以把 a 加入 S 后，L ← L ∪ {a[0]} 其实是空操作，L 从头到尾都等于 L0。</text>
  <text x="390" y="412" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">于是每个缩写的可行性互不影响，顺序无关，答案就是「所有字母都在 L0 中」。</text>
  <text x="390" y="436" text-anchor="middle" font-size="11" fill="#4a6a86" filter="url(#rough2)">（也可以写「反复扫描到不动点」的闭包版，结论相同——因为永远扫不出新字母。）</text>
</svg>
