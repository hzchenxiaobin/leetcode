<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 328" width="640" height="328">
<defs>
<filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="13" result="noise"/>
<feDisplacementMap in="SourceGraphic" in2="noise" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect x="0" y="0" width="640" height="328" fill="#fafafa"/>
<g font-family="Comic Sans MS, Kaiti SC, cursive">
<text x="320.0" y="24.0" font-size="15" fill="#33475b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">样例 1：1 → 2 → 3，直径 10 与 20，瓶颈 10</text>
<circle cx="120.0" cy="120.0" r="26.0" fill="#f6d9b0" stroke="#a08050" stroke-width="2.0" filter="url(#rough2)"/>
<text x="120.0" y="127.0" font-size="16" fill="#7a5c2e" text-anchor="middle" font-weight="normal" filter="url(#rough2)">1</text>
<circle cx="320.0" cy="120.0" r="26.0" fill="#f6d9b0" stroke="#a08050" stroke-width="2.0" filter="url(#rough2)"/>
<text x="320.0" y="127.0" font-size="16" fill="#7a5c2e" text-anchor="middle" font-weight="normal" filter="url(#rough2)">2</text>
<circle cx="520.0" cy="120.0" r="26.0" fill="#f6d9b0" stroke="#a08050" stroke-width="2.0" filter="url(#rough2)"/>
<text x="520.0" y="127.0" font-size="16" fill="#7a5c2e" text-anchor="middle" font-weight="normal" filter="url(#rough2)">3</text>
<line x1="150.0" y1="120.0" x2="290.0" y2="120.0" stroke="#7a93a8" stroke-width="2.6" filter="url(#rough2)"/>
<polygon points="290.0,120.0 281.0,115.5 281.0,124.5" fill="#7a93a8" filter="url(#rough2)"/>
<text x="220.0" y="104.0" font-size="14" fill="#3a5a72" text-anchor="middle" font-weight="normal" filter="url(#rough2)">d=10</text>
<line x1="350.0" y1="120.0" x2="490.0" y2="120.0" stroke="#7a93a8" stroke-width="2.6" filter="url(#rough2)"/>
<polygon points="490.0,120.0 481.0,115.5 481.0,124.5" fill="#7a93a8" filter="url(#rough2)"/>
<text x="420.0" y="104.0" font-size="14" fill="#3a5a72" text-anchor="middle" font-weight="normal" filter="url(#rough2)">d=20</text>
<text x="120.0" y="176.0" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">水塔</text>
<text x="320.0" y="176.0" font-size="12" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">中间</text>
<text x="520.0" y="176.0" font-size="12" fill="#1f6f43" text-anchor="middle" font-weight="normal" filter="url(#rough2)">龙头</text>
<rect x="120.0" y="210.0" width="400.0" height="70.0" rx="10" fill="#fdf3d8" stroke="#c9a25a" stroke-width="1.8" filter="url(#rough2)"/>
<text x="320.0" y="238.0" font-size="16" fill="#7a5c2e" text-anchor="middle" font-weight="bold" filter="url(#rough2)">输出：1  3  10</text>
<text x="320.0" y="264.0" font-size="12" fill="#7a5c2e" text-anchor="middle" font-weight="normal" filter="url(#rough2)">（水塔编号、龙头编号、链上最小直径）</text>
<text x="320.0" y="312.0" font-size="13" fill="#4a3f7a" text-anchor="middle" font-weight="normal" filter="url(#rough2)">样例 2 是三元环 → 水塔集合为空 → 输出 0</text>
</g>
</svg>
