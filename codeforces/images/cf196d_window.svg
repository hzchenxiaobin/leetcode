  <text x="390.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">196D：只需禁止长度为 d 与 d+1 的回文</text>
  <path d="M 209.48000000000002 46 Q 390.0 52 570.52 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60.0" y="80.0" width="68.0" height="44.0" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
