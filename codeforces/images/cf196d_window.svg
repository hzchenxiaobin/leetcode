  <rect x="364.0" y="72.0" width="220.0" height="60.0" rx="8" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="478.0" y="150.0" text-anchor="middle" font-size="10.4" font-weight="bold" fill="#b85450" filter="url(#rough2)">长度 d 的窗口</text>
  <rect x="440.0" y="72.0" width="220.0" height="60.0" rx="8" fill="none" stroke="#5b8c5a" stroke-width="1.8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="554.0" y="176.0" text-anchor="middle" font-size="10.4" font-weight="bold" fill="#2f5b34" filter="url(#rough2)">长度 d+1 的窗口</text>
  <rect x="60.0" y="200.0" width="660.0" height="62.0" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="224.0" text-anchor="start" font-size="10.9" fill="#8a6015" filter="url(#rough2)">任何长度 ≥ d 的回文，反复掐头去尾 2 个字符后必落在长度 d 或 d+1 上 ⇒ 只需禁止这两种长度。</text>
  <text x="74.0" y="246.0" text-anchor="start" font-size="10.9" fill="#8a6015" filter="url(#rough2)">填第 i 位时只检查“以 i 结尾”的这两个窗口是否回文（双哈希 O(1)）。</text>
  <rect x="60.0" y="274.0" width="660.0" height="60.0" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="298.0" text-anchor="start" font-size="10.9" fill="#2f5b34" filter="url(#rough2)">d = 1 时任何单字符都是回文 ⇒ 直接 Impossible。</text>
  <text x="74.0" y="320.0" text-anchor="start" font-size="10.9" fill="#2f5b34" filter="url(#rough2)">样例 1（d=3, aaaaaaa）：答案 aabbcaa，长度 3 与 4 的回文都被避开。</text>
