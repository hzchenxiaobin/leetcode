<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#55606e"/>
    </marker>
  </defs>
  <rect width="760" height="430" fill="#fafafa"/>

  <text x="380" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每个顶点只有三步：并 → 插入/平移 → 按名次切三段</text>
  <path d="M 110 39 Q 380 46 650 39" stroke="#2b2b2b" stroke-width="1.1" fill="none" filter="url(#rough2)"/>

  <!-- ==================== 左面板：流程 ==================== -->
  <rect x="16" y="48" width="330" height="316" rx="10" fill="#f7fbff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="30" y="64" width="302" height="56" rx="8" fill="#eef7f0" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="181" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#3c5e2e">① 儿子先算完，treap 两两求并</text>
    <text x="181" y="106" text-anchor="middle" font-size="11" fill="#3c5e2e">并完得到 h_v：t = Σf(c) 的增量池</text>

    <path d="M 181 120 L 181 140" stroke="#55606e" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>

    <rect x="30" y="142" width="302" height="56" rx="8" fill="#f7fbff" stroke="#446688" stroke-width="1.5"/>
    <text x="181" y="164" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66">② a_v = 0：插入一个 0</text>
    <text x="181" y="184" text-anchor="middle" font-size="11" fill="#2f4a66">a_v = ±1：不插，只把窗口平移一格</text>

    <path d="M 181 198 L 181 218" stroke="#55606e" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>

    <rect x="30" y="220" width="302" height="64" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="181" y="242" text-anchor="middle" font-size="12" font-weight="bold" fill="#8f3a36">③ 按名次切三段，加 |f(v)|</text>
    <text x="181" y="261" text-anchor="middle" font-size="11" fill="#8f3a36">前缀 −2 ／ 中段不动 ／ 后缀 +2</text>
    <text x="181" y="277" text-anchor="middle" font-size="11" fill="#8f3a36">O(1) 次 split + 两次整段 lazy</text>

    <path d="M 181 284 L 181 304" stroke="#55606e" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>

    <rect x="30" y="306" width="302" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="181" y="325" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6520">④ at_lo += |hi_v|，交还父亲</text>
    <text x="181" y="343" text-anchor="middle" font-size="11" fill="#8a6520">根节点的 at_lo 就是「全取 +1」的代价</text>
  </g>

  <!-- ==================== 右面板：按名次切分 ==================== -->
  <rect x="362" y="48" width="382" height="316" rx="10" fill="#fffdf5" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="553" y="70" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6520" filter="url(#rough2)">切分点只由「位置 p ↔ k = s_v − 2p」决定</text>

  <g filter="url(#rough2)">
    <text x="404" y="92" font-size="11" fill="#55606e">加 |f(v)| 前（有序、越右越贵）</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="384" y="100" width="30" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="399" y="118" text-anchor="middle" font-size="10.5" fill="#2f4a66">−6</text>
    <rect x="418" y="100" width="30" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="433" y="118" text-anchor="middle" font-size="10.5" fill="#2f4a66">−3</text>
    <rect x="452" y="100" width="30" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="467" y="118" text-anchor="middle" font-size="10.5" fill="#2f4a66">−1</text>
    <rect x="486" y="100" width="30" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="501" y="118" text-anchor="middle" font-size="10.5" fill="#2f4a66">0</text>
    <rect x="520" y="100" width="30" height="26" rx="4" fill="#eef7f0" stroke="#4a7a3a" stroke-width="2"/>
    <text x="535" y="118" text-anchor="middle" font-size="10.5" fill="#3c5e2e">2</text>
    <rect x="554" y="100" width="30" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="569" y="118" text-anchor="middle" font-size="10.5" fill="#8a6520">5</text>
    <rect x="588" y="100" width="30" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="603" y="118" text-anchor="middle" font-size="10.5" fill="#8a6520">8</text>
    <rect x="622" y="100" width="30" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="637" y="118" text-anchor="middle" font-size="10.5" fill="#8a6520">11</text>
    <rect x="656" y="100" width="30" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="671" y="118" text-anchor="middle" font-size="10.5" fill="#8a6520">14</text>
    <rect x="690" y="100" width="30" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="705" y="118" text-anchor="middle" font-size="10.5" fill="#8a6520">20</text>
  </g>
  <g filter="url(#rough2)">
    <text x="553" y="140" text-anchor="middle" font-size="10.5" fill="#55606e">位置 p = lo+1 … hi　　名次 1 … ninc　　中间那一格只在 S+1 为奇数时存在</text>
    <path d="M 520 146 L 520 158 L 550 158 L 550 146" stroke="#4a7a3a" stroke-width="1.3" fill="none"/>
    <text x="528" y="174" text-anchor="middle" font-size="10.5" fill="#3c5e2e">中段</text>
    <path d="M 384 146 L 384 158 L 516 158" stroke="#446688" stroke-width="1.3" fill="none"/>
    <text x="446" y="174" text-anchor="middle" font-size="10.5" fill="#2f4a66">前缀：−2</text>
    <path d="M 554 146 L 554 158 L 720 158" stroke="#d6a040" stroke-width="1.3" fill="none"/>
    <text x="640" y="174" text-anchor="middle" font-size="10.5" fill="#8a6520">后缀：+2</text>
  </g>

  <g filter="url(#rough2)">
    <text x="404" y="196" font-size="11" fill="#55606e">加 |f(v)| 后</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="384" y="204" width="30" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="399" y="222" text-anchor="middle" font-size="10.5" fill="#2f4a66">−8</text>
    <rect x="418" y="204" width="30" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="433" y="222" text-anchor="middle" font-size="10.5" fill="#2f4a66">−5</text>
    <rect x="452" y="204" width="30" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="467" y="222" text-anchor="middle" font-size="10.5" fill="#2f4a66">−3</text>
    <rect x="486" y="204" width="30" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="501" y="222" text-anchor="middle" font-size="10.5" fill="#2f4a66">−2</text>
    <rect x="520" y="204" width="30" height="26" rx="4" fill="#eef7f0" stroke="#4a7a3a" stroke-width="2"/>
    <text x="535" y="222" text-anchor="middle" font-size="10.5" fill="#3c5e2e">2</text>
    <rect x="554" y="204" width="30" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="569" y="222" text-anchor="middle" font-size="10.5" fill="#8a6520">7</text>
    <rect x="588" y="204" width="30" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="603" y="222" text-anchor="middle" font-size="10.5" fill="#8a6520">10</text>
    <rect x="622" y="204" width="30" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="637" y="222" text-anchor="middle" font-size="10.5" fill="#8a6520">13</text>
    <rect x="656" y="204" width="30" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="671" y="222" text-anchor="middle" font-size="10.5" fill="#8a6520">16</text>
    <rect x="690" y="204" width="30" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="705" y="222" text-anchor="middle" font-size="10.5" fill="#8a6520">22</text>
  </g>

  <g filter="url(#rough2)">
    <text x="553" y="252" text-anchor="middle" font-size="11.5" fill="#2f4a66">k1 = clamp(A − lo, 0, ninc)　A = ⌊(S+1)/2⌋</text>
    <text x="553" y="272" text-anchor="middle" font-size="11.5" fill="#2f4a66">k2 = clamp(B − lo, 0, ninc)　B = ⌈(S+1)/2⌉</text>
    <text x="553" y="294" text-anchor="middle" font-size="11" fill="#3c5e2e">p ≤ A ⇒ k = (S+1) − 2p ∈ {0, 1}：正侧顶端 ⇒ 便宜 2</text>
    <text x="553" y="312" text-anchor="middle" font-size="11" fill="#8f3a36">p ≥ B+1 ⇒ k ∈ {−2, −1}：负侧顶端 ⇒ 贵 2</text>
    <text x="553" y="334" text-anchor="middle" font-size="11" fill="#55606e">ninc = hi − lo：窗口越宽，能自由调整的步数越多</text>
    <text x="553" y="352" text-anchor="middle" font-size="11" fill="#55606e">lo/hi 由子结点的 lo/hi 直接相加再各挪一格得到</text>
  </g>

  <rect x="16" y="374" width="728" height="42" rx="9" fill="#eef7f0" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <text x="380" y="393" text-anchor="middle" font-size="12" font-weight="bold" fill="#3c5e2e">难点只在「按名次切分 + 整段加常数 + 求并」：用带 lazy 与子树大小的随机 treap，O(n log n)</text>
    <text x="380" y="409" text-anchor="middle" font-size="11" fill="#3c5e2e">键 = (增量值, 唯一编号) 打包成一个整数：保证键互不相同，treap 求并才不会被大量等值键打成一条链</text>
  </g>
</svg>
