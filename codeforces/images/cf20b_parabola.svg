<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="43"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="720" height="360" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">判别式 = 抛物线与 x 轴的交点个数</text>

  <g stroke="#c9ced6" stroke-width="1" filter="url(#rough2)">
    <line x1="30" y1="120" x2="230" y2="120"/><line x1="130" y1="66" x2="130" y2="170"/>
    <line x1="260" y1="120" x2="460" y2="120"/><line x1="360" y1="66" x2="360" y2="170"/>
    <line x1="490" y1="120" x2="690" y2="120"/><line x1="590" y1="66" x2="590" y2="170"/>
  </g>
  <!-- D>0 -->
  <path d="M55,78 Q130,196 205,78" fill="none" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <circle cx="93" cy="120" r="5" fill="#2f5223" filter="url(#rough2)"/>
  <circle cx="167" cy="120" r="5" fill="#2f5223" filter="url(#rough2)"/>
  <!-- D=0 -->
  <path d="M285,78 Q360,180 435,78" fill="none" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <circle cx="360" cy="120" r="5" fill="#8a6015" filter="url(#rough2)"/>
  <!-- D<0 -->
  <path d="M515,66 Q590,124 665,66" fill="none" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>

  <g font-size="12.5" filter="url(#rough2)" text-anchor="middle">
    <text x="130" y="200" fill="#2f5223" font-weight="bold">D &gt; 0：两个交点</text>
    <text x="130" y="220" font-size="11.5" fill="#2f5223">x = (−B ± √D)/(2A)</text>
    <text x="360" y="200" fill="#8a6015" font-weight="bold">D = 0：相切于一点</text>
    <text x="360" y="220" font-size="11.5" fill="#8a6015">x = −B/(2A)</text>
    <text x="590" y="200" fill="#8f3b37" font-weight="bold">D &lt; 0：没有交点</text>
    <text x="590" y="220" font-size="11.5" fill="#8f3b37">无实根，输出 0</text>
  </g>

  <rect x="50" y="256" width="620" height="84" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="66" y="280" font-size="12.5" fill="#8a6015" filter="url(#rough2)">A = 0 时不是抛物线：B = 0 变成常数方程（C=0 无穷解，否则无解）；B ≠ 0 变成直线（一个根）。</text>
  <text x="66" y="304" font-size="12.5" fill="#8a6015" filter="url(#rough2)">A ≠ 0 时，D 的符号决定交点个数；两根要按升序输出。</text>
  <text x="66" y="328" font-size="12" fill="#8a6015" filter="url(#rough2)">图中按 A &gt; 0 画；A &lt; 0 开口向下，但"交点个数由 D 的符号决定"不变。</text>
</svg>
