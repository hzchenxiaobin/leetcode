<svg xmlns="http://www.w3.org/2000/svg" width="740" height="380" viewBox="0 0 740 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="103"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="740" height="380" fill="#fafafa"/>

  <text x="370" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">区间端点移动一格：答案可以 O(1) 更新</text>
  <path d="M 148 39 Q 370 45 592 39" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="40" y="60" width="660" height="54" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="84" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">power = Σ K_s² · s，其中 K_s 是值 s 在当前区间里的出现次数</text>
  <text x="56" y="106" text-anchor="start" font-size="11.5" fill="#5b5b5b" filter="url(#rough2)">只维护 cnt[值] 与当前答案 cur，不需要别的数据结构</text>
  <rect x="40" y="130" width="320" height="96" rx="8" fill="#e9f4ec" stroke="#3f6b4a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="156" text-anchor="start" font-size="12.5" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">加入一个值 v（次数 c → c+1）</text>
  <text x="56" y="182" text-anchor="start" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">Δ = (c+1)²v − c²v</text>
  <text x="56" y="206" text-anchor="start" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">  = (2c + 1)·v</text>
  <rect x="380" y="130" width="320" height="96" rx="8" fill="#f7ecec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="396" y="156" text-anchor="start" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">删去一个值 v（次数 c → c−1）</text>
  <text x="396" y="182" text-anchor="start" font-size="13" font-weight="bold" fill="#8a3b37" filter="url(#rough2)">Δ = (c−1)²v − c²v</text>
  <text x="396" y="206" text-anchor="start" font-size="13" font-weight="bold" fill="#8a3b37" filter="url(#rough2)">  = −(2c − 1)·v</text>
  <rect x="40" y="244" width="660" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="56" y="268" text-anchor="start" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">实现技巧：把“删”写成“先 −cnt[v]，再减去 (2·cnt[v]+1)·v”，与“加”共用同一个公式。</text>
  <text x="56" y="288" text-anchor="start" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">数值范围：cnt ≤ 2·10⁵、v ≤ 10⁶，答案是 Σ K²s ≤ 10⁶·(2·10⁵)² = 4·10¹⁶，必须 64 位。</text>
  <text x="40" y="326" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">正因更新是 O(1)，莫队的“移动次数”才等于复杂度；若每次移动都要重算，整体就退化为 O(n·t)。</text>
  <text x="40" y="350" text-anchor="start" font-size="12" fill="#5b5b5b" filter="url(#rough2)">注意 power 不是可加量（去掉一个元素时 K_s² 的变化依赖当前 K_s），这正是必须用莫队的原因。</text>
</svg>
