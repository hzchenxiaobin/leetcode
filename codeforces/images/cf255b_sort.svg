<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="340" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法等价于"排序 + 消去相邻的 xy"</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">操作 1 把 yx 换成 xy（相当于冒泡），操作 2 删掉一个 xy</text>
  <text x="120" y="110" text-anchor="start" font-size="22" fill="#2b2b2b" filter="url(#rough2)">yxyxy</text>
  <line x1="140" y1="128" x2="240" y2="128" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="133" y="152" text-anchor="middle" font-size="11" fill="#b05a5a" filter="url(#rough2)">op1</text>
  <text x="250" y="110" text-anchor="start" font-size="22" fill="#2b2b2b" filter="url(#rough2)">xyyxy</text>
  <line x1="270" y1="128" x2="370" y2="128" stroke="#446688" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="263" y="152" text-anchor="middle" font-size="11" fill="#b05a5a" filter="url(#rough2)">op1</text>
  <text x="380" y="110" text-anchor="start" font-size="22" fill="#2b2b2b" filter="url(#rough2)">xyxyy</text>
  <text x="120" y="210" text-anchor="start" font-size="12.5" fill="#555555" filter="url(#rough2)">一直做 op1，最终串变成 x…xy…y（25 行：所有 x 在前、y 在后）</text>
  <text x="120" y="240" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">此后再没有 yx，只能做 op2：从左边不断删掉 "xy" 对</text>
  <text x="120" y="270" text-anchor="start" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">每删一对，x 的个数和 y 的个数各减 1 → 剩下多的那种字符</text>
  <text x="440" y="312" text-anchor="middle" font-size="13" fill="#b05a5a" filter="url(#rough2)">答案 = max(0, #x - #y) 个 x，或 max(0, #y - #x) 个 y</text>
</svg>
