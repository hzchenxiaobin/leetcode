<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="340" fill="#fafafa"/>
  <text x="380.0" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">203C：交换论证——最优解就是最便宜的 k 个</text>
  <path d="M 152.00 46 Q 380.0 52 608.00 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60" y="78" width="300" height="120" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="98" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">最优解 S，|S| = k</text>
  <text x="74" y="122" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">若 S 中某客户 u 的 w(u)</text>
  <text x="74" y="146" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">比某个没被选的 v 更贵，</text>
  <text x="74" y="170" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">就交换 u ↔ v：</text>
  <text x="74" y="194" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">总花费不增，人数不变。</text>
  <rect x="400" y="78" width="300" height="120" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="414" y="98" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">反复交换 ⇒ 存在一个最优解</text>
  <text x="414" y="122" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">恰好是 w 最小的 k 个客户</text>
  <text x="414" y="146" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">（第 k 名并列时任选都行）</text>
  <text x="414" y="170" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)"></text>
  <text x="414" y="194" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">于是答案唯一确定到“人数”</text>
  <path d="M 364 138 L 396 138" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="60" y="222" width="640" height="96" rx="9" fill="#fdeef1" stroke="#c0708a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="242" text-anchor="start" font-size="11" fill="#8a3a52" filter="url(#rough2)">边界：x_i = y_i = 0 的客户花费为 0，一定被选中（不会让前缀断掉）；</text>
  <text x="74" y="266" text-anchor="start" font-size="11" fill="#8a3a52" filter="url(#rough2)">总花费最大 10⁵ × (10⁵·10⁴ + 10⁵·10⁴) = 2×10¹⁴，必须用 64 位整数；</text>
  <text x="74" y="290" text-anchor="start" font-size="11" fill="#8a3a52" filter="url(#rough2)">0 个客户时第二行输出空行（评测只看人数与集合合法性）。</text>
</svg>
