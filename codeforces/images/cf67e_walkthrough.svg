<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两个样例：凸五边形 5 个点全可行，凹多边形 0 个可行</text>
  <path d="M 90 40 Q 360 46 630 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 样例 1 -->
  <text x="40" y="72" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">样例 1（凸）：答案 5</text>
  <g filter="url(#rough2)">
    <polygon points="60,110 200,110 230,190 200,262 60,262 30,190" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g filter="url(#rough2)">
    <circle cx="60" cy="110" r="4" fill="#b85450"/>
    <circle cx="95" cy="110" r="4" fill="#b85450"/>
    <circle cx="130" cy="110" r="4" fill="#b85450"/>
    <circle cx="165" cy="110" r="4" fill="#b85450"/>
    <circle cx="200" cy="110" r="4" fill="#b85450"/>
  </g>
  <text x="130" y="96" text-anchor="middle" font-size="10.5" fill="#8a2b28" filter="url(#rough2)">5 个整点全部在核内</text>
  <text x="130" y="286" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">凸多边形：核 = 整个多边形</text>
  <text x="130" y="306" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">围栏是边界 ⇒ 全部可见</text>

  <!-- 样例 2 -->
  <text x="400" y="72" font-size="12.5" font-weight="bold" fill="#7a4a8a" filter="url(#rough2)">样例 2（凹）：答案 0</text>
  <g filter="url(#rough2)">
    <polygon points="420,120 470,120 470,190 530,190 460,266 420,200" fill="#f4f0fa" stroke="#7a4a8a" stroke-width="1.8"/>
  </g>
  <g filter="url(#rough2)">
    <circle cx="420" cy="120" r="4" fill="#b85450"/>
    <circle cx="470" cy="120" r="4" fill="#b85450"/>
  </g>
  <!-- 阻挡边 -->
  <line x1="470" y1="190" x2="530" y2="190" stroke="#b85450" stroke-width="3" filter="url(#rough2)"/>
  <text x="500" y="182" text-anchor="middle" font-size="10.5" fill="#8a2b28" filter="url(#rough2)">这条边要求 y ≤ 4</text>
  <text x="445" y="286" text-anchor="middle" font-size="11" fill="#5a3a6a" filter="url(#rough2)">围栏在 y=8，直接违反</text>
  <text x="445" y="306" text-anchor="middle" font-size="11" fill="#5a3a6a" filter="url(#rough2)">区间清空 ⇒ 0</text>

  <!-- 自造：部分可行 -->
  <g filter="url(#rough2)">
    <rect x="40" y="324" width="640" height="60" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="56" y="348" font-size="12" font-weight="bold" fill="#7a5a1b" filter="url(#rough2)">自造：(0,10)-(10,10)-(10,4)-(6,4)-(6,9)-(0,9)</text>
  <text x="56" y="370" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">边 (6,4)-(6,9) 要求 x ≥ 6，边 (6,9)-(0,9) 要求 y ≥ 9 ⇒ 核与围栏的交是 x = 6..10，答案 5（部分可行）</text>
</svg>
