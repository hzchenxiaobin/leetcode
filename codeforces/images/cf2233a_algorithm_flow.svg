<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="430" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：两条分支各算一遍，取较小值</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每组数据只有常数次四则运算，O(1)</text>

  <g filter="url(#rough2)">
    <rect x="190" y="58" width="200" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="290" y="78" text-anchor="middle" font-size="11" fill="#33445c">读入 n, x, y, z</text>
  </g>
  <path d="M 290 88 L 290 104" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="110" y="106" width="360" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="290" y="126" text-anchor="middle" font-size="11" fill="#3a5a30">H₁ = ceil( n / (x + y) )　// 不用 AI</text>
  </g>
  <path d="M 290 136 L 290 160" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <polygon points="290,162 440,205 290,248 140,205" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="290" y="202" text-anchor="middle" font-size="11" fill="#8a6a20">x·z ≥ n ?</text>
    <text x="290" y="220" text-anchor="middle" font-size="9" fill="#a08040">搭好之前就完工？</text>
  </g>

  <path d="M 210 232 L 152 266" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 370 232 L 428 266" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="252" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <text x="432" y="252" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <g filter="url(#rough2)">
    <rect x="20" y="268" width="240" height="74" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="34" y="290" font-size="10" fill="#3a5a30">Maxim 独自就写够了</text>
    <text x="34" y="310" font-size="10.5" fill="#3a5a30">H₂ = ceil( n / x )</text>
    <text x="34" y="330" font-size="9.5" fill="#78946a">此时 H₂ ≤ z，不必再加 z</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="320" y="268" width="240" height="74" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
    <text x="334" y="290" font-size="10" fill="#8a3a36">搭好之后两人合写</text>
    <text x="334" y="310" font-size="10" fill="#8a3a36">H₂ = z + ceil( (n − x·z) / (x + 10y) )</text>
    <text x="334" y="330" font-size="9.5" fill="#b07070">分子恒正，可以安全整除</text>
  </g>

  <path d="M 140 342 L 198 366" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 440 342 L 382 366" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="150" y="368" width="280" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8"/>
    <text x="290" y="390" text-anchor="middle" font-size="12" fill="#33445c" font-weight="bold">答案 = min( H₁ , H₂ ) → 输出</text>
  </g>
  <text x="290" y="420" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">t ≤ 100，多测之间互不影响，逐组独立计算</text>
</svg>
