<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr67b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arr67c" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>
  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两遍扫描：上坡堆高度，下坡再补齐</text>
  <path d="M 130 42 Q 360 48 590 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 链：4 个块，关系 R L L -->
  <g filter="url(#rough2)">
    <rect x="70" y="70" width="80" height="44" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7"/>
    <rect x="230" y="70" width="80" height="44" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7"/>
    <rect x="390" y="70" width="80" height="44" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7"/>
    <rect x="550" y="70" width="80" height="44" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">
    <text x="110" y="98">块 1</text>
    <text x="270" y="98">块 2</text>
    <text x="430" y="98">块 3</text>
    <text x="590" y="98">块 4</text>
  </g>
  <g font-size="15" font-weight="bold" fill="#7a4a8a" text-anchor="middle" filter="url(#rough2)">
    <text x="190" y="98">R</text>
    <text x="350" y="98">L</text>
    <text x="510" y="98">L</text>
  </g>

  <!-- 第一遍 -->
  <path d="M 80 132 Q 360 146 640 132" stroke="#b85450" stroke-width="1.7" fill="none" marker-end="url(#arr67b)" filter="url(#rough2)"/>
  <text x="60" y="126" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">第 1 遍（左 → 右，只认 R）：val = inc</text>

  <g filter="url(#rough2)">
    <rect x="70" y="150" width="80" height="40" rx="7" fill="#fde8e6" stroke="#b85450" stroke-width="1.5"/>
    <rect x="230" y="150" width="80" height="40" rx="7" fill="#fde8e6" stroke="#b85450" stroke-width="1.5"/>
    <rect x="390" y="150" width="80" height="40" rx="7" fill="#fde8e6" stroke="#b85450" stroke-width="1.5"/>
    <rect x="550" y="150" width="80" height="40" rx="7" fill="#fde8e6" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <g font-size="15" font-weight="bold" text-anchor="middle" fill="#8a2b28" filter="url(#rough2)">
    <text x="110" y="176">1</text>
    <text x="270" y="176">2</text>
    <text x="430" y="176">1</text>
    <text x="590" y="176">1</text>
  </g>
  <text x="70" y="210" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">R 处 +1，L 处归 1：只有"上坡"被堆起来了</text>

  <!-- 第二遍 -->
  <path d="M 640 240 Q 360 254 80 240" stroke="#4a7a3a" stroke-width="1.7" fill="none" marker-end="url(#arr67c)" filter="url(#rough2)"/>
  <text x="380" y="234" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">第 2 遍（右 → 左，只认 L）：val = max(inc, dec)</text>

  <g filter="url(#rough2)">
    <rect x="70" y="258" width="80" height="40" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="230" y="258" width="80" height="40" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="390" y="258" width="80" height="40" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="550" y="258" width="80" height="40" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <g font-size="15" font-weight="bold" text-anchor="middle" fill="#2f5223" filter="url(#rough2)">
    <text x="110" y="284">1</text>
    <text x="270" y="284">3</text>
    <text x="430" y="284">2</text>
    <text x="590" y="284">1</text>
  </g>
  <text x="70" y="318" font-size="11.5" fill="#2f5223" filter="url(#rough2)">块 2 从右边拿到长度 3 的下坡，于是抬到 3；块 3、4 依次是 2、1</text>

  <rect x="70" y="334" width="580" height="50" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="86" y="356" font-size="12.5" fill="#7a5a1b" filter="url(#rough2)">检验：1 &lt; 3 &gt; 2 &gt; 1 ✓ 逐点都取到了下界，所以总和最小</text>
  <text x="86" y="376" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">答案 = 1+3+2+1 = 7（按块大小展开到每个学生）</text>
</svg>
