<svg xmlns="http://www.w3.org/2000/svg" width="720" height="310" viewBox="0 0 720 310"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="p" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="310" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">给每个城市一个势 d：每条航线要求 1 ≤ d[v] − d[u] ≤ 2</text>

  <g filter="url(#rough2)">
    <circle cx="90"  cy="120" r="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="250" cy="120" r="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="410" cy="120" r="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="590" cy="120" r="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <g font-size="13" text-anchor="middle" filter="url(#rough2)">
    <text x="90"  y="125" fill="#2f4a66">1</text>
    <text x="250" y="125" fill="#2f4a66">2</text>
    <text x="410" y="125" fill="#2f4a66">3</text>
    <text x="590" y="125" fill="#2f4a66">n</text>
  </g>
  <g font-size="12" text-anchor="middle" fill="#7a4b22" filter="url(#rough2)">
    <text x="90"  y="168">d = 0</text>
    <text x="250" y="168">d = 1</text>
    <text x="410" y="168">d = 3</text>
    <text x="590" y="168">d = 4</text>
  </g>
  <g stroke="#446688" stroke-width="1.7" filter="url(#rough2)">
    <line x1="118" y1="120" x2="218" y2="120" marker-end="url(#p)"/>
    <line x1="278" y1="120" x2="378" y2="120" marker-end="url(#p)"/>
    <line x1="438" y1="120" x2="558" y2="120" marker-end="url(#p)"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#446688" filter="url(#rough2)">
    <text x="168" y="110">航程 1</text>
    <text x="328" y="110">航程 2</text>
    <text x="498" y="110">航程 1</text>
  </g>
  <g font-size="12" fill="#2f5223" filter="url(#rough2)">
    <text x="60" y="208">任意一条 1 → n 的路线都满足：</text>
    <text x="60" y="232" font-weight="bold">Σ 航程 = (d[2]−d[1]) + (d[3]−d[2]) + … + (d[n]−d[n−1]) = d[n] − d[1]</text>
    <text x="60" y="258">中间项全部抵消，只剩首尾两个势 —— 所以每条路线一样长。</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="40" y="270" width="640" height="30" rx="8" fill="#fde9d9" stroke="#b4652a" stroke-width="1.2"/>
  </g>
  <text x="360" y="290" text-anchor="middle" font-size="11.5" fill="#7a4b22" filter="url(#rough2)">反过来：若所有路线等长，取 d[v] = 某条 1→v 前缀的长度，也一定满足这个条件</text>
</svg>
