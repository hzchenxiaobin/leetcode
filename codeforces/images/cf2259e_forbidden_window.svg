<svg xmlns="http://www.w3.org/2000/svg" width="780" height="384" viewBox="0 0 780 384"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="780" height="384" fill="#fafafa"/>

  <text x="390" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">一条已知信息 b_i = d 拆成两个约束</text>
  <text x="390" y="56" text-anchor="middle" font-size="12.5" fill="#66788c" filter="url(#rough2)">以 n = 11、i = 6、d = 3 为例：窗口 (3, 9) 内禁宝，两端 3 和 9 至少一个藏宝</text>

  <!-- 上方标签 -->
  <text x="240" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">i − d = 3</text>
  <text x="390" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">i = 6</text>
  <text x="540" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">i + d = 9</text>
  <path d="M240,104 L240,130" fill="none" stroke="#4a7a3a" stroke-width="1.3"
        stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M540,104 L540,130" fill="none" stroke="#4a7a3a" stroke-width="1.3"
        stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="390" y="118" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">两端「至少一个」，不是「都」</text>

  <!-- 禁止窗口（严格内部） -->
  <rect x="264" y="126" width="252" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"
        stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="390" y="148" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">窗口内不许藏宝</text>
  <text x="390" y="167" text-anchor="middle" font-size="11" fill="#a14340" filter="url(#rough2)">对所有 0 &lt; |j − i| &lt; d 的 j</text>

  <!-- 轴与刻度 -->
  <path d="M110,152 L670,152" fill="none" stroke="#66788c" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M140,145 L140,159" fill="none" stroke="#66788c" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M190,145 L190,159" fill="none" stroke="#66788c" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M290,145 L290,159" fill="none" stroke="#66788c" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M340,145 L340,159" fill="none" stroke="#66788c" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M390,145 L390,159" fill="none" stroke="#66788c" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M440,145 L440,159" fill="none" stroke="#66788c" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M490,145 L490,159" fill="none" stroke="#66788c" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M590,145 L590,159" fill="none" stroke="#66788c" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M640,145 L640,159" fill="none" stroke="#66788c" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- 候选：两端各一个绿圈 -->
  <ellipse cx="240" cy="152" rx="27" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.3" filter="url(#rough2)"/>
  <text x="240" y="157" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">候选</text>
  <ellipse cx="540" cy="152" rx="27" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.3" filter="url(#rough2)"/>
  <text x="540" y="157" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">候选</text>

  <!-- 刻度编号 -->
  <text x="140" y="182" text-anchor="middle" font-size="10.5" fill="#66788c" filter="url(#rough2)">1</text>
  <text x="190" y="182" text-anchor="middle" font-size="10.5" fill="#66788c" filter="url(#rough2)">2</text>
  <text x="240" y="182" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">3</text>
  <text x="290" y="182" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">4</text>
  <text x="340" y="182" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">5</text>
  <text x="390" y="182" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">6</text>
  <text x="440" y="182" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">7</text>
  <text x="490" y="182" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">8</text>
  <text x="540" y="182" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">9</text>
  <text x="590" y="182" text-anchor="middle" font-size="10.5" fill="#66788c" filter="url(#rough2)">10</text>
  <text x="640" y="182" text-anchor="middle" font-size="10.5" fill="#66788c" filter="url(#rough2)">11</text>

  <!-- 禁止标记 -->
  <text x="290" y="204" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="340" y="204" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="390" y="204" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="440" y="204" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="490" y="204" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- 结论 -->
  <rect x="78" y="222" width="624" height="86" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="96" y="246" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">把所有已知信息叠加起来：</text>
  <text x="96" y="270" font-size="12" fill="#2b2b2b" filter="url(#rough2)">禁止集合 = 所有开区间 (i−d, i+d) 的并集，差分数组一遍 O(n) 求出每格是否被禁</text>
  <text x="96" y="294" font-size="12" fill="#2b2b2b" filter="url(#rough2)">再逐条检查「命中」：两端都越界、或可用候选全被禁 ⇒ 无解，输出 −1</text>

  <text x="390" y="332" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">d = 0 是特例：窗口为空，直接强制 i 藏宝</text>
  <text x="390" y="354" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">某一端越界时只剩一个候选，它被禁就整组无解</text>
  <text x="390" y="376" text-anchor="middle" font-size="11" fill="#66788c" filter="url(#rough2)">注意：命中只要求「至少一端」，两端都放反而更安全（不会破坏任何禁止条件）</text>
</svg>
