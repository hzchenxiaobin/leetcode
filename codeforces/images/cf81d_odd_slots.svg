<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="141"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="720" height="330" fill="#fafafa"/>
  <text x="360.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">把用最多的相册 A 铺在奇数位（n = 10，c = 5）</text>
  <path d="M 115.2 42 Q 360.0 48 604.8 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="360.0" y="316" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">偶数位放别的相册；尾部只剩 1 个位置</text>
  <rect x="56" y="100" width="52" height="54" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="82.0" y="134" text-anchor="middle" font-size="17" font-weight="bold" fill="#2f5223" filter="url(#rough2)">A</text>
  <text x="82.0" y="176" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">1</text>
  <rect x="116" y="100" width="52" height="54" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="142.0" y="134" text-anchor="middle" font-size="14" fill="#8a6015" filter="url(#rough2)">空</text>
  <text x="142.0" y="176" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">2</text>
  <rect x="176" y="100" width="52" height="54" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="202.0" y="134" text-anchor="middle" font-size="17" font-weight="bold" fill="#2f5223" filter="url(#rough2)">A</text>
  <text x="202.0" y="176" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">3</text>
  <rect x="236" y="100" width="52" height="54" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="262.0" y="134" text-anchor="middle" font-size="14" fill="#8a6015" filter="url(#rough2)">空</text>
  <text x="262.0" y="176" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">4</text>
  <rect x="296" y="100" width="52" height="54" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="322.0" y="134" text-anchor="middle" font-size="17" font-weight="bold" fill="#2f5223" filter="url(#rough2)">A</text>
  <text x="322.0" y="176" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">5</text>
  <rect x="356" y="100" width="52" height="54" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="382.0" y="134" text-anchor="middle" font-size="14" fill="#8a6015" filter="url(#rough2)">空</text>
  <text x="382.0" y="176" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">6</text>
  <rect x="416" y="100" width="52" height="54" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="442.0" y="134" text-anchor="middle" font-size="17" font-weight="bold" fill="#2f5223" filter="url(#rough2)">A</text>
  <text x="442.0" y="176" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">7</text>
  <rect x="476" y="100" width="52" height="54" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="502.0" y="134" text-anchor="middle" font-size="14" fill="#8a6015" filter="url(#rough2)">空</text>
  <text x="502.0" y="176" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">8</text>
  <rect x="536" y="100" width="52" height="54" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="562.0" y="134" text-anchor="middle" font-size="17" font-weight="bold" fill="#2f5223" filter="url(#rough2)">A</text>
  <text x="562.0" y="176" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">9</text>
  <rect x="596" y="100" width="52" height="54" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="622.0" y="134" text-anchor="middle" font-size="14" fill="#335478" filter="url(#rough2)">尾</text>
  <text x="622.0" y="176" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">10</text>
  <text x="360" y="82" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">位置 1, 3, 5, 7, 9 = 相册 A</text>
  <path d="M 60 196 L 640 196" stroke="#8a8a8a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="360" y="218" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">黄色 = A 之间的孤立空隙（共 c−1 = 4 个），放什么都安全</text>
  <text x="360" y="242" text-anchor="middle" font-size="12" fill="#335478" filter="url(#rough2)">蓝色 = 尾部连续 L = n−2c+1 = 1 个位置，只放非 A</text>
  <rect x="56" y="266" width="608" height="36" rx="8" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="360" y="289" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">于是“环上相邻不同”被拆成：A 互不相邻 + 空隙孤立 + 尾部排成一条线</text>
</svg>
