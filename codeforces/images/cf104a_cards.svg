<svg xmlns="http://www.w3.org/2000/svg" width="884" height="404" viewBox="0 0 884 404"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="103"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/></marker>
  </defs>
  <rect width="884" height="404" fill="#fafafa"/>
  <text x="442" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">第一张是黑桃 Q（10 点）：数剩下的 51 张</text>
  <text x="442" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">能补出 need = n − 10 的牌有多少张</text>
  <g filter="url(#rough2)"><rect x="90" y="92" width="240" height="42" rx="3" fill="#f6e3c4" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="210" y="119" text-anchor="middle" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">2 … 9</text>
  <g filter="url(#rough2)"><rect x="350" y="92" width="120" height="42" rx="3" fill="#ffffff" fill-opacity="0.9" stroke="#99aabb" stroke-width="1.2"/></g>
  <text x="410" y="119" text-anchor="middle" font-size="12" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">4 张</text>
  <text x="490" y="119" text-anchor="start" font-size="11" fill="#555555" filter="url(#rough2)">每张 = 面值</text>
  <g filter="url(#rough2)"><rect x="90" y="148" width="240" height="42" rx="3" fill="#d7ecd0" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="210" y="175" text-anchor="middle" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">10, J, Q, K</text>
  <g filter="url(#rough2)"><rect x="350" y="148" width="120" height="42" rx="3" fill="#ffffff" fill-opacity="0.9" stroke="#99aabb" stroke-width="1.2"/></g>
  <text x="410" y="175" text-anchor="middle" font-size="12" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">16 张</text>
  <text x="490" y="175" text-anchor="start" font-size="11" fill="#555555" filter="url(#rough2)">都是 10 点</text>
  <g filter="url(#rough2)"><rect x="90" y="204" width="240" height="42" rx="3" fill="#cfe0f5" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="210" y="231" text-anchor="middle" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">A（当 1）</text>
  <g filter="url(#rough2)"><rect x="350" y="204" width="120" height="42" rx="3" fill="#ffffff" fill-opacity="0.9" stroke="#99aabb" stroke-width="1.2"/></g>
  <text x="410" y="231" text-anchor="middle" font-size="12" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">4 张</text>
  <text x="490" y="231" text-anchor="start" font-size="11" fill="#555555" filter="url(#rough2)">1 点</text>
  <g filter="url(#rough2)"><rect x="90" y="260" width="240" height="42" rx="3" fill="#f6d9d7" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="210" y="287" text-anchor="middle" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">A（当 11）</text>
  <g filter="url(#rough2)"><rect x="350" y="260" width="120" height="42" rx="3" fill="#ffffff" fill-opacity="0.9" stroke="#99aabb" stroke-width="1.2"/></g>
  <text x="410" y="287" text-anchor="middle" font-size="12" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">4 张</text>
  <text x="490" y="287" text-anchor="start" font-size="11" fill="#555555" filter="url(#rough2)">11 点</text>
  <text x="442" y="336" text-anchor="middle" font-size="12" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">黑桃 Q 已经用过 → 10 点的牌从 16 张减到 15 张</text>
  <text x="442" y="366" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">答案 = 能取到 need 点的牌数（need 不在 1..11 则为 0）</text>
</svg>
