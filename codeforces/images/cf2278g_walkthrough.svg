<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>

  <text filter="url(#rough2)" x="360" y="27" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：链 1—2—3，x = 100，y = 000</text>
  <text filter="url(#rough2)" x="360" y="48" text-anchor="middle" font-size="11" fill="#888">第 d 层只定 bit_d(P)；同层若有多个节点，必须给出同一个值</text>

  <g>
    <rect filter="url(#rough2)" x="20" y="62" width="440" height="126" fill="#ffffff" stroke="#8899aa" stroke-width="1.3" rx="10"/>
    <rect filter="url(#rough2)" x="36" y="76" width="418" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <text filter="url(#rough2)" x="56" y="94" text-anchor="middle" font-size="10.5" fill="#2f4f6f">d</text>
    <text filter="url(#rough2)" x="116" y="94" text-anchor="middle" font-size="10.5" fill="#2f4f6f">节点</text>
    <text filter="url(#rough2)" x="180" y="94" text-anchor="middle" font-size="10.5" fill="#2f4f6f">x_v</text>
    <text filter="url(#rough2)" x="232" y="94" text-anchor="middle" font-size="10.5" fill="#2f4f6f">y_v</text>
    <text filter="url(#rough2)" x="294" y="94" text-anchor="middle" font-size="10.5" fill="#2f4f6f">t_v = x⊕y</text>
    <text filter="url(#rough2)" x="356" y="94" text-anchor="middle" font-size="10.5" fill="#2f4f6f">carry_v</text>
    <text filter="url(#rough2)" x="424" y="94" text-anchor="middle" font-size="10.5" fill="#2f4f6f">bit_d</text>

    <rect filter="url(#rough2)" x="392" y="102" width="62" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4"/>
    <line filter="url(#rough2)" x1="36" y1="102" x2="454" y2="102" stroke="#c9d4e0" stroke-width="1"/>
    <line filter="url(#rough2)" x1="36" y1="128" x2="454" y2="128" stroke="#e2e8f0" stroke-width="1"/>
    <line filter="url(#rough2)" x1="36" y1="154" x2="454" y2="154" stroke="#e2e8f0" stroke-width="1"/>
    <line filter="url(#rough2)" x1="88" y1="102" x2="88" y2="180" stroke="#e2e8f0" stroke-width="1"/>
    <line filter="url(#rough2)" x1="148" y1="102" x2="148" y2="180" stroke="#e2e8f0" stroke-width="1"/>
    <line filter="url(#rough2)" x1="210" y1="102" x2="210" y2="180" stroke="#e2e8f0" stroke-width="1"/>
    <line filter="url(#rough2)" x1="264" y1="102" x2="264" y2="180" stroke="#e2e8f0" stroke-width="1"/>
    <line filter="url(#rough2)" x1="326" y1="102" x2="326" y2="180" stroke="#e2e8f0" stroke-width="1"/>

    <text filter="url(#rough2)" x="56" y="120" text-anchor="middle" font-size="11" fill="#333">0</text>
    <text filter="url(#rough2)" x="116" y="120" text-anchor="middle" font-size="11" fill="#333">1</text>
    <text filter="url(#rough2)" x="180" y="120" text-anchor="middle" font-size="11" fill="#333">1</text>
    <text filter="url(#rough2)" x="232" y="120" text-anchor="middle" font-size="11" fill="#333">0</text>
    <text filter="url(#rough2)" x="294" y="120" text-anchor="middle" font-size="11" fill="#333">1</text>
    <text filter="url(#rough2)" x="356" y="120" text-anchor="middle" font-size="11" fill="#333">0</text>
    <text filter="url(#rough2)" x="424" y="120" text-anchor="middle" font-size="11" fill="#4a7a3a">1</text>

    <text filter="url(#rough2)" x="56" y="146" text-anchor="middle" font-size="11" fill="#333">1</text>
    <text filter="url(#rough2)" x="116" y="146" text-anchor="middle" font-size="11" fill="#333">2</text>
    <text filter="url(#rough2)" x="180" y="146" text-anchor="middle" font-size="11" fill="#333">0</text>
    <text filter="url(#rough2)" x="232" y="146" text-anchor="middle" font-size="11" fill="#333">0</text>
    <text filter="url(#rough2)" x="294" y="146" text-anchor="middle" font-size="11" fill="#333">0</text>
    <text filter="url(#rough2)" x="356" y="146" text-anchor="middle" font-size="11" fill="#b85450">1</text>
    <text filter="url(#rough2)" x="424" y="146" text-anchor="middle" font-size="11" fill="#4a7a3a">1</text>

    <text filter="url(#rough2)" x="56" y="172" text-anchor="middle" font-size="11" fill="#333">2</text>
    <text filter="url(#rough2)" x="116" y="172" text-anchor="middle" font-size="11" fill="#333">3</text>
    <text filter="url(#rough2)" x="180" y="172" text-anchor="middle" font-size="11" fill="#333">0</text>
    <text filter="url(#rough2)" x="232" y="172" text-anchor="middle" font-size="11" fill="#333">0</text>
    <text filter="url(#rough2)" x="294" y="172" text-anchor="middle" font-size="11" fill="#333">0</text>
    <text filter="url(#rough2)" x="356" y="172" text-anchor="middle" font-size="11" fill="#b85450">1</text>
    <text filter="url(#rough2)" x="424" y="172" text-anchor="middle" font-size="11" fill="#4a7a3a">1</text>
  </g>

  <g>
    <rect filter="url(#rough2)" x="20" y="200" width="440" height="140" fill="#ffffff" stroke="#8899aa" stroke-width="1.3" rx="10"/>
    <text filter="url(#rough2)" x="32" y="220" font-size="10.5" fill="#4a7a3a">P = bit₂ bit₁ bit₀ = 111₂ = 7</text>
    <text filter="url(#rough2)" x="32" y="246" font-size="10.5" fill="#333">验证：到达数 a = (7, 4, 2)，末态 (0, 0, 0)，与 y 一致</text>
    <text filter="url(#rough2)" x="32" y="272" font-size="10.5" fill="#333">第 2 个节点：a₂ = (7 + x₁) &gt;&gt; 1 = 8 &gt;&gt; 1 = 4（偶，x = 0 保持 0）</text>
    <text filter="url(#rough2)" x="32" y="298" font-size="10.5" fill="#333">第 3 个节点：a₃ = (4 + x₂) &gt;&gt; 1 = 2（偶，仍是 0）</text>
    <text filter="url(#rough2)" x="32" y="324" font-size="10.5" fill="#b85450">更小不行：P = 5 时 a₂ = 3（奇）→ 第 2 个节点末态变 1</text>
  </g>

  <g>
    <rect filter="url(#rough2)" x="488" y="62" width="214" height="186" fill="#ffffff" stroke="#8899aa" stroke-width="1.3" rx="10"/>
    <text filter="url(#rough2)" x="595" y="84" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">冲突的例子（样例 4）</text>

    <line filter="url(#rough2)" x1="595" y1="137" x2="557" y2="152" stroke="#666" stroke-width="1.4" marker-end="url(#arr)"/>
    <line filter="url(#rough2)" x1="595" y1="137" x2="633" y2="152" stroke="#666" stroke-width="1.4" marker-end="url(#arr)"/>
    <circle filter="url(#rough2)" cx="595" cy="118" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text filter="url(#rough2)" x="595" y="123" text-anchor="middle" font-size="11" fill="#2f4f6f">1</text>
    <circle filter="url(#rough2)" cx="551" cy="170" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text filter="url(#rough2)" x="551" y="175" text-anchor="middle" font-size="11" fill="#8a6a20">2</text>
    <circle filter="url(#rough2)" cx="639" cy="170" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text filter="url(#rough2)" x="639" y="175" text-anchor="middle" font-size="11" fill="#8a6a20">3</text>

    <text filter="url(#rough2)" x="595" y="206" text-anchor="middle" font-size="10" fill="#333">第 1 层两节点的 need 分别是 1 和 0</text>
    <text filter="url(#rough2)" x="595" y="228" text-anchor="middle" font-size="10" fill="#b85450">同一层不一致 ⇒ 输出 −1</text>
  </g>

  <g>
    <rect filter="url(#rough2)" x="488" y="262" width="214" height="110" fill="#ffffff" stroke="#8899aa" stroke-width="1.3" rx="10"/>
    <text filter="url(#rough2)" x="595" y="286" text-anchor="middle" font-size="10.5" fill="#446688">深层节点的条件依赖高位，</text>
    <text filter="url(#rough2)" x="595" y="308" text-anchor="middle" font-size="10.5" fill="#446688">而高位又被浅层的节点先钉死，</text>
    <text filter="url(#rough2)" x="595" y="330" text-anchor="middle" font-size="10.5" fill="#446688">所以只能从根往下逐层确定。</text>
    <text filter="url(#rough2)" x="595" y="354" text-anchor="middle" font-size="10" fill="#888">每一层都没有任何自由度</text>
  </g>
</svg>
