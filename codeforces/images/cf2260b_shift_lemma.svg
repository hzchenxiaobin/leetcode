<svg xmlns="http://www.w3.org/2000/svg" width="780" height="424" viewBox="0 0 780 424"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="780" height="424" fill="#fafafa"/>

  <text x="390" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：两边的差 d = y − x 与月份 i 无关</text>
  <path d="M 150 42 Q 390 49 630 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="390" y="66" text-anchor="middle" font-size="12.5" fill="#66788c" filter="url(#rough2)">第 i 月的 b 永远比 a 多出同一个常数 ⇒ 余数只由 d 和 a 决定</text>

  <!-- 两个量 -->
  <rect x="150" y="88" width="170" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="235" y="112" text-anchor="middle" font-size="15" fill="#2f4a66" filter="url(#rough2)">a = x + i</text>
  <text x="235" y="132" text-anchor="middle" font-size="11.5" fill="#5b7a99" filter="url(#rough2)">员工数</text>

  <rect x="460" y="88" width="170" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="545" y="112" text-anchor="middle" font-size="15" fill="#3c5e2e" filter="url(#rough2)">b = y + i</text>
  <text x="545" y="132" text-anchor="middle" font-size="11.5" fill="#5d7a4d" filter="url(#rough2)">待完成项目</text>

  <path d="M 326 117 L 452 117" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="389" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#a14340" filter="url(#rough2)">+ d</text>
  <text x="389" y="140" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">d = y − x ≥ 0</text>

  <path d="M 390 162 L 390 188" stroke="#d6a040" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 化简 -->
  <rect x="132" y="192" width="512" height="52" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.9" filter="url(#rough2)"/>
  <text x="388" y="224" text-anchor="middle" font-size="15.5" fill="#8a6015" filter="url(#rough2)">b mod a = (a + d) mod a = d mod a</text>

  <!-- 两段分类 -->
  <path d="M 250 246 L 232 276" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 526 246 L 548 276" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="92" y="278" width="278" height="74" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="231" y="302" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">a ≤ d：前缀段，逐项算</text>
  <text x="231" y="325" text-anchor="middle" font-size="11.5" fill="#8d4b48" filter="url(#rough2)">d mod a 与 a 有关，必须真的取余</text>
  <text x="231" y="343" text-anchor="middle" font-size="11" fill="#8d4b48" filter="url(#rough2)">而 a ≥ x ⇒ 这一段至多 d − x + 1 项</text>

  <rect x="412" y="278" width="278" height="74" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="551" y="302" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">a &gt; d：后缀段，恒等于 d</text>
  <text x="551" y="325" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">a 比 d 大时 d 本身就是余数</text>
  <text x="551" y="343" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">整段贡献相同，乘法一次算完</text>

  <text x="391" y="384" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">a = x + i 单调递增 ⇒ 前缀段之后，余数被「钉死」在 d 上</text>
  <text x="391" y="406" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">于是 O(k) 的求和塌缩成 O(d) 的枚举 + 一次乘法</text>
</svg>
