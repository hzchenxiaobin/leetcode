<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="113"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="380" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">E：轮转法给 K_n 的边染色（n = 6 为例）</text>
  <path d="M 130 42 Q 380 47 630 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <circle cx="240" cy="215" r="115" fill="none" stroke="#ccc" stroke-width="1.2" stroke-dasharray="5 5" filter="url(#rough2)"/>

  <!-- 第 0 轮的三个配对 -->
  <line x1="240" y1="215" x2="240" y2="100" stroke="#b85450" stroke-width="2.6" filter="url(#rough2)"/>
  <line x1="349" y1="180" x2="131" y2="180" stroke="#4a7a3a" stroke-width="2.6" filter="url(#rough2)"/>
  <line x1="308" y1="308" x2="172" y2="308" stroke="#446688" stroke-width="2.6" filter="url(#rough2)"/>

  <!-- 顶点 -->
  <circle cx="240" cy="100" r="17" fill="#ffffff" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="240" y="106" text-anchor="middle" font-size="14" fill="#8c3a36" filter="url(#rough2)">0</text>
  <circle cx="349" cy="180" r="17" fill="#ffffff" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="349" y="186" text-anchor="middle" font-size="14" fill="#2f5223" filter="url(#rough2)">1</text>
  <circle cx="308" cy="308" r="17" fill="#ffffff" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="308" y="314" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">2</text>
  <circle cx="172" cy="308" r="17" fill="#ffffff" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="172" y="314" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">3</text>
  <circle cx="131" cy="180" r="17" fill="#ffffff" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="131" y="186" text-anchor="middle" font-size="14" fill="#2f5223" filter="url(#rough2)">4</text>
  <circle cx="240" cy="215" r="19" fill="#fff3cd" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="240" y="221" text-anchor="middle" font-size="14" fill="#8a6015" filter="url(#rough2)">5</text>

  <text x="240" y="352" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">0..4 绕成圆圈，5 放在圆心</text>

  <text x="430" y="92" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">第 r 轮（r = 0, 1, …, n-2）</text>
  <text x="430" y="118" font-size="11.5" fill="#8c3a36" filter="url(#rough2)">① 圆心 5 与圆上的点 r 配对</text>
  <text x="430" y="142" font-size="11.5" fill="#2f5223" filter="url(#rough2)">② 其余点按 (r+t) 与 (r−t) 配对</text>
  <text x="430" y="166" font-size="11.5" fill="#2f5223" filter="url(#rough2)">　 t = 1, 2, …, (n-2)/2（模 n-1）</text>
  <text x="430" y="192" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">③ 这一轮用颜色 r+1 给这些边染色</text>

  <rect x="430" y="206" width="300" height="80" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="442" y="230" font-size="11" fill="#2f5223" filter="url(#rough2)">每一轮恰好 n/2 条边、两两不共端点</text>
  <text x="442" y="252" font-size="11" fill="#2f5223" filter="url(#rough2)">= 完全图 K_n 的一个完美匹配；</text>
  <text x="442" y="274" font-size="11" fill="#2f5223" filter="url(#rough2)">n-1 轮就覆盖 K_n 的全部 C(n,2) 条边。</text>

  <rect x="430" y="298" width="300" height="58" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="442" y="322" font-size="11" fill="#8a6015" filter="url(#rough2)">于是每个顶点在每轮恰好接一条边，</text>
  <text x="442" y="344" font-size="11" fill="#8a6015" filter="url(#rough2)">n-1 轮下来每行颜色各不相同。</text>

</svg>
