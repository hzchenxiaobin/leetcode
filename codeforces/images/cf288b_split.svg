<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="431"/>
    <feDisplacementMap in="SourceGraphic" scale="1.5"/></filter></defs>
  <rect width="700" height="300" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">前 k 个点必须都能走到 1；后 n−k 个永远不能到 1</text>
  <path d="M 120 40 Q 350 46 580 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="270" height="60" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.4"/></g>
  <text x="195" y="84" text-anchor="middle" font-size="13" fill="#22314a" filter="url(#rough2)">[1..k]</text>
  <text x="195" y="106" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">全都能走到 1，且 1 在环上</text>
  <g filter="url(#rough2)"><rect x="370" y="58" width="270" height="60" rx="8" fill="#fbeeee" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="505" y="84" text-anchor="middle" font-size="13" fill="#8a3a36" filter="url(#rough2)">[k+1..n]</text>
  <text x="505" y="106" text-anchor="middle" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">永远到不了 1</text>
  <g filter="url(#rough2)"><rect x="60" y="130" width="580" height="66" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="154" font-size="12.5" fill="#2f5223" filter="url(#rough2)">后段：每个点只能指向后段（否则就能到 1）⇒ 各有 (n−k) 种选择 ⇒ (n−k)^(n−k)。</text>
  <text x="76" y="178" font-size="12.5" fill="#2f5222" filter="url(#rough2)">前段：函数图限制在 [1..k] 内，所有点走向 1、且 1 在环上 ⇒ 共 k^(k−1) 种（经典结论）。</text>
  <g filter="url(#rough2)"><rect x="60" y="208" width="580" height="60" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="76" y="232" font-size="12.5" fill="#8a6015" filter="url(#rough2)">答案 = k^(k−1) · (n−k)^(n−k) mod 1e9+7</text>
  <text x="76" y="254" font-size="12.5" fill="#8a6015" filter="url(#rough2)">样例 n=5,k=2：2¹·3³ = 54 ✓；n=7,k=4：4³·3³ = 64·27 = 1728 ✓</text>
</svg>
