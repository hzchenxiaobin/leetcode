<svg xmlns="http://www.w3.org/2000/svg" width="620" height="540" viewBox="0 0 620 540"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2b2b2b"/>
    </marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arra" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="620" height="540" fill="#fafafa"/>
  <text x="310" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2（3×3）：蛇形 9 格 + 传送 1 次</text>
  <path d="M 150 42 Q 310 48 470 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="170" y="80" width="90" height="90" rx="0" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="250" y="100" text-anchor="end" font-size="11" fill="#8a8a8a" filter="url(#rough2)">0</text>
  <text x="215.0" y="133.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#b85450" filter="url(#rough2)">首都</text>
  <rect x="260" y="80" width="90" height="90" rx="0" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="340" y="100" text-anchor="end" font-size="11" fill="#8a8a8a" filter="url(#rough2)">1</text>
  <rect x="350" y="80" width="90" height="90" rx="0" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="430" y="100" text-anchor="end" font-size="11" fill="#8a8a8a" filter="url(#rough2)">2</text>
  <rect x="170" y="170" width="90" height="90" rx="0" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="250" y="190" text-anchor="end" font-size="11" fill="#8a8a8a" filter="url(#rough2)">5</text>
  <rect x="260" y="170" width="90" height="90" rx="0" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="340" y="190" text-anchor="end" font-size="11" fill="#8a8a8a" filter="url(#rough2)">4</text>
  <rect x="350" y="170" width="90" height="90" rx="0" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="430" y="190" text-anchor="end" font-size="11" fill="#8a8a8a" filter="url(#rough2)">3</text>
  <rect x="170" y="260" width="90" height="90" rx="0" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="250" y="280" text-anchor="end" font-size="11" fill="#8a8a8a" filter="url(#rough2)">6</text>
  <rect x="260" y="260" width="90" height="90" rx="0" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="340" y="280" text-anchor="end" font-size="11" fill="#8a8a8a" filter="url(#rough2)">7</text>
  <rect x="350" y="260" width="90" height="90" rx="0" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="430" y="280" text-anchor="end" font-size="11" fill="#8a8a8a" filter="url(#rough2)">8</text>
  <line x1="215.0" y1="125.0" x2="305.0" y2="125.0" stroke="#4a7a3a" stroke-width="2.2" opacity="1.0" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <line x1="305.0" y1="125.0" x2="395.0" y2="125.0" stroke="#4a7a3a" stroke-width="2.2" opacity="1.0" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <line x1="395.0" y1="125.0" x2="395.0" y2="215.0" stroke="#4a7a3a" stroke-width="2.2" opacity="1.0" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <line x1="395.0" y1="215.0" x2="305.0" y2="215.0" stroke="#4a7a3a" stroke-width="2.2" opacity="1.0" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <line x1="305.0" y1="215.0" x2="215.0" y2="215.0" stroke="#4a7a3a" stroke-width="2.2" opacity="1.0" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <line x1="215.0" y1="215.0" x2="215.0" y2="305.0" stroke="#4a7a3a" stroke-width="2.2" opacity="1.0" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <line x1="215.0" y1="305.0" x2="305.0" y2="305.0" stroke="#4a7a3a" stroke-width="2.2" opacity="1.0" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <line x1="305.0" y1="305.0" x2="395.0" y2="305.0" stroke="#4a7a3a" stroke-width="2.2" opacity="1.0" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 395.0 305.0 L 215.0 125.0" stroke="#b85450" stroke-width="2.2" fill="none" stroke-dasharray="7 5" opacity="1.0" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="520" y="298" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">传送门</text>
  <text x="520" y="320" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">(3,3) → (1,1)</text>
  <text x="310" y="410" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">10 行坐标：(1,1) 出现两次，其余各一次；k = 1</text>
  <text x="310" y="438" text-anchor="middle" font-size="12" fill="#8a8a8a" filter="url(#rough2)">数字 = 访问顺序；蛇形最后停在 (3,3)</text>
  <text x="310" y="480" text-anchor="middle" font-size="12" fill="#8a8a8a" filter="url(#rough2)">检查：每步相邻或走传送门，覆盖全部 9 格</text>
</svg>
