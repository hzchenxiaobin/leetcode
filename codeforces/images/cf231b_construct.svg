<svg xmlns="http://www.w3.org/2000/svg" width="840" height="360" viewBox="0 0 840 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="360" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">构造：偶位和尽量大，奇位和补足差值</text>
  <text x="420" y="56" text-anchor="middle" font-size="11.8" fill="#666666" filter="url(#rough2)">样例 5 −4 4：k=3, m=2, l=4</text>
  <g filter="url(#rough2)"><rect x="120" y="96" width="280" height="80" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="260" y="124" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">偶位和 S_e = min(ml, kl−d)</text>
  <text x="260" y="152" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">= min(8, 12+4) = 8</text>
  <g filter="url(#rough2)"><rect x="440" y="96" width="280" height="80" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="580" y="124" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">奇位和 S_o = S_e + d</text>
  <text x="580" y="152" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">= 8 − 4 = 4</text>
  <g filter="url(#rough2)"><rect x="200" y="210" width="220" height="50" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="310" y="241" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">奇位 2,1,1</text>
  <g filter="url(#rough2)"><rect x="460" y="210" width="220" height="50" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="570" y="241" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">偶位 4,4</text>
  <text x="420" y="296" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">→ 2 4 1 4 1，交错和 2−4+1−4+1 = −4 ✓</text>
  <text x="420" y="328" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">每个位置先取 1，再从左往右尽量加到 l</text>
</svg>
