<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="513"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="300" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">结果只取决于 d = x₂ − x₁</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">I = [a, b] 是双方共同的一步获胜区</text>
  <g filter="url(#rough2)"><rect x="60" y="100" width="250" height="80" rx="6" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="185" y="132" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">d ∈ [a,b]</text>
  <text x="185" y="160" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">先手一步跳上去 ⇒ FIRST</text>
  <g filter="url(#rough2)"><rect x="330" y="100" width="250" height="80" rx="6" fill="#f3d9d6" fill-opacity="0.85" stroke="#8a2b28" stroke-width="1.4"/></g>
  <text x="455" y="132" text-anchor="middle" font-size="13" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">d = a + b</text>
  <text x="455" y="160" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">先手全走法都送对手进 I ⇒ SECOND</text>
  <g filter="url(#rough2)"><rect x="600" y="100" width="250" height="80" rx="6" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="725" y="132" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">其它 d</text>
  <text x="725" y="160" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">双方都能一直躲 ⇒ DRAW</text>
  <text x="450" y="214" text-anchor="middle" font-size="12" fill="#b06a1e" filter="url(#rough2)">先手新距离集合 [d−b, d−a]；它 ⊆ I ⟺ d = a+b</text>
  <text x="450" y="246" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">后手新距离集合 [d+a, d+b]；它 ⊆ I ⟺ d = 0（不会出现）</text>
</svg>
