<svg xmlns="http://www.w3.org/2000/svg" width="884" height="360" viewBox="0 0 884 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="117"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="884" height="360" fill="#fafafa"/>
  <text x="442" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">枚举目标数字 d，按代价改动</text>
  <text x="442" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">代价 = Σ|旧−新|，再取字典序最小</text>
  <g filter="url(#rough2)"><rect x="88" y="96" width="708" height="52" rx="4" fill="#d7ecd0" fill-opacity="0.45" stroke="#6a9a58" stroke-width="1.3"/></g>
  <text x="442" y="118" text-anchor="middle" font-size="11.5" fill="#3d6b2f" filter="url(#rough2)">a_i &gt; d（改小）：优先靠左，越早变小字典序越小</text>
  <g filter="url(#rough2)"><rect x="88" y="156" width="708" height="52" rx="4" fill="#f6d9d7" fill-opacity="0.45" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="442" y="178" text-anchor="middle" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">a_i &lt; d（改大）：优先靠右，越晚变大字典序越小</text>
  <text x="442" y="236" text-anchor="middle" font-size="12" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">排序键 (|a_i−d|, 类型, 方向上的位置)</text>
  <text x="442" y="268" text-anchor="middle" font-size="12" fill="#3d6b2f" filter="url(#rough2)">对 10 个 d 各求一次，取 (总代价, 结果串) 最小</text>
  <text x="442" y="306" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">O(10·n log n)，n ≤ 10⁴</text>
</svg>
