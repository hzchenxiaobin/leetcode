<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#777"/>
    </marker>
  </defs>

  <rect width="660" height="420" fill="#fafafa"/>
  <text x="330" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">p = 0 的两次操作：借一个相等的 1 与一个相等的 0 当跳板</text>
  <text x="330" y="52" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">a = [1,0,0,1,0]，b = [1,1,1,1,0]：差异位 D = {2,3}，p = 0，跳板 u=1、v=5</text>
  <text x="220" y="78" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">1</text>
  <text x="290" y="78" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">2</text>
  <text x="360" y="78" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">3</text>
  <text x="430" y="78" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">4</text>
  <text x="500" y="78" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">5</text>
  <text x="177" y="112" text-anchor="end" font-size="11.5" fill="#555" filter="url(#rough2)">初始 a</text>
  <rect x="191" y="88" width="58" height="34" fill="#e8f0fe" stroke="#888" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="220" y="111" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="261" y="88" width="58" height="34" fill="#e8f0fe" stroke="#888" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="290" y="111" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="331" y="88" width="58" height="34" fill="#e8f0fe" stroke="#888" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="360" y="111" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="401" y="88" width="58" height="34" fill="#e8f0fe" stroke="#888" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="430" y="111" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="471" y="88" width="58" height="34" fill="#e8f0fe" stroke="#888" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="500" y="111" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="177" y="162" text-anchor="end" font-size="11.5" fill="#555" filter="url(#rough2)">op1 后</text>
  <rect x="191" y="138" width="58" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="220" y="161" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="261" y="138" width="58" height="34" fill="#fff8e1" stroke="#888" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="290" y="161" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="331" y="138" width="58" height="34" fill="#fff8e1" stroke="#888" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="360" y="161" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="401" y="138" width="58" height="34" fill="#fff8e1" stroke="#888" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="430" y="161" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="471" y="138" width="58" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="500" y="161" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="177" y="212" text-anchor="end" font-size="11.5" fill="#555" filter="url(#rough2)">op2 后</text>
  <rect x="191" y="188" width="58" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="220" y="211" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="261" y="188" width="58" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="290" y="211" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="331" y="188" width="58" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="360" y="211" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="401" y="188" width="58" height="34" fill="#e6f4ea" stroke="#888" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="430" y="211" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="471" y="188" width="58" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="500" y="211" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="185" y="252" font-size="10" fill="#b85450" filter="url(#rough2)">红框 = 该步被取反的位置</text>
  <rect x="64" y="264" width="532" height="52" fill="#ffffff" stroke="#666" stroke-width="1.4" rx="9" filter="url(#rough2)"/>
  <text x="76" y="284" font-size="11" fill="#444" filter="url(#rough2)">op1 = {1,5}：此时 a_1=1、a_5=0，和 = 1（奇）✓  →  把「1」搬到 v=5</text>
  <text x="76" y="305" font-size="11" fill="#444" filter="url(#rough2)">op2 = {1,2,3,5}：此时只剩 a_5=1，和 = 1（奇）✓  →  1 复原、2 与 3 补 1、5 归零</text>
  <rect x="64" y="328" width="532" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="9" filter="url(#rough2)"/>
  <text x="76" y="349" font-size="11" fill="#3a5a30" filter="url(#rough2)">跳板 u、v 各被翻 2 次（奇偶抵消，值不变）；D 中每位被翻 1 次 ⇒ 终态 = b</text>
  <text x="76" y="370" font-size="11" fill="#3a5a30" filter="url(#rough2)">凑不齐「相等的 1 + 相等的 0」这一对跳板时，答案就是 −1</text>
</svg>
