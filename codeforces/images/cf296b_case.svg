<svg xmlns="http://www.w3.org/2000/svg" width="700" height="280" viewBox="0 0 700 280"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="613"/>
    <feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></defs>
  <rect width="700" height="280" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">为什么"处处 ≥"与"处处 ≤"的交集是"处处 ="</text>
  <path d="M 170 40 Q 350 46 530 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="66" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="12.5" fill="#22314a" filter="url(#rough2)">A∩B：每一位都满足 s_i ≥ w_i 且 s_i ≤ w_i ⇒ 每一位 s_i = w_i ✓</text>
  <text x="76" y="106" font-size="12.5" fill="#22314a" filter="url(#rough2)">所以交集恰好是 C，容斥时"减两次、加回一次"。</text>
  <g filter="url(#rough2)"><rect x="60" y="132" width="580" height="66" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="156" font-size="12.5" fill="#2f5223" filter="url(#rough2)">实现细节：逐位只枚举 ≤100 个 (x,y) 组合，n ≤ 10⁵ ⇒ 总操作 ~10⁷ 次。</text>
  <text x="76" y="180" font-size="12.5" fill="#2f5223" filter="url(#rough2)">实测 n=10⁵ 全 '?'：0.031 s。</text>
  <g filter="url(#rough2)"><rect x="60" y="206" width="580" height="52" rx="8" fill="#fbeeee" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="76" y="230" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">易错：减法后要 +MOD 再取模，C++ 负数取模会出负值。</text>
  <text x="76" y="250" font-size="12" fill="#8a3a36" filter="url(#rough2)">另：'?' 的每一位都是 10 种选择，不是 9 种（允许前导 0）。</text>
</svg>
