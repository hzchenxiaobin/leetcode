<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2b2b2b"/>
    </marker>
  </defs>

  <rect width="760" height="420" fill="#fafafa"/>
  <text x="380" y="30" text-anchor="middle" font-size="17.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例走查：前三个点是三角形，第 4 个点把它撑成正方形</text>
  <path d="M 70 40 Q 380 46 690 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 左图：三角形，比例 100px = 1 单位，原点 (110,320) -->
  <text x="270" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">前 3 次添加之后：三角形 (0,0) (2,0) (2,2)</text>
  <g filter="url(#rough2)" stroke="#d8d8d8" stroke-width="0.8">
    <line x1="110" y1="320" x2="310" y2="320"/>
    <line x1="110" y1="220" x2="310" y2="220"/>
    <line x1="110" y1="120" x2="310" y2="120"/>
    <line x1="110" y1="320" x2="110" y2="120"/>
    <line x1="210" y1="320" x2="210" y2="120"/>
    <line x1="310" y1="320" x2="310" y2="120"/>
  </g>
  <polygon points="110,320 310,320 310,120" fill="#eef2f7" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <circle cx="110" cy="320" r="4" fill="#2b2b2b"/>
    <circle cx="310" cy="320" r="4" fill="#2b2b2b"/>
    <circle cx="310" cy="120" r="4" fill="#2b2b2b"/>
    <circle cx="210" cy="320" r="5.4" fill="#2f7a3a"/>
  </g>
  <g font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">
    <text x="96" y="340">(0,0)</text>
    <text x="300" y="340">(2,0)</text>
    <text x="318" y="124">(2,2)</text>
    <text x="216" y="340" fill="#1f5226">(1,0) YES</text>
  </g>
  <text x="270" y="376" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">上链 = (0,0)→(2,2)，下链 = (0,0)→(2,0)→(2,2)</text>
  <text x="270" y="394" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">查询 (1,0)：下(1)=0，上(1)=1，0 ≤ 0 ≤ 1 → YES</text>

  <!-- 右图：正方形，原点 (470,320) -->
  <text x="600" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f5226" filter="url(#rough2)">第 4 次添加 (0,2)：正方形 [0,2]×[0,2]</text>
  <g filter="url(#rough2)" stroke="#d8d8d8" stroke-width="0.8">
    <line x1="470" y1="320" x2="670" y2="320"/>
    <line x1="470" y1="220" x2="670" y2="220"/>
    <line x1="470" y1="120" x2="670" y2="120"/>
    <line x1="470" y1="320" x2="470" y2="120"/>
    <line x1="570" y1="320" x2="570" y2="120"/>
    <line x1="670" y1="320" x2="670" y2="120"/>
  </g>
  <rect x="470" y="120" width="200" height="200" fill="#e6f4ea" stroke="#2f7a3a" stroke-width="2" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <circle cx="470" cy="320" r="4" fill="#2b2b2b"/>
    <circle cx="670" cy="320" r="4" fill="#2b2b2b"/>
    <circle cx="670" cy="120" r="4" fill="#2b2b2b"/>
    <circle cx="470" cy="120" r="5" fill="#b85450"/>
    <circle cx="570" cy="220" r="5.4" fill="#2f7a3a"/>
    <circle cx="670" cy="220" r="5.4" fill="#2f7a3a"/>
  </g>
  <g font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">
    <text x="452" y="340">(0,0)</text>
    <text x="660" y="340">(2,0)</text>
    <text x="678" y="124">(2,2)</text>
    <text x="428" y="116" fill="#8c2f2b">(0,2)</text>
    <text x="576" y="214" fill="#1f5226">(1,1) YES</text>
    <text x="676" y="214" fill="#1f5226">(2,1) YES</text>
  </g>
  <path d="M 690 250 Q 720 268 726 292" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#ar2)" filter="url(#rough2)"/>
  <text x="726" y="312" text-anchor="end" font-size="11" fill="#8c2f2b" filter="url(#rough2)">(20,−1) 在远处 → NO</text>

  <rect x="40" y="398" width="690" height="16" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="56" y="411" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">输出依次为 YES / YES / YES / NO，与官方样例一致；注意 (1,0)、(2,1) 都在边界上，必须算作 YES。</text>
</svg>
