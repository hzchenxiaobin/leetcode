<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="430" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="38" text-anchor="middle" font-size="18.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">28E：三段轨迹与落点的仿射关系</text>
  <path d="M 137 50 Q 380 56 623 50" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <line x1="50" y1="330" x2="710" y2="330" stroke="#9a9a9a" stroke-width="2.0" filter="url(#rough2)"/>
  <text x="60" y="352" text-anchor="start" font-size="11.5" fill="#8a8a8a" font-weight="normal" filter="url(#rough2)">地面 z = 0（栅栏 / 孵化器是地面上的多边形）</text>
  <path d="M 470 300 L 620 300 L 640 322 L 490 322 Z" stroke="#446688" stroke-width="2.0" fill="#e8f0fe" filter="url(#rough2)"/>
  <text x="556" y="296" text-anchor="middle" font-size="11" fill="#2f4a66" font-weight="normal" filter="url(#rough2)">孵化器（多边形）</text>
  <line x1="80" y1="90" x2="300" y2="190" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <circle cx="80" cy="90" r="5" fill="#4a7a3a" stroke="none" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="66" y="78" text-anchor="start" font-size="11.5" fill="#2f5223" font-weight="normal" filter="url(#rough2)">A（起点）</text>
  <circle cx="300" cy="190" r="5" fill="#c9801f" stroke="none" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="306" y="176" text-anchor="start" font-size="11.5" fill="#c9801f" font-weight="bold" filter="url(#rough2)">跳伞点 (t1)</text>
  <line x1="300" y1="190" x2="300" y2="250" stroke="#c9801f" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="306" y="236" text-anchor="start" font-size="11" fill="#c9801f" font-weight="normal" filter="url(#rough2)">自由落体 t2，速度 F_down</text>
  <circle cx="300" cy="250" r="5" fill="#c9801f" stroke="none" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 300 250 Q 380 300 470 306" stroke="#b6483f" stroke-width="2.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="378" y="284" text-anchor="start" font-size="11" fill="#b6483f" font-weight="normal" filter="url(#rough2)">开伞后速度 U，直到 z = 0</text>
  <circle cx="470" cy="306" r="5.5" fill="#b6483f" stroke="none" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="420" y="336" text-anchor="start" font-size="11" fill="#b6483f" font-weight="bold" filter="url(#rough2)">落点 L（必须落在多边形内或边界上）</text>
  <rect x="60" y="366" width="640" height="50" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="72" y="388" text-anchor="start" font-size="12.5" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">L(t1,t2) = A + t1·(V − (Vz/Uz)U) + t2·(−F_down/Uz)·U</text>
  <text x="72" y="408" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">⇒「L 在多边形内」在 (t1,t2) 平面上是一个凸多边形（多边形的原像）。</text>
</svg>
