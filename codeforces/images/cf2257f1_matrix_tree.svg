  <text x="688" y="304" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">T7</text>
  <rect x="712" y="288" width="32" height="24" fill="#f4f4f4" stroke="#b0b0b0" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="728" y="304" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">T8</text>
  <text x="592" y="330" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">查询 [l+1, r]：拆成 O(log n) 个结点，从左到右乘到向量上</text>
  <text x="592" y="348" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">橙色 = 被一次查询整体选中的结点</text>
  <rect x="56" y="366" width="668" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="76" y="390" font-size="12" fill="#8a6516" filter="url(#rough2)">ans = ( u_l ⊗ T_{l+1} ⊗ … ⊗ T_r )[0]，u_l[o] = s_l · ⌈ (d_l − 1 − o) / x ⌉</text>
  <text x="76" y="412" font-size="11.5" fill="#a07a20" filter="url(#rough2)">⊗ 为 min-plus 乘法：(A⊗B)[i][j] = min_k ( A[i][k] + B[k][j] )；点更新只需重算 O(log n) 个结点</text>
</svg>
