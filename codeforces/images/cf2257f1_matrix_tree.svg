  <rect x="451" y="247" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="468" y="262" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">×</text>
