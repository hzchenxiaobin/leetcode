<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 436" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="780" height="436" fill="#fafafa"/>
  <text x="390" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">一个平台 = 一张 min-plus 转移矩阵；区间查询 = 矩阵连乘</text>
  <text x="390" y="52" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">T_j[o][o'] 表示「上一出口偏移为 o」→「本平台出口偏移为 o'」的最小代价</text>
  <text x="185" y="104" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">矩阵 T_j（x = 3，d_j = 5，s_j = 7）</text>
  <text x="197" y="122" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">o'=0</text>
  <text x="251" y="122" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">o'=1</text>
  <text x="305" y="122" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">o'=2</text>
  <text x="152" y="158" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">o=0</text>
  <rect x="170" y="132" width="54" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="197" y="158" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">7</text>
  <rect x="224" y="132" width="54" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="251" y="158" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">7</text>
  <rect x="278" y="132" width="54" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="305" y="158" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <text x="152" y="200" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">o=1</text>
  <rect x="170" y="174" width="54" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="197" y="200" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">7</text>
  <rect x="224" y="174" width="54" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="251" y="200" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">7</text>
  <rect x="278" y="174" width="54" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="305" y="200" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">7</text>
  <text x="152" y="242" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">o=2</text>
  <rect x="170" y="216" width="54" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="197" y="242" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">14</text>
  <rect x="224" y="216" width="54" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="251" y="242" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">7</text>
  <rect x="278" y="216" width="54" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="305" y="242" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">7</text>
  <text x="185" y="292" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">T_j[o][o'] = s_j · ⌈ max(0, d_j − x + o − o') / x ⌉</text>
  <text x="185" y="312" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">出口必须落在平台内：o' &gt; d_j − 1 的整列记为 +∞</text>
  <text x="592" y="96" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">线段树：结点 = 一段平台矩阵的乘积</text>
  <path d="M 448 288 L 468 269" fill="none" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 488 288 L 468 269" fill="none" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
