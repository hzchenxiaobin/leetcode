  <text x="608" y="304" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">T5</text>
  <rect x="632" y="288" width="32" height="24" fill="#ffe9c9" stroke="#d6a040" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
