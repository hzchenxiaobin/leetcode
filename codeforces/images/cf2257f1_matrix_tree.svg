  <text x="628" y="262" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">×</text>
  <rect x="691" y="247" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="708" y="262" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">×</text>
  <rect x="491" y="205" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="508" y="220" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">×</text>
  <rect x="651" y="205" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="668" y="220" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">×</text>
  <rect x="571" y="163" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="588" y="178" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">×</text>
  <rect x="432" y="288" width="32" height="24" fill="#f4f4f4" stroke="#b0b0b0" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="448" y="304" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">T1</text>
  <rect x="472" y="288" width="32" height="24" fill="#f4f4f4" stroke="#b0b0b0" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="488" y="304" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">T2</text>
  <rect x="512" y="288" width="32" height="24" fill="#ffe9c9" stroke="#d6a040" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="528" y="304" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">T3</text>
  <rect x="552" y="288" width="32" height="24" fill="#ffe9c9" stroke="#d6a040" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="568" y="304" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">T4</text>
