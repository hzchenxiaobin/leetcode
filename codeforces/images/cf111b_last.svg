<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1118"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="320" fill="#fafafa"/>
  <text x="360.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">last[d]：因数 d 最近一次出现的下标</text>
  <path d="M 115.2 42 Q 360.0 48 604.8 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="360.0" y="306" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">条件 last[d] &lt; i − y_i ⇔ 最近 y_i 个数都不能被 d 整除</text>
  <line x1="60" y1="180" x2="660" y2="180" stroke="#333333" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="90" y1="174" x2="90" y2="186" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="90" y="205" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">x₁=4</text>
  <line x1="200" y1="174" x2="200" y2="186" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="200" y="205" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">x₂=3</text>
  <line x1="310" y1="174" x2="310" y2="186" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="310" y="205" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">x₃=5</text>
  <line x1="420" y1="174" x2="420" y2="186" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="420" y="205" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">x₄=6</text>
  <line x1="530" y1="174" x2="530" y2="186" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="530" y="205" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">x₅=18</text>
  <line x1="620" y1="174" x2="620" y2="186" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="620" y="205" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">x₆=?</text>
  <text x="60" y="130" text-anchor="start" font-size="12" fill="#335478" filter="url(#rough2)">询问 i=5，y=4：考察区间 [x₁..x₄]</text>
  <line x1="90" y1="150" x2="530" y2="150" stroke="#5a7fb0" stroke-width="2" stroke-dasharray="6 5" filter="url(#rough2)"/>
  <text x="310" y="140" text-anchor="middle" font-size="11" fill="#335478" filter="url(#rough2)">最近 4 个</text>
  <text x="360" y="250" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">last[1]=3, last[2]=1, last[3]=2, last[6]=4 → 都 ≥ 1 → 只有 9、18 合法</text>
  <text x="360" y="280" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">把 last 更新成 i 之后，下一次询问直接查表</text>
</svg>
