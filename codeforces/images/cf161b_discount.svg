<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="687"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="290" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">折扣额 = 含凳车最便宜商品的一半</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">让「单独一车」的都是大凳子 ⇒ 折扣最大</text>
  <g filter="url(#rough2)"><rect x="60" y="96" width="380" height="80" rx="6" fill="#dcecd2" fill-opacity="0.4" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="250" y="126" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">凳子数 s ≥ k</text>
  <text x="250" y="156" text-anchor="middle" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">最大 k−1 个凳子各自一车，其余全塞最后一车</text>
  <g filter="url(#rough2)"><rect x="480" y="96" width="380" height="80" rx="6" fill="#cfe0f5" fill-opacity="0.4" stroke="#446688" stroke-width="1.4"/></g>
  <text x="670" y="126" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">凳子数 s &lt; k</text>
  <text x="670" y="156" text-anchor="middle" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">每个凳子独占一车，铅笔填满剩余车</text>
  <text x="450" y="214" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">总价 = Σc − 折扣额之和</text>
  <text x="450" y="248" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">用两倍折扣的整数运算避免浮点误差</text>
</svg>
