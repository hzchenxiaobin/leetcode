<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="400" fill="#fafafa"/>

  <text x="380" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：Bob 必胜 ⟺ s 能切成 0* · (00|11)* · 1*</text>
  <path d="M 86 44 Q 380 51 674 44" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- ============ 上半：能切完的例子 ============ -->
  <text x="40" y="72" font-size="13" font-weight="bold" fill="#3f6b32" filter="url(#rough2)">✔ 完整切分（后手 Bob 必胜）</text>

  <!-- 格子：0 1 1 0 0 1 -->
  <rect x="40" y="86" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="113" text-anchor="middle" font-size="19" font-weight="bold" fill="#2f5223" filter="url(#rough2)">0</text>

  <rect x="88" y="86" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="108" y="113" text-anchor="middle" font-size="19" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">1</text>
  <rect x="136" y="86" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="156" y="113" text-anchor="middle" font-size="19" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">1</text>

  <rect x="184" y="86" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="204" y="113" text-anchor="middle" font-size="19" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">0</text>
  <rect x="232" y="86" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="252" y="113" text-anchor="middle" font-size="19" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">0</text>

  <rect x="280" y="86" width="40" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="113" text-anchor="middle" font-size="19" font-weight="bold" fill="#8a5a12" filter="url(#rough2)">1</text>

  <!-- 两块骨牌框 -->
  <rect x="84" y="82" width="96" height="48" rx="8" fill="none" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="7 4" filter="url(#rough2)"/>
  <rect x="180" y="82" width="96" height="48" rx="8" fill="none" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="7 4" filter="url(#rough2)"/>

  <text x="60" y="148" text-anchor="middle" font-size="12" fill="#3f6b32" filter="url(#rough2)">自由前缀</text>
  <text x="132" y="148" text-anchor="middle" font-size="12" fill="#3f6b32" filter="url(#rough2)">骨牌 11</text>
  <text x="228" y="148" text-anchor="middle" font-size="12" fill="#3f6b32" filter="url(#rough2)">骨牌 00</text>
  <text x="300" y="148" text-anchor="middle" font-size="12" fill="#8a5a12" filter="url(#rough2)">自由后缀</text>

  <text x="40" y="174" font-size="13" fill="#333" filter="url(#rough2)">0 · (11) · (00) · 1 ：每个非自由字符都落在骨牌里 ⇒ Bob 必胜</text>

  <!-- ============ 下半：切不完的例子 ============ -->
  <text x="40" y="206" font-size="13" font-weight="bold" fill="#8a2a26" filter="url(#rough2)">✘ 中间冒出奇数长度段（先手 Alice 必胜）</text>

  <rect x="40" y="220" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="247" text-anchor="middle" font-size="19" font-weight="bold" fill="#2f5223" filter="url(#rough2)">0</text>
  <rect x="88" y="220" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="108" y="247" text-anchor="middle" font-size="19" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">1</text>
  <rect x="136" y="220" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="156" y="247" text-anchor="middle" font-size="19" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">1</text>
  <rect x="184" y="220" width="40" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="204" y="247" text-anchor="middle" font-size="19" font-weight="bold" fill="#8a2a26" filter="url(#rough2)">0</text>

  <rect x="84" y="216" width="96" height="48" rx="8" fill="none" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="7 4" filter="url(#rough2)"/>
  <text x="132" y="282" text-anchor="middle" font-size="12" fill="#3f6b32" filter="url(#rough2)">骨牌 11</text>
  <text x="60" y="282" text-anchor="middle" font-size="12" fill="#3f6b32" filter="url(#rough2)">自由前缀</text>
  <text x="272" y="247" font-size="13" fill="#8a2a26" filter="url(#rough2)">← 这段 0 只有 1 个，且它不是首段</text>

  <text x="40" y="308" font-size="13" fill="#333" filter="url(#rough2)">0 · (11) · 0 ：最后那个 0 无骨牌可配 ⇒ 切不完 ⇒ Alice 必胜</text>

  <!-- ============ 底部：段版本判据 ============ -->
  <rect x="40" y="326" width="680" height="56" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="58" y="350" font-size="12.5" fill="#5a420f" filter="url(#rough2)">等价判据（按“段”）：连续相同字符为一段 ⇒ 每段长度都必须是偶数，</text>
  <text x="58" y="371" font-size="12.5" fill="#5a420f" filter="url(#rough2)">唯二例外：首段是 0 时可为奇数；末段是 1 时可为奇数。</text>
</svg>
