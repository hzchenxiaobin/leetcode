<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2：1—2—3，边权 3、4</text>
  <path d="M 215 42 Q 360 48 505 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 顶点 -->
  <g filter="url(#rough2)">
    <circle cx="120" cy="150" r="22" fill="#fde8e8" stroke="#b85450" stroke-width="2.2"/>
    <circle cx="360" cy="150" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="600" cy="150" r="22" fill="#fde8e8" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <g font-size="15" font-weight="bold" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">
    <text x="120" y="156">1</text><text x="360" y="156">2</text><text x="600" y="156">3</text>
  </g>

  <!-- 原边 -->
  <line x1="142" y1="142" x2="338" y2="142" stroke="#446688" stroke-width="2.4" filter="url(#rough2)"/>
  <line x1="382" y1="142" x2="578" y2="142" stroke="#446688" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="240" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">3</text>
  <text x="480" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">4</text>

  <!-- 补边 -->
  <path d="M 578 170 L 382 170" stroke="#b85450" stroke-width="2" stroke-dasharray="7 4" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 338 170 L 142 170" stroke="#b85450" stroke-width="2" stroke-dasharray="7 4" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="480" y="192" text-anchor="middle" font-size="11" fill="#a33a36" filter="url(#rough2)">再走一次 4</text>
  <text x="240" y="192" text-anchor="middle" font-size="11" fill="#a33a36" filter="url(#rough2)">再走一次 3</text>

  <text x="120" y="112" text-anchor="middle" font-size="10.5" fill="#a33a36" filter="url(#rough2)">度 1：奇</text>
  <text x="360" y="112" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">度 2：偶</text>
  <text x="600" y="112" text-anchor="middle" font-size="10.5" fill="#a33a36" filter="url(#rough2)">度 1：奇</text>

  <rect x="40" y="230" width="640" height="74" rx="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <g font-size="11.5" fill="#2f4a66" filter="url(#rough2)">
    <text x="56" y="258">原图边权和 = 3 + 4 = 7；奇度点集合 {1, 3}，dist(1,3) = 3 + 4 = 7。</text>
    <text x="56" y="284">补一条最短路径把 1、3 变成偶度：总代价 7 + 7 = 14。</text>
  </g>

  <rect x="40" y="320" width="640" height="80" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <g font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">
    <text x="56" y="348">走法：1 → 2 → 3 → 2 → 1，长度 3 + 4 + 4 + 3 = 14，每条边至少走一次并回到 1。</text>
    <text x="56" y="374">对照样例 1：三角形三条边各 1，所有点度数为 2（全偶），答案就是 3 + 0 = 3。</text>
    <text x="56" y="396">若图中某些边不在 1 的连通块里，则无论怎么补都走不到，输出 -1。</text>
  </g>
</svg>
