<svg xmlns="http://www.w3.org/2000/svg" width="740" height="340" viewBox="0 0 740 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="740" height="340" fill="#fafafa"/>
  <text x="370" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">先反复取 2 位，剩下的 2 / 3 / 4 / 5 位这样处理</text>

  <g filter="url(#rough2)">
    <rect x="60" y="60" width="300" height="70" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="80" y="88" font-size="13" fill="#2f4a66">剩余 rem &gt; 5：</text>
    <text x="80" y="114" font-size="13" font-weight="bold" fill="#2f4a66">取 2 位，rem −= 2</text>
    <rect x="400" y="60" width="280" height="70" rx="9" fill="#eef4ec" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="420" y="88" font-size="13" fill="#2f5223">循环结束条件：</text>
    <text x="420" y="114" font-size="13" font-weight="bold" fill="#2f5223">rem ∈ {2,3,4,5}</text>
  </g>

  <line x1="215" y1="130" x2="215" y2="156" stroke="#8a94a6" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="540" y1="130" x2="540" y2="156" stroke="#8a94a6" stroke-width="1.4" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="60" y="160" width="150" height="80" rx="9" fill="#f4f6f9" stroke="#8a94a6" stroke-width="1.4"/>
    <text x="135" y="186" text-anchor="middle" font-size="13" fill="#555">rem = 2</text>
    <text x="135" y="212" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b">2</text>
    <text x="135" y="230" text-anchor="middle" font-size="11" fill="#666">一个 2 位组</text>

    <rect x="225" y="160" width="150" height="80" rx="9" fill="#f4f6f9" stroke="#8a94a6" stroke-width="1.4"/>
    <text x="300" y="186" text-anchor="middle" font-size="13" fill="#555">rem = 3</text>
    <text x="300" y="212" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b">3</text>
    <text x="300" y="230" text-anchor="middle" font-size="11" fill="#666">一个 3 位组</text>

    <rect x="390" y="160" width="150" height="80" rx="9" fill="#f4f6f9" stroke="#8a94a6" stroke-width="1.4"/>
    <text x="465" y="186" text-anchor="middle" font-size="13" fill="#555">rem = 4</text>
    <text x="465" y="212" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b">2 + 2</text>
    <text x="465" y="230" text-anchor="middle" font-size="11" fill="#666">绝不能用 1+3</text>

    <rect x="555" y="160" width="150" height="80" rx="9" fill="#f4f6f9" stroke="#8a94a6" stroke-width="1.4"/>
    <text x="630" y="186" text-anchor="middle" font-size="13" fill="#555">rem = 5</text>
    <text x="630" y="212" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b">3 + 2</text>
    <text x="630" y="230" text-anchor="middle" font-size="11" fill="#666">不能 2+3 也行，这里选 3+2</text>
  </g>

  <rect x="60" y="264" width="640" height="56" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="76" y="288" font-size="12.5" fill="#8a6015" filter="url(#rough2)">每组长度只能是 2 或 3；这样构造保证不出现长度为 1 的组，且恰好覆盖全部 n 位。</text>
  <text x="76" y="310" font-size="12.5" fill="#8a6015" filter="url(#rough2)">答案不唯一（n = 6 时 2+2+2 与 3+3 都合法），评测器只看分组是否合法。</text>
</svg>
