<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" width="780" height="430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="1.3"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="780" height="430" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="17.6" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">官方四组样例走一遍 DP</text>
  <text x="390" y="52" text-anchor="middle" font-size="11.6" fill="#5a6a7a" filter="url(#rough2)">A = (n − L) mod 2 是「旁支点总数」的奇偶；sz 是主干每个点挂载的子树大小</text>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="40" y="72" width="700" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g font-size="12" font-weight="bold" fill="#2f4a66">
    <text x="90" y="94" text-anchor="middle" filter="url(#rough2)">样例</text>
    <text x="196" y="94" text-anchor="middle" filter="url(#rough2)">(n, x, y)</text>
    <text x="300" y="94" text-anchor="middle" filter="url(#rough2)">L / sz</text>
    <text x="432" y="94" text-anchor="middle" filter="url(#rough2)">A</text>
    <text x="512" y="94" text-anchor="middle" filter="url(#rough2)">每个缺口长度的 f(0,·)</text>
    <text x="676" y="94" text-anchor="middle" filter="url(#rough2)">输出</text>
  </g>

  <!-- 第 1 行 -->
  <g filter="url(#rough2)">
    <rect x="40" y="108" width="700" height="32" rx="6" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.2"/>
  </g>
  <text x="90" y="129" text-anchor="middle" font-size="12.4" fill="#2b2b2b" filter="url(#rough2)">①</text>
  <text x="196" y="129" text-anchor="middle" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">(3, 1, 2)</text>
  <text x="300" y="129" text-anchor="middle" font-size="11.6" fill="#8c3a37" filter="url(#rough2)">L = 2（x、y 相邻）</text>
  <text x="432" y="129" text-anchor="middle" font-size="11.6" fill="#8c3a37" filter="url(#rough2)">—</text>
  <text x="512" y="129" text-anchor="middle" font-size="11.6" fill="#8c3a37" filter="url(#rough2)">退化：答案 = n mod 2 = 1</text>
  <text x="676" y="129" text-anchor="middle" font-size="12.4" font-weight="bold" fill="#33582a" filter="url(#rough2)">1</text>

  <!-- 第 2 行 -->
  <g filter="url(#rough2)">
    <rect x="40" y="144" width="700" height="32" rx="6" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.2"/>
  </g>
  <text x="90" y="165" text-anchor="middle" font-size="12.4" fill="#2b2b2b" filter="url(#rough2)">②</text>
  <text x="196" y="165" text-anchor="middle" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">(4, 1, 4)</text>
  <text x="300" y="165" text-anchor="middle" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">L = 4，sz = 1,1,1,1</text>
  <text x="432" y="165" text-anchor="middle" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="512" y="165" text-anchor="middle" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">f=0,0 → 1</text>
  <text x="676" y="165" text-anchor="middle" font-size="12.4" font-weight="bold" fill="#33582a" filter="url(#rough2)">1</text>

  <!-- 第 3 行 -->
  <g filter="url(#rough2)">
    <rect x="40" y="180" width="700" height="32" rx="6" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.2"/>
  </g>
  <text x="90" y="201" text-anchor="middle" font-size="12.4" fill="#2b2b2b" filter="url(#rough2)">③</text>
  <text x="196" y="201" text-anchor="middle" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">(3, 1, 3)</text>
  <text x="300" y="201" text-anchor="middle" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">L = 3，sz = 1,1,1</text>
  <text x="432" y="201" text-anchor="middle" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="512" y="201" text-anchor="middle" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">边界直接 f(0,2)=cnt mod 2=0</text>
  <text x="676" y="201" text-anchor="middle" font-size="12.4" font-weight="bold" fill="#8c3a37" filter="url(#rough2)">0</text>

  <!-- 第 4 行 -->
  <g filter="url(#rough2)">
    <rect x="40" y="216" width="700" height="32" rx="6" fill="#ffffff" stroke="#cfd8e3" stroke-width="1.2"/>
  </g>
  <text x="90" y="237" text-anchor="middle" font-size="12.4" fill="#2b2b2b" filter="url(#rough2)">④</text>
  <text x="196" y="237" text-anchor="middle" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">(6, 2, 3)</text>
  <text x="300" y="237" text-anchor="middle" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">L = 3，sz = 1,4,1</text>
  <text x="432" y="237" text-anchor="middle" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="512" y="237" text-anchor="middle" font-size="11.6" fill="#2b2b2b" filter="url(#rough2)">f(0,2)=1 ⊕ (sz1−1)=1 ⊕ 1 = 0</text>
  <text x="676" y="237" text-anchor="middle" font-size="12.4" font-weight="bold" fill="#8c3a37" filter="url(#rough2)">0</text>

  <!-- 说明框 -->
  <rect x="40" y="262" width="340" height="104" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="54" y="286" font-size="12.2" font-weight="bold" fill="#8a6015" filter="url(#rough2)">样例 ② 对局复盘（L = 4 的链 1-2-3-4）</text>
  <text x="54" y="310" font-size="11.4" fill="#8a6015" filter="url(#rough2)">先手点 2：恰好 1 个黑邻居 → 得 1 分</text>
  <text x="54" y="332" font-size="11.4" fill="#8a6015" filter="url(#rough2)">后手只剩 3：两个邻居 2、4 都黑 → 0 分</text>
  <text x="54" y="354" font-size="11.4" fill="#8a6015" filter="url(#rough2)">差值 1 − 0 = 1，与 DP 一致</text>

  <rect x="400" y="262" width="340" height="104" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="414" y="286" font-size="12.2" font-weight="bold" fill="#33582a" filter="url(#rough2)">样例 ④ 的「死区」在哪</text>
  <text x="414" y="310" font-size="11.4" fill="#33582a" filter="url(#rough2)">主干 2-1-3，缺口中点 p1 = 中心点，</text>
  <text x="414" y="332" font-size="11.4" fill="#33582a" filter="url(#rough2)">它挂着的 3 个叶子就是死区（净贡献 0），</text>
  <text x="414" y="354" font-size="11.4" fill="#33582a" filter="url(#rough2)">池为 0 ⟹ 答案 0。</text>

  <text x="390" y="396" text-anchor="middle" font-size="11.4" fill="#66788c" filter="url(#rough2)">注意 ①：x 与 y 相邻时主干只有 2 个点，缺口永远不存在，全部 n−2 步都得 1 分，答案是 (n−2) mod 2 = n mod 2</text>
  <text x="390" y="416" text-anchor="middle" font-size="11.4" fill="#66788c" filter="url(#rough2)">这也解释了为什么 L = 2 必须在 DP 之前特判掉</text>
</svg>
