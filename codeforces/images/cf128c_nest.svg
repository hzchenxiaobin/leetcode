<svg xmlns="http://www.w3.org/2000/svg" width="700" height="340" viewBox="0 0 700 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1279"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="700" height="340" fill="#fafafa"/>
  <text x="350.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">嵌套 = 选 2k 条格线</text>
  <path d="M 112.0 42 Q 350.0 48 588.0 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="350.0" y="326" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">竖直 C(n−1,2k)、水平 C(m−1,2k)</text>
  <rect x="180" y="70" width="340" height="220" rx="7" fill="#f4f4f1" stroke="#b8b8b0" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="220" y="110" width="260" height="140" rx="7" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="260" y="150" width="180" height="60" rx="7" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="350" y="200" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">第 1 层</text>
  <text x="350" y="220" text-anchor="middle" font-size="11" fill="#8c2f2c" filter="url(#rough2)">第 2 层</text>
  <text x="350" y="320" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">选 2k 条内部格线后，嵌套顺序唯一确定；两维独立相乘</text>
</svg>
