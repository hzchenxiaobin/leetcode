  <text x="636" y="150" text-anchor="start" font-size="12" fill="#333" filter="url(#rough2)">每个探测器最多 2 处：</text>
  <text x="636" y="172" text-anchor="start" font-size="12" fill="#333" filter="url(#rough2)">先 0→1，再 1→0（也可能</text>
  <text x="636" y="194" text-anchor="start" font-size="12" fill="#333" filter="url(#rough2)">只翻转 1 次或 0 次）</text>
  <text x="636" y="226" text-anchor="start" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">⇒ 总翻转次数 T ≤ 2k</text>
  <text x="636" y="252" text-anchor="start" font-size="12" fill="#66788c" filter="url(#rough2)">k = 新增探测器个数</text>
  <rect x="70" y="288" width="760" height="158" rx="12" fill="#ffffff" stroke="#b9c6d6" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="92" y="318" text-anchor="start" font-size="14.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">计数下界</text>
  <text x="92" y="348" text-anchor="start" font-size="13" fill="#333333" filter="url(#rough2)">n 个位置的签名（覆盖它的探测器集合）必须两两不同 ⇒ 相邻位置签名必须不同</text>
  <text x="92" y="374" text-anchor="start" font-size="13" fill="#333333" filter="url(#rough2)">⇒ 沿 1→n 走一遍，总翻转次数 T ≥ n − 1；又 T ≤ 2k</text>
  <text x="92" y="400" text-anchor="start" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">⇒ 2k ≥ n − 1：n 为偶数时即 k ≥ n/2</text>
  <text x="92" y="428" text-anchor="start" font-size="12.5" fill="#8e3b34" filter="url(#rough2)">n 为奇数时若 k=(n−1)/2，则每位恰翻转 2 次、必回到初值 ⇒ S(1)=S(n)，矛盾 ⇒ k ≥ (n+1)/2</text>
