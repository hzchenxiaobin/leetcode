<svg xmlns="http://www.w3.org/2000/svg" width="780" height="380" viewBox="0 0 780 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="780" height="380" fill="#fafafa"/>
  <text x="390.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">dp[L][s]：总长 L、最后一块是状态 s 的方案数</text>
  <path d="M 177.35000000000008 46 Q 390.0 52 602.6499999999999 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60.0" y="70.0" width="320.0" height="110.0" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="76.0" y="96.0" text-anchor="start" font-size="11.6" font-weight="bold" fill="#446688" filter="url(#rough2)">转移</text>
  <text x="76.0" y="122.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">A[w] = Σ dp[L][s]，对 wid[s] = w</text>
  <text x="76.0" y="146.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">dp[L+len[s′]][s′] += A[ len[s′] ]</text>
  <text x="76.0" y="170.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">                      − Σ 同类型且 wid = len[s′]</text>
  <rect x="420.0" y="70.0" width="300.0" height="110.0" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="436.0" y="96.0" text-anchor="start" font-size="11.6" font-weight="bold" fill="#8a6015" filter="url(#rough2)">为什么减这一项</text>
  <text x="436.0" y="122.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">A 里包含了「上一块与下一块同类型」</text>
  <text x="436.0" y="146.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">的非法接法；每个类型最多 2 个朝向，</text>
  <text x="436.0" y="170.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">O(1) 减掉即可。</text>
  <rect x="60.0" y="200.0" width="660.0" height="54.0" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="224.0" text-anchor="start" font-size="11.2" fill="#2f5b34" filter="url(#rough2)">初值：任一状态 s 可以单独作第一块：dp[len[s]][s] += 1（首块长度任意）。</text>
  <text x="74.0" y="246.0" text-anchor="start" font-size="11.2" fill="#2f5b34" filter="url(#rough2)">答案：Σ_s dp[l][s]。复杂度 O(l · n · 2)，l ≤ 3000、n ≤ 100 ⇒ 10⁶ 量级。</text>
  <rect x="60.0" y="270.0" width="460.0" height="28.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="68.0" y="291.0" text-anchor="start" font-size="10.8" font-weight="bold" fill="#26405c" filter="url(#rough2)">样例 1</text>
  <text x="178.0" y="291.0" text-anchor="start" font-size="10.8" font-weight="bold" fill="#26405c" filter="url(#rough2)">单块 (3,2)</text>
  <text x="428.0" y="291.0" text-anchor="start" font-size="10.8" font-weight="bold" fill="#26405c" filter="url(#rough2)">→ 1</text>
  <path d="M 60.0 270.0 L 520.0 270.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="68.0" y="319.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)"></text>
  <text x="178.0" y="319.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">(1,2) 后接 (2,3)</text>
  <text x="428.0" y="319.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">→ 1</text>
  <path d="M 60.0 298.0 L 520.0 298.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="68.0" y="347.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)"></text>
  <text x="178.0" y="347.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">合计</text>
  <text x="428.0" y="347.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">→ 2</text>
  <path d="M 60.0 326.0 L 520.0 326.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
</svg>
