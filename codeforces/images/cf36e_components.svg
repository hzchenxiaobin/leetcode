<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="720" height="430" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按连通块与奇度点数分类</text>
  <path d="M 170 40 Q 360 46 550 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- A -->
  <rect x="20" y="62" width="215" height="250" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="127" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">1 块 + 4 奇度</text>
  <g stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)">
    <line x1="60" y1="140" x2="130" y2="180"/><line x1="130" y1="180" x2="190" y2="140"/>
    <line x1="60" y1="140" x2="80" y2="220"/><line x1="190" y1="140" x2="180" y2="220"/>
    <line x1="80" y1="220" x2="180" y2="220"/>
  </g>
  <g filter="url(#rough2)">
    <circle cx="60" cy="140" r="10" fill="#fde8e8" stroke="#b85450" stroke-width="1.8"/>
    <circle cx="190" cy="140" r="10" fill="#fde8e8" stroke="#b85450" stroke-width="1.8"/>
    <circle cx="80" cy="220" r="10" fill="#fde8e8" stroke="#b85450" stroke-width="1.8"/>
    <circle cx="180" cy="220" r="10" fill="#fde8e8" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="127" y="252" text-anchor="middle" font-size="10.5" fill="#2f5223" filter="url(#rough2)">加假边 → 欧拉迹</text>
  <text x="127" y="272" text-anchor="middle" font-size="10.5" fill="#2f5223" filter="url(#rough2)">删假边 → 两条路径 ✓</text>
  <text x="127" y="296" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">总奇度 ≤ 4</text>

  <!-- B -->
  <rect x="250" y="62" width="215" height="250" rx="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="357" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">2 块，各 0/2 奇度</text>
  <g stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)">
    <line x1="285" y1="140" x2="330" y2="180"/><line x1="330" y1="180" x2="300" y2="220"/>
    <line x1="330" y1="180" x2="390" y2="180"/><line x1="390" y1="180" x2="420" y2="220"/>
  </g>
  <g filter="url(#rough2)">
    <circle cx="285" cy="140" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <circle cx="300" cy="220" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <circle cx="330" cy="180" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <circle cx="390" cy="180" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <circle cx="420" cy="220" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="357" y="252" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">每个块单独求欧拉迹</text>
  <text x="357" y="272" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">一块一条路径 ✓</text>
  <text x="357" y="296" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">路径不能跨块</text>

  <!-- C -->
  <rect x="480" y="62" width="220" height="250" rx="12" fill="#fde8e8" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="590" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#a33a36" filter="url(#rough2)">2 块，一块 4 奇度</text>
  <g stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)">
    <line x1="515" y1="140" x2="560" y2="180"/><line x1="560" y1="180" x2="530" y2="220"/>
    <line x1="560" y1="180" x2="620" y2="180"/><line x1="620" y1="180" x2="650" y2="220"/>
  </g>
  <g filter="url(#rough2)">
    <circle cx="515" cy="140" r="9" fill="#fde8e8" stroke="#b85450" stroke-width="1.8"/>
    <circle cx="530" cy="220" r="9" fill="#fde8e8" stroke="#b85450" stroke-width="1.8"/>
    <circle cx="560" cy="180" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <circle cx="620" cy="180" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <circle cx="650" cy="220" r="9" fill="#fde8e8" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="590" y="252" text-anchor="middle" font-size="10.5" fill="#8a3b38" filter="url(#rough2)">4 奇度块无法由一条路径覆盖</text>
  <text x="590" y="272" text-anchor="middle" font-size="10.5" fill="#8a3b38" filter="url(#rough2)">另一块又必须单独一条</text>
  <text x="590" y="296" text-anchor="middle" font-size="11" font-weight="bold" fill="#a33a36" filter="url(#rough2)">输出 -1 ✗</text>

  <rect x="40" y="330" width="640" height="70" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <g font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">
    <text x="56" y="356">必要条件：m ≥ 2；含边连通块 ≤ 2；总奇度点数 ≤ 4；两个块时每块奇度点数 ≤ 2。</text>
    <text x="56" y="382">满足后按 A/B 构造；否则输出 -1。每条路径都必须非空，且每张纸条恰好使用一次。</text>
  </g>
</svg>
