<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" viewBox="0 0 860 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="860" height="470" fill="#fafafa"/>

  <text x="430" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">交换子 R·D·R⁻¹·D⁻¹ 只轮换三个格子</text>
  <text x="430" y="56" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">R = 第 2 行右移，D = 第 3 列下移（行列下标从 0 开始）</text>

  <!-- 6x6 网格 -->
  <g filter="url(#rough2)">
    <rect x="252" y="80" width="52" height="312" fill="#f6e3c4" fill-opacity="0.55"/>
    <rect x="120" y="184" width="312" height="52" fill="#cfe0f5" fill-opacity="0.55"/>
    <rect x="120" y="80" width="312" height="312" fill="none" stroke="#444444" stroke-width="1.8"/>
    <g stroke="#bbbbbb" stroke-width="1.2">
      <line x1="172" y1="80" x2="172" y2="392"/>
      <line x1="224" y1="80" x2="224" y2="392"/>
      <line x1="276" y1="80" x2="276" y2="392"/>
      <line x1="328" y1="80" x2="328" y2="392"/>
      <line x1="380" y1="80" x2="380" y2="392"/>
      <line x1="120" y1="132" x2="432" y2="132"/>
      <line x1="120" y1="236" x2="432" y2="236"/>
      <line x1="120" y1="288" x2="432" y2="288"/>
      <line x1="120" y1="340" x2="432" y2="340"/>
    </g>

    <!-- 三个格子 -->
    <rect x="276" y="184" width="52" height="52" fill="#b9dcae" fill-opacity="0.75" stroke="#3d6b2f" stroke-width="2"/>
    <rect x="224" y="184" width="52" height="52" fill="#cfe0f5" fill-opacity="0.9" stroke="#446688" stroke-width="2"/>
    <rect x="276" y="132" width="52" height="52" fill="#f6d9d7" fill-opacity="0.9" stroke="#b85450" stroke-width="2"/>

    <text x="302" y="216" text-anchor="middle" font-size="10.5" fill="#2f5223">角 (2,3)</text>
    <text x="250" y="216" text-anchor="middle" font-size="10.5" fill="#2f4a66">(2,2)</text>
    <text x="302" y="164" text-anchor="middle" font-size="10.5" fill="#8a2b28">(1,3)</text>

    <!-- 轮换箭头 -->
    <path d="M 290 210 L 268 210" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)"/>
    <path d="M 290 194 Q 290 172 286 166" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrg)"/>
    <path d="M 284 160 Q 268 160 262 176" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrg)"/>

    <text x="440" y="214" font-size="11" fill="#2f4a66">角 → 左邻</text>
    <text x="440" y="164" font-size="11" fill="#8a2b28">左邻 → 上邻（经竖直臂）</text>
    <text x="440" y="186" font-size="11" fill="#2f5223">上邻 → 角</text>

    <text x="128" y="176" font-size="10.5" fill="#8a6015">第 2 行（R 作用）</text>
    <text x="310" y="78" text-anchor="middle" font-size="10.5" fill="#8a6015">第 3 列（D 作用）</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="120" y="408" width="620" height="44" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="136" y="436" font-size="11.5" fill="#8a6015">其余 33 个格子在 R、D、R⁻¹、D⁻¹ 的往返中互相抵消，完全复原——这就是"只动 3 格"的搬运工具。</text>
  </g>
</svg>
