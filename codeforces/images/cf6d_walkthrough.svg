<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2 走查：n = 4, a = 3, b = 1，最少 4 发</text>
  <path d="M 150 44 Q 360 50 570 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 四发火球 -->
  <circle cx="262" cy="62" r="15" fill="#fde8e8" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="312" cy="62" r="15" fill="#fde8e8" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="407" cy="62" r="15" fill="#fde8e8" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="457" cy="62" r="15" fill="#fde8e8" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <g font-size="13" font-weight="bold" fill="#a33a36" text-anchor="middle" filter="url(#rough2)">
    <text x="262" y="67">2</text><text x="312" y="67">2</text>
    <text x="407" y="67">3</text><text x="457" y="67">3</text>
  </g>
  <g stroke="#b85450" stroke-width="1.4" filter="url(#rough2)">
    <path d="M 262 78 L 270 96" marker-end="url(#arrr)"/>
    <path d="M 312 78 L 304 96" marker-end="url(#arrr)"/>
    <path d="M 407 78 L 415 96" marker-end="url(#arrr)"/>
    <path d="M 457 78 L 449 96" marker-end="url(#arrr)"/>
  </g>

  <!-- 四个弓箭手 -->
  <g filter="url(#rough2)">
    <rect x="92" y="100" width="100" height="70" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="237" y="100" width="100" height="70" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="382" y="100" width="100" height="70" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="527" y="100" width="100" height="70" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g font-size="12" fill="#777" text-anchor="middle" filter="url(#rough2)">
    <text x="142" y="118">1</text><text x="287" y="118">2</text><text x="432" y="118">3</text><text x="577" y="118">4</text>
  </g>
  <g font-size="21" font-weight="bold" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">
    <text x="142" y="152">1</text><text x="287" y="152">4</text><text x="432" y="152">1</text><text x="577" y="152">1</text>
  </g>

  <g font-size="11.5" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">
    <text x="142" y="194">受 2 点</text><text x="287" y="194">受 8 点</text>
    <text x="432" y="194">受 8 点</text><text x="577" y="194">受 2 点</text>
    <text x="142" y="214" fill="#a33a36">剩 −1</text><text x="287" y="214" fill="#a33a36">剩 −4</text>
    <text x="432" y="214" fill="#a33a36">剩 −7</text><text x="577" y="214" fill="#a33a36">剩 −1</text>
  </g>

  <rect x="40" y="240" width="640" height="142" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <g font-size="12" fill="#7a5a1b" filter="url(#rough2)">
    <text x="56" y="268">3 发不够：1 号位需 x ≥ 1 发打在 2 上，4 号位需 y ≥ 1 发打在 3 上。</text>
    <text x="56" y="292">2 号位血 4：需 3x + y ≥ 5。</text>
    <text x="56" y="316">x = 1 → y ≥ 2、共 3 发，但 1 号位只受 1 点（需 2）→ 不死。</text>
    <text x="56" y="340">x = 2 → y ≤ 1，4 号位只受 1 点（需 2）→ 不死。故最少 4 发。</text>
    <text x="56" y="364">4 发：2 号位 2 发 + 3 号位 2 发，四人受伤 2 / 8 / 8 / 2，全部 &lt; 0。</text>
  </g>
</svg>
