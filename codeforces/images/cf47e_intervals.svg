<svg xmlns="http://www.w3.org/2000/svg" width="760" height="352" viewBox="0 0 760 352"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="509"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="352" fill="#fafafa"/>

  <text x="380" y="28" text-anchor="middle" font-size="17.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">E：把“撞这堵墙”翻译成 tanα 的一个区间</text>
  <path d="M 130 38 Q 380 43 630 38" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <text x="50" y="66" font-size="11" fill="#555" filter="url(#rough2)">固定一堵墙 (x, y_w)，令 u = tanα、c = g x²/(2V²)：</text>

  <line x1="60" y1="150" x2="700" y2="150" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="60" y="170" font-size="9.5" fill="#777" filter="url(#rough2)">0</text>
  <text x="700" y="170" font-size="9.5" fill="#777" filter="url(#rough2)">1</text>
  <text x="712" y="150" font-size="9.5" fill="#777" filter="url(#rough2)">u</text>

  <!-- 0<=y 区间 -->
  <rect x="180" y="120" width="380" height="60" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="370" y="112" text-anchor="middle" font-size="10" fill="#2f5223" filter="url(#rough2)">y ≥ 0：u ∈ [ua, ub]（球还在空中）</text>

  <!-- y<=yw 的两段 -->
  <rect x="180" y="196" width="120" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="240" y="262" text-anchor="middle" font-size="10" fill="#8a6015" filter="url(#rough2)">y ≤ y_w（低角度）</text>
  <rect x="470" y="196" width="90" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="515" y="262" text-anchor="middle" font-size="10" fill="#8a6015" filter="url(#rough2)">y ≤ y_w（高角度）</text>

  <rect x="180" y="280" width="120" height="30" rx="6" fill="#fdeceb" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="240" y="300" text-anchor="middle" font-size="10" fill="#8c3a36" filter="url(#rough2)">撞墙区间 1</text>
  <rect x="470" y="280" width="90" height="30" rx="6" fill="#fdeceb" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="515" y="300" text-anchor="middle" font-size="10" fill="#8c3a36" filter="url(#rough2)">撞墙区间 2</text>

  <text x="330" y="212" font-size="10" fill="#777" filter="url(#rough2)">中间这段：球飞得比墙高，直接越过</text>

  <rect x="60" y="318" width="640" height="18" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="380" y="331" text-anchor="middle" font-size="9.5" fill="#2f4a66" filter="url(#rough2)">两个方程都是关于 u 的二次式：c·u² − x·u + c ≤ 0 与 c·u² − x·u + (y_w+c) ≥ 0，解出根即可</text>
</svg>
