<svg xmlns="http://www.w3.org/2000/svg" width="760" height="434" viewBox="0 0 760 434"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="760" height="434" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：把位移直接取成 (0, R) 就够了</text>
  <path d="M 168 42 Q 380 49 592 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 网格 -->
  <g stroke="#e2e6ea" stroke-width="1" filter="url(#rough2)">
    <path d="M 184 135 L 184 375 M 208 135 L 208 375 M 232 135 L 232 375 M 256 135 L 256 375
             M 304 135 L 304 375 M 328 135 L 328 375 M 352 135 L 352 375 M 376 135 L 376 375"/>
    <path d="M 160 159 L 400 159 M 160 183 L 400 183 M 160 207 L 400 207 M 160 231 L 400 231
             M 160 279 L 400 279 M 160 303 L 400 303 M 160 327 L 400 327 M 160 351 L 400 351"/>
  </g>

  <!-- 坐标轴 -->
  <path d="M 148 255 L 412 255" stroke="#8a8a8a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 387 L 280 123" stroke="#8a8a8a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="404" y="274" font-size="11.5" fill="#8a8a8a" filter="url(#rough2)">x</text>
  <text x="288" y="130" font-size="11.5" fill="#8a8a8a" filter="url(#rough2)">y</text>

  <!-- 圆 r = 5（屏幕上 1 单位 = 24px） -->
  <circle cx="280" cy="255" r="120" fill="#e8f0fe" fill-opacity="0.35" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>

  <!-- 圆心 -->
  <circle cx="280" cy="255" r="4.5" fill="#446688" filter="url(#rough2)"/>
  <text x="292" y="272" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">(x₀, y₀) 路由器</text>

  <!-- 其他格点（淡） -->
  <g fill="#9ab4cc" filter="url(#rough2)">
    <circle cx="352" cy="159" r="3.6"/><circle cx="376" cy="183" r="3.6"/>
    <circle cx="208" cy="351" r="3.6"/><circle cx="376" cy="327" r="3.6"/>
    <circle cx="184" cy="183" r="3.6"/><circle cx="208" cy="159" r="3.6"/>
    <circle cx="352" cy="351" r="3.6"/>
  </g>

  <!-- 两条轴上的端点 -->
  <circle cx="280" cy="135" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.6" filter="url(#rough2)"/>
  <circle cx="280" cy="375" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="160" cy="255" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="400" cy="255" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- 半径标注 -->
  <path d="M 280 255 L 280 143" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <text x="287" y="205" font-size="12.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">R</text>

  <!-- 答案点标注 -->
  <rect x="304" y="86" width="152" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="105" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">答案：位移 (0, R)</text>
  <text x="380" y="123" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">点 (x₀, y₀+R)</text>
  <path d="M 318 132 L 292 143" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>

  <text x="150" y="238" text-anchor="end" font-size="11" fill="#3c5e2e" filter="url(#rough2)">(x₀−R, y₀)</text>
  <text x="410" y="238" font-size="11" fill="#3c5e2e" filter="url(#rough2)">(x₀+R, y₀)</text>
  <text x="270" y="394" text-anchor="end" font-size="11" fill="#3c5e2e" filter="url(#rough2)">(x₀, y₀−R)</text>

  <!-- 样例 2 的勾股点 (−3,−4) -->
  <circle cx="208" cy="351" r="6.5" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <path d="M 140 388 Q 172 380 202 358" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="36" y="396" font-size="11" fill="#a14340" filter="url(#rough2)">样例 2 用的 (−3,−4)</text>

  <!-- 右侧说明 -->
  <rect x="470" y="72" width="262" height="150" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="601" y="96" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">为什么 (0, R) 一定合法</text>
  <text x="486" y="122" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">只需让某个位移分量为 0：</text>
  <text x="486" y="144" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">(0)² + R² = R²</text>
  <text x="486" y="168" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">R 是整数 ⇒ 位移是整点，</text>
  <text x="486" y="190" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">加上整数圆心仍是整点。</text>
  <text x="486" y="212" font-size="11.5" fill="#8a6015" filter="url(#rough2)">不需要勾股数，不需要搜索。</text>

  <rect x="470" y="238" width="262" height="140" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="601" y="262" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">轴上的 4 个点总是解</text>
  <text x="486" y="288" font-size="11.5" fill="#8a6015" filter="url(#rough2)">(x₀±R, y₀)、(x₀, y₀±R) 都在圆上，</text>
  <text x="486" y="310" font-size="11.5" fill="#8a6015" filter="url(#rough2)">这是圆与两条网格线的交点。</text>
  <text x="486" y="332" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">其余格点只有 R 是勾股斜边时</text>
  <text x="486" y="354" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">才有（R=5 时多 8 个）。</text>

  <rect x="40" y="404" width="680" height="22" rx="6" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="380" y="419" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">输出 (x₀, y₀ + R) 即可：坐标范围 −10…35，远小于 2³¹−1</text>
</svg>
