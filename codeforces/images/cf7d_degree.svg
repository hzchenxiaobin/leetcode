<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" viewBox="0 0 860 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="97"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>
  <rect width="860" height="470" fill="#fafafa"/>
  <text x="430" y="34" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">回文度：前缀是回文时 deg[i] = deg[i/2] + 1，否则为 0</text>
  <path d="M 110 46 Q 430 52 750 46" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="70" y="80" width="56" height="46" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.4"/>
    <rect x="70" y="126" width="56" height="46" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.4"/>
    <rect x="70" y="172" width="56" height="46" fill="#dbe7fb" stroke="#446688" stroke-width="1.4"/>
    <rect x="70" y="218" width="56" height="46" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.4"/>
    <rect x="70" y="264" width="56" height="46" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.4"/>
    <rect x="70" y="310" width="56" height="46" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.4"/>
    <rect x="70" y="356" width="56" height="46" fill="#fff3d6" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <g font-size="14" fill="#23405c" filter="url(#rough2)">
    <text x="98" y="110" text-anchor="middle">a</text><text x="98" y="156" text-anchor="middle">b</text>
    <text x="98" y="202" text-anchor="middle">a</text><text x="98" y="248" text-anchor="middle">c</text>
    <text x="98" y="294" text-anchor="middle">a</text><text x="98" y="340" text-anchor="middle">b</text>
    <text x="98" y="386" text-anchor="middle">a</text>
  </g>
  <g font-size="12" fill="#44597a" filter="url(#rough2)">
    <text x="150" y="110">前缀 "a"</text><text x="150" y="156">前缀 "ab"</text><text x="150" y="202">前缀 "aba"</text>
    <text x="150" y="248">前缀 "abac"</text><text x="150" y="294">前缀 "abaca"</text>
    <text x="150" y="340">前缀 "abacab"</text><text x="150" y="386">前缀 "abacaba"</text>
  </g>
  <g font-size="12" filter="url(#rough2)">
    <text x="330" y="110" fill="#2f5223">回文 ✓</text><text x="330" y="156" fill="#8c3b37">不是 ✗</text>
    <text x="330" y="202" fill="#2f5223">回文 ✓</text><text x="330" y="248" fill="#8c3b37">不是 ✗</text>
    <text x="330" y="294" fill="#8c3b37">不是 ✗</text><text x="330" y="340" fill="#8c3b37">不是 ✗</text>
    <text x="330" y="386" fill="#2f5223">回文 ✓</text>
  </g>
  <g font-size="12.5" font-weight="bold" filter="url(#rough2)">
    <text x="470" y="110" fill="#23405c">deg = deg[0] + 1 = 1</text>
    <text x="470" y="156" fill="#8c3b37">deg = 0</text>
    <text x="470" y="202" fill="#23405c">deg = deg[1] + 1 = 2</text>
    <text x="470" y="248" fill="#8c3b37">deg = 0</text>
    <text x="470" y="294" fill="#8c3b37">deg = 0</text>
    <text x="470" y="340" fill="#8c3b37">deg = 0</text>
    <text x="470" y="386" fill="#23405c">deg = deg[3] + 1 = 3</text>
  </g>
  <text x="430" y="432" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">"abacaba" 的回文度为 3；所有前缀的度之和 = 1 + 0 + 2 + 0 + 0 + 0 + 3 = 6。</text>
</svg>
