<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="460" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1 走查：n=4，阈值法与答案 1 / 1 / 3</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="40.0" y="90.0" text-anchor="start" font-size="12.5" fill="#446688" filter="url(#rough2)">i=1（a=1），B=3：M₀=0 → s=1；M₁=2 → s=3；M₂=3 → s=4 &gt; 3 停</text>
  <text x="40.0" y="122.0" text-anchor="start" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">i=3（a=1），B=1：M₀=0 → s=3；M₁=1 → s=4 &gt; 3 停</text>
  <text x="40.0" y="154.0" text-anchor="start" font-size="12.5" fill="#666" filter="url(#rough2)">i=2（a=0）、i=4（k ≤ 3 用不到）不产生贡献</text>
  <rect x="40.0" y="180.0" width="640.0" height="84.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="54.0" y="204.0" text-anchor="start" font-size="12" fill="#3f3420" filter="url(#rough2)">diff[1] += 1（来自 i=1, t=0）</text>
  <text x="54.0" y="232.0" text-anchor="start" font-size="12" fill="#3f3420" filter="url(#rough2)">diff[3] += 1（来自 i=1, t=1）+ 1（来自 i=3, t=0）</text>
  <rect x="40.0" y="282.0" width="640.0" height="100.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="54.0" y="306.5" text-anchor="start" font-size="12.5" fill="#3f3420" filter="url(#rough2)">前缀和：k=1 → 1，k=2 → 1，k=3 → 1+2 = 3</text>
  <text x="54.0" y="334.5" text-anchor="start" font-size="12.5" fill="#3f3420" filter="url(#rough2)">与三重循环暴力、状态空间 BFS 的结果一致</text>
</svg>
