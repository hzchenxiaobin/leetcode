<svg xmlns="http://www.w3.org/2000/svg" width="730" height="340" viewBox="0 0 730 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="730" height="340" fill="#fafafa"/>
  <text x="365.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">30 分档为什么枚举到 100c 就够：天数下界给出 x 的上界</text>
  <path d="M 116.4800000000001 46 Q 365.0 52 613.5199999999999 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="52.0" y="74.0" width="626.0" height="50.0" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="74.0" cy="99.0" r="12.0" fill="#dce8f8" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="103.0" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <text x="96.0" y="104.0" text-anchor="start" font-size="12.3" fill="#2b2b2b" filter="url(#rough2)">第 i 个星球的天数 = 1 + ⌊a_i·x / b_i⌋，总计 D(x) = n + Σ_i ⌊a_i·x / b_i⌋</text>
  <path d="M 365.0 125.0 L 365.0 136.0" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="52.0" y="138.0" width="626.0" height="50.0" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="74.0" cy="163.0" r="12.0" fill="#dce8f8" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="167.0" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">2</text>
  <text x="96.0" y="168.0" text-anchor="start" font-size="12.3" fill="#2b2b2b" filter="url(#rough2)">30 分档保证 a_i ≥ 1、b_i ≤ b_max，于是 a_i·x/b_i ≥ x/b_max，取整只损失不到 1</text>
  <path d="M 365.0 189.0 L 365.0 200.0" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="52.0" y="202.0" width="626.0" height="50.0" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="74.0" cy="227.0" r="12.0" fill="#dce8f8" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="231.0" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">3</text>
  <text x="96.0" y="232.0" text-anchor="start" font-size="12.3" fill="#2b2b2b" filter="url(#rough2)">D(x) ≥ n + Σ_i (x/b_max − 1) = n·x/b_max</text>
  <path d="M 365.0 253.0 L 365.0 264.0" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="52.0" y="266.0" width="626.0" height="50.0" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="74.0" cy="291.0" r="12.0" fill="#dce8f8" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="295.0" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">4</text>
  <text x="96.0" y="296.0" text-anchor="start" font-size="12.3" fill="#2b2b2b" filter="url(#rough2)">若 D(x) ≤ c 则 x ≤ c·b_max/n ≤ c·b_max ≤ 100×100 = 10^4</text>
  <rect x="52.0" y="306.0" width="626.0" height="26.0" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="66.0" y="324.0" text-anchor="start" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">所以 E1 直接 for x = 1..100c+5 暴力枚举即可；这正是它与 E2 的分水岭</text>
</svg>
