<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 448" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="620" height="448" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">演算：a = [1, 2, 3]，n = 3 ⇒ 答案 40</text>
  <text x="310" y="45" text-anchor="middle" font-size="10.5" fill="#888">T = 1⊕2⊕3 = 0 ⇒ ¬T 全为 1，下面按 m 合并 5 个段</text>

  <g filter="url(#rough2)">
    <rect x="120" y="60" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="176" y="60" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="232" y="60" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="288" y="60" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="148" y="81">0</text>
    <text x="204" y="81">1</text>
    <text x="260" y="81">3</text>
    <text x="316" y="81">0</text>
  </g>
  <g font-size="9.5" fill="#999" text-anchor="middle" filter="url(#rough2)">
    <text x="148" y="105">p0</text>
    <text x="204" y="105">p1</text>
    <text x="260" y="105">p2</text>
    <text x="316" y="105">p3</text>
  </g>
  <text x="358" y="76" font-size="10" fill="#4a7a3a" filter="url(#rough2)">T = p3 = 0</text>
  <text x="358" y="92" font-size="9.5" fill="#666" filter="url(#rough2)">X = p_r ⊕ p_{l−1}</text>

  <g font-size="10" text-anchor="middle" filter="url(#rough2)">
    <text x="90" y="132" fill="#555" font-weight="bold">段 [l,r]</text>
    <text x="190" y="132" fill="#555" font-weight="bold">X</text>
    <text x="290" y="132" fill="#555" font-weight="bold">X+(T⊕X)</text>
    <text x="400" y="132" fill="#555" font-weight="bold">C(m)·C(n−m)</text>
    <text x="500" y="132" fill="#555" font-weight="bold">贡献</text>
  </g>
  <path d="M 40 138 L 580 138" stroke="#bbb" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <g font-size="10.5" text-anchor="middle" filter="url(#rough2)" fill="#2a3a52">
    <text x="90" y="160">[1,1]</text><text x="190" y="160">1</text><text x="290" y="160">2</text><text x="400" y="160">2</text><text x="500" y="160">4</text>
    <text x="90" y="184">[2,2]</text><text x="190" y="184">2</text><text x="290" y="184">4</text><text x="400" y="184">2</text><text x="500" y="184">8</text>
    <text x="90" y="208">[3,3]</text><text x="190" y="208">3</text><text x="290" y="208">6</text><text x="400" y="208">2</text><text x="500" y="208">12</text>
    <text x="90" y="232">[1,2]</text><text x="190" y="232">3</text><text x="290" y="232">6</text><text x="400" y="232">2</text><text x="500" y="232">12</text>
    <text x="90" y="256">[2,3]</text><text x="190" y="256">1</text><text x="290" y="256">2</text><text x="400" y="256">2</text><text x="500" y="256">4</text>
  </g>
  <path d="M 40 266 L 580 266" stroke="#bbb" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="400" y="284" font-size="10.5" text-anchor="middle" fill="#7a3a36" filter="url(#rough2)">合计</text>
  <text x="500" y="284" font-size="12" text-anchor="middle" fill="#7a3a36" font-weight="bold" filter="url(#rough2)">40</text>
  <text x="60" y="284" font-size="9.5" fill="#999" filter="url(#rough2)">C = 1,1,2,5；段 [1,3] 不挂边，排除</text>

  <rect x="30" y="300" width="562" height="132" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <g font-size="10" fill="#7a5a18" filter="url(#rough2)">
    <text x="44" y="320" font-weight="bold" font-size="10.5">用卷积复核（T = 0，只需 b = 0,1）：TotalK = 15</text>
    <text x="44" y="342">b=0：A = (+1,−1,−1,+1)，自相关 (−1,−2,+1) ⇒ Corr = −1</text>
    <text x="44" y="360">　　　Diff = (15−(−1))/2 = 8 ⇒ 权重 2^0 · 8</text>
    <text x="44" y="382">b=1：A = (+1,+1,−1,+1)，自相关 (−1, 0,+1) ⇒ Corr = 3</text>
    <text x="44" y="400">　　　Diff = (15−3)/2 = 6 ⇒ 权重 2^1 · 6</text>
    <text x="44" y="422" font-weight="bold" font-size="11" fill="#8a4a20">2·(8 + 12) = 40 ✓　与逐段枚举一致</text>
  </g>
</svg>
