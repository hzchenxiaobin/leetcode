<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="73"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="a13" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">状态 = 四个方向「距离上一根横杆的高度差」，超过 h 就永久废掉</text>
  <path d="M 62 42 Q 360 48 658 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 当前高度 -->
  <line x1="60" y1="120" x2="660" y2="120" stroke="#b85450" stroke-width="1.4" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="64" y="112" font-size="12" fill="#8a3a36" filter="url(#rough2)">当前处理到高度 y</text>

  <!-- 四根距离 -->
  <g filter="url(#rough2)">
    <rect x="70" y="140" width="130" height="54" rx="8" fill="#e8f4e0" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="214" y="140" width="130" height="54" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.4"/>
    <rect x="358" y="140" width="130" height="54" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="502" y="140" width="130" height="54" rx="8" fill="#f4f4f4" stroke="#999" stroke-width="1.4"/>
  </g>
  <g font-size="13" text-anchor="middle" filter="url(#rough2)">
    <text x="135" y="162" fill="#2f5223">方向 0：d = 1</text>
    <text x="135" y="182" fill="#2f5223">（y 处刚放的）</text>
    <text x="279" y="162" fill="#2f4a66">方向 1：d = 3</text>
    <text x="279" y="182" fill="#2f4a66">（还活着）</text>
    <text x="423" y="162" fill="#8a6015">方向 2：d = h</text>
    <text x="423" y="182" fill="#8a6015">（再 +1 就废）</text>
    <text x="567" y="162" fill="#555">方向 3：DEAD</text>
    <text x="567" y="182" fill="#555">（再也接不上）</text>
  </g>

  <!-- 转移 -->
  <text x="60" y="228" font-size="13.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">在 y+1 放一根横杆（选方向 k）</text>
  <g filter="url(#rough2)">
    <rect x="60" y="240" width="600" height="86" rx="8" fill="#ffffff" stroke="#888" stroke-width="1.2"/>
  </g>
  <g font-size="12.5" fill="#333" filter="url(#rough2)">
    <text x="74" y="264">• 方向 k：新距离 = 1；但若它本来就是 DEAD，放上去也仍是 DEAD（接不回地面）。</text>
    <text x="74" y="288">• 其余三个方向：距离 +1；一旦超过 h 就变成 DEAD；NONE（还没放过）保持 NONE。</text>
    <text x="74" y="312">• 四个方向完全对称 ⇒ 只存「排序后的四个距离」，状态数从 32⁴ 降到 C(35,4)=52360。</text>
  </g>

  <!-- 计数方式 -->
  <g filter="url(#rough2)">
    <rect x="60" y="342" width="600" height="74" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/>
  </g>
  <g font-size="12.5" fill="#8a6015" filter="url(#rough2)">
    <text x="74" y="366">答案这样数（第一次成功就结算）：处理高度 y 时，若把横杆放在一个「活着」的方向、</text>
    <text x="74" y="388">且 y ≥ n−h+1（顶部区间），那么这条分支立刻成功，剩余 n−y 个高度随便放 ⇒ 加 4^(n−y)。</text>
    <text x="74" y="408">活着的分支继续参与 DP；成功过的分支不再重复计数（避免重复）。</text>
  </g>
</svg>
