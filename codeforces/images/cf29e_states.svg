<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="720" height="420" fill="#fafafa"/>

  <text x="360" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">状态 (Bob 位置, Alex 位置)：对角线禁止</text>
  <path d="M 130 40 Q 360 46 590 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <text x="250" y="66" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">Alex 的位置 →</text>
  <text x="112" y="220" text-anchor="middle" font-size="11" fill="#555" transform="rotate(-90 112 220)" filter="url(#rough2)">Bob 的位置</text>

  <g font-size="10.5" text-anchor="middle" fill="#666" filter="url(#rough2)">
    <text x="195" y="88">1</text><text x="245" y="88">2</text><text x="295" y="88">3</text><text x="345" y="88">4</text>
    <text x="168" y="116">1</text><text x="168" y="166">2</text><text x="168" y="216">3</text><text x="168" y="266">4</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="180" y="96" width="180" height="180" fill="#ffffff" stroke="#446688" stroke-width="1.2"/>
    <g stroke="#446688" stroke-width="1" opacity="0.7">
      <line x1="225" y1="96" x2="225" y2="276"/><line x1="270" y1="96" x2="270" y2="276"/>
      <line x1="315" y1="96" x2="315" y2="276"/>
      <line x1="180" y1="141" x2="360" y2="141"/><line x1="180" y1="186" x2="360" y2="186"/>
      <line x1="180" y1="231" x2="360" y2="231"/>
    </g>
  </g>

  <g stroke="#b85450" stroke-width="1.8" opacity="0.8" filter="url(#rough2)">
    <line x1="190" y1="106" x2="215" y2="131"/><line x1="190" y1="131" x2="215" y2="106"/>
    <line x1="235" y1="151" x2="260" y2="176"/><line x1="235" y1="176" x2="260" y2="151"/>
    <line x1="280" y1="196" x2="305" y2="221"/><line x1="280" y1="221" x2="305" y2="196"/>
    <line x1="325" y1="241" x2="350" y2="266"/><line x1="325" y1="266" x2="350" y2="241"/>
  </g>
  <text x="378" y="296" font-size="10.5" fill="#a33a36" filter="url(#rough2)">u = v 的状态不允许出现</text>

  <circle cx="350" cy="111" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="360" y="108" font-size="10.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">起点 (1, n)</text>
  <circle cx="190" cy="261" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="284" font-size="10.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">终点 (n, 1)</text>

  <path d="M 350 123 Q 330 160 305 196" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="352" y="168" font-size="10" fill="#2f5223" filter="url(#rough2)">两人各走一条边</text>

  <rect x="40" y="312" width="640" height="92" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <g font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">
    <text x="56" y="338">状态转移：(u, v) → (u', v')，其中 u' 是 u 的邻点、v' 是 v 的邻点，且 u' ≠ v'。</text>
    <text x="56" y="364">在此状态图上从 (1, n) 到 (n, 1) 做 BFS，距离就是最短步数 k；到不了则输出 -1。</text>
    <text x="56" y="390">记录每个状态的前驱即可还原两人的完整路线；起点、终点天然满足 u ≠ v（n ≥ 2）。</text>
  </g>
</svg>
