<svg xmlns="http://www.w3.org/2000/svg" width="700" height="432" viewBox="0 0 700 432"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="29"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="700" height="432" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">样例 4 走查：n = 6，c = 6，a = [3, 1, 4, 1, 5, 9]</text>
  <text x="350" y="51" text-anchor="middle" font-size="11.5" fill="#888888"
        filter="url(#rough2)">把 g_i = c − a_i 算出来，答案只取决于 g 的前 k 大</text>

  <text x="56" y="104" text-anchor="middle" font-size="11.5" fill="#888888" filter="url(#rough2)">i</text>
  <text x="56" y="148" text-anchor="middle" font-size="11.5" fill="#888888" filter="url(#rough2)">a_i</text>
  <text x="56" y="192" text-anchor="middle" font-size="11.5" fill="#888888" filter="url(#rough2)">g_i</text>

  <rect x="118" y="76" width="64" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="103" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="190" y="76" width="64" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="222" y="103" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="262" y="76" width="64" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="294" y="103" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">3</text>
  <rect x="334" y="76" width="64" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="366" y="103" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">4</text>
  <rect x="406" y="76" width="64" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="438" y="103" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">5</text>
  <rect x="478" y="76" width="64" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="510" y="103" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">6</text>

  <rect x="118" y="120" width="64" height="40" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="150" y="147" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <rect x="190" y="120" width="64" height="40" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="222" y="147" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <rect x="262" y="120" width="64" height="40" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="294" y="147" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <rect x="334" y="120" width="64" height="40" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="366" y="147" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <rect x="406" y="120" width="64" height="40" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="438" y="147" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <rect x="478" y="120" width="64" height="40" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="510" y="147" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">9</text>

  <rect x="118" y="164" width="64" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="191" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <rect x="190" y="164" width="64" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="222" y="191" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">5</text>
  <rect x="262" y="164" width="64" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="294" y="191" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <rect x="334" y="164" width="64" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="366" y="191" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">5</text>
  <rect x="406" y="164" width="64" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="438" y="191" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <rect x="478" y="164" width="64" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="510" y="191" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">−3</text>

  <text x="586" y="142" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">S = 23</text>
  <text x="586" y="166" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">n·c = 36</text>
  <text x="586" y="190" text-anchor="start" font-size="11" fill="#888888" filter="url(#rough2)">⌊n/2⌋ = 3</text>

  <path d="M 350 206 L 350 224" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#ar2)" filter="url(#rough2)"/>
  <text x="350" y="242" text-anchor="middle" font-size="12" fill="#8a6d20" font-weight="bold"
        filter="url(#rough2)">g 降序排列，k = min(3, 5 个正数) = 3，故 G = 5 + 5 + 3 = 13</text>

  <rect x="170" y="254" width="60" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="200" y="281" text-anchor="middle" font-size="13" fill="#8a6d20" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="242" y="254" width="60" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="272" y="281" text-anchor="middle" font-size="13" fill="#8a6d20" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="314" y="254" width="60" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="344" y="281" text-anchor="middle" font-size="13" fill="#8a6d20" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="386" y="254" width="60" height="40" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="416" y="281" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <rect x="458" y="254" width="60" height="40" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="488" y="281" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <rect x="530" y="254" width="60" height="40" rx="6" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="560" y="281" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">−3</text>
  <text x="380" y="312" text-anchor="middle" font-size="10.5" fill="#888888" filter="url(#rough2)">橙框 = 被选中的前 k 个（吸收者），白框 = 不参与</text>

  <rect x="60" y="324" width="580" height="42" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="352" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a"
        filter="url(#rough2)">ans = 23 − 36 + 13 = 0（与官方输出一致）</text>

  <text x="350" y="390" text-anchor="middle" font-size="11.5" fill="#2b2b2b"
        filter="url(#rough2)">构造出的配对：(2,3) → 4，(4,5) → 5，(1,6) → 9；3 次操作：4 + 5 + 9 − 3 × 6 = 0</text>
  <text x="350" y="412" text-anchor="middle" font-size="11" fill="#b85450"
        filter="url(#rough2)">反例提醒：只许相邻配对时最优是 (1,2)(3,4)(5,6)，收益 5 + 5 + 1 = 11，答案 23 − 36 + 11 = −2</text>
</svg>
