<svg xmlns="http://www.w3.org/2000/svg" width="880" height="290" viewBox="0 0 880 290"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="290" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">单调栈求"最近更大元素"</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">只需考虑 (i, NGL) 与 (i, NGR) 这两类对</text>
  <text x="150" y="110" text-anchor="start" font-size="13" fill="#2b2b2b" filter="url(#rough2)">区间的"幸运数" = 最大值 xor 次大值</text>
  <text x="150" y="152" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">次大值必是"最大值的左侧/右侧最近的更大元素"之一</text>
  <text x="150" y="196" text-anchor="start" font-size="13" fill="#3d6b2f" filter="url(#rough2)">单调递减栈同时求出两侧最近的更大元素，O(n)</text>
</svg>
