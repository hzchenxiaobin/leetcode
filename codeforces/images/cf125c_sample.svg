<svg xmlns="http://www.w3.org/2000/svg" width="880" height="270" viewBox="0 0 880 270"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="125"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/></marker>
  </defs>
  <rect width="880" height="270" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 n=4 → 3 天</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">1 2 / 1 3 / 2 3</text>
  <text x="140" y="120" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">第 1 天：客人 1（天对 1-2）、2（1-3）</text>
  <text x="140" y="156" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">第 2 天：客人 1（1-2）、3（2-3）</text>
  <text x="140" y="192" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">第 3 天：客人 2（1-3）、3（2-3）</text>
  <text x="140" y="232" text-anchor="start" font-size="11" fill="#3d6b2f" filter="url(#rough2)">任意两天共享恰好一个客人，任意三天无共同客人</text>
</svg>
