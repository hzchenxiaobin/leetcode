<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1111"/>
    <feDisplacementMap in="SourceGraphic" scale="1.5"/></filter></defs>
  <rect width="700" height="300" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">把每只猫变成一个"最晚出发时刻" aᵢ = tᵢ − dist(hᵢ)</text>
  <path d="M 110 40 Q 350 46 590 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="86" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="12.5" fill="#22314a" filter="url(#rough2)">喂猫人从 1 号山出发，走到 hᵢ 要 dist(hᵢ) 米。若他 T 时刻出发，到 hᵢ 是 T+dist(hᵢ)。</text>
  <text x="76" y="106" font-size="12.5" fill="#22314a" filter="url(#rough2)">要接上猫需 T+dist(hᵢ) ≥ tᵢ ⟺ T ≥ tᵢ − dist(hᵢ) =: aᵢ。</text>
  <text x="76" y="130" font-size="12.5" fill="#22314a" filter="url(#rough2)">猫的等待时间 = (T+dist) − tᵢ = T − aᵢ（与 hᵢ 无关！）</text>
  <g filter="url(#rough2)"><rect x="60" y="152" width="580" height="76" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="76" y="176" font-size="12.5" fill="#8a6015" filter="url(#rough2)">把 a 升序排序：一个出发时刻 T 能接的正是 a ≤ T 的那段前缀。</text>
  <text x="76" y="200" font-size="12.5" fill="#8a6015" filter="url(#rough2)">⇒ 问题 = 把有序数组切成 ≤ p 段，每段 [l..r] 的代价 = Σ(a_r − a_i) = (r−l+1)a_r − (S_r − S_{l−1})。</text>
  <text x="76" y="224" font-size="12.5" fill="#8a6015" filter="url(#rough2)">每段取 T = a_r（该段最大值）时最优 ✓</text>
  <g filter="url(#rough2)"><rect x="60" y="240" width="580" height="52" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="264" font-size="12.5" fill="#2f5223" filter="url(#rough2)">样例：6 只猫、p=2 ⇒ 答案 3 ✓（3 与 12 两个出发时刻）</text>
  <text x="76" y="282" font-size="12.5" fill="#2f5223" filter="url(#rough2)">注意 aᵢ 可为负（猫很早就到了）✓</text>
</svg>
