<svg xmlns="http://www.w3.org/2000/svg" width="740" height="420" viewBox="0 0 740 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2b2b2b"/>
    </marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arra" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="740" height="420" fill="#fafafa"/>
  <text x="370" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1：从 ABA 到 ABBBA 的两步</text>
  <path d="M 210 42 Q 370 48 530 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="40" y="96" width="40" height="52" rx="0" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="60.0" y="130" text-anchor="middle" font-size="18" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">A</text>
  <rect x="80" y="96" width="40" height="52" rx="0" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="100.0" y="130" text-anchor="middle" font-size="18" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">B</text>
  <rect x="120" y="96" width="40" height="52" rx="0" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="140.0" y="130" text-anchor="middle" font-size="18" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">A</text>
  <rect x="280" y="96" width="40" height="52" rx="0" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="300.0" y="130" text-anchor="middle" font-size="18" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">A</text>
  <rect x="320" y="96" width="40" height="52" rx="0" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="340.0" y="130" text-anchor="middle" font-size="18" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">B</text>
  <rect x="360" y="96" width="40" height="52" rx="0" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="380.0" y="130" text-anchor="middle" font-size="18" font-weight="bold" fill="#8a6015" filter="url(#rough2)">B</text>
  <rect x="400" y="96" width="40" height="52" rx="0" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="420.0" y="130" text-anchor="middle" font-size="18" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">A</text>
  <rect x="520" y="96" width="40" height="52" rx="0" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="540.0" y="130" text-anchor="middle" font-size="18" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">A</text>
  <rect x="560" y="96" width="40" height="52" rx="0" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="580.0" y="130" text-anchor="middle" font-size="18" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">B</text>
  <rect x="600" y="96" width="40" height="52" rx="0" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="620.0" y="130" text-anchor="middle" font-size="18" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">B</text>
  <rect x="640" y="96" width="40" height="52" rx="0" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="660.0" y="130" text-anchor="middle" font-size="18" font-weight="bold" fill="#8a6015" filter="url(#rough2)">B</text>
  <rect x="680" y="96" width="40" height="52" rx="0" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="700.0" y="130" text-anchor="middle" font-size="18" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">A</text>
  <text x="40" y="82" text-anchor="start" font-size="12" fill="#8a8a8a" filter="url(#rough2)">s</text>
  <text x="280" y="82" text-anchor="start" font-size="11" fill="#8a8a8a" filter="url(#rough2)">第 1 步后</text>
  <text x="520" y="82" text-anchor="start" font-size="11" fill="#8a8a8a" filter="url(#rough2)">第 2 步后 = t</text>
  <line x1="160" y1="122" x2="272" y2="122" stroke="#4a7a3a" stroke-width="2" opacity="1.0" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="216" y="108" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">INSERT 3 B</text>
  <line x1="440" y1="122" x2="512" y2="122" stroke="#4a7a3a" stroke-width="2" opacity="1.0" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="476" y="108" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">INSERT 4 B</text>
  <rect x="110" y="196" width="520" height="64" rx="0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="370" y="224" text-anchor="middle" font-size="13" fill="#2f5223" filter="url(#rough2)">长度差为 2，至少要 2 次插入；</text>
  <text x="370" y="248" text-anchor="middle" font-size="13" fill="#2f5223" filter="url(#rough2)">原有的 A、B 全部能对上 → 2 步就是最优</text>
  <text x="370" y="302" text-anchor="middle" font-size="12" fill="#8a8a8a" filter="url(#rough2)">位置是 1 基、相对当前串：第一步插在第 3 位，第二步插在第 4 位</text>
  <text x="370" y="332" text-anchor="middle" font-size="12" fill="#8a8a8a" filter="url(#rough2)">黄色格子是本次插入的新字符</text>
  <text x="370" y="372" text-anchor="middle" font-size="12" fill="#8a8a8a" filter="url(#rough2)">任何合法的 2 步方案都会被 checker 接受</text>
</svg>
