<svg xmlns="http://www.w3.org/2000/svg" width="700" height="310" viewBox="0 0 700 310"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1201"/>
    <feDisplacementMap in="SourceGraphic" scale="1.5"/></filter></defs>
  <rect width="700" height="310" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">最小割建模：S 侧 = "判为雄性(1)"，T 侧 = "雌性(0)"</text>
  <path d="M 110 40 Q 350 46 590 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="66" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="12.5" fill="#22314a" filter="url(#rough2)">基线 = 所有 w 之和；割掉的每一份就是"损失"。</text>
  <text x="76" y="106" font-size="12.5" fill="#22314a" filter="url(#rough2)">答案 = Σw − 最小割 ✓</text>
  <g filter="url(#rough2)"><rect x="60" y="132" width="580" height="86" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="76" y="156" font-size="12.5" fill="#8a6015" filter="url(#rough2)">改性别代价：初始为 1 的狗连 S→i（容量 vᵢ）；初始为 0 的连 i→T（容量 vᵢ）。</text>
  <text x="76" y="180" font-size="12.5" fill="#8a6015" filter="url(#rough2)">⇒ 狗落在"与初始相反"的一侧时，恰好割掉 vᵢ ✓</text>
  <text x="76" y="204" font-size="12.5" fill="#8a6015" filter="url(#rough2)">悬赏：若他要"全是 1"：S→f 容量 w（+g 若朋友），f→每只狗 ∞；若要"全是 0"镜像。</text>
  <g filter="url(#rough2)"><rect x="60" y="226" width="580" height="76" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="250" font-size="12.5" fill="#2f5223" filter="url(#rough2)">∞ 边保证：f 在"满足侧"时，它的狗必须全在满足侧；否则只能放弃 f。</text>
  <text x="76" y="274" font-size="12.5" fill="#2f5223" filter="url(#rough2)">"放弃 f"时割掉 S→f = w（+g）⇒ 正好损失奖金，朋友还多罚 g ✓</text>
  <text x="76" y="296" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">样例 1 → 2；样例 2 → 16 ✓</text>
</svg>
