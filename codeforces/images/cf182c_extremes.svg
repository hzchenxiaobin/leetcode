<svg xmlns="http://www.w3.org/2000/svg" width="780" height="340" viewBox="0 0 780 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="780" height="340" fill="#fafafa"/>
  <text x="390.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">固定窗口后：|S − 2T| 只在 T 的两个端点取到最大</text>
  <path d="M 167.49000000000007 46 Q 390.0 52 612.51 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 90.0 170.0 L 700.0 170.0" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 90.0 170.0 L 90.0 100.0" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="70.0" y="176.0" text-anchor="end" font-size="11" font-style="italic" fill="#2b2b2b" filter="url(#rough2)">T</text>
  <rect x="150.0" y="150.0" width="60.0" height="20.0" rx="4" fill="#fff3d6" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="180.0" y="140.0" text-anchor="middle" font-size="10.6" font-weight="bold" fill="#8a6015" filter="url(#rough2)">T_min</text>
  <text x="180.0" y="196.0" text-anchor="middle" font-size="10.2" fill="#6b6b6b" filter="url(#rough2)">翻最负的 k 个</text>
  <rect x="520.0" y="150.0" width="60.0" height="20.0" rx="4" fill="#fff3d6" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="550.0" y="140.0" text-anchor="middle" font-size="10.6" font-weight="bold" fill="#8a6015" filter="url(#rough2)">T_max</text>
  <text x="550.0" y="196.0" text-anchor="middle" font-size="10.2" fill="#6b6b6b" filter="url(#rough2)">翻最大的 k 个正数</text>
  <path d="M 210.0 120.0 L 520.0 240.0" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="360.0" y="112.0" text-anchor="middle" font-size="10.8" font-weight="bold" fill="#446688" filter="url(#rough2)">S − 2T 随 T 单调下降</text>
  <rect x="60.0" y="244.0" width="660.0" height="76.0" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="268.0" text-anchor="start" font-size="11.2" fill="#8a6015" filter="url(#rough2)">T 的取值是「窗口内任选 ≤ k 个数之和」，是一个区间 [T_min, T_max]；线性函数在端点取极值，</text>
  <text x="74.0" y="290.0" text-anchor="start" font-size="11.2" fill="#8a6015" filter="url(#rough2)">所以每个窗口只需两个候选：S − 2·T_min（尽量翻负数）与 2·T_max − S（尽量翻正数）。</text>
</svg>
