<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="a3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="440" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例三 F = 2 的三种分摊：费用 14 / 14 / 15</text>
  <path d="M 170 38 Q 360 44 550 38" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 三个面板 -->
  <g filter="url(#rough2)">
    <!-- 面板 1 -->
    <rect x="24" y="56" width="216" height="268" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <text x="132" y="82" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66">① 全走 1→2→3</text>
    <circle cx="132" cy="112" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="132" y="117" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66">1</text>
    <circle cx="132" cy="180" r="17" fill="#e6f4ea" stroke="#2f7a3a" stroke-width="1.4"/>
    <text x="132" y="185" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f5226">2</text>
    <circle cx="132" cy="248" r="17" fill="#e6f4ea" stroke="#2f7a3a" stroke-width="1.4"/>
    <text x="132" y="253" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f5226">3</text>
    <circle cx="132" cy="300" r="17" fill="#fdecea" stroke="#b85450" stroke-width="1.4"/>
    <text x="132" y="305" text-anchor="middle" font-size="12" font-weight="bold" fill="#8c2f2b">4</text>
    <line x1="132" y1="131" x2="132" y2="161" stroke="#446688" stroke-width="1.6" marker-end="url(#a3)"/>
    <line x1="132" y1="199" x2="132" y2="229" stroke="#446688" stroke-width="1.6" marker-end="url(#a3)"/>
    <line x1="132" y1="267" x2="132" y2="281" stroke="#446688" stroke-width="1.6" marker-end="url(#a3)"/>
    <text x="176" y="150" font-size="11" fill="#2f4a66">2</text>
    <text x="176" y="218" font-size="11" fill="#2f4a66">2</text>
    <text x="176" y="278" font-size="11" fill="#2f4a66">2</text>
    <text x="132" y="322" text-anchor="middle" font-size="10.5" fill="#888">c₁₃ = 0</text>
  </g>

  <g filter="url(#rough2)">
    <!-- 面板 2 -->
    <rect x="252" y="56" width="216" height="268" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <text x="360" y="82" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66">② 全走 1→3</text>
    <circle cx="360" cy="112" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="360" y="117" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66">1</text>
    <circle cx="300" cy="190" r="17" fill="#e6f4ea" stroke="#2f7a3a" stroke-width="1.4"/>
    <text x="300" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f5226">3</text>
    <circle cx="420" cy="190" r="17" fill="#e6f4ea" stroke="#2f7a3a" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="420" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f5226">2</text>
    <circle cx="360" cy="290" r="17" fill="#fdecea" stroke="#b85450" stroke-width="1.4"/>
    <text x="360" y="295" text-anchor="middle" font-size="12" font-weight="bold" fill="#8c2f2b">4</text>
    <path d="M 352 125 L 310 173" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#a3)"/>
    <path d="M 310 205 L 350 275" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#a3)"/>
    <text x="306" y="146" font-size="11" fill="#2f4a66">2</text>
    <text x="316" y="256" font-size="11" fill="#2f4a66">2</text>
    <text x="420" y="222" text-anchor="middle" font-size="10.5" fill="#888">c₁₂ = c₂₃ = 0</text>
  </g>

  <g filter="url(#rough2)">
    <!-- 面板 3 -->
    <rect x="480" y="56" width="216" height="268" rx="10" fill="#fffbe6" stroke="#d6a040" stroke-width="2.2"/>
    <text x="588" y="82" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015">③ 混合（最贵）</text>
    <circle cx="588" cy="112" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="588" y="117" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66">1</text>
    <circle cx="528" cy="180" r="17" fill="#e6f4ea" stroke="#2f7a3a" stroke-width="1.4"/>
    <text x="528" y="185" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f5226">2</text>
    <circle cx="588" cy="240" r="17" fill="#e6f4ea" stroke="#2f7a3a" stroke-width="1.4"/>
    <text x="588" y="245" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f5226">3</text>
    <circle cx="588" cy="300" r="17" fill="#fdecea" stroke="#b85450" stroke-width="1.4"/>
    <text x="588" y="305" text-anchor="middle" font-size="12" font-weight="bold" fill="#8c2f2b">4</text>
    <path d="M 574 124 L 542 164" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#a3)"/>
    <path d="M 540 196 L 574 226" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#a3)"/>
    <path d="M 596 126 L 596 222" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#a3)"/>
    <line x1="588" y1="258" x2="588" y2="279" stroke="#446688" stroke-width="1.6" marker-end="url(#a3)"/>
    <text x="548" y="150" font-size="11" fill="#2f4a66">1</text>
    <text x="536" y="222" font-size="11" fill="#2f4a66">1</text>
    <text x="604" y="180" font-size="11" fill="#2f4a66">1</text>
    <text x="604" y="272" font-size="11" fill="#2f4a66">2</text>
  </g>

  <!-- 费用表 -->
  <g filter="url(#rough2)">
    <rect x="24" y="336" width="672" height="92" rx="10" fill="#ffffff" stroke="#cccccc" stroke-width="1.5"/>
    <text x="40" y="360" font-size="12" font-weight="bold" fill="#2b2b2b">① (1+2²)+(1+2²)+(0+0²)+(0+2²) = 5+5+0+4 = 14</text>
    <text x="40" y="384" font-size="12" font-weight="bold" fill="#2b2b2b">② (0+0²)+(0+0²)+(6+2²)+(0+2²) = 0+0+10+4 = 14</text>
    <text x="40" y="408" font-size="12" font-weight="bold" fill="#8a6015">③ (1+1²)+(1+1²)+(6+1²)+(0+2²) = 2+2+7+4 = 15  ← 最大</text>
    <text x="430" y="408" font-size="11" fill="#8a6015">混合省了 5 的平方项，却多付 6 的激活费，净贵 1</text>
  </g>
</svg>
