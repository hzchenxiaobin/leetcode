<svg xmlns="http://www.w3.org/2000/svg" width="840" height="340" viewBox="0 0 840 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="340" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">枚举数位和 s = 1..81，解二次方程</text>
  <text x="420" y="56" text-anchor="middle" font-size="11.8" fill="#666666" filter="url(#rough2)">x² + s·x − n = 0 ⇒ x = (−s + √(s²+4n)) / 2</text>
  <g filter="url(#rough2)"><rect x="110" y="100" width="240" height="80" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="230" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">s = 1..81</text>
  <text x="230" y="156" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">x ≤ 10⁹ ⇒ s(x) ≤ 81</text>
  <g filter="url(#rough2)"><rect x="400" y="100" width="300" height="80" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="550" y="128" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">D = s² + 4n，取整数平方根 r</text>
  <text x="550" y="156" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">x = (r − s)/2（需整除且 x&gt;0）</text>
  <g filter="url(#rough2)"><line x1="350" y1="140" x2="400" y2="140" stroke="#8899aa" stroke-width="1.4" marker-end="url(#arrb)"/></g>
  <text x="420" y="226" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">校验：x² + s(x)·x == n 且 s(x) == s</text>
  <g filter="url(#rough2)"><rect x="220" y="252" width="400" height="40" rx="4" fill="#f7fbf4" fill-opacity="0.85" stroke="#a8c99a" stroke-width="1.3"/></g>
  <text x="420" y="278" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3d6b2f" filter="url(#rough2)">取最小候选；无候选输出 -1</text>
  <text x="420" y="316" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">O(81 log n)，实测 &lt; 1 ms</text>
</svg>
