<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420">
<defs>
  <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs>
<rect x="0" y="0" width="760" height="420" fill="#fafafa"/>
<text x="380.0" y="34" font-size="22" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="bold" text-anchor="middle" filter="url(#rough2)">骨牌形状：白—黑—白</text>
<rect x="110" y="110" width="66" height="66" rx="8" fill="#fff4d6" stroke="#666" stroke-width="2" filter="url(#rough2)"/>
<text x="143" y="152" font-size="22" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">w</text>
<rect x="180" y="110" width="66" height="66" rx="8" fill="#555555" stroke="#666" stroke-width="2" filter="url(#rough2)"/>
<text x="213" y="152" font-size="22" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#ffffff" font-weight="normal" text-anchor="middle" filter="url(#rough2)">b</text>
<rect x="250" y="110" width="66" height="66" rx="8" fill="#fff4d6" stroke="#666" stroke-width="2" filter="url(#rough2)"/>
<text x="283" y="152" font-size="22" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">w</text>
<text x="210" y="210" font-size="15" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="normal" text-anchor="middle" filter="url(#rough2)">1 × 3 横放：中心必须是黑格</text>
<rect x="470" y="110" width="66" height="66" rx="8" fill="#fff4d6" stroke="#666" stroke-width="2" filter="url(#rough2)"/>
<text x="503" y="152" font-size="22" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">w</text>
<rect x="470" y="180" width="66" height="66" rx="8" fill="#555555" stroke="#666" stroke-width="2" filter="url(#rough2)"/>
<text x="503" y="222" font-size="22" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#ffffff" font-weight="normal" text-anchor="middle" filter="url(#rough2)">b</text>
<rect x="470" y="250" width="66" height="66" rx="8" fill="#fff4d6" stroke="#666" stroke-width="2" filter="url(#rough2)"/>
<text x="503" y="292" font-size="22" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">w</text>
<text x="503" y="352" font-size="15" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="normal" text-anchor="middle" filter="url(#rough2)">竖放同理</text>
<text x="380" y="400" font-size="15" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#c0392b" font-weight="normal" text-anchor="middle" filter="url(#rough2)">每个黑格恰好当一次中心（两条手臂方向相反）；白色数必须是黑色数的两倍</text>
</svg>
