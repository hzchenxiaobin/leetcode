<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="400" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="38" text-anchor="middle" font-size="18.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">37B：为什么“能用的卷轴里挑伤害最大的、越早用越好”</text>
  <path d="M 137 50 Q 380 56 623 50" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="88" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">设 t 时刻可用且未用的卷轴集合为 U。两个事实：</text>
  <rect x="60" y="108" width="640" height="92" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="76" y="136" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">① 卷轴的伤害是“从使用那秒起每秒都生效”，越早用总伤害越多 —— 不会变差。</text>
  <text x="76" y="164" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">② 血量只影响“可用性”（百分比 &lt;= pow_i），多打伤害只会让更多卷轴更早可用。</text>
  <text x="76" y="188" text-anchor="start" font-size="12" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">   ⇒ 在 U 中挑伤害最大的先上，是对任何其他选择的“支配”。</text>
  <text x="60" y="232" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">交换论证：若某最优解在 t 时刻用了卷轴 b（伤害小），而在 t' &gt; t 用了 a（伤害大），</text>
  <text x="60" y="258" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">把 a、b 的使用时刻对调：t 之后每一秒的总伤害都不减少（可用性只会变宽松），</text>
  <text x="60" y="284" text-anchor="start" font-size="12.5" fill="#2f5223" font-weight="bold" filter="url(#rough2)">所以仍是最优；反复对调即得贪心解。</text>
  <rect x="60" y="306" width="640" height="76" rx="10" fill="#fff3e0" stroke="#c9801f" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="76" y="334" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">无解判定：若某秒可用卷轴为空且总伤害 &lt;= reg，则血量不会下降（封顶或持平）→ 永远赢不了 → NO。</text>
  <text x="76" y="360" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">样例 2：max=100, reg=10，卷轴 (100,11),(90,9)：t=0 用 1；血量到 90 时（t=10）用 2；t=19 击杀。</text>
</svg>
