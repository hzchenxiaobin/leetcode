<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="470" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">两人的位置 = 无序对状态，相遇 = 掉进对角吸收态</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">n ≤ 22 时非对角态只有 n(n−1)/2 ≤ 231 个（而不是 n² = 484）</text>
  <g filter="url(#rough2)"><rect x="30" y="78" width="840" height="250" rx="6" fill="#ffffff" fill-opacity="0.4" stroke="#cccccc" stroke-width="1.4" stroke-dasharray="5 4"/></g>
  <text x="50" y="100" text-anchor="start" font-size="11.5" fill="#666666" filter="url(#rough2)">n = 3 的状态图（只画一个方向的箭头）</text>
  <g filter="url(#rough2)"><circle cx="180" cy="200" r="42" fill="#cfe0f5" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="180" y="204.32" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">{1,2}</text>
  <g filter="url(#rough2)"><circle cx="450" cy="200" r="42" fill="#cfe0f5" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="450" y="204.32" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">{1,3}</text>
  <g filter="url(#rough2)"><circle cx="720" cy="200" r="42" fill="#cfe0f5" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="720" y="204.32" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">{2,3}</text>
  <g filter="url(#rough2)"><line x1="222" y1="192" x2="408" y2="192" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)"/></g>
  <text x="315" y="182" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">P(1,1)P(2,3)</text>
  <g filter="url(#rough2)"><line x1="618" y1="200" x2="492" y2="200" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)"/></g>
  <text x="555" y="190" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">P(2,1)P(3,3)</text>
  <g filter="url(#rough2)"><line x1="196" y1="236" x2="528" y2="300" stroke="#446688" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><rect x="120" y="330" width="170" height="60" rx="6" fill="#f3d9d6" fill-opacity="0.85" stroke="#8a2b28" stroke-width="1.4"/></g>
  <text x="205" y="356" text-anchor="middle" font-size="13" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">(1,1) → e₁</text>
  <text x="205" y="376" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">两人同在房间 1</text>
  <g filter="url(#rough2)"><rect x="365" y="330" width="170" height="60" rx="6" fill="#f3d9d6" fill-opacity="0.85" stroke="#8a2b28" stroke-width="1.4"/></g>
  <text x="450" y="356" text-anchor="middle" font-size="13" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">(2,2) → e₂</text>
  <text x="450" y="376" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">两人同在房间 2</text>
  <g filter="url(#rough2)"><rect x="610" y="330" width="170" height="60" rx="6" fill="#f3d9d6" fill-opacity="0.85" stroke="#8a2b28" stroke-width="1.4"/></g>
  <text x="695" y="356" text-anchor="middle" font-size="13" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">(3,3) → e₃</text>
  <text x="695" y="376" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">两人同在房间 3</text>
  <g filter="url(#rough2)"><line x1="150" y1="238" x2="168" y2="328" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)"/></g>
  <text x="118" y="288" text-anchor="end" font-size="10.5" fill="#8a2b28" filter="url(#rough2)">P(1,1)P(2,1)</text>
  <g filter="url(#rough2)"><line x1="215" y1="240" x2="400" y2="328" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)"/></g>
  <text x="330" y="300" text-anchor="middle" font-size="10.5" fill="#8a2b28" filter="url(#rough2)">P(1,2)P(2,2)</text>
  <text x="450" y="418" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">f(i,i) = e_i 是已知的右端项，不是未知量；未知量只剩 u ≠ v 的状态</text>
  <text x="450" y="444" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">又因为两人规则相同，f(u,v) = f(v,u)，所以可以把 (u,v) 与 (v,u) 合成一个未知量</text>
</svg>
