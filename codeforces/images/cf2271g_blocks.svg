<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="620" height="430" fill="#fafafa"/>

  <text x="310" y="30" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">切出来的块：行块 a_i × 列块 b_j</text>

  <!-- 1-wide column highlight -->
  <rect x="70" y="70" width="30" height="210" fill="#fff8e1" stroke="none" filter="url(#rough2)"/>
  <!-- 1-tall row highlight -->
  <rect x="70" y="70" width="240" height="30" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>
  <!-- 1x1 piece -->
  <rect x="70" y="70" width="30" height="30" fill="#fce4ec" stroke="none" filter="url(#rough2)"/>

  <!-- grid cells -->
  <g stroke="#9aa7b8" stroke-width="1" fill="none" filter="url(#rough2)">
    <rect x="70" y="70" width="240" height="240" rx="2"/>
    <path d="M100,70 V310 M130,70 V310 M160,70 V310 M190,70 V310 M220,70 V310 M250,70 V310 M280,70 V310"/>
    <path d="M70,100 H310 M70,130 H310 M70,160 H310 M70,190 H310 M70,220 H310 M70,250 H310 M70,280 H310"/>
  </g>
  <!-- cuts -->
  <g stroke="#b85450" stroke-width="2.6" filter="url(#rough2)">
    <path d="M100,64 V316"/>
    <path d="M190,64 V316"/>
    <path d="M250,64 V316"/>
    <path d="M64,100 H316"/>
    <path d="M64,170 H316"/>
    <path d="M64,230 H316"/>
  </g>

  <!-- column block widths -->
  <g font-size="13" fill="#446688" filter="url(#rough2)">
    <text x="85" y="58" text-anchor="middle">b=1</text>
    <text x="145" y="58" text-anchor="middle">b=3</text>
    <text x="220" y="58" text-anchor="middle">b=2</text>
    <text x="280" y="58" text-anchor="middle">b=1</text>
  </g>
  <!-- row block heights -->
  <g font-size="13" fill="#4a7a3a" filter="url(#rough2)">
    <text x="52" y="90" text-anchor="middle">a=1</text>
    <text x="52" y="140" text-anchor="middle">a=2</text>
    <text x="52" y="205" text-anchor="middle">a=2</text>
    <text x="52" y="275" text-anchor="middle">a=2</text>
  </g>

  <!-- arrows / notes -->
  <path d="M330,90 C360,90 360,60 386,60" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="52" font-size="12" fill="#b85450" filter="url(#rough2)">b_j = 1：只有一列</text>
  <text x="392" y="70" font-size="12" fill="#b85450" filter="url(#rough2)">整列必须是一条 1D 链</text>

  <path d="M120,330 C150,352 190,352 214,336" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="372" font-size="12" fill="#4a7a3a" filter="url(#rough2)">a_i = 1：只有一行，整行也是一条 1D 链</text>

  <path d="M76,76 C40,60 40,40 66,36" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="34" font-size="12" fill="#b85450" filter="url(#rough2)">1×1 块（值恒为 1）</text>

  <rect x="356" y="200" width="244" height="196" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <g font-size="13" fill="#22384f" filter="url(#rough2)">
    <text x="372" y="226">块 (i,j) 是 a_i × b_j 的矩形，</text>
    <text x="372" y="248">必须恰好放 1 … a_i·b_j。</text>
    <text x="372" y="276">相邻格（含跨切线的）必须不同。</text>
    <text x="372" y="304">不同块之间只通过“边界”互相影响：</text>
    <text x="372" y="326">左/右列、上/下行。</text>
    <text x="372" y="354">宽 ≥ 2 的块有多余自由度，</text>
    <text x="372" y="376">真正卡人的只有宽 1 / 高 1 的块。</text>
  </g>
</svg>
