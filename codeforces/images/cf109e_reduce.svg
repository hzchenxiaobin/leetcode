<svg xmlns="http://www.w3.org/2000/svg" width="884" height="412" viewBox="0 0 884 412"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="109"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="884" height="412" fill="#fafafa"/>
  <text x="442" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">把窗口按 10^M 分块：M = 不超过 l 的最大 10 的幂</text>
  <text x="442" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">低 M 位完全相同 → 只需比较块下标 p 的 F 值</text>
  <g filter="url(#rough2)"><rect x="90" y="140" width="70" height="44" rx="2" fill="#cfe0f5" fill-opacity="0.55" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="125" y="168" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">p=0</text>
  <g filter="url(#rough2)"><rect x="162" y="140" width="70" height="44" rx="2" fill="#cfe0f5" fill-opacity="0.55" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="197" y="168" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">p=1</text>
  <g filter="url(#rough2)"><rect x="234" y="140" width="70" height="44" rx="2" fill="#cfe0f5" fill-opacity="0.55" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="269" y="168" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">p=2</text>
  <g filter="url(#rough2)"><rect x="306" y="140" width="70" height="44" rx="2" fill="#cfe0f5" fill-opacity="0.55" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="341" y="168" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">p=3</text>
  <g filter="url(#rough2)"><rect x="378" y="140" width="70" height="44" rx="2" fill="#d7ecd0" fill-opacity="0.55" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="413" y="168" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">p=4</text>
  <g filter="url(#rough2)"><rect x="450" y="140" width="70" height="44" rx="2" fill="#d7ecd0" fill-opacity="0.55" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="485" y="168" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">p=5</text>
  <g filter="url(#rough2)"><rect x="522" y="140" width="70" height="44" rx="2" fill="#d7ecd0" fill-opacity="0.55" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="557" y="168" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">p=6</text>
  <g filter="url(#rough2)"><rect x="594" y="140" width="70" height="44" rx="2" fill="#d7ecd0" fill-opacity="0.55" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="629" y="168" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">p=7</text>
  <g filter="url(#rough2)"><rect x="666" y="140" width="70" height="44" rx="2" fill="#f6e3c4" fill-opacity="0.55" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="701" y="168" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">p=8</text>
  <g filter="url(#rough2)"><rect x="738" y="140" width="70" height="44" rx="2" fill="#f6e3c4" fill-opacity="0.55" stroke="#8899aa" stroke-width="1.1"/></g>
  <text x="773" y="168" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">p=9</text>
  <g filter="url(#rough2)"><line x1="90" y1="130" x2="378" y2="130" stroke="#8a2b28" stroke-width="2.6" marker-end="url(#arrr)"/></g>
  <text x="234" y="122" text-anchor="middle" font-size="11" fill="#8a2b28" filter="url(#rough2)">窗口 [a, a+l−1]</text>
  <text x="440" y="230" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">窗口长度 l：M 取不超过 l 的最大 10 的幂 → 窗口跨过的块数 ≤ 10</text>
  <text x="440" y="260" text-anchor="middle" font-size="12" fill="#3d6b2f" font-weight="bold" filter="url(#rough2)">条件变成：对这些块下标 p，要求 F(p + t) = F(p)（t = d / M）</text>
  <text x="440" y="290" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">块数 ≥ 10 时再用同样的理由降一层（t 必须是 10 的倍数），直到块数 ≤ 9</text>
  <g filter="url(#rough2)"><rect x="90" y="316" width="704" height="52" rx="4" fill="#ffffff" fill-opacity="0.0" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="5 4"/></g>
  <text x="442" y="346" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">为什么 M 是“强制”的：个位/十位…的“是否 4 或 7”序列是周期 10^{k+1} 的方波，</text>
  <text x="442" y="362" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">当窗口长度 ≥ 周期时相位被唯一确定 → d 必须是 10^{k+1} 的倍数</text>
  <text x="442" y="402" text-anchor="middle" font-size="12" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">答案 b = a + t·M</text>
</svg>
