<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c9801f"/>
    </marker>
  </defs>

  <rect width="760" height="450" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="38" text-anchor="middle" font-size="18.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">第一步：方程有没有整数解，只看 gcd 是否整除 C</text>
  <path d="M 152 50 Q 380 56 608 50" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="250" y="72" width="260" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="99" text-anchor="middle" font-size="15" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">A*x + B*y + C = 0</text>
  <path d="M 380 112 L 380 134" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="250" y="134" width="260" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="161" text-anchor="middle" font-size="15" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">A*x + B*y = -C</text>
  <path d="M 380 174 L 380 196" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="240" y="196" width="280" height="42" rx="8" fill="#f0f4f8" stroke="#2b2b2b" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="224" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">g = gcd(|A|, |B|)</text>
  <path d="M 380 238 L 380 258" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="285" y="258" width="190" height="42" rx="6" fill="#fff3e0" stroke="#c9801f" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="286" text-anchor="middle" font-size="14" fill="#a8641a" font-weight="bold" filter="url(#rough2)">C mod g == 0 ?</text>
  <path d="M 330 300 L 185 336" stroke="#b6483f" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 430 300 L 575 336" stroke="#4a7a3a" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="196" y="320" text-anchor="middle" font-size="12" fill="#b6483f" font-weight="bold" filter="url(#rough2)">不整除</text>
  <text x="624" y="320" text-anchor="middle" font-size="12" fill="#2f5223" font-weight="bold" filter="url(#rough2)">整除</text>
  <rect x="60" y="336" width="250" height="52" rx="8" fill="#fdecea" stroke="#b6483f" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="185" y="368" text-anchor="middle" font-size="13.5" fill="#b6483f" font-weight="bold" filter="url(#rough2)">-1：方程没有整数解</text>
  <rect x="450" y="336" width="270" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="585" y="368" text-anchor="middle" font-size="13.5" fill="#2f5223" font-weight="bold" filter="url(#rough2)">有解：扩欧求特解再平移</text>
  <text x="60" y="412" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">为什么是充要条件：左边恒是 g 的倍数，所以右边 -C 也必须是 g 的倍数；反过来 g 整除 C 时，把方程两边除以 g</text>
  <text x="60" y="436" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">正好凑成 gcd(a,b)=1 的方程，贝祖定理保证有解。这也是本题输出 -1 的唯一情形。</text>
</svg>
