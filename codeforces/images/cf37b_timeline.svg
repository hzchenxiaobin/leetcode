<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="420" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="38" text-anchor="middle" font-size="18.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">37B：每秒的三步（扣血 → 回血 → 用一个卷轴）</text>
  <path d="M 137 50 Q 380 56 623 50" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="70" y="90" width="195" height="66" rx="9" fill="#fbfbfb" stroke="#b6483f" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="167" y="130" text-anchor="middle" font-size="11.5" fill="#b6483f" font-weight="bold" filter="url(#rough2)">① 所有已用卷轴造成伤害</text>
  <path d="M 267 123 L 282 123" stroke="#2b2b2b" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="285" y="90" width="195" height="66" rx="9" fill="#fbfbfb" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="382" y="130" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 回复 reg 点（不超过 max）</text>
  <path d="M 482 123 L 497 123" stroke="#2b2b2b" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="500" y="90" width="195" height="66" rx="9" fill="#fbfbfb" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="597" y="130" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">③ 用一个可用卷轴</text>
  <text x="70" y="186" text-anchor="start" font-size="12.5" fill="#b6483f" font-weight="bold" filter="url(#rough2)">胜利条件：某一秒“扣血 + 回血”结束后血量 &lt;= 0；这一秒不能再用卷轴。</text>
  <line x1="80" y1="360" x2="700" y2="360" stroke="#2b2b2b" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="80" y1="360" x2="80" y2="210" stroke="#2b2b2b" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 80 220 L 200 236 L 320 252 L 440 268 L 560 300 L 680 340" stroke="#446688" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <circle cx="80" cy="220" r="3.5" fill="#446688" stroke="none" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="200" cy="236" r="3.5" fill="#446688" stroke="none" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="320" cy="252" r="3.5" fill="#446688" stroke="none" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="440" cy="268" r="3.5" fill="#446688" stroke="none" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="560" cy="300" r="3.5" fill="#446688" stroke="none" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="680" cy="340" r="3.5" fill="#446688" stroke="none" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="88" y="206" text-anchor="start" font-size="11" fill="#8a8a8a" font-weight="normal" filter="url(#rough2)">血量</text>
  <text x="690" y="378" text-anchor="end" font-size="11" fill="#8a8a8a" font-weight="normal" filter="url(#rough2)">时间</text>
  <text x="340" y="218" text-anchor="middle" font-size="11" fill="#2f4a66" font-weight="normal" filter="url(#rough2)">伤害 &lt; 回血时血量上升并封顶在 max</text>
  <text x="500" y="320" text-anchor="start" font-size="11" fill="#2f4a66" font-weight="normal" filter="url(#rough2)">伤害 &gt; 回血后单调下降</text>
</svg>
