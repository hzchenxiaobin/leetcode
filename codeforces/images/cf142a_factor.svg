<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="271"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="320" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">把未知数换成 n 的三个因子</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">剩余 = (A−1)(B−2)(C−2)，令 x=A−1、y=B−2、z=C−2 ⇒ xyz = n</text>
  <g filter="url(#rough2)"><rect x="60" y="92" width="380" height="130" rx="6" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="250" y="122" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">剩余块数</text>
  <text x="250" y="158" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">(A−1)(B−2)(C−2) = n</text>
  <text x="250" y="196" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">x = A−1, y = B−2, z = C−2</text>
  <text x="505" y="158" text-anchor="middle" font-size="22" fill="#666666" filter="url(#rough2)">⟹</text>
  <g filter="url(#rough2)"><rect x="560" y="92" width="300" height="130" rx="6" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="710" y="122" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">条件变成</text>
  <text x="710" y="158" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">x·y·z = n</text>
  <text x="710" y="196" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">x,y,z ≥ 1</text>
  <g filter="url(#rough2)"><rect x="60" y="244" width="800" height="56" rx="6" fill="#f3d9d6" fill-opacity="0.5" stroke="#8a2b28" stroke-width="1.4"/></g>
  <text x="460" y="268" text-anchor="middle" font-size="14" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">被偷 = A·B·C − n = (x+1)(y+2)(z+2) − n</text>
  <text x="460" y="290" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">枚举 n 的所有因子对（至多 1344 个因子）即可求最小/最大值</text>
</svg>
