<svg xmlns="http://www.w3.org/2000/svg" width="640" height="190" viewBox="0 0 640 190"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1412"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="640" height="190" fill="#fafafa"/>
  <text x="320.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">流程</text>
  <path d="M 102.4 42 Q 320.0 48 537.6 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="320.0" y="176" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">O(|a|+|b|+|c|)</text>
  <text x="320" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#335478" filter="url(#rough2)">读三行 → 前两行桶 +1、第三行桶 −1 → 全 0 ? YES : NO</text>
  <text x="320" y="130" text-anchor="middle" font-size="11.5" fill="#8c2f2c" filter="url(#rough2)">样例 2：堆里缺 P，桶里出现非零 ⇒ NO</text>
</svg>
