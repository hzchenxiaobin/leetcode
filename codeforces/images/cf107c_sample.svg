<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 348" width="640" height="348">
<defs>
<filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="13" result="noise"/>
<feDisplacementMap in="SourceGraphic" in2="noise" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect x="0" y="0" width="640" height="348" fill="#fafafa"/>
<g font-family="Comic Sans MS, Kaiti SC, cursive">
<text x="320.0" y="24.0" font-size="15" fill="#33475b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">样例 2：k=20，逐位定位（位置 1..4）</text>
<rect x="80.0" y="62.0" width="90.0" height="42.0" rx="8" fill="#eef4fb" stroke="#7a93a8" stroke-width="1.6" filter="url(#rough2)"/>
<text x="125.0" y="89.0" font-size="13" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">π₁</text>
<rect x="180.0" y="62.0" width="290.0" height="42.0" rx="8" fill="#ffffff" stroke="#b9c6d6" stroke-width="1.4" filter="url(#rough2)"/>
<text x="325.0" y="89.0" font-size="12" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">只有 1</text>
<text x="540.0" y="89.0" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">→ 1</text>
<rect x="80.0" y="118.0" width="90.0" height="42.0" rx="8" fill="#eef4fb" stroke="#7a93a8" stroke-width="1.6" filter="url(#rough2)"/>
<text x="125.0" y="145.0" font-size="13" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">π₂</text>
<rect x="180.0" y="118.0" width="290.0" height="42.0" rx="8" fill="#ffffff" stroke="#b9c6d6" stroke-width="1.4" filter="url(#rough2)"/>
<text x="325.0" y="145.0" font-size="12" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">2,3 都可以，选 2</text>
<text x="540.0" y="145.0" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">→ 2</text>
<rect x="80.0" y="174.0" width="90.0" height="42.0" rx="8" fill="#eef4fb" stroke="#7a93a8" stroke-width="1.6" filter="url(#rough2)"/>
<text x="125.0" y="201.0" font-size="13" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">π₃</text>
<rect x="180.0" y="174.0" width="290.0" height="42.0" rx="8" fill="#ffffff" stroke="#b9c6d6" stroke-width="1.4" filter="url(#rough2)"/>
<text x="325.0" y="201.0" font-size="12" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">只剩 3</text>
<text x="540.0" y="201.0" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">→ 3</text>
<rect x="80.0" y="230.0" width="90.0" height="42.0" rx="8" fill="#eef4fb" stroke="#7a93a8" stroke-width="1.6" filter="url(#rough2)"/>
<text x="125.0" y="257.0" font-size="13" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">π₄</text>
<rect x="180.0" y="230.0" width="290.0" height="42.0" rx="8" fill="#ffffff" stroke="#b9c6d6" stroke-width="1.4" filter="url(#rough2)"/>
<text x="325.0" y="257.0" font-size="12" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">4,5,6 不够，选 7</text>
<text x="540.0" y="257.0" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">→ 7</text>
<text x="320.0" y="306.0" font-size="15" fill="#7a5c2e" text-anchor="middle" font-weight="bold" filter="url(#rough2)">完整答案：1 2 3 7 4 6 5</text>
<text x="320.0" y="332.0" font-size="12" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">每步用 f/h 数出「以 v 开头/该位为 v」的补全数，与 k 比较</text>
</g>
</svg>
