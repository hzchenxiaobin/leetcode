<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="801"/>
    <feDisplacementMap in="SourceGraphic" scale="1.5"/></filter></defs>
  <rect width="700" height="300" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">n 为偶数时无解：把所有等式求和取模 n</text>
  <path d="M 110 40 Q 350 46 590 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="86" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="12.5" fill="#22314a" filter="url(#rough2)">三个都是 0..n−1 的排列 ⇒ Σa = Σb = Σc = n(n−1)/2。</text>
  <text x="76" y="106" font-size="12.5" fill="#22314a" filter="url(#rough2)">把 aᵢ + bᵢ ≡ cᵢ 对 i 求和：n(n−1) ≡ n(n−1)/2 (mod n)</text>
  <text x="76" y="130" font-size="12.5" fill="#22314a" filter="url(#rough2)">⇒ n(n−1)/2 ≡ 0 (mod n) ⇒ 当 n 为偶数时 (n/2)(n−1) ≡ −n/2 ̸≡ 0 ✗</text>
  <g filter="url(#rough2)"><rect x="60" y="152" width="580" height="76" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="176" font-size="12.5" fill="#2f5223" filter="url(#rough2)">n 为奇数时构造：a = b = (0,1,…,n−1)，c = (2i mod n)。</text>
  <text x="76" y="200" font-size="12.5" fill="#2f5223" filter="url(#rough2)">因为 gcd(2,n)=1（n 奇），2i mod n 也恰好遍历 0..n−1 ⇒ c 是排列 ✓</text>
  <text x="76" y="222" font-size="12" fill="#3c5e2e" filter="url(#rough2)">且 aᵢ+bᵢ = 2i ≡ cᵢ ✓ 直接满足等式。</text>
  <g filter="url(#rough2)"><rect x="60" y="238" width="580" height="52" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="76" y="262" font-size="12.5" fill="#8a6015" filter="url(#rough2)">n=5：a=b=0 1 2 3 4，c = 0 2 4 1 3 ✓（样例给的是另一组，同样合法）</text>
  <text x="76" y="282" font-size="12" fill="#8a6015" filter="url(#rough2)">n=1：a=b=c=(0) ✓；n=2 ⇒ −1 ✓</text>
</svg>
