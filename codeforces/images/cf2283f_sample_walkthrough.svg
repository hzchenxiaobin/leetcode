<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 404" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="404" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">样例 5 演算：first[j] 决定每行删几条</text>
  <text x="300" y="46" text-anchor="middle" font-size="11" fill="#888">n = 6，区间依次为 [1,1] [1,2] [1,1] [2,4] [3,5]，位置 6 没有出边</text>

  <g filter="url(#rough2)">
    <rect x="156" y="62" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="204" y="62" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="252" y="62" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="300" y="62" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="348" y="62" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="396" y="62" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="178" y="81" text-anchor="middle" font-size="12" fill="#3a4a66">2</text>
    <text x="226" y="81" text-anchor="middle" font-size="12" fill="#3a4a66">3</text>
    <text x="274" y="81" text-anchor="middle" font-size="12" fill="#3a4a66">5</text>
    <text x="322" y="81" text-anchor="middle" font-size="12" fill="#3a4a66">5</text>
    <text x="370" y="81" text-anchor="middle" font-size="12" fill="#3a4a66">6</text>
    <text x="418" y="81" text-anchor="middle" font-size="12" fill="#8a3a34">无穷</text>
    <text x="178" y="104" text-anchor="middle" font-size="9" fill="#999999">j=1</text>
    <text x="226" y="104" text-anchor="middle" font-size="9" fill="#999999">j=2</text>
    <text x="274" y="104" text-anchor="middle" font-size="9" fill="#999999">j=3</text>
    <text x="322" y="104" text-anchor="middle" font-size="9" fill="#999999">j=4</text>
    <text x="370" y="104" text-anchor="middle" font-size="9" fill="#999999">j=5</text>
    <text x="418" y="104" text-anchor="middle" font-size="9" fill="#999999">j=6</text>
    <text x="140" y="81" text-anchor="end" font-size="10" fill="#666666">first</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="120" width="520" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="70" y="138" text-anchor="middle" font-size="11" fill="#2f4a66" font-weight="bold">i</text>
    <text x="165" y="138" text-anchor="middle" font-size="11" fill="#2f4a66" font-weight="bold">[l_i, r_i]</text>
    <text x="300" y="138" text-anchor="middle" font-size="11" fill="#2f4a66" font-weight="bold">区间内各 j 的 first[j]</text>
    <text x="405" y="138" text-anchor="middle" font-size="11" fill="#2f4a66" font-weight="bold">可删</text>
    <text x="495" y="138" text-anchor="middle" font-size="11" fill="#2f4a66" font-weight="bold">保留</text>

    <rect x="40" y="146" width="520" height="26" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="4"/>
    <text x="70" y="164" text-anchor="middle" font-size="11" fill="#555555">2</text>
    <text x="165" y="164" text-anchor="middle" font-size="11" fill="#555555">[1, 1]</text>
    <text x="300" y="164" text-anchor="middle" font-size="11" fill="#555555">2</text>
    <text x="405" y="164" text-anchor="middle" font-size="11" fill="#b85450">0</text>
    <text x="495" y="164" text-anchor="middle" font-size="11" fill="#4a7a3a">1</text>

    <rect x="40" y="172" width="520" height="26" fill="#f7f7f7" stroke="#dddddd" stroke-width="1" rx="4"/>
    <text x="70" y="190" text-anchor="middle" font-size="11" fill="#555555">3</text>
    <text x="165" y="190" text-anchor="middle" font-size="11" fill="#555555">[1, 2]</text>
    <text x="300" y="190" text-anchor="middle" font-size="11" fill="#555555">2, 3</text>
    <text x="405" y="190" text-anchor="middle" font-size="11" fill="#b85450">1</text>
    <text x="495" y="190" text-anchor="middle" font-size="11" fill="#4a7a3a">1</text>

    <rect x="40" y="198" width="520" height="26" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="4"/>
    <text x="70" y="216" text-anchor="middle" font-size="11" fill="#555555">4</text>
    <text x="165" y="216" text-anchor="middle" font-size="11" fill="#555555">[1, 1]</text>
    <text x="300" y="216" text-anchor="middle" font-size="11" fill="#555555">2</text>
    <text x="405" y="216" text-anchor="middle" font-size="11" fill="#b85450">0</text>
    <text x="495" y="216" text-anchor="middle" font-size="11" fill="#4a7a3a">1</text>

    <rect x="40" y="224" width="520" height="26" fill="#f7f7f7" stroke="#dddddd" stroke-width="1" rx="4"/>
    <text x="70" y="242" text-anchor="middle" font-size="11" fill="#555555">5</text>
    <text x="165" y="242" text-anchor="middle" font-size="11" fill="#555555">[2, 4]</text>
    <text x="300" y="242" text-anchor="middle" font-size="11" fill="#555555">3, 5, 5</text>
    <text x="405" y="242" text-anchor="middle" font-size="11" fill="#b85450">1</text>
    <text x="495" y="242" text-anchor="middle" font-size="11" fill="#4a7a3a">2</text>

    <rect x="40" y="250" width="520" height="26" fill="#ffffff" stroke="#dddddd" stroke-width="1" rx="4"/>
    <text x="70" y="268" text-anchor="middle" font-size="11" fill="#555555">6</text>
    <text x="165" y="268" text-anchor="middle" font-size="11" fill="#555555">[3, 5]</text>
    <text x="300" y="268" text-anchor="middle" font-size="11" fill="#555555">5, 5, 6</text>
    <text x="405" y="268" text-anchor="middle" font-size="11" fill="#b85450">2</text>
    <text x="495" y="268" text-anchor="middle" font-size="11" fill="#4a7a3a">1</text>

    <rect x="40" y="276" width="520" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="70" y="295" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">合计</text>
    <text x="165" y="295" text-anchor="middle" font-size="11" fill="#3a5a30">-</text>
    <text x="300" y="295" text-anchor="middle" font-size="11" fill="#3a5a30">共 10 条边</text>
    <text x="405" y="295" text-anchor="middle" font-size="11" fill="#8a3a34" font-weight="bold">4</text>
    <text x="495" y="295" text-anchor="middle" font-size="11" fill="#3a5a30" font-weight="bold">6</text>
  </g>

  <g filter="url(#rough2)">
    <text x="300" y="330" text-anchor="middle" font-size="10" fill="#b85450">可删 = 该行中 first[j] 不大于 r_i 的位置个数（存在两步替代路径）</text>
    <text x="300" y="350" text-anchor="middle" font-size="10" fill="#4a7a3a">保留 = 该行中 first[j] 大于 r_i 的位置个数（这些边就是传递约简的边）</text>
    <text x="300" y="376" text-anchor="middle" font-size="10" fill="#888888">删 4 条、留 6 条，最少边数为 6，与官方输出一致</text>
  </g>
</svg>
