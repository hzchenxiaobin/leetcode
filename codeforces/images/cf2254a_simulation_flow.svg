<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="640" height="390" fill="#fafafa" filter="url(#rough2)"/>
  <text x="320" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">模拟流程：结束后再看一眼就退出</text>

  <rect x="200" y="44" width="240" height="46" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="73" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">读入 a, b, c，rounds = 0</text>

  <path d="M 320 90 L 320 116" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <rect x="200" y="118" width="240" height="46" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="140" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">排序，使 x ≤ y ≤ z</text>
  <text x="320" y="157" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">只关心两端，中间值不参与运算</text>

  <path d="M 320 164 L 320 186" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <polygon points="320,188 452,232 320,276 188,232" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="228" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">x = y 或 y = z ？</text>
  <text x="320" y="247" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">（排序后两端相等必然全相等）</text>

  <!-- 是：向右 -->
  <path d="M 452 232 L 486 232" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="470" y="222" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="488" y="206" width="128" height="52" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="552" y="229" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">输出 rounds</text>
  <text x="552" y="247" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">本轮没有发生</text>

  <!-- 否：向下 -->
  <path d="M 320 276 L 320 300" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="338" y="294" font-size="13" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <rect x="200" y="302" width="240" height="46" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="324" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">x += 1，z −= 1，rounds += 1</text>
  <text x="320" y="341" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">最多者的一枚交给最少者</text>

  <!-- 回到排序框 -->
  <path d="M 200 325 L 96 325 L 96 141 L 196 141" fill="none" stroke="#446688" stroke-width="1.8"
        stroke-dasharray="6 5" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="108" y="240" font-size="12" fill="#666" transform="rotate(-90 108 240)" filter="url(#rough2)">重新排序再判</text>

  <text x="320" y="376" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">每个测试点最多 4 轮即可结束，循环上限极小</text>
</svg>
