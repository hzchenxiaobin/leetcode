<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="91"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="860" height="360" fill="#fafafa"/>
  <text x="430" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1：r=1, g=3, b=2</text>
  <text x="430" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">红 30；绿第 2 辆车 4 分到站 → 34；蓝 32 → 答案 34</text>
  <text x="150" y="128" text-anchor="end" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">红（1 人）</text>
  <g filter="url(#rough2)"><rect x="154" y="110" width="32" height="30" rx="3" fill="#f6d9d7" fill-opacity="0.8" stroke="#778899" stroke-width="1.1"/></g>
  <text x="584" y="130" text-anchor="start" font-size="12" fill="#1f3b57" font-weight="bold" filter="url(#rough2)">→ 30</text>
  <text x="150" y="184" text-anchor="end" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">绿（3 人）</text>
  <g filter="url(#rough2)"><rect x="200" y="166" width="32" height="30" rx="3" fill="#d7ecd0" fill-opacity="0.8" stroke="#778899" stroke-width="1.1"/></g>
  <g filter="url(#rough2)"><rect x="338" y="166" width="32" height="30" rx="3" fill="#d7ecd0" fill-opacity="0.8" stroke="#778899" stroke-width="1.1"/></g>
  <text x="584" y="186" text-anchor="start" font-size="12" fill="#1f3b57" font-weight="bold" filter="url(#rough2)">→ 34</text>
  <text x="150" y="240" text-anchor="end" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">蓝（2 人）</text>
  <g filter="url(#rough2)"><rect x="246" y="222" width="32" height="30" rx="3" fill="#cfe0f5" fill-opacity="0.8" stroke="#778899" stroke-width="1.1"/></g>
  <text x="584" y="242" text-anchor="start" font-size="12" fill="#1f3b57" font-weight="bold" filter="url(#rough2)">→ 32</text>
  <g filter="url(#rough2)"><line x1="170" y1="96" x2="170" y2="270" stroke="#eeeeee" stroke-width="1"/></g>
  <text x="170" y="296" text-anchor="middle" font-size="10.5" fill="#999999" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)"><line x1="216" y1="96" x2="216" y2="270" stroke="#eeeeee" stroke-width="1"/></g>
  <text x="216" y="296" text-anchor="middle" font-size="10.5" fill="#999999" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><line x1="262" y1="96" x2="262" y2="270" stroke="#eeeeee" stroke-width="1"/></g>
  <text x="262" y="296" text-anchor="middle" font-size="10.5" fill="#999999" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><line x1="308" y1="96" x2="308" y2="270" stroke="#eeeeee" stroke-width="1"/></g>
  <text x="308" y="296" text-anchor="middle" font-size="10.5" fill="#999999" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><line x1="354" y1="96" x2="354" y2="270" stroke="#eeeeee" stroke-width="1"/></g>
  <text x="354" y="296" text-anchor="middle" font-size="10.5" fill="#999999" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><line x1="400" y1="96" x2="400" y2="270" stroke="#eeeeee" stroke-width="1"/></g>
  <text x="400" y="296" text-anchor="middle" font-size="10.5" fill="#999999" filter="url(#rough2)">5</text>
  <g filter="url(#rough2)"><line x1="446" y1="96" x2="446" y2="270" stroke="#eeeeee" stroke-width="1"/></g>
  <text x="446" y="296" text-anchor="middle" font-size="10.5" fill="#999999" filter="url(#rough2)">6</text>
  <g filter="url(#rough2)"><line x1="492" y1="96" x2="492" y2="270" stroke="#eeeeee" stroke-width="1"/></g>
  <text x="492" y="296" text-anchor="middle" font-size="10.5" fill="#999999" filter="url(#rough2)">7</text>
  <g filter="url(#rough2)"><line x1="538" y1="96" x2="538" y2="270" stroke="#eeeeee" stroke-width="1"/></g>
  <text x="538" y="296" text-anchor="middle" font-size="10.5" fill="#999999" filter="url(#rough2)">8</text>
  <g filter="url(#rough2)"><line x1="584" y1="96" x2="584" y2="270" stroke="#eeeeee" stroke-width="1"/></g>
  <text x="584" y="296" text-anchor="middle" font-size="10.5" fill="#999999" filter="url(#rough2)">9</text>
  <text x="430" y="330" text-anchor="middle" font-size="12" fill="#3d6b2f" filter="url(#rough2)">绿组要两辆车：第 1 辆 1 分、第 2 辆 4 分；最后一辆到山顶 4+30=34</text>
</svg>
