<svg xmlns="http://www.w3.org/2000/svg" width="780" height="380" viewBox="0 0 780 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="780" height="380" fill="#fafafa"/>
  <text x="390.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每个 dwarf 的两条路：直接走过去，或走到最近站瞬移再走过去</text>
  <path d="M 120.57000000000016 46 Q 390.0 52 659.4299999999998 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <circle cx="140.0" cy="110.0" r="12.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="140.0" y="86.0" text-anchor="middle" font-size="10.6" font-weight="bold" fill="#446688" filter="url(#rough2)">dwarf</text>
  <circle cx="360.0" cy="110.0" r="9.0" fill="#fff3d6" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="360.0" y="86.0" text-anchor="middle" font-size="10.6" font-weight="bold" fill="#8a6015" filter="url(#rough2)">站</text>
  <circle cx="560.0" cy="240.0" r="12.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="560.0" y="216.0" text-anchor="middle" font-size="10.6" font-weight="bold" fill="#446688" filter="url(#rough2)">集合点 q</text>
  <path d="M 148 122 L 540 235" stroke="#6b6b6b" stroke-width="1.4" fill="none" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="330.0" y="200.0" text-anchor="middle" font-size="10.8" fill="#6b6b6b" filter="url(#rough2)">d(q, pᵢ)：直接走</text>
  <path d="M 152 110 L 348 110" stroke="#446688" stroke-width="1.4" fill="none" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="250.0" y="100.0" text-anchor="middle" font-size="10.6" fill="#446688" filter="url(#rough2)">Aᵢ（到最近站）</text>
  <path d="M 370 118 L 548 232" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="470.0" y="160.0" text-anchor="middle" font-size="10.6" fill="#b85450" filter="url(#rough2)">B(q)（q 到最近站）</text>
  <text x="660.0" y="110.0" text-anchor="start" font-size="10.8" font-weight="bold" fill="#b85450" filter="url(#rough2)">瞬移 0 秒</text>
  <rect x="60.0" y="280.0" width="660.0" height="80.0" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="304.0" text-anchor="start" font-size="11.4" fill="#33506e" filter="url(#rough2)">所以第 i 个 dwarf 的用时 = min( d(pᵢ,q), Aᵢ + B(q) )，</text>
  <text x="74.0" y="326.0" text-anchor="start" font-size="11.4" fill="#33506e" filter="url(#rough2)">目标是最小化 max_i 这个值；q 必须是整点。</text>
  <text x="74.0" y="348.0" text-anchor="start" font-size="11.4" fill="#33506e" filter="url(#rough2)">k=0 时没有地铁，退化成曼哈顿 1-center。</text>
</svg>
