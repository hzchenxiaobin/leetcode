<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="400" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两种操作互为逆运算，状态只由指数 d 决定</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">A 让 d 加一、B 让 d 减一，d = (#heads - #tails)；k 步的 d 一定与 k 同奇偶</text>
  <line x1="90" y1="190" x2="790" y2="190" stroke="#8899aa" stroke-width="1.4" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="126" y="166" width="48" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="150.0" y="193.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">-3</text>
  <text x="150" y="232" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">d=-3</text>
  <g filter="url(#rough2)"><rect x="226" y="166" width="48" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="250.0" y="193.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">-2</text>
  <text x="250" y="232" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">d=-2</text>
  <g filter="url(#rough2)"><rect x="326" y="166" width="48" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="350.0" y="193.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">-1</text>
  <text x="350" y="232" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">d=-1</text>
  <g filter="url(#rough2)"><rect x="426" y="166" width="48" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="450.0" y="193.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="450" y="232" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">d=0</text>
  <g filter="url(#rough2)"><rect x="526" y="166" width="48" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="550.0" y="193.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="550" y="232" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">d=1</text>
  <g filter="url(#rough2)"><rect x="626" y="166" width="48" height="44" rx="4" fill="#f6d9d7" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="650.0" y="194.12" text-anchor="middle" font-size="17" fill="#2b2b2b" filter="url(#rough2)">✗</text>
  <text x="650" y="232" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">d=2</text>
  <g filter="url(#rough2)"><rect x="726" y="166" width="48" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="750.0" y="193.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="750" y="232" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">d=3</text>
  <text x="440" y="120" text-anchor="middle" font-size="13" fill="#b05a5a" filter="url(#rough2)">q^d = s 的那些 d 必须避开（第 k 步除外）</text>
  <text x="440" y="290" text-anchor="middle" font-size="13" fill="#3d6b2f" filter="url(#rough2)">从 d=0 出发、每步 ±1，走满 k 步后落在满足 q^d = s 的 d 上</text>
  <text x="440" y="318" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">若开局的 d=0 就命中 s（即 s 是恒等排列），直接判 NO</text>
  <text x="440" y="346" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">因为题面明确"开场黑板上写的就是 1..n"</text>
</svg>
