<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="380" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">交换相邻两格只动到 3 对相邻关系</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">其余相邻对的有序性由前缀 / 后缀标记 O(1) 查表得到，所以每个候选交换都是 O(1) 判定</text>
  <g filter="url(#rough2)"><rect x="150" y="150" width="66" height="48" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="183.0" y="180.12" text-anchor="middle" font-size="17" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="183" y="220" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="234" y="150" width="66" height="48" rx="4" fill="#f6d9d7" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="267.0" y="180.12" text-anchor="middle" font-size="17" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="267" y="220" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="318" y="150" width="66" height="48" rx="4" fill="#f6d9d7" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="351.0" y="180.12" text-anchor="middle" font-size="17" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="351" y="220" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="402" y="150" width="66" height="48" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="435.0" y="180.12" text-anchor="middle" font-size="17" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="435" y="220" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><rect x="486" y="150" width="66" height="48" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="519.0" y="180.12" text-anchor="middle" font-size="17" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <text x="519" y="220" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">5</text>
  <line x1="183" y1="142" x2="267" y2="142" stroke="#b05a5a" stroke-width="2.0" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="225" y="130" text-anchor="middle" font-size="12.5" fill="#b05a5a" filter="url(#rough2)">交换 i 与 i+1</text>
  <text x="150" y="262" text-anchor="end" font-size="13" fill="#2b2b2b" filter="url(#rough2)">只影响：</text>
  <text x="160" y="262" text-anchor="start" font-size="13" fill="#2f4a66" filter="url(#rough2)">(i-1,i+1)   (i,i+1)   (i,i+2)</text>
  <text x="440" y="306" text-anchor="middle" font-size="13" fill="#3d6b2f" filter="url(#rough2)">交换后 (i,i+1) 这一对的顺序必然颠倒：原来升序则此处必违反“非降”，</text>
  <text x="440" y="332" text-anchor="middle" font-size="13" fill="#3d6b2f" filter="url(#rough2)">于是整个数组仍有序当且仅当它“非增”——只需再核对另外两对与前后缀。</text>
</svg>
