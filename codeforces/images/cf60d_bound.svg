<svg xmlns="http://www.w3.org/2000/svg" width="740" height="380" viewBox="0 0 740 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="605"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="d1" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="740" height="380" fill="#fafafa"/>

  <text x="370" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">枚举范围：第三个元素最多是 √2 · max(aᵢ)</text>
  <path d="M 110 40 Q 370 46 610 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 直角边情形 -->
  <text x="60" y="80" font-size="13" font-weight="bold" fill="#2b4a68" filter="url(#rough2)">情形 A：两个给定值都是直角边</text>
  <polygon points="90,110 90,220 290,220" fill="#eef3f8" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="90" y1="116" x2="97" y2="116" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="97" y1="220" x2="97" y2="213" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="86" y="170" text-anchor="end" font-size="12" fill="#2b4a68" filter="url(#rough2)">x ≤ A</text>
  <text x="190" y="240" text-anchor="middle" font-size="12" fill="#2b4a68" filter="url(#rough2)">y ≤ A</text>
  <text x="215" y="150" font-size="12" font-weight="bold" fill="#8c3a37" filter="url(#rough2)">z = √(x²+y²) ≤ √2·A</text>
  <text x="215" y="170" font-size="11.5" fill="#8c3a37" filter="url(#rough2)">这就是枚举 z 的上界</text>

  <!-- 情形 B -->
  <text x="420" y="80" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">情形 B：其中一个是斜边</text>
  <polygon points="440,110 440,200 620,200" fill="#f4f8ee" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="520" y="190" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">z ≤ A</text>
  <text x="436" y="160" text-anchor="end" font-size="12" fill="#2f5223" filter="url(#rough2)">y</text>
  <text x="530" y="222" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">斜边已 ≤ A，第三边更小</text>

  <!-- 数字 -->
  <rect x="60" y="258" width="620" height="56" rx="8" fill="#fdf6e6" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="370" y="280" text-anchor="middle" font-size="12.5" fill="#6b4a10" filter="url(#rough2)">A = 10⁷ 时 √2·A ≈ 14142136，m ≤ √(14142136) ≈ 3760，本原三元组约 2×10⁶ 个</text>
  <text x="370" y="302" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">（若只枚举 z ≤ 10⁷ 就会漏掉「两条直角边都在输入里、斜边超过 10⁷」的配对）</text>

  <!-- 结论 -->
  <rect x="60" y="330" width="620" height="38" rx="8" fill="#f4f8ee" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="370" y="354" text-anchor="middle" font-size="12.5" fill="#2f5223" filter="url(#rough2)">取 maxZ = ⌊√(2·maxA²)⌋+2，把所有 z ≤ maxZ 的本原三元组枚举一遍即可，复杂度 O(maxA + n α)</text>
</svg>
