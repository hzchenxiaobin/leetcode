<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="720" height="320" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">hydra：u—v 相邻，u 挂 h 个头，v 挂 t 条尾，共 h+t+2 个点</text>
  <rect x="330" y="50" width="70" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="365" y="77" text-anchor="middle" font-size="14" fill="#2f5223">u</text>
  <rect x="330" y="140" width="70" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="365" y="167" text-anchor="middle" font-size="14" fill="#2f5223">v</text>
  <line x1="365" y1="96" x2="365" y2="136" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="80" y="190" width="70" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="115" y="214" text-anchor="middle" font-size="11" fill="#2f4a66">head1</text>
  <line x1="120" y1="190" x2="350" y2="186" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="170" y="190" width="70" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="205" y="214" text-anchor="middle" font-size="11" fill="#2f4a66">head2</text>
  <line x1="210" y1="190" x2="354" y2="186" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="260" y="190" width="70" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="295" y="214" text-anchor="middle" font-size="11" fill="#2f4a66">head3</text>
  <line x1="300" y1="190" x2="358" y2="186" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="440" y="240" width="70" height="40" rx="8" fill="#fde9d9" stroke="#b4652a" stroke-width="1.5"/>
  <text x="475" y="264" text-anchor="middle" font-size="11" fill="#7a4b22">tail1</text>
  <line x1="460" y1="240" x2="380" y2="186" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="520" y="240" width="70" height="40" rx="8" fill="#fde9d9" stroke="#b4652a" stroke-width="1.5"/>
  <text x="555" y="264" text-anchor="middle" font-size="11" fill="#7a4b22">tail2</text>
  <line x1="530" y1="240" x2="380" y2="186" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="600" y="240" width="70" height="40" rx="8" fill="#fde9d9" stroke="#b4652a" stroke-width="1.5"/>
  <text x="635" y="264" text-anchor="middle" font-size="11" fill="#7a4b22">tail3</text>
  <line x1="600" y1="240" x2="380" y2="186" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="40" y="300" text-anchor="start" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">样例 1 的解：u=2、v=5，头 {1,3}，尾 {4,6,7}（h=2, t=3）</text>
</svg>
