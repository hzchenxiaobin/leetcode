<svg xmlns="http://www.w3.org/2000/svg" width="760" height="386" viewBox="0 0 760 386"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c9801f"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a8524a"/>
    </marker>
  </defs>
  <rect width="760" height="386" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">bulls 与 cows 怎么数：目标 0123，猜测 1263</text>
  <text x="64.0" y="102.0" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">目标</text>
  <rect x="140.0" y="74.0" width="70.0" height="44.0" fill="#f4f9f2" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="175.0" y="102.5" text-anchor="middle" font-size="18" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <rect x="224.0" y="74.0" width="70.0" height="44.0" fill="#f4f9f2" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="259.0" y="102.5" text-anchor="middle" font-size="18" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <rect x="308.0" y="74.0" width="70.0" height="44.0" fill="#f4f9f2" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="343.0" y="102.5" text-anchor="middle" font-size="18" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <rect x="392.0" y="74.0" width="70.0" height="44.0" fill="#f4f9f2" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="427.0" y="102.5" text-anchor="middle" font-size="18" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="64.0" y="174.0" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">猜测</text>
  <rect x="140.0" y="146.0" width="70.0" height="44.0" fill="#f7f9fc" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="175.0" y="174.5" text-anchor="middle" font-size="18" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <rect x="224.0" y="146.0" width="70.0" height="44.0" fill="#f7f9fc" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="259.0" y="174.5" text-anchor="middle" font-size="18" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <rect x="308.0" y="146.0" width="70.0" height="44.0" fill="#f7f9fc" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="343.0" y="174.5" text-anchor="middle" font-size="18" fill="#2b2b2b" filter="url(#rough2)">6</text>
  <rect x="392.0" y="146.0" width="70.0" height="44.0" fill="#f7f9fc" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="427.0" y="174.5" text-anchor="middle" font-size="18" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="492.0" y="144.0" text-anchor="start" font-size="11.5" fill="#c9801f" font-weight="bold" filter="url(#rough2)">下标 3 相同</text>
  <text x="492.0" y="164.0" text-anchor="start" font-size="11.5" fill="#c9801f" font-weight="bold" filter="url(#rough2)">→ 1 个 bull</text>
  <text x="64.0" y="200.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">共同数字 {1, 2, 3} 共 K = 3 个；位置相同的 B = 1 个；</text>
  <text x="64.0" y="222.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">所以 cows = K − B = 2。（数字 0 不在猜测里，不贡献 cow）</text>
  <rect x="40.0" y="244.0" width="680.0" height="62.0" rx="8" fill="#fdf3e3" stroke="#c9801f" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56.0" y="270.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">bulls = 位置与数字都相同的位数 B；</text>
  <text x="56.0" y="292.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">cows = 两串共同数字数 K − B。这里 B=1、K=3 → 回复 1 bull 2 cows。</text>
  <rect x="40.0" y="320.0" width="680.0" height="56.0" rx="8" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="54.0" y="344.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">cows 必须用 K − B 计算，直接把「位置不同但数字相同」的数一遍也可以，</text>
  <text x="54.0" y="366.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">但绝不能把 bulls 也重复算进 cows。</text>
</svg>
