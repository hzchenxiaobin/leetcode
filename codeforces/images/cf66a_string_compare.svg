<svg xmlns="http://www.w3.org/2000/svg" width="840" height="420" viewBox="0 0 840 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="840" height="420" fill="#fafafa"/>

  <text x="420" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">十进制串比较：先比长度，再比字典序</text>

  <!-- 情形一 -->
  <text x="40" y="70" font-size="13.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">① 长度相同：逐位比较（n = 130，上界 127）</text>

  <g filter="url(#rough2)">
    <rect x="100" y="86" width="44" height="44" rx="6" fill="#cfe0f5" stroke="#446688" stroke-width="1.4"/>
    <rect x="160" y="86" width="44" height="44" rx="6" fill="#cfe0f5" stroke="#446688" stroke-width="1.4"/>
    <rect x="220" y="86" width="44" height="44" rx="6" fill="#f6d9d7" stroke="#b85450" stroke-width="1.4"/>
    <text x="122" y="115" text-anchor="middle" font-size="20" fill="#2f4a66">1</text>
    <text x="182" y="115" text-anchor="middle" font-size="20" fill="#2f4a66">3</text>
    <text x="242" y="115" text-anchor="middle" font-size="20" fill="#8a2b28">0</text>

    <rect x="100" y="146" width="44" height="44" rx="6" fill="#d9ecd4" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="160" y="146" width="44" height="44" rx="6" fill="#d9ecd4" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="220" y="146" width="44" height="44" rx="6" fill="#f6d9d7" stroke="#b85450" stroke-width="1.4"/>
    <text x="122" y="175" text-anchor="middle" font-size="20" fill="#2f5223">1</text>
    <text x="182" y="175" text-anchor="middle" font-size="20" fill="#2f5223">2</text>
    <text x="242" y="175" text-anchor="middle" font-size="20" fill="#8a2b28">7</text>

    <text x="60" y="115" text-anchor="end" font-size="11" fill="#666666">n</text>
    <text x="60" y="175" text-anchor="end" font-size="11" fill="#666666">127</text>
    <text x="292" y="118" font-size="11.5" fill="#8a2b28">第 3 位 3 &gt; 7</text>
    <text x="292" y="178" font-size="11.5" fill="#2f5223">前两位相同</text>
  </g>

  <text x="470" y="115" font-size="12" fill="#2b2b2b" filter="url(#rough2)">等长 ⇒ 字典序决定大小：</text>
  <text x="470" y="140" font-size="12" fill="#2b2b2b" filter="url(#rough2)">「130」&gt;「127」，byte 放不下</text>
  <text x="470" y="170" font-size="11.5" fill="#777777" filter="url(#rough2)">只需扫到第一个不同的字符</text>

  <!-- 情形二 -->
  <text x="40" y="240" font-size="13.5" font-weight="bold" fill="#7a5a1b" filter="url(#rough2)">② 长度不同：位数即数量级（n 有 39 位，long 上界 19 位）</text>

  <g filter="url(#rough2)">
    <text x="100" y="272" font-size="11" fill="#2b2b2b">n（39 位数字）</text>
    <rect x="100" y="280" width="390" height="22" rx="4" fill="#cfe0f5" stroke="#446688" stroke-width="1.3"/>
    <text x="430" y="270" font-size="11" fill="#2f4a66">更长 ⇒ 更大</text>

    <text x="100" y="330" font-size="11" fill="#2b2b2b">long 上界 9223372036854775807（19 位）</text>
    <rect x="100" y="338" width="190" height="22" rx="4" fill="#f6d9d7" stroke="#b85450" stroke-width="1.3"/>
    <text x="300" y="354" font-size="11" fill="#8a2b28">更短 ⇒ 更小</text>

    
  </g>
  <text x="540" y="300" font-size="12" fill="#2b2b2b" filter="url(#rough2)">位数已经超过 long，</text>
  <text x="540" y="324" font-size="12" fill="#2b2b2b" filter="url(#rough2)">不必逐位看：直接判 BigInteger</text>
  <text x="540" y="352" font-size="11.5" fill="#777777" filter="url(#rough2)">（39 &gt; 19，长度比较 O(1)）</text>

  <text x="40" y="400" font-size="11" fill="#666666" filter="url(#rough2)">前提是「没有前导零」：只有位数相同，才需要走到字典序比较。</text>
</svg>
