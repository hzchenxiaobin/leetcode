<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="720" height="440" fill="#fafafa"/>
  <text x="360.0" y="33" font-size="20" font-weight="bold" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">不包含 P 的三角形都落在某个半平面内</text>
  <path d="M 261 44 Q 360.0 50 459 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 250.0 105.0 L 362.6 170.0 L 362.6 300.0 L 250.0 365.0 L 137.4 300.0 L 137.4 170.0 Z" stroke="#446688" stroke-width="2.0" fill="#eef4fb" filter="url(#rough2)"/>
  <circle cx="250.0" cy="105.0" r="6" fill="#22303f" filter="url(#rough2)"/>
  <circle cx="362.583302491977" cy="170.0" r="6" fill="#22303f" filter="url(#rough2)"/>
  <circle cx="362.58330249197707" cy="300.0" r="6" fill="#22303f" filter="url(#rough2)"/>
  <circle cx="250.0" cy="365.0" r="6" fill="#22303f" filter="url(#rough2)"/>
  <circle cx="137.416697508023" cy="300.00000000000006" r="6" fill="#22303f" filter="url(#rough2)"/>
  <circle cx="137.416697508023" cy="170.0" r="6" fill="#22303f" filter="url(#rough2)"/>
  <path d="M 137.4 170.0 L 250.0 105.0 L 362.6 170.0 Z" stroke="#4a7a3a" stroke-width="1.6" fill="#e6f4ea" filter="url(#rough2)"/>
  <circle cx="260" cy="225" r="7" fill="#b85450" filter="url(#rough2)"/>
  <text x="270" y="215" font-size="13" font-weight="bold" fill="#7a3b36" text-anchor="start" filter="url(#rough2)">P</text>
  <path d="M 110 249 L 420 185" stroke="#6b4f9a" stroke-width="1.5" fill="none" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="250" y="100" font-size="11" font-weight="bold" fill="#2f5223" text-anchor="middle" filter="url(#rough2)">三个顶点在同一侧 → 三角形不含 P</text>
  <rect x="450" y="110" width="240" height="200" rx="8" fill="#f7f9fc" stroke="#9aa8b8" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="466" y="136" font-size="12" font-weight="bold" fill="#2b2b2b" text-anchor="start" filter="url(#rough2)">互补计数：</text>
  <text x="466" y="160" font-size="11" font-weight="normal" fill="#333" text-anchor="start" filter="url(#rough2)">答案 = C(n,3) − 不含 P 的</text>
  <text x="466" y="186" font-size="10.5" font-weight="normal" fill="#555" text-anchor="start" filter="url(#rough2)">不含 P ⇔ 三顶点在</text>
  <text x="466" y="204" font-size="10.5" font-weight="normal" fill="#555" text-anchor="start" filter="url(#rough2)">某个长度 &lt; π 的开区间</text>
  <text x="466" y="232" font-size="10.5" font-weight="normal" fill="#555" text-anchor="start" filter="url(#rough2)">按极角序枚举“最前”顶点</text>
  <text x="466" y="250" font-size="10.5" font-weight="normal" fill="#555" text-anchor="start" filter="url(#rough2)">每个三角形恰被数一次</text>
  <text x="466" y="280" font-size="10.5" font-weight="bold" fill="#333" text-anchor="start" filter="url(#rough2)">C(n,3) ≈ 1.67e14</text>
  <text x="360" y="410" font-size="10.5" font-weight="normal" fill="#666" text-anchor="middle" filter="url(#rough2)">紫色虚线是过 P 的分离直线；P 在多边形内时，顶点绕 P 的极角顺序 = 顶点顺序</text>
</svg>
