<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="461"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="360" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">状态 (行, 列, 余数)：从底行往上推</text>
  <g filter="url(#rough2)">
    <rect x="260" y="60" width="200" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="360" y="89" text-anchor="middle" font-size="13" fill="#2f4a66">dp[i+1][j-1][r]</text>
    <rect x="260" y="146" width="200" height="46" rx="8" fill="#eef4ec" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="360" y="175" text-anchor="middle" font-size="13" fill="#2f5223">dp[i][j][(r+v)%K]</text>
    <rect x="260" y="232" width="200" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="360" y="261" text-anchor="middle" font-size="13" fill="#2f4a66">dp[i+1][j+1][r]</text>
  </g>
  <g stroke="#446688" stroke-width="1.8" filter="url(#rough2)">
    <line x1="300" y1="106" x2="340" y2="142" marker-end="url(#ar)"/>
    <line x1="420" y1="106" x2="380" y2="142" marker-end="url(#ar)"/>
    <line x1="300" y1="232" x2="340" y2="196" marker-end="url(#ar)"/>
    <line x1="420" y1="232" x2="380" y2="196" marker-end="url(#ar)"/>
  </g>
  <text x="120" y="170" font-size="12" fill="#2f4a66" filter="url(#rough2)">+v（当前格豆子）</text>
  <rect x="70" y="296" width="580" height="52" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="86" y="320" font-size="12.5" fill="#8a6015" filter="url(#rough2)">答案 = max_j dp[0][j][0]；记录前驱以还原起点列与 L/R 串。</text>
  <text x="86" y="340" font-size="12" fill="#8a6015" filter="url(#rough2)">K = k+1；k=0 时 K=1，任何总和都满足。</text>
</svg>
