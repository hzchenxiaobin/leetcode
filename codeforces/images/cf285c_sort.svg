<svg xmlns="http://www.w3.org/2000/svg" width="700" height="310" viewBox="0 0 700 310"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="341"/>
    <feDisplacementMap in="SourceGraphic" scale="1.5"/></filter></defs>
  <rect width="700" height="310" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">重排 + 排序：把第 i 小的元素改成 i</text>
  <path d="M 130 40 Q 350 46 570 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="56" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="13" fill="#22314a" filter="url(#rough2)">观察 1：可以把 a 任意重排后再逐个改成排列，所以"谁改成几"可以自由配对。</text>
  <text x="76" y="104" font-size="12" fill="#2f4a66" filter="url(#rough2)">目标集合固定是 {1,2,…,n}，代价是 Σ|a_{σ(i)} − i|。</text>
  <g filter="url(#rough2)"><rect x="60" y="126" width="580" height="56" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="76" y="150" font-size="13" fill="#8a6015" filter="url(#rough2)">观察 2（交换论证）：若 a ≤ b 而配到 i &gt; j，交换成 (a→j, b→i) 不会变差。</text>
  <text x="76" y="172" font-size="12" fill="#8a6015" filter="url(#rough2)">⇒ 最优配对 = 排序后一一对应：sorted_a[i] ↔ i。</text>
  <g filter="url(#rough2)"><rect x="60" y="196" width="580" height="86" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="220" font-size="12.5" fill="#2f5223" filter="url(#rough2)">样例 1：[3,0] → 排序 [0,3] ⇒ |0−1|+|3−2| = 1+1 = 2 ✓</text>
  <text x="76" y="244" font-size="12.5" fill="#2f5223" filter="url(#rough2)">样例 2：[−1,−1,2] → |−1−1|+|−1−2|+|2−3| = 2+3+1 = 6 ✓</text>
  <text x="76" y="268" font-size="12" fill="#2f5223" filter="url(#rough2)">答案可达 3·10⁵ · 2·10⁹ ≈ 6·10¹⁴ ⇒ 必须用 64 位整数。</text>
</svg>
