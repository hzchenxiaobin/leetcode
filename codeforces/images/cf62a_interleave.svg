<text x="380" y="330" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#c0392b" font-weight="normal" text-anchor="middle" filter="url(#rough2)">每个空隙最多 2 个男指（不能 3 个男指相连）</text>
<text x="380" y="380" font-size="15" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#1a5fb4" font-weight="normal" text-anchor="middle" filter="url(#rough2)">于是：女指数 a 固定时，男指数 b 必须满足 a−1 ≤ b ≤ 2(a+1)</text>
