<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arr3" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="800" height="440" fill="#fafafa"/>

  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两种跳法 ⇒ 最短路一定是 (左)? 右* (左)?</text>
  <path d="M 196 40 Q 400 47 604 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 位置格子 p = [2,5,1,4,3,6] -->
  <text x="36" y="80" font-size="12" fill="#66788c" filter="url(#rough2)">p = [2, 5, 1, 4, 3, 6]，取 i = 3：</text>
  <g font-size="13">
    <text x="60" y="104" text-anchor="middle" font-size="10.5" fill="#8899aa" filter="url(#rough2)">1</text>
    <rect x="36" y="110" width="48" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="60" y="137" text-anchor="middle" fill="#2f4a66" filter="url(#rough2)">2</text>

    <text x="114" y="104" text-anchor="middle" font-size="10.5" fill="#8899aa" filter="url(#rough2)">2</text>
    <rect x="90" y="110" width="48" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="114" y="137" text-anchor="middle" fill="#2f4a66" filter="url(#rough2)">5</text>

    <text x="168" y="104" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">i=3</text>
    <rect x="144" y="110" width="48" height="42" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.1" filter="url(#rough2)"/>
    <text x="168" y="137" text-anchor="middle" fill="#8a6015" filter="url(#rough2)">1</text>

    <text x="222" y="104" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">r=4</text>
    <rect x="198" y="110" width="48" height="42" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="222" y="137" text-anchor="middle" fill="#3c5e2e" filter="url(#rough2)">4</text>

    <text x="276" y="104" text-anchor="middle" font-size="10.5" fill="#8899aa" filter="url(#rough2)">5</text>
    <rect x="252" y="110" width="48" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="276" y="137" text-anchor="middle" fill="#2f4a66" filter="url(#rough2)">3</text>

    <text x="330" y="104" text-anchor="middle" font-size="10.5" fill="#8899aa" filter="url(#rough2)">6</text>
    <rect x="306" y="110" width="48" height="42" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="330" y="137" text-anchor="middle" fill="#2f4a66" filter="url(#rough2)">6</text>
  </g>

  <!-- 右跳 -->
  <path d="M 168 156 Q 195 192 220 156" stroke="#4a7a3a" stroke-width="1.9" fill="none"
        marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="196" y="212" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">右跳 → 首个更大 r_i</text>
  <text x="196" y="228" text-anchor="middle" font-size="11" fill="#5c7c4c" filter="url(#rough2)">目标唯一，1 步</text>

  <!-- 左跳 -->
  <path d="M 168 162 Q 108 238 52 162" stroke="#b85450" stroke-width="1.9" fill="none"
        marker-end="url(#arr3)" filter="url(#rough2)"/>
  <text x="110" y="262" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">左跳：任意更小下标，1 步</text>

  <!-- 右侧：形状与两条禁令 -->
  <rect x="404" y="62" width="368" height="62" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="588" y="86" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">形状：(左)? → (右)* → (左)?</text>
  <text x="588" y="108" text-anchor="middle" font-size="11.5" fill="#3d5a78" filter="url(#rough2)">左移只可能出现在开头和结尾，各至多一次</text>

  <rect x="404" y="136" width="368" height="54" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="588" y="158" text-anchor="middle" font-size="13" fill="#a14340" filter="url(#rough2)">右 → 左 → 右  ✗</text>
  <text x="588" y="178" text-anchor="middle" font-size="11.5" fill="#b06a66" filter="url(#rough2)">左移到 c 后 c 的右跳不会越过原落点，可并成 2 步</text>

  <rect x="404" y="202" width="368" height="54" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="588" y="224" text-anchor="middle" font-size="13" fill="#a14340" filter="url(#rough2)">左 → 左  ✗</text>
  <text x="588" y="244" text-anchor="middle" font-size="11.5" fill="#b06a66" filter="url(#rough2)">两次左移等价于一次（第一步直接跳到终点）</text>

  <!-- 底部：三种基础距离 -->
  <rect x="36" y="300" width="232" height="86" rx="9" fill="#f2f7ff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="152" y="326" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">j &lt; i</text>
  <text x="152" y="350" text-anchor="middle" font-size="12" fill="#3d5a78" filter="url(#rough2)">f = 1（直接左跳）</text>
  <text x="152" y="371" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">共 i−1 个目标</text>

  <rect x="284" y="300" width="232" height="86" rx="9" fill="#eefaf0" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="400" y="326" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">j = r_i</text>
  <text x="400" y="350" text-anchor="middle" font-size="12" fill="#4a6a3a" filter="url(#rough2)">f = 1（唯一右跳）</text>
  <text x="400" y="371" text-anchor="middle" font-size="11.5" fill="#6d8a5d" filter="url(#rough2)">当 r_i ≤ n 时存在</text>

  <rect x="532" y="300" width="232" height="86" rx="9" fill="#fffaf0" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="648" y="326" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">i &lt; j &lt; r_i</text>
  <text x="648" y="350" text-anchor="middle" font-size="12" fill="#94702a" filter="url(#rough2)">f = 2（右跳再左跳）</text>
  <text x="648" y="371" text-anchor="middle" font-size="11.5" fill="#a58a55" filter="url(#rough2)">不可能为 1：右跳只到 r_i</text>

  <text x="400" y="416" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">真正的难点只剩：j &gt; r_i 时怎么走？—— 见下一张图的“网关”</text>
</svg>
