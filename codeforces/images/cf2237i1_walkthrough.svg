<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="720" height="380" fill="#fafafa" filter="url(#rough2)"/>

  <text x="360" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">
    样例 1：4 种染色 → 3 个不同的遍历列表
  </text>

  <rect x="50" y="56" width="130" height="34" rx="6" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="115" y="79" text-anchor="middle" font-size="13" fill="#2b3f55" filter="url(#rough2)">(c₂, c₄)</text>
  <rect x="196" y="56" width="310" height="34" rx="6" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="351" y="79" text-anchor="middle" font-size="13" fill="#2b3f55" filter="url(#rough2)">遍历列表 p</text>
  <rect x="522" y="56" width="150" height="34" rx="6" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="597" y="79" text-anchor="middle" font-size="13" fill="#2b3f55" filter="url(#rough2)">规范？</text>

  <rect x="50" y="100" width="130" height="34" rx="6" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="115" y="123" text-anchor="middle" font-size="13" fill="#2f4a26" filter="url(#rough2)">(0, 0)</text>
  <rect x="196" y="100" width="310" height="34" rx="6" fill="#f7fbf7"
        stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="351" y="123" text-anchor="middle" font-size="13" fill="#2f4a26" filter="url(#rough2)">1 2 3 4</text>
  <rect x="522" y="100" width="150" height="34" rx="6" fill="#f7fbf7"
        stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="597" y="123" text-anchor="middle" font-size="13" fill="#2f4a26" filter="url(#rough2)">是 ✔</text>

  <rect x="50" y="144" width="130" height="34" rx="6" fill="#fff8e1"
        stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="115" y="167" text-anchor="middle" font-size="13" fill="#7a5a1e" filter="url(#rough2)">(0, 1)</text>
  <rect x="196" y="144" width="310" height="34" rx="6" fill="#fefcf3"
        stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="351" y="167" text-anchor="middle" font-size="13" fill="#7a5a1e" filter="url(#rough2)">1 2 3 4</text>
  <rect x="522" y="144" width="150" height="34" rx="6" fill="#fefcf3"
        stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="597" y="167" text-anchor="middle" font-size="13" fill="#7a5a1e" filter="url(#rough2)">
    否（同第 1 行）
  </text>

  <rect x="50" y="188" width="130" height="34" rx="6" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="115" y="211" text-anchor="middle" font-size="13" fill="#2f4a26" filter="url(#rough2)">(1, 0)</text>
  <rect x="196" y="188" width="310" height="34" rx="6" fill="#f7fbf7"
        stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="351" y="211" text-anchor="middle" font-size="13" fill="#2f4a26" filter="url(#rough2)">1 3 4 2</text>
  <rect x="522" y="188" width="150" height="34" rx="6" fill="#f7fbf7"
        stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="597" y="211" text-anchor="middle" font-size="13" fill="#2f4a26" filter="url(#rough2)">是 ✔</text>

  <rect x="50" y="232" width="130" height="34" rx="6" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="115" y="255" text-anchor="middle" font-size="13" fill="#2f4a26" filter="url(#rough2)">(1, 1)</text>
  <rect x="196" y="232" width="310" height="34" rx="6" fill="#f7fbf7"
        stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="351" y="255" text-anchor="middle" font-size="13" fill="#2f4a26" filter="url(#rough2)">1 3 2 4</text>
  <rect x="522" y="232" width="150" height="34" rx="6" fill="#f7fbf7"
        stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="597" y="255" text-anchor="middle" font-size="13" fill="#2f4a26" filter="url(#rough2)">是 ✔</text>

  <text x="360" y="306" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    固定 c₃ = 0；不同 p 只有 1 2 3 4、1 3 4 2、1 3 2 4
  </text>
  <text x="360" y="336" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">
    答案 = 3
  </text>
  <text x="360" y="362" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">
    (0,1) 与 (0,0) 给出相同 p：贪心规范染色会把 c₄ 改判为 0
  </text>
</svg>
