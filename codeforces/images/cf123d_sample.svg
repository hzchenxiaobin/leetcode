<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="167"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="300" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">样例 1：s = aaaa 的四个状态</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">每个状态的 len 差都是 1，贡献 10 + 6 + 3 + 1 = 20</text>
  <g filter="url(#rough2)"><rect x="70" y="96" width="180" height="96" rx="6" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="160" y="122" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="160" y="148" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">len=1，c=4</text>
  <text x="160" y="176" text-anchor="middle" font-size="12" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">贡献 10</text>
  <text x="265" y="150" text-anchor="middle" font-size="16" fill="#666666" filter="url(#rough2)">+</text>
  <g filter="url(#rough2)"><rect x="280" y="96" width="180" height="96" rx="6" fill="#f6e3c4" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="370" y="122" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">aa</text>
  <text x="370" y="148" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">len=2，c=3</text>
  <text x="370" y="176" text-anchor="middle" font-size="12" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">贡献 6</text>
  <text x="475" y="150" text-anchor="middle" font-size="16" fill="#666666" filter="url(#rough2)">+</text>
  <g filter="url(#rough2)"><rect x="490" y="96" width="180" height="96" rx="6" fill="#dcecd2" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="580" y="122" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">aaa</text>
  <text x="580" y="148" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">len=3，c=2</text>
  <text x="580" y="176" text-anchor="middle" font-size="12" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">贡献 3</text>
  <text x="685" y="150" text-anchor="middle" font-size="16" fill="#666666" filter="url(#rough2)">+</text>
  <g filter="url(#rough2)"><rect x="700" y="96" width="180" height="96" rx="6" fill="#f3d9d6" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="790" y="122" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">aaaa</text>
  <text x="790" y="148" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">len=4，c=1</text>
  <text x="790" y="176" text-anchor="middle" font-size="12" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">贡献 1</text>
  <text x="450" y="232" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">10 + 6 + 3 + 1 = 20</text>
  <text x="450" y="262" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">对应的 F 值：a→10、aa→6、aaa→3、aaaa→1</text>
</svg>
