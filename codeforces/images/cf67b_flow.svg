<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr67e" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="360" fill="#fafafa"/>
  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">贪心流程：挑最小 ready 值，扣减左侧配额，重复 n 次</text>
  <path d="M 150 42 Q 360 48 570 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 开始 -->
  <g filter="url(#rough2)">
    <rect x="60" y="70" width="170" height="52" rx="10" fill="#fde8e6" stroke="#b85450" stroke-width="1.7"/>
  </g>
  <text x="145" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">need[i] ← b[i]</text>
  <text x="145" y="112" text-anchor="middle" font-size="11" fill="#8a2b28" filter="url(#rough2)">所有值未使用</text>

  <path d="M 230 96 L 290 96" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr67e)" filter="url(#rough2)"/>

  <!-- 找最小 ready -->
  <g filter="url(#rough2)">
    <rect x="290" y="64" width="180" height="64" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.7"/>
  </g>
  <text x="380" y="88" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">v = min{未用值 : need[v] = 0}</text>
  <text x="380" y="108" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">（引理 3 保证一定存在）</text>

  <path d="M 470 96 L 530 96" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr67e)" filter="url(#rough2)"/>

  <!-- 放下 + 扣减 -->
  <g filter="url(#rough2)">
    <rect x="530" y="64" width="150" height="64" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7"/>
  </g>
  <text x="605" y="86" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">输出 v，标记已用</text>
  <text x="605" y="106" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">对 i ≤ v−k 且未用：need[i]−−</text>

  <!-- 回边 -->
  <path d="M 605 128 L 605 168 L 145 168 L 145 122" stroke="#b85450" stroke-width="1.6" fill="none"
        marker-end="url(#arr67e)" filter="url(#rough2)"/>
  <text x="360" y="160" text-anchor="middle" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">还有未放置的值 → 回到"找最小 ready"</text>

  <!-- 结束 -->
  <g filter="url(#rough2)">
    <rect x="290" y="196" width="180" height="44" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7"/>
  </g>
  <text x="380" y="223" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5a1b" filter="url(#rough2)">放了 n 个值 → 输出答案</text>
  <path d="M 380 168 L 380 196" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr67e)" filter="url(#rough2)"/>
  <text x="392" y="186" font-size="11" fill="#2f4a66" filter="url(#rough2)">放完</text>

  <rect x="60" y="262" width="600" height="80" rx="10" fill="#f4f0fa" stroke="#7a4a8a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="76" y="286" font-size="12.5" font-weight="bold" fill="#5a3a6a" filter="url(#rough2)">为什么"最小"就是字典序最小</text>
  <text x="76" y="308" font-size="11.5" fill="#5a3a6a" filter="url(#rough2)">任何合法排列在这一步都只能放 ready 值（引理 1），所以它的这一位 ≥ 我们挑的最小值</text>
  <text x="76" y="328" font-size="11.5" fill="#5a3a6a" filter="url(#rough2)">而引理 3 保证我们挑完之后仍能补全，逐位归纳即得字典序最小</text>
</svg>
