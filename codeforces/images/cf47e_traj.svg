<svg xmlns="http://www.w3.org/2000/svg" width="760" height="352" viewBox="0 0 760 352"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="503"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="352" fill="#fafafa"/>

  <text x="380" y="28" text-anchor="middle" font-size="17.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">E：抛物线轨迹与“第一堵挡住的墙”</text>
  <path d="M 150 38 Q 380 43 610 38" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <line x1="60" y1="250" x2="700" y2="250" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="700" y="268" font-size="9.5" fill="#777" filter="url(#rough2)">x</text>
  <line x1="60" y1="250" x2="60" y2="90" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="46" y="86" font-size="9.5" fill="#777" filter="url(#rough2)">y</text>

  <!-- 抛物线（两条） -->
  <path d="M 60 250 Q 230 30 400 250" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 60 250 Q 150 120 240 250" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>

  <!-- 墙 -->
  <line x1="200" y1="250" x2="200" y2="150" stroke="#b85450" stroke-width="3" filter="url(#rough2)"/>
  <text x="200" y="290" text-anchor="middle" font-size="9.5" fill="#8c3a36" filter="url(#rough2)">墙 1</text>
  <line x1="290" y1="250" x2="290" y2="120" stroke="#b85450" stroke-width="3" filter="url(#rough2)"/>
  <text x="290" y="290" text-anchor="middle" font-size="9.5" fill="#8c3a36" filter="url(#rough2)">墙 2</text>
  <line x1="350" y1="250" x2="350" y2="190" stroke="#b85450" stroke-width="3" filter="url(#rough2)"/>
  <text x="350" y="290" text-anchor="middle" font-size="9.5" fill="#8c3a36" filter="url(#rough2)">墙 3</text>

  <circle cx="200" cy="196" r="5" fill="#446688" filter="url(#rough2)"/>
  <text x="214" y="200" font-size="9.5" fill="#2f4a66" filter="url(#rough2)">卡在墙 1</text>
  <circle cx="290" cy="176" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="304" y="180" font-size="9.5" fill="#2f5223" filter="url(#rough2)">卡在墙 2</text>

  <rect x="420" y="70" width="316" height="118" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="432" y="94" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">轨迹公式（消去 t）</text>
  <text x="432" y="118" font-size="10.5" fill="#3c5e88" filter="url(#rough2)">y(x) = x·tanα − g·x²/(2V²·cos²α)</text>
  <text x="432" y="140" font-size="10.5" fill="#3c5e88" filter="url(#rough2)">= x·u − c·(1+u²)，u = tanα，c = g x²/(2V²)</text>
  <text x="432" y="162" font-size="10.5" fill="#3c5e88" filter="url(#rough2)">撞墙条件：0 ≤ y(x) ≤ 墙高 y_w</text>
  <text x="432" y="182" font-size="10" fill="#8c3a36" filter="url(#rough2)">落地：y=0，射程 V²·sin(2α)/g</text>

  <rect x="420" y="200" width="316" height="80" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="432" y="222" font-size="11" fill="#8a6015" filter="url(#rough2)">每发炮弹：按 x 从小到大找第一堵</text>
  <text x="432" y="244" font-size="11" fill="#8a6015" filter="url(#rough2)">满足 0 ≤ y(x_i) ≤ y_i 的墙，卡在那里；</text>
  <text x="432" y="266" font-size="11" fill="#8a6015" filter="url(#rough2)">都没碰到就落在射程处（y = 0）。</text>

  <text x="60" y="322" font-size="10" fill="#777" filter="url(#rough2)">暴力 O(n·m) 在 n=10⁴、m=10⁵ 时是 10⁹，太慢；下一张图给出把“撞墙”翻译成 u 的区间、再扫描的做法。</text>
  <text x="60" y="338" font-size="10" fill="#777" filter="url(#rough2)">注意 α &lt; π/4 ⇒ u = tanα ∈ (0, 1)，这个范围让区间端点不会跑飞。</text>
</svg>
