<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2b2b2b"/>
    </marker>
    <marker id="ar3" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="760" height="400" fill="#fafafa"/>
  <text x="380" y="30" text-anchor="middle" font-size="17.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">把 a / rev(a) 约分成既约分数：a 与 b 能配对 ⟺ 两个键互为"交换"</text>
  <path d="M 80 40 Q 380 46 680 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 左列：a 的键 -->
  <rect x="30" y="60" width="220" height="112" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="140" y="82" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">a 的键 key(a)</text>
  <text x="140" y="106" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">a = 12，rev(a) = 21</text>
  <text x="140" y="126" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">g = gcd(12,21) = 3</text>
  <text x="140" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f4a6b" filter="url(#rough2)">key(12) = (4, 7)</text>
  <text x="140" y="166" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">即分数 12/21 = 4/7</text>

  <!-- 右列：b 的键 -->
  <rect x="510" y="60" width="220" height="112" rx="10" fill="#d7ecd9" stroke="#2f7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="620" y="82" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f5226" filter="url(#rough2)">b 的键 key(b)</text>
  <text x="620" y="106" text-anchor="middle" font-size="12" fill="#1f5226" filter="url(#rough2)">b = 21，rev(b) = 12</text>
  <text x="620" y="126" text-anchor="middle" font-size="12" fill="#1f5226" filter="url(#rough2)">g = gcd(21,12) = 3</text>
  <text x="620" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f5226" filter="url(#rough2)">key(21) = (7, 4)</text>
  <text x="620" y="166" text-anchor="middle" font-size="10.5" fill="#1f5226" filter="url(#rough2)">即分数 21/12 = 7/4</text>

  <!-- 中间箭头：交换 -->
  <path d="M 254 118 L 506 118" stroke="#b85450" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#ar3)" filter="url(#rough2)"/>
  <text x="380" y="108" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8c2f2b" filter="url(#rough2)">(4,7) 交换后 = (7,4)</text>
  <text x="380" y="138" text-anchor="middle" font-size="11.5" fill="#8c2f2b" filter="url(#rough2)">12 × 21 = 252 = 21 × 12 ✓</text>

  <!-- 配对表 -->
  <g filter="url(#rough2)">
    <rect x="30" y="196" width="700" height="34" fill="#f2f2f2" stroke="#888" stroke-width="1.2"/>
    <line x1="30" y1="213" x2="730" y2="213" stroke="#ccc" stroke-width="1"/>
    <text x="42" y="217" font-size="11.5" fill="#333">配对样例</text>
    <text x="150" y="217" font-size="11.5" fill="#333">a = 12（键 4/7）</text>
    <text x="330" y="217" font-size="11.5" fill="#333">b = 21（键 7/4）</text>
    <text x="520" y="217" font-size="11.5" fill="#333">252 = 252 ✓</text>
    <text x="640" y="217" font-size="11.5" fill="#333">配对成立</text>
  </g>
  <g filter="url(#rough2)" font-size="11.5" fill="#333">
    <text x="42" y="252">第 2 行</text>
    <text x="150" y="252">a = 12（键 4/7）</text>
    <text x="330" y="252">b = 84（键 7/4，84/48 = 7/4）</text>
    <text x="520" y="252">1008 = 1008 ✓</text>
    <text x="640" y="252">配对成立</text>
    <text x="42" y="282">第 3 行</text>
    <text x="150" y="282">a = 1（键 1/1）</text>
    <text x="330" y="282">b = 7（键 1/1，7/7 约成 1/1）</text>
    <text x="520" y="282">7 = 7 ✓</text>
    <text x="640" y="282">回文数自配对</text>
  </g>

  <rect x="30" y="302" width="700" height="84" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="46" y="326" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">于是"哪些 b 与给定的 a 配对"完全由键决定：就是键等于 swap(key(a)) 的那一组 b。</text>
  <text x="46" y="350" font-size="12" fill="#7a5a1b" filter="url(#rough2)">把所有 b 按键分组（每组内 b 递增），对每个 a 只需求它对应的那一组的 id，组内计数用二分即可。</text>
  <text x="46" y="372" font-size="12" fill="#7a5a1b" filter="url(#rough2)">回文数全部落进键 (1,1) 这一组：它们与 a = 1, 11, 111… 互相配对，这是最大的一组。</text>
</svg>
