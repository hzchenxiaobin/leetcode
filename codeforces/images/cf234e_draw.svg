<svg xmlns="http://www.w3.org/2000/svg" width="840" height="340" viewBox="0 0 840 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="340" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">四档取队：RNG 每次更新后对档大小取模</text>
  <text x="420" y="56" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">x = (a·x + b) mod c；取第 (x mod size) 支</text>
  <g filter="url(#rough2)"><rect x="120" y="100" width="150" height="70" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="195" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">第 1 档</text>
  <text x="195" y="152" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">剩 2 支</text>
  <g filter="url(#rough2)"><line x1="274" y1="135" x2="296" y2="135" stroke="#888888" stroke-width="1.4" marker-end="url(#arrb)"/></g>
  <g filter="url(#rough2)"><rect x="300" y="100" width="150" height="70" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="375" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">第 2 档</text>
  <text x="375" y="152" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">剩 2 支</text>
  <g filter="url(#rough2)"><line x1="454" y1="135" x2="476" y2="135" stroke="#888888" stroke-width="1.4" marker-end="url(#arrb)"/></g>
  <g filter="url(#rough2)"><rect x="480" y="100" width="150" height="70" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="555" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">第 3 档</text>
  <text x="555" y="152" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">剩 2 支</text>
  <g filter="url(#rough2)"><line x1="634" y1="135" x2="656" y2="135" stroke="#888888" stroke-width="1.4" marker-end="url(#arrb)"/></g>
  <g filter="url(#rough2)"><rect x="660" y="100" width="150" height="70" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="735" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">第 4 档</text>
  <text x="735" y="152" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">剩 2 支</text>
  <text x="420" y="210" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">每组 = 从四档各取一支（每轮取出后删除）</text>
  <text x="420" y="240" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">重复 m−1 次，最后剩下的四支成最后一组</text>
  <g filter="url(#rough2)"><rect x="240" y="264" width="360" height="36" rx="4" fill="#f7fbf4" fill-opacity="0.85" stroke="#a8c99a" stroke-width="1.3"/></g>
  <text x="420" y="288" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3d6b2f" filter="url(#rough2)">组内按评分降序输出，组名 A, B, C …</text>
  <text x="420" y="322" text-anchor="middle" font-size="10.5" fill="#777777" filter="url(#rough2)">n ≤ 64，模拟 O(n²)</text>
</svg>
