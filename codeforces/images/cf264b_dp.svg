<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="300" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">相邻两项 gcd &gt; 1 ⇔ 共享质因子</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">用"质因子 → 最长长度"的表做转移</text>
  <text x="150" y="110" text-anchor="start" font-size="13" fill="#2b2b2b" filter="url(#rough2)">dp：以某个"质因子"为桥梁</text>
  <text x="150" y="152" text-anchor="start" font-size="13" fill="#2f4a66" filter="url(#rough2)">best[p] = 以含质因子 p 的数结尾的最长序列</text>
  <text x="150" y="196" text-anchor="start" font-size="13" fill="#2f4a66" filter="url(#rough2)">对 a_i：cur = 1 + max over p|a_i of best[p]</text>
  <text x="150" y="240" text-anchor="start" font-size="13" fill="#3d6b2f" filter="url(#rough2)">再用 cur 更新所有 p|a_i 的 best[p]</text>
</svg>
