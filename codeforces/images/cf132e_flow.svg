<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="259"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="340" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">二分图匹配：L_i 是「i 的后继」，R_j 是「j 的前驱」</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">边 i→j (i&lt;j) 的收益：a_i = a_j 时 = popcount(a_j)，否则 0</text>
  <text x="90" y="106" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">左：位置 i 作前驱</text>
  <text x="600" y="106" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">右：位置 j 作后继</text>
  <g filter="url(#rough2)"><circle cx="120" cy="150" r="16" fill="#cfe0f5" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="120" y="153.6" text-anchor="middle" font-size="10" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><circle cx="180" cy="172" r="16" fill="#cfe0f5" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="180" y="175.6" text-anchor="middle" font-size="10" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><circle cx="240" cy="194" r="16" fill="#cfe0f5" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="240" y="197.6" text-anchor="middle" font-size="10" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><circle cx="300" cy="216" r="16" fill="#cfe0f5" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="300" y="219.6" text-anchor="middle" font-size="10" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><circle cx="360" cy="238" r="16" fill="#cfe0f5" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="360" y="241.6" text-anchor="middle" font-size="10" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <g filter="url(#rough2)"><circle cx="820" cy="210" r="16" fill="#dcecd2" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="820" y="213.6" text-anchor="middle" font-size="10" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><circle cx="790" cy="188" r="16" fill="#dcecd2" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="790" y="191.6" text-anchor="middle" font-size="10" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><circle cx="760" cy="166" r="16" fill="#dcecd2" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="760" y="169.6" text-anchor="middle" font-size="10" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><circle cx="730" cy="144" r="16" fill="#dcecd2" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="730" y="147.6" text-anchor="middle" font-size="10" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><circle cx="700" cy="122" r="16" fill="#dcecd2" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="700" y="125.6" text-anchor="middle" font-size="10" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <g filter="url(#rough2)"><line x1="135" y1="152" x2="690" y2="292" stroke="#b06a1e" stroke-width="1.6" marker-end="url(#arr)"/></g>
  <g filter="url(#rough2)"><line x1="200" y1="200" x2="660" y2="250" stroke="#b06a1e" stroke-width="1.6" marker-end="url(#arr)"/></g>
  <text x="430" y="210" text-anchor="middle" font-size="11" fill="#b06a1e" filter="url(#rough2)">i &lt; j</text>
  <text x="430" y="232" text-anchor="middle" font-size="11" fill="#b06a1e" filter="url(#rough2)">收益 = popcount(a_j)（相等时）</text>
  <g filter="url(#rough2)"><rect x="60" y="288" width="780" height="40" rx="6" fill="#f6e3c4" fill-opacity="0.5" stroke="#b06a1e" stroke-width="1.4"/></g>
  <text x="450" y="314" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">最少费用流：流量 k ≥ n − m，边际费用 ≥ 0 时停止；k 就是链接条数</text>
</svg>
