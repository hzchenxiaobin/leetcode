<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1199"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="760" height="340" fill="#fafafa"/>
  <text x="380.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">方向固定 → 投影 + 最小覆盖圆</text>
  <path d="M 121.60000000000001 42 Q 380.0 48 638.4 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="380.0" y="326" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">圆柱半径 = 投影点集的最小覆盖圆半径</text>
  <line x1="100" y1="90" x2="100" y2="270" stroke="#5a5a5a" stroke-width="2" filter="url(#rough2)"/>
  <text x="100" y="80" text-anchor="middle" font-size="11.5" fill="#333333" filter="url(#rough2)">法向 u</text>
  <circle cx="170" cy="120" r="4" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="250" cy="200" r="4" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="330" cy="150" r="4" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="200" cy="240" r="4" fill="#b85450" filter="url(#rough2)"/>
  <ellipse cx="250" cy="180" rx="110" ry="80" fill="none" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="420" y="120" text-anchor="start" font-size="12" fill="#335478" filter="url(#rough2)">把点投到 u⊥ 平面</text>
  <circle cx="580" cy="200" r="60" fill="none" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <circle cx="640.0" cy="200.0" r="4" fill="#8a6015" filter="url(#rough2)"/>
  <circle cx="598.5" cy="257.1" r="4" fill="#8a6015" filter="url(#rough2)"/>
  <circle cx="531.5" cy="235.3" r="4" fill="#8a6015" filter="url(#rough2)"/>
  <circle cx="531.5" cy="164.7" r="4" fill="#8a6015" filter="url(#rough2)"/>
  <circle cx="598.5" cy="142.9" r="4" fill="#8a6015" filter="url(#rough2)"/>
  <text x="580" y="285" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">最小覆盖圆半径 = 答案</text>
  <text x="380" y="315" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">射线起点任意 ⇒ 等价于任取一条方向为 u 的直线</text>
</svg>
