<svg xmlns="http://www.w3.org/2000/svg" width="860" height="330" viewBox="0 0 860 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="85"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="860" height="330" fill="#fafafa"/>
  <text x="430" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">排序后的名次与 mod 5 余数</text>
  <text x="430" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">求和的是名次 i ≡ 3 (mod 5) 的元素（第 3、8、13、… 个）</text>
  <g filter="url(#rough2)"><rect x="96" y="120" width="41" height="40" rx="3" fill="#ffffff" fill-opacity="0.9" stroke="#99aabb" stroke-width="1.3"/></g>
  <text x="116.5" y="138" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">1</text>
  <text x="116.5" y="154" text-anchor="middle" font-size="11" fill="#999999" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="143" y="120" width="41" height="40" rx="3" fill="#ffffff" fill-opacity="0.9" stroke="#99aabb" stroke-width="1.3"/></g>
  <text x="163.5" y="138" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">2</text>
  <text x="163.5" y="154" text-anchor="middle" font-size="11" fill="#999999" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="190" y="120" width="41" height="40" rx="3" fill="#f6d9d7" fill-opacity="0.75" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="210.5" y="138" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">3</text>
  <text x="210.5" y="154" text-anchor="middle" font-size="11" fill="#8a2b28" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="237" y="120" width="41" height="40" rx="3" fill="#ffffff" fill-opacity="0.9" stroke="#99aabb" stroke-width="1.3"/></g>
  <text x="257.5" y="138" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">4</text>
  <text x="257.5" y="154" text-anchor="middle" font-size="11" fill="#999999" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><rect x="284" y="120" width="41" height="40" rx="3" fill="#ffffff" fill-opacity="0.9" stroke="#99aabb" stroke-width="1.3"/></g>
  <text x="304.5" y="138" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">5</text>
  <text x="304.5" y="154" text-anchor="middle" font-size="11" fill="#999999" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)"><rect x="331" y="120" width="41" height="40" rx="3" fill="#ffffff" fill-opacity="0.9" stroke="#99aabb" stroke-width="1.3"/></g>
  <text x="351.5" y="138" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">6</text>
  <text x="351.5" y="154" text-anchor="middle" font-size="11" fill="#999999" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="378" y="120" width="41" height="40" rx="3" fill="#ffffff" fill-opacity="0.9" stroke="#99aabb" stroke-width="1.3"/></g>
  <text x="398.5" y="138" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">7</text>
  <text x="398.5" y="154" text-anchor="middle" font-size="11" fill="#999999" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="425" y="120" width="41" height="40" rx="3" fill="#f6d9d7" fill-opacity="0.75" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="445.5" y="138" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">8</text>
  <text x="445.5" y="154" text-anchor="middle" font-size="11" fill="#8a2b28" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="472" y="120" width="41" height="40" rx="3" fill="#ffffff" fill-opacity="0.9" stroke="#99aabb" stroke-width="1.3"/></g>
  <text x="492.5" y="138" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">9</text>
  <text x="492.5" y="154" text-anchor="middle" font-size="11" fill="#999999" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><rect x="519" y="120" width="41" height="40" rx="3" fill="#ffffff" fill-opacity="0.9" stroke="#99aabb" stroke-width="1.3"/></g>
  <text x="539.5" y="138" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">10</text>
  <text x="539.5" y="154" text-anchor="middle" font-size="11" fill="#999999" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)"><rect x="566" y="120" width="41" height="40" rx="3" fill="#ffffff" fill-opacity="0.9" stroke="#99aabb" stroke-width="1.3"/></g>
  <text x="586.5" y="138" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">11</text>
  <text x="586.5" y="154" text-anchor="middle" font-size="11" fill="#999999" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="613" y="120" width="41" height="40" rx="3" fill="#ffffff" fill-opacity="0.9" stroke="#99aabb" stroke-width="1.3"/></g>
  <text x="633.5" y="138" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">12</text>
  <text x="633.5" y="154" text-anchor="middle" font-size="11" fill="#999999" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="660" y="120" width="41" height="40" rx="3" fill="#f6d9d7" fill-opacity="0.75" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="680.5" y="138" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">13</text>
  <text x="680.5" y="154" text-anchor="middle" font-size="11" fill="#8a2b28" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="707" y="120" width="41" height="40" rx="3" fill="#ffffff" fill-opacity="0.9" stroke="#99aabb" stroke-width="1.3"/></g>
  <text x="727.5" y="138" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">14</text>
  <text x="727.5" y="154" text-anchor="middle" font-size="11" fill="#999999" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><rect x="754" y="120" width="41" height="40" rx="3" fill="#ffffff" fill-opacity="0.9" stroke="#99aabb" stroke-width="1.3"/></g>
  <text x="774.5" y="138" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">15</text>
  <text x="774.5" y="154" text-anchor="middle" font-size="11" fill="#999999" filter="url(#rough2)">0</text>
  <text x="96" y="186" text-anchor="start" font-size="11" fill="#555555" filter="url(#rough2)">名次 i</text>
  <text x="96" y="206" text-anchor="start" font-size="11" fill="#555555" filter="url(#rough2)">i mod 5</text>
  <text x="440" y="238" text-anchor="middle" font-size="12.5" fill="#8a2b28" filter="url(#rough2)">被选中的名次：3, 8, 13, …（0 基下标 2, 7, 12, …）</text>
  <text x="440" y="266" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">每加入一个更小的元素，它右侧所有元素的名次整体 +1 → 余数整体循环平移 1 位</text>
  <text x="440" y="294" text-anchor="middle" font-size="12" fill="#3d6b2f" filter="url(#rough2)">所以线段树节点要同时维护 5 个余数类的和，合并时按左子树的 cnt 做循环移位</text>
</svg>
