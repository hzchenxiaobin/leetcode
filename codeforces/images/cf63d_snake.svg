<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c9801f"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a8524a"/>
    </marker>
  </defs>
  <rect width="760" height="420" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">蛇形遍历：区间相同的行直接接上，台阶处靠奇偶修正</text>
  <text x="380.0" y="60.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">例：a=2, b=3, c=1, d=2（b&gt;d，p = d mod 2 = 0）</text>
  <rect x="250.0" y="86.0" width="84.0" height="56.0" rx="6" fill="#f7f9fc" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="292.0" y="120.0" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="334.0" y="86.0" width="84.0" height="56.0" rx="6" fill="#f7f9fc" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="376.0" y="120.0" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="418.0" y="86.0" width="84.0" height="56.0" rx="6" fill="#f7f9fc" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="460.0" y="120.0" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="250.0" y="142.0" width="84.0" height="56.0" rx="6" fill="#fdf3e3" stroke="#c9801f" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="292.0" y="176.0" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="334.0" y="142.0" width="84.0" height="56.0" rx="6" fill="#fdf3e3" stroke="#c9801f" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="376.0" y="176.0" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="418.0" y="142.0" width="84.0" height="56.0" rx="6" fill="#fdf3e3" stroke="#c9801f" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="460.0" y="176.0" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="250.0" y="198.0" width="84.0" height="56.0" rx="6" fill="#f7f9fc" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="292.0" y="232.0" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="334.0" y="198.0" width="84.0" height="56.0" rx="6" fill="#f7f9fc" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="376.0" y="232.0" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">8</text>
  <rect x="418.0" y="198.0" width="84.0" height="56.0" rx="6" fill="#f2f2f2" stroke="#cfcfcf" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="60.0" y="112.0" text-anchor="start" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">第 0 行 →</text>
  <text x="60.0" y="168.0" text-anchor="start" font-size="12" fill="#446688" filter="url(#rough2)">第 1 行 ←</text>
  <text x="60.0" y="224.0" text-anchor="start" font-size="12" fill="#c9801f" filter="url(#rough2)">第 2 行 →</text>
  <rect x="40.0" y="300.0" width="680.0" height="46.0" rx="8" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.4" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="54.0" y="324.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">台阶在行 1 与行 2 之间：行 1 从右到左，终点是第 0 列；行 2 从第 0 列开始，</text>
  <text x="54.0" y="342.0" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">两格上下相邻。路径编号 1..8 恰好覆盖每个岛格一次。</text>
  <rect x="40.0" y="356.0" width="680.0" height="46.0" rx="8" fill="#fdf3e3" stroke="#c9801f" stroke-width="1.5" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="54.0" y="380.0" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">选择 p：b&gt;d 时 p = d mod 2；d&gt;b 时 p = (b-1) mod 2。</text>
  <text x="54.0" y="398.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">这样「长度变化」的那一行，上一行终点与下一行起点同列。</text>
</svg>
