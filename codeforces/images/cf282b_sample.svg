<svg xmlns="http://www.w3.org/2000/svg" width="700" height="340" viewBox="0 0 700 340"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="163"/>
    <feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></defs>
  <rect width="700" height="340" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2 走查：三枚 (400,600)</text>
  <path d="M 160 40 Q 350 46 540 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="60" width="580" height="52" rx="8" fill="#e8f4e0" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="84" font-size="13" fill="#2f5223" filter="url(#rough2)">第 1 枚：|0 + 400| = 400 ≤ 500 ⇒ 给 A，d = 400，Sa = 400</text>
  <text x="76" y="104" font-size="12" fill="#2f5223" filter="url(#rough2)">（输出第 1 个字母 A）</text>
  <g filter="url(#rough2)"><rect x="60" y="122" width="580" height="52" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="76" y="146" font-size="13" fill="#8a6015" filter="url(#rough2)">第 2 枚：|400 + 400| = 800 &gt; 500 ⇒ 给 G，Sg = 600，d = −200</text>
  <text x="76" y="166" font-size="12" fill="#8a6015" filter="url(#rough2)">（输出 G）</text>
  <g filter="url(#rough2)"><rect x="60" y="184" width="580" height="52" rx="8" fill="#e8f4e0" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="208" font-size="13" fill="#2f5223" filter="url(#rough2)">第 3 枚：|400 + 400 − 600| = 200 ≤ 500 ⇒ 给 A，Sa = 800，d = 200</text>
  <text x="76" y="228" font-size="12" fill="#2f5223" filter="url(#rough2)">（输出 A）</text>
  <g filter="url(#rough2)"><rect x="60" y="246" width="580" height="74" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="270" font-size="13" fill="#22314a" filter="url(#rough2)">得到 "AGA"，|800 − 600| = 200 ≤ 500 ✓（与官方样例输出一致）</text>
  <text x="76" y="294" font-size="12" fill="#2f4a66" filter="url(#rough2)">题面允许多解，输出任意合法方案即可。</text>
  <text x="76" y="314" font-size="12" fill="#2f4a66" filter="url(#rough2)">复杂度 O(n)，n ≤ 10⁶ 也只要几十毫秒。</text>
</svg>
