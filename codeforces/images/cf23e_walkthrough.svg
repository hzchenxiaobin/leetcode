<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 0 780 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="613"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="780" height="440" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">样例 1（链 1-2-3-4-5）：切成 3 + 2，乘积 6</text>

  <!-- 链 -->
  <circle cx="120" cy="110" r="20" fill="#a8d8a8" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="117" text-anchor="middle" font-size="13" fill="#204a1e" filter="url(#rough2)">1</text>
  <circle cx="260" cy="110" r="20" fill="#a8d8a8" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="117" text-anchor="middle" font-size="13" fill="#204a1e" filter="url(#rough2)">2</text>
  <circle cx="400" cy="110" r="20" fill="#a8d8a8" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="400" y="117" text-anchor="middle" font-size="13" fill="#204a1e" filter="url(#rough2)">3</text>
  <circle cx="540" cy="110" r="20" fill="#ffd9b3" stroke="#b06a2c" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="540" y="117" text-anchor="middle" font-size="13" fill="#8a4a14" filter="url(#rough2)">4</text>
  <circle cx="680" cy="110" r="20" fill="#ffd9b3" stroke="#b06a2c" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="680" y="117" text-anchor="middle" font-size="13" fill="#8a4a14" filter="url(#rough2)">5</text>

  <line x1="140" y1="110" x2="240" y2="110" stroke="#2f5223" stroke-width="3" filter="url(#rough2)"/>
  <line x1="280" y1="110" x2="380" y2="110" stroke="#2f5223" stroke-width="3" filter="url(#rough2)"/>
  <line x1="420" y1="110" x2="520" y2="110" stroke="#c0392b" stroke-width="2.6" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <line x1="560" y1="110" x2="660" y2="110" stroke="#8a4a14" stroke-width="3" filter="url(#rough2)"/>

  <text x="470" y="96" text-anchor="middle" font-size="10.5" fill="#c0392b" filter="url(#rough2)">切这里</text>

  <text x="260" y="160" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">块大小 3</text>
  <text x="610" y="160" text-anchor="middle" font-size="11" fill="#8a4a14" filter="url(#rough2)">块大小 2</text>
  <text x="390" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">3 × 2 = 6</text>

  <!-- 各种切法 -->
  <rect x="50" y="214" width="680" height="34" fill="#eef1f4" stroke="#7a8ca6" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="66" y="236" font-size="10.5" font-weight="bold" fill="#33445c" filter="url(#rough2)">切法</text>
  <text x="300" y="236" font-size="10.5" font-weight="bold" fill="#33445c" filter="url(#rough2)">块大小</text>
  <text x="500" y="236" font-size="10.5" font-weight="bold" fill="#33445c" filter="url(#rough2)">乘积</text>

  <rect x="50" y="248" width="680" height="26" fill="#ffffff" stroke="#d6d6d6" stroke-width="1" filter="url(#rough2)"/>
  <text x="66" y="266" font-size="10.5" fill="#555" filter="url(#rough2)">一条不切</text>
  <text x="300" y="266" font-size="10.5" fill="#555" filter="url(#rough2)">5</text>
  <text x="500" y="266" font-size="10.5" fill="#555" filter="url(#rough2)">5</text>

  <rect x="50" y="274" width="680" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="66" y="292" font-size="10.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">切 3-4</text>
  <text x="300" y="292" font-size="10.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">3, 2</text>
  <text x="500" y="292" font-size="10.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">6  ← 最优</text>

  <rect x="50" y="300" width="680" height="26" fill="#ffffff" stroke="#d6d6d6" stroke-width="1" filter="url(#rough2)"/>
  <text x="66" y="318" font-size="10.5" fill="#555" filter="url(#rough2)">切 2-3、4-5</text>
  <text x="300" y="318" font-size="10.5" fill="#555" filter="url(#rough2)">2, 1, 2</text>
  <text x="500" y="318" font-size="10.5" fill="#555" filter="url(#rough2)">4</text>

  <rect x="50" y="326" width="680" height="26" fill="#f4f4f4" stroke="#d6d6d6" stroke-width="1" filter="url(#rough2)"/>
  <text x="66" y="344" font-size="10.5" fill="#555" filter="url(#rough2)">全切</text>
  <text x="300" y="344" font-size="10.5" fill="#555" filter="url(#rough2)">1,1,1,1,1</text>
  <text x="500" y="344" font-size="10.5" fill="#555" filter="url(#rough2)">1</text>

  <!-- 大整数提示 -->
  <rect x="50" y="366" width="680" height="52" rx="9" fill="#fdeef0" stroke="#b85450"
        stroke-width="1.3" filter="url(#rough2)"/>
  <text x="66" y="390" font-size="11" fill="#8c3b37" filter="url(#rough2)">n = 700 的链：最优是 232 个 3 配一个 4，答案 4·3²³² ≈ 1.97×10¹¹¹，共 112 位十进制数。</text>
  <text x="66" y="410" font-size="11" fill="#8c3b37" filter="url(#rough2)">64 位整数只有约 20 位，所以这道题必须用大整数（C++ 手写，Python 原生）。</text>
</svg>
