<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="340" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">好序列 ⇔ 所有 b_i 都整除最大值 M</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">lcm = max 当且仅当每个 b_i 都是 M 的约数，且至少有一个 b_i 恰为 M</text>
  <g filter="url(#rough2)"><rect x="160" y="110" width="90" height="50" rx="4" fill="#f6e3c4" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="205.0" y="140.76" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">M</text>
  <text x="160" y="190" text-anchor="start" font-size="13" fill="#555555" filter="url(#rough2)">约数：</text>
  <g filter="url(#rough2)"><rect x="240" y="110" width="72" height="46" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="276.0" y="138.04" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="330" y="110" width="72" height="46" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="366.0" y="138.04" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="420" y="110" width="72" height="46" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="456.0" y="138.04" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="510" y="110" width="72" height="46" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="546.0" y="138.04" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">6</text>
  <text x="440" y="230" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">每个位置 i 可选的个数 = #{M 的约数 ≤ a_i}</text>
  <text x="440" y="262" text-anchor="middle" font-size="13" fill="#3d6b2f" filter="url(#rough2)">方案 = Π d_i − Π (d_i − [a_i ≥ M])</text>
  <text x="440" y="300" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">对 M=1..maxA 全部累加，用"约数分段的区间计数"做到 O(maxA log maxA)</text>
</svg>
