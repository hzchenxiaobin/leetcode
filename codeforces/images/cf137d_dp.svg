<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320" viewBox="0 0 700 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1371"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="700" height="320" fill="#fafafa"/>
  <text x="350.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">DP：切段 + 逐段补成回文</text>
  <path d="M 112.0 42 Q 350.0 48 588.0 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="350.0" y="306" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">cost[l][r] = 不匹配对称对数</text>
  <text x="350" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#335478" filter="url(#rough2)">abdcaba  (k=2)</text>
  <rect x="150" y="90" width="42" height="46" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="171" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">a</text>
  <rect x="196" y="90" width="42" height="46" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="217" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">b</text>
  <rect x="242" y="90" width="42" height="46" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="263" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">d</text>
  <rect x="288" y="90" width="42" height="46" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="309" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">c</text>
  <rect x="334" y="90" width="42" height="46" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="355" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">a</text>
  <rect x="380" y="90" width="42" height="46" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="401" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">b</text>
  <rect x="426" y="90" width="42" height="46" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="447" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">a</text>
  <line x1="171.0" y1="148.0" x2="447.0" y2="148.0" stroke="#4a7a3a" stroke-width="1.3" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <line x1="447.0" y1="160.0" x2="171.0" y2="160.0" stroke="#4a7a3a" stroke-width="1.3" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="350" y="190" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">对 (0,6): a=a ✓；对 (2,4): d≠c ⇒ 需改 1 处</text>
  <rect x="150" y="215" width="420" height="45" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="360" y="243" text-anchor="middle" font-size="12" font-weight="bold" fill="#335478" filter="url(#rough2)">答案 1：abdcdba（k 内层段数 ≤ 2）</text>
  <text x="350" y="295" text-anchor="middle" font-size="11" fill="#8c2f2c" filter="url(#rough2)">cost 表必须按长度递增填（依赖 cost[l+1][r−1]）</text>
</svg>
