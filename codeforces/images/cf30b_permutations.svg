<svg xmlns="http://www.w3.org/2000/svg" width="740" height="320" viewBox="0 0 740 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="131"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="740" height="320" fill="#fafafa"/>
  <text x="370" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">把 (日, 月, 年) 的 6 种重排都试一遍</text>
  <g font-size="13.5" filter="url(#rough2)">
    <rect x="60" y="58" width="200" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="160" y="86" text-anchor="middle" font-size="13" fill="#2f4a66">(BD, BM, BY)</text>
    <rect x="280" y="58" width="200" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="380" y="86" text-anchor="middle" font-size="13" fill="#2f4a66">(BD, BY, BM)</text>
    <rect x="500" y="58" width="200" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="600" y="86" text-anchor="middle" font-size="13" fill="#2f4a66">(BM, BD, BY)</text>
    <rect x="60" y="120" width="200" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="160" y="148" text-anchor="middle" font-size="13" fill="#2f4a66">(BM, BY, BD)</text>
    <rect x="280" y="120" width="200" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="380" y="148" text-anchor="middle" font-size="13" fill="#2f4a66">(BY, BD, BM)</text>
    <rect x="500" y="120" width="200" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="600" y="148" text-anchor="middle" font-size="13" fill="#2f4a66">(BY, BM, BD)</text>
  </g>
  <text x="370" y="196" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">每个重排当作 (日, 月, 年)，依次检查：日期合法？满 18 岁？</text>
  <rect x="90" y="216" width="560" height="84" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="106" y="240" font-size="12.5" fill="#8a6015" filter="url(#rough2)">合法：1 ≤ 月 ≤ 12，1 ≤ 日 ≤ 当月天数（2 月看 y % 4）。</text>
  <text x="106" y="264" font-size="12.5" fill="#8a6015" filter="url(#rough2)">年龄：YY − y &gt; 18，或 = 18 且 (MM, DD) ≥ (月, 日)。</text>
  <text x="106" y="288" font-size="12.5" fill="#8a6015" filter="url(#rough2)">世纪：两边都是 20xx，自动满足。</text>
</svg>
