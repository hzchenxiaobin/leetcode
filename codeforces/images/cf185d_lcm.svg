<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="780" height="400" fill="#fafafa"/>
  <text x="390.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">LCM 的结构：两两 gcd 只可能是 1 或 2，除掉的只有 2 的幂</text>
  <path d="M 122.27000000000015 46 Q 390.0 52 657.7299999999998 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60.0" y="70.0" width="690.0" height="40.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="68.0" y="103.0" text-anchor="start" font-size="10.6" font-weight="bold" fill="#26405c" filter="url(#rough2)">k 的奇偶</text>
  <text x="198.0" y="103.0" text-anchor="start" font-size="10.6" font-weight="bold" fill="#26405c" filter="url(#rough2)">每项奇偶</text>
  <text x="398.0" y="103.0" text-anchor="start" font-size="10.6" font-weight="bold" fill="#26405c" filter="url(#rough2)">两两 gcd</text>
  <text x="518.0" y="103.0" text-anchor="start" font-size="10.6" font-weight="bold" fill="#26405c" filter="url(#rough2)">LCM</text>
  <path d="M 60.0 70.0 L 750.0 70.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="68.0" y="143.0" text-anchor="start" font-size="10.6" fill="#2b2b2b" filter="url(#rough2)">k 偶</text>
  <text x="198.0" y="143.0" text-anchor="start" font-size="10.6" fill="#2b2b2b" filter="url(#rough2)">k^{2^i}+1 全为奇数</text>
  <text x="398.0" y="143.0" text-anchor="start" font-size="10.6" fill="#2b2b2b" filter="url(#rough2)">互素</text>
  <text x="518.0" y="143.0" text-anchor="start" font-size="10.6" fill="#2b2b2b" filter="url(#rough2)">∏ Aᵢ</text>
  <path d="M 60.0 110.0 L 750.0 110.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="68.0" y="183.0" text-anchor="start" font-size="10.6" fill="#2b2b2b" filter="url(#rough2)">k 奇，l ≥ 1</text>
  <text x="198.0" y="183.0" text-anchor="start" font-size="10.6" fill="#2b2b2b" filter="url(#rough2)">全为偶数</text>
  <text x="398.0" y="183.0" text-anchor="start" font-size="10.6" fill="#2b2b2b" filter="url(#rough2)">恰为 2</text>
  <text x="518.0" y="183.0" text-anchor="start" font-size="10.6" fill="#2b2b2b" filter="url(#rough2)">∏ Aᵢ / 2^{r−l}</text>
  <path d="M 60.0 150.0 L 750.0 150.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="68.0" y="223.0" text-anchor="start" font-size="10.6" fill="#2b2b2b" filter="url(#rough2)">k 奇，l = 0</text>
  <text x="198.0" y="223.0" text-anchor="start" font-size="10.6" fill="#2b2b2b" filter="url(#rough2)">A₀ 含 2^v，其余含 2</text>
  <text x="398.0" y="223.0" text-anchor="start" font-size="10.6" fill="#2b2b2b" filter="url(#rough2)">恰为 2</text>
  <text x="518.0" y="223.0" text-anchor="start" font-size="10.6" fill="#2b2b2b" filter="url(#rough2)">∏ Aᵢ / 2^{v+r−max(v,1)}</text>
  <path d="M 60.0 190.0 L 750.0 190.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <rect x="60.0" y="262.0" width="660.0" height="56.0" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="286.0" text-anchor="start" font-size="11.1" fill="#2f5b34" filter="url(#rough2)">关键恒等式：A_j ≡ 2 (mod A_i)（i&lt;j），因为 k^{2^j} = (k^{2^i})^{2^{j−i}} ≡ (−1)^{偶} = 1。</text>
  <text x="74.0" y="308.0" text-anchor="start" font-size="11.1" fill="#2f5b34" filter="url(#rough2)">于是除 2 之外的素因子在每个 A_i 里最多出现一次，LCM 就是连乘再除以多算的 2 的幂。</text>
  <rect x="60.0" y="330.0" width="660.0" height="56.0" rx="9" fill="#fdf0ef" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="354.0" text-anchor="start" font-size="11.1" fill="#8a3a36" filter="url(#rough2)">p = 2 要单独判：k 偶 ⇒ 全奇 ⇒ LCM 奇 ⇒ 1；k 奇 ⇒ 全偶 ⇒ LCM 偶 ⇒ 0。</text>
  <text x="74.0" y="376.0" text-anchor="start" font-size="11.1" fill="#8a3a36" filter="url(#rough2)">其余情况除以 2^d：p 是奇素数，逆元一定存在。</text>
</svg>
