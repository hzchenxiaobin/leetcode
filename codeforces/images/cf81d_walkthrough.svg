<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="145"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="720" height="360" fill="#fafafa"/>
  <text x="360.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1：n = 4，a = (1, 3, 5)</text>
  <path d="M 115.2 42 Q 360.0 48 604.8 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="360.0" y="346" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">两种合法答案（环上相邻都不同）</text>
  <rect x="32" y="88" width="316" height="250" rx="10" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="190" y="112" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">答案一：3 1 3 2</text>
  <circle cx="190" cy="210" r="88" fill="none" stroke="#bdbdb5" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <circle cx="190.0" cy="122.0" r="22" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="190" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#335478" filter="url(#rough2)">3</text>
  <circle cx="278.0" cy="210.0" r="22" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="278" y="216" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5223" filter="url(#rough2)">1</text>
  <circle cx="190.0" cy="298.0" r="22" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="190" y="304" text-anchor="middle" font-size="15" font-weight="bold" fill="#335478" filter="url(#rough2)">3</text>
  <circle cx="102.0" cy="210.0" r="22" fill="#fbeadb" stroke="#d98c3f" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="102" y="216" text-anchor="middle" font-size="15" font-weight="bold" fill="#9a5d1c" filter="url(#rough2)">2</text>
  <text x="190" y="216" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">3 用了 2 张 = n/2</text>
  <rect x="372" y="88" width="316" height="250" rx="10" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="530" y="112" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">答案二：3 2 3 2</text>
  <circle cx="530" cy="210" r="88" fill="none" stroke="#bdbdb5" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <circle cx="530.0" cy="122.0" r="22" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="530" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#335478" filter="url(#rough2)">3</text>
  <circle cx="618.0" cy="210.0" r="22" fill="#fbeadb" stroke="#d98c3f" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="618" y="216" text-anchor="middle" font-size="15" font-weight="bold" fill="#9a5d1c" filter="url(#rough2)">2</text>
  <circle cx="530.0" cy="298.0" r="22" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="530" y="304" text-anchor="middle" font-size="15" font-weight="bold" fill="#335478" filter="url(#rough2)">3</text>
  <circle cx="442.0" cy="210.0" r="22" fill="#fbeadb" stroke="#d98c3f" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="442" y="216" text-anchor="middle" font-size="15" font-weight="bold" fill="#9a5d1c" filter="url(#rough2)">2</text>
  <text x="530" y="216" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">我们的构造：3 2 3 2</text>
  <text x="360" y="334" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">相册 3 用满 n/2 = 2 张，其余两个相册各 1 张；顺时针 3→1→3→2→3 都是不同相册</text>
</svg>
