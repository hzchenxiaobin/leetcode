<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="300" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">石头 i 与更晚石头的左右关系</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">l：i 在所有更晚石头右边；r：左边</text>
  <text x="150" y="110" text-anchor="start" font-size="13" fill="#2b2b2b" filter="url(#rough2)">每块石头落在"当前区间的中点"</text>
  <text x="150" y="152" text-anchor="start" font-size="13" fill="#2f4a66" filter="url(#rough2)">向左逃 → 石头在新区间右端；向右逃 → 在左端</text>
  <text x="150" y="196" text-anchor="start" font-size="13" fill="#2f4a66" filter="url(#rough2)">所以第 i 块石头相对所有更晚的石头：l 在右、r 在左</text>
  <text x="150" y="240" text-anchor="start" font-size="13" fill="#3d6b2f" filter="url(#rough2)">从后往前，用双端队列：l 放尾部、r 放头部</text>
</svg>
