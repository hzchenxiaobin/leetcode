<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="300" fill="#fafafa"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">200B：为什么不是加权混合</text>
  <path d="M 254.89999999999998 46 Q 380.0 52 505.1 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60.0" y="70.0" width="640.0" height="60.0" rx="9" fill="#fdf0ef" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="94.0" text-anchor="start" font-size="10.9" fill="#8a3a36" filter="url(#rough2)">常见错误：把百分比直接相加再除以 100，或按“体积比例”加权。</text>
  <text x="74.0" y="116.0" text-anchor="start" font-size="10.9" fill="#8a3a36" filter="url(#rough2)">题面明确是 equal proportions of each drink ⇒ 每杯体积相同，直接算术平均。</text>
  <rect x="60.0" y="150.0" width="640.0" height="56.0" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="174.0" text-anchor="start" font-size="10.9" fill="#2f5b34" filter="url(#rough2)">验证：p = [0,100] ⇒ 平均 50%，即半杯纯果汁 + 半杯水 ✓。</text>
  <text x="74.0" y="196.0" text-anchor="start" font-size="10.9" fill="#2f5b34" filter="url(#rough2)">p = [100,100] ⇒ 100% ✓。</text>
</svg>
