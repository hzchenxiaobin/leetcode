<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1065"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="300" fill="#fafafa"/>
  <text x="360.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两类资源：面团（共享）与馅料（各自独立）</text>
  <path d="M 115.2 42 Q 360.0 48 604.8 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="360.0" y="286" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">n ≤ 1000 克面团，m ≤ 10 种馅料</text>
  <rect x="40" y="70" width="640" height="70" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">面团：总量 n 克，所有面包共享</text>
  <text x="360" y="122" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">无馅面包：耗 c₀、赚 d₀（不限量）</text>
  <rect x="40" y="155" width="640" height="90" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">馅料 i：最多 ⌊aᵢ / bᵢ⌋ 个</text>
  <text x="360" y="205" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">每个面包：耗 bᵢ 克馅 + cᵢ 克面团，赚 dᵢ</text>
  <text x="360" y="230" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">馅料不能互相替代 → 每种单独限制</text>
  <text x="360" y="275" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">两类资源互不干扰：馅料上限只限制该种面包的个数，面团是所有面包的总预算</text>
</svg>
