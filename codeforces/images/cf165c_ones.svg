<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="791"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="280" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">按「包含哪 k 个连续的 1」分类</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">左右端各有一段可选区间</text>
  <text x="90" y="110" text-anchor="start" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">s = 0 1 0 1 0</text>
  <g filter="url(#rough2)"><rect x="150" y="130" width="62" height="44" rx="3" fill="#ffffff" fill-opacity="0.5" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="181" y="158" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)"><rect x="230" y="130" width="62" height="44" rx="3" fill="#dcecd2" fill-opacity="0.5" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="261" y="158" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="310" y="130" width="62" height="44" rx="3" fill="#ffffff" fill-opacity="0.5" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="341" y="158" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)"><rect x="390" y="130" width="62" height="44" rx="3" fill="#dcecd2" fill-opacity="0.5" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="421" y="158" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="470" y="130" width="62" height="44" rx="3" fill="#ffffff" fill-opacity="0.5" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="501" y="158" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="450" y="216" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">k=2：左端 2 种 × 右端 2 种 = 4</text>
  <text x="450" y="248" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">k=0 时按连续 0 段：r(r+1)/2</text>
</svg>
