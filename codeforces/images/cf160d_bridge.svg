<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="669"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="300" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">按权值分组：组内缩点后判桥</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">自环 ⇒ none；桥 ⇒ any；其余 ⇒ at least one</text>
  <text x="90" y="114" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">权 1：3–4</text>
  <text x="280" y="114" text-anchor="start" font-size="11" fill="#4a7a3a" filter="url(#rough2)">并查集未连通 ⇒ 桥 ⇒ any</text>
  <text x="90" y="160" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">权 2：2–3、2–4</text>
  <text x="280" y="160" text-anchor="start" font-size="11" fill="#b06a1e" filter="url(#rough2)">缩点后成环（2 与 {3,4}）⇒ 非桥 ⇒ at least one</text>
  <text x="90" y="206" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">权 100：1–3</text>
  <text x="280" y="206" text-anchor="start" font-size="11" fill="#4a7a3a" filter="url(#rough2)">此时是桥 ⇒ any</text>
  <text x="90" y="252" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">权 101：1–2</text>
  <text x="280" y="252" text-anchor="start" font-size="11" fill="#8a2b28" filter="url(#rough2)">两端已连通 ⇒ none</text>
  <text x="450" y="282" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">组内先判桥、再统一合并（Kruskal 分层）</text>
</svg>
