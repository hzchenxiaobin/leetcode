<svg xmlns="http://www.w3.org/2000/svg" width="740" height="200" viewBox="0 0 740 200"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1396"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>

  <rect width="740" height="200" fill="#fafafa"/>
  <text x="370.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">流程</text>
  <path d="M 118.4 42 Q 370.0 48 621.6 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="370.0" y="186" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">O(总长)</text>
  <rect x="30.0" y="80" width="159.5" height="54" rx="7" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="109.75" y="105.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">逐组算 4 个键</text>
  <text x="109.75" y="123.0" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">第 k 个元音后缀</text>
  <line x1="190.5" y1="107.0" x2="200.5" y2="107.0" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <rect x="203.5" y="80" width="159.5" height="54" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="283.25" y="112.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#5a7fb0" filter="url(#rough2)">求该组兼容格式集</text>
  <line x1="364.0" y1="107.0" x2="374.0" y2="107.0" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <rect x="377.0" y="80" width="159.5" height="54" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="456.75" y="112.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">与全局集合求交</text>
  <line x1="537.5" y1="107.0" x2="547.5" y2="107.0" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <rect x="550.5" y="80" width="159.5" height="54" rx="7" fill="#fbeeee" stroke="#a05a5a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="630.25" y="112.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a05a5a" filter="url(#rough2)">空→NO，含 aaaa→aaaa</text>
</svg>
