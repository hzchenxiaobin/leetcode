<svg xmlns="http://www.w3.org/2000/svg" width="740" height="380" viewBox="0 0 740 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="608"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="740" height="380" fill="#fafafa"/>

  <text x="370" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每分钟在相邻蘑菇之间长出「和」，两端永远不变</text>
  <path d="M 130 40 Q 370 46 610 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 第 0 分钟 -->
  <text x="46" y="84" font-size="12.5" font-weight="bold" fill="#2b4a68" filter="url(#rough2)">0 分钟</text>
  <g filter="url(#rough2)">
    <circle cx="150" cy="112" r="18" fill="#eef3f8" stroke="#446688" stroke-width="1.6"/>
    <circle cx="330" cy="112" r="18" fill="#eef3f8" stroke="#446688" stroke-width="1.6"/>
    <circle cx="510" cy="112" r="18" fill="#eef3f8" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="150" y="117" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a68" filter="url(#rough2)">a</text>
  <text x="330" y="117" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a68" filter="url(#rough2)">b</text>
  <text x="510" y="117" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a68" filter="url(#rough2)">c</text>
  <text x="590" y="117" font-size="12" fill="#666" filter="url(#rough2)">和 S₀ = a+b+c</text>

  <!-- 第 1 分钟 -->
  <text x="46" y="164" font-size="12.5" font-weight="bold" fill="#8c3a37" filter="url(#rough2)">1 分钟</text>
  <g filter="url(#rough2)">
    <circle cx="150" cy="196" r="18" fill="#fdf0ef" stroke="#b85450" stroke-width="1.6"/>
    <circle cx="240" cy="196" r="18" fill="#fdf0ef" stroke="#b85450" stroke-width="1.6"/>
    <circle cx="330" cy="196" r="18" fill="#fdf0ef" stroke="#b85450" stroke-width="1.6"/>
    <circle cx="420" cy="196" r="18" fill="#fdf0ef" stroke="#b85450" stroke-width="1.6"/>
    <circle cx="510" cy="196" r="18" fill="#fdf0ef" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="150" y="201" text-anchor="middle" font-size="12" font-weight="bold" fill="#8c3a37" filter="url(#rough2)">a</text>
  <text x="240" y="201" text-anchor="middle" font-size="12" font-weight="bold" fill="#8c3a37" filter="url(#rough2)">a+b</text>
  <text x="330" y="201" text-anchor="middle" font-size="12" font-weight="bold" fill="#8c3a37" filter="url(#rough2)">b</text>
  <text x="420" y="201" text-anchor="middle" font-size="12" font-weight="bold" fill="#8c3a37" filter="url(#rough2)">b+c</text>
  <text x="510" y="201" text-anchor="middle" font-size="12" font-weight="bold" fill="#8c3a37" filter="url(#rough2)">c</text>
  <text x="590" y="201" font-size="12" fill="#666" filter="url(#rough2)">S₁ = 3S₀ − (a + c)</text>

  <text x="370" y="248" text-anchor="middle" font-size="12.5" fill="#6b4a10" filter="url(#rough2)">新插入的总和 = 2S − 首 − 尾　⇒　S' = 3S − 首 − 尾</text>

  <!-- 结论 -->
  <rect x="60" y="272" width="620" height="96" rx="8" fill="#f4f8ee" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="296" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">两段各用一个递推：</text>
  <text x="76" y="318" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">第一段：首 = a₁、尾 = aₙ 始终不变（插入只发生在中间）</text>
  <text x="76" y="338" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">⇒ Sₓ = 3ˣ·S₀ − (a₁ + aₙ)·(3ˣ − 1)/2</text>
  <text x="76" y="358" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">第二段：排序后首 = a₁（最小值不变），尾 = 第一段结束时的最大值 mₓ</text>
</svg>
