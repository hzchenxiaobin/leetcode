<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1311"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="700" height="300" fill="#fafafa"/>
  <text x="350.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">触发条件</text>
  <path d="M 112.0 42 Q 350.0 48 588.0 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="350.0" y="286" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">全大写 或 除首字母外全大写 ⇒ 全部大小写互换</text>
  <rect x="60" y="70" width="260" height="80" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f5223" filter="url(#rough2)">cAPS</text>
  <text x="190" y="128" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">除首字母全大写 → 触发</text>
  <line x1="330.0" y1="110.0" x2="380.0" y2="110.0" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <rect x="390" y="70" width="250" height="80" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="515" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#335478" filter="url(#rough2)">Caps</text>
  <text x="515" y="128" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">逐字符取反</text>
  <rect x="60" y="185" width="580" height="50" rx="7" fill="#fbeeee" stroke="#a05a5a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="350" y="215" text-anchor="middle" font-size="12" fill="#8c2f2c" filter="url(#rough2)">Lock → 不触发（其余字母本就小写）→ 原样输出</text>
</svg>
