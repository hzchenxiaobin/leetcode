<svg xmlns="http://www.w3.org/2000/svg" width="820" height="540" viewBox="0 0 820 540"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="820" height="540" fill="#fafafa"/>
  <text x="410" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1 走查：r = 0 5 3 5 1 5 2，k = 2</text>
  <text x="410" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">三个峰都满足"降 1 后仍高于左右山谷"，按从左到右的顺序降前两个</text>
  <g filter="url(#rough2)"><path d=" M 184.0,330.0 L 228.0,110.0 L 272.0,198.0 L 316.0,110.0 L 360.0,286.0 L 404.0,110.0 L 448.0,242.0" fill="none" stroke="#446688" stroke-width="2.4" stroke-linejoin="round"/></g>
  <g filter="url(#rough2)"><circle cx="184" cy="330" r="8" fill="#d6e6f2" fill-opacity="0.9" stroke="#446688" stroke-width="1.8"/></g>
  <text x="184" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="184" y="354" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">r1</text>
  <g filter="url(#rough2)"><circle cx="228" cy="110" r="8" fill="#f6d9d7" fill-opacity="0.9" stroke="#a0522d" stroke-width="1.8"/></g>
  <text x="228" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <text x="228" y="354" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">r2</text>
  <g filter="url(#rough2)"><circle cx="272" cy="198" r="8" fill="#d6e6f2" fill-opacity="0.9" stroke="#446688" stroke-width="1.8"/></g>
  <text x="272" y="184" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="272" y="354" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">r3</text>
  <g filter="url(#rough2)"><circle cx="316" cy="110" r="8" fill="#f6d9d7" fill-opacity="0.9" stroke="#a0522d" stroke-width="1.8"/></g>
  <text x="316" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <text x="316" y="354" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">r4</text>
  <g filter="url(#rough2)"><circle cx="360" cy="286" r="8" fill="#d6e6f2" fill-opacity="0.9" stroke="#446688" stroke-width="1.8"/></g>
  <text x="360" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="360" y="354" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">r5</text>
  <g filter="url(#rough2)"><circle cx="404" cy="110" r="8" fill="#f6d9d7" fill-opacity="0.9" stroke="#a0522d" stroke-width="1.8"/></g>
  <text x="404" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <text x="404" y="354" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">r6</text>
  <g filter="url(#rough2)"><circle cx="448" cy="242" r="8" fill="#d6e6f2" fill-opacity="0.9" stroke="#446688" stroke-width="1.8"/></g>
  <text x="448" y="228" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="448" y="354" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">r7</text>
  <text x="228" y="80" text-anchor="middle" font-size="12" fill="#3d6b2f" filter="url(#rough2)">降①：4&gt;0,4&gt;3</text>
  <text x="316" y="80" text-anchor="middle" font-size="12" fill="#3d6b2f" filter="url(#rough2)">降②：4&gt;3,4&gt;1</text>
  <text x="404" y="80" text-anchor="middle" font-size="12" fill="#8a4b2a" filter="url(#rough2)">k 已用完，不动</text>
  <text x="62" y="392" text-anchor="start" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">峰 p</text>
  <text x="132" y="392" text-anchor="start" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">位置</text>
  <text x="202" y="392" text-anchor="start" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">左谷</text>
  <text x="272" y="392" text-anchor="start" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">右谷</text>
  <text x="342" y="392" text-anchor="start" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">r−1 更高?</text>
  <text x="502" y="392" text-anchor="start" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">动作</text>
  <text x="62" y="416" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">1</text>
  <text x="132" y="416" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">2</text>
  <text x="202" y="416" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">0</text>
  <text x="272" y="416" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">3</text>
  <text x="342" y="416" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">4&gt;0, 4&gt;3 ✓</text>
  <text x="502" y="416" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">降，k=1</text>
  <text x="62" y="440" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">2</text>
  <text x="132" y="440" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">4</text>
  <text x="202" y="440" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">3</text>
  <text x="272" y="440" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">1</text>
  <text x="342" y="440" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">4&gt;3, 4&gt;1 ✓</text>
  <text x="502" y="440" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">降，k=0</text>
  <text x="62" y="464" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">3</text>
  <text x="132" y="464" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">6</text>
  <text x="202" y="464" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">1</text>
  <text x="272" y="464" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">2</text>
  <text x="342" y="464" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">4&gt;1, 4&gt;2 ✓</text>
  <text x="502" y="464" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">不动</text>
  <g filter="url(#rough2)"><line x1="54" y1="398" x2="750" y2="398" stroke="#c8a48a" stroke-width="1.1"/></g>
  <text x="410" y="524" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">得到 0 4 3 4 1 5 2（官方输出 0 5 3 4 1 4 2 是另一个合法解，多解均可）</text>
</svg>
