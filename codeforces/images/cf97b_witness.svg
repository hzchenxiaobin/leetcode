<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380">
<defs>
<filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="9" result="noise"/>
<feDisplacementMap in="SourceGraphic" in2="noise" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect x="0" y="0" width="640" height="380" fill="#fafafa"/>
<g font-family="Comic Sans MS, Kaiti SC, cursive">
<text x="320.0" y="24.0" font-size="15" fill="#33475b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">见证点：p、q 包围盒内的第三个点</text>
<rect x="150.0" y="90.0" width="320.0" height="210.0" rx="4" fill="#eef4fb" stroke="#9ab" stroke-width="1.6" stroke-dasharray="7 5" filter="url(#rough2)"/>
<line x1="430.0" y1="80.0" x2="430.0" y2="320.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="6 5" filter="url(#rough2)"/>
<text x="560.0" y="338.0" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">中位线 x = X_mid</text>
<circle cx="150.0" cy="300.0" r="7.0" fill="#33475b" stroke="#33475b" stroke-width="1.4" filter="url(#rough2)"/>
<text x="146.0" y="326.0" font-size="15" fill="#33475b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">p</text>
<circle cx="470.0" cy="90.0" r="7.0" fill="#33475b" stroke="#33475b" stroke-width="1.4" filter="url(#rough2)"/>
<text x="474.0" y="76.0" font-size="15" fill="#33475b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">q</text>
<circle cx="430.0" cy="300.0" r="8.0" fill="#f6d9b0" stroke="#c0392b" stroke-width="2.0" filter="url(#rough2)"/>
<text x="430.0" y="330.0" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">w = (X_mid, y_p)</text>
<line x1="150.0" y1="300.0" x2="430.0" y2="300.0" stroke="#b0bcc8" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>
<line x1="430.0" y1="300.0" x2="470.0" y2="90.0" stroke="#b0bcc8" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>
<text x="320.0" y="366.0" font-size="13" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">w 的 x 严格夹在 x_p、x_q 之间，y = y_p 在区间内 ⇒ w 落在闭包围盒里</text>
</g>
</svg>
