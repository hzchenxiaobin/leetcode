<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.027" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.3"/>
    </filter>
  </defs>

  <rect width="760" height="340" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">走查表：3 组官方样例 + 3 组自造样例</text>
  <path d="M 190 40 Q 380 46 570 40" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- 表头 -->
  <rect x="40" y="54" width="680" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 170 54 L 170 288" stroke="#446688" stroke-width="1.1" fill="none" filter="url(#rough2)"/>
  <path d="M 420 54 L 420 288" stroke="#446688" stroke-width="1.1" fill="none" filter="url(#rough2)"/>
  <path d="M 560 54 L 560 288" stroke="#446688" stroke-width="1.1" fill="none" filter="url(#rough2)"/>
  <text x="105" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">s</text>
  <text x="295" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">段划分（0* | 骨牌 | 1*）</text>
  <text x="490" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">能否切完</text>
  <text x="640" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">答案</text>

  <!-- 行 1：10101 -->
  <rect x="40" y="88" width="680" height="32" fill="#ffffff" stroke="#c9c9c9" stroke-width="1" filter="url(#rough2)"/>
  <text x="105" y="109" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">10101</text>
  <text x="295" y="109" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1 | 0 | 1 | 0 | 1</text>
  <text x="490" y="109" text-anchor="middle" font-size="12" fill="#8a2a26" filter="url(#rough2)">✘ 首段是 1 且为奇</text>
  <rect x="592" y="94" width="96" height="22" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="640" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a2a26" filter="url(#rough2)">Alice</text>

  <!-- 行 2：0100 -->
  <rect x="40" y="120" width="680" height="32" fill="#fafafa" stroke="#c9c9c9" stroke-width="1" filter="url(#rough2)"/>
  <text x="105" y="141" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">0100</text>
  <text x="295" y="141" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0 | 1 | 00</text>
  <text x="490" y="141" text-anchor="middle" font-size="12" fill="#8a2a26" filter="url(#rough2)">✘ 中间 1 段为奇</text>
  <rect x="592" y="126" width="96" height="22" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="640" y="142" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a2a26" filter="url(#rough2)">Alice</text>

  <!-- 行 3：011001 -->
  <rect x="40" y="152" width="680" height="32" fill="#ffffff" stroke="#c9c9c9" stroke-width="1" filter="url(#rough2)"/>
  <text x="105" y="173" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">011001</text>
  <text x="295" y="173" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0 | 11 | 00 | 1</text>
  <text x="490" y="173" text-anchor="middle" font-size="12" fill="#3f6b32" filter="url(#rough2)">✔ 全部配平</text>
  <rect x="592" y="158" width="96" height="22" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="640" y="174" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">Bob</text>

  <!-- 行 4：1100（自造） -->
  <rect x="40" y="184" width="680" height="32" fill="#fafafa" stroke="#c9c9c9" stroke-width="1" filter="url(#rough2)"/>
  <text x="105" y="205" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">1100</text>
  <text x="295" y="205" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">11 | 00</text>
  <text x="490" y="205" text-anchor="middle" font-size="12" fill="#3f6b32" filter="url(#rough2)">✔ 全部配平</text>
  <rect x="592" y="190" width="96" height="22" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="640" y="206" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">Bob</text>

  <!-- 行 5：0110（自造） -->
  <rect x="40" y="216" width="680" height="32" fill="#ffffff" stroke="#c9c9c9" stroke-width="1" filter="url(#rough2)"/>
  <text x="105" y="237" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">0110</text>
  <text x="295" y="237" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0 | 11 | 0</text>
  <text x="490" y="237" text-anchor="middle" font-size="12" fill="#8a2a26" filter="url(#rough2)">✘ 末段是 0 且为奇</text>
  <rect x="592" y="222" width="96" height="22" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="640" y="238" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a2a26" filter="url(#rough2)">Alice</text>

  <!-- 行 6：11001100（自造） -->
  <rect x="40" y="248" width="680" height="32" rx="6" fill="#fafafa" stroke="#c9c9c9" stroke-width="1" filter="url(#rough2)"/>
  <text x="105" y="269" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">11001100</text>
  <text x="295" y="269" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">11 | 00 | 11 | 00</text>
  <text x="490" y="269" text-anchor="middle" font-size="12" fill="#3f6b32" filter="url(#rough2)">✔ 全部配平</text>
  <rect x="592" y="254" width="96" height="22" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="640" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">Bob</text>

  <text x="40" y="308" font-size="12" fill="#555" filter="url(#rough2)">注：前 3 组为官方样例（输入 10101 / 0100 / 011001，输出 Alice / Alice / Bob）；后 3 组为自造。</text>
  <text x="40" y="328" font-size="12" fill="#555" filter="url(#rough2)">自造组已用暴力极小极大逐组核对：n ≤ 9 全枚举、n = 10~11 随机、n ≤ 14 判据全枚举。</text>
</svg>
