<svg xmlns="http://www.w3.org/2000/svg" width="840" height="420" viewBox="0 0 840 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="420" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">合并树：代价 = Σ aᵢ · 深度ᵢ，每个结点至多 k 个儿子</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">n = 5、k = 2 的例子：根 4，两个儿子 3、2，两个孙子 1、1</text>
  <g filter="url(#rough2)"><circle cx="420" cy="110" r="24" fill="#f6e3c4" fill-opacity="0.9" stroke="#a0522d" stroke-width="1.8"/></g>
  <text x="420" y="116" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><circle cx="300" cy="210" r="24" fill="#d7ecd0" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="300" y="216" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><circle cx="540" cy="210" r="24" fill="#d7ecd0" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="540" y="216" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><circle cx="240" cy="310" r="24" fill="#d6e6f2" fill-opacity="0.9" stroke="#446688" stroke-width="1.8"/></g>
  <text x="240" y="316" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><circle cx="360" cy="310" r="24" fill="#d6e6f2" fill-opacity="0.9" stroke="#446688" stroke-width="1.8"/></g>
  <text x="360" y="316" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><line x1="420" y1="134" x2="300" y2="186" stroke="#888888" stroke-width="1.6"/></g>
  <g filter="url(#rough2)"><line x1="420" y1="134" x2="540" y2="186" stroke="#888888" stroke-width="1.6"/></g>
  <g filter="url(#rough2)"><line x1="300" y1="234" x2="240" y2="286" stroke="#888888" stroke-width="1.6"/></g>
  <g filter="url(#rough2)"><line x1="300" y1="234" x2="360" y2="286" stroke="#888888" stroke-width="1.6"/></g>
  <text x="470" y="96" text-anchor="start" font-size="11" fill="#a0522d" filter="url(#rough2)">深度 0（根，代价 0）</text>
  <text x="600" y="200" text-anchor="start" font-size="11" fill="#4a7a3a" filter="url(#rough2)">深度 1</text>
  <text x="420" y="300" text-anchor="start" font-size="11" fill="#446688" filter="url(#rough2)">深度 2</text>
  <text x="420" y="366" text-anchor="middle" font-size="13.5" fill="#2b2b2b" filter="url(#rough2)">代价 = 3·1 + 2·1 + 1·2 + 1·2 = 9（k = 2）</text>
  <text x="420" y="394" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">"被加 k 次" ⇔ 每个结点至多 k 个儿子</text>
</svg>
