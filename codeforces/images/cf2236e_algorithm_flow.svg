<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="700" height="480" fill="#fafafa" filter="url(#rough2)"/>

  <text x="350" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    固定 L 的判定：一遍扫描 + best[m] 表
  </text>
  <text x="350" y="52" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">
    L 从 ⌊n/2⌋ 递减到 1，第一个「判定成功」的 L 就是答案（不能二分，见正文反例）
  </text>

  <rect x="240" y="66" width="220" height="38" rx="8" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.7" filter="url(#rough2)"/>
  <text x="350" y="90" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">
    外层：L = ⌊n/2⌋, ⌊n/2⌋−1, …, 1
  </text>

  <path d="M350 104 L350 120" fill="none" stroke="#666" stroke-width="1.6"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="100" y="124" width="500" height="66" rx="8" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.7" filter="url(#rough2)"/>
  <text x="116" y="148" font-size="12" fill="#333" filter="url(#rough2)">
    ① 滑动窗口扫全部起点 i：不同元素数 cnt，区间最大/最小值（稀疏表 O(1)）
  </text>
  <text x="116" y="172" font-size="12" fill="#333" filter="url(#rough2)">
    　 判定 good(i,L) ⇔ cnt == L 且 max − min == L−1，同时记下 m = min
  </text>

  <path d="M350 190 L350 206" fill="none" stroke="#666" stroke-width="1.6"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="100" y="210" width="500" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.7" filter="url(#rough2)"/>
  <text x="116" y="234" font-size="12" fill="#333" filter="url(#rough2)">
    ② best[m] = 所有 min = m 的 good 段里「最右」的那个起点 i
  </text>
  <text x="116" y="256" font-size="12" fill="#333" filter="url(#rough2)">
    　 取最右才等价于「存在起点 ≥ i+L」，即两段一定不重叠
  </text>

  <path d="M350 266 L350 284" fill="none" stroke="#666" stroke-width="1.6"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="350,290 566,336 350,382 134,336" fill="#fce4ec" stroke="#b85450"
           stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="333" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">
    对某个 good 段：best[m+L] ≥ i+L
  </text>
  <text x="350" y="352" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">
    或 best[m−L] ≥ i+L ？
  </text>

  <path d="M134 336 L64 336 L64 85 L236 85" fill="none" stroke="#b85450" stroke-width="1.6"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="70" y="116" font-size="11" fill="#b85450" filter="url(#rough2)">
    否：L ← L−1
  </text>

  <path d="M350 382 L350 402" fill="none" stroke="#666" stroke-width="1.6"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="360" y="398" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="170" y="404" width="360" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.9" filter="url(#rough2)"/>
  <text x="350" y="430" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">
    输出 L 并结束：L 降序 ⇒ 首个可行即最长
  </text>

  <text x="350" y="468" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">
    复杂度 O(n²)：一次 O(n) 扫描 × O(n) 个候选 L；n ≤ 6000 ⇒ 约 1.8×10⁷ 次操作
  </text>
</svg>
