<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 0 780 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="780" height="440" fill="#fafafa"/>

  <text x="390" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">扫总统桌的每一格，看四邻，用 26 个布尔量去重</text>

  <!-- 3x4 网格：G . B . / . R R . / T T T . -->
  <rect x="56" y="78" width="216" height="162" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.8"
        filter="url(#rough2)"/>
  <rect x="56" y="78" width="54" height="54" fill="#ece4f6" stroke="#7a6aa0" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="110" y="78" width="54" height="54" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="164" y="78" width="54" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="218" y="78" width="54" height="54" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="56" y="132" width="54" height="54" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="110" y="132" width="54" height="54" fill="#dbe7fb" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="164" y="132" width="54" height="54" fill="#dbe7fb" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="218" y="132" width="54" height="54" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="56" y="186" width="54" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="110" y="186" width="54" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="164" y="186" width="54" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="218" y="186" width="54" height="54" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.2" filter="url(#rough2)"/>

  <text x="83" y="114" text-anchor="middle" font-size="24" fill="#5a4a80" filter="url(#rough2)">G</text>
  <text x="137" y="114" text-anchor="middle" font-size="24" fill="#b0b0b0" filter="url(#rough2)">.</text>
  <text x="191" y="114" text-anchor="middle" font-size="24" fill="#2f5223" filter="url(#rough2)">B</text>
  <text x="245" y="114" text-anchor="middle" font-size="24" fill="#b0b0b0" filter="url(#rough2)">.</text>
  <text x="83" y="168" text-anchor="middle" font-size="24" fill="#b0b0b0" filter="url(#rough2)">.</text>
  <text x="137" y="168" text-anchor="middle" font-size="24" fill="#23405c" filter="url(#rough2)">R</text>
  <text x="191" y="168" text-anchor="middle" font-size="24" fill="#23405c" filter="url(#rough2)">R</text>
  <text x="245" y="168" text-anchor="middle" font-size="24" fill="#b0b0b0" filter="url(#rough2)">.</text>
  <text x="83" y="222" text-anchor="middle" font-size="24" fill="#8a6015" filter="url(#rough2)">T</text>
  <text x="137" y="222" text-anchor="middle" font-size="24" fill="#8a6015" filter="url(#rough2)">T</text>
  <text x="191" y="222" text-anchor="middle" font-size="24" fill="#8a6015" filter="url(#rough2)">T</text>
  <text x="245" y="222" text-anchor="middle" font-size="24" fill="#b0b0b0" filter="url(#rough2)">.</text>

  <!-- 四邻标记：绿 = 记下，灰 = 跳过 -->
  <circle cx="137" cy="132" r="5.4" fill="#9ed49e" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="137" cy="186" r="5.4" fill="#9ed49e" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="110" cy="159" r="5.4" fill="#d9d9d9" stroke="#8a8a8a" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="164" cy="159" r="5.4" fill="#d9d9d9" stroke="#8a8a8a" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="191" cy="132" r="5.4" fill="#9ed49e" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="191" cy="186" r="5.4" fill="#9ed49e" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="218" cy="159" r="5.4" fill="#d9d9d9" stroke="#8a8a8a" stroke-width="1.3" filter="url(#rough2)"/>

  <!-- G 与 R 的斜角接触点 -->
  <path d="M 102 124 L 118 140" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 118 124 L 102 140" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>

  <text x="56" y="262" font-size="11" fill="#2f5223" filter="url(#rough2)">绿点（3 个）：邻居是 T、B、T，全部记下</text>
  <text x="56" y="282" font-size="11" fill="#666" filter="url(#rough2)">灰点（4 个）：邻居是空格或 R 自己，跳过</text>
  <text x="56" y="302" font-size="11" fill="#8c3b37" filter="url(#rough2)">红叉：G 与 R 只共顶点，四邻检查碰不到它</text>

  <!-- 右侧：布尔数组 -->
  <text x="330" y="92" font-size="13" font-weight="bold" fill="#33445c" filter="url(#rough2)">neighbour[26]：每种颜色一格</text>
  <g filter="url(#rough2)">
    <rect x="330" y="106" width="36" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="366" y="106" width="36" height="36" fill="#cfeacf" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="402" y="106" width="36" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="438" y="106" width="36" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="474" y="106" width="36" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="510" y="106" width="36" height="36" fill="#cfeacf" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="546" y="106" width="36" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <rect x="582" y="106" width="36" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
  </g>
  <text x="348" y="130" text-anchor="middle" font-size="14" fill="#666" filter="url(#rough2)">A</text>
  <text x="384" y="130" text-anchor="middle" font-size="14" fill="#2f5223" filter="url(#rough2)">B</text>
  <text x="420" y="130" text-anchor="middle" font-size="14" fill="#666" filter="url(#rough2)">C</text>
  <text x="456" y="130" text-anchor="middle" font-size="14" fill="#666" filter="url(#rough2)">D</text>
  <text x="492" y="130" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">…</text>
  <text x="528" y="130" text-anchor="middle" font-size="14" fill="#8a6015" filter="url(#rough2)">T</text>
  <text x="564" y="130" text-anchor="middle" font-size="14" fill="#666" filter="url(#rough2)">U</text>
  <text x="600" y="130" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">…</text>
  <text x="384" y="160" text-anchor="middle" font-size="13" fill="#2f5223" filter="url(#rough2)">1</text>
  <text x="528" y="160" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">1</text>
  <text x="636" y="130" font-size="11" fill="#555" filter="url(#rough2)">→ 数真值</text>

  <text x="330" y="192" font-size="11.5" fill="#555" filter="url(#rough2)">T 被置真两次（两格下方各一次），</text>
  <text x="330" y="212" font-size="11.5" fill="#555" filter="url(#rough2)">但布尔量只保留「真」，最后只算 1 张。</text>
  <text x="330" y="232" font-size="11.5" fill="#8c3b37" filter="url(#rough2)">若换成计数器每次 +1，答案会变成 3。</text>

  <!-- 底部小结 -->
  <rect x="56" y="318" width="668" height="94" rx="10" fill="#eef1f7" stroke="#7a8ca6"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="72" y="346" font-size="13" font-weight="bold" fill="#33445c" filter="url(#rough2)">三步：只看 c 的格子 → 四个邻居里挑出非空且非 c 的 → 按字母打勾</text>
  <text x="72" y="372" font-size="11.5" fill="#44597a" filter="url(#rough2)">总统桌是矩形，可能有很多格，所以必须遍历它的每一个格子；邻桌贴着哪一格都能被发现。</text>
  <text x="72" y="394" font-size="11.5" fill="#44597a" filter="url(#rough2)">O(nm) 扫描、O(26) 额外空间，100 × 100 的极限数据只需几毫秒。</text>
</svg>
