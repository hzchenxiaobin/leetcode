<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="300" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">在串上滑动长度 10 的窗口，检查 dd-mm-yyyy</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">年份限 2013–2015（都不是闰年），再校验月份与当月天数</text>
  <g filter="url(#rough2)"><rect x="120" y="110" width="520" height="46" rx="4" fill="#eeeeee" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="380.0" y="137.68" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">d d - m m - y y y y</text>
  <text x="440" y="200" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">窗口可以重叠：0012-10-2012 里 12-10-2012 出现两次</text>
  <text x="440" y="240" text-anchor="middle" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">用 map 统计每个合法日期的出现次数，取最大的那个</text>
</svg>
