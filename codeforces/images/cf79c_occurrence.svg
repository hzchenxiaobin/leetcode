  <text x="675.0" y="136" text-anchor="middle" font-size="20" fill="#2b2b2b" filter="url(#rough2)">i</text>
  <text x="675.0" y="94" text-anchor="middle" font-size="11" fill="#777777" filter="url(#rough2)">8</text>
  <g filter="url(#rough2)"><rect x="710" y="102" width="70" height="52" rx="3" fill="#ffffff" fill-opacity="0.9" stroke="#999999" stroke-width="1.2"/></g>
  <text x="745.0" y="136" text-anchor="middle" font-size="20" fill="#2b2b2b" filter="url(#rough2)">i</text>
  <text x="745.0" y="94" text-anchor="middle" font-size="11" fill="#777777" filter="url(#rough2)">9</text>
  <g filter="url(#rough2)"><line x1="82" y1="162" x2="428" y2="162" stroke="#4a7a3a" stroke-width="3"/></g>
  <text x="255.0" y="182" text-anchor="middle" font-size="12" fill="#3d6b2f" font-weight="bold" filter="url(#rough2)">unagi（长度 5）</text>
  <g filter="url(#rough2)"><line x1="362" y1="86" x2="568" y2="86" stroke="#b85450" stroke-width="3"/></g>
  <text x="465.0" y="76" text-anchor="middle" font-size="12" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">ioi（长度 3）</text>
  <text x="66" y="218" text-anchor="end" font-size="12" fill="#555555" font-weight="bold" filter="url(#rough2)">起点 i</text>
  <text x="115.0" y="212" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">0</text>
  <text x="115.0" y="242" text-anchor="middle" font-size="13" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">4</text>
