  <text x="255.0" y="242" text-anchor="middle" font-size="13" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="325.0" y="212" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">3</text>
  <text x="325.0" y="242" text-anchor="middle" font-size="13" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="395.0" y="212" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">4</text>
  <text x="395.0" y="242" text-anchor="middle" font-size="13" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="465.0" y="212" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">5</text>
  <text x="465.0" y="242" text-anchor="middle" font-size="13" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">10</text>
  <text x="535.0" y="212" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">6</text>
  <text x="535.0" y="242" text-anchor="middle" font-size="13" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">10</text>
  <text x="605.0" y="212" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">7</text>
  <text x="605.0" y="242" text-anchor="middle" font-size="13" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">10</text>
  <text x="675.0" y="212" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">8</text>
  <text x="675.0" y="242" text-anchor="middle" font-size="13" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">10</text>
  <text x="745.0" y="212" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">9</text>
  <text x="745.0" y="242" text-anchor="middle" font-size="13" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">10</text>
  <text x="66" y="242" text-anchor="end" font-size="12" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">E(i)</text>
  <text x="66" y="274" text-anchor="end" font-size="12" fill="#3d6b2f" font-weight="bold" filter="url(#rough2)">E(i)−i</text>
  <text x="115.0" y="274" text-anchor="middle" font-size="13" fill="#3d6b2f" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="185.0" y="274" text-anchor="middle" font-size="13" fill="#3d6b2f" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="255.0" y="274" text-anchor="middle" font-size="13" fill="#3d6b2f" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="325.0" y="274" text-anchor="middle" font-size="13" fill="#3d6b2f" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="395.0" y="274" text-anchor="middle" font-size="13" fill="#3d6b2f" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="465.0" y="274" text-anchor="middle" font-size="13" fill="#3d6b2f" font-weight="bold" filter="url(#rough2)">5</text>
