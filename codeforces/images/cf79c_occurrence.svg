  <text x="745.0" y="274" text-anchor="middle" font-size="13" fill="#3d6b2f" font-weight="bold" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="60" y="186" width="780" height="104" rx="4" fill="#ffffff" fill-opacity="0.0" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="5 4"/></g>
  <text x="450" y="322" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">E(i) = 所有起点 p ≥ i 的出现中 min(p + |b| − 1)，右侧再取后缀最小值</text>
  <text x="450" y="346" text-anchor="middle" font-size="12" fill="#8a2b28" filter="url(#rough2)">最长长度 = max (E(i) − i)：i = 1 或 i = 5 都得 5，所以 5 1 与 5 5 都合法</text>
  <text x="450" y="382" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">注意右端是 p + |b| − 1 而不是 p + |b|：长度 5 的 "nagio" 不含完整的 ioi</text>
  <text x="450" y="406" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">（它只含 ioi 的前两个字符 io，因此合法）</text>
</svg>
