  <text x="325.0" y="94" text-anchor="middle" font-size="11" fill="#777777" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="360" y="102" width="70" height="52" rx="3" fill="#ffffff" fill-opacity="0.9" stroke="#999999" stroke-width="1.2"/></g>
  <text x="395.0" y="136" text-anchor="middle" font-size="20" fill="#2b2b2b" filter="url(#rough2)">i</text>
