  <rect width="900" height="446" fill="#fafafa"/>
  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 3：s = unagioisii 的全部出现位置</text>
  <text x="450" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">模式 unagi 在 0 出现，ioi 在 4 出现（下标从 0 开始）</text>
