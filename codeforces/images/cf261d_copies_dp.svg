<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="29"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar5" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="440" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">t &lt; c 时展开 n×t 个位置，用「前缀最大值」数组 O(1) 转移</text>
  <path d="M 80 42 Q 360 48 640 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <text x="60" y="72" font-size="13" fill="#333" filter="url(#rough2)">
    b = (2, 3, 1)，t = 2，c = 3，展开成 a = 2 3 1 2 3 1
  </text>

  <!-- 展开的序列 -->
  <g filter="url(#rough2)">
    <rect x="60" y="86" width="56" height="44" rx="5" fill="#f2f2f2" stroke="#999" stroke-width="1.3"/>
    <rect x="122" y="86" width="56" height="44" rx="5" fill="#f2f2f2" stroke="#999" stroke-width="1.3"/>
    <rect x="184" y="86" width="56" height="44" rx="5" fill="#f2f2f2" stroke="#999" stroke-width="1.3"/>
    <rect x="246" y="86" width="56" height="44" rx="5" fill="#e8f4e0" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="308" y="86" width="56" height="44" rx="5" fill="#e8f4e0" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="370" y="86" width="56" height="44" rx="5" fill="#f2f2f2" stroke="#999" stroke-width="1.3"/>
  </g>
  <g font-size="16" text-anchor="middle" fill="#333" filter="url(#rough2)">
    <text x="88" y="114">2</text>
    <text x="150" y="114">3</text>
    <text x="212" y="114">1</text>
    <text x="274" y="114">2</text>
    <text x="336" y="114">3</text>
    <text x="398" y="114">1</text>
  </g>
  <g font-size="11" text-anchor="middle" fill="#777" filter="url(#rough2)">
    <text x="88" y="146">i=1</text>
    <text x="150" y="146">2</text>
    <text x="212" y="146">3</text>
    <text x="274" y="146">4</text>
    <text x="336" y="146">5</text>
    <text x="398" y="146">6</text>
  </g>
  <text x="440" y="114" font-size="12" fill="#2f5223" filter="url(#rough2)">选 1（副本 1 尾）→ 2,3（副本 2）</text>

  <!-- P 数组 -->
  <text x="60" y="188" font-size="13.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">
    P[v] = 以「值 ≤ v」结尾的最长上升子序列长度（P 恒为非降）
  </text>

  <g filter="url(#rough2)">
    <rect x="60" y="200" width="252" height="48" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <line x1="60" y1="224" x2="312" y2="224" stroke="#c8d4e6" stroke-width="1"/>
    <line x1="144" y1="200" x2="144" y2="248" stroke="#c8d4e6" stroke-width="1"/>
    <line x1="228" y1="200" x2="228" y2="248" stroke="#c8d4e6" stroke-width="1"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#333" filter="url(#rough2)">
    <text x="102" y="218">v=0</text>
    <text x="186" y="218">v=1</text>
    <text x="270" y="218">v=2</text>
    <text x="102" y="242">0</text>
    <text x="186" y="242">1</text>
    <text x="270" y="242">2</text>
  </g>

  <g font-size="12" fill="#556" filter="url(#rough2)">
    <text x="330" y="218">… 扫描到 a₄ = 2 时：</text>
    <text x="330" y="242">d = P[1] + 1 = 2，把 P[2..] 抬到 2</text>
  </g>

  <!-- 阶梯更新 -->
  <text x="60" y="286" font-size="13" fill="#2f4a66" filter="url(#rough2)">
    更新：d = P[val-1] + 1，然后从 u = val 开始向右把 P[u] 抬到 d，遇到 P[u] ≥ d 就停
  </text>

  <g filter="url(#rough2)">
    <rect x="60" y="300" width="600" height="52" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.2"/>
  </g>
  <g font-size="12.5" fill="#22314a" filter="url(#rough2)">
    <text x="74" y="322">P 非降 ⇒ 一旦遇到 P[u] ≥ d 就整段都不用改；而 P[u] 最多被抬高 c 次，</text>
    <text x="74" y="342">所以总修改量 ≤ maxb × c ≤ n × maxb ≤ 2×10⁷，与 n×t 同阶。</text>
  </g>

  <!-- 复杂度 -->
  <g filter="url(#rough2)">
    <rect x="60" y="366" width="600" height="56" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <g font-size="12.5" fill="#2f5223" filter="url(#rough2)">
    <text x="74" y="390">时间 O(n·t + n·maxb)，空间 O(n + maxb)；</text>
    <text x="74" y="412">关键前提 t &lt; c 保证了 n·t &lt; n·c ≤ n·maxb ≤ 2×10⁷，一次展开不会爆。</text>
  </g>
</svg>
