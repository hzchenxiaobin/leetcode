<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="760" height="400" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">可见链与三种到达方式</text>

  <!-- 多边形 -->
  <polygon points="540,200 480,304 360,304 300,200 360,96 480,96" fill="#eef4fb" stroke="#b9c8d8"
           stroke-width="1.4" filter="url(#rough2)"/>
  <!-- 可见链 -->
  <path d="M360 96 L300 200 L360 304" fill="none" stroke="#4a7a3a" stroke-width="3.4" filter="url(#rough2)"/>
  <!-- 不可见链 -->
  <path d="M360 304 L480 304 L540 200 L480 96 L360 96" fill="none" stroke="#9aa4ac" stroke-width="2.4"
        stroke-dasharray="7 5" filter="url(#rough2)"/>

  <!-- 直达 -->
  <path d="M120 200 L300 200" stroke="#4a7a3a" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <!-- 经 t2 -->
  <path d="M120 200 L360 304" stroke="#c9a227" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <path d="M360 304 L480 304" stroke="#c9a227" stroke-width="3.2" fill="none" filter="url(#rough2)"/>
  <!-- 经 t1 -->
  <path d="M120 200 L360 96" stroke="#b85450" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <path d="M360 96 L480 96" stroke="#b85450" stroke-width="3.2" fill="none" filter="url(#rough2)"/>

  <!-- 点 -->
  <g filter="url(#rough2)">
    <circle cx="120" cy="200" r="6" fill="#2b3a4a"/>
    <circle cx="300" cy="200" r="5.5" fill="#4a7a3a"/>
    <circle cx="360" cy="96" r="5.5" fill="#b85450"/>
    <circle cx="360" cy="304" r="5.5" fill="#c9a227"/>
  </g>
  <g font-size="12.5" fill="#2b3a4a" filter="url(#rough2)">
    <text x="104" y="188">P</text>
    <text x="288" y="188">A</text>
    <text x="368" y="86" fill="#7a2f2c">t₁（切点）</text>
    <text x="368" y="330" fill="#8a6015">t₂（切点）</text>
    <text x="470" y="292" fill="#8a6015">A₂</text>
    <text x="470" y="112" fill="#7a2f2c">A₁</text>
  </g>

  <!-- 标注 -->
  <text x="250" y="236" font-size="11.5" fill="#2f5223" filter="url(#rough2)">d = |PA|</text>
  <text x="188" y="288" font-size="11.5" fill="#8a6015" filter="url(#rough2)">|Pt₂| + 弧</text>
  <text x="196" y="128" font-size="11.5" fill="#7a2f2c" filter="url(#rough2)">|Pt₁| + 弧</text>

  <!-- 图例 -->
  <g filter="url(#rough2)">
    <line x1="560" y1="150" x2="596" y2="150" stroke="#4a7a3a" stroke-width="3.4"/>
    <text x="606" y="155" font-size="12" fill="#2f5223">可见链</text>
    <line x1="560" y1="182" x2="596" y2="182" stroke="#9aa4ac" stroke-width="2.4" stroke-dasharray="7 5"/>
    <text x="606" y="187" font-size="12" fill="#5a6a7a">不可见段</text>
  </g>

  <text x="380" y="372" text-anchor="middle" font-size="12" fill="#4a4a4a" filter="url(#rough2)">可见部分直连；不可见部分要么经 t₁ 沿边界、要么经 t₂ 沿边界，各是一段线性代价</text>
</svg>
