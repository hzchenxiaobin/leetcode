<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="137"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="320" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">枚举 k! 种「位置置换」，同一条规则作用于全部数</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">k ≤ 8 ⇒ 至多 40320 种；每种扫一遍 n 个数取极差</text>
  <text x="120" y="110" text-anchor="start" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">规则 π = (3,1,4,2)</text>
  <text x="120" y="136" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">新第 1 位 = 原第 3 位</text>
  <text x="120" y="158" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">新第 2 位 = 原第 1 位</text>
  <text x="120" y="180" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">新第 3 位 = 原第 4 位</text>
  <text x="120" y="202" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">新第 4 位 = 原第 2 位</text>
  <text x="120" y="232" text-anchor="start" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">5237 → 3752</text>
  <text x="120" y="254" text-anchor="start" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">2753 → 5372</text>
  <g filter="url(#rough2)"><rect x="420" y="96" width="180" height="34" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="510" y="118" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">(3,1,4,2)</text>
  <g filter="url(#rough2)"><rect x="420" y="142" width="180" height="34" rx="4" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="510" y="164" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">(1,3,2,4)</text>
  <g filter="url(#rough2)"><rect x="420" y="188" width="180" height="34" rx="4" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="510" y="210" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">(2,1,4,3)</text>
  <g filter="url(#rough2)"><rect x="420" y="234" width="180" height="34" rx="4" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="510" y="256" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">(4,2,3,1)</text>
  <text x="510" y="300" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">… 共 k! 个</text>
  <g filter="url(#rough2)"><rect x="640" y="96" width="220" height="120" rx="6" fill="#ffffff" fill-opacity="0.85" stroke="#b06a1e" stroke-width="1.4" stroke-dasharray="5 4"/></g>
  <text x="750" y="122" text-anchor="middle" font-size="12" fill="#b06a1e" font-weight="bold" filter="url(#rough2)">对每个 π：</text>
  <text x="750" y="148" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">重算 n 个数</text>
  <text x="750" y="172" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">spread = max − min</text>
  <text x="750" y="196" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">ans = min ans, spread</text>
  <text x="750" y="240" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">O(k!·n·k)</text>
  <text x="750" y="266" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">8!·8·8 ≈ 2.6×10⁶</text>
</svg>
