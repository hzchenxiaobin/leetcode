<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-6%" y="-6%" width="112%" height="112%"><feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="405" /><feDisplacementMap in="SourceGraphic" scale="1.5" /></filter><marker id="a39e" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#446688" /></marker></defs>
  <rect width="760" height="420" fill="#fafafa" />
  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">状态 (a,b)：两种走法，走完检查 a^b &lt; n</text>
  <path d="M 110 44 Q 380 50 650 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)" />

  <rect x="290" y="78" width="180" height="60" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)" />
  <text x="380" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">(a, b)</text>
  <text x="380" y="124" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">安全：a^b &lt; n</text>

  <line x1="330" y1="138" x2="210" y2="194" stroke="#446688" stroke-width="1.6" marker-end="url(#a39e)" filter="url(#rough2)" />
  <line x1="430" y1="138" x2="550" y2="194" stroke="#446688" stroke-width="1.6" marker-end="url(#a39e)" filter="url(#rough2)" />

  <rect x="90" y="200" width="240" height="72" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)" />
  <text x="210" y="226" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">加一个盒子 → (a+1, b)</text>
  <text x="210" y="250" text-anchor="middle" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">相当于把底数 +1</text>

  <rect x="430" y="200" width="240" height="72" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)" />
  <text x="550" y="226" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">加一个物品 → (a, b+1)</text>
  <text x="550" y="250" text-anchor="middle" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">相当于把指数 +1</text>

  <rect x="120" y="304" width="520" height="84" rx="10" fill="#fde8e8" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)" />
  <text x="140" y="330" font-size="12.5" font-weight="bold" fill="#8a3b36" filter="url(#rough2)">走完一步后若 a^b ≥ n，走这步的玩家立刻输</text>
  <text x="140" y="354" font-size="11.5" fill="#8a3b36" filter="url(#rough2)">所以这种走法不是“把局面交给对手”，而是直接失败；</text>
  <text x="140" y="376" font-size="11.5" fill="#8a3b36" filter="url(#rough2)">只有安全走法才会进入下一回合。</text>
</svg>