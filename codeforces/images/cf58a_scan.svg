<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="581"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8a2b28"/>
    </marker>
  </defs>
  <rect width="760" height="330" fill="#fafafa"/>
  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">从左到右扫描 s，用一个指针 j 依次匹配 "hello" 的每一位</text>
  <path d="M 60 40 Q 380 48 700 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <text x="40" y="76" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">目标</text>
  <g font-size="13">
    <rect x="120" y="60" width="40" height="34" rx="6" fill="#cfe0f5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="140" y="83" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">h</text>
    <rect x="166" y="60" width="40" height="34" rx="6" fill="#cfe0f5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="186" y="83" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">e</text>
    <rect x="212" y="60" width="40" height="34" rx="6" fill="#cfe0f5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="232" y="83" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">l</text>
    <rect x="258" y="60" width="40" height="34" rx="6" fill="#cfe0f5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="278" y="83" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">l</text>
    <rect x="304" y="60" width="40" height="34" rx="6" fill="#cfe0f5" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="324" y="83" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">o</text>
  </g>

  <text x="40" y="136" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">输入</text>
  <g font-size="12">
    <rect x="120" y="118" width="30" height="34" rx="5" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="135" y="141" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">a</text>
    <rect x="154" y="118" width="30" height="34" rx="5" fill="#d9ecd4" stroke="#8a2b28" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="169" y="141" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">h</text>
    <rect x="188" y="118" width="30" height="34" rx="5" fill="#d9ecd4" stroke="#8a2b28" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="203" y="141" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">e</text>
    <rect x="222" y="118" width="30" height="34" rx="5" fill="#d9ecd4" stroke="#8a2b28" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="237" y="141" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">l</text>
    <rect x="256" y="118" width="30" height="34" rx="5" fill="#d9ecd4" stroke="#8a2b28" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="271" y="141" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">l</text>
    <rect x="290" y="118" width="30" height="34" rx="5" fill="#fbe3c8" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="305" y="141" text-anchor="middle" fill="#555555" filter="url(#rough2)">l</text>
    <rect x="324" y="118" width="30" height="34" rx="5" fill="#fbe3c8" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="339" y="141" text-anchor="middle" fill="#555555" filter="url(#rough2)">l</text>
    <rect x="358" y="118" width="30" height="34" rx="5" fill="#fbe3c8" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="373" y="141" text-anchor="middle" fill="#555555" filter="url(#rough2)">o</text>
    <rect x="392" y="118" width="30" height="34" rx="5" fill="#d9ecd4" stroke="#8a2b28" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="407" y="141" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">o</text>
    <rect x="426" y="118" width="30" height="34" rx="5" fill="#fbe3c8" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="441" y="141" text-anchor="middle" fill="#555555" filter="url(#rough2)">u</text>
  </g>

  <path d="M 166 100 L 166 114" stroke="#8a2b28" stroke-width="1.5" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 202 100 L 202 114" stroke="#8a2b28" stroke-width="1.5" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 236 100 L 236 114" stroke="#8a2b28" stroke-width="1.5" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 272 100 L 272 114" stroke="#8a2b28" stroke-width="1.5" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 322 100 L 322 114" stroke="#8a2b28" stroke-width="1.5" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <rect x="40" y="180" width="330" height="120" rx="10" fill="#d9ecd4" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="56" y="204" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">匹配成功的例子</text>
  <text x="56" y="226" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">s = ahhellllloou</text>
  <text x="56" y="246" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">h 在第 2 位、e 在第 3 位、</text>
  <text x="56" y="266" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">两个 l 用第 4、5 位，o 用第 9 位，</text>
  <text x="56" y="286" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">剩下的字母全部删除 → hello ✓</text>

  <rect x="390" y="180" width="330" height="120" rx="10" fill="#f6d5d5" stroke="#8a2b28" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="406" y="204" font-size="11.5" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">失败的例子</text>
  <text x="406" y="226" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">s = hlelo</text>
  <text x="406" y="246" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">h→1，e→3，l→4，然后再也找不到</text>
  <text x="406" y="266" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">第二个 l（指针停在 4，后面只有 o），</text>
  <text x="406" y="286" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">指针没有走到 5 → 输出 NO。</text>
</svg>
