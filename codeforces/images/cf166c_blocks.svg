<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="823"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="280" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">中位位置必须落在「等于 x」的块内</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">l+a &lt; pos ≤ l+a+e+b</text>
  <g filter="url(#rough2)"><rect x="80" y="110" width="200" height="50" rx="4" fill="#f3d9d6" fill-opacity="0.4" stroke="#8a2b28" stroke-width="1.4"/></g>
  <text x="180" y="140" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">小于 x（l+a）</text>
  <g filter="url(#rough2)"><rect x="290" y="110" width="200" height="50" rx="4" fill="#dcecd2" fill-opacity="0.5" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="390" y="140" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">等于 x（e+b）</text>
  <g filter="url(#rough2)"><rect x="500" y="110" width="200" height="50" rx="4" fill="#cfe0f5" fill-opacity="0.4" stroke="#446688" stroke-width="1.4"/></g>
  <text x="600" y="140" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">大于 x（c）</text>
  <g filter="url(#rough2)"><line x1="390" y1="96" x2="390" y2="176" stroke="#4a7a3a" stroke-width="2.0" stroke-dasharray="5 3"/></g>
  <text x="390" y="196" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">pos 必须在这里</text>
  <text x="450" y="236" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">对每个 t 枚举 a，取 b = max(0, pos−l−a−e)</text>
</svg>
