<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="75"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="450" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">180D：尽量长地匹配 t 的前缀，再放一个更大的字母</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="60.0" y="66.0" width="600.0" height="50.0" fill="#ffffff" stroke="#999999" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="76.0" y="96.0" text-anchor="start" font-size="12.5" fill="#999999" font-weight="bold" filter="url(#rough2)">k=3：前缀 &quot;bob&quot;</text>
  <text x="300.0" y="96.0" text-anchor="start" font-size="11.5" fill="#444" filter="url(#rough2)">s 里没有 o，不可行</text>
  <rect x="60.0" y="128.0" width="600.0" height="50.0" fill="#ffffff" stroke="#999999" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="76.0" y="158.0" text-anchor="start" font-size="12.5" fill="#999999" font-weight="bold" filter="url(#rough2)">k=2：前缀 &quot;bo&quot;</text>
  <text x="300.0" y="158.0" text-anchor="start" font-size="11.5" fill="#444" filter="url(#rough2)">同样缺 o，不可行</text>
  <rect x="60.0" y="190.0" width="600.0" height="50.0" fill="#ffffff" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="76.0" y="220.0" text-anchor="start" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">k=1：前缀 &quot;b&quot;</text>
  <text x="300.0" y="220.0" text-anchor="start" font-size="11.5" fill="#444" filter="url(#rough2)">剩余 {a,a,d}，没有 &gt; &quot;o&quot; 的字母</text>
  <rect x="60.0" y="252.0" width="600.0" height="50.0" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="76.0" y="282.0" text-anchor="start" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">k=0：空前缀</text>
  <text x="300.0" y="282.0" text-anchor="start" font-size="11.5" fill="#444" filter="url(#rough2)">选最小的 &gt; &quot;b&quot; 的字母 d，其余排序 → daab</text>
  <rect x="40.0" y="352.0" width="640.0" height="76.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="54.0" y="375.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">k 越大，答案与 t 的公共前缀越长，字典序越小；所以从最大的可行 k 开始找</text>
  <text x="54.0" y="401.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">可行 k：t[0..k-1] 能从 s 里凑出，且剩余字母里存在 &gt; t[k] 的字母</text>
</svg>
