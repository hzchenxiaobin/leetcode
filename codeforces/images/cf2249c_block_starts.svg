<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold"
        filter="url(#rough2)">块数 = 块首的个数：v 是块首 ⟺ v−1 ∉ S</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888"
        filter="url(#rough2)">S = {1,2,5,7,8,9}，分成 3 个块，块首恰为 1、5、7</text>

  <g filter="url(#rough2)">
    <text x="117" y="68" text-anchor="middle" font-size="10.5" fill="#b85450">块首</text>
    <text x="303" y="68" text-anchor="middle" font-size="10.5" fill="#b85450">块首</text>
    <text x="395" y="68" text-anchor="middle" font-size="10.5" fill="#b85450">块首</text>
    <path d="M 117 74 L 117 80" stroke="#b85450" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M 303 74 L 303 80" stroke="#b85450" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M 395 74 L 395 80" stroke="#b85450" stroke-width="2" marker-end="url(#arr)"/>
  </g>

  <!-- 9 个值格子 -->
  <g filter="url(#rough2)" font-size="14" text-anchor="middle">
    <rect x="73" y="86" width="46" height="42" fill="#e8f0fe" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="96" y="113" fill="#3a4a66">1</text>
    <rect x="119" y="86" width="46" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="142" y="113" fill="#3a4a66">2</text>
    <rect x="165" y="86" width="46" height="42" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="4 3" rx="4"/>
    <text x="188" y="113" fill="#999">3</text>
    <rect x="211" y="86" width="46" height="42" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="4 3" rx="4"/>
    <text x="234" y="113" fill="#999">4</text>
    <rect x="257" y="86" width="46" height="42" fill="#e8f0fe" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="280" y="113" fill="#3a4a66">5</text>
    <rect x="303" y="86" width="46" height="42" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="4 3" rx="4"/>
    <text x="326" y="113" fill="#999">6</text>
    <rect x="349" y="86" width="46" height="42" fill="#e8f0fe" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="372" y="113" fill="#3a4a66">7</text>
    <rect x="395" y="86" width="46" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="418" y="113" fill="#3a4a66">8</text>
    <rect x="441" y="86" width="46" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="464" y="113" fill="#3a4a66">9</text>
  </g>

  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <rect x="73" y="140" width="92" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6"/>
    <text x="119" y="156" fill="#3a5a30">块 1（2 个）</text>
    <rect x="257" y="140" width="46" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6"/>
    <text x="280" y="156" fill="#8a6a20">块 2</text>
    <rect x="349" y="140" width="138" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6"/>
    <text x="418" y="156" fill="#3a5a30">块 3（3 个）</text>
  </g>

  <rect x="48" y="184" width="464" height="66" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="64" y="206" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">加入一个值 x 时块数怎么变</text>
  <text x="64" y="226" font-size="11" fill="#555" filter="url(#rough2)">块数 += 1 − [x−1 ∈ S] − [x+1 ∈ S]：x 自成一块，左右各有一个邻居就各吞并一次</text>
  <text x="64" y="242" font-size="11" fill="#555" filter="url(#rough2)">所以块数可以升降，只有「全程都 ≤ 2」才是好起点</text>

  <rect x="48" y="264" width="464" height="48" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="64" y="284" font-size="11" fill="#3a4a66" font-weight="bold" filter="url(#rough2)">关键改写</text>
  <text x="64" y="302" font-size="11" fill="#555" filter="url(#rough2)">块数 = #{v ∈ S : v−1 ∉ S}：只看「哪些 v 的前驱还没读到」，不用真的去数块</text>
</svg>
