<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="41"/>
    <feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></defs>
  <rect width="720" height="300" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">坐标范围 1e9，但格子只有 1e5 个 → 用哈希存格子</text>
  <rect x="60" y="60" width="600" height="58" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="74" y="84" font-size="12" fill="#2f4a66" filter="url(#rough2)">把每个允许格子编码成一个 64 位整数：key = row × 1000000007 + col（row,col ≤ 1e9，不会碰撞）</text>
  <text x="74" y="106" font-size="12" fill="#2f4a66" filter="url(#rough2)">放进 unordered_set；BFS 时用同一个公式检查邻居是否允许，并顺手把访问过的删掉</text>
  <text x="60" y="152" font-size="12" fill="#2b2b2b" filter="url(#rough2)">另一条路：把每行的区间排序后二分查找。两种都能过，哈希更短。</text>
  <rect x="60" y="170" width="600" height="58" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="74" y="194" font-size="12" fill="#2f5223" filter="url(#rough2)">复杂度：建表 O(总格子数)，BFS 每个格子检查 8 个邻居，均摊 O(1) 查哈希</text>
  <text x="74" y="216" font-size="12" fill="#2f5223" filter="url(#rough2)">总复杂度 O(8 × 1e5)，与 1e9 × 1e9 的棋盘大小完全无关</text>
  <text x="60" y="262" font-size="12" fill="#666" filter="url(#rough2)">注意：起点和终点一定在允许格子里（题面保证）；若 BFS 结束还没到终点，输出 −1。</text>
</svg>
