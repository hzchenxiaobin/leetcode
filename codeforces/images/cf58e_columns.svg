<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="590"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8a2b28"/>
    </marker>
  </defs>
  <rect width="760" height="330" fill="#fafafa"/>
  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">把 a、b、c 的每一位"插"进 x、y、z 的任意位置，再让加法成立</text>
  <path d="M 60 40 Q 380 48 700 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <text x="60" y="74" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1：2+4=5 → 21+4=25</text>
  <g font-size="16">
    <text x="120" y="112" fill="#2b2b2b" filter="url(#rough2)">2</text>
    <text x="146" y="112" fill="#8a2b28" filter="url(#rough2)">1</text>
    <text x="180" y="112" fill="#2b2b2b" filter="url(#rough2)">+</text>
    <text x="212" y="112" fill="#2b2b2b" filter="url(#rough2)">4</text>
    <text x="120" y="160" fill="#2b2b2b" filter="url(#rough2)">2</text>
    <text x="146" y="160" fill="#8a2b28" filter="url(#rough2)">5</text>
  </g>
  <path d="M 100 124 L 240 124" stroke="#2b2b2b" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="264" y="112" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">x 的 '2' 是 a 的位（十位），'1' 是补的；</text>
  <text x="264" y="132" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">z 的 '5' 是 c 的位（个位），'2' 是补的。</text>
  <text x="264" y="152" font-size="10.5" fill="#8a2b28" filter="url(#rough2)">列对齐：1+4=5（个位），2+0=2（十位）。</text>

  <text x="60" y="204" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2：1+1=3 → 1+31=32</text>
  <g font-size="16">
    <text x="132" y="242" fill="#2b2b2b" filter="url(#rough2)">1</text>
    <text x="204" y="242" fill="#2b2b2b" filter="url(#rough2)">3</text>
    <text x="230" y="242" fill="#2b2b2b" filter="url(#rough2)">1</text>
    <text x="180" y="242" fill="#2b2b2b" filter="url(#rough2)">+</text>
    <text x="204" y="290" fill="#2b2b2b" filter="url(#rough2)">3</text>
    <text x="230" y="290" fill="#8a2b28" filter="url(#rough2)">2</text>
  </g>
  <path d="M 100 254 L 250 254" stroke="#2b2b2b" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="272" y="242" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">y 的 '1' 是 b 的位，'3' 是补的；z 的 '3' 是 c 的位，'2' 是补的。</text>
  <text x="272" y="262" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">列对齐：1+1=2（个位），0+3=3（十位）——补的位参与进位。</text>
  <text x="272" y="282" font-size="10.5" fill="#8a2b28" filter="url(#rough2)">同一长度下还有别的解（如 12+1=13），输出任意一个最短解即可。</text>

  <rect x="60" y="300" width="640" height="22" rx="6" fill="#fbe3c8" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="72" y="316" font-size="10" fill="#2b2b2b" filter="url(#rough2)">关键难点：a、b、c 的位可以和彼此、和加法列"错位"，所以不能按列同步匹配——必须逐位枚举插入与进位。</text>
</svg>
