<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="350" fill="#fafafa"/>
  <text x="360.0" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">208E：p 级祖先 + 同深度计数</text>
  <path d="M 144.00 46 Q 360.0 52 576.00 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="72" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">两人是 p 级表亲 ⟺ 他们的 p 级祖先相同（每人至多一个 p 级祖先）。</text>
  <text x="60" y="92" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">所以对查询 (v,p)：先倍增跳到 a = v 的 p 级祖先，再数 a 的子树里与 v 同深度的点数 − 1。</text>
  <rect x="60" y="116" width="300" height="96" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="134" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">1) 倍增求 p 级祖先（不存在则 0）</text>
  <text x="74" y="156" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">2) 每个深度存一份 tin 升序表</text>
  <text x="74" y="178" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">3) 在 depth[v] 的表里二分 [tin[a], tout[a]]</text>
  <text x="74" y="200" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">4) 数量 − 1 就是答案</text>
  <rect x="380" y="116" width="290" height="96" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="394" y="134" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">欧拉序把“子树”变成一段连续区间，</text>
  <text x="394" y="156" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">“同深度”用分深度的桶保证，</text>
  <text x="394" y="178" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">两件事都是 O(log n)。</text>
  <text x="394" y="200" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">预处理 O(n log n)。</text>
  <text x="60" y="240" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">注意输入是森林（可以有多个根），要分别 DFS 并把各根的区间写成连续的。</text>
  <rect x="60" y="262" width="620" height="62" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="279" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">样例：查询 (2,1) 的 1 级祖先是 1，子树中深度 1 的点是 {2,3} ⇒ 2 − 1 = 1。</text>
</svg>
