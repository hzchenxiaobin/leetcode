<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" width="780" height="430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="780" height="430" fill="#fafafa"/>

  <text x="390" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：每组数据一次线性扫描即可判定</text>
  <path d="M 208 42 Q 390 49 572 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- ① 读入 -->
  <rect x="250" y="60" width="290" height="42" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="395" y="87" text-anchor="middle" font-size="13.2" fill="#2f4a66" filter="url(#rough2)">读入 n、k 与 a[1..n]</text>
  <path d="M 395 102 L 395 116" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② 计数 -->
  <rect x="250" y="118" width="290" height="42" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="395" y="145" text-anchor="middle" font-size="13.2" fill="#2f4a66" filter="url(#rough2)">桶计数：c[v] = 值 v 出现的次数</text>
  <path d="M 395 160 L 395 174" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ③ 找 g -->
  <rect x="250" y="176" width="290" height="46" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="395" y="198" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">g ← 最小的 v，使 c[v] &lt; 2k</text>
  <text x="395" y="215" text-anchor="middle" font-size="11.6" fill="#8a6015" filter="url(#rough2)">（v 从 0 递增扫描；越界处 c = 0）</text>
  <path d="M 395 222 L 395 236" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ④ 判定 -->
  <rect x="250" y="238" width="290" height="48" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="395" y="268" text-anchor="middle" font-size="14" font-weight="bold" fill="#33582a" filter="url(#rough2)">输出 c[g] == 2k−1 ? "YES" : "NO"</text>
  <path d="M 395 286 L 395 300" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ⑤ 多测 -->
  <rect x="250" y="302" width="290" height="40" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="395" y="327" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">进入下一组测试（共 t 组）</text>

  <!-- 左注：为什么 2k -->
  <rect x="26" y="170" width="182" height="116" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="42" y="194" font-size="12" font-weight="bold" fill="#33582a" filter="url(#rough2)">阈值为什么是 2k</text>
  <text x="42" y="218" font-size="11.5" fill="#33582a" filter="url(#rough2)">双方各自要 ≥ k 张 v，</text>
  <text x="42" y="238" font-size="11.5" fill="#33582a" filter="url(#rough2)">共需 2k 张，这正是</text>
  <text x="42" y="258" font-size="11.5" fill="#33582a" filter="url(#rough2)">「两人同时通过 v」的门槛</text>
  <path d="M 210 228 C 224 230 232 210 244 202" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 右注：为什么只查 g -->
  <rect x="572" y="170" width="182" height="116" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="588" y="194" font-size="12" font-weight="bold" fill="#8c3a37" filter="url(#rough2)">为什么只看 g</text>
  <text x="588" y="218" font-size="11.5" fill="#8c3a37" filter="url(#rough2)">v &lt; g 处不会出现平局，</text>
  <text x="588" y="238" font-size="11.5" fill="#8c3a37" filter="url(#rough2)">v &gt; g 处已无翻盘余地，</text>
  <text x="588" y="258" font-size="11.5" fill="#8c3a37" filter="url(#rough2)">胜负在 g 处就被锁死</text>
  <path d="M 570 228 C 556 230 548 210 536 202" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <text x="390" y="376" text-anchor="middle" font-size="11.8" fill="#66788c" filter="url(#rough2)">每组 O(n) 计数 + O(n) 扫描，总复杂度 O(Σn)；c 数组开 n+2 以容纳 g 越界到 n+1 的情形</text>
  <text x="390" y="400" text-anchor="middle" font-size="11.8" fill="#66788c" filter="url(#rough2)">2k ≤ 2n ≤ 4·10^5，32 位整数足够，无需 long long</text>
</svg>
