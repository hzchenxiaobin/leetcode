<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="53"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>

  <rect width="760" height="430" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">演算：路径 6 – 5 – 3 – 4 – 7，a = 1, 2, 4, 8, 1，取 x = 6、y = 7</text>

  <!-- 路径链 -->
  <line x1="124" y1="90" x2="211" y2="90" stroke="#888" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="259" y1="90" x2="346" y2="90" stroke="#888" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="394" y1="90" x2="481" y2="90" stroke="#888" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="529" y1="90" x2="616" y2="90" stroke="#888" stroke-width="1.8" filter="url(#rough2)"/>

  <circle cx="100" cy="90" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="235" cy="90" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="370" cy="90" r="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <circle cx="505" cy="90" r="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="640" cy="90" r="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>

  <text x="100" y="96" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">6</text>
  <text x="235" y="96" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">5</text>
  <text x="370" y="96" text-anchor="middle" font-size="13" fill="#a14340" filter="url(#rough2)">3</text>
  <text x="505" y="96" text-anchor="middle" font-size="13" fill="#3c5e2e" filter="url(#rough2)">4</text>
  <text x="640" y="96" text-anchor="middle" font-size="13" fill="#3c5e2e" filter="url(#rough2)">7</text>

  <rect x="72" y="122" width="56" height="28" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="207" y="122" width="56" height="28" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="342" y="122" width="56" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="477" y="122" width="56" height="28" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="612" y="122" width="56" height="28" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="141" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">1</text>
  <text x="235" y="141" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">2</text>
  <text x="370" y="141" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">4</text>
  <text x="505" y="141" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">8</text>
  <text x="640" y="141" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">1</text>

  <text x="370" y="52" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">l = 3（x 与 y 的 LCA）</text>

  <rect x="60" y="166" width="200" height="52" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="160" y="187" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">U = l→x = [4, 2, 1]：全部位不交</text>
  <text x="160" y="207" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">A_U = 6</text>

  <rect x="278" y="166" width="200" height="52" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="378" y="187" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">D = l→y = [4, 8, 1]：全部位不交</text>
  <text x="378" y="207" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">A_D = 6</text>

  <rect x="496" y="166" width="204" height="52" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="598" y="187" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">两段重复计数 {l}</text>
  <text x="598" y="207" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">故先减 1</text>

  <text x="60" y="246" text-anchor="start" font-size="12" fill="#555" filter="url(#rough2)">交叉段：l 下方左侧取 i 个点、右侧取 j 个点，共 4 种组合</text>

  <rect x="60" y="256" width="150" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="135" y="276" text-anchor="middle" font-size="11" fill="#3c5e2e" filter="url(#rough2)">(i,j) = (1,1) ✓</text>
  <text x="135" y="294" text-anchor="middle" font-size="11" fill="#3c5e2e" filter="url(#rough2)">4, 2, 8 位不交</text>

  <rect x="228" y="256" width="150" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="303" y="276" text-anchor="middle" font-size="11" fill="#3c5e2e" filter="url(#rough2)">(i,j) = (1,2) ✓</text>
  <text x="303" y="294" text-anchor="middle" font-size="11" fill="#3c5e2e" filter="url(#rough2)">4, 2, 8, 1 位不交</text>

  <rect x="396" y="256" width="150" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="471" y="276" text-anchor="middle" font-size="11" fill="#3c5e2e" filter="url(#rough2)">(i,j) = (2,1) ✓</text>
  <text x="471" y="294" text-anchor="middle" font-size="11" fill="#3c5e2e" filter="url(#rough2)">4, 2, 1, 8 位不交</text>

  <rect x="564" y="256" width="150" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="639" y="276" text-anchor="middle" font-size="11" fill="#a14340" filter="url(#rough2)">(i,j) = (2,2) ✗</text>
  <text x="639" y="294" text-anchor="middle" font-size="11" fill="#a14340" filter="url(#rough2)">1 出现两次</text>

  <rect x="60" y="330" width="654" height="72" rx="10" fill="#fafafa" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="387" y="360" text-anchor="middle" font-size="14.5" fill="#2f4a66" filter="url(#rough2)">ans = A_U + A_D − 1 + cross = 6 + 6 − 1 + 3 = 14</text>
  <text x="387" y="386" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">暴力枚举同样得到 14：5 个单点 + 4 个二连 + 3 个三连 + 2 个四连（整段五连因两个 1 冲突）</text>
</svg>
