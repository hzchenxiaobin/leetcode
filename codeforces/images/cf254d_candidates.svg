  <text x="520" y="130" text-anchor="start" font-size="13" fill="#3d6b2f" filter="url(#rough2)">候选数量上界 (2d+1)^2 ≤ 289</text>
  <text x="520" y="158" text-anchor="start" font-size="12.5" fill="#555555" filter="url(#rough2)">每个候选做一次深度 d 的 BFS（≤ 289 格）</text>
