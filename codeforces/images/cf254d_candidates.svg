  <text x="520" y="210" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">枚举它附近的 ≤ 289 个候选并检查并集</text>
  <text x="520" y="250" text-anchor="start" font-size="13" fill="#b05a5a" filter="url(#rough2)">总代价 289 × 289 × 289 ≈ 2.4×10^7</text>
  <text x="440" y="356" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">若两侧都枚举完仍盖不住所有老鼠 → 输出 -1</text>
