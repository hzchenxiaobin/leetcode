  <rect width="880" height="380" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">第一颗手雷必在某只老鼠 d 格之内</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">所以第一颗的候选只有 (2d+1)^2 量级；第二颗同理只能是"第一只没被盖住的老鼠"附近</text>
