<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="430" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="38" text-anchor="middle" font-size="18.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">28E：在 (t1,t2) 平面上取字典序最小的可行点</text>
  <path d="M 137 50 Q 380 56 623 50" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <line x1="90" y1="350" x2="560" y2="350" stroke="#2b2b2b" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="90" y1="350" x2="90" y2="90" stroke="#2b2b2b" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="566" y="356" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">t1（先最小化）</text>
  <text x="96" y="82" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">t2（再最小化）</text>
  <path d="M 90 350 L 250 350 L 390 250 L 300 130 L 120 200 Z" stroke="#446688" stroke-width="2.2" fill="#e8f0fe" filter="url(#rough2)"/>
  <text x="250" y="300" text-anchor="middle" font-size="13" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">可行域 R</text>
  <text x="250" y="320" text-anchor="middle" font-size="10.5" fill="#2f4a66" font-weight="normal" filter="url(#rough2)">（多边形原像 ∩ t1≥0 ∩ t2≥0 ∩ z2≥0）</text>
  <text x="120" y="218" text-anchor="start" font-size="10.5" fill="#8a8a8a" font-weight="normal" filter="url(#rough2)" transform="rotate(-90 120 218)">t1 = 0</text>
  <text x="252" y="368" text-anchor="middle" font-size="10.5" fill="#8a8a8a" font-weight="normal" filter="url(#rough2)">t2 = 0</text>
  <text x="400" y="246" text-anchor="start" font-size="10.5" fill="#8a8a8a" font-weight="normal" filter="url(#rough2)">z2 = 0（自由落体到地面）</text>
  <circle cx="250" cy="350" r="6" fill="#b6483f" stroke="none" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="258" y="344" text-anchor="start" font-size="12" fill="#b6483f" font-weight="bold" filter="url(#rough2)">字典序最小点 (t1*, t2*)</text>
  <rect x="60" y="96" width="170" height="80" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="72" y="118" text-anchor="start" font-size="11" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">为什么只查候选点：</text>
  <text x="72" y="140" text-anchor="start" font-size="10.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">顶点原像 + 边与</text>
  <text x="72" y="160" text-anchor="start" font-size="10.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">约束线的交点</text>
  <text x="400" y="120" text-anchor="start" font-size="11.5" fill="#555" font-weight="normal" filter="url(#rough2)">线性目标在凸多边形上的最小值</text>
  <text x="400" y="142" text-anchor="start" font-size="11.5" fill="#555" font-weight="normal" filter="url(#rough2)">一定取在顶点 → 只需枚举候选点，</text>
  <text x="400" y="164" text-anchor="start" font-size="11.5" fill="#555" font-weight="normal" filter="url(#rough2)">先比 t1、再比 t2。</text>
</svg>
