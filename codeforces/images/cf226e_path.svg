<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="400" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">一次查询：路径 a → LCA → b，中间点按顺序数第 k 个可用</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">可用 ⟺ 从未被袭击，或袭击年份 ≤ y，或袭击年份 &gt; 当前年 i</text>
  <g filter="url(#rough2)"><circle cx="420" cy="96" r="20" fill="#f6e3c4" fill-opacity="0.9" stroke="#a0522d" stroke-width="1.7"/></g>
  <text x="420" y="101" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <g filter="url(#rough2)"><circle cx="300" cy="170" r="20" fill="#d6e6f2" fill-opacity="0.9" stroke="#446688" stroke-width="1.7"/></g>
  <text x="300" y="175" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><circle cx="540" cy="170" r="20" fill="#d6e6f2" fill-opacity="0.9" stroke="#446688" stroke-width="1.7"/></g>
  <text x="540" y="175" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">6</text>
  <g filter="url(#rough2)"><circle cx="230" cy="244" r="20" fill="#d7ecd0" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.7"/></g>
  <text x="230" y="249" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><circle cx="320" cy="244" r="20" fill="#d7ecd0" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.7"/></g>
  <text x="320" y="249" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><circle cx="400" cy="244" r="20" fill="#d7ecd0" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.7"/></g>
  <text x="400" y="249" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><line x1="420" y1="116" x2="300" y2="150" stroke="#999999" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><line x1="420" y1="116" x2="540" y2="150" stroke="#999999" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><line x1="300" y1="190" x2="230" y2="226" stroke="#999999" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><line x1="300" y1="190" x2="320" y2="226" stroke="#999999" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><line x1="300" y1="190" x2="400" y2="226" stroke="#999999" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><line x1="230" y1="268" x2="230" y2="300" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="4 3"/></g>
  <g filter="url(#rough2)"><line x1="400" y1="268" x2="400" y2="300" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="4 3"/></g>
  <text x="230" y="318" text-anchor="middle" font-size="11" fill="#3d6b2f" filter="url(#rough2)">a = 1</text>
  <text x="400" y="318" text-anchor="middle" font-size="11" fill="#3d6b2f" filter="url(#rough2)">b = 4</text>
  <g filter="url(#rough2)"><path d="M 230 262 L 300 196 L 320 226" fill="none" stroke="#a0522d" stroke-width="2.0" stroke-dasharray="5 3" stroke-linejoin="round"/></g>
  <g filter="url(#rough2)"><path d="M 320 226 L 300 196 L 400 226" fill="none" stroke="#a0522d" stroke-width="2.0" stroke-dasharray="5 3" stroke-linejoin="round"/></g>
  <text x="420" y="348" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">路径 1 → 2 → 4，去掉端点后中间是 {2}（LCA 是 2）</text>
  <g filter="url(#rough2)"><rect x="150" y="366" width="540" height="26" rx="4" fill="#faf3ec" fill-opacity="0.85" stroke="#c8a48a" stroke-width="1.3"/></g>
  <text x="420" y="384" text-anchor="middle" font-size="11.5" fill="#8a4b2a" filter="url(#rough2)">若 2 被亵渎且 k = 1 ⇒ 输出 -1</text>
</svg>
