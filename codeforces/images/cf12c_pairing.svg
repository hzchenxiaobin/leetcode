<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="89"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="340" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">C：次数降序 × 价格升序 = 最小，反着配 = 最大</text>
  <path d="M 110 42 Q 380 47 650 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <text x="132" y="112" text-anchor="end" font-size="12" fill="#2b2b2b" filter="url(#rough2)">清单次数</text>
  <rect x="140" y="88" width="100" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="252" y="88" width="100" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="364" y="88" width="100" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="476" y="88" width="100" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="190" y="117" text-anchor="middle" font-size="17" fill="#2f4a66" filter="url(#rough2)">3</text>
  <text x="302" y="117" text-anchor="middle" font-size="17" fill="#2f4a66" filter="url(#rough2)">2</text>
  <text x="414" y="117" text-anchor="middle" font-size="17" fill="#2f4a66" filter="url(#rough2)">1</text>
  <text x="526" y="117" text-anchor="middle" font-size="17" fill="#2f4a66" filter="url(#rough2)">1</text>

  <text x="132" y="202" text-anchor="end" font-size="12" fill="#2f5223" filter="url(#rough2)">价格升序</text>
  <rect x="140" y="178" width="100" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="252" y="178" width="100" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="364" y="178" width="100" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="476" y="178" width="100" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="190" y="207" text-anchor="middle" font-size="17" fill="#2f5223" filter="url(#rough2)">1</text>
  <text x="302" y="207" text-anchor="middle" font-size="17" fill="#2f5223" filter="url(#rough2)">2</text>
  <text x="414" y="207" text-anchor="middle" font-size="17" fill="#2f5223" filter="url(#rough2)">5</text>
  <text x="526" y="207" text-anchor="middle" font-size="17" fill="#2f5223" filter="url(#rough2)">9</text>

  <text x="132" y="282" text-anchor="end" font-size="12" fill="#8c3a36" filter="url(#rough2)">价格降序</text>
  <rect x="140" y="258" width="100" height="44" rx="6" fill="#fdeceb" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="252" y="258" width="100" height="44" rx="6" fill="#fdeceb" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="364" y="258" width="100" height="44" rx="6" fill="#fdeceb" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="476" y="258" width="100" height="44" rx="6" fill="#fdeceb" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="190" y="287" text-anchor="middle" font-size="17" fill="#8c3a36" filter="url(#rough2)">9</text>
  <text x="302" y="287" text-anchor="middle" font-size="17" fill="#8c3a36" filter="url(#rough2)">5</text>
  <text x="414" y="287" text-anchor="middle" font-size="17" fill="#8c3a36" filter="url(#rough2)">2</text>
  <text x="526" y="287" text-anchor="middle" font-size="17" fill="#8c3a36" filter="url(#rough2)">1</text>

  <line x1="190" y1="132" x2="190" y2="178" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="302" y1="132" x2="302" y2="178" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="414" y1="132" x2="414" y2="178" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="526" y1="132" x2="526" y2="178" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>

  <line x1="190" y1="222" x2="190" y2="258" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="302" y1="222" x2="302" y2="258" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="414" y1="222" x2="414" y2="258" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="526" y1="222" x2="526" y2="258" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>

  <text x="600" y="204" font-size="10.5" fill="#2f5223" filter="url(#rough2)">↓ 对应相乘求和</text>
  <text x="600" y="284" font-size="10.5" fill="#8c3a36" filter="url(#rough2)">↓ 对应相乘求和</text>

  <text x="380" y="330" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">最小 = 3×1 + 2×2 + 1×5 + 1×9 = 21　　最大 = 3×9 + 2×5 + 1×2 + 1×1 = 40</text>
</svg>
