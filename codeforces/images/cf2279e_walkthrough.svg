<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="19"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="680" height="420" fill="#fafafa"/>

  <text x="24" y="32" font-size="17" fill="#333" filter="url(#rough2)">样例走查：切点、左右表与匹配</text>

  <!-- ===== sample 1 ===== -->
  <text x="24" y="62" font-size="13" fill="#446688" filter="url(#rough2)">样例 1：a = [1, 2, 1]</text>
  <g>
    <rect x="34" y="72" width="48" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="58" y="95" text-anchor="middle" font-size="13" fill="#2f4f2a" filter="url(#rough2)">1</text>
    <rect x="90" y="72" width="48" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="114" y="95" text-anchor="middle" font-size="13" fill="#33506e" filter="url(#rough2)">2</text>
    <rect x="146" y="72" width="48" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="170" y="95" text-anchor="middle" font-size="13" fill="#2f4f2a" filter="url(#rough2)">1</text>
  </g>
  <text x="58" y="122" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <text x="114" y="122" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">1</text>
  <text x="170" y="122" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">2</text>

  <rect x="216" y="64" width="440" height="70" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="228" y="86" font-size="12" fill="#2f4f2a" filter="url(#rough2)">切点 i = 0：左表 = {(1, 代价 1)}</text>
  <text x="228" y="106" font-size="12" fill="#2f4f2a" filter="url(#rough2)">右：pos1 得 2（代价 1）✗；跳过 pos1 到 pos2 得 1（代价 3）✓</text>
  <text x="228" y="126" font-size="12" fill="#7d2b27" filter="url(#rough2)">总代价 = 1 + 3 − 1 = 3（三次操作：1⊕2 → 3，3⊕2 → 1，1⊕1 → 0）</text>

  <!-- ===== sample 2 ===== -->
  <text x="24" y="176" font-size="13" fill="#446688" filter="url(#rough2)">样例 2：a = [4, 2, 3, 1]</text>
  <g>
    <rect x="34" y="186" width="48" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="58" y="209" text-anchor="middle" font-size="13" fill="#33506e" filter="url(#rough2)">4</text>
    <rect x="90" y="186" width="48" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="114" y="209" text-anchor="middle" font-size="13" fill="#2f4f2a" filter="url(#rough2)">2</text>
    <rect x="146" y="186" width="48" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="170" y="209" text-anchor="middle" font-size="13" fill="#2f4f2a" filter="url(#rough2)">3</text>
    <rect x="202" y="186" width="48" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="226" y="209" text-anchor="middle" font-size="13" fill="#2f4f2a" filter="url(#rough2)">1</text>
  </g>
  <text x="58" y="236" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <text x="114" y="236" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">1</text>
  <text x="170" y="236" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">2</text>
  <text x="226" y="236" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">3</text>

  <rect x="272" y="178" width="384" height="94" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="284" y="200" font-size="12" fill="#33506e" filter="url(#rough2)">取 S = {1,2,3}：2⊕3⊕1 = 0，span = 2，|S| = 3 ⇒ cost = 2</text>
  <text x="284" y="220" font-size="12" fill="#33506e" filter="url(#rough2)">切点 i = 1：左表 = {(2, 1), (4⊕2 = 6, 2)}</text>
  <text x="284" y="240" font-size="12" fill="#33506e" filter="url(#rough2)">右：pos2 得 3（代价 1）✗；再并入 pos3 得 3⊕1 = 2（代价 2）✓</text>
  <text x="284" y="260" font-size="12" fill="#7d2b27" filter="url(#rough2)">总代价 = 1 + 2 − 1 = 2（a₂⊕a₃ 得 2，再与 a₁ 合并）</text>

  <path d="M170,222 C214,250 250,250 268,244" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr3)" filter="url(#rough2)"/>

  <!-- ===== conclusion ===== -->
  <rect x="34" y="290" width="612" height="112" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="48" y="314" font-size="13" fill="#6b5316" filter="url(#rough2)">样例 1 → 3　｜　样例 2 → 2　｜　样例 4（含 0）→ 0</text>
  <text x="48" y="338" font-size="13" fill="#6b5316" filter="url(#rough2)">样例 3：1, 2, 4, 8, 16 线性无关 ⇒ 不存在零异或子集 ⇒ −1</text>
  <text x="48" y="362" font-size="13" fill="#6b5316" filter="url(#rough2)">样例 5：n = 1 且 a₁ ≠ 0 ⇒ 没有任何相邻位置可操作 ⇒ −1</text>
  <text x="48" y="386" font-size="12" fill="#94403c" filter="url(#rough2)">注意 3 次操作确实能造出 0：把 2 先并上去、再把结果并到右边，与 cost(S) 完全一致</text>
</svg>
