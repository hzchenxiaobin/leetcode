<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1315"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="700" height="300" fill="#fafafa"/>
  <text x="350.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按男生人数分类</text>
  <path d="M 112.0 42 Q 350.0 48 588.0 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="350.0" y="286" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">Σ_b C(n,b)·C(m,t−b)，b≥4 且 t−b≥1</text>
  <rect x="70" y="70" width="250" height="70" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="195" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">男生 b 人</text>
  <text x="195" y="124" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">b ≥ 4，C(n,b)</text>
  <text x="340" y="110" text-anchor="middle" font-size="20" fill="#555555" filter="url(#rough2)">+</text>
  <rect x="380" y="70" width="250" height="70" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="505" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#335478" filter="url(#rough2)">女生 t−b 人</text>
  <text x="505" y="124" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">≥1，C(m,t−b)</text>
  <text x="350" y="185" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">样例 1：C(5,4)C(2,1) = 5·2 = 10</text>
  <text x="350" y="220" text-anchor="middle" font-size="12.5" fill="#335478" filter="url(#rough2)">样例 2：C(4,4)C(3,1) = 3</text>
  <text x="350" y="255" text-anchor="middle" font-size="11.5" fill="#8c2f2c" filter="url(#rough2)">C(60,30) ≈ 1.18×10¹⁷，用 long long</text>
</svg>
