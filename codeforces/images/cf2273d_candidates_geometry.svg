<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="330" fill="#fafafa"/>

  <text x="290" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">一次询问（a, b）只暴露 4 个候选点</text>

  <!-- number line -->
  <path d="M46,168 L536,168" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="46" y="192" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">1</text>
  <text x="536" y="192" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">10⁴</text>

  <!-- candidate pair boxes -->
  <rect x="106" y="96" width="104" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="352" y="96" width="104" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- ticks and points -->
  <path d="M120,152 L120,178" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <path d="M198,152 L198,178" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <path d="M366,152 L366,178" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <path d="M444,152 L444,178" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="120" cy="168" r="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="198" cy="168" r="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="366" cy="168" r="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="444" cy="168" r="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>

  <!-- probes a and b -->
  <circle cx="159" cy="168" r="7" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <circle cx="405" cy="168" r="7" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="159" y="212" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">a = 1429</text>
  <text x="405" y="212" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">b = 7143</text>

  <!-- candidate labels -->
  <text x="120" y="88" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">a−p</text>
  <text x="198" y="88" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">a+p</text>
  <text x="366" y="88" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">b−p</text>
  <text x="444" y="88" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">b+p</text>

  <!-- gap labels -->
  <path d="M120,132 L198,132" stroke="#b85450" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M198,132 L120,132" stroke="#b85450" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="159" y="126" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">2p</text>
  <path d="M366,132 L444,132" stroke="#b85450" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M444,132 L366,132" stroke="#b85450" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="405" y="126" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">2p</text>
  <path d="M198,232 L366,232" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M366,232 L198,232" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="226" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">(b−a) − 2p</text>

  <rect x="118" y="258" width="344" height="48" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="278" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">p = min(|x−a|, |x−b|) ⟹ x ∈ {a−p, a+p, b−p, b+p}</text>
  <text x="290" y="296" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">候选恒 ≤ 4；落在 [1,10⁴] 外的候选可直接排除</text>
</svg>
