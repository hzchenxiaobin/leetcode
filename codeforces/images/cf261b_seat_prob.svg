<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="420" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">第 i 位客人能否入座，只看他前面那些人的身高和</text>
  <path d="M 110 42 Q 360 48 610 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 队伍 -->
  <g filter="url(#rough2)">
    <rect x="60" y="72" width="52" height="52" rx="6" fill="#e8f4e0" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="118" y="72" width="52" height="52" rx="6" fill="#e8f4e0" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="176" y="72" width="52" height="52" rx="6" fill="#e8f4e0" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="234" y="72" width="52" height="52" rx="6" fill="#e8f4e0" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="292" y="72" width="52" height="52" rx="6" fill="#dfeafc" stroke="#446688" stroke-width="2.2"/>
    <rect x="350" y="72" width="52" height="52" rx="6" fill="#f4f4f4" stroke="#999" stroke-width="1.4"
          stroke-dasharray="5 3"/>
    <rect x="408" y="72" width="52" height="52" rx="6" fill="#f4f4f4" stroke="#999" stroke-width="1.4"
          stroke-dasharray="5 3"/>
  </g>
  <g font-size="15" text-anchor="middle" fill="#22314a" filter="url(#rough2)">
    <text x="86" y="104">a₁</text>
    <text x="144" y="104">a₂</text>
    <text x="202" y="104">a₃</text>
    <text x="260" y="104">a₄</text>
    <text x="318" y="104">aᵢ</text>
    <text x="376" y="104">…</text>
    <text x="434" y="104">…</text>
  </g>
  <text x="318" y="146" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">被考察的客人</text>
  <g font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">
    <text x="60" y="146">在他之前的人都已入座</text>
  </g>
  <g font-size="11.5" fill="#777" filter="url(#rough2)">
    <text x="376" y="146">他之后的人与他无关</text>
  </g>

  <!-- 关键等价 -->
  <g filter="url(#rough2)">
    <rect x="60" y="162" width="600" height="58" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="360" y="186" text-anchor="middle" font-size="14.5" fill="#22314a" filter="url(#rough2)">
    客人 i 入座 ⟺ 排在他前面的人集合 S 满足 Σ_{j∈S} aⱼ + aᵢ ≤ p
  </text>
  <text x="360" y="208" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">
    注意：S 里的人一定都入座了（队伍是按顺序进的，中途没人被拒），所以只需要一个「身高和」条件
  </text>

  <!-- 随机子集权重 -->
  <text x="60" y="252" font-size="13.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">
    随机排列里，S 恰好在 i 前面的概率
  </text>

  <g filter="url(#rough2)">
    <rect x="60" y="264" width="270" height="96" rx="8" fill="#ffffff" stroke="#888" stroke-width="1.2"/>
  </g>
  <g font-size="12.5" fill="#333" filter="url(#rough2)">
    <text x="74" y="288">先定 i 的位置：n 种，等概率。</text>
    <text x="74" y="312">他前面恰有 k 个人：把 S 排在</text>
    <text x="74" y="334">前 k 位（k! 种），“其余”排后面</text>
    <text x="74" y="354">（(n-1-k)! 种）。</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="360" y="264" width="300" height="96" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <text x="510" y="290" text-anchor="middle" font-size="13" fill="#2f5223" filter="url(#rough2)">
    对每个 |S| = k 的子集都相同
  </text>
  <text x="510" y="316" text-anchor="middle" font-size="14" fill="#2f5223" filter="url(#rough2)">
    P(S) = k!(n-1-k)! / n! = 1 / (n·C(n-1,k))
  </text>
  <text x="510" y="342" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">
    只与 |S| 有关，与具体是谁无关
  </text>

  <g filter="url(#rough2)">
    <rect x="60" y="374" width="600" height="36" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <text x="360" y="398" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">
    所以答案 = Σᵢ (1/n) Σₖ (子集数) / C(n-1,k)，子集数用背包 DP 数
  </text>
</svg>
