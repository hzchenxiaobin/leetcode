<svg xmlns="http://www.w3.org/2000/svg" width="660" height="392" viewBox="0 0 660 392"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="6.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="6.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="660" height="392" fill="#fafafa"/>

  <text x="330" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">删除 aᵢ 只撑宽一条「缝」，补缝只能把右侧往下压</text>
  <text x="330" y="52" text-anchor="middle" font-size="12" fill="#888"
        filter="url(#rough2)">a = [1, 2, 4, 5]，k = 2，删掉 a₂ 后剩 [1, 4, 5]，新缝 4 − 1 = 3 &gt; k</text>

  <!-- 原数组 -->
  <g font-size="10" fill="#999" text-anchor="middle">
    <text x="198" y="66" filter="url(#rough2)">i=1</text>
    <text x="262" y="66" filter="url(#rough2)">i=2</text>
    <text x="326" y="66" filter="url(#rough2)">i=3</text>
    <text x="390" y="66" filter="url(#rough2)">i=4</text>
  </g>
  <rect x="170" y="72" width="56" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="234" y="72" width="56" height="42" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="298" y="72" width="56" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="362" y="72" width="56" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <g font-size="17" font-weight="bold" fill="#2b2b2b" text-anchor="middle">
    <text x="198" y="99" filter="url(#rough2)">1</text>
    <text x="262" y="99" fill="#b85450" filter="url(#rough2)">2</text>
    <text x="326" y="99" filter="url(#rough2)">4</text>
    <text x="390" y="99" filter="url(#rough2)">5</text>
  </g>
  <path d="M262,118 L262,141" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="274" y="135" font-size="11" fill="#b85450" filter="url(#rough2)">删掉 a₂</text>

  <!-- 删除后的数组：位置 2 留空 -->
  <rect x="170" y="146" width="56" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="234" y="146" width="56" height="42" rx="6" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"
        stroke-dasharray="5 4" filter="url(#rough2)"/>
  <rect x="298" y="146" width="56" height="42" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="362" y="146" width="56" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <g font-size="17" font-weight="bold" text-anchor="middle">
    <text x="198" y="173" fill="#2b2b2b" filter="url(#rough2)">1</text>
    <text x="262" y="173" fill="#bbbbbb" filter="url(#rough2)">×</text>
    <text x="326" y="173" fill="#d6a040" filter="url(#rough2)">4</text>
    <text x="390" y="173" fill="#2b2b2b" filter="url(#rough2)">5</text>
  </g>
  <path d="M198,200 L198,192 M198,196 L326,196 M326,200 L326,192"
        stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="262" y="216" text-anchor="middle" font-size="12" fill="#b85450"
        filter="url(#rough2)">缝 = 3 &gt; k = 2</text>

  <!-- 修好之后 -->
  <rect x="170" y="240" width="56" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="234" y="240" width="56" height="42" rx="6" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"
        stroke-dasharray="5 4" filter="url(#rough2)"/>
  <rect x="298" y="240" width="56" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="362" y="240" width="56" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <g font-size="17" font-weight="bold" text-anchor="middle">
    <text x="198" y="267" fill="#2b2b2b" filter="url(#rough2)">1</text>
    <text x="262" y="267" fill="#bbbbbb" filter="url(#rough2)">×</text>
    <text x="326" y="267" fill="#4a7a3a" filter="url(#rough2)">3</text>
    <text x="390" y="267" fill="#4a7a3a" filter="url(#rough2)">5</text>
  </g>
  <path d="M326,222 L326,238" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="336" y="232" font-size="11" fill="#4a7a3a" filter="url(#rough2)">−1</text>

  <!-- 右侧注记 -->
  <g font-size="11.5">
    <text x="436" y="96" fill="#4a7a3a" filter="url(#rough2)">原数组已经满足条件</text>
    <text x="436" y="152" fill="#33517a" filter="url(#rough2)">只剩 a₁、a₃ 这条缝被撑宽</text>
    <text x="436" y="172" fill="#b85450" filter="url(#rough2)">4 − 1 = 3 &gt; k = 2</text>
    <text x="436" y="192" fill="#d6a040" filter="url(#rough2)">欠 e = a₃ − a₁ − k = 1</text>
    <text x="436" y="252" fill="#4a7a3a" filter="url(#rough2)">a₃ 减 1 → 缝 = 2 = k ✓</text>
  </g>

  <!-- 底部结论 -->
  <text x="330" y="306" text-anchor="middle" font-size="12" fill="#444"
        filter="url(#rough2)">只能减 ⇒ 减小 a₁ 反而把缝撑得更大，所以最优解里左侧元素一律不动</text>
  <text x="330" y="328" text-anchor="middle" font-size="12" fill="#444"
        filter="url(#rough2)">补完这条缝，右侧相邻的缝可能被再次撑宽 ⇒ 必须沿后缀连锁传递</text>
  <text x="330" y="354" text-anchor="middle" font-size="11.5" fill="#446688"
        filter="url(#rough2)">记 sᵤ = k − (aᵤ₊₁ − aᵤ) ≥ 0：每一步的下降量按 max(0, y − s) 衰减（见下页）</text>
  <text x="330" y="378" text-anchor="middle" font-size="11" fill="#999"
        filter="url(#rough2)">本例只有 a₃ 被减 1，总代价 = 1</text>
</svg>
