<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect x="-8" y="-8" width="736" height="446" fill="#fafafa"/>

  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1 走查：n = 6，d = 3，p = [2,3,4,5]，r = [5,9,1,3]</text>
  <text x="360" y="52" text-anchor="middle" font-size="13" fill="#7a7a7a" filter="url(#rough2)">T = 5+9+1+3 = 18，G = n·d + T = 36，g(ℓ) = 3ℓ + R(ℓ)</text>

  <!-- 表格 -->
  <rect x="175" y="70" width="440" height="126" rx="8" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 178 112 L 612 112" stroke="#d9d9d9" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 178 152 L 612 152" stroke="#d9d9d9" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- 高亮 x=3 与 x=4 两列 -->
  <rect x="368" y="74" width="56" height="118" rx="6" fill="#e8f0fe" opacity="0.75" filter="url(#rough2)"/>
  <rect x="430" y="74" width="56" height="118" rx="6" fill="#e6f4ea" opacity="0.75" filter="url(#rough2)"/>

  <text x="163" y="102" text-anchor="end" font-size="13" fill="#2b2b2b" filter="url(#rough2)">ℓ</text>
  <text x="163" y="142" text-anchor="end" font-size="13" fill="#2b2b2b" filter="url(#rough2)">R(ℓ)</text>
  <text x="163" y="182" text-anchor="end" font-size="13" fill="#2b2b2b" filter="url(#rough2)">g(ℓ)</text>

  <text x="210" y="102" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="272" y="102" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="334" y="102" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="396" y="102" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">3</text>
  <text x="458" y="102" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">4</text>
  <text x="520" y="102" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <text x="582" y="102" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">6</text>

  <text x="210" y="142" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="272" y="142" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="334" y="142" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <text x="396" y="142" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">14</text>
  <text x="458" y="142" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">15</text>
  <text x="520" y="142" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">18</text>
  <text x="582" y="142" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">18</text>

  <text x="210" y="182" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="272" y="182" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="334" y="182" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">11</text>
  <text x="396" y="182" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">23</text>
  <text x="458" y="182" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">27</text>
  <text x="520" y="182" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">33</text>
  <text x="582" y="182" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">36</text>

  <!-- 结论面板 -->
  <rect x="40" y="222" width="640" height="112" rx="12" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="60" y="250" font-size="13" fill="#2b4a66" filter="url(#rough2)">取 x = 3，y = 4（两个奖励点）：g(3) + g(4) = 23 + 27 = 50</text>
  <text x="60" y="278" font-size="13" fill="#3a5f2c" filter="url(#rough2)">同长全 1 串（长度 8）：B(8) = 1·G + g(8 mod 6) = 36 + g(2) = 36 + 11 = 47</text>
  <text x="60" y="306" font-size="14" fill="#b85450" filter="url(#rough2)">50 &gt; 47 ⇒ 答案是 YES；见证 a = 1 1 1 0 1 1 1 1（长 8）</text>
  <text x="60" y="328" font-size="12" fill="#7a7a7a" filter="url(#rough2)">等价写法：F = R(3) + R(4) − R(2) − d − T = 14 + 15 − 5 − 21 = 3 &gt; 0</text>

  <!-- 箭头说明 -->
  <path d="M 396 196 L 396 216" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 458 196 L 458 216" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <text x="360" y="360" text-anchor="middle" font-size="12" fill="#7a7a7a" filter="url(#rough2)">官方给出的见证是三段 (9, 4, 3)，得分 109 &gt; 108；但对拍显示两段一定够，所以只需枚举点对</text>
  <text x="360" y="386" text-anchor="middle" font-size="12" fill="#7a7a7a" filter="url(#rough2)">样例 2（n = 7，d = 5）：所有点对的 F 都 ≤ 0，输出 NO</text>
</svg>
