<svg xmlns="http://www.w3.org/2000/svg" width="720" height="316" viewBox="0 0 720 316"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1413"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="720" height="316" fill="#fafafa"/>
  <text x="360.0" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">插入构造：a 小的人先落位</text>
  <path d="M 115.2 42 Q 360.0 48 604.8 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="40.0" y="78.0" text-anchor="start" font-size="12.5" fill="#335478" font-weight="bold" filter="url(#rough2)">按 a 升序，把每个人插到下标 a 的位置</text>
  <rect x="40" y="96" width="44" height="34" rx="5" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="62.0" y="117.3" text-anchor="middle" font-size="12.0" fill="#4a7a3a" filter="url(#rough2)">a</text>
  <text x="290.0" y="118.0" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">插入 a（a=0）→ 位置 0</text>
  <rect x="40" y="144" width="44" height="34" rx="5" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="62.0" y="165.3" text-anchor="middle" font-size="12.0" fill="#4a7a3a" filter="url(#rough2)">b</text>
  <rect x="92" y="144" width="44" height="34" rx="5" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="114.0" y="165.3" text-anchor="middle" font-size="12.0" fill="#4a7a3a" filter="url(#rough2)">a</text>
  <text x="290.0" y="166.0" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">插入 b（a=0）→ 位置 0，a 后移</text>
  <rect x="40" y="192" width="44" height="34" rx="5" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="62.0" y="213.3" text-anchor="middle" font-size="12.0" fill="#4a7a3a" filter="url(#rough2)">c</text>
  <rect x="92" y="192" width="44" height="34" rx="5" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="114.0" y="213.3" text-anchor="middle" font-size="12.0" fill="#4a7a3a" filter="url(#rough2)">b</text>
  <rect x="144" y="192" width="44" height="34" rx="5" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="166.0" y="213.3" text-anchor="middle" font-size="12.0" fill="#4a7a3a" filter="url(#rough2)">a</text>
  <text x="290.0" y="214.0" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">插入 c（a=0）→ 位置 0</text>
  <rect x="40" y="240" width="44" height="34" rx="5" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="62.0" y="261.3" text-anchor="middle" font-size="12.0" fill="#4a7a3a" filter="url(#rough2)">c</text>
  <rect x="92" y="240" width="44" height="34" rx="5" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="114.0" y="261.3" text-anchor="middle" font-size="12.0" fill="#4a7a3a" filter="url(#rough2)">b</text>
  <rect x="144" y="240" width="44" height="34" rx="5" fill="#f5e8e8" stroke="#8c2f2c" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="166.0" y="261.3" text-anchor="middle" font-size="12.0" fill="#8c2f2c" filter="url(#rough2)">d</text>
  <rect x="196" y="240" width="44" height="34" rx="5" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="218.0" y="261.3" text-anchor="middle" font-size="12.0" fill="#4a7a3a" filter="url(#rough2)">a</text>
  <text x="290.0" y="262.0" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">插入 d（a=2）→ 位置 2</text>
  <path d="M 40.0 280.0 L 560.0 280.0" stroke="#555555" stroke-width="1.4" fill="none" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <rect x="40" y="260" width="520" height="40" rx="5" fill="#e8eef7" stroke="#335478" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300.0" y="284.1" text-anchor="middle" font-size="11.5" fill="#335478" filter="url(#rough2)">最终队列 c、b、d、a —— 高度取 h = n − a</text>
  <text x="360.0" y="302" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">若某步 a 大于当前人数，说明无解</text>
</svg>
