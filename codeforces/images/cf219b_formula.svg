<svg xmlns="http://www.w3.org/2000/svg" width="840" height="380" viewBox="0 0 840 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="380" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">c_t 的算法：先减到 10^t 的整数倍，再补上 t 个 9</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">p = 1029，t = 2 的例子</text>
  <g filter="url(#rough2)"><rect x="60" y="110" width="150" height="52" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="135.0" y="143" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1030</text>
  <text x="135.0" y="98" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">p + 1</text>
  <g filter="url(#rough2)"><line x1="216" y1="136.0" x2="244" y2="136.0" stroke="#8899aa" stroke-width="1.4" marker-end="url(#arrb)"/></g>
  <g filter="url(#rough2)"><rect x="250" y="110" width="150" height="52" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="325.0" y="143" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">10</text>
  <text x="325.0" y="98" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">// 10^t</text>
  <g filter="url(#rough2)"><line x1="406" y1="136.0" x2="434" y2="136.0" stroke="#8899aa" stroke-width="1.4" marker-end="url(#arrb)"/></g>
  <g filter="url(#rough2)"><rect x="440" y="110" width="150" height="52" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="515.0" y="143" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">1000</text>
  <text x="515.0" y="98" text-anchor="middle" font-size="12.5" fill="#a0522d" filter="url(#rough2)">* 10^t</text>
  <g filter="url(#rough2)"><line x1="596" y1="136.0" x2="624" y2="136.0" stroke="#8899aa" stroke-width="1.4" marker-end="url(#arrb)"/></g>
  <g filter="url(#rough2)"><rect x="630" y="110" width="150" height="52" rx="4" fill="#f6d9d7" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="705.0" y="143" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">999</text>
  <text x="705.0" y="98" text-anchor="middle" font-size="12.5" fill="#a0522d" filter="url(#rough2)">− 1</text>
  <text x="420" y="210" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">公式：c_t = ⌊(p + 1) / 10^t⌋ · 10^t − 1</text>
  <text x="420" y="242" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">它等价于"不超过 p、且末尾至少 t 个 9 的最大整数"：</text>
  <text x="420" y="266" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">因为 m·10^t − 1 正好是第 m 个末尾有 t 个 9 的数，取 m 为不超过 (p+1)/10^t 的最大整数即可。</text>
  <g filter="url(#rough2)"><rect x="120" y="292" width="600" height="60" rx="4" fill="#faf3ec" fill-opacity="0.85" stroke="#c8a48a" stroke-width="1.3"/></g>
  <text x="420" y="318" text-anchor="middle" font-size="12" fill="#8a4b2a" filter="url(#rough2)">合法条件：p − c_t ≤ d。若该类最大者都超预算，同类更小的只会更超预算。</text>
  <text x="420" y="340" text-anchor="middle" font-size="12" fill="#8a4b2a" filter="url(#rough2)">所以每类只需一次判断，不必扫描区间 [p−d, p]。</text>
</svg>
