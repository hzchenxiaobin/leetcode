<svg xmlns="http://www.w3.org/2000/svg" width="820" height="380" viewBox="0 0 820 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="65"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="820" height="380" fill="#fafafa"/>

  <text x="410" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">用时并列：编号小的选手获胜</text>
  <text x="410" y="58" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">样例一赛段 3：选手 3 与选手 4 的 t 都是 4</text>

  <g filter="url(#rough2)">
    <rect x="160" y="92" width="500" height="42" rx="8" fill="#f6e3c4" stroke="#b58a3a" stroke-width="1.6"/>
    <text x="176" y="118" font-size="12.5" fill="#7a5a1b">选手 3：t = 4，c = 30，编号 3</text>

    <rect x="160" y="150" width="500" height="42" rx="8" fill="#f6d9d7" stroke="#b85450" stroke-width="1.6"/>
    <text x="176" y="176" font-size="12.5" fill="#8a2b28">选手 4：t = 4，c = 20，编号 4</text>

    <text x="700" y="118" font-size="12" fill="#4a7a3a">用时相同</text>
    <text x="700" y="176" font-size="12" fill="#4a7a3a">用时相同</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 410 200 L 410 230" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>
    <rect x="200" y="234" width="420" height="40" rx="10" fill="#eef6e8" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="410" y="259" text-anchor="middle" font-size="12.5" fill="#2f5223">并列 → 取编号小者：胜者 3，收益 30</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="120" y="300" width="580" height="56" rx="10" fill="#fdf1f0" stroke="#b85450" stroke-width="1.4"/>
    <text x="136" y="322" font-size="11.5" fill="#8a2b28">若把替换条件写成 t ≤ t_best，扫描到选手 4 会把他当成胜者：</text>
    <text x="136" y="344" font-size="11.5" fill="#8a2b28">赛段 3 的收益变成 20，总收益 50 而不是 60。</text>
  </g>
</svg>
