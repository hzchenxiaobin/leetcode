<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">谁在说谎？把「回答等于 v 的人数」和 v 比一比</text>
  <path d="M 96 42 Q 360 48 624 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <text x="60" y="72" font-size="13" fill="#333" filter="url(#rough2)">
    例：n = 5，五个人的回答是 2, 2, 3, 3, 5
  </text>

  <!-- 回答 -->
  <g filter="url(#rough2)">
    <rect x="60" y="84" width="52" height="44" rx="5" fill="#dfeafc" stroke="#446688" stroke-width="1.4"/>
    <rect x="118" y="84" width="52" height="44" rx="5" fill="#dfeafc" stroke="#446688" stroke-width="1.4"/>
    <rect x="176" y="84" width="52" height="44" rx="5" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="234" y="84" width="52" height="44" rx="5" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="292" y="84" width="52" height="44" rx="5" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <g font-size="17" text-anchor="middle" fill="#333" filter="url(#rough2)">
    <text x="86" y="112">2</text>
    <text x="144" y="112">2</text>
    <text x="202" y="112">3</text>
    <text x="260" y="112">3</text>
    <text x="318" y="112">5</text>
  </g>

  <!-- 计数表 -->
  <g filter="url(#rough2)">
    <rect x="60" y="152" width="330" height="150" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <line x1="60" y1="182" x2="390" y2="182" stroke="#446688" stroke-width="1.3"/>
    <line x1="170" y1="152" x2="170" y2="302" stroke="#446688" stroke-width="1.3"/>
    <line x1="270" y1="152" x2="270" y2="302" stroke="#446688" stroke-width="1.3"/>
    <line x1="60" y1="212" x2="390" y2="212" stroke="#c8d4e6" stroke-width="1"/>
    <line x1="60" y1="242" x2="390" y2="242" stroke="#c8d4e6" stroke-width="1"/>
    <line x1="60" y1="272" x2="390" y2="272" stroke="#c8d4e6" stroke-width="1"/>
  </g>
  <g font-size="12.5" fill="#22314a" text-anchor="middle" filter="url(#rough2)">
    <text x="115" y="174">候选 h</text>
    <text x="220" y="174">回答 = h 的人数</text>
    <text x="330" y="174">是否自洽</text>
    <text x="115" y="202">1</text><text x="220" y="202">0</text><text x="330" y="202">0 ≠ 1 ✗</text>
    <text x="115" y="232">2</text><text x="220" y="232">2</text><text x="330" y="232">2 = 2 ✓</text>
    <text x="115" y="262">3</text><text x="220" y="262">2</text><text x="330" y="262">2 ≠ 3 ✗</text>
    <text x="115" y="292">4</text><text x="220" y="292">0</text><text x="330" y="292">0 ≠ 4 ✗</text>
  </g>

  <text x="430" y="180" font-size="13" fill="#2f5223" filter="url(#rough2)">只有 h = 2 自洽</text>
  <text x="430" y="204" font-size="13" fill="#2f5223" filter="url(#rough2)">⇒ 恰有 n - h = 3 个说谎者</text>
  <text x="430" y="232" font-size="12" fill="#556" filter="url(#rough2)">若有两个 h 都自洽，</text>
  <text x="430" y="252" font-size="12" fill="#556" filter="url(#rough2)">Serge 就无法断定，</text>
  <text x="430" y="272" font-size="12" fill="#556" filter="url(#rough2)">这种序列不计数。</text>

  <!-- 两类 -->
  <g filter="url(#rough2)">
    <rect x="60" y="318" width="286" height="96" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.2"/>
    <rect x="374" y="318" width="286" height="96" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.2"/>
  </g>
  <g font-size="12.5" filter="url(#rough2)">
    <text x="74" y="342" fill="#22314a">情形 1：h ≥ 1（有诚实者，k &lt; n）</text>
    <text x="74" y="364" fill="#22314a">诚实者恰好 h 个，都说 h；</text>
    <text x="74" y="386" fill="#22314a">说谎者说 1..n 里除 h 外的数（n-1 种），</text>
    <text x="74" y="408" fill="#22314a">且不能让任何 v ≠ h 满足 count(v) = v。</text>

    <text x="388" y="342" fill="#8a6015">情形 2：h = 0（全是说谎者，k = n）</text>
    <text x="388" y="364" fill="#8a6015">没人说 0，所以「0 自洽」恒成立——</text>
    <text x="388" y="386" fill="#8a6015">约定只查 h ∈ [1, n]；全都不自洽时</text>
    <text x="388" y="408" fill="#8a6015">才唯一确定 k = n，此时可选值是 n 种。</text>
  </g>
</svg>
