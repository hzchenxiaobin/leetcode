<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="83"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="720" height="380" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">圆可以相切：一次射击可能同时命中两个靶子</text>
  <path d="M 144 39 Q 360 45 576 39" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <line x1="40" y1="190" x2="700" y2="190" stroke="#2b2b2b" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <circle cx="220" cy="186" r="60" fill="#dcebfb" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="340" cy="186" r="60" fill="#e9f4ec" stroke="#3f6b4a" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="280" cy="186" r="5" fill="#b85450" filter="url(#rough2)"/>
  <text x="280" y="172" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">相切点</text>
  <text x="220" y="230" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">目标 i（圆心 220，半径 60）</text>
  <text x="340" y="230" text-anchor="middle" font-size="11" fill="#3f6b4a" filter="url(#rough2)">目标 j（圆心 340，半径 60）</text>
  <rect x="40" y="250" width="640" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="274" text-anchor="start" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">相切点处两个区间端点重合：落点正好是相切点时，两个靶子都算命中，</text>
  <text x="56" y="294" text-anchor="start" font-size="12" fill="#8a6015" filter="url(#rough2)">所以二分之后要检查 pos−1、pos、pos+1 三个候选区间，逐个做圆内判定。</text>
  <text x="40" y="336" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">每个靶子只记录“第一次命中”的射击编号，之后的射击即使再命中也不覆盖。</text>
</svg>
