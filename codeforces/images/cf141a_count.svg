<svg xmlns="http://www.w3.org/2000/svg" width="700" height="280" viewBox="0 0 700 280"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1411"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="700" height="280" fill="#fafafa"/>
  <text x="350.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">字母计数对消</text>
  <path d="M 112.0 42 Q 350.0 48 588.0 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="350.0" y="266" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">两个名字计数相加 == 字母堆计数</text>
  <rect x="60" y="70" width="200" height="70" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">客人名 + 主人名</text>
  <text x="160" y="122" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">计数各 +1</text>
  <text x="290" y="105" text-anchor="middle" font-size="16" fill="#333333" filter="url(#rough2)">vs</text>
  <rect x="340" y="70" width="200" height="70" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="440" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#335478" filter="url(#rough2)">门口的字母堆</text>
  <text x="440" y="122" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">计数各 −1</text>
  <text x="350" y="185" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">26 个桶全部为 0 ⇒ YES，否则 NO</text>
  <text x="350" y="220" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">重排不改变多重集，所以这是充要条件</text>
</svg>
