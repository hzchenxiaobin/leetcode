<svg xmlns="http://www.w3.org/2000/svg" width="780" height="380" viewBox="0 0 780 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="780" height="380" fill="#fafafa"/>
  <text x="390.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">193C：把 6 个方程化成 4+3 个变量，枚举一个自由量</text>
  <path d="M 157.4600000000001 46 Q 390.0 52 622.54 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60.0" y="70.0" width="660.0" height="60.0" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="96.0" text-anchor="start" font-size="11.2" fill="#33506e" filter="url(#rough2)">d12 = x₁+x₂+B+C，d13 = x₁+x₃+A+C，d14 = x₁+x₄+A+B</text>
  <text x="74.0" y="118.0" text-anchor="start" font-size="11.2" fill="#33506e" filter="url(#rough2)">d23 = x₂+x₃+A+C，d24 = x₂+x₄+A+B，d34 = x₃+x₄+B+C</text>
  <rect x="60.0" y="150.0" width="660.0" height="62.0" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="174.0" text-anchor="start" font-size="11.1" fill="#2f5b34" filter="url(#rough2)">令 x₂ = u：x₁ = u+a（a = d13−d23），x₃+x₄ = d34−d12+2u+a，</text>
  <text x="74.0" y="196.0" text-anchor="start" font-size="11.1" fill="#2f5b34" filter="url(#rough2)">B+C = d12−2u−a；再由 A=(Q+R−P)/2 等解出 A,B,C，检查非负与奇偶。</text>
  <rect x="60.0" y="232.0" width="660.0" height="62.0" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="256.0" text-anchor="start" font-size="11.1" fill="#8a6015" filter="url(#rough2)">总长 L = 4u + 常数 ⇒ 最小的可行 u 就给出最短长度，所以 u 从 0 往上试到不可行即可。</text>
  <text x="74.0" y="278.0" text-anchor="start" font-size="11.1" fill="#8a6015" filter="url(#rough2)">样例 d 全为 4：u=0 ⇒ (x=0, A=B=C=2)，L=6，与样例输出长度一致。</text>
  <text x="60.0" y="330.0" text-anchor="start" font-size="10.8" fill="#6b6b6b" filter="url(#rough2)">输出用 checker 判：只要求长度最短且六个 Hamming 距离与原输入一致（答案不唯一）。</text>
</svg>
