<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>

  <rect width="760" height="400" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">样例 2：一对不重叠的方块与一张王牌</text>

  <!-- 列号 -->
  <g font-size="12" fill="#5a6a7a" text-anchor="middle" filter="url(#rough2)">
    <text x="118" y="80">1</text>
    <text x="194" y="80">2</text>
    <text x="270" y="80">3</text>
    <text x="346" y="80">4</text>
    <text x="422" y="80">5</text>
    <text x="498" y="80">6</text>
  </g>
  <!-- 行号 -->
  <g font-size="12" fill="#5a6a7a" text-anchor="middle" filter="url(#rough2)">
    <text x="62" y="122">1</text>
    <text x="62" y="172">2</text>
    <text x="62" y="222">3</text>
    <text x="62" y="272">4</text>
  </g>

  <!-- 棋盘 -->
  <g filter="url(#rough2)">
    <rect x="80" y="90" width="456" height="200" fill="#fcfcfa" stroke="#8a867c" stroke-width="1.4"/>
    <path d="M156 90 V290 M232 90 V290 M308 90 V290 M384 90 V290 M460 90 V290" stroke="#c8c2b6" stroke-width="1.1" fill="none"/>
    <path d="M80 140 H536 M80 190 H536 M80 240 H536" stroke="#c8c2b6" stroke-width="1.1" fill="none"/>
    <rect x="308" y="140" width="76" height="50" fill="#fff3bf" stroke="#c9a227" stroke-width="1.6"/>
  </g>
  <g font-size="14" fill="#2b3a4a" text-anchor="middle" filter="url(#rough2)">
    <text x="118" y="121">2S</text><text x="194" y="121">3S</text><text x="270" y="121">4S</text>
    <text x="346" y="121">7S</text><text x="422" y="121">8S</text><text x="498" y="121">AS</text>
    <text x="118" y="171">5H</text><text x="194" y="171">6H</text><text x="270" y="171">7H</text>
    <text x="346" y="171">J1</text><text x="422" y="171">TC</text><text x="498" y="171">AC</text>
    <text x="118" y="221">8H</text><text x="194" y="221">9H</text><text x="270" y="221">TH</text>
    <text x="346" y="221">7C</text><text x="422" y="221">8C</text><text x="498" y="221">9C</text>
    <text x="118" y="271">2D</text><text x="194" y="271">2C</text><text x="270" y="271">3C</text>
    <text x="346" y="271">4C</text><text x="422" y="271">5C</text><text x="498" y="271">6C</text>
  </g>

  <!-- 两个方块的框 -->
  <g filter="url(#rough2)">
    <rect x="80" y="90" width="228" height="150" fill="none" stroke="#446688" stroke-width="3"
          stroke-dasharray="8 5"/>
    <rect x="308" y="140" width="228" height="150" fill="none" stroke="#4a7a3a" stroke-width="3"
          stroke-dasharray="8 5"/>
  </g>

  <!-- 王牌说明 -->
  <g filter="url(#rough2)">
    <rect x="556" y="64" width="20" height="14" fill="#fff3bf" stroke="#c9a227" stroke-width="1.2"/>
    <text x="584" y="76" font-size="12" fill="#6b4e12">王牌位置</text>
  </g>

  <text x="194" y="312" text-anchor="middle" font-size="16" font-weight="bold" fill="#446688"
        filter="url(#rough2)">①</text>
  <text x="422" y="312" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a7a3a"
        filter="url(#rough2)">②</text>

  <text x="380" y="342" text-anchor="middle" font-size="12.5" fill="#33475c" filter="url(#rough2)">① 方块 (1,1)：点数 2 到 T 互异，本来就合法</text>
  <text x="380" y="368" text-anchor="middle" font-size="12.5" fill="#2f5223" filter="url(#rough2)">② 方块 (2,4)：换 JC 后九张全梅花；换 2H 则点数互异</text>
  <text x="380" y="392" text-anchor="middle" font-size="11.5" fill="#6b6b66" filter="url(#rough2)">两个方块不重叠，因此输出 Solution exists.；方案不唯一</text>
</svg>
