<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="899"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="330" fill="#fafafa"/>
  <text x="360.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">行 / 列各一条双向链表</text>
  <path d="M 115.2 42 Q 360.0 48 604.8 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="360.0" y="316" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">摘掉一个棋子 = 把它的四个邻居对接起来</text>
  <rect x="90" y="76" width="62" height="62" rx="7" fill="#f7f7f4" stroke="#c8c8c0" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="152" y="76" width="62" height="62" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="183.0" y="114.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5223" filter="url(#rough2)">D</text>
  <rect x="214" y="76" width="62" height="62" rx="7" fill="#f7f7f4" stroke="#c8c8c0" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="276" y="76" width="62" height="62" rx="7" fill="#f7f7f4" stroke="#c8c8c0" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="90" y="138" width="62" height="62" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="121.0" y="176.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5223" filter="url(#rough2)">R</text>
  <rect x="152" y="138" width="62" height="62" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="183.0" y="176.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5223" filter="url(#rough2)">R</text>
  <rect x="214" y="138" width="62" height="62" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="245.0" y="176.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5223" filter="url(#rough2)">R</text>
  <rect x="276" y="138" width="62" height="62" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="307.0" y="176.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5223" filter="url(#rough2)">L</text>
  <rect x="90" y="200" width="62" height="62" rx="7" fill="#f7f7f4" stroke="#c8c8c0" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="152" y="200" width="62" height="62" rx="7" fill="#f7f7f4" stroke="#c8c8c0" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="214" y="200" width="62" height="62" rx="7" fill="#f7f7f4" stroke="#c8c8c0" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="276" y="200" width="62" height="62" rx="7" fill="#f7f7f4" stroke="#c8c8c0" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="154.0" y1="169.0" x2="150.0" y2="169.0" stroke="#5a7fb0" stroke-width="1.4" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <line x1="216.0" y1="169.0" x2="212.0" y2="169.0" stroke="#5a7fb0" stroke-width="1.4" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <line x1="278.0" y1="169.0" x2="274.0" y2="169.0" stroke="#5a7fb0" stroke-width="1.4" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <line x1="183.0" y1="140.0" x2="183.0" y2="136.0" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <text x="620" y="96" text-anchor="middle" font-size="12" fill="#335478" filter="url(#rough2)">蓝：行链表</text>
  <text x="620" y="122" text-anchor="middle" font-size="12" fill="#8c2f2c" filter="url(#rough2)">红：列链表</text>
  <text x="620" y="150" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">摘除 O(1)</text>
  <rect x="60" y="262" width="600" height="38" rx="8" fill="#f4f4f0" stroke="#8a8a8a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="360" y="286" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">箭头方向的邻居就是“最近的活棋子”</text>
