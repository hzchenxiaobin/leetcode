<svg xmlns="http://www.w3.org/2000/svg" width="840" height="380" viewBox="0 0 840 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="380" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">字典序 DP：先最少操作数，再最小末段</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">两者都要，缺一不可</text>
  <g filter="url(#rough2)"><rect x="110" y="96" width="300" height="110" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="260" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">状态 dp[i]</text>
  <text x="260" y="150" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">ops[i]：最少操作数</text>
  <text x="260" y="176" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">last[i]：该 ops 下最小末段</text>
  <g filter="url(#rough2)"><rect x="450" y="96" width="290" height="110" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="595" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">转移</text>
  <text x="595" y="150" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">seg = pre[i] − pre[j] ≥ last[j]</text>
  <text x="595" y="176" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">候选 (ops[j] + i − j − 1, seg)</text>
  <text x="420" y="250" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">按 (ops, last) 字典序取最小</text>
  <g filter="url(#rough2)"><rect x="180" y="276" width="480" height="56" rx="4" fill="#f7fbf4" fill-opacity="0.85" stroke="#a8c99a" stroke-width="1.3"/></g>
  <text x="420" y="300" text-anchor="middle" font-size="12" fill="#3d6b2f" filter="url(#rough2)">ops 决定段数；相同 ops 下 last 越小，后面越容易接</text>
  <text x="420" y="322" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">故字典序最优解无后效性</text>
  <text x="420" y="352" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">初值 dp[0] = (0, 0)，答案 ops[n]</text>
</svg>
