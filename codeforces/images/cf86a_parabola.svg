  <rect width="740" height="420" fill="#fafafa"/>

  <text x="370" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">位数固定后，重量是关于 n 的开口向下抛物线</text>
