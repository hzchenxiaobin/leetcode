<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="353" />
      <feDisplacementMap in="SourceGraphic" scale="1.5" />
    </filter>
  </defs>
  <rect width="760" height="430" fill="#fafafa" />
  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">星座的排序：半径 → 中心行 → 中心列</text>
  <path d="M 110 44 Q 380 50 650 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)" />

  
  <rect x="40" y="70" width="210" height="150" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)" />
  <text x="145" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">第一关键字：半径 x</text>
  <text x="145" y="130" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">x=1 的全部星座</text>
  <text x="145" y="152" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">→ x=2 的全部星座</text>
  <text x="145" y="174" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">→ x=3 …</text>
  <text x="145" y="202" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">半径小的一定排在前面</text>

  <rect x="275" y="70" width="210" height="150" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)" />
  <text x="380" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">第二关键字：中心行</text>
  <text x="380" y="130" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">同一半径内，行号小的在前</text>
  <text x="380" y="152" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">（“中央恒星更高”）</text>
  <text x="380" y="182" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">从上往下扫描即可</text>

  <rect x="510" y="70" width="210" height="150" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)" />
  <text x="615" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">第三关键字：中心列</text>
  <text x="615" y="130" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">同一行内，列号小的在前</text>
  <text x="615" y="152" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">（“中央恒星更左”）</text>
  <text x="615" y="182" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">从左往右扫描即可</text>

  
  <rect x="40" y="248" width="680" height="150" rx="10" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.5" filter="url(#rough2)" />
  <text x="60" y="274" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">不必真的把 10⁷ 个星座排序：按半径分桶，再逐层定位</text>
  <text x="60" y="300" font-size="11.5" fill="#555" filter="url(#rough2)">1. 对每个中心算出所有合法半径，用 cnt[x] 统计半径 x 的星座数；</text>
  <text x="60" y="322" font-size="11.5" fill="#555" filter="url(#rough2)">2. 从 x=1 开始，若 K &gt; cnt[x] 就减去 cnt[x]，否则答案就在这一层；</text>
  <text x="60" y="344" font-size="11.5" fill="#555" filter="url(#rough2)">3. 在半径 x 内按行、列扫描中心，每遇到一个合法中心就把 K 减 1；</text>
  <text x="60" y="366" font-size="11.5" fill="#555" filter="url(#rough2)">4. K 减到 0 时，当前中心就是第 K 个星座，按“中、上、下、左、右”输出。</text>
  <text x="60" y="390" font-size="11.5" fill="#2f5223" filter="url(#rough2)">总复杂度 O(NM · min(N,M))，N,M ≤ 300 时约 1.35×10⁷ 次检查。</text>
</svg>