<svg xmlns="http://www.w3.org/2000/svg" width="700" height="250" viewBox="0 0 700 250"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1511"/>
    <feDisplacementMap in="SourceGraphic" scale="1.5"/></filter></defs>
  <rect width="700" height="250" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">把"相等相邻对"变成前缀计数</text>
  <path d="M 150 40 Q 350 46 550 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="66" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="12.5" fill="#22314a" filter="url(#rough2)">定义 e_i = [s_i == s_{i+1}]（i = 1..n−1），pre[t] = e_1 + … + e_{t−1}。</text>
  <text x="76" y="106" font-size="12.5" fill="#22314a" filter="url(#rough2)">查询 [l, r] 的答案 = Σ_{i=l}^{r−1} e_i = pre[r] − pre[l]。</text>
  <g filter="url(#rough2)"><rect x="60" y="132" width="580" height="66" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="156" font-size="12.5" fill="#2f5223" filter="url(#rough2)">样例 "......" 查 [1,6] ⇒ 5 个相等对（'......' 每对都相等）✓</text>
  <text x="76" y="180" font-size="12.5" fill="#2f5223" filter="url(#rough2)">样例 "#..###" 查 [1,5] ⇒ e = 1,0,1,1 ⇒ 前 4 个里 1+0+1 = 2 ✓</text>
  <g filter="url(#rough2)"><rect x="60" y="206" width="580" height="30" rx="6" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.2"/></g>
  <text x="76" y="226" font-size="12" fill="#8a6015" filter="url(#rough2)">预处理 O(n)、每次查询 O(1)；n,m ≤ 1e5。</text>
</svg>
