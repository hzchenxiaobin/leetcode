<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="dn" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="330" fill="#fafafa"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">跨过 p 需要几步：k = ⌊(p − b) / d⌋ + 1</text>

  <!-- 数轴 -->
  <line x1="70" y1="200" x2="680" y2="200" stroke="#2b2b2b" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- 候选点：b, b+d, b+2d, b+3d, b+4d -->
  <g filter="url(#rough2)">
    <circle cx="120" cy="200" r="6" fill="#446688"/>
    <circle cx="240" cy="200" r="6" fill="#446688"/>
    <circle cx="360" cy="200" r="6" fill="#446688"/>
    <circle cx="480" cy="200" r="6" fill="#446688"/>
    <circle cx="600" cy="200" r="6" fill="#446688"/>
  </g>
  <g font-size="12" fill="#2f4a66" filter="url(#rough2)" text-anchor="middle">
    <text x="120" y="228">b</text>
    <text x="240" y="228">b+d</text>
    <text x="360" y="228">b+2d</text>
    <text x="480" y="228">b+3d</text>
    <text x="600" y="228">b+4d</text>
  </g>

  <!-- p 线 -->
  <line x1="410" y1="120" x2="410" y2="250" stroke="#b85450" stroke-width="2" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="410" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#8f3b37" filter="url(#rough2)">前一个的最终值 p</text>

  <!-- 第一个超过 p 的点 -->
  <circle cx="480" cy="200" r="10" fill="none" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="480" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">第一个 &gt; p 的候选</text>

  <!-- 需要跨过 2 个间隔 -->
  <path d="M240,168 Q360,120 410,168" fill="none" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M120,168 Q265,96 410,168" fill="none" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="110" y="84" font-size="12" fill="#8a6015" filter="url(#rough2)">k = 2 步：b+2d 还 ≤ p</text>
  <text x="120" y="150" font-size="12" fill="#8a6015" filter="url(#rough2)">起点 b</text>

  <!-- 说明 -->
  <rect x="80" y="262" width="560" height="52" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="96" y="284" font-size="12.5" fill="#8a6015" filter="url(#rough2)">p − b = q ≥ 0 时要 kd &gt; q，即 k = ⌊q/d⌋ + 1；如果 b &gt; p 则 k = 0。</text>
  <text x="96" y="304" font-size="12.5" fill="#8a6015" filter="url(#rough2)">整数整除直接给出答案，不需要 ceil，也不会有浮点误差。</text>
</svg>
