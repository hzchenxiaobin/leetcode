<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>

  <rect width="720" height="380" fill="#fafafa"/>
  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 =RRR：先缩块，再从左往右堆出 1,1,2,3,4</text>
  <path d="M 110 42 Q 360 48 610 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 输入字符串 -->
  <text x="40" y="80" font-size="13" fill="#2b2b2b" filter="url(#rough2)">输入：n = 5，s = = R R R（第 i 个符号描述第 i、i+1 位）</text>

  <g filter="url(#rough2)">
    <rect x="60" y="98" width="70" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="180" y="98" width="70" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="300" y="98" width="70" height="42" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <rect x="420" y="98" width="70" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <rect x="540" y="98" width="70" height="42" rx="6" fill="#fde8e6" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">
    <text x="95" y="124">学生 1</text>
    <text x="215" y="124">学生 2</text>
    <text x="335" y="124">学生 3</text>
    <text x="455" y="124">学生 4</text>
    <text x="575" y="124">学生 5</text>
  </g>
  <g font-size="15" font-weight="bold" fill="#7a4a8a" text-anchor="middle" filter="url(#rough2)">
    <text x="155" y="124">=</text>
    <text x="275" y="124">R</text>
    <text x="395" y="124">R</text>
    <text x="515" y="124">R</text>
  </g>

  <!-- 缩块结果 -->
  <text x="40" y="176" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">缩块：gid = 0,0,1,2,3 → m = 4 个块；块 1 含学生 1、2（同值）</text>
  <g filter="url(#rough2)">
    <rect x="60" y="188" width="150" height="44" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7"/>
    <rect x="240" y="188" width="110" height="44" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7"/>
    <rect x="380" y="188" width="110" height="44" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7"/>
    <rect x="520" y="188" width="110" height="44" rx="7" fill="#fde8e6" stroke="#b85450" stroke-width="1.7"/>
  </g>
  <g font-size="12.5" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">
    <text x="135" y="215">v₁（学生 1,2）</text>
    <text x="295" y="215">v₂（学生 3）</text>
    <text x="435" y="215">v₃（学生 4）</text>
    <text x="575" y="215">v₄（学生 5）</text>
  </g>

  <!-- 柱状图 -->
  <line x1="60" y1="330" x2="660" y2="330" stroke="#555" stroke-width="1.4" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="80" y="300" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="150" y="300" width="46" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="220" y="270" width="46" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <rect x="290" y="240" width="46" height="90" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="360" y="210" width="46" height="120" fill="#fde8e6" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">
    <text x="103" y="322">1</text>
    <text x="173" y="322">1</text>
    <text x="243" y="292">2</text>
    <text x="313" y="262">3</text>
    <text x="383" y="232">4</text>
  </g>
  <g font-size="11" text-anchor="middle" fill="#555" filter="url(#rough2)">
    <text x="103" y="348">学生 1</text>
    <text x="173" y="348">学生 2</text>
    <text x="243" y="348">学生 3</text>
    <text x="313" y="348">学生 4</text>
    <text x="383" y="348">学生 5</text>
  </g>

  <rect x="440" y="248" width="230" height="90" rx="10" fill="#f4f0fa" stroke="#7a4a8a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="454" y="270" font-size="12.5" font-weight="bold" fill="#5a3a6a" filter="url(#rough2)">第一遍：只认 R</text>
  <text x="454" y="292" font-size="11.5" fill="#5a3a6a" filter="url(#rough2)">v₁ = 1（位置 1）</text>
  <text x="454" y="310" font-size="11.5" fill="#5a3a6a" filter="url(#rough2)">v₂ = v₁+1 = 2，v₃ = 3，v₄ = 4</text>
  <text x="454" y="328" font-size="11.5" fill="#5a3a6a" filter="url(#rough2)">第二遍无 L，不变；总和 = 11</text>
</svg>
