<svg xmlns="http://www.w3.org/2000/svg" width="840" height="380" viewBox="0 0 840 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="380" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">递推 T(n) = 3·T(n−1) + 2</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">小外星人移动 T(n−1) 次；大外星人换端 T(n−1)+1 次，每次 2 步</text>
  <g filter="url(#rough2)"><rect x="120" y="96" width="600" height="74" rx="4" fill="#f7fbf4" fill-opacity="0.85" stroke="#a8c99a" stroke-width="1.3"/></g>
  <text x="420" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">T(n) = T(n−1) + 2·(T(n−1) + 1)</text>
  <text x="420" y="152" text-anchor="middle" font-size="15" font-weight="bold" fill="#3d6b2f" filter="url(#rough2)">= 3·T(n−1) + 2</text>
  <g filter="url(#rough2)"><rect x="110" y="210" width="100" height="50" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="160" y="232" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">T(0)</text>
  <text x="160" y="252" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)"><rect x="220" y="210" width="100" height="50" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="270" y="232" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">T(1)</text>
  <text x="270" y="252" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="330" y="210" width="100" height="50" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="380" y="232" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">T(2)</text>
  <text x="380" y="252" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">8</text>
  <g filter="url(#rough2)"><rect x="440" y="210" width="100" height="50" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="490" y="232" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">T(3)</text>
  <text x="490" y="252" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">26</text>
  <g filter="url(#rough2)"><rect x="550" y="210" width="100" height="50" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="600" y="232" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">T(4)</text>
  <text x="600" y="252" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">80</text>
  <g filter="url(#rough2)"><rect x="660" y="210" width="100" height="50" rx="4" fill="#f6d9d7" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="710" y="232" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">T(n)</text>
  <text x="710" y="252" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3ⁿ − 1</text>
  <text x="420" y="300" text-anchor="middle" font-size="13.5" fill="#2b2b2b" filter="url(#rough2)">解线性递推：T(n) = Σ 2·3^k = 3ⁿ − 1</text>
  <text x="420" y="330" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">答案 = (3ⁿ − 1) mod m，用快速幂计算（m 不必是质数）</text>
  <text x="420" y="358" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">BFS 暴力验证：n = 1..4 的最短步数恰为 2, 8, 26, 80</text>
</svg>
