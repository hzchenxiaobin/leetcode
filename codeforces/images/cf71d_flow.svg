<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr71df" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="760" height="360" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">枚举顺序：方块对 → 模式 → 候选牌 → 组合</text>

  <g filter="url(#rough2)">
    <rect x="19" y="118" width="130" height="70" rx="8" fill="#eef4fb" stroke="#446688" stroke-width="1.7"/>
    <rect x="167" y="118" width="130" height="70" rx="8" fill="#fff8e1" stroke="#c9a227" stroke-width="1.7"/>
    <rect x="315" y="118" width="130" height="70" rx="8" fill="#e8f0e0" stroke="#4a7a3a" stroke-width="1.7"/>
    <rect x="463" y="118" width="130" height="70" rx="8" fill="#f7e6e6" stroke="#b85450" stroke-width="1.7"/>
    <rect x="611" y="118" width="130" height="70" rx="8" fill="#eef4fb" stroke="#446688" stroke-width="1.7"/>
  </g>
  <g font-size="11.5" fill="#2b3a4a" text-anchor="middle" filter="url(#rough2)">
    <text x="84" y="146">枚举两个</text><text x="84" y="168">3×3 方块对</text>
    <text x="232" y="146">每个方块取</text><text x="232" y="168">合法模式</text>
    <text x="380" y="146">按模式生成</text><text x="380" y="168">王牌候选牌</text>
    <text x="528" y="146">搜索互异的</text><text x="528" y="168">替换组合</text>
    <text x="676" y="146">输出方案</text><text x="676" y="168">否则继续枚举</text>
  </g>
  <g filter="url(#rough2)" stroke="#4a7a3a" stroke-width="2" fill="none">
    <path d="M151 153 L163 153" marker-end="url(#arr71df)"/>
    <path d="M299 153 L311 153" marker-end="url(#arr71df)"/>
    <path d="M447 153 L459 153" marker-end="url(#arr71df)"/>
    <path d="M595 153 L607 153" marker-end="url(#arr71df)"/>
  </g>

  <text x="380" y="228" text-anchor="middle" font-size="12.5" fill="#33475c" filter="url(#rough2)">候选牌上界：同花色 ≤ 13 张，点数互异 ≤ 24 张；两张王牌至多 24×24 组</text>
  <text x="380" y="258" text-anchor="middle" font-size="12.5" fill="#33475c" filter="url(#rough2)">方块对 ≤ 300 组，每个方块至多 2 种模式 ⇒ 总枚举量不到 10⁶</text>
  <text x="380" y="288" text-anchor="middle" font-size="12.5" fill="#4a4a4a" filter="url(#rough2)">不在任何方块里的王牌可任取未使用的牌，只需与其他替换牌互不相同</text>
  <text x="380" y="322" text-anchor="middle" font-size="12" fill="#7a2f2c" filter="url(#rough2)">不含王牌的方块必须先合法，否则整对方块可以直接跳过</text>
</svg>
