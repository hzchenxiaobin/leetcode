<svg xmlns="http://www.w3.org/2000/svg" width="740" height="380" viewBox="0 0 740 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="211"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="740" height="380" fill="#fafafa"/>

  <text x="370" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例：1 → 2（经 4，共 2 米 ≤ t₁ = 2）花 7，再用 2 的出租到 3 花 2，总计 9</text>
  <path d="M 148 37 Q 370 43 592 37" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <line x1="90" y1="180" x2="330" y2="120" stroke="#c0c0c0" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="218.0" y="144.0" text-anchor="start" font-size="12" font-weight="bold" fill="#9b9b9b" filter="url(#rough2)">3</text>
  <line x1="90" y1="180" x2="210" y2="260" stroke="#446688" stroke-width="2.0" filter="url(#rough2)"/>
  <text x="158.0" y="214.0" text-anchor="start" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <line x1="330" y1="120" x2="210" y2="260" stroke="#446688" stroke-width="2.0" filter="url(#rough2)"/>
  <text x="278.0" y="184.0" text-anchor="start" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <line x1="330" y1="120" x2="600" y2="120" stroke="#c0c0c0" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="473.0" y="114.0" text-anchor="start" font-size="12" font-weight="bold" fill="#9b9b9b" filter="url(#rough2)">5</text>
  <circle cx="90" cy="180" r="18" fill="#dcebfb" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">1</text>
  <circle cx="330" cy="120" r="18" fill="#dcebfb" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">2</text>
  <circle cx="600" cy="120" r="18" fill="#dcebfb" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="600" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">3</text>
  <circle cx="210" cy="260" r="18" fill="#dcebfb" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="265" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">4</text>
  <text x="90" y="216" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">起点 x=1</text>
  <text x="600" y="96" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">终点 y=3</text>
  <rect x="40" y="286" width="660" height="44" rx="8" fill="#e9f4ec" stroke="#3f6b4a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="56" y="314" text-anchor="start" font-size="12" font-weight="bold" fill="#3f6b4a" filter="url(#rough2)">dist(1,2) = 1 + 1 = 2 ≤ t₁ = 2 ⇒ 1 号出租可以直达 2，花费 c₁ = 7</text>
  <rect x="40" y="336" width="660" height="34" rx="8" fill="#eef3fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="56" y="358" text-anchor="start" font-size="12" fill="#2f4a66" filter="url(#rough2)">第二步：dist(2,3) = 5（直连边）≤ t₂ = 7 ⇒ 2 号出租直达，花费 c₂ = 2，总计 7 + 2 = 9</text>
</svg>
