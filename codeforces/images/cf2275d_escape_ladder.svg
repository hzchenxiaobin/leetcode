<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 452"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="452" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">逃生阶梯：有序态 (1,5,9) 要付多少步？</text>

  <text x="40" y="66" font-size="12.5" fill="#8a6a20" filter="url(#rough2)">① 只压 c：c += sgn(a−b) = −1</text>

  <rect x="60" y="78" width="104" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="112" y="99" text-anchor="middle" font-size="12.5" fill="#8a6a20" filter="url(#rough2)">c = 9</text>
  <path d="M 112 110 L 112 119" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="120" font-size="10.5" fill="#446688" filter="url(#rough2)">−1</text>

  <rect x="60" y="120" width="104" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="112" y="141" text-anchor="middle" font-size="12.5" fill="#8a6a20" filter="url(#rough2)">c = 8</text>
  <path d="M 112 152 L 112 161" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="162" font-size="10.5" fill="#446688" filter="url(#rough2)">−1</text>

  <rect x="60" y="162" width="104" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="112" y="183" text-anchor="middle" font-size="12.5" fill="#8a6a20" filter="url(#rough2)">c = 7</text>
  <path d="M 112 194 L 112 203" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="204" font-size="10.5" fill="#446688" filter="url(#rough2)">−1</text>

  <rect x="60" y="204" width="104" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="112" y="225" text-anchor="middle" font-size="12.5" fill="#8a6a20" filter="url(#rough2)">c = 6</text>
  <path d="M 112 236 L 112 245" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="246" font-size="10.5" fill="#446688" filter="url(#rough2)">−1</text>

  <rect x="60" y="246" width="104" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="112" y="267" text-anchor="middle" font-size="12.5" fill="#8a6a20" filter="url(#rough2)">c = 5</text>
  <path d="M 112 278 L 112 287" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="288" font-size="10.5" fill="#b85450" filter="url(#rough2)">−1</text>

  <rect x="60" y="288" width="104" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="112" y="309" text-anchor="middle" font-size="12.5" fill="#8a3030" filter="url(#rough2)">c = 4</text>
  <text x="176" y="307" font-size="11" fill="#b85450" filter="url(#rough2)">共 5 步，总和 15 → 10</text>

  <text x="360" y="66" font-size="12.5" fill="#33502a" filter="url(#rough2)">② 逃出后：a += sgn(b−c) = +1</text>

  <rect x="360" y="78" width="96" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="408" y="99" text-anchor="middle" font-size="12.5" fill="#33502a" filter="url(#rough2)">a = 1</text>
  <path d="M 408 110 L 408 119" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="416" y="120" font-size="10.5" fill="#446688" filter="url(#rough2)">+1</text>

  <rect x="360" y="120" width="96" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="408" y="141" text-anchor="middle" font-size="12.5" fill="#33502a" filter="url(#rough2)">a = 2</text>
  <path d="M 408 152 L 408 161" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="416" y="162" font-size="10.5" fill="#446688" filter="url(#rough2)">+1</text>

  <rect x="360" y="162" width="96" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="408" y="183" text-anchor="middle" font-size="12.5" fill="#33502a" filter="url(#rough2)">a = 3</text>
  <text x="360" y="212" font-size="11" fill="#4a7a3a" filter="url(#rough2)">… 之后每步 +1，不回头</text>

  <rect x="500" y="78" width="236" height="116" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="514" y="104" font-size="11.5" fill="#2f4f6f" filter="url(#rough2)">b = 5、c = 4 从此不再被改</text>
  <text x="514" y="130" font-size="11.5" fill="#2f4f6f" filter="url(#rough2)">sgn(b − c) = +1 恒定成立</text>
  <text x="514" y="156" font-size="11.5" fill="#2f4f6f" filter="url(#rough2)">⇒ 每步 +1，可以无限重复</text>
  <text x="514" y="182" font-size="11" fill="#446688" filter="url(#rough2)">这就是「自由态」的开关</text>

  <rect x="360" y="228" width="376" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="374" y="254" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">落地状态 (1,5,4)：b &gt; c 成立，逃出有序区</text>
  <text x="374" y="280" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">于是 (1,5,9) 的 f(X) = X − 15 + 2·5</text>

  <rect x="30" y="308" width="700" height="128" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="44" y="334" font-size="12" fill="#2f4f6f" filter="url(#rough2)">e = min{ c − b + 1（需要 a &lt; b），b − a + 1（需要 a &lt; c） } = min{5, 5} = 5</text>
  <text x="44" y="362" font-size="12" fill="#2f4f6f" filter="url(#rough2)">另一条路：把 b 一路压到 a − 1，共 b − a + 1 步，落地时 a &gt; b，同样进入自由态</text>
  <text x="44" y="390" font-size="12" fill="#8a3030" filter="url(#rough2)">特例 (0,0,5)：a = b 时 op1 空转，压不动 c，只能走 b − a + 1 = 1 这条</text>
  <text x="44" y="418" font-size="12" fill="#33502a" filter="url(#rough2)">代价结构：先花 e 步跌到 S − e，再爬 X − (S − e) 步，合计 X − S + 2e</text>
</svg>
