<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="pa" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8a6015"/>
    </marker>
  </defs>
  <rect width="720" height="420" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">奖分池固定：Vasya 取一端，其余人按阈值匹配</text>
  <path d="M 130 40 Q 360 46 590 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 奖分池 -->
  <g filter="url(#rough2)">
    <rect x="60" y="80" width="600" height="60" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="360" y="68" text-anchor="middle" font-size="12" fill="#8a6015">奖分多重集 = {b₁,…,b_m} ∪ {0 × (n−m)}</text>
    <rect x="76" y="92" width="60" height="36" rx="6" fill="#ffffff" stroke="#b85450" stroke-width="1.6"/>
    <text x="106" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#8c2f2b">min</text>
    <rect x="146" y="92" width="60" height="36" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
    <text x="176" y="116" text-anchor="middle" font-size="13" fill="#555">0</text>
    <rect x="216" y="92" width="60" height="36" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
    <text x="246" y="116" text-anchor="middle" font-size="13" fill="#555">10</text>
    <rect x="286" y="92" width="60" height="36" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
    <text x="316" y="116" text-anchor="middle" font-size="13" fill="#555">20</text>
    <text x="376" y="116" font-size="13" fill="#777">…</text>
    <rect x="564" y="92" width="80" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="604" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66">max</text>
  </g>

  <!-- 两种取法 -->
  <g filter="url(#rough2)">
    <rect x="60" y="170" width="286" height="96" rx="10" fill="#e6f4ea" stroke="#2f7a3a" stroke-width="1.6"/>
    <text x="76" y="196" font-size="13" font-weight="bold" fill="#1f5226">求最高名次：取 max</text>
    <text x="76" y="220" font-size="11.5" fill="#2f5223">A = a_v + max，最大可能</text>
    <text x="76" y="242" font-size="11.5" fill="#2f5223">剩余奖分最小 ⇒ 别人最难反超</text>

    <rect x="374" y="170" width="286" height="96" rx="10" fill="#fdecea" stroke="#b85450" stroke-width="1.6"/>
    <text x="390" y="196" font-size="13" font-weight="bold" fill="#8c2f2b">求最低名次：取 min</text>
    <text x="390" y="220" font-size="11.5" fill="#8c2f2b">A = a_v + min，最小可能</text>
    <text x="390" y="242" font-size="11.5" fill="#8c2f2b">剩余奖分最大 ⇒ 别人最容易反超</text>
  </g>

  <!-- 阈值公式 -->
  <rect x="60" y="290" width="600" height="112" rx="10" fill="#ffffff" stroke="#cccccc" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="316" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">把“是否反超”化成整数阈值（同分比昵称）</text>
  <text x="76" y="344" font-size="12" fill="#2f4a66" filter="url(#rough2)">不反超 ⟺ p ≤ cap_i = A − a_i − [name_i &lt; name_v]</text>
  <text x="76" y="368" font-size="12" fill="#8c2f2b" filter="url(#rough2)">反超 ⟺ p ≥ need_i = A − a_i + [name_i &gt; name_v]</text>
  <text x="76" y="392" font-size="11.5" fill="#666" filter="url(#rough2)">两个阈值只差一个 0/1，方向相反：这正是“同分按昵称排序”造成的</text>
</svg>
