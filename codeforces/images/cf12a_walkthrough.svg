<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="73"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="330" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样本走查：成对比较的两种结局</text>
  <path d="M 200 42 Q 380 47 560 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 样本 1 -->
  <text x="150" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">样本 1：XX. / ... / .XX</text>
  <rect x="84" y="88" width="44" height="44" fill="#f6d6d3" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="128" y="88" width="44" height="44" fill="#f6e3c5" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="172" y="88" width="44" height="44" fill="#ffffff" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="84" y="132" width="44" height="44" fill="#ffffff" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="128" y="132" width="44" height="44" fill="#ffffff" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="172" y="132" width="44" height="44" fill="#ffffff" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="84" y="176" width="44" height="44" fill="#ffffff" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="128" y="176" width="44" height="44" fill="#f6e3c5" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="172" y="176" width="44" height="44" fill="#f6d6d3" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>

  <text x="106" y="118" text-anchor="middle" font-size="17" fill="#2b2b2b" filter="url(#rough2)">X</text>
  <text x="150" y="118" text-anchor="middle" font-size="17" fill="#2b2b2b" filter="url(#rough2)">X</text>
  <text x="194" y="118" text-anchor="middle" font-size="17" fill="#8a8a8a" filter="url(#rough2)">.</text>
  <text x="106" y="162" text-anchor="middle" font-size="17" fill="#8a8a8a" filter="url(#rough2)">.</text>
  <text x="150" y="162" text-anchor="middle" font-size="17" fill="#8a8a8a" filter="url(#rough2)">.</text>
  <text x="194" y="162" text-anchor="middle" font-size="17" fill="#8a8a8a" filter="url(#rough2)">.</text>
  <text x="106" y="206" text-anchor="middle" font-size="17" fill="#8a8a8a" filter="url(#rough2)">.</text>
  <text x="150" y="206" text-anchor="middle" font-size="17" fill="#2b2b2b" filter="url(#rough2)">X</text>
  <text x="194" y="206" text-anchor="middle" font-size="17" fill="#2b2b2b" filter="url(#rough2)">X</text>

  <text x="150" y="242" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">X↔X、X↔X、.↔.、.↔.</text>
  <text x="150" y="266" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">全部相同 → YES</text>

  <!-- 样本 2 -->
  <text x="530" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#8c3a36" filter="url(#rough2)">样本 2：X.X / X.. / ...</text>
  <rect x="464" y="88" width="44" height="44" fill="#ffffff" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="508" y="88" width="44" height="44" fill="#ffffff" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="552" y="88" width="44" height="44" fill="#f6d6d3" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="464" y="132" width="44" height="44" fill="#ffffff" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="508" y="132" width="44" height="44" fill="#ffffff" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="552" y="132" width="44" height="44" fill="#ffffff" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="464" y="176" width="44" height="44" fill="#f6d6d3" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="508" y="176" width="44" height="44" fill="#ffffff" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="552" y="176" width="44" height="44" fill="#ffffff" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>

  <text x="486" y="118" text-anchor="middle" font-size="17" fill="#2b2b2b" filter="url(#rough2)">X</text>
  <text x="530" y="118" text-anchor="middle" font-size="17" fill="#8a8a8a" filter="url(#rough2)">.</text>
  <text x="574" y="118" text-anchor="middle" font-size="17" fill="#b85450" filter="url(#rough2)">X</text>
  <text x="486" y="162" text-anchor="middle" font-size="17" fill="#2b2b2b" filter="url(#rough2)">X</text>
  <text x="530" y="162" text-anchor="middle" font-size="17" fill="#8a8a8a" filter="url(#rough2)">.</text>
  <text x="574" y="162" text-anchor="middle" font-size="17" fill="#8a8a8a" filter="url(#rough2)">.</text>
  <text x="486" y="206" text-anchor="middle" font-size="17" fill="#b85450" filter="url(#rough2)">.</text>
  <text x="530" y="206" text-anchor="middle" font-size="17" fill="#8a8a8a" filter="url(#rough2)">.</text>
  <text x="574" y="206" text-anchor="middle" font-size="17" fill="#8a8a8a" filter="url(#rough2)">.</text>

  <line x1="552" y1="110" x2="464" y2="198" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="530" y="242" text-anchor="middle" font-size="11" fill="#8c3a36" filter="url(#rough2)">(0,2)=X 但 (2,0)=.，这一对不同</text>
  <text x="530" y="266" text-anchor="middle" font-size="13" font-weight="bold" fill="#8c3a36" filter="url(#rough2)">立刻 NO</text>

  <line x1="380" y1="88" x2="380" y2="272" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <text x="380" y="304" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">等价说法：把矩阵旋转 180° 后必须和原矩阵逐格相同</text>
</svg>
