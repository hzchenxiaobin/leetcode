<svg xmlns="http://www.w3.org/2000/svg" width="840" height="340" viewBox="0 0 840 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="340" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">双指针：左端 j 随 i 单调右移</text>
  <text x="420" y="56" text-anchor="middle" font-size="11.8" fill="#666666" filter="url(#rough2)">cost(j,i) 关于 j 递减、关于 i 递增</text>
  <g filter="url(#rough2)"><line x1="140" y1="240" x2="700" y2="240" stroke="#888888" stroke-width="1.4" marker-end="url(#arrb)"/></g>
  <text x="420" y="268" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">i（目标下标，递增）</text>
  <g filter="url(#rough2)"><circle cx="180" cy="120" r="7" fill="#a0522d" fill-opacity="0.9" stroke="#a0522d" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><circle cx="300" cy="100" r="7" fill="#a0522d" fill-opacity="0.9" stroke="#a0522d" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><line x1="180" y1="120" x2="300" y2="100" stroke="#a0522d" stroke-width="1.3"/></g>
  <g filter="url(#rough2)"><circle cx="420" cy="92" r="7" fill="#a0522d" fill-opacity="0.9" stroke="#a0522d" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><line x1="300" y1="100" x2="420" y2="92" stroke="#a0522d" stroke-width="1.3"/></g>
  <g filter="url(#rough2)"><circle cx="560" cy="96" r="7" fill="#a0522d" fill-opacity="0.9" stroke="#a0522d" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><line x1="420" y1="92" x2="560" y2="96" stroke="#a0522d" stroke-width="1.3"/></g>
  <g filter="url(#rough2)"><circle cx="660" cy="118" r="7" fill="#a0522d" fill-opacity="0.9" stroke="#a0522d" stroke-width="1.4"/></g>
  <g filter="url(#rough2)"><line x1="560" y1="96" x2="660" y2="118" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="420" y="176" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">j(i) 单调不减 ⇒ 窗口只进不退，总移动 O(n)</text>
  <g filter="url(#rough2)"><rect x="210" y="286" width="420" height="36" rx="4" fill="#f7fbf4" fill-opacity="0.85" stroke="#a8c99a" stroke-width="1.3"/></g>
  <text x="420" y="310" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3d6b2f" filter="url(#rough2)">排序 O(n log n) + 双指针 O(n), n=10⁵ 约 10 ms</text>
</svg>
