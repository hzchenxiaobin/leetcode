<svg xmlns="http://www.w3.org/2000/svg" width="880" height="392" viewBox="0 0 880 392"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="880" height="392" fill="#fafafa"/>
  <text x="440" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例演算：n = 5, s = 10110, S = {0,2,3}, 2^Z = 4</text>
  <path d="M 158 44 Q 440 52 722 44" stroke="#2b2b2b" stroke-width="1.1" fill="none" filter="url(#rough2)"/>
  <rect x="40" y="60" width="800" height="32" rx="6" fill="#eaeef3" stroke="#9aa7b4" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="86" y="81" text-anchor="middle" font-size="12" font-weight="bold" fill="#33475c" filter="url(#rough2)">阶段 k</text>
  <text x="330" y="81" text-anchor="middle" font-size="12" font-weight="bold" fill="#33475c" filter="url(#rough2)">块（按 y = 0,1,2… 排列）</text>
  <text x="600" y="81" text-anchor="middle" font-size="12" font-weight="bold" fill="#33475c" filter="url(#rough2)">各块因子 f</text>
  <text x="686" y="81" text-anchor="middle" font-size="12" font-weight="bold" fill="#33475c" filter="url(#rough2)">W_k</text>
  <text x="800" y="81" text-anchor="middle" font-size="12" font-weight="bold" fill="#33475c" filter="url(#rough2)">2^Z(W_k−1)</text>
  <rect x="40" y="100" width="800" height="38" rx="4" fill="#ffffff" stroke="#c8cdd3" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="86" y="125" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33475c" filter="url(#rough2)">k = 4</text>
  <text x="330" y="125" text-anchor="middle" font-size="12" fill="#33475c" filter="url(#rough2)">{3}  {0,4}  {1}  {2}</text>
  <text x="600" y="125" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">1, 1, ½, 1</text>
  <text x="686" y="125" text-anchor="middle" font-size="12.5" fill="#33475c" filter="url(#rough2)">4</text>
  <text x="800" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#a14340" filter="url(#rough2)">12</text>
  <rect x="40" y="140" width="800" height="38" rx="4" fill="#f4f6f8" stroke="#c8cdd3" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="86" y="165" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33475c" filter="url(#rough2)">k = 3</text>
  <text x="330" y="165" text-anchor="middle" font-size="12" fill="#33475c" filter="url(#rough2)">{1}  {2,3}  {0,4}</text>
  <text x="600" y="165" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">½, 1, 1</text>
  <text x="686" y="165" text-anchor="middle" font-size="12.5" fill="#33475c" filter="url(#rough2)">5/2</text>
  <text x="800" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#a14340" filter="url(#rough2)">6</text>
  <rect x="40" y="180" width="800" height="38" rx="4" fill="#ffffff" stroke="#c8cdd3" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="86" y="205" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33475c" filter="url(#rough2)">k = 2</text>
  <text x="330" y="205" text-anchor="middle" font-size="12" fill="#33475c" filter="url(#rough2)">{2,3}  {0,1,4}</text>
  <text x="600" y="205" text-anchor="middle" font-size="12" fill="#33475c" filter="url(#rough2)">1, 1</text>
  <text x="686" y="205" text-anchor="middle" font-size="12.5" fill="#33475c" filter="url(#rough2)">3</text>
  <text x="800" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#a14340" filter="url(#rough2)">8</text>
  <rect x="40" y="220" width="800" height="38" rx="4" fill="#f4f6f8" stroke="#c8cdd3" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="86" y="245" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#33475c" filter="url(#rough2)">k = 1</text>
  <text x="330" y="245" text-anchor="middle" font-size="12" fill="#33475c" filter="url(#rough2)">{0,1,2,3,4}</text>
  <text x="600" y="245" text-anchor="middle" font-size="12" fill="#33475c" filter="url(#rough2)">1</text>
  <text x="686" y="245" text-anchor="middle" font-size="12.5" fill="#33475c" filter="url(#rough2)">2</text>
  <text x="800" y="245" text-anchor="middle" font-size="13" font-weight="bold" fill="#a14340" filter="url(#rough2)">4</text>
  <rect x="40" y="260" width="800" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="86" y="284" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">合计</text>
  <text x="330" y="284" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">Σ (W_k − 1) = 3 + 3/2 + 2 + 1 = 15/2</text>
  <text x="686" y="284" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">4 × 15/2</text>
  <text x="800" y="284" text-anchor="middle" font-size="14" font-weight="bold" fill="#a14340" filter="url(#rough2)">30</text>
  <rect x="40" y="308" width="800" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="440" y="328" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">只有不含 S 元素的块才有 f = 1 − 2^{−c} &lt; 1；本例只有块 {1} 两次出现，故 f = ½</text>
  <text x="440" y="346" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">含 S 元素的块必被命中，f = 1（否则用 c 判断会把“必中”误算成 ½）</text>
</svg>
