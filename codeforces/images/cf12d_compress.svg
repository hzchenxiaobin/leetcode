<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="107"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrp" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="760" height="320" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">D：坐标压缩把“更聪明”变成“下标更小”</text>
  <path d="M 130 42 Q 380 47 630 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <text x="70" y="86" font-size="11.5" fill="#777" filter="url(#rough2)">智慧值 I（去重后升序）</text>
  <rect x="80" y="96" width="150" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="240" y="96" width="150" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="400" y="96" width="150" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="155" y="126" text-anchor="middle" font-size="16" fill="#2f4a66" filter="url(#rough2)">I = 2</text>
  <text x="315" y="126" text-anchor="middle" font-size="16" fill="#2f4a66" filter="url(#rough2)">I = 3</text>
  <text x="475" y="126" text-anchor="middle" font-size="16" fill="#2f4a66" filter="url(#rough2)">I = 4</text>
  <text x="155" y="160" text-anchor="middle" font-size="10" fill="#3c5e88" filter="url(#rough2)">rank 1</text>
  <text x="315" y="160" text-anchor="middle" font-size="10" fill="#3c5e88" filter="url(#rough2)">rank 2</text>
  <text x="475" y="160" text-anchor="middle" font-size="10" fill="#3c5e88" filter="url(#rough2)">rank 3</text>

  <line x1="155" y1="166" x2="475" y2="206" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrp)" filter="url(#rough2)"/>
  <line x1="315" y1="166" x2="315" y2="206" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrp)" filter="url(#rough2)"/>
  <line x1="475" y1="166" x2="155" y2="206" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrp)" filter="url(#rough2)"/>

  <text x="70" y="196" font-size="11.5" fill="#777" filter="url(#rough2)">pos = M - rank + 1（M = 3）</text>
  <rect x="80" y="206" width="150" height="46" rx="6" fill="#fdeceb" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="240" y="206" width="150" height="46" rx="6" fill="#fdeceb" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="400" y="206" width="150" height="46" rx="6" fill="#fdeceb" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="155" y="236" text-anchor="middle" font-size="16" fill="#8c3a36" filter="url(#rough2)">pos = 3</text>
  <text x="315" y="236" text-anchor="middle" font-size="16" fill="#8c3a36" filter="url(#rough2)">pos = 2</text>
  <text x="475" y="236" text-anchor="middle" font-size="16" fill="#8c3a36" filter="url(#rough2)">pos = 1</text>

  <rect x="560" y="90" width="180" height="170" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="572" y="116" font-size="11.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">为什么反着编号？</text>
  <text x="572" y="142" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">I 越大 → pos 越靠左</text>
  <text x="572" y="164" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">于是</text>
  <text x="572" y="186" font-size="10.5" fill="#2f5223" filter="url(#rough2)">I' &gt; I  ⟺  pos' &lt; pos</text>
  <text x="572" y="212" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">“严格更聪明”的一群人</text>
  <text x="572" y="234" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">正好是前缀 [1, pos-1]</text>

  <text x="380" y="290" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">前缀最大值树状数组：查询 O(log M)，插入 O(log M)，总复杂度 O(n log n)</text>
</svg>
