<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="330" fill="#fafafa"/>
  <text x="360.0" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">207A2：样例二与输出上限</text>
  <path d="M 144.00 46 Q 360.0 52 576.00 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="72" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">样例二走查：人 1 的序列 10,23,49（0 个下降）；人 2 的序列 100,99,98（2 个下降）。</text>
  <text x="60" y="92" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">答案 = max(0, 2) = 2。按“轮”输出：第 1 轮两段都只有第 1 个元素…</text>
  <rect x="90" y="130" width="80" height="44" rx="6" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="130" y="158" text-anchor="middle" font-size="12" fill="#2f5b34" filter="url(#rough2)">10</text>
  <text x="130" y="192" text-anchor="middle" font-size="9.5" fill="#33506e" filter="url(#rough2)">人1</text>
  <rect x="200" y="130" width="80" height="44" rx="6" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="240" y="158" text-anchor="middle" font-size="12" fill="#2f5b34" filter="url(#rough2)">23</text>
  <text x="240" y="192" text-anchor="middle" font-size="9.5" fill="#33506e" filter="url(#rough2)">人1</text>
  <rect x="310" y="130" width="80" height="44" rx="6" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="350" y="158" text-anchor="middle" font-size="12" fill="#2f5b34" filter="url(#rough2)">49</text>
  <text x="350" y="192" text-anchor="middle" font-size="9.5" fill="#33506e" filter="url(#rough2)">人1</text>
  <rect x="420" y="130" width="80" height="44" rx="6" fill="#fdeef1" stroke="#c0708a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="460" y="158" text-anchor="middle" font-size="12" fill="#8a3a52" filter="url(#rough2)">100</text>
  <text x="460" y="192" text-anchor="middle" font-size="9.5" fill="#33506e" filter="url(#rough2)">人2</text>
  <rect x="530" y="130" width="80" height="44" rx="6" fill="#fdeef1" stroke="#c0708a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="570" y="158" text-anchor="middle" font-size="12" fill="#8a3a52" filter="url(#rough2)">99</text>
  <text x="570" y="192" text-anchor="middle" font-size="9.5" fill="#33506e" filter="url(#rough2)">人2</text>
  <rect x="640" y="130" width="80" height="44" rx="6" fill="#fdeef1" stroke="#c0708a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="680" y="158" text-anchor="middle" font-size="12" fill="#8a3a52" filter="url(#rough2)">98</text>
  <text x="680" y="192" text-anchor="middle" font-size="9.5" fill="#33506e" filter="url(#rough2)">人2</text>
  <text x="90" y="226" text-anchor="start" font-size="11" fill="#8a3a52" filter="url(#rough2)">坏对：100→99、99→98（红框两处），共 2 个 ⇒ 第一行输出 2。</text>
  <rect x="60" y="248" width="620" height="64" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="265" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">n=2、k_i=200000 时总数 4×10⁵ &gt; 2×10⁵，只输出坏对数。</text>
  <text x="74" y="286" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">构造顺序按 (轮号, 数值, 段内位置) 排序，同一人的段内顺序天然保持。</text>
</svg>
