  <path d="M 250.0 268.0 L 250.0 130.0" stroke="#7a8794" stroke-width="1.5" fill="none" stroke-dasharray="5 5" filter="url(#rough2)"/>
  <text x="266.0" y="197.0" text-anchor="start" font-size="14" font-weight="bold" fill="#55606b" filter="url(#rough2)">R</text>
  <circle cx="250.0" cy="130.0" r="6" fill="#fff" stroke="#2b2b2b" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="388.0" cy="268.0" r="6" fill="#fff" stroke="#2b2b2b" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="112.0" cy="268.0" r="6" fill="#fff" stroke="#2b2b2b" stroke-width="2" filter="url(#rough2)"/>
  <text x="250.0" y="116.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">A</text>
  <text x="414.0" y="274.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">B</text>
  <text x="86.0" y="274.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">C</text>
  <text x="366.0" y="162.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">90°</text>
  <text x="134.0" y="162.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#d6a040" filter="url(#rough2)">90°</text>
  <text x="250.0" y="438.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">180°</text>
  <text x="250.0" y="460.0" text-anchor="middle" font-size="11" fill="#7a2f2b" filter="url(#rough2)">（C → A 走下半圆）</text>
  <rect x="486.7" y="175.3" width="234.6" height="137.4" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="604.0" y="196.2" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">步长 step = 2π / n</text>
  <text x="604.0" y="222.2" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">每段弧 = k · step，k ≥ 1</text>
  <text x="604.0" y="248.2" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">90° , 90° , 180°</text>
  <text x="604.0" y="274.2" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">180° = 2 × 90° ⇒ n = 4</text>
  <text x="604.0" y="300.2" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">n = 3（step 120°）✗ 90° 不是倍数</text>
  <text x="604.0" y="161.3" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">把圆周按三条弧切开</text>
  <rect x="543.0" y="329.4" width="121.9" height="54.6" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="604.0" y="348.9" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">取最小的可行 n</text>
  <text x="604.0" y="372.9" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">面积随 n 单调递增</text>
</svg>
