    </marker>
  </defs>

  <rect width="800" height="470" fill="#fafafa"/>

  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：三条弦对应的弧，都是 2π/n 的整数倍</text>
