<svg xmlns="http://www.w3.org/2000/svg" width="740" height="380" viewBox="0 0 740 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="83"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="740" height="380" fill="#fafafa"/>
  <text x="370" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1 的光路：两次魔法柱转向后从左边界射出</text>
  <path d="M 170 46 Q 370 52 570 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="120" y="90" width="76" height="76" fill="#ffffff" stroke="#bfbfbf" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="196" y="90" width="76" height="76" fill="#fde9d9" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="234.0" y="134.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">魔法</text>
  <rect x="272" y="90" width="76" height="76" fill="#ffffff" stroke="#bfbfbf" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="120" y="166" width="76" height="76" fill="#ffffff" stroke="#bfbfbf" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="196" y="166" width="76" height="76" fill="#ffffff" stroke="#bfbfbf" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="272" y="166" width="76" height="76" fill="#ffffff" stroke="#bfbfbf" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="120" y="242" width="76" height="76" fill="#ffffff" stroke="#bfbfbf" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="196" y="242" width="76" height="76" fill="#fde9d9" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="234.0" y="286.0" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">魔法</text>
  <rect x="272" y="242" width="76" height="76" fill="#ffffff" stroke="#bfbfbf" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 404 280 L 266 280" stroke="#b85450" stroke-width="2" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="356" y="270" text-anchor="start" font-size="11" font-weight="normal" fill="#b85450" filter="url(#rough2)">蛇怪</text>
  <path d="M 234 242 L 234 230" stroke="#b85450" stroke-width="2" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="242" y="236" text-anchor="start" font-size="10.5" font-weight="normal" fill="#b85450" filter="url(#rough2)">转向</text>
  <path d="M 196 128 L 64 128" stroke="#b85450" stroke-width="2" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="50" y="116" text-anchor="start" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">门口</text>
  <text x="50" y="152" text-anchor="start" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">人</text>
  <rect x="60" y="316" width="620" height="48" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="74" y="338" text-anchor="start" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">两根石柱各变一次魔法：一根把光从“沿最后一行”转成“沿第 2 列”，</text>
  <text x="74" y="356" text-anchor="start" font-size="11.5" font-weight="normal" fill="#7a5a1b" filter="url(#rough2)">另一根再把它转成“沿第 1 行”，于是光向左射出左边界打到门口的人。</text>
</svg>
