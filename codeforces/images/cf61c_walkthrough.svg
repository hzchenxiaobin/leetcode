<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400">
<defs>
  <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs>
<rect x="0" y="0" width="760" height="400" fill="#fafafa"/>
<text x="380.0" y="34" font-size="22" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="bold" text-anchor="middle" filter="url(#rough2)">三个小样例的换算</text>
<rect x="60" y="90" width="200" height="54" rx="8" fill="#e8f0fe" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="160.0" y="121.9" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">a=16, b=R, c=5</text>
<line x1="262" y1="117" x2="306" y2="117" stroke="#1a5fb4" stroke-width="2" filter="url(#rough2)"/>
<polygon points="306.0,117.0 295.0,112.0 295.0,122.0" fill="#1a5fb4" filter="url(#rough2)"/>
<rect x="308" y="90" width="150" height="54" rx="8" fill="#e6f4ea" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="383.0" y="122.6" font-size="16" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">v=5 → V</text>
<rect x="60" y="180" width="200" height="54" rx="8" fill="#e8f0fe" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="160.0" y="211.9" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">a=5, b=R, c=4</text>
<line x1="262" y1="207" x2="306" y2="207" stroke="#1a5fb4" stroke-width="2" filter="url(#rough2)"/>
<polygon points="306.0,207.0 295.0,202.0 295.0,212.0" fill="#1a5fb4" filter="url(#rough2)"/>
<rect x="308" y="180" width="150" height="54" rx="8" fill="#e6f4ea" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="383.0" y="212.6" font-size="16" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">v=4 → IV</text>
<rect x="60" y="270" width="200" height="54" rx="8" fill="#e8f0fe" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="160.0" y="301.9" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">a=12, b=13, c=A</text>
<line x1="262" y1="297" x2="306" y2="297" stroke="#1a5fb4" stroke-width="2" filter="url(#rough2)"/>
<polygon points="306.0,297.0 295.0,292.0 295.0,302.0" fill="#1a5fb4" filter="url(#rough2)"/>
<rect x="308" y="270" width="150" height="54" rx="8" fill="#e6f4ea" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="383.0" y="302.6" font-size="16" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">v=10 → A</text>
<text x="540" y="120" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="normal" text-anchor="start" filter="url(#rough2)">A 表示 10</text>
<text x="540" y="210" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="normal" text-anchor="start" filter="url(#rough2)">减法原则</text>
<text x="540" y="300" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="normal" text-anchor="start" filter="url(#rough2)">13 进制里 10 写作 A</text>
</svg>
