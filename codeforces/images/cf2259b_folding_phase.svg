<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#8a6d3b" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="700" height="440" fill="#fafafa"/>

  <text x="350" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">操作 k 次后 a[i] → |a[i] − 2k|：奇偶不变，偶数再按 x mod 4 分相</text>

  <!-- 轨迹表 -->
  <text x="182" y="78" text-anchor="end" font-size="13" fill="#666" filter="url(#rough2)">k =</text>
  <text x="208" y="78" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">0</text>
  <text x="248" y="78" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">1</text>
  <text x="288" y="78" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">2</text>
  <text x="328" y="78" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">3</text>
  <text x="368" y="78" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">4</text>
  <text x="408" y="78" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">5</text>
  <text x="448" y="78" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">6</text>
  <text x="488" y="78" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">7</text>

  <text x="182" y="106" text-anchor="end" font-size="13" fill="#4a7a3a" filter="url(#rough2)">a = 9（奇）</text>
  <text x="182" y="142" text-anchor="end" font-size="13" fill="#446688" filter="url(#rough2)">a = 8（≡0）</text>
  <text x="182" y="178" text-anchor="end" font-size="13" fill="#b8860b" filter="url(#rough2)">a = 10（≡2）</text>

  <rect x="192" y="88" width="36" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="232" y="88" width="36" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="272" y="88" width="36" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="312" y="88" width="36" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="352" y="88" width="36" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="392" y="88" width="36" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="432" y="88" width="36" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="472" y="88" width="36" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>

  <rect x="192" y="124" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="232" y="124" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="272" y="124" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="312" y="124" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="352" y="124" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="392" y="124" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="432" y="124" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="472" y="124" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>

  <rect x="192" y="160" width="36" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="232" y="160" width="36" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="272" y="160" width="36" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="312" y="160" width="36" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="352" y="160" width="36" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="392" y="160" width="36" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="432" y="160" width="36" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <rect x="472" y="160" width="36" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>

  <text x="210" y="108" text-anchor="middle" font-size="14" fill="#2f4f2f" filter="url(#rough2)">9</text>
  <text x="250" y="108" text-anchor="middle" font-size="14" fill="#2f4f2f" filter="url(#rough2)">7</text>
  <text x="290" y="108" text-anchor="middle" font-size="14" fill="#2f4f2f" filter="url(#rough2)">5</text>
  <text x="330" y="108" text-anchor="middle" font-size="14" fill="#2f4f2f" filter="url(#rough2)">3</text>
  <text x="370" y="108" text-anchor="middle" font-size="14" fill="#2f4f2f" filter="url(#rough2)">1</text>
  <text x="410" y="108" text-anchor="middle" font-size="14" fill="#2f4f2f" filter="url(#rough2)">1</text>
  <text x="450" y="108" text-anchor="middle" font-size="14" fill="#2f4f2f" filter="url(#rough2)">1</text>
  <text x="490" y="108" text-anchor="middle" font-size="14" fill="#2f4f2f" filter="url(#rough2)">1</text>

  <text x="210" y="144" text-anchor="middle" font-size="14" fill="#2b4a6b" filter="url(#rough2)">8</text>
  <text x="250" y="144" text-anchor="middle" font-size="14" fill="#2b4a6b" filter="url(#rough2)">6</text>
  <text x="290" y="144" text-anchor="middle" font-size="14" fill="#2b4a6b" filter="url(#rough2)">4</text>
  <text x="330" y="144" text-anchor="middle" font-size="14" fill="#2b4a6b" filter="url(#rough2)">2</text>
  <text x="370" y="144" text-anchor="middle" font-size="14" fill="#2b4a6b" filter="url(#rough2)">0</text>
  <text x="410" y="144" text-anchor="middle" font-size="14" fill="#2b4a6b" filter="url(#rough2)">2</text>
  <text x="450" y="144" text-anchor="middle" font-size="14" fill="#2b4a6b" filter="url(#rough2)">0</text>
  <text x="490" y="144" text-anchor="middle" font-size="14" fill="#2b4a6b" filter="url(#rough2)">2</text>

  <text x="210" y="180" text-anchor="middle" font-size="14" fill="#8a6d3b" filter="url(#rough2)">10</text>
  <text x="250" y="180" text-anchor="middle" font-size="14" fill="#8a6d3b" filter="url(#rough2)">8</text>
  <text x="290" y="180" text-anchor="middle" font-size="14" fill="#8a6d3b" filter="url(#rough2)">6</text>
  <text x="330" y="180" text-anchor="middle" font-size="14" fill="#8a6d3b" filter="url(#rough2)">4</text>
  <text x="370" y="180" text-anchor="middle" font-size="14" fill="#8a6d3b" filter="url(#rough2)">2</text>
  <text x="410" y="180" text-anchor="middle" font-size="14" fill="#8a6d3b" filter="url(#rough2)">0</text>
  <text x="450" y="180" text-anchor="middle" font-size="14" fill="#8a6d3b" filter="url(#rough2)">2</text>
  <text x="490" y="180" text-anchor="middle" font-size="14" fill="#8a6d3b" filter="url(#rough2)">0</text>

  <rect x="386" y="118" width="128" height="76" rx="8" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <text x="232" y="212" font-size="12" fill="#b85450" filter="url(#rough2)">k ≥ 5 起：8 与 10 反相（每列一个 0、一个 2）</text>

  <!-- 相遇条件 -->
  <text x="530" y="100" font-size="13" fill="#b85450" filter="url(#rough2)">相遇条件</text>
  <text x="530" y="126" font-size="16" fill="#333" filter="url(#rough2)">x + y = 4k</text>
  <text x="530" y="152" font-size="12" fill="#666" filter="url(#rough2)">即两数关于 2k 对称</text>
  <text x="530" y="174" font-size="12" fill="#666" filter="url(#rough2)">才会在同一时刻重合</text>

  <!-- 三类结论 -->
  <rect x="30" y="236" width="212" height="72" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="136" y="260" text-anchor="middle" font-size="14" fill="#2f4f2f" filter="url(#rough2)">奇数（2 ∤ x）</text>
  <text x="136" y="286" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">k 够大 → 全部停在 1</text>

  <rect x="252" y="236" width="196" height="72" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="350" y="260" text-anchor="middle" font-size="14" fill="#2b4a6b" filter="url(#rough2)">x ≡ 0 (mod 4)</text>
  <text x="350" y="286" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">k 大时取 0 或 2</text>

  <rect x="458" y="236" width="212" height="72" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="564" y="260" text-anchor="middle" font-size="14" fill="#8a6d3b" filter="url(#rough2)">x ≡ 2 (mod 4)</text>
  <text x="564" y="286" text-anchor="middle" font-size="12" fill="#b8860b" filter="url(#rough2)">相位与左侧正好相反</text>

  <!-- 结论公式 -->
  <rect x="55" y="322" width="590" height="72" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="352" text-anchor="middle" font-size="16" fill="#7a2f2b" filter="url(#rough2)">答案 = max( 奇数个数 , #(x ≡ 0 mod 4) , #(x ≡ 2 mod 4) )</text>
  <text x="350" y="378" text-anchor="middle" font-size="12" fill="#8a4a46" filter="url(#rough2)">同一时刻同类元素取同一终值 → 整组「抱团」；其他目标值每刻最多命中 1 个原值</text>
</svg>
