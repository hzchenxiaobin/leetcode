<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#7a5b9a"/>
    </marker>
  </defs>

  <rect width="880" height="470" fill="#fafafa"/>

  <text x="440" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两个方向各判一次，取并集：样例一的答案是 {2, 4}</text>
  <text x="440" y="58" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">a = [1, 7, 2, 3]，b = [8, 1, 1, 3]（b 标在弧上）</text>

  <!-- 环形公路 -->
  <g filter="url(#rough2)">
    <circle cx="410" cy="250" r="140" fill="none" stroke="#bbbbbb" stroke-width="1.6" stroke-dasharray="7 5"/>
  </g>

  <!-- 顺时针箭头（半径略大） -->
  <g filter="url(#rough2)">
    <path d="M 285 208 Q 315 120 385 112" stroke="#446688" stroke-width="2.2" fill="none" marker-end="url(#arr)"/>
    <path d="M 448 116 Q 512 140 540 205" stroke="#446688" stroke-width="2.2" fill="none" marker-end="url(#arr)"/>
    <path d="M 540 296 Q 505 372 448 384" stroke="#446688" stroke-width="2.2" fill="none" marker-end="url(#arr)"/>
    <path d="M 368 386 Q 300 368 278 300" stroke="#446688" stroke-width="2.2" fill="none" marker-end="url(#arr)"/>

    <text x="300" y="140" font-size="10.5" fill="#2f4a66">b₁=8</text>
    <text x="524" y="160" font-size="10.5" fill="#2f4a66">b₂=1</text>
    <text x="524" y="352" font-size="10.5" fill="#2f4a66">b₃=1</text>
    <text x="286" y="352" font-size="10.5" fill="#2f4a66">b₄=3</text>
    <text x="440" y="84" font-size="11" font-weight="bold" fill="#2f4a66">顺时针（编号增大）</text>
  </g>

  <!-- 逆时针示意箭头 -->
  <g filter="url(#rough2)">
    <path d="M 470 300 Q 500 320 505 296" stroke="#7a5b9a" stroke-width="1.8" fill="none" stroke-dasharray="4 3" marker-end="url(#arrb)"/>
    <text x="500" y="330" font-size="10.5" fill="#6b4f8a">逆时针（编号减小）</text>
  </g>

  <!-- 站点 -->
  <g filter="url(#rough2)">
    <rect x="363" y="104" width="94" height="52" rx="9" fill="#d9ecd4" stroke="#4a7a3a" stroke-width="2"/>
    <text x="410" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223">2 号</text>
    <text x="410" y="146" text-anchor="middle" font-size="10.5" fill="#2f5223">a₂ = 7</text>

    <rect x="228" y="224" width="94" height="52" rx="9" fill="#eeeeee" stroke="#888888" stroke-width="1.6"/>
    <text x="275" y="246" text-anchor="middle" font-size="13" fill="#666666">1 号</text>
    <text x="275" y="266" text-anchor="middle" font-size="10.5" fill="#666666">a₁ = 1</text>

    <rect x="498" y="224" width="94" height="52" rx="9" fill="#eeeeee" stroke="#888888" stroke-width="1.6"/>
    <text x="545" y="246" text-anchor="middle" font-size="13" fill="#666666">3 号</text>
    <text x="545" y="266" text-anchor="middle" font-size="10.5" fill="#666666">a₃ = 2</text>

    <rect x="363" y="352" width="94" height="52" rx="9" fill="#f6e3c4" stroke="#b58a3a" stroke-width="2"/>
    <text x="410" y="374" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5a1b">4 号</text>
    <text x="410" y="394" text-anchor="middle" font-size="10.5" fill="#7a5a1b">a₄ = 3</text>
  </g>

  <!-- 中心说明 -->
  <g filter="url(#rough2)">
    <text x="410" y="226" text-anchor="middle" font-size="11.5" fill="#2f5223">绿色：顺时针可行</text>
    <text x="410" y="248" text-anchor="middle" font-size="11.5" fill="#7a5a1b">橙色：逆时针可行</text>
    <text x="410" y="270" text-anchor="middle" font-size="11.5" fill="#666666">灰色：两个方向都不行</text>
  </g>

  <g filter="url(#rough2)">
    <text x="640" y="240" font-size="11" fill="#2f4a66">2 号顺时针：</text>
    <text x="640" y="262" font-size="11" fill="#2f4a66">7 → 6 → 8 → 7 →</text>
    <text x="640" y="284" font-size="11" fill="#2f4a66">10 → 7 → 8 → 0</text>
    <text x="640" y="312" font-size="11" fill="#7a5a1b">4 号逆时针：</text>
    <text x="640" y="334" font-size="11" fill="#7a5a1b">3 → 2 → 4 → 3 →</text>
    <text x="640" y="356" font-size="11" fill="#7a5a1b">10 → 2 → 3 → 0</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="424" width="760" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="74" y="445" font-size="11.5" fill="#8a6015">对 (a, b) 跑一次顺时针，再对翻转后的 (a′, b′) 跑一次；两个可行集合换成原编号后取并集。</text>
  </g>
</svg>
