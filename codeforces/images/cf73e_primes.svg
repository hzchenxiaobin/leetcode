<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="103"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="720" height="400" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">素数 p ≤ x−1 只能被 a = p 覆盖 ⇒ 答案就是素数个数</text>
  <path d="M 110 40 Q 360 46 610 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 覆盖表 -->
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <text x="120" y="78" fill="#2b2b2b" font-weight="bold">N</text>
    <text x="190" y="78" fill="#2b2b2b" font-weight="bold">2</text>
    <text x="250" y="78" fill="#2b2b2b" font-weight="bold">3</text>
    <text x="310" y="78" fill="#2b2b2b" font-weight="bold">4</text>
    <text x="370" y="78" fill="#2b2b2b" font-weight="bold">5</text>
    <text x="440" y="78" fill="#2b2b2b" font-weight="bold">…</text>
    <text x="520" y="78" fill="#2b2b2b" font-weight="bold">x−1</text>

    <text x="120" y="112" fill="#2f4a66">素数?</text>
    <text x="190" y="112" fill="#8c2f2b">是</text>
    <text x="250" y="112" fill="#8c2f2b">是</text>
    <text x="310" y="112" fill="#1f5226">否</text>
    <text x="370" y="112" fill="#8c2f2b">是</text>
    <text x="440" y="112" fill="#555">…</text>
    <text x="520" y="112" fill="#555">?</text>

    <text x="120" y="146" fill="#2f4a66">覆盖它的 a</text>
    <text x="190" y="146" fill="#8c2f2b">1 或 2</text>
    <text x="250" y="146" fill="#8c2f2b">1 或 3</text>
    <text x="310" y="146" fill="#1f5226">1,2,4</text>
    <text x="370" y="146" fill="#8c2f2b">1 或 5</text>
    <text x="440" y="146" fill="#555">…</text>
    <text x="520" y="146" fill="#555">…</text>
  </g>
  <g filter="url(#rough2)" stroke="#cccccc" stroke-width="1">
    <line x1="100" y1="88" x2="620" y2="88"/>
    <line x1="100" y1="124" x2="620" y2="124"/>
  </g>

  <!-- 结论 -->
  <rect x="60" y="176" width="600" height="108" rx="10" fill="#fdecea" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="202" font-size="12.5" font-weight="bold" fill="#8c2f2b">素数没有“便宜的替代品”：p 的约数只有 1 和 p</text>
  <text x="76" y="228" font-size="11.5" fill="#8c2f2b">所以 a = 1 不在输入里时，每个素数 p ≤ x−1 都必须被单独选中。</text>
  <text x="76" y="252" font-size="11.5" fill="#8c2f2b">选中全部素数后，任意 N 都有素因子 p ≤ N ≤ x−1 ⇒ 全部覆盖（充分性）。</text>
  <text x="76" y="274" font-size="11.5" fill="#8c2f2b">答案 = π(x−1)；只要有一个素数缺失就是 −1。</text>

  <!-- 样例二 -->
  <rect x="60" y="300" width="600" height="86" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="326" font-size="12.5" font-weight="bold" fill="#2f4a66">样例二：x = 4，只有 a = 2</text>
  <text x="76" y="350" font-size="11.5" fill="#2f4a66">需要覆盖 [2,3]，素数 3 不在输入里 ⇒ 输出 −1。</text>
  <text x="76" y="372" font-size="11.5" fill="#2f4a66">具体撞车：⌈3/2⌉ = ⌈4/2⌉ = 2，N = 3 与 N = 4 无法区分。</text>
</svg>
