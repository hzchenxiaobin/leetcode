<svg xmlns="http://www.w3.org/2000/svg" width="840" height="360" viewBox="0 0 840 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="360" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">用回边找环：迭代 DFS + 并查集合并</text>
  <text x="420" y="56" text-anchor="middle" font-size="11.8" fill="#666666" filter="url(#rough2)">遇到回边 u→v（v 是祖先），把 u..v 上的点并起来</text>
  <g filter="url(#rough2)"><circle cx="160" cy="110" r="24" fill="#d6e6f2" fill-opacity="0.9" stroke="#446688" stroke-width="1.6"/></g>
  <text x="160" y="116" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">v</text>
  <g filter="url(#rough2)"><circle cx="300" cy="110" r="24" fill="#d6e6f2" fill-opacity="0.9" stroke="#446688" stroke-width="1.6"/></g>
  <text x="300" y="116" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">a</text>
  <g filter="url(#rough2)"><circle cx="430" cy="110" r="24" fill="#d6e6f2" fill-opacity="0.9" stroke="#446688" stroke-width="1.6"/></g>
  <text x="430" y="116" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">b</text>
  <g filter="url(#rough2)"><circle cx="560" cy="110" r="24" fill="#d6e6f2" fill-opacity="0.9" stroke="#446688" stroke-width="1.6"/></g>
  <text x="560" y="116" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">u</text>
  <g filter="url(#rough2)"><line x1="184" y1="110" x2="276" y2="110" stroke="#888888" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><line x1="324" y1="110" x2="406" y2="110" stroke="#888888" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><line x1="454" y1="110" x2="536" y2="110" stroke="#888888" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><line x1="560" y1="134" x2="160" y2="134" stroke="#a0522d" stroke-width="1.5" stroke-dasharray="5 3"/></g>
  <text x="360" y="156" text-anchor="middle" font-size="10.5" fill="#a0522d" filter="url(#rough2)">回边 u→v</text>
  <text x="420" y="210" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">沿 par 从 u 走到 v，路径上的点全部 union</text>
  <text x="420" y="242" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">每个点至多属于一个环 ⇒ 总合并代价 O(n)</text>
  <g filter="url(#rough2)"><rect x="210" y="270" width="420" height="36" rx="4" fill="#f7fbf4" fill-opacity="0.85" stroke="#a8c99a" stroke-width="1.3"/></g>
  <text x="420" y="294" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3d6b2f" filter="url(#rough2)">收缩后用并查集根编号建树，再倍增 LCA</text>
  <text x="420" y="336" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">n = m = 10⁵ 时实测约 50 ms（限 2 s）</text>
</svg>
