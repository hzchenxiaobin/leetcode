<svg xmlns="http://www.w3.org/2000/svg" width="800" height="240" viewBox="0 0 800 240"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1058"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="800" height="240" fill="#fafafa"/>
  <text x="400.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">单次操作流程</text>
  <path d="M 128.0 42 Q 400.0 48 672.0 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="400.0" y="226" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">操作数 ≤ 符号数</text>
  <rect x="30.0" y="80" width="136.8" height="54" rx="7" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="98.4" y="105.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">队列取符号 s</text>
  <text x="98.4" y="123.0" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">位置 p、颜色 cₛ</text>
  <line x1="167.8" y1="107.0" x2="177.8" y2="107.0" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <rect x="180.8" y="80" width="136.8" height="54" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="249.20000000000002" y="105.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#5a7fb0" filter="url(#rough2)">查 p 所在类</text>
  <text x="249.20000000000002" y="123.0" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">DSU find</text>
  <line x1="318.6" y1="107.0" x2="328.6" y2="107.0" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <rect x="331.6" y="80" width="136.8" height="54" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="400.0" y="105.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#d6a040" filter="url(#rough2)">类颜色 = 0 或 cₛ?</text>
  <text x="400.0" y="123.0" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">是 → 跳过</text>
  <line x1="469.4" y1="107.0" x2="479.4" y2="107.0" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <rect x="482.40000000000003" y="80" width="136.8" height="54" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="550.8000000000001" y="105.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">ans += cnt</text>
  <text x="550.8000000000001" y="123.0" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">符号按螺旋序入队</text>
  <line x1="620.2" y1="107.0" x2="630.2" y2="107.0" stroke="#5a5a5a" stroke-width="1.4" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <rect x="633.2" y="80" width="136.8" height="54" rx="7" fill="#fbeeee" stroke="#a05a5a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="701.6" y="105.0" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a05a5a" filter="url(#rough2)">并入 cₛ 的类</text>
  <text x="701.6" y="123.0" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">删旧颜色映射</text>
</svg>
