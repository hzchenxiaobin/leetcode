<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1456"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="720" height="290" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2 走查：4 4 7 7，k = 2</text>
  <path d="M 170 42 Q 360 48 550 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <text x="30" y="90" font-size="11.5" fill="#2f5223" filter="url(#rough2)">初始</text>
  <rect x="190" y="72" width="50" height="36" rx="6" fill="#eef5ea" stroke="#5a8a4a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="215" y="96" text-anchor="middle" font-size="13" fill="#2f5223" filter="url(#rough2)">1</text>
  <text x="256" y="96" font-size="10" fill="#777777" filter="url(#rough2)">dp[0]</text>

  <text x="30" y="142" font-size="11.5" fill="#335478" filter="url(#rough2)">× (1+2x)：4</text>
  <rect x="190" y="124" width="50" height="36" rx="6" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="215" y="148" text-anchor="middle" font-size="13" fill="#335478" filter="url(#rough2)">1</text>
  <rect x="248" y="124" width="50" height="36" rx="6" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="273" y="148" text-anchor="middle" font-size="13" fill="#335478" filter="url(#rough2)">2</text>
  <text x="314" y="148" font-size="10" fill="#777777" filter="url(#rough2)">dp[1] = 2（两个 4 任选其一）</text>

  <text x="30" y="194" font-size="11.5" fill="#8a5a86" filter="url(#rough2)">× (1+2x)：7</text>
  <rect x="190" y="176" width="50" height="36" rx="6" fill="#f6eef4" stroke="#a05a9a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="215" y="200" text-anchor="middle" font-size="13" fill="#8a5a86" filter="url(#rough2)">1</text>
  <rect x="248" y="176" width="50" height="36" rx="6" fill="#f6eef4" stroke="#a05a9a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="273" y="200" text-anchor="middle" font-size="13" fill="#8a5a86" filter="url(#rough2)">4</text>
  <rect x="306" y="176" width="50" height="36" rx="6" fill="#f6eef4" stroke="#a05a9a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="331" y="200" text-anchor="middle" font-size="13" fill="#8a5a86" filter="url(#rough2)">4</text>
  <text x="372" y="200" font-size="10" fill="#777777" filter="url(#rough2)">dp[2] = 2×2 = 4（先挑一个 4、再挑一个 7）</text>

  <rect x="380" y="66" width="310" height="76" rx="8" fill="#fbeeee" stroke="#a05a5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="396" y="90" font-size="11.5" font-weight="bold" fill="#a05a5a" filter="url(#rough2)">U = 0，所以只能 j = k = 2</text>
  <text x="396" y="112" font-size="11.5" fill="#a05a5a" filter="url(#rough2)">答案 = dp[2]·C(0,0) = 4</text>
  <text x="396" y="132" font-size="10.5" fill="#777777" filter="url(#rough2)">对应下标集合 {1,3},{1,4},{2,3},{2,4}</text>

  <text x="360" y="242" text-anchor="middle" font-size="11.5" fill="#335478" filter="url(#rough2)">若把 k 改成 1：答案 = dp[1]·C(0,0) = 4（单独一个 4 或 7 都合法）</text>
  <text x="360" y="266" text-anchor="middle" font-size="11" fill="#777777" filter="url(#rough2)">注意 dp 的每一维只到 K = min(k, 不同幸运值个数)，本例 K = 2</text>
</svg>
