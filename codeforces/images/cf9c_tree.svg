<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="111"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="430" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">只含 0/1 的十进制数是一棵二叉树</text>
  <path d="M 130 44 Q 380 50 630 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 边 -->
  <line x1="380" y1="100" x2="286" y2="146" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="380" y1="100" x2="474" y2="146" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="270" y1="170" x2="196" y2="216" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="270" y1="170" x2="320" y2="216" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="490" y1="170" x2="440" y2="216" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="490" y1="170" x2="564" y2="216" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- 节点 -->
  <g filter="url(#rough2)">
    <rect x="352" y="70" width="56" height="30" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="242" y="146" width="56" height="30" rx="7" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <rect x="462" y="146" width="56" height="30" rx="7" fill="#ffffff" stroke="#446688" stroke-width="1.5"/>
    <rect x="168" y="216" width="56" height="30" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="292" y="216" width="56" height="30" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="412" y="216" width="56" height="30" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="536" y="216" width="56" height="30" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="380" y="91" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">1</text>
  <text x="270" y="167" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">10</text>
  <text x="490" y="167" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">11</text>
  <text x="196" y="237" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">100</text>
  <text x="320" y="237" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">101</text>
  <text x="440" y="237" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">110</text>
  <text x="564" y="237" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">111</text>

  <text x="440" y="91" font-size="11.5" fill="#777" filter="url(#rough2)">第 1 层：1 个</text>
  <text x="540" y="167" font-size="11.5" fill="#777" filter="url(#rough2)">第 2 层：2 个</text>
  <text x="614" y="237" font-size="11.5" fill="#777" filter="url(#rough2)">第 3 层：4 个</text>

  <!-- 第四层示意 -->
  <text x="380" y="282" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">每个数添 0 或添 1 得到下一层 ⇒ 第 L 层有 2^(L-1) 个</text>
  <text x="380" y="306" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">第 4 层 8 个，第 5 层 16 个，……，第 9 层 256 个</text>

  <!-- 计数公式 -->
  <rect x="70" y="326" width="620" height="88" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90" y="352" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">长度 1..9 的 0/1 数一共 1 + 2 + 4 + … + 256 = 511 个</text>
  <text x="90" y="378" font-size="12" fill="#7a5a1b" filter="url(#rough2)">n = 10^9 时还有一个 1000000000（第 10 层中唯一 ≤ n 的），所以答案是 512</text>
  <text x="90" y="402" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">我们只需要生成这 1 + 2 + … + 512 = 1023 个候选，而不是枚举到 n。</text>
</svg>
