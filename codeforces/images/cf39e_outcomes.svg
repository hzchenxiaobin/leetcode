<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-6%" y="-6%" width="112%" height="112%"><feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="407" /><feDisplacementMap in="SourceGraphic" scale="1.5" /></filter></defs>
  <rect width="760" height="430" fill="#fafafa" />
  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">三种结果：胜态、败态、平局</text>
  <path d="M 150 44 Q 380 50 610 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)" />

  <rect x="32" y="70" width="220" height="130" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)" />
  <text x="142" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5223" filter="url(#rough2)">胜态 W</text>
  <text x="52" y="128" font-size="11" fill="#3c5e2e" filter="url(#rough2)">存在一步安全走法，</text>
  <text x="52" y="150" font-size="11" fill="#3c5e2e" filter="url(#rough2)">走到对手的败态。</text>
  <text x="52" y="178" font-size="10.5" fill="#777" filter="url(#rough2)">当前玩家有必胜策略</text>

  <rect x="270" y="70" width="220" height="130" rx="10" fill="#fde8e8" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)" />
  <text x="380" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a3b36" filter="url(#rough2)">败态 L</text>
  <text x="290" y="128" font-size="11" fill="#8a3b36" filter="url(#rough2)">没有安全走法，或所有</text>
  <text x="290" y="150" font-size="11" fill="#8a3b36" filter="url(#rough2)">安全走法都到对手胜态。</text>
  <text x="290" y="178" font-size="10.5" fill="#777" filter="url(#rough2)">当前玩家必败</text>

  <rect x="508" y="70" width="220" height="130" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)" />
  <text x="618" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">平局 D</text>
  <text x="528" y="128" font-size="11" fill="#7a5a1b" filter="url(#rough2)">没有胜招，但存在一步</text>
  <text x="528" y="150" font-size="11" fill="#7a5a1b" filter="url(#rough2)">走到平局（循环）。</text>
  <text x="528" y="178" font-size="10.5" fill="#777" filter="url(#rough2)">双方都无法强制取胜</text>

  <rect x="50" y="226" width="660" height="76" rx="10" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.5" filter="url(#rough2)" />
  <text x="70" y="252" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">a ≥ 2 时，a 和 b 只增不减，状态图是 DAG（无环）</text>
  <text x="70" y="276" font-size="11.5" fill="#555" filter="url(#rough2)">所以从大到小 DP 即可，不会出现平局。</text>

  <rect x="50" y="318" width="660" height="92" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)" />
  <text x="70" y="344" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">a = 1 时：1^b 永远等于 1，加物品可以无限进行</text>
  <text x="70" y="368" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">当 b 大到加盒子必输时，双方都只能加物品 → 平局；</text>
  <text x="70" y="390" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">但在较小的 b，若加盒子能到对手的败态，则当前是胜态。</text>
</svg>