<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="330" fill="#fafafa"/>
  <text x="360.0" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">201D：按 (集合, 逆序数) 分层的 DP</text>
  <path d="M 144.00 46 Q 360.0 52 576.00 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="70" text-anchor="start" font-size="11" fill="#333" filter="url(#rough2)">状态 = (已用的单词集合 mask, 当前逆序数 x) → 值 = 该排列在文本里贪心匹配后的最早结束位置。</text>
  <rect x="60" y="96" width="230" height="70" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="114" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">(mask, x) → end</text>
  <text x="74" y="136" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">已经放下 mask 里的词，</text>
  <text x="74" y="158" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">逆序数 x，文本位置 end</text>
  <path d="M 296 130 L 352 130" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="324" y="118" text-anchor="middle" font-size="10" fill="#33506e" filter="url(#rough2)">追加 w</text>
  <rect x="358" y="96" width="290" height="70" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="372" y="114" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">(mask | 1&lt;&lt;w, x + c) → q</text>
  <text x="372" y="136" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">c = popcount(mask &amp; after[w])</text>
  <text x="372" y="158" text-anchor="start" font-size="11" fill="#2f5b34" filter="url(#rough2)">q = 文本里 w 在 end 之后首次出现的位置</text>
  <text x="60" y="200" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">after[w] = 原题中排在 w 之后的单词位掩码；c 就是“把 w 追加到末尾”新增的逆序对数。</text>
  <rect x="60" y="222" width="600" height="86" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="240" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">对同一个 (mask, x)，只保留最小的 end —— 结束得越早，后面能接的单词越多，</text>
  <text x="74" y="262" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">所以这是一个合法的支配关系；不同 x 之间不能互相支配（x 小的可能结束晚），</text>
  <text x="74" y="284" text-anchor="start" font-size="11" fill="#8a6015" filter="url(#rough2)">必须每个 x 都留一个最小 end。</text>
</svg>
