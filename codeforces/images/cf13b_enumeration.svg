<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">枚举所有角色分配（至多 3 × 4 × 2 种）</text>
  <path d="M 150 44 Q 360 50 570 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <rect x="22" y="72" width="150" height="70" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="97" y="102" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">① 选横杠</text>
  <text x="97" y="126" text-anchor="middle" font-size="11" fill="#3c5a73" filter="url(#rough2)">3 种选法</text>

  <path d="M 176 107 L 198 107" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="202" y="72" width="170" height="70" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="287" y="102" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">② 找公共端点</text>
  <text x="287" y="126" text-anchor="middle" font-size="11" fill="#3c5e2e" filter="url(#rough2)">端点配对 ≤ 4 种</text>

  <path d="M 376 107 L 398 107" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="402" y="72" width="160" height="70" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="482" y="102" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">③ 横杠端点对应</text>
  <text x="482" y="126" text-anchor="middle" font-size="11" fill="#7a5a1b" filter="url(#rough2)">Q₁Q₂ 与腿的 2 种配对</text>

  <path d="M 566 107 L 588 107" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="592" y="72" width="110" height="70" rx="10" fill="#fde8e8" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="647" y="102" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a33a36" filter="url(#rough2)">④ 检查</text>
  <text x="647" y="126" text-anchor="middle" font-size="11" fill="#8a3b38" filter="url(#rough2)">全过则 YES</text>

  <rect x="30" y="168" width="660" height="146" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <g font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">
    <text x="46" y="196">① 两条腿必须有完全相同的端点 O（整数坐标直接比较，不用 eps）</text>
    <text x="46" y="224">② 夹角：cross(OA₁, OA₂) ≠ 0 且 dot(OA₁, OA₂) ≥ 0</text>
    <text x="46" y="252">③ 横杠端点 Q 落在腿上：cross(OA, OQ) = 0</text>
    <text x="46" y="280">④ 比例：5·(OA·OQ) ≥ |OA|² 且 5·(OA·OQ) ≤ 4·|OA|²</text>
  </g>

  <text x="30" y="350" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">任一组合通过全部四个条件 → 输出 YES；所有组合都失败 → 输出 NO。</text>
  <text x="30" y="380" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">横杠端点有两种对应方式，都要试；两条腿的公共端点 O 也可能有多种取法，同样都要试。</text>
  <text x="30" y="410" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">全部判定只用整数交叉积与点积：坐标 ≤ 10⁸ 时 5·dot ≤ 4×10¹⁷，64 位整数足够。</text>
</svg>
