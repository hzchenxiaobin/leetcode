  <rect width="660" height="500" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">一次查询 = 差分数组两处点更新 ⇒ D 在区间 [lo, hi−1] 上整体平移</text>
  <text x="330" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">a_i += v 即 b_i += v、b_{n+1−i} −= v；区间以外 D 一个都不动（n = 9）</text>

