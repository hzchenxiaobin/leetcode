  <!-- formula -->
  <rect x="40" y="344" width="580" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="330" y="368" text-anchor="middle" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">记 Z = 全体 k∈[1,n−1] 中 D_k = 0 的个数，区间 I = [lo, hi−1]</text>
  <text x="330" y="392" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">g = Z − #{k∈I : D_k = 0} + #{k∈I : D_k = −σv}</text>
  <text x="330" y="416" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">两个计数都是「某值的下标表 + 二分」，单次 O(log n)；答案 = C(g, m−1)</text>

  <text x="330" y="462" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">v = 0 或 i = i'（正中间元素）时两次点更新互相抵消，整条 D 不变，直接取 Z</text>
