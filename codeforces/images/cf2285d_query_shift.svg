  <path d="M 190 158 Q 190 166 198 166 L 462 166 Q 470 166 470 158" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="330" y="182" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">区间 [lo, hi−1] = [2, 7] 整体 +v</text>

