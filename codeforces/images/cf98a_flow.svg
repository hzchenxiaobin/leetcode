<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="983"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="300" fill="#fafafa"/>
  <text x="360.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">Burnside 计数流程</text>
  <path d="M 115.2 42 Q 360.0 48 604.8 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="360.0" y="286" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">答案一定是整数，直接整除</text>
  <rect x="30" y="70" width="150" height="50" rx="7" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="105" y="92" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">读入 6 颗宝石</text>
  <text x="105" y="110" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">统计各色个数</text>
  <rect x="205" y="70" width="150" height="50" rx="7" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="92" text-anchor="middle" font-size="12.5" fill="#335478" filter="url(#rough2)">枚举 24 个旋转</text>
  <text x="280" y="110" text-anchor="middle" font-size="11" fill="#335478" filter="url(#rough2)">（生成元 BFS）</text>
  <rect x="380" y="70" width="160" height="50" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="460" y="92" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">分解成轮换</text>
  <text x="460" y="110" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">长度 c₁…c_k</text>
  <rect x="565" y="70" width="130" height="50" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="630" y="92" text-anchor="middle" font-size="12.5" fill="#2f5223" filter="url(#rough2)">DP 求 Fix</text>
  <text x="630" y="110" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">累加</text>
  <line x1="180.0" y1="95.0" x2="205.0" y2="95.0" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <line x1="355.0" y1="95.0" x2="380.0" y2="95.0" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <line x1="540.0" y1="95.0" x2="565.0" y2="95.0" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <line x1="630.0" y1="120.0" x2="630.0" y2="150.0" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <rect x="420" y="150" width="270" height="44" rx="7" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="555" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">输出 sum / 24</text>
  <rect x="40" y="220" width="640" height="52" rx="8" fill="#f4f4f0" stroke="#8a8a8a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="360" y="242" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">Fix(g)：轮换内必须同色 ⇒ 给每个轮换挑一种颜色，使各色用量恰好等于给定多重集</text>
  <text x="360" y="262" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">同色宝石不可区分，所以不能按 6! 计数</text>
</svg>
