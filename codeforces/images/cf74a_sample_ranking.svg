<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="35"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="820" height="360" fill="#fafafa"/>

  <text x="410" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例的五人总分：tourist 以 4140 领先</text>

  <!-- 轴：0 分在 x=170，向右每 100 分 100px（只画正分部分），负分单独标注 -->
  <g filter="url(#rough2)">
    <line x1="170" y1="320" x2="760" y2="320" stroke="#666666" stroke-width="1.4"/>
    <text x="170" y="338" text-anchor="middle" font-size="10.5" fill="#888888">0</text>
    <line x1="270" y1="70" x2="270" y2="320" stroke="#eeeeee" stroke-width="1"/>
    <line x1="370" y1="70" x2="370" y2="320" stroke="#eeeeee" stroke-width="1"/>
    <line x1="470" y1="70" x2="470" y2="320" stroke="#eeeeee" stroke-width="1"/>
    <line x1="570" y1="70" x2="570" y2="320" stroke="#eeeeee" stroke-width="1"/>
    <line x1="670" y1="70" x2="670" y2="320" stroke="#eeeeee" stroke-width="1"/>
    <text x="270" y="338" text-anchor="middle" font-size="10" fill="#bbbbbb">1000</text>
    <text x="370" y="338" text-anchor="middle" font-size="10" fill="#bbbbbb">2000</text>
    <text x="470" y="338" text-anchor="middle" font-size="10" fill="#bbbbbb">3000</text>
    <text x="570" y="338" text-anchor="middle" font-size="10" fill="#bbbbbb">4000</text>
    <text x="670" y="338" text-anchor="middle" font-size="10" fill="#bbbbbb">5000</text>

    <text x="120" y="118" text-anchor="end" font-size="12" fill="#444444">Petr</text>
    <rect x="170" y="100" width="386" height="26" rx="4" fill="#cfe0f5" stroke="#446688" stroke-width="1.4"/>
    <text x="566" y="118" font-size="11" fill="#2f4a66">3860</text>

    <text x="120" y="168" text-anchor="end" font-size="12" font-weight="bold" fill="#2f5223">tourist</text>
    <rect x="170" y="150" width="414" height="26" rx="4" fill="#b9dcae" stroke="#3d6b2f" stroke-width="1.8"/>
    <text x="594" y="168" font-size="11.5" font-weight="bold" fill="#2f5223">4140 ← 最大</text>

    <text x="120" y="218" text-anchor="end" font-size="12" fill="#444444">Egor</text>
    <rect x="170" y="200" width="403" height="26" rx="4" fill="#f6e3c4" stroke="#b58a3a" stroke-width="1.4"/>
    <text x="583" y="218" font-size="11" fill="#7a5a1b">4030</text>

    <text x="120" y="268" text-anchor="end" font-size="12" fill="#444444">some_participant</text>
    <rect x="170" y="250" width="222" height="26" rx="4" fill="#e8e0f2" stroke="#6b5b9a" stroke-width="1.4"/>
    <text x="402" y="268" font-size="11" fill="#4b3f66">2220</text>

    <text x="120" y="318" text-anchor="end" font-size="12" fill="#8a2b28">c00lH4x0R</text>
    <rect x="60" y="300" width="110" height="26" rx="4" fill="#f6d9d7" stroke="#b85450" stroke-width="1.4"/>
    <text x="162" y="318" text-anchor="end" font-size="11" fill="#8a2b28">−350</text>
  </g>
</svg>
