<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="87"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">180F 样例 1 走查：a=(2,1,4,3)，b=(3,4,2,1)</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="40.0" y="116.0" text-anchor="start" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">a[i]</text>
  <text x="150.0" y="116.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="250.0" y="116.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="350.0" y="116.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="450.0" y="116.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="40.0" y="162.0" text-anchor="start" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">b[i]</text>
  <text x="150.0" y="162.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="250.0" y="162.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="350.0" y="162.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="450.0" y="162.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="40.0" y="208.0" text-anchor="start" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">inv_a[x]</text>
  <text x="150.0" y="208.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">—</text>
  <text x="250.0" y="208.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">—</text>
  <text x="350.0" y="208.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">—</text>
  <text x="450.0" y="208.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">—</text>
  <text x="40.0" y="254.0" text-anchor="start" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">p[i]=inv_a[b[i]]</text>
  <text x="150.0" y="254.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="250.0" y="254.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="350.0" y="254.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="450.0" y="254.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="70.0" y="320.0" text-anchor="start" font-size="12" fill="#8a6015" font-weight="bold" filter="url(#rough2)">inv_a = (2,1,4,3)（a 是两两交换，自逆）</text>
  <text x="70.0" y="350.0" text-anchor="start" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">p = (4,3,1,2)，与官方输出一致</text>
</svg>
