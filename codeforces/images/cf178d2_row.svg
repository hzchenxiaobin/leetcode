<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="380" fill="#fafafa"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">D2：按行填，每行最后一格由 s 唯一反解</text>
  <path d="M 198.12000000000003 46 Q 380.0 52 561.88 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="90.0" y="70.0" width="74.0" height="50.0" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="127.0" y="99.5" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">?</text>
  <rect x="168.0" y="70.0" width="74.0" height="50.0" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="205.0" y="99.5" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">?</text>
  <rect x="246.0" y="70.0" width="74.0" height="50.0" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="283.0" y="99.5" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">?</text>
  <rect x="324.0" y="70.0" width="74.0" height="50.0" rx="6" fill="#fff3d6" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="361.0" y="99.5" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">= s − Σ</text>
  <text x="414.0" y="100.0" text-anchor="start" font-size="11.5" fill="#446688" filter="url(#rough2)">第 1 行</text>
  <rect x="90.0" y="132.0" width="74.0" height="50.0" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="127.0" y="161.5" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">?</text>
  <rect x="168.0" y="132.0" width="74.0" height="50.0" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="205.0" y="161.5" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">?</text>
  <rect x="246.0" y="132.0" width="74.0" height="50.0" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="283.0" y="161.5" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">?</text>
  <rect x="324.0" y="132.0" width="74.0" height="50.0" rx="6" fill="#fff3d6" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="361.0" y="161.5" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">= s − Σ</text>
  <text x="414.0" y="162.0" text-anchor="start" font-size="11.5" fill="#446688" filter="url(#rough2)">第 2 行</text>
  <text x="414.0" y="224.0" text-anchor="start" font-size="11.5" fill="#6b6b6b" filter="url(#rough2)">……共 n 行</text>
  <path d="M 90 205 L 700 205" stroke="#6b6b6b" stroke-width="1.0" fill="none" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <rect x="60.0" y="232.0" width="640.0" height="46.0" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="256.0" text-anchor="start" font-size="11.3" fill="#2f5b34" filter="url(#rough2)">每行只有前 n−1 格要枚举，最后一格 = s − 行前缀和：必须还在剩余多重集里。</text>
  <text x="74.0" y="274.0" text-anchor="start" font-size="11.3" fill="#2f5b34" filter="url(#rough2)">第 r 行填完后，每一列已经累计了 r 个数，剩 n−r 个必须补到 s。</text>
  <rect x="60.0" y="296.0" width="640.0" height="46.0" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="320.0" text-anchor="start" font-size="11.3" fill="#8a6015" filter="url(#rough2)">剪枝：需要的剩余和必须落在「剩余数里 n−r 个最小的和」与「n−r 个最大的和」之间。</text>
  <text x="74.0" y="338.0" text-anchor="start" font-size="11.3" fill="#8a6015" filter="url(#rough2)">≤ 9 种不同值时，多重集很“扁”，这个上下界把搜索压得很小。</text>
</svg>
