<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="83"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="340" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">筛法的两件事：先用 ≤ √r 的基素数，再只在 x ≡ 1 (mod 4) 上统计</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">区间很长（r ≤ 3×10⁸ 量级的多组数据）时按块筛，块内只存奇数，划除步长 2p</text>
  <g filter="url(#rough2)"><rect x="40" y="92" width="500" height="110" rx="6" fill="#ffffff" fill-opacity="0.5" stroke="#446688" stroke-width="1.4"/></g>
  <text x="60" y="116" text-anchor="start" font-size="11.5" fill="#446688" filter="url(#rough2)">① 基素数：普通筛出 ≤ √r 的所有素数（≤ 17321）</text>
  <text x="60" y="142" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">② 分块：每块只存奇数 x, x+2, x+4, …</text>
  <text x="60" y="168" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">③ 划除：对基素数 p，从第一个 ≥ l 的 p 的倍数</text>
  <text x="60" y="190" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">    开始，每步 +2p（只落在奇数下标上）</text>
  <g filter="url(#rough2)"><rect x="560" y="92" width="310" height="110" rx="6" fill="#ffffff" fill-opacity="0.5" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="580" y="116" text-anchor="start" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">④ 统计：未被划掉的 x 是素数</text>
  <text x="580" y="142" text-anchor="start" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">    再看 x mod 4 == 1 才计数</text>
  <text x="580" y="168" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">    另外单独特判 x = 2</text>
  <text x="580" y="190" text-anchor="start" font-size="11.5" fill="#666666" filter="url(#rough2)">    块边界用 long long 防溢出</text>
  <g filter="url(#rough2)"><rect x="46" y="230" width="62" height="40" rx="4" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="77" y="256" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">7</text>
  <g filter="url(#rough2)"><rect x="120" y="230" width="62" height="40" rx="4" fill="#f3d9d6" fill-opacity="0.85" stroke="#8a2b28" stroke-width="1.4"/></g>
  <text x="151" y="256" text-anchor="middle" font-size="13" fill="#8a2b28" filter="url(#rough2)">9</text>
  <g filter="url(#rough2)"><line x1="126" y1="276" x2="176" y2="224" stroke="#8a2b28" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="194" y="230" width="62" height="40" rx="4" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="225" y="256" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">11</text>
  <g filter="url(#rough2)"><rect x="268" y="230" width="62" height="40" rx="4" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="299" y="256" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">13</text>
  <g filter="url(#rough2)"><rect x="342" y="230" width="62" height="40" rx="4" fill="#f3d9d6" fill-opacity="0.85" stroke="#8a2b28" stroke-width="1.4"/></g>
  <text x="373" y="256" text-anchor="middle" font-size="13" fill="#8a2b28" filter="url(#rough2)">15</text>
  <g filter="url(#rough2)"><line x1="348" y1="276" x2="398" y2="224" stroke="#8a2b28" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="416" y="230" width="62" height="40" rx="4" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="447" y="256" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">17</text>
  <g filter="url(#rough2)"><rect x="490" y="230" width="62" height="40" rx="4" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="521" y="256" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">19</text>
  <g filter="url(#rough2)"><rect x="564" y="230" width="62" height="40" rx="4" fill="#f3d9d6" fill-opacity="0.85" stroke="#8a2b28" stroke-width="1.4"/></g>
  <text x="595" y="256" text-anchor="middle" font-size="13" fill="#8a2b28" filter="url(#rough2)">21</text>
  <g filter="url(#rough2)"><line x1="570" y1="276" x2="620" y2="224" stroke="#8a2b28" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="638" y="230" width="62" height="40" rx="4" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="669" y="256" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">23</text>
  <g filter="url(#rough2)"><rect x="712" y="230" width="62" height="40" rx="4" fill="#f3d9d6" fill-opacity="0.85" stroke="#8a2b28" stroke-width="1.4"/></g>
  <text x="743" y="256" text-anchor="middle" font-size="13" fill="#8a2b28" filter="url(#rough2)">25</text>
  <g filter="url(#rough2)"><line x1="718" y1="276" x2="768" y2="224" stroke="#8a2b28" stroke-width="1.5"/></g>
  <g filter="url(#rough2)"><rect x="786" y="230" width="62" height="40" rx="4" fill="#f3d9d6" fill-opacity="0.85" stroke="#8a2b28" stroke-width="1.4"/></g>
  <text x="817" y="256" text-anchor="middle" font-size="13" fill="#8a2b28" filter="url(#rough2)">27</text>
  <g filter="url(#rough2)"><line x1="792" y1="276" x2="842" y2="224" stroke="#8a2b28" stroke-width="1.5"/></g>
  <text x="450" y="300" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">示意：[7, 27] 区间内划掉 3、5 的倍数，剩下的 7,11,13,17,19,23 是素数</text>
  <text x="450" y="324" text-anchor="middle" font-size="11.5" fill="#b06a1e" filter="url(#rough2)">其中 ≡ 1 (mod 4) 的是 13、17 → 若问 [7,27] 的答案就是 2</text>
</svg>
