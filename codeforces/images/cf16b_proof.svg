<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">交换论证：低价值盒子让位给高价值盒子</text>
  <path d="M 150 44 Q 360 50 570 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <rect x="90" y="100" width="100" height="90" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="136" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6015" filter="url(#rough2)">5 根</text>
  <text x="140" y="162" text-anchor="middle" font-size="11" fill="#7a5a1b" filter="url(#rough2)">已占背包</text>

  <rect x="300" y="100" width="100" height="90" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="136" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5223" filter="url(#rough2)">10 根</text>
  <text x="350" y="162" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">还没取</text>

  <path d="M 195 120 Q 245 78 295 118" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="245" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#a33a36" filter="url(#rough2)">交换</text>

  <text x="430" y="128" font-size="12" fill="#2b2b2b" filter="url(#rough2)">盒数不变（1 个换 1 个）</text>
  <text x="430" y="156" font-size="12" fill="#2b2b2b" filter="url(#rough2)">总火柴 5 → 10，多了 5 根</text>
  <text x="430" y="184" font-size="12" fill="#2b2b2b" filter="url(#rough2)">所以原方案不可能最优</text>

  <rect x="40" y="240" width="640" height="128" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <g font-size="12" fill="#7a5a1b" filter="url(#rough2)">
    <text x="56" y="270">设某个“最优”解取了低 b 的盒子，却没取某个高 b 的盒子：</text>
    <text x="56" y="298">把前者换成后者 → 背包占用不变、总根数不减，仍是可行解；</text>
    <text x="56" y="326">反复交换，就能得到“按 b 从大到小尽量多取”的最优解，贪心正确。</text>
    <text x="56" y="354">盒子之间只有 b 不同，同一容器内的盒子完全一样。</text>
  </g>
</svg>
