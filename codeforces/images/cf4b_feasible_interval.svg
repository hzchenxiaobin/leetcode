<svg xmlns="http://www.w3.org/2000/svg" width="740" height="430" viewBox="0 0 740 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="a4barr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="740" height="430" fill="#fafafa"/>

  <text x="370" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">总和只能落在 [Σ min, Σ max] 这个区间里</text>
  <path d="M 130 44 Q 370 50 610 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <text x="70" y="72" font-size="12" fill="#555" filter="url(#rough2)">样例 2：d = 2，区间 [0,1] 与 [3,5] ⇒ L = 3，R = 6</text>

  <!-- 合法区间 -->
  <rect x="295" y="224" width="225" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="407" y="247" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">sumTime 必须落在这里</text>
  <line x1="295" y1="224" x2="295" y2="258" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <line x1="520" y1="224" x2="520" y2="258" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="303" y="214" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">L = 3</text>
  <text x="512" y="214" text-anchor="end" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">R = 6</text>

  <!-- 数轴 -->
  <line x1="70" y1="260" x2="678" y2="260" stroke="#2b2b2b" stroke-width="1.7" marker-end="url(#a4barr)" filter="url(#rough2)"/>
  <line x1="70" y1="254" x2="70" y2="266" stroke="#2b2b2b" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="145" y1="254" x2="145" y2="266" stroke="#2b2b2b" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="220" y1="254" x2="220" y2="266" stroke="#2b2b2b" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="295" y1="254" x2="295" y2="266" stroke="#2b2b2b" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="370" y1="254" x2="370" y2="266" stroke="#2b2b2b" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="445" y1="254" x2="445" y2="266" stroke="#2b2b2b" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="520" y1="254" x2="520" y2="266" stroke="#2b2b2b" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="595" y1="254" x2="595" y2="266" stroke="#2b2b2b" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="670" y1="254" x2="670" y2="266" stroke="#2b2b2b" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="286" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="145" y="286" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="220" y="286" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>
  <text x="295" y="286" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">3</text>
  <text x="370" y="286" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4</text>
  <text x="445" y="286" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">5</text>
  <text x="520" y="286" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">6</text>
  <text x="595" y="286" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">7</text>
  <text x="670" y="286" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">8</text>

  <!-- 三个候选 sumTime -->
  <line x1="445" y1="160" x2="445" y2="222" stroke="#446688" stroke-width="1.7" marker-end="url(#a4barr)" filter="url(#rough2)"/>
  <text x="445" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">sumTime = 5 ✓</text>

  <line x1="220" y1="224" x2="220" y2="258" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="212" y="214" text-anchor="end" font-size="12" fill="#8a3b36" filter="url(#rough2)">2 &lt; L → NO</text>

  <line x1="595" y1="224" x2="595" y2="258" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="603" y="214" font-size="12" fill="#8a3b36" filter="url(#rough2)">7 &gt; R → NO</text>

  <!-- 解释 -->
  <rect x="40" y="316" width="660" height="94" rx="10" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="58" y="340" font-size="12" fill="#7a3a35" filter="url(#rough2)">① sumTime &lt; L：每天按最少算都凑不够 → NO</text>
  <text x="58" y="364" font-size="12" fill="#7a3a35" filter="url(#rough2)">② sumTime &gt; R：每天全拉满也不够 → NO</text>
  <text x="58" y="388" font-size="12" fill="#2f5223" filter="url(#rough2)">③ L ≤ sumTime ≤ R：区间内每个整数都能构造出来 → YES</text>
  <text x="410" y="340" font-size="11" fill="#777" filter="url(#rough2)">L = Σ min = 0 + 3 = 3</text>
  <text x="410" y="364" font-size="11" fill="#777" filter="url(#rough2)">R = Σ max = 1 + 5 = 6</text>
</svg>
