<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="760" height="560" fill="#fafafa"/>

  <text x="50" y="70" font-size="12" text-anchor="start" fill="#2f5223" font-weight="bold" filter="url(#rough2)">例 A：先拿背包再来奖品 → 全程非负</text>
  <line x1="60" y1="154" x2="700" y2="154" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="52" y="158" font-size="10.5" text-anchor="end" fill="#777" filter="url(#rough2)">0</text>
  <path d="M 90 154 L 120 137 L 238 103 L 356 120 L 474 137" fill="none" stroke="#2f5223" stroke-width="2.2" filter="url(#rough2)"/>
  <circle cx="90" cy="154" r="4" fill="#2f5223" stroke="none" filter="url(#rough2)"/>
  <circle cx="120" cy="137" r="4" fill="#2f5223" stroke="none" filter="url(#rough2)"/>
  <text x="120" y="127" font-size="10.5" text-anchor="middle" fill="#2f5223" filter="url(#rough2)">k=1</text>
  <circle cx="238" cy="103" r="4" fill="#2f5223" stroke="none" filter="url(#rough2)"/>
  <text x="238" y="93" font-size="10.5" text-anchor="middle" fill="#2f5223" filter="url(#rough2)">+包2</text>
  <circle cx="356" cy="120" r="4" fill="#2f5223" stroke="none" filter="url(#rough2)"/>
  <text x="356" y="110" font-size="10.5" text-anchor="middle" fill="#2f5223" filter="url(#rough2)">−奖品</text>
  <circle cx="474" cy="137" r="4" fill="#2f5223" stroke="none" filter="url(#rough2)"/>
  <text x="474" y="127" font-size="10.5" text-anchor="middle" fill="#2f5223" filter="url(#rough2)">−奖品</text>
  <text x="492" y="141" font-size="11.5" text-anchor="start" fill="#2f5223" filter="url(#rough2)">终点 1 ≥ 0 ✓</text>
  <text x="50" y="215" font-size="12" text-anchor="start" fill="#7a2f2f" font-weight="bold" filter="url(#rough2)">例 B：先来两个奖品（中途欠账），后来大背包</text>
  <line x1="60" y1="299" x2="700" y2="299" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="52" y="303" font-size="10.5" text-anchor="end" fill="#777" filter="url(#rough2)">0</text>
  <path d="M 90 299 L 120 316 L 238 333 L 356 265" fill="none" stroke="#7a2f2f" stroke-width="2.2" filter="url(#rough2)"/>
  <circle cx="90" cy="299" r="4" fill="#7a2f2f" stroke="none" filter="url(#rough2)"/>
  <circle cx="120" cy="316" r="4" fill="#7a2f2f" stroke="none" filter="url(#rough2)"/>
  <text x="108" y="320" font-size="10.5" text-anchor="end" fill="#7a2f2f" filter="url(#rough2)">−奖品</text>
  <circle cx="238" cy="333" r="4" fill="#7a2f2f" stroke="none" filter="url(#rough2)"/>
  <text x="226" y="337" font-size="10.5" text-anchor="end" fill="#7a2f2f" filter="url(#rough2)">−奖品</text>
  <circle cx="356" cy="265" r="4" fill="#7a2f2f" stroke="none" filter="url(#rough2)"/>
  <text x="356" y="255" font-size="10.5" text-anchor="middle" fill="#7a2f2f" filter="url(#rough2)">+包4</text>
  <text x="374" y="269" font-size="11.5" text-anchor="start" fill="#7a2f2f" filter="url(#rough2)">终点 2 ≥ 0 ✓</text>
  <text x="50" y="360" font-size="12" text-anchor="start" fill="#555" font-weight="bold" filter="url(#rough2)">例 C：终点仍然欠账 → 不算成功</text>
  <line x1="60" y1="444" x2="700" y2="444" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="52" y="448" font-size="10.5" text-anchor="end" fill="#777" filter="url(#rough2)">0</text>
  <path d="M 90 444 L 120 461 L 238 478 L 356 461" fill="none" stroke="#555" stroke-width="2.2" filter="url(#rough2)"/>
  <circle cx="90" cy="444" r="4" fill="#555" stroke="none" filter="url(#rough2)"/>
  <circle cx="120" cy="461" r="4" fill="#555" stroke="none" filter="url(#rough2)"/>
  <text x="108" y="465" font-size="10.5" text-anchor="end" fill="#555" filter="url(#rough2)">−奖品</text>
  <circle cx="238" cy="478" r="4" fill="#555" stroke="none" filter="url(#rough2)"/>
  <text x="226" y="482" font-size="10.5" text-anchor="end" fill="#555" filter="url(#rough2)">−奖品</text>
  <circle cx="356" cy="461" r="4" fill="#555" stroke="none" filter="url(#rough2)"/>
  <text x="344" y="465" font-size="10.5" text-anchor="end" fill="#555" filter="url(#rough2)">+包1</text>
  <text x="374" y="465" font-size="11.5" text-anchor="start" fill="#555" filter="url(#rough2)">终点 -1 &lt; 0 ✗</text>
  <text x="50" y="540" font-size="11" text-anchor="start" fill="#2b2b2b" filter="url(#rough2)">状态里把 c 截断到 n：巨大奖品最多 n 个，超过 n 的余量永远够用，截断不改变终点的符号。</text>
  <text x="380.0" y="36" font-size="20" text-anchor="middle" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">容量是一本账：k + Σ背包容量 − 巨大奖品数，看终点是否 ≥ 0</text>
  <path d="M 120 46 Q 380.0 52 640 46" fill="none" stroke="#2b2b2b" stroke-width="1.3" filter="url(#rough2)"/>
</svg>
