<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="400" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">可持久化线段树：version[v] = version[父] + 自己在第 t_v 年的袭击</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">Q(v,t) = 根→v 路径上袭击年份 ≤ t 的个数，O(log m) 查询</text>
  <g filter="url(#rough2)"><rect x="90" y="100" width="150" height="54" rx="4" fill="#f2f2f2" fill-opacity="0.85" stroke="#aaaaaa" stroke-width="1.3"/></g>
  <text x="165" y="124" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">ver[5]</text>
  <text x="165" y="144" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">∅</text>
  <g filter="url(#rough2)"><line x1="244" y1="127" x2="266" y2="127" stroke="#888888" stroke-width="1.4" marker-end="url(#arrb)"/></g>
  <g filter="url(#rough2)"><rect x="270" y="100" width="150" height="54" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="345" y="124" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">ver[2]</text>
  <text x="345" y="144" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">+2</text>
  <g filter="url(#rough2)"><line x1="424" y1="127" x2="446" y2="127" stroke="#888888" stroke-width="1.4" marker-end="url(#arrb)"/></g>
  <g filter="url(#rough2)"><rect x="450" y="100" width="150" height="54" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="525" y="124" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">ver[6]</text>
  <text x="525" y="144" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">+∅</text>
  <g filter="url(#rough2)"><line x1="604" y1="127" x2="626" y2="127" stroke="#888888" stroke-width="1.4" marker-end="url(#arrb)"/></g>
  <g filter="url(#rough2)"><rect x="630" y="100" width="150" height="54" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="705" y="124" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">ver[1]</text>
  <text x="705" y="144" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">+∅</text>
  <text x="420" y="190" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">例如 ver[2] 记录了根→2 路径上所有袭击年份；Q(2,3) = 该版本中 ≤3 的个数</text>
  <g filter="url(#rough2)"><rect x="140" y="216" width="220" height="38" rx="4" fill="#f6d9d7" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="250" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">Q(v,i) − Q(v,y)</text>
  <text x="400" y="240" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">年份落在 (y, i] 的城堡数 ⇒ 不可用数</text>
  <g filter="url(#rough2)"><rect x="140" y="266" width="220" height="38" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="250" y="290" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">depth(v) + 1</text>
  <text x="400" y="290" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">根→v 的城堡总数</text>
  <g filter="url(#rough2)"><rect x="140" y="316" width="220" height="38" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="250" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">F(v)</text>
  <text x="400" y="340" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">两者相减 = 根→v 上的可用数</text>
  <text x="420" y="386" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">路径计数用容斥：F(a) + F(b) − 2F(l) + avail(l)，再扣掉端点</text>
</svg>
