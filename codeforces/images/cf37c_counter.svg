<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="420" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="38" text-anchor="middle" font-size="18.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">37C：按长度升序 + “下一个可用二进制数”</text>
  <path d="M 137 50 Q 380 56 623 50" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="88" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">把词看成 [0,1) 区间里的二进制点：一个词 w 占住整个子树（以 w 为前缀的所有串）。</text>
  <text x="60" y="114" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">所以给长度 L 的词分配“数值最小且不在任何已用子树内”的点：把上一个值左移 (L-上长度)。</text>
  <circle cx="120" cy="150" r="3.5" fill="#2b2b2b" stroke="none" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="120" y="141" text-anchor="middle" font-size="10.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">""</text>
  <circle cx="80" cy="200" r="3.5" fill="#c9801f" stroke="none" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="80" y="191" text-anchor="middle" font-size="10.5" fill="#c9801f" font-weight="normal" filter="url(#rough2)">0</text>
  <circle cx="160" cy="200" r="3.5" fill="#2b2b2b" stroke="none" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="160" y="191" text-anchor="middle" font-size="10.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">1</text>
  <circle cx="60" cy="250" r="3.5" fill="#2b2b2b" stroke="none" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="241" text-anchor="middle" font-size="10.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">00</text>
  <circle cx="100" cy="250" r="3.5" fill="#2b2b2b" stroke="none" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="100" y="241" text-anchor="middle" font-size="10.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">01</text>
  <circle cx="140" cy="250" r="3.5" fill="#2b2b2b" stroke="none" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="140" y="241" text-anchor="middle" font-size="10.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">10</text>
  <circle cx="180" cy="250" r="3.5" fill="#2b2b2b" stroke="none" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="180" y="241" text-anchor="middle" font-size="10.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">11</text>
  <line x1="120" y1="150" x2="80" y2="200" stroke="#9a9a9a" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="120" y1="150" x2="160" y2="200" stroke="#9a9a9a" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="80" y1="200" x2="60" y2="250" stroke="#9a9a9a" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="80" y1="200" x2="100" y2="250" stroke="#9a9a9a" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="160" y1="200" x2="140" y2="250" stroke="#9a9a9a" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="160" y1="200" x2="180" y2="250" stroke="#9a9a9a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="60" y="300" text-anchor="start" font-size="12" fill="#2f4a66" font-weight="normal" filter="url(#rough2)">已选 “0”（橙）⇒ 整个 0 子树都不能再用；下一个长度 2 的词只能取 “10”。</text>
  <rect x="300" y="130" width="400" height="150" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="316" y="158" text-anchor="start" font-size="12.5" fill="#2f5223" font-weight="bold" filter="url(#rough2)">维护 cur = “下一个可用值”的二进制：</text>
  <text x="316" y="184" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">· 新长度 L &gt; 上次：cur 末尾补 (L - 上次) 个 0（左移）</text>
  <text x="316" y="210" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">· 长度相同：cur += 1（二进制进位）</text>
  <text x="316" y="236" text-anchor="start" font-size="12" fill="#b6483f" font-weight="normal" filter="url(#rough2)">· 若 cur 的位数 &gt; L：该长度已无空位 → NO</text>
  <text x="316" y="262" text-anchor="start" font-size="12" fill="#2f4a66" font-weight="normal" filter="url(#rough2)">样例 1：1,2,3 → 0、10、110 ✓</text>
  <text x="60" y="380" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">样例 2：1,1,1 → 0、1、然后进位溢出（长度 1 只有两个串）→ NO。</text>
</svg>
