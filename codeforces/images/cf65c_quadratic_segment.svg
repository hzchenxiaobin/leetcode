<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="67"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>

  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">在一段折线上：可行区间在两根之外，最早点是较大根</text>
  <path d="M 96 44 Q 360 51 624 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 轴 -->
  <line x1="80" y1="250" x2="660" y2="250" stroke="#2b2b2b" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="80" y1="250" x2="80" y2="80" stroke="#2b2b2b" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="672" y="256" font-size="13" fill="#2b2b2b" filter="url(#rough2)">τ = t − ti</text>
  <text x="66" y="76" font-size="13" fill="#2b2b2b" filter="url(#rough2)">q</text>

  <!-- 抛物线（开口向下） -->
  <path d="M 100 92 Q 240 330 380 330 Q 500 330 620 120"
        stroke="#6b5b95" stroke-width="2.4" fill="none" filter="url(#rough2)"/>

  <!-- 两根 -->
  <circle cx="216" cy="250" r="5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="560" cy="250" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="216" y="274" text-anchor="middle" font-size="12" fill="#8a3b37" filter="url(#rough2)">r_lo &lt; 0</text>
  <text x="560" y="274" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">r_hi</text>

  <!-- 段区间 [0, dt] -->
  <line x1="330" y1="250" x2="330" y2="120" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <line x1="620" y1="250" x2="620" y2="120" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <text x="330" y="110" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">τ = 0（段首）</text>
  <text x="620" y="110" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">τ = dt（段尾）</text>

  <!-- 可行区高亮 -->
  <rect x="560" y="250" width="60" height="46" fill="#eef6ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 540 190 Q 552 220 556 246" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="524" y="322" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">q ≤ 0：追得上的一段</text>

  <text x="360" y="356" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">q(τ) = (vs² − vp²)τ² − 2(vs·(e·u) + vp²·ti)τ + (|e|² − vp²·ti²)</text>
  <text x="360" y="382" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">段首已可行就取段首；否则段内最早点就是 r_hi</text>
</svg>
