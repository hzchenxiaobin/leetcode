<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="420" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">样例 1 走查：a = [1, 2, 3, 2, 1]，n = 5，m = 2</text>
  <text x="330" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">先算 D_k = S_k − S*_k（前缀和 − 同长后缀和），再逐条查询平移区间</text>

  <!-- table 1 header -->
  <rect x="80" y="60" width="500" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="78" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">k</text>
  <text x="230" y="78" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">S_k</text>
  <text x="330" y="78" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">S*_k</text>
  <text x="430" y="78" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">D_k</text>
  <text x="530" y="78" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">可选切点？</text>

  <rect x="80" y="86" width="500" height="24" fill="#ffffff" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="130" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="230" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="330" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="430" y="102" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="530" y="102" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 是</text>

  <rect x="80" y="110" width="500" height="24" fill="#ffffff" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="130" y="126" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="230" y="126" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="330" y="126" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="430" y="126" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="530" y="126" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 是</text>

  <rect x="80" y="134" width="500" height="24" fill="#ffffff" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="130" y="150" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="230" y="150" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <text x="330" y="150" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <text x="430" y="150" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="530" y="150" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 是</text>

  <rect x="80" y="158" width="500" height="24" fill="#ffffff" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="130" y="174" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="230" y="174" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>
  <text x="330" y="174" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>
  <text x="430" y="174" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="530" y="174" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 是</text>

  <text x="330" y="200" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">k = 5 时 D_5 = 0 恒成立但不能当切点（k 只取 1..n−1）⇒ g = 4，答案 = C(4, 1) = 4</text>

  <!-- table 2 header -->
  <rect x="80" y="216" width="500" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="234" text-anchor="middle" font-size="12" fill="#a07820" font-weight="bold" filter="url(#rough2)">查询 (i, v)</text>
  <text x="340" y="234" text-anchor="middle" font-size="12" fill="#a07820" font-weight="bold" filter="url(#rough2)">平移区间与位移</text>
  <text x="495" y="234" text-anchor="middle" font-size="12" fill="#a07820" font-weight="bold" filter="url(#rough2)">g</text>
  <text x="558" y="234" text-anchor="middle" font-size="12" fill="#a07820" font-weight="bold" filter="url(#rough2)">答案</text>

  <rect x="80" y="242" width="500" height="24" fill="#ffffff" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="150" y="258" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(3, 0)</text>
  <text x="340" y="258" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">无位移（v = 0，D 全不动）</text>
  <text x="495" y="258" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="558" y="258" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>

  <rect x="80" y="266" width="500" height="24" fill="#ffffff" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="150" y="282" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(2, +1)</text>
  <text x="340" y="282" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">[2, 3] 整体 +1：2 个 0 变坏，0 个 −1 变好</text>
  <text x="495" y="282" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4−2+0 = 2</text>
  <text x="558" y="282" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="80" y="290" width="500" height="26" fill="#ffffff" stroke="#dddddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="150" y="307" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(5, −1)</text>
  <text x="340" y="307" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">i' = 1，σ = −1 故位移 +1：[1, 4] 的 4 个 0 全变坏</text>
  <text x="495" y="307" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4−4+0 = 0</text>
  <text x="558" y="307" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>

  <text x="330" y="340" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">三次输出 4 / 2 / 0 与样例完全一致；第二条查询里 [2,3] 的 D 是 0 → 1，所以 g 从 4 掉到 2</text>
  <text x="330" y="366" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">注意 (5, −1) 的镜像点是 1，区间是 [min, max−1] = [1, 4]；位移是 σv 而非 v（σ = −1）</text>
  <text x="330" y="392" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">查询互相独立：每条都从原始 a 出发，所以只需要预处理好一次 D 的下标表</text>
</svg>
