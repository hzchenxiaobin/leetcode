<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1063"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="300" fill="#fafafa"/>
  <text x="360.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">三项都严格更大才算"过时"</text>
  <path d="M 115.2 42 Q 360.0 48 604.8 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="360.0" y="286" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">存在 j 使 speed / ram / hdd 同时严格更大</text>
  <rect x="40" y="80" width="120" height="90" rx="7" fill="#fbeeee" stroke="#a05a5a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#6b3030" filter="url(#rough2)">1 号</text>
  <text x="100" y="132" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">2100 512 150</text>
  <text x="100" y="156" text-anchor="middle" font-size="11" fill="#8c2f2c" filter="url(#rough2)">过时</text>
  <rect x="176" y="80" width="120" height="90" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="236" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">2 号</text>
  <text x="236" y="132" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">2000 2048 240</text>
  <text x="236" y="156" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">不过时</text>
  <rect x="312" y="80" width="120" height="90" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="372" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">3 号</text>
  <text x="372" y="132" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">2300 1024 200</text>
  <text x="372" y="156" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">不过时</text>
  <rect x="448" y="80" width="120" height="90" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="508" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">4 号</text>
  <text x="508" y="132" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">2500 2048 80</text>
  <text x="508" y="156" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">不过时</text>
  <rect x="584" y="80" width="120" height="90" rx="7" fill="#fbeeee" stroke="#a05a5a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="644" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#6b3030" filter="url(#rough2)">5 号</text>
  <text x="644" y="132" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">2000 512 180</text>
  <text x="644" y="156" text-anchor="middle" font-size="11" fill="#8c2f2c" filter="url(#rough2)">过时</text>
  <line x1="156.0" y1="175.0" x2="172.0" y2="200.0" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <line x1="176.0" y1="175.0" x2="172.0" y2="205.0" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="300" y="215" text-anchor="middle" font-size="11.5" fill="#8c2f2c" filter="url(#rough2)">3 号同时支配 1 号和 5 号：2300&gt;2100/2000，1024&gt;512，200&gt;150/180</text>
  <text x="360" y="250" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">不过时的是 2、3、4 号，价格 350 / 320 / 300 → 选 4 号</text>
  <text x="360" y="278" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">注意：三维分别最大 ≠ 存在一台三项全大</text>
</svg>
