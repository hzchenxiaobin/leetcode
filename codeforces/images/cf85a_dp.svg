<svg xmlns="http://www.w3.org/2000/svg" width="880" height="372" viewBox="0 0 880 372"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="85"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="372" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按列 DP：状态是“被左侧横骨牌占掉的行”</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">mask ∈ [0,16)；一列内用竖骨牌填，或向右伸出横骨牌</text>
  <g filter="url(#rough2)"><rect x="140" y="110" width="82" height="30" rx="2" fill="#ffffff" fill-opacity="0.9" stroke="#99aabb" stroke-width="1.1"/></g>
  <g filter="url(#rough2)"><rect x="140" y="144" width="82" height="30" rx="2" fill="#ffffff" fill-opacity="0.9" stroke="#99aabb" stroke-width="1.1"/></g>
  <g filter="url(#rough2)"><rect x="140" y="178" width="82" height="30" rx="2" fill="#ffffff" fill-opacity="0.9" stroke="#99aabb" stroke-width="1.1"/></g>
  <g filter="url(#rough2)"><rect x="140" y="212" width="82" height="30" rx="2" fill="#ffffff" fill-opacity="0.9" stroke="#99aabb" stroke-width="1.1"/></g>
  <g filter="url(#rough2)"><rect x="236" y="110" width="82" height="30" rx="2" fill="#ffffff" fill-opacity="0.9" stroke="#99aabb" stroke-width="1.1"/></g>
  <g filter="url(#rough2)"><rect x="236" y="144" width="82" height="30" rx="2" fill="#ffffff" fill-opacity="0.9" stroke="#99aabb" stroke-width="1.1"/></g>
  <g filter="url(#rough2)"><rect x="236" y="178" width="82" height="30" rx="2" fill="#ffffff" fill-opacity="0.9" stroke="#99aabb" stroke-width="1.1"/></g>
  <g filter="url(#rough2)"><rect x="236" y="212" width="82" height="30" rx="2" fill="#ffffff" fill-opacity="0.9" stroke="#99aabb" stroke-width="1.1"/></g>
  <g filter="url(#rough2)"><rect x="332" y="110" width="82" height="30" rx="2" fill="#ffffff" fill-opacity="0.9" stroke="#99aabb" stroke-width="1.1"/></g>
  <g filter="url(#rough2)"><rect x="332" y="144" width="82" height="30" rx="2" fill="#ffffff" fill-opacity="0.9" stroke="#99aabb" stroke-width="1.1"/></g>
  <g filter="url(#rough2)"><rect x="332" y="178" width="82" height="30" rx="2" fill="#ffffff" fill-opacity="0.9" stroke="#99aabb" stroke-width="1.1"/></g>
  <g filter="url(#rough2)"><rect x="332" y="212" width="82" height="30" rx="2" fill="#ffffff" fill-opacity="0.9" stroke="#99aabb" stroke-width="1.1"/></g>
  <g filter="url(#rough2)"><rect x="428" y="110" width="82" height="30" rx="2" fill="#ffffff" fill-opacity="0.9" stroke="#99aabb" stroke-width="1.1"/></g>
  <g filter="url(#rough2)"><rect x="428" y="144" width="82" height="30" rx="2" fill="#ffffff" fill-opacity="0.9" stroke="#99aabb" stroke-width="1.1"/></g>
  <g filter="url(#rough2)"><rect x="428" y="178" width="82" height="30" rx="2" fill="#ffffff" fill-opacity="0.9" stroke="#99aabb" stroke-width="1.1"/></g>
  <g filter="url(#rough2)"><rect x="428" y="212" width="82" height="30" rx="2" fill="#ffffff" fill-opacity="0.9" stroke="#99aabb" stroke-width="1.1"/></g>
  <g filter="url(#rough2)"><rect x="236" y="110" width="82" height="30" rx="2" fill="#d7ecd0" fill-opacity="0.8" stroke="#6a9a58" stroke-width="1.2"/></g>
  <g filter="url(#rough2)"><rect x="332" y="110" width="82" height="30" rx="2" fill="#d7ecd0" fill-opacity="0.5" stroke="#6a9a58" stroke-width="1.2"/></g>
  <text x="277.0" y="130" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">横</text>
  <text x="373.0" y="130" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">横</text>
  <text x="277.0" y="102" text-anchor="middle" font-size="10.5" fill="#3d6b2f" filter="url(#rough2)">mask_out 的第 0 位</text>
  <text x="130" y="161" text-anchor="end" font-size="11" fill="#2f4a66" filter="url(#rough2)">mask_in</text>
  <g filter="url(#rough2)"><line x1="74" y1="80" x2="218" y2="80" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)"/></g>
  <text x="150" y="72" text-anchor="middle" font-size="11" fill="#3d6b2f" filter="url(#rough2)">列与列之间传 4 位掩码</text>
  <g filter="url(#rough2)"><rect x="560" y="96" width="290" height="86" rx="4" fill="#d7ecd0" fill-opacity="0.35" stroke="#6a9a58" stroke-width="1.3"/></g>
  <text x="574" y="120" text-anchor="start" font-size="11.5" fill="#2f5223" font-weight="bold" filter="url(#rough2)">列内填充规则</text>
  <text x="574" y="142" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">· 已被 mask_in 占的行跳过</text>
  <text x="574" y="162" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">· 其余行：竖放（成对）或横放（置位）</text>
  <g filter="url(#rough2)"><rect x="560" y="196" width="290" height="86" rx="4" fill="#f6d9d7" fill-opacity="0.35" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="574" y="220" text-anchor="start" font-size="11.5" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">切的条件</text>
  <text x="574" y="242" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">· 前 n-1 列：mask_out ≠ 0（这刀被跨过）</text>
  <text x="574" y="262" text-anchor="start" font-size="11.5" fill="#555555" filter="url(#rough2)">· 第 n 列：mask_out = 0（不能伸出）</text>
  <text x="440" y="330" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">状态只有 16 种，n ≤ 100：O(16² · n) 的可行性 DP 加回溯即可，再贪心染色</text>
</svg>
