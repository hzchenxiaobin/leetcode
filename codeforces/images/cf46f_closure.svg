<svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 0 780 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1601"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="780" height="420" fill="#fafafa"/>
  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">闭包：区域内的钥匙能打开边界的门，就把对面的房间并进来</text>

  <!-- 房间与门 -->
  <circle cx="140" cy="120" r="30" fill="#a8d8a8" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="140" y="126" text-anchor="middle" font-size="12" fill="#204a1e" filter="url(#rough2)">1</text>
  <circle cx="320" cy="120" r="30" fill="#a8d8a8" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="126" text-anchor="middle" font-size="12" fill="#204a1e" filter="url(#rough2)">2</text>
  <circle cx="230" cy="270" r="30" fill="#dbe7fb" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="276" text-anchor="middle" font-size="12" fill="#23405c" filter="url(#rough2)">3</text>
  <circle cx="470" cy="270" r="30" fill="#ffd9b3" stroke="#b06a2c" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="470" y="276" text-anchor="middle" font-size="12" fill="#8a4a14" filter="url(#rough2)">4</text>

  <line x1="165" y1="135" x2="295" y2="135" stroke="#2f5223" stroke-width="3" filter="url(#rough2)"/>
  <text x="230" y="126" text-anchor="middle" font-size="9" fill="#2f5223" filter="url(#rough2)">门2（已开）</text>
  <line x1="150" y1="148" x2="215" y2="245" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="160" y="205" font-size="9" fill="#c0392b" filter="url(#rough2)">门1（锁）</text>
  <line x1="255" y1="148" x2="310" y2="148" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <line x1="330" y1="148" x2="255" y2="245" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="300" y="185" font-size="9" fill="#c0392b" filter="url(#rough2)">门3（锁）</text>
  <line x1="445" y1="255" x2="290" y2="255" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="360" y="246" text-anchor="middle" font-size="9" fill="#c0392b" filter="url(#rough2)">门4（锁）</text>

  <!-- 钥匙标注 -->
  <text x="140" y="160" text-anchor="middle" font-size="9.5" fill="#2f5223" filter="url(#rough2)">A 持 4 号钥匙</text>
  <text x="320" y="160" text-anchor="middle" font-size="9.5" fill="#2f5223" filter="url(#rough2)">B 持 2 号钥匙</text>
  <text x="230" y="310" text-anchor="middle" font-size="9.5" fill="#23405c" filter="url(#rough2)">（空）</text>
  <text x="470" y="312" text-anchor="middle" font-size="9.5" fill="#8a4a14" filter="url(#rough2)">C 持 1、3 号钥匙</text>

  <!-- 区域框 -->
  <rect x="90" y="72" width="280" height="96" rx="14" fill="none" stroke="#2f5223" stroke-width="2" stroke-dasharray="8 5" filter="url(#rough2)"/>
  <text x="230" y="64" text-anchor="middle" font-size="10" fill="#2f5223" filter="url(#rough2)">区域 {1,2}：用 2 号钥匙合并</text>

  <!-- 说明 -->
  <rect x="40" y="336" width="700" height="72" rx="9" fill="#eef4ff" stroke="#446688"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="56" y="360" font-size="11" fill="#23405c" filter="url(#rough2)">规则：门 d=(u,v) 可开 ⟺ "周四持有 d 号钥匙的人" 所在区域包含 u 或 v（他能走到门边）。</text>
  <text x="56" y="382" font-size="11" fill="#23405c" filter="url(#rough2)">反复扫描所有门直到没有合并；钥匙只能在区域内转手，所以区域只增不减。</text>
  <text x="56" y="402" font-size="11" fill="#8c3b37" filter="url(#rough2)">闭包结束后，区域外的门一律打不开——因为区域内所有钥匙都试过了。</text>
</svg>
