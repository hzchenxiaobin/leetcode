<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>

  <rect width="720" height="420" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两条直线的三种相交情况</text>
  <path d="M 200 44 Q 360 50 520 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 相交 -->
  <rect x="25" y="64" width="215" height="170" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="132" y="90" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">det ≠ 0：1 个点</text>
  <line x1="55" y1="200" x2="210" y2="120" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <line x1="60" y1="115" x2="205" y2="205" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="131" cy="159" r="5" fill="#2b2b2b" filter="url(#rough2)"/>
  <text x="132" y="222" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">交点唯一</text>

  <!-- 平行不重合 -->
  <rect x="252" y="64" width="215" height="170" rx="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="359" y="90" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">det = 0，不共线：0 个</text>
  <line x1="275" y1="190" x2="440" y2="130" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <line x1="275" y1="160" x2="440" y2="100" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="359" y="222" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">平行但不在同一条线上</text>

  <!-- 重合 -->
  <rect x="479" y="64" width="215" height="170" rx="12" fill="#fde8e8" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="586" y="90" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a33a36" filter="url(#rough2)">det = 0，共线：-1</text>
  <line x1="505" y1="190" x2="665" y2="130" stroke="#446688" stroke-width="3" filter="url(#rough2)"/>
  <line x1="505" y1="186" x2="665" y2="126" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="586" y="222" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">同一条线，无穷多个交点</text>

  <rect x="25" y="254" width="670" height="130" rx="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <g font-size="11.5" fill="#2f4a66" filter="url(#rough2)">
    <text x="42" y="284">还要处理退化方程：A = B = 0 时，方程变成 0 = -C（或 0 = 0）。</text>
    <text x="42" y="312">C ≠ 0 → 0 = 非零，点集为空；C = 0 → 0 = 0，点集是整个平面（无穷多点）。</text>
    <text x="42" y="340">空集与任何集合的交集都是 0；全平面与直线（或全平面）的交集是无穷多 → -1。</text>
    <text x="42" y="368">系数全部在 [-100,100]，A1·B2 等乘积不超过 10^4，用 int 也不会溢出，但统一用 long long。</text>
  </g>
</svg>
