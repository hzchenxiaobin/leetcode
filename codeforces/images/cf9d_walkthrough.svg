<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="780" height="400" fill="#fafafa"/>
  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">n = 3 的全部 5 棵树：高度 ≥ 2 有 5 棵，高度 ≥ 3 有 4 棵</text>

  <g stroke="#2b2b2b" stroke-width="1.6" filter="url(#rough2)">
    <line x1="90" y1="112" x2="68" y2="158"/><line x1="90" y1="112" x2="112" y2="158"/>
    <line x1="235" y1="100" x2="210" y2="156"/>
    <line x1="210" y1="156" x2="190" y2="212"/>
    <line x1="380" y1="100" x2="355" y2="156"/>
    <line x1="355" y1="156" x2="382" y2="212"/>
    <line x1="525" y1="100" x2="550" y2="156"/>
    <line x1="550" y1="156" x2="523" y2="212"/>
    <line x1="670" y1="100" x2="695" y2="156"/>
    <line x1="695" y1="156" x2="716" y2="212"/>
  </g>
  <g filter="url(#rough2)">
    <circle cx="90" cy="100" r="12" fill="#fce8e6" stroke="#b85450" stroke-width="1.8"/>
    <circle cx="68" cy="170" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="112" cy="170" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="235" cy="88" r="12" fill="#fce8e6" stroke="#b85450" stroke-width="1.8"/>
    <circle cx="210" cy="168" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="190" cy="224" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="380" cy="88" r="12" fill="#fce8e6" stroke="#b85450" stroke-width="1.8"/>
    <circle cx="355" cy="168" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="382" cy="224" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="525" cy="88" r="12" fill="#fce8e6" stroke="#b85450" stroke-width="1.8"/>
    <circle cx="550" cy="168" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="523" cy="224" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="670" cy="88" r="12" fill="#fce8e6" stroke="#b85450" stroke-width="1.8"/>
    <circle cx="695" cy="168" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <circle cx="716" cy="224" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>

  <g font-size="12.5" filter="url(#rough2)" text-anchor="middle">
    <text x="90" y="270" fill="#2f5223">平衡</text>
    <text x="90" y="290" font-size="12" fill="#2f4a66">h = 2</text>
    <text x="235" y="270" fill="#8f3b37">左链</text>
    <text x="235" y="290" font-size="12" fill="#8f3b37">h = 3</text>
    <text x="380" y="270" fill="#8f3b37">左→右</text>
    <text x="380" y="290" font-size="12" fill="#8f3b37">h = 3</text>
    <text x="525" y="270" fill="#8f3b37">右→左</text>
    <text x="525" y="290" font-size="12" fill="#8f3b37">h = 3</text>
    <text x="670" y="270" fill="#8f3b37">右链</text>
    <text x="670" y="290" font-size="12" fill="#8f3b37">h = 3</text>
  </g>

  <line x1="150" y1="120" x2="150" y2="240" stroke="#d0d0d0" stroke-width="1" stroke-dasharray="4 5" filter="url(#rough2)"/>
  <line x1="295" y1="110" x2="295" y2="240" stroke="#d0d0d0" stroke-width="1" stroke-dasharray="4 5" filter="url(#rough2)"/>
  <line x1="440" y1="110" x2="440" y2="240" stroke="#d0d0d0" stroke-width="1" stroke-dasharray="4 5" filter="url(#rough2)"/>
  <line x1="585" y1="110" x2="585" y2="240" stroke="#d0d0d0" stroke-width="1" stroke-dasharray="4 5" filter="url(#rough2)"/>

  <rect x="80" y="318" width="620" height="60" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="96" y="342" font-size="12.5" fill="#8a6015" filter="url(#rough2)">f(3, 2) = 1（只有平衡那棵高度 ≤ 2），f(3, 3) = 5（全部）</text>
  <text x="96" y="366" font-size="12.5" fill="#8a6015" filter="url(#rough2)">所以 h = 2 时答案是 5 − f(3,1) = 5；h = 3 时答案是 5 − f(3,2) = 4</text>
</svg>
