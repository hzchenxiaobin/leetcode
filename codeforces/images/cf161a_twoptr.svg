<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="681"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="290" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">双指针：太小就丢，能穿就配</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">两个数组都非降 ⇒ 丢弃的背心对后面也无用</text>
  <text x="90" y="100" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">士兵 a</text>
  <g filter="url(#rough2)"><rect x="160" y="84" width="70" height="38" rx="3" fill="#cfe0f5" fill-opacity="0.5" stroke="#446688" stroke-width="1.4"/></g>
  <text x="195" y="109" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="250" y="84" width="70" height="38" rx="3" fill="#cfe0f5" fill-opacity="0.5" stroke="#446688" stroke-width="1.4"/></g>
  <text x="285" y="109" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="340" y="84" width="70" height="38" rx="3" fill="#cfe0f5" fill-opacity="0.5" stroke="#446688" stroke-width="1.4"/></g>
  <text x="375" y="109" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="430" y="84" width="70" height="38" rx="3" fill="#cfe0f5" fill-opacity="0.5" stroke="#446688" stroke-width="1.4"/></g>
  <text x="465" y="109" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="520" y="84" width="70" height="38" rx="3" fill="#cfe0f5" fill-opacity="0.5" stroke="#446688" stroke-width="1.4"/></g>
  <text x="555" y="109" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="90" y="170" text-anchor="start" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">背心 b</text>
  <g filter="url(#rough2)"><rect x="160" y="154" width="70" height="38" rx="3" fill="#dcecd2" fill-opacity="0.5" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="195" y="179" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="250" y="154" width="70" height="38" rx="3" fill="#dcecd2" fill-opacity="0.5" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="285" y="179" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="340" y="154" width="70" height="38" rx="3" fill="#dcecd2" fill-opacity="0.5" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="375" y="179" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <text x="620" y="110" text-anchor="start" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">1↔1 ✓</text>
  <text x="620" y="146" text-anchor="start" font-size="11" fill="#666666" filter="url(#rough2)">2 无可用（1 已用）</text>
  <text x="620" y="182" text-anchor="start" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">3↔3 ✓</text>
  <text x="450" y="246" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">x = y = 0 的样例：只有 3 与 4 号士兵能配 ⇒ 2 对</text>
</svg>
