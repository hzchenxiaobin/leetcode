<svg xmlns="http://www.w3.org/2000/svg" width="780" height="470" viewBox="0 0 780 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 8 4.5 L 0 9 z" fill="#8a6a1f"/>
    </marker>
  </defs>

  <rect width="780" height="470" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：一趟压段 + 一趟枚举单元素段</text>
  <path d="M 178 40 Q 390 48 602 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="390" y="56" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">ans 初值取 k 是安全的：若 k 不可达则所有段长都为 1，枚举必给出 ≤ k−1 的候选</text>

  <rect x="60" y="68" width="380" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="76" y="86" font-size="12" fill="#333" filter="url(#rough2)">① 读入 n、s：一趟扫描压成 k 个极大同色段，</text>
  <text x="76" y="103" font-size="12" fill="#333" filter="url(#rough2)">　 记下每段起点 st[j] 与段长 sz[j]</text>

  <path d="M 250 110 L 250 128" stroke="#8a6a1f" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="132" width="380" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="76" y="150" font-size="12" fill="#333" filter="url(#rough2)">② ans ← k</text>
  <text x="76" y="167" font-size="12" fill="#333" filter="url(#rough2)">　 （存在段长 ≥ 2 时，删它一个字符仍是 k 段）</text>

  <path d="M 250 174 L 250 196" stroke="#8a6a1f" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="250,200 410,242 250,284 90,242" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="236" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">sz[j] = 1 且</text>
  <text x="250" y="256" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">唯一字符不在两端？</text>

  <path d="M 410 242 L 456 242" stroke="#8a6a1f" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="426" y="234" font-size="11" fill="#8a3a37" filter="url(#rough2)">否</text>
  <rect x="462" y="220" width="274" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="478" y="238" font-size="11.5" font-weight="bold" fill="#8a3a37" filter="url(#rough2)">continue，看下一个 j</text>
  <text x="478" y="256" font-size="11" fill="#333" filter="url(#rough2)">（段长 ≥ 2 时删了段数不变；两端不许删）</text>

  <path d="M 250 284 L 250 306" stroke="#8a6a1f" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="262" y="300" font-size="11" fill="#3c5e2e" filter="url(#rough2)">是</text>

  <rect x="60" y="310" width="380" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="76" y="330" font-size="12" fill="#333" filter="url(#rough2)">③ cand ← k − 1（这一整段都消失了）</text>
  <text x="76" y="348" font-size="12" fill="#333" filter="url(#rough2)">　 若左右邻段同色则 cand ← k − 2，再 ans ← min(ans, cand)</text>

  <path d="M 250 358 L 250 376" stroke="#8a6a1f" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="380" width="380" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="76" y="406" font-size="12" fill="#333" filter="url(#rough2)">④ 输出 ans</text>

  <rect x="462" y="296" width="274" height="126" rx="8" fill="#fafafa" stroke="#446688" stroke-width="1.4" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="478" y="320" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">为什么只枚举单元素段？</text>
  <text x="478" y="344" font-size="11" fill="#333" filter="url(#rough2)">段长 ≥ 2：删一个，这一段还在</text>
  <text x="478" y="366" font-size="11" fill="#333" filter="url(#rough2)">⇒ 段数恒为 k，已被初值覆盖</text>
  <text x="478" y="390" font-size="11" fill="#333" filter="url(#rough2)">段长 = 1：整段消失，才可能</text>
  <text x="478" y="412" font-size="11" fill="#333" filter="url(#rough2)">⇒ 掉到 k − 1，邻色相同再掉到 k − 2</text>
</svg>
