<svg xmlns="http://www.w3.org/2000/svg" width="780" height="320" viewBox="0 0 780 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="780" height="320" fill="#fafafa"/>
  <text x="390.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">判定的四步：前缀相同 → 周期约束 → lcm 整除 → 数约数</text>
  <path d="M 136.12500000000014 46 Q 390.0 52 643.8749999999999 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60.0" y="60.0" width="660.0" height="52.0" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="76.0" y="92.0" text-anchor="start" font-size="11.6" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">① 取 g = gcd(n₁,n₂)，检查 s₁[0..g−1] == s₂[0..g−1]</text>
  <path d="M 390.0 113.0 L 390.0 124.0" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="60.0" y="124.0" width="660.0" height="52.0" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="76.0" y="156.0" text-anchor="start" font-size="11.6" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">② 求最小正周期 p₁、p₂（KMP）</text>
  <path d="M 390.0 177.0 L 390.0 188.0" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="60.0" y="188.0" width="660.0" height="52.0" rx="9" fill="#fff3d6" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="76.0" y="220.0" text-anchor="start" font-size="11.6" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">③ L = lcm(p₁,p₂)；若 L ∤ g 则答案 0</text>
  <path d="M 390.0 241.0 L 390.0 252.0" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="60.0" y="252.0" width="660.0" height="52.0" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="76.0" y="284.0" text-anchor="start" font-size="11.6" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">④ 答案 = g/L 的约数个数</text>
  <text x="60.0" y="306.0" text-anchor="start" font-size="10.8" fill="#6b6b6b" filter="url(#rough2)">为什么 d 还要是 p 的倍数：t 重复得到 s ⇔ d 是 s 的周期且 d | |s|，而整除 |s| 的周期必为基本周期的倍数。</text>
</svg>
