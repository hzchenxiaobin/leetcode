<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="720" height="420" fill="#fafafa"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">队列永远是「一个残留 + 一段后缀」</text>
  <path d="M 200 43 Q 360 49 520 43" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <rect x="60" y="74" width="88" height="46" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="104" y="103" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a6015" filter="url(#rough2)">x</text>
  <rect x="150" y="74" width="58" height="46" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="179" y="103" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">k+0</text>
  <rect x="212" y="74" width="58" height="46" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="241" y="103" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">k+1</text>
  <rect x="274" y="74" width="58" height="46" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="303" y="103" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">k+2</text>
  <rect x="336" y="74" width="58" height="46" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="365" y="103" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">k+3</text>
  <text x="60" y="138" text-anchor="start" font-size="10.5" fill="#777777" filter="url(#rough2)">x = 队首残留（可能没有），k.. = 还没碰过的后缀</text>
  <rect x="40" y="168" width="196" height="74" rx="7" fill="#e9f4e2" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="138" y="192" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">拿走 x 和 k</text>
  <text x="138" y="216" text-anchor="middle" font-size="10" fill="#3c5e2e" filter="url(#rough2)">→ 无残留，从 k+1 继续</text>
  <rect x="252" y="168" width="196" height="74" rx="7" fill="#e9f4e2" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="350" y="192" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">拿走 x 和 k+1</text>
  <text x="350" y="216" text-anchor="middle" font-size="10" fill="#3c5e2e" filter="url(#rough2)">→ 残留 k，从 k+2 继续</text>
  <rect x="464" y="168" width="196" height="74" rx="7" fill="#e9f4e2" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="562" y="192" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">拿走 k 和 k+1</text>
  <text x="562" y="216" text-anchor="middle" font-size="10" fill="#3c5e2e" filter="url(#rough2)">→ 残留 x，从 k+2 继续</text>
  <rect x="40" y="260" width="620" height="84" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="56" y="286" text-anchor="start" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">dp[残留][下一个未处理] = min（三种选择 + 代价 max(a_i, a_j)）</text>
  <text x="56" y="312" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">状态数 O(n²)，转移 O(1)；n ≤ 1000 时 10^6 级别。</text>
  <text x="56" y="334" text-anchor="start" font-size="11" fill="#777777" filter="url(#rough2)">最后只剩一个时单独服务，代价 a_i，行数恰好 ⌈n/2⌉。</text>
  <text x="40" y="374" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">为什么状态足够：每步只从队首三人里挑两个，剩下那个人必定排在队首，</text>
  <text x="40" y="396" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">后面的人从没被跳过，所以队形永远是「一个残留 + 连续后缀」。</text>
</svg>
