<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="760" height="400" fill="#fafafa"/>

  <rect x="36" y="58" width="340" height="312" rx="8" fill="#ffffff" stroke="#c9d6e4" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="206" y="82" font-size="13" text-anchor="middle" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">① 距离够长：先加速到 v，再匀速</text>
  <line x1="80" y1="318" x2="350" y2="318" stroke="#555" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="80" y1="318" x2="80" y2="96" stroke="#555" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="356" y="322" font-size="13" text-anchor="start" fill="#2b2b2b" filter="url(#rough2)">t</text>
  <text x="70" y="100" font-size="13" text-anchor="end" fill="#2b2b2b" filter="url(#rough2)">v</text>
  <path d="M 80 318 L 175 128 L 300 128 L 300 318 Z" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="300" y1="128" x2="300" y2="318" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <line x1="80" y1="128" x2="300" y2="128" stroke="#b85450" stroke-width="1.1" stroke-dasharray="2 5" filter="url(#rough2)"/>
  <text x="72" y="132" font-size="12" text-anchor="end" fill="#7a2f2f" filter="url(#rough2)">v_i</text>
  <text x="175" y="338" font-size="11" text-anchor="middle" fill="#35507a" filter="url(#rough2)">v_i / a</text>
  <text x="305" y="338" font-size="11" text-anchor="middle" fill="#7a2f2f" filter="url(#rough2)">T_i</text>
  <text x="120" y="250" font-size="11" text-anchor="start" fill="#35507a" filter="url(#rough2)">面积 = d</text>
  <text x="206" y="356" font-size="11.5" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">T = v/a + (d - v²/(2a)) / v</text>
  <rect x="396" y="58" width="330" height="312" rx="8" fill="#ffffff" stroke="#c9d6e4" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="561" y="82" font-size="13" text-anchor="middle" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">② 距离短：没到 v 就到站</text>
  <line x1="430" y1="318" x2="706" y2="318" stroke="#555" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="430" y1="318" x2="430" y2="96" stroke="#555" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="712" y="322" font-size="13" text-anchor="start" fill="#2b2b2b" filter="url(#rough2)">t</text>
  <text x="420" y="100" font-size="13" text-anchor="end" fill="#2b2b2b" filter="url(#rough2)">v</text>
  <path d="M 430 318 L 572 138 L 572 318 Z" fill="#eaf5e6" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="430" y1="138" x2="572" y2="138" stroke="#8a6015" stroke-width="1.1" stroke-dasharray="2 5" filter="url(#rough2)"/>
  <text x="424" y="142" font-size="12" text-anchor="end" fill="#8a6015" filter="url(#rough2)">v_i</text>
  <text x="572" y="338" font-size="11" text-anchor="middle" fill="#2f5223" filter="url(#rough2)">T = √(2d/a)</text>
  <text x="480" y="250" font-size="11" text-anchor="start" fill="#2f5223" filter="url(#rough2)">面积 = d</text>
  <text x="561" y="356" font-size="11.5" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">速度上限没被用满，全程加速</text>
  <text x="380.0" y="36" font-size="20" text-anchor="middle" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">每辆车的自由到站时间：v-t 图下的面积等于 d</text>
  <path d="M 120 46 Q 380.0 52 640 46" fill="none" stroke="#2b2b2b" stroke-width="1.3" filter="url(#rough2)"/>
</svg>
