<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 452" width="800" height="452"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="800" height="452" fill="#fafafa"/>

  <text x="400" y="30" text-anchor="middle" font-size="16.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">走查：样例 5 的区间为空，样例 6 的落点恰好吃满</text>
  <text x="400" y="54" text-anchor="middle" font-size="12" fill="#66788c" filter="url(#rough2)">每个位置都被「只能由谁填」锁死，于是每个元素的方向也锁死：w_i &gt; k 则右移，w_i &lt; k 则左移</text>

  <!-- ===== 样例 5 ===== -->
  <text x="60" y="80" font-size="12.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">样例 5：n = 4，w = [9, 8, 7, 1]</text>
  <rect x="60" y="90" width="150" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="135" y="112" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">位置 1：w = 9</text>
  <text x="135" y="134" text-anchor="middle" font-size="11.5" fill="#33506b" filter="url(#rough2)">要右移 ⇒ k &lt; 9</text>
  <rect x="225" y="90" width="150" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="112" text-anchor="middle" font-size="12" fill="#37662c" filter="url(#rough2)">位置 2：w = 8</text>
  <text x="300" y="134" text-anchor="middle" font-size="11.5" fill="#37662c" filter="url(#rough2)">要左移 ⇒ k &gt; 8</text>
  <rect x="390" y="90" width="150" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="465" y="112" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">位置 3：w = 7</text>
  <text x="465" y="134" text-anchor="middle" font-size="11.5" fill="#33506b" filter="url(#rough2)">要右移 ⇒ k &lt; 7</text>
  <rect x="555" y="90" width="150" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="630" y="112" text-anchor="middle" font-size="12" fill="#37662c" filter="url(#rough2)">位置 4：w = 1</text>
  <text x="630" y="134" text-anchor="middle" font-size="11.5" fill="#37662c" filter="url(#rough2)">要左移 ⇒ k &gt; 1</text>

  <rect x="60" y="162" width="680" height="56" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="400" y="184" text-anchor="middle" font-size="12.5" fill="#a14340" filter="url(#rough2)">位置 2 逼 k &gt; 8，位置 3 逼 k &lt; 7 —— 同时成立要求 8 &lt; k &lt; 7，无解</text>
  <text x="400" y="206" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">用极值表述：mn = min(9, 7) = 7，mx = max(8, 1) = 8，mn − mx = −1 &lt; 2 ⇒ NO（与官方输出一致）</text>

  <!-- ===== 样例 6 ===== -->
  <text x="60" y="242" font-size="12.5" fill="#37662c" font-weight="bold" filter="url(#rough2)">样例 6：n = 6，w = [10⁹, 1, 9, 2, 8, 3]，mn = min(10⁹,9,8) = 8，mx = max(1,2,3) = 3，取 k = 4</text>

  <rect x="122" y="252" width="92" height="28" rx="5" fill="#eef1f5" stroke="#9aa5b1" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="168" y="271" text-anchor="middle" font-size="11.5" fill="#55606b" filter="url(#rough2)">位置 1</text>
  <rect x="222" y="252" width="92" height="28" rx="5" fill="#eef1f5" stroke="#9aa5b1" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="268" y="271" text-anchor="middle" font-size="11.5" fill="#55606b" filter="url(#rough2)">位置 2</text>
  <rect x="322" y="252" width="92" height="28" rx="5" fill="#eef1f5" stroke="#9aa5b1" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="368" y="271" text-anchor="middle" font-size="11.5" fill="#55606b" filter="url(#rough2)">位置 3</text>
  <rect x="422" y="252" width="92" height="28" rx="5" fill="#eef1f5" stroke="#9aa5b1" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="468" y="271" text-anchor="middle" font-size="11.5" fill="#55606b" filter="url(#rough2)">位置 4</text>
  <rect x="522" y="252" width="92" height="28" rx="5" fill="#eef1f5" stroke="#9aa5b1" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="568" y="271" text-anchor="middle" font-size="11.5" fill="#55606b" filter="url(#rough2)">位置 5</text>
  <rect x="622" y="252" width="92" height="28" rx="5" fill="#eef1f5" stroke="#9aa5b1" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="668" y="271" text-anchor="middle" font-size="11.5" fill="#55606b" filter="url(#rough2)">位置 6</text>

  <rect x="122" y="280" width="92" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="168" y="301" text-anchor="middle" font-size="12.5" fill="#33506b" filter="url(#rough2)">10⁹</text>
  <rect x="222" y="280" width="92" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="268" y="301" text-anchor="middle" font-size="12.5" fill="#37662c" filter="url(#rough2)">1</text>
  <rect x="322" y="280" width="92" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="368" y="301" text-anchor="middle" font-size="12.5" fill="#33506b" filter="url(#rough2)">9</text>
  <rect x="422" y="280" width="92" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="468" y="301" text-anchor="middle" font-size="12.5" fill="#37662c" filter="url(#rough2)">2</text>
  <rect x="522" y="280" width="92" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="568" y="301" text-anchor="middle" font-size="12.5" fill="#33506b" filter="url(#rough2)">8</text>
  <rect x="622" y="280" width="92" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="668" y="301" text-anchor="middle" font-size="12.5" fill="#37662c" filter="url(#rough2)">3</text>

  <rect x="122" y="312" width="92" height="30" fill="#fafafa" stroke="#9aa5b1" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="168" y="332" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">w &gt; 4</text>
  <rect x="222" y="312" width="92" height="30" fill="#fafafa" stroke="#9aa5b1" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="268" y="332" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">w &lt; 4</text>
  <rect x="322" y="312" width="92" height="30" fill="#fafafa" stroke="#9aa5b1" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="368" y="332" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">w &gt; 4</text>
  <rect x="422" y="312" width="92" height="30" fill="#fafafa" stroke="#9aa5b1" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="468" y="332" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">w &lt; 4</text>
  <rect x="522" y="312" width="92" height="30" fill="#fafafa" stroke="#9aa5b1" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="568" y="332" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">w &gt; 4</text>
  <rect x="622" y="312" width="92" height="30" fill="#fafafa" stroke="#9aa5b1" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="668" y="332" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">w &lt; 4</text>

  <rect x="122" y="342" width="92" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="168" y="364" text-anchor="middle" font-size="12" fill="#8a6320" filter="url(#rough2)">➜ 2</text>
  <rect x="222" y="342" width="92" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="268" y="364" text-anchor="middle" font-size="12" fill="#8a6320" filter="url(#rough2)">➜ 1</text>
  <rect x="322" y="342" width="92" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="368" y="364" text-anchor="middle" font-size="12" fill="#8a6320" filter="url(#rough2)">➜ 4</text>
  <rect x="422" y="342" width="92" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="468" y="364" text-anchor="middle" font-size="12" fill="#8a6320" filter="url(#rough2)">➜ 3</text>
  <rect x="522" y="342" width="92" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="568" y="364" text-anchor="middle" font-size="12" fill="#8a6320" filter="url(#rough2)">➜ 6</text>
  <rect x="622" y="342" width="92" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="668" y="364" text-anchor="middle" font-size="12" fill="#8a6320" filter="url(#rough2)">➜ 5</text>

  <text x="400" y="404" text-anchor="middle" font-size="12" fill="#37662c" filter="url(#rough2)">落点集合 {2,1,4,3,6,5} = {1,…,6}，每个位置恰好一次，位置 0 与 7 收不到人 ⇒ k = 4 完美</text>
  <text x="400" y="428" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">规律：奇数位元素全都 &gt; k 而右移，偶数位元素全都 &lt; k 而左移，两组必须「整体分离」且至少隔开 1 个整数</text>
</svg>
