<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="153"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L10,4.5 L0,9 z" fill="#2f5223"/>
    </marker>
  </defs>

  <rect width="720" height="380" fill="#fafafa"/>
  <text x="360.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两种 DP：树上 dp0/dp1，环上破环为链</text>
  <path d="M 115.2 42 Q 360.0 48 604.8 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="360.0" y="366" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">先把树汇总成 A/B，再沿环做两状态的链 DP</text>
  <rect x="30" y="62" width="330" height="240" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="195" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">树上：u 与孩子的匹配</text>
  <circle cx="195" cy="130" r="20" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="195" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="#335478" filter="url(#rough2)">u</text>
  <circle cx="112" cy="210" r="20" fill="#fbeadb" stroke="#d98c3f" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="112" y="215" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a5d1c" filter="url(#rough2)">v₁</text>
  <circle cx="195" cy="220" r="20" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="195" y="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#335478" filter="url(#rough2)">v₂</text>
  <circle cx="278" cy="210" r="20" fill="#fbeadb" stroke="#d98c3f" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="278" y="215" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a5d1c" filter="url(#rough2)">v₃</text>
  <text x="195" y="268" text-anchor="middle" font-size="12" fill="#335478" filter="url(#rough2)">dp₀[u] = Σ best[v]</text>
  <text x="195" y="290" text-anchor="middle" font-size="10.5" fill="#335478" filter="url(#rough2)">dp₁[u] = max (dp₀[u] − best[v] + w(u,v) + dp₀[v])</text>
  <rect x="374" y="62" width="316" height="240" rx="10" fill="#ffffff" stroke="#a05a5a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="532" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#6b3030" filter="url(#rough2)">环上：破环为链</text>
  <circle cx="460" cy="136" r="20" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="460" y="141" text-anchor="middle" font-size="13" font-weight="bold" fill="#335478" filter="url(#rough2)">c₀</text>
  <circle cx="604" cy="136" r="20" fill="#fbeadb" stroke="#d98c3f" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="604" y="141" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a5d1c" filter="url(#rough2)">c₁</text>
  <circle cx="604" cy="226" r="20" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="604" y="231" text-anchor="middle" font-size="13" font-weight="bold" fill="#335478" filter="url(#rough2)">c₂</text>
  <circle cx="460" cy="226" r="20" fill="#fbeadb" stroke="#d98c3f" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="460" y="231" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a5d1c" filter="url(#rough2)">c₃</text>
  <text x="532" y="186" text-anchor="middle" font-size="10.5" fill="#8c2f2c" filter="url(#rough2)">wrap 边：分“用/不用”两种情况</text>
  <text x="532" y="268" text-anchor="middle" font-size="11.5" fill="#6b3030" filter="url(#rough2)">状态 = 是否被前一条环边占用</text>
  <text x="532" y="288" text-anchor="middle" font-size="10.5" fill="#6b3030" filter="url(#rough2)">A[c] = Σ best（不连树孩子）</text>
  <rect x="30" y="314" width="660" height="34" rx="8" fill="#f4f4f0" stroke="#8a8a8a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="360" y="336" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">L = 2 特判：两个点之间只有一条无向边，不能当环边算两次</text>
</svg>
