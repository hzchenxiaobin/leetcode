<svg xmlns="http://www.w3.org/2000/svg" width="740" height="380" viewBox="0 0 740 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="61"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="m2" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="740" height="380" fill="#fafafa"/>

  <text x="370" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">关键一步：含环的点双连通分量必须整块收缩</text>
  <path d="M 120 40 Q 370 46 620 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 原图：两个三角形用桥相连 -->
  <text x="140" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a68" filter="url(#rough2)">原图（两个三角形 + 一条桥）</text>
  <polygon points="90,110 140,110 115,155" fill="#fdf0ef" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <polygon points="200,110 250,110 225,155" fill="#fdf0ef" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="140" y1="110" x2="200" y2="110" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="90" cy="110" r="5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="140" cy="110" r="5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="115" cy="155" r="5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="200" cy="110" r="5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="250" cy="110" r="5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="225" cy="155" r="5" fill="#b85450" filter="url(#rough2)"/>
  <text x="170" y="100" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">桥</text>
  <text x="170" y="182" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">n = 6，两个点双各 3 个点</text>

  <!-- 箭头 -->
  <path d="M 290 130 L 350 130" stroke="#446688" stroke-width="2" marker-end="url(#m2)" filter="url(#rough2)"/>
  <text x="320" y="116" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2b4a68" filter="url(#rough2)">每块内部收缩</text>

  <!-- 原子森林 R -->
  <text x="560" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">原子森林 R（只剩桥）</text>
  <circle cx="480" cy="130" r="26" fill="#fdf0ef" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="480" y="135" text-anchor="middle" font-size="12" font-weight="bold" fill="#8c3a37" filter="url(#rough2)">{1,2,3}</text>
  <line x1="506" y1="130" x2="574" y2="130" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="600" cy="130" r="26" fill="#fdf0ef" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="600" y="135" text-anchor="middle" font-size="12" font-weight="bold" fill="#8c3a37" filter="url(#rough2)">{4,5,6}</text>
  <text x="540" y="176" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">两个原子度数都是 1，权重 deg−1 = 0</text>

  <!-- 计算 -->
  <rect x="60" y="200" width="620" height="70" rx="8" fill="#eef3f8" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="224" font-size="12" font-weight="bold" fill="#2b4a68" filter="url(#rough2)">为什么环必须整块收缩：</text>
  <text x="76" y="245" font-size="11.5" fill="#33506b" filter="url(#rough2)">若一个块里有两个点落在同一组，由“组内两点间任意路径都在组内”可推出整块都在该组；</text>
  <text x="76" y="263" font-size="11.5" fill="#33506b" filter="url(#rough2)">若块的顶点全在不同组，块的环投影到商图就是一条无重边的闭合游走，而商图是树，矛盾。</text>

  <!-- 结论 -->
  <rect x="60" y="288" width="620" height="72" rx="8" fill="#f4f8ee" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="312" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">于是本题的答案公式（R 的每棵树单独算）：</text>
  <text x="76" y="334" font-size="12" fill="#3c5e2e" filter="url(#rough2)">组数 = 2 + max_路径 Σ(deg − 1)，操作数 = n − Σ 组数 + (连通块数 − 1)</text>
  <text x="76" y="354" font-size="11" fill="#3c5e2e" filter="url(#rough2)">本例：每棵 R 树只有 1 个点，组数 1，两组 → 6 − 2 + 0 = 4 次操作</text>
</svg>
