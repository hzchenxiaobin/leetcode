<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="353"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="280" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">倍增：先预处理 T_{2^p}，再从高位到低位「试加」</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">长度上限只会放宽 ⇒ 谓词单调</text>
  <g filter="url(#rough2)"><rect x="70" y="96" width="130" height="56" rx="5" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="135" y="122" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">T₁</text>
  <text x="135" y="142" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">长度 ≤ 1</text>
  <g filter="url(#rough2)"><rect x="230" y="96" width="130" height="56" rx="5" fill="#f6e3c4" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="295" y="122" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">T₂</text>
  <text x="295" y="142" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">≤ 2</text>
  <g filter="url(#rough2)"><line x1="204" y1="124" x2="224" y2="124" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)"/></g>
  <g filter="url(#rough2)"><rect x="390" y="96" width="130" height="56" rx="5" fill="#dcecd2" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="455" y="122" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">T₄</text>
  <text x="455" y="142" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">≤ 4</text>
  <g filter="url(#rough2)"><line x1="364" y1="124" x2="384" y2="124" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)"/></g>
  <g filter="url(#rough2)"><rect x="550" y="96" width="130" height="56" rx="5" fill="#f3d9d6" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="615" y="122" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">T₈</text>
  <text x="615" y="142" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">≤ 8</text>
  <g filter="url(#rough2)"><line x1="524" y1="124" x2="544" y2="124" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)"/></g>
  <g filter="url(#rough2)"><rect x="710" y="96" width="130" height="56" rx="5" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="775" y="122" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">T₁₆</text>
  <text x="775" y="142" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">≤ 16</text>
  <g filter="url(#rough2)"><line x1="684" y1="124" x2="704" y2="124" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)"/></g>
  <text x="450" y="196" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">贪心：若 R ⊗ T_{2^p} 仍无正对角项，就接受这一块（len += 2^p）</text>
  <text x="450" y="228" text-anchor="middle" font-size="12" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">结束时 len 是「仍无正环」的最大长度，答案 = len + 1（&gt; n 则输出 0）</text>
  <text x="450" y="258" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">复杂度 O(n³ log n)，n = 300 时约 20 次乘法</text>
</svg>
