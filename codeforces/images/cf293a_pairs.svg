<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="501"/>
    <feDisplacementMap in="SourceGraphic" scale="1.5"/></filter></defs>
  <rect width="700" height="300" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每位只有 4 种"归属"：(s_i, t_i)</text>
  <path d="M 140 40 Q 350 46 560 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="60" y="58" width="130" height="56" rx="6" fill="#e8f4e0" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="205" y="58" width="150" height="56" rx="6" fill="#dfeafc" stroke="#446688" stroke-width="1.4"/>
    <rect x="370" y="58" width="150" height="56" rx="6" fill="#fbeeee" stroke="#b85450" stroke-width="1.4"/>
    <rect x="535" y="58" width="105" height="56" rx="6" fill="#f4f4f4" stroke="#888" stroke-width="1.4"/>
  </g>
  <g font-size="12" text-anchor="middle" filter="url(#rough2)">
    <text x="125" y="82" fill="#2f5223">11</text><text x="125" y="102" fill="#2f5223">谁拿都得 1 分</text>
    <text x="280" y="82" fill="#22314a">10</text><text x="280" y="102" fill="#22314a">先手拿得 1，后手拿等于"废掉"</text>
    <text x="445" y="82" fill="#8a3a36">01</text><text x="445" y="102" fill="#8a3a36">后手拿得 1，先手拿等于"废掉"</text>
    <text x="587" y="82" fill="#555">00</text><text x="587" y="102" fill="#555">废位</text>
  </g>
  <g filter="url(#rough2)"><rect x="60" y="128" width="580" height="66" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="76" y="152" font-size="12.5" fill="#8a6015" filter="url(#rough2)">比大小：两人都是 n 位二进制 ⇒ 数字大小 = 1 的个数多少（排好序后逐位比）。</text>
  <text x="76" y="176" font-size="12.5" fill="#8a6015" filter="url(#rough2)">所以目标就是"让自己的 1 尽量多、对方的 1 尽量少"。</text>
  <g filter="url(#rough2)"><rect x="60" y="206" width="580" height="76" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="230" font-size="12.5" fill="#2f5223" filter="url(#rough2)">贪心（轮到谁谁做）：先拿 11（自己 +1）；否则拿"自己的 1x"（+1）；</text>
  <text x="76" y="254" font-size="12.5" fill="#2f5223" filter="url(#rough2)">否则拿"对方的 1x"（废掉对方的 +1）；否则拿 00。</text>
  <text x="76" y="276" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">最后比较双方 1 的个数：多者 First，少者 Second，相等 Draw。</text>
</svg>
