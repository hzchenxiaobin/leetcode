<svg xmlns="http://www.w3.org/2000/svg" width="740" height="270" viewBox="0 0 740 270"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="121"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="740" height="270" fill="#fafafa"/>
  <text x="370" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2 18 2：q = 9，枚举 X</text>
  <g font-size="13" filter="url(#rough2)">
    <rect x="50" y="60" width="80" height="58" rx="8" fill="#f4f6f9" stroke="#8a94a6" stroke-width="1.6"/>
    <text x="90" y="84" text-anchor="middle" font-size="12" fill="#2b2b2b">X=0</text>
    <text x="90" y="106" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66">0</text>
    <rect x="150" y="60" width="80" height="58" rx="8" fill="#f4f6f9" stroke="#8a94a6" stroke-width="1.6"/>
    <text x="190" y="84" text-anchor="middle" font-size="12" fill="#2b2b2b">X=1</text>
    <text x="190" y="106" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66">1</text>
    <rect x="250" y="60" width="80" height="58" rx="8" fill="#f4f6f9" stroke="#8a94a6" stroke-width="1.6"/>
    <text x="290" y="84" text-anchor="middle" font-size="12" fill="#2b2b2b">X=2</text>
    <text x="290" y="106" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66">4</text>
    <rect x="350" y="60" width="80" height="58" rx="8" fill="#eef4ec" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="390" y="84" text-anchor="middle" font-size="12" fill="#2b2b2b">X=3</text>
    <text x="390" y="106" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66">9 ✓</text>
    <rect x="450" y="60" width="80" height="58" rx="8" fill="#f4f6f9" stroke="#8a94a6" stroke-width="1.6"/>
    <text x="490" y="84" text-anchor="middle" font-size="12" fill="#2b2b2b">X=4</text>
    <text x="490" y="106" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66">16</text>
    <rect x="550" y="60" width="80" height="58" rx="8" fill="#f4f6f9" stroke="#8a94a6" stroke-width="1.6"/>
    <text x="590" y="84" text-anchor="middle" font-size="12" fill="#2b2b2b">…</text>
    <text x="590" y="106" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66"></text>
  </g>
  <rect x="80" y="150" width="580" height="60" rx="9" fill="#eef4ec" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="96" y="174" font-size="12.5" fill="#2f5223" filter="url(#rough2)">X³ 的值：0, 1, 8, 27（X=3）→ 第一次等于 q 的是 X = 3。</text>
  <text x="96" y="196" font-size="12.5" fill="#2f5223" filter="url(#rough2)">若 q 为负，非负枚举失败后再从 -1 往下试。</text>
  <text x="370" y="244" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">输出 3；2·3² = 18 ✓（-3 也满足，输出任意一个）。</text>
</svg>
