<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M 0 0 L 8 3 L 0 6 z" fill="#7a8fa6"/>
    </marker>
  </defs>

  <rect width="720" height="440" fill="#fafafa"/>

  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">走查样例 4：a = [5, 2]，T = 3 可行</text>
  <text x="360" y="48" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">物品 2², 2¹, 2⁰ 对应第 1、2、3 秒是否选中</text>

  <g filter="url(#rough2)">
    <rect x="24" y="66" width="120" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" rx="18"/>
    <text x="84" y="90" text-anchor="middle" font-size="12.5" fill="#333">2² = 4</text>
    <rect x="24" y="118" width="120" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" rx="18"/>
    <text x="84" y="142" text-anchor="middle" font-size="12.5" fill="#333">2¹ = 2</text>
    <rect x="24" y="170" width="120" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" rx="18"/>
    <text x="84" y="194" text-anchor="middle" font-size="12.5" fill="#333">2⁰ = 1</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="440" y="62" width="256" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
    <text x="456" y="84" font-size="11.5" fill="#333">箱子 a = 5</text>
    <text x="456" y="104" font-size="9.6" fill="#666">得到 4 + 1 = 5 ≥ 5 ✓</text>

    <rect x="440" y="150" width="256" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="456" y="172" font-size="11.5" fill="#333">箱子 a = 2</text>
    <text x="456" y="192" font-size="9.6" fill="#666">得到 2 ≥ 2 ✓</text>
  </g>

  <path d="M 148 85 L 436 90" stroke="#7a8fa6" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 148 137 L 436 178" stroke="#7a8fa6" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 148 189 C 300 240 400 110 436 96" stroke="#b85450" stroke-width="1.7" stroke-dasharray="6 4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="24" y="232" width="672" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <text x="44" y="252" font-size="10.5" font-weight="bold" fill="#333">秒 t</text>
    <text x="190" y="252" font-size="10.5" font-weight="bold" fill="#333">选中的 p</text>
    <text x="360" y="252" font-size="10.5" font-weight="bold" fill="#333">状态变化</text>
    <text x="600" y="252" font-size="10.5" font-weight="bold" fill="#333">谁攒到了什么</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="24" y="266" width="672" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.4" rx="6"/>
    <text x="44" y="287" font-size="10.5" fill="#333">t = 1</text>
    <text x="190" y="287" font-size="10.5" fill="#333">p = 1</text>
    <text x="360" y="287" font-size="10.5" fill="#333">[5, 2] → [2, 1]</text>
    <text x="600" y="287" font-size="10.5" fill="#4a7a3a">元素 1 拿到权 4</text>

    <rect x="24" y="302" width="672" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.4" rx="6"/>
    <text x="44" y="323" font-size="10.5" fill="#333">t = 2</text>
    <text x="190" y="323" font-size="10.5" fill="#333">p = 2</text>
    <text x="360" y="323" font-size="10.5" fill="#333">[2, 1] → [1, 0]</text>
    <text x="600" y="323" font-size="10.5" fill="#4a7a3a">元素 2 拿到权 2 ✓ 归零</text>

    <rect x="24" y="338" width="672" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1.4" rx="6"/>
    <text x="44" y="359" font-size="10.5" fill="#333">t = 3</text>
    <text x="190" y="359" font-size="10.5" fill="#333">p = 1</text>
    <text x="360" y="359" font-size="10.5" fill="#333">[1, 0] → [0, 0]</text>
    <text x="600" y="359" font-size="10.5" fill="#b85450">元素 1 拿到权 1，共 5 ✓</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="24" y="382" width="672" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="9"/>
    <text x="40" y="401" font-size="10.5" fill="#333">注意：不能「每个元素只选一次」—— 那只给每个需求分一件物品，[5, 2] 需要 4 秒；允许一个箱子拿多件后才只要 3 秒。</text>
    <text x="40" y="418" font-size="10" fill="#666">（与官方 Note 的构造完全一致：[5,2] → [2,1] → [1,0] → [0,0]）</text>
  </g>
</svg>
