<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="211"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">187A 样例 3：p 的最长可保留前缀是 &quot;1 5&quot;（在 q 中保序出现）</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="60.0" y="96.0" text-anchor="start" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">p = 1 5 2 3 4</text>
  <text x="60.0" y="132.0" text-anchor="start" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">q = 1 2 3 4 5</text>
  <text x="60.0" y="176.0" text-anchor="start" font-size="11.5" fill="#555" filter="url(#rough2)">pos in q：1→1，5→5，2→2（5 在 2 之后，前缀断在 3）</text>
  <rect x="60.0" y="214.0" width="600.0" height="70.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="74.0" y="237.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">保留前缀 p[0..k-1] 必须是 q 的子序列</text>
  <text x="74.0" y="261.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">k=2 时 p[0..1]=&quot;1 5&quot; 是 q 的子序列 → 答案 n-k=3</text>
  <rect x="60.0" y="300.0" width="600.0" height="70.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="74.0" y="323.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">k=3 时 &quot;1 5 2&quot; 不是 q 的子序列（2 在 5 前面）→ 不能保留 3 个</text>
</svg>
