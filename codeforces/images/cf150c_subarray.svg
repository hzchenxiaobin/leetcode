<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="445"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="300" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">每位乘客 = 区间上的最大子段和</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">g_i = (x_{i+1}−x_i)/2 − c·p_i/100</text>
  <text x="450" y="100" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">g₁ = −5　　g₂ = 45</text>
  <g filter="url(#rough2)"><rect x="160" y="124" width="260" height="56" rx="5" fill="#f3d9d6" fill-opacity="0.85" stroke="#8a2b28" stroke-width="1.4"/></g>
  <text x="290" y="158" text-anchor="middle" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">段 1：5 − 10 = −5</text>
  <g filter="url(#rough2)"><rect x="480" y="124" width="260" height="56" rx="5" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="610" y="158" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">段 2：45 − 0 = 45</text>
  <text x="450" y="214" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">乘客 (1,3)：max(0, −5, 45, 40) = 45</text>
  <text x="450" y="248" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">总收益 = 0 + 45 + 45 = 90</text>
  <text x="450" y="280" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">线段树维护 (sum, pref, suff, best) ⇒ 每次查询 O(log n)</text>
</svg>
