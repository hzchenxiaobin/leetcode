<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 332" width="640" height="332">
<defs>
<filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="13" result="noise"/>
<feDisplacementMap in="SourceGraphic" in2="noise" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect x="0" y="0" width="640" height="332" fill="#fafafa"/>
<g font-family="Comic Sans MS, Kaiti SC, cursive">
<text x="320.0" y="24.0" font-size="15" fill="#33475b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">带内：并集长度 L(x) 是端点一次函数的线性组合</text>
<rect x="120.0" y="80.0" width="140.0" height="34.0" rx="6" fill="#f6d9b0" stroke="#7a93a8" stroke-width="1.6" filter="url(#rough2)"/>
<text x="190.0" y="102.0" font-size="12" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">R1</text>
<rect x="200.0" y="80.0" width="140.0" height="34.0" rx="6" fill="#cfe3d4" stroke="#7a93a8" stroke-width="1.6" filter="url(#rough2)"/>
<text x="270.0" y="102.0" font-size="12" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">R2</text>
<rect x="300.0" y="80.0" width="120.0" height="34.0" rx="6" fill="#d8d3ec" stroke="#7a93a8" stroke-width="1.6" filter="url(#rough2)"/>
<text x="360.0" y="102.0" font-size="12" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">R3</text>
<line x1="80.0" y1="140.0" x2="560.0" y2="140.0" stroke="#555" stroke-width="1.6" filter="url(#rough2)"/>
<text x="320.0" y="162.0" font-size="11" fill="#555" text-anchor="middle" font-weight="normal" filter="url(#rough2)">0</text>
<text x="540.0" y="162.0" font-size="12" fill="#555" text-anchor="middle" font-weight="normal" filter="url(#rough2)">y</text>
<rect x="120.0" y="180.0" width="300.0" height="30.0" rx="6" fill="#f3c9c9" stroke="#b05a5a" stroke-width="1.8" filter="url(#rough2)"/>
<text x="270.0" y="200.0" font-size="12" fill="#a04a4a" text-anchor="middle" font-weight="normal" filter="url(#rough2)">并集长度 L = 300 − 120 = 180</text>
<text x="320.0" y="238.0" font-size="12" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">L(x) = Σ s_k·e_k(x)：s_k 由「端点排序 + 覆盖层数」决定，带内固定</text>
<rect x="120.0" y="258.0" width="400.0" height="58.0" rx="10" fill="#eef4fb" stroke="#7a93a8" stroke-width="1.6" filter="url(#rough2)"/>
<text x="320.0" y="282.0" font-size="14" fill="#4a6a8a" text-anchor="middle" font-weight="normal" filter="url(#rough2)">∫_{X_k}^{X_{k+1}} L dx = L(中点) × 带宽</text>
<text x="320.0" y="304.0" font-size="11" fill="#4a6a8a" text-anchor="middle" font-weight="normal" filter="url(#rough2)">（一次函数在区间上的积分 = 中点值 × 宽度）</text>
</g>
</svg>
