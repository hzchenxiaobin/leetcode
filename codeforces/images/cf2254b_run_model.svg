<svg xmlns="http://www.w3.org/2000/svg" width="780" height="470" viewBox="0 0 780 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 8 4.5 L 0 9 z" fill="#8a6a1f"/>
    </marker>
  </defs>

  <rect width="780" height="470" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">删一个字符，压缩长度只会是 k、k−1 或 k−2</text>
  <path d="M 132 40 Q 390 48 648 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="390" y="58" text-anchor="middle" font-size="12" fill="#66788c" filter="url(#rough2)">先压成极大同色段（同一字母用同一种颜色），再只看被删字符所在的那一段</text>

  <text x="44" y="84" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">① 所在段长 ≥ 2：删一个还剩 ≥ 1 个，这一段没有消失</text>
  <rect x="44" y="92" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="62" y="112" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <rect x="80" y="92" width="36" height="30" rx="4" fill="#e6f4ea" stroke="#b85450" stroke-width="2.2" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="98" y="112" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>
  <path d="M 84 96 L 112 118 M 112 96 L 84 118" stroke="#b85450" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <rect x="116" y="92" width="36" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="134" y="112" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>
  <rect x="152" y="92" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="112" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <path d="M 44 124 L 44 131 L 80 131 L 80 124" stroke="#66788c" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 80 124 L 80 131 L 152 131 L 152 124" stroke="#66788c" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 152 124 L 152 131 L 188 131 L 188 124" stroke="#66788c" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="62" y="148" text-anchor="middle" font-size="10" fill="#66788c" filter="url(#rough2)">段1</text>
  <text x="116" y="148" text-anchor="middle" font-size="10" fill="#66788c" filter="url(#rough2)">段2</text>
  <text x="170" y="148" text-anchor="middle" font-size="10" fill="#66788c" filter="url(#rough2)">段3</text>

  <path d="M 196 107 L 232 107" stroke="#8a6a1f" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="244" y="92" width="32" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="112" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="276" y="92" width="32" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="292" y="112" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <rect x="308" y="92" width="32" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="324" y="112" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <text x="350" y="112" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">|f| = 3 = k</text>
  <text x="470" y="100" font-size="11.5" fill="#333" filter="url(#rough2)">被删字符所在段长 ≥ 2</text>
  <text x="470" y="122" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">⇒ 段数不变，答案还是 k</text>

  <text x="44" y="184" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">② 单元素段，左右邻居异色：整段消失，但不合并</text>
  <rect x="44" y="192" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="62" y="212" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <rect x="80" y="192" width="36" height="30" rx="4" fill="#e6f4ea" stroke="#b85450" stroke-width="2.2" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="98" y="212" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>
  <path d="M 84 196 L 112 218 M 112 196 L 84 218" stroke="#b85450" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <rect x="116" y="192" width="36" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="134" y="212" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">c</text>
  <rect x="152" y="192" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="212" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <path d="M 44 224 L 44 231 L 80 231 L 80 224" stroke="#66788c" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 80 224 L 80 231 L 116 231 L 116 224" stroke="#66788c" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 116 224 L 116 231 L 152 231 L 152 224" stroke="#66788c" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 152 224 L 152 231 L 188 231 L 188 224" stroke="#66788c" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="62" y="248" text-anchor="middle" font-size="10" fill="#66788c" filter="url(#rough2)">段1</text>
  <text x="98" y="248" text-anchor="middle" font-size="10" fill="#66788c" filter="url(#rough2)">段2</text>
  <text x="134" y="248" text-anchor="middle" font-size="10" fill="#66788c" filter="url(#rough2)">段3</text>
  <text x="170" y="248" text-anchor="middle" font-size="10" fill="#66788c" filter="url(#rough2)">段4</text>

  <path d="M 196 207 L 232 207" stroke="#8a6a1f" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="244" y="192" width="32" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="212" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="276" y="192" width="32" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="292" y="212" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>
  <rect x="308" y="192" width="32" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="324" y="212" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <text x="350" y="212" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">|f| = 3 = k−1</text>
  <text x="470" y="200" font-size="11.5" fill="#333" filter="url(#rough2)">单元素段整段消失</text>
  <text x="470" y="222" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">邻居 a、c 异色 ⇒ 只少一段</text>

  <text x="44" y="284" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">③ 单元素段，左右邻居同色：消失 + 两侧合并，一次掉两段</text>
  <rect x="44" y="292" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="62" y="312" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <rect x="80" y="292" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="98" y="312" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <rect x="116" y="292" width="36" height="30" rx="4" fill="#e6f4ea" stroke="#b85450" stroke-width="2.2" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="134" y="312" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>
  <path d="M 120 296 L 148 318 M 148 296 L 120 318" stroke="#b85450" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <rect x="152" y="292" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="312" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <rect x="188" y="292" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="206" y="312" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <path d="M 44 324 L 44 331 L 116 331 L 116 324" stroke="#66788c" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 116 324 L 116 331 L 152 331 L 152 324" stroke="#66788c" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 152 324 L 152 331 L 224 331 L 224 324" stroke="#66788c" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="80" y="348" text-anchor="middle" font-size="10" fill="#66788c" filter="url(#rough2)">段1</text>
  <text x="134" y="348" text-anchor="middle" font-size="10" fill="#66788c" filter="url(#rough2)">段2</text>
  <text x="188" y="348" text-anchor="middle" font-size="10" fill="#66788c" filter="url(#rough2)">段3</text>

  <path d="M 232 307 L 268 307" stroke="#8a6a1f" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="280" y="292" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="298" y="312" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <text x="330" y="312" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">|f| = 1 = k−2</text>
  <text x="470" y="300" font-size="11.5" fill="#333" filter="url(#rough2)">单元素段消失，两侧同为 a</text>
  <text x="470" y="322" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">⇒ 合并，一次掉两段</text>

  <rect x="36" y="366" width="708" height="94" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="52" y="390" font-size="13" font-weight="bold" fill="#8a6a1f" filter="url(#rough2)">于是答案只能是三个值：ans = min( k , 各可删单元素段的候选 )</text>
  <text x="52" y="414" font-size="11.5" fill="#333" filter="url(#rough2)">候选 = k − 1 − [ 左右邻段同色 ]，前提是该段长恰为 1 且它的唯一字符不在两端</text>
  <text x="52" y="438" font-size="11.5" font-weight="bold" fill="#8a3a37" filter="url(#rough2)">注意：段 1 的唯一字符就是 s_1、段 k 的唯一字符就是 s_n —— 它们都不能删，必须跳过</text>
</svg>
