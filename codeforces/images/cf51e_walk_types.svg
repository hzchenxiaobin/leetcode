<svg xmlns="http://www.w3.org/2000/svg" width="740" height="400" viewBox="0 0 740 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="740" height="400" fill="#fafafa"/>

  <text x="370" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">长度 5 的闭合游走：按不同顶点个数分类</text>
  <path d="M 170 42 Q 370 48 570 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 面板 A：5 个不同顶点 -->
  <rect x="26" y="60" width="222" height="250" rx="8" fill="#eef3f8" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="137" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a68" filter="url(#rough2)">5 个不同顶点</text>
  <polygon points="137,104 190,142 170,204 104,204 84,142" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="137" cy="104" r="5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="190" cy="142" r="5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="170" cy="204" r="5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="104" cy="204" r="5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="84" cy="142" r="5" fill="#446688" filter="url(#rough2)"/>
  <text x="137" y="234" text-anchor="middle" font-size="11.5" fill="#2b4a68" filter="url(#rough2)">就是真正的五元环</text>
  <text x="137" y="254" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b4a68" filter="url(#rough2)">每个环 10 个序列</text>
  <text x="137" y="274" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">（5 个起点 × 2 个方向）</text>
  <text x="137" y="296" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">目标：数这些</text>

  <!-- 面板 B：4 个不同顶点 -->
  <rect x="258" y="60" width="222" height="250" rx="8" fill="#fdf0ef" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="369" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#8c3a37" filter="url(#rough2)">4 个不同顶点</text>
  <polygon points="345,120 405,160 330,196" fill="#ffffff" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="345" cy="120" r="5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="405" cy="160" r="5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="330" cy="196" r="5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="272" cy="120" r="5" fill="#d6a040" filter="url(#rough2)"/>
  <path d="M 278 126 L 338 158" stroke="#b85450" stroke-width="1.6" marker-end="url(#ar)" filter="url(#rough2)"/>
  <path d="M 338 164 L 280 134" stroke="#b85450" stroke-width="1.6" marker-end="url(#ar)" filter="url(#rough2)"/>
  <text x="369" y="220" text-anchor="middle" font-size="11.5" fill="#8c3a37" filter="url(#rough2)">三角形 + 一条被来回走的“挂边”</text>
  <text x="369" y="240" text-anchor="middle" font-size="11.5" fill="#8c3a37" filter="url(#rough2)">形状：a-b-a-c-d-a</text>
  <text x="369" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#8c3a37" filter="url(#rough2)">共 10 · Σ T_a(deg_a − 2) 个</text>
  <text x="369" y="284" text-anchor="middle" font-size="11" fill="#8c3a37" filter="url(#rough2)">T_a：过 a 的三角形数；b 有 deg_a − 2 种</text>

  <!-- 面板 C：3 个不同顶点 -->
  <rect x="490" y="60" width="224" height="250" rx="8" fill="#fdf6e6" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="602" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">3 个不同顶点</text>
  <polygon points="602,112 662,166 542,166" fill="#ffffff" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="602" cy="112" r="5" fill="#d6a040" filter="url(#rough2)"/>
  <circle cx="662" cy="166" r="5" fill="#d6a040" filter="url(#rough2)"/>
  <circle cx="542" cy="166" r="5" fill="#d6a040" filter="url(#rough2)"/>
  <text x="602" y="196" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">顶点集必须构成三角形</text>
  <text x="602" y="216" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">（奇数长闭合游走必有奇环）</text>
  <text x="602" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">每个三角形恰好 30 个</text>
  <text x="602" y="262" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">= 三角形内的全部长度 5 闭合游走</text>
  <text x="602" y="284" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">K3 的特征值 2, −1, −1 → 30</text>

  <rect x="60" y="328" width="620" height="52" rx="8" fill="#ffffff" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="370" y="350" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">tr(A⁵) 把三类一起数了：C₅ 环 10 份、4 顶点型 10·ΣT_a(deg_a−2) 份、3 顶点型 30·(三角形数) 份</text>
  <text x="370" y="370" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">把后两类减掉再除以 10 就是答案；它们可以合并成 10·ΣT_a(deg_a−1)</text>
</svg>
