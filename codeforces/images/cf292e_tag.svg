<svg xmlns="http://www.w3.org/2000/svg" width="880" height="270" viewBox="0 0 880 270"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="270" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">惰性标记：最后一次覆盖</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">线段树（区间赋值、单点查询）</text>
  <text x="150" y="105" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">a 永远不变，b 只被"从 a 拷贝"覆盖</text>
  <text x="150" y="145" text-anchor="start" font-size="12" fill="#2f4a66" filter="url(#rough2)">对每个位置记"最后一次覆盖它的拷贝编号"，区间赋值 + 单点查</text>
  <text x="150" y="185" text-anchor="start" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">答案 = a[x + (pos - y)]，未被覆盖则 b[pos]</text>
</svg>
