<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="887"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="330" fill="#fafafa"/>
  <text x="360.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">预处理 + 一次扫描</text>
  <path d="M 115.2 42 Q 360.0 48 604.8 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="360.0" y="316" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">每个字母只算一次到最近 S 的距离</text>
  <rect x="40" y="70" width="210" height="56" rx="7" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="145" y="94" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">读键盘，收集 S 键</text>
  <text x="145" y="114" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">(最多 900 个)</text>
  <rect x="270" y="70" width="230" height="56" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="385" y="94" text-anchor="middle" font-size="12.5" fill="#2f5223" filter="url(#rough2)">对每个字母键求</text>
  <text x="385" y="114" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">best[c] = min d²</text>
  <rect x="520" y="70" width="170" height="56" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="605" y="94" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">扫一遍文本</text>
  <text x="605" y="114" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">O(q)</text>
  <line x1="250.0" y1="98.0" x2="266.0" y2="98.0" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <line x1="500.0" y1="98.0" x2="516.0" y2="98.0" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <rect x="60" y="156" width="280" height="52" rx="7" fill="#fbeeee" stroke="#a05a5a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="186" text-anchor="middle" font-size="12.5" fill="#6b3030" filter="url(#rough2)">小写键缺失 → -1</text>
  <rect x="380" y="156" width="280" height="52" rx="7" fill="#fbeeee" stroke="#a05a5a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="520" y="186" text-anchor="middle" font-size="12.5" fill="#6b3030" filter="url(#rough2)">大写缺键或无 S → -1</text>
  <rect x="220" y="232" width="280" height="52" rx="7" fill="#eef5ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="262" text-anchor="middle" font-size="12.5" fill="#2f5223" filter="url(#rough2)">best[c] &gt; x² → 计数 +1</text>
  <line x1="605.0" y1="126.0" x2="605.0" y2="150.0" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="360" y="300" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">答案是所有“必须换手”的大写字符个数</text>
</svg>
