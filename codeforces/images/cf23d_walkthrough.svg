<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 0 780 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="517"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="780" height="440" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">样例第 2 组：从三个中点算出 w，四个顶点随之确定</text>

  <!-- 左图：官方答案的四边形 -->
  <polygon points="325,145 175,95 125,245 275,195" fill="#eef4ff" stroke="#446688" stroke-width="1.8"
           filter="url(#rough2)"/>
  <circle cx="325" cy="145" r="4.5" fill="#23405c" filter="url(#rough2)"/>
  <circle cx="175" cy="95" r="4.5" fill="#23405c" filter="url(#rough2)"/>
  <circle cx="125" cy="245" r="4.5" fill="#23405c" filter="url(#rough2)"/>
  <circle cx="275" cy="195" r="4.5" fill="#23405c" filter="url(#rough2)"/>

  <text x="332" y="140" font-size="11" fill="#23405c" filter="url(#rough2)">A(3.5,1.5)</text>
  <text x="150" y="86" font-size="11" fill="#23405c" filter="url(#rough2)">B(0.5,2.5)</text>
  <text x="86" y="264" font-size="11" fill="#23405c" filter="url(#rough2)">C(-0.5,-0.5)</text>
  <text x="282" y="212" font-size="11" fill="#23405c" filter="url(#rough2)">D(2.5,0.5)</text>

  <circle cx="250" cy="120" r="5.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="150" cy="170" r="5.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="200" cy="220" r="5.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="300" cy="170" r="5.5" fill="#7a8ca6" filter="url(#rough2)"/>

  <text x="256" y="112" font-size="10" fill="#8c3b37" filter="url(#rough2)">(2,2)</text>
  <text x="122" y="166" font-size="10" fill="#8c3b37" filter="url(#rough2)">(0,1)</text>
  <text x="204" y="236" font-size="10" fill="#8c3b37" filter="url(#rough2)">(1,0)</text>
  <text x="306" y="166" font-size="10" fill="#446688" filter="url(#rough2)">(3,1)</text>

  <text x="80" y="300" font-size="10.5" fill="#8c3b37" filter="url(#rough2)">红点：给定的三个中点（三条等长边）</text>
  <text x="80" y="318" font-size="10.5" fill="#446688" filter="url(#rough2)">灰点：补出来的第四个中点 (3,1)</text>

  <!-- 右表 -->
  <rect x="420" y="58" width="330" height="30" fill="#eef1f4" stroke="#7a8ca6" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="436" y="78" font-size="10.5" font-weight="bold" fill="#33445c" filter="url(#rough2)">量</text>
  <text x="560" y="78" font-size="10.5" font-weight="bold" fill="#33445c" filter="url(#rough2)">取值</text>

  <rect x="420" y="88" width="330" height="28" fill="#ffffff" stroke="#d6d6d6" stroke-width="1" filter="url(#rough2)"/>
  <text x="436" y="107" font-size="10.5" fill="#555" filter="url(#rough2)">m1, m2, m3</text>
  <text x="560" y="107" font-size="10.5" fill="#555" filter="url(#rough2)">(2,2)  (0,1)  (1,0)</text>

  <rect x="420" y="116" width="330" height="28" fill="#f7fbff" stroke="#d6d6d6" stroke-width="1" filter="url(#rough2)"/>
  <text x="436" y="135" font-size="10.5" fill="#555" filter="url(#rough2)">u = m2-m1</text>
  <text x="560" y="135" font-size="10.5" fill="#555" filter="url(#rough2)">(-2, -1)</text>

  <rect x="420" y="144" width="330" height="28" fill="#ffffff" stroke="#d6d6d6" stroke-width="1" filter="url(#rough2)"/>
  <text x="436" y="163" font-size="10.5" fill="#555" filter="url(#rough2)">v = m3-m2</text>
  <text x="560" y="163" font-size="10.5" fill="#555" filter="url(#rough2)">(1, -1)</text>

  <rect x="420" y="172" width="330" height="28" fill="#f7fbff" stroke="#d6d6d6" stroke-width="1" filter="url(#rough2)"/>
  <text x="436" y="191" font-size="10.5" fill="#555" filter="url(#rough2)">det = cross(u,v)</text>
  <text x="560" y="191" font-size="10.5" fill="#555" filter="url(#rough2)">3</text>

  <rect x="420" y="200" width="330" height="28" fill="#ffffff" stroke="#d6d6d6" stroke-width="1" filter="url(#rough2)"/>
  <text x="436" y="219" font-size="9.5" fill="#555" filter="url(#rough2)">r1 = -|u|²，r2 = |v|²-2u·v</text>
  <text x="640" y="219" font-size="9.5" fill="#555" filter="url(#rough2)">-5, 4</text>

  <rect x="420" y="228" width="330" height="28" fill="#f7fbff" stroke="#d6d6d6" stroke-width="1" filter="url(#rough2)"/>
  <text x="436" y="247" font-size="10.5" fill="#555" filter="url(#rough2)">Wn = 2w·det</text>
  <text x="560" y="247" font-size="10.5" fill="#555" filter="url(#rough2)">(9, -3)</text>

  <rect x="420" y="256" width="330" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="436" y="275" font-size="10.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">w = Wn / (2·det)</text>
  <text x="560" y="275" font-size="10.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">(1.5, -0.5)</text>

  <rect x="420" y="284" width="330" height="28" fill="#ffffff" stroke="#d6d6d6" stroke-width="1" filter="url(#rough2)"/>
  <text x="436" y="303" font-size="10.5" fill="#555" filter="url(#rough2)">A = m1+w，B = m1-w</text>
  <text x="560" y="303" font-size="10.5" fill="#555" filter="url(#rough2)">(3.5,1.5) (0.5,2.5)</text>

  <rect x="420" y="312" width="330" height="28" fill="#f7fbff" stroke="#d6d6d6" stroke-width="1" filter="url(#rough2)"/>
  <text x="436" y="331" font-size="10.5" fill="#555" filter="url(#rough2)">C = 2m2-B，D = 2m3-C</text>
  <text x="560" y="331" font-size="10.5" fill="#555" filter="url(#rough2)">(-0.5,-0.5) (2.5,0.5)</text>

  <!-- 底部校验 -->
  <rect x="40" y="360" width="710" height="60" rx="9" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.3" filter="url(#rough2)"/>
  <text x="56" y="384" font-size="11.5" fill="#8a6015" filter="url(#rough2)">校验：AB、BC、CD 的长度平方都是 10（因为 |w|=|u+w|=|v-u-w|），DA 是 2；四个相邻叉积全为正 → 严格凸。</text>
  <text x="56" y="406" font-size="11.5" fill="#8a6015" filter="url(#rough2)">程序里 6 种排列依次尝试，第一个通过凸性检查的就被输出；本组恰好是 (m1,m2,m3) = (点3, 点1, 点2)。</text>
</svg>
