<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">把「升级」变成一条区间边：一条实边 + 两个虚拟节点</text>

  <!-- 轴 -->
  <path d="M80,90 L660,90" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="666" y="95" font-size="12" fill="#666" filter="url(#rough2)">层</text>
  <path d="M180,84 L180,96" fill="none" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="180" y="112" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">low</text>
  <path d="M470,84 L470,96" fill="none" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="470" y="112" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">w</text>

  <!-- 实边活跃区间 -->
  <rect x="180" y="128" width="290" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="325" y="150" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">实边 (u,v)：层 ∈ [low, w] 时可用</text>

  <!-- 虚拟边活跃区间 -->
  <rect x="80" y="186" width="100" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="130" y="208" text-anchor="middle" font-size="12" fill="#8a6d3b" filter="url(#rough2)">(u, z_u)</text>

  <rect x="80" y="244" width="100" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="130" y="266" text-anchor="middle" font-size="12" fill="#8a6d3b" filter="url(#rough2)">(v, z_v)</text>

  <text x="196" y="208" font-size="12" fill="#333" filter="url(#rough2)">层 &lt; low 时，从 u 或 v 都可以「升级」拿到 W_e</text>
  <text x="196" y="230" font-size="12" fill="#8a6d3b" filter="url(#rough2)">W_e = 层 low 上、u 所在 F_low 块的最大 val</text>
  <text x="196" y="266" font-size="12" fill="#333" filter="url(#rough2)">两个虚拟节点各自贴一端：绝不能共用一个，</text>
  <text x="196" y="288" font-size="12" fill="#b85450" filter="url(#rough2)">否则会把 u、v 在低层的两个互不相干的 F_c 块错误合并。</text>

  <rect x="80" y="316" width="580" height="66" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="96" y="342" font-size="12" fill="#333" filter="url(#rough2)">于是「一条实边的整段生命周期」被拆成两段区间：</text>
  <text x="96" y="366" font-size="12" fill="#4a7a3a" filter="url(#rough2)">[low, w]（可以自由走）　∪　[0, low-1]（可以「花一步升级」），恰好覆盖全部层。</text>
</svg>
