<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>
  <rect width="780" height="430" fill="#fafafa"/>
  <text x="30" y="40" font-size="21" fill="#333" text-anchor="start" font-weight="bold" filter="url(#rough2)">固定上界 M：在 cur ≤ M 的 Kadane 链上做 DP</text>
  <ellipse cx="100" cy="150" rx="32" ry="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="100" y="158" font-size="20" fill="#333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">0</text>
  <ellipse cx="250" cy="150" rx="32" ry="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="158" font-size="20" fill="#333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">1</text>
  <ellipse cx="400" cy="150" rx="32" ry="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="400" y="158" font-size="20" fill="#333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">2</text>
  <ellipse cx="600" cy="150" rx="32" ry="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="600" y="158" font-size="20" fill="#333" text-anchor="middle" font-weight="normal" filter="url(#rough2)">M</text>
  <text x="500" y="158" font-size="22" fill="#888" text-anchor="middle" font-weight="normal" filter="url(#rough2)">…</text>
  <path d="M 124 128 C 150 98, 200 98, 226 128" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="175.0" y="94" font-size="12.5" fill="#b85450" text-anchor="middle" font-weight="normal" filter="url(#rough2)">放 F：+1</text>
  <path d="M 226 172 C 200 202, 150 202, 124 172" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="175.0" y="218" font-size="12.5" fill="#4a7a3a" text-anchor="middle" font-weight="normal" filter="url(#rough2)">放 T：cur−1</text>
  <path d="M 274 128 C 300 98, 350 98, 376 128" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="325.0" y="94" font-size="12.5" fill="#b85450" text-anchor="middle" font-weight="normal" filter="url(#rough2)">放 F：+1</text>
  <path d="M 376 172 C 350 202, 300 202, 274 172" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="325.0" y="218" font-size="12.5" fill="#4a7a3a" text-anchor="middle" font-weight="normal" filter="url(#rough2)">放 T：cur−1</text>
  <path d="M 430 132 C 470 104, 530 104, 572 134" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" stroke-dasharray="6,5" filter="url(#rough2)"/>
  <text x="500" y="100" font-size="12" fill="#888" text-anchor="middle" font-weight="normal" filter="url(#rough2)">同样的转移重复</text>
  <text x="30" y="256" font-size="14" fill="#333" text-anchor="start" font-weight="normal" filter="url(#rough2)">dp[cur] = 处理完当前前缀、Kadane 值恰为 cur 时的最多 F 数（−1 表示不可达）</text>
  <text x="30" y="288" font-size="14" fill="#333" text-anchor="start" font-weight="normal" filter="url(#rough2)">放 T：cur → max(cur − 1, 0)，F 数不变；cur = 0 时是一条自环</text>
  <text x="30" y="320" font-size="14" fill="#333" text-anchor="start" font-weight="normal" filter="url(#rough2)">放 F：cur → cur + 1，F 数 + 1；必须先满足 cur + 1 ≤ M，否则该转移非法</text>
  <text x="30" y="352" font-size="14" fill="#333" text-anchor="start" font-weight="normal" filter="url(#rough2)">s[i] = N 时两条转移都允许并取 max；s[i] 已固定时只走对应那一条</text>
  <text x="30" y="392" font-size="15" fill="#b85450" text-anchor="start" font-weight="bold" filter="url(#rough2)">答案 = max over M of ( max_cur dp_M[cur] − M )，M 从 m0 枚举到 fmax</text>
</svg>
