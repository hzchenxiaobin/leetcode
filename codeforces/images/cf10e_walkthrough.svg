<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c9801f"/>
    </marker>
  </defs>

  <rect width="760" height="430" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="38" text-anchor="middle" font-size="18.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">样例 2 走查：面值 {4, 3, 1}，最小反例是 6</text>
  <path d="M 152 50 Q 380 56 608 50" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="84" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">贪心：6 = 4 + 1 + 1（3 枚）；最优：6 = 3 + 3（2 枚）⇒ 贪心不最优，6 是最小的。</text>
  <rect x="70" y="88" width="620" height="34" rx="7" fill="#fbfbfb" stroke="#c9c9c9" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="92" y="110" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">金额 1</text>
  <text x="200" y="110" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">贪心 1</text>
  <text x="400" y="110" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">最优 1</text>
  <text x="620" y="110" text-anchor="middle" font-size="12" fill="#555" font-weight="normal" filter="url(#rough2)">相等</text>
  <rect x="70" y="132" width="620" height="34" rx="7" fill="#f4f7fb" stroke="#c9c9c9" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="92" y="154" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">金额 2</text>
  <text x="200" y="154" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">贪心 1+1</text>
  <text x="400" y="154" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">最优 2</text>
  <text x="620" y="154" text-anchor="middle" font-size="12" fill="#555" font-weight="normal" filter="url(#rough2)">相等</text>
  <rect x="70" y="176" width="620" height="34" rx="7" fill="#fbfbfb" stroke="#c9c9c9" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="92" y="198" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">金额 3</text>
  <text x="200" y="198" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">贪心 3</text>
  <text x="400" y="198" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">最优 1</text>
  <text x="620" y="198" text-anchor="middle" font-size="12" fill="#555" font-weight="normal" filter="url(#rough2)">相等</text>
  <rect x="70" y="220" width="620" height="34" rx="7" fill="#f4f7fb" stroke="#c9c9c9" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="92" y="242" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">金额 4</text>
  <text x="200" y="242" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">贪心 4</text>
  <text x="400" y="242" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">最优 1</text>
  <text x="620" y="242" text-anchor="middle" font-size="12" fill="#555" font-weight="normal" filter="url(#rough2)">相等</text>
  <rect x="70" y="264" width="620" height="34" rx="7" fill="#fbfbfb" stroke="#c9c9c9" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="92" y="286" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">金额 5</text>
  <text x="200" y="286" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">贪心 4+1</text>
  <text x="400" y="286" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">最优 2</text>
  <text x="620" y="286" text-anchor="middle" font-size="12" fill="#555" font-weight="normal" filter="url(#rough2)">相等</text>
  <rect x="70" y="308" width="620" height="34" rx="7" fill="#fdecea" stroke="#b6483f" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="92" y="330" text-anchor="start" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">金额 6</text>
  <text x="200" y="330" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">贪心 4+1+1</text>
  <text x="400" y="330" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">最优 3+3 = 2 枚</text>
  <text x="620" y="330" text-anchor="middle" font-size="12" fill="#b6483f" font-weight="bold" filter="url(#rough2)">贪心更差</text>
  <text x="60" y="404" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">最小性：1..5 全部相等，6 是第一个“贪心 3 枚、最优 2 枚”的金额，所以输出 6。</text>
</svg>
