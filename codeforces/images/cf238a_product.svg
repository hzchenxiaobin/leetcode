<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="400" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">逐个挑选：第 i 个前缀有多少种选法</text>
  <path d="M 170 42 Q 360 48 550 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 三行挑选 -->
  <rect x="60" y="70" width="600" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="76" y="92" font-size="12" fill="#2f5223" filter="url(#rough2)">p0 已被占住：值为 0（空前缀）</text>
  <text x="76" y="112" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">所以 p1 不能等于 0，可选 2^m − 1 个</text>

  <rect x="60" y="134" width="600" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="76" y="156" font-size="12" fill="#2f4a66" filter="url(#rough2)">p2 不能等于 p0、p1 这 2 个已用值</text>
  <text x="76" y="176" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">可选 2^m − 2 个</text>

  <rect x="60" y="198" width="600" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="76" y="220" font-size="12" fill="#7a5a1b" filter="url(#rough2)">… 一般地，p_i 不能等于前面 i 个已用值</text>
  <text x="76" y="240" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">可选 2^m − i 个（i = 1 … n）</text>

  <path d="M 360 254 L 360 272" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="180" y="278" width="360" height="46" rx="9" fill="#fde8e8" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="307" text-anchor="middle" font-size="14" font-weight="bold" fill="#8c2f2b" filter="url(#rough2)">答案 = ∏ (2^m − i)，i = 1..n</text>

  <text x="60" y="352" font-size="11.5" fill="#666" filter="url(#rough2)">实现：先算 q = 2^m mod 1e9+9（O(m) 或快速幂），再逐项乘 (q − i) mod 1e9+9。</text>
  <text x="60" y="374" font-size="11.5" fill="#666" filter="url(#rough2)">当 n ≥ 2^m 时真值为 0；按模运算写也一样会得到 0（i = 2^m 那一项为 0）。</text>
</svg>
