<svg xmlns="http://www.w3.org/2000/svg" width="840" height="320" viewBox="0 0 840 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="320" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每部电影最爱演员数的范围 [mn, mx]</text>
  <text x="420" y="56" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">mn = f + max(0, u − B)，mx = f + min(u, A)</text>
  <text x="150" y="122" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">firstfilm</text>
  <g filter="url(#rough2)"><rect x="240" y="96" width="300" height="40" rx="4" fill="#f2f2f2" fill-opacity="0.85" stroke="#cccccc" stroke-width="1.3"/></g>
  <g filter="url(#rough2)"><rect x="300" y="102" width="120" height="28" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="560" y="122" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">[1, 3]</text>
  <text x="150" y="172" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">secondfilm</text>
  <g filter="url(#rough2)"><rect x="240" y="146" width="300" height="40" rx="4" fill="#f2f2f2" fill-opacity="0.85" stroke="#cccccc" stroke-width="1.3"/></g>
  <g filter="url(#rough2)"><rect x="360" y="152" width="6" height="28" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="560" y="172" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">[2, 2]</text>
  <text x="150" y="222" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">thirdfilm</text>
  <g filter="url(#rough2)"><rect x="240" y="196" width="300" height="40" rx="4" fill="#f2f2f2" fill-opacity="0.85" stroke="#cccccc" stroke-width="1.3"/></g>
  <g filter="url(#rough2)"><rect x="300" y="202" width="6" height="28" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="560" y="222" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">[1, 1]</text>
  <text x="150" y="272" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">fourthfilm</text>
  <g filter="url(#rough2)"><rect x="240" y="246" width="300" height="40" rx="4" fill="#f2f2f2" fill-opacity="0.85" stroke="#cccccc" stroke-width="1.3"/></g>
  <g filter="url(#rough2)"><rect x="240" y="252" width="6" height="28" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="560" y="272" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">[0, 0]</text>
  <text x="420" y="300" text-anchor="middle" font-size="11" fill="#777777" filter="url(#rough2)">重叠区间大 ⇒ 可能（2）；被别的电影下界压过 ⇒ 一定不是（1）</text>
</svg>
