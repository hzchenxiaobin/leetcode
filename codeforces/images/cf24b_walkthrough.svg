<svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 0 780 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="167"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>

  <rect width="780" height="420" fill="#fafafa"/>

  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1：三个人、三场比赛的统计</text>
  <path d="M 200 40 Q 390 46 580 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <rect x="60" y="64" width="660" height="44" fill="#e8eef6" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">车手</text>
  <text x="290" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">总积分</text>
  <text x="400" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">第 1 名</text>
  <text x="510" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">第 2 名</text>
  <text x="620" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">第 3 名</text>

  <rect x="60" y="108" width="660" height="48" fill="#ffffff" stroke="#9aa8b6" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="140" y="138" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">Hamilton</text>
  <text x="290" y="138" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">50</text>
  <text x="400" y="138" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="510" y="138" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="620" y="138" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">0</text>

  <rect x="60" y="156" width="660" height="48" fill="#fdf6e8" stroke="#c98a2b" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="140" y="186" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">Vettel</text>
  <text x="290" y="186" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">54</text>
  <text x="400" y="186" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="510" y="186" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="620" y="186" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">0</text>

  <rect x="60" y="204" width="660" height="48" fill="#ffffff" stroke="#9aa8b6" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="140" y="234" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">Webber</text>
  <text x="290" y="234" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">40</text>
  <text x="400" y="234" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="510" y="234" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="620" y="234" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">1</text>

  <rect x="60" y="272" width="660" height="60" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="78" y="298" font-size="11.5" fill="#2f5223" filter="url(#rough2)">原规则键：(50,2,0,0) (54,0,3,0) (40,1,0,1) → 最大 Vettel</text>
  <text x="78" y="320" font-size="11.5" fill="#2f5223" filter="url(#rough2)">新规则键：(2,50,0,0) (0,54,3,0) (1,40,0,1) → 最大 Hamilton</text>

  <text x="60" y="368" font-size="12.5" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">输出：Vettel（原规则） / Hamilton（新规则）</text>
  <text x="60" y="396" font-size="11" fill="#777777" filter="url(#rough2)">注意新规则第二项是积分，且胜场不会再被比较第二次。</text>
</svg>
