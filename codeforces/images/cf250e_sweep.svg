<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="400" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">一层之内：已走过的格子永远是一段区间</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">撞到砖/墙就转身，所以运动是"来回扫荡"，新区间只会向两侧扩张</text>
  <g filter="url(#rough2)"><rect x="150" y="120" width="72" height="48" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="186.0" y="150.12" text-anchor="middle" font-size="17" fill="#2b2b2b" filter="url(#rough2)">.</text>
  <text x="186" y="190" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="234" y="120" width="72" height="48" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="270.0" y="150.12" text-anchor="middle" font-size="17" fill="#2b2b2b" filter="url(#rough2)">.</text>
  <text x="270" y="190" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><rect x="318" y="120" width="72" height="48" rx="4" fill="#f6e3c4" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="354.0" y="150.12" text-anchor="middle" font-size="17" fill="#2b2b2b" filter="url(#rough2)">+</text>
  <text x="354" y="190" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="402" y="120" width="72" height="48" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="438.0" y="150.12" text-anchor="middle" font-size="17" fill="#2b2b2b" filter="url(#rough2)">.</text>
  <text x="438" y="190" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><rect x="486" y="120" width="72" height="48" rx="4" fill="#e2e2e2" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="522.0" y="150.12" text-anchor="middle" font-size="17" fill="#2b2b2b" filter="url(#rough2)">#</text>
  <text x="522" y="190" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">5</text>
  <path d="M150,214 L150,240 L402,240 L402,214" fill="none" stroke="#3d6b2f" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="276" y="262" text-anchor="middle" font-size="12" fill="#3d6b2f" filter="url(#rough2)">第一次右扫：走到砖前，破砖（1 秒）后转身</text>
  <path d="M150,290 L150,314 L570,314 L570,290" fill="none" stroke="#2f4a66" stroke-width="1.5" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="360" y="336" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">回扫到左墙、再右扫时，interval 扩到 2..4</text>
  <text x="700" y="190" text-anchor="start" font-size="12" fill="#b05a5a" filter="url(#rough2)">新格子里第一个</text>
  <text x="700" y="212" text-anchor="start" font-size="12" fill="#b05a5a" filter="url(#rough2)">"下方为空"的格子</text>
  <text x="700" y="234" text-anchor="start" font-size="12" fill="#b05a5a" filter="url(#rough2)">就是落点</text>
  <text x="440" y="376" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">每层只需扫一遍障碍表：预处理 O(m)，之后每次转身 O(1)</text>
</svg>
