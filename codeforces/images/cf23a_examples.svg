<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="233" />
      <feDisplacementMap in="SourceGraphic" scale="1.5" />
    </filter>
  </defs>

  <rect width="720" height="400" fill="#fafafa" />

  <text x="360" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">三个样例：0、3、2</text>
  <path d="M 200 44 Q 360 50 520 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)" />

  
  <rect x="24" y="68" width="212" height="150" rx="10" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.5" filter="url(#rough2)" />
  <text x="130" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">abcd</text>
  <g>
    <rect x="46" y="112" width="38" height="38" rx="5" fill="#f0f0f0" stroke="#999" stroke-width="1.1" filter="url(#rough2)" />
    <rect x="92" y="112" width="38" height="38" rx="5" fill="#f0f0f0" stroke="#999" stroke-width="1.1" filter="url(#rough2)" />
    <rect x="138" y="112" width="38" height="38" rx="5" fill="#f0f0f0" stroke="#999" stroke-width="1.1" filter="url(#rough2)" />
    <rect x="184" y="112" width="38" height="38" rx="5" fill="#f0f0f0" stroke="#999" stroke-width="1.1" filter="url(#rough2)" />
  </g>
  <text x="65" y="137" text-anchor="middle" font-size="15" fill="#555" filter="url(#rough2)">a</text>
  <text x="111" y="137" text-anchor="middle" font-size="15" fill="#555" filter="url(#rough2)">b</text>
  <text x="157" y="137" text-anchor="middle" font-size="15" fill="#555" filter="url(#rough2)">c</text>
  <text x="203" y="137" text-anchor="middle" font-size="15" fill="#555" filter="url(#rough2)">d</text>
  <text x="130" y="184" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">没有字符重复出现</text>
  <text x="130" y="205" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a3b36" filter="url(#rough2)">答案 0</text>

  
  <rect x="254" y="68" width="212" height="150" rx="10" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.5" filter="url(#rough2)" />
  <text x="360" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">ababa</text>
  <g>
    <rect x="276" y="112" width="34" height="38" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)" />
    <rect x="316" y="112" width="34" height="38" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)" />
    <rect x="356" y="112" width="34" height="38" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)" />
    <rect x="396" y="112" width="34" height="38" rx="5" fill="#f0f0f0" stroke="#999" stroke-width="1.1" filter="url(#rough2)" />
    <rect x="436" y="112" width="0" height="0" fill="none" filter="url(#rough2)" />
    <rect x="436" y="112" width="0" height="0" fill="none" filter="url(#rough2)" />
  </g>
  <text x="293" y="137" text-anchor="middle" font-size="15" fill="#2f5223" filter="url(#rough2)">a</text>
  <text x="333" y="137" text-anchor="middle" font-size="15" fill="#2f5223" filter="url(#rough2)">b</text>
  <text x="373" y="137" text-anchor="middle" font-size="15" fill="#2f5223" filter="url(#rough2)">a</text>
  <text x="413" y="137" text-anchor="middle" font-size="15" fill="#555" filter="url(#rough2)">b</text>
  <text x="453" y="137" text-anchor="middle" font-size="15" fill="#555" filter="url(#rough2)">a</text>
  <text x="360" y="168" text-anchor="middle" font-size="10.5" fill="#2f5223" filter="url(#rough2)">“aba”在下标 0 和 2 各出现一次</text>
  <text x="360" y="184" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">长度 4 的 abab、baba 都只出现一次</text>
  <text x="360" y="205" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f5223" filter="url(#rough2)">答案 3</text>

  
  <rect x="484" y="68" width="212" height="150" rx="10" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.5" filter="url(#rough2)" />
  <text x="590" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">zzz</text>
  <g>
    <rect x="514" y="112" width="44" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)" />
    <rect x="566" y="112" width="44" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)" />
    <rect x="618" y="112" width="44" height="38" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)" />
  </g>
  <text x="536" y="137" text-anchor="middle" font-size="15" fill="#2f4a66" filter="url(#rough2)">z</text>
  <text x="588" y="137" text-anchor="middle" font-size="15" fill="#2f4a66" filter="url(#rough2)">z</text>
  <text x="640" y="137" text-anchor="middle" font-size="15" fill="#2f4a66" filter="url(#rough2)">z</text>
  <text x="590" y="168" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">“zz”在下标 0 和 1 处重叠出现</text>
  <text x="590" y="184" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">“zzz”只出现一次</text>
  <text x="590" y="205" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">答案 2</text>

  
  <rect x="24" y="242" width="672" height="130" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)" />
  <text x="44" y="270" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">判定的两个要点</text>
  <text x="44" y="296" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">1. 两次出现可以重叠：zzz 中的 “zz” 起始位置相差 1，仍然算两次。</text>
  <text x="44" y="318" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">2. 最长长度要从大到小找；一旦某个长度能找到两个不同起点，就直接输出。</text>
  <text x="44" y="344" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">若所有字符都不同（如 abcd），任何长度 ≥1 的子串都只出现一次，答案是 0。</text>
</svg>