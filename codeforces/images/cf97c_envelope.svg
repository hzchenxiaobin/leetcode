<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380">
<defs>
<filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="9" result="noise"/>
<feDisplacementMap in="SourceGraphic" in2="noise" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<rect x="0" y="0" width="640" height="380" fill="#fafafa"/>
<g font-family="Comic Sans MS, Kaiti SC, cursive">
<text x="320.0" y="24.0" font-size="15" fill="#33475b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">答案 = p 的上凸包在 n/2 处的值（由一条跨过 n/2 的弦取到）</text>
<line x1="90.0" y1="300.0" x2="550.0" y2="300.0" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
<line x1="90.0" y1="300.0" x2="90.0" y2="70.0" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
<text x="544.0" y="320.0" font-size="13" fill="#666" text-anchor="middle" font-weight="normal" filter="url(#rough2)">a</text>
<text x="70.0" y="78.0" font-size="13" fill="#666" text-anchor="middle" font-weight="normal" filter="url(#rough2)">p</text>
<line x1="113.0" y1="272.4" x2="172.8" y2="231.0" stroke="#7a93a8" stroke-width="2.0" filter="url(#rough2)"/>
<line x1="172.8" y1="231.0" x2="237.2" y2="203.4" stroke="#7a93a8" stroke-width="2.0" filter="url(#rough2)"/>
<line x1="237.2" y1="203.4" x2="301.6" y2="185.0" stroke="#7a93a8" stroke-width="2.0" filter="url(#rough2)"/>
<line x1="301.6" y1="185.0" x2="356.8" y2="162.0" stroke="#7a93a8" stroke-width="2.0" filter="url(#rough2)"/>
<line x1="356.8" y1="162.0" x2="421.2" y2="148.2" stroke="#7a93a8" stroke-width="2.0" filter="url(#rough2)"/>
<line x1="421.2" y1="148.2" x2="485.6" y2="134.4" stroke="#7a93a8" stroke-width="2.0" filter="url(#rough2)"/>
<line x1="485.6" y1="134.4" x2="531.6" y2="125.2" stroke="#7a93a8" stroke-width="2.0" filter="url(#rough2)"/>
<circle cx="113.0" cy="272.4" r="5.0" fill="#33475b" stroke="#33475b" stroke-width="1.2" filter="url(#rough2)"/>
<circle cx="172.8" cy="231.0" r="5.0" fill="#33475b" stroke="#33475b" stroke-width="1.2" filter="url(#rough2)"/>
<circle cx="237.2" cy="203.4" r="5.0" fill="#33475b" stroke="#33475b" stroke-width="1.2" filter="url(#rough2)"/>
<circle cx="301.6" cy="185.0" r="5.0" fill="#33475b" stroke="#33475b" stroke-width="1.2" filter="url(#rough2)"/>
<circle cx="356.8" cy="162.0" r="5.0" fill="#33475b" stroke="#33475b" stroke-width="1.2" filter="url(#rough2)"/>
<circle cx="421.2" cy="148.2" r="5.0" fill="#33475b" stroke="#33475b" stroke-width="1.2" filter="url(#rough2)"/>
<circle cx="485.6" cy="134.4" r="5.0" fill="#33475b" stroke="#33475b" stroke-width="1.2" filter="url(#rough2)"/>
<circle cx="531.6" cy="125.2" r="5.0" fill="#33475b" stroke="#33475b" stroke-width="1.2" filter="url(#rough2)"/>
<line x1="320.0" y1="300.0" x2="320.0" y2="70.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="6 5" filter="url(#rough2)"/>
<text x="320.0" y="320.0" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">n/2</text>
<line x1="237.2" y1="203.4" x2="421.2" y2="148.2" stroke="#1f6f43" stroke-width="2.6" filter="url(#rough2)"/>
<text x="231.2" y="225.4" font-size="14" fill="#1f6f43" text-anchor="middle" font-weight="bold" filter="url(#rough2)">i</text>
<text x="427.2" y="136.2" font-size="14" fill="#1f6f43" text-anchor="middle" font-weight="bold" filter="url(#rough2)">j</text>
<circle cx="320.0" cy="178.6" r="7.0" fill="#f6d9b0" stroke="#1f6f43" stroke-width="2.2" filter="url(#rough2)"/>
<text x="332.0" y="168.6" font-size="12" fill="#1f6f43" text-anchor="start" font-weight="normal" filter="url(#rough2)">上凸包值</text>
<text x="320.0" y="340.0" font-size="13" fill="#33475b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">支撑直线 ℓ ≥ p 且 ℓ(n/2) = 答案，配合 S_K ≤ Kn/2 给出上界</text>
<text x="320.0" y="364.0" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="normal" filter="url(#rough2)">弦端点 i、j 落在同一条直线上 ⇒ 按比例混合即可达到该值</text>
</g>
</svg>
