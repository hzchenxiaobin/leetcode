<svg xmlns="http://www.w3.org/2000/svg" width="780" height="430" viewBox="0 0 780 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrH" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b06a2c"/>
    </marker>
  </defs>

  <rect width="780" height="430" fill="#fafafa"/>

  <text x="390" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">两个指针从两端向内推进，比的是「累计完成时刻」</text>

  <!-- 五块巧克力，宽度按秒数 14 像素 -->
  <rect x="70" y="70" width="28" height="56" fill="#dbe7fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="98" y="70" width="126" height="56" fill="#dbe7fb" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="224" y="70" width="112" height="56" fill="#f6f6f6" stroke="#999999" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="336" y="70" width="28" height="56" fill="#fff1e6" stroke="#b06a2c" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="364" y="70" width="98" height="56" fill="#fff1e6" stroke="#b06a2c" stroke-width="1.4" filter="url(#rough2)"/>

  <text x="84" y="104" text-anchor="middle" font-size="14" fill="#23405c" filter="url(#rough2)">2</text>
  <text x="161" y="104" text-anchor="middle" font-size="14" fill="#23405c" filter="url(#rough2)">9</text>
  <text x="280" y="104" text-anchor="middle" font-size="14" fill="#777" filter="url(#rough2)">8</text>
  <text x="350" y="104" text-anchor="middle" font-size="14" fill="#8a4a14" filter="url(#rough2)">2</text>
  <text x="413" y="104" text-anchor="middle" font-size="14" fill="#8a4a14" filter="url(#rough2)">7</text>

  <text x="84" y="150" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">1 号</text>
  <text x="161" y="150" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">2 号</text>
  <text x="280" y="150" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">3 号</text>
  <text x="350" y="150" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">4 号</text>
  <text x="413" y="150" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">5 号</text>

  <!-- 左右指针 -->
  <path d="M 84 186 L 84 162" stroke="#4a7a3a" stroke-width="1.8" fill="none"
        marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="84" y="204" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">l</text>
  <path d="M 413 186 L 413 162" stroke="#b06a2c" stroke-width="1.8" fill="none"
        marker-end="url(#arrH)" filter="url(#rough2)"/>
  <text x="413" y="204" text-anchor="middle" font-size="12" fill="#8a4a14" filter="url(#rough2)">r</text>

  <text x="48" y="104" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">→</text>
  <text x="478" y="104" text-anchor="middle" font-size="12" fill="#b06a2c" filter="url(#rough2)">←</text>
  <text x="48" y="58" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">Alice</text>
  <text x="478" y="58" text-anchor="middle" font-size="11" fill="#8a4a14" filter="url(#rough2)">Bob</text>

  <!-- 未吃区间括号 -->
  <path d="M 70 228 L 70 238 L 462 238 L 462 228" stroke="#7a8ca6" stroke-width="1.4" fill="none"
        filter="url(#rough2)"/>
  <text x="266" y="256" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">未吃的区间 [l, r]，每轮取走一块</text>

  <!-- 两个状态 -->
  <rect x="70" y="280" width="196" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="84" y="304" font-size="12" fill="#2f5223" filter="url(#rough2)">aliceTime：Alice 吃完</text>
  <text x="84" y="324" font-size="12" fill="#2f5223" filter="url(#rough2)">最后一块的时刻</text>

  <rect x="286" y="280" width="196" height="54" rx="8" fill="#fff1e6" stroke="#b06a2c"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="304" font-size="12" fill="#8a4a14" filter="url(#rough2)">bobTime：Bob 吃完</text>
  <text x="300" y="324" font-size="12" fill="#8a4a14" filter="url(#rough2)">最后一块的时刻</text>

  <!-- 规则卡 -->
  <rect x="500" y="272" width="256" height="70" rx="9" fill="#eef1f7" stroke="#7a8ca6"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="514" y="296" font-size="11.5" fill="#33445c" filter="url(#rough2)">aliceTime ≤ bobTime →</text>
  <text x="514" y="314" font-size="11.5" fill="#2f5223" filter="url(#rough2)">　Alice 拿 t[l]，l++</text>
  <text x="514" y="332" font-size="11.5" fill="#8a4a14" filter="url(#rough2)">否则 Bob 拿 t[r]，r--</text>

  <!-- 底部说明 -->
  <rect x="70" y="360" width="686" height="52" rx="9" fill="#f7f7f7" stroke="#bbbbbb"
        stroke-width="1.3" filter="url(#rough2)"/>
  <text x="84" y="382" font-size="11.5" fill="#444" filter="url(#rough2)">只有 l 与 r 撞在一起时两人才会抢同一块；在那之前，两人吃的是不同的巧克力，各自的节奏互不干扰。</text>
  <text x="84" y="402" font-size="11.5" fill="#8c3b37" filter="url(#rough2)">所以「谁先空出来」等价于「谁的累计完成时刻更小」，等号代表同时空出 —— 此时归 Alice。</text>
</svg>
