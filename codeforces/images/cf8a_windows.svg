<svg xmlns="http://www.w3.org/2000/svg" width="880" height="600" viewBox="0 0 880 600"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="43"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="880" height="600" fill="#fafafa"/>

  <text x="440" y="34" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">示例 2：aaacaaa / aca / aa —— 两段记忆可以紧挨着</text>
  <path d="M 110 46 Q 440 52 770 46" stroke="#2b2b2b" stroke-width="1.2" fill="none"
        filter="url(#rough2)"/>

  <text x="80" y="80" font-size="13" fill="#44597a" filter="url(#rough2)">A → B 的站序 s0</text>

  <rect x="80" y="92" width="60" height="60" rx="6" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="140" y="92" width="60" height="60" rx="6" fill="#ffffff" stroke="#b9b9b9" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="200" y="92" width="60" height="60" rx="6" fill="#dbe7fb" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="260" y="92" width="60" height="60" rx="6" fill="#dbe7fb" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="320" y="92" width="60" height="60" rx="6" fill="#dbe7fb" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="380" y="92" width="60" height="60" rx="6" fill="#fff3d6" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="440" y="92" width="60" height="60" rx="6" fill="#fff3d6" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="110.0" y="131.0" text-anchor="middle" font-size="28" fill="#555" filter="url(#rough2)">a</text>
  <text x="170.0" y="131.0" text-anchor="middle" font-size="28" fill="#555" filter="url(#rough2)">a</text>
  <text x="230.0" y="131.0" text-anchor="middle" font-size="28" fill="#23405c" filter="url(#rough2)">a</text>
  <text x="290.0" y="131.0" text-anchor="middle" font-size="28" fill="#23405c" filter="url(#rough2)">c</text>
  <text x="350.0" y="131.0" text-anchor="middle" font-size="28" fill="#23405c" filter="url(#rough2)">a</text>
  <text x="410.0" y="131.0" text-anchor="middle" font-size="28" fill="#8a6015" filter="url(#rough2)">a</text>
  <text x="470.0" y="131.0" text-anchor="middle" font-size="28" fill="#8a6015" filter="url(#rough2)">a</text>
  <text x="110.0" y="170" text-anchor="middle" font-size="11" fill="#9a9a9a" filter="url(#rough2)">0</text>
  <text x="170.0" y="170" text-anchor="middle" font-size="11" fill="#9a9a9a" filter="url(#rough2)">1</text>
  <text x="230.0" y="170" text-anchor="middle" font-size="11" fill="#9a9a9a" filter="url(#rough2)">2</text>
  <text x="290.0" y="170" text-anchor="middle" font-size="11" fill="#9a9a9a" filter="url(#rough2)">3</text>
  <text x="350.0" y="170" text-anchor="middle" font-size="11" fill="#9a9a9a" filter="url(#rough2)">4</text>
  <text x="410.0" y="170" text-anchor="middle" font-size="11" fill="#9a9a9a" filter="url(#rough2)">5</text>
  <text x="470.0" y="170" text-anchor="middle" font-size="11" fill="#9a9a9a" filter="url(#rough2)">6</text>

  <path d="M 200 196 L 200 203 L 380 203 L 380 196" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="290.0" y="222" text-anchor="middle" font-size="12" fill="#23405c" filter="url(#rough2)">i = 2，|s1| = 3</text>
  <path d="M 380 196 L 380 203 L 500 203 L 500 196" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="440.0" y="222" text-anchor="middle" font-size="12" fill="#23405c" filter="url(#rough2)">j = 5</text>

  <text x="530" y="112" font-size="12.5" fill="#23405c" filter="url(#rough2)">s1 = aca → 2、3、4 号站</text>
  <text x="530" y="136" font-size="12.5" fill="#23405c" filter="url(#rough2)">s2 = aa → 5、6 号站</text>
  <text x="530" y="168" font-size="12.5" fill="#2f5223" filter="url(#rough2)">j = 5 = i + |s1|：正好接上</text>
  <text x="530" y="192" font-size="11.5" fill="#666" filter="url(#rough2)">睡着的时间可能没跨过任何车站，</text>
  <text x="530" y="212" font-size="11.5" fill="#666" filter="url(#rough2)">所以两段记忆允许在边界处紧挨。</text>

  <text x="140" y="278" font-size="13" fill="#44597a" filter="url(#rough2)">两个方向各判一次，组合出四种判词：</text>

  <rect x="140" y="300" width="600" height="42" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="235.0" y="327" text-anchor="middle" font-size="12.5" fill="#23405c" filter="url(#rough2)">A → B 可行？</text>
  <text x="425.0" y="327" text-anchor="middle" font-size="12.5" fill="#23405c" filter="url(#rough2)">B → A 可行？</text>
  <text x="630.0" y="327" text-anchor="middle" font-size="12.5" fill="#23405c" filter="url(#rough2)">输出</text>
  <rect x="140" y="342" width="600" height="46" rx="5" fill="#ffffff" stroke="#d9d9d9" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="235.0" y="371" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">是</text>
  <text x="425.0" y="371" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">是</text>
  <rect x="536" y="350" width="188" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="630.0" y="371" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5223" filter="url(#rough2)">both</text>
  <rect x="140" y="388" width="600" height="46" rx="5" fill="#ffffff" stroke="#d9d9d9" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="235.0" y="417" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">是</text>
  <text x="425.0" y="417" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">否</text>
  <rect x="536" y="396" width="188" height="30" rx="6" fill="#eef1f7" stroke="#7a8ca6" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="630.0" y="417" text-anchor="middle" font-size="14" font-weight="bold" fill="#23405c" filter="url(#rough2)">forward</text>
  <rect x="140" y="434" width="600" height="46" rx="5" fill="#ffffff" stroke="#d9d9d9" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="235.0" y="463" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">否</text>
  <text x="425.0" y="463" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">是</text>
  <rect x="536" y="442" width="188" height="30" rx="6" fill="#eef1f7" stroke="#7a8ca6" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="630.0" y="463" text-anchor="middle" font-size="14" font-weight="bold" fill="#23405c" filter="url(#rough2)">backward</text>
  <rect x="140" y="480" width="600" height="46" rx="5" fill="#ffffff" stroke="#d9d9d9" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="235.0" y="509" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">否</text>
  <text x="425.0" y="509" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)">否</text>
  <rect x="536" y="488" width="188" height="30" rx="6" fill="#fde8e8" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="630.0" y="509" text-anchor="middle" font-size="14" font-weight="bold" fill="#8c3b37" filter="url(#rough2)">fantasy</text>

  <text x="440" y="556" text-anchor="middle" font-size="12" fill="#666"
        filter="url(#rough2)">本例 s0 = aaacaaa 反转后还是 aaacaaa，两个方向都成立，所以输出 both。</text>
  <text x="440" y="580" text-anchor="middle" font-size="11.5" fill="#8a8a8a"
        filter="url(#rough2)">注意：两段记忆的时间顺序（先 s1 后 s2）在反方向时也不变，变的只是站序。</text>
</svg>
