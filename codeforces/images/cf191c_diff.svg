<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="309"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="440" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">191C：树上路径差分：diff[a]++、diff[b]++、diff[lca]-=2</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <line x1="360.0" y1="90.0" x2="230.0" y2="190.0" stroke="#999999" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="360.0" y1="90.0" x2="500.0" y2="190.0" stroke="#999999" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="230.0" y1="190.0" x2="140.0" y2="300.0" stroke="#999999" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="230.0" y1="190.0" x2="310.0" y2="300.0" stroke="#999999" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="360.0" cy="90.0" r="22.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="360.0" y="95.0" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">1</text>
  <circle cx="230.0" cy="190.0" r="22.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="230.0" y="195.0" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">2</text>
  <circle cx="500.0" cy="190.0" r="22.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="500.0" y="195.0" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">3</text>
  <circle cx="140.0" cy="300.0" r="22.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="140.0" y="305.0" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">4</text>
  <circle cx="310.0" cy="300.0" r="22.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="310.0" y="305.0" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="140.0" y="340.0" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">路径 3→5</text>
  <text x="500.0" y="250.0" text-anchor="middle" font-size="11" fill="#6b4c9a" filter="url(#rough2)">lca(3,5)=1</text>
  <rect x="400.0" y="60.0" width="280.0" height="90.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="414.0" y="82.8" text-anchor="start" font-size="10.8" fill="#3f3420" filter="url(#rough2)">diff[4] += 1</text>
  <text x="414.0" y="106.8" text-anchor="start" font-size="10.8" fill="#3f3420" filter="url(#rough2)">diff[3] += 1</text>
  <text x="414.0" y="130.8" text-anchor="start" font-size="10.8" fill="#3f3420" filter="url(#rough2)">diff[1] -= 2（lca）</text>
  <rect x="60.0" y="380.0" width="640.0" height="50.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="74.0" y="403.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">后序累加：边 (parent[v], v) 的经过次数 = diff[v]</text>
</svg>
