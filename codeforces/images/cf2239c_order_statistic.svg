<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="760" height="400" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    核心观察：p_i 是「前 i 个位置的值集合」里第 c_i+1 小的元素
  </text>

  <text x="62" y="66" font-size="12" fill="#555" filter="url(#rough2)">灰色 = 已放到位置 &gt; i 的值；蓝色 = 仍可用</text>

  <rect x="60" y="82" width="44" height="44" rx="6" fill="#e8e8e8" stroke="#a8a8a8" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M64,122 L100,86" stroke="#a8a8a8" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="82" y="112" text-anchor="middle" font-size="15" fill="#888" filter="url(#rough2)">1</text>

  <rect x="112" y="82" width="44" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="134" y="112" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">2</text>

  <rect x="164" y="82" width="44" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="186" y="112" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)">3</text>

  <rect x="216" y="82" width="44" height="44" rx="6" fill="#e8e8e8" stroke="#a8a8a8" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M220,122 L256,86" stroke="#a8a8a8" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="238" y="112" text-anchor="middle" font-size="15" fill="#888" filter="url(#rough2)">4</text>

  <rect x="268" y="82" width="44" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="112" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">5</text>

  <rect x="320" y="82" width="44" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="342" y="112" text-anchor="middle" font-size="15" fill="#446688" filter="url(#rough2)">6</text>

  <path d="M186,164 L186,142" fill="none" stroke="#b85450" stroke-width="1.8"
        marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="186" y="182" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">第 c_i+1 小</text>

  <text x="62" y="210" font-size="12" fill="#555" filter="url(#rough2)">例：i=4，S_4={2,3,5,6}，c_4=1 ⟹ p_4=第 2 小=3</text>

  <rect x="60" y="252" width="344" height="112" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="76" y="278" font-size="12" fill="#4a7a3a" filter="url(#rough2)">· s 型：s_i 已知，相邻 s 值作差得 d_i</text>
  <text x="76" y="302" font-size="12" fill="#4a7a3a" filter="url(#rough2)">· p 型：p_i=x 已给出，直接删 x</text>
  <text x="76" y="326" font-size="12" fill="#b85450" filter="url(#rough2)">· 段首（左邻是 p 型）：s_{i−1} 未知</text>
  <text x="76" y="350" font-size="12" fill="#b85450" filter="url(#rough2)">  → 3.3 节专门处理这一种情形</text>

  <rect x="430" y="62" width="300" height="252" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="580" y="88" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">三个量之间的关系</text>

  <text x="450" y="120" font-size="13" fill="#333" filter="url(#rough2)">d_i = s_i − s_{i−1}</text>
  <text x="450" y="142" font-size="11.5" fill="#666" filter="url(#rough2)">= 前面比 p_i 大的元素个数</text>

  <text x="450" y="178" font-size="13" fill="#333" filter="url(#rough2)">c_i = (i−1) − d_i</text>
  <text x="450" y="200" font-size="11.5" fill="#666" filter="url(#rough2)">= 前面比 p_i 小的元素个数</text>

  <rect x="444" y="216" width="272" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="580" y="242" text-anchor="middle" font-size="13" fill="#8a6d3b" filter="url(#rough2)">p_i = S_i 中第 c_i+1 小</text>

  <text x="450" y="282" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">S_i = {p_1,…,p_i}：前缀值集合</text>
  <text x="450" y="302" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">从右往左扫时它正好是「可用值」</text>
</svg>
