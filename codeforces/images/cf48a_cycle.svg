<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="360" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="38" text-anchor="middle" font-size="18.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">48A：石头 &gt; 剪刀 &gt; 布 &gt; 石头</text>
  <path d="M 137 50 Q 380 56 623 50" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="70" y="168" width="140" height="64" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="140" y="207" text-anchor="middle" font-size="15" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">rock</text>
  <rect x="310" y="78" width="140" height="64" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="117" text-anchor="middle" font-size="15" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">scissors</text>
  <rect x="550" y="168" width="140" height="64" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="620" y="207" text-anchor="middle" font-size="15" fill="#2f4a66" font-weight="bold" filter="url(#rough2)">paper</text>
  <path d="M 210 186 Q 260 120 310 118" stroke="#c9801f" stroke-width="2.0" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 450 118 Q 500 120 550 186" stroke="#4a7a3a" stroke-width="2.0" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 550 222 Q 380 268 210 222" stroke="#b6483f" stroke-width="2.0" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="100" text-anchor="middle" font-size="11" fill="#c9801f" font-weight="normal" filter="url(#rough2)">石头打破剪刀</text>
  <text x="500" y="100" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="normal" filter="url(#rough2)">剪刀剪纸</text>
  <text x="380" y="286" text-anchor="middle" font-size="11" fill="#b6483f" font-weight="normal" filter="url(#rough2)">布裹石头</text>
  <text x="60" y="330" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">一人同时赢过另外两人才能获胜；平局（含三人相同、或两两相克成环）输出 ?。</text>
</svg>
