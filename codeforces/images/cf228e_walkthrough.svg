<svg xmlns="http://www.w3.org/2000/svg" width="840" height="380" viewBox="0 0 840 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="380" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1：四条约束合并后选 {3, 4}</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">x₁⊕x₂=0，x₂⊕x₄=1，x₄⊕x₃=0，x₃⊕x₂=1</text>
  <g filter="url(#rough2)"><rect x="160" y="96" width="120" height="38" rx="4" fill="#d6e6f2" fill-opacity="0.85" stroke="#446688" stroke-width="1.3"/></g>
  <text x="220" y="121" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">x₁</text>
  <text x="320" y="121" text-anchor="start" font-size="12.5" fill="#333333" filter="url(#rough2)">= x₂</text>
  <g filter="url(#rough2)"><rect x="160" y="146" width="120" height="38" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="220" y="171" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">x₂</text>
  <text x="320" y="171" text-anchor="start" font-size="12.5" fill="#333333" filter="url(#rough2)">取 0</text>
  <g filter="url(#rough2)"><rect x="160" y="196" width="120" height="38" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="220" y="221" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">x₄</text>
  <text x="320" y="221" text-anchor="start" font-size="12.5" fill="#333333" filter="url(#rough2)">= ¬x₂ = 1</text>
  <g filter="url(#rough2)"><rect x="160" y="246" width="120" height="38" rx="4" fill="#f6e3c4" fill-opacity="0.85" stroke="#a0522d" stroke-width="1.3"/></g>
  <text x="220" y="271" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">x₃</text>
  <text x="320" y="271" text-anchor="start" font-size="12.5" fill="#333333" filter="url(#rough2)">= x₄ = 1</text>
  <text x="640" y="130" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3d6b2f" filter="url(#rough2)">选 {3,4}：</text>
  <text x="640" y="158" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">道路 1-2：1✓</text>
  <text x="640" y="182" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">道路 2-4：0⊕0⊕1=1✓</text>
  <text x="640" y="206" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">道路 4-3：1✓</text>
  <text x="640" y="230" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">道路 3-2：0⊕1⊕0=1✓</text>
  <text x="420" y="330" text-anchor="middle" font-size="12" fill="#8a4b2a" filter="url(#rough2)">官方输出 3 2 1 3（城市 3 选两次抵消）也合法：多解</text>
  <text x="420" y="358" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">本地验证用 checker 模拟翻转后检查所有道路为 1</text>
</svg>
