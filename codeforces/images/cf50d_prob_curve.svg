<svg xmlns="http://www.w3.org/2000/svg" width="740" height="440" viewBox="0 0 740 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="740" height="440" fill="#fafafa"/>
  <text x="370" y="34" font-size="19" fill="#2b2b2b" text-anchor="middle" font-weight="bold" filter="url(#rough2)">固定 D 时 P 随 R 单调不减 ⇒ 失败概率随 R 单调不增</text>
  <line x1="86" y1="366" x2="650" y2="366" stroke="#2b2b2b" stroke-width="1.7" marker-end="url(#arrb2)" filter="url(#rough2)"/>
  <line x1="86" y1="366" x2="86" y2="96" stroke="#2b2b2b" stroke-width="1.7" marker-end="url(#arrb2)" filter="url(#rough2)"/>
  <text x="658" y="371" font-size="14" fill="#2b2b2b" text-anchor="start" font-weight="bold" filter="url(#rough2)">D</text>
  <text x="70" y="92" font-size="14" fill="#2b2b2b" text-anchor="start" font-weight="bold" filter="url(#rough2)">P</text>
  <line x1="86" y1="366" x2="86" y2="372" stroke="#2b2b2b" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="86.0" y="388" font-size="11" fill="#44546a" text-anchor="middle" filter="url(#rough2)">0</text>
  <line x1="211" y1="366" x2="211" y2="372" stroke="#2b2b2b" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="211.0" y="388" font-size="11" fill="#44546a" text-anchor="middle" filter="url(#rough2)">1</text>
  <line x1="336" y1="366" x2="336" y2="372" stroke="#2b2b2b" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="336.0" y="388" font-size="11" fill="#44546a" text-anchor="middle" filter="url(#rough2)">2</text>
  <line x1="461" y1="366" x2="461" y2="372" stroke="#2b2b2b" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="461.0" y="388" font-size="11" fill="#44546a" text-anchor="middle" filter="url(#rough2)">3</text>
  <line x1="586" y1="366" x2="586" y2="372" stroke="#2b2b2b" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="586.0" y="388" font-size="11" fill="#44546a" text-anchor="middle" filter="url(#rough2)">4</text>
  <line x1="80" y1="241" x2="86" y2="241" stroke="#2b2b2b" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="76" y="245.0" font-size="11" fill="#44546a" text-anchor="end" filter="url(#rough2)">0.5</text>
  <line x1="80" y1="116" x2="86" y2="116" stroke="#2b2b2b" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="76" y="120.0" font-size="11" fill="#44546a" text-anchor="end" filter="url(#rough2)">1</text>
  <line x1="86" y1="116" x2="640" y2="116" stroke="#d8dde2" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <polyline points="86,116 211,116 217,140.4 224,163.4 230,184.9 236,205.0 242,223.6 248,240.6 255,256.2 261,270.3 267,283.0 274,294.4 280,304.5 286,313.5 292,321.3 298,328.2 305,334.2 311,339.4 317,343.8 324,347.6 330,350.8 336,353.6 342,355.8 348,357.7 355,359.3 361,360.6 367,361.7 374,362.6 380,363.3 386,363.9 392,364.3 398,364.7 405,365.0 411,365.2 417,365.4 424,365.5 430,365.6 436,365.7 442,365.8 449,365.8 455,365.9 461,365.9 467,365.9 474,366.0 480,366.0 486,366.0 492,366.0 499,366.0 505,366.0 511,366.0 517,366.0 524,366.0 530,366.0 536,366.0 542,366.0 548,366.0 555,366.0 561,366.0 567,366.0 574,366.0 580,366.0 586,366.0" fill="none" stroke="#446688" stroke-width="2.6" filter="url(#rough2)"/>
  <polyline points="86,116 336,116 342,128.3 348,140.4 355,152.0 361,163.4 367,174.3 374,184.9 380,195.1 386,205.0 392,214.5 398,223.6 405,232.3 411,240.6 417,248.6 424,256.2 430,263.4 436,270.3 442,276.8 448,283.0 455,288.8 461,294.4 467,299.6 474,304.5 480,309.1 486,313.5 492,317.5 498,321.3 505,324.9 511,328.2 517,331.3 524,334.2 530,336.9 536,339.4 542,341.7 548,343.8 555,345.8 561,347.6 567,349.3 574,350.8 580,352.3 586,353.6" fill="none" stroke="#4a7a3a" stroke-width="2.6" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="205.0" y="104" font-size="12" fill="#2f4a66" text-anchor="end" font-weight="bold" filter="url(#rough2)">R = 1</text>
  <text x="330.0" y="104" font-size="12" fill="#2f5223" text-anchor="end" font-weight="bold" filter="url(#rough2)">R = 2</text>
  <text x="448.5" y="291.0" font-size="11.5" fill="#2f5223" text-anchor="start" filter="url(#rough2)">R = 2 的曲线整体在 R = 1 上方</text>
  <text x="448.5" y="321.0" font-size="11.5" fill="#3c5e2e" text-anchor="start" filter="url(#rough2)">同一 D 上 P 更大 ⇒ 失败概率更小</text>
  <rect x="430" y="96" width="250" height="88" rx="10" fill="#f2f6fb" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="446" y="122" font-size="12.5" fill="#2f4a66" text-anchor="start" font-weight="bold" filter="url(#rough2)">P(D,R) = e^(1 − (D/R)²)</text>
  <text x="446" y="146" font-size="11.5" fill="#44546a" text-anchor="start" filter="url(#rough2)">D &lt; R 时直接等于 1</text>
  <text x="446" y="168" font-size="11.5" fill="#44546a" text-anchor="start" filter="url(#rough2)">（两段在 D = R 处连续）</text>
  <rect x="60" y="392" width="640" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="74" y="415" font-size="12" fill="#8a6015" text-anchor="start" filter="url(#rough2)">于是 F(R) = P(摧毁数 &lt; K) 单调不增：可以二分最小的 R 使 F(R) ≤ ε。</text>
</svg>
