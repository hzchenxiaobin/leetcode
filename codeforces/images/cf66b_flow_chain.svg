<svg xmlns="http://www.w3.org/2000/svg" width="880" height="450" viewBox="0 0 880 450"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="880" height="450" fill="#fafafa"/>

  <text x="440" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">在高度 3 的区域降雨：水流成一整段，被高 4 的墙截断</text>
  <text x="440" y="66" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">样例来自题面：h = [4, 2, 3, 3, 2]</text>

  <!-- 云与雨 -->
  <g filter="url(#rough2)">
    <ellipse cx="378" cy="104" rx="46" ry="20" fill="#cfe0f5" stroke="#446688" stroke-width="1.4"/>
    <ellipse cx="352" cy="112" rx="24" ry="14" fill="#cfe0f5" stroke="#446688" stroke-width="1.4"/>
    <ellipse cx="406" cy="112" rx="24" ry="14" fill="#cfe0f5" stroke="#446688" stroke-width="1.4"/>
    <text x="378" y="110" text-anchor="middle" font-size="11" fill="#2f4a66">降雨</text>
    <path d="M 356 128 L 356 176" stroke="#446688" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M 378 132 L 378 176" stroke="#446688" stroke-width="2" marker-end="url(#arr)"/>
    <path d="M 400 128 L 400 176" stroke="#446688" stroke-width="2" marker-end="url(#arr)"/>
  </g>

  <!-- 五根柱子，基线 y=350，比例 52 px / 单位 -->
  <g filter="url(#rough2)">
    <rect x="90" y="142" width="96" height="208" fill="#e9e9e9" stroke="#999999" stroke-width="1.5"/>
    <rect x="210" y="246" width="96" height="104" fill="#cfe0f5" stroke="#446688" stroke-width="1.5"/>
    <rect x="330" y="194" width="96" height="156" fill="#cfe0f5" stroke="#446688" stroke-width="1.5"/>
    <rect x="450" y="194" width="96" height="156" fill="#cfe0f5" stroke="#446688" stroke-width="1.5"/>
    <rect x="570" y="246" width="96" height="104" fill="#cfe0f5" stroke="#446688" stroke-width="1.5"/>

    <text x="138" y="176" text-anchor="middle" font-size="14" font-weight="bold" fill="#777777">4</text>
    <text x="258" y="276" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66">2</text>
    <text x="378" y="224" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66">3</text>
    <text x="498" y="224" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66">3</text>
    <text x="618" y="276" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66">2</text>

    <line x1="70" y1="350" x2="700" y2="350" stroke="#666666" stroke-width="1.6"/>
    <text x="138" y="372" text-anchor="middle" font-size="11" fill="#777777">1</text>
    <text x="258" y="372" text-anchor="middle" font-size="11" fill="#2f4a66">2</text>
    <text x="378" y="372" text-anchor="middle" font-size="11" fill="#2f4a66">3</text>
    <text x="498" y="372" text-anchor="middle" font-size="11" fill="#2f4a66">4</text>
    <text x="618" y="372" text-anchor="middle" font-size="11" fill="#2f4a66">5</text>

    <text x="138" y="396" text-anchor="middle" font-size="10.5" fill="#999999">被挡住</text>
  </g>

  <!-- 流动箭头（柱间空隙） -->
  <g filter="url(#rough2)">
    <path d="M 330 236 L 310 236" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="320" y="226" text-anchor="middle" font-size="9.5" fill="#2f4a66">3≥2</text>

    <path d="M 210 268 L 190 268" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrr)"/>
    <text x="200" y="258" text-anchor="middle" font-size="9.5" fill="#8a2b28">2&lt;4 停</text>
    <path d="M 186 250 L 198 262 M 198 250 L 186 262" stroke="#b85450" stroke-width="2"/>

    <path d="M 428 220 L 448 220" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="440" y="210" text-anchor="middle" font-size="9.5" fill="#2f4a66">3≥3</text>

    <path d="M 548 250 L 568 250" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="560" y="240" text-anchor="middle" font-size="9.5" fill="#2f4a66">3≥2</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="408" width="760" height="32" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
    <text x="74" y="429" font-size="11.5" fill="#8a6015">水只能沿「不上升」的链流：3 ≥ 2 能过，2 ≥ 4 不能过；两边各滑到底，合起来就是浇灌区间。</text>
  </g>
</svg>
