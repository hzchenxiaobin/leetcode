<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="67"/>
    <feDisplacementMap in="SourceGraphic" scale="1.6"/></filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker></defs>
  <rect width="720" height="300" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">队列写法：把「恰好等于 a_v」的点排进队列</text>
  <rect x="40" y="62" width="200" height="62" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="86" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">初始化 cur[v] = 0</text>
  <text x="140" y="108" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">把 cur[v] == a[v] 的点入队</text>
  <rect x="270" y="62" width="200" height="62" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="370" y="86" text-anchor="middle" font-size="12" fill="#7a5a1b" filter="url(#rough2)">弹出 v：若已按下或值已变</text>
  <text x="370" y="108" text-anchor="middle" font-size="11" fill="#7a5a1b" filter="url(#rough2)">就跳过；否则按下 v</text>
  <rect x="500" y="62" width="180" height="62" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="590" y="86" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">邻居值 +1</text>
  <text x="590" y="108" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">恰好相等的未按下邻居入队</text>
  <path d="M 242 93 L 268 93" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 472 93 L 498 93" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="60" y="156" width="600" height="100" rx="9" fill="#ffffff" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="180" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">为什么一定正确：被按下的点值变成 a_v+1 后只会继续增大，所以「按下过」是永久安全的；</text>
  <text x="74" y="202" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">每当某点值增加到恰好等于 a_u 且它还没被按下，就把它入队；队空时不存在「未按下且值等于 a」的点。</text>
  <text x="74" y="224" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">于是队列空时所有点都安全 —— 任何实例都有解，所以 −1 分支其实永远不会触发（题面仍保留）。</text>
  <text x="74" y="246" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">每个点最多入队/按下一次，总时间 O(n + m)。</text>
</svg>
