<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 580" width="820" height="580"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="820" height="580" fill="#fafafa"/>

  <text x="410" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：排序 → 算 fact → 预处理逆元 → 一趟扫描</text>
  <text x="410" y="54" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#rough2)">每组 O(n log n)，全部开销都在排序上</text>

  <!-- ① -->
  <rect x="130" y="72" width="540" height="60" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="150" y="96" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">① 读入 n 与 a[1..n]</text>
  <text x="150" y="118" font-size="11" fill="#2f4a66" filter="url(#rough2)">多测，Σn ≤ 2·10^5；每个 a[i] 先进模再使用</text>

  <path d="M 400 132 L 400 152" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② -->
  <rect x="130" y="154" width="540" height="60" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="150" y="178" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">② 降序排序 a[0] ≥ a[1] ≥ … ≥ a[n−1]</text>
  <text x="150" y="200" font-size="11" fill="#2f4a66" filter="url(#rough2)">a[0] 就是根；位置 j 的点恰好有 j 个更大的点</text>

  <path d="M 400 214 L 400 234" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ③ -->
  <rect x="130" y="236" width="540" height="60" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="150" y="260" font-size="13" font-weight="bold" fill="#33582a" filter="url(#rough2)">③ fact = (n−1)! mod p；预处理 inv[1..n−1]</text>
  <text x="150" y="282" font-size="11" fill="#33582a" filter="url(#rough2)">逆元用线性递推，全局建一次，所有测试点共用</text>

  <path d="M 400 296 L 400 316" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ④ 关键一步 -->
  <rect x="130" y="318" width="540" height="82" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="150" y="342" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">④ 对 j = 0..n−1 逐位置扫描</text>
  <text x="150" y="366" font-size="11.6" fill="#8a6015" filter="url(#rough2)">ans += pref · fact · inv[j]　　（pref 只含 a[0..j−1]）</text>
  <text x="150" y="388" font-size="11.6" fill="#8a6015" filter="url(#rough2)">然后 pref += a[j]；sum += a[j]</text>

  <path d="M 400 400 L 400 420" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ⑤ -->
  <rect x="130" y="422" width="540" height="60" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="150" y="446" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">⑤ ans −= (sum − a[0]) · fact，输出 ans mod p</text>
  <text x="150" y="468" font-size="11" fill="#2f4a66" filter="url(#rough2)">扣掉每棵王朝都要付的那部分 Σ a[v]</text>

  <!-- 警示 -->
  <rect x="60" y="502" width="700" height="58" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="78" y="526" font-size="12.2" font-weight="bold" fill="#8c3a37" filter="url(#rough2)">⚠ 顺序是命门：必须先算贡献，再把 a[j] 并入 pref</text>
  <text x="78" y="548" font-size="11.2" fill="#8c3a37" filter="url(#rough2)">否则当前点会被当成「比自己大的点」，第 1 轮就多算 a[0]·fact，答案偏大</text>
</svg>
