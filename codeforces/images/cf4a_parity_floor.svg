<svg xmlns="http://www.w3.org/2000/svg" width="740" height="460" viewBox="0 0 740 460"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="a4ag" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="740" height="460" fill="#fafafa"/>

  <text x="370" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两块都得是偶数，而且每块至少 2 公斤</text>
  <path d="M 120 46 Q 370 52 620 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 左面板：可行的拆法 -->
  <rect x="26" y="58" width="430" height="260" rx="12" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="44" y="86" font-size="13.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">偶数 + 偶数：w = 8 与 w = 6 的拆法</text>

  <!-- 8 = 2 + 6 -->
  <g filter="url(#rough2)">
    <rect x="60" y="104" width="68" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="128" y="104" width="204" height="32" fill="#eef7f0" stroke="#4a7a3a" stroke-width="1.3"/>
    <line x1="128" y1="100" x2="128" y2="140" stroke="#b85450" stroke-width="2" stroke-dasharray="5 3"/>
  </g>
  <text x="94" y="126" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5223" filter="url(#rough2)">2</text>
  <text x="230" y="126" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5223" filter="url(#rough2)">6</text>
  <text x="350" y="126" font-size="13" fill="#2b2b2b" filter="url(#rough2)">8 = 2 + 6  ✓</text>

  <!-- 8 = 4 + 4 -->
  <g filter="url(#rough2)">
    <rect x="60" y="154" width="136" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="196" y="154" width="136" height="32" fill="#eef7f0" stroke="#4a7a3a" stroke-width="1.3"/>
    <line x1="196" y1="150" x2="196" y2="190" stroke="#b85450" stroke-width="2" stroke-dasharray="5 3"/>
  </g>
  <text x="128" y="176" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5223" filter="url(#rough2)">4</text>
  <text x="264" y="176" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5223" filter="url(#rough2)">4</text>
  <text x="350" y="176" font-size="13" fill="#2b2b2b" filter="url(#rough2)">8 = 4 + 4  ✓</text>

  <!-- 6 = 2 + 4 -->
  <g filter="url(#rough2)">
    <rect x="60" y="204" width="68" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/>
    <rect x="128" y="204" width="136" height="32" fill="#eef7f0" stroke="#4a7a3a" stroke-width="1.3"/>
    <line x1="128" y1="200" x2="128" y2="240" stroke="#b85450" stroke-width="2" stroke-dasharray="5 3"/>
  </g>
  <text x="94" y="226" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5223" filter="url(#rough2)">2</text>
  <text x="196" y="226" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5223" filter="url(#rough2)">4</text>
  <text x="350" y="226" font-size="13" fill="#2b2b2b" filter="url(#rough2)">6 = 2 + 4  ✓</text>

  <text x="44" y="272" font-size="12.5" fill="#555" filter="url(#rough2)">两块都是正偶数 ⇒ 每块 ≥ 2 ⇒ w = 两块之和 ≥ 4</text>
  <text x="44" y="296" font-size="12.5" fill="#555" filter="url(#rough2)">本图只用到“偶数”，下一条要求是“够大”。</text>

  <!-- 右面板：w = 2 为什么不行 -->
  <rect x="470" y="58" width="244" height="260" rx="12" fill="#fff8f7" stroke="#d99a96" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="486" y="86" font-size="13.5" font-weight="bold" fill="#8a3b36" filter="url(#rough2)">w = 2 为什么不行</text>

  <g filter="url(#rough2)">
    <rect x="500" y="104" width="44" height="44" fill="#fde8e8" stroke="#b85450" stroke-width="1.4"/>
    <rect x="548" y="104" width="44" height="44" fill="#fde8e8" stroke="#b85450" stroke-width="1.4"/>
    <line x1="544" y1="100" x2="544" y2="152" stroke="#b85450" stroke-width="2" stroke-dasharray="4 3"/>
  </g>
  <text x="522" y="132" text-anchor="middle" font-size="17" font-weight="bold" fill="#8a3b36" filter="url(#rough2)">1</text>
  <text x="570" y="132" text-anchor="middle" font-size="17" font-weight="bold" fill="#8a3b36" filter="url(#rough2)">1</text>

  <text x="486" y="184" font-size="12" fill="#7a3a35" filter="url(#rough2)">1 + 1：两块都是奇数</text>
  <text x="486" y="210" font-size="12" fill="#7a3a35" filter="url(#rough2)">最小的正偶数是 2</text>
  <text x="486" y="236" font-size="12" fill="#7a3a35" filter="url(#rough2)">所以 w 至少要 2 + 2 = 4</text>
  <text x="486" y="270" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">⇒ w = 2 只能输出 NO</text>
  <text x="486" y="298" font-size="11.5" fill="#8a3b36" filter="url(#rough2)">（偶数但不够大，是最容易漏的坑）</text>

  <!-- 底部判定表 -->
  <rect x="26" y="336" width="688" height="100" rx="10" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="44" y="360" font-size="12" fill="#555" filter="url(#rough2)">w = 1 … 10 的判定（✓ 表示 YES）</text>
  <g filter="url(#rough2)">
    <rect x="50" y="370" width="56" height="42" fill="#fde8e8" stroke="#d99a96" stroke-width="1.2"/>
    <rect x="114" y="370" width="56" height="42" fill="#fde8e8" stroke="#d99a96" stroke-width="1.2"/>
    <rect x="178" y="370" width="56" height="42" fill="#fde8e8" stroke="#d99a96" stroke-width="1.2"/>
    <rect x="242" y="370" width="56" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="306" y="370" width="56" height="42" fill="#fde8e8" stroke="#d99a96" stroke-width="1.2"/>
    <rect x="370" y="370" width="56" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="434" y="370" width="56" height="42" fill="#fde8e8" stroke="#d99a96" stroke-width="1.2"/>
    <rect x="498" y="370" width="56" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="562" y="370" width="56" height="42" fill="#fde8e8" stroke="#d99a96" stroke-width="1.2"/>
    <rect x="626" y="370" width="56" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
  </g>
  <text x="78" y="387" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">1</text>
  <text x="142" y="387" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">2</text>
  <text x="206" y="387" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">3</text>
  <text x="270" y="387" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">4</text>
  <text x="334" y="387" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">5</text>
  <text x="398" y="387" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">6</text>
  <text x="462" y="387" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">7</text>
  <text x="526" y="387" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">8</text>
  <text x="590" y="387" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">9</text>
  <text x="654" y="387" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">10</text>
  <text x="78" y="406" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="142" y="406" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="206" y="406" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="270" y="406" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="334" y="406" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="398" y="406" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="462" y="406" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="526" y="406" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="590" y="406" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="654" y="406" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
</svg>
