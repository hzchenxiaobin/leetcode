<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" width="820" height="430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="820" height="430" fill="#fafafa"/>

  <text x="410" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">示例演算：a = [3, 1, 7, 2, 6]，p = [3, 1, 5, 2, 4]（逆序加点）</text>

  <!-- 表头 -->
  <rect x="36" y="60" width="748" height="34" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="66" y="82" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">步骤</text>
  <text x="126" y="82" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">加入的位置（值）</text>
  <text x="286" y="82" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">场上数组</text>
  <text x="452" y="82" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">关键事件（块的变化）</text>
  <text x="686" y="82" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">块数</text>
  <text x="748" y="82" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">ans</text>

  <!-- 行 1 -->
  <rect x="36" y="98" width="748" height="48" rx="7" fill="#ffffff" stroke="#d8d8d8" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="66" y="127" font-size="12" fill="#444" filter="url(#rough2)">1</text>
  <text x="126" y="127" font-size="12" fill="#444" filter="url(#rough2)">4（2）</text>
  <text x="286" y="127" font-size="12" fill="#444" filter="url(#rough2)">[2]</text>
  <text x="452" y="127" font-size="12" fill="#444" filter="url(#rough2)">空场加第一个元素 → 开首块</text>
  <text x="690" y="127" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">1</text>
  <text x="752" y="127" font-size="12.5" fill="#8c3a37" filter="url(#rough2)">0</text>

  <!-- 行 2 -->
  <rect x="36" y="150" width="748" height="48" rx="7" fill="#f7f9fc" stroke="#d8d8d8" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="66" y="179" font-size="12" fill="#444" filter="url(#rough2)">2</text>
  <text x="126" y="179" font-size="12" fill="#444" filter="url(#rough2)">2（1）</text>
  <text x="286" y="179" font-size="12" fill="#444" filter="url(#rough2)">[1, 2]</text>
  <text x="452" y="179" font-size="12" fill="#444" filter="url(#rough2)">1 &lt; 2：左邻居战力 1，硬夺魁 → 新块</text>
  <text x="690" y="179" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">2</text>
  <text x="752" y="179" font-size="12.5" fill="#8c3a37" filter="url(#rough2)">1</text>

  <!-- 行 3 -->
  <rect x="36" y="202" width="748" height="48" rx="7" fill="#ffffff" stroke="#d8d8d8" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="66" y="231" font-size="12" fill="#444" filter="url(#rough2)">3</text>
  <text x="126" y="231" font-size="12" fill="#444" filter="url(#rough2)">5（6）</text>
  <text x="286" y="231" font-size="12" fill="#444" filter="url(#rough2)">[1, 2, 6]</text>
  <text x="452" y="231" font-size="12" fill="#444" filter="url(#rough2)">2 &lt; 6：夺魁 → 新块，块数 2 → 3</text>
  <text x="690" y="231" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">3</text>
  <text x="752" y="231" font-size="12.5" fill="#8c3a37" filter="url(#rough2)">2</text>

  <!-- 行 4 -->
  <rect x="36" y="254" width="748" height="48" rx="7" fill="#f7f9fc" stroke="#d8d8d8" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="66" y="283" font-size="12" fill="#444" filter="url(#rough2)">4</text>
  <text x="126" y="283" font-size="12" fill="#444" filter="url(#rough2)">1（3）</text>
  <text x="286" y="283" font-size="12" fill="#444" filter="url(#rough2)">[3, 1, 2, 6]</text>
  <text x="452" y="283" font-size="12" fill="#444" filter="url(#rough2)">3 ≥ 1：连吞 3 块 → 块数 4 → 1</text>
  <text x="690" y="283" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">1</text>
  <text x="752" y="283" font-size="12.5" fill="#8c3a37" filter="url(#rough2)">0</text>

  <!-- 行 5 -->
  <rect x="36" y="306" width="748" height="48" rx="7" fill="#ffffff" stroke="#d8d8d8" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="66" y="335" font-size="12" fill="#444" filter="url(#rough2)">5</text>
  <text x="126" y="335" font-size="12" fill="#444" filter="url(#rough2)">3（7）</text>
  <text x="286" y="335" font-size="12" fill="#444" filter="url(#rough2)">[3, 1, 7, 2, 6]</text>
  <text x="452" y="335" font-size="12" fill="#444" filter="url(#rough2)">4 &lt; 7：夺魁；7 再吞 2、6 → 块数 2</text>
  <text x="690" y="335" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">2</text>
  <text x="752" y="335" font-size="12.5" fill="#8c3a37" filter="url(#rough2)">1</text>

  <path d="M 410 358 L 410 372" stroke="#4a7a3a" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120" y="374" width="580" height="44" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="410" y="393" text-anchor="middle" font-size="12.5" fill="#33582a" filter="url(#rough2)">答案按 i = 0 → n−1 输出：把各行 ans 倒过来写，就得到 1 0 2 1 0 ✓</text>
  <text x="410" y="411" text-anchor="middle" font-size="11.8" fill="#4a7a3a" filter="url(#rough2)">本题输出 1 0 2 1 0 ✓ —— 块数 −1 与官方答案完全一致，且每次合并都是整块合并</text>
</svg>
