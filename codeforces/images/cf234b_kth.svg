<svg xmlns="http://www.w3.org/2000/svg" width="840" height="300" viewBox="0 0 840 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="300" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">排序取前 k，答案 = 第 k 大</text>
  <text x="420" y="100" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">亮度降序：40, 30, 20, 10, 10</text>
  <g filter="url(#rough2)"><rect x="270" y="130" width="50" height="40" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="295" y="156" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">40</text>
  <g filter="url(#rough2)"><rect x="330" y="130" width="50" height="40" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="355" y="156" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">30</text>
  <g filter="url(#rough2)"><rect x="390" y="130" width="50" height="40" rx="4" fill="#d7ecd0" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="415" y="156" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">20</text>
  <g filter="url(#rough2)"><rect x="450" y="130" width="50" height="40" rx="4" fill="#f2f2f2" fill-opacity="0.85" stroke="#cccccc" stroke-width="1.3"/></g>
  <text x="475" y="156" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">10</text>
  <g filter="url(#rough2)"><rect x="510" y="130" width="50" height="40" rx="4" fill="#f2f2f2" fill-opacity="0.85" stroke="#cccccc" stroke-width="1.3"/></g>
  <text x="535" y="156" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">10</text>
  <text x="255" y="190" text-anchor="middle" font-size="10" fill="#3d6b2f" filter="url(#rough2)">前 k=3 个</text>
  <text x="420" y="230" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">答案 20，对应下标 4,3,1（升序 1 3 4）</text>
  <text x="420" y="262" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">O(n log n)</text>
</svg>
