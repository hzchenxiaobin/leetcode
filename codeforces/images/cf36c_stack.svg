<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="720" height="430" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2 的三个碗（底高 0、5、15）</text>
  <path d="M 200 40 Q 360 46 520 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <line x1="300" y1="60" x2="300" y2="390" stroke="#aaa" stroke-width="1" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <line x1="120" y1="390" x2="480" y2="390" stroke="#2b2b2b" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- 碗1：底0 顶50，r30 R80 -->
  <path d="M 180 390 L 300 200 L 420 390" fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="440" y="300" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">碗1：h=50</text>

  <!-- 碗2：底5 顶40，r25 R70 -->
  <path d="M 190 370 L 300 230 L 410 370" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="440" y="250" font-size="10.5" fill="#a33a36" filter="url(#rough2)">碗2：底5，h=35</text>

  <!-- 碗3：底15 顶55，r10 R90 -->
  <path d="M 160 330 L 300 170 L 440 330" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="460" y="190" font-size="10.5" fill="#2f5223" filter="url(#rough2)">碗3：底15，h=40</text>

  <!-- 高度标注 -->
  <line x1="120" y1="390" x2="120" y2="170" stroke="#888" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <g font-size="10.5" fill="#555" filter="url(#rough2)">
    <text x="105" y="394" text-anchor="end">0</text>
    <text x="105" y="372" text-anchor="end">5</text>
    <text x="105" y="334" text-anchor="end">15</text>
    <text x="105" y="204" text-anchor="end">50</text>
    <text x="105" y="174" text-anchor="end">55</text>
  </g>
  <line x1="120" y1="170" x2="160" y2="170" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="500" y="120" font-size="11" fill="#2b2b2b" filter="url(#rough2)">最终高度 55 = 碗3 底 15 + 高 40</text>

  <rect x="40" y="398" width="640" height="0" fill="none"/>
</svg>
