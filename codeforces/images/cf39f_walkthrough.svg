<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="311"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="300" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1：蚊子 1..5，跳长 2 / 3 / 4</text>
  <g font-size="12.5" filter="url(#rough2)">
    <text x="90" y="80" fill="#666">青蛙</text>
    <text x="220" y="80" fill="#666">踩到的山丘</text>
    <text x="460" y="80" fill="#666">压死数</text>
  </g>
  <g stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)">
    <line x1="80" y1="92" x2="640" y2="92"/><line x1="80" y1="132" x2="640" y2="132"/><line x1="80" y1="172" x2="640" y2="172"/>
  </g>
  <g font-size="13" filter="url(#rough2)">
    <text x="90" y="120" fill="#2b2b2b">d=2</text><text x="220" y="120" fill="#2b2b2b">2, 4</text><text x="460" y="120" fill="#8f3b37">2</text>
    <text x="90" y="160" fill="#2f5223">d=3</text><text x="220" y="160" fill="#2f5223">3</text><text x="460" y="160" font-weight="bold" fill="#2f5223">1</text>
    <text x="90" y="200" fill="#2f5223">d=4</text><text x="220" y="200" fill="#2f5223">4</text><text x="460" y="200" font-weight="bold" fill="#2f5223">1</text>
  </g>
  <rect x="80" y="222" width="560" height="56" rx="9" fill="#eef4ec" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="96" y="246" font-size="12.5" fill="#2f5223" filter="url(#rough2)">最小值 1，达到它的青蛙编号是 2 和 3。</text>
  <text x="96" y="268" font-size="12.5" fill="#2f5223" filter="url(#rough2)">输出：第一行 2，第二行 2 3。</text>
</svg>
