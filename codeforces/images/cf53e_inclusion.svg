<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420">
<defs>
  <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs>
<rect x="0" y="0" width="760" height="420" fill="#fafafa"/>
<text x="380.0" y="34" font-size="22" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="bold" text-anchor="middle" filter="url(#rough2)">容斥：把“至少包含 S 这些叶子”纠正为“叶子集恰好为 T”</text>
<text x="40" y="80" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="normal" text-anchor="start" filter="url(#rough2)">g(S) = Σ_{T ⊇ S} e(T)   （e(T)：叶子集恰好为 T 的生成树数）</text>
<text x="40" y="120" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#1a5fb4" font-weight="normal" text-anchor="start" filter="url(#rough2)">于是  Σ_{|S|≥k} (-1)^{|S|-k} C(|S|,k) g(S) = Σ_{|T|=k} e(T)</text>
<text x="40" y="170" font-size="15" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="normal" text-anchor="start" filter="url(#rough2)">n=4, k=2 时的系数：</text>
<rect x="80" y="200" width="150" height="52" rx="8" fill="#e6f4ea" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="155.0" y="231.25" font-size="15" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">|S|=2 → +1</text>
<rect x="260" y="200" width="150" height="52" rx="8" fill="#fff4d6" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="335.0" y="231.25" font-size="15" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">|S|=3 → -3</text>
<rect x="440" y="200" width="150" height="52" rx="8" fill="#fde8e8" stroke="#7a7a7a" stroke-width="2" filter="url(#rough2)"/>
<text x="515.0" y="231.25" font-size="15" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#333333" font-weight="normal" text-anchor="middle" filter="url(#rough2)">|S|=4 → +6</text>
<text x="40" y="300" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="normal" text-anchor="start" filter="url(#rough2)">因为对固定的 T，Σ_{j=k}^{|T|} C(|T|,j)(-1)^{j-k}C(j,k)</text>
<text x="40" y="328" font-size="14" font-family="Comic Sans MS, Kaiti SC, STKaiti, cursive" fill="#444444" font-weight="normal" text-anchor="start" filter="url(#rough2)">= C(|T|,k)(1-1)^{|T|-k}，只有 |T| = k 时为 1</text>
</svg>
