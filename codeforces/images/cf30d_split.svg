<svg xmlns="http://www.w3.org/2000/svg" width="740" height="320" viewBox="0 0 740 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="181"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="dr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="740" height="320" fill="#fafafa"/>
  <text x="370" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2：0 → 1 → P → 2，长度 1 + 1.414 + 1.414</text>
  <line x1="60" y1="190" x2="680" y2="190" stroke="#c9ced6" stroke-width="1.8" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <circle cx="120" cy="190" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="120" y="222" text-anchor="middle" font-size="13" fill="#2f4a66">0</text>
    <circle cx="380" cy="190" r="12" fill="#fce8e6" stroke="#b85450" stroke-width="2"/>
    <text x="380" y="222" text-anchor="middle" font-size="13" fill="#8f3b37">1（起点）</text>
    <circle cx="640" cy="190" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="640" y="222" text-anchor="middle" font-size="13" fill="#2f4a66">2</text>
    <circle cx="380" cy="100" r="12" fill="#fdf3e3" stroke="#d6a040" stroke-width="2"/>
    <text x="380" y="78" text-anchor="middle" font-size="13" fill="#8a6015">P</text>
  </g>
  <line x1="368" y1="190" x2="132" y2="190" stroke="#4a7a3a" stroke-width="2.6" filter="url(#rough2)"/>
  <text x="250" y="180" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">1 → 0，覆盖 [0,1]</text>
  <line x1="120" y1="178" x2="368" y2="108" stroke="#b85450" stroke-width="2.6" filter="url(#rough2)"/>
  <text x="200" y="130" text-anchor="middle" font-size="11.5" fill="#8f3b37" filter="url(#rough2)">0 → P（1.414）</text>
  <line x1="392" y1="108" x2="628" y2="180" stroke="#b85450" stroke-width="2.6" filter="url(#rough2)"/>
  <text x="540" y="130" text-anchor="middle" font-size="11.5" fill="#8f3b37" filter="url(#rough2)">P → 2（1.414）</text>

  <rect x="60" y="244" width="620" height="56" rx="9" fill="#eef4ec" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="76" y="268" font-size="12.5" fill="#2f5223" filter="url(#rough2)">总长 = 1 + 1.414 + 1.414 = 3.828；只覆盖不走 P 的话要 2 + 2 = 4。</text>
  <text x="76" y="290" font-size="12.5" fill="#2f5223" filter="url(#rough2)">"跨过 P"省下的是"从 1 折回 0"这一段。</text>
</svg>
