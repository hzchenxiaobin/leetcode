<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>
  <rect width="720" height="440" fill="#fafafa"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">容斥展开 + 一次 SOS，把 O(2^K) 个 mask 全部算出来</text>
  <path d="M 200 43 Q 360 49 520 43" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <rect x="56" y="76" width="300" height="126" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="72" y="102" text-anchor="start" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">候选对 (u, v, D, 权 w)</text>
  <text x="72" y="128" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">对每个 T 满足：</text>
  <text x="72" y="150" text-anchor="start" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">D ⊆ T  且  u,v ∉ T</text>
  <text x="72" y="176" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">就把 w 累加进 ans(T)</text>
  <text x="72" y="196" text-anchor="start" font-size="10.5" fill="#777777" filter="url(#rough2)">（T = 被删字母集合）</text>
  <rect x="372" y="76" width="292" height="126" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="388" y="102" text-anchor="start" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">u,v ∉ T 用容斥拆开</text>
  <text x="388" y="130" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">[u∉T] = 1 - [u∈T]</text>
  <text x="388" y="154" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">A[D]        += w</text>
  <text x="388" y="174" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">A[D∪{u}]   -= w</text>
  <text x="388" y="194" text-anchor="start" font-size="10.5" fill="#2b2b2b" filter="url(#rough2)">A[D∪{v}]   -= w,  A[D∪{u,v}] += w</text>
  <path d="M 206 202 L 206 232" stroke="#2b2b2b" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="214" y="224" text-anchor="start" font-size="10.5" fill="#777777" filter="url(#rough2)">每个候选对只做 ≤4 次「超集累加」</text>
  <rect x="120" y="244" width="480" height="78" rx="7" fill="#e9f4e2" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="136" y="270" text-anchor="start" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">一次子集和（SOS）：F[T] = Σ_{X ⊆ T} A[X]</text>
  <text x="136" y="296" text-anchor="start" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">O(K·2^K) = 22 × 4.2M ≈ 9×10^7 次加法</text>
  <text x="136" y="316" text-anchor="start" font-size="11" fill="#3c5e2e" filter="url(#rough2)">F[T] 就是「删掉 T 后剩下的串」的相邻风险</text>
  <text x="120" y="352" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">再加上删除代价 Σ_{i∈T} t_i，与 T 比较即可计数。</text>
  <text x="120" y="378" text-anchor="start" font-size="11.5" fill="#777777" filter="url(#rough2)">候选对总数 ≤ N·K（每个位置最多 K 个「首次出现」），整体 O(NK + K·2^K)。</text>
  <text x="360" y="414" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5aa0" filter="url(#rough2)">关键：两个禁位只有 2 个，容斥只有 4 项；禁集 D 直接当超集下界。</text>
</svg>
