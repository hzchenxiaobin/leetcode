<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect x="-3" y="-3" width="726" height="436" fill="#fafafa" filter="url(#rough2)"/>

  <text x="360" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">样例走查：a = [1,1,2,2,2]，f(a) = 2，两轮问完</text>

  <!-- 表头 -->
  <text x="86" y="60" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">袋子</text>
  <text x="166" y="60" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">a_i</text>
  <text x="276" y="60" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">编码 (第1位, 第2位)</text>
  <text x="466" y="60" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">第 1 轮 b_i</text>
  <text x="596" y="60" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">第 2 轮 b_i</text>

  <!-- 第 1 行 -->
  <text x="86" y="92" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">袋 1</text>
  <text x="166" y="92" text-anchor="middle" font-size="13" fill="#2f4f6f" filter="url(#rough2)">1</text>
  <text x="276" y="92" text-anchor="middle" font-size="13" fill="#8a6d1f" filter="url(#rough2)">(0, 0)</text>
  <rect x="436" y="76" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="466" y="92" text-anchor="middle" font-size="13" fill="#33502a" filter="url(#rough2)">0</text>
  <rect x="566" y="76" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="596" y="92" text-anchor="middle" font-size="13" fill="#33502a" filter="url(#rough2)">0</text>

  <!-- 第 2 行 -->
  <text x="86" y="126" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">袋 2</text>
  <text x="166" y="126" text-anchor="middle" font-size="13" fill="#2f4f6f" filter="url(#rough2)">1</text>
  <text x="276" y="126" text-anchor="middle" font-size="13" fill="#8a6d1f" filter="url(#rough2)">(1, 0)</text>
  <rect x="436" y="110" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="466" y="126" text-anchor="middle" font-size="13" fill="#2f4f6f" filter="url(#rough2)">1</text>
  <rect x="566" y="110" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="596" y="126" text-anchor="middle" font-size="13" fill="#2f4f6f" filter="url(#rough2)">0</text>

  <!-- 第 3 行 -->
  <text x="86" y="160" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">袋 3</text>
  <text x="166" y="160" text-anchor="middle" font-size="13" fill="#2f4f6f" filter="url(#rough2)">2</text>
  <text x="276" y="160" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">(1, 1)</text>
  <rect x="436" y="144" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="466" y="160" text-anchor="middle" font-size="13" fill="#2f4f6f" filter="url(#rough2)">1</text>
  <rect x="566" y="144" width="60" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="596" y="160" text-anchor="middle" font-size="13" fill="#8a3030" filter="url(#rough2)">1</text>

  <!-- 第 4 行 -->
  <text x="86" y="194" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">袋 4</text>
  <text x="166" y="194" text-anchor="middle" font-size="13" fill="#2f4f6f" filter="url(#rough2)">2</text>
  <text x="276" y="194" text-anchor="middle" font-size="13" fill="#8a6d1f" filter="url(#rough2)">(0, 1)</text>
  <rect x="436" y="178" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="466" y="194" text-anchor="middle" font-size="13" fill="#33502a" filter="url(#rough2)">0</text>
  <rect x="566" y="178" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="596" y="194" text-anchor="middle" font-size="13" fill="#2f4f6f" filter="url(#rough2)">1</text>

  <!-- 第 5 行 -->
  <text x="86" y="228" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">袋 5</text>
  <text x="166" y="228" text-anchor="middle" font-size="13" fill="#2f4f6f" filter="url(#rough2)">2</text>
  <text x="276" y="228" text-anchor="middle" font-size="13" fill="#8a6d1f" filter="url(#rough2)">(2, 0)</text>
  <rect x="436" y="212" width="60" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="466" y="228" text-anchor="middle" font-size="13" fill="#8a6d1f" filter="url(#rough2)">2</text>
  <rect x="566" y="212" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="596" y="228" text-anchor="middle" font-size="13" fill="#33502a" filter="url(#rough2)">0</text>

  <text x="360" y="252" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">每轮的总取币数 B 都是我们选的常数：第 1 轮 B = 4，第 2 轮 B = 2</text>

  <path d="M240,258 L200,272" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M480,258 L520,272" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 情形 A -->
  <rect x="40" y="276" width="300" height="112" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="9" filter="url(#rough2)"/>
  <text x="56" y="300" font-size="12.5" fill="#8a6d1f" filter="url(#rough2)">若隐藏袋是 5 号（数字 2）</text>
  <text x="56" y="324" font-size="12" fill="#333" filter="url(#rough2)">W = 7·4 − 2 = 26</text>
  <text x="56" y="346" font-size="12" fill="#333" filter="url(#rough2)">反推 7·4 − 26 = 2 → 只有 5 号是 2</text>
  <text x="56" y="370" font-size="12" fill="#33502a" filter="url(#rough2)">1 次询问就结束（≤ f(a)）</text>

  <!-- 情形 B -->
  <rect x="380" y="276" width="300" height="112" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="9" filter="url(#rough2)"/>
  <text x="396" y="300" font-size="12.5" fill="#8a3030" filter="url(#rough2)">若隐藏袋是 3 号（数字 1）</text>
  <text x="396" y="324" font-size="12" fill="#333" filter="url(#rough2)">第1轮 W = 7·4 − 1 = 27 → 反推 1，候选 {2,3}</text>
  <text x="396" y="346" font-size="12" fill="#333" filter="url(#rough2)">第2轮 B=2，W = 7·2 − 1 = 13 → 反推 1</text>
  <text x="396" y="370" font-size="12" fill="#33502a" filter="url(#rough2)">只剩 3 号，共用 2 次 = f(a)</text>

  <text x="360" y="410" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">注意：每轮的答案都只是「隐藏袋的那一位数字」，所以候选集按位逐轮过滤</text>
</svg>
