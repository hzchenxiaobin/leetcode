<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="229"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="340" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">DP 状态：(处理到第 i 条, 已用修改数 j, 朝向 d, 位置 p)</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">每个位置 i 决定「保持」还是「改掉」，改掉花 1 次修改</text>
  <g filter="url(#rough2)"><rect x="60" y="96" width="240" height="70" rx="6" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="180" y="122" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">dp[i][j][d][p]</text>
  <text x="180" y="148" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">是否可达</text>
  <g filter="url(#rough2)"><line x1="304" y1="131" x2="372" y2="131" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)"/></g>
  <text x="338" y="120" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">第 i 条</text>
  <g filter="url(#rough2)"><rect x="376" y="88" width="210" height="86" rx="6" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="481" y="112" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">保持原命令</text>
  <text x="481" y="136" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">F：p += d</text>
  <text x="481" y="158" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">T：d = −d</text>
  <g filter="url(#rough2)"><rect x="600" y="88" width="240" height="86" rx="6" fill="#f3d9d6" fill-opacity="0.85" stroke="#8a2b28" stroke-width="1.4"/></g>
  <text x="720" y="112" text-anchor="middle" font-size="12" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">改成另一个（j+1）</text>
  <text x="720" y="136" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">F→T：d = −d</text>
  <text x="720" y="158" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">T→F：p += d</text>
  <text x="450" y="208" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">终态筛选：j ≤ n 且 (n − j) 为偶数（多出来的修改两两成对浪费）</text>
  <text x="450" y="240" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 = 所有合格终态的 max |p|</text>
  <text x="450" y="276" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">规模：100 × 51 × 2 × 201 ≈ 2×10⁶ 个状态</text>
  <text x="450" y="302" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">位置用偏移量表示，避免负下标</text>
</svg>
