<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-6%" y="-6%" width="112%" height="112%"><feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="399" /><feDisplacementMap in="SourceGraphic" scale="1.5" /></filter></defs>
  <rect width="760" height="430" fill="#fafafa" />
  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">区间 DP：dp[l][r] = 区间 [l,r] 内最多选几个</text>
  <path d="M 100 44 Q 380 50 660 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)" />

  <line x1="80" y1="120" x2="680" y2="120" stroke="#999" stroke-width="1.2" filter="url(#rough2)" />
  <circle cx="150" cy="120" r="4" fill="#2b2b2b" filter="url(#rough2)" />
  <circle cx="610" cy="120" r="4" fill="#2b2b2b" filter="url(#rough2)" />
  <text x="150" y="110" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">l</text>
  <text x="610" y="110" text-anchor="middle" font-size="11" fill="#2b2b2b" filter="url(#rough2)">r</text>

  <path d="M 150 132 Q 380 180 610 132" fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)" />
  <text x="380" y="176" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">外层区间 [l,r]（若存在，答案 +1）</text>

  <line x1="150" y1="210" x2="380" y2="210" stroke="#4a7a3a" stroke-width="3" filter="url(#rough2)" />
  <line x1="380" y1="232" x2="610" y2="232" stroke="#d6a040" stroke-width="3" filter="url(#rough2)" />
  <text x="265" y="204" text-anchor="middle" font-size="10.5" fill="#2f5223" filter="url(#rough2)">dp[l][y]：左边一段</text>
  <text x="495" y="226" text-anchor="middle" font-size="10.5" fill="#8a6015" filter="url(#rough2)">dp[y][r]：右边一段</text>
  <text x="380" y="258" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">在 y 处切开，左右两段只在 y 相切，合法</text>

  <rect x="50" y="282" width="660" height="120" rx="10" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.5" filter="url(#rough2)" />
  <text x="70" y="308" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">转移</text>
  <text x="70" y="334" font-size="12" fill="#2f4a66" filter="url(#rough2)">dp[l][r] = max( dp[l+1][r],  max_{y 是某个以 l 为左端点的区间右端, y&lt;r} (dp[l][y] + dp[y][r]) )</text>
  <text x="70" y="358" font-size="12" fill="#2f5223" filter="url(#rough2)">若存在区间恰好 [l,r]，再 +1（它包含区间内所有选中的圆）。</text>
  <text x="70" y="382" font-size="11.5" fill="#777" filter="url(#rough2)">坐标离散化后 m ≤ 4000；按 l 从大到小、r 从小到大计算，保证子区间已算好。</text>
</svg>