<svg xmlns="http://www.w3.org/2000/svg" width="720" height="310" viewBox="0 0 720 310"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="421"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="310" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">枚举买入日 i 与卖出日 j ≥ i</text>
  <g filter="url(#rough2)">    <rect x="100" y="110" width="80" height="80" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="140" y="210" text-anchor="middle" font-size="12" fill="#666">第 1 天</text>
    <text x="140" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66">4</text>
    <rect x="230" y="150" width="80" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="270" y="210" text-anchor="middle" font-size="12" fill="#666">第 2 天</text>
    <text x="270" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66">2</text>
    <rect x="360" y="130" width="80" height="60" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="400" y="210" text-anchor="middle" font-size="12" fill="#666">第 3 天</text>
    <text x="400" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66">3</text>
    <rect x="490" y="170" width="80" height="20" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="530" y="210" text-anchor="middle" font-size="12" fill="#666">第 4 天</text>
    <text x="530" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66">1</text>
  </g>
  <text x="230" y="240" text-anchor="middle" font-size="12" fill="#8f3b37" filter="url(#rough2)">买：花光，得 ⌊b/a_i⌋ 美元</text>
  <text x="490" y="240" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">卖：金额 = 剩余 + 美元数 × a_j</text>
  <rect x="80" y="256" width="560" height="44" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="96" y="283" font-size="12.5" fill="#8a6015" filter="url(#rough2)">取所有 (i, j) 的最大值，并与"不交易"的 b 比较。</text>
</svg>
