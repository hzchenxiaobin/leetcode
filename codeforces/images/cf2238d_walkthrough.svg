<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="470" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">n = 120 = 2³ · 3 · 5 的 7 层构造（Ω = 5，ω = 3 ⇒ 答案 7）</text>
  <text x="380" y="54" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#rough2)">ω 个质数各占一层（L1–L3）；其余的 x 放进第 ω − 1 + Ω(x) 层</text>

  <!-- 表头 -->
  <text x="100" y="88" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555" filter="url(#rough2)">层</text>
  <text x="380" y="88" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555" filter="url(#rough2)">该层的因数（同层相邻元素 gcd &gt; 1）</text>
  <text x="668" y="88" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555" filter="url(#rough2)">Ω(x)</text>
  <path d="M 62 98 L 700 98" stroke="#bbb" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- L1: 2 -->
  <rect x="62" y="108" width="638" height="34" rx="8" fill="#fdf0f4" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="100" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#a4463f" filter="url(#rough2)">L1</text>
  <rect x="170" y="114" width="48" height="22" rx="5" fill="#ffffff" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="194" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#a4463f" filter="url(#rough2)">2</text>
  <text x="668" y="130" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">1</text>

  <!-- L2: 3 -->
  <rect x="62" y="150" width="638" height="34" rx="8" fill="#fdf0f4" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="100" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#a4463f" filter="url(#rough2)">L2</text>
  <rect x="170" y="156" width="48" height="22" rx="5" fill="#ffffff" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="194" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#a4463f" filter="url(#rough2)">3</text>
  <text x="668" y="172" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">1</text>

  <!-- L3: 5 -->
  <rect x="62" y="192" width="638" height="34" rx="8" fill="#fdf0f4" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="100" y="214" text-anchor="middle" font-size="13" font-weight="bold" fill="#a4463f" filter="url(#rough2)">L3</text>
  <rect x="170" y="198" width="48" height="22" rx="5" fill="#ffffff" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="194" y="214" text-anchor="middle" font-size="13" font-weight="bold" fill="#a4463f" filter="url(#rough2)">5</text>
  <text x="668" y="214" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">1</text>

  <!-- L4: 4 6 10 15 -->
  <rect x="62" y="234" width="638" height="34" rx="8" fill="#eef4fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="100" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#rough2)">L4</text>
  <rect x="170" y="240" width="48" height="22" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="194" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#rough2)">4</text>
  <rect x="230" y="240" width="48" height="22" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="254" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#rough2)">6</text>
  <rect x="290" y="240" width="48" height="22" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="314" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#rough2)">10</text>
  <rect x="350" y="240" width="48" height="22" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="374" y="256" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#rough2)">15</text>
  <text x="668" y="256" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">2</text>

  <!-- L5: 8 12 20 30 -->
  <rect x="62" y="276" width="638" height="34" rx="8" fill="#eef4fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="100" y="298" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#rough2)">L5</text>
  <rect x="170" y="282" width="48" height="22" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="194" y="298" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#rough2)">8</text>
  <rect x="230" y="282" width="48" height="22" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="254" y="298" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#rough2)">12</text>
  <rect x="290" y="282" width="48" height="22" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="314" y="298" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#rough2)">20</text>
  <rect x="350" y="282" width="48" height="22" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="374" y="298" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#rough2)">30</text>
  <text x="668" y="298" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">3</text>

  <!-- L6: 24 40 60 -->
  <rect x="62" y="318" width="638" height="34" rx="8" fill="#eef4fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="100" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#rough2)">L6</text>
  <rect x="170" y="324" width="48" height="22" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="194" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#rough2)">24</text>
  <rect x="230" y="324" width="48" height="22" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="254" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#rough2)">40</text>
  <rect x="290" y="324" width="48" height="22" rx="5" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="314" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#33517a" filter="url(#rough2)">60</text>
  <text x="668" y="340" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">4</text>

  <!-- L7: 120 -->
  <rect x="62" y="360" width="638" height="34" rx="8" fill="#eef8ef" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="100" y="382" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">L7</text>
  <rect x="170" y="366" width="48" height="22" rx="5" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="194" y="382" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#rough2)">120</text>
  <text x="668" y="382" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">5</text>

  <text x="380" y="424" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">同层 gcd 链示例：4 — 6 — 10 — 15（相邻公因数 2、2、5）</text>
  <text x="380" y="446" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">每个真因数都在更早的层 ⇒ 条件 1；同层可连成链 ⇒ 条件 2；层数 7 = Ω + ω − 1</text>
</svg>
