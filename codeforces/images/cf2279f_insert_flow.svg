<svg xmlns="http://www.w3.org/2000/svg" width="880" height="664" viewBox="0 0 880 664"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="880" height="664" fill="#fafafa"/>

  <text x="300" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">单个石堆的插入流程（增广路拟阵划分）</text>
  <path d="M 88 44 Q 300 52 512 44" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <rect x="118" y="56" width="364" height="50" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="300" y="78" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">解码 s = a_i ⊕ k_i（k_i = 前 i−1 个的最少颜色数）</text>
  <text x="300" y="97" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">k_1 = 0，逐堆处理，答案取处理完全部后的 k</text>

  <path d="M 300 106 L 300 140" stroke="#446688" stroke-width="1.9" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="300,142 470,184 300,226 130,184" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="180" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">s 让全空间的秩增加？</text>
  <text x="300" y="199" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">即 s ∉ span(已插入的全部石堆)</text>

  <path d="M 470 184 L 540 184" stroke="#4a7a3a" stroke-width="1.9" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="504" y="174" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="544" y="158" width="316" height="52" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="702" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">放进任意一类即可，k 不变</text>
  <text x="702" y="198" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">新增维度只会让每类更"空"，答案不减</text>

  <path d="M 300 226 L 300 256" stroke="#446688" stroke-width="1.9" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="246" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>

  <polygon points="300,258 470,300 300,342 130,300" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="296" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">有"非满"类 C 能直接容纳 s？</text>
  <text x="300" y="315" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">秩 = 全空间秩的类是满的，永远放不进</text>

  <path d="M 470 300 L 540 300" stroke="#4a7a3a" stroke-width="1.9" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="504" y="290" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="544" y="274" width="316" height="52" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="702" y="296" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">直接放进 C，k 不变</text>
  <text x="702" y="314" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">只需扫描非满类，最坏 14 个</text>

  <path d="M 300 342 L 300 372" stroke="#446688" stroke-width="1.9" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="362" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>

  <polygon points="300,374 470,416 300,458 130,416" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="412" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">存在"紧"子空间 V ∋ s？</text>
  <text x="300" y="431" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">|S ∩ V| = k · dim V 就是紧的</text>

  <path d="M 470 416 L 540 416" stroke="#b85450" stroke-width="1.9" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="504" y="406" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="544" y="390" width="316" height="52" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="702" y="412" text-anchor="middle" font-size="13" font-weight="bold" fill="#a14340" filter="url(#rough2)">k ← k + 1（无需搜索）</text>
  <text x="702" y="430" text-anchor="middle" font-size="11.5" fill="#a86a66" filter="url(#rough2)">紧空间里再多一个元素必然超载</text>

  <path d="M 300 458 L 300 486" stroke="#446688" stroke-width="1.9" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="477" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>

  <polygon points="300,488 470,530 300,572 130,530" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="526" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">两步交换：s 顶掉 z，z 落进非满类？</text>
  <text x="300" y="545" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">z 取 s 在该类唯一回路里的元素</text>

  <path d="M 470 530 L 540 530" stroke="#4a7a3a" stroke-width="1.9" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="504" y="520" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="544" y="504" width="316" height="52" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="702" y="526" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">执行交换，k 不变</text>
  <text x="702" y="544" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">绝大多数插入都在这一步结束</text>

  <path d="M 300 572 L 300 598" stroke="#446688" stroke-width="1.9" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="590" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="130" y="600" width="340" height="52" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="300" y="622" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">一般增广路 BFS：找不到出口则 k ← k + 1</text>
  <text x="300" y="640" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">把"需要换家的元素"按交换关系 BFS 展开</text>
</svg>
