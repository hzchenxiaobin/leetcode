<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="117"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="300" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1：两个三角形 + 两条连接边</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">样例 2 少一条连接边 → 出现桥 → 0</text>
  <text x="120" y="110" text-anchor="start" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">三角形 1-2-3、4-5-6，连接边 2-4、3-5</text>
  <text x="120" y="146" text-anchor="start" font-size="11.5" fill="#3d6b2f" filter="url(#rough2)">一种合法定向：1→2→3→1、4→5→6→4、4→2、3→5</text>
  <text x="120" y="182" text-anchor="start" font-size="11.5" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">样例 2 去掉 3-5 后 2-4 成为桥 → 输出 0</text>
  <text x="442" y="240" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">checker：边多重集一致 + 有向图强连通</text>
</svg>
