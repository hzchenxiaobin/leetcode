<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="880" height="470" fill="#fafafa"/>

  <text x="440" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">观测张角只取决于 d/r：站得越远，圆看起来越小</text>
  <path d="M 176 42 Q 440 49 704 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <!-- 圆 O=(230,235) r=70 P=(84,262) d=148.48 -->
  <circle cx="230" cy="235" r="70" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <line x1="84" y1="262" x2="186.32" y2="180.30" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="84" y1="262" x2="208.77" y2="301.70" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="84" y1="262" x2="230" y2="235" stroke="#66788c" stroke-width="1.4" stroke-dasharray="6 5" filter="url(#rough2)"/>
  <circle cx="84" cy="262" r="5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="230" cy="235" r="4.5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="186.32" cy="180.30" r="4" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="208.77" cy="301.70" r="4" fill="#4a7a3a" filter="url(#rough2)"/>
  <path d="M 110.57 240.79 A 34 34 0 0 0 116.40 272.31" fill="none" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 194.4 190.5 L 184.3 198.6 L 176.2 188.4" fill="none" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="238" y="229" font-size="13" fill="#2f4a66" filter="url(#rough2)">O</text>
  <text x="68" y="268" font-size="13" fill="#a14340" filter="url(#rough2)">P</text>
  <text x="196" y="236" font-size="13.5" fill="#8a6015" filter="url(#rough2)">2θ₁</text>
  <text x="195.4" y="264.4" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">r</text>
  <text x="151.0" y="264.5" font-size="12.5" fill="#66788c" filter="url(#rough2)">d</text>
  <text x="192.3" y="196.3" font-size="12" fill="#3c5e2e" filter="url(#rough2)">A</text>
  <text x="202.8" y="293.7" font-size="12" fill="#3c5e2e" filter="url(#rough2)">B</text>

  <!-- 圆 O=(620,235) r=70 P=(486,240) d=134.09 -->
  <circle cx="620" cy="235" r="70" fill="#e6f4ea" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <line x1="486" y1="240" x2="581.26" y2="176.70" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="486" y1="240" x2="585.71" y2="296.03" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="486" y1="240" x2="620" y2="235" stroke="#66788c" stroke-width="1.4" stroke-dasharray="6 5" filter="url(#rough2)"/>
  <circle cx="486" cy="240" r="5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="620" cy="235" r="4.5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="581.26" cy="176.70" r="4" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="585.71" cy="296.03" r="4" fill="#4a7a3a" filter="url(#rough2)"/>
  <path d="M 514.32 221.18 A 34 34 0 0 0 515.64 256.66" fill="none" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 588.5 187.5 L 577.6 194.7 L 570.4 183.9" fill="none" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="628" y="229" font-size="13" fill="#2f4a66" filter="url(#rough2)">O</text>
  <text x="470" y="246" font-size="13" fill="#a14340" filter="url(#rough2)">P</text>
  <text x="588" y="214" font-size="13.5" fill="#8a6015" filter="url(#rough2)">2θ₂</text>
  <text x="578.9" y="261.5" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">r</text>
  <text x="547.0" y="253.5" font-size="12.5" fill="#66788c" filter="url(#rough2)">d</text>
  <text x="587.3" y="192.7" font-size="12" fill="#3c5e2e" filter="url(#rough2)">A</text>
  <text x="579.7" y="288.0" font-size="12" fill="#3c5e2e" filter="url(#rough2)">B</text>


  <text x="230" y="352" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">d = 148.5，sin θ₁ = r/d = 0.471，2θ₁ ≈ 56.3°</text>
  <text x="620" y="352" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">d = 134.1，sin θ₂ = r/d = 0.522，2θ₂ ≈ 62.9°</text>
  <rect x="120" y="378" width="640" height="70" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="440" y="404" text-anchor="middle" font-size="14" fill="#8a6015" filter="url(#rough2)">三个圆张角相同 ⟺ arcsin(r₁/d₁)=arcsin(r₂/d₂)=arcsin(r₃/d₃) ⟺ d₁/r₁ = d₂/r₂ = d₃/r₃</text>
  <text x="440" y="430" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">于是问题变成：找一个点，使它到三个圆心的距离与各自半径成同一比例 t = d/r</text>
</svg>

