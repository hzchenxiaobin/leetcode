<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="300" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">统计"客队客场色 = 主队主场色"的有序对</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">每场比赛至多让主队换一次衣服</text>
  <text x="150" y="110" text-anchor="start" font-size="13" fill="#2b2b2b" filter="url(#rough2)">n 队，每队有主场色 h_i 与客场色 a_i</text>
  <text x="150" y="150" text-anchor="start" font-size="13" fill="#2f4a66" filter="url(#rough2)">j 主场对 i 时：若 a_i == h_j，主队 j 要穿客场服</text>
  <text x="150" y="192" text-anchor="start" font-size="13" fill="#3d6b2f" filter="url(#rough2)">所以答案 = #{(i,j) : i != j 且 a_i == h_j}</text>
  <text x="440" y="250" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">O(n^2)，n&lt;=30</text>
</svg>
