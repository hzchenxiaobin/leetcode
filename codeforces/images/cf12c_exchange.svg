<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="101"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="320" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">C：为什么“大次数配小价格”？——交换论证</text>
  <path d="M 150 42 Q 380 47 610 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 面板 1 -->
  <text x="190" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#8c3a36" filter="url(#rough2)">① 大次数配了大价格</text>
  <rect x="90" y="90" width="80" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="200" y="90" width="80" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="130" y="114" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">次数 3</text>
  <text x="240" y="114" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">次数 1</text>
  <rect x="90" y="170" width="80" height="36" rx="6" fill="#fdeceb" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="200" y="170" width="80" height="36" rx="6" fill="#fdeceb" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="130" y="194" text-anchor="middle" font-size="14" fill="#8c3a36" filter="url(#rough2)">价格 9</text>
  <text x="240" y="194" text-anchor="middle" font-size="14" fill="#8c3a36" filter="url(#rough2)">价格 1</text>
  <line x1="130" y1="126" x2="130" y2="170" stroke="#8c3a36" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="240" y1="126" x2="240" y2="170" stroke="#8c3a36" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="238" text-anchor="middle" font-size="12" fill="#8c3a36" filter="url(#rough2)">总价 = 3×9 + 1×1 = 28</text>

  <!-- 面板 2 -->
  <text x="570" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">② 交换价格标签</text>
  <rect x="470" y="90" width="80" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="580" y="90" width="80" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="510" y="114" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">次数 3</text>
  <text x="620" y="114" text-anchor="middle" font-size="14" fill="#2f4a66" filter="url(#rough2)">次数 1</text>
  <rect x="470" y="170" width="80" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="580" y="170" width="80" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="510" y="194" text-anchor="middle" font-size="14" fill="#2f5223" filter="url(#rough2)">价格 1</text>
  <text x="620" y="194" text-anchor="middle" font-size="14" fill="#2f5223" filter="url(#rough2)">价格 9</text>
  <line x1="510" y1="126" x2="510" y2="170" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="620" y1="126" x2="620" y2="170" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="570" y="238" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">总价 = 3×1 + 1×9 = 12</text>

  <line x1="380" y1="80" x2="380" y2="248" stroke="#ddd" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <rect x="60" y="258" width="640" height="46" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="72" y="287" font-size="12" fill="#8a6015" filter="url(#rough2)">两式相减 = (c₁−c₂)(p₁−p₂) = (3−1)×(9−1) = 16 &gt; 0，所以 ① 一定更贵</text>
</svg>
