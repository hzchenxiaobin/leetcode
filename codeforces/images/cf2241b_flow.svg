<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 396"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="21"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="660" height="396" fill="#fafafa" filter="url(#rough2)"/>

  <text x="330" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    每组数据的算法流程：数位数 → 拼出 y → 直接输出
  </text>
  <text x="330" y="50" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">
    不需要搜索、不需要枚举因子，每组只有一次数位数循环，O(d) ≤ 8 次迭代
  </text>

  <rect x="180" y="66" width="300" height="42" rx="8" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="92" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">
    读入 t，然后每组读入一个 x
  </text>

  <path d="M 330 108 L 330 128" stroke="#446688" stroke-width="1.6" fill="none"
        marker-end="url(#arr3)" filter="url(#rough2)"/>

  <rect x="180" y="130" width="300" height="42" rx="8" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="149" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">
    d ← 位数(x)：while (temp &gt; 0) { d++; temp /= 10; }
  </text>
  <text x="330" y="166" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">
    1 ≤ x &lt; 10^8 ⇒ 1 ≤ d ≤ 8
  </text>

  <path d="M 330 172 L 330 192" stroke="#446688" stroke-width="1.6" fill="none"
        marker-end="url(#arr3)" filter="url(#rough2)"/>

  <rect x="180" y="194" width="300" height="42" rx="8" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="214" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">
    p ← 10^d；y ← p + 1
  </text>
  <text x="330" y="231" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">
    y 的十进制形如 1 0…0 1，只含 0 和 1
  </text>

  <path d="M 330 236 L 330 256" stroke="#446688" stroke-width="1.6" fill="none"
        marker-end="url(#arr3)" filter="url(#rough2)"/>

  <rect x="180" y="258" width="300" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="278" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">
    输出 y（x·y = x·10^d + x = 拼接(x, x)）
  </text>
  <text x="330" y="295" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">
    不需要真的算乘积，构造保证它 good
  </text>

  <path d="M 330 300 L 330 320" stroke="#4a7a3a" stroke-width="1.6" fill="none"
        marker-end="url(#arr3)" filter="url(#rough2)"/>

  <rect x="230" y="322" width="200" height="36" rx="18" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="345" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">还有下一组？回到读入</text>

  <rect x="34" y="66" width="126" height="150" rx="10" fill="#fafafa" stroke="#888"
        stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="97" y="88" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">不用枚举</text>
  <text x="97" y="110" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">枚举 y 从 2 开始</text>
  <text x="97" y="128" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">每组最坏到 10^9，</text>
  <text x="97" y="146" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1e4 组直接 TLE</text>
  <text x="97" y="172" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">构造只需 O(1)</text>
  <text x="97" y="192" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">（按 d 计 O(8)）</text>

  <rect x="502" y="66" width="126" height="150" rx="10" fill="#fafafa" stroke="#888"
        stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="565" y="88" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">尽量别用浮点</text>
  <text x="565" y="110" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">log10(x) 在 8 位</text>
  <text x="565" y="128" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">整数上可能因误差</text>
  <text x="565" y="146" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">算成 7 或 9</text>
  <text x="565" y="172" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">整数除法循环</text>
  <text x="565" y="192" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">绝不会有误差</text>

  <text x="330" y="382" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">
    多测：t ≤ 10^4，每组 O(d)，总计不超过 8 × 10^4 次除法，远在 1 s 之内
  </text>
</svg>
