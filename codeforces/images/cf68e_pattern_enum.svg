<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="43"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="dash" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#7b4fa8"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">方案 = 12 个顶点槽的集合划分；几何只用来判定划分能否实现</text>
  <path d="M 90 40 Q 360 46 630 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 四艘船的顶点槽 -->
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <text x="96" y="72" font-weight="bold" fill="#2f4a66">船 ①</text>
    <rect x="46" y="80" width="34" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="84" y="80" width="34" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="122" y="80" width="34" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="63" y="100" fill="#2f4a66">a₀</text>
    <text x="101" y="100" fill="#2f4a66">a₁</text>
    <text x="139" y="100" fill="#2f4a66">a₂</text>

    <text x="96" y="146" font-weight="bold" fill="#1f5226">船 ②</text>
    <rect x="46" y="154" width="34" height="30" rx="6" fill="#e6f4ea" stroke="#2f7a3a" stroke-width="1.4"/>
    <rect x="84" y="154" width="34" height="30" rx="6" fill="#e6f4ea" stroke="#2f7a3a" stroke-width="1.4"/>
    <rect x="122" y="154" width="34" height="30" rx="6" fill="#e6f4ea" stroke="#2f7a3a" stroke-width="1.4"/>
    <text x="63" y="174" fill="#1f5226">b₀</text>
    <text x="101" y="174" fill="#1f5226">b₁</text>
    <text x="139" y="174" fill="#1f5226">b₂</text>

    <text x="96" y="220" font-weight="bold" fill="#8c2f2b">船 ③</text>
    <rect x="46" y="228" width="34" height="30" rx="6" fill="#fdecea" stroke="#b85450" stroke-width="1.4"/>
    <rect x="84" y="228" width="34" height="30" rx="6" fill="#fdecea" stroke="#b85450" stroke-width="1.4"/>
    <rect x="122" y="228" width="34" height="30" rx="6" fill="#fdecea" stroke="#b85450" stroke-width="1.4"/>
    <text x="63" y="248" fill="#8c2f2b">c₀</text>
    <text x="101" y="248" fill="#8c2f2b">c₁</text>
    <text x="139" y="248" fill="#8c2f2b">c₂</text>

    <text x="96" y="294" font-weight="bold" fill="#8a6015">船 ④</text>
    <rect x="46" y="302" width="34" height="30" rx="6" fill="#fff3c4" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="84" y="302" width="34" height="30" rx="6" fill="#fff3c4" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="122" y="302" width="34" height="30" rx="6" fill="#fff3c4" stroke="#d6a040" stroke-width="1.4"/>
    <text x="63" y="322" fill="#8a6015">d₀</text>
    <text x="101" y="322" fill="#8a6015">d₁</text>
    <text x="139" y="322" fill="#8a6015">d₂</text>
  </g>

  <!-- 右侧：四个塔 -->
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <circle cx="420" cy="90" r="26" fill="#ffffff" stroke="#333" stroke-width="1.8"/>
    <text x="420" y="95" font-weight="bold" fill="#2b2b2b">塔0</text>
    <circle cx="540" cy="90" r="26" fill="#ffffff" stroke="#333" stroke-width="1.8"/>
    <text x="540" y="95" font-weight="bold" fill="#2b2b2b">塔1</text>
    <circle cx="420" cy="230" r="26" fill="#ffffff" stroke="#333" stroke-width="1.8"/>
    <text x="420" y="235" font-weight="bold" fill="#2b2b2b">塔2</text>
    <circle cx="540" cy="230" r="26" fill="#ffffff" stroke="#333" stroke-width="1.8"/>
    <text x="540" y="235" font-weight="bold" fill="#2b2b2b">塔3</text>
  </g>

  <g filter="url(#rough2)" stroke="#7b4fa8" stroke-width="1.5" fill="none" stroke-dasharray="5 4">
    <path d="M 158 95 L 392 90" marker-end="url(#dash)"/>
    <path d="M 158 95 L 512 92" marker-end="url(#dash)"/>
    <path d="M 158 95 L 396 214" marker-end="url(#dash)"/>
    <path d="M 158 169 L 514 92" marker-end="url(#dash)"/>
    <path d="M 158 169 L 396 216" marker-end="url(#dash)"/>
    <path d="M 158 169 L 514 216" marker-end="url(#dash)"/>
    <path d="M 158 243 L 396 220" marker-end="url(#dash)"/>
    <path d="M 158 243 L 514 222" marker-end="url(#dash)"/>
    <path d="M 158 317 L 514 232" marker-end="url(#dash)"/>
  </g>
  <text x="290" y="140" font-size="11" fill="#4b2a70" filter="url(#rough2)">每个槽 → 一个塔（同色箭头 = 同一艘船的三个顶点）</text>

  <!-- 结论 -->
  <rect x="40" y="356" width="640" height="60" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="380" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">同一对塔被两艘船共用 ⇒ 它们之间距离必须同时等于两船对应的边长</text>
  <text x="56" y="402" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">这条"整数平方距离一致性"能在枚举时立刻剪枝；剪不掉的才进入圆-圆交点的几何判定</text>
</svg>
