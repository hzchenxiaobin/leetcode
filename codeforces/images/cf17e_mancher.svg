<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="59"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="360" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">E：Manacher 求出每个中心的半径，再统计“结尾/开头”的个数</text>
  <path d="M 100 42 Q 380 47 660 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <text x="60" y="76" font-size="11.5" fill="#777" filter="url(#rough2)">s = babb（下标从 1 开始）</text>
  <rect x="60" y="84" width="56" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="122" y="84" width="56" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="184" y="84" width="56" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="246" y="84" width="56" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="88" y="112" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">b</text>
  <text x="150" y="112" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">a</text>
  <text x="212" y="112" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">b</text>
  <text x="274" y="112" text-anchor="middle" font-size="16" fill="#2b2b2b" filter="url(#rough2)">b</text>
  <text x="88" y="140" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="150" y="140" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="212" y="140" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="274" y="140" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">4</text>

  <text x="330" y="100" font-size="10.5" fill="#2f5223" filter="url(#rough2)">d1 = 1, 2, 1, 1</text>
  <text x="330" y="122" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">d2 = 0, 0, 0, 1</text>

  <rect x="60" y="160" width="320" height="86" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="72" y="184" font-size="11" font-weight="bold" fill="#2f5223" filter="url(#rough2)">中心 c 的奇回文（半径 1..d1[c]）</text>
  <text x="72" y="208" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">覆盖 [c−r+1, c+r−1]</text>
  <text x="72" y="230" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">结尾 = c+r−1 ∈ [c, c+d1[c]−1]（一段连续区间！）</text>

  <rect x="60" y="258" width="320" height="86" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="72" y="282" font-size="11" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">中心 c 的偶回文（半径 1..d2[c]）</text>
  <text x="72" y="306" font-size="10.5" fill="#3c5e88" filter="url(#rough2)">覆盖 [c−r, c+r−1]</text>
  <text x="72" y="328" font-size="10.5" fill="#3c5e88" filter="url(#rough2)">结尾 ∈ [c, c+d2[c]−1]、开头 ∈ [c−d2[c], c−1]</text>

  <line x1="404" y1="66" x2="404" y2="350" stroke="#ddd" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <rect x="424" y="70" width="310" height="96" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="436" y="94" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">差分数组一次算完</text>
  <text x="436" y="118" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">对每种回文，把 +1 打到区间左端、−1 打到右端+1</text>
  <text x="436" y="140" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">前缀和还原后，endCnt[x] / startCnt[x] 就是答案</text>
  <text x="436" y="160" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">每个中心 O(1)，总复杂度 O(n)。</text>

  <rect x="424" y="180" width="310" height="96" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="436" y="204" font-size="11.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">例子：中心 2（字符 a）</text>
  <text x="436" y="228" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">d1[2] = 2 → 回文「a」「bab」</text>
  <text x="436" y="250" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">结尾分别是 2、3；开头分别是 2、1</text>
  <text x="436" y="270" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">于是 endCnt[2]++、endCnt[3]++ …</text>

  <text x="424" y="306" font-size="10.5" fill="#8c3a36" filter="url(#rough2)">n 最大 2·10^6，必须 O(n) 且常数小；</text>
  <text x="424" y="326" font-size="10.5" fill="#8c3a36" filter="url(#rough2)">回文总数最大到 n(n+1)/2，要用 64 位整数。</text>
</svg>
