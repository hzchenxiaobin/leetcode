<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法：三种「全出一招」的净胜数，取最大者</text>
  <path d="M 104 44 Q 360 51 616 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <rect x="24" y="76" width="200" height="66" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="124" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">全出 P（布）</text>
  <text x="124" y="130" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">净胜 x − y</text>

  <rect x="260" y="76" width="200" height="66" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">全出 R（石头）</text>
  <text x="360" y="130" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">净胜 y − z</text>

  <rect x="496" y="76" width="200" height="66" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="596" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">全出 S（剪刀）</text>
  <text x="596" y="130" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">净胜 z − x</text>

  <path d="M 124 146 L 296 182" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <path d="M 360 146 L 360 182" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <path d="M 596 146 L 424 182" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <rect x="150" y="186" width="420" height="54" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="211" text-anchor="middle" font-size="15" font-weight="bold" fill="#a14340" filter="url(#rough2)">max{ x−y, y−z, z−x } ≥ 0</text>
  <text x="360" y="232" text-anchor="middle" font-size="11" fill="#a14340" filter="url(#rough2)">三者之和为 0，不可能全是负数，故答案必然存在</text>

  <path d="M 360 240 L 360 254" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <rect x="170" y="258" width="380" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="286" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">取到最大的那一招 ch，输出 n 个 ch</text>

  <!-- 柱状示意：x=5, y=4, z=1 -->
  <path d="M 70 350 L 400 350" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="58" y="354" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>

  <rect x="100" y="335" width="52" height="15" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="126" y="329" text-anchor="middle" font-size="11" fill="#3c5e2e" filter="url(#rough2)">1</text>

  <rect x="196" y="305" width="52" height="45" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="222" y="299" text-anchor="middle" font-size="11" fill="#3c5e2e" filter="url(#rough2)">3</text>

  <rect x="292" y="350" width="52" height="60" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="318" y="380" text-anchor="middle" font-size="11" fill="#a14340" filter="url(#rough2)">−4</text>

  <text x="126" y="425" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">x−y</text>
  <text x="222" y="425" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">y−z</text>
  <text x="318" y="425" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">z−x</text>

  <text x="430" y="316" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">例：x=5, y=4, z=1</text>
  <text x="430" y="340" font-size="12" fill="#444" filter="url(#rough2)">x−y=1，y−z=3，z−x=−4</text>
  <text x="430" y="364" font-size="12" fill="#444" filter="url(#rough2)">最大是 y−z=3 ⇒ 全出 R</text>
  <text x="430" y="388" font-size="12" fill="#444" filter="url(#rough2)">最坏净胜 3 局，达标还最优</text>
</svg>
