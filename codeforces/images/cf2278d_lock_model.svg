<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">一次操作 = 选一个符号 s 和一个锁定集 S，代价 = |S|</text>
  <text x="310" y="52" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">s = +1 时：没被锁的元素 +1，锁住的元素原地不动（s = −1 时同理，全部 −1）</text>

  <!-- array row: a = [4, 7, 1, 9, 3], locked = {2, 4} -->
  <text x="128" y="104" text-anchor="end" font-size="13" fill="#666" filter="url(#rough2)">a</text>

  <rect x="150" y="76" width="58" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="179" y="104" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">4</text>

  <rect x="214" y="76" width="58" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="243" y="104" text-anchor="middle" font-size="16" fill="#8a5a00" font-weight="bold" filter="url(#rough2)">7</text>

  <rect x="278" y="76" width="58" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="307" y="104" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">1</text>

  <rect x="342" y="76" width="58" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="371" y="104" text-anchor="middle" font-size="16" fill="#8a5a00" font-weight="bold" filter="url(#rough2)">9</text>

  <rect x="406" y="76" width="58" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="435" y="104" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">3</text>

  <!-- status under each cell -->
  <text x="179" y="142" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">+1</text>
  <text x="243" y="142" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">锁 0</text>
  <text x="307" y="142" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">+1</text>
  <text x="371" y="142" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">锁 0</text>
  <text x="435" y="142" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">+1</text>

  <path d="M 243 122 L 243 128" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 371 122 L 371 128" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <text x="310" y="170" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">这一次：s = +1，S = {2, 4}，代价 = 2，结果 a 变成 [5, 7, 2, 9, 4]</text>

  <!-- formula panel -->
  <rect x="40" y="188" width="540" height="192" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>

  <text x="60" y="216" font-size="12" fill="#333" filter="url(#rough2)">第 j 次操作：符号 s_j ∈ {+1, −1}，锁定集 S_j，代价 |S_j|</text>
  <text x="60" y="244" font-size="12" fill="#333" filter="url(#rough2)">m 次之后：T = Σ s_j，c_i = 元素 i 被锁的次数，L_i = 被锁那几次的符号和</text>
  <text x="60" y="272" font-size="12" fill="#333" filter="url(#rough2)">元素 i 的净变化 = T − L_i    ⇒    总代价 = Σ c_i ≥ Σ |L_i|</text>
  <text x="60" y="300" font-size="12" fill="#333" filter="url(#rough2)">要让所有元素都变成 x：T − L_i = x − a_i，令 y = x − T，则 L_i = a_i − y</text>

  <rect x="52" y="316" width="516" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="310" y="336" text-anchor="middle" font-size="12.5" fill="#3f6b32" font-weight="bold" filter="url(#rough2)">总代价 ≥ Σ |a_i − y| ≥ Σ |a_i − 中位数|</text>
  <text x="310" y="368" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">y 可以任取 ⇒ 下界由中位数取到，剩下的自由度只有「怎么锁」</text>
</svg>
