<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="400" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">一条原树边 → 一个二元集合</text>
  <path d="M 210 42 Q 360 48 510 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 原树 -->
  <text x="150" y="70" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">原树 s（n = 5）</text>
  <g filter="url(#rough2)">
    <line x1="150" y1="150" x2="60" y2="92" stroke="#446688" stroke-width="2"/>
    <line x1="150" y1="150" x2="240" y2="92" stroke="#446688" stroke-width="2"/>
    <line x1="150" y1="150" x2="150" y2="250" stroke="#446688" stroke-width="2"/>
    <line x1="150" y1="250" x2="60" y2="330" stroke="#446688" stroke-width="2"/>
  </g>
  <circle cx="150" cy="150" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="60" cy="92" r="20" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="240" cy="92" r="20" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="150" cy="250" r="20" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="60" cy="330" r="20" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="157" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">1</text>
  <text x="60" y="99" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">2</text>
  <text x="240" y="99" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">3</text>
  <text x="150" y="257" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">4</text>
  <text x="60" y="337" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">5</text>
  <text x="128" y="112" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">e1</text>
  <text x="178" y="112" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">e2</text>
  <text x="168" y="210" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">e3</text>
  <text x="92" y="300" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">e4</text>

  <!-- 箭头 -->
  <path d="M 268 150 C 290 150 300 140 316 136" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="172" font-size="11" fill="#2f4a66" filter="url(#rough2)">一一对应</text>

  <!-- 集合列表 -->
  <rect x="330" y="76" width="330" height="196" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="346" y="102" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">t 的结点（每个都是一条边）</text>
  <text x="346" y="132" font-size="13" fill="#2f5223" filter="url(#rough2)">x1 = {1, 2}   ← e1</text>
  <text x="346" y="160" font-size="13" fill="#2f5223" filter="url(#rough2)">x2 = {1, 3}   ← e2</text>
  <text x="346" y="188" font-size="13" fill="#2f5223" filter="url(#rough2)">x3 = {1, 4}   ← e3</text>
  <text x="346" y="216" font-size="13" fill="#2f5223" filter="url(#rough2)">x4 = {4, 5}   ← e4</text>
  <text x="346" y="250" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">共 n-1 = 4 个集合，每个大小恰为 2</text>

  <!-- 下界说明 -->
  <rect x="60" y="262" width="240" height="96" rx="10" fill="#fde8e8" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="74" y="286" font-size="12" font-weight="bold" fill="#8c2f2b" filter="url(#rough2)">权重下界 = 2</text>
  <text x="74" y="310" font-size="11" fill="#8c2f2b" filter="url(#rough2)">每条边 (a,b) 都要有集合</text>
  <text x="74" y="330" font-size="11" fill="#8c2f2b" filter="url(#rough2)">同时含 a、b，故 |x| ≥ 2</text>
  <text x="74" y="350" font-size="11" fill="#8c2f2b" filter="url(#rough2)">取 x = {a,b} 即可达到 2</text>

  <text x="360" y="386" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">权重最小 = 2；此时每个集合至多覆盖一条边 → 集合数至少 n-1</text>
</svg>
