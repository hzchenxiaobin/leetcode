<svg xmlns="http://www.w3.org/2000/svg" width="880" height="404" viewBox="0 0 880 404"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="101"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="404" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">孩子子树的访问顺序：按 cost/size 升序</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">交换相邻两项即可证明（Smith 规则）</text>
  <g filter="url(#rough2)"><rect x="80" y="88" width="340" height="70" rx="4" fill="#d7ecd0" fill-opacity="0.45" stroke="#6a9a58" stroke-width="1.4"/></g>
  <text x="250" y="112" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">子树 i 在前</text>
  <text x="250" y="136" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">贡献 sz_i·t + sz_j·(t + 2E_i)</text>
  <g filter="url(#rough2)"><rect x="460" y="88" width="340" height="70" rx="4" fill="#f6d9d7" fill-opacity="0.45" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="630" y="112" text-anchor="middle" font-size="12.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">子树 j 在前</text>
  <text x="630" y="136" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">贡献 sz_j·t + sz_i·(t + 2E_j)</text>
  <text x="440" y="196" text-anchor="middle" font-size="12.5" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">比较两式：i 在前更好 ⟺ sz_j·E_i ≤ sz_i·E_j ⟺ E_i/sz_i ≤ E_j/sz_j</text>
  <g filter="url(#rough2)"><rect x="80" y="228" width="720" height="96" rx="4" fill="#ffffff" fill-opacity="0.0" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="5 4"/></g>
  <text x="440" y="254" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">sz_v：子树结点数；E_v：子树内边权和（含到父的那条）；D_v：子树内到达时间之和</text>
  <text x="440" y="280" text-anchor="middle" font-size="12" fill="#3d6b2f" filter="url(#rough2)">D_v = Σ ( sz_i·(前缀 + w_i) + D_i )，前缀按 2E_i 累加</text>
  <text x="440" y="306" text-anchor="middle" font-size="12" fill="#8a2b28" filter="url(#rough2)">答案 = D_root / (n−1)（宝物等概率在其余 n−1 个大厅）</text>
  <text x="440" y="360" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">排序用交叉相乘避免浮点：E_i·sz_j &lt; E_j·sz_i 则 i 在前</text>
</svg>
