<svg xmlns="http://www.w3.org/2000/svg" width="780" height="360" viewBox="0 0 780 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="780" height="360" fill="#fafafa"/>
  <text x="390.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">197B：比较分子分母的次数</text>
  <path d="M 264.9 46 Q 390.0 52 515.1 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60.0" y="70.0" width="650.0" height="40.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="68.0" y="103.0" text-anchor="start" font-size="10.8" font-weight="bold" fill="#26405c" filter="url(#rough2)">情况</text>
  <text x="178.0" y="103.0" text-anchor="start" font-size="10.8" font-weight="bold" fill="#26405c" filter="url(#rough2)">极限</text>
  <text x="478.0" y="103.0" text-anchor="start" font-size="10.8" font-weight="bold" fill="#26405c" filter="url(#rough2)">输出</text>
  <path d="M 60.0 70.0 L 710.0 70.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="68.0" y="143.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">n &gt; m</text>
  <text x="178.0" y="143.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">±∞（符号 = a₀/b₀ 的符号）</text>
  <text x="478.0" y="143.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">Infinity / -Infinity</text>
  <path d="M 60.0 110.0 L 710.0 110.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="68.0" y="183.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">n &lt; m</text>
  <text x="178.0" y="183.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="478.0" y="183.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">0/1</text>
  <path d="M 60.0 150.0 L 710.0 150.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="68.0" y="223.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">n = m</text>
  <text x="178.0" y="223.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">a₀/b₀（约分）</text>
  <text x="478.0" y="223.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">p/q</text>
  <path d="M 60.0 190.0 L 710.0 190.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <rect x="60.0" y="230.0" width="660.0" height="60.0" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="254.0" text-anchor="start" font-size="10.9" fill="#8a6015" filter="url(#rough2)">n = m 时只由首项系数决定：分子分母同除 xⁿ ⇒ a₀/b₀；输出必须约分且分母为正。</text>
  <text x="74.0" y="276.0" text-anchor="start" font-size="10.9" fill="#8a6015" filter="url(#rough2)">n &gt; m 时符号看 a₀·b₀ 的符号：同号 +∞，异号 −∞。</text>
  <rect x="60.0" y="300.0" width="660.0" height="50.0" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="324.0" text-anchor="start" font-size="10.9" fill="#33506e" filter="url(#rough2)">样例：2 1 / 1 1 1 / 2 5 ⇒ n&gt;m 且同号 ⇒ Infinity；2 2 / 2 1 6 / 4 5 −7 ⇒ 2/4 = 1/2。</text>
</svg>
