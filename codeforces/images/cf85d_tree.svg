<svg xmlns="http://www.w3.org/2000/svg" width="880" height="424" viewBox="0 0 880 424"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="85"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="424" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">线段树节点 = (元素个数 cnt, 五个余数类之和 s[0..4])</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">合并：s[k] = 左.s[k] + 右.s[(k − 左.cnt) mod 5]</text>
  <g filter="url(#rough2)"><rect x="384" y="80" width="112" height="48" rx="4" fill="#f6e3c4" fill-opacity="0.7" stroke="#778899" stroke-width="1.3"/></g>
  <text x="440" y="100" text-anchor="middle" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">[1..8]</text>
  <text x="440" y="118" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">cnt=5</text>
  <g filter="url(#rough2)"><rect x="224" y="168" width="112" height="48" rx="4" fill="#cfe0f5" fill-opacity="0.7" stroke="#778899" stroke-width="1.3"/></g>
  <text x="280" y="188" text-anchor="middle" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">[1..4]</text>
  <text x="280" y="206" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">cnt=3</text>
  <g filter="url(#rough2)"><rect x="544" y="168" width="112" height="48" rx="4" fill="#cfe0f5" fill-opacity="0.7" stroke="#778899" stroke-width="1.3"/></g>
  <text x="600" y="188" text-anchor="middle" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">[5..8]</text>
  <text x="600" y="206" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">cnt=2</text>
  <g filter="url(#rough2)"><rect x="134" y="256" width="112" height="48" rx="4" fill="#d7ecd0" fill-opacity="0.7" stroke="#778899" stroke-width="1.3"/></g>
  <text x="190" y="276" text-anchor="middle" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">[1..2]</text>
  <text x="190" y="294" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">cnt=2</text>
  <g filter="url(#rough2)"><rect x="314" y="256" width="112" height="48" rx="4" fill="#d7ecd0" fill-opacity="0.7" stroke="#778899" stroke-width="1.3"/></g>
  <text x="370" y="276" text-anchor="middle" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">[3..4]</text>
  <text x="370" y="294" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">cnt=1</text>
  <g filter="url(#rough2)"><rect x="464" y="256" width="112" height="48" rx="4" fill="#d7ecd0" fill-opacity="0.7" stroke="#778899" stroke-width="1.3"/></g>
  <text x="520" y="276" text-anchor="middle" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">[5..6]</text>
  <text x="520" y="294" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">cnt=1</text>
  <g filter="url(#rough2)"><rect x="624" y="256" width="112" height="48" rx="4" fill="#d7ecd0" fill-opacity="0.7" stroke="#778899" stroke-width="1.3"/></g>
  <text x="680" y="276" text-anchor="middle" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">[7..8]</text>
  <text x="680" y="294" text-anchor="middle" font-size="10.5" fill="#555555" filter="url(#rough2)">cnt=1</text>
  <g filter="url(#rough2)"><line x1="440" y1="128" x2="280" y2="168" stroke="#888888" stroke-width="1.3"/></g>
  <g filter="url(#rough2)"><line x1="440" y1="128" x2="600" y2="168" stroke="#888888" stroke-width="1.3"/></g>
  <g filter="url(#rough2)"><line x1="280" y1="216" x2="190" y2="256" stroke="#888888" stroke-width="1.3"/></g>
  <g filter="url(#rough2)"><line x1="280" y1="216" x2="370" y2="256" stroke="#888888" stroke-width="1.3"/></g>
  <g filter="url(#rough2)"><line x1="600" y1="216" x2="520" y2="256" stroke="#888888" stroke-width="1.3"/></g>
  <g filter="url(#rough2)"><line x1="600" y1="216" x2="680" y2="256" stroke="#888888" stroke-width="1.3"/></g>
  <text x="440" y="336" text-anchor="middle" font-size="12.5" fill="#8a2b28" filter="url(#rough2)">根节点的 s[2] 就是答案：排序后第 3、8、13、… 个元素之和</text>
  <text x="440" y="362" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">add / del：单点修改后沿路径向上合并 O(log M)，每个节点只存 5 个和</text>
  <text x="440" y="388" text-anchor="middle" font-size="11.5" fill="#3d6b2f" filter="url(#rough2)">右子树里的名次会被左子树整体平移 cnt_left 位，这正是合并时下标要循环移位的原因</text>
</svg>
