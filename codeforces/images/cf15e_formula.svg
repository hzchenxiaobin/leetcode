<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="177"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="430" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">路线分成三类：两边都用 / 只用一边 / 都不用</text>
  <path d="M 110 44 Q 380 50 650 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 卡片 1 -->
  <rect x="24" y="64" width="224" height="220" rx="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="136" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">两边都用</text>
  <text x="136" y="146" text-anchor="middle" font-size="30" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">2H²</text>
  <text x="136" y="184" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">左边选一条半路线（H 种），</text>
  <text x="136" y="202" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">右边也选一条（H 种），</text>
  <text x="136" y="220" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">合起来有 H² 种；</text>
  <text x="136" y="240" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">整条环路有 2 个方向。</text>

  <!-- 卡片 2 -->
  <rect x="268" y="64" width="224" height="220" rx="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">只用一边</text>
  <text x="380" y="146" text-anchor="middle" font-size="30" font-weight="bold" fill="#2f5223" filter="url(#rough2)">8H</text>
  <text x="380" y="184" text-anchor="middle" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">左、右 2 种选择；</text>
  <text x="380" y="202" text-anchor="middle" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">顶部小三角有 4 种接法，</text>
  <text x="380" y="220" text-anchor="middle" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">所以 2 × 4 = 8。</text>

  <!-- 卡片 3 -->
  <rect x="512" y="64" width="224" height="220" rx="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="624" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">都不用</text>
  <text x="624" y="146" text-anchor="middle" font-size="30" font-weight="bold" fill="#8a6015" filter="url(#rough2)">10</text>
  <text x="624" y="184" text-anchor="middle" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">只绕顶部小三角的</text>
  <text x="624" y="202" text-anchor="middle" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">10 条简单闭合路线；</text>
  <text x="624" y="220" text-anchor="middle" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">n = 2 时答案就是 10。</text>

  <!-- 合计 -->
  <rect x="24" y="302" width="712" height="52" rx="9" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="380" y="334" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">总路线数 = 2H² + 8H + 10</text>

  <rect x="24" y="364" width="712" height="52" rx="9" fill="#fde8e8" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="386" text-anchor="middle" font-size="12.5" fill="#8a3b36" filter="url(#rough2)">H = 4S，S = Σ_{i=2..k} ∏_{j=2..i} (2^j − 3)，k = n/2</text>
  <text x="380" y="406" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a3b36" filter="url(#rough2)">代入得 ans = 32S² + 32S + 10（mod 1e9+9）</text>
</svg>
