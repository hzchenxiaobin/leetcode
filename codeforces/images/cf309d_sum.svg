<svg xmlns="http://www.w3.org/2000/svg" width="880" height="220" viewBox="0 0 880 220"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="220" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">对固定 (T,U)，满足上式的 S 是一段前缀</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">所以只需算 S 的上界再截断到 [m+1, n-m]</text>
  <text x="150" y="100" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">S 的上界 = floor((U·(2L-T-2U) - 1) / (L-U+T))，再与 n-m 取 min、与 m 取差</text>
  <text x="150" y="140" text-anchor="start" font-size="12" fill="#2f4a66" filter="url(#rough2)">n &lt;= 32000，O(n^2) 枚举 (T,U) 即可，C++ 实测 755 ms</text>
</svg>
