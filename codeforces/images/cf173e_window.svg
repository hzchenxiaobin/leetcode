<svg xmlns="http://www.w3.org/2000/svg" width="740" height="400" viewBox="0 0 740 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="107"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="740" height="400" fill="#fafafa"/>
  <text x="370" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">组长的可行域：责任心 ≥ R，年龄落在两个 ±k 区间的交集</text>
  <path d="M 170 46 Q 370 52 570 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <line x1="80" y1="210" x2="660" y2="210" stroke="#2b2b2b" stroke-width="1.6" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="666" y="228" text-anchor="start" font-size="11" font-weight="normal" fill="#555" filter="url(#rough2)">年龄</text>
  <rect x="176" y="152" width="194" height="20" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="273" y="166" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#2f4a66" filter="url(#rough2)">x 的窗口 [a_x−k, a_x+k]</text>
  <rect x="273" y="180" width="193" height="20" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="370" y="194" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#2f5223" filter="url(#rough2)">y 的窗口 [a_y−k, a_y+k]</text>
  <rect x="273" y="218" width="97" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="321" y="236" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6015" filter="url(#rough2)">交集 [L, U]</text>
  <text x="273" y="264" text-anchor="middle" font-size="10" font-weight="normal" fill="#8a6015" filter="url(#rough2)">L = max(a_x,a_y) − k</text>
  <text x="370" y="264" text-anchor="middle" font-size="10" font-weight="normal" fill="#8a6015" filter="url(#rough2)">U = min(a_x,a_y) + k</text>
  <text x="273" y="280" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">a_x</text>
  <text x="370" y="280" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5223" filter="url(#rough2)">a_y</text>
  <line x1="273" y1="208" x2="273" y2="212" stroke="#2b2b2b" stroke-width="2" filter="url(#rough2)"/>
  <line x1="370" y1="208" x2="370" y2="212" stroke="#2b2b2b" stroke-width="2" filter="url(#rough2)"/>
  <text x="321" y="302" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">交集为空 ⇔ |a_x − a_y| &gt; 2k ⇒ 无解</text>
  <rect x="80" y="86" width="580" height="52" rx="9" fill="#fdecea" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="94" y="108" text-anchor="start" font-size="11.5" font-weight="bold" fill="#8c3a36" filter="url(#rough2)">组长还要满足 r_c ≥ R = max(r_x, r_y)：责任心这条是一维“下界”阈值。</text>
  <text x="94" y="128" text-anchor="start" font-size="11.5" font-weight="normal" fill="#8c3a36" filter="url(#rough2)">只要 c 同时满足这两条，x、y 就一定落在 c 的组里（不必单独检查）。</text>
  <rect x="80" y="320" width="580" height="58" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="94" y="342" text-anchor="start" font-size="11" font-weight="bold" fill="#8a6015" filter="url(#rough2)">答案 = max{ f(c) : r_c ≥ R 且 a_c ∈ [L,U] }，f(c) = #{ i : r_i ≤ r_c, |a_i−a_c| ≤ k }</text>
  <text x="94" y="362" text-anchor="start" font-size="11" font-weight="normal" fill="#7a5a1b" filter="url(#rough2)">组长一定在可行域内，取使 f 最大的那个即可。</text>
</svg>
