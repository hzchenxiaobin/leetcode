<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1001"/>
    <feDisplacementMap in="SourceGraphic" scale="1.5"/></filter></defs>
  <rect width="700" height="300" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">点分治：每条路径在"第一个把两端分开的重心"处被数到一次</text>
  <path d="M 110 40 Q 350 46 590 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="86" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="12.5" fill="#22314a" filter="url(#rough2)">取重心 c：任何"经过 c"的路径 = c 到 u 的一段 + c 到 v 的一段，</text>
  <text x="76" y="106" font-size="12.5" fill="#22314a" filter="url(#rough2)">⇒ 边数和 = d_u + d_v、权值和 = w_u + w_v（d、w 为到 c 的距离）。</text>
  <text x="76" y="130" font-size="12.5" fill="#22314a" filter="url(#ruff2)">⇒ 双约束变成二维偏序：d_u + d_v ≤ l 且 w_u + w_v ≤ w。</text>
  <g filter="url(#rough2)"><rect x="60" y="152" width="580" height="76" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="76" y="176" font-size="12.5" fill="#8a6015" filter="url(#rough2)">容斥：先算整棵分治子树（含中心 (0,0)）的答案，再对每个孩子子树"用同一套"减掉。</text>
  <text x="76" y="200" font-size="12.5" fill="#8a6015" filter="url(#rough2)">同子树的路径其实不经过 c，但它在"整棵"里被算了、在这里被减了 ⇒ 净贡献 0，</text>
  <text x="76" y="224" font-size="12.5" fill="#8a6015" filter="url(#rough2)">留给更深的层去数（递归下去）。</text>
  <g filter="url(#rough2)"><rect x="60" y="238" width="580" height="52" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="262" font-size="12.5" fill="#2f5223" filter="url(#rough2)">样例 1（4 个点、星形、l=4,w=6）：答案 4 = C(3,2)+3 中满足权值的那 4 对 ✓</text>
  <text x="76" y="282" font-size="12.5" fill="#2f5223" filter="url(#rough2)">样例 2：答案 9 ✓</text>
</svg>
