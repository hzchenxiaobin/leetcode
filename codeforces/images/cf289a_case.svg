<svg xmlns="http://www.w3.org/2000/svg" width="700" height="280" viewBox="0 0 700 280"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="403"/>
    <feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></defs>
  <rect width="700" height="280" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">为什么"补到下一个倍数"一定最优</text>
  <path d="M 190 40 Q 350 46 510 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="70" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="12.5" fill="#22314a" filter="url(#rough2)">move 数 m 与 value 的增量恰好相等（每 move +1），所以问题 = 最小 m ≥ 0 使 (S+m) 被 k 整除。</text>
  <text x="76" y="106" font-size="12.5" fill="#22314a" filter="url(#rough2)">这个最小 m 就是 (k − S mod k) mod k（距离 S 最近的上方倍数）。</text>
  <g filter="url(#rough2)"><rect x="60" y="142" width="580" height="60" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="166" font-size="12.5" fill="#2f5223" filter="url(#rough2)">不需要考虑"能不能扩"：区间互不相交但可以往两侧任意扩（扩到相邻区间之前即可），</text>
  <text x="76" y="188" font-size="12.5" fill="#2f5223" filter="url(#rough2)">而即便扩到相撞，题目也不禁止——只要总覆盖数增加即可。</text>
  <g filter="url(#rough2)"><rect x="60" y="216" width="580" height="46" rx="8" fill="#fbeeee" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="76" y="244" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">易错：S mod k == 0 时答案是 0，不是 k。</text>
</svg>
