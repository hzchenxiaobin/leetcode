<svg xmlns="http://www.w3.org/2000/svg" width="760" height="392" viewBox="0 0 760 392"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c9801f"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a8524a"/>
    </marker>
  </defs>
  <rect width="760" height="392" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">空闲镜像对 = 一个「字母名额」</text>
  <text x="380.0" y="60.0" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">样例 2：k = 2，模板 a ? ? a，字母表 {a, b}</text>
  <rect x="210.0" y="84.0" width="56.0" height="46.0" fill="#f7f9fc" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="238.0" y="113.1" text-anchor="middle" font-size="17" fill="#2b2b2b" filter="url(#rough2)">a</text>
  <rect x="272.0" y="84.0" width="56.0" height="46.0" fill="#fdf3e3" stroke="#c9801f" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300.0" y="113.1" text-anchor="middle" font-size="17" fill="#2b2b2b" filter="url(#rough2)">?</text>
  <rect x="334.0" y="84.0" width="56.0" height="46.0" fill="#fdf3e3" stroke="#c9801f" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="362.0" y="113.1" text-anchor="middle" font-size="17" fill="#2b2b2b" filter="url(#rough2)">?</text>
  <rect x="396.0" y="84.0" width="56.0" height="46.0" fill="#f7f9fc" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="424.0" y="113.1" text-anchor="middle" font-size="17" fill="#2b2b2b" filter="url(#rough2)">a</text>
  <text x="500.0" y="100.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">第 2、3 位是一对</text>
  <text x="500.0" y="122.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">镜像：写同一个字母</text>
  <text x="56.0" y="170.0" text-anchor="start" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">已出现：{a}　　缺失：{b}　　空闲名额：1（就是这一对）</text>
  <rect x="56.0" y="190.0" width="640.0" height="56.0" rx="8" fill="#f4f9f2" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="72.0" y="214.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">名额 1 ≥ 缺失 1，且写下 b 正好补齐：把这一对填成 b</text>
  <text x="72.0" y="236.0" text-anchor="start" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">结果 a b b a，回文且 a、b 都出现 → 合法</text>
  <rect x="56.0" y="254.0" width="640.0" height="56.0" rx="8" fill="#fbeeee" stroke="#a8524a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="72.0" y="278.0" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">若在这里填 a（更小），缺失的 b 就再也没有地方放：</text>
  <text x="72.0" y="300.0" text-anchor="start" font-size="12.5" fill="#a8524a" font-weight="bold" filter="url(#rough2)">a a a a 缺少 b → 不可行，所以必须填 b</text>
  <rect x="34.0" y="322.0" width="692.0" height="56.0" rx="8" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.4" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="48.0" y="346.0" text-anchor="start" font-size="12" fill="#2b2b2b" filter="url(#rough2)">贪心规则：从左到右处理每个空闲对，取最小的字母 c，使</text>
  <text x="48.0" y="368.0" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">「缺失字母数 − [c 也缺失]」≤「这对之后剩下的名额数」。</text>
</svg>
