<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="167"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="300" fill="#fafafa"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">聚合 → 数比他好的人 → 五档顺序判定</text>
  <path d="M 170 46 Q 360 52 550 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="30" y="92" width="150" height="58" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="105.0" y="116" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">按名字聚合</text>
  <text x="105.0" y="136" text-anchor="middle" font-size="10" font-weight="normal" fill="#555" filter="url(#rough2)">取最好成绩</text>
  <rect x="210" y="92" width="150" height="58" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="285.0" y="116" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">统计 b</text>
  <text x="285.0" y="136" text-anchor="middle" font-size="10" font-weight="normal" fill="#555" filter="url(#rough2)">#严格更高的人数</text>
  <rect x="390" y="92" width="160" height="58" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470.0" y="116" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">五档判定</text>
  <text x="470.0" y="136" text-anchor="middle" font-size="10" font-weight="normal" fill="#555" filter="url(#rough2)">2/5/10/100 乘法</text>
  <rect x="580" y="92" width="120" height="58" rx="10" fill="#f3e8fb" stroke="#7a4a9a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="640.0" y="116" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">输出</text>
  <text x="640.0" y="136" text-anchor="middle" font-size="10" font-weight="normal" fill="#555" filter="url(#rough2)">名字 + 段位</text>
  <line x1="182" y1="121" x2="208" y2="121" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <line x1="362" y1="121" x2="388" y2="121" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <line x1="542" y1="121" x2="568" y2="121" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="30" y="186" width="660" height="80" rx="10" fill="#fdecea" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="46" y="210" text-anchor="start" font-size="11.5" font-weight="bold" fill="#8c3a36" filter="url(#rough2)">两个必踩的坑：</text>
  <text x="46" y="232" text-anchor="start" font-size="11" font-weight="normal" fill="#8c3a36" filter="url(#rough2)">① 同一玩家多轮 → 必须先取 max，否则段位会偏低；</text>
  <text x="46" y="254" text-anchor="start" font-size="11" font-weight="normal" fill="#8c3a36" filter="url(#rough2)">② 百分比用 double 判边界会抖 → 一律换成整数乘法 b·100/x &gt; m。</text>
</svg>
