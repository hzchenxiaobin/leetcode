<svg xmlns="http://www.w3.org/2000/svg" width="740" height="480" viewBox="0 0 740 480"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arrR2" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 0 L 5 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="740" height="480" fill="#fafafa"/>

  <text x="370" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察二：根链上的 P(v)、g(v) 与 S(v)</text>

  <!-- 竖直的根链：v1..v5 -->
  <line x1="130" y1="112" x2="130" y2="133" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="130" y1="177" x2="130" y2="198" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="130" y1="242" x2="130" y2="263" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="130" y1="307" x2="130" y2="328" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>

  <circle cx="130" cy="90" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <circle cx="130" cy="155" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <circle cx="130" cy="220" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <circle cx="130" cy="285" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <circle cx="130" cy="350" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="130" y="95" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">v1</text>
  <text x="130" y="160" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">v2</text>
  <text x="130" y="225" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">v3</text>
  <text x="130" y="290" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">v4</text>
  <text x="130" y="355" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">v5</text>

  <rect x="168" y="74" width="82" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="168" y="139" width="82" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="168" y="204" width="82" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="168" y="269" width="82" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="168" y="334" width="82" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="209" y="95" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">a = 4 = 100</text>
  <text x="209" y="160" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">a = 2 = 010</text>
  <text x="209" y="225" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">a = 6 = 110</text>
  <text x="209" y="290" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">a = 0</text>
  <text x="209" y="355" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">a = 1 = 001</text>

  <!-- 红色：v3 的冲突祖先 v2 -->
  <path d="M 165 206 C 96 200, 96 176, 122 168" stroke="#b85450" stroke-width="1.8" fill="none"
        stroke-dasharray="5 4" marker-end="url(#arrR2)" filter="url(#rough2)"/>
  <text x="72" y="196" text-anchor="middle" font-size="11" fill="#a14340" filter="url(#rough2)">6 &amp; 2 ≠ 0</text>
  <text x="72" y="212" text-anchor="middle" font-size="11" fill="#a14340" filter="url(#rough2)">P(v3)=v2</text>

  <!-- 右侧表 -->
  <text x="340" y="72" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">点</text>
  <text x="402" y="72" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">dep</text>
  <text x="464" y="72" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">a_v</text>
  <text x="532" y="72" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">P(v)</text>
  <text x="602" y="72" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">g(v)</text>
  <text x="670" y="72" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">S(v)</text>
  <line x1="312" y1="80" x2="712" y2="80" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>

  <text x="340" y="108" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">v1</text>
  <text x="402" y="108" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">0</text>
  <text x="464" y="108" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">4</text>
  <text x="532" y="108" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">−1</text>
  <text x="602" y="108" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">1</text>
  <text x="670" y="108" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">1</text>

  <text x="340" y="140" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">v2</text>
  <text x="402" y="140" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">1</text>
  <text x="464" y="140" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">2</text>
  <text x="532" y="140" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">−1</text>
  <text x="602" y="140" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">2</text>
  <text x="670" y="140" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">3</text>

  <text x="340" y="172" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">v3</text>
  <text x="402" y="172" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">2</text>
  <text x="464" y="172" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">6</text>
  <text x="532" y="172" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">v2</text>
  <text x="602" y="172" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">1</text>
  <text x="670" y="172" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">4</text>

  <text x="340" y="204" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">v4</text>
  <text x="402" y="204" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">3</text>
  <text x="464" y="204" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">0</text>
  <text x="532" y="204" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">v2</text>
  <text x="602" y="204" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">2</text>
  <text x="670" y="204" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">6</text>

  <text x="340" y="236" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">v5</text>
  <text x="402" y="236" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">4</text>
  <text x="464" y="236" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">1</text>
  <text x="532" y="236" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">v2</text>
  <text x="602" y="236" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">3</text>
  <text x="670" y="236" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">9</text>
  <line x1="312" y1="248" x2="712" y2="248" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>

  <text x="312" y="274" text-anchor="start" font-size="11.5" fill="#555" filter="url(#rough2)">例：v5 的段 [v3..v5] = (6, 0, 1)，位不交 ✓；再往前加 v2 的 2 就冲突 ✗</text>
  <text x="312" y="298" text-anchor="start" font-size="11.5" fill="#555" filter="url(#rough2)">故 g(v5) = 4 − 1 = 3：只有 [v5]、[v4,v5]、[v3,v5] 三个</text>
  <text x="312" y="322" text-anchor="start" font-size="11.5" fill="#555" filter="url(#rough2)">a_v = 0 的点不产生冲突，直接继承 P(parent)</text>

  <rect x="40" y="374" width="660" height="86" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="58" y="398" text-anchor="start" font-size="12" fill="#3c5e2e" filter="url(#rough2)">P(v)：沿根链向上第一个与「v 及其下方各点 OR」相交的非零祖先；不存在则设 dep(P)=−1</text>
  <text x="58" y="423" text-anchor="start" font-size="12" fill="#3c5e2e" filter="url(#rough2)">g(v) = dep(v) − dep(P(v)) 即以 v 结尾的位不交段数；S(v) = S(parent) + g(v) 是根链前缀和</text>
  <text x="58" y="448" text-anchor="start" font-size="12" fill="#3c5e2e" filter="url(#rough2)">P(v) 用 DFS 的非零祖先栈求：每点最多回扫 21 个非零祖先（20 位必然冲突）</text>
</svg>
