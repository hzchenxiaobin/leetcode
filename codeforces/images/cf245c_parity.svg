<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="720" height="290" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两种「无解」的结构性原因</text>
  <rect x="40" y="60" width="300" height="96" rx="8" fill="#fde9d9" stroke="#b4652a" stroke-width="1.5"/>
  <text x="190" y="97" text-anchor="middle" font-size="12" fill="#7a4b22">n = 1</text>
  <text x="190" y="112" text-anchor="middle" font-size="12" fill="#7a4b22">没有合法 x（2x+1 &gt; n）</text>
  <text x="190" y="127" text-anchor="middle" font-size="12" fill="#7a4b22">→ 输出 -1</text>
  <rect x="380" y="60" width="300" height="96" rx="8" fill="#fde9d9" stroke="#b4652a" stroke-width="1.5"/>
  <text x="530" y="97" text-anchor="middle" font-size="12" fill="#7a4b22">n 为偶数</text>
  <text x="530" y="112" text-anchor="middle" font-size="12" fill="#7a4b22">宝箱 n 只能被 x=n/2 或 x=n 取</text>
  <text x="530" y="127" text-anchor="middle" font-size="12" fill="#7a4b22">两者都越界 → 输出 -1</text>
  <rect x="40" y="180" width="640" height="86" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="360" y="220" text-anchor="middle" font-size="11.5" fill="#2f5223">n 为奇数且 n ≥ 3 时：每个宝箱 i 要么自己可动（i ≤ (n−1)/2），要么父亲可动（i/2 ≤ (n−1)/2）</text>
  <text x="360" y="234" text-anchor="middle" font-size="11.5" fill="#2f5223">所以一定有解，DP 求出最少移动次数</text>
</svg>
