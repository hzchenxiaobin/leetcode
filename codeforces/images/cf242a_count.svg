<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
    <feDisplacementMap in="SourceGraphic" scale="1.6"/></filter></defs>
  <rect width="720" height="300" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">计数公式与样例</text>
  <rect x="60" y="54" width="600" height="50" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="74" y="84" font-size="12.5" fill="#2f5223" filter="url(#rough2)">总数 n = Σ_{c=a..x} max(0, min(y, c−1) − b + 1)</text>
  <text x="60" y="132" font-size="12" fill="#2b2b2b" filter="url(#rough2)">样例 1：x=3, y=2, a=1, b=1</text>
  <text x="80" y="154" font-size="11.5" fill="#555" filter="url(#rough2)">c=1：d 取 1..min(2,0) = 空 → 0 个</text>
  <text x="80" y="174" font-size="11.5" fill="#555" filter="url(#rough2)">c=2：d 取 1..1 → (2,1)</text>
  <text x="80" y="194" font-size="11.5" fill="#555" filter="url(#rough2)">c=3：d 取 1..2 → (3,1), (3,2)</text>
  <text x="80" y="214" font-size="11.5" fill="#2f5223" filter="url(#rough2)">共 3 个：2 1 / 3 1 / 3 2，与官方一致</text>
  <text x="60" y="246" font-size="12" fill="#2b2b2b" filter="url(#rough2)">样例 2：x=2, y=4, a=2, b=2：c 只能取 2，而 d ≥ 2，c &gt; d 不可能 → 输出 0</text>
  <text x="60" y="272" font-size="11.5" fill="#666" filter="url(#rough2)">复杂度 O((x−a+1) × (y−b+1)) ≤ 10^4，完全可以枚举。</text>
</svg>
