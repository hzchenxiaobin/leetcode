<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1441"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="720" height="330" fill="#fafafa"/>
  <text x="180" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每个运动员 = 对角格上的一段区间</text>
  <path d="M 40 42 Q 180 48 320 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 5 度阶梯：格子 (r,c) 占 [70+40(c-1), +40] x [60+40(r-1), +40]；r+c>=6 才存在 -->
  <g filter="url(#rough2)">
    <rect x="70" y="60" width="40" height="40" fill="#f4f4f1" stroke="#e6e6e0" stroke-width="1"/>
    <rect x="110" y="60" width="40" height="40" fill="#f4f4f1" stroke="#e6e6e0" stroke-width="1"/>
    <rect x="150" y="60" width="40" height="40" fill="#f4f4f1" stroke="#e6e6e0" stroke-width="1"/>
    <rect x="190" y="60" width="40" height="40" fill="#f4f4f1" stroke="#e6e6e0" stroke-width="1"/>
    <rect x="70" y="100" width="40" height="40" fill="#f4f4f1" stroke="#e6e6e0" stroke-width="1"/>
    <rect x="110" y="100" width="40" height="40" fill="#f4f4f1" stroke="#e6e6e0" stroke-width="1"/>
    <rect x="150" y="100" width="40" height="40" fill="#f4f4f1" stroke="#e6e6e0" stroke-width="1"/>
    <rect x="70" y="140" width="40" height="40" fill="#f4f4f1" stroke="#e6e6e0" stroke-width="1"/>
    <rect x="110" y="140" width="40" height="40" fill="#f4f4f1" stroke="#e6e6e0" stroke-width="1"/>
    <rect x="70" y="180" width="40" height="40" fill="#f4f4f1" stroke="#e6e6e0" stroke-width="1"/>

    <rect x="190" y="180" width="40" height="40" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.1"/>
    <rect x="230" y="180" width="40" height="40" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.1"/>
    <rect x="230" y="140" width="40" height="40" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.1"/>
    <rect x="110" y="220" width="40" height="40" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.1"/>
    <rect x="150" y="220" width="40" height="40" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.1"/>
    <rect x="190" y="220" width="40" height="40" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.1"/>
    <rect x="230" y="220" width="40" height="40" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.1"/>
    <rect x="150" y="180" width="40" height="40" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.1"/>

    <rect x="230" y="100" width="40" height="40" fill="#eef5ea" stroke="#5a8a4a" stroke-width="1.2"/>
    <rect x="190" y="140" width="40" height="40" fill="#eef5ea" stroke="#5a8a4a" stroke-width="1.2"/>

    <rect x="230" y="60" width="40" height="40" fill="#f6efd8" stroke="#b09040" stroke-width="1.4"/>
    <rect x="190" y="100" width="40" height="40" fill="#f6efd8" stroke="#b09040" stroke-width="1.4"/>
    <rect x="150" y="140" width="40" height="40" fill="#f6efd8" stroke="#b09040" stroke-width="1.4"/>
    <rect x="110" y="180" width="40" height="40" fill="#f6efd8" stroke="#b09040" stroke-width="1.4"/>
    <rect x="70" y="220" width="40" height="40" fill="#f6efd8" stroke="#b09040" stroke-width="1.4"/>

    <rect x="230" y="140" width="40" height="40" fill="#fbeeee" stroke="#a05a5a" stroke-width="1.6"/>
    <circle cx="250" cy="160" r="7" fill="#a05a5a"/>
  </g>

  <text x="250" y="86" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">p=1</text>
  <text x="210" y="126" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">p=2</text>
  <text x="170" y="166" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">p=3</text>

  <text x="296" y="96" font-size="12" font-weight="bold" fill="#a05a5a" filter="url(#rough2)">运动员 (r,c) = (3,5)</text>
  <text x="296" y="122" font-size="11.5" fill="#335478" filter="url(#rough2)">a = r = 3，b = n+1−c = 1</text>
  <text x="296" y="146" font-size="11.5" fill="#335478" filter="url(#rough2)">最短距离 d = a − b = 2</text>
  <text x="296" y="170" font-size="11.5" fill="#2f5223" filter="url(#rough2)">可停靠的对角格 p ∈ [b, a] = [1,3]</text>
  <text x="296" y="196" font-size="10.5" fill="#777777" filter="url(#rough2)">绿色 = 某条最短路上会经过的格子</text>
  <text x="296" y="216" font-size="10.5" fill="#777777" filter="url(#rough2)">黄色 = 副对角线 r+c = n+1</text>
  <text x="296" y="236" font-size="10.5" fill="#777777" filter="url(#rough2)">灰色 = 阶梯外的格子（不存在）</text>

  <text x="360" y="300" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">原题 ⇒ 给 m 个区间 [bᵢ, aᵢ]，选最多的人各占一个不同的对角格 pᵢ ∈ [bᵢ, aᵢ]</text>
</svg>
