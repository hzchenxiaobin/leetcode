<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="24" y="30" font-size="15" fill="#333" filter="url(#rough2)">唯一信道：当前窗口里 1 的个数 S</text>

  <!-- grid -->
  <g filter="url(#rough2)">
    <rect x="30" y="52" width="180" height="180" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4"/>
    <line x1="66" y1="52" x2="66" y2="232" stroke="#cccccc" stroke-width="1"/>
    <line x1="102" y1="52" x2="102" y2="232" stroke="#cccccc" stroke-width="1"/>
    <line x1="138" y1="52" x2="138" y2="232" stroke="#cccccc" stroke-width="1"/>
    <line x1="174" y1="52" x2="174" y2="232" stroke="#cccccc" stroke-width="1"/>
    <line x1="30" y1="88" x2="210" y2="88" stroke="#cccccc" stroke-width="1"/>
    <line x1="30" y1="124" x2="210" y2="124" stroke="#cccccc" stroke-width="1"/>
    <line x1="30" y1="160" x2="210" y2="160" stroke="#cccccc" stroke-width="1"/>
    <line x1="30" y1="196" x2="210" y2="196" stroke="#cccccc" stroke-width="1"/>
  </g>

  <!-- sub-rectangle -->
  <rect x="66" y="88" width="108" height="108" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="120" y="150" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">窗口 H×W</text>

  <!-- zeros -->
  <circle cx="84" cy="106" r="4.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="156" cy="106" r="4.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="120" cy="178" r="4.5" fill="#b85450" filter="url(#rough2)"/>
  <text x="220" y="112" font-size="12" fill="#b85450" filter="url(#rough2)">z 个 0（≤ k）</text>

  <!-- formula -->
  <rect x="250" y="52" width="286" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="78" font-size="14" fill="#333" filter="url(#rough2)">S = H·W − z，且 0 ≤ z ≤ k</text>
  <text x="270" y="98" font-size="12" fill="#666" filter="url(#rough2)">面积几乎完全决定 S，0 的个数只是小偏移</text>

  <!-- table -->
  <rect x="250" y="126" width="286" height="150" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="150" font-size="13" fill="#333" filter="url(#rough2)">解码表 f：只看 S 落在哪个数</text>
  <text x="270" y="174" font-size="12" fill="#4a7a3a" filter="url(#rough2)">H ≥ 4（宽恒为 n）：S = Hn−3 → U，Hn−2 → D</text>
  <text x="270" y="196" font-size="12" fill="#4a7a3a" filter="url(#rough2)">H = 3：S = 3W−2 → L，其余 → R</text>
  <text x="270" y="218" font-size="12" fill="#4a7a3a" filter="url(#rough2)">面积 ≤ 3：S = 2 → D，S = 1 → U</text>
  <text x="270" y="244" font-size="11" fill="#888" filter="url(#rough2)">三段下标互不重叠，一张表服务所有阶段</text>

  <!-- invariant -->
  <rect x="30" y="252" width="506" height="106" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="48" y="276" font-size="13" fill="#333" filter="url(#rough2)">关键不变量</text>
  <text x="48" y="298" font-size="12" fill="#333" filter="url(#rough2)">共 2n−2 次决策；每步只删一行或一列 → 恰好删 n−1 行 + n−1 列，</text>
  <text x="48" y="318" font-size="12" fill="#333" filter="url(#rough2)">所以只要从不删到目标行列，最终窗口必为 (r,c)。</text>
  <text x="48" y="340" font-size="12" fill="#b85450" filter="url(#rough2)">于是问题变成：让 S 的取值“告诉”机器人此刻该删哪一边。</text>

  <path d="M232 120 L248 84" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
