<svg xmlns="http://www.w3.org/2000/svg" width="780" height="470" viewBox="0 0 780 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="21"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr126d2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="780" height="470" fill="#fafafa"/>

  <text x="390" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">从高位往低位扫：每层状态不超过 2 个（n = 24 = F7 + F3）</text>
  <path d="M 150 44 Q 390 52 630 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="60" y="62" width="120" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="120" y="85" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f4a66">已处理到的 k</text>
    <rect x="186" y="62" width="250" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="311" y="85" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f4a66">待凑的和 : 方案数</text>
    <rect x="442" y="62" width="290" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="587" y="85" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f4a66">这一步发生了什么</text>
  </g>

  <!-- 行 -->
  <g filter="url(#rough2)" font-size="13.5">
    <rect x="60" y="102" width="120" height="32" fill="#ffffff" stroke="#cccccc"/>
    <text x="120" y="123" text-anchor="middle">初始</text>
    <rect x="186" y="102" width="250" height="32" fill="#ffffff" stroke="#cccccc"/>
    <text x="196" y="123">{24 : 1}</text>
    <rect x="442" y="102" width="290" height="32" fill="#ffffff" stroke="#cccccc"/>
    <text x="452" y="123" fill="#555">从 n 出发</text>

    <rect x="60" y="138" width="120" height="32" fill="#f7fbff" stroke="#cccccc"/>
    <text x="120" y="159" text-anchor="middle">k = 7</text>
    <rect x="186" y="138" width="250" height="32" fill="#f7fbff" stroke="#cccccc"/>
    <text x="196" y="159">{24 : 1, 3 : 1}</text>
    <rect x="442" y="138" width="290" height="32" fill="#f7fbff" stroke="#cccccc"/>
    <text x="452" y="159" fill="#2f5223">不用 F7 留 24；用 F7 剩 3</text>

    <rect x="60" y="174" width="120" height="32" fill="#ffffff" stroke="#cccccc"/>
    <text x="120" y="195" text-anchor="middle">k = 6</text>
    <rect x="186" y="174" width="250" height="32" fill="#ffffff" stroke="#cccccc"/>
    <text x="196" y="195">{11 : 1, 3 : 1}</text>
    <rect x="442" y="174" width="290" height="32" fill="#ffffff" stroke="#cccccc"/>
    <text x="452" y="195" fill="#b85450">24 &gt; S5 = 19，剪掉；24-13 = 11</text>

    <rect x="60" y="210" width="120" height="32" fill="#f7fbff" stroke="#cccccc"/>
    <text x="120" y="231" text-anchor="middle">k = 5</text>
    <rect x="186" y="210" width="250" height="32" fill="#f7fbff" stroke="#cccccc"/>
    <text x="196" y="231">{11 : 1, 3 : 2}</text>
    <rect x="442" y="210" width="290" height="32" fill="#f7fbff" stroke="#cccccc"/>
    <text x="452" y="231" fill="#2f5223">11-8 = 3 与原有 3 合并</text>

    <rect x="60" y="246" width="120" height="32" fill="#ffffff" stroke="#cccccc"/>
    <text x="120" y="267" text-anchor="middle">k = 4</text>
    <rect x="186" y="246" width="250" height="32" fill="#ffffff" stroke="#cccccc"/>
    <text x="196" y="267">{6 : 1, 3 : 2}</text>
    <rect x="442" y="246" width="290" height="32" fill="#ffffff" stroke="#cccccc"/>
    <text x="452" y="267" fill="#b85450">11 &gt; S3 = 6 剪掉，11-5 = 6</text>

    <rect x="60" y="282" width="120" height="32" fill="#f7fbff" stroke="#cccccc"/>
    <text x="120" y="303" text-anchor="middle">k = 3</text>
    <rect x="186" y="282" width="250" height="32" fill="#f7fbff" stroke="#cccccc"/>
    <text x="196" y="303">{3 : 3, 0 : 2}</text>
    <rect x="442" y="282" width="290" height="32" fill="#f7fbff" stroke="#cccccc"/>
    <text x="452" y="303" fill="#2f5223">凑出 0 的分支已经收口</text>

    <rect x="60" y="318" width="120" height="32" fill="#ffffff" stroke="#cccccc"/>
    <text x="120" y="339" text-anchor="middle">k = 2</text>
    <rect x="186" y="318" width="250" height="32" fill="#ffffff" stroke="#cccccc"/>
    <text x="196" y="339">{1 : 3, 0 : 2}</text>
    <rect x="442" y="318" width="290" height="32" fill="#ffffff" stroke="#cccccc"/>
    <text x="452" y="339" fill="#555">3-2 = 1，仍有两种走向</text>

    <rect x="60" y="354" width="120" height="32" fill="#f7fbff" stroke="#cccccc"/>
    <text x="120" y="375" text-anchor="middle">k = 1</text>
    <rect x="186" y="354" width="250" height="32" fill="#f7fbff" stroke="#cccccc"/>
    <text x="196" y="375">{0 : 5}</text>
    <rect x="442" y="354" width="290" height="32" fill="#f7fbff" stroke="#cccccc"/>
    <text x="452" y="375" fill="#b85450">只剩待凑 0 的 5 条，即答案</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="402" width="672" height="54" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/>
    <text x="76" y="424" font-size="13" fill="#8a6015">转移：x 要么整段留给低位（x 不变），要么拿走 F1..Fk 里最大的 Fk（x 减 Fk）。</text>
    <text x="76" y="446" font-size="13" fill="#8a6015">剪枝：用 F1..Fk 最多凑出 S(k) = F(k+2) - 2，所以 x &gt; S(k) 的分支直接判 0。</text>
  </g>
</svg>
