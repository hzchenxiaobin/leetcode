<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="240" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">规范形式后比对</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">p 可达 1e18，不能直接算分数值</text>
  <text x="150" y="95" text-anchor="start" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">把 p/q 做欧几里得展开得到连分数 [k1;k2,...]</text>
  <text x="150" y="135" text-anchor="start" font-size="12" fill="#2f4a66" filter="url(#rough2)">连分数的表示不唯一：末尾的 1 可以并入前一项（[2,3,1] = [2,4]）</text>
  <text x="150" y="175" text-anchor="start" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">两边都规约成"末尾 &gt;1"的规范形式后逐项比较</text>
</svg>
