<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="a12" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">四个方向各自是一条「梯子」：相邻两根横杆距离 ≤ h 才爬得上去</text>
  <path d="M 76 42 Q 360 48 644 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 地面与杆 -->
  <line x1="50" y1="360" x2="670" y2="360" stroke="#8a6015" stroke-width="2" filter="url(#rough2)"/>
  <text x="60" y="380" font-size="12" fill="#8a6015" filter="url(#rough2)">地面（可爬上高度 ≤ h 的任意横杆）</text>

  <!-- 方向 A（绿，连通到顶） -->
  <g filter="url(#rough2)">
    <line x1="110" y1="360" x2="110" y2="70" stroke="#c9d8c0" stroke-width="1.2"/>
    <rect x="82" y="330" width="56" height="10" rx="3" fill="#e8f4e0" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="82" y="282" width="56" height="10" rx="3" fill="#e8f4e0" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="82" y="234" width="56" height="10" rx="3" fill="#e8f4e0" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="82" y="150" width="56" height="10" rx="3" fill="#fbeeee" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="110" y="66" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">方向 A</text>
  <g font-size="11" fill="#3c5e2e" filter="url(#rough2)">
    <text x="150" y="338">h</text>
    <text x="150" y="290">h</text>
    <text x="150" y="242">h</text>
    <text x="150" y="158">断（&gt; h）</text>
  </g>
  <text x="110" y="410" text-anchor="middle" font-size="11.5" fill="#2f5223" filter="url(#rough2)">可达</text>

  <!-- 方向 B（蓝，连通到顶） -->
  <g filter="url(#rough2)">
    <line x1="260" y1="360" x2="260" y2="70" stroke="#c8d4e6" stroke-width="1.2"/>
    <rect x="232" y="330" width="56" height="10" rx="3" fill="#dfeafc" stroke="#446688" stroke-width="1.4"/>
    <rect x="232" y="282" width="56" height="10" rx="3" fill="#dfeafc" stroke="#446688" stroke-width="1.4"/>
    <rect x="232" y="198" width="56" height="10" rx="3" fill="#dfeafc" stroke="#446688" stroke-width="1.4"/>
    <rect x="232" y="114" width="56" height="10" rx="3" fill="#dfeafc" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="260" y="66" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">方向 B</text>
  <text x="260" y="410" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">可达</text>

  <!-- 方向 C（黄，从地面开始就断了） -->
  <g filter="url(#rough2)">
    <line x1="410" y1="360" x2="410" y2="70" stroke="#e6d9b8" stroke-width="1.2"/>
    <rect x="382" y="258" width="56" height="10" rx="3" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.4"/>
    <rect x="382" y="210" width="56" height="10" rx="3" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="410" y="66" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">方向 C</text>
  <text x="410" y="410" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">不可达</text>
  <g font-size="11" fill="#8a6015" filter="url(#rough2)">
    <text x="450" y="266">最低一根 &gt; h，地面够不着</text>
    <text x="450" y="296">⇒ 整条链废掉（永远不可达）</text>
  </g>

  <!-- 顶部要求 -->
  <g filter="url(#rough2)">
    <rect x="520" y="80" width="170" height="86" rx="8" fill="#ffffff" stroke="#888" stroke-width="1.2"/>
  </g>
  <g font-size="11.5" fill="#333" filter="url(#rough2)">
    <text x="532" y="104">顶部区间</text>
    <text x="532" y="124">[n−h+1, n]</text>
    <text x="532" y="148">至少一个方向的可达</text>
    <text x="532" y="162">横杆落在里面</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="60" y="392" width="620" height="30" rx="6" fill="#dfeafc" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="72" y="412" font-size="12" fill="#22314a" filter="url(#rough2)">
    每个高度恰好放一根横杆（四个方向选一个），问有多少种放法满足「能从地面爬到顶部区间」。
  </text>
</svg>
