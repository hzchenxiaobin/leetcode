<svg xmlns="http://www.w3.org/2000/svg" width="840" height="440" viewBox="0 0 840 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="840" height="440" fill="#fafafa"/>

  <text x="420" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">五种类型的上界：层层包含，取第一个容得下 n 的</text>
  <text x="420" y="60" text-anchor="middle" font-size="11.5" fill="#777777" filter="url(#rough2)">条长按「上界能表示的十进制位数」示意，非等比</text>

  <!-- 行 1：byte -->
  <g filter="url(#rough2)">
    <text x="150" y="146" text-anchor="end" font-size="14" font-weight="bold" fill="#2f4a66">byte</text>
    <rect x="170" y="126" width="42" height="26" fill="#cfe0f5" stroke="#446688" stroke-width="1.4"/>
    <text x="191" y="143" text-anchor="middle" font-size="10" fill="#2f4a66">3 位</text>
    <text x="222" y="146" font-size="12.5" fill="#2b2b2b">上界 127</text>
  </g>

  <!-- 行 2：short -->
  <g filter="url(#rough2)">
    <text x="150" y="210" text-anchor="end" font-size="14" font-weight="bold" fill="#2f5223">short</text>
    <rect x="170" y="190" width="70" height="26" fill="#d9ecd4" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="205" y="207" text-anchor="middle" font-size="10" fill="#2f5223">5 位</text>
    <text x="250" y="210" font-size="12.5" fill="#2b2b2b">上界 32767</text>
  </g>

  <!-- 行 3：int -->
  <g filter="url(#rough2)">
    <text x="150" y="274" text-anchor="end" font-size="14" font-weight="bold" fill="#7a5a1b">int</text>
    <rect x="170" y="254" width="140" height="26" fill="#f6e3c4" stroke="#b58a3a" stroke-width="1.4"/>
    <text x="240" y="271" text-anchor="middle" font-size="10" fill="#7a5a1b">10 位</text>
    <text x="320" y="274" font-size="12.5" fill="#2b2b2b">上界 2147483647</text>
  </g>

  <!-- 行 4：long -->
  <g filter="url(#rough2)">
    <text x="150" y="338" text-anchor="end" font-size="14" font-weight="bold" fill="#8a2b28">long</text>
    <rect x="170" y="318" width="266" height="26" fill="#f6d9d7" stroke="#b85450" stroke-width="1.4"/>
    <text x="303" y="335" text-anchor="middle" font-size="10" fill="#8a2b28">19 位</text>
    <text x="446" y="338" font-size="12.5" fill="#2b2b2b">上界 9223372036854775807</text>
  </g>

  <!-- 行 5：BigInteger -->
  <g filter="url(#rough2)">
    <text x="150" y="402" text-anchor="end" font-size="14" font-weight="bold" fill="#4b3f66">BigInteger</text>
    <rect x="170" y="382" width="440" height="26" fill="#e8e0f2" stroke="#6b5b9a" stroke-width="1.4" stroke-dasharray="7 4"/>
    <text x="330" y="399" text-anchor="middle" font-size="10" fill="#4b3f66">上界 +∞（可存任意整数）</text>
    <text x="622" y="402" font-size="12" fill="#4b3f66">← 永远命中</text>
  </g>

  <text x="40" y="426" font-size="11" fill="#666666" filter="url(#rough2)">n ≥ 1 时四种基本类型的下界都是负数，不构成限制：判定只剩「n 不超过上界」。</text>
</svg>
