<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="320" fill="#fafafa"/>
  <text x="360.0" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">208B：状态 = 各堆顶牌</text>
  <path d="M 144.00 46 Q 360.0 52 576.00 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="60" y="72" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">每次只能把“最右边那一堆”放到它左边第 1 堆或第 3 堆上，且顶牌同花色或同点数。</text>
  <text x="60" y="92" text-anchor="start" font-size="11.5" fill="#333" filter="url(#rough2)">一堆的“顶牌”永远是它里面最右边那张原始牌 —— 影响后续比较的只有顶牌。</text>
  <rect x="100" y="130" width="72" height="46" rx="6" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="136" y="159" text-anchor="middle" font-size="12" fill="#2f5b34" filter="url(#rough2)">2S</text>
  <text x="136" y="192" text-anchor="middle" font-size="9.5" fill="#33506e" filter="url(#rough2)">堆1</text>
  <rect x="190" y="130" width="72" height="46" rx="6" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="226" y="159" text-anchor="middle" font-size="12" fill="#2f5b34" filter="url(#rough2)">2S</text>
  <text x="226" y="192" text-anchor="middle" font-size="9.5" fill="#33506e" filter="url(#rough2)">堆2</text>
  <rect x="280" y="130" width="72" height="46" rx="6" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="316" y="159" text-anchor="middle" font-size="12" fill="#2f5b34" filter="url(#rough2)">2C</text>
  <text x="316" y="192" text-anchor="middle" font-size="9.5" fill="#33506e" filter="url(#rough2)">堆3</text>
  <rect x="370" y="130" width="72" height="46" rx="6" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="406" y="159" text-anchor="middle" font-size="12" fill="#2f5b34" filter="url(#rough2)">2C</text>
  <text x="406" y="192" text-anchor="middle" font-size="9.5" fill="#33506e" filter="url(#rough2)">堆4</text>
  <rect x="460" y="130" width="72" height="46" rx="6" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="496" y="159" text-anchor="middle" font-size="12" fill="#2f5b34" filter="url(#rough2)">3H</text>
  <text x="496" y="192" text-anchor="middle" font-size="9.5" fill="#33506e" filter="url(#rough2)">堆5</text>
  <path d="M 496 152 Q 520 120 470 110" stroke="#8a3a52" stroke-width="1.5" fill="none" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="520" y="112" text-anchor="start" font-size="10" fill="#8a3a52" filter="url(#rough2)">最右堆只能向左 1 或 3</text>
  <rect x="60" y="214" width="620" height="92" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="231" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">状态 = 当前各堆的顶牌序列（长度递减，每步 −1）。</text>
  <text x="74" y="252" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">分支最多 2 个；用“状态 → 是否已知无解”的记忆化搜素剪枝。</text>
  <text x="74" y="273" text-anchor="start" font-size="11" fill="#33506e" filter="url(#rough2)">n ≤ 52，实测最坏（52 张同牌）也在毫秒级。</text>
</svg>
