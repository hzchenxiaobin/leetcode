<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
  </defs>

  <rect width="820" height="470" fill="#fafafa"/>

  <text x="410" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 13 走查：1×3，k = 3，a = [12, 9, −1]</text>

  <!-- 原始序列 -->
  <rect x="42" y="60" width="64" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="106" y="60" width="64" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="170" y="60" width="64" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="74" y="86" text-anchor="middle" font-size="14" fill="#33517a" filter="url(#rough2)">12</text>
  <text x="138" y="86" text-anchor="middle" font-size="14" fill="#33517a" filter="url(#rough2)">9</text>
  <text x="202" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#9c3b38" filter="url(#rough2)">−1</text>

  <text x="256" y="76" font-size="12.5" fill="#333" filter="url(#rough2)">S = 20 ⟹ f = S − 2a = [−4, 2, 22]</text>
  <text x="256" y="100" font-size="11.5" fill="#666" filter="url(#rough2)">d = m−2 = 1；缺格操作给主元 +(m−1) = 2，给其余 +(m−3) = 0</text>

  <!-- 表格 -->
  <rect x="42" y="132" width="776" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="54" y="154" font-size="12" font-weight="bold" fill="#33517a" filter="url(#rough2)">方案</text>
  <text x="210" y="154" font-size="12" font-weight="bold" fill="#33517a" filter="url(#rough2)">主元</text>
  <text x="300" y="154" font-size="12" font-weight="bold" fill="#33517a" filter="url(#rough2)">关键量</text>
  <text x="520" y="154" font-size="12" font-weight="bold" fill="#33517a" filter="url(#rough2)">y 的约束</text>
  <text x="712" y="154" font-size="12" font-weight="bold" fill="#33517a" filter="url(#rough2)">最小 t</text>

  <rect x="42" y="166" width="776" height="46" rx="4" fill="#f2f2f2" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="54" y="194" font-size="12" fill="#444" filter="url(#rough2)">只做整段 A</text>
  <text x="210" y="194" font-size="12" fill="#444" filter="url(#rough2)">—</text>
  <text x="300" y="194" font-size="12" fill="#444" filter="url(#rough2)">第 3 小 f = 22</text>
  <text x="520" y="194" font-size="12" fill="#444" filter="url(#rough2)">d·t ≥ 22</text>
  <text x="712" y="194" font-size="12" font-weight="bold" fill="#444" filter="url(#rough2)">22</text>

  <rect x="42" y="212" width="776" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="54" y="240" font-size="12" fill="#8a6212" filter="url(#rough2)">缺格 B（末格）</text>
  <text x="210" y="240" font-size="12" fill="#8a6212" filter="url(#rough2)">第 3 格</text>
  <text x="300" y="240" font-size="12" fill="#8a6212" filter="url(#rough2)">其余第 2 小 = 2</text>
  <text x="520" y="240" font-size="12" fill="#8a6212" filter="url(#rough2)">y ≥ 22−t，y ≤ t−2</text>
  <text x="712" y="240" font-size="12" font-weight="bold" fill="#8a6212" filter="url(#rough2)">12（y = 10）</text>

  <rect x="42" y="258" width="776" height="46" rx="4" fill="#f2f2f2" stroke="#bbbbbb" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="54" y="286" font-size="12" fill="#444" filter="url(#rough2)">缺格 C（首格）</text>
  <text x="210" y="286" font-size="12" fill="#444" filter="url(#rough2)">第 1 格</text>
  <text x="300" y="286" font-size="12" fill="#444" filter="url(#rough2)">其余第 2 小 = 22</text>
  <text x="520" y="286" font-size="12" fill="#444" filter="url(#rough2)">y ≥ −4−t，y ≤ t−22</text>
  <text x="712" y="286" font-size="12" font-weight="bold" fill="#444" filter="url(#rough2)">22</text>

  <!-- 验证链 -->
  <text x="42" y="340" font-size="12.5" fill="#333" filter="url(#rough2)">取 t = 12：2 次整段 + 10 次 [1, 2]</text>
  <text x="42" y="366" font-size="12.5" fill="#333" filter="url(#rough2)">2 次整段：[12, 9, −1] → [10, 7, −3]</text>
  <text x="42" y="392" font-size="12.5" fill="#333" filter="url(#rough2)">再 10 次 [1, 2]：[10, 7, −3] → [0, −3, −3]</text>
  <text x="42" y="420" font-size="12.5" fill="#2e6e2e" filter="url(#rough2)">此时 S = −6 ⟹ f = [−6, 0, 0] 全部 ≤ 0，三格都是峰值</text>
  <text x="42" y="450" font-size="14.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">答案 = min(22, 12, 22) = 12</text>
</svg>
