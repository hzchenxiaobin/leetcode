<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="320" fill="#fafafa"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">202A：字典序最大的回文子序列（|s| ≤ 10）</text>
  <path d="M 182.90500000000006 46 Q 380.0 52 577.0949999999999 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60.0" y="70.0" width="640.0" height="56.0" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="96.0" text-anchor="start" font-size="11.0" fill="#33506e" filter="url(#rough2)">子序列最多 2¹⁰ 个 ⇒ 全部枚举，逐个判回文并取字典序最大。</text>
  <rect x="60.0" y="150.0" width="580.0" height="30.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="68.0" y="173.0" text-anchor="start" font-size="10.8" font-weight="bold" fill="#26405c" filter="url(#rough2)">s</text>
  <text x="228.0" y="173.0" text-anchor="start" font-size="10.8" font-weight="bold" fill="#26405c" filter="url(#rough2)">答案</text>
  <text x="348.0" y="173.0" text-anchor="start" font-size="10.8" font-weight="bold" fill="#26405c" filter="url(#rough2)">说明</text>
  <path d="M 60.0 150.0 L 640.0 150.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="68.0" y="203.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">radar</text>
  <text x="228.0" y="203.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">rr</text>
  <text x="348.0" y="203.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">取两个 r 比中间 ada 更大</text>
  <path d="M 60.0 180.0 L 640.0 180.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="68.0" y="233.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">bowwowwow</text>
  <text x="228.0" y="233.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">wwwww</text>
  <text x="348.0" y="233.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">取全部 w（5 个）</text>
  <path d="M 60.0 210.0 L 640.0 210.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="68.0" y="263.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">codeforces</text>
  <text x="228.0" y="263.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">s</text>
  <text x="348.0" y="263.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">最大字符 s 出现一次</text>
  <path d="M 60.0 240.0 L 640.0 240.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <text x="68.0" y="293.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">mississipp</text>
  <text x="228.0" y="293.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">ssss</text>
  <text x="348.0" y="293.0" text-anchor="start" font-size="10.8" fill="#2b2b2b" filter="url(#rough2)">全部 s</text>
  <path d="M 60.0 270.0 L 640.0 270.0" stroke="#6b6b6b" stroke-width="0.7" fill="none" filter="url(#rough2)"/>
  <rect x="60.0" y="290.0" width="640.0" height="22.0" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="74.0" y="306.0" text-anchor="start" font-size="10.4" fill="#8a6015" filter="url(#rough2)">注意：更长的回文不一定更大（radar 的 ada 比 rr 小）。</text>
</svg>
