<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="307"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="320" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">三步：拆符号 → 整数每三位分组 → 小数截断/补齐</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">$ 与圆括号的规则只取决于原始符号</text>
  <g filter="url(#rough2)"><rect x="60" y="92" width="780" height="70" rx="6" fill="#cfe0f5" fill-opacity="0.5" stroke="#446688" stroke-width="1.4"/></g>
  <text x="450" y="118" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">输入：−12345678.9</text>
  <text x="450" y="144" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">① 去掉负号（记下 neg = true）</text>
  <g filter="url(#rough2)"><rect x="60" y="176" width="780" height="60" rx="6" fill="#dcecd2" fill-opacity="0.5" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="450" y="200" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">② 整数部分 12345678 → 从右每 3 位一组 → 12,345,678</text>
  <text x="450" y="222" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">   小数部分 9 → 补零到两位 → 90（多了就截断，不四舍五入）</text>
  <g filter="url(#rough2)"><rect x="60" y="248" width="780" height="56" rx="6" fill="#f3d9d6" fill-opacity="0.5" stroke="#8a2b28" stroke-width="1.4"/></g>
  <text x="450" y="272" text-anchor="middle" font-size="12" fill="#8a2b28" filter="url(#rough2)">③ 拼接：$12,345,678.90，neg ⇒ 括号包住整个 $ 串</text>
  <text x="450" y="294" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">输出：($12,345,678.90)</text>
</svg>
