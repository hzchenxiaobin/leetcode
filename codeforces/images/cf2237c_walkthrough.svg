<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：a = (3, 1, 4, 2)，答案 6</text>
  <text x="300" y="46" text-anchor="middle" font-size="10.5" fill="#888">官方第 5 组样例；r 表示链值 c，判定只看 a_i 与 c 的大小关系</text>

  <rect x="40" y="62" width="520" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="90" y="82" text-anchor="middle" font-size="11" fill="#3a4a66">步骤 i</text>
  <text x="190" y="82" text-anchor="middle" font-size="11" fill="#3a4a66">a_i</text>
  <text x="300" y="82" text-anchor="middle" font-size="11" fill="#3a4a66">操作前 c</text>
  <text x="440" y="82" text-anchor="middle" font-size="11" fill="#3a4a66">判定与动作</text>
  <text x="540" y="82" text-anchor="middle" font-size="11" fill="#3a4a66">操作后 c</text>

  <g filter="url(#rough2)">
    <rect x="40" y="96" width="520" height="34" fill="#ffffff" stroke="#c9d6e8" stroke-width="1" rx="4"/>
    <rect x="40" y="134" width="520" height="34" fill="#f5f8fd" stroke="#c9d6e8" stroke-width="1" rx="4"/>
    <rect x="40" y="172" width="520" height="34" fill="#ffffff" stroke="#c9d6e8" stroke-width="1" rx="4"/>
    <rect x="40" y="210" width="520" height="34" fill="#f5f8fd" stroke="#c9d6e8" stroke-width="1" rx="4"/>
  </g>

  <g font-size="11.5" fill="#333" filter="url(#rough2)">
    <text x="90" y="118" text-anchor="middle">1</text>
    <text x="190" y="118" text-anchor="middle">3</text>
    <text x="300" y="118" text-anchor="middle">—（初值）</text>
    <text x="440" y="118" text-anchor="middle">c ← a₁</text>
    <text x="540" y="118" text-anchor="middle">3</text>

    <text x="90" y="156" text-anchor="middle">2</text>
    <text x="190" y="156" text-anchor="middle">1</text>
    <text x="300" y="156" text-anchor="middle">3</text>
    <text x="440" y="156" text-anchor="middle" fill="#8a3a36">1 &lt; 3：吞并，c ← 3+1</text>
    <text x="540" y="156" text-anchor="middle" fill="#8a3a36">4</text>

    <text x="90" y="194" text-anchor="middle">3</text>
    <text x="190" y="194" text-anchor="middle">4</text>
    <text x="300" y="194" text-anchor="middle">4</text>
    <text x="440" y="194" text-anchor="middle" fill="#3a5a30">4 ≥ 4：重置，c ← a₃</text>
    <text x="540" y="194" text-anchor="middle" fill="#3a5a30">4</text>

    <text x="90" y="232" text-anchor="middle">4</text>
    <text x="190" y="232" text-anchor="middle">2</text>
    <text x="300" y="232" text-anchor="middle">4</text>
    <text x="440" y="232" text-anchor="middle" fill="#8a3a36">2 &lt; 4：吞并，c ← 4+2</text>
    <text x="540" y="232" text-anchor="middle" fill="#8a3a36">6</text>
  </g>

  <rect x="40" y="252" width="520" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="277" font-size="11" fill="#7a5c10">扫描结束，c = 6 ⇒ 最小可能的最大堆为 6，与官方输出一致</text>

  <text x="300" y="318" text-anchor="middle" font-size="11" fill="#555">对应的合法操作序列（不是唯一）：</text>
  <rect x="52" y="330" width="496" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="70" y="352" font-size="10.5" fill="#3a5a30">(3,1) → (1,4)：得 [1,4,4,2]；(4,2) → (2,6)：得 [1,4,2,6]；</text>
  <text x="70" y="370" font-size="10.5" fill="#3a5a30">再 (4,2) → (2,6)：得 [1,2,6,6]，全程最大值 6</text>
</svg>
