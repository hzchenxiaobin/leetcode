<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="213"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="440" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">187B：每种车各跑一次 Floyd；换车 = 在 min-plus 意义下再乘一次 g</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="70.0" y="90.0" width="70.0" height="46.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="105.0" y="117.3" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">车1</text>
  <line x1="148.0" y1="113.0" x2="160.0" y2="113.0" stroke="#446688" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="160.0" y="96.0" width="0.0" height="0.0" fill="#000000" stroke="#000000" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="160.0" y="96.4" text-anchor="middle" font-size="1" fill="#000000" font-weight="bold" filter="url(#rough2)"></text>
  <rect x="160.0" y="90.0" width="70.0" height="46.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="195.0" y="117.3" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">车2</text>
  <line x1="238.0" y1="113.0" x2="250.0" y2="113.0" stroke="#446688" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="250.0" y="96.0" width="0.0" height="0.0" fill="#000000" stroke="#000000" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="250.0" y="96.4" text-anchor="middle" font-size="1" fill="#000000" font-weight="bold" filter="url(#rough2)"></text>
  <rect x="250.0" y="90.0" width="70.0" height="46.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="285.0" y="117.3" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">车3</text>
  <line x1="328.0" y1="113.0" x2="340.0" y2="113.0" stroke="#446688" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="340.0" y="96.0" width="0.0" height="0.0" fill="#000000" stroke="#000000" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="340.0" y="96.4" text-anchor="middle" font-size="1" fill="#000000" font-weight="bold" filter="url(#rough2)"></text>
  <text x="70.0" y="170.0" text-anchor="start" font-size="11.5" fill="#444" filter="url(#rough2)">d[c] = 只用第 c 种车的全源最短路（Floyd）</text>
  <text x="70.0" y="200.0" text-anchor="start" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">g[i][j] = min_c d[c][i][j]  —— 一段（不换车）</text>
  <rect x="60.0" y="230.0" width="600.0" height="70.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="74.0" y="253.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">f[0] = g（0 次换车）</text>
  <text x="74.0" y="279.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">f[k][i][j] = min_x f[k-1][i][x] + g[x][j]（至多 k 次换车）</text>
  <rect x="60.0" y="316.0" width="600.0" height="70.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="74.0" y="339.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">k 超过 n-1 后饱和：简单路径最多 n-1 段</text>
  <text x="74.0" y="365.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">每次查询 O(1)：答案 = f[min(k,n-1)][s][t]</text>
</svg>
