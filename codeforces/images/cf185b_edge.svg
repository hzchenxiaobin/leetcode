<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="330" fill="#fafafa"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">边界：指数为 0 与全 0</text>
  <path d="M 268.84 46 Q 380.0 52 491.16 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60.0" y="70.0" width="660.0" height="62.0" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="94.0" text-anchor="start" font-size="11.2" fill="#8a6015" filter="url(#rough2)">若某个指数为 0：该坐标贡献恒为 1（0⁰=1），把它的份额让给其它坐标只会更大 ⇒ 取 0。</text>
  <text x="74.0" y="116.0" text-anchor="start" font-size="11.2" fill="#8a6015" filter="url(#rough2)">所以设 x_i = S·a_i/T 时，a_i = 0 的位置自然是 0，恰好也是最优。</text>
  <rect x="60.0" y="148.0" width="660.0" height="62.0" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="172.0" text-anchor="start" font-size="11.2" fill="#2f5b34" filter="url(#rough2)">若 a=b=c=0：任何点都得到 1，输出任意合法点（例如 0 0 0），ln(1)=0 与最优一致。</text>
  <text x="74.0" y="194.0" text-anchor="start" font-size="11.2" fill="#2f5b34" filter="url(#rough2)">注意 T = a+b+c = 0 时不能做除法，必须单独分支。</text>
  <rect x="60.0" y="226.0" width="660.0" height="60.0" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="250.0" text-anchor="start" font-size="11.2" fill="#33506e" filter="url(#rough2)">评测：比较的是 ln(距离) 的差 ≤ 1e-6，所以只要点合法且达到最优值即可，输出格式不限。</text>
  <text x="74.0" y="272.0" text-anchor="start" font-size="11.2" fill="#33506e" filter="url(#rough2)">建议直接打印 10 位小数，避免浮点误差。</text>
</svg>
