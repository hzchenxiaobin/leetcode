<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 0 780 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="780" height="440" fill="#fafafa"/>

  <text x="390" y="28" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">每个 n 只需 O(log n)：求出最小可行 P_min，再只沿 32 的倍数扫描</text>
  <path d="M 40 40 Q 390 47 740 40" stroke="#2b2b2b" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <rect x="36" y="60" width="330" height="56" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="201" y="84" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">M = ⌊n / 2⌋（n ≥ 2）</text>
  <text x="201" y="105" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">要最小化 2P + sumpos(P)，约束 P − popcount(P) ≥ M</text>

  <rect x="36" y="132" width="330" height="52" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="201" y="155" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">P_min = 最小偶数 P，满足 P − popcount(P) ≥ M</text>
  <text x="201" y="175" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">从 n 的偶数邻居开始每次 +2，最多几十步</text>

  <rect x="36" y="200" width="330" height="52" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="201" y="223" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">best = 2·P_min + sumpos(P_min)</text>
  <text x="201" y="243" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">P ← 第一个 ≥ P_min 的 32 的倍数</text>

  <rect x="36" y="268" width="330" height="76" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="201" y="289" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">若 2P ≥ best ⇒ 立即停</text>
  <text x="201" y="310" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">否则 best = min(best, 2P + sumpos(P))，P += 32</text>
  <text x="201" y="331" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">best 只降不升 ⇒ 约 30 轮就结束</text>

  <rect x="36" y="360" width="330" height="52" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="201" y="383" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">f(n) = best − n</text>
  <text x="201" y="403" text-anchor="middle" font-size="11.5" fill="#a14340" filter="url(#rough2)">n = 0 输出 0，n = 1 输出 1</text>

  <path d="M 201 116 L 201 130" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 201 184 L 201 198" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 201 252 L 201 266" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 201 344 L 201 358" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 384 60 L 384 412" stroke="#c9c9c9" stroke-width="1.4" fill="none" stroke-dasharray="5 6" filter="url(#rough2)"/>

  <rect x="404" y="60" width="342" height="128" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.0" filter="url(#rough2)"/>
  <text x="575" y="84" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">关键引理：段内代价不减</text>
  <text x="575" y="108" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">Δ(P) = cost(P+2) − cost(P)</text>
  <text x="575" y="130" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">= 4 + (t+1)(2−t)/2 ≥ 0（t ≤ 3）</text>
  <text x="575" y="152" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">t = P/2 末尾连续 1 的个数</text>
  <text x="575" y="174" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">t ≥ 4 ⟺ P ≡ 30 (mod 32) ⟺ P+2 是 32 的倍数</text>

  <rect x="404" y="200" width="342" height="126" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="575" y="224" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">于是只需检查这些 P</text>
  <text x="575" y="248" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">① P_min（第一段的左端点）</text>
  <text x="575" y="270" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">② 32 的倍数（每段的左端点）</text>
  <text x="575" y="292" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">sumpos ≥ 0，所以 2P ≥ best 时整段作废</text>
  <text x="575" y="314" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">扫描只走 O(sumpos/64) 步</text>

  <rect x="404" y="338" width="342" height="74" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="575" y="362" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">为什么 popcount 会进来？</text>
  <text x="575" y="384" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">Σ(2^(m_i)−1) = P − k，k 就是 P 的 popcount</text>
  <text x="575" y="404" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">故约束化成 P − popcount(P) ≥ M</text>
</svg>
