<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="137"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="720" height="300" fill="#fafafa"/>
  <text x="360" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">先扫点、再判四条、最后逐段取最小 ext</text>
  <path d="M 170 46 Q 360 52 550 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <rect x="30" y="92" width="150" height="58" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="105.0" y="116" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">扫出所有点</text>
  <text x="105.0" y="136" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555" filter="url(#rough2)">dots[]</text>
  <rect x="210" y="92" width="150" height="58" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="285.0" y="116" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">判四条条件</text>
  <text x="285.0" y="136" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555" filter="url(#rough2)">任一不满足 → NO</text>
  <rect x="390" y="92" width="150" height="58" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="465.0" y="116" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">逐段构造</text>
  <text x="465.0" y="136" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555" filter="url(#rough2)">e = max(1, g−9)</text>
  <rect x="570" y="92" width="120" height="58" rx="10" fill="#f3e8fb" stroke="#7a4a9a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="630.0" y="116" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">输出 YES</text>
  <text x="630.0" y="136" text-anchor="middle" font-size="10.5" font-weight="normal" fill="#555" filter="url(#rough2)">+ 各段</text>
  <line x1="182" y1="121" x2="208" y2="121" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <line x1="362" y1="121" x2="388" y2="121" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <line x1="542" y1="121" x2="568" y2="121" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="30" y="186" width="660" height="80" rx="10" fill="#fdecea" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="46" y="210" text-anchor="start" font-size="11.5" font-weight="bold" fill="#8c3a36" filter="url(#rough2)">为什么点必须全部用上：每段恰好一个点，段又按顺序铺满整个串，</text>
  <text x="46" y="232" text-anchor="start" font-size="11" font-weight="normal" fill="#8c3a36" filter="url(#rough2)">所以第 i 段对应的只能是第 i 个点——跳过任何一个点都会让它落进 name/ext，而这两者不许有点。</text>
  <text x="46" y="254" text-anchor="start" font-size="11" font-weight="normal" fill="#8c3a36" filter="url(#rough2)">于是问题从“二维切分”降成了一维的“点距检查”。</text>
</svg>
