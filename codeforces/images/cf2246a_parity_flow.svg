<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 450"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#777"/>
    </marker>
  </defs>

  <rect width="620" height="450" fill="#fafafa"/>

  <text x="310" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">构造流水线：一个奇偶不变量终结一切选择</text>

  <rect x="110" y="48" width="400" height="46" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="76" text-anchor="middle" font-size="14" fill="#223" filter="url(#rough2)">读入 n（偶数，2 ≤ n ≤ 50）</text>

  <path d="M310 94 L310 122" stroke="#777" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="124" width="400" height="46" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="152" text-anchor="middle" font-size="14" fill="#223" filter="url(#rough2)">交换相邻对：p(2k−1) = 2k，p(2k) = 2k−1</text>

  <path d="M310 170 L310 198" stroke="#777" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="200" width="400" height="46" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="228" text-anchor="middle" font-size="14" fill="#223" filter="url(#rough2)">奇位置拿偶数值 ⇒ 每个 i·p_i 都是偶数</text>

  <path d="M310 246 L310 274" stroke="#777" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="276" width="400" height="46" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="304" text-anchor="middle" font-size="14" fill="#223" filter="url(#rough2)">任取 x_i ∈ {−i·p_i, 0, +i·p_i}，求和仍是偶数</text>

  <path d="M310 322 L310 350" stroke="#777" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="352" width="400" height="54" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="310" y="376" text-anchor="middle" font-size="14.5" fill="#223" filter="url(#rough2)">c_final ≡ 0 (mod 2)，而 1 是奇数</text>
  <text x="310" y="396" text-anchor="middle" font-size="14.5" fill="#b85450" filter="url(#rough2)">⇒ 无论怎么选都不会等于 1 ✓</text>

  <text x="548" y="230" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">奇数下标 ×</text>
  <text x="548" y="246" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">偶数值</text>
  <text x="548" y="304" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">3ⁿ 种选择</text>
  <text x="548" y="320" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">一个都不用验</text>

  <text x="310" y="432" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">输出这个排列即可，O(n) 时间、O(1) 额外空间</text>
</svg>
