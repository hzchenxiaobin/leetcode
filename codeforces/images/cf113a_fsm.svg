<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="59"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="330" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">三阶段自动机：形容词区 → 名词区 → 动词区</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">每读一个词就按它的词性转移，任何越界转移都判 NO</text>
  <g filter="url(#rough2)"><circle cx="160" cy="150" r="42" fill="#cfe0f5" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="160" y="155.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="160" y="104" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">形容词区</text>
  <text x="160" y="214" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">还没见到名词</text>
  <g filter="url(#rough2)"><circle cx="450" cy="150" r="42" fill="#f6e3c4" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="450" y="155.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="450" y="104" text-anchor="middle" font-size="11.5" fill="#b06a1e" filter="url(#rough2)">名词区</text>
  <text x="450" y="214" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">名词数已为 1</text>
  <g filter="url(#rough2)"><circle cx="740" cy="150" r="42" fill="#dcecd2" fill-opacity="0.9" stroke="#446688" stroke-width="1.5"/></g>
  <text x="740" y="155.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="740" y="104" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">动词区</text>
  <text x="740" y="214" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">只允许动词</text>
  <g filter="url(#rough2)"><line x1="202" y1="150" x2="404" y2="150" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)"/></g>
  <text x="303" y="138" text-anchor="middle" font-size="11" fill="#b06a1e" filter="url(#rough2)">遇到名词</text>
  <g filter="url(#rough2)"><line x1="492" y1="150" x2="694" y2="150" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)"/></g>
  <text x="593" y="138" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">遇到动词</text>
  <g filter="url(#rough2)"><path d="M 180 112 C 300 60, 600 60, 720 112" fill="none" stroke="#4a7a3a" stroke-width="1.3" stroke-dasharray="6 5" marker-end="url(#arr)"/></g>
  <text x="450" y="66" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">直接遇到动词（跳过名词）→ 名词数 0 → 最后判 NO</text>
  <g filter="url(#rough2)"><path d="M 140 190 C 140 254, 400 258, 432 192" fill="none" stroke="#446688" stroke-width="1.3" stroke-dasharray="6 5" marker-end="url(#arr)"/></g>
  <text x="286" y="268" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">形容词：自环</text>
  <g filter="url(#rough2)"><path d="M 720 190 C 720 254, 470 258, 468 192" fill="none" stroke="#446688" stroke-width="1.3" stroke-dasharray="6 5" marker-end="url(#arr)"/></g>
  <text x="600" y="268" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">动词：自环</text>
  <g filter="url(#rough2)"><rect x="360" y="288" width="540" height="30" rx="6" fill="#f3d9d6" fill-opacity="0.6" stroke="#8a2b28" stroke-width="1.4"/></g>
  <text x="630" y="308" text-anchor="middle" font-size="11" fill="#8a2b28" filter="url(#rough2)">形容词出现在名词之后 / 名词出现两次 / 动词出现在名词之前 ⇒ NO</text>
</svg>
