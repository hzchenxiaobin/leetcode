<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300"
     font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,cursive">
  <defs><filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="821"/>
    <feDisplacementMap in="SourceGraphic" scale="1.5"/></filter></defs>
  <rect width="700" height="300" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">条件翻译：余数相同的元素必须"删到只剩一个"</text>
  <path d="M 110 40 Q 350 46 590 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)"><rect x="60" y="58" width="580" height="76" rx="8" fill="#dfeafc" stroke="#446688" stroke-width="1.3"/></g>
  <text x="76" y="82" font-size="12.5" fill="#22314a" filter="url(#rough2)">要求：剩下的数两两不同余（mod m）⟺ 每个余数类里最多留一个。</text>
  <text x="76" y="106" font-size="12.5" fill="#22314a" filter="url(#rough2)">所以对给定 m，最少删除数 = Σ_c (c_r − 1) = n − (非空余数类个数)。</text>
  <text x="76" y="130" font-size="12.5" fill="#22314a" filter="url(#rough2)">判定：n − 类数 ≤ k。k ≤ 4 很小 ⇒ 一旦已删超过 k 就可以提前退出。</text>
  <g filter="url(#rough2)"><rect x="60" y="146" width="580" height="66" rx="8" fill="#f6fbf2" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="76" y="170" font-size="12.5" fill="#2f5223" filter="url(#rough2)">答案一定存在：取 m &gt; max(a) − min(a) 时任意两数之差都不是 m 的倍数 ⇒ 无需删除。</text>
  <text x="76" y="194" font-size="12.5" fill="#2f5223" filter="url(#rough2)">于是从 m=1 开始逐个试，第一个满足的就是最小 m。</text>
  <g filter="url(#rough2)"><rect x="60" y="224" width="580" height="60" rx="8" fill="#fdf3d0" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="76" y="248" font-size="12.5" fill="#8a6015" filter="url(#rough2)">样例 1：n=7,k=0，集合 {0,2,3,6,7,12,18} ⇒ m=13 是第一个"无冲突"的模数。</text>
  <text x="76" y="270" font-size="12.5" fill="#8a6015" filter="url(#rough2)">样例 2：k=1 ⇒ 允许一处冲突 ⇒ m 降到 7。</text>
</svg>
