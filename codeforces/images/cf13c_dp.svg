<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>

  <text x="330" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">dp[i][j] = |a_i − v_j| + min_{k ≤ j} dp[i−1][k]</text>
  <path d="M 150 44 Q 340 50 530 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 列头 -->
  <g font-size="12" fill="#555" text-anchor="middle" filter="url(#rough2)">
    <text x="197" y="72">v₁</text><text x="292" y="72">v₂</text>
    <text x="387" y="72">v₃</text><text x="482" y="72">v₄</text>
  </g>
  <!-- 行标签 -->
  <g font-size="12" fill="#555" text-anchor="end" filter="url(#rough2)">
    <text x="142" y="110">i−1</text><text x="142" y="168">i</text><text x="142" y="226">i+1</text>
  </g>

  <!-- 表格 -->
  <g fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)">
    <rect x="152" y="80" width="90" height="48"/><rect x="242" y="80" width="90" height="48"/>
    <rect x="332" y="80" width="90" height="48"/><rect x="422" y="80" width="90" height="48"/>
    <rect x="152" y="138" width="90" height="48"/><rect x="242" y="138" width="90" height="48"/>
    <rect x="332" y="138" width="90" height="48"/><rect x="422" y="138" width="90" height="48"/>
    <rect x="152" y="196" width="90" height="48"/><rect x="242" y="196" width="90" height="48"/>
    <rect x="332" y="196" width="90" height="48"/><rect x="422" y="196" width="90" height="48"/>
  </g>
  <!-- 前缀高亮 -->
  <g fill="#e6f4ea" opacity="0.85" filter="url(#rough2)">
    <rect x="152" y="80" width="270" height="48"/>
  </g>
  <rect x="332" y="138" width="90" height="48" fill="#fde8e8" opacity="0.9" filter="url(#rough2)"/>

  <text x="387" y="168" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a33a36" filter="url(#rough2)">(i, j)</text>

  <!-- 箭头：前缀最小 -->
  <path d="M 385 130 L 385 136" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="370" y="134" text-anchor="end" font-size="9.5" fill="#2f4a66" filter="url(#rough2)">取前缀最小</text>

  <!-- 右侧说明 -->
  <g font-size="11" fill="#7a5a1b" filter="url(#rough2)">
    <text x="530" y="104">pref[j] = min(pref[j−1], dp[i−1][j])</text>
    <text x="530" y="130">从左到右滚一遍前缀最小</text>
    <text x="530" y="170">dp[i][j] = |a_i − v_j| + pref[j]</text>
    <text x="530" y="196">每个格子 O(1)</text>
  </g>

  <text x="30" y="286" font-size="12" fill="#2b2b2b" filter="url(#rough2)">m = 不同输入值的个数 ≤ n；表格共 n 行 × m 列，按行推进。</text>
  <text x="30" y="316" font-size="12" fill="#2b2b2b" filter="url(#rough2)">答案 = min_j dp[n][j]；时间 O(n·m)，空间 O(m)（只保留上一行与当前行）。</text>
  <text x="30" y="346" font-size="12" fill="#2b2b2b" filter="url(#rough2)">绿色：计算 (i, j) 时要用到的第 i−1 行前缀；红色：当前格。</text>
</svg>
