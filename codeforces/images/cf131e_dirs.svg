<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320" viewBox="0 0 700 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1319"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="700" height="320" fill="#fafafa"/>
  <text x="350.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">四个方向族</text>
  <path d="M 112.0 42 Q 350.0 48 588.0 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="350.0" y="306" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">行、列、两条对角：同线排序后相邻者互相威胁</text>
  <line x1="180.0" y1="160.0" x2="420.0" y2="160.0" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <text x="430" y="152" text-anchor="start" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">行</text>
  <line x1="300.0" y1="40.0" x2="300.0" y2="280.0" stroke="#5a7fb0" stroke-width="1.8" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <text x="310" y="272" text-anchor="end" font-size="10.5" fill="#5a7fb0" filter="url(#rough2)">列</text>
  <line x1="180.0" y1="40.0" x2="420.0" y2="280.0" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <text x="430" y="272" text-anchor="start" font-size="10.5" fill="#d6a040" filter="url(#rough2)">主对角</text>
  <line x1="180.0" y1="280.0" x2="420.0" y2="40.0" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <text x="430" y="32" text-anchor="start" font-size="10.5" fill="#b85450" filter="url(#rough2)">副对角</text>
  <circle cx="300" cy="160" r="8" fill="#333333" filter="url(#rough2)"/>
  <text x="540" y="120" text-anchor="start" font-size="11" fill="#555555" filter="url(#rough2)">每方向只算最近的</text>
  <text x="540" y="150" text-anchor="start" font-size="11" fill="#555555" filter="url(#rough2)">同线排序后取相邻对</text>
  <text x="350" y="290" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">w ≤ 8；统计 t0..t8</text>
</svg>
