<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="311"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="300" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">两个「陷阱」样例</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">截断不四舍五入；括号只看原始符号</text>
  <text x="90" y="104" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">样例 4：−12345678.9</text>
  <text x="90" y="132" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">整数 12345678 → 12,345,678；小数 9 → 90</text>
  <text x="90" y="158" text-anchor="start" font-size="12" fill="#4a7a3a" filter="url(#rough2)">负数 ⇒ 括号：($12,345,678.90)</text>
  <text x="90" y="208" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">样例 3：−0.00987654321</text>
  <text x="90" y="236" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">小数前两位是 00（截断）⇒ 数值变成 0.00</text>
  <g filter="url(#rough2)"><rect x="90" y="250" width="500" height="34" rx="5" fill="#f3d9d6" fill-opacity="0.85" stroke="#8a2b28" stroke-width="1.4"/></g>
  <text x="340" y="273" text-anchor="middle" font-size="12" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">但原始是负数 ⇒ 仍然要括号：($0.00)</text>
  <text x="660" y="208" text-anchor="start" font-size="11" fill="#666666" filter="url(#rough2)">若四舍五入</text>
  <text x="660" y="232" text-anchor="start" font-size="11" fill="#666666" filter="url(#rough2)">会得到 $0.01</text>
  <text x="660" y="256" text-anchor="start" font-size="11" fill="#666666" filter="url(#rough2)">——所以必须</text>
  <text x="660" y="280" text-anchor="start" font-size="11" fill="#446688" filter="url(#rough2)">字符串截断</text>
</svg>
