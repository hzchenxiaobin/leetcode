<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="300" fill="#fafafa"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">202A：回文 + 字典序的两条要点</text>
  <path d="M 231.95 46 Q 380.0 52 528.05 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60.0" y="70.0" width="640.0" height="56.0" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="96.0" text-anchor="start" font-size="11.0" fill="#2f5b34" filter="url(#rough2)">回文判定：t == reverse(t)（枚举子序列后 O(|t|) 检查即可）。</text>
  <rect x="60.0" y="146.0" width="640.0" height="56.0" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="172.0" text-anchor="start" font-size="11.0" fill="#8a6015" filter="url(#rough2)">字典序：先比第一个不同字符；若一个是另一个前缀，则更长的更大。</text>
  <rect x="60.0" y="222.0" width="640.0" height="56.0" rx="9" fill="#eef3fb" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74.0" y="246.0" text-anchor="start" font-size="11.0" fill="#33506e" filter="url(#rough2)">复杂度 O(2ⁿ·n)，n ≤ 10 ⇒ 约 10⁴，轻松。</text>
</svg>
