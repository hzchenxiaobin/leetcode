<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="611"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="300" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">在日志里找方向相反、时间差在 (0,d] 的两条消息</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">命中即把无序列 {A,B} 放进集合</text>
  <g filter="url(#rough2)"><rect x="90" y="90" width="260" height="32" rx="4" fill="#ffffff" fill-opacity="0.35" stroke="#446688" stroke-width="1.4"/></g>
  <text x="220" y="112" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">vasya → petya</text>
  <text x="380" y="112" text-anchor="start" font-size="11.5" fill="#446688" filter="url(#rough2)">t = 1</text>
  <g filter="url(#rough2)"><rect x="90" y="134" width="260" height="32" rx="4" fill="#ffffff" fill-opacity="0.35" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="220" y="156" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">petya → vasya</text>
  <text x="380" y="156" text-anchor="start" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">t = 2</text>
  <g filter="url(#rough2)"><rect x="90" y="178" width="260" height="32" rx="4" fill="#ffffff" fill-opacity="0.35" stroke="#666666" stroke-width="1.4"/></g>
  <text x="220" y="200" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">anya → ivan</text>
  <text x="380" y="200" text-anchor="start" font-size="11.5" fill="#666666" filter="url(#rough2)">t = 2</text>
  <g filter="url(#rough2)"><rect x="90" y="222" width="260" height="32" rx="4" fill="#ffffff" fill-opacity="0.35" stroke="#666666" stroke-width="1.4"/></g>
  <text x="220" y="244" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">ivan → anya</text>
  <text x="380" y="244" text-anchor="start" font-size="11.5" fill="#666666" filter="url(#rough2)">t = 4</text>
  <text x="600" y="110" text-anchor="start" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">d = 1</text>
  <text x="600" y="148" text-anchor="start" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">2−1 = 1 ≤ d ⇒ 好友</text>
  <text x="600" y="178" text-anchor="start" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">4−2 = 2 &gt; d ⇒ 不是</text>
  <text x="600" y="214" text-anchor="start" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案：petya vasya</text>
</svg>
