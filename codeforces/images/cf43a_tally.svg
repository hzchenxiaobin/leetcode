<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2b2b2b"/>
    </marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arra" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">计分板：每读到一行，就在对应队名下添一笔</text>
  <path d="M 200 46 Q 360 52 520 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="40" y="66" width="400" height="250" rx="0" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="96" text-anchor="start" font-size="13" font-weight="bold" fill="#8a8a8a" filter="url(#rough2)">队名</text>
  <text x="300" y="96" text-anchor="start" font-size="13" font-weight="bold" fill="#8a8a8a" filter="url(#rough2)">进球（正字）</text>
  <text x="60" y="154" text-anchor="start" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">A</text>
  <line x1="300" y1="130" x2="300" y2="176" stroke="#4a7a3a" stroke-width="3" opacity="1.0" filter="url(#rough2)"/>
  <line x1="322" y1="130" x2="322" y2="176" stroke="#4a7a3a" stroke-width="3" opacity="1.0" filter="url(#rough2)"/>
  <line x1="344" y1="130" x2="344" y2="176" stroke="#4a7a3a" stroke-width="3" opacity="1.0" filter="url(#rough2)"/>
  <text x="386" y="160" text-anchor="start" font-size="18" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <text x="60" y="220" text-anchor="start" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">ABA</text>
  <line x1="300" y1="196" x2="300" y2="242" stroke="#446688" stroke-width="3" opacity="1.0" filter="url(#rough2)"/>
  <line x1="322" y1="196" x2="322" y2="242" stroke="#446688" stroke-width="3" opacity="1.0" filter="url(#rough2)"/>
  <text x="386" y="226" text-anchor="start" font-size="18" font-weight="bold" fill="#446688" filter="url(#rough2)">2</text>
  <text x="60" y="296" text-anchor="start" font-size="12" fill="#8a8a8a" filter="url(#rough2)">1 笔 = 1 个进球；最多只有两支球队</text>
  <line x1="444" y1="176" x2="478" y2="176" stroke="#2b2b2b" stroke-width="2" opacity="1.0" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="482" y="106" width="198" height="144" rx="0" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="581" y="140" text-anchor="middle" font-size="14" fill="#8a6015" filter="url(#rough2)">比较计数</text>
  <text x="581" y="184" text-anchor="middle" font-size="27" font-weight="bold" fill="#8a6015" filter="url(#rough2)">3 &gt; 2</text>
  <text x="581" y="222" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6015" filter="url(#rough2)">胜者 = A</text>
  <text x="360" y="360" text-anchor="middle" font-size="13" fill="#8a8a8a" filter="url(#rough2)">名字 → 计数 的哈希表；顺序不影响最终结果</text>
</svg>
