<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="623"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="300" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">每个字母一棵树状数组，按「出现序号」索引</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">第 p 个存活出现 = 前缀和首次 ≥ p 的下标（倍增）</text>
  <text x="90" y="100" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">pos['a']</text>
  <g filter="url(#rough2)"><rect x="200" y="84" width="74" height="38" rx="3" fill="#cfe0f5" fill-opacity="0.6" stroke="#446688" stroke-width="1.4"/></g>
  <text x="237" y="109" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="290" y="84" width="74" height="38" rx="3" fill="#cfe0f5" fill-opacity="0.6" stroke="#446688" stroke-width="1.4"/></g>
  <text x="327" y="109" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="380" y="84" width="74" height="38" rx="3" fill="#cfe0f5" fill-opacity="0.6" stroke="#446688" stroke-width="1.4"/></g>
  <text x="417" y="109" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">6</text>
  <g filter="url(#rough2)"><rect x="470" y="84" width="74" height="38" rx="3" fill="#ffffff" fill-opacity="0.6" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="507" y="109" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">9</text>
  <g filter="url(#rough2)"><rect x="560" y="84" width="74" height="38" rx="3" fill="#cfe0f5" fill-opacity="0.6" stroke="#446688" stroke-width="1.4"/></g>
  <text x="597" y="109" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">11</text>
  <text x="200" y="148" text-anchor="start" font-size="12" fill="#446688" filter="url(#rough2)">B_a = 1 1 1 0 1</text>
  <text x="200" y="180" text-anchor="start" font-size="12" fill="#4a7a3a" filter="url(#rough2)">第 3 个存活 a ⇒ 下标 3（位置 6）</text>
  <g filter="url(#rough2)"><rect x="60" y="212" width="780" height="56" rx="6" fill="#dcecd2" fill-opacity="0.35" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="450" y="240" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">删除后只把该下标置 0；总规模 Σ|pos[c]| = |t|</text>
</svg>
