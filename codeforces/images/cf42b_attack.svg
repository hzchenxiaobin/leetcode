<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="257"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="340" fill="#fafafa"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">攻击判定 = 白王相邻 或 车的干净直线</text>
  <path d="M 140 40 Q 400 46 660 40" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="60" y="80" width="300" height="150" rx="12" fill="#eef4fb" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="80" y="110" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">白王</text>
  <text x="80" y="140" font-size="12" fill="#2b2b2b" filter="url(#rough2)">切比雪夫距离 ≤ 1 → 攻击</text>
  <text x="80" y="170" font-size="11.5" fill="#777777" filter="url(#rough2)">黑王不能走到白王身边</text>
  <rect x="440" y="80" width="300" height="150" rx="12" fill="#fbe3c8" stroke="#c98a2b" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="460" y="110" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">白车</text>
  <text x="460" y="140" font-size="12" fill="#2b2b2b" filter="url(#rough2)">同一行/列且中间无任何棋子</text>
  <text x="460" y="170" font-size="11.5" fill="#777777" filter="url(#rough2)">白王、另一辆车都能挡路</text>
  <text x="60" y="280" font-size="12" fill="#2b2b2b" filter="url(#rough2)">将死 = 黑王当前被攻击，且 8 个邻格全不可去（出界 / 白王格 / 仍被攻击）。</text>
  <text x="60" y="310" font-size="12" fill="#8a2b28" filter="url(#rough2)">吃车要先把该车移除，再判断落点是否仍被攻击（样例 3 靠这条才判对）。</text>

</svg>
