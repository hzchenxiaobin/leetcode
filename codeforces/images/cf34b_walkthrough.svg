<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="331"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="760" height="320" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">B：两个样例——注意 0 与正价都不买</text>
  <path d="M 200 42 Q 380 47 560 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <rect x="36" y="66" width="688" height="100" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="48" y="90" font-size="11.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">样例 1：5 3 / -6 0 35 -2 4</text>
  <text x="48" y="114" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">负价只有 -6、-2；0 与 4、35 买了要倒贴钱，不买</text>
  <text x="48" y="136" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">收益 6 + 2 = 8（m=3 允许带 3 台，但只有 2 台值得带）</text>
  <text x="48" y="158" font-size="10.5" fill="#2f5223" filter="url(#rough2)">输出 8</text>

  <rect x="36" y="180" width="688" height="100" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="48" y="204" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">样例 2：4 2 / 7 0 0 -7</text>
  <text x="48" y="228" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">只有 -7 是负价；两个 0 与 7 都不买</text>
  <text x="48" y="250" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">收益 7（m=2，但只买 1 台更划算）</text>
  <text x="48" y="272" font-size="10.5" fill="#8a6015" filter="url(#rough2)">输出 7</text>
  <text x="380" y="304" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">若负价多于 m 台，就取“最负”的 m 台；答案用 64 位整数保存。</text>
</svg>
