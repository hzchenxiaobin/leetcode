<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="101"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="340" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1：三角形价格和 1+2+3 = 6</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">样例 3 只有四边形 → −1</text>
  <g filter="url(#rough2)"><line x1="300" y1="100" x2="500" y2="100" stroke="#7a9a6a" stroke-width="2.6"/></g>
  <g filter="url(#rough2)"><line x1="500" y1="100" x2="400" y2="240" stroke="#7a9a6a" stroke-width="2.6"/></g>
  <g filter="url(#rough2)"><line x1="400" y1="240" x2="300" y2="100" stroke="#7a9a6a" stroke-width="2.6"/></g>
  <g filter="url(#rough2)"><circle cx="300" cy="100" r="22" fill="#d7ecd0" fill-opacity="0.85" stroke="#6a9a58" stroke-width="1.8"/></g>
  <text x="300" y="106" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><circle cx="500" cy="100" r="22" fill="#d7ecd0" fill-opacity="0.85" stroke="#6a9a58" stroke-width="1.8"/></g>
  <text x="500" y="106" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">2</text>
  <g filter="url(#rough2)"><circle cx="400" cy="240" r="22" fill="#d7ecd0" fill-opacity="0.85" stroke="#6a9a58" stroke-width="1.8"/></g>
  <text x="400" y="246" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="640" y="140" text-anchor="start" font-size="12" fill="#2f4a66" filter="url(#rough2)">价格 1, 2, 3</text>
  <text x="640" y="168" text-anchor="start" font-size="13" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">和 = 6</text>
  <text x="440" y="300" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">三件必须两两都匹配（完全图三角形），因此要枚举三元组并检查三条边</text>
</svg>
