<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="760" height="320" fill="#fafafa"/>
  <text x="380.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">197A：先手把第一块盘子放在桌子正中央，之后镜像对手</text>
  <path d="M 142.1900000000001 46 Q 380.0 52 617.81 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="70.0" y="70.0" width="300.0" height="190.0" rx="6" fill="#fafafa" stroke="#6b6b6b" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="220.0" cy="165.0" r="45.0" fill="#fff3d6" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220.0" y="170.0" text-anchor="middle" font-size="10.8" font-weight="bold" fill="#8a6015" filter="url(#rough2)">第一块</text>
  <circle cx="120.0" cy="110.0" r="30.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="320.0" cy="220.0" r="30.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 120.0 110.0 L 320.0 220.0" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="220.0" y="180.0" text-anchor="middle" font-size="9.6" fill="#b85450" filter="url(#rough2)">中心对称</text>
  <rect x="420.0" y="80.0" width="320.0" height="170.0" rx="9" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="436.0" y="106.0" text-anchor="start" font-size="11.8" font-weight="bold" fill="#2f5b34" filter="url(#rough2)">结论</text>
  <text x="436.0" y="132.0" text-anchor="start" font-size="11.0" fill="#2b2b2b" filter="url(#rough2)">a ≥ 2r 且 b ≥ 2r ⇒ 先手赢</text>
  <text x="436.0" y="156.0" text-anchor="start" font-size="11.0" fill="#2b2b2b" filter="url(#rough2)">否则一块都放不下 ⇒ 后手赢</text>
  <text x="436.0" y="184.0" text-anchor="start" font-size="10.6" fill="#6b6b6b" filter="url(#rough2)">样例 1：5×5, r=2 ⇒ 先手</text>
  <text x="436.0" y="206.0" text-anchor="start" font-size="10.6" fill="#6b6b6b" filter="url(#rough2)">样例 2：6×7, r=4 ⇒ 6&lt;8 ⇒ 后手</text>
  <text x="436.0" y="232.0" text-anchor="start" font-size="10.4" fill="#6b6b6b" filter="url(#rough2)">对称策略：对手放哪，就放在关于中心对称的位置。</text>
</svg>
