<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="420" fill="#fafafa"/>

  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">同一时刻到达的人数就是收银台下界</text>
  <path d="M 150 46 Q 360 52 566 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="668" y="60" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">示意图，横向不按真实时间比例</text>

  <!-- 坐标轴 -->
  <line x1="110" y1="90" x2="110" y2="350" stroke="#2b2b2b" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="110" y1="350" x2="660" y2="350" stroke="#2b2b2b" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="96" y="356" text-anchor="end" font-size="12" fill="#2b2b2b" filter="url(#rough2)">0</text>
  <text x="96" y="296" text-anchor="end" font-size="12" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="96" y="236" text-anchor="end" font-size="12" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="96" y="176" text-anchor="end" font-size="12" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <line x1="104" y1="290" x2="116" y2="290" stroke="#2b2b2b" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="104" y1="230" x2="116" y2="230" stroke="#2b2b2b" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="104" y1="170" x2="116" y2="170" stroke="#2b2b2b" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="62" y="220" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">人数</text>
  <text x="650" y="368" text-anchor="end" font-size="12" fill="#555" filter="url(#rough2)">到达时刻</text>

  <!-- 柱子：8:00 -->
  <rect x="150" y="290" width="70" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="185" y="282" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">1</text>
  <text x="185" y="372" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">8:00</text>

  <!-- 柱子：8:10 -->
  <rect x="290" y="230" width="70" height="120" fill="#fde8e8" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="325" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#8c2f2b" filter="url(#rough2)">2</text>
  <text x="325" y="372" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">8:10</text>

  <!-- 柱子：8:45 -->
  <rect x="430" y="290" width="70" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="465" y="282" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">1</text>
  <text x="465" y="372" text-anchor="middle" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">8:45</text>

  <!-- 上界虚线 -->
  <line x1="110" y1="230" x2="660" y2="230" stroke="#b85450" stroke-width="1.5" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="656" y="216" text-anchor="end" font-size="12.5" font-weight="bold" fill="#8c2f2b" filter="url(#rough2)">最高柱 = 2 → 只需 2 个收银台</text>

  <!-- 8:10 处的说明 -->
  <path d="M 325 210 C 325 190 420 186 470 196" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="478" y="192" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">两人同一分钟进门，谁都不能等</text>
  <text x="478" y="210" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">→ 此刻必须有两个空闲收银台</text>

  <rect x="120" y="386" width="520" height="26" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="132" y="404" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">不同分钟之间互不影响：服务只需不足一分钟，下一位进门时收银台已空</text>
</svg>
