<svg xmlns="http://www.w3.org/2000/svg" width="720" height="490" viewBox="0 0 720 490"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arrD" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 0 L 5 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="720" height="490" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">算法流程：一次筛 + 每个数分解 + 按素因子累加指数</text>

  <rect x="70" y="52" width="580" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="360" y="80" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">读入 t 组数据（每组 n、x 与 a₁…aₙ，题目保证 x = 1）</text>

  <path d="M 360 98 L 360 122" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="70" y="124" width="580" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="360" y="152" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">全局预处理一次：埃氏筛出最小素因子 spf[i]（i ≤ 5×10⁵）</text>

  <path d="M 360 170 L 360 194" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="70" y="196" width="580" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="360" y="224" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">对每个 aᵢ 反复用 spf 除，得到分解 aᵢ = ∏ p^e（约 O(log aᵢ) 步）</text>

  <path d="M 360 242 L 360 266" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="70" y="268" width="580" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="360" y="296" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">cnt[p] += e；p 第一次出现时把 p 记进 touched 列表，便于事后清零</text>

  <path d="M 360 314 L 360 338" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="70" y="340" width="580" height="58" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="360" y="362" text-anchor="middle" font-size="13" fill="#a14340" filter="url(#rough2)">ans = ∏ over p in touched (cnt[p] + 1)  (mod 10⁹+7)</text>
  <text x="360" y="386" text-anchor="middle" font-size="12" fill="#a14340" filter="url(#rough2)">随后把 touched 里的 cnt 全部置 0，继续下一组（O(不同素因子数)）</text>

  <text x="82" y="424" text-anchor="start" font-size="11.5" fill="#555" filter="url(#rough2)">• aᵢ = 1 分解为空，跳过即可（它的 pᵢ 只能取 1，不带来任何选择）</text>
  <text x="82" y="446" text-anchor="start" font-size="11.5" fill="#555" filter="url(#rough2)">• 没出现过的素因子系数恒为 1，不进乘积；故只乘 touched 中的项</text>
  <text x="82" y="468" text-anchor="start" font-size="11.5" fill="#555" filter="url(#rough2)">• 累加指数、而不是“出现了几次”：v_p 之和才是 p 的选法数</text>
</svg>
