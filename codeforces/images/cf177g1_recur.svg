<svg xmlns="http://www.w3.org/2000/svg" width="750" height="340" viewBox="0 0 750 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="191"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="750" height="340" fill="#fafafa"/>
  <text x="375.0" y="34.0" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">出现次数按位置三分：ans_k = ans_{k−1} + ans_{k−2} + cross_k</text>
  <path d="M 84.6600000000002 46 Q 375.0 52 665.3399999999998 46" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <rect x="46.0" y="66.0" width="180.0" height="48.0" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="136.0" y="94.7" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">ans_{k−1}</text>
  <rect x="46.0" y="140.0" width="180.0" height="48.0" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="136.0" y="168.7" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">ans_{k−2}</text>
  <rect x="46.0" y="214.0" width="180.0" height="48.0" rx="9" fill="#fff3d6" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="136.0" y="242.7" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">cross_k</text>
  <circle cx="300.0" cy="164.0" r="24.0" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300.0" y="172.0" text-anchor="middle" font-size="20" font-weight="bold" fill="#2f5b34" filter="url(#rough2)">＋</text>
  <path d="M 228.0 90.0 L 274.0 164.0" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 228.0 164.0 L 274.0 164.0" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 228.0 238.0 L 274.0 164.0" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="400.0" y="134.0" width="200.0" height="60.0" rx="10" fill="#eef8ef" stroke="#5b8c5a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="500.0" y="169.4" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5b34" filter="url(#rough2)">ans_k</text>
  <path d="M 326.0 164.0 L 396.0 164.0" stroke="#5b8c5a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="46.0" y="282.0" width="660.0" height="46.0" rx="8" fill="#fdf0ef" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60.0" y="310.0" text-anchor="start" font-size="11.4" fill="#8a3a36" filter="url(#rough2)">三种位置互斥且穷尽，所以递推不重不漏；难点只剩「cross_k 怎么快速算」。</text>
</svg>
