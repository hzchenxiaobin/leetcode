<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.023" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="660" height="400" fill="#fafafa"/>

  <text x="330" y="27" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">轨道 {v, v⊕x}：要么整对不动，要么整对交换</text>
  <text x="330" y="47" text-anchor="middle" font-size="11" fill="#888888"
        filter="url(#rough2)">n = 8, x = 5 举例：4 个轨道，需要 n/4 = 2 个「交换轨道」</text>

  <text x="52" y="74" font-size="10.5" fill="#888888" filter="url(#rough2)">v 与 v⊕x 配对</text>

  <rect x="40" y="82" width="212" height="40" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="56" y="108" font-size="13" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">{0, 5}</text>
  <text x="236" y="108" text-anchor="end" font-size="11" fill="#8a3a36" filter="url(#rough2)">交换 → 奇数下标</text>

  <rect x="40" y="130" width="212" height="40" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="56" y="156" font-size="13" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">{1, 4}</text>
  <text x="236" y="156" text-anchor="end" font-size="11" fill="#8a3a36" filter="url(#rough2)">交换 → 奇数下标</text>

  <rect x="40" y="178" width="212" height="40" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="204" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">{2, 7}</text>
  <text x="236" y="204" text-anchor="end" font-size="11" fill="#446688" filter="url(#rough2)">不动 → 偶数下标</text>

  <rect x="40" y="226" width="212" height="40" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="252" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">{3, 6}</text>
  <text x="236" y="252" text-anchor="end" font-size="11" fill="#446688" filter="url(#rough2)">不动 → 偶数下标</text>

  <path d="M 262 178 L 296 178" stroke="#3a3a3a" stroke-width="1.6" fill="none"
        marker-end="url(#ar2)" filter="url(#rough2)"/>
  <text x="279" y="168" text-anchor="middle" font-size="9.5" fill="#555555" filter="url(#rough2)">填入 P</text>

  <rect x="310" y="96" width="48" height="36" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="334" y="87" text-anchor="middle" font-size="9" fill="#888888" filter="url(#rough2)">i=0</text>
  <text x="334" y="120" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="362" y="96" width="48" height="36" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="386" y="87" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">i=1</text>
  <text x="386" y="120" text-anchor="middle" font-size="14" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="414" y="96" width="48" height="36" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="438" y="87" text-anchor="middle" font-size="9" fill="#888888" filter="url(#rough2)">i=2</text>
  <text x="438" y="120" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="466" y="96" width="48" height="36" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="490" y="87" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">i=3</text>
  <text x="490" y="120" text-anchor="middle" font-size="14" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">5</text>

  <rect x="310" y="160" width="48" height="36" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="334" y="151" text-anchor="middle" font-size="9" fill="#888888" filter="url(#rough2)">i=4</text>
  <text x="334" y="184" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="362" y="160" width="48" height="36" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="386" y="151" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">i=5</text>
  <text x="386" y="184" text-anchor="middle" font-size="14" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="414" y="160" width="48" height="36" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="438" y="151" text-anchor="middle" font-size="9" fill="#888888" filter="url(#rough2)">i=6</text>
  <text x="438" y="184" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="466" y="160" width="48" height="36" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="490" y="151" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">i=7</text>
  <text x="490" y="184" text-anchor="middle" font-size="14" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">4</text>

  <text x="560" y="120" font-size="9.5" fill="#555555" filter="url(#rough2)">P 的每个值</text>
  <text x="560" y="136" font-size="9.5" fill="#555555" filter="url(#rough2)">恰好用一次</text>
  <text x="560" y="184" font-size="9.5" fill="#555555" filter="url(#rough2)">⇒ P 是置换</text>

  <rect x="40" y="284" width="580" height="92" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="304" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">计数：奇下标共 n/2 个，每个交换轨道恰好贡献 2 个值 ⇒ 需要 n/4 个交换轨道，故 4 | n；</text>
  <text x="56" y="322" font-size="10.5" fill="#3a5a30" filter="url(#rough2)">交换轨道里 v 与 v⊕x 分别落在奇下标行上，于是 P′_i = P_i⊕x（i 奇）也恰好遍历同一批值。</text>
  <text x="56" y="342" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">x = 0 时无需交换（取 P 为恒等即可），任何 n = 2^m 都成立；</text>
  <text x="56" y="360" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">x ≠ 0 且 n = 2 时 n/4 不是整数 ⇒ 无解；n ≥ 4 时总有 4 | n。</text>
</svg>
