  <text x="820" y="217" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="90" y="230" width="120" height="24" rx="3" fill="#ffffff" fill-opacity="0.25" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="150" y="247" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <g filter="url(#rough2)"><rect x="300" y="230" width="250" height="24" rx="3" fill="#ffffff" fill-opacity="0.25" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="425" y="247" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">bab (5)</text>
  <text x="680" y="247" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="820" y="247" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="90" y="260" width="120" height="24" rx="3" fill="#ffffff" fill-opacity="0.25" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="150" y="277" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <g filter="url(#rough2)"><rect x="300" y="260" width="250" height="24" rx="3" fill="#ffffff" fill-opacity="0.25" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="425" y="277" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">babab (3)</text>
  <text x="680" y="277" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <text x="820" y="277" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="90" y="290" width="120" height="24" rx="3" fill="#ffffff" fill-opacity="0.25" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="150" y="307" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">6</text>
  <g filter="url(#rough2)"><rect x="300" y="290" width="250" height="24" rx="3" fill="#ffffff" fill-opacity="0.25" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="425" y="307" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">bababab (1)</text>
  <text x="680" y="307" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">5</text>
  <text x="820" y="307" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">1</text>
  <text x="450" y="336" text-anchor="middle" font-size="11.5" fill="#b06a1e" filter="url(#rough2)">cls[sa[k]] = cls[sa[k−1]] + [ lcp[k] &lt; L ]：两个起点同类 ⇔ 前 L 个字符相同</text>
</svg>
