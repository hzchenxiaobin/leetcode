  <text x="820" y="187" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)"><line x1="80" y1="196" x2="860" y2="196" stroke="#8a2b28" stroke-width="1.2" stroke-dasharray="4 3"/></g>
  <text x="868" y="192" text-anchor="start" font-size="10" fill="#8a2b28" filter="url(#rough2)">切</text>
  <g filter="url(#rough2)"><rect x="90" y="200" width="120" height="24" rx="3" fill="#ffffff" fill-opacity="0.25" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="150" y="217" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <g filter="url(#rough2)"><rect x="300" y="200" width="250" height="24" rx="3" fill="#ffffff" fill-opacity="0.25" stroke="#cccccc" stroke-width="1.4"/></g>
