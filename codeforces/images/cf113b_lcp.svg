<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="350" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">后缀数组按 LCP 分段：lcp[k] &lt; L 处切一刀</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">同一段内所有后缀的前 L 个字符相同 ⇒ 一个长度 L 的内容等价类</text>
  <text x="150" y="96" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">排名 k</text>
  <text x="430" y="96" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">后缀（起点）</text>
  <text x="680" y="96" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">lcp[k]</text>
  <text x="820" y="96" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">cls</text>
  <g filter="url(#rough2)"><rect x="90" y="110" width="120" height="24" rx="3" fill="#ffffff" fill-opacity="0.25" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="150" y="127" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">0</text>
