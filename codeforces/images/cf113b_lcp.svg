  <g filter="url(#rough2)"><rect x="300" y="170" width="250" height="24" rx="3" fill="#ffffff" fill-opacity="0.25" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="425" y="187" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">ab (6)</text>
