  <text x="425" y="127" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">abababab (0)</text>
  <text x="680" y="127" text-anchor="middle" font-size="11.5" fill="#666666" filter="url(#rough2)">—</text>
  <text x="820" y="127" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">0</text>
  <g filter="url(#rough2)"><rect x="90" y="140" width="120" height="24" rx="3" fill="#ffffff" fill-opacity="0.25" stroke="#cccccc" stroke-width="1.4"/></g>
  <text x="150" y="157" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <g filter="url(#rough2)"><rect x="300" y="140" width="250" height="24" rx="3" fill="#ffffff" fill-opacity="0.25" stroke="#cccccc" stroke-width="1.4"/></g>
