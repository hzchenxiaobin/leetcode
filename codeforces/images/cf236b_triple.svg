<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="61"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="420" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">三重循环：每个三元组查一次 d[i·j·k]</text>
  <path d="M 140 42 Q 360 48 580 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 循环嵌套 -->
  <rect x="40" y="80" width="150" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115" y="102" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">i = 1 .. a</text>
  <text x="115" y="120" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">外层</text>
  <rect x="40" y="144" width="150" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115" y="166" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">j = 1 .. b</text>
  <text x="115" y="184" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">中层</text>
  <rect x="40" y="208" width="150" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115" y="230" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">k = 1 .. c</text>
  <text x="115" y="248" text-anchor="middle" font-size="10.5" fill="#2f4a66" filter="url(#rough2)">内层</text>
  <line x1="115" y1="134" x2="115" y2="142" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="115" y1="198" x2="115" y2="206" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <line x1="192" y1="234" x2="238" y2="234" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="242" y="208" width="150" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="317" y="230" text-anchor="middle" font-size="12" fill="#7a5a1b" filter="url(#rough2)">m = i·j·k</text>
  <text x="317" y="248" text-anchor="middle" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">查表 d[m]</text>

  <line x1="394" y1="234" x2="440" y2="234" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="444" y="208" width="180" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="534" y="230" text-anchor="middle" font-size="12" fill="#2f5223" filter="url(#rough2)">ans += d[m]</text>
  <text x="534" y="248" text-anchor="middle" font-size="10.5" fill="#2f5223" filter="url(#rough2)">最后对 2^30 取模</text>

  <!-- 样例表 -->
  <text x="60" y="298" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 a = b = c = 2 的 8 个三元组</text>
  <text x="60" y="322" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">(i,j,k)：(1,1,1) (1,1,2) (1,2,1) (1,2,2) (2,1,1) (2,1,2) (2,2,1) (2,2,2)</text>
  <text x="60" y="346" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">i·j·k  ：  1       2       2       4       2       4       4       8</text>
  <text x="60" y="370" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">d[m]   ：  1       2       2       3       2       3       3       4</text>
  <text x="60" y="398" font-size="12" font-weight="bold" fill="#8a6015" filter="url(#rough2)">总和 = 1+2+2+3+2+3+3+4 = 20（与官方样例一致）</text>
</svg>
