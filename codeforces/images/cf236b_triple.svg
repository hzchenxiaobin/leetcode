<svg xmlns="http://www.w3.org/2000/svg" width="840" height="280" viewBox="0 0 840 280"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="280" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">三重枚举与模数</text>
  <text x="420" y="100" text-anchor="middle" font-size="14" fill="#2b2b2b" filter="url(#rough2)">Σ_{i=1..a} Σ_{j=1..b} Σ_{k=1..c} d(i·j·k)  mod 2³⁰</text>
  <text x="420" y="150" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">a,b,c ≤ 100 ⇒ 至多 10⁶ 项</text>
  <g filter="url(#rough2)"><rect x="250" y="180" width="340" height="40" rx="4" fill="#f7fbf4" fill-opacity="0.85" stroke="#a8c99a" stroke-width="1.3"/></g>
  <text x="420" y="206" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3d6b2f" filter="url(#rough2)">样例：2 2 2 → 20；5 6 7 → 1520</text>
  <text x="420" y="250" text-anchor="middle" font-size="11" fill="#8a4b2a" filter="url(#rough2)">注意模数是 2³⁰ 不是 1e9+7</text>
</svg>
