<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <filter id="rough3" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="2.2"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="430" fill="#fafafa"/>
  <text x="380" y="34" text-anchor="middle" font-size="19" fill="#333" filter="url(#rough2)">擂主（champion）与「方块」分解</text>
  <text x="380" y="60" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">例：n = 6，a = [2, 2, 5, 5, 1]，取某个排列 p（p_q 表示第 q 弱的玩家）</text>

  <text x="86" y="104" text-anchor="end" font-size="13" fill="#446688" filter="url(#rough2)">回合 i</text>
  <text x="86" y="156" text-anchor="end" font-size="13" fill="#446688" filter="url(#rough2)">a_i</text>
  <text x="86" y="240" text-anchor="end" font-size="13" fill="#446688" filter="url(#rough2)">擂主</text>
  <text x="86" y="298" text-anchor="end" font-size="13" fill="#b85450" filter="url(#rough2)">被淘汰</text>

  <!-- 回合标号 -->
  <g font-size="13" fill="#555" text-anchor="middle" filter="url(#rough2)">
    <text x="131" y="104">1</text><text x="211" y="104">2</text><text x="291" y="104">3</text>
    <text x="371" y="104">4</text><text x="451" y="104">5</text>
  </g>

  <!-- a_i 格子 -->
  <g stroke="#446688" stroke-width="1.6" filter="url(#rough2)">
    <rect x="95" y="122" width="72" height="40" rx="6" fill="#e8f0fe"/>
    <rect x="175" y="122" width="72" height="40" rx="6" fill="#e8f0fe"/>
    <rect x="255" y="122" width="72" height="40" rx="6" fill="#e8f0fe"/>
    <rect x="335" y="122" width="72" height="40" rx="6" fill="#e8f0fe"/>
    <rect x="415" y="122" width="72" height="40" rx="6" fill="#e8f0fe"/>
  </g>
  <g font-size="17" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="131" y="149">2</text><text x="211" y="149">2</text><text x="291" y="149">5</text>
    <text x="371" y="149">5</text><text x="451" y="149">1</text>
  </g>

  <!-- 擂主 -->
  <g stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)">
    <rect x="95" y="208" width="72" height="40" rx="6" fill="#e6f4ea"/>
    <rect x="175" y="208" width="72" height="40" rx="6" fill="#e6f4ea"/>
    <rect x="255" y="208" width="72" height="40" rx="6" fill="#e6f4ea"/>
    <rect x="335" y="208" width="72" height="40" rx="6" fill="#e6f4ea"/>
    <rect x="415" y="208" width="72" height="40" rx="6" fill="#e6f4ea"/>
  </g>
  <g font-size="17" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="131" y="235">p₁</text><text x="211" y="235">p₁</text><text x="291" y="235">p₁</text>
    <text x="371" y="235">p₄</text><text x="451" y="235">p₄</text>
  </g>

  <!-- 被淘汰 -->
  <g stroke="#b85450" stroke-width="1.6" filter="url(#rough2)">
    <rect x="95" y="266" width="72" height="40" rx="6" fill="#fce4ec"/>
    <rect x="175" y="266" width="72" height="40" rx="6" fill="#fce4ec"/>
    <rect x="255" y="266" width="72" height="40" rx="6" fill="#fce4ec"/>
    <rect x="335" y="266" width="72" height="40" rx="6" fill="#fce4ec"/>
    <rect x="415" y="266" width="72" height="40" rx="6" fill="#fce4ec"/>
  </g>
  <g font-size="17" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="131" y="293">p₂</text><text x="211" y="293">p₃</text><text x="291" y="293">p₁</text>
    <text x="371" y="293">p₅</text><text x="451" y="293">p₄</text>
  </g>

  <!-- 方块括号 -->
  <path d="M95,330 L95,318 L327,318 L327,330" fill="none" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough3)"/>
  <path d="M335,330 L335,318 L487,318 L487,330" fill="none" stroke="#446688" stroke-width="2.2" filter="url(#rough3)"/>
  <text x="211" y="348" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">方块 ①  [1, 3]</text>
  <text x="411" y="348" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">方块 ②  [4, 5]</text>

  <text x="510" y="150" font-size="13" fill="#d6a040" filter="url(#rough2)">p₆ 存活</text>
  <path d="M540,166 L500,290" fill="none" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="380" y="378" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">每一轮只有两个候选：擂主 p_s 与新人 p_{i+1}。</text>
  <text x="380" y="400" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a_i = p_s ⇒ 淘汰新人（擂主连胜）；a_i ≠ p_s ⇒ 淘汰擂主，新人接任。</text>
  <text x="380" y="422" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">方块 [s,e]：第 s..e-1 轮全匹配，第 e 轮不匹配杀死 p_s。</text>
</svg>
