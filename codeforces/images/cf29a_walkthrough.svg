<svg xmlns="http://www.w3.org/2000/svg" width="720" height="410" viewBox="0 0 720 410"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="720" height="410" fill="#fafafa"/>

  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">三个样例的位置与落点</text>
  <path d="M 230 42 Q 360 48 490 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 样例 1 -->
  <text x="40" y="82" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">样例 1：0(+1)、1(−1)</text>
  <line x1="120" y1="120" x2="420" y2="120" stroke="#2b2b2b" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="180" cy="120" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="330" cy="120" r="8" fill="#fde8e8" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 190 120 L 318 120" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 318 132 L 190 132" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="255" y="110" text-anchor="middle" font-size="10.5" fill="#2f5223" filter="url(#rough2)">0 + 1 = 1</text>
  <text x="255" y="150" text-anchor="middle" font-size="10.5" fill="#a33a36" filter="url(#rough2)">1 + (−1) = 0</text>
  <text x="450" y="124" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">YES</text>

  <!-- 样例 2 -->
  <text x="40" y="196" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">样例 2：0(+1)、1(+1)、2(−2)</text>
  <line x1="120" y1="234" x2="420" y2="234" stroke="#2b2b2b" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="160" cy="234" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="250" cy="234" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="340" cy="234" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="160" y="258" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">0→1</text>
  <text x="250" y="258" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">1→2</text>
  <text x="340" y="258" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">2→0</text>
  <text x="450" y="238" font-size="12" font-weight="bold" fill="#a33a36" filter="url(#rough2)">NO（没有互相指向）</text>

  <!-- 样例 3 -->
  <text x="40" y="310" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">样例 3：2(−10)、3(+10)、0(+5)、5(−5)、10(+1)</text>
  <line x1="120" y1="348" x2="620" y2="348" stroke="#2b2b2b" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="180" cy="348" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="250" cy="348" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="320" cy="348" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="460" cy="348" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="600" cy="348" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 190 340 L 310 340" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 330 356 L 190 356" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="250" y="332" text-anchor="middle" font-size="10.5" fill="#2f5223" filter="url(#rough2)">0 与 5 互相命中</text>
  <text x="420" y="374" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">YES</text>
</svg>
