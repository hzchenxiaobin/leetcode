<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="720" height="280" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 1：pasha(1) 的 1-子、2-子、3-子</text>
  <rect x="60" y="54" width="240" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="180" y="81" text-anchor="middle" font-size="11" fill="#2f5223">1-子：2(gerald)、3(gerald)、6(olesya)</text>
  <text x="180" y="95" text-anchor="middle" font-size="11" fill="#2f5223">名字数 2</text>
  <rect x="60" y="130" width="240" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="180" y="157" text-anchor="middle" font-size="11" fill="#2f4a66">2-子：4(valera)、5(igor)</text>
  <text x="180" y="171" text-anchor="middle" font-size="11" fill="#2f4a66">名字数 2</text>
  <rect x="360" y="54" width="300" height="60" rx="8" fill="#fde9d9" stroke="#b4652a" stroke-width="1.5"/>
  <text x="510" y="88" text-anchor="middle" font-size="11" fill="#7a4b22">3-子：无 → 0</text>
  <rect x="360" y="130" width="300" height="60" rx="8" fill="#f3edf8" stroke="#7a4a9a" stroke-width="1.5"/>
  <text x="510" y="164" text-anchor="middle" font-size="11" fill="#4a2a62">3 的 1-子：5(igor) → 1</text>
  <text x="60" y="236" text-anchor="start" font-size="11.5" fill="#7a4b22" filter="url(#rough2)">6 的 1-子：无 → 0；与官方输出 2 2 0 1 0 一致</text>
</svg>
