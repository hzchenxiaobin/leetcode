<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="23"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="800" height="420" fill="#fafafa"/>

  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">官方样例逐条演算</text>
  <path d="M 288 42 Q 400 49 512 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="400" y="62" text-anchor="middle" font-size="12.5" fill="#66788c" filter="url(#rough2)">s = 00111100000，7 个询问；答案 = 4p − m</text>

  <rect x="34" y="78" width="732" height="240" rx="12" fill="#ffffff" stroke="#c9d4e0" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- 表头 -->
  <text x="86" y="104" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">询问 (l, r)</text>
  <text x="196" y="104" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">子串</text>
  <text x="292" y="104" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">m</text>
  <text x="340" y="104" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">z</text>
  <text x="388" y="104" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">o</text>
  <text x="436" y="104" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">k</text>
  <text x="484" y="104" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">p</text>
  <text x="552" y="104" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a14340" filter="url(#rough2)">答案</text>
  <text x="668" y="104" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">取到最大的那个下界</text>
  <path d="M 52 112 L 748 112" stroke="#c9d4e0" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 行 1 -->
  <text x="86" y="136" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1 8</text>
  <text x="196" y="136" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">00111100</text>
  <text x="292" y="136" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">8</text>
  <text x="340" y="136" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="388" y="136" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="436" y="136" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="484" y="136" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">3</text>
  <text x="552" y="136" text-anchor="middle" font-size="13" font-weight="bold" fill="#a14340" filter="url(#rough2)">4</text>
  <text x="668" y="136" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">⌈(8−1)/3⌉ = 3</text>

  <!-- 行 2 -->
  <text x="86" y="164" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1 1</text>
  <text x="196" y="164" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">0</text>
  <text x="292" y="164" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="340" y="164" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="388" y="164" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="436" y="164" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="484" y="164" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">1</text>
  <text x="552" y="164" text-anchor="middle" font-size="13" font-weight="bold" fill="#a14340" filter="url(#rough2)">3</text>
  <text x="668" y="164" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">单段：p = max(1, ⌈1/2⌉)</text>

  <!-- 行 3 -->
  <text x="86" y="192" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1 2</text>
  <text x="196" y="192" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">00</text>
  <text x="292" y="192" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="340" y="192" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="388" y="192" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="436" y="192" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="484" y="192" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">1</text>
  <text x="552" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#a14340" filter="url(#rough2)">2</text>
  <text x="668" y="192" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">单段：p = max(1, ⌈2/2⌉)</text>

  <!-- 行 4 -->
  <text x="86" y="220" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1 4</text>
  <text x="196" y="220" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">0011</text>
  <text x="292" y="220" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="340" y="220" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="388" y="220" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="436" y="220" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="484" y="220" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">1</text>
  <text x="552" y="220" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">0</text>
  <text x="668" y="220" text-anchor="middle" font-size="11.5" fill="#5d7a4d" filter="url(#rough2)">本来就平衡</text>

  <!-- 行 5 -->
  <text x="86" y="248" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">3 6</text>
  <text x="196" y="248" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">1111</text>
  <text x="292" y="248" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="340" y="248" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="388" y="248" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="436" y="248" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="484" y="248" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">2</text>
  <text x="552" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#a14340" filter="url(#rough2)">4</text>
  <text x="668" y="248" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">单段：p = max(1, ⌈4/2⌉)</text>

  <!-- 行 6 -->
  <text x="86" y="276" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2 7</text>
  <text x="196" y="276" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">011110</text>
  <text x="292" y="276" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">6</text>
  <text x="340" y="276" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="388" y="276" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="436" y="276" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="484" y="276" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">2</text>
  <text x="552" y="276" text-anchor="middle" font-size="13" font-weight="bold" fill="#a14340" filter="url(#rough2)">2</text>
  <text x="668" y="276" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">⌈o/2⌉ = 2</text>

  <!-- 行 7 -->
  <text x="86" y="304" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">7 11</text>
  <text x="196" y="304" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">00000</text>
  <text x="292" y="304" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="340" y="304" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">5</text>
  <text x="388" y="304" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="436" y="304" text-anchor="middle" font-size="12.5" fill="#999" filter="url(#rough2)">—</text>
  <text x="484" y="304" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">3</text>
  <text x="552" y="304" text-anchor="middle" font-size="13" font-weight="bold" fill="#a14340" filter="url(#rough2)">7</text>
  <text x="668" y="304" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">单段：p = max(1, ⌈5/2⌉)</text>

  <rect x="34" y="330" width="732" height="34" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="400" y="352" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">注意 2 7 这组：0 在环上首尾相接，所以 k = 1 而不是 2，p 由 ⌈o/2⌉ = 2 顶住</text>

  <text x="400" y="392" text-anchor="middle" font-size="11.5" fill="#8a8a8a" filter="url(#rough2)">四行「单段」说明整段只有一种字符，此时走单独公式，k 记作 —</text>
</svg>
