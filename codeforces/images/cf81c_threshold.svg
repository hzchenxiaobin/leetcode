<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="131"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>

  <rect width="720" height="350" fill="#fafafa"/>
  <text x="360.0" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">a &lt; b 时：取最大的 a 个，阈值 v 切开</text>
  <path d="M 115.2 42 Q 360.0 48 604.8 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="360.0" y="336" text-anchor="middle" font-size="12.5" fill="#555555" filter="url(#rough2)">样例 3：a = 1，成绩 4 4 4 5 4 4，v = 5</text>
  <rect x="90" y="80" width="62" height="170" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="121" y="70" text-anchor="middle" font-size="14" fill="#333333" filter="url(#rough2)">5</text>
  <rect x="182" y="114" width="62" height="136" rx="6" fill="#f4f4f1" stroke="#bdbdb5" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="213" y="104" text-anchor="middle" font-size="14" fill="#333333" filter="url(#rough2)">4</text>
  <rect x="274" y="114" width="62" height="136" rx="6" fill="#f4f4f1" stroke="#bdbdb5" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="305" y="104" text-anchor="middle" font-size="14" fill="#333333" filter="url(#rough2)">4</text>
  <rect x="366" y="114" width="62" height="136" rx="6" fill="#f4f4f1" stroke="#bdbdb5" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="397" y="104" text-anchor="middle" font-size="14" fill="#333333" filter="url(#rough2)">4</text>
  <rect x="458" y="114" width="62" height="136" rx="6" fill="#f4f4f1" stroke="#bdbdb5" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="489" y="104" text-anchor="middle" font-size="14" fill="#333333" filter="url(#rough2)">4</text>
  <rect x="550" y="114" width="62" height="136" rx="6" fill="#f4f4f1" stroke="#bdbdb5" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="581" y="104" text-anchor="middle" font-size="14" fill="#333333" filter="url(#rough2)">4</text>
  <text x="121" y="276" text-anchor="middle" font-size="11" fill="#8a6015" filter="url(#rough2)">位置 1（= v，被选中）</text>
  <text x="360" y="96" text-anchor="middle" font-size="12.5" fill="#2f5223" filter="url(#rough2)">严格大于 v：全选</text>
  <text x="360" y="122" text-anchor="middle" font-size="12.5" fill="#8a6015" filter="url(#rough2)">等于 v：还要挑 k = a − (#大于v) 个</text>
  <text x="360" y="148" text-anchor="middle" font-size="12.5" fill="#77776e" filter="url(#rough2)">严格小于 v：一个都不选</text>
  <rect x="52" y="290" width="616" height="34" rx="8" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="360" y="312" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">k 个从“等于 v”里挑：挑下标最小的 k 个 ⇒ 标号序列字典序最小</text>
  <path d="M 60 250 L 650 250" stroke="#333333" stroke-width="1.8" filter="url(#rough2)"/>
</svg>
