<svg xmlns="http://www.w3.org/2000/svg" width="700" height="430" viewBox="0 0 700 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="700" height="430" fill="#fafafa"/>

  <text x="350" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">核心观察：位置 1 的乘积就是 p₁ 本身</text>
  <path d="M 130 44 Q 350 50 570 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 左卡片：i=1 的硬约束 -->
  <rect x="22" y="70" width="286" height="168" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="165" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">i = 1：无处可躲</text>
  <text x="165" y="128" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#rough2)">1 × p₁ = p₁</text>
  <text x="165" y="154" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">乘积不借任何外来因子，</text>
  <text x="165" y="176" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">要求 p₁ 自己就是合数</text>
  <text x="165" y="206" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">最小的合数是 4</text>
  <path d="M 165 214 L 165 254" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 右卡片：n <= 3 穷举 -->
  <rect x="392" y="70" width="286" height="168" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="535" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#37516e" filter="url(#rough2)">n ≤ 3 时 p₁ 的所有候选</text>

  <rect x="408" y="110" width="254" height="34" rx="5" fill="#fafafa" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="420" y="132" font-size="12" fill="#333" filter="url(#rough2)">n = 1</text>
  <text x="474" y="132" font-size="12" fill="#333" filter="url(#rough2)">p₁ = 1</text>
  <text x="568" y="132" font-size="12" fill="#b85450" filter="url(#rough2)">1 非合数 ✗</text>

  <rect x="408" y="150" width="254" height="34" rx="5" fill="#fafafa" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="420" y="172" font-size="12" fill="#333" filter="url(#rough2)">n = 2</text>
  <text x="474" y="172" font-size="12" fill="#333" filter="url(#rough2)">p₁ ∈ {1, 2}</text>
  <text x="568" y="172" font-size="12" fill="#b85450" filter="url(#rough2)">全非合数 ✗</text>

  <rect x="408" y="190" width="254" height="34" rx="5" fill="#fafafa" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="420" y="212" font-size="12" fill="#333" filter="url(#rough2)">n = 3</text>
  <text x="474" y="212" font-size="12" fill="#333" filter="url(#rough2)">p₁ ∈ {1, 2, 3}</text>
  <text x="568" y="212" font-size="12" fill="#b85450" filter="url(#rough2)">全非合数 ✗</text>

  <!-- 中间箭头 -->
  <path d="M 314 154 L 386 154" stroke="#b85450" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 结论带 -->
  <rect x="22" y="262" width="656" height="56" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="286" text-anchor="middle" font-size="14" font-weight="bold" fill="#a33b36" filter="url(#rough2)">结论 1：n ≥ 4 是必要条件</text>
  <text x="350" y="307" text-anchor="middle" font-size="12.5" fill="#7a2f2b" filter="url(#rough2)">因此 n = 1, 2, 3 一律输出 -1，无需再枚举排列</text>

  <!-- 下半区：剩下的位置为什么好办 -->
  <rect x="22" y="336" width="656" height="74" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="350" y="360" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">结论 2：恒等排列 i ↦ i 在 i ≥ 2 时天然合法</text>
  <text x="350" y="382" text-anchor="middle" font-size="12.5" fill="#3c5e2e" filter="url(#rough2)">因为 i × p_i = i²，而 i 是 i² 的非平凡因子（i ≥ 2 ⇒ 1 &lt; i &lt; i²）</text>
  <text x="350" y="402" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">于是只剩 i = 1 一个坏点，只需局部修补</text>
</svg>
