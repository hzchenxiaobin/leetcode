<svg xmlns="http://www.w3.org/2000/svg" width="720" height="392" viewBox="0 0 720 392"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="720" height="392" fill="#fafafa"/>
  <text x="360.0" y="33" font-size="20" font-weight="bold" fill="#2b2b2b" text-anchor="middle" filter="url(#rough2)">判定单调：二分最小可行半径</text>
  <path d="M 288 44 Q 360.0 50 432 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="360" y="76" font-size="12" font-weight="normal" fill="#555" text-anchor="middle" filter="url(#rough2)">f(d) = 用 3 个长度 2d 的区间能否盖住全部点；f 关于 d 单调不减</text>
  <path d="M 60 250 L 666 250" stroke="#555" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <path d="M 660 250 L 686 250" stroke="#555" stroke-width="1.4" fill="none"/>
    <polygon points="686,250 677,245 677,255" fill="#555"/>
  </g>
  <text x="660" y="226" font-size="11" font-weight="normal" fill="#555" text-anchor="end" filter="url(#rough2)">d 增大 →</text>
  <text x="60" y="276" font-size="11" font-weight="normal" fill="#555" text-anchor="middle" filter="url(#rough2)">0</text>
  <text x="660" y="286" font-size="11" font-weight="normal" fill="#555" text-anchor="middle" filter="url(#rough2)">(max-min)/2</text>
  <rect x="60" y="234" width="270" height="32" rx="0" fill="#fde8e8" stroke="#b85450" stroke-width="1.0" filter="url(#rough2)"/>
  <rect x="330" y="234" width="330" height="32" rx="0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.0" filter="url(#rough2)"/>
  <text x="195.0" y="255" font-size="11.5" font-weight="normal" fill="#7a3b36" text-anchor="middle" filter="url(#rough2)">不可行 f(d)=false</text>
  <text x="495.0" y="255" font-size="11.5" font-weight="normal" fill="#2f5223" text-anchor="middle" filter="url(#rough2)">可行 f(d)=true</text>
  <path d="M 330 210 L 330 284" stroke="#2f5223" stroke-width="1.8" fill="none" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="330" y="302" font-size="12" font-weight="bold" fill="#2f5223" text-anchor="middle" filter="url(#rough2)">d* = 最优答案</text>
  <path d="M 495 130 L 495 232" stroke="#7a8b9a" stroke-width="1.2" fill="none" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <rect x="490" y="229" width="10" height="10" rx="2" fill="#7a8b9a" stroke="#556" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="495" y="122" font-size="10.5" font-weight="normal" fill="#3f4f5f" text-anchor="middle" filter="url(#rough2)">mid₁ 可行 → hi = mid₁</text>
  <path d="M 277 154 L 277 232" stroke="#7a8b9a" stroke-width="1.2" fill="none" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <rect x="272" y="229" width="10" height="10" rx="2" fill="#7a8b9a" stroke="#556" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="277" y="146" font-size="10.5" font-weight="normal" fill="#3f4f5f" text-anchor="middle" filter="url(#rough2)">mid₂ 不可行 → lo = mid₂</text>
  <path d="M 386 178 L 386 232" stroke="#7a8b9a" stroke-width="1.2" fill="none" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <rect x="381" y="229" width="10" height="10" rx="2" fill="#7a8b9a" stroke="#556" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="386" y="170" font-size="10.5" font-weight="normal" fill="#3f4f5f" text-anchor="middle" filter="url(#rough2)">mid₃ 可行 → hi = mid₃</text>
  <text x="360" y="350" font-size="11" font-weight="normal" fill="#555" text-anchor="middle" filter="url(#rough2)">二分 100 次把区间缩到 (max-min)/2^100，远小于 double 在 1e9 附近的分辨率</text>
  <text x="360" y="372" font-size="11" font-weight="normal" fill="#555" text-anchor="middle" filter="url(#rough2)">最优 d 一定是 0.5 的整数倍，最后吸附到最近的半整数即可无误差输出</text>
</svg>
