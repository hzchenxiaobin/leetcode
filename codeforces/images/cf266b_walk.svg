<svg xmlns="http://www.w3.org/2000/svg" width="880" height="280" viewBox="0 0 880 280"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="280" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2：BGGBG 两秒后 GGBGB</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">第一秒：位置 1-2 交换；第二秒：位置 3-4 交换</text>
  <text x="150" y="110" text-anchor="start" font-size="14" fill="#2b2b2b" filter="url(#rough2)">第 0 秒：B G G B G</text>
  <text x="150" y="152" text-anchor="start" font-size="14" fill="#2f4a66" filter="url(#rough2)">第 1 秒：G B G G B</text>
  <text x="150" y="194" text-anchor="start" font-size="14" fill="#3d6b2f" filter="url(#rough2)">第 2 秒：G G B G B</text>
  <text x="440" y="248" text-anchor="middle" font-size="13" fill="#b05a5a" filter="url(#rough2)">输出 GGBGB</text>
</svg>
