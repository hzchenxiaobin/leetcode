<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="451"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="280" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">三种资源分别算「够几次」，取最小值</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">每次干杯是全体一起喝 ⇒ 都要乘 n</text>
  <g filter="url(#rough2)"><rect x="60" y="96" width="240" height="76" rx="5" fill="#cfe0f5" fill-opacity="0.85" stroke="#446688" stroke-width="1.4"/></g>
  <text x="180" y="124" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">饮料</text>
  <text x="180" y="152" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">⌊k·l / (n·nl)⌋</text>
  <g filter="url(#rough2)"><rect x="330" y="96" width="240" height="76" rx="5" fill="#dcecd2" fill-opacity="0.85" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="450" y="124" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">柠檬</text>
  <text x="450" y="152" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">⌊c·d / n⌋</text>
  <g filter="url(#rough2)"><rect x="600" y="96" width="240" height="76" rx="5" fill="#f3d9d6" fill-opacity="0.85" stroke="#8a2b28" stroke-width="1.4"/></g>
  <text x="720" y="124" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">盐</text>
  <text x="720" y="152" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">⌊p / (n·np)⌋</text>
  <text x="450" y="212" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 = min(三者)</text>
  <text x="450" y="246" text-anchor="middle" font-size="11" fill="#666666" filter="url(#rough2)">先乘后除，避免精度损失；资源不足一次就是 0</text>
</svg>
