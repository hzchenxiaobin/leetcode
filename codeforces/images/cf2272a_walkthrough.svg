<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
  </defs>

  <rect width="760" height="430" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例走查：三组官方数据 + 一组 s = 2 的自造数据</text>
  <path d="M 120 42 Q 380 49 640 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 表头 -->
  <rect x="20" y="62" width="730" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="105" y="84" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">用例 (n, k, a)</text>
  <text x="217" y="84" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">m</text>
  <text x="324" y="84" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">前 m 个</text>
  <text x="464" y="84" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">缺失集合 S</text>
  <text x="584" y="84" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">输出的交换</text>
  <text x="697" y="84" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">结果 mex</text>

  <!-- 第 1 组 -->
  <rect x="20" y="96" width="730" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="30" y="115" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">#1  n=5, k=1</text>
  <text x="30" y="133" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">a = 0 1 2 3 4</text>
  <text x="217" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">5</text>
  <text x="324" y="125" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">[0, 1, 2, 3, 4]</text>
  <text x="464" y="125" text-anchor="middle" font-size="12" fill="#3c5e2e" filter="url(#rough2)">∅（空）</text>
  <text x="584" y="125" text-anchor="middle" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">不交换</text>
  <text x="697" y="125" text-anchor="middle" font-size="12" font-weight="bold" fill="#3c5e2e" filter="url(#rough2)">5 → 输出 −1</text>

  <!-- 第 2 组 -->
  <rect x="20" y="144" width="730" height="48" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="30" y="163" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">#2  n=3, k=2</text>
  <text x="30" y="181" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">a = 2 0 1</text>
  <text x="217" y="173" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">2</text>
  <text x="324" y="173" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">[2, 0]</text>
  <text x="464" y="173" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">{1}</text>
  <text x="584" y="173" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">(1, 3)</text>
  <text x="697" y="173" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">2 = m</text>

  <!-- 第 3 组 -->
  <rect x="20" y="192" width="730" height="48" rx="4" fill="#fafafa" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="30" y="211" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">#3  n=5, k=2</text>
  <text x="30" y="229" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">a = 0 2 1 4 3</text>
  <text x="217" y="221" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">4</text>
  <text x="324" y="221" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">[0, 2, 1, 4]</text>
  <text x="464" y="221" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">{3}</text>
  <text x="584" y="221" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">(4, 5)</text>
  <text x="697" y="221" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">4 = m</text>

  <!-- 第 4 组：自造 -->
  <rect x="20" y="240" width="730" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="30" y="259" font-size="11.5" fill="#8a6015" filter="url(#rough2)">#4 自造 n=6, k=3</text>
  <text x="30" y="277" font-size="11.5" fill="#8a6015" filter="url(#rough2)">a = 5 4 0 1 3 2</text>
  <text x="217" y="269" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015" filter="url(#rough2)">4</text>
  <text x="324" y="269" text-anchor="middle" font-size="11.5" fill="#8a6015" filter="url(#rough2)">[5, 4, 0, 1]</text>
  <text x="464" y="269" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">{2, 3}</text>
  <text x="584" y="269" text-anchor="middle" font-size="12" fill="#8a6015" filter="url(#rough2)">(1, 6)</text>
  <text x="697" y="269" text-anchor="middle" font-size="12" font-weight="bold" fill="#a14340" filter="url(#rough2)">3 = 第二小</text>

  <!-- 竖线 -->
  <path d="M 190 62 L 190 288" stroke="#66788c" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 244 62 L 244 288" stroke="#66788c" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 404 62 L 404 288" stroke="#66788c" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 524 62 L 524 288" stroke="#66788c" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 644 62 L 644 288" stroke="#66788c" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <!-- 说明 -->
  <text x="24" y="318" font-size="12" fill="#3c5e2e" filter="url(#rough2)">① #1 里 m = n，前 m 个就是整个排列，必然含 0…n−1，所以 s = 0 恒成立，输出 −1。</text>
  <text x="24" y="344" font-size="12" fill="#2f4a66" filter="url(#rough2)">② #2 / #3 的 s = 1：换入唯一缺失值，前缀恰为 0…m−1，mex 冲到 m，已是上界。</text>
  <text x="24" y="370" font-size="12" fill="#8a6015" filter="url(#rough2)">③ #4 的 s = 2：换入 2 之后 3 仍缺失，mex 只能到 3，正好等于第二小缺失值。</text>
  <rect x="20" y="384" width="730" height="34" rx="8" fill="#fafafa" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="385" y="406" text-anchor="middle" font-size="11.5" fill="#66788c" filter="url(#rough2)">注意：被换出的 a_p 一定 ≥ m，所以它不会带走任何 0…m−1 中的值，只会补进缺失值</text>
</svg>
