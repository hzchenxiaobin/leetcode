<svg xmlns="http://www.w3.org/2000/svg" width="700" height="400" viewBox="0 0 700 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ax" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2b2b2b"/>
    </marker>
  </defs>

  <rect width="700" height="400" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">g(x) = (100-k)S(x) - 100D(x) 单调不增，零点即答案</text>
  <path d="M 160 40 Q 350 46 560 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 坐标轴 -->
  <line x1="80" y1="260" x2="640" y2="260" stroke="#2b2b2b" stroke-width="1.6" marker-end="url(#ax)" filter="url(#rough2)"/>
  <line x1="80" y1="260" x2="80" y2="80" stroke="#2b2b2b" stroke-width="1.6" marker-end="url(#ax)" filter="url(#rough2)"/>
  <text x="646" y="278" font-size="12" fill="#333" filter="url(#rough2)">x</text>
  <text x="56" y="86" font-size="12" fill="#333" filter="url(#rough2)">g</text>
  <text x="66" y="278" font-size="11" fill="#555" filter="url(#rough2)">0</text>

  <!-- 可行区域底色 -->
  <rect x="80" y="120" width="290" height="140" fill="#e6f4ea" fill-opacity="0.75" stroke="none" filter="url(#rough2)"/>
  <text x="196" y="248" text-anchor="middle" font-size="12" fill="#1f5226" filter="url(#rough2)">可行：g(x) ≥ 0</text>

  <!-- g 的折线（凸性无关，画成分段线性下降） -->
  <path d="M 80 132 L 220 168 L 370 260 L 520 316 L 620 344"
        stroke="#b85450" stroke-width="2.4" fill="none" filter="url(#rough2)"/>
  <circle cx="370" cy="260" r="4.5" fill="#8c2f2b" filter="url(#rough2)"/>
  <line x1="370" y1="260" x2="370" y2="286" stroke="#8c2f2b" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <text x="370" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#8c2f2b" filter="url(#rough2)">x*</text>
  <text x="284" y="212" font-size="11.5" fill="#8c2f2b" filter="url(#rough2)">g 在此单调下降</text>

  <!-- 二分区间示意 -->
  <line x1="300" y1="330" x2="300" y2="352" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="470" y1="330" x2="470" y2="352" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="300" y1="344" x2="470" y2="344" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="366" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">lo（可行）</text>
  <text x="470" y="366" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">hi（不可行）</text>
  <text x="385" y="336" text-anchor="middle" font-size="11" fill="#2f4a66" filter="url(#rough2)">每轮 mid 判定后收缩一半</text>

  <!-- 右侧说明 -->
  <rect x="470" y="72" width="212" height="150" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="484" y="96" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">判定函数</text>
  <text x="484" y="120" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">S = Σ max(0, a_i - x)</text>
  <text x="484" y="142" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">D = Σ max(0, x - a_i)</text>
  <text x="484" y="166" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">可行 ⟺ (100-k)S ≥ 100D</text>
  <text x="484" y="190" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">上界 hi = max a_i</text>
  <text x="484" y="212" font-size="11.5" fill="#7a5a1b" filter="url(#rough2)">迭代 200 次，输出 lo</text>

  <text x="84" y="98" font-size="11.5" fill="#555" filter="url(#rough2)">g(0) = (100-k)·Σa_i ≥ 0</text>
  <text x="84" y="118" font-size="11.5" fill="#555" filter="url(#rough2)">g(max a_i) ≤ 0</text>
</svg>
