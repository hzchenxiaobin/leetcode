<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="340" fill="#fafafa"/>
  <text x="440.0" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">以最右点为锚：左边任取两点都合法</text>
  <text x="440.0" y="57" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">x 严格递增，若 x[i]-x[j] ≤ d，则 [j,i] 内任意三点最大间距都不超过 d</text>
  <g filter="url(#rough2)"><rect x="150" y="150" width="46" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="173.0" y="177.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="173" y="216" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">x1</text>
  <g filter="url(#rough2)"><rect x="232" y="150" width="46" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="255.0" y="177.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="255" y="216" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">x2</text>
  <g filter="url(#rough2)"><rect x="314" y="150" width="46" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="337.0" y="177.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="337" y="216" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">x3</text>
  <g filter="url(#rough2)"><rect x="396" y="150" width="46" height="44" rx="4" fill="#f6d9d7" fill-opacity="0.72" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="419.0" y="177.4" text-anchor="middle" font-size="15" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="419" y="216" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">x4</text>
  <path d="M127,240 L127,262 L419,262 L419,240" fill="none" stroke="#b05a5a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="273" y="284" text-anchor="middle" font-size="12.5" fill="#b05a5a" filter="url(#rough2)">窗口宽 3（d=3），左端 j=1、锚点 i=4</text>
  <text x="273" y="120" text-anchor="middle" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">锚点在 4，左边还有 3 个点 → C(3,2)=3 组</text>
  <text x="640" y="170" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">双指针 j 只会右移，</text>
  <text x="640" y="194" text-anchor="start" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">总复杂度 O(n)</text>
  <text x="440" y="320" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">答案 = Σ_i C(i-j_i, 2)，其中 j_i 是满足 x[i]-x[j] ≤ d 的最小下标</text>
</svg>
