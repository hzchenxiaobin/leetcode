<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="720" height="290" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2 走查：成功包数分别累加到两台服务器</text>
  <rect x="50" y="54" width="110" height="46" rx="8" fill="#f2f2f2" stroke="#888888" stroke-width="1.5"/>
  <text x="105" y="81" text-anchor="middle" font-size="11" fill="#555555">命令 1</text>
  <rect x="174" y="54" width="120" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="234" y="81" text-anchor="middle" font-size="11" fill="#2f4a66">1 0 10</text>
  <rect x="308" y="54" width="110" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="363" y="81" text-anchor="middle" font-size="11" fill="#2f5223">a: 0</text>
  <rect x="432" y="54" width="170" height="46" rx="8" fill="#f3edf8" stroke="#7a4a9a" stroke-width="1.5"/>
  <text x="517" y="81" text-anchor="middle" font-size="11" fill="#4a2a62">a 累计 0</text>
  <rect x="50" y="116" width="110" height="46" rx="8" fill="#f2f2f2" stroke="#888888" stroke-width="1.5"/>
  <text x="105" y="143" text-anchor="middle" font-size="11" fill="#555555">命令 2</text>
  <rect x="174" y="116" width="120" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="234" y="143" text-anchor="middle" font-size="11" fill="#2f4a66">2 0 10</text>
  <rect x="308" y="116" width="110" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="363" y="143" text-anchor="middle" font-size="11" fill="#2f5223">b: 0</text>
  <rect x="432" y="116" width="170" height="46" rx="8" fill="#f3edf8" stroke="#7a4a9a" stroke-width="1.5"/>
  <text x="517" y="143" text-anchor="middle" font-size="11" fill="#4a2a62">b 累计 0</text>
  <rect x="50" y="178" width="110" height="46" rx="8" fill="#f2f2f2" stroke="#888888" stroke-width="1.5"/>
  <text x="105" y="205" text-anchor="middle" font-size="11" fill="#555555">命令 3</text>
  <rect x="174" y="178" width="120" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="234" y="205" text-anchor="middle" font-size="11" fill="#2f4a66">1 10 0</text>
  <rect x="308" y="178" width="110" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="363" y="205" text-anchor="middle" font-size="11" fill="#2f5223">a: 10</text>
  <rect x="432" y="178" width="170" height="46" rx="8" fill="#f3edf8" stroke="#7a4a9a" stroke-width="1.5"/>
  <text x="517" y="205" text-anchor="middle" font-size="11" fill="#4a2a62">a 累计 10</text>
  <text x="56" y="250" text-anchor="start" font-size="12" fill="#2f5223" filter="url(#rough2)">a：2 次命令共 10 个成功包，2·10 = 20 ≥ 10·2 = 20 → LIVE</text>
  <text x="56" y="274" text-anchor="start" font-size="12" fill="#7a4b22" filter="url(#rough2)">b：2 次命令共 0 个成功包，0 &lt; 10·2 → DEAD</text>
</svg>
