<svg xmlns="http://www.w3.org/2000/svg" width="740" height="430" viewBox="0 0 740 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>
  <rect width="740" height="430" fill="#fafafa"/>
  <text x="370" y="30" text-anchor="middle" font-size="16.5" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">核心观察：只看 P1 顶点在剩余森林里的度数</text>
  <text x="370" y="52" text-anchor="middle" font-size="11.5" fill="#888888"
        filter="url(#rough2)">Tom 首条路径取 P1 = (2,5)；把 P1 的边删掉，剩下的边就是森林 F</text>

  <line x1="46" y1="76" x2="92" y2="76" stroke="#d6a040" stroke-width="3.4" filter="url(#rough2)"/>
  <text x="100" y="80" font-size="11" fill="#888888" filter="url(#rough2)">P1 的边（已经用掉）</text>
  <line x1="238" y1="76" x2="284" y2="76" stroke="#9aa0a6" stroke-width="1.7"
        stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="292" y="80" font-size="11" fill="#888888" filter="url(#rough2)">剩余边 F（下一步只能用这些）</text>

  <line x1="65" y1="128" x2="140" y2="188" stroke="#9aa0a6" stroke-width="1.7"
        stroke-dasharray="5 4" filter="url(#rough2)"/>
  <line x1="65" y1="252" x2="140" y2="192" stroke="#9aa0a6" stroke-width="1.7"
        stroke-dasharray="5 4" filter="url(#rough2)"/>
  <line x1="158" y1="190" x2="222" y2="190" stroke="#d6a040" stroke-width="3.6" filter="url(#rough2)"/>
  <line x1="258" y1="190" x2="312" y2="190" stroke="#d6a040" stroke-width="3.6" filter="url(#rough2)"/>
  <line x1="348" y1="186" x2="392" y2="136" stroke="#9aa0a6" stroke-width="1.7"
        stroke-dasharray="5 4" filter="url(#rough2)"/>
  <line x1="348" y1="194" x2="392" y2="244" stroke="#9aa0a6" stroke-width="1.7"
        stroke-dasharray="5 4" filter="url(#rough2)"/>

  <circle cx="140" cy="190" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="140" y="196" text-anchor="middle" font-size="13" fill="#8a6d20" filter="url(#rough2)">2</text>
  <circle cx="240" cy="190" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="240" y="196" text-anchor="middle" font-size="13" fill="#8a6d20" filter="url(#rough2)">4</text>
  <circle cx="330" cy="190" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="330" y="196" text-anchor="middle" font-size="13" fill="#8a6d20" filter="url(#rough2)">5</text>
  <circle cx="65" cy="120" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="65" y="126" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">1</text>
  <circle cx="65" cy="260" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="65" y="266" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">3</text>
  <circle cx="410" cy="125" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="410" y="131" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">6</text>
  <circle cx="410" cy="255" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="410" y="261" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">7</text>

  <text x="140" y="238" text-anchor="middle" font-size="10.5" fill="#8a6d20" filter="url(#rough2)">锚点</text>
  <text x="240" y="238" text-anchor="middle" font-size="10.5" fill="#8a6d20" filter="url(#rough2)">锚点</text>
  <text x="330" y="238" text-anchor="middle" font-size="10.5" fill="#8a6d20" filter="url(#rough2)">锚点</text>

  <rect x="452" y="104" width="268" height="150" rx="8" fill="#ffffff" stroke="#9aa0a6"
        stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="452" y1="132" x2="720" y2="132" stroke="#c8c8c8" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="452" y1="160" x2="720" y2="160" stroke="#e4e4e4" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="452" y1="188" x2="720" y2="188" stroke="#e4e4e4" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="452" y1="216" x2="720" y2="216" stroke="#e4e4e4" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="486" y="124" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">锚点</text>
  <text x="553" y="124" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">deg_T</text>
  <text x="620" y="124" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">d(P1)</text>
  <text x="687" y="124" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">deg_F</text>
  <text x="486" y="152" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="553" y="152" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="620" y="152" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="687" y="152" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">2 偶</text>
  <text x="486" y="180" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="553" y="180" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="620" y="180" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="687" y="180" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">0 偶</text>
  <text x="486" y="208" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <text x="553" y="208" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="620" y="208" text-anchor="middle" font-size="12" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="687" y="208" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">2 偶</text>
  <text x="586" y="238" text-anchor="middle" font-size="11" fill="#888888" filter="url(#rough2)">三个锚点 deg_F 全是偶数</text>
  <text x="586" y="282" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">⇒ 轮到走的 Jerry 必败</text>
  <text x="586" y="300" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">⇒ (2,5) 是 Tom 的必胜首步</text>

  <rect x="40" y="322" width="336" height="92" rx="9" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="58" y="346" text-anchor="start" font-size="12" font-weight="bold" fill="#4a7a3a"
        filter="url(#rough2)">局面必败的充要条件</text>
  <text x="58" y="370" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">上一路径为 P、剩余森林为 F 时：</text>
  <text x="58" y="392" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">轮到走的人必败 ⟺ P 的每个顶点 v</text>
  <text x="58" y="408" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">都满足 deg_F(v) 为偶数</text>

  <rect x="396" y="322" width="344" height="92" rx="9" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="414" y="346" text-anchor="start" font-size="12" font-weight="bold" fill="#8a6d20"
        filter="url(#rough2)">把条件翻译成原图的度数</text>
  <text x="414" y="370" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">deg_F(v) = deg_T(v) − d(P1 中 v 的边数)</text>
  <text x="414" y="392" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">端点 d = 1 ⇒ 需要 deg_T(v) 为奇</text>
  <text x="414" y="408" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">内部点 d = 2 ⇒ 需要 deg_T(v) 为偶</text>
</svg>
