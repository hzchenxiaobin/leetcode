<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="420" fill="#fafafa" filter="url(#rough2)"/>

  <text x="360" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">
    双端队列 = DFS 栈（front）+ BFS 队列（back）
  </text>

  <rect x="268" y="62" width="184" height="40" rx="8" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="87" text-anchor="middle" font-size="13" fill="#2b3f55" filter="url(#rough2)">
    front 的下一个孩子 c
  </text>

  <path d="M300,102 C265,128 220,142 178,164" fill="none" stroke="#446688"
        stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="196" y="136" font-size="12" fill="#b85450" filter="url(#rough2)">颜色 0</text>

  <path d="M420,102 C455,128 500,142 542,164" fill="none" stroke="#446688"
        stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="470" y="136" font-size="12" fill="#b85450" filter="url(#rough2)">颜色 1</text>

  <rect x="40" y="172" width="252" height="206" rx="10" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="166" y="196" text-anchor="middle" font-size="14" fill="#2f4a26" filter="url(#rough2)">
    front：DFS 栈（后进先出）
  </text>
  <rect x="72" y="210" width="188" height="30" rx="6" fill="#f7fbf7"
        stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="166" y="231" text-anchor="middle" font-size="13" fill="#2f4a26" filter="url(#rough2)">
    当前段的段根 r
  </text>
  <rect x="72" y="248" width="188" height="30" rx="6" fill="#f7fbf7"
        stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="166" y="269" text-anchor="middle" font-size="13" fill="#2f4a26" filter="url(#rough2)">……</text>
  <rect x="72" y="286" width="188" height="30" rx="6" fill="#f7fbf7"
        stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="166" y="307" text-anchor="middle" font-size="13" fill="#2f4a26" filter="url(#rough2)">父节点</text>
  <rect x="72" y="324" width="188" height="30" rx="6" fill="#fff8e1"
        stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="166" y="345" text-anchor="middle" font-size="13" fill="#7a5a1e" filter="url(#rough2)">
    当前顶点 v
  </text>

  <rect x="428" y="172" width="252" height="206" rx="10" fill="#fff8e1"
        stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="554" y="196" text-anchor="middle" font-size="14" fill="#7a5a1e" filter="url(#rough2)">
    back：BFS 队列（先进先出）
  </text>
  <rect x="446" y="212" width="56" height="32" rx="6" fill="#fefcf3"
        stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="474" y="234" text-anchor="middle" font-size="13" fill="#7a5a1e" filter="url(#rough2)">a</text>
  <rect x="514" y="212" width="56" height="32" rx="6" fill="#fefcf3"
        stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="542" y="234" text-anchor="middle" font-size="13" fill="#7a5a1e" filter="url(#rough2)">b</text>
  <rect x="582" y="212" width="56" height="32" rx="6" fill="#fefcf3"
        stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="610" y="234" text-anchor="middle" font-size="13" fill="#7a5a1e" filter="url(#rough2)">c</text>
  <text x="554" y="278" text-anchor="middle" font-size="12" fill="#7a5a1e" filter="url(#rough2)">
    待处理的段根，按入队顺序处理
  </text>
  <text x="554" y="306" text-anchor="middle" font-size="12" fill="#7a5a1e" filter="url(#rough2)">
    1 边 → 不必立刻展开
  </text>
  <text x="554" y="334" text-anchor="middle" font-size="12" fill="#7a5a1e" filter="url(#rough2)">
    0 边 → 立刻深度展开
  </text>

  <text x="360" y="404" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    p = 段₁ + 段₂ + … ，每段都是「只走 0 边」的前序
  </text>
</svg>
