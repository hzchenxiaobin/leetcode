  <text x="96" y="354" font-size="12" fill="#2b2b2b" filter="url(#rough2)">b₁=2 ⇒ 禁 1,2　　b₂=1 ⇒ 禁 2　　b₃=0 ⇒ 宝 3　　b₄=1 ⇒ 禁 4</text>
  <text x="96" y="378" font-size="12" fill="#2b2b2b" filter="url(#rough2)">b₅=0 ⇒ 宝 5　　b₆=1 ⇒ 禁 6　　b₇=2 ⇒ 禁 6,7　⇒ 允许集合 = {3, 5}</text>
