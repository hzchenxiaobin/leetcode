<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr75ac" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="720" height="300" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">三步：求和 → 三个数分别删零 → 比较</text>

  <g filter="url(#rough2)">
    <rect x="40" y="70" width="130" height="66" rx="8" fill="#eef4fb" stroke="#446688" stroke-width="1.7"/>
    <rect x="200" y="70" width="150" height="66" rx="8" fill="#fff8e1" stroke="#c9a227" stroke-width="1.7"/>
    <rect x="380" y="70" width="150" height="66" rx="8" fill="#f7e6e6" stroke="#b85450" stroke-width="1.7"/>
    <rect x="560" y="70" width="130" height="66" rx="8" fill="#e8f0e0" stroke="#4a7a3a" stroke-width="1.7"/>
  </g>
  <g font-size="12" fill="#2b3a4a" text-anchor="middle" filter="url(#rough2)">
    <text x="105" y="98">读入 a, b</text>
    <text x="105" y="118" font-size="11" fill="#5a6a7a">（long long）</text>
    <text x="275" y="98">c = a + b</text>
    <text x="275" y="118" font-size="11" fill="#8a6015">c 可达 2e9</text>
    <text x="455" y="98">三个数分别 strip</text>
    <text x="455" y="118" font-size="11" fill="#7a2f2c">删掉所有 0</text>
    <text x="625" y="98">a'+b' == c' ?</text>
    <text x="625" y="118" font-size="11" fill="#2f5223">YES / NO</text>
  </g>
  <g filter="url(#rough2)" stroke="#4a7a3a" stroke-width="2" fill="none">
    <path d="M172 103 L196 103" marker-end="url(#arr75ac)"/>
    <path d="M352 103 L376 103" marker-end="url(#arr75ac)"/>
    <path d="M532 103 L556 103" marker-end="url(#arr75ac)"/>
  </g>

  <g font-size="12.5" fill="#33475c" filter="url(#rough2)">
    <text x="40" y="178">strip 的实现：</text>
    <text x="60" y="204">C++：to_string 后跳过字符 '0'，再 stoll 回来</text>
    <text x="60" y="230">Python：int(str(x).replace("0", ""))</text>
  </g>
  <text x="40" y="266" font-size="12" fill="#6b6b66" filter="url(#rough2)">注意：c 也可能达到 2×10⁹，因此三个数都要用 64 位比较</text>
</svg>
