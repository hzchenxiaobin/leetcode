<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="720" height="400" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">替换规则：白格递归，黑格填满</text>
  <path d="M 210 42 Q 360 48 510 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <text x="130" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">白格</text>
  <rect x="90" y="100" width="80" height="80" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="130" y="146" text-anchor="middle" font-size="20" fill="#888" filter="url(#rough2)">.</text>
  <path d="M 185 140 L 245 140" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="255" y="100" width="80" height="80" fill="#fff" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="255" y="100" width="40" height="40" fill="#fff" stroke="#4a7a3a" stroke-width="0.8"/>
    <rect x="295" y="100" width="40" height="40" fill="#2b2b2b" stroke="#4a7a3a" stroke-width="0.8"/>
    <rect x="255" y="140" width="40" height="40" fill="#fff" stroke="#4a7a3a" stroke-width="0.8"/>
    <rect x="295" y="140" width="40" height="40" fill="#fff" stroke="#4a7a3a" stroke-width="0.8"/>
  </g>
  <text x="335" y="86" text-anchor="middle" font-size="11" fill="#2f5223" filter="url(#rough2)">换成模板</text>

  <text x="500" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">黑格</text>
  <rect x="460" y="100" width="80" height="80" fill="#2b2b2b" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="500" y="146" text-anchor="middle" font-size="20" fill="#fff" filter="url(#rough2)">*</text>
  <path d="M 555 140 L 615 140" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="625" y="100" width="80" height="80" fill="#2b2b2b" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>

  <rect x="40" y="216" width="640" height="72" rx="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <g font-size="11.5" fill="#2f4a66" filter="url(#rough2)">
    <text x="56" y="242">递归函数 paint(level, x, y, size)：level=1 时按模板逐格写；否则对模板的每个格子，</text>
    <text x="56" y="266">黑格把 size/n 见方的子块全部涂黑，白格递归调用 paint(level−1, …)。</text>
  </g>

  <rect x="40" y="306" width="640" height="72" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <g font-size="11.5" fill="#2f5223" filter="url(#rough2)">
    <text x="56" y="332">总格子数 n^(2k) ≤ 3^10 = 59049；递归深度 k ≤ 5，时间与输出同阶。</text>
    <text x="56" y="356">输出只含 '.' 和 '*'，行末不要空格；原题要求文件 I/O。</text>
  </g>
</svg>
