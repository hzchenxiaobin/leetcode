<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="760" height="430" fill="#fafafa"/>

  <text x="380" y="30" text-anchor="middle" font-size="17" fill="#333"
        filter="url(#rough2)">算法：二分答案 X ＋ 单次 O(n) 判定</text>
  <text x="380" y="52" text-anchor="middle" font-size="12" fill="#666"
        filter="url(#rough2)">判定只做两遍扫描：正扫出「左边来的锥」，逆扫出「右边来的锥」</text>

  <!-- 左侧：二分骨架 -->
  <rect x="24" y="70" width="212" height="250" rx="10" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="130" y="94" text-anchor="middle" font-size="12.5" fill="#2c4a6b"
        filter="url(#rough2)">外层：二分 X</text>

  <rect x="46" y="108" width="168" height="34" rx="6" fill="#ffffff" stroke="#446688"
        stroke-width="1.3" filter="url(#rough2)"/>
  <text x="130" y="130" text-anchor="middle" font-size="11" fill="#333"
        filter="url(#rough2)">lo 不可行，hi 可行</text>

  <rect x="46" y="158" width="168" height="34" rx="6" fill="#ffffff" stroke="#446688"
        stroke-width="1.3" filter="url(#rough2)"/>
  <text x="130" y="180" text-anchor="middle" font-size="11" fill="#333"
        filter="url(#rough2)">mid = (lo + hi) / 2</text>

  <rect x="46" y="208" width="168" height="34" rx="6" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="130" y="230" text-anchor="middle" font-size="11" fill="#8a5a00"
        filter="url(#rough2)">feasible(mid)？</text>

  <text x="42" y="272" font-size="10.5" fill="#2f5a24" filter="url(#rough2)">是 → hi = mid</text>
  <text x="140" y="272" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">否 → lo = mid</text>
  <path d="M130,192 L130,206" stroke="#446688" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M130,142 L130,156" stroke="#446688" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M64,242 C28,252 28,176 44,124" stroke="#4a7a3a" stroke-width="1.4"
        fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="130" y="300" text-anchor="middle" font-size="10.5" fill="#555"
        filter="url(#rough2)">hi − lo = 1 时输出 hi</text>
  <text x="130" y="314" text-anchor="middle" font-size="10" fill="#888"
        filter="url(#rough2)">上界取初始最大相邻差</text>

  <!-- 右侧：四步判定 -->
  <rect x="252" y="70" width="486" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="266" y="92" font-size="11.5" fill="#2f5a24" filter="url(#rough2)">① 周期延拓：b = h + h + h，长度 3n（下标 0 … 3n−1）</text>
  <text x="266" y="114" font-size="10.5" fill="#555" filter="url(#rough2)">环上「绕另一侧」的短弧来源，全靠左右两份复制补齐</text>

  <rect x="252" y="136" width="486" height="48" rx="8" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="266" y="158" font-size="11.5" fill="#2c4a6b" filter="url(#rough2)">② 正扫：pre[j] = max(pre[j−1], b_j + X·j)，j = 0 … 2n−1</text>
  <text x="266" y="176" font-size="10.5" fill="#555" filter="url(#rough2)">得到所有 j ≤ i 的锥在 i 处的贡献</text>

  <rect x="252" y="194" width="486" height="56" rx="8" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="266" y="216" font-size="11.5" fill="#2c4a6b" filter="url(#rough2)">③ 逆扫：suf = max(suf, b_i − X·i)，对 i = 3n−1 … n</text>
  <text x="266" y="238" font-size="11" fill="#8a3a36" filter="url(#rough2)">a_i = max(pre_i − X·i，suf + X·i)，i ∈ [n, 2n)</text>

  <rect x="252" y="260" width="486" height="50" rx="8" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="266" y="282" font-size="11.5" fill="#8a3a36" filter="url(#rough2)">④ cost += a_i − b_i；一旦 cost &gt; k 立刻返回 false</text>
  <text x="266" y="301" font-size="10.5" fill="#666" filter="url(#rough2)">cost 最大约 n·10⁹ = 10¹⁵，用 long long；超过 k 就没必要再扫</text>

  <path d="M495,126 L495,134" stroke="#446688" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M495,184 L495,192" stroke="#446688" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M495,250 L495,258" stroke="#446688" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="252" y="330" font-size="10.5" fill="#888" filter="url(#rough2)">单次判定 O(n) ⇒ 总复杂度 O(n log V)，V ≤ 10⁹ 只需约 30 轮</text>

  <!-- 底部：3n 数组示意 -->
  <text x="380" y="352" text-anchor="middle" font-size="11" fill="#555"
        filter="url(#rough2)">3n 周期数组：i 只在中间那份取值，左右两份供「短弧」取最大</text>

  <rect x="60" y="362" width="200" height="34" rx="5" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="272" y="362" width="200" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="2" filter="url(#rough2)"/>
  <rect x="484" y="362" width="200" height="34" rx="5" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.2" filter="url(#rough2)"/>
  <text x="160" y="384" text-anchor="middle" font-size="11" fill="#8a3a36"
        filter="url(#rough2)">第 1 份 h（绕左的短弧）</text>
  <text x="372" y="384" text-anchor="middle" font-size="11" fill="#2f5a24"
        filter="url(#rough2)">第 2 份 h：i 的取值区间</text>
  <text x="584" y="384" text-anchor="middle" font-size="11" fill="#8a3a36"
        filter="url(#rough2)">第 3 份 h（绕右的短弧）</text>
</svg>
