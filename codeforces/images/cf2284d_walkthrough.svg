<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：n = 4 时三条串的编码与解码</text>
  <text x="310" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">两次运行各做各的：LCB 只写划分，RCB 只读划分</text>

  <!-- header -->
  <rect x="34" y="64" width="84" height="26" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="76" y="81" text-anchor="middle" font-size="10.5" fill="#444" font-weight="bold" filter="url(#rough2)">s</text>
  <rect x="126" y="64" width="128" height="26" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="190" y="81" text-anchor="middle" font-size="10.5" fill="#444" font-weight="bold" filter="url(#rough2)">划分 A / B</text>
  <rect x="262" y="64" width="170" height="26" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="347" y="81" text-anchor="middle" font-size="10.5" fill="#444" font-weight="bold" filter="url(#rough2)">LCB 输出（m 条边）</text>
  <rect x="440" y="64" width="144" height="26" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="512" y="81" text-anchor="middle" font-size="10.5" fill="#444" font-weight="bold" filter="url(#rough2)">RCB 解码</text>

  <!-- row 1: 101 -->
  <rect x="34" y="94" width="84" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="76" y="118" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">101</text>
  <text x="76" y="136" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">n = 4</text>
  <rect x="126" y="94" width="128" height="52" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="190" y="114" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">A = 1, 2, 4（同色）</text>
  <text x="190" y="133" text-anchor="middle" font-size="10" fill="#c08a2a" filter="url(#rough2)">B = 3（异色）</text>
  <rect x="262" y="94" width="170" height="52" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="347" y="114" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1-3, 2-3, 4-3</text>
  <text x="347" y="133" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">m = 3 = n − 1（以 3 为中心）</text>
  <rect x="440" y="94" width="144" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="512" y="114" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2,4 与 1 同色 → 1</text>
  <text x="512" y="133" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3 异色 → 0 ⟹ 101</text>

  <!-- row 2: 000 -->
  <rect x="34" y="152" width="84" height="52" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="76" y="176" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">000</text>
  <text x="76" y="194" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">n = 4</text>
  <rect x="126" y="152" width="128" height="52" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="190" y="172" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">A = 1</text>
  <text x="190" y="191" text-anchor="middle" font-size="10" fill="#c08a2a" filter="url(#rough2)">B = 2, 3, 4</text>
  <rect x="262" y="152" width="170" height="52" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="347" y="172" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1-2, 1-3, 1-4</text>
  <text x="347" y="191" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">m = 3 = n − 1（星形）</text>
  <rect x="440" y="152" width="144" height="52" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="512" y="172" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2,3,4 全异色</text>
  <text x="512" y="191" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">⟹ 000</text>

  <!-- row 3: 111 -->
  <rect x="34" y="210" width="84" height="52" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="76" y="234" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">111</text>
  <text x="76" y="252" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">n = 4</text>
  <rect x="126" y="210" width="128" height="52" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="190" y="234" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">划分退化（B 为空）</text>
  <text x="190" y="252" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">改用非二分图</text>
  <rect x="262" y="210" width="170" height="52" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="347" y="230" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1-2, 2-3, 1-3, 1-4</text>
  <text x="347" y="249" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">三角形 + 挂叶，m = 4</text>
  <rect x="440" y="210" width="144" height="52" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="512" y="230" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">出现同色边</text>
  <text x="512" y="249" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">⟹ 111</text>

  <text x="310" y="292" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">只要 n ≥ 3 三角形就存在；n = 3 时 111 直接输出三角形</text>
  <text x="310" y="316" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">官方样例给的是 K4 减一条边（非二分），那只是另一套合法策略：解码必须与自己的编码配对</text>
  <text x="310" y="340" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">本策略边数恒为 n−1（特例为 n），远低于上界 n(n−1)/2，输出与读入都很便宜</text>
  <text x="310" y="372" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">PUB 反复操作后：二分图仍二分且划分不变；非二分图仍非二分 ⟹ 两侧不会互相串门</text>
</svg>
