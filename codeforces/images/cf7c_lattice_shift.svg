<svg xmlns="http://www.w3.org/2000/svg" width="760" height="480" viewBox="0 0 760 480"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c9801f"/>
    </marker>
  </defs>

  <rect width="760" height="480" fill="#fafafa" filter="url(#rough2)"/>
  <text x="380.0" y="38" text-anchor="middle" font-size="18.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">解集是一条格点直线：按 (b, -a) 平移</text>
  <path d="M 152 50 Q 380 56 608 50" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 96 290 L 726 290" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 370 290 L 370 58" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="734" y="278" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">x</text>
  <text x="380" y="50" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">y</text>
  <text x="356" y="306" text-anchor="middle" font-size="11" fill="#888" font-weight="normal" filter="url(#rough2)">O</text>
  <line x1="110" y1="198" x2="530" y2="366" stroke="#8a5a44" stroke-width="2.2" filter="url(#rough2)"/>
  <circle cx="190" cy="230" r="4.2" fill="#b6483f" stroke="none" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="199" y="221" text-anchor="start" font-size="11" fill="#7a3b33" font-weight="normal" filter="url(#rough2)">(-9, 3)</text>
  <circle cx="290" cy="270" r="4.2" fill="#b6483f" stroke="none" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="299" y="261" text-anchor="start" font-size="11" fill="#7a3b33" font-weight="normal" filter="url(#rough2)">(-4, 1)</text>
  <circle cx="390" cy="310" r="4.2" fill="#b6483f" stroke="none" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="399" y="301" text-anchor="start" font-size="11" fill="#7a3b33" font-weight="normal" filter="url(#rough2)">(1, -1)</text>
  <circle cx="490" cy="350" r="4.2" fill="#b6483f" stroke="none" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="499" y="341" text-anchor="start" font-size="11" fill="#7a3b33" font-weight="normal" filter="url(#rough2)">(6, -3)</text>
  <circle cx="590" cy="390" r="4.2" fill="#b6483f" stroke="none" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="599" y="381" text-anchor="start" font-size="11" fill="#7a3b33" font-weight="normal" filter="url(#rough2)">(11, -5)</text>
  <path d="M 396 306 L 482 346" stroke="#446688" stroke-width="1.7" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 496 346 L 582 386" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <rect x="556" y="62" width="190" height="86" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="566" y="86" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">x 平移到 [0, |b|) 后</text>
  <text x="566" y="108" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">|x| &lt; |b| &lt;= 2*10^9</text>
  <text x="566" y="130" text-anchor="start" font-size="11.5" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">|y| &lt;= 4*10^9</text>
  <text x="100" y="392" text-anchor="start" font-size="12" fill="#2f4a66" font-weight="normal" filter="url(#rough2)">+ (b, -a) = (5, -2)：每平移一次，落到下一个整点</text>
  <text x="100" y="430" text-anchor="start" font-size="12" fill="#2b2b2b" font-weight="normal" filter="url(#rough2)">直线上的整点两两相差 (b, -a) = (B/g, -A/g) 的整数倍，其中 b 最多 2*10^9。</text>
  <text x="100" y="456" text-anchor="start" font-size="12" fill="#2f5223" font-weight="bold" filter="url(#rough2)">平移一次就把 x 收进很小的区间，y 只到 4*10^9，比允许的 5*10^18 小 9 个数量级。</text>
</svg>
