<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="1443"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="720" height="300" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">贪心：按 a 递增，取 ≥ b 的最小空闲格</text>
  <path d="M 160 42 Q 360 48 560 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <line x1="180" y1="70" x2="180" y2="252" stroke="#dcdcd6" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <line x1="320" y1="70" x2="320" y2="252" stroke="#dcdcd6" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <line x1="460" y1="70" x2="460" y2="252" stroke="#dcdcd6" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <text x="170" y="96" text-anchor="end" font-size="11.5" fill="#335478" filter="url(#rough2)">#1  [1, 2]</text>
  <rect x="180" y="80" width="140" height="22" rx="11" fill="#dfe8f3" stroke="#5a7fb0" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="180" cy="91" r="7" fill="#335478" filter="url(#rough2)"/>
  <text x="180" y="124" text-anchor="middle" font-size="10.5" fill="#335478" filter="url(#rough2)">取 p=1</text>

  <text x="170" y="146" text-anchor="end" font-size="11.5" fill="#2f5223" filter="url(#rough2)">#3  [1, 3]</text>
  <rect x="180" y="130" width="280" height="22" rx="11" fill="#eef5ea" stroke="#5a8a4a" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="320" cy="141" r="7" fill="#2f5223" filter="url(#rough2)"/>
  <text x="320" y="174" text-anchor="middle" font-size="10.5" fill="#2f5223" filter="url(#rough2)">取 p=2</text>

  <text x="170" y="196" text-anchor="end" font-size="11.5" fill="#8a5a86" filter="url(#rough2)">#2  [2, 3]</text>
  <rect x="320" y="180" width="140" height="22" rx="11" fill="#f6eef4" stroke="#a05a9a" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="460" cy="191" r="7" fill="#8a5a86" filter="url(#rough2)"/>
  <text x="460" y="224" text-anchor="middle" font-size="10.5" fill="#8a5a86" filter="url(#rough2)">取 p=3</text>

  <line x1="150" y1="252" x2="510" y2="252" stroke="#555555" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="180" y="272" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">对角格 1</text>
  <text x="320" y="272" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">对角格 2</text>
  <text x="460" y="272" text-anchor="middle" font-size="11" fill="#555555" filter="url(#rough2)">对角格 3</text>
  <text x="590" y="146" font-size="10.5" fill="#777777" filter="url(#rough2)">样例 n=3 的</text>
  <text x="590" y="164" font-size="10.5" fill="#777777" filter="url(#rough2)">三个人都入选</text>
  <text x="590" y="196" font-size="10.5" fill="#2f5223" filter="url(#rough2)">总人数 = 3</text>
</svg>
