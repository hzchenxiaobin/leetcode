<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="113"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="a9carr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="460" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">只枚举 0/1 数：长度 → 掩码 → 计数</text>
  <path d="M 140 44 Q 380 50 620 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 左流程 -->
  <rect x="40" y="62" width="300" height="46" rx="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="90" text-anchor="middle" font-size="13" fill="#2f4a66" filter="url(#rough2)">读入 n（1 ≤ n ≤ 10⁹）</text>
  <line x1="190" y1="108" x2="190" y2="126" stroke="#446688" stroke-width="1.7" marker-end="url(#a9carr)" filter="url(#rough2)"/>

  <rect x="40" y="128" width="300" height="46" rx="9" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="156" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">len = 1, 2, …, 10</text>
  <line x1="190" y1="174" x2="190" y2="192" stroke="#446688" stroke-width="1.7" marker-end="url(#a9carr)" filter="url(#rough2)"/>

  <rect x="40" y="194" width="300" height="46" rx="9" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="222" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">mask = 0 … 2^(len-1) - 1</text>
  <line x1="190" y1="240" x2="190" y2="258" stroke="#446688" stroke-width="1.7" marker-end="url(#a9carr)" filter="url(#rough2)"/>

  <rect x="40" y="260" width="300" height="46" rx="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="288" text-anchor="middle" font-size="13" fill="#8a6015" filter="url(#rough2)">首位固定 1，按 mask 逐位拼出 v</text>
  <line x1="190" y1="306" x2="190" y2="324" stroke="#446688" stroke-width="1.7" marker-end="url(#a9carr)" filter="url(#rough2)"/>

  <rect x="40" y="326" width="300" height="46" rx="9" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="354" text-anchor="middle" font-size="13" fill="#2b2b2b" filter="url(#rough2)">若 v ≤ n：ans = ans + 1</text>
  <line x1="190" y1="372" x2="190" y2="390" stroke="#446688" stroke-width="1.7" marker-end="url(#a9carr)" filter="url(#rough2)"/>

  <rect x="40" y="392" width="300" height="46" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="420" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223" filter="url(#rough2)">输出 ans</text>

  <!-- 右表 -->
  <rect x="372" y="62" width="356" height="376" rx="12" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="392" y="88" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">候选数量（长度 1..9，第 10 层另计）</text>
  <text x="396" y="114" font-size="10.5" fill="#777" filter="url(#rough2)">长度</text>
  <text x="476" y="114" font-size="10.5" fill="#777" filter="url(#rough2)">这一层</text>
  <text x="584" y="114" font-size="10.5" fill="#777" filter="url(#rough2)">累计</text>
  <text x="396" y="142" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="476" y="142" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="584" y="142" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="396" y="170" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="476" y="170" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="584" y="170" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="396" y="198" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="476" y="198" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="584" y="198" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">7</text>
  <text x="396" y="226" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="476" y="226" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">8</text>
  <text x="584" y="226" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">15</text>
  <text x="396" y="254" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <text x="476" y="254" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">16</text>
  <text x="584" y="254" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">31</text>
  <text x="396" y="282" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">6</text>
  <text x="476" y="282" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">32</text>
  <text x="584" y="282" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">63</text>
  <text x="396" y="310" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">7</text>
  <text x="476" y="310" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">64</text>
  <text x="584" y="310" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">127</text>
  <text x="396" y="338" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">8</text>
  <text x="476" y="338" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">128</text>
  <text x="584" y="338" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">255</text>
  <text x="396" y="366" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">9</text>
  <text x="476" y="366" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">256</text>
  <text x="584" y="366" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">511</text>
  <text x="392" y="394" font-size="11.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">第 10 层：512 个，累计 1023 个候选</text>
  <text x="392" y="418" font-size="10.5" fill="#777" filter="url(#rough2)">v 最大到 1111111111，用 long long 保存</text>
</svg>
