<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="41"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="720" height="360" fill="#fafafa"/>

  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2 走查：K₅ 里为什么是 12 个五元环</text>
  <path d="M 150 42 Q 360 48 570 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- K5 -->
  <polygon points="150,96 214,142 190,218 110,218 86,142" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <polygon points="150,96 214,142 190,218 110,218 86,142" fill="none" stroke="#446688" stroke-width="1.1"
           stroke-dasharray="4 4" filter="url(#rough2)"/>
  <path d="M 150 96 L 190 218" stroke="#a9c2d8" stroke-width="1.1" filter="url(#rough2)"/>
  <path d="M 150 96 L 110 218" stroke="#a9c2d8" stroke-width="1.1" filter="url(#rough2)"/>
  <path d="M 214 142 L 110 218" stroke="#a9c2d8" stroke-width="1.1" filter="url(#rough2)"/>
  <path d="M 86 142 L 190 218" stroke="#a9c2d8" stroke-width="1.1" filter="url(#rough2)"/>
  <path d="M 214 142 L 86 142" stroke="#a9c2d8" stroke-width="1.1" filter="url(#rough2)"/>
  <circle cx="150" cy="96" r="5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="214" cy="142" r="5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="190" cy="218" r="5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="110" cy="218" r="5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="86" cy="142" r="5" fill="#446688" filter="url(#rough2)"/>
  <text x="150" y="248" text-anchor="middle" font-size="12" fill="#2b4a68" filter="url(#rough2)">K₅：任意 5 个点都连成完全图</text>

  <!-- 计算步骤 -->
  <text x="300" y="86" font-size="12.5" font-weight="bold" fill="#2b4a68" filter="url(#rough2)">① A 的特征值：4（一重）、−1（四重）</text>
  <text x="300" y="110" font-size="12.5" fill="#2b4a68" filter="url(#rough2)">tr(A⁵) = 4⁵ + 4·(−1)⁵ = 1024 − 4 = 1020</text>

  <text x="300" y="142" font-size="12.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">② 每个顶点：deg = 4，过它的三角形 T_a = C(4,2) = 6</text>
  <text x="300" y="166" font-size="12.5" fill="#8a6015" filter="url(#rough2)">10·Σ_a T_a(deg_a − 1) = 10 · 5 · 6 · 3 = 900</text>

  <text x="300" y="198" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">③ (1020 − 900) / 10 = 12</text>

  <text x="300" y="226" font-size="11.5" fill="#666" filter="url(#rough2)">与组合计数一致：C(5,5)·(5−1)!/2 = 1·12 = 12</text>

  <!-- 底部：10 倍关系的解释 -->
  <rect x="40" y="266" width="640" height="76" rx="8" fill="#f4f8ee" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="290" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">为什么最后除以 10：</text>
  <text x="56" y="311" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">一个 5 个点的环写成序列有 5 个起点、2 个方向，共 10 种写法；tr(A⁵) 把每种写法各数一次，</text>
  <text x="56" y="331" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">扣掉非简单环之后，剩下的恰好是 10 的倍数。</text>
</svg>
