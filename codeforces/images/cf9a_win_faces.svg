<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="91"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="a9aarr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="760" height="440" fill="#fafafa"/>

  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">Dot 要掷出至少 m = max(Y, W) 点</text>
  <path d="M 150 44 Q 380 50 610 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 左：样例 4 2 的两个骰子 -->
  <rect x="26" y="56" width="450" height="260" rx="12" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="46" y="82" font-size="12.5" fill="#555" filter="url(#rough2)">样例 Y = 4，W = 2</text>
  <rect x="52" y="94" width="46" height="46" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="75" y="126" text-anchor="middle" font-size="22" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">4</text>
  <text x="112" y="122" font-size="12" fill="#555" filter="url(#rough2)">Y</text>
  <rect x="142" y="94" width="46" height="46" rx="7" fill="#f1ecf8" stroke="#7a5a9a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="165" y="126" text-anchor="middle" font-size="22" font-weight="bold" fill="#5a3f78" filter="url(#rough2)">2</text>
  <text x="202" y="122" font-size="12" fill="#555" filter="url(#rough2)">W</text>
  <text x="252" y="112" font-size="12.5" fill="#2b2b2b" filter="url(#rough2)">m = 4</text>
  <line x1="234" y1="118" x2="248" y2="108" stroke="#446688" stroke-width="1.5" marker-end="url(#a9aarr)" filter="url(#rough2)"/>

  <!-- 六个面 -->
  <text x="46" y="174" font-size="12" fill="#555" filter="url(#rough2)">Dot 的六个面（绿 = 获胜）：</text>
  <g filter="url(#rough2)">
    <rect x="50" y="186" width="52" height="52" rx="7" fill="#f0f0f0" stroke="#999" stroke-width="1.3"/>
    <rect x="116" y="186" width="52" height="52" rx="7" fill="#f0f0f0" stroke="#999" stroke-width="1.3"/>
    <rect x="182" y="186" width="52" height="52" rx="7" fill="#f0f0f0" stroke="#999" stroke-width="1.3"/>
    <rect x="248" y="186" width="52" height="52" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="314" y="186" width="52" height="52" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <rect x="380" y="186" width="52" height="52" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <text x="76" y="222" text-anchor="middle" font-size="18" font-weight="bold" fill="#777" filter="url(#rough2)">1</text>
  <text x="142" y="222" text-anchor="middle" font-size="18" font-weight="bold" fill="#777" filter="url(#rough2)">2</text>
  <text x="208" y="222" text-anchor="middle" font-size="18" font-weight="bold" fill="#777" filter="url(#rough2)">3</text>
  <text x="274" y="222" text-anchor="middle" font-size="18" font-weight="bold" fill="#2f5223" filter="url(#rough2)">4</text>
  <text x="340" y="222" text-anchor="middle" font-size="18" font-weight="bold" fill="#2f5223" filter="url(#rough2)">5</text>
  <text x="406" y="222" text-anchor="middle" font-size="18" font-weight="bold" fill="#2f5223" filter="url(#rough2)">6</text>
  <text x="76" y="258" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">输</text>
  <text x="142" y="258" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">输</text>
  <text x="208" y="258" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">输</text>
  <text x="274" y="258" text-anchor="middle" font-size="10.5" fill="#2f5223" filter="url(#rough2)">赢</text>
  <text x="340" y="258" text-anchor="middle" font-size="10.5" fill="#2f5223" filter="url(#rough2)">赢</text>
  <text x="406" y="258" text-anchor="middle" font-size="10.5" fill="#2f5223" filter="url(#rough2)">赢</text>
  <text x="46" y="294" font-size="12.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">获胜面数 = 6 - 4 + 1 = 3，概率 3/6 = 1/2</text>

  <!-- 右：m 与概率表 -->
  <rect x="494" y="56" width="240" height="260" rx="12" fill="#ffffff" stroke="#c9c2b4" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="514" y="82" font-size="12.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">m 与最简分数</text>
  <text x="516" y="108" font-size="11" fill="#777" filter="url(#rough2)">m</text>
  <text x="576" y="108" font-size="11" fill="#777" filter="url(#rough2)">获胜面</text>
  <text x="660" y="108" font-size="11" fill="#777" filter="url(#rough2)">输出</text>
  <g filter="url(#rough2)">
    <rect x="508" y="116" width="212" height="28" fill="#ffffff" stroke="#e3ded4" stroke-width="1"/>
    <rect x="508" y="144" width="212" height="28" fill="#ffffff" stroke="#e3ded4" stroke-width="1"/>
    <rect x="508" y="172" width="212" height="28" fill="#ffffff" stroke="#e3ded4" stroke-width="1"/>
    <rect x="508" y="200" width="212" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1"/>
    <rect x="508" y="228" width="212" height="28" fill="#ffffff" stroke="#e3ded4" stroke-width="1"/>
    <rect x="508" y="256" width="212" height="28" fill="#ffffff" stroke="#e3ded4" stroke-width="1"/>
  </g>
  <text x="520" y="135" font-size="12" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="520" y="163" font-size="12" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="520" y="191" font-size="12" fill="#2b2b2b" filter="url(#rough2)">3</text>
  <text x="520" y="219" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">4</text>
  <text x="520" y="247" font-size="12" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <text x="520" y="275" font-size="12" fill="#2b2b2b" filter="url(#rough2)">6</text>
  <text x="588" y="135" font-size="12" fill="#2b2b2b" filter="url(#rough2)">6</text>
  <text x="588" y="163" font-size="12" fill="#2b2b2b" filter="url(#rough2)">5</text>
  <text x="588" y="191" font-size="12" fill="#2b2b2b" filter="url(#rough2)">4</text>
  <text x="588" y="219" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">3</text>
  <text x="588" y="247" font-size="12" fill="#2b2b2b" filter="url(#rough2)">2</text>
  <text x="588" y="275" font-size="12" fill="#2b2b2b" filter="url(#rough2)">1</text>
  <text x="652" y="135" font-size="12" fill="#2b2b2b" filter="url(#rough2)">1/1</text>
  <text x="652" y="163" font-size="12" fill="#2b2b2b" filter="url(#rough2)">5/6</text>
  <text x="652" y="191" font-size="12" fill="#2b2b2b" filter="url(#rough2)">2/3</text>
  <text x="652" y="219" font-size="12" font-weight="bold" fill="#2f5223" filter="url(#rough2)">1/2</text>
  <text x="652" y="247" font-size="12" fill="#2b2b2b" filter="url(#rough2)">1/3</text>
  <text x="652" y="275" font-size="12" fill="#2b2b2b" filter="url(#rough2)">1/6</text>

  <!-- 底部公式 -->
  <rect x="26" y="336" width="708" height="82" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="46" y="364" font-size="14" font-weight="bold" fill="#8a6015" filter="url(#rough2)">A = 7 - max(Y, W) ，B = 6 ，再同时除以 g = gcd(A, B)</text>
  <text x="46" y="392" font-size="12" fill="#7a5a1b" filter="url(#rough2)">m = 1 时 A = 6，输出 1/1；m = 6 时 A = 1，输出 1/6；样例 m = 4 时 A = 3，输出 1/2。</text>
</svg>
