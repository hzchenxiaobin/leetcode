<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="507"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="250" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">样例的 10 条指令</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">冲突只可能来自共享质因子</text>
  <text x="90" y="100" text-anchor="start" font-size="12" fill="#4a7a3a" filter="url(#rough2)">+ 6   → Success（2、3 归 6）</text>
  <text x="90" y="130" text-anchor="start" font-size="12" fill="#8a2b28" filter="url(#rough2)">+ 10  → Conflict with 6（共享 2）</text>
  <text x="90" y="160" text-anchor="start" font-size="12" fill="#4a7a3a" filter="url(#rough2)">+ 5   → Success</text>
  <text x="90" y="190" text-anchor="start" font-size="12" fill="#8a2b28" filter="url(#rough2)">- 10  → Already off</text>
  <text x="90" y="220" text-anchor="start" font-size="12" fill="#4a7a3a" filter="url(#rough2)">- 5   → Success   - 6 → Success</text>
  <text x="560" y="120" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">后续：+10 → Success，+3 → Success，</text>
  <text x="560" y="148" text-anchor="start" font-size="11" fill="#8a2b28" filter="url(#rough2)">+6 → Conflict with 10（共享 2）</text>
  <text x="560" y="176" text-anchor="start" font-size="11" fill="#2b2b2b" filter="url(#rough2)">+3 → Already on</text>
</svg>
