<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="57"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="800" height="600" fill="#fafafa"/>

  <text x="400" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2 走查：链 = 一层层严格嵌套的矩形</text>
  <path d="M 160 42 Q 400 48 640 42" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 坐标轴 -->
  <path d="M 56 430 L 566 430" stroke="#666666" stroke-width="1.5" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 60 434 L 60 66" stroke="#666666" stroke-width="1.5" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="572" y="435" font-size="12" fill="#555555" filter="url(#rough2)">宽 w</text>
  <text x="30" y="64" font-size="12" fill="#555555" filter="url(#rough2)">高 h</text>

  <!-- 刻度 -->
  <g filter="url(#rough2)" font-size="10" fill="#777777">
    <text x="60" y="448" text-anchor="middle">0</text>
    <text x="156" y="448" text-anchor="middle">3</text>
    <text x="220" y="448" text-anchor="middle">5</text>
    <text x="348" y="448" text-anchor="middle">9</text>
    <text x="444" y="448" text-anchor="middle">12</text>
    <text x="44" y="338" text-anchor="end">3</text>
    <text x="44" y="306" text-anchor="end">4</text>
    <text x="44" y="178" text-anchor="end">8</text>
    <text x="44" y="82" text-anchor="end">11</text>
  </g>

  <!-- 卡片矩形 -->
  <rect x="60" y="334" width="96" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="66" y="424" font-size="10.5" fill="#2f5223" filter="url(#rough2)">卡片 3×3</text>

  <!-- 三封信封 -->
  <rect x="60" y="302" width="160" height="128" fill="none" stroke="#446688" stroke-width="1.6"
        stroke-dasharray="6 4" filter="url(#rough2)"/>
  <rect x="60" y="174" width="288" height="256" fill="none" stroke="#c98a2b" stroke-width="1.6"
        stroke-dasharray="6 4" filter="url(#rough2)"/>
  <rect x="60" y="78" width="384" height="352" fill="none" stroke="#b85450" stroke-width="1.6"
        stroke-dasharray="6 4" filter="url(#rough2)"/>

  <!-- 角点与标签 -->
  <circle cx="220" cy="302" r="4" fill="#446688" filter="url(#rough2)"/>
  <text x="230" y="298" font-size="11.5" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">#1 (5,4)</text>
  <circle cx="348" cy="174" r="4" fill="#c98a2b" filter="url(#rough2)"/>
  <text x="358" y="170" font-size="11.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">#3 (9,8)</text>
  <circle cx="444" cy="78" r="4" fill="#b85450" filter="url(#rough2)"/>
  <text x="454" y="74" font-size="11.5" font-weight="bold" fill="#8a2b28" filter="url(#rough2)">#2 (12,11)</text>

  <!-- 右上角信息面板 -->
  <rect x="556" y="112" width="222" height="196" rx="12" fill="#fdeeee" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="570" y="138" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">每封信封 = 从原点出发的矩形</text>
  <text x="570" y="162" font-size="11.5" fill="#8a2b28" filter="url(#rough2)">严格包含 ⇔ 宽高都严格更大</text>
  <text x="570" y="192" font-size="11.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">链：#1 → #3 → #2</text>
  <text x="570" y="216" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">链长：3</text>
  <text x="570" y="242" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">输出第一行：3</text>
  <text x="570" y="266" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">输出第二行：1 3 2</text>
  <text x="570" y="292" font-size="10.5" fill="#9a4a47" filter="url(#rough2)">（从最小信封开始列编号）</text>

  <!-- 底部说明 -->
  <text x="36" y="474" font-size="12" fill="#2b2b2b" filter="url(#rough2)">卡片 3×3 必须被最小的信封严格包含：w &gt; 3 且 h &gt; 3，两个维度都要满足。</text>
  <text x="36" y="502" font-size="12" fill="#2f5223" filter="url(#rough2)">于是链就是一层层严格变大的矩形：(5,4) ⊂ (9,8) ⊂ (12,11)。</text>
  <text x="36" y="530" font-size="12" fill="#2b2b2b" filter="url(#rough2)">嵌套要求两个方向同时变大——这是二维偏序，只按宽或只按高排都不够。</text>
  <text x="36" y="558" font-size="12" fill="#8a2b28" filter="url(#rough2)">若两封信封宽相同（或高相同），矩形就不可能严格包含，链里只能留一个。</text>
  <text x="36" y="586" font-size="11.5" fill="#777777" filter="url(#rough2)">坐标是 (宽, 高)，矩形越大表示信封越大；画在一起时“包含”就是“可以相邻”。</text>
</svg>
