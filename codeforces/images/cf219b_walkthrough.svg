<svg xmlns="http://www.w3.org/2000/svg" width="840" height="430" viewBox="0 0 840 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.019" numOctaves="2" seed="217"/>
      <feDisplacementMap in="SourceGraphic" scale="1.7"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#a0522d"/></marker>
  </defs>
  <rect width="840" height="430" fill="#fafafa"/>
  <text x="420" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">样例 2 走查：p = 27191，d = 17</text>
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#666666" filter="url(#rough2)">合法区间 [27174, 27191]；分别看 t = 1 与 t = 2 的最大候选</text>
  <g filter="url(#rough2)"><line x1="90" y1="150" x2="760" y2="150" stroke="#999999" stroke-width="1.4" marker-end="url(#arrb)"/></g>
  <g filter="url(#rough2)"><line x1="120" y1="144" x2="120" y2="156" stroke="#666666" stroke-width="1.2"/></g>
  <text x="120" y="176" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">27099</text>
  <g filter="url(#rough2)"><line x1="300" y1="144" x2="300" y2="156" stroke="#666666" stroke-width="1.2"/></g>
  <text x="300" y="176" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">27174</text>
  <g filter="url(#rough2)"><line x1="470" y1="144" x2="470" y2="156" stroke="#666666" stroke-width="1.2"/></g>
  <text x="470" y="176" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">27189</text>
  <g filter="url(#rough2)"><line x1="650" y1="144" x2="650" y2="156" stroke="#666666" stroke-width="1.2"/></g>
  <text x="650" y="176" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">27191</text>
  <g filter="url(#rough2)"><rect x="300" y="128" width="350" height="44" rx="4" fill="#d7ecd0" fill-opacity="0.45" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="475" y="122" text-anchor="middle" font-size="11.5" fill="#3d6b2f" filter="url(#rough2)">降价范围 [27174, 27191]</text>
  <g filter="url(#rough2)"><circle cx="120" cy="150" r="7" fill="#f6d9d7" fill-opacity="0.9" stroke="#a0522d" stroke-width="1.6"/></g>
  <text x="120" y="210" text-anchor="middle" font-size="11.5" fill="#a0522d" filter="url(#rough2)">t = 2 的 c₂</text>
  <g filter="url(#rough2)"><circle cx="470" cy="150" r="7" fill="#d7ecd0" fill-opacity="0.9" stroke="#4a7a3a" stroke-width="1.6"/></g>
  <text x="470" y="210" text-anchor="middle" font-size="11.5" fill="#3d6b2f" filter="url(#rough2)">t = 1 的 c₁</text>
  <text x="420" y="250" text-anchor="middle" font-size="12.5" fill="#3d6b2f" filter="url(#rough2)">c₁ = ⌊27192/10⌋·10 − 1 = 27189，降价 2 ≤ 17 ✓ 末尾 1 个 9</text>
  <text x="420" y="278" text-anchor="middle" font-size="12.5" fill="#a0522d" filter="url(#rough2)">c₂ = ⌊27192/100⌋·100 − 1 = 27099，降价 92 &gt; 17 ✗ 整类不可行</text>
  <text x="420" y="306" text-anchor="middle" font-size="12" fill="#555555" filter="url(#rough2)">p = 27191 本身末尾 0 个 9，不如 c₁</text>
  <g filter="url(#rough2)"><rect x="250" y="330" width="340" height="54" rx="4" fill="#faf3ec" fill-opacity="0.85" stroke="#c8a48a" stroke-width="1.3"/></g>
  <text x="420" y="354" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">最优：27189（1 个 9，价格最大）</text>
  <text x="420" y="374" text-anchor="middle" font-size="11" fill="#777777" filter="url(#rough2)">与官方输出一致</text>
</svg>
