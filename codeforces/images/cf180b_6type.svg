<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="67"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="430" fill="#fafafa"/>
  <text x="360" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">6 类规则：把 66 拆成 2 × 3 × 11</text>
  <path d="M 130 46 Q 360 53 590 46" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="360.0" y="88.0" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">b = 10，d = 66</text>
  <text x="360.0" y="138.0" text-anchor="middle" font-size="16" fill="#6b4c9a" font-weight="bold" filter="url(#rough2)">66 = 2 × 3 × 11</text>
  <line x1="360.0" y1="148.0" x2="120.0" y2="196.0" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="20.0" y="198.0" width="200.0" height="60.0" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="120.0" y="220.0" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">2 | 10</text>
  <text x="120.0" y="242.0" text-anchor="middle" font-size="9.8" fill="#555" filter="url(#rough2)">看最后 1 位是否为偶数</text>
  <line x1="360.0" y1="148.0" x2="360.0" y2="196.0" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="260.0" y="198.0" width="200.0" height="60.0" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="360.0" y="220.0" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3 | 10-1</text>
  <text x="360.0" y="242.0" text-anchor="middle" font-size="9.8" fill="#555" filter="url(#rough2)">各位数字和能否被 3 整除</text>
  <line x1="360.0" y1="148.0" x2="600.0" y2="196.0" stroke="#8a6015" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="500.0" y="198.0" width="200.0" height="60.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="600.0" y="220.0" text-anchor="middle" font-size="13" fill="#8a6015" font-weight="bold" filter="url(#rough2)">11 | 10+1</text>
  <text x="600.0" y="242.0" text-anchor="middle" font-size="9.8" fill="#555" filter="url(#rough2)">奇偶位数字和之差能否被 11 整除</text>
  <rect x="40.0" y="286.0" width="640.0" height="60.0" fill="#f3e8fd" stroke="#6b4c9a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="54.0" y="310.0" text-anchor="start" font-size="12" fill="#3f3420" filter="url(#rough2)">三个因子两两互质 ⟹ d | N 当且仅当三个规则同时成立</text>
  <rect x="40.0" y="358.0" width="640.0" height="46.0" fill="#fff8e1" stroke="#8a6015" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="54.0" y="381.5" text-anchor="start" font-size="11.5" fill="#3f3420" filter="url(#rough2)">若因子不互质，组合起来就不是等价规则，所以必须两两互质</text>
</svg>
