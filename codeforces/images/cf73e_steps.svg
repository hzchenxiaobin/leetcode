<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>

  <rect width="720" height="360" fill="#fafafa"/>
  <text x="360" y="30" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">页数 ceil(N/a) 只在 a 的倍数处跳变</text>
  <path d="M 110 40 Q 360 46 610 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 表头 -->
  <text x="60" y="78" font-size="12" fill="#555" filter="url(#rough2)">N</text>
  <g font-size="12.5" text-anchor="middle" fill="#2b2b2b" filter="url(#rough2)">
    <text x="130" y="78">2</text><text x="190" y="78">3</text><text x="250" y="78">4</text>
    <text x="310" y="78">5</text><text x="370" y="78">6</text><text x="430" y="78">7</text>
    <text x="490" y="78">8</text><text x="550" y="78">9</text><text x="610" y="78">10</text>
  </g>

  <!-- a=2 行 -->
  <text x="60" y="128" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">a = 2</text>
  <g filter="url(#rough2)">
    <rect x="100" y="108" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="160" y="108" width="60" height="30" fill="#ffffff" stroke="#999" stroke-width="1.1"/>
    <rect x="220" y="108" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="280" y="108" width="60" height="30" fill="#ffffff" stroke="#999" stroke-width="1.1"/>
    <rect x="340" y="108" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="400" y="108" width="60" height="30" fill="#ffffff" stroke="#999" stroke-width="1.1"/>
    <rect x="460" y="108" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="520" y="108" width="60" height="30" fill="#ffffff" stroke="#999" stroke-width="1.1"/>
    <rect x="580" y="108" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <g font-size="13" text-anchor="middle" font-weight="bold" fill="#2f4a66" filter="url(#rough2)">
    <text x="130" y="129">1</text><text x="190" y="129">2</text><text x="250" y="129">2</text>
    <text x="310" y="129">3</text><text x="370" y="129">3</text><text x="430" y="129">4</text>
    <text x="490" y="129">4</text><text x="550" y="129">5</text><text x="610" y="129">5</text>
  </g>

  <!-- a=3 行 -->
  <text x="60" y="186" font-size="12.5" fill="#2f5223" filter="url(#rough2)">a = 3</text>
  <g filter="url(#rough2)">
    <rect x="100" y="166" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="160" y="166" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="220" y="166" width="60" height="30" fill="#ffffff" stroke="#999" stroke-width="1.1"/>
    <rect x="280" y="166" width="60" height="30" fill="#ffffff" stroke="#999" stroke-width="1.1"/>
    <rect x="340" y="166" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="400" y="166" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/>
    <rect x="460" y="166" width="60" height="30" fill="#ffffff" stroke="#999" stroke-width="1.1"/>
    <rect x="520" y="166" width="60" height="30" fill="#ffffff" stroke="#999" stroke-width="1.1"/>
    <rect x="580" y="166" width="60" height="30" fill="#ffffff" stroke="#999" stroke-width="1.1"/>
  </g>
  <g font-size="13" text-anchor="middle" font-weight="bold" fill="#2f5223" filter="url(#rough2)">
    <text x="130" y="187">1</text><text x="190" y="187">1</text><text x="250" y="187">2</text>
    <text x="310" y="187">2</text><text x="370" y="187">2</text><text x="430" y="187">3</text>
    <text x="490" y="187">3</text><text x="550" y="187">3</text><text x="610" y="187">4</text>
  </g>

  <!-- 标注 -->
  <text x="60" y="228" font-size="12" fill="#8a2b28" filter="url(#rough2)">蓝格：N 是 2 的倍数 ⇒ a=2 在这一格跳变；绿格同理（3 的倍数）</text>
  <text x="60" y="250" font-size="12" fill="#5a3a6a" filter="url(#rough2)">所以 a 只能区分"跨过 a 的某个倍数"的两个 N；相邻的 (N, N+1) 被区分 ⟺ a | N</text>

  <rect x="60" y="272" width="600" height="66" rx="10" fill="#f4f0fa" stroke="#7a4a8a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="76" y="294" font-size="12.5" font-weight="bold" fill="#5a3a6a" filter="url(#rough2)">于是"唯一确定 N" ⟺ 每个 N ∈ [2, x−1] 都有某个选中的 a 整除它</text>
  <text x="76" y="314" font-size="11.5" fill="#5a3a6a" filter="url(#rough2)">相邻对足够：若 N 与 N+1 可分，则任意 N &lt; N' 也可分（中间必有一个被覆盖）</text>
  <text x="76" y="332" font-size="11.5" fill="#5a3a6a" filter="url(#rough2)">这一步把 O(x²) 个"两两可分"压缩成 x−1 个覆盖条件</text>
</svg>
