<svg xmlns="http://www.w3.org/2000/svg" width="660" height="424" viewBox="0 0 660 424" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="r" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="41" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
  </defs>
  <rect width="660" height="424" fill="#fafafa"/>

  <text x="330" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#r)">n = 6 演算：120 + 12 + 3 = 135（与官方第 3 组输出一致）</text>
  <text x="330" y="50" text-anchor="middle" font-size="12.5" fill="#888" filter="url(#r)">n=6 的奇数无平方因子数只有 q = 3 与 q = 5</text>

  <!-- table header -->
  <g font-size="12" fill="#777">
    <text x="76" y="80" filter="url(#r)">d</text>
    <text x="170" y="80" filter="url(#r)">|A_d| 的计算</text>
    <text x="470" y="80" filter="url(#r)">本项贡献</text>
  </g>

  <!-- rows -->
  <g filter="url(#r)">
    <rect x="52" y="90" width="556" height="38" rx="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="52" y="136" width="556" height="38" rx="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="52" y="182" width="556" height="38" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <g font-size="12.5" fill="#333">
    <text x="76" y="114" filter="url(#r)">2</text>
    <text x="170" y="114" filter="url(#r)">f(2) = 6!/(6−3)! = 720/6 = 120</text>
    <text x="470" y="114" fill="#33517a" filter="url(#r)">+120</text>
    <text x="76" y="160" filter="url(#r)">q=3</text>
    <text x="170" y="160" filter="url(#r)">f(3) = 30，f(6) = 6·3¹ = 18</text>
    <text x="470" y="160" fill="#2e6e2e" filter="url(#r)">+(30−18) = +12</text>
    <text x="76" y="206" filter="url(#r)">q=5</text>
    <text x="170" y="206" filter="url(#r)">f(5) = 6!/5! = 6，f(10) = 1·3¹ = 3</text>
    <text x="470" y="206" fill="#a87f2a" filter="url(#r)">+(6−3) = +3</text>
  </g>
  <g filter="url(#r)">
    <rect x="52" y="228" width="556" height="40" rx="7" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="330" y="254" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a3b38" filter="url(#r)">合计 = 120 + 12 + 3 = 135 ✓</text>

  <!-- explanation -->
  <g filter="url(#r)">
    <rect x="52" y="286" width="556" height="118" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g font-size="12.5" fill="#33517a">
    <text x="70" y="310" filter="url(#r)">为什么 f(6) = 18：6 | i 的位置只有第 6 位 → n!/(n−1)! = 6 种插法；</text>
    <text x="70" y="334" filter="url(#r)">q=3 的奇倍数中心只有 3，块 {2,3,4} 有 3 种顺序；5 不是中心 → 6 × 3 = 18。</text>
    <text x="70" y="362" filter="url(#r)">为什么 f(10) = 3：10 &gt; 6，没有隔离位；中心在 5，块 {4,5,6} → 3 种。</text>
    <text x="70" y="386" filter="url(#r)">为什么 f(3) = 30、f(5) = 6：q 只有单个质因子，断点数 cnt 都是 0。</text>
  </g>
</svg>
