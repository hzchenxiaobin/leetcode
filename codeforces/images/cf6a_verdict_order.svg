<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 0 780 440"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="17"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrC" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="780" height="440" fill="#fafafa"/>

  <text x="390" y="36" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b"
        filter="url(#rough2)">四组全部跑完，再按 TRIANGLE → SEGMENT → IMPOSSIBLE 决定输出</text>

  <!-- 左：四组候选 -->
  <text x="132" y="70" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">输入 4 2 1 3 的四组三元组</text>
  <rect x="24" y="84" width="216" height="46" rx="8" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="38" y="113" font-size="12" fill="#8a6015" filter="url(#rough2)">留 4 → 1,2,3：1+2=3 退化</text>
  <rect x="24" y="138" width="216" height="46" rx="8" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="38" y="167" font-size="12" fill="#8a6015" filter="url(#rough2)">留 2 → 1,3,4：1+3=4 退化</text>
  <rect x="24" y="192" width="216" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="38" y="221" font-size="12" fill="#2f5223" filter="url(#rough2)">留 1 → 2,3,4：2+3&gt;4 真三角</text>
  <rect x="24" y="246" width="216" height="46" rx="8" fill="#f4f4f4" stroke="#999999"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="38" y="275" font-size="12" fill="#555" filter="url(#rough2)">留 3 → 1,2,4：1+2&lt;4 拼不成</text>

  <!-- 中间：两个布尔量 -->
  <rect x="310" y="96" width="200" height="62" rx="10" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.7" filter="url(#rough2)"/>
  <text x="410" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f5223"
        filter="url(#rough2)">hasTriangle = true</text>
  <text x="410" y="144" text-anchor="middle" font-size="11" fill="#3c5e2e" filter="url(#rough2)">只要有一组严格大于就置位</text>

  <rect x="310" y="200" width="200" height="62" rx="10" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.7" filter="url(#rough2)"/>
  <text x="410" y="226" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6015"
        filter="url(#rough2)">hasSegment = true</text>
  <text x="410" y="248" text-anchor="middle" font-size="11" fill="#7a5a1b" filter="url(#rough2)">存在取等的组（不立刻返回）</text>

  <path d="M 244 215 L 302 150" stroke="#4a7a3a" stroke-width="1.6" fill="none"
        marker-end="url(#arrC)" filter="url(#rough2)"/>
  <path d="M 244 160 L 302 220" stroke="#d6a040" stroke-width="1.6" fill="none"
        marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 右：输出优先级 -->
  <rect x="572" y="86" width="186" height="58" rx="9" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.8" filter="url(#rough2)"/>
  <text x="665" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f5223"
        filter="url(#rough2)">TRIANGLE</text>
  <text x="665" y="132" text-anchor="middle" font-size="10.5" fill="#3c5e2e" filter="url(#rough2)">第一优先</text>

  <rect x="572" y="162" width="186" height="58" rx="9" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.8" filter="url(#rough2)"/>
  <text x="665" y="188" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6015"
        filter="url(#rough2)">SEGMENT</text>
  <text x="665" y="208" text-anchor="middle" font-size="10.5" fill="#7a5a1b" filter="url(#rough2)">没有真三角时才看</text>

  <rect x="572" y="238" width="186" height="58" rx="9" fill="#fdeef0" stroke="#b85450"
        stroke-width="1.8" filter="url(#rough2)"/>
  <text x="665" y="264" text-anchor="middle" font-size="14" font-weight="bold" fill="#8c3b37"
        filter="url(#rough2)">IMPOSSIBLE</text>
  <text x="665" y="284" text-anchor="middle" font-size="10.5" fill="#8c3b37" filter="url(#rough2)">两者皆无</text>

  <path d="M 516 128 L 564 112" stroke="#4a7a3a" stroke-width="1.7" fill="none"
        marker-end="url(#arrC)" filter="url(#rough2)"/>
  <path d="M 516 232 L 564 190" stroke="#d6a040" stroke-width="1.7" fill="none"
        marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 516 250 L 564 266" stroke="#b85450" stroke-width="1.5" fill="none"
        marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 反例说明 -->
  <rect x="24" y="316" width="734" height="104" rx="10" fill="#fdeef0" stroke="#b85450"
        stroke-width="1.4" filter="url(#rough2)"/>
  <text x="40" y="344" font-size="13" font-weight="bold" fill="#8c3b37" filter="url(#rough2)">反例：3 3 6 6 里退化组和真三角形同时存在</text>
  <text x="40" y="368" font-size="12" fill="#8c3b37" filter="url(#rough2)">(3,3,6)：3+3=6 退化；但 (3,6,6)：3+6=9&gt;6 是真三角形。</text>
  <text x="40" y="390" font-size="12" fill="#8c3b37" filter="url(#rough2)">若「发现退化就 return」，这一组会被错判成 SEGMENT，正确输出是 TRIANGLE。</text>
  <text x="40" y="410" font-size="11.5" fill="#666" filter="url(#rough2)">先把四组都判完，最后统一比较两个布尔量，顺序就不会错。</text>
</svg>
