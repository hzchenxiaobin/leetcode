<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
  </defs>
  <rect width="720" height="380" fill="#fafafa"/>

  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">等比数列 a_i = c·b^(i-1) 的四种形态</text>
  <path d="M 140 44 Q 360 50 580 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 左上 -->
  <rect x="34" y="62" width="318" height="128" rx="8" fill="#eef3f8" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="50" y="86" font-size="13.5" font-weight="bold" fill="#2b4a68" filter="url(#rough2)">① 全零</text>
  <text x="50" y="110" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">0  0  0  0  0</text>
  <text x="50" y="134" font-size="11.5" fill="#33506b" filter="url(#rough2)">c = 0，b 任取：所有项都是 0</text>
  <text x="50" y="154" font-size="11.5" fill="#33506b" filter="url(#rough2)">首项为 0 时只有这一种可能</text>
  <text x="50" y="176" font-size="11.5" fill="#8a6015" filter="url(#rough2)">→ 判据：整段必须全零</text>

  <!-- 右上 -->
  <rect x="368" y="62" width="318" height="128" rx="8" fill="#f4f8ee" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="384" y="86" font-size="13.5" font-weight="bold" fill="#2f5223" filter="url(#rough2)">② 首项非零、公比 b = 0</text>
  <text x="384" y="110" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">7  0  0  0  0</text>
  <text x="384" y="134" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">a₁ = c ≠ 0，a₂ = c·0 = 0</text>
  <text x="384" y="154" font-size="11.5" fill="#3c5e2e" filter="url(#rough2)">0 的更高次幂还是 0</text>
  <text x="384" y="176" font-size="11.5" fill="#8a6015" filter="url(#rough2)">→ 判据：第二项起必须全零</text>

  <!-- 左下 -->
  <rect x="34" y="204" width="318" height="128" rx="8" fill="#fdf0ef" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="50" y="228" font-size="13.5" font-weight="bold" fill="#8c3a37" filter="url(#rough2)">③ 全项非零，公比 b &lt; 0</text>
  <text x="50" y="252" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">3  −6  12  −24  48</text>
  <text x="50" y="276" font-size="11.5" fill="#8c3a37" filter="url(#rough2)">b = −2：符号交替、绝对值翻倍</text>
  <text x="50" y="296" font-size="11.5" fill="#8c3a37" filter="url(#rough2)">相邻两项之比恒为 b</text>
  <text x="50" y="318" font-size="11.5" fill="#8a6015" filter="url(#rough2)">→ 判据：a_i·a₁ = a_(i−1)·a₂</text>

  <!-- 右下 -->
  <rect x="368" y="204" width="318" height="128" rx="8" fill="#fdf6e6" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="384" y="228" font-size="13.5" font-weight="bold" fill="#8a6015" filter="url(#rough2)">④ 全项非零，公比是真分数</text>
  <text x="384" y="252" font-size="15" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">8  4  2  1  1/2</text>
  <text x="384" y="276" font-size="11.5" fill="#8a6015" filter="url(#rough2)">b = 1/2，项可以不是整数</text>
  <text x="384" y="296" font-size="11.5" fill="#8a6015" filter="url(#rough2)">题给数列是整数，故只需交叉相乘</text>
  <text x="384" y="318" font-size="11.5" fill="#b85450" filter="url(#rough2)">→ 不要用 double 算公比</text>

  <text x="360" y="358" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">关键：某处出现 0 就只可能是 ①② 两种；首项非零且第二项非零则整段都不能有 0</text>
</svg>
