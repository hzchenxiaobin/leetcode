<svg xmlns="http://www.w3.org/2000/svg" width="880" height="336" viewBox="0 0 880 336"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="101"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="336" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">反复做"各位数字之和"直到一位数</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">每做一次，位数至少减少到原来的一部分</text>
  <g filter="url(#rough2)"><rect x="110" y="140" width="120" height="56" rx="4" fill="#f6e3c4" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.3"/></g>
  <text x="170" y="178" text-anchor="middle" font-size="20" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">991</text>
  <g filter="url(#rough2)"><path d="M 234 168 L 282 168" fill="none" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrg)"/></g>
  <text x="258" y="204" text-anchor="middle" font-size="12" fill="#3d6b2f" filter="url(#rough2)">+</text>
  <g filter="url(#rough2)"><rect x="290" y="140" width="120" height="56" rx="4" fill="#d7ecd0" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.3"/></g>
  <text x="350" y="178" text-anchor="middle" font-size="20" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">19</text>
  <g filter="url(#rough2)"><path d="M 414 168 L 462 168" fill="none" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrg)"/></g>
  <text x="438" y="204" text-anchor="middle" font-size="12" fill="#3d6b2f" filter="url(#rough2)">+</text>
  <g filter="url(#rough2)"><rect x="470" y="140" width="120" height="56" rx="4" fill="#cfe0f5" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.3"/></g>
  <text x="530" y="178" text-anchor="middle" font-size="20" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">10</text>
  <g filter="url(#rough2)"><path d="M 594 168 L 642 168" fill="none" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrg)"/></g>
  <text x="618" y="204" text-anchor="middle" font-size="12" fill="#3d6b2f" filter="url(#rough2)">+</text>
  <g filter="url(#rough2)"><rect x="650" y="140" width="120" height="56" rx="4" fill="#f6d9d7" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.3"/></g>
  <text x="710" y="178" text-anchor="middle" font-size="20" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="440" y="262" text-anchor="middle" font-size="12.5" fill="#8a2b28" font-weight="bold" filter="url(#rough2)">991 → 19 → 10 → 1：共 3 次</text>
  <text x="440" y="296" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">长度 1 时直接输出 0（已经是一位数，不能施法）</text>
</svg>
