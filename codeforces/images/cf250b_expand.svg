<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="71"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="720" height="300" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">IPv6 补全：每块补到 4 位，:: 展开成若干个 0000</text>
  <rect x="60" y="60" width="600" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  <text x="360" y="84" text-anchor="middle" font-size="11.5" fill="#2f5223">if "::" 出现：左块 + "0000"×(8−左−右) + 右块</text>
  <rect x="60" y="124" width="600" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  <text x="360" y="148" text-anchor="middle" font-size="11.5" fill="#2f4a66">否则：正好 8 块，逐块 zfill(4)</text>
  <rect x="60" y="188" width="600" height="40" rx="8" fill="#fde9d9" stroke="#b4652a" stroke-width="1.5"/>
  <text x="360" y="212" text-anchor="middle" font-size="11.5" fill="#7a4b22">每个块用小写十六进制、恰好 4 位，块之间用 : 分隔</text>
  <text x="60" y="262" text-anchor="start" font-size="11.5" fill="#7a4b22" filter="url(#rough2)">样例：a56f::0124:… → a56f:0000:0000:0124:…；:: → 8 个 0000</text>
</svg>
