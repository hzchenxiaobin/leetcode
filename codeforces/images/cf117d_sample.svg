<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="117"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/></marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="880" height="300" fill="#fafafa"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">n=4 时 b = [1,3,2,4]</text>
  <text x="440" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">样例查询 1 2 2 4 → 1+2 = 3</text>
  <g filter="url(#rough2)"><rect x="200" y="110" width="84" height="52" rx="4" fill="#cfe0f5" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="242" y="142" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="242" y="180" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">i=1</text>
  <g filter="url(#rough2)"><rect x="310" y="110" width="84" height="52" rx="4" fill="#d7ecd0" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="352" y="142" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="352" y="180" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">i=2</text>
  <g filter="url(#rough2)"><rect x="420" y="110" width="84" height="52" rx="4" fill="#f6e3c4" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="462" y="142" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="462" y="180" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">i=3</text>
  <g filter="url(#rough2)"><rect x="530" y="110" width="84" height="52" rx="4" fill="#f6d9d7" fill-opacity="0.6" stroke="#8899aa" stroke-width="1.2"/></g>
  <text x="572" y="142" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="572" y="180" text-anchor="middle" font-size="10" fill="#777777" filter="url(#rough2)">i=4</text>
  <text x="442" y="232" text-anchor="middle" font-size="11.5" fill="#2f4a66" filter="url(#rough2)">[1,2,3,4] → 偶数位 [1,3] 在前、奇数位 [2,4] 在后</text>
  <text x="442" y="264" text-anchor="middle" font-size="12" fill="#3d6b2f" font-weight="bold" filter="url(#rough2)">所以 b=[1,3,2,4]</text>
</svg>
