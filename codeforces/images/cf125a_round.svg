<svg xmlns="http://www.w3.org/2000/svg" width="884" height="340" viewBox="0 0 884 340"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="125"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/></marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/></marker>
  </defs>
  <rect width="884" height="340" fill="#fafafa"/>
  <text x="442" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">先四舍五入到英寸，再拆成英尺+英寸</text>
  <text x="442" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">1 英尺 = 12 英寸，1 英寸 = 3 厘米</text>
  <text x="442" y="96" text-anchor="middle" font-size="14" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">inches = floor((2n + 3) / 6)</text>
  <text x="442" y="124" text-anchor="middle" font-size="12.5" fill="#2f4a66" filter="url(#rough2)">feet = inches / 12，rem = inches % 12</text>
  <g filter="url(#rough2)"><rect x="110" y="150" width="660" height="54" rx="4" fill="#d7ecd0" fill-opacity="0.45" stroke="#6a9a58" stroke-width="1.3"/></g>
  <text x="442" y="174" text-anchor="middle" font-size="11.5" fill="#3d6b2f" filter="url(#rough2)">n=1 → 0 英寸；n=2 → 1 英寸（2/3 向上舍入）</text>
  <text x="442" y="192" text-anchor="middle" font-size="11.5" fill="#3d6b2f" filter="url(#rough2)">n=42 → 14 英寸 = 1 英尺 2 英寸</text>
  <text x="442" y="246" text-anchor="middle" font-size="12" fill="#2f4a66" filter="url(#rough2)">题目要求英尺数最大 ⇒ 英寸先尽量凑满 12</text>
  <text x="442" y="286" text-anchor="middle" font-size="11.5" fill="#555555" filter="url(#rough2)">n ≤ 10000，O(1)</text>
</svg>
