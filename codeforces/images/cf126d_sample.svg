<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400"
     font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="33"/>
      <feDisplacementMap in="SourceGraphic" scale="1.6"/>
    </filter>
    <marker id="arr126d3" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="760" height="400" fill="#fafafa"/>

  <text x="380" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#rough2)">两个官方样例：13 有 3 种、16 有 4 种</text>
  <path d="M 200 44 Q 380 52 560 44" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- 左侧 13 -->
  <g filter="url(#rough2)">
    <rect x="40" y="64" width="330" height="290" rx="10" fill="#ffffff" stroke="#446688" stroke-width="1.4"/>
    <text x="205" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f4a66">13 = F6（Zeckendorf 表示）</text>
  </g>
  <g filter="url(#rough2)" font-size="14">
    <text x="66" y="128" fill="#2b2b2b">① 13</text>
    <text x="66" y="162" fill="#2b2b2b">② 8 + 5</text>
    <text x="66" y="196" fill="#2b2b2b">③ 8 + 3 + 2</text>
    <text x="66" y="232" font-size="12.5" fill="#555">F6 → F5+F4；再把 F4 拆成 F3+F2，</text>
    <text x="66" y="252" font-size="12.5" fill="#555">F2 已到底，所以链条只有 3 个成员。</text>
    <rect x="66" y="272" width="88" height="30" rx="6" fill="#e9f5e6" stroke="#4a7a3a" stroke-width="1.3"/>
    <text x="110" y="292" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f5223">答案 3</text>
    <text x="170" y="292" font-size="12.5" fill="#3c5e2e">= floor((6+1)/2)</text>
  </g>

  <!-- 右侧 16 -->
  <g filter="url(#rough2)">
    <rect x="392" y="64" width="330" height="290" rx="10" fill="#ffffff" stroke="#b85450" stroke-width="1.4"/>
    <text x="557" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#8b3a37">16 = F6 + F3</text>
  </g>
  <g filter="url(#rough2)" font-size="14">
    <text x="418" y="128" fill="#2b2b2b">① 13 + 3</text>
    <text x="418" y="156" fill="#2b2b2b">② 13 + 2 + 1</text>
    <text x="418" y="184" fill="#2b2b2b">③ 8 + 5 + 3</text>
    <text x="418" y="212" fill="#2b2b2b">④ 8 + 5 + 2 + 1</text>
    <text x="418" y="246" font-size="12.5" fill="#555">高位 F6、低位 F3 各选“原样”或“拆开”，</text>
    <text x="418" y="266" font-size="12.5" fill="#555">2 × 2 = 4 种，两条链互不干扰。</text>
    <rect x="418" y="286" width="88" height="30" rx="6" fill="#fdecea" stroke="#b85450" stroke-width="1.3"/>
    <text x="462" y="306" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8b3a37">答案 4</text>
  </g>

  <text x="380" y="380" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">样例输出恰为 3 与 4：13 → 3，16 → 4，与题面列举完全一致。</text>
</svg>
