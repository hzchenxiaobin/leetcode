<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="637"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/></marker>
  </defs>
  <rect width="900" height="300" fill="#fafafa"/>
  <text x="450.0" y="34" text-anchor="middle" font-size="19" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">每色取最大的若干块，两色交替</text>
  <text x="450.0" y="58" text-anchor="middle" font-size="12" fill="#777777" filter="url(#rough2)">块数少的用尽，块数多的可多出一块</text>
  <text x="90" y="100" text-anchor="start" font-size="12" fill="#446688" filter="url(#rough2)">色 A：[9, 7, 2]</text>
  <text x="90" y="132" text-anchor="start" font-size="12" fill="#4a7a3a" filter="url(#rough2)">色 B：[8, 5]</text>
  <text x="90" y="172" text-anchor="start" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">各取 2 块：A 9+7, B 8+5 ⇒ 29</text>
  <text x="90" y="200" text-anchor="start" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">B 只有 2 块，A 多一块 2 ⇒ 2·2+1 块 ⇒ 31</text>
  <g filter="url(#rough2)"><rect x="560" y="96" width="300" height="100" rx="6" fill="#dcecd2" fill-opacity="0.4" stroke="#4a7a3a" stroke-width="1.4"/></g>
  <text x="710" y="126" text-anchor="middle" font-size="11.5" fill="#2b2b2b" font-weight="bold" filter="url(#rough2)">高度 = P_A[a] + P_B[a]</text>
  <text x="710" y="154" text-anchor="middle" font-size="11.5" fill="#2b2b2b" filter="url(#rough2)">　　　+ (b&gt;a ? s_B[a+1] : 0)</text>
  <text x="710" y="180" text-anchor="middle" font-size="10.5" fill="#666666" filter="url(#rough2)">a ≤ b，P 为降序前缀和</text>
  <text x="450" y="246" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">枚举所有 (色, k) 组合，分桶后每组取前两名</text>
</svg>
